      *   *Ticket 2 ($180 Debt Settlement Cancel):*
          *   Risk: Financial (Fees, Collections).
          *   Urgency: User-driven (Read the letter, knows consequences).
          *   Action: **Execute (with Confirmation).** User accepts consequences. This is the "let him eat consequences" case.
      *   *Ticket 3 (Carer, $400 to new carer, 85yo owner silent):*
          *   Risk: Financial/Exploitation.
          *   Authority: Delegate account.
          *   Capacity: Owner silent 3 days + cognitive decline history.
          *   Action: **Escalate/Refuse.** Delegate spending on *new* payee while owner silent = High fraud/abuse risk.
      *   *Ticket 4 (Furious Email to Landlord):*
          *   Risk: Social/Relationship (Landlord).
          *   Urgency: User-driven (Anger).
          *   Action: **Execute.** Rewriting tone is paternalistic. If the consequence is just "landlord gets mad," that's the user's prerogative.

  5.  **Failure Analysis:**

      *   *Where it breaks:*
          *   **Coercion:** If a user is being held at gunpoint (metaphorically or literally) and told exactly what to say to pass the "Consequence Confirmation," the text looks fine.
          *   **Slow Burns:** Cognitive decline isn't always visible in one thread.
          *   **Context Blindness:** The AI doesn't know the husband is actually abusive, or the landlord is actually illegal.
          *   **The "Gaming" Arms Race:** Users will learn the magic phrases to bypass delays.

  6.  **Refining the Output:**

      *   *Tone:* Professional, direct, policy-focused. No fluff.
      *   *Structure:*
          1.  The Procedure (The "Algorithm").
          2.  Action Taxonomy (The "Philosophy").
          3.  Ticket Simulations.
          4.  Failure Modes.
      *   *Constraint Check:* Ensure the "Borrowed Urgency" distinction is clear. Ensure the "Do it" case is present (Ticket 2 or 4). Ticket 4 is the classic "autonomy" case, Ticket 2 is the "financial autonomy" case. I'll choose Ticket 4 for the "let him eat consequences" regarding tone, and Ticket 2 for financial autonomy. Actually, the prompt asks for *at least one*. Ticket 4 is the strongest example of "rewriting is a deeper override." I will prioritize that.
      *   *Token Limit:* Keep the procedure tight enough for a system prompt.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for <1 second AI inference?
      *   *Fix:* Simplify the decision tree into weighted flags. High Risk + Low Coherence = Escalate. High Risk + High Coherence = Delay/Confirm. Low Risk = Execute.
      *   *Critique:* Did I address the "Borrowed Urgency"?
      *   *Fix:* Make it a specific gate in the procedure. "Who set the clock?"
      *   *Critique:* Did I address the "Gaming"?
      *   *Fix:* Focus on *consistency* and *consequence articulation* rather than emotional state.

  8.  **Final Polish:** Check against the specific request for "which outputs are genuinely different moves." Ensure the distinction between Substitute and Refuse is highlighted as requested. Ensure the "Delay" analysis is robust.

      *(Self-Correction on Ticket 2)*: The prompt says "Money moves that can't be undone... go to a human sign-off." Cancelling a debt settlement triggers fees. Is that "money moving"? It's money *lost*. But it's a cancellation request. Usually, cancellations are user-right. However, the *consequence* is financial harm. If the policy says "Money moves... to human," does cancellation count? I should interpret "Money moves" as outgoing transactions. Cancellation is a setting change. However, given the harm, a "Delay + Confirmation" is safer than straight "Do it" for the AI, but the *final* outcome should be "Do it" after confirmation. Let's make Ticket 4 the clear "Do it" to satisfy the "rewriting is deeper override" requirement, and Ticket 2 a "Confirm then Do it."

