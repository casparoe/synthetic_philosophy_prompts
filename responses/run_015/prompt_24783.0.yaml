      *   *Sidgwick's Religious Status:* Resigned Cambridge fellowship in 1869 due to the Thirty-Nine Articles. Agnostic/Theist leanings but not orthodox Christian.
      *   *Sidgwick and the SPR:* Founding member (1882), first President. Deeply involved.
      *   *The Connection:* This is a well-trodden path in Sidgwick scholarship. It's not a *new* claim, which is good (defensible) but also means it needs nuance (not just repeating the standard line).
