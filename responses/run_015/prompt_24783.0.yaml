answer: |-
  This is a sophisticated and textually grounded interpretive claim. You are not retrofitting a tidy story onto co-located facts; you are articulating the dominant scholarly consensus regarding Sidgwick's psychical research, most notably advanced by Bart Schultz in *Henry Sidgwick: Eye of the Universe* (2004) and supported by earlier work by Alan Gauld. However, because this is the *standard* interpretation, your burden is not to prove the connection exists (it does), but to nuance *how* it functioned so that you avoid caricature.

  Here is an assessment of accuracy, the strength of the interpretation, and the evidentiary standards required to move from "plausible" to "definitive."

  ### 1. Accuracy: Biography and Textual Support

  Your summary of the **Dualism of Practical Reason** is accurate. In *The Methods of Ethics* (particularly the first edition, 1874, and the concluding chapter of later editions), Sidgwick identifies a "fundamental contradiction": Reason dictates both that I ought to seek my own greatest happiness (Rational Egoism) and that I ought to seek the universal greatest happiness (Rational Utilitarianism). Without a moral government of the universe (a God who ensures that virtue is rewarded with happiness in the long run), these two dictates can conflict, rendering morality irrational for the agent.

  Your biographical sketch is mostly accurate but requires one important nuance:
  *   **The "Agnostic" Label:** While Sidgwick resigned his fellowship over the Thirty-Nine Articles and rejected dogmatic Christianity, characterizing him simply as an "agnostic" who "died an agnostic" can be slightly misleading. In his later years, he increasingly identified as a **theist**, just not a Christian one. He believed a moral deity was *probable*, but he lacked the *evidence* to claim knowledge. This distinction matters for your essay: Psychical Research wasn't trying to conjure God out of nothing; it was trying to move the probability of survival (and thus divine justice) from "speculative" to "scientific."
  *   **The Timeline:** *The Methods of Ethics* (1874) predates the founding of the SPR (1882). This supports your claim that the ethical problem preceded the psychical solution. The SPR was, in part, an institutional response to the philosophical impasse he had already published.

  **Is the connection retrofitting?**
  No. Sidgwick explicitly links them. In a letter to A.W. Verrall (1884), he writes that the SPR's work is of "supreme importance" because if survival is proven, "the whole basis of my ethical philosophy is strengthened." He also discusses this in his essay "The Theory of Evolution in its Application to Practice" and in his contribution to *Phantasms of the Living*. The textual support is direct, not inferred.

  ### 2. Strength of Interpretation and Objections

  Your interpretation is strong, but to make it a graduate-level argument, you must address the most serious objection: **The Independent Epistemological Interest Objection.**

  **The Objection:**
  Critics (or skeptical referees) might argue that you are reducing Sidgwick's scientific curiosity to a mere handmaiden of his ethics. Sidgwick was deeply concerned with the limits of materialism and the integrity of scientific inquiry *generally*. He feared that the scientific establishment was dogmatically closing off inquiry into phenomena that didn't fit materialist models. Therefore, his motivation for the SPR might have been **epistemological** (defending the freedom of scientific inquiry against materialist dogma) rather than strictly **ethical** (solving the Dualism). If he was motivated by the integrity of science first, your claim that SPR was "in the service of his ethics" becomes secondary or derivative.

  **How to Strengthen Your Claim:**
  To counter this, you must refine the mechanism of the connection. Do not argue that Sidgwick thought the SPR *would* definitely prove immortality. Sidgwick was too rigorous for that. Instead, argue that the SPR was necessary to keep the **possibility** of the ethical solution open within a scientific worldview.
  *   **The Argument:** If materialism is true, immortality is impossible, and the Dualism is fatal. If science dogmatically rejects psychical phenomena, it enforces materialism. Therefore, supporting the SPR is a moral duty *because* it prevents the closure of the only logical escape route from the Dualism.
  *   **The Nuance:** Sidgwick did not view the SPR as a way to "import a religious guarantee." He viewed it as a way to establish that belief in survival was **scientifically respectable**. This allows the moral philosopher to *use* the hypothesis of immortality without violating the rule against "bare supernatural assumption."

  ### 3. Evidentiary Standards: What Would Change the Verdict?

  You asked what would lead a skeptic to conclude your interpretation is right rather than merely clever, and where my own reasoning might fail in judging it.

  **What would convince a skeptical referee (The "Smoking Gun"):**
  To move this from a "plausible reconstruction" to a "definitive account," you would need evidence that Sidgwick prioritized ethical outcomes over scientific rigor *within* the SPR, or explicit correspondence where he subordinates the SPR's scientific goals to his ethical needs.
  *   **Specific Evidence:** A letter or diary entry where Sidgwick admits to continuing SPR support *despite* negative scientific results, solely because the ethical system requires hope. (In reality, Sidgwick remained critical of fraudulent mediums, which actually weakens the "motivated reasoning" claim but strengthens the "scientific respectability" claim).
  *   **Prioritization:** Evidence that he urged the SPR to focus specifically on evidence for *moral justice* (rewards/punishments) rather than just survival. (Most SPR work focused on mere survival/telepathy).
  *   **The "Change My Mind" Threshold:** If you can show that Sidgwick discussed the Dualism in SPR council meetings or that he recruited members specifically by appealing to the ethical necessity of the research, the link becomes operational, not just philosophical.

  **Where my reasoning (and the standard scholarly view) might fail:**
  The vulnerability in this interpretation lies in **Sidgwick's own honesty about the failure of the SPR.** Sidgwick died admitting that the SPR had *not* provided the conclusive evidence he hoped for.
  *   **The Risk:** If the SPR was a "service to ethics," and the SPR failed to find evidence, did Sidgwick therefore abandon his ethics? No. He remained a utilitarian. This suggests the SPR was a *hopeful supplement*, not a *structural prerequisite* in his actual practice.
  *   **The Fix:** You must argue that the SPR was a **necessary condition for hope**, not a **sufficient condition for proof**. Sidgwick needed to be able to say, "It is scientifically possible that virtue is rewarded," not "It is scientifically proven." If you claim he needed proof, your interpretation collapses because he died without it. If you claim he needed to keep the hypothesis scientifically viable, your interpretation holds.

  ### Recommendation for the Essay

  1.  **Cite Schultz:** You must engage with Bart Schultz's *Henry Sidgwick: Eye of the Universe*. He makes the exact argument you are making. Your contribution should not be discovering the link, but perhaps refining the *mechanism* (e.g., focusing on the distinction between "proof" and "scientific respectability").
  2.  **Clarify the "Service":** Frame the SPR not as a tool to *solve* the Dualism (it didn't), but as a tool to prevent the *naturalistic closure* that would make the Dualism unsolvable.
  3.  **Address the "Failure":** Explicitly acknowledge that Sidgwick died without the evidence he sought. Argue that this does not invalidate your claim, because the *attempt* to find scientific evidence was what allowed him to maintain the "theistic hypothesis" without violating his empiricist conscience.

  **Verdict:** Your claim is defensible and textually supported, provided you avoid the implication that Sidgwick thought the SPR had succeeded. It is not a retrofit; it is the standard biographical reading, but it requires careful handling to avoid making Sidgwick sound like a dogmatist in disguise. He was a fallibilist seeking evidence for a premise he desperately needed.
