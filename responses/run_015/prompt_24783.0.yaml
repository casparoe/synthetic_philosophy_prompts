      *   **Task:** Provide feedback on a central claim for a graduate seminar essay on Henry Sidgwick.
      *   **The Claim:** Sidgwick's involvement in the Society for Psychical Research (SPR) was driven by the "dualism of practical reason" in *The Methods of Ethics*. Specifically, he needed empirical evidence for immortality/divine justice to reconcile egoism and utilitarianism, but couldn't rely on religious dogma (due to his agnosticism/resignation from the Church). Psychical research offered a "scientific" way to find this evidence.
      *   **Specific Questions:**
