          *   Logic: The statement "All things are empty" is itself a dependently arisen phenomenon (a sound, a concept). It does not claim *svabhāva* for itself. Therefore, it is not self-contradictory to say "This statement is empty." It only contradicts if one assumes statements *must* have *svabhāva* to function. Nāgārjuna denies that assumption.

