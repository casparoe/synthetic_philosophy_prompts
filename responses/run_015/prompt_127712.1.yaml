      *   *Nāgārjuna's Response:* Primarily found in MMK Chapter 24 (Examination of the Four Noble Truths) and the *Vigrahavyāvartanī* (VV).
      *   *Key Concept:* Emptiness is not a *position* (pakṣa); it is the relinquishing of all positions. It is a therapeutic tool, not a metaphysical assertion.
