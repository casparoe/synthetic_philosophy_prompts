answer: |-
  # Q&A Prep Sheet: The Afterlife Conjecture & The Residue
  **Audience:** Local EA/Longtermism Meetup (Engineers, Finance, 1 Philosopher, 1 Climate Policy)
  **Goal:** Defend the normative weight of the "Residue" without getting bogged down in utilitarian calculus.

  ## Part 1: Status of Claims (Settled vs. Contested)
  *Before you step up to the mic, be clear on where you stand on the philosophical map. Do not present contested claims as settled.*

  *   **Reasonably Settled (among relevant philosophers):** Scheffler's *descriptive* claim has traction. Many agree that human psychology and valuation structures *do* depend on a assumption of continuity. It is not controversial to say people *feel* differently about projects if humanity ends tomorrow.
  *   **Genuinely Contested:** The *normative* leap. Scheffler mostly describes how we value; he does not explicitly argue this creates a distinct moral *obligation* that overrides or sits alongside utilitarianism. You are arguing that this psychological fact generates a distinct moral "badness" (the Residue). That is your extension, not his.
  *   **Your Innovation:** The "Surprise Test" and the term "The Residue" are yours. There is no literature supporting this specific heuristic. Own that. If the philosopher presses you, admit it's a thought experiment designed to isolate intuition, not a proven metric.

  ---

  ## Part 2: The Objections (Ordered by Damage Potential)

  ### 1. The "Marginal Impact" Objection (The One You Hope Nobody Asks)
  **Who asks:** The Finance/Quant guys.
  **The Question:** "Okay, let's say the Residue is real. But if extinction happens, the Residue is lost regardless of *how* we try to prevent it. If the Residue is a fixed cost of extinction, it's a constant across all our decision options. In expected value terms, constants drop out of the equation. So why does this change where we donate or work *today*?"
  **Damage:** **Critical.** If true, your talk is philosophically interesting but practically useless for EAs.
  **2-Minute Reply:** "You're right that if we're only comparing 'extinction' vs. 'no extinction,' it's a binary constant. But we aren't. We're comparing *risk reduction strategies*. Some strategies preserve the *conditions* for meaning better than others. A future where survivors are enslaved or culturally lobotomized might avoid extinction but still lose the Residue. My point isn't to change the *target* (avoid extinction), but to robustify the *reason*. If the 'trillions of people' argument fails because the future is small, the Residue argument still holds. It keeps extinction bad even in a 'small future' scenario, preventing moral collapse if longtermist forecasts look grim."
  **Concede:** Concede that it doesn't change the *ranking* of extinction prevention vs. nothing. It changes the *resilience* of the argument.
  **Soft Spot:** You are shifting the goalposts from "maximizing good" to "preserving meaning conditions." EAs might reject that shift.
  **Strength:** **Stronger than it sounds.** It sounds like a knockout, but your rebuttal about "robustness against small futures" is your best shield here.

  ### 2. The "Is-Ought" Objection
  **Who asks:** The Moral Philosopher (if she shows up).
  **The Question:** "Scheffler makes a psychological claim: we *happen* to care about the future. You're making a normative claim: we *should* count this loss as moral badness. Just because we'd feel devastated doesn't mean the devastation is a moral unit. Why isn't this just status quo bias or species narcissism?"
  **Damage:** **High.** Undercuts the philosophical foundation.
  **2-Minute Reply:** "Fair distinction. I'm not arguing that *feelings* constitute morality. I'm arguing that the *structure of valuing* is a precondition for morality itself. If the Afterlife Conjecture is true, our current moral projects (including EA projects) derive their point from that future continuity. It's not that sadness = badness; it's that without the future, the *concept* of 'doing good' loses its anchor. I'm pointing out a dependency, not just a preference."
  **Concede:** Admit you are extending Scheffler normatively. He describes; you are prescribing.
  **Soft Spot:** This is the hardest philosophical hurdle. You are asserting that "meaning conditions" have moral weight independent of welfare.
  **Strength:** **Very Strong Objection.** She knows the literature better than you. Don't bluff.

  ### 3. The "Operationalization" Objection
  **Who asks:** Software Engineers / Quant types.
  **The Question:** "How do we measure the Residue? If we can't put a number on it, how do we weigh it against, say, saving 10,000 lives from malaria? If it's unquantifiable, aren't you just asking us to run on intuition?"
  **Damage:** **Medium-High.** EAs hate unquantifiable variables.
  **2-Minute Reply:** "I'm not asking you to add 'Residue Units' to your spreadsheet. I'm asking for a constraint. Think of it like a veto or a side-constraint rather than a utility function. If an action reduces extinction risk but destroys the cultural conditions for meaning (e.g., totalitarian stability), the Residue argument flags that as a loss, even if QALYs go up. It's a qualitative check on the quantitative model."
  **Concede:** Concede it cannot be precisely quantified.
  **Soft Spot:** EAs generally reject deontological constraints if they lower EV.
  **Strength:** **Moderate.** They won't like it, but they might accept it as a "heuristic" if you frame it as risk management.

  ### 4. The "Misreading Scheffler" Objection
  **Who asks:** The Moral Philosopher.
  **The Question:** "Scheffler talks about our *confidence* in an afterlife, not the afterlife itself. She argues we act *as if* there is a future. If we find out the future is short, she suggests we might just adjust our values, not that a moral catastrophe occurs. Are you attributing a catastrophe to her that she doesn't claim?"
  **Damage:** **Medium-High.** Credibility killer if you're misrepresenting the source material.
  **2-Minute Reply:** "That's a careful reading, and you're right that she focuses on the *confidence* condition. My argument is about what happens when that confidence is *violated*. If the condition for our valuing is removed, the value collapses. I'm using her mechanism to argue for the magnitude of the loss. I'm not claiming she makes this exact normative argument, but that her descriptive work implies it."
  **Concede:** Explicitly state: "I am extending Scheffler, not summarizing her."
  **Soft Spot:** If she says Scheffler explicitly rejects this extension, you have no ground.
  **Strength:** **Strong.** She has read the book; you likely haven't memorized it.

  ### 5. The "Opportunity Cost" Objection
  **Who asks:** The Climate Policy Guy.
  **The Question:** "This sounds like navel-gazing for people who can afford to worry about 'meaning' in 2100. If we focus on this abstract 'Residue,' aren't we distracting from concrete suffering happening now? Isn't this a luxury belief?"
  **Damage:** **Medium.** Resonates with the "presentist" wing of EA.
  **2-Minute Reply:** "It's not a trade-off, it's a foundation. The reason we care about climate policy *now* is partly that we assume there's a world to live in later. If we lose the belief in a future, presentist motivation often collapses into nihilism or hedonism. Protecting the 'afterlife' condition actually strengthens the resolve for near-term work, because it secures the context in which that work matters."
  **Concede:** Acknowledge that near-term suffering is urgent.
  **Soft Spot:** Can sound dismissive of immediate pain.
  **Strength:** **Moderate.** Good rhetorical defense, but hard to prove empirically.

  ### 6. The "Small Future" Counter
  **Who asks:** Longtermist Skeptics.
  **The Question:** "You say this survives if the future is small. But if humanity only lasts 200 more years, isn't the Residue smaller? If there's no galactic civilization, doesn't the 'meaning' of our projects shrink proportionally?"
  **Damage:** **Medium.** Attacks your motivation for the talk.
  **2-Minute Reply:** "No, because the Residue isn't about the *volume* of the future, it's about the *existence* of one. The difference between 'forever' and '200 years' is aggregative (more people). The difference between '200 years' and 'ends tomorrow' is structural. The Residue is about the betrayal of the assumption of continuity. A 200-year future still allows for culture, discovery, and relationships to outlive us. Extinction tomorrow voids that entirely."
  **Concede:** None. This is your core thesis.
  **Soft Spot:** Some might argue meaning *does* scale with time.
  **Strength:** **Strong.** This is your best argument.

  ### 7. The "Surprise Test" Validity
  **Who asks:** Psychologically-minded Engineer.
  **The Question:** "Your 'Surprise Test'—feeling loss if you find out we're the last generation—might just be shock or loss of status. How do you know that feeling is 'meaning collapse' and not just ego? Maybe you just wanted to be part of a big story."
  **Damage:** **Low-Medium.** Attacks your tool, not the thesis.
  **2-Minute Reply:** "It's a heuristic, not a proof. But consider: if it were just ego, we wouldn't care about *what* we leave behind, just that *something* continues. But we care about the *quality* of the future culture. The Surprise Test isolates the dependency: if the future vanishes, does your current work feel pointless? If yes, your work depends on the afterlife. That dependency is what I'm calling the Residue."
  **Concede:** Admit it's subjective.
  **Soft Spot:** Hard to falsify.
  **Strength:** **Weak Objection.** Easy to parry.

  ### 8. The "Utilitarian Co-option"
  **Who asks:** Hardline Utilitarian.
  **The Question:** "Why isn't the Residue just negative utility? If people feel their lives are meaningless, they suffer. So it's just a welfare loss. Why do we need a new category?"
  **Damage:** **Low.** They absorb your point into their framework.
  **2-Minute Reply:** "Because it's not about the *feeling* of meaninglessness, it's about the *fact* of it. Even if everyone is happy right before extinction, the *retrospective* judgment is that their projects were voided. It's a damage to the *truth* of their value, not just their hedonic state. But if you want to call it 'negative utility,' fine, as long as you acknowledge it's a non-aggregative, one-time hit, not a per-person sum."
  **Concede:** You can allow them to label it utility if they accept the non-aggregative nature.
  **Soft Spot:** They might insist on aggregating it anyway.
  **Strength:** **Weak.** You win either way.

  ---

  ## Part 3: The "Really Dangerous" Question
  You guessed the **Marginal Impact (Decision-Irrelevance)** objection is the one you hope nobody asks. **You are right.** That is the most dangerous question *practically*. If you can't show how this changes action, the EA audience will discard it as philosophy porn.

  **However,** the **Is-Ought (Normative Leap)** objection is the most dangerous *philosophically*. If the philosopher successfully argues that "meaning conditions" have no moral weight independent of welfare, your argument collapses at the root.

  **Strategy:**
  *   If the **Philosopher** asks the Is-Ought question: Be humble. Acknowledge the leap. Frame it as "expanding the moral circle to include the conditions of valuing."
  *   If the **Quants** ask the Marginal Impact question: Be robust. Frame it as "insurance against forecast error" (i.e., if the trillions don't show up, we still have a reason to prevent extinction).

  ## Part 4: Final Advice for the Room
  1.  **Don't Fight the Numbers:** Don't tell them numbers don't matter. Tell them numbers *depend* on the Residue to have context.
  2.  **Own the Speculation:** When talking about the Surprise Test or the Residue, use phrases like "I propose," "I suggest," or "My hypothesis is." Do not say "Scheffler proves."
  3.  **The Climate Guy:** Validate him early. "This isn't about ignoring the present; it's about why the present matters."
  4.  **The Philosopher:** If she challenges your reading of Scheffler, yield immediately. "That's a fair correction on her text; my interest is in the implication of the mechanism, not the exegesis." This disarms her skepticism.

  **Good luck. You're introducing a qualitative constraint to a quantitative room. Expect friction, but that's where the value is.**
