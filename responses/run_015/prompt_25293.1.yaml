          *   *Octave (lines 1-8):* Ordinary pain. The sensation and the "badness" are fused. The hurt *is* the badness.
          *   *Volta (line 9):* The shift to the asymbolic patient. "It hurts, but it doesn't bother me."
          *   *Sestet (lines 9-14):* Philosophical implication. The "badness" isn't intrinsic to the sensation; it's a relation/response we bring.
