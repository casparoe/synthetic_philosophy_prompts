  The needle strikes and brings a sudden pain,
  The mind recoils before the thought can dwell.
  The hurt and hate are locked in one domain,
  As if the suff'ring rang inside the bell.
  No quiet zone where feeling simply fell,
  The awfulness is baked within the chain.
  We cannot split the feeling from the hell,
  Nor make the signal speak and not constrain.

  Yet one says, "I feel the sting, I know the place,
  It burns exactly here, devoid of fear.
  The signal moves at its own steady pace,
  But dread is not within the sense we know.
  The hurt is real, yet I shed no tear.
  The badness is the care we bestow."
