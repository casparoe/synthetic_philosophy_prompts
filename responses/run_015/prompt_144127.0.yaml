answer: |-
  This is an exceptionally sharp set of observations. You have effectively identified the three major fault lines in current archaeological discourse: the **temporal threshold** (how fast?), the **ontological unit** (what exactly died?), and the **metric of value** (complexity vs. welfare).

  As a non-specialist, your intuition is outperforming much of the standard literature. You are asking for the "metaphysics of the label," and that is exactly where the inconsistency lies. Here is a reconstruction of the implicit theory your committee is currently operating under, what it rules out, and the trade-offs of changing it.

  ### 1. Archaeological Fact-Check
  Before the philosophy, a quick sanity check on your cases. Your archaeology is robust, but there are two nuances to flag for the labels:
  *   **Post-Roman Britain:** The phrase "reverting to a simpler way of life" is currently contentious. While material complexity (pottery, stone building) did decrease, framing it as "reversion" carries a Victorian "Dark Age" baggage that implies degradation. Current scholarship prefers "relocalization" or "de-complexification." The *household* data you mention is actually debated; some isotope studies suggest diet improved (less grain, more protein) when the tax-collecting state vanished. Your suspicion that ordinary people might have eaten better is archaeologically plausible.
  *   **Classic Maya:** Be careful not to imply the *entire* Maya world collapsed. It was specifically the Southern Lowland political system. The Northern Lowlands flourished during the same period. If the label says "The Maya Collapsed," it is factually incorrect. If it says "The Classic Political System of the Southern Lowlands Collapsed," it is accurate.
  *   **Bronze Age:** The "1200 BC Collapse" is still the dominant paradigm, but recent work (e.g., by Eric Cline or Guy Middleton) emphasizes that it was a "systems collapse" (trade, literacy, palaces) rather than a demographic one. Populations often remained; the *grid* they lived on vanished.

  ### 2. The Implicit Theory of Social Persistence
  Your current labeling practice relies on a theory of **Institutional Essentialism**.

  According to this view, a "society" (or civilization) is not defined by its population, its language, or its genetic continuity. It is defined by its **complex institutions**: the capacity to extract surplus, the ability to erect monumental architecture, the maintenance of writing, and the existence of a centralized hierarchy.

  *   **What is strictly presupposed:** That the *state apparatus* is the essence of the society. If the palace burns and the scribes stop writing, the society has ceased to exist, even if the farmers in the hinterland continue planting the same crops in the same villages for another millennium.
  *   **What is underdetermined:** The criteria for *identity over time*. This is the "Ship of Theseus" problem applied to history. If the dynasty changes but the bureaucracy remains (Rome), is it the same society? If the bureaucracy vanishes but the people remain (Maya), is it a new society? The current labels answer "No" to the first (it's a transition) and "Yes" to the second (it's a collapse), which implies the *structure* matters more than the *people*.

  ### 3. Description vs. Verdict
  You asked if "collapse" is a description of an event or a verdict about a loss. **It is a verdict.**

  Descriptively, the material signature of the end of the Old Kingdom Egypt and the Late Bronze Age is often similar (decreased trade, smaller settlements). The difference in labeling ("unsettled period" vs. "collapse") reveals that the word is doing **normative work**. It encodes a judgment that *complexity is the default good* and *simplification is a failure*.

  *   **The Elite Bias:** You are correct that this measures fate by monuments and taxes. This aligns with what anthropologist James Scott calls the "view from the state." States see their own dissolution as a catastrophe; non-state peoples often view it as liberation. By using "collapse," the museum is adopting the perspective of the tax-collector, not the farmer.
  *   **The Moral Claim:** "Collapse" implies something went *wrong*. "Transformation" implies something just *changed*. If you switch to "transformation," you lose the ability to signal that specific human capacities (literacy, specialized craft, long-distance cooperation) were lost, often traumatically.

  ### 4. Why Rate and Unit-Switching are Necessary (and Dangerous)
  You noted that "collapse" requires speed (2–3 generations) and involves switching units (polity vs. people). These are not bugs; they are features required to keep the **Institutional Essentialist** theory from collapsing under scrutiny.

  *   **Rate Dependence:** If the same institutional loss happens over 300 years, we call it "evolution" or "transition." Why? Because "collapse" implies a *failure of resilience*. It suggests the system was fragile. If the change is slow, it implies adaptation. The label "collapse" is secretly a claim about **systemic stability**, not just the end state.
  *   **Unit Switching:** This is the philosophical weak point. We switch from "polity" to "culture" to "people" to keep the word "collapse" usable.
      *   *Maya:* We say the "polity" collapsed so we don't have to admit the "people" survived.
      *   *Rome:* We say the "world gave way" so we don't have to admit the "state" died.
      *   *Consistency:* The practice *needs* this switching to remain consistent with its own verdict. If we held the unit constant (e.g., "population"), there would be no collapse in the Maya case. If we held the unit constant (e.g., "state"), there would be a collapse in the Rome case. The sliding scale allows the museum to mark "loss of complexity" without being forced into demographic claims that are easily disproven.

  ### 5. What Views Are Ruled Out?
  By using "collapse" in this specific way, your current labels quietly rule out:
  1.  **Demographic Continuity:** The view that a society *is* its people. (Ruled out by the Maya label).
  2.  **Voluntary Simplification:** The view that people might *choose* to abandon cities and writing to escape hierarchy. (Ruled out by the normative weight of "collapse").
  3.  **Reference Class Relativity:** The view that "did the society persist?" has no answer until you specify *which aspect* you care about. The labels pretend there is a fact of the matter ("It collapsed") rather than a choice of focus ("The monarchy ended, the culture continued").

  ### 6. The "Transformation" Trade-Off
  If you adopt "transformation" consistently (e.g., "The Bronze Age Transformation," "The Maya Transformation"), here is what you gain and lose:

  *   **You Gain:** Accuracy regarding population and cultural continuity. You stop implying that people vanished when their kings did. You align better with modern archaeological consensus (which favors continuity models).
  *   **You Lose:**
      1.  **The Capacity to Name Harm:** "Transformation" is neutral. It can sanitize violence. If a city is burned and its inhabitants enslaved, that is a catastrophe for them, even if the region eventually "transforms" into something new. "Collapse" captures the *rupture* and the *suffering* associated with the loss of order (famine, war, loss of specialized care).
      2.  **Responsibility:** "Collapse" invites the question "Why did it fail?" which leads to questions of management, ecology, or hubris. "Transformation" invites "How did it change?" which is more descriptive. If you want visitors to think about the fragility of complex systems (a relevant modern lesson), "collapse" is a stronger pedagogical tool.
      3.  **The Loss of Specific Goods:** We shouldn't romanticize simplicity. The loss of writing, medicine, and coordinated infrastructure *is* a loss of human capability. "Transformation" risks implying all outcomes are equal.

  ### 7. Recommendations for the Committee
  You are right to be worried. The current usage is philosophically inconsistent and archaeologically dated. However, dropping "collapse" entirely might sanitize the history. I suggest a **Specification Strategy**:

  1.  **Stop using "Society" or "Civilization" as the subject of the verb "collapse."**
      *   *Bad:* "The Maya Civilization Collapsed."
      *   *Good:* "The Classic Maya Political System Collapsed." or "Monumental Building Ceased."
      *   *Why:* This fixes the **Unit Switching** problem. It admits that the *institutions* died without implying the *people* did.

  2.  **Use "Collapse" only for Systemic Failure, not Cultural Change.**
      *   Reserve "collapse" for moments where the *infrastructure of daily life* broke down (famine, depopulation, violence), not just when the king stopped building statues. If the farmers ate better, call it "Decentralization" or "Reorganization," not Collapse. This addresses your **Elite Bias** concern.

  3.  **Acknowledge the Perspective.**
      *   It is acceptable for a label to say: "Archaeologists once called this a collapse, focusing on the loss of palaces. We now know that for many villagers, life continued with less taxation and war." This turns the philosophical problem into an educational opportunity.

  4.  **On Rate:**
      *   If the change took 300 years, do not use "collapse." Use "Decline" or "Fragmentation." Save "collapse" for the sharp rupture (e.g., the burning of the palaces in 1190 BC). This respects your intuition that "collapse" is a claim about the *experience* of the event, not just the outcome.

  **Summary:** Your committee is using "collapse" as a shorthand for "Loss of State-Level Complexity." That is a valid concept, but it is currently being smuggled in as "Loss of Society." If you make that distinction explicit in the text, you solve the philosophical inconsistency without losing the dramatic power of the word.
