              *   *Better Interpretation of Prompt:* "Weights then determine whose cards they see next round." Okay, so the weight *causes* the filtering in the next round. The bubble forms *because* of the reweighting.
              *   *Okay, let's lock that in:* I weight you low -> I don't accept your card next round -> I am now in a bubble.
              *   *Ingroup/Outgroup:* I naturally weight Ingroup higher.

  5.  **Refining the Payoff/Feedback Loop:**
      *   Goal: Solve a puzzle.
      *   Feedback: If you only listen to your group, you get half the clues. You feel confident (high agreement within group) but wrong (missing total picture).
      *   Tokens: "Epistemic Trust Tokens" (ETT). You have 3 per round. Give them to people whose sources you trust. You only receive info from people who gave you tokens? No, "determine whose cards they see." So I choose who I listen to based on weights.
