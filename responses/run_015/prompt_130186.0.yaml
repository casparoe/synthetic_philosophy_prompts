      *   Echo Chamber: Discrediting of sources (social/psychological).
      *   This game simulates the *transition* from Bubble to Echo Chamber. You start with access (Bubble open), but reweighting (Echo Chamber mechanism) closes it.
      *   Key discussion: Was it rational to discount the outgroup? (Bayesian updating on reliability).

