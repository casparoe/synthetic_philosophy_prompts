  2.  **Deconstruct the Core Mechanic (Reweighting vs. Filtering):**
      *   *Standard Bubble:* You don't see the other side's info.
      *   *This Game:* You *can* see the other side's info, but you value it less. If you value it less, you might choose not to engage with it in the next round, effectively creating a bubble through *choice* driven by *credibility assessment*.
      *   *Mechanism:* Players need to belong to groups. They need to pass "evidence cards." They need to assign "trust tokens." The amount of trust determines if the card gets passed on or read.
      *   *Refinement:* The prompt says "weights then determine whose cards they see next round." So, high weight = I see your card next round. Low weight = I ignore your card next round. This creates a network effect.

  3.  **Drafting the Game Structure:**
      *   **Name:** "The Weighted Network" or "Credibility Cascades." Let's go with **"The Trust Cascade."**
      *   **Setup:** 10 players. Split into two groups (Group A and Group B). 5 vs 5.
      *   **Materials:** Index cards (Evidence), Poker chips or paper slips (Trust Tokens), Pens.
      *   **Rounds:** 3 or 4 rounds to show the divergence.
      *   **The Twist:** The evidence on the cards is *identical* or *ambiguous*. The only variable is the "Source Tag" (Ingroup vs. Outgroup).
      *   **Scoring:** They need a goal. Maybe "Truth Seeking." They get points for correctly identifying a hidden state of the world. But they can only pool info from people they trust.

