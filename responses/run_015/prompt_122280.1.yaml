answer: |-
  The analogy is pedagogically useful for visualizing causal redundancy but philosophically bankrupt because it equates causal efficacy with moral responsibility, thereby smuggling in the compatibilist conclusion it claims to prove.

  **Correspondence Table**

  | Frankfurt Case | Metabolic Analogy |
  | :--- | :--- |
  | **Jones** (Agent) | **Primary Enzyme** (Catalyst) |
  | **Black** (Intervener) | **Shadow/Backup Pathway** (Redundant Catalyst) |
  | **Action X** (Decision) | **Metabolic Reaction** (Product Formation) |
  | **Intervention** (Force) | **Backup Catalysis** (Alternative Kinetics) |
  | **Moral Responsibility** | **Causal Attribution** |

  **Where the Mapping Breaks**

  1.  **Normativity vs. Causality:** In biochemistry, saying the primary enzyme is "responsible" is shorthand for "causally sufficient." In philosophy, moral responsibility entails blame, praise, and desert. An enzyme cannot be blameworthy, so the analogy bypasses the very feature (normative judgment) that makes the Frankfurt case controversial.
  2.  **Agency vs. Mechanism:** Jones deliberates; enzymes react. Jones's action involves reasons and intentions; the enzyme's action involves substrate affinity and activation energy. The Frankfurt case turns on whether *agency* survives the removal of alternatives. The metabolic case turns on whether *output* survives the removal of alternatives. These are different questions.
  3.  **The Monitoring Condition:** Black monitors Jones's *incipient will* (a sign of choosing otherwise). The shadow enzyme monitors *substrate concentration* or *flux*. The former presupposes a mental state that might be free; the latter presupposes physical determinism. Using the enzyme to explain the mind risks category error.

  **Does the Conclusion Survive?**

  The conclusion—that real alternatives aren't necessary for responsibility—does not follow from this analogy alone; the analogy was carrying the intuitive weight of the argument. By mapping moral responsibility onto causal attribution, the analogy assumes a compatibilist definition of responsibility (where being the actual cause is enough) rather than proving it. An incompatibilist will reject the mapping immediately, arguing that while the enzyme is the *cause*, Jones is not the *source* of his action if he couldn't have done otherwise. The biochemical system validates "causal responsibility without alternatives," but it cannot bridge the gap to "moral responsibility without alternatives" without begging the question.

  **A Better Analogy**

  Use a **Piloted Aircraft with a Remote Override**.

  *   **Jones** is the Pilot.
  *   **Black** is a Ground Control system wired to the autopilot.
  *   **Action X** is flying a specific course.
  *   **Intervention** is Ground Control seizing control if the Pilot deviates.

  **Why it fits better:** This preserves *agency*. The pilot is making choices, not just catalyzing reactions. It highlights the tension between *feeling* free and *being* constrained. However, even this analogy fails to prove the conclusion; it merely isolates the intuition that the pilot deserves credit for landing the plane safely if they flew the whole way manually, regardless of the hidden override. It forces the discussion onto the actual sequence of events (the pilot's flying) rather than smuggling in a biochemical determinism that ignores the normative stakes of blame and praise.
