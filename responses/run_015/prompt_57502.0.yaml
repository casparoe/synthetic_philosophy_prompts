answer: |-
  ### Specification for a Moral-Desert Theory of Karma

  **1. The Distribution Requirement**
  *   **Case:** The infant born with a painful, congenital defect versus the tyrant who dies peacefully in sleep.
  *   **Demand:** The theory must map suffering and prosperity strictly to moral agency, not chance.
  *   **Status:** **Non-negotiable.** Without this, it is not a theory of desert, but of luck.

  **2. The Epistemic Access Requirement**
  *   **Case:** The penitent ascetic suffering calamity who needs to know if this is expiation or new punishment to adjust conduct.
  *   **Demand:** The agent must be able to know, or reasonably infer, the moral balance of their current state to guide future action.
  *   **Status:** **Non-negotiable.** An ethics of praise and blame requires the blameworthy to know they are blameworthy.

  **3. The Identity Requirement**
  *   **Case:** The reincarnated self who retains no memory of the past life incurring the debt.
  *   **Demand:** There must be sufficient psychological continuity between the sinner and the sufferer to justify punishment.
  *   **Status:** **Non-negotiable.** Punishing a distinct psychological entity is vengeance, not justice.

  **4. The Amnesty Constraint**
  *   **Case:** A sincere ritual of repentance that results in the cancellation of karmic debt.
  *   **Demand:** The theory must declare whether debt can be wiped without payment.
  *   **Status:** **Taste of one camp.** Strict desert forbids amnesty (debt must be paid); soteriological/religious camps allow it (grace). If amnesty is permitted, the theory ceases to be pure desert and becomes transactional theology.

  **5. The Mechanism Constraint (Law vs. Judge)**
  *   **Case:** Gyges acts awfully in perfect secrecy, prospers, and dies unrepentant.
  *   **Demand:** Specify if the payout is automatic (law of nature) or adjudicated (cosmic bookkeeping).
  *   **Status:** **Non-negotiable.**
      *   *Law:* Gyges carries the seed of future ruin impersonally; current prosperity is irrelevant lag.
      *   *Judge:* Gyges is judged on intent; current prosperity implies a verdict of "not yet" or "stored credit."
      *   *Verdict:* The Law view protects impartiality but fails immediate justice. The Judge view allows for intent-based nuance but risks arbitrariness.

  ***

  ### The Incompatibility Trilemma

  Your hunch is correct, but the geometry is sharper. You cannot satisfy **(a) Not Blaming the Victim**, **(b) Explaining Undeserved Suffering via Desert**, and **(c) Agent Epistemic Access** simultaneously.

  1.  **To satisfy (b) and (c):** You must admit the infant sinned in a past life. This violates **(a)**. The theory becomes morally repugnant by modern standards (victim-blaming).
  2.  **To satisfy (a) and (b):** You must claim the suffering is desert but the specific sin is unknowable (hidden ledger). This violates **(c)**. The agent cannot use the theory for ethical navigation; it becomes fatalism with a moral label.
  3.  **To satisfy (a) and (c):** You must admit the agent can see they are good yet suffering, therefore the suffering is *not* desert. This violates **(b)**. The theory collapses into random chance or character-building, losing its retributive force.

  **The Killer Constraint:** **Epistemic Access (c).**
  This is the requirement that knocks out the most otherwise attractive theories. Most popular iterations of karma rely on *avidya* (ignorance) or the opacity of past lives to soften the blow of victim-blaming. They posit a ledger that exists (satisfying b) but is hidden from the debtor (sacrificing c) to spare their feelings (attempting a).
  If you enforce Epistemic Access, the Hard Retributive view collapses because no one remembers the crime they are paying for. The Secular view collapses because character does not guarantee outcome in observable time. A desert theory where the agent cannot read their own balance sheet is not an ethics; it is a threat system. Without Access, you cannot run an ethics of praise and blame.

  ***

  ### Scorecard

  **Hard Cross-Lifetime Retributive:** Fails Epistemic Access (ledger is hidden) and Identity (no memory of crime); succeeds on Desert Logic.
  **Secularized Character-Formation:** Fails Distribution (bad things happen to good characters); succeeds on Psychology and Access.
  **Hybrid (Mercy + Law):** Collapses on Mechanism (cannot be both automatic law and adjudicated grace); fails Amnesty Constraint (is it debt or gift?).
