answer: |-
  You are right to be suspicious. The phrase "there is no such thing as the probability of a single event" is a philosophical stopper often used to avoid political or communicative friction. It sounds deep, but it conflates at least five distinct claims ranging from mathematical trivialities to contentious metaphysical assertions.

  Here is the breakdown of what that sentence is actually doing, evaluated by validity and utility.

  ### 1. The Five Hidden Claims

  **A. The Semantic Claim (Frequentism)**
  *   **The Claim:** The word "probability" is *defined* as long-run relative frequency. Therefore, applying it to a non-repeatable token is a category error, like asking "what is the north of this rock?"
  *   **Verdict:** **Defensible but Optional.** This is true *if* you are a strict frequentist. But most working scientists (and certainly Bayesians) define probability as a measure of uncertainty or information, not just frequency. Using this definition to shut down a question is a choice of dialect, not a fact of nature.
  *   **Confidence:** 95%

  **B. The Ontological Claim (Propensities)**
  *   **The Claim:** The world contains frequencies or dispositional properties of *setups*, but single tokens do not possess "chance" as a physical property. A specific flood either happens or it doesn't; there is no "70% flood" hanging in the ether.
  *   **Verdict:** **Live Debate.** This is the core of the philosophy of probability. Propensity theorists (like Popper) argue single-case chances *do* exist (e.g., this specific atom has a 50% chance to decay). Humeans argue they don't. It is not settled science.
  *   **Confidence:** 80%

  **C. The Epistemic Claim (Verification)**
  *   **The Claim:** Even if single-case chances existed, we could never verify them. We cannot run the universe twice to see how often *this* flood happens. Therefore, stating a number is scientifically irresponsible.
  *   **Verdict:** **True but Normatively Weak.** It is true we cannot verify single-case frequencies empirically. However, we verify models by their calibration over *many* single-case predictions. Refusing to speak because verification is hard is a policy choice, not a logical necessity.
  *   **Confidence:** 90%

  **D. The Subjectivity Claim (Bayesianism)**
  *   **The Claim:** Any number assigned to a single event is necessarily a statement about the *speaker's* state of mind (credence), not the world. Therefore, there is no "*the* probability," only "*my* probability."
  *   **Verdict:** **Near-Trivial.** If you accept Bayesianism, this is true by definition. The slogan implies objectivity is impossible for single events. This is a strong claim, but it doesn't prevent giving a number; it just requires qualifying whose uncertainty is being measured.
  *   **Confidence:** 95%

  **E. The Reference Class Problem**
  *   **The Claim:** A single event (this flood) belongs to infinite classes (floods in 2023, floods in this watershed, floods under 400ppm CO2). Each class has a different frequency. Therefore, "the" probability is undefined without specifying the class.
  *   **Verdict:** **True and Devastating.** This is the strongest version of the slogan. It is logically impossible to assign a frequency to a token without selecting a reference class, and there is no non-arbitrary way to select the *unique* correct class.
  *   **Confidence:** 98%

  ---

  ### 2. Did it License the Modeller's Refusal?

  **Short Answer:** Technically yes, but practically no.

  **The Nuance:**
  The reporter asked: *"How likely is it that **this** flood was caused by climate change?"*
  This asks for the **Probability of Causation (PN)** for a specific token event.
  The modeller publishes **Risk Ratios (RR)** for classes of events (e.g., "Floods of this magnitude are 5x more likely").

  To move from RR to PN (from "events like this are more likely" to "this event was caused by"), you need to make assumptions about sufficiency and counterfactuals that are often unprovable for a specific token. The **Reference Class Claim (E)** licenses the refusal here: you cannot calculate the probability of causation for the token without arbitrarily selecting a causal model class.

  **However,** your intuition is correct: the slogan is doing too much work. The modeller could have said: *"We cannot say if climate change caused this specific drop of water, but we can say climate change made events of this magnitude five times more frequent."* That answers the spirit of the question without violating the "single event" constraint. By using the slogan to shut down the follow-up, the modeller was using a philosophical truth (E) to avoid a communication task (translating RR to layperson risk).

  **Verdict:** The slogan licenses refusing a *token causal probability*, but it does not license refusing to discuss *class-based risk ratios* which answer the reporter's underlying concern.

  **Confidence:** 85%

  ---

  ### 3. The Lab Leak Case (Past Singulars)

  Does the slogan apply to the disease modeller refusing to number the lab-leak hypothesis?

  **Yes, but differently.**
  The climate case is about *ex-ante* likelihoods applied to a token that occurred. The lab leak case is *ex-post* hypothesis testing on a unique historical event.
  *   **Frequentist View:** You cannot repeat the origin of the pandemic. Therefore, $P(\text{Lab Leak})$ is meaningless (either 0 or 1). The slogan holds.
  *   **Bayesian View:** $P(\text{Lab Leak})$ represents our current state of ignorance given the evidence. The slogan fails.

  The disease modeller is likely hiding behind the **Verification Claim (C)**. Since the event is past and unique, no amount of new data can converge on a frequency. Assigning a number (e.g., "60%") feels arbitrary because it cannot be falsified by future trials.

  **Distinction:** In climate attribution, we *can* run models of the world with/without emissions to generate frequencies for the *class*. In the lab leak, we cannot run models of the world with/without the lab accident to generate frequencies for the *class* of "pandemic origins." The lab leak case is a much stronger candidate for the slogan than the climate case.

  **Confidence:** 90%

  ---

  ### 4. The Physics Counterexample (Single Atom Decay)

  You mentioned physicists talk about the decay of a single atom having a probability. This is the hardest counterexample to the slogan.

  **Resolution:** This relies on the **Ontological Claim (B)**.
  In quantum mechanics (under the standard Copenhagen interpretation), probability is not a measure of ignorance (epistemic) or a long-run frequency (frequentist); it is a **fundamental propensity**. The universe is genuinely indeterministic at the token level.
  *   If you believe QM describes reality, single-case objective chances *do* exist.
  *   If you believe in Hidden Variables (e.g., Bohmian mechanics), the probability is epistemic (we don't know the hidden state), and the slogan returns.

  Most working physicists act as if single-case propensities exist. This makes the slogan **False** in the context of fundamental physics, even if it remains **True** for complex macro-systems (like floods or pandemics) where the uncertainty is due to complexity/ignorance rather than fundamental indeterminism.

  **Confidence:** 75% (Least Sure)

  ---

  ### 5. Confidence & The Weakest Link

  Here is my confidence assessment in the verdicts provided above.

  | Claim / Verdict | Confidence | Notes |
  | :--- | :--- | :--- |
  | **Semantic (Frequentism)** | 95% | Definitionally true within that framework, but the framework is optional. |
  | **Ontological (Propensities)** | **75%** | **LEAST CERTAIN.** Depends on interpretation of QM and metaphysics of chance. |
  | **Epistemic (Verification)** | 90% | Empirically true (can't rerun history), but normative force is debatable. |
  | **Subjectivity (Bayesian)** | 95% | True if you accept Bayesian epistemology. |
  | **Reference Class** | 98% | Logically robust. The strongest reason to use the slogan. |
  | **Modeller's License** | 85% | Technically valid for token-causation, invalid for class-risk translation. |
  | **Lab Leak Applicability** | 90% | Stronger fit than climate, due to lack of counterfactual modelling. |
  | **Physics Counterexample** | 85% | Valid for micro, questionable if it maps to macro risk. |

  **The One to Push Back On:**
  Push me on the **Ontological Claim (Quantum Propensity)**. I assigned it 75% confidence.
  *   **Why:** It is the only place where the slogan might be objectively *false* rather than just semantically restricted. If single-case objective chances exist in physics, does that bleed into macro-systems via chaos theory? If a flood is sensitive to initial conditions (butterfly effect), and those conditions rely on quantum events, does the flood inherit the single-case probability?
  *   **The Counter:** Most risk modellers argue that macro-system uncertainty is effectively epistemic (we just don't know the initial conditions), not ontological. But the line is blurrier than the slogan admits. If you want to dismantle the slogan's authority, attack the idea that macro-risk is fundamentally different from quantum chance.

  **Summary for your next piece:**
  The slogan is a **Reference Class shield** masquerading as an **Ontological truth**. It is useful to prevent reporters from treating risk ratios as crystal balls for specific tokens, but it is often abused to avoid explaining how those risk ratios actually change the stakes for the specific token we care about. In the lab leak case, it is more honest (we lack the counterfactual models); in the climate case, it is often lazy (we have the models, just not the token-causation proof).
