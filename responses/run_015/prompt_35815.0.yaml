answer: |-
  ### The 90-Minute Dual-Use Review Protocol

  This procedure is designed to break the deadlock between unilateral optimism (publish by default) and unilateral pessimism (veto by anxiety). It relies on **anonymous pre-scoring** to neutralize seniority and a **supermajority threshold** to prevent single-reviewer dominance, with a specific **escape hatch** for tail-risk catastrophes.

  **Prerequisites:** All five reviewers must read the paper and submit an anonymous risk score (1=Negligible, 5=Severe) 24 hours before the meeting.

  #### Phase 1: Hazard Screening (15 Minutes)
  *Goal: Separate factual constraints from normative risk.*
  1.  **Legal/Compliance Check:** Does this paper violate export control laws (e.g., EAR, ITAR), classified information restrictions, or explicit institutional biosafety policies?
      *   *If Yes:* **Stop.** Verdict: `\verdict{withhold}`. (This is not a judgement call; it is compliance).
      *   *If No:* Proceed to Q2.
  2.  **Catastrophe Clause:** Does any single reviewer identify a specific, technically feasible pathway to *catastrophic* harm (e.g., pandemic-capable pathogen, critical grid failure) that the other four have missed?
      *   *If Yes:* **Stop.** Verdict: `\verdict{escalate}`. (Single expert veto allowed *only* on credible catastrophic pathways, not general risk).
      *   *If No:* Proceed to Phase 2.

  #### Phase 2: Risk Aggregation & Deliberation (45 Minutes)
  *Goal: Resolve variance in risk perception without deferring to status.*
  3.  **Score Reveal:** Display the five anonymous pre-scores.
  4.  **Variance Check:**
      *   *Low Variance (All scores within 1 point of each other):* Proceed to Vote.
      *   *High Variance (Range spans 3+ points, e.g., two 1s and two 5s):* The reviewers at the extremes have 5 minutes each to state the *factual* basis of their score (not moral preference).
          *   *Example Fact:* "This method requires equipment costing $50k." (Lowers risk).
          *   *Example Not Fact:* "I feel bad actors will try." (Ignored).
      *   *Re-score:* Reviewers may adjust scores based on new facts.
  5.  **The Supermajority Vote:** Reviewers vote publicly on the motion: *"The residual risk is acceptable for publication."*
      *   **4 or 5 Votes "Yes":** Verdict: `\verdict{publish}`. (Breaks the unilateral veto).
      *   **4 or 5 Votes "No":** Verdict: `\verdict{withhold}`. (Breaks the unilateral publish).
      *   **3-2 Split or 4-1 (without Catastrophe Clause):** Verdict: `\verdict{escalate}`. (Hand decision to external ethics/security board).

  #### Phase 3: Mitigation & Documentation (30 Minutes)
  *Goal: Ensure the decision is actionable and defensible.*
  6.  **Mitigation Stipulations:** If `\verdict{publish}`, are there redactions or delays required to secure the 4-vote threshold? (e.g., "Publish only if specific primer sequences are removed").
  7.  **Minority Report:** If the vote was not unanimous, the dissenting view is summarized in one paragraph and attached to the internal record. This validates the dissenter without granting veto power.
  8.  **Final Sign-off:** Chair signs the decision log.

  ---

  ### Where This is Theatre (Judgement Calls Dressed as Procedure)

  1.  **The "Catastrophe Clause" Definition:** Deciding what counts as "credible" and "catastrophic" in Phase 1 is purely subjective. One reviewer's "plausible pathway" is another's "science fiction." This step hides a value judgement (how much precaution is enough?) inside a factual filter.
  2.  **Fact vs. Preference in Phase 2:** When reviewers argue over variance, distinguishing "factual basis" from "risk tolerance" is impossible. A reviewer claiming "Bad actors will find this" treats their pessimism about human nature as a fact. The procedure cannot police this distinction effectively.
  3.  **The "External Board" Black Box:** Choosing `\verdict{escalate}` feels like a decision, but it is actually a deferral. It kicks the value conflict to a body with more authority but often less technical context, potentially delaying the outcome indefinitely (a stall by another name).

  ### Where The Procedure Will Misfire

  1.  **The "Safe Bet" Bias:** Reviewers know that if they vote "Publish" and something goes wrong, they are blamed. If they vote "Withhold" or "Escalate," they are "careful." In a 3-2 split, the pressure to conform to the cautious side will inflate "No" votes, turning the Supermajority rule into a de facto veto system over time.
  2.  **Information Asymmetry:** If the author is in the room (or if one reviewer is the author's close colleague), they can overwhelm the "factual basis" discussion with technical jargon that the other four cannot verify in 5 minutes.
  3.  **Mission Creep:** The board will inevitably start judging *scientific merit* ("This isn't important enough to risk publishing") rather than *dual-use risk*, because rejecting on merit is easier than arguing about security.

  ---

  ### Case Applications

  #### Case 1: Vaccine/Pathogen Method Paper
  *   **Analysis:** The method accelerates vaccine mRNA design but uses a gene synthesis technique applicable to gain-of-function pathogens.
  *   **Phase 1:** No legal violation. However, Reviewer 3 invokes the **Catastrophe Clause**, arguing the synthesis technique lowers the barrier for creating a novel pandemic virus.
  *   **Phase 2:** Even if the other 4 reviewers think the risk is low (Score 2), the Catastrophe Clause triggers automatically.
  *   **Phase 3:** Board drafts a summary of the technical disagreement for the external biosecurity council.
  *   **Outcome:** The internal board lacks the mandate to weigh global pandemic risk against vaccine speed.
  \verdict{escalate}

  #### Case 2: Critical Infrastructure Dataset
  *   **Analysis:** A civil engineering paper mapping precise geospatial coordinates and structural weak points of regional power substations.
  *   **Phase 1:** No explicit classification markings, but Reviewer 2 notes this violates the institute's "Critical Infrastructure Protection" guideline (internal policy).
  *   **Phase 2:** This triggers the **Legal/Compliance Check** (Q1). It is not a risk judgement; it is a policy violation.
  *   **Phase 3:** The paper cannot be published as-is. Authors are offered the chance to redact coordinates to a regional level. If they refuse, it is killed. Assuming they refuse for scientific integrity:
  *   **Outcome:** Hard stop based on compliance, not risk aggregation.
  \verdict{withhold}

  #### Case 3: DIY Biohacking Negative Result
  *   **Analysis:** A study showing a popular, unregulated nootropic supplement causes liver toxicity in mouse models.
  *   **Phase 1:** No catastrophic dual-use potential (hard to weaponize liver toxicity data). No legal violations.
  *   **Phase 2:** Pre-scores are all 1 (Negligible Risk). Variance is zero. Vote is 5-0 "Yes."
  *   **Phase 3:** Public health benefit is deemed to outweigh reputational risk to the supplement industry. Minority report not needed.
  *   **Outcome:** Clear benefit, negligible dual-use risk.
  \verdict{publish}

  ---

  ### Procedure Limitation Statement
  The procedure successfully aggregates risk tolerance and prevents unilateral vetoes, but it cannot settle the fundamental conflict between the institutional value of open scientific inquiry and the societal value of precautionary security.
