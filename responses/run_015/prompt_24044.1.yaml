answer: |-
  You have identified a structural fault line that is central to contemporary metaethics, specifically within the debate between **Internalism** (often associated with Bernard Williams and the Humean Theory of Reasons) and **Externalism** (associated with figures like Derek Parfit, T.M. Scanlon, and Thomas Nagel).

  To answer your primary question directly: There is no single, capitalized Proper Noun (like "The Gettier Problem") that exclusively labels this specific configuration across all literature. However, it is most precisely referred to as **"The Normativity Objection to Internalism"** or, more technically, **"The Regress of the Internalist Principle."**

  While you are correct to feel that "The Bootstrap Problem" is close, in the technical literature, *bootstrapping* usually refers to the specific claim that an *intention* can generate a reason where none existed before (e.g., "I intend to go to the party, therefore I have a reason to take a cab"). Your formulation is deeper: it targets the *bridge principle* itself ("Desires give reasons") and exposes that the theory lacks the resources to ground the normativity of that principle without violating its own constraints.

  Here is the expert breakdown of this configuration, its nomenclature, its distinctions, and its scope.

  ### 1. The Established Nomenclature

  While you won't find one universal label, the problem is discussed under three overlapping headers. You should choose based on the specific nuance you wish to emphasize:

  *   **The Normativity Objection to Internalism:** This is the broad umbrella. It asserts that Internalism (the view that reasons depend on motives) cannot account for the *normative force* of reasons. It asks: "Why does the fact that I desire $X$ give me a *reason* to pursue $X$?"
  *   **The Problem of the Normative Authority of Desires:** This focuses on the psychological state. It highlights that desires are merely psychological facts (is), and the theory fails to explain how they acquire authority (ought).
  *   **The Internalist Regress (or Regress of Motives):** This is the specific label for the configuration you described. If the principle "Desires give reasons" is normative, Internalism demands it be grounded in a desire. (e.g., "I desire to satisfy my desires"). But then, what gives *that* desire normative force? This leads to the vicious regress you identified.

  **A Structural Twin: The "Shmagency" Objection**
  You should be aware of David Enoch's **"Shmagency Objection"** (from *Taking Morality Seriously*). While Enoch targets *Constitutivism* (the view that normativity is grounded in the nature of agency), the logical structure is identical to your description of Internalism. Enoch argues that if you ground normativity in $X$ (agency), you need a prior reason to care about $X$. If you ground it in Desires, you need a prior reason to care about Desires. Your formulation is effectively **"The Shmagency Objection applied to Humean Internalism."**

  ### 2. Distinction from Related Concepts

  You asked how this differs from the **Is/Ought Gap** and the **General Normativity Problem**. These distinctions are crucial for precise philosophical writing.

  **Vs. The Is/Ought Gap (Hume's Law)**
  *   **The Is/Ought Gap** is a general logical thesis: You cannot derive a normative conclusion from purely non-normative premises.
  *   **Your Configuration** is an *internal coherence* problem. It grants, for the sake of argument, that the Internalist *tries* to bridge the gap (by positing the bridge principle). The objection is not that they *can't* bridge the gap, but that the *bridge they built* (the principle linking motives to reasons) floats in mid-air. It is a problem of **theoretical self-undermining**, not just derivation. The Internalist claims *all* normativity comes from motives; the objection shows the *principle* asserting that claim is itself normative but motive-less.

  **Vs. The General Normativity Problem**
  *   **The General Normativity Problem** asks: "Why be normative at all?" or "What is the nature of normativity?" It applies to Realists and Anti-Realists alike.
  *   **Your Configuration** is theory-specific. It does not ask "Why are there reasons?" It asks "How can *this specific theory* (Internalism) account for reasons without contradicting its own definition of what a reason is?" It is a **local** problem for motive-based theories, not a **global** problem for ethics.

  ### 3. Scope: Who is Guilty and Who Escapes?

  **The Guilty (Target of the Objection)**
  *   **Bernard Williams-style Internalism:** Specifically the claim that a reason must be tied to the "subjective motivational set."
  *   **The Humean Theory of Reasons:** The view that reasons are instrumental to the satisfaction of desires.
  *   **Desire-Based Theories of Value:** Any view claiming $X$ is good *because* it is desired, without an independent account of why desire tracks value.
  *   **Harry Frankfurt's Volitional Necessities:** If one claims we are bound by what we care about, this regress asks what binds us to what we care about.

  **The Innocent (Theories that Escape)**
  *   **Robust Moral Realism (e.g., Parfit, Scanlon):** They argue reasons are non-natural facts. The principle "Pain gives a reason to avoid it" is a brute normative truth, not grounded in a desire. They accept the normativity of the principle as fundamental.
  *   **Kantian Constitutivism (e.g., Korsgaard):** They attempt to escape by arguing the principle is constitutive of agency. (Though, as noted, Enoch's Shmagency objection attacks this escape route).
  *   **Error Theory (e.g., J.L. Mackie):** They escape by denying there are any reasons at all. If there are no reasons, there is no problem grounding them.
  *   **Externalist Internalism (e.g., Michael Smith):** Smith tries to bridge the gap by arguing that a fully rational agent *would* desire the good. This shifts the ground from *actual* motives (which face your regress) to *rational* motives (which presuppose a standard of rationality).

  ### 4. Recommendation for Labeling

  If you are writing a paper or engaging in debate, do not invent a new term, but do not settle for the vague "normativity problem." The most precise and professionally recognized way to label this configuration is:

  > **"The Regress Argument against the Normative Authority of Desires."**

  Or, if you want to emphasize the structural incoherence:

  > **"The Self-Undermining Objection to Humean Internalism."**

  **Why this is the best fit:**
  It captures the specific mechanism you identified: the theory requires a normative principle to function, but its own metaphysical commitments (that only motives are normative) prevent it from grounding that principle. It is not merely that the theory is false; it is that the theory *cannot state its own truth conditions* without violating its own ontology.

  ### Summary for your usage
  You are describing the **Regress of the Internalist Principle**. It is a specific instance of the **Normativity Objection**, structurally isomorphic to Enoch's **Shmagency Objection**. It differs from the **Is/Ought Gap** because it is an internal coherence failure rather than a derivational impossibility. It is the primary weapon used by **Parfit** and **Scanlon** to dismantle the **Humean Theory of Reasons**.

  Use the term **"The Problem of the Normative Authority of Desires"** to be immediately understood by metaethicists, but clarify in a footnote that you are specifically invoking the **regress formulation** regarding the ungrounded bridge principle. This signals that you are not just asking "Why are desires normative?" but "How can a desire-based theory ground the normativity of the desire-reason link without circularity?"
