prompt: |-
  Hey — I'm in a tiny self-taught reading group working through decision theory (we've done Newcomb, the smoking lesion, counterfactual mugging, and this week we got to updateless decision theory, the Wei Dai one) and I think I've hit a problem with it that nobody in the group could anwser, so I'm outsourcing it.

  As I understand it, UDT says: choose the best *policy*, where a policy is a mapping from observations to actions, and rank candidate policies by their expected utility according to your prior rather than your posterior — the formulation we were working from literally just drops the conditioning on the observation, which is supposed to be why UDT one-boxes in Newcomb and pays up in counterfactual mugging instead of wimping out like CDT and EDT do. But here's what I can't get past: if the evaluation never conditions on what I actually observed, then doesn't UDT end up committed to ignoring evidence altogether? Whatever I learn later, the winning policy was already settled in advance, so a UDT agent should behave the same whether or not the news ever arrives — which sounds insane. My friend made up a case that he thinks sharpens it: you get scanned and copied, and the two copies wake up in identical rooms except one has a red light on and the other a blue one, assigned by a fair coin, and each copy is told that the other got the other colour. Both copies face the same choice, press A or press B. Payoffs: if and only if the red-room copy presses A and the blue-room copy presses B, each gets $1000; every other combination pays both of them nothing. (His nastier variant: with probability 10% a glitch makes both lights red, so a copy seeing red doesn't know whether it's the red copy or in a glitch world.) The sensible thing here is plainly for the two copies to do different things, and the only way to pull that off is for the policy to be sensitive to which light you see — but UDT is supposed to be *updateless*. So either it tells the copies to ignore the lights and throws away $2000 for no reason, or it does let the action depend on the observation, and then I have no idea what 'updateless' is doing any more or how this isn't just ordinary causal decision theory with Bayesian updating bolted on, which is exactly what we were told UDT was meant to replace. He also keeps saying something like 'UDT updates its beliefs but not its decisions', and I genuinely can't tell whether that's a real distinction or just wordplay.

  Can you spell out what's actually going on — in the red/blue case specifically, what would a UDT agent do and why, and where exactly does the prior-weighted evaluation bite as opposed to the observation-sensitivity of the policy? And does any of this make a difference for completely boring everyday choices with no predictor and no copying, like whether to take an umbrella, or is the whole apparatus only doing work in sci-fi setups? Sorry if this is a well-worn question, we're kind of teaching ourselves and we've already confused each other twice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** A tiny self-taught reading group working through decision theory (Newcomb, Smoking Lesion, Counterfactual Mugging, now Updateless Decision Theory - UDT).
      *   **Core Confusion:** They understand UDT as "choose the best policy mapping observations to actions, ranked by prior expected utility." They think this implies ignoring evidence/observations.
      *   **Specific Example:** The "Red/Blue Light Copy" problem. Two copies, one sees Red, one sees Blue (fair coin). Payoff \$1000 each if Red presses A and Blue presses B. Otherwise \$0. (Variant: 10% chance both see Red).
      *   **The Dilemma:** If UDT is updateless, does it ignore the light color? If it uses the light color, how is it different from CDT/EDT with updating? What does "updateless" actually mean if the policy depends on observations?
      *   **Specific Questions:**
          1.  What would a UDT agent do in the Red/Blue case and why?
          2.  Where does the prior-weighted evaluation bite vs. observation-sensitivity?
          3.  Is "updates beliefs but not decisions" real or wordplay?
          4.  Does UDT matter for everyday choices (umbrella) or just sci-fi?

  2.  **Deconstruct the Core Misunderstanding:**
      *   *Misconception:* "Updateless" means "ignores observations."
      *   *Correction:* "Updateless" means "does not condition the *evaluation of the policy* on the observation." The *policy itself* is a function *of* the observation.
      *   *Analogy:* Writing a computer program before turning it on. You write the code (policy) based on what you expect the inputs (observations) to be. Once the program is running, it takes inputs and acts. You don't rewrite the code mid-execution based on the input; the code *handles* the input.
      *   *Key Distinction:* CDT/EDT ask "Given I see Red, what action maximizes utility?" UDT asks "Given I might see Red or Blue, what function $f(\text{observation})$ maximizes utility?"

  3.  **Address the Red/Blue Light Case:**
      *   **Setup:**
          *   Coin flip: Red/Blue (50/50).
          *   Copy 1 sees Red, Copy 2 sees Blue.
          *   Goal: Red -> A, Blue -> B.
      *   **UDT Approach:**
          *   Before the coin flip (in the "prior" state), the agent considers policies $\pi: \{\text{Red, Blue}\} \to \{A, B\}$.
          *   Possible policies:
              1.  Always A.
              2.  Always B.
              3.  If Red then A, If Blue then B.
              4.  If Red then B, If Blue then A.
          *   Calculate Expected Utility (EU) for each policy *from the prior perspective*.
              *   Policy 3 (Red->A, Blue->B): 50% chance (Red, Blue) occurs. Payoff \$1000. EU = \$1000.
              *   Policy 4 (Red->B, Blue->A): 50% chance. Payoff \$0. EU = \$0.
              *   Policy 1 & 2: Payoff \$0.
          *   Selection: Policy 3 wins.
          *   Execution: Agent sees Red. Policy 3 says "Press A". Agent sees Blue. Policy 3 says "Press B".
      *   **Result:** UDT succeeds. It *uses* the observation. It does not ignore it.
      *   **Why "Updateless"?** Because when the Red-copy sees Red, it doesn't say "Okay, now I know I'm Red, so I maximize utility conditional on being Red." If it did that (EDT/CDT style), it might reason "I'm Red. My partner is Blue. I need to press A. But wait, does my partner know they are Blue?" (In standard CDT, they might fail to coordinate if they can't communicate, but here the policy was pre-committed). The crucial bit is that the *choice of policy* wasn't updated on seeing Red. The policy was chosen *before* knowing who is who.

  4.  **Address the "Glitch" Variant (10% both Red):**
      *   This adds uncertainty about the world state given the observation.
      *   Prior: 90% (Red, Blue), 10% (Red, Red).
      *   Policy $\pi: \{\text{Red, Blue}\} \to \{A, B\}$.
      *   If $\pi(\text{Red}) = A, \pi(\text{Blue}) = B$:
          *   90% case: Red sees Red (A), Blue sees Blue (B). Win \$1000.
          *   10% case: Copy 1 sees Red (A), Copy 2 sees Red (A). Lose \$0.
          *   EU = 0.9 * 1000 = 900.
      *   If $\pi(\text{Red}) = A, \pi(\text{Blue}) = A$:
          *   90% case: Red (A), Blue (A). Lose.
          *   10% case: Red (A), Red (A). Lose.
          *   EU = 0.
      *   UDT still picks the policy that maps observations to actions optimally *in expectation over the prior*. It handles the indexical uncertainty (which copy am I?) by treating the "observation" as part of the input to the policy function.

  5.  **Address "Updates Beliefs but Not Decisions":**
      *   This is a bit of wordplay but has technical meaning.
      *   *Beliefs:* A UDT agent can have a posterior distribution over world states given observations. It knows "If I see Red, it's 90% likely we are in the normal case."
      *   *Decisions:* It does not use that posterior to *select* the decision rule. It uses the prior to select the decision rule.
      *   *Why?* Because in problems with logical correlation (predictors, copies), updating can break the correlation. If I update on "I see Red," I might treat my decision as independent of the Blue copy's decision. But the Blue copy is running the *same policy*. By optimizing the policy from the prior, I ensure my decision is correlated with the Blue copy's decision in the way that maximizes total utility.
      *   *Better phrasing:* "Optimizes the input-output map using the prior, rather than optimizing the output using the posterior."

  6.  **Address Everyday Choices (Umbrella):**
      *   Does UDT differ from CDT/EDT here?
      *   Usually, no. In standard causal environments without predictors or logical twins, the policy that maximizes prior EU is the same as the action that maximizes posterior EU.
      *   $E[U | \text{do}(A)] \approx E[U | \text{do}(\pi(O))]$.
      *   UDT collapses to CDT/EDT in "boring" worlds. It only diverges when your decision is logically correlated with something else that affects utility (Omega, copies, twins, transparent Newcomb).
      *   So, for the umbrella: Check forecast (observation). Policy: If Rain Forecast -> Umbrella. UDT picks this policy because it has high prior EU. CDT picks "Take Umbrella" because it has high posterior EU given Rain Forecast. Same result.

  7.  **Structure the Response:**
      *   **Validation:** Acknowledge this is a very common and sharp confusion. The "ignoring evidence" intuition is the biggest hurdle.
      *   **The Core Correction:** Distinguish between the *Policy* (function) and the *Action* (output). UDT conditions actions on observations *inside* the policy, but selects the policy using the prior.
      *   **Walkthrough the Red/Blue Case:** Explicitly calculate the EU of the policies from the "before" perspective. Show that the winning policy *uses* the light color.
      *   **Explain "Updateless":** Clarify that it refers to the *optimization criterion*, not the *input data*. Use the "source code" analogy.
      *   **Beliefs vs. Decisions:** Clarify the phrase. It's about what distribution you use to weigh outcomes when choosing the rule.
      *   **Everyday Choices:** Explain that UDT agrees with CDT/EDT in standard causal settings. It's a generalization, not a contradiction, for normal life.
      *   **Tone:** Keep it conversational but precise. They are self-taught, so avoid overly dense formalism but don't dumb it down too much. They've done Counterfactual Mugging, so they know the terrain.

  8.  **Refining the Explanation (Self-Correction/Nuance):**
      *   *Caution:* Make sure not to confuse UDT with TDT (Timeless Decision Theory). They are closely related. Stick to the Wei Dai UDT formulation as requested (policy selection).
      *   *Nuance on "Beliefs":* Does UDT *have* a posterior? Technically, UDT agents can maintain a posterior for planning, but the *decision rule* is fixed. It's safer to say "UDT doesn't condition the *choice of policy* on the observation."
      *   *The "Glitch" case:* Make sure to emphasize that the policy is fixed *before* knowing if the glitch happened.
      *   *Why CDT fails the Red/Blue case:* CDT might struggle if the copies can't communicate and treat their decisions as independent. CDT says "I see Red. I want \$1000. I need to press A. But does pressing A cause the Blue copy to press B?" No. So CDT might fail to coordinate if it doesn't realize it's logically linked to the other copy. UDT builds that link into the policy selection. *Wait, actually:* In the simple Red/Blue case without predictors, CDT *might* succeed if it knows the setup. But if the copies are identical algorithms, CDT often fails to recognize the logical correlation. UDT *forces* the recognition of logical correlation by optimizing the algorithm itself. I should focus on the *coordination* aspect. The key is that the two copies are instantiations of the same policy.

  9.  **Final Polish:** Check against the user's specific questions.
      *   *Red/Blue specific:* Yes, covered.
      *   *Prior vs Observation:* Yes, covered (Policy selection vs Policy execution).
      *   *Beliefs/Decisions:* Yes, covered.
      *   *Everyday choices:* Yes, covered.

  10. **Drafting the response.** (Mental outline: Intro -> The "Policy vs Action" distinction -> The Red/Blue Walkthrough -> What "Updateless" actually means -> Everyday life -> Conclusion).

  *(Self-Correction during drafting)*: I need to be careful with the CDT comparison in the Red/Blue case. If the copies are causally isolated, CDT says "My action doesn't causally affect the other copy." So CDT might randomize or pick arbitrarily. UDT says "We are the same algorithm, so if I decide 'Red->A', the other copy (running the same algorithm) will decide 'Blue->B'." This is the logical correlation. I must emphasize *logical* correlation vs *causal* correlation.

  Okay, ready to write.
answer: |-
  This is a fantastic question, and you have hit on the single most common stumbling block people encounter when moving from CDT/EDT to UDT. Your intuition that "updateless sounds like ignoring evidence" is completely natural, but it rests on a category error about what UDT is actually optimizing.

  The short answer is: **UDT does not ignore observations. It ignores observations only when *choosing the rule*, not when *following the rule*.**

  Here is the breakdown of what is going on, using your Red/Blue case to anchor it.

  ### 1. The Policy vs. The Action
  The confusion comes from conflating the **action** (press A or B) with the **policy** (the function that maps observations to actions).

  *   **CDT/EDT** ask: "Given that I observe **Red** right now, which *action* maximizes my expected utility?" They condition the *choice* on the observation.
  *   **UDT** asks: "Before I knew what I would observe, which *policy* (function from observations to actions) maximizes my expected utility?" It conditions the *choice of policy* on the **prior**, but the *policy itself* takes the observation as an input.

  Think of it like writing a computer program before you turn the computer on.
  *   **The Prior:** You are the programmer sitting at home. You know the computer might be placed in a Red Room or a Blue Room. You don't know which yet.
  *   **The Policy:** You write the code. The code says `if sensor == Red: press A; elif sensor == Blue: press B`.
  *   **The Observation:** The computer is turned on in the Red Room. It reads the sensor.
  *   **The Action:** It executes the code and presses A.

  Did the computer "ignore" the sensor? No. It used the sensor to determine the output. But did the *programmer* update their code after seeing the sensor? No. The code was written based on the *probability* of seeing Red or Blue, not the fact of seeing it.

  **UDT is the programmer. CDT is the computer trying to rewrite its own code mid-execution.**

  ### 2. Walking Through Your Red/Blue Case
  Let's look at your specific example.
  *   **World:** Coin flip (50% Red/Blue, 50% Blue/Red).
  *   **Agents:** Two copies of the same UDT agent.
  *   **Payoff:** \$1000 each if (Copy 1 does A AND Copy 2 does B).
  *   **Observation:** Copy 1 sees Red, Copy 2 sees Blue.

  **How CDT might fail:**
  When Copy 1 wakes up and sees Red, CDT says: "I know I am in the Red room. My utility depends on what Copy 2 does. But my action cannot *causally* influence Copy 2. We are separated. Therefore, I should just pick whatever is best for me given Copy 2's fixed behavior." If Copy 2 reasons the same way, they fail to coordinate because neither treats their decision as logically linked to the other's.

  **How UDT succeeds:**
  The UDT agent steps back to the "prior" position (before the coin flip, before the copying). It considers candidate policies $\pi$. A policy is a map: $\{\text{Red, Blue}\} \to \{A, B\}$.

  Let's evaluate the Expected Utility (EU) of two candidate policies from the prior perspective:

  1.  **Policy $\pi_1$ (Ignore Light):** Always press A.
      *   50% chance (Red, Blue): Copy 1 (Red) presses A, Copy 2 (Blue) presses A. Payoff: \$0.
      *   50% chance (Blue, Red): Copy 1 (Blue) presses A, Copy 2 (Red) presses A. Payoff: \$0.
      *   **Prior EU = \$0.**

  2.  **Policy $\pi_2$ (Coordinate):** If Red press A, If Blue press B.
      *   50% chance (Red, Blue): Copy 1 sees Red $\to$ A. Copy 2 sees Blue $\to$ B. Payoff: \$1000.
      *   50% chance (Blue, Red): Copy 1 sees Blue $\to$ B. Copy 2 sees Red $\to$ A. Payoff: \$1000.
      *   **Prior EU = \$1000.**

  UDT selects $\pi_2$ because it has higher expected utility *calculated using the prior probabilities*.

  Now, the agent "wakes up." Copy 1 sees Red. It does not stop to recalculate. It simply executes $\pi_2(\text{Red})$, which outputs **A**. Copy 2 sees Blue, executes $\pi_2(\text{Blue})$, which outputs **B**. They win.

  **Where does the "Updateless" part bite?**
  It bites in the evaluation step. If Copy 1 updated on "I see Red," it would discard the 50% of the probability mass where it saw Blue. It would say, "I am definitely the Red copy."
  If it then tried to optimize *from that posterior*, it might reason: "I am Red. I need to press A. But does pressing A make the Blue copy press B?"
  In CDT, the answer is "No."
  In UDT, the answer is "Yes, because we are both running the policy $\pi_2$ that was selected to maximize utility over *both* possibilities." By refusing to update the *policy selection* on the observation, UDT preserves the logical correlation between the two copies.

  ### 3. "Updates Beliefs but Not Decisions"
  Your friend's phrase is a bit of wordplay, but it points to a real technical distinction.

  *   **Beliefs:** A UDT agent *can* have a posterior belief. It knows "Given I see Red, it is 100% certain I am in the Red room (in the simple case)." It uses this belief to feed the input into the policy.
  *   **Decisions:** The *criterion* for choosing the policy does not use the posterior. It uses the prior.

  A better way to say it is: **UDT conditions its actions on observations, but it conditions its *optimization* on the prior.**

  If you condition your optimization on the posterior (like CDT/EDT), you sever the logical link to counterfactual versions of yourself (the version that saw Blue, or the version that got mugged in the other branch of Counterfactual Mugging). UDT keeps that link alive by optimizing the whole map at once.

  ### 4. The Glitch Variant
  Your friend's nastier variant (10% chance both lights are Red) works the exact same way.

  *   **Prior:** 90% (Red, Blue), 10% (Red, Red).
  *   **Policy:** $\pi: \{\text{Red, Blue}\} \to \{A, B\}$.
  *   **Evaluation:**
      *   If $\pi(\text{Red})=A, \pi(\text{Blue})=B$:
          *   90% case: Red sees Red (A), Blue sees Blue (B). Win \$1000.
          *   10% case: Copy 1 sees Red (A), Copy 2 sees Red (A). Lose \$0.
          *   **EU = \$900.**
      *   If $\pi(\text{Red})=A, \pi(\text{Blue})=A$:
          *   90% case: Red (A), Blue (A). Lose.
          *   10% case: Red (A), Red (A). Lose.
          *   **EU = \$0.**

  UDT picks the first policy. When a copy wakes up and sees Red, it presses A. It doesn't matter that it doesn't know if it's in the 90% case or the 10% case. The policy was chosen to handle that uncertainty optimally *in advance*.

  ### 5. Does this matter for Umbrellas?
  This is the "Is UDT just for sci-fi?" question.

  In boring, everyday causal worlds (no predictors, no identical copies, no logical correlations), **UDT collapses to CDT/EDT.**

  *   **Scenario:** Rain forecast (Observation). Take Umbrella (Action).
  *   **UDT:** Chooses policy "If Forecast=Rain, Take Umbrella." Why? Because in the prior, this policy yields higher utility (stay dry) than "If Forecast=Rain, Leave Umbrella."
  *   **CDT:** Sees Forecast=Rain. Updates belief (likely raining). Chooses "Take Umbrella" because it causally leads to staying dry.

  They give the same answer. UDT only diverges from CDT/EDT when your decision is **logically correlated** with something else that affects your utility (like Omega's prediction, or another copy's decision). In those cases, CDT treats the correlation as spurious because there's no causal arrow, while UDT treats it as real because there's a shared algorithm.

  So, for your daily life, you don't need to worry about UDT. You can just update normally. But if you are building an AI that might encounter Newcomb-like problems (or interact with copies of itself), UDT is the safer architecture because it doesn't "wimp out" when the causal graph gets weird.

  ### Summary for your Group
  1.  **UDT does not ignore evidence.** It uses evidence as an input to the policy.
  2.  **"Updateless" refers to the optimization criterion.** You choose the best Input$\to$Output map using your prior probabilities, not your posterior probabilities.
  3.  **In the Red/Blue case:** UDT wins because it pre-commits to a policy that coordinates the copies ("Red$\to$A, Blue$\to$B"). CDT often loses because it tries to optimize the action *after* seeing the light, breaking the logical link to the other copy.
  4.  **Everyday life:** UDT agrees with CDT. It only matters when logical correlations (predictors/copies) are in play.

  You haven't misunderstood UDT; you've just encountered the specific intuition pump (the "ignoring evidence" worry) that almost everyone hits. The distinction between *choosing the function* and *evaluating the function* is the key to unlocking it.
