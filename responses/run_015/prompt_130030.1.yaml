answer: |-
  I commit to your hypothesis, but with a sharpened diagnosis: the impasse is not merely that there are three jobs sharing a name, but that **the Logical Job (God's-eye ordering) is formally incoherent without parameters that belong to the Practical Job (interests/metrics), while the Epistemic Job (Realist defense) requires the Logical Job to be independent of those parameters.**

  The field is stuck because Scientific Realism demands an objective, language-independent ordering of theories to block the Pessimistic Meta-Induction, but the formal machinery of verisimilitude demonstrates that any such ordering is necessarily relative to a conceptual scheme (a choice of predicates, a similarity metric, or a relevance criterion). The "impossibility theorems" and the "metric dependence" are not technical glitches to be solved; they are the formal signature of this philosophical category error.

  Here is the argument for this diagnosis against the alternatives, and what follows from it.

  ### 1. Why the "Technical Deficit" Diagnosis is Wrong
  A common reaction to the post-1974 splintering is the hope that we simply haven't found the right logic yet—that there exists a "correct" measure satisfying all adequacy conditions (like the *min-sum* principle or the *average distance* principle) if only we refine the constraints. This is the "Technical Deficit" view.

  This must be rejected. The impossibility results (such as those discussed by Aronson, Harré, and Way, or the general incompatibility of the *Value of Content for Truths* and *Value of Content for Falsehoods* in certain frames) are not artifacts of specific formalisms. They arise because the adequacy conditions themselves encode conflicting intuitions from your "three jobs."
  *   **Niiniluoto's** likeness approach satisfies the intuition that "all false theories are not equally false" (Logical Job) by importing a distance metric on state descriptions. But as **Miller** demonstrated, this distance is language-dependent. Change the primitive predicates (e.g., from *hot/rainy/windy* to *Minnesotan* variables), and the ordering of theories reverses.
  *   **Kuipers** and **Schurz** attempt to fix this by restricting consequences to "relevant" ones. But "relevance" is not a logical notion; it is a pragmatic one (Practical Job).

  If the Technical Deficit view were correct, we would expect convergence on a measure that is invariant under logical equivalence or predicate transformation. We have the opposite: every proposed measure explicitly builds in a parameter (metric, relevance, weight) that *cannot* be derived from the logical form of the theory alone. The formal work has done its job: it has proven that a language-independent logical ordering of truthlikeness is unavailable. The persistence of the programme is due to the Epistemic Job's demand that it *must* be available.

  ### 2. The Conflation of Semantic and Epistemic Norms
  Your hypothesis identifies three jobs. I argue the critical friction is specifically between the **Logical** and the **Epistemic**.

  *   **The Logical Job** asks: *What is the fact of the matter about which theory is closer?* This requires a God's-eye view. Niiniluoto and Oddie provide this by positing a logical space of constituents and a metric. But to make the metric work, they must assume a privileged set of primitive predicates (natural kinds).
  *   **The Epistemic Job** asks: *Why should we believe our current theories are closer?* The Realist needs the Logical ordering to be *accessible* or at least *independent of our current interests*. If truthlikeness is relative to our current predicate choice, then saying "Newtonian mechanics is closer to the truth than Aristotelian physics" just means "Newtonian mechanics is closer relative to *our* current conceptual scheme." This offers no comfort against the Pessimistic Meta-Induction, which suggests our *current* scheme will be discarded too.

  The literature is stuck because authors oscillate between these two. When defending the formalism, they act like they are doing the Logical Job (defining an objective relation). When defending Realism, they act like they are doing the Epistemic Job (claiming this relation tracks scientific progress).

  **Miller's** critique is the pivot point here. Miller showed that content-based approaches fail (Popper) and that likeness approaches are language-dependent. The field's response was not to abandon the Logical Job, but to add complexity (e.g., weighting factors, structuralist constraints) to hide the dependence. This is why the "dependence on a metric" is not a discovery about interest-relativity (as you suggest) but a proof of **language-dependence**. Interest-relativity implies a agent; language-dependence implies a framework. The Realist needs the framework to be fixed by the world (natural kinds); the Formalist shows the framework is fixed by the logic (predicate choice).

  ### 3. The Synchronic/Diachronic Mismatch
  Your second thought is crucial and under-discussed. The verisimilitude literature is overwhelmingly **synchronic**: it ranks $T_1$ and $T_2$ at time $t$. But Scientific Realism is a **diachronic** claim: the sequence $\langle T_1, T_2, \dots T_n \rangle$ converges.

  The impossibility results apply to the synchronic ranking. But even if we solved the synchronic problem, it does not guarantee diachronic progress. A sequence of theories could each be "closer" to the truth than the last relative to a specific metric, yet the metric itself shifts (conceptual change).
  *   **Kuhnian** incommensurability is the ghost here. If the state space changes between $T_1$ and $T_2$ (e.g., phlogiston vs. oxygen), there is no common logical space in which to calculate the distance.
  *   **Structural Realism** (Worrall, Ladyman) attempts to bypass this by focusing on retained structure rather than truthlikeness of propositions. This is effectively an admission that the verisimilitude programme (as propositional ranking) cannot handle the diachronic case.

  The field spends its time refining synchronic measures because they are formally tractable. But this tractability is purchased at the cost of relevance to the Realist's actual problem.

  ### 4. What Counts as Progress?
  Given this diagnosis—that the impasse is a category error between an impossible objective ordering and a necessary pragmatic framework—what counts as progress?

  **A. Formal Progress: Abandon the Search for *The* Measure**
  Progress would be a formal result that explicitly maps the *trade-offs* between the adequacy conditions, rather than trying to satisfy them all. We need a "no-go" theorem that rigorously proves: *Any measure satisfying [Realist Desiderata] must violate [Logical Invariance].* We have hints of this (Miller, Oddie), but the field treats them as challenges to be overcome rather than boundaries to be respected. Acknowledging that verisimilitude is a **triadic relation** ($Theory, World, Conceptual\_Scheme$) rather than a dyadic one ($Theory, World$) would dissolve the "language dependence" objection by making the scheme a parameter of the definition, not a bug.

  **B. Philosophical Progress: Shift to Diachronic Structural Convergence**
  The Realist should stop asking "Is $T$ close to the truth?" and start asking "Does the sequence $\langle T_n \rangle$ preserve structural relations that yield successful intervention?"
  *   This moves the goalpost from **truthlikeness** (semantic) to **empirical adequacy + structural retention** (methodological).
  *   This aligns with your suspicion that the interesting arguments are about convergence and retention.
  *   It accepts that we cannot rank $T_{current}$ against $Truth$, but we can rank $T_{current}$ against $T_{past}$ regarding *problem-solving effectiveness* and *structural stability*.

  **C. No Progress Expected (The Deflationary View)**
  If the field refuses to abandon the demand for a language-independent, synchronic, God's-eye ordering, **no progress should be expected.** The cycle will continue:
  1.  New measure proposed (satisfies some intuitions).
  2.  Counterexample found (violates others or shows language dependence).
  3.  Measure tweaked (adds weights/relevance).
  4.  Repeat.

  This is because the desiderata are inconsistent. You cannot have a measure that is both sensitive to likeness (requires a metric) and invariant under logical transformation (requires no metric bias). You cannot have a measure that serves the Realist (requires objectivity) and acknowledges the Tichý/Miller results (implies relativity).

  ### Conclusion
  Your hypothesis is correct: the field is conflating distinct projects. But the deeper diagnosis is that **the Realist's Epistemic Job requires the Logical Job to be possible in a way the Formal Job has proven it is not.**

  The dependence on a metric is not merely "interest-relative"; it is **framework-constitutive**. Progress requires the Realist to decouple "approximate truth" from "language-independent ordering." If they cannot do this, the verisimilitude programme is a zombie: formally alive, philosophically dead. The only viable path forward is to treat truthlikeness not as a property theories *have*, but as a heuristic for tracking **structural stability across theory change**. Anything less is just refining the metrics on a map that doesn't match the territory.
