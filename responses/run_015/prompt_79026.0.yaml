      *So the conflict is: (3) says avoiding free info is irrational. (4) says avoiding free info is rational.*
      *This is the crux.* The resolution is that the utility function must include the *disutility of knowing*. If $U(World, Know) < U(World, \neg Know)$, then $E[U|Info]$ can be $< E[U|No Info]$.
      *But (3) says "you can always ignore what you've learned."* If the disutility is in the *knowing*, you cannot ignore it. You cannot return to the state of $\neg Know$.
      *So (3)'s justification ("you can always ignore") is the weak point.*

      *Revised Plan:*
      1.  **Severe:** (3)'s justification ("ignore") vs (4)'s phenomenon (irreversible disutility of knowing).
