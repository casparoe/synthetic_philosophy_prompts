  ### Where Your Verdicts Deviate (The Conflicts)

  Your intuitions diverge from strict FDT in three specific places. To adopt this principle, you must accept that your gut is wrong in these cases.

  **Conflict 1: Case 5 (Stranger Twin)**
  *   **Your Verdict:** Defect.
  *   **FDT Verdict:** Cooperate.
  *   **The Issue:** **Grounding of Dependence.** FDT requires only *logical* correlation (same algorithm). You intuitively require *physical/causal* grounding (shared code, scan, or common cause). You treat the stranger's reasoning as a *statistical regularity* rather than a *logical link*.
  *   **Resolution:** If you accept FDT, you must Cooperate in Case 5. The lack of causal contact is irrelevant; the logical isomorphism of the decision procedures creates the subjunctive link.

  **Conflict 2: Case 6 (Absent-Minded Driver)**
  *   **Your Verdict:** Plan to Continue, but Exit at the intersection.
  *   **FDT Verdict:** Plan to Continue, Continue at the intersection.
  *   **The Issue:** **Updatelessness.** You are updating on the indexical fact "I am at an intersection" and recalculating. FDT forbids this. The policy chosen at the start *is* the action taken at the intersection. If you Exit at the intersection, you *would have* been the sort of agent who Planned to Exit.
  *   **Resolution:** If you accept FDT, you must Continue at the intersection. The "local" calculation is an illusion caused by updating on information you should have treated as part of the policy structure.

  **Conflict 3: Case 8 (Twin with Imperfect Model)**
  *   **Your Verdict:** Unstable/Continuous.
  *   **FDT Verdict:** Cooperate if $P(\text{Match}) \times \text{Reward}_{CC} > \text{Reward}_{DC}$.
  *   **The Issue:** **Thresholds.** You feel a binary switch ("function of my policy or not"). FDT is continuous.
  *   **Resolution:** FDT treats this continuously. There is no threshold; there is only the expected utility calculation. Your instability suggests you are searching for a binary "Identity" switch that FDT does not use.

