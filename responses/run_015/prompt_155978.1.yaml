  ### Answers to Your Specific Questions

  **1. Does the dependence relation have to admit degrees?**
  **Yes.** In FDT, subjunctive dependence is probabilistic. In Case 8 (Mugging), you pay because $0.8 \times \$1,000,000 > \$1,000$. In Case 8 (Twin), you cooperate if $P(\text{Twin Cooperates} | \text{I Cooperate}) \times R_{CC} + P(\text{Twin Defects} | \text{I Cooperate}) \times R_{CD} > \dots$.
  *   **Effect on Case 5:** If you treat the 99% confidence as a probabilistic logical link, FDT says Cooperate. Your intuition to Defect implies you are treating the correlation as *evidential* but not *subjunctive*. To be consistent with Case 1 and 4, you must treat high-confidence logical correlation as subjunctive dependence.
  *   **Threshold:** There is no threshold. It is a continuous expected utility calculation.

  **2. New Case A: Newcomb with 90% Accurate Predictor**
  *   **FDT Verdict:** **One-Box.**
  *   **Reasoning:**
      *   One-Box EV: $0.9 \times \$1,000,000 + 0.1 \times \$0 = \$900,000$.
      *   Two-Box EV: $0.9 \times \$1,000 + 0.1 \times \$1,001,000 = \$9,000 + \$100,100 = \$109,100$.
      *   (Assuming standard payoffs: \$1M in big box, \$1k in small box).
      *   Even with 90% accuracy, the dependence is strong enough that your policy influences the probability of the million being there.
  *   **Principle Clause:** Degrees of Dependence.

  **3. New Case B: Twin PD with Zero-Weight Utility**
  *   **Scenario:** Twin runs your exact procedure, but their utility function values *only* their own payoff, not yours (and yours values only yours).
  *   **FDT Verdict:** **Defect.**
  *   **Reasoning:** FDT maximizes *your* expected utility. Your utility depends on *your* payoff.
      *   If you Cooperate: Twin Cooperates (logical link). You get $R_{CC}$.
      *   If you Defect: Twin Defects (logical link). You get $R_{DD}$.
      *   *Wait, check the setup:* "Twin... assigns no weight at all to me." This usually means standard Prisoner's Dilemma payoffs ($T > R > P > S$).
      *   If the Twin's utility doesn't include you, that doesn't change *your* utility function. It just means they don't care about you. But in a standard PD, they cooperate because *they* get more if *you* cooperate (assuming symmetry).
      *   *Correction:* If the Twin runs your procedure, and you are an FDT agent, you Cooperate because you value the outcome where *both* cooperate more than *both* defect. The Twin, running your procedure, does the same.
      *   *However*, if the prompt implies the Twin is an FDT agent *for themselves* but you don't care about them, and they don't care about you:
      *   If you Cooperate -> Twin Cooperates. Payoff: $R$ (Reward).
      *   If you Defect -> Twin Defects. Payoff: $P$ (Punishment).
      *   Since $R > P$, you **Cooperate**.
      *   *Unless:* The prompt implies the Twin's utility function is different from yours. "Twin... has a utility function that assigns no weight at all to me." This implies the Twin is *not* running your decision procedure (which includes your utility function).
      *   *Strict Interpretation:* If the Twin runs your *decision procedure* (algorithm), they must use your *utility function*. If they use a different utility function, they are not running your procedure.
      *   *Charitable Interpretation:* You run FDT. Twin runs FDT. You both care only about your own monetary payoff.
      *   Result: **Cooperate.** (Because $P(\text{They C} | \text{I C}) \approx 1$).
      *   *Alternative Interpretation:* You care about yourself. Twin cares about themselves. Twin does *not* run your procedure (because utility is part of the procedure). Twin is a stranger (Case 5).
      *   *Verdict:* If the Twin does not run your utility function, they do not run your decision procedure. The logical link is broken. **Defect.** (This aligns with your Case 5 intuition).

