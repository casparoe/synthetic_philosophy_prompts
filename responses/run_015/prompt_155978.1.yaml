  ### Summary of Required Sacrifices

  To hold the principle of **Updateless Functional Decision Theory**:

  1.  **You must drop Case 5 (Stranger Twin).** You must Cooperate if you are 99% confident they reason identically. The lack of causal contact is irrelevant; the logical isomorphism is sufficient for subjunctive dependence.
  2.  **You must drop Case 6 (Absent-Minded Driver).** You must Continue at the intersection. You cannot update on "being at an intersection" to change the policy you would have optimally committed to ex-ante.
  3.  **You must resolve Case 8 (Twin).** You must accept continuous dependence. If the model fidelity is 51% and the stakes are high enough, you Cooperate. There is no binary threshold of "Identity."

  **The Principle in One Sentence:**
  > **Choose the policy that maximizes expected utility from the initial prior, treating any output logically correlated with your decision procedure as subjunctively dependent on your choice, regardless of causal distance, and do not update on indexical observations to sever that dependence.**

  If you cannot accept Cooperating in Case 5 or Continuing in Case 6, you do not believe in FDT; you believe in **Causal Decision Theory with a Heuristic for Logical Copies**, which will fail you in Counterfactual Mugging (Case 1) unless you artificially precommit. You cannot have the Mugging win (Case 1) without the Stranger Twin Cooperate (Case 5) unless you posit a metaphysical distinction between "Copy" and "Independent Reasoner" that FDT explicitly dissolves.
