  The principle you are groping for is **Functional Decision Theory (FDT)**, specifically the **Updateless** variant. Your tentative rule is an informal statement of FDT. However, your gut verdicts on cases 5, 6, and the Twin half of 8 reveal that your intuition imposes stricter **grounding requirements** on logical dependence than standard FDT does, and that you are not fully **updateless**.

  Here is the principle stated precisely, followed by the mapping, the conflicts, and the solutions to your new cases.

  ### The Principle: Updateless Functional Decision Theory

  **Definition:**
  An agent should select the decision policy $\pi$ (a mapping from observations to actions) that maximizes **Expected Utility** calculated from the **initial prior** (before receiving specific observational indexicals), where the expectation is taken over all possible worlds weighted by their logical probability.

  **The Subjunctive Dependence Clause:**
  When calculating the expected utility of a policy $\pi$, the agent must treat as fixed only those facts that are **logically independent** of the output of $\pi$. Any fact that is determined by a process that simulates, predicts, or logically correlates with the execution of $\pi$ is treated as **subjunctively dependent** on $\pi$.
  *   **Logical Correlation:** If another system $S$ outputs $O_S$ based on a decision procedure $D_S$, and $D_S$ is logically equivalent to or functionally determined by the agent's procedure $D_A$, then $O_S$ is subjunctively dependent on $D_A$'s output.
  *   **Degrees of Dependence:** If the correlation is probabilistic (e.g., a noisy simulation), the dependence is weighted by the conditional probability $P(O_S | \text{output of } \pi)$.

  **The Updatelessness Clause:**
  The agent must not update on observations to discard the counterfactual influence of its policy on past predictions, except to the extent necessary to identify which decision situation it is in. The policy is chosen "from behind the veil" of the initial prior.

  ---

  ### Mapping Clauses to Your Cases

  **1. Counterfactual Mugging (Verdict: Pay)**
  *   **Matches FDT.** The predictor's output is subjunctively dependent on your policy. From the prior, the policy "Pay if Tails" yields higher expected utility than "Don't Pay," because it triggers the million in the Heads branch.
  *   **Clause:** Subjunctive Dependence (Prediction).

  **2. Transparent Newcomb (Verdict: One-box if Full, Two-box if Empty)**
  *   **Matches FDT.** This is often misunderstood. In FDT, if you *observe* the box is empty, you have received information that logically implies Omega predicted you would Two-Box. Since Omega is perfect, the prediction is fixed *given the observation*. You cannot subjunctively influence a past event that is already screened off by your current observation.
  *   **Clause:** Updatelessness (limited by logical screening). FDT agrees with your verdict here.

  **3. Smoking Lesion (Verdict: Smoke)**
  *   **Matches FDT.** The lesion causes the taste and the disease, but the lesion does not read your decision procedure. Your decision to smoke is logically independent of the lesion's presence (once the taste is accounted for).
  *   **Clause:** Logical Independence (Causal structure respected).

  **4. Twin Prisoner's Dilemma (Copy) (Verdict: Cooperate)**
  *   **Matches FDT.** The twin runs the exact same source code. Their output is logically identical to yours.
  *   **Clause:** Subjunctive Dependence (Logical Identity).

  **7. Randomization (Verdict: Predictable in Newcomb, Unpredictable in Damascus)**
  *   **Matches FDT.** In Newcomb, you want the predictor to depend on your policy (One-Box). In Damascus, you want Death to be independent of your policy (Randomize).
  *   **Clause:** Sign of Dependence.

  **8. Imperfect Simulation (Mugging) (Verdict: Pay)**
  *   **Matches FDT.** Dependence is probabilistic. If $P(\text{Prediction matches Policy}) = 0.8$, you calculate EV using that weight.
  *   **Clause:** Degrees of Dependence.

