answer: |-
  There is no single canonical term in the literature equivalent to "Collective Effervescence" that isolates this exact configuration. The phenomenon is typically discussed as a mechanism (**Interpersonal Synchrony**) leading to an outcome (**Perceived Similarity** or **Social Bonding**), but the specific *epistemic gap* you are identifying—the dissociation between felt joint intention and actual divergent intent—is usually treated as a side effect rather than a distinct conceptual category.

  Here is the carving you requested, formalizing your intuition into a definable concept.

  ### Concept Name: Entrained Pseudo-Intentionality (EPI)

  **Definition:**
  A social-cognitive state in which **motor synchrony** (rhythmic alignment of movement or vocalization) generates a **phenomenological experience of shared agency** ("we-intentionality"), despite the absence of **semantic or motivational alignment** among participants. EPI is a "top-down" feeling of unity manufactured by "bottom-up" sensory-motor coupling, creating a functional illusion of consensus where none exists.

  ---

  ### Boundary 1: EPI vs. Durkheim's Collective Effervescence

  The distinction lies in the **source of cohesion** and the **type of alignment**.

  *   **Collective Effervescence (Durkheim/Collins):**
      *   **Mechanism:** Emotional contagion and arousal.
      *   **Focus:** Affective energy (the "heat").
      *   **Outcome:** A sense of sacredness and group membership derived from shared *feeling*.
      *   **Requirement:** High arousal; often requires a focal point of emotional intensity.
      *   **Truth Claim:** "We feel the same power."

  *   **Entrained Pseudo-Intentionality (EPI):**
      *   **Mechanism:** Sensorimotor entrainment (predictive coding).
      *   **Focus:** Kinetic alignment (the "grid").
      *   **Outcome:** A sense of cognitive unity derived from shared *timing*.
      *   **Requirement:** Low cost; requires only rhythmic repetition, not emotional intensity.
      *   **Truth Claim:** "We intend the same purpose."

  **The Carving:** Durkheim explains why the group feels *alive*; EPI explains why the group feels *aligned*. You can have EPI without Effervescence (e.g., a bored congregation mechanically swaying), but Effervescence rarely sustains without some element of EPI.

  ---

  ### Boundary 2: EPI vs. Searlean Collective Intentionality

  The distinction lies in the **ontological status** of the "We."

  *   **Collective Intentionality (Searle/Bratman):**
      *   **Status:** Ontological.
      *   **Structure:** "We intend X" is a primitive state, not reducible to "I intend X."
      *   **Commitment:** Requires mutual obligation and shared goals. If you ask participants, their actual commitments map onto the group goal.
      *   **Failure Mode:** Free-riding or defection breaks the intentionality.

  *   **Entrained Pseudo-Intentionality (EPI):**
      *   **Status:** Phenomenological (Illusory).
      *   **Structure:** "I intend to move in time" is misattributed by the brain as "We intend to move together."
      *   **Commitment:** Requires only motor compliance. Individual commitments remain private and divergent (status, pressure, belief).
      *   **Failure Mode:** Cognitive reflection breaks the illusion. If asked to articulate the *content* of the intention, the "We" dissolves into distinct "I"s.

  **The Carving:** Searle describes a **real joint action**; EPI describes a **simulated joint action**. Searle's "We" is in the logic of the action; EPI's "We" is in the feeling of the actor.

  ---

  ### Edges and Limits of EPI

  EPI is a fragile cognitive shortcut. It holds only within specific boundaries:

  1.  **The Synchrony Threshold:** If the rhythmic coupling degrades (people fall out of step, chanting becomes ragged), the predictive coding mechanism fails. The brain stops anticipating the "other" as part of the "self," and the pseudo-intentionality collapses into individual awareness.
  2.  **The Cognitive Interference Edge:** EPI relies on low-level motor processing. If the ritual introduces high-level semantic demands (e.g., "Recite this complex creed while marching"), the cognitive load forces the brain to switch from *motor simulation* to *semantic verification*. Participants will then notice they do not actually agree on the creed, breaking the illusion.
  3.  **The Incentive Divergence Limit:** EPI can mask moderate divergent motives (status vs. belief). It cannot mask extreme divergent motives (e.g., one group wants to protect the object, the other wants to destroy it). If action is required beyond the ritual (e.g., "Now lift this together"), the physical reality of opposing forces will shatter the pseudo-intentionality.
  4.  **The Post-Ritual Decay:** EPI is state-dependent. It persists strongly *during* and immediately *after* the synchrony. Over time, without reinforcement, the phenomenological "We" decays faster than actual social bonds, leaving participants confused about why they felt unified when they act individually.

  **Summary:** You have identified a **motor-cognitive dissociation**. The literature calls the engine **Interpersonal Synchrony**, but it lacks a specific term for the **illusory joint intention** it produces. **Entrained Pseudo-Intentionality** carves out that specific gap.
