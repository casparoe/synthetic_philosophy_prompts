  ### Protocol Spec: The Berkeley National Bank

  **System Objective**
  Maximize network throughput (national industry/labor mobilization) rather than maximizing store-of-value consistency (gold accumulation). The system prioritizes liveness (circulation) over strict safety (hoarding).

  **State Definition**
  *   **Real State:** The productive capacity of the network (land utility + labor power). This is the underlying truth the system replicates.
      *   *Note:* In Berkeley's view, gold is not state; it is merely a legacy synchronization token with high overhead.
  *   **Replicated Ledger:** The circulating bank notes. These are not the value themselves but signed pointers claiming a portion of the Real State.

  **Consensus Mechanism**
  *   **Validator:** A centralized National Bank (the trusted proposer).
  *   **Consensus Rule:** Notes are valid if issued against collateralized Real State (land securities or future tax revenue).
  *   **Finality:** Achieved when the network (public merchants/workers) accepts the note as a valid claim on labor. This is social consensus, not cryptographic proof.
  *   **Fault Model:** The system assumes rational actors motivated by industry. The primary fault condition is loss of confidence (a fork in social consensus) where nodes refuse to accept the pointer as valid.

  **Latency & Settlement**
  *   **Legacy Protocol (Specie):** High latency. Requires physical propagation of heavy tokens (gold/silver) across the network. Throughput is capped by mining/extraction rates and transport speed.
  *   **Berkeley Protocol (Credit):** Low latency. Notes are issued instantly against verified state (land). Settlement is asynchronous; the note circulates while the actual labor redemption happens in the future. This decouples the medium of exchange from the settlement layer.

  **Security Model (Collateral as Slash Condition)**
  *   **Backing:** Every note issued is logically backed by a lien on land or future production.
  *   **Fault Tolerance:** If the Bank issues unbacked notes (overflows the buffer), the collateral ensures redeemability. The land acts as a hard constraint preventing infinite inflation (a denial-of-service attack on the currency's value).
  *   **Trust Assumption:** Users must trust the Bank's accounting of the Real State. Unlike a trustless distributed system, this relies on a privileged administrator secured by tangible assets.

  ***

