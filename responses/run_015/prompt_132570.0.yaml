      *   **Goal:** Clarify Glaucon's actual argument, address the specific philosophical nuances (motivation vs. sanctions, social identity, the definition of "mean," potential circularity), and help the user articulate a counter-argument to their friend.

  2.  **Deconstruct Glaucon's Argument (Republic Book II):**
