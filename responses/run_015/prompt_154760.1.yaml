answer: |-
  Here is a breakdown of the distinct claims smuggled into the slogan "phenomenal consciousness is just an illusion — essentially the refrigerator-light problem applied to introspection."

  Your suspicion is correct: the slogan conflates an **ontological claim** (what consciousness *is*) with an **epistemic claim** (how we *know* it), and uses the refrigerator analogy to bridge them illegitimately. The refrigerator light *exists*; the illusion is only about its *continuity*. If the commenter applies this to consciousness, they must admit consciousness exists (undermining Hard Illusionism) or admit the analogy fails (undermining the explanation).

  Below is the menu of readings. You can quote these directly to force the commenter to specify which version they hold.

  ### Menu of Readings for the "Refrigerator-Illusionism" Slogan

  #### Reading 1: Hard Illusionism (Eliminativism)
  *The claim that phenomenal properties (qualia) do not exist at all; only physical/functional states exist, and we falsely attribute "phenomenality" to them.*
  *   **(a) Status of Properties:** Eliminates phenomenal properties entirely.
  *   **(b) Phenomenal Concept Strategy (PCS):** Required. Must explain why physical states *seem* to have non-physical properties.
  *   **(c) Hard Problem:** Dissolves it (nothing phenomenal to explain).
  *   **(d) First-Person Authority (FPA):** Undermined completely. You are wrong that you feel pain; you are only in a functional pain-state.
  *   **(e) Truth Status:** Substantively defensible but highly counter-intuitive (the "hard pill to swallow").
  *   **(f) Analogy Fit:** **Poor.** In the fridge case, the light exists. In this reading, the "light" (qualia) does not. The analogy borrows rhetorical force from a case of *misjudged existence* to argue for *non-existence*.
  *   **Commenter's Goals:** **Dissolves Hard Problem: YES.** **Undermines FPA: YES.** (But at the cost of making the analogy incoherent).

  #### Reading 2: Introspective Sampling Error (The "Continuity" Illusion)
  *The claim that experience exists, but our belief that it is continuous/ubiquitous is false because we only introspect when cognitive access is active.*
  *   **(a) Status of Properties:** Misrepresents them (they are gappy/intermittent, not continuous).
  *   **(b) Phenomenal Concept Strategy (PCS):** Not strictly needed; relies on cognitive science of attention.
  *   **(c) Hard Problem:** **Relocates it.** Explains why we *think* experience is continuous, but does not explain why the intermittent bits feel like anything at all.
  *   **(d) First-Person Authority (FPA):** Undermined only regarding *temporal profile* (continuity), not occurrence. You are right that you are in pain now, wrong that you were in pain 5 seconds ago.
  *   **(e) Truth Status:** Substantively defensible (consistent with Dennett's "Orwellian" models).
  *   **(f) Analogy Fit:** **Perfect.** This is exactly what the refrigerator analogy describes (light is real, belief in constant presence is false).
  *   **Commenter's Goals:** **Dissolves Hard Problem: NO.** **Undermines FPA: PARTIALLY.** (Fails to dissolve the Hard Problem because the "light" still needs explaining).

  #### Reading 3: Representationalist Reduction (Weak Illusionism)
  *The claim that "phenomenal properties" are just representational properties that seem intrinsic due to the transparency of experience.*
  *   **(a) Status of Properties:** Misrepresents them (relational, not intrinsic).
  *   **(b) Phenomenal Concept Strategy (PCS):** Yes, explains the "gap" between physical function and felt quality.
  *   **(c) Hard Problem:** Dissolves it (reduces phenomenality to representation).
  *   **(d) First-Person Authority (FPA):** Preserved. You are right about the pain; your account of its *metaphysical nature* is just wrong.
  *   **(e) Truth Status:** Standard physicalist position (Tye, Dretske).
  *   **(f) Analogy Fit:** **Weak.** The fridge light is not a representation; it is a causal indicator.
  *   **Commenter's Goals:** **Dissolves Hard Problem: YES.** **Undermines FPA: NO.** (Preserves authority on occurrence, denies authority on metaphysical nature).

  #### Reading 4: Trivial Access Claim (Epistemic Humility)
  *The claim that we can only report on states we have cognitive access to.*
  *   **(a) Status of Properties:** Targets only our judgments/reports.
  *   **(b) Phenomenal Concept Strategy (PCS):** No.
  *   **(c) Hard Problem:** Ignored.
  *   **(d) First-Person Authority (FPA):** Not undermined; merely bounded.
  *   **(e) Truth Status:** Trivially true (tautological).
  *   **(f) Analogy Fit:** **Literal.** But lacks the punch to support illusionism.
  *   **Commenter's Goals:** **Dissolves Hard Problem: NO.** **Undermines FPA: NO.**

  ---

  ### Analysis of the Intermediate Position

  You asked if there is a coherent intermediate position: *granting there is something it is like, but denying it has intrinsic, non-physical, continuously present properties.*

  **Yes, this is coherent.** It is generally classified as **Physicalist Phenomenal Realism** (or Representationalism), not Illusionism.
  *   **Illusionism** (strictly defined, e.g., Keith Frankish) says the *phenomenal properties themselves* are illusory. There is no "what it is like" in the sense the realist means.
  *   **Representationalism** says the "what it is like" is real, but it is constituted by representational content, not intrinsic qualia.

  **Does this collapse into Representationalism?**
  Yes. If you grant "there is something it is like," you are a Realist. If you deny it is non-physical/intrinsic, you are a Physicalist Realist. The only way to be an *Illusionist* is to say that the "something it is like" is a cognitive fiction. The commenter is trying to use the intermediate position to get the benefits of Illusionism (no Hard Problem) without the costs (denying experience exists), but this usually fails because the Hard Problem attaches to *any* "something it is like," even a representational one, unless you explain *why* representation feels like anything (which requires a PCS or Eliminativism).

  ### The Fate of "Incorrigibility of Pain"

  If Illusionism is correct, what happens to the intuition *"I cannot be wrong about whether I am in pain"*?

  1.  **Hard Illusionism (Frankish):** This intuition is a **false belief**. You cannot be wrong that you are in a *functional* pain state (a state that plays the pain role), but you *are* wrong that this state involves a painful *feeling* (qualia). The belief "I am in pain" is true only if parsed functionally; false if parsed phenomenally.
  2.  **Soft Illusionism / Error Theory:** The intuition is a **true belief about a misrepresented state**. You are in a physical state $P$. Your introspective system represents $P$ as having property $Q$ (phenomenality). $P$ does not have $Q$. Your belief "I am in state $P$" is true; your belief "State $P$ has $Q$" is false.

  **Must every plausible illusionist treat the intuition as false?**
  Yes, if the intuition is that "I am directly acquainted with a non-physical quality." No, if the intuition is merely "I am in a state I am disposed to call 'pain'." The commenter must specify which intuition they are attacking. If they attack the latter, they look absurd (denying you know you're in pain). If they attack the former, they haven't undermined first-person authority in the everyday sense, only the philosophical interpretation of it.

  ### Summary for Your Reply

  The commenter's slogan allows them to claim **both** conclusions (dissolving the Hard Problem AND undermining First-Person Authority) only by equivocating between **Reading 1** and **Reading 2**.

  *   To **Dissolve the Hard Problem**, they need **Reading 1** (Qualia don't exist). But this makes the Refrigerator Analogy false (because the fridge light *does* exist).
  *   To make the **Refrigerator Analogy work**, they need **Reading 2** (Qualia exist but are intermittent). But this **fails to Dissolve the Hard Problem** (because intermittent qualia still need explaining).

  **Recommendation:** Ask them to choose: *Is the "light" (phenomenal experience) real or not?*
  *   If **Yes**: The Hard Problem remains (why is there a light?).
  *   If **No**: The analogy fails (the fridge light is real), and you must accept that first-person reports of pain are systematically false (a very hard sell).

  They cannot have the rhetorical safety of the analogy *and* the metaphysical austerity of Eliminativism simultaneously.
