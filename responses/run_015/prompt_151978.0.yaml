ble by someone who grasps the basic problem but does not already know the scholarly taxonomy; no node should ask a respondent to identify themselves by label. The instrument should sort people by what they say about concrete cases—such as whether an AI system should reason differently about population sizes than a human would—not by which position name they recognize. Do not include bibliographies, citations, reading lists, or dependencies on specific publication dates or page numbers.
