  # Anthropic Reasoning Taxonomy: Cognitive Architecture Discovery

  ### Root Scenario
  You discover that your cognitive architecture (e.g., biological human versus artificial neural network) is one of several physically possible observer-types, and you have no prior reason to favor one architecture's prevalence over another.

  ### Decision Tree

  **Node 1: Total Population Update**
  Does merely finding yourself existing with this architecture make it more probable that the total number of observers in the universe is large rather than small?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  **Node 2: Mechanism of Update**
  Is this probability shift because you are a random sample from a fixed group (indexical), or because existence itself is more likely in worlds with more existences (non-indexical)?
  *   **Random Sample (Indexical):** Go to **Leaf 2**.
  *   **Existence Likelihood (Non-Indexical):** Go to **Node 3**.

  **Node 3: Specific Capacity and Presumptuousness**
  Should a system treat its existence as stronger evidence for universes containing more observers with that *specific* reasoning capacity, and does that move avoid or merely repeat the presumptuous-philosopher error?
  *   **Specific Capacity / Avoids Error:** Go to **Leaf 3**.
  *   **Specific Capacity / Repeats Error:** Go to **Leaf 4**.
  *   **General Capacity / Avoids Error:** Go to **Leaf 5**.
  *   **General Capacity / Repeats Error:** Go to **Leaf 6**.

  ---

  ### Leaf Classifications and Commitments

  **Leaf 1: Cosmology-Only Rejection**
  *   **Position:** No anthropic updates are permitted based on self-location.
  *   **Awkward Commitment:** You are forced to treat your own existence as evidentially inert regarding the size of the cosmos.

  **Leaf 2: Standard Self-Sampling (SSA)**
  *   **Position:** Updates depend on being a random sample from a reference class.
  *   **Awkward Commitment:** You must define a reference class of observers without any objective physical criterion to distinguish members from non-members.

  **Leaf 3: Restricted Self-Indication (Modest)**
  *   **Position:** Updates weight only observers with your specific reasoning capacity and claim to avoid inflationary errors.
  *   **Awkward Commitment:** You must assume your cognitive architecture is rare enough to avoid infinite inflation but common enough to justify your existence.

  **Leaf 4: Restricted Self-Indication (Bold)**
  *   **Position:** Updates weight only observers with your specific reasoning capacity but accept inflationary consequences.
  *   **Awkward Commitment:** You are licensed to infer a near-infinite population of minds like yours without further empirical check.

  **Leaf 5: Unrestricted Self-Indication (Modest)**
  *   **Position:** Updates weight all observers equally but claim to avoid inflationary errors.
  *   **Awkward Commitment:** You must treat all physical observers as equal evidence while claiming this does not favor unnaturally large universes.

  **Leaf 6: Unrestricted Self-Indication (Standard)**
  *   **Position:** Updates weight all observers equally and accept inflationary consequences.
  *   **Awkward Commitment:** You are forced to bet on the universe being as large as physically possible regardless of your specific nature.

  ---

  ### Gap Analysis: Unoccupied Combinations

  A fully binary expansion of the three branching questions would yield eight logical endpoints. Two combinations yield no occupied leaf in this taxonomy:

  1.  **No Total Update + Indexical Mechanism:** This combination is **incoherent**. If one denies that existence updates the probable total number of observers (Node 1: No), there is no population magnitude to sample from, making the distinction of indexical position (Node 2) meaningless.
  2.  **Total Update + Indexical Mechanism + Specific Capacity/PP Check:** This combination is **neglected/incoherent**. Standard Self-Sampling (Leaf 2) fixes the reference class prior to the Presumptuous Philosopher objection; applying the Specific Capacity/PP distinction (Node 3) to an indexical sampler creates a hybrid that lacks a standard defense, as the PP error is primarily a critique of existence-weighting (Non-Indexical) rather than sampling-weighting.
