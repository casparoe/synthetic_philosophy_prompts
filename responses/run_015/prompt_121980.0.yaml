answer: |-
  Rule 1 (Field-Specific): Rank only when proposals share a specific field or outcome metric. Where domains differ, decline to rank. Distinguish by stakes: judgment for major programmes, randomization for pilots. The new scale is reporting only, not allocative. This fits Cases 1-5 by treating the scale as non-binding across all precedents.
  Rule 2 (Cardinal Threshold): Rank whenever a shared cardinal scale exists and the difference exceeds measurement resolution. If within error, deadlock. If no shared scale exists, decline to rank. The new scale governs allocation if the difference is resolved. This fits Cases 2-4 perfectly and treats Case 1/5 as pre-scale.
  Rule 3 (Stakes-Sensitive Pluralism): Rank comparable metrics only for major programmes. For pilots or distinct domains, decline to rank. The new scale is irrelevant to commensurability unless formally adopted as an allocation mandate. This prioritizes the stakes distinction seen in Cases 1 and 5 over the metric itself.

  Rule 1 predicts declining to rank because domains differ. It mandates judgment, mirroring Case 1. Rule 3 agrees, prioritizing domain distinction; it mandates judgment due to size. Rule 2 diverges: it mandates ranking because the difference (1.3) currently exceeds resolution (0.2). It predicts funding vocational training. Rule 2 turns on the scale's status: if merely reporting, it collapses into Rule 1. Rules 1 and 3 treat the scale as irrelevant, relying on field specificity or stakes. Thus, the choice is between ranking via cardinal utility or exercising judgment across incommensurable domains.

  Move to decline to rank and decide by judgment. Closest analogue is Case 1 (malaria nets vs. philosophy), where distinct domains precluded ranking. Like Case 1, these proposals offer different benefits. The scale lacks recorded allocative authority; treating it as binding overturns Case 1's precedent. Consistency requires distinguishing comparable metrics (Cases 2-3) from distinct domains (Cases 1, 5). Since these are major programmes, not pilots, judgment is the appropriate tie-breaker. This preserves the committee's established pluralistic approach to value.

  Ranking commits the fund to true metric monism: all value is reducible to wellbeing units, overriding domain distinctions. It makes allocation technocratic, dependent on scale precision. Declining to rank commits us to value pluralism: distinct goods (health vs. livelihood) remain incommensurable. It preserves committee discretion and acknowledges that survey data cannot capture all normative weight. Choosing judgment affirms that allocation is ultimately ethical, not merely arithmetic, keeping the fund responsive to qualitative differences in human flourishing beyond the scale's resolution.

  Propose two small pilots in the same field, e.g., rival deworming trials with overlapping intervals. Rule 1 (Field-Specific) predicts ranking, as metrics match. Rule 3 (Stakes-Sensitive) predicts randomization, as they are pilots. A ruling here reveals whether field similarity or programme stakes drives commensurability. If we rank, field dominates; if we randomize, stakes dominate. This clearly distinguishes the remaining plausible rules after the current decision eliminates Cardinal Threshold.
