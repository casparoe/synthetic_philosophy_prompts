  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** The user is on a university committee rewriting the academic integrity code. They are struggling with the distinction between therapeutic use (accommodated) and enhancement (prohibited) regarding cognitive enhancers (e.g., stimulants for ADHD vs. non-prescribed use).
      *   **Observation:** The user notes a pattern across university policy, health insurance, and anti-doping rules. All distinguish between "restoring normal function" (allowed/funded) and "improving beyond normal" (prohibited/unfunded), even if the physiological effect is identical.
      *   **Task:** The user wants a *reconstruction of the implicit theory* behind this pattern, not a verdict on specific cases.
      *   **Specific Requirements:**
          1.  **Articulate the Distinction:** Analyze the "restoration vs. improvement" baseline. Evaluate three candidate baselines (counterfactual trajectory, species-typical range, welfare/capability threshold). Determine which one the practice is committed to, where they diverge, and whether "normal function" is value-free or value-laden.
          2.  **Press the Cases:** Analyze edge cases that pull in different directions (e.g., two students with identical capacities but different histories; cochlear implants for congenital deafness; the continuum problem). Is the distinction defensible conceptually or just administratively? Is the vagueness fatal?
          3.  **Rebuild/Alternative:** Analyze the "capacity-neutral provision" proposal (rank by benefit, drop treatment/enhancement, focus on unfair positional advantage). Show where it breaks. Provide the best reconstruction of the current system (including cost containment). Compare this to the anti-doping/sports context (zero-sum vs. university context).

  2.  **Part 1: Articulating the Distinction (The Baselines):**

      *   *The Claim:* Institutions claim "Restoration vs. Improvement."
      *   *Candidate 1: Patient's Counterfactual Trajectory.* (Would *this* person be better without the pathology?)
          *   *Problem:* Hard to define "this person" without the pathology. Also, congenital conditions (deaf from birth) don't fit well (no prior state to restore to).
      *   *Candidate 2: Statistical Species-Typical Range.* (Boorse's Biostatistical Theory.)
          *   *Problem:* "Normal" is a bell curve. Where is the cutoff? 1 SD? 2 SD? Also, high normal vs. low normal. If I'm naturally low normal, am I disabled? If I'm high normal, can I enhance?
      *   *Candidate 3: Welfare/Capability Threshold.* (Daniels' "Normal Opportunity Range".)
          *   *Problem:* Value-laden. What counts as flourishing? Who decides?
      *   *Synthesis:* The practice actually relies on a *hybrid*. It uses the **Species-Typical Range** as a proxy for the **Welfare Threshold**, mediated by **Medical Authority**.
      *   *Value-Ladenness:* It is *not* value-free. "Function" is defined relative to social goals (e.g., sitting an exam, working a 9-5). The "normal" is normative.
      *   *Commitment:* The system is most committed to the **Species-Typical Range** *as defined by medical diagnosis*. Why? Because it's administratively tractable. But the *justification* appeals to the **Counterfactual/Welfare** mix (you deserve to be whole, not super).

  3.  **Part 2: Pressing the Cases (The Edge Conditions):**

      *   *Identical Capacities (History Matters):* Student A (ADHD, medicated) vs. Student B (Naturally distractible/low end of normal).
          *   *Defensibility:* Conceptually, it relies on the "Fair Equality of Opportunity" (Daniels). Society owes you protection from bad brute luck (disease), not bad option luck or natural lottery (being naturally less gifted).
          *   *Administrative:* Yes, it's also about gatekeeping. We need a bright line (prescription) to prevent chaos.
      *   *Congenital Conditions (Cochlear Implants):*
          *   *Restoration?* No, it's new capacity.
          *   *Justification:* It brings the person into the "Normal Opportunity Range." It treats the *condition* (deafness) as a pathology relative to the social environment.
      *   *The Continuum (Vagueness):*
          *   *Fatal?* No. Legal and policy distinctions are often vague (sorites paradox) but functional. We need a bright line for enforcement, even if the underlying reality is a gradient. The "Medical Diagnosis" acts as the bright line switch.
      *   *Conclusion:* The distinction is conceptually messy but administratively necessary. It relies on "Medicalization" as the proxy for "Pathology."

  4.  **Part 3: Rebuilding/Alternative (Capacity-Neutral & Sports):**

      *   *Proposal:* Capacity-neutral provision (rank by benefit) + Unfair Positional Advantage test.
      *   *Where it Breaks:*
          1.  *Ends are not fixed:* If I can enhance, my ends change.
          2.  *Positional Advantage:* Condemns *everything* (caffeine, tutoring, wealth). If we ban all advantage, we ban education. If we ban only *some*, we need a principle to distinguish them (which brings us back to therapy/enhancement).
          3.  *Obligation:* Why owe the sick student anything? If we drop the "health" distinction, the obligation to fund/provide dissolves into general welfare.
      *   *Best Reconstruction of Current System:* It is **Fair Equality of Opportunity (FEO)** constrained by **Cost Containment** and **Administrative Feasibility**.
          *   *Metaphysical Costume:* Yes, "Natural Function" is often a mask for "What can we afford to fix without opening the floodgates?"
          *   *Growth Hormone Example:* Short parents = natural lottery (no fund). Deficiency = disease (fund). The biological difference is tiny; the cost/precedent difference is huge.
      *   *Sports vs. University:*
          *   *University:* Goal is learning/certification. Zero-sum? No (mostly). Accommodation is about leveling the playing field to measure *merit*, not just winning.
          *   *Sports:* Goal is winning/entertainment. Strictly Zero-sum.
          *   *Anti-Doping:* More coherent in its own terms (preserving the "spirit of sport" and natural talent test), but relies on the same shaky "natural vs. artificial" distinction. However, in sports, the "positional advantage" argument is stronger because the *point* is the competition itself. In university, the point is education, so accommodation is more defensible.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Philosophical, analytical, precise, respectful of the committee's difficulty.
      *   *Structure:* Follow the three prompts exactly.
      *   *Key Concepts to Integrate:* Norman Daniels (Fair Equality of Opportunity), Christopher Boorse (Biostatistical Theory), The Natural Lottery vs. Brute Luck, Medicalization as Gatekeeping.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Daniels." I need to explain *how* his theory fits the baselines requested. I also need to be careful about the "Capacity-Neutral" critique. The user suspects it collapses; I need to confirm *why* it collapses (the "Tutoring Problem").
      *Refining the Sports Comparison:* Sports are distinct because the *goal* is the inequality of performance (someone must win). University is distinct because the goal is competency. But both use the "Natural Talent" shield. I need to highlight that sports rules are about preserving the *contest*, whereas university rules are about preserving the *measurement of merit*.

  6.  **Final Polish:** Check against the prompt's specific questions.
      *   Did I identify the baseline? (Hybrid: Species-typical as proxy for Opportunity).
      *   Did I address the identical capacity case? (Yes, brute luck vs. natural lottery).
      *   Did I address the continuum? (Yes, administrative bright line).
      *   Did I analyze the capacity-neutral proposal? (Yes, it fails on the tutoring/caffeine front).
      *   Did I address cost containment? (Yes, it's the hidden driver).
      *   Did I compare to sports? (Yes, zero-sum vs. certification).

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a profound policy dilemma because it exposes the fault lines in how liberal societies distribute resources and define fairness. Your committee is struggling because the "restoration versus improvement" distinction is not a natural kind; it is a normative construct dressed in biological clothing.

  Here is a reconstruction of the implicit theory your institutions are running on, an analysis of its breaking points, and an evaluation of the alternative you proposed.

  ### 1. The Baselines: What is Being Restored?

  Your committee is correctly sensing that "restoration" is an incomplete predicate. To restore is to return $X$ to state $Y$. The conflict arises because your three candidate baselines for $Y$ do not align.

  *   **The Patient's Counterfactual Trajectory:** This asks, "Where would *this* individual be without the pathology?" This fails on congenital conditions. A child born deaf has no counterfactual trajectory of hearing to return to. Yet, as you noted, cochlear implants are funded as therapy. If the theory relied solely on this baseline, congenital disabilities would be classified as natural misfortunes to be endured, not medical conditions to be treated.
  *   **The Statistical Species-Typical Range:** This asks, "Is this function within the normal bell curve for humans?" This is the **dominant operational baseline**. It is why short stature due to genetics is not treated, but short stature due to Growth Hormone Deficiency is. The biology is similar; the statistical deviation is the same. But the *cause* determines whether it falls inside or outside the "species-typical design."
  *   **The Welfare/Capability Threshold:** This asks, "Does this prevent the person from accessing the normal range of opportunities?" (This is Norman Daniels' "Fair Equality of Opportunity" account). This is the **dominant justificatory baseline**. It explains why we fund the cochlear implant: not because hearing is statistically average, but because deafness excludes one from the "normal opportunity range" of a hearing society.

  **The Synthesis:**
  The practice is not committed to one view but relies on a **proxy relationship**. Institutions use the **Species-Typical Range** (mediated by medical diagnosis) as a bright-line proxy for the **Welfare Threshold**.

  The system assumes that deviations from species-typical function generally cause deficits in opportunity, and deviations within that range generally do not. This is why the practice is **inherently value-laden**. "Normal function" is not value-free biology; it is biology selected for social relevance. We treat the inability to focus in a classroom as a pathology (ADHD) but the inability to focus on a meditation retreat as a personality trait. The "function" being restored is the capacity to participate in standard social institutions (like a timed exam).

  **Where they diverge:**
  They diverge precisely in your ADHD case.
  *   *Counterfactual:* The undiagnosed student might argue, "My counterfactual trajectory is to fail without this pill."
  *   *Species-Typical:* The diagnosed student is brought from the tail of the distribution to the mean. The undiagnosed student is moved from the mean to the tail of the *enhanced* distribution.
  *   *Welfare:* Both gain welfare. But the system only owes welfare protection against *pathology*, not against *mediocrity*.

  The system is underdetermined here, but it resolves the ambiguity by deferring to **Medical Authority**. The prescription is not proof of biological difference; it is an administrative token that certifies the user has crossed the threshold from "natural lottery" to "medical misfortune."

  ### 2. Pressing the Cases: History, Continuum, and Defensibility

  **The Two Students (Identical Capacity, Different History)**
  You have Student A (ADHD, medicated to normal) and Student B (Naturally distractible, unmedicated). They sit the exam with identical cognitive capacities. The rules favor A. Is this defensible?

  *   **Conceptual Justification:** Yes, under a **Luck Egalitarian** framework. Society distinguishes between "brute luck" (genetic disease, accidents) and "option luck" or the "natural lottery." We owe compensation for brute luck (disease) but not for the natural lottery (being naturally less gifted). Student A is being compensated for a deficit; Student B is simply experiencing the natural distribution of talent. The university's goal is to measure merit *despite* pathology, not to equalize natural talent.
  *   **Administrative Justification:** This is the stronger driver. We cannot adjudicate "natural distractibility" vs. "sub-clinical ADHD" in an exam hall. We need a bright line. The prescription is that line. It is a proxy for "verified brute luck."

  **The Continuum Problem (Cochlear Implants and Vagueness)**
  You note that a cochlear implant for a congenitally deaf child confers a capacity they *never had*. This destroys the "restoration" narrative. It is clearly enhancement relative to the individual's history.

  *   **Is the vagueness fatal?** No. It is merely untidy. Policy requires **categorical distinctions** applied to **continuous realities**. The law does this constantly (e.g., the line between adulthood and childhood).
  *   **The Real Distinction:** The line is not between "repair" and "upgrade." It is between **"treating a recognized pathology"** and **"optimizing a recognized trait."**
  *   **Why it holds:** The cochlear implant treats *deafness*, which is categorized as a pathology relative to the social environment. Growth hormone for short-normal children treats *shortness*, which is categorized as a trait. The biology is secondary to the **social classification of the condition**. The vagueness is tolerated because the alternative (case-by-case analysis of "how much improvement is too much") is administratively impossible.

  **Defensibility:** The distinction is defensible *if* you accept that institutions owe protection against disease but not against mediocrity. It is indefensible if you believe the "natural lottery" is as morally arbitrary as disease. Your current policy quietly rules out the latter view. It accepts that it is fair for one student to be naturally smarter or more focused than another, but unfair for one student to be hindered by a medical condition.

  ### 3. Rebuilding: Capacity-Neutral Provision and the Sports Comparison

  You proposed **Capacity-Neutral Provision**: Rank interventions by benefit to the student's ends, drop the treatment/enhancement distinction, and ban only "unfair positional advantage."

  **Where it Breaks:**
  1.  **The Tutoring/Caffeine Paradox:** If the rule is "no unfair positional advantage," you must ban private tutors, wealthy alumni networks, high-quality high schools, and arguably caffeine and sleep. These all confer positional advantages in a graded competition. If you allow them, you must explain why a stimulant is different. If you say "because the stimulant is internal/chemical," you have reintroduced a metaphysical distinction without a moral difference.
  2.  **Ends are not Fixed:** You cannot rank interventions by "benefit to the student's ends" because ends are adaptive. If Ritalin is available, a student's end becomes "get an A using Ritalin." If it is banned, the end becomes "get an A using coffee." The "benefit" is circular.
  3.  **The Obligation Problem:** If you drop the therapy/enhancement distinction, you lose the justification for *provision*. Why does the university health plan pay for the ADHD student's meds? If it's just about benefit, why not pay for the short student's growth hormone? The obligation to treat rests entirely on the "health need" distinction. Remove that, and healthcare becomes a market commodity, not a right of enrollment.

  **The Best Reconstruction of Current Practice:**
  Your current system is **Fair Equality of Opportunity (FEO) constrained by Cost Containment and Administrative Feasibility.**

  *   **Metaphysical Costume:** Yes, "Natural Function" is often a costume. When the health plan denies laser eye surgery but covers glasses, or denies growth hormone for short-normal boys, it is not making a biological claim. It is making a budgetary one. "Therapy" is a category for "interventions we have agreed to pay for." "Enhancement" is "interventions we have agreed you must pay for yourself."
  *   **The Integrity Code:** The academic integrity code uses the medical distinction as a **gatekeeping mechanism**. It prevents an arms race. If enhancement were allowed, the "normal" baseline would shift, and students would be coerced into taking drugs just to compete (the "race to the bottom"). The prohibition protects students from coercion as much as it protects the validity of the degree.

  **The Sports Comparison:**
  Does this carry over to anti-doping? **Partially, but the rationale is sharper in sport.**

  *   **University:** The goal is *certification of competence*. Accommodation is allowed because we want to measure the student's underlying ability, not their disability. The zero-sum element is weak (many students can get As).
  *   **Sport:** The goal is *winning*. It is strictly zero-sum.
  *   **The Difference:** In university, we accommodate the disabled student to make the competition *fairer* (leveling the field). In sport, we ban the enhanced athlete to keep the competition *meaningful*.
  *   **Coherence:** Anti-doping is actually *more* coherent in its prohibition but *less* coherent in its exceptions.
      *   *Coherent:* It explicitly admits it is protecting the "spirit of sport" (a value-laden concept) and preventing coercion. It doesn't pretend to be about health (many banned substances are harmless).
      *   *Incoherent:* The Therapeutic Use Exemption (TUE) in sport suffers the exact same flaw as your university policy. An asthmatic swimmer uses steroids; a healthy swimmer cannot. The physiological advantage is identical. Sport justifies this by saying the asthmatic is "restored to the starting line," but this relies on the same shaky "natural vs. pathological" baseline.

  **Conclusion for your Committee:**
  You cannot clean up the language enough to make the distinction logical, because it is not a logical distinction; it is a **political and economic one**.

  If you want a clean policy, stop pretending the distinction is about "how the pill works" or "restoring nature." State clearly:
  1.  **Purpose:** The integrity code exists to prevent an arms race that coerces students into medical risk and to ensure grades measure educational attainment rather than access to pharmacology.
  2.  **Proxy:** We use medical diagnosis as a proxy for "legitimate need" because it is the only administratively viable bright line, acknowledging that this creates edge-case inequities (the naturally distractible student).
  3.  **Obligation:** The university accommodates diagnosed conditions because it accepts an obligation to mitigate *pathology*, not to equalize *talent*.

  The "restoration" narrative is a necessary fiction to make the cost containment and gatekeeping palatable. You can keep the fiction, but you should know it is a fiction.
