      *   *Inside View (Case-Based Reasoning):* Focuses on the specific mechanics. How advanced is the manuscript? What is her track record? What are the specific obstacles? What is the quality of the plan?
      *   *Adversarial Collaboration:* Both sides work together to find common ground and precisely isolate disagreements, rather than debating to win.

  3.  **Drafting the Agreed Claims (The Common Ground):**
