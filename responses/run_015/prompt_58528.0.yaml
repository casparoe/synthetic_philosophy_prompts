answer: |-
  **DEPARTMENT OF PHILOSOPHY**
  **ADVERSARIAL COLLABORATION REPORT: LEAVE REQUEST EVALUATION**

  **To:** The Tenure and Leave Committee
  **From:** The Adversarial Collaboration Working Group (Advocate A: Outside View; Advocate B: Inside View)
  **Subject:** Epistemic Framework for Evaluating Junior Faculty Book Leave Extension

  **Preamble**
  In accordance with the department's commitment to rigorous decision-making, the undersigned advocates have engaged in an adversarial collaboration to evaluate the request for an additional semester of leave. Rather than debating to win, our goal was to isolate the epistemic principles governing this decision. We have reached consensus on the general framework for evaluating such requests but retain specific disagreements regarding the application of these principles to the current case. The following document represents our joint findings.

  ### I. Jointly Affirmed Epistemic Principles

  Both advocates endorse the following claims as the standard for evaluating this and future leave requests:

  1.  **The Primacy of the Prior:** Base rates (the statistical frequency of similar outcomes in relevant reference classes) constitute the rational starting point (the prior probability) for any prediction regarding project completion. Ignoring base rates in favor of anecdotal detail constitutes the planning fallacy.
  2.  **The Condition for Override:** Case-specific details (the "inside view") may rationally override base rates only if those details are independently verifiable, causally relevant to completion, and sufficiently strong to update the prior probability to a decisive degree.
  3.  **Calibration of Confidence:** A candidate's self-reported confidence is data, not a conclusion. Responsible confidence requires calibration against the candidate's past track record of meeting deadlines and external assessments of the work's current state.
  4.  **The Asymmetry of Error:** We acknowledge that the costs of error are not symmetric. Granting leave that results in non-completion wastes departmental resources and delays hiring; denying leave that results in successful completion elsewhere damages the colleague's career and the department's reputation. Both risks must be explicitly weighed.
  5.  **Irreducible Uncertainty:** No decision procedure can eliminate the risk of failure. The goal of this framework is not certainty, but the minimization of predictable epistemic errors (e.g., over-optimism or excessive skepticism).

  ### II. Table of Residual Disagreements

  While we agree on the principles above, we disagree on their application to the specific request at hand. The following table isolates these disagreements, identifies the "cruxes" (evidence that would change a side's mind), and proposes concrete tests to adjudicate them.

  | Point of Contention | Endorsing Side | The Crux (What would move this side?) | Agreed Evidentiary Test / Record | Divergent Predictions (Recorded in Advance) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Definition of the Reference Class**<br>Which statistical group best predicts the outcome? | **Outside View**<br>*(Advocate A)* | If the candidate can be shown to belong to a "high-completion" sub-class rather than the general "junior faculty" class. | **Review of Departmental Records (Past 15 Years):**<br>Isolate cases where junior faculty took >1 semester leave for a first book. Compare completion rates of those with <50% draft vs. >80% draft at time of request. | **Outside View:** The data will show that even with advanced drafts, extension requests correlate with >40% delay beyond the new deadline.<br>**Inside View:** The data will show that for candidates with external press interest, delay rates drop to <10%. |
  | **2. Evidentiary Weight of Self-Reported Confidence**<br>Does the candidate's assurance count as strong evidence? | **Inside View**<br>*(Advocate B)* | If the candidate's confidence is shown to be uncalibrated against their own history of deadline adherence. | **Timeline Audit:**<br>Compare the candidate's past 3 major project timelines (e.g., dissertation, job market paper) against their initial estimates. | **Outside View:** The audit will reveal a consistent optimism bias (estimates were <70% accurate), rendering current confidence unreliable.<br>**Inside View:** The audit will show that while early career estimates were optimistic, recent tenure-track performance shows high calibration. |
  | **3. The Cost of the "False Negative"**<br>Is it worse to deny a successful leave or grant a failed one? | **Inside View**<br>*(Advocate B)* | If granting the leave creates a precedent that demonstrably harms the department's ability to recruit or retain other faculty. | **Precedent Analysis:**<br>Survey of peer departments regarding leave extensions for junior faculty and subsequent tenure success rates. | **Outside View:** Peer data will show that extensions rarely improve tenure outcomes and often signal productivity issues to the market.<br>**Inside View:** Peer data will show that denying leave for first books correlates with higher attrition and lower quality tenure files. |
  | **4. Verification of "Near Completion"**<br>What constitutes sufficient proof of the manuscript's state? | **Outside View**<br>*(Advocate A)* | If an external, disinterested party confirms the manuscript requires only minor revision rather than substantial writing. | **External Reader Report:**<br>Submit the current draft to a senior scholar (outside the university) for a blinded estimate of "months to publish-ready." | **Outside View:** The reader will estimate >6 months of work remaining.<br>**Inside View:** The reader will estimate <3 months of work remaining. |

  ### III. Procedural Recommendation

  Based on the agreed principles and the identified disagreements, the Collaboration Group recommends the Committee proceed as follows:

  1.  **Conduct the Timeline Audit (Disagreement 2)** and the **Departmental Records Review (Disagreement 1)** immediately. These are internal costs with high epistemic value.
  2.  **Condition the Leave:** If the leave is granted, it should be contingent on the **External Reader Report (Disagreement 4)**. If the reader estimates more than one semester of work, the leave should be converted to a reduced teaching load rather than full leave.
  3.  **Record the Predictions:** The predictions listed in the table above should be sealed and opened in 18 months to evaluate the department's decision-making accuracy, regardless of the immediate vote.

  ***

  **Signed,**

  _________________________
  **Advocate A (Outside View)**
  *Focus: Reference Class Forecasting & Risk Management*

  _________________________
  **Advocate B (Inside View)**
  *Focus: Causal Mechanisms & Individual Context*

  **Date:** October 26, 2023
