answer: |-
  **The Case**

  In the Philosophy Department, Dr. Vance needs to leave town for a family emergency on the 14th. She logs into the Departmental Coverage Log, types "I promise I'll cover your Tuesday lecture, Aris," and hits 'Commit.' The system is designed such that this entry simultaneously messages the addressee and alters the official duty roster. The roster updates instantly, marking Vance as 'On Duty,' but the message to Aris is lost to a gateway error and never arrives. Aris, seeing no notification and never checking the log, assumes he is teaching. Vance, assuming the system notified Aris, does not attend. The class is cancelled, and students file complaints. Vance is sincere, has the standing to cover, and is under no duress; Aris reads the language of the log; the message is unambiguous.

  ***

  **Framework Analysis**

  **1. Austin's Felicity Framework**
  For Austin, an illocutionary act is not merely the utterance of words but the performance of an action secured through convention and uptake. In *How to Do Things with Words*, he classifies failures into **misfires** (where the act is not achieved) and **abuses** (where the act is achieved but insincerely). Because Vance is sincere, this cannot be an abuse. However, Austin insists that for an illocutionary act to be "happily" performed, it must take effect in the audience (uptake). Since Aris never receives the communication, the conventional procedure is not consummated between the relevant parties. The institutional log does not count as the "hearer" in Austin's interpersonal taxonomy.
  *   **Category:** Misfire (specifically, a failure of uptake).
  *   **Verdict:** No promise was made (illocutionarily).

  **2. Searle's Constitutive-Rule Analysis**
  Searle distinguishes between the performance of the speech act and its communicative success. He outlines four conditions: **Propositional Content** (future act of speaker), **Preparatory** (speaker can do it, hearer prefers it), **Sincerity** (speaker intends to do it), and **Essential** (utterance counts as undertaking an obligation). Vance meets all four: she stated a future act, had the ability, was sincere, and used a convention (the Log) that counts as undertaking an obligation. Searle argues that while uptake is required for *communication*, it is not required for the *performance* of the illocutionary act itself. The act is complete once the rules are satisfied, regardless of causal consequences.
  *   **Conditions Met:** All four.
  *   **Verdict:** A promise was made (act performed), though communication failed.

  **3. Gricean Intention-Recognition**
  On a Gricean account, meaning and illocutionary force depend on the audience recognizing the speaker's reflexive intention (the intention that the audience recognize the intention). Vance expressed an intention to undertake an obligation, but she did not *communicate* it, because the reflexive loop was broken; Aris could not recognize an intention he never encountered. The act of promising, understood as a communicative endeavor, requires this mutual recognition to generate the normative force between agents.
  *   **Distinction:** Intention expressed (yes) vs. Intention communicated (no).
  *   **Verdict:** No communicative promise was made.
  *   **Normative Residue:** Vance may retain a *moral* obligation based on her own intent and the reliance of the institution, but the *interpersonal* obligation to Aris never crystallized.

  **4. Practice-Based / Scorekeeping View**
  On a Brandomian scorekeeping model, commitments are deontic statuses attributed by the community according to the rules of the practice. What matters is the public standing of the utterance within the game being played. The Departmental Coverage Log is the scorecard. Once Vance hit 'Commit,' the community's record updated to assign her the commitment and relieve Aris. Aris's ignorance is a failure of his own scorekeeping (checking the log), not a failure of the commitment's existence. The obligation exists because the practice says it exists.
  *   **Verdict:** A promise was made (commitment incurred).
  *   **Condition:** The practice must treat the Log entry as authoritative over individual notification.

  ***

  **Closing Analysis**

  **1. Structural Feature and Pivotal Sentence**
  The single structural feature doing the work is the **decoupling of institutional registration from interpersonal awareness**. The case turns entirely on this sentence: *"The roster updates instantly, marking Vance as 'On Duty,' but the message to Aris is lost to a gateway error and never arrives."* This creates a gap where the "public score" changes while the "private hearer" remains unchanged, forcing frameworks to choose between social record and interpersonal uptake.

  **2. Ablation Tests**
  *   **Test A (Remove Channel):** Vance sends an email that goes to spam; no roster update occurs.
      *   *Changes:* The **Scorekeeping** verdict flips to **No**. Without the public record update, there is no community attribution of commitment.
      *   *Steady:* Austin, Searle, and Grice hold their verdicts (Austin/Grice say No, Searle says Yes).
      *   *Result:* The case collapses into a standard "unread email" dispute, losing the tension between institutional fact and interpersonal knowledge.
  *   **Test B (Restore Channel + Delayed Uptake):** The system works, but Aris reads the message the next morning.
      *   *Changes:* The **Austin** verdict likely flips to **Yes**. Austin allows for uptake to secure the act; delayed uptake validates the act retroactively or completes it upon reading.
      *   *Steady:* Searle and Scorekeeping remain **Yes** (act was done/recorded immediately). Grice becomes **Yes** (intention recognized).
      *   *Result:* The split narrows significantly, reducing the pedagogical value regarding the nature of *unheard* obligations.

  **3. Defenses of "Wrong" Frameworks**
  *   **The Austinian Defense:** An Austinian might argue the scenario rigs the definition of "hearer." In a bureaucratic context, the *institution* is the primary addressee of a roster commitment, not the colleague. If the institution (via the Log) secured uptake, the illocutionary act *did* misfire only if you insist on a purely interpersonal model where bureaucracy doesn't count as a convention.
  *   **The Searlean Defense:** A Searlean might argue the scenario conflates the *obligation* with the *liability*. Vance incurred the obligation (Searle: Yes), but because Aris didn't know, she cannot be held *liable* for the misunderstanding in the same way. The framework isn't wrong; it correctly identifies that the normative status exists even if the practical coordination failed.
