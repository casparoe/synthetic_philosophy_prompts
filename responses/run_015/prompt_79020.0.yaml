answer: |-
  This is a profound and classic problem in non-consequentialist ethics, often referred to as the problem of **complicity** or **cooperation in evil**. You have correctly identified that if Anscombe's absolute prohibition (1) is applied without nuance to the chain of causality, it leads to a conclusion (8) that violates our moral intuitions about degrees of guilt.

  To preserve Anscombe's core insight (that Truman committed murder) without accepting the absurdity that every voter is a murderer, you do not need to abandon (1). Instead, you must refine **Premise (4)** and reject **Premise (7)** by introducing distinctions found within the very tradition Anscombe defends (Catholic moral theology and Aristotelian action theory).

  Here is an analysis of where to cut the argument, the tools required to do it, and the costs involved.

  ### 1. The Primary Cut: Rejecting/Refining Premise (4)

  Premise (4) states: *If Truman murdered, then anyone who intentionally participates in a plan to kill the innocent as a means to an end is also a murderer.*

  This premise is too broad because it conflates **Formal Cooperation** with **Material Cooperation**. In the tradition Anscombe writes from, this distinction is vital for preserving moral agency without dissolving it into collective guilt.

  *   **Formal Cooperation:** You share the *intention* of the principal agent. You will the evil act as a means to an end. (This applies to Truman).
  *   **Material Cooperation:** You provide the means or conditions for the act, but you do not share the *specific intention* to kill the innocent as a means. You may foresee it, but it is not the object of your will.

  **How to fix (4):**
  Replace (4) with: *If Truman murdered, then anyone who **formally cooperates** (shares the murderous intention) is also a murderer. Those who only **materially cooperate** bear a different, lesser, or potentially no moral guilt depending on proximity and necessity.*

  **The Cost:**
  The cost of this move is that you must accept a rigorous, somewhat technical account of intention. You can no longer say "I knew it would happen, so I intended it." You must distinguish between *intending a state of affairs* (victory) and *intending the specific means* (massacre).
  *   **Truman:** The death of civilians was the *method* of coercion. He intended it.
  *   **The Pilot:** This is harder. If the pilot aimed at a city center knowing the goal was terror, Anscombe might argue they *are* formally cooperating. However, one could argue the pilot intends "follow orders to end war" and foresees "civilian death," whereas Truman intended "civilian death to end war." The distinction is thin, but it exists in the *object of the choice*.
  *   **The Scientist:** They intend "create a weapon." They foresee "weapon may kill civilians." They do not choose *this* target. This is usually remote material cooperation.
  *   **The Voter:** This is remote material cooperation. They intend "support my country/government." They do not intend specific war crimes.

  ### 2. The Secondary Cut: Rejecting Premise (7)

  Premise (7) claims voters intentionally contributed to the policy that killed the innocent. This is the weakest link empirically and philosophically.

  **Why reject (7):**
  Voting for a government is a general authorization to govern, not a specific intention to commit specific acts. Unless a voter voted *specifically because* the candidate promised to bomb civilians, they do not intend the bombing. They may foresee that wars happen, but they do not will the specific murder of the innocents in Hiroshima as a means.

  **The Cost:**
  Rejecting (7) costs you the ability to blame "the people" for the specific crimes of their leaders. It isolates guilt to the decision-makers and direct agents. Some find this politically unsatisfying (it lets the populace off the hook for enabling tyrants), but it is necessary to avoid the conclusion that democracy makes everyone equally guilty of every state action.

  ### 3. Addressing Your Fear: "Letting Truman Off the Hook"

  You wrote: *"I do not see how to draw that line without letting Truman off the hook too, since he also did not personally drop the bombs."*

  This is the crux of the matter. The distinction between Truman and the Pilot/Voter is not **physical causality** (who pushed the button), but **moral causality** (who willed the act).

  *   **Truman:** His act was the *choice*. In Anscombe's view, the moral act is primarily an act of the will. Truman's will embraced the killing of innocents as the method of success. He is the "principal."
  *   **The Pilot:** Their act was *execution*. If they had no moral choice (duress), their guilt is mitigated. If they did have a choice, they are accessories. But an accessory is not always identical in guilt to the principal.
  *   **The Voter:** Their act was *authorization of office*, not authorization of crime.

  You can keep Truman as a murderer because he *chose the description of the act* under which the bombing occurred ("We will bomb civilians to force surrender"). The pilot merely executes the physical motion; the voter merely selects the agent. Truman is the only one who necessarily adopted the evil description as his plan.

  ### 4. What if you must give up (1)?

  If you find the distinctions above too slippery or legalistic, and you feel compelled to reject (1), here is what that costs you.

  **Premise (1):** *Choosing to kill the innocent as a means to one's ends is always murder.*

  **The Replacement:**
  You would replace (1) with a **Proportionality Principle**: *Choosing to kill the innocent as a means is permissible if the good achieved sufficiently outweighs the evil done.* (This is essentially consequentialism or a utilitarian Just War theory).

  **The Cost:**
  1.  **Loss of Justice:** Anscombe's main point in her protest was that "justice" is not a calculation. If you drop (1), you admit that innocent people can be *justly* murdered if the math works out. You lose the concept of "rights" that cannot be violated.
  2.  **Epistemic Burden:** You must now claim to know the future. Truman claimed the bombings saved lives. To judge him, you must know counterfactually whether an invasion would have cost more lives. If you drop (1), your judgment of Truman depends entirely on historical data that is contested. If you keep (1), his justification is irrelevant; the act itself was forbidden.
  3.  **Moral Luck:** If you drop (1), Truman is a murderer if the war would have ended anyway, but a hero if the invasion would have cost a million lives. His moral status depends on facts outside his control. If you keep (1), his moral status depends on his choice, which was within his control.

  ### Summary Recommendation

  To maintain the integrity of Anscombe's protest without collapsing into absurdity:

  1.  **Keep (1) and (3).** This preserves the deontological absolute that protects innocent life from being calculable.
  2.  **Reject/Refine (4).** Distinguish between *Formal Cooperation* (sharing the murderous intent) and *Material Cooperation* (aiding without sharing the intent).
  3.  **Reject (7).** Voting is too remote to constitute an intention to kill specific innocents.
  4.  **Accept a Graded Guilt.** You must accept that while Truman is a murderer, the scientist is perhaps negligent, and the voter is likely innocent of *this* specific crime.

  **The Price You Pay:**
  The price of keeping (1) is that you must adopt a **rigorous psychology of intention**. You cannot define intention simply as "foresight of consequences." You must define it as "what I choose to bring about as my method." This requires careful philosophical work to distinguish Truman (who chose the death as a method) from the Scientist (who chose to make a tool) and the Voter (who chose a representative).

  If you are unwilling to make those fine distinctions, you will be forced to accept (8) (everyone is guilty) or reject (1) (murder is sometimes okay). But Anscombe would argue that (8) is only absurd if you misunderstand the nature of human agency. We are not all equally responsible for the acts of our leaders, precisely because we do not all will what they will.
