  When iron failed to hold the shoe in place,
  The beast fell lame and lost the urgent race,
  The rider missed the field where banners flew,
  Thus ruin marched in plain and direct view.
  So fell the crown upon the bloody grass,
  One link undone, the chain of fate grew cold,
  As if the future were a pane of glass,
  By single stones of chance distinctly rolled.

  Yet dynamical laws dissolve the line,
  Where tiny shifts expand in vast array,
  No single past we may rightly define,
  For branching histories go wild astray.
  So yield the singular path the mind has bred,
  Nor trust small causes map one future's spread.
