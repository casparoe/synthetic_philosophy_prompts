  *   **Case 3 (Local):** $P$ rises drastically (e.g., $1/50$). Even with lower total stake, $P \times \text{Stake}$ exceeds cost easily. **Verdict: Yes.**
  *   **Case 4 (Rigged):** $P(\text{pivotal}) = 0$. Additionally, there is a negative utility term ($L$) for legitimizing fraud. $\text{Net} = -L - \text{Cost}$. **Verdict: No (Harmful).**
  *   **Case 5 (Ignorant):** If you hold no view, the Expected Welfare Impact is $0$ (a coin flip averages to zero). $\text{Net} = 0 - \text{Cost}_{\text{vote}}$. Since marking a ballot takes effort, Cost $> 0$. **Verdict: Leave blank.**

