  Here is the machinery of your friend's reasoning, the alternative that fits the data, and the prediction for your case.

  ### 1. The Rule He Is Running: Net Expected Social Welfare (NESW)

  Your friend is acting as a **Act Utilitarian with Aggregate Valuation**. He does not value the vote by what it does for *him*, but by what it does for the *polity*, discounted by the probability of his vote being the deciding one.

  **The Formula:**
  $$ \text{Value} = P(\text{pivotal}) \times \sum (\text{Welfare Impact}_i \times \text{Population}) - \text{Cost}_{\text{vote}} - \text{Cost}_{\text{info}} $$

  **How it fits the record:**
  *   **Case 1 (National):** $P \approx 10^{-7}$. Population $= 90 \times 10^6$. Welfare Diff $\approx \$300$/head. Total Stake $\approx \$27$ Billion. Expected Benefit $\approx \$2,700$. Cost $= \$20$. Net $> 0$. **Verdict: Yes.**
