  *   **Summary:** **Take the call, then vote. Do not read the documents.**

  ### 2. The Alternative Rule: Threshold Competence (TC)

  This rule fits all five verdicts but relies on **epistemic validity** rather than linear arithmetic. It posits that a vote is a signal of competence; if the signal is too noisy, it has negative value regardless of the arithmetic on known issues.

  **The Formula:**
