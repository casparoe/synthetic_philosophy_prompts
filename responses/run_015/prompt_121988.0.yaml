  **DIRECTORATE OF NARRATIVE CONTINUITY**
  **Request for Proposals: Commissioned Survey History (*The Arc of Necessity*)**
  **Reference: DNC-2024-WHIG-01**

  **1. Objective and Trajectory**
  The Directorate invites submissions for a definitive survey history establishing the causal inevitability of the present constitutional order. Applicants must demonstrate that selected events constitute a unified line of causation rather than a sequence of contingencies. Ancestry is to be offered in place of explanation; where a precursor resembles the modern outcome, causal priority shall be assumed. The narrative must terminate at the current administrative year. Any branch of inquiry failing to terminate at the current administrative year will be classified as a siding and eligible for removal under Clause 2. The goal is not merely to record what happened, but to ratify why it had to happen this way.

  **2. Methodological Instruments**
  Proposals must utilize the following standardized metrics to ensure structural integrity:
  (a) **Arrival Coefficient (AC):** A measure of what share of the narrative can be plotted as leading directly to the present. Minimum acceptable AC: 0.85.
  (b) **Abridgement Dividend:** Pages saved by deleting dead ends, converted into efficiency credits. Simplicity produced by compression shall be reported as a discovery about the past, not an editorial choice.
  (c) **Licence for Retroactive Adoption:** Permission to transfer moral credit from past strugglers to present beneficiaries, assuming the present inherits the authority of struggles most of its members would probably have lost. Applicants should modernize past actors so that they seem more contemporary than they were; anachronism is preferred to alterity.

  **3. Character Assessment and Verdicts**
  Historical actors shall be cast into friends and enemies of progress. Enemies are to be scored as having contributed nothing and reduced to a dummy that acts as a better foil to the grand virtues. A history is incomplete unless it delivers a verdict. Applicants should avoid ambiguity regarding who was right. Pressure to modernize past actors is mandatory to ensure recognizability. The transfer of moral credit must be explicit: the present stands on the shoulders of giants, even if those giants would not recognize the present.

  **4. Institutional Oversight**
  Dr. Aris Thorne, Panel Chair, notes: "We seek a timeline that withstands the erosion of doubt. Continuity is a deliverable."
  However, per regulatory transparency, the following objection from Dr. Elara Vance, Keeper of Discontinued Pasts, is appended: "The archive itself was curated by the winners. A selection rule that keeps only what leads somewhere cannot then discover that the past was simple." This objection is noted for file completeness but does not alter scoring.

  **5. Scoring Rubric**
  | Criterion | Weight | Requirements |
  | :--- | :--- | :--- |
  | Narrative Straightness | 40 pts | Minimize curves; maximize inevitability. |
  | Arrival Coefficient | 30 pts | Must exceed 0.85 threshold. |
  | Abridgement Dividend | 20 pts | High yield on deleted sidings. |
  | Moral Clarity | 10 pts | Unambiguous verdicts on all actors. |

  **6. Notes to Applicants (FAQ)**
  **Q: I am a declinist who writes the same story with the sign flipped.**
  A: You are eligible under the Compliance Appendix for Reverse Teleology. Ensure your nadir aligns with our present for comparison purposes. The structure must remain intact even if the valuation inverts.
  **Q: I am a debunker whose narrative of exposures has its own hero arriving at the end.**
  A: Permitted, provided the debunker occupies the position of progress. The hero must still arrive.
  **Q: Can I include pasts that do not lead to us?**
  A: Fine Print 14.b stipulates that the route has to arrive at *someone's* present. Most of the world's pasts are therefore classifiable as sidings. Sidings incur storage costs and are discouraged.

  **7. Compliance Appendix**
  Applications claiming exemption from Clause 3 due to commitment to contingency must submit Form C-99 (Declaration of Irrelevance). These submissions will be archived unread to preserve the integrity of the main sequence. The Directorate remains gently disappointed by applicants who insist on contingency.

  **8. Submission Deadline**
  Proposals due by the end of the current epoch. Late submissions implying historical openness will be rejected.
