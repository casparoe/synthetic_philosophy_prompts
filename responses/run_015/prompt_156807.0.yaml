answer: |-
  1. the exam question

  **Essay Question (25 Marks)**

  In *Of Suicide*, Hume argues that ending one's life does not violate our duty to society because we are not assigned a specific station by Providence that we must fill. Critically evaluate whether this argument relies on treating individuals as fungible social units. If so, does this commitment clash with Hume's broader sentimentalist moral theory, which grounds virtue in sympathy and approval? 

  Finally, consider an "exit-license" model where society permits suicide only when an individual's net social contribution is negative. Does Hume's reasoning support this model, undermine it, or remain orthogonal to it? Justify your position. 

  *(Suggested length: 1100-1300 words. Time allowed: 90 minutes.)*

  ***

  2. a model answer

  Hume's defense of suicide in *Of Suicide* rests on dismantling the claim that we owe our lives to society. He argues that since Providence hasn't assigned us a specific post, leaving life isn't deserting a station. But this implies replaceability. If I leave, someone else can take my place. This sounds like fungibility. If individuals are interchangeable units, then my death doesn't harm the social whole any more than losing a single soldier harms an army.

  However, Hume is a sentimentalist. Morality comes from sympathy, not abstract rules. If suicide causes grief to friends, it's wrong. But if I'm a burden, sympathy might approve my exit. The tension lies in balancing utility with sentiment. The fungibility argument leans heavily on utility—calculating social loss—whereas sentimentalism focuses on the feelings of those involved. If society views me as a replaceable cog, sympathy might be diminished. Yet Hume insists our duty to society is limited by our capacity to be useful. Once misery outweighs utility, the duty dissolves.

  Now, consider the exit-license. This model says you can only go if you're a net negative. This treats life as a debt repayment scheme. Hume would likely hate this. He argues that if life is a burden, staying alive helps no one. Forcing someone to stay just to balance a social ledger treats them as a tool, not a sentient being capable of misery. The license model assumes a duty to maximize social utility regardless of personal suffering. Hume says personal misery matters. If I'm miserable, my utility is gone. Staying alive just to pay off a social debt violates the principle that life is valuable only if it's bearable.

  Furthermore, the fungibility point undermines the license. If people are replaceable, my negative contribution isn't unique. Society loses nothing I can't be replaced for. The license model assumes my specific contribution matters too much. Hume thinks society is a big machine; one cog breaking doesn't stop it. Therefore, Hume's reasoning undermines the exit-license model. It relies on a rigid accounting of social duty that Hume explicitly rejects in favor of individual relief from misery. 

  While he admits we have duties to society, they cease when life becomes a burden. The license model extends duty beyond that limit. There is a tension with sentimentalism, though. If society sympathizes with the loss of a worker, maybe they disapprove. But Hume prioritizes the agent's sentiment about their own misery. The license model ignores the agent's feelings, focusing only on the social ledger. That's too cold for Hume. In conclusion, while Hume's argument flirts with fungibility, it ultimately protects the individual from being sacrificed for social gain. The exit-license model sacrifices the individual for the social ledger. Hume rejects this. He undermines the model by showing that duty to society has limits defined by personal capacity for happiness, not net contribution scores.

  ***

  3. a marking scheme

  **1. Reconstruction of Hume's "Duty to Society" Argument (5 marks)**
  *   **Must hit:** Clearly explain Hume's claim that we hold no specific station assigned by Providence and thus abandoning life isn't desertion.
  *   **Typical mess up:** Candidates confuse this with his argument against duty to God or Providence itself.

  **2. Analysis of Fungibility/Replaceability (5 marks)**
  *   **Must hit:** Explicitly address whether Hume's "no specific station" claim implies individuals are interchangeable units within the social whole.
  *   **Typical mess up:** Students assert fungibility without explaining how it connects to the "station" argument.

  **3. Tension with Sentimentalist Moral Theory (5 marks)**
  *   **Must hit:** Discuss whether treating people as fungible units clashes with morality grounded in sympathy, sentiment, and approval rather than cold calculation.
  *   **Typical mess up:** Treating Hume as a pure act-utilitarian and ignoring the role of sympathy/sentiment entirely.

  **4. Explanation of the "Exit-License" Model Implications (5 marks)**
  *   **Must hit:** Define the model clearly (suicide permitted only when net contribution is negative/debt owed) and its moral logic.
  *   **Typical mess up:** Vaguely describing the license as "government permission" without noting the negative contribution constraint.

  **5. Final Verdict (Supports/Undermines/Orthogonal) (5 marks)**
  *   **Must hit:** Take a clear stance on whether Hume supports or undermines the model, justified by his views on misery vs. utility.
  *   **Typical mess up:** Sitting on the fence ("he kind of does both") without providing a decisive philosophical justification.

