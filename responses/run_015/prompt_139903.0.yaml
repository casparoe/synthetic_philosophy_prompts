answer: |-
  ### Preliminary Analysis: Strengths and Vulnerabilities

  **Where the View is Stronger Than It Looks:**
  The speaker's strongest asset is the anti-regress argument. Generalists often struggle to explain how a principle is applied without invoking another rule for that application, leading to a regress that particularism avoids by grounding competence in perception-like expertise. Additionally, her concession on supervenience is strategically clever; it allows her to accept the metaphysical dependency of the moral on the non-moral without conceding the codifiability that generalists demand, making her position hard to disprove via standard supervenience arguments.

  **Where the View is Genuinely Vulnerable:**
  The view faces significant pressure on normativity and epistemology. If moral judgement is akin to perception or improvisation without underlying principles, it becomes difficult to explain how we learn morality in novel situations (like the AI case) or how we can critique entire cultural practices (like the Alternative Community case) without smuggling in general standards. Furthermore, the distinction between "silencing" and "outweighing" risks being ad hoc unless there is a criterion for it, and the view risks unfalsifiability if every counter-example can be dismissed as a contextual nuance. Finally, the explanatory power of "wrong-making features" is thin if those features do not carry valence across cases.

  ***

  ### Q&A Questions

  **1. The Anti-Regress Move**
  You argue that any generalist principle still has to be applied, and application is not itself rule-governed on pain of regress, but does this claim concern the content of moral judgement or only the psychology of applying rules?
  *   **Likely Reply:** She will insist it is about content, arguing that if application is uncodified, the content judged must be particular rather than general.
  *   **Follow-up:** If the content is particular and uncodified, what distinguishes the judge's judgement from a hunch, and why should we expect judges to converge if there is nothing general for them to be right or wrong about?

  **2. Default Reasons and Silencing**
  You allow that some considerations are default reasons unless silenced, but can the difference between a reason's being silenced and its being outweighed be marked without some account of what silences what?
  *   **Likely Reply:** She will reply that silencing is a fact about the individual case rather than a rule, dependent on the specific configuration of features.
  *   **Follow-up:** What makes it the same phenomenon across cases and how are we to recognise it without a criterion, or does this distinction collapse into a general principle about silencing conditions?

  **3. The Explanatory Question**
  When you say that the wrong-making features of an action are simply these features in this case, what work is the "making" doing given that the very same feature can be inert or reversed in a near-identical case?
  *   **Likely Reply:** She will distinguish what makes an action wrong in this case from the claim that there is no difference in verdict without some difference in the base.
  *   **Follow-up:** Can the first notion do any explanatory work at all, or does it collapse into the second, leaving us with no explanation of why this feature matters here but not there?

  **4. The Supervenience Concession**
  You concede supervenience in the minimal sense, but since there appear to be indefinitely many truths of the form that anything with such-and-such a base is thus-and-so morally, is your quarrel with the generalist therefore only about what counts as a principle?
  *   **Likely Reply:** She will deny the dispute is verbal, insisting that these truths do not play the explanatory or deliberative role principles are supposed to play.
  *   **Follow-up:** What test would show the dispute is substantive rather than terminological, since both sides agree on the supervenience base and the verdict?

  **5. The Framing-Problem Worry**
  If the valence of a feature is holistically sensitive to the rest of the case, then competence in a new configuration seems to require knowing how each feature behaves in combination with every other, which threatens to make moral judgement computationally intractable.
  *   **Likely Reply:** She will say that the skilled judge simply perceives which features are salient without computing combinations.
  *   **Follow-up:** Is this trained perception of salience anything other than a principle that is real but not accessible to the agent, and what would in principle settle whether the content of her judgement is general?

  **6. The Alternative Community**
  Imagine a community exactly like ours except that some feature that operates here as a default reason operates there as no reason at all, with everything else adjusted to compensate; is this a possible moral practice, and what would make our arrangement the correct one and theirs incorrect?
  *   **Likely Reply:** She will answer that the practice is impossible because reasons are what they are, and such a community would not grasp the features correctly.
  *   **Follow-up:** What is the source of that necessity and is it not itself a general truth linking the feature to favouring, contradicting your denial of principles?

  **7. The AI Grief Case**
  A clinic offers bereaved families a generative model trained on a dead relative's messages and voice so they can keep exchanging messages; since there is no shared trained disposition to perceive the right answer here, does your view have a verdict on this practice yet?
  *   **Likely Reply:** She will likely say the view has no verdict yet because there is no established practice or trained sensitivity to draw upon.
  *   **Follow-up:** Does particularism then look conservative, able only to adjudicate inside practices that already exist, leaving it powerless to guide us in novel moral technologies?

  **8. Evidence Against the View**
  To close, can you name a concrete finding, armchair or empirical, that would count as evidence against your view and raise the probability that generalism is true, for example the discovery that some feature's valence is stable across every context anyone can construct?
  *   **Likely Reply:** She may say that nothing could count against it because holism is compatible with any pattern of valence we discover.
  *   **Follow-up:** Is that a defect in the view or an honest consequence of it, and how would you reply to someone who took it to be the former?
