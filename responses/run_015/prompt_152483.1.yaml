answer: |-
  # DECISION TREE: IS DNA A CODE?
  **Starting Premise:** All positions grant that DNA base sequence reliably correlates with amino acid sequencing.

  **Q1. CHEMISTRY:** Is the specific mapping (e.g., UUU $\rightarrow$ Phenylalanine) fixed by physico-chemical affinity alone?
  *(Test Case: Bases in a test tube with no enzymes.)*
  *   **YES** $\rightarrow$ **VIEW 1: PHYSICAL DETERMINISM**
      *   *Ugliest Commitment:* "Code" is merely a metaphor for stereochemistry; cannot explain engineered recoding without ad-hoc chemistry claims.
  *   **NO** (Mapping is contingent/arbitrary) $\rightarrow$ Go to Q2.

  **Q2. PARSE-RELATIVITY:** Does the "message" change if the decoding machinery changes?
  *(Test Case: Engineered organism where a stop codon is reassigned to a noncanonical amino acid.)*
  *   **NO** (Meaning is intrinsic to the strand) $\rightarrow$ **VIEW 2: INTRINSIC GENOCENTRISM**
      *   *Ugliest Commitment:* Must claim the engineered DNA is a *different sequence* rather than the same sequence read differently.
  *   **YES** (Meaning depends on Strand + Decoder) $\rightarrow$ Go to Q3.
      *   *Note: This branch locates codehood in the system, not the molecule.*

  **Q3. NORMATIVITY:** Can the system produce the "wrong" amino acid relative to the sequence without physical breakdown?
  *(Test Case: tRNA mischarging errors vs. tree rings indicating drought.)*
  *   **NO** (Correlation is purely causal) $\rightarrow$ **VIEW 3: SYSTEM-RELATIVE CAUSALISM**
      *   *Ugliest Commitment:* Tree rings and hormone levels count as "codes" if they carry causal information; no distinction from mere signal.
      *   *[EMPTY CELL DIAGNOSIS: "Causal + Interpreter" is incoherent; you cannot require an interpreter without introducing normativity/error.]*
  *   **YES** (Misrepresentation is possible) $\rightarrow$ Go to Q4.

  **Q4. ACTUALIZATION:** Does unread DNA possess semantic content?
  *(Test Case: DNA in a dormant spore or test tube with no ribosomes present.)*
  *   **NO** (Must be read to count) $\rightarrow$ **VIEW 4: PRAGMATIC INTERPRETIVISM**
      *   *Ugliest Commitment:* Dormant spores contain no genetic information until germination; biology reduces to psychology.
  *   **YES** (Stored content counts) $\rightarrow$ Go to Q5.

  **Q5. GROUNDING:** What fixes the "correct" reading?
  *(Test Case: Swampman duplicate vs. evolved organism.)*
  *   **CURRENT USER PURPOSE** $\rightarrow$ **VIEW 5: AGENT-BASED SEMANTICS**
      *   *Ugliest Commitment:* Cells must have "purposes" distinct from selection, or the view requires a homunculus.
  *   **EVOLUTIONARY HISTORY** $\rightarrow$ **VIEW 6: TELEOSEMANTICS**
      *   *Ugliest Commitment:* A functional gene in a 'Swampman' (created without history) has no meaning despite working identically.
  *   **NEITHER (Norms float free)** $\rightarrow$ **[EMPTY CELL]**
      *   *Diagnosis:* Incoherent; norms require a source (history or agent).

  ***

  **INDISTINGUISHABLE LEAVES:** **View 5 (Agent)** and **View 6 (Teleo)** yield identical verdicts on all empirical biological cases (spores, recoding, errors); they separate only on metaphysical thought experiments.

  **THE WORKHORSE:** **Q3 (Normativity)** does all the work; it is the only branch that separates mere causal correlation from genuine semantic codehood.
