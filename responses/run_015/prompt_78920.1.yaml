answer: |-
  The debate has stalled because it conflates a substantive question about neural encapsulation with a verbal dispute over whether "perception" denotes early sensory processing or the phenomenologically available content used for justification.

  Your three-level hunch is correct, but Signal Detection Theory (SDT) fails to resolve the conflict because the two camps are optimizing for different explanatory goals. Psychophysicists use SDT to isolate sensory sensitivity ($d'$) from decision bias ($\beta$) to map the *architecture* of the visual system (your Level 3). Penetrationist philosophers, however, are often interested in the *epistemological* role of perception (your Level 2): if a belief alters the $\beta$ such that the subject's visual experience provides different justificatory force for a belief, they count this as penetration regardless of $d'$. For a modularist like Firestone or Scholl, penetration requires a change in the input to the decision module (altering $d'$ or early neural firing). For a philosopher like Siegel or Stokes, penetration occurs if cognition alters the *content* of the experience itself, even if that alteration manifests as a weighting or selection policy (criterion) rather than raw sensitivity. They agree on the data but disagree on which parameter maps to the word "see."

  This is not merely verbal; it is a substantive disagreement about cognitive architecture that is currently empirically underdetermined. The modularists claim the visual system is informationally encapsulated; the penetrationists claim it is permeable. Because we lack a theory-neutral marker for the "end" of visual processing, every empirical test is theory-laden. If you measure V1 activity, the skeptic says "that's perception," but if the effect only shows up in parietal decision areas, the penetrationist says "that's still part of the perceptual output." The stalemate exists because neither side accepts the other's operational definition of the dependent variable.

  Progress would require a shift from behavioral reports to neural markers that are agreed upon as constitutive of perceptual content independent of decision-making. If both sides agreed that, say, specific feedback loops between IT cortex and V1 constitute the "perceptual boundary," we could test whether beliefs modulate those specific loops. Until then, you are correct that they are answering different questions under a single heading: psychologists are asking about processing stages, philosophers are asking about the structure of experience and justification.

  I would change my mind about this diagnosis if a study demonstrated a change in $d'$ driven by semantic belief in a forced-choice task where attention and decision criteria were rigorously controlled and replicated. If sensitivity itself shifts based on high-level knowledge without attentional mediation, the architectural claim of encapsulation fails empirically, rendering the verbal dispute moot. Conversely, if neuroimaging conclusively showed that all "penetration" effects correlate strictly with activity in frontal decision-making areas rather than visual cortex, the penetrationist claim would collapse into a post-perceptual judgment error.

  My reasoning is most likely wrong in assuming that philosophers are uninterested in the SDT distinction. Some epistemologists argue that criterion shifts *are* changes in perceptual content because the "content" of perception is defined by its functional role in guiding action and belief, not just its sensory fidelity. If the functionalist definition of perception gains traction, your Level 2 and Level 3 collapse, and the SDT distinction becomes less relevant to the philosophical claim, meaning the stalemate isn't just about definitions but about competing functionalist vs. structuralist theories of mind.
