      *   *Groups:* Black defendants vs. White defendants.
      *   *Outcome:* Rearrest within a fixed follow-up period (e.g., 2 years).
      *   *Base Rate Difference:* $P(Y=1 | \text{Black}) \neq P(Y=1 | \text{White})$. Stipulated as different.
      *   *Desideratum 1 (Calibration):* $P(Y=1 | \text{Score}=s, \text{Group}=g)$ is constant across $g$ for fixed $s$.
      *   *Desideratum 2 (FPR Balance):* $P(\text{Decision}=1 | Y=0, \text{Group}=g)$ is constant across $g$.
