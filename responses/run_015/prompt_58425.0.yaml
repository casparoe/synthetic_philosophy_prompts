      *   *Section 4 (Normative Separation):* Weave this throughout or summarize? The prompt asks "Throughout your response, clearly separate..." I should embed this distinction in every section, perhaps using bolding or specific phrasing. *Correction:* I will ensure the distinction is explicit in the analysis of each section.

  7.  **Refining the Reform Proposal Analysis:**
      *   The proposal suggests: Common Score $S$, Threshold $t_B \neq t_W$.
      *   To keep FPR equal: $P(S > t_B | Y=0, B) = P(S > t_W | Y=0, W)$.
