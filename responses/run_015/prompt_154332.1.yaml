answer: |-
  Here is the lesson plan. It is structured to prevent the "body count" reflex from hijacking the room and to keep the legal definition distinct from moral judgment.

  ### The Sequence (90 Minutes)

  **1. The Hook: The Scale Trap (10 mins)**
  *   **Action:** Write the word **GENOCIDE** on the board. Ask them to write down the first three images that come to mind.
  *   **The Pivot:** Collect the answers. They will be images of mass death (piles of bodies, gas chambers, mass graves).
  *   **Head Off Misconception #1 (Body Count):** Explicitly state: *"If you are counting bodies to find genocide, you have already missed it. Genocide is not a measure of volume; it is a measure of intent."*
  *   **Goal:** Break the association between Genocide and Industrial Killing.

  **2. Lemkin's Axis: The Group as the Victim (20 mins)**
  *   **Concept:** Introduce Lemkin's original formulation (1944). He was not obsessed with murder; he was obsessed with **groupness**.
  *   **The Mechanism:** Explain that for Lemkin, killing individuals was just one technique. The *goal* was to dismantle the institutions that make the group exist: language, schools, religious leadership, family structures, economic viability.
  *   **Head Off Misconception #2 (Moral Outrage):** Distinguish between *atrocity* (moral horror) and *genocide* (specific intent). A massacre is a crime against individuals; genocide is a crime against the *future existence of the group*.
  *   **Goal:** Establish that you can have genocide with a "low" death toll (if the group structure is dismantled) and mass murder without genocide (if the intent is territorial control, not group destruction).

  **3. The Carrying Example: The Guatemalan Scorched Earth (1980s) (30 mins)**
  *   **Why this example:** It fits your "counterinsurgency" requirement, it has a clear legal finding (UN Historical Clarification Commission), and it targets the *Maya* as a group, not just rebels.
  *   **What to Include:**
      *   **The Label:** How the state and its allies (US) labeled it "Counterinsurgency" and "Anti-Communist Defense."
      *   **The Cultural Mechanism:** Do not focus primarily on the 200,000 dead. Focus on the **burning of textiles**, the **execution of elders/priests** (knowledge keepers), the **forced relocation** into "model villages" where language and dress were banned.
      *   **The Intent:** Show the documents/testimony where the goal was to "drain the sea" (the Maya communities) to kill the "fish" (the guerrillas), resulting in the destruction of the sea itself.
  *   **What to Exclude:**
      *   **Cold War Geopolitics:** Keep the US/USSR dynamic brief. Do not let the room turn into a foreign policy debate.
      *   **Specific Battle Tactics:** Do not get bogged down in guerrilla movements. Keep the focus on the *civilian group structure*.
  *   **Goal:** Make the cultural destruction visible. Show how "Counterinsurgency" was the shield used to hide the genocidal intent.

  **4. The Politics of Naming: The Shield and the Sword (20 mins)**
  *   **Concept:** Why do some atrocities get the label and others vanish into "Ethnic Cleansing" or "Civil War"?
  *   **The Mechanism:** Explain that "Genocide" is a sovereign suicide note. No state admits to it willingly. The label is applied *externally* and *retroactively* based on political will, not just forensic evidence.
  *   **Head Off Misconception #3 (Bureaucratic Labeling):** Correct the idea that it's just paperwork. It is **geopolitical shielding**. Powerful allies protect perpetrators from the label to maintain strategic interests (e.g., Guatemala during the Cold War).
  *   **Goal:** Show that the absence of the label does not mean the absence of the crime.

  **5. The Gap: Legal Category vs. Political Name (10 mins)**
  *   **Synthesis:** Bring it back to the writers in the room. Their job is not to act as the ICC (International Criminal Court). Their job is to witness the *intent* and the *group destruction*, even if the UN hasn't gavelled it yet.
  *   **Goal:** Empower them to use the concept accurately without needing a legal verdict to validate their observation.

  ---

  ### The One Check Question
  *Ask this at the very end to test if they grasp the gap between the legal category and the political name:*

  > **"If a state systematically forbids a minority group from speaking their language, practicing their religion, and raising their own children, but kills no one, is it genocide under the 1948 Convention? Is it genocide in Lemkin's eyes? And why does the difference between those two answers matter for how we write about it?"**

  *(Correct grasp: Legally, likely no [cultural genocide was removed from the Convention]. In Lemkin's eyes, yes. The difference matters because writers must describe the reality of group destruction even when the law lags behind.)*

  ---

  ### Lawyer-Heavy Details to Skip
  *You are teaching writers, not prosecutors. Cut these to save time and prevent glazing over:*

  1.  **The Protected Groups List:** Do not spend time debating why "political groups" were excluded from the 1948 Convention. Just state it as a fact: *The law protects national, ethnical, racial, and religious groups. It does not protect political opponents.* This is crucial for the "Counterinsurgency" shield explanation.
  2.  **Jurisdictional Nuance:** Skip the difference between the ICC (criminal liability for individuals) and the ICJ (state liability). For a writer, the perpetrator is the state apparatus regardless of which court tries them.
  3.  **Burden of Proof Standards:** Do not explain "beyond reasonable doubt" vs. "preponderance of evidence." Just explain that *Specific Intent (Dolus Specialis)* is the hardest thing to prove legally, which is why the label is rarely applied in real-time.
  4.  **Article II Subsections:** Do not read the list of acts (killing, causing harm, etc.). Summarize them as "measures to destroy." Writers need the *concept*, not the statute.

  ### A Note on the Example
  I selected **Guatemala** because it is the cleanest fit for "Counterinsurgency masking Genocide." However, if you feel your specific group of writers will get bogged down in the high death toll (200,000), you can swap this for **The Canadian Residential School System**.
  *   **Swap Logic:** Residential Schools have a lower immediate "massacre" visual but a higher "cultural destruction" visual. It fits Lemkin perfectly.
  *   **Risk:** It was legally termed "Cultural Genocide" by the Truth Commission, but some scholars argue it doesn't fit the 1948 *legal* definition of genocide regarding "intent to destroy."
  *   **Recommendation:** Stick with **Guatemala** for the "Counterinsurgency" angle you requested, but instruct the room to focus on the **CEH Report's findings on Maya Identity**, not the casualty figures.
