answer: |-
  # Model Risk Procedure: Feature Projectibility & Entrenchment Protocol (F-PEP)

  **To:** Model Development Analysts
  **From:** Model Risk Management
  **Subject:** Pre-Fit Feature Sign-Off Procedure (Effective Immediately)

  ## 1. Purpose and Scope
  Standard out-of-time (OOT) holdout validation is insufficient for features that rely on arbitrary time cutoffs, retired logic, or shifting definitions. A feature can fit historical data perfectly (high lift) yet fail immediately upon deployment if it functions like a "Grue" predicate (valid only until a specific time or condition changes).

  This procedure replaces "Does it predict?" with "Is it projectible?" You have 20–30 minutes per feature. If a step fails, follow the escalation path. Do not rely on OOT lift to override a failure in Step 1 or 2.

  ## 2. The Procedure (4 Steps)

  ### Step 1: Predicate Stability (The "Grue" Test)
  **Action:** Examine the SQL definition. Does the feature value depend on:
  *   A fixed calendar date (e.g., `open_date < '2021-01-01'`)?
  *   A threshold set by policy that changes periodically?
  *   The output of another model that will be re-trained?
  *   The scoring run date itself?

  **Sufficient Answer:**
  *   **Pass:** Definition relies on customer behavior or attributes invariant to the scoring date (e.g., `avg_balance_last_6m`).
  *   **Fail:** Definition relies on a fixed cutoff, retired rule, or moving target.
  *   **Constraint:** If **Fail**, **OOT Lift is discounted to zero** for the purpose of projectibility. You cannot claim stability based on historical fit.

  **Action if Fail:** You must propose a "Re-derive." Can you capture the *underlying behavior* without the date/rule? (e.g., instead of `pre_2021`, use `onboarding_channel_v1`). If no re-derive is possible, mark for **Manager Review**.

  ### Step 2: Entrenchment Proxy (Lineage Check)
  **Action:** Search the Model Inventory and Monitoring Reports for the last 3 years (12 quarters).
  *   Has this *specific* feature (or its logical family) appeared in a shipped champion model?
  *   Has this *type* of data (e.g., "transaction text," "onboarding cohort") been used successfully in other products?

  **Sufficient Answer:**
  *   **High Entrenchment:** Feature (or family) shipped in $\ge$ 2 prior models with stable PSI (<0.1) over 12 months.
  *   **Low Entrenchment:** New feature type, or feature appeared in a model that was subsequently retired due to drift.
  *   **Proxy for "Vocabulary":** If the feature name appears in Bank Policy documents or Staff Training manuals, count as High Entrenchment (it is part of the business "kind").

  **Action if Low:** Requires **Compliance Review** (Fair Lending risk is higher when logic is novel) and **Manager Approval**.

  ### Step 3: Overhypothesis Check (Business Kind)
  **Action:** Write one sentence explaining *why* this feature predicts risk in the *next* quarter, not the last one.
  *   **Valid:** "Customers who miss payments now are likely to miss payments later." (Stable mechanism).
  *   **Invalid:** "Customers who signed up before the website redesign are riskier." (Regime artifact).

  **Sufficient Answer:**
  *   **Pass:** The rationale describes a customer *behavior* or *capacity* that persists regardless of our internal changes.
  *   **Fail:** The rationale describes our *internal process*, a *policy artifact*, or a *data quirk*.

  **Action if Fail:** Disposition must be **Reject** or **Admit only if re-derived**.

  ### Step 4: Reflexivity & Opacity Check
  **Action:**
  *   **Reflexivity:** If we score this account high/low, does it change the feature value next month? (e.g., a feature based on "collections calls made" changes if the model triggers more calls).
  *   **Opacity:** For embeddings/black-box features: Does the input data contain time-sensitive tokens (months, years, "current")?

  **Sufficient Answer:**
  *   **Pass:** Feature is exogenous to model action; Input data is sanitized of time tokens.
  *   **Fail:** Feature creates a feedback loop; Input data leaks the scoring date.

  **Action if Fail:** **Admit with mandatory post-deployment drift monitoring** (weekly PSI) is the minimum. Prefer **Re-derive**.

  ---

  ## 3. Decision Matrix & Escalation

  | Step 1 (Stability) | Step 2 (Entrenchment) | Step 3 (Overhypothesis) | Default Disposition | Escalation |
  | :--- | :--- | :--- | :--- | :--- |
  | Pass | High | Pass | **Admit** | None |
  | Fail | High | Pass | **Admit + Monitor** | Manager (Cost/Benefit) |
  | Fail | Low | Fail | **Reject** | None |
  | Pass/Low | Low | Pass | **Admit + Re-derive** | Compliance (Fair Lending) |
  | **Any Fail** | **Any** | **Mechanism Unclear** | **Manager Review** | **Manager (Value Call)** |

  **Note on Judgment Calls:**
  *   **Fact:** Whether a definition contains a date (Step 1).
  *   **Value:** Whether the business risk of losing the lift outweighs the stability risk (Manager Decision).
  *   **Compliance:** Whether a low-entrenchment feature acts as a proxy for a protected class (Compliance Decision).

  ---

  ## 4. Application to Current Build Features

  Below is the filled-in reasoning for the three features you specified, applying the F-PEP strictly.

  ### Feature 1: `legacy_cohort`
  *Definition:* `1` if `account_open_date < '2021-03-01'`, else `0`.
  *Performance:* 8% of champion lift.

  *   **Step 1 (Stability):** **FAIL.** The predicate is anchored to a fixed calendar date. It is structurally identical to "Grue." It divides the population based on a regime change (onboarding redesign), not a persistent customer trait. As time passes, the "legacy" group shrinks to zero.
      *   *OOT Note:* Historical lift is circular. It predicts well only because the holdout is also pre/post 2021. It will not predict *future* regime shifts.
  *   **Step 2 (Entrenchment):** **HIGH.** It is in the current champion model.
  *   **Step 3 (Overhypothesis):** **FAIL.** The rationale is "Accounts opened under the old system are riskier." This is a statement about *our* process, not the *customer's* inherent risk. Once the old process is fully gone, this feature loses meaning.
  *   **Step 4 (Reflexivity):** **Pass.** Scoring does not change open date.

  *   **Disposition:** **Admit only if re-derived from base fields.**
  *   **Rationale (3 lines):** Feature is a date-based proxy for a regime shift, not a stable customer trait. Projection history ends when the legacy cohort expires. Must capture the *attributes* of the legacy onboarding (e.g., `doc_verification_method`) rather than the date itself to ensure projectibility.
  *   **Escalation:** To Manager. We are trading 8% lift for stability. If business accepts the decay, monitor cohort size monthly.

  ### Feature 2: `referred_by_legacy_rules`
  *Definition:* `1` if account was flagged by the 2022 retired rules engine, else `0`.
  *Performance:* Highest gain in new build.

  *   **Step 1 (Stability):** **FAIL.** The extension of this predicate is fixed in history but the *mechanism* is dead. No new accounts can ever become `1`. It is a "fossil" feature.
  *   **Step 2 (Entrenchment):** **LOW.** The rule set is retired. It does not appear in current policy or staff vocabulary.
  *   **Step 3 (Overhypothesis):** **FAIL.** The rationale is "Accounts the old system hated are bad." This assumes the old system's logic remains valid without the system. This is an untested overhypothesis.
  *   **Step 4 (Reflexivity):** **Pass.**

  *   **Disposition:** **Reject.**
  *   **Rationale (3 lines):** Feature relies on a defunct decision system. It cannot generalize to new accounts or new behaviors. High risk of spurious correlation with historical data artifacts. Lift is non-projectible.
  *   **Escalation:** To Model Development Lead. Request they rebuild the logic of the *best* legacy rules as explicit features (e.g., `days_past_due_at_90`) rather than using the legacy flag.

  ### Feature 3: `transaction_embedding_32d`
  *Definition:* 32-dimensional vector from pretrained model on transaction description strings.
  *Performance:* Moderate lift, high stability in OOT.

  *   **Step 1 (Stability):** **UNKNOWN/FAIL.** Cannot inspect predicate directly. However, raw strings contain month tokens (e.g., "PAYMENT JAN").
  *   **Step 2 (Entrenchment):** **LOW.** Embeddings are new to this vendor stack. No prior projection history.
  *   **Step 3 (Overhypothesis):** **PASS (Conditional).** "Spending patterns predict risk." Valid overhypothesis, *unless* the pattern is just "time of year."
  *   **Step 4 (Reflexivity/Opacity):** **FAIL.** Input data contains time tokens. The embedding likely encodes "Transaction Month." This makes it a "Grue" predicate (valid for January, invalid for February).

  *   **Disposition:** **Admit only if re-derived.**
  *   **Rationale (3 lines):** Input data contains temporal tokens (months), causing the embedding to encode the scoring date rather than behavior. This violates projectibility. Must retrain embedding or sanitize input strings (remove months/dates) before admission.
  *   **Escalation:** To Data Engineering. Sanitize transaction strings (strip temporal entities) before embedding generation.

  ---

  ## 5. Limitations of the Procedure

  You asked what this procedure *cannot* do. I am marking this section for your eyes only (do not attach to the analyst form).

  ### A. The "New Kind" Problem (11-Month Product)
  Goodman's entrenchment relies on history. For a product with 11 months of data, **Step 2 (Entrenchment) will always fail.**
  *   **The Gap:** The procedure cannot distinguish between a "New Kind" that is stable (e.g., a new loan product that behaves like auto loans) and a "Grue" that just hasn't broken yet.
  *   **The Workaround:** We must lean heavily on **Step 3 (Overhypotheses)**. We must ask: "Is this product analogous to an entrenched kind?" (e.g., "This is a BNPL product, treat it like a small installment loan").
  *   **The Risk:** This is a judgment call, not a fact. I (Manager) must sign off on the analogy. If the analogy is wrong, the model fails. The procedure flags the risk but cannot quantify it.

  ### B. Entrenchment vs. Mechanism
  Goodman argues that "entrenchment" (history of use) is what justifies induction, not "causal mechanism." In Model Risk, this is dangerous.
  *   **The Conflict:** `Zip Code` is highly entrenched (used for decades). It is also a proxy for race (Fair Lending risk) and can shift due to gentrification (Mechanism risk).
  *   **The Procedure's Bias:** F-PEP favors Entrenchment (Step 2). A feature can pass Step 2 but fail Step 3.
  *   **The Resolution:** If a feature is **High Entrenchment** but **Low Mechanism** (e.g., `legacy_cohort`), the procedure forces a **Re-derive**. We prioritize Mechanism over Entrenchment when they conflict. Entrenchment is a *heuristic* for stability, not a *guarantee*. If we know the mechanism is broken (e.g., retired rules), entrenchment is irrelevant.

  ### C. The "Worthless OOT" Declaration
  You asked me to be plain: **For features like `legacy_cohort` and `referred_by_legacy_rules`, the OOT holdout result is worthless.**
  *   **Why:** The holdout is drawn from the *same* regime as the training data. It tests whether the model memorized the past, not whether the predicate projects to the future.
  *   **Instruction to Analysts:** I have instructed them to discount OOT lift to zero if Step 1 fails. This will reduce the number of models shipped. It will anger the business. This is the cost of avoiding a "Grue" failure post-deployment.

  ### D. The Embedding Black Box
  For the 32d embedding, the procedure asks questions we cannot fully answer ("What predicate is being projected?").
  *   **The Limit:** We are testing the *input stability*, not the *predicate logic*.
  *   **The Risk:** The embedding could encode a "Grue" predicate that has nothing to do with time (e.g., a specific merchant ID that goes bankrupt next quarter). We cannot catch this with F-PEP.
  *   **Mitigation:** This is why the disposition is "Admit + Monitor." We admit the epistemic limit and rely on rapid drift detection rather than pre-fit validation.

  ## 6. Final Instruction to Analysts
  When you sign this form, you are not certifying that the model works *today*. You are certifying that the logic is of a *kind* that will work *tomorrow*. If you cannot write the rationale in plain English without referencing a specific date or a retired system, do not sign it. Send it to me.
