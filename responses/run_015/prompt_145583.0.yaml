  # Seminar Plan: The Reprimand Protocol

  **Duration:** 90 Minutes
  **Participants:** 8–12 Advanced Undergraduates or Early Graduate Students
  **Facilitator Role:** Neutral Arbiter (Phases 1–3); Conceptual Guide (Debrief)
  **Objective:** To experientially demonstrate that treating hypocrisy as a binary disqualifier from standing to blame collapses a group's capacity for collective judgment, even when private consensus exists.

  ---

  ## I. Preparation (Before Seminar)

  **Materials:**
  1.  **Case Card (1 Copy):** A description of a serious transgression.
      *   *Example:* "Dr. A systematically appropriated data from junior colleagues' unpublished drafts to secure a major grant. The department has verified the misconduct. The question is whether the department should issue a formal public statement condemning Dr. A."
  2.  **Fault Cards (1 per participant):** Sealed envelopes distributed randomly upon entry.
      *   **Distribution:** 75% **Tainted** (e.g., "You once failed to correct a minor misattribution of credit in your own work."), 25% **Pure** (e.g., "Your record regarding attribution is clean.").
      *   *Note:* Ensure the "Tainted" faults are minor enough that participants still feel the main transgression is wrong, but significant enough to feel like hypocrisy if they condemn it loudly.
  3.  **Tokens:** A supply of Red and Green tokens.
  4.  **Board:** A central whiteboard or sheet to track token counts.
  5.  **Ballots:** Slips of paper for the secret vote.
  6.  **Payoff:** A tangible minor reward contingent on success (e.g., "The group chooses next week's reading topic" + "Shared snack provided").

  **Room Setup:**
  *   Chairs in a circle.
  *   Central table for tokens and board.
  *   Private writing space available (desks or clipboards).

  ---

  ## II. Activity Procedure (60 Minutes)

  ### Introduction (5 Minutes)
  **Facilitator Script:**
  "Welcome. Today we are running a structured deliberation called 'The Reprimand Protocol.' We will not discuss theory until the end. Your goal is simple: decide as a group whether to issue a formal statement of condemnation regarding the case provided.

  There is a reward for successful collective action. If at least **75% of the group** supports the statement, we will [select next week's topic/provide snack]. If support falls below 75%, the reward is forfeit.

  You will receive a sealed envelope. Do not open it until instructed. Do not show its contents to anyone."

  *(Distribute Fault Cards. Ensure participants open them privately.)*

  ### Phase 1: Silent Positioning (10 Minutes)
  **Facilitator Script:**
  "I will now read the Case Card. Afterward, you have 10 minutes of silence. Privately, write down 'Yes' or 'No' on your notepad regarding whether the group should issue the statement. Do not share this yet."

  *(Read Case Card aloud. Start timer. Participants write privately.)*

  **Facilitator Observation:**
  Note the speed and confidence of writing. Most will write "Yes" quickly, assuming the moral clarity of the case outweighs personal status.

  ### Phase 2: Structured Disclosure and Discussion (25 Minutes)
  **Facilitator Script:**
  "We will now move to discussion. You are seated in a circle. Each person may speak once, either for or against the statement.
  *   **If speaking AGAINST:** Say 'I oppose.' Place no token.
  *   **If speaking FOR:** You must declare your status based on your Fault Card. Say 'I support, and I am Pure' or 'I support, and I am Tainted.'
      *   If **Pure**: Place a **Green Token** on the board.
      *   If **Tainted**: Place a **Red Token** on the board.
  *   **Constraint:** You may not explain the details of your fault. Only the status matters.

  We will go around the circle. You may pass if you wish."

  *(Facilitator tracks the tokens on the board visibly. Ensure the 75% Tainted distribution holds.)*

  **Dynamic to Watch:**
  *   **Early Phase:** Pure participants may speak first, placing Green tokens. Confidence is high.
  *   **Mid Phase:** As Tainted participants speak, Red tokens accumulate.
  *   **Late Phase:** Participants may hesitate. Placing a Red token feels like public admission of hypocrisy. Some may choose to pass (silent) rather than place a Red token, even if they privately support the statement.
  *   **Facilitator Note:** Do not comment on the ratio. Simply record the tokens.

  ### Phase 3: Vote and Payoff (15 Minutes)
  **Facilitator Script:**
  "We will now vote by secret ballot. Write 'Sign' (support) or 'Refuse' (oppose) on the slip. This is your private judgment. Return the slip to me."

  *(Collect ballots. Tally the raw 'Sign' count visibly. It will likely be high, often near 100%.)*

  **Facilitator Script:**
  "The raw vote shows strong support. However, we must now apply the **Standing Filter** to determine if the reward is earned.
  *   **Rule:** To count toward the 75% threshold, a supporter must have **Standing**.
  *   **Condition:** In this protocol, Standing requires **Purity**.
  *   **Calculation:** Only **Green Tokens** placed in Phase 2 count toward the threshold. Red tokens indicate support, but lack standing. They do not count."

  *(Reveal Fault Cards face-up to verify token colors. Calculate the Green Token count against the total group size.)*

  **The Collapse:**
  *   Total Group: 12 (Example)
  *   Threshold Needed: 9 (75%)
  *   Pure Participants (Green): ~3 (25%)
  *   **Result:** 3 < 9. The threshold is failed. The reward is lost.

  **Facilitator Action:**
  Announce the failure neutrally. "The collective judgment cannot be issued. The threshold was not met under the standing rules."

  ---

  ## III. Debrief (30 Minutes)

  **Facilitator Shift:**
  Move from Arbiter to Guide. Do not cite literature. Focus on the experience they just had.

  ### 1. Mapping the Moments (10 Minutes)
  Guide the participants to reconstruct the emotional and logical arc of the hour.

  *   **Moment 1: Silent Confidence.**
      *   *Ask:* "In Phase 1, before you knew who was tainted, how did you feel about the judgment?"
      *   *Point:* Private judgment is easy. We assume purity resides elsewhere. We assume the 'group' is capable even if individuals are not.
  *   **Moment 2: The First Disclosure.**
      *   *Ask:* "When the first Red token was placed, what happened to the energy in the room?"
      *   *Point:* The binary disclosure forced a categorization. It triggered defensiveness. The focus shifted from the *transgression* (Dr. A) to the *speakers* (Us).
  *   **Moment 3: The Accumulation.**
      *   *Ask:* "As Red tokens piled up, did anyone feel less entitled to speak? Did anyone consider staying silent to avoid placing a Red token?"
      *   *Point:* This is the collective-action failure. The cost of honesty (admitting taint) feels like losing standing. The group resource (capacity to blame) drains as imperfection is revealed.
  *   **Moment 4: The Collapse.**
      *   *Ask:* "You voted 'Sign' privately, but the reward was lost. How does that feel?"
      *   *Point:* This distinguishes **Private Blame** (intact) from **Public Standing** (collapsed). The group agrees morally but is paralyzed structurally.

  ### 2. Handling Predicted Failures (10 Minutes)
  Participants will likely resist the lesson. Anticipate these objections and handle them conceptually.

  *   **Objection A: "Degrees of Fault Matter."**
      *   *Participant:* "My fault was tiny. Dr. A's was huge. Why does my minor fault disqualify me entirely?"
      *   *Facilitator Response:* "In real life, you are right. But in this protocol, the line was binary. Ask yourself: Where would you have drawn the line? If we allow *some* taint, who decides how much? If we cannot agree on the line, do we default to silence? The activity froze the variable to show what happens when the line is strict."
  *   **Objection B: "Acknowledgment Restores Standing."**
      *   *Participant:* "I admitted my fault publicly. Shouldn't that count for something?"
      *   *Facilitator Response:* "Intuitively, yes. But the rules here treated standing as a pre-existing credential, not something earned in the moment. This highlights a tension: Is standing about *who you are* (character) or *what you do* (speech)? The game assumed the former."
  *   **Objection C: "Silent Signing is Cheating."**
      *   *Participant:* "Some people stayed silent in Phase 2 but voted 'Sign' in Phase 3. That undermines the token count."
      *   *Facilitator Response:* "Treat this as data, not cheating. It shows people distinguish between private judgment (voting) and public standing (tokens). They wanted the outcome but didn't want the social cost of claiming standing. This confirms the tension: we want collective blame without personal exposure."

  ### 3. Limitations of the Activity (5 Minutes)
  Be frank about what the simulation excludes to prevent over-generalization.

  *   **Static vs. Diachronic:** "In this game, your status was frozen. In real communities, standing is temporal. You can apologize, make amends, and regain standing over time. The game removed redemption to isolate the structural problem."
  *   **Private vs. Public:** "The game collapsed private reproach and public condemnation. In reality, you can privately condemn Dr. A without issuing a public statement. The game forced a public choice to show the cost of collective action."
  *   **Single-Round:** "Real communities play this game repeatedly. Reputation builds over time. This was a snapshot, which makes the collapse feel more absolute than it might in a long-term relationship."

  ### 4. Conceptual Takeaway (5 Minutes)
  Conclude without naming theories. Summarize the core insight.

  **Facilitator Closing:**
  "Today you experienced a specific failure mode. When we treat standing to blame as a credential requiring purity, we treat it as an **individual property**. But collective judgment is a **distributed resource**.

  If most of us share minor versions of the fault we condemn, a strict purity condition does not just excuse hypocrites; it disables the group. To function, a community must either:
  1.  **Relax the Condition:** Allow tainted members to speak (accepting some hypocrisy).
  2.  **Accept Asymmetry:** Allow only the few pure members to speak (creating an elite).

  Both options feel unsatisfactory. The first feels unjust; the second feels oligarchic. Yet, without choosing one, the group loses the ability to judge itself. The lesson is not that hypocrisy is good, but that collective moral agency requires a mechanism for handling imperfection that does not result in total silence."

  *(End Seminar)*
