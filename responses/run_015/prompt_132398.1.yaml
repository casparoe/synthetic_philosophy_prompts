answer: |-
  This is a sophisticated epistemological problem disguised as a clinical teaching moment. You are describing a specific failure mode in the relationship between **first-order evidence** (the scan), **metacognitive signals** (the feeling of certainty), and **higher-order evidence** (the statistical track record).

  There is no single established term that captures this exact triad (specific perceptual trap + confidence as error marker + involuntary persistence), though it sits at the intersection of literature on **Higher-Order Evidence (HOE)**, **Epistemic Calibration**, and **Dual-Process Theory**.

  Below is the conceptual carving you requested. I propose classifying this as a **Metacognitive Calibration Trap**, a specific subtype of **Attitude-Conditional Defeaters**.

  ### 1. The Classification and Terminology

  **Established Literature:**
  *   **Higher-Order Evidence (HOE):** Philosophers like David Christensen and Adam Elga discuss cases where you get evidence about your own reasoning reliability (e.g., "you are drugged," "you are biased"). Your case is a specific form of HOE where the evidence targets *metacognitive calibration*.
  *   **Calibration:** In forecasting literature (e.g., Philip Tetlock), "calibration" is the match between confidence and accuracy. Your resident has *local miscalibration*.
  *   **Illusion of Validity:** Daniel Kahneman describes the feeling of confidence as a check on coherence, not accuracy. Your case is a pathological instance where coherence signals error.

  **Coined Term:**
  I propose calling this phenomenon a **Metacognitive Calibration Trap**.
  The specific *reason for doubt* is an **Attitude-Conditional Metacognitive Defeater**.

  **Definition:**
  A **Metacognitive Calibration Trap** occurs when a specific cognitive mechanism produces both a belief and a high-confidence signal, such that the presence of the high-confidence signal is statistically correlated with error *within that specific context*, yet the confidence signal is causally insulated from voluntary revision.

  ### 2. The Carving: Five Dimensions

  Here is how this category should be carved relative to your specific questions.

  #### A. What exactly is the phenomenon?
  It is not merely a bias; it is a **decoupling of the metacognitive signal from truth**.
  In a healthy cognitive system, confidence tracks probability of correctness. In this trap, the cognitive shortcut (heuristic) that allows the resident to recognize the pattern *also* generates the feeling of certainty. Because the pattern is a "perceptual trap" (a mimic), the heuristic fires incorrectly. Crucially, the heuristic fires *with full strength*.
  Therefore, the confidence is not just wrong; it is **diagnostic of the error**. The feeling of certainty is the symptom of the specific pathology causing the misdiagnosis.

  #### B. How does it differ from a standard defeater (outweighing/irrelevance)?
  *   **Standard Defeater:** Attacks the *first-order evidence*. (e.g., "The scan is blurry," or "The machine was malfunctioning.") This makes the evidence weaker or irrelevant.
  *   **Metacognitive Calibration Trap:** Attacks the *processing mechanism*. The scan (first-order evidence) might be clear. The problem is that the *link* between processing that scan and feeling sure about it is broken.
  *   **Key Distinction:** A standard defeater gives you a reason to think $P$ is false. This defeater gives you a reason to think *your judgment that $P$ is true* is unreliable, specifically *because* you feel sure about it. It makes the confidence itself evidence against the belief.

  #### C. How does it differ from the gap between judgment and belief (Epistemic Akrasia)?
  *   **Epistemic Akrasia:** "I judge that I should not believe $P$, but I find myself believing $P$." This implies a conflict between a higher-order judgment and a first-order belief.
  *   **Metacognitive Calibration Trap:** The resident may accept the higher-order judgment ("I am often wrong when sure about this"), but the *feeling* of certainty does not retreat.
  *   **Key Distinction:** Akrasia is often framed as a failure of rationality or will. The Trap is a **causal block**. Confidence is a System 1 output; it is not under direct volitional control. You cannot "decide" to feel less certain any more than you can "decide" to see an optical illusion differently. The category must exclude cases where the agent *could* lower confidence by reflection but chooses not to. This case belongs in the category only because the confidence is **involuntary**.

  #### D. Should the category include cases where one can only comply indirectly?
  **Yes. Indirect compliance is the only rational response.**
  Since the confidence signal is involuntary, a direct command ("Be less sure") is epistemically useless. Rational compliance requires **structural intervention**:
  *   **Habits:** Forcing a "cognitive timeout" before finalizing the read.
  *   **Sources:** Mandating a second read for any case triggering high confidence on this pattern.
  *   **Environment:** Changing the workflow so the "sure" feeling triggers a protocol rather than a decision.
  If a proposed category of doubt requires direct volitional control over confidence to be resolved, it does not fit this case. This category must be defined by the necessity of **indirect metacognitive regulation**.

  #### E. Does a reason that disappears when complied with belong with one that appears when complied with?
  **Yes, they are both Reflexive Defeaters, but they differ in Locus.**
  You asked about the relationship between your Target Case (Reason disappears if she stops being certain) and Case 3 (Reason appears if she defers to the guideline).
  *   **Target Case:** **Psychologically Reflexive.** The defeater is conditional on the *internal attitude*. (If I am not confident, I am not in the trap).
  *   **Case 3:** **Ontologically/Socially Reflexive.** The defeater is conditional on the *external action*. (If I do not use the guideline, it remains reliable).
  *   **Carving Decision:** They should be grouped under the broader umbrella of **Reflexive Defeaters** (cases where the rational response affects the truth/reliability of the premise). However, for clinical teaching, they must be distinguished.
      *   **Target Case:** Requires *debiasing* (breaking the internal coupling).
      *   **Case 3:** Requires *preservation of independence* (avoiding Goodhart's Law).
      *   **Case 2 (Global Overconfidence):** This is **not** a Reflexive Defeater. It is a **Trait Calibration Failure**. The doubt moves with her because the ruler is bent everywhere, not because her reaction to the doubt changes the truth. Case 2 should be **excluded** from the "Trap" category because there is no "safe" state to retreat to. In the Trap, a state of "uncertainty" is safe; in Case 2, no state is safe.

  ### 3. Summary of the Category

  **Name:** **Metacognitive Calibration Trap**
  **Sub-type:** **Attitude-Conditional Defeater**

  **Inclusion Criteria:**
  1.  **Coupling:** The error and the confidence share a common causal source (a specific heuristic).
  2.  **Diagnostic Confidence:** High confidence is positively correlated with error *in this specific context*.
  3.  **Involuntariness:** The agent cannot directly volition the confidence away.
  4.  **Escapability:** There exists a theoretical state (lower confidence) where the agent is reliable, distinguishing it from global trait overconfidence.

  **Exclusion Criteria:**
  1.  **Global Trait Overconfidence (Your Case 2):** Excluded because the "safe state" does not exist; the calibration is broken globally, not locally.
  2.  **Standard Defeaters:** Excluded because they attack the evidence, not the confidence-evidence link.
  3.  **Volitional Akrasia:** Excluded because the agent retains direct control over the belief/feeling.
  4.  **Purely External Reflexivity (Your Case 3):** While structurally similar (reflexive), this is excluded from the *Metacognitive* sub-category because the mechanism is social/ontological, not psychological.

  ### 4. Pedagogical Application

  When teaching this, do not frame it as "You are overconfident." Frame it as **"This pattern hijacks your certainty signal."**

  *   **Wrong:** "You need to be less sure." (Impossible command).
  *   **Right:** "When this pattern triggers a feeling of certainty, that feeling is a warning light, not a green light. Treat the certainty as a symptom of the trap, not a sign of mastery."

  This re-frames the confidence from a **justification** ("I'm sure, so I'm right") to a **trigger for protocol** ("I'm sure, so I must get a second read"). This bypasses the involuntary nature of the feeling by changing the *action* associated with it, rather than trying to change the *feeling* itself.
