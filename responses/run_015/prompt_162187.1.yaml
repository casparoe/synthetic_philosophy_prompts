answer: |-
  You are reading the 1859 prose with remarkable precision, and your intuition about the distinction between the *constitutive* (how the machinery works now) and the *aetiological* (where the machinery came from) is not anachronistic. It is textually grounded in the passage you provided. However, the stakes of that distinction differ between Darwin's project in the *Origin* and the "Strange Inversion" as later framed by Dennett or Turing.

  Here is a walkthrough of the sentences you cited, addressing your three main worries: the Habit/Origin split, the Caterpillar's goal-blindness, and the load-bearing nature of the disclaimer.

  ### 1. The Habit/Origin Distinction (Constitutive vs. Aetiological)

  You wrote: *"Darwin's habit remark looks like it's drawing exactly that line (habit gives you the right picture of the frame of mind but not of the origin), and I want to know whether that's really his distinction or whether I'm reading a 20th-century distinction back into him."*

  Look closely at this sentence:
  > "This comparison gives, I think, a remarkably accurate notion of the **frame of mind under which an instinctive action is performed**, but **not of its origin**."

  You are not reading this back into him. Darwin is explicitly separating the *phenomenology/mechanism* of the act from the *genealogy* of the act.
  *   **"Frame of mind... performed":** This is your constitutive claim. It describes the internal state (or lack thereof) during operation. By comparing it to "habit," Darwin suggests the animal is acting from a kind of rigid, acquired (or inherited) impulse, not from a rational calculation of ends.
  *   **"Not of its origin":** This is your aetiological claim. Habit (in the individual sense) cannot explain how the instinct got there in the first place, especially since Darwin argues these instincts are often present at birth ("very young one, without any experience").

  So, on this point, you are right: Darwin is distinguishing between *how it feels to do it* (unthinking habit) and *how it came to be* (natural selection, though he is still fleshing out that mechanism in this chapter). The "Strange Inversion" requires both: the competence exists (the hammock is built), but the comprehension is absent in the performance (habit/frame of mind) *and* absent in the history (natural selection, not a designer).

  ### 2. The Caterpillar: Goal-Blindness vs. Comprehension

  You wrote: *"My gloss is that what this actually demonstrates is goal-blindness... and that this is a much narrower result than it's not comprehending anything... Does that undersell what Darwin needs, or is goal-blindness the honest cash value of without their knowing for what purpose it is performed?"*

  This is the crux of your textual worry. Let's look at Darwin's definition of instinct again:
  > "An action... when performed by many individuals in the same way, **without their knowing for what purpose it is performed**, is usually said to be instinctive."

  You are correct that the Huber caterpillar case demonstrates **local state tracking** (what step did I just do?) rather than **global goal representation** (what does the finished hammock look like?). The caterpillar is "embarrassed" (Darwin's anthropomorphism for "stuck") because its internal counter is out of sync with the external reality.

  **Does this undersell what Darwin needs?**
  For a modern philosopher of mind asking "Is there qualia?", yes, it undersells it. But for Darwin's argument in 1859, **goal-blindness is the honest cash value.**

  Why? Because Darwin's opponent here is not the Materialist, but the **Creationist**. The opposing view (which Darwin is inverting) is that God implanted a "knowledge" of the end state into the animal. If the animal truly comprehended the *purpose*, it would recognize a finished hammock. The fact that it blindly repeats steps on a finished product proves it is not acting on "Reason" or "Knowledge of Purpose."

  Darwin does not need to prove the caterpillar is a philosophical zombie (no inner states whatsoever). He only needs to prove the caterpillar is not a **rational agent**.
  *   **Rational Agent:** Sees end state $\rightarrow$ Adjusts means.
  *   **Instinctive Machine:** Sees last step $\rightarrow$ Executes next step (regardless of end state).

  The "Strange Inversion" at this stage is not "Matter creates Mind." It is "Blind Process creates Adaptive Design." The caterpillar proves the design (the hammock) is real, but the designer (the caterpillar's mind) is absent. Goal-blindness is sufficient to break the link between *Complexity of Output* and *Intelligence of Agent*.

  ### 3. The Disclaimer: Hedging or Load-Bearing?

  You wrote: *"One of the people in my group thinks Darwin's disclaimer is pure diplomatic hedging against being called a materialist and carries no argumentative weight; I think it's load-bearing and that its the reason the inversion as he states it stops short of explaining mind proper."*

  The text:
  > "I must premise, that I have nothing to do with the **origin of the primary mental powers**, any more than I have with that of life itself. We are concerned only with the **diversities of instinct and of the other mental qualities of animals within the same class**."

  **You are closer to right than your group member.**

  While there is certainly diplomatic hedging (Darwin was acutely aware of the materialism charge), the disclaimer is **methodologically load-bearing**.
  1.  **Scope of the Inversion:** Darwin's inversion in the *Origin* is biological, not psychological. He is inverting the origin of *Adaptation* (Design without Designer). He is *not* yet inverting the origin of *Consciousness* (Mind without Soul).
  2.  **The Gap:** By bracketing "primary mental powers," Darwin admits he cannot explain how *comprehension itself* arises from matter. He can explain how *behavior that looks like comprehension* arises (instinct).
  3.  **The Consequence:** This creates the "missing rung" you identified. Darwin explains how you get *Competence* (hammock building) without *Comprehension* (knowing the purpose). He explicitly declines to explain how you get *Comprehension* (primary mental powers) from that base.

  If your group member thinks it's *only* hedging, they imply Darwin *could* explain the origin of mental powers but chose not to for safety. The text suggests he believes the *Origin* (the book) lacks the tools to do so. He treats "primary mental powers" like "life itself"—a starting boundary condition, not a derived result.

  ### 4. Turing's Move and the Relocation of the Gap

  You asked: *"Does [Turing's] move actually close the gap, or does it just relocate it...?"*

  This is where the comparison illuminates Darwin's limitation.

  **Darwin's Position:**
  *   **Input:** Blind Variation + Selection.
  *   **Output:** Complex Instinct (Competence).
  *   **Black Box:** Primary Mental Powers (Comprehension).
  *   **Inversion:** Design comes from Blindness.

  **Turing's Position (Computing Machinery and Intelligence / Child Machine):**
  *   **Input:** Simple Initial State (Child Machine) + Education/Interaction.
  *   **Output:** Intelligent Behavior (Comprehension).
  *   **Mechanism:** Symbol manipulation (Competence) that *becomes* Understanding through complexity and training.
  *   **Inversion:** Understanding comes from Competence.

  Turing attempts to close the gap Darwin left open. Darwin said, "I can explain the instinct (behavior), but not the mental power (mind)." Turing says, "The mental power *is* just a very complex arrangement of competences."

  **Does Turing relocate the vulnerability?**
  Yes. Your worry about the caterpillar applies to Turing's "Child Machine" if you view the "education" process as merely another form of blind shaping.
  *   **The Caterpillar Objection:** The caterpillar fails because it has no model of the endpoint.
  *   **The Turing Objection:** Does the machine ever have a model of the endpoint, or does it just get better at predicting the next token/state?

  If you accept the user's "goal-blindness" critique, Turing is vulnerable. If the machine is just tracking local states (like the caterpillar) but with vastly more layers, it still lacks "comprehension" in the robust sense. Turing solves this by redefining comprehension functionally (if it acts like it understands, it understands). Darwin, in 1859, is less willing to make that functionalist leap regarding "primary mental powers."

  ### Summary Verdict

  1.  **Constitutive vs. Aetiological:** You are correct. Darwin's "frame of mind" vs. "origin" distinction maps cleanly onto this. He is arguing that the *operation* is unthinking (habit-like) and the *history* is unguided (selection).
  2.  **Caterpillar/Goal-Blindness:** You are correct that this only proves goal-blindness, not total lack of inner states. However, for Darwin's specific inversion (refuting Special Creation), goal-blindness is sufficient. It breaks the link between *Purposeful Design* and *Purposeful Designer*.
  3.  **The Disclaimer:** You are right. It is load-bearing. It marks the limit of Darwin's inversion in 1859. He inverts Biology (Design), not Psychology (Mind).
  4.  **Turing:** Turing attempts to cross the boundary Darwin marked. He argues that "primary mental powers" are not a starting condition (as Darwin implies) but an emergent property of trained competence. However, this makes Turing vulnerable to the same "goal-blindness" critique unless one accepts a functionalist definition of understanding.

  **Where you might be losing footing:**
  Don't let the "goal-blindness" limitation make you feel Darwin failed. His goal was to naturalize *Adaptation*, not *Consciousness*. The "Strange Inversion" is often retrofitted to look like a theory of mind, but in the *Origin*, it is a theory of *Order*. Darwin shows how Order arises from Chaos. Turing later tries to show how Mind arises from Mechanism. Darwin's disclaimer admits he hasn't done the second part yet. Your reading group member who calls it "diplomatic hedging" underestimates how radical the biological inversion alone was; Darwin didn't need to solve the Hard Problem of Consciousness to overturn Natural Theology. He only needed to solve the Problem of Adaptation.

  **Recommendation for the Group:**
  Suggest that the "Strange Inversion" has two stages.
  *   **Darwin Stage 1:** Competence (Adaptation) without Comprehension (Designer). *Textual support: The Caterpillar/Habit distinction.*
  *   **Turing Stage 2:** Comprehension (Mind) without Special Substance (Soul/Magic). *Textual support: The Child Machine.*

  Darwin's disclaimer is the hinge between them. He secures Stage 1 but explicitly reserves judgment on Stage 2. Turing tries to use Stage 1 to build Stage 2. Your critique holds: if Stage 1 is only "goal-blindness," Stage 2 requires a leap of faith (functionalism) that Darwin was not yet willing to make.
