answer: |-
  You have put your finger on one of the most persistent, nagging intuitions in the philosophy of science. You are correct that logically, "Green except after time $t$" and "Effective except in pediatrics" share the same Boolean structure: $\forall x (P(x) \land \neg C(x) \to E(x))$.

  There is no single, universally agreed-upon noun for this specific "double standard," but the distinction you are sensing is rigorously tracked under a few overlapping concepts. The short answer is that philosophers and scientists distinguish them based on **projectibility**, **ad hocness**, and **independent testability**.

  Here is the breakdown of why "Grue" is mocked while "except pediatrics" is respected, and the vocabulary used to describe the difference.

  ### 1. Projectibility and Entrenchment (Goodman's Own Solution)
  Goodman himself anticipated this. He argued that the difference isn't in the *logic* but in the **entrenchment** of the predicates.
  *   **Green** is entrenched: It has been used in successful projections in the past.
  *   **Grue** is not: It is a disjunctive predicate constructed specifically to fail projection.
  *   **Pediatrics/Quantum:** These rely on predicates like "age," "mass," or "velocity." These are *also* entrenched. We have a long history of successfully projecting laws based on mass and velocity.

  **The Name:** This is the problem of **Projectible Predicates**. A predicate is projectible if it supports inductive inference. "Grue" is non-projectible; "Mass" is projectible.

  ### 2. Ad Hocness (Lakatos and Popper)
  This is likely the closest fit to your feeling of a "sneaky grue-ification." In the philosophy of science (specifically Imre Lakatos), modifying a theory to save it from falsification is acceptable *only if* the modification leads to new, testable predictions.
  *   **Legitimate Restriction:** "Newtonian physics fails at high velocities." This leads to the prediction: "If we accelerate a particle to 0.9c, Newton's equations will deviate by X amount." This was testable and confirmed.
  *   **Grue-style Restriction:** "Emeralds are green, except those observed after 2050." This leads to *no* new testable predictions until 2050. It is purely defensive.

  **The Name:** **Ad Hoc Hypothesis**.
  *   **Theoretically Progressive:** Adding a restriction that opens new empirical tests (e.g., "except at quantum scales").
  *   **Theoretically Degenerating:** Adding a restriction that only patches holes without new predictions (e.g., "except on Tuesdays" or "Grue").

  ### 3. Indexicality vs. Structural Boundaries
  Your intuition highlights that Grue uses a **time index** (or observation index) as the boundary condition, whereas science uses **structural parameters**.
  *   **Grue:** The change happens because of *when* you look (or a calendar date). Time is treated as a magical switch.
  *   **Science:** The change happens because of *physical state*. A drug fails in kids not because of the calendar year, but because of liver enzyme maturity (a physical mechanism). Physics fails at quantum scales not because of the date, but because of the action magnitude relative to Planck's constant.

  **The Name:** **Mechanistic Explanation** vs. **Phenomenological Curve-Fitting**.
  Grue is pure curve-fitting without a mechanism. Scientific domain restrictions are usually proxies for underlying causal mechanisms (even if we don't fully understand the mechanism yet, we know it correlates with a physical variable, not a calendar date).

  ### 4. Independent Testability (The Killer Criterion)
  This is the strongest practical distinction.
  *   **Grue:** To test the "Grue" hypothesis, you must wait until time $t$. You cannot test it now. It is epistemically closed until the deadline.
  *   **Pediatrics:** You can test the drug on a child *today*. The restriction "except pediatrics" is immediately falsifiable/verifiable.
  *   **Quantum Scales:** We can test particles at small scales *today*.

  If a restriction creates a boundary that is **inaccessible to current investigation**, it is suspect. If the boundary is accessible, it is scientific.

  ### Is there a name for the "Double Standard"?
  If you want to sound like you know the literature, you wouldn't call it a double standard. You would argue that the critic is confusing **logical form** with **epistemic virtue**.

  However, if you want to describe the *fear* that science is secretly doing Grue-like things, the term is **Degenerating Research Program** (Lakatos). When a field accumulates too many "except" clauses (epicycles) without unifying them under a deeper theory, it is "degenerating." It is becoming "Grue-ified."

  ### Summary: How to tell the difference
  You asked for the usual way to tell a legit restriction from a sneaky one. Use this checklist:

  1.  **Variable Type:** Is the exception based on a physical parameter (mass, age, energy) or an indexical one (time, location, observer identity)? *Physical parameters are legit; indexicals are suspect.*
  2.  **Testability:** Can I test the exception condition *now*? *If I have to wait for a date to pass, it's Grue.*
  3.  **Unification:** Does the restriction point toward a deeper theory that covers both domains (e.g., Relativity covers both Newton and Quantum)? *If the exception just creates two isolated islands of rules, it's degenerating.*
  4.  **Mechanism:** Is there a plausible causal story for why the boundary exists? *Grue has no mechanism; it is brute fact.*

  ### Conclusion
  You are right that the *logical form* is identical. The distinction is not logical; it is **epistemological**.

  "Grue" is mocked because it is **epistemically inert**: it doesn't help us navigate the world, it doesn't offer a mechanism, and it can't be tested until it's too late. Scientific restrictions are accepted because they are **epistemically fertile**: they map onto causal structures, allow immediate testing, and often point toward deeper unification.

  The "double standard" is actually a filter for **explanatory depth**. If you feel a scientific exception is "Grue-like," you are likely sensing that the field is entering a **degenerating phase** where it is patching holes rather than finding truths. That is a very sophisticated philosophical instinct to have.
