  **Exam Question (75 Minutes)**

  **Question 1**
  Skeptical theists argue that human cognitive limitations prevent us from judging whether instances of suffering are gratuitous. Critics claim this reasoning inevitably 'spills over', undermining our ability to condemn ordinary moral evils (such as factory farming or environmental negligence) on the grounds that these too might serve unknowable goods.

  Evaluate this objection. Can the skeptical theist restrict their epistemic humility to the divine case without collapsing into global moral scepticism? In your answer, consider whether the 'parent-child' analogy supports or undermines this restriction.

  ***

  **Model Answer**

  The evidential problem of evil argues that the sheer amount of intense suffering in the world makes God's existence unlikely. William Rowe's formulation is classic: if there were an omnipotent, omniscient, wholly good God, there would be no pointless suffering. We see suffering that appears pointless. Therefore, God likely doesn't exist.

  Skeptical theism offers a defence not by explaining *why* God permits evil (a theodicy), but by challenging our epistemic position. Thinkers like Stephen Wykstra argue that if God exists, His knowledge infinitely outranks ours. Just as a parent might allow a child to suffer a painful injection for a greater health benefit the child cannot grasp, humans may be too cognitively limited to see the 'greater goods' justifying specific evils. We aren't in a position to claim any suffering is genuinely gratuitous.

  The 'spillover' objection hits here. If we accept that our cognitive limitations block us from judging God's reasons, why don't they block us from judging human actions? Suppose I see a factory farmer causing immense animal suffering. If I adopt skeptical theism, I must admit that this suffering might be part of a hidden divine plan I cannot comprehend. Consequently, I lose the epistemic footing to condemn the farmer. This isn't just about theology; it threatens practical morality. If we can't rule out hidden goods, moral deliberation becomes paralysed. This is sometimes called the 'moral scepticism objection'.

  Now, is this a fair *reductio* or a straw man? The skeptical theist has a counter-move: the disanalogy between God and humans. We know humans are finite agents with limited moral permissions. We generally assume humans are not authorised to cause suffering for goods they cannot specify. God, being sovereign, might have such authority; humans do not. Therefore, we can condemn the factory farmer based on *human* moral norms, even if we remain agnostic about *divine* reasons for permitting the farmer's existence.

  However, this restriction is tricky. If the suffering is part of a divine plan, isn't the farmer merely an instrument of that plan? If I intervene to stop the farming, might I be thwarting a hidden good? The skeptical theist must argue that we are obligated to follow revealed moral rules (e.g., 'do not cause unnecessary suffering') regardless of hidden consequences. But this raises a tension: if we should ignore hidden goods in human decision-making, why think God relies on them?

  Here's where your 'spillover' twist regarding climate damage gets interesting. It's less standard in the literature than the general moral scepticism objection, but it sharpens the point. Climate harm is cumulative and complex. If a skeptical theist says, "We can't know if this disaster serves a greater purpose," they risk undermining the urgency of environmental action. To avoid this, they must insist that epistemic humility applies only to *retrospective* judgment of God's reasons, not *prospective* human decision-making.

  So, can the analogy be restricted? It depends on whether you view cognitive limitation as a global barrier to value judgment or a specific gap in divine comprehension. If it's the former, the spillover is fatal. If it's the latter, the skeptical theist survives, but at the cost of admitting a sharp discontinuity between human and divine morality. Ultimately, the spillover objection doesn't refute skeptical theism logically, but it raises the price of admission. It forces the theist to accept that their defence makes moral reasoning in this life significantly more complex than it appears. Whether that's a manageable cost or a *reductio* depends on how much weight you give to intuitive moral judgments versus theological coherence.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **1. Framing the Evidential Problem & Skeptical Theism (8 marks)**
  *   **A (7-8):** Clearly distinguishes the evidential problem (Rowe-style) from the logical problem. Explains skeptical theism as an epistemic defence (cognitive limitation) rather than a theodicy (justification). Correctly uses the parent-child analogy.
  *   **B (5-6):** Summarises the problem of evil and defines skeptical theism but may conflate 'defence' with 'theodicy'. Explains the parental analogy but lacks precision on the epistemic gap.
  *   **C (0-4):** Vague definitions. Confuses skeptical theism with standard free-will defences.

  **2. Engaging the 'Spillover' Objection (10 marks)**
  *   **A (9-10):** Explicitly articulates the move from divine cognitive limitation to human moral scepticism. Evaluates whether the objection applies to specific cases (factory farming/climate). Crucially, distinguishes between established literature (general moral scepticism) and the specific environmental/interspecies extension (flagging this as a sharper, contested edge). Analyses whether this is a legitimate extension or a *reductio*.
  *   **B (6-8):** Describes the spillover objection accurately but treats it as a settled fact rather than a contested objection. Fails to distinguish between judging God vs. judging humans. Applies the factory farming example superficially without analysing the 'hidden plan' implication.
  *   **C (0-5):** Mentions moral scepticism but fails to link it to the cognitive limitation premise. Ignores the specific examples given in the question.

  **3. Critical Evaluation & Restriction Strategies (5 marks)**
  *   **A (5):** Evaluates the 'disanalogy' counter-move (divine sovereignty vs. human norms). Assesses whether epistemic humility can be quarantined to the divine case. Offers a reasoned conclusion on whether the cost is acceptable.
  *   **B (3-4):** Lists counter-arguments without evaluating their success. Concludes indecisively or relies on personal belief rather than philosophical weighing.
  *   **C (0-2):** No evaluation provided. Merely restates the prompt.

  **4. Clarity, Structure & Style (2 marks)**
  *   **A (2):** Precise British English (e.g., 'scepticism', 'defence'). Clear paragraph structure. Tone is academic but accessible. Correct spelling of technical terms (e.g., 'theodicy').
  *   **B (1):** Minor grammatical errors or inconsistent spelling (UK/US mix). Structure is readable but disjointed.
  *   **C (0):** Difficult to follow. Persistent errors.

  **Examiner's Note on the 'Spillover' Twist:**
  Students should be rewarded for recognising that while the 'moral scepticism objection' is standard (e.g., Maitzen, Russell), the specific application to environmental policy or factory farming as a *reductio* is a more novel, contentious extension. An A-grade answer will flag this nuance rather than treating it as textbook dogma. Skepticism should not be presented as the standard view; it is a live defence with significant costs.
