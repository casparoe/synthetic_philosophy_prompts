answer: |-
  ### Desiderata for a Normative Theory of Inductive Inference

  **Purpose:** To prescribe an inductive bias for a concrete research inquiry and justify that prescription as more than preference.

  #### 1. The Benchmark Requirement (NFL Response)
  **Classification:** Non-negotiable.
  **Case:** A theory that averages performance over all possible target functions (the uniform prior) yields the No-Free-Lunch result: no bias outperforms random guessing. This is mathematically correct but pragmatically useless. A research group does not operate in the space of *all logically possible* worlds; they operate in *this* world. A theory must explain why the uniform average is the wrong baseline for decision-making. It must argue that neutrality is not a virtue when action is required; the "neutral" starting point is actually a specific, pessimistic bias against structure. The theory must justify privileging a subset of environments (e.g., "smooth" or "compressible" functions) without appealing to magic.

  #### 2. The Domain-Grain Requirement
  **Classification:** Non-negotiable.
  **Case:** As you noted, NFL verdicts shift depending on how the space of environments is carved up. If a theory allows the user to define the domain *after* choosing the bias (e.g., "The domain is exactly those problems where Bias X works"), the theory is tautological. The theory must provide criteria for individuating a domain that are independent of the success of the bias within it. It must prevent gerrymandering. If the theory cannot distinguish between "physical systems in 2024" and "physical systems where my bias works," it offers no guidance.

  #### 3. The Transport Requirement
  **Classification:** Genuine Desideratum (Trade-offable).
  **Case:** Science relies on analogy. We use biases developed in physics for economics, or in vision for language. A theory that treats every inquiry as an island, forbidding the transfer of inductive lessons from one context to a neighbouring one, fails to capture scientific practice. However, this may be trade-offable against strictness of Domain-Grain. If domains must be hyper-specific to ensure bias validity (to satisfy NFL), transport becomes impossible. A theory might have to admit that transport is a heuristic risk rather than a licensed inference.

  #### 4. The Feasibility Requirement
  **Classification:** Non-negotiable (for this purpose).
  **Case:** You asked for a theory to tell a research group *what to do*. A theory that prescribes an uncomputable prior (e.g., Solomonoff induction) or requires infinite data to converge fails this purpose. While ideal theories can serve as regulative ideals, a theory that cannot be implemented even in principle by bounded agents cannot adjudicate between concrete choices of bias. If the justification for a bias requires resources the group cannot access, the justification is inert. Feasibility is not merely engineering; it is epistemic, because a justification you cannot use is not a justification for you.

  #### 5. The Non-Circularity Requirement
  **Classification:** Prejudice (Strike from list).
  **Case:** You asked if a non-circular requirement belongs on the list. It must be struck. Hume's problem demonstrates that justifying induction without assuming the reliability of induction is impossible. NFL demonstrates that justifying a bias without assuming a distribution over environments is impossible. Demanding non-circularity guarantees the theory will be empty. The requirement should be replaced with **Pragmatic Vindication**: the theory must show that adopting the bias is the best available strategy for achieving the group's goals, given that they must start somewhere. Circular bootstrapping is not a bug; it is the only available feature.

  #### 6. Recoding Invariance (User Candidate 1)
  **Classification:** Prejudice (Strike from list).
  **Case:** You suspected this might be impossible. It is. As NFL implies, for any learner that succeeds on a set of functions, there is a permutation of the input/output space (a recoding) that makes those functions look random and the learner fail. To demand invariance under *all* computationally equivalent recodings is to demand immunity to NFL, which is impossible. A theory must privilege a vocabulary (a "natural" coordinate system). Demanding full invariance forces the theory to be silent on which bias to pick, because every bias is "natural" in some encoding. The theory must instead explain *why* certain encodings are privileged (see Domain-Grain), not pretend all encodings are equal.

  #### 7. Empirical Equivalence Ranking (User Candidate 2)
  **Classification:** Non-negotiable.
  **Case:** This is the core of the projection problem. If a theory can only rank hypotheses based on past fit, it is descriptive, not inductive. Two hypotheses may fit all existing data perfectly but diverge on the next observation (e.g., "All emeralds are green" vs. "All emeralds are grue"). A theory that cannot order these without waiting for new data has abandoned the task of inference. It must provide a principle (simplicity, stability, causal depth) that breaks ties between empirically equivalent competitors *now*.

  ---

  ### The Inconsistency: Domain-Grain vs. Transport

  **The Conflict:**
  The **Domain-Grain Requirement** and the **Transport Requirement** cannot be jointly satisfied at full strength.

  To satisfy **Domain-Grain** in light of NFL, the domain must be individuated finely enough that the assumption "this bias works here" is not trivial. The more specific the domain (e.g., "low-noise visual recognition tasks on earth"), the safer the bias. However, as the domain becomes more specific to ensure the bias is justified, it becomes less like any *other* domain. This destroys **Transport**. If the domain is "visual recognition on earth," you cannot legitimately transport the bias to "visual recognition on Mars" or "audio recognition on earth" without violating the Grain constraint (since you haven't proven the bias works in those *new* grains).

  Conversely, to satisfy **Transport**, domains must be carved coarsely (e.g., "all sensory data"). But at this coarse grain, NFL re-emerges. The space of environments is too heterogeneous for a single bias to be justified without begging the question. You cannot have objectively fixed, fine-grained domains *and* legitimate transfer between them without assuming a uniformity of nature that the theory is supposed to justify.

  **Resolution:**
  Drop the demand for **Objective Domain-Grain**. Replace it with **Coherentist Domain-Grain**.
  We cannot fix the grain by appealing to the "true structure" of the world from nowhere (that violates Non-Circularity, which we already struck). Instead, the grain is fixed by the stability of successful practice. A domain is "real" enough if multiple independent biases converge on similar predictions within it.
  **Cost:** We lose metaphysical certainty. We cannot tell the research group "This bias works because the world *is* this way." We can only say, "This bias works because it coheres with the web of successful inferences we already maintain." The justification is holistic, not foundational.
  **Survival:** The surviving list still does the job. It tells the group to adopt the bias that best coheres with established successful practices in neighbouring domains (satisfying Transport pragmatically) while acknowledging the boundaries of that coherence (satisfying Grain pragmatically).

  ---

  ### Scorecard

  **Bayesian / Universal-Prior Accounts**
  *Fails Feasibility and Domain-Grain.*
  While they satisfy Empirical Equivalence (via priors) and handle the Benchmark (by rejecting uniformity), they typically rely on priors that are either subjective (violating Grain) or uncomputable (violating Feasibility). They tell you what to do *if* you have the prior, but cannot justify the prior without circularity.

  **Simplicity / Minimum-Description-Length (MDL)**
  *Fails Recoding (Struck) and struggles with Domain-Grain.*
  MDL satisfies Feasibility and Empirical Equivalence well. It offers a concrete metric for bias selection. However, "simplicity" is language-dependent. Without an objective account of why *this* language captures the Domain-Grain naturally, it looks like a prejudice. It works only if we accept the Coherentist resolution to Grain.

  **Error-Statistical / Severe-Testing**
  *Fails Empirical Equivalence Ranking.*
  This approach excels at Feasibility and avoids circularity by focusing on error control rather than truth. However, it refuses to rank hypotheses that haven't been tested yet. It tells you when to reject a bias, but not which of two unrefuted biases to adopt. It dissolves the problem of induction by refusing to solve the problem of projection.

  **Causal / Physical Structure Accounts**
  *Fails Non-Circularity (Struck) but best on Domain-Grain.*
  These accounts argue we use specific biases because the physical world has specific causal structures. This satisfies Grain and Transport best (physics is uniform). However, it presupposes we can know the causal structure without induction. It pushes the problem back one step: how do you infer the causal structure? It is the strongest candidate *if* you accept the Pragmatic Vindication replacement for Non-Circularity.

  **Single Requirement Doing the Most Work:**
  **Feasibility.** It excludes the Universal-Prior accounts immediately. It forces the theory to be about *human* inquiry, not idealized inference, which is necessary for your goal of guiding a research group.

  ---

  ### Epistemic Posture Note

  **Confidence in List:** High (85%).
  The structural tensions between NFL, Hume, and action-guidance are well-constrained. The classification of Non-Circularity and Recoding as "Prejudices" is robust given the impossibility results inherent in the problem structure.

  **Least Sure Claim:** The classification of **Feasibility** as Non-negotiable.
  **Consideration to Change Mind:** If one argues that an infeasible theory (like Solomonoff Induction) provides a "North Star" that allows a research group to approximate the ideal even if they cannot reach it, then Feasibility should be downgraded to a Trade-offable Desideratum. If the goal were "understand the limits of inference" rather than "tell a group what to do," Feasibility would be less critical. However, for your specific constraint of *action-guidance for a concrete inquiry*, I maintain it is non-negotiable.
