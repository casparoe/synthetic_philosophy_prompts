answer: |-
  **DEPARTMENT FOR WELFARE OPTIMISATION**
  **GUIDANCE NOTE 44-B: TRANQUILITY METRIC ASSESSMENT (TMA)**

  **1. Definition of Welfare Deficit**
  For the purposes of benefit allocation, welfare is defined exclusively as the absence of quantifiable negative states. A "Welfare Deficit" occurs only when a claimant experiences active suffering, pain, or unsatisfied craving. The Department does not recognise the presence of positive experiences (e.g., joy, contentment, aesthetic appreciation) as contributing to welfare scores unless such experiences directly remediate a pre-existing Deficit.

  **2. Exclusion of Neutral Stimuli**
  Assessors must record zero value for activities that generate enjoyment without prior unease. Claimants reporting satisfaction from sunsets, non-essential conversation, or recreational hobbies shall be scored as neutral. Similarly, consumption of food where no hunger was reported constitutes a neutral event. Resources directed toward providing such stimuli are classified as inefficient expenditure.

  **3. Remediation Hierarchy**
  Where a Deficit is identified (e.g., hunger, loneliness, ambition), the Department prioritises the elimination of the craving over its satisfaction. Pharmacological suppression of appetite scores identically to feeding the claimant on the Tranquility Metric, as both result in the absence of hunger. Given the lower unit cost of appetite suppressants compared to food provision, Claimants are advised that chemical suppression is the standard remediation pathway. Satisfaction of cravings is only authorised where suppression is clinically contraindicated.

  **4. Baseline Adjustments and Expectations**
  Claimants who have successfully lowered their expectations to align with their circumstances shall be assessed based on their current state of craving, not their potential state. A claimant who has ceased to desire employment, companionship, or mobility due to long-term deprivation tests as serene. No intervention is required for these claimants, as no Welfare Deficit exists. Uplifting expectations would constitute a net welfare loss by introducing new unsatisfied cravings.

  **5. Aggregation and Resource Trading**
  In cases of resource constraint, Assessors may trade severe Deficits against minor ones. The agony of one claimant may be outweighed by the cumulative faint unease of a larger cohort. For example, denying pain medication to a single terminal patient is permissible if the resources allocated thereby reduce mild anxiety in five hundred otherwise tranquil claimants. The Metric aggregates total absence of craving; the distribution of suffering is secondary to the net reduction of negative states.

  **6. Data Integrity and Non-Claimants**
  For statistical completeness, deceased persons register a perfect Tranquility Score, as they possess no capacity for craving or suffering. This equivalence between the deceased and the perfectly tranquil living is flagged as a data artefact inherent to the Metric's structure. It should not be interpreted as a policy implication regarding mortality management. Assessors are reminded that active termination remains illegal under separate statutes, despite the favourable welfare weighting.

  **7. Implementation**
  These clauses are effective immediately. Claimants found manufacturing positive experiences to inflate scores will be sanctioned.

  ***

  **Notes on the View**
  This satire leans hard on the "empty grave" objection (that the dead score perfectly), which most actual tranquilists reject by restricting moral concern to existing sentient beings. Additionally, while tranquilism implies eliminating a craving is welfare-neutral compared to satisfying it, proponents often argue that arbitrary deletion violates autonomy or integrity constraints not captured by the welfare metric alone.
