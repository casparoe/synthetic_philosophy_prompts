prompt: |-
  Hey — I'm working on the welfare-side stuff (tranquilism: the only thing that matters prudentially is being free of suffering and craving, roughly Epicurean ataraxia, so an enjoyment that isn't relief of some prior unease adds nothing to a life) and I want a bit of satire for a reading-group handout.

  Write a page of official guidance notes, in numbered clauses, from a government department that has adopted tranquilism as its official welfare metric — say a "Tranquility Assessment" or claimant guidance for some benefit — in deadpan civil-service prose, about 600 words. The jokes should come from the view's actual commitments, not invented ones: define what counts as a craving for scoring purposes; state plainly that pure enjoyments (sunsets, conversation, a second helping when you weren't hungry) score zero; note that deleting a craving scores exactly the same as satisfying it and therefore wins on cost grounds (the state funds appetite-suppressants rather than food, that sort of thing); handle the constituents who've quietly lowered their expectations and now test as serene; give the aggregation rule for trading one person's agony against many people's faint unease; and somewhere in the small print admit that the deceased score the same as the perfectly tranquil, flagged as a data artefact rather than a policy implication. Don't name-drop philosophers or explain the jokes — let the reductio do the work, and keep it legible to someone who's never heard of the view.

  Two or three sentences at the end: note where the piece takes liberties or leans on a contested reading of tranquilism (weather craving is meant attitudinally or as a felt unease, whether the view is about momentary or whole-life value, whatever). And push back plainly if the setup is confused — if no actual tranquilist is committed to the craving-deletion implication, or my gloss misstates the view, say so instead of just writing the thing politely.
