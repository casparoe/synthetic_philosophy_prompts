          *   *Severity:* Moderate (Practical application).
          *   *Defender's Response:* Must rely on best historical judgment. If sources are truly irreconcilable, the project might be impossible.
          *   *Verdict:* Merely awkward. It makes the work harder, not the theory wrong.

      *   **Objection 4: Unfalsifiability (The "No True Scotsman" Risk).**
          *   *Scenario:* Every contradiction is explained away as "apparent" or "complex."
          *   *Challenge:* If nothing can count as a violation of axiological continuity, the theory says nothing.
          *   *Severity:* Fatal (Philosophical validity).
          *   *Defender's Response:* Must define limits.
          *   *Verdict:* Fatal if admitted.

  3.  **Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the "axiological continuity" thesis. It shifts the debate from *fact* to *character*.
