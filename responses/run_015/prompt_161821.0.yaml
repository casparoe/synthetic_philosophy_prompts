          *   *Problem:* What makes the person at Cycle 2 the *same* as Cycle 1? Usually, it's numerical identity. But if there's no causal connection or memory, is it just a brute fact?
          *   *Constraint:* If E says "it's the same person," she needs a principle of individuation. If she says "different people," she sounds like a counterpart theorist (which is often associated with P/Lewis).
