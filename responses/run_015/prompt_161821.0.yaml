          *   Both must address: Do their usual selling points (P: change/temporary intrinsics; E: ordinary persistence) work here?
          *   Ending: Each concedes one real point, followed by a crisp statement of the remaining dispute.
      *   **Tone:** Philosophical, rigorous, respectful, dialectical.

