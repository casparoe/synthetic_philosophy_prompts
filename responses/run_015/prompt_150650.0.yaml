      *   *Case 2 (Unfaithful self-report):* Confabulated rationale. Lena: It's noise/error, not deception, unless the internal state hid the real reason. Sam: It violates the norm of assertion regarding reasons.
      *   *Concession 1 (Lena):* Admits that if the internal state is inaccessible (black box), her definition fails the audit requirement. She must concede that "readable report channel" might need to be inferred behaviorally.
      *   *Concession 1 (Sam):* Admits that without distinguishing error from deception, the norm is too blunt. He needs a counterfactual condition about *intent* or *selection pressure*.
      *   *Case 3 & 4 (Training & Monitoring):* Disposition vs. Occurrent. External monitor. Lena: If the internal weights are shaped to omit, it's dishonest dispositionally. Sam: If the output satisfies the norm in context, it's honest, regardless of training history.
