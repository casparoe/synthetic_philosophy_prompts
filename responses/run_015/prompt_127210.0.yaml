      3.  **Break at (2):** Redefine co-consciousness. Cost: Risking unverifiable metaphysics.
      4.  **Accept (9):** Cost: The novel is impossible.

      *Recommendation:* Break at **(6)**, supported by a refinement of **(2)**.
      Distinguish between *informational encapsulation* (normal) and *agency fragmentation* (split-brain).
      The "Subject" is the locus of *agency and narrative memory*. Subpersonal processes don't have agency or narrative memory. Split-brain hemispheres *might*.
      This preserves the novelist's ground: The narrator is the locus of narrative memory. Even if split, *a* narrator exists (perhaps alternating).
