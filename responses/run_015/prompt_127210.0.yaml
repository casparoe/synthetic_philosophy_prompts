      *Wait, the user's worry:* If (9) is true, *no* book can be written. So we must save the "One Subject" for the normal case at least.
      So we must break the analogy between (4) and (6).

      *Decision:* I will argue for breaking the link at **(6)**. The analogy between hemispheric disconnection and subpersonal modularity is flawed.
      *Reasoning:* Subpersonal modules are *servants* to a unified executive function (even if that executive is a fiction, it's a singular fiction). Split-brain hemispheres can generate *conflicting* executive functions.
      *Cost:* We admit that "Subject" is a functional, pragmatic category, not a metaphysical absolute. We accept vagueness at the margins but insist on a functional core.

      *Wait, I need to address the "Price" request.*
