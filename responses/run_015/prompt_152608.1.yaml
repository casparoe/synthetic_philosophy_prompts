answer: |-
  You have identified a sophisticated and under-theorized asymmetry in the methodology of historical counterfactuals. While there is no single, universally canonical term in the philosophy of history that captures this *exact* evaluative pattern, it sits at the intersection of **Institutional Complementarity** (from comparative political economy) and **Cotenability** (from the philosophy of science and counterfactual logic).

  In the specific literature of counterfactual history (e.g., Tetlock, Belkin, Lebow, Ferguson), this is often discussed under the umbrella of **"theoretical consistency"** or **"minimal rewrite,"** but those terms fail to capture the *grouping* effect you describe.

  To address your request precisely, I will propose the term **Structural Cotenability** to label this phenomenon, define it, distinguish it from adjacent concepts, and outline the criteria for legitimate bundling.

  ### 1. Terminology and Definition

  **Proposed Term:** **Structural Cotenability** (or **Configurational Plausibility**)

  **Definition:** Structural Cotenability is an evaluative heuristic in counterfactual history wherein the plausibility of an antecedent is determined not by the cardinality of variables altered (the "count" of changes), but by the **internal functional coherence** of those alterations.

  Under this heuristic, a set of $n$ changes is treated as a single unit of analysis (cost = 1) if the variables constitute a recognized system or institution, whereas the same $n$ changes are treated as independent events (cost = $n$) if they lack structural interdependence.

  **Theoretical Lineage:**
  *   **Philosophical Root:** *Compossibility* (Leibniz). The idea that certain truths can only exist together.
  *   **Social Science Root:** *Institutional Complementarity* (Aoki; Hall & Soskice). The empirical observation that certain institutions (e.g., labor markets and corporate governance) function effectively only when paired.
  *   **Counterfactual Root:** *Cotenability* (Goodman; Tetlock). The requirement that background conditions must remain consistent with the antecedent. Your observation extends this: the antecedent *itself* must be internally consistent.

  ### 2. Distinctions from Adjacent Concepts

  To isolate this phenomenon, we must distinguish it from two concepts that often confuse the issue: **Institutional Path-Dependence** and **Auxiliary-Hypothesis Adjustment**.

  #### A. vs. Institutional Path-Dependence
  *   **Path-Dependence** is a *diachronic* (temporal) causal claim. It argues that past decisions constrain future possibilities through mechanisms like increasing returns, lock-in, or adaptive expectations. It explains *why* a change is hard to sustain over time.
  *   **Structural Cotenability** is a *synchronic* (structural) evaluative criterion. It assesses the *starting point* of the counterfactual.
      *   *Example:* Arguing that a 1920s democracy would inevitably collapse into fascism by 1935 due to economic stress is a **path-dependence** argument.
      *   *Example:* Arguing that you cannot change the electoral system without also changing party financing rules to make the scenario intelligible is a **Structural Cotenability** argument.
  *   **Key Difference:** Path-dependence concerns the *consequent* (the trajectory after the change); Structural Cotenability concerns the *antecedent* (the coherence of the change itself).

  #### B. vs. Auxiliary-Hypothesis Adjustments
  *   **Auxiliary Hypotheses** (Lakatos) are modifications made to background theories to prevent a core hypothesis from being falsified. In counterfactuals, this often looks like "cheating" to ensure the desired outcome occurs (e.g., changing human psychology to make a battle go differently).
  *   **Structural Cotenability** is not about protecting the *outcome*; it is about validating the *input*.
      *   *Auxiliary Adjustment:* "The General wins the battle *because* we assume his troops are suddenly braver." (Ad hoc fix for the result).
      *   *Structural Bundle:* "The General wins the battle *because* we assume a reform package that improved logistics, morale, and intelligence simultaneously." (Coherent fix for the premise).
  *   **Key Difference:** Auxiliary adjustments are often viewed as methodological sins (violating minimal rewrite); Structural Bundling is viewed as a methodological necessity (respecting systemic reality).

  ### 3. Conditions for a Legitimate Bundle

  If the quantitative burden is identical, what makes a bundle "legitimate" (coherent) rather than "ad hoc" (a conspiracy of miracles)? To pass the test of Structural Cotenability, a counterfactual bundle should satisfy at least three of the following four conditions:

  #### A. Functional Interdependence (The "Necessity" Test)
  Do the variables logically or functionally require one another to operate?
  *   *Legitimate:* Changing an electoral formula from First-Past-The-Post to Proportional Representation *requires* changing party financing rules, because the old financing rules were designed for single-member districts. One creates a dysfunction without the other.
  *   *Ad Hoc:* Changing the electoral formula *and* changing the national bird. These are functionally orthogonal.

  #### B. Unitary Causal Source (The "Mechanism" Test)
  Can the bundle be traced to a single historical mechanism or event, rather than independent shocks?
  *   *Legitimate:* A Constitutional Convention occurs. It produces changes to the judiciary, the legislature, and the military charter. This is one event (the Convention) producing multiple outputs.
  *   *Ad Hoc:* The judiciary becomes independent, *and* the military becomes loyal, *and* turnout rises, but there is no single event (like a revolution or reform act) that links them. They are treated as three separate miracles.

  #### C. Empirical Existence Proof (The "Precedent" Test)
  Does this specific configuration of variables exist elsewhere in the historical record (spatially or temporally)?
  *   *Legitimate:* Proposing a Nordic-style welfare state in 1940s Britain. While counterfactual for Britain, the "bundle" of institutions existed in Sweden. It is a "imported model," not a fabrication.
  *   *Ad Hoc:* Proposing a bundle of institutions that has never existed in any human society (e.g., absolute monarchy combined with universal suffrage and independent judicial review in the 18th century). This fails the existence proof.

  #### D. Theoretical Integration (The "Model" Test)
  Does a recognized social science theory predict that these variables move together?
  *   *Legitimate:* Modernization Theory might suggest that industrialization, urbanization, and literacy rise together. Altering them as a cluster aligns with theoretical expectations.
  *   *Ad Hoc:* Altering variables that theory suggests are negatively correlated or unrelated, without explaining the deviation.

  ### 4. Summary of the Asymmetry

  The asymmetry you encounter arises because historians implicitly treat **institutions as systems, not aggregates.**

  *   **Scenario A (Clustered):** The critic sees a *system transition*. The "cost" is the probability of the transition event (e.g., a Constitutional Convention), not the sum of the articles changed within the constitution.
  *   **Scenario B (Dispersed):** The critic sees *system noise*. The "cost" is the joint probability of independent events ($P(a) \times P(b) \times P(c)$), which diminishes rapidly with each added variable.

  **Conclusion:**
  There is no single standard term, but **Structural Cotenability** accurately describes the phenomenon. It is a valid methodological constraint, provided the "bundle" meets the criteria of **Functional Interdependence** and **Unitary Causal Source**. Without these, the "bundle" is merely a way to disguise a conjunction fallacy, allowing the counterfactualist to sneak in multiple miracles under the guise of "institutional coherence."
