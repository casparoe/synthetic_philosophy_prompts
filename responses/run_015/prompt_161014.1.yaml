prompt: |-
  hey, so my brother's doing philosophy at uni and he tried to explain something to me at dinner last night and now i cant stop thinking about it. can you write me a dialogue about it?

  the setup as i understood it: there are three stances you can take toward something to predict what it'll do — the physical one (do the physics), the design one (what was it built or selected to do), and the intentional one (treat it like it has beliefs and wants and is being roughly rational). and apparently some guy — dennett? i think that's the name, im not confident — says a pattern is real rather than just projected by us if it's compressible: describing the thing that way lets you predict its behaviour using way less information than you'd need to describe what its parts are up to.

  the fight i want written: me and my friend argue about chatbots. when I treat a chatbot as believing paris is in france and wanting to be helpful, and that lets me predict what it'll type next, am I latching onto a real pattern in the thing — same sense that a chess program really is trying to win — or am I doing the face-in-a-cloud thing, projecting, and getting lucky because the output was trained on text written by creatures that do have beliefs? write it as two people going at it, around 900 words, and both of them have to be genuinely good at this. I don't want a punching bag.

  some things i want them to actually deal with instead of talking past each other:

  1. the compression auction. suppose they agree to settle it like this: whoever's description lets you predict the next thousand outputs from fewer bits wins, and winning means your pattern is the real one. now make them handle the ugly outcome, where the best description isn't one agent with beliefs and isn't the design story either, but something like "a weighted mixture of about forty roles, and which one dominates depends on how the prompt reads" — or even "whatever text would show up in a transcript where a helpful person gets asked this." forty agents? zero agents? or was the auction just a bad test?

  2. the leak test. the intentional description works great on normal prompts and falls apart on weird ones — another language, mangled formatting, being told it's a toaster, very long context. both of them know this. is a pattern that only holds in-distribution still a real pattern, or does the leaking show the pattern was in our description? and make them compare it to a pattern that also leaks, like a chess engine playing a kind of position it never saw.

  3. the fork. same weights, two system prompts: one makes a customer service bot, one makes a pirate. if intentional patterns are real, are there as many agents as prompts? then the bit I like: you train the model on the pirate's own outputs until the pirate turns up with no system prompt at all, so now the pattern is stable and persistent. more of an agent now, or is that just the design stance doing the work?

  also: please don't let either of them end it with "it's just autocomplete / just statistics" and walk off. the other person already knows that. someone should also push back on the move where the physical stance is called the only real one, because "trying to win" sure seems like a real pattern in a chess program.

  and somewhere in the middle I want them to notice they mean two different things by "real": one means something like there's a structure there that any decent predictor would find, the other means there's a someone in there, a point of view, something it's like. have each say what kind of evidence would settle their question and what kind obviously wouldn't.

  end with them agreeing on one argument that both of them think is bad, and one experiment neither of them knows how to run yet. don't resolve it. and no citing papers or name-dropping books — my brother does enough of that already, I just want to hear the fight.
