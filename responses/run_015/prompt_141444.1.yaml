answer: |-
  The primary job of function attribution in biology is to explain the presence of a trait within a lineage by referencing the consequences that secured its retention. Functions are not merely labels for current utility; they are historical explanations for why a specific item exists rather than some alternative. When we attribute a proper function, we claim that the item is here *because* ancestors did that thing. In the case of the lancet cells, this explanatory job cannot be done. The cells are not present because previous lancet cells defended colonies; they are present because a fragile site mutates. To attribute a proper function to the cells would be to offer a false history of their presence. Instead, lancet cells should be categorized as *selected byproducts*. They are causally essential to the fitness of the colony and reliably produced by a selected mechanism, but they are not themselves the units of selection. This is not a terminological concession to the causal-role theorist. It preserves the explanatory power of the etiological account: we can explain why the cells exist (the site was selected) without falsely implying the cells themselves possess a historical lineage of selection.

  The etiological theorist's usual escape hatch is to allow the item to borrow function from the selected mechanism that produces it. Since the fragile site is selected for producing lancet cells, one might argue the cells inherit the function of colony defence. This move must be rejected, for it proves too much. If any effect of a selected mechanism inherits proper function, then every downstream causal consequence becomes functional. If the fragile site is selected for producing cells that defend, and defending involves releasing toxins, does the toxin have a proper function? Does the space the toxin occupies? Borrowing functions indiscriminately collapses the distinction between the selected trait and its causal footprint. The fragile site has the function of producing lancet cells. The lancet cells are the *effect* that constitutes the fulfillment of that function, not items with functions of their own. To assign them a proper function is to confuse the vehicle of selection (the site) with the ephemeral output (the cell).

  This verdict invites the objection from normativity. The etiological account is prized for grounding malfunction: a heart that cannot pump is defective because it fails to perform the effect that selected for hearts. If lancet cells have no proper function, a lancet cell that misfires cannot be defective. This seems to abandon the normative force biology requires. However, the normativity is not lost; it is relocated. The locus of defectiveness is the fragile site, not the cell. If an individual fails to develop lancet cells, the *developmental mechanism* is malfunctioning. A misfiring cell is not a defective organ; it is a statistically aberrant output of a functioning mechanism, akin to a bullet that duds rather than a gun that jams. The standard for correctness applies to the selected mechanism's production of the cell type, not to the performance of every token cell. We retain the ability to critique the system's failure without attributing historical norms to ephemeral somatic products.

  Finally, the causal-role theorist will object that this verdict contradicts biological practice. A field biologist writing that "the function of the lancet cell is colony defence" is not making a claim about selection history, but about current systemic capacity. To deny this is to silently rewrite the biologist's claim. This objection conflates the *explanandum* with the *explanans*. The biologist is correct that the cell *contributes* to defence, but the etiological account clarifies what makes that contribution a *function* rather than a mere capacity. The biologist's claim is shorthand for "this cell contributes to a capacity that explains the presence of the mechanism producing it." The etiological account does not read the biologist as making a historical claim explicitly; it argues that the historical claim is what makes the functional attribution scientifically robust rather than merely descriptive. Without the history, the attribution is merely a report of current utility, which fails to distinguish function from accidental benefit. The etiological verdict preserves the depth of the explanation even if it tightens the criteria for attribution.

  **Coda**

  The premise I am least confident in is the claim that normativity cannot attach to the cell token itself. It is possible that once a mechanism is selected, its immediate outputs inherit normative status regardless of their replicative history. My mind would be changed by observing how biologists treat somatic mutations in clonal organisms. If they routinely diagnose specific somatic cells as "defective" in an evolutionary sense (rather than merely statistically abnormal) despite those cells having no lineage history, it would suggest the etiological account is too restrictive regarding where functions reside.
