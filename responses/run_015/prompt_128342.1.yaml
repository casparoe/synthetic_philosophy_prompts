      *(Self-Correction during drafting)*: I need to be careful not to conflate Jaynes' Transformation Group method with MaxEnt. The user conflates them in Worry 1. I must point out that the Transformation Group method *derives* the measure without maximizing entropy, though they often coincide. The circularity charge applies to the *choice of group*, not the background measure.
      *Also*, I need to emphasize that Bertrand's original problem *was* underspecified. Jaynes' point is that *real* physical problems aren't underspecified. The user's claim is that PoI works for *real* problems. The counter is: What about *epistemic* problems where the physical mechanism is unknown?

