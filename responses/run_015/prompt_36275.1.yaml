answer: |-
  The whole job is separating those who qualify under the Convention from those who merely deserve pity, using a chain of logic where any broken link mandates refusal.

  ### The Decision Procedure (Standard Order of Analysis)

  **1. Credibility Assessment (The Gate)**
  *   **Question:** Is the core account materially credible?
  *   **Procedure:** Compare testimony against known country information (CPINs) and internal consistency. Absence of documents is not fatal; give benefit of the doubt if the account is coherent and plausible.
  *   **Refusal Point:** If you find a lie or a material inconsistency that undermines the entire claim, refuse here. Do not proceed to law.
  *   **[JUDGMENT CALL]:** Determining what is "material." A wrong date is usually immaterial; a wrong location of arrest is material. Trauma affects memory; cultural differences affect storytelling. You are deciding how much human error to allow before calling it a lie.

  **2. Well-Founded Fear (The Risk)**
  *   **Question:** Is there a real risk of serious harm upon return?
  *   **Procedure:** Assess objective risk (country conditions) and subjective fear. Past persecution creates a presumption of future risk unless circumstances have changed fundamentally.
  *   **Refusal Point:** If the harm feared is general violence (crime, civil war) not targeting the claimant specifically, or if the risk is speculative/low probability, refuse here.
  *   **[JUDGMENT CALL]:** Distinguishing "persecution" from "awful conditions." Discrimination is not persecution unless it accumulates to serious harm. You are deciding the threshold of suffering required to trigger protection.

  **3. The Nexus (The Reason)**
  *   **Question:** Is the harm connected to Race, Religion, Nationality, Political Opinion, or Membership of a Particular Social Group (PSG)?
  *   **Procedure:** Identify the protected ground. For PSG, the group must share an immutable characteristic and be distinct in the society's eyes.
  *   **Refusal Point:** If the harm is personal (vendetta, family dispute) without state tolerance *due to* a Convention reason, refuse here.
  *   **[JUDGMENT CALL]:** Defining the PSG. "Women" is often too broad; "Women accused of adultery in Region X" is specific. You are drawing the boundary of the group to fit the law.

  **4. State Protection (The Duty)**
  *   **Question:** Is the home state willing and able to protect the claimant?
  *   **Procedure:** Assume the state is able unless evidence proves systemic failure. Protection must be effective and accessible.
  *   **Refusal Point:** If the state offers effective protection (police investigate, courts punish), refuse here, even if the risk is real.
  *   **[JUDGMENT CALL]:** Assessing "effectiveness." A police force that functions in the capital but ignores domestic violence in the provinces is partially effective. You are deciding whether partial functionality counts as protection.

  **5. Internal Relocation (The Alternative)**
  *   **Question:** Can the claimant safely and reasonably live elsewhere in their own country?
  *   **Procedure:** Identify a safe area (usually the capital). Check if the agent of harm (state or non-state) can reach them there.
  *   **Refusal Point:** If a safe area exists and travel is feasible, refuse here.
  *   **[JUDGMENT CALL]:** Assessing "reasonableness." Undue hardship is vague. Loss of family support, economic destitution, or social isolation may or may not count. You are deciding whether a safe life is enough, or if it must be a normal life.

  **6. Delays and Conduct (The Corroboration)**
  *   **Question:** Does late claiming or conduct abroad undermine credibility?
  *   **Procedure:** Delay without good explanation damages credibility. Sur place claims (activism after leaving) are scrutinized for fabrication.
  *   **Refusal Point:** If delay suggests the fear was manufactured to gain status, refuse.
  *   **[JUDGMENT CALL]:** Weighing the explanation. Fear, shame, or lack of money are valid; ignorance of the system is not. You are deciding the validity of human hesitation.

  ***

  ### Worked Cases

  **Case 1: The Adultery Acquittal**
  *   **Facts:** Female, acquitted of adultery. Fear of husband's family (honor killing). Local police refuse "family matters." Capital police function normally.
  *   **Analysis:**
      1.  **Credibility:** Accepted. Acquittal documents exist; cultural context supports risk of honor violence.
      2.  **Risk/Harm:** Serious harm (death). Established.
      3.  **Nexus:** PSG (Women accused of adultery in her region). Established.
      4.  **State Protection:** Failed in home region (police refuse to intervene). However, state is not *systemically* collapsed.
      5.  **Internal Relocation:** Capital police function fine. Husband's family are local farmers with no reach in the capital. Safe area identified.
      6.  **Reasonableness:** She has no family in the capital. She will be isolated. However, she will not be killed.
  *   **Decision:** **Refusal.**
  *   **Reasoning:** Internal Relocation is available and reasonable. The Convention does not guarantee the right to live in one's home town, only safety from persecution.
  *   **Note:** This is the decision you will hate. She is safe from death, but exiled from her life. The procedure flags this as "reasonable," but you know isolation for a woman in this context is its own kind of destruction. You sign it because the law says "safe" not "happy."

  **Case 2: The Dormant Law**
  *   **Facts:** Male, homosexual. Country criminalizes homosexuality but enforcement is rare. No personal attacks. Fears he "can't live a life."
  *   **Analysis:**
      1.  **Credibility:** Accepted. Conduct and testimony consistent.
      2.  **Risk/Harm:** Criminalization exists, but objective evidence shows low enforcement risk. No past persecution.
      3.  **Nexus:** PSG (Sexual orientation). Established.
      4.  **State Protection:** State prosecutes under law, but practice shows tolerance.
      5.  **Well-Founded Fear:** The key test is whether he would be prosecuted if open. Country information suggests "almost never."
      6.  **Discretion:** He claims he cannot live openly. However, the risk of prosecution is low probability.
  *   **Decision:** **Grant.**
  *   **Reasoning:** While enforcement is rare, the law remains a tool for arbitrary persecution. The "chill effect" constitutes psychological persecution. He should not be required to hide to avoid a risk that, while low, carries severe consequences.
  *   **Note:** This is legally defensible but shaky. You are granting based on the *existence* of the law rather than the *practice*. You do this because refusing a gay man to a country where he is technically criminal feels like inviting a lawsuit, even if the objective risk is low.

  **Case 3: The Protester**
  *   **Facts:** Political activist. Vivid testimony. Consistent core story. Got the date of his arrest wrong twice (initial screen vs. substantive interview).
  *   **Analysis:**
      1.  **Credibility:** Core events consistent (location, officers, abuse). Date inconsistency noted.
      2.  **Materiality:** Date is immaterial to the fact of arrest. Trauma impacts temporal memory.
      3.  **Risk:** Past persecution established (arrest/abuse). Presumption of future risk applies.
      4.  **Nexus:** Political Opinion. Established.
      5.  **State Protection:** State is the persecutor. N/A.
      6.  **Internal Relocation:** State has nationwide reach. N/A.
  *   **Decision:** **Grant.**
  *   **Reasoning:** Inconsistency is not material. The core account is corroborated by medical evidence of abuse. Past persecution shifts the burden to the state, which cannot be met.
  *   **Note:** This is the easy one. The inconsistency is human, not deceptive. You sign this quickly to clear the desk for the hard ones.
