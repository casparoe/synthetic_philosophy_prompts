answer: |-
  You have put your finger on a genuinely profound tension that sits right at the heart of modern attempts to marry democratic participation with evidence-based policy. The scenario you describe, where residents are empowered to design and run experiments but are barred from defining what counts as success, reveals an implicit theory of knowledge that is actually quite distinct from the Deweyan pragmatism your professor is likely championing. To reconstruct the implicit epistemology here, we have to look at how this model divides the labor of knowing. It operates on a assumption that there is a clean separation between the context of discovery and the context of justification. In this view, the residents are trusted with the former because they possess local, tacit knowledge about their specific conditions and needs, making them suitable for generating hypotheses about what might improve their lives. However, the authority to validate those hypotheses is reserved for the municipal data office and the city council, who are presumed to hold the objective, technical knowledge required to determine truth. This presupposes that criteria for success can be established neutrally and beforehand, independent of the lived experience of the experiment itself. It assumes that value judgments about what constitutes improvement can be encoded into metrics prior to the inquiry, rather than emerging from the inquiry process. Essentially, this model treats democratic participation as a source of raw data or innovative ideas, while retaining a technocratic hierarchy for the verification of those ideas.

  When we hold this up against Dewey's view of democracy as social inquiry, the divergence becomes stark. For Dewey, inquiry is not just about testing solutions against pre-existing standards; it is fundamentally about determining what those standards ought to be in light of new situations. He argues that the ends and means of action are continuous, meaning you cannot separate the goal from the process of achieving it. By locking in the success metrics beforehand and placing them outside the control of the participants, this governance model assumes that the normative framing of the problem can be settled by experts before the public gets involved. This is precisely the kind of dualism Dewey sought to dismantle. He would argue that if the people living through the experiment are not empowered to negotiate what counts as a successful outcome, then the inquiry is not truly democratic, nor is it fully intelligent. It reduces the public to mere instruments of data collection rather than co-inquirers. The requirement for statistical significance as a gatekeeper for political acceptance introduces a positivist epistemology into a pragmatic framework. It suggests that there is a single, objective reality that can be captured through quantitative measures, and that qualitative improvements in daily life are merely anecdotal unless they can be translated into that specific mathematical language. This sneaks in a hierarchy of knowledge where technical data is deemed more real or more valid than experienced quality.

  So, to answer your question about whether this is genuinely Deweyan, the answer is largely no, though it mimics the surface structure of experimentalism. It adopts the language of pilots and feedback loops, which fits well with pragmatism, but it retains a foundationalist core that Dewey rejected. The practice relies on the belief that valid knowledge requires a specific kind of certification that only experts can provide. A genuinely Deweyan approach would not accept the clean division between those who generate hypotheses and those who validate them. In Dewey's view, the validation process is itself a social process that requires the same democratic deliberation as the design process. If a pilot improves daily life but misses a p-value threshold, a Deweyan inquiry would treat that discrepancy as a new problem to be investigated rather than a reason to scrap the project. It would ask why the metrics failed to capture the improvement, suggesting the metrics were flawed, not necessarily the pilot. The current model assumes the metrics are the fixed standard against which reality is measured, whereas Dewey would see the metrics as tools that must be adjusted when they fail to resonate with the shared experience of the community.

  Regarding your question about whether you can have a democratic experiment where normative framing stays expert-controlled while implementation is participatory, Dewey would say this is unstable and ultimately self-defeating. You can technically operate such a system, and many modern governments do, but it ceases to be democratic inquiry and becomes managed consultation. The strict needs of the practice as described are actually quite minimal compared to what is being imposed. To function as a pilot program, the system strictly needs some method of comparison and some decision rule for scaling or terminating projects. It needs consistency so that resources are not wasted on initiatives that cannot be evaluated. However, it does not strictly need those metrics to be locked in beforehand by experts, nor does it need statistical significance to be the sole arbiter of validity. These are choices that reflect a specific commitment to technocratic authority rather than a logical necessity of experimentation. The practice fits well with a liberal democratic view that values participation but fears the unpredictability of full public control over resources, but it does not fit with a robust pragmatic view that sees knowledge production as inherently communal and moral.

  If we were to take Dewey's experimentalism seriously from start to finish, several fundamental changes would have to occur in these programs. First, the definition of success would have to be open to revision during the pilot phase. If residents find that a traffic rule makes them feel safer but the data shows no change in accident rates, the inquiry should expand to understand why the data and the experience diverge, rather than dismissing the experience. The metrics would be co-created by the data office and the residents, treating the selection of indicators as a political act rather than a technical one. Second, the timeline would not be a rigid six-month sprint with a binary pass-fail outcome. Deweyan inquiry is continuous; it views policies as always provisional and subject to reconstruction. A pilot would not end with a verdict but with a report that leads to further modification and testing. Finally, the city council would not act as a distant judge reviewing evidence submitted by others. They would be part of the inquiry process, engaging with the qualitative feedback and the quantitative data together. The authority to decide what counts as knowledge would be distributed across the network of participants, ensuring that the validation of the experiment is as democratic as its design. This would shift the epistemology from one of verification by authority to one of warranted assertibility through shared experience, which is the core of what Dewey meant by democracy as a way of life.
