answer: |-
  Here is a closing slide option that fits your constraints. It uses a fresh case (the departmental fridge), explicitly states the maxims in C/A/E form, and hinges the humor on the specific structural difference between CC and CW.

  ***

  ### Slide Title: The Categorical Imperative in the Department Kitchen

  **Case 1: The Deceiver**
  *   **C:** When I drink the last of the shared milk...
  *   **A:** ...I return the empty carton to the fridge...
  *   **E:** ...to make my colleagues believe milk is available.
  *   **Universalized:** No one trusts cartons as signals. The practice of "leaving cartons" collapses. Deception becomes impossible.
  *   **Failure:** **Contradiction in Conception** (Perfect Duty)

  **Case 2: The Procrastinator**
  *   **C:** When I drink the last of the shared milk...
  *   **A:** ...I return the empty carton to the fridge...
  *   **E:** ...to postpone the inconvenience of replacing it.
  *   **Universalized:** Everyone postpones. Milk is perpetually absent. The fridge functions, but is useless to coffee-drinkers.
  *   **Failure:** **Contradiction in the Will** (Imperfect Duty)

  **The Punchline:**
  > "In Case 1, you create a contradiction in **conception**.
  > In Case 2, you create a contradiction in **coffee**.
  > In both cases, you are buying the next gallon."

  ***

  ### Pedagogical Note (for your preparation/next slide)

  **Reading Assumptions:** This joke assumes the **"Practical Contradiction"** reading for CC (where universalization destroys the *practice* or *institution* required for the action, per Onora O'Neill/Christine Korsgaard) and the **"Teleological/Volitional"** reading for CW (where the agent cannot rationally will the world because it thwarts their own necessary ends).

  **If You Switch Readings:**
  *   **Strict Logical Reading (CC):** If students insist CC requires *literal* logical impossibility (e.g., "cartons vanish"), the joke fails; it is logically possible for everyone to return empty cartons. The humor relies on the *institutional* collapse, not physical impossibility.
  *   **Consequentialist Reading (CW):** If students treat CW as merely "bad outcomes," the distinction collapses; both cases just look like "bad things happen." The joke only lands if the *source* of the failure differs (conceptual incoherence vs. rational volition).

  **Teaching Tip:** Use the "Conception vs. Coffee" line to prompt the question: *"Why is the first one strictly forbidden, while the second is just irrational?"* This leads directly into the Perfect/Imperfect Duty distinction for the next lecture.
