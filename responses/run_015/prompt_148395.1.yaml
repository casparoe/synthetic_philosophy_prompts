      *Let's write.*

      (Drafting mentally...)
      Your hypothesis is compelling because it treats the stagnation not as a failure of ingenuity but as a structural feature of the dialectic. You are right to suspect that the self-undermining objection functions as a bundle rather than a single argument. When philosophers argue about whether epiphenomenalism defeats itself, they are rarely arguing about a single principle. Instead, they are leveraging uncertainty across metaphysics, epistemology, and semantics simultaneously. The objector's strategy is to present these uncertainties as a cumulative weight, suggesting that while one might bear the cost of causal exclusion, one cannot also bear the cost of skeptical epistemology and semantic emptiness. The proponent's strategy is to isolate each thread and show that the cost is bearable in isolation. The debate stalls because neither side accepts the other's accounting of these costs.

      However, while your four-thread diagnosis is correct, there is indeed a single engine driving the machinery, and it lies precisely where your first hypothetical points. The causal, epistemic, and semantic threads all draw their force from a deeper modal intuition about the relationship between the phenomenal and the physical. The objector assumes that if a property makes no causal difference, it cannot be reliably known or referred to, because knowledge and reference are themselves causal processes embedded in the physical world. The proponent assumes that phenomenal presence is self-intimating regardless of causal role. The stalemate occurs because both sides treat their modal intuitions as data rather than as claims requiring justification. When you ask whether phenomenal variation can float free of the causal-functional story, you are asking the only question that matters, yet it is the only question neither side argues for. They simply report their intuitions. This suggests the impasse is not ill-posed but foundational; it is a clash of pre-theoretical commitments about what counts as real.

      Consequently, the two sides are indeed answering different questions under a single heading. The objector is asking about integration: how does this phenomenon fit into the causal network that science describes? The proponent is asking about ontology: what is the status of this phenomenon given that it appears to us? The self-undermining argument is the objector's way of forcing the ontological question to submit to the integrative one. It says, in effect, that if you cannot integrate it causally, you cannot claim to know it ontologically. The proponent resists this subordination. This is why your second hypothetical yields splits that do not track the main debate. Semantic content is being negotiated differently depending on whether the speaker prioritizes causal history or functional role, and this priority is independent of their stance on epiphenomenalism itself. The semantic thread is detachable, as you say, but it is weaponized in this context to support the integrative demand.

      So what counts as progress? It is unlikely that a new distinction or a decision about causal contact will settle the matter, because the dispute is not about missing information but about competing frameworks. Progress would consist in stopping the treatment of the self-undermining argument as a knockout blow and instead treating it as a map of commitments. Your chapter would serve the field best by showing that the argument does not refute epiphenomenalism so much as it enumerates its price. The price is accepting non-causal knowledge, non-causal reference, and a modal realism that allows phenomenal properties to vary independently of physical function. If the literature has failed to move, it is because philosophers keep trying to prove the price is too high rather than admitting it is simply high.

      Therefore, the honest answer is that no verdict should be expected, but significant clarification is possible. The impasse is a sign that the question strikes bedrock. You should frame the review not as a search for a winner but as an exposition of the trade-offs. Show that the causal thread imports the exclusion problem, the epistemic thread imports a causal theory of knowledge, and the semantic thread imports a causal theory of reference. Show that the assertibility thread is a pragmatic challenge to consistency. By disentangling them, you reveal that the objection is not a single paradox but a demand for a specific kind of naturalism. If the epiphenomenalist rejects that naturalism, the objection loses its sting. If they accept it, they must pay the price. Your work should make this accounting explicit, allowing readers to see that the stagnation is not due to confusion but to a stable equilibrium of opposing intuitions. This is not a failure of the literature but a mature state of the debate, and your framing should reflect that maturity.

