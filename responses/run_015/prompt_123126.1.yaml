prompt: |-
  In a philosophy-of-physics seminar on special relativity and eternalism, a classmate repeatedly invoked the one-liner “if it’s frame-dependent, it’s not real” to dismiss my tentative defense of what I’ll call multi-frame presentism—the view that every inertial frame’s hyperplane of simultaneity is locally ontologically real, even though none is globally privileged. The slogan seemed to do all the work of moving from the relativity of simultaneity to the block universe, but I couldn’t tell whether it was a methodological rule about theory-building, an ontological filter, an explanatory principle, or something else entirely. Could you lay out the distinct precise theses that “if it’s frame-dependent, it’s not real” could be expressing—ranging from trivial platitudes about coordinate invariance to substantive metaphysical constraints—organized as a menu rather than a single analysis? For each reading, indicate whether it is defensible, plainly false, or question-begging against presentism; whether it genuinely supports the Rietdijk–Putnam-style inference from Lorentz symmetry to eternalism; and whether it also rules out multi-frame presentism specifically, or only rules out a globally unique present. In particular, distinguish (i) a claim about how physical laws should be formulated, (ii) a claim about what exists, (iii) a claim about causal or explanatory structure, and (iv) any other precise interpretation you see hiding in the phrase. Say which reading people in these debates usually intend when they deploy the slogan to end discussion, and which reading, if any, would allow my view to survive intact. Please state how confident you are in this taxonomy and single out the specific distinction—perhaps between the methodological and ontological readings, or between rejecting global privilege and rejecting frame-local reality altogether—about which you are least sure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A philosophy-of-physics seminar on Special Relativity (SR) and Eternalism.
      *   **Problem:** A classmate uses the slogan "if it's frame-dependent, it's not real" to dismiss "multi-frame presentism" (MFP).
      *   **Task:** Deconstruct the slogan into distinct precise theses (a "menu").
      *   **Requirements for each thesis:**
          *   Categorize (Methodological, Ontological, Causal/Explanatory, Other).
          *   Evaluate (Defensible, False, Question-begging).
          *   Assess support for Rietdijk-Putnam (RP) argument (Block Universe).
          *   Assess impact on MFP (Rules it out vs. Rules out global privilege only).
      *   **Specific Distinctions:** Identify what debaters *usually* mean vs. what allows MFP to survive.
      *   **Confidence & Uncertainty:** State confidence level and identify the specific point of least certainty.

  2.  **Deconstruct the Slogan ("If it's frame-dependent, it's not real"):**
      *   *Literal meaning:* Reality = Lorentz Invariant.
      *   *Implicit assumption:* "Real" means "fundamental" or "observer-independent."
      *   *Target:* Simultaneity relations in SR are frame-dependent. Therefore, simultaneity is not real. Therefore, no present. Therefore, Eternalism.
      *   *User's View (MFP):* Every frame's slice is real *for that frame*, but no frame is privileged. This challenges the idea that "real" must mean "invariant across all frames."

  3.  **Drafting the Menu of Theses:**

      *   *Thesis 1: The Methodological/Heuristic Reading (Lorentz Covariance).*
          *   Content: Fundamental laws should be written in tensor form/invariant form.
          *   Status: Defensible/Standard physics.
          *   Impact on MFP: Doesn't touch ontology directly. Compatible with MFP.
          *   Support for RP: Weak.

      *   *Thesis 2: The Strong Ontological Invariance Reading (The "Eleatic" Principle).*
          *   Content: To exist is to be invariant. If $R(x,y)$ holds in $F_1$ but not $F_2$, $R$ is not ontologically fundamental.
          *   Status: Question-begging against Presentism (defines reality to exclude presentism).
          *   Impact on MFP: Rules it out completely (MFP says frame-relative facts are real).
          *   Support for RP: Strong (leads directly to Block).

      *   *Thesis 3: The "Privilege" Reading (No Global Present).*
          *   Content: There is no *unique* frame that defines *the* present.
          *   Status: Defensible (SR consequence).
          *   Impact on MFP: Compatible! MFP accepts no global privilege.
          *   Support for RP: Weak (allows MFP).

      *   *Thesis 4: The Causal/Structural Reading.*
          *   Content: Only causally invariant structures are real. Simultaneity is spacelike (no causal contact).
          *   Status: Debatable (why must reality = causal?).
          *   Impact on MFP: Rules it out (spacelike slices aren't causal).
          *   Support for RP: Moderate.

      *   *Thesis 5: The "Frame-Local Reality" Reading (Perspectivalism).*
          *   Content: Reality can be indexed to frames. $Real_F(x)$.
          *   Status: Defensible (matches MFP).
          *   Impact on MFP: Saves it.
          *   Support for RP: Blocks it.

  4.  **Evaluating the Theses against Criteria:**
      *   Need to ensure I clearly distinguish between "Rules out Global Privilege" (which MFP accepts) and "Rules out Frame-Local Reality" (which MFP rejects).
      *   Need to address the Rietdijk-Putnam argument specifically (which relies on transitivity of reality relations across frames).

  5.  **Refining the Analysis (Self-Correction/Nuance):**
      *   *Correction:* The slogan is often used as a *modus ponens* for Eternalism. "Simultaneity is frame dependent" + "Frame dependent things aren't real" -> "Simultaneity isn't real."
      *   *Nuance:* MFP argues that "Real" can be a dyadic relation $Real(x, F)$. The slogan assumes "Real" is monadic $Real(x)$. This is the crux.
      *   *Classification:* I need to make sure the categories (i)-(iv) from the prompt are addressed.
          *   (i) Physical laws formulation.
          *   (ii) What exists.
          *   (iii) Causal/Explanatory.
          *   (iv) Semantic/Metaphysical (Monadic vs. Relational property).

  6.  **Addressing the "Usual Intent" and "Survival":**
      *   *Usual Intent:* Usually Thesis 2 (Strong Ontological Invariance). They want to kill the present, not just privilege.
      *   *Survival:* Thesis 5 (Relational Reality) or a weakened Thesis 3 (No Privilege only).

  7.  **Confidence and Uncertainty:**
      *   *Confidence:* High on the taxonomy itself (standard philosophy of physics distinctions).
      *   *Uncertainty:* The metaphysical coherence of "Multi-Frame Presentism" itself. Is it just Eternalism in disguise? Or is it coherent perspectivalism? I need to flag the uncertainty about whether MFP is a stable position *regardless* of the slogan. But the prompt asks about the *slogan's* interpretation. I should focus my uncertainty on the boundary between "Ontological Invariance" and "Metaphysical Privilege."

  8.  **Drafting the Response (incorporating the structure):**
      *   **Introduction:** Acknowledge the potency of the slogan and the ambiguity.
      *   **The Menu:**
          1.  *Methodological Covariance:* (i) Laws. Defensible. Neutral on MFP.
          2.  *Strong Ontological Invariance:* (ii) Existence. Question-begging. Kills MFP. Supports RP.
          3.  *No Global Privilege:* (ii) Existence (Negative). Defensible. Compatible with MFP. Does not support RP fully.
          4.  *Causal/Structural Realism:* (iii) Causation. Debatable. Kills MFP. Supports RP.
          5.  *Monadic vs. Relational Reality:* (iv) Metaphysics. The crux. Question-begging if assumed monadic.
      *   **Debate Context:** What they mean vs. what helps the user.
      *   **Confidence/Uncertainty:** As planned.

  9.  **Refining the "Multi-Frame Presentism" (MFP) aspect:**
      *   MFP is essentially "Relativized Presentism."
      *   The slogan attacks the *reality* of the slices.
      *   If "Real" means "Invariant," MFP dies.
      *   If "Real" means "Non-illusory within a context," MFP lives.
      *   I need to make sure I explicitly state that the slogan *equivocates* between "Not Fundamentally Privileged" and "Not Ontologically Robust."

  10. **Final Review against constraints:**
      *   Did I organize as a menu? Yes.
      *   Did I cover (i)-(iv)? Yes.
      *   Did I evaluate defensibility/RP support/MFP impact for each? Yes.
      *   Did I state usual intent vs. survival reading? Yes.
      *   Did I state confidence and uncertainty? Yes.

      *(Self-Correction during drafting)*: Make sure to clearly define Rietdijk-Putnam. It argues that if event $E$ is real for observer $A$, and $A$ is real for $B$, then $E$ is real for $B$. In SR, this implies all events are real. The slogan shortcuts this by saying "Simultaneity isn't real, so 'now' isn't real." I need to ensure the analysis reflects how the slogan interacts with the RP argument specifically. The slogan is often a *premise* used to block the presentist's escape from RP.

      *Refining Thesis 2:* The slogan is often used to block the move that says "My present is real." The Eternalist says "Your present is frame-dependent, therefore not real." This assumes Reality = Invariance. This is the key point of contention.

      *Refining Thesis 5:* This is the "Relational Ontology" reading. If reality is frame-relative, the slogan is false.

      *Let's assemble the text.*
answer: |-
  This is a classic friction point in the philosophy of spacetime. The slogan "if it's frame-dependent, it's not real" is rhetorically powerful because it conflates *fundamental privilege* with *ontological robustness*. Your classmate is using it to bridge the gap between the physics (Lorentz symmetry) and the metaphysics (Eternalism), but the bridge is built out of ambiguous terminology.

  Here is a menu of distinct precise theses that the slogan could be expressing, categorized by their philosophical function.

  ### The Menu of Theses

  #### 1. The Methodological Covariance Thesis
  *   **Category:** (i) Claim about how physical laws should be formulated.
  *   **Precise Formulation:** "Fundamental physical laws must be expressible in Lorentz-covariant form (e.g., tensor equations); quantities that do not transform covariantly are not suitable for fundamental law-stating."
  *   **Defensibility:** **Defensible.** This is standard practice in modern physics.
  *   **Support for Rietdijk–Putnam (RP):** **None.** This is a rule for writing equations, not a claim about what exists. One can write covariant laws while maintaining a perspectival ontology.
  *   **Impact on Multi-Frame Presentism (MFP):** **Neutral.** MFP can accept that the *laws* governing the emergence of frames are covariant, even if the *ontological status* of slices is frame-relative.
  *   **Verdict:** This is the most charitable reading of the physics, but it does no metaphysical work.

  #### 2. The Strong Ontological Invariance Thesis
  *   **Category:** (ii) Claim about what exists.
  *   **Precise Formulation:** "For an entity or relation $X$ to be ontologically real (simpliciter), the existence/truth of $X$ must be invariant across all inertial frames." (Reality = Invariance).
  *   **Defensibility:** **Question-Begging.** This defines "reality" in a way that stipulates presentism is false before the argument begins. It assumes a "God's eye" view is the only valid ontological perspective.
  *   **Support for RP:** **Strong.** This is the engine of the inference. If simultaneity is frame-dependent, and only invariant things are real, simultaneity is unreal. If simultaneity is unreal, there is no present, hence Eternalism.
  *   **Impact on MFP:** **Rules out MFP completely.** MFP asserts that frame-relative slices *are* real (relative to the frame). This thesis denies the coherence of frame-relative reality.
  *   **Verdict:** This is the "workhorse" reading in debates, but it is metaphysically contentious.

  #### 3. The No-Privilege Thesis
  *   **Category:** (ii) Claim about what exists (Negative).
  *   **Precise Formulation:** "There is no single inertial frame that is metaphysically privileged as defining *the* unique present."
  *   **Defensibility:** **Defensible.** This is a direct consequence of SR's empirical success.
  *   **Support for RP:** **Weak.** It rules out *Absolute* Presentism, but it does not entail Eternalism. It leaves logical space for MFP (many presents) or Fragmentalism.
  *   **Impact on MFP:** **Compatible.** MFP explicitly denies global privilege. It accepts that no frame is *the* frame, while maintaining all frames are *a* frame.
  *   **Verdict:** This is what the physics strictly entails, but your classmate is likely inferring Thesis 2 from this.

  #### 4. The Causal Structuralist Thesis
  *   **Category:** (iii) Claim about causal or explanatory structure.
  *   **Precise Formulation:** "Only structures that play a role in the invariant causal order (light-cone structure) are ontologically fundamental; spacelike relations (like simultaneity) are merely conventional."
  *   **Defensibility:** **Debatable.** It assumes ontology must track causal connectivity. Many philosophers argue existence exceeds causal power (e.g., mathematical objects, or non-causal spatial relations).
  *   **Support for RP:** **Moderate to Strong.** If only the light-cone structure is real, the "thick" present of presentism dissolves into the block.
  *   **Impact on MFP:** **Rules out MFP.** MFP relies on the reality of spacelike hyperplanes. If spacelike relations are "not real" (merely conventional), MFP collapses.
  *   **Verdict:** A substantive metaphysical constraint often hidden behind the slogan.

  #### 5. The Monadic Reality Thesis
  *   **Category:** (iv) Semantic/Metaphysical constraint on the predicate "exists."
  *   **Precise Formulation:** "Existence is a monadic property ($E(x)$), not a dyadic relation ($E(x, \text{frame})$)."
  *   **Defensibility:** **Question-Begging.** It rules out relativized ontology by linguistic fiat.
  *   **Support for RP:** **Strong.** The RP argument relies on the transitivity of "is real." If "is real" is frame-relative, the transitivity step fails.
  *   **Impact on MFP:** **Rules out MFP.** MFP requires existence to be understood as frame-indexed ($Real_F(x)$).
  *   **Verdict:** This is the logical core of the disagreement. The slogan assumes existence is absolute; MFP asserts it is relative.

  ---

  ### Analysis of Debate Dynamics

  **1. What your classmate usually intends:**
  When philosophers of physics deploy this slogan to end discussion, they are almost invariably invoking a combination of **Thesis 2 (Strong Ontological Invariance)** and **Thesis 5 (Monadic Reality)**. They intend to claim that because there is no invariant fact of the matter about *which* events are simultaneous, there is no fact of the matter about *what exists now*. They treat "frame-dependent" as synonymous with "mind-dependent" or "illusory." In their view, if you cannot point to a slice of spacetime without specifying a frame, you haven't pointed to anything *real*.

  **2. Which reading allows your view (MFP) to survive:**
  Your view survives intact only if you reject Thesis 2 and Thesis 5 in favor of **Thesis 3 (No-Privilege)** combined with a **Relational Ontology**.
  *   You must argue that "Real" is an incomplete predicate. Just as "to the left of" is frame-dependent but undeniably real, "simultaneous with" can be frame-dependent and real.
  *   You must concede Thesis 3 (no global privilege) to respect the physics, but deny that this entails Thesis 2 (no local reality).
  *   **Survival Strategy:** Reinterpret the slogan. "If it's frame-dependent, it's not *absolutely* real." You agree! But you argue that *absolute* reality is not the only kind of reality. There is also *perspectival* reality.

  ### Confidence and Uncertainty

  **Confidence Level:** **High (85%)** regarding the taxonomy of the arguments. These distinctions are well-trodden in the literature (e.g., works by Stein, Putnam, Saunders, and more recently, relativistic presentists like Balashov or fragmentalists like Fine).

  **Specific Point of Least Certainty:**
  I am least certain about the **metaphysical stability of the distinction between Thesis 2 (Invariance) and Thesis 4 (Causal Structure)**.
  *   *Why:* Proponents of the slogan often slide between "It's not real because it varies by frame" (Invariance) and "It's not real because it can't affect anything" (Causal).
  *   *The Uncertainty:* It is unclear whether a defender of MFP can successfully argue for the reality of spacelike slices (Thesis 4 rejection) without implicitly committing to a preferred frame (violating Thesis 3). If you say the slice *here-now* is real, but the slice *there-now* (spacelike separated) is also real for another observer, you risk violating the transitivity of identity or committing to a "fragmented" world that some argue is incoherent.
  *   *The Crux:* The boundary between "rejecting global privilege" (which saves MFP) and "rejecting frame-local reality" (which kills MFP) is precisely where the debate turns on whether **ontological relativity** is a coherent metaphysical position or a contradiction in terms. I am confident the slogan conflates them, but less confident that MFP can be made fully coherent without collapsing into Eternalism or solipsism.

  ### Summary Recommendation for Seminar
  Do not accept the slogan as a premise. Challenge the equivocation.
  *   **Ask:** "Do you mean frame-dependent quantities cannot be *fundamental law-variables* (Thesis 1), or that they cannot *exist* (Thesis 2)?"
  *   **Argue:** "SR rules out a *privileged* present (Thesis 3), not a *perspectival* present. 'Left' is frame-dependent; is 'Left' not real?"
  *   **Goal:** Force them to defend Thesis 2 as a metaphysical necessity, rather than letting it stand as a physics-derived truism.
