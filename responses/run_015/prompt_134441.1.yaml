answer: |-
  This is an excellent diagnostic instinct. Your professor's slogan—" *anatta* denies an owner, not a person"—is a standard move in Buddhist studies, but as you've noticed, it functions as a *placeholder* for a much more complex metaphysical commitment. If left unanalyzed, it risks equivocation: using "person" in a thin, conventional sense when discussing ethics, and a thick, substantial sense when discussing rebirth.

  Here is a menu of five precise interpretations of that slogan, broken down by metaphysical scope, textual support, and their ability to handle the karma/rebirth problem. You can take this list directly to office hours to force specificity.

  ### Option 1: The Reductionist (Abhidharmic) Reading
  *   **The Claim:** "Person" is a convenient label for a causally connected series of aggregates (*skandhas*). "Owner" implies a separate entity *above* or *beside* the aggregates. There is no extra entity, only the aggregates.
  *   **Synchronic vs. Diachronic:** Primarily **Synchronic** (no unity at a time), extended **Diachronically** via causality.
  *   **Truth Status:** Metaphysically parsimonious, but counter-intuitive regarding phenomenal unity.
  *   **Textual Support:** Strong in **Abhidharma** (e.g., Vasubandhu's *Abhidharmakośa*). The "chariot analogy" in the *Milindapañha* supports this.
  *   **Moral/Rebirth Payoff:** **Weak.** It explains how karma transfers (causal continuity of mental streams), but struggles to explain *who* experiences the result. If Person-A (life 1) and Person-B (life 2) are just distinct clusters of aggregates, why is B punished for A's crime? It risks making rebirth impersonal, which undermines the soteriological goal of *my* liberation.
  *   **Verdict:** This is closest to your friend's "Humean" suspicion.

  ### Option 2: The Two-Truths (Madhyamaka) Reading
  *   **The Claim:** "Person" exists *conventionally* (*samvrti-satya*) but not *ultimately* (*paramartha-satya*). "Owner" is a claim about ultimate existence. The slogan means: "Don't reify the person ultimately, but don't nihilize the person conventionally."
  *   **Synchronic vs. Diachronic:** **Both.** It applies to the status of the entity at all times.
  *   **Truth Status:** Logically robust if you accept the Two Truths framework; otherwise, it looks like equivocation.
  *   **Textual Support:** **Madhyamaka** (Nagarjuna, Candrakirti). Specifically *Mūlamadhyamakakārikā* Ch. 18 (examination of Self).
  *   **Moral/Rebirth Payoff:** **Strong.** Karma operates on the conventional level. We don't need an ultimate owner for conventional responsibility to work (just as you don't need an ultimately existing dollar to pay a conventional debt).
  *   **Verdict:** This is likely what your professor *hopes* is being understood, but it requires accepting that "existence" is ambiguous.

  ### Option 3: The Anti-Control (Phenomenological) Reading
  *   **The Claim:** "Owner" implies a controller or master (*svamin*). *Anatta* is not an ontological claim about parts vs. wholes, but a soteriological claim about agency. We *are* persons, but we are not *in control* of the aggregates.
  *   **Synchronic vs. Diachronic:** **Synchronic.** Focuses on the experience of agency in the present moment.
  *   **Truth Status:** Phenomenologically plausible (we often feel acted upon by desires).
  *   **Textual Support:** **Early Suttas** (e.g., *Anattalakkhana Sutta*: "If form were self, it would not lead to affliction...").
  *   **Moral/Rebirth Payoff:** **Fails.** This explains suffering and attachment well, but it does nothing to explain rebirth mechanics. Denying control doesn't explain continuity of identity across death.
  *   **Verdict:** This changes the subject from metaphysics to psychology.

  ### Option 4: The Linguistic/Category Mistake Reading
  *   **The Claim:** "Ownership" is a grammatical illusion. We say "I feel pain" just like we say "It rains." There is no "it" that rains, and no "I" that feels. "Person" is just a linguistic index for a location in space-time.
  *   **Synchronic vs. Diachronic:** **Synchronic.**
  *   **Truth Status:** Linguistically interesting, metaphysically deflationary.
  *   **Textual Support:** Weak in traditional texts; stronger in **Modern Analytic Buddhism** (e.g., Mark Siderits, Jay Garfield).
  *   **Moral/Rebirth Payoff:** **Changes the Subject.** It dissolves the problem by denying the coherence of the question. If "who" is a category mistake, "who gets reborn?" is nonsense. But Buddhism insists rebirth *happens*, so this risks nihilism.
  *   **Verdict:** This is a modern retrofit, not traditional exegesis.

  ### Option 5: The Causal Continuum (Sautrāntika/Yogācāra) Reading
  *   **The Claim:** "Person" refers to the dynamic causal stream (*santana*). "Owner" refers to a static substrate. The stream is real enough to carry karmic seeds (*vasana*), but not static enough to be a "self."
  *   **Synchronic vs. Diachronic:** **Diachronic.** Focuses on persistence through time.
  *   **Truth Status:** Metaphysically substantive. Posits a "storehouse consciousness" (*alayavijnana*) in Yogācāra to do the heavy lifting.
  *   **Textual Support:** **Yogācāra** (Asanga, Vasubandhu).
  *   **Moral/Rebirth Payoff:** **Strongest.** The *alayavijnana* is specifically designed to solve the "who gets reborn?" problem without positing a *atman*. It is the "person" without the "owner."
  *   **Verdict:** If your professor isn't talking about *alayavijnana*, they are ignoring the mechanism that makes this slogan work.

  ---

  ### Regarding Your Friend's "Humean Bundle Theory" Objection

  Your friend is **half-right**, but missing the crucial normative difference.

  *   **Where they are right:** Both Hume and the Buddhist Reductionist (Option 1) deny a substantial, unchanging self underlying experience. Both reduce the person to a bundle of perceptions/aggregates.
  *   **Where they are wrong:** Hume's bundle is held together by *association* (resemblance, causation). The Buddhist bundle is held together by *karma* (moral causation).
  *   **The Trap:** If your professor is relying on a Humean bundle theory, they cannot explain **moral responsibility**. Hume admitted he couldn't explain personal identity satisfactorily. Buddhism *must* explain it to make sense of liberation.
  *   **The Verdict:** It is a legitimate reading of the *metaphysics*, but a misreading of the *soteriology*. If the professor is using "person" to mean "Humean bundle," they have not solved the rebirth problem; they have just renamed it.

  ---

  ### Office Hours Strategy: The "Karma Carrier" Question

  To cut through the slogan, do not ask "What is the self?" Ask about the **mechanism of transmission**. Here are three specific questions to ask your professor, mapped to the menu above:

  1.  **The Diachronic Question:** "When you say 'there is a person,' are you referring to a *conventional designation* (Option 2) or a *causal continuum* (Option 5)? If it's just a designation, what ontologically carries the karmic seed from death to rebirth?"
  2.  **The Ownership Question:** "You say there is no owner. Do you mean no *controller* (Option 3) or no *substrate* (Option 1)? If there is no substrate, is the 'person' just a fiction, and if so, is liberation also a fiction?"
  3.  **The Hume Check:** "Is the 'person' you're affirming metaphysically robust enough to bear moral responsibility, or is it merely a linguistic convenience? If the latter, how do we avoid the nihilist heresy (*ucchedavada*)?"

  **Summary for your notes:** The slogan is only substantive if it leans on **Option 2 (Two Truths)** or **Option 5 (Causal Continuum)**. If it leans on **Option 1 (Bundle)** or **Option 4 (Linguistic)**, it fails to answer the rebirth worry. Your job in office hours is to force the professor to pick a number.
