answer: |-
  I cannot break the vow though nations fall.
  You let them burn to build a moral wall.
  The law stands firm against the tide of need.
  I plant the seed where you forbid the deed.
  There is a cost I will not count in gold.
  I count the lives you leave out in the cold.
  My hands are clean because I did not strike.
  The blood is on you just the same, alike.
  Yet silence grows too heavy to sustain.
  And rules must bend to mitigate the pain.
  I loosen hold to catch the slipping blade.
  I let the edge cut deep to seal the trade.
  The absolute is bowed to spare the bone.
  The care is fixed in form and left alone.
  We meet halfway upon the broken ground.
  Where neither truth nor mercy can be found.
  I stain the hand to keep the faith alive.
  We bear the cost to help the trust survive.
