answer: |-
  Dear colleague,

  Thank you for sending this through. It is rare to find a set of cases this sharp, grounded in the high-stakes reality of your work rather than abstract speculation. You are right to distrust a theory that cannot accommodate the verdicts you must live with when signing off on paramedics. The tension you feel is not a failure of your reasoning but a sign that you are tracking a complex phenomenon that standard philosophical accounts often oversimplify. Your friend's intellectualist view, which reduces knowing how to knowing that, struggles immediately with your fourth case of the amnesiac learner. If knowing how were just knowing facts about ways, the loss of declarative memory should wipe out the skill, yet procedural memory persists. Conversely, a pure behaviorist view that equates knowing how with mere success fails on your seventh case of Garrity, who succeeds only because of hidden nudges. He lacks the knowledge because the success is not his own. Your tentative principle is a strong starting point because it demands both reliability and attributability to the agent's grasp, but as you noted, it frays at the edges regarding external aids and physical inability.

  To find a principle that holds, we need to test a few variations against your nine cases before settling on the one that survives. Let us consider a candidate principle focused purely on robust disposition. This view says an agent knows how if they succeed reliably across the relevant range of situations. This handles your first case of Maya well, because her success is not robust across the shift from simulator to real patient. It also handles Dan in case two, who lacks the disposition entirely. However, this principle collapses on case seven with Garrity, who succeeds reliably while being nudged, and on case nine with the AI, which you intuitively feel does not know how despite high reliability. It also fails to distinguish case five from case six, as both involve external aids, yet you verdict them differently. Mere success is insufficient because it does not account for the source of the success.

  Let us try a second candidate, which leans closer to your friend's view but modified for practice. This principle says an agent knows how if they possess an internal representation of the procedure that guides their action, whether verbal or non-verbal. This handles case eight well, where the tech has a representation of head positioning even if her theory about back injury is wrong. It also handles case four, as the amnesiac has a motor representation. But this breaks on case three with Dr. Ruiz. She physically cannot execute the action, so she cannot have a motor representation guiding her own hands, yet you rightly say she knows how. It also struggles with case six, where Nurse Okafor relies on a wall chart. If the knowledge must be fully internalized as a representation, the chart suggests a gap. Yet you say she knows how. This suggests that knowing how is not strictly about internal storage but about the relationship between the agent and the resources they use.

  The principle that survives these tests, and which repairs your tentative view, is what I will call the Normative Sensitivity Principle. It states that an agent knows how to perform a procedure when they possess a stable disposition to succeed across the relevant range of situations, where this stability is sustained by the agent's own sensitivity to the normative features of the task, allowing them to monitor, correct, or guide the action without relying on another agent to supply the critical adjustments. The key work here is done by the clause regarding sensitivity to normative features. This explains why Maya in case one fails; her sensitivity is not stable across the normative shift from simulation to real physiology under stress. It explains why Dan in case two fails; he has no sensitivity to the physical norms. It explains why Dr. Ruiz in case three passes; although she cannot execute, her sensitivity to the normative features allows her to correct others, which counts as guiding the action. It explains why the amnesiac in case four passes; their motor system retains sensitivity to the norms of the task even without declarative memory.

  This principle also resolves the tension between case five and case six, which was a major sticking point. In case five, the trainee stalls without the colleague reading the checklist. Here, the colleague is supplying the critical adjustments regarding what step comes next. The trainee lacks the sensitivity to the procedural norms themselves. In case six, Nurse Okafor uses a wall chart, but she runs the resuscitation beautifully. The chart is a tool she wields, not a proxy agent making decisions for her. She retains the sensitivity to the norms of the resuscitation and uses the chart as a reference, much like a pilot uses a flight manual without ceasing to know how to fly. The distinction lies in whether the external aid replaces the agent's monitoring capacity or supports it. In case five, the aid replaces the monitoring; in case six, it supports it. This also clarifies case seven with Garrity. The preceptor nudging the scope is supplying the critical adjustment to the normative feature of the angle. Garrity is not sensitive to that feature; the preceptor is. Therefore, Garrity does not know how.

  Case eight fits because the tech is sensitive to the normative feature of head positioning that opens the airway, even if her explanatory theory about back injury is false. Her success is attributable to her grasp of the positioning norm, not the medical theory. Case nine, the AI, is the hardest test. Your gut says it does not know how. Under the Normative Sensitivity Principle, the AI fails because it lacks agency in the relevant sense. It correlates inputs to outputs without a grasp of the norms themselves, such as patient safety or physiological integrity. It cannot be held responsible for the norms it violates because it does not recognize them as norms. However, I must flag that this verdict depends on an empirical assumption about the AI's internals. If the system is a black box where no rules can be extracted, it is difficult to prove it lacks sensitivity to features. It may detect features we cannot name. Your intuition that it lacks know-how likely rests on the fact that it cannot take responsibility for the action, which is a social dimension of knowledge attribution that goes beyond mere cognitive architecture.

  Regarding the two new cases you proposed, the principle gives clear answers. For the trainee who performs perfectly after one demonstration, the principle implies she did not know how before she had ever done it. Knowing how requires a stable disposition, and stability cannot be established prior to the demonstration of the skill. She had the capacity to learn quickly, but the knowledge itself was constituted in the successful performance that evidenced her sensitivity to the norms. To say she knew how before acting would be to confuse potential with actual possession. For the expert who cannot articulate her criteria and whose stated criteria are wrong, the principle says she does know how. Her success and her ability to monitor the procedure (implicitly) show she is sensitive to the normative features, even if her declarative account is flawed. This aligns with your verdict on case eight and case four, preserving the intuition that practical grasp outruns verbal explanation.

  I must flag three empirical assumptions where your verdicts rely on facts that could be contested. First, in case four, you assume the amnesiac learner exists and improves measurably. While procedural memory dissociation is well-documented in patients like H.M., the specific claim that they get cleaner across sessions without any declarative recall is empirically sound but relies on the injury being strictly hippocampal and not affecting basal ganglia function. Second, in case three regarding Dr. Ruiz, you assume focal dystonia prevents execution but spares observational critique. This is generally true for task-specific dystonia, but if her condition affected her proprioceptive modeling, her ability to correct others might also degrade. Third, in case nine, you assume nobody can extract a rule from the AI. This is a claim about interpretability in machine learning. If future techniques allow us to map the AI's weights to specific physiological features, your intuition that it lacks grasp might weaken, or you might have to accept that it possesses a non-human form of sensitivity.

  I am highly confident that the Normative Sensitivity Principle captures the core of your verdicts, particularly the distinction between tools and proxy agents in cases five and six, and the separation of execution from understanding in case three. It respects the high stakes of your work by tying knowledge to reliability and accountability. The point I am least sure about is the verdict on case nine, the AI. This is not because the principle is weak, but because our concept of agency and sensitivity is currently being stretched by technology in ways we do not yet fully understand. If the AI can monitor and adjust better than a human, denying it know-how may eventually look like prejudice, or it may reveal that know-how is essentially a human social status rather than a cognitive capacity. For your purposes, however, treating the AI as lacking know-how is safe because it cannot bear the responsibility that your sign-off implies.

  In sum, your gut reactions are coherent. They point toward a view where knowing how is a stable, agentive sensitivity to the demands of the task, which can survive memory loss and false theory, but cannot survive reliance on others to make the critical decisions. You can defend your sign-offs by appealing to this distinction: you are not certifying that they can recite steps or even succeed once, but that they possess the sensitivity to monitor and correct the procedure themselves across the range of situations they will face. This protects you, the trainee, and the patient.

  I hope this helps clarify the ground you are standing on.

  Best regards,

  Your colleague
