  2.  **Deconstruct the Naturalist Account (BST-like):**
      *   *Health:* Statistical typicality + Efficient functioning + Contribution to survival/reproduction.
      *   *Reference Class:* Species, sex, age.
      *   *Values:* Excluded from *definition*, included in *intervention*.
      *   *Vulnerability:* The line between "statistical typicality" and "dysfunction," the role of environment, and the "standard contribution" clause.

  3.  **Analyze Vignette A (Chronotype Variant):**
      *   *Facts:* 8% prevalence (statistically minor but not rare), 5-hour shift, no loss in performance/longevity/fertility *on preferred schedule*, impairment *on conventional schedule*.
      *   *Naturalist Verdict:* Is it a disease?
          *   Functioning is efficient on preferred schedule.
          *   Survival/reproduction not reduced in abstract, but reduced in *current* social environment (work schedules).
          *   Reference class issue: Is "night owl" a subclass?
          *   If environment is part of the function definition, it might be a dysfunction in *this* environment. If function is internal, it's not.
          *   BST usually looks at "species-typical design." If 8% have this, is it a dysfunction or a polymorphism?
      *   *Normativist Verdict:* It's a disability or disorder relative to social norms (work schedules), but not necessarily a biological defect.
      *   *Challenge:* The "Environment" problem. If health depends on fitting the environment, and the environment is social (work hours), is health value-laden?

  4.  **Analyze Vignette B (Muscle Protein Variant):**
      *   *Facts:* Asymptomatic, subefficient cardiac output *at rest* (lab measure), superior stamina *at altitude*, no survival/reproduction reduction in *current* environment.
      *   *Naturalist Verdict:*
          *   Lab measure says "subefficient" (dysfunction?).
          *   Survival/reproduction says "neutral or beneficial."
          *   BST prioritizes survival/reproduction contribution. If no reduction, is it a disease? Boorse says dysfunction *plus* detrimental effect.
          *   If it's subefficient *at rest* but better *at altitude*, is the "standard contribution" defined by the lab or the evolutionary history?
      *   *Normativist Verdict:* If it doesn't harm the patient and helps in some contexts, calling it a disease is medicalization.
      *   *Challenge:* The "Harmless Dysfunction" problem. Can you have a biological dysfunction without negative survival consequences?

  5.  **Identify General Challenges to Naturalism:**
      *   *Reference Class Problem:* How specific can groups get before statistics lose meaning? (e.g., splitting off the 8% in Vignette A).
      *   *Environment Dependence:* Function is relative to environment. If environment changes (socially), does health status change?
      *   *Harmless Dysfunction:* Biological malfunction without survival cost (Vignette B).
      *   *Value-Laden Reference Classes:* Choosing the reference class (age, sex) involves values.
      *   *Clinical Practice:* Doctors treat based on harm/distress, not just statistical deviation.

