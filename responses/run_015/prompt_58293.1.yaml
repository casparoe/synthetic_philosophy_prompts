  7.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Correction on Vignette A:* 8% is borderline. If the reference class is "adults," it's atypical. If the reference class is "chronotype subgroups," it's typical. The Naturalist must justify the reference class without using values (e.g., "we shouldn't make a reference class just to avoid calling something a disease").
      *   *Correction on Vignette B:* Boorse distinguishes *function* from *survival value*. A trait can be dysfunctional (fails to perform at species-typical level) even if compensated. So Naturalist might call B a disease despite no survival loss. This is a strong point of divergence.
      *   *Force Rating:* Need to be careful. "Fatal" means the theory collapses. "Serious" means it needs major revision. "Awkward" means it's counterintuitive but survivable.
