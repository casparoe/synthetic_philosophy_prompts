      *   **Vignette B Analysis:**
          *   *Naturalist:* Lab measures show subefficiency. But survival is unharmed. BST requires *both* dysfunction and negative contribution. If survival is fine, is it disease? Boorse might say yes, it's a dysfunction, even if compensated.
