answer: |-
  Good morning. Thank you for letting me speak.

  When I walk into this shelter, the first thing I see are the names. They're written on whiteboards, clipped to cages, printed on the donation pages you all look at on your phones. There is a dog named Barnaby who needs surgery. There is a cat named Luna who needs a foster home. These are stories we can hold. They have faces. When we help them, we see the result. We see the tail wag, or the cage door open, or the family take them home. This is the work we know how to celebrate. It is the suffering we can reach.

  But there is another kind of animal that lives in this building. You won't see them in the kennels. You won't see them in the photos on the wall. They are the animals who never needed a name because they never needed a rescue.

  They are the ones who were never born into a situation where they would shiver in a box, or go hungry, or wait for a decision that never comes. They are the empty spaces in the kennel row. They are the silence where a cry could have been.

  This is the work of the clinic. It is the spay and neuter program. It doesn't make for a very exciting photo. There is no before-and-after picture for a life that didn't start in crisis. It doesn't have a donation page with a specific goal because you can't put a price on a story that never happened. But if the kennels are the heart of this place, pumping life into the animals who are already here, then the clinic is the immune system. It stops the sickness before it spreads.

  I know this work is heavy. I know that sometimes, the kindest thing we can do for an animal who is already here is to let them go peacefully. To the veterinary team: you carry the weight of both ends of this work. You heal the ones we can save, and you spare the ones who cannot be saved from more pain. You also perform the quiet surgery that ensures fewer animals ever have to face that choice. That is a burden most people never have to think about, and you carry it so the rest of us don't have to.

  It is easy to love the animal you can pet. It is harder to love the animal you will never meet. But mercy isn't just about fixing what is broken. Sometimes, mercy is about making sure something doesn't break in the first place.

  So when you look around this room, and you see the dogs playing with your kids, and you see the happy adopters, know that those moments are made possible by the work that doesn't get seen. The reachable suffering is what brings us together today. But the unreachable suffering—the pain that was prevented before it ever had a face—that is what keeps this place honest.

  Thank you for supporting the animals we know. And thank you for supporting the ones we don't.
