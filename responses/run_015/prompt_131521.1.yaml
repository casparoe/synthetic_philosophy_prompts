      *   **Context/Consumer:** An institute advising regulators on *one-shot, novel strategic situations* (no history, no repetition, no learning). The sponsor wants to know if game theory's epistemic program helps predict behavior here, with what confidence, and under what conditions.
      *   **Specific Content Requirements:**
          1.  Numbered list of agreed claims (formalism, representation theorems, common prior, lab literature).
          2.  Table of residual disagreements (Neutral description, PT formulation, MS formulation).
          3.  Judgment on disagreements (Substantive vs. Verbal + what terms exclude).
          4.  Cruxes (Sub-questions, accepted evidence, predictions, falsification conditions).
          5.  Assessment of the "Finite-Depth Proposal" (Test, distraction, or in-between? Vindication conditions).
      *   **Tone/Constraint:** Do not buy agreement cheaply. Sharp disagreements are preferred over hedged consensus. If one side is clearly right on a technical point, note that separately to the user, not in the joint text.

  2.  **Deconstruct the Characters:**
      *   **Program Theorist (PT):** Believes epistemic conditions (Common Prior, Common Knowledge of Rationality - CKR) give content to solution concepts (Nash, CE, Backward Induction). It's explanatory/classificatory. Believes the math reveals structural constraints on rational belief.
      *   **Model Skeptic (MS):** Believes assumptions do the work, not the theorems. Modeling choices (game form, type space, counterfactuals) fix the content. Theorems are restatements of premises. Skeptical of predictive power in novel settings.
      *   **The Sponsor's Problem:** One-shot, novel, no learning. This is the *hardest* case for standard game theory (which often relies on equilibrium selection via history/focal points). This puts pressure on PT (who needs the epistemic conditions to hold) and MS (who thinks the modeler is just imposing their own view).
      *   **The Finite-Depth Proposal:** Truncating common knowledge at depth $k$. Does the solution set converge quickly? If yes, CKR is a benign idealization. If no (or slow convergence), CKR is doing heavy lifting/unrealistic work.

  3.  **Drafting - Section by Section:**

      *   **Title/Intro:** Needs to look official but reflect the adversarial nature. "Joint Statement on the Epistemic Foundations of Game-Theoretic Prediction."

      *   **Section 1: Agreed Claims:**
          *   Need to find common ground without watering it down.
          *   *Formalism:* Both agree the math is valid.
          *   *Theorems:* Both agree they are conditional (If assumptions, then solution).
          *   *Common Prior:* Both agree it's strong and often untestable in one-shot settings.
          *   *Lab Lit:* Both agree lab results (dominance solvable) show *some* convergence but don't prove CKR holds generally.
          *   *Sponsor Context:* Crucial point: Both must agree that *without* shared history, standard equilibrium selection fails. This is a key constraint for the regulator.

      *   **Section 2: Residual Disagreements (Table):**
          *   Need 3-4 core disagreements.
          *   *Disagreement 1: The Source of Predictive Power.* PT: It's the rationality constraints. MS: It's the modeler's input.
          *   *Disagreement 2: The Status of CKR.* PT: A regulative ideal/limit. MS: An unrealistic assumption that drives the result.
          *   *Disagreement 3: Applicability to Novel One-Shot Games.* PT: Possible if agents are sufficiently sophisticated/aligned. MS: Impossible to justify without empirical calibration.

      *   **Section 3: Substantive vs. Verbal:**
          *   Some disagreements might be about what "prediction" means. PT might mean "consistent with rationality," MS might mean "empirically accurate."
          *   Need to identify if they are talking past each other on "Rationality."

      *   **Section 4: Cruxes:**
          *   What evidence would change minds?
          *   *Crux 1:* Finite depth convergence rates.
          *   *Crux 2:* Experimental evidence on higher-order beliefs in novel games.
          *   *Crux 3:* The "Unique Implementation" test. If the model predicts a unique outcome in a novel game, does it happen?

      *   **Section 5: The Finite-Depth Proposal:**
          *   This needs careful handling. PT might fear it undermines the elegance of CKR. MS might see it as exposing the fragility.
          *   Consensus: It's a genuine test of *robustness*, not necessarily truth.
          *   Vindication for Skeptic: If convergence is non-monotonic or requires very high $k$ relative to game complexity.

      *   **Note to User:**
          *   Identify where one side is technically correct. Usually, the Skeptic has the stronger point on *prediction* in novel settings, while the Theorist has the stronger point on *coherence*. I should note that the Skeptic is likely right about the regulatory application, while the Theorist is right about the internal logic.

  4.  **Refining and Polishing:**
      *   *Check Tone:* Is it too conciliatory? Make the disagreements sharper.
      *   *Check Sponsor Constraint:* Ensure the document explicitly addresses the "one-shot, novel" constraint.
      *   *Check Finite-Depth:* Ensure the assessment is nuanced.
      *   *Check Formatting:* Numbered lists, tables, clear headings.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe they agree that CKR is useful.
      *   *Correction:* No, MS thinks CKR is the problem. PT thinks it's the solution. Keep that tension.
      *   *Initial thought:* Maybe they agree on the lab literature.
      *   *Correction:* PT sees it as validation of rationality. MS sees it as validation of task simplicity. Distinguish this.
      *   *Sponsor Focus:* Make sure the conclusion for the regulator is clear. "Don't use this for strong prediction without calibration."

  6.  **Final Review against constraints:**
      *   (1) Numbered list of claims? Yes.
      *   (2) Table of disagreements? Yes.
      *   (3) Substantive/Verbal judgment? Yes.
      *   (4) Cruxes with evidence/falsification? Yes.
      *   (5) Finite-depth assessment? Yes.
      *   Note to user outside document? Yes.

  7.  **Final Polish:** Ensure the language sounds like academic game theorists (precision, specific terminology like "type space," "interim correlated rationalizability," etc.).

  *(Self-Correction on the "Note to User"):* The prompt asks me to say where one side is simply right *outside the document*. I need to be careful not to bias the joint document, but be honest in the note. The Skeptic is generally more aligned with the *regulatory* reality described (novel, one-shot), whereas the Theorist is defending the *mathematical* program. I will note that the Skeptic's caution is more appropriate for the specific consumer, even if the Theorist's formalism is internally consistent.

  *(Refining the Finite-Depth Section):* The prompt asks specifically what result would vindicate the skeptic. I need to be specific: e.g., if the set of rationalizable actions remains large until $k$ exceeds cognitive limits.

  *(Refining the Disagreements):* Make sure the "Neutral Language" is truly neutral.

