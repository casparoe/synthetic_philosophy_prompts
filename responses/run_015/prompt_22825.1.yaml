      *   *Fink:* The truthmaker for the disposition (the basis) ceases to exist.
      *   *Mask:* The truthmaker exists, but the causal chain is interrupted.
      *   *Reverse Cases:* It's important to mention "Reverse Finks" and "Simulated Masks" (or Mimics) to show the symmetry, but focus on the standard ones for clarity.
