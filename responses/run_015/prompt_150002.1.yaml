      *   **Section 1: Philosophical Commitments (Agency, Progress, Virtue).**
          *   *Agency:* Compatibilist/Pragmatic. We can't change the past (Errata), but we can engineer the future (Ledger). Agency is prospective engineering.
          *   *Progress:* Asymptotic. You get closer to the line, but the "spots" of the past remain. Progress is reduction of frequency, not erasure of history.
          *   *Virtue:* Habitual. It's not just doing the right thing once; it's breaking the habit of the wrong thing. The Ledger tracks habits; the Errata acknowledges the scar tissue of old habits.

      *   **Section 2: Reconstructing the Implicit Theory.**
          *   *The "Required" vs. The "Fits":*
              *   *Required:* A distinction between the *act* (countable) and the *agent's history* (fixed). A belief that monitoring influences future probability.
              *   *Fits:* The specific number 13, the weekly cycle, the specific printing metaphor. These are contingent.
          *   *The Synthesis:* "Provisional Perfectibility." The Ledger is the *method*, the Errata is the *metaphysical limit*. The theory is: *Self-cultivation is the management of probability within the constraints of historical facticity.*

      *   **Section 3: Coherence and Rival Conceptions.**
