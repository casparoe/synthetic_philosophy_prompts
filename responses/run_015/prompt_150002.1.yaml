              *   *Strict Deontological (Kantian):* Kant would reject the consequentialist/pragmatic aim (usefulness) and the quantification of duty. Franklin rules this out by making virtue instrumental to happiness and success.
          *   *Implicit Argument:* The argument is "what works." It's pragmatic, not foundational.

      *   **Section 4: Concrete Changes with Rival Frameworks.**
