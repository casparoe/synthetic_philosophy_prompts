answer: |-
  hey there, i heard you were tearing your hair out over draft three and i wanted to send this over while it was fresh in my mind. i know the usual philosophical examples involve people stepping into time machines or ships getting replaced plank by plank, but that never helps when you are staring at a cursor blinking over a deleted sister who used to be the core of your protagonist's trauma. so i imagined a conversation for you, something late night in a study somewhere, between two voices who know exactly what you are dealing with. i wrote it out as continuous prose so you can just read through it without stopping for definitions or academic breaks. hope it helps clear the fog even a little.

  it started with them talking past each other, which is usually how these things begin when the stakes are this personal. the endurantist was pacing the room while the perdurantist sat perfectly still in the armchair, watching the smoke curl from a pipe that had gone out ten minutes ago. the endurantist said that you are writing about a person, a single woman who lives in your head and that when you delete the sister in draft three you are not killing a sibling you are healing a wound that was always there waiting to be dressed correctly. she argued that the character is wholly present in every draft, that the essence of her survives the deletion just like a person survives a haircut or a change of name. the perdurantist just nodded slowly and said that this was a category mistake, that draft one and draft three are distinct temporal parts of a larger object called the novel-in-progress. he said you aren't changing her, you are replacing a temporal slice with a new slice, and that the woman in draft one is literally not the woman in draft three because they have incompatible properties. they were speaking different languages for a while, one talking about identity and care, the other talking about segments and coordinates.

  then the air in the room got thinner and they actually started to listen. the endurantist stopped pacing and leaned against the desk, looking directly at the perdurantist when she said that if you are right then i am not writing a story i am assembling a corpse. she said that if the protagonist is just a four-dimensional worm stretching across all my drafts then there is no one to care about in draft three. i feel love for her now, in this moment, i feel anger on her behalf. if she is just a temporal part then my love is misplaced, directed at a slice of a worm rather than a person. the perdurantist tapped the bowl of his pipe and said that your love is directed at the whole worm, that you care about the entire process of her becoming. but the endurantist shook her head and said no, i don't care about draft one anymore. i cringe when i read it. i want to burn it. if i care about the worm then i must care about the draft where she was weak and clichéd, but i don't. i care about who she is right now, wholly present in this current document.

  that was when the perdurantist sat up and finally landed the blow on the hard spot you are worried about. he said that if she is wholly present in draft one and wholly present in draft three then you have a logical contradiction that breaks reality. in draft one she has the property of having-a-sister. in draft three she has the property of not-having-a-sister. if she is the same wholly present entity existing in both times then she both has and does not have a sister. you cannot say she changed, because change requires time, and if she is wholly present in draft one she is frozen in that state. to say she is the same is to say that contradictions are true. the endurantist fired back immediately, saying that properties are indexed to times. she has-a-sister-at-t1 and not-has-a-sister-at-t3. there is no contradiction because the properties are different. but the perdurantist laughed and said that is just perdurantism in disguise. if you have to relativize the property to the draft then you are admitting that the character is extended across drafts. you are admitting that she is not just here, she is here-and-there. you are slicing her up to save her unity.

  the endurantist pushed off the desk and her voice got quiet, which was more dangerous than when she was pacing. she said that if i accept your view then i am not an author i am an archivist. if perdurantism wins then there is no single protagonist i am actually writing about. there is just a scattered object of drafts, a cloud of versions. when i write a scene in draft three i am not refining her i am adding a new segment to a snake that already exists complete from start to finish. it removes my agency. it means the choice i make today doesn't change her, it just adds to the sum of her. it makes the act of writing pointless because you cannot change what is already a fixed four-dimensional shape. i need to believe i can change her, that i can reach into the page and pull out the sister and say she never was. if i can do that then she endures. if i can't then i am just watching a film reel spin.

  the perdurantist stood up then and walked to the window, looking out at the dark street where nothing was moving. he said that you are confusing the ontology with the experience. of course it feels like you are changing her. that is the experience of the temporal part you occupy right now. but ontologically, the draft-one-her and draft-three-her are distinct. he turned around and said that the hard spot works both ways. if you insist she is the same, you must explain how she holds contradictory truths without exploding. if you insist she is different, you must explain why you feel grief for the sister she never had. you feel grief for a ghost. that grief proves the worm exists. you are mourning a temporal part that was cut off. the endurantist said that i am mourning a possibility, not a part. i am mourning a path not taken. that requires a single traveler who could have gone either way. a worm doesn't choose paths, it just lies across them. only a person who endures can choose to delete her own history.

  they stood there for a long time without speaking, the silence heavy with the weight of all the deleted pages in the bin behind them. the perdurantist finally said that maybe the character is not the person in the book but the intention in your head. the endurantist said that if the character is only in my head then why does she resist me? why does she feel real enough to break my heart when i kill her sister? the perdurantist said because you are a four-dimensional creature writing about a four-dimensional object and the friction feels like reality. the endurantist said no, the friction feels like love. and love requires something to love that stays the same even when it changes. if she is just a worm then i am loving a shape. if she endures then i am loving a soul. the perdurantist said that fiction has no souls. the endurantist said that is why i write, to give them one.

  i know this doesn't solve the plot hole in chapter four or tell you where to put the flashback, but i thought maybe seeing the machinery of the problem might help you stop fighting it. you are feeling the friction between how you experience the character and how the text actually exists. maybe for draft three you just need to be a perdurantist and accept that draft one is dead, but for the sake of the emotion on the page you need to be an endurantist and pretend she is the same woman who survived the fire. you can hold both thoughts without your head exploding, even if they can't. hope you get some sleep tonight.
