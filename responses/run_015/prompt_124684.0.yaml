answer: |-
  This is a sharp piece of ethical reasoning. You have effectively reconstructed a version of the **Principle of Fairness** (often associated with H.L.A. Hart and John Rawls) and pushed it to its breaking point using cultural conventions.

  You are right to feel the tension. The argument works beautifully for explicit contracts (I order food, I agree to pay the menu price), but it strains when applied to implicit cultural norms (I order food, I implicitly agree to the local tipping theology).

  Here is the diagnosis: **The leak is primarily in (5), but it reveals a structural flaw in (1).**

  If you want to keep the intuition that conventions generate obligations without accepting the *reductio* in (8), you need to modify (1) to include an **epistemic condition** and a **legitimacy constraint**.

  Here is the breakdown of where the argument slips and how to fix it.

  ### 1. The Primary Leak: Step (5) and the Nature of Conventions
  You suspect the move between (4) and (5), where you claim ignorance doesn't cancel the obligation. You are correct. This is the leak.

  **Why (5) fails:**
  Natural duties (e.g., "do not torture") apply regardless of knowledge. Conventional duties (e.g., "tip 20%") are *constituted* by mutual knowledge. A coordination scheme, by definition, relies on **common knowledge** (I know that you know that I know).

  If a tourist does not know the scheme exists, they are not actually participating in the *coordination*; they are merely acting in parallel.
  *   **The Free-Rider Argument:** The moral force in (1) comes from preventing "free-riding" (benefiting from others' restraint without restraining oneself). But you cannot free-ride on a rule you didn't know was in play. If I don't know we are playing a game of "quiet on the train," my loud phone call isn't cheating; it's just noise. I am not taking *unfair advantage* of your silence because I didn't know your silence was a contribution to a scheme.

  **The Fix:**
  You must add a **Reasonable Knowability Condition** to (1).
  *   *Revised (1):* ...anyone who steps into the relevant role inherits a directed moral obligation to follow it, **provided the scheme is reasonably salient or the agent has had a reasonable opportunity to learn it.**

  **The Cost:**
  *   **You lose:** The ability to call an ignorant tourist "immoral." They are not committing a *moral wrong* (Step 6); they are committing a *category error*.
  *   **You gain:** A duty to *inform oneself*. The obligation shifts from "follow the rule" to "make a reasonable effort to learn the rules of the house." This preserves the normative bite (tourists shouldn't be lazy) without the absurdity (tourists are sinners for not knowing).

  ### 2. The Secondary Leak: Step (7) and Moral Legitimacy
  Your *reductio* gains its real power in Step (7), where you equate queuing with bribery. This reveals that (1) is currently **normatively blind**.

  **Why (7) works as a *reductio*:**
  Stability and mutual expectation are not sufficient for moral obligation. A bribery scheme in a corrupt bureaucracy is a "stable coordination scheme with mutual expectation." Everyone expects the bribe; everyone pays it; it's low-cost compared to not getting the permit.
  If (1) is true as written, you have a *moral obligation* to bribe. That is clearly false.

  **The Fix:**
  You need a **Moral Legitimacy Constraint**.
  *   *Revised (1):* ...provided the scheme **is morally permissible and does not violate broader ethical norms.**

  **The Cost:**
  *   **You lose:** Cultural relativism. You cannot argue "when in Rome" if Rome is doing something unjust.
  *   **You gain:** The ability to distinguish between *etiquette* (queuing), *prudence* (jaywalking norms), and *corruption* (bribery). This saves you from the absurdity of being morally obligated to participate in local corrupt practices.

  ### 3. The Hidden Move: Voluntariness vs. Role-Occupancy (Step 3)
  You mentioned sensing a hidden move about voluntariness. This is located in Step (3): *"A visitor... steps into the role... and receives the benefits."*

  There is a difference between **receiving a benefit** and **accepting a benefit**.
  *   **Receiving:** I walk down the street; the queue keeps order; I benefit from the flow. (Involuntary)
  *   **Accepting:** I see the queue, I understand it, and I place myself at the back to get service. (Voluntary)

  Philosophers like Robert Nozick have argued that you cannot incur obligations merely by receiving benefits you didn't ask for (e.g., your neighbors start a PA system; you benefit from the music; you don't owe them $5).

  **The Fix:**
  To keep (1) viable, the "benefit" in (3) must be **actively sought**.
  *   Eating at the restaurant is voluntary.
  *   Crossing the street is often necessary (less voluntary).
  *   Therefore, the obligation to tip is stronger than the obligation to follow jaywalking norms, which is stronger than the obligation to follow greeting rituals.

  ### The Revised Argument
  If we patch the leaks, your argument looks like this:

  1.  **Modified Scheme-Inheritance:** If a social practice is a stable, morally permissible coordination scheme, and an agent **knowingly** enters the role to **accept benefits** from it, they inherit an obligation to comply.
  2.  **Epistemic Condition:** Ignorance excuses *unless* the agent had a reasonable duty to inform themselves (e.g., researching customs before travel).
  3.  **Application:** A tourist who researches US tipping norms and then refuses to tip is free-riding (Moral Wrong). A tourist who didn't know and couldn't reasonably be expected to know is merely uninformed (Faux Pas).
  4.  **Legitimacy:** A tourist is never obligated to follow local norms that are inherently unjust (e.g., bribery), even if stable.

  ### Summary of Costs and Benefits

  **If you reject (5) (Ignorance doesn't excuse):**
  *   **Cost:** You weaken the immediate moral blame. You can't scold a fresh-off-the-plane tourist for not queuing correctly *in the moment*.
  *   **Benefit:** You avoid the "constant invisible violation" absurdity. You shift the moral weight to **preparation** rather than **omniscience**.

  **If you restrict (1) (Add Legitimacy/Knowledge filters):**
  *   **Cost:** The principle becomes less elegant. It's no longer a simple "stability = obligation" formula.
  *   **Benefit:** It aligns with our actual moral intuitions. We *do* think tourists should try to respect local norms, but we *don't* think they are morally culpable for honest mistakes, and we *don't* think they should participate in corruption.

  **Verdict:**
  Keep the spirit of (1) and (3), but **reject (5)**. Conventional obligations are epistemically sensitive. To be bound by a convention, you must be able to recognize it as a convention.

  This saves your intuition: Tourists *do* have an obligation to follow local rules, but that obligation is predicated on a prior duty to **learn** them. The moral wrong isn't the bad queueing; it's the cosmopolitan laziness that led to it.
