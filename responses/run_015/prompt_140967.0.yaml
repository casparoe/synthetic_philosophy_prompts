  ### Margin Comments

  **Part (1)**
  > *"In the branch where the other envelope has 2x, my envelope is the smaller one, so x = S. In the branch where the other envelope has x/2, my envelope is the larger one, so x = 2S."*

  **Comment:** Correct. This is the precise conflation. You correctly identify that $x$ is not a fixed constant across the two branches of the expectation, but a random variable correlated with the state (Small/Large).

  > *"If I parametrize by the smaller amount S instead, then holding gives (1/2)(S) + (1/2)(2S) = 1.5S and switching gives (1/2)(2S) + (1/2)(S) = 1.5S."*

  **Comment:** Good symmetry argument. This cleanly demonstrates the ex-ante equivalence, which undermines the ex-post claim of strict dominance. Full credit.

  **Part (2)**
  > *"P(I have the smaller | A = 2^k) = p_k / (p_k + p_(k-1)) = 1/(1 + 2^α), because p_(k-1)/p_k = 2^α."*

  **Comment:** Algebra is correct. The Bayesian update is handled properly, including the cancellation of the 1/2 selection probability.

  > *"When k = 1 the second possibility has probability zero, so I know for sure I'm holding the smaller envelope and I switch."*

  **Comment:** Correct handling of the boundary condition. Since $K \ge 1$, $A=2$ cannot be the larger envelope ($2S=2 \implies S=1 \implies K=0$).

  > *"E[S] = Σ_k 2^k·c·2^(-αk) = c·Σ_k 2^((1-α)k), which converges iff α > 1 and diverges for α ≤ 1."*

  **Comment:** The calculation of $E[S]$ is correct. The convergence condition for the *expectation* is correct ($\alpha > 1$).

  > *"for α ≤ 1 the weights p_k don't sum to one — the series Σ 2^(-αk) only converges when α > 1 — so those aren't really probability distributions at all. α ≤ 1 gives an improper prior"*

  **Comment:** **Major Error.** The series $\sum_{k=1}^\infty 2^{-\alpha k}$ is a geometric series with ratio $r = 2^{-\alpha}$. Since $\alpha > 0$, $r < 1$, so the sum *always* converges. The distribution is proper for all $\alpha > 0$. You have conflated the convergence of the probability mass ($\sum p_k$) with the convergence of the expectation ($\sum 2^k p_k$). This is a fundamental distinction in this course. The paradox persists for *proper* priors with infinite mean; dismissing it as "improper" misses the point of the exercise. Docked 3 points here.

  > *"Once you restrict to genuine distributions, i.e., α > 1, switching never pays and the paradox from part (1) never gets off the ground."*

  **Comment:** This conclusion follows from your previous error. Since the prior *is* genuine for $\alpha \in (0, 1]$, the paradox *does* get off the ground for genuine distributions. You've identified the infinite mean correctly but labeled it incorrectly as an invalid probability space.

  **Part (3)**
  > *"For everything from 2^1 up to 2^N the computation in part (2) is unchanged, so I switch. But if I see 2^(N+1), then S = 2^N and I'm definitely holding the larger envelope, so switching loses 2^N for sure."*

  **Comment:** Correct. The truncation creates a maximum observable value where the posterior probability of holding the larger envelope becomes 1. This single point balances the expected gains from all lower values.

  > *"There, switching really is better conditional on every amount... symmetry argument from part (1) is not universally valid: there are priors on which you should switch unconditionally... and the '1.5S = 1.5S' reasoning only goes through when E[S] is finite."*

  **Comment:** This is the correct resolution to the apparent contradiction. You correctly identify that the Law of Total Expectation (which underpins the symmetry argument) fails when expectations are infinite (Fubini's theorem conditions are not met). Note that this contradicts your claim in Part (2) that the $\alpha < 1$ prior is "improper"—you treat it as a valid object here, which is correct, but you need to reconcile that with your earlier statement.

  > *"So what part (1) calls a fallacy is really a valid argument with a hidden finiteness assumption"*

  **Comment:** Well put. The "fallacy" in Part (1) assumes the conditional probabilities are 1/2 independent of $x$, which implicitly requires a prior that doesn't exist (uniform over $\mathbb{Z}^+$) or relies on swapping integrals that don't converge absolutely. You've grasped the structural issue well, despite the series error in Part (2).

  ---

  ### TA Summary
  You have a strong grasp of the decision-theoretic structure (Parts 1 and 3 are excellent). However, the error in Part (2)(iii) regarding the convergence of the geometric series is a basic probability mistake that undermines your interpretation of the result. Distinguishing between a *proper prior with infinite mean* and an *improper prior* is the specific learning objective of this problem set. You solved the decision problem correctly but failed the probability check. Be careful with series convergence conditions; $\sum r^k$ converges for $|r|<1$, regardless of the expectation $\sum k r^k$.
