answer: |-
  This is not two phenomena. It is one.

  The phenomenon you are describing is **Relational Identity**.

  While there is no single dictionary word that perfectly encapsulates this (type designers often gesture at it with terms like "color," "texture," or "voice," which are results rather than causes), **Relational Identity** is the precise conceptual framework used by cognitive scientists and serious type designers to explain why a glyph functions only as part of a system.

  Here is the commitment you asked for: **Belonging** and **Reading** are the same process viewed from opposite directions. A letter "reads" because your brain recognizes it as a member of the "letter A" category. It "belongs" because your brain recognizes it as a member of the "this typeface" category. In a functioning typeface, these two categorizations are fused. You cannot optimize one without affecting the other because they share the same visual data.

  ### Why it is one phenomenon

  You feel them as separate because you are looking at the *glyph* (the object), but the phenomenon lives in the *viewer's brain* (the processing).

  1.  **Reading (Categorization):** To read an 'a', your brain compares it against a mental prototype of 'a'.
  2.  **Belonging (Contextual Priming):** To read the *style*, your brain builds a temporary, local prototype based on the other letters it has just seen (the 'e', the 'o', the 'g').

  When you redraw the 'a' and the 'e', you are not fixing the 'g'; you are **recalibrating the viewer's local prototype**. The 'g' didn't change, but the ruler you are measuring it against did. When the 'g' suddenly looks right, it is because the *system's average* shifted to align with the 'g's specific quirks.

  Conversely, when an 'a' stops reading as an 'a' in isolation, it is because it relies on its neighbors to supply the missing data required to complete the pattern. In isolation, the visual weight falls entirely on its absolute geometry. In context, the visual weight is distributed across the system.

  ### The Mechanism: Contextual Modulation

  The mechanism driving Relational Identity is **Contextual Modulation**. This is a established concept in visual perception. It dictates that the perception of a stimulus is altered by the presence of surrounding stimuli.

  In type design, this is often mislabeled as "optical correction" (which implies fixing errors). It is actually **information distribution**.
  *   If your 'o' is very round, your 'a' can be squarer and still read as 'a', because the 'o' has already established the "roundness" parameter for the font.
  *   If your 'o' is removed, the 'a' must carry the burden of "roundness" itself, or it fails.

  This explains your "clearance" observation. You can push an 'a' toward weirdness as long as the 'o' and 'e' are close enough in "conceptual space" to anchor the system. The "distance" you cannot measure is **Cognitive Distance**, not physical space. It is the limit of how much information the brain is willing to offload from one glyph to its neighbors before the pattern breaks.

  ### Why "Family Resemblance" felt unsatisfying

  Your friend cited Wittgenstein, and they were technically right, but their application was static. Wittgenstein's "Family Resemblance" suggests there is no single feature all 'a's share (some have tails, some don't, some are double-story).

  However, you correctly sensed that there *is* a rule. The rule is not in the features; it is in the **tolerances**. A typeface is a system of **constrained variance**.
  *   **Family Resemblance** says: "These letters look similar."
  *   **Relational Identity** says: "These letters define the boundaries of similarity for each other."

  The 'g' looks wrong initially because it falls outside the tolerance range set by the initial 'a' and 'e'. When you redraw the 'a' and 'e', you expand or shift the tolerance range to include the 'g'.

  ### The Borderline Test: The Substitution Heuristic

  You asked for a way to settle a borderline case. Since we cannot measure "Cognitive Distance" with a ruler, use the **Substitution Heuristic**.

  To determine if a glyph has achieved Relational Identity (i.e., if it belongs *and* reads), perform this mental or physical swap:

  1.  **The Foreign Swap:** Place the suspect glyph (your 'g') into a *different* typeface that has similar metrics (stem weight, x-height) but a different "voice."
      *   *If it looks like a mistake:* It has high Relational Identity (it is tightly bound to your original font's specific logic).
      *   *If it looks generic:* It has low Relational Identity (it relies on standard metrics rather than systemic relations).

  2.  **The Isolation Swap:** Place the suspect glyph on a blank page.
      *   *If it ceases to read as the letter:* It is **Over-Contextualized**. It relies too heavily on its neighbors to define its identity. You must strengthen its absolute form (increase its "archetypal signal").
      *   *If it reads perfectly but looks boring:* It is **Under-Contextualized**. It is a generic letter that hasn't been integrated into the system's specific logic. You must introduce more stylistic variance (riskier shapes) and rely on the neighbors to anchor it.

  **The Verdict:** A successful glyph sits in the middle. It must be weird enough to belong to *your* font, but stable enough to read without its neighbors.

  ### Summary Definition

  **Relational Identity** is the property of a glyph where its legibility and stylistic coherence are derived not from its absolute geometry, but from its position within the system's network of visual constraints.

  *   **It is not Ductus:** It does not matter how the pen moved.
  *   **It is not Metrics:** It does not matter if the stems match mathematically.
  *   **It is not Style:** It is not a decorative overlay.

  It is the **visual tension** required to keep the system coherent without breaking the character's identity. When you fix the 'a' to save the 'g', you are not drawing letters; you are tuning a circuit. The 'g' is a resistor; the 'a' is the voltage. You cannot fix the flow by only touching the resistor.

  **Commitment:** Stop trying to fix the 'g'. If the 'g' is the problem, the system is the problem. Adjust the anchors ('a', 'e', 'o') until the 'g' falls into place. That is not a workaround; that is the definition of the craft.
