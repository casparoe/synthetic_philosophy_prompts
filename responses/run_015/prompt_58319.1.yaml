  9.  *(Self-Correction during drafting)*: In Scenario 1, Interventionism actually agrees with Counterfactuals if we treat Job A and Job B as atomic binary variables. If $A=1, B=1 \to Fail$, and $A=0, B=1 \to Fail$, then $A$ is not a cause. The advantage of Interventionism is that it encourages modeling the *system* (e.g., `num_deletions`), where an intervention *does* change the outcome. I must make this distinction clear: Counterfactuals are stuck with the events; Interventionism is about modeling the *relationships*.

      *Wait, let's look at Woodward specifically.* Woodward argues that causation is about *invariance*. If the relationship between "Cleanup Jobs Running" and "Directory Missing" is invariant, that's the cause. The specific token event is less important than the type. I will focus on the *actionability* aspect.

      *Re-evaluating Scenario 1 for the Engineer:*
      *   Counterfactual: "But for Job A?" No. "But for Job B?" No. Result: No root cause. (Unsatisfying).
      *   Interventionist: "If I change the *policy* that allows two jobs to delete the same thing, does the error go away?" Yes. Result: The *policy* is the cause.
      *   This distinction is vital. Counterfactuals look at *events*. Interventionism looks at *variables/relationships*.

      *Re-evaluating Scenario 2:*
