answer: |-
  This is a remarkably sophisticated bar fight. Most people stop at the St. Petersburg Paradox (infinite EV); your friends are grappling with the **Pasadena Paradox** (Nover & Hájek, 2004), which is technically more damaging because the expectation doesn't diverge to infinity—it oscillates and remains undefined due to conditional convergence.

  Here is a move-by-move breakdown of their argument, rated on a scale from **Clearly Mistaken** to **Clearly Right**, followed by what both of them are missing.

  ---

  ### Round 1: The Core Threat
  **Friend A:** *"If EV is undefined there's no number to compare against the entry fee, so rational choice just has a real hole in it."*
  **Friend B:** *"Undefined EV just means you fall back on maximin or bounded rationality, it's not total paralysis."*

  *   **Rating A: Clearly Right.**
      This is the exact philosophical sting of the Pasadena Paradox. Expected Utility Theory (EUT) is a comparative framework: you choose Act A over Act B if $EV(A) > EV(B)$. If $EV(A)$ is mathematically undefined (not $\infty$, but *NaN*), the inequality cannot be evaluated. The theory is silent. Silence in a normative theory is a failure.
  *   **Rating B: Partially Right (Pragmatically), Wrong (Theoretically).**
      B is right that humans wouldn't freeze in paralysis (we'd use heuristics). But B is wrong that this saves EUT. Switching to Maximin (maximizing the minimum gain) is adopting a *different* decision theory (Wald's criterion). Admitting you need a different theory to handle the case is an admission that EUT is incomplete.

  ### Round 2: The Physics Objection
  **Friend B:** *"In reality you'd never face this cause physical limits prevent infinite games anyway."*
  **Friend A:** *"The paradox is about ideal rationality, not physics."*

  *   **Rating B: Clearly Mistaken (in this context).**
      This is the "Finite World Objection." While true that casinos have finite bankrolls, decision theory is primarily **normative**, not descriptive. It asks how a rational agent *ought* to reason, even in idealized cases. If a theory of gravity breaks down in a vacuum, you don't say "but there are no perfect vacuums." You fix the theory. B is committing a category error.
  *   **Rating A: Clearly Right.**
      A correctly identifies that paradoxes in decision theory are stress tests for the logic of rationality, not engineering constraints. If EUT fails in the ideal case, it suggests the axioms themselves are flawed, regardless of physical implementation.

  ### Round 3: The "Patch" vs. "Formalism" Debate
  **Friend A:** *"Maximin/bounded rationality are external patches, not actually inside EU theory, so the gap remains."*
  **Friend B:** *"If you model it with hyperreals the expectation becomes a well-defined infinite value, so the problem dissolves."*

  *   **Rating A: Clearly Right.**
      A is correct that these are external patches. EUT is defined by the VNM axioms (Von Neumann-Morgenstern). None of those axioms prescribe Maximin. Adding them changes the system. The "gap" in EUT remains even if humans have workarounds.
  *   **Rating B: Technically Plausible, Philosophically Contested.**
      B is referencing **Non-Standard Analysis** (hyperreals). It is true that hyperreals can assign values to certain divergent series that reals cannot. However, the Pasadena problem arises from the **Riemann Rearrangement Theorem**: the sum depends on the *order* of terms. Hyperreals can sum a specific sequence, but if the game doesn't specify a temporal or logical ordering of the outcomes, the hyperreal value is still arbitrary. B is overstating the solution; it shifts the problem from "undefined sum" to "undefined ordering."

  ### Round 4: The Meta-Argument
  **Friend A:** *"That's just changing the formalism to hide the problem."*
  **Friend B:** *"A was being overly conservative about math."*

  *   **Rating A: Mostly Right.**
      Changing the number system (from $\mathbb{R}$ to $^*\mathbb{R}$) changes the definition of Utility. If Utility is no longer a real number, it's no longer standard EUT. It's a new theory. Calling it "hiding the problem" is sharp but accurate: you've swept the undefined nature under the rug of a more complex number system.
  *   **Rating B: Mistaken.**
      Calling A "conservative" is a rhetorical dodge. The constraint that Utility maps to Real Numbers is a feature of EUT, not a bug. Removing it solves the math but breaks the connection to standard preference orderings (which are usually assumed to be Archimedean). B is defending the math at the expense of the theory's original intent.

  ---

  ### The Scorecard
  *   **Friend A:** **Winner on Theory.** A correctly identifies that the paradox exposes a genuine incompleteness in Expected Utility Theory and that physical/pragmatic workarounds do not fix the normative gap.
  *   **Friend B:** **Winner on Pragmatism (but loses the debate).** B correctly notes that the world doesn't end because of this, but fails to defend EUT itself. B's mathematical solutions (hyperreals) are interesting but introduce new axioms that arguably constitute a different theory entirely.

  ---

  ### What Both Are Missing

  While A wins the argument, both friends are overlooking the most productive developments in the literature since 2004. Here is the "Third Way" they missed:

  **1. Relative Expectation Theory (The Hájek Pivot)**
  Alan Hájek (who co-authored the paradox) later suggested that we shouldn't look for the absolute EV of a single game. Instead, we should compare the **difference** between two acts.
  *   *The Insight:* Even if $EV(A)$ and $EV(B)$ are both undefined, $EV(A) - EV(B)$ might be well-defined.
  *   *Why it matters:* Rationality might be about *preference orderings* between options, not assigning absolute scalar values to them. This saves the core of decision theory without needing hyperreals or maximin.

  **2. The Role of Dominance**
  The Pasadena game creates a conflict between Expected Utility and the **Principle of Dominance**.
  *   *The Insight:* You can construct a Pasadena-like game that is strictly dominated by a constant payoff (you always lose more than you gain in every state), yet standard EUT can't tell you not to play it because the EV is undefined.
  *   *Why it matters:* This suggests the problem isn't just "undefined numbers," but that EUT violates basic intuition about dominance. Both friends are arguing about *math*, but the real issue is *axiomatic consistency*.

  **3. Truncation and Limits**
  Both friends treat the game as a completed infinite object.
  *   *The Insight:* In any actual decision, the agent must decide *when* to stop evaluating. If you treat the game as a limit of finite truncations, the limit does not exist (it oscillates).
  *   *Why it matters:* This suggests the problem isn't the math of infinity, but the **temporal structure** of the decision. If the payoffs are distributed over time, discounting (even slightly) makes the series converge absolutely, dissolving the paradox. Both friends ignored **time discounting**, which is the most realistic "dissolver" of the paradox.

  ### Final Verdict
  Tell **Friend A** they are right that EUT has a hole, but wrong that it leads to paralysis (Relative Expectation fixes this). Tell **Friend B** they are right that the math can be extended, but wrong that this preserves EUT (it creates a new theory).

  The paradox doesn't kill rationality; it kills the idea that rationality requires assigning a single real number to every gamble. **A won the battle, but the war moved on without them.**
