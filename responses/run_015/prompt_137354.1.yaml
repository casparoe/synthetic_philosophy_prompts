      *   **Right.** Correctly isolates the target premise based on the definitions provided in the course context.
  *   *"Not (2)... since the conjunction... is what a genuine dilemma is supposed to consist in"*
      *   **Right.** Shows understanding of the definition of the phenomenon being defended.

  **Paragraph 3**
  *   *"The defender need not be committed to the absurd claim that an agent can be required to do the impossible."*
      *   **Creditworthy.** Accurately anticipates the standard objection to rejecting OIC.
  *   *"reject (1) as a completely general principle while retaining it for the case in which a single requirement is in play"*
      *   **Right.** This is a coherent formulation of the standard dilemma defense (OIC holds individually, fails conjunctively).

  **Paragraph 4**
  *   *"Neither of the two consequences mentioned follows from the defender's being right."*
      *   **Right.** Correct conclusion for part (b).

  **Paragraph 5**
  *   *"An overridden requirement is one that is defeated by stronger competing reasons... An unfulfilled requirement is one that still holds after the agent has acted"*
      *   **Right.** Precise and accurate drawing of the required distinction.
  *   *"In a genuine dilemma the requirement to do B is of the second kind."*
      *   **Right.** Correctly applies the distinction to the case defined in the prompt.

  **Paragraph 6**
  *   *"The agent regrets not that she did A... but that a requirement of hers remains unfulfilled"*
      *   **Right.** Correctly explains the rationality of regret based on the surviving obligation.
  *   *"This is also why the residue is regret rather than guilt"*
      *   **Creditworthy.** Nuanced point; strictly speaking not required, but shows good understanding of moral residue.

  **Paragraph 7**
  *   *"To say that both A and B are what S ought to do... is to say that they are prima facie requirements in Ross's sense"*
      *   **Wrong.** Contradicts the course definition provided in the prompt. Genuine dilemmas involve 'oughts' that are not overridden; Rossian *prima facie* duties are by definition overrideable by the all-things-considered duty.
  *   *"Once they are read as prima facie, the case turns out to be one of the weighing kind after all"*
      *   **Wrong.** This collapses the category of 'genuine dilemma' into 'conflict resolvable by weighing', undermining the defense offered in parts (a) and (b).

  **Paragraph 8**
  *   *"The defender of genuine dilemmas can stipulate that she is using 'ought' to express a requirement that persists unfulfilled"*
      *   **Imprecise/Wrong.** While definitions can be fixed, one cannot settle a substantive philosophical dispute about the nature of reasons merely by stipulation.
  *   *"the defender settles it in her own favour by fixing the sense of the term."*
      *   **Wrong.** Philosophical disputes about normativity are not settled by linguistic fiat; the critic challenges whether such requirements exist, not just what we call them.

  **Paragraph 9**
  *   *"A genuine dilemma is not a case of not knowing which of two things one ought to do"*
      *   **Right.** Correctly distinguishes ontological dilemmas from epistemic uncertainty.

