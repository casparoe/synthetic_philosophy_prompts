      *   **Consensus in Literature:** This is the "Disjunction Problem". Teleosemanticists reply by refining the notion of "function" (Millikan's consumer vs. producer) or "normal conditions" (conditions under which the function *works*, not just conditions under which the trait *fired*). Step (6) equivocates on "normal conditions".

