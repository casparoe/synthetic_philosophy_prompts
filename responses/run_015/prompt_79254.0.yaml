      *   **Philosophical Context:** This is the classic "Disjunction Problem" (Fodor's term, though applied here to teleosemantics). Teleosemanticists (Millikan, Dretske, Papineau, Neander) have specific responses. The core tension is between *historical selection* and *content determination*.
