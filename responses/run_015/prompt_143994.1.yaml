answer: |-
  This is a classic stalemate. The phrase "what it's like" is a philosophical Rorschach test; your friend is projecting an ontological claim onto a phrase that functionalists interpret as an epistemic or trivial claim. To break the circle, you need to force him to pick a lane. He cannot be allowed to slide between "I don't have the concept" and "There is a missing property."

  Here is the menu you asked for, evaluated for truth, defensibility, and whether it actually earns his dualist conclusion.

  ### Part 1: The Menu of Readings

  Here is the breakdown of your five candidates. I have added a verdict on whether each reading actually supports his conclusion (that functionalism is ontologically incomplete).

  **(1) The Boring One (Acquaintance vs. Description)**
  *   **Claim:** Having an experience is different from reading a description of it, just as riding a bike is different from reading a manual.
  *   **Status:** **Trivial & True.** Functionalists agree completely. Functionalism is a theory of what the state *is*, not a theory of how it feels to *have* it from the inside.
  *   **Does it get him his conclusion?** **No.** This is an epistemic distinction about modes of access, not an ontological distinction about the nature of the state. A functionalist can say, "Yes, you need to instantiate the function to know what it's like, but the 'what it's like' just *is* the instantiating of the function."

  **(2) The Mary-ish One (The Missing Fact)**
  *   **Claim:** A complete functional/physical description of the brain leaves out a *truth*. There is a proposition about the world (e.g., "Red looks like *this*") that is true, but not entailed by the functional story.
  *   **Status:** **Substantive & Contested.** This is the core of the Knowledge Argument. It is defensible if you accept that knowledge by acquaintance reveals new *facts*. It is false if you believe it reveals only new *modes of presentation* of old facts.
  *   **Does it get him his conclusion?** **Yes.** If there is a truth that functionalism cannot entail, functionalism is incomplete. This is the strongest version of his objection.

  **(3) The Concept One (Phenomenal Concepts)**
  *   **Claim:** Our concept of "red experience" is not a functional concept. It is an "acquaintance concept" that can only be possessed by undergoing the state. Functional descriptions cannot transmit this concept.
  *   **Status:** **Substantive & Defensible.** Many physicalists accept this (the Phenomenal Concept Strategy). They argue the *property* is physical/functional, but the *concept* is unique.
  *   **Does it get him his conclusion?** **No, not necessarily.** This explains the *intuition* of dualism without requiring dualism to be true. If he uses this, he has to argue that distinct concepts imply distinct properties, which is a further step. If he stops at concepts, he hasn't proven functionalism false, only that functional vocabulary is limited.

  **(4) The Property One (Intrinsic Qualities)**
  *   **Claim:** Experiences possess intrinsic, non-relational properties (qualia) that exist over and above their causal roles.
  *   **Status:** **Substantive & The Core Disagreement.** This is the metaphysical heart of the dualist position. Functionalists deny this exists.
  *   **Does it get him his conclusion?** **Yes.** If experiences have properties that are not relational/dispositional, and functionalism only defines things by relations/dispositions, then functionalism leaves out the essence of experience.

  **(5) The Ineffability/Incorrigibility One**
  *   **Claim:** The quality cannot be fully described (ineffable) and the subject cannot be wrong about having it (incorrigible).
  *   **Status:** **Likely False/Incoherent.** Dennett attacks this hardest. We are often wrong about our experiences (illusions, change blindness), and if we can talk about them at all ("it's like red"), they aren't strictly ineffable.
  *   **Does it get him his conclusion?** **Only if combined with (2) or (4).** On its own, it just says language is limited or authority is high. It doesn't prove there is a *non-functional property*.

  ---

  ### Part 2: Dennett's Quartet and the Incoherence Charge

  Dennett's charge in "Quining Qualia" is not just that these properties are hard to combine, but that the standard philosophical definition of qualia *requires* all four simultaneously, and they contradict each other.

  The Four Properties: **Intrinsic, Ineffable, Private, Directly/Apprehensibly Incorrigible.**

  Here is how your readings map onto them, and where the logic breaks:

  1.  **Reading (4) (The Property One)** maps to **Intrinsic**.
      *   *Requirement:* To be intrinsic, the property must exist independently of its relations to other things (including reports, memories, and behaviors).
  2.  **Reading (5) (Ineffability/Incorrigibility)** maps to **Ineffable, Private, Directly Apprehensible**.
      *   *Requirement:* To be directly apprehensible/incorrigible, the subject must be able to identify the property immediately and with authority.

  **The Incoherence Trap:**
  Dennett argues you cannot hold (4) and (5) together.
  *   **The Conflict:** If a property is **Intrinsic** (Reading 4), it is causally isolated from your judgment mechanisms (otherwise it would be defined by its causal role). But if it is causally isolated from your judgment mechanisms, how can you be **Directly Apprehensible** of it (Reading 5)? How can you report on it, or even know you have it, if it doesn't interact with the cognitive systems that produce knowledge?
  *   **The "Private" Problem:** If it is **Private** (Reading 5), no one else can access it. But if no one else can access it, and you can't compare it to anything else (because it's **Intrinsic**), you have no way to check if you are using the term "red" consistently over time.
  *   **The "Ineffable" Problem:** If it is **Ineffable** (Reading 5), you cannot describe it. But if you cannot describe it, you cannot distinguish it from other qualia in a public language. If you can't distinguish it, you can't claim it's a specific property (like "redness") rather than just "something."

  **Which combinations can't be held?**
  *   **Intrinsic + Directly Apprehensible:** This is the biggest tension. To apprehend something is to establish a relation between the observer and the observed. If the quale is truly intrinsic (non-relational), it cannot enter into the "apprehending relation."
  *   **Ineffable + Fact-Stating (Reading 2):** If the quality is ineffable, you cannot state the "fact" that is missing. Your friend claims there is a *fact* ("red looks like this"). If he can point to the fact, it's not ineffable. If it is ineffable, he can't assert it as a fact in an argument.

  **Verdict:** Your friend is likely relying on **Reading (4) (Intrinsic)** to ground his ontology, but he relies on **Reading (5) (Directly Apprehensible)** to justify his confidence that he knows it exists. Dennett's point is that the moment he uses his confidence (apprehensibility) to tell you about the property, he has made it relational/functional, thereby destroying its intrinsicality.

  ---

  ### Part 3: The Chip Case Analysis

  Your group's case is a version of the **Long-Term Inverted Spectrum**, but with a crucial twist: *memories and introspective dispositions are updated.*

  **The Scenario:**
  *   Day 1: Neural State A = Red Role.
  *   Night: Chip swaps A and B. Updates memories so you "remember" A as having looked like B.
  *   Day 2: Neural State B = Red Role (functionally). You say "Red looks the same as always."

  **Your Friend's Claim:**
  "Even so, there's a fact about whether red looks today the way red looked yesterday, and that fact is exactly what your theory leaves out."

  **Which Reading is doing the work?**
  This is purely **Reading (4) (The Property One)**.
  He is asserting that the *intrinsic quality* of the experience persisted (or swapped) independently of the functional role, the memory, and the report. He is positing a "ghost in the machine" that rides along with the neural states but is not defined by them.

  **Is this a Strawman?**
  From Dennett's perspective: **Yes.**
  Dennett would argue that if *all* functional roles are updated—including the introspective memory of what red looked like yesterday—then there is **no fact of the matter** left to be missed.
  *   **The Functionalist Argument:** "What it's like" is constituted by the functional relations (including memory relations). If you swap the neural state *and* update the memory to match, you have swapped the experience *and* the memory of the experience. To say "But the *real* feeling didn't match" is to posit a property that makes no difference to anything—no behavior, no memory, no judgment, no physics.
  *   **The Dualist Counter:** He will say, "The feeling is the one thing that *doesn't* need to make a difference to be real."

  **Is the slogan doing zero work (The Indexical Suspicion)?**
  **Be honest: Yes.**
  In this specific Chip Case, the phrase "what it's like" is functioning as a **pure indexical** (like "this" or "here").
  *   When he says, "There's a fact about whether red looks today the way it looked yesterday," he is essentially pointing at a mental placeholder and saying, "*This* property."
  *   But because the chip has updated all discrimination and memory, there is no functional way to identify "*this* property" across the time gap.
  *   The slogan sounds deep because it mimics the grammar of a factual claim ("There is a fact about X"), but it lacks the conditions for truth. It asserts a difference that makes no difference.
  *   **The Trap:** If he insists there is a fact, ask him: "What would count as evidence for or against this fact?" If he says "Nothing, it's private," then he has admitted the fact is causally inert. If it is causally inert, it cannot be "directly apprehensible" (because apprehension is a causal process).

  ### Strategic Advice for the Session

  Don't argue the Chip Case on its own terms. Use the Menu to force a choice.

  1.  **Force the Ontological/Epistemic Split:** Ask him: "Is your objection that we lack the *concept* (Reading 3), or that there is a missing *property* (Reading 4)?"
      *   If he says **Concept**: You concede functionalism is hard to learn without experience, but deny it's incomplete. (He loses the dualist conclusion).
      *   If he says **Property**: You move to Dennett's Quartet.

  2.  **Attack the Package Deal:** If he insists on the Property (Reading 4), ask: "Is this property something you can identify directly?"
      *   If **Yes**: Then it plays a causal role in your identification. It is relational, not intrinsic. (Contradicts Reading 4).
      *   If **No**: Then how do you know it's there? You are positing a property that you cannot detect, describe, or use. (Makes Reading 2 vacuous).

  3.  **The Chip Case Kill-Shot:** In the Chip Case, ask: "If the memory and the discrimination are updated, what is the 'fact' you are tracking?"
      *   If he says "The intrinsic feel," ask: "Does that feel cause your judgment?"
      *   If **Yes**: The chip should have failed to update the judgment perfectly (because the feel changed).
      *   If **No**: Then the feel is a causally inert epiphenomenon. Ask him why we should believe in it if it explains nothing, predicts nothing, and changes nothing.

  **Summary:** Your friend is using Reading (1) to sound reasonable, Reading (5) to sound authoritative, but he needs Reading (4) to be a dualist. Dennett's point is that (4) and (5) cannot coexist. The Chip Case exposes this: if the functional role (including memory) is fixed, the "intrinsic property" becomes a causally isolated ghost. The slogan "what it's like" is the smoke screen that lets him pretend these distinct claims are one solid argument.
