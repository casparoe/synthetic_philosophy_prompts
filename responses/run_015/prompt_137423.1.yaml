answer: |-
  Mira watched the cursor blink on Ari's screen. Hour eleven. Fifty variables interacting probabilistically. "Look at the state space," she said. "Every known exact method grows faster than any polynomial here. He has one laptop and lives at stake. You insist norms state what is correct rather than what is achievable, but if the math says he cannot compute the optimum, commanding him to is nonsense."

  Dev leaned against the doorframe. "You argue a normative requirement is admissible only if an agent can conform to it. But norms aren't commands; they are measures. Like a perfect circle. No drawn line is perfectly circular, yet the ideal evaluates the draft. Ari should aim for the exact plan. The gap between the two is precisely what lets a norm evaluate an agent from outside her own predicament."

  "If I tell him 'maximize lives saved' using an intractable algorithm, he freezes," Mira countered. "An intractable ideal should be replaced by a tractable surrogate norm that approximates it as closely as the budget allows. Otherwise, you collapse the normative into the descriptive—simply saying 'he does what he does'."

  "Not necessarily," Dev said. "The ideal prevents complacency. It shows where he failed. My position isn't indifference to Ari's actual situation; it's refusing to lower the bar because the climb is steep. Complexity results are worst-case, asymptotic, encoding-relative and contingent on machine architecture, so they underwrite no claim about what Ari ought to believe or do. Maybe this instance is easy."

  Mira conceded the point lightly. "I concede that complexity classes depend on the machine model. But practical constraints still bind. How do I choose the surrogate? I minimize expected loss within the time budget. That justification isn't speed alone; it's the best possible adherence to the value of life given the constraint."

  "But the ideal norm criticizes the surrogate," Dev pressed. "It tells him he missed a better route. If you lower the standard, you lose the critical leverage to say he should have bought faster hardware or trained better. I concede that worst-case bounds do not dictate every single instance, but norms shouldn't depend on instance luck."

  "Here is the break," Mira said. "Consider diagnosability. A method's difficulty is diagnosable when there is a test, computable well inside the agent's budget, that flags in advance the instances on which the method will overrun that budget. It is opaque when no such test exists."

  Dev nodded. "Agreed. So if it's diagnosable, Ari knows when to switch."

  "Exactly. But if the difficulty is opaque, he cannot tell when he is in the hard region," Mira said. "This dismantles your compromise that Ari can aim at the ideal norm and satisfy-when-hard. If opacity holds, the compromise issues no guidance at all. He won't know he's stuck until time runs out and people die."

  Dev paused, then smiled faintly. "But if the difficulty is opaque, you cannot tell which instances call for the surrogate norm either. Your replacement has to be a single universal policy rather than a conditional one. You can't say 'use surrogate when hard' because you can't know. So the choice between universal policies is a question about which norm is correct that complexity theory does not touch. You're back to my shore."

  Mira shifted her weight. "I relocate diagnosis from the instance to the environment. What matters is whether the distribution of instances an agent actually faces is one on which her policy's expected performance is acceptable. This is an empirical and local matter rather than something settled by an asymptotic worst-case theorem. We look at the road closures he actually sees, not all possible maps."

  "And who defines that distribution?" Dev asked sharply. "Data doesn't tell you which data counts. Claiming the empirical premise justifies the norm assumes a prior normative claim about what risks matter. You say feasibility defines admissibility, but you're smuggling in a value judgment about which environments are relevant."

  "So we disagree on the status of the empirical premise," Mira said. "I see it as data; you see it as a value."

  "I see it as the only place left for normativity to stand," Dev replied. "If complexity doesn't bind, and the instance is opaque, only the choice of distribution remains. That choice isn't feasible; it's correct."

  "Then we end here," Mira said. "You hold the standard is independent of the agent's capacity to verify it. I hold the standard is bound by the agent's capacity to verify the environment."

  "Precisely," Dev said. "And Ari still has ten minutes."

