      *   **Problem:** Frustration with the shallow "Landauer solved it" narrative. Wants to know the *desiderata* (requirements) for a *genuine* resolution via information physics.
      *   **Specific Requirements:**
          *   List specific cases the theory must handle (Szilard, Quantum Error Correction, Non-equilibrium steady states/continuous feedback).
          *   List distinctions it must preserve (Logical vs. Thermodynamic reversibility, Measurement vs. Erasure cost, System info vs. Demon state info).
          *   List physical constraints (Statistical 2nd Law, Landauer's bound, Fluctuation Theorems) and label them as non-negotiable or camp-preference.
          *   **Crucial:** Identify tensions/incompatibilities (e.g., Hamiltonian memory vs. trajectory-by-trajectory 2nd Law).
          *   **Evaluation:** Briefly assess standard accounts (Szilard, Landauer-Bennett, Quantum/Coherence) against this list (where they crack).
          *   **Constraint:** No bibliography.
      *   **Tone:** Rigorous, philosophical but physically grounded, critical, avoiding hand-waving.

  2.  **Deconstruct the "Maxwell's Demon" Problem:**
      *   The core paradox: A being seems to violate the Second Law of Thermodynamics (decrease entropy without work) by using information.
      *   The standard resolution: Information processing has thermodynamic costs (Landauer's Principle).
      *   The user's critique: This is often stated dogmatically without specifying the exact conditions under which it holds or where it might fail.

  3.  **Drafting the Desiderata List (The "What it must do" section):**
      *   *Case Coverage:*
          *   Szilard Engine (Single particle): Baseline. Must recover $k_B T \ln 2$.
          *   Quantum Memory/Error Correction: Must handle superposition and entanglement. Does erasing a qubit cost the same if it's entangled? (Quantum Landauer).
          *   Continuous Feedback/NESS: Real demons aren't one-shot. Must handle continuous measurement and feedback control without accumulating infinite debt.
      *   *Conceptual Distinctions:*
          *   Logical vs. Thermodynamic Reversibility: Computing can be logically reversible (Toffoli gate) but thermodynamically irreversible if coupled to a bath. The theory must distinguish mapping states vs. heat dissipation.
          *   Measurement vs. Erasure: Szilard thought measurement cost energy. Bennett showed erasure is the culprit. A robust theory must explain *why* measurement can be free (in principle) but erasure isn't.
          *   Correlation vs. Knowledge: Is the entropy reduction in the system due to the demon's *knowledge* or the physical *correlation* between demon and system?
      *   *Physical Constraints:*
          *   Statistical 2nd Law ($\langle \Delta S \rangle \ge 0$): Non-negotiable for macroscopic averages.
          *   Landauer's Bound ($Q \ge k_B T \ln 2$): Non-negotiable *if* memory is reset to a standard state independent of input. But is it fundamental or derived?
          *   Fluctuation Theorems (Jarzynski, Crooks): Non-negotiable for small systems. They generalize the 2nd Law.
          *   Hamiltonian Dynamics: If the whole universe (System + Demon + Bath) is Hamiltonian, Liouville's theorem says phase space volume is conserved. How does entropy increase? This is the core tension.

  4.  **Identifying Tensions/Incompatibilities (The "Jointly Impossible" section):**
      *   *Tension 1: Global Hamiltonian vs. Local Irreversibility.* If everything is unitary/Hamiltonian, entropy is constant globally. The 2nd Law only emerges via coarse-graining or tracing out the bath. A theory claiming the 2nd Law holds *trajectory-by-trajectory* for the *global* system conflicts with Liouville's theorem.
      *   *Tension 2: Measurement Cost vs. Erasure Cost.* If measurement creates correlation (entanglement), does breaking that correlation cost energy? Some accounts say measurement costs nothing, others say breaking the correlation (resetting) costs. If you treat the correlation as physical, "erasure" is just decoupling.
      *   *Tension 3: Individual Trajectories vs. Averages.* Landauer's principle is often stated as an average. Fluctuation theorems allow violations in single trajectories. A theory demanding strict adherence on *every* single run conflicts with stochastic thermodynamics.

  5.  **Evaluating Standard Accounts (The "Where they crack" section):**
      *   *Szilard (Measurement Cost):* Cracks because measurement *can* be done reversibly (quantum nondemolition, etc.). It conflates acquiring info with resetting the sensor.
      *   *Landauer-Bennett (Erasure Cost):* Strongest classical account. Cracks on *why* erasure costs. Is it the logic or the physics? Also struggles with quantum correlations (if the memory is entangled with the system, erasure can actually *extract* work, violating the naive bound).
