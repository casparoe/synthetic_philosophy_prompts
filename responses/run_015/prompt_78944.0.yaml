  2.  **Deconstruct Keynes's Position (for the procedure):**
      *   *Probability is logical:* It's the degree of rational belief relative to specific evidence ($P(h|e)$).
      *   *Weight of Evidence ($V$):* Distinct from probability. You can have high probability based on flimsy evidence (low weight) or moderate probability based on massive evidence (high weight).
      *   *Uncertainty:* When evidence is insufficient to form *any* numerical probability (non-measurable uncertainty), only qualitative comparisons are possible.
      *   *Convention:* Market prices often reflect convention rather than fundamental probability (Beauty Contest).
      *   *Action:* Low weight + high uncertainty = precautionary principle or refusal to act/quantify.

  3.  **Drafting the Procedure (The "Keynesian Risk Protocol"):**
