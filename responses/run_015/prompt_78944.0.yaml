answer: |-
  This procedure prevents you from lying with numbers by forcing a separation between the likelihood of an event and the completeness of your evidence, requiring trustees to explicitly approve when you refuse to calculate a probability.

  ### The Keynesian Risk Protocol (KRP)

  **Timebox:** 5 Days (3 days evidence, 1 day scoring, 1 day committee prep)
  **Owners:** Risk Team (Steps 1–5), Investment Committee (Step 6)

  **Step 1: Proposition Lock (Day 1)**
  Write the specific question as a binary or ternary statement.
  *   *Rule:* No vague trends. Must be testable.
  *   *Example:* "Counterparty X defaults by Date Y" not "Counterparty X is risky."
  *   *Output:* A single sentence defined as $h$ (hypothesis).

  **Step 2: Evidence Base Catalogue (Day 2–3)**
  List every piece of data used to judge $h$. Divide into two columns: "Hard Data" (past frequencies, contractual terms, regulatory capital) and "Judgment" (expert opinion, geopolitical narrative, analogies).
  *   *Rule:* If it isn't written down or observable, it goes in "Judgment."
  *   *Output:* A signed inventory of $e$ (evidence).

  **Step 3: Weight of Evidence Scoring (Day 4)**
  Assign a "Weight" score (A, B, or C) to the evidence base. This is not about how likely $h$ is, but how much relevant data you have.
  *   **Weight A (High):** Extensive historical data, stable environment, direct observables. (e.g., mortality tables, short-term liquidity).
  *   **Weight B (Medium):** Some data, but relies on analogies or stable assumptions that could break. (e.g., 5-year credit cycles).
  *   **Weight C (Low):** Unique event, structural break, no historical precedent, relies mostly on narrative. (e.g., geopolitical war, 30-year climate shifts).
  *   **Trustee Sign-off 1:** The Committee must acknowledge the Weight Score before seeing any probability.

  **Step 4: The Numeracy Gate (Day 4)**
  Determine if a number is permitted based on Weight and Method.
  *   *If Weight A:* You may use frequency statistics to generate a number.
  *   *If Weight B:* You may use a range (e.g., 10–20%) but must cite the analogy used.
  *   *If Weight C:* **No numbers allowed.** You must output a ranking (High/Medium/Low) or a comparison ( "More likely than X, less than Y").
  *   *Rule:* Symmetry arguments (e.g., "it's either yes or no, so 50%") are forbidden unless physical symmetry exists (like a coin).

  **Step 5: Convention Check (Day 5)**
  Review any market prices used in Step 2 (e.g., CDS spreads, bond yields).
  *   *Question:* Is this price based on fundamental data or what other dealers think?
  *   *Action:* If the market is thin or panicked, discount the price as evidence. Mark it as "Convention" not "Data."
  *   *Output:* A note on whether market prices were treated as facts or opinions.

  **Step 6: Final Output & Sign-off (Day 5)**
  Select the deliverable based on Step 4.
  *   *Option 1 (Number):* Probability % + Weight Score.
  *   *Option 2 (Ranking):* Relative risk order + Weight Score.
  *   *Option 3 (Null):* "Judgment Suspended." Used when Weight is C and no valid analogy exists.
  *   **Trustee Sign-off 2:** The Committee signs off on the *format* of the answer. They must agree to accept a Ranking or Null output instead of demanding a number.

  ---

  ### Application to Exposures

  #### Exposure 1: Energy Transition Bite (This Decade)
  *   **Step 1 (Proposition):** "Global carbon pricing exceeds $100/ton by 2030."
  *   **Step 2 (Evidence):** Current policy drafts (Hard), IPCC scenarios (Judgment/Model), historical policy rollout speeds (Hard), geopolitical stability (Judgment).
  *   **Step 3 (Weight):** **Score C.** No historical precedent for a global coordinated economic shift of this speed. Evidence is mostly narrative and model-based.
  *   **Step 4 (Numeracy):** **Gate Closed.** Weight C forbids numbers. Symmetry arguments (either it happens or it doesn't) are rejected.
  *   **Step 5 (Convention):** Market pricing of green assets is treated as Convention (speculative sentiment), not Data.
  *   **Step 6 (Output):** **Ranking.** "Risk is ranked Higher than 2020 pandemic impact, Lower than 2008 GFC."
  *   **Trustee Action:** Sign off on accepting a Ranking instead of a probability % for strategic asset allocation.

  #### Exposure 2: Counterparty Bank Survival (18 Months)
  *   **Step 1 (Proposition):** "Bank X fails to meet capital requirements or defaults by [Date 18 months out]."
  *   **Step 2 (Evidence):** Quarterly regulatory filings (Hard), CDS spreads (Convention/Data mix), deposit concentration (Hard), management tenure (Hard).
  *   **Step 3 (Weight):** **Score B.** Good data on bank failures exists, but 18 months is a specific window where liquidity shocks are hard to predict.
  *   **Step 4 (Numeracy):** **Gate Open (Range).** Weight B allows a range based on peer default frequencies adjusted for specific ratios.
  *   **Step 5 (Convention):** CDS spreads are marked as "Convention" if liquidity is thin; adjusted downward if market is panicking without fundamental cause.
  *   **Step 6 (Output):** **Number with Warning.** "Probability 2–5% (Weight B)."
  *   **Trustee Action:** Sign off on the Weight B classification, acknowledging the data could become obsolete quickly.

  #### The Null Case (When to Hand Nothing)
  If Step 3 yields a **Weight C** and Step 4 finds no valid analogy (e.g., "Will a specific AI regulation ban our trading algorithm by next Tuesday?"), the procedure mandates **Option 3 (Null)**.
  *   **Deliverable:** A one-page memo stating: "The evidence base is insufficient to form a rational belief. We suspend judgment."
  *   **Action:** The fund must treat the exposure as unmeasurable. Risk management shifts from *pricing* the risk to *reducing* the exposure (precautionary principle) or holding extra capital buffers without assigning a probability to the loss.
  *   **Trustee Sign-off:** Trustees must sign that they understand "No Number" is not a failure of the team, but a factual statement about the world.

  ---

  ### Limitations and Where I Am Dressing Up Hunches

  1.  **The Weight Score is Subjective:** Step 3 asks you to score evidence A, B, or C. There is no formula for this. I am dressing up my team's intuition about "how much we know" as a formal score. A confident junior analyst might score a C as a B. You must audit this scoring personally.
  2.  **The Numeracy Gate is Arbitrary:** The rule that Weight C forbids numbers is a policy decision, not a mathematical truth. Keynes argued against it, but your trustees might still demand a number. Enforcing this requires you to lie to them about what the protocol allows if they push back.
  3.  **Convention Check is Circular:** In Step 5, deciding if a market price is "Convention" or "Data" relies on your view of the market. If you think the market is wrong, you label it Convention. If you think it's right, you label it Data. This step protects you from blaming the market later, but it doesn't objectively solve the problem.
  4.  **What This Can't Do:** This procedure cannot predict black swans. It cannot tell you *what* to do, only how confidently you can speak about what you know. It also cannot protect you if the trustees refuse to sign off on "Uncertainty" and demand a number anyway; in that case, the procedure breaks, and you are back to faking it.
