answer: |-
  # TAXONOMY OF ASSISTED DYING POSITIONS
  **Starting Point:** The "Easy Case" (Competent, Terminal, Uncontrolled Pain, Repeated Request).
  **Premise:** Everyone agrees *something* is owed to this patient. The tree sorts views based on *why* it is owed and *what* satisfies the debt.

  ### Q1: Is *actively ending life* a permissible way to pay what is owed?
  *   **NO** → Go to **Q2**.
  *   **YES** → Go to **Q3**.

  ### Q2: (If No) Is the prohibition *moral* (about life) or *professional* (about medicine)?
  *   **Moral** → **LEAF 1: Sanctity-of-Life Absolutism**
      *   *Awkward Commitment:* Must prioritize the abstract value of biological life over the concrete relief of the person living it.
  *   **Professional** → Go to **Q2b**.
      *   **Q2b: Does *palliative sedation* that foreseeably hastens death violate this professional boundary?**
          *   **YES** → **LEAF 2: 'Medicine Has Fixed Ends' (Strict Integrity)**
              *   *Awkward Commitment:* Must distinguish morally between turning off a ventilator and turning up morphine, even if death is identical.
          *   **NO** → **LEAF 3: Terminal-Sedation/Double-Effect Only**
              *   *Awkward Commitment:* Relies on the physician's *intent* rather than the *outcome* to determine moral permissibility.

  ### Q3: (If Yes) Is the permission grounded in the patient's **Will** (Choice) or **State** (Condition)?
  *   **WILL** → Go to **Q4**.
  *   **STATE** → Go to **Q5**.

  ### Q4: (If Will) Must the authorization come from a *currently competent* self?
  *   **NO** (Past self binds present self) → **LEAF 4: Autonomy-Only View**
      *   *Awkward Commitment:* Must permit a 29-year-old with depression or a past-self via advance directive to end a life the current-self might value.
  *   **YES** (Current competence required) → **LEAF 5: Competence-Contingent Autonomy**
      *   *Awkward Commitment:* Must deny the demented patient who previously requested death, even if their current contentment is a symptom of the disease.

  ### Q5: (If State) Must the medical condition be *terminal*?
  *   **YES** → **LEAF 6: Terminal-Illness Restriction**
      *   *Awkward Commitment:* Must draw an arbitrary moral line between a patient with 7 months to live and one with 7 years of identical suffering.
  *   **NO** → Go to **Q6**.

  ### Q6: (If State + Non-Terminal) Is 'unbearable suffering' a **Snapshot** (current state) or a **Trajectory** (contextual/avoidable)?
  *   **SNAPSHOT** → **LEAF 7: Pure Mercy View**
      *   *Awkward Commitment:* Must accept a suffering claim even if the suffering is caused by treatable depression or lack of social support (burden).
  *   **TRAJECTORY** → **LEAF 8: Disability-Rights/Trajectory View**
      *   *Awkward Commitment:* Must paternalistically overrule a patient's claim of 'unbearable' suffering by arguing their social/medical context makes it 'avoidable'.

  ***

  ### FLAGS & NOTES FOR DISCUSSION

  **Inseparable Leaves (In Practice):**
  *   **Sanctity (Leaf 1) vs. Integrity (Leaf 2):** Both forbid active euthanasia. They only separate if the seminar discusses *why* it is forbidden (God/Nature vs. Professional Role). In a secular clinical setting, these often collapse into the same "No."

  **Unoccupied/Unstable Combinations:**
  *   **Trajectory View (Leaf 8) + Autonomy-Only (Leaf 4):** *Incoherent.* If suffering is socially constructed/avoidable (Trajectory), it is unclear why a mere Request (Autonomy) overrides the duty to fix the context first. Few hold this combination.
  *   **Terminal Restriction (Leaf 6) + Pure Mercy (Leaf 7):** *Unclaimed.* If mercy is the goal, the "terminal" constraint is hard to justify (why let the non-terminal suffer?). If the terminal constraint is held, the view usually collapses into Leaf 6.

  **The "Snapshot/Trajectory" Problem:**
  *   This split (Q6) sorts the **Refusal of Palliation** case.
  *   **Snapshot:** Patient refuses palliation → Suffering is real → Mercy permitted.
  *   **Trajectory:** Patient refuses palliation → Suffering is avoidable → Mercy denied (Disability View).
  *   *Note:* This is where most seminar disagreement lands, not on the "Easy Case."
