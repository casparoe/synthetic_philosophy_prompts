      *   *Demonic/Irrational:* If the AI overrides "do not kill" based on an opaque function, Aquinas calls this a defect in reason or a malicious will (if it had one). It's not a "higher teleology"; it's a corruption of teleology.
      *   *The Breakdown:* The analogy breaks on *Authority* and *Ontology*. God owns life; humans/algorithms don't. God is Goodness Itself; an objective function is just math.

  6.  **Drafting the Response (Iterative refinement):**

