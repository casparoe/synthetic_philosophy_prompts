answer: |-
  Here is the prep sheet you asked for, written as if I were sending this to you the night before the talk so you can read it through once and let it settle. You need to expect the formal decision theorist to strike first and hardest because their objection targets the truth of your core mechanism rather than its normative implications. They will say that your convergence claim relies on assumptions about demand stability and inventory policy consistency that real-world supply chains do not satisfy, and that your probabilities about threshold-crossing are no better grounded than the pivot probabilities you claim to be avoiding. Your reply should be that you are not modeling a specific supply chain but offering a structural description of any threshold-based system, and that even if the exact convergence point varies, the expectation of difference remains non-zero over time unlike the standard view. The soft spot here is that you do beg the question on stability; if demand fluctuates wildly or policies change, the deferral might never cash out, so you should concede that your view requires a minimum of institutional stability but argue that this is a plausible assumption for mature markets like meat. This objection has real force and you cannot wave it away, so do not be defensive about the math; admit the idealization but insist it captures the relevant causal structure.

  Next comes the senior consequentialist who will argue that you have invented a problem to solve because expected-value reasoning already handles lumpy cases by weighting the tiny probability of being pivotal against the huge harm, meaning your diachronic reply adds complexity without normative gain. You should reply that the standard view relies on astronomically small probabilities that are psychologically and practically inert, whereas your view offers a robust expectation of difference over time that agents can actually reason with. The soft spot is that you risk conceding that the expected value is identical in both cases, just described differently, so you must emphasize the epistemic advantage of your view rather than claiming a difference in final value. This objection is damaging because it undermines the motivation for your project, but you can survive it by framing your view as fixing the epistemic access problem rather than the normative calculus.

  The political philosopher will press you on whether focusing on individual causal chains reinforces the ideology that consumption is the primary site of politics, thereby letting institutions and regulators off the hook for structural injustice. Your reply should be that acknowledging individual causal efficacy does not exclude institutional duties but rather complements them, and that showing individuals are not causally impotent removes a barrier to demanding structural change. The soft spot is that your view might inadvertently suggest individual abstention is sufficient, so you should concede that your account is compatible with and perhaps even supports stronger regulatory duties since it shows individual actions do aggregate. This objection has significant force in a mixed department, so do not dismiss it as outside the scope; explicitly link your causal story to the political project.

  You should also expect the Kantian to ask why the size of the difference you make should bear at all on what you owe anyone, suggesting that if an act is wrong it is wrong regardless of supply chain mechanics. Your reply is that you are addressing the specific inefficacy objection which is causal in nature, not providing a full theory of duty, and that showing causal difference removes a major excuse agents use to avoid duty. The soft spot is that you might appear to concede that without causal difference there is no duty, which undermines your non-causal account of voting, so clarify that causal difference is sufficient but not necessary for duty. This objection is less damaging than the previous three because it targets the framing rather than the mechanism, but you must be careful not to sound like a reductionist.

  The applied ethicist with effective-altruism sympathies will want to know what any of this implies for what we should tell people to do and whether the diachronic story makes individual offsetting or corporate campaigning look like the better intervention. Your reply should be that your view supports individual abstention as causally effective but does not rank it against other interventions, leaving that to empirical cost-effectiveness analysis. The soft spot is that if your view makes individual action look less urgent than systemic change, you might undermine the motivation for abstention, so you should emphasize that causal efficacy is a prerequisite for moral urgency even if not the only factor. This objection is manageable but requires you to avoid overclaiming the practical implications of your theoretical work.

  There is a consistency objection regarding your concession on the one-shot legal threshold case, where you argue that no causal reply works and duty must be grounded non-causally. The challenger will ask why meat purchasing is not also a one-shot threshold case where your individual act is negligible without others, and why you treat the two differently. Your reply is that meat markets have inventory and temporal extension allowing for deferral, whereas votes are counted once and discarded, making the causal structures genuinely distinct. The soft spot is that the distinction relies on the institutional design of voting rather than the metaphysics of causation, so you should concede that if voting systems were designed differently your causal account might apply there too. This objection is moderate in damage but tests the coherence of your three-case taxonomy.

  You will likely face the metaphysical question you encountered at your home department about whether threshold-crossing is a causal notion at all, or merely a description of a sequence of events. Your reply should be that causation in complex systems is often mediated by rules and thresholds, and that deferring a threshold is a genuine causal contribution to the outcome. The soft spot is that this invites a deep metaphysical rabbit hole you cannot win in ten minutes, so you should concede that the metaphysics are complex but insist that for practical moral reasoning the causal claim holds. This objection has less force than the decision theory objection but can consume your Q&A time, so keep your answer short and pragmatic.

  Finally, there is the question you are hoping nobody asks, which is the charge that your deferral reply does not answer the inefficacy objection but relocates it, since whether any harm is ever averted still depends on whether enough other people abstain, meaning your own act is supposedly still inefficacious unless it is joined. However, I think the question you should actually be dreading is the formal decision theorist objection because if your convergence claim is mathematically unsound, your entire diachronic reply collapses, whereas the relocation objection can be met by arguing that individual efficacy is partial rather than all-or-nothing. For the relocation question, your reply is that inefficacy claims usually assert zero difference, and your view shows non-zero difference over time, which is sufficient to ground duty even if collective action is also required. The soft spot is that you might be forced to admit that individual duty is weaker than commonly thought, so you should concede that individual action is necessary but not sufficient for solving the problem. This objection is philosophically sticky but less damaging than the empirical challenge to your model.

  I am about eighty percent confident in this read of the audience because the profiles you gave are distinct and their theoretical commitments usually generate predictable objections, but the mixed nature of the department means cross-contamination of arguments is possible. The one claim in this prep sheet I am least sure of is the reply to the political philosopher, because linking individual causal efficacy to structural justice is theoretically delicate and might sound like co-optation rather than complementarity if you do not phrase it precisely.
