answer: |-
  You have spotted something real, and your intuition is sharper than your roommate's on this specific point. You are describing two different stages of decision-making that often get lumped together, but philosophers and psychologists do carve them out separately.

  Here is the breakdown of what is happening, the names for it, and how it differs from satisficing and lying.

  ### 1. The Names
  Your roommate is talking about **Satisficing** (a term coined by Herbert Simon). This describes the *search process*: you look until you find something that meets your threshold, then you stop.

  What you are describing with your cousin is **Post-Decision Dissonance Reduction** (in psychology) or **Adaptive Preference Formation** (in philosophy).

  *   **Psychology:** This falls under **Cognitive Dissonance Theory** (Leon Festinger). Specifically, it is **Choice-Supportive Bias**. Once a decision is made, the brain perceives the chosen option as more attractive and the rejected options as less attractive to reduce the mental discomfort of wondering "what if."
  *   **Philosophy:** This is often discussed as **Adaptive Preferences**, famously analyzed by Jon Elster under the label **"Sour Grapes"** (from the Aesop fable). This is when an agent unconsciously scales down their desires to match what is feasible or what they have already committed to.

  ### 2. Is it just part of Bounded Rationality/Satisficing?
  No. This is the crucial distinction.

  *   **Satisficing** is a **strategy of selection**. It explains why you stop looking. It assumes your criteria (the "bar") are fixed *during* the search.
  *   **Adaptive Preferences/Dissonance Reduction** is a **mechanism of justification**. It explains why your criteria change *after* the search is over.

  In your cousin's case, he didn't just satisfice (pick the first car that met the mileage/price bar). He engaged in **preference reconstruction**. If it were pure satisficing, he would admit, "Yeah, the other car has better mileage, but I already bought this one and I don't want the hassle of trading it in." Instead, he actually changed his internal valuation of trunk space. He didn't just stop looking; he rewrote history to make the search unnecessary.

  Philosophers of action treat this separately because satisficing is about *rational limits* (I don't have time to check every car), whereas adaptive preferences are about *psychological protection* (I need to feel good about my choice).

  ### 3. How is it different from "lying to yourself"?
  This is the tricky part, and philosophers do distinguish them based on **conscious access**.

  *   **Lying (Self-Deception):** Implies a level of awareness. You know the trunk size doesn't matter, but you tell yourself it does to feel better. There is a "deceiver" part of the mind and a "deceived" part.
  *   **Rationalization/Dissonance Reduction:** This is usually **unconscious**. Your cousin isn't actively thinking, "I will now pretend to care about the trunk." His brain automatically adjusts the weight of that criterion to align with reality. He genuinely *believes* the trunk matters now.

  In philosophy, this is often called **non-akratic preference change**. It's not that he is weak-willed or lying; it's that his preferences are endogenous (shaped by the situation) rather than exogenous (fixed before the situation).

  ### Summary
  Your roommate is right that people **satisfice** (they stop searching early). But you are right that people also **rationalize** (they warp the criteria after the fact).

  Philosophers definitely carve this out separately. Satisficing explains the **economy of effort** in decision-making. Adaptive preferences/Dissonance reduction explains the **stability of the self** after the decision. Your cousin isn't just saving time on shopping; he's protecting his ego from regret.
