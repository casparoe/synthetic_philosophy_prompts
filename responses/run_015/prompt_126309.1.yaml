  me and my roommate were fighting about decision making again lol. she keeps saying people are just satisficing, yknow, picking the first thing that hits a good-enough bar and stopping. but i keep noticing this weird twist. like, my cousin bought a car that was 'fine' because it had good mileage and was cheap, then six months later he learned about another model that was also cheap with even better mileage. instead of going 'damn i should have waited', he suddenly decided the other car's trunk was too small, but he never cared about trunk space when he was actually shopping. and then he did the same thing with an apartment - picked one that was 'good enough' for rent and location, then found out about a cheaper one near by, and suddenly said the first one was closer to the bus line... which he never mentioned before. it's like the bar for 'good enough' doesn't just stay fixed, it warps after the fact to protect the choice you already made. is there an actual name for this? like is it part of bounded rationality or is it its own thing? and how is it different from just lying to yourself? i definately don't want a reading list, just whether philosophers have carved this out separately from regular satisficing.
