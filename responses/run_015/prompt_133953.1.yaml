answer: |-
  # Q&A Prep Sheet: Strategic Forgetting & Mnemonic Labor

  **Core Concession to Make Up Front:**
  Start by conceding that **individual victim-memory rights are not equivalent to collective state policy.** You are not arguing that victims should be silenced or that individuals shouldn't remember. You are arguing that *state-enforced collective remembrance* as a default moral obligation collapses under the weight of digital permanence and competing political goods. Make this distinction early to disarm the "you're silencing victims" attack.

  ---

  ### 1. The "Who Decides?" Objection (Most Damaging)
  **They'll say:** "You're talking about 'strategic' forgetting, but history shows that 'strategic forgetting' is almost always decided by the perpetrators, not the victims. In Argentina, the *Punto Final* laws weren't moral pruning; they were impunity. If you grant the state the moral authority to decide what to forget, aren't you just handing a tool to the oppressor?"

  **Your Reply (2 mins):**
  "That's the central risk, and I agree it's the greatest danger. But my argument isn't for *state-imposed amnesia*; it's for recognizing that *natural* forgetting is gone, so we must be conscious of the *cost* of total retention. Currently, we have a default of 'remember everything' which creates mnemonic overload, allowing bad actors to drown out signal with noise. My claim is that communities need the agency to curate, not just hoard. If the decision-making process isn't democratic and victim-centered, then yes, it's oppression. But the solution isn't to mandate total memory; it's to democratize the curation. We need to admit that keeping every record accessible is a political choice that favors those with the resources to navigate archives, not the victims."

  **Where it's soft:** You're relying on "democratic curation" which is vague. If they press on *mechanisms* of who curates, you don't have a concrete institutional answer.

  ### 2. The Historian's Impunity Objection
  **They'll say:** (From the Rwanda/Argentina experts) "You're treating memory as an abstract good, but in transitional justice, memory is evidence. In Rwanda, *gacaca* courts relied on collective testimony. If you normalize 'strategic forgetting' as a moral option, you erode the evidentiary basis for justice. Forgetting isn't just 'moving on'; it's destroying the case file."

  **Your Reply (2 mins):**
  "I'm distinguishing between *archival preservation* and *collective memory*. I am not arguing for destroying evidence. The digital age means the evidence is safe in a server. The 'moral move' I'm discussing is about *salience*, not existence. We can keep the records sealed but stop demanding they be the center of civic ritual forever. In Argentina, the struggle wasn't about whether records existed, it was about whether society could function without being held hostage by the trauma of the past. Strategic forgetting is about lowering the *temperature* of memory, not burning the library. We need to separate legal justice (which needs records) from civic culture (which needs to breathe)."

  **Where it's soft:** Historians know that without *public* memory, legal records gather dust and lose political potency. The line between "lowering temperature" and "losing political will" is thin.

  ### 3. The "Archive ≠ Memory" Objection
  **They'll say:** "You're conflating digital storage with collective memory. Just because a file exists on a server doesn't mean it's in the 'collective memory.' Collective memory is what we actively recall. Digital archives don't force us to remember; they just sit there. So your premise that digital tech forces us to remember is false."

  **Your Reply (2 mins):**
  "Actually, digital archives change the *accessibility* cost. In a pre-digital world, forgetting was the default because retrieval was hard. Now, retrieval is instant. This means any atrocity is always one click away from re-entering the public sphere. This creates a 'potential memory' that is always active, always weaponizable. The labor I'm talking about is the cognitive load of knowing it's all there, always retrievable. It changes the psychological landscape of the society. We are living in a glass house where every stone is cataloged. That changes how we walk, even if we aren't looking at the catalog every second."

  **Where it's soft:** "Psychological landscape" is hard to measure. They can argue that people ignore archives all the time, so the "load" is negligible.

  ### 4. The "Dreaded" Monument Analogy (Your Specific Worry)
  **They'll say:** "You claim digital forgetting requires active 'mnemonic labor,' implying this is new. But monuments, museums, and holidays also require massive maintenance labor, funding, and political will. Stone doesn't last forever without money. So what's the difference? Why is digital suppression uniquely burdensome compared to maintaining a memorial?"

  **Your Reply (2 mins):**
  "The difference is *decay vs. suppression*. A monument naturally decays; if you stop caring, it crumbles. That's passive forgetting. Digital records do not decay. To make a digital record 'forgotten,' you have to actively delete, encrypt, or de-index it. It fights against entropy. With a monument, the moral choice is to *fund* remembrance. With digital, the moral choice is to *fund* oblivion. That flips the ethical vector. It is psychologically and bureaucratically harder to destroy information than to let it rot. This creates a bias toward retention that didn't exist with stone. We are fighting physics with stone; we are fighting code with digital."

  **Where it's weakest:** They can counter that de-indexing is actually *easier* and cheaper than maintaining a physical memorial (which needs guards, repairs, land). You're arguing digital is "stickier," but physically it's more fragile to deletion.

  ### 5. The Margalit Scaling Objection
  **They'll say:** "Margalit argues that 'thick relations' generate memory obligations. You say this doesn't scale to the state. But why not? If the state is the guarantor of rights, and memory is a right for victims, doesn't the state inherit that obligation? Why does the relation become 'thin' just because it's collective?"

  **Your Reply (2 mins):**
  "Because 'collective memory' is a metaphor, not a literal mind. A state cannot 'remember'; it can only enforce rituals. When Margalit talks about memory, he talks about caring about the other. A state cannot care. When we scale that to the collective, 'remembrance' becomes performance, not care. Enforcing that performance becomes coercive. I'm arguing that at the collective level, the 'ethics of memory' transforms into an 'economics of attention.' We have limited civic attention. If we force it all onto past atrocities, we neglect present injustices. Margalit works for families; for states, we need a utilitarian calculus of civic focus."

  **Where it's soft:** Political philosophers love to argue that states *can* have moral agency. You're dismissing state agency too quickly for a political philosophy room.

  ### 6. The Reparations Precondition Objection
  **They'll say:** "Memory is the precondition for reparations. If you forget the scale of the atrocity, you can't calculate the debt. Strategic forgetting sounds like a way to cap the bill."

  **Your Reply (2 mins):**
  "Again, distinguish between *accounting* and *culture*. We need accurate accounting for reparations. That's data. But we don't need that data to be the defining feature of national identity for three generations. You can pay a debt without building a museum on every corner. Strategic forgetting allows the *transaction* of justice to close, so the *relationship* can move forward. If memory is permanently weaponized to demand endless reparations without closure, it becomes a cycle of grievance, not justice."

  **Where it's soft:** "Closing the transaction" is offensive to victims who view the harm as intergenerational. Sounds like you want to "pay them off and shut up."

  ### 7. The Democratic Deliberation Objection
  **They'll say:** "Democracy relies on a shared past to deliberate about the future. If we fragment memory strategically, we lose the common ground necessary for democratic agreement. We end up with competing truth bubbles."

  **Your Reply (2 mins):**
  "Currently, we have the opposite problem. We have a 'shared past' that is actually a battleground where every faction uses the same archives to prove the other is a Nazi. Total memory fuels polarization because everyone finds evidence for their outrage. Strategic forgetting is about agreeing on a *canonical* narrative for civic purposes, while allowing archives to exist for specialists. It's about reducing the surface area of conflict. We need less shared memory to function, not more. We need shared *rules*, not shared *trauma*."

  **Where it's soft:** Normative claim that "less memory = less conflict" is empirically shaky. Sometimes remembering prevents recurrence.

  ### 8. The "Slippery Slope" Objection
  **They'll say:** "If we accept that forgetting is moral in case X (atrocity), what stops it in case Y (corruption scandal) or Z (political defeat)? You're giving a moral cover for convenience."

  **Your Reply (2 mins):**
  "The limit is the 'Victim Veto.' Strategic forgetting at the collective level should never override the direct wishes of the primary victims. If the victims demand remembrance, the state must provide the space. My argument applies when the *second and third generations* of the collective are being held hostage by the memory demands of the past, or when the state uses memory to perpetuate conflict. The slope is stopped by centering the direct victims' voice, not the state's convenience."

  **Where it's soft:** What if the victims are dead? What if the victims disagree among themselves? (e.g., some want peace, some want justice). You haven't solved the representation problem.
