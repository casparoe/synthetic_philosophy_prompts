answer: |-
  In large, mobile, and relatively anonymous societies, guilt is the morally preferable central emotion to shame. Guilt targets specific acts and invites repair; shame targets the self and demands exclusion. However, a culture cannot directly will this shift. Commanding citizens to "feel guilt, not shame" misfires because emotions are responses to contexts, not switches. Instead, communities must indirectly alter the practices that scaffold each emotion.

  Consider a middle school deciding how to handle misbehavior. If administration chooses public exposure—scolding a student before peers—it leverages shame. This relies on a stable audience of classmates who will remember the stigma. In a mobile society, however, such stigma detaches from the act and attaches to the identity, hindering growth. Conversely, private repair tasks scaffold guilt. By requiring the student to fix the specific disruption, the institution signals that the act was wrong, but the actor is redeemable. Crucially, this protects bystanders. Public shaming teaches peers that humiliation is a valid tool of power; private repair teaches them that harm requires restitution.

  A local newsroom faces a similar architectural choice. Coverage emphasizing the character and standing of the offender—mugshots, perp walks—invites shame. This assumes a community that can permanently ostracize the deviant, a dependence on a stable audience that exists in villages but not cities. In fluid societies, this creates permanent outcasts who cannot reintegrate. Reporting that emphasizes the nature and consequences of the act scaffolds guilt. It isolates the harm from the person. This distinction matters for reparability: shame says "you are bad," offering no path forward; guilt says "you did bad," offering a path to restitution. The newsroom cannot injunction readers to forgive, but it can redesign coverage to focus on harm rather than identity.

  Finally, an online community deciding on moderation protocols faces the starkest test. Visible pile-ons are shame engines optimized for anonymity. They rely on an unstable, infinite audience to diminish the self. Because the audience is transient, the shame does not result in reintegration but in exile. Private prompts inviting correction scaffold guilt. They treat the violation as a specific act amenable to fixing. Because online audiences are too large and transient to sustain the stable relationships shame requires, pile-ons often devolve into performative cruelty rather than moral correction. Private moderation respects the limits of anonymous interaction, focusing on behavioral adjustment rather than social destruction.

  In all three settings, direct injunctions to feel differently fail because they ignore the ecological niche of the emotion. Shame requires a stable, knowing audience to function morally; guilt requires only an internal standard and a mechanism for repair. When institutions design for publicity and permanence, they invite shame. When they design for privacy and reparability, they invite guilt.

  **Reflexive Conclusion**
  My case rests on the assumption that reintegration is always the highest moral good. This is weakest when addressing severe, predatory violations where safety outweighs redemption. If evidence showed that shame-based exclusion was necessary to protect vulnerable community members from high-risk offenders—particularly where legal systems fail—I would revise my verdict. In contexts where acts reveal enduring dangerousness rather than corrigible errors, shame's defensive function may surpass guilt's reparative promise.
