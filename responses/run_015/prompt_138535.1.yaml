answer: |-
  I considered a strict sequential filter (fail step one, stop), a weighted scorecard system (points for severity and regret), and a "regret-first" approach (prioritizing the claimant's preference). I picked the "Two-Gate + Escalation" model because it respects the legal "AND" requirement while giving nurses a safe off-ramp for messy mismatch cases where biology and environment blur. I dropped the Scorecard for being too slow for 20-minute reviews and the Strict Sequential for failing to capture the nuance of environment-mismatch claims.

  ***

  ### 1. The 20-Minute Procedure

  This procedure is designed to be run by a nurse with a clipboard and a timer. It splits the legal definition into two gates. You must pass both to approve. If you get stuck in the grey zone, you escalate.

  **Step 1: The Body Check (Policy Part A)**
  *   **Question:** Is there a specific body system (sleep, hearing, metabolism, mood regulation) performing below its design standard, regardless of *why* it started?
  *   **Naturalism Marker:** This is the Boorse-ish bit. We are looking for a factual deviation from typical function, not whether the job is fair.
  *   **Pass:** Clinical evidence (bloods, sleep study, audiogram) or consistent clinician notes showing a function is impaired.
  *   **Fail:** Normal variation, temporary tiredness, or a normal reaction to external stress (e.g., crying because workload is impossible is a working alarm system, not a broken one).
  *   **Stop Rule:** If **Fail**, decision is **No**. Do not proceed.
  *   **Escalation:** If the evidence is ambiguous (e.g., "age-related" vs. "pathological"), tick "Unclear Mechanism" and kick to the human panel. Do not decide this yourself.

  **Step 2: The Regret Check (Policy Part B)**
  *   **Question:** If we could magically fix the workplace tomorrow (change shifts, quiet the office, update the tools), would you still want this specific limitation fixed?
  *   **Normativist Marker:** This is the values bit. It filters out people who are fine with their traits vs. people who suffer from them, and it filters out people who only want money vs. people who want health.
  *   **Pass:** Claimant says, "Yes, I want my hearing back even if I don't work," or "I want my metabolism fixed even if I change jobs."
  *   **Fail:** Claimant says, "I'm fine, my boss just pushed me," or "If you move me to days, I'm perfect, so I don't care about the insomnia itself."
  *   **Stop Rule:** If **Fail**, decision is **No**.
  *   **Escalation:** If the claimant seems confused, pressured by a partner, or has clearly adapted to a bad situation ("I'm used to it"), tick "Unclear Preference" and kick to the human panel.

  **Step 3: The Mismatch Sanity Check**
  *   **Question:** If Step 1 and 2 are Yes, is the dysfunction *only* visible in this specific job?
  *   **Pragmatism Marker:** This is where we stop theorizing and make a call.
  *   **Rule:** If the body is damaged (Step 1) and they regret the damage (Step 2), it counts as a medical condition **even if** a different job would fix it. The policy protects the person, not the job fit.
  *   **Decision:** **Yes.**

  ***

  ### 2. What to Write When You Don't Know

  Your appeal note needs to be honest. The union reps on the panel can smell evasion. Use these templates when the procedure hits a wall.

  *   **When there's no agreed reference class (e.g., is this "old" or "broken"?):**
      *   *Write:* "We cannot determine if this function is failing species-typical standards because medical consensus varies on age-related decline. We are escalating this as a values question: does this employer treat aging as a disability?"
  *   **When there's no known mechanism (e.g., symptoms exist, tests are normal):**
      *   *Write:* "Claimant reports functional failure, but clinical measures are within normal range. We cannot confirm Policy Part A without objective evidence of system failure."
  *   **When the Regret Clause is murky (e.g., adaptive preference):**
      *   *Write:* "Claimant states they are 'fine,' but history suggests they have adapted to harmful conditions over many years. We cannot verify if this preference is authentic or survival-based. Escalating for panel review."

  ***

  ### 3. Worked Applications

  **Case A: The Night-Shift Guard (52, insomnia, pre-diabetic)**
  *   **Step 1 (Body):** Pass. Metabolism and sleep regulation are objectively failing (pre-diabetic bloods, chronic insomnia). This is a biological dysfunction regardless of cause.
  *   **Step 2 (Regret):** Pass. Would he rather not have pre-diabetes if the workplace were arranged differently? Yes. Metabolic damage is unwanted even if he switches to day shifts.
  *   **Step 3 (Mismatch):** It is a mismatch (night shift caused it), but Step 1 and 2 are met.
  *   **Decision:** **Yes (Medical Condition).**
  *   **Why the Bosses Will Hate This:** This ruling admits that the *work schedule itself* created a compensable medical condition. It opens the door for every night-shift worker with weight gain or sleep issues to claim medical leave rather than just "flexible working." It turns a rostering issue into a liability issue. Do not soften this: the procedure forces a Yes because the biological damage is real and unwanted.

  **Case B: The Overworked Analyst (31, crying, broken sleep)**
  *   **Step 1 (Body):** Fail. Crying and stress sleep in response to 80-hour weeks is a normal human alarm system functioning correctly, not a failure of species-typical function. The handbook confirms this.
  *   **Step 2 (Regret):** Fail. If the workload were arranged differently (40 hours), the symptoms would vanish. She does not regret a "condition"; she regrets the workload.
  *   **Decision:** **No (Route to Flexible Working).**
  *   **Note:** Even if the nurses feel sympathetic, Policy Part A is not met. There is no internal dysfunction.

  **Case C: The Hearing Loss (47, age-related)**
  *   **Step 1 (Body):** Pass. Ears are failing to do what ears are supposed to do (hear frequencies). The policy says "supposed to do," not "typically do for age."
  *   **Step 2 (Regret):** Pass. He would rather hear better even in a quiet room.
  *   **Decision:** **Yes (Medical Condition).**
  *   **Note:** This is standard. Bosses might grumble about cost, but it's defensible.

  ***

  ### 4. Limitations and Blind Spots

  **The Boring Failure Mode:**
  Claimants will game the Regret Clause. They will learn to say, "Yes, I would still want this fixed even if I won the lottery and never worked again," because they know it gets them paid leave. Your nurses will know this is happening but will have no way to prove it without violating privacy. You will have to accept some false positives as the cost of doing business.

  **The Structural Blindness:**
  This procedure is structurally blind to the fact that *the workplace might be the disease vector*. By focusing on "something in the person is failing" (Policy A), we individualize the problem. In Case A, we treat the guard's metabolism, not the night-shift roster. The procedure fixes the worker's status, not the toxic environment. It makes medicine the cleanup crew for bad management.

  **The Regret Clause Coherence:**
  You are right to suspect the Regret Clause is incoherent. It assumes preferences exist independently of context. But people adapt. A worker might say "I don't regret my hearing loss" because they've built a life around being deaf, or "I don't regret my stress" because they think suffering is noble. The clause tries to find a "true" preference underneath the social reality, but there isn't one. When you apply Step 2, you aren't measuring a fact; you are judging whether their values match yours. When that happens, you must escalate. Do not pretend it's a clinical judgment.
