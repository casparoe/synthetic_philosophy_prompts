prompt: |-
  You are a philosopher of medicine who has also spent ten years doing paid consulting for insurance panels and workplace-health committees — you know the naturalism/normativism fight (the Boorse-ish biostatistical "it's a failure of species-typical function" line, the Wakefield-ish harmful-dysfunction hybrid, and the more full-on normativist view that disease is basically whatever a society disvalues and wants medicine to deal with), and you also know how these questions actually get settled in a committee room at 4pm on a Thursday. Please think carefully about this one, and before you write anything final, brainstorm three or four genuinely different ways to shape the procedure, then tell me in two sentences which one you picked and why you dropped the others.

  My setup: I work in the accomodations and medical-leave office of a big employer, about 30,000 staff. Around 40 claims a month land on my desk, and for each one my team — me plus two occupational-health nurses with no philosophy training at all — has to decide whether this person's thing counts as a "medical condition" for our purposes. If yes, they get paid medical leave and mandatory workplace accomodation, and we're not allowed to second-guess the schedule their clinician signed off on. If no, it gets routed to "flexible working," which is discretionary, unpaid, and the line manager can just refuse it. So the classification does real work either way, and people argue with us constantly. Realistically we get twenty minutes per claim, and whatever we decide has to be defensible in a one-page plain-language note, because appeals go to a lay panel of three people, two of whom are union-elected employees who will absolutely read the note out loud at us.

  Here's the wrinkle that keeps causing our biggest arguements. Legal handed us one sentence to apply and it doesn't match any of the textbook views I've read about: a condition counts if (a) something in the person is failing to do what it's supposed to do, or is doing it badly, AND (b) the person would rather not have it, and would still rather not have it if the workplace were arranged differently. I've started calling (b) the Regret Clause, and legal is clear that it's meant to be a second independent filter, not just a restatement of (a).

  The case type that generates most of the fights I want you to solve is what I've started calling environment-mismatch stuff: nothing in the person is obviously broken, and they'd be more or less fine in a different job, a different building, or a different shift pattern, but they're not fine in this one. Night-shift security guards whose sleep and metabolism have come apart; people who cannot think at all in an open-plan office; a forklift driver whose colour vision is completely adequate for daily life but not for the new colour-coded signalling system we installed last year. That kind of thing.

  What I want from you:

  1. A procedure my nurses can actually run in twenty minutes: the questions in order, what counts as a good enough answer to each one, and — this matters most — where the procedure simply stops with a No, versus where it kicks the decision upstairs to a human because what's left is a values question rather than a fact question. At each step, please be explicit about which parts are real conceptual content carried over from the naturalism/normativism debate and which parts are just us making a call because we have to decide something before Friday. I want to know exactly where the theory runs out and we're on our own.

  2. For every question, what the nurse is supposed to write down when they can't answer it: no agreed reference class (age-matched or species-typical-and-young — we go back and forth on this constantly), no known mechanism, no way to tell whether the person's stated regret is a real preference or just them having adapted to something crappy. The Regret Clause is the worst offender here, because maybe half our claimants tell us they're fine with the thing and it's their partner or their manager who pushed them into the claim.

  3. Worked applications to three cases. (A) A 52-year-old night-shift security guard, chronic insomnia, weight gain, pre-diabetic bloods, no other findings. (B) A 31-year-old analyst, six weeks of broken sleep and crying at work, says it's the 80-hour weeks; our handbook explicitly states that reactions to workload and staffing levels are not medical conditions. (C) A 47-year-old with ordinary age-related hearing loss asking for accomodated equipment and meeting rooms. One of these three is going to come out in a way my bosses will hate — don't soften it to make them happy. Tell me which one, show me why the procedure forces that answer, and then tell me whether the honest response is to overrule the procedure in that case, to change the policy, or to just accept that we now do it this way.

  4. Finally, and briefly: what can't this procedure do? I mean both the boring failure modes, like a determined claimant working out how to game the Regret Clause, and the deep one, if there is one — the thing this whole framework is structurally blind to no matter how well we run it. Also flag honestly if you think the Regret Clause is doing something incoherent, because I have a suspicion that it is and I'd rather hear it from you than from the appeals panel.

  Don't give me a reading list or point me at papers or tell me who said what in which year — we're not going to read them and I can't look anything up from here. Just the reasoning, and keep it in the same plain language I'd have to put in the appeal note.
