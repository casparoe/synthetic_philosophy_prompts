prompt: |-
  I maintain an internal benchmark of Bongard-style few-shot visual-reasoning tasks: each task is twelve small SVG panels of black shapes on white, six in class A and six in class B, and a model sees all twelve plus a held-out panel it must classify. I review about thirty submitted tasks a month, and my recurring problem is not that the intended rules are wrong but that twelve panels never determine the rule the author had in mind. A size or stroke-width correlate fits the same data; a purely extensional rule naming the six figures in class A fits the same data; a rule stated in terms of grid position or drawing order fits the same data, since the model sees the whole grid at once. Please write a decision procedure my annotators can run on a submission to return accept, accept-with-required-edit, or reject: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the question to me because it is a judgment about what our user community finds natural rather than a fact about the panels. Constraints: the annotators have no philosophy background and about twenty minutes per task, edits have to be drawable in SVG, and I sign off on anything that is not a no.

  I care about the translation more than the theory. The point that a finite sample is consistent with arbitrarily many rules, including indexical, disjunctive and grue-style ones, has to survive into the procedure; the metaphysics of natural kinds can go. Concretely, I want the annotator to be able to name competitor rules, to build a minimal pair of panels that separates the intended rule from each competitor and to reject the task when no such pair can be drawn, to check that the A-rule and the B-rule are genuine complements rather than two independent rules with panels falling in the gap between them, to check that the intended rule is not cheaper to state as a correlate of size, colour, stroke, pixel density or grid position, and to check that it does not need a vague threshold or a tolerance setting to apply. Say which distinctions you kept, which you dropped and what dropping them costs, which steps are judgment calls dressed up as procedure, and where the procedure will misfire.

  Apply it to three tasks I have on my desk. One: class A figures are symmetric under 180-degree rotation and class B figures are not, but every A figure happens to contain an even number of separate components and every B figure an odd number. Two: class A panels contain a prime number of separate components (2, 3, 5, 7, 11, 13) and class B panels a composite number (4, 6, 8, 9, 10, 12). Three, and this is the one I expect you to rule against and I least want to give up: class A panels contain a triangle, class B panels contain a circle. We have shipped five tasks of that third shape, they are our most reliable human-verified items, and I need to know whether the procedure rejects them, what specifically it requires instead, and whether the five shipped ones have to be pulled.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a decision procedure for annotators to evaluate Bongard-style visual reasoning tasks (12 SVG panels: 6 Class A, 6 Class B + 1 test).
      *   **Problem:** 12 panels are underdetermined. Many rules (correlates, extensional lists, indexical rules) fit the data but aren't the intended rule.
      *   **Output:** A step-by-step procedure (Accept, Accept-with-Edit, Reject).
      *   **Constraints:**
          *   Annotators: No philosophy background, ~20 mins/task.
          *   Edits: Must be drawable in SVG.
          *   Sign-off: User (requester) signs off on non-rejects.
          *   Core Requirement: The "underdetermination of theory by data" (finite sample consistent with many rules) must survive in the procedure, but without the metaphysics.
          *   Specific Checks: Name competitor rules, build minimal pairs (counterexamples), check complementarity (no gaps), check for cheaper correlates (size, color, position, etc.), check for vague thresholds.
      *   **Deliverables:**
          1.  The Decision Procedure.
          2.  Meta-analysis: What distinctions were kept/dropped, costs of dropping, judgment calls disguised as procedure, where it misfires.
          3.  Application to three specific tasks (Symmetry vs. Component Count, Prime vs. Composite, Triangle vs. Circle).
      *   **Specific Anxiety:** Task 3 (Triangle vs. Circle) is expected to be rejected by the procedure, but it's a high-performing human-verified item. The user needs to know the consequences.

  2.  **Drafting the Decision Procedure:**

      *   *Philosophy:* Needs to be operational. Instead of asking "Is this natural?", ask "Can you break it?"
      *   *Step 1: The Correlate Check (Cheaper Rules).* Before testing the deep rule, check for superficial features. If a simpler rule fits, reject or edit.
      *   *Step 2: The Extensional/Indexical Check.* Can I just list the 6 images? Can I say "Top Left"? If so, reject.
      *   *Step 3: The Minimal Pair (Crucial Step).* This addresses underdetermination. Annotator must propose a *new* SVG panel that fits the intended rule but breaks the competitor rule (or vice versa). If they can't draw it, the rule isn't robust.
      *   *Step 4: Complementarity/Gaps.* Do A and B cover the space? Or is there a "Class C" that fits neither? Bongard problems usually imply a binary classification.
      *   *Step 5: Thresholds.* Is the rule "larger than" or "more than 3"? If it relies on vague quantification without a clear boundary in the data, flag it.
      *   *Decision Logic:*
          *   Fail Step 1, 2, 4, 5 -> Reject (or Edit if easy).
          *   Fail Step 3 -> Reject (Rule not determined).
          *   Pass All -> Accept.
          *   Pass with minor SVG tweaks -> Accept-with-Edit.

      *   *Refining for Constraints:* 20 minutes is tight. The procedure needs to be a checklist, not an essay. "Name competitor rules" needs to be specific (e.g., "List 3 alternative explanations"). "Build minimal pair" needs to be concrete ("Draw 1 panel").

  3.  **Meta-Analysis (The "Why" and "Cost"):**

      *   *Kept:* Underdetermination (via Minimal Pairs), Correlates, Complementarity, Thresholds.
      *   *Dropped:* "Naturalness" (too subjective), "Intentionality" (can't read author's mind), "Aesthetic Unity".
      *   *Cost:* We might reject tasks that humans find easy but are logically ambiguous (Task 3). We might accept tasks that are logically tight but cognitively hard.
      *   *Judgment Calls:* Determining if a correlate is "cheaper" or "salient." Determining if a gap is "significant."
      *   *Misfire:* The procedure assumes annotators can draw SVGs quickly and think like logicians. 20 minutes might be too short for the Minimal Pair step.

  4.  **Applying to the Three Tasks:**

      *   **Task 1 (Symmetry vs. Component Count):**
          *   Intended: 180-degree Rotation Symmetry.
          *   Competitor: Even vs. Odd component count.
          *   Check: Can we draw a Symmetric shape with Odd components? Yes (e.g., a single circle). Can we draw an Asymmetric shape with Even components? Yes (e.g., two different squares).
          *   Verdict: Accept-with-Edit. The current panels are confounded. The author *must* replace at least one A and one B panel to break the component count correlation.
      *   **Task 2 (Prime vs. Composite):**
          *   Intended: Prime count vs. Composite count.
          *   Competitor: "Small number" vs. "Large number"? Or "Even/Odd" (mostly)? 2 is even, 3 odd, 5 odd... 4 even, 6 even, 8 even, 9 odd, 10 even, 12 even. Parity is mixed.
          *   Competitor: "Contains 1?" No, 1 is neither.
          *   Check: Is this a "cheaper" rule? Counting is hard for vision models, but logically distinct.
          *   Gap: What about 1 component? Or 14? The rule implies a universe of numbers.
          *   Verdict: Reject (or heavy Edit). Counting distinct components in SVGs is prone to ambiguity (touching vs. overlapping). Also, the "1" case is undefined. It requires defining the universe of discourse.
      *   **Task 3 (Triangle vs. Circle):**
          *   Intended: Presence of Triangle vs. Presence of Circle.
          *   Competitor: "Pointy vs. Round", "3 vertices vs. 0 vertices", "Angular vs. Curved".
          *   Underdetermination: A panel could have *both*. A panel could have *neither* (square).
          *   Complementarity: If Class A = Has Triangle, Class B = Has Circle. What if a panel has a Square? It fits neither. This violates the binary assumption unless the rule is "Has Triangle (and no Circle)" vs "Has Circle (and no Triangle)".
          *   Correlates: Stroke width? Size?
          *   Verdict: **Reject** based on strict procedure. The classes are not complements. There is a "Gap" (Squares). There is an "Overlap" (Triangle inside Circle).
          *   *Addressing the User's Anxiety:* The procedure *will* flag this. To save it, the definition must be tightened (e.g., "Dominant shape is..." or "Only shape is..."). The shipped items likely rely on human priors (mutual exclusivity) that aren't in the SVG data.

  5.  **Refining the Output Structure:**

      *   **Part 1: The Procedure.** (Checklist style, clear stop conditions).
      *   **Part 2: Meta-Analysis.** (Kept/Dropped, Costs, Judgment Calls, Misfires).
      *   **Part 3: Task Application.** (Specific verdicts and required edits).
      *   **Part 4: The Task 3 Dilemma.** (Specific advice on the shipped items).

  6.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 20 minutes enough to draw SVG minimal pairs?
      *   *Fix:* Provide primitive shapes or a sandbox tool recommendation. Or allow "sketch description" if SVG is too slow, but the prompt says "edits have to be drawable in SVG". I must enforce the SVG constraint but suggest using a library of parts.
      *   *Critique:* Task 3 is the big emotional hurdle.
      *   *Fix:* Be firm. The procedure rejects it *as stated*. Explain *why* (Gap/Overlap). Explain how to fix it (make rules exhaustive and mutually exclusive). Acknowledge that human intuition fills the gap, but the model (and the logic) cannot.
      *   *Critique:* "Cheaper rule" is subjective.
      *   *Fix:* Define "cheaper" operationally: "Can be computed by a single pass filter (color, bbox, pixel count) without object segmentation?"

  7.  **Final Polish:** Ensure tone is professional, direct, and respects the "translation over theory" constraint. Make sure the "underdetermination" point is central to the Minimal Pair step.

  *(Self-Correction on Task 2)*: Prime vs Composite. 1 is neither. If the panels never show 1, is it a gap? Yes, logically. But practically? If the rule is "Count components", 1 is a valid count. If the classes don't cover 1, the classification function is partial. For a binary classifier, this is a risk. I will flag this as a "Gap" issue.

  *(Self-Correction on Task 3)*: The user says "Class A contain a triangle, Class B contain a circle". This is not "A=Triangle, B=Circle". It's "Contains". So a panel with a Triangle and a Square fits A. A panel with Circle and Square fits B. A panel with Triangle AND Circle fits *both*. A panel with only Square fits *neither*. This is a logical mess for a binary classifier. The procedure must catch this.

  8.  **Finalizing the Text:** (Drafting the response based on these thoughts).
answer: |-
  ## Part 1: The Decision Procedure (The "Bongard Stress-Test")

  **Time Limit:** 20 Minutes
  **Tools:** SVG Editor (with primitive library), Timer
  **Goal:** Determine if the 12 panels force the intended rule, or if a simpler/alternative rule fits equally well.

  ### Step 1: The "Cheap Correlate" Scan (3 Minutes)
  **Action:** Look at the 12 panels. Ignore the shapes. Look only at metadata and low-level features.
  **Checklist:**
  1.  **Pixel Density:** Do all A panels have significantly more black pixels than B panels?
  2.  **Bounding Box:** Are all A panels taller/wider than B panels?
  3.  **Stroke/Color:** Is there a consistent difference in line thickness or shade (even if both are "black")?
  4.  **Grid Position:** Are all A panels on the left/top and B on the right/bottom? (Check if the rule depends on *where* the panel is in the 12-grid, not *what* is in it).
  5.  **Component Count:** Count distinct disconnected blobs. Is there a simple split (e.g., A=Even, B=Odd; A>3, B≤3)?

  **Stop Condition:** If **YES** to any of the above, and this feature is *not* the intended rule:
  *   **Verdict:** **Reject** (unless the author can swap panels to break the correlate within 5 mins).
  *   **Reason:** "Low-level correlate confounds intended rule."

  ### Step 2: The "Extensional & Indexical" Check (2 Minutes)
  **Action:** Try to write a rule that names the specific images rather than a property.
  **Checklist:**
  1.  **List Rule:** Can the rule be "The six specific images shown in column 1"? (Trivial, but check if they are just variations of one seed).
  2.  **Indexical Rule:** Can the rule be "The panel in position (row, col)"? (Already checked in Step 1, but check if the *content* depends on position, e.g., "The shape touches the left border").

  **Stop Condition:** If the panels are so similar within classes that they look like noise variations of a single template:
  *   **Verdict:** **Accept-with-Edit**.
  *   **Requirement:** Author must diversify the visual appearance of Class A and Class B while keeping the rule constant.

  ### Step 3: The Minimal Pair Challenge (10 Minutes) **(CRITICAL)**
  **Action:** This tests underdetermination. You must attempt to break the intended rule by drawing **one** new SVG panel.
  **Process:**
  1.  Identify the **Intended Rule** (e.g., "Rotation Symmetry").
  2.  Identify the strongest **Competitor Rule** found in Step 1 (e.g., "Even Component Count").
  3.  **Draw Panel X:** Create an SVG that satisfies the **Intended Rule** but violates the **Competitor Rule**.
      *   *Example:* Draw a shape that is Rotation Symmetric (Intended) but has an Odd number of components (Breaks Competitor).
  4.  **Draw Panel Y:** Create an SVG that satisfies the **Competitor Rule** but violates the **Intended Rule**.
      *   *Example:* Draw a shape that has Even components (Competitor) but is Not Symmetric (Breaks Intended).

  **Stop Condition:**
  *   If you **cannot** draw Panel X or Panel Y because the properties are mathematically linked (e.g., "Has 3 sides" vs "Is a Triangle"): **Pass**.
  *   If you **can** draw them, and they look clearly like they belong in the opposite class of the current set: **Pass**.
  *   If you **can** draw them, but the author's current 12 panels *fail to include* any such distinguishing cases (i.e., the current 12 are all confounded):
      *   **Verdict:** **Accept-with-Required-Edit**.
      *   **Requirement:** Author must replace at least two panels (one A, one B) with versions similar to your Panel X and Panel Y to disentangle the rules.
  *   If the Intended Rule relies on a threshold (e.g., "Large" vs "Small") and you cannot draw a clear boundary case:
      *   **Verdict:** **Reject**.
      *   **Reason:** "Rule requires vague tolerance; not formally decidable."

  ### Step 4: The Complementarity & Gap Check (5 Minutes)
  **Action:** Check if the rules cover the logical space of possible SVGs.
  **Checklist:**
  1.  **Overlap:** Is there a valid SVG that fits *both* Class A and Class B rules? (e.g., A="Has Triangle", B="Has Circle" -> A panel with both fits both).
  2.  **Gap:** Is there a valid SVG that fits *neither*? (e.g., A="Has Triangle", B="Has Circle" -> A panel with only a Square fits neither).
  3.  **Negation:** Is Class B simply "Not Class A"? (Ideal). Or are they two independent positive rules?

  **Stop Condition:**
  *   If **Overlap** or **Gap** exists:
      *   **Verdict:** **Accept-with-Required-Edit**.
      *   **Requirement:** Author must rewrite the rule definition to be mutually exclusive and exhaustive (e.g., change "Has Circle" to "Has No Triangle" OR ensure the generation script prevents Overlap/Gap panels).
  *   If Rules are clean complements: **Pass**.

  ### Final Triage
  *   **All Steps Pass:** **ACCEPT**.
  *   **Edits Required (Steps 1, 3, 4):** **ACCEPT-WITH-REQUIRED-EDIT**. (Send back to author with your SVG panels as examples).
  *   **Fundamental Failure (Step 3 impossible, Step 4 unfixable, Step 1 incurable):** **REJECT**. (Send to User for final sign-off).

  ***

  ## Part 2: Meta-Analysis of the Procedure

  ### Distinctions Kept vs. Dropped
  *   **Kept:** **Underdetermination.** Step 3 forces the annotator to acknowledge that the 12 panels do not speak for themselves. By requiring the drawing of a "counter-possible" panel, we make the logical space visible.
  *   **Kept:** **Correlates.** Step 1 operationalizes "cheaper rule" as "computable without object segmentation."
  *   **Dropped:** **Naturalness.** We do not ask "Is this a natural kind?" We ask "Is there a gap?" This drops the metaphysical baggage but costs us the ability to filter out tasks that are logically sound but cognitively alien (e.g., "Contains a shape with ASCII value 65").
  *   **Dropped:** **Author Intent.** We do not interview the author. We treat the 12 panels as the only evidence. If the panels support a cheaper rule, we assume the cheaper rule, regardless of what the author *meant*.

  ### Costs of Dropping
  *   **False Negatives on "Human Easy" Tasks:** Tasks that rely on strong human priors (like Task 3 below) will fail the Complementarity Check. Humans assume mutual exclusivity where logic does not. The procedure treats this as a bug; humans treat it as context.
  *   **SVG Burden:** Requiring annotators to draw SVG minimal pairs in 20 minutes is high-friction. If they lack drawing skill, they may reject valid tasks because they cannot *construct* the counterexample, not because it doesn't exist.

  ### Judgment Calls Dressed as Procedure
  *   **"Cheaper" in Step 1:** Deciding if "Component Count" is cheaper than "Symmetry" is subjective. For a CNN, pixel density is cheaper. For a symbolic solver, count is cheaper. The procedure assumes "Cheaper = Less Segmentation," which is a bias.
  *   **"Clear Boundary" in Step 3:** Determining if a threshold is "vague" is subjective. Is "Area > 500px" vague? Technically no, but visually it might be indistinguishable from "Area > 480px". The annotator must judge visual discriminability, not just logical decidability.

  ### Where the Procedure Will Misfire
  *   **The "Family Resemblance" Case:** If Class A is "Birds" (drawn abstractly) and Class B is "Non-Birds", Step 3 will fail because you cannot draw a minimal pair for "Bird-ness" without listing features. The procedure will Reject valid Wittgensteinian categories.
  *   **The "Complex Conjunction" Case:** If the rule is "Red AND Round OR Blue AND Square", Step 4 (Complementarity) might flag a Gap (e.g., Red Square), but the rule is valid. The procedure prefers simple binary splits over complex boolean logic.

  ***

  ## Part 3: Application to Your Three Tasks

  ### Task 1: Symmetry (A) vs. Asymmetry (B)
  *   **Confound:** Component Count (A=Even, B=Odd).
  *   **Step 1 (Correlate):** **FAIL.** Component count is a cheaper rule than rotational symmetry.
  *   **Step 3 (Minimal Pair):**
      *   *Can you draw Symmetric + Odd?* Yes (e.g., A single circle).
      *   *Can you draw Asymmetric + Even?* Yes (e.g., Two different squares side-by-side).
  *   **Verdict:** **ACCEPT-WITH-REQUIRED-EDIT**.
  *   **Instruction to Author:** The current panels are logically confounded. You must replace at least one A panel with a symmetric shape having an odd component count (e.g., a single symmetric blob), and one B panel with an asymmetric arrangement of even components. The current set is indistinguishable from a parity task.

  ### Task 2: Prime Count (A) vs. Composite Count (B)
  *   **Step 1 (Correlate):** **PASS.** No obvious pixel/size correlate.
  *   **Step 3 (Minimal Pair):** **PASS.** You can draw a panel with 1 component (Neither) or 14 components (Neither).
  *   **Step 4 (Complementarity):** **FAIL.**
      *   *Gap:* The number 1 is neither prime nor composite. If a panel has 1 component, the classifier cannot assign it.
      *   *Gap:* The number 0? (Empty panel).
      *   *Visual Ambiguity:* "Separate components" in SVG is hard to define (touching vs. overlapping vs. grouped).
  *   **Verdict:** **REJECT**.
  *   **Reason:** The classification function is partial. It does not cover the universe of possible inputs (specifically count=1). To fix, the rule must be "Count is in Set P" vs "Count is in Set C", and Sets P and C must be exhaustive for the expected range (e.g., 1-15). Also, "Component" needs a strict SVG definition (e.g., "distinct `<path>` elements").

  ### Task 3: Triangle (A) vs. Circle (B)
  *   **Step 1 (Correlate):** **PASS.** (Assuming stroke/size are controlled).
  *   **Step 3 (Minimal Pair):** **PASS.** You can draw a Square (Neither) or a Triangle inside a Circle (Both).
  *   **Step 4 (Complementarity):** **FAIL.**
      *   *Overlap:* A panel containing *both* a triangle and a circle satisfies both rules.
      *   *Gap:* A panel containing only a square satisfies neither rule.
  *   **Verdict:** **REJECT** (by strict procedure).
  *   **Instruction to Author:** Your classes are not mutually exclusive or exhaustive.
      *   *Fix 1 (Exhaustive):* Class A = "Contains Triangle", Class B = "Does Not Contain Triangle". (Discard Circle requirement).
      *   *Fix 2 (Exclusive):* Class A = "Contains Triangle AND No Circle", Class B = "Contains Circle AND No Triangle". (Panels with both or neither are invalid inputs).
  *   **Regarding the 5 Shipped Items:**
      *   **Do they need to be pulled?** Logically, **Yes**. If your model encounters a panel with a Square, or a Triangle+Circle, its behavior is undefined by the rule.
      *   **Pragmatically:** If your user community treats "Triangle vs Circle" as a standard dichotomy (ignoring squares/combos), the *procedure* is stricter than your *users*.
      *   **Recommendation:** Do not pull them yet, but **flag them as "Context-Dependent"**. They rely on a human prior that "In this game, shapes are mutually exclusive." The procedure exposes that this prior is not in the data. If you keep them, you must document that "Other shapes are out-of-distribution."

  ***

  ## Part 4: The Task 3 Dilemma (Specific Advice)

  You asked specifically about Task 3 because you expect the procedure to rule against it, and you least want to give it up.

  **The Procedure's Verdict:**
  The procedure **must** reject Task 3 as currently defined ("A=Triangle, B=Circle"). It is not a binary partition of the space. It is two overlapping subsets. A model trained on this will hallucinate a decision boundary for Squares that does not exist in the rules.

  **Why You Don't Want to Give It Up:**
  Humans solve this instantly because we assume *pragmatic exclusivity*. If I say "I want the Apple" and "You take the Orange", you don't ask "What if there is a Banana?" You assume the universe of discourse is {Apple, Orange}. Your users are applying this Gricean maxim to the SVG panels.

  **The Cost of Keeping It:**
  1.  **Model Confusion:** If you fine-tune a model on this, and then test it on a Square, the loss will spike. It breaks the "closed world" assumption most VQA models rely on.
  2.  **Benchmark Integrity:** If Task 3 is in your benchmark, you are measuring "Ability to guess the author's pragmatic constraints" rather than "Visual Reasoning."

  **The Compromise (How to save the 5 shipped items without lying):**
  You do not need to pull them if you reclassify the **Task Metadata**, not the panels.
  1.  **Change the Rule Definition:** Do not state "A=Triangle, B=Circle". State: "A=Contains Triangle (and no other primary shape), B=Contains Circle (and no other primary shape). **All panels contain exactly one primary shape.**"
  2.  **Add a Constraint:** Add a Step 0 to your procedure: "Universe Constraint." The author must declare if the 12 panels represent the *entire* universe of allowed inputs.
      *   If **Yes**: Task 3 is valid (Squares are impossible by definition).
      *   If **No**: Task 3 is invalid (Squares are possible, rule fails).

  **Final Recommendation:**
  Run the procedure as written. It will reject Task 3. **Accept the rejection.** Then, use the "Universe Constraint" loophole above to reinstate it *only if* the author certifies that no other shapes exist in the generation script. This preserves the logical rigor of the procedure while acknowledging the pragmatic reality of your dataset. If the 5 shipped items do not have that certification, they are technically bugs, and you should plan to deprecate them in the next version to avoid long-term technical debt in your benchmark's logic.
