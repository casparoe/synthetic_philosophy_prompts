  hey so i'm a software engineer with basically no formal philosophy background (took one intro course in college and mostly slept through it) and me and my roomate have been arguing for months about why promises actually bind people, like morally not legally. he thinks its all about expectations and coordination—you make a promise, other people rely on it, breaking it messes up their plans, so the binding force is just protecting that reliance from harm. i think there's something weirder, like when you promise youre actually giving the other person some kind of authority over part of your future will, not just predicting you'll do the thing. anyway we want to try one of those adverserial collaboration things and actually write the statement we could both sign.

  could you draft the joint document? i want a numbered section of agreed claims—what counts as a promise, whether you need intent to be bound, whether its always wrong to break one, etc. then a disagreements table with our two positions phrased in wording we'd each accept, not strawmen—his reliance-harm view and my authority-transfer view. then the cruxes, like does the binding come from broken reliance or from this authority thing, and maybe whether you can accidentally promise something. for each crux include a concrete case we'd both agree is relevant—like if i promise to fix his laptop but replacing it is faster and better, or if i make a promise i secretly dont intend to keep—and write down what each of us would predict about it. also say if any part of this is just verbal disagreement. and please tell me exactly what argument or finding would change your mind—like a specific edge case that'd make the authority view collapse—since i want to know where this reasoning is weakest. oh and don't ask me for bibliographies, reading lists, or citations; i can't check academic sources and neither should the answer need them.
