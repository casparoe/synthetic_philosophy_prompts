      *   **Student's Hunch:** Standard cluelessness arguments assume expectations exist but are unknown/noisy (variance problem). If expectations are undefined (heavy tails), the "noise cancels out" move fails. Consequentialism becomes *incomplete* (no verdict), not just misleading. This requires a different fallback than standard ones (rules, virtues, etc.).
