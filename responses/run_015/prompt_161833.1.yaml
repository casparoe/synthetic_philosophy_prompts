answer: |-
  **TERM PAPER PROPOSAL: UNDEFINED EXPECTATIONS AND CONSEQUENTIALIST INCOMPLETENESS**

  **Research Question**
  Does the possibility of heavy-tailed utility distributions (where the expected value is undefined rather than merely unknown) render act consequentialism normatively incomplete? If so, does this incompleteness necessitate a lexical priority rule for non-consequentialist constraints, or does it force a pragmatic truncation of the utility function?

  **Problem Statement**
  Standard responses to consequentialist cluelessness (e.g., the "symmetric ignorance" defense) assume that while downstream effects are unknown, their expected value exists and noise cancels out over sufficient aggregation. This relies on the assumption of finite variance. Your core hypothesis is that for certain acts, the distribution of potential effects is heavy-tailed (Pareto with tail index $\alpha \le 1$). In these cases, the expectation integral diverges. There is no number to be clueless *about*. Consequently, the theory yields no verdict. This is not an epistemic problem but a structural incompleteness. Standard fallbacks (rules, virtues, hedging) typically serve as proxies for expected value; if expected value is undefined, these proxies lose their consequentialist anchor.

  **Methodological Stipulations**
  To ensure this is feasible within 6000 words, you must adhere to the following constraints:

  1.  **Modeling Cluelessness:** You will model cluelessness as **plain undefined expectation**, not as imprecise credence or structural uncertainty.
      *   *Reasoning:* Imprecise credence frameworks often retain defined upper/lower expectations, allowing decision rules (like Maximality) to function. Structural uncertainty is too vague for a short paper. Undefined expectation forces the "incompleteness" claim hardest: the theory literally cannot rank the acts.
  2.  **Required Formalism:** By **Week 5**, you must submit a one-page derivation showing the condition under which the expectation integral $\int u(x) dP$ diverges for a Pareto-distributed impact variable. You need to demonstrate clearly why $\alpha \le 1$ prevents the "noise cancellation" move (i.e., why the Law of Large Numbers fails here).
  3.  **Scope Control:** Do not address the St. Petersburg paradox or general infinite ethics. Focus strictly on *empirical* heavy tails in causal chains (e.g., butterfly effects with power-law magnitudes) rather than metaphysical infinities.

  **Possible Conclusions**
  Your paper should argue for one of the following, based on the normative cost of each:
  1.  **Incompleteness Thesis:** Consequentialism is incomplete for heavy-tailed acts. This requires a lexical fallback (e.g., "maximize EV where defined; otherwise follow deontological constraints").
      *   *Decision Criterion:* Does this hybrid view preserve enough consequentialist structure to remain distinct?
  2.  **Truncation Thesis:** We are justified in pragmatically truncating the tails at some horizon.
      *   *Decision Criterion:* Can this truncation be justified without smuggling in non-consequentialist values (e.g., temporal discounting)?
  3.  **Irrelevance Thesis:** Heavy-tailed distributions are empirically negligible for mundane decision contexts.
      *   *Decision Criterion:* Is there empirical evidence that $\alpha > 1$ for relevant political/social acts? (This is the weakest option; prioritize 1 or 2).

  **Risk Assessment & Failure Modes**
  *   **Mathematical Swamp:** The most likely failure is spending 3000 words explaining probability theory. The formalism is a tool, not the topic. If the math obscures the normative point, cut it.
  *   **Scope Creep:** Do not attempt to solve undefined expectation generally. Your job is to argue what consequentialists should *do* given that it exists, not to fix the math of decision theory.
  *   **Confusion of Terms:** Distinguish sharply between "infinite expectation" (St. Petersburg) and "undefined expectation" (Cauchy/Pareto $\alpha \le 1$). Conflating these will undermine the argument against symmetric ignorance.

  **Approval**
  This proposal is approved contingent on the Week 5 formalism check. Stick to the stipulation on undefined expectation; do not drift into imprecise probability unless the derivation proves impossible (unlikely).

  **Word Count Target:** 6000 words (±10%).
  **Deadline:** [Insert Date]
