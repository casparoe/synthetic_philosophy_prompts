  2.  **Evaluate the Idea (Philosophical & Technical Check):**
      *   *Is the idea sound?* Yes. The "Cluelessness" debate (Lenman, Greco, etc.) often focuses on epistemic limitations regarding distant futures. The "Expected Value" response (Greco) suggests symmetric ignorance cancels out. However, if the utility distribution has no mean (Cauchy-like or Pareto with $\alpha \le 1$), the Law of Large Numbers doesn't apply, and expectations are undefined. This is a known issue in Effective Altruism/Longtermism circles (e.g., Beckstead, Thomas, Christian Tarsney).
      *   *Is it feasible for 6000 words?* Yes, if scoped tightly. They shouldn't try to solve undefined expectation generally. They should argue for *incompleteness* and evaluate *one* specific fallback mechanism.
      *   *Which modeling stipulation to pick?* The prompt asks me to choose between imprecise credence, structural uncertainty, or plain undefined expectation.
          *   *Imprecise Credence:* Good for representing ignorance, but often collapses back to intervals.
          *   *Structural Uncertainty:* Good, but vague.
          *   *Undefined Expectation:* This is the core of the student's hunch ("no expected value to be clueless about"). It's the most mathematically precise and philosophically provocative. It forces the "incompleteness" claim hard. I will stipulate **undefined expectation via heavy-tailed utility distributions**. This avoids muddying the waters with imprecise probability frameworks which might allow for lower/upper expectations even if the precise one is undefined.
      *   *What is the "one bit of formalism"?* Defining the condition under which the expectation integral diverges (e.g., $\int |u(x)| dP = \infty$). Specifically, showing that for a Pareto distribution with $\alpha \le 1$, $E[U]$ does not exist.
      *   *What are the conclusions?* Either (1) Consequentialism is genuinely incomplete and requires a lexical priority rule, or (2) We must truncate the tails (pragmatic cutoff), which admits non-consequentialist constraints.
      *   *Risk:* Getting bogged down in the math of infinite ethics or trying to solve the St. Petersburg paradox instead of focusing on cluelessness.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be punchy. "Undefined Expectations and the Incompleteness of Consequentialism."
      *   **Research Question:** Precise. Does the possibility of undefined expected utility (due to heavy tails) render act consequentialism incomplete rather than merely epistemically opaque, and if so, what normative fallback is required?
      *   **The Problem (Why standard responses fail):**
          *   Standard "Cluelessness" (Lenman): We don't know the effects.
          *   Standard Response (Greco): Ignorance is symmetric, EV is still calculable/approximate.
          *   Student's Counter: If tails are heavy ($\alpha \le 1$), symmetry doesn't save you. The integral diverges. EV is undefined, not unknown.
          *   Why fallbacks fail: Rules/Virtues usually act as *proxies* for EV. If EV is undefined, proxies lack anchor.
      *   **Methodology/Stipulation:**
          *   Stipulate: **Plain undefined expectation**. Why? Imprecise credence often retains defined bounds; structural uncertainty is too vague. Undefined expectation forces the incompleteness claim.
          *   Formalism: Demonstrate divergence of the expectation integral for a Pareto-distributed impact variable with $\alpha \le 1$.
          *   Timing: Week 4-5.
      *   **Possible Conclusions:**
          1.  Consequentialism is incomplete; needs a lexical tie-breaker (e.g., deontological constraints).
          2.  Consequentialism requires pragmatic truncation (admitting non-consequentialist inputs).
          3.  (Less likely) Heavy tails are empirically irrelevant for mundane acts.
      *   **Risk Assessment:**
          *   Math overload.
          *   Confusing "undefined" with "infinite".
          *   Scope creep into infinite ethics (Pascalian mugging).

  4.  **Refining the Tone:**
