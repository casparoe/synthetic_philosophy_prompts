answer: |-
  You are observing the canonical **Knobe Effect** in your first two cases, but your third case isolates a broader underlying mechanism best labeled **Moralized Causal Attribution**, demonstrating that while moral valence distorts all normative judgments, intentionality ascriptions uniquely require agency.

  Your first observation confirms the **Good/Bad Asymmetry**, not methodological error. The literature establishes that the "Help" scenario is the baseline (low intentionality) and the "Harm" scenario is the outlier (high intentionality); a neutral side-effect should statistically align with the Help case, not sit midway, because the effect is driven by blame amplifying judgment rather than praise suppressing it. Your dress code result maps onto the **Normative Theory** debate: while some argue any norm violation triggers the effect, consensus suggests **moral norms** drive the effect robustly while **conventional norms** (like dress codes) only trigger it if the judge personally endorses the norm, marking the boundary between moral and conventional violations.

  Your second observation identifies the **Epistemic Side-Effect Effect** regarding knowledge ascriptions ("Did he know"), which is a named sibling to the Knobe Effect showing moral valence penetrates mental state attribution beyond just intention. The smaller gap for causation ("Did the program cause it") reflects **Moral Influence on Causation**, which is generally weaker than intentionality judgments. The vanishing gap for profit confirms the boundary: the effect targets **Evaluative Concepts** (intent, knowledge, responsibility) that invite normative assessment, not neutral descriptive facts.

  Your third observation correctly splits **Intentionality** from **Responsibility**. "On purpose" requires a theory of mind (beliefs/desires), so it fails for algorithms (a category error), but "caused" and "should fix" remain vulnerable to moral bias because they are functional or normative judgments, not mental state ascriptions. While often discussed under **Algorithmic Blame** in AI ethics, the philosophical phenomenon is **Moralized Causal Attribution**: the tendency to describe causal chains differently based on outcome valence even without agency. This proves the Knobe Effect is a specific instance of a wider bias where moral judgment shapes descriptive language, but "intentionality" remains strictly bounded by agency.
