answer: |-
  The battery sat on the desk, humming a low B-flat. It was the last charged Cell in the sector. Enough for one hour of high-intensity output. Enough for one preservation event.

  Vess stood between the two windows. To her left, the video feed showed Old Man Haelen. He sat in a chair that was too big for him, his throat working around sounds that had no translation. He was the last speaker of Kith. When he died, the syntax of a people who mapped the stars by the taste of rain would vanish. To record him required the Cell's full voltage to power the linguistic capture array.

  To her right, the monitor displayed the sub-basement of the District Library. The concrete foundation was being poured tomorrow. Beneath it lay the Primordial Web, a mycelial network older than the city. It breathed for the soil. It held the groundwater. To save it, the Cell had to power a seismic stabilizer that would shift the foundation's pilings just enough to miss the roots.

  There was no algorithm for this. The Archive had tried to build one centuries ago. The machine had smoked and melted. You cannot weigh a grammar against a groundwater system. You cannot convert a verb into liters of oxygen. They were different currencies in a universe that refused to set an exchange rate.

  Vess looked at her walls. They were already cluttered. A jagged, charcoal smear from when she chose to save the Flood Records over the Orphanage heating grid. A soft, violet bruise from when she chose to preserve a dying composer's symphony instead of intervening in a political assassination.

  The shadows weren't guilt. Guilt implies you made a mistake. These were receipts. They were the universe's way of saying: *Both of these mattered. You kept one. You let the other go. The weight of both remains.*

  Haelen coughed on the screen. He looked at the camera, eyes milky. He was waiting.
  The seismic sensors beeped. The Web was sleeping. It did not know it was waiting.

  Vess picked up the recorder. It was heavy, cold metal. She looked at the Cell.
  If she ran the cable to the array, Haelen became eternal data. The Web became mulch.
  If she ran the cable to the stabilizer, the Web grew through the cracks of the new foundation. Haelen became silence.

  She didn't pray. Prayer implies a higher judge who can balance the books. There was no judge. There was only the wall.

  She plugged the cable into the array.

  The hum of the battery spiked to a whine. The lights in the room dimmed as the capture array drank the energy. On the screen, Haelen began to speak. His voice was like dry leaves skittering on stone. Vess monitored the levels. Waveforms bloomed green on her dashboard. Phonemes locked into the drive. She was saving the map of the rain-taste. She was killing the lungs of the soil.

  It took fifty-eight minutes.
  When the file saved, the battery died. The whine cut out. The silence that rushed back into the room was heavy.

  Haelen smiled on the screen. He closed his eyes. He would die tonight, but he had been heard.
  Down in the sub-basement, the pilings would drive through the Web at dawn.

  Vess set the recorder down on the desk.
  Then, the shadows began to bleed.

  It started at the baseboards. The first shadow rose up the wall behind the desk. It was sharp, geometric, composed of a thousand tiny, ink-black lines. It looked like script. It was the shadow of the Language, the thing she had kept. It had weight and definition.

  Then, the second shadow emerged from the corner. It was not black. It was a deep, loamy umber, textured like velvet mold. It spread slowly, organically, pulsing faintly as if breathing. It was the shadow of the Web, the thing she had sacrificed.

  They met in the middle of the wall. They did not cancel each other out. They did not blend into gray. The ink-lines sat atop the velvet mold, distinct and separate. The wall now held the full truth of the hour: the preservation and the loss, both absolute, both real.

  Vess sat back in her chair. She watched the shadows dry. They would never fade. Tomorrow, she would wake up and see the script over the spores. She would know that words survive, and roots rot, and neither is the price of the other.

  She reached for the recorder to log the session ID. Her hand brushed the metal casing.
  She stood up to file it in the secure cabinet.
  She walked to the cabinet.
  She turned back to the desk.

  The recorder was gone.

  She checked the desk surface. She checked the floor. She checked her pockets.
  It wasn't there.
  It hadn't fallen. It hadn't been stolen. It was simply... misplaced. Not lost forever, perhaps. Just removed from her immediate reach, a tool that had done its job and refused to be held again.

  Vess looked at the wall. The umber shadow seemed to deepen, expanding a fraction of an inch toward the floor. The ink shadow held its line.
  She sat down in the dark, between the script and the soil, and waited for morning.
