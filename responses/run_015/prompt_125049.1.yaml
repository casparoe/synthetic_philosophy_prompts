  *Wait, one nuance:* "Misplaces the recorder." If she chooses the mycelium, she doesn't use the recorder. So misplacing it is easy. If she chooses the language, she uses it. Misplacing it implies losing the record? No, "misplaces the recorder" implies the object itself. Let's have her choose the Language (her duty), but the act of choosing the Fungus (her desire) leaves a shadow. No, she must choose *one*.
