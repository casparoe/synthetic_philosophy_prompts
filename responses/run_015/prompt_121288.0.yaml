answer: |-
  This is a strong, viable reading. You are moving from a content-based critique (theater shows vice) to a form-based critique (theater *enacts* alienation). This aligns much better with Rousseau's broader political project than the standard "theater makes us naughty" summary.

  Here is my read on your three specific concerns, followed by a few weak spots to watch out for.

  ### 1. Is the spectator/passivity framing textually supported?
  **Yes, emphatically.** You are not projecting modern media theory so much as identifying the mechanism that modern media theory later formalized.

  Rousseau explicitly contrasts the **theater** with the **public festival**.
  *   **The Theater:** People sit in the dark, silent, isolated in their boxes, consuming the emotions of others. It is a closed economy where a few perform and many watch.
  *   **The Festival:** People gather in the sun, in the public square. There are no actors; everyone is a participant. Rousseau writes that in a true republican festival, "the spectators become the spectacle."

  Your point about "simulated emotion with zero civic consequence" maps directly onto Rousseau's critique of **pity**. He argues that theater exhausts our natural pity. We cry for Hecuba or Oedipus, feel virtuous about our tears, and then leave the theater indifferent to the beggar outside. The emotion is spent on the simulation, disincentivizing real-world action. That is a structural critique of the *transaction*, not just the content.

  ### 2. Is this distinct from his broader critique of representation?
  **Yes, and it strengthens it.**
  Rousseau's political theory (specifically in the *Social Contract*) argues that sovereignty cannot be represented. You cannot elect someone to exercise your general will for you; you must do it yourself.

  *   **Standard Reading:** Theater is bad because it depicts kings and nobles, reinforcing hierarchy.
  *   **Your Reading:** Theater is bad because it rehearses the *psychological posture* of representation. It trains citizens to be comfortable with delegation. It habituates us to letting others act (the actors) while we merely judge/applaud.

  This makes your argument distinct because it focuses on **civic muscle memory**. It's not just that representation is illegitimate politically; it's that theater makes us *love* being represented. It seduces us into passivity. This bridges the gap between his aesthetics (*Letter to d'Alembert*) and his politics (*Social Contract*) without conflating them.

  ### 3. Does this make the Geneva ban more coherent?
  **It makes it internally consistent, though not necessarily "liberal."**
  If you view the ban as moral censorship, it looks like puritanical overreach. If you view it through your structural lens, the ban becomes a matter of **institutional self-defense**.

  If the Republic requires active participation to survive, and the Theater structurally trains passivity and privatizes emotion, then the Theater is not just "immoral"—it is **counter-revolutionary**. It is a rival institution that produces a different kind of subject (the private spectator) than the one the Republic needs (the public citizen).

  This framing saves you from having to defend Rousseau as a censor; instead, you present him as a radical democrat who recognizes that certain social technologies are incompatible with self-governance.

  ### Weak Spots and Refinements

  **1. The "Attention Economy" Analogy**
  *   **Risk:** This is your flashiest hook, but also the most anachronistic. Rousseau isn't worried about "attention" in the sense of cognitive bandwidth or ad revenue.
  *   **Fix:** Ground it in **economy of sentiment** or **economy of presence**. The currency isn't just "views"; it's *amour-propre*. The actor sells their personhood for applause; the audience pays with applause to validate their own taste. It's a market of vanity. If you keep the "attention economy" label, clarify that you mean it structurally (a system that extracts passive engagement) rather than technologically.

  **2. The Role of *Amour-Propre***
  *   **Risk:** You mention it, but make sure you distinguish how it works for the actor vs. the audience.
  *   **Fix:** For the actor, *amour-propre* is existential dependence on the Other (I am only what you think I am). For the audience, *amour-propre* is the pleasure of judging. The audience feels superior to the characters on stage, or feels refined for appreciating the art. This reinforces the hierarchy between "spectator" and "agent."

  **3. Don't Ignore the "Festival"**
  *   **Risk:** If you only talk about the negative (theater), your argument is half-finished.
  *   **Fix:** To prove the "passivity" point, you must contrast it with Rousseau's positive alternative: the open-air festival. This is where your argument shines. The festival is the "anti-theater." It proves that Rousseau isn't against gathering; he is against *structured separation* between performer and viewer.

  **4. The "Moral" vs. "Structural" Split**
  *   **Risk:** Rousseau does not separate morality from politics the way a modern secularist might.
  *   **Fix:** Be careful not to say "It's not about morals, it's about structure." For Rousseau, the structure *creates* the morality. The structural habituation *is* the moral corruption. Frame it as: "The corruption is not merely the depiction of vice, but the structural enactment of alienation."

  ### Verdict
  Your thesis holds together. It is textually grounded, theoretically distinct, and clarifies the political stakes of the *Letter*. It rescues Rousseau from looking like a killjoy and presents him as a critic of the **political economy of spectacle**.

  If you tighten the "attention economy" analogy to ensure it doesn't sound like you're claiming Rousseau predicted TikTok, and if you explicitly contrast the theater with the republican festival, this is a very compelling reading.
