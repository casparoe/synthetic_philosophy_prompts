      *   *Key Concept:* *Amour-propre* vs. *Amour de soi*. Theater feeds *amour-propre* (vanity, comparison).
      *   *Passivity:* Rousseau explicitly complains that theater keeps people sitting in the dark instead of being out in the public square. He talks about pity felt in the theater being a substitute for actual virtue. "We weep for the fictional heroes but ignore the suffering neighbor."
      *   *Verdict:* The "spectator/passivity" framing is *not* projection. It's central to the text. The "proto-attention economy" label is modern terminology, but the mechanism (economy of applause, visibility, simulated sentiment) is textually grounded.

