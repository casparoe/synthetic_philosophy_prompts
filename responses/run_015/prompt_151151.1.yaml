  To the Members of the Curatorial Ethics Board and the Office of the Director

  The Curatorial Ethics Board hereby issues its formal decision regarding the proposal for the permanent flagship gallery titled The Unbroken Covenant, and after careful deliberation of the submitted materials and the recorded testimony from the recent hearing, the Board recommends approval with binding curatorial conditions. This decision is not an unconditional endorsement of the proposed narrative architecture but rather a directive to proceed only upon the implementation of specific interpretive safeguards designed to preserve historical integrity while allowing for the exploration of collective memory. We recognize the ambition of the Director and the curatorial team to articulate a vision of national identity that transcends mere chronology to engage with the moral weight of inheritance, yet we also acknowledge the substantial ethical risks identified by the Board minority regarding the potential distortion of historical agency.

  The defense of the exhibition rests on the philosophically robust claim that collective identity is not merely a descriptive fact but a constructive necessity. As argued by the proponents of the proposal, a nation functions as a moral person over time only insofar as it accepts responsibility for the commitments and debts incurred by its predecessors, regardless of whether those predecessors conceptualized themselves as part of a modern republic. To deny all diachronic continuity is to risk absolving the present of obligations rooted in the past, effectively fragmenting the polity into isolated temporal silos that cannot speak to one another. The curators contend that the museum has a duty to facilitate this moral conversation, arranging artifacts from feudal estates, imperial administrations, and revolutionary committees within a single thread to demonstrate how current civic duties are the inheritances of prior actions. This view holds that narrative coherence is a legitimate curatorial tool, provided it serves the ethical end of fostering civic responsibility and acknowledging that we are bound by choices we did not personally make.

  However, the Board gives full weight to the objection that this framing risks committing a retrospective coherence fallacy, a concern that strikes at the heart of our ethical mandate to avoid deceiving the public. The objecting members argue that projecting a unified national intentionality onto populations who possessed no such self-conception is not merely a simplification but a category error that misrepresents historical reality. A peasant bound to a feudal estate in 1247 did not participate in a national covenant with the citizens of the present republic, and to arrange their artifacts as if they were contributors to a shared project implies a volition and awareness that did not exist. This approach risks collapsing radically different political regimes into an anachronistic moral person, thereby obscuring the ruptures, coercions, and exclusions that actually defined those eras. If visitors leave the gallery believing that the nation has always existed as a conscious agent pursuing a single moral end, the museum will have prioritized a comforting myth over historical truth, undermining public trust in our institution as a steward of evidence.

  The central ethical question before us is whether treating a nation as possessing diachronic moral agency is a permissible interpretive framework or a misleading fabrication. The Board concludes that it is permissible only if the distinction between historical fact and normative interpretation is made explicit to the visitor. We cannot affirm the continuity of moral obligation without simultaneously clarifying the discontinuity of political identity. Therefore, our approval is contingent upon the implementation of binding curatorial conditions that prevent the suppression of historical discontinuity while maintaining the narrative coherence required for the exhibition to function. These conditions are not suggestions but requirements that must be met before the gallery opens to the public.

  First, the museum must adopt strict labeling protocols that avoid unqualified uses of the first-person plural when referring to pre-democratic or non-republican subjects. Wall text and object labels must not state that we did this or that our ancestors believed, but rather must specify the historical actors involved, such as the feudal assembly of 1247 or the imperial administration of the nineteenth century, thereby distinguishing between the historical agents and the contemporary public. Second, the spatial design of the gallery must incorporate clear visual and temporal separations between distinct political regimes. While the narrative thread may connect them, the physical arrangement must not blur the boundaries between feudal, imperial, and republican eras; this should be achieved through distinct lighting zones, architectural breaks, or transitional spaces that signal to the visitor a shift in political ontology rather than a seamless flow. Third, mandatory contextual panels must be installed at the entrance and at key transition points within the gallery to explicitly discuss the curatorial choice to link these eras. These panels must inform the visitor that the concept of an unbroken covenant is an interpretive framework chosen by the museum to explore intergenerational obligation, acknowledging that this continuity is constructed rather than inherent, and inviting the visitor to critique the validity of this connection.

  By imposing these conditions, the Board seeks to honor the validity of the continuity defense without validating the historical inaccuracies feared by the constructivist objection. We acknowledge that the strongest argument against this exhibition is that it risks naturalizing a specific political mythology as historical fact, and our conditions are designed specifically to mitigate that risk. The museum is permitted to propose that we are bound by the past, but it must not claim that the past intended to bind us. This distinction allows the exhibition to pursue its philosophical goal of exploring inherited moral obligation while respecting the historical reality that the actors of the past lived within different conceptual universes. We trust that the curatorial team has the expertise to implement these requirements without diminishing the emotional or intellectual impact of the gallery, and we remain available to review the revised interpretive plans prior to final production.

  The Board believes that this conditional approval represents the most ethically sound path forward, balancing the need for meaningful civic narrative with the imperative of historical accuracy. We urge the Director to accept these conditions as a strengthening of the exhibition rather than a constraint, as they will ultimately deepen the visitor's engagement by inviting them to participate in the complex work of interpreting history rather than passively receiving a finished myth. Our institution serves the public trust, and that trust depends on our willingness to be transparent about the choices we make in constructing history. We look forward to collaborating with the curatorial team to ensure that The Unbroken Covenant stands as a model of ethical storytelling that respects both the complexity of the past and the intelligence of our visitors.

  Sincerely

  Chair of the Curatorial Ethics Board
  National Museum of Civic History
