answer: |-
  # Workshop Plan: The Harbor Council Deliberation

  **Session Title:** The License and The Lien
  **Duration:** 75 Minutes
  **Participants:** 16 Students (4 Groups of 4)
  **Facilitator:** Steward/Instructor

  ## I. Learning Objective
  To induce a visceral experience of the *persistence problem* (Ship of Theseus) by forcing participants to advocate for conflicting criteria of identity (material, functional, narrative) in order to secure economic rights while avoiding economic obligations. Participants will discover that their metaphysical commitments shift based on whether identity confers a benefit or a burden.

  ## II. Setup and Roles (Pre-Session)
  Print four distinct **Role Packets**. Do not distribute until Minute 5.

  **The Stake:**
  1.  **The Golden Ticket:** An indivisible, perpetual Historical Fishing License (valued at $2M/year).
  2.  **The Red Ledger:** An inherited Environmental Debt for toxic sludge dumped by the fleet between 1958–1980 (valued at $5M cleanup cost).
  3.  **The Rule:** The Harbor Council recognizes only *one* legal successor to the 1958 Cooperative. That successor gets the Ticket and the Ledger.

  **The Groups:**
  1.  **The Current Cooperative (4 Students):** They operate the fleet today. All parts are new.
      *   *Public Stance:* We are the same cooperative; we never stopped working.
      *   *Hidden Mandate:* Secure the License. If possible, argue you are a *new* legal entity to avoid the Debt.
  2.  **The Bloodline Descendants (4 Students):** Heirs of the 1958 crew.
      *   *Public Stance:* Identity lives in the people and the intent, not the wood.
      *   *Hidden Mandate:* Protect the family name from scandal (Debt). If the Debt is too high, argue the bloodline does not constitute legal identity.
  3.  **The Ghost Vessel Collective (4 Students):** They rebuilt a ship from original salvaged timbers.
      *   *Public Stance:* Identity lives in the original matter. We are the true ship.
      *   *Hidden Mandate:* Secure the License. However, you possess a private survey showing the old wood is contaminated. Accepting the ship means accepting massive personal liability.
  4.  **The Harbor Arbiters (4 Students):** Neutral judges.
      *   *Public Stance:* We must apply the Charter fairly.
      *   *Hidden Mandate:* The License expires in 24 hours. If no single successor is named, the License is voided (everyone loses), but the Debt remains attached to the "closest match."

  ## III. Minute-by-Minute Timeline

  ### 00:00 – 00:05 | Introduction & Context
  *   **Facilitator:** Read the "Steward's Statement" (your prompt's intro paragraph).
  *   **Rule:** You are in a legal hearing. Do not use words like *identity, metaphysics, ontology, or philosophy.* Use terms like *Charter, Manifest, Liability, Succession, and Lineage.*
  *   **Assignment:** Divide class into the four groups. Distribute Role Packets.

  ### 00:05 – 00:15 | Caucus & Strategy (Hidden Info Phase 1)
  *   **Task:** Groups read their **Public Stance** and **Hidden Mandate**.
  *   **Scenario:** The Council is awarding the **Golden Ticket (License)** only. The Debt has not yet been revealed.
  *   **Goal:** Prepare a 2-minute opening argument on why your group represents the true successor entitled to the License.
  *   **Incentive:** Everyone wants the License. Everyone will argue *for* continuity/identity.

  ### 00:15 – 00:35 | Deliberation Round 1 (The Rights)
  *   **Format:** Open floor debate. Arbiters manage time.
  *   **Action:** Each group presents. Arbiters ask clarifying questions.
  *   **Constraint:** Arguments must be based on the *evidence* provided in the packets (e.g., repair logs, letters).
  *   **Outcome:** Arbiters take a straw poll on who deserves the License. (Do not announce results yet).

  ### 00:35 – 00:40 | The Twist (Hidden Info Phase 2)
  *   **Facilitator:** Interrupt the session. "A sealed envelope from the Environmental Protection Agency has been opened."
  *   **Action:** Distribute **Addendum Cards** to all groups.
      *   **Content:** The **Red Ledger (Debt)** is officially attached to the successor. The $5M cleanup is immediate.
      *   **Updated Goal:** You must now argue for the outcome that best serves your **Hidden Mandate** given this new cost.
  *   **Effect:**
      *   *Current Cooperative:* May now argue they are a *new* corporation to dodge debt, even if it risks the license.
      *   *Descendants:* May argue the "spirit" survives but the "legal liability" died with the original owners.
      *   *Ghost Vessel:* May realize claiming the "original wood" makes them liable for the toxins in that wood. They might pivot to arguing they are a *replica* (no debt, but no license).
      *   *Arbiters:* Must decide if one entity can take the License while another takes the Debt, or if they are inseparable.

  ### 00:40 – 01:00 | Deliberation Round 2 (The Obligations)
  *   **Format:** Heated negotiation.
  *   **Task:** Groups must reconcile their Round 1 arguments with their Round 2 incentives.
  *   **Observation:** Watch for students contradicting their earlier metaphysical claims (e.g., "The wood doesn't matter" vs. "The wood is everything").
  *   **Facilitator Note:** Do not point out the contradictions yet. Let them sit in the inconsistency.

  ### 01:00 – 01:05 | The Verdict
  *   **Action:** Arbiters confer privately for 2 minutes.
  *   **Vote:** Arbiters announce the decision:
      1.  Who gets the License?
      2.  Who pays the Debt?
      3.  Are they the same entity?
  *   **Constraint:** They must justify the verdict using only the arguments heard in the room.

  ### 01:05 – 01:15 | Debrief & Mapping
  *   **Facilitator:** Break character. Reveal the philosophical underpinnings.
  *   **Discussion:** Map the arguments to the three continuity conditions.
  *   **Limitation Statement:** (See Section V below).
  *   **Recovery:** (See Section VI below).

  ## IV. Role Packet Contents (Summary for Facilitator)

  **1. Current Cooperative**
  *   *Evidence:* Continuous logbook showing daily operations since 1958. Receipts for all new parts.
  *   *Hidden Mandate:* Your investors will pull funding if you accept the Debt. You must argue you are the *functional* successor for the License, but a *distinct legal entity* for the Debt.

  **2. Bloodline Descendants**
  *   *Evidence:* A letter from the 1958 Captain: "The ship is the crew, not the timber."
  *   *Hidden Mandate:* Your family reputation is at stake. If the Debt is accepted, it implies your ancestors were criminals. Argue that *moral lineage* does not equal *legal liability*.

  **3. Ghost Vessel Collective**
  *   *Evidence:* Photos of the original timbers being re-installed. Bill of sale for the wood.
  *   *Hidden Mandate:* Your survey shows the old wood is saturated with toxins. If you claim to be the "Original Ship," you personally own the toxic waste. You may need to argue you are a *memorial*, not a *successor*.

  **4. Harbor Arbiters**
  *   *Evidence:* The Harbor Charter: "Succession is indivisible."
  *   *Hidden Mandate:* If you split the License and Debt between two parties, the courts will void the License. You must find *one* entity. If you fail, the port loses the fleet entirely.

  ## V. Facilitator Limitation Statement (Crucial)
  *To be read verbatim during the last 10 minutes:*

  "This simulation reproduces the tension of material versus functional continuity, but it contains a specific gap. We are debating a *Cooperative*, which is a collective agent with distributed intentionality, not merely a wooden hull. A physical object persists through space-time; a legal entity persists through *recognition* and *intent*.

  The game cannot reproduce the metaphysical weight of **corporate personhood**. In the real world, the 'Steward' (me) holds the Charter. The Charter is a speech act that sustains the cooperative's identity regardless of wood or crew. This is the 'Narrative Continuity' layer. If I burn the Charter, the Cooperative dies even if the ships sail. If I keep the Charter, the Cooperative lives even if the ships sink.

  You felt the paradox of the *object*, but the actual stewardship relies on the paradox of the *institution*. The 'Ship' is not the vessel; it is the agreement that the vessel matters. When you argued about debt, you were actually arguing about whether the *agreement* survived, not whether the *planks* survived."

  ## VI. Risk Management: Polarization and Collapse

  **Predicted Failure Point:**
  The most likely collapse occurs during **Deliberation Round 2**. The "Current Cooperative" (Functionalists) and "Ghost Vessel" (Materialists) will likely reach an irreconcilable deadlock. The Functionalists will claim the License based on work; the Materialists will claim the License based on wood. The Arbiters may freeze, fearing the "License Void" condition.

  **Symptoms of Collapse:**
  *   Repetitive arguments ("We are the workers!" vs. "We are the wood!").
  *   Arbiters withdrawing from decision-making.
  *   One group refusing to acknowledge the validity of another's evidence.

  **Recovery Strategy:**
  If the room stalls for more than 5 minutes in Round 2, the Facilitator (as Harbor Master) must intervene with a **Procedural Writ**:

  *"The Council is reminded that Identity is not a discovery; it is a designation. You are not finding the truth; you are assigning liability. If you cannot agree on who the Ship *is*, the Harbor will designate the Ship as 'Derelict.' A Derelict vessel has no License and no Debt holder—the State seizes the assets."*

  **Why this works:**
  1.  **Shifts Incentive:** It makes "No Verdict" the worst outcome for everyone (State seizure).
  2.  **Forces Pragmatism:** It forces the Functionalists and Materialists to compromise not on *truth*, but on *survival*. They may agree to merge (Shared License, Shared Debt) to avoid State seizure.
  3.  **Philosophical Payoff:** This mirrors the "Conventionalist" solution to the Ship of Theseus: Identity is determined by social/legal convention, not intrinsic properties. This sets up the final debrief perfectly without using the jargon beforehand.

  ## VII. Debrief Mapping Guide

  | Game Moment | Philosophical Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **Round 1 Arguments** | **Functional Continuity** vs. **Material Continuity** | "When you wanted the License, which definition of 'Same Ship' was convenient? Why?" |
  | **Round 2 Pivot** | **Motivated Reasoning** | "Did anyone change their definition of 'Identity' once the Debt was introduced? Was that dishonest or pragmatic?" |
  | **The Arbiters' Choice** | **Conventionalism** | "Did the Arbiters *discover* the true successor, or did they *make* a successor by choosing?" |
  | **The Shadow Reconstruction** | **Fission Problem** | "If both the Cooperative and the Ghost Vessel have a valid claim, does the original Cooperative cease to exist, or does it exist in two places at once?" |
  | **Facilitator Statement** | **Collective Intentionality** | "How does the existence of the 'Charter' change the problem compared to a regular wooden boat?" |

  ## VIII. Materials Checklist
  *   4 Role Packets (printed with distinct borders).
  *   4 Addendum Cards (for the Debt reveal).
  *   Timer (visible to all).
  *   Whiteboard (for Arbiters to track votes).
  *   Name tags (to enforce role adherence).

  **Note to Facilitator:** Your role during the 75 minutes is strictly procedural. Do not answer questions about the "truth" of the scenario. If asked, reply: "The Charter is ambiguous. That is why you are here."
