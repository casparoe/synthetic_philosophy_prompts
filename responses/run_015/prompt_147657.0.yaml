          *   *Scenario:* To get the License (Right), you must prove Identity. To avoid the Debt (Obligation), you must prove Discontinuity.
          *   *Modification:* Let's make it so the Hidden Info reveals that claiming "Identity" binds you to the Debt, but claiming "Succession" grants the License.
          *   *Better:* Give specific cards.
              *   *Cooperative:* Secretly know the Charter allows substitution *unless* environmental liability is triggered.
              *   *Descendants:* Secretly know the Original Captain sold the "name" rights separately from the "hull" rights.
              *   *Ghost:* Secretly know the reconstruction used modern glue, voiding "authenticity" claims unless they accept the debt.
              *   *Arbiters:* Secretly know the License is expiring in 24 hours.

      *   *Wait, let's simplify for flow:* The prompt wants them to switch based on Rights vs. Obligations.
          *   *Round 1:* Argue for the License (Identity = Good).
          *   *Round 2:* Reveal the Debt (Identity = Bad).
          *   *Result:* Students should flip their metaphysical stance to avoid the debt while keeping the license.

  4.  **Developing the Timeline (75 Minutes):**
      *   0-5: Intro & Setup.
      *   5-15: Role Prep (Reading hidden info).
      *   15-35: Round 1 Deliberation (The License).
