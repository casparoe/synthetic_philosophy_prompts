      *   **Goal:** Force students to inhabit the tension between material, functional, and narrative continuity as *practical commitments*, not abstract theories. No philosophical terminology until the last 10 minutes.
      *   **Format:** Simulated Harbor Council.
      *   **Roles:** Current Cooperative (Operational), Original Descendants (Material Lineage), Ghost Vessel Reps (Artifact Authenticity), Neutral Arbitrators.
      *   **Mechanics:** Hidden information (repair logs, letters) that shifts incentives/arguments regarding rights vs. obligations vs. identity. Single indivisible license + inherited debt.
      *   **Timeline:** Minute-by-minute for 75 minutes.
      *   **Debrief:** Map deliberation moments to identity problems (including "shadow reconstruction").
      *   **Limitation:** Explicitly state what the activity *cannot* reproduce (physical artifact vs. collective agent) and how the facilitator fills that gap.
      *   **Risk Management:** Predict polarization/collapse points and provide recovery strategies.
      *   **Constraint:** No bibliographies, citations, or named theorists.

  2.  **Deconstruct the Philosophical Core:**
      *   *Ship of Theseus:* Identity over time.
      *   *Variation:* The "Ghost Ship" (reconstructed from old parts) vs. The "Continuous Ship" (new parts, continuous function).
      *   *Legal/Ethical Layer:* Rights (fishing license) vs. Obligations (environmental debt). Usually, people want the rights but dodge the debts. This is the key lever for the game.
      *   *Collective Agency:* A cooperative isn't just wood; it's contracts, people, and intent. This is the gap the facilitator must address.

  3.  **Drafting the Game Mechanics:**
      *   *Students:* 16 total.
      *   *Roles:*
          *   Group A: Current Cooperative (4 students) - Focus: Function/Operation.
          *   Group B: Original Descendants (4 students) - Focus: Material/Bloodline.
          *   Group C: Ghost Vessel Collective (4 students) - Focus: Artifact/Original Matter.
