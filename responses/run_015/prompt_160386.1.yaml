prompt: |-
  I am finishing the methods chapter of my dissertation in political science, on what can legitimately be inferred from a single well-documented historical episode, and I have reached the point where a survey of positions is no longer useful to me. What I need is a specification.

  Fix the object and the purpose, because I take adequacy to be relative to a purpose. The object is a retrospective case explanation: an account, produced after the fact by someone who already knows how the episode ended, of why outcome O occurred in case C. The purpose is prospective. I want such explanations to be usable as one input to reasoning about a live analogue L that has not yet resolved — say, whether a governing coalition under sustained fiscal strain will hold together over the next two years. So the question is not what makes a historical account illuminating or well written; it is what a theory of retrospective case explanation would have to deliver for its outputs to be licensed as evidence about an unresolved case, given that the producer of the account cannot un-know the ending, and given the documented tendencies of hindsight reconstruction and of narrative shaping that the methodology literature on this topic concerns itself with.

  Below is my own draft list of candidate requirements, which I expect to be partly confused. Each has a gloss; I want you to repair, extend, and triage them rather than to ratify them.

  1. Outcome-blind evidential weighting, tested by an erasure procedure: delete from the write-up every sentence that states or presupposes O, or its timing, and ask whether the surviving evidence still supports the stated causal ranking.
  2. Live-alternative bookkeeping: at each juncture the account must name what else was still possible at the time, and must sort junctures into the unforeseeable, the foreseeable but unheeded, and the foreseen and nearly averted.
  3. Base-rate anchoring: confidence must be calibrated to how often comparable initial conditions produced O, with the reference class fixed as it was at the time, not reconstructed from the class of cases in which O in fact occurred.
  4. Conjunctive bookkeeping: where the account needs several steps all to break the same way, the compounding must be displayed rather than disguised by narrative flow as a single tendency.
  5. A negative-control or swap test: run the same explanatory procedure on contemporaneous cases where O did not occur; if it returns equally tight accounts, it has no discriminating power, and the theory must say what follows — refusal to explain, downgraded confidence, something else.
  6. Documentary-shadow correction: the surviving archive is itself partly an effect of O, since records are kept, memoirs written, and inquiries convened because the episode turned out to matter, so the evidence base is outcome-selected and not merely neutrally incomplete.
  7. Grain stability: the causal claim should survive redescription at coarser and finer grain, from individual deliberation to structural pressure, and if it holds at only one grain that must be declared.
  8. A reverse-narration test: if the account reads as naturally backwards from O as forwards from the initial conditions, treat that as evidence of rationalization rather than of causal asymmetry.
  9. Symmetric treatment of non-events: the theory must be able to explain why O did not occur in the years before it did, and to handle absences as explananda, not only presences.
  10. A stated failure condition: the account must say in advance what findings would have led its author to withdraw or downgrade it, on pain of being able to accommodate any archive whatsoever.
  11. A transport license: the deliverable must identify which features of C are load-bearing for transfer to L, and must say how far and under what changes the license extends, since my purpose is exactly transfer.
  12. An anti-deflation constraint: the output must remain a causally unified account of a particular episode — an explanation — and may not discharge its obligations by returning an unordered weighted list of factors.

  What I want from you:

  First, restate the desiderata properly, each with the case or consideration that motivates it, in the form of requirements on a theory rather than instructions to a historian. Say explicitly which of my twelve are genuine desiderata for the purpose I have fixed, which are prejudices of one methodological camp dressed up as requirements, which are really the same requirement counted twice, and what is missing. I am particularly unsure whether the anti-deflation constraint is a desideratum or a professional preference, and whether the reverse-narration test earns its place or merely restates the erasure procedure.

  Second, mark each requirement as non-negotiable for the stated purpose or as negotiable, and say what would have to change about the purpose for the negotiable ones to become binding.

  Third, and this is the part I care most about: identify which subsets of the requirements cannot be jointly satisfied. I suspect a real tradeoff between narrative unification and calibrated conjunctive contingency, and another between correcting for the documentary shadow and keeping evidential weights independent of O, since diagnosing the selection seems to require the very knowledge one is trying to neutralise. If the full list is unsatisfiable, say so and treat that as the result, and then tell me the strongest weaker purpose the truncated list will support — that is, what I should retreat to, and what I should stop claiming in the chapter.

  Fourth, name the single requirement that does the most work in excluding otherwise attractive theories, and justify the choice.

  Finally, a compressed scorecard, no more than about 150 words, rating four families of approach against the list: covering-law and statistical-relevance accounts, mechanism or process-tracing accounts, counterfactual difference-making accounts, and narrativist accounts that treat the shape of the story itself as the explanation. Keep the argumentative weight on the criteria; the scorecard is for orientation only.

  Anchor each requirement on either my coalition-under-fiscal-strain case or on a real episode you are confident any reader of the chapter will recognise, and say which you have used. Please do not supply references or reading lists; I have that part covered, and I want the specification itself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Dissertation in political science, methods chapter.
      *   **Topic:** Inference from a single well-documented historical episode (retrospective case explanation) to a live analogue (prospective reasoning).
      *   **Task:** Critique, repair, extend, and triage a draft list of 12 candidate requirements.
      *   **Specific Deliverables:**
          1.  Restate desiderata properly (requirements on a theory, not instructions), identify genuine vs. prejudiced vs. redundant, identify missing elements. Address specific doubts (anti-deflation, reverse-narration).
          2.  Mark requirements as non-negotiable vs. negotiable (and conditions for change).
          3.  Identify incompatibilities/trade-offs (joint satisfiability). If unsatisfiable, propose the strongest weaker purpose.
          4.  Name the single most exclusionary requirement and justify.
          5.  Compressed scorecard (max 150 words) rating four families of approach.
      *   **Constraints:** Anchor requirements on the coalition/fiscal strain case or a recognizable real episode. No references/reading lists.

  2.  **Deconstruct the 12 Draft Requirements:**
      *   1. *Outcome-blind evidential weighting (Erasure):* Can we justify the cause without knowing the effect?
      *   2. *Live-alternative bookkeeping:* Contingency mapping.
      *   3. *Base-rate anchoring:* Reference class selection (ex-ante vs. ex-post).
      *   4. *Conjunctive bookkeeping:* Probability compounding vs. narrative flow.
      *   5. *Negative-control/swap test:* Specificity of the explanation (does it explain non-O too?).
      *   6. *Documentary-shadow correction:* Archival bias due to outcome.
      *   7. *Grain stability:* Robustness across levels of analysis.
      *   8. *Reverse-narration test:* Teleology check.
      *   9. *Symmetric treatment of non-events:* Explaining stability before change.
      *   10. *Stated failure condition:* Falsifiability.
      *   11. *Transport license:* External validity/transferability criteria.
      *   12. *Anti-deflation constraint:* Must be a unified story, not a list.

  3.  **Drafting Section 1: Restating and Triage:**
      *   *Goal:* Convert "instructions to a historian" into "requirements on a theory of explanation."
      *   *Critique:*
          *   1 & 8 are very similar (both test for hindsight bias). 8 is a specific test for 1. Let's merge or prioritize 1 as the structural requirement.
          *   12 (Anti-deflation) is tricky. Is a list of factors an explanation? For *transfer*, mechanisms matter more than lists. It's a substantive requirement for *causal* transfer, not just aesthetic. Keep, but refine.
          *   6 (Documentary shadow) is epistemologically hard. Can we correct for it without knowing O? It's a requirement on the *evidence handling protocol*, not just the theory.
          *   11 (Transport license) is the core of the user's purpose. This is the *sine qua non*.
          *   3 (Base-rate) conflicts with single-case depth sometimes, but necessary for calibration.
          *   5 (Negative control) is crucial for causal inference (specificity).
      *   *Missing:* A requirement on *mechanism opacity*. If the mechanism is a black box, transfer is hard. Also, a requirement on *intervention sensitivity* (if we change X in L, does O change?).
      *   *Anchoring:* Use the "Coalition under Fiscal Strain" (Live Analogue L) and the "1931 British Labour Government Collapse" or "1976 IMF Crisis" (Historical Case C). Let's use the 1976 UK IMF Crisis as C and the current Coalition as L.

  4.  **Drafting Section 2: Negotiability:**
      *   *Non-negotiable:* Transport License (11), Negative Control (5), Failure Condition (10). Without these, you can't claim prospective utility.
      *   *Negotiable:* Grain Stability (7) (depends on theory level), Documentary Shadow (6) (might be too hard to fully correct), Anti-deflation (12) (depends on what counts as explanation).
      *   *Condition for change:* If the purpose shifts from *prediction/forecasting* to *understanding/interpretation*, many become negotiable.

  5.  **Drafting Section 3: Incompatibilities (The Core Challenge):**
      *   *Trade-off 1:* Narrative Unification (12) vs. Conjunctive Bookkeeping (4). A smooth story hides probability compounding. A rigorous probability account kills the narrative flow.
      *   *Trade-off 2:* Outcome-blind Weighting (1) vs. Documentary Shadow (6). To know the archive is biased by O, you must know O. To weight blindly, you must ignore O. You can't fully do both simultaneously in practice, only in principle.
      *   *Trade-off 3:* Base-rate Anchoring (3) vs. Single-case Depth. If you rely on base rates, the single case matters less. If you rely on the single case, base rates are often unavailable or gerrymandered.
      *   *Conclusion:* The full list is unsatisfiable. The "stronger weaker purpose" is *diagnostic guidance* rather than *evidential licensing*. You can't prove L will behave like C, but you can identify *what to watch* in L. Retreat from "evidence about an unresolved case" to "structured heuristic for monitoring an unresolved case."

  6.  **Drafting Section 4: The Exclusionary Requirement:**
      *   *Candidate:* Transport License (11). Most theories explain the past; few specify how to move to the future.
      *   *Candidate:* Negative Control (5). Many historical explanations are consistent with the opposite outcome.
      *   *Selection:* **Negative-control or swap test (5).** Why? Because most retrospective explanations are *overdetermined* or *post-hoc consistent*. If an explanation fits C (O happened) and C* (O didn't happen) equally well, it has zero predictive power for L. This kills most interpretivist and many standard process-tracing accounts.

  7.  **Drafting Section 5: Scorecard:**
      *   *Covering-law:* Good on base rates, bad on single-case nuance.
      *   *Mechanism:* Good on transport, bad on base rates/negative controls.
      *   *Counterfactual:* Good on alternatives, bad on evidential weighting.
      *   *Narrativist:* Good on unification, bad on almost everything else (bias, transport).
      *   *Constraint:* 150 words.

  8.  **Review and Refine:**
      *   *Tone:* Academic, precise, critical but constructive.
      *   *Anchors:* Ensure the 1976 UK IMF crisis or similar is used to illustrate. Let's use the 1976 UK IMF Crisis as the historical case (C) and the current Coalition (L).
      *   *Check Specific Questions:* Did I address Anti-deflation? Yes. Reverse-narration? Yes (merged with Erasure).
      *   *Check Constraints:* No references. 150 words for scorecard.

      *(Self-Correction during drafting)*: I need to be careful with the "unsatisfiable" claim. I shouldn't just say "it's impossible." I should say "It creates a tension that requires prioritizing." The prompt asks: "If the full list is unsatisfiable, say so... and then tell me the strongest weaker purpose." I will argue it is unsatisfiable as a set of *simultaneous* constraints on a single text, requiring a modular approach or a retreat to "heuristic value."

      *Refining the "Anti-deflation" point:* The user asks if it's a preference. I should argue it's necessary for *transport*. Lists don't travel; mechanisms do. So it is a desideratum for *this* purpose.

      *Refining "Reverse-narration":* It is redundant with Erasure. Erasure is the structural test; Reverse-narration is the phenomenological test. Keep Erasure, drop Reverse-narration as a standalone.

      *Refining "Documentary Shadow":* This is the hardest. Correcting for it requires knowing O. I will flag this as a theoretical ideal that cannot be fully operationalized, making it a "regulative ideal" rather than a checklist item.

      *Scorecard Word Count:* Must be tight.

      *Anchoring:* I will explicitly mention the 1976 UK IMF Crisis (Callaghan/Healey) as the historical C and the hypothetical/current Coalition as L.

  9.  **Final Polish:** Check against the "requirements on a theory" vs "instructions to a historian" distinction.
      *   Bad: "Delete every sentence..."
      *   Good: "The theory must specify a protocol for..."
      *   Bad: "Name what else was possible..."
      *   Good: "The theory must represent the decision tree as..."

      Let's assemble.

      *(Word Count Check on Scorecard)*: I need to draft it carefully to stay under 150.

      *(Incompatibility Logic)*: The tension between *Narrative Unification* (making it hang together) and *Conjunctive Bookkeeping* (admitting fragility) is the key insight. A story that hangs together *looks* inevitable. A story that admits fragility *looks* like a list. This is the "Anti-deflation vs. Conjunctive" tension.

      *(Exclusionary Requirement)*: I'll stick with Negative Control (5). It's the hardest for qualitative work to meet.

      *(Weaker Purpose)*: From "licensed evidence" to "structured analogy."

      Let's write.

      *(Wait, one more check)*: "Anchor each requirement... say which you have used." I need to make sure I explicitly state which anchor I'm using for the requirements in Section 1. I will use the 1976 UK IMF Crisis for the historical case (C) and the current Coalition for the live analogue (L).

      *(Final check on constraints)*: No references. 150 words max on scorecard.

      Okay, ready to generate.cs
answer: |-
  ### I. Restatement and Triage of Desiderata

  I anchor these requirements on the **1976 UK IMF Crisis** (Historical Case C: the Labour government's loan application) and your **Current Coalition** (Live Analogue L). The goal is to treat the 1976 account not as a story to be read, but as a model to be run.

  **Genuine Desiderata (Repaired):**
  1.  **Ex-Ante Evidential Independence:** The theory must specify a protocol where causal weights assigned to 1976 factors (e.g., sterling reserves) remain stable if the outcome (IMF loan) is masked. *Motivation:* Hindsight bias inflates the predictive power of pre-crisis indicators. (Replaces 1 & 8; 8 is redundant phenomenology).
  2.  **Contingency Mapping:** The theory must represent the 1976 timeline as a branching tree of live options (e.g., devaluation vs. loan), categorized by their ex-ante probability, not ex-post inevitability. *Motivation:* Narrative flow disguises contingency; transfer requires knowing where the path could have diverged. (Repairs 2).
  3.  **Reference-Class Integrity:** Confidence intervals must derive from the frequency of O in the class of cases identifiable *in 1976*, not the class constructed after 1976. *Motivation:* Prevents cherry-picking "similar" crises that all ended in loans. (Repairs 3).
  4.  **Probability Transparency:** Where the explanation relies on a chain of events (e.g., election loss → weak mandate → market panic), the theory must display the joint probability, not the conditional certainty. *Motivation:* Narrative smoothness masks conjunctive fragility. (Repairs 4).
  5.  **Specificity Testing:** The theory must demonstrate that the 1976 explanation does not equally fit contemporaneous cases where no loan occurred (e.g., 1974 UK or 1976 Italy). *Motivation:* An explanation that fits O and not-O has zero discriminant power for L. (Repairs 5).
  6.  **Archive Bias Modeling:** The theory must account for the fact that 1976 memos exist *because* the crisis happened; it must estimate the silence in non-crises. *Motivation:* The documentary record is outcome-selected. (Repairs 6).
  7.  **Falsification Criteria:** The account must specify which 1976 findings would have invalidated the causal claim had they been different. *Motivation:* Prevents accommodation of any evidence. (Repairs 10).
  8.  **Transfer Specification:** The theory must explicitly map 1976 variables to L variables, stating which structural features are invariant and which are context-bound. *Motivation:* Without this, the history is merely anecdotal. (Repairs 11).
  9.  **Causal Unification:** The output must identify the mechanism linking factors, not just list correlates. *Motivation:* Lists do not travel; mechanisms do. (Repairs 12; this is a desideratum for *transfer*, not just aesthetics).

  **Prejudices/Redundancies:**
  *   **Reverse-Narration Test (8):** Redundant. If Ex-Ante Evidential Independence (1) is met, reverse narration is structurally impossible.
  *   **Symmetric Non-Events (9):** Absorbed into Specificity Testing (5). If you explain why O happened in 1976, you must implicitly explain why it didn't in 1975.
  *   **Grain Stability (7):** A preference for multi-level analysis. Not strictly necessary for transfer if the chosen grain (e.g., elite decision-making) is specified in the Transfer Specification (8).

  **Missing:**
  *   **Intervention Sensitivity:** The theory must state how the outcome in L would change if a specific load-bearing factor from 1976 were manipulated in L.

  ### II. Negotiability

  **Non-Negotiable (for Prospective Licensing):**
  *   **Transfer Specification (8):** Without this, you are writing history, not informing policy.
  *   **Specificity Testing (5):** Without this, you have no grounds to claim the explanation distinguishes stability from collapse.
  *   **Falsification Criteria (7):** Without this, the account is unfalsifiable and thus carries no evidential weight.

  **Negotiable:**
  *   **Archive Bias Modeling (6):** *Condition:* If the purpose retreats from "licensed evidence" to "informed heuristic." Fully correcting for archival silence is often epistemically impossible without access to the non-crisis archives which may not exist.
  *   **Causal Unification (9):** *Condition:* If the purpose shifts to risk-assessment checklists rather than causal explanation. A weighted list of risk factors is useful for monitoring L, even if it lacks a unified mechanism.
  *   **Reference-Class Integrity (3):** *Condition:* If single-case mechanisms are deemed more robust than statistical regularities (a common qualitative stance).

  ### III. Incompatibilities and The Retreat

  The full list is **unsatisfiable** as a set of simultaneous constraints on a single text.

  **The Primary Trade-off:** **Causal Unification (9) vs. Probability Transparency (4).**
  A causally unified account (a story) inherently smooths over the jagged probabilities of conjunctive steps to make sense of the outcome. To display the compounding fragility (e.g., "this only happened because five unlikely things aligned") is to dismantle the narrative unity. You cannot have a story that reads as inevitable (unified) and one that reads as fragile (transparent) simultaneously.

  **The Secondary Trade-off:** **Ex-Ante Evidential Independence (1) vs. Archive Bias Modeling (6).**
  To diagnose that the archive is biased by the outcome (1976 memos exist because the crisis happened), you must know the outcome. To weight evidence independently of the outcome, you must ignore it. You cannot operationalize both in the same pass.

  **The Stronger Weaker Purpose:**
  You must retreat from claiming the historical account provides **licensed evidence** (which implies a proof-like warrant) to claiming it provides a **structured diagnostic heuristic**.
  *   **Stop claiming:** That the 1976 explanation *validates* a prediction about the Coalition.
  *   **Start claiming:** That the 1976 explanation identifies *critical monitoring points* (e.g., "Watch bond spreads, not just polling") and *falsification conditions* for the Coalition.
  This retains the Transfer Specification and Specificity Testing but abandons the demand for perfect Ex-Ante Independence and full Probability Transparency. It accepts that the history is a guide to *what matters*, not a calculator of *what will happen*.

  ### IV. The Exclusionary Requirement

  **Specificity Testing (5)** does the most work in excluding otherwise attractive theories.

  **Justification:** Most retrospective political science explanations are "consistent with" the outcome. Interpretivist narratives, standard process-tracing, and even many statistical models can explain why the 1976 Labour government fell *and* could be tweaked to explain why the 1974 government survived. If a theory of explanation cannot demonstrate that its causal logic fails in the negative control case (1974/Italy), it possesses no discriminant power. It explains everything and therefore predicts nothing. This requirement excludes any approach that treats the single case as a self-contained universe rather than a data point in a broader causal field.

  ### V. Scorecard

  **Covering-Law/Statistical:** High on Reference-Class Integrity and Specificity; fails Transfer Specification and Causal Unification (too abstract for L's nuance).
  **Mechanism/Process-Tracing:** High on Causal Unification and Transfer; fails Specificity Testing and Probability Transparency (often ignores non-events and over-smooths chains).
  **Counterfactual Difference-Making:** High on Contingency Mapping and Specificity; fails Archive Bias Modeling (relies on existing records to build counterfactuals) and Ex-Ante Independence (often constructed post-hoc).
  **Narrativist:** High on Causal Unification; fails almost all others. Treats the story shape as explanation, violating Ex-Ante Independence and Specificity. Best for understanding, worst for licensing prospective inference.
