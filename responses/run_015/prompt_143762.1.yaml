  1.  **Sandpile:** If the loss is sub-perceptual, welfare (hedonic) is unchanged. L becomes more plausible only if you deny welfare exhausts individual good. If status or objective goods matter, the loss is real, and L competes with welfare loss. If the loss is truly null, L faces the Veil problem: why care about a pattern change with no welfare footprint? The spread version makes the loss diffuse, masking the harm, but doesn't eliminate it.
  2.  **Veil:** Ex ante worse for everyone. "Better in one respect" lacks a subject. This variant exposes the metaphysical cost of L: it requires a "view from nowhere" value. If value must be *for* someone, L is false. If value can be free-floating, L is possible. This is the crux.

  **Prioritarianism/Relativism:**
  You couldn't get it to work because of **separability**. Prioritarianism sums weighted individual welfare: $V = \sum f(u_i)$. If $u_{rich}$ drops and $u_{poor}$ stays fixed, $V$ drops, regardless of weights, unless $f$ depends on others' $u$. If weights track relative position (rank), lowering the rich changes the rank, but unless the function is non-separable (i.e., essentially egalitarian, $V(u_1, u_2)$), the sum still declines. Relative prioritarianism is just prioritarianism with a different curve; it remains person-affecting. To favor levelling down, you need a term that values the *gap* itself, not the relata. That isn't prioritarianism; it's telic egalitarianism. Structural reason: separable sums cannot prefer a outcome where everyone is worse off or some are worse off and none better.

  **Disagreement Diagnosis:**
  You (0.35) treat the intuition as prima facie evidence of axiological structure; your friend (0.05) treats it as a cognitive illusion (a deontic heuristic misfiring in telic contexts). You disagree on the **ontology of value**. You allow value to exist without a beneficiary; your friend requires value to supervene on individual good. Resolution requires settling whether "good" is essentially relational to subjects. If you agree value must be *for* someone, your friend wins (L=0). If you agree value can be impersonal, you win (L>0). No empirical data resolves this; it's a metaphysical stipulation. The debate bottoms out in whether "better" requires a beneficiary. If yes, L is ill-formed. If no, L is live. Most contemporary ethics leans toward "yes," pushing credence down, but the intuitive pull keeps it from zero.
