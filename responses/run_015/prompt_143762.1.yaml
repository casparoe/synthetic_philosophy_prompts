  These terms are not independent. TSE is the killer: if the pull tracks ex ante fairness or standing (TSE high), then NIDS is effectively zero for this case. The calculation is roughly $P(L) \approx P(NIDS) \times P(Outcome) \times P(Sterilization) \times (1 - P(TSE)) \times P(WF)$. Plugging in: $0.4 \times 0.5 \times 0.6 \times 0.3 \times 0.8 \approx 0.028$. I inflate this to 0.12 because the parameters are correlated; if NIDS is true, TSE is likely lower. The final number is most sensitive to **TSE**. If you convince me the intuition is purely about ex ante expectations or social standing, my number drops to 0.01. The single consideration moving me furthest upward is a proof that value can supervene on relations without anchoring in any individual's good (defeating the "better for whom" objection).

