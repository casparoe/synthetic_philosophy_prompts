      *   *Wait, one nuance:* Some UDT variants (like "Subjective UDT") might allow updating on indexical information. But standard UDT (Yudkowsky/Soares) does not update on the coin flip in Mugging. I should stick to the standard definition provided in (1).

      *   *Check (2):* One-boxing is standard UDT.
