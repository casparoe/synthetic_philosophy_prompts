answer: |-
  In the St. Jude Hospital Pharmacy-and-Therapeutics Committee, Dr. Aris (Clinical Lead) and Dr. Basil (Finance Director) must jointly decide on a formulary addition, each selecting one of three motions: Aris chooses between 'Aggressive Adoption' ($A_1$), 'Cautious Hybrid' ($A_2$), or 'Conservative Retention' ($A_3$), while Basil selects 'Fast-Track Approval' ($B_1$), 'Audit Review' ($B_2$), or 'Deferral' ($B_3$). Institutional bylaws stipulate that if Basil selects 'Audit Review', an external compliance lottery triggers a delegated veto with probability $p=0.5$, nullifying Aris's 'Aggressive' motion but leaving 'Conservative' intact, whereas 'Cautious Hybrid' yields moderate clinical utility regardless of audit outcomes but incurs fixed administrative friction. Aris values clinical efficacy highest under Fast-Track, moderate under Audit (if not vetoed), and lowest under Deferral, while Basil prioritizes cost containment which aligns with Deferral for Aggressive motions but favors Fast-Track for Conservative ones, creating a payoff structure where the 'Cautious Hybrid' yields stable but intermediate returns that are systematically outperformed by a probabilistic combination of Aggressive and Conservative motions weighted by the audit veto probability, yet never outperformed by either pure motion alone across all of Basil's possible responses.

  (1) **Strategies Surviving Pure-Strategy Iterated Elimination of Strict Dominance (IESD):**
  Because the 'Cautious Hybrid' ($A_2$) yields higher payoffs than 'Aggressive Adoption' ($A_1$) when Basil chooses 'Audit Review' (due to the veto risk on $A_1$) and higher payoffs than 'Conservative Retention' ($A_3$) when Basil chooses 'Fast-Track Approval' (due to higher efficacy of $A_1$), $A_2$ is not strictly dominated by any pure strategy of Aris. Similarly, assuming Basil's payoffs are structured such that no single motion dominates his others against Aris's pure strategies (e.g., $B_2$ is best against $A_2$, $B_1$ against $A_1$, $B_3$ against $A_3$), no strategies are eliminated. Thus, the set of surviving strategies is the full profile: $\{A_1, A_2, A_3\} \times \{B_1, B_2, B_3\}$.

  (2) **Mixed-Strategy Elimination Sequence:**
  Allowing for mixed strategies, Aris's 'Cautious Hybrid' ($A_2$) is strictly dominated by a mixed strategy $\sigma_A = 0.5 A_1 + 0.5 A_3$. The weights (0.5, 0.5) match the audit-lottery probability $p$. Against any of Basil's pure strategies, the expected payoff of $\sigma_A$ exceeds $A_2$ (e.g., against $B_2$, the mix averages the vetoed $A_1$ and safe $A_3$ to outperform the friction-heavy $A_2$).
  *   **Step 1:** Aris eliminates $A_2$.
  *   **Step 2:** With $A_2$ removed, Basil compares $B_1, B_2, B_3$ against $\{A_1, A_3\}$. Given the payoff structure where $B_1$ yields higher cost-savings than $B_2$ against both remaining Aris options (as $B_2$'s audit cost is unjustified without $A_2$'s friction), $B_2$ becomes strictly dominated by $B_1$. Basil eliminates $B_2$.
  *   **Step 3:** With $B_2$ removed, Aris compares $\{A_1, A_3\}$ against $\{B_1, B_3\}$. $A_1$ now strictly dominates $A_3$ (as $A_1$ captures high efficacy on $B_1$ and sufficient value on $B_3$ compared to $A_3$). Aris eliminates $A_3$.
  *   **Step 4:** With $A_3$ removed, Basil compares $\{B_1, B_3\}$ against $A_1$. $B_1$ strictly dominates $B_3$. Basil eliminates $B_3$.
  *   **Unique Outcome:** $(A_1, B_1)$ ('Aggressive Adoption' with 'Fast-Track Approval').

  (3) **Structural Feature Causing Divergence:**
  The divergence arises from the **convexity of the payoff space induced by the audit probability**. Pure-strategy elimination fails because $A_2$ lies outside the dominance range of $A_1$ and $A_3$ individually (it is a "local peak" against specific pure opponent moves). However, the institutional veto rule creates a linear constraint where the expected value of the mix $\sigma_A$ forms a hyperplane strictly above $A_2$'s payoff vector. The specific interaction is that the veto probability $p$ acts as the exact mixing weight required to smooth the volatility of $A_1$ and the lower ceiling of $A_3$ such that their convex combination strictly exceeds the stable but inferior return of $A_2$ across all columns.

  (4) **Rationalizability Verdicts and Ordering:**
  **Pure-Strategy Rationalizability** verdict: $A_2$ is rationalizable (it is a best response to $B_2$). **Full (Mixed-Strategy) Rationalizability** verdict: $A_2$ is not rationalizable (it is never a best response to any belief over Basil's strategies, including mixed ones). The disadvantage to Aris (being forced out of $A_2$) is **not an artifact of elimination ordering** because iterated elimination of strictly dominated strategies (whether pure or mixed) is order-independent; any sequence of eliminations yields the same reduced set of strategies. The divergence exists solely because the solution concept expands the set of admissible comparisons to include probabilistic combinations of own-strategies.

  (5) **Collapsing the Divergence and Pure-Strategy Defense:**
  Removing the probabilistic veto feature (setting $p=0$ or $p=1$) collapses the mixing weights to degenerate values (0 or 1), turning the dominating mixed strategy into a pure strategy. In this case, $A_2$ would be strictly dominated by either $A_1$ or $A_3$ alone, and pure-strategy IESD would converge to the same unique outcome without requiring mixed strategies. A defender of pure-strategy rationalizability could argue that importing mixed strategies into committee deliberation is **institutionally unrealistic**: committee members are fiduciaries who must cast deterministic votes based on deliberation, not probabilistic hedges. Arguing that a member should "randomize" their motion to avoid dominance violates the normative expectation of intentional, reasoned decision-making, making the broader concept descriptively accurate but normatively inappropriate for this governance context.
