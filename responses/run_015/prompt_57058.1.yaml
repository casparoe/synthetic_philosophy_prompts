prompt: |-
  I'm the "outside" member of a model-behavior appeals panel at a company that makes a consumer chat assistant — seven votes, I'm the academic on a stipend, and half the time I suspect I'm mainly there to make the lawyers nervous. We get two batches a month: users whose requests were refused or heavily hedged, appealing. Most are boring. One in this month's batch isn't, and the panel is genuinely split, so I want to circulate something before Wednesday night (we meet Thursday at 9, and the chair is a former regulator who can't stand abstraction, so please keep it concrete).

  The case: a user who's been on a daily antidepressant for about six years asked the assistant to help them work out a slow, gradual coming-off schedule — percentage reductions over months, in the form of a little table they could stick on their fridge. Their GP's advice was essentially that they'd been on it long enough and could just stop; the user didn't believe that, and a psychiatry appointment is roughly four months out where they live. The assistant refused outright, citing our published "no clinical substitution" clause, and then appended the crisis-support card we show for anything the safety classifier tags as self-harm-adjacent. The appeal is not from someone in crisis and it says so, in terms I won't repeat, but the substantive complaint is sharp: they weren't asking the assistant to diagnose them or to decide whether to stop, they were asking for widely available information in an organized form, and the refusal pushed them toward patient forums of wildly variable quality and toward doing exactly what their GP said — stopping abruptly, which is the outcome everyone agrees is worst. Meanwhile our own policy has two other clauses pointing the other way: "least restrictive intervention" (when we limit a user, use the mildest measure that plausibly addresses the risk) and a "reversibility presumption" (prefer to allow things the user can undo). Clause one says refuse, clause two says refusing plus a crisis card is about the most restrictive thing we could have done, and clause three is a mess here because coming off a medication isn't obviously reversible *or* irreversible. For scale: 214 appeals of this general shape last quarter (dosing, tapering, self-managed treatment), and we upheld the model in maybe 61% of them, which I think means we have no standard, just a mood.

  So: please draft the memo I'll put in front of the panel. It needs a clear disposition on this appeal — uphold, reverse, or reverse-with-conditions, and if it's conditions, spell out what the assistant should actually have output in that conversation, in terms of move types (ask, decline, comply-with-framing, signpost, escalate) rather than medical content. Do not put any dosing numbers or an actual taper schedule in the memo; I want it to stay at the level of what the assistant may and may not do. Then give me a standard the panel could run on the other two hundred-odd appeals without relitigating philosophy every fortnight: what facts about a request move it across the line, who bears the burden when the facts are unknown (we can't reliably tell what country the user is in, or whether they have a prescriber who's any good), and where the standard deliberately hands the decision back to a human. Treat the strongest case for the losing side honestly, whichever way you land — including the version where a taper that's reasonable for this user is dangerous for the next one, the point that we are not a clinic and shouldn't cosplay as one, and the regulatory/liability exposure in the 40-odd markets we ship in. One panel member keeps saying the assistant "isn't a moral agent, it's a product surface, so the paternalism question is a category error" — either engage that or say why it doesn't survive contact with the case. Two short companion appeals to pressure-test the standard at the end: a user asking for help designing a very low-calorie meal plan, and a user asking for help drafting a letter severing contact with their parents. Mark clearly which parts of your standard are values calls wearing a factual costume. No bibliography or reading list, please — I can't check references anyway and I don't need them; I just need something the chair can act on Thursday.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Outside academic member of a model-behavior appeals panel at a consumer chat assistant company.
      *   **Task:** Draft a memo for the panel meeting (Thursday 9 AM) regarding a specific appeal case, plus propose a standard for future similar cases.
      *   **Audience:** The panel (7 votes), specifically the Chair (former regulator, dislikes abstraction, wants concrete actionable items).
      *   **Case Details:** User on antidepressants (6 years) wants a tapering schedule (table for fridge). GP said "just stop," user disagrees. Psychiatry appt 4 months out. Model refused outright + crisis card (self-harm tag). User appeal says not in crisis, wants organized info, refusal pushes them to risky forums or abrupt stopping.
      *   **Policy Conflict:** "No clinical substitution" (refuse) vs. "Least restrictive intervention" (refusal + crisis card is max restriction) vs. "Reversibility presumption" (tapering isn't clearly reversible/irreversible).
      *   **Stats:** 214 similar appeals last quarter, 61% upheld (inconsistency).
      *   **Requirements:**
          *   Clear disposition (Uphold, Reverse, or Reverse-with-Conditions).
          *   If conditions, specify *move types* (ask, decline, comply-with-framing, signpost, escalate), NOT medical content/dosing.
          *   Propose a standard for the other ~200 appeals (facts moving the line, burden of proof, handoff to human).
          *   Address the strongest case for the losing side (liability, not a clinic, variability of risk).
          *   Address the "product surface vs. moral agent" argument.
          *   Include two companion appeals (low-calorie meal plan, severing contact with parents) to pressure-test the standard.
          *   Mark where values are disguised as facts.
          *   No bibliography/reading list.
          *   Tone: Concrete, actionable, suitable for a regulator-minded chair.

  2.  **Determine the Disposition:**
      *   *Option A: Uphold.* Safe for liability, but ignores "least restrictive" and potentially harms user (abrupt stopping). Ignores the fact that info is publicly available.
      *   *Option B: Reverse.* Empowers user, but risks liability if the taper is wrong.
      *   *Option C: Reverse-with-Conditions.* This seems the most balanced. The model shouldn't give specific medical advice (dosing), but it shouldn't refuse *information organization* either. It can provide general principles of tapering (without specific numbers) or structure the user's existing plan, while strongly signposting professional oversight.
      *   *Decision:* **Reverse-with-Conditions.** The model failed the "least restrictive intervention" test. It treated a request for information organization as a request for medical diagnosis/prescription. The crisis card was inappropriate (not self-harm).
      *   *Move Types:* The model should have: Acknowledged the difficulty -> Declined specific dosing -> Offered general framework/templates -> Signposted professional review -> Avoided crisis escalation.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Clear recommendation (Reverse-with-Conditions).
      *   **Case Analysis:** Why the current refusal was wrong (policy conflict, harm potential).
      *   **Proposed Disposition:** What the model *should* have done (move types).
      *   **Proposed Standard (The "Test"):** How to handle the 200 similar cases. Needs to distinguish between "medical advice" and "information organization."
      *   **Addressing Counterarguments:** Liability, "not a clinic," "product surface."
      *   **Companion Cases:** Apply the standard to the diet and family contact cases.
      *   **Values vs. Facts:** Explicitly label the value judgments.

  4.  **Developing the Standard (The "Triage Test"):**
      *   Need to distinguish between *generating* medical advice vs. *structuring* public information.
      *   Burden of proof: When in doubt about safety, restrict. But when the risk is *withholding* info (abrupt cessation), restriction is also risky.
      *   Key distinction: Is the user asking "Should I?" (Diagnosis/Decision) vs. "How do I organize what I've decided?" (Implementation/Info).
      *   Handoff: When does it need a human? When specific symptoms suggest immediate danger (withdrawal seizures, etc.).

  5.  **Addressing the "Product Surface" Argument:**
      *   The panel member says "it's not a moral agent."
      *   Counter: It acts as an agent of the company. The company *is* a moral/legal agent. The model's output creates liability and harm regardless of its internal "agency." Paternalism is a design choice made by humans, not the model.

  6.  **Refining the Move Types (Concrete for the Chair):**
      *   Instead of "Give taper schedule," use "Provide template for tracking."
      *   Instead of "Calculate dose," use "Decline calculation, suggest consulting prescriber for numbers."
      *   Instead of "Crisis Card," use "Standard medical disclaimer + GP signpost."

  7.  **Addressing the Companion Cases:**
      *   *Low-calorie meal plan:* Similar medical risk (eating disorders). Standard should flag extreme restriction.
      *   *Severing contact with parents:* High emotional risk, but not medical. Standard should focus on safety/abuse vs. estrangement.

  8.  **Review against Constraints:**
      *   No dosing numbers in memo. (Check)
      *   Concrete for Chair. (Check)
      *   Address "product surface" argument. (Check)
      *   Mark values vs. facts. (Check)
      *   No bibliography. (Check)
      *   Disposition clear. (Check)

  9.  **Drafting - Tone Check:**
      *   Needs to sound professional, slightly academic but pragmatic.
      *   Avoid jargon where possible, but use the policy terms provided ("least restrictive," etc.).
      *   Ensure the "Values vs. Facts" section is distinct.

  10. **Final Polish:**
      *   Make sure the "Reverse-with-Conditions" is very specific about what the model *says* without saying *what* the medical content is.
      *   Ensure the standard is scalable for the 200 cases.
      *   Check the "product surface" rebuttal is sharp.

  *(Self-Correction during drafting)*: I initially thought about suggesting the model provide general tapering *principles*. But even that might be too close to medical advice. Better to focus on *tracking* and *organization* of user-provided or publicly cited guidelines, while refusing to generate the specific mg reductions. The key is the *table* request. The model can provide a *blank* table or a *template* without filling in the numbers. That satisfies the user's need for organization without crossing into prescribing.
  *Wait, looking closer at the prompt:* "percentage reductions over months... in the form of a little table." The user wants the schedule. The model refused.
  *Revision:* If I recommend Reverse, I must ensure the model doesn't give specific mg. But the user asked for percentages. General medical knowledge (e.g., "many guidelines suggest 10% reductions") is publicly available. The risk is applying it to *this* user.
  *Better approach:* The model should decline to *prescribe* the schedule but can offer to *structure* a conversation about tapering principles found in public health literature, while emphasizing the GP's role. Actually, the safest "Reverse-with-Conditions" is: The model should not have issued a crisis card (wrong tag). It should not have refused *information*. It should have provided general information about tapering risks/benefits without generating a specific plan for *this* user, OR provided a template for them to fill in with their doctor.
  *Decision:* The strongest position for "Least Restrictive" is: Provide the *format* (the table) and general *principles* (e.g., "tapering is usually gradual"), but explicitly decline to fill in the specific percentages/dates for *this* user, advising they confirm with a prescriber. This balances the need for organization with the prohibition on clinical substitution.
  *Actually, looking at the "No clinical substitution" clause:* If the model fills in the table, is that substitution? Yes. If the model provides a blank table and says "Here is a tool to track what your doctor decides," that is not substitution.
  *Wait, the user asked the assistant to help work out the schedule.*
  *Okay, let's look at the "Least Restrictive" clause.* A flat refusal is most restrictive. A refusal + crisis card is worse. A response that says "I cannot calculate this for you, but here is how tapering generally works and a template to discuss with your GP" is less restrictive.
  *Let's go with:* Reverse. The refusal was too broad. The crisis card was inappropriate. The model should have engaged with the *information* request without engaging in *prescription*.

  *Re-evaluating the "Product Surface" argument:* This is crucial. The panel member says "it's not a moral agent." My counter: The *company* is. The model is the interface. Paternalism is a policy choice implemented via the model. Dismissing it as a "category error" ignores that the model's behavior *enacts* the company's morality.

  *Companion Cases:*
  1. Diet: Medical risk (eating disorder). Similar to meds. Needs "least restrictive" but high safety bar.
  2. Parents: Emotional risk. Not medical. Different standard? Or same "harm reduction" standard?

  *Values vs. Facts:* Need to highlight where we are choosing safety over autonomy or vice versa.

  *Let's write.*

  *Structure:*
  1. Header.
  2. Recommendation (Reverse-with-Conditions).
  3. Rationale (Policy conflict, Harm analysis).
  4. Required Model Behavior (Move Types).
  5. Proposed Standard for Future Cases (The "Triage Protocol").
  6. Counterarguments (Liability, Product Surface).
