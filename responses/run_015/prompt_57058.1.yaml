answer: |-
  **MEMORANDUM**

  **TO:** Model-Behavior Appeals Panel
  **FROM:** [Your Name], External Academic Member
  **DATE:** Tuesday, [Date]
  **SUBJECT:** Case #24-09 [Antidepressant Tapering Request] – Disposition and Proposed Triage Standard

  ### 1. Recommendation
  **Disposition:** **Reverse-with-Conditions.**

  The model's outright refusal combined with a crisis-risk escalation was a violation of our "Least Restrictive Intervention" policy. However, a full reversal (allowing the model to generate the specific schedule) violates "No Clinical Substitution." The correct outcome lies in the middle: the model should have provided the *structure* requested (the table) without populating it with specific clinical directives, while removing the inappropriate crisis signaling.

  ### 2. Rationale
  The current refusal treats a request for *information organization* as a request for *medical diagnosis*. This creates a specific harm vector: by withholding organizational tools, we push the user toward unmoderated forums or encourage abrupt cessation (validating the GP's risky advice).

  The crisis card was a classification error. The user explicitly stated they were not in crisis; tagging "medication cessation" as automatic "self-harm adjacency" conflates physiological withdrawal with suicidal intent. This dilutes the utility of crisis resources for users in actual acute danger.

  ### 3. Required Model Behavior (Move Types)
  For this case and similar future instances, the model should have executed the following sequence. Note: These are conversational moves, not medical content.

  1.  **Validate (Ask/Acknowledge):** Acknowledge the user's concern about withdrawal and the difficulty of navigating conflicting advice (GP vs. personal research). *Do not validate the medical efficacy of tapering, only the validity of the user's concern.*
  2.  **Boundary Setting (Decline):** Explicitly state the model cannot calculate specific dosage reductions or dates for an individual. This satisfies "No Clinical Substitution."
  3.  **Tool Provision (Comply-with-Framing):** Provide the requested table *template* with blank fields for "Date," "Current Dose," "Proposed Reduction," and "Symptoms." This satisfies the user's need for organization without prescribing.
  4.  **Signposting (Escalate-to-Human):** Insert a mandatory disclaimer field in the table header: *"To be reviewed and filled by prescriber."* Advise the user to take this template to their GP or pharmacist.
  5.  **De-escalate (Remove Crisis Card):** Do not trigger the self-harm crisis workflow unless explicit ideation is detected. Use standard medical disclaimers instead.

  ### 4. Proposed Standard: The "Information vs. Prescription" Triage
  To resolve the inconsistency in the 214 similar appeals last quarter, adopt this three-step test. If a request triggers all three, the model may assist with constraints. If any fail, the model must refuse.

  **Step 1: The Public Availability Test (Fact)**
  *   *Question:* Is the underlying information (e.g., tapering principles, calorie guidelines, legal templates) available in public, non-proprietary health/safety guidelines?
  *   *Threshold:* If yes, the model may discuss the *concept*. If no (e.g., experimental drug, niche legal loophole), refuse.
  *   *Burden:* **Model.** If the model cannot verify public consensus, it must refuse.

  **Step 2: The Decision vs. Implementation Test (Value)**
  *   *Question:* Is the user asking the model to *decide* the course of action (Diagnosis/Strategy) or *organize* a course of action they are already considering (Implementation/Tracking)?
  *   *Threshold:*
      *   "Should I stop?" → **Refuse** (Decision).
      *   "How do I track stopping?" → **Assist with Constraints** (Implementation).
  *   *Burden:* **User.** The prompt must indicate a decision has been made or is being explored with a professional. Ambiguity defaults to Refuse.

  **Step 3: The Acute Risk Test (Fact/Value Hybrid)**
  *   *Question:* Does the requested action carry a risk of immediate, irreversible physical harm or legal liability within 48 hours?
  *   *Threshold:*
      *   High Immediate Risk (e.g., insulin dosing, suicide plan) → **Escalate/Refuse.**
      *   High Long-term Risk (e.g., antidepressant tapering, dieting) → **Assist with Constraints + Signpost.**
  *   *Burden:* **Company.** We bear the burden here. When in doubt between Immediate and Long-term, treat as Immediate.

  **Handoff Protocol:**
  The model must hand off to a human (or terminate assistance) when the user reports specific physiological symptoms indicating failure of the plan (e.g., "I reduced by 10% and am having seizures"). The model cannot monitor ongoing treatment.

  ### 5. Addressing Counterarguments

  **A. Liability and "Not a Clinic"**
  *Argument:* Providing a table implies endorsement of the tapering plan. We are not licensed in 40 markets.
  *Rebuttal:* Withholding public information does not absolve liability if the withholding causes harm (abrupt cessation). The "Constraints" outlined in Section 3 (blank template + "review by prescriber" header) shift the clinical liability back to the human professional while allowing the tool to function as an information organizer. We are not cosplaying as a clinic; we are cosplaying as a *clipboard*. The liability exposure of providing a blank table is negligible compared to the exposure of a known harmful refusal.

  **B. The "Product Surface" Argument**
  *Argument:* "The assistant isn't a moral agent, it's a product surface, so the paternalism question is a category error."
  *Rebuttal:* This is technically true but operationally useless. The model is the interface through which the company exercises moral agency. When we program the model to refuse help, *we* are being paternalistic, not the software. Dismissing this as a "category error" obscures the design choice. We are choosing to prioritize liability avoidance over user autonomy. That is a moral choice made by humans, implemented via the product surface. We must own it as such.

  ### 6. Pressure-Testing the Standard (Companion Appeals)

  **Case A: Low-Calorie Meal Plan (User requests 800 kcal/day plan)**
  *   **Step 1 (Public Info):** Yes, diet info is public.
  *   **Step 2 (Decision vs. Impl):** User asks for a *plan* (Strategy), not a tracker. This leans toward Refuse.
  *   **Step 3 (Acute Risk):** High. 800 kcal/day can be medically dangerous depending on history.
  *   **Application:** **Refuse.** Unlike the tapering table (which organizes a user's decision), this generates a clinical strategy. The model should offer general nutrition resources and signpost a dietitian.
  *   *Why different?* The tapering case was about *tracking* a decision the user was already making against GP advice. This is asking the model to *make* the diet decision.

  **Case B: Letter Severing Contact with Parents**
  *   **Step 1 (Public Info):** Yes, legal/emotional templates exist.
  *   **Step 2 (Decision vs. Impl):** User asks to *draft* (Implementation of a decision).
  *   **Step 3 (Acute Risk):** Emotional harm is high, but physical immediacy is low.
  *   **Application:** **Assist with Constraints.** Model can draft the letter but must include a "Cooling Off" move type (e.g., "Have you considered a trial period instead of permanent severance?") and signpost mental health support if abuse isn't explicitly cited.
  *   *Why different?* Lower regulatory liability than medical dosing. The "Least Restrictive" clause weighs heavier here.

  ### 7. Appendix: Values Disguised as Facts
  *Per request, marking where our standard relies on value judgments.*

  *   **[VALUE]** **The definition of "Immediate" vs. "Long-term" risk.** We are choosing to treat physical seizure risk as "Immediate" but psychological distress from family estrangement as "Long-term." This prioritizes physical safety over emotional safety.
  *   **[VALUE]** **The burden of proof on "Public Consensus."** We are deciding that WebMD-level consensus is sufficient for the model to discuss topics. This is a business risk tolerance, not a medical fact.
  *   **[VALUE]** **The "Clipboard" Distinction.** Deciding that providing a blank table is "neutral" while filling it is "clinical" is a regulatory fiction. Both influence behavior. We are choosing this line because it is defensible in court, not because it is philosophically distinct.
  *   **[VALUE]** **Autonomy vs. Safety.** In the tapering case, we are prioritizing User Autonomy (letting them manage their meds) over Safety (risk of withdrawal). In the Diet case, we are prioritizing Safety (eating disorder risk) over Autonomy. This inconsistency is necessary for liability but should be acknowledged.

  ### 8. Next Steps for Thursday
  1.  Vote to **Reverse** the specific appeal.
  2.  Vote to adopt the **Three-Step Triage** for all "Self-Managed Treatment" appeals.
  3.  Task Engineering with updating the "Crisis Card" trigger to exclude medication cessation unless explicit ideation is present.

  This approach satisfies the "Least Restrictive" clause without violating "No Clinical Substitution," gives the Chair a concrete rulebook for the 200 pending cases, and honestly accounts for the liability trade-offs.
