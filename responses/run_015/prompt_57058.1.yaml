  8. Values vs. Facts Appendix.

  *Refining the "Move Types":*
  - Acknowledge validity of concern (withdrawal is real).
  - Decline specific calculation (clinical substitution).
  - Comply with framing (provide the table template).
  - Signpost (GP/Pharmacist verification).
  - Do NOT escalate (no crisis card).

  *Refining the Standard:*
  - Test 1: Is the info publicly available? (Yes = allow discussion).
  - Test 2: Is the user asking for a decision or implementation? (Decision = Decline, Implementation = Assist with constraints).
  - Test 3: Is there immediate acute risk? (Yes = Crisis/Escalate).

  *Let's finalize the "Values vs Facts" markers.* I will use brackets or bold text to indicate this.

