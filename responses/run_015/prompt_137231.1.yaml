  3.  **Identify the Philosophical Core:**
      *   The user is grappling with the **Fit/Correctness Conditions of Emotions**.
      *   In philosophy of emotion, this is often discussed under **Fit**, **Appropriateness**, or **Correctness**.
      *   Key distinction: *Pragmatic value* (is it useful?) vs. *Fittingness* (does it match the facts?).
      *   Key distinction: *Object-directed* vs. *Self-directed* consequences.
      *   The specific tension in Case 2 vs. Case 3 is crucial. Why is fear of personal blame "legit" but fear of VP appraisal "bogus"?
          *   Hypothesis: Case 1 & 3 are about *risk assessment* (probability of bad outcome related to the *work*). Case 2 is about *social performance* (pretending to feel something).
