      *   Yes. Emotions are generally not under direct voluntary control (Case 4 supports this). If you *can* turn it on, it suggests it's not a genuine emotional response to a threat, but a simulation. This reinforces the "bogus" feeling. Genuine fear overwhelms control.

  8.  **Structure the Argument:**
