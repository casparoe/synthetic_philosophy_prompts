      *   *Check:* Case 7 (Anxiety as evidence). This is "emotional reasoning." Is it valid? Yes, if the emotion is a reliable sensor. I should frame it as "calibrated instrumentation."
      *   *Check:* Case 5 (Resentment). User says usefulness isn't a reason. I agree. Fittingness is separate from utility. I need to make sure I distinguish *Fitting* vs. *Useful*.

