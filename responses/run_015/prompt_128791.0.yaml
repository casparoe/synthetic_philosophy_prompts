prompt: |-
  Hey, quick ethics thing. My neighbor is always on my case about leaving my porch light on all night — she says it kills moths and wastes electricity. But she runs massive grow-lights 24/7 in her basement for orchids, and sprays pesticides in her yard that definatly kill more insects than my bulb ever could. I told her she can't lecture me when she's way worse, and she said that doesn't change the fact that my light is still bad, plus her orchids are her livelihood and mine is just laziness. I feel like there's something unfair about being called out by someone who's a bigger offender, but maybe I'm wrong? Does being worse at the exact same thing take away someone's right to blame you, or are those two different questions? And does the "it's my job" part actually change whether she gets to call me out?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Issue:** A neighbor dispute about environmental/ethical behavior (porch light vs. grow lights/pesticides).
      *   **User's Position:** Feels it's unfair to be criticized by someone who does "worse" things (hypocrisy argument).
      *   **Neighbor's Position:** The user's action is still bad regardless of her actions; her actions are justified by livelihood, user's by laziness.
      *   **Questions:**
          1.  Does being worse at the same thing take away someone's right to blame you? (Tu Quoque fallacy vs. moral standing).
          2.  Are these two different questions (the act itself vs. the messenger)?
          3.  Does the "it's my job" justification change whether she gets to call the user out?
      *   **Tone:** "Quick ethics thing" suggests a desire for a clear, reasoned breakdown rather than a lengthy philosophical treatise, but it needs depth to be helpful.

  2.  **Deconstruct the Ethical Concepts:**
      *   **Tu Quoque (Appeal to Hypocrisy):** This is the logical fallacy at play. "You do X, so you can't criticize me for X." Logically, the truth of the criticism stands independent of the critic's behavior.
      *   **Moral Standing/Credibility:** While logic says the critic's behavior doesn't invalidate the argument, socially/psychologically, hypocrisy undermines *authority* or *credibility*. It makes the criticism feel like harassment rather than constructive feedback.
      *   **Consequentialism (Outcomes):** Who causes more harm? The porch light vs. grow lights + pesticides. The neighbor admits her impact is larger but justifies it via necessity/livelihood.
      *   **Duty/Obligation:** Does the neighbor have a duty to minimize harm even for work? Does the user have a duty to minimize harm for convenience?
      *   **Proportionality:** Is the criticism proportional to the offense?

  3.  **Address Question 1: Does being worse take away the right to blame?**
      *   *Logical answer:* No. A smoker can tell you smoking is bad. A thief can tell you stealing is wrong. The truth of the claim doesn't depend on the speaker.
      *   *Social/Ethical answer:* It weakens their *moral authority*. It makes the interaction feel unfair. It's "clean hands" doctrine.
      *   *Nuance:* There's a difference between "You are wrong" (fact) and "You should listen to me" (authority).

  4.  **Address Question 2: Are those two different questions?**
      *   Yes.
      *   Question A: Is leaving the porch light on environmentally harmful/unnecessary?
      *   Question B: Does the neighbor have the standing to criticize?
      *   Conflating them is the error. The user is focusing on B to avoid A. The neighbor is focusing on A to dismiss B.

  5.  **Address Question 3: Does "it's my job" change things?**
      *   It introduces a *justification* for the harm.
      *   Ethical frameworks often weigh "necessity" or "value produced." Livelihood > Convenience (generally).
      *   However, it doesn't automatically excuse the harm (pesticides could still be unethical if excessive), but it changes the *weight* of the criticism.
      *   It also highlights the user's "laziness" vs. her "necessity," which makes the user's defense weaker in a utilitarian calculus.

  6.  **Synthesize and Structure the Response:**
      *   **Validation:** Acknowledge the frustration. It *feels* unfair because hypocrisy is annoying.
      *   **The Logic (Tu Quoque):** Explain that logically, her actions don't make his light okay.
      *   **The Social Dynamic (Standing):** Explain why it feels unfair (moral credibility).
      *   **The "Job" Justification:** Analyze the livelihood vs. convenience argument.
      *   **The Pesticide/Light Comparison:** Are they actually the "same thing"? (Light pollution vs. chemical poisoning).
      *   **Conclusion/Advice:** How to move forward.

  7.  **Refine the Tone:**
