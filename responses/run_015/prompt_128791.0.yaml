      *   *Is the user actually lazy?* The user admits "mine is just laziness." I should accept that premise for the sake of the ethical argument.
      *   *Is the neighbor right about the electricity?* Yes, leaving lights on wastes energy.
      *   *Key distinction:* The neighbor is arguing about *principle* (light bad), user is arguing about *fairness* (you worse).

  9.  **Drafting the Response (Mental Outline):**
