answer: |-
  The executor obeys the final **will**,
  yet finds an unsent **letter**
  slipped beneath the bottom **drawer**,
  dated back ten **years**,
  begging her not to **burn**
  the manuscript to **silence**.

  Break the **silence** if the art survives,
  though law obeys the **will**.
  Who are we to **burn**
  the truth inside a **letter**?
  Ten **years** can change a mind,
  or just the dust within the **drawer**.

  Unlock the **drawer** and let the pages breathe,
  ending her imposed **silence**.
  What matter **years**
  against a living **will**?
  The heart writes its own **letter**,
  refusing to **burn**.

  Some say better to **burn**
  than ransack every **drawer**.
  An unsent **letter** holds no weight
  against her heavy **silence**.
  The law demands a **will**,
  not hopes from former **years**.

  What weight to give those lost **years**
  compared to the urge to **burn**
  the past? Her living **will**
  is locked inside the **drawer**,
  protected by her **silence**,
  except for this one **letter**.

  We argue over every word of the **letter**,
  counting off the **years**,
  deciding if the **silence**
  is worth more than the **burn**,
  or if the secret **drawer**
  binds us to her **will**.

  One says the **letter** tells us not to **burn**,
  another counts the **years** against the **will**,
  while truth hides in the **silence** of the **drawer**.

  ***

  **Note on Method and Matter**

  Regarding the stability of case intuitions, very little is actually settled. It is robustly replicated that ordering effects and framing details can shift aggregate responses in some philosophical contexts (the "instability" you're tracking). However, the magnitude and prevalence of this instability are contested. Some studies suggest effects are small or limited to specific types of cases, while others find them pervasive. There is no consensus that these intuitions should be "tossed." The dominant views range from the claim that surface noise masks a stable underlying competence (which better methods can isolate) to the claim that we must restrict reliance on intuitions to cases where expertise or convergence is demonstrated. A significant minority argues that if intuitions are this fragile, they cannot bear the weight traditional philosophy places on them, but even then, the proposed remedy (naturalism, coherentism, etc.) is not agreed upon.

  The poem takes a few liberties for the sake of form. Most notably, it dramatizes the "leak" as a clean, deterministic shift: each stanza implies a distinct verdict driven by the rotating end-word. In actual data, these effects are probabilistic and often messy; a knob might shift the mean response slightly without flipping the majority verdict, or only affect a subset of participants. The poem also treats the "knobs" as clearly incidental (e.g., the location of the letter, the passage of time). This leans on the assumption that moral principles should be invariant to such details. That assumption is itself a substantive philosophical claim (invariance) that particularists or contextualists would reject. They might argue that recency or privacy *are* morally relevant, meaning the pump isn't leaking but rather tracking complex features.

  Your setup assumes that if a verdict flips on a "shadow" detail, the principle isn't being tracked. This is the standard interpretation of framing effects, but it presupposes that the framed detail *ought* to be irrelevant. If one holds that context constitutes the moral situation, then sensitivity to the "drawer" or the "years" might be a feature of moral perception, not a bug. The poem leaves this open in the envoi, but the stanzas themselves implicitly treat the shifts as instability rather than legitimate contextual nuance. Finally, the double duty of "will" (document vs. faculty) is a poetic compression; in the literature, these are usually distinguished sharply to avoid equivocation, though the ambiguity is indeed part of why the case feels sticky.
