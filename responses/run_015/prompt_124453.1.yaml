answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Public Realm Design Commission
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Civic Plaza Reconstruction and Governance Framework

  **Introduction**
  The Commission submits this recommendation regarding the reconstruction of Civic Plaza. Our deliberations were guided by the understanding that design is not neutral. We treated the choice between Options A, B, and C as a case study in whether artifacts have politics. We distinguished between arrangements that settle a matter of common life by technical means (whether intended or not) and technologies that are inherently political because they require, or are strongly compatible with, particular organizations of power and authority. Option A (hostile architecture) settles the question of who belongs through physical form; its politics are frozen into the concrete. Option B (sensor-based management) is inherently political in the stricter sense: it requires a continuing apparatus of monitoring, credentialed technicians, and a vendor relationship. This apparatus is internal to the system's operation; without the vendor's code and the staff's dashboard credentials, the plaza ceases to function as designed. Option C addresses the social cause but lies outside our capital remit.

  **Political Architecture and Accountability**
  We stipulated away intentions. The designers of Option A intend durability; the vendor of Option B intends dignity. Yet, the social constructivist objection reminds us that politics lives in surrounding practices. If politics resides in practice, Option B is riskier. Option A's exclusion is visible and legible to anyone who attempts to lie down; the norm is physical. Option B's norm is cheap to revise but invisible, managed by whoever has standing to move a slider. While Option B offers reversibility, Option A offers visibility. For public legitimacy, visibility matters more. A citizen can contest a bench they cannot sleep on; they cannot contest an algorithm they cannot see.

  This asymmetry extends to maintenance. In Option A, the norm is governed by Public Works and anyone with a grinder; it is physically contestable. In Option B, the norm is governed by a vendor release cycle and two staff members with dashboard credentials. This arrangement is less contestable by an ordinary resident. Furthermore, Option B produces a continuous quantitative record of dwell time. Institutional ends tend to drift toward whatever the instrument records. Option A produces silence. While Option B may be more humane moment-to-moment, the data drift makes it susceptible to mission creep, whereas A's silence offers no trigger for review but also no data to manipulate.

  **The Objection of Remit**
  Some members argued the Commission should refuse to decide, noting that the plaza's nighttime use is a housing failure and that choosing between armrests and sensors launders a political decision as a procurement decision. We meet this head-on. Refusing to decide is itself a decision that defaults to the status quo of exclusion. However, we acknowledge that reprogrammability does not escape determinism; it merely relocates the politics from the physical realm to the administrative realm. A slider is still a boundary. Therefore, we cannot treat Option B as a technical fix to a social problem. It is a management tool that must be strictly governed.

  **Recommendation**
  The Commission recommends **Option B**, contingent on the renegotiation of the vendor data-rights clause to allow independent city auditing. We select Option B over Option A because it allows for humanitarian exceptions during extreme weather, which rigid physical design does not. However, to mitigate the risks of opacity and vendor lock-in, we impose the following governance framework:

  1.  **Open Mode Decision Rule:** The system shall be placed in "Open Mode" (suspending deterrents) automatically when the National Weather Service issues a Heat or Cold Emergency warning for the municipality. Manual activation requires a vote of the Public Realm Design Commission.
  2.  **Threshold Standing:** Changes to sensitivity thresholds (e.g., dwell time limits) require a written notice of fourteen days to the Commission. Approval requires a quorum of the Commission plus sign-off from the City Privacy Officer.
  3.  **Sunset and Review:** This pilot expires in thirty-six months. Pre-registered failure criteria include: (i) a false-positive rate for reclining exceeding 5 percent on independent audit; (ii) any use of aggregated data for law enforcement purposes; or (iii) vendor refusal to allow city auditing of classifier performance.

  **Implementation Timeline**
  *   **Months 1-3:** Contract renegotiation and privacy impact assessment.
  *   **Months 4-9:** Hardware installation and baseline data collection (Open Mode only).
  *   **Months 10-12:** Threshold calibration and Commission review.
  *   **Month 13:** Full operational launch.

  **Argument for Rejected Option**
  We reject Option A, though its strongest argument is durability and democratic transparency. Option A's exclusion is honest; it does not hide behind a dashboard. It costs less and requires no ongoing surveillance apparatus, preserving a zone of anonymity in the public realm that Option B eliminates. By producing no data, Option A prevents the institutional drift toward metric-based management of human behavior. For a commission concerned with the long-term independence of public space from private vendor control, Option A is the safer harbor. We override this only because the inability to suspend exclusion during life-threatening weather is an unacceptable moral risk.

  **Limits of Remit**
  Finally, we must clarify what this decision cannot fix. This Commission advises on capital projects; we do not fund housing or social services. Option B manages the symptom of homelessness; it does not cure the cause. We recommend Option B only as a temporary containment strategy that preserves the possibility of humane intervention during emergencies. We advise Council that no design configuration can resolve a housing shortage. If Option C (extended shelter hours and outreach) is not funded concurrently, this design choice merely shifts the location of suffering rather than alleviating it. We have optimized the plaza for management, but only Council can optimize the city for care.
