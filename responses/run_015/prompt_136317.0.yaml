      *   **The Bowling Alley (The Decoupling):** The end state. Daniel has the capital. He rejects the religion. He kills the prophet. This suggests the material base eventually consumes the superstructure. The "Spirit" evaporates, leaving only the "Blood."
      *   **Downward Causation Analysis:** In physics, macro constraints are stable (laws of thermodynamics). In TWBB, the cultural constraints are porous. Daniel leaks through them. He is a "rogue particle." The film suggests cultural values *try* to exert downward causation but fail against a sufficiently concentrated will to power.
      *   **Where Weber Fails:** Weber assumes a shared moral universe. Plainview operates outside morality. Weber's thesis works for the *community* of believers, not the *monster* who exploits them. The film shows the *limit* of the Protestant Ethic: it creates the capital, but the capital eventually kills the ethic.
