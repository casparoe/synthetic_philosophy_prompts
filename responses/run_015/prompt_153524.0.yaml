prompt: |-
  I keep going back and forth on the presentism fight in historiography, and I think the debate keeps spinning because two different things are bundled together. Call the first *verdict* presentism: grading past actors by concepts they couldnt have had — calling an 18th-century removal policy genocidal, reading someone's marriage as coercive. Call the second *salience* presentism: letting present-day concerns pick the question, the archive and the level of description, so a colonial governor's letters about railway tariffs get read as documents about racial capitalism.

  What I want explained is why giving up the first doesn't get you out of the second. A historian who says "I'll only attribute concepts my actors could have had, and I'll hand down no verdicts" is still choosing a topic, a source base and a grain of description from inside the present — why can't that choice be disciplined the way the verdict rule is? And is the asymmetry real: "ask only the questions your period asked itself" seems unavailable as a rule in a way that "don't apply our concepts to them" isn't, because a period doesn't hand you its questions, and most archives only answer questions nobody at the time was asking.

  Use this case to make it concrete: a historian who scrupulously refuses to call anyone in her sources a racist, but organizes her whole book around a category none of them used. Don't just land on "some presentism is unavoidable" — tell me which of the two is doing the real philosophical work, and what the other one is a distraction from.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Issue:** The user distinguishes between two types of presentism in historiography:
          1.  *Verdict Presentism:* Judging past actors by concepts/values they couldn't have had (anachronistic moral/conceptual attribution).
          2.  *Salience Presentism:* Letting present concerns dictate the research question, archive selection, and level of description (framing/selection bias).
      *   **The Problem:** Why does abandoning *Verdict Presentism* not solve the problem of *Salience Presentism*? Why can't the latter be disciplined like the former?
      *   **The Asymmetry:** Why is "ask only questions your period asked" impossible/unavailable, whereas "don't apply our concepts" seems possible (even if difficult)?
      *   **The Case Study:** A historian who refuses to call sources "racist" (no verdict presentism) but organizes the book around a category none of them used (salience presentism).
      *   **The Goal:** Explain *which* of the two is doing the real philosophical work and what the other is distracting from. Avoid the trivial conclusion "some presentism is unavoidable."

  2.  **Deconstruct the Two Types of Presentism:**
      *   *Verdict Presentism* is about *attribution*. It claims truth-values about the past actors' internal states or moral status based on external standards. It's epistemically risky because it violates the principle of charity or contextual understanding.
      *   *Salience Presentism* is about *constitution*. It constructs the object of study itself. History isn't found; it's made through selection.
      *   *The User's Insight:* The debate spins because people think banning Verdict Presentism solves the "bias" problem. But Salience Presentism is constitutive of the discipline.

  3.  **Address the "Why can't Salience be disciplined?" Question:**
      *   Verdict presentism has a clear negative constraint: "Do not say X believed Y if Y didn't exist." It's a rule of *prohibition*.
      *   Salience presentism requires a positive justification: "Why look here?" There is no neutral ground to stand on to select a topic. Every selection is interested.
      *   The archive doesn't speak for itself. It requires a query. A query comes from the querier (the present).
      *   Therefore, Salience Presentism isn't a bug; it's the engine.

  4.  **Address the Asymmetry ("Ask only questions your period asked"):**
      *   Why is this unavailable? Because history is retrospective. We know the outcome. The actors didn't.
      *   Archives are fragments. They survive for reasons unrelated to their future historical utility.
      *   If we only asked questions the period asked, we'd be doing intellectual history of explicit debates, not social history, structural analysis, or history from below.
      *   Example: 18th-century actors didn't ask "How did patriarchy structure property law?" They asked "Is this will valid?" The historian needs the former to explain the latter.

  5.  **Analyze the Case Study (The "Racist" Category):**
      *   Historian refuses to call 17th-century actors "racists" (Verdict constraint honored).
      *   Historian organizes the book around "racial formation" or "white supremacy" (Salience choice).
      *   *Tension:* If none of them used the category, is the category real?
      *   *Resolution:* The category describes a *structure* or *effect*, not necessarily a conscious intent. The historian is studying the *system*, not just the *mindset*.
      *   *Philosophical Work:* Salience Presentism is doing the work of *ontology* (what exists to be studied). Verdict Presentism is doing the work of *ethics/epistemology* (how we judge knowledge/agents).

  6.  **Determine "Which is doing the real philosophical work?":**
      *   *Salience Presentism* is the constitutive condition of historical knowledge. It determines *what* the past is for us.
      *   *Verdict Presentism* is a methodological guardrail. It prevents caricature but doesn't generate knowledge.
      *   *Distraction:* Verdict Presentism is the distraction. It focuses on the *purity of the actor* rather than the *utility of the history*. It makes the debate about moral cleanliness rather than epistemic validity.
      *   *Thesis:* Salience Presentism is the *transcendental condition* of historiography (in a Kantian sense). You can't do history without it. Verdict Presentism is a *normative rule* that is often useful but secondary. The fight focuses on Verdict because it's easier to police (naming and shaming) than Salience (which requires admitting our own situatedness).

  7.  **Drafting the Argument (Iterative refinement):**
      *   *Introduction:* Validate the user's distinction. It's sharp and correct.
      *   *The Trap:* Explain why banning Verdict Presentism feels like a solution but isn't. It creates an illusion of objectivity.
      *   *The Asymmetry:* Explain why "period questions" is a dead end. The past is opaque; the present provides the light.
      *   *The Case:* Use the "racist" example. Show how the structure exists without the label. The historian is tracing a causal mechanism, not assigning a moral tag.
      *   *The Core Philosophical Work:* Argue that Salience Presentism is *ontological* (making the object), while Verdict Presentism is *deontological* (rules of conduct). The debate fixates on the deontological because it's easier, but the ontological is where the history happens.
      *   *Conclusion:* The distraction is the belief that we can escape our presentness. The real work is owning the Salience.

  8.  **Refining the Tone:**
      *   Needs to be philosophical but grounded in historiography.
      *   Avoid platitudes ("everything is subjective").
      *   Focus on the *function* of the concepts.
      *   Use the user's terminology (*Verdict* vs. *Salience*).

  9.  **Self-Correction/Nuance Check:**
      *   *Risk:* Am I saying Verdict Presentism doesn't matter? No, it matters for accuracy. But it's not the *foundation* of the discipline.
      *   *Risk:* Is "Salience Presentism" just "selection bias"? No, it's deeper. It's about the *conceptual grid* laid over the past.
      *   *Key Insight:* The archive is silent until questioned. The question comes from the present. Therefore, the present constitutes the historical object. Verdict presentism tries to keep the *answer* pure, but Salience presentism admits the *question* is impure.

  10. **Final Polish:** Ensure the distinction between "concepts actors had" and "categories historians use" is clear. The historian's category (e.g., "racial capitalism") is an analytical tool, not necessarily an emic term. This is the crux of the asymmetry.

  *(Self-Correction during drafting)*: I need to make sure I answer "why can't that choice be disciplined the way the verdict rule is?"
  *Answer:* Because there is no neutral standpoint from which to discipline it. The verdict rule relies on a checkable fact (did the word/concept exist?). The salience rule relies on a justification of interest (why does this matter?), which is inherently subjective/presentist.

  *(Final Plan)*:
  1. Acknowledge the distinction.
  2. Explain the Asymmetry (Epistemic access vs. Constitutive framing).
  3. Analyze the Case (Structure vs. Intent).
  4. Identify the Real Work (Salience = Ontology, Verdict = Ethics).
  5. Identify the Distraction (The myth of the View from Nowhere).
  6. Conclude on the necessity of owning Salience Presentism.cw
answer: |-
  Your distinction is precise, and it cuts through the usual fog of the presentism debate. You have identified that *Verdict Presentism* is a rule of **attribution** (what we can say the past *was*), while *Salience Presentism* is a rule of **constitution** (what we make the past *mean*).

  The reason giving up Verdict Presentism doesn't solve the problem is that Verdict Presentism is a negative constraint, whereas Salience Presentism is a positive condition of possibility. You can obey a prohibition; you cannot obey a condition of existence without ceasing to exist.

  Here is why the asymmetry holds, why Salience cannot be disciplined like Verdict, and which one is actually doing the philosophical heavy lifting.

  ### 1. The Asymmetry of Access
  The rule "don't apply concepts they didn't have" (Verdict) relies on a checkable empirical fact. We can determine, through textual evidence, whether an 18th-century actor possessed the concept of "genocide" or "sexual harassment." It is a boundary of *epistemic access*. We can police this because we can point to a silence in the archive and say, "The word isn't there, the concept isn't there."

  The rule "ask only the questions your period asked" (the proposed discipline for Salience) is impossible because history is fundamentally **retrospective**.
  *   **The Archive is Fragments:** The archive does not preserve itself based on future historical utility. It preserves based on power, accident, and bureaucracy. To make those fragments speak, you must impose a grid of intelligibility that the fragments themselves do not possess.
  *   **The Outcome Problem:** The actors did not know they were in "the antebellum period." They were in the present. They didn't know the Civil War was coming. A historian asking "How did this policy contribute to the war?" is asking a question that *could not exist* for the actor. If you forbid that question, you forbid causal explanation.
  *   **Structural Blindness:** Actors rarely have the vocabulary to describe the structures they inhabit. A fish does not have a concept of "water." If a historian only asks questions the fish asks, they will never discover the water. Salience Presentism is the tool that allows us to describe the water.

  Therefore, Salience Presentism cannot be disciplined by a rule like Verdict Presentism because there is no "neutral" archive waiting to be queried. The query *creates* the object. To discipline the query would require a standpoint outside of time—a View from Nowhere—which is exactly what historicism denies exists.

  ### 2. The Case: The "Racist" Who Wasn't
  Let's apply this to your historian who refuses to call 17th-century actors "racists" (Verdict constraint) but organizes her book around "racial formation" (Salience choice).

  *   **The Verdict Move:** She acknowledges that "race" as a biological taxonomy or "racism" as a moral failing were not coherent concepts for her actors. To call them "racists" would be to impute a modern psychological interiority they didn't possess. This preserves the *integrity of the agent*.
  *   **The Salience Move:** She organizes the book around "racial formation" because she observes a *pattern of effects* (labor stratification, legal codification of skin color, social exclusion) that functions *like* racism, even if the actors called it "civilization," "heathenism," or "custom."

  **Why this creates tension:**
  Critics will say she is being inconsistent. "If they weren't racists, how can you write a book about racism?"
  **The Resolution:** She is not studying the *mindset* of the actors (which requires Verdict accuracy); she is studying the *system* they built (which requires Salience framing).

  The category "racial capitalism" is an **analytic tool**, not an **emic term**. It functions like "gravity." Newton's contemporaries didn't have the concept of "gravity" as a universal force; they spoke of "attraction" or "weight." But a historian of science can write a book about "the discovery of gravity" without attributing the concept to every apple-dropper.

  However, in social history, the stakes are higher because the "gravity" is moral. The historian is using a present-day category to trace a causal mechanism that the actors were blind to. This is Salience Presentism doing its work: it makes visible a structure that was invisible to the participants.

  ### 3. Which is doing the Real Philosophical Work?
  **Salience Presentism is doing the ontological work.**
  **Verdict Presentism is doing the ethical work.**

  The debate spins because historians confuse the two. They think that by policing the Ethics (Verdict), they are securing the Ontology (Truth). They aren't.

  *   **Salience Presentism constitutes the object.** It decides what counts as history. Without it, you have chronicle, not history. It determines that "the economy," "gender," or "race" are valid lenses. This is the heavy lifting. It is the claim that the past has patterns that are only visible from a specific future vantage point. This is where historical knowledge is actually generated.
  *   **Verdict Presentism manages the relationship.** It is a rule of charity. It prevents us from turning past actors into caricatures or villains for our own gratification. It is necessary for *accuracy*, but it does not generate *insight*.

  **The Distraction:**
  Verdict Presentism is the distraction. It is the focus of the culture-war fights because it is easily policed and morally legible. It allows historians to signal virtue ("I am not judging the past by today's standards") while ignoring the deeper implication of their own methodology.

  Focusing on Verdict Presentism allows the discipline to maintain the illusion that if we just stop using the word "racist," we have achieved objectivity. But if the *structure* of the book is organized around a modern critique of racial hierarchy, the history is still presentist in the deeper, Salience sense. The Verdict rule becomes a shield that protects the Salience choice from scrutiny.

  ### 4. Why Salience Can't Be Disciplined
  You asked: *Why can't that choice [Salience] be disciplined the way the verdict rule is?*

  Because Verdict Presentism relies on a **correspondence theory of truth** (Does the label match the mental state?), while Salience Presentism relies on a **coherence/utility theory of truth** (Does this framing explain the data better than alternatives?).

  You cannot discipline utility with a prohibition. You can only argue for it with better arguments.
  *   If I say, "I am studying colonial tariffs through the lens of racial capitalism," you cannot prove me wrong by pointing to a dictionary from 1750.
  *   You can only prove me wrong by showing that "racial capitalism" explains *less* than "mercantilism" or "imperial administration."

  This makes Salience Presentism inherently political and philosophical. It admits that history is written from a situated perspective. Verdict Presentism tries to hide that situatedness behind a rule of "fairness."

  ### Conclusion
  The asymmetry is real because **Verdict Presentism is about the past's self-understanding, while Salience Presentism is about our understanding of the past.**

  The historian who refuses to call actors "racist" but writes about "racial formation" is admitting that the past is stranger than the actors knew. She is claiming that the *consequences* of their actions created a reality (racism) that exceeds their *intentions*.

  The real philosophical work is being done by **Salience Presentism**. It is the engine of historical knowledge. It acknowledges that the past is not a foreign country waiting to be visited; it is a ruin that we rebuild using the blueprints of our present concerns.

  **Verdict Presentism is the distraction.** It is a methodological hygiene that prevents caricature, but it is often wielded as a talisman to ward off the accusation that history is always, inevitably, a conversation between the present and the dead. By focusing on the "verdict," the discipline pretends it can achieve a purity of representation that its "salience" choices have already foreclosed. The debate should not be about whether we are presentist (we are), but about whether our presentist questions are *good* ones.
