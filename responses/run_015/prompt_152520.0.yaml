  Dear friend,

  Your observation regarding the three-layer architecture of symbolic causation is remarkably astute, and it touches upon one of the most persistent and difficult problems in the philosophy of mind and cognitive science. To answer your primary question directly, there is no single established proper noun in the academic literature that names this specific three-layer configuration exactly as you have described it, largely because the specific terminology you are using for the intermediate layer is already associated with a particular thinker. The terms careenium and simmballs were coined by Douglas Hofstadter, most notably in Gödel, Escher, Bach and later in I Am a Strange Loop, to describe precisely the phenomenon you are analyzing. Hofstadter used the metaphor of a careenium, a frictionless surface populated by moving simmballs, to illustrate how high-level symbolic patterns could emerge from and constrain low-level physical particles without violating physical laws. If you have arrived at these terms independently in your private notes, you have converged on a well-known metaphorical framework used to discuss emergent causation. However, while the specific labels are Hofstadter's, the structural pattern you have identified does have a mapped lineage in broader philosophy, though it is usually discussed under the headings of non-reductive physicalism, mechanistic explanation, or the levels of abstraction in computational theory.

  The philosophical structure you have delineated is essentially a specific version of non-reductive physicalism that attempts to solve the problem of mental causation. In standard philosophical discourse, your top layer corresponds to the semantic or syntactic level of description, your bottom layer corresponds to the physical implementation, and your intermediate careenium corresponds to the functional organization or the computational level of analysis. This tripartite structure is very similar to David Marr's levels of analysis, which distinguish between the computational level, the algorithmic level, and the implementational level. However, your focus is specifically on the causal efficacy of the middle layer, which shifts the discussion from mere description to ontology. The debate you describe, where one side argues the middle layer preserves autonomy and causal closure while the other argues it collapses or introduces magic, is the central tension in the debate over downward causation. This is most rigorously formulated in the work of Jaegwon Kim, who argued against non-reductive physicalism using the causal exclusion argument. Kim's challenge is exactly what your skeptics are voicing: if the physical substrate is causally closed, there is no work left for the middle layer to do, unless the middle layer is identical to the substrate, in which case it loses its autonomy.

  You asked how this differs from standard functionalism, and the distinction is subtle but significant. Standard functionalism typically identifies mental states directly with functional states, effectively collapsing your top and middle layers into a single category defined by causal roles. In classical functionalism, a mental state is defined by its input-output relations and its relation to other mental states, without necessarily positing a distinct ontological layer of functional organization that sits between the symbol and the silicon. Your model, by contrast, explicitly reifies the intermediate layer as a distinct locus of causal pressure. You are treating the functional organization not just as a way of describing the system, but as a genuine structural entity that mediates causation. This aligns more closely with the new mechanistic philosophy of science, advocated by thinkers like William Bechtel and Carl Craver, who argue that mechanisms are organized entities whose activities constitute phenomena. In this view, the careenium is the mechanism's organization, which is real and causally relevant because changing the organization changes the output, even if the organization is realized by physical parts.

  This picture also differs from the symbol grounding problem as it is usually formulated. The symbol grounding problem, associated with Stevan Harnad, concerns semantics and meaning. It asks how symbols get their meaning rather than just shuffling around based on shape. Your question is about causation and power. You are asking how the symbols move the matter, not how the symbols mean anything. While the two problems are related, as meaning often implies a capacity to guide action, your three-layer model is focused on the mechanics of influence. A system could theoretically have a careenium that causally influences the substrate without the symbols having any external meaning or grounding. Therefore, your structural pattern addresses the efficacy of computation rather than the semantics of representation. It is a question of how abstract rules become physical forces, whereas symbol grounding is a question of how abstract rules connect to the world.

  Regarding the debate about whether the middle layer saves downward causation or merely relocates it, this is the precise edge of the current philosophical map. Those who defend the middle layer are typically advocating for a view called realization physicalism or compatibilist downward causation. They argue that higher-level properties are multiply realizable and thus distinct from lower-level properties, allowing them to have their own causal powers without violating physical closure because the higher-level cause is realized by the lower-level cause. The skeptics you mention are typically reductionists or exclusionists who argue that multiply realizable kinds are not genuine natural kinds and therefore cannot enter into strict causal laws. If there is no standard term for your specific three-layer picture, it is because philosophy tends to categorize by the solution offered rather than the structure itself. You might describe this phenomenon as the problem of mediating causal efficacy in layered computational systems. It belongs to the domain of philosophy of computation and cognitive science, specifically where these fields overlap with metaphysics.

  To precisely delineate the phenomenon as you requested, what belongs to this category are any models that posit an intermediate organizational structure between syntax and physics to explain causal power without dualism. This includes Hofstadter's careenium, Marr's algorithmic level, and mechanistic models of organization. What does not belong to it are dualist models that posit a non-physical mind pushing on physical brain matter, as your model insists the middle layer is defined by causal roles within the substrate. It also excludes eliminativist models that deny the reality of the top layer entirely, claiming only neurons exist. The edges of this concept lie at the boundary of ontology and explanation. If the middle layer is viewed merely as a useful fiction for humans to understand the system, it falls into instrumentalism. If it is viewed as a real thing that pushes particles around, it falls into non-reductive physicalism. Your specific formulation sits at the intersection of these views, asking whether the functional organization is robust enough to be a causal agent in its own right.

  In summary, while there is no single label like The Careenium Argument in the broader literature outside of Hofstadter scholarship, the structural pattern you have noticed is the central architecture of non-reductive physicalist accounts of cognition. The debate you have identified is the causal exclusion problem applied to computational systems. By using the terms careenium and simmballs, you are aligning yourself with Hofstadter's specific attempt to visualize this solution, but the philosophical heavy lifting is done by the broader literature on realization and mechanistic explanation. You have correctly identified that the crux of the matter is whether the intermediate layer is a genuine causal buffer or merely a descriptive convenience. This is the exact hinge upon which the viability of cognitive science as a distinct discipline from neuroscience turns. If the careenium collapses, cognitive science reduces to physics. If it holds, cognitive science studies real causal patterns that are invisible to physics. I hope this mapping helps you situate your private notes within the wider conversation, and I encourage you to explore the literature on mechanistic explanation and the causal exclusion argument to see how your careenium model withstands the rigorous objections raised by reductionists.

