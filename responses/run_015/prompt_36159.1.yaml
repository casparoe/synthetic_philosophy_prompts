  # Lesson Plan: The Paired Mugging
  **Course:** Upper-Level Decision Theory Seminar  
  **Time:** 90 Minutes  
  **Students:** 14 (7 Pairs)  
  **Topic:** Counterfactual Mugging (Functional/Timeless Decision Theory)  
  **Materials:** 7 Coins, 14 Envelopes, 56 "Seminar Tokens" (cardstock), Whiteboard.

  ## I. Preparation & Stakes (Non-Monetary)
  To avoid gambling policies while maintaining visceral stakes, use **Seminar Privilege Tokens**.
  *   **Endowment:** Each student receives 2 Tokens at the start.
  *   **Value:** 3 Tokens can be redeemed for one of the following: (1) A 24-hour extension on any response paper, (2) The right to choose one seminar reading topic, or (3) A $15 coffee voucher (funded by you).
  *   **The Deal:** Paying costs **1 Token**. Winning grants **4 Tokens**.
  *   **Net Utility:** For the *Pair*, paying is +3 Tokens. For the *Payer*, it is -1 Token.

  ## II. The Setup (15 Minutes)
  **Facilitator Script:**
  "We are going to run a decision game. There is no theory lecture today. You will not know the name of the problem until the end. Your goal is to maximize your Token count.

  1.  **Form Pairs:** I am assigning you 7 pairs randomly. Sit facing each other.
  2.  **Assign Roles:** In each pair, one of you is **Role H** (Heads), the other is **Role T** (Tails). Write this on your desk. Do not swap.
  3.  **The Rules:**
      *   I will flip a coin for your pair.
      *   **If Heads:** Role H is the **Decider**. Role T is the **Beneficiary**.
      *   **If Tails:** Role T is the **Beneficiary**. Role H is the **Counterfactual**.
      *   **The Payoff Structure:**
          *   **In Heads:** Role H chooses **Pay** (H loses 1 Token, T gains 4) or **Refuse** (No change).
          *   **In Tails:** Role T gains 4 Tokens *if and only if* Role H *would have* Paid.
      *   **Verification:** In Round 1, if Tails comes up, I will ask Role H publicly what they *would have* done. In Round 2, we will change how we verify this."

  **Note:** Do not explain *why* Tails depends on H's disposition. Let the absurdity sit.

  ## III. Round 1: Spontaneous Decision (20 Minutes)
  **Goal:** Elicit raw intuition without binding mechanisms.
  1.  **Private Thought (2 mins):** Tell Role H: "Think about what you would do if Heads comes up. Do not tell Role T."
  2.  **The Flip:** Each pair flips their coin (student-flipped, caught on wrist, shown to class).
  3.  **Execution:**
      *   **Heads Pairs:** Role H announces **Pay** or **Refuse**. Tokens are exchanged immediately.
      *   **Tails Pairs:** Facilitator turns to Role H. "Heads did not happen. But Role T gets the 4 Tokens only if you *would have* Paid. Would you have Paid?"
      *   Role H answers publicly. Tokens awarded accordingly.
  4.  **Record:** Write results on the board (Pair #, Coin, Decision, Outcome).

  **Predictable Failure 1 (The Lie):** In Tails pairs, Role H will almost certainly say "Yes" to help their partner, even if they intended to Refuse in Heads. This costs them nothing.
  **Facilitator Action:** Do not correct this. Note it silently. It demonstrates the *credibility problem* of counterfactuals.

  ## IV. Round 2: Public Precommitment (20 Minutes)
  **Goal:** Test if binding the "Counterfactual" changes the "Actual" decision.
  1.  **Reset:** Return Tokens to start positions (2 each). Keep pairs/roles.
  2.  **The Mechanism:** Hand each Role H an envelope and a slip of paper.
  3.  **Instruction:** "Before the flip, Role H must write **PAY** or **REFUSE** on the slip, seal it in the envelope, and sign across the seal. This is now a binding contract. If Heads, you must obey the slip. If Tails, we open the slip to determine Role T's reward."
  4.  **The Wait:** Role H writes and seals. Role T watches (cannot speak).
  5.  **The Flip:** Pairs flip coins.
  6.  **Execution:**
      *   **Heads:** Open envelope. Enforce decision.
      *   **Tails:** Open envelope. Award T based on text.
  7.  **Record:** Write results on the board next to Round 1 data.

  ## V. Debrief & Theory Mapping (35 Minutes)
  *Do not move to the board until the game is fully complete.*

  ### 1. Naming the Problem (5 mins)
  "Reveal the name: **Counterfactual Mugging** (Parfit/Soares/Yudkowsky).
  *   **Standard Case:** Omega flips a coin. If Heads, asks for \$100. If Tails, gives \$10,000 *if* Omega predicted you would pay \$100 in Heads. You are in Heads.
  *   **Our Case:** Role H = You in Heads. Role T = You in Tails. The Envelope = Your Decision Algorithm/Disposition."

  ### 2. The Paired Objection (10 mins)
  **Prompt:** "In the standard case, the Tails-you doesn't exist. Here, Role T was a real person sitting in front of you. Does this game prove you should pay the mugger?"
  **Discussion Points:**
  *   **Empathy vs. Identity:** In class, Role H paid (or lied) because they saw Role T's face. In the standard case, you must care about a *non-existent* version of yourself.
  *   **The Transfer Question:** Does the intuition "I should help my partner" transfer to "I should help my counterfactual self"?
      *   *CDT View:* No. The coin is already flipped. Your action now cannot change the past prediction.
      *   *FDT/EDT View:* Yes. You are not deciding for this moment; you are deciding for the *algorithm* that runs in both branches.
  *   **Key Insight:** The paired game makes the *social* cost of refusal visible. The standard case requires you to internalize that social cost as *rational consistency*.

  ### 3. Moralizing the Refuser (10 mins)
  **Prompt:** "Look at the pairs where Role H Refused in Round 2 (or wrote Refuse). Do they have standing to moralize at Role T? Is Refusing a mistake, a judgment, or rational?"
  **Discussion Tracks:**
  *   **The Mistake View:** They failed to maximize expected value (EV). The Pair lost net tokens. They are irrational agents.
  *   **The Self-Locating View:** Role H knows "I am the Payer." Role T knows "I am the Receiver." From Role H's perspective *before* the flip, Paying is good. From Role H's perspective *after* Heads, Paying is a loss. Refusing is rational *conditional on knowing you are in Heads*.
  *   **The Precommitment View:** If you cannot precommit (Round 1), Refusing is the only stable strategy. If you *can* precommit (Round 2), Refusing is a failure of will.
  *   **Conclusion:** Moralizing is only valid if the agent had the capacity to bind their future self. If they lacked that capacity (Round 1), Refusal is tragic but rational.

  ### 4. Predictable Failures & Handling (10 mins)
  *Be honest with the class about what likely went 'wrong' in the design.*

  **Failure A: Side Payments (The Coasean Bargain)**
  *   **What happens:** In Round 1 or between Round 2 flips, Role T whispers to Role H: "If you Pay, I'll give you 2 of my 4 Tokens back."
  *   **Why it's interesting:** This *solves* the mugging by changing the payoff matrix. It turns a Decision Theory problem into a Game Theory bargaining problem.
  *   **Facilitator Handle:** "If you did this, you inadvertently discovered **Acausal Trade**. You treated your partner as a trading node rather than a counterfactual. This is how FDT agents solve Newcomb-like problems with other agents. But does it work with *yourself* across time?"

  **Failure B: The Round 1 Lie**
  *   **What happens:** Role H says "Yes" in Tails but would have said "No" in Heads.
  *   **Why it's interesting:** It shows that without binding (Round 2), counterfactual claims are cheap talk.
  *   **Facilitator Handle:** "This proves why Precommitment (Round 2) is necessary. Omega doesn't listen to lies; Omega reads your source code. The Envelope was your source code."

  **Failure C: Distrust of the Coin**
  *   **What happens:** Students suspect the Prof rigged the flips to force Heads.
  *   **Facilitator Handle:** "Decision theory assumes the probabilities are known. If you doubt the coin, you aren't playing the Mugging; you're playing 'Trust the Prof.' Always use student-flipped coins to isolate the decision."

  ## VI. Closing (5 Minutes)
  "Next week, we formalize this. We will ask: If you are the algorithm, not the instance, does the coin flip matter? For now, look at your Token count. The pairs with the most tokens likely treated the Pair as the Agent, not the Individual. Decide if that's a bug or a feature."

  ---

  # Facilitator's Cheat Sheet: Predictable Failures

  | Failure | Symptom | Philosophical Significance | How to Handle |
  | :--- | :--- | :--- | :--- |
  | **Side Payments** | Role T offers Tokens to Role H to induce Paying. | Converts Mugging to Bargaining. Validates FDT "Acausal Trade" intuition but bypasses the "Self" problem. | **Allow it.** Highlight it in debrief. Ask: "Can you bribe your future self?" |
  | **The Tails Lie** | Role H claims they "Would Have Paid" in Round 1 Tails, but clearly wouldn't have. | Demonstrates the **Credibility Gap**. Counterfactuals need binding mechanisms (Envelopes/Omega) to be real. | **Expose it.** Ask H: "If I flipped again right now, would you pay?" |
  | **Role Confusion** | Role T tries to decide in Heads round. | Breaks the "Single Agent" model. Turns it into a democracy. | **Intervene.** "Only Role H speaks in Heads. You are one brain with two mouths." |
  | **Token Apathy** | Students don't care about the Tokens. | Stakes too low. Intuition doesn't trigger. | **Escalate.** Remind them of the "Drop a Paper" redemption option mid-game. |
  | **CDT Dig-In** | Students insist Refusing is rational because "The coin is already flipped." | Classic Causal Decision Theory stance. | **Validate.** "Correct for CDT. The question is: Do you want to *be* the kind of agent that flips that way?" |

  # Notes on the "Paired" Innovation
  *   **Why it works:** It externalizes the internal conflict. The "Guilt" Role H feels looking at Role T is a proxy for the "Rational Regret" an agent should feel violating their own policy.
  *   **Why it fails:** It introduces *altruism*. Students might Pay just to be nice to their partner, not because of decision theory.
  *   **Correction:** In the debrief, explicitly separate **Altruism** (I want T to win) from **Rationality** (I want the *Policy* that makes T win to be mine). If they Paid only because they liked their partner, the intuition does *not* transfer to the solo case. Ask: "Would you pay if Role T was a stranger? If Role T was a clone? If Role T was you next Tuesday?"
