prompt: |-
  I teach an upper-level seminar on decision theory — fourteen students, one 90-minute session, and they've already spent a week on Newcomb's problem, so they know the shape of a fight between causal and evidential reasoning but haven't met the case where the two-branch structure is sharper. Design an in-class game of counterfactual mugging with real (non-monetary) stakes, arranged so that students feel the pull of paying the mugger before any theory is named. I want one genuinely novel structural element: run it in pairs, where each pair collectively plays a single agent facing one coin flip, but one student is assigned the heads-branch and the other the tails-branch, so the "counterfactual you" that the thought experiment merely imagines is an actual person in the room with an actual stake in whether their counterpart hands over the money. Rules, a payoff scheme, and a way to randomize the flip so students can't suspect the facilitator. Then a second round where agents are invited to publicly precommit before the flip, so we can see who changes their answer and whether the change tracks anything coherent. The debrief should map the game onto the standard case, and then confront the obvious objection — that pairing branches makes the game playable precisely by destroying the feature that makes the thought experiment interesting, since in the real case the other-branch self never exists and can never confront you. Be explicit about which intuitions the paired version elicits and whether those intuitions transfer to the unpaired case. Also include a follow-on discussion, still in the debrief, of whether students' behavior in the game gives them any standing to moralize at people who refuse to pay: is refusing to pay a mistake, a legitimate self-locating judgment, or just the rational thing for an agent who cannot precommit? Give the facilitator an honest list of what will predictably go wrong the first time this is run — including the strong possibility that students