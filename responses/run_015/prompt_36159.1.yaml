      *HOW TO FIX:* The roles must be assigned *after* the flip? No, prompt says "assigned... so the counterfactual you... is an actual person."
      *Okay, the "Agent" is the Pair.* The Pair doesn't know which branch will activate.
      *But the *Individuals* know their role.*
      *This is the tension.* A knows "I am the sacrifice." B knows "I am the beneficiary."
      *If they act as a Pair (Agent), they maximize joint utility.*
      *If they act as Individuals, A refuses.*
      *This perfectly mirrors the "Self" vs "Counterfactual Self" tension.* The "Self" (A) wants to keep tokens. The "Agent" (Pair) wants to win.
