answer: |-
  You should tap **SPLIT**.

  Your second flatmate is intuitively right, but your first flatmate is making the classic mistake of ignoring the correlation created by the matching algorithm. Here is the arithmetic, the reasoning, and the tipping point.

  ### 1. The Arithmetic (Expected Value)

  Since you want to maximize the average payout (Expected Value or EV), we calculate the return for each choice based on the probability that your partner matches your decision.

  The app states that people matched your way pick the **same option 72% of the time**. This means if you choose an option, there is a 0.72 probability they chose the same one, and a 0.28 probability they chose the opposite.

  **If you tap SPLIT:**
  *   **72% chance** they also SPLIT: You get **$600**.
  *   **28% chance** they TAKE: You get **$0**.
  *   $EV(\text{SPLIT}) = (0.72 \times 600) + (0.28 \times 0) = \mathbf{\$432}$

  **If you tap TAKE:**
  *   **72% chance** they also TAKE: You get **$100**.
  *   **28% chance** they SPLIT: You get **$1000**.
  *   $EV(\text{TAKE}) = (0.72 \times 100) + (0.28 \times 1000) = 72 + 280 = \mathbf{\$352}$

  **Verdict:** SPLIT earns you an average of **$80 more** per game than TAKE.

  ### 2. Why Your Flatmates Are Arguing

  This is a famous problem in decision theory (a variant of *Newcomb's Problem* or the *Twin Prisoner's Dilemma*).

  *   **Flatmate 1 (The Causal Argument):** They are using *Causal Decision Theory*. They argue that your tap cannot physically change what the other person already tapped (since it's simultaneous/anonymous). Therefore, you should treat their choice as fixed. If their choice is fixed, TAKE always pays more ($1000 > $600 and $100 > $0). **This is wrong** because it ignores the matching algorithm. Your decision doesn't *cause* theirs, but it is highly *predictive* of theirs.
  *   **Flatmate 2 (The Evidential Argument):** They are using *Evidential Decision Theory*. They recognize that your choice is *evidence* of what the other person chose. Because you were matched by similarity, choosing SPLIT makes it highly probable (72%) that the "universe" you are in is one where both of you split. **This is correct** for maximizing payout in this specific setup.

  ### 3. How far off do the numbers have to be to flip?

  You asked where the tipping point lies. Let $p$ be the probability that your match picks the same option as you.

  *   $EV(\text{SPLIT}) = 600p$
  *   $EV(\text{TAKE}) = 100p + 1000(1 - p)$

  Set them equal to find the break-even point:
  $$600p = 100p + 1000 - 1000p$$
  $$600p = 1000 - 900p$$
  $$1500p = 1000$$
  $$p = \frac{1000}{1500} = \frac{2}{3} \approx \mathbf{66.7\%}$$

  **The Threshold:**
  *   If the match correlation is **above 66.7%**, you should **SPLIT**.
  *   If the match correlation is **below 66.7%**, you should **TAKE**.

  Since the app gives you **72%**, you are safely in SPLIT territory.

  ### 4. What about the 70% global stat?

  The statistic that "70% of all users tap SPLIT" is mostly noise (a distractor), but it explains why Flatmate 1 is so tempting.

  If the matching was random (no correlation), you would assume a 70% chance the other person SPLITs regardless of what you do.
  *   Random Match EV(SPLIT) = $0.70 \times 600 = \$420$
  *   Random Match EV(TAKE) = $(0.70 \times 1000) + (0.30 \times 100) = \$730$

  In a random match, TAKE is a no-brainer. The 72% correlation is the *only* thing that flips the script. It buys you the difference between the \$352 (Take EV) and \$432 (Split EV).

  **Summary:** Tap **SPLIT**. The matching algorithm turns your decision into a proxy for theirs, making cooperation the mathematically superior choice.
