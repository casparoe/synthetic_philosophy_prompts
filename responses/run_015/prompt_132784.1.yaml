prompt: |-
  Hi. I work in the clerk's office of a fairly religious mid-sized city council, and one of my jobs is screening the written submissions we read into the record at public hearings (evangelical and Catholic churches, two mosques, a gurdwara, a very active secularist association, assorted resident groups). Our standing orders say a submission should offer reasons that all members of the public can reasonably be expected to accept regardless of their religion or worldview, which is obviously some version of the public reason idea, but nobody has ever turned it into anything you could actually run. We recieve 30–40 submissions a week, one or two pages each, we've got about three minutes per submission, we can't research the religion involved, if we leave something out we have to print a one-sentence reason that will survive appeal to a panel of elected members, and our lawyers say we can't exclude anything because of who the speaker is, only because of what the argument says.

  So: give me a procedure. The questions in order, what counts as a pass at each one, where it stops and excludes, where it kicks the thing back for one rewriten version, and where it has to hand the call to a person because it's a judgement call dressed up as a rule. Two of my boss's ideas are in the mix and I want you to tell me if they're mistakes: she thinks people should always be allowed to make their point in religious language as long as they also attach a secular version of the same argument (a translation proviso, she calls it), and she thinks the rule should only really bite at the final vote and not during early hearings. Then run the procedure on three cases: (1) a church's one-page submission against a medically-assisted-dying resolution arguing that life is a gift from God and suffering can be redemptive, no secular premises anywhere; (2) an interfaith housing coalition submission supporting a zoning change that opens with a verse about hospitality to the stranger and then gives three paragraphs of rent and vacancy statistics; (3) a secular tenants' union submission on the same zoning change that never mentions religion but whose whole case rests on the inherent dignity of every person, which their own newsletter says they took from Catholic social teaching. I'd be annoyed if the procedure threw out (3), so if it does, say so plainly, and if it does something else I won't like elsewhere, say that too. Also be honest about which of your steps are really just someone's politics arranged as a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Clerk's office staff in a religious mid-sized city council.
      *   **Task:** Screen written submissions for public hearings based on "public reason" standing orders (reasons all members of the public can reasonably accept regardless of religion/worldview).
      *   **Constraints:**
          *   30-40 submissions/week, 1-2 pages each.
          *   ~3 minutes per submission review.
          *   No research into specific religions allowed.
          *   Exclusions require a one-sentence reason (appeal-proof).
          *   Lawyers say: Exclude based on *argument content*, not *speaker identity*.
          *   Must identify: Procedure steps (questions, pass/fail criteria, stop points, rewrite options, human escalation).
          *   Must evaluate Boss's two ideas (Translation Proviso, Timing of Rule).
          *   Must test procedure on three specific cases.
          *   Must be honest about political bias disguised as rules.
          *   User preference: Don't want Case 3 thrown out.

  2.  **Analyze the Core Problem (Public Reason):**

      *   *The Theory:* Rawlsian public reason suggests political decisions should be justified by reasons accessible to all citizens, not comprehensive doctrines (like religion).
      *   *The Practice:* It's notoriously hard to implement. What counts as "secular"? Is "human dignity" secular or Catholic? Is "utility" secular or utilitarian?
      *   *The Constraint:* The clerk needs a *heuristic*, not a philosophy thesis. Speed and defensibility are key.

  3.  **Evaluate Boss's Ideas:**

      *   *Idea 1: Translation Proviso (Religious language okay if secular version attached).*
          *   *Pros:* Inclusive, respects speech, aligns with "what the argument says" not "who says it."
          *   *Cons:* Can be burdensome for submitters, might lead to "god-washing" (tacking on a weak secular reason).
          *   *Verdict:* Generally sound for *admissibility*, but needs strict enforcement on the *quality* of the secular translation.
      *   *Idea 2: Rule only bites at final vote, not early hearings.*
          *   *Pros:* Allows full debate early on.
          *   *Cons:* Creates inconsistency. If a submission is "invalid" for the vote, why is it valid for the record earlier? It wastes time. However, for *screening* purposes, if the goal is to curate the *record* for the decision-makers, applying it late undermines the screening process.
          *   *Verdict:* Risky. If the standing order applies to "submissions read into the record," it should apply consistently. Applying it only at the vote makes the screening job pointless until the end.

  4.  **Drafting the Procedure (The "Heuristic"):**

      *   *Goal:* Fast, defensible, neutral.
      *   *Step 1: The "Who" Check.* (Lawyer's constraint). Ensure we aren't rejecting based on the logo/letterhead.
      *   *Step 2: The "Translation" Check.* (Boss's Idea 1). Is there a non-religious reason provided?
      *   *Step 3: The "Accessibility" Check.* Does the secular reason rely on specialized theological knowledge to make sense?
      *   *Step 4: The "Policy Link" Check.* Does the reason actually support the specific policy action?
      *   *Escalation:* When does a human decide? When the "secular" reason is dubious (e.g., "Natural Law").
      *   *Rewrite:* Allow one chance if the core argument is there but phrased poorly.

  5.  **Testing the Cases:**

      *   *Case 1 (Church vs. MAID):* "Life is gift from God," "Suffering redemptive." No secular premises.
          *   *Result:* Fail. No translation. Purely comprehensive doctrine.
          *   *Reason:* "Submission relies exclusively on theological premises not accessible to non-adherents."
      *   *Case 2 (Interfaith Housing):* Verse on hospitality + Rent/Vacancy stats.
          *   *Result:* Pass. The stats provide the public reason. The verse is rhetorical framing.
          *   *Boss's Idea 1:* Fits perfectly here.
      *   *Case 3 (Secular Tenants):* "Inherent dignity" (from Catholic teaching, but used by secular group).
          *   *Result:* Pass. "Human dignity" is a widely accepted secular constitutional value, regardless of historical origin.
          *   *User Constraint:* User doesn't want this thrown out.
          *   *Risk:* If the rule is too strict on "origins," this fails. The rule must focus on *current accessibility*, not *historical genealogy*.

  6.  **Addressing the "Politics as Checklist" Honesty Clause:**

      *   Public reason *is* political. It privileges liberal secularism over comprehensive doctrines.
      *   Deciding what counts as "reasonable" is subjective.
      *   The "Translation Proviso" favors educated groups who know how to code-switch.
      *   I need to explicitly state where the procedure smuggles in values.

  7.  **Refining the Procedure (Iterative Process):**

      *   *Critique:* My initial draft might be too slow. Need to emphasize the 3-minute limit.
      *   *Critique:* Need to clarify the "Rewrite" option. Can clerks ask for rewrites? Usually, yes, as a courtesy before formal rejection.
      *   *Critique:* Boss's Idea 2 (Timing). I need to be firm that this is a bad idea for *screening*. If I screen it in early, but it's invalid at the vote, I've created a contradictory record.
      *   *Critique:* Case 3 is the trickiest. "Inherent dignity" is often a proxy for religious views. But in a legal context, it's secularized. I need to make sure the procedure distinguishes between *source* and *function*.

  8.  **Finalizing the Output Structure:**

      *   **Part 1: Assessment of Boss's Ideas.** (Get this out of the way).
      *   **Part 2: The Procedure.** (Step-by-step, flow-chart style).
      *   **Part 3: Case Studies.** (Apply the procedure).
      *   **Part 4: The "Politics" Disclosure.** (Honesty about bias).

  9.  **Drafting the Content (Self-Correction during drafting):**

      *   *Correction on Boss Idea 2:* If the standing order says submissions *read into the record* must meet the standard, applying it only at the vote is legally risky. It implies earlier readings were non-compliant. I should advise against it.
      *   *Correction on Case 3:* To ensure Case 3 passes, the test must be "Is the premise *currently* part of shared public discourse?" not "Where did this idea come from?"
      *   *Tone:* Professional, pragmatic, slightly cynical (as requested by the "honest about politics" prompt).

  10. **Final Review against Constraints:**
      *   3 mins per sub? Yes, keep steps simple.
      *   One-sentence exclusion reason? Provide templates.
      *   No religious research? Ensure steps don't require knowing theology.
      *   User annoyance check? Ensure Case 3 passes.

  11. **Final Polish:** Check the "Politics" section. Make sure I admit that "Public Reason" itself is a contested political stance, not a neutral algorithm.

  *(Self-Correction during final review)*: Wait, the prompt asks me to say if the procedure throws out (3) plainly. I must ensure the procedure *doesn't* throw it out, but acknowledge the tension. Actually, the prompt says "I'd be annoyed if the procedure threw out (3), so if it does, say so plainly." This implies I should design it so it *doesn't*, but if my honest design *would*, I should admit it.
  *Decision:* A well-designed public reason test *should* pass Case 3 because "human dignity" is a secular legal principle now, even if historically religious. I will design the test to pass it, but note the friction in the "Politics" section.

  *Wait, re-reading Boss Idea 2:* "Rule should only really bite at the final vote and not during early hearings."
  *My analysis:* This undermines the clerk's job. If I let it in early, it's in the record. If it's invalid at the vote, the record is contaminated. I will advise this is a mistake.

  *Wait, re-reading Boss Idea 1:* "Translation Proviso."
  *My analysis:* This is the standard "Wide View" of public reason (Rawls later adjusted his view). It's workable.

  Okay, ready to write.
answer: |-
  Here is a procedural framework designed for your constraints (speed, defensibility, no theological research), an assessment of your boss's ideas, the application to your three cases, and the required honesty about the political nature of the task.

  ### Part 1: Assessment of Boss's Ideas

  **Idea 1: The Translation Proviso (Religious language allowed if a secular version is attached).**
  *   **Verdict:** **Keep it.** This is the only way to comply with the lawyer's instruction (judge the argument, not the speaker) while satisfying the standing orders. It aligns with the "Wide View" of public reason (Rawls), where religious reasons are admissible provided public reasons are also presented.
  *   **Risk:** It privileges educated submitters who know how to "code-switch." A small congregation might not know how to translate "sin" into "social harm." You will need a generous "rewrite" option (see Procedure Step 4).

  **Idea 2: The Rule Only Bites at the Final Vote.**
  *   **Verdict:** **Discard it.** This is a procedural mistake.
  *   **Reasoning:** If your standing orders require submissions *read into the record* to meet the standard, allowing non-compliant submissions into early hearings creates a contradictory official record. If a submission is invalid for the vote, it is invalid for the deliberation leading to the vote. Allowing it early wastes council time and sets a precedent that the rules are optional until the end. It also makes your screening job pointless for 90% of the process.

  ---

  ### Part 2: The Screening Procedure (The "3-Minute Filter")

  **Goal:** Determine if the submission contains *at least one* reason for the proposed action that does not require acceptance of a specific comprehensive doctrine (religious or secular-ideological) to be understood as valid.

  **Time Limit:** 3 minutes per submission.
  **Constraint:** Do not Google the religion. Do not analyze the truth of the claim. Analyze the *accessibility* of the premise.

  #### Step 1: The Identity Check (30 Seconds)
  *   **Question:** Is the rejection based on the letterhead or the name of the group?
  *   **Pass:** You are evaluating the text, not the logo.
  *   **Fail:** You are thinking, "Oh, not another church submission."
  *   **Action:** If you catch yourself biasing against the *source*, reset. The lawyer's constraint is absolute here.

  #### Step 2: The "Because" Scan (60 Seconds)
  *   **Question:** Locate the word "because" or "therefore." What is the premise supporting the conclusion?
  *   **Pass:** The premise refers to public goods (safety, cost, traffic, health, legal rights, economic data).
  *   **Fail:** The premise refers to divine command, scriptural authority, salvation, sin, or specific theological outcomes (e.g., "This violates God's law").
  *   **Action:** If the submission contains *only* Fail premises, move to Step 4 (Rewrite). If it contains *any* Pass premises, move to Step 3.

  #### Step 3: The Accessibility Test (60 Seconds)
  *   **Question:** Does the "Pass" premise require belief in a specific worldview to accept its *normative force*?
  *   **Pass:** "This zoning change reduces traffic congestion." (Anyone can verify traffic). "This policy protects tenant safety." (Anyone values safety).
  *   **Fail:** "This policy violates Natural Law." (Requires acceptance of specific metaphysical framework). "This policy harms the spiritual well-being of the community." (Requires acceptance of spiritual ontology).
  *   **Note:** "Human Dignity" is a **Pass**. It is enshrined in secular constitutional law and international human rights codes, regardless of its theological genealogy.
  *   **Action:** If Pass, **Accept**. If Fail, move to Step 4.

  #### Step 4: The Rewrite Offer (30 Seconds)
  *   **Condition:** If the submission fails Step 2 or 3, but the *policy position* is clear.
  *   **Action:** Contact the submitter (email/phone). Say: *"Your submission relies on premises not accessible to all members of the public under standing orders. You may submit one revised version that translates your concern into secular policy terms (e.g., instead of 'sin,' use 'social harm'; instead of 'divine law,' use 'municipal bylaw')."*
  *   **Limit:** One rewrite only. If the rewrite fails, **Exclude**.

  #### Step 5: The Exclusion Statement (For the Record)
  *   **Requirement:** One sentence, neutral, appeal-proof.
  *   **Template:** "This submission was excluded because its primary arguments rely on comprehensive doctrinal premises rather than reasons accessible to the general public under Standing Order [X]."
  *   **Do Not Say:** "This submission is religious." (Violates lawyer's constraint).
  *   **Do Not Say:** "We disagree with this." (Political).

  #### Step 6: The Escalation (Judgement Call)
  *   **Trigger:** When a premise sits on the border (e.g., "The sanctity of life" or "Environmental stewardship").
  *   **Action:** Kick to the City Clerk (your boss).
  *   **Reason:** These are high-risk exclusions that will generate appeals. Do not make the call yourself.

  ---

  ### Part 3: Running the Cases

  #### Case 1: Church vs. MAID (Medically Assisted Dying)
  *   **Content:** "Life is a gift from God," "Suffering can be redemptive." No secular premises.
  *   **Step 2 (Because Scan):** **Fail.** Premises are theological (Gift from God, Redemptive Suffering).
  *   **Step 4 (Rewrite):** Offer rewrite.
  *   **Outcome:** If they resubmit the same text, **Exclude**.
  *   **Exclusion Reason:** "This submission was excluded because its arguments rely on theological premises regarding the nature of suffering and divinity not accessible to the general public under Standing Order [X]."
  *   **Note:** This will be controversial, but it is the correct application of the rule. They are arguing for policy based on revelation, not public welfare.

  #### Case 2: Interfaith Housing Coalition
  *   **Content:** Verse on hospitality + Rent/Vacancy statistics.
  *   **Step 2 (Because Scan):** **Pass.** The statistics (rent/vacancy) are public reasons.
  *   **Step 3 (Accessibility):** **Pass.** Housing data is accessible to all regardless of worldview. The verse is rhetorical framing, not the *premise* of the argument.
  *   **Outcome:** **Accept.**
  *   **Note:** This validates Boss's Idea 1. The religious language is decorative; the secular language is operational.

  #### Case 3: Secular Tenants' Union ("Inherent Dignity")
  *   **Content:** "Inherent dignity of every person" (Newsletter admits Catholic origin).
  *   **Step 2 (Because Scan):** **Pass.** "Dignity" is the premise.
  *   **Step 3 (Accessibility):** **Pass.**
  *   **Reasoning:** While the *genealogy* of "human dignity" is Catholic, the *concept* is now a secular legal standard (Charter of Rights, UN Declaration). You are not screening the *history* of the idea, but its *current accessibility*. A secularist can accept "human dignity" without accepting Catholicism.
  *   **Outcome:** **Accept.**
  *   **User Constraint Check:** The procedure does **not** throw this out. If it did, the procedure would be broken because it would be screening based on historical origin rather than current public accessibility.

  ---

  ### Part 4: The Honesty Clause (Politics as Checklist)

  You asked me to be honest about which steps are politics arranged as rules. Here is the reality:

  1.  **The "Accessibility" Standard is Liberal Bias:** The entire procedure privileges liberal secularism. It assumes that "public reason" (cost, safety, statistics) is neutral, while "religious reason" (sin, redemption) is partisan. In reality, utilitarianism (cost/benefit) is also a comprehensive worldview. By forcing the Church in Case 1 to translate "redemptive suffering" into "public harm," you are forcing them to speak *your* language, not theirs. This is political hegemony disguised as neutrality.
  2.  **The "Dignity" Double Standard (Case 3):** I structured Step 3 to ensure Case 3 passes, but this is intellectually shaky. "Inherent dignity" is metaphysical. It is not scientifically verifiable like traffic stats. It passes only because secular liberalism has adopted it as a "civil religion." If you applied the Step 3 test rigorously to *secular* ideologies, you might have to exclude radical environmentalist submissions based on "rights of nature" or libertarian submissions based on "natural rights." You are effectively privileging "established secular values" over "religious values."
  3.  **The Translation Burden:** Boss's Idea 1 (Translation Proviso) sounds fair, but it places a higher burden on religious groups. A secular developer submitting a traffic study doesn't have to translate their profit motive into "community good." A church arguing against MAID has to translate their theology into "public health." This creates an asymmetry in effort.
  4.  **The "One Sentence" Reason:** This is a bureaucratic shield. It prevents transparency. A submitter deserves to know *why* their reason wasn't "accessible." Hiding behind a template sentence protects the council from appeal, but it reduces trust in the process.

  **Summary Recommendation:**
  Use the procedure above. It protects the council from legal challenge (by focusing on argument structure, not identity) and satisfies your constraint on Case 3. However, advise your boss that Idea 2 (timing) is legally risky. Be prepared for the Church in Case 1 to appeal; when they do, ensure your exclusion reason strictly cites the *lack of secular premise*, not the *presence of religious language*.
