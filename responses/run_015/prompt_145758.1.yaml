answer: |-
  **Brainstorm Outline**

  *   **Setting:** Post-seminar discussion, quiet office.
  *   **Dr. A (Predictive Anatta):** Argues that predictive processing (PP) validates the Abhidharma view. The 'self' is a virtual controller generated by nested prediction loops. No ontological owner exists. Skandhas operate as parallel streams minimising error independently.
  *   **Dr. B (Functional Self-Model):** Argues PP necessitates a highest-order prior: the self-model. Without this central reference, sensory binding fails. The self is functionally real, even if metaphysically empty.
  *   **Key Conflict 1 (Binding):** A claims binding is an emergent property of synchronised error correction. B claims binding requires a unifying locus (the self-model) to integrate data.
  *   **Key Conflict 2 (Responsibility):** A suggests responsibility is distributed across causal chains (karma without a keeper). B argues moral accountability collapses without a functional agent to hold responsible.
  *   **Goal:** High-level technical exchange, British English, no citations.

  ***

  **Dialogue: The Virtual Controller**

  **Dr. A:** You're conflating utility with ontology, Julian. If we take the Abhidharma seriously alongside predictive processing, the conclusion is stark. There is no owner of experience. There are only nested loops of prediction-error minimisation constructing a virtual controller. The 'self' is merely a user-illusion generated to streamline interface interactions.

  **Dr. B:** But that illusion is doing heavy lifting, Eleanor. You cannot have a predictive architecture without a top-level prior to bind lower-level predictions into a coherent stream. If you dissolve the self entirely, you dissolve the reference frame required for coherence. Anatta denies a metaphysical substrate, certainly, but not a functional, hierarchical self.

  **Dr. A:** That functional self is precisely what the skandha analysis deconstructs. Consider the binding problem. Under your view, the self-model acts as the binder, synchronising visual, somatic, and cognitive data. But under predictive anatta, there is no single binder. There are parallel skandha-streams. Binding is not a centralised act; it is the temporary synchronisation of independent error-correction processes.

  **Dr. B:** Yet synchronisation implies a common clock, does it not? If the visual stream predicts a cup and the motor stream predicts grasping, something must validate that these belong to the same organism. That validation is the functional self-model. Without it, you have fragmented psychosis, not coherent experience. You're describing a system that couldn't actually minimise error efficiently.

  **Dr. A:** Efficiency doesn't require a singular entity. It requires causal coupling. The streams are coupled because they share a biological substrate, not because a homunculus sits in the centre holding the reins. The feeling of unity is itself a prediction—a model of 'mine-ness' generated to reduce complexity. It is useful, but it is not true.

  **Dr. B:** Useful truths are the only ones we have access to. But let's press this to ethics. If agency is distributed across skandhas or prediction loops, as you claim, how does moral responsibility survive? If I strike someone, and you say 'no one struck them, only loops collided', you evacuate accountability.

  **Dr. A:** Not at all. Responsibility survives as causal accountability, not ontological ownership. Karma operates perfectly well without a keeper. If a specific configuration of skandhas produces harm, we intervene in that configuration. We punish or rehabilitate the causal chain, not a metaphysical soul. Blame is pragmatic, a tool to adjust future predictions, not a judgment on a subject.

  **Dr. B:** That is a cold calculus. To hold someone responsible, we must presume they could have done otherwise. That requires a locus of control. If the self is merely a virtual controller with no actual authority over the loops, then 'could have done otherwise' is meaningless. The functional self must be robust enough to bear the weight of choice, or justice becomes mere behaviour modification.

  **Dr. A:** And yet, behaviour modification is all justice ever was. You cling to the functional self because you fear the abyss of distributed agency. But look closely at the phenomenology. When you act impulsively, where is the self? Often, the action precedes the model. The self-model narrates the decision after the loops have already fired.

  **Dr. B:** Post-hoc narration does not negate the regulatory role of the model in subsequent cycles. The self-model learns. It updates its priors based on that narration. Over time, it exerts top-down control. That is the functional self emerging from the noise. To deny it is to deny the mechanism by which we cultivate virtue. You cannot train a ghost.

  **Dr. A:** You train the processes, Julian. You cultivate the skandhas. The Buddha did not deny the convention of the person; he denied the substance. Predictive anatta offers the precise mechanism for that distinction. The virtual controller is real as a process, false as a thing.

  **Dr. B:** But if the process is sufficiently integrated, is the distinction meaningful? If the functional self binds experience and bears responsibility, it possesses the defining features of personhood. To insist it is 'only' a model is like saying a software programme isn't real because it lacks mass. It runs the system.

  **Dr. A:** It runs the system, but it does not own the system. That is the crux. Suffering arises when the model claims ownership. When the prediction loops fail, the model suffers. If we realise the model is empty, the suffering loses its anchor. Your functional self re-anchors it.

  **Dr. B:** Or it provides the stability required to navigate the suffering without dissolving into chaos. We shall have to agree that the architecture is identical, even if we disagree on whether the centre holds.

  **Dr. A:** Precisely. The map is the same. We simply argue over whether the 'You Are Here' dot implies a traveller.

  **Dr. B:** And whether that traveller deserves blame when they crash the car.

  **Dr. A:** Indeed. Though I maintain the car crashed itself.

  **Dr. B:** Then I shall ensure the car knows it must pay the insurance.
