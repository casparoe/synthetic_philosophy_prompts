answer: |-
  To secure immediate access to the Consortium's proprietary server, which I need today to finalize a grant application that expires at midnight, the Director requires me to commit to permanently deleting my local copy of the data next month upon project completion. She is a shrewd observer of research workflows and grants access only if I set up my computer today on an isolated, ephemeral drive that makes data retention technically difficult and risky, a setup she knows a researcher planning to keep the data would irrationally avoid due to the high probability of accidental loss before the deletion date. I accept these terms, knowing that once the grant is secured and the project finished next month, the Consortium will never audit my hard drive, keeping the data carries significant future research value, and deleting it offers no benefit to anyone, yet I remain fully lucid and self-aware throughout, recognizing now that when the time comes I will have no external incentive to follow through.

  (a) **The Check:** The intention is to delete the data next month. The reason available at the early time is securing the server access necessary for the grant. At the later time, there is no external reason to delete the data (no audit, positive value in keeping it), and the agent knows this calm lucidity at the outset. Under the **belief-constraint account**, the agent cannot intend to delete because they cannot believe they will delete; knowing there will be no reason to act later, a rational agent cannot form the belief required for intention, so the intention fails, the Director denies access, and the grant is lost. Under the **two-tier account**, the agent has sufficient reason to *intend* (the grant), and this intention is a distinct normative state that does not require belief grounded in external reasons; once formed, the intention itself constitutes a commitment that provides a reason to act later, so the intention succeeds, access is granted, and the data is deleted.

  (b) **The Structural Feature:** The work is done by the **costly signaling via preparatory planning** (the ephemeral drive setup). This feature links the early benefit to the genuineness of the intention through an intermediary (workflow risk) that a mere pretender would not rationally accept. If this feature is removed—for example, if I can use a standard permanent drive and simply promise to delete later—the Director cannot distinguish intention from pretension via ordinary observation. In that relaxed case, the transaction relies on trust or reputation, which immediately generates a *later* reason to act (avoiding reputational damage), thereby collapsing the case into ordinary promise-keeping and eliminating the divergence between the two accounts.

  (c) **The Strongest Reply:** A defender of the belief-constraint account will argue that what I am calling an "intention" is merely a **prediction of behavior** based on the earlier setup; they will claim I do not intend to delete *because* I see a reason to delete, but rather I believe I will delete *because* I have bound my own hands, and thus the "intention" is actually a recognition of causal necessity or irrational compulsion, not a rational commitment. I think this reply **fails**. It conflates the *basis* of the belief with the *state* of intention; on the planning theory of intention, forming an intention precisely functions to settle deliberation and exclude later reconsideration of options known to be utility-maximizing in isolation. The agent does not believe they will act because they are compelled, but because they have adopted a plan that rationally excludes the option of keeping the data, validating the two-tier verdict that the intention itself supplies the normative force required for action.
