answer: |-
  ### Part 1: Mechanic Brainstorming

  Before settling on the design, I considered two fundamentally different approaches to simulating modeling assumptions.

  **Option A: The Cartographer's Map (Spatial/Representational)**
  *   **Mechanic:** Teams draw maps of a hidden terrain to guide a robot.
  *   **Friedman Aspect:** Team A draws a schematic subway map (topologically correct, geometrically false). Team B draws a satellite photo (geometrically correct, noisy).
  *   **Tension:** Team A navigates faster (better prediction of travel time) because they ignore irrelevant curves. Team B gets stuck in weeds.
  *   **Subgroup Twist:** A specific "flood zone" exists on the satellite photo but is abstracted away on the subway map. Team A routes people through the flood zone because their map says it's safe.
  *   **Rejection:** Too much time spent drawing. The "prediction" element is passive (navigation) rather than active (forecasting numbers), which weakens the link to epidemiology/economics.

  **Option B: The Black Box Forecasters (Statistical/Algorithmic)**
  *   **Mechanic:** Teams submit numerical predictions based on limited data feeds.
  *   **Friedman Aspect:** Team A gets a "Smoothed Feed" (averaged data, hides variance). Team B gets "Raw Feed" (noisy, individual data points).
  *   **Tension:** Team A predicts the *mean* outcome more accurately because they aren't distracted by noise (validating Friedman). Team B chases noise and misses the mean.
  *   **Subgroup Twist:** One data point in the Raw Feed is a "Canary" (leading indicator of crisis). The Smoothed Feed averages it out. Team A wins the early rounds; Team B sees the Canary but loses points for inaccuracy. In the final round, the Canary triggers a crash that only Team B predicted.
  *   **Selection:** **Option B** is chosen. It mirrors the mathematical structure of forecasting, allows for precise point scoring, and creates immediate epistemic tension without requiring artistic skill.

  ***

  ### Part 2: Activity Design — "The Homogeneity Wager"

  **Concept:** Students act as forecasting agencies bidding for government contracts. They must choose between a "Parsimonious Model" (unrealistic assumptions, robust aggregate prediction) and a "Structured Model" (realistic assumptions, noisy aggregate prediction, sensitive to subgroups).

  **Class Size:** 8 Students.
  **Time:** 75 Minutes.
  **Materials:**
  *   5 Six-Sided Dice (4 White, 1 Red).
  *   1 "Loaded" Red Die (or a standard d6 where the Instructor secretly treats 1-3 as 4-6 to bias it high). *Prep: Tape a small dot on the Red die to mark it as "Vulnerable".*
  *   4 Prediction Sheets (printed or drawn on index cards).
  *   1 Master Scoreboard (Whiteboard).
  *   Tokens (for points) or just tally marks.

  **Roles:**
  *   **4 Forecasting Teams (2 students each):**
      *   **Teams Alpha & Beta (Parsimonious):** Must use the "Homogeneity Assumption."
      *   **Teams Gamma & Delta (Structured):** Must use the "Network Assumption."
  *   **Instructor:** Acts as "Reality" (rolls dice) and "Policy Maker" (awards contracts).

  #### The Rules (Handout/Board)

  **1. The Reality Generation**
  Each Round, Reality generates an outcome by rolling 5 dice (4 White, 1 Red).
  *   **Aggregate Outcome:** The Sum of all 5 dice.
  *   **Subgroup Outcome:** The value of the Red die alone.

  **2. The Assumptions (The Constraint)**
  *   **Parsimonious Teams (Alpha/Beta):** You assume the population is homogeneous.
      *   *Data Access:* You are told only the **Sum of the 4 White Dice** from the *previous* round. You do not see the Red die.
      *   *Submission:* You submit **one number** (Predicted Aggregate Sum).
      *   *Bonus:* Because your model is simple, you receive **+2 Points** to your final score each round (Efficiency Dividend).
  *   **Structured Teams (Gamma/Delta):** You assume the population has network clusters.
      *   *Data Access:* You see the **individual values of all 5 dice** from the *previous* round.
      *   *Submission:* You submit **two numbers** (Predicted Aggregate Sum AND Predicted Red Die Value).
      *   *Penalty:* Your model is complex. You pay **-2 Points** each round (Complexity Tax).

  **3. Scoring (Per Round)**
  *   **Aggregate Accuracy:** Closest prediction to the actual Aggregate Sum wins **5 Points**. (Ties split).
  *   **Subgroup Accuracy:** Closest prediction to the actual Red Die wins **5 Points**.
      *   *Crucial:* Parsimonious teams *cannot* submit a Subgroup prediction. They automatically get 0 for this category.
  *   **Total Score:** Sum of Accuracy Points + Efficiency/Complexity adjustments.

  **4. The Crisis (Round 4 Only)**
  *   In the final round, the "Policy" is tested against the Subgroup.
  *   If the Red Die rolls a **5 or 6**, a "Vulnerable Cluster Outbreak" occurs.
  *   Any team that did not track the Red Die (Parsimonious) is deemed **Non-Compliant** and loses **10 Points**.
  *   Structured teams are immune to this penalty.

  ---

  #### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10 | Setup & Role Assignment**
  *   Divide class into 4 teams of 2. Assign Alpha/Beta (Parsimonious) and Gamma/Delta (Structured).
  *   Distribute Prediction Sheets.
  *   **Instructor Script:** "You are agencies bidding for a contract. Your goal is to maximize points. Do not discuss strategies with other teams. I am Reality. I will not explain the dice mechanics, only the results." (Do *not* mention Friedman or ethics yet).

  **00:10 – 00:35 | Rounds 1, 2, & 3 (The Friedman Phase)**
  *   **Action:**
      1.  Instructor rolls 5 dice behind a screen/folder.
      2.  Instructor reveals data according to rules (Parsimonious get White Sum; Structured get All 5 values).
      3.  Teams write predictions.
      4.  Instructor reveals Actual Outcomes.
      5.  Score the round.
  *   **Expected Dynamic:** Parsimonious teams will likely win the Aggregate Accuracy more often. Why? Because Structured teams get distracted by the specific variance of the Red Die in the previous round and try to "model" it, often overfitting the noise. Parsimonious teams just guess the statistical mean (e.g., 17-18), which is robust.
  *   **Status Check:** At the end of Round 3, Parsimonious teams should be leading on total points. This validates the "F-Twist": their false assumption (homogeneity) yielded better predictive success for the main metric.

  **00:35 – 00:45 | The Contract Renewal & Crisis Announcement**
  *   Announce Round 4 is the "Final Audit."
  *   Reveal the **Crisis Rule** (The 10-point penalty if Red Die $\ge$ 5 and you didn't track it).
  *   *Observation:* Watch the Parsimonious teams react. They are structurally incapable of compliance now. They optimized for the wrong metric.

  **00:45 – 00:55 | Round 4 (The Reverse Twist)**
  *   Run the round.
  *   **Rigging:** As Instructor, if the Red Die rolls low (1-4) naturally, re-roll it once secretly to ensure it hits 5 or 6. The Crisis *must* trigger to make the point.
  *   Apply penalties.
  *   Calculate Final Winners. (Often, the Structured teams win here despite losing earlier rounds, or the Parsimonious teams win on points but are "disqualified" ethically).

  **00:55 – 01:15 | Debrief & Mapping**
  *   **Phase 1: The F-Twist (10 mins):** Ask Parsimonious teams: "Why did you win Rounds 1-3?" Elicit that ignoring the Red Die noise made their Aggregate guess more stable. Map this to Friedman: *Assumptions need not be descriptive to be predictively accurate.*
  *   **Phase 2: The Reverse Twist (10 mins):** Ask Structured teams: "What was the cost of your realism?" (Complexity tax, lower aggregate accuracy). Ask Parsimonious: "How did it feel to be penalized for something you couldn't see?"
  *   **Phase 3: Synthesis:** Connect the Red Die to the "Vulnerable Subgroup." The aggregate model worked *because* it averaged out the subgroup's volatility. That is exactly why it failed the audit.

  ---

  #### Predictable Failure Modes

  1.  **The "Math Anxiety" Stall:** Structured teams might spend too long calculating probabilities based on the previous round's dice, causing the game to drag.
      *   *Fix:* Enforce a 60-second timer per prediction phase. Force intuition over calculation.
  2.  **The "Unlucky Parsimonious" Problem:** By random chance, the Parsimonious teams might guess poorly in Rounds 1-3, undermining the Friedman lesson.
      *   *Fix:* As Instructor, if the Aggregate Sum is an extreme outlier (e.g., <10 or >25), you (Reality) are allowed to "adjust" the result by +/- 1 to keep it near the mean, simulating a stable system where simple models thrive.
  3.  **The "Moral Hazard" Rejection:** Parsimonious students might argue, "We followed the rules! The penalty was unfair."
      *   *Fix:* This is actually a *feature*, not a bug. It replicates the real-world friction where modelers claim they aren't responsible for policy outcomes. Use this anger in the debrief.
  4.  **Collusion:** Teams might share data.
      *   *Fix:* Seat teams at opposite corners. Collect prediction sheets face-down.

  ---

  #### What This Activity Cannot Do (The Instructor's Burden)

  You must supply the following in the debrief, because the game mechanics cannot generate them:

  1.  **The Normative Weight of Harm:**
      *   *Game Limit:* Losing 10 points is abstract. It does not feel like "people dying." Students will treat the Crisis as just another scoring rule.
      *   *Your Job:* You must verbally bridge the gap. "In this game, you lost points. In the 2020 forecasting you mentioned, this penalty represents ICU bed shortages in a specific zip code that the aggregate model said was 'safe.' The game creates the *epistemic* tension, but you must supply the *moral* stakes."

  2.  **The Causal Explanation:**
      *   *Game Limit:* The game shows *that* the simple model worked better on aggregates, but not *why* (e.g., cancellation of errors, law of large numbers).
      *   *Your Job:* Briefly explain the statistical mechanism. "The Parsimonious model won because the errors in the White Dice cancelled each other out. The Red Die was noise to them, but signal to the Structured team. Friedman argues we should keep the noise if it helps the prediction. The Reverse Twist argues the noise *is* the population we care about."

  3.  **The Political Economy of Modeling:**
      *   *Game Limit:* The game assumes the "Policy Maker" (Instructor) wants to save the subgroup. In reality, Policy Makers often prefer the Aggregate model because it's cheaper and justifies ignoring the subgroup.
      *   *Your Job:* Point out that in the real world, the Parsimonious teams would likely keep their funding because "Aggregate Accuracy" is the metric politicians campaign on. The "Crisis Round" is an idealization of accountability that rarely happens so cleanly.

  ### Summary of the Philosophical Payoff
  This activity forces students to *inhabit* the Friedman position. They will feel the satisfaction of winning with a "false" model. By stripping away the ability to track the subgroup via rules (not just advice), you make the blindness structural. When the Crisis hits, they experience the "Reverse F-Twist": the very feature that made their model robust (ignoring the Red Die) is what made it ethically catastrophic. They won't need a lecture to understand the tension; they will have felt it in their score sheet.
