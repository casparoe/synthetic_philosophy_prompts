prompt: |-
  I've recently watched my own profession quietly abandon a longstanding obligation that was treated as a matter of honor just a generation ago, with almost none of the explicit moral debate one might expect, and that experience has made the abstract question of moral revolutions suddenly personal. In discussing this with a colleague, I was told that "moral revolutions happen when practices become ridiculous, not when they're refuted"—a line they used to dismiss the idea that abolition or the end of dueling owed anything to philosophical reasoning. Before I accept that framing, I want you to act as a professional moral philosopher familiar with Bernard Williams's writing on moral change and Kwame Anthony Appiah's work on honor and dueling, to think carefully and begin with some brief brainstorming. Lay out the distinct precise theses that slogan could actually be expressing: the trivial claim that social ridicule often accompanies reform; the stronger claim that rational justification is always post hoc; the intermediate view that thick concepts shift their emotional resonance before anyone offers an argument; and the radical sociological claim that material interests drive every normative change and argument is pure epiphenomenon. For each reading, indicate whether it is defensible, whether it actually supports dismissing arguments about slavery or dueling, and whether it confuses correlation with causation; present the readings as a menu rather than selecting one, and tell me which are platitudes, which are substantive and plausible, and which are false. Write in continuous prose only—no headings, bullet points, bold text, or tables—like a careful letter or email.
