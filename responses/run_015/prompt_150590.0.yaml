answer: |-
  Dear Colleague,

  It is deeply unsettling to witness the quiet dissolution of a norm that once felt constitutive of your professional identity, particularly when that dissolution lacks the ceremonial debate we might expect to accompany such a shift. Your colleague's remark that moral revolutions happen when practices become ridiculous rather than when they are refuted is a provocative slogan, one that resonates with the unsettling silence you have observed, but as a philosopher interested in the mechanics of ethical change, I suspect it conceals several distinct claims beneath its aphoristic surface. To evaluate whether this framing dismisses the role of reasoning in historical shifts like abolition or the end of dueling, we need to disentangle the possible meanings of the statement, ranging from the trivial to the radical, and assess each against the work of thinkers like Bernard Williams and Kwame Anthony Appiah who have taken the social psychology of morality seriously.

  Consider first the most charitable and trivial reading, which suggests merely that social ridicule is a frequent companion to moral reform. On this view, the claim is descriptive rather than explanatory; it observes that before a practice vanishes, it often passes through a stage where it is seen as laughable or archaic. This is defensible as a matter of historical record, yet it functions as a platitude that offers little explanatory power regarding causation. If we accept only this version, it does not support dismissing the role of argument in abolition or dueling, because ridicule could simply be the emotional aftermath of successful refutation rather than its replacement. To treat this reading as explanatory would be to confuse correlation with causation, assuming that because laughter precedes the funeral of a norm, it also dug the grave. This version is true but too weak to sustain your colleague's dismissive tone regarding philosophical reasoning.

  Moving to a stronger, more epistemological claim, we encounter the suggestion that rational justification is always post hoc rationalization. This is a Humean-inspired thesis asserting that reasons are merely the slaves of the passions, or in this sociological context, that arguments are never the cause of change but merely the costume worn by shifts in sentiment. If this were true, it would indeed support dismissing the philosophical arguments against slavery or dueling as mere epiphenomena of deeper psychological shifts. However, this claim is largely false when confronted with the historical record Appiah analyzes in The Honor Code. Appiah demonstrates that arguments do not merely follow change but actively reshape the concepts of honor and shame that make the change possible; the argument that dueling was cowardly rather than brave did not just describe a shift but constituted the shift by altering the meaning of the thick concept of honor. To assert that reasoning is always post hoc is to ignore how new arguments provide the vocabulary necessary for people to feel shame in a new key, and thus it mistakes the internal logic of normative change for external causation.

  A third, intermediate reading aligns more closely with Bernard Williams's work on thick ethical concepts and the social world. This thesis posits that thick concepts shift their emotional resonance before anyone offers a explicit argument, meaning that the background conditions required for a practice to make sense dissolve, rendering the practice ridiculous because it no longer fits the social world. Williams argues that ethical life depends on a social world that makes sense to its participants, and when that coherence fractures, the concepts lose their grip. This view is substantive and plausible because it acknowledges that argument requires a receptive social context to land; an argument against dueling falls on deaf ears if honor is still understood through a lens of violent prowess, but becomes decisive once that lens cracks. This reading does not support dismissing arguments about slavery or dueling, but rather contextualizes them, showing that refutation requires a shift in the pre-argumentative social imagination. It avoids confusing correlation with causation by recognizing a reciprocal relationship where changing sentiments make arguments possible, and arguments crystallize those sentiments.

  Finally, there is the radical sociological claim that material interests drive every normative change and that argument is pure epiphenomenon. This is the view that ridicule is a weapon used by rising groups to delegitimize the practices of declining elites, unrelated to truth or moral reasoning. While this captures a grain of truth regarding the power dynamics inherent in professional shifts, it is ultimately false as a totalizing explanation because it cannot account for why specific arguments gain traction over others or why individuals sacrifice interest for principle. If this were the whole story, it would support dismissing moral arguments entirely, reducing them to masks for power, but it commits a severe category error by confusing the conditions of change with the content of change. It fails to explain why the ridicule targets specific moral failings rather than others, suggesting that even materialists must rely on some normative framework to make their ridicule stick.

  When you return to your colleague's comment, you might suggest that while the feeling of ridiculousness is indeed the symptom of a dying norm, it is rarely the sole cause. The most plausible synthesis, drawing on Appiah and Williams, is that moral revolutions occur when arguments successfully reconfigure the thick concepts that underpin our honor, making old practices appear ridiculous because they no longer cohere with who we understand ourselves to be. The silence you are witnessing in your profession may not be a lack of reasoning, but rather the sound of a conceptual framework dissolving so thoroughly that the old obligations no longer even register as debatable. This is perhaps more disturbing than a heated debate, for it suggests the social world that sustained those obligations has already vanished, leaving the practice exposed as a hollow ritual. I hope this menu of interpretations helps you locate where your colleague's insight holds water and where it oversimplifies the complex interplay of reason, emotion, and social context that defines our ethical lives.
