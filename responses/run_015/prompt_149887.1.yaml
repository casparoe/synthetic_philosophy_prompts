      *   No citations? Yes.

  7.  **Final Polish:** (Self-Correction during drafting) *Wait, I need to make sure I don't give away the whole answer key, but rather grade the student's work. The prompt asks me to "assess this" after brainstorming. So the output should be the brainstorming notes followed by the graded assessment.*

