      *   **Claim:** This machine can serve a thousand occasions, handle unforeseen circumstances, and produce fitted signs (language).
      *   **Challenge:** The distinction is now just a wager on matter's capacity, not a demonstration. Is it just metaphysics protecting the thesis?

