prompt: |-
  hey — I need to borrow your brain on a teaching problem rather than on the substance itself, if that's a distinction you'll let me have.

  I'm a PhD student in philosophy (rational choice / decision theory-ish) and I've been asked to run a 75-minute seminar for first-year public-policy masters students in their cost-benefit analysis course. They've had about two weeks: they can build a small decision tree, discount, do a basic NPV, and they've absorbed "sunk costs are irrelevant" as a slogan they can recite but have never seen stress-tested. The course director wants them to leave able to look at a real case of an agency continuing to fund a failing project and say something more useful than "fallacy" — without walking out thinking the slogan was a lie.

  I've ran this twice and it went wrong in two opposite directions. First time I did the core fallacy properly and then bolted the exceptions on at the end; about half the room concluded the whole thing was sophistry dressed up. Second time I led with the interesting exceptions, and they could list three reasons honoring sunk costs can be rational but couldn't tell me which one, if any, applied to a case I put in front of them afterwards. So what I want is a plan for the explanation, not the explanation.

  The substance I want them to end up able to handle — some of this is stuff from my own third chapter, so don't worry about whether it's standard, just take it as given:

  - Whether a cost is sunk isn't a property of the money; it's a property of the cost relative to a decision and to what the feasible alternatives actually are. Ninety-five percent recoverable isn't the same animal as zero percent recoverable, and "the grant can only be spent on this" changes the alternative set rather than making the money free.
  - A forward-looking theory of reasons can still have perfectly respectable things to say about past spending, because the past can be *evidence*: what my earlier self chose tells me something about what my earlier self knew, and I've lost access to most of that (the files are gone, the meetings weren't minuted, the gut feel is not reconstructible). On my "amnesia" argument, honoring the expenditure can be rational deference to a signal I can no longer read directly — and it's strongest exactly when my current evidence about the project is thin, not when it's thick. It should collapse into plain irrationality when the signal isn't there.
  - Separately: for an agent who can't literally bind their future self, treating sunk costs as reasons can be a poor man's precommitment device — you get some of the benefits of a commitment strategy you can't otherwise implement.
  - And the observability dial: whether anyone else sees the decision and updates on it (a state funder deciding about the next tranche, a developer waiting to build) is doing real work, and it's a different mechanism from either of the two above.

  Don't explain any of that to me. Tell me how to get it into their heads in order:

  1. What has to be in place before the exceptions even sound like answers to a question rather than like excuses — what depends on what, and why does that ordering specifically avoid both of the failure modes I described? I'm guessing the causal/evidential distinction has to be secured before the amnesia thing can land, but I'm not sure where to put "sunkness is relative to a decision."
  2. The one case that has to carry the whole session. I've been using a city transit agency: $40m spent on a light-rail spur, $60m still needed, present value of benefits maybe $45m, and the person who signed off has left the agency and took their reasoning with them. Fix the numbers if the ratios matter. Tell me what this case must have and — more importantly, this is where I keep getting it wrong — what it must lack. My instinct is that it has to be stripped of anyone's job being on the line and of any suggestion that the project might come good on the numbers, but I'm not sure whether that strips out too much.
  3. The misconceptions, in the order they'll actually form, and precisely where in the sequence to head each one off. The ones I expect: "sunk = already spent"; "if the past moves you at all you've erred"; conflating honoring a sunk cost with finishing the project; the idea that the reputational/observability story is cheating because the past spend is only a signal and not a reason; and then the rebound into "so it's all just evidence-talk, the fallacy doesn't exist." Give me the ones I haven't thought of too, especially any that the amnesia argument itself will manufacture.
  4. One check at the end that distinguishes genuine understanding from being able to recite the four mechanisms. I'd rather ask them what would have to be *different* for a given mechanism to stop applying than ask them whether the agency should continue.
  5. What to leave out at this level and say out loud that I'm leaving out. I don't want to open the formal signaling/commitment modeling, and I don't want to touch the psychology literature on whether the effect shows up outside convenience samples, but tell me if I'm wrong about either.

  Also: these are policy students, not philosophers — they'll want to know what to do on Monday, and I don't want to give them a license to keep funding things. If there's a place in the sequence for the "and therefore the default stays abandon" move, tell me where it goes.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy (rational choice/decision theory).
      *   **Audience:** First-year Public Policy Masters students (MPP).
      *   **Context:** 75-minute seminar in a Cost-Benefit Analysis (CBA) course.
      *   **Student Level:** 2 weeks into the course. Know basic decision trees, discounting, NPV, and the slogan "sunk costs are irrelevant."
      *   **Goal:** Move students from reciting the slogan to understanding *when* and *why* it might be rational to consider past expenditures (without validating the fallacy itself).
      *   **Past Failures:**
          1.  Fallacy first, exceptions last $\rightarrow$ Students thought it was sophistry/excuses.
          2.  Exceptions first $\rightarrow$ Students couldn't apply the concepts to a case (confused about which mechanism applied).
      *   **Key Concepts to Convey:**
          1.  Sunkness is relative to the decision/alternative set (not just "money spent").
          2.  Evidential value (Amnesia argument): Past spending signals private info from past self.
          3.  Precommitment/Binding: Treating sunk costs as reasons to maintain consistency/reputation.
          4.  Observability/Signaling: External audience updates based on continuation.
      *   **Constraints:** Do *not* explain the substance (I know it). Explain the *pedagogy* (ordering, case design, misconception management, assessment, omissions).
      *   **Specific Questions:**
          1.  Ordering/Structure (to avoid previous failures).
          2.  Case Design (The Transit Agency case: what to include/exclude).
          3.  Misconception Management (Order of emergence and intervention).
          4.  Assessment (Check for understanding, not recitation).
          5.  Omissions (What to leave out and acknowledge).
          6.  Normative Conclusion ("Default stays abandon").

  2.  **Deconstruct the Pedagogical Problem:**
      *   *Failure Mode 1 (Sophistry):* Happens when students feel the core rule is being undermined before they trust it. They need to feel the force of the fallacy first.
      *   *Failure Mode 2 (Confusion):* Happens when they have a bag of tools but no diagnostic criteria for which tool to use. They need a decision tree or a diagnostic flow.
      *   *The Tension:* Policy students want actionable advice ("Don't fund failing projects"). The philosophical nuance ("Sometimes looking back is rational") risks giving them cover for bad decisions. The plan must emphasize that the *exceptions are narrow* and require specific conditions.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Ordering/Structure:**
          *   Need to secure the "Fallacy" first to build trust.
          *   Need to define "Sunkness" early because it's a prerequisite for the exceptions. If they think sunk = spent, the exceptions won't make sense.
          *   The "Exceptions" need to be framed not as "Sunk Costs Matter" but as "Other Things Correlated with Sunk Costs Matter."
          *   *Proposed Flow:*
              1.  Reinforce the Baseline (NPV logic).
              2.  Refine the Definition (Sunkness is relative).
              3.  Introduce the "Black Box" (The Amnesia/Evidence argument).
              4.  Introduce the "Audience" (Signaling/Commitment).
              5.  Synthesis/Diagnostic.
          *   *Why this works:* It respects the slogan first, then complicates it only after the baseline is solid. It separates *internal* reasons (evidence) from *external* reasons (reputation).

      *   **2. Case Design (The Transit Spur):**
          *   *Current Stats:* $40m spent, $60m needed, $45m benefit. (NPV of completion = -$15m).
          *   *Requirement:* Must isolate variables.
          *   *What to Exclude:* Political pressure (initially), personal career stakes (initially), ambiguity about future benefits (keep benefits fixed at $45m PV to make the math clear).
          *   *What to Include:* The "Amnesia" element (original planner gone, files missing). This is crucial for the evidential argument.
          *   *The Twist:* The case needs *versions*. Version A (Pure Fallacy), Version B (Amnesia/Evidence), Version C (Reputation/Signaling).
          *   *Crucial Detail:* The "Sunkness" relative to alternatives. Is the $40m recoverable? If yes, it's not fully sunk. Let's make it non-recoverable to simplify, but emphasize the *grant restriction* aspect (money can only be used for this).

      *   **3. Misconceptions:**
          *   *M1:* "Sunk = Spent." (Fix: Define relative to decision node).
          *   *M2:* "Considering the past = Irrational." (Fix: Distinguish causal vs. evidential).
          *   *M3:* "The exceptions validate the fallacy." (Fix: Emphasize the *default* remains abandonment).
          *   *M4:* "Reputation is just cheating." (Fix: Frame as constraint, not preference).
          *   *M5 (New):* "If I can tell a story, it's rational." (Fix: Burden of proof is on the exception).
          *   *M6 (Amnesia specific):* "Past self was rational." (Fix: Past self might have been wrong, but signal exists).

      *   **4. Assessment:**
          *   Don't ask "Should they finish?" (Too binary).
          *   Ask "What fact would need to change to make finishing rational?"
          *   Or: "Here are three memos. Which one justifies continuation without violating CBA principles?"

      *   **5. Omissions:**
          *   Formal signaling games (too technical).
          *   Psychology of bias (distracts from rational choice framework).
          *   *Crucial:* Acknowledge that in 95% of policy cases, the exceptions don't hold.

      *   **6. The "Default Stays Abandon" Move:**
          *   This needs to be the *conclusion*. After exploring the exceptions, slam the door shut on most of them. "These are rare conditions. If you can't prove the signal exists, cut the loss."

  4.  **Refining the Plan (Self-Correction/Iterative Thinking):**
      *   *Critique:* Is 75 minutes enough for all four concepts?
      *   *Adjustment:* Group "Precommitment" and "Observability" as "Strategic/External" reasons. Keep "Amnesia" as "Internal/Evidential." Keep "Relative Sunkness" as foundational.
      *   *Critique:* The user wants to avoid Failure Mode 2 (students can't distinguish mechanisms).
      *   *Adjustment:* The case needs to be modular. Present the base case. Then add *one* fact. Ask "Does this change the decision?" Then add *another* fact. This forces them to isolate the mechanism.
      *   *Critique:* Policy students want actionable advice.
      *   *Adjustment:* Provide a "Checklist for Justifying Continuation." If they can't check the boxes, they must abandon.

  5.  **Finalizing the Output Structure:**
      *   Follow the user's numbered prompts exactly.
      *   Tone: Professional, peer-to-peer (PhD to PhD), concise, actionable.
      *   Ensure the distinction between *causal* (the money makes the project good) and *evidential* (the spending tells me the project is good) is central.

  6.  **Writing the Content:** (Drafting the response based on the above thoughts, ensuring strict adherence to the "don't explain the substance" rule). *Self-correction during drafting:* Make sure I don't accidentally explain the amnesia argument, but rather explain *how to teach* it. Ensure the "Default Stays Abandon" is placed strategically (at the very end as a safeguard).

      *   *Refining the Case:* The $40m/$60m/$45m math is good. $100m total cost, $45m benefit. Huge loss. Completing costs $60m for $45m gain. Loss of $15m. Abandoning loses $40m. Wait.
      *   *Correction on Math:* If they abandon, they lose the $40m. If they complete, they spend another $60m to get $45m. Total spend $100m, return $45m. Net loss $55m.
      *   *Wait, standard Sunk Cost setup:*
          *   Option A (Stop): Lose $40m (sunk). Future cost 0. Future benefit 0. Net future: 0.
          *   Option B (Go): Spend $60m. Get $45m. Net future: -$15m.
          *   Rational choice: Stop (0 > -15).
          *   This works. The $40m is irrelevant to the *future* calculation.
      *   *Make sure the case allows for the "Amnesia" twist:* Why did the predecessor spend $40m? Maybe they knew something about the benefits being higher than $45m? But the current estimate is $45m. The tension is between *current estimate* vs *signal from past action*.
      *   *Actually, better tension:* The current estimate is uncertain. The past spending signals confidence. Okay, I will specify the case details in the response to ensure this works.

  7.  **Final Review against constraints:**
      *   Did I explain the substance? No.
      *   Did I address the 5 points? Yes.
      *   Is the tone right? Yes.
      *   Did I address the "Default Stays Abandon"? Yes.

      *(Self-Correction on Point 3 - Misconceptions)*: I need to make sure I identify the misconception that arises *from the amnesia argument specifically*. That is: "If past spending is evidence, then *all* past spending is evidence." I need to flag that.

      *(Self-Correction on Point 5 - Omissions)*: I need to be explicit about *why* I'm omitting the psychology. It's because the course is CBA (normative), not behavioral (descriptive).

      *(Final Polish)*: Ensure the "Ordering" section explicitly maps to avoiding Failure Mode 1 and 2.

      *Let's build the response.*
answer: |-
  This is a sharp pedagogical challenge. You are trying to teach *second-order* rationality (when it is rational to appear irrational, or when past acts carry information) to students who haven't fully mastered *first-order* rationality (NPV logic).

  Here is the plan to navigate the 75 minutes without triggering the "sophistry" alarm or the "confusion" fog.

  ### 1. The Sequence: Securing the Baseline Before Complicating It

  To avoid Failure Mode 1 (sophistry), you must validate the slogan before you qualify it. To avoid Failure Mode 2 (confusion), you must treat the exceptions as *diagnostic tests*, not just a list of possibilities.

  **The Order of Operations:**

  1.  **The Iron Baseline (15 mins):** Run the NPV calculation on the base case. Establish that *causally*, the past money cannot change the future flow. Get them to agree that if the past money is truly gone, funding the loss is throwing good money after bad. **Lock this in.** If they don't believe this, the rest is noise.
  2.  **The Definition Shift (10 mins):** Before introducing exceptions, introduce the *relative* nature of sunkness. Show a variation where $10m of the $40m is recoverable. Show a variation where the grant expires if not spent. This teaches them that "sunk" is a variable, not a constant. This prevents them from misapplying the later exceptions to costs that aren't actually sunk.
  3.  **The Information Asymmetry (Amnesia) (20 mins):** Now introduce the "Black Box." The predecessor is gone. The files are missing. *Why* did they spend $40m? This is where you introduce the evidential argument. **Crucial:** Frame this not as "the past matters," but as "the past action is a proxy for missing data."
  4.  **The Strategic Environment (Observability/Commitment) (20 mins):** Now introduce the audience. Will the state funder pull future grants if we quit? This is distinct from Amnesia. It's not about what we *know*; it's about what *they* see.
  5.  **The Synthesis & Default (10 mins):** The "Default Stays Abandon" move (see section 6).

  **Why this ordering works:**
  *   It prevents **Failure Mode 1** because you spend the first 25 minutes reinforcing the standard model. The exceptions arrive only after the "fallacy" is solidified as the default.
  *   It prevents **Failure Mode 2** because you separate the mechanisms by *source of value*.
      *   Phase 2 is about **Accounting** (Is it actually sunk?).
      *   Phase 3 is about **Epistemology** (What does this tell me?).
      *   Phase 4 is about **Game Theory** (What does this tell others?).
      *   This gives them three distinct buckets to sort arguments into during the case work.

  ### 2. The Case Design: The Transit Spur

  Your instinct is correct: you must strip the case of emotional and political noise to isolate the rational choice mechanisms. However, if you strip *too* much, the "Amnesia" argument has no hook.

  **The Base Numbers (Keep these fixed):**
  *   Spent: $40m.
  *   To Complete: $60m.
  *   PV Benefits (Current Estimate): $45m.
  *   *Result:* NPV of completion = -$15m. NPV of abandonment = $0 (future).

  **What the Case MUST Have:**
  1.  **The "Black Box" Detail:** Explicitly state: "The original project lead has retired. Their private memos regarding the initial $40m expenditure were not archived. The public record shows only the expenditure, not the justification." This is the necessary condition for the Amnesia argument to even be *possible*.
  2.  **The "Grant Restriction" Detail:** "The $40m came from a federal infrastructure grant that cannot be reallocated to other projects." This secures the "Sunkness is Relative" lesson (it is sunk relative to other projects, but not necessarily relative to this one if there are clawback clauses—keep it simple: it's non-recoverable).
  3.  **The "Audience" Detail:** "The State Transportation Board reviews agency performance annually. They view project cancellations as indicators of poor planning capability." This secures the Observability argument.

  **What the Case MUST Lack:**
  1.  **Personal Career Stakes:** Do not mention the *current* director's bonus or job security. If you include this, students will conflate *personal* rationality with *agency* rationality. You want institutional rationality.
  2.  **Ambiguity on Future Benefits:** Do not say "Benefits might be higher." Keep the $45m PV as the *current best technical estimate*. The tension must come from the *past action*, not from hope about the *future numbers*.
  3.  **Political Pressure:** No "the Mayor wants this." That introduces coercion, which overrides CBA. You want them to analyze the *reasons*, not the *pressure*.

  **The Modular Delivery:**
  Do not give them the whole case at once. Give them the Base. Ask for a decision. Then hand out "Update Memo 1" (The Black Box info). Ask if the decision changes. Then "Update Memo 2" (The Board Review info). Ask again. This forces them to isolate which mechanism is doing the work.

  ### 3. Misconceptions: Emergence and Intervention

  Here are the misconceptions in the order they will arise, and where to cut them off.

  1.  **"Sunk = Spent" (Emerges in Phase 1)**
      *   *Intervention:* The "Recoverability" check. Ask: "If we could sell the tracks for $10m, is that $10m sunk?" (No). "If the grant expires if we stop, is the $40m sunk?" (Yes, relative to the budget).
  2.  **"If the past moves you at all you've erred" (Emerges in Phase 3)**
      *   *Intervention:* Distinguish **Causal** vs. **Evidential**. Use the analogy: "Seeing smoke doesn't cause fire, but it's rational to run because of the smoke." Past spending doesn't *make* the project good, but it might *signal* that it is.
  3.  **"Honoring Sunk Costs = Finishing the Project" (Emerges in Phase 3)**
      *   *Intervention:* Force a distinction between "Continuing" and "Honoring." You can honor the signal (acknowledge the predecessor knew something) but still stop if the current evidence ($45m benefit) outweighs the signal. The signal updates the probability, it doesn't dictate the action.
  4.  **"The Amnesia Argument makes all spending evidence" (Emerges *from* Phase 3)**
      *   *Intervention:* **This is the big one.** You must specify that the signal is only valuable if the *sender was rational* and *had better information*. If the predecessor was known to be incompetent, the signal is noise. Add a constraint: "We assume the predecessor was competent."
  5.  **"Reputational/Observability is Cheating" (Emerges in Phase 4)**
      *   *Intervention:* Frame reputation as a **constraint**, not a preference. It's not that we *like* the project; it's that quitting triggers a penalty (loss of future funding) that changes the NPV calculation. It brings the cost of abandonment up, potentially flipping the sign.
  6.  **"So the Fallacy Doesn't Exist" (Emerges in Conclusion)**
      *   *Intervention:* The "Burden of Proof" flip. The fallacy exists because people assume the exceptions apply by default. They don't.

  ### 4. The Check: Testing for Mechanism, Not Outcome

  Do not ask: "Should the agency continue?"
  Ask: **"Under what specific condition does the 'Amnesia' argument *stop* working?"**

  **The Prompt:**
  > "You are advising the Director. She is tempted to continue the project based on the fact that her predecessor spent $40m. Write a one-sentence condition that, if true, would make relying on that $40m expenditure *irrational* even if the files are still missing."

  **What you are looking for:**
  *   *Bad Answer:* "If the project loses money." (Misses the point; that's the baseline).
  *   *Good Answer:* "If we have reason to believe the predecessor was acting on bad data." OR "If we have better current data than the predecessor had." OR "If the predecessor had different incentives than we do."

  This tests whether they understand that the *value of the signal* depends on the *quality of the sender*, not just the existence of the spend.

  ### 5. Omissions: What to Leave Out (and Say So)

  You are correct to omit the formal modeling. For this audience, it creates a barrier to entry without adding decision-useful value.

  **What to explicitly omit:**
  1.  **Formal Signaling Games:** Tell them: "There is a formal game-theoretic way to model the reputation piece, but for policy analysis, treating reputation as a 'cost of abandonment' is the sufficient heuristic."
  2.  **Behavioral Psychology:** Tell them: "We are not discussing whether humans *actually* feel loss aversion. We are discussing whether a rational agent *should* count the past. Keep the normative and descriptive separate."
  3.  **The "Escalation of Commitment" Literature:** This is the descriptive twin of your normative topic. Mention it only to say: "Psychologists study why people *do* this. We are studying when it is *okay* to do this."

  **Why:** If you open the psychology door, they will conflate "I feel bad about wasting money" with "It is rational to account for wasted money." Keep the lane clear.

  ### 6. The "Default Stays Abandon" Move

  This is your safety valve against giving them a license to fund failing projects. This goes in the final 10 minutes (Synthesis).

  **The Script:**
  > "We have identified three reasons why looking at the past might be rational: Accounting (is it truly sunk?), Evidence (what did the predecessor know?), and Strategy (what will the funders think?).
  >
  > Here is the rule for Monday morning: **The burden of proof is on the exception.**
  >
  > In 95% of cases, the predecessor's files are available, the predecessor's incentives were misaligned, or the reputational hit is negligible. If you cannot point to a specific piece of *missing information* that the past spend signals, or a specific *contractual penalty* for quitting, you must treat the cost as sunk and the project as a loss.
  >
  > Using these arguments to justify a project that fails NPV is not sophisticated analysis; it is rationalization. You only use these tools when the standard NPV calculation is missing a variable you can otherwise access."

  **Why this placement:**
  It comes *after* they have felt the intellectual excitement of the exceptions. It grounds them back in their professional reality. It ensures they leave thinking, "I have new tools, but I should rarely use them," rather than "I have new excuses."

  ### Summary of the Flow

  1.  **0-15:** NPV Baseline (The Fallacy is real).
  2.  **15-25:** Relative Sunkness (The Definition is nuanced).
  3.  **25-45:** The Amnesia Case (The Past as Evidence).
  4.  **45-65:** The Reputation Case (The Past as Signal to Others).
  5.  **65-75:** The Burden of Proof (The Default is Abandonment).

  This structure respects their intelligence, validates their current training, and gives them the nuance they need without undermining the core competency of the course.
