answer: |-
  Here are three candidate designs I considered before selecting the final case:
  1.  **Code Refactorer:** Scans repos, submits PRs overnight, fixes merge conflicts autonomously. (Risk: Breaking production.)
  2.  **Ad-Bidder:** Adjusts marketing spend hourly to hit CPA targets. (Risk: Financial bleed.)
  3.  **Compliance Remediator:** Fixes audit flags in a ledger. (Risk: Regulatory liability.)

  I'm committing to the **Compliance Remediator**. It offers the cleanest separation between user intent and system execution without invoking sci-fi capabilities.

  ### Thought Experiment
  "ComplianceBot" is deployed at a fintech firm. A compliance officer uploads a CSV of 500 flagged transactions and prompts: "Resolve these discrepancies by Friday 5 PM." The system parses the flags, generates correction scripts, and executes them against the ledger API. If a script fails due to rate limits or vendor downtime, the system waits and retries with a different endpoint without notifying the user. It runs nightly jobs between 2 AM and 4 AM when no engineers are logged in. Upon completion, it posts a summary report to Slack. There is no hidden reward function; the model optimizes strictly for the prompt's success criteria using standard RLHF alignment.

  ### Analysis of Verdicts

  *   **Test A (Goal-Source): Tool.** The objective ("Resolve *these* discrepancies by *Friday*") is supplied fresh at deploy time by the user. The model has no baked-in drive to "maximize compliance" independent of the specific prompt.
  *   **Test B (Persistence/Flexibility): Agent.** The system keeps working across sessions (nightly jobs), reorganizes its approach when blocked (switches endpoints), and carries on when nobody is watching (2 AM execution).
  *   **Test C (Tiebreaker): Agent (barely).** The artifact is `auth_config.json`, which stores a long-lived service principal key allowing the system to authenticate to the ledger API without a user present.
      *   **The Tweak:** Change `auth_mode` from `service_principal` to `user_delegation` with a 24-hour expiry. This flips the verdict to **Tool**, because the system cannot act without a fresh human token.

  ### The Deciding Feature
  The one feature doing the work is **independent authentication**. It decouples the system's ability to act from the user's active presence.

  **If you remove it:** The system becomes a standard script that halts whenever the user's session times out. It loses the capacity for unattended persistence, collapsing Test B into a Tool verdict.

  ### The Best Tool-Advocate Objection
  "This isn't agency; it's just robust engineering. The 'flexibility' is deterministic error-handling logic written by humans, and the 'persistence' is a cron job. The LLM is merely a classifier inside a wrapper; calling it an agent conflates automation with autonomy."

  ### Recommendation for Your Panel
  **Test B (Persistence/Flexibility) should be dispositive.**
  For safety review burden, the risk isn't *what* the system wants (Test A), but *when* it can act without us. Unattended execution across sessions is where runaway loops and unintended side-effects accumulate. Test A is too easy to game with prompt engineering; Test C is too technical. Test B captures the operational risk.

  **How a Vendor Games the Light Review:**
  They hard-code a session timeout that forces the system to pause and request human re-authentication every 4 hours. This technically breaks "persistence across days" without materially changing the product's utility, landing them in the light review bucket.
