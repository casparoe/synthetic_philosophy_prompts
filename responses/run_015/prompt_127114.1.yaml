  2.  **Compositionality (0.35):** Non-classical semantics struggles with negation and conditionals. If "battle" lacks a value, "battle or no battle" often does too, violating excluded middle in contexts where it seems valid.
  3.  **Contingency-Profile (0.45):** The intuition aligns with quantum indeterminacy (i) and chaotic unpredictability (ii), but not mathematical ignorance (iii). This suggests metaphysical openness, but does not decisively rule out bivalent branching models.
