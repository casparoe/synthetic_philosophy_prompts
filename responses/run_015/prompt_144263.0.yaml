answer: |-
  ### The Underdetermination Decision Tree

  **Node 1 (Entry Case)**
  "Two models fit all checked observations and actual interventions but disagree on the outcome of an intervention nobody has run and, for practical purposes, cannot yet run. Is the inability to distinguish them a limit of *current technology* or a limit of *physical possibility*?"
  *   **A:** Current Technology (Weak Underdetermination).
  *   **B:** Physical Possibility (Strong Underdetermination).
  *   **C:** The distinction assumes 'models' and 'data' can be separated cleanly (Holist Challenge).

  **Node 2 (Path A: Current Technology)**
  "Suppose a new intervention becomes possible and favors Model 1. Is Model 2 thereby proven *false*, or merely *superseded*?"
  *   **A1:** Proven False (Realist Resolution).
  *   **A2:** Superseded (Historical Pessimism).
  *   **A3:** 'False' is the wrong category for instruments (Instrumentalist).

  **Node 3 (Path A2: Superseded)**
  "Does the history of science suggest we are likely missing *better* theories that fit the new data even than Model 1?"
  *   **A2-i:** Yes, we systematically miss better theories (Unconceived Alternatives).
  *   **A2-ii:** No, Model 1 is likely the final word (Transient/Local).
      *(Note: This split is flagged below as potentially verbal.)*

  **Node 4 (Path B: Physical Possibility)**
  "If no observation can distinguish them, do virtues like simplicity provide evidence for *truth*?"
  *   **B1:** Yes, they track truth (Epistemic Virtues).
  *   **B2:** No, they track utility (Pragmatic Virtues).
  *   **B3:** No, truth is not the goal regarding unobservables (Empirical Adequacy).

  **Node 5 (Path B1: Epistemic Virtues)**
  "Do these virtues concentrate probability enough to make the rival hypothesis decision-relevantly negligible?"
  *   **B1-i:** Yes, priors settle the matter (Bayesian Convergence).
  *   **B1-ii:** No, significant rational slack remains (Realist Agnostic).

  **Node 6 (Path B2: Pragmatic Virtues)**
  "Are social interests and values legitimate tie-breakers when evidence runs out?"
  *   **B2-i:** Yes, values legitimately break the tie (Value-Laden Pluralist).
  *   **B2-ii:** No, values are biases to be minimized (Traditional Pragmatist).

  **Node 7 (Path C: Holist Challenge)**
  "When a prediction fails, can we isolate which specific hypothesis caused the failure?"
  *   **C1:** No, the whole web of belief is tested (Global Holism).
  *   **C2:** Only relative to shared paradigm standards (Incommensurability).

  ***

  ### Leaf Analysis

  | Leaf | Position | Awkward Commitment | What Changes Their Mind |
  | :--- | :--- | :--- | :--- |
  | **A1** | **Local/Temporary UD** | Must explain why past "resolved" theories were later overturned without admitting systematic error. | A demonstrated case where new data *failed* to eliminate the rival despite physical possibility. |
  | **A2-i** | **Unconceived Alternatives** | Must explain why we should act on current theories if we believe better ones are likely waiting. | A period of science where theory generation stalled but empirical adequacy remained perfect for centuries. |
  | **A2-ii** | **Transient (Unnamed)** | Indistinguishable from A1 in practice; claims "temporary" but admits history suggests otherwise. | Same as A1; this leaf is flagged below as verbally distinct from A1. |
  | **B1-i** | **Bayesian Response** | Must assign precise priors to metaphysical claims (e.g., simplicity) without empirical calibration. | A proof that simplicity correlates with falsehood in a relevant domain of physics. |
  | **B1-ii** | **Realist Agnostic (Unnamed)** | Commits to truth-tracking virtues that are too weak to guide action or belief confidently. | Evidence that the "slack" leads to divergent practical outcomes in engineering. |
  | **B2-i** | **Value-Laden Pluralist** | Must explain how science remains objective if values legitimately determine theory choice. | A case where value-driven choice led to empirically disastrous predictions compared to a "neutral" choice. |
  | **B2-ii** | **Traditional Pragmatist** | Claims values are biases yet admits evidence cannot decide; leaves choice arbitrary. | **Empty:** Nobody occupies this; if evidence fails, either values step in or skepticism wins. |
  | **B3** | **Constructive Empiricist** | Must draw a sharp line between "observable" and "unobservable" that technology keeps blurring. | A technology that makes previously unobservable entities (e.g., viruses) directly manipulable. |
  | **C1** | **Global Holist** | Makes scientific testing seem impossible since any failure can be shifted to auxiliaries. | A case where a specific hypothesis was isolated and falsified without adjusting the whole web. |
  | **C2** | **Incommensurability** | Risks making communication across paradigms impossible, undermining the idea of scientific progress. | A successful translation of concepts between two rival paradigms that preserved truth conditions. |

  ***

  ### Structural Notes & Empty Combinations

  **1. Indistinguishable Leaves (Transient vs. Unconceived)**
  The tree separates **Leaf A1 (Local/Temporary)** and **Leaf A2-i (Unconceived Alternatives)** at Node 3. However, this distinction is often verbal. A "Transient" underdeterminationist admits unconceived alternatives are *possible* but assigns them low probability; an "Unconceived" pessimist assigns them high probability based on history. In a live discussion, both will agree that *currently* we must act on Model 1. The difference is a meta-induction about the future of theory generation, not a disagreement about the current evidence status. If your group members agree on the current credence distribution but disagree on the historical trend, this branch is doing no work.

  **2. Unoccupied Combinations**
  The logical space permits these combinations, but they are effectively empty:
  *   **Strong UD + Pragmatic Virtues + Values Illegitimate (Leaf B2-ii):** This position claims evidence cannot decide, simplicity is only for utility, but social values are *not* allowed to break the tie. This leaves the agent with no rational method for choice. It is unoccupied because it is paralyzing; those who hold this view usually retreat to skepticism (not a leaf here) or admit values (Leaf B2-i).
  *   **Weak UD + New Data Resolves + Unconceived Alternatives Likely:** This would be answering "Proven False" at Node 2 but "Yes, we miss better theories" at Node 3. It is incoherent: if new data proves the rival false, the existence of a third unconceived theory does not sustain underdetermination between the original two.
  *   **Holist Challenge + Isolate Hypothesis:** Answering "The distinction assumes neutral data" at Node 1 but "Yes, we can isolate the faulty hypothesis" at Node 7. This is definitionally incoherent; holism denies the isolability that the second answer affirms.

  **3. Taxonomy vs. Tree**
  A decision tree is the correct shape here because your group is stuck on *moves* (debunking vs. license). A taxonomy lists positions; a tree forces a commitment to the *conditions* under which a position is held. However, be aware that Node 4 (Virtues) and Node 6 (Values) are often correlated in practice even if logically distinct. A person who thinks virtues track truth (B1) usually thinks values are illegitimate (B2-ii), but since B2-ii is empty, they cluster in B1. A person who thinks virtues are pragmatic (B2) usually thinks values are legitimate (B2-i). The tree separates them to show where the "Value-Laden" claim actually does work (only when truth-tracking fails).

  **4. The Entry Case**
  The Entry Node (Node 1) uses your specific climate/model case. Note that **Leaf B3 (Constructive Empiricist)** often rejects the premise of Node 1 for unobservables. If the "unrun intervention" involves unobservable entities, the Empiricist says there is no fact of the matter to underdetermine. If the intervention is observable but practically impossible, they accept the underdetermination but deny it matters for *belief*. This nuance is captured in Node 4, Option B3.
