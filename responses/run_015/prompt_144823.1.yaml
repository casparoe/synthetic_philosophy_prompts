answer: |-
  Dear friend, please do not worry about the typo in your message; I understood you perfectly, and the haste only adds a sense of urgency to a fascinating question about how we write history. The practice you describe, where germs, climate, and volcanoes are elevated to the status of historical actors, presupposes a significant philosophical shift away from the Cartesian dualism that has long dominated Western historiography. Traditionally, history was the study of human agents possessing intentionality, while nature was merely the stage or the backdrop upon which human drama unfolded. To treat a volcanic eruption as an actor is to commit to a ontology that rejects the strict subject-object dichotomy, suggesting instead that the capacity to alter the course of events is what constitutes agency, rather than the possession of consciousness or intent. This does not strictly require that causation just is agency in a metaphysical sense, but it does require that causation be treated as narratively equivalent to agency. In this framework, if a pathogen reshapes social structures through mortality, it is performing an action comparable to a legislature passing a law, not because the pathogen intends to legislate, but because the effectivity—the power to make a difference—is what matters for the historical record.

  You asked whether this framing implies that only intentional beings count as actors, and the answer embedded in these grant requirements is a definitive no. The philosophical commitment here is a decoupling of agency from mentality. This moves the discipline toward a notion of actancy, a term often associated with Bruno Latour and Actor-Network Theory, where anything that modifies a state of affairs is an actor. However, strictly speaking, the museum practice does not need the full metaphysical baggage of Actor-Network Theory to function. What the practice strictly needs is a functional definition of agency based on causal efficacy and historical consequence. It fits well with New Materialism and posthumanist philosophies, which argue that matter is lively and participatory, but a curator could adopt this practice without subscribing to the view that all matter is equally agentic. The minimum requirement is simply the acknowledgment that human history is co-constituted by non-human forces that operate with a degree of autonomy relative to human will.

  Regarding your concern about environmental determinism, this framing does not necessarily commit one to a hard determinism where nature dictates human outcomes without remainder. Classical environmental determinism often suggested that climate or geography rigidly fixed social development, leaving little room for human culture. The non-human agency statement you describe is more subtle; it posits a relational ontology where humans and non-humans interact in feedback loops. A volcano does not determine the end of a civilization single-handedly; rather, it acts upon a social fabric that responds in specific ways, and the history lies in that entanglement. Therefore, this practice can sit comfortably with a human-centred historiography, provided that human-centredness is understood as human-focused rather than human-exclusive. We can still centre the human experience of the eruption or the plague while acknowledging that the eruption or plague was an active participant in shaping that experience. The human story remains the object of inquiry, but the cast of characters is expanded to include the forces that constrain, enable, and provoke human action.

  There are, however, areas where this implicit theory remains philosophically underdetermined, which is likely why you feel a sense of conceptual stickiness. The primary ambiguity lies in the normative status of these non-human actors. If a river is an actor, does it deserve moral consideration or rights within the narrative, or is its agency purely descriptive? The grant requirements ask for a description of how these forces act, but they rarely specify the ethical implications of granting them such status. Furthermore, the threshold for what counts as an actor is often vague. Does every rainstorm qualify, or only those that change political boundaries? The practice tends to select non-human actors based on their dramatic impact, which risks reintroducing a form of anthropocentric bias where nature only matters when it interrupts human plans. Finally, the balance of power in the narrative is underdetermined; there is no clear methodological rule for weighing human intention against non-human causality when they conflict, leaving the historian to intuitively decide whether a famine was caused by policy or by drought, when it was likely both.

  In summary, the philosophical commitment required is modest but profound: it is the acceptance that causal power is sufficient for historical significance, even in the absence of intent. This does not collapse causation into agency metaphysically, but it does collapse the distinction methodologically. It avoids hard determinism by focusing on interaction rather than imposition, and it allows for human-centred history by expanding the context of human action rather than replacing the human subject. While it fits neatly into broader posthumanist theories, it strictly requires only a willingness to trace networks of effectivity rather than lines of intention. The unresolved questions concern the ethics of this inclusion and the criteria for distinguishing significant actants from background noise, leaving you with considerable freedom to define the boundaries of this agency in your own work. I hope this helps clarify the theoretical landscape you are navigating, and I look forward to hearing how your proposal develops.
