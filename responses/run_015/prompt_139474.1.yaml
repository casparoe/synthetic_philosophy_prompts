answer: |-
  Here is the operational procedure, designed for your backup, followed by the application to your three cases.

  ### The "Permanent Record" Protocol (PRP)
  **For:** Recording Secretaries & Backups
  **Goal:** To decide what goes into the minutes as a *fact* versus what is left out as *discussion*.
  **Rule of Thumb:** The minutes are not a transcript of what was *felt*; they are a log of what was *done*. Future readers (auditors, banks, next year's board) cannot hear tone of voice. They only have the text. You are writing for them, not for the people in the room.

  #### The 5-Step Filter
  Run every significant utterance through these questions in order. If you stop at a "NO," do not record it as an action/decision. If you get to the end, record it.

  **1. The "Play Acting" Check (Context)**
  *   **Question:** Was this said during a formal voting session, or during a break/practice/joke?
  *   **If Practice/Joke:** STOP. Do not record as an act. (Exception: Record that a practice occurred, but not the specific moves made inside it).
  *   **If Formal Session:** Proceed to Step 2.

  **2. The "Right Person" Check (Authority)**
  *   **Question:** Does the speaker have the official power to do this thing? (e.g., Only a board member can move a motion; only the Maintenance Director can commit labor hours; only a member can resign).
  *   **If No:** STOP. Record as "Comment from [Name]" only. It is a misfire; no act happened.
  *   **If Yes:** Proceed to Step 3.

  **3. The "Future Reader" Check (Deferred Uptake)**
  *   **Question:** If a bank auditor or property manager reads this sentence in two years without hearing the tone of voice, will they think a binding promise was made?
  *   **If Yes:** You must record it as a commitment/action item, *even if* the room treated it casually at the time. Add a qualifier if needed (e.g., "Director stated intent to..."), but do not omit it. The downstream audience wins over the room's vibe.
  *   **If No:** (e.g., "We should maybe think about painting"), proceed to Step 4.

  **4. The "Formula" Check (Procedure)**
  *   **Question:** Did they use the required words or follow the required process? (e.g., "I move" vs. "I wish"; "I resign" vs. "I'm tired").
  *   **If Unclear/Informal:** Ask the Chair *in the moment*: "Are we recording that as a motion/commitment?"
  *   **If Clear:** Proceed to Step 5.

  **5. The "Mind-Reading" Ban (Insincerity)**
  *   **Question:** Do you think they meant it?
  *   **Instruction:** IGNORE THE ANSWER. It does not matter.
  *   **Rule:** If Steps 1–4 are passed, the act happened. Whether they were angry, lying, or joking is irrelevant to the record. An insincere promise is still a promise in the minutes. Record the act, not the mood.

  #### When to Hand Off to a Human
  The Protocol cannot solve these. You must pause the meeting or flag for the Chair's sign-off:
  1.  **Conflicting Authority:** Two people claim the power to commit the same resource.
  2.  **Ambiguous Formulas:** Someone says "I guess that's a motion?" (The Chair must confirm).
  3.  **Political Safety:** If recording an act strictly per the Protocol will cause a member to be unfairly penalized due to a technicality (e.g., a resignation shouted in anger), flag it for the Chair to rule on "Acceptance of Act." The Protocol says the act *happened*; the Chair decides if the body *accepts* it.

  #### Where This Procedure Will Fail (Known Bugs)
  *   **The "Vibe" Gap:** The Protocol prioritizes the written word over the room's understanding. This will cause friction when members say "You know I didn't mean that!" Your answer is: "The minutes serve the future, not the present."
  *   **The "Silent Veto":** If an act happens (Step 1–5 pass) but the room collectively ignores it (no uptake), the Protocol says "Record it." Reality says "It didn't stick." You will record a "ghost act."
  *   **Retractions:** The Protocol records the initial act. If someone changes their mind 10 minutes later, that is a *new* act. Do not erase the first one; record the second one as a reversal.

  ---

  ### Case Studies: Running the Protocol

  Here is how the PRP applies to your three scenarios from last term.

  #### Case A: The Angry Maintenance Director
  *   **Utterance:** "Fine, I'll have the locks replaced by Friday." (Mid-argument, no "I promise").
  *   **Step 1 (Context):** Formal meeting session. **PASS.**
  *   **Step 2 (Authority):** Maintenance Director has authority over locks/labor. **PASS.**
  *   **Step 3 (Future Reader):** If the Property Manager reads "Locks replaced by Friday" in the minutes, they will expect it done. **PASS (Record as Commitment).**
  *   **Step 4 (Formula):** Informal, but clear declaration of future action. **PASS.**
  *   **Step 5 (Mind-Reading):** He was angry. He later claimed he didn't mean it. **IGNORE.**
  *   **Protocol Verdict:** **Record as a binding Action Item.** "Director committed to replacing locks by Friday."
  *   **Analysis:** This goes against your instinct to protect the Director from his own outburst. However, under the *Insincerity Asymmetry*, this is an **Abuse**, not a **Misfire**. He had the authority and the words created a commitment. The fact that he was angry makes the act hollow/abusive, but it still *happened*. By recording it, you protect the Co-op: if he fails to do it again, the record shows a pattern of commitment-breaking. If you omit it, you hide the liability.
  *   **Correction for Future:** In the moment, you should have invoked the Hand-Off: "Director, do you want that recorded as a formal deadline?"

  #### Case B: The Resignation
  *   **Utterance:** "If that's how this is going then I'm done, take this as my resignation."
  *   **Step 1 (Context):** Formal meeting. **PASS.**
  *   **Step 2 (Authority):** Board members have the authority to resign. **PASS.**
  *   **Step 3 (Future Reader):** A bank/insurance co reading this needs to know if the board is fully staffed. **PASS (Record as Event).**
  *   **Step 4 (Formula):** "Take this as my resignation" is a performative formula. **PASS.**
  *   **Step 5 (Mind-Reading):** She came back next week. She clearly didn't *mean* it permanently. **IGNORE.**
  *   **Protocol Verdict:** **Record the Resignation.**
  *   **Analysis:** **This goes against your wish.** You want her on the board. The Protocol says the act *fired*. Resignation is typically a unilateral speech act (unlike a motion which needs a second). Once uttered by an authorized person in a formal context, the status changes.
      *   *Why this hurts:* The "Deferred Uptake" problem. The room's uptake was "Ignore her, she's mad." The Property Manager's uptake (4 months later) was "You have a vacancy." The Minutes side with the Property Manager.
      *   *The Fix:* The Protocol records the resignation. Her return to the next meeting should be recorded as a **new act**: "Former Member X resumed attendance; Board confirmed reinstatement." You cannot erase the resignation without falsifying the record. The "hollowness" of her resignation is a political matter, not a minute-taking one. You must record the break in continuity, or you are liable if the insurance company asks "Was the board fully staffed in March?" and you say "Yes" when the minutes say "Resigned."

  #### Case C: The Fake Chair / Training Retreat
  *   **Utterance:** Fake Chair: "I declare this meeting adjourned."
  *   **Step 1 (Context):** Training Retreat / Practice Meeting. **FAIL.**
      *   *Reasoning:* This is the **Parasitic/Etiolated** clause. The context was explicitly defined as "practice." The utterance was part of a simulation.
  *   **Protocol Verdict:** **No Act Occurred.** Do not record the meeting as adjourned at that time.
  *   **Analysis:** This is a clean **Misfire**. The essential condition of "Serious Context" was missing.
  *   **What to Write:** "Training session concluded. Actual Board Meeting adjourned at [Real Time]."
  *   **Nuance:** The fact that everyone packed up is irrelevant. The *act* of adjournment requires a valid Chair in a valid session. Since the conditions weren't met, the meeting technically remained in session until a real Chair adjourned it (or it ran out of time). However, for practical purposes, you record the *effective* end time, noting the confusion if necessary for quorum calculations.

  ### Summary for your Backup
  1.  **Authority + Words = Act.** (Even if they are angry).
  2.  **Practice/Joke = No Act.** (Even if everyone laughs).
  3.  **Write for the Auditor, not the Room.** (If it looks like a promise on paper, it is a promise).
  4.  **Don't erase mistakes.** (Record the resignation, then record the reinstatement).

  ### Where You Are Still Vulnerable
  The Protocol cannot save you from **Collective Gaslighting**. If the entire Board agrees "That never happened," and you record it, you will be overruled during the rubber-stamp phase. The Protocol is your shield for *conceptual* clarity, but it is not a political shield. In Case B, if the Board votes to "Expunge the resignation from the record," you must do so, but keep a private note of the original text. That is the point where Speech Act Theory yields to Power.
