          *   Why: If Prior goes first, they reject the premise immediately. Partitions show *why* information differs structurally.
          *   Slogan: "Agree to disagree" only at the end. Phrase it as "Common knowledge of posteriors implies identical posteriors," not "People shouldn't disagree."

      *   **The One Example:**
