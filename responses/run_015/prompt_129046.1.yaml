      *   *Obstacle 2: Communication vs. Calculation.* They think disagreement persists because people hide info or lie. Aumann assumes honest revelation of posteriors. They need to see that *even with honest revelation*, disagreement vanishes, which is the counter-intuitive bit.
      *   *Obstacle 3: The "Compromise" Intuition.* They think agreement means averaging. Aumann agreement is about converging to the *same* number based on the *union* of information partitions, not splitting the difference. If the example looks like averaging, the lesson is lost.
      *   *Audience Habits:* They treat numbers as outputs of models, not states of knowledge. They focus on estimation error (bias/variance) rather than information sets. They will try to "solve" the example rather than understand the structure. They value robustness over logical necessity.

  3.  **Drafting the Plan - Section by Section:**

      *   **Dependency Structure:**
