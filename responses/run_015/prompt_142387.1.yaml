  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper Sixth (Year 13) running a History & Politics society, mixed with Years 11-13. Approx. 16 students.
      *   **Time Slot:** 45 minutes (lunchtime).
      *   **Core Concept:** Demonstrate how forecasting is settled by the *choice of comparison class* (reference class forecasting) before evidence is weighed.
      *   **Constraint:** The case study must be *invented* (no historical knowledge bias).
      *   **Mechanism:**
          1.  Private forecast (Survive 50 years? Yes/No).
          2.  Choose between "drawers" of past cases (different base rates).
          3.  Reveal a detail that re-files the case into a third drawer (different base rate).
      *   **Tone:** Experiential ("feel, rather than be told"), no lecture up front (terms like "reference class" saved for debrief).
      *   **Deliverables:** Rules, Materials, Payoffs, Physical Actions/Timeline, Debrief, Predictable Failures & Fixes, Limitations of the Design, Success/Failure Criteria.

  2.  **Deconstruct the Core Concept (Reference Class Forecasting):**
      *   The bias we are targeting is *Selection Bias* in analogical reasoning.
      *   People intuitively pick the analogy that supports their gut feeling.
      *   The game needs to show that the *outcome* (prediction) doesn't change based on data, but the *justification* changes based on the category chosen.
      *   Actually, the prompt suggests something slightly more subtle: "how much of a forecast... is settled... simply by the choice of which past cases it gets compared to."
      *   So, the game needs to show that changing the category changes the *rational* prediction, even if the object remains the same.

  3.  **Drafting the Scenario (The Invented State):**
      *   Needs to be ambiguous enough to fit multiple categories.
      *   *Name:* The Ostracian Maritime Confederation (OMC).
      *   *Age:* 70 years.
      *   *Features:* Written constitution, recent naval victory, succession dispute.
      *   *Twist Detail:* Needs to allow re-filing. Maybe the nature of the succession dispute? Or the economic basis?
      *   *Idea:* Let's make the twist about *succession mechanism*.
          *   Category A: "Constitutional Republics" (High stability).
          *   Category B: "Maritime Confederations" (Low stability).
          *   Category C (The Twist): "Elective Monarchies disguised as Republics" (Very low stability).
      *   *Wait, simpler is better for 45 mins.*
      *   Let's stick to the prompt's suggestion: "Long-lived states" vs "Maritime confederations".
      *   Twist: The "Constitution" is actually a treaty between warlords (making it a "Hegemonic Alliance" rather than a State).
      *   *Refined Scenario:* The **Archipelago of Vela**.
      *   *Initial Info:* 70 years old, Written Charter, Won the Salt War (naval), High Admiral died, successor disputed.
      *   *Drawer 1:* "States with Written Constitutions > 50 yrs" (Survival Rate: 85%).
      *   *Drawer 2:* "Maritime Confederations" (Survival Rate: 15%).
      *   *Twist:* The "Charter" is renewable every 10 years by vote of the captains. It's not a constitution; it's a contract.
      *   *Drawer 3:* "Contractual Alliances" (Survival Rate: 10%).

  4.  **Game Flow & Timing (45 Minutes):**
      *   0-5: Intro & Handout (No talk).
      *   5-10: Private Forecast.
      *   10-20: The Drawer Choice (Group discussion/individual choice).
      *   20-30: The Twist & Re-file.
      *   30-40: Reveal & Score.
      *   40-45: Debrief.
      *   *Correction:* 16 students is small enough for individual play, but big enough for noise. Let's make it individual scoring to keep engagement high.

  5.  **Addressing the "Predictable Failure":**
      *   *Risk:* Students pick the drawer that matches their initial gut feeling (Confirmation Bias) rather than the one that fits the data.
      *   *Mitigation:* The scoring must reward *calibration*, not just being right. Or, force them to commit to the base rate *before* seeing the rate.
      *   *Better Mitigation:* The prompt asks to show how the *choice* settles the forecast. So, if they pick Drawer 1, they *must* predict Survival. If Drawer 2, Collapse.
      *   *Mechanism:* The "Ticket". You buy a ticket based on the Drawer. If the state survives, Drawer 1 tickets pay out. If it collapses, Drawer 2 tickets pay out.
      *   *Wait, the prompt says:* "Choose... between two drawers... with base rates fixed... then discover one further true detail... files it just as naturally under a third drawer."
      *   *Okay, let's refine the mechanic:*
          1.  Read Case.
          2.  Write Prediction (Survive/Collapse).
          3.  Choose a Lens (Drawer A or B).
          4.  See the Base Rate associated with that Lens.
          5.  Reveal Twist.
          6.  Choose New Lens (Drawer C).
          7.  See Base Rate.
          8.  Debrief: Did your prediction change? Or did you just switch lenses to justify the original prediction?

  6.  **Developing the Materials:**
      *   **The Brief:** One page, neutral tone.
      *   **The Drawers:** Envelopes.
          *   Envelope A: "Constitutional States". Rate: 80% Survival.
          *   Envelope B: "Maritime Leagues". Rate: 20% Survival.
          *   Envelope C (Twist): "Personalist Unions". Rate: 10% Survival.
      *   **Scorecard:** To track predictions vs. lenses.

  7.  **Refining the Debrief:**
      *   Must map room actions to concepts.
      *   "Who changed their mind?"
      *   "Who kept the same prediction but swapped the envelope?" (This is the key insight).
      *   Introduce terms: Reference Class, Base Rate, Inside View vs. Outside View.

  8.  **Addressing the "Limitations":**
      *   What can't this game teach?
      *   It can't teach *how to choose the correct reference class*. It only shows that the choice matters. It doesn't solve the problem of *which* class is normatively correct.
      *   I need to be frank about this.

  9.  **Addressing "What would change your mind":**
      *   If everyone picks the same drawer regardless of the twist, the scenario is too biased.
      *   If everyone changes their prediction perfectly with the base rate, they are just following instructions, not learning about bias.
      *   The "wrong lesson" is if they think the Base Rate *is* the truth, rather than a tool.

  10. **Final Polish:**
      *   Ensure the tone is appropriate for a Sixth Form society (intellectual, slightly playful, not patronizing).
      *   Check timing. 45 mins is tight. Keep instructions minimal.
      *   Ensure the "Trivial Stakes" are clear (House points/Chocolate).

  11. **Self-Correction on the "Twist":**
      *   The prompt says: "discover that one further true detail about the same confederation files it just as naturally under a third drawer."
      *   I need to make sure the third drawer is *plausible*.
      *   Let's make the twist about the *succession*.
      *   Initial: "Succession dispute."
      *   Twist: "The successor is chosen by the victor of single combat among the fleet captains."
      *   This moves it from "Constitutional State" (Law) to "Maritime League" (Trade) to "Warlord Coalition" (Violence).
      *   Actually, let's stick to the prompt's specific suggestion: "Long-lived states" vs "Maritime confederations".
      *   Let's use:
          1.  **Sovereign States** (High survival).
          2.  **Maritime Confederations** (Low survival).
          3.  **Twist:** The "Confederation" is actually a **Single Family Enterprise** masquerading as a state (Very low survival / High volatility).
      *   *Better Twist:* The "Constitution" is actually a **Treaty of Alliance** that expires in 5 years.
      *   Drawer 1: States with Constitutions (85% survive 50 yrs).
      *   Drawer 2: Maritime Confederations (30% survive 50 yrs).
      *   Drawer 3: Temporary Treaties (5% survive 50 yrs).
      *   This works.

  12. **Structuring the Response:**
      *   Title.
      *   Concept Summary.
      *   Materials List.
      *   Run of Play (Minute by Minute).
      *   The Materials (Text for handouts).
      *   Scoring/Payoffs.
      *   The Debrief (Script/Guide).
      *   Predictable Failures.
      *   Limitations.
      *   Failure Conditions.

  13. **Review against Constraints:**
      *   45 mins? Yes.
      *   16 students? Yes.
      *   Invented case? Yes (The Republic of Meridia).
      *   No lecture up front? Yes.
      *   Trivial stakes? Yes.
      *   Address the "rationalising forecast" risk? Yes.

  14. **Final Polish of the "Twist":**
      *   Make sure the twist doesn't invalidate the previous drawers, but *re-weights* them.
      *   Actually, the prompt says "files it just as naturally under a third drawer".
      *   Okay, I will design the text so the re-classification feels obvious in hindsight.

      *(Self-Correction during drafting)*: I need to make sure the students don't just ignore the base rates. I will force them to write down the % associated with their choice.

      *(Refining the "Predictable Failure")*: The prompt specifically suspects someone will pick the drawer that rationalises the forecast. I need to highlight this in the debrief as the *point*, not a bug. The game *reveals* this bias.

      *(Refining Limitations)*: The game shows the *power* of the reference class, but not the *truth* of it. I must state that.

      *(Refining "Change your mind")*: If 100% of students switch their prediction exactly in line with the base rate, they haven't learned about bias; they've learned to obey the game. If 0% switch, the scenario is too rigid. I want a split.

      *Let's write it.*
answer: |-
  # Game Title: The Meridian File

  **Concept:** A 45-minute simulation demonstrating *Reference Class Forecasting*. Students will realise that their prediction of a state's survival is determined less by the facts of the case and more by the category they choose to file it under.

  **Target:** 16 students (Years 11–13).
  **Materials:** Printed handouts, three sets of coloured envelopes, pens, a timer, small prizes (chocolate or house points).

  ---

  ## 1. Materials Preparation

  **A. The Case File (16 copies)**
  A single sheet of A4. Neutral, intelligence-brief style.
  > **SUBJECT:** The Republic of Meridia
  > **AGE:** 70 Years
  > **STATUS:** Sovereign Maritime Confederation
  > **GOVERNANCE:** Written Constitution (The Charter of Tides).
  > **ECONOMY:** Trade tariffs, naval leasing, salt mining.
  > **RECENT HISTORY:** Won the 'Salt War' decisively against mainland rivals 2 years ago.
  > **CURRENT CRISIS:** The High Admiral (Head of State) died intestate. Two factions claim succession: the Merchant Council and the Fleet Captains.
  > **QUESTION:** Will Meridia exist as a sovereign entity in 50 years?

  **B. The Drawers (3 Sets of Envelopes)**
  Place these on a central table.
  *   **Blue Envelopes (Label: CONSTITUTIONAL STATES):** Inside is a card reading: *"Historical Survival Rate (50yr): 85%."*
  *   **Red Envelopes (Label: MARITIME CONFEDERATIONS):** Inside is a card reading: *"Historical Survival Rate (50yr): 25%."*
  *   **Green Envelopes (Label: RENEWABLE TREATY ALLIANCES):** Inside is a card reading: *"Historical Survival Rate (50yr): 5%."*
  *(Note: The Green envelopes are kept hidden by you until Phase 3.)*

  **C. The Forecast Slip (16 copies)**
  A small slip of paper with three fields:
  1.  **Prediction:** [ ] Survive  [ ] Collapse
  2.  **Chosen Drawer:** [ ] Blue  [ ] Red
  3.  **Implied Probability:** ______ % (Copy the number from the envelope)

  **D. The Twist Card (16 copies)**
  Handed out in Phase 3.
  > **ADDENDUM TO FILE:**
  > Legal review of the 'Charter of Tides' reveals Clause 14: The Charter is not permanent law. It is a treaty renewed by vote of the Fleet Captains every 10 years. If a vote fails, the Confederation dissolves automatically. The next vote is in 3 years.

  ---

  ## 2. Run of Play (45 Minutes)

  **00:00 – 00:05 | Arrival & Silence**
  *   Students sit. Hand out **The Case File** and **Forecast Slip**.
  *   **Rule:** "No talking. Read the file. Make your prediction. Choose a Drawer (Blue or Red) that you think best fits Meridia. Collect that envelope. Read the card inside. Write the percentage on your slip. Seal the slip in the envelope."
  *   *Why:* Prevents groupthink. Forces an initial commitment based on intuition.

  **00:05 – 00:15 | The First Filing**
  *   Collect the sealed envelopes. Do not open them.
  *   Ask the room: "Show of hands, who predicted Survival?" (Tally on board). "Who predicted Collapse?"
  *   Ask: "Who chose the Blue Drawer?" "Who chose the Red Drawer?"
  *   *Observation:* You will likely see a correlation. Blue-choosers probably predicted Survival. Red-choosers probably predicted Collapse.
  *   **Do not comment on this yet.**

  **00:15 – 00:25 | The Twist**
  *   Hand out **The Twist Card**.
  *   **Rule:** "Read the addendum. This is a true fact about Meridia that was previously withheld. It does not change the history, only the legal classification."
  *   Bring out the **Green Envelopes**.
  *   **Rule:** "You must now file Meridia again. You may stick with Blue or Red, or switch to Green. Collect the new envelope. Look at the rate."
  *   **Action:** Ask them to turn over their Forecast Slip. On the back, write:
      1.  **New Prediction:** [ ] Survive [ ] Collapse
      2.  **New Drawer:** [ ] Blue [ ] Red [ ] Green
      3.  **Did you change your mind?** [ ] Yes [ ] No

  **00:25 – 00:35 | The Reveal & Payoff**
  *   Collect the slips.
  *   **The Reveal:** "We cannot know the future of Meridia. It is invented. But we can score *you*."
  *   **Scoring Rule:** "You get a point if your **Drawer** was the most statistically rational choice given the information available at that time."
      *   *Phase 1 Winner:* Anyone who picked Red (Maritime Confederations are historically unstable compared to Constitutional States, and Meridia fits both, but the 'Confederation' title is explicit). *Actually, keep this ambiguous.*
      *   *Better Scoring:* "You get a point if your **Prediction** matched the **Base Rate** of the Drawer you chose."
      *   *Example:* If you picked Blue (85% survival) and predicted 'Survive', you get a point. If you picked Blue but predicted 'Collapse', you get no point (you ignored your own evidence).
      *   *Phase 2:* Same rule. If you picked Green (5% survival) and predicted 'Collapse', you get a point.
  *   Award prizes (chocolate) to those with 2 points.

  **00:35 – 00:45 | The Debrief**
  *   (See script below).

  ---

  ## 3. The Debrief Script

  Do not start with definitions. Start with the room's behaviour.

  **Step 1: The Correlation (5 mins)**
  *   "In Phase 1, how many people picked the Blue Drawer and predicted Survival?" (Most hands).
  *   "How many picked Red and predicted Collapse?" (Most hands).
  *   "Did anyone pick Blue but predict Collapse?" (Likely few/none).
  *   **Point:** "You didn't weigh the evidence first. You picked the category that gave you the answer you wanted. The forecast was settled the moment you reached for the envelope."

  **Step 2: The Twist & Rationalisation (5 mins)**
  *   "In Phase 2, who changed their prediction?"
  *   "Who kept the same prediction (e.g., 'Collapse') but swapped from Red to Green?"
  *   **Point:** "This is the danger. The facts of Meridia didn't change. Only the label did. If you kept 'Collapse' but swapped to Green, you didn't learn new information; you just shopped for a statistic that forgave your gut feeling."

  **Step 3: The Vocabulary (5 mins)**
  *   Now introduce the terms.
  *   **Inside View:** Judging Meridia by its specific details (the Salt War, the Admiral).
  *   **Outside View:** Judging Meridia by the class it belongs to.
  *   **Reference Class:** The Drawer. Blue, Red, or Green.
  *   **Base Rate Neglect:** Ignoring the percentage inside the envelope in favour of the story in the Case File.
  *   **Closing Line:** "History doesn't repeat, but it rhymes. The danger isn't picking the wrong rhyme; it's picking the rhyme that sounds best."

  ---

  ## 4. Predictable Failures & Mitigations

  **Failure 1: The "Rationaliser"**
  *   **Risk:** A student picks Red (25% survival) but predicts 'Survive' because "Meridia is special."
  *   **Handling:** This is actually a *success* for the lesson, provided you catch it in the scoring. In the debrief, ask them: "If the base rate is 25%, what specific evidence outweighs 70 years of statistical failure?" If they cite the Case File (Inside View), highlight that they have rejected the Outside View. This is the core tension you want.

  **Failure 2: The "Obey-er"**
  *   **Risk:** Students treat the Base Rate as destiny. They pick Green (5%) and immediately say "It's dead."
  *   **Handling:** In the debrief, clarify: "The Base Rate is not a prophecy. It is a starting point. The game showed you that the *choice* of rate is political. In the real world, politicians choose the Reference Class to justify policy. Churchill didn't compare 1940 to average wars; he compared it to 1914."

  **Failure 3: Time Overrun**
  *   **Risk:** Discussion drags during the reveal.
  *   **Handling:** Be a dictator on time. Use a visible timer. If they are debating the "Twist," cut them off: "The legal clause is fact. File it."

  ---

  ## 5. Limitations of the Design

  **What this game cannot stage:**
  This game demonstrates the *power* of the Reference Class, but it cannot teach how to select the *correct* Reference Class.
  *   In the game, Green is clearly the "best" fit after the twist.
  *   In reality, is Meridia a "State," a "Confederation," or a "Treaty Alliance"? It is arguably all three.
  *   **You must say this out loud:** "The game rigged the Twist so Green was the obvious choice. In real life, there is no Green envelope. You have to argue for which Drawer exists. That is where the real politics happens."

  **What would convince me the game taught the wrong lesson:**
  *   **Total Consensus:** If 100% of the room switches to Green and predicts 'Collapse' in Phase 2, they have learned to obey the game master, not to think critically.
  *   **Total Cynicism:** If they conclude "Statistics don't matter, it's all just storytelling," they have missed the point. The Base Rate *does* matter; the choice of it is what is subjective.
  *   **The Fix:** If you see Total Consensus, challenge it in the debrief. "Is it possible Meridia survives despite the 5% rate? Who would argue that?" (Answer: Someone invested in Meridia).

  ---

  ## 6. Physical Setup Checklist

  1.  **Seating:** Cabaret style (clusters of 4) encourages whispering, which you want to suppress in Phase 1. Rows are better for the first 15 mins, then allow turning.
  2.  **Envelopes:** Pre-sort them. 6 Blue, 6 Red on the table initially. 16 Green hidden under the table.
  3.  **Board:** Write "SURVIVAL" and "COLLAPSE" on opposite sides. Use magnets to tally votes visibly.
  4.  **Tone:** You are the Archivist, not the Teacher. Neutral, bureaucratic, slightly cold. Do not offer opinions on Meridia.

  ## 7. Why this works for Upper Sixth
  It respects their intelligence by withholding the terminology until the end. It treats them as analysts rather than pupils. The "invented" constraint removes the ability to show off historical knowledge (e.g., "But this is just the Hanseatic League!"), forcing them to rely on the structural logic you want to test. The 45-minute limit creates a pressure cooker that mimics the urgency of real policy forecasting.
