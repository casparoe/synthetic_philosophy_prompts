      *   *Goodwill Impairment:* "National Reputation" or "Social Trust" is an intangible asset. Historical wrongs impair this goodwill. An apology is an attempt to stop the bleeding, but reparations are the write-down/restructuring.
      *   *Audit Trail Continuity:* Can we trace the ledger from then to now? Land records, wealth accumulation, legal structures.
