          *   **Constraint:** No bibliography/citations. Just steps, cases, and honest account of misfires.

  2.  **Deconstruct the Theory (Wittgenstein's Hinges):**
      *   Hinge propositions are certainties that underpin our language games and reasoning. They aren't proven; they are the scaffolding.
      *   Examples: "The world exists," "I have two hands," "Doctors try to help."
      *   In ethics: "Life is sacred," "Autonomy is paramount," "Death is biological cessation."
      *   Conflict arises when the clinical team's hinges clash with the patient's hinges.
      *   Goal: Don't try to prove the hinge wrong (impossible); identify it, respect it if possible, or identify the impasse.

  3.  **Drafting the Procedure (The "Hinge Check"):**
      *   *Time limit:* 15 minutes. Needs to be punchy.
      *   *Step 1: Identify the Stuck Point.* Is it a fact or a frame?
      *   *Step 2: Test for Falsifiability.* Can evidence move this?
      *   *Step 3: Identify the Function.* What work is this belief doing? (Identity, Safety, Sacredness).
      *   *Step 4: Compatibility Check.* Can we accommodate this hinge without violating *our* non-negotiable hinges (law/safety)?
      *   *Step 5: Decision/Impasse.*
      *   *Stopping Rules:* Crucial for the "flowchart in words" feel.
      *   *Judgement Flag:* Where do we admit we just disagree on fundamentals?

  4.  **Developing the Worked Examples:**
