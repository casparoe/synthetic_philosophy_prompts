      *   *Structure:*
          1.  Introduction (The "Hinge Check" Protocol).
          2.  The Procedure (Steps 1-5).
          3.  The Deep/Shallow Test.
          4.  Worked Examples.
          5.  Limitations/Misfires.
      *   *Self-Correction on Brain Death:* In the UK, brain stem death *is* legal death. Continuing ventilation is legally futile. The procedure must flag this as a "Legal/Clinical Hinge vs. Personal Hinge" conflict where the Legal Hinge wins, but the *process* validates the family's grief without validating the medical error. The "uncomfortable answer" is that we must stop treatment despite their sincere hinge, because our institutional hinges (law) are rigid here.

  9.  **Final Polish:**
      *   Ensure the "Judgement Flag" is clear.
      *   Check the 15-minute feasibility (keep questions tight).
      *   Make sure the distinction between "factual error" and "hinge" is operationalized.

  **(Self-Correction during drafting):** I need to make sure I don't give medical advice. This is an *ethics* procedure. I also need to ensure the "uncomfortable answer" in the brain death case is ethically sound within the NHS context (i.e., you can't treat a dead body, but you must handle the family's hinge with care).

  Let's write the "Hinge Check Protocol."

  *Step 1:* Is this a dispute about *what is happening* or *what it means*?
  *Step 2:* The Evidence Test. Would new data change their mind?
  *Step 3:* The Cost of Change. What breaks if they accept our view?
  *Step 4:* The Legal/Clinical Boundary. Does their hinge break the law or safety standards?
  *Step 5:* Resolution or Impasse.

  *Deep/Shallow Test:* "If you were wrong about this, what else would have to change?"

  *Examples:*
  1. JW: Hinge confirmed. Accommodate.
  2. Chemo: Hinge confirmed (mostly). Explore alternatives/palliative.
  3. Brain Death: Hinge clash. Legal hinge prevails. Uncomfortable.

  *Limitations:* Empirical hinges, safeguarding, capacity issues.

