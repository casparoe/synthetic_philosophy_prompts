      *   *Cancer/Naturalism:* "Synthetic = Corrupt." This is trickier. Is it a hinge or a misinformation issue? Procedure needs to distinguish. If it's a deep worldview (natural purity), it's a hinge. If it's "chemo is poison" (factual claim), it's educable. Let's make it a hinge for the exercise.
      *   *Brain Death:* This is the "uncomfortable" one. Legally, brain stem death is death in the UK. Family says "Death = Consciousness gone." This is a metaphysical hinge clashing with a legal/biological hinge. The procedure must acknowledge the clash but ultimately defer to the legal/clinical hinge *while acknowledging the moral residue*. This is where it hurts.

  5.  **Refining the "Deep vs. Shallow" Test:**
      *   Need a specific question to add.
      *   Idea: The "World Collapse" test. If this belief is removed, does their whole worldview collapse, or just one preference change?

  6.  **Addressing Limitations (Misfires):**
      *   Hinges that look empirical (e.g., "This prayer healed people").
      *   Hinges that violate safeguarding (e.g., "Children belong to God, not doctors").
      *   The procedure can't solve the conflict, only map it.

  7.  **Review against Constraints:**
      *   NHS context (Mental Capacity Act, Best Interests).
      *   No philosophy jargon (explain "hinge" simply).
      *   15-minute runtime.
      *   Flowchart style (Ask X, If Y, Go to Z).

  8.  **Drafting the Content (Iterative refinement):**
