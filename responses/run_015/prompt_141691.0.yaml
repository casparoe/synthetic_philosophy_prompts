  **B. The Authorship & Agency Principle**
  *   **The Rule:** You must be the genuine author of your actions and achievements. You cannot outsource your agency.
  *   **Track Record:** Explains *Ghostwriter* (NO, you didn't write) vs. *Pill* (YES, you did the work, just felt fake satisfaction). Explains *Original Machine* (NO, preprogrammed).
