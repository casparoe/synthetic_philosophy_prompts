  ### 3. The Follow-Up Variant: "The Telemedicine Settlement"

  To confirm that Principle D is the real rule (and not just a vague aversion to "life in a box"), you need to test whether her objection is about **Location** (you must be physically in the base world) or **Impact** (your actions must matter in the base world).

