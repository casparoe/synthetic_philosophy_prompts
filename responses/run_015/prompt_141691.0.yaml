  *   **If she says YES:** Her rule is **Causal Impact**. The "nothing is anything" quote meant "nothing has consequences." If the sim bleeds into reality, it becomes real enough.
  *   **If she says NO:** Her rule is **Ontological Grounding**. It doesn't matter what you affect; *you* must be physically present in the base world to live a human life. The "Pianist" constraint ("not the main thing") is about physical presence, not just impact.

  ### 4. A Note on Underdetermination

  If you are worried her old verdicts genuinely underdetermine the answer, it hinges on the **AI Natives**.
