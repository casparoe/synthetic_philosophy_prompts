  Dana's track record shows a hierarchy of values. While she cares about consent (Principle A) and agency (Principle B), those are *necessary* conditions, not *sufficient* ones.
  *   The **Pill Case** is the smoking gun. She accepts *internal* unreality (fake feelings) as long as the *external* reality (real job, real family) is preserved.
