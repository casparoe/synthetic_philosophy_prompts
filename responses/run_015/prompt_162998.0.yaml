answer: |-
  ### Root Commitment
  We want the truth about a specific question about the codebase, and right now we cannot cheaply check it.

  ### Branch Nodes (Decision Questions)
  *Answer these based on constraints and beliefs, not on which solution you prefer.*

  1.  **Timing:** Can we run the full test suite before the merge decision is required?
  2.  **Determinism:** Is the test outcome deterministic given the code and environment state?
  3.  **Access:** Do we have white-box access (ability to read internal model states, not just inputs/outputs)?
  4.  **Labels:** Do we possess a trusted dataset of past patches labeled with actual test outcomes?
  5.  **Latency:** Is the latency budget large enough to allow multiple sequential model queries?
  6.  **Structure:** Do we assume the answer is encoded in a way a linear classifier can extract (data classes divided by a single straight boundary in high-dimensional space)?
  7.  **Capability:** Is the model potentially more capable than the engineers reviewing its output?
  8.  **Training:** Are we willing to fine-tune or retrain the model weights for this task?
  9.  **Audit:** Do we require the justification to be readable by a human auditor?
  10. **Incentives:** Is there a risk the model will optimize for satisfying the evaluator rather than finding truth?
  11. **Error Mode:** Do we believe the error stems from missing context or flawed reasoning?
  12. **Middleware:** Is there a deterministic checker available that is slower than the model but faster than the full test suite?
  13. **Abstention:** Do we accept "I don't know" as a valid output state?
  14. **Scope:** Is the goal to improve this specific model or to build a general verification pipeline?

  ### Logical Space Analysis
  *Combinations of answers define the viable regions. Some are empty.*

  *   **Available:** Most combinations where constraints match resources (e.g., White-box + No Labels + Linear Assumption).
  *   **Empty (Incoherent):**
      *   *Supervised Probe* path with **Q3=No** (Cannot probe without access) or **Q4=No** (Cannot supervise without labels).
      *   *Training Changes* path with **Q8=No** (Contradicts willingness to train).
      *   *Defer* path with **Q1=Yes** (If you can test now, deferring verification is a policy choice, not a technical constraint).
  *   **Empty (Unattractive):**
      *   **Q7=No** (Model dumber than humans) + **Q5=Yes** (High latency for debate). If humans are smarter, just ask humans; multi-model debate is waste.
      *   **Q12=Yes** (Fast checker exists) + **Q8=Yes** (Retrain model). If you have a fast checker, use it directly; retraining is unnecessary cost.
  *   **Empty (Unexplored):**
      *   **Q6=No** (Non-linear) + **Q4=No** (No labels) + **Q3=Yes** (White-box). Unsupervised non-linear extraction is theoretically possible but rarely implemented in production tooling.

  ### Leaves (Approaches)
  *Mapped to regions in the space above.*

  1.  **Defer & Verify** (Q1=No, Q2=Yes)
      *   **Build:** Async job runs tests post-merge, alerts on break, auto-reverts.
      *   **Commitment:** We accept temporary broken states in main as a cost of speed.
  2.  **Prompting + Monitor** (Q3=No, Q8=No, Q9=Yes)
      *   **Build:** Chain-of-thought prompt with confidence score logging for later audit.
      *   **Commitment:** Text output correlates sufficiently with internal correctness despite no white-box access.
  3.  **Supervised Probe** (Q3=Yes, Q4=Yes, Q8=No)
      *   **Build:** Linear classifier trained on activations to predict test breakage.
      *   **Commitment:** Past labels generalize to future code patterns without weight updates.
  4.  **Unsupervised Probe** (Q3=Yes, Q4=No, Q6=Yes)
      *   **Build:** Consistency maximization over activation clusters without labels.
      *   **Commitment:** Truth is the most consistent signal across perturbations, even without ground truth.
  5.  **Debate/Amplification** (Q5=Yes, Q7=Yes)
      *   **Build:** Two model instances argue breakage risk, judge picks winner.
      *   **Commitment:** Adversarial process converges to truth faster than single query.
  6.  **Training Changes** (Q8=Yes, Q4=Yes)
      *   **Build:** Fine-tune model on correct breakage predictions using RLHF.
      *   **Commitment:** Gradient updates will align output with internal knowledge rather than breaking it.
  7.  **Mech Interp** (Q3=Yes, Q9=Yes, Q6=No)
      *   **Build:** Manually trace circuit responsible for test prediction logic.
      *   **Commitment:** Model logic is reverse-engineerable within budget.
  8.  **Skeptic/Simulation** (Q10=Yes, Q6=No)
      *   **Build:** Treat model output as probabilistic suggestion, require human sign-off.
      *   **Commitment:** No latent truth exists to extract, only simulation of an answerer.
  9.  **Index/Checker** (Q12=Yes, Q2=Yes)
      *   **Build:** Model retrieves relevant tests, deterministic runner executes only those.
      *   **Commitment:** Retrieval recall is perfect enough to not miss breaking tests.

  ### Indistinguishability Flags
  *   **Supervised Probe vs. Training Changes:** The tree separates these on **Q8** (willingness to train), but if training is cheap, the distinction collapses; both rely on labels to correct the model's signal.
  *   **Mech Interp vs. Skeptic:** If Mech Interp fails to find a circuit after budget exhaustion, the operational outcome is identical to Skeptic; the tree does not capture this failure-mode transition.
  *   **Prompting vs. Skeptic:** Both treat the model as a black box; they differ only on **Q10** (belief about incentives), which is a philosophical stance, not an observable system property.

  ### Confidence & Disagreement Calibration

  **Agreed Facts:**
  *   Running the full test suite is too slow for pre-merge feedback on every patch (Q1=No).
  *   The model's prose output sometimes contradicts later verified reality.
  *   We have white-box access to the model hosting environment (Q3=Yes is technically feasible, though policy may vary).

  **Live Disputes:**
  *   **Latent Verdict Existence:** Half the team believes activations contain a "verdict" distinct from output (supports Probes/Mech Interp). The skeptics believe the model is a next-token predictor simulating an answerer, with no hidden truth state (supports Skeptic/Prompting).
  *   **Probe Generalization:** There is no consensus on whether a probe trained on past CI logs will work on new code structures (distribution shift).

  **Framing Presuppositions:**
  *   **Single Latent Fact:** The root commitment ("want the truth") and the Probe leaves presuppose there is a single factual answer encoded in the model. The Skeptic leaf rejects this, arguing the model generates plausible text, not retrieved facts.
  *   **Probe Validity:** Your memory regarding unsupervised consistency-based probes is **roughly right for factual QA datasets** (e.g., True/False questions on known topics), where such methods have beaten zero-shot accuracy by small margins and resisted "lie" prompts.
      *   **Weight:** Moderate evidence that activations contain info not in output.
      *   **Limitation:** This does not establish capability for complex logical derivation (like code execution) versus factual recall.
      *   **Does Not Establish:** That the probe finds "truth" rather than "what the model believes is true" (which could be confidently wrong).
      *   **Calibration:** Treat this as a promising signal for *internal consistency*, not a guarantee of *external correctness*.

  **Uncertainty Note:**
  *   It is unclear whether **Unsupervised Probe** (Leaf 4) is viable for code logic; most successful demonstrations are on natural language truthfulness, not computational correctness. If this fails, the space collapses toward **Skeptic** or **Index/Checker**.
