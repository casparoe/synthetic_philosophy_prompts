nfinite replicator dynamics with evolutionary stability against neutral drift, and it glosses over the fact that in finite populations under stochastic dynamics, tit-for-tat can actually be favored over always-defect if the selection intensity is weak enough and the benefit-to-cost ratio is sufficiently high. This is a correction that would fundamentally undermine the punchline because if I were to strictly adhere to the conditions for cooperation in finite populations without spatial structure, the theorist would actually be correct that cooperation is robust provided the specific inequalities for stochastic stability are met, so the joke only works because it assumes an infinite well-mixed population where neutral drift inevitably erodes the cooperative cluster. Ultimately the humor relies on the mismatch between the clean mathematics of infinite populations and the messy reality of human relationships where we pretend our interactions are evolutionarily stable when they are merely strategically convenient, but acknowledging that finite population stochasticity often supports cooperation more than replicator dynamics suggests would require me to rewrite the theorist's defeat as a vindication, which would unfortunately ruin the comedy.
