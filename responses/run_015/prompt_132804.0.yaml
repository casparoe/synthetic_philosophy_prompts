answer: |-
  **Scenario**
  The Director of Financial Stability at a central bank must decide whether to authorize a "Liquidity Freeze" on a major institution before the morning market open. The bank's charter contains a "Certainty Mandate": intervention is legally permissible *only if* the institution's collapse is already an inevitable fact; otherwise, the freeze constitutes unlawful market manipulation that triggers the very panic it aims to prevent. The collapse depends on chaotic trader sentiment: if the Director waits, the future remains genuinely open, with branches for both solvency and ruin; if the Director authorizes the Freeze, the market interprets this as definitive proof of insolvency, collapsing all branches into a single timeline of guaranteed failure (though the Freeze salvages some assets). If the collapse is already metaphysically settled regardless of the Freeze, the authorization mitigates systemic damage; if the future is open, authorization creates the failure, while waiting preserves the possibility of solvency.

  **(i) Claim, Method, and Worlds**
  *   **Claim at Issue ($P$):** "The institution collapses at $t+1$."
  *   **Decision Method:** The Director acts on a normative rule: *Authorize if and only if $P$ is presently true.*
  *   **Relevant Worlds/Branches:**
      *   *SAF World:* A single linear timeline where $P$ is already True (the "Thin Red Line").
      *   *OF Worlds:* A branching structure where, at $t_0$, there are multiple future branches (some with $P$, some without), and $P$ lacks a truth value.

  **(ii) Reasoning and Bivalence**
  *   **Single-Actual-Future (SAF) Account:** This view accepts bivalence for future contingents. Even if epistemically uncertain, $P$ is either True or False now. Given the scenario's stipulation that the collapse is inevitable *if* SAF holds (or rather, the SAF proponent treats the "inevitability" condition as satisfied by the existence of the fact), the SAF reasoning is: (1) $P$ is True now (metaphysically settled); (2) The Mandate permits action when $P$ is True; (3) Action mitigates damage. **Recommendation: Authorize Now.** Bivalence allows the Director to treat the future as a fixed target for mitigation.
  *   **Open-Future (OF) Account:** This view denies bivalence for contingent futures. At $t_0$, $P$ is neither True nor False. The reasoning is: (1) $P$ is Indeterminate now; (2) The Mandate forbids action unless $P$ is True; (3) Furthermore, Authorizing *makes* $P$ True (collapsing branches), whereas Waiting keeps $P$ Indeterminate (preserving the solvency branch). **Recommendation: Wait.** The absence of a truth value blocks the normative permission to act, and the decision-sensitivity means acting violates the spirit of the Mandate by forcing the settlement.

  **(iii) Structural Feature and Collapse**
  The divergence is forced by the **normative-causal loop**: the permission to act depends on the *prior truth* of the outcome, but the act itself *determines the truth* of the outcome in the Open-Future view.
  *   **Deterministic Causal Chain:** If the outcome were determined by past physical states independent of the decision (standard causation), $P$ would be True/False based on the past, not the authorization. Both SAF and OF would treat this as a standard prediction problem; the "branching" would be merely epistemic. The decision would reduce to expected utility (Risk Analysis), as the metaphysics of the future's *settledness* would no longer be a condition of *permission*.
  *   **Causally Independent Choice:** If the authorization did not influence the market (no self-fulfilling prophecy), the Director's choice would not collapse branches. The OF defender would then have to weigh probabilities of $P$ occurring independently. The distinction between "Indeterminate" and "False" would lose practical bite, collapsing back into weighing odds rather than respecting metaphysical constraints on agency.

  **(iv) Objection and Weakness**
  *   **Strongest OF Objection:** The SAF recommendation is practically inert because the Director lacks **epistemic access** to the "Thin Red Line." If $P$ is True but unknowable (distinct from high probability), the Director cannot satisfy the Certainty Mandate's *knowledge* condition without guessing. Therefore, the SAF view demands an impossible epistemic state, forcing the Director to act on faith rather than fact, which is irrational in policy.
  *   **Precise Weakness:** This objection conflates *metaphysical settledness* with *epistemic certainty*. The SAF view can argue that the Mandate requires the *fact* of settledness, not the *knowledge* of it (similar to strict liability). If the policy goal is to align human action with reality, the SAF account provides a coherent (if risky) alignment strategy, whereas the OF account risks paralysis by treating all unsettled futures as normatively identical, potentially ignoring strong evidence that functions *as if* the future were settled.
