answer: |-
  Good morning. Looking around this room, I see the three necessary forces required to turn a ruin into a resource. I see the engineers who calculate what a building *can* do; the architects who imagine what it *should* do; and the policymakers who decide what a building *is allowed* to do.

  I also see the tension that brought us here. On one side, the urgent imperative for climate-efficient development. New materials, tighter envelopes, higher densities. From this vantage point, the old factory is a carbon liability, a spatial obstruction, a ghost blocking the grid. On the other side, the conviction that these structures are irreplaceable. Not merely for their aesthetics, but for the continuity they provide.

  If we are to make progress this week, we must move beyond the stalemate of "efficiency versus sentiment." We need a structural framework for decision-making. I propose we find that framework in two old ideas, applied to new steel.

  The first is the principle of the fence. There is a maxim that suggests you should never remove a fence until you understand why it was put there. In our context, the "fence" is the infrastructure itself. It is easy to look at a brick wall or a truss system and see only a constraint on your program. It is harder to ask why that wall is thick, or why that truss spans exactly that distance.

  When we treat demolition as the default option for development, we assume that the original builders were irrational or that their reasons are irrelevant to us. But structural form is never accidental. It is a physical record of a solution to a problem. That problem might have been logistical, geological, or social. If we tear down a structure without fully recovering the logic of its assembly, we are deleting data. We are assuming that our current calculations are superior to the empirical evidence of the building's own survival.

  This leads to the second idea: prescription. This is the notion that time itself is a form of testing. A building that has stood for a century has survived stresses we did not model. It has endured settlement, thermal cycling, and vibration that no simulation can perfectly replicate. Its continued existence is a data point of resilience. To prescribe value to this endurance is not nostalgia; it is risk mitigation. It is acknowledging that the structure has passed a long-term stress test that our new constructions have not yet begun.

  Therefore, the burden of justification must rest on demolition, not preservation. If you wish to remove the fence, you must prove you understand why it was built. If you wish to erase the structure, you must prove you understand what resilience you are discarding.

  However, I must offer a critical concession. This burden of proof can never be fully discharged.

  We are not omniscient. We cannot fully recover the social habits, the labor conditions, or the specific material constraints that dictated the form of this infrastructure. The original "why" is partly irrecoverable. The mortar recipe is lost; the informal workflows are forgotten. Because we cannot know everything the building knows, we cannot make a perfectly rational cost-benefit analysis regarding its removal.

  This uncertainty is not a reason for paralysis; it is a reason for humility. It means that every demolition is, by definition, an act of speculation. We are betting that the new design will perform better than the old one, without ever knowing the full capacity of the old one.

  So, how does this help us work?

  For the engineers, it means treating existing structures not as obstacles to be overcome, but as partners with latent capacity. Your job is to find the safety margins that time has revealed.

  For the architects, it means designing interventions that respect the logic of the host, rather than forcing a new logic upon it. You are translating a language, not erasing the page.

  For the policymakers, it means recognizing that preservation is not a regulatory hurdle, but a check against the arrogance of the present. It is a way of managing the risk of losing embodied wisdom.

  We are here to discuss adaptive reuse. But adaptation requires a host that is still alive. If we approach these structures with the assumption that they are merely obstacles, we kill the host before the surgery begins.

  Let us proceed with the understanding that we do not know everything. Let us proceed with the understanding that the burden is on us to justify removal, even if we know we can never fully meet that burden. And let us use that tension to drive innovation, not deadlock.

  Thank you.
