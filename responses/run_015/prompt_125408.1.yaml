      *   *Idea:* Photography? Two prints from the same negative, one signed by the artist, one not? Too close to mechanical.
      *   *Idea:* Casting? Two bronze casts from the same mold?
      *   *Idea:* *The Artist's Proof vs. The Posthumous Cast.* Or *The Lifetime Print vs. The Estate Print.*
      *   *Selection:* **Two impressions from the same plate (printmaking).**
          *   *Why:* It's a print study room. It fits the medium.
          *   *Twist:* One is a "Lifetime Impression" (pulled by/under the artist), one is a "Posthumous Impression" (pulled from the same plate after death, legally authorized but not by the artist).
          *   *Why this works:* Visually, they can be identical (no perceptual tell). Mechanically, they come from the same matrix (not a copy of a copy). But the *history of production* differs.
          *   *Variations:* Can dial up "Plate Defacement" (artist defaced plate after edition) vs. "Plate Survival" (estate kept printing).
      *   *Alternative:* **Two Ceramics.** One fired in the artist's kiln, one fired later from the same mold/clay mix.
      *   *Decision:* Stick to Prints since it's the Print Study Room. It leverages the setting. Let's specify: *Two impressions from the same etching plate. One pulled during the artist's life (Artist's Proof), one pulled 20 years later by the estate (Posthumous).*

  4.  **Evaluate the Scaffolding (Origin, Career, Exposure):**

      *   *Origin Value:* Who made it? (Constitutive).
      *   *Career Value:* Provenance, survival, historical context.
      *   *Exposure Value:* This is tricky. The prompt defines it as "value from having been found out" (e.g., a famous forgery teaching us something).
      *   *Critique:* Is "Exposure Value" real? It feels like a subset of Career Value (historical significance). However, for the specific goal (answering the visitor), it's useful to acknowledge that fakes *have* value, just different value. Let's keep it but rename/refine it to **"Testimony Value"** or keep "Exposure" but clarify it's about the object's role in art history *as a fake*. Actually, the prompt asks if it's real or disguised Career Value. It *is* a form of Career Value (the object's biography includes being a scandal). But for the docents, distinguishing "Value as Art" vs. "Value as Artifact" is key. Let's advise keeping it but positioning it late, so it doesn't confuse the core "Origin" argument.
      *   *Refinement:* Call it **"Historical Testimony Value."** It belongs in the "Complications" phase, after establishing Origin Value.

  5.  **Handle the "Traps" (Van Meegeren & Workshop):**

      *   *Van Meegeren:*
          *   *Trap:* It focuses on *deception* and *money* (treason trial, selling to Nazis). It reinforces the "it's all about money/scandal" view.
          *   *Gift:* It proves that *knowledge changes the experience*. Once we knew they were fakes, they looked different (psychological effect).
          *   *Placement:* Middle. Use it to pivot from "Visual" to "Knowledge."
      *   *Workshop Replica:*
          *   *Function:* It breaks the Binary (Real vs. Fake). It shows "Authorized but not by hand."
          *   *Placement:* Closing the gap. Use it to show that "Origin" isn't just "One Genius Hand," it's "Authorized Production." It prevents the "Snobbery" accusation by showing nuance.

  6.  **Sequence & Dependency Structure:**

      *   *Phase 1: The Hook (The Object).* Put the two prints on the table. Ask: "Which is worth more?" (They will guess based on look). Reveal they are visually identical but one is posthumous.
