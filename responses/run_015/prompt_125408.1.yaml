answer: |-
  Here is the dependency structure for building the session. It is designed to leverage the docents' existing expertise (attribution, materiality) to lead them into the philosophical distinction (history of production) without ever using the jargon.

  ### 1. The Carrying Example
  **The Object:** Two impressions from the same etching plate.
  *   **Impression A:** Pulled during the artist's lifetime, signed, numbered, and inked under their direct supervision.
  *   **Impression B:** Pulled from the *same* plate 20 years after the artist's death, by the estate, using the same paper and ink formulas, legally authorized, but without the artist's oversight.

  **What it has:**
  *   **Material Identity:** They are chemically and visually nearly indistinguishable.
  *   **Matrix Identity:** They come from the same source (the plate), avoiding the "copy of a copy" problem.
  *   **Tactility:** They can be passed around in the print study room.

  **What it deliberately lacks:**
  *   **Perceptual Tells:** Do not choose a pair where one is faded or foxed. If there is a visual difference, they will solve the problem with connoisseurship ("Ah, the line weight is sharper here") rather than philosophy.
  *   **Deception:** Impression B is not a forgery. It is a legitimate posthumous impression. This isolates the variable of *Origin* without contaminating it with the variable of *Fraud*.

  **The Dial:**
  *   **If they resist:** Reveal that the artist defaced the plate after Impression A was pulled, but the estate repaired it for Impression B. (This makes the history of production physically visible in the plate, even if not the print).
  *   **If they concede too easily:** Ask, "If I burn Impression A, have I destroyed the work?" vs "If I burn Impression B, have I destroyed the work?"

  ### 2. The Scaffolding (Origin, Career, Exposure)
  Your three-part split is sound, but "Exposure Value" is unstable.
  *   **Origin Value:** Keep this. It is the core argument. The work *is* the event of its making.
  *   **Career Value:** Keep this. Provenance, survival, historical context.
  *   **Exposure Value:** **Merge this into Career Value.** A detected fake has high Career Value (it tells a story about the art market, the war, the trial) but zero Origin Value. If you treat Exposure as a separate currency, you risk implying the fake is "art" in a different way. Instead, frame it as: *Origin Value determines if it is Art; Career Value determines how interesting an Artifact it is.*
  *   **Placement:** Introduce Origin first (using the Carrying Example). Introduce Career/Exposure only after they ask, "But why do we keep the fakes in the basement?"

  ### 3. The Sequence & Dependencies
  Do not start with the visitor's question. Start with the objects.

  **Phase 1: The Attribution Trap (0–15 mins)**
  *   **Action:** Put Impression A and B on the table. Ask: "One is worth 10x the other. Find the difference."
  *   **Dependency:** They will use their 20 years of experience to hunt for visual flaws.
  *   **Goal:** Let them fail. When they cannot find a visual tell, you have created the cognitive gap. The value difference cannot be in the *pixels*; it must be in the *history*.
  *   **Intervention:** Reveal the provenance. Ask: "The paper and ink are the same. The plate is the same. What changed?" Elicit: "The Artist."

  **Phase 2: Defining Origin Value (15–35 mins)**
  *   **Action:** Formalize their intuition. "You are paid to care about the object, but the object is a receipt for an event. The event is the work."
  *   **Dependency:** This must happen *before* discussing fakes. If you discuss fakes first, they will think this is about morality/law. By using the Posthumous Print first, you show that *authorized* later productions still lack the specific value of the *artist's act*.
  *   **Goal:** Establish that "History of Production" is constitutive. It's not snobbery; it's ontology.

  **Phase 3: The Workshop & The Binary (35–50 mins)**
  *   **Action:** Introduce the **Workshop Replica**. (e.g., A Rubens painted by assistants under his supervision).
  *   **Dependency:** Use this *after* Origin Value is established.
  *   **Goal:** Prevent the "Binary Collapse." If Origin is all that matters, the Workshop piece should be worthless. It isn't. Why? Because the "Artist" is sometimes a brand/office, not just a hand.
  *   **Placement:** Use this to **close the gap**. It shows the docents that "Origin" is nuanced (Authority vs. Hand), which stops them from sounding like rigid purists when talking to visitors. It gives them a "Yes, but..." tool.

  **Phase 4: The Van Meegeren Pivot (50–65 mins)**
  *   **Verdict:** **Gift, but only here.**
  *   **Why:** If used early, it triggers moral outrage (Nazis, treason). Used here, it illustrates the *phenomenology* of Origin Value.
  *   **Action:** Ask: "When we thought the Vermeer was real, we saw a masterpiece. When we knew it was Van Meegeren, did the paint change?"
  *   **Goal:** Prove that *knowledge of origin changes perception*. This arms them against the visitor who says "But they look the same." The answer is: "They don't, not to a trained eye, because the eye reads history."
  *   **Integration:** This is where you unlock **Career/Exposure Value**. The Van Meegeren is a terrible Art (low Origin) but a fantastic Artifact (high Career/Exposure). That is why we keep it.

  **Phase 5: Synthesis for the Visitor (65–75 mins)**
  *   **Action:** Return to the visitor's question: "What are you paying for?"
  *   **Goal:** Draft the script. "You are paying for the connection to the creative act, not just the visual data."

  ### 4. Misconceptions & Intervention Points
  1.  **"The difference must be visible."**
      *   *Prediction:* They will try to solve Phase 1 with magnifying glasses.
      *   *Intervention:* **Phase 1.** Stop them. "Assume for this hour that science and eyes cannot tell them apart. If the value difference remains, where is it?"
  2.  **"It's all about money/scarcity."**
      *   *Prediction:* They will argue the price is artificial.
      *   *Intervention:* **Phase 2.** Counter with the Workshop example. Workshop pieces are rarer than some originals, yet worth less. Scarcity isn't the driver; Authority is.
  3.  **"Better science dissolves the question."**
      *   *Prediction:* "If we can date the pigment perfectly, the question is answered."
      *   *Intervention:* **Phase 4.** Science proves the *fact* of origin, but it doesn't explain the *value* of origin. Science tells you it's a fake; Philosophy tells you why that matters.

  ### 5. The Check
  **The Question:**
  "A visitor points to a perfect 3D-printed replica of a sculpture in our collection, identical in weight and texture, made with the artist's files after their death. They ask: 'Why is the one in the case special if this one feels the same?' What is your one-sentence answer?"

  **The "Polite" Answer (Fail):**
  "Well, the one in the case is the original, and it has more history and provenance, so it's more valuable to collectors."
  *   *Diagnosis:* This caves to "value = money/history." It admits the replica is aesthetically equal.

  **The "Got It" Answer (Pass):**
  "The one in the case *is* the work of art; the replica is only a record of it. You're looking at the artist's decision in the first, and only the artist's data in the second."
  *   *Diagnosis:* Distinguishes the *object* from the *information*.

  **What to Refuse to Settle:**
  You must openly refuse to settle the question of **Aesthetic Experience.**
  *   *Say this:* "I am not going to argue that the original *looks* better. Sometimes the fake looks better. I am arguing that the original *is* different. If you conflate 'looking good' with 'being art,' you will lose this argument every time. Do not defend the visual quality; defend the historical event."

  ### Summary of Dependencies
  1.  **Fail the Eye Test** (Phase 1) $\rightarrow$ Creates need for non-visual value.
  2.  **Establish Origin Value** (Phase 2) $\rightarrow$ Fills that need with "History of Production."
  3.  **Nuance with Workshop** (Phase 3) $\rightarrow$ Prevents "Origin" from becoming "Hand-only" fundamentalism.
  4.  **Validate Fakes via Career Value** (Phase 4) $\rightarrow$ Explains why we keep fakes without granting them Art status.
  5.  **Script the Visitor Response** (Phase 5) $\rightarrow$ Translates ontology into docent speech.
