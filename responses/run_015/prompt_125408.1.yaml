      *Actually, better example:* **Two Casts from the same mold.** One poured in the artist's lifetime, one after. Or **Two Photographs** from the same negative. Let's stick with **Prints** because it's the Print Study Room, but emphasize the *state* of the plate or the *supervision*.
      *Wait, re-reading constraint:* "shouldn't be a mechanical reproduction of an existing work." This usually means "don't use a poster of the Mona Lisa." Prints are originals. I will proceed with Prints but clarify the "Lifetime vs. Posthumous" distinction.

      *Refining "Exposure Value":* The user asks if it's real or disguised Career Value. It *is* Career Value (provenance includes the scandal). I should advise them to merge it into Career Value to simplify the mental model for docents, or keep it distinct only if it helps explain why we keep fakes in museums. Let's suggest merging it to avoid cognitive overload, but keeping the *concept* that fakes have *historical* value.

