      *(Refining the Precision Weight point)*: If precision is zero, the system *has* the amodal model but doesn't use it cross-modally. The Empiricist says the visual model *doesn't exist*. So zero precision is actually a hybrid or a specific failure mode, not pure Empiricism. Pure Empiricism in PC means the visual hierarchy has *no latent variable for shape* initially, only edges/blobs, until learning constructs "cube."

      *(Refining the Residue)*: The "Immediacy" point is crucial. PC says *all* perception is inference. Rationalists say *some* is direct intellectual grasp. This is a fundamental clash. PC naturalizes the "immediate" as "high precision prior."

  7.  **Final Polish:** Check against constraints. No citations. Faithful translation. Address the specific thought experiment. Address the "residue."

