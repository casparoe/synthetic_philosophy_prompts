      *   Make sure the distinction between "Common Knowledge of Rationality" and "Common Knowledge of the Game" is the centerpiece.

  8.  *(Self-Correction on the "Drifting to Foreclosure" aspect)*: I should mention that drifting to foreclosure *is* a rational outcome in a War of Attrition if the cost of waiting is lower than the cost of conceding, up until the tipping point. CKR predicts this drift if no one values the cabin enough to pay the "concession cost" of buying the others out.

