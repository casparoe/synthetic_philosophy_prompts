answer: |-
  Your universal slippage hypothesis is philosophically stimulating but ultimately untenable because it cannot account for rigid designation in formal systems, violates computational tractability constraints, and risks collapsing into an unfalsifiable tautology.

  Here are the primary objections brainstormed against your position:
  *   **Formal Invariance:** Logic and mathematics require context-independent truth values that slippage would destroy.
  *   **Causal Reference:** Kripke/Putnam arguments show natural kinds refer via history, not descriptive similarity.
  *   **Computational Tractability:** Unlimited fluidity leads to combinatorial explosion (the frame problem).
  *   **Neural Dissociation:** Brain lesions affect rule-based and similarity-based processing differently.
  *   **Copycat Misreading:** Hofstadter posited fluidity in *high-level perception*, not low-level signal processing or formal manipulation.

  **1. Formal Systems and Rigid Designation (Most Decisive)**
  The strongest counter-evidence comes from domains where conceptual boundaries *must* remain fixed for the system to function at all. In formal logic, mathematics, and computer code, symbols are defined by syntax and inference rules that do not permit analogical slippage during operation. If the concept of "identity" or "successor" in Peano arithmetic were subject to contextual negotiation, proof verification would collapse. Similarly, Saul Kripke's argument for rigid designators demonstrates that natural kind terms (like "water" or "gold") refer to the same substance across all possible worlds regardless of superficial descriptive changes. If you drink a clear liquid on Twin Earth that behaves like water but is XYZ, it is not water; the boundary is fixed by causal history, not analogical pressure. Your claim that there is "no stable literal layer" fails to explain how we successfully engage in deductive reasoning or scientific reference where stability is a prerequisite for truth preservation.

  **2. Computational Tractability and the Frame Problem**
  From a computational cognitive science perspective, a system where every concept is perpetually fluid faces the frame problem: it cannot determine which features of a situation are relevant without some stable priors. If every application of a concept requires re-negotiating its boundaries via analogical pressure, inference becomes computationally intractable due to combinatorial explosion. Human cognition avoids this by "freezing" concepts into default literal interpretations unless there is a specific trigger for metaphorical reinterpretation. Defenders of literal core architectures argue that this freezing is not just a heuristic but a structural necessity for real-time action; you cannot analogically slip the concept of "cliff edge" while walking near one. The existence of these cognitive "stop rules" suggests a functional distinction between literal and metaphorical processing, even if the underlying substrate is uniform.

  **3. Empirical Psychology and Neuroscience**
  Your view predicts a uniform neural substrate for all conceptual processing, but empirical data suggests dissociation. Dual-process theories (System 1 vs. System 2) are supported by neuroimaging showing distinct activation patterns for heuristic/associative tasks versus rule-based/logical tasks. Patients with specific prefrontal cortex damage may lose the ability to follow abstract rules while retaining similarity-based categorization, or vice versa. If all concepts were merely constrained fluidity, we would not expect such selective impairments. This suggests that while analogical extension is a powerful cognitive tool, it is implemented alongside, not instead of, mechanisms for stable rule representation.

  **4. The Charge of Unfalsifiability**
  Your position risks becoming a tautology if you define any stable concept as merely "highly constrained fluidity." If every counter-example of a fixed boundary is dismissed as just "strong analogical pressure," the theory explains everything and predicts nothing. For the claim to be scientific, there must be a condition under which you would admit a concept is truly literal. If you cannot specify what level of constraint counts as "literal" versus "fluid," you have eliminated the distinction linguistically rather than resolving it ontologically. Defenders of the literal core argue that the distinction is functional: a concept is literal if its application conditions are invariant across context, and metaphorical if they are not. Denying this functional difference obscures more than it reveals.

  **5. Correction on Copycat and Hofstadter**
  Finally, your reading of Copycat may be overextended. Hofstadter and Mitchell designed Copycat to demonstrate fluidity in *high-level perception* and analogy-making, contrasting it with classical symbolic AI that treated concepts as fixed tokens. However, even within the Copycat architecture, there were fixed structures (the code itself, the predefined letter alphabet, the temperature parameter) that did not slip. Hofstadter never claimed that *all* cognitive processing is analogical slippage; he argued that *meaningful* perception involves it. There is a difference between claiming "analogy is central to cognition" (which is widely accepted) and "analogy is the *only* mechanism and nothing is ever literal" (which is your extreme claim). The latter ignores the scaffolding required to make the analogy possible in the first place.
