answer: |-
  1. **Unit of Analysis**
  The smallest community for which this episode counts as a revolution is the specialized subfield of transmissible agent biology and neuropathology focused on TSEs. For researchers dedicated to scrapie and kuru, the shift from "unconventional virus" to "prion" required abandoning core commitments about the nature of replication and infectivity. The largest community for which it does not count as a revolution is molecular biology as a whole. For the broader discipline, the prion hypothesis did not overthrow the Central Dogma (sequence information flows from nucleic acid to protein); it merely added a post-translational mechanism of information transfer (conformational templating). The veterinary and public-health apparatus occupies a middle ground: for them, the shift was pragmatic rather than theoretical. Their paradigm is containment and eradication; whether the agent is a virus or a protein matters less than the vector (meat-and-bone meal). Consequently, the episode reveals a scaling problem in Kuhn's machinery: a revolution in a specialty does not necessarily constitute a revolution for the encompassing discipline. If the unit is the subfield, the Kuhnian fit is tight; if the unit is biology, the fit is loose, suggesting paradigms are nested rather than monolithic.

  2. **The Paradigm**
  The paradigm at stake was not biology-in-general but the specific virological commitments governing infectious disease.
  *   **Hard Commitments:** Infectivity requires a genome. Replication requires nucleic acid template-directed synthesis. The Central Dogma prohibits protein-to-protein sequence information transfer. Radiation inactivation profiles must correlate with nucleic acid target size.
  *   **Habitual Commitments:** Infectious agents are distinct from host components. Purification yields a particle distinct from host tissue. Diseases are classified by etiology (viral, bacterial, genetic).
  *   **The Unthinkable:** That a host-encoded protein could be the infectious agent. That conformational state, rather than sequence, could encode strain specificity. That an agent could replicate without nucleic acid.
  The protein-only hypothesis was unthinkable because it violated the hard commitment that information storage and replication are exclusive properties of nucleic acids. To accept Prusiner's hypothesis was not merely to add a new virus; it was to alter the definition of life-like replication.

  3. **Puzzles, Anomalies, and Crisis**
  The introduction of "slow virus" and "unconventional virus" by Gajdusek was paradigm-preserving normal science. It manufactured a sub-kind to absorb the recalcitrant case (long incubation, lack of immune response) without abandoning the nucleic acid requirement. This was accommodation, not revolution. Alper's radiation data constituted a genuine anomaly, but it did not produce a crisis for two decades. The community treated it as a puzzle: perhaps the virus was shielded, or the genome was unusually small or resistant.
  Crisis arrived not from theoretical failure inside the laboratory but from the BSE epizootic and the 1996 vCJD link. This was an external shock. The old paradigm could not offer rapid diagnostics or safe decontamination protocols because it could not specify the agent's nature. The crisis was pragmatic and public, not merely epistemic. This modifies Kuhn's crisis mechanism: here, crisis was driven by the failure of the paradigm to manage a societal emergency, rather than the accumulation of internal theoretical contradictions. The anomaly (radiation resistance) existed since the 1960s; the crisis existed only when the anomaly became a public health catastrophe. Kuhn's account underestimates the role of external utility in triggering paradigm collapse.

  4. **Incommensurability**
  *   **Grade 1 (Referential):** There was variance, but it was not total. "Virus" referred to a nucleic-acid-containing particle for the opposition and an infectious particle for Prusiner. "Replication" referred to synthesis for one side and conformational conversion for the other. However, "infectivity," "titre," and "incubation period" retained stable reference across the divide, allowing data comparison.
  *   **Grade 2 (Taxonomic):** This was the site of significant friction. Under the virus paradigm, sporadic, familial, and infectious CJD were distinct kinds (genetic vs. infectious). Under the prion paradigm, they were variants of a single kind (different triggers for the same conformational change). Furthermore, "strain" was taxonomically stable for viruses (genetic mutation) but ontologically problematic for prions (how can a protein have strains?). The mapping of disease tokens to kinds shifted fundamentally.
  *   **Grade 3 (Normative/Evidential):** This grade did the most work. The standards for proof diverged. For the virus camp, failure to detect nucleic acid was not evidence of absence given detection limits; for the prion camp, failure to detect nucleic acid after rigorous purification was evidence of absence. What counted as an acceptable mechanism differed: one side required genetic identification, the other required protein purification and infectivity retention.
  Your suspicion is largely correct: Grade 3 drove the resistance, and Grade 2 drove the theoretical difficulty. Grade 1 was less obstructive because the shared vocabulary of bioassay (lesion profiles, incubation times) allowed the two sides to argue over the same numbers. The episode looks incommensurable only if one conflates the normative disagreement over evidence with a total inability to communicate.

  5. **Silences**
  Kuhn's apparatus is silent on two features that plausibly mattered to the outcome. First, the role of agricultural practice and public-health emergency. The BSE crisis forced funding and regulatory attention that accelerated the molecular work (knockout mice) which finally settled the theory. Kuhn's internalist history cannot account for how slaughter policies drive theoretical acceptance. Second, the resistance was sustained by a structurally available alternative: the "shielded virus" hypothesis. This was not mere paradigm blindness; it was a methodologically prudent hypothesis given the limits of nucleic acid detection in the 1980s. Kuhn treats resistance as irrational attachment to a paradigm; here, resistance was rational given the available technology. The alternative was not a rival paradigm but a hidden variable within the existing one.

  6. **Case Back on Theory**
  (a) **Accommodation versus Crisis:** Normal science can always invent an intermediate category ("unconventional virus"). The distinction lies in puzzle-solving capacity. The virus paradigm stopped generating solvable puzzles when it could not explain strain diversity without a genome or provide diagnostics. A framework collapses when accommodation becomes more complex than the rival theory.
  (b) **Shared Evidence:** Both sides accepted the inactivation curves. The disagreement was over the bearing of uncontentious evidence (inference to the best explanation), not the meaning of the data. Kuhn's meaning-variance thesis explains little here; the dispute was largely Bayesian—how much weight to give negative results. Kuhn's account handles this badly, as it assumes data itself becomes unstable during shifts.
  (c) **Scale:** The episode is a revolution for the subfield and a routine extension for the discipline. Kuhn's notion of a paradigm lacks a determinate scale. If paradigms are nested, the theory must explain how a local revolution stabilizes without overturning the parent paradigm. If it cannot, the theory is too vague to predict where revolutions will occur.
  (d) **Loss:** There was a Kuhn loss. The virus paradigm explained heritable strain diversity and species barriers naturally via mutation and receptor specificity. The prion paradigm struggled for years to explain how a protein alone could encode distinct strain phenotypes. This was an explanatory deficit that was only later recovered via conformational variants and glycoforms.
  (e) **Unfalsifiability:** To conclude this was *not* a Kuhnian shift, one would look for seamless absorption where the old terminology persisted without ontological change. The condition close to being met was the discovery of the PrP gene. If PrP had been identified solely as a viral receptor rather than the agent itself, the virus paradigm would have normalized the data. The knockout mouse experiment (PrP null mice resistant to scrapie) was the falsifier that closed the escape route of the "shielded virus."

  7. **Verdict**
  This was a local revolution within a specialty that functioned as a paradigmatic extension for the broader discipline, a nuance Kuhn's binary of revolution versus normal science obscures. The shift was driven less by internal theoretical anomaly than by external public-health crisis, and the resistance was rational rather than dogmatic, sustained by viable alternative explanations within the old paradigm. A defender of Kuhn would argue that the specialty community suffices as the unit of analysis, and that the external crisis merely accelerated the inevitable theoretical collapse caused by the accumulation of anomalies like radiation resistance.
