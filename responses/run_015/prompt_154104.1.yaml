  # The Dialogic Standing Protocol (DSP)

  **Purpose:** To determine whether a participant enters the circle with **Symmetrical Standing** (treated as a moral equal regarding their combatant status) or **Asymmetrical Framing** (treated as bearing specific moral culpability that alters the dialogue dynamic).

  **Core Logic:** This procedure is grounded in the **Independence Thesis**: a combatant's right to participate and their moral standing regarding *acts of war* do not depend on the justice of their *cause* (*jus ad bellum*), provided they adhered to the rules of war (*jus in bello*). However, to address valid concerns about culpability, this protocol allows for Asymmetrical Framing only when specific thresholds of *conduct* or *conscious agency* are crossed.

  **Warning:** This protocol prioritizes dialogue viability over moral retribution. It will produce outcomes that feel lenient to high-level architects of conflict. This is a feature, not a bug, to ensure the "unjust" side remains willing to engage.

  ---

  ## Part 1: The Decision Sequence

  Facilitators must run these three checks in order. Stop at the first definitive result.

  ### Check 1: The *Jus in Bello* Violation (The Red Line)
  **Question:** Is there credible evidence the participant committed acts that violate universal laws of war (e.g., execution of prisoners, torture, targeting civilians), regardless of which side they fought for?

  *   **Data Source:** Court records, verified testimony, NGO documentation, self-admission.
  *   **Pass (No Violations):** Proceed to Check 2.
  *   **Fail (Confirmed Violations):** **STOP.** Assign **Asymmetrical Framing**.
      *   *Rationale:* The Independence Thesis protects combatants, not criminals. Violating the rules of war forfeits moral equality.
  *   **Uncertain (Alleged but Unproven):** Proceed to Check 2. Flag as "Alleged Conduct Issue."
  *   **FLAG [VALUE JUDGMENT]:** Determining what counts as "credible evidence" in a disputed conflict is subjective. Facilitators must agree on a standard of proof (e.g., "more likely than not") before applying this check.

  ### Check 2: The Epistemic Access Check (The Fog of War)
  **Question:** At the time of service, did the participant have realistic access to information contradicting their leadership's narrative, and the cognitive freedom to process it?

  *   **Data Source:** Participant interview, country of origin media landscape, education level, role.
  *   **Pass (Low Access):** They were in a closed information environment, heavily propagandized, or cognitively overwhelmed by survival/combat stress.
      *   *Result:* **Symmetrical Standing.**
      *   *Rationale:* We cannot punish belief states we cannot verify. Default to innocence of motive.
  *   **Fail (High Access):** They had open access to counter-narratives, high education, or intellectual role, and chose to ignore them.
      *   *Result:* **Proceed to Check 3.** (Do not assign Asymmetry yet).
  *   **FLAG [GUESSWORK]:** **CRITICAL BREAKDOWN POINT.** You cannot verify internal belief states. You are inferring knowledge from external circumstances. If the participant claims "I didn't know," you generally must accept it unless contradicted by hard evidence of their role.

  ### Check 3: The Agency & Proximity Check (The Trigger)
  **Question:** Was their contribution to the war effort voluntary and strategically significant, or coerced/tactical?

  *   **Data Source:** Conscription records, volunteer contracts, job description.
  *   **Pass (Low Agency/Proximity):** Conscripted, coerced, or low-level tactical role (foot soldier, driver, low-level logistics).
      *   *Result:* **Symmetrical Standing.**
      *   *Rationale:* Even if the cause was unjust (Check 2 Fail), lack of agency mitigates moral culpability for the dialogue context.
  *   **Fail (High Agency/Proximity):** Volunteer, strategic role, policy maker, high-level logistics architect.
      *   *Result:* **Symmetrical Standing with Asymmetrical Framing Note.**
      *   *Rationale:* Under the Independence Thesis, they still retain combatant equality for the sake of the circle. However, their narrative is framed as "accountability" rather than "grievance."
  *   **FLAG [VALUE JUDGMENT]:** Defining "strategically significant" is subjective. Does a logistics manager count the same as a general? Facilitators must draw this line before the session.

  ---

  ## Part 2: Output Definitions

  *   **Symmetrical Standing:** The participant sits in the circle as a peer. Their violence is treated as a tragic function of war, not a personal moral failing. They are invited to share grief and loss equally.
  *   **Asymmetrical Framing:** The participant sits in the circle, but the facilitator explicitly frames their contribution as bearing moral weight. Their testimony is listened to as *accountability* or *explanation*, not as *equivalent suffering*. They may be asked to speak last or respond to victims first.

  ---

  ## Part 3: Case Applications

  Here is how the protocol applies to your three upcoming participants.

  ### Case 1: The Conscripted Foot Soldier (Aggressor Side)
  *   **Profile:** Conscripted at 18. States he believed state propaganda regarding "liberation." No record of atrocities.
  *   **Check 1 (Violations):** Pass. No war crimes.
  *   **Check 2 (Epistemic):** Pass. Young, conscripted, closed information environment.
  *   **Check 3 (Agency):** Pass. Low agency, tactical role.
  *   **Result:** **Symmetrical Standing.**
  *   **Facilitator Note:** Treat his narrative as equivalent to the resistance fighter's. Do not challenge his belief state; it is unverifiable.
  *   **Hard Edge:** You are accepting his claim of belief without proof. This is the "Epistemic Risk." If he is lying, the protocol has no way to catch it without becoming an interrogation.

  ### Case 2: The Volunteer Strategist (Aggressor Side)
  *   **Profile:** Volunteered at 30. Designed logistics networks for the occupation. Never held a weapon. Highly educated, had access to international news.
  *   **Check 1 (Violations):** Pass. No direct war crimes (logistics are generally protected under Independence Thesis unless targeting civilians).
  *   **Check 2 (Epistemic):** Fail. High access to information, intellectual capacity to question the cause.
  *   **Check 3 (Agency):** Fail. Volunteer, strategic role.
  *   **Result:** **Symmetrical Standing with Asymmetrical Framing Note.**
  *   **Facilitator Note:** **This is the uncomfortable outcome.** He sits in the same chair. He is not excluded. However, when he speaks, the framing is: "You are here to explain the machinery of the war," not "You are here to share your trauma as a victim of war."
  *   **Why this result?** Under the Independence Thesis, logistical support is a combatant function. Denying him symmetry based on the *cause* (which is disputed) sets a precedent that shuts down dialogue with leadership classes. If you exclude the architects, you only reconcile the tools.
  *   **Hard Edge:** The protocol forces you to treat a war-architect as a moral equal to a foot soldier regarding *seating*. This is where the Independence Thesis clashes with moral intuition. You must hold this tension. Do not demote his seating, or he will not engage. Adjust the *questions* you ask him instead.

  ### Case 3: The Defensive Fighter (Resistance Side)
  *   **Profile:** Fought against occupation. Admits to executing two prisoners in reprisal for a village massacre.
  *   **Check 1 (Violations):** Fail. Execution of prisoners is a clear *jus in bello* violation.
  *   **Result:** **Asymmetrical Framing.** (Stop here).
  *   **Facilitator Note:** His cause may be just, but his conduct forfeited his moral equality in this circle. He does not get to claim the "moral high ground" of the resistance to shield his actions.
  *   **Hard Edge:** This outcome may anger the resistance community. They may view him as a hero who did what was necessary. The protocol treats him as morally compromised relative to the Conscript (Case 1). This is the price of grounding the process in conduct rather than cause.

  ---

  ## Part 4: Operational Flags for Facilitators

  **1. The "Mind-Reading" Flag (Epistemic Check)**
  *   **The Problem:** Check 2 requires you to judge what someone *knew* or *believed*.
  *   **The Rule:** If the participant says "I didn't know," you must default to **Pass** unless you have physical evidence (emails, orders they signed) proving otherwise.
  *   **Risk:** You may be seating liars.
  *   **Mitigation:** Do not challenge the lie in the pre-session. Challenge the *consequences* of that ignorance in the circle questions (e.g., "How do you reconcile your lack of knowledge with your role today?").

  **2. The "Disputed Cause" Flag (Independence Thesis)**
  *   **The Problem:** Staff want to rule one side "Unjust."
  *   **The Rule:** The protocol **cannot** adjudicate *jus ad bellum* (justice of cause) because the conflict is disputed. You can only adjudicate *jus in bello* (conduct).
  *   **Risk:** Staff may try to sneak *jus ad bellum* judgments into Check 2 (Epistemic).
  *   **Mitigation:** Check 2 is about access to *information*, not access to *truth*. Did they have the news? Not "Was the news right?"

  **3. The "Logistics vs. Trigger" Flag (Agency Check)**
  *   **The Problem:** Is moving ammo the same as shooting?
  *   **The Rule:** Under the Independence Thesis, both are combatant acts.
  *   **Risk:** Staff may feel the Strategist (Case 2) is "more guilty" than the shooter.
  *   **Mitigation:** Acknowledge the guilt in the *Framing Note*, but do not change the *Seating*. If you change the seating, you break the circle's contract of safety.

  ## Summary of Hard Edges
  1.  **You cannot verify belief.** If they say they believed the propaganda, you must proceed as if they did.
  2.  **You cannot punish the cause.** You can only punish the conduct. A "just" fighter who commits war crimes is treated worse than an "unjust" fighter who follows rules.
  3.  **You cannot exclude architects.** If you want dialogue, the people who designed the war must sit with the people who fought it. Symmetry is the price of their attendance.

  **Final Instruction:** Run the checks. Write the result on the participant file. If the result is "Symmetrical Standing," do not apologize for it. If the result is "Asymmetrical Framing," prepare the group for a harder conversation.
