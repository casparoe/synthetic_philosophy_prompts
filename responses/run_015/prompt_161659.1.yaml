answer: |-
  The defence you encounter in your reading group relies on a seductive but ultimately flawed category error. It conflates the mathematical structure of classical mechanics with the operational architecture of a digital computer. To audit this properly, we must dissect the analogy against the three grades you have outlined: (i) determinism, (ii) simulability, and (iii) decidability.

  ### 1. Auditing the Analogy

  Let us first map the components of the defender's picture onto the physical system in question.

  *   **The Input:** The exact initial state of the world, represented as a vector of real numbers $x_0 \in \mathbb{R}^n$.
  *   **The Program:** The laws of physics, expressed as differential equations or an evolution function $\phi_t$.
  *   **The Output:** The state of the world at some later time $t$, i.e., $x_t = \phi_t(x_0)$.
  *   **The Clock Cycle:** The infinitesimal time-step $dt$ required to integrate the equations of motion.

  The defender's argument quietly assumes that because the physical system is **deterministic (Grade i)**, it must therefore be **simulable (Grade ii)**. They argue that since a computer can simulate a deterministic process, and the world is a deterministic process, the world is simulable. They appear to be discussing Grade (i), but their conclusion—that prediction is possible 'in principle'—is a claim about Grade (ii).

  This is where the analogy breaks. A standard Turing machine (the formal model of 'a computer programme') operates on discrete, finite symbols. It cannot accept an arbitrary real number as input, because a generic real number contains infinite information (an infinite non-repeating decimal expansion). To feed the 'input' into the 'programme', one must provide a finite description. If the initial state $x_0$ is not a computable number (and almost all real numbers are not), there is no finite programme that can write it down, let alone process it.

  Therefore, the computer-programme picture assumes Grade (ii) is guaranteed by Grade (i), but this holds only if the physical states are restricted to computable reals, which is not guaranteed by classical mechanics.

  ### 2. What Chaos and Computation Undermine

  We must distinguish precisely which grade is attacked by which physical phenomenon.

  **Sensitive Dependence (Chaos) undermines Grade (ii): Simulability.**
  The defender claims chaos merely makes prediction 'expensive'. This is incorrect. Chaos implies that the error in the output grows exponentially with time. To predict the state at time $t$ to within a fixed accuracy $\epsilon$, the initial state must be known to within accuracy $\delta(t)$, where $\delta(t) \to 0$ exponentially as $t \to \infty$.
  If the demon is granted unlimited memory, it might store more digits of $x_0$. However, for any *finite* description of $x_0$ (which is required for any computational procedure), there is a finite time horizon beyond which the simulation yields no information about the actual trajectory. Chaos does not just raise the cost; it severs the link between finite input descriptions and long-term output accuracy. It renders Grade (ii) impossible for any agent restricted to finite representations, regardless of how much time or memory they possess.

  **The Embedded Computer undermines Grade (iii): Decidability.**
  Suppose we bypass the chaos problem. Suppose we can simulate the system step-by-step (Grade ii is satisfied). The defender claims we can therefore predict the future. But 'prediction' often involves qualitative questions: 'Will the system ever enter region $R$?' or 'Is the orbit stable?'
  If the dynamical system is rich enough to embed a universal Turing machine, the trajectory of the system can encode the execution of an arbitrary computer programme. Asking whether the system enters region $R$ becomes equivalent to asking whether that programme halts.
  By Turing's theorem, the Halting Problem is undecidable. There is no finite procedure that can answer this yes/no question for all cases. Thus, even if the system is deterministic and even if we can compute the state at any finite time $t$, we cannot decide arbitrary properties of the infinite future trajectory. Grade (iii) fails fundamentally, not merely expensively.

  ### 3. Does 'Predictability in Principle' Survive?

  Once these disanalogies are on the table, the claim that determinism entails predictability 'in principle' does not survive, provided 'predictability' implies knowledge attainable via a finite procedure.

  If 'in principle' means only that the future state *exists* uniquely as a mathematical consequence of the past, then Grade (i) holds. But this is a trivial ontological claim, not an epistemic one. Laplace's Demon was traditionally conceived as an intellect that *knows* the future, not merely a universe in which the future is fixed.
  *   Because of the nature of real numbers, the 'input' cannot be fully specified to a finite machine.
  *   Because of chaos, finite approximations of the input lose validity rapidly.
  *   Because of embedded computation, qualitative questions about the future are formally undecidable.

  The defender's picture carries more than it can bear because it treats the continuum of physical state-space as if it were a discrete symbol space. A digital computer is a poor analogy for a continuous deterministic world because the former is countable and the latter is not.

  ### 4. A Better Analogy

  If the computer-programme analogy fails, what serves better? The most accurate analogy is not a **Computer**, but an **Oracle**.

  In computability theory, an 'Oracle' is a black box that can answer certain questions that a Turing machine cannot. If the world is deterministic but non-computable (due to real-number inputs or undecidable trajectories), Laplace's Demon cannot be a computer running a simulation. It must be an entity that has direct, non-algorithmic access to the truth values of the future states.

  Alternatively, one might adopt the analogy of a **Mathematical Function**. Consider the function $f(x) = \sin(1/x)$. The value exists for every $x \neq 0$. The relationship is deterministic. However, knowing the definition of the function does not grant you the ability to compute the value for every $x$ to arbitrary precision without potentially infinite work, and certain properties of the function's graph may be undecidable. The future is like the value of a function: it is fixed by the definition, but 'calculating' it is not guaranteed to be possible.

  **Conclusion**
  Your reading group's defence conflates the *existence* of a unique future with the *computability* of that future. Chaos demonstrates that finite knowledge of the present yields vanishing knowledge of the future (undermining simulability), while computational universality demonstrates that even perfect step-by-step simulation cannot answer all yes/no questions about the future (undermining decidability). Determinism does not entail predictability; it entails only that there is nothing to predict *but* the inevitable, even if we can never know what that is.
