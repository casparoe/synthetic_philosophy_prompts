      *   *Check:* Chaos. Chaos makes (ii) unstable. If I have finite precision input, output diverges. To maintain output precision, input precision must grow. If input is a real number, it has infinite information. A Turing machine cannot read infinite input. So (ii) fails for generic reals regardless of chaos, but chaos makes it fail *rapidly* for approximations. The prompt says "chaos merely makes prediction expensive". I must argue it makes it *impossible* for finite descriptions.
      *   *Check:* Embedded computer. This makes (iii) undecidable. Even if I can simulate step-by-step (ii), I can't know if it halts/enters R (iii).
