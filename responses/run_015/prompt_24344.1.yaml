answer: |-
  # The Pain Badness Decision Tree
  **Starting Case:** *Pain Asymbolia* (Patient reports sharp/burning sensation | Patient feels no awfulness | Patient does not withdraw | Patient does not suffer).

  ---

  ### **Q1: Does the sensory character itself (burning, stinging) carry intrinsic badness?**
  *(Independent of how it makes you feel emotionally)*

  *   **YES** ➔ **LEAF A: Sensory Qualia Realism**
      *   **Position:** The qualitative feel of the sensation is inherently normative.
      *   **Status:** ⚠️ **Largely Unoccupied.**
      *   **Diagnosis:** Contradicts the first-person authority of the asymbolic patient (who reports the sensation without the badness).
      *   **Awkward Commitment:** The asymbolic patient is deluded about their own experience and is actually suffering.

  *   **NO** ➔ *Go to Q2.*

  ---

  ### **Q2: Is the badness located *only* in the affective/evaluative component (the unpleasantness)?**
  *(Is the "ouch" the only thing that makes pain bad?)*

  *   **NO** ➔ *Go to Q4.* (Badness must be elsewhere: bodily, functional, or relational).
  *   **YES** ➔ *Go to Q3.*

  ---

  ### **Q3: (If Only Affective) Does the asymbolic's lack of affect mean the pain is *not bad at all*?**

  *   **YES** ➔ **LEAF B: Affective Illusionism / Hedonic Nihilism**
      *   **Position:** Pain asymbolia reveals that "pain" was never bad; only "suffering" is.
      *   **Required Leaf:** ✅ *Pain is not bad at all.*
      *   **Awkward Commitment:** Administering analgesia does not remove harm, it merely deletes the only part of the experience that had value.

  *   **NO** ➔ **LEAF C: Dual-Component Harm**
      *   **Position:** The *experience* is not bad, but the *body* is still harmed.
      *   **Required Leaf:** ✅ *Patient is harmed in a different way.*
      *   **Awkward Commitment:** The patient is objectively damaged but subjectively fine, creating a split between "what hurts me" and "what harms me."

  ---

  ### **Q4: (If Not Only Affective) Is the badness defined by behavioral/motivational consequences?**
  *(Does pain need to command "Stop this!" to be bad?)*

  *   **YES** ➔ **LEAF D: Imperativism / Functionalism**
      *   **Position:** Pain is a command to act; without the urge to avoid, there is no badness.
      *   **Awkward Commitment:** A paralyzed person in agony has less "bad" pain than a twitching one.
      *   **⚠️ Indistinguishability Warning:** Hard to separate from *Leaf B* (Affective Illusionism), as affect usually *is* the motivation.

  *   **NO** ➔ *Go to Q5.*

  ---

  ### **Q5: Is badness relational to a subject who takes the experience as their own?**
  *(Does the experience need to matter to the "self" to be bad?)*

  *   **YES** ➔ **LEAF E: Attitudinal / Relational View**
      *   **Position:** Pain is only bad if the subject has a negative attitude toward it.
      *   **Awkward Commitment:** A stoic or masochist can logically experience pain without any badness occurring.

  *   **NO** ➔ **LEAF F: Objective Biological Normativity**
      *   **Position:** Badness is a fact about the organism's integrity, regardless of feeling or behavior.
      *   **Required Leaf:** ✅ *Patient is still harmed.*
      *   **Awkward Commitment:** The smiling asymbolic patient is harmed exactly as much as the screaming normal patient.

  ---

  ### **Appendix: Unoccupied Combinations & Indistinguishabilities**

  **1. The Unoccupied Combination:**
  *   **Combination:** *Sensory Character is Bad (Q1=YES)* **AND** *Badness is Relational (Q5=YES).*
  *   **Diagnosis:** **Logical Contradiction.** If the sensory character is *intrinsically* bad, it cannot depend on a subject's relation to it. If it depends on the subject's relation, it is not intrinsic to the sensation. No coherent position holds both.

  **2. The Indistinguishable Pair:**
  *   **Leaves:** *Leaf B (Affective Illusionism)* **AND** *Leaf D (Imperativism).*
  *   **Diagnosis:** **Phenomenological Collapse.** In standard human psychology, the affective unpleasantness of pain *just is* the intrinsic motivation to stop it. Separating "unpleasantness" from "motivation" requires edge cases (like asymbolia) where the theory itself becomes difficult to verify.
