  **Verdict**
  She will say Miriam has **standing** to blame the **department's governing body** (the collective half), but **no standing** to blame **Professor Ames** (the individual half).

  **The Rule**
  The single rule explaining the whole run is **the Integrity of Moral Address**. This rule holds that standing to blame is not merely a property of the blamer's moral record, but a permission granted only when two conditions are met: (1) the blamer demonstrates a current commitment to the norm they invoke (they are not hypocritically exempting themselves), and (2) the target is a responsible agent capable of being bound by that norm in the specific instance. Your log appears to track only the blamer because in every past case, the target was clearly responsible; the Miriam case reveals the second condition.

  **Explanation of the Log**
  This rule explains the **emissions case** (no standing) because the manager, by signing off, actively authorized the violation, thereby rejecting the norm's authority over herself (failing condition 1). It explains the **bystander case** (standing) because failing to intervene is an omission that does not constitute an endorsement of the humiliation norm (satisfying condition 1), and the humiliator was responsible (satisfying condition 2). It explains the **reformed-cheater case** (standing) because his willingness to be judged now signals a restored commitment to the norm (condition 1), outweighing his past violation. The **Ames verdict** follows because Ames was assigned the trip; he lacked the control required to be a responsible target of blame (failing condition 2), rendering Miriam's address illegitimate regardless of her own purity. The **collective verdict** follows because the department body *did* have control over the policy (satisfying condition 2), and Miriam's pension inertia does not equate to a rejection of the norm given her personal divestment (satisfying condition 1).

