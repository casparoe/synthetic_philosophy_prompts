answer: |-
  She watches the reduction. Monday evening: dark amber. Tuesday evening: same pot, same heat, it looks mahogany. She says nothing.

  Wednesday, she cooks for the critic. He wants the viscosity only the mahogany stage holds. She doesn't know why Tuesday looked darker—no bulb change, no fatigue she can name. She checks the thermometer; it reads the same. She possesses no worldly reason for the shift. She just knows Tuesday's look was the target.

  She reduces the new batch, watching the color shift. She pulls it when it hits the Tuesday memory, ignoring the amber. She plates it. The critic nods, tasting the thickness only that specific darkness signals. Her judgment about the past look guided the physical outcome successfully.

  Thursday, she cooks again. Same pot, same heat. Amber shifts to mahogany. She watches the change but forms no preference, no comparison. She holds no thought about which stage matched the goal. She just washes the pot.

  ***

  Epiphenomenalism explains the *occurrence* of the judgment because physical brain states cause speech. It cannot explain the *accuracy* because if experiences are causally inert, they cannot select the correct content. The time delay blocks the joint-effect reply: a single neural state cannot simultaneously cause the past experience and the current judgment. If you remove the delay, the case collapses; the neural state causing the experience also causes the immediate judgment, making the match a common effect. If the object changes, the physical difference explains the judgment, rendering the experience redundant.

  The strongest epiphenomenalist reply is that the brain state *did* change physically to encode the experience, and that physical trace caused the judgment, not the qualia. The subject's lack of access to this physical difference doesn't negate its causal role.

  The time delay is the feature doing the work by severing the synchronous common cause. The "fixed world" setup is the weakest bit: if the brain state didn't change physically, memory is impossible; if it did, the physical trace explains the accuracy, reviving epiphenomenalism. You are relying on the reader to accept that the success proves phenomenal causation, but the scene builds in the success rather than deriving it from the metaphysics.
