prompt: |-
  i'm on the grad curriculum committee for our philosophy-of-science track and we're deadlocked over a proposal to restructure the required causation module. the proposal wants al-ghazali's occasionalism—specifically his classic fire-and-cotton argument against necessary causation—taught not as dead historical theology but as a live rival to dispositional essentialism. the niche twist is framing his denial of secondary causation as actually anticipating modern "no-work" objections to powers metaphysics, asking students to judge whether occasionalism handles modal fragility better. half the committee thinks this gives a theological framework way too much weight in a science-focused course; the other half says treating it as mere background makes the syllabus dishonest about where causation debates come from. please draft the committee memo for thursday recommending approve, reject, or approve-with-conditions. it needs a concrete implimentation timeline if approved, and it must take the "overweights theology" objection seriously rather than just saying history matters. keep it practical—either way we can't redesign until fall.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

