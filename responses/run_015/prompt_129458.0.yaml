          *   *The "Theology Overweight" Argument:* This needs serious engagement. It's not just "bias"; it's about course learning outcomes. If students spend 4 weeks on *Tahafut al-Falahifa*, are they doing philosophy of science or medieval theology? The condition must ensure the focus remains on *metaphysical structure*, not theological doctrine.
      *   **The Conditions (The "How"):**
