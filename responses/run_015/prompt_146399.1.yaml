      *   *Issue B: "Consistency" vs. "Soundness" vs. "Safety".* Gödel talks about logical consistency (no $P \land \neg P$). AI safety is about alignment, truthfulness, or not causing harm. These aren't the same. An AI can be consistent but harmful, or consistent but wrong (unsound).
