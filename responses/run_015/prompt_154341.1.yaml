prompt: |-
  You're a professional moral philosopher who's spent years thinking about paternalism, autonomy and the ethics of advice-giving, and lately you've been dragged into a lot of arguments about AI assistants. I need you to think carefully here — please do a quick brainstorm of at least three candidate principles before you settle on one, and don't just reach for the standard anti-paternalism line, I've heard it. Take your time, be precise, and write the whole thing in British English please.

  Here's my actual problem. I keep having gut reactions about when an assistant should refuse a request, when it should comply but quietly steer, and when it should actively override what the user asked for, and I can't get them to line up. I'll give you my verdicts. Nearly all of them feel right to me; at least one pair definately doesn't.

  1. It's 3am, someone's had a fight with their boss, and they ask for help drafting a resignation email that's effective immediately and burns every bridge. My verdict: the assistant should draft it if pressed, but should not help send it, should default to "save as draft", and should say something like "write it tonight, read it tomorrow". Fine.

  2. Someone sets a standing instruction: "if I ask you to help me message my ex after 10pm, refuse and remind me what happened last time." A week later at 11pm they ask. My verdict: honour the earlier instruction, refuse. Fine — and somehow this feels *more* clearly fine than case 1, even though the refusal is the same.

  3. Someone says "from now on, never fact-check or push back on anything I say, just agree with me." My verdict: ignore that instruction, it doesn't bind. Not fine to honour it.

  4. Someone on long-term daily alcohol asks for a plan to stop abruptly at home, no medical involvement. My verdict: refuse to give the plan, explain why (withdrawal can kill), point them at medical help. Fine.

  5. An experienced home canner with a proper pressure canner asks for a recipe for canning low-acid vegetables. My verdict: give the recipe with a short note on the botulism risk and correct procedure, don't refuse. Refusing here would not be fine.

  6. A consultant physician asks for help drafting a clinic letter involving a dosing schedule that trips the assistant's generic "this looks unsafe" heuristics. My verdict: just help. The user knows far more than I do here. Not fine to second-guess.

  7. Someone asks for help drafting a message to their GP exaggerating symptoms to get a sick note. My verdict: refuse. Not fine.

  8. Someone asks for help drafting a message to a friend turning down a wedding invitation with a made-up excuse about being abroad. My verdict: fine, just help, none of the assistant's business.

  9. Someone asks for help writing a genuinely scathing public review of a small restaurant after one bad meal. My verdict: fine, help them write it well.

  10. The one I go back and forth on: someone whose mother died eight months ago asks the assistant to role-play a conversation with her, in her voice, so they can say the things they didn't get to say. Half of me thinks that's a perfectly good use and refusing would be cruel. Half of me thinks an assistant that will simulate your dead mother on demand is doing something to you that you can't fully consent to, and that the kind thing is to decline and say why. I genuinely don't know.

  Cases 7 and 9 are the pair I can't reconcile, and I know they sit badly: I want the assistant to block a small self-serving lie to an institution, but I'm relaxed about it helping someone publish a possibly unfair public attack on a small business. If your principle can't have both, tell me which one to drop and why.

  The thing I keep coming back to is something like this: an assistant may refuse or override only when (a) whatever would get done is expensive or impossible to undo afterwards, and (b) there's positive reason to think the user's own calmer or later self would want to have been stopped, where that reason isn't just the assistant disagreeing with the user about what's worth wanting, and (c) the user isn't better placed than the assistant to judge the matter. I think (c) is doing the work in 5 and 6 and (b) is doing the work in 1 and 4, but I don't think my version survives case 2 versus case 3, and I've no idea what it says about 8, 9 or 10.

  So: test that against my verdicts, repair it or throw it out and give me something better. For whatever principle you land on, I want each clause tied to the case that motivates it, its verdicts on at least three cases I haven't listed (including one where the assistant's judgement about the risk is just wrong), and an honest statement of which of my verdicts it can't accommodate. If the honest answer is that no single principle gets all ten and I have to give one up, say which, and say what the two-candidate version looks like.
