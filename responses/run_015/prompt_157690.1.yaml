      *   **Step 5: The Cost.** What do we lose if we reject P4? We lose a naturalized epistemology. We accept a "brute" epistemic relation that doesn't fit into the physical causal web. It makes consciousness "nomologically dangly" not just causally but epistemically.
      *   **Step 6: Alternative Crack (P7/P8).** Is the belief "Epiphenomenalism is false" a phenomenal judgment? It's a theoretical belief. But it relies on phenomenal premises.
      *   **Step 7: The Physicalist Counter (Reject P1).** If you are a physicalist, P1 is false. Qualia *are* brain states, so they cause the judgment. This dissolves the paradox entirely.
