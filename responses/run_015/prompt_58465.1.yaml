answer: |-
  Dear Colleague,

  Here is a complete design for your seventy-five-minute workshop on electoral reform, structured as a narrative guide to help you facilitate the simulation without relying on technical jargon until the participants have felt the mechanics themselves. To begin, you will need to prepare a set of materials that includes twenty-four preference cards, six district signs, a pack of ballot slips, a coin for tie-breaking, and a large whiteboard or flipchart for recording results. The preference cards should be pre-assigned according to the fixed electorate you specified, so that when participants arrive, you can hand them a card that tells them both their district number and their sincere party preference among Harbor, Meadow, and Ridge. Specifically, you will give three participants in District One a Harbor card and one a Meadow card, while in District Two three receive Harbor and one receives Ridge. For Districts Three, Four, and Six, the distribution is identical with one Harbor, two Meadow, and one Ridge voter each, whereas District Five contains one Harbor, one Meadow, and two Ridge voters. You should also prepare a simple scoreboard to track seat counts and a timer to keep the session on track, ensuring that the exercise fits within the allotted seventy-five minutes.

  Once the participants are seated in their six districts of four, explain that the goal of the day is to decide how the final ten minutes of the workshop will be used, with the winning party or coalition earning the right to choose between a Q&A session, a case study review, or an early break. This nonmonetary stake gives the outcome meaning without distorting participation with financial incentives. Begin the first round under first-past-the-post rules, instructing each district to award one seat to the party with the most votes in that district, with ties broken by a coin toss. Ask everyone to vote sincerely according to their preference card. When you collect the ballots, you will find that Harbor wins District One with three votes against one, and Harbor also wins District Two with three votes against one. In District Three, Meadow wins with two votes against one for Harbor and one for Ridge, and the same result occurs in District Four and District Six where Meadow secures two votes against single votes for the others. In District Five, Ridge wins with two votes against one for Harbor and one for Meadow. Tallying the seats, Harbor has won two seats, Meadow has won three seats, and Ridge has won one seat. Before revealing the strategic implications, ask the group to count the total popular votes cast across all districts, which will show that Harbor received ten votes, Meadow received eight votes, and Ridge received six votes. This moment is crucial for the first learning objective, as participants will see directly that Harbor won the most votes overall but secured the fewest seats, illustrating how geographic concentration can let the popular vote winner lose the seat count.

  After discussing their initial reactions, move to a second round of voting under the same first-past-the-post rules but allow five minutes for discussion within each district before casting ballots. Explain that they may vote strategically if they wish, meaning they can vote for a party other than their sincere preference to influence the outcome. This is where participants will encounter the pressure to abandon their first choice to block a less liked winner. In District Five, for example, the single Harbor voter and the single Meadow voter realize that Ridge is currently winning with two votes. If they prefer either Harbor or Meadow over Ridge, they feel pressure to coordinate and have one of them switch their vote to the other party to create a tie or a majority against Ridge. Similarly, in districts where Meadow wins narrowly, Harbor and Ridge voters may feel their votes are wasted and discuss switching to Meadow to prevent the other from gaining ground. Record the new results, noting how the seat count might shift slightly or result in more ties, but emphasize the feeling of discomfort voters feel when forced to vote insincerely to achieve a acceptable outcome.

  Next, transition to the proportional representation version of the exercise. Instruct the group to pool all twenty-four votes nationally rather than counting by district. Explain that there are six seats to be awarded using the largest remainder method, meaning each party first receives as many whole seats as fit into its proportional share and remaining seats go to the largest fractional remainders. With a total of twenty-four votes and six seats, the quota is four votes per seat. Harbor has ten votes, which divides into four twice with a remainder of two, so they receive two seats initially. Meadow has eight votes, which divides into four exactly twice with no remainder, so they receive two seats. Ridge has six votes, which divides into four once with a remainder of two, so they receive one seat. This accounts for five of the six seats, leaving one final seat to be awarded to the party with the largest remainder. Since both Harbor and Ridge have a remainder of two, you must use a coin toss to decide the final seat. The result will be either three seats for Harbor and one for Ridge, or two seats for each, but in either scenario, no party has achieved the four seats needed for a majority. This leads directly to the coalition bargaining phase, where representatives from each party must negotiate to form a governing coalition that controls at least four seats. This removes the pressure for strategic voting seen in the first-past-the-post round but replaces single-party victory with a need to bargain over a coalition in which voting weight and bargaining power diverge, as a smaller party might hold the balance of power.

  Following the coalition formation, guide the closing discussion by connecting specific moments from the simulation to the broader contrasts between the systems. Ask the Harbor supporters how it felt to win the popular vote but lose the election under the district system, and ask the District Five voters how it felt to consider voting against their sincere preference to block a rival. Contrast this with the proportional round, asking whether they felt more free to vote sincerely but less certain about who would ultimately govern due to the need for coalition deals. You should highlight that the district system produced a clear winner who could control the final ten minutes without negotiation, whereas the proportional system ensured the seat count matched the vote share but necessitated compromise. This narrative connection helps solidify the abstract concepts through their lived experience in the room.

  As you facilitate this exercise, there are several difficulties likely to go awry on a first run that you should be prepared to handle. Participants may experience confusion about strategic options, unsure if they are allowed to lie about their preferences, so you should explicitly state that the simulation rewards outcome optimization rather than moral consistency. There may be reluctance to vote insincerely due to personal integrity, which you can handle by reminding them that this is a model of incentives rather than a test of character. Disputes over ties and coalition offers may also arise, particularly during the proportional round where the coin toss decides a seat or where parties haggle over the final ten minutes. Handle these disputes by enforcing the rules strictly, using the coin toss publicly to demonstrate the role of chance, and limiting coalition negotiation time to prevent deadlock. If a coalition cannot form, you as the facilitator may need to cast the deciding vote or declare a default outcome to keep the workshop moving.

  Finally, you should close with a candid account of one important feature of real elections that this small-room exercise cannot reproduce, which is the secret ballot. In this simulation, voting is often public or easily observable within small districts, which exaggerates the pressure to conform and coordinate strategically compared to real-world private voting booths. In reality, voters cannot easily verify if their neighbors are voting strategically, which reduces the ability to coordinate tactical voting and protects voters from social coercion. You will need to supply this distinction by explanation, noting that while the simulation highlights the mechanical differences in seat allocation and coalition needs, the social dynamics of peer pressure in a room of twenty-four people are far more intense than in a nation of millions voting in private. This acknowledgement ensures participants understand the limits of the model while appreciating the structural insights it provided. I hope this design serves your workshop well and sparks a lively debate among your participants.

