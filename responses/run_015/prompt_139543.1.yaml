              2.  To be truly responsible for what you do, you must be truly responsible for how you are.
              3.  To be responsible for how you are, you must have chosen it via intentional action.
              4.  That intentional action depends on how you were *then* (regress).
              5.  Regress is vicious/impossible (finite mind).
              6.  *Ultimate Responsibility (UR):* Requires being the *causa sui* (cause of oneself) in the relevant mental respects.
              7.  *Neutrality:* Determinism blocks UR (prior causes). Indeterminism blocks UR (luck/chance, not control). The argument doesn't rely on determinism being true; it relies on the impossibility of *causa sui* regardless of causal structure.

      *   **Part (b) [8 marks]:**
          *   *Task:* Explain Strawson's reply to the "Penultimate Self View" (PSV). PSV says: Start with unchosen character -> Act -> Endorse/Revise -> Acquire ownership over time. Strawson says: This fails. Why?
          *   *Key Elements:*
              1.  The act of endorsement/revision is itself an action.
              2.  That action flows from the agent's nature *at that time*.
              3.  Therefore, to be responsible for the endorsement, you need to be responsible for the nature that produced the endorsement.
              4.  Regress applies to the revision process too.
              5.  *Time/Length:* Extending the process doesn't help. Each step inherits the deficit of the previous step. Infinite regress doesn't help (finite minds can't complete it).
              6.  *Determinism/Indeterminism:* If the revision is determined, it flows from prior nature (no UR). If indetermined, it's random (no UR).
              7.  *Crucial Point:* The PSV tries to shift the locus of ownership from $t_0$ to $t_n$. Strawson says ownership at $t_n$ still requires ownership of the principles of choice used at $t_n$, which traces back to $t_0$.

      *   **Part (c) [4 marks]:**
          *   *Task:* Is PSV just the reactive-attitudes reply (Strawson P.F. vs. Galen Strawson)?
