  ### Argument: The Breakdown of Evidential Cooperation in Large Worlds

  This argument demonstrates that for an Evidential Decision Theorist (EDT), the rationality of cooperation in a large-scale Prisoner's Dilemma depends critically on the *source* of the correlation between agents. I will show that as the population size $N \to \infty$, evidential cooperation collapses to defection if the agents share only "mere similarity" (empirical correlation), but persists if they share a "common source" (logical/functional identity).

  #### 1. Model and The Evidential Link

  **Payoff Structure**
  Consider a population of $N$ agents. Let $a_i \in \{0, 1\}$ denote the action of agent $i$, where $1$ is Cooperate ($C$) and $0$ is Defect ($D$). The payoff function for agent $i$ is:
  $$ U_i(a_i, \mathbf{a}_{-i}) = \beta \left( \frac{1}{N} \sum_{j=1}^N a_j \right) - \gamma a_i $$
  Here, $\beta > 0$ is the benefit parameter scaling with the fraction of cooperators, and $\gamma > 0$ is the individual cost of cooperating.
  *   **Causal Dominance:** The causal impact of agent $i$'s action on the fraction is $1/N$. The causal gain from cooperating is $\beta/N - \gamma$. For large $N$, $\beta/N < \gamma$, so Causal Decision Theory (CDT) prescribes Defection.
  *   **Social Optimum:** If all cooperate, payoff is $\beta - \gamma$. If all defect, payoff is $0$. We assume $\beta > \gamma$, making universal cooperation collectively superior.

  **The Evidential Link**
  EDT maximizes Expected Utility conditional on the action: $E[U | a_i]$. The agent compares $E[U | a_i=1]$ and $E[U | a_i=0]$.
  The difference in expected utility is:
  $$ \Delta EU = E[U | C] - E[U | D] = \beta \left( E\left[ \frac{1}{N}\sum a_j \Big| C \right] - E\left[ \frac{1}{N}\sum a_j \Big| D \right] \right) - \gamma $$
  Let $\rho_{ij} = P(a_j=1 | a_i=1) - P(a_j=1 | a_i=0)$ be the evidential correlation between agent $i$ and agent $j$. Assuming symmetry ($\rho_{ij} = \rho$ for all $j \neq i$):
  $$ E\left[ \sum_{j \neq i} a_j \Big| C \right] - E\left[ \sum_{j \neq i} a_j \Big| D \right] = (N-1)\rho $$
  Including the agent's own contribution ($1$ if $C$, $0$ if $D$):
  $$ \Delta EU = \frac{\beta}{N} \left( 1 + (N-1)\rho \right) - \gamma $$
  In the limit as $N \to \infty$:
  $$ \lim_{N \to \infty} \Delta EU = \beta \rho - \gamma $$
  Thus, EDT prescribes Cooperation if and only if **$\rho > \gamma / \beta$**.

  **Similarity as a Function of $N$**
  We define the correlation $\rho$ as a function of $N$ and a **Shared Source Strength** parameter $\alpha \in [0, 1]$.
  *   $\alpha = 1$: **Common Source.** Agents are instantiations of the same algorithm/logic (e.g., identical source code). Their outputs are logically entailed by the same inputs.
  *   $\alpha = 0$: **Mere Similarity.** Agents are empirically similar (e.g., same psychological priors) but causally independent with independent noise.

  We model the correlation $\rho(N, \alpha)$ as:
  $$ \rho(N, \alpha) = \alpha + (1 - \alpha) \cdot \epsilon(N) $$
  Here, $\epsilon(N)$ represents the correlation due to empirical similarity alone.
  *   **Assumption:** Under *Mere Similarity*, agents are independent causal processes. As $N \to \infty$, the probability that independent processes remain correlated without a constraining common source decays due to entropy and divergence in initial conditions or noise. Thus, $\lim_{N \to \infty} \epsilon(N) = 0$.
  *   **Assumption:** Under *Common Source*, the logical link is identity. $\alpha = 1 \implies \rho = 1$ regardless of $N$.

  #### 2. The Breakdown Point

  Substituting $\rho(N, \alpha)$ into the cooperation condition $\beta \rho > \gamma$:

  $$ \beta [\alpha + (1 - \alpha)\epsilon(N)] > \gamma $$

  Solving for the critical threshold of similarity strength $\alpha^*$ required to sustain cooperation as $N \to \infty$:
  $$ \alpha^* = \lim_{N \to \infty} \frac{\gamma/\beta - \epsilon(N)}{1 - \epsilon(N)} = \frac{\gamma}{\beta} $$

  **The Argument for Breakdown:**
  1.  **Mere Similarity ($\alpha = 0$):** In this case, $\rho(N, 0) = \epsilon(N)$. Since $\epsilon(N) \to 0$ as $N \to \infty$, the condition becomes $0 > \gamma/\beta$, which is false. The evidential link vanishes. The EDT agent recognizes that in a large world of merely similar agents, their individual choice provides negligible evidence about the choices of others because independent noise swamps the shared signal. **Result: Defection.**
  2.  **Common Source ($\alpha = 1$):** In this case, $\rho(N, 1) = 1$. The condition becomes $\beta > \gamma$, which is true by the definition of the Prisoner's Dilemma social optimum. The logical link ensures that if I cooperate, the others (running the same logic) must also cooperate. **Result: Cooperation.**

  The precise point of breakdown is when the **Shared Source Strength $\alpha$ falls below the Cost-Benefit Ratio $\gamma/\beta$**. In large worlds, "Mere Similarity" implies $\alpha \approx 0$, driving the agent back to the causally dominant strategy.

  #### 3. Defense Against the "Random Sample" Objection

  **The Objection:**
  A proponent of evidential cooperation might argue: *"Even with mere similarity, I can treat my own decision as a random sample drawn from the population's decision procedure. If I cooperate, Bayesian updating implies the population's propensity to cooperate is higher. This keeps $\rho$ high (e.g., via Laplace's Rule of Succession) regardless of $N$."*

  **The Rebuttal:**
  This objection fails because it conflates **Type-Level Similarity** with **Token-Level Correlation**.

  1.  **Sampling Assumption Validity:** Treating oneself as a "random sample" of the population's *actions* assumes that the action $a_i$ is generated directly from the population distribution $P(a)$. However, in a causal world, $a_i$ is generated by a specific process $f(\theta, \nu_i)$, where $\theta$ is the shared type (similarity) and $\nu_i$ is independent token-level noise (neural noise, random seeds, environmental micro-variables).
  2.  **Signal vs. Noise:** My action $a_i$ is a noisy signal of $\theta$. Observing $a_i=1$ updates my belief about $\theta$, but it also reflects $\nu_i$. The other agents' actions $a_j$ depend on $\theta$ and $\nu_j$.
      *   The correlation $\rho$ is determined by the signal-to-noise ratio: $\rho \approx \frac{\text{Var}(\theta)}{\text{Var}(\theta) + \text{Var}(\nu)}$.
      *   The "Random Sample" objection implicitly assumes $\text{Var}(\nu) = 0$.
  3.  **Large $N$ Sensitivity:** In the limit of large $N$, the assumption of $\text{Var}(\nu) = 0$ becomes untenable for "Mere Similarity." Without a **Common Source** to synchronize the noise (i.e., make $\nu_i = \nu_j$ logically), the independent noise terms $\nu_j$ accumulate. While my action updates the mean $\theta$, the *predictive power* of that update regarding the *aggregate* behavior is diluted by the independent variance of $N$ other agents.
      *   Formally, if $\nu$ is non-zero, $\epsilon(N)$ in our model decays because the probability of $\text{sign}(\theta + \nu_i) = \text{sign}(\theta + \nu_j)$ for all $j$ drops as the diversity of $\nu$ manifests across the population.
      *   The "Random Sample" view treats the agents as draws from an urn. The "Common Source" view treats them as copies of a function. In large worlds, mere similarity is urn-like (independent draws), while cooperation requires function-like identity.

  Therefore, the evidentialist cannot treat their action as a robust random sample of the *outcomes* unless they assume their action is logically tied to the outcomes (Common Source). Mere similarity provides only a weak statistical link that is insufficient to offset the cost $\gamma$ in the large $N$ limit.

  #### 4. Sensitivity of Assumptions

  This conclusion is sensitive to two key assumptions:

  1.  **The Decay of Empirical Correlation ($\epsilon(N) \to 0$):** If one assumes that "Mere Similarity" entails perfect psychological cloning such that independent noise is zero ($\nu_i = 0$) even without a common source, then $\epsilon(N) = 1$ and cooperation holds. However, this contradicts the definition of "Mere Similarity" in a physical world, where distinct causal histories inevitably introduce divergence (entropy). The argument holds only if "Similarity" allows for independent implementation noise.
  2.  **Payoff Scaling:** The argument assumes payoffs scale with the *fraction* of cooperators ($\beta/N \sum a_j$). If payoffs scaled with the *total number* of cooperators ($\beta \sum a_j$), the causal impact of one agent would be $\beta$, and causal dominance might favor cooperation directly. The breakdown of EDT specifically relies on the structure where individual causal impact vanishes ($1/N$), forcing reliance on the evidential link $\rho$.

  **Conclusion:**
  In the limit of large $N$, Evidential Decision Theory prescribes defection for agents who are merely similar, because the evidential correlation $\rho$ decays to zero in the absence of a logical common source. Cooperation is sustained only if the agents share a common source ($\alpha > \gamma/\beta$) that eliminates independent noise, thereby maintaining $\rho \approx 1$. Without this logical lock-in, the evidentialist is driven back to the causally dominant strategy of defection.
