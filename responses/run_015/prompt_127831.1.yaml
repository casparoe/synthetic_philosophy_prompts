  To capture your verdicts while maintaining philosophical coherence, I propose the **Principle of Causal-Explanatory Token-Identity**.

  ### The Principle
  **Causal overdetermination obtains if and only if multiple distinct causes are each individually sufficient to produce the *actual, finely-individuated historical token* of the effect (including its specific timing and qualitative character) at the *actual time of occurrence*.**

  This principle distinguishes between:
  1.  **Type-Sufficiency:** A cause is sufficient to produce the *general kind* of outcome (e.g., "a revolution," "the fall of an empire").
  2.  **Token-Sufficiency:** A cause is sufficient to produce the *specific historical instance* of the outcome (e.g., "The Revolution of 1789," "The Fall of Rome in 476 AD").

  Genuine overdetermination requires **Token-Sufficiency**. If the causes converge only on the *type*, or if their conjunction is required to explain the *specific timing or character* of the token, the relationship is **Explanatory Convergence** or **Joint Necessity**, not overdetermination.

  ---

  ### Application to Your Cases

  **Case 1: Fall of the Western Roman Empire (Verdict: True Overdetermination)**
  *   **Analysis:** You treat "The Fall" as a **coarse-grained historical state** (the end of imperial political unity) rather than a specific event on a specific day. Both economic decay and barbarian invasion are stipulated as individually sufficient for this *state*. Since the specific *timing* (e.g., 476 AD vs. 480 AD) is not explanatorily salient to the "Fall" as you define it, both causes are token-sufficient for the effect *as individuated*.
  *   **Principle Fit:** **Validated.** The effect is individuated coarsely enough that both causes suffice for the token.

  **Case 2: Outbreak of World War I (Verdict: Joint Necessity)**
  *   **Analysis:** Neither alliances nor the assassination were individually sufficient for the *token* event (War in 1914). Both were required to cross the threshold.
  *   **Principle Fit:** **Validated.** Fails the sufficiency condition.

  **Case 3: Newton and Leibniz (Verdict: Not Overdetermined)**
  *   **Analysis:** You resist redundancy because the "divergence in notation and conceptual framing" means Newton and Leibniz produced **different tokens** of "Calculus." Newton produced *Fluxions*; Leibniz produced *Differential Calculus*. While they converge on the *type* (infinitesimal analysis), they do not converge on the *token* (the specific mathematical toolset inherited by history).
  *   **Principle Fit:** **Validated.** The effect is individuated finely (by content/framing), so neither cause suffices for the *actual* combined legacy.

  **Case 4: Hypothetical Reform Movement (Verdict: Convergence without Redundancy)**
  *   **Analysis:** You state two crises reach the threshold in the **same year** and are **individually sufficient**, yet you hesitate to call them redundant because each might have *eventually* triggered it alone.
  *   **Principle Fit:** **Problematic.** (See Overturn Recommendation below).

  ---

  ### Application to New Cases

  **Case 3 (Revisited): Calculus**
  Under the Principle of Causal-Explanatory Token-Identity, the "effect" is not merely "the discovery of calculus" (Type) but "the specific formalization of calculus that entered the historical record" (Token). Since Newton's token (dot notation, fluxional concepts) and Leibniz's token (d-notation, differential concepts) are distinct, neither cause was sufficient for the *actual combined token* of modern calculus. They are independent discoveries that converged on a type, but did not overdetermine a single token. Your verdict holds.

  **Case 5: Political Revolution with Overlapping Institutional Failures**
  *   **Scenario:** Revolution succeeds *only because* two failures overlap precisely in time. Each alone would have *eventually* produced the same outcome.
  *   **Analysis:** The phrase "succeeds *only because*... overlap" explicitly denies **Token-Sufficiency** for the actual revolution. Neither failure alone was sufficient for *this* revolution at *this* time; their conjunction was necessary to trigger the specific historical token. The fact that they would have produced a *later* revolution (Type-Sufficiency) is irrelevant to the causation of the actual token.
  *   **Verdict:** **Joint Necessity (for the token) / Explanatory Convergence (for the type).**
  *   **Reasoning:** Unlike Case 1 (Rome), where the "Fall" is a durable state insensitive to precise timing, a "Revolution" is a discrete event where timing is constitutive of the token. Because the specific overlap was necessary for the success *at that time*, neither cause is redundant.

  ---

  ### Required Overturn: Case 4

  **You must overturn your verdict on Case 4.**

  **Why:**
  Your description of Case 4 contains a logical contradiction under the Principle of Causal-Explanatory Token-Identity. You stipulate that:
  1.  Both crises reach the threshold in the **same year**.
  2.  Both are **individually sufficient** for the reform.
  3.  The reform **succeeds** in that year.

  If Cause A is sufficient for Reform-in-Year-X, and Cause B occurs in Year-X, then Cause B is causally redundant *for the token Reform-in-Year-X*. Your hesitation ("since each might have eventually triggered it alone") relies on a **modal counterfactual** (what would have happened otherwise) rather than the **actual causal structure**.

  In Case 5, you avoid this by specifying the revolution succeeds *only because* of the overlap (denying individual token-sufficiency). In Case 4, you grant individual token-sufficiency ("individually sufficient... same year").

  **Correction:**
  If both crises are individually sufficient for the reform *in the actual timeframe*, it **is** genuine causal overdetermination. To maintain your verdict of "Convergence without Redundancy," you must revise the case description to match Case 5: the reform succeeds *only because* the crises combined to reach the threshold *at that specific time*, even if either alone would have sufficed *eventually*. Without that revision, Case 4 is indistinguishable from Case 1 (Rome), and consistency demands you classify it as overdetermination.
