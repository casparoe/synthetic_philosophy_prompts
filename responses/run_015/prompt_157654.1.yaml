  1. The scenario
  In a soundproofed clinic, Subject 402 undergoes polysomnography. During REM, EEG records theta waves interrupted by three alpha bursts lasting 1.5 seconds, unnoticed by the subject. Upon waking, 402 reports a vivid dream of fleeing a collapsing library, describing book titles and corridor turns. The report's narrative structure aligns precisely with the alpha bursts, suggesting these micro-arousals provided cognitive framing for disjointed semantic fragments generated during pure REM. No external stimuli were introduced. The subject insists the experience was continuous and lived through during sleep. Clinical data confirms sleep state consistency except for these fleeting transitions, creating conflict between physiological markers and phenomenological claims regarding narrative coherence. This setup isolates the precise moment where wakeful cognition might infiltrate sleep phenomenology.

  2. The verificationist reading
  The verificationist denies any experience occurred during REM sleep. For Malcolm, talk of dreaming is only meaningful upon waking; there is no criterion to verify mental states while asleep. The alpha bursts indicate moments of wakefulness, not sleep experience. Therefore, the narrative coherence arises during these brief wakings, not during the theta-wave sleep phases. Since the subject cannot distinguish between sleeping and these micro-wakings from the inside, the claim that they "lived through" the dream during sleep is unintelligible. The report is merely waking impressions mistaken for sleep content. Without a criterion to fix content during the theta phases, the assertion of determinate dream experience during sleep remains logically empty, regardless of insistence on continuity.

  3. The narrative-construction reading
  The narrative-construction model affirms the report but denies "lived" phenomenology. For Dennett, consciousness is a user-illusion constructed from multiple drafts. Micro-arousals are not wakefulness intruding on sleep, but access points where the brain stitches fragments into a story. Experience does not exist prior to stitching; dreaming *is* the reporting mechanism activating. The alignment of alpha bursts with narrative turns confirms that coherence is imposed retroactively upon semantic fragments. There is no inner movie watched during REM. Thus, the subject underwent a process becoming an experience only upon arousal-induced construction. The theory is confirmed because experience depends on the stitching mechanism. This explains the vividness without positing a hidden observer during deep sleep.

  4. The isolating feature
  Verdicts hinge on stitching. This lets the verificationist locate coherence in wakefulness, the constructionist in stitching. If removed, leaving pure REM, the verificationist denies experience, the constructionist loses narrative generation. Without stitching, the report lacks a causal origin. Consequently, the constructionist struggles, converging with verificationist skepticism. Opposition collapses; both deny content during sleep, differing on the report's status. This isolates binding, forcing the split between logical criteria and cognitive mechanism. Without this variable, the case fails to distinguish between no experience and unreportable experience, rendering the philosophical conflict moot. The feature is essential for generating the specific theoretical divergence required.

  5. The best attack
  The verificationist attacks the constructionist for conflating report accessibility with phenomenal experience. Narrative coherence requiring micro-arousals does not prove semantic fragments lacked qualitative feel during REM. Constructionists assume experience requires reportable structure, but raw qualia might exist without narrative framing. Alpha bursts may merely enable memory encoding, not experience generation. Equating stitching with experience generation begs the question against non-narrative consciousness. Verificationists claim we cannot verify experience, but constructionists wrongly claim experience *didn't* exist during REM. This succeeds by highlighting memory access is not phenomenology, preserving unreportable sleep experience. However, it ultimately fails to provide a positive criterion for sleep experience, leaving the verificationist's own negative claim as the only robust philosophical position remaining.
