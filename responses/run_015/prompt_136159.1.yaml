      *   *(1) & (4):* User wants to keep these. They are standard interpretations of *On Certainty* applied to science. (4) is the interesting bridge: personal identity as a methodological necessity.
      *   *(2) & (3):* These seem solid regarding metrology. A standard is assumed stable *for the duration of the measurement*, but standards *are* checked periodically against higher-order standards.
      *   *(5):* **Suspicious.** This claims absolute immunity ("no localized empirical finding... can rationally undermine it"). Wittgenstein says hinges are exempt from doubt *within the language-game*, but language-games can change, and hinges can shift. More importantly, *On Certainty* acknowledges that hinges *can* be displaced by overwhelming evidence, though doing so changes the system. It treats immunity as *pragmatic/logical* within the system, not *metaphysical/absolute* across all time.
