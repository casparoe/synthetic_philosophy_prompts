      *(Refining the "Nature of Flaw")*: "Equivocation on 'exempt from doubt'" is also good. It equates "not tested *here*" with "cannot be tested *anywhere*." Let's combine these ideas into "Scope Shift (contextual to absolute)."

      *(Checking the User's constraints)*: User wants to keep (1) and (4). Rejecting (5) allows this. (1) defines hinges, (4) applies the analogy. (5) makes a claim about the *consequences* of being a hinge that is too strong.

