      *   *Scientific View:* Calibration standards *do* drift. We have meta-standards. If a standard fails, we don't abandon science; we update the standard. The "hinge" status is temporary/contextual.
      *   *The Error:* Equivocation on "exempt from doubt." It means "not subject to verification *in this specific context*," not "incorrigible in the face of *any* context."
      *   *Cost of Rejection:* We save hinge epistemology from dogmatism. We admit hinges are dynamic. We keep (1) and (4) but refine the understanding of "exemption."

