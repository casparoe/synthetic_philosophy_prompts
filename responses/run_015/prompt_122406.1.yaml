          4.  The Agency Objections.
          5.  The Unfalsifiability Question.
          6.  Verdict.

      *   *Refining the "Fatal" arguments:*
          *   The strongest formal objection is **Non-Ergodicity**. If the phase space splits into disjoint invariant sets, the long-term behavior *does* depend on the specific initial condition (which basin you start in). Chaos often implies mixing, but not always ergodicity on the whole space.
          *   The strongest philosophical objection is **Earman's Criterion**. Determinism is a modal claim about *states*, not *distributions*. Calling statistics "determinism" is a category error.

      *   *Refining the Agency argument:*
          *   If my choice is just a sample from a fixed distribution, do I have agency? Or am I a random number generator? Shadow Determinism might accidentally argue for *hard incompatibilism* rather than saving agency.

      *   *Refining Unfalsifiability:*
