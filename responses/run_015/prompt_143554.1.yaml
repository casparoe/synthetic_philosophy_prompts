answer: |-
  This is a sophisticated methodological move. You are correctly identifying that much of the debate in hedonistic axiology talks past itself because participants assume different functional roles for "pleasure" without agreeing on the job description. By fixing the purpose first (Welfare Explanation, Empirical Utility, Theoretical Distinctness), we can filter accounts based on fitness for purpose rather than intuitive fit alone.

  Below is the critique of your draft, the structured desiderata table, the analysis of tensions, and the evaluation of the standard families.

  ### Part 1: Critique of Your Draft List

  Your draft mixes **functional requirements** (what the theory must *do*) with **substantive commitments** (what you suspect pleasure *is*).

  **Real Desiderata (Functional):**
  *   **Distinctness from Desire/Mood:** Essential for Purpose (iii). If the account collapses into desire-satisfaction, it isn't hedonism; if it collapses into mood, it fails the "stretch of life" test (moods are states, pleasures are often events).
  *   **Animal/Infant Applicability:** Essential for Purpose (ii). If the theory requires complex linguistic report or high-level cognitive endorsement, it fails the empirical constraint.
  *   **Wanting/Liking Separation:** Essential for Purpose (ii) and (iii). Empirical psychology (Berridge et al.) shows these dissociate; a welfare theory ignoring this is empirically obsolete.
  *   **Welfare vs. Intensity Distinction:** Essential for Purpose (i). You need to explain why a degrading pleasure might be intense but low-welfare (or vice versa), or at least allow the *conceptual space* for that debate without defining it away.

  **Preferences Dressed as Requirements:**
  *   **The "Comfortable Shoe" (Unnoticed Pleasure):** This is a substantive commitment (Attitudinal Hedonism loves this; Sensationism hates it). For Purpose (ii) (measurement), unnoticed states are problematic. If subjects can't report them and animals can't signal them, how do you measure them? This conflicts with your empirical constraint.
  *   **Qualitative Difference + Aggregation:** You want pleasures to differ in kind *but* still have an exchange rate. This is the classic Mill problem. It is not a desideratum a theory can easily "meet"; it is a tension you are imposing on the theory. Demanding both may be asking for the impossible.
  *   **Mixed Valence:** While phenomenologically accurate, strict hedonism often requires a net scalar value to calculate "betterness." Demanding mixed valence complicates the "summing" requirement of Purpose (i).

  ### Part 2: Desiderata for a Theory of Pleasure

  The following table organizes the requirements based on your three fixed purposes.

  | ID | Desideratum | Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **W1** | **Welfare Relevance** | Must explain what makes a stretch of life go better *for the subject*. | **NN** (Purpose i) |
  | **W2** | **Scalar Aggregability** | Must supply an exchange rate to compare/sum pleasures within a life and across persons. | **NN** (Purpose i) |
  | **E1** | **Operationalizability** | Must map to measurable proxies (self-report labels, behavioral indicators) for experience-sampling. | **NN** (Purpose ii) |
  | **E2** | **Non-Linguistic Applicability** | Must apply to animals/infants without requiring linguistic report or complex cognitive endorsement. | **NN** (Purpose ii) |
  | **E3** | **Wanting/Liking Dissociation** | Must allow that an agent can want without liking (addiction) or like without wanting (surprise). | **NN** (Purpose ii) |
  | **D1** | **Distinct from Desire** | Must not define pleasure as the satisfaction of a pro-attitude (avoids collapse into Desire Theory). | **NN** (Purpose iii) |
  | **D2** | **Distinct from Mood** | Must distinguish episodic pleasure from background happiness or temperament. | **NN** (Purpose iii) |
  | **D3** | **Distinct from Objective Fact** | Must exclude the "Experience Machine" case (mere fact of success without experience). | **NN** (Purpose iii) |
  | **P1** | **Extensional Coverage (High)** | Must account for intellectual, aesthetic, and relief-based pleasures (proof, false alarm). | **CP** (Sensationists struggle here) |
  | **P2** | **Extensional Coverage (Low)** | Must account for sensory pleasures (itch, shoe, taste) without over-including pain (hot burn). | **CP** (Attitudinalists struggle here) |
  | **P3** | **Qualitative Heterogeneity** | Must allow pleasures to differ in kind (itch vs. symphony), not just intensity/duration. | **CP** (Millians want this; Benthamites reject it) |
  | **P4** | **Unconscious Pleasure** | Must allow for pleasure that is not currently noticed (comfortable shoe, flow). | **CP** (Conflicts with E1) |
  | **P5** | **Mixed Valence** | Must allow a single experience to contain both pleasure and pain simultaneously. | **CP** (Conflicts with W2 summation) |

  **Key:** **NN** = Non-Negotiable (given your fixed purposes); **CP** = Camp Preference (substantive commitments that filter specific theories).

  ### Part 3: Structural Tensions and Exclusionary Requirements

  #### 1. The Impossible Joint Satisfaction: Heterogeneity (P3) vs. Aggregation (W2)
  This is the structural fault line in your list.
  *   **The Conflict:** If pleasures differ in *kind* (P3), they are qualitatively heterogeneous. To aggregate them (W2), you need a common currency (a *tertium quid*). If you posit a common currency (e.g., "felt intensity"), you risk flattening the qualitative differences, effectively denying P3. If you maintain strong qualitative differences, you lack the exchange rate required for W2.
  *   **The Measurement Complication:** You noted the coarseness of self-report. If subjects report "joy" and "relief" as different labels, how does the researcher sum them? If the theory says "convert both to intensity units," it violates the phenomenological data (P3). If the theory says "keep them separate," it fails the hedonistic calculus (W2).
  *   **Verdict:** You cannot fully satisfy both without a controversial metaphysical claim (e.g., that all pleasures share a hidden neural commonality despite phenomenological difference).

  #### 2. The Exclusionary Requirement: Non-Linguistic Applicability (E2)
  The single requirement that excludes the most candidates is **E2 (Non-Linguistic Applicability)** combined with **D1 (Distinct from Desire)**.
  *   **Why:** Many philosophical accounts define pleasure via complex cognitive states (e.g., "taking pleasure in" requires a concept of the object; "judging a state as good"). These fail E2 immediately (animals/infants).
  *   **The Desire Trap:** To fix E2, theories often retreat to "getting what you want." But this violates D1 (Distinct from Desire).
  *   **The Consciousness Trap:** To fix D1, theories often retreat to "raw feels." But raw feels are hard to verify in non-linguistic subjects without behavior, which loops back to desire/satisfaction proxies.
  *   **Result:** This pair filters out most high-cognition Attitudinal views and most crude Behaviorist views.

  #### 3. The Measurement vs. Unconscious Tension (E1 vs. P4)
  You require the theory to be usable in experience-sampling (E1) but also want it to handle unnoticed comfort (P4).
  *   **Conflict:** Experience sampling relies on *noticed* states. If pleasure can be unnoticed (P4), your empirical method (E1) is blind to a subset of the welfare-generating data.
  *   **Resolution:** You must likely sacrifice P4. For a theory to serve Purpose (ii), pleasure must be potentially accessible to consciousness, even if not currently attended to. Truly unconscious pleasure is empirically ghostly.

  ### Part 4: Evaluation of Standard Families

  Here is how the four standard families score against the **Non-Negotiable (NN)** requirements.

  | Theory Family | W1 (Welfare) | W2 (Aggregation) | E1/E2 (Empirical/Animals) | D1 (Not Desire) | D2 (Not Mood) | D3 (Not Machine) | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Felt Quality (Sensationism)**<br>*(Pleasure is a distinctive sensation)* | **Pass** | **Pass** (Intensity scales well) | **Fail** (Hard to locate in animals; "neural signature" missing) | **Pass** | **Pass** | **Pass** | Fails E2. Lacks empirical marker. |
  | **2. Attitudinal Hedonism**<br>*(Pleasure is pro-attitude toward experience)* | **Pass** | **Weak** (How to scale attitudes?) | **Fail** (Animals lack complex attitudes) | **Pass** | **Pass** | **Pass** | Fails E2. Too cognitive for infants. |
  | **3. Adverbial/Representational**<br>*(Pleasure is experiencing-in-a-certain-way)* | **Pass** | **Weak** (Hard to quantify "ways") | **Mixed** (Depends on rep. complexity) | **Pass** | **Pass** | **Pass** | Fails W2. Hard to aggregate "ways." |
  | **4. Desire-Fulfillment**<br>*(Pleasure is getting what you want)* | **Pass** | **Pass** | **Pass** (Behavioral proxies work) | **FAIL** | **Pass** | **Fail** (Machine ok if unaware) | Fails D1 & D3. Collapses into Desire Theory. |

  **Summary:**
  *   **Sensationism** is the best fit for Aggregation (W2) but fails the empirical reality of neural diversity (E1/E2).
  *   **Attitudinalism** handles the "grumpy pleasure" cases best but fails the Animal/Infant constraint (E2).
  *   **Desire-Fulfillment** is the only one that easily handles animals and measurement, but it violates your Purpose (iii) by definition.

  ### Part 5: The Fifth Option (Family Resemblance) and What to Sacrifice

  If you adopt the view that pleasure is a **Family Resemblance** (Wittgensteinian cluster concept: no single essence, but overlapping features like intensity, positivity, motivation, phenomenology), you solve the Extensional Coverage problems (P1, P2) and the Heterogeneity problem (P3).

  **However, to make this work, you must sacrifice:**
  1.  **Scalar Aggregability (W2):** If there is no common essence, there is no common currency. You cannot sum "itch relief" and "symphonic joy" into a single "hedonic tonnage."
  2.  **Hedonism as a Maximizing Theory:** Without aggregation, you cannot say "Life A is better than Life B because it has *more* pleasure." You can only say "Life A has a different *profile* of pleasures."
  3.  **Purpose (i) in its Strong Form:** You can no longer say what makes a life go better *simpliciter*, only what makes it go better *in specific dimensions*.

  **Recommendation:**
  If your goal is to defend **Hedonism** (which implies a single metric of value), the Family Resemblance view is fatal. It turns hedonism into a form of Pluralism.
  If your goal is **Empirical Accuracy** (Purpose ii), Family Resemblance is the most honest fit for the data (Berridge's dissociations, mixed valence), but it forces you to abandon the "Calculus" of classical hedonism.

  **Final Strategic Advice:**
  To keep your paper viable, you should likely mark **Qualitative Heterogeneity (P3)** as a *Camp Preference* rather than a Non-Negotiable. If you demand P3 and W2 (Aggregation), you render the theory incoherent. Most successful modern hedonisms (e.g., Heathwood, Feldman) sacrifice P3 (treating pleasure as a uniform attitude or sensation) to save W2. If you want to save P3, you must weaken W2 to "comparability within kinds" rather than "global aggregation." Given your Purpose (ii) (measurement), sacrificing P3 is the safer bet for a working theory.
