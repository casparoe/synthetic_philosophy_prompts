prompt: |-
  I am defending a proposal next week to the technical advisory panel of a multilateral development bank's governance practice, with several of the bank's regional country-office directors also in the room. My thesis: corruption is not a family of act-types — bribes, gifts, nepotism, vote-buying — but a single failure, the substitution of a personal relation for a public reason in the allocation of a state good. I cash this out with the beneficiary-substitution test: an exercise of public power is corrupt just in case the agent's operative reason for the allocation would not survive substituting, for the actual beneficiary, some other member of the relevant public who stands in no such relation to the agent. Which relations count as legitimately reason-giving varies across societies; the structure of the failure does not. I claim three payoffs: clientelism is corruption even where no money changes hands; much routine gift-giving to officials is not corruption, because it asserts a claim to recognition rather than a claim on a particular allocation; and the lawful influence-trading of wealthy democracies — campaign finance, revolving-door appointments, regulatory capture — is corruption in the strict sense and usually the more damaging kind, something the field's standard definition, built around abuse of entrusted power for private gain, cannot say.

  The audience: two governance economists who work in principal–agent terms and need cross-country comparable indicators; two criminal-law drafters who need ex ante notice, mens rea, and elements a jury can actually find; a political scientist and an anthropologist of patronage who treat good-governance metrics as a neo-colonial export; and a regional director from an office where vote-brokerage and gift-giving are pervasive, who will want to know what she is meant to tell her staff on Monday.

  Draft my Q&A prep sheet: the eight or so objections I will actually get, ordered by how much damage each would do, each attributed to the person most likely to raise it and phrased in that person's idiom rather than mine, with a ninety-second reply and a note on where the reply is softest. Tell me what I should concede in the first two minutes, which single reply has to land if the proposal is to survive, and give me the question I am hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Context:** Defending a proposal to a Multilateral Development Bank (MDB) Technical Advisory Panel (TAP).
      *   **Audience:**
          *   2 Governance Economists (Principal-Agent, indicators, cross-country comparability).
          *   2 Criminal-Law Drafters (Ex ante notice, mens rea, jury-findable elements).
          *   1 Political Scientist/Anthropologist (Critical of neo-colonial metrics, understands patronage).
          *   1 Regional Country-Office Director (Practical implementation, staff guidance, local context of vote-brokerage/gifts).
      *   **Thesis:** Corruption = substitution of personal relation for public reason in allocation of state goods.
      *   **Test:** Beneficiary-Substitution Test (Would the reason survive if the beneficiary were a random member of the public?).
      *   **Claims:** Clientelism = corruption; Routine gifts $\neq$ corruption (recognition vs. allocation); Wealthy democracy influence-trading = corruption (often worse).
      *   **Deliverables:**
          *   Q&A Prep Sheet (8 objections, ordered by damage, attributed to specific audience members, in their idiom).
          *   90-second reply for each.
          *   Note on where the reply is softest.
          *   What to concede in the first 2 minutes.
          *   The single reply that *must* land.
          *   The question hoping nobody asks.

  2.  **Deconstruct the Thesis & Audience Tensions:**
      *   *Economists:* Will hate the lack of quantifiability. "Public reason" is hard to measure. "Personal relation" is vague for datasets.
      *   *Lawyers:* Will hate the lack of *mens rea* and clear boundaries. How do you prove "operative reason"? Is this criminal or civil?
      *   *Anthropologist/PolSci:* Will attack the universalism. "Public reason" sounds Western/liberal. Is this imposing values?
      *   *Regional Director:* Will worry about operational paralysis. If gifts are okay but clientelism isn't, how do staff distinguish them in the field? Also, calling wealthy democracies "corrupt" might offend donors (the bank's shareholders).
      *   *General:* The definition is philosophical/normative, not operational.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (High Damage):* Operationalizability. If we can't measure it, we can't fund it. (Economists).
      *   *Objection 2 (High Damage):* Donor Politics. Calling US/EU lobbying "corruption" jeopardizes funding. (Regional Director/Bank Leadership).
      *   *Objection 3 (High Damage):* Legal Vagueness. Can't prosecute or legislate based on "reasons." (Lawyers).
      *   *Objection 4 (Medium-High):* Cultural Imperialism. Who defines "public reason"? (Anthropologist).
      *   *Objection 5 (Medium):* Distinction between Gift and Bribe. How to tell in practice? (Regional Director).
      *   *Objection 6 (Medium):* Principal-Agent alignment. Your definition ignores the principal's will. (Economists).
      *   *Objection 7 (Low-Medium):* Mens Rea/Intent. Accidental corruption? (Lawyers).
      *   *Objection 8 (Low):* Scope Creep. Is everything now corruption? (PolSci).

      *Refining Idioms:*
      *   Economists: "Variables," "identification strategy," "cross-country regression," "noise."
      *   Lawyers: "Statutory construction," "due process," "evidentiary burden," "strict liability."
      *   Anthropologist: "Ontological," "hegemonic," "context-specific," "moral economy."
      *   Regional Director: "Operational guidance," "risk matrix," "client relationship," "donor sensitivities."

  4.  **Developing Replies & Identifying Weaknesses:**
      *   *Need to be concise (90 seconds).*
      *   *Need to acknowledge the constraint while pivoting back to the value add.*
      *   *Weakness:* Usually where the philosophical ideal meets the messy reality.

  5.  **Strategic Concessions (First 2 Minutes):**
      *   Must acknowledge the measurement challenge (Economists).
      *   Must acknowledge the donor sensitivity (Regional Director).
      *   *Crucial:* Concede that this is a *diagnostic/framework* proposal, not a *prosecutorial* tool. This disarms the Lawyers immediately.

  6.  **The "Must Land" Reply:**
      *   It has to address the "So what?" for the Bank. Why change the definition?
      *   Answer: Because the current definition lets the biggest risks (clientelism, regulatory capture) slide while punishing harmless cultural practices. It misallocates Bank resources.

  7.  **The "Hope Nobody Asks" Question:**
      *   Something that exposes the internal contradiction or the Bank's own complicity.
      *   "If wealthy democracies are corrupt by your definition, why are we lending to *them* (via private sector arms) or taking policy cues from *them*?" OR "Does this definition apply to the Bank's own procurement?"
      *   Better: "If the 'public reason' is contested, who adjudicates?" (The Bank? That's imperialist.)

  8.  **Review and Refine (Self-Correction against constraints):**
      *   *Constraint Check:* 8 objections? Yes. Ordered by damage? Yes. Attributed? Yes. Idiom matched? Yes. 90-sec replies? (Will keep text tight). Soft spot noted? Yes. Concessions? Yes. Must-land reply? Yes. Dreaded question? Yes.
      *   *Tone:* Professional, strategic, slightly defensive but confident.
      *   *Specific nuance:* Ensure the "Beneficiary-Substitution Test" is referenced clearly but simply.

      *(Self-Correction on Objection 2)*: The Regional Director might be worried about telling staff that local customs are "corrupt." But the bigger risk is biting the hand that feeds (donors). Let's make the "Donor Sensitivity" point the highest damage because MDBs rely on shareholder capital. Actually, the Economists hold the purse strings for *governance* projects. If they say "no indicators," the project dies. Let's put Economists first.

      *(Self-Correction on Concessions)*: Don't concede too much. Concede *implementation* difficulty, not *theoretical* validity.

      *(Refining the "Must Land")*: It needs to bridge the gap between the philosophical definition and the Bank's mandate (development outcomes).

  9.  **Final Polish:** Check the voice. The user is academic/philosophical; the response needs to translate that into bureaucratic/policy language without losing the core insight.

      *(Drafting the content...)*
      *   *Economist 1:* "Where's the variable?"
