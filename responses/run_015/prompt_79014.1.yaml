  1. Both sides agree that explanatory virtues frequently correlate with true theories and that neither side denies the validity of standard probabilistic coherence. We sign this acknowledging we are not disputing the mathematics of probability or the necessity of empirical fit.
  2. The remaining disagreement is whether explanatory virtue constitutes a distinct epistemic principle or merely reflects hidden probability assignments. The first camp calls this distinct principle a sui generis rule of acceptance, while the second camp calls it a heuristic for estimating prior probabilities.
  3. The first side locates the warrant in a selection rule that can override low probability, while the second locates it entirely within prior probabilities, implying that in cases of known incomplete hypothesis spaces, the first side still selects the best explanation whereas the second suspends judgment. This divergence confirms that only the first side permits belief when the true hypothesis is known to be absent from the candidate set.
  4. The crux is whether a hypothesis can be rationally believed solely because it renders evidence less surprising than its rivals, tested against a case where a simple theory fits known data better than complex rivals despite low prior odds. The first side predicts rational belief is warranted here, while the second side predicts rational belief is withheld until priors are adjusted.
  5. We conclude the dispute is partly verbal regarding the definition of rationality, but substantively real regarding the source of normative force. My verdict is that the second side is right about the real crux because explanatory virtue cannot generate probability ex nihilo.
