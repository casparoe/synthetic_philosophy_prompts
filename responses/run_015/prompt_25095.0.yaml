      *   Wittgenstein's metaphor: The riverbed (hinges) vs. the water (ordinary propositions). The bed shifts, but slowly.
      *   Core idea: Some things function as the background against which doubt and inquiry make sense. "The earth has existed for many years," "I have two hands."
      *   Philosophical interpretations vary wildly (Coliva, Pritchard, Moyal-Sharrock, etc.).

