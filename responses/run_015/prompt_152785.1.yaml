prompt: |-
  I lead a three-person trust and safety policy team at a peer-to-peer marketplace — people list services, tickets, access, and a steady stream of weird one-off things — and most of my week goes into deciding whether a proposed listing category is allowed at all. It's about a dozen calls a week, usually turned around within a day, made by an analyst with no philosophy training, and whatever we write has to survive a look from outside counsel and, in the worst case, from a state attourney general. We keep going in circles, so I want an actual procedure rather than a vibe.

  Here's the half-baked framework I've been working from, which you should feel free to fix or throw out. The objections we raise seem to land in one of three places: (1) in the good itself — it's the kind of thing whose value is damaged by being for sale, so the sale changes what the thing even is; (2) in the relationship between the parties — someone gets taken advantage of, or one side is treated as a source of supply rather than as an equal you transact with, or the price is only "freely accepted" because the seller's alternatives are terrible; (3) in the effect on people who aren't in the deal — the market exists and bystanders are worse off, or the good starts getting distributed by ability to pay instead of by whatever principle was distributing it before. Then there's a fourth bucket we argue about constantly and cannot operationalize: the worry isn't what the market does but what it says — the market existing changes what everyone, including people who'd never trade, believes about the good or about each other. Every time we try to test for that it collapses into "does this make our stomach turn," which is exactly what I want out of the process, because our stomachs are unreliable and mostly just track whatever our user base happened to find normal that year.

  So please turn that, or a better version of it, into a triage procedure my analyst can run in under thirty minutes on a proposed category. I want, in order: the questions to ask; what counts as an adequate answer to each; what she's allowed to infer from thin evidence versus what she must escalate because it's an empirical question a company our size can't answer; where the procedure stops with a block versus an "allow, but constrain" (and which kinds of constraints answer which objection); and above all the points where it hands the decision to me or to legal because the disagreement is about values rather than facts — mark those explicitly instead of hiding them inside a proxy question. Be honest about which distinctions in this literature actually survive being compressed into a checklist and which ones I'd only be pretending to preserve, and about where a procedure like this will systematically misfire (my guesses: cases where the problem is that the market exists at all rather than that any particular trade is bad, and cases where the norm is mid-change). Then run it on three proposals in my queue: (a) paid kidney donation — I know it's the canonical example, so I want to see whether the procedure blocks it for a reason we'd actually defend to a regulator or just because everyone knows it's banned; (b) selling your place in a queue, i.e. someone books a free slot (campsite reservation, DMV appointment, popular restaurant waitlist) and resells it — my instinct is that this is obviously fine, like ticket resale, but a couple of us think it's a different problem; (c) a "rent an attendee" category, where people pay strangers to show up in person at things like funerals or small-town hearings purely so more bodies are in the room, with no one pretending to be a relative and no lies told — the buyer just wants the room to look full. I personally think (c) is harmless and suspect I might be wrong, so give me the result I won't like: if the procedure clears (c), tell me why I should distrust the clearance, and if it blocks something I'm attached to, say so straight. American English, please, in a form I can paste into a policy doc.
reasoning: |-
  Here's a thinking process that leads to the suggested policy framework:

  1.  **Analyze the Request:**
      *   **User:** Lead of a 3-person Trust & Safety policy team at a P2P marketplace.
      *   **Problem:** Current decision-making is ad-hoc ("vibe-based"), slow, and inconsistent. They need a concrete, operationalizable procedure for analysts to triage new listing categories.
      *   **Current Framework:** Based on four objections: (1) Commodification (good damaged by sale), (2) Exploitation/Relationship (unequal power, desperation), (3) Externalities (bystanders harmed, distribution by wealth), (4) Expressive Harm (what the market *says* about values).
      *   **Pain Point:** The fourth bucket ("what it says") is unworkable ("stomach turn").
      *   **Requirements:**
          *   Turn this into a <30 minute triage procedure.
          *   Structure: Questions -> Adequate Answers -> Inference vs. Escalation -> Block vs. Constrain -> Escalation Points (Values vs. Facts).
          *   Honesty Check: Admit where the checklist fails (systematic misfires).
          *   Test Cases: (a) Paid Kidney Donation, (b) Queue Scalping, (c) Rent-an-Attendee.
          *   Tone: American English, policy-doc ready, direct, honest about limitations.

  2.  **Deconstruct the Philosophy:**
      *   The user's framework aligns closely with "Market Norms" and "Repugnant Markets" literature (e.g., Alvin Roth, Michael Sandel, Elizabeth Anderson).
      *   *Bucket 1 (Good itself):* Inalienability/Commodification. Some things lose value if sold (friendship, votes, organs).
      *   *Bucket 2 (Relationship):* Exploitation/Coercion. Desperation, information asymmetry, power imbalance.
      *   *Bucket 3 (Externalities):* Negative spillovers. Crowding out, inequality, public safety.
      *   *Bucket 4 (Expressive):* Norm signaling. Does this normalize something harmful? This is the hardest to operationalize.
      *   *Goal:* Make Bucket 4 less about "stomach turn" and more about "reputational risk + norm displacement."

  3.  **Drafting the Procedure (The "Market Integrity Triage"):**
      *   *Time Limit:* Needs to be fast. 5 questions max, with clear decision trees.
      *   *Escalation:* Crucial distinction. Analysts handle facts/risk; Leads/Legal handle values/law.
      *   *Constraints:* Differentiate between "Block" (never allow) and "Constrain" (allow with guardrails).
      *   *The "Expressive" Problem:* Instead of asking "Is this immoral?", ask "Does this conflict with core legal/safety norms?" or "Would this trigger regulatory scrutiny?" This translates "stomach turn" into "reputational/legal risk."

  4.  **Refining the Questions (Iterative Process):**
      *   *Draft 1:* Is it illegal? Is it exploitative? Does it hurt others? Does it feel wrong?
      *   *Critique:* Too vague. "Feel wrong" is the problem.
      *   *Draft 2:* 1. Legality. 2. Harm to seller. 3. Harm to third parties. 4. Brand risk.
      *   *Critique:* Better. Need to define "Adequate Answer."
      *   *Final Polish:* Use the user's four buckets but translate them into operational queries.
          *   Q1 (Legality/Regulatory): Is this explicitly banned or high-risk legally? (Bucket 1 & 4)
          *   Q2 (Exploitation): Is the seller vulnerable? (Bucket 2)
          *   Q3 (Externalities): Does this break a non-market system? (Bucket 3)
          *   Q4 (Expressive/Brand): Does this signal we endorse something harmful? (Bucket 4 - translated to risk).

  5.  **Addressing the "Honesty Check":**
      *   Must admit that checklists can't solve hard moral philosophy.
      *   Specific failure modes: Norm shifts (what's bad today is good tomorrow), Systemic vs. Individual harm (one kidney sale is fine, a market is not).

  6.  **Running the Test Cases:**
      *   *(a) Kidney Donation:*
          *   Legality: Illegal (NSOTA). -> **BLOCK.**
          *   Why: Not just "stomach turn," but federal law + medical harm.
      *   *(b) Queue Scalping:*
          *   Legality: Gray area, often ToS violation of original provider.
          *   Exploitation: Low.
          *   Externalities: High (undermines fair access systems).
          *   Decision: **CONSTRAIN** (verify ownership, limit volume) or **BLOCK** if it violates third-party ToS significantly. Let's argue for *Constrain/Block* depending on the queue type (public vs. private).
      *   *(c) Rent-an-Attendee:*
          *   Legality: Generally legal (no fraud if disclosed).
          *   Exploitation: Low.
          *   Externalities: Undermines democratic/social processes (hearings, funerals).
          *   Expressive: Treats civic/social participation as a commodity.
          *   Decision: **BLOCK.** Why? Because it corrupts the *purpose* of the gathering (civic signal or mourning). This tests the "Expressive" bucket.

  7.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the difficulty, set the tone.
      *   **The Procedure (MIT - Market Integrity Triage):** Step-by-step.
      *   **Decision Matrix:** Block vs. Constrain vs. Escalate.
      *   **Limitations:** Where this fails.
      *   **Case Studies:** Applying the logic.
      *   **Conclusion:** Final advice.

  8.  **Refining the "Expressive" Bucket (Crucial Step):**
      *   The user hates "stomach turn."
      *   Solution: Reframe "Expressive Harm" as "Norm Corruption Risk."
      *   Question: "Does allowing this trade undermine the non-market mechanism that usually governs this interaction?"
      *   Example: Voting (market undermines democracy). Funerals (market undermines mourning).
      *   This makes it about *function* rather than *feeling*.

  9.  **Review against Constraints:**
      *   <30 mins? Yes, if questions are sharp.
      *   Analyst friendly? Yes, avoids philosophy jargon.
      *   Escalation points clear? Yes.
      *   American English? Yes.
      *   Policy doc format? Yes.

  10. **Final Polish:** Ensure the distinction between "Values" (Lead/Legal) and "Facts" (Analyst) is sharp. Make sure the Kidney example doesn't just say "Illegal" but explains the *policy* reason (coercion/harm) in case laws change. (Actually, for kidneys, the law is the primary driver, but the policy reason supports it).

      *Self-Correction on Kidneys:* The prompt asks to see if the procedure blocks it for a reason we'd defend, not just "it's banned." So I need to ensure the *policy* logic holds even if the law wasn't there (e.g., medical harm/exploitation).
      *Self-Correction on Queue:* Distinguish between "campsite" (private property rules) and "DMV" (government access). DMV is likely a hard block (public access); Campsite is a constrain (ToS of park).
      *Self-Correction on Attendee:* This is the tricky one. It feels harmless but corrodes civic truth. I need to make sure the procedure catches the "corruption of process" angle.

  11. **Drafting the Content:** (Mental outline of the response)
      *   Header: Market Integrity Triage Protocol (MIT-P).
      *   Section 1: The 4-Question Filter.
      *   Section 2: Decision Logic (Block/Constrain/Escalate).
      *   Section 3: Known Failure Modes.
      *   Section 4: Case Applications.

      *Let's write it.* (Proceeding to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Trust & Safety Policy Team
  **FROM:** Policy Lead
  **SUBJECT:** Market Integrity Triage Protocol (MIT-P) v1.0
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope
  This document replaces the ad-hoc review process for new listing categories. Its goal is not to solve moral philosophy, but to consistently identify **risk**, **liability**, and **platform integrity** issues within 30 minutes.

  This protocol distinguishes between **factual risks** (which analysts assess) and **value judgments** (which require Lead or Legal escalation). It operationalizes our four core objections: Commodification, Exploitation, Externalities, and Expressive Harm.

  ### 2. The Triage Filter (Four Questions)
  The analyst must answer the following four questions for every proposed category. Evidence must be cited (links, statutes, precedents). If evidence is unavailable, mark as **Unknown** and escalate.

  **Q1: Legality and Regulatory Risk (The "Hard Stop")**
  *   **Question:** Is this transaction explicitly prohibited by federal/state law, or does it closely mirror a category currently under regulatory scrutiny (e.g., FTC, State AG)?
  *   **Adequate Answer:** Citation of specific statute (e.g., NOTA for organs) or credible news of active investigation into similar platforms.
  *   **Inference Allowed:** If a direct competitor recently banned this category citing legal pressure, infer high risk.
  *   **Escalation Trigger:** Any ambiguity in statutory language or conflict between state laws.

  **Q2: Vulnerability and Coercion (The "Exploitation" Check)**
  *   **Question:** Is the seller likely to be acting out of desperation, impaired judgment, or severe information asymmetry? Is the "price" effectively a coercion mechanism?
  *   **Adequate Answer:** Demographic data on typical sellers (e.g., "low-income patients"), medical consensus on risk, or evidence of predatory patterns in adjacent markets.
  *   **Inference Allowed:** If the good involves bodily integrity, health data, or essential legal rights, infer high vulnerability unless proven otherwise.
  *   **Escalation Trigger:** Disagreement on whether a specific vulnerability (e.g., grief, debt) constitutes "coercion" in this context.

  **Q3: Systemic Corruption (The "Externality" Check)**
  *   **Question:** Does this market undermine a non-market allocation system that serves a public or community function (e.g., justice, healthcare, civic participation, safety)?
  *   **Adequate Answer:** Explanation of the original allocation method (e.g., "first-come," "need-based," "random") and how monetization bypasses it to the detriment of third parties.
  *   **Inference Allowed:** If the good is a public resource or a civic duty, infer systemic corruption.
  *   **Escalation Trigger:** Uncertainty about whether the original allocation system is "public/civic" or purely "commercial."

  **Q4: Norm Signal (The "Expressive" Check)**
  *   **Question:** If this category appears on our homepage, does it signal that we endorse a behavior that contradicts our Community Standards or basic human dignity, regardless of the individual transaction's safety?
  *   **Adequate Answer:** Specific reference to brand safety guidelines or a parallel to a previously banned category based on reputational risk (not just "feels weird").
  *   **Inference Allowed:** If the transaction requires the seller to perform intimacy, grief, or civic duty as a service, infer high reputational risk.
  *   **Escalation Trigger:** **ANY** "Yes" here must be escalated to the Policy Lead. Analysts do not make norm-setting decisions.

  ---

  ### 3. Decision Logic

  | Result | Action | Constraint Examples |
  | :--- | :--- | :--- |
  | **High Risk on Q1** | **BLOCK** | N/A |
  | **High Risk on Q2** | **BLOCK** or **CONSTRAIN** | Income caps, mandatory cooling-off periods, verified counseling. |
  | **High Risk on Q3** | **BLOCK** or **CONSTRAIN** | Volume limits, geofencing, verification of original entitlement. |
  | **High Risk on Q4** | **ESCALATE TO LEAD** | N/A (Lead decides based on brand strategy). |
  | **All Clear** | **ALLOW** | Standard T&S monitoring. |

  **Note on Constraints:** Constraints are only valid if they can be technically enforced. If a risk cannot be mitigated by a platform feature (e.g., "don't sell if desperate"), the category must be **BLOCKED**.

  ---

  ### 4. Known Failure Modes (Honesty Check)
  This procedure is a tool, not a truth machine. It will systematically misfire in the following scenarios. When these arise, **escalate immediately**.

  1.  **The "Death by a Thousand Cuts" Problem:** This procedure evaluates a *category*. It may miss systemic harm that only appears at scale (e.g., one person renting a queue spot is fine; a bot farm doing it is not). *Mitigation:* Add volume caps to all "Allow" decisions for new categories.
  2.  **The "Norm Shift" Problem:** This checklist relies on current norms. It cannot predict when a norm is mid-change (e.g., surrogacy in the 1980s vs. today). If the team is split 50/50 on Q4, it indicates a shifting norm. *Mitigation:* Escalate for strategic review.
  3.  **The "Existence" Problem:** Some markets are harmful simply because they exist, not because individual trades are unsafe. This checklist struggles to distinguish between "unsafe trade" and "wrong market." *Mitigation:* Treat Q4 (Norm Signal) as the primary capture for this, but acknowledge it requires Lead judgment.

  ---

  ### 5. Application to Current Queue

  Below is the application of MIT-P to the three pending proposals.

  #### (a) Paid Kidney Donation
  *   **Q1 (Legality):** **YES.** National Organ Transplant Act (1984) prohibits valuable consideration for organs.
  *   **Q2 (Vulnerability):** **YES.** High medical risk to seller; high correlation with financial desperation.
  *   **Q3 (Systemic):** **YES.** Undermines need-based medical allocation.
  *   **Q4 (Norm Signal):** **YES.** Treats human body parts as inventory.
  *   **Decision:** **BLOCK.**
  *   **Rationale:** This is not a "stomach turn" block; it is a statutory block supported by Q2 and Q3. If a regulator asks why, we cite NOTA (Q1) and the prevention of coercion of vulnerable populations (Q2). This is a defensible, non-philosophical block.

  #### (b) Selling Place in Queue (Campsite, DMV, Restaurant)
  *   **Q1 (Legality):** **MIXED.** Reselling government appointments (DMV) often violates state admin codes. Reselling private waitlists is generally legal but may violate the venue's ToS.
  *   **Q2 (Vulnerability):** **LOW.** Sellers are typically gig workers choosing to wait; buyers are time-rich/cash-poor or vice versa.
  *   **Q3 (Systemic):** **HIGH (for Public).** For DMV/Campsites: Undermines "first-come, first-served" public access. Converts civic access to pay-to-play.
  *   **Q4 (Norm Signal):** **MEDIUM.** Signals that civic access is purchasable.
  *   **Decision:** **SPLIT BLOCK/CONSTRAIN.**
      *   **Government/Public Slots (DMV, Public Parks):** **BLOCK.** (Fails Q1 & Q3). We cannot facilitate the monetization of public access.
      *   **Private Commercial Slots (Restaurants, Private Events):** **CONSTRAIN.** (Passes Q1/Q2, Low Q3). Limit to 1 listing per user to prevent bot farms. Require proof of original reservation.
  *   **Rationale:** Your instinct that this is "like ticket resale" is correct for private venues. However, the team members worried about "different problems" are correct regarding public resources. The procedure captures this distinction in Q3.

  #### (c) "Rent an Attendee" (Funerals, Hearings)
  *   **Q1 (Legality):** **NO.** Generally legal if no fraud is committed (attendee does not claim to be a relative).
  *   **Q2 (Vulnerability):** **LOW.** Seller is performing a low-skill service.
  *   **Q3 (Systemic):** **HIGH.**
      *   *Hearings:* Undermines the democratic function of a town hall, which is to gauge *constituent* sentiment, not *paid* sentiment.
      *   *Funerals:* Undermines the social function of mourning, which relies on authentic connection.
  *   **Q4 (Norm Signal):** **HIGH.** Signals that civic presence and social grief are commodities.
  *   **Decision:** **ESCALATE TO LEAD (Recommended Outcome: BLOCK).**
  *   **Rationale:**
      *   *Why you might be wrong:* You view this as harmless because no one is lied to. The procedure flags this in **Q3 (Systemic Corruption)**. A town hall hearing is not a "show"; it is a data-gathering mechanism for representatives. Filling it with paid actors corrupts the data, even if disclosed.
      *   *Why the procedure works:* An analyst might clear this based on Q1 and Q2. **Q3 and Q4 force the escalation.**
      *   *Distrust the Clearance:* If the analyst clears this, they have likely treated a "civic/social good" as a "commercial good." This is the exact "Expressive Harm" bucket you struggled with. By framing Q3 as "undermining non-market allocation," we catch it: The "allocation" here is *attention and legitimacy*, which should not be purchasable.
      *   *Recommendation:* **BLOCK.** The reputational risk of headlines like "Marketplace Allows Paid Mourners" or "Paid Actors Swarm Town Hall" outweighs the GMV. This is a Q4 "Norm Signal" block, which is a value judgment, hence the escalation to you.

  ### 6. Implementation Notes
  1.  **Analyst Training:** Analysts must understand that "Escalate" is a valid and successful outcome. It is not a failure of analysis.
  2.  **Documentation:** Every "Allow" decision must save the Q1-Q4 answers to the ticket. This creates an audit trail for Counsel.
  3.  **Review Cycle:** Revisit this protocol in 6 months. If >20% of tickets are escalating on Q4, we need a clearer brand guideline.

  **Approved By:** Policy Lead
  **Effective:** Immediately
