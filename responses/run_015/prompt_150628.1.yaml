answer: |-
  ### Prediction and Primary Rule

  **Verdict:** M. will **reject** the new proposal.

  **The Rule:** **Typological Essentialism constrained by Systemic Settlement.**
  M. operates on the principle that a glyph's identity is not determined by its visual legibility (Case 4, 6), nor solely by its procedural derivation (Case 6 vs. New Proposal), but by its adherence to the historical and structural model ("Hand") assigned to the font cut, and its relational fit ("settlement") within that specific system.

  In her view, the "Roman Hand" and the "Italic Hand" are distinct structural models with non-interchangeable topologies. The two-storey 'a' is a constitutive requirement of the Roman model in this family; the one-storey 'a' is a constitutive requirement of the Italic model. To place a one-storey 'a' in the Roman is to violate the definition of the Hand, regardless of how "honestly" the glyph was drawn or how well it reads. The "settlement with the o and the d" remark confirms that identity is relational: a Roman 'a' must look like a Roman 'a' *in relation to* a Roman 'o' and 'd'. A one-storey shape disrupts that specific settlement, making the page "less like us."

  ---

  ### Alternative Rules and Predictions

  To ensure we have isolated M.'s logic, we must consider other rules that fit her six prior verdicts but diverge on this new case.

  **1. Procedural Legitimacy (The "Genealogy" Rule)**
  *   **Logic:** A glyph is valid if and only if it is derived intentionally from the family's existing core glyphs for that specific slot. "Accidents" (Case 6) are invalid; intentional edits (Case 1, New Proposal) are valid.
  *   **Fit to History:** Explains Case 6 (rejected as "accident") and Case 1 (accepted as edit). It accommodates Case 5 by assuming the Italic 'a' slot allows one-storey derivation.
  *   **Prediction for New Proposal:** **Accept.** The tool edited the accepted Roman 'a' directly. The procedure is "honest," unlike Case 6.
  *   **Weakness:** Fails to explain why the "Hand" distinction (Case 5) exists. If procedure is all that matters, a one-storey Roman 'a' derived from a two-storey Roman 'a' should be as valid as a one-storey Italic 'a' derived from a one-storey Italic 'a'.

  **2. Topological Invariance (The "Parts" Rule)**
  *   **Logic:** A glyph is identified strictly by the arrangement of its parts (stems, bowls, arches, terminals). If the topology changes (e.g., arch removed, stem moved), it is a different letter or a different hand.
  *   **Fit to History:** Explains Case 2 ('o' + stick), Case 3 ('d'), and Case 5 (Italic allows different topology). Explains Case 4 (broken parts = "two animals").
  *   **Prediction for New Proposal:** **Reject.** The topology has changed from two-storey to one-storey. In the Roman slot, this topology is forbidden.
  *   **Weakness:** Does not fully account for Case 6. In Case 6, the topology was *identical* to the accepted 'a', yet it was rejected. Topology alone is insufficient; history matters.

  **3. Textural Settlement (The "Family Resemblance" Rule)**
  *   **Logic:** A glyph is valid if it maintains the specific visual texture and "voice" of the family. Legibility is secondary to consistency of color and character ("less like us").
  *   **Fit to History:** Explains Case 4 ("one animal" implies gestalt unity), Case 6 ("accident" implies it doesn't belong to the family's logic), and the reader feedback in the New Proposal ("cleaner but less like us").
  *   **Prediction for New Proposal:** **Reject.** The testers noted it looked "less like us." It breaks the settlement.
  *   **Weakness:** This is somewhat circular without defining what "us" is. "Us" is defined by the Hand. Thus, this rule collapses into Typological Essentialism.

  **Best Guess:**
  I prefer **Typological Essentialism** (supported by Textural Settlement). M.'s explicit distinction between the "Roman hand" and "Italic hand" (Case 5) is the strongest evidence. She views these not just as styles, but as distinct *systems* with their own internal laws. A one-storey 'a' is "honest" in Italic because it belongs to that system's logic; it is "dishonest" in Roman because it imports the logic of a different system. The Procedural Legitimacy rule is a necessary condition (don't be an accident), but not a sufficient one (you must also be the right *kind* of 'a' for this hand).

  ---

  ### The Crucial Experiment

  To separate **Procedural Legitimacy** from **Typological Essentialism**, you need a case where the procedure is correct, but the topology crosses the Hand boundary in the opposite direction.

  **The Case:** Propose a **two-storey 'a' for the Italic companion**.
  *   **Construction:** Take the accepted Italic one-storey 'a' and intentionally edit it (procedurally "honest") to add an arch and terminal, making it structurally identical to the Roman 'a'.
  *   **Metrics:** Match the Italic's slope and metrics.

  **Predictions:**
  *   **Procedural Legitimacy Rule:** **Accept.** It was derived intentionally from the Italic 'a' slot. It is not an "accident."
  *   **Typological Essentialism Rule:** **Reject.** The Italic Hand *requires* a one-storey 'a' (per Case 5: "In the italic that's the *only* honest a"). A two-storey 'a' in an italic is a "Sloped Roman," not a True Italic. It violates the Hand.
  *   **Textural Settlement Rule:** **Reject.** It would likely look "heavier" or "stiffer" than the italic texture, breaking the settlement with the italic 'o' and 'd'.

  If M. rejects this, it confirms that the **Hand (Model)** dictates the allowable topology, overriding procedural correctness. If she accepts it, it suggests her objection to the New Proposal is specifically about the *Roman* texture, not the Italic/Roman boundary itself. Given her comment on the "only honest a," I predict she will reject the two-storey Italic.

  ---

  ### The Principle of Identity

  If consistency with her own record commits her to rejecting this glyph (as I believe it does), she is adopting the principle that a letter is identified by **the slot it occupies among the other letters of this family**, constrained by the historical model of the Hand.

  She explicitly rejects identification by:
  *   **Shape as read in context:** (Case 4 & 6: "Readers are not the tribunal.")
  *   **Gesture or procedure alone:** (Case 6: A correctly shaped 'a' made by the wrong method is an "accident." Conversely, the New Proposal is made by the right method but is the wrong shape for the slot.)
  *   **Arrangement of parts alone:** (Case 5: The same arrangement is valid in Italic but invalid in Roman.)

  For M., a glyph is a **systemic position**. An 'a' is not an 'a' because it looks like one, or because you drew it like one, but because it fulfills the structural obligations of the 'a'-slot within the specific agreement (the "settlement") of the Roman Hand. To introduce a one-storey 'a' into the Roman is to break the contract of that Hand. She is not designing shapes; she is designing a system of relationships. The new proposal is a "citizen" of the Italic Hand attempting to reside in the Roman Hand without naturalization; procedurally it may have the right papers, but ontologically, it does not belong.
