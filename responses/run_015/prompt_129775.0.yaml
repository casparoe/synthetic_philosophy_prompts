      However, the test highlights a genuine underdetermination. The theory cannot tell us precisely where to draw the line on age or residency because those are line-drawing problems, not categorical ones. Fifteen years versus ten, eighteen versus sixteen—these are administrative judgments masquerading as moral truths. The practice hangs together not through theoretical consistency but through functional stability. It balances the need for a defined sovereign body against the moral pull of inclusion. To take the fixed-point test seriously would require independent tribunals to set franchise rules based on affectedness, removing the power from the legislature. But this merely shifts the circularity to the tribunal's own composition. The practice remains underdetermined because the question "who constitutes the people" is political, not philosophical. We vote on who votes because there is no higher authority to decide for us.

