      The circularity you identify—existing voters deciding the franchise—is not a bug but the paradox of founding inherent in sovereignty. There is no external arbiter to legitimize the boundary; the polity must constitute itself. To demand a non-circular justification is to demand a view from nowhere. The system accepts this tension because stability requires a closed loop of authority.

