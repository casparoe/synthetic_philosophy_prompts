  The air in the hab module tasted of recycled ozone and damp soil. Dr. Elara Voss stared at the tray of *specimen-44b*, the low-hanging shrubs that covered the basalt plains outside. Under the grow-lamps, their leaves pulsed a vibrant, reassuring chlorophyll green.

  Her datapad hovered over the keyboard. The field manual draft blinked back at her.

  **Section 4.1: Metabolic Stability.**
  *All observed specimens exhibit green-spectrum photosynthetic reflectance prior to Epoch 50. Post-Epoch 50, specimens transition to blue-spectrum reflectance.*

  It looked clean. It looked like science. It was a lie.

  Voss rubbed her temples. The problem wasn't the plants. The plants were honest; they changed color when their internal chemical counters tripped. The problem was the *Epoch*.

  "Still stuck on the wording?"

  Kaelen leaned against the doorframe, wiping grease from his hands with a rag. He was the settlement's lead engineer, a man who believed physics was a set of instructions written by God for humans to follow, provided they used the right units.

  "The wording is fine," Voss said, not looking up. "The ontology is broken."

  Kael snorted, walking over to pour himself a合成 coffee. "Don't start with the metaphysics, Elara. Command wants the manual finalized before the next supply drop. They need to know if the oxygen scrubbers based on these things are going to fail after the next cycle."

  "They won't fail," Voss said. "They'll just shift efficiency curves. But I can't write the law without fixing the time parameter."

  "Fix it to UTC," Kael said, as if it were obvious. "Earth Standard. It's what Command uses. It's what the nav-computers use."

  "UTC is arbitrary here," Voss said, finally turning her chair. "We're on Nyx-7. We're tidally locked to the Leviathan. The plants respond to the magnetospheric pulse of the gas giant. That's their clock. Their 'Cycle' is one full oscillation of the Leviathan's shadow across the equator."

  "Which is roughly twenty-four hours," Kael said.

  "Roughly," Voss corrected. "It's twenty-three hours, forty-two minutes, and eleven seconds. Plus drift. Over fifty cycles, the divergence is significant."

  She tapped the datapad. She pulled up two timelines.

  **Timeline A (UTC):** 50 cycles = 1,200 Earth Hours.
  **Timeline B (Local Sidereal):** 50 cycles = 1,185.9 Earth Hours.

  "There's a fourteen-hour gap," Voss said. "If I write the manual using UTC, I'm telling the farmers that the plants stay green until Hour 1,200. But the plants don't care about Earth's rotation around the Sun. They care about the Leviathan's shadow. They will shift to blue at Hour 1,185."

  "So?" Kael took a sip. "You write a footnote. 'Adjust for local drift.' It's semantics, Elara. The plants shift. We know when. We just map it to the clock we actually use."

  "It's not semantics," Voss said, her voice tightening. "It's Goodman's Grue. But worse."

  Kael rolled his eyes. "I took Phil 101. Emeralds are green until 2050, then blue. It's a logic puzzle. It's not real."

  "It's real when the predicate 'before time *t*' isn't neutral background," Voss said, standing up. She walked to the window. Outside, the Leviathan dominated the sky, a swirling bruise of purple and ochre. "Goodman's paradox assumes time is a fixed container. But here, the *definition* of the epoch determines the truth conditions of the biological law."

  She turned back to him. "If I adopt UTC, the law becomes: 'All specimens are green before $t_{UTC}$.' But since the physical trigger is local, the predicate 'green before $t_{UTC}$' is actually a disjunction. It means 'green before the shadow hits, which happens to correlate with $t_{UTC}$ roughly.' It's a gerrymandered predicate. It's 'Grue' disguised as standard time."

  "And if you use Local Time?" Kael asked.

  "Then the law is projectible for us, here," Voss said. "But it's untranslatable to Command. To them, 'Local Cycle 50' is a variable. It drifts. If Command sends automated harvesters programmed to UTC, they'll arrive at Hour 1,190 expecting green plants. They'll find blue ones. The harvesters will fail. The settlers will starve."

  "So use UTC," Kael said, slamming his mug down. "Force the reality to fit the clock. We calibrate the harvesters to the UTC prediction. We know the drift. We compensate."

  "You're missing the point," Voss said, feeling the familiar cold dread of the seminar room creeping into her gut. "There is no 'compensating.' You're asking me to state a law of nature. A law is supposed to be mind-independent. It's supposed to be true regardless of how we measure it."

  "Nothing is true regardless of how we measure it," Kael snapped. "That's engineering 101. Measurement *creates* the interface."

  "But does it create the *fact*?" Voss pressed. "If I write the manual in UTC, I am asserting that the metabolic shift is a function of Earth time. I am smuggling Earth into the biology of an alien moon. If I write it in Local Time, I am asserting the biology is tied to the Leviathan. Both cannot be the 'true' law. One is a projection."

  "Who cares?" Kael shouted, his patience fracturing. "They both predict the color change! The plants turn blue either way. What difference does the label on the axis make?"

  "The difference is whether there is a fact of the matter about *why* they turn blue," Voss said quietly. "If I use UTC, I'm treating the shift as an event on a human timeline. If I use Local, I'm treating it as an event in a causal nexus. If I choose UTC, I'm lying about the causality to save the compatibility."

  She looked back at the datapad. The cursor blinked at the end of *Epoch 50*.

  "If I sign this," Voss said, "I'm not just describing the plants. I'm choosing which universe we live in. In the UTC universe, the plants are 'Grue'—they follow a weird, disjunctive rule that happens to align with our clocks for a bit. In the Local universe, they are 'Green'—they follow a natural kind until a physical trigger trips."

  "Then choose the Local one," Kael said.

  "Command won't accept it. Their systems lock to UTC. If the manual says 'Cycle 50' and their computers read 'Hour 1,200', the automation overrides the manual. They'll trust the clock over the biology."

  "Then teach the computers," Kael said.

  "I can't teach the computers metaphysics, Kael. I can only give them parameters." Voss sat back down. Her hands were shaking slightly. "Don't you see the horror? We think induction is about projecting past observations into the future. But we're not projecting into *the* future. We're projecting into *a* future defined by the vocabulary we use to describe it."

  She highlighted *Epoch 50*.

  "If I define Epoch by UTC, the generalization 'All specimens are green before Epoch 50' is false, because some specimens will turn blue at Hour 1,185. But if I define Epoch by Local Cycle, the generalization is true. The truth value of the biological law depends on the convention of the timekeeping protocol."

  Kael sighed, the anger draining out of him, replaced by exhaustion. "So there is no true law."

  "There is a true causal mechanism," Voss said. "The magnetospheric pulse triggers the enzymatic shift. But a *law* is a linguistic formulation. And the formulation is relative to the framework. There is no 'view from nowhere' where I can write the law without choosing a clock. And choosing the clock chooses the truth."

  Kael walked over to the window, looking out at the swirling giant. "So what do you do?"

  "I have to write the manual," Voss said. "People need to know when to harvest."

  "So pick UTC. It's the lingua franca. It's the tool we have."

  "And admit that our science is just a pragmatic fiction?" Voss asked. "That we aren't discovering nature, but forcing it into a grid so we can survive it?"

  "Isn't that what we've always done?" Kael asked softly. "Newton didn't discover gravity; he gave us a math that worked for ships. Einstein didn't find time; he gave us a math that worked for light. We're not priests, Elara. We're settlers."

  Voss looked at the plants. They were still green. For now. In fourteen hours, according to the Leviathan, they would turn blue. In twenty-eight hours, according to Earth, they would turn blue.

  If she wrote UTC, the manual would be technically false regarding the causality, but operationally safe if the engineers patched the drift.
  If she wrote Local, the manual would be causally true, but operationally dangerous if Command ignored the conversion.

  She realized then that the Grue paradox wasn't about emeralds. It was about survival. It was about the moment you realize that to predict the world, you have to simplify it, and in simplifying it, you lose the thing you were trying to save.

  "Hand me the stylus," Voss said.

  Kael passed it to her.

  She deleted *Epoch 50*.

  She typed: *All specimens exhibit green-spectrum reflectance until cumulative magnetospheric exposure reaches 50 units (approx. 1,185.9 UTC hours). Transition to blue is immediate thereafter.*

  "It's clunky," Kael said.

  "It's honest," Voss replied. "It admits the translation loss."

  "Command will reject it. They want binary parameters."

  "Then let them reject it," Voss said, signing her name at the bottom. The digital ink settled. "If they want a universe where Earth time rules alien biology, they can write their own manual. I'm writing for the people who have to live here."

  She looked at the readout. The law was drafted. It was no longer a universal truth. It was a bridge between two incompatible ways of counting time. It was stable only so long as everyone agreed to walk across it without looking down.

  "Green until 50," Kael murmured, reading the summary. "Sounds simple."

  "It's not simple," Voss said, watching the leaves under the lamp. "It's just the only thing we have."

  Outside, the Leviathan shifted, casting a deeper shadow over the hab. The clock on the wall ticked forward, one Earth second at a time, counting down to a change that had already happened in local time. Voss wondered if the plants knew the difference. She suspected they didn't. Only the humans were trapped in the paradox.
