prompt: |-
  I'm the research director for a constitutional reform commission in a mid-sized parliamentary democracy. The commission's mandate is to draft, within two years, a proposal for adding a sortition-based chamber to the legislature — a few hundred citizens selected by lot, most likely serving a single non-renewable term — alongside the existing elected chamber. We have money to commission roughly a dozen academic studies over the next eighteen months. My question is not whether sortition is a good idea, but which open questions we most need answered to produce a workable design, and in what order.

  Please rank the research questions you would have us fund, and defend the ordering. The open questions I'm already aware of include the following, but you should add others if you think they matter more:

  1. Self-selection. A lottery only delivers descriptive representativeness if the people drawn actually serve. If acceptance is voluntary and correlates with education, income, and civic engagement, the chamber is biased before deliberation begins. What compensation levels, duty framing (jury-style compulsion versus invitation), and opt-out designs best preserve the representativeness that is sortition's main selling point?

  2. Facilitation and agenda capture. Members serve briefly and cannot accumulate expertise, so professional staff, facilitators, and expert briefers may end up exercising the real power. Is there any institutional arrangement that secures informed judgment without a permanent unelected elite effectively doing the thinking for a rotating amateur membership?

  3. Mandate design. The chamber could hold binding legislative power, agenda-setting power only, or a veto over the elected chamber. How does each allocation make the other problems — capture, legitimacy, self-selection — better or worse?

  4. Term limits and professionalization. The anti-career-politician case for sortition assumes the one-term lottery member is a virtue. But does a chamber of perpetual amateurs merely relocate career-politician pathologies to whichever actors are permanent: staff, parties, the civil service?

  5. Legitimacy. Does a body nobody chose have the standing to make binding law, and does the answer change once citizens have lived experience with its output?

  For each item you would fund, explain what makes it upstream of the others, how tractable it is within eighteen months (e.g., through mini-public pilots, survey experiments, or natural experiments such as jury service), and what evidence would move it up or down your list. Equally important, tell me which of these you would deliberately refuse to fund, and why — either because the answer would not change the design, or because it is a question for political philosophers to argue about for the next thirty years rather than one the commission's timeline can resolve.
reasoning: |-
  Here's a thinking process that leads to the recommended research agenda:

  1.  **Analyze the Request:**
      *   **Role:** Research Director for a Constitutional Reform Commission.
      *   **Context:** Mid-sized parliamentary democracy, 2-year timeline for proposal, 18-month research window.
      *   **Task:** Rank roughly a dozen academic studies/research questions to inform the design of a sortition-based chamber (Citizens' Assembly/House of Lords equivalent).
      *   **Constraints:** Must address workability/design, not normative validity ("not whether sortition is a good idea"). Must prioritize based on upstream dependency, tractability (18 months), and impact on design. Must explicitly state what *not* to fund.
      *   **Input:** User provided 5 existing questions (Self-selection, Facilitation/Capture, Mandate, Term Limits, Legitimacy). I need to add others if necessary and rank them.

  2.  **Deconstruct the Problem:**
      *   The goal is a *workable design*. This means institutional engineering, not just political theory.
      *   The timeline is tight (18 months for research, 2 years total). Longitudinal studies are out. Comparative historical analysis is slow. Experiments and simulations are in.
      *   The biggest risk is creating a chamber that either doesn't work (gridlock, capture) or isn't accepted (legitimacy crisis).
      *   "Upstream" means: If Question A isn't answered, answering Question B is meaningless.
      *   "Tractable" means: Can we get data in 18 months? (Yes: Surveys, Deliberative Polls, Institutional Modeling, Comparative Case Studies).

  3.  **Evaluate the User's Provided Questions:**
      *   1. *Self-selection:* Critical. If the pool is biased, the whole premise fails. High priority.
      *   2. *Facilitation/Capture:* Critical. If staff rule, it's a sham. High priority.
      *   3. *Mandate Design:* Critical. Defines power dynamics. High priority.
      *   4. *Term Limits/Professionalization:* Important, but secondary to whether the chamber functions at all.
      *   5. *Legitimacy:* Tricky. Philosophical legitimacy is endless. *Perceived* legitimacy is measurable. Needs reframing.

  4.  **Identify Missing Questions:**
      *   *Interaction with Existing Legislature:* How do elected MPs react? Sabotage? Cooperation? This is a political reality check.
      *   *Scope of Competence:* What issues can they handle? Budget? Foreign Policy? Social issues?
      *   *Logistics/Cost:* Practicality.
      *   *Recruitment Mechanics:* The actual math of the lottery (stratification).
      *   *Deliberative Quality:* Can they actually understand complex bills?

  5.  **Develop the Ranking Strategy (The "Upstream" Logic):**
      *   *Tier 1: Existence & Composition.* (Can we get a representative group, and will they be allowed to function?)
      *   *Tier 2: Internal Functioning.* (Once they are there, how do they decide?)
      *   *Tier 3: External Interface.* (How do they interact with the elected house and public?)
      *   *Tier 4: Normative/Long-term.* (Philosophical justification, long-term stability).

  6.  **Drafting the Research Agenda (Iterative Process):**

      *   *Top Priority:* **Recruitment & Retention (Self-Selection).** If you can't get a representative sample, stop. Nothing else matters. *Method:* Field experiments with summonses (like jury duty).
      *   *Second Priority:* **Power Dynamics (Mandate).** Before designing the internal process, we need to know what they are *doing*. Veto? Advisory? Revision? This dictates the stakes for capture and legitimacy. *Method:* Comparative institutional analysis + Game theory modeling.
      *   *Third Priority:* **Bureaucratic Capture (Facilitation).** If the mandate is real, who writes the briefs? *Method:* Simulation/Role-play with controlled information asymmetry.
      *   *Fourth Priority:* **Legislative Interaction.** Will the elected house ignore them? *Method:* Elite interviews + Survey of current MPs.
      *   *Fifth Priority:* **Public Perception (Legitimacy).** Not "is it legitimate?" but "will people accept it?" *Method:* Survey experiments (vignettes).

      *   *What to Cut/Deprioritize:*
          *   Pure political philosophy on legitimacy (too abstract).
          *   Long-term career pathologies (hard to measure in 18 months, speculative).
          *   Cost/Benefit analysis (usually secondary to constitutional principle, though logistics matter).

  7.  **Refining the List to ~12 Studies:**
      *   Need to group the user's 5 points into broader research streams and add specific methodological studies.
      *   Let's create specific "Study Titles" to make it concrete.

      *   *Cluster 1: The People (Recruitment)*
          1.  Summons vs. Invitation (Field Experiment).
          2.  Stratification Math (Statistical Modeling).
          3.  Support Structures for Members (Childcare, etc.) (Pilot).

      *   *Cluster 2: The Power (Mandate & Interaction)*
          4.  Veto vs. Delay vs. Amend (Game Theory/Modeling).
          5.  Elected House Reaction (Elite Survey/Interviews).
          6.  Constitutional Conflict Resolution (Legal Analysis).

      *   *Cluster 3: The Process (Internal Function)*
          7.  Staff Influence/Epistemic Capture (Simulation).
          8.  Deliberative Competence on Complex Tech/Finance (Pilot).
          9.  Agenda Setting Control (Procedural Design).

      *   *Cluster 4: The Public (Acceptance)*
          10. Perceived Legitimacy (Survey Experiment).
          11. Media Framing Effects (Media Analysis/Experiment).

      *   *Cluster 5: The "Don't Fund"*
          12. Normative Democratic Theory (Philosophy).
          13. Long-term Career Effects (Speculative).

  8.  **Ordering and Justification:**
      *   *Recruitment* is #1 because without a representative body, it's not sortition.
      *   *Mandate* is #2 because it defines the stakes for capture and legitimacy.
      *   *Capture* is #3 because it determines if the mandate is exercised authentically.
      *   *Interaction* is #4 because a chamber that causes gridlock is a failed design.
      *   *Legitimacy* is #5 because it's about public buy-in for the specific design chosen above.

  9.  **Addressing the "Don't Fund" Section:**
      *   Must be firm. No "Is sortition democratic?" debates. No 50-year projections.

  10. **Review against Constraints:**
      *   18-month tractability? Yes, mostly experiments and comparative analysis.
      *   Mid-sized parliamentary democracy context? Keep in mind (e.g., party discipline is strong).
      *   Tone: Professional, strategic, directive.

  11. **Final Polish:**
      *   Ensure the distinction between *normative* legitimacy (philosophy) and *sociological* legitimacy (acceptance) is clear.
      *   Make sure the "Upstream" logic is explicit in every ranking.
      *   Check that the user's original 5 points are integrated.

      *(Self-Correction during drafting)*: I initially thought about putting Legitimacy higher. But if the design is flawed (e.g., biased recruitment), legitimacy is moot. Legitimacy depends on the *output* of the design choices. So it must come after the design parameters are tested.
      *(Self-Correction on Mandate)*: Mandate is actually very upstream. If the mandate is weak, capture matters less. If the mandate is strong, capture matters more. However, you can't test recruitment without knowing the burden of the mandate. Actually, Recruitment is the most fundamental physical constraint. You can't have a chamber without members. Mandate is the political constraint. I will keep Recruitment #1 because if you can't solve the "who" problem, the "what power" problem is academic.

      *Wait, let's reconsider Mandate vs. Recruitment.*
      If the mandate is purely advisory, self-selection bias matters less (it's just a poll). If the mandate is binding, self-selection bias matters immensely. Therefore, **Mandate** determines the *requirements* for Recruitment.
      *However*, from a practical implementation standpoint, if you cannot recruit a representative sample *at all*, you cannot implement *any* mandate.
      *Decision:* I will rank **Recruitment/Self-Selection** first because it is the primary point of failure for sortition projects historically. But I will link it tightly to Mandate. Actually, looking at the prompt's "Upstream" requirement: The Mandate defines the *risk* of the other variables. But Recruitment defines the *possibility*. I'll stick with Recruitment as #1 because it's the "go/no-go" on the mechanism itself.
      *Wait, better logic:* The Commission's goal is a *proposal*. To propose a design, you need to know what powers you are asking for (Mandate) to know what kind of members you need (Recruitment). But usually, the *promise* of sortition is representativeness. If you can't deliver that, the mandate is irrelevant. Okay, I will prioritize **Recruitment** as the foundational technical hurdle, but **Mandate** as the foundational political hurdle. I'll place Recruitment #1 because it's the most empirically tractable in 18 months (field experiments) whereas Mandate involves high-stakes political negotiation simulation.
      *Actually, let's look at the "Upstream" definition again.* "What makes it upstream of the others."
      If you don't know the Mandate, you don't know how hard to fight for Recruitment.
      BUT, if you can't solve Recruitment, Mandate is moot.
      Let's group them.
      1. Recruitment (The Input)
      2. Internal Process/Capture (The Throughput)
      3. Mandate/Interaction (The Output)
      4. Legitimacy (The Environment)
      This flows logically.

      *Refining the "Don't Fund":* Be specific. "Normative Democratic Theory" is the big one. "Long-term Systemic Stability" is another (too speculative).

      *Adding missing questions:*
      - **Inter-chamber conflict resolution:** What happens when they disagree?
      - **Scope of Jurisdiction:** Can they touch the budget? (Crucial in parliamentary systems).
      - **Party Interaction:** How do parties treat lotto-members?

      *Let's finalize the 12 studies.*
      1. Summons Compliance (Field Exp)
      2. Stratification Algorithms (Statistical)
      3. Member Support/Retention (Pilot)
      4. Epistemic Capture (Simulation)
      5. Agenda Control (Procedural)
      6. Legislative Conflict (Game Theory)
      7. Budgetary Competence (Pilot)
      8. MP Attitudes (Survey)
      9. Public Acceptance (Survey Exp)
      10. Media Framing (Exp)
      11. Constitutional Amendment Pathways (Legal)
      12. Transition Logistics (Operational)

      *Wait, I need to make sure I address the User's 5 points specifically.*
      1. Self-selection -> Studies 1, 2, 3.
      2. Facilitation -> Studies 4, 5.
      3. Mandate -> Studies 6, 7, 11.
      4. Term Limits -> Implicit in design, maybe not a separate study needed if single term is assumed. I'll merge this into "Professionalization risk" in Study 4.
      5. Legitimacy -> Studies 9, 10.

      *Okay, ready to write.*
answer: |-
  This is a high-stakes institutional engineering challenge. Your timeline (18 months for research) is tight for constitutional questions but sufficient for empirical institutional design. The key is to distinguish between **normative questions** (what *should* be) and **mechanical questions** (what *works*).

  Your commission's success depends on avoiding the "Black Box" problem: proposing a chamber that looks good on paper but fails due to unanticipated human or political behaviors.

  Here is the ranked research agenda, ordered by upstream dependency. If Question #1 is not resolved, the answers to #2–12 are largely irrelevant.

  ### Tier 1: The Input (Feasibility of Representativeness)
  *If you cannot populate the chamber representatively, the rest of the design is academic.*

  **1. Study: The Economics and Psychology of Summons Compliance**
  *   **Addresses:** Your Point #1 (Self-selection).
  *   **The Question:** What specific combination of financial compensation, legal compulsion (summons vs. invitation), and social framing minimizes the correlation between acceptance and socioeconomic status?
  *   **Why Upstream:** Descriptive representativeness is the sole unique selling point of sortition. If the chamber skews wealthy/educated due to voluntary opt-in, it is indistinguishable from a biased elected body, undermining the rationale for the reform.
  *   **Tractability (18 Months):** High. Conduct randomized field experiments in municipalities with existing jury or advisory board systems. Test different summons language and compensation tiers.
  *   **Evidence to Shift Ranking:** If pilots show that even with high pay and compulsion, marginalized groups opt out at >40% rates, this moves from a design problem to a fatal flaw, potentially halting the project.

  **2. Study: Stratification Algorithms and Demographic Trade-offs**
  *   **Addresses:** Your Point #1 (Self-selection) + Logistics.
  *   **The Question:** Given inevitable attrition and opt-outs, what mathematical stratification criteria (age, gender, region, education, income) best preserve a "microcosm" without creating unmanageable internal conflict or tokenism?
  *   **Why Upstream:** You need to know the selection rules before you can design the internal processes. Over-stratification can create a chamber of interest-group delegates rather than citizens.
  *   **Tractability:** High. Statistical modeling using census data and simulation of attrition rates based on Study #1.

  **3. Study: Member Support Structures and Attrition Drivers**
  *   **Addresses:** Your Point #4 (Term Limits/Professionalization).
  *   **The Question:** What non-financial barriers (childcare, elder care, employer retaliation) cause dropout, and does mitigating them create a "professional citizen" class even within a single term?
  *   **Why Upstream:** High attrition mid-term forces replacements, breaking the "lottery" integrity. Excessive support risks creating a pampered elite detached from daily life.
  *   **Tractability:** Medium. Qualitative interviews with past jury/citizen assembly participants and pilot support programs.

  ### Tier 2: The Throughput (Internal Function & Capture)
  *Once you have the people, can they actually decide without being ruled by staff?*

  **4. Study: Epistemic Capture and Staff Influence Simulations**
  *   **Addresses:** Your Point #2 (Facilitation/Capture).
  *   **The Question:** In simulated legislative sessions, how much does the framing of expert briefs by permanent staff influence voting outcomes compared to peer deliberation? Can "red team" briefers mitigate this?
  *   **Why Upstream:** If staff effectively write the laws, the chamber is a sham. You must design the staffing structure (e.g., members hire their own experts, or staff are civil-service neutral) before defining the chamber's powers.
  *   **Tractability:** High. Deliberative polling experiments where information framing is the controlled variable.
  *   **Evidence to Shift Ranking:** If simulations show that expert framing determines >80% of outcomes regardless of member composition, you must redesign the mandate to be advisory only (downgrading Point #3).

  **5. Study: Agenda-Setting Control Mechanisms**
  *   **Addresses:** Your Point #2 (Facilitation) & #3 (Mandate).
  *   **The Question:** Who decides what the chamber deliberates? Does the chamber self-select topics, or are they referred by the elected house? How does this affect engagement and perceived utility?
  *   **Why Upstream:** A chamber that chooses its own agenda may become populist or irrelevant. A chamber that only reviews what it is sent may become a rubber stamp. This defines the workflow.
  *   **Tractability:** Medium. Comparative analysis of existing bicameral systems and citizen assemblies (e.g., Ireland, France).

  **6. Study: Deliberative Competence on Technical vs. Moral Issues**
  *   **Addresses:** Your Point #4 (Professionalization).
  *   **The Question:** Are randomly selected citizens capable of grasping complex budgetary/technical legislation within a reasonable timeframe, or must their jurisdiction be limited to values-based social policy?
  *   **Why Upstream:** This dictates the **Scope of Mandate**. If they cannot understand the budget, giving them budgetary veto power is dangerous.
  *   **Tractability:** High. Pilot "mini-publics" tasked with reviewing actual complex legislation, measuring comprehension and amendment quality.

  ### Tier 3: The Output (Power & Interaction)
  *How does this new body fit into the existing ecosystem?*

  **7. Study: Inter-Chamber Conflict Resolution Modeling**
  *   **Addresses:** Your Point #3 (Mandate).
  *   **The Question:** In a parliamentary system with strong party discipline, what happens when the Sortition Chamber rejects a Government bill? Does it trigger elections, a joint session, or a delay? Which mechanism minimizes gridlock?
  *   **Why Upstream:** You cannot define the mandate without a conflict resolution mechanism. Unlimited veto power in a parliamentary system can cause constitutional crisis.
  *   **Tractability:** Medium. Game-theoretic modeling of legislative bargaining + expert interviews with constitutional lawyers.

  **8. Study: Elected Member (MP) Attitudes and Sabotage Risks**
  *   **Addresses:** Your Point #3 (Mandate) & #5 (Legitimacy).
  *   **The Question:** How do current elected representatives perceive a sortition chamber? Is there a risk of legislative sabotage, underfunding, or ignoring the chamber's output?
  *   **Why Upstream:** A design that the elected house refuses to cooperate with is dead on arrival. You may need to design the chamber as a partner rather than a rival to ensure passage.
  *   **Tractability:** High. Anonymous surveys and interviews with current MPs and party strategists.

  **9. Study: Jurisdictional Scope (The "Budget Question")**
  *   **Addresses:** Your Point #3 (Mandate).
  *   **The Question:** Should the chamber have power over taxation and spending? If not, is it merely a consultative ethics board?
  *   **Why Upstream:** Power over the purse is the core of parliamentary sovereignty. Excluding it limits the chamber's utility; including it risks economic instability.
  *   **Tractability:** Medium. Economic impact analysis of similar proposals in other jurisdictions.

  ### Tier 4: The Environment (Legitimacy & Acceptance)
  *Will the public and media accept the output?*

  **10. Study: Sociological Legitimacy and Trust Experiments**
  *   **Addresses:** Your Point #5 (Legitimacy).
  *   **The Question:** Does the public trust laws passed by a sortition chamber *more* or *less* than elected laws? Does this change if the outcome contradicts their personal preference?
  *   **Why Upstream:** This validates the political investment. However, it is downstream because legitimacy depends on the *design* (e.g., a captured chamber will have low legitimacy).
  *   **Tractability:** High. Survey experiments presenting vignettes of laws passed by different body types.

  **11. Study: Media Framing and Narrative Control**
  *   **Addresses:** Your Point #5 (Legitimacy).
  *   **The Question:** How will partisan media frame the chamber? (e.g., "The People's House" vs. "Unelected Elites"). What transparency rules mitigate negative framing?
  *   **Why Upstream:** Media narrative will determine public acceptance more than the constitutional text.
  *   **Tractability:** Medium. Analysis of media coverage of recent citizen assemblies (e.g., Climate Assemblies).

  **12. Study: Transition Logistics and Constitutional Pathways**
  *   **Addresses:** Implementation.
  *   **The Question:** What is the legal pathway for adoption? Referendum? Supermajority? What are the transitional costs?
  *   **Why Upstream:** It is the final step. You need the design before you can cost the transition.
  *   **Tractability:** High. Legal review.

  ---

  ### What I Would Refuse to Fund (The "Do Not Fund" List)

  To stay within 18 months and focus on *workability*, you must explicitly exclude questions that are philosophically interesting but design-irrelevant.

  **1. Normative Democratic Theory ("Is Sortition Democratic?")**
  *   **Why:** This is a 30-year debate for political philosophers. Your commission's mandate is to *draft a proposal*, not to justify the concept of sortition from first principles. You are operating under the assumption that sortition is a valid tool. Funding this will result in papers that justify what you already decided to do or stall the process in abstract debate.
  *   **Exception:** Fund *sociological* legitimacy (Study #10), which measures public acceptance, not *philosophical* legitimacy.

  **2. Long-Term Systemic Stability ("Will this prevent populism in 50 years?")**
  *   **Why:** Untractable. No model can predict systemic political stability over decades. This invites speculation masquerading as data. Focus on immediate institutional interaction (Study #7 & #8).
  *   **Exception:** Historical analysis of bicameral friction is acceptable; future-casting is not.

  **3. The "Career Politician" Pathology (Deep Dive)**
  *   **Why:** You listed this as Point #4. While important, you have already assumed a single non-renewable term. Researching whether careerism is "bad" is normative. Researching whether *staff* become the careerists (Study #4) is mechanical. Fund the latter, not the former.

  **4. Comparative Case Studies of Non-Parliamentary Systems**
  *   **Why:** If you are a parliamentary democracy, studies on how sortition interacts with a Presidential/Congressional system (e.g., US state legislatures) have low transferability regarding party discipline and executive confidence. Focus resources on parliamentary contexts (e.g., UK, Ireland, Belgium, Nordic countries).

  ### Summary of Strategy

  1.  **Months 1–6:** Focus entirely on **Tier 1 (Recruitment)**. If you can't get the people, stop.
  2.  **Months 7–12:** Focus on **Tier 2 (Internal Process)**. Ensure they aren't puppets.
  3.  **Months 13–18:** Focus on **Tier 3 & 4 (Power & Legitimacy)**. Ensure the system accepts them and the public trusts them.

  This ordering ensures that you do not design a powerful chamber (Tier 3) that you cannot staff representatively (Tier 1), nor a representative chamber (Tier 1) that is easily captured by bureaucrats (Tier 2).
