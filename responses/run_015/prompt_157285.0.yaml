          *   *Dispersed Knowledge:* Hayek's "knowledge of time and place." Cybersyn tried to capture this via telex from factory floors. But did it capture *all* knowledge? Only quantifiable data. The VSM (Viable System Model) tried to preserve local autonomy (Systems 1-3 vs 4-5), which acknowledges dispersion, but the data flow was centralizing.
