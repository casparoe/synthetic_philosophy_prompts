  hey, I'm taking a formal epistemology seminar this fall and I have to turn in a two-page "where I stand" paper on imprecise credence by thursday, and while I was outlining it I started to suspect that the things I believe aren't actually one position — so I want someone to audit the package before I commit it to paper. Roughly where I've landed: (1) I think rationality sometimes *requires* an imprecise doxastic state, i.e. a set of probability functions (or just an interval on the propositions I care about) rather than one sharp number, and I think the usual Ellsberg-style preferences are rationally fine rather than a bias to be explained away. (2) I'm also a permissivist in the ordinary sense: two people with exactly the same total evidence can rationally come away with different credences and I don't think either of them is thereby defective. (3) On decision rules, I reject the maximin-style rule (maximize your worst case over the set) as absurdly conservative — it seems to forbid bets that are obviously fine — and I prefer the permissive rule on which an option is choice-worthy if it maximizes expected utility according to *some* function in your set and isn't beaten by something else. (4) On updating, I condition every function in the set on what I learn, and I've made peace with dilation: I'm fine with learning sometimes making my interval for a proposition strictly wider than it was. (5) I still want something like the Principal Principle — if I know the objective chance of E is 0.7, my credence in E had better be 0.7 — and my line is that imprecision is only ever called for where the chances are unknown, contested, or unstable. (6) I think there's higher-order imprecision as well: I can be genuinely unsure how imprecise I ought to be about something, the width of the interval itself can feel unset, and I'd like the framework to represent that rather than ignore it. (7) And meta: I want imprecise probabilism to be a genuine rival to Bayesianism, not Bayesian