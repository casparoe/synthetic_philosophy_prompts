answer: |-
  I've spent more hours than I care to admit in comment threads defending Nagel against the "but the dead kid matters" crowd. Here is the honest truth, from one philosopher to another: **The spec cannot be met.** Once you rigorously subtract (i) evidence, (ii) forward-looking utility, and (iii) agent-regret/special obligations, there is no "blameworthiness" residue left for resultant luck to attach to. However, per your instructions, I will brainstorm the best attempts available in the literature, select the strongest candidate, and then diagnose exactly where it collapses.

  ### The Candidates

  1.  **The Twin Speeders:** Two drivers exceed the limit by identical margins on identical roads. A child darts out unpredictably for Driver A, not Driver B. (Loses to: Too vulnerable to "outcome as evidence" of risk assessment; hard to stipulate the child's emergence is truly exogenous).
  2.  **The Twin Arsonists:** Two agents drop lit cigarettes in dry grass with identical wind conditions. A random gust hits Case A, causing a forest fire. (Loses to: Intuitively feels like "causal luck" rather than moral luck; the harm feels too disconnected from the agency).
  3.  **The Twin Architects:** Two sign off on identical code violations. An earthquake of statistically expected magnitude hits Building A, not Building B. (Loses to: Blame is too diffuse; hard to isolate individual blameworthiness from systemic liability).
  4.  **The Twin Anesthesiologists:** Two admins bypass a safety check to save time (identical negligence). Patient A has an undetectable, idiosyncratic reaction and dies; Patient B does not.

  ### The Best Attempt: The Twin Anesthesiologists

  **The Case:**
  Dr. A and Dr. B are equally trained anesthesiologists working in adjacent theaters. Both are fatigued but assess themselves as fit. Both skip a mandatory secondary calibration check on their vaporizers to save three minutes, violating hospital protocol; both know this introduces a precise, quantified 0.05% risk of fatal dosage error, which they both accept as "worth it" to finish on time. Their mental states, character, and actions are identical. In Theater 1, the vaporizer malfunctions due to a microscopic manufacturing defect undetectable by the skipped check, and the patient dies. In Theater 2, the vaporizer holds, and the patient lives. No one else ever learns of the skipped check (fixing forward-looking effects). Dr. A admits she deserves harsher punishment than Dr. B, and third parties feel greater resentment toward Dr. A.

  **Why the Others Lost:**
  The Speeders case is too messy; a child darting out is often read as evidence that the road was *more dangerous than the driver thought*, violating (i). The Arsonists case triggers "causal luck" intuitions where the harm feels like bad fortune rather than moral failure. The Architects case dilutes individual agency into collective liability. The Anesthesiologists case is the strongest because the risk is *quantified and known* (beating (i) initially), the setting is intimate (beating (iii) confusion with systemic liability), and the negligence is clear.

  ### Diagnosis of Collapse

  Despite being the strongest candidate, this case fails to meet your spec. It collapses on **(iii) The "That's Not Blame" Move**, with secondary leakage on **(i) Outcome-as-Evidence**.

  **1. The Failure of (iii):**
  You asked for a marker that the extra thing is *blame-shaped*. In the case, Dr. A takes herself to deserve more punishment and feels greater resentment. But is this *fitting*? Most rigorous theories (Wolf, Zimmerman) argue this is a conflation of **blameworthiness** (a backward-looking property of the agent's will) with **liability** (what you owe the world) and **agent-regret** (Williams).
  *   *The Marker:* Dr. A owes compensation to Patient A's family that she does not owe Patient B's family. She also feels a specific agony (agent-regret) that Dr. B does not.
  *   *The Collapse:* Once you strip away the duty to compensate (liability) and the special feeling of regret for *being* the cause (agent-regret), is there any *blame* left? If we put both doctors in a vacuum where no compensation is possible and no one knows (fixing (ii)), does Dr. A *deserve* more internal guilt? The intuition that she does is usually sustained by smuggling in the fact that she *killed* someone. But if the killing was 0.05% luck, the "killing" isn't a reflection of her will. The "extra blame" is actually just the pain of having caused harm, which is not the same as being more morally corrupt.

  **2. The Leakage on (i):**
  Even with quantified risk, the death functions as evidence. If Dr. A's patient dies, we retroactively suspect her fatigue was worse, or her assessment of "fit to work" was more flawed than Dr. B's. To truly fix (i), you need a perfect stipulation that their internal states were *atomically* identical, which is metaphysically possible but epistemically inaccessible. In any real-world assessment (which blame is), the outcome *must* update our credence about the quality of the will, violating the "known beforehand" constraint.

  ### CP vs. The "Hooked" View

  *   **Control Principle (CP):** Blameworthiness is determined at the moment of the voluntary choice/risk imposition. Since Dr. A and Dr. B made the same choice with the same knowledge, they are equally blameworthy. The death is a tragedy, not a moral differentiator. The extra burden Dr. A feels is regret, not guilt.
  *   **Resultant Luck View ("You're on the Hook"):** Morality is about how you navigate the actual world, not just your internal menu. Dr. A violated a duty *not to kill*; Dr. B only violated a duty *not to risk*. Since the duties are different, the blameworthiness is different.

  **The Working Feature:**
  The single feature doing the work in the Anti-CP view is **the definition of the wrongdoing**. If the wrong is "risking harm," CP wins. If the wrong is "causing harm," Anti-CP wins.
  *   *If you delete it:* If you stipulate the wrong is *only* the risk imposition, the blameworthiness equalizes immediately.
  *   *CP Defender's Attack:* The CP defender argues that defining the wrong as "causing harm" makes moral status dependent on the world's cooperation, which is arbitrary. They will argue that Dr. A's "extra blame" is actually just the *cost* of being the instrument of harm, not a measure of her moral failure.

  ### Confidence & Defeaters

  **Confidence Level:** 90% that the spec cannot be met.
  I am confident that once you rigorously separate (i) evidence, (ii) consequences, and (iii) regret/liability, the concept of "blameworthiness" evaporates in cases of resultant luck. The intuition that Dr. A is worse is sustained by an inability to cleanly separate *feeling bad about causing death* from *being more blameworthy*.

  **What Would Change My Mind:**
  I would be convinced if a theory could demonstrate that **moral obligations are essentially relational** in a way that *constitutes* the agent's moral status. If it could be shown that Dr. A's relationship with the victim's family *creates* a new moral fact about Dr. A's character that Dr. B literally does not possess (beyond just having different duties), then resultant luck would be real. Specifically, an argument showing that "being the cause of death" alters the *quality of will* retrospectively (not just the evaluation of it) would defeat my diagnosis. Until then, the difference is residue, not responsibility.
