answer: |-
  Your observation is remarkably astute and cuts to the heart of contemporary political science debates. You have identified a mechanism that is distinct from, though deeply related to, the broader phenomenon of democratic backsliding. While there is no single, universally canonical term exclusively for this narrow mechanism—comparable to 'gerrymandering' or 'filibustering'—there is an emerging academic consensus around how to describe it.

  ### Is there a name for it?

  The closest established concept is **'Epistemic Backsliding'**. This term has gained traction in recent years (utilised by organisations such as the V-Dem Institute and scholars like Pippa Norris) to describe the decline in a society's capacity to produce and agree upon shared knowledge. However, you are correct that this term is often broader than your definition; it frequently encompasses media polarisation, the rise of conspiracy theories, and the erosion of trust in universities, not just the bureaucratic machinery of the state.

  Because existing terminology often bundles the *cultural* erosion of truth with the *institutional* capture of data bodies, there is not yet a fixed label that isolates the specific targeting of state data infrastructure. Therefore, to capture the precision of your insight, the most accurate term is a refinement: **'Epistemic Infrastructure Capture'**.

  ### How does it differ from ordinary institutional capture?

  Ordinary institutional capture (or state capture) is primarily about **power**: who gets to make decisions, award contracts, or enforce laws. It is about controlling the 'referee'.

  **Epistemic Infrastructure Capture** is about **reality**: who gets to define the facts upon which decisions are based. It is about controlling the 'scoreboard'.
  *   **Ordinary Capture:** A government appoints loyalists to the competition commission to stop antitrust cases against their donors.
  *   **Epistemic Capture:** A government restructures the national statistics office to change the methodology for calculating inflation, thereby altering the shared economic reality used to debate policy.

  The key distinction is that ordinary capture changes *who wins*; epistemic capture changes *what game is being played* by altering the metrics of success and failure.

  ### Defining the edges: Universities and State Data

  If we adopt **'Epistemic Infrastructure Capture'** as the precise term, the boundaries should be drawn around **state-certified factual authority**.

  *   **Core Cases (In):** National statistical institutes, election management bodies, supreme audit institutions, census bureaus, and public health data agencies. These bodies produce the 'official numbers' that constrain political debate.
  *   **Boundary Cases (Adjacent/Out):** Public universities and state media. While universities produce knowledge, they are not always certifiers of *state* reality (unless funding is tied to ideological compliance). State media distributes narratives but does not necessarily generate the raw data. These are often targets of *Epistemic Backsliding* broadly, but fall slightly outside the strict definition of *Infrastructure Capture* unless their data-generating functions are specifically compromised.
  *   **Out:** Private media or social media platforms. Attacks on these are part of information warfare, but not necessarily the capture of state bureaucratic infrastructure.

  ### Analytic utility vs. partisan risk

  This is a highly useful analytic category, but it carries significant partisan risk.

  **Utility:** It allows analysts to move beyond vague accusations of 'lying' to specific examinations of methodology, independence, and transparency. It shifts the debate from 'are these numbers true?' to 'was the process used to generate these numbers independent?' This makes it possible to measure backsliding objectively (e.g., tracking changes in statistical law or the dismissal of chief statisticians).

  **Partisan Risk:** The risk is high. In polarised environments, any inconvenient data is often dismissed by incumbents as 'biased' and by opponents as 'fabricated'. If the term is used loosely, it risks becoming a rhetorical weapon where every side claims the other is 'breaking the scoreboard'. To remain analytic rather than partisan, the label must be applied only when there is evidence of procedural interference (e.g., legal changes to appointment powers, suppression of methodology) rather than mere disagreement over results.

