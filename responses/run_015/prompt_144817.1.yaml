          *   Malcolm: Verificationist. No criterion for experience during sleep = no experience happened. Dream reports are expressions of current state, not records of past events.
          *   Dennett: Confabulationist/Narrative. Dream reports are constructed upon waking, not playback of a "movie" watched during sleep.
      *   **Task:** Write a short story.
      *   **Protagonist:** A sleep researcher.
      *   **Plot:** Using a hypothetical neural-decoding interface to test if a REM subject had a sequential experience or confabulated it.
      *   **Constraint 1:** Weave in the conceptual tension without resolving it.
      *   **Constraint 2:** Include one invented technical feature: "Retroactive Coherence Protocol" (or similar) that aligns neural traces with reported content *after* arousal.
      *   **Goal:** Force characters to question the justification of attributing unobservable experience to the sleeping brain.

