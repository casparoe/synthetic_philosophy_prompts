answer: |-
  The hum of the 7-Tesla scanner was the only sound in the control room, a low B-flat that seemed to vibrate in the marrow of Dr. Elena Vance's bones. On the monitor, Subject 42—Julian—was in deep REM. His eyes darted beneath closed lids, the classic rapid movement, but to Elena, they looked less like watching a movie and more like a cursor searching for a file that might not exist.

  "Theta waves are spiking in the hippocampus," Elena said, her voice low. "Visual cortex is lighting up. V1 through V4. It's a full sensory cascade."

  Beside her, Dr. Aris Thorne leaned back in his chair, spinning a pen between his fingers. Thorne was a neurologist by trade, but lately, he had become the lab's resident skeptic, channeling the ghosts of mid-century philosophy. "Activation is not experience, Elena. You know the drill. A spinal reflex fires without pain. Why must a visual cortex fire without sight?"

  "Because he'll tell us he saw something when he wakes up," Elena countered, tapping the keyboard. The Mnemosyne Array, their hypothetical neural-decoding interface, was primed. It didn't just read blood flow; it mapped semantic vectors to activation patterns.

  "That's the crux, isn't it?" Thorne said. "Malcolm would say we have no criterion for an experience occurring *then*. We only have the report *now*. If he doesn't wake up, the dream didn't happen. The sleep is a void."

  "And Dennett?" Elena asked, though she knew the answer.

  "Dennett would say the memory is written *at the moment of telling*," Thorne replied. "A narrative construction. The brain grabs the chaotic noise of REM, waits for the alarm clock, and stitches a story to explain the arousal. The 'dream' is the story, not the sleep."

  Elena ignored him, focusing on the screen. This was why they had built the Retroactive Coherence Protocol (RCP). Standard decoding tried to predict content in real-time, a method plagued by noise. The RCP took a different, more controversial approach. It stored the raw, uninterpreted neural data during sleep in a buffer. It did not attempt to decode the experience until *after* the subject aroused and provided a verbal report. Only then did the protocol scan the stored neural traces, looking for isomorphic patterns that matched the semantics of the spoken words.

  "Julian is entering spontaneous arousal," Elena noted.

  On the screen, Julian's limbs twitched. He groaned, the sound crackling over the intercom. He sat up, disoriented, the classic fog of sleep inertia clouding his eyes.

  "Julian," Elena's voice came through the speaker. "Tell us what you were experiencing just before you woke."

  Julian rubbed his face. "It was... vivid. I was standing on a bridge. Iron. Cold to the touch. Below me, water. Black, moving fast. I was looking for someone."

  Elena hit *Execute*.

  The RCP engaged. On the secondary monitor, lines of code scrolled rapidly. The system took Julian's words—*bridge, iron, cold, water, black, searching*—and converted them into a query vector. It then dove into the buffered neural data from the preceding twenty minutes.

  "If the experience was real," Elena whispered, "the trace should be there, independent of the words. The words are just the key to unlock the room."

  "And if the room is built by the key?" Thorne asked softly.

  The screen flickered. A progress bar filled. *Matching Semantic Topography to Neural Residue...*

  This was the danger of the RCP. Because it waited for the report, it was vulnerable to the very confabulation Dennett warned of. If the brain creates the memory upon waking, the RCP would simply find the neural correlates of *remembering the story*, not *living the dream*. It would validate the confabulation as if it were the event.

  "Look," Elena said, pointing.

  The visualization rendered a 3D map of Julian's brain activity during the REM phase. Overlaid on it was the semantic structure of his report. They aligned with disturbing precision. The concept of "cold" matched somatosensory spikes in the parietal lobe. "Black water" correlated with specific inhibitory patterns in the color-processing regions. The "searching" matched the prefrontal goal-state loops.

  " ninety-eight percent coherence," Elena said. "It's a match, Aris. He lived it. The trace was there."

  Thorne didn't look at the screen. He looked at Julian, who was now drinking water in the scanner, looking ordinary and human. "Run it again."

  "What?"

  "Change the report. Suppose Julian had said he was on a train. Suppose he was confused, or we prompted him. If we feed the RCP the word 'train', will it find a train in the noise?"

  "The algorithm has thresholds," Elena defended. "It can't force a match if the data isn't there."

  "Does the data exist before the query?" Thorne pressed. "Think about it, Elena. You're using a verificationist tool to prove realism. But the tool only verifies what is reported. If Malcolm is right, there is no 'there' there until he speaks. If Dennett is right, the speaking creates the 'there'. Your machine aligns the neural noise to the narrative *after the fact*. It's a self-fulfilling prophecy written in fMRI contrast."

  Elena stared at the glowing map. It was beautiful. It looked like a mind. It looked like a life lived in the dark. But Thorne's question hung in the air, heavier than the magnetic field.

  The RCP had found the bridge because Julian said there was a bridge. But had the bridge existed in the dark, or did the light of the waking word conjure it from the static?

  "Run the control," Elena said quietly. "Scramble the semantic vector. Feed it nonsense."

  Thorne typed the command. The system ran the nonsense query against the same REM data. The progress bar moved. A match appeared. It was less coherent, only sixty percent, but the system still found patterns. It still aligned the noise to the input.

  "It finds structure because it's designed to find structure," Thorne said. "The brain is a pattern generator. It will always produce something that looks like a dream if you ask it to show you a dream."

  Elena reached for the keyboard to shut down the sequence, but she paused. On the main monitor, Julian's neural map from the REM phase pulsed gently, a ghostly rhythm of a life unlived.

  "If we turn off the machine," Elena said, "and we assume he didn't dream because we can't verify it... we lose the phenomenon. We reduce him to a biological clock."

  "And if we assume he did dream because the machine says so," Thorne countered, "we might be mistaking the map for the territory. We are attributing an unobservable experience to the sleeping brain based on a protocol that relies on the waking tongue."

  They sat in the silence of the control room. The scanner hummed its B-flat. Julian was gone, heading home to a breakfast he would remember, a sleep he would forget. The data remained on the drive, a perfect, high-resolution record of a bridge over black water. It was empirically robust. It was philosophically hollow.

  Elena saved the file. She labeled it *Dream_Sequence_042*.

  She knew that tomorrow, she would publish the coherence stats. She knew the world would read it as proof that dreams are real events. But as she watched the screen saver bounce silently across the black monitor, she wondered if they had merely built a better machine for listening to the stories we tell ourselves, or if they had finally found a way to hear the silence speak.

  "Same time tomorrow?" Thorne asked, standing up.

  Elena looked at the empty scanner bed. "Yes. We have to check if the protocol holds."

  "Or," Thorne said, opening the door, "we have to check if we can sleep without wondering if we're dreaming the data."

  He left. Elena turned off the console. The room went dark, save for the standby light on the Mnemosyne Array, blinking like an eye that refused to close, watching nothing, recording everything.
