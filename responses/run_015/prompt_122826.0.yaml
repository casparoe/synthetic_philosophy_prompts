answer: |-
  This is a sharp stress test. Nixon's closure of the gold window isn't just economic history; it's a metaphysical pivot point. Here is the mapping you asked for, keeping the theories distinct and the questions apart.

  **1. Disciplined Mapping**
  On the **status-function view**, the dollar before 1971 was a composite status: it counted as money *because* it counted as a claim on gold. The constitutive rule was layered. After August 1971, the bottom layer vanished. The dollar remained a status function, but its grounding shifted from "convertible liability" to "fiat object." The theory predicts instability during the shift (which we saw), but silence on why the status didn't collapse entirely.
  The **coordination equilibrium view** sees money as a solution to a matching problem. Before 1971, gold convertibility was a focal point stabilizing the equilibrium. Removing it risked pushing agents toward a different equilibrium (barter, foreign currency). That it didn't suggests the network effects were strong enough to sustain the old equilibrium even without the gold anchor.
  The **Chartalist view** barely registers the change. Money is a state-created unit for discharging tax liabilities. Whether the state promises gold or nothing is a policy detail, not an ontological shift. The dollar was state money before; it was state money after. This view predicts continuity (which happened) but is silent on why markets panicked if the essence didn't change.
  **Menger's emergence story** is largely irrelevant here. It explains how money arises from barter via saleability. By 1971, the dollar's saleability was entrenched. The theory predicts nothing about state decrees changing the nature of an already-established medium.

  **2. Genesis, Maintenance, Identity**
  1971 illuminates the **maintenance question** best. Whatever launched the dollar (genesis), what kept it alive on a Tuesday in 1976 wasn't gold (gone) but habit, tax obligation, or network inertia. 1971 shows maintenance can survive the removal of the original anchor.
  The **identity question** is the hardest. Is the 1972 dollar the same kind as the 1970 dollar? Legally, yes (continuity of name, legal tender laws). Metaphysically, arguably no (different constitutive rules). If social kinds are defined by their constitutive rules, the kind changed. If they are defined by historical continuity of usage, the kind persisted. Constructivism struggles here: it must choose between rule-individuation (different kind) and historical-individuation (same kind).
  The **genesis question** is untouched. 1971 was a modification, not a birth.

  **3. Constructed by Whom?**
  This is the critical tension. If "collective acceptance" is required, Nixon's unilateral move looks like a counterexample. But the constructivist can refine the agent set: not everyone needs to accept the rule, only those with the power to enforce or stabilize it (central banks, major traders, the state apparatus). The "collective" is hierarchical.
  Does this collapse into "power"? Not necessarily, but it concedes that construction is often top-down. The threshold for "enough people" is fixed by the existing institutional structure itself—a social fact. So, yes, "socially constructed" survives, but it means "constructed by the relevant authorized agents and acquiesced to by the rest," not "democratically agreed upon." The constructivist must admit that authority is a constitutive resource.

  **4. Where the Lens Breaks**
  Your first nagging point is correct: gold convertibility was itself a convention. Only central banks exercised it. So 1971 wasn't a shift from "real" to "fake" money, but from one convention to another. This episode is neutral between constructivism and the view that money is always a state liability. It doesn't prove constructivism; it just shows conventions are mutable.
  Your second point hits a limit. Constructivism explains *kind membership* (is this money?), not *value stability* (why does this money buy bread?). Weimar and Zimbabwe had fiat money (the kind existed) that lost value (the function failed). If the theory says "money is what we treat as money," it cannot explain why some things stop being treated as valuable money while remaining money. Admitting this is a defence (scope limitation), but it feels like a retreat if the theory claims to explain money's power.

  **5. Looping Effects**
  The analogy to Hacking's looping effects is structural and real. Classifying the dollar as fiat changes how agents behave (hedging, indexing to oil/gold), which changes the conditions under which the dollar functions as money.
  This predicts that the state's control over the kind is porous. Once users start pricing in external units (eurodollars, crypto, commodities), the state's definition drifts from the market's usage. 1971 wasn't just the state changing a rule; it was the state reacting to market behavior (gold runs) that threatened the kind's stability. The plain constructivist story misses this feedback loop: the classified object (money) reacts to the classification (fiat), constraining the classifier (the state). The state is less the author of the kind and more a manager of a reactive system.

  In sum: 1971 shows money is robustly social, but the "construction" is hierarchical, the identity is historically sticky despite rule changes, and the state's authority is constrained by the looping reactions of the users it claims to represent.
