  # The Gender-Equality Paradox: A Decision Tree

  **Instructions:** Start at the top. At each box, choose the option that best matches your bet about what the data would show if we dug deeper. Follow the arrow until you reach a leaf.

  ### The Tree

  **Node 1: The Measurement Bet**
  *If we re-ran the study using 'hours of unpaid care work' instead of 'seats in parliament' to measure equality, does the pattern vanish?*
  *   **Yes, it vanishes:** Go to **Node 2**.
  *   **No, it holds:** Go to **Node 3**.

  **Node 2: The Artifact Type**
  *Is the error primarily in how we define 'equality' (Index) or how we count 'degrees' (Data)?*
  *   **Index Definition:** → **Leaf 1: The Measurement-Skeptic**
  *   **Data Counting:** → **Leaf 1: The Measurement-Skeptic**
      *(Note: Both paths lead here. The diagnosis differs, but the verdict is the same: the pattern is not real.)*

  **Node 3: The Opportunity Bet**
  *In low-equality countries, are women in engineering there because they are blocked from law/medicine, or because they are sorting by relative strength?*
  *   **Blocked from elsewhere:** Go to **Node 4**.
  *   **Sorting by strength:** → **Leaf 2: Comparative-Advantage Sorting**

  **Node 4: The Payoff Bet**
  *If women in low-equality countries could be CEOs or Judges, would they still choose engineering?*
  *   **No, they'd switch:** → **Leaf 3: STEM as Escape Hatch**
  *   **Yes, they'd stay:** Go to **Node 5**.

  **Node 5: The Culture Bet**
  *In high-equality countries, do women avoid engineering because the field is hostile, or because they feel free to choose other things?*
  *   **Field is hostile:** → **Leaf 4: Backlash / Identity-Threat**
  *   **Free to choose:** Go to **Node 6**.

  **Node 6: The 16-Year-Old Bet**
  *A 16-year-old girl in Sweden loves engineering. Given the national trend, does justice require us to *actively recruit* her (counter-trend), or just ensure she isn't *blocked* (accept trend)?*
  *   **Actively recruit:** Go to **Node 7**.
  *   **Just don't block:** → **Leaf 5: Real/Social/No Entitlement**

  **Node 7: The Origin Bet**
  *If we perfectly equalized preschool toys and encouragement, would the gender gap in engineering interest remain?*
  *   **Yes, it remains:** → **Leaf 6: Intrinsic Preferences (Affluence)**
  *   **No, it closes:** → **Leaf 7: Adaptive Preferences**

  ***

  ### The Leaves (Positions)

  **Leaf 1: The Measurement-Skeptic**
  *   **Prediction:** Explains (a)–(d) as statistical artifacts; e.g., "equality" indices measure wealth, not culture.
  *   **Awkward Commitment:** You must argue that decades of sociological data are fundamentally mislabeled.
  *   **What we owe:** Nothing specific; fix the metrics, not the pipeline.

  **Leaf 2: Comparative-Advantage Sorting**
  *   **Prediction:** Explains (c) & (d); women in rich countries are *good* at math (scores narrow) but *better* at verbal/bio, so they sort there.
  *   **Awkward Commitment:** Implies women in poor countries are in engineering not because they love it, but because they lack the credentials for law/med.
  *   **What we owe:** Neutral information about career payoffs; no need for gendered recruitment.

  **Leaf 3: STEM as Escape Hatch (Absolute-vs-Relative Payoffs)**
  *   **Prediction:** Explains (d); STEM is a high-status refuge when other high-status doors (law, med) are closed.
  *   **Awkward Commitment:** Suggests gender equality *causes* the drop in women engineers by opening better doors elsewhere.
  *   **What we owe:** Open doors in *all* high-status fields, not just STEM.

  **Leaf 4: Backlash / Identity-Threat**
  *   **Prediction:** Explains (c); high-equality cultures make gender identity *more* salient, increasing stereotype threat in male fields.
  *   **Awkward Commitment:** Implies that making society fairer inadvertently makes STEM classrooms psychologically harder for women.
  *   **What we owe:** Active cultural intervention in STEM fields to reduce threat.

  **Leaf 5: Real/Social/No Entitlement**
  *   **Prediction:** Accepts (a)–(d) as real and social, but denies they indicate injustice.
  *   **Awkward Commitment:** You must tell the 16-year-old enthusiast that her group's trend doesn't warrant extra support, only an open door.
  *   **What we owe:** Procedural fairness (no blocking), but no outcome engineering.

  **Leaf 6: Intrinsic Preferences (Affluence)**
  *   **Prediction:** Explains (a) & (b); wealth allows "true" biological/psychological interests to emerge (people vs. things).
  *   **Awkward Commitment:** Commits to the view that gendered interests are deep-seated enough to survive perfect socialization.
  *   **What we owe:** Aggressive recruitment to counteract deep-seated statistical drift.

  **Leaf 7: Adaptive Preferences**
  *   **Prediction:** Explains (a); women in unequal countries *think* they want engineering because they've internalized limits; in equal countries, they realize they didn't.
  *   **Awkward Commitment:** Risks patronizing women in poor countries (their choices are "false") and women in rich countries (their choices are "free").
  *   **What we owe:** Aggressive recruitment to undo early socialization effects.

  ***

  ### Logical Space Analysis

  **Formal Combinations:**
  With **7 binary nodes**, the tree formally allows **$2^7 = 128$** answer-combinations (paths through the logical space).

  **Unoccupied Cells:**
  Most of these 128 cells are **unoccupied** because the tree structure prunes them (e.g., you cannot answer Node 7 if you answered "No" at Node 1).
  *   **Incoherent:** Any path that accepts the pattern is an artifact (Node 1: Yes) but then argues for active recruitment based on the pattern (Node 6: Recruit). This is the cell where someone thinks it's an artifact but keeps the full-strength justice claim. It is empty because the tree forces skeptics to the "Nothing owed" leaf.
  *   **Unattractive:** The path where one grants the pattern is real and substantially biological (Node 7: Yes) but demands *no* intervention (Node 6: Don't block). This cell is technically possible in the abstract, but my tree routes it to **Leaf 5 (No Entitlement)** rather than **Leaf 6 (Intrinsic)**. This forces two distinct philosophical views (Biological Realist + Interventionist vs. Biological Realist + Libertarian) into the same "No Entitlement" verdict if they answer Node 6 differently.
      *   *Correction:* In my tree, Node 6 splits them. If you say "Biological" (Node 7) you must have said "Recruit" (Node 6) to get to Leaf 6. If you say "Don't Block" (Node 6), you go to Leaf 5. So the "Biological + No Intervention" cell is **Leaf 5**. The "Biological + Intervention" cell is **Leaf 6**.
      *   *The Empty Cell:* The cell where someone thinks it's an **Artifact** (Node 1: Yes) but still demands **Aggressive Intervention** (Node 6: Recruit). This path is pruned; the tree does not allow you to be a Skeptic and an Interventionist.

  **Forced Verdicts:**
  The tree forces **Leaf 6 (Intrinsic)** and **Leaf 7 (Adaptive)** into the same verdict on **what we owe** ("Aggressive recruitment"), even though the people who hold them would hate that alliance. The Intrinsic theorist thinks we are fighting biology; the Adaptive theorist thinks we are fighting socialization. They agree on the policy, but for mutually hostile reasons.

  **Note on Intrinsic vs. Comparative Advantage:**
  I have flagged these as distinct leaves (6 and 2). However, empirically, they are difficult to separate. Both predict women will sort away from engineering in rich countries. The tree separates them by *mechanism* (Node 3: Sorting by Strength vs. Node 7: Interest after Socialization), but in the real world, "strength" and "interest" are deeply correlated. A student should treat these as neighboring positions that often blur.
