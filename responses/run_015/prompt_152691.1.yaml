answer: |-
  exam question

  dr aris thorne is a top climate scientist. she has a six-year-old kid. she's offered a role leading a global advocacy campaign that models say could cut carbon enough to save millions of lives over the next decade. but it requires travel and relocation for five years. basically she'd be absent for most of her kid's childhood. the alternative is a local research role. lower impact on climate. but she stays home. aris refuses to weigh the millions of lives against her presence in her kid's life. she says calculating that trade-off feels like a betrayal of who she is.

  write an essay addressing the following: is aris's refusal to run the utilitarian calculus an instance of williams-style integrity (a ground project) or is it moral laziness dressed up as deep attachment? you need to explain why williams thinks some calculations are corrupting rather than merely inconvenient. also distinguish ground projects from mere attachments in a way that doesn't just recycle the standard husband-and-wife drowning example. be specific about why the thought itself is the problem.

  ***

  model answer

  williams's integrity objection hits utilitarianism where it hurts. it's not just that utilitarianism demands too much. it's that it demands we become neutral channels for satisfaction. if aris sits down to calculate whether her kid's childhood is worth less than millions of strangers lives she's already alienated herself from the project of being a parent. williams calls these ground projects. they aren't just things we like. they're the things that give our lives momentum and meaning. they constitute the self.

  so is it laziness? the laziness charge assumes aris *ought* to calculate but finds it emotionally taxing. williams would say the obligation itself is the error. if morality requires you to step outside your own life and view your commitments as disposable variables then morality is asking you to abandon your integrity. for aris parenting isn't a preference she can swap out for higher utility. it's a constitutive part of her identity. refusing to calculate isn't avoiding work. it's refusing to let her identity be colonized by the utilitarian demand.

  this is where the corrupting vs inconvenient distinction matters. an inconvenient calculation is just hard math. maybe she doesn't know the carbon stats. that's epistemic. a corrupting calculation is one that changes the nature of the commitment just by being entertained. if aris asks "is my kid worth less than 100k strangers?" she's already treating her kid as a means to utility. the thought itself degrades the relationship. williams says there can be one thought too many. when the husband saves his wife he shouldn't think "utility maximization requires this." he should just think "it's my wife." same for aris. if she stays because the utility calc says local research is optimal she's not really being a parent. she's being a utility agent pretending to be a parent.

  distinguishing ground projects from attachments is key here. an attachment is a strong desire. i really want chocolate. a ground project is something i couldn't give up without ceasing to be me. if aris treated parenting as a mere attachment she could theoretically trade it off if the price was right. but ground projects resist trade-offs. they provide the framework within which trade-offs make sense. you can't use the framework to destroy the framework.

  so it's not laziness. laziness implies a failure to meet a valid demand. williams argues the demand is invalid because it attacks the agent's integrity. aris preserves her integrity by refusing to let the utilitarian calculus enter the space of her ground projects. the calculation is corrupting because it requires her to view her own life from nowhere. she lives somewhere. she lives as a parent and a scientist. forcing her to adopt the view from nowhere doesn't make her more moral. it makes her less real.

  ***

  marking scheme (20 marks total)

  1. explanation of integrity and negative responsibility (4 marks)
     - must show understanding that utilitarianism makes agents responsible for outcomes they don't directly cause via omission.
     - common botch: students define integrity as honesty or keeping promises instead of identity-coherence.

  2. distinction between ground projects and mere attachments (4 marks)
     - must argue ground projects are constitutive of identity not just strong preferences.
     - common botch: treating ground projects as just really strong hobbies or emotional bonds.

  3. the corrupting vs inconvenient calculation distinction (4 marks)
     - must explain that the act of calculating changes the moral quality of the action/relationship.
     - common botch: saying the calculation is corrupting just because it's emotionally painful or hard to do.

  4. addressing the moral laziness counter-argument (4 marks)
     - must argue that laziness presupposes a duty that williams denies exists.
     - common botch: conceding it might be laziness or dismissing the objection without philosophical grounding.

  5. application to the climate scientist scenario (4 marks)
     - must apply concepts to aris specifically without leaning on the jim/indians or drowning spouse examples.
     - common botch: ignoring the prompt's scenario and writing about jim and the indians instead.
