answer: |-
  - what the practice actually does

  Agencies now slap uncertainty bands on default probabilities. They mix hard historical default frequencies with soft expert judgement using a linear opinion pool. Instead of a single number, you get a range, say 2% to 5%. It looks rigorous, like proper maths, suggesting they've captured the margin of error. But it's dressing up subjective guesses in statistical clothing. They claim this shows humility, admitting they dont know the exact figure, yet the methodology implies the range is calculable and reliable.

  - Keynes's likely line on the quantification bit

  Hed call it spurious quantification, no doubt. Keynes drew a sharp line between risk, where probabilities are known from past frequencies, and uncertainty, where theres no scientific basis for calculation. Sovereign defaults are unique historical events, not roulette wheels. By assigning a precise band, agencies pretend the unknown is knowable. He'd argue this isnt humility; its false precision. It comforts investors with the illusion of control while masking the fundamental ignorance inherent in predicting political economies in the long run. He'd say theyre confusing probability with uncertainty. The maths might be consistent, but if the underlying premises are subjective guesses, the output isnt objective truth. Its merely numerology dressed in a suit. He'd reckon theyre trying to solve the problem of uncertainty by pretending it doesnt exist, which is dangerous because it encourages blind reliance on models rather than genuine judgement. Ultimately, he believed such calculations mislead markets during crises.

  - where the weight-of-argument problem fits in

  This is where it gets tricky. For Keynes, the weight of argument measures the completeness of evidence, not just the probability. If an agency widens a band, theyre admitting less certainty, but does that increase weight? Not necessarily. If the shift comes from more conflicting expert opinions, the probability might stay same but the weight drops because the evidence is messier. An investor updating beliefs solely on the band shift misses this. Theyre chasing probability changes while ignoring whether the foundation is solid. More evidence can reduce weight if it introduces contradiction rather than clarity. Keynes would say rationality isnt just updating numbers; its assessing how much you actually know. If the band moves because of noise, acting on it is speculative gambling, not investment. You need to ask if the new data strengthens the case or just adds noise to the calculation. This distinction is crucial for understanding market volatility.

  - bottom line — what hed probably advise

  Hed tell you to ignore the bands and trust your own judgement. Dont let quantification fool you into thinking sovereign risk is measurable like insurance actuarials. Use data as a guide, not gospel. Its conventional judgement masquerading as science. Invest because you understand the underlying politics, not because a model says theres a 3% default chance. Maintain liquidity for when uncertainty bites. Treat ratings as market sentiment, not mathematical fact. Stay humble, keep your powder dry, and never confuse a precise number with true knowledge. He would warn against following the herd blindly. Keep your eyes open. False precision is dangerous.
