  **The Scenario**

  Silas is the night groundskeeper at a private academy, scheduled to unlock the main gate at 5:00 PM for a visiting debate team he despises. Motivated by petty spite, he resolves to keep them out; he arrives at the control panel at 4:55 PM, places his hand on the manual override lever, and stands ready to physically resist any mechanism that might try to open the lock, intending to maintain the blockade until they leave. Unbeknownst to Silas, a power surge at 4:50 PM fused the locking bolts solid; the gate *cannot* be opened by any human effort, and moving the lever changes nothing. Silas does not know this. He holds the lever in the "locked" position for ten minutes, actively ensuring their exclusion, believing his will is the causal force, when in fact the gate's state is fixed by the surge. He leaves only when he is satisfied they have been sufficiently inconvenienced, having performed every outward sign of a deliberate, malicious sabotage.

  ***

  **1. Control Version and Blame Judgment**
  In the control version, the power surge does not occur; the lock functions normally. Silas arrives, holds the lever, and successfully keeps the gate locked through his own physical intervention. The team is excluded because of Silas's effort.
  *Honest Assessment:* My blame judgment does **not** shift meaningfully between the two cases. In both, Silas is equally culpable for the *attempted* sabotage and the *intent* to harm. In the blocked version, he is lucky that his will aligned with reality, but that luck does not mitigate his moral standing regarding his choice. If anything, the blocked version highlights that his blameworthiness attaches to his *commitment* to the act, not the causal efficacy of his muscles.

  **2. Leeway vs. Actual-Sequence Analysis**
  *   **The Leeway Theorist:** Will argue Silas is less blameworthy (or not blameworthy for the *exclusion*) in the blocked case because he lacked the ability to do otherwise. They will insist that moral responsibility requires the possibility of success in the alternative course (opening the gate). Since the alternative was physically impossible regardless of his will, he lacked "regulative control." They might concede he is blameworthy for his *attitude*, but not for the *act* of exclusion, since the exclusion was inevitable.
  *   **The Actual-Sequence / Reasons-Responsiveness Theorist:** Will argue Silas is fully blameworthy because the actual sequence of events flowed from his own reasons-responsive mechanism. He recognized the reason to open the gate (duty) and rejected it for a bad reason (spite). The fact that the world was rigged such that his choice couldn't fail is irrelevant to the quality of his agency *in the moment*. He acted on his own reasons, without coercion, and the blockage was causally inert regarding his decision-making process.

  **3. The Single Working Feature**
  The feature doing the work is **Silas's Ignorance of the Blockage**.
  *   **Why:** If Silas *knew* the gate was fused, his action would read as resignation ("I guess I'll just stand here since it's stuck"), which mitigates blame. Because he is *ignorant*, his action reads as a voluntary imposition of will ("I am making this stay closed").
  *   **If Removed:** If Silas knows the gate is fused, the case collapses into a "no choice" scenario where he is merely waiting out a mechanical failure. The blame for *sabotage* vanishes, leaving only potential blame for *loitering*.

  **4. Strongest Leeway Attack**
  *   **Attack:** "Silas could have gone for a coffee break." The blockage prevents the *gate from opening*, but it does not prevent Silas from *refraining from holding the lever*. A true Frankfurt case must block the *decision* to refrain, not just the *success* of the alternative action. Since Silas could have chosen not to stand guard, he had leeway.
  *   **Survival:** The case **does not fully survive** this attack in its purest form. It blocks the alternative *outcome* (the gate opening), but not the alternative *behavior* (walking away). To patch this, one would have to stipulate Silas was *required* to stand there (e.g., a supervisor watching), but that reintroduces an intervener/coercion element. As written, it is a "Result-Inevitability" case, not a "Decision-Inevitability" case.

  **5. Honest Note: Is This Actually a Frankfurt Case?**
  I hit the **"Able to Try" horn**.
  This is not a pure Frankfurt case; it is a **hybrid of a Frankfurt case and a Moral Luck case**.
  *   **The Disguise:** A true Frankfurt case requires the agent to be unable to *choose* otherwise. In my scenario, Silas is unable to *succeed* otherwise. He *could* have chosen to try to open the gate (pull the lever the other way). The blockage makes that attempt futile, not impossible.
  *   **The Relaxation:** To get a realistic, no-intervener case, I had to relax the constraint that the *decision* itself must be unavoidable. In the real world, without a counterfactual intervener or hard determinism, you cannot make a free decision unavoidable via "ordinary standing features" without those features reading as coercion or excuse (e.g., "the gun was jammed" excuses the shooter who didn't know, or "he was addicted" traces back).
  *   **The Verdict:** This case works to isolate *reasons-responsiveness* as the source of blame, but it concedes the leeway point: Silas *could* have tried to be good. It argues that the *futility of the try* is what matters, not the *possibility of the try*. This is a Frankfurt-*style* intuition pump, but metaphysically, it relies on the agent's ignorance to mask the leeway that still exists.
