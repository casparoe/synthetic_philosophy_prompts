answer: |-
  Reject step (2) because comparative harm is insufficient for wronging.

  Your friend's argument is a classic formulation of the Non-Identity Problem, and its plausibility rests entirely on the intuition that "wronging" must always involve making a specific individual worse off than they would otherwise have been. This premise looks sound because it perfectly captures our moral reasoning in standard "same-person" cases: if you push me, you wrong me because I am worse off than if you hadn't. However, this comparative model breaks down in "different-person" cases where the choice determines who exists. By insisting that wronging requires a comparative baseline of non-existence, (2) renders it logically impossible to wrong someone by bringing them into existence, even under horrific conditions, provided their life remains worth living. To avoid the absurd conclusion (7), you must decouple "wronging" from "making worse off than the alternative of non-existence."

  Here is the price of the three alternatives you requested:

  **1. Giving up the comparative person-affecting requirement (Recommended)**
  *   **Cost:** You must accept that one can wrong a person even if they are not worse off than they would otherwise have been. This requires adopting a "threshold" view or a "rights-based" view: there is a baseline of welfare or rights below which it is wrong to create someone, regardless of whether non-existence was the only alternative.
  *   **Benefit:** This preserves the person-affecting constraint you value. You are still wronging *those specific people* by creating them in a violated state, rather than appealing to impersonal aggregates. It blocks (7) by asserting that bequeathing a degraded world violates a duty owed *to* the future inhabitants, even if their lives are worth living.
  *   **Risk:** It requires explaining how non-existence can be a "better" alternative in a moral sense without being a state the person experiences, or positing rights that exist prior to existence.

  **2. Resisting (1)'s scope claim about identity fragility**
  *   **Cost:** You must argue that climate policy does not significantly alter who conceives whom over a century. This contradicts chaos theory and demographic reality; small shifts in travel, work, and economy cascade into completely different gametes meeting within a few generations.
  *   **Benefit:** It allows you to keep the comparative account (2) intact for everyone.
  *   **Risk:** It is empirically indefensible for distant generations. Your friend correctly noted that only a tiny remnant of "identity-robust" people would remain, leaving the vast majority of future victims without recourse under your view.

  **3. Rejecting the move from (4) to (5)**
  *   **Cost:** This is logically difficult without modifying (2). Since (5) follows deductively from (2), (3), and (4), rejecting the inference implies one of the premises is false. If you keep (2) and (4), you cannot logically deny (5).
  *   **Benefit:** None, unless you are willing to claim that living a hard life is somehow "worse" than non-existence in a comparative sense, which contradicts (4).
  *   **Risk:** It leaves your position vulnerable to charges of logical inconsistency unless you explicitly target the definition of "worse off" in (2).

  To maintain a person-affecting view without accepting (7), you should modify (2) rather than abandon it entirely. Adopt a **threshold person-affecting principle**: a choice wrongs someone if it causes them to exist below a certain threshold of welfare or rights, even if their alternative was non-existence. This allows you to say the lax policy wrongs future people not because they are worse off than dead, but because they are created into a condition they have a right not to be created into.
