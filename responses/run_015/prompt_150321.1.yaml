prompt: |-
  Hi — hoping you can help me put something together that my committee can actually use.

  I'm the governance officer (clerk, minute-taker, and de facto rules nerd) for a professional institute of about 9,000 members. Our rulebook is amended at the AGM and at emergency general meetings — 30 or 40 substantive motions a year, plus the occasional one shoehorned in between. My job is to rule, sometimes in advance of the vote and sometimes the morning after, on whether a motion that carried actually changed the rules, or whether it's void / void in part / did something different from what the proposer thought. I then give the Rules Committee three or four paragraphs of written reasons they sign off on. Two of my rulings have ended up in front of a judge, so they can't be hand-wavy; but the committee is five lay trustees who will not sit through a lecture on self-reference, and I usually have about two days from motion to ruling.

  The bit we keep crashing into is that the rules govern their own amendment, and the drafting is a mess. Roughly:

  - Rule A1: rules may be amended by a two-thirds majority at a general meeting; A1 itself may be amended only by a three-quarters majority.
  - Rule A2: the rules in force are those printed in the current Handbook, as updated by the Secretary. The Handbook is reprinted every other year, so what members vote against and what's on the shelf are often two different texts.
  - Rule A3: if part of an amendment is void, the rest stands.
  - Rule A4: no amendment may remove an accrued right of a member. Nobody knows what accrued means here; we've been reading it as a right someone has already started to exercise.
  - Rule A5: defines who counts as a voting member.

  So: give me a decision procedure. Ordered questions, what counts as an answer to each one, where the procedure stops with a no, and where it hands the decision to the committee because it's a values call dressed up as a rule question. It has to be runnable in an afternoon with the rulebook and the minutes, and it has to handle self-referential amendments specifically — an amendment that changes the threshold it has to clear, a rule that tries to lock itself against later amendment, a motion that repeals the amending power and hands it somewhere else. Please don't just tell me these are paradoxical; I still have to issue a ruling on Monday.

  Run it on these:

  1. A motion to lower the general amendment threshold in A1 from two-thirds to a simple majority. It got 68%. Did it carry, and if so what threshold applies to next year's motions?
  2. In 2022 a motion added to Rule 14 (the subscription cap) the sentence "Rule 14 may not be amended or repealed." Passed 71%. In 2024 a motion to repeal Rule 14 outright passed 69%. What's in force now — and was the 2022 lock itself valid, given A1?
  3. A single motion, passed 78%, repealing A1 and replacing it with "the Board may amend these Rules by resolution." Do we still have a rulebook, and can a later board resolution be challenged?

  And two hard cases the procedure has to say something about: (a) the 2019 Members' Charter — a block of protections including a right to appeal expulsion, inserted by a 71% vote, with a preamble saying these are fundamental and shall not be amended; this year a 70% motion deleted the appeal right. My instinct, and the members', is that the preamble protects it. I suspect the procedure will tell me otherwise. (b) A motion to exclude retired members from voting, which passed 67% counting the retired members who voted and 61% excluding them — the amending majority depends on the content of the amendment.

  Please flag where the procedure can't settle things: rules we've all been relying on for years that were probably never validly adopted, and the printed-Handbook lag under A2. And tell me what it can't do at all. No need for citations or further reading — I want the tests and the reasons, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and rulings:

  1.  **Analyze the User and Context:**
      *   **Role:** Governance Officer (Clerk/Minute-taker/Rules Nerd) for a professional institute (~9,000 members).
      *   **Task:** Create a usable decision procedure for ruling on the validity of rule amendments.
      *   **Audience:** Rules Committee (5 lay trustees, no legal/rule theory expertise).
      *   **Constraints:** Needs to be runnable in an afternoon, handle self-reference/paradoxes, produce clear rulings (Yes/No/Committee Decision), and address specific hard cases.
      *   **Tone:** Practical, authoritative, clear, non-academic, actionable.
      *   **Specific Problems:** Self-referential rules (A1), version control (A2), severability (A3), accrued rights (A4), voting eligibility (A5).
      *   **Deliverables:** A decision procedure (flowchart-style logic), application to 3 specific scenarios, application to 2 hard cases, and a list of limitations/unsettled issues.

  2.  **Deconstruct the Existing Rules (The "Constitution"):**
      *   *A1:* Amendment threshold (2/3 general, 3/4 for A1). *Problem:* Self-reference (changing the threshold).
      *   *A2:* Source of truth = Printed Handbook (updated by Secretary). *Problem:* Lag between vote and publication.
      *   *A3:* Severability (void parts don't kill valid parts).
      *   *A4:* Accrued Rights (cannot remove). *Problem:* Undefined "accrued."
      *   *A5:* Voting membership definition. *Problem:* Circular if amendment changes who votes on the amendment.

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Goal:* A step-by-step checklist that filters out invalid motions and identifies valid ones, flagging gray areas for the Committee.
      *   *Step 1: Procedural Validity.* Was the meeting quorate? Was notice given? (Basic hygiene).
      *   *Step 2: Voting Threshold.* Did it meet the threshold *in force at the time of the vote*? (Crucial for self-reference).
      *   *Step 3: Competence/Power.* Does the General Meeting (GM) actually have the power to do this? (e.g., trying to give power to the Board if the Rules say only GM can amend).
      *   *Step 4: Self-Reference & Entrenchment.* Can a rule lock itself? (General legal principle: one parliament cannot bind its successor, but contract law might differ. For an institute, usually, a higher threshold *can* be set for specific rules, but an absolute ban is usually void).
      *   *Step 5: Accrued Rights (A4).* Is a specific, exercised right being taken away?
      *   *Step 6: Version Control (A2).* Reconcile the vote with the Handbook.
      *   *Decision Points:* If it fails Step 2, 3, or 4 -> Void. If Step 5 is tricky -> Committee Decision.

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Refinement on Self-Reference:* If a motion changes A1, it must meet the *old* A1 threshold to pass. If it passes, the *new* A1 applies going forward.
      *   *Refinement on Entrenchment:* A rule saying "This cannot be amended" is usually void because it contradicts the supreme amending power (A1). However, a rule saying "This requires 90%" is valid if A1 allows higher thresholds for specific rules.
      *   *Refinement on A2:* The vote *is* the law. The Handbook is just evidence. The Secretary's update is administrative, not legislative.

  5.  **Applying the Procedure to the Scenarios:**

      *   *Scenario 1 (Lowering A1 threshold):*
          *   Motion: 2/3 -> Simple Majority.
          *   Vote: 68%.
          *   Test: Must meet the threshold *currently in force* (A1 says 3/4 for A1 amendments).
          *   Result: 68% < 75%. Motion Fails.
          *   *Wait, check A1 text:* "A1 itself may be amended only by a three-quarters majority."
          *   *Calculation:* 68% is less than 75%.
          *   *Ruling:* Void. Old threshold stands.

      *   *Scenario 2 (The Lock on Rule 14):*
          *   2022: "Rule 14 may not be amended." Passed 71%.
          *   2024: Repeal Rule 14. Passed 69%.
          *   *Analysis:* Can a simple rule (Rule 14) override the supreme amending rule (A1)? No. A1 says rules *may* be amended by 2/3. A "no amendment" clause is an attempt to bind the future GM. It is void *ab initio* (from the start) because it contradicts A1.
          *   *2024 Vote:* 69% > 66% (2/3).
          *   *Ruling:* 2022 lock was void. 2024 repeal is valid. Rule 14 is gone.

      *   *Scenario 3 (Repealing A1, handing to Board):*
          *   Motion: Repeal A1, Board amends.
          *   Vote: 78%.
          *   *Analysis:* This is a "suicide clause." It removes the GM's power.
          *   *Validity:* A1 allows GM to amend rules. Can GM amend rules to remove GM's power? Yes, *if* the threshold is met (78% > 66%).
          *   *Consequence:* The Rulebook exists, but the amendment power has moved.
          *   *Challenge:* Can a Board resolution be challenged? Only on procedural grounds (ultra vires the new rule), not on the basis that GM should have done it (since GM gave that power away).
          *   *Nuance:* This effectively changes the constitution from a member-led to a board-led org. Valid if passed correctly.

      *   *Hard Case (a) (Members' Charter):*
          *   Preamble says "Fundamental/Shall not be amended."
          *   Vote to delete appeal right: 70%.
          *   *Analysis:* Similar to Scenario 2. A preamble cannot override A1. "Shall not be amended" is void.
          *   *Threshold:* Is the Charter part of A1 (requiring 3/4)? If not, it's 2/3. 70% > 66%.
          *   *Ruling:* Valid amendment. Preamble is aspirational, not legal. (User's instinct is wrong legally, but politically sensitive).

      *   *Hard Case (b) (Retired Members Voting):*
          *   Vote: 67% (with retired), 61% (without).
          *   *Analysis:* This is the "Who decides who decides" paradox.
          *   *Principle:* The threshold must be calculated based on the electorate *as defined at the start of the meeting*. You cannot use the result of the vote to validate the electorate that cast the vote.
          *   *Ruling:* If A5 includes retired members *before* the amendment, they count. 67% > 66%. Valid. If A5 excludes them, 61% < 66%. Void.
          *   *Action:* Check A5 *before* the vote.

  6.  **Addressing Limitations & "The Mess":**
      *   *A2 (Handbook Lag):* The Handbook is evidence, not law. The Minutes/Resolutions are the law. This needs to be fixed, but for now, rule that the Resolution text prevails over printed text.
      *   *Accrued Rights (A4):* This is the biggest "Values Call." The procedure can't define "accrued." It must be flagged to the Committee.
      *   *Invalid History:* If past amendments were void (e.g., failed thresholds), the current book might be full of ghosts. The procedure can't fix history, only current motions. Suggest a "Consolidation Motion" to reset the text.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too legalistic? Need to simplify language for the Trustees. Use "Test 1, Test 2..." format.
      *   *Self-Reference:* Ensure the logic holds. (e.g., To change the lock, you need the key that exists *now*, not the key you want).
      *   *Safety:* Add a disclaimer that this is internal guidance, not legal advice (given the judge history).
      *   *Formatting:* Use bolding, lists, and clear headings.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Scenario 1:* Wait, A1 says "A1 itself... 3/4". The motion is to change A1. So it needs 75%. 68% fails.
      *   *Correction on Scenario 3:* If A1 is repealed, what governs the repeal? The *old* A1. Once repealed, the *new* rule applies. So the transition is valid if old A1 was satisfied.
      *   *Correction on Hard Case B:* This is a classic *Bonham's Case* style issue. The electorate is defined by the rules *prior* to amendment.
      *   *Emphasis:* Make sure the distinction between "Void" (never happened) and "Invalid" (procedural error) is clear, though for this purpose "Void/Ineffective" is sufficient.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your Rules Committee. It is drafted to be printed and placed in front of them during a ruling session. It avoids legal theory and focuses on the mechanical logic of your specific rulebook.

  Following the procedure, I have applied it to your five scenarios and listed the systemic risks you need to flag to the Committee.

  ***

  # The Amendment Validity Procedure (AVP)

  **Purpose:** To determine if a motion passed at a General Meeting (GM) effectively changes the Rules.
  **Usage:** Run through Tests 1–5 in order. If any test results in "VOID," stop. If all tests pass, the amendment is valid. If a test requires a value judgment, refer to the Committee.

  ### Test 1: The Threshold Test (Temporal Validity)
  *Question:* Did the vote meet the percentage threshold required **at the exact moment the vote was taken**?
  *   **Yes:** Proceed to Test 2.
  *   **No:** **VOID.** The motion fails. You cannot use a new rule to validate the vote that created it.
  *   **Note on A1:** If the motion amends A1 (the threshold rule), it must meet the *old* A1 threshold to pass. If it passes, the *new* A1 applies to all future votes.

  ### Test 2: The Competence Test (Power)
  *Question:* Does the General Meeting have the power to make this change under the **current** rules?
  *   **Yes:** Proceed to Test 3.
  *   **No:** **VOID.** (Example: A motion trying to give amendment power to the Board is valid *only if* A1 currently allows the GM to transfer that power. If A1 says "Only the GM may amend," the GM can change that sentence, but must follow Test 1 to do so).
  *   **Gray Area:** If the motion attempts to remove the GM's own power permanently (a "suicide clause"), flag for Committee. It is legally valid if Test 1 is met, but constitutionally radical.

  ### Test 3: The Entrenchment Test (Locks)
  *Question:* Does another rule claim this rule cannot be amended, or requires a higher threshold than A1 specifies?
  *   **No:** Proceed to Test 4.
  *   **Yes:** **IGNORE THE LOCK.**
      *   *Reasoning:* A1 is the supreme amending power. A lower-level rule (like Rule 14) cannot override A1. A clause saying "This rule cannot be amended" is void because it contradicts A1's grant of power to the GM.
      *   *Exception:* If A1 *itself* says "Rule X requires a 90% vote," then that higher threshold applies. If Rule X says "I require 90%" but A1 is silent, the Rule X lock is void.

  ### Test 4: The Accrued Rights Test (A4)
  *Question:* Does this amendment remove a right that a specific member has **already started to exercise**?
  *   **No:** Proceed to Test 5.
  *   **Yes:** **COMMITTEE DECISION.**
      *   *Reasoning:* "Accrued" is undefined. The Procedure cannot determine this.
      *   *Guidance for Committee:* A right is accrued only if the member has taken concrete steps to use it (e.g., filed an appeal) before the vote. Mere eligibility is not an accrued right.

  ### Test 5: The Electorate Test (A5)
  *Question:* Was the majority calculated using the list of eligible voters defined **before** the amendment?
  *   **Yes:** **VALID.**
  *   **No:** **VOID.** You cannot change who is allowed to vote on a motion by using the votes of the people you are adding/removing. The electorate is fixed at the start of the meeting.

  ***

  # Application to Your Scenarios

  Here are the rulings based on the AVP above. You can present these directly to the Committee.

  ### 1. The Threshold Lowering (A1)
  *   **Motion:** Lower A1 threshold from 2/3 to Simple Majority.
  *   **Vote:** 68%.
  *   **Analysis (Test 1):** To amend A1, the *current* A1 requires a 3/4 (75%) majority.
  *   **Ruling:** **VOID.**
  *   **Reasoning:** 68% is less than the 75% required by the rule in force at the time of the vote. The threshold remains 2/3 for general rules and 3/4 for A1.

  ### 2. The Rule 14 Lock
  *   **2022 Motion:** "Rule 14 may not be amended." (Passed 71%).
  *   **2024 Motion:** Repeal Rule 14. (Passed 69%).
  *   **Analysis (Test 3):** The 2022 "lock" attempts to remove the GM's power under A1. A1 allows amendment by 2/3. A lower rule cannot override A1.
  *   **Ruling:** **2022 Lock VOID. 2024 Repeal VALID.**
  *   **Reasoning:** The 2022 clause was ineffective from the moment it was passed because it contradicted the supreme amending power (A1). Rule 14 remained amendable by 2/3. The 2024 vote (69%) exceeded the 2/3 requirement. Rule 14 is repealed.

  ### 3. The "Suicide" Motion (Board Power)
  *   **Motion:** Repeal A1; Board amends Rules by resolution.
  *   **Vote:** 78%.
  *   **Analysis (Test 1 & 2):** A1 allows the GM to amend any rule, including A1. The vote (78%) exceeds the A1 threshold (2/3).
  *   **Ruling:** **VALID.**
  *   **Reasoning:** The GM has used its existing power to transfer that power to the Board. The Rulebook remains in force, but the *mechanism* for changing it has changed.
  *   **Challenge Risk:** A later Board resolution can only be challenged on procedural grounds (e.g., improper notice), not on the basis that members should have voted. The members voted to give that power away.

  ### 4. Hard Case: The Members' Charter
  *   **Motion:** Delete appeal right (Charter says "Fundamental/Shall not be amended").
  *   **Vote:** 70%.
  *   **Analysis (Test 3):** The preamble ("Shall not be amended") is a lock. Under Test 3, locks in subordinate rules are void against A1.
  *   **Ruling:** **VALID.**
  *   **Reasoning:** The preamble is aspirational, not legal. Unless A1 specifically lists the Charter as requiring a higher threshold (e.g., 3/4), the standard 2/3 applies. 70% > 66%. The appeal right is deleted.
  *   **Note:** This will be unpopular. Warn the Committee that while legally sound under the AVP, this may trigger a membership revolt or legal challenge on "reasonable expectation" grounds, not rulebook grounds.

  ### 5. Hard Case: Retired Members Voting
  *   **Motion:** Exclude retired members from voting.
  *   **Vote:** 67% (including retired), 61% (excluding retired).
  *   **Analysis (Test 5):** The electorate is defined by A5 *before* the amendment passes.
  *   **Ruling:** **DEPENDS ON CURRENT A5.**
      *   **If Current A5 includes Retired:** They are valid voters. 67% counts. **MOTION VALID.**
      *   **If Current A5 excludes Retired:** They are invalid voters. 61% counts. **MOTION VOID.**
  *   **Reasoning:** You cannot use the votes of the group you are disenfranchising to validate the disenfranchisement. The status quo defines the electorate.

  ***

  # Systemic Risks & Limitations

  The AVP handles specific motions, but it cannot fix the structural rot in your rulebook. You must put the following three warnings in your cover note to the Committee.

  ### 1. The "Handbook Lag" (Rule A2)
  *   **The Problem:** A2 says the Rules are what is printed in the Handbook. But the Handbook is biennial. The Rules are actually what was voted on at the GM.
  *   **The Risk:** If the Secretary makes a typo in the Handbook, or fails to incorporate a valid amendment, A2 suggests the *typo* is the law.
  *   **The Fix:** The Committee must minuted that **Resolutions passed at GM prevail over the Printed Handbook.** The Handbook is evidence, not the source of truth. You need a "Consolidation Motion" at the next AGM to reprint the Rules correctly and reset A2 to say "The Rules are those last consolidated by Resolution X."

  ### 2. The "Accrued Rights" Trap (Rule A4)
  *   **The Problem:** The AVP flags this to the Committee because "accrued" is undefined.
  *   **The Risk:** If you rule a right is *not* accrued, and a member sues, a judge may define it differently (as happened in your previous litigation).
  *   **The Fix:** The Committee needs to adopt a **Definition of Accrual**. Suggested definition: *"A right is accrued only when a member has formally initiated a process relying on that rule (e.g., submitted a written appeal, filed a claim) prior to the notice of the GM being issued."* Mere eligibility does not count.

  ### 3. The "Ghost Rules" History
  *   **The Problem:** If past amendments failed Test 1 (Threshold) or Test 3 (Locks) but were printed in the Handbook anyway, your current Rulebook contains void rules.
  *   **The Risk:** You might be enforcing rules that have no legal basis.
  *   **The Fix:** You cannot retrospectively invalidate past years without chaos. However, for the next Consolidation Motion, you must audit the text. If a rule relies on a void amendment, it must be re-proposed as a fresh motion. Flag this as a **Long-Term Project** for the Rules Committee.

  ### What This Procedure Cannot Do
  1.  **It cannot stop a determined majority.** If 80% of members vote to seize all assets and dissolve the institute, the AVP will rule that valid (provided thresholds are met). This is a political check, not a legal one.
  2.  **It cannot resolve external law.** If a motion violates employment law or charity commission regulations, the AVP will say "Valid," but the regulator will overrule you. Always add the disclaimer: *"Subject to compliance with external statutory law."*
  3.  **It cannot fix ambiguity in the motion text.** If the wording of the motion is unclear, the AVP cannot determine intent. That is a matter of interpretation for the Chair/Committee.

  ***

  **Summary for the Committee:**
  Adopt this procedure. It separates mechanical validity (which I can rule on) from value judgments (which you must decide). It protects you from accusations of arbitrariness because the tests are binary. It acknowledges the mess in A2 and A4 without trying to solve them in a single afternoon.
