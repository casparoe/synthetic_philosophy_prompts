answer: |-
  The drying room on Platform Delta smelled of wet rubber, diesel, and the metallic tang of heated iron. It was a small, tiled box where the night crew shed the North Sea before entering the mess hall. In the center sat the grate, a cast-iron grid humming with steam heat from the pipes below. Every shift, twelve men placed their heavy Wellington boots upon it.

  There were two ways to place them. You could stand them with toes pointing toward the wall, heels toward the room. Or you could stand them with toes toward the room, heels toward the wall.

  Functionally, it did not matter. The heat rose evenly. The leather dried at the same rate. The only cost was spatial. If everyone matched, you could walk the narrow aisle between the lockers and the grate without catching a shin on a protruding heel or tripping over a splayed lace. If they mismatched, the aisle became a obstacle course. A stumble here meant spilled tea, a bruised ego, or a cursed oath in front of the foreman.

  For the first month of the platform's operation, the boots were mixed. Half the crew pointed toes in; half pointed toes out. It was a minor friction, a daily tax of attention paid by everyone passing through.

  The tie-breaker was a rust stain.

  It started with Miller, a roustabout from Aberdeen. On a Tuesday, he placed his boots toes-in. The steam valve behind the wall had a slow leak, invisible until you were close. It hissed a jet of scalding vapor directly onto the toe caps of Miller's boots. He didn't notice until he put them on an hour later and the heat blistered his pinky toes. He spent the shift limping. He spent the night cursing the wall.

  The next day, Miller placed his boots toes-out. He didn't say anything. He just turned them around. Two men saw him. They remembered the limp. They turned theirs around. By Friday, every pair on the grate faced the room. The rust stain behind the wall remained, unnoticed by anyone else, but the behavior had cascaded.

  Three years later, Elias stood in the drying room watching a rookie named Kael. Kael was new to the platform, though not to the work. He stepped out of his wet gear, bent down, and placed his boots toes-in toward the wall.

  Elias felt a spike of irritation hot enough to match the grate. It wasn't about the space; the aisle was wide enough. It was the wrongness of it. The visual dissonance of a single pair breaking the line.

  "Turn them around," Elias said. His voice was flat.

  Kael paused, one hand on his locker. "Why? They dry the same."

  "It's not about drying," Elias said. He picked up a rag and wiped a non-existent spot on the bench. "It's about airflow. Heels to the wall blocks the vent. Toes out lets the heat circulate properly. Keeps the leather from cracking."

  Kael looked at the wall. There was no vent. There was only solid tile and the rust stain, now darkened by years of grime. "There's no vent there, Elias."

  "It's the principle," Elias said. He looked at Kael, and the look carried weight. It wasn't just a correction; it was a boundary. To leave them toes-in was to say you didn't care about the gear, that you thought you were too good to follow the way things were done. It was a small disrespect that implied a larger arrogance. Kael saw the tension in Elias's jaw, the way the other three men in the room had stopped moving to watch. He turned the boots around.

  "Right," Kael said. "Airflow."

  They both knew it was a lie. But the lie had hardened into a fact. To question it was to insult the crew who maintained the gear.

  Six months later, the Safety Officer visited from the mainland. He was a man in a crisp shirt who smelled of laundry detergent, not salt. He walked the platform, measuring clearances, checking logs. He stopped in the drying room. He paced the aisle. He took out a laser measure.

  "Heels to the wall saves four inches of floor space per pair," the Officer said at the morning briefing. He projected a slide showing the optimized layout. "In an evacuation, those inches matter. Effective immediately, all boots must be placed toes-in. Heels to the room."

  He printed a laminated sign and taped it to the door. *SAFETY PROTOCOL 44-B: FOOTWEAR ORIENTATION.*

  Elias walked into the drying room an hour later. He looked at the sign. He looked at the grate. He thought about the evacuation scenario. It made sense. Four inches per pair meant a clearer path to the lifeboat station. It was objectively better for everyone.

  Elias placed his boots toes-in. He waited.

  The next man in was Kael. Kael saw the sign. He saw Elias's boots. But Kael also knew what the rest of the crew would do. He knew that if he placed his boots toes-in, and the next man placed them toes-out, the aisle would be blocked. He knew Elias expected him to place them toes-out because that was what everyone else would do. The sign changed the rule, but it didn't change the expectation.

  Kael placed his boots toes-out.

  By the evening shift, the sign was still on the door, but the grate was a uniform line of toes pointing at the room. The Safety Officer's mandate had failed not because the men were stubborn, but because the mandate could not coordinate their beliefs. No one wanted to be the only one to follow the rule and trip over the majority who didn't. The cost of coordination failure was higher than the cost of ignoring safety. The sign became just another piece of paper on the wall, ignored like the vent that didn't exist.

  The change came two years later, during the refurbishment. The old cast-iron grate had corroded through. The replacement was shipped from a different supplier, a stamped steel model with a different design.

  The new grate had a raised lip along the outer edge, a ridge intended to catch runoff water. It was only an inch high, but it was sharp. If you placed your boots toes-out, the toe caps caught on the lip. The boots wouldn't sit flat. They wobbled. They fell over.

  Elias walked in on the first day of the new grate. He held his boots. He tried to place them toes-out. The lip caught the rubber. The boot tipped. He cursed. He turned them around. Toes-in. They sat flat. Heels out.

  He looked around. The other men were doing the same. The physical constraint had shifted the equilibrium instantly. There was no debate. There was no meeting. The geometry of the room had changed, and so the coordination point shifted to the only stable solution.

  A week later, a new rookie arrived. He placed his boots toes-in, because the lip made it impossible to do otherwise.

  Elias walked past him. "Good," Elias said.

  "Is there a reason?" the rookie asked. "Safety?"

  Elias looked at the boots. He looked at the rust stain on the wall, now painted over but still faintly visible beneath the white gloss. He thought about the steam valve, the Safety Officer, the laminated sign peeling off the door. None of it mattered. The boots were stable. The aisle was clear.

  "It's about respect," Elias said. "Heels to the room shows you're ready to move. Toes in means you're settling in. It's the proper way."

  The rookie nodded, accepting the truth of it. He wiped his hands on his trousers and walked into the mess hall. The grate hummed beneath the boots, heating the leather, indifferent to the reason given. The new convention had set, hard and arbitrary as the old one, and already it felt like it had always been this way.
