      *   *Computable World:* SI *only* works if the true environment is computable (specifically, lower semicomputable semimeasure). If the world is uncomputable (e.g., involves a halting oracle), SI fails.
      *   *Exponential Penalty:* It's load-bearing. It ensures the prior sums to $\le 1$ (Kraft's inequality). Without it, you can't normalize. It also drives the "Occam" behavior.
