answer: |-
  So, everyone loves to cite Hacking on looping effects to prove that psychiatric categories are just social constructions. The logic is usually: if naming a thing changes the thing, then the thing wasn't "real" to begin with. It's just a feedback loop of expectations and behaviors. But I think that's a misread. Actually, if you break down *how* looping works, it suggests these kinds might be way more stable than we think. The problem isn't the looping itself, it's something else entirely.

  Here's the pivot: we need to split looping into two types. First, there's **Mechanistic Looping**, where the label actually rewires the underlying cognitive or neural machinery. Like, knowing you have "social anxiety" literally alters the amygdala response in a novel way that didn't exist before the label. Second, there's **Expressive Looping**, where the label changes how you report symptoms or perform the behavior, but the underlying engine is the same.

  My claim is that for almost all the big DSM categories—ADHD, BPD, Depression—the looping is almost entirely Expressive.

  Think about it. If I get diagnosed with ADHD, I might start using planners, or I might start framing my forgetfulness as a "symptom" rather than a moral failing. My behavior changes becuase I have a script now. But the attentional deficit? The working memory bottleneck? That's likely still humming along underneath. The label doesn't create the deficit; it just gives the deficit a new vocabulary. If the underlying mechanism is stable, then the psychiatric kind is stable. The looping just adds a layer of self-narrative on top of a biological reality. So, far from proving these categories are fake, expressive looping actually highlights that there's a "there" there that persists despite the cultural noise.

  But here is where it gets messy, and this is the part nobody talks about: **Diagnostic Shadowing**.

  Shadowing happens when clinicians and researchers forget the distinction between the pre-loop and post-loop patient. Over time, the "looped" version—the self-aware, Google-savvy patient who presents their symptoms using clinical terminology—becomes the canonical form of the disorder. The original, pre-loop clinical picture gets erased from the textbooks and criteria.

  For example, imagine what Borderline Personality Disorder looked like in a patient in 1950 versus 2024. The 2024 patient might explicitly describe "emotional dysregulation" or "fear of abandonment" becuase they've read the criteria. The 1950 patient might have just presented as "difficult" or "hysterical." If the DSM updates its criteria based mostly on the 2024 presentation, it's codifying the *reaction to the label* rather than the *cause of the distress*.

  This is what's actually bad for classification. It's not that people change (they always do); it's that we lose the baseline. We stop being able to see the disorder in its raw form. Diagnostic shadowing makes the category drift, not because the kind is unstable, but because our measurement tool is getting contaminated by the subject's awareness of the tool.

  So, the fix isn't to abandon the categories or claim they're social constructs. The fix is to treat the pre-loop presentation as a vital historical reference point. Psychiatric manuals should preserve baseline, pre-loop descriptions alongside the current criteria. We need to know what the machinery looks like before the user reads the manual. If we do that, we can see that looping doesn't dissolve the kind—it just complicates the interface. And honestly, accounting for that makes psychiatry more scientific, not less.
