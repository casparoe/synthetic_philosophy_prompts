prompt: |-
  I'm on the market this year and my job paper is on evidential cooperation in large worlds — the view, roughly, that once you stop modelling a decision problem as a fully specified small world in which my act fixes the outcome, and instead let the agent be uncertain about which situation it's really in (uncertain about the world-model, not just about a state within it), then my own deliberation becomes genuine evidence about what the other agent does, and evidential decision theory starts cooperating in cases where everyone assumed it had to defect. My central case is one I made up, the two cartographers: Ada and Bob are mapping the same valley from opposite ridges, they never meet, they can't communicate, there's no predictor, no shared code, and no common cause either of them can observe, and the payoffs are deliberatly asymmetric — she gets 3 from a completed map and he gets 2, sending a survey party over the pass costs each of them 1 — so nothing about similarity or twinhood can do any work. The only thing linking them is that both are uncertain about the same unmodelled structure, i.e. about which of the candidate world-models is actual, where their own acts are among the things that vary across those models, and I argue that this shared uncertainty is enough to make the probability that the other one sends, conditional on my sending, exceed the probability conditional on my staying, and that this is a real correlation in the grand world rather than a superstition about similarity. I've got a flyout in two weeks and I honestly havent decided whether the argument survives contact with a room that isn't already sympathetic, so I'd really like a proper Q&A prep sheet.

  The room is: a senior game theorist who's basically a micro theorist with a philosophy appointment, thinks in Bayesian games and Harsanyi types and correlated equilibrium, and is going to hear my correlation as a correlation device — an assumption about the environment smuggled in as a norm of choice; two causal decision theorists of the interventionist Bayes-net stripe who will want the graph drawn on the board and will say that if there's a common node in it then their theory gets the same answer and my case is no argument for evidentialism at all; one formal epistemologist who likes evidential decision theory but is a ratificationist sceptic and worries about fixed points that don't exist or aren't unique; a historian of decision theory who will press me hard on whether large world is doing real Savagean work or is just a slogan I hide behind when the small-world approximation gets inconvenient; a junior person working on functional decision theory and program equilibrium who thinks what I'm describing is a special case of their view with worse branding; and one moral philosopher on the committee who will ask, very politely, why any of this is a question about rationality rather than about what kind of agent you'd want to build.

  Can you draft me the prep sheet? Give me the eight or so objections I'll actually get from these people — not the ones I'd get from an online rationalist audience — ordered by how much damage they'd do rather than by how likely they are, each one phrased the way that particular person would put it, in their own vocabulary (correlation device, intervention, ratifiable, knife-edge, measure zero, off the equilibrium path), with a two-minute answer for each and an honest note on where my answer is soft. Tell me what I should concede in the first five minutes before anyone asks anything, tell me which single reply has to land or the paper is basically dead, and tell me which objection is really an older debate wearing a new hat that I should pre-empt on slide two. My talk is 45 plus 20, the case is on slide six, and I've got about two minutes per answer. Also: I have my own guess about the question I'm hoping nobody asks — something about the whole thing being the tickle defence in a trenchcoat, or about cooperation washing out once there are more than two agents, which is awkward given the word large — but I want yours.
