answer: |-
  # Q&A Prep Sheet: Evidential Cooperation in Large Worlds
  **Candidate:** You  
  **Topic:** ECL / Two Cartographers  
  **Time:** 45 + 20  
  **Goal:** Survive the flyout without the core mechanism being dismissed as a modelling trick.

  ---

  ### 🛑 Pre-Flight Checks (First 5 Minutes)

  **1. The Concession (Say this before Q&A starts)**
  "I want to be clear upfront: This result is prior-dependent. I am not claiming ECL works for *any* prior over world-models. I am claiming that in the specific epistemic condition of 'Large World' uncertainty—where the agent is uncertain about the partition itself, not just the states within it—the standard CDT restriction on conditioning is too strong. If you assume a Harsanyi common prior over the *models*, the correlation emerges. If you don't, it doesn't. I am arguing that the 'Large World' stance *requires* that prior structure."
  *Why:* Pre-empts the Game Theorist accusing you of smuggling in a correlation device. You admit the cost to buy the benefit.

  **2. The Pre-Emption (Slide 2)**
  Define "Small World" vs. "Large World" using Savage's original distinction, not the colloquial "complex environment" sense.
  *Say:* "Small World is not just 'simple.' It is a model where the agent knows the partition of states. Large World is where the partition itself is the object of uncertainty. My argument fails if you treat this as a Small World problem with a large state space. It only works if the *model* is the random variable."
  *Why:* Stops the Historian and CDT people from re-drawing your graph as a standard Bayesian game immediately.

  **3. The Single Reply That Must Land**
  **The distinction between *Causal* Correlation and *Indexical/Model* Correlation.**
  If you cannot convince the CDT folks that a correlation can exist without a common cause *node in the graph*, you lose. You must argue that the "common cause" is the *actual world-model*, which is exogenous to the graph because the graph is *inside* the model.
  *Mantra:* "The correlation isn't in the graph; the correlation is about *which* graph is actual."

  ---

  ### ⚔️ The 8 Objections (Ordered by Damage Potential)

  #### 1. The Causal Decision Theorist (Interventionist)
  **The Objection:** "You say there's no common cause, but if $P(Other|Me) \neq P(Other)$, then by Reichenbach's Common Cause Principle, there *must* be a common cause in the ontology. If you put that node in the DAG, my $do(\cdot)$ operator screens it off. You haven't broken CDT; you've just drawn an incomplete graph. If you complete the graph, CDT cooperates, and your argument for EDT is dead."
  **The 2-Minute Answer:** "I agree that if we fix the world-model, there must be a causal story. But in a Large World, the agent doesn't know *which* graph is actual. The 'common cause' is the truth of the world-model itself, which is not a variable *within* the graph but a parameter *of* the graph. CDT tells me to intervene on the graph I *have*. EDT tells me to update on which graph I'm *in*. My act is evidence for 'I am in the graph where cooperation happens' because my deliberation process is part of the structure that defines that graph. You can't intervene on the model selection from inside the model."
  **Soft Spot:** This relies on the metaphysics of "models" vs. "worlds." If they insist the model selection must be a node, you're back to square one.

  #### 2. The Senior Game Theorist
  **The Objection:** "This looks like a Correlated Equilibrium where you've assumed a correlation device (the shared uncertainty over models) but refused to name it. In Harsanyi's framework, if you have a common prior over types, you get correlation. You're just describing a Bayesian Game with a specific prior that induces correlation. Why is this a decision theory result and not just a claim about the environment?"
  **The 2-Minute Answer:** "In a standard Bayesian Game, the types are fixed at the start. Here, the 'type' includes the agent's deliberation output. The correlation isn't imposed by an external device; it's derived from the fact that both agents are running the same *epistemic update* on the same *unmodelled structure*. It's not a correlation device in the environment; it's a correlation in the *mapping* from environment to payoff. I'm arguing that rational agents in Large Worlds *must* treat their own deliberation as a sample from the population of deliberations, which induces the correlation endogenously."
  **Soft Spot:** If they say "That sample assumption *is* the correlation device," it's hard to deny. You are relying on the "Large World" label to do normative work.

  #### 3. The Historian of Decision Theory
  **The Objection:** "Savage's 'Large World' was a problem to be solved by reduction to Small Worlds, not a feature to be exploited. You're treating the failure of the Small World approximation as a normative resource. Isn't this just saying 'When the model is incomplete, assume your act fixes the gaps'? That's not Savagean; that's magic."
  **The 2-Minute Answer:** "Savage admitted we can't always reduce to Small Worlds. My claim is that when we can't, the standard 'fix the model then decide' heuristic fails because it ignores the information contained in the *ability* to decide. I'm not saying the act fixes the gaps magically; I'm saying the act reveals which gap-filling model is actual. It's not magic; it's Bayesian updating on the model space, which standard decision theory ignores by fixing the model ex ante."
  **Soft Spot:** You are arguably changing the definition of rationality from 'maximizing within a model' to 'selecting the right model via action.'

  #### 4. The Junior FDT / Program Equilibrium Person
  **The Objection:** "This is just Functional Decision Theory. You're saying my output is logically dependent on theirs because we share the same uncertainty structure. FDT already handles this via subjunctive dependence. You've reinvented the wheel but removed the formal machinery (source code) that makes it work, replacing it with vague 'world-model' talk. Why is this better than FDT?"
  **The 2-Minute Answer:** "FDT requires logical dependence—shared code or identical algorithms. My Cartographers have asymmetric payoffs and potentially different algorithms. They don't need to be twins; they just need to be uncertain about the same external structure. FDT fails if the agents are sufficiently different. ECL works as long as they share the *uncertainty*, even if their processing differs. It's a broader class of cooperation based on epistemic overlap, not logical identity."
  **Soft Spot:** If they press that "epistemic overlap" *is* a form of logical dependence, you lose the distinction.

  #### 5. The Ratificationist (Formal Epistemologist)
  **The Objection:** "Is this decision ratifiable? If I decide to send the party, do I still prefer sending conditional on having decided to send? In asymmetric cases like your Cartographers, fixed points often don't exist or aren't unique. If the equilibrium is unstable, you can't recommend the action."
  **The 2-Minute Answer:** "In the Two Cartographers case, the asymmetry ($3 vs $2) is known. The correlation makes sending evidentially favorable for both, provided the probability shift is strong enough. Ratification holds if $EU(Send|Send) > EU(Stay|Send)$. Given the cost is 1 and benefit is 3 (or 2), we only need a small probability boost. I show in the appendix that for a wide class of priors, the fixed point exists. It's not knife-edge; it's robust to prior noise."
  **Soft Spot:** If they find *one* prior where the fixed point vanishes, they will claim the theory is unstable.

  #### 6. The Moral Philosopher
  **The Objection:** "Why is this a question about *rationality*? It sounds like you're describing what kind of agent you'd want to *build* to get good outcomes. Rationality is about responding to reasons, not about engineering dispositions to cooperate in opaque scenarios."
  **The 2-Minute Answer:** "If rationality is about maximizing expected utility given one's epistemic state, then ignoring the evidence provided by one's own deliberation is irrational. I'm not arguing for a disposition; I'm arguing that the *evidence* is there to be used. If you ignore it, you are leaving utility on the table not because of a moral failing, but because of an evidential blind spot."
  **Soft Spot:** They may press that "evidence" here is circular (my act causes the evidence).

  #### 7. The "Tickle Defence" Objection (The Scary One)
  **The Objection:** "This is the Tickle Defence in a trenchcoat. In medical Newcomb cases, EDT fails because the agent can screen off the correlation by conditioning on their own mental state (the 'tickle'). Here, once Ada knows she has decided to send, doesn't that screen off the correlation with Bob? Why doesn't $P(Bob|Ada \& Decision)$ collapse to $P(Bob|Decision)$?"
  **The 2-Minute Answer:** "The Tickle Defence works when the correlation is mediated by a physical state (like a lesion). Here, the correlation is mediated by the *world-model*. Knowing my decision doesn't tell me which model is actual; it only updates the probability. The 'tickle' (my mental state) is part of the data that updates the model probability. It doesn't screen it off; it *is* the signal. You can't condition on the decision without conditioning on the model evidence it carries."
  **Soft Spot:** This is the hardest technical fight. If they convince the room that the decision *is* the screening variable, EDT collapses.

  #### 8. The Scaling Objection (N-Agents)
  **The Objection:** "You call this 'Large Worlds,' but your case is dyadic. If there are 1,000 cartographers, my individual impact is negligible. Does ECL wash out in large populations? If so, 'Large World' cooperation is practically irrelevant."
  **The 2-Minute Answer:** "ECL scales differently than causal impact. In CDT, my impact dilutes with $N$. In ECL, my act is evidence about the *global* strategy profile. If I cooperate, it raises the probability that *everyone* cooperates. The expected value can actually increase with $N$ because the total pot grows, even if my marginal causal contribution shrinks. It's not about my impact on the world; it's about the world's impact on me, conditional on my type."
  **Soft Spot:** Requires careful math to show the expectation doesn't converge to zero.

  ---

  ### 🕵️‍♂️ The Question You Hope Nobody Asks
  **The Question:** "If the correlation relies on shared uncertainty about the world-model, doesn't that require a 'Common Prior' over models? If Ada and Bob have different priors over the models (which is allowed in Large Worlds), does the cooperation vanish? If so, isn't this just Harsanyi's Common Prior Assumption doing all the work?"
  **Why it's scary:** It reduces your "Evidential Cooperation" to "Assume Agents Agree on Priors." If cooperation vanishes with divergent priors, the Game Theorist wins (it's just a specific prior assumption), and the CDT person wins (you assumed away the disagreement).
  **Backup Answer:** "It requires *some* overlap in the support of the priors, not identity. If Ada thinks Model A is impossible, she can't learn from Bob. But rational agents in the same Large World should converge on the *structure* of uncertainty even if they differ on parameters. I argue the 'Large World' constraint imposes a minimal commonality on the model space itself." (This is weak, but it's the best you have).

  ---

  ### 💡 Final Advice for the Room
  *   **Board Work:** When the CDT person asks for the graph, **draw two graphs.** Label them "Model A" and "Model B." Draw a probability distribution over the two graphs. Show that your act selects the graph. This visualizes the "uncertainty over models" better than words.
  *   **Tone:** Do not sound like you are saving EDT from its flaws. Sound like you are extending decision theory to a domain (Large Worlds) where the standard tools were never designed to work.
  *   **The "Win":** You don't need to prove ECL is *true*. You need to prove it is *coherent* and *distinct* from FDT/CDT. If you survive with "It's a coherent, distinct approach to model uncertainty," you pass.

  Good luck. You know the case better than they do. Make them draw the graph they think you should have drawn, and then show them why it misses the uncertainty.
