answer: |-
  It is a pleasure to address a question posed by someone who brings the rigor of experimental physics to the history of philosophy. Your intuition that Hobbes is a precursor to the computational view of reason is well-founded, yet your hesitation regarding the *human* element of his epistemology touches the nerve of his entire system.

  To reconstruct Hobbes's probable reaction to modern proof assistants (like Lean) and the mechanization of proof, we must distinguish between two concepts in his work that are often conflated: **reckoning** (*computatio*) and **philosophy** (*scientia*). While Hobbes famously defined reason as "nothing but reckoning," he did not believe that any symbol manipulation constituted knowledge.

  Here is a reconstruction of his position, weighing the "Delight" hypothesis against the "Objection" hypothesis, grounded in his specific disputes with Wallis and his ontological commitments.

  ### 1. The Case for Delight: The Settlement of Controversy
  There is a compelling textual basis for believing Hobbes would welcome the *mechanism* of proof verification. In *De Corpore* and *Computatio sive Logica*, Hobbes argues that the certainty of geometry arises because it proceeds from definitions that are arbitrary (we stipulate them) to consequences that are necessary. Disputes in geometry, he argued, arise only from ambiguity in language or errors in calculation.

  **The Wallis Parallel:**
  Your mention of the Wallis controversy is crucial. Hobbes's feud with John Wallis (spanning decades) was fueled by Wallis's use of algebraic symbolism and infinite series to claim solutions to problems like the quadrature of the circle. Hobbes viewed Wallis's algebra as "a scumble of marks" that signified no clear magnitude. He believed Wallis was winning arguments through rhetorical obscurity and the manipulation of symbols that lacked geometric referents.

  Hobbes would likely view a proof assistant as the ultimate arbiter of this dispute.
  *   **Elimination of Ambiguity:** In Lean, a definition must be precise. You cannot smuggle in an intuitive notion of "infinity" or "magnitude" without defining its type and constructors. This aligns with Hobbes's demand that geometry be reduced to a small number of clear definitions.
  *   **The End of Rhetoric:** Hobbes hated the "vain philosophy" of the scholastics and the "drunken geometry" of the algebraists because both relied on persuasive language rather than necessary consequence. A machine check is immune to rhetoric. If Hobbes could have uploaded his quadrature claims and Wallis's refutations into a system that mechanically verified the steps, he would have believed the machine would vindicate him (rightly or wrongly) by exposing exactly where the "reckoning" went wrong.

  On this level, Hobbes would be delighted. The mechanization of proof realizes his dream of a *Logica Calculans* where truth is decided by "let us calculate" (*calculemus*).

  ### 2. The Case for Objection: Construction and Signification
  However, the stronger philosophical argument suggests Hobbes would ultimately reject the *epistemic status* of machine-verified proofs that exceed human surveyability. This rests on his specific view of what geometry *is*.

  **Geometry as Kinematics, Not Logic:**
  For Hobbes, geometry is not merely the study of static relations between abstract objects; it is the study of **generated magnitude**. In *De Corpore*, he defines a line as the trace of a moving point, a surface as the trace of a moving line. Certainty exists because the geometer knows the *cause* of the figure: the geometer is the cause. We know the properties of a circle because we know how it was made (rotation of a radius).

  *   **The Problem of "Black Box" Proofs:** The Feit–Thompson theorem, verified by machine, is too long for any human to read. For Hobbes, if a human cannot survey the derivation, they cannot possess the *scientia* (knowledge of cause) of the conclusion. They possess only belief in the machine's authority. Hobbes writes in *De Homine* that "to know is to have an idea of the generation of the thing." A proof that functions as a black box verifies *truth* (the proposition is correct) but fails to provide *knowledge* (the reason why).
  *   **Signification of Terms:** Hobbes was a nominalist. He believed words signify nothing but our own conceptions. In *Examinatio et Emendatio Mathematicae Hodiernae* (1660), he attacks algebraic symbols that do not correspond to conceivable magnitudes. He would likely view the underlying code of a proof assistant with suspicion. If the type theory relies on axioms (like the Axiom of Choice or classical logic principles that assert existence without construction), Hobbes would classify these as "insignificant speech." He would ask: "Does this symbol correspond to a magnitude I can conceive and construct?" If the machine manipulates tokens that have no geometric genesis, it is, to Hobbes, no different from Wallis's algebraic dust-scattering.

  **The Strongest Argument for Objection:**
  The strongest argument against Hobbes's acceptance is that **computation without conception is not reasoning.** For Hobbes, reasoning is the addition and subtraction of *conceptions*, not just marks on paper. If the machine performs the reckoning, but the human mind does not hold the conceptions corresponding to the steps, the human has not reasoned. They have merely observed a physical event (the screen changing). Hobbes would argue that a proof no human can read is not a proof *for a human*, and since philosophy is the knowledge of consequences acquired by reasoning, it falls outside the realm of philosophy.

  ### 3. Vindication or Betrayal of the Euclid Project?
  You asked whether he would regard the formalization of Euclid as a vindication or a betrayal. The answer is likely **a vindication of his method, but a betrayal of his ontology.**

  **Vindication:**
  Hobbes criticized Euclid for logical gaps, undefined terms, and reliance on diagrams that suggested truths not contained in the definitions. He sought to reconstruct geometry on a firmer axiomatic basis. The formalization of Euclid in Lean (such as the *Flypitch* project or standard libraries) does exactly this. It exposes every hidden assumption. It forces the "reduction to a small number of definitions and postulates" that Hobbes demanded. In terms of rigor, Hobbes would see this as the perfection of the synthetic method.

  **Betrayal:**
  However, modern formalization often rests on set-theoretic or type-theoretic foundations that posit abstract entities. Hobbes was a materialist; he believed nothing exists but body. Mathematical objects are "phantasms" of bodies. If the formalization treats numbers or sets as abstract objects existing independently of human construction (Platonism), Hobbes would reject the ontology. Furthermore, if the formalization allows non-constructive proofs (proving something exists without showing how to make it), Hobbes would view this as a return to the "absurdities" of the scholastics. He would argue that a formal system that permits existence without generation is not geometry, but "a web of words."

  ### Conclusion: The Verdict
  If forced to choose between the two reactions you outlined, **the objection is better supported by the deeper currents of his text**, even though the delight is supported by his slogans.

  Hobbes's slogan is "Reason is Reckoning," which suggests he would love the machine. But his substantive epistemology is "Knowledge is Knowledge of Causes through Construction." The machine provides the reckoning, but it often obscures the cause.

  **His Probable Position:**
  Hobbes would likely treat the proof assistant as a useful **tool for checking**, but not as a source of **knowledge**. He would say:
  > "The machine has verified that the marks follow one another according to the rules we laid down. This settles the dispute with Wallis, for we can now see who broke the rules. But until a man can trace the generation of the figure in his own mind, he does not know the theorem; he only knows that the machine is consistent. We have gained certainty, but we risk losing understanding."

  He would likely demand that any formalization of geometry be **constructive** (intuitionistic), rejecting any step that asserts existence without providing the algorithm for construction. He would view the Feit–Thompson verification with suspicion, not because he doubts the result, but because a proof that cannot be held in the mind is not an act of human reason, and therefore not philosophy.

  In short, he would embrace the **formalization** (the rigor) but reject the **automation of understanding**. He would warn that in our zeal to make reasoning mechanical, we must not make the reasoner obsolete. For Hobbes, the certainty of mathematics comes from the fact that *we* make the objects; if the machine makes the proof, the certainty belongs to the machine, not to us.
