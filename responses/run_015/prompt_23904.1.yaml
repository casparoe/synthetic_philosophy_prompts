answer: |-
  **Joint Statement on Perceptual Timing and the Color Phi Phenomenon**

  **I. Agreed Claims**

  1.  **Stimulus Conditions:** We agree the anchor case involves two static dots (one red, one green) at distinct spatial locations, presented in rapid succession (inter-stimulus interval <100ms).
  2.  **Standard Report:** Observers consistently report a single dot moving smoothly between locations, changing color mid-trajectory. No stationary dot is experienced.
  3.  **Latency:** There is a measurable neural processing delay between stimulus onset and the availability of content for verbal report.
  4.  **Explanatory Burden:** Both accounts must explain how the physical sequence (Red→Green) yields the phenomenological sequence (Motion→Color Change) given the latency.
  5.  **Memory Involvement:** Both accounts acknowledge that memory systems are engaged during the reporting phase; neither denies that memory can be fallible.

  **II. Disagreements Table**

  | Crux | Probe / Argument | Orwellian Prediction | Stalinesque Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Temporal Locus of Construction**<br>Is the illusory content constructed before or after entering conscious awareness? | **Interference Task:** Introduce a secondary task during the processing gap (between stimulus and report) to disrupt memory consolidation without affecting early perception. | Performance degradation will alter the *report* of motion but not the *sensory registration* of static dots (if accessible via forced choice). | Performance degradation will eliminate the *experience* of motion entirely, revealing the underlying static stimuli in experience. |
  | **2. Fact of the Matter**<br>Is there a fact about "when" an experience occurs independent of the report? | **Neural Correlate Timing:** Identify the specific neural firing pattern constituting the "experience" of color change. | The neural signature for "red" occurs first; the "motion" signature is a later memory overwrite. The original experience is datable. | The neural signature for "motion" is the first conscious content. There is no prior conscious "red" state to date. |
  | **3. Nature of Revision**<br>Is post-stimulus revision a change in the *mind* or the *record*? | **Phenomenological Interview:** Use refined probing to distinguish "seeming to remember" vs. "remembering a seeming." | Subjects will distinguish between what they saw (static) and what they recall seeing (motion) under specific questioning. | Subjects will deny any distinction; the memory *is* of the experience, not a revision of it. |
  | **4. Verbal vs. Substantive**<br>Is the distinction merely terminological regarding "experience"? | **Conceptual Analysis:** Apply the Multiple Drafts Model to determine if "conscious experience" implies a single timestamp. | **Substantive:** There is a real distinction between original qualia and later narrative revision. | **Substantive:** There is a real distinction between perceptual construction and memory fabrication. |

  **III. Arbitrator's Assessment on Verbal Dispute**

  We acknowledge a significant verbal component regarding the **dating of experiences**. If "conscious experience" is not a singular event with a precise timestamp (as per the Multiple Drafts Model), then asking whether the revision happens "before" or "after" experience may be category-mistaken. The dispute is substantive only if there exists a non-reportable fact about the temporal ordering of qualia. If experience is constituted by the availability of content for report, the distinction collapses. Both camps agree to treat the dispute as substantive *only* insofar as neural correlates reveal distinct processing stages that can be functionally dissociated.

  **Signatories:**
  *The Orwellian Working Group*
  *The Stalinesque Working Group*
  *Arbitrator: Senior Philosopher of Mind*
