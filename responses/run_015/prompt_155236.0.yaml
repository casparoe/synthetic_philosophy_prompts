answer: |-
  My dear colleague,

  I was fascinated to receive your summary of those recent essays in environmental history, particularly the contention that we ought to treat pathogenic spread, climatic forcing, and volcanic aerosol release as historical actors rather than mere background conditions. The proposal to frame these non-human forces as silent partners in a legal partnership is certainly provocative, and I have spent some time turning the analogy over in my mind to see where it bears weight and where it might crack under the strain of scrutiny. It is a compelling heuristic, one that attempts to grant materiality its due without resorting to mysticism, yet I fear that in striving to avoid crude anthropomorphism, it may inadvertently smuggle in a different set of conceptual errors.

  To audit the analogy properly, we must first lay out the correspondence as the authors intend. In this framing, the human historical agents, such as the peasants rioting over bread or Mary Shelley writing by the fireside, occupy the role of the active partners. They are the ones managing the day-to-day operations, making strategic decisions, and interacting with the public face of the venture. The non-human forces, specifically the Laki fissure or the Tambora eruption, act as the silent partners. Their capital contribution is substantial and undeniable; it consists of the pathogen loads that decimate populations, the altered growing seasons that dictate harvest yields, or the years of diminished insolation that cool the atmosphere. The partnership agreement is implicitly the biosphere itself, the shared space in which this venture operates, though unlike a legal contract, it is not signed nor negotiated. The profits and losses are the historical outcomes themselves, ranging from political unrest and famine to cultural artefacts like Frankenstein. Finally, the dissolution clause is perhaps the most stark aspect of the mapping; the silent partner possesses the unilateral power to dissolve the venture by withdrawing support or escalating force, effectively ending the human enterprise through catastrophe or death, all without casting a vote or possessing strategic intent.

  However, it is precisely in the legalistic texture of this metaphor that the mapping begins to fracture. A silent partnership in law is a normative construct built upon consent, fiduciary duty, and liability. Partners choose one another, or at least enter a framework where mutual obligations are understood and enforceable. By importing the language of partnership, there is a risk of quietly attributing a form of contractual obligation to nature that simply does not exist. A volcano does not owe the peasantry a harvest, nor does it bear liability for the unrest that follows its eruption. Furthermore, the concept of shared liability implies that if the venture fails, the silent partner could theoretically be held to account or bear a share of the blame in a moral or legal sense. While the historians likely do not intend to sue Tambora, the metaphorical structure suggests a reciprocity of responsibility that obscures the absolute indifference of geological forces. There is no representation rights for the aerosol; it cannot be outvoted, nor can it negotiate terms when the active partners attempt to mitigate its effects. This lack of reciprocity suggests that the relationship is less a partnership and more a form of tenancy where the landlord is unconscious and occasionally destructive.

  This leads us to the crucial question of determinism. You asked whether granting these forces partner status genuinely avoids environmental determinism or merely relocates it inside a corporate metaphor. I am inclined to suggest the latter. In a business partnership, if the silent partner provides the essential capital without which the venture cannot operate, and retains the right to dissolve the venture unilaterally, they hold the ultimate leverage. If the capital contribution of the silent partner is large enough, such as a volcanic winter that prevents photosynthesis across a hemisphere, the decisions of the active partner become epiphenomenal. The human agents are reduced to managers of a crisis they did not create and cannot solve, their agency confined to reacting to the constraints imposed by the silent partner. By calling this a partnership, we might soften the blow of this determinism, making it sound like a collaboration rather than a subjugation, but the causal weight remains disproportionately on the non-human force. It risks suggesting that history is a joint venture where nature holds the majority share, which may ultimately diminish the complexity of human political and cultural response to mere administrative shuffling in the face of inevitable natural dictates.

  Consequently, I am sceptical that the conclusion we ought to rewrite revolutionary or cultural historiography to list Laki or Tambora as named agents survives once these disanalogies are placed on the table. To list Tambora alongside Robespierre or Mary Shelley as an agent implies a level of intentionality and interactive capacity that the silent partner analogy itself denies. It creates a category error where conditions are mistaken for characters. While it is vital to acknowledge that the Year Without a Summer was constitutive of the mood in which Frankenstein was composed, treating the weather as a co-author confuses the stage with the actors. A different analogy might serve more honestly, perhaps one drawn from theatrical lighting or musical orchestration. In a theatrical production, the lighting design does not act, nor does it have intent, but it determines what is visible, sets the mood, and constrains where the actors can move without falling into darkness. Similarly, an orchestral score sets the key and the tempo, limiting the range of notes available to the soloist without dictating every flourish. These metaphors preserve the agency of the human actors while acknowledging the constitutive power of the environment without imbuing it with false legal or agential status.

  Ultimately, while the silent partner analogy succeeds in dragging environmental forces out of the scenery and into the foreground of historical explanation, it risks dressing them in clothes that do not fit. It invites us to look for contracts where there are only causes, and liabilities where there is only indifference. I suspect we are better served by viewing these forces as the conditions of possibility for history rather than participants in it. We should rewrite our historiography to account for the weight of the aerosol and the pathogen, certainly, but we need not grant them a seat at the boardroom table to acknowledge their power. To do so might protect us from ignoring nature, but in doing so, it may inadvertently obscure the specific, fragile, and remarkable nature of human agency itself. I hope these reflections prove useful as you continue to engage with these stimulating texts.

  Yours sincerely,

  A Friend
