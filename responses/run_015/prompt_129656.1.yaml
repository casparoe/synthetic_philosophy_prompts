answer: |-
  TO: State Legislature
  FROM: Forensic Science Advisory Board
  RE: Protocols for Latent Friction Ridge Examination
  DATE: 15 September 2023

  The Board recommends the immediate adoption of Package One (isolation and sequential unmasking), augmented by the documentation requirements of Package Two, as the mandatory standard for all latent friction ridge examinations. We reject the continued use of unmasked contextual information because the risk of wrongful conviction outweighs the operational costs of blinding, and we cannot wait for scientific certainty to protect liberty interests.

  This recommendation follows our review of the Alvarez matter, wherein an examiner's conclusion shifted from "no value" to "identification" solely after exposure to case context, despite no change in the evidentiary images. To determine the appropriate remedy, the Board analyzed the mechanism by which contextual information influences examiner judgment. We distinguished three routes: the appearance route, where information alters how the mark is perceived; the selection route, where information dictates which features are sampled; and the reporting route, where perception remains stable but the threshold for declaring a match shifts. These routes demand different interventions. Blinding is strictly necessary if context operates on appearance or selection, as no amount of documentation can correct a perceptual distortion. Blinding is less critical if context operates solely on the reporting threshold, which can be managed through auditable decision records.

  The Committee proposed a probe to distinguish these mechanisms: re-presenting examiners with the same comparison after explicitly retracting the contextual information as false. The logic holds that if the effect is purely on the reporting threshold, the examiner should reverse the identification once the justification for a lower threshold is removed. If the effect operates on appearance or selection, the examiner will likely maintain the identification because the perceptual encoding has already been altered. A null result in this study—where examiners maintain their identification despite the retraction—would indicate that context has permanently altered perception or feature selection, strongly validating the need for Package One. Conversely, if examiners consistently reverse their conclusions upon retraction, it would suggest the bias is deliberative, lending credence to Package Two. However, the Board advises against delaying policy implementation for this study. Running this probe in-house within two quarters is feasible but methodologically fragile. Our sample of examiners is small, limiting statistical power, and an in-house study will inevitably face criticism regarding its own blinding protocols. While we endorse this research for future guidance, the current uncertainty requires us to assume the worst-case mechanism: that context alters perception itself.

  Therefore, the Board mandates the following concrete changes. First, all latent print examinations must proceed under sequential unmasking. Examiners will receive the latent mark and known prints stripped of case facts, suspect identity, and colleague conclusions. Second, recognizing the Laboratory Director's concern that some context is signal rather than noise, examiners may request specific technical data—such as substrate type or deposition pressure—after recording their initial comparison features, but before reaching a conclusion. Third, adopting the strength of Package Two, examiners must document the specific ridge features relied upon prior to stating any conclusion, and verification must be performed by a second examiner blind to the first examiner's conclusion. The State Laboratory Director is responsible for implementation by the start of the next fiscal quarter. The associated costs for redaction staff and workflow management should be absorbed through the requested budget supplemental, as the cost of error exceeds the cost of administration. This protocol will be triggered for revisit if the state's backlog increases by more than ten percent over two consecutive quarters or if a subsequent proficiency test reveals systemic false negatives attributable to information starvation.

  In making this decision, the Board explicitly weighed the asymmetry of error costs. A mistaken identification risks a wrongful conviction, an irreversible harm that destroys public confidence in the justice system. A suppressed or missed identification risks leaving an offender at large, a serious harm that is nonetheless recoverable through further investigation. Under conditions of uncertainty regarding the mechanism of bias, we must prioritize the prevention of wrongful conviction. The Alvarez matter demonstrates that context can move an examiner from "no value" to "identification"; without isolation, we cannot know if that identification rests on ridge detail or narrative coherence. Until we possess definitive evidence that context operates only on the reporting threshold, we must treat all contextual information as potentially contaminating to the perceptual process.

  The strongest argument for the rejected package, Package Two, is that it preserves operational efficiency and acknowledges that forensic science is not performed in a vacuum. The Laboratory Director correctly notes that knowing the substrate or the direction of force can legitimately aid in distinguishing overlapping prints, and that redaction imposes a tangible tax on an already burdened system. We would move to this package if future empirical evidence demonstrates conclusively that contextual information never alters the appearance or selection of features, but only affects the final reporting threshold. Such evidence would need to come from a multi-state, externally validated study showing that examiners consistently revert to "no value" conclusions when biasing context is retracted, proving that the perceptual work remains intact regardless of narrative influence. Until that evidence exists, the Board must err on the side of isolation.
