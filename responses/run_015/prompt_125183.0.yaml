  1. Conceptual Setup
  Standard discourse often treats national character as aggregative statistics (e.g., "60% of Group K are thrifty"). This simulation reframes such claims as modal profile ascriptions: assertions that a specific response pattern is the group's default mode, stable across counterfactual institutional settings. The learning objective is phenomenological. Students must experience the epistemic trap inherent in this framing. To test a modal claim, one must hold background conditions constant to isolate the disposition. However, fixing these conditions renders the claim either unfalsifiable (because the conditions never obtain) or normatively loaded (because the fixed conditions presuppose the very character trait being tested). By the end of the session, students should feel the tension between making a coherent generalization and making an ethically responsible one. They will discover that stability requires stipulation, and stipulation imposes costs. The activity forces them to choose between empirical precision and moral neutrality, revealing that neither option fully sustains the concept of national character without residue.

  2. Materials and Roles
  Divide the 14 students into three teams: Ascribers (5 students), Institutional Redesigners (5 students), and Epistemic Auditors (4 students). Provide each team with a confidential brief regarding "Group K," a fictional nation currently undergoing democratization. The Ascribers receive data showing Group K consistently rejects wealth redistribution in Context A (a high-trust market economy). Their task is to formulate a modal character claim (e.g., "Group K is inherently individualistic"). The Redesigners receive specifications for Context B (a post-scarcity automated economy) and Context C (a crisis survival regime). Their goal is to alter institutional variables to test the stability of the Ascribers' claim. The Auditors receive a rubric for epistemic validity and ethical risk. They hold a pool of 20 "Epistemic Credit" tokens to distribute based on argument quality. Materials include one-page scenario briefs, a commitment ledger for public claims, and colored cards for voting. Roles are designed to generate structural conflict: Ascribers seek stability to validate their theory; Redesigners seek variance to falsify it; Auditors must penalize overgeneralization while rewarding predictive accuracy. The Ascribers must write their claim on a public board. The Redesigners propose changes to the institutional rules governing Group K. The Auditors observe both and hold the power to validate or void claims based on the coherence of the modal inference.

  3. Rules and Timeline
  **Minutes 0–20 (Ascription):** Ascribers analyze Context A data and draft a modal claim about Group K's default behavior. They must state what Group K *would* do, not just what they *did*. They post this claim publicly on the commitment ledger. They are told that stability across contexts yields higher epistemic value. They cannot use statistical language (e.g., "most"); they must use dispositional language (e.g., "inclined to").
  **Minutes 20–50 (Redesign):** Redesigners propose two new institutional contexts (B and C) that alter incentives without explicitly changing individual psychology. They present these to the Ascribers, who must predict Group K's behavior in these new settings based on their character claim. If Ascribers predict stability, they risk falsification if the Redesigners show the behavior changes. If they predict variance, they weaken the character claim, admitting it is context-dependent. Redesigners win points for creating scenarios where the character claim fails unless specified with caveats. Redesigners must ensure contexts are plausible but distinct.
  **Minutes 50–80 (Audit):** Auditors evaluate the exchange using a validity rubric. They assess whether the Ascribers held background conditions constant unfairly to protect their claim (making it unfalsifiable) or loaded the conditions normatively. Auditors distribute Epistemic Credit tokens from their pool. Ascribers lose tokens if they retreat to tautology (e.g., "They act individualistically unless forced otherwise"). This represents the unfalsifiability trap. Redesigners gain tokens if they expose hidden normative assumptions in the institutional design, representing the ethical load. Auditors lose tokens if they fail to identify a logical contradiction. Auditors must justify every token distribution verbally, citing specific moves from the previous phases.
  **Minutes 80–90 (Resolution):** Teams tally tokens. The facilitator announces that no team can win fully; the goal is to reveal the trade-off. Ascribers must either retract the claim or admit it relies on specific institutional maintenance. The final score is secondary to the recorded concessions on the commitment ledger. Any claim remaining on the board must be signed by the Ascribers as their final theoretical commitment. The commitment ledger records every modification to the claim. Each modification costs the Ascribers one token. This creates a tangible cost for refining the theory. This signature acts as a public record of their epistemic stance, binding them to the consequences of their generalization.

  4. The Debrief
  The debrief connects the game mechanics to the philosophical problem. The initial Ascription phase mirrors the intuitive leap from observed behavior to essential character. Students usually feel confident here, assuming the data reflects deep dispositions. This captures the pre-theoretical comfort with national character concepts. The Redesign phase introduces the counterfactual test. When Ascribers struggle to maintain their claim across new contexts, they experience the fragility of modal profiles. They realize that maintaining the claim requires ignoring institutional variance or stipulating away differences.
  The Audit phase forces the core dilemma. If Ascribers add caveats to save their claim (e.g., "in free markets"), Auditors penalize them for making the claim trivial or unfalsifiable. This represents the epistemic cost. If Ascribers insist on stability, Auditors penalize them for ignoring normative factors embedded in the institutions. This represents the ethical cost. This maps directly to the tension between epistemic rigor and moral responsibility. The simulation demonstrates that a modal profile is only stable if the world is held still.
  Finally, discuss the cost of resolution. Retraction preserves ethical safety but abandons explanatory power. Defense preserves theory but accepts normative loading. The token system quantifies this trade-off, showing that "winning" the argument requires sacrificing either precision or neutrality. The goal is not to solve the problem but to inhabit the constraint. Ask students which role felt most difficult. Usually, Auditors feel the burden of judgment most heavily, mirroring the theorist's burden in public discourse. Ensure you highlight that the "character" disappeared not because the people changed, but because the conditions required to see the character were themselves political choices.

  5. Predictable Breakdowns and Fixes
  **Breakdown 1: Statistical Confusion.** Students may treat the claim as "most people do X" rather than "people would do X."
  *Fix:* Intervene early. Remind Ascribers that modal claims must hold even if the majority changes, provided the disposition remains. Enforce dispositional language.
  **Breakdown 2: Adversarial Auditors.** Auditors may act as prosecutors, stalling the game.
  *Fix:* Remind Auditors their goal is coherence, not demolition. They lose tokens if they halt progress without cause. Their role is diagnostic.
  **Breakdown 3: Contrived Fiction.** Students may dismiss Group K as irrelevant.
  *Fix:* State during debrief that Group K is a proxy for any real nation. The structural logic holds regardless of specific content. Emphasize structural parallel.
  **Breakdown 4: Stalemate.** Teams may refuse to concede.
  *Fix:* Enforce the timeline. If no consensus is reached, the claim is voided by default, penalizing the Ascribers. This mimics real-world costs.

  6. Honest Limits
  This simulation cannot reproduce the historical weight of actual stereotypes. In the real world, national-character claims are not abstract puzzles; they are tools of oppression or liberation tied to colonial histories and violence. Students playing Ascribers do not risk harming real people, nor do they face the lived experience of being reduced to a modal profile. This safety sterilizes the ethical stakes.
  As facilitator, you must verbally supply this context. During the debrief, explicitly state that real-world generalizations carry baggage this game omits. Explain that in practice, "modal stability" is often demanded of marginalized groups while dominant groups are granted individual nuance. You must bridge the gap between the clean logic of the simulation and the messy harm of actual discourse. Acknowledge that while epistemic structure is accurate, moral consequence is simulated lightly. The exercise trains conceptual precision, not ethical sensitivity to historical trauma.
