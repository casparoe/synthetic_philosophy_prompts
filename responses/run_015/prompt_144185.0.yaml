          *   Avoid cliché "£10 now vs £15 later" TikTok tropes.
      *   **Specific Requirements:**
          *   *Second-order layer:* Prediction/Precommitment (spend payoff to restrict future choice).
          *   *Aversive task:* Procrastination element (boring/unpleasant task, cost of delay).
          *   *Desired Feelings:* "Now" is special (preference reversal); Difference between gritting teeth vs. rearranging constraints; Ambiguity on rationality (irrational vs. changing preferences).
          *   *Debrief:* Map moments to theory, leave "was it weakness of will?" open.
          *   *Troubleshooting:* Predict failure modes (gamers, renegotiators, resentful precommitters).
