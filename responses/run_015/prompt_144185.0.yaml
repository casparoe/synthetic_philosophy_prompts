      *   *Stage 2 (T=20):* The actual choice moment.
      *   *Problem:* If I give them chocolate now, they eat it. If I promise chocolate later, do they believe me?
      *   *Better Idea:* The "Boring Task" is the cost. The "Reward" is avoiding the task or getting a treat.
      *   *Let's try the "Two Envelopes" approach mixed with a task.*

      *   *Refined Concept:* **The Binding Contract Game.**
      *   *Currency:* "Rationality Points" (RP) convertible to chocolates at the end. Or just direct chocolates. Let's use Chocolates for viscerality.
      *   *Task:* A 5-minute boring transcription task.
      *   *Round 1 (Planning):* Students plan for Round 2.
      *   *Round 2 (Execution):* The actual choice.
      *   *Twist:* The "Later" option gets worse if they wait (Procrastination penalty).

      *   *Let's integrate the "Aversive" requirement specifically.*
      *   Task: Transcribe a paragraph of dense philosophical text (ironic and boring).
