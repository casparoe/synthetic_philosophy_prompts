answer: |-
  Here is a complete run-sheet for a 75-minute session designed to generate lived experience of time inconsistency, precommitment, and the ambiguity of rationality.

  # Activity Title: "The Ulysses Contract"

  ### Core Concept
  Students are endowed with a currency (chits) redeemable for chocolate. They face a choice between a boring task now (shorter duration) or later (longer duration). The "Later" option is objectively worse (more work for same reward), but psychologically easier at T=0 because the pain is deferred. At T=Later, the pain is immediate, leading to preference reversal. They can pay to restrict their future choices (precommitment).

  ### Materials & Budget
  *   **Currency:** 80 small slips of paper ("Rationality Chits"). 5 per student.
  *   **Reward:** 2 bags of cheap chocolates (e.g., Hershey's Kisses). 1 Chocolate = 1 Chit. Redeemable at the door as they leave.
  *   **Handouts:** Two versions (see "Contamination Control" below).
      *   *Text:* A dense, boring paragraph of philosophical text (approx. 200 words).
      *   *Task:* Count the number of commas (or specific letters).
  *   **Whiteboard:** To track aggregate choices (anonymized).
  *   **Timer:** Visible on projector or phone (yours).
  *   **Envelopes:** 16 small envelopes to hold their initial chits (adds formality).

  ### Contamination Control (Two Groups)
  Since Group 2 follows Group 1 and they share a chat:
  1.  **Change the Task:** Group 1 counts **commas** in a Kant excerpt. Group 2 counts **the letter 'e'** in a Nietzsche excerpt.
  2.  **Change the Cost:** Group 1 Precommitment costs **1 Chit**. Group 2 Precommitment costs **2 Chits**.
  3.  **The Script:** Tell Group 1: *"There is a second section after this. If you message them about the mechanics, you ruin their data. I will know if the data is contaminated."* Tell Group 2: *"The previous section ran a pilot variant. Yours is the official version. Ignore rumors."*

  ---

  ### Minute-by-Minute Timeline

  #### 00:00 – 00:10: Setup & Endowment
  *   **Action:** Hand out envelopes. Each contains 5 Chits.
  *   **Say:** "These chits are chocolate. 1 Chit = 1 Chocolate at the door. Keep them safe. If you lose them, you lose the chocolate."
  *   **Say:** "Today is about practical rationality. We are going to run a protocol. Some of you will work. Some of you will not. Your payoff depends on your choices."
  *   **Do Not Say:** "This is an experiment on weakness of will." (Keep the theoretical frame vague).
  *   **Action:** Hand out the Task Sheet face down.

  #### 00:10 – 00:25: Phase 1 (The Planning Self)
  *   **Action:** Students flip the sheet. It presents two options.
      *   **Option A (Early Bird):** Do the counting task **NOW** (5 minutes). Reward: **3 Chits**.
      *   **Option B (Procrastinator):** Do the counting task **AT MINUTE 60** (7 minutes). Reward: **3 Chits**.
      *   *(Note: Option B is objectively irrational—more work for same reward—but the pain is delayed.)*
  *   **The Precommitment Layer:**
      *   **Say:** "If you choose Option B, you may optionally purchase a 'Lock'. This costs **1 Chit** (Group 2: 2 Chits). If you buy the Lock, you are *not allowed* to quit at Minute 60. You must finish the task to get any reward. If you choose Option B without a Lock, you can change your mind at Minute 60."
  *   **Action:** Students mark their sheet. Collect the sheets. Collect any Chits paid for Locks.
  *   **Whiteboard:** Tally anonymously: How many chose A? How many chose B? How many bought Locks?

  #### 00:25 – 00:55: The "Waiting" Period (Filler)
  *   **Goal:** Let the "Later" deadline loom without resolving the tension.
  *   **Activity:** "Conceptual Analysis."
  *   **Say:** "While the clock runs, let's discuss what 'Rationality' means. Is it maximizing preference satisfaction? Is it following duty? Break into groups of 4. Define 'Rational Action' in one sentence."
  *   **Why:** This keeps them engaged but doesn't reveal the lesson. It also makes the Option B students feel the anxiety of the pending task while discussing abstract theory.
  *   **Facilitator Note:** Do not solve the definitions. Leave them messy. At Minute 50, give a 5-minute warning: *"Five minutes until the Protocol resumes."* Watch the Option B students. Some will look anxious. Some will check their phones (remind them no phones).

  #### 00:55 – 01:05: Phase 2 (The Acting Self)
  *   **Action:** Address the Option B students specifically.
  *   **Say:** "It is Minute 60. For those who chose Option B: The task is now due. You have 7 minutes. You can work, or you can quit. If you quit, you get 0 Chits for this task. If you bought a Lock, you *must* work or you forfeit your initial endowment."
  *   **The Twist:** Option A students are free to pack up or help grade the Option B students (peer monitoring increases social pressure).
  *   **Observation:** Watch who quits. Watch who struggles. Watch the Lock-buyers who look resentful.

  #### 01:05 – 01:15: Redemption & Debrief
  *   **Action:** Collect tasks. Verify a random sample (check one person's count). If they lied, they lose all chits (enforce this once to make stakes real).
  *   **Action:** Hand out chocolates at the door based on final Chit count.
  *   **Debrief (The most important part):** Do not lecture. Ask questions.
      1.  **The Flip:** "At Minute 10, Option B looked fine. At Minute 60, Option B looked painful. Did your preference change, or did the options change?"
      2.  **The Lock:** "Who bought a Lock? At Minute 60, how did you feel about your past self? Angry? Grateful?"
      3.  **The Rationality:** "If I choose the smaller-sooner reward because 'I just want it now,' am I irrational? Or do I just have a different utility function at T=60 than T=10?"
      4.  **The Aversive:** "For those who procrastinated: Was the extra 2 minutes of work worth the 50 minutes of freedom? Who here would make that trade again?"

  ---

  ### Facilitator Script: What to Say & Not Say

  **DO SAY:**
  *   "The rules are binding. I am the bank. I do not negotiate."
  *   "Your future self is a stranger. Treat them like one."
  *   "It is okay to feel resentful of the Lock. That feeling is data."
  *   "We are not looking for the 'right' answer. We are looking for the pattern."

  **DO NOT SAY:**
  *   "This demonstrates hyperbolic discounting." (Save for the reading).
  *   "You are being irrational if you quit." (This shuts down the debate).
  *   "I know what you're thinking." (Let them discover it).
  *   "Don't worry, it's just a game." (Undermines the stakes).

  ---

  ### Predictable Failure Modes & Fixes

  **1. The Gamer (Optimizing without Working)**
  *   *Behavior:* Claims they did the count but didn't, or guesses the number.
  *   *Fix:* **Random Audit.** Announce at the start: "I will audit 3 random sheets. If the count is off by more than 2, that student loses all chits." Actually do it. The risk makes the labor real.
  *   *TA Move:* "I'm not policing you. The audit is part of the risk structure of the task."

  **2. The Renegotiator (The "Can't I Just...?")**
  *   *Behavior:* At Minute 60, asks "Can I do half the task for half the chocolate?"
  *   *Fix:* **Hard No.** "The contract was signed at Minute 10. Changing terms now rewards inconsistency."
  *   *TA Move:* Use this in debrief. "This person tried to renegotiate with their past self. Why did that feel unfair to the Past Self?"

  **3. The Resentful Precommitter**
  *   *Behavior:* Bought the Lock, now hates you and their past self.
  *   *Fix:* **Validate.** "Good. That resentment is the sound of the constraint working. If it felt easy, you didn't need the Lock."
  *   *TA Move:* Ask them to speak in debrief. "Did the Lock make you freer or less free?"

  **4. The "It's Just Chocolate" Skeptic**
  *   *Behavior:* Treats chits as meaningless.
  *   *Fix:* **Visual Stakes.** Keep the chocolate bag visible on the desk. Eat one loudly during the Waiting Period.
  *   *TA Move:* "If the stakes are too low, why did you buy the Lock? You paid real currency for a restriction. Why?"

  ---

  ### What This Activity Cannot Stage (And You Must Say)
  Be honest in the debrief about the limitations.
  1.  **Real Consequences:** "In real life, procrastination costs grades or jobs, not just 2 minutes of counting. The *structure* was the same, the *stakes* were toy-sized."
  2.  **Self-Knowledge:** "In this game, you knew the task was boring. In real life, we often lie to ourselves about how hard the task will be. That's optimism bias, which is different from time inconsistency."
  3.  **The "Why":** "We saw *that* you flipped preferences. We didn't prove *why*. Is it emotion? Biology? Habit? That's the theory for next week."

  ---

  ### Debrief Mapping to Theory (Cheat Sheet)
  *   **Preference Reversal:** When they chose B at T=10 but quit at T=60. (Maps to Ainslie/Hyperbolic Discounting).
  *   **Precommitment:** When they paid chits for the Lock. (Maps to Schelling/Thaler "Ulysses Contracts").
  *   **Multiple Selves:** The argument between the T=10 self and T=60 self. (Maps to Parfit "Reasons and Persons").
  *   **Rationality Ambiguity:** If a student says "I just valued my comfort more at T=60," accept that. (Maps to Becker "Stable Preferences" vs. Traditional Akrasia).

  ### Final TA Tip
  When the Option B students are working at Minute 60, and the Option A students are packing up, **let the room be uncomfortable.** Do not smooth it over. The social pressure and the visible disparity between the "grinding" students and the "free" students is part of the aversive cost of the delay. Let them feel the regret physically. That feeling is the lesson.
