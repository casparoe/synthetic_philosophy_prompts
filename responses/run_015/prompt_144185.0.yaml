  2.  **Deconstruct the Core Problem:**

      *   Standard hyperbolic discounting experiments usually involve money over long delays (now vs. next week). This doesn't work well in a 75-minute class with no money.
      *   *Solution:* The "delay" must happen *within* the session. The "reward" must be immediate consumption (chocolate/break time/points) or avoidance of pain (boring task).
      *   *The "Aversive" Requirement:* Need a task that is boring but harmless. Copying text? Counting something? Sorting cards? Let's go with *counting specific characters in a dense paragraph* or *transcribing a boring text*. Transcribing is better because it takes time and effort.
      *   *The "Reward" Requirement:* Chocolates are good. Participation points are okay but abstract. Let's use Chocolates as the tangible reward and "Early Dismissal" or "Break Time" as the time reward. Actually, let's stick to the prompt's suggestion of "small they can actually gain or lose." Chocolates work best for immediate gratification.
      *   *The "Precommitment" Requirement:* Students need to bet on their future selves or pay to lock themselves in.

  3.  **Drafting the Activity Concept: "The Procrastination Protocol"**

      *   *Phase 1: The Setup (Prediction).* Students predict what they will do later.
      *   *Phase 2: The Work (Aversive Task).* They have a choice: Do a hard task now for a big reward later, or a small task now for a small reward, OR delay the task.
      *   *Wait, the delay needs to be experienced.*
