answer: |-
  # The Aggregation Decision Tree

  **Start:** *Six people will die. You can save five on the left or one on the right. All else is equal.*

  ### **Node 1: The Baseline**
  **Case:** Five strangers vs. One stranger (Equal Claims).
  **Question:** Are you **required** to save the five?
  *   **NO** → Go to Node 2.
  *   **YES** → Go to Node 5.

  ---

  ### **Node 2: The Identifiability Check**
  **Case:** Five statistical victims vs. One identifiable child in front of you.
  **Question:** Do you save the **identifiable one**?
  *   **YES** → **LEAF A: The Identifiability View**
  *   **NO** → Go to Node 6.

  ### **Node 6: The Policy Level**
  **Case:** You are writing the standing triage rule for 100 future emergencies.
  **Question:** Does the rule mandate **saving the greater number**?
  *   **YES** → **LEAF B: Policy Aggregation**
  *   **NO** → Go to Node 4.

  ### **Node 4: The Small Numbers Test**
  **Case:** Two strangers vs. One stranger (Equal Claims).
  **Question:** Is there a **correct decision** on who to save?
  *   **YES** → **LEAF C: Equal-Claim Lottery**
  *   **NO** → **LEAF D: Numbers Never Settle**

  ---

  ### **Node 5: The Aggregation Limit**
  **Case:** Five people lose a finger vs. One person loses a life.
  **Question:** Are you **required** to save the five?
  *   **NO** → Go to Node 4.
  *   **YES** → Go to Node 3.

  ### **Node 3: The Risk Test**
  **Case:** Save five certainly vs. 50% chance to save ten.
  **Question:** Do you take the **certain five**?
  *   **YES** → **LEAF E: Ex Post Additive**
  *   **NO** → **LEAF F: Ex Ante Additive**

  *(Note: Node 4 is reused below for the Aggregation branch)*

  ### **Node 4 (Revisited): The Tie-Breaker**
  **Case:** Two strangers vs. One stranger (Equal Claims).
  **Question:** Are you **required** to save the two?
  *   **YES** → **LEAF G: Pairwise Contractualism**
  *   **NO** → **LEAF H: Lexical Threshold**

  ---

  ## Leaf Analysis: Awkward Commitments

  *   **Leaf A (Identifiability):** You must let five statistical people die to spare one visible face, implying moral worth depends on proximity.
  *   **Leaf B (Policy Aggregation):** You must write a rule to save the five while admitting that following it in the moment is morally impermissible.
  *   **Leaf C (Equal-Claim Lottery):** You must flip a coin between one and five lives, treating the loss of five as no worse than the loss of one.
  *   **Leaf D (Numbers Never Settle):** There is no moral fact of the matter about whether to save one or two people, rendering triage arbitrary.
  *   **Leaf E (Ex Post Additive):** You must reject a gamble that saves more lives in expectation to ensure a lower number of actual survivors.
  *   **Leaf F (Ex Ante Additive):** You must risk ten actual deaths to maximize the expected value, potentially leaving everyone dead.
  *   **Leaf G (Contractualism):** You must save the two over the one, but still save the one life over five finger-losers, prioritizing complaint strength over totals.
  *   **Leaf H (Lexical Threshold):** No number of minor injuries, even millions, can ever morally outweigh a single loss of life.

  ---

  ## Logical Space Analysis

  ### Empty Regions
  1.  **{Node 1: NO, Node 4: YES}** (Not required to save 5, but required to save 2).
      *   **Status:** **Incoherent.** Violates monotonicity; if five identical claims do not generate a requirement to aggregate, two identical claims cannot.
  2.  **{Node 1: YES, Node 5: YES, Node 4: NO}** (Save 5 fingers, but flip coin on 2 lives).
      *   **Status:** **Incoherent.** If aggregation overrides a stronger claim (life), it must override an equal claim (life).
  3.  **{Node 1: YES, Node 5: NO, Node 6: YES}** (Individual anti-aggregation, Policy aggregation).
      *   **Status:** **Occupied** (Leaf B). This is the distinct "Rule Consequentialist" or "Ex Ante" space, not empty.
  4.  **{Node 1: NO, Node 2: NO, Node 6: NO, Node 4: YES}** (Anti-aggregation individual, but "Correct Decision" exists).
      *   **Status:** **Unexplored/Unattractive.** This implies a non-aggregative reason for a specific choice (e.g., a specific duty to the one) without identifiability.

  ### Indistinguishable Leaves
  *   **Leaf C (Equal-Claim Lottery) and Leaf D (Numbers Never Settle).**
      *   **Reason:** Both answer "No" to being *required* to save the greater number in individual cases. The tree asks about action/requirement, not meta-ethical truth.
      *   **Separating Case:** A question about moral realism: *"If you flip a coin and the one dies, did you make a moral mistake?"* (Leaf C says No; Leaf D says the question has no answer).
