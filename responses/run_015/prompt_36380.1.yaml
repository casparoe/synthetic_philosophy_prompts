answer: |-
  Your tension arises from a collision between demographic reality and moral ontology. As an ecologist, you observe that r-selected species endure staggering mortality rates; as a conservationist, you feel that destroying their habitat is a profound wrong. The philosophical challenge is to reconcile the arithmetic of suffering with the ethics of existence.

  The utilitarian argument for habitat destruction rests on two premises: first, that wild animal lives are predominantly net-negative due to starvation, predation, and exposure; second, that non-existence is a neutral baseline. From this "total view," preventing a being from existing prevents its suffering. Since no subject exists to be harmed by non-existence, draining the marsh appears to be a mercy. It unplugs a machine running on pain. If 1,998 tadpoles die painfully to produce two adults, eliminating the clutch prevents 1,998 instances of suffering. On this model, conservation inadvertently perpetuates a cycle of misery.

  However, this arithmetic commits a category error regarding the nature of welfare. Suffering is not a free-floating substance that can be reduced in the abstract; it is a state experienced by a subject. To claim that destruction "reduces suffering" by preventing birth implies that non-existent beings are benefited by never having been born. But there is no "them" to benefit. The only beings affected by habitat destruction are those currently alive. For them, destruction inflicts acute, certain harm: death by desiccation, predation in exposed fragments, or starvation. While natural mortality is high, it occurs within a life cycle that includes feeding, growth, and, for the survivors, reproduction. Anthropogenic destruction truncates this cycle for everyone, converting potential positive experiences into certain negative ones.

  Furthermore, the utilitarian calculation ignores the moral significance of death itself. Even if a life contains more pain than pleasure, premature death deprives an organism of its future, however brief. To kill an animal is to impose a harm upon it, regardless of whether its future would have been net-negative. The intuition that habitat loss is a tragedy is correct because it violates the integrity of living subjects who have a stake in their own continuation. The arithmetic goes wrong by treating lives as containers of value rather than subjects of experience. It assumes we can sum negative experiences across possible beings, but moral weight attaches only to actual beings.

  Therefore, habitat destruction **increases** aggregate suffering. It inflicts immediate, intense suffering on current inhabitants without morally offsetting this by "sparing" non-existent futures. The prevention of potential suffering is not a moral good comparable to the alleviation of actual suffering.

  This verdict clarifies the moral duty of conservation. If destruction increases suffering, conservation is not merely a duty to preserve biodiversity for human utility or aesthetic appreciation, nor is it a neutral act regarding animal welfare. It is a direct moral duty toward the animals themselves. We owe it to wild creatures to allow them to complete their life cycles within intact systems, rather than managing them based on speculative calculations of net-negative welfare. Conservation is the commitment to protect the possibility of life, acknowledging that existence itself—with all its inherent risks—is preferable to the certainty of extermination. The marsh is not a suffering machine to be unplugged; it is a community of subjects to be respected.
