answer: |-
  To the Pledge Assembly,

  You require a working jurisprudence, not a seminar. A theory of promissory obligation that cannot generate a verdict on a public register is useless to you, regardless of its metaphysical elegance. Below is the specification you requested. It is derived from the cases you face, categorized by whether they are essential for the Assembly's function (Non-negotiable) or reflect specific philosophical commitments (Preference).

  ### I. Desiderata for Adjudication

  **1. The Independence Condition**
  *   **Motivating Case:** *The Pledge No One Relied On.* (The beneficiary forgot or never knew).
  *   **Specification:** The theory must ground the obligation in the act of pledging itself, not in the consequences of the pledge (such as reliance or expectation). A breach must be findable even if the beneficiary suffered no detriment from the disappointment.
  *   **Status:** **Non-negotiable.** (Without this, you cannot adjudicate the majority of register-based pledges where reliance is unprovable).

  **2. The Validity Threshold**
  *   **Motivating Case:** *The Coerced, Fraudulent, or Half-Understood Pledge.*
  *   **Specification:** The theory must provide clear conditions under which a pledge is void *ab initio*. It must distinguish between a binding promise that is difficult to keep and a "promise" that never generated an obligation due to defects in formation.
  *   **Status:** **Non-negotiable.** (Essential for defense against complaints).

  **3. The Release Condition**
  *   **Motivating Case:** *The Released Pledge vs. The Refused Release.*
  *   **Specification:** The theory must grant the beneficiary the normative power to dissolve the obligation unilaterally, while denying that power to the pledger. It must explain why a beneficiary's spiteful refusal to release keeps the obligation alive.
  *   **Status:** **Non-negotiable.** (Central to the bilateral nature of the Assembly's register).

  **4. The Illegality Bar**
  *   **Motivating Case:** *The Immoral Pledge.* (And the pledge to help someone do wrong).
  *   **Specification:** The theory must entail that no obligation is generated to perform an act that is independently morally prohibited. A ruling of "breach" must never compel a member to do wrong.
  *   **Status:** **Non-negotiable.** (The Assembly cannot enforce immorality).

  **5. Adjudicative Objectivity**
  *   **Motivating Case:** *The Indexed Pledge & The Vague Pledge.*
  *   **Specification:** The criteria for breach must rely on public facts (the text of the register, the formula used) rather than private mental states. For indexed pledges, the theory must specify whether the obligation is to the *outcome* or *compliance with the procedure* based on public conventions, not the pledger's secret intent.
  *   **Status:** **Non-negotiable.** (The panel cannot read minds; rulings must be publicly justifiable).

  **6. The Distinctness Condition**
  *   **Motivating Case:** *The Redundant Pledge.* (Pledging to do what one was already obliged to do).
  *   **Specification:** The theory must distinguish promising from announcing an intention, predicting, threatening, consenting, swearing an oath, or signing a contract. Specifically, it must explain whether a redundant pledge creates a *new* obligation, reinforces an old one, or is null.
  *   **Status:** **Non-negotiable.** (You must know what kind of speech act you are adjudicating).

  **7. The Second-Personal Scope**
  *   **Motivating Case:** *The Pledge to Future or Unidentified Beneficiaries.*
  *   **Specification:** The theory must allow obligations to attach to a class of persons or future members, not solely to specific, existing individuals known at the time of pledging.
  *   **Status:** **Non-negotiable.** (Required for the "support any member in hardship" model).

  **8. The Proportionality Constraint**
  *   **Motivating Case:** *The Grading Problem.* (Trivial vs. Enormously Costly).
  *   **Specification:** The theory should explain whether the stringency of the obligation scales with the cost to the pledger or the importance to the beneficiary, or if the obligation is binary (binding/not binding) regardless of cost.
  *   **Status:** **Preference.** (Some theories demand absolute adherence; others allow trade-offs. The Assembly must choose a lane).

  **9. The Survivorship Clause**
  *   **Motivating Case:** *The Pledge Whose Beneficiary Has Died.*
  *   **Specification:** The theory must determine if the right to performance transfers to heirs or dissolves with the beneficiary.
  *   **Status:** **Preference.** (This turns on whether the right is personal to the beneficiary or an asset of their estate).

  **10. The Intra-Personal Limit**
  *   **Motivating Case:** *The Pledge to One's Own Future Self.*
  *   **Specification:** The theory must take a stance on whether a "pledge" without a second party generates an adjudicable obligation.
  *   **Status:** **Preference.** (Most adjudicative theories require a second party; some moral theories do not).

  ***

  ### II. Partisan Temptations & Incompatibilities

  You asked which of your temptations are actually partisan demands that will exclude viable theories. All six you listed are partisan. None are required for the Assembly to function.

  1.  **Derivable from non-normative facts alone:** *Partisan.* This excludes Normative Power views which posit that the act of promising itself changes the normative landscape in a way not reducible to physical facts.
  2.  **Reducible to a single underlying moral reason:** *Partisan.* This excludes Pluralist views (e.g., that promising involves both fairness and reliance).
  3.  **Every valid pledge binds with the same *pro tanto* force:** *Partisan.* This conflicts with the **Proportionality Constraint**. If you demand uniform force, you cannot account for the intuition that a trivial pledge is easier to override than a vital one.
  4.  **Work without appealing to any social practice:** *Partisan.* This is the most dangerous temptation for a panel. Without a social practice (convention), you cannot solve the **Indexed Pledge** or **Vague Pledge** cases publicly. You need a convention to interpret what "support" or a formula means.
  5.  **Yield a verdict in every case:** *Partisan.* This demands "Completeness." Some theories admit of "gaps" where morality is silent. Demanding a verdict forces you to adopt a legalistic fiction where none may exist.
  6.  **Explain why a small welfare gain never defeats a promise:** *Partisan.* This demands Absolutism. Many credible theories allow promises to be overridden by significant (or even small, in aggregate) welfare gains.

  **The Incompatible Pair:**
  **Adjudicative Objectivity** (Desideratum 5) and **The Validity Threshold** (Desideratum 2).
  *   **Conflict:** To rule on coercion or fraud (Validity), you often *must* inquire into the subjective mental state of the pledger (were they afraid? did they understand?). To maintain Adjudicative Objectivity, you must ban inquiry into inner states.
  *   **Resolution:** The Assembly must decide whether to prioritize the *integrity of consent* (allowing subjective evidence) or the *security of the register* (banning subjective evidence). You cannot maximize both.

  **The Single Requirement That Excludes Theories:**
  **The Independence Condition** (Desideratum 1).
  This is the primary filter. It immediately excludes pure **Reliance Theories**. If a theory says "no reliance, no obligation," it fails the *Pledge No One Relied On* case. Since your register relies on public filing, not proof of detriment, any theory requiring reliance is unusable.

  ***

  ### III. Theoretical Scorecard

  **Practice and Convention Theories**
  *   *Verdict:* **High Utility.**
  *   *Notes:* Excellent for **Adjudicative Objectivity** and **Indexed/Vague Pledges** (meanings are fixed by convention). Struggles with the **Partisan Temptation** to work without social practice (obviously). May struggle to explain why the practice itself is binding without circularity.

  **Reliance Theories**
  *   *Verdict:* **Unusable.**
  *   *Notes:* Fails the **Independence Condition** immediately. Cannot adjudicate the *Pledge No One Relied On*. Useful only for calculating damages *after* breach is established, not for establishing breach.

  **Expectation and Assurance Theories**
  *   *Verdict:* **Mixed.**
  *   *Notes:* Better than pure reliance, but still struggles if the beneficiary never knew of the pledge (no expectation created). Good for **Contrastive** distinctions (assurance vs. prediction). Requires careful handling of **Adjudicative Objectivity** (expectations are often internal).

  **Normative Power Views**
  *   *Verdict:* **High Utility.**
  *   *Notes:* Best fit for **Release Condition** and **Independence Condition**. Explains how one alters obligations by will. Struggles with **Adjudicative Objectivity** (metaphysical power is not always publicly visible) and needs a **Practice** element to explain *how* the power is invoked (signing the register).

  **Recommendation:** Adopt a **Hybrid of Normative Power and Convention**. Treat the filing on the register as a conventional exercise of a normative power. This satisfies the Independence Condition (the act binds), the Objectivity Condition (the filing is public), and the Release Condition (the beneficiary holds the counter-power). Abandon the hope of a practice-independent or purely non-normative foundation.
