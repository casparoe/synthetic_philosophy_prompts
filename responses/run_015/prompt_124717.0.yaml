  The stalemate is substantive regarding ontology but verbal regarding explanatory adequacy. Critics argue Dennett's multiple drafts explain functional access but eliminate the phenomenal unity they seek to explain, effectively denying the datum of a single stream. Dennett counters that demanding a singular consumer commits the homunculus fallacy; unity is a narrative construct, not a mechanical prerequisite. Regarding mechanisms, critics insist on a global broadcast to unify content, whereas Dennett posits competitive editing without final publication. Analogies to distributed artificial neural networks support Dennett's functional architecture—no single node observes—yet critics contend that global workspace activation merely relocates the theater to an emergent system-level property, preserving the need for a unified consumer state. This reveals the core divergence: whether representation requires a singular cognitive consumer or if distributed processing suffices for genuine experience.

  Progress is unlikely via neuroanatomy alone, as identifying broadcast networks settles functional architecture but not ontological status. A formal distinction between access and phenomenal consciousness clarifies the disagreement but risks dualism, which Dennett rejects. The impasse suggests the framing is ill-posed: it assumes consciousness requires a specific structural correlate of unity. True progress requires accepting Dennett's radical claim that phenomenology is a user-illusion generated by the drafts themselves, not a property requiring a central observer. Until critics accept that first-person authority is not a datum but a claim subject to revision, the debate will remain circular, oscillating between explaining the mechanism of reporting and the reality of the reported experience. Consequently, resolution demands abandoning the intuition that explanation must preserve first-person authority, recognizing instead that the "stream" is a retrospective fabrication.
