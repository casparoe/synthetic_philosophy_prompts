answer: |-
  The amyloid programme is currently degenerating because its protective belt adjustments have become predominantly ad hoc3, securing theoretical consistency at the expense of empirical content, while the biomarker redefinition of Alzheimer's disease functions as a methodological shield that renders the hard core nearly unfalsifiable without generating novel predictive power regarding clinical cognition.

  The hard core is a nest of three interlocking claims: (1) amyloid-beta (Aβ) accumulation is the necessary initiating cause of Alzheimer's pathology; (2) downstream events (tau, inflammation, neurodegeneration) are contingent on this initiation; and (3) removing Aβ will halt or reverse clinical decline. The negative heuristic forbids attributing trial failures to these causal claims. Instead, refutation is deflected onto the protective belt. The shift from "plaque burden" to "soluble oligomers" is the primary belt adjustment; while independently testable in principle via specific assays, in practice it functioned as an ad hoc3 move because the oligomer hypothesis gained traction specifically when plaque-clearing drugs failed to improve cognition, without prior successful prediction of which oligomer species mattered. Similarly, the "timing hypothesis" (treat preclinically) and "subgroup specificity" (ApoE4 carriers) are testable auxiliaries, but they have been deployed sequentially to explain away null results rather than to predict new phenomena before the fact. The adjustment of primary endpoints (shifting from ADAS-Cog to CDR-SB) and the acceptance of surrogate endpoints (amyloid PET reduction) further thicken the belt, allowing the programme to claim success on biomarker clearance while the predicted clinical benefit remains statistically significant but clinically disputed.

  The biomarker redefinition (AT(N) framework) is the most severe Lakatosian problem here. By defining Alzheimer's disease biologically (A+) rather than clinically (dementia), the programme transforms the core claim from "Aβ causes dementia" to "Aβ defines the disease." This is not merely a belt adjustment; it is a redefinition of the phenomenological domain that insulates the hard core from refutation. If a patient has dementia but no amyloid, they are excluded from the category; if they have amyloid but no dementia, they are "preclinical." Lakatos's framework struggles here because it polices the belt, not the definition of the problem situation itself. A Lakatosian appraisal must treat this as a degenerating move if the redefinition does not yield novel facts beyond ensuring the population matches the theory. While it standardizes enrolment, it risks tautology: the theory predicts amyloid reduction in amyloid-positive patients, which is confirmed, but the link to the original problem (clinical decline) remains weak. Lakatos lacks specific resources to criticize conceptual redefinitions unless they fail to generate novel facts; here, the "novel fact" of biomarker normalization is corroborated, but the novel fact of meaningful cognitive preservation is not, suggesting the redefinition serves to protect the core rather than expand empirical content.

  The novelty condition bites harder here than in historical cases because of prospective registration. Lakatos requires novel facts—predictions made before the evidence is known. In the Lecanemab and Donanemab trials, the reduction of amyloid was predicted and corroborated (novel fact 1). The clinical benefit (CDR-SB difference) was predicted and corroborated statistically (novel fact 2). However, the *magnitude* of fact 2 was not predicted to be clinically marginal. Under a strict Lakatosian reading, the programme is technically progressive because it predicted and found a statistically significant difference where none was found before. However, this exposes a defect in MSRP: it lacks a threshold for materiality. Lakatos refuses to specify "how much" empirical content is enough to count as progress, deferring to the scientific community's judgment over time. In this case, that silence allows a programme to claim progress on a whisker-thin effect size that does not solve the original problem (dementia). Fixing this would require adding a normative constraint on clinical significance to the definition of a "fact," but doing so would cost the framework its neutrality, forcing the methodology to adjudicate on substantive medical value rather than logical structure.

  Regarding internal versus external history, the persistence of the programme despite decades of null cognitive results is best explained by external factors: sunk costs, regulatory pathways built around surrogate endpoints, and funding inertia. Lakatos expects rational reconstruction to filter these out, focusing only on the logical appraisal of the programme. However, when a programme appears degenerating by logical standards (ad hoc belt, lack of novel clinical facts) yet thrives institutionally, it suggests the unit of appraisal is wrong. Is this one programme metamorphosing, or a dead programme kept alive by external scaffolding? Lakatos's identity conditions for a programme are loose (continuity of hard core), which allows the amyloid programme to claim continuity despite shifting from plaque to oligomers to preclinical prevention. A Kuhnian analysis handles this better: the field is in a state of crisis where the paradigm (amyloid) is protected by ad hoc adjustments, but the community refuses to abandon it due to institutional investment, not because of progressive problem-solving. A Bayesian evidentialist approach also outperforms Lakatos here by quantifying the likelihood ratio: each failed cognitive trial lowers the posterior probability of the core hypothesis, regardless of biomarker success, whereas Lakatos allows the programme to remain "progressive" as long as *some* novel fact (amyloid clearance) is corroborated.

  Ultimately, this episode is an anomaly for MSRP that reveals its inability to handle surrogate endpoints and conceptual redefinitions that decouple theory from the original problem. Lakatos anticipated ad hoc auxiliaries, but not a regulatory-science complex that validates surrogate markers as "facts" sufficient for approval despite clinical failure. Feyerabend's charge that methodological rules are toleration dressed up as logic fits best: the field tolerates the amyloid core because abandoning it would collapse the infrastructure, not because the methodology dictates it is progressive. The specific failure of MSRP is its inability to distinguish between a novel fact that advances the solution to the problem (curing dementia) and a novel fact that merely confirms the mechanism within a redefined domain (clearing plaque in biomarker-positive patients).
