  | 1 | Yes | Yes | Yes | Yes |
  | 2 | Yes | No | Yes | No |
  | 3 | No | Yes | Yes | No |
  | 4 | Yes | No | Yes | No |
  | 5 | No | Yes | Yes | No |
  | **Total Yes** | **3** | **3** | **5** | **1** |

  *Note: Each member is consistent. A member votes Yes on D if and only if they vote Yes on B, V, and W.*

  ### Voting Outcomes

  **1. Three-Item Agenda (B, V, W)**
  *   Vote on B: 3 Yes (Passes)
  *   Vote on V: 3 Yes (Passes)
  *   Vote on W: 5 Yes (Passes)
  *   **Result:** The motion carries (all three premises accepted by majority).

  **2. Two-Item Agenda (B & V, W)**
  *   Vote on (B & V): 1 Yes (Fails)
  *   Vote on W: 5 Yes (Passes)
  *   **Result:** The motion fails (the bundled premise was rejected by a majority).

  **3. Conclusion-Based Vote (D)**
  *   Vote on D: 1 Yes (Fails)
  *   **Result:** The motion fails. This result is not an accident of this specific example; it had to happen given features 2 and 3. Because the bundled item (Budget and Venue) failed under the two-item agenda, a majority must have rejected that conjunction, and consistent members who reject the conjunction must also reject the final conclusion.

  ### Analysis

  This example shows that the outcome depends entirely on the agenda structure rather than the members' underlying will, meaning there is no non-arbitrary way to declare one decomposition "correct." To be fair, a council should fix its voting procedure in its bylaws before any specific motion arises, rather than letting the chair choose the decomposition ad hoc. This prevents manipulation through agenda-setting and ensures members know how their views will be aggregated regardless of who is chairing.
