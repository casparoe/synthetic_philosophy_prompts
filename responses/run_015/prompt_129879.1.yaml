      *   *Point 2: Hierarchical Mesh.* Even if we treat the prediction as a "soft" blocker, Anderton's responsibility hinges on the mesh. Is he acting on a desire he identifies with? At the start, yes (grief). At the end, he breaks the mesh. He refuses the "willing addict" status.
