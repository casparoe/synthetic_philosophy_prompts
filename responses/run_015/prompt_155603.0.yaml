          *   *Third Option:* Evaluative Phenomenology. Unpleasantness is a *felt evaluation* (not a judgment, but a feeling *of* badness). This bridges the gap but risks collapsing into the evaluative view the user rejects.
          *   *Advice:* Take Horn 2 but refine. It's a primitive normative phenomenology.

      *   **Section 3: Hypothetical Dissociations.**
