              2.  *Constitutive Imperativism:* Serious. If unpleasantness *is* the command, you can't separate them.
              3.  *Long-term Harm:* Awkward. Sensory info prevents damage. If badness includes future harm prevention, sensory matters.

      *   **Section 2: The Definition Dilemma.**
