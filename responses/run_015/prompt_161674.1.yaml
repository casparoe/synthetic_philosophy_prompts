answer: |-
  This is a request to operationalize non-ideal political theory into bureaucratic protocol. The tension you face is inherent: philosophy demands nuance; triage demands standardization. The following procedure is designed to minimize moral discretion at the caseworker level while flagging cases where discretion is unavoidable. It treats the 1951 Convention not as a static legal text but as a proxy for a duty of rescue, mediated by the principle of surrogate protection.

  ### Part I: The Decision Procedure (The "Intake Algorithm")

  **Training Constraint:** Caseworkers are instructed that this is a *triage* tool, not a final legal determination. A "Yes" here recommends granting interview priority; a "No" recommends rejection; a "Hand Up" flags a value conflict for the Legal Officer/Philosophy Member.

  **Time Limit:** 45 minutes for data entry/calculation, 15 minutes for note drafting.

  #### Phase 1: Eligibility (Who Counts?)
  *Goal: Determine if the claimant falls under the surrogate protection mandate.*

  **Step 1: The Threat Test**
  *   **Question:** Is there a serious harm risk (life, liberty, physical integrity)?
  *   **Sufficient Answer:** Documentary evidence of violence, death threats, or objective Country of Origin Information (COI) indicating high risk.
  *   **Stop (No):** Risk is purely economic (poverty alone) or generalized inconvenience.
  *   **Hand Up:** Risk is severe but source is ambiguous (see Step 2).

  **Step 2: The Agent/Protection Test (Handling the Hard Cases)**
  *   **Question:** Is the harm caused by a persecutor OR a failure of state protection?
  *   **Procedure:**
      1.  **Identifiable Agent:** Is there a state actor or non-state actor (militia, gang) targeting the claimant?
          *   *If Yes:* Proceed to Step 3.
          2.  **State Abandonment (Environmental/Structural):** If no active persecutor, is the state absent from the claimant's region? (e.g., no courts, no police, no disaster relief).
              *   *Sufficient Answer:* COI confirms administration has withdrawn services from the specific province.
              *   *Decision:* Treat "State Abandonment" as functional persecution. Proceed to Step 3.
          3.  **Generalized Violence:** If violence is criminal/generalized, is the claimant at *differential risk*?
              *   *Sufficient Answer:* Claimant belongs to a specific demographic (e.g., shopkeepers, women refusing marriage) targeted at higher rates than the general population.
              *   *Stop (No):* Risk is identical to every other citizen.
  *   **Hand Up:** The claimant argues the "state" itself is the cause via structural neglect, but COI is contradictory.

  **Step 3: The Nexus Test (Particular Social Group)**
  *   **Question:** Is the risk linked to Race, Religion, Nationality, Political Opinion, or Particular Social Group (PSG)?
  *   **Procedure for PSG:**
      1.  Is the group defined by an immutable characteristic (innate or fundamental to identity)?
      2.  **Crucial Filter:** Is the group defined *solely* by the harm suffered? (e.g., "victims of crime").
          *   *Stop (No):* If the only commonality is the harm.
          *   *Proceed:* If the characteristic exists independent of the harm (e.g., "landowners in Region X," "journalists").
  *   **Hand Up:** The group is defined by a moral commitment (e.g., "conscientious objectors") where the line between political opinion and moral choice is blurred.

  **Phase 1 Output:** If Steps 1–3 pass, the claimant is **Eligible**. If not, **Reject**. If "Hand Up" is triggered, flag for **Senior Review**.

  ---

  #### Phase 2: Responsibility Allocation (Which State?)
  *Goal: Determine if *this* state should accept jurisdiction or if a "Safe Third Country" exists.*

  **Priority Ordering (The "Responsibility Weights")**
  Caseworkers assign points. High score = This State accepts. Low score = Seek Transfer.

  1.  **Safety Trump (Absolute):** If the alternative state is unsafe (active conflict, known refoulement), *This State* must accept. No calculation needed.
  2.  **Family/Ties (Weight: 5):** Sibling/Spouse/Child in *This State* OR fluent in language OR prior lawful residence >1 year.
  3.  **Causal Contribution (Weight: 3):** Is *This State* a top-10 emitter of carbon relevant to the claim? OR did *This State* have military/political involvement in the region? (Binary Yes/No based on pre-loaded list).
  4.  **Capacity (Weight: 2):** Is *This State's* unemployment rate lower than the alternative? Is the refugee stock <2% of population?
  5.  **First Arrival/Presence (Weight: 1):** Did the claimant pass through a safe country? (Standard legal tie-breaker).

  **Decision Rule:**
  *   If **Safety Trump** triggers for *This State*: **Accept.**
  *   If **Safety Trump** triggers for *Alternative State*: **Transfer.**
  *   If Safety is equal: Sum weights.
      *   Score > 6: **Accept.**
      *   Score < 4: **Transfer.**
      *   Score 4–6: **Hand Up** (Value disagreement on integration vs. burden-sharing).

  ---

  ### Part II: Application to Test Cases

  #### Case 1: The Delta Farming Family
  *   **Facts:** Saltwater intrusion, state administration withdrawn 2 years ago, no armed group. Adjacent state (first arrival) hosts >2% refugees.
  *   **Phase 1 (Eligibility):**
      *   *Threat:* Livelihood destruction + no state aid = Serious Harm.
      *   *Agent/Protection:* **State Abandonment.** COI confirms withdrawal. Treated as functional persecution.
      *   *Nexus:* PSG = "Agricultural residents of Delta Province." Immutable due to location/economic dependence. Not defined solely by harm.
      *   *Result:* **Eligible.**
  *   **Phase 2 (Responsibility):**
      *   *Safety:* Adjacent state is safe physically but economically overwhelmed (risk of refoulement due to collapse?). Assume Safe for calculation.
      *   *Ties:* 0 (New arrival).
      *   *Causal:* 3 (If your state is a high emitter).
      *   *Capacity:* 2 (Your state likely has higher capacity than the adjacent state hosting several %).
      *   *First Arrival:* 1 (Points to Adjacent State).
      *   *Calculation:* Your State Score = 5 (Causal + Capacity). Adjacent State Score = 1 (First Arrival).
      *   *Decision:* **Accept.** (Capacity and Causal contribution outweigh First Arrival).
  *   **Note for Appeal:** Rely on "Surrogate Protection" theory. The state's withdrawal creates the vacuum equivalent to persecution.

  #### Case 2: The Journalist
  *   **Facts:** Named official threat. Passed through 3 safe countries. Sibling in *This State*. Worked here 6 months.
  *   **Phase 1 (Eligibility):**
      *   *Threat:* Documented threats.
      *   *Agent:* State official.
      *   *Nexus:* Political Opinion/PSG (Journalists).
      *   *Result:* **Eligible.**
  *   **Phase 2 (Responsibility):**
      *   *Safety:* Transit states are "Safe" legally.
      *   *Ties:* 5 (Sibling + Prior Work).
      *   *Causal:* 0 (Assume no direct involvement).
      *   *Capacity:* 2.
      *   *First Arrival:* 1 (Points to Transit State 1).
      *   *Calculation:* Your State Score = 7. Transit State Score = 1.
      *   *Decision:* **Accept.** (Ties are a Trump over Safe Third Country protocols in this weighting).
  *   **Note for Appeal:** Family unity and integration potential override the "first safe country" administrative convenience.

  #### Case 3: The Unaccompanied Minor (17yo)
  *   **Facts:** Militia disbanded. Fear was well-founded at exit. Future risk unknown.
  *   **Phase 1 (Eligibility):**
      *   *Threat:* Past persecution creates presumption of future fear.
      *   *Agent:* Disbanded militia.
      *   *Nexus:* PSG (Children in region).
      *   *Complication:* Cessation of circumstances?
      *   *Result:* **Hand Up.** (Caseworkers cannot assess probability of militia re-forming).
  *   **Phase 2 (Responsibility):**
      *   *Safety:* Unknown.
      *   *Ties:* 0.
      *   *Best Interests of the Child (BIC):* **Absolute Trump.** (Add this as a separate override for minors).
      *   *Decision:* **Accept (Provisional).**
  *   **Note for Appeal:** The "Hand Up" is mandatory here. The procedure cannot calculate probability of political re-organization. However, the BIC principle overrides the uncertainty.

  ---

  ### Part III: Limits of the Procedure

  **1. Where the Procedure Cannot Be Run (Evidentiary Black Holes)**
  *   **Missing COI:** If the state has collapsed completely (e.g., Somalia at various times), Step 2 (State Abandonment) becomes impossible to verify.
      *   *Protocol:* Apply the "Benefit of the Doubt" standard. If the claimant's narrative is coherent and consistent, assume the Protection Test is met. Flag for Legal Officer.
  *   **Credibility:** Caseworkers are not human lie detectors.
      *   *Protocol:* Do not use "demeanor" as evidence. Rely solely on internal consistency and documentary corroboration. If consistency is low but risk is high, **Hand Up**.

  **2. What the Procedure Cannot Settle (Normative Residuals)**
  *   **The "Total Obligation" Problem:** This procedure decides *individual* cases. It cannot answer if the state is accepting *too many* people in aggregate. If 400 claims become 4,000, the Capacity Weight (2) breaks. This is a legislative question, not a triage question.
  *   **The Right to Close Borders:** The procedure assumes a duty to process. It cannot adjudicate the philosophical claim that a state may close borders to all comers. If the political mandate shifts to "Zero Asylum," this algorithm is void.
  *   **Value Conflicts in the "Middle Zone":** In Phase 2, scores between 4–6 indicate a clash between *Integration* (Ties) and *Fair Sharing* (First Arrival). The algorithm flags this, but cannot solve it. This is where your role as the non-legal member is vital: you must write the appeal note that justifies why *this* value won.

  **3. The "Hand Up" Protocol**
  *   Any case flagged "Hand Up" requires a written memo from you (the Philosophy Member) to the Legal Officer.
  *   **Template:** "The procedure halted at Step [X]. The factual record is sufficient, but the classification requires a normative judgment on [e.g., whether environmental collapse constitutes persecution]. Recommendation: Grant status based on [Theory], as the cost of error (refoulement) outweighs the cost of acceptance."

  ### Implementation Note
  This procedure shifts the burden of moral reasoning from the frontline caseworker to the system design (you) and the exception handler (Legal Officer). It ensures that the 400 annual claims are processed consistently, while preserving a channel for the hard cases that define your field. The "State Abandonment" clause is your strongest philosophical intervention; it codifies the idea that legitimacy, not just violence, grounds the refugee claim.
