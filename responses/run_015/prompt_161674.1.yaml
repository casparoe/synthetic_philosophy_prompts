prompt: |-
  I am completing a PhD in political philosophy and, for the past two years, have served as the non-legal member of an intake panel at a national asylum authority, advising the caseworkers who triage claims before they reach a hearing. I would like the two questions at the centre of my field's literature — who counts as a refugee, and which state has to take them in — turned into a single decision procedure that a caseworker with a fortnight's training can run in under an hour: the questions in the order they must be asked, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision upward because the remaining disagreement is one of values rather than facts. Roughly four hundred claims a year pass through us, every triage note has to be defensible in a written appeal, and a legal officer signs off.

  On the first question, the procedure has to handle three recurrent hard cases: the claimant fleeing generalised criminal violence who can name nobody with a reason to target them; the claimant from a province the state has quietly abandoned after slow-onset environmental collapse, where the reason for leaving is the disappearance of protection rather than the presence of a persecutor; and the claimant whose proposed social group is defined only by the harm its members share. Say whether a well-founded fear requires an identifiable agent, or whether a failure of protection can substitute for one, and at which step the procedure should decline to answer at all.

  On the second question, give me a priority ordering among the grounds on which a particular state can be picked out — presence or first arrival, causal contribution to the displacement, capacity to absorb, and the claimant's own ties of language, family, prior employment, or prior colonial administration — and say which are trumps and which are only tie-breakers.

  Then run the whole procedure on three cases from last month: a farming family from a delta province whose land has been destroyed by saltwater intrusion, whose district administration withdrew two years ago, where no armed group holds the territory, and who walked into the adjacent state, which already hosts a refugee population equal to several per cent of its own citizens; a journalist with documented threats from a named official who passed through three safe countries and claimed in ours, where her sibling lives and where she once worked for six months, and whom our panel would prefer to return to the transit state; and an unaccompanied seventeen-year-old whose feared persecutor was the local commandant of a militia since disbanded, where the fear was well-founded when he fled and nobody can say whether the militia will re-form. Finally, tell me where the procedure cannot be run at all — missing country-of-origin evidence, credibility, anything else — and what it could never settle even if run perfectly, such as whether a state may close its borders to all comers or how large the total obligation is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** PhD candidate in political philosophy, non-legal member of an asylum intake panel (2 years experience).
      *   **Task:** Create a single decision procedure (algorithm/flowchart style) for caseworkers (2 weeks training, <1 hour per case) to address two core questions: (1) Who counts as a refugee? (2) Which state takes them in?
      *   **Constraints:**
          *   Must handle specific hard cases (generalized violence, environmental collapse/state failure, particular social group defined by harm).
          *   Must prioritize grounds for state selection (presence, causation, capacity, ties).
          *   Must distinguish factual vs. value disagreements (where to stop/hand up).
          *   Must apply the procedure to three specific test cases.
          *   Must identify limits (missing evidence, normative questions the procedure can't settle).
          *   Context: 400 claims/year, notes defensible in appeal, legal officer sign-off.
      *   **Tone:** Professional, precise, philosophically rigorous but operationally practical. Acknowledge the tension between philosophical nuance and bureaucratic efficiency.

  2.  **Deconstruct Question 1: Who Counts? (Refugee Status Determination - RSD)**
      *   *Standard:* 1951 Convention (persecution + nexus + state inability/unwillingness).
      *   *Hard Case 1: Generalized Violence.* Standard interpretation usually requires individualization. *Philosophical/Operational compromise:* If state protection is absent *specifically* for a group, it counts. If truly generalized, usually no. *Decision:* Require a "differential risk" test.
      *   *Hard Case 2: Environmental/State Abandonment.* Not "persecution" in strict legal terms, but "failure of protection" fits the *surrogate protection* model. *Decision:* Treat state abandonment as functional persecution if linked to a protected ground (e.g., region/ethnicity).
      *   *Hard Case 3: PSG defined by harm.* (e.g., "victims of trafficking"). Circular. *Decision:* Require an immutable characteristic *prior* to harm.
      *   *Threshold:* "Well-founded fear." Needs to be objective + subjective.
      *   *Stop Point:* If the definition of "persecution" or "nexus" requires moral judgment beyond statutory interpretation, hand up.

  3.  **Deconstruct Question 2: Which State? (Responsibility Allocation)**
      *   *Grounds:* Presence/First Arrival (Dublin style), Causal Contribution (climate/foreign policy), Capacity (GDP/resources), Ties (family/language/colonial).
      *   *Ordering:* This is the most politically charged part.
          *   *Trump:* Non-refoulement (safety first).
          *   *Priority 1:* Ties (Integration potential/Family unity).
          *   *Priority 2:* Causal Contribution (Moral responsibility).
          *   *Priority 3:* Capacity (Utilitarian).
          *   *Tie-breaker:* First Arrival/Presence (Administrative convenience, usually lowest moral weight but high legal weight).
      *   *Constraint:* The user is in *one* state. They can't assign responsibility to *another* state legally, only recommend acceptance or transfer (safe third country). I need to frame this as "Does *this* state take responsibility?" vs. "Is there a safe third country?"
      *   *Correction:* The prompt asks for a priority ordering to pick *a* state. Since the caseworker is in *one* state, the procedure determines if *this* state accepts or if responsibility lies elsewhere (and if that elsewhere is safe).
      *   *Refinement:* Let's frame it as "Responsibility Assessment." If *this* state ranks highest, accept. If another ranks higher *and* is safe, propose transfer.

  4.  **Drafting the Procedure (The "Algorithm"):**
      *   Needs to be step-by-step.
      *   Needs "Stop/Hand Up" nodes.
      *   Needs clear criteria for "Sufficient Answer."

  5.  **Applying to Test Cases:**
      *   *Case 1 (Delta Farmers):* Environmental + State Abandonment. No armed group. Adjacent state (overburdened).
          *   *Analysis:* Failure of protection? Yes. Nexus? Region/Agriculturists. State responsibility? Causal (climate) + Capacity (us vs. adjacent).
      *   *Case 2 (Journalist):* Clear persecution. 3 safe countries. Ties here (sibling/work).
          *   *Analysis:* Refugee status = Yes. Responsibility = Ties (Trump over safe third country?).
      *   *Case 3 (Unaccompanied Minor):* Disbanded militia. Future risk uncertain.
          *   *Analysis:* Well-founded fear? Cessation clauses? Best interests of the child (Trump).

  6.  **Identifying Limits:**
      *   *Evidence:* Country of Origin Information (COI) gaps.
      *   *Credibility:* Caseworkers aren't lie detectors.
      *   *Normative:* Total obligations, border closure rights.

  7.  **Refining the Tone:**
      *   The user is a philosopher. They know the tension between ideal theory and non-ideal reality. Don't dumb it down, but make it *usable*.
      *   Acknowledge that compressing philosophy into a checklist creates "residuals" (cases that need human judgment).
      *   Ensure the distinction between *legal* eligibility (which the Legal Officer signs off on) and *philosophical/moral* triage (which the user advises on) is clear. The prompt asks for a procedure the *caseworker* runs, advised by the user's framework.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is asking a caseworker with 2 weeks training to weigh "Causal Contribution" realistic?
      *   *Fix:* Make Causal Contribution binary (e.g., Is our state a top emitter/involved in conflict?). Keep it simple.
      *   *Critique:* The prompt asks for a procedure to decide "Which state." But the caseworker works for *one* state.
      *   *Fix:* Frame the output as "Accept Jurisdiction" vs. "Refer to Safe Third Country." The priority ordering determines if *we* keep them or send them back.
      *   *Critique:* The "Environmental" case is legally shaky in many jurisdictions.
      *   *Fix:* Frame it through "Failure of Protection" (surrogate protection theory) rather than "Climate Refugee" (which doesn't exist in law). This aligns with the user's philosophical background (Hathaway, etc.).

  9.  **Final Polish:**
      *   Structure: Introduction -> The Procedure (Step-by-Step) -> Priority Ordering -> Application to Cases -> Limits.
      *   Ensure the "Hand Up" points are clear (where values clash).
      *   Check word count and density. (Keep it dense but readable).

  *(Self-Correction on the "Which State" question)*: The prompt asks for a priority ordering among grounds to pick *a* state. In a national authority, you generally decide "Us or Them." I will interpret this as a "Responsibility Weighting" to determine if the current state *should* accept, acknowledging that legally they can only enforce "Us or Safe Third." I will explicitly note this tension.

  *(Refining the "Environmental" case)*: The prompt specifically asks about "state has quietly abandoned." This fits the "surrogate protection" model. I need to make sure the procedure captures "State Unwillingness/Inability" without requiring a "Persecutor."

  *(Refining the "PSG defined by harm")*: This is the *Acosta* vs. *Ward* issue. I need to ensure the procedure demands an independent characteristic.

  *(Refining the "Priority Ordering")*:
      1.  Safety (Non-refoulement) - Absolute Trump.
      2.  Family/Ties - Strong moral claim.
      3.  Causal Contribution - Moral claim.
      4.  Capacity - Utilitarian.
      5.  First Arrival - Administrative (Tie-breaker).

