answer: |-
  You are not fooling yourself. The distinction you have drawn is robust, philosophically significant, and cuts deeper than the standard "heterogeneity of pleasure" worry. Your friend is mistaken: the heterogeneity problem asks whether all pleasures share a common *qualia* (a specific "feeling tone"). Your puzzle is structural: it asks about the *role* pain plays within a valuable experience.

  There is no single, universally agreed-upon label for your "ingredient case," but there are three overlapping frameworks that carve reality exactly where you are cutting. If you need a name to put in your notebook, I suggest **"Constitutive Adversity."**

  Here is the carving you asked for, the literature that supports it, and the test for whether it is an illusion.

  ### 1. The Name and The Literature

  Your "Price Case" maps onto **Instrumental Value**. The pain is a tool or a toll; it is causally necessary but essentially separate from the goal. (Dentist: Pain $\rightarrow$ Health).

  Your "Ingredient Case" maps onto **Constitutive Value**. The pain is not a means to the end; it is part of the end itself. Without the pain, the activity ceases to be the activity you value.

  Three specific bodies of work address this:

  **A. The Sublime (Aesthetics)**
  This is the oldest and perhaps best fit for your sea swim. In the 18th century, Edmund Burke and Immanuel Kant distinguished the *Beautiful* (smooth, pleasant, harmonious) from the *Sublime* (vast, terrifying, overwhelming).
  *   **The Carving:** The Sublime involves a "check on the vital forces." You feel fear or smallness (the cold shock), followed immediately by a realization of your own safety or capacity to endure.
  *   **Why it fits:** Kant explicitly argues that the pleasure of the Sublime *requires* the initial displeasure. If you removed the terror from a storm at sea, it would no longer be sublime; it would just be a view. The "bad part" is the friction that generates the spark.

  **B. Benign Masochism (Psychology)**
  Paul Rozin, a psychologist at the University of Pennsylvania, has studied why humans enjoy chili peppers, sad movies, and roller coasters. He calls this **"Benign Masochism."**
  *   **The Carving:** The mind enjoys the sensation of pain *because* it knows the body is not actually in danger. It is a mastery of the mind over the body's alarm systems.
  *   **Why it fits:** It explains the "burn" of the climb or the chili. However, Rozin focuses on *perceived* threat. Your sea swim involves *real* cold and *real* risk. This suggests your case is stronger than Rozin's; it is not just that the threat is benign, but that the reality of the sensation is itself valuable.

  **C. Internal Goods (Ethics/Practice)**
  The philosopher Alasdair MacIntyre distinguishes between **External Goods** (money, fame, health) and **Internal Goods** (excellences specific to a practice).
  *   **The Carving:** In a "practice" (like climbing or swimming), the difficulties are not obstacles to be removed; they are the very terrain upon which excellence is displayed.
  *   **Why it fits:** If you removed the hill from the climb, you haven't just made the climb easier; you have destroyed the climb. The resistance is constitutive of the activity.

  ### 2. How It Differs from Nearby Puzzles

  You were right to dismiss the **Heterogeneity Problem**. That debate (Mill, Sidgwick) asks: "Is the feeling of reading poetry the same *kind* of feeling as eating cake?" Your question is: "Why is *this* pain part of the value, while *that* pain is just a cost?" That is a question of structure, not sensation.

  You were also right to distinguish this from the **Paradox of Tragedy** (why do we enjoy sad films?).
  *   **Distance:** Tragedy relies on fiction. You know the grief on screen is not real.
  *   **Reality:** Your sea swim is somatic reality. The cold is not represented; it is incurred.
  *   **The Difference:** In tragedy, we pity the character. In the Ingredient Case, we *inhabit* the struggle. The value comes from agency, not observation.

  ### 3. Categorizing Your Examples

  Using the **Instrumental (Price)** vs. **Constitutive (Ingredient)** carving, here is where your examples fall:

  *   **A long run that hurts while you're doing it:** **Ingredient.**
      *   *Why:* If you could run the same distance at the same speed without the burn, it would cease to be an athletic achievement and become mere locomotion. The burn is the feedback of effort, which is the point of the run.
  *   **The sting of chilli in a hot curry:** **Ingredient.**
      *   *Why:* This is classic Benign Masochism. The "sting" is the flavor. Remove the sting, and you have a different dish. The pain is the spice.
  *   **Scratching an itchy bite:** **Price (with a caveat).**
      *   *Why:* This is primarily a **Relief Case**. The itch is a problem to be solved. The pleasure is in the *cessation* of the itch. However, the intensity of the scratch's pleasure is proportional to the itch, so it borders on Ingredient. But if you could remove the bite entirely, you would. You wouldn't pay to get the bite just to scratch it.
  *   **Grief at a funeral you wouldn't want to be without:** **Ingredient.**
      *   *Why:* This is the moral equivalent of the sea swim. The pain is constitutive of the love. To remove the grief would be to cheapen the relationship. It is **Constitutive Adversity** in the emotional realm.
  *   **Boredom that makes the following relief land harder:** **Price.**
      *   *Why:* This is a **Contrast Case**. The boredom itself has no value; it is merely a foil to heighten the relief. If you could have the relief without the boredom, you would take it. You do not value the boredom; you value the *change*.
  *   **A task you hate every minute of and would still call one of the best things you've done:** **Boundary Case.**
      *   *Why:* This tests your theory. If you truly hated *every minute*, it is likely a **Price Case** with a high External Good (e.g., saving a life, providing for family). However, if you value the *memory* of the struggle, it may shift to Ingredient in retrospect. This leads to your final question.

  ### 4. Settling the Question: Real Feature or Memory Illusion?

  You ask: *If the pleasantness isn't in any part of the experience, what it would mean to say the experience is pleasant at all?*

  This is the sharpest point of your puzzle. It suggests that "pleasure" might not be a sensation (like sweetness) but an **attitude** (like approval).

  If the "Ingredient Case" is an illusion, it is a **Narrative Illusion**. This would mean that in the moment, the pain is just pain (Price), but your memory rewrites the story later to make the pain seem noble (Ingredient).

  **The Test: The Counterfactual of Immediacy**
  To settle this, you must distinguish between valuing the *memory* of the pain and valuing the *presence* of the pain.

  1.  **The "Pause" Test:** During the sea swim, in those first thirty seconds of shock, if you could press a button to make the cold vanish *without* ending the swim, would you press it?
      *   If you say **Yes**: The pain is a Price. You tolerate it for the swim.
      *   If you say **No**: The pain is an Ingredient. You want the cold *now*, not just the memory of it later.
      *   *Your intuition:* You said you would refuse the offer to remove the shock. This suggests it is real, not a memory illusion.

  2.  **The "Experience Machine" Test (Nozick):**
      *   If you could plug into a machine that gave you the *feeling* of having conquered the swim (the pride, the relief, the endorphins) but without the actual cold water or the physical shock, would you do it?
      *   If you refuse, it proves you value the **reality of the resistance**, not just the psychological payoff. This confirms the Ingredient Case is about the *engagement with reality*, not just the feeling.

  3.  **The Attention Test:**
      *   In the Price Case (dentist), you focus *through* the pain to the future (when it will be over).
      *   In the Ingredient Case (swim), you focus *on* the pain as the object of your mastery. The cold is not something you look past; it is something you look *at*.

  ### Conclusion for Your Notebook

  The distinction is real. It is the difference between **Instrumental Suffering** (Price) and **Constitutive Adversity** (Ingredient).

  *   **Price:** The pain is a barrier. Value lies on the other side.
  *   **Ingredient:** The pain is the terrain. Value lies in the walking.

  The reason you cannot find a "felt ingredient" of pleasure in the swim is that the pleasure is not a sensation; it is a **second-order attitude**. It is the satisfaction of your will engaging with resistance. As the philosopher Harry Frankfurt might suggest, it is about wanting what you are experiencing, even if what you are experiencing is cold.

  If you need a label, write **"Constitutive Adversity."** It captures the fact that the adversity is not a cost paid for the experience, but a component required to compose it. The cold is not the toll for the swim; the cold is the ink.
