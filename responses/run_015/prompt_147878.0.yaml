answer: |-
  1. **The Determinism and Inertia Challenge**
  "If institutional latency is a matter of 'metabolism' rather than political will, you risk describing a physiological limit rather than a political failure. Doesn't this slide into a hard technological determinism where institutions *cannot* adapt, rather than *choose* not to? How do you rigorously distinguish 'metabolic outpacing' from the simpler, older critique of bureaucratic inertia?"
  *   **Follow-up Press:** She will likely appeal to evolutionary analogies to explain the metabolic constraint. Be ready to press: "If you lean on evolutionary analogies, you must accept their implications. Evolution selects for fitness, not survival of the individual host. Are you implying that the collapse of specific institutions is a natural selection process we should accept, rather than a problem to solve?"

  2. **The Metabolism-Innovation Trade-off**
  "To close the gap, you argue we must increase the metabolic rate of governance. But in biological systems, ramping up metabolism increases energy cost and error rates—a fever state. What specific form of institutional metabolism allows for faster adaptation without inducing systemic instability or stifling the very innovation that drives the economy?"
  *   **Follow-up Press:** She will likely propose modular or decentralized governance. Sharpen the point: "Modularity increases speed but fragments coherence. If governance is too modular to match fragmented tech, do we lose the capacity for collective action? How do you maintain the 'whole' while accelerating the 'parts'?"

  3. **AI: Qualitative Break or Quantitative Acceleration?**
  "Does artificial intelligence represent a qualitative break in outpacing dynamics, or is it merely a quantitative acceleration of the same pattern? If AI systems operate at speeds fundamentally inaccessible to human neural processing, does the 'adaptive latency' gap become permanent regardless of institutional reform?"
  *   **Follow-up Press:** If she argues AI can govern itself, press: "If AI governs AI, the human institution is removed from the loop entirely. Does your survival thesis still hold if 'survival' no longer requires human governance, or does that concede that the technology has outpaced the species?"

  4. **Von Neumann's Normative Trilemma**
  "Von Neumann's conclusion leaves us with a normative ambiguity: do we throttle technological growth, accelerate governance to match it, or accept a permanent state of disequilibrium? Which horn of this trilemma do you take, and why?"
  *   **Follow-up Press:** She will likely argue for accelerating governance. Hit the political cost: "Accelerating governance to match exponential tech often requires bypassing deliberative democracy. Is your survival thesis compatible with liberal democracy, or does closing the gap necessitate a form of techno-authoritarianism?"

  5. **Catastrophism vs. Structural Gap**
  "You explicitly reject catastrophist readings of Von Neumann, framing the risk as a structural gap rather than a destructive event. But if the gap widens indefinitely, isn't systemic collapse inevitable anyway? Is this distinction between 'outpacing' and 'catastrophe' merely semantic, or does it genuinely change the policy prescription?"
  *   **Intent:** Force her to clarify if "survival" is possible without resolving the gap, or if the gap *is* the catastrophe.

  6. **The Unit of Governance**
  "You speak of 'institutions' generally, but technology is transnational while metabolic institutions are often nation-states. If the operational speed of technology is global and the adaptive latency is local, does outpacing inevitably lead to the demise of the nation-state in favor of corporate governance structures that metabolize faster?"
  *   **Intent:** Challenge the scalability of her metaphor. If the nation-state is too slow, what replaces it, and is that replacement desirable?

  7. **Metaphor vs. Metric**
  "'Institutional metabolism' is a potent metaphor, but is it measurable? If we cannot quantify institutional latency or technological speed in commensurate units, how do we know when the gap is widening? Is this a policy framework or a philosophical posture?"
  *   **Intent:** Press on the practical applicability. A theory of survival needs diagnostics.

  8. **The Surgeon Problem**
  "If the problem is metabolic, the institution cannot fix itself from the inside without already possessing the speed it lacks. Who performs the surgery? What external force is capable of accelerating an institution's metabolism without breaking its structural integrity?"
  *   **Intent:** Expose the paradox of self-reform. If they could fix it, they wouldn't be outpaced.

  9. **Historical Precedent and Analogy**
  "The Industrial Revolution created a massive gap between mechanical speed and social adaptation, yet we survived. What makes the current outpacing fundamentally non-analogous to the 19th century? Is this a difference in degree, or does the digital nature of the technology change the topology of the gap?"
  *   **Intent:** Test the novelty of her thesis. If it's happened before, why is her specific Von Neumann reading necessary now?

  10. **The Teleology of Survival**
  "Finally, clarify the telos of your argument. When you argue for 'technological survival,' survival of what? Is it the continuation of human biology, the preservation of democratic norms, or simply the uninterrupted continuation of the technological process itself, regardless of the human cost?"
  *   **Intent:** Uncover the ultimate value judgment. Survival for whose sake?
