  **MEMORANDUM**

  **TO:** The Accessibility and Equity Funding Board
  **FROM:** Chair, Accessibility and Equity Funding Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: FY2024 Discretionary Budget Allocation ($180,000)

  ### 1. Executive Summary

  This memo communicates the Board's final decision regarding the allocation of the $180,000 annual discretionary budget. After rigorous deliberation, weighing the Charter's contractualist requirements against the equity mission's aggregationist concerns, the Board recommends a **Structured Compromise**.

  **The Decision:** The Board will allocate the full $180,000 to acquire the neuro-adaptive laboratory interface for the graduate student with severe motor impairment. However, this allocation is **conditioned** upon the immediate initiation of an administrative advocacy campaign to secure separate funding for the twelve pending accessibility grants, alongside a mandatory knowledge-transfer agreement with the recipient.

  This approach prioritizes the transformative need required by our Charter while structurally addressing the cumulative welfare concerns raised by the aggregationist position.

  ### 2. Context and Ethical Framework

  The Board faces a binary tension:
  1.  **Singular Allocation:** One student gains transformative research independence.
  2.  **Divided Grants:** Twelve students gain incremental daily access improvements.

  Our Charter mandates that allocations be "defensible to every affected student as a free and equal person." This is a **contractualist** standard (akin to Scanlonian contractualism), requiring that no individual could *reasonably reject* the principles governing our distribution. Conversely, several Board members argue that ignoring the cumulative welfare of twelve students in favor of one violates our **equity mission**, an **aggregationist** perspective that seeks to maximize total access across the student body.

  ### 3. Ethical Analysis

  #### A. The Contractualist Obligation (The Charter)
  Under the Charter, we must ask: *Could the single graduate student reasonably reject a principle that sacrifices their fundamental research capacity for marginal improvements for others?*

  The burden on the single student is existential to their role as a researcher. Without the interface, they remain dependent on assistants for core experimental tasks, fundamentally altering their status from "independent researcher" to "supervised participant." This creates a hierarchy of ability incompatible with their status as a "free and equal person" within the university.

  Conversely, could the twelve students reasonably reject this allocation? Their burden is significant—continued barriers to daily access—but it does not preclude their participation in the university to the same absolute degree. In contractualist reasoning, the intensity of the individual burden outweighs the sum of moderate burdens. To deny the interface is to tell the single student that their independence is fungible with the convenience of others. This violates the "free and equal" clause.

  #### B. The Aggregationist Objection (The Equity Mission)
  Board members arguing for aggregation contend that equity is distributive. Denying twelve students to fund one creates a "disability elite," where resources flow only to the most severe cases, leaving a "long tail" of unmet needs. They argue that twelve barriers removed is mathematically more equitable than one, and that refusing to aggregate welfare treats the twelve students as invisible.

  **Reply to Aggregationist Objection:**
  This objection is valid regarding *systemic* budgeting but flawed regarding *discretionary* triage. If we divide the funds ($15,000 each), we fail the single student completely (the interface is all-or-nothing) while only partially aiding the twelve. We achieve a "tyranny of the majority" where the most vulnerable bear the cost of broad distribution. However, the Board acknowledges that a decision satisfying the Charter cannot be the *end* of our ethical duty. If we fund the one and ignore the twelve, we validate a system where severe need is pitted against broad access. Therefore, the aggregationist concern must be met not by diluting the singular allocation, but by expanding the resource pool.

  ### 4. Recommendation: Structured Compromise

  The Board recommends the **Singular Allocation** of the $180,000, embedded within a **Structural Mitigation Framework**. This satisfies the Charter's immediate contractualist demand while operationalizing the aggregationist equity mission through policy.

  **Components of the Compromise:**
  1.  **Primary Allocation:** $180,000 released immediately for the neuro-adaptive interface.
  2.  **Advocacy Condition:** The Chair and Board Secretary will formally petition the Office of the Provost within 14 days to reallocate $180,000 from the General Student Welfare Fund to cover the twelve accessibility grants. The Board will make the approval of the interface contingent on the *initiation* of this petition, signaling that the twelve students are not being discarded, but rather that their funding source is insufficient.
  3.  **Knowledge Transfer:** The grant recipient must agree to document their adaptation protocols and host two workshops per semester for the broader disabled student community. This ensures the $180,000 investment generates aggregated welfare through shared knowledge, even if direct funding is singular.

  ### 5. Implementation Timeline

  | Phase | Timeline | Action Item | Responsible Party |
  | :--- | :--- | :--- | :--- |
  | **I. Notification** | Week 1 | Notify all 13 applicants of the decision framework. Emphasize that the 12 grants are being pursued via administrative advocacy. | Board Chair |
  | **II. Procurement** | Weeks 2-8 | Execute purchase order for neuro-adaptive interface. Ensure vendor includes site-license for software components where possible. | Grants Admin |
  | **III. Advocacy** | Weeks 2-12 | Submit formal proposal to Provost for matching funds for the 12 grants. Schedule review meeting. | Board Secretary |
  | **IV. Integration** | Month 4 | Recipient installs interface. Begin documentation of adaptation protocols for open-source release. | Recipient & IT |
  | **V. Review** | Month 6 | Board reviews Provost response. If matching funds denied, Board prioritizes the 12 students for the *next* fiscal cycle's first tranche. | Full Board |

  ### 6. Conclusion

  This decision is not a dismissal of the twelve students' needs, but a recognition that the Charter binds us to protect the most vulnerable from reasonable rejection first. By funding the interface, we uphold the status of the single student as an equal researcher. By coupling this with aggressive advocacy and knowledge sharing, we honor the aggregationist insight that equity requires broad attention.

  We cannot solve systemic underfunding by sacrificing the most critical individual need. We solve it by meeting the critical need while demanding the system expand to catch the rest.

