          *   *Repeated Interaction:* The user asks about repeated games. In standard Iterated Prisoner's Dilemma (IPD), you need to know you are playing against the *same* opponent to use strategies like "Tit-for-Tat." If opponents are random and anonymous, direct reciprocity is impossible.
          *   *Indirect Reciprocity:* This is the key concept. Even if I don't know *who* took my shears, if I know the *system* works (i.e., someone else put good stuff in), I might contribute. This relies on "Generalized Reciprocity" (I help the group, the group helps me).
