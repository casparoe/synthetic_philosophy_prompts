      *   User's specific questions addressed? Yes.
      *   Verdict clear? Yes.
      *   Better source domain suggested? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: Make sure not to get too bogged down in Williamson vs. Brown specifics, keep it focused on the analogy's structural integrity. Ensure the distinction between *regulative* and *constitutive* norms is hinted at but not jargon-heavy. The user is in a seminar, so they know the jargon, but clarity is key.

      *Wait, one nuance:* The user asked about "belief basis vs expression." Need to clarify that betting reveals a *degree* of belief, while assertion presents a *flat-out* belief (usually). This is a category error in the analogy.

