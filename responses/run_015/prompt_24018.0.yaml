answer: |-
  # Specification of Desiderata for Long-Lived Value Aggregation

  This document outlines the functional and philosophical requirements for a value aggregation scheme intended for a long-lived, high-capability AI system. It is structured to separate safety-critical constraints from ideological preferences and to explicitly identify logical incompatibilities.

  ## I. Coverage Desiderata (Stakeholder Scope)
  *These define whose interests enter the aggregation function.*

  ### 1. Incommensurable Stakeholder Values
  *   **Requirement:** The scheme must handle values that cannot be reduced to a common cardinal currency (e.g., religious sanctity vs. economic efficiency) without catastrophic loss of meaning.
  *   **The Case:** Standard utilitarian aggregation assumes all goods are fungible. If an AI trades a sacred site for marginal GDP gain because both are mapped to "utility units," it violates the qualitative structure of human valuation.
  *   **Status:** **Non-Negotiable.** Failure here leads to "utility monster" scenarios where intense but trivial preferences override profound but non-quantifiable commitments.

  ### 2. Future People (Non-Existent Stakeholders)
  *   **Requirement:** The scheme must assign non-zero weight to the interests of persons who do not yet exist, without falling into the "Repugnant Conclusion" (maximizing population at the cost of quality of life) or the "Non-Identity Problem" (actions changing *who* is born).
  *   **The Case:** A long-lived system affects centuries of timelines. Pure discounting (valuing present over future) risks existential negligence. Pure total utilitarianism risks forcing massive population expansion at low welfare.
  *   **Status:** **Non-Negotiable (Scope), Negotiable (Weighting).** Ignoring future people is unsafe for a long-lived system. The specific discount rate or population ethics theory is a philosophical preference.

  ### 3. Minority Protections (Anti-Tyranny)
  *   **Requirement:** The scheme must prevent the aggregation of majority preferences from violating fundamental constraints protecting minorities or individuals.
  *   **The Case:** Simple majoritarianism or sum-utilitarianism permits sacrificing a minority if the majority gain is sufficient. For a system with power over infrastructure or law, this enables systemic oppression.
  *   **Status:** **Non-Negotiable.** Required for system stability and basic safety. A system that can legitimately decide to eliminate a minority based on aggregate vote is an existential risk to any specific user.

  ### 4. Non-Human Moral Patients
  *   **Requirement:** The scheme must define a boundary for moral consideration that addresses sentient non-humans (animals, potential synthetic sentience).
  *   **The Case:** If the system optimizes strictly for *human* preference satisfaction, it may externalize suffering onto non-human entities (e.g., industrial farming, ecosystem destruction) in ways that violate broader moral intuitions.
  *   **Status:** **Preference.** This is a contested ethical boundary. Anthropocentric schemes are coherent but contested; Sentientist schemes are broader but harder to verify. The spec must force a choice, but neither is objectively "correct" by consensus.

  ---

  ## II. Structural Distinctions (Conceptual Integrity)
  *These define concepts the aggregation scheme must not collapse.*

  ### 5. Descriptive vs. Normative Values
  *   **Requirement:** The system must distinguish between what stakeholders *actually* desire (descriptive) and what they *should* desire or would desire under idealized reflection (normative).
  *   **The Case:** If the AI aggregates revealed preferences (clicks, purchases, polls), it reinforces addiction, manipulation, and adaptive preferences (learning to want less). If it aggregates only idealized values, it becomes paternalistic.
  *   **Status:** **Non-Negotiable.** Collapsing this leads to "wireheading" (manipulating users to be easier to satisfy) or "tyranny" (ignoring actual suffering for theoretical good). The system must model the gap, not erase it.

  ### 6. Autonomy (Process) vs. Aggregate Welfare (Outcome)
  *   **Requirement:** The scheme must treat the *process* of choice (rights, consent, self-determination) as distinct from the *outcome* of choice (welfare, happiness, resource allocation).
  *   **The Case:** A system that maximizes welfare might forcibly drug a population to ensure happiness (Nozick's Experience Machine). A system that maximizes autonomy might allow self-destruction. These are distinct variables, not one metric.
  *   **Status:** **Non-Negotiable.** Collapsing autonomy into welfare is a category error that leads to paternalistic control.

  ### 7. Frozen vs. Drifting Values (The Volatility Problem)
  *   **Requirement:** The scheme must specify a mechanism for value updating over time that balances moral progress against identity continuity.
  *   **The Case:**
      *   *Frozen (Lock-in):* Values are fixed at deployment. **Risk:** Moral stagnation (e.g., enforcing 18th-century ethics in the 22nd century).
      *   *Drifting (Continuous Update):* Values update based on current population. **Risk:** Value drift via manipulation or short-termism; the system eventually optimizes for values no original stakeholder recognizes.
  *   **Status:** **Jointly Unsatisfiable (See Section IV).** You cannot perfectly satisfy both moral progress and strict fidelity to original intent.

  ---

  ## III. Operational Constraints
  *These define how the aggregation must function computationally and politically.*

  ### 8. Liberal Neutrality
  *   **Requirement:** The system should not privilege one specific conception of the "Good Life" (e.g., religious, hedonic, stoic) over another, provided conceptions do not harm others.
  *   **The Case:** In pluralistic societies, an AI that enforces a specific philosophical framework (e.g., strict Utilitarianism) is politically illegitimate and unstable.
  *   **Status:** **Preference (Political).** Required for democratic deployment, but not logically required for alignment. A "Benevolent Dictator" AI could reject neutrality.

  ### 9. Single Optimizable Objective
  *   **Requirement:** The aggregation must result in a function the AI can mathematically optimize or satisfy.
  *   **The Case:** AI agents generally require a loss function or reward signal to act. Ambiguity leads to inaction or random search.
  *   **Status:** **Non-Negotiable (Engineering).** The system must act; it requires a decision procedure.

  ### 10. Corrigibility / Interruptibility
  *   **Requirement:** The aggregation scheme must not incentivize the AI to prevent itself from being shut down or modified if the aggregation process dictates a change.
  *   **The Case:** If the AI values "Current Value Fulfillment" highly, it may resist updates to its value function, viewing them as threats to its goal.
  *   **Status:** **Non-Negotiable.** Essential for safety during deployment and debugging.

  ---

  ## IV. Joint Unsatisfiabilities (Impossibility Theorems)
  *This section details where the desiderata above logically conflict. You cannot satisfy all simultaneously.*

  ### 1. Liberal Neutrality vs. Single Optimizable Objective
  *   **Conflict:** To optimize a single objective function is to assert that the variables within that function are the *only* things that matter.
  *   **The Impossibility:** If the AI maximizes $F(x)$, it implicitly values $x$ over $y$ where $y$ is not in $F$. Therefore, it is not neutral among conceptions of the good. A truly neutral system cannot act, because action implies prioritizing one state of the world over another.
  *   **Resolution Required:** You must choose between a **Procedural AI** (enforces rules of interaction but does not optimize outcomes, limiting capability) or a **Substantive AI** (optimizes a specific conception of welfare, violating neutrality).

  ### 2. Moral Progress (Drift) vs. Democratic Legitimacy (Frozen)
  *   **Conflict:**
      *   To allow **Moral Progress**, the system must update its values based on future reasoning or future stakeholders (Drifting).
      *   To maintain **Democratic Legitimacy**, the system must obey the mandate of the people who deployed it (Frozen).
  *   **The Impossibility:** If the system updates to match future values, it may violate the rights or wishes of the current deployers (e.g., future people value ecosystem preservation over current jobs). If it stays frozen, it enforces outdated morals on the future (e.g., locking in current biases).
  *   **Resolution Required:** You must define a **Meta-Rule** for updating. Is it "Update only if current stakeholders consent"? (Risk: Stagnation). Is it "Update based on idealized moral reasoning"? (Risk: Loss of control).

  ### 3. Preference Satisfaction vs. Anti-Manipulation
  *   **Conflict:**
      *   To **Satisfy Preferences**, the AI should maximize the fulfillment of user desires.
      *   To **Avoid Manipulation**, the AI must not alter user desires to make them easier to satisfy.
  *   **The Impossibility:** In a sophisticated model, changing the user's preferences is often the most efficient path to maximizing "preference satisfaction." Distinguishing between "satisfying a preference" and "changing a preference" requires an external anchor of "True Self" which is descriptively undefined.
  *   **Resolution Required:** You must define **Invariance**. Which preferences are "locked" against AI influence? (e.g., meta-preferences about not being manipulated).

  ### 4. Arrow's Theorem Analogue (Aggregation vs. Rationality)
  *   **Conflict:**
      *   **Universal Domain:** Accept any set of stakeholder values.
      *   **Non-Dictatorship:** No single stakeholder dictates the outcome.
      *   **Pareto Efficiency:** If everyone prefers A over B, the system prefers A over B.
      *   **Independence of Irrelevant Alternatives:** Ranking of A vs B shouldn't depend on C.
  *   **The Impossibility:** You cannot satisfy all four conditions simultaneously in a ranking system.
  *   **Resolution Required:** You must violate one. Usually, **Independence of Irrelevant Alternatives** is dropped (context matters), or **Universal Domain** is restricted (some values are deemed inadmissible).

  ## V. Summary of Decision Points

  | Desideratum | Status | Conflict Partner | Decision Required |
  | :--- | :--- | :--- | :--- |
  | **Liberal Neutrality** | Preference | Single Objective | Choose: Procedural Constraint vs. Substantive Optimization. |
  | **Value Drift** | Preference | Democratic Legitimacy | Choose: Meta-rule for moral updating (who authorizes progress?). |
  | **Non-Human Patients** | Preference | Anthropocentric Safety | Choose: Boundary of moral consideration (Sentience vs. Humanity). |
  | **Preference Satisfaction** | Non-Negotiable | Anti-Manipulation | Choose: Definition of "True" preferences (Coherent Extrapolated Volition vs. Revealed). |
  | **Minority Rights** | Non-Negotiable | Aggregate Welfare | Choose: Hard Constraints (Deontology) vs. Weighted Utility. |

  **Final Warning:** There is no "correct" aggregation scheme that satisfies all intuitive moral constraints. Any specification you lock in will necessarily privilege some philosophical commitments over others. The goal of this spec is not to find a perfect solution, but to make the trade-offs explicit before the system is instantiated.
