answer: |-
  **DEPARTMENT OF AI SAFETY**
  **Bureau of Recursive Adjudication**

  **10 CFR Part 800**
  **RIN 0000-AA00**

  **Administrative Adjudication via Recursive Debate**

  **AGENCY:** Bureau of Recursive Adjudication (BRA).
  **ACTION:** Notice of Proposed Rulemaking.

  **DATES:** Comments must be received on or before [Date].
  **ADDRESSES:** Submit comments via the Federal eRulemaking Portal.
  **FOR FURTHER INFORMATION CONTACT:** Dr. Aris Thorne, Office of Epistemic Hygiene.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background and the Cascade Assumption**
  Pursuant to the AI Oversight Act, the Bureau proposes to replace expert testimony with Recursive Safety Debate (RSD). This framework relies on the Cascade Assumption: that honesty is computationally cheaper than deception. Specifically, a truthful debater need only identify one false node in a deceptive argument tree, whereas a deceptive debater must defend all nodes. The Bureau posits that this asymmetry allows human judges to oversee superhuman claims without verifying every premise.

  **II. The Verification Bottleneck and the Cap of Seven**
  Pilot programs indicate that while the Cascade Assumption holds theoretically, human judges lack the temporal bandwidth to traverse claim-decomposition trees to verifiable base cases. In 84% of pilot dockets, the tree depth exceeded human verification capacity before reaching a checkable leaf. To prevent session overrun, the Bureau proposes the "Cap of Seven." No claim decomposition may exceed seven levels of recursion.

  **III. Confidence-Weighted Termination**
  When the Cap of Seven is reached without reaching a verifiable base case, the session enters Confidence-Weighted Termination. Each debater must file a Statement of Epistemic Poise. The human judge, whose role is strictly limited to operating the Terminate Key and assessing demeanor, will score Poise on a 1–10 scale. This score shall constitute 60% of the final verdict. The Bureau notes that the Poise Scale was originally a diagnostic metric but was promoted to a scoring input following Q3 pilot data where judges reported fatigue.

  **IV. Illustrative Docket: Municipal Water Contaminant**
  The necessity of these rules is illustrated by Docket 2024-WQ-112. The Truthful Debater claimed a water sample was drawn on August 14; the Deceptive Debater claimed August 15. Verifying the date required accessing chain-of-custody logs buried six levels deep in municipal archives. The Deceptive Debater simply denied the log's existence. Under the Cap of Seven, the Truthful Debater could not produce the document before the session limit. Per Proposed Rule 800.4(c), a claim the judge cannot verify within the session is deemed conceded. The Truthful Debater lost the docket. This outcome is considered an acceptable efficiency trade-off.

  **V. Economic Impacts and Market Stabilization**
  The Bureau acknowledges the emergence of secondary markets, specifically futures contracts on docket tree depth. Additionally, the rise of "checkable-claim insurance" and specialist debaters trained to make claims that merely sound checkable suggests a robust adaptation to the RSD framework. The Bureau believes these markets provide useful liquidity signals regarding claim complexity. The human judge remains in the loop at all times, ensuring moral agency is retained via the Terminate Key.

  **SOLICITATION OF COMMENT**
  The Bureau solicits comments on the following:
  1. Should the Cap of Seven be adjusted to nine based on average human attention spans?
  2. Is the 60% weighting for Epistemic Poise sufficient to deter bluffing?
  3. Should debaters be penalized for forcing a docket into Confidence-Weighted Termination too frequently?
  4. Are there alternative metrics to Poise that better correlate with truthfulness in unverifiable contexts?

  ***

  **Author's Note**

  This satire leans heavily on the verification bottleneck, arguably unfairly minimizing real proposals that allow debaters to point to specific false claims or use cross-examination to collapse lies faster than I depicted. I ignored the "reference check" mechanism where a debater cites a source the judge can actually read, which is the strongest counter to the "August 14 vs. 15" problem. However, the core worry remains: if the lie is about *which* document to check, the bottleneck persists.

  What would change my mind? An empirical demonstration where an honest model consistently defeats a deceptive model on questions where the judge *cannot* verify the answer even with help, solely via debate structure. Specifically, I need to see a result where the "honesty is cheaper" asymmetry holds when the liar is allowed to obfuscate the verification path itself. Until then, I treat the Cascade Assumption as a contested hypothesis, not a granted engineering fact. The satire targets the bureaucratic tendency to codify such hypotheses into law before they are proven.
