      *   **Severity 3:** (b) vs (c). (Substantive Hard Problem vs. Conceptual Strategy). *Actually, this is likely apparent.* I will classify it as apparent but requiring care.

      *   **Recommendation:** Qualify (d). Don't claim a full "solution" to the meta-problem if you admit an irreducible residue drives the intuition. Or, rephrase (f) to ensure the mystery is *epistemic* only, not *explanatory* in a way that threatens (a).
