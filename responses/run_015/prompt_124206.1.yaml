          *   Be specific about *why* commitments pull against each other.

  2.  **Deconstruct the Profile (The Seven Commitments):**
      *   (a) **Physicalism:** Conscious states = physical processes. No non-physical ontology.
      *   (b) **Hard Problem Realism:** The Hard Problem is legitimate/substantive, distinct from cognitive function, not just a pseudo-problem solvable by conceptual analysis *alone*.
      *   (c) **Phenomenal Concept Strategy (PCS):** Phenomenal concepts have a unique cognitive architecture (direct, demonstrative) explaining the *feeling* of an explanatory gap.
      *   (d) **Meta-Problem Solution:** PCS solves the meta-problem (explains why we have anti-physicalist intuitions).
      *   (e) **Zombie Conceivability:** Conceivability is a fallible guide to possibility. Physicalists bear a non-trivial burden to explain why zombies seem conceivable.
      *   (f) **The Residue:** Even after solving the meta-problem, there remains an *irreducible residue of puzzlement* about why physical processes accompany experience. PCS doesn't *fully* eliminate the mystery.
      *   (g) **Cognitive Specialness:** The specialness of phenomenal concepts is purely cognitive/representational, not ontological.

  3.  **Initial Scan for Obvious Conflicts:**
      *   (a) + (g) seem consistent (Physicalism + Cognitive explanation).
      *   (c) + (d) seem consistent (PCS explains meta-problem).
