          4.  Scientific laws describe the invariant structure of divine action relative to essences, not secondary causality.
      *   **Task:** Provide an honest map of genuine defeaters (not just "science assumes causation").
      *   **Specific Questions to Address:**
          *   Neuroscientific reduction (mental/physical junction).
          *   Quantum indeterminacy (strengthens or weakens?).
