  The principle that distinguishes these cases is the **Principle of Derivative Authority with Procedural Integrity**. It holds that a self-referential legal act is valid if and only if: (1) the authority to perform the act and the procedure used are derived entirely from the rules in force *immediately prior* to the act (**Anterior Compliance**); and (2) the act does not abolish the minimum procedural constraint necessary to maintain the acting body's identity as a distinct, collective agent (**Non-Nullification**).

  Under this principle, Cases (1), (3), and (5) are valid. In (1) and (3), the amendment power is derived from prior rules, and the new rules (quorum of 50, simple majority) retain a procedural threshold that preserves the collective nature of the decision. In (5), the contract validly forms before the termination condition triggers; the self-reference is temporal, not structural. Case (2) is invalid due to logical contradiction, which violates the coherence requirement of any legal system.

  The **Unlisted Case** (statute enacted via violated prior rules) is **invalid**. It fails the Anterior Compliance prong; a rule cannot cure the procedural defect of its own enactment.

  Regarding **Case (4)**, this principle **accommodates** your verdict. While structurally similar to (3), the Meta-board's elimination of its quorum violates the Non-Nullification prong. By removing the quorum entirely, the board dissolves the procedural constraint that defines it as a *board* rather than a collection of individuals, effectively engaging in the "illegitimate bootstrapping" you identified. It transforms the agent's identity rather than merely amending its rules. However, the principle cannot save your verdict on (4) if you believe the act is invalid *even if* a minimal quorum were retained; in that specific interpretation, the principle would require overturning the verdict, as derivative authority permits self-modification so long as the collective identity persists.

  Verdict: The Principle of Derivative Authority with Procedural Integrity validates cases complying with prior rules that preserve collective agency, invalidates the unlisted statute for procedural violation, and accommodates your verdict on case (4) by classifying total quorum elimination as a nullification of the board's constitutive identity.
