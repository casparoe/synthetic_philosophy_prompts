answer: |-
  Dear Colleague,

  I am writing to you because the difficulty you describe is not merely procedural but deeply philosophical, and your tutor has correctly identified that the establishing instrument's clause about fully informed and impartial deliberators is doing work that it cannot logically sustain on its own. You are right to feel that treating this clause as a metaphysical oracle invites the shmagency worry, where you are either discovering independent moral truths or constructing them arbitrarily, and you are also right to feel that the specification of the deliberator is a family of choices rather than a single definition. The procedure I am proposing does not attempt to solve these philosophical problems in the abstract but rather to domesticate them for the purpose of statutory compliance and judicial review. The core shift you must make is to stop asking what the idealized deliberator would choose as a fact of the matter and start asking whether a specific specification of that deliberator is consistent with the calibrated judgments you already hold and the statutory constraints you operate under. This moves the clause from being a source of normative truth to being a discipline for argumentation, which is sufficient for legitimacy even if it does not satisfy moral realism.

  The procedure begins before you look at the hard cases and requires you to dedicate the first thirty minutes of your meeting to calibration. You must select five past allocation decisions or hypothetical scenarios where all six members feel a high degree of confidence that the outcome was correct, such as a case of catastrophic device failure causing total disability or a case of minor inconvenience with no physical harm. For each of these calibration cases, you must articulate the specific information the deliberator possessed, the level of impartiality required, and the weight given to competing values like need versus desert. You are not looking for unanimity on the theory here but for convergence on the outcome, and you will record these as your anchor points. If you cannot agree on five anchor points, you cannot proceed to the hard cases because you have no calibrated instrument. Once these anchors are set, you move to the specification phase for the live proposal. Here you must explicitly state which version of the idealized deliberator you are testing against the proposal, defining exactly what information they have access to, such as whether they know the total fund size, the specific medical history of the claimant, or the statistical risk profile of the cohort. You must also state what they are impartial with respect to, such as whether they know their own position in the queue or their own susceptibility to the device failure. This specification must be written into the minutes before you debate the outcome, because if you change the specification mid-debate to achieve a desired result, you are laundering values rather than testing them.

  When you encounter missing inputs, such as having no defensible estimate of the claimant pool's risk aversion or no way to model contributory behaviour, you must not guess. The procedure requires you to perform a sensitivity analysis across the plausible range of that missing input. If the allocation recommendation holds steady whether the deliberator is highly risk-averse or risk-neutral, you may treat the conclusion as robust. However, if the recommendation flips depending on the assumption, you have reached the limit of the deliberative model and must trigger the value handoff. This is the crucial moment where you distinguish normative reason from legitimate justification. In your published reasons, you must write something along the lines of the following: The committee finds that under Specification A the idealized deliberator would choose X, but under Specification B they would choose Y, and the evidence does not permit us to privilege one specification over the other. Consequently, the committee is exercising its statutory discretion to adopt Specification A based on the value of solidarity. You must not write that the idealized deliberator would choose X if that is only true under one contested specification. This transparency is what survives judicial review, as it shows you have considered the statutory test honestly rather than using it as a cover for a political choice.

  Applying this to your first live proposal regarding the flat payment versus the severity-scaled schedule, you must first check your calibration anchors. If your anchors include cases where severe harm was compensated significantly more than minor harm, the severity-scaled schedule is likely the calibrated outcome, and the flat payment would require a value handoff. If your anchors are mixed or focused on eligibility rather than quantum, the model may be indeterminate. Given that you are strongly drawn to the flat payment for reasons of dignity and solidarity, you must be prepared for the procedure to undercut that preference if your calibration shows a strong historical commitment to need-based allocation. If the sensitivity analysis shows that a risk-averse deliberator prefers the flat payment for security while a need-focused deliberator prefers the scaled payment for relief of suffering, and you have no statutory guidance on which value dominates, you must mark the handoff. You would publish that the idealized deliberation model yields divergent results based on reasonable specifications of risk versus need, and that the committee chooses the flat payment to prioritize the equal dignity of all claimants over the maximization of harm relief. This is honest, it is defensible, and it does not pretend that dignity is a fact discoverable by the deliberator rather than a value chosen by the committee.

  For the second proposal concerning the group whose devices have not failed but face elevated risk, the calibration phase is likely to be silent because your existing anchors probably involve actual harm. Here the specification of information is critical. If the idealized deliberator is informed only of actual physical damage, they will allocate nothing. If they are informed of statistical risk and the cost of monitoring, they may allocate something. Since the statute does not define harm as exclusively physical, this is another value handoff. You should not claim the deliberator would necessarily pay them. Instead, you should state that the committee is defining the scope of the fund to include risk mitigation based on the value of prevention, acknowledging that this extends beyond the calibrated cases of actual failure. This protects you from judicial review because you are not misrepresenting a value expansion as a factual finding about the deliberator's choice.

  Regarding the third proposal on reducing awards for smoking or comorbidity, the specification of the deliberator's knowledge is the pivot. If the deliberator is fully informed of the claimant's behaviour, would they reduce the award? If your calibration cases involve contributory negligence, you may have an anchor. If not, you are again in the zone of value choice. If the committee feels that the device failure is the dominant cause regardless of smoking, you must state that you are specifying the deliberator to treat the device failure as the overriding harm, effectively bracketing the smoking not because the deliberator ignores it, but because the committee values compensation for the manufacturer's failure over personal responsibility in this context. You must write that the reduction is not applied because the committee determines that the statutory purpose is to compensate for the device failure specifically, rather than to adjudicate overall health outcomes. This distinguishes the decision from a finding that smoking is irrelevant, which would be factually dubious, and frames it as a policy choice about the fund's purpose.

  There are limits to what this procedure can do, and you must be clear about them in your own minds even if you do not publish all of them. This procedure will systematically get wrong any question where the committee's calibration is itself corrupted by bias or where the anchor cases are themselves unjust. It cannot solve the zero-sum tragedy that the fund is too small, and it will give you false confidence if you treat the calibration phase as a one-off exercise rather than something that must be revisited as the fund depletes or new medical evidence emerges. The shmagency worry survives in the sense that this procedure does not prove your allocations are morally right, only that they are consistent with your own prior judgments and transparent about where those judgments run out. The specification worry survives because you are still choosing which specification to use when they diverge, but you are now admitting that choice rather than hiding it. Ultimately, this procedure converts the establishing instrument's clause from a command to find a unique right answer into a command to be consistent and transparent about the values you are applying when the answer is not unique. This is sufficient for legitimacy because it treats the claimants as persons entitled to reasons rather than problems to be solved, and it treats the committee as responsible agents rather than passive conduits of a hypothetical will. You should run this procedure exactly as described, even if it forces you to acknowledge that your preference for the flat payment is a value choice that overrides the calibrated signal of need, because the integrity of the reasons is more important for surviving review than the comfort of the outcome. I hope this provides a workable path through the philosophical thicket while keeping your feet on the ground of administrative law.
