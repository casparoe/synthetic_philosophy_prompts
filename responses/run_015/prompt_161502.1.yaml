      *Interpretation:* I can use paragraphs. I just can't use structural markers like "1.", "-", "**".

      *Plan:*
      1.  Salutation and acknowledgement of the tutor's insight.
      2.  Reframing the problem (statutory compliance vs moral truth).
      3.  The Procedure Step 1: Calibration.
