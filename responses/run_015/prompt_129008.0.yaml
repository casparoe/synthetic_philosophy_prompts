answer: |-
  You have put your finger on one of the live wires in contemporary metaethics. Your intuition is not only coherent; it aligns with a robust philosophical position that has gained significant traction in the last thirty years, though it remains contested. You are describing the tension between **Reasons Internalism** and **Reasons Externalism**, but you are pushing past the standard formulation into a specific ontological question about the *persistence* of normative relations.

  Since you cannot access the library, I will not give you a bibliography. Instead, I will give you the conceptual map, the terminology you need to navigate the room, and a proposed "carving" of the concept you have identified so you can defend it.

  ### 1. The Established Landscape: Internalism vs. Externalism

  To defend your position, you must first name the opposition. The view you are instinctively rejecting is **Reasons Internalism** (most famously associated with Bernard Williams).

  *   **Internalism:** A reason must be capable of motivating the agent. If a consideration cannot be reached by a sound deliberative route from the agent's current motivations (or "subjective motivational set"), it is not a reason *for them*. It might be a good thing that they do it, but it is not a *reason* they possess.
  *   **Externalism:** A reason is a fact that counts in favour of an action, regardless of whether the agent is motivated by it or even capable of grasping it. (Associated with Thomas Nagel, Derek Parfit, and T.M. Scanlon).

  You are an **Externalist**. Your "field" analogy is precisely the Externalist picture: normative facts exist like gravitational fields; the presence of a mass (an agent) allows the field to manifest as force (motivation/action), but the field's existence does not depend on the mass.

  However, standard Externalism usually assumes the agent *exists* and is *rational*. Your cases (the dead researchers, the dementia patient) challenge the boundary condition: **Can a reason survive the loss of the agent's capacity to hold it?**

  ### 2. The Concept: "Detached Agent-Specific Reasons"

  There is no single canonical term for the exact phenomenon you describe, because most philosophers stop at "External Reasons." However, to carve this for your group, I propose you use the term **"Detached Agent-Specific Reasons" (DASR)**.

  Here is the definition you can offer the group:

  > **Definition:** A Detached Agent-Specific Reason is a normative fact that counts in favour of a specific agent (or role-filler) performing an action, which retains its normative force even when the agent lacks the psychological capacity to grasp it, or no longer exists to act on it.

  This distinguishes it from the three "nearest candidates" you mentioned:

  1.  **Vs. Subjective/Internal Reasons:** Subjective reasons vanish when the agent's beliefs or motivations change. A DASR persists despite the agent's psychology (or lack thereof).
  2.  **Vs. Impersonal (Agent-Neutral) Value:** Impersonal value says, "It would be good if the instrument were calibrated." A DASR says, " *You* (or whoever holds this post) had reason to calibrate it." The DASR retains a **direction of address**. It licenses criticism of a specific locus of agency, not just regret about a state of affairs.
  3.  **Vs. Hypothetical Imperatives:** A hypothetical imperative says, "If you want X, do Y." A DASR is categorical regarding the role or the interest, not contingent on the agent's current desires.

  ### 3. Carving the Boundaries (The "Measurement" Conditions)

  To defend this in your group, you need to specify where the concept holds and where it collapses. Here are four boundary conditions for a DASR:

  **A. The Anchor Condition (Who is it for?)**
  A DASR must be anchored to an **agent-identity** or a **role**, not just an outcome.
  *   *Boundary:* "It would be good if the patient took meds" is impersonal value. "The patient has reason to take meds" is a DASR. The difference is that the latter makes the physician's interference a protection of the *patient's normativity*, not just an imposition of the doctor's will.

  **B. The Capacity Independence Condition**
  The reason must not depend on the agent's current rational capacity.
  *   *Boundary:* If the reason vanished the moment the dementia progressed, it would be a Subjective Reason. If it persists through the loss of capacity, it is a DASR.

  **C. The Temporal Persistence Condition**
  The reason must be capable of being stated as a timeless truth about a time-bound situation.
  *   *Boundary:* "There *was* reason to check the log" is uncontroversial. Your claim is stronger: "The reason *exists* (tenselessly) as a normative fact about that past situation." It is like a coordinate in spacetime that retains its metric properties even if no observer visits it.

  **D. The Criticism Condition (The "Teeth")**
  This is your strongest point. A mere fact about "goodness" does not license criticism of a specific agent. A DASR does.
  *   *Boundary:* If the logbook note licenses the criticism "They failed in their duty," it is a DASR. If it only licenses "What a pity the data is noisy," it is merely Impersonal Value.

  ### 4. Are Your Two Cases the Same Phenomenon?

  You asked if the Logbook (dead agents) and the Dementia (incapacitated agent) are the same animal. Philosophically, they strain the concept in different ways.

  *   **The Dementia Case (Incapacitated Owner):** This is widely accepted in medical ethics under the concept of **"Best Interests"** functioning as **"Substituted Reasons."** Most Externalists argue the reason remains *his* because his welfare is the anchor, even if his rationality is not. This is the easier case to defend. The "agent" still exists biographically and legally.
  *   **The Logbook Case (Absent Owner):** This is the harder case. If the agents are dead and the instrument scrapped, who is the reason *for*?
      *   *Defense:* You must argue the reason was anchored to the **Role** (Researcher/Group Member), not the **Person**. The role persists in the historical record. The criticism is directed at the *occupant of the role at time T*. The reason exists now as a truth about the normative landscape at time T.
      *   *Distinction:* In the dementia case, the reason is *current* but *ungraspable*. In the logbook case, the reason is *past* and *unclaimable*.
      *   *Verdict:* They are distinct species of DASR. One is **Synchronic Detachment** (agent exists but can't hold the reason); the other is **Diachronic Detachment** (agent/role no longer active). You should concede this distinction to the group; it shows precision.

  ### 5. The Asymmetry: Theoretical vs. Practical

  You noted that evidence for a hypothesis seems fine without a believer, but practical reasons feel weird without an actor. This is the **Theoretical/Practical Asymmetry**.

  *   **The Trap:** Many philosophers argue this is a real metaphysical difference. Belief aims at Truth (which is mind-independent); Action aims at Good (which might be mind-dependent).
  *   **Your Defense (The Symmetry Thesis):** You should argue the asymmetry is psychological, not ontological.
      *   *Argument:* Evidence is a reason to *believe*. A calibration check is a reason to *act*. Both are responses to normative facts. We find practical reasons "weird" without agents only because action *requires* a body in a way belief requires a mind. But the *reason itself* (the "ought") is of the same stuff.
      *   *Physics Analogy:* A force vector exists in a field. Whether it moves a particle (Action) or is merely measured by a sensor (Belief) doesn't change the vector's existence. The "weirdness" is just that we are conflating the *force* with the *movement*.

  ### 6. How to Defend This in the Group

  When the group pushes back (and they will, likely citing that reasons are essentially for *deliberation*), here is your script:

  1.  **Reject the "Deliberative Definition":** "If a reason is defined as 'something one can deliberate on,' then we have defined away the phenomenon I am pointing to. I am asking if there are normative truths that *would have* guided deliberation had an agent been present. To say 'no' is to confuse the map (deliberation) with the territory (normativity)."
  2.  **Use the Criticism Test:** "If I say 'It would have been better if they checked the log,' I am expressing regret. If I say 'They had reason to check the log,' I am assigning responsibility. My intuition is that the logbook entry assigns responsibility. Therefore, it contains a reason, not just a value."
  3.  **The "Field" Argument:** "In physics, we do not say a gravitational field ceases to exist because a planet is destroyed. We say the potential for interaction remains defined at that coordinate. I am proposing we treat normative space the same way. A reason is a potential for justified action. The destruction of the actor does not retroactively invalidate the justification."

  ### Summary for Your Notes

  *   **Concept Name:** Detached Agent-Specific Reasons (DASR).
  *   **Core Claim:** Normative facts are mind-independent and can persist without a capable agent to possess them.
  *   **Key Distinction:** Differentiates from *Impersonal Value* by retaining a specific "address" (agent/role) that licenses criticism, not just regret.
  *   **Two Types:**
      1.  *Incapacitated Ownership* (Dementia: Agent exists, capacity gone).
      2.  *Historical Anchoring* (Logbook: Agent/Role gone, normative fact remains).
  *   **Response to Asymmetry:** The difference between theoretical and practical reasons is in the *response* required (belief vs. action), not in the *existence* of the reason itself.

  You are effectively arguing for a **Robust Normative Realism**. Your colleagues may call this "Platonist" or "metaphysically queer." Your counter is that it is no queerer than a mathematical truth or a physical field, and it does better justice to our practices of criticism and responsibility than the alternative.
