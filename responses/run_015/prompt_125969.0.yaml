prompt: |-
  You are an expert in political philosophy and institutional design. Think step by step: first identify which conceptual distinctions must survive simplification, then build the reusable procedure, then stress-test it on hard cases.

  I was recently appointed to a municipal zoning appeals board that hears objections to multi-family and mixed-use developments every month. I need a thirty-minute decision procedure my board can actually run—ordered questions, what counts as sufficient answer to each, clear stop points—to determine which objections carry legitimate procedural weight under a "right to the city" framework. The framework I want to use distinguishes domiciliary standing (claims grounded in current proximity, use, and local attachment) from civic standing (claims grounded in membership in the urban polity and on distributive effects across the housing system). Because future residents who would benefit do not yet exist, assigning them any form of standing also forces an implicit choice between person-affecting and impersonal theories of justice; the procedure must flag where that choice is being made rather than hiding it.

  Please construct the procedure: the sequence of tests, which answers are factual versus normative, where it stops with "no standing," where it mandates full board deliberation because values conflict irreducibly, and where it will predictably misfire. Be honest about what it cannot settle.

  Then apply it to three proposals:

  1. A neighborhood association objects to a 40-unit affordable housing project near a historic low-rise district, citing shadow, traffic, and erosion of "neighborhood character."
  2. A renters' coalition supports the development but demands the board reject it unless 50% of units are permanently affordable, arguing that 20% falls short of distributive justice.
  3. A fifteen-year-old informal community garden—untitled, actively tended, the only green space in a dense ward—would be eliminated by a mid-rise development that increases total housing but removes the garden entirely.

  In case 1, show the procedure granting procedural weight to an objection I will personally find parochial. In case 3, show it denying weight to an objection I find morally compelling because the gardeners hold no formal title. Finally, state explicitly what the procedure cannot do—particularly regarding trade-offs between aggregate housing supply and specific, non-substitutable local goods, and regarding the standing of people who do not yet exist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**
      *   **Role:** Expert in political philosophy and institutional design.
      *   **Task:** Create a 30-minute decision procedure for a municipal zoning appeals board.
      *   **Framework:** "Right to the City" (Lefebvre/Harvey lineage implied), distinguishing *Domiciliary Standing* (proximity/use/attachment) vs. *Civic Standing* (polity membership/distributive effects).
      *   **Key Constraint:** Must handle the non-identity problem/future residents (person-affecting vs. impersonal justice) explicitly.
      *   **Output Requirements:**
          *   Step-by-step conceptual distillation.
          *   The Procedure (ordered questions, sufficiency conditions, stop points).
          *   Stress-testing/Application to three specific cases.
          *   Honest admission of limitations (what it cannot settle).
      *   **Specific Instructions for Cases:**
          *   Case 1 (NIMBYs): Must grant procedural weight despite being "parochial."
          *   Case 3 (Gardeners): Must deny weight despite being "morally compelling" (due to lack of title/formal standing).
      *   **Tone:** Analytical, rigorous, institutional, honest about trade-offs.

  2.  **Conceptual Distillations (Step 1):**
      *   *Right to the City:* Not just access to housing, but the right to participate in the production of urban space. It implies a tension between use value (living there) and exchange value (development profit).
      *   *Domiciliary Standing:* Based on *presence*. Current residents, current users. Hard boundary: Do you live/use it *now*?
      *   *Civic Standing:* Based on *membership*. Citizens of the municipality. Hard boundary: Does this affect the city-wide distribution of goods (housing, equity)?
      *   *Future Residents:* The philosophical trap. If we say they have standing, we lean impersonal (total welfare). If we say they don't, we lean person-affecting (harm to existing people). The procedure must flag this.
      *   *Procedural Weight:* Not necessarily "winning," but "worthy of being heard and weighed."
      *   *Time Limit:* 30 minutes. This means binary filters, not deep deliberation. Deliberation happens *after* the filter passes.

  3.  **Drafting the Procedure (Step 2):**
      *   *Structure:* Intake -> Filter 1 (Domiciliary) -> Filter 2 (Civic) -> Filter 3 (Future/Impersonal Flag) -> Outcome.
      *   *Stop Points:* If an objection fails all standing tests, it's dismissed as "procedurally irrelevant." If it passes, it goes to deliberation (which is outside the 30-min scope, but the *admission* is the goal).
      *   *The "Parochial" Requirement:* Domiciliary standing *must* validate local concerns (shadow, character) even if they seem NIMBY-ish, because "Right to the City" values use and attachment.
      *   *The "Garden" Requirement:* Domiciliary standing usually requires some form of recognized use or tenure. If the garden is informal/untitled, strict proceduralism might exclude it unless "use" is defined broadly. *Correction:* The prompt asks me to show it *denying* weight because they hold no formal title. This implies a strict legalistic interpretation of "use/attachment" within the procedural constraints. I need to design the test so that "informal/untitled" fails the Domiciliary threshold.
      *   *The "Future" Requirement:* A specific checkpoint to ask: "Are we arguing for people who don't exist?"

  4.  **Refining the Procedure (Iterative Design):**
      *   *Phase 1: Domiciliary Filter.* Question: Are you currently affected by physical proximity or established use?
          *   *Sufficiency:* Proof of residence within zone OR proof of established, recognized use (e.g., easement, lease, permit).
          *   *Stop:* No residence, no recognized use = No Domiciliary Standing.
      *   *Phase 2: Civic Filter.* Question: Does this objection address city-wide distributive justice (housing supply, segregation, affordability)?
          *   *Sufficiency:* Argument links local decision to systemic outcome.
          *   *Stop:* Purely aesthetic/personal preference without systemic link = No Civic Standing (but might still pass Domiciliary).
      *   *Phase 3: The Future Resident Flag.* Question: Is the benefit/harm predicated on people moving in?
          *   *Action:* Tag the argument as "Impersonal" (aggregate good) vs. "Person-Affecting" (current residents).
      *   *Phase 4: The Verdict.* Pass to Deliberation if *either* Domiciliary OR Civic standing is met.

      *Wait, I need to ensure Case 3 fails.* If the gardeners are "actively tended," they have *use*. To make them fail, the procedure must require *legal recognition* of that use (zoning compliance, permit, title). This aligns with the "institutional design" constraint—boards operate within law. I will make "Lawful Use" a criterion for Domiciliary Standing.

      *Wait, I need to ensure Case 1 passes.* Neighborhood character is often dismissed as exclusionary. Under "Right to the City," use value matters. So "neighborhood character" counts as Domiciliary Standing (attachment/use), even if it conflicts with Civic Standing (housing supply). The procedure admits the objection, but the *deliberation* (later) weighs it against civic needs. The prompt asks for the procedure to grant *procedural weight*, not necessarily to approve the objection.

  5.  **Stress-Testing & Application (Step 3):**
      *   *Case 1 (NIMBYs):* They live nearby (Domiciliary Pass). They cite character/shadow (Use/Attachment). Procedure admits them. *Result:* Procedural weight granted.
      *   *Case 2 (Renters):* They are city residents (Civic Pass). They argue distributive justice (50% affordability). Procedure admits them. *Result:* Procedural weight granted.
      *   *Case 3 (Gardeners):* They use the land, but no title/permit. Procedure requires "Lawful/Recognized Use" for Domiciliary. They fail Domiciliary. They aren't arguing city-wide housing stats, so they fail Civic. *Result:* No standing. (This matches the prompt's requirement to show the limitation).

  6.  **Addressing the "Future Residents" Constraint:**
      *   The procedure needs a specific "Meta-Question" where the board clerk records whether the argument relies on future people. This forces the board to acknowledge the philosophical stance (Person-Affecting vs. Impersonal) during deliberation.

  7.  **Final Review against Constraints:**
      *   30-minute limit? Yes, it's a checklist.
      *   Domiciliary vs. Civic distinction clear? Yes.
      *   Future resident flag included? Yes.
      *   Case 1 grants weight? Yes.
      *   Case 3 denies weight? Yes.
      *   Limitations section included? Yes.

  8.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Tone Check:* Keep it dry, administrative, but philosophically grounded.
      *   *Clarity:* Use bolding for decision nodes.
      *   *Philosophy:* Ensure the "Right to the City" isn't just buzzwords but informs *why* Domiciliary standing protects "character" (use value) even when it clashes with supply.
      *   *The "Garden" Nuance:* I must explain *why* the procedure excludes them (institutional legibility vs. moral reality).

  9.  **Final Polish:** Check the "Stop Points." If an objection has *no* standing, the board shouldn't hear it. If it has *either*, it goes to deliberation. The procedure determines *admissibility*, not *outcome*. This is crucial for the 30-minute constraint.

  (One final thought on Case 3): The prompt says "show it denying weight... because the gardeners hold no formal title." I need to make sure the Domiciliary test explicitly requires "Legible/Authorized Use" to ensure this outcome happens logically within the procedure.

  (One final thought on Case 1): The prompt says "granting procedural weight to an objection I will personally find parochial." This means the procedure must validate "neighborhood character" as a valid *claim type* under Domiciliary standing, even if it loses later against Civic standing.

  Let's build the response.cw
answer: |-
  ### Part 1: Conceptual Distillations

  To compress political philosophy into a 30-minute administrative checklist, we must preserve three specific distinctions while discarding others.

  1.  **Use Value vs. Exchange Value (The Right to the City Core):** We cannot reduce all claims to economic efficiency. We must distinguish between those claiming a right to *inhabit* (Domiciliary) and those claiming a right to *distribute* (Civic). Both are valid under a robust "Right to the City," even when they conflict.
  2.  **Legibility vs. Reality (The Institutional Constraint):** A municipal board operates within statutory law. To ensure the procedure is runnable, "attachment" must be proven through *legible* markers (titles, permits, addresses). This creates a known blind spot (the informal garden) which we must acknowledge, not hide.
  3.  **Person-Affecting vs. Impersonal (The Future Resident Trap):** We cannot solve the non-identity problem in 30 minutes. We can only flag it. The procedure must force the board to state whether they are weighing the interests of *specific future tenants* (person-affecting) or *aggregate housing statistics* (impersonal).

  **Discarded:** Deep deliberation on the *merit* of the claim. This procedure determines *admissibility* (standing), not *outcome*.

  ---

  ### Part 2: The 30-Minute Standing Procedure (SSP-24)

  **Time Allocation:** 5 mins per test, 10 mins for recording/flagging.
  **Role:** Board Clerk facilitates; Board Chair rules.
  **Goal:** Determine if an objection/support statement carries **Procedural Weight** (must be weighed in final vote) or is **Procedurally Null** (irrelevant to zoning mandate).

  #### Phase 1: The Domiciliary Filter (Use & Attachment)
  *Tests for "Right to Inhabit." Grounded in current proximity and established use.*

  **Q1: Is the claimant physically proximate to the site (within zoning notification radius)?**
  *   **Yes:** Proceed to Q2.
  *   **No:** Domiciliary Standing = **FAILED**. (Proceed to Phase 2).

  **Q2: Does the claimant demonstrate established, legible use or tenure?**
  *   *Sufficient Answer:* Deed, lease, utility bill, or **city-recognized permit** (e.g., garden license, business permit).
  *   *Insufficient Answer:* "We walk through it," "We watch from our windows," "We tend it informally."
  *   **Yes:** Domiciliary Standing = **GRANTED**. (Stop. Claim carries weight).
  *   **No:** Domiciliary Standing = **FAILED**. (Proceed to Phase 2).

  *> Note: "Neighborhood Character" claims pass Q2 if the claimant resides in the zone. "Informal Use" claims fail Q2 without permits.*

  #### Phase 2: The Civic Filter (Polity & Distribution)
  *Tests for "Right to Participate." Grounded in membership and systemic effects.*

  **Q3: Is the claimant a resident or taxpayer of the municipality?**
  *   **Yes:** Proceed to Q4.
  *   **No:** Civic Standing = **FAILED**. (Proceed to Phase 3).

  **Q4: Does the argument address city-wide distributive effects (housing supply, segregation, affordability targets)?**
  *   *Sufficient Answer:* "This affects the city's affordable housing stock," "This sets a precedent for ward density," "This impacts regional homelessness."
  *   *Insufficient Answer:* "I don't like developers," "This changes my view," "Property values will drop."
  *   **Yes:** Civic Standing = **GRANTED**. (Stop. Claim carries weight).
  *   **No:** Civic Standing = **FAILED**. (Proceed to Phase 3).

  #### Phase 3: The Future Resident Flag (Meta-Ethical Check)
  *Tests for the Non-Identity Problem. Does not grant standing, but tags the deliberation.*

  **Q5: Does the primary benefit or harm rely on people who do not yet exist?**
  *   **Option A (Person-Affecting):** "Specific families on the waitlist will be housed." -> *Tag: Concrete Beneficiaries.*
  *   **Option B (Impersonal):** "Total housing units will increase by 5%." -> *Tag: Aggregate Welfare.*
  *   **Option C (None):** Claim is about current residents only. -> *Tag: Presentist.*

  **Q6: Record the Conflict Type.**
  *   **Domiciliary vs. Civic:** (e.g., Current neighbors vs. City housing needs).
  *   **Present vs. Future:** (e.g., Current gardeners vs. Future tenants).
  *   **None:** Single-standing claim.

  #### Phase 4: The Verdict
  *   **If Domiciliary OR Civic = GRANTED:** The objection/support has **Procedural Weight**. It must be entered into the record and weighed during final deliberation.
  *   **If BOTH FAILED:** The objection is **Procedurally Null**. The Board may acknowledge it but cannot base a zoning decision on it.
  *   **Mandatory Note:** If Phase 3 flags "Impersonal," the Board Chair must read aloud: *"This decision relies on aggregate welfare calculations rather than specific harm/benefit to identifiable persons."*

  ---

  ### Part 3: Application to Hard Cases

  #### Case 1: The Neighborhood Association (NIMBY)
  *Objection: 40-unit affordable project. Claims: Shadow, traffic, "neighborhood character."*

  *   **Phase 1 (Domiciliary):**
      *   Q1 (Proximity): **Yes.** Members live in the low-rise district.
      *   Q2 (Legible Use): **Yes.** They hold deeds/leases to the surrounding homes. "Neighborhood character" is recognized as a valid interest of current property holders under Domiciliary Standing (Use Value).
      *   **Result:** **Domiciliary Standing GRANTED.**
  *   **Phase 2 (Civic):**
      *   Q4 (Distributive): **No.** Arguments are local (shadow/traffic), not systemic.
      *   **Result:** Civic Standing FAILED.
  *   **Phase 3 (Flag):**
      *   Q5: **Presentist.** Harm is to current residents.
  *   **Outcome:** **Procedural Weight GRANTED.**
  *   **Analysis:** The procedure forces the board to accept "neighborhood character" as a legitimate claim type because "Right to the City" values existing attachment (Use Value). Even if you find this parochial, the procedure admits it. The *conflict* (Domiciliary vs. Civic need for housing) is now explicit for deliberation, rather than dismissing the neighbors as irrelevant.

  #### Case 2: The Renters' Coalition (Distributive Justice)
  *Support: Demands 50% affordability. Claims: 20% is unjust.*

  *   **Phase 1 (Domiciliary):**
      *   Q1 (Proximity): **Mixed/No.** Coalition members may live city-wide.
      *   Q2 (Legible Use): **No.** They do not own/use the specific site.
      *   **Result:** Domiciliary Standing FAILED.
  *   **Phase 2 (Civic):**
      *   Q3 (Membership): **Yes.** City residents/taxpayers.
      *   Q4 (Distributive): **Yes.** Argument is explicitly about city-wide affordability thresholds and justice.
      *   **Result:** **Civic Standing GRANTED.**
  *   **Phase 3 (Flag):**
      *   Q5: **Person-Affecting.** (Families on waitlists).
  *   **Outcome:** **Procedural Weight GRANTED.**
  *   **Analysis:** The procedure validates claims based on systemic justice even without local proximity. This prevents the board from dismissing city-wide equity concerns as "not our business."

  #### Case 3: The Informal Garden (The Moral Blind Spot)
  *Objection: Mid-rise eliminates untitled garden. Claims: Loss of green space, community hub.*

  *   **Phase 1 (Domiciliary):**
      *   Q1 (Proximity): **Yes.** Gardeners live in the ward.
      *   Q2 (Legible Use): **No.** The prompt specifies "untitled, informal." They lack permits, leases, or deeds. Under the "Legibility" constraint required for a 30-minute administrative test, informal use is indistinguishable from trespass.
      *   **Result:** **Domiciliary Standing FAILED.**
  *   **Phase 2 (Civic):**
      *   Q3 (Membership): **Yes.**
      *   Q4 (Distributive): **Weak/No.** Unless they argue "City-wide green space quota," this is treated as a local loss. If they argue only "Our garden," it fails the systemic test.
      *   **Result:** Civic Standing FAILED.
  *   **Phase 3 (Flag):**
      *   Q5: **Presentist.**
  *   **Outcome:** **Procedurally NULL.**
  *   **Analysis:** The procedure denies weight. This is the intended failure mode. By requiring *legible tenure* (Q2) to keep the process fast and legally defensible, the procedure excludes "informal commons." You find this morally compelling, but the institution cannot process it without slowing down to adjudicate property rights, which is beyond the board's mandate.

  ---

  ### Part 4: Limitations and Explicit Trade-Offs

  This procedure is a tool for *sorting*, not *solving*. You must record the following limitations in your board's minutes when using this framework:

  **1. The Trade-Off: Aggregate Supply vs. Non-Substitutable Local Goods**
  The procedure separates Domiciliary (local) and Civic (aggregate) standing, but it does not tell you how to weigh them against each other.
  *   *The Conflict:* In Case 1 vs. Case 2, you will have valid Domiciliary claims (shadow/character) opposing valid Civic claims (housing supply).
  *   *The Limitation:* The procedure admits both but offers no formula to resolve the clash. A "Right to the City" framework suggests use value should not be automatically trumped by exchange value, but it does not quantify *how much* character loss is acceptable for *how many* new units. The board must make this political choice in deliberation; the procedure only ensures both sides are heard.

  **2. The Standing of the Non-Existent**
  The Phase 3 Flag reveals the philosophical choice but does not resolve it.
  *   *The Conflict:* If you approve a project based on "Aggregate Welfare" (Option B), you are utilizing an impersonal theory of justice. You are sacrificing specific, existing goods (the garden, the low-rise character) for the benefit of statistical, non-existent future people.
  *   *The Limitation:* The procedure forces you to announce this choice ("This decision relies on aggregate welfare..."), but it cannot justify *why* future statistical welfare outweighs current concrete attachment. That justification must come from your city's housing mandate, not this procedure.

  **3. The Legibility Trap (Case 3)**
  *   *The Conflict:* Informal communities (squatters, unpermitted gardens, street vendors) often embody the "Right to the City" more authentically than title-holders, yet they are the most vulnerable to development.
  *   *The Limitation:* To run in 30 minutes, this procedure requires *administrative legibility* (titles, permits). It systematically excludes the most marginalized users of urban space because their claims cannot be verified quickly. **You must acknowledge that using this procedure prioritizes legal order over informal justice.** If the garden is morally paramount, the board must pause the procedure and seek a legal mechanism to recognize the garden's tenure *before* applying this test.

  **4. The "Parochial" Validation**
  *   *The Limitation:* By granting Domiciliary Standing to "neighborhood character" (Case 1), this procedure empowers exclusionary sentiments. It treats "my view" and "my community's history" as valid political claims. This is consistent with "Right to the City" (which values inhabitance), but it risks validating NIMBYism. The board must be prepared to argue *why* Civic Standing (housing need) overrides Domiciliary Standing (character) in the final vote, rather than dismissing the character claim as illegitimate.

  **Summary Instruction for the Board:**
  *"This procedure ensures we hear the right voices. It does not tell us who is right. When Domiciliary and Civic standing conflict, we are not deciding zoning; we are deciding what kind of city we are building. Record the conflict, flag the future, and vote."*
