      *(Self-Correction during drafting)*: I need to make sure I distinguish between *preference change* (which happens all the time) and *radical restructuring* (which breaks the model). The user's claim is about the *break*. I need to challenge whether the break is real or just a modeling limitation. Also, need to mention *diachronic Dutch Books* as a concrete test for the "rational framework" claim.

      *(Refining the "Collapse" argument)*: If the preference changes *because* I learned what it's like, then the epistemic gap is the root cause. The user tries to bypass qualia. I need to press: How do preferences restructure *without* new information? If it's without new information, it's arational. If it's with new information, it's standard updating. This is the crux.

