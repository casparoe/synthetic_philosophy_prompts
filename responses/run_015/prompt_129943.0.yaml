          3.  **The Epistemic Collapse:** If the *cause* of the discontinuity is the lack of phenomenal knowledge, then the epistemic view is prior. You can't have the preference shift without the epistemic gap.
          4.  **Dialectical Status:** Paul would likely say this is a *consequence* of the epistemic gap, not a replacement. Pettigrew might be more sympathetic but focuses on identity.
      *   *Unfalsifiability Assessment:* It is a risk. To avoid it, one needs independent criteria for discontinuity (e.g., violation of transitivity, Dutch Book vulnerability). If it's just "they changed their mind," it's vacuous. It's a vice if it shields the theory from decision-theoretic scrutiny.
