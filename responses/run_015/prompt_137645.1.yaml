answer: |-
  You and Sam weren't just drunk; you stumbled onto one of the central problems in the philosophy of statistical mechanics and chaos theory. Your distinction between "trajectory determinism" (the exact path is fixed) and "envelope determinism" (the statistical bounds are fixed) is not only valid, it is essentially how modern climate science conceptualizes the difference between *weather* (initial value problem) and *climate* (boundary value problem).

  Here is the breakdown of what is actually going on, followed by the table you asked for.

  ### The Short Answer
  Your forecasting practices do **not** require determinism to be false, nor do they require it to be true. They are metaphysically underdetermined.

  Sam is making a category error common in pop-science: he is conflating *predictability* with *determinism*. The Lorenz models you mentioned are fully deterministic. If you run the exact same code with the exact same numbers, you get the exact same result every time. The "butterfly effect" (sensitive dependence on initial conditions) means that *measurement error* grows exponentially, not that the laws of physics stop fixing the future.

  However, you are right that the *practice* relies on something being fixed. If the "envelope" (the statistical distribution of possible states) weren't stable, climate models and insurance would be impossible. The practices presuppose that while the **trajectory** is sensitive to microscopic details (whether those details are unknown initial conditions or quantum rolls of the dice), the **attractor** (the shape of the phase space the system wanders within) is structurally stable.

  ### The Five Practices Analysed

  **1. Ensemble Forecasting (The 30% Chance)**
  This practice treats probability as a measure of the *spread* of possibilities given our ignorance. In a deterministic universe, this probability is purely **epistemic** (about our lack of knowledge). In an indeterministic universe, it could be **ontic** (about real randomness). The math is identical. The practice presupposes that the *distribution* of outcomes is stable, even if the single outcome is not.

  **2. The Prediction Horizon (The 2-Week Wall)**
  This presupposes that error growth is exponential. This is a feature of chaotic systems, which can be deterministic or indeterministic. It commits you to the idea that there is a limit to information retention in the atmosphere. It does not commit you to the future being "open" in a metaphysical sense, only that it is "opaque" to us.

  **3. Climate Projections (The Century View)**
  This is the strongest evidence for your "envelope determinism." Climate is defined as the statistical properties of the system (mean, variance) over a long period. This practice presupposes that changing the *parameters* (CO2 levels) shifts the *attractor* (the envelope) in a predictable way, even if the *trajectory* (daily weather) remains chaotic. This works whether the chaos is classical or quantum.

  **4. Event Attribution (The "Likelihood" Claim)**
  When scientists say "climate change made this heatwave 5x more likely," they are comparing two ensembles: a world with current CO2 and a counterfactual world without it. This presupposes **probabilistic causation**. It commits them to the view that causes can act on *probability distributions* without determining specific events. This is consistent with both determinism (where the cause shifts the range of possible initial conditions that lead to heat) and indeterminism.

  **5. Insurance Pricing (Historical Frequencies)**
  Insurers bet on the Law of Large Numbers. This presupposes **stationarity** (or a manageable deviation from it). It assumes that the "envelope" doesn't shift so fast that past frequencies become useless. This is a pragmatic commitment, not a metaphysical one. It works as long as the frequencies hold, regardless of *why* they hold.

  ### The "Trajectory vs. Envelope" Distinction
  You asked if this distinction does any work. Yes. In dynamical systems theory, this is the difference between the **state** of the system and the **structure** of the system.
  *   **Trajectory:** The specific solution to the differential equations at time *t*.
  *   **Envelope:** The **Strange Attractor**.

  In a chaotic deterministic system, the trajectory is fixed by initial conditions, but the attractor is fixed by the *equations* (the physics). Climate change alters the physics (forcing), which deforms the attractor. So, you can have a universe that is 100% deterministic at the micro-level, but where the only thing we can practically know and manipulate is the statistical envelope. Your distinction maps perfectly onto **Micro-Determinism vs. Macro-Statistical Stability**.

  ### Does Swapping Metaphysics Change Anything?
  If you swapped "Classical Determinism + Ignorance" for "Quantum Indeterminism + Objective Chance":
  *   **Day-to-day forecasting:** Nothing changes. The uncertainty from not knowing the temperature at every square metre of the ocean dwarfs quantum uncertainty by orders of magnitude. The "noise" looks the same.
  *   **Long-term climate:** Nothing changes. The statistical mechanics of gases work the same way whether the particle motion is determined by Newton or probabilistic by Schrödinger.
  *   **Philosophy:** Everything changes. But the forecasters would keep printing the same maps.

  ### Summary Table

  | practice | commitment | status | rival | if_dropped |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Ensemble Forecasting** (Running models with nudged starts to get %) | The spread of model outcomes accurately maps to the frequency of real-world outcomes. | Compatible but not required | **Laplacian Demon:** The spread is purely ignorance; the real outcome is already fixed. | Forecasters would have to stop issuing probabilities and issue single "best guess" maps (which would fail more often). |
  | **2. Prediction Horizon** (Giving up on specifics after ~14 days) | Error in initial measurements grows exponentially over time (Chaos). | Strictly presupposed | **Linear Stability:** Errors grow slowly or not at all; long-term exact prediction is possible. | Forecasters would continue issuing specific daily forecasts for months or years ahead. |
  | **3. Climate Projections** (Confident in 2100 averages, not days) | Statistical properties (mean/variance) are stable even when specific trajectories are not (Structural Stability). | Strictly presupposed | **Radical Instability:** The statistical rules themselves change chaotically over time. | Climate models would be abandoned; no long-term planning based on averages would be possible. |
  | **4. Event Attribution** ("Made storms more likely") | Causation can act on probability distributions without determining single events (Probabilistic Causation). | Compatible but not required | **Single-Event Determinism:** A cause must necessitate its effect; if the storm wasn't determined, it wasn't caused. | Scientists would have to remain silent on specific events, only speaking about general trends decades later. |
  | **5. Insurance Pricing** (Pricing off historical frequencies) | Past frequencies are a reliable guide to future risk (Stationarity). | Just habit (methodological) | **Non-Stationarity:** The underlying risk profile shifts too fast for history to matter. | Insurers would stop using historical data and price purely on real-time sensor data or stop offering coverage entirely. |

  ### Final Verdict
  You win the argument on the metaphysics: sensitive dependence does not kill determinism. But Sam wins on the practical implication: for all human intents and purposes, the future is not *fixed* in a way we can access.

  The practices are consistent because they all rely on **Statistical Realism** (the distributions are real/stable) without committing to **Trajectory Realism** (the specific path is knowable). You can hold this view whether the universe is a clockwork machine we can't measure, or a quantum casino. The forecasters don't care which it is; they just sell the odds.
