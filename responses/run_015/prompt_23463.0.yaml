          *   *Another angle:* If DA is true, it implies a "Great Filter" is ahead of us. Longtermists focus on getting through the Great Filter. So DA actually *motivates* longtermism (we need to survive the filter) even if it dampens the expected timeline.
      *   *Wait, let's look at the Expected Value (EV) calculation.* EV = Probability $\times$ Value. DA lowers the Probability of a long future. But if the Value of that future is astronomical, even a reduced probability yields a high EV. Also, DA applies to *natural* trajectories. Human action can change the trajectory. DA assumes we are a random sample from the total set. If we take actions to extend the future, we change the set. This gets into "observer selection effects."

  6.  **Finalizing the Arguments:**
      1.  **DA is Controversial:** Many reject the reasoning (SIA, Reference Class).
      2.  **EV remains high:** Even a "short" cosmic future is vast compared to history.
