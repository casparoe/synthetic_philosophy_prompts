answer: |-
  This is a fantastic argument. You've essentially reconstructed a classic skeptical challenge to the Knowledge Norm of Assertion (KNA), specifically targeting how testimony works. It's sharp, logically valid, and hits on a real tension in epistemology.

  Your study partner is right: **the slip is indeed between (3) and (5).**

  However, your worry is also valid: if you fix that slip, does it make the norm too easy to satisfy? Here is the breakdown of where the argument goes wrong, how to fix it without abandoning the Knowledge Norm, and what the costs are.

  ### 1. The Diagnosis: Step (5) and the "KK Principle"

  Step (5) says: *"To be justified inheriting, I need to know that my friend knew p."*

  This is the controversial move. The Knowledge Norm of Assertion (1) says:
  > **KNA:** Assert $p$ only if you **know** $p$.

  It does **not** say:
  > **KK-Norm:** Assert $p$ only if you **know that you know** $p$.

  Step (5) smuggles in a **second-order knowledge requirement**. It demands that you not only possess the knowledge (first-order) but also possess knowledge *about the source of that knowledge* (second-order).

  In epistemology, this is related to the **KK Principle** (If $S$ knows $p$, then $S$ knows that $S$ knows $p$). Most contemporary epistemologists reject the KK Principle. You can know something without being able to verify or articulate *how* you know it.

  **Example:** You look at a clock and know it is 2:00 PM. Do you *know that the clock is working properly*? Maybe not. You might just assume it is. But if the clock *is* working, you still know the time. You don't need to know *that* you know; you just need to know.

  ### 2. The Epistemology of Testimony: Transmission vs. Reduction

  Your argument assumes a **Reductionist** view of testimony (Step 5). Reductionism says: To gain knowledge from testimony, I must have independent positive reasons to believe the speaker is reliable (i.e., I must know they know).

  The alternative is the **Transmission (or Anti-Reductionist) View**. This view says: Testimony is a basic source of knowledge, like perception or memory.
  *   **Perception:** If I see a tree, I know there is a tree. I don't need to first prove my eyes are working.
  *   **Testimony:** If a competent speaker tells me $p$, I can know $p$. I don't need to first prove they are competent.

  If you adopt the Transmission view, you can reject (5) without making testimony "risky."
  *   **Requirement:** The source must *actually* know $p$ (or be reliable).
  *   **Your Job:** You just need to accept the testimony in the absence of defeaters (reasons to doubt). You don't need to *know* they know.

  **So, rejecting (5) doesn't mean testimony works when the source is ignorant.** It means *you* don't need to verify their ignorance/knowledge status explicitly for you to count as knowing.

  ### 3. The Connection to Epistemic Closure

  You asked about **Epistemic Closure**. Closure roughly says: If I know $p$, and I know $p$ entails $q$, then I can know $q$.

  Your regress argument isn't exactly about closure; it's about **Iterated Knowledge**. However, there is a connection. If knowledge *transmits* through testimony, then the chain of knowledge is preserved without you needing to check every link.

  *   **Friend:** Knows $p$ (via observation).
  *   **You:** Know $p$ (via friend's testimony).

  If knowledge transmits, your knowledge is "closed" under the operation of accepting testimony. You don't need to open the box and inspect the friend's cognitive state. If you *did* require that (Step 5), you are effectively demanding that knowledge *doesn't* transmit unless verified, which breaks the chain.

  ### 4. Which Step to Give Up? (Cost Analysis)

  You want to keep (1) (KNA). Here is how you do it, and what it costs.

  #### Option A: Reject (5) (Keep KNA, Adopt Transmission View)
  *   **The Move:** You assert that you can know $p$ via testimony without knowing *that* your source knows $p$. You just need the source to *actually* know $p$ (even if you don't know that they do).
  *   **The Cost:** You have to accept that knowledge can be "opaque." You might be asserting things you know, without being able to prove *why* you know them if challenged. It makes us vulnerable to "epistemic free-riding" (trusting chains that might be broken, without us knowing).
  *   **The Benefit:** You save the Knowledge Norm (1). You avoid skepticism (8). You explain why normal conversation works.
  *   **Verdict:** **This is the standard philosophical move.** (Defended by philosophers like Timothy Williamson, Tyler Burge, and John McDowell).

  #### Option B: Reject (1) (Adopt Belief/Truth Norm)
  *   **The Move:** You conclude that assertion only requires Belief (or Justified Belief).
  *   **The Cost:** You weaken the norm of assertion. It becomes permissible to assert things that turn out false (as long as you believed them). It makes assertion less distinct from mere speculation. It struggles to explain why we criticize people: "You shouldn't have said that, you didn't *know* it!"
  *   **The Benefit:** Solves the regress immediately. No need to worry about the chain of knowledge.
  *   **Verdict:** This is a retreat. Most epistemologists prefer to fix the theory of testimony (Option A) rather than abandon KNA.

  #### Option C: Modify (1) (Contextualism)
  *   **The Move:** KNA is context-sensitive. In casual chat, belief is enough. In high-stakes (courtroom, science), knowledge is required.
  *   **The Cost:** Makes the norm less universal.
  *   **The Benefit:** Captures the intuition that secondhand gossip is "okay" in some contexts but not others.

  ### 5. How to Save Your Argument (and Keep KNA)

  If I were you, I would stick with **Option A**. Here is how you rewrite the conclusion to keep (1) but avoid (8):

  1.  **Concede Step (5) is false.** Acknowledge that KNA requires first-order knowledge, not second-order verification of sources.
  2.  **Invoke the Transmission Principle.** Argue that testimony transmits warrant. If my friend knows $p$, and I have no reason to doubt them, I come to know $p$.
  3.  **Re-evaluate Step (7).** "Nobody can trace the whole chain" is true, but irrelevant. I don't need to trace the chain to be at the end of a solid chain. I just need the chain to *be* solid (which is an external fact, not an internal requirement).
  4.  **New Conclusion:** Therefore, (1) is compatible with secondhand assertion, provided we accept a Transmission view of testimony.

  ### Summary for Your Class
  *   **The Slip:** You conflated *knowing $p$* with *knowing that you know $p$* (or knowing your source knows).
  *   **The Fix:** Adopt a **Transmission View of Testimony**. Knowledge flows through the chain; you don't need to inspect the pipes.
  *   **The Risk:** Yes, it's risky (you might trust a liar), but that's the risk of all knowledge (your eyes might deceive you). We accept that risk to avoid skepticism.
  *   **The Norm:** You can keep the Knowledge Norm (1). It remains the best explanation for why we challenge assertions with "How do you know?" rather than "Do you believe that?"

  This preserves the rigor of KNA while acknowledging the social nature of knowledge. It's a stronger position than abandoning the norm entirely.
