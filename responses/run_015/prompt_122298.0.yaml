          *   *Benefit:* Solves the regress immediately.
      *   **Option C: Modify (1) (Contextualism/Relativism).** Maybe KNA is context-sensitive. In casual chat, belief is enough; in court, knowledge is needed.
          *   *Cost:* Makes the norm less universal.
