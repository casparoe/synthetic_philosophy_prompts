          *   Premise 3: KNA applies to testimonial assertion (I need to know $p$).
          *   Premise 4: Testimonial knowledge depends on the source knowing $p$.
          *   Premise 5: To know $p$ via testimony, I need to *know* that the source knew $p$ (Second-order knowledge).
          *   Premise 6: This leads to an infinite regress (source's source, etc.).
          *   Premise 7: We can't trace the chain.
          *   Premise 8: Therefore, we can't assert secondhand info (Absurd consequence).
          *   Conclusion: KNA is false; belief or truth is enough.
      *   **Study Partner's Objection:** The slip is between (3) and (5). The user is smuggling in a second-order requirement (knowing *that* the source knows) which KNA doesn't demand.
