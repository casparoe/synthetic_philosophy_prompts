      *   (1) KNA: Standard view (Williamson, etc.).
      *   (2) Testimony is common: True.
      *   (3) KNA applies to testimony: True, if KNA is a general norm.
      *   (4) Testimonial knowledge conditions: Generally, for $S$ to know $p$ via $T$'s testimony, $T$ must know $p$ (or at least $T$'s statement must be reliable/true).
      *   (5) **The Crux:** "To be justified inheriting, I need to *know that* my friend knew $p$."
          *   This is the controversial step. Does testimonial knowledge require *knowing that the testifier knows*?
          *   Standard epistemology of testimony (Reductionism vs. Anti-Reductionism/Transmission).
          *   If I accept your word, do I need independent evidence that you know? Or does your word *transmit* knowledge directly?
