answer: |-
  There is no single, canonical noun for this specific phenomenon (like "gravity" or "inertia"), but it is a recognized and well-mapped problem in the philosophy of social science. You are describing a specific subset of **reflexivity** where the causal mechanism relies on **pre-reflective operation**.

  The closest established conceptual carving comes from **Jon Elster** (specifically regarding your Weber example) and **Ian Hacking**. Here is the breakdown of the existing terrain, the distinction you need for the traffic-light case, and a coined term tight enough for a methods footnote.

  ### 1. The Existing Conceptual Terrain

  **A. Jon Elster: Transparency and Opacity**
  Elster deals with this exact problem in *Alchemies of the Mind* and his critiques of Weber. He argues that certain social mechanisms (like the Protestant Ethic, or social norms based on shame) require **"causal opacity"** to function.
  *   **The Mechanism:** The norm works because it is experienced as a disposition or a "given," not as a strategic choice.
  *   **The Failure:** When the mechanism is made **transparent** (i.e., the actors understand the causal explanation of their own behavior), the disposition turns into a strategy. Once it is a strategy, the original causal power (shame/habit) dissolves or mutates into calculation/reputation-management.
  *   **The Term:** Elster refers to these as **"mechanisms requiring opacity"** or notes that they are **"transparency-sensitive."**

  **B. Ian Hacking: Interactive Kinds**
  Hacking distinguishes between **"indifferent kinds"** (atoms, quarks) and **"interactive kinds"** (people, social groups).
  *   **Indifferent Kinds:** Classifying them does not change them. (Explaining why a star burns doesn't change the star.)
  *   **Interactive Kinds:** Classifying them changes how they understand themselves, which changes how they act, which changes the classification.
  *   **Your Case:** Your co-op and church are *interactive kinds*. Your explanation is a classification that loops back into the group. Hacking calls this a **"looping effect."**

  **C. Why "Performativity" Doesn't Fit**
  You likely encountered "performativity" (Callon, MacKenzie, Butler). This is close, but usually implies the theory *makes* the reality true or stronger (e.g., economic theory makes markets more efficient). You are describing cases where the theory *unmakes* or *mutates* the reality. This is sometimes called **"counter-performativity,"** but that term is messy and often refers to policy failure rather than epistemic feedback.

  ### 2. The Distinction: Why Traffic Lights Survive

  You asked what marks the difference between the traffic lights (stable) and the co-op (unstable). The distinction is between **Strategic Coordination** and **Dispositional Habituation**.

  *   **Traffic Lights (Strategic Coordination):** The behavior is *already* reflective. I stop because I calculate that you will stop. Telling me *why* I stop (coordination equilibrium) improves my calculation. The mechanism is **transparency-stable**.
  *   **Co-op/Church (Dispositional Habituation):** The behavior relies on **habitus** (Bourdieu) or **unacknowledged conditions** (Giddens). It works because it feels *non-optional* or *natural*. Telling me *why* I do it objectifies the norm. It moves from "background" to "foreground." Once foregrounded, it becomes a choice.
      *   **Co-op:** Choice leads to negotiation (collapse).
      *   **Church:** Choice leads to signaling (rigidification).
      *   Both are **transparency-unstable**.

  ### 3. Implications: Explanation vs. Evidence

  You asked whether this is a problem for the *explanation* or the *evidence*.

  *   **It is not a validity error.** Your explanation was true *at the time of observation*. It is not like the Hawthorne Effect (where observation distorts the data); this is where *dissemination* distorts the future data.
  *   **It is a limit on Generalizability/Temporal Validity.** You cannot claim the explanation holds *simpliciter*; you must claim it holds **"under conditions of causal opacity."**
  *   **Testability:** You *can* test these claims, but only **cross-sectionally** (comparing groups who know the theory vs. those who don't) or **historically** (before vs. after publication). You cannot test them longitudinally within a single group *after* the theory has been introduced to them.

  ### 4. A Coined Term for Your Footnote

  Since "Reflexivity" is too broad and "Self-Defeating Prophecy" is about predictions, I recommend coining a term that highlights the *dependency on ignorance*.

  **Recommended Term:** **"Opacity-Dependent Causality"**

  **Definition for Footnote:**
  > **Opacity-Dependent Causality:** A causal mechanism in social systems that functions only so long as the actors remain unaware of the mechanism itself. Unlike strategic coordination (which is stability-enhancing under transparency), opacity-dependent mechanisms (typically normative or habituated behaviors) rely on pre-reflective operation. Publication of the explanation converts the disposition into a conscious choice, thereby altering or dissolving the original causal pathway. (Cf. Elster on transparency-sensitive mechanisms; Hacking on interactive kinds).

  **Alternative (if you prefer a noun for the phenomenon):**
  **"Explanatory Subversion"**
  > **Explanatory Subversion:** The phenomenon wherein a true causal explanation of a social practice, upon being adopted by the practitioners, alters the practice such that the original explanation no longer applies.

  ### 5. Summary for Your Methods Section

  If I were writing this, I would frame it like this:

  > "The explanations offered here describe **opacity-dependent mechanisms** (Elster 1999). These are causal patterns that rely on the actors' pre-reflective engagement with norms. Consequently, these explanations possess **epistemic fragility**: their truth is contingent on the actors' ignorance of the theory. This distinguishes them from **coordination equilibria** (e.g., traffic norms), which are transparency-stable. This does not invalidate the findings, but limits their **temporal validity** post-dissemination."

  This gives you the precision of Elster without the baggage of "prophecy" or "performativity," and it explicitly carves out the traffic-light contrast you observed.
