answer: |-
  1. The water licked at June's ankles while the two black drives sat side by side, identical twins born of the same backup session. She knew one held the past decade of her life, but the labels she'd written in haste now mocked her with illegible smudges.

  2. She tossed a coin to decide, heads for left and tails for right, but caught it mid-air realizing she couldn't remember which drive sat on which side. The metal disc warmed in her palm, useless now that the mapping was lost.

  3. June closed her eyes to wait for a surge of intuition, but the silence stretched until waiting itself felt like a vote for neither. The water rose over her shoes, proving that hesitation was just a slow way of drowning them both.

  4. She stopped looking for a sign and simply snatched the left one because her hand was already hovering there, a movement without a why. It wasn't a decision based on merit, but a muscle contraction born of panic.

  5. Running up the stairs, she wondered if grabbing at random was an act of will or just surrendering to chaos. She decided that accepting the randomness was the only reason left, transforming a blind grab into a deliberate surrender.
