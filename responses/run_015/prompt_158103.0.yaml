      *   *Narrativist:* The archive limits what *statements* can be made, but not the *story* told. Causal links are narrative glue, not empirical data. Incompatible accounts are different aesthetic/moral choices. Objectivity = procedural fairness + acknowledging one's own standpoint.
      *   *The Sealed Archive:* This is the battleground. Reconstructionist says: "If the docs are fixed, the *true* story is fixed." Narrativist says: "If the docs are fixed, the *possible* stories are still plural."

  3.  **Drafting - Section by Section:**

      *   **Title/Intro:** Needs to sound academic but collaborative. "Joint Statement on the Limits of Historical Disagreement."
      *   **Context:** Briefly mention the "Sealed Archive" thought experiment. Acknowledge the long-standing feud but frame it as productive tension.

      *   **Section (a) Common Ground:**
          *   *Archive Constraints:* Both agree the archive rules out *lies*. You can't say the document says X if it says Y.
          *   *Counterfactuals:* This is tricky. Reconstructionists hate them (speculation). Narrativists use them for plot (what if?). Compromise: Counterfactuals are heuristic tools, not empirical claims *unless* they imply a physical impossibility contradicted by the archive.
          *   *Objectivity:* Needs a definition that satisfies both. Not "God's eye view" (Narrativist rejects), not "mere consensus" (Reconstructionist rejects). Maybe "disciplined intersubjectivity."
          *   *The Sealed Archive:* Both agree incompatible accounts exist. The question is *why*.

      *   **Section (b) Residual Disagreements (The Table):**
          *   Need to be careful here. The prompt asks for rows worded the way *its own side* would accept. So, Row 1: Reconstructionist view. Row 2: Narrativist view.
          *   *Topic 1: Nature of Causal Links.* Rec: Found in evidence. Nar: Imposed by plot.
          *   *Topic 2: The "True" Account.* Rec: One true account exists even if unknown. Nar: Multiple valid accounts exist depending on question asked.
          *   *Topic 3: Role of the Historian.* Rec: Discoverer. Nar: Creator/Craftsman.

      *   **The Cruxes (Tests & Predictions):**
          *   *Crux 1: Emplotment & Counterfactuals.*
              *   *Test:* A specific historical turning point where the documents show contingency (e.g., a close vote, a near-miss assassination).
              *   *Rec Prediction:* The documents reveal the *actual* cause; counterfactuals are distractions unless they highlight necessary conditions found in docs.
              *   *Nar Prediction:* The documents show the *outcome*; the *meaning* (tragedy vs. farce) depends on how we narrate the contingency.
          *   *Crux 2: Convergence vs. Genre.*
              *   *Test:* Long-term historiography of a stable event (e.g., Fall of Rome or French Revolution) over 100 years.
              *   *Rec Prediction:* Drift toward a stable core of fact/causation as bias is stripped away.
              *   *Nar Prediction:* Shifts reflect changing present-day concerns (genre shifts), not better access to the past.

      *   **Verbal Disputes:**
          *   Address "Objectivity." Rec means "correspondence to reality." Nar means "fairness of procedure."
          *   Address "Truth." Rec means "accuracy." Nar means "interpretive viability."
