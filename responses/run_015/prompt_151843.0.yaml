          *   *Boltzmann Brains:* If probabilities are just ignorance, why worry about BBs? Because we think the *physical measure* makes them dominant in a de Sitter vacuum.
          *   *The Past Hypothesis:* This is the crux. A subjectivist says "We don't know the past." An objectivist says "The past *was* low entropy." The norm requires the past to be *atypical* relative to the dynamic measure, which contradicts the "generic is best" norm unless we posit a new law.

      *   **Section 3: Analyzing the Colleague's Proposal (MDL/Simplicity):**
          *   Minimizing correlation/description length is a methodological rule.
          *   It aligns with Occam's Razor.
          *   It dissolves the "objective vs. subjective" dichotomy somewhat (it's about model selection).
          *   *Problem:* It doesn't solve the Past Hypothesis. A low-entropy past has *low* description length (simple) but is *measure-zero* (atypical) under standard dynamics. Simplicity $\neq$ Typicality. This is a crucial distinction.

      *   **Section 4: Categorizing the Practice (Strict Presupposition vs. Underdetermined):**
