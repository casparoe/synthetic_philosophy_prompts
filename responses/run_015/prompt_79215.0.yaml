answer: |-
  The impasse stems from conflating causal origins with normative responsibility, rendering empirical evidence secondary to moral framing. This is compounded by divergent methodologies regarding agency versus structural forces, preventing consensus on what constitutes a valid explanation.

  Historians are not merely disputing facts but the threshold for blame. Orthodox accounts prioritize agency (Stalin's choices), while Revisionists prioritize structure (US economic hegemony). Because asking "who started it" implies moral culpability, evidence becomes ammunition rather than illumination. The third hypothesis holds partial truth; the "Cold War" is indeed a retrospective construct, but the geopolitical tensions were real enough to demand explanation.

  Progress requires a reformulated question rather than new evidence. The archives are open; the impasse is conceptual. Historians must distinguish between structural inevitability and contingent choice, moving beyond the legalistic model of indictment. Therefore, progress counts as a distinction between causality and guilt, and a reformulated question focusing on mutual security dilemmas rather than unilateral aggression. A security dilemma framework helps, showing how defensive moves appeared offensive, but true progress lies in transnational history. This examines how domestic politics in both capitals constrained leaders, rendering the "choice" to confront less voluntary than either side admits. If the impasse is purely ideological, no evidence will suffice. However, shifting from moral judgment to systemic analysis allows us to understand *how* it happened without needing to convict *who* did it. The question isn't who lit the match, but why the room was filled with gas. Ultimately, the debate persists because it serves presentist political needs; as long as the Cold War justifies current foreign policy, the verdict on its origins will remain contested.
