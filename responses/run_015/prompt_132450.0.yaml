  ### 🚫 Empty / Incoherent Combinations
  *   **Causal + Synchronic:** Incoherent. Causation requires a timeline (effect follows cause), so a "snapshot" causal condition is logically impossible.
  *   **Deflationary + Diachronic Causal:** Incoherent (Cross-Branch). Deflationism (Branch A) rejects metaphysical requirements like causal history (Branch B); mixing them cancels the core logic of both.
  *   **No False Lemmas + Diachronic:** Unexplored. Justification is typically treated as a current state of evidence; adding history usually turns it into a Reliabilist/Causal view instead.

  ### ⚠️ Hard to Separate Leaves
  *   **Virtue Epistemology (A2) vs. Process Reliabilism (B3-Diachronic):** Both require the belief to arise from a stable competence rather than luck. The split is mostly whether you focus on the *agent's character* (Virtue) or the *process's success rate* (Reliabilism).
  *   **Safety (B2-Synchronic) vs. Sensitivity (B2-Diachronic):** Both use modal logic (possible worlds). Safety looks at worlds where you *do* believe (is it true?); Sensitivity looks at worlds where the fact is *false* (do you believe?). In the Sheep case, they often yield the same result but diverge in skeptical scenarios.
