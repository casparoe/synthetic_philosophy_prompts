answer: |-
  Your person-affecting restriction (1) is logically incompatible with your convictions about the clinical case (4) and embryo selection (5), so (1) must be the first thing you discard.

  **1. The Fatal Contradiction: (1) vs. (4) and (5)**
  *   **The Clash:** The person-affecting restriction (1) states that an option is worse only if it is worse for someone who exists either way. In the clinical case (4) and embryo selection (5), different people exist in the outcomes. Therefore, according to (1), neither choice is worse than the other. This directly contradicts your claim that the doctor's choice is wrong (4) and that you ought to pick the better embryo (5).
  *   **What Has to Give:** You must drop or radically modify (1). You cannot maintain a strict person-affecting view and claim there is wrongness in nonidentity cases.
  *   **The Cost:** You lose the intuitive shield against utilitarianism that says "no victim, no foul." You must accept impersonal principles where an outcome can be worse even if no particular person is worse off, opening you to charges that you are treating people as mere containers for value.

  **2. The Structural Undermining: (1) vs. (3)**
  *   **The Clash:** You want the asymmetry (3) to be a fixed point, including the strong reason not to create a life not worth living. However, in nonidentity cases, the miserable person does not exist in the alternative outcome. If (1) holds, creating them is not worse for them than never existing. Thus, (1) strips the "strong reason" in (3) of its normative force in the very cases where you need it most.
  *   **What Has to Give:** Again, (1) must go. You need an impersonal reason not to create misery to sustain (3) in nonidentity scenarios.
  *   **The Cost:** You must ground the wrongness of creating miserable lives in the state of the world rather than harm to a subject. This makes your view structurally similar to total utilitarianism regarding bad lives, which complicates your goal of avoiding the repugnant conclusion (6).

  **3. The Theoretical Itch: (2) vs. (3)**
  *   **The Clash:** You suspect (2) and (3) are the dodgy pair because you can't see how existence could be a harm but not a benefit. This is the classic asymmetry objection: if there is no subject in the alternative outcome to benefit from existence, there is equally no subject to be harmed by it.
  *   **What Has to Give:** Since you stipulated (3) as a fixed point, you must accept (2) only as a limited heuristic, not a universal metaphysical claim. You must treat the asymmetry as brute rather than derived.
  *   **The Cost:** Theoretical elegance. You become vulnerable to the charge of arbitrariness—you must defend why the absence of a subject blocks benefit claims but not harm claims without a unified underlying principle.

  **4. The Strategic Risk: (5) vs. (6)**
  *   **The Clash:** Your principle (5) says to pick the embryo with the better expected life, and that this matters a lot when the gap is big. If scaled to population ethics, maximizing expected life quality across possible people drives you toward total utilitarianism, which generates the repugnant conclusion (6) you want to avoid.
  *   **What Has to Give:** You must restrict the scope of (5). It should apply to same-number choices (one child vs. one child) but not imply that adding more happy lives is always better.
  *   **The Cost:** Complexity and potential arbitrariness. You will need to introduce a "critical level" of welfare or a sufficientarian threshold to block the repugnant conclusion, which requires defending why lives above that level don't compel creation while lives below it compel avoidance.
