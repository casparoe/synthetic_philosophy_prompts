answer: |-
  This is a classic **ontological-normative knot**. It is not merely a verbal disagreement (about definitions), nor is it a straightforward substantive disagreement (about facts). It is a clash between two incompatible **political ontologies** that generate different truth conditions for the same sentences.

  Your hunch is correct: you are mixing up metaphysics, legitimacy, and temporal identity. But the reason the debate stalls is not just confusion; it is because Camp A and Camp B are playing different language games. Camp A is playing a **Representational Game** (politics mirrors society), while Camp B is playing a **Constitutive Game** (politics creates society).

  Here is the diagnosis of the commitments, why it stalls, and what actually counts as progress.

  ### 1. Concrete Commitments: What Each Side Is Actually Defending

  To move past "populists vs. liberals," you need to map the underlying philosophical commitments.

  **Camp A: The Latent Will Realists (Representational)**
  *   **Ontology:** "The People" is a pre-political sociological entity. It exists like a demographic or a class, even if it isn't currently speaking.
  *   **Epistemology:** Preferences are fixed and latent. The "will" is a *discovery* problem. Institutions (media, parties, courts) act as noise or filters that distort the signal.
  *   **Normative Standard:** Legitimacy is **fidelity**. A government is legitimate to the degree that its output matches the latent preference of the group-agent.
  *   **View of Populism:** Populists are potentially *correct* informants. They are claiming to have better access to the signal than the institutions.
  *   **Fatal Flaw:** They struggle to explain how a heterogeneous group becomes a single agent without a political process (the "boundary problem").

  **Camp B: The Performative Constructivists (Constitutive)**
  *   **Ontology:** "The People" is a political fiction brought into being through speech acts (the "wedding vow" analogy). It does not exist prior to mobilization.
  *   **Epistemology:** Preferences are endogenous to politics. The "will" is an *invention* or *construction* problem.
  *   **Normative Standard:** Legitimacy is **authorization**. A government is legitimate to the degree that the process of constructing "the people" was inclusive and contestable.
  *   **View of Populism:** Populists are *authors*, not informants. They are not describing a will; they are creating a coalition and calling it "the people." The danger is not that they are "wrong," but that they claim their construction is the *only* valid one (exclusion).
  *   **Fatal Flaw:** They struggle to provide a normative check against demagoguery. If the will is purely performative, what stops a leader from performing a "will" that justifies tyranny?

  ### 2. Diagnosis: Why It Stalls

  This is an **Incommensurability of Truth Conditions**.

  When Camp A asks, "Is the populist telling the truth about the will?", they are asking a **correspondence question**: *Does Statement X match Reality Y?*
  When Camp B asks that same question, they hear a **felicity question**: *Was Speech Act X performed under appropriate conditions to create Reality Y?*

  *   **Camp A** thinks Camp B is being cynical or evasive ("Of course the people exist, look at the poverty rates!").
  *   **Camp B** thinks Camp A is being naive or metaphysical ("You can't find 'the people' in a dataset; you only find individuals until a leader names them.").

  Because they disagree on what *kind* of thing "the will of the people" is, they cannot agree on what evidence would settle the dispute.
  *   **Empirical tests fail:** Polling data satisfies Camp A (as an approximation) but confirms Camp B's suspicion (that the "will" changes depending on how the question is framed).
  *   **Formal models fail:** Social Choice Theory (Arrow's Theorem) proves Camp A's "coherent collective will" is mathematically impossible under certain conditions, but Camp A usually rejects the axioms of Social Choice as too individualistic. Camp B accepts the impossibility but argues it doesn't matter because the will is political, not mathematical.

  ### 3. What Counts as Progress?

  You will not solve this with data. You will not solve it with a better definition. Progress requires **dissolving the question** and replacing it with a **second-order framework**.

  **Do not aim for:** A consensus on whether "the people" exist.
  **Do aim for:** A consensus on the *risks and functions* of claiming they exist.

  Here are three concrete moves to break the circle:

  #### A. The Conceptual Distinction: Will-as-Preference vs. Will-as-Authorship
  Force the department to distinguish between two meanings of "Will":
  1.  **Will-as-Preference (Camp A):** A vector of policy desires (e.g., "lower taxes"). This can be measured, aggregated, and suppressed.
  2.  **Will-as-Authorship (Camp B):** A claim to sovereignty (e.g., "We are the ones who decide"). This is performative and binary.

  **Progress looks like:** Camp A admitting that *Authorship* cannot be measured (you can't poll for sovereignty), and Camp B admitting that *Preference* has a reality that can be ignored (you can't just perform away material deprivation). The debate shifts from "Who is right?" to "When does a claim to Authorship legitimately override measured Preference?"

  #### B. The Pragmatic Pivot: From Truth to Accountability
  Adopt a framework similar to **Jane Mansbridge's** or **Nadia Urbinati's** work on representation. Stop asking if the populist *describes* the people. Start asking: **Under what conditions is the claim to speak for the people contestable?**

  *   **Camp A's concern** (suppression) is addressed by asking: Are there institutional channels for latent preferences to become active?
  *   **Camp B's concern** (exclusion) is addressed by asking: Can the definition of "the people" be challenged by those left out of the performance?

  **Progress looks like:** Agreement that the danger of populism isn't "falsehood" (Camp A's fear) or "fiction" (Camp B's fear), but **uncontestability**. If a leader claims to embody the will *and* shuts down the procedures that allow that claim to be challenged, *that* is the normative failure both sides can agree on.

  #### C. The "Necessary Fiction" Compromise
  Propose that "The People" is a **regulative ideal** (Kant) rather than a constitutive reality.
  *   It does not exist empirically (Camp B is right).
  *   But we must act *as if* it exists to prevent tyranny (Camp A is right about the function).

  **Progress looks like:** Acknowledging that Camp A describes the **sociological pressure** (people feel ignored), while Camp B describes the **political mechanism** (leaders mobilize that feeling). The conflict arises when the mechanism claims to be the only valid reflection of the pressure.

  ### Summary Recommendation for Your Department

  Stop debating the **ontology** of the people. It is a bedrock intuition clash (Discovery vs. Invention) that is unlikely to move.

  Instead, debate the **conditions of the claim**.
  Propose this resolution: *"The 'will of the people' is a claim that acquires legitimacy not through its accuracy (Camp A) or its utterance (Camp B), but through the openness of the process that allows the claim to be challenged."*

  This allows Camp A to keep their focus on institutional blockage (challenges are blocked) and Camp B to keep their focus on exclusion (challenges are disallowed). It moves the debate from metaphysics to **institutional design**, which is where you can actually make progress.
