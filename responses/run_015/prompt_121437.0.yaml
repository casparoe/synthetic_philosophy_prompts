      *   *Is it different questions?* Partially. Camp A is asking "Is X true?" (epistemic/ontological). Camp B is asking "What does saying X *do*?" (pragmatic/performative).
      *   *The Core Tension:* It's a clash between *Pre-political Realism* (Camp A) and *Constitutive Constructivism* (Camp B).

