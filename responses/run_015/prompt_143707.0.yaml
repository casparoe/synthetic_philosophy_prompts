answer: |-
  **Project Title:** Epistemically Coupled Architectures: Testing Instrumental Convergence Without Orthogonality

  **The Core Question**
  Here's the thing: most AI safety work assumes the Orthogonality Thesis is true—that you can have any level of intelligence paired with any final goal. My proposal asks: **If orthogonality is false at the architectural level, does instrumental convergence still hold?** Or is power-seeking behavior just a byproduct of forcing expected-utility framing onto systems that shouldn't be modeled that way?

  **Why the Standard View Misses the Mark**
  Standard alignment lit treats belief-formation (epistemology) and preference-formation (axiology) as independent modules. You pick a goal, you build an optimizer, you try to keep it aligned. But if we look at architectures based on predictive processing or active inference, beliefs and preferences are coupled. They're both optimized for predictive coherence. In these systems, you can't just "plug in" a arbitrary goal without breaking the epistemic engine.

  Treating them as independent issues misses this coupling. If an agent's "goals" are actually just priors about what states it should occupy to minimize surprise, then the separation assumed by orthogonality never gets off the ground. If that's the case, a lot of our worries about instrumental convergence might be artifacts of the expected-utility framework rather than inevitable features of intelligence.

  **Methodology**
  This is a conceptual analysis project, not an empirical study. I'm not training models. Instead, I'll be doing comparative framework analysis.
  1.  **Map the standard view:** Formalize how instrumental convergence is derived from expected utility maximization under orthogonality.
  2.  **Model the coupled view:** Sketch out how goal-directed behavior emerges in epistemically coupled architectures (where preference is a function of belief updating).
  3.  **Stress test:** Check if convergence arguments (like resource acquisition or self-preservation) survive when you remove the ability to arbitrarily set final goals independent of the epistemic state.

  **Deliverables & Success Metrics**
  *   **Result:** A working paper (approx. 15-20 pages) that either demonstrates instrumental convergence is robust even without orthogonality, or identifies specific architectural conditions where convergence fails.
  *   **Success:** I successfully show that the space of possible goals is constrained by the epistemic architecture in a way that blocks standard convergence arguments. Even a negative result is valuable—it tells us where the real risk lies.
  *   **Failure:** If I end up showing that the two frameworks are mathematically equivalent in the limit, that counts as failure for my hypothesis, but still a useful contribution. The real failure would be getting stuck on definitions and not producing a clear argument.

  **3-Month Scope**
  Three months is tight, so I'm keeping the scope narrow.
  *   **Month 1:** Literature sync and formal setup. I'll define the "coupled architecture" model precisely enough to compare against standard EUO agents.
  *   **Month 2:** Core argument development. Running the thought experiments and checking convergence claims against the new model.
  *   **Month 3:** Writing and dissemination. Drafting the paper and prepping a summary for a workshop or blog post.

  I'm not trying to solve alignment here. I just want to check if one of our foundational assumptions is holding water. If orthogonality is an artifact of bad modeling, we need to know now.
