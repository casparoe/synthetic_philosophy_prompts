      *   Four categories (Supported, Contested, Overgeneralized, Invented)? Check.
      *   Address specific questions (design, mechanism, extensions, philosophical moral)? Check.
      *   Actionable advice? Check.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure to emphasize the "within-subjects" vs "between-subjects" error. That's a factual error in the passage that undermines the "they could see for themselves" claim.
      *   *Correction:* Be careful not to say the algorithmic prediction is *wrong*, just that it's not *supported by the Knobe data*. It's a hypothesis.
      *   *Correction:* Ensure the distinction between "intentionality" and "responsibility" is clear. You can be responsible without intending, but the Knobe effect blurs this in folk judgment.

  9.  **Final Output Structure:**
      *   Executive Summary.
      *   Claim-by-Claim Audit (The Four Buckets).
      *   Deep Dive on Specific Questions (Design, Mechanism, Extensions, Philosophy).
      *   Actionable Takeaways for Product Policy.
      *   Risk Areas/Where to Pause.

