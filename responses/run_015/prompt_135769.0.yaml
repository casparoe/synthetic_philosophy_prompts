          *   Address the extension to knowledge, foresight, causation, responsibility.
          *   Address the philosophical moral about intuition/conceptual analysis.
          *   Provide actionable advice: What survives? What supports expectations about attributions of intentionality/purpose/responsibility? Where to be careful?
          *   **Constraint:** No citations, references, or reading lists. American English.

  2.  **Deconstruct the Passage:**
      *   *Claim 1 (The Story):* Knobe asked people about a chairman, profits, environment, indifference. Harm = intentional; Help = not intentional.
      *   *Claim 2 (Design):* Participants read *both* versions (within-subjects).
      *   *Claim 3 (Mechanism):* Moral judgment drives factual judgment (blameworthy -> intentionally).
      *   *Claim 4 (Extension):* Same effect found for *every* related notion (knew, foresaw, caused, responsible).
      *   *Claim 5 (Algorithm Application):* If a system raises engagement + harmful content, users will say the team *intentionally* amplified harm because bad outcomes are treated as deliberate.
      *   *Claim 6 (Philosophical Moral):* Intuition can't be trusted as evidence; ordinary concepts contaminated by moral judgment; no stable folk psychology.

  3.  **Evaluate Each Claim (Mental Fact-Check):**

      *   *Claim 1 (The Story):* Accurate summary of the original 2003 Knobe paper ("Intentional Action and Side Effects").
      *   *Claim 2 (Design):* **False.** The original study was *between-subjects* (participants saw one version or the other, not both). This is a crucial detail because seeing both might reduce the effect (demand characteristics or consistency pressure).
      *   *Claim 3 (Mechanism):* **Contested.** Knobe originally suggested moral considerations shape the *application* of the concept of intentionality. Some argue it's about the concept itself changing; others argue it's about pragmatic implicature; others argue it's about deep cognitive structures. The passage says "people first decide... then reach for the word." This is the "Blame First" hypothesis. It's a leading theory but not definitively proven as the *only* mechanism.
      *   *Claim 4 (Extension):* **Overgeneralization.** The effect *has* been found for knowledge, foresight, causation, and responsibility (the "Knobe Effect" broadly construed), but saying "every related notion" and implying it works *exactly the same way* for all of them is too strong. Some replications fail or show weaker effects for certain concepts.
      *   *Claim 5 (Algorithm Application):* **Extrapolation/Invented.** There is no specific experiment in the original literature about "ranking systems," "engagement," or "harmful content." This is an analogy. It's plausible but not data-backed by Knobe's work.
      *   *Claim 6 (Philosophical Moral):* **Contested/Strong.** Knobe and others do argue this challenges traditional conceptual analysis. However, saying intuition "can't be trusted as evidence" *at all* is a strong nihilistic take. Many experimental philosophers argue we need to *refine* how we use intuition, not discard it. Also, the passage implies there is *no* stable folk psychology. Many researchers believe there is structure, just not the one traditional philosophers assumed.

  4.  **Drafting the Audit (Section by Section):**

      *   *Experimental Design:* Correct the "read both versions" error. This matters for policy because real users don't see the counterfactual (the helpful version).
      *   *Mechanism:* Clarify that "Blame First" is a hypothesis, not a proven fact. It's the "Skill Model" vs. "Deep Self" vs. "Pragmatics."
      *   *Extensions:* Acknowledge the effect is robust across many concepts but "every" is too strong. Responsibility is the strongest correlate, causation is trickier.
      *   *Algorithm Case:* This is the biggest leap. Users might not view algorithms like human chairmen. The "intentionality" of code is legally and psychologically distinct.
      *   *Philosophical Moral:* Nuance the "intuition is useless" claim. It's more about "intuition is context-sensitive."

  5.  **Determining Actionable Advice (The "So What?"):**

      *   *What survives:* People judge side effects differently based on moral valence. Harmful side effects look more intentional than helpful ones, especially with indifference ("don't care").
      *   *Policy Implication:* If you say "we don't care about X, only Y," and X is bad, you look guilty. If you say "we care about X," it might mitigate the "intentional" label even if the outcome is the same.
      *   *Caveats:* Algorithms aren't humans. "Intentional" in law vs. folk psychology differs. Probability matters (certainty vs. likelihood).

  6.  **Refining the Tone:**
