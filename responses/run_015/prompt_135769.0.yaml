      *   **Task:** Audit a specific passage about the Knobe Effect (Side-Effect Effect) regarding its accuracy, interpretation, and applicability to algorithmic ranking systems.
      *   **Specific Requirements:**
          *   Separate claims into: (1) Supported by experiment, (2) Contested interpretation presented as settled, (3) Overgeneralization to other notions, (4) Invented/extrapolated regarding algorithms.
