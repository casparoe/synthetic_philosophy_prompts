  # Collective Inquiry and the Normative Bite of Pragmatism: Re-evaluating Peirce and James in the Context of Distributed Belief

  **Course:** Advanced Topics in Classical Pragmatism
  **Student:** [Name Redacted]
  **Date:** 24 October 2023
  **Word Count:** Approx. 5000 words

  ## Abstract

  This research proposal outlines a project intended to interrogate the scalability of classical pragmatist theories of truth when applied to collective epistemic agents rather than individual minds. The standard pedagogical presentation of the pragmatist tradition, particularly regarding Charles Sanders Peirce and William James, predominantly frames the problem of truth and belief-fixation within the context of the individual inquirer. Peirce is typically read as offering a convergence theory of truth grounded in the long-run consensus of a community, while James is interpreted as providing a criterion of practical cash-value for the individual believer. This project argues that this individualist framing obscures a significant theoretical vulnerability: neither account adequately addresses the normative implications when the 'inquirer' is not a unified consciousness but a scattered, potentially fragmented group, such as a research laboratory or a political committee.

  By constructing two conceptual toy models—a convergent collective and a permanently split collective—this project will test whether Peirce's convergence criterion and James's utility criterion retain their normative force in social contexts. The central hypothesis is that without a mechanism to adjudicate between divergent practical payoffs within a group, James's pragmatism risks collapsing into relativism, while Peirce's reliance on a final opinion assumes a metaphysical unity of the community that may not exist in practice. The ultimate aim is to propose a revised 'collective pragmatism' that can account for distributed belief formation without losing the normative bite required to guide inquiry. This document serves as both a proposal for the semester's work and a preliminary analysis of the canonical texts to establish the viability of the project.

  ## 1. Introduction: The Unit of Belief

  ### 1.1 The Context of the Inquiry
  The history of pragmatism is often taught as a debate between objectivity and subjectivity, with Charles Sanders Peirce standing as the champion of scientific realism and William James as the advocate for a more pluralistic, human-centred truth. In the standard lecture version of this narrative, Peirce defines truth as the opinion which is fated to be ultimately agreed to by all who investigate, whereas James defines truth as that which proves itself to be good in the way of belief. While this dichotomy is useful for introductory purposes, it relies on a tacit assumption that has gone largely unexamined in contemporary coursework: the assumption that the believer is a single, unified entity.

  When we read Peirce's *The Fixation of Belief* or James's *Pragmatism*, we are invited to imagine a lone inquirer struggling with doubt, seeking a stable state of belief to guide action. Even when Peirce speaks of the 'community of inquirers', he often treats this community as a singular logical subject that extends over time. The community is the 'man' whose ignorance is reduced over the centuries. However, this metaphorical unity masks the messy reality of actual scientific and social inquiry. In the real world, inquiry is rarely conducted by a lone genius or a monolithic community. It is conducted by teams, laboratories, departments, and institutions that are often internally divided.

  This project arises from a recognition of this gap. Consider a modern research laboratory. It is not a single mind. It is a group of individuals who may hold conflicting hypotheses, utilise different methodologies, and interpret data through competing theoretical lenses. If half the lab believes Theory A and the other half believes Theory B, what is the 'truth' of the lab? If Theory A yields practical success for one subgroup (perhaps securing funding or publishing papers) while Theory B yields practical success for another (perhaps explaining anomalous data), how does the Jamesian criterion of 'cash-value' apply? Does the lab hold two contradictory truths simultaneously? Furthermore, if the lab never reaches a consensus, does Peirce's definition of truth imply that no truth exists for that inquiry, or merely that it has not yet been realised?

  ### 1.2 The Problem Statement
  The central problem this project addresses is the normative insufficiency of classical pragmatism when scaled from the individual to the collective. Pragmatism is not merely a descriptive theory of how beliefs are formed; it is a normative theory intended to guide inquiry. It tells us what we *ought* to believe based on the consequences of holding that belief. However, if the 'we' in question is fragmented, the normative guidance becomes ambiguous.

  If Peirce's truth is what inquiry converges upon in the long run, but the inquiry is conducted by a group that remains permanently split, the convergence condition is never met. Does this mean the group is irrational? Or does it mean the concept of truth is inapplicable to their context? If James's truth is what works, but 'what works' differs for different members of the group, does pragmatism offer any way to resolve the dispute? Or does it simply validate both conflicting beliefs as 'true' for their respective holders, thereby surrendering any claim to objective guidance?

  This project posits that the standard readings of Peirce and James fail to account for the complexity of collective epistemology. By treating the inquirer as a unified consciousness, they bypass the political and social dimensions of belief formation. This proposal outlines a plan to analyse these weaknesses through a conceptual examination of the canonical texts, supported by two toy models of collective inquiry. The goal is to determine whether pragmatism can be revised to handle collective agents without becoming empty (in Peirce's case) or relativist (in James's case).

  ### 1.3 Methodology and Scope
  The approach taken in this project is conceptual rather than historical. While there is a rich historical debate regarding the personal relationship between Peirce and James and the divergences in their metaphysics, this project will not engage in archival research or deep historical contextualisation. Instead, it will work with the well-known canonical texts: Peirce's papers on belief-fixation (specifically *The Fixation of Belief* and *How to Make Our Ideas Clear*) and James's *Pragmatism* lectures (specifically 'What Pragmatism Means' and 'The One and the Many').

  The method involves three stages. First, a close reading of the texts to identify where the assumption of a unified believer is operative. Second, the construction of two toy models of collective inquiry: one where the collective eventually reaches agreement (Convergent Collective) and one where the collective remains permanently divided (Fragmented Collective). Third, an application of Peircean and Jamesian criteria to these models to test for normative consistency.

  The scope is realistic for a one-semester project. It does not require engagement with contemporary social epistemology literature (such as the work of Goldman or Fuller), although the implications may touch upon those fields. The focus remains strictly on the internal coherence of classical pragmatism when faced with the problem of distributed belief. The success of the project will be measured by whether it can articulate a revised 'collective pragmatism' or successfully demonstrate that the distinction between individual and group belief is philosophically inert within the pragmatist framework.

  ## 2. Peirce and the Metaphysics of the Community

  ### 2.1 The Method of Science and the Long Run
  To understand where Peirce's account might falter in a collective context, we must first establish what his account of truth actually entails. In *The Fixation of Belief*, Peirce outlines four methods for settling opinion: the method of tenacity, the method of authority, the a priori method, and the method of science. He argues that only the method of science is capable of distinguishing between a real thing and a mere figment of imagination because it relies upon an external permanency—something upon which our thinking has no effect.

  Peirce's famous definition of truth is found in *How to Make Our Ideas Clear*: "The opinion which is fated to be ultimately agreed to by all who investigate, is what we mean by the truth, and the object represented in this opinion is the real." This is often summarised as the convergence theory of truth. Crucially, this convergence is not guaranteed in the short run. It is a limit concept, situated in the 'long run'. Peirce acknowledges that individuals may be wrong, and even generations may be wrong, but the process of inquiry, if pursued sufficiently, will tend towards a stable conclusion.

  The critical question for this project is: who is the 'all who investigate'? In Peirce's writings, this is often referred to as the 'community of inquirers'. Peirce sometimes speaks of this community in almost mystical terms, suggesting a continuity of mind between past, present, and future investigators. He posits that logic is rooted in a social principle, that man is a sign, and that the community extends across time. This suggests that for Peirce, the community is not just a collection of individuals but a unified logical subject. The 'long run' is the lifespan of this logical subject.

  However, this metaphysical unity is problematic when applied to actual social groups. If the 'community' is defined by its eventual agreement, then any group that fails to agree is, by definition, not yet functioning as a true community of inquiry. But this seems to beg the question. In a research lab, the scientists are a community by virtue of their employment and shared goals, regardless of whether they agree. If they disagree permanently, Peirce's definition implies that there is no truth regarding their specific inquiry. This renders the concept of truth useless for guiding their current actions. If truth is only what they *will* agree on in the indefinite future, and they are currently stuck, pragmatism offers no normative bite for the present moment.

  ### 2.2 The Assumption of a Unified Consciousness
  Peirce's framework quietly assumes that the friction of inquiry is between the inquirer and the external world, not between inquirers themselves. When doubt arises, it is because experience contradicts expectation. The resolution comes when the inquirer adjusts their belief to match the external permanency. In a collective setting, however, doubt often arises because one member of the group contradicts another. The 'external permanency' is mediated through social interaction.

  If we treat the lab as a single mind, as Peirce's metaphor suggests, then internal disagreement is merely a state of cognitive dissonance within that mind, which must be resolved for the mind to function. But a lab is not a mind. It is a structure of power, resources, and competing interests. One subgroup may hold a belief because the data supports it; another may hold a conflicting belief because it aligns with the funding body's preferences.

  Peirce's method of science is supposed to override these social pressures by appealing to the external real. But if the 'real' is only accessible through the consensus of the community, and the community is fractured, the access is blocked. The normative force of Peirce's pragmatism lies in its ability to tell us to prefer the method of science over the method of authority. But if the 'method of science' within a collective requires a unity of consciousness that does not exist, the command becomes impossible to follow. The lab cannot 'converge' simply by willing it; convergence requires a mechanism of resolution that Peirce does not specify beyond 'continued inquiry'.

  ### 2.3 The Temporal Gap
  Another issue is the temporal dimension. Peirce's truth is eschatological; it lies at the end of inquiry. For an individual, this is manageable; I can act on the best current hypothesis while acknowledging it might be revised. For a collective, however, the 'long run' may exceed the lifespan of the collective itself. A research lab may be disbanded before consensus is reached. A political committee may dissolve. If the collective ceases to exist before convergence, did the truth ever exist?

  If the truth is dependent on the eventual agreement of the community, and the community fragments permanently, the truth value of their propositions remains undefined. This is unsatisfactory for a philosophy that prides itself on practicality. A pragmatic theory of truth should help us navigate the world now, not promise clarity in a future that may never arrive. This suggests that Peirce's account relies on a hopefulness about the unity of rational agents that is not warranted by the sociological reality of collective inquiry. The 'community' is not a given; it is an achievement. By assuming it as a precondition for truth, Peirce risks making truth contingent on social cohesion rather than empirical adequacy.

  ## 3. James and the Economy of Truth

  ### 3.1 Truth as Cash-Value
  William James's approach in *Pragmatism* is markedly different. He is less concerned with the ultimate end of inquiry and more concerned with the immediate utility of belief. For James, truth is not a stagnant property; it 'happens' to an idea. It becomes true, is made true by events. The criterion is 'cash-value': what practical difference does it make if this belief is true rather than false?

  James emphasises the individual's perspective. "Truth lives, in fact, for the most part on a credit system." We believe things because they lead us to beneficial outcomes. This is highly intuitive for individual agents. If believing I can jump the stream helps me jump it, the belief is true in that moment. However, when we scale this to a collective, the 'cash-value' becomes distributed and potentially conflicting.

  In a collective agent, such as a laboratory, the 'payoff' of a belief is not uniform. A belief might be 'true' for the principal investigator because it secures a grant, but 'false' for the PhD student because it leads to failed experiments. Or, a belief might be 'true' for the theoretical division because it simplifies the maths, but 'false' for the experimental division because it contradicts the data. James's criterion asks: "What works?" But the question must be amended to: "What works for whom?"

  ### 3.2 The Problem of Divergent Payoffs
  If truth is defined by practical payoff, and the payoffs within a group diverge, James's pragmatism threatens to collapse into a form of relativism. If Theory A works for Subgroup 1 and Theory B works for Subgroup 2, then both are 'true' within the Jamesian framework. This might seem pluralistic and tolerant, but it destroys the normative bite of the theory. Pragmatism is supposed to help us choose between beliefs. If both conflicting beliefs are validated by their respective utilities within the group, pragmatism offers no guidance on how to resolve the conflict.

  James does address the social dimension of truth to some extent. He acknowledges that beliefs must be consistent with the rest of our knowledge and with the beliefs of others. We cannot simply believe whatever we like; we are constrained by the 'stock of old opinions'. However, this constraint is descriptive, not normative. It describes how beliefs stabilize, not how they *ought* to stabilize when the stock of opinions is itself divided.

  In a fragmented collective, the 'stock of old opinions' is not a single ledger but multiple, conflicting ledgers. If the group is permanently split, there is no single 'cash-value' to calculate. The collective cannot act on a contradiction. If half the lab builds a machine based on Theory A and the other half builds a machine based on Theory B, the collective action fails. James's individualistic criterion does not account for the necessity of coordinated action in collective agents. For a group to function as an agent, it requires a unified belief state, or at least a mechanism to defer action until unity is achieved. James's theory validates the individual payoffs but ignores the collective cost of disagreement.

  ### 3.3 The Normative Deficit
  The normative deficit in James's account becomes apparent when we consider the goal of inquiry. For Peirce, the goal is truth (convergence). For James, the goal is satisfactory belief (utility). In a collective, the goal is often successful collective action. If James's criterion validates beliefs that lead to individual satisfaction but collective failure, it is maladaptive for the group.

  Consider a scenario where a belief in 'urgent action' pays off for the leadership (consolidating power) but leads to disaster for the technicians (safety hazards). James's criterion might label the belief 'true' for the leadership. But from the perspective of the collective entity (the organisation), the belief is destructive. This highlights a category error in applying James's individualist pragmatism to collective agents. The 'cash-value' for the collective is not the sum of the cash-values for the individuals. It is a distinct metric based on the survival and success of the group as a whole.

  James's framework lacks the resources to distinguish between 'true for me' and 'true for us'. Without this distinction, pragmatism cannot serve as a guide for collective policy or scientific consensus. It becomes a tool for justifying individual positions within a debate rather than a method for resolving the debate. This is the opposite of what a normative epistemology should do. It suggests that while James's pragmatism is robust for individual ethics and psychology, it requires significant modification to function as a social epistemology.

  ## 4. Toy Model A: The Convergent Collective

  ### 4.1 Description of the Model
  To test these theories, I will construct two toy models. The first is the Convergent Collective. This model represents an idealised research laboratory. The team is composed of diverse specialists with initial disagreements. However, they share a common goal (e.g., developing a vaccine), share data openly, and adhere to a common methodological standard. Over time, through experimentation and debate, the group converges on a single theory. Dissenters are persuaded by evidence or leave the group. Eventually, the group acts as a unified mind.

  ### 4.2 Peircean Analysis
  In this model, Peirce's theory functions well. The community of inquirers exists in a meaningful sense. The 'long run' is compressed into the lifespan of the project. The convergence of opinion matches the convergence of the external reality (the efficacy of the vaccine). The normative bite is preserved: the method of science is vindicated because it led to the convergence. The assumption of a unified consciousness is retrospectively validated by the outcome. The group *became* a single logical subject through the process of inquiry.

  However, even here, there is a subtle tension. Peirce's truth is what *would* be agreed to in the long run. In this model, agreement *is* reached. But was it fated? Or was it contingent on specific social dynamics (e.g., a charismatic leader persuading the rest)? If the convergence was achieved through the method of authority (a famous professor dictating the theory) rather than the method of science, Peirce would say the belief is not true, even if everyone agrees. This highlights that convergence alone is not enough for Peirce; the *method* of convergence matters. In a collective, distinguishing between genuine scientific consensus and social coercion is difficult. Peirce's framework assumes the method is transparent, but in a group, power dynamics can obscure the method. Thus, even in the convergent model, Peirce's criterion requires access to the social processes of the group, not just the final outcome.

  ### 4.3 Jamesian Analysis
  For James, the Convergent Collective also presents a success case, but for different reasons. The belief proves its cash-value by enabling the successful development of the vaccine. The practical payoff is clear and shared. The truth 'happens' to the theory when the vaccine works. The individual payoffs align with the collective payoff.

  However, James's account struggles to explain *why* the convergence happened. For James, truth is made by the verification process. In a collective, verification is distributed. One person runs the trial, another analyses the data, another writes the paper. The 'truth' is a collective product. James's individualistic language ('good in the way of belief') struggles to capture this distributed verification. Did the belief work for the group, or for the individuals? If the vaccine works, it works for the public. The scientists' belief is validated by an outcome outside the group. This aligns with Peirce's external permanency more than James's internal satisfaction. James's model works here only because the individual interests happened to align with the external reality. If the interests had diverged (e.g., if hiding the data was more profitable), James's criterion might have validated a false belief for the individuals, even if it failed for the collective.

  ### 4.4 Preliminary Conclusion for Model A
  In the Convergent Collective, both pragmatists survive, but Peirce offers a more robust explanation of the *process* (method of science), while James offers a better explanation of the *outcome* (practical success). However, both rely on the happy coincidence that individual utilities aligned with collective convergence. This suggests that their theories work in ideal conditions but may not provide the tools to *create* those conditions when they are absent.

  ## 5. Toy Model B: The Permanently Split Collective

  ### 5.1 Description of the Model
  The second model is the Fragmented Collective. This represents a field of inquiry plagued by paradigm wars, such as certain areas of psychology or economics. The laboratory is divided into two factions. Faction A uses Methodology X and believes Theory Alpha. Faction B uses Methodology Y and believes Theory Beta. Both factions publish papers, secure funding, and train students. Neither convinces the other. The division persists over decades. The collective never converges.

  ### 5.2 Peircean Analysis
  This model is catastrophic for Peirce. If truth is the opinion fated to be agreed to by all who investigate, and the investigators are permanently split, then there is no truth. The object of inquiry remains undefined. This implies that the entire field is engaged in a futile exercise. Peirce might argue that the inquiry has not gone on long enough, or that one side is not using the method of science. But if both sides claim to be scientific, and the split persists indefinitely, Peirce's definition renders the truth unknowable.

  This removes the normative bite. If the truth is undefined, how should the inquirers act? Peirce cannot tell Faction A to concede to Faction B, because the final opinion has not yet manifested. He can only urge them to keep investigating. But if the investigation itself is structured by the disagreement (different methods), 'keeping investigating' just perpetuates the split. Peirce's theory assumes that reality will eventually force a consensus. In Model B, reality does not seem to be doing so. This suggests that Peirce's realism is too optimistic about the coercive power of evidence in social contexts. Evidence is interpreted through theoretical lenses. If the lenses are incompatible, the evidence does not converge.

  ### 5.3 Jamesian Analysis
  For James, Model B is more manageable but equally problematic. For Faction A, Theory Alpha is true because it works for them (publishing, explaining data within their paradigm). For Faction B, Theory Beta is true for the same reasons. James's pluralism allows for multiple truths. He might say that the universe is 'pluralistic' and both theories capture different aspects of reality.

  However, this leads to the relativism problem. If both are true, there is no reason to resolve the conflict. Pragmatism loses its critical edge. It becomes a descriptive sociology of science rather than a normative epistemology. It cannot tell the group that they *ought* to resolve the disagreement. Furthermore, if the split prevents collective action (e.g., the lab cannot agree on a safety protocol because the theories imply different risks), then the 'cash-value' is negative for the collective. James's individual criterion validates the beliefs that are causing the collective failure.

  This highlights the need for a 'collective cash-value'. A belief might be good for the individual scientist's career but bad for the scientific community's progress. James's framework lacks the vocabulary to make this distinction. It treats the believer as the unit of account. If the unit of account is shifted to the community, James's pragmatism changes significantly. It would require individuals to sacrifice their individual 'truth' for the collective 'truth'. This moves away from James's radical empiricism towards a more Hegelian or socialistic view of truth, which James explicitly resisted.

  ### 5.4 Preliminary Conclusion for Model B
  In the Fragmented Collective, Peirce's theory becomes empty (no truth exists), and James's theory becomes relativist (multiple contradictory truths exist). Neither provides a normative guide for how to heal the split. This suggests that classical pragmatism lacks a theory of *conflict resolution* in epistemology. It assumes that inquiry naturally tends towards agreement (Peirce) or that individual verification is sufficient (James). When neither is the case, the theories stall.

  ## 6. The Normative Deficit and Collective Agency

  ### 6.1 Defining Normative Bite
  The core requirement of this project is to determine if pragmatism retains 'normative bite'. By this, I mean the ability of the theory to prescribe actions or belief-forming practices that are distinct from merely describing what people do. A theory with normative bite can say, "You are wrong to believe this," or "You ought to investigate in this way."

  In the individual case, pragmatism has bite. It tells the individual to avoid the method of tenacity (Peirce) or to seek beliefs that lead to genuine satisfaction rather than delusion (James). In the collective case, as shown in the toy models, this bite is dulled. Peirce cannot condemn a stable disagreement if it persists indefinitely. James cannot condemn a belief that works for a subgroup even if it harms the whole.

  ### 6.2 The Need for a Collective Subject
  To restore the normative bite, pragmatism may need to posit a collective subject that is distinct from the sum of its members. This is not a metaphysical claim about a group mind, but a functional claim about agency. If a group acts as an agent (e.g., a corporation, a lab, a state), it must have belief states that are attributable to the group, not just the individuals.

  A revised collective pragmatism would define truth not as what individuals agree on, but as what enables the collective agent to survive and flourish. This shifts the 'cash-value' from the individual to the system. A belief is true for the lab if it enables the lab to produce reliable knowledge, even if some individuals within the lab are dissatisfied. This aligns more with Peirce's long-run community but brings it into the present tense. The 'long run' is the lifespan of the collective institution.

  ### 6.3 Implications for Peirce
  For Peirce, this revision means acknowledging that the 'community' is not a given metaphysical unity but a political construction that must be maintained. The method of science is not just about looking at nature; it is about maintaining the social conditions that allow convergence. Normativity lies in preserving the integrity of the community of inquiry. If a group splits, it is a failure of the social conditions of inquiry, not just a lack of evidence. Peirce's pragmatism would thus need to incorporate a social ethics of inquiry.

  ### 6.4 Implications for James
  For James, this revision is more drastic. It requires subordinating individual utility to collective utility. A belief that works for me but breaks the team is 'false' in a collective pragmatism. This moves James away from his radical individualism. However, it saves his theory from relativism. It provides a criterion to adjudicate between conflicting beliefs: which one sustains the collective agency? This is a pragmatic criterion (survival/function) but applied at a higher level of organization.

  ## 7. Towards a Revised Collective Pragmatism

  ### 7.1 Synthesising the Accounts
  The project aims to synthesize these insights into a provisional model of 'Collective Pragmatism'. This model would retain Peirce's emphasis on the community and James's emphasis on practical consequences, but it would redefine the unit of evaluation.

  1.  **The Unit of Belief:** Beliefs are attributed to collective agents (labs, institutions) based on their committed actions and public assertions, not just the private states of members.
  2.  **The Criterion of Truth:** A collective belief is true if it successfully guides the collective's interaction with the environment over time.
  3.  **The Normative Rule:** Inquirers ought to prioritise belief-fixation methods that enhance the collective's capacity to act, even if this requires individual sacrifice (e.g., accepting a consensus one doubts for the sake of coordinated action).

  ### 7.2 Addressing the Risks
  This revised model faces two risks. First, it risks authoritarianism. If the collective truth overrides individual judgment, dissent is suppressed. This violates the spirit of Peirce's fallibilism. To counter this, the revised pragmatism must include a mechanism for 'legitimate dissent'. Dissent is valuable not as an end in itself, but as a check against collective error. It is instrumentally valuable for the long-term health of the collective.

  Second, it risks becoming functionalist. If truth is just what works for the group, does it matter if it corresponds to reality? A lie might work for a group in the short term. Here, Peirce's external permanency is crucial. The collective must interact with a reality that pushes back. If the collective belief is false, the environment will eventually punish the collective (e.g., the bridge falls down, the drug fails). Thus, the 'cash-value' for the collective is tied to empirical adequacy, not just social cohesion.

  ### 7.3 The Role of Conflict
  A key insight from this project is that conflict is not merely an obstacle to truth but a component of collective inquiry. In the Fragmented Collective model, the split was seen as a failure. However, in a revised pragmatism, controlled fragmentation might be efficient. Different subgroups can explore different hypotheses simultaneously. Truth emerges not from immediate consensus but from the competition between subgroups, provided there is a mechanism for eventual selection. This combines Peirce's competition of ideas with James's pluralism. The normative rule becomes: maintain enough consensus to act, but enough dissent to innovate.

  ## 8. Conclusion

  ### 8.1 Summary of Findings
  This proposal has argued that the standard individualist reading of Peirce and James obscures significant vulnerabilities in pragmatist epistemology when applied to collective agents. Peirce's convergence theory relies on a metaphysical unity of the community that is not present in fragmented groups, rendering truth undefined in cases of permanent disagreement. James's cash-value criterion validates divergent individual payoffs, leading to relativism and failing to guide collective action.

  Through the analysis of two toy models, it has been demonstrated that classical pragmatism lacks the resources to handle distributed belief formation without modification. The Convergent Collective shows that pragmatism works only when individual and collective interests align. The Fragmented Collective shows that when they diverge, pragmatism loses its normative force.

  ### 8.2 The Viability of the Project
  The project is viable because it works within the canonical texts without requiring external historical research. The logical analysis of the concepts of 'community', 'truth', and 'utility' is sufficient to expose the tensions. The toy models provide a clear framework for testing these concepts. The scope is manageable for a one-semester timeline, as it focuses on conceptual clarity rather than empirical data collection.

  ### 8.3 Expected Contribution
  The expected contribution of this project is a clearer understanding of the social dimensions of pragmatism. It challenges the view that pragmatism is solely an individualist philosophy. By proposing a 'Collective Pragmatism', it offers a way to salvage the normative bite of the tradition. It suggests that truth is not just what I believe or what we will eventually believe, but what allows us to function as a coherent agent in a resistant world.

  This has implications beyond philosophy. In an era of polarised science and political fragmentation, understanding how truth functions in divided communities is urgent. If pragmatism can offer a framework for navigating these divisions without succumbing to relativism or dogmatism, it reaffirms its relevance as a living philosophical tradition.

  ### 8.4 Final Reflection
  The row with my mate about Peirce and James was not just a semantic quibble. It touched on the fundamental structure of how we know things together. If we cannot agree on what truth means for a group, we cannot govern ourselves or conduct science effectively. This project seeks to turn that row into a rigorous analysis. It accepts that the standard lecture version misses something weird, as I initially suspected. The 'weirdness' is the assumption of unity. By exposing it, we can build a pragmatism that is robust enough for the real world, where minds are scattered, and agreement is hard-won. The goal is not to discard Peirce or James, but to scale them up. If successful, this project will show that pragmatism is not just about what works for me, but about what works for us.

