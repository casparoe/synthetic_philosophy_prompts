  The Ise Shrine presupposes that identity resides in immutable form and ritual continuity rather than material permanence, aligning more closely with corporate legal personhood than Western conservation ethics.

  This practice does not strictly require a single metaphysical theory but is compatible with several, primarily functionalism and four-dimensionalism, provided the object's definition prioritizes pattern over substance. It treats the shrine as a recurring event rather than a static noun, where purity and renewal trump material age. While functionalism explains the role, the practice also relies on a specific cultural ontology where spiritual essence transfers through ritual rather than inhabiting matter. Thus, it is metaphysically flexible but culturally specific.

  This aligns consistently with corporate law, where a legal entity remains "the same" despite total turnover of shareholders, employees, and assets because the charter and function persist. Both systems prioritize institutional continuity over material stasis.

  If heritage conservation law adopted this implicit view globally, the legal definition of "authenticity" would shift from material fabric to intangible heritage. Current frameworks like the Venice Charter prioritize retaining original material, often forbidding reconstruction. Adopting the Ise model would require statutes to recognize exact reconstruction as preservation rather than replication. Historic status would depend on maintaining traditional craftsmanship, design specifications, and cultural function, allowing buildings to be demolished and rebuilt without losing protected status. This would fundamentally alter zoning and preservation incentives, valuing living tradition and continuous use over physical ruins, effectively permitting the destruction of old structures provided their form and ritual purpose are perfectly perpetuated.
