  2.  **Deconstruct Du Bois's Theory ("Criteria of Negro Art"):**
      *   Core thesis: All art is propaganda and ought to be.
      *   Caveat: Propaganda that isn't beautiful is worthless.
      *   Context: He was critiquing some Harlem Renaissance writers for avoiding race issues or catering to white stereotypes (primitivism) to gain acceptance. He wanted art that advanced the cause of Black equality.
      *   Du Bois's Practice: He wrote pageants (e.g., *The Star of Ethiopia*), edited *The Crisis* (using art to illustrate racial pride), advocated for high culture (classical training, spirituals arranged artistically). He valued dignity and excellence as proof of humanity.

  3.  **Analyze Marian Anderson's Concert via the Three Categories:**
      *   (a) Carrier Propaganda: Content of the work. She sang classical arias (Handel, etc.) and spirituals ("My Country, 'Tis of Thee"). Did the songs themselves carry a political message? "My Country" is patriotic, but standard. Spirituals have historical weight but aren't explicit protest songs in this context. Anderson claimed she wasn't protesting. So, low carrier propaganda.
      *   (b) Occasion Propaganda: Setting/Audience. Lincoln Memorial (symbol of emancipation), steps denied by DAR (segregation), organized by Roosevelt admin (federal endorsement), integrated audience (implied by the scale and nature, though segregation existed). This is high occasion propaganda. The *fact* of her singing there is the message.
      *   (c) Exemplar Propaganda: Existence/Performance level. A Black woman singing classical repertoire at a world-class level. Refutes claims of inferiority. High exemplar propaganda.

  4.  **Evaluate Du Bois's Likely Response:**
      *   Which does he license? He definitely licenses (c) Exemplar. His whole "Talented Tenth" idea relies on excellence proving worth. He licenses (a) Carrier to an extent, but warns against art *only* being message without beauty. He might be wary of (b) Occasion if it overshadows the art, but given the setting (Lincoln Memorial), he'd likely see the symbolism as potent.
      *   Which would he reject? He criticized writers who flattered white taste. If "Occasion Propaganda" means performing *only* to satisfy a white liberal savior narrative (Roosevelt/DAR drama), he might be skeptical. However, the scale and dignity align with his vision. He might worry if the *occasion* eclipses the *beauty*.
      *   Beauty Requirement: Where does it attach? Du Bois says "propaganda which isn't also beautiful is worthless." This usually refers to the aesthetic quality of the work itself (the singing, the music). But if the occasion is part of the "art" (the performance event), does beauty attach there? Du Bois focuses on the art object's integrity. He'd likely say the beauty must be in the singing (Anderson's voice), otherwise the occasion is just a stunt.

  5.  **Turn it Around (Episode vs. Theory):**
      *   Does it confirm the theory? Yes, in that the event *was* propaganda (advancing the cause) and *was* beautiful (Anderson's voice).
      *   Does it collapse the theory? If *any* performance by a Black artist in 1939 DC is propaganda due to the context (occasion propaganda), then "all art is propaganda" becomes trivially true. It loses analytical bite. The question shifts from "Is it propaganda?" to "What *kind* of work does this occasion-propaganda do?"
      *   Gap: Du Bois doesn't fully account for the artist's intent vs. the reception/context. Anderson didn't see herself as protesting. Du Bois says art *ought* to be propaganda. Does the artist's intent matter? His framework is prescriptive (what art should do) rather than descriptive (what the artist intends). The framework is silent on who controls the propaganda value—the artist or the historical moment.

