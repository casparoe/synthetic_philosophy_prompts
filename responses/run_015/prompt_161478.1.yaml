answer: |-
  Dear colleague,

  Running Marian Anderson's 1939 concert through the framework you have outlined offers a rigorous stress test for Du Bois's Criteria of Negro Art, particularly because the event sits so uncomfortably between artistic autonomy and political inevitability. If we apply your three categories strictly, the concert functions minimally as carrier propaganda, since Anderson's program of standard classical arias and spirituals contained no explicit lyrical protest, and by her own account she intended no political statement. The weight of the event falls almost entirely on occasion propaganda and exemplar propaganda. The setting of the Lincoln Memorial, secured only after the Daughters of the American Revolution barred her from Constitution Hall, transformed the performance into a geopolitical argument about belonging and citizenship, while her technical mastery served as exemplar propaganda, offering undeniable evidence against claims of racial inferiority. Du Bois's own practice suggests he would have licensed both of these latter forms while remaining wary of the first if it lacked aesthetic rigor. His pageants, such as The Star of Ethiopia, were deeply invested in occasion propaganda, using spectacle and setting to narrate a history of Black contribution, and his stewardship of The Crisis consistently utilized exemplar propaganda by showcasing Black achievement to a mixed readership. He would likely have embraced Anderson's concert because it avoided the trap he identified in some Harlem Renaissance writers, where the desire for white approval led to a flattening of dignity or a catering to primitivist stereotypes. Anderson's refusal to sing anything but high art and traditional spirituals aligns with Du Bois's demand for universality through excellence, suggesting he would view the occasion not as a compromise but as a necessary theater for the exemplar to do its work.

  However, the question of where the beauty requirement attaches reveals a tension in Du Bois's theory that the Anderson case brings into sharp relief. Du Bois insists that propaganda which is not beautiful is worthless, and in this instance, the beauty must attach primarily to the work itself, specifically Anderson's voice and musicianship, rather than to the staging or the political arrangement. If the beauty resided only in the occasion—the nobility of the setting or the righteousness of the cause—the event would risk becoming mere spectacle, which Du Bois generally distrusted unless anchored by genuine artistic merit. He criticized art that was merely didactic, so while he would appreciate the occasion propaganda, he would insist that its efficacy depends on the aesthetic transcendence of the performance. Without the beauty of the singing, the occasion becomes a protest rally, and for Du Bois, a protest rally that lacks beauty fails as art and therefore fails as effective propaganda because it cannot move the human spirit beyond the immediate political grievance. The beauty validates the humanity that the occasion asserts.

  Turning this back onto the theory, however, the Anderson episode threatens to collapse Du Bois's central claim into near-vacuity. If the segregationist context of 1939 Washington means that any public performance by a Black artist of Anderson's stature is inevitably occasion propaganda, regardless of intent or content, then the assertion that all art is propaganda becomes a descriptive triviality rather than a prescriptive mandate. Du Bois writes that art ought to be propaganda, implying a choice on the part of the artist to wield their work for the cause. Yet Anderson's case demonstrates that the world imposes propaganda status upon Black art whether the artist wills it or not. This exposes a significant gap in Du Bois's framework: it is silent on the reception of art within a racist structure that politicizes Black existence by default. He assumes the artist controls the propaganda value, but here the historical moment dictates it. This suggests that the live question was never whether the art was propaganda, but rather what sort of work occasion-propaganda can do when the artist does not claim it. Du Bois's framework struggles to account for the power of art that functions as propaganda against the artist's own intention, yet still succeeds in advancing the cause through the sheer undeniable fact of its beauty and presence. Ultimately, the concert confirms his belief in the necessity of beauty but challenges his assumption of agency, showing that sometimes the occasion makes the propaganda so potent that the carrier content matters less than the mere fact of performance.
