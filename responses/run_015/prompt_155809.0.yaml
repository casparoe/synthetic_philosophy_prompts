  ## PART 4: LIMITATIONS AND FAILURE MODES

  **What This Procedure Cannot Do:**
  1.  **Genuinely Unprecedented Entities:** If the case has no historical analog (e.g., "Will a DAO govern a nation?"), the Reference Class step will fail. Do not force a class. Output REFUSE.
  2.  **Horizons > Class Span:** You cannot forecast 50 years out if your class data only spans 40 years. The survival curve becomes extrapolation, not interpolation.
  3.  **One-Off Structural Breaks:** Base rates assume continuity of mechanism. If the mechanism itself is breaking (e.g., climate change altering agricultural stability), past data is misleading. The procedure will produce a confident wrong number.
  4.  **Normative Questions:** If the question is "Should the Fed raise rates?", this procedure returns noise. It only answers "Will the Fed raise rates?" based on past behavior.

  **Failure Mode: The 5 PM Panic:**
  *   When pressured for a number by a deadline, analysts will skip Step 7 (Stability Audit).
  *   **Consequence:** You will produce a precise number (e.g., 67%) that collapses under slight definition changes.
  *   **Mitigation:** If Step 7 is skipped, the output must automatically default to a RANGE (±20%) or REFUSE. Do not allow a single number without the audit.

  **Assumption Sensitivity:**
  *   **Survival Distribution:** We assume empirical buckets. If you force a parametric fit (e.g., exponential decay) on N<50, the output is highly sensitive to the chosen parameter. Avoid parametric fits.
  *   **Inside View Weight:** If the team weights Inside View >20%, the procedure becomes storytelling. The 80/20 split is a hard constraint to prevent narrative drift.

