answer: |-
  It makes perfect sense that you're wrestling with this. You've spent your career navigating two very different ecosystems: the rigid, rule-based bureaucracy of Western science and funding, and the relational, obligation-based social structures of Pacific communities. In marine biology, you know that a reef isn't a machine; it's a web of relationships. But when you deal with a grants office, you're dealing with a machine.

  Your gut is telling you that "corruption" isn't a single thing; it's a clash between how different systems define "duty."

  To help you think this through, I won't give you a single definition, because a single definition usually forces you to ignore the nuance you've rightly spotted. Instead, I'll offer **two competing principles**. Your conflict arises because you are unconsciously switching between them depending on the context.

  ### Principle 1: The Impartiality Principle (The Bureaucratic View)
  **"Corruption occurs when a private benefit compromises the equal treatment required by an official role."**

  *   **Focus:** The *Office*. The role exists to serve the public or the institution impartially.
  *   **The Watch:** **Corrupt.** It compromises the supplier's equal treatment of other bidders (or your lab's future choices).
  *   **The Fee:** **Corrupt.** It violates the rule that all paperwork should be treated equally regardless of payment.
  *   **The Roommate:** **Corrupt.** Even if qualified, the hiring process was not impartial; it favored a private relationship over open competition.
  *   **The Elder:** **Problematic.** Under this strict view, the Elder is a public gatekeeper. Taking gifts before granting permission looks like selling access. This principle *cannot* easily spare the Elder without calling him an exception.
  *   **The Whiskey:** **Corrupt (or dangerously close).** Even if sent after, it blurs the line. It suggests the administrator is someone who *receives* benefits from those she helps, which compromises her appearance of impartiality for the *next* grant.

  ### Principle 2: The Relational Duty Principle (The Fieldwork View)
  **"Corruption occurs when a gift or act betrays the primary purpose of the specific relationship."**

  *   **Focus:** The *Relationship*. Roles are defined by social bonds, not abstract rules.
  *   **The Watch:** **Corrupt.** It betrays the trust of the lab/institution for personal gain.
  *   **The Fee:** **Corrupt.** It betrays the public trust (the system) for personal gain.
  *   **The Elder:** **Not Corrupt.** The Elder's role is *stewardship* of the reef through relationship. The fish and taro acknowledge that relationship. Refusing the gift would betray the social contract that allows research to happen. The gift sustains the role; it doesn't distort it.
  *   **The Roommate:** **Not Corrupt.** In a system based on trust networks, hiring someone you know and trust fulfills the duty of loyalty. If he is qualified, the primary purpose (good planning) is met, and the secondary purpose (maintaining trust networks) is also met.
  *   **The Whiskey:** **Not Corrupt.** It acknowledges a successful relationship. It says, "We worked well together." It sustains the bond for future cooperation without necessarily demanding a specific rule-bending favor.

  ### Resolving the Whiskey Case
  You asked if the whiskey is post-hoc bribery or gratitude. Here is the test that applies to both principles: **The Shadow of the Future.**

  *   **The Test:** Does the gift create an unspoken debt that hangs over the *next* interaction?
  *   **The Verdict:** If you send the whiskey, and next year you apply for another grant, does the administrator feel she *must* prioritize you because of the bottle? If yes, it is bribery, even if sent late. If she feels free to reject your next proposal without guilt or social penalty, it is gratitude.
  *   **The Reality:** In Western bureaucracy, gifts almost always cast a shadow. They turn a professional transaction into a personal debt. So, under **Principle 1**, it is corruption (or "illegal gratuity"). Under **Principle 2**, it is relationship maintenance.

  ### The Retired Administrator Prediction
  You asked what happens if you send the whiskey *after* she retires.

  *   **Prediction:** This is **Gratitude**, not corruption, under *both* principles.
  *   **Why:** Corruption requires the distortion of an *active* role. Once she retires, she holds no office to compromise. She has no power to distribute grants. Therefore, the gift cannot create a "shadow of the future" regarding her official duties. It becomes a purely personal acknowledgment of past help. This is the safest ethical ground you have.

  ### The Hard Truth: Which Gut Feeling Gets Thrown Out?
  You asked me to be honest about which of your intuitions a consistent principle has to sacrifice.

  If you adopt **Principle 1 (Impartiality)** to protect the integrity of Western science and funding:
  *   **You must sacrifice the Elder intuition.** You have to admit that, technically, giving fish before permission *is* a form of bribery, even if culturally necessary. You accept it as a "necessary evil" to do work, not as ethically pure.
  *   **You must sacrifice the Roommate intuition.** You have to call hiring the qualified roommate "cronyism." It doesn't matter that he was qualified; the process was tainted by private loyalty.

  If you adopt **Principle 2 (Relational Duty)** to honor the reality of human networks:
  *   **You must sacrifice the Facilitation Fee intuition.** You might have to argue that if everyone pays the fee and the official uses it to feed his family (a relational duty), it's just a "tax." Most Western ethics cannot accept this.
  *   **You must sacrifice the Watch intuition (partially).** If the supplier sends the watch to maintain a "long-term partnership" (relationship), a strict relationalist might argue it's only corrupt if the watch is *so* expensive it forces the lab to buy bad equipment.

  ### My Recommendation for Your Thinking
  Given your background, I suspect you value **Principle 1** for the lab and the grant office, and **Principle 2** for the field. That is not hypocrisy; it is **contextual integrity**.

  However, to answer your specific request for a single guiding principle that captures most of your verdicts, try this:

  > **"Corruption is the conversion of a public role into a private asset."**

  *   **The Watch:** Converts the contract process (public role) into a private reward (asset). **Corrupt.**
  *   **The Fee:** Converts the processing of paperwork (public role) into private income (asset). **Corrupt.**
  *   **The Elder:** The Elder's role is *not* a "public role" in the bureaucratic sense; it is a communal stewardship. The fish support the community, not just the elder's pocket. **Not Corrupt.**
  *   **The Roommate:** Converts a public hiring process into a private favor. **Corrupt** (This forces you to drop your hesitation).
  *   **The Whiskey:** If the administrator is a public role, the gift attempts to privatize her goodwill. **Corrupt/Risky.**
  *   **Retired Administrator:** She no longer holds the public role. The gift cannot convert her role into an asset. **Gratitude.**

  This principle forces you to be hardest on the **Roommate**. Your gut hesitates there because "he was qualified." But the principle says: *It doesn't matter.* The moment the hiring decision is driven by private loyalty rather than public process, the role has been converted into a private asset. That is the cost of consistency.

  Does that align with how you see the trade-offs?
