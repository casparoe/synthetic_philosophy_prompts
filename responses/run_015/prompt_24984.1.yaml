answer: |-
  This is a sophisticated world-building challenge. Sortition (democracy by lottery) is not a single system but a family of institutions. To stop reinventing the wheel, you need a **Sortition Design Protocol**.

  Below is a reusable procedure. It distinguishes between the **Normative Core** (rules you cannot break without the system ceasing to be sortition) and the **Design Space** (where you make creative choices). It also highlights **Systemic Vulnerabilities**, which are your plot engines.

  ---

  # The Sortition Design Protocol

  **Inputs:** Population Size ($N$), Technological Level ($T$), Political Problem Solved ($P$), Scope of Power ($S$).

  ### Phase 1: The Pool (Who is eligible?)
  *   **Normative Constraint:** *Equality of Opportunity.* Every member of the political community must have an equal mathematical chance of selection. You cannot filter by education, wealth, or "merit" without breaking the premise.
  *   **Design Options:**
      *   **Age Floor:** 18? 25? Retirement age?
      *   **Exemptions:** Critical personnel (e.g., surgeons mid-operation, life-support engineers)? *Warning: Too many exemptions create a "guardian class."*
      *   **Stratification:** Is the pool pure random, or weighted to ensure demographic mirroring (gender, region, caste)?
  *   **Vulnerability (Capture):** *The Exemption Creep.* Elites define "critical personnel" broadly to keep their own class out of the lottery while claiming it's for safety.

  ### Phase 2: The Mandate (What can they do?)
  *   **Normative Constraint:** *Descriptive Representation.* The body must act as a microcosm of the whole, not as representatives of factions. They should deliberate, not campaign.
  *   **Design Options:**
      *   **Initiative:** Can they propose laws, or only vote on them?
      *   **Veto:** Can they stop laws proposed by others?
      *   **Execution:** Do they administer policy, or just legislate it? *Warning: Execution requires continuity; sortition provides rotation.*
  *   **Vulnerability (Drift):** *Agenda Control.* If the sortition body can only vote on bills written by a permanent bureaucracy, the bureaucracy rules.

  ### Phase 3: Duration & Rotation (How long do they serve?)
  *   **Normative Constraint:** *Non-Professionalization.* Terms must be short enough that members return to private life before becoming a distinct political class. No re-election.
  *   **Design Options:**
      *   **Term Length:** Days (Jury duty) vs. Years (Legislative).
      *   **Staggering:** Do all leave at once, or is there a rolling membership (to preserve institutional memory)?
  *   **Vulnerability (Oligarchization):** *The Staff Trap.* If terms are too short, permanent staff become the only ones who know how the levers work.

  ### Phase 4: Epistemology (How do they know things?)
  *   **Normative Constraint:** *Independence.* They must not be dependent on external experts for their survival or information.
  *   **Design Options:**
      *   **Advisors:** Hired staff? Elected experts? AI summaries?
      *   **Training:** A "boot camp" before taking office?
      *   **Witnesses:** Can they summon external experts?
  *   **Vulnerability (Capture):** *Information Asymmetry.* Experts frame the choices so narrowly that the "choice" is illusory.

  ### Phase 5: Accountability & Coercion (What if they refuse/corrupt?)
  *   **Normative Constraint:** *Equality Before the Law.* They are not immune to prosecution, but they cannot be fired for political decisions (or they become puppets).
  *   **Design Options:**
      *   **Recall:** Can the public remove them? *Warning: Turns them into de facto elected officials.*
      *   **Conscription:** Is service mandatory? What is the penalty for refusal?
      *   **Incentives:** High pay (compensation for loss of income) vs. Civic Duty stipend.
  *   **Vulnerability (De-legitimization):** *The Unwilling Selectee.* A popular figure refuses to serve, claiming the system is tyrannical, sparking a movement.

  ---

  # Case Study A: The Lunar Colony
  **Spec:** Population 5,000. High Tech (Life Support dependent). Problem: Preventing factional war over resources. Scope: Executive Council (Administration).

  ### Protocol Run-Through

  1.  **The Pool:**
      *   *Constraint:* All residents must be eligible.
      *   *Tension:* In a colony of 5,000, **anonymity is impossible.** Everyone knows who is selected. Social pressure will be immense.
      *   *Design Choice:* Do you exempt Life-Support Engineers? If yes, you create a technocratic elite. If no, a random citizen might order a shutdown they don't understand.
  2.  **The Mandate (Executive):**
      *   *Constraint:* Executive power requires continuity. Sortition provides rotation.
      *   *Tension:* **The Competence Gap.** A random council cannot manage nuclear reactors or oxygen scrubbers.
      *   *Design Choice:* The Council sets *priorities* (e.g., "Ration water to grow more food"), but the Bureaucracy determines *feasibility*.
  3.  **Duration:**
      *   *Design Choice:* Short terms (6 months) to prevent power consolidation.
      *   *Vulnerability:* **Bureaucratic Capture.** The permanent engineers will say "No" to every Council idea by claiming it's "physically impossible." The Council becomes a rubber stamp.
  4.  **Epistemology:**
      *   *Design Choice:* AI-mediated briefing. The AI summarizes technical constraints.
      *   *Vulnerability:* **Algorithmic Governance.** Whoever programs the AI's risk parameters actually rules the colony.
  5.  **Accountability:**
      *   *Design Choice:* Mandatory service. Refusal = exile (airlock/deportation).
      *   *Vulnerability:* **Martyrdom.** A selectee refuses on moral grounds, exposing the coercive nature of the "free" lottery.

  ### Novelist's Gold: Overlooked Choices & Unresolved Tensions
  *   **The "Black Box" Veto:** The protocol forces you to admit the random Council cannot actually fly the ship. The tension lies in the **Technical Veto**. The plot lives in the hallway outside the Council chamber, where the Chief Engineer tells the Council President, "You can vote for that, but I won't implement it because it kills us all." Is that sabotage or salvation?
  *   **Social Transparency:** In a town of 5,000, you cannot deliberate in secret. Your neighbors know you voted to cut their rations. The tension is **Social Ostracization vs. Civic Duty**. The plot hook: A Councilor is socially "dead" back in their habitat module because of a vote they cast for the greater good.
  *   **The Exemption List:** Who gets to stay out of the lottery? If the elite define "Critical Infrastructure" loosely, they never serve. The plot hook: A scandal where a wealthy hydroponics owner is found on the "Exempt" list despite having a substitute available.

  ---

  # Case Study B: The Post-National City
  **Spec:** Population 5,000,000. High Tech (Digital infrastructure). Problem: Corruption/Elite Capture of legislation. Scope: Legislative (Shared with Elected Technocrats).

  ### Protocol Run-Through

  1.  **The Pool:**
      *   *Constraint:* 5 million requires stratification to ensure the sample mirrors the whole (otherwise you might get 0 people from the slums).
      *   *Design Choice:* **Sortition by Quota.** 500 seats, allocated by district/class.
      *   *Vulnerability:* **Identity Politics.** If seats are allocated by group, members act as delegates for that group, not as random citizens. This breaks the normative core of sortition (deliberation over representation).
  2.  **The Mandate (Legislative):**
      *   *Design Choice:* Bicameral. The Sortition Chamber (The House of Luck) has Veto power over the Elected Technocrats (The House of Merit).
      *   *Tension:* **Legitimacy Conflict.** The Technocrats claim they know what they're doing; the Sortition Chamber claims they represent the *will* of the people.
  3.  **Duration:**
      *   *Design Choice:* 3-year terms. Long enough to learn, short enough to leave.
      *   *Vulnerability:* **The Career Lottery.** 3 years is long enough for lobbyists to cultivate relationships. A "revolving door" industry emerges to train selectees on how to vote.
  4.  **Epistemology:**
      *   *Design Choice:* The Technocrats write the bills; the Sortition Chamber amends/vetoes.
      *   *Vulnerability:* **Complexity Obfuscation.** The Technocrats write 5,000-page bills. The random citizens don't have time to read them. They rely on summaries.
  5.  **Accountability:**
      *   *Design Choice:* No recall. They are not representatives; they are samples. You don't recall a thermometer because you don't like the temperature.
      *   *Vulnerability:* **Public Rage.** When the Sortition Chamber makes an unpopular decision, the public cannot vote them out. This leads to riots against "The Lottery."

  ### Novelist's Gold: Overlooked Choices & Unresolved Tensions
  *   **The Summary War:** Since the random legislators can't read 5,000-page bills, they rely on summaries. Who writes the summaries? The plot lives in the **Office of Legislative Digest**. A neutral clerk realizes that changing one adjective in the summary will change the vote. Is that journalism or manipulation?
  *   **The Two Legitimacies:** The Technocrats have *Competence Legitimacy* (they know the budget). The Sortition Chamber has *Moral Legitimacy* (they are the people). The tension is unresolved: **Who yields when they disagree?** The plot hook: A budget crisis where the Technocrats say "Math says No" and the Sortition Chamber says "People say Yes." The system has no rule for who wins, leading to constitutional collapse.
  *   **Lobbying the Luck:** Lobbyists can't bribe 500 random people easily, but they can target the *undecided middle*. A new profession arises: **Sortition Whisperers**. These are therapists/coaches who help random citizens "find their true opinion," which conveniently aligns with a donor's interest. The plot hook: Your protagonist is a Sortition Whisperer who realizes they are brainwashing ordinary people.

  ---

  # Summary of Tensions (Features, Not Bugs)

  For your cycle, these are the recurring themes the procedure surfaces:

  1.  **Competence vs. Legitimacy:** Sortition solves corruption but introduces ignorance. The drama is always in the gap between *having the right to decide* and *knowing how to decide*.
  2.  **Permanence vs. Rotation:** The random leaders rotate; the staff stays. The permanent staff will always try to rule. The plot is always about the struggle for **Institutional Memory**.
  3.  **The Burden of the Ordinary:** Sortition assumes ordinary people *want* to rule. Often, they don't. The drama of the **Reluctant Ruler** is inherent to the system.
  4.  **Transparency vs. Deliberation:** To be trusted, the process must be open. To be effective, deliberation often needs privacy. In the Lunar Colony, privacy is physically impossible. In the City, it is digitally compromised.

  Use this protocol to generate the "rules" for each book, then break the rules where the vulnerability flags indicate. That is where your characters will suffer.
