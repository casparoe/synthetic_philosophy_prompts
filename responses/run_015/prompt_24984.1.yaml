          *   Distinguish: *Constraints* (normative core, can't fudge) vs. *Options* (design space).
          *   Flag: Vulnerabilities (capture, drift, oligarchization) -> Plot hooks.
      *   **Application:** Run the procedure on two specific settings:
          *   (a) Small lunar colony (few thousand), sortition selects executive council.
          *   (b) Post-national city (several million), sortition chamber + elected technocratic body.
      *   **Output:** Identify overlooked design choices and unresolved tensions (features for a novelist).

  2.  **Deconstruct Sortition (The Normative Core):**
      *   What *is* sortition fundamentally? It's anti-factional, egalitarian, and descriptive (the body mirrors the population).
      *   *Hard Constraints:* Randomness (no filtering based on merit/wealth), Equality of Opportunity (everyone in the pool), Descriptive Representation (the sample must represent the whole).
      *   *Soft Constraints/Options:* Term length, specific powers, support staff, recall mechanisms.
      *   *Vulnerabilities:* Bureaucratic capture (staff running the show), elite manipulation of the agenda, public disillusionment, "professionalization" of the random members.

  3.  **Drafting the Design Procedure (The "Sortition Engine"):**
      *   Need a step-by-step flow.
      *   *Step 1: Define the Pool.* (Who is eligible? Citizens? Residents? Age?)
      *   *Step 2: Selection Mechanics.* (Pure lottery? Stratified? Replacement rules?)
      *   *Step 3: Mandate & Scope.* (What can they actually do? Veto? Initiate? Administer?)
      *   *Step 4: Duration & Rotation.* (Terms? Staggered?)
      *   *Step 5: Expertise vs. Ignorance.* (How do they handle complex info? Advisors?)
      *   *Step 6: Accountability & Recall.* (Can they be fired? By whom?)
      *   *Step 7: The "Unwilling" Problem.* (Opt-out? Conscription?)
      *   *Step 8: Interface with Permanence.* (Bureaucracy, Courts, Elections.)
      *   *Constraint vs. Option labeling:* Crucial for the user.
      *   *Vulnerability Flagging:* Crucial for plot generation.

  4.  **Running the Procedure on Setting (a): Lunar Colony:**
      *   *Spec:* ~5,000 people, Executive Council, High tech, High stakes (life support).
      *   *Pool:* Everyone capable? Or exclude critical engineers? (Tension: Competence vs. Equality).
      *   *Scope:* Executive. This is dangerous. Administration requires continuity.
      *   *Vulnerability:* The permanent civil service (engineers) effectively ruling because the random council doesn't understand life support systems.
      *   *Plot Hook:* A crisis where the Council votes for something physically impossible.

  5.  **Running the Procedure on Setting (b): Post-National City:**
      *   *Spec:* ~5 million, Legislative, Mixed system (Sortition + Elected Technocrats).
      *   *Pool:* Massive. Needs stratification to ensure representation.
      *   *Scope:* Legislative. Veto or Initiate?
      *   *Relationship:* The "Technocrats" are elected. This creates a class tension. Merit vs. Luck.
      *   *Vulnerability:* The Technocrats write the bills; the Sortition chamber just rubber-stamps or blocks without understanding. Agenda control.
      *   *Plot Hook:* Lobbying the random citizens vs. lobbying the technocrats.

  6.  **Refining the Output:**
      *   Tone: Professional, analytical, creative-friendly.
      *   Structure:
          1.  Introduction (Acknowledging the utility of the tool).
          2.  The Procedure (The "Sortition Design Protocol").
          3.  Case Study A (Lunar Colony).
          4.  Case Study B (Post-National City).
          5.  Conclusion (Summary of tensions).
      *   *Self-Correction during drafting:* Make sure I explicitly distinguish between *Normative Constraints* (must haves) and *Design Options* (choices). Make sure I highlight the *Plot Vulnerabilities*.

  7.  **Deep Dive into Normative Constraints:**
      *   If you filter the pool by education, it's not sortition, it's meritocracy.
      *   If you let them serve indefinitely, it's not sortition, it's a career.
      *   If they are easily bribed without consequence, the system fails.
      *   *Key Insight:* The tension between *Competence* and *Legitimacy* is the engine of drama.

  8.  **Final Review against User Prompt:**
      *   Reusable design procedure? Yes.
      *   Inputs specified? Yes.
      *   Choice points covered? Yes.
      *   Constraints vs. Options distinguished? Yes.
      *   Vulnerabilities flagged? Yes.
      *   Two settings run? Yes.
      *   Overlooked choices & unresolved tensions identified? Yes.

  9.  **Final Polish:** Ensure the language evokes political theory but remains accessible for fiction writing. (e.g., using terms like "Agenda Control" and "Bureaucratic Capture").

  *(Self-Correction Note)*: I need to make sure I don't just give a dry political science lecture. The user is a novelist. The "Vulnerabilities" need to sound like plot points. The "Tensions" need to sound like character conflicts.

