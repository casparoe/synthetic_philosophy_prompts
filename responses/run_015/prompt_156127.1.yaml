answer: |-
  ### Reconstruction of the Implicit Theory

  The bifurcated regulatory landscape regarding salmonids versus decapod crustaceans presupposes a hybrid philosophical framework that blends **phylogenetic gradualism** with **feasibility-constrained obligation**. This framework is not explicitly codified but is revealed through the disparity between recognition of sentience (UK Act 2022, retail boiling bans) and the exclusion from farm-welfare standards (EU Directive, ASC/RSPCA certification gaps).

  **1. Moral Status: Graduated Sentience (Confidence: High)**
  The practice presupposes that moral status is not binary (sentient/insentient) but graded along phylogenetic lines. While the UK Act 2022 legally recognizes decapods as sentient, the regulatory lag suggests an implicit commitment that vertebrate sentience is "thicker" or more morally weighty than invertebrate sentience. This allows regulators to acknowledge crustacean sentience abstractly (justifying retail boiling bans where individual animals are visible) while denying them the robust protections afforded to fish in high-volume farming. The implicit claim is that the *quality* or *intensity* of crustacean suffering is sufficiently distinct from vertebrate suffering to warrant differential treatment in industrial contexts.

  **2. Epistemic Access: Anthropomorphic Legibility (Confidence: Medium-High)**
  The exclusion relies on an epistemic commitment that welfare duties apply primarily where suffering is behaviorally legible to human auditors. Fish display gasping, loss of equilibrium, and thrashing—signals easily mapped onto human concepts of distress. Crustacean nociception (e.g., grooming injured antennae, autotomy, avoidance learning) is subtler and less anthropomorphically resonant. The implicit theory holds that if suffering cannot be easily verified by a human auditor without specialized equipment or ethological training, the presumption of welfare obligation is weakened. This creates an "epistemic opacity" that functions as a moral exemption.

  **3. Institutional Obligation: Tractability as a Boundary Condition (Confidence: High)**
  The strongest implicit commitment is that institutional obligation is bounded by economic and technical tractability. Stunning a single lobster in a restaurant is feasible; stunning millions of small penaeid shrimp in a harvest pond is currently industrially disruptive. The practice presupposes a form of **pragmatic utilitarianism**: the moral duty to prevent suffering is overridden when the cost of mitigation threatens the viability of the production system. This suggests that welfare is treated as a luxury good applicable only where compliance is cheap, rather than a rights-based constraint applicable regardless of cost.

  ### Evaluation of Competing Hypotheses

  Does this practice require one specific commitment, or is it compatible with rival theories?

  *   **Vertebrate CNS Requirement:** The practice is *historically* consistent with the view that a vertebrate-like central nervous system is necessary for morally relevant suffering. However, this commitment is **incoherent** with the UK Act 2022 and retail boiling bans. If a vertebrate CNS were the strict requirement, boiling lobsters alive would be permissible in retail. Therefore, the practice does not *need* this commitment to function; it merely inherits it.
  *   **Behavioral Legibility:** This is highly compatible with the current system. Auditing regimes rely on visual checks. If the theory is "welfare duties apply only where suffering is behaviorally legible," the exclusion of shrimp follows logically. However, this conflicts with the scientific evidence of nociception which exists independent of human observation.
  *   **Tractability (Silent Boundary):** This is the most robust explanation. It is compatible with *both* the recognition of sentience (we admit they feel) and the exclusion from regulation (but we can't afford to fix it). It allows regulators to hold contradictory positions without logical collapse by shifting the ground from *moral status* to *implementation feasibility*.

  **Assessment of Coherence:**
  The parts are **philosophically incoherent** given the legal recognition of decapod sentience.
  1.  **Retail vs. Farm:** If the basis for banning live boiling is sentience, that sentience does not vanish when the animal moves from a restaurant tank to a farm pond. The distinction implies that moral status is context-dependent, which is ethically unstable.
  2.  **Law vs. Regulation:** The UK Act 2022 mandates that animal sentience be fully considered in policy. Maintaining farm regulations that ignore crustacean welfare while acknowledging their sentience creates a legal-formal tension. The current practice is coherent only if one assumes that "consideration" allows for "dismissal based on cost," which undermines the spirit of sentience legislation.

  ### Requirements for a Uniform, Capacity-Based Policy

  A policy built on a uniform view of welfare (where capacity for suffering, not taxonomy or tractability, determines protection) would require radical changes:

  1.  **Stunning and Slaughter:**
      *   **Change:** Mandatory pre-slaughter stunning for all crustaceans, scaling by species size.
      *   **Implementation:** For lobsters/crabs, electrical stunning (e.g., Crustastun) must be mandatory. For shrimp, research into batch electrical stunning or rapid thermal shock protocols that induce immediate insensibility (rather than slow death by hypoxia/temperature drop) would be required. Harvesting by pond draining (leading to suffocation) would be prohibited.
  2.  **Stocking Density:**
      *   **Change:** Density limits based on physiological stress markers rather than maximum survival yield.
      *   **Implementation:** Current shrimp stocking often exceeds 100 animals/m². A capacity-based approach would lower this to prevent aggression, cannibalism, and water quality degradation that induces chronic stress. Welfare indicators would shift from "mortality rate" to "integrity rate" (e.g., limb loss, shell damage, black gill syndrome).
  3.  **Auditing and Verification:**
      *   **Change:** Auditors must be trained in crustacean ethology, not just vertebrate welfare.
      *   **Implementation:** Welfare assessments would require specific behavioral assays (e.g., response to noxious stimuli, shelter-seeking behavior) rather than visual checks for mortality. Feed-withdrawal periods would need to be established to ensure gut clearance without inducing starvation stress, similar to fish protocols.

  ### Confidence Assessment and Uncertainty

  **Confidence in Reconstruction:**
  *   **Tractability/Economics as the primary driver:** **High Confidence (90%).** The disparity correlates almost perfectly with the difficulty and cost of implementing welfare measures, rather than scientific uncertainty alone.
  *   **Graduated Sentience as the moral justification:** **High Confidence (85%).** Regulatory language often implies vertebrates are "higher" animals, allowing for this graduated protectionism.
  *   **Behavioral Legibility as the auditing standard:** **Medium-High Confidence (75%).** While likely a factor, modern science makes nociception clear; the persistence of exclusion suggests legibility is an excuse rather than the root cause.

  **Point of Least Certainty:**
  I am **least certain (Low Confidence, ~50%)** regarding whether the regulatory exclusion is driven by **conscious philosophical commitment** or **bureaucratic inertia**.
  It is unclear if regulators actively hold the theory that "obligation is bounded by tractability" as a principled stance, or if they simply haven't updated legacy vertebrate-focused frameworks because the aquaculture lobby resists the cost of shrimp welfare. The "implicit theory" I have reconstructed may be a rationalization of inertia rather than the actual motivating philosophy of the policymakers. Distinguishing between a *principled pragmatic utilitarianism* and *unexamined status quo bias* is difficult from external observation of policy outcomes alone.
