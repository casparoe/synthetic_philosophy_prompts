prompt: |-
  Construct a thought experiment to specifications. Design a realistic, single-paragraph hospital scenario — not a trolley problem — in which a senior physician’s failure to actively veto an automated surgical recommendation results in patient harm, engineered so that a counterfactual dependence account of causation counts the omission as a cause, a physical-process or connection account denies it, and an interventionist account counts it but for reasons structurally different from the counterfactual account. The divergence must turn specifically on the absence of any physical interaction between the physician’s inaction and the surgical robot’s execution: the robot operates autonomously, and had she pressed the remote veto button the system would have halted, but her failure to press it involves no energy transmission, contact, or physical link to the outcome. Do not invoke exotic physics, perfect predictors, or demons; keep the institutional protocol ordinary and the payoffs normal for medical ethics. After presenting the scenario, verify that each theory delivers its assigned verdict with explicit reasoning about the relevant nearby worlds or causal-model variables. Then identify the feature that does all the work, describe precisely how the case collapses if that feature is removed — for example, if the veto required her to physically pull a lever that severed the robot’s power cable — and explain how a defender of the physical-process account would attack the original case. Lead with the bottom line — the constructed scenario together with the isolating feature named — in the first sentence, then give the verification and analysis with no preamble and no restating of the prompt.
