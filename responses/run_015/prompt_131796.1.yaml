answer: |-
  Elena is more right overall because she accurately captures Quine's commitment to metaphysical indeterminacy and the compensatory role of logic, whereas Marcus mistakenly treats Quine's thesis as merely epistemic and misapplies constraints on domestic language to the radical translation scenario.

  **Elena Move 1:** Clearly Right. She correctly states the core of Quine's inscrutability of reference: behavioral evidence underdetermines ontology, and Quine argues there is no fact of the matter beyond this evidence.
  **Marcus Move 1:** Clearly Mistaken. He conflates underdetermination of theory by evidence (epistemic) with indeterminacy of translation (ontological); Quine explicitly argues there is no "right manual" waiting to be found, not just that we cannot know it.
  **Elena Move 2:** Clearly Right. Her appeal to the rejection of the "museum myth" accurately reflects Quine's behaviorism and his denial of intensional entities that could settle the reference.
  **Marcus Move 2:** Partially Right. While pragmatic use constrains interpretation, Quine argues that such constraints do not fix reference uniquely because practical success can be preserved across different ontological schemes.
  **Elena Move 3:** Clearly Right. She precisely articulates Quine's counter-argument that adjustments in background logic (individuation, identity) allow rival manuals to accommodate the same practical behavior.
  **Marcus Move 3:** Partially Right. He correctly notes Quine distinguishes radical translation from domestic discourse, but he is mistaken to claim Elena's argument implies global conventionalism or makes mistranslation impossible within Quine's specific framework for radical translation.

  **What Both Are Missing:** Neither distinguishes clearly between *inscrutability of reference* (the gavagai case specifically) and *holophrastic indeterminacy of translation* (sentence-level), which Quine treats as related but distinct theses. Additionally, both overlook the social-normative objection (later developed by Kripke and Burge) that meaning is constituted by community correctness conditions rather than individual behavioral dispositions, which challenges Quine's behaviorism more fundamentally than Marcus's pragmatic realism.
