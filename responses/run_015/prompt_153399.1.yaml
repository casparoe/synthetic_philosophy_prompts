answer: |-
  This is a classic friction point in the philosophy of causal inference. The phrase "correlation is not causation" functions as a philosophical shibboleth, but like most shibboleths, it conflates epistemic, statistical, and ontological claims. When you are operating at the level of Pearl (Structural Causal Models) vs. Lewis (Counterfactual Dependence), precision is the only currency that matters.

  Here is the disambiguation of the distinct precise readings hiding in that sentence, evaluated by their truth value and dialectical utility.

  ### 1. The Statistical Inequivalence Thesis
  *   **Claim:** $P(Y|X) \neq P(Y|do(X))$.
  *   **Meaning:** The conditional probability of $Y$ given observation $X$ is mathematically distinct from the probability of $Y$ given an intervention on $X$.
  *   **Verdict:** **Trivially True (Mathematical Tautology).**
  *   **Analysis:** In Pearl's calculus, this is a definition. $P(Y|X)$ sums over all paths (including confounders); $P(Y|do(X))$ surgically severs incoming arrows to $X$. Unless the graph is already fully de-confounded, these numbers differ.
  *   **Dialectical Utility:** Low. No serious causal inference theorist disputes this. If someone uses this reading, they are stating a definition, not making an argument.

  ### 2. The Underidentification Thesis (The Epistemic Claim)
  *   **Claim:** Observational joint distributions alone are insufficient to uniquely identify causal structure.
  *   **Meaning:** You cannot derive a causal DAG or a causal effect size solely from the covariance matrix of observational data without additional causal assumptions (e.g., "no arrow from Y to X").
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** This is the "No Causation from Data Alone" thesis. It is the core justification for why we need SCMs (Structural Causal Models) or RCTs. It asserts that causal information is an *input*, not an *output*, of statistical analysis.
  *   **Dialectical Utility:** High. This is the workhorse claim of modern causal inference. It forces the interlocutor to produce their identifying assumptions.

  ### 3. The Ontological Excess Thesis (The Metaphysical Claim)
  *   **Claim:** Causal relations involve "production," "powers," or "mechanisms" that cannot be fully reduced to counterfactual dependencies or interventionist probabilities.
  *   **Meaning:** Even if we know $P(Y|do(X))$, we haven't captured what causation *is* in the world (e.g., the transfer of energy, the necessity of the connection).
  *   **Verdict:** **Contested (Metaphysically Substantive).**
  *   **Analysis:** This is a realist objection to Humean/Functionalist accounts. Lewis tries to reduce causation to counterfactuals (which supervene on the Humean mosaic). Pearl treats causation as a vocabulary for reasoning about interventions. Both are arguably anti-realist about "causal oomph." This reading claims there is a remainder that math leaves out.
  *   **Dialectical Utility:** Variable. It shifts the debate from statistics to metaphysics. Useful if you are arguing about the nature of reality; distracting if you are arguing about policy or inference.

  ### 4. The Actual Causation Distinction (The Technical Claim)
  *   **Claim:** Type-level causal effects (average treatment effects) do not capture token-level actual causation (specific instances).
  *   **Meaning:** Knowing that smoking causes cancer ($do(Smoke) \uparrow Cancer$) does not tell us if *this specific person's* cancer was caused by smoking (preemption/overdetermination problems).
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** Pearl's *do*-calculus primarily handles type causation. Lewis struggled with preemption. Halpern and Pearl later developed specific definitions for "Actual Causation" using structural equations, but it remains distinct from standard causal effect estimation.
  *   **Dialectical Utility:** High, but specific. It matters in law and history, less so in epidemiology.

  ---

  ### The Specific Case: Rejecting the *do*-operator

  You asked: *If someone wields "correlation is not causation" to reject the idea that a properly specified do-operator makes correlation enough for causation, which reading are they invoking?*

  They are invoking **Reading 3 (The Ontological Excess Thesis)**, potentially masked as Reading 2.

  Here is the breakdown of that move:

  **1. The Interventionist Position:**
  For Pearl, causation *just is* the behavior of the system under intervention. If you have the correct SCM and you calculate $P(Y|do(X))$, you have exhausted the scientific meaning of "X causes Y." There is no "causation" left over in the world that the *do*-operator fails to capture. Causation is defined by the truncation of the probability distribution.

  **2. The Critic's Move:**
  When they say "But correlation [even under do] is not causation," they are asserting that the interventionist definition is *incomplete*. They are claiming that $P(Y|do(X))$ captures *predictive reliability under manipulation*, but not *causal production*.

  **3. Is the Dismissal Supported?**
  *   **Internally (within Interventionism):** No. It is false by the framework's own definitions. If you accept the SCM framework, $do(X)$ *defines* the causal effect. To reject it is to reject the framework, not to find a bug within it.
  *   **Externally (Metaphysically):** It depends. If you are a Causal Powers Realist (e.g., Cartwright, Mumford), then yes, the *do*-operator is just a statistical shadow of the real causal mechanisms.

  **4. Is it Smuggling?**
  **Yes.** It is smuggling in a demand for **Causal Realism** into a **Causal Functionalist** debate.

  The interventionist framework explicitly rejects the idea that causation is a "glue" in the world. It treats causation as a relationship between variables that licenses specific inferences (predictions under intervention). When the critic says the *do*-operator isn't "enough," they are usually implying:
  *   *"You haven't explained **why** the intervention works."* (Mechanism)
  *   *"You haven't proven the connection is **necessary**."* (Modality)
  *   *"You haven't located the **energy transfer**."* (Process)

  Interventionism replies: *"We don't need to. Science is about control and prediction, not metaphysical grounding."*

  ### Summary for Your Threads

  If you want to cut through the noise, stop them from using the slogan and force them to pick a lane:

  1.  **If they mean "Observational data isn't enough":** Agree with them. Cite the Identification Thesis. Ask for their identifying assumptions.
  2.  **If they mean "The do-operator doesn't capture real mechanisms":** Call it out. Tell them they are arguing for **Causal Realism** against **Causal Functionalism**. Acknowledge that Pearl's framework brackets ontology by design. If they want mechanisms, they need process tracing, not just causal graphs.
  3.  **If they mean "Actual causation is different from average effects":** Concede the point. Distinguish *Type Causation* (ACE) from *Token Causation* (Actual Cause).

  **The Bottom Line:**
  The phrase is usually a **category error** in these debates. It treats "causation" as a single natural kind that the math is failing to capture, whereas Pearl argues "causation" is a label for a specific type of inferential relationship. When they use it to dismiss the *do*-operator, they are effectively saying, *"Your math doesn't solve my metaphysical anxiety about necessity."* That is a valid philosophical worry, but it is not a statistical objection.
