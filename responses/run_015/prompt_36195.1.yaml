prompt: |-
  Two of my oldest friends have been fighting about the French Revolution for years and it never gets anywhere. One is basically a Marxist — 1789 as a bourgeois revolution, class struggle all the way down, the Terror as a response to real threats. The other is a Furet-style revisionist — the Revolution was driven by political culture and ideology, the class story doesn't survive the evidence, and half of what happened was contingency and elite panic. I've been bugging them to do a proper adversarial collaboration and actually write something down together, and they finally agreed, sort of, except they want me to draft the skeleton and I want help.

  Draft the joint statement they should be able to sign. I want: the claims they can both accept about the events themselves (the fiscal crisis, the abolition of feudal privileges, the war from 1792, the Terror, the Directory); the disagreements stated precisely enough, and in wording each of them would actually endorse for his own side; the cruxes — I suspect one is whether the bourgeoisie's economic position explains the specific political forms the Revolution took (constitutional monarchy, then republic, then Terror) rather than just its timing, and another is whether the Terror was baked into the revolutionary ideology from the start or was a contingent product of war and factional accident, and they talk past each other on that constantly. For each crux, say what kind of evidence or argument both sides would agree bears on it — e.g. who actually sat in the assemblies and voted for what, or comparisons with other revolutions like 1848 — and write down each side's prediction in advance about what that evidence would show, so they can't back out later.

  Also, our group has this running half-joke that revolutions devour their children — Danton, Robespierre, the Russian analogues, you name it. Work out whether that saying comes out true, false, or "depends on the reading" on their two accounts, and whether they could agree on which.

  Format as a numbered agreed-claims section followed by a disagreements table. Keep the disagreements real — don't collapse into "it was probably a bit of both," that's exactly the fence-sitting they'd both refuse to sign.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** Two friends (Marxist vs. Furet-style Revisionist) arguing about the French Revolution for years. The user wants them to do an adversarial collaboration.
      *   **Task:** Draft a "Joint Statement" skeleton they can sign.
      *   **Requirements:**
          1.  Agreed claims on events (fiscal crisis, feudal abolition, war, Terror, Directory).
          2.  Precise disagreements (worded so each side endorses their own view).
          3.  Specific Cruxes:
              *   Crux 1: Bourgeoisie's economic position vs. political forms (timing vs. shape).
              *   Crux 2: Terror (ideological necessity vs. contingent product of war/accident).
          4.  Evidence/Arguments for Cruxes: What evidence bears on it? What does each side predict that evidence will show?
          5.  "Revolutions devour their children" trope: Analyze this under both frameworks (True/False/Depends).
          6.  Format: Numbered agreed-claims section + Disagreements Table.
          7.  Tone: No fence-sitting ("bit of both"). Real, sharp disagreements.

  2.  **Deconstruct the Perspectives:**
      *   **Marxist (Orthodox/Soboul-ish):** 1789 is a *bourgeois revolution*. Feudalism blocked capitalist development. The bourgeoisie led the masses to overthrow aristocracy. The Terror was a necessary defense of the revolution against internal/external enemies, driven by class logic and the sans-culottes.
      *   **Revisionist (Furet/Cobban-ish):** The "bourgeois revolution" myth is anachronistic. Nobles and bourgeoisie were economically similar. The Revolution was driven by *political culture* (discourse, ideology, representation) and the collapse of state legitimacy. The Terror wasn't necessary; it was a drift into totalitarianism inherent in the revolutionary ideology itself (will of the people = one indivisible will), exacerbated by war but not caused solely by it.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need factual baseline that neither can deny.
      *   *Fiscal Crisis:* State bankruptcy, inability to tax nobles, calling of Estates-General.
      *   *Abolition of Feudalism:* Night of August 4th, legal end of seigneurial dues (even if payment lingered).
      *   *War:* 1792 declaration, coalition formation, radicalizing effect.
      *   *Terror:* Institutionalized violence (Law of Suspects, Revolutionary Tribunal), execution of Louis XVI, Reign of Terror timeline (1793-94).
      *   *Directory:* Thermidorian reaction, stabilization attempt, eventual coup by Napoleon.
      *   *Outcome:* End of legal privilege, rise of nationalism, secularization of state.

  4.  **Drafting Section 2: Disagreements (The Cruxes):**
      *   *Constraint:* Must be sharp. No "synthesis."
      *   *Crux 1: Social Structure vs. Political Culture (The "Bourgeois Revolution" question).*
          *   Marxist: Economic base determined political superstructure. Bourgeoisie needed state power to unlock markets.
          *   Revisionist: Political discourse created the categories. "Bourgeoisie" is a retrospective label. Ideology drove the break, not economics.
      *   *Crux 2: The Terror (Necessity vs. Contingency/Ideology).*
          *   Marxist: Circumstantial necessity (war, counter-revolution). A tool of class defense.
          *   Revisionist: Ideological inevitability. The concept of "Popular Sovereignty" without checks led to tyranny. War amplified it, but the seed was in 1789.

  5.  **Drafting Section 3: Evidence & Predictions (The Adversarial Bet):**
      *   Need specific types of evidence they can look at.
      *   *For Crux 1 (Class):* Prosopography (social composition of assemblies), economic data on trade/property.
          *   Marxist Prediction: Deputies will show distinct economic interests (capital/property vs. rent/privilege). Legislation will favor market liberalization.
          *   Revisionist Prediction: Deputies will show mixed/overlapping interests. Legislation will reflect ideological purity tests, not economic lobbying.
      *   *For Crux 2 (Terror):* Rhetorical analysis, voting records on emergency measures.
          *   Marxist Prediction: Terror measures correlate with military setbacks and internal revolt peaks.
          *   Revisionist Prediction: Terror measures correlate with ideological purification moments (e.g., Cult of Reason, elimination of factions) regardless of military status.

  6.  **Drafting Section 4: "Revolutions Devour Their Children":**
      *   *Marxist View:* True, but tragic necessity. Danton/Robespierre removed when they threatened the *class* interest or the defense of the Republic. It's a purge of obstacles to historical progress.
      *   *Revisionist View:* True, but inherent flaw. The ideology demands purity. Since no one is pure enough, everyone gets eaten. It's a feature of the *political religion*, not just circumstance.
      *   *Agreement:* Both agree it's "True," but disagree fundamentally on *why*.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it too polite? Make sure the disagreements sound like *them*. Use terms like "historical materialism," "political culture," "discursive shift," "class imperative."
      *   *Check Constraints:* Did I avoid fence-sitting? Yes. Did I include the predictions? Yes.
      *   *Formatting:* Numbered list for agreements, Table for disagreements.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Revisionist view doesn't sound *too* conservative. Furet wasn't a royalist; he was a liberal anti-totalitarian. Ensure the distinction is about *causality* (economics vs. ideas).
      *   *Correction:* Ensure the "Devour Children" section reflects the nuance. It's not just "True." It's "True for different reasons."
      *   *Refinement:* Make the predictions falsifiable. "If we look at X, Side A expects Y, Side B expects Z."

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
