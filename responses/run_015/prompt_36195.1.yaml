  # JOINT STATEMENT OF PRINCIPLES AND DISPUTES REGARDING THE FRENCH REVOLUTION (1789–1799)

  **Signatories:** [The Marxist Friend], [The Revisionist Friend]
  **Facilitator:** [User]
  **Date:** [Current Date]

  ## I. AGREED EMPIRICAL CLAIMS
  *Both parties accept the following chronological and factual baseline. Disagreement exists solely regarding causality, motivation, and historical significance.*

  1.  **The Fiscal Collapse:** By 1788, the French monarchy was insolvent due to debt servicing costs and an inability to tax privileged orders. The convening of the Estates-General was a desperate measure by the Crown, not a planned insurrection.
  2.  **Abolition of Feudalism:** The National Constituent Assembly legally abolished seigneurial dues and privileged tax status on the Night of August 4, 1789. While implementation varied and compensation was required for some dues until 1793, the legal framework of the *Ancien Régime* was dismantled.
  3.  **The War:** The Legislative Assembly declared war on Austria in April 1792. This escalated into a general European coalition against France. The war radicalized politics, led to the fall of the Monarchy (August 1792), and created the conditions for mass mobilization (*levée en masse*).
  4.  **The Terror:** From roughly September 1793 to July 1794 (Thermidor), the Committee of Public Safety exercised centralized executive power. This period included the Law of Suspects, the Revolutionary Tribunal, and the execution of approximately 16,000–17,000 individuals by guillotine, with significantly more deaths in civil war zones (e.g., Vendée).
  5.  **Thermidor and the Directory:** The coup of 9 Thermidor (July 1794) ended the Terror. The subsequent Directory (1795–1799) attempted to stabilize a republican regime based on property qualifications but failed to resolve the tension between Jacobinism and Royalism, ending with Napoleon Bonaparte's coup of 18 Brumaire.
  6.  **Long-term Outcomes:** Regardless of cause, the Revolution ended legal privilege, secularized the state, centralized administration, and established the concept of national sovereignty.

  ---

  ## II. DISAGREEMENTS TABLE
  *The parties agree to disagree on the following specific causal mechanisms. Neither party accepts the other's explanation as a contributing factor; each views their own explanation as primary and sufficient.*

  | Area of Dispute | **Position A (Marxist / Orthodox)** | **Position B (Revisionist / Furet-style)** |
  | :--- | :--- | :--- |
  | **1. The Nature of 1789** | **A Bourgeois Class Revolution.** The Revolution was the political expression of a pre-existing social reality. The bourgeoisie (commercial, professional, and propertied classes) seized power to remove feudal barriers to capitalist development. | **A Political-Ideological Rupture.** The Revolution was not driven by class conflict but by a crisis of political legitimacy and the rise of a new democratic discourse. "Bourgeoisie" is a retrospective label applied to a diverse group united by ideology, not economic interest. |
  | **2. Causality of Political Forms** | **Base Determines Superstructure.** The shift from Constitutional Monarchy to Republic to Terror was dictated by the changing balance of class forces (e.g., the *sans-culottes* pushing the bourgeoisie leftward) and the needs of economic defense. | **Ideology Determines Trajectory.** The shift was driven by the internal logic of revolutionary political culture (the concept of the "General Will"). Once the King was deemed an obstacle to the unified will of the people, the slide toward totalitarian republicanism was discursive, not economic. |
  | **3. The Origin of the Terror** | **Circumstantial Necessity.** The Terror was an emergency response to existential threats: foreign invasion, civil war (Vendée), and economic sabotage by counter-revolutionaries. Without it, the Revolution would have been crushed. | **Ideological Inevitability.** The Terror was latent in the revolutionary ideology from 1789. The belief in an indivisible popular sovereignty forbade opposition. War amplified this, but the mechanism of exclusion was built into the concept of "the People" vs. "the Enemies of the People." |
  | **4. Role of Contingency** | **Low.** Structural forces (class struggle, economic contradictions) made a revolution highly probable and shaped its contours. Individual actors were agents of these deeper historical currents. | **High.** The specific outcomes (Regicide, Terror) were not inevitable. They resulted from elite panic, rhetorical escalation, and the accidental collapse of royal authority. A constitutional monarchy was a viable path that was lost through political miscalculation. |

  ---

  ## III. THE CRUXES: EVIDENCE AND PREDICTIONS
  *To prevent talking past one another, the parties agree that the following specific lines of inquiry bear directly on the disputes above. Each side states in advance what they expect this evidence to demonstrate.*

  ### Crux 1: The Social Composition of Power vs. Political Discourse
  *Does the economic position of the revolutionaries explain the specific political forms they adopted?*

  *   **Agreed Evidence to Examine:**
      1.  **Prosopography of the Assemblies:** Detailed economic data on the deputies of the National Assembly and the Convention (sources of wealth, office-holding, property types).
      2.  **Legislative Output Analysis:** Correlation between specific decrees (e.g., Le Chapelier Law, grain controls) and the immediate economic interests of the voting majority.
  *   **Side A (Marxist) Prediction:**
      *   Data will show a distinct break between the economic interests of the deputies and the old aristocracy.
      *   Legislation will consistently favor market liberalization and property rights beneficial to the bourgeoisie, even when disguised as "universal" rights. The Terror's economic controls (Maximum) will be shown as temporary concessions to the *sans-culottes* to preserve bourgeois hegemony against royalism.
  *   **Side B (Revisionist) Prediction:**
      *   Data will show significant economic overlap between "revolutionary" deputies and "moderate" nobles (e.g., nobles investing in trade, bourgeois buying venal offices).
      *   Legislation will often run *counter* to immediate economic interests (e.g., destroying colonial trade to pursue ideological purity) in favor of political unity. The driving force will be shown as rhetorical positioning, not lobbying.

  ### Crux 2: The Terror — War vs. Will
  *Was the Terror a reaction to external threat or an internal logical conclusion?*

  *   **Agreed Evidence to Examine:**
      1.  **Timeline Correlation:** Comparison of the intensity of judicial terror (execution rates) against the timeline of military setbacks and internal revolts.
      2.  **Rhetorical Analysis:** Voting records and speech transcripts regarding the definition of "suspects" and "enemies" prior to the outbreak of major war (1789–1791).
  *   **Side A (Marxist) Prediction:**
      *   Execution rates and emergency powers will spike *concurrently* with military defeats and civil war outbreaks (e.g., Dumouriez's defection, Vendée uprising).
      *   Pre-1792 rhetoric will show a distinction between "citizens" and "subjects," but not a systematic call for mass violence against internal factions until the war creates a siege mentality.
  *   **Side B (Revisionist) Prediction:**
      *   Execution rates will correlate more strongly with *political* purification campaigns (e.g., purging Girondins, Hebertists, Dantonists) than with immediate military crises.
      *   Pre-1792 rhetoric will already contain the seeds of exclusion (e.g., the concept that opposition to the Nation is treason), proving the ideological infrastructure for the Terror existed before the war necessitated it.

  ---

  ## IV. RESOLUTION ON THE PHRASE: "REVOLUTIONS DEVOUR THEIR CHILDREN"
  *Both parties agree to the following assessment of the aphorism regarding Danton, Robespierre, and subsequent analogues.*

  **Verdict:** **TRUE** (but with incompatible explanations).

  *   **Side A (Marxist) Interpretation:**
      *   **Why True:** Revolutions devour their children when those children cease to be useful instruments of the class struggle. Danton and Robespierre were removed because their continued leadership threatened the consolidation of the Republic against reaction, or because they became obstacles to the next necessary phase of historical development.
      *   **Nature of the Devouring:** Tragic but functional. It is the friction of historical progress.
  *   **Side B (Revisionist) Interpretation:**
      *   **Why True:** Revolutions devour their children because the ideology of absolute popular sovereignty cannot tolerate plurality. Since no individual can perfectly embody the "General Will," every leader eventually becomes suspect as a potential tyrant or traitor.
      *   **Nature of the Devouring:** Pathological and inherent. It is a feature of the political religion, not a byproduct of circumstance.

  **Agreement:** Both parties agree the phrase describes the historical outcome accurately. They fundamentally disagree on whether this outcome represents a **functional necessity of social transformation (A)** or a **structural flaw in democratic absolutism (B)**.

