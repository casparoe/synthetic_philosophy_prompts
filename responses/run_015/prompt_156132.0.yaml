      *   The "Time is Space" analogy is famously associated with Henry Sidgwick and Derek Parfit.
      *   The Ramsey Equation is central: $r = \rho + \eta g$. The fight is indeed over $\rho$ (pure time preference).
      *   The user's friend is right: The analogy is double-edged. If spatial discounting is permissible, temporal might be too.
      *   The "Probability of Non-Arrival" point is crucial. In CBA, the "discount rate" often conflates pure time preference with extinction risk.
      *   The "No Reciprocity" point relates to the justification for investment vs. consumption.

  3.  **Drafting the Correspondence Table:**

      *   *Spatial Distance* $\leftrightarrow$ *Temporal Distance*.
      *   *Foreigner/Stranger* $\leftrightarrow$ *Future Person*.
      *   *Transport Cost/Trade Barrier* $\leftrightarrow$ *Investment Technology/Extinction Risk*.
