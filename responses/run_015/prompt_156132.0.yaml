      *   **Core Argument:** The user has been using the "Time is Space" analogy to argue for $\rho = 0$ (zero pure time preference). The logic: Spatial distance doesn't reduce moral weight, so temporal distance shouldn't either.
      *   **The Pushback:** A friend pointed out that people *do* accept spatial partiality (caring more about locals), so the analogy might license temporal discounting instead of forbidding it. Or, it only works if you already assume strong impartiality.
