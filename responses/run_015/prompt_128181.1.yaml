  ### The Leaves
  *Each leaf includes the "awkward commitment" required by that classification.*

  **Leaf 1: Routine Call.** (Q1=Y, Q2=Y, Q3=Y, Q4=Y)
  *   **Diagnosis:** Nothing special is going on; this is ordinary decision-making under certainty.
  *   **Awkward Commitment:** You must admit you rarely need deep philosophy to buy a toaster or pick a restaurant.

  **Leaf 2: Ordinary Uncertainty.** (Q1=Y, Q2=Y, Q3=Y, Q4=N)
  *   **Diagnosis:** Nothing special is going on; this is ordinary decision-making under uncertainty, go get evidence and compute.
  *   **Awkward Commitment:** You must accept that more research can eventually solve this, even if it feels scary.

  **Leaf 3: Fixable Specialness.** (Q1=Y, Q2=Y, Q3=N, Q5=Y, Q6=Y)
  *   **Diagnosis:** The specialness is real but cheaply fixable, so run the experiment.
  *   **Awkward Commitment:** You must commit to treating your future changed self as a collaborator rather than a stranger.

  **Leaf 4: Nostalgic Trap.** (Q1=Y/N, Q2=Y/N, Q3=N, Q5=Y, Q6=N)
  *   **Diagnosis:** You will understand what you lost, but you cannot return to it.
  *   **Awkward Commitment:** You must accept that grief for your old self is rational even if the change was worth it.

  **Leaf 5: The Leap.** (Q1=N, Q3=N, Q5=N, Q7=Y, Q8=Y)
  *   **Diagnosis:** The case where the only thing left to go on is whether you want to find out who you'd turn into.
  *   **Awkward Commitment:** You must admit you are choosing blindly, with no reason to expect the blind choice will be good.

  **Leaf 6: Value Drift.** (Q1=N, Q3=N, Q5=N, Q7=Y, Q8=N)
  *   **Diagnosis:** You will change without a fight, simply because the evidence pushed you.
  *   **Awkward Commitment:** You must accept that "who you are" is fragile and updates whenever the data does.

  **Leaf 7: External Compulsion.** (Q7=N, Q9=Forced)
  *   **Diagnosis:** The case where the choice isn't really a choice so the decision theory is idle.
  *   **Awkward Commitment:** You must stop asking "should I?" and start asking "how do I survive this?"

  **Leaf 8: The Black Box.** (Q7=N, Q9=Up to you)
  *   **Diagnosis:** A nasty one where even asking whether it was worth it for me has no determinate answer.
  *   **Awkward Commitment:** You must accept that you will never know if this was a mistake, even from the inside.

