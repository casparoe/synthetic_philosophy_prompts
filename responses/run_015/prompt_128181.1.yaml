  # The Sorting Instrument

  ### The Questions
  *Wire these up in order. Follow the "Yes/No" paths to the Leaves.*

  **Q1.** Can you try a small version of this (a weekend, a low dose, a trial period) that shows you what the full version feels like?
  *   **Yes** → Go to Q2.
  *   **No** → Go to Q3.

  **Q2.** If you try that small version, can you walk away afterwards without having changed who you are?
  *   **Yes** → Go to Q3.
  *   **No** → Go to Q9 (Leaf 9).

  **Q3.** After you've done this for a while (the full version), will the things you care about most still be the same things you care about now?
  *   **Yes** → Go to Q4.
  *   **No** → Go to Q5.

  **Q4.** Do you already know enough to make a confident guess about how the outcome will turn out?
  *   **Yes** → **Leaf 1**.
  *   **No** → **Leaf 2**.

  **Q5.** If your cares change, will you still be able to understand why your old self wanted what they wanted?
  *   **Yes** → Go to Q6.
  *   **No** → Go to Q7.

  **Q6.** If you decide halfway through that this was a mistake, can you go back to being the person you were before?
  *   **Yes** → **Leaf 3**.
  *   **No** → **Leaf 4**.

  **Q7.** If you decide halfway through that this was a mistake, can you go back to being the person you were before?
  *   **Yes** → Go to Q8.
  *   **No** → Go to Q9 (Leaf 8).

  **Q8.** Does choosing this require you to act against your best guess about how things will turn out?
  *   **Yes** → **Leaf 5**.
  *   **No** → **Leaf 6**.

  **Q9.** (Reached via Q2=No or Q7=No) Is there anyone else forcing you to make this choice, or is it up to you?
  *   **Forced** → **Leaf 7**.
  *   **Up to you** → **Leaf 8** (if from Q7) or **Leaf 9** (if from Q2).
      *(Note: To simplify the wiring, Q2=No leads directly to Leaf 9. Q7=No leads to Q9, which splits to Leaf 7 or Leaf 8.)*

