  *   **Starting HRT:** Can't fully sample (Q1=N), values change (Q3=N), can't understand old self (Q5=N), can't go back fully (Q7=N), Up to you (Q9=You).
  *   **Cochlear implant (deaf adult):** Can't sample (Q1=N), values change (Q3=N), can't understand old self (Q5=N), can't go back (Q7=N), Up to you (Q9=You).
      *   *Flag:* Parenting, HRT, and Cochlear implants all land here. This flattens the distinction between social transformation (parenting) and physiological transformation (HRT/Implant). The tree treats them identically because both block retrieval of the old self and block reversal.

  **Leaf 9 (Costly Sampling - Unoccupied):**
  *   **Taking a psychedelic:** (Theoretically lands here if Q1=Y but Q2=No).
