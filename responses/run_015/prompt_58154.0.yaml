              *   *Nuance:* In a 2nd-year class, the standard answer is usually: (i) is wrong under strict assumptions (needs incomplete info), (ii) is the standard defense of Subgame Perfection (sequential rationality holds regardless of how you got there), *but* the paradox arises precisely because maintaining CKR after a violation is cognitively difficult.
