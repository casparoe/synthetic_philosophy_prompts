      *   **Part (b) Paradox:**
          *   *Inefficiency:* (3,1) is Pareto dominated by later outcomes (e.g., 7,5). BI leads to inefficient outcomes.
          *   *Off-equilibrium beliefs/Inference:* If P1 Passes at 1, standard BI/Common Knowledge of Rationality (CKR) breaks down. Why? If P1 is rational, they shouldn't Pass. If they Pass, are they irrational? Altruistic? If P2 thinks P1 is irrational/cooperative, P2 might Pass at 2. This is the "forward induction" or "reputation" issue.
