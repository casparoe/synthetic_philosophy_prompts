answer: |-
  Here is the full spec for an adequate theory of moral aggregation in rescue cases, stripped of the usual academic padding.

  ### I. The Spec: Desiderata for an Adequate Theory

  An adequate theory cannot just say "save the most." It must function as a decision procedure that respects both rationality and moral constraints.

  #### 1. The Cases It Must Handle
  *   **The Standard Rescue (5 vs. 1):** Five strangers will die on one rock, one on another. You can only save one group.
      *   *Requirement:* **Number Sensitivity.** The theory must explain why the five matter more than the one, or why they don't, without arbitrariness.
  *   **The Partiality Case (Kin vs. Strangers):** You can save your child (1) or five strangers.
      *   *Requirement:* **Agent-Relative Permissions.** The theory must allow for special obligations without collapsing into total selfishness or demanding total self-sacrifice.
  *   **The Escape Hatch (Aggregation as Harm):** Saving the five requires you to *actively destroy* the one survivor's only escape route (killing them), rather than just failing to reach them.
      *   *Requirement:* **The Doing/Allowing Constraint.** The theory must distinguish between letting someone die (omission) and killing them to save others (commission). Aggregation cannot justify active instrumentalization.

  #### 2. The Distinctions It Cannot Collapse
  *   **Statistical vs. Identified Lives:**
      *   *Requirement:* **Claim-Relativity.** A theory must treat the specific claim of the person in front of you as weightier than a abstract statistical probability, otherwise it justifies sacrificing identified individuals for vague greater goods.
  *   **Failing to Save vs. Actively Harming:**
      *   *Requirement:* **Moral Asymmetry.** There is a higher threshold to justify active harm (killing the 1) than passive loss (letting the 1 die). A theory that treats these as identical fails the "Escape Hatch" test.
  *   **Individual vs. Collective:**
      *   *Requirement:* **Separateness of Persons.** You cannot treat the five as a single vessel of "5 units of life." They are five distinct claims. A theory must respect that losing one life is a total loss for that person, not a fractional loss for a group.

  #### 3. Decision Theory Constraints vs. Utilitarian Prejudices
  *   **Must Stay Consistent With (Rationality Axioms):**
      *   **Transitivity:** If you prefer A to B, and B to C, you must prefer A to C. (If you save 1 over 0, and 2 over 1, you must save 2 over 0).
      *   **Independence of Irrelevant Alternatives (IIA):** Adding a third, unchoosable option shouldn't change your preference between the original two. (e.g., The presence of a drowning cat shouldn't change whether you save the 1 or the 5).
      *   **Why:** Without these, the theory is not action-guiding. It produces cycles or context-dependent contradictions, rendering it useless for decision-making.
  *   **Utilitarian Prejudices (Not Strict Requirements):**
      *   **Maximization of Expected Utility:** This is a normative goal, not a logical necessity. You can be rational without being a maximizer (e.g., a satisficer).
      *   **Continuity:** The idea that any small probability of a great good outweighs a certainty of a small good. In rescue, this is often morally repugnant (you shouldn't gamble a sure life for a 1% chance at five).
      *   **Why:** These are specific to consequentialist frameworks. A deontological or contractualist theory can be rational without accepting that "more good always trumps less constraint."

  ---

  ### II. The Killer Requirement

  **The Single Requirement That Knocks Out the Most Popular Theories:**
  **The Constraint Against Active Instrumentalization (The Escape Hatch Test).**

  *   **Why:** This eliminates **Act Utilitarianism**, which is the default "popular" framework for policy and ethics. Utilitarianism dictates that if destroying the escape hatch saves five, you must do it, because 5 > 1. It collapses the distinction between killing and letting die.
  *   **Impact:** It also pressures **Weighted Aggregation** views. If numbers count, at what point does the weight of the many justify *actively killing* the one? If the answer is "never," you aren't really aggregating in the hard cases. If the answer is "always," you are a utilitarian. Most moderate theories crumble here.

  ---

  ### III. The Jointly Unsatisfiable Pair

  **Your Hunch Is Correct:**
  **"Equal Weight for Each Person"** and **"Aggregate Weights Linearly"** are jointly unsatisfiable in hard rescue cases.

  *   **The Contradiction:**
      *   **Equal Weight:** Implies that each person's claim to be saved is inviolable or at least comparable on a 1:1 basis. If claims are equal, the 1 person has a valid claim that cannot be simply "outnumbered" without remainder.
      *   **Linear Aggregation:** Implies that 5 claims = 5x the moral force of 1 claim.
      *   **The Clash:** If you aggregate linearly, the 1 person's claim is *overwhelmed*, rendering their "equal weight" meaningless in practice. If you respect their equal weight as a right to a fair chance (e.g., a lottery), you violate linear aggregation (because the 5 should mathematically dominate).
  *   **The Impossibility:** You cannot give the single person an equal *chance* (50%) while also respecting the linear *sum* of the five (which demands 100% focus). This is a formal impossibility theorem in moral aggregation (similar to Arrow's Impossibility Theorem in social choice).

  ---

  ### IV. The Scorecard

  Here is how the three major views score against the spec.
  *(Scale: Pass = Consistent; Fail = Violates Constraint; Strain = Requires Ad-Hoc Fixes)*

  | Requirement | **Taurek (Anti-Aggregation)** | **Straight Utilitarianism** | **Flip a Coin (Equal Chance)** |
  | :--- | :--- | :--- | :--- |
  | **Standard Rescue (5 vs 1)** | **Fail.** Insists on 50/50 chance despite numbers. Violates Number Sensitivity. | **Pass.** Saves the five. | **Fail.** Ignores the numbers completely. |
  | **Escape Hatch (Active Harm)** | **Pass.** Refuses to kill the one to save the five. | **Fail.** Mandates killing the one if it saves the five. | **Pass.** Would likely refuse active harm (rights-based). |
  | **Separateness of Persons** | **Pass.** Treats individuals as distinct; no summing. | **Fail.** Treats people as vessels for utility sum. | **Pass.** Respects individual claims equally. |
  | **Rational Consistency (IIA/Transitivity)** | **Fail.** Leads to intransitivity in multi-option cases (e.g., 1 vs 1, 2 vs 1, 2 vs 2). | **Pass.** Fully consistent with decision theory axioms. | **Fail.** Violates IIA when options expand (e.g., adding a 3rd group changes odds unfairly). |
  | **Agent-Relative Permissions** | **Strain.** Hard to justify saving kin without aggregating. | **Fail.** Demands impartiality; saving kin is often forbidden. | **Strain.** Hard to formalize partiality within a fair coin flip. |
  | **Overall Viability** | **Low.** Morally intuitive on constraints, but irrational as a decision procedure. | **Medium.** Rational and decisive, but morally repugnant on constraints. | **Low.** Fair in simple cases, breaks down in complex/active harm cases. |

  **Summary:**
  *   **Taurek** protects the individual but breaks rational choice.
  *   **Utilitarianism** is rational but breaks moral constraints.
  *   **Coin Flip** is fair but ignores numbers and breaks rational choice.

  **Verdict:** No existing theory passes the full spec. The "Escape Hatch" constraint kills Utilitarianism; the "Rational Consistency" constraint kills Taurek and Coin-Flip views. Your hunch about the impossibility of Equal Weight + Linear Aggregation is the reason why.
