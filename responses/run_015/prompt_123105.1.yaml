answer: |-
  Hi there, it sounds like your reading group has hit the exact wall everyone hits when they move from the textbook statement of the second law to the metaphysical heavy lifting people try to make it do, and the frustration you are feeling is justified because that slogan is actually a placeholder for a cluster of distinct claims that rarely survive contact with each other. To give you the menu you asked for, we first need to separate out what your housemate means by the arrow itself, which oscillates between three candidates: the entropy gradient itself, meaning the mere fact that entropy is higher at one end than the other; the low-entropy boundary condition, often called the Past Hypothesis, which posits a specific state at the beginning of the universe; or the direction in which entropy happens to increase, which treats the arrow as a vector assigned to the temporal dimension. You also need to track whether the claim is being made as a statistical truth, which allows for fluctuations and exceptions, or as a nomological one, which treats the increase as a law of nature that cannot be violated, and this distinction is where your housemate is likely smuggling in extra force when he talks about impossibility. If the claim is statistical, a decrease in entropy is merely improbable, but if it is nomological, it is impossible, and most philosophers of physics agree the second law is statistical while your housemate seems to be leaning on the nomological reading to shut down your questions about coherence.

  When we look at the bare distinction between past and future itself, identifying the arrow with the entropy gradient yields a substantive and defensible thesis, but it runs into trouble with your Janus universe test case where entropy is minimum at a middle time and increases toward both ends. If the arrow is just the gradient, that universe contains two arrows of time pointing away from the center, and the two families of observers would agree on the physical facts but disagree on which direction is the future if they define future by increasing entropy, though they would likely agree to call the low-entropy center the past. If the arrow is identified with the boundary condition instead, there is only one arrow source but two directions of flow, which collapses the reading into something more about cosmology than thermodynamics, and if the arrow is the vector of increase, the Janus case exposes that there is no single global arrow but two local ones. Your housemate was probably helping himself to the boundary condition reading in his first use when he said the puzzling thing is the low-entropy early universe, because that claim is not built into the slogan about entropy increasing but is a separate thesis about initial conditions that travels with it, and this reading is statistical regarding the increase but nomological regarding the boundary condition in some formulations.

  Moving to the asymmetry of records, which is where your housemate tried to shut down your question about deliberation, the thesis is that we have records of the past and not the future because records are physical traces created by entropy-increasing processes. This reading is substantive and defensible, championed by people like Albert and Loewer, and it treats the entropy claim as statistical because records can theoretically form in reverse but are overwhelmingly unlikely to do so. In the Janus universe, observers on both sides would have records of the low-entropy center, meaning they both remember the middle as their past, so they would not disagree about which way time points locally even though their arrows point in opposite global directions. Your housemate was definitely using this reading in his second use when he said it is records all the way down, implying that the epistemic asymmetry explains the deliberative asymmetry, but this relies on the statistical reading because if it were nomological, records of the future would be impossible rather than just improbable, and he needs the statistical reading to allow for the physical possibility of the records existing at all.

  When we consider causal asymmetry and counterfactual dependence, the claim is that causes precede effects because entropy increases in that direction, which grounds the asymmetry of counterfactuals where the future depends on the present but the past does not. This is a substantive and controversial thesis, often associated with Lewis, and it requires the statistical reading because causal chains can theoretically run backwards in a fluctuation, even if they never do in practice. In the Janus test case, causation would radiate away from the center on both sides, meaning observers on both sides would see themselves as causes of future events away from the center, so there are two causal arrows and no disagreement about local directionality. This reading is distinct from the bare gradient because it adds a layer of metaphysical dependence, and while your housemate did not explicitly mention causation, his reduction of deliberation to records presupposes this causal structure because deliberation assumes our actions cause future states, so he is implicitly relying on this combination to make his case that the future is not open in a metaphysical sense.

  The question of whether the future is open in deliberation is the hardest one, and your housemate's claim that this is just a fact about records is a reductionist thesis that is substantive but likely false because it ignores the normative aspect of deliberation. If the arrow is the entropy gradient, the openness of the future is an illusion generated by our lack of records, which is defensible but unsatisfying, and it must be statistical because if it were nomological, the future would be fixed by law rather than probability. In the Janus universe, observers on both sides would deliberate away from the center, believing the future is open in that direction, so there are two zones of deliberation and no disagreement about which way they are facing, but this exposes that the reading is not really about entropy alone but about the epistemic access entropy grants. Your housemate was using this reading in his second use as well, trying to collapse the deliberative asymmetry into the entropic asymmetry, but he fails to address why we feel normatively bound to the future rather than just ignorant of it, which is a gap the entropy story does not fill.

  Regarding the felt passage or flow of time, identifying the arrow with entropy is almost universally regarded as false or a category mistake because phenomenological flow does not reduce to thermodynamic gradients. Nobody really defends this reading seriously, and in the Janus universe, both sets of observers would feel time flowing away from the center, suggesting the flow is aligned with the entropy increase but not explained by it. This reading is usually statistical because the feeling of flow is continuous, but the entropy increase is probabilistic, and the mismatch suggests the entropy claim cannot do the work here. Your housemate did not explicitly invoke flow, but when he says you cannot unscramble an egg in a folksy way, he is gesturing at this phenomenological impossibility, which trades on the intuition that the flow of time prevents unscrambling rather than the statistical improbability of it.

  Your housemate's third use, where he suggests decreasing entropy is impossible or incoherent rather than improbable, is where he slips from the statistical reading to the nomological reading, and this claim is false according to standard physics. If the entropy claim is nomological, the Janus universe is impossible because entropy cannot decrease toward the center from either side, but if it is statistical, the Janus universe is possible though unlikely, and the observers could exist. He was helping himself to the nomological reading here to close off your question about coherence, but the slogan only licenses the statistical reading, so he is overstating the case to win the argument. This move tries to make the arrow of time a strict law rather than a probabilistic trend, which would make the direction of time necessary rather than contingent, but it contradicts the underlying physics he claims to be citing.

  To close this out, none of the readings actually let him close all three arguments the way he tried to because he is conflating the boundary condition thesis with the gradient thesis and the statistical nature of thermodynamics with nomological necessity. The first claim about the low-entropy past is a separate thesis that needs independent justification, the second claim about deliberation reduces too much and leaves out the normative force of agency, and the third claim about impossibility is simply false on the statistical reading required by physics. The slogan does not do the work he wants it to do without smuggling in extra assumptions about the Past Hypothesis and the nature of law, so you are right to push back that the second law presupposes a direction rather than explaining it, and the only reading that survives is the modest one where entropy explains records and causation statistically but leaves deliberation and flow untouched. Best of luck with the group, and I hope this helps you untangle the knot he tied.
