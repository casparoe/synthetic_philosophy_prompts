  4.  **Synthesize the "Distortion":**

      *   *Distortion 1:* **Epistemic Veto / The Least Informed Veto.** The decision quality is capped by the least informed member's risk tolerance. This is a failure of *epistemic democracy*.
      *   *Distortion 2:* **The Holdout / Attrition Bias.** The veto power migrates to those with the highest tolerance for social friction, not the best judgment.

  5.  **Address the "Unilateralist's Curse" Comparison:**

