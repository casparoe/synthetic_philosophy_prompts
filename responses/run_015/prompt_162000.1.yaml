answer: |-
  You are describing a well-documented failure mode of **unanimity rules** (or strict consensus), but there isn't one single catchy phrase like "The Peter Principle" that covers the whole behavioral cluster. Instead, it sits at the intersection of political science, game theory, and social psychology.

  Here is the breakdown of the names, the mechanisms, the relationship to the Unilateralist's Curse, and why your proposed remedies might backfire.

  ### 1. Does it have a name?

  The closest established political science term is **"The Tyranny of the Minority."**

  While "Tyranny of the Majority" is the common fear in democracies, political theorists (most notably **George Tsebelis** in *Veto Players: How Political Institutions Work*) use **Veto Player Theory** to describe exactly what you are seeing. When decision-making requires unanimity, every member is a "veto player." Tsebelis proves mathematically that as you add veto players, policy stability increases (nothing changes), but the *quality* of the status quo becomes disconnected from the group's actual preferences.

  In organizational behavior, this is often called **"Consensus Pathology"** or the **"Lowest Common Denominator Effect."**

  ### 2. The Two Distortions

  You correctly identified two distinct distortions. They are related but mechanistically different.

  **Distortion A: The Epistemic Veto (The Information Problem)**
  *   **The Mechanism:** This is a failure of **Epistemic Democracy**. In a voting system, the *Condorcet Jury Theorem* suggests that if each member is slightly more likely than random to be right, the majority view converges on the truth. In a unanimity system, the decision quality does not converge on the *average* knowledge; it converges on the *minimum* knowledge threshold required to feel safe.
  *   **The Distortion:** You are experiencing **Status Quo Bias** amplified by **Information Asymmetry**. The person with the least information has the highest uncertainty. Because uncertainty triggers risk aversion, the least informed person becomes the de facto decision-maker. The group isn't choosing the "best" option; it is choosing the "least objectionable to the least informed" option.
  *   **Why adding members makes it worse:** In a majority vote, adding members dilutes the power of one ignorant person. In a unanimity rule, adding members *adds* another potential veto point, increasing the probability that *someone* will be uninformed or risk-averse.

  **Distortion B: The Holdout Problem (The Stubbornness Problem)**
  *   **The Mechanism:** This is a classic game-theoretic **Holdout Problem**. When a veto is absolute, the "cost" of using it is social friction.
  *   **The Distortion:** Over time, the veto power migrates from the *most cautious* to the *most obstinate*. This is **Selection for Obstinacy**.
      *   Member A blocks because they have a genuine, reasoned concern.
      *   Member B blocks because they dislike change generally.
      *   Member C blocks because they enjoy the power or don't mind the social awkwardness.
      *   The group learns that arguing with Member A is productive, but arguing with Member C is exhausting. Eventually, the group self-censors to avoid triggering Member C.
  *   **Result:** The decision criterion shifts from "Is this good?" to "Will this annoy the person with the highest tolerance for conflict?"

  ### 3. Is this the Unilateralist's Curse?

  **Yes, it is the exact symmetrical inverse.**

  The **Unilateralist's Curse** (described by Nick Bostrom, Thomas Douglas, and Anders Sandberg) occurs when a group *could* act, but only one person *needs* to act to impose a risk on everyone.
  *   **Unilateralist's Curse:** Threshold for action is too *low* (1 person). Risk: **False Positive** (doing something harmful).
  *   **Your Situation:** Threshold for action is too *high* (N people). Risk: **False Negative** (failing to do something beneficial).

  **Is it the same machinery?**
  Yes. Both phenomena stem from decoupling **agency** from **epistemic weight**.
  *   In the Unilateralist's Curse, one person's desire to act overrides the group's collective caution.
  *   In your committee, one person's desire to block overrides the group's collective opportunity assessment.

  Both systems ignore the *distribution of information*. In a healthy system, the person with the most relevant expertise should have the most influence. In both the Curse and your Committee, the procedural rule (1-to-act or 1-to-block) grants equal weight to the most informed and the least informed.

  ### 4. Do the usual remedies work?

  You asked whether remedies for the acting-alone version (deferring, asking first, requiring agreement) help here. **Most of them will make it worse.**

  *   **"Asking First" / Consultation:** In the Unilateralist's Curse, asking first prevents rash action. In your scenario, you are *already* talking until nobody objects. More talking just gives the veto player more time to dig in or find new uncertainties.
  *   **"Deferring":** This feeds the Status Quo Bias. If you defer the grant proposal, the money often disappears or the deadline passes. Deferring favors the blocker because the status quo (keeping the money) is the default win condition for a block.
  *   **"Requiring Agreement":** This is the root cause.

  **What actually works?**
  To fix this, you must break the link between "one person" and "total stop."

  1.  **Distinguish "Stand Aside" from "Block":** In formal consensus (e.g., Quaker models), there is a difference between "I don't like this but won't stop it" (Stand Aside) and "This violates our core principles" (Block). If your committee treats all objections as Blocks, you have a design flaw.
  2.  **Supermajority Voting:** Move from 100% consent to 80% (e.g., 8 out of 10). This preserves the need for broad buy-in but prevents a single uninformed or stubborn member from holding the group hostage. This directly counters the *Tyranny of the Minority*.
  3.  **Delegated Authority (Sub-committees):** If the spend is under $X, a sub-group of 3 decides. This reduces the number of veto players. According to Veto Player Theory, reducing the number of players increases the likelihood of action without necessarily decreasing quality (if the sub-group is representative).
  4.  **Burden of Proof Reversal:** Currently, the *proposer* must prove the idea is safe. Shift the burden: The *blocker* must provide a written, reasoned objection that addresses the group's goals. If the objection is "I'm unsure," it doesn't count. This counters the *Epistemic Veto*.
  5.  **Time-Boxing:** "We will discuss this for 30 minutes. If there is no consensus, we vote." This counters the *Holdout Problem* by making the cost of stubbornness a loss of control (the vote) rather than just social friction.

  ### Summary
  You are experiencing **Veto Player Pathology**, specifically the **Tyranny of the Minority**.
  *   **Distortion 1** is **Epistemic Inequality**: The least informed sets the bar.
  *   **Distortion 2** is **Selection for Obstinacy**: The most stubborn sets the bar.
  *   **Relation to Unilateralist's Curse:** It is the symmetrical inverse (False Negatives vs. False Positives), driven by the same error of giving one individual agency disproportionate to their knowledge.
  *   **Remedies:** "Talking more" fails. You need structural changes that lower the threshold from Unanimity to Supermajority, or raise the cost of blocking by requiring reasoned justification.
