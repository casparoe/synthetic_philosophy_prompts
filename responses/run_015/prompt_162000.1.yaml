      *   **Observation 2 (The Stubbornness/Attrition Distortion):** Over time, the group learns who blocks. They wear down the "soft" blockers. Eventually, approval depends on not bothering the *most stubborn* person, not necessarily the most cautious. The veto power drifts to the most obstinate.
