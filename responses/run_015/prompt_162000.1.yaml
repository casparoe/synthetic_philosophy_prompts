  2.  **Deconstruct the Phenomena:**

      *   **Mechanism:** Unanimity Rule / Consensus Decision Making with a de facto Veto.
      *   **Distortion 1 (Information Asymmetry):** The "Lowest Common Denominator" effect. In a unanimity rule, the decision quality is bounded by the least informed/most risk-averse member. This is related to the *Condorcet Jury Theorem* (in reverse) or *Group Polarization* (but towards caution). It's also a specific failure mode of *Consensus*.
      *   **Distortion 2 (Attrition/Stubbornness):** This is a dynamic game theory problem. If blocking is costly (social pressure, time), those with lower "cost of resistance" win. This is the *Holdout Problem* or *Veto Player Theory* applied to micro-groups. It leads to *Path Dependence*.
      *   **Comparison to Unilateralist's Curse:**
          *   Unilateralist's Curse: One person acts, imposing risk on others. (Action bias).
          *   This Scenario: One person blocks, imposing opportunity cost on others. (Inaction bias).
          *   Relationship: They are inverse symmetries. Both stem from assigning too much agency to a single individual relative to the group epistemic state.

  3.  **Identify Terminology & Concepts:**

      *   **Consensus Blocking / Veto:** The structural rule.
