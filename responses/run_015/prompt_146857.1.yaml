answer: |-
  **UNIVERSITY OF [REDACTED]**
  **DEPARTMENT OF PHILOSOPHY**
  **MODULE: PHI3041 — MIND AND MORAL STATUS**

  **TAKE-HOME EXAMINATION**
  **Time Allowed:** 48 Hours
  **Word Limit:** 1,200 words maximum
  **Total Marks:** 20

  **INSTRUCTIONS**
  Answer the following question. You are not required to consult external literature; all necessary information is contained in the prompt. Do not simply perform the expected-value calculation described in the memo; your task is to evaluate the *reasoning* behind the policy, not the arithmetic.

  ***

  **QUESTION**

  You are a junior ethicist at the Interspecies Welfare Directorate. You have been asked to audit **Advisory Standard 7(b)**, which governs how regulatory cost–benefit analyses account for invertebrates. The Standard reads as follows:

  > **Advisory Standard 7(b)**
  > (i) For regulatory analysis, a taxon's expected welfare cost = (estimated number of individuals affected) × (probability that members of that taxon are sentient) × (average intensity of a pain-like state, scaled to the human case) × (duration).
  > (ii) Where the probability in (i) is assessed at less than 0.1, the taxon is assigned a welfare weight of zero and excluded from analysis, on the grounds that acting on probabilities that low would be speculative and would let remoter possibilities crowd out everything else on the agenda.
  > (iii) Assessments under (i) are made taxon by taxon; the probabilities assigned to distinct individuals within a taxon are treated as independent.

  **Audit Standard 7(b).** Assume for the sake of this question that the probability an individual insect is sentient is around 0.05, that the number affected by the policy under review is very large (say $10^{13}$ per year), and that we have no direct evidence either way about the intensity or duration of insect affective states.

  Does the Standard give the right verdicts? If not, identify exactly where the reasoning fails. In your answer, address the structural assumptions about uncertainty, the justification for the threshold, and the implications of ignorance for policy.

  ***

  **MODEL ANSWER**

  **Audit of Advisory Standard 7(b)**

  Standard 7(b) attempts to manage epistemic uncertainty regarding invertebrate sentience through a precautionary exclusion clause. While administratively convenient, the Standard is philosophically unsound. It relies on a flawed model of risk distribution, an arbitrary threshold for moral consideration, and an asymmetrical application of the 'speculative' label. Furthermore, it assumes negative valence without justification and ignores the value of information. The Standard should be rejected.

  The primary structural failure lies in Clause (iii), which treats the probability of sentience as independent across individuals. This is biologically and philosophically implausible. Sentience is likely a property of a neural architecture shared by a lineage, not a lottery ticket drawn individually. If one cricket possesses the requisite substrate for experience, it is highly probable that a trillion others do as well. Consequently, the risk distribution is not smooth; it is bimodal. We face two distinct worlds: one where insects are insentient (zero welfare cost) and one where they are sentient (massive welfare cost).

  Clause (i) calculates the mathematical expectation ($0.05 \times 10^{13}$), which yields a moderate number. However, decision-making under bimodal risk cannot rely solely on expectation. The 'real' outcome is likely either nothing or a catastrophe that dwarfs all other moral priorities on the Directorate's agenda. By treating the probability as independent, Clause (iii) sanitises the risk, converting a low-probability, high-stakes catastrophe into a manageable, certain cost. This misrepresents the decision problem. The question is not whether to accept a small certain cost, but whether to gamble on the possibility of enabling industrial-scale suffering. Clause (ii) attempts to block this by zeroing out the weight, but this merely hides the bimodal nature of the risk rather than resolving it.

  This leads to the second failure: the arbitrariness of the 0.1 threshold in Clause (ii). There is no moral justification for a cliff-edge where a probability of 0.09 grants zero protection and 0.11 grants full weight. Moral status does not switch on at a specific decimal point of scientific confidence. If the rationale is that low probabilities are 'too speculative' to act upon, this principle must apply symmetrically. Currently, the Standard uses uncertainty to justify the status quo (inaction). However, maintaining a policy that potentially harms $10^{13}$ sentient beings is equally 'speculative'. If we cannot be sure they are sentient, we cannot be sure our current industry is permissible. Using uncertainty to dismiss the risk of harm while accepting the risk of causing harm is a status quo bias disguised as prudence. The 'speculative' defence cuts both ways; it should block the conclusion that current practice is fine just as much as it blocks the conclusion that regulation is required.

  Thirdly, Clause (i) assumes the calculation is of 'welfare cost'. This presupposes that the affective states in question are negative (pain-like) and that the lives in question are net negative. We are explicitly told we have no evidence regarding intensity or valence. It is possible that insect lives are, on balance, positive, or that their experiences are morally neutral. By framing the equation solely around 'cost', the Standard builds in a negative assumption. If the lives are net positive, the policy might be preventing welfare rather than protecting it. A neutral audit must account for the possibility of lost welfare benefits, not just inflicted harms. Ignoring this dimension renders the cost–benefit analysis fundamentally skewed before the numbers are even plugged in.

  Finally, the Standard presents a false dichotomy: either regulate now based on current probabilities or ignore the issue entirely. It fails to consider the Value of Information. Given the massive scale ($10^{13}$) and the bimodal risk, the expected value of resolving the uncertainty is enormous. Even a small investment in research to move the probability estimate from 0.05 to 0.01 or 0.99 could prevent vast moral errors. Clause (ii) discourages this by assigning a weight of zero; if the weight is zero, there is no bureaucratic incentive to fund research. A rational policy under deep uncertainty, where stakes are astronomical, is not to act on the current probability nor to ignore it, but to prioritise reducing the uncertainty. The Standard locks in ignorance by making ignorance a reason for inaction.

  In conclusion, Standard 7(b) fails because it models correlation as independence, masking the catastrophic tail risk. It employs an unjustified threshold that privileges the status quo despite symmetrical uncertainty. It assumes negative valence without evidence and neglects the moral imperative to acquire better data. The Standard does not manage uncertainty; it merely administrative buries it.

  ***

  **MARKING SCHEME**

  **Total: 20 Marks**
  **Allocation: 5 Criteria × 4 Marks each**

  | Criterion | Marks | Guidance for Markers | Common Student Error |
  | :--- | :---: | :--- | :--- |
  | **1. Correlation & Distribution** | 4 | Must identify that sentience is likely a lineage property (correlated), creating a bimodal (all-or-nothing) risk distribution rather than a smooth expectation. | Treating the $N \times P$ calculation as the whole story; failing to distinguish between expected value and risk profile. |
  | **2. Threshold Arbitrariness** | 4 | Must argue that the 0.1 cut-off is unjustified and creates a moral cliff-edge; small changes in probability should not result in total exclusion. | Accepting the threshold as a necessary administrative heuristic without questioning the moral discontinuity. |
  | **3. Symmetry of Ignorance** | 4 | Must note that 'speculative' applies to both regulating and not regulating; using uncertainty to justify the status quo is a bias. | Arguing that uncertainty implies we should do nothing (precautionary principle applied only to regulation). |
  | **4. Valence Uncertainty** | 4 | Must observe that Clause (i) assumes 'cost' (negative experience), ignoring the possibility that lives are net positive or neutral. | Assuming insect suffering is necessarily a 'cost' without questioning the net valence of the lives lived. |
  | **5. Value of Information** | 4 | Must suggest that under high stakes and high uncertainty, the priority should be research to reduce uncertainty, not immediate regulation or dismissal. | Treating the choice as binary (act now vs. ignore); failing to propose investigation as a third policy option. |

  **General Notes:**
  *   **Word Count:** Penalise significantly if over 1,200 words.
  *   **Arithmetic:** Do not award marks for correct calculation of the expected value; the question explicitly asks them to move beyond this.
  *   **Style:** British English spelling required (e.g., 'programme', 'analyse', 'defence'). Minor errors tolerated; systematic Americanisation should be noted.
