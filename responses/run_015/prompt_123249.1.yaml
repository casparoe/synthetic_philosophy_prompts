answer: |-
  You have nailed the intuition. Your diagnosis is correct: **disagreement persists**, and the gap is exactly where the theorem breaks.

  Here is the gut-level breakdown of why, what assumption snapped, and the answers to your follow-ups.

  ### 1. The Diagnosis: Announcements $\neq$ Posteriors

  You asked: *Is "the posteriors are common knowledge" strictly stronger than "both numbers are on the table"?*

  **Yes.** This is the exact load-bearing beam.

  In the standard Aumann setup, when Alice announces "0.5," Bob knows with probability 1 that Alice's posterior expectation of the state is 0.5. Because they share a prior and Bob knows Alice is a Bayesian, Bob can invert that announcement to learn exactly which cell of Alice's information partition they are in. He can effectively "see" her signal.

  In your **Confabulator Setup**:
  When Alice announces "0.5," Bob does **not** know Alice's posterior is 0.5.
  *   With probability $0.9$, Alice is honest, and her posterior is 0.5.
  *   With probability $0.1$, Alice is a confabulator, and her posterior is undefined (or irrelevant), and the number 0.5 was drawn from a hat.

  Because Bob cannot distinguish these cases, **Alice's posterior is not Common Knowledge.** Bob only has Common Knowledge of the *Announcement*.

  **The "Cell" Intuition:**
  Aumann's theorem works because the agents effectively merge into a single "super-agent" operating on the **meet** of their information partitions.
  *   **Standard Aumann:** The announcements carve the state space into crisp, rectangular cells. Both agents know they are in Cell $X$. They average the prior over Cell $X$. They get the same number.
  *   **Your Setup:** The announcements carve the state space into **fuzzy clouds**. Bob looks at Alice's announcement and sees a probability distribution over which cell she is in (Honest-Cell vs. Confabulator-Noise). He cannot condition on a specific event in the state space; he has to condition on a mixture of events in the **State $\times$ Type** space.

  Since they are averaging over different "effective cells" (Bob is averaging over "Alice-Honest $\cup$ Alice-Crazy," while Alice is averaging over "Bob-Honest $\cup$ Bob-Crazy"), there is no mathematical requirement for their averages to match.

  **The Load-Bearing Assumption:**
  It is often said the load-bearing assumption is "Common Prior." It isn't. It is **Common Knowledge of Rationality** (specifically, Common Knowledge that both agents are Bayesian updaters).
  If you doubt the other agent's rationality (or type), you cannot treat their announcement as a sufficient statistic for their private information. You treat it as a **noisy signal**. Noisy signals do not force agreement; they force Bayesian updating, which allows for persistent disagreement if the noise floor ($\epsilon$) is non-zero.

  ---

  ### 2. Follow-up: The Limit as $\epsilon \to 0$

  **Does the gap shrink continuously, or does it jump?**

  **The Gap:** Shrinks continuously.
  **The Theorem:** Jumps discontinuously.

  As $\epsilon \to 0$, Alice places more and more weight on the hypothesis that Bob is honest. Her posterior converges to Bob's posterior. The *distance* between their numbers goes to 0.

  However, the **guarantee of exact equality** is discontinuous.
  *   For any $\epsilon > 0$, no matter how small, there is a non-zero probability that the other person is noise. Therefore, a rational Bayesian will *never* fully ignore their own private signal to match the other person exactly. They will always hedge slightly. Exact agreement is impossible.
  *   At $\epsilon = 0$, the hedge vanishes instantly. Exact agreement becomes mandatory.

  This is a classic "singular perturbation" problem. The structure of the solution for $\epsilon > 0$ (partial updating) is fundamentally different from the structure at $\epsilon = 0$ (full identification), even though the values converge.

  ---

  ### 3. Follow-up: Mildly Informative Signals & "Why didn't you move?"

  **Does it get messier if Alice's signal is mildly informative?**

  **Yes, it gets much messier.** It turns from an agreement problem into a **signaling/reputation game**.

  Suppose Alice's signal suggests 0.6. Bob's suggests 0.9.
  1.  **Round 1:** Alice says 0.6. Bob says 0.9.
  2.  **Round 2:** Bob updates. He thinks: "Alice said 0.6. Either she saw evidence for 0.6, or she is a confabulator." He moves slightly toward 0.6, say to 0.88.
  3.  **The Crucial Moment:** Alice sees Bob move only from 0.9 to 0.88.
      *   If Bob were honest and saw her 0.6, shouldn't he have moved more?
      *   Alice now updates her belief about **Bob's Type**. She thinks: "Bob didn't move much. He's probably a confabulator."
      *   Consequently, Alice discounts Bob's 0.88 *more* in the next round.

  This can lead to a **breakdown of communication**.
  If the noise $\epsilon$ is high enough, or the signals conflicting enough, agents might enter a cycle where they interpret the other's lack of movement as evidence of irrationality, which causes them to move less, which confirms the suspicion of irrationality.

  In the literature (e.g., models of "agreeing to disagree" with bounded rationality or type uncertainty), this often results in **polarization** rather than agreement. The honest agents effectively give up on learning from the other person because the "confabulator hypothesis" swamps the "disagreement hypothesis."

  ### Summary for your gut

  1.  **Why Aumann works:** Announcements = Information Partitions. We are averaging over the same bucket of states.
  2.  **Why your setup fails:** Announcements = Noisy Signals. We are averaging over different buckets of (State $\times$ Type).
  3.  **The Broken Assumption:** Common Knowledge of Bayesian Rationality. (I don't know that you know that I know... that we are both actually doing math).
  4.  **The Limit:** The numbers get close as noise vanishes, but the *logic* of exact agreement snaps into existence only at exactly zero noise.

  You correctly identified that "numbers on the table" is not enough. The numbers must be **transparent windows into the other person's information partition**. In your scenario, the windows are frosted glass.
