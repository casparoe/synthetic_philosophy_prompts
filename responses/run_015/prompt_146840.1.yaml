prompt: |-
  hey so my best friend just got hired as an aide to a city councilor and now she's stressing about whether she should help draft a statement that spins the numbers a little to keep a shelter open. i was trying to explain walzers dirty hands thing to her but then i got stuck on this analogy everyone uses: being a politician is like being a surgeon, sometimes you have to cut or lie or bend rules to save the body politic. can you audit that for me? like, map exactly what correspods to what - the surgeons blade -> the politicians lie? the patient -> the citizens? then tell me where the mapping breaks: does the surgeon have informed consent, does politics have a single correct diagnosis, does the analogy smuggle in that harm is clean and technical rather than moral? also i read something about moral residue, that even justified dirty acts leave a stain - does surgery capture that or does it make the harm sound too sterile? and finally, can this analogy actually do the work people want, which is giving politicians special moral permissions, or does it collapse once the disanalogies are out? be real with me, not just textbook, because she's actually facing this call tomorrow.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's best friend is a new aide to a city councilor. She's facing an ethical dilemma: should she help draft a statement that "spins the numbers" (lies/misleads) to keep a shelter open?
      *   **Concept:** The user tried to explain Michael Walzer's "Dirty Hands" problem but got stuck on the common "Politician as Surgeon" analogy.
      *   **Task:** Audit the analogy.
          *   Map the correspondences (Blade -> Lie, Patient -> Citizens, etc.).
          *   Identify where the mapping breaks (Informed consent? Single diagnosis? Sterile harm vs. Moral stain?).
          *   Address "Moral Residue" (Does surgery capture the lingering guilt?).
          *   Evaluate utility (Does this analogy actually grant special moral permission, or does it collapse?).
      *   **Tone:** "Be real with me, not just textbook." The friend needs practical advice for *tomorrow*. This isn't just a philosophy seminar; it's a career-and-conscience crisis.

  2.  **Deconstruct the "Politician as Surgeon" Analogy:**
      *   *The Mapping:*
          *   Surgeon -> Politician/Aide.
          *   Patient -> The City/Citizens/Body Politic.
          *   Disease/Crisis -> Budget deficit/Homelessness crisis/Shuttered shelter.
          *   Scalpel/Incision -> The Lie/Spin/Policy Trade-off.
          *   Healing/Survival -> Keeping the shelter open/Public Order.
      *   *The Breakdown (Disanalogies):*
          *   **Consent:** Patients consent to surgery (usually). Citizens rarely consent to specific lies.
          *   **Expertise/Diagnosis:** Medicine has objective metrics (X-rays, blood tests). Politics is inherently normative (What *should* we fund? What is "fair"?). There is no single "correct" diagnosis.
          *   **Nature of Harm:** Cutting skin is physical, localized, and heals. Lying erodes trust, which is systemic and cumulative.
          *   **Moral Residue:** A surgeon washes their hands and the scar fades. A politician's lie, if discovered, creates cynicism. Even if undiscovered, the *knowledge* of the lie changes the liar.
      *   *The "Dirty Hands" Nuance:* Walzer isn't saying "it's okay." He's saying "it's necessary but you must feel bad about it." The surgery analogy makes it sound *technical* and *clean*, missing the *guilt* component.

  3.  **Address the Specific Dilemma (Spinning Numbers for a Shelter):**
      *   This isn't a "ticking time bomb" scenario (the classic Dirty Hands extreme). This is bureaucratic spin.
      *   *Walzer's View:* Walzer focuses on extreme cases (torture to stop a bomb, sacrificing soldiers to win a war). Lying about budget numbers to keep a shelter open is lower stakes but potentially higher frequency.
      *   *The Risk:* If the lie is found out, the shelter loses credibility. The councilor loses credibility. The friend becomes complicit.
      *   *The "Dirty Hands" Verdict:* Does this qualify? Probably not in the Walzerian sense. It's more like "corruption" or "expediency" than "tragic necessity."

  4.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the gravity. This is real life, not just theory. Validate the friend's stress.
      *   *Section 1: The Audit (Mapping & Breaking).*
          *   Do the mapping clearly as requested.
          *   Hit the breaking points hard: Consent, Objectivity, Trust.
          *   *Key Insight:* Surgery is consensual harm for a known good. Politics is often non-consensual harm for a contested good.
      *   *Section 2: Moral Residue.*
          *   Does surgery capture this? No. Surgeons save lives; the cut is a means. In politics, the lie *is* the damage to democracy.
          *   Walzer's point: The politician must be willing to be condemned for doing what was necessary. Does the councilor plan to confess? Unlikely. That violates the "Dirty Hands" requirement of owning the guilt.
      *   *Section 3: Does it grant permission?*
          *   No. It's a rationalization trap.
          *   Distinguish between "Dirty Hands" (tragic necessity) and "Slippery Slope" (normalizing lies).
      *   *Section 4: Practical Advice for the Friend (The "Be Real" part).*
          *   This is crucial. Philosophy is great, but she has a job tomorrow.
          *   *Strategy:* Don't just say "no." Ask questions. "What happens if the audit finds this?" "Is there a way to frame the truth that still saves the shelter?"
          *   *Self-Preservation:* Get it in writing (maybe too aggressive?), or document concerns.
          *   *The Walzerian Check:* If you have to do it, you must be willing to pay the price. Is the councilor willing to resign if caught? If not, it's not Dirty Hands, it's just cheating.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be empathetic but firm.
      *   Make sure the distinction between "Dirty Hands" (Walzer) and "Dirty Tricks" is clear.
      *   *Self-Correction during drafting:* I initially thought about telling her to quit. But that's extreme. Better to give her tools to navigate the conversation with the councilor.
      *   *Focus on the "Spin":* Spinning numbers isn't usually a "lesser evil" to prevent catastrophe; it's usually to avoid accountability. That's a key distinction.

  6.  **Final Polish:**
      *   Check against all constraints in the prompt.
      *   Ensure the "Moral Residue" section is distinct.
      *   Ensure the "Permission" question is answered directly.
