answer: |-
  This is a classic "levels of analysis" deadlock, compounded by the fact that you are mixing **causal mechanisms** (how it happened), **justificatory reasons** (why it was right to happen), and **structural conditions** (what made it possible).

  You asked what kind of disagreement this is. The short answer is: **It is all three, layered on top of each other.** But the layer preventing progress is primarily **verbal/conceptual**, masking a deeper **metaphysical** disagreement about moral realism.

  Here is a breakdown of the impasse, an evaluation of your "honor liquidity" framing, and a concrete path to unstick the group.

  ### 1. Diagnosing the Disagreement

  **A. The Verbal Layer (Definition of "Explanation")**
  *   **The Materialist** defines explanation as *structural necessity*. (X happened because the base conditions made Y impossible.)
  *   **The Appiah Side** defines explanation as *social mechanics*. (X happened because the coordination equilibrium shifted.)
  *   **The Williams Side** defines explanation as *agency and reason*. (X happened because people recognized a truth they hadn't seen before.)
  *   **The Conflict:** You are arguing over whether "explanation" requires stripping away the actors' stated reasons (Materialist/Appiah) or taking them seriously (Williams).

  **B. The Empirical Layer (Timing and Counterfactuals)**
  *   **Materialist vs. Appiah:** Did profitability drop *before* or *after* the moral consensus shifted? (e.g., British abolition happened while slavery was still highly profitable, which hurts the Materialist case).
  *   **Appiah vs. Williams:** Did elite defection happen because of *status calculation* (Appiah) or because they were convinced by *argument* (Williams)?
  *   **The Conflict:** You lack a shared dataset of "divergence cases" where one variable changed without the others.

  **C. The Bedrock Layer (Moral Ontology)**
  *   **Williams** is implicitly arguing for a form of moral realism or internalism: Moral truths have causal power. People stop slavery because it is *actually wrong*, and recognizing that wrongness is a distinct cognitive event.
  *   **Appiah/Materialist** are arguing for constructivism or epiphenomenalism: Moral language is the dress worn by status or economic interests.
  *   **The Conflict:** This is hard to resolve empirically. If a person says "I stopped because it was wrong," the Williams side says "Case closed." The Appiah side says "That's just the story they tell themselves to save face."

  ### 2. Evaluating "Honor Liquidity"

  Your concept of **"Honor Liquidity"** is strong, but it is not a unification theory. It is a **dynamic refinement of Appiah.**

  *   **What it does well:** It solves the "why now?" problem. Appiah explains *that* honor codes shift, but "liquidity" explains the *non-linearity* of the shift. It frames honor as a market asset that can suffer a run on the bank. Once elite defection hits a threshold, the status value doesn't just decline; it crashes to zero because holding the norm becomes a liability rather than an asset. This appeals to the rationalist side (coordination cascades, information signals).
  *   **Where it fails:** It does not answer the Williams critique. Liquidity explains the *collapse* of the norm, but not the *initial defection*. Why did the first elites defect?
      *   If they defected for *status*, Williams says you haven't explained the moral change, just the fashion.
      *   If they defected for *reasons*, then Williams is right that internal normative shifts are the prime mover, and liquidity is just the amplification mechanism.
  *   **Verdict:** It is a fancy name for Appiah's side, but a **useful** one. It moves the debate from "honor matters" to "honor markets have volatility thresholds." It won't convince the Williams side, but it might satisfy the Materialist if you frame status as a form of capital.

  ### 3. How to Make Progress

  You will not move until you stop trying to find *The Cause* and start mapping *Necessary vs. Sufficient Conditions*. Here are three concrete interventions to try on the group:

  **Option A: The "Britain vs. American South" Test (Empirical)**
  Stop debating theory and look at the divergence.
  *   **Britain:** Abolished the slave trade (1807) and slavery (1833) while the Caribbean colonies were still highly profitable. The state absorbed the cost.
      *   *Implication:* Damages the Materialist claim.
  *   **American South:** Slavery remained profitable until the Civil War, yet the norm collapsed (via force).
      *   *Implication:* Damages the Appiah claim (Southern elites didn't lose honor until they lost the war).
  *   **The Task:** Ask the group to agree on a timeline of *when* the moral consensus shifted relative to *when* the economic data shifted. If the moral shift precedes the economic shift, Materialism loses. If the moral shift follows elite defection without prior philosophical argument, Williams loses.

  **Option B: The Formal Coordination Model (Rationalist Appeal)**
  Since your group is rationalist-adjacent, stop using words and use a **Global Games model** (Carlsson & van Damme).
  *   Model the norm as a coordination equilibrium.
  *   Model "Honor Liquidity" as the noise threshold in the signal.
  *   **The Question:** Does the model require an *exogenous shock* (economic change/materialist) to shift the equilibrium, or can *endogenous noise* (rumors/status/Appiah) shift it?
  *   If the model shows that small shifts in public signal can flip the equilibrium without a change in underlying payoffs, you have mathematically demonstrated Appiah's point to the Materialist. If the model requires a change in the payoff matrix (profit) to shift the equilibrium, the Materialist wins.

  **Option C: Dissolve the Debate (Philosophical)**
  Propose that you are describing **Proximate vs. Ultimate Causation**.
  *   **Materialist:** Ultimate cause (structural conditions).
  *   **Appiah:** Proximate mechanism (how the change propagated).
  *   **Williams:** Phenomenological experience (how the change was processed by agents).
  *   **The Proposal:** "We are arguing about whether the fire started because of oxygen (Materialist), the spark (Appiah), or the flammability of the wood (Williams). All three are required. Let's stop asking 'which one' and start asking 'in what order did they occur in this specific instance?'"

  ### Recommendation

  **Go with Option C first, then Option B.**

  1.  **Reframe:** Tell the group, "We are conflating *conditions of possibility* (Materialist), *mechanisms of transmission* (Appiah/Liquidity), and *motivating reasons* (Williams). These are compatible, not contradictory."
  2.  **Deploy Liquidity:** Use your "Honor Liquidity" concept to explain the *mechanism of transmission*. It bridges Appiah and Rationalism by treating honor as a volatile asset class.
  3.  **Concede to Williams:** Acknowledge that Liquidity doesn't explain the *first defector*. Admit that for the first defector, a Williams-style "internal reason" might be necessary. This validates the Williams side without granting them the whole explanation.
  4.  **Concede to Materialist:** Acknowledge that Liquidity crises usually happen against a backdrop of structural stress (Materialist).

  **The Progress Metric:**
  Progress isn't one side winning. Progress is when you can write a single sentence that satisfies all three.
  *   *Example:* "Structural economic shifts (Materialist) created stress on the elite, causing early adopters to defect based on normative reasons (Williams), which triggered an honor liquidity crisis (Appiah/User) that collapsed the norm."

  If you can get them to agree on a sentence like that, the debate is over, and the real work (historical analysis) can begin.
