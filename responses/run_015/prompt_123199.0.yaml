answer: |-
  # Desiderata for Normative Decision Theory under Undefined Expectation
  ### A Specification for Graduate Seminar Analysis

  **Subject:** Rational Choice in the Presence of Conditionally Convergent Payoffs
  **Stress-Test:** The Pasadena Paradox and Iterated/Meta-Variants
  **Objective:** To specify the necessary and sufficient conditions for a decision theory to remain action-guiding, consistent, and reflective when standard expected utility (SEU) yields undefined values.

  ---

  ## I. Phenomenological Distinctions and Scope

  Before specifying normative desiderata, an adequate theory must distinguish between the *sources* of undefined expectation. Conflating these leads to category errors in theory selection.

  1.  **Divergence vs. Conditional Convergence:**
      *   *Phenomenon:* The St. Petersburg paradox involves divergence to $+\infty$ (or $-\infty$). The Pasadena game involves conditional convergence, where the series $\sum p_i u_i$ converges to different values depending on the ordering of terms.
      *   *Requirement:* The theory must treat $+\infty$ (unbounded utility) distinctly from *undefined* (order-dependent utility). A theory that merely truncates infinite values (e.g., using a utility cap) solves St. Petersburg but fails Pasadena, as Pasadena payoffs can be bounded while remaining conditionally convergent.
      *   *Status:* **Non-negotiable.** A theory that cannot distinguish oscillation from divergence lacks the resolution to handle the Riemann Rearrangement Theorem implications for choice.

  2.  **Aleatory vs. Epistemic Undefinedness:**
      *   *Phenomenon:* Undefinedness may arise from the payoff structure itself (aleatory; e.g., the Pasadena payoff matrix) or from the agent's doxastic state (epistemic; e.g., imprecise probabilities or discontinuous belief updating where $P(E)$ fails to converge).
      *   *Requirement:* The theory must isolate the source. If undefinedness arises from discontinuous belief updating (e.g., learning a proposition with prior probability 0 via non-standard conditioning), the remedy lies in epistemology, not decision rules. If it arises from the payoff structure (Pasadena), the remedy lies in the decision rule.
      *   *Status:* **Non-negotiable.** Conflating these leads to misdiagnosing dynamic inconsistency as payoff pathology.

  3.  **Single-Shot vs. Sequential/Iterated Contexts:**
      *   *Phenomenon:* In a single-shot Pasadena game, the Law of Large Numbers (LLN) does not apply. In an iterated context (playing the game $N$ times as $N \to \infty$), the aggregate payoff behavior may stabilize or diverge differently than the single-shot expectation suggests.
      *   *Requirement:* The theory must specify whether rational preference is invariant to the number of iterations. A theory valid for single-shot choice must not prescribe a strategy that guarantees ruin in the iterated limit (and vice versa).
      *   *Status:* **Non-negotiable.** Rationality requires dynamic consistency across temporal horizons.

  ---

  ## II. Normative Desiderata

  The following criteria define the solution space. Each is flagged as **Non-Negotiable (NN)** (required for any claim to rationality) or **Camp-Specific (CS)** (dependent on commitments to Bayesianism, Causal Decision Theory, etc.).

  ### D1. Action-Guidance (The Existence Condition)
  *   **Specification:** For any finite set of available actions, the theory must generate a complete or partial ordering that identifies at least one permissible option. It cannot return "undefined" as a final verdict if a safe alternative exists.
  *   **Motivation:** Decision theory is normative; it must guide action. If an agent faces a Pasadena gamble $G$ and a sure thing $S$ (payoff 0), and the theory says $E[G]$ is undefined and offers no comparison rule, the agent is paralyzed.
  *   **Status:** **NN.**
  *   **Theoretical Cost:** Requires extending the value function beyond standard real-valued expectation (e.g., hyperreals, principal values, or lexical ordering).

  ### D2. Statewise Dominance
  *   **Specification:** If action $A$ yields a payoff at least as good as action $B$ in every possible state of the world, and strictly better in at least one state with non-zero probability, then $A \succ B$.
  *   **Motivation:** This is the minimal core of instrumental rationality. Violating dominance implies paying to lose.
  *   **Status:** **NN.**
  *   **Theoretical Cost:** In infinite state spaces, standard dominance principles can conflict with additivity. An adequate theory must specify whether it retains Countable Additivity (CS) or Finite Additivity (NN) to preserve dominance in Pasadena-like structures. (Note: Retaining Countable Additivity often forces the abandonment of Dominance in infinite settings; Finite Additivity is usually required to preserve Dominance).

  ### D3. Approximation Continuity
  *   **Specification:** If a sequence of gambles $\{G_n\}$ with defined expectations converges to a gamble $G$ (in terms of payoff structure and probability distribution), the valuation $V(G_n)$ should converge to $V(G)$.
  *   **Motivation:** Mathematical regularity and robustness. Small changes in the description of the world should not lead to discontinuous jumps in rational preference.
  *   **Status:** **CS.** (Strongly held by continuity-focused camps, but often the first casualty in infinite decision theory).
  *   **Theoretical Cost:** As detailed in Section III, this is the primary point of failure when combined with D1.

  ### D4. Iterative Stability (The Long-Run Condition)
  *   **Specification:** If an action is rationally permissible in a single-shot context, playing that action repeatedly (independent trials) must not lead to a sure loss (Dutch Book) or a trajectory that violates the single-shot valuation in the limit.
  *   **Motivation:** Prevents money pumps and ensures that the theory aligns with frequentist intuitions where applicable.
  *   **Status:** **NN.**
  *   **Theoretical Cost:** Many solutions to Pasadena (e.g., weak expectation) fail here. The "weak expectation" (limit of average payoff) may exist even when standard expectation is undefined, but relying on it for single-shot choice is controversial.

  ### D5. Causal/Epistemic Neutrality
  *   **Specification:** The resolution of undefined expectation should not depend arbitrarily on whether the uncertainty is modeled as causal (states cause outcomes) or evidential (outcomes evidence states), unless the payoff structure explicitly links choice to state (Newcomb-like).
  *   **Motivation:** The Pasadena paradox is structural, not causal. The undefinedness arises from the summation, not the dependency between act and state.
  *   **Status:** **CS.** (CDT vs. EDT proponents will disagree on whether causal structure matters for resolving the summation order).

  ---

  ## III. The Impossibility Result: Continuity vs. Definedness

  A central tension arises between **D1 (Action-Guidance/Definedness)** and **D3 (Approximation Continuity)**.

  **The Conflict:**
  Consider the Pasadena game $P$. Let $\{T_n\}$ be a sequence of truncated games where payoffs are cut off after $n$ terms.
  1.  Each $T_n$ has a defined standard expectation $E[T_n]$.
  2.  By the Riemann Rearrangement Theorem, we can construct different sequences of truncations $\{T_n\}$ and $\{T'_n\}$ that converge to the *same* Pasadena payoff structure but yield different limit expectations ($\lim E[T_n] = L_1$ and $\lim E[T'_n] = L_2$, where $L_1 \neq L_2$).
  3.  **D3 (Continuity)** demands that $V(P) = \lim V(T_n)$.
  4.  **D1 (Definedness)** demands that $V(P)$ be a unique value comparable to a safe alternative $S$.

  **Theorem (Informal):** No decision theory can simultaneously satisfy:
  1.  **Unique Valuation:** Every gamble has a unique value comparable to safe alternatives (Required for D1).
  2.  **Path-Independent Continuity:** The value of a limit gamble equals the limit of the values of approximating sequences, regardless of the order of approximation (Strong D3).
  3.  **Standard Summation:** For finite gambles, value equals standard expectation.

  **Resolution Strategies (and their costs):**
  *   **Abandon Path-Independence:** Accept that the value of $P$ depends on the *physical* order of payoff realization (temporal ordering). *Cost:* Violates description invariance; rational choice depends on arbitrary labeling of states.
  *   **Abandon Unique Valuation:** Allow $V(P)$ to be a set of values (interval-valued utility). *Cost:* Violates D1 (Action-Guidance) unless supplemented by a secondary choice rule (e.g., maximin), which reintroduces camp-specific biases.
  *   **Abandon Standard Summation:** Use a generalized summation method (e.g., Cesàro summation, analytic continuation). *Cost:* Violates the standard interpretation of expectation as a weighted average; may violate Dominance (D2) in edge cases.

  **Seminar Conclusion on this Point:** A theory must explicitly flag which horn of this trilemma it accepts. A theory claiming to satisfy all three is mathematically incoherent.

  ---

  ## IV. The Novel Constraint: Pasadena-with-Reflection

  We introduce a meta-structural requirement to test the theory's stability under self-reference.

  **The Scenario:**
  An agent faces a Pasadena gamble $G$. A second-order Predictor $\Omega$ observes the agent's decision rule $\mathcal{R}$. $\Omega$'s payoff is coupled to the agent's choice such that the total system payoff $U_{total}$ depends on $(\text{Choice}, \Omega(\text{Choice}))$. Crucially, $\Omega$ is tasked with predicting the *valuation* the agent assigns to $G$. If the agent's valuation is undefined, $\Omega$'s prediction is undefined, potentially rendering the agent's expected payoff undefined *by virtue of the prediction process itself*.

  **The Constraint (Meta-Stability):**
  *   **Specification:** The decision theory must yield a fixed point. The agent's valuation of the gamble, given that $\Omega$ is predicting that valuation, must converge to a stable value that prevents an infinite regress of undefined meta-expectations.
  *   **Motivation:** Rational agents operate in social/strategic environments where their decision procedures are observable. If a theory collapses into self-defeat (e.g., "I cannot choose because my choice makes the expectation undefined") when observed, it is ecologically invalid.
  *   **Status:** **NN** for any theory claiming to handle strategic rationality.

  **Implications for Theory Selection:**
  1.  **Truncation Strategies:** If the agent truncates the Pasadena series to calculate value, $\Omega$ predicts the truncation point. This stabilizes the expectation but makes the value arbitrary (dependent on the truncation parameter). *Verdict:* Fails Meta-Stability unless the truncation rule is itself fixed and known.
  2.  **Risk-Weighted Expectation (Buchak):** If the agent uses a risk function $r(p)$, the expectation may be defined where standard expectation is not. $\Omega$ predicts the risk function. *Verdict:* Potentially stable, provided the risk function is not sensitive to the undefinedness itself.
  3.  **Abandonment of Expectation-Maximization:** If the agent uses a non-expectational rule (e.g., median maximization or modal payoff), the undefined sum is bypassed. $\Omega$ predicts the median. *Verdict:* High stability, but requires abandoning the SEU framework entirely (violates D5 for Bayesians).

  ---

  ## V. Synthesis and Interrelations

  To construct an adequate theory for the seminar, one must navigate the following matrix of commitments.

  | Desideratum | Tension | Required Compromise |
  | :--- | :--- | :--- |
  | **D1 (Action-Guidance)** | vs. **D3 (Continuity)** | Must adopt a specific summation method (e.g., Principal Value) or lexical rule, acknowledging this breaks path-independent continuity. |
  | **D2 (Dominance)** | vs. **Countable Additivity** | Must adopt **Finite Additivity**. Countable additivity forces the rejection of Dominance in infinite Pasadena-like cases (de Finetti's lottery). |
  | **D4 (Iterative Stability)** | vs. **Single-Shot SEU** | Must distinguish between *value* (single shot) and *price* (iterated). A theory may need two metrics: one for choice, one for long-run assessment. |
  | **Meta-Stability** | vs. **Standard SEU** | Standard SEU collapses under reflection if the expectation is undefined. The theory must allow valuation without summation (e.g., via utility bounds or non-Archimedean fields). |

  ### Classification of Existing Approaches relative to Desiderata

  *   **Truncation/Regularization:** Satisfies D1 and Meta-Stability. Fails D3 (Path-Independence). *Verdict:* Pragmatically adequate but theoretically arbitrary.
  *   **Risk-Weighted Expectation:** Satisfies D1 and D2 (mostly). Fails D5 (for pure Bayesians). *Verdict:* Robust, but shifts the burden to justifying the risk function.
  *   **Non-Archimedean/Hyperreal Utility:** Satisfies D1, D2, and D3 (within the hyperreal field). Fails standard interpretation of probability. *Verdict:* Mathematically rigorous but ontologically costly.
  *   **Abstention/Undefined Verdict:** Satisfies D3 and D5. Fails D1 and Meta-Stability. *Verdict:* Theoretically pure but practically useless (agent paralysis).

  ### Final Directive for the Seminar

  An adequate theory of rational choice under undefined expectation cannot simply "fix" the Pasadena paradox by force. It must explicitly **sacrifice** either **Approximation Continuity (D3)** or **Standard Summation Interpretations**.

  The most defensible position for a normative theory is to:
  1.  Retain **Finite Additivity** to preserve Dominance (D2).
  2.  Adopt a **Generalized Summation Method** (e.g., analytic continuation or Principal Value) to ensure Action-Guidance (D1), while explicitly acknowledging the violation of Path-Independent Continuity (D3).
  3.  Ensure **Meta-Stability** by grounding the valuation rule in invariant features of the payoff distribution (e.g., symmetry) rather than arbitrary truncation, allowing a Predictor to stabilize around the rule rather than the value.

  Any theory that claims to retain Standard Expectation, Countable Additivity, and Action-Guidance in the face of the Pasadena Paradox is demonstrably inconsistent. The seminar should focus not on which theory "solves" the paradox, but on which impossibility theorem the theorists are willing to accept.
