      *   *Fortuna:* A raging river that floods unexpectedly. It represents external circumstances, luck, timing, uncontrollable events.
      *   *Virtù:* Not just "virtue" in the moral sense, but prowess, agency, foresight, strength, adaptability.
      *   *Dikes/Embankments:* Preparations made *during calm weather* to channel the flood when it comes.
      *   *Goal:* To maintain the state, secure power, and avoid ruin. It's urgent and high-stakes.

  3.  **Deconstruct the Friend's Analogy (The Target):**
      *   *Roguelike Game:* Randomized levels/enemies (Fortune), Player builds/skill (Virtù).
      *   *Conclusion:* Accept chaos (RNG) because skill prevails long-term.
      *   *Vibe:* Low stakes (it's a game), repeatable attempts, individualistic.

  4.  **Drafting the Correspondence Table:**
      *   River/Flood -> RNG/Map Generation/Enemy Spawns.
      *   Dikes/Preparation -> Meta-knowledge, Build Optimization, Resource Management.
      *   Builder/Prince -> The Player.
      *   Calm Weather -> Between runs / Early game safety.
      *   Ruin/Death -> Game Over screen.

  5.  **Identifying the Breakdown (The Critical Analysis):**
      *   *Stakes:* In *The Prince*, ruin means losing your state, exile, or death. In a game, it's a restart. Machiavelli is not about "over time"; it's about *this* reign.
      *   *Agency/Collective vs. Individual:* Machiavelli is writing about governing *people*. A roguelike is usually a solo power fantasy. Political chaos hurts innocent people, not just the "player."
