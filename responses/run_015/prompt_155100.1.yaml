      *   *Refinement:* Let's stick closer to the *political* nature. **Captain of a Ship in a Storm** is good because if the captain fails, everyone drowns, and you can't reload. But the **City Planner** analogy works best for the "dikes" aspect. Let's propose **Urban Infrastructure Planning** but emphasize the *human cost* of failure.
      *   *Wait, a better one:* **High-Stakes Poker vs. Roguelike.** Poker has hidden info and bluffing (politics). But Roguelike is about PvE. Politics is PvP.
