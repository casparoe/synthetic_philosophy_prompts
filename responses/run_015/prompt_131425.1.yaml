  5.  **Evaluate Reconciliation (Unified Framework?):**

      *   *Kantian:* Hard to reconcile. Kant hates lying. But maybe a broader duty of respect could accommodate *tatemae* if viewed as a duty to preserve dignity? (Weak fit).
      *   *Consequentialist:* Easier. Which produces better outcomes? Depends on the context (culture). But this leads to relativism.
      *   *Virtue Ethics:* Best fit. Prudence (*phronesis*). Knowing *when* to be direct and *when* to be indirect. Truth is a mean between brutal honesty and deceptive flattery.
      *   *Context-Dependence:* Strong argument that moral status is indexed to the social ontology of the participants.

  6.  **Synthetic Corporate Ethics Code:**

