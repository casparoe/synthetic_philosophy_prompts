answer: |-
  **Project Title:** Social Satisficing and the Normative Structure of Group Deliberation

  **Applicant:** [Your Name]
  **Duration:** 3 Months
  **Deliverable:** ~4,000-word working paper

  ### Project Summary

  We know that individuals satisfice. Because cognitive resources are scarce, people stop searching for options once they find one that meets a threshold of acceptability, rather than maximizing utility. This is the bread and butter of bounded rationality literature. But groups satisfice too. Juries stop deliberating, ethics boards halt review, and committees close debate. The standard assumption is that this is just aggregated individual bounded rationality: everyone is tired, so the group stops.

  I think this misses something crucial. In my view, groups often stop searching not because the *cognitive* costs of further search are too high for the members, but because the *social* costs are too high. Pushing for a better option might make you look obstructive, difficult, or overly idealistic. The threshold for "good enough" shifts based on social pressure, not just cognitive load.

  This project aims to distinguish between **Aggregate Individual Satisficing** (where the group stops because members hit cognitive bounds) and **Social Satisficing** (where the group stops because the social cost of continuing outweighs the expected gain). I want to argue that these are structurally different phenomena with different normative failure conditions. If I'm right, we can't just apply individual-level rationality norms to groups; we need a specific account of when social satisficing is legitimate and when it's a pathology of deliberation.

  ### The Research Question

  The core question driving this fellowship is: **Is group-level satisficing merely the aggregation of individual bounded rationality, or is it an emergent phenomenon with distinct normative failure conditions?**

  To make this precise, I need to separate two mechanisms that look identical on the surface (the group stops searching) but have different underlying structures:

  1.  **Cognitive Aggregation:** The group stops because Member A, Member B, and Member C have all individually reached their cognitive limits. The group bound is a function of individual bounds.
  2.  **Social Cost Bound:** The group stops because Member A sees a better option but recognizes that proposing it would violate a social norm (e.g., "don't reopen settled business"), causing reputational damage or relational friction. The group bound is a function of social transaction costs.

  The distinction matters for evaluation. If a jury verdict is the result of Cognitive Aggregation, we might say the process was rational given human limitations. If it's the result of Social Cost Bound, we might say the process failed normatively because relevant information was suppressed to maintain harmony. I want to frame this distinction formally and show that treating social satisficing as just "another preference" misses the structural constraint it imposes on rationality.

  ### Why the Standard Literature Leaves This Open

  The existing literature on bounded rationality is overwhelmingly individualistic. It focuses on heuristics, cognitive load, and information processing limits within a single agent. When this literature moves to groups, it tends to treat the group as a collection of these bounded individuals. The "bound" is still cognitive.

  On the other side, there's a lot of work on social pressure and conformity in groups (groupthink, etc.). But this is usually treated psychologically or sociologically, not decision-theoretically. These social costs are often modeled as just another input into a utility function—i.e., you *prefer* harmony over truth.

  That modeling choice is where the gap is. If I treat the fear of being seen as obstructive as just a preference, then satisficing based on that fear is still "rational" maximization. But I want to argue it's actually a bound on the *search process* itself. It restricts the option space in a way that preferences shouldn't. The literature hasn't quite pinned down whether social pressure acts as a preference (which preserves standard rationality) or a structural bound (which changes the normative rules). This project sits in that gap. I want to show that social satisficing isn't just people wanting to get along; it's a constraint on the deliberation mechanism that requires its own normative framework.

  ### Methodology

  Given the three-month timeline and the conceptual nature of the problem, I'm proposing a method of **conceptual analysis grounded in concrete institutional cases**, framed by decision theory. I will not be conducting empirical studies (surveys, experiments, etc.).

  **Why Conceptual vs. Empirical?**
  Empirical work would require isolating social costs from cognitive costs in real-time deliberation, which is incredibly noisy. You'd need to know what someone *could* have thought vs. what they *didn't* say because of pressure. That's hard to measure. Before we can measure it, we need to know what we're looking for. We need a clear conceptual map of the phenomenon first. If I can't define the distinction rigorously, an empirical study won't know what variables to test.

  **The Approach:**
  1.  **Decision-Theoretic Framing:** I'll sketch a basic model where the "cost of search" includes a social variable. In standard models, cost = time/energy. In my model, cost = time/energy + social friction. I want to show how introducing social friction changes the stopping rule in a way that violates conditions we usually expect rational agents to meet (like independence of irrelevant alternatives, potentially).
  2.  **Two Institutional Cases:** I will apply this framing to two specific contexts:
      *   **Criminal Juries:** Where deliberation stops at a verdict. The social cost here is the pressure to conform to a majority to avoid a hung jury.
      *   **Research Ethics Boards (IRBs):** Where deliberation stops at approval/rejection. The social cost here is the pressure to not delay research unnecessarily or be seen as the "blocker."

  These cases are chosen because they have clear stopping rules (verdict, approval) and high stakes for normative failure. A jury satisficing socially might convict an innocent person to go home; an IRB satisficing socially might approve a risky protocol to avoid conflict with faculty.

  By walking through these cases, I can show where the "social bound" explanation fits better than the "cognitive bound" explanation. For instance, in a jury, a holdout might cognitively *have* more arguments but socially *choose* to stop because they are outnumbered 11-1. That's not a cognitive bound; that's a social one.

  ### Expected Results and Contributions

  The primary output will be a 4,000-word paper arguing that Social Satisficing is a distinct category. Here's what I hope to land on:

  1.  **A Structural Distinction:** I want to demonstrate that social satisficing violates the **independence of the search process from social utility**. In individual bounded rationality, the search stops because the *marginal cost of thinking* exceeds the *marginal benefit of a better option*. In social satisficing, the search stops because the *marginal cost of social friction* exceeds the benefit. This looks similar, but normatively it's different because social friction is endogenous to the group dynamic, whereas cognitive load is exogenous.
  2.  **Normative Failure Conditions:** I hope to show that while individual bounded rationality is often excusable (we can't help being tired), social satisficing is often culpable. It represents a failure of the institution to protect dissenters. If the group structure makes it too costly to search further, the rationality failure lies with the institutional design, not the agents.
  3.  **Decision-Theoretic Implication:** I suspect I can show that group satisficing under social costs might violate something like an independence condition. If the presence of a dominant social norm changes the search threshold regardless of the options available, the group's choice function becomes unstable in a way individual choice isn't.

  Basically, I want to move the conversation from "groups are just collections of biased individuals" to "groups have unique rationality constraints that emerge from their social structure."

  ### Feasibility and Honest Assessment

  Is three months enough?
  Honestly, it's tight, but it should be workable for this scope. The deliverable is only 4,000 words, which is roughly a long journal article or a short conference paper. I'm not building a dataset or running experiments. The risk isn't time; it's scope creep.

  The main risk is getting bogged down in the decision-theoretic modeling. I'm not a formal theorist by training, and I could easily spend six weeks trying to perfect a formal proof when the core insight is philosophical. To mitigate this, I'll keep the formal framing lightweight—just enough to show the structure—and rely more on the institutional cases to carry the weight.

  Another risk is that the distinction collapses. It's possible that social costs *are* just preferences, and I'm making a mountain out of a molehill. If I find that out halfway through, I need to be ready to pivot to arguing why that modeling choice matters, rather than insisting the phenomena are ontologically distinct. But I think the preliminary work suggests the distinction holds.

  ### What Counts as Failure?

  I need to be clear about what would make this project unsuccessful, so I don't spin a null result as a success.

  1.  **Redescribing Compromise:** The biggest risk is that I end up just describing ordinary compromise or bargaining. If "social satisficing" is just "I give up because I want you to like me," then that's standard preference satisfaction, not a new form of bounded rationality. If I can't show that the *search process* itself is bounded (rather than the utility function changing), then the project fails. I need to prove that the *ability to search* is constrained, not just the *desire* to search.
  2.  **Triviality:** If the distinction doesn't lead to different normative evaluations, it's not useful. If both cognitive and social satisficing lead to the same conclusion ("the group did the best it could"), then I haven't added value. The project fails if I can't show that social satisficing requires different institutional fixes than cognitive satisficing.
  3.  **Overgeneralization:** If I try to apply this to *all* groups and lose precision. I'm sticking to juries and ethics boards for a reason. If I try to include corporate boards or families, the mechanism might get too muddy. Staying narrow is key to finishing in three months.

  ### Timeline

  *   **Month 1:** Literature review (focused on bounded rationality + group deliberation) and drafting the decision-theoretic framing.
  *   **Month 2:** Case analysis (Juries and IRBs). Writing the core argument.
  *   **Month 3:** Refining the normative implications, editing, and finalizing the 4,000-word paper.

  ### Conclusion

  This project is about catching a specific kind of rationality failure that slips through the cracks of current theory. We blame individuals for being cognitive misers, but we often ignore how groups punish those who aren't. By framing social satisficing as a distinct phenomenon, I hope to show that some group failures aren't about human limits, but about social structures that make rationality too expensive. It's a small piece of the puzzle, but I think it's a necessary one for understanding collective decision making.

  Thanks for considering this. I think the scope is right for the summer, and honestly, getting this down on paper will help me figure out if theres enough here for a dissertation chapter later.

  [End of Proposal]

