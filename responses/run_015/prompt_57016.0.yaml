answer: |-
  'Your tea's gone cold,' Julian noted, tapping the rim of his mug.

  Eleanor wrapped her hands around the ceramic. 'Has it? I hadn't noticed. I've been thinking about this interoception course I'm doing. The instructor claims there are stretches where you can't tell if your hands are cold or if you're anxious. She says that isn't a failure of attention.'

  'She's stumbling into Timothy Williamson's anti-luminosity argument,' Julian said, leaning forward. 'She wants it to be a mystical unity of sensation; he says it's a structural feature of knowledge. If you can't tell the difference between case $A$ and case $B$, and you know you're cold in $A$, you must know you're cold in $B$. Run that across a spectrum from freezing to boiling, and you end up knowing you're cold when you're burning up. Luminosity collapses.'

  Eleanor sighed. 'She'd hate being told that. But you're moving too fast. Why must I know I'm cold in $B$? Just because the cases are subjectively indistinguishable doesn't mean the knowledge transfers.'

  'Knowledge requires safety,' Julian countered. 'If you believe you're cold in $A$, and $B$ is indistinguishable, you'll believe you're cold in $B$ too. If you aren't actually cold in $B$, your belief in $A$ wasn't safe. It could easily have been false. So you didn't know it in $A$.'

  'That assumes the belief is fixed across the cases,' Eleanor said. 'But why think my doxastic response must be identical in indistinguishable cases? I might withhold belief in the borderline ones.'

  'But where do you draw the line?' Julian pressed. 'If you know you're cold in the clear case, there must be a last case where you know. Call it case $n$. In case $n+1$, you don't know. But $n$ and $n+1$ are minute shifts in temperature. How can your epistemic status shift so drastically when the phenomenology hasn't meaningfully changed? That's the sorites. You're forced to admit a margin for error. To know you're cold, you must be cold enough that you couldn't easily have been wrong. That margin eats the luminous state alive.'

  Eleanor stirred her tea. 'You're treating "feeling cold" as an external condition like "being cold". But the luminous claim is about the phenomenal state itself. If I feel cold, that feeling is present. The existence of the feeling guarantees the truth of the belief that I have the feeling. There's no gap for error to slip into.'

  'Williamson anticipates that,' Julian said. 'Apply the series to "feeling cold" instead of "being cold". Start with a vivid feeling of coldness. Reduce it by imperceptible degrees until you feel nothing. Is there a last moment where you feel it and know you feel it? If you know you feel it in $n$, and $n+1$ is indistinguishable, you'll believe you feel it in $n+1$. But in $n+1$, the feeling has ceased. So your belief is false. So you didn't know in $n$. The phenomenology isn't self-intimating because the boundaries of phenomenology are vague.'

  'That assumes knowledge is purely a matter of internal discrimination,' Eleanor replied. 'But perhaps luminosity isn't about satisfying a safety condition across possible worlds. It's about the nature of consciousness. If I am in pain, I don't need to check. The pain isn't a fact I observe; it's a state I inhabit. Your margin for error applies to observational knowledge, not constitutive awareness.'

  'But if you can't know you're in the state, you can't know that you know,' Julian said, shifting the ground. 'That's the KK principle. If luminosity fails, KK goes with it. You can't iterate knowledge of your own mind if the base level is insecure.'

  'I'm not sure they stand or fall together,' Eleanor said. 'I might concede that I don't *know* I feel cold in the borderline cases—perhaps "knowledge" is too strong a verb for mere acquaintance. But I can maintain that the state is luminous in the sense that it is directly present to me. Luminosity is ontological; KK is epistemological.'

  'That's a retreat,' Julian smiled. 'You're saving luminosity by stripping it of epistemic force. If it doesn't yield knowledge, it's just a glow without heat. And if you keep KK, you're in worse trouble. If KK holds, then if you know, you know that you know. But if margins for error apply, then knowing that you know requires an even wider margin. You'd need to be even colder to know that you know you're cold. It regresses. The only way to stop the regress is to deny KK.'

  'Or deny that the margin widens,' Eleanor suggested. 'Why should the margin for error expand with iteration? If I know $p$, and knowing $p$ puts me in a state $S$, and $S$ is luminous, then I know $S$. The safety condition is satisfied by the luminosity of $S$ itself.'

  'But $S$ isn't luminous!' Julian insisted. 'We just agreed the sorites kills it. You can't use luminosity to save KK if luminosity is what's being attacked. Look, the intuitive pull of KK is that knowledge is a strong position. But if knowledge requires ruling out relevant alternatives, and you can't rule out the neighbouring case in the series, you don't know. And if you don't know, you certainly don't know that you know.'

  Eleanor paused. 'Suppose I grant the margin for error for "cold". Does it apply to "anxious"? My teacher says the sensations blend. If the concepts are vague, maybe the error is linguistic, not phenomenal.'

  'If the concepts are vague, you can't know you fall under them in borderline cases,' Julian said. 'But even if the concepts are precise, the feelings aren't. The real damage is to the idea that the mind is transparent to itself. We are not luminous beings. We're opaque, embedded in the world, subject to the same margins of error as a thermometer.'

  'That's a bleak anthropology,' Eleanor said. 'You're saying I'm less certain of my own anxiety than I am of the table in front of me?'

  'I'm saying you're equally subject to reliability conditions,' Julian said. 'The table might be a hologram; your anxiety might be indigestion. In both cases, to know, you need a buffer against error. That buffer means you can't know in the edge cases. And since there are always edge cases, you never have the absolute certainty the internalist craves.'

  'But KK doesn't require absolute certainty,' Eleanor argued. 'It just requires that if you're in a position of knowledge, you're in a position to recognise that position. Why can't I recognise my own reliability? If I know my senses are generally trustworthy, I know that I know.'

  'Because "generally" doesn't cover the specific case,' Julian said. 'You need to know you're not in the margin of error *now*. And you can't know that, because knowing it would require an even smaller margin. It's a slippery slope. You either accept that knowledge is inexact and non-luminous, or you deny the sorites. But denying the sorites means believing in magical boundaries where a microscopic change flips knowledge to ignorance.'

  Eleanor looked at her hands. 'Perhaps the teacher is right, then. Not about the mysticism, but about the limitation. We can't tell. And that not-telling isn't a failure.'

  'It's not a failure,' Julian agreed, softening. 'It's just physics. And epistemology. You aren't a glass house, Eleanor. You're a brick one. Some light gets in, but you can't see all the way through.'

  'Speaking of which,' she said, lifting her mug. 'This tea is definitely cold now.'

  'Are you sure?' Julian asked. 'Or are you just anxious about the argument?'

  Eleanor smiled, though she didn't drink. 'I know I'm not in a position to know. Does that count?'

  'It counts as the beginning of wisdom,' Julian said. 'But don't expect it to keep you warm.'
