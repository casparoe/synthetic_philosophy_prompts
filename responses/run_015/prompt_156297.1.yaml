answer: |-
  **MEMORANDUM**

  **TO:** Charter Revision Commission
  **FROM:** Commission Secretary
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation on Petition for Referendum Mechanism vs. Citizens' Assembly

  **Recommendation**

  The Commission should reject the petitioned charter amendment establishing a low-threshold referendum mechanism. Instead, we should propose a standing Citizens' Assembly with specific authority over contested zoning and housing ordinances.

  The proposed Assembly shall consist of forty residents selected by sortition, stratified to match the city's demographic and geographic composition. Membership should be open to all residents aged 18+, regardless of voter registration status. For ordinances involving zoning changes or affordable housing developments, the Council must refer the measure to the Assembly prior to final passage. The Assembly's recommendation shall be binding unless the City Council overrides it within thirty days by a two-thirds vote.

  **Defining the Popular Will**

  This decision turns on how we define the "will of the people" our charter should track. We are currently using this phrase to mean three different things: the aggregate of present preferences (headcount), the judgment the electorate would reach under conditions of information and deliberation (reasoning), or the authorization voters gave representatives at the last election (mandate).

  This Commission should design procedures to track **informed judgment**. Raw aggregate preference is vulnerable to impulse, misinformation, and the exclusion of those without a vote. Electoral authorization is too blunt an instrument for specific policy disputes. A charter should not merely count heads; it should structure decision-making so that heads are counted after reasons are weighed. The Citizens' Assembly model prioritizes deliberation over plebiscite, aligning our procedures with the judgment voters would reach if they had the time and expertise the Assembly affords.

  **The Risks of the Petitioned Referendum**

  The petitioned mechanism—a 5% signature threshold, 30-day window, simple majority vote, and no turnout floor—presents significant governance risks.

  First, regarding **elite capture**: The petition argues this mechanism prevents officials from overriding the people. In practice, low-salience off-year referendums hand veto power to whichever side can organize and pay for signature gathering and turnout. A 5% threshold is exceptionally low; well-funded interest groups can easily manufacture "grassroots" opposition to projects that benefit the broader public but impose localized costs. The recent hearing showed 400 speakers against the project; a referendum allows a mobilized minority to veto a regional priority without bearing the responsibility of governing the whole city.

  Second, regarding the **boundary problem**: The facility's future residents are mostly not current voters. A substantial share of nearby residents (renters, non-citizens) cannot vote in municipal elections. The referendum model enfranchises only the current voter roll. It systematically excludes those most affected by the housing decision: the prospective tenants who need support services and the non-voting neighbors who live with the facility. A ballot measure codifies this exclusion, ensuring that policy is made by those insulated from its consequences.

  **The Citizens' Assembly Alternative**

  The Citizens' Assembly addresses these defects concretely.

  1.  **Inclusion:** By selecting participants from all residents rather than registered voters, the Assembly enfranchises the non-voting neighbors and allows for the inclusion of stakeholder perspectives often missing from ballot boxes. While future residents cannot sit on the Assembly, the sortition process ensures a cross-section of the community that is statistically more likely to reflect diverse interests than a self-selected referendum electorate.
  2.  **Deliberation over Mobilization:** Sortition neutralizes the advantage of money and organization. Participants are paid to serve, removing the barrier to entry for working residents. The requirement to issue a recommendation with reasons forces engagement with evidence rather than slogans.
  3.  **Governance Stability:** The override mechanism (2/3 Council vote) preserves ultimate elected accountability while raising the bar for ignoring the Assembly. This prevents the gridlock proposed in the petition (a two-year bar on reconsideration) while ensuring the Council cannot lightly dismiss resident input.

  **Engaging the Counter-Argument**

  The strongest argument for the petitioned referendum is **direct accountability**. Proponents argue that elected officials ignored 300 opposed residents at the hearing to satisfy a regional authority. They contend that only a veto threat forces officials to listen. There is truth to this: representatives can become insulated from local pain.

  However, the referendum is a blunt instrument that solves insulation by creating paralysis. It treats all opposition as equal, regardless of whether it is based on prejudice or property value protection. The Citizens' Assembly retains accountability—the Council can still override—but requires them to publicly justify doing so against a deliberative body representing their actual constituents, not just their voters. This shifts the burden from "blocking the will" to "defending the decision," which is a healthier dynamic for a representative democracy.

  **Conclusion**

  The petitioned referendum risks converting our charter into a tool for minority veto power, exacerbating the exclusion of non-voters, and privileging organized money over community judgment. The Citizens' Assembly offers a path to legitimize difficult decisions through inclusion and reason rather than mobilization and headcounts.

  We should reject the petition and draft the Assembly amendment for the November ballot.

  **Parameters for Drafting:**
  *   **Selection:** Sortition from resident database (including non-voters).
  *   **Scope:** Mandatory referral for zoning and housing ordinances.
  *   **Effect:** Binding recommendation unless overridden by 2/3 Council vote within 30 days.
  *   **Support:** Staffing and stipends provided by the City to ensure participation.

  This approach respects the people's voice without surrendering the city's capacity to govern for the whole community.
