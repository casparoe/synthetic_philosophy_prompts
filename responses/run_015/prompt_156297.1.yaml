      *   *Philosophy:* We should track informed judgment, not raw aggregate preference.
      *   *Referendum Flaws:* 5% is too low (elite capture), no turnout floor (minority rule), excludes affected non-voters.
      *   *Assembly Benefits:* Sortition avoids money power, can include non-voter residents, forces deliberation.
      *   *Boundary Problem:* Explicitly discuss how Assembly solves the "future resident" exclusion better than a ballot measure.
      *   *Counter-argument:* Acknowledge the Referendum argument (direct accountability). Refute it (complexity requires nuance).
      *   *Closing:* Call to action.

  6.  **Review against Constraints:**
