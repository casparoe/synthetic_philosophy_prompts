      *   Address boundary problem? (Yes, future residents/non-voters).
      *   Address elite capture? (Yes, signature gathering vs. sortition).
      *   Define popular will? (Yes, informed judgment).
      *   Concrete parameters? (Yes, for the Assembly).

  7.  **Writing - Focusing on Clarity and Persuasion:**
      *   *Opening:* Direct recommendation.
      *   *Core Principle:* Define "will of the people."
      *   *The Referendum Risk:* Why the petition fails the test.
      *   *The Assembly Solution:* Why it works better.
      *   *Boundary & Capture:* Specific paragraphs.
      *   *Conclusion:* Unified path forward.

      *(Self-Correction on Word Count)*: I need to be concise. Avoid fluff. Get straight to the arguments.

      *(Refining the "Popular Will" section)*: Make sure this is distinct. "The commission must decide whether we are tallying heads or weighing reasons."

      *(Refining the "Boundary Problem")*: Ensure I mention the supportive housing residents specifically.

      *(Refining the "Elite Capture")*: Mention the 5% threshold and off-year turnout.

      *(Final Polish)*: Check tone. Respectful but firm.

