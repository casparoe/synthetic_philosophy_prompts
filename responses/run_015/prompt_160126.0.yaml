answer: |-
  Your intuition about "exitability" is not unprincipled; it is actually a more robust diagnostic than "legibility lag." The lag matters, but it is secondary to the **locus of agency**. Your discomfort with personal carbon rationing stems from a distinction between regulating a *practice* one opts into (fishing, prescribing) and regulating *existence* within an infrastructure one cannot easily opt out of (driving, heating).

  To systematize your verdicts without sacrificing the Fish/Carbon distinction, I propose repairing your principle by adding a dimension of **Discretionary vs. Structural Agency**.

  ### The Repaired Principle: The Agency-Monitoring Matrix

  Governance legitimacy tracks two variables:
  1.  **Discretion:** Is the resource use a voluntary role (occupation, hobby) or a structural condition of participation in society (breathing, commuting, housing)?
  2.  **Peer Monitoring:** Can the community of users detect overuse at a cost lower than the damage caused?

  This yields four quadrants that map cleanly onto your verdicts:

  | | **High Peer Monitoring** (Visible/Local) | **Low Peer Monitoring** (Hidden/Aggregate) |
  | :--- | :--- | :--- |
  | **Discretionary Agency** (Opt-in roles) | **Self-Governance**<br>*(Alpine Pasture)* | **External/Professional Authority**<br>*(Cod, Antibiotics)* |
  | **Structural Agency** (Opt-out conditions) | **Social Norms**<br>*(Office Fridge)* | **Systemic Regulation (Not Personal)**<br>*(Carbon, Archive)* |

  #### Why this saves the Fish/Carbon pair
  *   **Fish (Discretionary + Low Monitoring):** Fishing is a trade. In the 1990s, industrial technology broke peer monitoring (you can't see how many fish a trawler caught at sea). Because it is a voluntary occupation, coercive limits are legitimate. The state regulates the *license*, not the *person*.
  *   **Carbon (Structural + Low Monitoring):** Emitting is woven into the infrastructure of life. Peer monitoring is impossible (I cannot see your exhaust). Because it is structural, *personal* rationing is illegitimate (it punishes existence). The remedy must be *systemic* (fuel standards, grid decarbonization) rather than *personal* (rationing). This preserves your resistance to rationing while acknowledging the crisis.

  #### Why this fixes the Fridge/Archive distinction
  You noted you couldn't say why the Archive needs authority but the Fridge does not, other than scale. Under this matrix, it is about **Irreversibility + Monitoring**.
  *   **Fridge:** Structural (everyone eats), but High Monitoring (I see your spoiled milk) and Low Irreversibility (milk is cheap). Result: Norms.
  *   **Archive:** Discretionary (department members), but Low Monitoring (who filed the bad metadata?) and High Irreversibility (knowledge loss is permanent). Result: Designated Authority. The "sludge" is a monitoring failure that norms cannot fix.

  ---

  ### Verdicts on Your New Cases

  #### 1. The Groundwater Aquifer (Smallholders + Solar Pumps)
  **Verdict:** **External/Collective Authority (The "Cod" Outcome).**
  *   **Analysis:** Historically, groundwater among smallholders often functioned like the *Alpine Pasture* (Discretionary + High Monitoring: you hear the diesel pumps, you see the water table drop locally).
  *   **The Shift:** Cheap solar pumps remove the marginal cost of extraction and make monitoring difficult (no fuel purchases to track, silent operation). This degrades Peer Monitoring from High to Low.
  *   **Application:** Even though the users are smallholders (Discretionary), the loss of visibility pushes this into the "Cod" quadrant. Self-governance will likely fail because the "lag" between pumping and aquifer collapse is now hidden by the technology. They require metering or state-imposed quotas.

  #### 2. The Peer Review Pool
  **Verdict:** **Professional Authority (The "Antibiotic" Outcome).**
  *   **Analysis:** This is a labor commons. Supplying reviews is Discretionary (academic labor), but Monitoring is Low (anonymous, effort is invisible).
  *   **Application:** Relying on "self-governance" (gentlemen's agreements) leads to the tragedy you describe (few supply, many draw down). Because the activity is a professional role, coercive mandates are legitimate. Journals or tenure committees must enforce contribution quotas (e.g., "no submissions without completed reviews"). This is structurally identical to antibiotic prescribing: a professional privilege contingent on stewardship.

  #### 3. The Reverse Case (Anti-Commons: Gene Sequences/Urban Land)
  **Verdict:** **Yes, the same apparatus handles this.**
  *   **Analysis:** The tragedy of the commons is *too many users, too few constraints*. The tragedy of the anti-commons is *too many constraints, too few users*. Both are failures in the **distribution of decision rights**.
  *   **Application:**
      *   **Commons:** Decision rights are too diffuse; they must be *constrained* (by norms, state, or authority).
      *   **Anti-Commons:** Decision rights are too fragmented; they must be *aggregated*.
      *   **Gene Sequences:** Requires patent pools or compulsory licensing (consolidating veto power).
      *   **Urban Land:** Requires eminent domain or zoning overrides (consolidating veto power).
  *   **Principle:** The goal is not "private" vs. "public," but **actionable agency**. If agency is too fragmented to use the resource (anti-commons), authority must consolidate it. If agency is too diffuse to save the resource (commons), authority must constrain it.

  ### Summary for Teaching
  When teaching this, you can present the "Tragedy" not as a single story, but as a **diagnostic of agency**:

  1.  **Can the users see each other?** (Monitoring)
  2.  **Can the users quit the activity without quitting society?** (Discretion)
  3.  **Is the damage reversible?** (Stakes)

  *   **Alpine:** Yes / Yes / Yes → **Self-Governance.**
  *   **Cod:** No / Yes / No → **State Regulation.**
  *   **Carbon:** No / No / No → **Systemic Infrastructure Change (Resist Personal Rationing).**
  *   **Fridge:** Yes / No / Yes → **Norms.**
  *   **Archive:** No / Yes / No → **Designated Authority.**

  This allows you to keep your verdicts without contradiction. The "exitability" hunch you had was the key: we tolerate coercion on *roles* much more readily than on *persons*.
