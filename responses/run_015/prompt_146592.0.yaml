answer: |-
  ### Desiderata for a Criterion of Mechanistic Identity

  In the context of mechanistic anomaly detection (MAD), the goal is to distinguish between a system that is functioning via the *same* internal causal process as a reference model and one that has adopted a structurally distinct process to achieve similar ends. A criterion of mechanistic identity must navigate between the Scylla of behaviorism (where only input-output mappings matter) and the Charybdis of physical token-identity (where only exact bit-for-bit matches count). The following desiderata specify the necessary conditions for such a criterion.

  #### 1. Counterfactual Fidelity
  *   **Specification:** Two instances realize the same mechanism only if they support the same set of counterfactual dependencies. That is, interventions on corresponding internal variables must yield corresponding changes in downstream variables and outputs, holding background conditions fixed.
  *   **Motivating Failure Mode:** *The Look-Ahead Table.* Consider a neural network that classifies images via feature detection versus a lookup table that memorizes the training set and hard-codes the test set. Both produce identical outputs on the distribution of interest. However, intervening on the "feature detector" node in the network changes the output, whereas intervening on the corresponding memory address in the lookup table does not (or affects a different image). Without counterfactual fidelity, MAD cannot detect a system that has switched from generalization to memorization.
  *   **Status:** **Non-negotiable.** Without this, the criterion collapses into bare functional equivalence, failing to detect structural deviations that preserve performance.

  #### 2. Organizational Isomorphism
  *   **Specification:** The causal graph governing the instances must be isomorphic with respect to relevant nodes and edges. There must be a mapping between the components of Instance A and Instance B such that the pattern of causal influence (who affects whom) is preserved.
  *   **Motivating Failure Mode:** *The Algorithmic Swap.* Consider a system that computes a solution using a serial chain of reasoning steps versus a system that computes the same solution using a parallel, distributed constraint-satisfaction process. Both are causal and counterfactually sensitive, but the *topology* of information flow differs. If MAD is tasked with ensuring a model uses a specific "chain of thought" for safety verification, accepting the parallel process as the "same mechanism" would be a false negative.
  *   **Status:** **Non-negotiable.** This distinguishes mechanism from function. If the causal architecture changes, the mechanism has changed, even if the input-output map and local counterfactuals appear similar.

  #### 3. Implementational Abstraction (Substrate Neutrality)
  *   **Specification:** The identity criterion must remain invariant under changes to the physical or numerical substrate that do not alter the causal organization. This includes changes in hardware, floating-point precision, or random seeds that result in different weight initializations but convergent structural solutions.
  *   **Motivating Failure Mode:** *The Quantization Drift.* A model is quantized from 32-bit to 8-bit precision. The weights change slightly, and the activation values shift numerically. If the criterion requires exact numerical matching, every inference run on different hardware would flag as an anomaly. We need to tolerate "noise" in the implementation that preserves the causal logic.
  *   **Status:** **Negotiable.** While essential for most practical AI safety applications, a strict physicalist camp might argue that substrate changes *do* constitute mechanistic changes. However, for MAD, this is usually a methodological commitment to focus on logic rather than physics.

  #### 4. Granularity Invariance
  *   **Specification:** The criterion must specify a level of abstraction (e.g., individual neurons, circuits, or layers) and remain stable under minor perturbations within that level. It must define what counts as a "component" versus "noise" within a component.
  *   **Motivating Failure Mode:** *The Micro-rewiring.* In a neural network, two neurons might swap roles or split a function between them differently while preserving the layer's overall input-output map. If the criterion is too fine-grained (individual neuron identity), this looks like a mechanism change. If too coarse (whole layer identity), it misses the internal reorganization. The criterion must define the relevant grain size.
  *   **Status:** **Negotiable.** This is a commitment to a specific scale of analysis. Different methodological camps may prioritize circuit-level identity over neuron-level identity.

  #### 5. Interventional Robustness (Degeneracy Tolerance)
  *   **Specification:** The criterion must distinguish between structural change and redundant wiring. If a system has backup pathways (degeneracy) and switches to a backup without altering the primary causal logic, this should not necessarily count as a mechanism change, provided the *capacity* for the original pathway remains or the functional role is preserved identically.
  *   **Motivating Failure Mode:** *The Failover Switch.* A system is designed with redundant circuits for reliability. If the primary circuit fails and the backup engages, the active physical path changes. A rigid "Organizational Isomorphism" might flag this as a new mechanism. MAD needs to tolerate this if the *logic* of the failover was part of the original mechanism design.
  *   **Status:** **Non-negotiable (with nuance).** Without this, the criterion is too brittle for real-world systems. However, defining "redundancy" vs. "structural drift" is the difficult part.

  ---

  ### Compatibility Analysis: The Trade-off

  There is a fundamental tension between **Counterfactual Fidelity** (Desideratum 1) and **Implementational Abstraction** (Desideratum 3). These are jointly unsatisfiable at the limit without introducing a privileged level of description.

  *   **The Conflict:** To maximize counterfactual fidelity, one must track specific variables and their precise causal influences. This requires high-resolution access to the system's state. To maximize implementational abstraction, one must ignore specific physical or numerical realizations, grouping distinct micro-states into the same macro-state.
  *   **The Trade-off:** If you demand high sensitivity to interventions (e.g., "does flipping this specific bit change the output?"), you become sensitive to substrate noise (violating Abstraction). If you demand high substrate independence (e.g., "do these two weight matrices compute the same function?"), you lose the ability to distinguish distinct internal causal pathways that converge on the same result (violating Fidelity or Organizational Isomorphism).
  *   **Resolution:** The trade-off is unavoidable. A criterion of mechanistic identity cannot be scale-free. It must stipulate a **Level of Abstraction**. One cannot have a criterion that is simultaneously maximally sensitive to micro-interventions and maximally invariant to macro-implementation. The practitioner must choose a grain size (e.g., "causal circuits" rather than "weights") where the mapping from substrate to mechanism is many-to-one, but the mapping from mechanism to counterfactual profile is one-to-one.

  ---

  ### Conceptual Assessment of Current Practices

  Current informal practices in mechanistic interpretability and causal modeling exhibit significant gaps when measured against these desiderata.

  **Mechanistic Interpretability:**
  Practices such as activation patching and causal tracing score highly on **Counterfactual Fidelity**. They actively intervene to test dependencies. However, they often struggle with **Organizational Isomorphism**. Current methods frequently identify "important" neurons or directions but lack a formal language to describe the *graph structure* connecting them. Consequently, it is difficult to formally prove that two models share the same mechanism rather than just sharing important features. Furthermore, **Implementational Abstraction** is often handled heuristically; practitioners assume that similar activation patterns imply similar mechanisms, but there is no rigorous bound on how much weight drift is permissible before the mechanism is considered "different."

  **Causal Modeling:**
  Formal causal modeling excels at **Organizational Isomorphism** and **Counterfactual Fidelity** by defining explicit Directed Acyclic Graphs (DAGs). However, it often fails at **Granularity Invariance** in the context of modern machine learning. Causal models typically assume discrete, separable variables, whereas neural mechanisms are dense, continuous, and highly entangled. Applying causal modeling to neural networks often requires an arbitrary discretization step that violates the continuous nature of the substrate, leading to fragility.

  **Overall Adequacy:**
  The field currently lacks a unified formalism that bridges the gap between continuous parameter spaces and discrete causal graphs. Most approaches implicitly prioritize **Counterfactual Fidelity** at the expense of **Organizational Isomorphism**, relying on the assumption that if the local interventions match, the global structure matches. This is a dangerous assumption for MAD, as it leaves the door open for "adversarial mechanisms" that mimic local causal profiles while globally restructuring the computation to hide malicious intent. Until a criterion can rigorously define mechanism identity at a specific level of abstraction without collapsing into functionalism, mechanistic anomaly detection will remain vulnerable to structural deception.
