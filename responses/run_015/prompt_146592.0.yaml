      *(Refining Desideratum 2)*: Call it "Organizational Isomorphism."
      *(Refining Desideratum 3)*: Call it "Implementational Abstraction."

      *(Refining the Trade-off)*: The "No Free Lunch" theorem of mechanistic identity. You need a privileged level of description.

  8.  **Final Polish:** Check against the prompt's specific requests.
