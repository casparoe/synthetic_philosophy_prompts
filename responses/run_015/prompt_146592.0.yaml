      *   **Context:** Mechanistic Anomaly Detection (MAD). The goal is to flag structural deviations from a reference mechanism even if surface function looks similar.
      *   **Core Question:** What conditions must be satisfied for two instances to count as realizing the *same* mechanism? (Criterion of Mechanistic Identity).
      *   **Task:** Provide a full specification of desiderata for this criterion.
      *   **Requirements for each Desideratum:**
          *   State the concrete case/failure mode motivating it (e.g., redundant wiring vs. identical I/O but different internals).
          *   Mark as *Non-negotiable* (essential to avoid functionalism or token-identity) or *Negotiable* (methodological commitments like substrate independence).
      *   **Compatibility Analysis:** Indicate if any subset is jointly unsatisfiable (trade-offs), specifically regarding intervention-sensitive specificity vs. cross-substrate generalization.
      *   **Conclusion:** Brief conceptual assessment of current informal practices in mechanistic interpretability and causal modeling against this list.
      *   **Constraints:** No bibliographies, named citations, or reading lists. Evaluation based on conceptual adequacy alone.

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *Mechanistic Identity:* This is a classic philosophy of science/metaphysics problem (Craver, Bechtel, etc.), but applied here to AI/ML safety (MAD).
      *   *The Trap:* If we define "same mechanism" too loosely (just I/O), we miss internal deception or structural drift. If we define it too strictly (exact physical state), we can't generalize across runs or hardware.
      *   *Key Tension:* Abstraction vs. Specificity. We need to abstract away from physical noise (substrate) but retain causal structure (mechanism).
      *   *Desiderata Candidates:*
          1.  Causal Invariance (Interventions matter).
          2.  Functional Adequacy (It must do the job).
          3.  Structural Isomorphism (The graph looks the same).
          4.  Substrate Independence (Hardware doesn't matter).
          5.  Temporal Stability (It persists over time).
          6.  Granularity/Scale (At what level do we look?).

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Desideratum 1: Causal/Counterfactual Alignment.*
          *   *Motivation:* Two systems produce the same output for actual inputs, but if I wiggle an internal node, one breaks and the other compensates. (The "Identical I/O, Divergent Internals" case).
          *   *Status:* Non-negotiable. Without this, it's just behaviorism.
      *   *Desideratum 2: Structural/Topological Correspondence.*
          *   *Motivation:* A fully connected network vs. a sparse chain. Even if they compute the same function, the *pathway* is different. MAD needs to know if the *path* changed.
          *   *Status:* Non-negotiable. This distinguishes mechanism from function.
      *   *Desideratum 3: Substrate Neutrality.*
          *   *Motivation:* Running the same model on GPU A vs. GPU B, or float32 vs. float16. We don't want to flag hardware noise as mechanism change.
          *   *Status:* Negotiable. Some hard-realists might argue physical implementation matters, but for MAD, we usually want abstraction.
      *   *Desideratum 4: Granularity Invariance (Scale).*
          *   *Motivation:* Looking at individual neurons vs. whole layers. Is a mechanism the neuron or the circuit?
          *   *Status:* Negotiable. Depends on the chosen level of analysis.
      *   *Desideratum 5: Interventional Robustness (Redundancy).*
          *   *Motivation:* If a system has backup pathways, does breaking one count as a mechanism change? We need to tolerate "degenerate" wiring that preserves the causal graph's logic.
          *   *Status:* Non-negotiable (with nuance). We need to distinguish *structural* redundancy from *mechanistic* change.

  4.  **Refining the "Non-negotiable" vs. "Negotiable" Classification:**

      *   *Non-negotiable:* Must avoid "Black Box Functionalism" (I/O only) and "Physical Token Identity" (exact bit-match).
      *   *Negotiable:* Specific choices about *how* to abstract (e.g., exact isomorphism vs. homomorphism, deterministic vs. probabilistic mapping).

  5.  **Analyzing Joint Satisfiability (The Trade-off):**

      *   *The Conflict:* Fine-grained intervention sensitivity requires looking at specific low-level variables. Cross-substrate generalization requires ignoring low-level physical details.
      *   *The Tension:* If I demand exact causal invariance at the neuron level, I lose substrate independence (weights shift slightly during retraining or quantization). If I demand high-level abstraction, I might miss subtle internal misalignments (e.g., a deceptive alignment that uses a different circuit).
      *   *Verdict:* There is a trade-off. You cannot maximize both sensitivity to micro-perturbations and invariance to macro-implementation details simultaneously without a chosen "level of abstraction."

  6.  **Assessing Current Practices:**

      *   *Mechanistic Interpretability:* Often relies on activation patching/causal tracing. Good on interventions, sometimes weak on formal structural definitions. Often assumes substrate independence implicitly but struggles when weights shift.
      *   *Causal Modeling:* Strong on structure, but often assumes discrete variables or known DAGs, which is hard in dense neural nets.
      *   *Gap:* Lack of a unified formal language that bridges the causal graph with the continuous parameter space without collapsing into functionalism.

  7.  **Drafting the Response (incorporating constraints):**

