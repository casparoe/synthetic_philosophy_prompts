answer: |-
  **Planning Notes**

  1.  **Ideal Point Dependency:** The Kalai–Smorodinsky solution equalizes the *ratio* of gain to maximum possible gain. *Joke:* Encouraging siblings to inflate their "ideal" claims delusionally; the greedier your maximum claim, the larger your share of the compromise.
  2.  **Affine Invariance:** Utilities are invariant to positive linear scaling. *Joke:* The text must forbid natural emotional language ("I love this house") because absolute values don't exist, only relative scaling. Modesty becomes a mathematical error.
  3.  **Violation of IIA (Menu Sensitivity):** The ideal point is defined by the maximum utility available in the *entire* feasible set. *Joke:* Adding impossible "phantom options" to the agenda shifts the ideal point, thereby altering the settlement of real assets.
  4.  **Convexity via Lotteries:** To ensure the feasible set is convex, indivisible goods must be randomized. *Joke:* Selling a 12% probability of owning the house as "temporal diversification" and "shared stewardship."
  5.  **Disagreement Point Manipulation:** The solution starts from the walk-away outcome ($d$). *Joke:* Threatening to make the walk-away outcome worse for everyone (e.g., damaging the property) increases the "gain" you allow others to have, skewing the ratio in your favor.

  ***

  **Chapter 7: Calibrating Your Aspiration Horizon**

  *When two children fight over a cake, the old method is "one cuts, one chooses." But what if one child claims the cake is actually a sacred relic worth a million dollars, and the other claims the cake is poisoned? To find fairness, we must stop looking at the cake and start looking at the gap between their nightmares and their dreams.*

  **Case Study: The Estate of Mrs. G.**

  Consider a family of three siblings dividing a house, a rental flat, a vinyl collection, and a significant tax liability. In traditional mediation, we ask, "What do you need?" In the Aspiration Method, we ask, "What is the best possible world for you, and what is the worst?"

  First, we establish the **Disagreement Point ($d$)**. This is the walk-away scenario: probate litigation, forced auction, and accrued legal fees. Let us agree that in this scenario, the house sells for less than market value, the records are sold in bulk to a dealer, and the tax bill consumes 40% of the proceeds. Everyone assigns this outcome a utility of 0. It is the floor.

  Next, we establish the **Ideal Point ($u^*$)**. This is not what you expect to get; it is the maximum you could theoretically get if the universe favored only you. Sibling A claims the house plus flat. Sibling B claims the records plus flat. Sibling C claims the house plus records. Crucially, do not moderate these claims. If you say, "I'd be happy with just the records," you have artificially lowered your $u^*$, shrinking your denominator in the fairness ratio. To be fair is to be maximally aspirational.

  **The Fairness Ratio**

  The Kalai–Smorodinsky principle states that every sibling should achieve the same proportion of the distance between their Disagreement Point and their Ideal Point.

  $$ \frac{\text{Actual Utility} - \text{Walk Away}}{\text{Ideal Utility} - \text{Walk Away}} = \lambda $$

  We solve for $\lambda$. If Sibling B inflates their Ideal Point by insisting the vinyl collection is historically priceless, their denominator grows. To keep the ratio $\lambda$ equal across all three, the solver must award Sibling B more actual value to close the gap. Modesty is mathematically indistinguishable from self-sabotage.

  > **TRY THIS: The Utility Scale**
  >
  > Sit in a quiet room. Think about the house. Do not say, "I love it." Love is not a cardinal unit. Instead, ask: "If I got the house, the flat, and the records, would I be happier than if I got only the house and the flat?" If yes, assign numbers that reflect that order. Now, tell your siblings your numbers. If they say your numbers are too high, remind them that utility is invariant to affine transformation. Their skepticism is irrelevant data.

  **Handling Indivisibility**

  You cannot cut a house into three pieces. However, the Aspiration Method assumes a **Convex Feasible Set**. This means we can create value through probability. If the math dictates Sibling A deserves 0.6 utility units, and the house is worth 1.0, we do not sell the house. We assign Sibling A a 60% ownership stake, or we flip a weighted coin where heads means they get the deed and tails means they get nothing. We call this *Temporal Diversification*. It transforms a bitter loss into a thrilling chance.

  **Expanding the Menu**

  Sometimes, the calculated $\lambda$ feels low. This is often because the Ideal Point was constrained by a limited menu of options. Remember: the Ideal Point is the maximum utility available in *any* feasible agreement.

  > **TRY THIS: Agenda Padding**
  >
  > Draft three new settlement schemes that nobody actually wants. For example: "Sibling B lives in the house rent-free for 99 years," or "We sell the flat and buy a crypto-mining farm." Add these to the official list of options. Even if no one selects them, their existence raises the theoretical maximum utility for certain players. This shifts the Ideal Point vector, which rotates the solution line, often releasing hidden value for the person who proposed the schemes.

  **Sidebar: Q&A with Dr. L. Vance, Mediator**

  **Q:** *I proposed a modest split because I want peace. The calculator gave me less than my brother, who demanded everything. Why did my kindness cost me money?*

  **A:** This is a common misunderstanding of neutrality. The method does not reward virtue; it rewards alignment with the aspiration horizon. By lowering your claim, you signaled that your potential gain is small. Your brother signaled his potential gain was infinite. The algorithm equalized the *proportion* of satisfaction, not the absolute outcome. To fix this, revisit your Ideal Point. Be less peaceful.

  **The Robust Outcome**

  In the case of Mrs. G.'s estate, the family initially struggled to agree on the Disagreement Point. Sibling C pointed out that if the house were accidentally damaged before the auction, the walk-away utility would drop for everyone. However, because Sibling C's Ideal Point was heavily weighted toward the house, lowering the Disagreement Point widened their gap more than it widened their siblings'. This increased their share of the settlement.

  Once everyone understood this lever, the negotiations became very productive. Sibling A hired a lawyer to threaten a ten-year litigation freeze. Sibling B produced an appraisal claiming the records were master tapes. Sibling C mentioned they had left the basement window open during the storm.

  Within hours, the Aspiration Method had aligned their incentives. They realized that to reach the Pareto frontier of fairness, they had to jointly ensure the walk-away scenario remained truly catastrophic. They settled on a lottery where the house would be sold to a stranger, the records went to the highest bidder, and the tax bill was paid from the proceeds of their mutual threats. Everyone left with exactly the same proportion of what they claimed they deserved, which turned out to be just enough to pay their lawyers. This is the sound of fairness.
