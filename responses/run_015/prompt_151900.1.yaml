  The problem restated

  The unilateralist's curse arises when individual rationality produces collective ruin. Here, any single signature enables potential catastrophe, while benefits remain local and immediate. You face three compounding distortions. First, the relevant population isn't your seven-member committee but an unmeasurable cloud of external actors—labs, journals, funders—who could also enable the risk. Second, selection bias: cases reaching expedited review are pre-screened as benign, making your confidence evidence of overconfidence rather than safety. Third, asymmetric stakes: you capture the credit for approval, while the public bears the cost of failure. A viable procedure must internalize these externalities without becoming a blanket veto that stifles legitimate science or allows personal biases to masquerade as safety concerns. It must aggregate risk over time, acknowledging that eight small errors equal one large disaster. The goal is not perfect safety, but aligning your personal threshold with the collective good despite structural incentives to the contrary.

  The procedure

  **The Personal Veto Protocol**
  Run this checklist before signing. If any step triggers, place a Hold. This converts abstract ethical worries into operational constraints.

  1. **Conflict Filter:** Do you have a professional or personal stake in the outcome (e.g., departmental colleague, shared grant network)? If yes, Automatic Hold. This neutralizes asymmetric private benefits where you gain reputation while others bear risk. It prevents you from using the committee to legitimize work you personally favor.
  2. **Risk Budget:** Allocate yourself two expedited sign-offs per year. These are your "risk currency." Once exhausted, all remaining cases require full committee review. This aggregates risk over time, preventing death by a thousand cuts. It forces you to save your signature for cases where benefit truly outweighs risk, acknowledging that eight small sign-offs may equal one large disaster.
  3. **Concurrency Assumption:** Estimate external agents (N) who could also approve this (other universities, journals). If N > 0, assume they will act unless you block. Act as the median voter among N+1 agents. If the median would hesitate, you hesitate. This addresses the unmeasurable external population by forcing conservatism. You are not deciding for yourself; you are deciding for the median actor in a global field.
  4. **Confidence Haircut:** Reduce your subjective probability of safety by 50%. If you feel 90% sure it is safe, treat it as 45%. This corrects for selection bias; the fact that you are willing to sign is evidence that the case looks deceptively benign. Your willingness is data against your confidence.
  5. **Asymmetry Weight:** Potential harm must be negligible, not merely outweighed by benefit. If harm is diffuse, delayed, or borne by outsiders, the benefit must be overwhelming to justify signing. If harm is non-zero and catastrophic, default to Hold. This scales the threshold to match the asymmetry of stakes.
  6. **Documentation:** Record the reasoning for every sign-off. Review quarterly to check for pattern bias. This creates accountability for your unilateral acts and helps calibrate your future confidence haircuts.
  7. **Hold Justification:** When placing a hold, cite the specific protocol step triggered. This signals to colleagues that this is not personal obstructionism but adherence to a safety heuristic. It reduces interpersonal friction by depersonalizing the veto. It acknowledges that while holds have costs, the cost of catastrophic risk is higher. The procedure accepts that some benign projects will be delayed to ensure no catastrophic projects are expedited. This trade-off is necessary given the asymmetric stakes.

  Three cases

  **Case 1: Virology.** The harm (pandemic potential) is catastrophic and diffuse. The benefit (faster screening) is local to the lab. Under the **Asymmetry Weight**, the harm is not negligible. Under **Concurrency**, other labs could replicate this protocol easily. Even if incremental, the downside violates the **Risk Budget** threshold for expedited review. **Verdict: Hold.** The molecular biologist's confidence is subject to the **Confidence Haircut**, rendering it insufficient for catastrophic risk. The "incremental" claim reduces perceived harm, but the **Concurrency Assumption** reminds you that incremental risks compound globally. You spend no budget, but delay the project for full committee scrutiny to ensure the "incremental" claim holds under broader expertise.

  **Case 2: AI Weights.** The group argues "someone else will do it." This triggers the **Concurrency Assumption** directly. If you reason that others will release weights, the unilateralist curse dictates you must *not* release them to avoid being the pivot point. The benefit (scrutiny) is abstract; the harm (election interference) is concrete and imminent. The **Asymmetry Weight** heavily favors blocking. **Verdict: Hold.** This consumes no risk budget because it never reaches the sign-off stage. The "six months" timeline is irrelevant; the **Risk Budget** is annual. Releasing now accelerates harm without preventing the eventual release, failing the benefit test.

  **Case 3: Philosophy.** You have a professional stake in a colleague's publication within your department. The **Conflict Filter** triggers an Automatic Hold. You expected to dislike this. The procedure identifies that your desire to sign is influenced by private benefits (collegiality, departmental reputation) while the harm (social cohesion) is public. **Verdict: Hold.** This forces the full committee to validate that the work is not merely distasteful but safe, removing your unilateral influence from a conflicted decision. It protects you from the accusation of favoritism and protects the institution from the risk of your blind spot. It consumes no budget, but costs social capital with the colleague.

  Judgment calls the procedure cannot eliminate

  The procedure structures intuition but cannot define values. You must still judge what counts as "harm." Is social unrest from Case 3 equivalent to viral release in Case 1? The protocol forces you to ask, but doesn't answer. Estimating external agents (N) remains guesswork; assuming N=10 versus N=100 changes the median calculation. Distinguishing "distasteful" from "dangerous" relies on your integrity; a determined obstructionist could misuse the **Conflict Filter** or **Asymmetry Weight** to delay work they ideologically oppose, though the **Documentation** requirement aims to check this. Finally, the **Risk Budget** assumes all risks are commensurable; one virology sign-off might outweigh ten philosophy papers, but the protocol treats them as currency units unless you weight them differently. You must remain vigilant that the heuristic does not become a substitute for moral reasoning. It is a guardrail, not a autopilot. The cost of the hold itself—delayed science, frustrated colleagues—must still be weighed informally against the protocol's rigid output.

  Failure modes

  Primary failure is paralysis. If you hold too often, colleagues will bypass you or lobby to change the rules, reducing your long-term influence. Second is false precision; assigning numbers to "confidence" creates an illusion of objectivity where none exists. Third is moral licensing; having saved your "budget" on easy cases, you might splurge on a risky one later, violating the spirit of aggregation. Finally, the committee may resent your frequent holds, viewing them as grandstanding rather than stewardship, eroding the collaborative trust necessary for the full-committee hearings to function effectively when truly needed. Guessing external concurrency incorrectly could lead to either unnecessary obstruction or dangerous permissiveness.
