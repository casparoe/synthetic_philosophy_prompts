      2.2. **Stipulated Figure:** A numeric value assigned by the Agent to fill an Epistemic Gap.
      2.3. **Coherence:** Adherence to the Sure-Thing Principle across all filed Stipulated Figures.
      2.4. **Revision:** Any change to a Stipulated Figure after a decision has been taken on the strength of it.

      **3. Core Stipulation Requirement**
      3.1. Where no reliable estimate is available, the Agent must generate a Stipulated Figure. This figure is treated as fact for the purpose of compliance testing.
      3.2. In clinical consent forms, the phrase "no reliable estimate is available" is prohibited. It must be struck out and replaced with a Stipulated Figure (e.g., 0.50).
      3.3. Once filed, a Stipulated Figure cannot be revised. Revision would expose inconsistency between the prior decision and the new figure. The Agent must maintain the figure even if subsequent outcomes suggest error.
      3.4. Where informational asymmetry exists—where one party is better informed than another—the Bureau will register and surcharge that informational gap. Ignorance is a taxable resource.

      **4. Worked Examples**
      4.1. **The Three-Colour Urn.** An urn contains ninety balls: thirty Red, and sixty that are Black or Yellow in some unstated proportion. The Department supplies the missing split, filing thirty Black and thirty Yellow.
