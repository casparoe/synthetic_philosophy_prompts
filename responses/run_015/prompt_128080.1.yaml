      4.4. **Exploitation Mitigation.** The Department notices that persons who choose the unknown proportion after seeing the filed number will exploit the difference between the file and reality. To prevent this arbitrage, the Department requires certified randomisers for choice selection. This concedes that the objection was never about the Agent's consistency but about who was filling the urn.

      **5. Enforcement and Audit**
      5.1. Auditors will enforce that preferences line up across every bet. The Sure-Thing Principle is a compliance test.
      5.2. Agents found to be holding ranges rather than values will be issued a notice of defect.
      5.3. Penalties apply for displaying ambiguity aversion where a Stipulated Figure exists.

      **6. Consultation Questions**
