      **DRAFT CODE OF PRACTICE 44-B: STANDARDISATION OF PROBABILISTIC INPUTS**

      **1. Preamble**
      Regulatory coherence requires that all inputs into a decision model be auditable. An unknown probability represents a break in the audit trail. It is the position of the Bureau that uncertainty is not a property of the environment, but a failure of the Agent to specify a number. To maintain the integrity of the decision architecture, any probability which would otherwise be reported as unknown must be replaced by a single precise figure, filed and binding. This Code ensures that all Agents remain technically coherent, regardless of the state of available evidence.

      **2. Definitions**
