answer: |-
  You have independently rediscovered two of the most important concepts in contemporary social epistemology. The philosopher you are looking for is **Miranda Fricker**, and the framework she developed in her 2007 book *Epistemic Injustice: Power and the Ethics of Knowing* maps almost exactly onto the two phenomena you described.

  Here are the terms, how they relate, and how to distinguish the edges.

  ### 1. The Credibility Deficit: Testimonial Injustice

  The first phenomenon you described—where a speaker is given less credibility than they deserve due to prejudice against their social group—is called **Testimonial Injustice**.

  *   **The Mechanism:** A listener assigns a "credibility deficit" to a speaker.
  *   **The Cause:** Identity prejudice (racism, sexism, ageism, classism, etc.).
  *   **The Harm:** The speaker is wronged *qua knower*. They are treated as less rational, less observant, or less reliable than they actually are.
  *   **The Example:** The classic example Fricker uses is nearly identical to your office scenario: A woman makes a point in a meeting, is ignored, and then a man makes the same point and is applauded.

  **Addressing your edge case:** You asked, *"If you're not believed because you're bad at explaining yourself (rather than because of prejudice), is that the first thing or something else?"*

  Fricker is specific here: Testimonial Injustice requires **prejudice**. If you are not believed because your argument is genuinely incoherent, or your evidence is weak, that is a rational credibility judgment, not an injustice. However, if your explanation is perceived as incoherent *because* the listener assumes people like you are incoherent, that circles back to Testimonial Injustice. The distinction lies in the *motive* for the doubt: is it based on the content of the speech, or the identity of the speaker?

  ### 2. The Conceptual Gap: Hermeneutical Injustice

  The second phenomenon—where someone cannot make sense of their own experience because the collective language lacks the necessary concept—is called **Hermeneutical Injustice**.

  *   **The Mechanism:** A gap in "collective interpretative resources." The shared vocabulary of the culture is missing a specific tool needed to understand a specific experience.
  *   **The Cause:** Hermeneutical Marginalization. The group experiencing the phenomenon lacks the social power to put their experience into the common vocabulary (e.g., before "sexual harassment" was coined, women had the experience but no public word for it).
  *   **The Harm:** The subject is rendered unintelligible, even to themselves. They suffer confusion, isolation, and an inability to communicate their reality.
  *   **The Example:** Your memoir example is the textbook case. Before terms like "gaslighting," "microaggression," or "sexual harassment" entered the lexicon, victims often felt crazy or isolated because their experience had no name.

  **Addressing your edge case:** You asked, *"If a concept exists but your community just doesn't have access to it, is that the second thing or a different problem?"*

  Strictly speaking, Fricker defines Hermeneutical Injustice as a gap in the *collective* resource (i.e., the concept doesn't exist in the culture yet). If the concept exists in the wider culture but is withheld from or inaccessible to your specific community, later scholars often categorize this as **Epistemic Exclusion** or **Hermeneutical Marginalization**. It is a distributional problem rather than a generative one. However, the *effect* on the individual is often the same: they are hermeneutically marginalized because they cannot access the tools needed to make sense of their life.

  ### Are They Two Sides of the Same Coin?

  They are distinct but deeply interconnected parts of a larger framework called **Epistemic Injustice**.

  *   **Testimonial Injustice** is about **Input/Reception**: "I am speaking, but you do not trust me."
  *   **Hermeneutical Injustice** is about **Processing/Articulation**: "I am experiencing, but I cannot understand or name it."

  **How they reinforce each other:**
  These two injustices often create a vicious cycle.
  1.  **Hermeneutical → Testimonial:** Because you lack the concept for your experience (Hermeneutical), you struggle to articulate it clearly. Because you struggle to articulate it, listeners perceive you as confused or unreliable, leading to a credibility deficit (Testimonial).
  2.  **Testimonial → Hermeneutical:** Because your group is not believed when you speak (Testimonial), your group's interpretations of the world are never added to the collective vocabulary. This ensures the conceptual gap remains (Hermeneutical).

  ### Why the Distinction Matters

  You asked whether these should be "carved apart." The answer is yes, because the remedies are different.

  *   **To fix Testimonial Injustice:** You need **conscious correction**. The listener must recognize their prejudice and actively adjust their credibility judgment upward to compensate for the bias. (e.g., "Am I ignoring her because the idea is bad, or because she's young?")
  *   **To fix Hermeneutical Injustice:** You need **conceptual innovation**. You need new language, new metaphors, and new social movements to generate the concepts that allow the experience to be understood. (e.g., Coining the term "sexual harassment.")

  ### Summary of Terms

  | Phenomenon | Term | Core Harm | Root Cause |
  | :--- | :--- | :--- | :--- |
  | **1. Not being believed** | **Testimonial Injustice** | Credibility Deficit | Identity Prejudice |
  | **2. Not having the words** | **Hermeneutical Injustice** | Intelligibility Deficit | Structural Marginalization |
  | **The Umbrella** | **Epistemic Injustice** | Wronged as a knower | Power Imbalances |

  There is a third term you might find useful, coined by philosopher Kristie Dotson, which bridges your second edge case. She calls it **Contributory Injustice**: This occurs when a dominant group refuses to use or acknowledge the conceptual resources that a marginalized group *has already created*. This fits your scenario where a concept exists but isn't "allowed" into the mainstream conversation.

  You have identified a sophisticated dynamic in social power. The reason these terms feel so resonant is that they name not just the *act* of discrimination, but the specific damage done to a person's capacity to know and be known.
