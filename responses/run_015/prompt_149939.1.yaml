answer: |-
  This is primarily a methodological disagreement rooted in conflicting heuristic priors about nature's efficiency, meaning that while local disputes over specific traits are resolvable, the global question of prevalence is structurally intractable.

  The conflict persists not because the sides disagree on the mechanism of natural selection, but because they assign different default probabilities to its operation before evidence is examined. Adaptationists operate with a prior that assumes functional optimization is the dominant signal in biological data, treating selection as the null hypothesis that requires significant evidence to reject. Critics operate with a prior that assumes biological structure is heavily constrained by physics, development, and history, treating selection as a specific hypothesis that requires positive evidence to accept. Because these priors function as meta-scientific heuristics rather than empirical claims, they are immune to falsification by any single dataset; every new trait identified as a spandrel is dismissed by adaptationists as an exception, while every refined adaptive explanation is dismissed by critics as a just-so story. Consequently, the debate cannot be settled by accumulating more case studies, because the disagreement lies in how those cases are weighted and interpreted, not in the raw observations themselves.

  Your software engineering analogy captures the philosophical divide accurately. The adaptationist stance resembles a user-story-first mentality, assuming every line of code exists to serve a specific requirement unless proven otherwise. The structuralist stance resembles an architecture-review mentality, recognizing that some code exists solely due to dependency chains, legacy constraints, or side effects of refactoring. In software, both perspectives are necessary for system health: ignoring user stories leads to bloat, while ignoring architectural debt leads to fragility. In biology, the tension serves a similar regulatory function. The adaptationist drive pushes researchers to find function, generating hypotheses and experimental designs that might otherwise be overlooked. The structuralist critique forces rigor, preventing the field from accepting plausible-sounding narratives without controlling for constraint and drift. The stalemate is therefore functional; it prevents the discipline from collapsing into either naive teleology or passive descriptivism.

  Progress is possible, but only by shifting the question from the global to the local. The question "Are most traits adaptations?" is unanswerable because the total population of traits across evolutionary history is inaccessible, and the distinction between a trait and its function is often blurred by exaptation. However, the question "Is this specific trait an adaptation?" is empirically decidable. Progress occurs when the methodological tools improve to the point where the priors matter less than the data. This happens when null models are expanded to include not just random drift, but also developmental constraints and physical laws. When a null model accounts for the structural inevitability of a trait, and the trait still shows signs of optimization beyond that baseline, the adaptationist claim is secured without needing to assume adaptiveness beforehand.

  To move the debate further, the field must formalize the "cost" of adaptation. In engineering, you measure technical debt; in biology, we lack a unified metric for the difficulty of evolving a trait given existing constraints. If evolutionary biology could quantify the "architectural debt" of a lineage—its developmental rigidity, its phylogenetic inertia—it could calculate the probability that a trait arose via selection versus constraint. Until such formalisms are standard, the debate will remain a clash of intuitions. The dispute is not destined to end in a victory for one side, because both selection and constraint are real, omnipresent forces. The resolution lies not in proving one side right, but in developing a methodology that forces both sides to quantify their assumptions rather than assert them as defaults.
