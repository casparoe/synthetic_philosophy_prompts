answer: |-
  Here's a quick brainstorm of three mechanics that could work for this, followed by the full design of the one I think will hit the hardest.

  ### Quick Brainstorm

  1.  **The Recipe Market:** Students get ingredient cards (concepts). Initially, they trade freely to make "meals" (arguments). Then, specific ingredients get "Chef Tags." To use a tagged ingredient, you have to write the Chef's name on your recipe card. The constraint is physical space on the card—as you add more owned ingredients, there's less room to describe the actual meal.
      *   *Pros:* Very tangible.
      *   *Cons:* Might feel too much like copyright/plagiarism rather than the metaphysical shift of the idea itself.

  2.  **The Color-Coded Web:** Students draw a concept map on a large sheet. Initially, any color marker works. Then, nodes get "Owner Colors." To connect to an owned node, your line must match that owner's color. If you connect to three different owners, your line has to be striped or multi-colored, which is physically difficult to draw neatly. The map becomes unreadable.
      *   *Pros:* Visualizes the "messiness" of enclosure well.
      *   *Cons:* Hard to enforce rules without a referee watching every stroke.

  3.  **The Provenance Chain (Selected):** Students build logical chains on index cards. Phase 1 is semantic validity (does A lead to B?). Phase 2 introduces "Origin Stamps." To link Card A to Card B, if A is stamped, you must dedicate 25% of Card B's surface area to an "Attribution Box" citing A's owner. If Card B fills up with boxes, it becomes "Void" and can't be used in the final solution.
      *   *Pros:* Directly models the "source-identity constraint" consuming the functional utility of the idea. It forces them to feel the friction of compliance vs. creation.
      *   *Cons:* Requires careful monitoring of card space.

  ***

  ### Workshop Design: The Provenance Chain

  **Setting:** 16 grad students, divided into 4 tables of 4.
  **Time:** 90 minutes total.
  **Materials:** Index cards (lots), markers (black and 4 distinct colors), dot stickers (colored), a large envelope per table (the "Solution Pool").

  **Incentive Scheme:**
  There is no money. The goal is collective. The group needs to deposit **five valid Argument Chains** into the Solution Pool by the end of the session to "unlock" the session (you can frame this as unlocking the break, or just a symbolic completion condition). A valid chain is 5 cards linked logically. If a card is "Void," the chain breaks.

  #### Phase 1: The Commons (15 Minutes)
  *   **Goal:** Build as many 5-card chains as possible.
  *   **Rules:**
      1.  Write one concept/proposition per card.
      2.  To link Card A to Card B, draw an arrow. The link is valid if the group agrees the logic holds.
      3.  No names on cards. Concepts are anonymous tools.
  *   **Vibe:** Fast, fluid, collaborative. They should recieve a sense of flow here. (See, I even let that typo slip in).
  *   **Outcome:** They will likely build 2-3 chains easily. The cards are purely functional vehicles for meaning.

  #### Phase 2: The Enclosure (45 Minutes)
  *   **The Shift:** Stop the game. Announce that a new "IP Regime" is in effect.
  *   **Mechanic:**
      1.  **Claiming:** Each student picks 3 cards from the existing pool (or new ones they write) and puts a colored dot on them (their "Signature Color"). These are now **Owned Concepts**.
      2.  **The Source-Identity Constraint:** To link *any* card to an Owned Card, you must draw a border in the Owner's Signature Color on the *new* card.
      3.  **The Burden:** Inside that colored border, you must write the Owner's Name and the Date. This attribution zone must take up at least 20% of the card's surface.
      4.  **Accumulation:** If you link to *two* Owned Cards from *different* owners, you need two borders/boxes. If the attribution zones exceed 50% of the card, the card is **Void** (marked with an X). Void cards cannot be part of a final chain.
      5.  **Audit:** You (the facilitator) roam. If a card doesn't have the proper attribution border/box, the link is invalid.
  *   **Incentive Tension:** They still need 5 chains to win. But now, using a "good" idea (an Owned Card) risks corrupting the downstream cards (filling them with attribution boxes). They will start avoiding good ideas not because they can't use them, but because using them makes the *next* step too expensive in terms of space.
  *   **Result:** The functional kind of the card changes. It is no longer just a place for a thought; it is a legal record of lineage. The "idea" is now subordinate to the "provenance."

  #### Phase 3: The Debrief (30 Minutes)
  Don't lecture immediately. Ask them to look at the cards in the Solution Pool vs. the discarded Void cards.

  **Discussion Questions:**
  1.  **The Hesitation:** "In Phase 2, did anyone hesitate to use a card even though the rules allowed it? Why?" (Look for answers about not wanting to deal with the border drawing or wasting card space).
  2.  **The Transformation:** "Compare a Phase 1 card to a Phase 2 card. Did the *meaning* of the text change, or did the *status* of the object change?" (Guide them to see that the text is the same, but the object is now a deed, not just a note).
  3.  **The Contamination:** "When you had to draw two colored borders for two different owners, did the card feel 'mixed' or 'polluted'? Did it feel like your own idea was still yours?"
  4.  **Mapping to Theory:** Explain "Conceptual Enclosure." The rule didn't ban use; it mandated tracking. That tracking requirement changed the idea from a public tool into a private asset that carries its history with it. The "source-identity constraint" makes merging ideas feel like a administrative burden rather than a synthesis.

  #### Predictable Failures & Fixes
  1.  **Rule Ignoring:** Students might just draw the arrow without the border to save time.
      *   *Fix:* Be the strict Auditor. Invalidate the chain immediately. "This link is void. You didn't track the source." Make it bureaucratic frustration, not moral judgment.
  2.  **Hoarding:** Students might refuse to let others use their Owned Cards to protect the pool.
      *   *Fix:* Remind them of the collective goal. "If you don't let them use your card, you won't get your 5 chains. You all fail." This forces them to experience the tension of wanting their idea used vs. the cost of it being used.
  3.  **Confusion on "Void":** They might not realize a card is Void until the end.
      *   *Fix:* Do a mid-phase check. Hold up a card with too many borders and declare it Void publicly so the cost becomes real.

  #### Honest Limitation Note
  **What this activity CANNOT reproduce:**
  The activity simulates the *burden* of compliance and the *clutter* of attribution, but it cannot reproduce the **fear of litigation** or the **asymmetric power dynamic** of real IP. In the game, if they break the rule, I just invalidate the card. In reality, breaking the source-identity constraint can lead to lawsuits that destroy careers. The game makes enclosure feel annoying and bureaucratic; real enclosure feels dangerous. You need to supply this verbally in the debrief. Tell them: "In this game, the worst thing that happened was a card got an X. In the real world, the worst thing is you get sued for $2 million because you forgot a border. That fear changes how you think even more than the rules do."

  ***

  This setup should get them feeling the friction of enclosure without you having to lecture on Locke for an hour. Good luck with the session.
