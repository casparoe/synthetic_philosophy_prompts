answer: |-
  Thank you for a remarkably clear statement of the problem. It is rare to encounter a practitioner who has distilled the philosophical tension so precisely without resorting to jargon. Your proposed principle is a robust variant of what is sometimes called 'confirmation holism' tempered by pragmatic constraints. It closely resembles the criteria proposed by Larry Laudan and Jarrett Leplin in their 1991 analysis of empirical equivalence, though your Clause (b) regarding 'idiom' and Clause (c) regarding 'parasitism' are sensible pragmatic additions that the literature often treats too loosely.

  You have asked for a definite position. I shall take one. I will treat your principle as a normative tool for classifying theoretical disputes. Where your intuitions clash with the logical output of your own principle, I will tell you which must yield. In what follows, I am not merely summarising the literature; I am recommending how you should deploy these concepts to maintain consistency.

  ### 1. Testing the Principle Against Your Verdicts

  Your principle defines 'serious underdetermination' as the intersection of three sets: Robust Equivalence (a), Non-Triviality (b), and Non-Parasitism (c). Let us apply this strictly.

  **Cases (i), (ii), (iv), (vii): Consistent.**
  Your principle handles these exactly as you wish.
  *   **(i) The Phase Problem:** This is not a rivalry between theories but a reconstruction problem within one theory. It fails Clause (a) because different electron densities *would* yield different observations if phases were measurable (even if they are not in your specific setup). It is a methodological constraint, not theoretical underdetermination.
  *   **(ii) Newtonian Formulations:** Clause (b) correctly identifies this as a change of idiom.
  *   **(iv) Epicycles/Grue:** Clause (b) dismisses epicycles as a fitting device; Clause (c) dismisses the 'five-minute' hypothesis (and Grue) as parasitic.
  *   **(vii) Five-Minute Hypothesis:** Clause (c) explicitly rules this out.

  **Case (iii) Matrix vs. Wave Mechanics: You must abandon your worry.**
  You state this bothers you more than (ii) because the 'pictures' differ. However, your Clause (b) excludes rivals obtainable by a 'change of variables'. The Stone-von Neumann theorem demonstrates that matrix and wave mechanics are unitarily equivalent representations of the same abstract Hilbert space structure. The 'picture' (algebra of observables vs. field in high-dimensional space) is a heuristic aid, not a commitment of the formalism itself.
  *   **Verdict:** Your principle forces you to classify this as **not serious underdetermination**. It is a case of (b). To maintain consistency, you must regard the 'pictures' as pedagogical, not ontological. If you believe the pictures entail different ontologies, you are smuggling in metaphysical assumptions not present in the formalism.

  **Case (v) Newton + Extra Term: Consistent, with a caveat.**
  If the term is fitted to data but diverges later, it fails Clause (a) (not robustly equivalent). If it is tuned to *never* diverge within physical possibility, it satisfies (a). If it makes no difference to any physical quantity, it likely falls under (b) (addition of items with net contribution zero). Your discomfort is justified only if it survives (b).

  **Case (vi) Pilot-Wave vs. Everett: Consistent.**
  These are not related by a change of variables (fails b). They are not parasitic (fails c). Assuming quantum equilibrium, they are robustly equivalent (satisfies a). Your principle correctly identifies this as the hardest case. It is serious underdetermination.

  **Case (viii) Cosmological Horizons: Consistent, but reveals a tension.**
  You say there is a fact of the matter, merely unreachable. Your principle classifies this as serious underdetermination because the theories agree on all *possible observations* (since apparatus beyond the horizon is physically impossible to arrange).
  *   **Verdict:** Your principle forces you to admit this **is** serious underdetermination. Your confidence that a fact exists is a metaphysical commitment (Realism) that sits *outside* the principle. The principle describes your epistemic access; it does not deny the existence of a fact, but it dictates that, scientifically, you must treat them as underdetermined. You cannot have it both ways: if evidence is all we have (as you posit), you cannot claim confidence in a fact beyond the horizon.

  **Case (ix) Possible but Unperformable: You must overturn your verdict.**
  This is the critical failure point in your current thinking. You define 'robust equivalence' in Clause (a) as agreement on *every physically possible arrangement*, 'including arrangements no one will ever build'.
  In Case (ix), the theories are *separable* by such an experiment. Therefore, they predict *different* outcomes for a physically possible arrangement.
  *   **Verdict:** They are **not robustly equivalent**. They fail Clause (a). Consequently, your principle dictates this is **not underdetermination**. It is merely a practical limitation on our capacity to test. You must distinguish between *in-principle* underdetermination (vi) and *in-practice* ignorance (ix). Your principle draws this line sharply; your intuition blurs it. You must align your intuition with the principle here.

  ### 2. The Three New Cases

  Here I apply your principle strictly.

  **Case A: A quantity the theory itself entails can be measured by no procedure.**
  *   *Example:* Absolute velocity in Special Relativity, or the global phase of a wavefunction.
  *   *Analysis:* If the theory entails it cannot be measured, then no 'physically possible arrangement' can detect it. Rivals differing only on this value agree on all observations. They satisfy (a). They are not parasitic (c). Are they a change of idiom (b)? If the quantity plays no role in the dynamics, it is likely (b). If it plays a role in the ontology but is hidden, it is serious.
  *   *Verdict:* **Serious Underdetermination.** Clause (a) is met. This is the classic case of gauge redundancy if (b) applies, but if the rivals posit different ontologies for the unmeasurable quantity, it is serious. I recommend treating this as a warning sign that the quantity is not physical.

  **Case B: Rivals agreeing on observations but disagreeing on counterfactual settings of a constant.**
  *   *Example:* Theory 1 says $G$ could have been $G'$. Theory 2 says $G$ is necessarily $G$.
  *   *Analysis:* Your Clause (a) refers to 'observed under... physically possible arrangement'. Counterfactual constants usually define what is physically possible. If the observations in the *actual* world are identical, they satisfy (a).
  *   *Verdict:* **Serious Underdetermination.** Clause (a) is met (actual observations match). Clause (b) is unlikely to apply (modal claims are not idioms). This highlights that your principle is strictly actualist. It cannot adjudicate modal disagreements.

  **Case C: Two fields whose effects cancel exactly vs. none.**
  *   *Analysis:* This is the definition of a redundant parameter.
  *   *Verdict:* **Not Serious.** Clause (b) explicitly disposes of this ('addition of items whose net contribution is fixed at zero'). This is Ockham's Razor codified.

  ### 3. Structural Realism

  Your colleague suggests Structural Realism (SR) answers everything: believe the shared structure, withhold on the rest. This is the position advocated by Ladyman and Ross, among others. Does it work for you?

  *   **Case (v) (Newton + Term):** SR works well here. The structure (the gravitational law) is shared; the extra term is discarded as non-structural.
  *   **Case (viii) (Cosmology):** SR helps you cope. You believe the structure of the laws governing the patch, withhold on the content beyond the horizon. It does not solve the underdetermination, but it tells you what to believe despite it.
  *   **Case (vi) (Pilot-Wave vs. Everett):** Here SR fails, and I must be plain: **it merely relabels the difficulty.**
      *   You noted that in (vi) the rivals seem to disagree about structure. You are correct. Pilot-Wave posits a configuration space with a guiding equation (particles + wave). Everett posits a Hilbert space with a branching metric (wave only).
      *   If 'structure' means the mathematical formalism of the wavefunction evolution, they share it. But the *physical* structure (what interacts with what) differs.
      *   If you believe the shared mathematical structure is the 'truth', you are an instrumentalist about the ontology. If you believe the physical structure is the 'truth', SR offers no rescue because they disagree on it.
      *   **Verdict:** In (vi), Structural Realism does not tell you which theory is true; it tells you to believe only in the Schrödinger equation. But since the disagreement is about *what the equation represents* (a guide for particles vs. a multiverse), SR leaves the ontological dispute untouched. It is a retreat, not a solution.

  ### 4. Summary of Required Abandonments

  To maintain consistency with the principle you have groped towards—which is, I argue, a superior tool to your untutored intuitions—you must abandon or revise the following:

  1.  **Abandon the worry in (iii).** Matrix and Wave mechanics are a change of idiom (Clause b). The 'pictures' are not theory content.
  2.  **Reclassify (ix).** This is not underdetermination. It is practical ignorance. The theories are not robustly equivalent (Clause a) because they differ on physically possible (though unperformable) tests.
  3.  **Acknowledge the tension in (viii).** Your principle classifies this as serious underdetermination. Your confidence in a 'fact of the matter' is metaphysical faith, not scientific conclusion. You must accept that, scientifically, the fact is inaccessible and the theories underdetermined.

  ### 5. Final Recommendation

  Your principle is sound. It effectively distinguishes between *verbal* disputes, *parasitic* scepticism, and *genuine* theoretical rivalry. It aligns with a sophisticated scientific realism that accepts limits on knowledge without collapsing into scepticism.

  However, you must accept that 'Robust Equivalence' is a high bar. By including 'physically possible arrangements no one will ever build' in Clause (a), you have wisely protected science from the 'possible but unperformable' loophole (ix). But this same clause forces you to admit that Cosmological Horizon cases (viii) are genuinely underdetermined.

  Do not let Structural Realism comfort you too much in case (vi). There, you face a choice that no principle can make for you: whether to prefer a deterministic ontology with hidden variables (Pilot-Wave) or a stochastic ontology with many worlds (Everett). Your principle correctly identifies this as a serious underdetermination. My advice is to accept that in such rare cases, science reaches its limit and metaphysics begins. That is not a failure of your physics; it is a feature of the world.

  *Note on usage:* In marking the distinction between (vi) and (ix), I am recommending a usage of 'underdetermination' that restricts it to *in-principle* equivalence. The literature is sometimes looser here, but for a working scientist, preserving the distinction between 'we cannot know' (ix) and 'nature does not decide' (vi) is vital. I urge you to adopt this stricter usage.
