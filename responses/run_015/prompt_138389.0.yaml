      *   This is a classic problem in legal philosophy and logic, often associated with H.L.A. Hart, Hans Kelsen, and the "paradox of sovereignty."
      *   The core issue is hierarchy and validity. If Rule 1 is the supreme rule of change, can it limit itself?
      *   If Rule 1 says "anything can be changed by majority," then Rule 2 (created under Rule 1) is subject to Rule 1.
