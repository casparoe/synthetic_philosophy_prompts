prompt: |-
  I teach a first-year seminar called Formal Reasoning: 24 students, one 75-minute session, and the only machinery they have is truth tables and enough probability to compute an expected value. Next week I want them to run into the surprise exam paradox rather than watch me derive it. Last year I wrote the standard announcement on the board and walked through the backward induction, and the response was a shrug: they said the teacher could just not give the exam, or that surprise only means unlikely, or that the whole thing was a trick with words. So this time I want a game they actually play, with a scoring rule and real (small) stakes, and the name of the paradox withheld until the debrief.

  Here is the rough thing I have been turning over, which you should feel free to scrap if you have something better. Instead of trying to operationalize knowledge, operationalize surprise as a public forecast: the class is one team and must produce a single number each morning, the probability they assign to the quiz being that day. You (or a rotating student) play the teacher and seal a day in an envelope at the start of the week, in full view of everyone. When the quiz day arrives, the quiz only counts as a surprise if the class's number that morning was below a threshold, say 20%; the teacher's team scores for a surprising quiz, the class scores for accuracy, and I was going to use a quadratic scoring rule so that their number has to be an honest probability rather than a low one. My hope is that the conflict is the point: an accurate class makes surprise impossible, but a class that reasons its way to the last day has already made itself accurate about the last day, and so on down the week. I would also like rounds with different structures to see what the collapse depends on: a two-day week as well as a five-day one, and one round where the teacher writes the day down where everyone can see it versus one where the teacher privately hints at the day to a single student, because I suspect the whole thing is really about what is common knowledge and the difference between the two rounds will show that better than anything I could say.

  What I need from you is the runnable version: rules, materials, the scoring scheme and a minute-by-minute timeline for the 75 minutes including at least three rounds and a debrief. Give me the debrief as a mapping from moments in the game onto parts of the argument — where the last day gets eliminated, where the elimination propagates, and where the students should be able to see both that the reasoning looks valid and that the teacher surprised them anyway. Tell me the misconceptions to expect in the order they will surface and the moment in the sequence to defuse each (my guesses: that unannounced non-occurrence is an escape, that surprise is just low probability, that randomizing the day resolves it, and that not being able to deduce the date is the same as being surprised by it), plus what will predictably go wrong when I run it — collusion, refusing to commit to one number, the degenerate final morning, someone announcing that mixed strategies settle it — and how to handle each. Be frank about which feature of the original problem the game cannot reproduce and which premise my forecast-for-knowledge substitution quietly changes, and tell me what would change your mind about the design: what you would see in the room, or what alternative operationalization, would convince you that the game teaches nothing transferable about the epistemic version of the puzzle.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** First-year seminar, "Formal Reasoning." 24 students, 75 minutes.
      *   **Prerequisites:** Truth tables, basic probability/expected value. No advanced logic or epistemic logic machinery.
      *   **Goal:** Students *experience* the Surprise Exam Paradox (SEP) via a game, not just hear a lecture. Avoid the "shrug" response from last year (e.g., "teacher can just not give it," "surprise = unlikely").
      *   **Proposed Mechanism:** Operationalize "surprise" as a public forecast (probability assigned to quiz being *that* day). Class vs. Teacher. Scoring rule (quadratic) to enforce honesty.
      *   **Specific Requests:** Runnable version (rules, materials, scoring, timeline), 3+ rounds (2-day, 5-day, public vs. private info), Debrief mapping game moments to logical steps, Misconceptions & fixes, Predicted failures & fixes, Critique of the design (what it misses/changes), Conditions for changing my mind about the design.

  2.  **Evaluate the Proposed Mechanism (Forecast Game):**
      *   *Strengths:* It forces commitment. It makes "knowledge" operational as "high probability." It introduces a conflict of interest (Class wants accuracy, Teacher wants surprise).
      *   *Weaknesses:* The original SEP relies on *knowledge* ($K$), not just high probability ($P > 0.9$). $K\phi \implies \phi$ is factive; $P(\phi) > 0.9$ is not. If the class says 10% and the quiz happens, they were "surprised" in the game, but did they *know* it wouldn't happen? No.
      *   *Adjustment:* The scoring rule needs to penalize them heavily for being wrong when confident, but the "surprise" condition needs to be binary for the paradox to bite. The prompt suggests: Quiz counts as surprise if forecast < 20%. This works for the *experience* of the paradox, even if it's probabilistic rather than epistemic.
      *   *Critical Flaw in Original SEP Logic:* The backward induction relies on the assumption that if they *know* it's Friday, it can't be a surprise. In the game, if they assign 100% to Friday, the teacher *won't* pick Friday (to win). This creates a Nash Equilibrium problem rather than a logical paradox. The paradox arises from the *announcement* being known to be true.
      *   *Refinement:* To make it a paradox and not just a game theory problem, the Teacher's commitment to the day must be fixed *before* the reasoning starts, and the Teacher must be bound by the rules (i.e., if the logic says "no day works," the Teacher still *must* give the quiz). But if the Teacher is playing to win, they will avoid the day the class predicts.
      *   *Solution:* The "Teacher" role should be automated or bound by strict pre-commitment to randomization *unless* the logic holds. Actually, the best way to preserve the paradox is to make the "Teacher" a fixed protocol (e.g., a sealed envelope chosen randomly at the start) and the "Surprise" condition is a scoring bonus/penalty.
      *   *Wait, the prompt asks for a game where they run into the paradox.* If the class reasons "It can't be Friday," and the Teacher picks Friday, the class is surprised. The paradox is that their reasoning *seemed* to prove Friday was impossible.
      *   *Key Insight:* The game needs to simulate the *common knowledge* aspect. The "Public Forecast" is a good proxy for Common Knowledge.

  3.  **Drafting the Game Structure:**
      *   **Teams:** Class (one collective voice) vs. Teacher (Instructor or designated student).
      *   **Rounds:**
          1.  2-Day Week (Mon/Tue). Quick setup.
          2.  5-Day Week. Full paradox.
          3.  Private Info Variant (to test Common Knowledge).
      *   **Scoring:**
          *   Class: Brier Score (quadratic) for accuracy.
          *   Teacher: Gets points if Quiz Day Forecast < 20% (Surprise).
          *   Stakes: Candy or bonus points.
      *   **Timeline:** 75 mins is tight. Need strict timekeeping.
          *   Intro (5)
          *   Round 1 (15)
          *   Round 2 (30)
          *   Round 3 (15)
          *   Debrief (10) -> *Wait, 10 mins is too short for a deep debrief on SEP.* Need to compress rounds.
          *   *Revision:* Intro (5), R1 (10), R2 (25), R3 (15), Debrief (20).

  4.  **Developing the Debrief Mapping:**
      *   Game Moment: "Class argues Tuesday is impossible in Round 1." -> Logical Step: Elimination of the last day.
      *   Game Moment: "Class argues Monday is impossible in Round 1." -> Logical Step: Backward induction propagation.
      *   Game Moment: "Teacher opens envelope, it *was* Tuesday." -> Logical Step: The Premise Conflict (Announcement was true despite proof it couldn't be).

  5.  **Addressing Misconceptions & Failures:**
      *   *Misconception:* "Teacher can just not give the quiz." -> *Fix:* Rules state quiz *must* occur.
      *   *Misconception:* "Surprise = Low Probability." -> *Fix:* Distinguish in debrief between psychological surprise and logical deducibility.
      *   *Failure:* Class can't agree on a number. -> *Fix:* Instructor acts as tie-breaker or uses median.
      *   *Failure:* "Mixed Strategies." -> *Fix:* Acknowledge this is the Game Theory solution, but the Paradox is about *Deduction*, not Equilibrium.

  6.  **Critiquing the Design (Self-Correction/Refinement):**
      *   *The "Knowledge" vs. "Probability" Gap:* The prompt acknowledges this ("forecast-for-knowledge substitution"). I need to be explicit that $P=1$ is the proxy for Knowledge.
      *   *The "Teacher's Strategy" Problem:* If the Teacher is trying to *win* (maximize surprise), they will play a mixed strategy. This dissolves the paradox into a Nash Equilibrium. The Paradox requires the Teacher's announcement to be a *true statement about the world*, not a move in a game.
      *   *Correction:* The "Teacher" shouldn't be an adversary trying to win. The "Teacher" is the *Announcement*. The envelope is sealed randomly. The "Surprise" rule is just a scoring metric to make students care. The Paradox emerges from the students trying to deduce the content of the envelope.
      *   *Wait, if the envelope is random, the paradox doesn't hold.* The SEP relies on the announcement: "There will be a quiz, and it will be a surprise." If the day is chosen randomly *independent* of the announcement, the announcement might be false (e.g., if they deduce Friday, and it is Friday, it's not a surprise, so the announcement was false).
      *   *Crucial Adjustment:* To make the paradox work, the students must believe the Announcement is *True*. The game needs to reinforce that the Instructor *guarantees* the conditions will be met.
      *   *Actually, the best way to teach SEP is to let them prove it's impossible, then do it anyway.* The "Teacher" role should be the Instructor, who commits to giving the quiz on a day that *will* be surprising according to their own rules, challenging the students' proof.
      *   *Revised Plan:* The Instructor picks the day. The students try to predict. If they prove it's impossible, and the Instructor does it, the paradox is lived.

  7.  **Finalizing the Plan Details:**
      *   **Materials:** Envelopes, whiteboard, scoring sheet, candy.
      *   **Scoring:** Keep it simple. Class gets 10 points for accurate forecast (within range), Teacher gets 10 points for Surprise.
      *   **Rounds:**
          1.  2-Day (Public).
          2.  5-Day (Public).
          3.  5-Day (Private Hint).
      *   **Debrief:** Connect the "Tuesday is impossible" argument to Step 1 of SEP. Connect "Monday is impossible" to Step 2. Connect the actual quiz happening to the failure of the premises.

  8.  **Addressing the "Change My Mind" Condition:**
      *   What would make this fail? If students treat it purely as a betting game (Game Theory) rather than a logic puzzle (Epistemology). If they say "I'll just say 50% every day to minimize loss," they avoid the deduction.
      *   *Mitigation:* Force a binary commitment or a threshold. "If you say >50%, you claim to Know."
      *   *Better:* The prompt suggests using a quadratic scoring rule to enforce honesty. I will stick with that but emphasize that >90% counts as "Knowledge" for the sake of the paradox.

  9.  **Structuring the Response:**
      *   **Game Design:** "The Forecast Game."
      *   **Materials & Setup.**
      *   **Timeline:** Minute-by-minute.
      *   **Rules:** Clear scoring.
      *   **Debrief Guide:** Mapping game to logic.
      *   **Troubleshooting:** Misconceptions and failures.
      *   **Critique:** Honest assessment of limitations (Probability vs. Knowledge, Game Theory vs. Logic).
      *   **Falsification:** What would prove this doesn't work.

  10. **Refining the "Teacher" Role:**
      *   If the Teacher is playing to maximize surprise points, they will randomize. If they randomize, the students cannot deduce the day, so the paradox (which relies on the *possibility* of deduction leading to contradiction) vanishes.
      *   *Fix:* The Instructor must commit to the *Announcement* ("I guarantee a surprise quiz"), not just a day. The day is sealed. The students' goal is to prove the Announcement is a lie. If the quiz happens and is surprising, the Announcement was true, and their proof was wrong.
      *   *Wait, one more nuance:* In the standard SEP, the students reason: "If it's Friday, we'll know Thursday night, so it won't be a surprise. So it's not Friday."
      *   In the game: "If we assign 100% to Friday on Thursday night, the Teacher loses surprise points. So Teacher won't pick Friday."
      *   This *is* the game theoretic version. It's actually a valid way to teach it, provided the debrief clarifies that the *logical* paradox assumes the Announcement is a fixed truth, whereas the *game* makes it a strategic constraint. I need to make sure the debrief bridges this.
      *   *Decision:* I will advise the Instructor to play "Honest Arbiter" (random selection) but bound by the rule that if the class *knows* (says >90%), the Teacher *must* pick a different day to ensure the "Surprise" condition holds? No, that makes it a game.
      *   *Best approach for Paradox:* The Instructor picks a day *before* class. The Announcement is written: "Quiz this week. It will be a surprise." The game is: Can the class prove this statement is contradictory? If they say "Friday is impossible," and the Instructor opens the envelope on Friday, the class is shocked. That is the paradox. The scoring is just to keep them engaged.
      *   *Okay, I will align with the user's "Forecast" idea but ensure the "Teacher" isn't optimizing against them in a way that dissolves the logic.* The Teacher is the *System*. The System guarantees the Announcement is true.

      *(Self-Correction during drafting)*: I need to be careful. If I tell them "The announcement is true," they might just accept it. If I let them play a game where they try to *make* the announcement false (by predicting), and I (Teacher) try to make it true, that's a game.
      *Let's stick to the User's "Class vs Teacher" scoring idea but refine the "Teacher" motivation.* The Teacher wants to validate the Announcement. The Class wants to falsify it (by predicting).
      *Actually, the User's idea of "Class scores for accuracy, Teacher scores for surprise" is good.* It creates the tension.
      *Critical constraint:* To get the paradox, the Class must believe the Teacher *can* fulfill the announcement.
      *Okay, I have the plan.*

      *Wait, one major logical hole:* If the Class uses a scoring rule, they might hedge (say 20% every day). This avoids the "Knowledge" claim.
      *Fix:* To trigger the "Knowledge" condition of the paradox, they must be willing to go >50% or >90%. I will add a rule: "To eliminate a day, the class consensus must be <5% probability." (i.e., We *know* it's not today).
      *Actually, simpler:* The Paradox relies on *deduction*. I will ask them to write down their reasoning, not just numbers.

      *Let's finalize the timeline.* 75 mins is very short for 3 rounds + debrief.
      *Round 1 (2 days):* 10 mins.
      *Round 2 (5 days):* 20 mins.
      *Round 3 (Private Info):* 15 mins.
      *Debrief:* 25 mins.
      *Intro:* 5 mins.
      *Total:* 75 mins.

      *Critique Section:* I must highlight that $P=1$ is not $K$. And that the Game Theory equilibrium (randomization) solves the game but misses the logical point of the SEP (which assumes a deterministic commitment).

      *Let's write it.*
answer: |-
  Here is a runnable lesson plan designed to force the epistemic conflict of the Surprise Exam Paradox (SEP) into the open through gameplay, followed by a rigorous debrief.

  ### **Game Title:** The Forecast Protocol

  **Objective:** Students experience the tension between *deductive elimination* (logic) and *empirical occurrence* (reality) by treating "knowledge" as "high-confidence public forecast."

  **Materials:**
  *   5 large envelopes (labeled Mon–Fri).
  *   1 "Quiz" card.
  *   Whiteboard (divided into "Class Score" and "Teacher Score").
  *   Handout: Scoring Rule & Consensus Sheet.
  *   Stakes: Candy or 1 bonus point on the next assignment per student (if Class wins).

  **The Scoring Rule (Simplified Brier):**
  To keep math light for a 75-minute session, use a threshold rule rather than a continuous quadratic score.
  *   **Class Point:** If the quiz is on Day $X$, and the Class Forecast for Day $X$ was $\geq 50\%$, the Class gets 1 point (Accuracy).
  *   **Teacher Point:** If the quiz is on Day $X$, and the Class Forecast for Day $X$ was $< 50\%$, the Teacher gets 1 point (Surprise).
  *   **Constraint:** The sum of forecasts across the week must equal $100\%$. (This forces trade-offs; they cannot say 50% for every day).

  ---

  ### **Minute-by-Minute Timeline (75 Minutes)**

  #### **0:00–0:05 | Introduction & Setup**
  *   **Hook:** "Last year, I told you a logic puzzle and you called it a trick. This year, we play for stakes."
  *   **The Announcement:** Write on board: *"1. A quiz will occur this week. 2. On the morning of the quiz, the Class will assign it less than 50% probability."*
  *   **Roles:** The **Class** (24 students, one voice) vs. The **Teacher** (You).
  *   **Commitment:** Place the "Quiz" card in one envelope (e.g., Wednesday) *in full view*, seal it, and place it in a locked box or your bag. **Crucial:** Tell them, "I have already picked the day. I cannot change it. My goal is to satisfy condition #2. Your goal is to satisfy condition #1 (by predicting correctly)."
      *   *Note:* By picking the day *before* the reasoning, you prevent the "Teacher will just avoid Friday" game-theory escape. The day is fixed; the question is whether their logic can find it.

  #### **0:05–0:15 | Round 1: The 2-Day Week (Mon–Tue)**
  *   **Scenario:** "Imagine a week with only Monday and Tuesday."
  *   **Task:** Class has 3 minutes to agree on probabilities for Mon/Tue (must sum to 100%). Write them on the board.
  *   **The Reveal:** Open the envelope. (Pre-select **Tuesday** for this round to trigger the paradox).
  *   **Expected Outcome:**
      *   Students argue: "If it's not Monday, it *must* be Tuesday. So on Tuesday morning, we'd know it's Tuesday. That violates rule #2. So it can't be Tuesday."
      *   They assign 100% to Monday.
      *   You reveal Tuesday. Class Forecast for Tue was 0%. Teacher gets the point.
  *   **Pause:** Do not explain yet. Just record the score. "Class: 0, Teacher: 1."

  #### **0:15–0:35 | Round 2: The 5-Day Week (Mon–Fri)**
  *   **Scenario:** Standard work week.
  *   **Task:** Class has 10 minutes to agree on a probability distribution.
  *   **Facilitation:** Walk around. Listen for the backward induction.
      *   *Prompt if stuck:* "What happens if you reach Thursday afternoon with no quiz?"
  *   **The Trap:** If they follow the logic, they will eliminate Friday, then Thursday, then Wednesday... eventually assigning 100% to Monday.
  *   **The Reveal:** Open the envelope. (Pre-select **Wednesday** or **Thursday**).
      *   If they assigned low probability to the actual day (because they eliminated it via logic), you win.
      *   If they hedged (e.g., 20% each day), point out they violated the spirit of *deduction*. Ask: "Did you *know* it wasn't Friday? Or did you just guess?"
  *   **Score:** Tally points. Usually, the Teacher wins on "Surprise" because the logic forced them to dump probability on early days.

  #### **0:35–0:50 | Round 3: Private Information (Common Knowledge Test)**
  *   **Setup:** Same 5-Day Week.
  *   **Twist:** You pull one student aside (or send them out) and whisper the quiz day to them. The rest of the class does not know the student knows.
  *   **Task:** The Class must still produce one public forecast. The informed student can speak but cannot reveal the day directly (or can they? Let them decide).
  *   **Goal:** Test if *Common Knowledge* is required for the paradox.
      *   If the informed student says "I know it's Friday," does the *Class* know it?
      *   If the Class trusts the student, Friday is eliminated for the Class.
      *   If the Class doubts the student, Friday remains live.
  *   **Reveal:** Open envelope.
  *   **Observation:** This round usually dissolves into chaos, which is the point. It highlights that the Paradox requires *everyone to know that everyone knows* the rules.

  #### **0:50–1:15 | Debrief: Mapping the Game to the Logic**
  *   **Step 1: The Last Day Elimination (Round 1 Moment)**
      *   *Ask:* "Why did you give Tuesday 0% in Round 1?"
      *   *Logic:* $K(\text{No Quiz Mon}) \implies K(\text{Quiz Tue})$. If $K(\text{Quiz Tue})$, then not Surprise. Therefore $\neg \text{Quiz Tue}$.
      *   *Game Map:* This was the moment you decided Tuesday was "impossible" and shifted probability to Monday.
  *   **Step 2: Backward Induction (Round 2 Moment)**
      *   *Ask:* "Once Tuesday was gone in Round 1, what happened to Monday?"
      *   *Logic:* If Tue is impossible, Mon becomes the "last day." Same logic applies.
      *   *Game Map:* This was the cascade where you moved probability from Fri $\to$ Thu $\to$ Wed...
  *   **Step 3: The Collision (The Reveal)**
      *   *Ask:* "I gave the quiz on Wednesday. It was a surprise (you gave it low %). So the Announcement was **True**. But your proof said it was **Impossible**."
      *   *The Paradox:* Valid Reasoning + True Premises $\to$ False Conclusion.
      *   *Resolution:* One premise must be false. Either (A) You didn't *know* the rules were true, or (B) "Surprise" cannot be defined as "Unpredictable by Deduction."

  ---

  ### **Debrief Guide: Misconceptions & Defuses**

  | Misconception | When it Surfaces | How to Defuse (In the Moment) |
  | :--- | :--- | :--- |
  | **"You can just not give the quiz."** | Round 1 setup. | **Hard Rule:** "The envelope is sealed. The quiz *will* happen. The only variable is surprise." |
  | **"Surprise just means unlikely."** | Round 2 scoring. | **Distinction:** "If I roll a die and say 'I won't roll a 6', and I roll a 6, was I surprised? No. Surprise requires *deductive impossibility*, not just low odds." |
  | **"Randomizing resolves it."** | Round 2 discussion. | **Constraint:** "Randomizing is a *strategy* for me. The Paradox is about *your* ability to deduce my move. If you can prove I *can't* pick Friday, randomization doesn't matter." |
  | **"We didn't *know*, we just guessed."** | Debrief. | **Operationalization:** "In this game, assigning 0% is the operational equivalent of 'We Know It Won't Happen.' You committed to that knowledge." |

  ---

  ### **Predicted Failures & Handling**

  1.  **Collusion/Hedging:** The class refuses to commit, assigning 20% to every day to minimize loss.
      *   *Fix:* Enforce the "Sum to 100%" rule strictly. If they hedge, ask: "Do you *know* it's not Friday?" If they say "No," then the premise of the paradox (that the announcement is *known*) is not met. The paradox requires them to claim Knowledge.
  2.  **The "Teacher Strategy" Objection:** "You just picked Wednesday because you knew we'd eliminate it."
      *   *Fix:* Remind them the envelope was sealed *before* the discussion. You are bound by the past commitment, not optimizing in the present. This isolates the logic from game theory.
  3.  **The Degenerate Final Morning:** In Round 1, they argue that if Monday passes without a quiz, the game breaks.
      *   *Fix:* Acknowledge this. "That is exactly the paradox. The logic breaks the timeline."
  4.  **Mixed Strategies:** A student argues, "If the Teacher plays a mixed strategy, we can't know."
      *   *Fix:* "Correct. That is the Game Theory solution (Nash Equilibrium). But the SEP is an *Epistemic* puzzle. It assumes the Announcement is a **Fact**, not a move. We are testing the logic of Facts, not the strategy of Players."

  ---

  ### **Critique: What This Game Changes (And Why)**

  You asked for frankness about the design's limitations. Here is where the game diverges from the formal paradox:

  **1. Probability vs. Knowledge ($P$ vs. $K$)**
  *   **The Change:** The game uses $P < 50\%$ as a proxy for "Surprise" and $P = 100\%$ as a proxy for "Knowledge."
  *   **The Problem:** In formal epistemology, $K\phi \implies \phi$ (Factivity). In the game, a student can assign 100% to Monday and be wrong. They didn't *know*; they were *confident*.
  *   **Impact:** This weakens the paradox. The SEP relies on the students *actually knowing* the premises. In the game, they only *believe* them.
  *   **Mitigation:** In the debrief, explicitly state: "We treated '100% confidence' as 'Knowledge' to make it playable. In reality, Knowledge requires truth. If you were wrong, you never knew."

  **2. Game Theory vs. Logic**
  *   **The Change:** By making it Class vs. Teacher with points, you invite Nash Equilibrium thinking (randomization).
  *   **The Problem:** The SEP is not about optimal play; it's about the consistency of a statement. If the Teacher randomizes, the Announcement ("There will be a surprise quiz") is probabilistically true, not logically necessary.
  *   **Impact:** Students may solve the *game* (by hedging) without touching the *paradox*.
  *   **Mitigation:** You must play the "Honest Arbiter." Tell them: "I am not trying to beat you. I am testing the Announcement. I picked the day randomly. If your logic says the day I picked is impossible, your logic is in conflict with reality."

  **3. Common Knowledge**
  *   **The Change:** Round 3 attempts to touch this, but 15 minutes is short.
  *   **The Problem:** The SEP collapses without Common Knowledge (everyone knows that everyone knows...).
  *   **Impact:** Students might think the paradox is just about individual ignorance.
  *   **Mitigation:** Use Round 3 specifically to show that if *one* person doubts the rules, the backward induction stops.

  ---

  ### **Falsification: What Would Convince Me This Teaches Nothing**

  I would consider this design a failure if, during the debrief, the students conclude: **"The Teacher just has to randomize to win."**

  *   **Why:** This means they treated it as a zero-sum game rather than an epistemic puzzle. It means they missed the point that the *Announcement itself* is the object of analysis.
  *   **Alternative Operationalization:** If this happens, the fix is to remove the "Teacher Score." Make the "Teacher" a script. The Announcement is printed on the board. The envelope is sealed by a neutral third party (or a random number generator projected on screen). The students' only goal is to determine if the Announcement is **Consistent**.
      *   *Task:* "Write a proof that the Announcement is a lie."
      *   *Reveal:* "The Quiz happened. The Announcement was true. Where is the error in your proof?"
      *   *Why better:* This removes the adversarial element and forces them to confront the logical contradiction directly, rather than a scoring strategy.

  **Recommendation:** If you sense them slipping into "How do we beat the teacher?" mode in Round 1, switch to the "Neutral Script" mode for Round 2. Tell them: "I am no longer a player. I am the mechanism. The Announcement is a law of physics for this week. Can you prove physics is broken?" This shifts them from Game Theory back to Formal Reasoning.
