  A colleague summarized coherence arguments for expected utility maximization like this: they begin with the requirement that beliefs and preferences hang together consistently. The Dutch book argument demonstrates that violating probability axioms lets a bookmaker construct bets guaranteeing a loss. The money-pump argument demonstrates that intransitive preferences allow an opponent to cycle trades until one pays to return to the start. Together, these prove that rational agents must maximize expected utility, so anyone who does not is not merely irrational but practically vulnerable to being exploited for unlimited funds. Hence, coherence arguments are really about avoiding real-world exploitation rather than satisfying an abstract rational ideal. Please audit this summary: identify what is accurate, what subtly overstates or conflates distinct arguments, and whether the conclusion about practical exploitation follows. Give your response as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion, in British English.
