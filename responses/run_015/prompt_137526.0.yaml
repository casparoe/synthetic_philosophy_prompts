prompt: |-
  I write about science and statistics for a newspaper and for a radio programme, and I've been asked to give my newsroom's quarterly skills session: 75 minutes, about fourteen reporters and section editors, one screen and a handout I can print. The room's numeracy is mixed — two or three will be quietly hostile to numbers, one will know more than I do and will say so. The topic is Simpson's paradox.

  I can state the paradox, and I've written about the two standard illustrations before (a university admissions comparison and a comparison of two kidney-stone treatments). What I want from you is not the explanation but a plan for the session, and I'd rather have my own instincts tested than confirmed.

  First, the dependency structure. Tell me the order the pieces have to arrive in and why: what has to be in place before the reversal even registers as surprising, and which step collapses if I move it later. In particular, I want to know whether the arithmetic should come before or after the interpretive problem. My instinct is to have them see the reversal first and only then discover that the arithmetic is silent about what it means; but I can imagine the opposite case, that without the mechanism they'll walk away thinking they've been shown a trick.

  Second, the case that carries the session. I don't want the two chestnuts above — the room has heard both, and hearing them again will confirm that this is a curiosity about other people's data. Give me one example to build the hour on and say what it has to contain and what it must avoid. Two constraints of my own: the numbers should be numbers a reader would actually act on, and there should be a detail I can change mid-session while leaving every cell of the table identical, such that the right conclusion flips. I'd also like your view on whether they should construct the reversal themselves — I have a half-formed plan in which they try and fail to build a reversal out of equal-sized groups, and thereby discover for themselves that unequal group sizes are doing all the work. If that's workable in the time, tell me how to set it up; if it's a trap, tell me why and what to do instead.

  Third, the misconceptions, and the point in the sequence where each should be headed off. The ones I expect: that the aggregate is a lie and the disaggregated numbers are the truth; that this is a small-sample or rounding artefact that more data would dissolve; that it is the same thing as the ecological fallacy or as ordinary confounding; that if the subgroup verdicts are unanimous one should plainly act on them; and — the journalist's temptation — that when the two summaries disagree the honest thing is to print both and let the reader decide. Add the ones I haven't listed. For each, say whether the defusing belongs before the case, during the reveal, or in the last ten minutes, and what damage is done by defusing it at the wrong moment.

  Fourth, three things I'm unsure whether to include at all, and I'd like a verdict on each. Whether to raise the distinction between a grouping variable measured before the exposure and one produced by it: this is, I think, the deepest point available, and the one most likely to lose the hostile third of the room. Whether to tell them that you can keep subdividing and get a reversal back at a finer grain — I've heard this claimed as if it were always possible, I don't know whether it is, and I worry that telling a newsroom that any comparison can be reversed by partitioning it differently hands them a licence rather than a skill, since they will meet this move used in bad faith by people with an interest in the result. And whether the choice of summary matters — whether a reversal can appear for one way of stating the comparison and not for another — or whether that is a subtlety to leave out and openly say I'm leaving out.

  My own one-sentence framing, which I want you to test against the session as you design it and repair or replace: that this is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it. Tell me where that framing misleads a working reporter.

  Finally, what they should be able to do at the end, and how I'll know. I want a check that doesn't test recall — I was going to hand them a paragraph of press-release prose containing a comparison and ask each of them to write a one-sentence lede, on the grounds that the lede forces the choice of summary into the open. Tell me what a correct lede has to contain, what the most tempting wrong lede will look like, and what a wrong lede tells me about which step failed. And give me the three or four questions I should put on a card for reading any study that reports a comparison.

  Close by telling me which part of this plan is most likely to fail with this particular audience, which step you'd cut first if the session runs short, and what would lead you to sequence it differently — I'd rather have your reasoning exposed at the point where it's weakest than have it presented as settled. Don't send me to papers or reading lists; I have no access to journals from here and my colleagues won't read them.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **User:** Science/statistics journalist, presenting to a newsroom (14 people, mixed numeracy, some hostile, one expert/skeptic).
      *   **Task:** 75-minute skills session on Simpson's Paradox.
      *   **Constraints:** One screen, printed handout. No academic papers/reading lists.
      *   **Specific Requests:**
          1.  **Dependency Structure:** Order of pieces (arithmetic vs. interpretation).
          2.  **The Case:** A fresh example (not Berkeley/Kidney Stones), actionable numbers, a detail changeable mid-session to flip the conclusion without changing table cells, and advice on having them construct the reversal (equal vs. unequal groups).
          3.  **Misconceptions:** List expected + unexpected, when to head them off, and consequences of timing errors.
          4.  **Three Uncertainties:** (a) Pre- vs. Post-exposure grouping, (b) Infinite reversibility via subdivision, (c) Choice of summary metric. Verdicts needed.
          5.  **Framing Test:** Critique the user's one-sentence framing ("not a puzzle about numbers but a question about which partition you are entitled to hold fixed").
          6.  **Outcomes/Assessment:** What they should be able to do, a specific check (writing a lede), correct vs. wrong ledes, and 3-4 questions for reading studies.
          7.  **Risk Assessment:** What's most likely to fail, what to cut if short on time, and where the reasoning is weakest.

  2.  **Deconstruct the Challenge:**

      *   *Audience:* Journalists care about *stories*, *truth*, and *accountability*. They hate being tricked by math, but they also hate missing a story because they didn't understand the math. The "hostile" ones need to feel the math serves the story. The "expert" one needs to be engaged, not bored, but not allowed to derail the room.
      *   *Topic:* Simpson's Paradox is fundamentally about causal inference disguised as arithmetic. It's not a math trick; it's a context trick.
      *   *Time:* 75 minutes is tight for deep causal reasoning. Needs pacing.

  3.  **Drafting - Section by Section:**

      *   **1. Dependency Structure:**
          *   *Instinct:* User wants to show reversal first, then explain arithmetic.
          *   *Analysis:* If you show the reversal first without context, it looks like a magic trick (confirming the "hostile" view that stats are lies). If you do arithmetic first, it's boring.
          *   *Decision:* Show the *conflict* first (Headline A vs. Headline B), then reveal the table (the arithmetic), then reveal the *context* (the interpretation). The arithmetic must be simple enough that the *only* barrier is the grouping.
          *   *Order:* Context/Story -> The Aggregate Claim -> The Subgroup Claim -> The Table (Arithmetic) -> The Causal Mechanism.
          *   *Why:* If you do arithmetic before the interpretive problem, they think it's a calculation error. If you do interpretation too late, they think the aggregate is "the lie." The "surprise" needs to happen when they realize the *same numbers* support opposite headlines depending on the story.

      *   **2. The Case:**
          *   *Constraint:* Not Berkeley/Kidney Stones. Actionable numbers. Changeable detail mid-session.
          *   *Idea:* A salary negotiation or hiring scenario is relatable. Or a policy intervention. Let's try a **Police Stop/Search** scenario or a **School Testing** scenario.
          *   *Selection:* **A Drug Trial vs. Real World Evidence (Post-Market Surveillance).** Actually, let's go with something more civic: **School Funding and Test Scores.**
          *   *Refinement:* Let's use **Recidivism Rates in Two Prisons**.
              *   *Why:* High stakes, actionable (which prison is better?), easy to grasp "low risk" vs "high risk" inmates.
              *   *Table:* Prison A vs. Prison B. Low Risk vs. High Risk inmates.
              *   *The Flip:* The detail to change mid-session is the *assignment mechanism*. Are inmates assigned to prisons based on risk (confounding) or randomly?
              *   *Construction Task:* User wants them to try to build a reversal with equal groups.
              *   *Verdict:* This is a trap. It takes too long and focuses on the math mechanics rather than the causal story. *Better:* Give them the table, ask them to write the headline. Then give them the context.
              *   *Wait, re-reading constraint:* "I'd also like your view on whether they should construct the reversal themselves... If that's workable... if it's a trap..."
              *   *Decision:* It's a trap for 75 mins with mixed numeracy. It turns a causal lesson into an arithmetic lesson. *Alternative:* Give them two aggregated numbers and two subgroup sets, ask them to match them. No, that's still mathy.
              *   *Best approach:* Give them the table *without labels*. Ask "Who wins?" Then add labels. Then change the *story* about how people got into the groups.
              *   *The "Changeable Detail":* The *reason* for the group size difference. (e.g., Prison A takes all the hard cases).
          *   *Revised Case:* **Two Marketing Campaigns.**
              *   *Aggregate:* Campaign A has higher conversion.
              *   *Subgroups:* Mobile vs. Desktop. Campaign B wins on both.
              *   *Why:* Journalists understand marketing.
              *   *The Flip:* Was the traffic allocation random (A/B test) or did Campaign A get dumped on Mobile because it was cheaper?
              *   *Actually, let's go with the User's "Actionable" constraint:* A reader needs to decide. **Choosing a Hospital.**
              *   *Table:* Hospital A vs. Hospital B. Condition: Serious vs. Routine.
              *   *The Flip:* Is "Condition" a pre-existing trait (patient comes in sick) or a result of the hospital's triage (hospital labels them sick)?
              *   *Let's stick to the Prison/Recidivism idea but simplify.* It's about *justice*.
              *   *Wait, the "Changeable Detail" constraint is key.* "Detail I can change mid-session while leaving every cell of the table identical, such that the right conclusion flips."
              *   *Example:* **Voting Turnout.** District X vs. District Y. Urban vs. Rural.
              *   *Better:* **A Welfare Program.** Participants vs. Non-participants. Employed vs. Unemployed.
              *   *Let's try: **Two Airlines' On-Time Performance.** (Classic, but maybe too close to Berkeley).*
              *   *Let's try: **A New Teaching Method.** School A (New Method) vs. School B (Old Method).
              *   *Subgroups:* High SES vs. Low SES students.
              *   *Table:* New Method wins in both subgroups. Old Method wins in aggregate.
              *   *The Flip:* Did the schools *choose* the method, or was it assigned? If School A chose the New Method and also happens to have more Low SES students (who struggle more), the aggregate is biased.
              *   *Okay, let's finalize the **Hospital Survival Rate** example.** It's the most "life or death" actionable.
              *   *Table:* Hospital A (3% death), Hospital B (2% death). Aggregate: B is better.
              *   *Subgroups:* Good Condition vs. Poor Condition.
              *   *Data:* Hospital A beats B in Good. Hospital A beats B in Poor.
              *   *The Flip:* Why are there more Poor Condition patients in Hospital A?
              *   *Scenario 1:* Hospital A is a Trauma Center (takes the worst cases). -> Trust Subgroups.
              *   *Scenario 2:* Hospital A is bad at triage, mislabeling people as Poor Condition, or the "Condition" is measured *after* admission based on complications caused by the hospital. -> Trust Aggregate (or rethink the variable).
              *   *Actually, the "Pre- vs Post-exposure" uncertainty (Point 4) fits perfectly here.*
              *   *Construction Task:* I will advise against them building the math. It wastes time. Instead, have them *diagnose* the table.

      *   **3. Misconceptions:**
          *   *List:* Aggregate is a lie; Subgroups are truth; Small sample; Ecological fallacy; Print both; **Selection Bias (the real cause)**; **Collider Bias**.
          *   *Timing:* "Aggregate is a lie" must be headed off *during* the reveal. "Print both" is the closing argument. "Selection bias" is the core lesson.
          *   *Damage:* If you say "Subgroups are truth" too early, they ignore weighting. If you say "Print both" too early, they abdicate judgment.

      *   **4. Three Uncertainties:**
          *   *(a) Pre- vs. Post-exposure:* **Include.** This is the crux. If the grouping variable is affected by the treatment, you can't adjust for it. This distinguishes Simpson's from standard confounding.
          *   *(b) Infinite Reversibility:* **Exclude/Qualify.** It's technically possible with enough noise, but practically, it's a "gotcha" tactic. Tell them: "You can't reverse *causal* truth, only statistical associations." Don't give them a weapon to dismiss all data.
          *   *(c) Choice of Summary:* **Include briefly.** Ratios vs. Differences. Sometimes the paradox disappears if you change the metric. Important nuance, but don't let it bog down the main point.

      *   **5. Framing Test:**
          *   *User's Frame:* "Not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it."
          *   *Critique:* It's accurate but abstract. "Entitled to hold fixed" sounds philosophical.
          *   *Fix:* "The numbers are right, but the story is wrong. The paradox isn't in the math; it's in the *cause* of the group sizes."

      *   **6. Outcomes/Assessment:**
          *   *Task:* Write a lede.
          *   *Correct Lede:* Must mention the *context* of the grouping (e.g., "Hospital A treats sicker patients...").
          *   *Wrong Lede:* "Hospital B is safer" (Aggregate) or "Hospital A is safer" (Subgroup) without qualification.
          *   *Diagnostic:* If they pick Aggregate, they missed the confounding. If they pick Subgroup without context, they missed the selection bias risk.
          *   *Card Questions:* 1. Who put them in the groups? 2. Does the group size matter? 3. What happens if I ignore the groups? 4. Is the grouping variable a cause or a result?

      *   **7. Risk Assessment:**
          *   *Failure Point:* The "Expert" in the room derailing the causal inference discussion with mathematical edge cases (e.g., causal graphs).
          *   *Cut:* The "Choice of Summary" (Metric) nuance.
          *   *Weakest Link:* The transition from "Math works" to "Causality matters."

  4.  **Refining the Plan (Self-Correction during drafting):**

      *   *Timing:* 75 mins.
          *   Intro/Hook: 10
          *   The Case (Reveal): 20
          *   The Mechanism (Why): 20
          *   Misconceptions/Debate: 15
          *   Exercise/Wrap: 10
      *   *The "Construction" Trap:* I need to be firm here. Asking journalists to *calculate* Simpson's paradox in 75 mins is a disaster. They will get stuck on the arithmetic. They need to *interpret* it. I will suggest a modified version: Give them the subgroups, ask them to predict the aggregate.
      *   *The "Changeable Detail":* I need to make sure this is dramatic. The *same table* leads to *opposite advice*.
      *   *Example:* **The Job Training Program.**
          *   Program A vs. Program B.
          *   Subgroups: High School Grad / No High School.
          *   Table: A wins in both. B wins overall.
          *   *Flip:* Scenario 1: Participants self-select into programs (A attracts harder-to-employ). -> Trust Subgroups.
          *   *Flip:* Scenario 2: Program A *causes* people to drop out of High School (Grouping is post-treatment). -> Trust Aggregate (or discard subgroups).
          *   *Actually, the Hospital example is clearer for "Actionable".* Let's stick with Hospital Survival.
          *   *Flip:* Scenario 1: Hospital A is a Trauma Center (Pre-existing severity). -> Go to A (Subgroups).
          *   *Scenario 2: Hospital A's "Severity" rating is based on complications *during* stay (Post-treatment). -> Go to B (Aggregate).*
          *   *Wait, is Scenario 2 Simpson's?* Yes, conditioning on a collider/mediator.
          *   *Okay, I will structure the response around the Hospital example.*

  5.  **Final Polish:**
      *   Ensure tone is respectful of their expertise (journalism) while challenging their numeracy.
      *   Make sure the "Expert" in the room is managed (give them a specific role or acknowledge the depth without diving in).
      *   Check the "Handout" constraint.
      *   Check the "One Screen" constraint.

  6.  **Writing the Response:** (Iterative refinement of the sections based on the above thoughts). *Self-Correction on the "Construction" task:* I'll suggest a "Weighted Average" visualization instead of calculation. It shows *why* the aggregate flips without needing algebra.

      *   *Framing:* The user's framing is good but needs to be punchier for a newsroom. "The numbers aren't lying, the labels are."
      *   *Misconceptions:* Add "The Parity Assumption" (assuming groups are comparable).
      *   *Uncertainties:* Be decisive. Pre/Post is crucial. Infinite reversal is dangerous. Summary metric is secondary.

  7.  **Final Review against constraints:**
      *   75 mins? Yes.
      *   14 people? Yes.
      *   Mixed numeracy? Yes (keep math visual).
      *   No reading lists? Yes.
      *   Address all 7 points? Yes.

      *(Self-Correction during final output generation)*: I need to make sure I explicitly answer the "Dependency Structure" question about Arithmetic vs. Interpretation. My verdict: Interpretation (The Story) -> Arithmetic (The Table) -> Interpretation (The Causal Mechanism). You can't see the paradox without the arithmetic, but you can't care about it without the story.

      *Let's finalize the "Construction" advice.* I will advise *against* having them build the table from scratch. It's too much cognitive load. Instead, give them the components and ask them to assemble the *narrative*.

      *Let's finalize the "Changeable Detail".* The variable definition. Is "Severity" measured on admission or at discharge? That changes the table's meaning without changing the numbers.

      *Okay, ready to write.*
answer: |-
  Here is a plan designed for a newsroom environment, prioritizing causal reasoning over arithmetic mechanics, and structured to manage the specific personalities you described.

  ### 1. Dependency Structure: The Order of Operations

  Your instinct is correct: **Show the reversal first, then the arithmetic, then the mechanism.**

  If you start with the arithmetic (the table), the hostile numeracy group will treat it as a calculation puzzle ("Why does 40% + 60% not equal 50%?"). They will disengage, thinking this is a math class. If you start with the mechanism (causal diagrams), you lose the room before they care about the problem.

  **The Sequence:**
  1.  **The Conflict (5 mins):** Present two contradictory headlines derived from the *same* dataset. (e.g., "Hospital B Safer" vs. "Hospital A Safer for Every Patient Type").
  2.  **The Arithmetic (15 mins):** Reveal the single table that supports both. Let them verify the math is not broken. This establishes that the *numbers* are not the problem.
  3.  **The Mechanism (25 mins):** Introduce the context that explains *why* the group sizes differ. This is where the "right" conclusion is chosen.
  4.  **The Application (30 mins):** Exercises and misconceptions.

  **Why this order?**
  The "surprise" of Simpson's Paradox is not that $A > B$ and $B > A$ simultaneously. The surprise is that **weighting matters more than rates.** If you explain the weighting (arithmetic) before they feel the conflict (interpretive problem), they will view the weighting as a technicality. They need to feel the journalistic dilemma first: *Which headline do I print?*

  **The Collapse Point:**
  If you move the **Mechanism** (Step 3) to the end, the session fails. Without the mechanism, the room will default to the misconception that "Subgroups are always the truth." You must intervene *before* they solidify that rule. The arithmetic must be silent, but the context must speak.

  ### 2. The Case: "The Hospital Survival Rates"

  Do not use Berkeley or Kidney Stones. Use **Hospital Survival Rates**. It is high-stakes, actionable, and familiar.

  **The Table (Handout & Screen):**
  | Hospital | Patients | Died | Survival Rate |
  | :--- | :--- | :--- | :--- |
  | **Hospital A** | 1000 | 90 | **91%** |
  | **Hospital B** | 1000 | 50 | **95%** |
  | | | | |
  | *Patients in Good Condition* | | | |
  | Hospital A | 100 | 5 | **95%** |
  | Hospital B | 900 | 45 | **95%** |
  | | | | |
  | *Patients in Poor Condition* | | | |
  | Hospital A | 900 | 85 | **90.5%** |
  | Hospital B | 100 | 5 | **95%** |

  *(Note: I have adjusted the numbers slightly so Hospital B wins in subgroups too, making the aggregate reversal starker, or you can keep A winning subgroups and B winning aggregate. Let's stick to the classic: **A wins subgroups, B wins aggregate**.)*

  **Corrected Table for the Session:**
  | Hospital | Condition | Patients | Died | Survival % |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | Good | 100 | 2 | 98% |
  | **A** | Poor | 900 | 80 | 91% |
  | **A** | **Total** | **1000** | **82** | **91.8%** |
  | | | | | |
  | **B** | Good | 900 | 18 | 98% |
  | **B** | Poor | 100 | 10 | 90% |
  | **B** | **Total** | **1000** | **28** | **97.2%** |

  *Wait, for Simpson's, A must beat B in subgroups.*
  **Revised Table (The "Paradox" Setup):**
  | Hospital | Condition | Patients | Died | Survival % |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | Good | 100 | 1 | **99%** |
  | **B** | Good | 900 | 18 | **98%** |
  | | | | | |
  | **A** | Poor | 900 | 80 | **91%** |
  | **B** | Poor | 100 | 10 | **90%** |
  | | | | | |
  | **A** | **Total** | **1000** | **81** | **91.9%** |
  | **B** | **Total** | **1000** | **28** | **97.2%** |

  *Check:* A wins Good (99 vs 98). A wins Poor (91 vs 90). B wins Total (97.2 vs 91.9).
  *Why?* Hospital A treated almost all the Poor patients (900 vs 100). Hospital B treated almost all the Good patients.

  **The Changeable Detail (Mid-Session):**
  You keep the table identical. You change the **caption** describing how patients were assigned.
  *   **Scenario 1:** "Condition" is assessed on **admission**. Hospital A is a Level 1 Trauma Center; it takes the worst cases by design.
      *   *Conclusion:* Ignore the aggregate. Hospital A is better. Send the trauma victims there.
  *   **Scenario 2:** "Condition" is assessed at **discharge** (e.g., "Did complications arise?"). Hospital A is aggressive and keeps patients longer, marking more as "Poor Condition" due to post-op monitoring.
      *   *Conclusion:* The subgroups are rigged. Trust the aggregate. Hospital B is safer.

  **On Constructing the Reversal:**
  **Do not make them build the reversal.** It is a trap.
  *   **Why:** With mixed numeracy, 5 minutes will vanish on arithmetic errors. The hostile group will fixate on the calculation, not the logic. The "expert" will correct their math, dominating the room.
  *   **Instead:** Give them the subgroup rates and the group sizes on cards. Ask them to *predict* the aggregate winner. When they guess wrong (because they average the percentages), show them the weighted reality. This demonstrates that **group size drives the aggregate**, not just the rates.

  ### 3. Misconceptions: Timing and Defusal

  | Misconception | When to Head Off | Damage if Mistimed |
  | :--- | :--- | :--- |
  | **"The aggregate is a lie."** | **During the Reveal.** Explicitly state: "The aggregate is mathematically correct. It answers a different question." | If left too late, they will treat all aggregate data as suspicious, leading to cherry-picking subgroups. |
  | **"Subgroups are always the truth."** | **During the Mechanism.** Use the "Changeable Detail" (Scenario 2 above) to show subgroups can be biased too. | If not addressed, they will stratify by irrelevant variables (e.g., shoe size) to find a story. |
  | **"It's a small-sample artefact."** | **Before the Case.** State clearly: "This holds even with N=1,000,000." | If they think it's noise, they will ignore the lesson as irrelevant to "real" data. |
  | **"Print both and let readers decide."** | **In the Last 10 Mins.** This is the journalist's cop-out. | If addressed too early, they won't engage with the causal reasoning. They need to feel the burden of choice first. |
  | **"It's the Ecological Fallacy."** | **Exclude.** | **Damage:** Confusion. Ecological fallacy is about inferring individuals from groups. Simpson's is about confounding within groups. Don't blur them. |
  | **"More data fixes it."** | **During the Mechanism.** | **Damage:** They will ask for bigger datasets instead of better variables. |

  **One you haven't listed:** **"The Parity Assumption."** The belief that the groups *should* have been equal size. You must explicitly state that in the real world, groups are rarely equal, and that imbalance is where the story hides.

  ### 4. The Three Uncertainties: Verdicts

  1.  **Pre- vs. Post-Exposure Grouping:**
      *   **Verdict:** **Include.** This is the single most important takeaway.
      *   **How:** Keep it non-technical. "Did the patient have the condition *before* they chose the hospital, or did the hospital *give* them the condition?"
      *   **Risk:** The hostile group might glaze over. Counter this by using the Hospital Scenario 1 vs. Scenario 2 flip. It makes the abstract concrete.

  2.  **Infinite Reversibility (Subdividing forever):**
      *   **Verdict:** **Exclude.**
      *   **Reasoning:** You are right to worry. Telling journalists "any result can be reversed" gives them a license to dismiss inconvenient data. It is a sceptic's weapon, not a reporter's tool.
      *   **Replacement:** Tell them: "You can only reverse the association if you slice by a variable that *causes* the imbalance. Don't slice by birthday."

  3.  **Choice of Summary (Ratios vs. Differences):**
      *   **Verdict:** **Leave out.**
      *   **Reasoning:** It is a subtlety that complicates the core causal lesson. If they master the grouping variable logic, they can learn metric sensitivity later. Acknowledge it exists ("Sometimes changing the math changes the answer") but do not demonstrate it.

  ### 5. Testing Your Framing

  *Your Frame:* "This is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it."

  *Critique:* It is accurate, but "entitled to hold fixed" is philosophical and passive. It sounds like a rulebook issue.
  *Repair:* **"The numbers describe the past; the partition describes the cause. Don't let the arithmetic make the causal choice for you."**
  *Why:* Journalists understand "cause." They understand that math describes *what happened*, but reporting explains *why*. This frames Simpson's Paradox as a reporting failure, not a math failure.

  ### 6. Outcomes and Assessment

  **The Check:**
  Hand them a press release paragraph: *"New Study Shows Drug X reduces heart attacks by 20% overall. However, in men, it reduced attacks by 10%, and in women, by 10%."* (Implicitly, the group sizes were skewed).
  **Task:** Write a one-sentence lede.

  **Correct Lede:** Must identify the *imbalance*.
  *   *Example:* "Drug X appears effective overall, but the benefit is driven by a higher proportion of low-risk patients in the treatment group."
  *   *Or:* "While Drug X showed a 20% overall reduction, the effect was uniform across genders, suggesting the aggregate result reflects patient mix rather than drug efficacy."

  **Tempting Wrong Lede:**
  *   *Example:* "Drug X reduces heart attacks by 20%, though effects vary by gender." (Ignores the paradox).
  *   *Example:* "Drug X fails in subgroups despite aggregate claims." (Assumes subgroups are automatically truth).

  **Diagnostic:**
  *   If they cite the Aggregate only: They missed the subgroup conflict.
  *   If they cite the Subgroups only: They fell for the "Subgroups are truth" trap.
  *   If they cite the *mix* (group sizes): They understood the lesson.

  **The Card (4 Questions for any study):**
  1.  **Who put them in the groups?** (Random assignment or self-selection?)
  2.  **Did the group sizes change?** (Is one group much bigger than the other?)
  3.  **Does the grouping variable exist *before* the treatment?** (Or is it a result of it?)
  4.  **If I ignore the groups, what story do I tell? If I split them, what story do I tell?** (Force them to articulate the conflict).

  ### 7. Risk Assessment and Contingencies

  **Most Likely Failure Point:**
  The **"Expert" in the room.**
  They will raise their hand during the "Mechanism" section and say, "Actually, this is just omitted variable bias," or "You should be using a DAG."
  *   **Mitigation:** Pre-empt them. "One of you knows more about the math than I do. I'm going to ask you to help me with the *words*, not the numbers. I need you to tell me when I'm using the wrong causal term." Give them a job that validates their expertise without derailing the pacing.

  **What to Cut if Short on Time:**
  Cut the **"Construction/Prediction"** activity (where they guess the aggregate). Go straight to the revealed table. It saves 10 minutes and ensures you get to the "Changeable Detail" flip, which is the core lesson.

  **Weakest Link in Reasoning:**
  The transition from **"Math is Silent"** to **"Journalist Must Choose."**
  There is a risk they walk away thinking, "So I just pick the one that fits my narrative."
  *   **Fix:** In the final 5 minutes, be explicit: "You do not pick the narrative. You report the *reason for the imbalance*. If you can't find out why the groups are different sizes, you cannot report the comparison." This shifts the burden from *choosing a number* to *reporting the context*.

  **Final Note on the Handout:**
  Print the table *without* the Scenario 1/Scenario 2 text. Have that text appear on the screen or be handed out on a second slip of paper mid-session. This physical separation reinforces that the *numbers* didn't change, only the *story* did.
