answer: |-
  **MEMORANDUM**
  **TO:** Author
  **FROM:** Senior Committee Member
  **RE:** Workshop Prep / Damage Control

  You've got a strong paper. The "Coercion-Symmetry Condition" is a sharp hook, and the empirical catalog of extraterritorial coercion is your strongest armor. But you know as well as I do that workshops don't kill papers on the text; they kill them in the Q&A. You have two known structural weaknesses (the threshold and the defensive coercion escape hatch) and a room full of people whose job is to find the crack and pour water in.

  Below are the eight objections you are most likely to face, ordered by the product of *likelihood* and *damage*. I have drafted the objection in the voice of the specific colleague who will ask it, followed by a two-minute oral response strategy. I have also explicitly marked what you must concede, what you must hold, and where you are bluffing.

  At the end, I have flagged the duplicate objections, the one you should welcome, and the "Nuclear Question" you are hoping stays in the box.

  ---

  ### 1. The Threshold Trap
  **Who:** Liberal Nationalist #1
  **The Objection:** "You say a state forfeits its right to exclude if it 'genuinely refrains' from coercion. But states always project some power. A visa requirement is a coercion. A carrier sanction is a coercion. Is *any* extraterritorial administrative burden enough to trigger a right to entry? If I check a passport in an embassy, have I forfeited my right to say no at the border? If you can't give me a principled threshold for how much coercion forfeits how much sovereignty, your condition is either trivial (always met) or catastrophic (never met)."

  **The 2-Minute Answer:**
  "Distinguish between *gatekeeping* and *governing*. A visa check is a query about permission to enter; it is the mechanism of exclusion itself. Carrier sanctions, offshore processing, and liaison officers are different: they are the projection of domestic rule into foreign jurisdictions to stop people *before* they even ask. My threshold isn't about the *amount* of friction, but the *location of authority*. If you exercise police power over someone who is not seeking entry to your territory yet—say, stopping a boat in international waters or criminalizing conduct in a transit state—you are governing them without admitting them. That is the line. Gatekeeping is permissible; extraterritorial administration is not."

  *   **Concede:** Admit that the line between a strict visa regime and extraterritorial policing is blurry in practice.
  *   **Hold:** Hold that *jurisdictional reach* is the metric, not the *severity of burden*.
  *   **Bluff Flag:** You are bluffing on the "gatekeeping vs. governing" distinction. A visa denial backed by threat of permanent ban is a form of governance. If pressed, you'll have to fall back on "intent," which is weak.

  ### 2. The Causal Overflow
  **Who:** Open-Borders Cosmopolitan (or sharp Grad Student)
  **The Objection:** "You focus on direct border coercion. But states shape migration through trade policy, conditional aid, and climate inaction. If the US signs a trade deal that destroys local agriculture in Guatemala, causing migration, and then excludes those migrants, isn't that also 'coercion without admission'? If your symmetry condition counts *that*, then almost every wealthy state forfeits its right to exclude everything. Are you secretly an open-borders theorist?"

  **The 2-Minute Answer:**
  "I'm restricting the Coercion-Symmetry Condition to *juridical and security apparatuses*, not general causal effects. There is a moral difference between shaping the background conditions of the global economy and actively deploying police power to restrain specific individuals. My argument targets the *migration enforcement regime* specifically—the visas, the pushbacks, the biometrics. If we expand 'coercion' to include all causal impacts of state policy, we lose the ability to distinguish between a border guard and a trade minister. I am arguing for the dismantling of the remote-control border, not necessarily the entire global economic order."

  *   **Concede:** Admit that economic coercion is also unjust, but distinct from your specific claim.
  *   **Hold:** Hold that *directed enforcement* is qualitatively different from *structural causation*.
  *   **Bluff Flag:** This is your weakest philosophical ground. "Directed enforcement" vs. "structural causation" is doing all the work here to save your theory from collapsing into open borders. If they press on *why* the distinction matters morally, you have no answer ready other than "scope."

  ### 3. The Jurisdictional Mismatch
  **Who:** Public-Law Person
  **The Objection:** "You're using 'coercion' to do the work of 'jurisdiction.' In constitutional law, jurisdiction is territorial or based on consent. If I stop a migrant in international waters, I am not exercising jurisdiction over them in the legal sense; I am intercepting them. If your moral theory requires states to grant standing or rights to people they have explicitly intercepted to *prevent* jurisdiction, you are asking for a legal category error. How does your 'scaled claim' map to standing?"

  **The 2-Minute Answer:**
  "I am making a claim about political legitimacy, not current positive law. The law often lags behind the moral reality of power. If a state agent stops a boat in international waters, they are exercising *de facto* sovereignty, regardless of whether the Supreme Court calls it 'jurisdiction.' My argument is that once you exercise that *de facto* power, you incur the *de facto* obligations of a ruler. The legal doctrine of 'entry fiction' or 'interdiction' is precisely the loophole I am criticizing. We shouldn't let legal categories sanitize moral domination."

  *   **Concede:** Admit this creates tension with current doctrine (e.g., *Zadvydas*, *Trump v. Hawaii*).
  *   **Hold:** Hold that moral legitimacy constrains legal interpretation, not vice versa.
  *   **Bluff Flag:** You are bluffing on the "remedy." If the law says they have no standing, your "scaled claim" is unenforceable. You're offering a moral right with no legal vehicle.

  ### 4. The Defensive Coercion Escape Hatch
  **Who:** Liberal Nationalist #2
  **The Objection:** "You worry about 'coercion without admission.' But border enforcement *is* coercion to prevent the coercion of unauthorized entry. If I lock my door, I am coercing the burglar. If I push back a boat to preserve the integrity of my legal system, isn't that just 'coercion necessary to prevent coercion'? You hinted at this exception. Doesn't that swallow your rule entirely?"

  **The 2-Minute Answer:**
  "Locking your door is passive; posting a guard in the neighbor's yard to stop the burglar before they leave their house is active. Defensive coercion is permissible only within the sphere of your own jurisdiction. When you push back a boat in international waters or criminalize conduct in a third country, you are not defending your territory; you are exporting your border. The 'prevention' exception only applies to threats *at* the boundary, not to threats *originating* outside it. Once you cross the line to intercept, you are no longer defending; you are policing."

  *   **Concede:** Admit that states have a right to defend their territory at the territorial line.
  *   **Hold:** Hold that *extraterritoriality* is the dealbreaker.
  *   **Bluff Flag:** You are bluffing on the "territorial line." In a world of drones and cyber surveillance, the "line" is porous. If they ask about surveillance satellites, you're in trouble.

  ### 5. The Feasibility/Realist Check
  **Who:** Political Scientist (Realist)
  **The Objection:** "Let's say you're right morally. States will never stop extraterritorial coercion because it's electorally popular and cheap. If your theory requires states to choose between 'stop coercing' or 'admit,' and they will always choose 'coerce harder,' what is this theory *for*? Is it just a lament? How does this constrain actual behavior?"

  **The 2-Minute Answer:**
  "Political theory doesn't always need to be a policy manual to be useful. It shifts the burden of justification. Right now, states claim a right to exclude *and* a right to remote control as if they are neutral. My argument forces them to admit: 'We are choosing to govern these people without representing them.' It makes the injustice visible. Practically, it gives litigators and activists a new frame: challenge offshore processing not on humanitarian grounds, but on *jurisdictional* grounds. You are ruling them; therefore, you must answer to them."

  *   **Concede:** Admit states will resist this fiercely.
  *   **Hold:** Hold that changing the *language* of legitimacy changes the *cost* of policy.
  *   **Bluff Flag:** You are bluffing on the "activist utility." Litigators need standing, which you admitted in #3 is shaky. This is a "hope for the future" answer.

  ### 6. The Care Deficit
  **Who:** Feminist/Relational Theorist
  **The Objection:** "You focus on coercion and power, but border regimes are also built on dependency and care. Who feeds the migrants in the transit camps your policies create? Who cares for the children in offshore detention? By focusing on 'coercion,' you ignore the relational ties that are formed *through* the exclusion process. Does your 'scaled claim' account for the care debt, or just the political debt?"

  **The 2-Minute Answer:**
  "That's a crucial addition. The Coercion-Symmetry Condition triggers the political claim, but the *content* of the remedy must include care. If a state creates a dependency through extraterritorial containment, it incurs a duty of care proportional to that containment. My argument is that the *political* right to exclude is forfeited, but that forfeiture opens the door to demanding *social* rights as well. Coercion creates the obligation; care specifies the content."

  *   **Concede:** Admit the paper under-theorizes social reproduction and care chains.
  *   **Hold:** Hold that political coercion is the *trigger* for the obligation.
  *   **Bluff Flag:** You are bluffing on the integration. You haven't actually worked out how a "fiduciary" model handles care work. This is a promising avenue for future work, but currently undeveloped.

  ### 7. The Scaled Claim Mechanics
  **Who:** Open-Borders Cosmopolitan
  **The Objection:** "You say the remedy is a 'defeasible, scaled claim to entry.' What does that look like? Is it a visa? Asylum? Citizenship? If I was coerced by a visa sanction in my home country, do I get to move to London? Or just to the border? If you can't specify the remedy, the right is hollow."

  **The 2-Minute Answer:**
  "It's a claim to *non-removal* and *due process*, not necessarily immediate citizenship. If you are subjected to extraterritorial coercion, the state cannot simply return you to the status quo ante. You must be admitted to a zone where you can contest the coercion. Practically, this looks like a right to a hearing on soil and a right to stay pending that hearing. It scales with the intensity of the coercion: pushbacks trigger immediate entry claims; visa delays trigger procedural claims."

  *   **Concede:** Admit the institutional design is vague.
  *   **Hold:** Hold that the *right to be present* is the minimum remedy.
  *   **Bluff Flag:** You are bluffing on the "scaling." How do you measure "intensity" objectively? This is where the "Threshold" problem from Objection #1 comes back to haunt you.

  ### 8. The Self-Determination Core
  **Who:** Liberal Nationalist #1 (Follow-up)
  **The Objection:** "Ultimately, self-determination *just is* the right to control who enters. You can't separate 'internal autonomy' from 'external exclusion.' If you force us to admit people we didn't choose, you have destroyed the self-determination you claim to protect."

  **The 2-Minute Answer:**
  "Self-determination is about a people governing *themselves*, not about a people governing *others*. You can have robust internal autonomy without projecting power outward. In fact, projecting power outward undermines self-determination by entangling the state in foreign jurisdictions. My argument protects self-determination by purifying it: keep your rule at home, and your right to exclude remains intact. Go abroad with your rule, and you forfeit it."

  *   **Concede:** Admit that in the current world, total separation is hard.
  *   **Hold:** Hold that the *principle* of self-determination does not logically entail extraterritoriality.
  *   **Bluff Flag:** This is the core philosophical clash. You are holding firm, but they won't be convinced. This is a stalemate, not a win.

  ---

  ### Meta-Analysis for the Room

  **The Duplicate Objections:**
  *   **Objection #1 (Threshold)** and **Objection #2 (Causal Overflow)** are the same objection. One asks "How much coercion counts?" and the other asks "Does *everything* count?" They both target the boundary of your Coercion-Symmetry Condition. Prepare one robust distinction (Directed Enforcement vs. Structural Causation) and use it for both.
  *   **Objection #4 (Defensive Coercion)** and **Objection #8 (Self-Determination)** are cousins. Both argue that exclusion is inherent to the state's nature. If you win #8, #4 weakens.

  **The Objection to Welcome:**
  *   **Objection #6 (The Care Deficit).** This makes you look generous and capacious. By conceding that care is under-theorized but integrating it as the "content" of your remedy, you show you aren't a rigid legalist. It humanizes the paper and gives the Feminist theorist a stake in your project's success rather than its destruction.

  **The "Nuclear Question" (The One You Hope Nobody Asks):**
  *   **The Question:** "If a state's carbon footprint or economic policy causally necessitates migration, and you count that as coercion, you are an open-borders theorist. If you *don't* count it, why is a border guard's coercion morally different from an economist's coercion? Isn't 'directed enforcement' just a fetishization of the state's own definition of power?"
  *   **Why it's dangerous:** It exposes that your distinction between "enforcement" and "causation" is arbitrary. If you admit economic policy counts, the room explodes (you become an open-borders advocate). If you deny it, the Cosmopolitan and the Realist will both tear you apart for privileging "uniformed coercion" over "structural violence."
  *   **Prep:** If this comes up, do not try to solve it. **Punt to scope.** "This paper addresses the *migration enforcement apparatus*. I am agnostic on global economic justice, though I suspect similar arguments apply. But we must walk before we run." Do not try to defend the moral distinction too hard; you will lose.

  **Final Advice:**
  You are strongest on the *empirics* (the list of extraterritorial tactics). Keep dragging them back to the concrete: "Are you saying liaison officers in Niger are *not* exercising power?" You are weakest on the *remedy* (the threshold/scaled claim). When pressed there, concede vagueness but insist on the *principle*. Don't let them turn a lack of policy detail into a philosophical refutation.

  Good luck. Don't apologize for the gaps; frame them as "areas for future development."
