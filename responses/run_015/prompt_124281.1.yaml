prompt: |-
  You're a senior political philosopher who's sat on more hiring and thesis committees than you can count and has watched a lot of strong papers die in the Q&A rather than on the page. Take your time, brainstorm a bit before you write, and then give me an actual prep sheet rather than a polished defense of my view.

  Next week I'm giving a paper at a political theory workshop — 45 minutes plus about 25 minutes of questions — and I want to walk in knowing what's coming. The room will be: two liberal nationalists who are fully on board with the self-determination argument for a right to exclude and think the open-borders literature is naive about political community; one open-borders cosmopolitan who's sympathetic to me but thinks the whole statist framing is a waste of time; a public-law person who works on alienage and immigration law at the constitutional level and will care about doctrine, jurisdiction and standing more than principles; a feminist/relational theorist who keeps asking whose dependencies and care-work any border regime is actually built on; a political scientist of the "realist, sick of ideal theory" variety; and a handful of grad students, half of whom will ask whatever the scariest faculty member was going to ask. My thesis, in short: the right to exclude is best understood as a fiduciary or jurisdictional power rather than an ownership-like one, and it comes with what I've been calling the Coercion-Symmetry Condition — a political community may permissibly exclude an outsider only if it genuinely refrains from exercising coercive power over that outsider, since the nationalist case for exclusion rests on a picture of outsiders as people the community simply does not rule. My claim is that contemporary states blow this condition constantly (visa conditionality and carrier sanctions, liaison officers posted in origin countries, offshore processing and pushbacks, criminalizing migration-related conduct extraterritorially, biometric extraction in transit states, readmission deals bought with aid and trade threats, border surveillance exported hundreds of miles outward), so they end up practicing what I call coercion without admission or selective subjection: they impose the burdens of being governed on people they refuse any of the protections of membership to. So the conclusion is that most actual exercises of the right to exclude are unjustified on the nationalists' own terms, and that the remedy is not open borders as such but a choice — stop coercing, or concede that coerced outsiders have a defeasible, scaled claim to entry. The two places I know I'm weakest: (a) I have no principled threshold for how much coercion forfeits how much exclusion-right, only a hand-wavy governance threshold, and (b) I keep wanting to say that coercion necessary to prevent coercion doesn't count, and I'm not sure that escape hatch doesn't swallow the rule.

  So here's what I want from you: roughly eight objections in the order you'd actually expect them to arrive in that room, ordered by likelihood times damage rather than by abstract importance, each phrased the way that particular person would phrase it (the public-law person's version should sound nothing like the feminist theorist's version, and the realist's objection should be about whether any of this could ever constrain an actual state), each with a two-minute-ish answer I could give out loud, an explicit note on what I should concede up front versus what I have to hold or the paper is over, and a flag for where my reply is thin and I'd be bluffing. Please also mark which objections are secretly the same objection wearing different clothes, which one I should actively welcome because answering it makes the paper look stronger, and — most importantly — give me the question I'm hoping nobody asks. I'm fairly sure it's some version of the everything-is-coercion worry: if any projection of power counts, then any state with an army, a trade policy, conditional aid, or a carbon footprint that shapes future migration flows forfeits the right to exclude entirely, so either I'm a closet open-borders theorist with a nationalist disguise or my condition needs a cutoff I can only get by smuggling back in the very self-determination view I'm criticizing — but tell me if you think the really dangerous one is somewhere else. Don't give me a reading list, bibliography or citations: I know the literature and I'll be writing this on a train with no access to anything, so I need the argumentative structure, not sources. And please don't spend your answer restating my thesis approvingly — assume I already believe it and want to be attacked.
