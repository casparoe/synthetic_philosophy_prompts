  # Between Will and World: Structural Leverage and the Stoic Dichotomy of Control

  **Abstract**

  The contemporary revival of Stoic ethics has largely coalesced around the therapeutic utility of the Dichotomy of Control. In popular and semi-academic treatments, this doctrine is frequently rendered as a binary distinction: agents must categorize phenomena as either "up to us" (*eph' hēmin*) or "not up to us," cultivating indifference toward the latter to secure tranquility (*ataraxia*). While effective for individual resilience, this binary framing obscures a critical zone of human agency: the capacity to design institutional norms and social structures that reshape the probability space of external outcomes without guaranteeing them. This proposal outlines a research project examining whether an Epictetan ethical framework can absorb this concept of "structural leverage" without collapsing the Dichotomy of Control. By juxtaposing close readings of Epictetus's *Discourses* with modern theories of collective agency and structural injustice, this seminar paper will argue that Stoicism possesses underutilized resources for political engagement. Specifically, it will investigate whether the design of social structures can be classified as an internal act of *prohairesis* (moral choice), even when the structural outcomes remain external indifferents. The project aims to move beyond the self-help appropriation of Stoicism, offering a robust account of collective agency compatible with ancient eudaimonism.

  ## 1. Introduction and Problem Context

  The resurgence of Stoicism in the twenty-first century is a significant phenomenon in practical ethics. From cognitive behavioral therapy (CBT) to leadership coaching and popular philosophy, the Stoic emphasis on resilience and rationality has found fertile ground in a volatile modern landscape. Central to this revival is the Dichotomy of Control, derived primarily from the teachings of Epictetus. The standard interpretation, propagated by figures such as William Irvine and Ryan Holiday, advises agents to rigorously distinguish between what is within their power (judgments, impulses, desires) and what is not (body, property, reputation, political office). The ethical imperative is to invest desire only in the former, thereby immunizing the self against the fragility of the latter.

  However, this binary formulation encounters significant friction when applied to complex modern problems involving collective action and institutional design. Consider the agent who seeks to mitigate climate change, reform criminal justice, or combat structural inequality. In these domains, no individual controls the outcome directly. A single agent cannot stop carbon emissions or overturn a verdict through sheer will. Under a strict binary reading of the Dichotomy, these outcomes are "not up to us." Consequently, a rigid application of Stoic ethics might suggest that the agent should remain indifferent to these outcomes, focusing solely on their own virtue while the world burns. This leads to a quietist interpretation of Stoicism, where political engagement is permissible only as a "preferred indifferent" but never as a locus of serious moral investment.

  Yet, this quietism contradicts the historical record of Stoic engagement. Seneca served Nero; Cato opposed Caesar; Marcus Aurelius commanded legions. The ancient Stoics were not hermits; they were cosmopolitans who believed in participating in the life of the city. The disconnect lies in how modern revivalists frame the mechanism of engagement. They tend to treat agency as individualistic and direct. If I cannot guarantee the outcome, I must treat it as external. This overlooks a middle zone of agency I term "structural leverage."

  Structural leverage refers to the capacity of agents to act not on outcomes directly, but on the systems, norms, and institutions that generate those outcomes. When I vote, when I legislate, when I build a community norm, I do not control the specific result (the election winner, the specific law passed, the individual behavior). However, I am not merely accepting fate; I am intervening in the causal architecture of the external world. I am shifting probabilities. I am designing the "game" rather than just playing it or quitting it.

  The philosophical problem is whether this middle zone is compatible with the Stoic Dichotomy. If I invest moral effort into shaping structures, am I not implicitly valuing the external outcomes those structures produce? If I design a just institution, do I not care about justice being realized externally? If the realization of justice is external, and I care about it, have I not violated the command to desire only what is up to us? Conversely, if I treat the design of the structure as purely internal, does that not strip the political act of its worldly significance?

  This research project proposes that the standard binary framing is a simplification that fails to capture the nuance of Epictetus's concept of *prohairesis* (moral volition) and *kathekon* (appropriate action). By recovering the Stoic understanding of social roles (*prosōpa*) and cosmopolitan duty, we can articulate a version of Stoic ethics that accommodates structural leverage. This requires demonstrating that the *attempt* to shape structures is an internal good, while the *success* of those structures remains an external indifferent, without rendering the attempt futile or hypocritical.

  ## 2. Precise Statement of the Research Question

  The central inquiry of this project is not merely historical exegesis but conceptual reconstruction. I aim to test the limits of the Stoic ethical framework against a modern problem it was not explicitly designed to solve: the ethics of institutional design in a complex society.

  **Primary Research Question:**
  Can an Epictetan ethics of the Dichotomy of Control accommodate the concept of "structural leverage"—where agents design norms and institutions to reshape the space of likely outcomes—without collapsing the distinction between internal virtue and external indifferents?

  **Secondary Questions:**
  1.  Does the standard modern revivalist interpretation of the Dichotomy (as a strict binary) misrepresent Epictetus's original distinction between *prohairesis* and externals?
  2.  Can collective agency be understood within Stoicism as an aggregation of individual *prohairesis*, or does it require a modification of the framework to account for shared intentionality?
  3.  If structural leverage is admitted, does it transform Stoicism from a therapy of acceptance into a philosophy of political resistance, and is this transformation philosophically stable?

  The hypothesis is that the Dichotomy is not a binary wall but a boundary of moral worth. We can act upon externals (including structures) as long as our moral worth remains tethered to the *quality of the attempt* (the internal use of impressions) rather than the *success of the structure* (the external outcome). However, this requires a sophisticated understanding of "attempt" that goes beyond individual action to include coordinated, systemic intervention. The risk is that focusing on structural leverage inevitably ties the agent's happiness to systemic success, thereby breaking the Dichotomy. The project will investigate whether the Stoic concept of "reserved clause" (*hupexairesis*)—acting with the reservation "fate permitting"—can safeguard the agent when acting upon complex structures where feedback loops are delayed and opaque.

  ## 3. Critique of Standard Revivalist Accounts

  To establish the necessity of this research, we must first delineate why current accounts leave this question open. The modern Stoic revival, while diverse, shares a common tendency toward psychological individualism.

  **The Therapeutic Reduction:**
  Prominent interpreters like William Irvine (*A Guide to the Good Life*) frame Stoicism primarily as a technique for happiness maximization. The Dichotomy of Control is presented as a tool for emotional regulation. In this framework, anything that threatens tranquility is to be reclassified as "not up to us." Structural problems, by their nature, are sources of frustration. They are slow, resistant, and often unsuccessful. Therefore, the therapeutic impulse is to detach from them. This leads to what I call the "Resilience Trap": the agent becomes highly resilient to injustice because they have categorized justice as an external indifferent. While this protects the agent's psyche, it neuters the ethical imperative to engage with the world.

  **The Binary Fallacy:**
  Even in more rigorous academic treatments, such as those by A.A. Long or Tad Brennan, the focus remains on the metaphysics of agency. The distinction is often drawn sharply: *prohairesis* is the only true good; everything else is *adiaphora* (indifferent). While these scholars acknowledge the Stoic commitment to cosmopolitanism, they rarely explore the *mechanics* of how a Stoic engages with systems they cannot control. The binary framing suggests that if I cannot control the outcome, I must treat the process as irrelevant to the outcome. But structural leverage relies on the process being *causally relevant* to the outcome, even if not determinative. Modern accounts often lack the vocabulary to describe this probabilistic agency. They speak of "control" in a deterministic sense (I pull the lever, the light turns on) rather than a probabilistic sense (I build the circuit, the light is likely to turn on).

  **The Neglect of Collective Agency:**
  Stoicism is often read as a philosophy for the solitary sage. Epictetus's dialogues are intensely personal, focusing on the individual's relationship with their own judgments. Modern revivalists amplify this by targeting individual self-improvement. Consequently, the dimension of *collective* *prohairesis* is under-theorized. If structural leverage requires collective action (building norms, institutions), we need an account of how multiple agents coordinate their *prohairesis* without violating the individual nature of virtue. Standard accounts do not address whether a group can hold a "reserved clause" together, or if the collective pressure to succeed compromises the individual's indifference to outcomes.

  By leaving these gaps open, standard accounts render Stoicism ill-equipped for contemporary political ethics. They offer a shield against the world but not a tool to reshape it. This project seeks to forge that tool.

  ## 4. Methodology

  This research will employ a dual-method approach, combining historical exegesis with conceptual analysis. The goal is not to claim that Epictetus explicitly theorized modern institutional design, but to demonstrate that his ethical principles are robust enough to extend into this domain without contradiction.

  **Phase 1: Close Reading of Epictetus**
  The primary textual focus will be the *Discourses* and the *Enchiridion*. I will focus on specific passages that deal with social roles and external engagement.
  *   *Discourses 1.1:* On what is in our power and what is not. I will analyze the Greek terminology of *eph' hēmin* to see if it allows for degrees of influence or if it is strictly binary.
  *   *Discourses 1.22 & 2.10:* On social roles (*prosōpa*). Epictetus discusses how we must act according to our roles as citizens, family members, etc. This is the entry point for structural engagement. If my role is a senator, my "appropriate action" (*kathekon*) involves legislation. I will examine whether the moral worth of the legislation lies in its passage (external) or its proposal (internal).
  *   *Discourses 4.1:* On freedom. This text clarifies that freedom is internal, but it also discusses how the sage interacts with tyrants and laws. This provides a model for engaging with oppressive structures without losing internal freedom.
  *   *Concept of *Hupexairesis* (Reserved Clause):* I will analyze how the Stoic adds the reservation "nothing preventing" to their actions. This is crucial for structural leverage. I can intend to build a just institution, *reserved* on the possibility that the world destroys it. Does this reservation hold when the "world" is a complex system of human behaviors rather than a simple external obstacle?

  **Phase 2: Comparison with Modern Collective Agency**
  To define "structural leverage" rigorously, I will engage with contemporary social ontology and political philosophy.
  *   *Collective Intentionality:* Drawing on theorists like Margaret Gilbert or Philip Pettit, I will examine how groups form agency. Can a group have a "will" analogous to the Stoic *prohairesis*? If not, how do individual Stoics coordinate?
  *   *Structural Injustice:* Drawing on Iris Marion Young's *Responsibility for Justice*, I will utilize the distinction between the "liability model" (direct control) and the "social connection model" (structural influence). This mirrors the Stoic problem. Young argues we have responsibility for structures we participate in even if we don't control them. I will test if Stoic *kathekon* can map onto Young's social connection model.
  *   *Probabilistic Agency:* I will briefly engage with decision theory concepts to formalize "structural leverage" as influencing probability distributions rather than determining outcomes. This helps clarify the "middle zone" between control and fatalism.

  **Phase 3: Synthesis and Reconstruction**
  The final phase will involve constructing the argument. I will attempt to map the modern concept of structural leverage onto the ancient framework.
  *   *Mapping:* Structural Design = *Kathekon* (appropriate action). Structural Outcome = *Adiaphoron* (indifferent).
  *   *Testing:* I will run thought experiments. Example: A Stoic legislator drafts a bill to reduce poverty. The bill fails due to corruption. Did the Stoic fail? Did they violate the Dichotomy by caring about the bill? I will use the texts to argue that the drafting was the virtue; the passage was the indifferent. However, I must address the counter-argument: if the drafting was done *for* the passage, is the desire not tainted? This requires a deep dive into Stoic motivation theory (acting for the sake of the common good vs. acting for the sake of the outcome).

  ## 5. Theoretical Framework: Defining Structural Leverage

  A core component of this proposal is defining the "middle zone" precisely, as it is the novel contribution of the research.

  **The Binary Standard:**
  *   *Internal:* My judgment, my impulse, my desire. (Control = 100%)
  *   *External:* The weather, the actions of others, the success of my projects. (Control = 0%)

  **The Structural Leverage Zone:**
  *   *Definition:* Actions taken to modify the rules, norms, or physical arrangements that constrain future actions (both my own and others').
  *   *Control Status:* I control the *design* of the structure (Internal), but I do not control the *operation* of the structure once released into the social world (External).
  *   *Example:* Writing a constitution. I control the words I write (Internal). I do not control whether citizens abide by them or whether demagogues subvert them (External).
  *   *The Stoic Challenge:* If I write the constitution *in order to* ensure citizens abide by it, am I not desiring an external?
  *   *Proposed Solution:* The Stoic writes the constitution because it is *according to nature* to act as a citizen. The intent is to perform the role of a lawgiver virtuously. The hope for compliance is a "preferred indifferent," pursued with the reserved clause. The leverage is real (the constitution changes probabilities), but the moral stake is internal.

  This framework challenges the modern view that "control" means "guarantee." In engineering and systems theory, control often means "influence within bounds." I will argue that Epictetus's *prohairesis* is compatible with this systems view. *Prohairesis* is not just about thinking; it is about the *use* of impressions to guide action in the world. If the action is structural, the use of impressions involves calculating probabilities and designing systems. As long as the agent remains indifferent to the final systemic output, the Dichotomy holds.

  ## 6. Work Plan and Chapter Breakdown

  Given the one-semester constraint, the project will be structured as a substantial seminar paper (approx. 8,000–10,000 words final output, proposed here in outline). The research timeline is divided into three phases.

  **Weeks 1–4: Exegesis and Textual Grounding**
  *   *Focus:* Close reading of Epictetus.
  *   *Task:* Compile all passages regarding *prohairesis*, *kathekon*, and social roles.
  *   *Deliverable:* Annotated bibliography and a 2,000-word exegesis summary establishing the ancient baseline.
  *   *Key Question:* Does Epictetus explicitly rule out investment in systemic outcomes, or does he only rule out *dependency* on them?

  **Weeks 5–8: Modern Theory and Conceptual Bridging**
  *   *Focus:* Collective agency and structural injustice.
  *   *Task:* Read selected portions of Young (*Responsibility for Justice*) and Pettit (*On the People's Terms*).
  *   *Deliverable:* Comparative matrix mapping Stoic terms to modern concepts (e.g., *Kathekon* ≈ Structural Responsibility).
  *   *Key Question:* Does modern collective agency require a metaphysics of group minds that Stoicism rejects? If so, can we reduce it to individual coordination?

  **Weeks 9–12: Synthesis and Drafting**
  *   *Focus:* Argument construction.
  *   *Task:* Draft the core argument regarding Structural Leverage. Address counter-arguments (e.g., the "Quietist Objection").
  *   *Deliverable:* First full draft of the paper.
  *   *Key Question:* Can I demonstrate that structural engagement enhances rather than diminishes Stoic virtue?

  **Weeks 13–15: Revision and Refinement**
  *   *Focus:* Polishing and Scope Check.
  *   *Task:* Ensure the argument does not drift into general political philosophy. Keep the focus on the Dichotomy of Control.
  *   *Deliverable:* Final Paper.

  ## 7. Success and Failure Conditions

  To ensure the project remains viable within a semester, clear criteria for success and failure are necessary.

  **Conditions for Success:**
  1.  **Conceptual Coherence:** The project successfully defines "structural leverage" in a way that is distinct from both direct control and fatalistic acceptance.
  2.  **Textual Fidelity:** The interpretation of Epictetus remains grounded in the text. I do not attribute modern political views to Epictetus but show how his principles *extend* to them.
  3.  **Ethical Stability:** The proposed framework does not collapse the Dichotomy. It must show how an agent can work tirelessly for structural change without their tranquility depending on the success of that change.
  4.  **Contribution:** The paper offers a critique of modern revivalist Stoicism that is constructive, not merely dismissive. It provides a path forward for "Political Stoicism."

  **Conditions for Failure:**
  1.  **The Collapse Problem:** If I cannot demonstrate how the agent avoids valuing the external outcome, the Dichotomy collapses. If designing a structure implies wanting it to work, and wanting it to work violates the Dichotomy, then Structural Leverage is incompatible with Stoicism. If this proves true, the project fails to find a middle zone.
  2.  **Anachronism:** If the comparison with modern collective agency forces Stoic concepts into molds they cannot fit (e.g., treating *prohairesis* as a collective will), the historical analysis fails.
  3.  **Scope Creep:** If the project expands into a general critique of capitalism or modern politics without returning to the ethical core of Stoicism, it loses its philosophical focus.
  4.  **Triviality:** If the conclusion is merely "Stoics can do politics as long as they don't care," without explaining *how* they manage the psychological tension of structural work, the insight is too shallow.

  **Mitigation Strategy:**
  If the "Collapse Problem" arises (i.e., I find that structural leverage is incompatible with the Dichotomy), the paper will pivot. Instead of proving compatibility, I will argue that the Modern Revival needs to *modify* the Dichotomy to accommodate structural leverage. This would be a normative claim: "Stoicism *should* evolve to include this," rather than "Stoicism *already* includes this." This saves the project from failure by turning a negative result into a constructive critique of the tradition.

  ## 8. Scope Check and Feasibility

  A one-semester seminar imposes strict limits. I must acknowledge where this project cannot go.

  **Limitations:**
  *   **No Full History of Stoicism:** I will not cover Zeno, Cleanthes, or Chrysippus in depth. The focus is strictly Epictetan because Epictetus provides the clearest formulation of the Dichotomy. Roman Stoics (Seneca/Marcus) will be used only for illustrative examples of political engagement.
  *   **No Empirical Sociology:** I will not empirically test whether Stoics are better at structural change. This is a philosophical conceptual analysis, not a social science study.
  *   **No Comprehensive Political Theory:** I am not building a full "Stoic Political Philosophy." I am addressing one specific mechanism (structural leverage) within ethical theory. I will not solve the problem of global justice, only the problem of individual agency within structures.

  **Feasibility:**
  The textual corpus for Epictetus is manageable (*Discourses* and *Enchiridion* are short). The modern literature on collective agency is vast, so I must limit my secondary sources to 2-3 key theorists (e.g., Young and Pettit) to avoid drowning in literature. The core argument is narrow enough for a semester paper: it focuses on the *compatibility* of one concept with another.

  **Risk Assessment:**
  The highest risk is the philosophical difficulty of the "Collapse Problem." It is easy to say "don't care about outcomes," but hard to explain how one maintains the motivation to build structures if one truly doesn't care about the outcome. Stoics argue virtue is its own reward, but structural work often requires long-term deferred gratification. I need to ensure I have the resources to explain how *kathekon* provides sufficient motivation without relying on external success. I will rely on the Stoic concept of "following nature" — the rationality of the cosmos demands we improve the human community. Doing so is rational regardless of success. This must be the anchor.

  ## 9. Significance of the Research

  Why does this matter? Beyond the academic exercise, there is a cultural urgency. Stoicism is being adopted by groups ranging from therapists to soldiers to activists. If the dominant interpretation is quietist and individualistic, it risks becoming an ideology of accommodation to unjust structures. "It's not up to me" becomes a slogan for disengagement.

  By recovering the possibility of structural leverage, this research contributes to a "Public Stoicism." It suggests that resilience is not just about enduring the world as it is, but about rationally designing the world as it ought to be, while maintaining inner freedom. This bridges the gap between ancient wisdom and modern civic responsibility. It challenges the self-help industry to take politics seriously and challenges political activists to take psychology seriously.

  Furthermore, on a meta-ethical level, this project tests the flexibility of eudaimonistic frameworks. Can a virtue ethics centered on internal character account for systemic influence? If Stoicism can do this, it suggests other virtue ethics might also have resources for structural analysis that have been overlooked.

