prompt: |-
  Bit of an odd one: I help coach a sixth-form debating squad (volunteer thing, so please keep the language plain), and we've got a capital punishment motion coming up on Saturday. Every single time we run it, someone on the abolition side eventually produces the line "better that ten guilty men escape than that one innocent man suffer", and it always works as a conversation-stopper. The other side will have spent five minutes building a deterrence case, the line gets dropped, and everyone behaves as though deterrence has just left the building. It hasn't, obviously — or at least it isn't obvious to me that it has — but I can't get my debaters to say why in a way that survives a rebuttal.

  What I want is a precisification menu, not a verdict. What are the distinct precise claims that sentence could be making? I've had a go at sorting them and I think there's (i) something about where the burden of proof sits, (ii) something about the relative badness of two error types — false acquittals vs false convictions, (iii) something about whether we aggregate risk across a whole penal system or look at one trial at a time, and (iv) something relying on a doing/allowing asymmetry: the state kills the innocent man but merely fails to punish the guilty ones. Someone on our side also said there's a fifth reading I'd completely missed, about who counts as "the innocent", and I think she's right. In a capital context that might mean factually innocent; or convicted only because of some procedural screw-up; or guilty of something real but not of the thing that's supposed to get you executed; or guilty enough by the jurisdiction's own rules but just not death-worthy. Those four don't seem to behave the same way in the argument at all, and my guess is the line is devastating for one or two of them and much weaker for the others, but I can't work out which way round it goes.

  A few other things I'd like pinned down while you're at it:

  - The number. Is "ten" doing real work, or is any ratio greater than one supposed to do the job? Is it a lexical-priority claim — no quantity of escaping guilty people could ever justify one innocent death — wearing a number as a costume, or an actual exchange rate that we could in principle go off and measure?
  - Who it's addressed to. Is it advice to a jury deciding one case, or a constraint on what a legislature may write into a penal code? Because the debater who beat us last time was using something that sounds like jury advice to kill a claim about legislation, and that feels like a slide.
  - The escalator problem, which is where I personally keep getting stuck: if the ratio holds for punishment generally and not just for execution, and you apply it to each marginal increase in severity, doesn't it eat every punishment there is? And if it only holds for execution, what's supposed to be special about the jump from life imprisonment to death that isn't just more of the quantity the ratio was already trading in? I tried arguing that the gap between twenty-five years and death is a difference in kind — irreversibility, and the fact that you can compensate someone for years but not for an execution — and I got told the compensation move proves far too much, since we don't let people buy their way out of prison either.
  - The one that matters most for Saturday: does the ratio count the deaths that occur because the ten escaped? If deterrence is real then letting ten guilty people walk isn't a free lunch even before we get to the innocent person, and I want to know whether the slogan has a reading on which that cost is inside the calculation and a reading on which it's excluded by construction, and which one my opponent has to be committed to if she wants it to defeat a deterrence argument rather than merely sit beside one.

  Can you lay it out as a list of readings, each with what it precisely says, whether it's trivial / defensible-but-contentious / actually false, and whether it gets her the conclusion she's using it for? Please don't bother with citations or reading lists — I've got no library access and I won't be able to check anything. And don't write me a speech either; I need the menu, I'll build the case myself. Sorry if I've mangled the phrasing of the line, you know the one I mean.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Volunteer coach for a sixth-form (high school/late teens) debating squad.
      *   **Task:** Provide a "precisification menu" for the Blackstone's Ratio slogan ("Better that ten guilty men escape than that one innocent man suffer") in the context of a capital punishment debate.
      *   **Constraints:** Plain language (no academic jargon), no citations/reading lists, no speech writing. Just a structured list of interpretations/claims.
      *   **Specific Areas to Cover:**
          *   Distinct precise claims (Burden of Proof, Error Costs, Aggregation, Doing/Allowing, Definition of "Innocent").
          *   The Number ("Ten" vs. Lexical Priority).
          *   Audience (Jury vs. Legislature).
          *   The Escalator Problem (Does it ban all punishment?).
          *   Deterrence/External Costs (Do the escaped guilty people's future crimes count?).
      *   **Goal:** Help debaters understand *why* the line stops conversation and how to rebut it by showing which specific claim is being made and why it might fail in this context.

  2.  **Deconstruct the Slogan ("Blackstone's Ratio"):**
      *   *Origin:* Blackstone (1760s), though variations exist (Fortescue, Voltaire, etc.).
      *   *Context:* Criminal law standard of proof ("Beyond Reasonable Doubt").
      *   *Debate Context:* Capital Punishment (Abolition vs. Retention).
      *   *Problem:* It's used as a trump card against deterrence arguments.

  3.  **Drafting the Menu - Section by Section:**

      *   **Section 1: The Core Claims (What kind of rule is this?)**
          *   *Idea 1: Burden of Proof.* It's about how sure we need to be.
          *   *Idea 2: Error Costs.* False Conviction is worse than False Acquittal.
          *   *Idea 3: Aggregation.* System-wide vs. Case-by-case.
          *   *Idea 4: Doing/Allowing.* State killing vs. State letting go.
          *   *Idea 5: Who is "Innocent"?* (As requested by the user).
          *   *Evaluation:* For each, is it trivial, contentious, or false? Does it kill the deterrence argument?

      *   **Section 2: The Number ("Ten")**
          *   *Idea:* Is it math or metaphor?
          *   *Analysis:* If it's math (10:1), deterrence could override it (if 1 execution saves 11 lives). If it's lexical (infinity:1), deterrence can't override it.
          *   *Verdict:* Usually metaphor for "a lot," but debaters treat it as lexical to block utilitarianism.

      *   **Section 3: The Audience (Jury vs. Legislature)**
          *   *Idea:* Is this for the person deciding the verdict or the people writing the law?
          *   *Analysis:* Jury instruction = standard of proof. Legislation = policy choice.
          *   *Slide:* Using a jury rule to block a policy argument is a category error.

      *   **Section 4: The Escalator Problem (Scope)**
          *   *Idea:* If innocent suffering is so bad, why have *any* prison?
          *   *Analysis:* Requires a threshold. Death is unique (irreversible, no compensation).
          *   *Rebuttal:* Compensation argument is weak (can't buy freedom), but irreversibility is strong.

      *   **Section 5: The Deterrence/External Costs (The "Escaped" Men)**
          *   *Idea:* Do the 10 guilty men hurt others if they escape?
          *   *Analysis:* The slogan ignores this. It focuses on the *justice system's* error, not the *consequences* of the error.
          *   *Key Point:* If deterrence is real, the "escape" isn't cost-free. The slogan assumes the cost of escape is zero (or negligible compared to innocent death).

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Tone Check:* Keep it plain. No "deontological," "utilitarian," "lexically prior." Use "rule-based," "outcome-based," "trump card."
      *   *User's Specific Point on "Innocent":* The user mentioned four types (factual, procedural, wrong crime, wrong penalty). I need to make sure I distinguish these clearly.
      *   *User's Specific Point on Deterrence:* This is the crux. I need to explain that the slogan *excludes* future victims of the escaped guilty men by definition. If you include them, the ratio changes.
      *   *Structure:* Use the user's requested format (List of readings, precise claim, status, effectiveness).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Acknowledge the frustration. It's a "conversation stopper" because it sounds like wisdom but hides assumptions.
      *   *Category 1: What is the rule?* (Epistemic vs. Moral).
      *   *Category 2: The "Innocent" Definition.* (Factually vs. Legally).
      *   *Category 3: The Number.* (Ratio vs. Absolute).
      *   *Category 4: The Audience.* (Courtroom vs. Parliament).
      *   *Category 5: The Escalator.* (Why death is special).
      *   *Category 6: The Deterrence Blindspot.* (The cost of the "escape").

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "Does it get her the conclusion?" part for each. The conclusion she wants is "Abolish Capital Punishment despite Deterrence."
      *   If it's just about standard of proof (Jury), it doesn't ban the law.
      *   If it's about moral cost (Legislature), it might, *unless* deterrence saves more innocents.
      *   The "Innocent" definition is crucial. If "innocent" means "didn't do *this* murder," deterrence might still justify it. If "innocent" means "doesn't deserve death," that's different.

      *(Refining the Deterrence Point)*: The slogan treats the "10 guilty escaping" as the *only* cost. If deterrence works, the cost is "10 guilty escaping + their future victims." The slogan ignores the future victims. To use the slogan against deterrence, the abolitionist must claim the innocent death is *infinitely* worse than any number of future victims of the guilty. That's a huge claim to hide in a catchy phrase.

  6.  **Final Review against Constraints:**
      *   Plain language? Yes.
      *   No citations? Yes.
      *   No speech? Yes.
      *   Addressed all bullet points? Yes.
      *   Sixth-form level appropriate? (Keep concepts clear but not dumbed down).

  7.  **Final Polish:** Check the "Innocent" section carefully as the user highlighted it. Ensure the distinction between "Factually Innocent" (didn't do it) and "Morally Innocent" (didn't deserve death) is clear, as this is where the deterrence argument often bites. (e.g., A guilty murderer might be "innocent" of the death penalty if the penalty is disproportionate).

      *Wait, one nuance:* The user asked about "guilty enough by jurisdiction's rules but just not death-worthy." This is the "proportionality" argument. I need to make sure that's distinct from factual innocence.

