answer: |-
  This is a sharp observation that cuts to the metaphysical core of current mechanistic interpretability. The field is indeed operating with a split ontology, masking it with methodological pragmatism.

  Here is the implicit theory unpacked, structured by the two tests, their philosophical commitments, and the consequences of enforcing consistency.

  ### 1. The Decoding Test: Informational Structuralism

  When researchers claim a representation exists because a probe can read it out (or an SAE feature correlates with it), they are relying on an **Informational Theory of Content**, specifically a structuralist variant.

  *   **The Condition for Evidence:** For decoding to count as evidence, it must be true that the model's activation space preserves the *topological structure* of the target concept space. It assumes that if concept $C$ exists in the world (or task), there is a subspace in the model isomorphic to $C$'s logical relations.
  *   **The Implicit Theory:** **Informational Semantics (Dretske/Fodor).** A state $S$ represents property $P$ if $S$ carries information about $P$ (i.e., $S$ covaries with $P$ under relevant conditions). In deep learning, this is strengthened to the **Linear Representation Hypothesis**: the information is not just present, but linearly accessible.
  *   **What It Rules Out:**
      *   **Holism:** It rules out the idea that the representation is distributed in a way that is non-linearly entangled beyond probe recovery.
      *   **Epiphenomenalism (Implicitly):** It assumes that if information is present in a readable format, it is *available* to the downstream mechanism. It treats the presence of information as sufficient for representation, regardless of whether the readout mechanism (the rest of the network) actually consults that information.
  *   **The Vulnerability:** This test validates **Dark Information**. A model might encode the parity of the input tokens in layer 1 but never use that parity to compute the output. Decoding says "this represents parity." Intuitively, if the model ignores it, it's not a representation *for the model*; it's just a physical correlate.

  ### 2. The Steering Test: Causal Role Functionalism

  When researchers claim a representation exists because intervening on it shifts behavior, they are relying on a **Causal/Functional Theory of Content**.

  *   **The Condition for Evidence:** For steering to count as evidence, it must be true that the activation direction is part of the *causal pathway* generating the behavior. It assumes that the representation is defined by its role in the computational graph, not its static geometry.
  *   **The Implicit Theory:** **Causal Role Functionalism (Cummins/Block).** A state $S$ represents $P$ if $S$ plays a specific causal role in the system's processing of $P$. This is close to a **Manipulability Account of Causation (Woodward)**: $X$ represents $Y$ if manipulating $X$ systematically changes $Y$-related outputs.
  *   **What It Rules Out:**
      *   **Passive Encodings:** It rules out the "Dark Information" problem. If you can decode it but steering it does nothing, it wasn't a representation; it was a shadow.
      *   **Input/Output Isomorphism:** It rules out the idea that the model is just a lookup table where internal structure doesn't matter. It demands the internal state be a *lever*.
  *   **The Vulnerability:** This test validates **Synthetic Features**. You can often steer a model by adding a vector that *never naturally occurs* during inference. If I add a "lie vector" that the model never activates on its own, but doing so makes it lie, have I found a representation of lying? Or have I just hacked the output layer? Strict causalism struggles to distinguish between *native* representations and *exploitable vulnerabilities*.

  ### 3. Is the Field Committed to a Single View?

  The field's willingness to treat these as interchangeable suggests they are **not** committed to a robust realist ontology of representations. Instead, the practice is consistent with a **Pragmatic Deflationism**.

  *   **The Implicit Ontology:** "Representation" is not a natural kind here; it is a **projectable predicate**. When researchers say "the model represents gender," they do not mean "there exists a Platonic entity 'gender' inside the weights." They mean: "There is a stable subspace that correlates with gender labels and allows us to predict/control gendered behavior."
  *   **Underdetermination:** The practice is underdetermined between Realism and Instrumentalism.
      *   *Realist reading:* The direction exists independently of our probes.
      *   *Instrumentalist reading:* The direction is a useful coordinate system we impose to compress the model's disposition.
  *   **Why the Interchangeability?** The field assumes a **Linearity Bridge**. The working hypothesis is that *Informational Availability implies Causal Availability*. If a direction is linearly decodable, the assumption is that the residual stream is linear, so downstream layers *could* read it. Therefore, if it's decodable, it's functionally potent. The gap you identified (decodable but unused) is treated as noise or a failure of the probe, not a failure of the definition.

  ### 4. Enforcing the Causal Criterion Strictly

  If we strictly enforce the Causal/Functional view (Steering is necessary and sufficient, Decoding is merely heuristic), the landscape of interpretability claims shifts drastically.

  **Claims to Retract:**
  1.  **"Concept Cells" without Causal Impact:** Any claim that a neuron or direction "encodes" a concept solely based on activation maximization or probing, without causal intervention (ablation/steering) showing a drop in task performance or shift in distribution. Much of the early "neuron interpretability" literature would be downgraded from "mechanism discovered" to "correlation observed."
  2.  **SAE Features as "Latents":** Many Sparse Autoencoder features decode beautifully but may be overcomplete bases that the model doesn't strictly use in isolation. If steering an SAE feature doesn't change behavior without breaking coherence, the claim that "the model uses this feature" is false. The feature is a *human-interpretable decomposition*, not a *model-native representation*.
  3.  **Safety Monitors based on Probes:** If you build a safety classifier on top of activations (decoding) to detect deception, but the model can deceive without activating that subspace (or activates it without deceiving), the monitor is philosophically unjustified. Strict causalism demands that to monitor a concept, you must monitor the *causal drivers* of that concept, not just correlates.

  **What Remains (and why we care):**
  1.  **Circuits and Pathways:** Mechanistic interpretability that traces actual information flow (e.g., Induction Heads, IOI circuits) survives. This is purely causal.
  2.  **Controllability:** The field shifts from "Mapping the Mind" to "Engineering the Levers." We stop caring about what the model "thinks" and care entirely about what inputs to the latent space produce safe outputs.
  3.  **The "Native" Constraint:** To avoid the "Synthetic Feature" problem, a strict causal account would need to add a constraint: **Naturalistic Intervention.** A representation is real only if (a) steering it works, AND (b) the model naturally traverses that direction during standard inference.

  ### 5. The Philosophical Cost

  If you enforce the causal criterion, you lose **Transparency** in favor of **Control**.

  *   **Decoding** offers a map. It tells you what is *present*, even if dormant. This is crucial for safety (detecting dormant capabilities or deceptive alignment).
  *   **Steering** offers a steering wheel. It tells you what is *active*.

  The field's current conflation is a bet that **the map is the territory**. They assume that if you can draw the map (decode), you can drive the car (steer). Your observation highlights that this bet is not yet philosophically secured.

  **Summary:** The field is implicitly **Functionalist** (representations are what the model *uses*) but methodologically **Structuralist** (representations are what we can *find*). They get away with it because in linear, high-dimensional spaces, structure often affords function. But where they come apart, the field has no metaphysical recourse other than "whatever helps us sleep at night." Strictly speaking, without causal validation, a decoded direction is not a representation; it is a **signature**.
