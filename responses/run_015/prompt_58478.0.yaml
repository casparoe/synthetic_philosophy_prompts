answer: |-
  This is a fantastic stress test for these concepts. Operation Varsity Blues (OVV) is arguably the perfect case study because it strips away the polite euphemisms of elite admissions and exposes the machinery underneath.

  Here is the map of Merit vs. Desert on the actors, an analysis of your three-way split, and the honest breakdown of where the theory cracks.

  ### 1. Mapping Merit vs. Desert on the Actors

  First, let's lock in your definitions:
  *   **Merit (Forward-Looking):** Functional capacity. Will this person thrive? Will they contribute to the university's mission (academic or athletic)?
  *   **Desert (Backward-Looking):** Moral claim based on agency. Did this person earn this through effort, sacrifice, and rule-following?

  | Actor | Merit (Forward-Looking Fit) | Desert (Backward-Looking Earnedness) |
  | :--- | :--- | :--- |
  | **The "Side Door" Kids** (OVV admits) | **Mixed/False.** Some were academically capable, but their *athletic* merit was fraudulent. They occupied slots meant for functional contributors. They failed the "fit" test for the specific channel used. | **Low to None.** Even the kids who "didn't know" (moral luck) did not *earn* the spot through the relevant effort. They are beneficiaries of unearned advantage. |
  | **The Parents** | **N/A.** They aren't the students. However, regarding their role as *agents*: they demonstrated high competence in manipulating the system, but negative merit regarding institutional integrity. | **Negative.** They actively subverted the rules. They claim desert (for their kids) based on wealth generation, but wealth generation does not confer moral desert for *educational* slots. |
  | **The Coaches** | **Failed.** They were hired to identify talent to win games/recruit. They selected based on bribes, failing their functional role. | **Negative.** They betrayed their employer and the other applicants. They broke the social contract of the gatekeeper. |
  | **The Legit Applicants** (Bumped) | **High.** Presumably met the criteria for academic or athletic contribution. | **High.** They invested the time, effort, and risk, playing by the stated rules. They have the strongest moral claim. |

  **The "Didn't Know" Kids:** This is where Merit and Desert diverge sharply.
  *   **Desert** forgives them partially (no malicious intent), but still denies they *earned* it.
  *   **Merit** doesn't care about their intent. If they can't play the sport or do the work, they lack merit, regardless of their moral innocence.

  ### 2. Testing Your Three-Way Split

  Your split (Cheating vs. Buying vs. Owning) is the critical lever here. Let's see how Meritocracy and Desert handle each.

  #### A. Cheating the Game (The Varsity Blues "Side Door")
  *   **Illegal fraud:** Fake athletic profiles, proxy test-takers.
  *   **Meritocracy:** **Condemns.** This is a false signal. It puts people in positions they cannot fulfill, degrading the institution's function.
  *   **Desert:** **Condemns.** It severs the link between effort and reward.
  *   **Verdict:** Both theories agree here. This is low-hanging fruit.

  #### B. Buying the Game (The Legal "Back Door")
  *   **Legal development cases:** Massive donations, expensive consultants, test prep.
  *   **Meritocracy:** **Ambivalent/Struggles.** If money buys test prep that actually raises SAT scores, a strict meritocrat might say, "Well, they have the higher score, they have the merit." Meritocracy struggles to distinguish between *innate ability* and *purchased polish*. If the outcome looks like merit, meritocracy often accepts it.
  *   **Desert:** **Condemns.** Desert cares about the *process*. If the high score was bought rather than earned through personal intellectual struggle, the moral claim is weaker. Desert explains why this feels "gross" even if it's legal: it decouples reward from personal agency.
  *   **Verdict:** **Desert does better here.** Meritocracy gets fooled by the credential; Desert sees the lack of earning.

  #### C. Owning the Game (The Structural "Front Door")
  *   **Rule Setting:** Legacy preferences, valuing rowing/fencing over basketball, unpaid internships as extracurriculars.
  *   **Meritocracy:** **Blind.** Meritocracy assumes the criteria for merit are neutral. It asks, "Who is best at tennis?" It does not ask, "Why do we value tennis more than coding?" If the wealthy define merit (e.g., "leadership" = expensive summer camps), meritocracy just sorts people according to that biased definition. It legitimizes the bias.
  *   **Desert:** **Partial Critique.** Desert highlights that not everyone had the *opportunity* to earn merit. If the race is rigged at the starting line, the winner doesn't "deserve" the win in a deep moral sense. However, Desert is still individualistic; it struggles to critique the *system* that sets the rules.
  *   **Verdict:** **Both struggle, but Meritocracy is complicit.** Meritocracy provides the cover story for "Owning." It tells the losers they just weren't good enough, masking that the game itself was designed for the winners.

  ### 3. Where the Lens Breaks

  This is the most important part for your argument. The Varsity Blues scandal reveals that neither Merit nor Desert fully captures the reality of elite admissions. Here is where the theories fracture:

  **1. The University as a Corporation, Not a Meritocracy**
  Meritocracy assumes the institution's goal is to *sort talent*. OVV revealed the institution's goal is often *resource extraction and brand perpetuation*.
  *   **The Break:** When a university accepts a legacy or a donor kid, they aren't failing at meritocracy; they are succeeding at *capitalism*. They are trading admission slots for capital (money) or social capital (alumni loyalty).
  *   **The Theory Failure:** Meritocracy treats this as a corruption of the system. In reality, it is a *feature* of the system. The "scandal" of Varsity Blues wasn't that rich kids got in; it was that they got in *without the university getting paid directly*. Rick Singer took the cut instead of the school. That's why the schools cooperated with the FBI so quickly—they were cut out of the deal.

  **2. Merit as a Commodity, Not a Quality**
  OVV showed that "merit" (SAT scores, athletic recruits) is not an intrinsic quality but a *credential* that can be separated from the person.
  *   **The Break:** If merit can be faked (proxy test takers) or bought (prep), then Meritocracy is not a system of sorting ability; it is a system of sorting *access to credentials*.
  *   **The Theory Failure:** Meritocracy relies on the honesty of the signal. Once the signal is commodified, the theory loses its descriptive power. It becomes a ritual, not a measurement.

  **3. The "Front Door" Hypocrisy (The Real Scandal)**
  The public outrage focused on the illegal "Side Door" (OVV). But the "Front Door" (Legacies) is vastly larger and legal.
  *   **The Break:** Why is cheating the rules a felony, but changing the rules to favor your own children (legacy) a tradition?
  *   **The Theory Failure:** This shows that **Desert** is subordinate to **Power**. We only care about "fairness" and "desert" when the wealthy break the *written* rules. When they use the *unwritten* rules (Owning the Game), we accept it. This suggests that neither Merit nor Desert drives the system; **Class Preservation** does. Merit and Desert are just the languages used to justify it after the fact.

  ### 4. Verdict: Does the Theory Hold?

  **Is it a clean win for Meritocracy talk?**
  No. In fact, it's a devastating critique. The scandal proves that "Meritocracy" is often a myth used to legitimize inequality. When the wealthy can fake merit (OVV) or define merit (Legacies), the system claims to be meritocratic while functioning as an aristocracy.

  **Does Desert do better?**
  Desert is better at explaining your *moral intuition* that Buying and Owning feel wrong. It captures the violation of the "effort = reward" contract. However, Desert is politically weak. Telling a legacy student "you don't deserve this" doesn't change the policy. Desert is a moral judgment, not a structural fix.

  **What does the case say about the theory?**
  It points to something the theory never anticipated: **The Marketization of Merit.**
  Theories of Merit and Desert assume a closed system where rules are fixed and honest. OVV shows an open market where rules are fluid and credentials are for sale.
  *   **The Insight:** The problem isn't that we failed to achieve meritocracy. The problem is that we are trying to use a meritocratic framework to judge an aristocratic system.
  *   **For your roommate:** Your three-way split is the winner here.
      *   **Cheating** violates the law.
      *   **Buying** violates Desert (fairness).
      *   **Owning** violates the premise of Meritocracy itself (neutral criteria).
      *   *Conclusion:* We prosecute Cheating because it's easy. We tolerate Buying because it's legal. We ignore Owning because it protects the people who make the laws.

  **Final Takeaway:** Operation Varsity Blues didn't break the meritocracy; it revealed that the "Front Door" (Legacies/Donations) is the *real* system, and the "Meritocratic" door is just a lobby for people who don't have enough money to use the Back Door. Merit and Desert are useful for analyzing individual actions, but they fail to capture the institutional incentive to sell out.
