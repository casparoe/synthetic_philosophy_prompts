          1.  *Cheating the Game:* Illegal fraud (fake recruits, proxy test-takers).
          2.  *Buying the Game:* Legal money influence (donations, expensive prep).
          3.  *Owning the Game:* Setting the rules (legacy preferences, rich-kid sports).
      *   **Key Questions:** Does meritocracy condemn all three or just the first? Does Desert explain why 2 & 3 feel "gross"? Where does the lens break? (Universities as sellers, coaches as gatekeepers). What does this say about the theory?
      *   **Tone:** Analytical, honest, philosophical but grounded in the specific case. No fluff.

  2.  **Deconstruct the Concepts:**
      *   **Merit (Forward-looking):** Utility, competence, fit. "Who will succeed here?" "Who adds value to the institution?"
      *   **Desert (Backward-looking):** Moral worth, effort, agency. "Who earned this?" "Who played by the rules?"

  3.  **Map Actors in OVV:**
      *   **The "Side Door" Kids (OVV participants):**
          *   *Merit:* Varied. Some were capable, but their admission wasn't based on it. Some were genuinely unqualified for the athletic slot.
          *   *Desert:* Low. They didn't earn the spot via effort/skill in the relevant domain (even if they didn't know, they benefited from unearned advantage).
      *   **The Parents:**
          *   *Merit:* N/A (they aren't the students).
          *   *Desert:* Negative. Active subversion of rules.
      *   **The Coaches:**
          *   *Merit:* Failed their institutional role (recruiting talent).
          *   *Desert:* Negative. Betrayed trust, took bribes.
      *   **The Legit Applicants (Bumped):**
          *   *Merit:* High (presumably).
          *   *Desert:* High (played by rules, put in effort).

  4.  **Analyze the User's Three-Way Split (Cheating vs. Buying vs. Owning):**
      *   *Cheating (Illegal):* Meritocracy clearly condemns this (false signal of merit). Desert clearly condemns this (unearned, rule-breaking).
      *   *Buying (Legal/Gray):* Development cases, test prep.
          *   *Meritocracy:* Ambivalent. If money buys prep that *actually* increases merit (higher SAT = better student), meritocracy might accept it. If it just buys access without increasing capability, meritocracy rejects it.
          *   *Desert:* Rejects it. It decouples reward from effort/agency. It's luck (wealth), not merit.
      *   *Owning (Structural):* Legacies, sports selection.
          *   *Meritocracy:* Often fails here. Meritocracy assumes the *criteria* are neutral. If the criteria are rigged (e.g., fencing vs. basketball), meritocracy struggles to critique the criteria themselves unless they fail the "forward-looking" test (e.g., do legacies actually contribute?).
          *   *Desert:* Stronger critique. It highlights the lack of fair opportunity to *generate* merit.

  5.  **Identify Where the Lens Breaks (The "Honest" Part):**
      *   **Universities as Brands/Sellers:** OVV revealed admissions isn't just about sorting talent; it's about resource extraction (donations) and brand maintenance (legacies/alumni relations). Meritocracy assumes the goal is *truth/talent sorting*. If the goal is *revenue*, then "merit" changes definition (a rich donor kid has "merit" as a revenue source).
      *   **The Definition of Merit:** Is merit intrinsic or credentialized? OVV showed credentials can be decoupled from capacity.
      *   **Systemic vs. Individual:** Both Merit and Desert focus heavily on individual worthiness. They struggle to address *structural* inequality (the "Owning" category).
      *   **The "Side Door" Nuance:** Varsity Blues was unique because it wasn't the "Front Door" (legacies) or the "Back Door" (pure donation). It was the "Side Door" (fraudulent merit). This distinction matters.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the strength of the case study. It's perfect because it involves fraud, money, and institutional complicity.
      *   *Section 1: Mapping Merit vs. Desert on Actors.* Use a table or clear bullet points. Distinguish between the kids who knew and didn't know (moral luck).
      *   *Section 2: The Three-Way Split.* Address Cheating, Buying, Owning.
          *   *Crucial Point:* Meritocracy *should* condemn all three if they decouple outcome from ability. But in practice, it often tolerates "Buying" and "Owning" if they serve institutional survival.
          *   *Desert's Role:* Desert is better at capturing the *unfairness* of Buying/Owning because it focuses on the *process* of earning, not just the *outcome* of ability.
      *   *Section 3: Where the Lens Breaks.*
          *   *Institutional Hypocrisy:* Universities claim meritocracy but practice aristocracy.
          *   *Merit as Currency:* Merit became a commodity to be faked.
          *   *The "Front Door" Problem:* OVV is scandalous because it bypassed the *legal* corruption (legacies). This suggests the real scandal isn't fraud, it's *inequality of fraud*.
      *   *Conclusion:* Does the theory hold? It exposes meritocracy as a myth used to justify hierarchy, not a functional sorting mechanism. Desert highlights the moral rot but offers no fix.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate Meritocracy (the system/ideology) with Merit (the quality).
      *   *Nuance:* Address the kids who didn't know. Does Desert apply to them? Backward-looking desert says no (they didn't choose), but forward-looking merit says they still might not belong.
      *   *The "Owning" point:* This is the strongest critique. If the wealthy define what "merit" is (e.g., unpaid internships, niche sports), meritocracy becomes a closed loop.
      *   *Tone Check:* Keep it conversational but rigorous. The user wants to test their argument with their roommate, so give them ammo.

  8.  **Final Polish:** Check against the prompt requirements.
