answer: |-
  Here is a precise formulation of a governing principle, an analysis of how it maps onto your cases, a prediction for the untested case, and an explicit accounting of where the principle fails to match your intuitions.

  ### The Principle of Reciprocal Moral Address

  **Statement:**
  A reactive attitude $A$ (e.g., resentment, indignation) held by agent $S$ toward target $T$ for action $\phi$ is **genuinely fitting** if and only if three conditions are jointly satisfied:

  1.  **Capacity for Moral Recognition:** $T$ possesses the cognitive and volitional capacity to grasp moral reasons and understand $\phi$ as a moral claim.
  2.  **Manifestation of Quality of Will:** $\phi$ expresses a stance of goodwill, ill will, or indifference toward the standing of $S$ (or those $S$ represents) that is attributable to $T$'s agency.
  3.  **Potential for Reciprocal Accountability:** $T$ stands in a relationship with $S$ such that $T$ could, in principle, recognize $A$ as a moral demand and modify future conduct in response to it.

  ---

  ### Mapping the Principle to Your Verdicts

  This principle attempts to unify your cases under a single normative framework centered on **communicative agency**.

  *   **Clause 1 (Capacity) is motivated by the *Colleague Plagiarism* case.**
      *   *Verdict:* Resentment is fitting.
      *   *Explanation:* The colleague is a moral agent who understands the norms of authorship. She satisfies the capacity condition, making her a proper target of address.
  *   **Clause 2 (Quality of Will) is motivated by the *Blackmailed Friend* case.**
      *   *Verdict:* Resentment dissolves; sympathy arises.
      *   *Explanation:* The friend's action does not manifest ill will or indifference toward you; it manifests coercion. The "quality of will" condition fails, rendering resentment unfitting, even though harm occurred.
  *   **Clause 1 & 3 (Capacity & Accountability) are motivated by the *Corporate Algorithm* case.**
      *   *Verdict:* Ambiguity regarding the target.
      *   *Explanation:* The principle forces a decision: Algorithms lack *Capacity* (Clause 1), so resentment toward the software is unfitting. Executives possess *Capacity*. The Corporation, if viewed as a functional agent capable of policy change (Accountability, Clause 3), can be a target. If the corporation is viewed as a mere shell, the attitude must fragment to the executives. The principle resolves your uncertainty by denying fittingness to the algorithm itself.

  ### Prediction: The Animal Case

  **Case:** Feeling indignation on behalf of an animal wronged by a human.
  **Verdict:** **Indignation is fitting; Resentment is not.**
  **Reasoning:**
  *   **Toward the Human:** The human satisfies all three clauses. They have capacity, their action manifests indifference to the animal's welfare (which you, as a moral agent, recognize as valuable), and they are accountable to you for violating moral norms. Therefore, *indignation* (third-party resentment) is fitting.
  *   **Toward the Animal:** The animal fails Clause 1 (Capacity for Moral Recognition). You cannot hold a reactive attitude *toward* the animal for being wronged, as it cannot understand the moral demand.
  *   **Nuance:** If you feel anger *at* the animal (e.g., a pet destroying property), the principle deems this **unfitting** as a *moral* reactive attitude. It may be a non-moral frustration, but it cannot be moral resentment because the animal cannot participate in reciprocal moral address.

  ---

  ### Explicit Failures: Where the Principle Cannot Accommodate Your Verdicts

  A unified principle gains precision by revealing where our intuitions outstrip its logic. Here are the specific verdicts from your list that the **Principle of Reciprocal Moral Address** cannot accommodate without modification.

  #### 1. The Past Self (Temporal Identity)
  *   **Your Verdict:** Sustained resentment toward your past self is fitting, despite that self being "absent and unresponsive."
  *   **Principle's Verdict:** **Unfitting.**
  *   **The Conflict:** Clause 3 requires *Potential for Reciprocal Accountability*. The past self no longer exists to receive the demand or modify conduct. The present self is the only entity capable of response, yet you direct the attitude backward.
  *   **Diagnosis:** Your intuition suggests that *ownership* of the act (temporal identity) overrides the requirement for *present responsiveness*. The principle treats self-reactive attitudes as strictly analogous to interpersonal ones; your verdict suggests they operate on a diachronic model of identity that the principle excludes. To accommodate this, Clause 3 would need to be amended to allow for *diachronic* accountability within a single life-narrative, but this strains the "interpersonal" core of Strawson's original framework.

  #### 2. The Adaptive Autonomous Vehicle (Quasi-Agency)
  *   **Your Verdict:** Resentment toward the learning system is fitting (structurally).
  *   **Principle's Verdict:** **Unfitting.**
  *   **The Conflict:** Clause 1 requires *Capacity for Moral Recognition*. An adaptive algorithm, no matter how complex, optimizes for parameters, not moral reasons. It cannot understand resentment as a *moral demand*, only as a negative reward signal.
  *   **Diagnosis:** Your feeling is likely a **heuristic projection**. You feel resentment because the system *mimics* agency well enough to trigger your reactive instincts, but the principle maintains that fittingness requires *actual* moral grasp, not functional mimicry. The principle classifies this as a category error (anthropomorphism), whereas your intuition grants it a form of functional fittingness.

  #### 3. The Democratic Vote (The Reversing Verdict)
  *   **Your Verdict:** Uncertain whether this is *interpersonal resentment* or a *different kind of moral response*.
  *   **Principle's Verdict:** **It is Interpersonal Resentment (if rights are deprived specifically); otherwise Indignation.**
  *   **The Conflict:** The principle draws a sharp line based on the *direction of the will*.
      *   If the citizens vote to deprive *you* of rights, they manifest ill will toward *your standing*. Clause 2 is met. They are capable of accountability (Clause 3). Therefore, it is the **same interpersonal resentment** as the colleague case.
      *   If they vote to deprive a *third-party minority*, you are an observer. The attitude is **Indignation**, not Resentment.
  *   **Why you reverse:** You likely sense a **diffusion of agency**. In the colleague case, the ill will is concentrated. In the voting case, the ill will is aggregated. The principle insists that aggregated individual wills still constitute individual moral agency. However, if you feel the "collective will" is distinct from the sum of individual wills (a strong collectivist view), the principle fails to capture the *structural* nature of your anger. If you feel the anger is different because the voters are following rules rather than acting on personal malice, that challenges Clause 2 (Quality of Will). The principle accommodates the verdict only if you accept that voting is a direct expression of individual quality of will.

  ---

  ### Conclusion: Unified Account or Family Resemblance?

  You asked whether you must abandon the idea of a unified account.

  **Recommendation: Retain the Unified Core, Acknowledge Peripheral Strain.**

  The **Principle of Reciprocal Moral Address** provides a robust unified core for standard interpersonal cases (Colleague, Friend, Standard Corporate). It successfully distinguishes between harm and quality of will, and between agents and objects.

  However, your verdicts on the **Past Self** and the **Adaptive AI** suggest that human psychology extends reactive attitudes beyond the strict bounds of *moral reciprocity*.
  *   In the **Past Self**, we extend accountability across time.
  *   In the **Adaptive AI**, we extend agency across ontology.

  If you insist these extensions are *genuinely fitting* (and not just psychological errors), then a single unified principle is insufficient. You would need a **Family-Resemblance Account**:
  1.  **Core Cases:** Governed by Reciprocal Moral Address (Human-to-Human).
  2.  **Extended Cases:** Governed by *Narrative Identity* (Self-to-Self) or *Functional Agency* (Human-to-System).

  **Final Verdict on the Democratic Case:**
  Under the Unified Principle, citizens voting to deprive a minority of rights are proper targets of **Indignation** (if you are not in the minority) or **Resentment** (if you are). It is the *same kind* of response as toward the colleague, merely scaled. The "different kind of moral response" you sense is likely **Political Blame**, which differs from interpersonal resentment in its *sanctions* (policy reversal vs. interpersonal repair) but not in its *moral logic* (response to ill will/indifference). If you feel it is fundamentally different, you are likely detecting the **diffusion of responsibility**, which the Unified Principle treats as an epistemic hurdle, not a metaphysical barrier.
