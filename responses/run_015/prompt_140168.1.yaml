prompt: |-
  hey — I'm taking a philosophy of science seminar this semester (Popper, Lakatos, a little Kuhn, and one whole session on whether Malthus was just early rather than wrong), and I also help run the campus forecasting club. We keep a public spreadsheet of about 200 long-range predictions that members have logged since 2016, horizons anywhere from three to thirty years. Twice a semester we have a triage night where ten or so of us go through the unresolved entries and decide, for each one: leave it on the board, extend it with a new deadline, or retire it as busted. Right now it is pure vibes and whoever made the prediction argues the loudest. I want an actual procedure we can run, and I want you to build it around a distinction my TA threw out that I can't stop thinking about (more on that below).

  What I need from you:

  A triage procedure with the questions in order, what counts as an adequate answer to each one, where it stops with a no, and where it hands the decision to a vote because it's really a question about how patient we want to be rather than a question of fact. It has to be runnable in about ten minutes per prediction by undergrads with one shared spreadsheet and no statistics beyond what a spreadsheet does natively. Decisions are public and they stick for a year, so there's some mild reputational sting, and people show up defensive about their own entries — tell me how to structure the run so that the person applying the procedure is not the person who logged the prediction, and what to do when we simply can't get a number for the key variable because there's no public data series.

  The part I actually care about is what makes an extension legitimate (right but early) versus just moving the goalposts. Here is the idea I want built in: a rescue can have its own expiry date. If the only reason a prediction hasn't come true is an offsetting mechanism that is itself temporary or exhaustible — industrial nitrogen fixation and cheap fossil energy masking a Malthusian land constraint, say, or a one-shot demographic dividend propping up a growth forecast — then the extension should not be open-ended; it should be bounded by the remaining life of the rescue, and the club should have to say what would tell us the rescue is running out. That's very different from a delay that the theory's own mechanism explains, where the mechanism is real but just running slower than anyone guessed, and extending is cheap. Give me the tests that separate those two, plus a rule for setting the new deadline in the first kind of case, and a rule for the intake end too: when someone logs a new prediction, the deadline should be derived from the timescale of the mechanism they're invoking, not picked because it sounds far enough away.

  Then run it on three of our real entries.

  1. Malthus 2.0, logged 2017: global per-capita calorie production peaks before 2040, and at least one famine with over a million deaths before 2035, on the mechanism that arable land is fixed, yield gains are roughly linear, and demand compounds. Some indicators are drifting their way (yield growth flattening in a few regions) and some are not. It hasn't failed yet on its own terms.

  2. Peak Attention, logged 2015: average daily minutes on social platforms for US adults would peak by 2021 and fall at least 20% by 2025, because attention is a fixed budget and platforms hit a satiation ceiling. It has gone the other way, and every year somebody rescues it by changing what counts as a platform. I think this should be retired and I want to see whether the procedure agrees or tells me I'm being impatient.

  3. The one we'll all hate: our all-time most upvoted entry, from 2021, something like algorithmic feeds will destroy shared reality in the US by 2030. Everybody loves it, it gets re-upvoted every semester, and nobody can say what would count as it happening. If the procedure says operationalize it in 30 days or retire it, tell me that straight, and tell me what a fair operationalization would even look like here.

  Finally, be honest about which steps of the procedure are judgment calls in a lab coat, what will predictably go wrong the first night we run it, and what this kind of procedure just can't do — I assume there's some part of the right but early question that no checklist settles. We've got two triage nights left this semester and I'd rather bring something imperfect than another vibes session.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**

      *   **Context:** Philosophy of science seminar (Popper, Lakatos, Kuhn, Malthus). Campus forecasting club with 200+ long-range predictions (3-30 year horizons) logged since 2016.
      *   **Current Problem:** Triage nights are "pure vibes," dominated by the loudest predictor. Decisions (Keep, Extend, Retire) lack structure.
      *   **Goal:** A runnable triage procedure (approx. 10 mins/prediction) for undergrads using only a shared spreadsheet (no advanced stats).
      *   **Key Philosophical Constraint:** Distinguish between "Right but Early" (legitimate extension based on temporary offsetting mechanisms) vs. "Moving Goalposts" (illegitimate rescue).
      *   **Specific Mechanism:** Extensions must have an expiry date bounded by the life of the "rescue" mechanism. New predictions must have deadlines derived from the mechanism's timescale.
      *   **Tasks:**
          1.  Design the procedure (questions, pass/fail criteria, voting triggers).
          2.  Address conflict of interest (predictor vs. evaluator).
          3.  Address missing data.
          4.  Apply the procedure to three specific cases (Malthus 2.0, Peak Attention, Shared Reality).
          5.  Provide a meta-analysis (limitations, judgment calls, predicted failure modes).

  2.  **Deconstruct the Philosophical Core (Lakatos/Popper/Kuhn):**

      *   *Popper:* Falsifiability. If it can't be proven wrong, it's not science.
      *   *Lakatos:* Research Programmes. A "hard core" of theory protected by a "protective belt" of auxiliary hypotheses. Degenerating vs. Progressing programmes.
      *   *The User's Insight:* A "rescue" (auxiliary hypothesis) is legitimate only if it introduces *novel facts* or has a *bounded lifespan*. If the rescue is ad hoc (e.g., "define platform differently"), it's degenerating.
      *   *Malthus Angle:* Malthus wasn't necessarily wrong about the *mechanism* (land constraint), but wrong about the *timing* because of an external shock (Haber-Bosch/fossil fuels). That shock is exhaustible.

  3.  **Drafting the Procedure (The "Triage Protocol"):**

      *   *Role Assignment:* Need a "Rapporteur" (runs the sheet) and a "Challenger" (assigned to critique, *not* the predictor). The Predictor is a witness, not a judge.
      *   *Step 1: Falsifiability Check (The Popper Gate).* Can we measure this? If no -> Operationalize or Retire.
      *   *Step 2: Status Check.* Has the deadline passed? Is the condition met?
      *   *Step 3: The "Rescue" Audit (The Lakatos Gate).* This is the core. Why hasn't it happened?
          *   Option A: Mechanism is slow (Right but Early).
          *   Option B: Offsetting force exists (The Malthus Exception).
          *   Option C: Redefinition (Moving Goalposts).
      *   *Step 4: Setting the New Horizon.* If extending, how long? Based on the mechanism's half-life or the rescue's exhaustion point.
      *   *Step 5: The Vote.* Where does judgment take over? (Patience vs. Principle).

  4.  **Refining the "Rescue" Logic:**

      *   *Legitimate Rescue:* Identifies a specific, measurable counter-force (e.g., fertilizer) that is known to be temporary or saturating. *Rule:* New deadline = When counter-force saturates/fails.
      *   *Illegitimate Rescue:* Redefines terms (e.g., "social media" now includes email) or claims "it's just slower" without evidence of the mechanism still loading.
      *   *Data Issue:* If no public data, the predictor must propose a proxy. If no proxy, retire.

  5.  **Applying to the Three Cases:**

      *   *Case 1: Malthus 2.0 (2017).*
          *   Mechanism: Land fixed, yield linear, demand compound.
          *   Status: Not peaked yet.
          *   Rescue: Tech (GMOs, vertical farming)? Or just slow demand?
          *   Verdict: *Extend with conditions.* The "rescue" is tech yield gains. We need to track yield growth rates. If yield growth stays > demand growth, retire. If yield growth flattens, keep. Deadline should be tied to projected land saturation, not arbitrary.
      *   *Case 2: Peak Attention (2015).*
          *   Mechanism: Fixed budget, satiation.
          *   Status: Failed (went up, not down).
          *   Rescue: Redefining "platform."
          *   Verdict: *Retire.* This is a degenerating protective belt. The mechanism (fixed budget) is contradicted by data (budget expanded or definition shifted).
      *   *Case 3: Shared Reality (2021).*
          *   Mechanism: Algorithmic feeds -> polarization.
          *   Status: Vague ("destroy shared reality").
          *   Verdict: *Operationalize or Retire.* "Destroy" is not measurable. Needs a metric (e.g., overlap in news consumption, trust indices). Give 30 days to define metrics, otherwise retire.

  6.  **Addressing the Meta-Constraints:**

      *   *Time:* 10 mins/prediction. Keep questions binary where possible.
      *   *Spreadsheet:* Use dropdowns, conditional formatting.
      *   *Conflict:* Assign "Challenger" role randomly or rotate. Predictor speaks only when asked.
      *   *Honesty:* Acknowledge that "mechanism timescales" are often guesses. Acknowledge that social science mechanisms are fuzzier than physics.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the philosophical weight (Lakatosian Research Programme).
      *   **The Protocol:** Step-by-step instructions.
      *   **The "Rescue" Test:** Detailed criteria for legitimate vs. illegitimate extensions.
      *   **Case Studies:** Applying the protocol to the three examples.
      *   **Meta-Analysis:** Limitations, failure modes, and the "inevitable vibes" remainder.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is 10 minutes realistic for complex predictions?
      *   *Fix:* Emphasize that complex ones might get tabled for "Deep Dive," but the triage is for the bulk. Actually, the prompt says "runnable in about ten minutes." I need to ensure the questions are sharp enough to force a decision quickly.
      *   *Critique:* How to handle the "Mechanism Timescale" for new entries?
      *   *Fix:* Add an "Intake Checklist" section.
      *   *Critique:* The user mentioned "Malthus was just early rather than wrong."
      *   *Fix:* Ensure the "Legitimate Rescue" section explicitly references the "Exhaustible Offset" concept (e.g., fossil energy masking land constraint).
      *   *Tone:* Academic but practical. "Undergrads with a spreadsheet." No jargon without explanation.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Procedure with questions in order? Yes.
      *   Adequate answers/Stop points? Yes.
      *   Vote triggers? Yes.
      *   Predictor vs. Evaluator structure? Yes.
      *   Missing data handling? Yes.
      *   Distinction: Right/Early vs. Goalposts? Yes.
      *   Rule for new deadlines (rescue expiry)? Yes.
      *   Rule for intake (mechanism timescale)? Yes.
      *   Run on 3 entries? Yes.
      *   Honest limitations? Yes.

  10. (Final thought on the "Shared Reality" case): This is the hardest one. "Destroy shared reality" is essentially a Kuhnian paradigm shift description, not a prediction. It needs to be hammered into a Lakatosian empirical claim. I will suggest specific metrics like "decline in cross-partisan trust" or "divergence in factual belief indices."

  11. (Final thought on "Malthus"): The prompt says "Malthus 2.0... logged 2017." The mechanism is arable land fixed. The rescue is usually tech. The procedure needs to ask: Is the tech rescue exhaustible? (e.g., phosphorus limits).

  12. (Final thought on "Peak Attention"): The rescue was "changing what counts as a platform." This is a classic ad hoc hypothesis. The procedure must flag this as "Degenerating."

