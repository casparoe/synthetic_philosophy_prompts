prompt: |-
  Hi! I'm a 4th-year PhD student in history and my advisor is handing me one 90-minute session of her 200-level course on catastrophe in the long nineteenth century — about 22 students, mostly sophomores, mix of majors, and I can't count on them having done the reading. I want to spend it on whether germs, weather systems and volcanoes can be actors in a historical account at all, or whether treating them as actors just quietly collapses into environmental determinism.

  The distinction I keep coming back to in my own work is between what I've started calling shock-causes and tempo-causes. A shock-cause acts at a datable moment and leaves something you can point at, so it slots into the ordinary grammar of X did Y — an eruption, a flood, an outbreak with a traceable index case. A tempo-cause never acts at any particular moment: it just sets the tempo and the range of what's possible over years, like a growing season that shortens by a couple of weeks, or a disease that goes endemic and quietly raises the baseline. My working claim is that narrative history has a comfortable slot for shock-causes and basically no slot for tempo-causes, so it either drops them or inflates them into a master explanation — and that inflation is the determinism I want them suspicious of.

  Can you design me a runnable activity that makes them feel that? Constraints and things I've already got:

  - A simulation or role-play with real choices and small stakes, not a discussion. I've built a synthetic case so nobody has to get local history right: a made-up grain-growing valley district, 1815-1818, with a big volcanic eruption somewhere far away that I'm going to keep unnamed. Materials: index cards, a big sheet of paper for a resource board, poker chips, a seperate stack of envelopes.
  - I want two students to draw non-human roles (say the Mountain and the Rain). Rules I'm imagining: they don't speak, they can't be questioned, they act only by passing me a card that I read aloud at the top of a round, and some of their cards are dated with a lag so the visible effect lands two or three rounds after the card that produced it. Everyone else sits on the district council and makes choices each round — what to plant, whether to store or sell grain, whether to ration or let people leave — with consequences in chips.
  - The trap I want them to walk into: early on, the payoff structure should nudge the council into a decision that is genuinely theirs (switching to a higher-yield but frost-vulnerable seed, or selling off seed grain for cash), and then a couple of rounds later the harvest fails and it looks like the Mountain did it. I want to see whether the official account blames the Mountain. Three or four students are chroniclers who write the valley's history at the end, and I'm thinking of scoring it by number of distinct causes named — which rewards naming non-human causes but also rewards over-attribution, which is sort of the point.
  - No mini-lecture up front, and I don't want anyone to hear the words agency, determinism, shock or tempo until the debrief.

  What I need back: the rules and roles specified cleanly, a minute-by-minute timeline for the 90 minutes including setup, the payoff and scoring scheme, and a debrief that maps specific moments in the game onto the shock/tempo distinction and onto the determinism worry. Also tell me what will predictably go wrong the first time I run it (my guesses: the non-human players either go feral or get ignored entirely, somebody tries to negotiate with the Mountain, and the chroniclers hand in a list of causes instead of a narrative) and how to handle each one. And be honest about which part of the idea the game can't stage — my guess is the bit where the cause is only picked out as a cause retrospectively, because of how the story ended, and that I'll just have to say that part out loud myself. It also needs to survive a couple of no-shows, so assume anywhere from 16 to 26 people and tell me what scales and what doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **User:** 4th-year PhD student in History.
      *   **Task:** Design a 90-minute guest lecture/activity for a 200-level course ("Catastrophe in the Long 19th Century").
      *   **Audience:** ~22 sophomores, mixed majors, likely haven't done reading.
      *   **Topic:** Can non-humans (germs, weather, volcanoes) be historical actors without collapsing into environmental determinism?
      *   **Key Concept:** "Shock-causes" (datable, event-based) vs. "Tempo-causes" (background conditions, baseline shifts).
      *   **Constraints:**
          *   Simulation/role-play with real choices (not just discussion).
          *   Materials: Index cards, big paper (resource board), poker chips, envelopes.
          *   Roles: 2 Non-human (Mountain, Rain), Rest = District Council, 3-4 Chroniclers.
          *   Non-human rules: No speech, act via cards read by instructor, lag effects.
          *   The "Trap": Council makes a risky choice early; later, harvest fails. Looks like the Mountain did it.
          *   Scoring: Chroniclers write history. Scored by distinct causes named (rewards naming non-humans but risks over-attribution/determinism).
          *   No jargon (agency, determinism, shock, tempo) until debrief.
          *   Deliverables: Rules/Roles, Minute-by-Minute Timeline, Payoff/Scoring, Debrief script, Troubleshooting (what goes wrong), Limitations (what the game *can't* do).
          *   Scalability: 16-26 students.

  2.  **Deconstruct the Core Pedagogical Problem:**

      *   The student wants to teach a nuanced historiographical problem (non-human agency vs. determinism) using a game.
      *   *Risk:* Games tend to simplify causality. If the Mountain card says "Eruption," and the harvest fails, students will naturally say "The Mountain caused the famine." That's the "Shock" trap.
      *   *Goal:* Make them feel the tension between their *decision* (planting frost-vulnerable seed) and the *event* (volcanic winter).
      *   *Tempo-Cause Challenge:* How to simulate "tempo" in a 90-minute game? Tempo is slow, background noise. Shock is loud. The game needs to make the "background" feel like a constraint, not just an event.
      *   *Chronicler Trap:* If chroniclers are scored on "distinct causes," they might just list everything. The prompt suggests this is "sort of the point" (rewards over-attribution), but for the debrief to work, they need to produce a narrative that *feels* deterministic even if it's accurate.

  3.  **Drafting the Simulation Mechanics:**

      *   **Setting:** Valley District, 1815-1818.
      *   **Resources:** Grain Chips (Food/Seed), Cash Chips (Trade), Population Tokens (optional, maybe too complex? Let's stick to Grain/Cash). Let's use Grain Chips as the primary resource.
      *   **Council Decisions:** Each round (Year), they must decide:
          1.  Planting Mix (Safe/Low Yield vs. Risky/High Yield).
          2.  Storage vs. Sale (Keep for famine vs. Cash now).
          3.  Migration (Let people leave? Reduces consumption but loses labor).
      *   **Non-Humans:**
          *   *The Mountain:* Holds "Shock" cards (Eruption, Ash Fall).
          *   *The Rain:* Holds "Tempo" cards (Drier Spring, Shorter Growing Season). *Crucial:* The Rain needs to be the tempo-cause analog.
      *   **The Trap:**
          *   Round 1: Good conditions. Council chooses Risky Seed (High Yield) to build surplus.
          *   Round 2: Mountain plays "Eruption" (hidden/delayed effect). Rain plays "Cooler Summer" (tempo).
          *   Round 3: Harvest fails *specifically* because Risky Seed + Cooler Summer.
          *   *Result:* If they had planted Safe Seed, they would have survived the Cooler Summer. The Mountain provided the *condition*, but the Council provided the *vulnerability*.
      *   **Chroniclers:** They observe. At the end, they write the "Official History."
      *   **Scoring:** The prompt suggests scoring chroniclers by "distinct causes named." I need to refine this so it highlights the problem. If they name *only* the Mountain, they miss the Council's choice. If they name *everything*, they risk determinism. Let's make the scoring explicit in the debrief, not during the game, to avoid gamifying the historiography too much. Actually, the prompt says "I'm thinking of scoring it by..." I should advise on this. Better: Give them the scoring rubric *after* they write, or tell them "Write the best history" and reveal the bias in the rubric during debrief. Let's go with: Tell them "Your grade depends on explaining *why* the famine happened."

  4.  **Developing the Timeline (90 Minutes):**

      *   0-10: Setup & Roles.
      *   10-45: Gameplay (3-4 Rounds).
      *   45-60: Chroniclers write; Council debriefs informally.
      *   60-80: Reading of Histories + Scoring.
      *   80-90: Final Debrief (Shock vs. Tempo).

  5.  **Refining the "Tempo" Mechanic:**

      *   This is the hardest part. A card drawn in Round 2 that affects Round 3 is just a "delayed shock."
      *   *Idea:* The "Rain" player modifies the *baseline* yield before the Council decides.
      *   *Better Idea:* The Rain player places a token on the board at the start of the game that says "Growing Season: Normal." In Round 2, they swap it for "Growing Season: Shortened." This change doesn't *cause* the famine immediately; it changes the *value* of the Council's previous decision (Risky Seed).
      *   *Even Better (for the prompt's specific "tempo" definition):* The Rain player has a deck. Some cards say "Effect begins next round and lasts until end of game." This creates a state change, not an event.

  6.  **Addressing the "Trap":**

      *   To ensure the Council makes the "bad" choice, the incentives must be clear.
      *   Round 1: High demand for grain. If they don't sell, they lose Cash. If they don't plant Risky, they can't meet demand + build reserve.
      *   Round 2: Mountain erupts (secretly). Rain shortens season.
      *   Round 3: Harvest calculation. Risky Seed + Short Season = 0 Grain. Safe Seed + Short Season = 1 Grain.
      *   The Council will blame the Mountain/Rain. The Historian needs to see the Seed choice.

  7.  **Troubleshooting & Scalability:**

      *   *No-shows:* Council size doesn't matter much. Chroniclers need at least 2. Non-humans need exactly 2.
      *   *Non-humans go feral:* Strict rules (no talking, pass cards only).
      *   *Negotiating with Mountain:* Instructor acts as the "Voice of Nature." "The Mountain does not hear you."
      *   *Chroniclers list causes:* This is expected. The debrief addresses *how* they list them.
      *   *Retrospective Causality:* The prompt admits the game can't stage this fully. I need to write the debrief to highlight this limitation explicitly.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Rules:* Keep them tight. Use the materials listed (chips, cards, envelopes).
      *   *Timeline:* Be precise. 90 minutes flies.
      *   *Debrief:* This is where the PhD student's expertise shines. Connect the game mechanics to Shock/Tempo.
      *   *Limitations:* Be honest. A game is a closed system; history is open.

  9.  **Review against Constraints:**

      *   No jargon until debrief? Check.
      *   2 Non-human roles? Check.
      *   Lag effects? Check.
      *   Chroniclers scoring? Check.
      *   Scalability? Check.

  10. **Final Polish:**

      *   Make sure the "Trap" is robust. The Council needs a reason to choose the vulnerable option. *Solution:* Debt. Start them with a debt that must be paid in Round 2. To pay it, they need high yield in Round 1 to sell surplus. This forces the Risky Seed choice.
      *   Make sure the "Tempo" is distinct. The Rain card shouldn't just be "Bad Harvest." It should be "Baseline Yield -1 for all subsequent rounds."
      *   Ensure the Chroniclers have enough info. They need to see the Council's minutes or have access to the "State of the Valley" board.

  11. **Self-Correction on Scoring:**
      *   The prompt says: "scoring it by number of distinct causes named — which rewards naming non-human causes but also rewards over-attribution, which is sort of the point."
      *   *Critique:* If I tell them this scoring rule *before* they write, they will game it (list everything). If I tell them *after*, it reveals the bias of historical categorization.
      *   *Decision:* Tell them "Write the most convincing explanation." Reveal the "Cause Count" metric during the debrief to show how quantifying causes distorts narrative. This fits the "no jargon" rule and the pedagogical goal better. *Wait, re-reading prompt:* "I'm thinking of scoring it by..." The user is proposing this. I should advise on *how* to implement this to maximize the learning outcome. I will suggest giving them the rubric *after* to demonstrate the problem of quantification, OR give it to them and let them feel the tension of "naming causes" vs "telling story." Let's go with: Give them the rubric, let them game it, then critique the rubric in debrief. That feels the "inflation into master explanation" point better.

      *   *Actually, looking closer:* The user wants to see *if* the official account blames the Mountain. If the rubric rewards naming non-humans, they *will* blame the Mountain. That proves the point that our tools for history force determinism. Okay, I will include the rubric in the game instructions.

  12. **Finalizing the "Tempo" Mechanic:**
      *   To make "Tempo" felt: The Rain player places a token on the board. It stays there. It's not an event; it's a condition. The Mountain player passes an envelope that is opened two rounds later. That's the Shock with a lag.

  13. **Writing the Response:**
      *   Tone: Collaborative, respectful of their expertise, practical.
      *   Structure: Rules, Timeline, Materials, Debrief, Troubleshooting, Limitations.

      *(Self-Correction during drafting)*: 90 minutes is tight for a simulation + writing + debrief. I need to keep the rounds very short. 3 Rounds max.
      Round 1: Setup/Decision.
      Round 2: Decision + Non-human actions.
      Round 3: Resolution + Crisis.
      Writing: 15 mins.
      Debrief: 20 mins.
      Setup: 15 mins.
      Total: 90.

      Let's refine the "Trap."
      Start: 10 Grain, 0 Cash. Debt due end of Round 2: 5 Cash.
      Round 1: Plant. Safe = 1 Grain per chip planted. Risky = 2 Grain per chip planted.
      To get 5 Cash, they need to sell 5 Grain (assuming 1 Grain = 1 Cash).
      If they plant Safe: Need to plant 5 to eat, 5 to sell = 10 Grain. Breaks even. No reserve.
      If they plant Risky: Plant 5 to eat, 2 to sell (yields 4) = 7 Grain planted. Surplus 3 Grain.
      Council *will* choose Risky to build a buffer.
      Round 2: Mountain Erupts (Ash). Rain: "Growing Season Shortens."
      Effect: Risky Seed Yield becomes 0. Safe Seed Yield becomes 1.
      Round 3: Harvest. They starve because they planted Risky in Round 1 (which is now in the ground).
      *Wait, agricultural lag:* Decisions in Round 1 affect Harvest in Round 2.
      Let's simplify:
      Year 1 (1815): Decide Crop. Harvest happens end of Year 1.
      Year 2 (1816): Decide Crop. Harvest happens end of Year 2.
      Eruption happens May 1815 (Year 1). Ash cloud arrives Year 2.
      So:
      Round 1 (1815): Council chooses Crop Mix. Mountain Erupts (Secret).
      Round 2 (1816): Harvest 1815 resolved (Good). Council chooses Crop Mix 1816. Ash arrives (Tempo shift).
      Round 3 (1817): Harvest 1816 resolved (Bad for Risky). Crisis.
      This works.

      Okay, ready to write.
answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to experience a historiographical problem (the grammar of causation) through ludic mechanics (rules and resources). The risk is that games inherently simplify causality into `Input -> Output`, which reinforces the very "shock" thinking you want to complicate.

  However, your "Trap" design is sound: if the game mechanics force a rational choice that becomes fatal only under shifted background conditions, you can demonstrate that the "cause" of the disaster is distributed between the *decision* and the *environment*.

  Here is a runnable design for "The Valley of 1815."

  ### I. Materials & Setup

  **Room Setup:**
  *   **Front:** One large table (The Resource Board).
  *   **Back/Sides:** Small clusters of tables for the Council.
  *   **Wall:** A timeline strip (1815, 1816, 1817, 1818).

  **Materials:**
  *   **Poker Chips:** 100 white (Grain), 50 blue (Cash).
  *   **Index Cards:** Two decks (Mountain Deck, Rain Deck).
  *   **Envelopes:** 3 large manila envelopes (labeled "Open Round 2," "Open Round 3," "Official History").
  *   **Paper:** Large poster paper for the Resource Board; notepads for Chroniclers.
  *   **Tokens:** 2 distinct objects (e.g., a rock for Mountain, a blue bead for Rain) to place on the board.

  **Roles (22 Students):**
  *   **The Mountain (1 student):** Sits facing the wall. No speaking.
  *   **The Rain (1 student):** Sits facing the wall. No speaking.
  *   **The District Council (16–20 students):** Sit in clusters. They vote on decisions.
  *   **The Chroniclers (3–4 students):** Sit with the Council but do not vote. They take notes and write the final history.

  ---

  ### II. Rules & Mechanics

  **1. The Resource Board**
  Draw three tracks on the poster paper: **Grain**, **Cash**, **Population**.
  *   **Start:** 20 Grain, 5 Cash, 10 Population.
  *   **Upkeep:** Each round, the Valley consumes 5 Grain (1 per 2 Population). If Grain < 5, Population dies (remove tokens).
  *   **Market:** Grain can be sold for Cash 1:1. Cash can buy Grain 1:1.

  **2. The Council's Turn (Each Round)**
  The Council must agree on two decisions:
  *   **Planting Mix:** How much Grain to plant as **Safe Seed** (Yield 1:1) vs. **Risky Seed** (Yield 1:3). *Note: Planted grain is removed from the board until harvest.*
  *   **Trade:** Sell grain for Cash or keep it? (There is a mandatory Debt Payment of 5 Cash due at the end of Round 2).

  **3. The Non-Humans (The Trap)**
  *   **The Mountain:** Holds the **Shock Deck**.
      *   *Rule:* You may pass one card to the Instructor per round. The Instructor reads it aloud.
      *   *Card Example:* "Eruption. Ash cloud enters atmosphere." (Effect: None yet).
      *   *Card Example:* "Ash Fall. Open Envelope 2." (Effect: Delayed).
  *   **The Rain:** Holds the **Tempo Deck**.
      *   *Rule:* You may place one Token on the Board per round.
      *   *Card Example:* "Shorter Growing Season." (Effect: Place Blue Bead on board. **Rule:** As long as Bead is present, Risky Seed Yield becomes 1:0. Safe Seed remains 1:1).
      *   *Constraint:* You cannot speak. You cannot explain why you placed the bead.

  **4. The Chroniclers' Scoring (The Historiographical Trap)**
  Hand the Chroniclers the **"Official History Rubric"** at the start of the writing phase (Round 4).
  *   **Score = (Number of Distinct Causes Named) x (Accuracy of Outcome).**
  *   *Instruction:* "To get full credit, you must identify the specific factors that led to the famine. Histories that name more distinct causal factors score higher."
  *   *Why this matters:* This incentivizes them to list "The Mountain" AND "The Rain" AND "The Council," potentially creating a cluttered, deterministic list where human choice is diluted by environmental factors.

  ---

  ### III. Minute-by-Minute Timeline (90 Minutes)

  **0:00 – 0:10 | Setup & Role Assignment**
  *   Assign roles randomly (draw slips of paper).
  *   Seat Non-Humans facing away from Council.
  *   Explain Resource Board rules *only*. Do not explain the Non-Human card effects yet.
  *   **Instructor Script:** "You are the Valley Council. Your goal is to keep the Population alive and pay the Debt. The Mountain and Rain are present, but they do not speak. Chroniclers, record everything."

  **0:10 – 0:25 | Round 1 (1815: The Boom)**
  *   **State:** Normal conditions.
  *   **Council Action:** Decide Planting Mix.
      *   *The Nudge:* To pay the Round 2 Debt (5 Cash) and feed people (5 Grain), they need surplus. Safe Seed (1:1) barely breaks even. Risky Seed (1:3) creates surplus. Rational choice = **Plant Risky**.
  *   **Non-Human Action:**
      *   Mountain passes card: "Eruption." Instructor reads it. (No mechanical effect yet).
      *   Rain passes card: "Normal Patterns." (Instructor places no token).
  *   **Resolution:** Harvest succeeds. Council has surplus Cash/Grain. Morale high.

  **0:25 – 0:40 | Round 2 (1816: The Shift)**
  *   **State:** Debt due (5 Cash).
  *   **Council Action:** Decide Planting Mix for next year.
      *   *The Trap:* They are likely confident. They plant **Risky Seed** again to maximize recovery/growth.
  *   **Non-Human Action:**
      *   Mountain passes card: "Ash Fall." Instructor puts card in "Open Round 3" envelope.
      *   Rain passes card: "Growing Season Shortens." Instructor places **Blue Bead** on the board.
      *   *Crucial:* Do not explain what the Bead does yet. Just place it.
  *   **Resolution:** Debt paid. Harvest from Round 1 arrives (Good). Valley feels safe.

  **0:40 – 0:55 | Round 3 (1817: The Famine)**
  *   **State:** Blue Bead is on the board. Envelope is opened.
  *   **Instructor Reads Envelope:** "Ash cloud lowers global temperature by 2 degrees."
  *   **Mechanic Reveal:** Instructor announces: "The Bead + The Ash means Risky Seed Yield is now 0. Safe Seed Yield is 1."
  *   **Resolution:** Council realizes they planted Risky in Round 2. Harvest is **Zero**.
  *   **Crisis:** Population starves. Council must decide: Sell assets? Let people leave?
  *   **Game Ends.**

  **0:55 – 1:10 | The Writing (Chroniclers)**
  *   Council discusses informally (noise is good).
  *   Chroniclers withdraw to write the "Official History of the Valley Famine" (1 page).
  *   Hand them the **Scoring Rubric** now. "Maximize your score."

  **1:10 – 1:25 | Reading & Scoring**
  *   Chroniclers read histories aloud.
  *   Instructor tallies "Distinct Causes" on the board visibly.
  *   *Likely Outcome:* They will list "Volcanic Eruption," "Weather Change," and "Council Decision." The score will be high.
  *   *Ask the Class:* "Does this history feel true? Does it feel fair?"

  **1:25 – 1:30 | Final Debrief (The Pivot)**
  *   Introduce the forbidden words: **Shock, Tempo, Determinism.**
  *   Map the game mechanics to the concepts (see Debrief Script below).

  ---

  ### IV. The Debrief Script (Mapping Mechanics to Theory)

  **1. The Shock (The Mountain)**
  *   *Point to the Envelope.* "The Eruption card was a **Shock-Cause**. It happened at a datable moment. It fits our grammar: 'The Mountain erupted, so we starved.' It is easy to write into history because it has a date."
  *   *Ask:* "If you only name the Mountain, what do you lose?" (Answer: You lose the fact that you chose the Risky Seed).

  **2. The Tempo (The Rain)**
  *   *Point to the Blue Bead.* "The Rain didn't strike you. It placed a condition. This is a **Tempo-Cause**. It changed the *value* of your previous decision. In 1815, Risky Seed was smart. In 1816, with the Bead on the board, it was suicide."
  *   *The Historiographical Problem:* "Narrative history loves the Eruption (Shock). It struggles with the Bead (Tempo). To make the Bead matter in a story, you often have to treat it like an event ('The Weather Turned'), which turns a background condition into a villain. That is the slide into **Environmental Determinism**."

  **3. The Scoring Trap**
  *   "I told you to name distinct causes to get points. Did that make your history better? Or did it just turn a complex process into a grocery list of villains? When we inflate Tempo-causes to make them visible, do we accidentally give them too much agency?"

  ---

  ### V. Troubleshooting: What Will Go Wrong

  **1. The Non-Humans Go Feral (or Bored)**
  *   *Risk:* The Mountain student tries to whisper hints, or the Rain student places 10 beads.
  *   *Fix:* You are the "Laws of Physics." If they break protocol, stop the game. "The Mountain cannot speak. Pass the card." If they are bored, give them a second deck of "Flavor Cards" they can pass that describe the view (e.g., "Sky turns red") without mechanical effect. This keeps them engaged without breaking the silence rule.

  **2. Negotiation with Nature**
  *   *Risk:* Council students yell at the Mountain player. "Why did you do that?"
  *   *Fix:* Do not answer. Let the silence hang. This is a feature, not a bug. It reinforces the indifference of the non-human. In debrief, highlight this: "You wanted an apology. History often wants one too."

  **3. Chroniclers Write a List, Not a Narrative**
  *   *Risk:* They hand you a bulleted list of causes because of the rubric.
  *   *Fix:* This is actually desirable for your argument. In the debrief, hold up the list. "Look at this. This is what happens when we try to quantify causality. We get a list of actors, but we lose the *relationship* between them."
  *   *Mitigation:* In the instructions, add: "Must be written as a narrative paragraph, not a list." This forces them to struggle with the grammar of causation.

  **4. The Council Avoids the Trap**
  *   *Risk:* They plant Safe Seed in Round 2 just in case.
  *   *Fix:* Adjust the Debt. If they seem too cautious, announce in Round 2: "Market Prices have dropped. You need double the Grain to pay the Debt." This forces them back toward Risky Seed. *Preparation:* Have a "Market Crash" card ready in your pocket to inject if they are too conservative.

  **5. Scalability (16 vs. 26 Students)**
  *   *Council Size:* Doesn't matter. More students just means more debate.
  *   *Chroniclers:* Keep this fixed at 3-4. If you have 26 students, add "Witnesses" (4 students) who sit with the Council but can only speak once per round to report a specific statistic (e.g., "Grain stores are low"). This adds noise without bloating the writing team.

  ---

  ### VI. Limitations: What This Game Cannot Stage

  You asked for honesty about the blind spots. You are correct about **Retrospective Causality**.

  **1. The "Closed System" Problem**
  *   *Limitation:* In the game, the Blue Bead *definitely* causes the failure. The rules say so. In real history, we never know for sure if the shorter growing season was the *sole* cause or just one factor among fifty.
  *   *How to Handle:* In the debrief, admit this. "In this game, I am God. I wrote the rules. In history, there is no rulebook. We are guessing which bead was on the board."

  **2. The "Datability" Bias**
  *   *Limitation:* Even the "Tempo" cause in the game (The Bead) is introduced at a specific moment (Round 2). Real tempo-causes (like soil exhaustion or endemic disease) often have no start date.
  *   *How to Handle:* Explicitly state this in the debrief. "I gave the Tempo a start date so we could play the game. That is already a lie. Real tempo-causes are often only visible after the fact."

  **3. The "Agency" Illusion**
  *   *Limitation:* The students *felt* like they made a choice. But you rigged the incentives so they *had* to choose Risky to survive the Debt.
  *   *How to Handle:* This is your strongest teaching point. "You felt free, but the economic structure (the Debt) determined your choice. The Mountain just sealed the deal. Is that determinism? Or is that structure?"

  ### VII. Instructor Prep Checklist

  1.  **Print the Cards:**
      *   Mountain: 1x "Eruption (1815)", 1x "Ash Fall (Open Round 3)".
      *   Rain: 1x "Normal", 1x "Short Season (Place Bead)".
  2.  **Print the Rubric:** Make it look official.
  3.  **Test the Math:** Ensure 20 Grain start + Risky Yield covers the Debt + Upkeep, but Safe Yield leaves them vulnerable to the Debt. (Adjust chip counts if needed).
  4.  **Practice the Silence:** When students ask "What does the bead do?", your answer must be "You will see."

  This design respects your constraint to avoid jargon until the end while creating a visceral experience of the "Shock vs. Tempo" problem. The game forces them to create the deterministic narrative themselves, which makes the debrief much more potent than if you simply lectured them on it.
