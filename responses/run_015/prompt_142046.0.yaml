answer: |-
  Here is your Q&A prep sheet. I have ordered these by the potential damage to your thesis, starting with the existential threats and moving down to methodological nitpicks.

  ### 1. The Malcolmian "Criteria" Attack
  **Who:** The Senior Wittgensteinian.
  **The Objection:** "You're positing a 'ghostly' intermediate state. If there is no criterion for the content of the dream prior to the report, in what sense does the content *exist*? You say the experience is 'open,' but without a criterion for what makes a report *true* of that experience, you haven't dissolved the pseudo-question; you've just made the inner theater fuzzier. What is the grammar of 'indeterminate experience'?"
  **Concession:** "You're right that I can't offer a verification condition for the pre-report content without circularity."
  **The Reply (2 min):** "I'm not positing a hidden object; I'm challenging the requirement that experience must be *propositionally structured* to be real. Think of a visual blur. You experience the blur. It isn't 'really' a face that you can't see; the blurriness *is* the phenomenology. My claim is that dream phenomenology is often structurally gappy. The report doesn't verify the dream; it *resolves* the dream. The criterion for the dream's existence is the waking report, but the *character* of that dream includes its prior resolvability. I'm arguing the 'logic' of dreaming allows for sketchiness, not that there's a secret fact hidden from criteria."
  **Weakest Point:** If they press on "resolvability," they can argue resolvability is a property of the *report*, not the *dream*.
  **Status:** **MUST LAND.** If you lose this, you lose the room's philosophical permission to speak.

  ### 2. The Dennett/Grad Student "Confabulation" Charge
  **Who:** The Grad Students.
  **The Objection:** "This looks exactly like Dennett's cassette theory with extra steps. If the report fills in the content, isn't the pre-report state just neural noise? Why call it an 'experience' rather than a disposition to confabulate? You're reifying a narrative process into a phenomenal object."
  **Concession:** "I agree that the 'finished' narrative is constructed at waking."
  **The Reply (2 min):** "Dennett collapses the distinction between *seeming* and *being*. My Sketch Model preserves a phenomenal constraint. You can't report just anything; you are constrained by the affective tone and the 'sketch' present during sleep. If I dream of fear, I won't wake and report a joyful picnic. The 'sketch' is the phenomenal constraint on the confabulation. It's not a full cassette, but it's not a blank tape either; it's a tape with a mood and a rough trajectory recorded on it."
  **Weakest Point:** Distinguishing "phenomenal constraint" from "priming" is difficult without invoking the very inner theater Dennett bans.
  **Status:** High Damage.

  ### 3. The Sleep Lab "Neural Correlate" Challenge
  **Who:** The Two Sleep Researchers.
  **The Objection:** "If the content is indeterminate, what is the physiology doing? We see specific activation patterns in visual cortex during REM. Are you saying the brain is representing determinate images but the 'mind' is indeterminate? That makes your model epiphenomenal. Or is the brain activity also indeterminate? We don't have a neural correlate for 'sketchiness.'"
  **Concession:** "I don't have a specific neural correlate for indeterminacy yet."
  **The Reply (2 min):** "I'm not claiming the *brain* is indeterminate; I'm claiming the *personal-level experience* is. The brain might be firing specific patterns (e.g., V5 for motion), but the integration of that data into a coherent conscious scene is fragmented. Think of it like low-bandwidth streaming: the data packets (neural firing) are determinate, but the rendered movie (experience) is pixelated. My model predicts that reports following abrupt awakenings from high-activation REM should show higher indeterminacy than those from gradual awakenings."
  **Weakest Point:** They may demand a specific prediction you can't make yet.
  **Status:** **FLAG: DO NOT ANSWER HEAD-ON.** Pivot to: "That's exactly why I need your data to map the sketch."

  ### 4. The Clinician's "Trauma Reality" Check
  **Who:** The Clinical Psychologist.
  **The Objection:** "My PTSD patients have recurrent, hyper-determinate nightmares. If I tell them their dreams were just 'open sketches' that they filled in upon waking, I risk invalidating their trauma. Does your model imply their suffering is partly constructed by the reporting process?"
  **Concession:** "This is a serious ethical risk I want to handle carefully."
  **The Reply (2 min):** "The Sketch Model actually helps here. Trauma dreams are often *over-determinate*—they are the exception that proves the rule. They are 'inked in' sketches because the emotional salience is so high it forces determinacy. But for many patients, realizing the dream isn't a fixed prophecy or a rigid memory, but a malleable experience, can be therapeutic. It separates the *feeling* of the trauma from the *narrative* of the dream. I'm not saying the pain is fabricated; I'm saying the narrative container is flexible."
  **Weakest Point:** If they feel you are minimizing the "reality" of the nightmare content.
  **Status:** Moderate Damage (Ethical stakes).

  ### 5. The Bilingual "Priming" Alternative
  **Who:** Sleep Lab / Grads.
  **The Objection:** "Your bilingual dream case is just experimenter demand. The sleeper is woken, hears English, and accesses English semantic networks. There's no need to posit an 'open language' experience. The dream had no language; the waking brain supplied it."
  **Concession:** "Priming is definitely a factor in all dream reports."
  **The Reply (2 min):** "Priming explains the *vocabulary*, but not the *phenomenal sense of understanding*. If I report dreaming in Japanese, I report *understanding* Japanese in the dream. If the dream had no language, I would report 'I was communicating, then I woke up and used Japanese words.' But subjects report 'I was speaking Japanese.' The Sketch Model says the *sense of linguistic agency* was present but open to specification. The priming selects the language, but the experience of *talking* was real."
  **Weakest Point:** Hard to distinguish retrospectively between "sense of agency" and "post-hoc attribution."
  **Status:** Moderate Damage (Undermines your key example).

  ### 6. The Perception Analogy Disanalogy
  **Who:** Philosophy Grads.
  **The Objection:** "In perception, the indeterminacy is in the *input* (the object is too far away). In dreaming, there is no external object. If the brain generates the image, why would it generate an indeterminate one? A generator should generate a signal. Your perception analogy fails because dreaming is generation, not reception."
  **Concession:** "Dreaming is generative, which makes indeterminacy surprising."
  **The Reply (2 min):** "But generation is resource-limited. The brain during REM is in a state of high noise and low top-down control. It's not a high-fidelity renderer; it's a predictive engine running on battery saver. It generates the *prediction* of motion without the *texture* of motion. The indeterminacy isn't in the input; it's in the processing power available to render the simulation."
  **Weakest Point:** Relies on a specific computational theory of mind you haven't defended.
  **Status:** Low Damage.

  ### 7. The "How Many Experiences?" Trap (The Killer)
  **Who:** Anyone (but likely the Malcolmian or a sharp Grad).
  **The Objection:** "If the report partly constitutes the content, how many dreams did you have? If you woke me and I spoke English, I had an English dream. If you woke me five minutes later and I spoke Japanese, did I have a Japanese dream? Did I have two dreams? Or one indeterminate one? If the report fixes the content, the content changes with the report. So the *experience* changes. Do experiences multiply with reports?"
  **Concession:** "This is the hardest ontological question for the model."
  **The Reply (2 min):** "You had one *sleeping* experience (the sketch) and multiple *waking* realizations. The 'dream' as a complete narrative is a hybrid entity: part sleep-phenomenology, part waking-narrative. I'm not saying the experience changes; I'm saying the *description of the experience* completes it. We shouldn't count 'dreams' by reports, but by sleep episodes. The report is the development of the photographic negative, not a new photo."
  **Weakest Point:** If the report is constitutive, the negative analogy fails. If the report *completes* it, the pre-report thing isn't a dream yet.
  **Status:** **FLAG: DO NOT ANSWER HEAD-ON.** Say: "That's a question of individuation criteria I'm currently working on, but it doesn't affect the phenomenological claim."

  ### 8. The Verification "So What?"
  **Who:** Sleep Lab.
  **The Objection:** "If the dream is indeterminate until reported, and the report is influenced by waking state, how do we ever study dreams scientifically? You've made the object of study inaccessible."
  **Concession:** "It does complicate the data."
  **The Reply (2 min):** "It shifts the science. Instead of treating reports as transcripts of a video, we treat them as interactions between a sleep-state constraint and a waking-state interpreter. We can still study the *constraints* (the sketch) by looking for invariants across different reporting conditions. It makes the science harder, but more honest."
  **Weakest Point:** Might make the sleep researchers feel their work is impossible.
  **Status:** Low Damage.

  ---

  ### The One Reply That Must Land
  **Objection #1 (The Malcolmian Criteria Attack).**
  **Why:** Your entire thesis rests on the coherence of "indeterminate experience." If the senior Wittgensteinian convinces the room that "indeterminate experience" is a category mistake (like "a pain that doesn't hurt"), your Sketch Model collapses into either Malcolm's behaviorism or Dennett's eliminativism. You must successfully argue that *phenomenology can be gappy* without being *non-existent*.

  ### The Question You're Hoping Nobody Asks
  **You were right.** It is the **Individuation Question (Objection #7)**.
  **Refined Version:** "If the report is constitutive of the determinacy, does the dream *exist as a dream* before the report? If not, you're a Dennettian. If so, how is it a dream if it lacks content?"
  **Why it's dangerous:** It forces you to choose between "The dream was a real thing with no content" (which sounds mystical/nonsense) or "The dream isn't a dream until I talk" (which is Dennett/Cassette theory). It exposes the tension in your "hybrid" ontology.
  **Strategy:** If asked, use the "Photographic Negative" analogy from Reply #7, but admit it's a metaphor you are still refining. Do not try to solve the metaphysics of individuation in Q&A.
