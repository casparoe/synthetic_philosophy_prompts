  8.  **Final Polish:** Organize into clear sections: Core Desiderata, Hard vs. Negotiable, The Unsatisfiability Trilemma, The Reform-Killer, and Falsifiability. (Proceeding to generate output based on this structure).

      *(Self-Correction on "No Citations"):* I must avoid naming Weber, Foucault, etc., explicitly, even if the concepts are theirs. Keep it conceptual.

      *(Refining the "Reform Killer"):* Standard liberal reform relies on the idea that the state is a neutral arbiter that can be corrected. If the desideratum requires acknowledging that the *function* of policing is inherently tied to managing marginal populations (not just crime), reform is dead. I will frame this as the "Functional Invariance Requirement."

      *(Refining the "Unsatisfiability"):* The clash is between "Universal Safety" and "No State Monopoly." Without the monopoly, you get warlords. With the monopoly, you get state violence. The middle ground (community control) often fails in high-stakes violence.

