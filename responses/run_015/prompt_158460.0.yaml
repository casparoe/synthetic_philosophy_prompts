answer: |-
  To score answers to the Special Composition Question, we must demand coherence across metaphysics, science, and logic. Below are the compressed desiderata.

  ### Desiderata for Adequacy

  1.  **Ontological Distinctness:** Must distinguish composition from constitution (Statue/Clay) and diachronic identity. [Non-negotiable]
  2.  **Causal Non-Redundancy:** Composites must be causally efficacious without every case being systematic overdetermination. [Non-negotiable]
  3.  **Boundary Precision:** Must resolve the Problem of the Many and the Thinking-Parts worry. [Non-negotiable]
  4.  **Modal Stability:** Must explicitly take a stand on whether composition is vague and whether it is extrinsic. [Non-negotiable]
  5.  **Scientific Alignment:** Verdicts on molecules, organisms, and ecosystems must align with special sciences or provide an error theory. [Prejudice of Naturalism]
  6.  **Unity Integrity:** Must resolve the Borrowed-Activity case. Including the synthetic part moves boundaries unexpectedly; excluding it makes unity extrinsic/vicarious. The extrinsic horn is worse, violating mereological internalism. Shows unifying relations cannot be had by proxy. [Non-negotiable]
  7.  **Continuum Resolution:** Must resolve the Near-Miss problem. Must argue for a stopping point (sharp/arbitrary, vague, degree-theoretic, or nihilist) rather than assume one. [Non-negotiable]

  ### Incompatible Pairs

  *   **Scientific Alignment vs. Continuum Resolution:** Special sciences tolerate vague boundaries (ecosystems); metaphysics often demands sharpness to avoid arbitrariness.
  *   **Unity Integrity vs. Modal Stability:** Borrowed activity forces extrinsic composition if boundaries are fixed, violating standard mereological internalism.
  *   **Causal Non-Redundancy vs. Nihilism:** Nihilism avoids overdetermination but requires an error theory for scientific causal claims, conflicting with Scientific Alignment.

  ### Most Exclusionary Requirement

  The demand for **Continuum Resolution** without arbitrariness does the most exclusionary work. It eliminates moderate restrictivism (the common-sense view) because no non-arbitrary sharp boundary can be found in continuous series (bonding, life, integration). This forces theories toward Universalism, Nihilism, or Brutalism.

  ### View Summaries

  *   **Universalism:** Any xs compose something. Solves vagueness/Near-Miss; fails Scientific Alignment (too many objects) and Common Sense.
  *   **Nihilism:** No xs ever compose. Solves vagueness/overdetermination; fails Scientific Alignment (requires error theory for biology/chemistry).
  *   **Life-Based Restrictivism:** xs compose iff activity unifies them. Fits Common Sense/Science; fails Near-Miss (no sharp life/non-life cut) and Borrowed-Activity.
  *   **Brutal Composition:** Composition occurs, but there is no true answer to 'when'. Solves vagueness; fails explanatory demand (Continuum Resolution).

  \answer{Non-arbitrary sharp boundaries required.}
