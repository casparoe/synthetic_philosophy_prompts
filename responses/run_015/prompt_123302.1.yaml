answer: |-
  # JOINT STATEMENT ON THE NORMATIVITY OF BELIEF AND THE WRONG-KIND-REASONS PROBLEM

  **Signatories:** The Strict Evidentialist (SE) and The Pragmatic Pluralist (PP)
  **Date:** October 26, 2023
  **Context:** Conclusion of Adversarial Collaboration on WKR

  ## I. AGREED CLAIMS

  After extensive debate regarding the "Wrong-Kind-Reasons" (WKR) problem, we endorse the following propositions as our shared starting point:

  1.  **Distinction of Attitudes:** Belief is phenomenologically and functionally distinct from hope, wishful thinking, and voluntary assumption. Unlike hope, belief purports to represent how the world actually is. Unlike voluntary assumption, belief is not directly subject to the will; one cannot believe at a moment's notice simply by choosing to do so.
  2.  **The Primacy of Evidence:** In the vast majority of ordinary contexts, evidence regarding the truth of a proposition $p$ is the primary, and often exclusive, driver of rational belief that $p$. Neither party endorses believing against clear, decisive counter-evidence.
  3.  **The Reality of Practical Stakes:** Practical stakes (the cost of being wrong) legitimately influence *action* and *inquiry*. We agree that higher stakes justify gathering more evidence before settling on a belief. We disagree only on whether stakes can influence the *normative status of the belief itself* once the evidence is fixed.
  4.  **The Grip of the WKR Problem:** We agree that the WKR problem arises from a perceived category error. When an agent is offered a reward for believing $p$ (e.g., a demon threatens torture unless you believe the moon is made of cheese), this provides a reason to *want* to believe, or to *cause* oneself to believe, but it intuitively fails to provide a reason that counts in favor of the *truth* of $p$. The problem grips because we distinguish between reasons that make a belief *beneficial* and reasons that make a belief *correct*.

  ## II. TABLE OF DIVERGENCE

  The following table isolates the precise points where our interpretations of the agreed claims split. We have phrased these divergences to ensure both sides recognize their own position in the description.

  | Point of Divergence | Strict Evidentialist Characterization | Pragmatic Pluralist Characterization |
  | :--- | :--- | :--- |
  | **Constitutive Aim** | Belief is *constitutively* aimed at truth. Any norm governing belief must be derived strictly from the goal of accurate representation. | Belief is *standardly* aimed at truth, but its function includes guiding action in ways that sometimes permit pragmatic weighting when evidence is equivocal. |
  | **Screening Mechanism** | The nature of belief automatically "screens out" pragmatic considerations as the wrong kind of reason for *belief* (though they remain right for *action*). | The nature of belief allows pragmatic considerations to function as the right kind of reason for *belief* in specific, constrained contexts (e.g., underdetermination). |
  | **The WKR Solution** | The solution is to deny pragmatic reasons apply to belief. They apply to a neighboring attitude (e.g., "acceptance" or "commitment"). | The solution is to expand the scope of reasons applicable to belief. The "wrong kind" are only wrong when they override decisive evidence, not when they sustain belief in gaps. |

  ## III. THE CRUXES

  We identify two specific pivot points where our theoretical commitments yield different empirical and normative predictions.

  ### Crux 1: Evidence Responsiveness Under Pragmatic Sustenance
  **The Question:** Can a belief remain genuinely evidence-responsive if pragmatic benefits are partly sustaining it? Or does the introduction of pragmatic support inevitably degrade the belief's sensitivity to counter-evidence?

  **Concrete Case: The Decent Mentor**
  A teacher has mixed evidence regarding their own competence. Some student evaluations are poor; others are glowing. The evidence is roughly equivocal. However, the teacher recognizes that believing "I am a decent mentor" is causally necessary to maintain the confidence required to actually mentor well. If they believe they are incompetent, they will become anxious and perform poorly (a self-fulfilling prophecy). They sustain the belief partly on the pragmatic ground that holding it makes them effective.

  *   **SE Prediction:** This attitude cannot remain a stable belief. Because the belief is partially sustained by non-evidence (the benefit of effectiveness), the agent will inevitably become resistant to future counter-evidence. To protect the pragmatic benefit, the agent will rationalize away future poor evaluations. The attitude degrades into dogma or self-deception.
  *   **PP Prediction:** The belief can remain evidence-responsive. Pragmatic support can act as a "tie-breaker" or "ballast" without blinding the agent. The teacher will still acknowledge poor evaluations and adjust their methods, but they will not tip over into the belief "I am incompetent" unless the evidence becomes decisive. The pragmatic reason sustains the belief *through* the noise without severing the link to truth.

  ### Crux 2: The Mediating Attitude Hypothesis
  **The Question:** Can a mediating attitude (e.g., "practical commitment" or "acceptance") absorb all the work the Pluralist wants pragmatic reasons to do, without corrupting the category of belief itself?

  **Concrete Case: The High-Stakes Medical Placebo**
  A patient with a chronic, stress-aggravated condition is told by a doctor that "believing you will recover" significantly increases recovery odds, even if the treatment is inert. The evidence regarding recovery is statistically uncertain (50/50). The patient adopts the stance "I will recover" to maximize health outcomes.

  *   **SE Prediction:** The patient is not *believing* they will recover; they are *accepting* or *committing to the proposition* for practical purposes. If we call this "belief," we corrupt the term. The work PP wants done is real, but it belongs to the category of "Practical Commitment." If we label it belief, we lose the ability to criticize the patient if they ignore new statistical data.
  *   **PP Prediction:** Distinguishing "belief" from "practical commitment" here is an artificial fragmentation of the mind. The patient's psychological state *is* a belief state (it guides expectation and prediction, not just action). If SE relegates this to "commitment," SE is merely protecting a definition while ignoring that the cognitive architecture is functioning as belief. The work PP wants done requires acknowledging this as a species of belief, not a separate attitude.

  ## IV. NOTE ON VERBAL VS. SUBSTANTIVE DISPUTE

  We acknowledge that a significant portion of our disagreement may be verbal rather than substantive.

  1.  **The Labeling Issue:** If the Strict Evidentialist defines "belief" narrowly as *an attitude governed solely by truth norms*, and the Pragmatic Pluralist defines "belief" broadly as *a cognitive state guiding expectation and action*, we may agree on the psychology of the "Decent Mentor" but disagree on whether to apply the word "belief" to it.
  2.  **The Substantive Remainder:** However, a substantive dispute remains regarding **normative criticism**.
      *   If the Mentor stops investigating student feedback because "it threatens my confidence," the SE says this is a failure of *belief*.
      *   The PP says this is a failure of *rational integration*, but not necessarily a failure of the permission to hold the belief initially.
      *   **Test for Substance:** If we encounter an agent who ignores *decisive* counter-evidence (e.g., video proof of their failure) because of the pragmatic benefit, the SE predicts the PP must call this rational. The PP concedes this would be irrational. This suggests our substantive overlap is larger than our terminology implies, centering specifically on *underdetermined* cases rather than evidence-overriding ones.

  **Conclusion:** We part ways on the definition of the boundaries of belief, but agree that pragmatic factors legitimately influence the human cognitive economy. The dispute is less about whether pragmatic reasons *matter*, and more about whether they enter through the front door (as reasons for belief) or the side door (as reasons for managing belief).

  __________________________
  **Strict Evidentialist**

  __________________________
  **Pragmatic Pluralist**
