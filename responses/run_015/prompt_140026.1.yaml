answer: |-
  ### Premise Check
  **Can this be done in ninety minutes?**
  Yes, but only if you treat this as a **copy-editing workshop**, not a history seminar. You are not training them to be historians; you are training them to spot a specific syntactic and narrative tic in their own drafts. If you attempt to teach the *philosophy* of Whig history, you will fail. If you teach them to recognize the *sentence structures* that produce it, you might succeed.

  **Is your four-way scheme muddled?**
  Your fourth mode ("Retrospective Unit") does not collapse, but it is not a sibling to the other three. It is the **parent**.
  *   **Retrospective Unit** is the *mechanism* (projecting current categories backward).
  *   **Anticipatory, Vindication, and Maturity** are the *narrative shapes* that mechanism produces.
  *   **Advice:** Do not present them as four equal options. Present "Retrospective Unit" as the **Root Error**, and the other three as the **Standard Stories** that grow from it. This clarifies the logic for reporters: "If you stop projecting our categories (Unit), you cannot claim they were waiting for us (Anticipatory) or that they were secretly us (Vindication)."

  **Is this a style guide dressed as historiography?**
  Yes. **Lean into that.** Do not apologize for it. Your reporters do not need to know what Herbert Butterfield thought in 1931; they need to know how to write the second paragraph of a breakthrough story without lying about the past. Operationalize the historiography.

  ---

  ### The Session Plan (90 Minutes)

  #### 1. The Hook: Feel the Pull (00:00 – 00:15)
  *   **Action:** Hand out a one-page excerpt. Do not label it.
  *   **Content:** A polished, compelling narrative about a recent breakthrough in their field (AI or Biomed) that is heavily Whiggish. It should read *well*. It should feel like good journalism. (e.g., "For decades, researchers struggled in the dark until X finally lit the torch...")
  *   **Task:** Ask the room: "What is the strongest sentence here? Why does this work?"
  *   **Goal:** Let them defend the narrative. Let them admit it makes the story readable. You must validate that Whig history is *good storytelling* before you ask them to stop doing it. If you start by calling it a sin, they will tune out.
  *   **Transition:** "This works because it gives us a destination. But it buys that destination by mortgaging the past."

  #### 2. The Concession: Truth Exists (00:15 – 00:25)
  *   **Action:** Explicitly address the relativism fear.
  *   **Script:** "We are not saying science doesn't work. We are not saying truth doesn't accumulate. If you cure a disease, you cure a disease. The new paper *is* better than the old paper. We are conceding that right now."
  *   **The Pivot:** "The lie is not about the *truth*; it is about the *motive*. Whig history claims the past was trying to be the present. It wasn't. They were trying to solve their problems, with their tools, in their world. When we write as if they were just failing to be us, we distort why they did what they did."
  *   **Misconception Check (1):** Head off the idea that this is a **ban on saying past science was wrong**. You can say they were wrong. You just can't say they were wrong *about our questions*.

  #### 3. The Case Study: *Helicobacter pylori* (00:25 – 00:55)
  *   **Why this case:** It is biomed (half your room), it has a clear "breakthrough" moment (Nobel 2005), but the "hero vs. establishment" narrative is pre-packaged and ripe for dismantling. It is not as canonical as DNA, but familiar enough to not require a lecture on the science.
  *   **What it must have:** The 1970s consensus (ulcers = stress/acid), the 1979 discovery (Marshall/Warren), the initial rejection, the eventual acceptance.
  *   **What it must lack:** **Do not start with Marshall drinking the bacteria.** That is the hero myth. Start with the 1970s treatment protocols.
  *   **The Exercise:**
      1.  Ask the room to write the "standard" narrative (3 mins). They will write: "Doctors thought stress caused ulcers. They were wrong. Marshall found bacteria. He was vindicated."
      2.  **Intervene:** "Why did doctors think stress caused ulcers? Because that's what the evidence showed *then*. Bacteria were not visible with their scopes. Acid was the only variable they could measure."
      3.  **The Shift:** "The past was not a waiting room for *H. pylori*. It was a functional system for managing symptoms with the tools available. The 'error' wasn't blindness; it was a different categorization of the stomach environment."
  *   **Misconception Check (2):** Head off the idea that this is **only about heroes**. This isn't about taking Marshall down; it's about understanding why the 'establishment' wasn't evil, just working within a different 'Retrospective Unit' (the category of 'gastritis').
  *   **Misconception Check (3):** Head off the idea that the **remedy is adding obstacles**. Do not let them solve this by writing "It was hard, there were many failures." That is still a march, just a bumpy one. The remedy is changing the *direction* of the march.

  #### 4. The Four Modes: Root and Branches (00:55 – 01:10)
  *   **Action:** Put your scheme on the board, but hierarchically.
  *   **Visual:**
      *   **ROOT:** Retrospective Unit (The Anachronism). *Writing as though today's categories were the natural joints in the past.*
      *   **BRANCH 1:** Anticipatory Move. *X paved the way for Y.* (Implies X wanted Y).
      *   **BRANCH 2:** Vindication Plot. *The neglected figure was right all along.* (Implies the truth was static, just hidden).
      *   **BRANCH 3:** Maturity Metaphor. *The field came of age.* (Implies the field is an organism growing toward us).
  *   **Task:** Go back to the *H. pylori* case. Ask them to identify one sentence for each Branch.
      *   *Anticipatory:* "Warren's observations hinted at the bacterial theory." (No, they hinted at inflammation).
      *   *Vindication:* "Marshall proved the skeptics wrong." (He changed the definition of proof).
      *   *Maturity:* "Gastroenterology finally grew up." (It changed tracks).
  *   **Misconception Check (4):** This is where you handle the **Flipped Vindication**. "If you write that Marshall was 'right all along,' you are committing the same Whig error as the skeptics. You are judging 1980 by 2005 standards. The cure is not to flip the hero; it is to dissolve the trial."

  #### 5. Out of Scope & The Final Question (01:10 – 01:30)
  *   **Announce Out of Scope:**
      1.  **Philosophy of Science:** We are not debating Kuhn, Popper, or whether 'truth' exists. We are debating adverbs and narrative arcs.
      2.  **Moral Judgment:** We are not exonerating bad actors. If someone suppressed data for profit, say so. Whig history is about *teleology*, not ethics.
      3.  **Archival Research:** You are not required to read 1970s papers. You are required to stop quoting 2024 press releases about 1970s papers as if they are neutral.
  *   **The Final Question:**
      Put this on the screen. Give them 5 minutes to write a response, then ask for two volunteers to read theirs.
      > **"Describe the 1980s AI winter (or the pre-H. pylori ulcer consensus) without using it as a foil to make the current success look brighter. Write a paragraph where the past is a different country, not a waiting room."**
      *   *Why this works:* It forces them to decouple the past's value from the present's success. If they can describe the past as *functional* rather than *failed*, they have broken the Whig habit.

  ---

  ### Confidence & Contested Ground

  **1. Confidence in the Structure (High):**
  The flow from "Feel the Pull" to "Concede Truth" to "Analyze Mechanism" is pedagogically sound for defensive adults. It lowers threat before raising standards.

  **2. Confidence in the Case Study (Medium):**
  *H. pylori* is strong, but it is *very* close to a canonical "hero vs. dogma" story. If your reporters are biomed specialists, they may have rehearsed narratives ready.
  *   *Contingency:* If they push back hard on *H. pylori* ("But Marshall *was* right and they *were* dogmatic!"), pivot immediately to **The Perceptron (1958)**. The AI reporters will know it. The narrative there is "Minsky killed AI." The Whig correction is "Computing power didn't exist; the math wasn't there; it wasn't a conspiracy, it was a resource constraint." This often lands better with AI desks because it removes the villain, which they often prefer.

  **3. Confidence in the Four Modes (High, with caveat):**
  Your scheme is excellent for journalists. The only contestation is from professional historians who might argue "Retrospective Unit" is unavoidable to some degree.
  *   *Flag this:* Tell the room: "Historians argue about whether it's possible to write *zero* Whig history. We are not aiming for zero. We are aiming for awareness. If you catch yourself doing it, ask: 'Is this necessary for the reader, or just easy for me?'"

  **4. Confidence in the Time Limit (Low):**
  Ninety minutes is enough to introduce the concept and run one exercise. It is **not** enough to change habits.
  *   *Direct Warning:* You must tell them: "This session will not fix your drafts. It will only give you a red flag to look for during your next edit. You will still write Whig history next week. The goal is to catch it in the second pass."

  **5. Contested Reading of "Whig History":**
  Be aware that in the History of Science, the term "Whig History" is itself sometimes considered outdated (some prefer "Presentism"). However, for journalists, "Whig" is the recognizable term.
  *   *Risk:* Some reporters may argue that science *is* cumulative, therefore a march toward the present is accurate.
  *   *Counter:* "The *knowledge* accumulates. The *motives* do not. You are writing about people, not just data points."

  ### Summary of Corrections to Your Plan
  1.  **Hierarchy the Modes:** Make "Retrospective Unit" the root, not the fourth sibling.
  2.  **Case Study Caution:** *H. pylori* is good, but be ready to swap to *Perceptrons* if the biomed reporters are too attached to the "hero" narrative.
  3.  **Manage Expectations:** Explicitly state that 90 minutes creates *awareness*, not *mastery*.
  4.  **Final Question:** Use the "Different Country" prompt. It is the most direct test of the distinction.

  You are not asking them to stop writing about progress. You are asking them to stop writing about *destiny*. That is a distinction they can work with.
