          *   *Build System Analogue:* Dependency declarations. If I change file A, file B rebuilds. But file C *doesn't* rebuild. How do I specify that C doesn't depend on A without listing every non-dependency?
          *   *Mapping:* Dependency graph edges = causal laws. Missing edges = frame axioms (closed world assumption).

      *   **Version 2: The Semantic/Relevance Frame Problem (Fodor, 1983/2000).**
          *   *Core:* It's not just representation; it's about *relevance*. How does a mind know which facts are relevant to a action without checking *all* facts? Is cognition modular or holistic?
          *   *Build System Analogue:* Transitive closure vs. global state. If I change a macro, does it affect the linker script? A build system assumes modularity (files). Fodor argues cognition isn't modular.
          *   *Mapping:* Dirty bits = relevance detection. But build systems cheat by defining boundaries. Fodor says boundaries are porous.

      *   **Version 3: The Bounded/Embedded Frame Problem (Dennett, Wheeler, etc.).**
