answer: |-
  This is a brilliant mapping. You have correctly identified that build systems are essentially engineered solutions to a constrained version of the Frame Problem. Your intuition about "cheating via hermeticity" is the exact pivot point between computer science and philosophy here.

  Here is the translation of the three iterations of the Frame Problem into your vocabulary of dependency graphs, invalidation, and dirty bits.

  ---

  ### 1. The Logical Frame Problem (McCarthy & Hayes, 1969)
  **The Philosophy:** In first-order logic, if you represent an action $A$ changing state $P$, you must explicitly state that $A$ does *not* change $Q, R, S \dots$. If you don't, the logic cannot assume they stay the same. You drown in "frame axioms" (statements of non-change).
  **The Build Translation:** Explicit dependencies vs. implicit stability.

  *   **Maps Cleanly:**
      *   **Causal Laws = Dependency Edges:** "If header.h changes, main.o must rebuild."
      *   **Frame Axioms = Missing Edges:** "If header.h changes, README.md does *not* rebuild." In a dependency graph, non-dependencies are represented by the *absence* of an edge. You solve the representational explosion by treating "no edge" as "no effect."
      *   **The Qualification Problem:** You know changing a source file rebuilds the object, but what if the disk is full? What if the compiler segfaults? Build systems usually ignore these preconditions (qualifications) just like early AI planners did.

  *   **Requires Fudging:**
      *   **Closed World Assumption (CWA):** Logic wanted an Open World (things might be true that we don't know). Build systems enforce a Hermetic CWA: *If it isn't in the graph, it doesn't exist.* You solve the logical frame problem by fiat: "We declare that only declared inputs matter."
      *   **Side Channels:** If your build reads an environment variable or a network resource not in the graph, you've violated the logical frame assumptions. You fudge this by calling it "undefined behavior" or "non-hermetic."

  *   **No Counterpart:**
      *   **Entailment:** In logic, $P$ might imply $Q$ without an explicit rule. In build systems, implication must be explicit (a rule or edge). A build system cannot infer that changing a `struct` layout invalidates a binary unless you tell it (via the compiler dependency).

  ### 2. The Relevance/Holism Problem (Fodor, 1983+)
  **The Philosophy:** It's not just about representing non-change; it's about *relevance*. How does a mind know which of its infinite beliefs are relevant to a specific action without checking them all? Fodor argued cognition is isotropic (any fact can affect any other) and unencapsulated, making relevance computationally intractable for modular systems.
  **The Build Translation:** Transitive closure vs. global coupling.

  *   **Maps Cleanly:**
      *   **Dirty Bits = Relevance Heuristics:** Marking a node "dirty" is a claim that this node is *relevant* to the final output.
      *   **Transitive Closure:** The build system computes the set of all relevant nodes by traversing edges. This is the algorithmic attempt to solve relevance.

  *   **Requires Fudging:**
      *   **Modularity vs. Holism:** Build systems *enforce* modularity. Fodor's point is that the world (and the mind) is *not* modular. A change in a "common" header (like `windows.h` or a macro in a shared config) is the build-system equivalent of Fodor's holism: it makes everything transitively depend on everything else.
      *   **Semantic Ignorance:** A dependency graph tracks *file identity*, not *semantic meaning*. Fodor's relevance is semantic (does this fact matter to this goal?). Your system treats a whitespace change the same as a logic change. You fudge relevance by over-approximating: "If the file touched, it matters."

  *   **No Counterpart:**
      *   **Isotropy:** In a build graph, edges are directed and fixed. In Fodor's cognition, any belief can potentially become relevant to any new input. There is no "global variable" in a well-constructed build graph, but in holistic cognition, everything is potentially a global variable.

  ### 3. The Bounded/Embedded Frame Problem (Dennett, Wheeler, 2000s)
  **The Philosophy:** A real agent is embedded in an environment, on a clock, with limited compute. It cannot compute the full transitive closure of reality before acting. It must use heuristics to decide what to ignore, knowing it might be wrong.
  **The Build Translation:** Incremental build latency vs. correctness SLAs.

  *   **Maps Cleanly:**
      *   **Incremental Build = Bounded Rationality:** You cannot afford a full rebuild (omniscience) every time. You use dirty bits (heuristics) to act fast.
      *   **Over-approximation = Safety Heuristics:** Rebuilding too much (false positive dirty) is cheap. Rebuilding too little (false negative dirty) is catastrophic (wrong binary). You optimize for soundness over precision, exactly as a bounded agent avoids death over optimizing calorie intake.
      *   **Watchers (fsnotify) = Embedded Sensors:** You don't poll the whole world state; you wait for interrupts from the environment (file system events).

  *   **Requires Fudging:**
      *   **Control of Environment:** A bounded agent is *subject* to the world. Your build system *owns* the world (the sandbox). If a file changes outside the graph, your system crashes or produces stale artifacts. A real agent has to adapt; your system just fails.
      *   **Time:** For a robot, "too slow" means it gets hit by a car. For a build, "too slow" means a developer context-switches. The stakes are different, but the computational structure (deadline vs. closure) is identical.

  *   **No Counterpart:**
      *   **Unanticipated Perturbation:** In builds, inputs are discrete files. In embedded agency, the environment can change in ways you have no sensor for (e.g., gravity changes). You have no analogue for "unknown unknowns" because your hermetic boundary defines the universe.

  ---

  ### Addressing Your Hypotheses

  #### 1. "We partly solved it by cheating: we make the world hermetic... treat anything untracked as nonexistent."
  **Verdict:** Correct. This is the **Closed World Assumption**.
  In philosophy, the Frame Problem is hard because the world is open. In build systems, you solve it by drawing a box and saying "The Frame is everything inside this box."
  *   **The Cheat:** You convert an epistemological problem (what is true?) into an engineering contract (what is tracked?).
  *   **The Cost:** When the leak happens (a generated header, a timestamp, a macro that reads `__DATE__`), the system doesn't degrade gracefully like a mind; it produces silent corruption. This is the "standing nightmare" you mentioned.

  #### 2. "Is the frame problem just the holism problem in a costume?"
  **Verdict:** No, but they overlap at the "Global Invalidate" point.
  *   **The Frame Problem** is about *change*: How do I represent that $X$ didn't change? (Solved by CWA/Graph edges).
  *   **The Holism Problem** is about *connection*: How do I know $X$ doesn't affect $Y$? (Solved by Modularity).
  *   **The Difference:** Dependency graphs *can* express holism (a fully connected graph). They just perform terribly when they do. The philosophical claim is that cognition *is* fully connected (holistic) but somehow *acts* modularly. Your build system *is* modular and breaks when it becomes holistic.
  *   **What Graphs Can't Say:** They cannot express **semantic relevance**. A graph knows `config.h` depends on `main.c`. It does not know that changing a comment in `config.h` is irrelevant. Fodor's relevance is about meaning; your dirty bits are about identity. You solve this by making identity the proxy for meaning, which works until it doesn't (e.g., refactoring that changes names but not behavior, or macros that change behavior without changing file hashes).

  #### 3. "Does the from-scratch build I use as ground truth have any analogue for them?"
  **Verdict:** This is the deepest disanalogy.
  *   **For You:** The full rebuild is the **Oracle**. It is computationally expensive but always available. It is the definition of Truth. If your incremental build disagrees with the full build, the incremental build is buggy.
  *   **For Philosophers:** There is **no Oracle**. There is no "full rebuild of the universe" available to a cognitive agent. We never have access to the "ground truth" of the world state, only our current model.
  *   **The Implication:** You have a luxury they don't. You can verify soundness by running the expensive computation. AI/Philosophy cannot verify if their "incremental belief update" matches reality without interacting with reality, which changes the state.
  *   **The Nightmare:** Your nightmare is when the "full rebuild" takes too long to be useful. Their nightmare is that the "full rebuild" is *impossible in principle*.

  ### Summary
  You have solved the **Representational Frame Problem** by enforcing a strict schema (the graph).
  You have mitigated the **Inferential Frame Problem** by accepting over-approximation (rebuilding too much).
  You have avoided the **Holism Problem** by enforcing modularity (and punishing violations with slow builds).

  The philosophers are stuck with the version of the problem where you cannot draw the box, you cannot assume untracked files don't exist, and you never have time to run the full build. Your "standing nightmare" (transitive explosion) is their default state of existence.
