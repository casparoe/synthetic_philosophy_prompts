  The resource-budgeting mechanism you describe is effectively a version of step-logics or active knowledge structures, which are well-established solutions to logical omniscience that limit derivation depth rather than altering modal frames. In standard epistemic logic, closure under consequence arises from the Distribution Axiom (K) and the Rule of Necessitation, not from frame topology like reflexivity or transitivity. Frame properties determine which worlds are accessible (truth conditions), whereas your cost function operates on the proof theory (derivability); mixing them requires a hybrid semantics where accessibility edges carry cognitive costs, which is not standard. You are likely confusing closure under consequence (Axiom K) with positive introspection (Axiom 4), where transitivity matters, because budgeted steps naturally limit iterated knowledge ($K\phi$ holds but $KK\phi$ fails) rather than immediate logical consequences. This distinction is crucial because framing it as a loop issue suggests a semantic fix for what is fundamentally a syntactic constraint.

  The project is interesting if you formalize the cost as accumulating across accessibility relations (cognitive distance between worlds), but otherwise it risks being standard resource-bounded reasoning without the modal novelty you suspect.

