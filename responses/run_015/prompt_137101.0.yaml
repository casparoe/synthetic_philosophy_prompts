prompt: |-
  Hey — sorry in advance, this is a long one. I'm giving a talk in three weeks at a small interdisciplinary workshop on legitimacy and automated decision-making, and the schedule gives us 30 minutes of Q&A after a 20 minute paper, which for this crowd basically means a bloodbath. I've been going back and forth with my supervisor about the last section and I still don't know if I can hold the line, so what I need is a prep sheet, not another defense of the view.

  Here's the thesis I'm defending. I'm going after extrapolated-volition accounts: the idea, familiar both from idealized-preference theories in ethics and from the version the AI-alignment crowd calls coherent extrapolated volition, that the proper target for a law isn't what people actually want but what they would want if they were more informed, less akratic, more coherent, and so on. My claim is that "extrapolation" isn't a single operation but a bundle of at least five — (1) add factual information, (2) scrub out irrationality and weakness of will, (3) render each person's preference set internally coherent, (4) undo preferences deformed by injustice or by narrowed option sets, (5) merge the resulting individual wills into one — and that these do not commute, because each one takes the output of the previous ones as its input, so in general there is no order-independent endpoint and no fixed point to converge on. Two toy cases I use: a woman in a strongly patriarchal village who says she doesn't want to work outside the home — do (1) first and she learns what other lives are like, do (4) first and you declare the preference deformed and set it aside, and the two routes come apart badly; and a case where two people each have intransitive preferences and the order of (3)-then-(5) versus (5)-then-(3) hands the decision to different people. My fix, which is the part I'm shakiest on, is to bootstrap rather than eliminate: stop trying to define the endpoint at all, and instead let the citizens themselves choose the *path* of idealization, under a deliberately thin idealization (sober, informed that the choice matters, given a plain-language explanation of what each of the five operations does and why the order matters), and treat whatever path they pick as the legitimate one. I want to say this rescues extrapolation from my own objection without collapsing into ordinary deliberative democracy, but I'm definately not sure I can.

  So, the room. Two analytic political philosophers who work on legitimacy and are broadly Rawlsian — they'll want to know why the order of idealization isn't just a parameter to be settled inside the theory of the person, and whether my "path choice" is the original position wearing a different hat. Three deliberative democrats who think the whole extrapolation framing was a mistake from the start and that my bootstrap concedes their point while pretending not to. A social choice theorist who will notice immediately that a procedure for choosing an idealization path is itself an aggregation rule and will start reaching for impossibility results, and who will also ask what happens when the set of admissible extrapolations is empty or has several members. One person from the AI-alignment side who actually likes CEV and thinks my non-commutativity point either is already handled by the formalism or only shows we need a better formalism. An empirical political scientist who runs real citizens' assemblies and deliberative polls and will say that in practice the outputs track the briefing materials, the expert witnesses and the facilitator, so my path-choice just gets captured by whoever writes the handbook. And possibly someone from a critical-theory background who thinks "the will of the people" is produced by institutions rather than fed into them, and that I've smuggled in a demos without noticing. (Also the acoustics in the venue are terrible, so replies need to be short enough to say out loud.)

  What I want from you: the objections in roughly the order they'll actually come at me in that room, ordered by how much damage they'd do rather than how philosophically deep they are, and phrased the way each of those people would actually phrase it — I want to hear the Rawlsian's vocabulary and the political scientist's impatience, not a generic philosopher-of-record. For each one: a reply I could deliver in about two minutes, what I should concede right away in order to keep the room, what I should refuse to give up even if it costs me, and a note on where that reply is softest. Then flag the two spots where my own argument is genuinely weakest and I should walk in with the defense already prepared instead of hoping nobody notices. And finish with the one question I'm hoping nobody asks — my guess is it's about a population that extrapolates to something genuinely atrocious, and whether my account has any resources to say no, but if you think the really damaging question is a different one, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a 20-minute paper + 30-minute Q&A at an interdisciplinary workshop on legitimacy and automated decision-making.
      *   **Thesis:** Extrapolated-volition accounts (like CEV or idealized preference theories) fail because "extrapolation" is a bundle of 5 non-commuting operations (info, rationality, coherence, justice-deformation, aggregation). Order matters, so there's no unique fixed point.
      *   **Proposed Fix:** "Bootstrap" the path. Let citizens choose the *path* of idealization under thin conditions (sober, informed about the choice).
      *   **Audience:** 2 Rawlsians, 3 Deliberative Democrats, 1 Social Choice Theorist, 1 AI-Alignment, 1 Empirical Political Scientist, 1 Critical Theorist. (Total ~8-9 active questioners).
      *   **Constraints:** Replies must be short (spoken, ~2 mins), acknowledge specific disciplinary vocabularies, identify concessions vs. hard lines, note soft spots.
      *   **Deliverables:** Ordered objections (by damage potential), specific replies, concession/refusal points, soft spot analysis, two genuine weaknesses, one "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Fix:**
      *   *Core Argument:* Non-commutativity of idealization operations $\rightarrow$ No unique "True Will."
      *   *Core Fix:* Meta-choice of idealization path by citizens.
      *   *Vulnerability:* This meta-choice looks like... democracy? Or it requires its own idealization? Or it leads to bad outcomes? Or it's circular?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Candidate 1: The Social Choice Theorist.* (High Damage). If the path choice is an aggregation rule, Arrow's Theorem applies. If citizens disagree on the path, how do we aggregate *that*?
      *   *Candidate 2: The Deliberative Democrats.* (High Damage). If you let them choose the path via deliberation, you've just described deliberative democracy. Why keep the "extrapolation" label? It's window dressing.
      *   *Candidate 3: The Empirical Political Scientist.* (High Damage/Practical). Facilitator bias. The "handbook" determines the path. Your "thin" idealization is impossible in practice.
      *   *Candidate 4: The Rawlsian.* (Medium/High Damage). Is this just the Original Position? Why isn't order a theoretical parameter fixed by justice, not empirical choice?
      *   *Candidate 5: The Critical Theorist.* (Medium Damage). You assume a "people" exists to choose the path. Institutions produce the will.
      *   *Candidate 6: The AI-Alignment Person.* (Low/Medium Damage). Formalism can handle non-commutativity (e.g., vector spaces). You're attacking a strawman.
      *   *Candidate 7: The "Atrocity" Question.* (High Damage/Normative). What if they choose a path that leads to fascism? Does your account have a veto?

      *Ordering by Damage:*
      1.  Deliberative Democrats (Collapses the distinction, makes the project redundant).
      2.  Social Choice Theorist (Formal impossibility of the meta-choice).
      3.  Empirical PolitSci (Implementation captures the theory).
      4.  Rawlsians (Theoretical redundancy/confusion).
      5.  Critical Theorist (Constitutive power).
      6.  AI Alignment (Technical quibble).

      *Refining the "Damage" Assessment:* Actually, the Social Choice objection might be the most fatal *formally*, but the Deliberative Democrat objection is the most fatal *conceptually* for a legitimacy workshop. If it's just democracy, why call it extrapolated volition? I'll put Deliberative Democrats first because they are the largest bloc (3 people). Social Choice second. Empirical third.

  4.  **Drafting the Replies (Focusing on Tone and Length):**
      *   *Constraint:* ~2 minutes spoken. Roughly 250-300 words max per reply.
      *   *Tone:* Disciplinary specific.
      *   *Structure:* Concession, Pivot, Hard Line, Soft Spot.

      *(Self-Correction during drafting)*: Make sure the "Bootstrap" fix is defended consistently. The key is that the *procedure* is legitimate because it acknowledges the contingency, not because it finds the Truth.

  5.  **Identifying Genuine Weaknesses:**
      1.  *The Regress Problem:* To choose the path, do they need to be idealized? If yes, regress. If no, why trust *this* choice?
      2.  *The Normative Ceiling:* If the chosen path leads to rights violations, does the theorist have a veto? If yes, it's not bootstrapped. If no, it's dangerous.

  6.  **Identifying the "Hope Nobody Asks" Question:**
      *   User suggests: "What if they extrapolate to something atrocious?"
      *   My assessment: Yes, this is the "Weimar" problem. If legitimacy comes from the path choice, and they choose a path that validates tyranny, does the theory collapse? This is the hardest normative bullet to bite.

  7.  **Final Review against Constraints:**
      *   Did I capture the Rawlsian vocabulary? (Original Position, veil of ignorance, parameter vs. choice).
      *   Did I capture the PolitSci impatience? (External validity, facilitator bias).
      *   Did I capture the Social Choice precision? (Aggregation rule, domain restrictions).
      *   Are the replies short enough? (Need to keep them punchy).
      *   Did I order by damage? (Yes).

  8.  **Final Polish:** Check the tone. It needs to be supportive but rigorous. "Prep sheet" style.

  *(Self-Correction on Ordering)*: I think the Social Choice objection is actually more damaging than the Deliberative one because it claims the *mechanism* is impossible, whereas the Deliberative one just claims it's *redundant*. Impossibility kills the project; redundancy just renames it. I will swap them. Social Choice first.

  *(Wait, reconsidering)*: The prompt says "ordered by how much damage they'd do rather than how philosophically deep they are." A redundancy charge (Deliberative) might feel like "you wasted our time," but an impossibility charge (Social Choice) means "your solution doesn't work." However, in a *legitimacy* workshop, if you admit you're just doing deliberative democracy, you lose your niche. But if you can't aggregate the path choice, you have *no* mechanism. I'll stick with Social Choice as #1 because it threatens the coherence of the "bootstrap" itself. Deliberative is #2 because it threatens the *point* of the paper.

  *Actually, let's look at the crowd again.* 3 Deliberative Democrats vs 1 Social Choice Theorist. The volume of fire from the Deliberative Democrats might be more exhausting, but the Social Choice theorist has the "checkmate." I'll put Social Choice first as the "Kill Shot," Deliberative second as the "Death by a Thousand Cuts."

  *Wait, one more thought:* The Empirical PolitSci objection is very practical. "Your handbook writes the law." This undermines the "thin idealization" claim. This might be more damaging in a workshop about *automated decision-making* where implementation matters. But the Social Choice objection is more fundamental. I'll keep Social Choice #1.

  *Let's refine the "Hope Nobody Asks".* The user guesses it's about atrocities. I agree. That's the "Liberal Constraint" problem. If I say "No veto," I'm a relativist. If I say "Yes veto," I'm not bootstrapping.

  *Let's refine the Weaknesses.*
  1. The Regress (How idealized is the path-chooser?)
  2. The Veto (What stops bad paths?)

  *Okay, ready to write.*
answer: |-
  Here is your prep sheet. I have ordered these by the likelihood of them derailing the project, not by how much fun they are to answer. The replies are scripted for oral delivery—roughly 250 words, two minutes max.

  ### 1. The Social Choice Theorist (The "Impossibility" Objection)
  **The Objection:** "You've identified a non-commutativity problem in idealization, but your solution is to aggregate preferences *over* idealization paths. That's just a second-order social choice problem. If citizens disagree on whether to prioritize coherence (3) or justice-scrubbing (4) first, you need an aggregation rule. Arrow's Theorem still applies. You haven't solved the indeterminacy; you've just kicked it up one meta-level. What happens when the set of admissible paths is empty or cyclic?"

  **The Reply:**
  "You're right that the meta-choice is an aggregation problem, and I concede I'm not escaping Arrow. But that's a feature, not a bug. My argument isn't that we can find a *consistent* path, but that legitimacy comes from owning the *inconsistency*. Standard extrapolation hides the aggregation rule inside the 'ideal observer.' I'm dragging it into the light. If the paths cycle, that tells us the populace is fundamentally divided on what counts as rationality, not that the math failed. We don't need a fixed point; we need a recognized procedure for navigating the cycle. I'm trading mathematical convergence for political transparency."

  *   **Concede:** Yes, this is a second-order aggregation problem; Arrow applies.
  *   **Refuse:** That this invalidates the project. The goal is legitimacy, not consistency.
  *   **Soft Spot:** If they press on *how* you navigate the cycle without a tie-breaker. You don't have one.
  *   **Tone:** Respectful of the formalism, but pivoting to political function.

  ### 2. The Deliberative Democrats (The "Redundancy" Objection)
  **The Objection:** "If citizens deliberate to choose the path of idealization, under conditions of being informed and sober... that's just deliberative democracy. You've spent 20 minutes critiquing extrapolation only to conclude that people should talk to each other about how to make decisions. Why keep the 'extrapolated volition' framing at all? It sounds like you're conceding our point while trying to keep the technical vocabulary."

  **The Reply:**
  "It looks like deliberative democracy, but the normative weight lands differently. In standard deliberative theory, the *outcome* is legitimate because of the procedure. In my account, the *parameterization of the self* is what's being decided. Deliberative democrats assume we know who the 'self' is that's deliberating. I'm saying the constitution of that self—whether we prioritize coherence over justice, or information over stability—is the actual political contest. I'm not saying 'talk to decide the law.' I'm saying 'talk to decide what counts as *you* before we ask what you want.' That's a deeper cut than standard deliberation."

  *   **Concede:** The procedure looks identical to a citizens' assembly.
  *   **Refuse:** That the *object* of the decision is the same. They decide policies; you decide ontologies.
  *   **Soft Spot:** If they argue that deciding "what counts as you" *is* just a policy decision about rights.
  *   **Tone:** Firm distinction. Don't let them collapse the meta-level into the object-level.

  ### 3. The Empirical Political Scientist (The "Facilitator Bias" Objection)
  **The Objection:** "I run these assemblies. You say the choice is 'thinly idealized,' but in practice, the output tracks the briefing materials and the facilitator. If I write the handbook explaining the five operations, *I* decide the order they're presented in, which primes the choice. Your 'bootstrap' just gets captured by whoever writes the user manual. How is this different from current technocratic capture?"

  **The Reply:**
  "That is a genuine implementation risk, and I don't have a safeguard against a malicious facilitator. But my claim is comparative. Currently, the 'handbook' is written by the algorithm designer or the ethicist in a black box. They decide the order of operations (1) through (5) without input. My proposal moves the handbook writing into the public sphere. It's still vulnerable to bias, but now the bias is contestable. I'd rather fight over the briefing materials than fight over the source code."

  *   **Concede:** Facilitator bias is real and unavoidable.
  *   **Refuse:** That this makes it *worse* than the status quo. Transparency of bias is better than hidden bias.
  *   **Soft Spot:** If they ask for a concrete mechanism to audit the handbook. You don't have one.
  *   **Tone:** Pragmatic. Acknowledge the messiness of real-world institutions.

  ### 4. The Rawlsians (The "Original Position" Objection)
  **The Objection:** "Why isn't the order of idealization a parameter to be settled by theory, not empirical choice? In the Original Position, we don't vote on whether to be rational or informed; the theory stipulates it to ensure justice. Your 'path choice' looks like the Original Position wearing a different hat, but without the veil of ignorance. Why let actual people, with their actual biases, decide the conditions of their own idealization?"

  **The Reply:**
  "Because the veil of ignorance assumes we know which biases matter. Rawls assumes 'rationality' and 'mutual disinterest' are the right filters. My non-commutativity proof shows that changing the filter order changes the outcome of justice. If we stipulate the order theoretically, we're just smuggling in a specific conception of the good. I want the citizens to decide whether 'justice-scrubbing' (4) happens before or after 'coherence' (3), because that's a substantive political value, not a pre-political constraint."

  *   **Concede:** It shares structural DNA with the Original Position.
  *   **Refuse:** That the parameters of the person should be fixed *a priori*.
  *   **Soft Spot:** If they ask if there are *any* constraints on the path choice (e.g., can they choose slavery?).
  *   **Tone:** Theoretical respect, but insisting on the contingency of the "person."

  ### 5. The Critical Theorist (The "Constitutive Power" Objection)
  **The Objection:** "You talk about 'the citizens' choosing the path. But 'the citizens' are produced by the very institutions you're trying to legitimize. There is no pre-institutional demos to do the bootstrapping. You've smuggled in a unified subject where there is only fragmentation."

  **The Reply:**
  "I agree there is no pre-institutional demos. That's why the bootstrap is iterative. We don't do this once. We treat the 'people' as a project, not a premise. The first path choice constitutes the demos enough to make the first decision, which then reshapes the demos for the next choice. I'm not assuming a unified subject; I'm assuming a recursive one."

  *   **Concede:** The demos is not pre-existing.
  *   **Refuse:** That this makes action impossible. Recursion is enough.
  *   **Soft Spot:** This is very hand-wavy. If they press on *what* starts the recursion, you're stuck.
  *   **Tone:** Accept the critique, absorb it into the model.

  ### 6. The AI-Alignment Person (The "Formalism" Objection)
  **The Objection:** "Non-commutativity is a known issue in CEV. We handle it with vector spaces or uncertainty modeling. You're treating 'preferences' as too discrete. If we model the extrapolation as a continuous trajectory rather than five discrete steps, your order problem dissolves."

  **The Reply:**
  "Continuous trajectories still require a metric to define 'distance' between preferences. That metric *is* the order of operations. Choosing the geometry of the preference space is the same political choice as choosing the order of my five steps. You haven't removed the political judgment; you've just encoded it in the loss function. I want that judgment explicit, not hidden in the math."

  *   **Concede:** The math can smooth the steps.
  *   **Refuse:** That this removes the normative choices.
  *   **Soft Spot:** If they show a specific formalism that genuinely bypasses order dependence. (Unlikely, but possible).
  *   **Tone:** Technical but skeptical. "Math is politics by other means."

  ***

  ### Two Genuine Weaknesses (Prepare These Defenses)

  **1. The Regress Problem:**
  *   **The Hit:** "To choose the path of idealization, citizens must be informed and rational. Are *they* idealized? If yes, regress. If no, why trust *this* choice?"
  *   **The Defense:** "Thin idealization only. Sober, informed that the choice matters, plain language. We aren't asking them to solve the problem, just to pick the tool. We trust them to pick the hammer, even if they can't build the house. It's a procedural minimum, not an epistemic ceiling."

  **2. The Normative Ceiling (The "Veto" Problem):**
  *   **The Hit:** "What if they choose a path that extrapolates to authoritarianism? Do you have a veto?"
  *   **The Defense:** "Yes, a minimal rights constraint. The path choice is legitimate only if it preserves the capacity for future path choices. If a path eliminates the ability to reconsider (e.g., irreversible authoritarianism), it's inadmissible. But beyond that 'meta-rights' floor, I have to let them choose. Legitimacy requires the risk of error."

  ***

  ### The "Hope Nobody Asks" Question

  **Your Guess:** "What if they extrapolate to something atrocious?"
  **My Assessment:** You are right. This is the **"Weimar Problem."**
  **The Question:** "If the citizens choose an idealization path that validly extrapolates to a preference for ethnic cleansing, does your account legitimize it? If you say 'no,' you've reintroduced the external moral standard you claimed to eliminate. If you say 'yes,' your theory is morally bankrupt. Which is it?"

  **Why this is the killer:** It forces you to admit that your "bootstrap" rests on a hidden normative foundation (liberalism/human rights). If you admit that, the Rawlsians will say "So why not just start with Rawls?" If you deny it, the Critical Theorists and Ethicists will eat you alive.

  **Prepared Answer:** "I say 'no,' but not because of an external moral standard. It's inadmissible because it violates the *condition of the bootstrap*. A path that eliminates the capacity for future path-choice (by eliminating the 'others' who would choose) breaks the recursion. It's not morally wrong in my theory; it's *procedurally* invalid. It ends the game." (This is risky, but it's your best line).
