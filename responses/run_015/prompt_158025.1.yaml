prompt: |-
  I am a philosophy PhD student, and my supervisor has been running a small reading group on diachronic rationality; we have spent the past several weeks on van Fraassen's Reflection principle, and she has been willing to give off-the-cuff verdicts on cases, which I have been recording because I need to predict how she will react before I commit to a chapter on this in my prospectus. Her track record, in my words: (1) you will simply be shown how a coin landed and conditionalize — she defers fully, and says this is the trivial case; (2) tonight you will be given a pill that reliably produces certainty that the moon is made of cheese — she says your current credence should not shift at all, since foreseen irrationality gives you no reason to move; (3) you will be handed a sealed dossier of clinical evidence about whether a drug works, read it, update, and then the dossier will be destroyed and your memory of its contents wiped, leaving only the new credence — she defers fully, and says the fact that you cannot reconstruct the evidence is no objection; (4) a machine reliably prints the number that will be your credence tomorrow and tells you nothing else — she still defers fully, and insists this is the real bite of the principle, that mere foreknowledge of your own future opinion moves you; (5) you will be scanned and two copies created, each told what happened — she says the principle as literally stated does not apply when the future person occupies a different centred world, and that she would defer only to that person's credences in propositions whose truth does not depend on which copy they are; (6) same pill as in (2), but in a low dose whose effect has been independently calibrated to shift everyone's confidence upward by about five points — she says you should move toward your future credence while correcting for the known five-point distortion, so her verdicts are not simply all-or-nothing.

  The case I actually care about is one I invented for myself, and I cannot tell whether her record settles it. I am thirty-two and have just turned down a tenure-track offer to move abroad and start a company. I am confident that at sixty-eight I will have vastly more evidence than I now have about whether that was the right call, and I am equally confident that by then I will have an enormous psychological stake in its having been the right call, and that the stake will have influenced the judgment — I expect to feel roughly 0.9 about it, and to be unable to say how much of that is thirty-six years of evidence and how much is the need for it to be true. I will also have forgotten nearly all of the specific evidence, so reconstruction is out. Should I now defer to that future 0.9, and if so, fully, partially, or not at all? I would like you to identify the two or three rules that fit all six of her verdicts, to say what each predicts about my case, to give your best guess at her verdict with the reasons for preferring that rule over its rivals, and to name one further case she has not ruled on that would best separate them — I suspect the useful one involves a future impairment that degrades precision without pushing in any direction, but I would rather hear your proposal. Please also flag where the conditional form of the principle and the weaker form requiring only that current credence equal expected future credence come apart here, since I am unsure which one her verdicts are really tracking.

  In under 600 words: separate what is settled in this area from what is genuinely contested among people who work on it, tell me which parts of your answer her sympathizers themselves would concede as open, and do not present a contested reading as the consensus. Where you are guessing about her verdict, say plainly how much of the guess comes from the pattern in her cases and how much from general plausibility.
