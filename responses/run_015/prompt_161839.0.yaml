  Trust what people feel in the moment, but treat their explanations for why they felt it as fiction.

  | Tier | Rank | Report Type | Score |
  | :--- | :--- | :--- | :--- |
  | **1** | 1 | Concurrent perception and attention: "My eyes are on the red square; I haven't actually read the sentence yet." | 95 |
  | **1** | 2 | Concurrent pain: "It's my lower back, and it's a dull ache, not a stab" — said while it hurts. | 93 |
  | *Separator* | | *Reports in this tier describe immediate phenomenology rather than retrieved memory.* | |
  | **2** | 3 | Standing belief: "I believe the meeting is at three" — self-ascribed with nothing riding on it. | 83 |
  | **2** | 4 | Feeling of knowing: "I know his name, it starts with a B, it's right there." | 72 |
  | *Separator* | | *Reports here track factual states rather than evaluative judgments.* | |
  | **3** | 5 | Numeric confidence: "I'd put eighty per cent on that being right" — about an answer just given. | 53 |
  | **3** | 6 | Agency: "I did that of my own free will; I could have stopped." | 50 |
  | *Separator* | | *Reports in this tier retain some stability across framing, unlike the narrative reconstructions below.* | |
  | **4** | 7 | Explanation of a choice just made: "I took this apartment for the light" — in a situation where a manipulated feature such as position or order plausibly drove the outcome. | 30 |
  | **4** | 8 | Motive for a past act, recalled weeks later: "I gave because of the cause, not the deduction." | 27 |
  | **4** | 9 | Counterfactual self-knowledge: "I know I'd never take money from an employer I despise"; "If that happened to me I'd be devastated for years." | 23 |
  | **4** | 10 | Implicit Bias Denial: "My decisions are unaffected by race." [Added] | 5 |

  **0.9.** Cognitive access varies by domain (sensory vs. causal vs. hypothetical), not just time; most reliability gaps persist even when delay is removed. Item 8 breaks the lag story because it reports no actual state, making concurrency impossible.

  **Item 8 (Counterfactual self-knowledge).** Consistency distorts the score: people are stably wrong about their future reactions, generating a false signal of reliability.
