  Here is the decision tree you asked for, written as a continuous sequence of numbered nodes and routing instructions followed by the necessary caveats and my own assessment of the structure. We begin from the common ground that some sentences are true and some are not, that we are not proposing to stop using the word, and that our ordinary practice of calling things true is not massively mistaken. 1. Is truth a real feature of the world that sentences can possess or lack, or is it merely a label we apply without there being any actual property of truth at all? If you think there is no such property and that talk of truth is fundamentally mistaken or should be eliminated from serious theory, stop here at the Eliminativist leaf. If you think there is a property of truth, proceed to node 2. 2. Does this property have a substantial nature that explains why true sentences are true, such as a relationship between language and reality, or is the property thin enough that saying a sentence is true adds nothing substantial to simply asserting the sentence? If you think truth has a substantial nature that explains correctness, stop here at the Substantive Non-Deflationary leaf. If you think the property is thin and adds no substantial explanation, proceed to node 3. 3. Is the standard for whether a sentence is true the same across all areas of discourse, such as physics, ethics, and comedy, or does the standard vary depending on the subject matter? If you think the standard varies by subject matter, stop here at the Pluralist leaf. If you think the standard is uniform across all subjects, proceed to node 4. 4. Is whether a sentence is true constrained by what we can know or verify, such that a sentence cannot be true if we could never have evidence for it, or can a sentence be true even if we could never know it? If you think truth is constrained by our ability to know, stop here at the Epistemic leaf. If you think truth is not constrained by our ability to know, proceed to node 5. 5. Is the concept of truth basic and unanalyzable, meaning it cannot be explained in terms of other concepts like assertion or belief, or can it be analyzed in terms of how we use language? If you think it is basic and unanalyzable, stop here at the Primitivist leaf. If you think it can be analyzed in terms of language use, proceed to the cluster of functional cases starting at node 6. 6. Consider a well-formed declarative sentence produced by a system that has no beliefs, no understanding, and no assertoric commitments, such as a computer printout or a parrot's utterance. Can such a sentence be true or false in the same way a human assertion can, or does truth require a mind to hold it? If you think truth requires a mind, you should have branched to the Epistemic leaf at node 4, so return there. If you think such a sentence can be true independently of a mind, proceed to node 7. 7. Consider a community whose language has no truth predicate at all, though it has negation, quantification, and an ordinary practice of assertion. What, concretely, could such speakers not do that we can do, focusing on their practical and inferential capacities rather than theory? If you think they lack a specific grammatical tool to stand in for whole sentences, stop here at the Prosentential leaf. If you think they lack nothing substantial in practice, proceed to node 8. 8. Consider blind endorsement, where you endorse everything the Oracle says while knowing neither what it said nor how to enumerate it. Is the main purpose of the truth predicate to allow you to make this kind of general endorsement without listing every sentence? If you think this generalization is the primary function of the truth predicate, stop here at the Disquotational leaf. If you think this is only one function among others, proceed to node 9. 9. Consider a necessary truth, something from arithmetic or logic, where the biconditionals seem to say nothing at all about the world. Does the thin account explain why these sentences are true solely through logical rules, or does it leave something out? If you think the thin account fully explains this through logic and the property is merely a logical device, stop here at the Minimalist leaf. If you think it leaves something out, you likely belong at the Substantive Non-Deflationary leaf at node 2, so return there.

  Regarding the logical space mapped by this tree, there are unoccupied cells you should note. No one defends a view that combines the Eliminativist leaf with the Pluralist leaf, because if there is no truth property to speak of, there is nothing to be plural about. Similarly, the Primitivist leaf is rarely combined with the Epistemic leaf, because primitivists typically treat truth as a robust realist notion rather than one tied to knowledge. There are also flagged inseparable pairs you must acknowledge. The Minimalist leaf and the Disquotational leaf are often functionally identical in practice, distinguished mostly by whether one emphasizes the property status or the logical device status, and many philosophers move between them without changing their core commitments. The Prosentential leaf is also difficult to keep distinct from the Disquotational leaf without technical grammatical distinctions, and for a non-specialist group, these two may collapse into a single functional view despite the separate routing.

  In my own voice, I have high confidence in nodes 1 through 4 as genuine fault lines that separate major families of views without requiring technical jargon. Node 1 cleanly separates eliminativists from realists. Node 2 separates substantive theories from deflationary ones. Node 3 separates pluralists from monists. Node 4 separates anti-realists from realists. I have medium confidence in node 5, as primitivism is often a fallback position for those who reject analysis but accept substance, and it may overlap significantly with the Substantive Non-Deflationary leaf depending on how one defines analysis. I have low confidence in the separation achieved by nodes 6 through 9. While these four cases are where your argument stalled, using them to distinguish the Minimalist, Disquotational, and Prosentential leaves is precarious. These three views are often notationally different but functionally equivalent, and a clever undergraduate might reasonably answer the questions in node 7 and node 8 in ways that support both views simultaneously. I had to sharpen the distinction at node 7 to force a choice about grammatical tools versus practical capacities, and at node 8 to force a choice about generalization versus other functions, but in the literature these views often agree on these cases. I was extrapolating beyond views I can cleanly reconstruct at the undergraduate level for the Prosentential leaf, as that view relies on specific grammatical analogies that are hard to describe without technical terms. I would defend the taxonomy of the first five nodes against a specialist as a robust map of the metaphysical and epistemic landscape, but I would concede that the functional differentiation of the thin theories in nodes 6 through 9 is more pedagogical than ontological. Your framing of the metaphysical versus functional questions is largely correct, but the System case at node 6 is actually metaphysical rather than functional, testing mind-independence rather than predicate utility, which might confuse the routing if your friend insists it is purely about function. You should have asked for a case that tests the normative force of truth versus the descriptive force, as that might have better separated the functional roles without relying on grammatical distinctions that non-specialists find elusive.
