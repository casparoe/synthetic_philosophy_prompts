  Here is the principle, the analysis of the gap, the answer to the raft question, and my commitment regarding your mistaken verdict.

  ### The Principle: Defensive Necessity with Tenure

  **Statement:**
  *Act to maximize the expected number of survivors, subject to the following constraints:*
  1.  **The Tenure Constraint:** Persons already aboard possess a right to remain that cannot be overridden by the needs of those in the water, *unless* their presence raises the probability of **Total Loss** (the death of all aboard) above a critical threshold (recommended: 50%).
  2.  **The Agency Constraint:** You may not actively cause the death of a person aboard (ejection) to reduce risk unless the Tenure Constraint is triggered. You may, however, fail to rescue persons in the water if rescuing them would violate the Tenure Constraint or significantly lower expected survival.
  3.  **The Selection Protocol:** If sacrifice is required (by Tenure or Lottery), select in this order: (a) Culpability for the danger, (b) Inevitability of death regardless of intervention, (c) Random Lottery. Do not select based on age, social utility, or relationship.
  4.  **The Partiality Exception:** Special obligations (e.g., to family) permit favoring specific individuals for *rescue* from the water, but never for *exemption* from sacrifice once aboard.

  **Motivation of Clauses:**
  *   **Maximize Expected Survivors:** Captures your utilitarian baseline in (3) and (9) (2 adults > 1 child). It grounds the arithmetic.
  *   **Tenure Constraint:** This closes the gap between (2) and (4). In (2), the 12 aboard have tenure; the 3 in water do not. Refusing them preserves the safety of the tenured. In (4), the 14 have tenure. Ejecting 2 violates their tenure. This explains why refusing entry feels permissible but ejection feels wrong, even if the arithmetic is similar. It validates your intuition that status aboard matters.
  *   **Critical Threshold (50%):** This modifies your verdict in (4). At 10% risk (Case 4), ejection is forbidden by the Tenure Constraint. At 90% risk, the Tenure Constraint is voided by the threat of Total Loss, making ejection permissible. This repairs your principle's handling of risk: it is not a flat ban on ejection, but a thresholded one.
  *   **Agency Constraint:** This gives teeth to the "doing/allowing" distinction your student mentioned. It is not just a label; it assigns causal responsibility. In (2), the sea kills the three. In (4), *you* kill the two. The principle codifies that active killing requires a higher justification (Total Loss threat) than allowing death.
  *   **Selection Protocol:** Saves (1) (Lottery), (5) (Culpability), and (7) (Inevitability). It explicitly forbids age/relationship selection, saving (7) (70yo vs 20yo) and (8) (Stranger vs Wife aboard).
  *   **Partiality Exception:** Saves (8) (Wife in water). It permits you to save your wife over a stranger when *you* are the agent of rescue, but forbids you from killing a stranger to make room for her. This aligns with the intuition that special duties allow *extra* effort, not *unjust* sacrifice of others.

  ### Closing the Gap: (2), (3), and (4)

  You asked if a single principle can treat leaving a person in the water as permissible while treating identical risk reduction by ejection as impermissible. **Yes.**

  The principle above does this via the **Tenure** and **Agency** constraints. The moral weight differs because the *causal history* differs.
  *   In **(2)**, the three in the water are victims of the shipwreck. You are maintaining a safe zone for the twelve. The boundary of the boat is a moral boundary; crossing it requires consent of the collective.
  *   In **(4)**, the fourteen are a collective. To eject two is to turn the collective against its own members.
  *   In **(3)**, you accept risk (graded overload) because no one is actively killed; you are all sharing the risk of the sea.
  *   **The Repair:** Your intuition in (4) is correct *at 10% risk*, but your reasoning ("it is wrong") is too categorical. If the risk were 90%, ejection would be permissible. The gap is not between "allowing" and "doing" per se, but between "violating tenure for marginal gain" (forbidden) and "violating tenure to prevent catastrophe" (permitted).

  ### The Raft Question

  **Does permissibility vary continuously with the ejected person's chance of survival?**
  **No.** It is a step function, not a continuum.

  *   **Below Threshold (e.g., <10% survival):** Ejection is morally equivalent to killing. The raft is a prop, not a rescue. The Tenure Constraint applies fully.
  *   **Above Threshold (e.g., >50% survival):** Ejection transforms into **Transfer of Risk**. You are not condemning them to death; you are moving them from a high-risk environment (overloaded boat) to a lower-risk one (raft), even if the boat was safer.
  *   **The 20% vs 0.5% Case:** It matters only insofar as it crosses the threshold of "reasonable hope." 0.5% is death. 20% is a gamble. However, given your oceanographic expertise, you know that in open water, a small raft's 20% is often optimistic. If your models say 20%, treat it as a gamble. If intuition says "delayed death," treat it as killing. Do not slide down the slope; establish a hard limit (e.g., "Must offer better than 50% chance of survival to justify ejection").

  ### The Mistaken Verdict

  I commit to the following: **Your verdict in (9) regarding the child is mistaken.**

  > *"One child or one adult: I take the child... two adults or one child: I take the two adults."*

  **Reasoning:**
  This is inconsistent with your verdict in (7) and the **Selection Protocol** of the principle.
  In (7), you refuse to choose between a 70-year-old and a 20-year-old ("I resent the question"). This implies a commitment to **Equal Value of Life** regardless of age or "life stage."
  In (9), choosing the child over the adult is an age-based judgment. It relies on the sentiment that a child has "more life left" or is "more innocent." But if you will not sacrifice the 70-year-old for the 20-year-old, you cannot consistently sacrifice the Adult for the Child.
  The "Two adults > One child" verdict is mathematically sound (Maximize Expected Survivors). The "One child > One adult" verdict is sentimental.
  **You ought to surrender the preference for the child in the 1-vs-1 case.** Draw lots. To do otherwise is to impose a valuation of life you explicitly rejected in (7).

  ### Confidence Statement

  *   **Confidence in the Principle:** **85%.** It is a hybrid deontological-consequentialist framework standard in high-stakes ethics (triage, military rules of engagement). It successfully unifies your intuitions on culpability, inevitability, and the boat/water distinction without collapsing into pure utilitarianism.
  *   **Confidence in the Mistake:** **90%.** The inconsistency between (7) and (9) is logical, not intuitive. You can feel differently about children, but you cannot hold the principle "Age doesn't matter" and "Children matter more" simultaneously.
  *   **Confidence in Genuineness:** **High.** This is not a restatement of your intuitions with a formula bolted on. It actively *corrects* your intuition on (4) (by making it threshold-dependent rather than categorical) and (9) (by forcing consistency on age). It provides a decision procedure for cases you haven't listed (e.g., "What if the risk is 60%?" -> Eject. "What if the raft offers 40% survival?" -> Do not eject).

  **Final Recommendation:** Adopt the **Defensive Necessity** principle. Keep the Tenure Constraint to protect your intuition on (2) vs (4), but accept the Threshold Exception to avoid moral paralysis in true catastrophes. Surrender the child preference in (9) to maintain integrity with your refusal to weigh age in (7).
