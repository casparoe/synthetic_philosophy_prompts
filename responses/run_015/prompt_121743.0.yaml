  1.  **Analyze the User's Request:**
      *   **Topic:** The validity of the analogy between "national character" and "individual personality" (specifically using the Big Five model).
      *   **Tutor's Argument:** National character = average individual personality (like climate = average temperature). This justifies generalising about peoples in policy briefs. Also introduces "distributed cognitive style/hive mind" to justify treating census averages as mental states.
      *   **Task:** Audit the analogy. Provide a mapping table (genes, childhood, consistency, unitary self). Identify disanalogies (integrated psychology). Evaluate the "hive mind" patch.
      *   **Constraint 1:** Give a *committed take* (definite view, don't sit on the fence).
      *   **Constraint 2:** Answer in *British English*.
      *   **Constraint 3:** Provide reasons, not just a list of options.

  2.  **Deconstruct the Tutor's Analogy:**
      *   *Premise 1:* Personality traits (Big Five) are measurable in individuals.
      *   *Premise 2:* Aggregating these measures across a population yields a valid "national personality."
      *   *Premise 3:* This aggregate functions like an individual personality (predictive, explanatory).
      *   *Premise 4:* Therefore, generalising about "the Dutch" in policy is scientifically valid.
