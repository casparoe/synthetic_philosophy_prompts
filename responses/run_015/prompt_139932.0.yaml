answer: |-
  Here's the case, straight up for the pub table.

  Take a petrol pressure washer in the garage with a low-oil safety sensor and a nozzle clogged with limescale; its disposition is to spray water at high pressure if you pull the trigger. In the first test, you pull the trigger while the oil is critically low: the sensor detects the pressure drop, cuts the engine instantly, and no water comes out because the machine has shut itself down—the act of testing destroyed the disposition to spray. In the second test, you top up the oil and pull the trigger again: the engine runs and the pump pressurises internally, but no water comes out because the limescale is blocking the nozzle—the disposition to spray is still there, it's just prevented from showing. The difference isn't the machine, it's whether the test itself kills the power (fink) or something external stops the exit (mask).

  ***

  **The Breakdown**

  Here's what you tell Dave to make it stick. In the first route (the low-oil sensor), the disposition is "would spray if triggered." What happens is the trigger is pulled, but the safety mechanism kills the engine *before* the spray manifests. Afterwards, the object does *not* have the disposition anymore (it's dead in the water until reset). This follows from how the safety sensor genuinely works: it's designed to remove the ability to operate when stimulated. In the second route (the limescale), the disposition is the same. What happens is the trigger is pulled, the pump pressurises, but the water can't exit. Afterwards, the object *still* has the disposition (if you cleared the scale, it would spray immediately). This follows from the physics of pressure: the energy is built up inside, just trapped.

  **The Real Work**
  The bit doing the real work is the **safety sensor's feedback loop**. If you take that out (disable the sensor), the whole thing collapses back into a boring case where the machine either works or breaks permanently. The sensor makes it so the *stimulus* (pulling the trigger) causes the *loss* of the power required to manifest. That's the fink. Without it, you just have a broken machine.

  **Dave's Best Move**
  Dave's strongest counter isn't to deny the sensor exists, but to argue about **what counts as the object**. He'll say: "The *pump* is still disposed to spray; it's the *safety circuit* that's interfering. You're treating the safety switch as part of the pump's nature, but it's just an extra add-on like the limescale." He's trying to push the fink into the mask category by saying the intrinsic property (the pump's ability) remains, and only the extrinsic condition (the power supply) changed. His best move is to insist that dispositions belong to the *material* (the metal and plastic), not the *system* (the machine with its safety logic). If he wins that, he turns your fink into just another mask.

  **Your Trip Switch Example**
  Is your trip switch duff? No, it's actually the classic example philosophers use (called the "Electro-fink"). Dave is calling it a mask because he's focusing on the *wires* remaining live (intrinsic property), whereas you're focusing on the *socket's function* to shock (disposition). He's not wrong that the voltage is still there at the mains, but you're right that the *socket's disposition to shock you* vanishes the moment you touch it. It's a fink for the user, a mask for the electrician. It's a solid example, but the pressure washer is better for a pub argument because the "object" (the washer) clearly stops working entirely, whereas the socket still feels "live" to a tester.

  **The Reverse Fink**
  Can you get all three into the one case? Yes. On that same pressure washer, imagine a "deadman's switch" that disconnects the pump when idle. At rest, it has no disposition to spray (pump disconnected). Pulling the trigger *connects* the pump (gives it the disposition) and it sprays. This is a **reverse fink**.

  Is it a third kind? Not really. It's just a fink running backwards. A normal fink takes the disposition away *during* the test; a reverse fink gives it *during* the test.

  Who does it trouble? It causes major trouble for **Dave's view** (the Conditional Analysis). Dave says "If it's disposed, then if you test it, it manifests." But in a reverse fink, the "If you test it, it manifests" part is true, yet the object *didn't* have the disposition *before* you tested it. The conditional is true, but the disposition wasn't there to start with. It troubles the "structure underneath" view less, because you can say the *structure* allowed the connection to happen, so the capacity was there all along, just inactive. So yes, your idea is real, it fits the case, and it hits Dave harder than it hits you.
