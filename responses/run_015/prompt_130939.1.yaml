      *   *Atheists:* Think it's predestination smuggling. Need to emphasize *God's non-authorship* of CCFs.
      *   *General:* 75 mins is tight. No whiteboard means visuals must be simple (handouts or paper passing, but mostly verbal structure).

  3.  **Step 1: The Dependency Structure (The "Why Two Won't Do" Argument):**
      *   Molinism isn't just "God knows stuff." It's a solution to a specific tension.
      *   *Prerequisite 1: Libertarian Freedom.* If compatibilism is true, Molinism collapses into Calvinism. This must be established first.
      *   *Prerequisite 2: Divine Sovereignty/Providence.* If God doesn't control outcomes, Molinism is unnecessary (Open Theism suffices).
      *   *Prerequisite 3: The Gap.* Natural Knowledge (Necessary truths) -> Free Knowledge (Contingent truths *after* decree) leaves a hole. What about contingent truths *before* the decree?
      *   *Order:* Freedom -> Sovereignty -> The Gap -> Middle Knowledge.

