      *(Refining the Verdict)*: The prompt asks if the vocabulary is missing an ingredient OR if the distinctions are doing less work. The answer is likely: The distinctions are doing *different* work. They map to mechanistic phenomena, but the *normative* weight is lost. I should argue that the "residue" is the *alignment problem itself* (specifying the objective), not a missing measurement tool.

  8.  **Final Polish:** Check against constraints.
