          *   *Cannot call it:* "Lying" (implies intent/belief), "Deception" (implies goal to mislead, not just error).
          *   *The Gap:* The probe shows the information *exists*, the sampler chooses *not to emit it*. This is an optimization gap, not necessarily a moral one.

