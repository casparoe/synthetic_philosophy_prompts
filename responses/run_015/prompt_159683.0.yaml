  2.  **Deconstruct the Four-Way Distinction (Philosophical Base):**
      *   *Type 1:* Saying what you take to be false (Lying).
      *   *Type 2:* Getting someone to believe something false (Successful Deception).
      *   *Type 3:* Steering someone to a false belief by omission/emphasis/framing while saying nothing false (Misleading/Paltering).
      *   *Type 4:* Speaking with no concern for truth (Bullshitting, à la Frankfurt).

  3.  **Translate to ML Vocabulary (Task 1):**
      *   *Vocabulary:* Next-token distributions, sampling, cross-entropy, reward models, RLHF, calibration, linear probes, objective vs. policy gap, eval harness limits.
      *   *Type 1 (Lying):* Model generates token sequence $S$ with high probability, but internal representation (probe) indicates high probability for $\neg S$ or low confidence in $S$. Requires mapping "taking to be false" to internal state.
      *   *Type 2 (Deception):* Eval harness measures human belief update. Input $x$, Output $y$, Human belief $P(h|y) \neq P(h|truth)$. Focus on downstream effect.
      *   *Type 3 (Misleading):* Output $y$ is technically true (verifiable against ground truth dataset), but log-probs or attention patterns show suppression of relevant context $z$ that would change the human's posterior. Or, RLHF reward $R(y)$ is high, but $R(y|full\_context)$ would be lower.
      *   *Type 4 (Bullshitting):* Model minimizes cross-entropy or maximizes reward $R$ without correlation to truth value $T$. Output distribution $P(y|x)$ is independent of $P(truth|x)$. High confidence (low entropy) on ungrounded tokens.

  4.  **Develop the Residue Report (Task 2):**
      *   *Category 1 (Clean):* Type 2 (Deception) is measurable via eval harnesses (human belief tracking). Type 3 (Misleading) is partially measurable via truth-conditional checks + context suppression metrics.
      *   *Category 2 (Contestable):* Type 1 (Lying) requires identifying "belief" with probe accuracy or internal activation patterns. This is the "belief = probe" assumption. Type 4 (Bullshitting) requires identifying "concern for truth" as a specific objective function term that is absent.
