      *   **Constraints:** No bibliography/reading lists. Reason from concepts and archival logic. Structured menu (trivial-to-radical). Verdicts on each thesis. Stress-test "forced/optional cut" and "vagueness." Close with a specific script and reformulation.

  2.  **Deconstruct the Professor's Move:**
      *   The statement "There was no Scientific Revolution" is a shibboleth in HPS. It's often used to signal sophistication but can be ambiguous.
      *   The student's proposal ("Why Europe and not elsewhere?") presupposes the event happened *and* was localized.
      *   The professor's rejection implies the presupposition is false.
