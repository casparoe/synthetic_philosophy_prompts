  3.  **Evaluate the User's Typology (i-ix):**
      *   (i) Boundaries: Trivial. Doesn't kill the project.
      *   (ii) Gradualism: Substantive. If change was continuous, "revolution" is misleading, but the *change* is still there. Might force relabeling, not rejection.
      *   (iii) Self-understanding: Substantive. But periods are often retrospective. Doesn't necessarily kill the causal question.
      *   (iv) Wrong Object (Social/Technical vs. "Science"): Strong. If "science" didn't exist as a category, asking why *it* happened is category error.
      *   (v) Export Failure (Domain specific): Weakens the unity of the period. Suggests fragmentation, not non-existence.
      *   (vi) Causal Inertness: Philosophical killer. If the label does no explanatory work, it's eliminable.
      *   (vii) Retrojection (Progress narrative): Ideological. Suggests the period is a myth of modernity.
      *   (viii) Full Eliminativism: Radical. Nothing happened. Historically false.
