      *   **Conclusion:** Summary for the physicist. Pearl offers a better *calculus*, Lewis offers a deeper (but messier) *metaphysics*. The "Default" is a boundary condition problem, like choosing a gauge or reference frame, but with ethical baggage.

  6.  **Refining the Physics Analogy:**
