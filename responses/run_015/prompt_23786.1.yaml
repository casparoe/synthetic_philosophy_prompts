answer: |-
  It is a pleasure to correspond with someone who recognizes that philosophy often lacks the "clean formalism" of physics. You have put your finger on the exact tension that animates contemporary metaphysics of causation. In physics, you have a Lagrangian or a Hamiltonian; the dynamics follow. In causation, we are trying to reconstruct the dynamics from the trajectory, without agreeing on the underlying field equations.

  Your intuition is correct: Lewis and Pearl look similar because both are trying to formalize dependence, but they diverge sharply in how they handle the "boundary conditions" of a causal model—specifically, the problem of the **default state**.

  Here is the breakdown of how they handle your two cases, followed by an analysis of the "default" problem that is bothering you.

  ### 1. The Frameworks: A Brief Translation

  **David Lewis (Counterfactuals):**
  Lewis treats causation as a relation between events across **possible worlds**. $C$ causes $E$ iff $E$ counterfactually depends on $C$: if $C$ had not occurred, $E$ would not have occurred.
  *   **The Formalism:** A similarity metric on the space of possible worlds. To evaluate "If $C$ had not occurred...", we look for the "closest" possible world where $\neg C$ is true.
  *   **The Omission:** An omission is a "negative event" (the non-occurrence of an action).
  *   **The Weakness:** The similarity metric is not derived from the theory; it is stipulated.

  **Judea Pearl (Structural Causal Models - SCMs):**
  Pearl treats causation as a system of **structural equations**. $Y := f(X, U)$, where $U$ is exogenous noise.
  *   **The Formalism:** Directed Acyclic Graphs (DAGs) and the $do$-operator. $P(Y | do(X=x))$ represents an intervention that sets $X$ to $x$, breaking incoming arrows to $X$.
  *   **The Omission:** A variable taking a specific value (e.g., $Water = 0$).
  *   **The Weakness:** To define *Actual Causation* (token causation, i.e., "Did *this* omission cause *that* death?"), Pearl (with Halpern) requires distinguishing "default" vs. "deviant" variable values. This is not in the equations themselves.

  ---

  ### 2. Case 1: Preemptive Omission (The Plant)

  **The Scenario:** Agent A fails to water. Agent B (backup) waters. Plant lives.
  **The Intuition:** A is responsible (breach of duty), but A's omission did not change the outcome (Plant lives either way).

  **Lewis's Account:**
  Lewis runs into a wall here.
  1.  **Counterfactual Dependence:** Did the plant's survival depend on A's watering? No. If A had watered, Plant Lives. If A didn't water, Plant Lives (because of B). There is no counterfactual dependence of the *outcome* on A's action.
  2.  **Quasi-Dependence:** Lewis tried to fix preemption (e.g., two assassins, one shoots, one holds back) by invoking "quasi-dependence" (intrinsic causal chains). But with omissions, the "chain" is the absence of an event.
  3.  **Result:** Lewis struggles to call A's omission a *cause* of the plant's survival. He might argue A is a cause of the *process* involving B, but strictly speaking, the counterfactual test fails for the final outcome. Lewis often had to retreat to saying causation is not *just* counterfactual dependence, but this weakened his reductive project.

  **Pearl's Account:**
  SCMs handle this more gracefully by distinguishing *structure* from *outcome*.
  1.  **The Model:**
      *   $A$: A waters (0 or 1)
      *   $B$: B waters (0 or 1)
      *   $L$: Plant Lives (0 or 1)
      *   Equation: $B := \neg A$ (B waters if A doesn't). $L := A \lor B$.
  2.  **The Intervention:** If we intervene $do(A=1)$, then $B$ becomes 0, and $L$ is 1. If we observe $A=0$, then $B$ becomes 1, and $L$ is 1.
  3.  **Result:** While the outcome $L$ is invariant, the SCM reveals that $A$ is structurally relevant to $B$. Pearl's framework allows us to say A's omission caused *B's action*.
  4.  **Responsibility:** Pearl's model separates the *causal mechanism* from the *utility function*. We can hold A responsible not because A caused the survival, but because A's variable occupied a state that triggered a costly intervention from B. The SCM makes the dependency explicit, whereas Lewis hides it in world similarity.

  ---

  ### 3. Case 2: Tragedy of the Commons (Overdetermination)

  **The Scenario:** $N$ herders. Each adds 1 cow. Pasture ruined (threshold $T$). $N > T$. No single cow tips the scale.
  **The Intuition:** Each herder contributed to the ruin, even if no single one was necessary.

  **Lewis's Account:**
  This is the classic problem of **Overdetermination**.
  1.  **Counterfactual Dependence:** If Herder 1 removes their cow, the pasture is still ruined (since $N-1 > T$).
  2.  **Result:** Strictly speaking, for Lewis, Herder 1 is *not* a cause of the ruin. The effect does not depend on the cause.
  3.  **The Fix:** Lewis suggested that causation might be a "ancestral" relation (part of a chain), but in symmetric overdetermination, there is no chain. Lewis essentially had to concede that our intuition that Herder 1 is a cause might be wrong, or that causation is not strictly counterfactual dependence. This is a major bullet to bite.

  **Pearl's Account (Halpern-Pearl Definition):**
  The definition of *Actual Causation* in SCMs (Halpern & Pearl, 2005) handles this via **contingencies**.
  1.  **The Logic:** To check if $X=x$ is a cause of $Y=y$, we check if there is a *contingency* (a setting of other variables) such that if we hold those fixed, $X$ *does* make a difference.
  2.  **Application:** We ask: "Is Herder 1 a cause?" We construct a contingency where we hold Herders $2 \dots N$ fixed at "No Cow." In *that* world, Herder 1 *does* tip the scale.
  3.  **Result:** Because there exists a valid contingency where Herder 1 matters, Herder 1 counts as an actual cause in the real world.
  4.  **Advantage:** Pearl captures the intuition of "contributory causation" without abandoning the counterfactual logic, by allowing us to test dependence in *nearby* structural configurations.

  ---

  ### 4. The Core Problem: The "Default" State

  This is where your physicist's eye is sharpest. You asked: *Is the default statistical, normative, or something else? Does Pearl solve this?*

  **Lewis: The Default is Hidden in the Metric**
  For Lewis, to evaluate "If A had not omitted...", we need the closest world where A acts. How do we measure "closeness"?
  *   We prioritize worlds where laws of nature are not violated.
  *   We prioritize worlds where particular facts match the actual world *as much as possible*.
  *   **The Leak:** Which facts do we hold fixed? We naturally hold fixed the "normal" course of events. If A is a gardener, the "normal" world is one where he waters. If A is a passerby, the "normal" world is one where he doesn't.
  *   **Verdict:** Lewis's similarity metric implicitly smuggles in **normative expectations**. It is not principled within the logic; it relies on the interpreter's sense of what is "standard." It is like choosing a gauge without a gauge-fixing condition.

  **Pearl: The Default is Explicit but Arbitrary**
  In raw SCMs, variables are just variables. But to define *Actual Causation* (to distinguish an omission from a non-event), Halpern and Pearl introduced the distinction between **default** and **deviant** values.
  *   $X=0$ might be the default (no action). $X=1$ is deviant (action).
  *   An omission is causally relevant only if the variable deviates from its default.
  *   **The Leak:** Where do these defaults come from? The math doesn't say. The modeler must assign them.
      *   If I model the Gardener, $Water=1$ might be the default (duty).
      *   If I model the Passerby, $Water=0$ is the default (no duty).
  *   **Verdict:** Pearl does not solve the metaphysical problem; he **operationalizes** it. He pushes the problem from the "similarity of worlds" (Lewis) to the "construction of the model" (Pearl).
  *   **Statistical vs. Normative:** In practice, SCM modelers often use statistical normality for defaults. But as you noted, causation by omission is often normative. (e.g., A doctor omitting treatment is a cause of death; a stranger omitting treatment is not). To capture this in Pearl's framework, you must *build the norm into the variable definition*.

  **Does Pearl have a better answer?**
  Yes, in the sense that he makes the arbitrariness **visible**.
  *   In Lewis, the norm is hidden in the "closeness" metric, making it look like a discovery of fact.
  *   In Pearl, the norm is a **boundary condition** chosen by the modeler. It is analogous to setting the zero-point of potential energy. The physics (the causal relations) doesn't tell you where zero is; you must choose it to solve the problem. Pearl admits that "Actual Causation" is relative to a model, and the model includes normative choices.

  ### 5. Do they agree on what counts as an Omission?

  **Lewis:**
  An omission is the non-occurrence of an event that *might have occurred*. But since anything might have occurred in some possible world, Lewis struggles to limit which omissions count. (Did my failure to fly to Mars and stop a war cause the war?) Lewis relies on "quasi-dependence" and context to prune these, which again relies on implicit norms.

  **Pearl:**
  An omission is simply a variable taking a value that is designated as the "null" or "default" state, *in a context where a deviation was possible*.
  *   Pearl is better here because the model structure limits the possibilities. If there is no variable for "Flying to Mars" in the SCM, that omission cannot be a cause.
  *   However, deciding *which variables to include* in the model is the new locus of the problem. This is the **frame problem**.

  ### Summary for a Physicist

  You are correct to feel that both accounts lack a "first principles" derivation of the default state.

  1.  **Lewis** is like a variational principle where the action functional includes a hidden weighting term for "normality." It looks elegant but the weighting function is undefined.
  2.  **Pearl** is like a circuit diagram. It tells you exactly how the signal propagates. But to decide if a "lack of signal" is a fault, you need to know the **ground state**. Pearl admits the ground state is a modeling choice, not a derived quantity.

  **The Divergence:**
  *   **Lewis** tries to be a **Realist**: He wants causation to be a feature of the world (the web of counterfactuals). The "default" problem threatens to show that causation is partly in the eye of the beholder.
  *   **Pearl** is an **Instrumentalist**: He views causation as a tool for reasoning and intervention. The "default" is a parameter you tune to make the model useful for the specific inquiry (legal, moral, or physical).

  **Conclusion:**
  Pearl's account is superior for your purposes because it isolates the "default" problem as a **modeling assumption** rather than a metaphysical mystery. It allows you to say: "Structurally, A's omission is identical to B's non-action. They differ only in the *assignment of the default value*, which is a normative boundary condition we impose."

  Lewis tries to derive the norm from the world; Pearl asks you to declare it before you calculate. For a physicist, Pearl's approach should feel more honest: it treats the normative default like a choice of reference frame—necessary for calculation, but not intrinsic to the manifold.
