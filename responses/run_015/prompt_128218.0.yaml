answer: |-
  Your observation identifies a precise and troubling mechanism in technological governance that sits at the intersection of economics, sociology, and safety science. While there is no single universally canonical term that captures this exact three-stage cycle in the way a concept like supply and demand functions, the phenomenon is well-recognized under a cluster of related ideas. The closest established academic label is regulatory ritualism, derived from the sociological work of Robert Merton, which describes a scenario where adherence to the rules becomes an end in itself, displacing the original goal those rules were intended to achieve. In organizational theory, this is often discussed as ceremonial conformity or decoupling, where organizations separate their formal structures, such as compliance policies, from their actual work practices to maintain legitimacy without incurring efficiency costs. In industry parlance, particularly within aviation and security, this is frequently called safety theater. However, none of these terms alone captures the specific economic dynamic you described, which is the restoration of competitive parity through the standardization of ineffective safeguards. To understand this dynamic precisely, it is best viewed as a specific instantiation of Goodhart's Law applied to regulatory policy, where the measure of safety becomes the target of regulation and thereby ceases to be a measure of actual safety, driven by market pressure to minimize the alignment tax.

  To distinguish this from ordinary regulatory capture, one must look at the intent and the mechanism of failure. Regulatory capture implies that the regulated industry has co-opted the regulator to write rules that actively benefit the industry at the expense of the public, often through lobbying or corruption. In the dynamic you described, the regulator may be acting in good faith and genuinely attempting to prevent recurrence, but is constrained by the verifiability of the safeguard. The failure is not necessarily that the industry wrote the rules, but that the regulator could only mandate the form of the safety measure because the substance was too complex, costly, or opaque to enforce. Capture suggests a conspiracy to lower standards, whereas this dynamic suggests a structural inability to mandate high standards without destroying the market, leading to a compromise that codifies the lowest common denominator of compliance. The industry does not need to capture the regulator if the regulator is forced by economic reality to accept a checklist that cannot be economically burdensome, as burdensome regulations would simply drive innovation offshore or stall the industry entirely.

  This dynamic also differs fundamentally from the alignment tax. The alignment tax refers to the performance penalty or resource cost incurred when building a system to be safe, aligned, or robust. It describes the input cost of doing things correctly. The phenomenon you identified is not the cost itself, but the market and regulatory response to that cost. It is the mechanism by which the alignment tax is socially and legally negated without actually solving the alignment problem. Where the alignment tax is the friction, this dynamic is the lubrication that allows the machine to run smoothly again by removing the friction while pretending it is still there. It is the evasion of the tax through semantic compliance rather than the payment of the tax. Similarly, this is distinct from a simple race to the bottom. A race to the bottom describes the competitive pressure that leads firms to lower standards to gain advantage, which corresponds to the first phase of your scenario where the competitor skips the protocol to ship first. However, a race to the bottom does not account for the post-crisis regulatory intervention. Your pattern includes the stabilization phase where the race is halted not by raising the floor to the level of the responsible actor, but by lowering the definition of safety to match the irresponsible actor. It is a race to the bottom followed by a regulatory plateau that institutionalizes the bottom.

  If we were to propose a precise definition for this specific dynamic, it might be termed competitive ritualization of safety. The boundary conditions that distinguish this from cases where regulation genuinely improves safety despite being watered down rely heavily on the concept of verifiability and the type of good being regulated. Safety in these contexts is often a credence good, meaning the customer cannot verify the quality even after consumption unless a catastrophic failure occurs. If a safeguard is easily verifiable, such as a physical guardrail on a machine, regulation can mandate the guardrail and effectively ensure safety. The dynamic you describe only emerges when the safeguard is process-based, opaque, or difficult to measure ex-ante, such as adversarial testing protocols or human review layers. The distinguishing boundary is whether the regulation mandates an outcome or a process. When regulation mandates an outcome, such as a maximum failure rate, firms must find genuine ways to achieve it. When regulation mandates a process, such as a two-week checklist or a documented human review, firms can optimize for the documentation rather than the outcome. Therefore, the concept applies specifically when regulatory constraints shift from outcome-based liability to process-based compliance in markets where the cost of genuine safety confers a competitive disadvantage.

  The crucial edge case to consider is when watered-down regulation still yields net positive safety outcomes. Sometimes a standardized checklist, while less effective than a bespoke deep-dive, is still better than no check at all. This distinguishes genuine incremental improvement from the ritualization you described. In your examples, the mandated solution actively fails to catch the specific failure mode that caused the crisis, implying a net zero or negative safety gain relative to the cost incurred. The dynamic is present only when the compliance mechanism creates a false sense of security that reduces the incentive for genuine safety investment. If the regulation raises the baseline safety even slightly without restoring full competitive parity to the unsafe actors, it is merely imperfect regulation. It becomes the specific dynamic you identified when the primary function of the regulation shifts from risk mitigation to market stabilization, effectively socializing the risk while privatizing the benefit of non-compliance. This occurs when the regulatory body prioritizes industry continuity over risk elimination, codifying a version of safety that is cheap enough to be universal but weak enough to be ignored in practice.

  Ultimately, the vocabulary you are looking for exists in fragments across different disciplines rather than as a single unified theory. Economists might describe it as a failure of signaling in a market for credence goods, sociologists would call it institutional decoupling, and safety engineers would call it safety theater. The unique contribution of your observation is linking these concepts into a causal chain driven by competitive pressure. You have identified that the market does not just punish safety; it punishes visible cost. When regulation intervenes, it seeks to remove the visible cost to restore market function. If the cost of safety is visible and the benefit is invisible until a crash, the equilibrium solution will always be to make the cost visible and cheap while keeping the benefit invisible and hypothetical. This is why the adversarial testing becomes a checklist and the human review becomes a form. The system optimizes for the appearance of safety because the appearance is what is regulated, while the reality of safety is what is priced out of the market. Recognizing this distinction is vital because it suggests that solving the problem requires changing what is measured and enforced, moving from process compliance to outcome liability, or finding ways to make the safety benefits visible and valuable to the market before the crash occurs.
