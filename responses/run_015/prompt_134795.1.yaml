  Hey — I'm TAing a second-year metaphysics reading group and I want to hand out a flowchart that sort people into a view about the special composition question without ever using the phrase "special composition question". Cases in, named position out.

  Build it from the logical space rather than from a list of names: ask the questions first, look at which answer-combinations are actually available, then drop the real views into the cells that are occupied. I want around seven or eight leaves, and these all have to show up somewhere: nothing composes; everything composes; only some things compose and there's a principled story about which (the "nothing composes unless the result is alive" sort of answer); only some things compose and it's just brute which ones; the statue and the clay are two things in the same place; the statue and the clay are one thing (with whatever repair job that takes — temporal parts, contingent identity, whatever); and the "really there's just one big object and it's the cosmos, and it's what's fundamental" view. There should also be a gate near the top for the "there's no determinate fact here, you're just using a different quantifier" answer. Related question: is that gate genuinely a different cell from the easy-ontology style answer — there really are statues and departments, the only question is which sentences follow from the sortal terms — or are those the same position in a cardigan? If they collapse, say so in the item where you'd have put them rather than giving them separate leaves.

  Every node has to be a question someone who's never opened a metaphysics book could answer cold, so no "do you accept unrestricted composition?", and each one has to work twice: once on a material case (the statue and the clay; a cat whose tail gets cut off; a flat-pack chair still in its box that never gets assembled) and once on a social one (a philosophy department that gets merged into a bigger department and then split back out two years later; a queue that turns into a crowd). Where a node would give different verdicts on the two kinds of case, say so in the item — half my group is doing social ontology and will walk out otherwise.

  Give me exactly five numbered items, one per branch node, each a sentence or two: the question, then where each answer sends you (another numbered node, or a named leaf plus its most awkward commitment in half a sentence). No intro, no sign-off, no reading suggestions — I'm pasting it straight into a handout that's already numbered 1 to 5. If a cell in the space turns out to be unoccupied, or two of your leaves can't be pried apart, squeeze that into the item where it shows up instead of adding a sixth item, and if you think you need a sixth node fold the extra question into an existing one.
