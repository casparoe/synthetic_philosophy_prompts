  1. When you ask whether a department or a statue exists, are you asking about a deep fact of reality, or just deciding how to use the word "exists"? If it's just word usage, you land on **Quantifier Variance/Easy Ontology** (these collapse: existence is trivial, no further metaphysical debate). If it's a deep fact, go to 2.

  2. When parts (like clay bits or staff members) come together, is there ever a new whole object created, or is there ever only just the parts arranged that way? If only parts, you land on **Nihilism** (awkward commitment: no departments or statues ever exist, only simples). If wholes are created, go to 3.

  3. Do *any* collection of parts make a whole (even a random scatter of clay or people), or only specific collections (like living organisms or officially merged departments)? This verdict must match for both material and social cases. If any collection, go to 4. If only specific collections, go to 5.

  4. For those who say any collection makes a whole: is the entire cosmos the only fundamental object, or are there many fundamental objects? If only the cosmos, you land on **Priority Monism** (awkward commitment: your chair exists but isn't fundamentally real). If many objects, you land on **Universalism** (split: **Two Things** if statue/clay are distinct, **One Thing** if identical/temporal parts).

  5. For those who say only specific collections make wholes: is there a principled story for which ones (e.g., life), or is it just a brute fact? This applies equally to cats and departments. If principled, you land on **Restrictivism** (split: **Two Things** if statue/clay distinct, **One Thing** if identical). If brute, you land on **Brute Restrictivism** (awkward commitment: no explanation for why some groups count as objects and others don't).
