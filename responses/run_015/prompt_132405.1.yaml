answer: |-
  **I. The Ledger**

  The Bureau of Continuity smelled of ozone and dried glue. Elara sat before the glass partition, her Sequential Ledger open to the current fiscal cycle. Her finger tracked the typed lines, each entry a brick in the wall of her legal weight. *08:00, Arrival. 12:30, Meal Provision. 17:00, Departure.* The ink was black, uniform, dense.

  Then, the break.

  Between Cycle 409 and 410, there was a whitespace. Three days in November were unaccounted for. No stamp, no signature, no biometric hash. As she stared at the blank lines, the heavy coat she wore felt suddenly loose around the shoulders. The pen in her hand seemed lighter, less anchored to the desk. This was the physics of the gap: without the narrative bridge, her mass began to dissipate. Property titles, lease agreements, voting rights—these were not attached to her body, but to the continuity of the story binding her days together. If the story broke, the assets drifted away like unmoored balloons.

  She touched the paper. The void was clean. It did not look like an error; it looked like a possibility.

  **II. The Archive**

  "Verification requires corroboration," the Clerk said. He did not look up from his own ledger. He was a man of high continuity; his skin seemed tight against his bone, his voice heavy with the gravity of a thousand unbroken days.

  "I need to see the Master Record," Elara said. "To fill the gap, I need to know what happened."

  The Clerk hesitated, then buzzed the side door. He led her into the back room, a space devoid of windows. Rows of metal shelves stretched into the dark. He pulled a box labeled *Elara, V. – Master Index*.

  She expected a tape, a disk, a singular truth. Instead, the box contained loose slips of paper, some yellowed, some bright white. She picked one up. *Subject observed at Market Square, Cycle 409.* She picked up another. *Subject absent, reported ill, Cycle 409.* A third slip read: *Biometric failure. Location unknown.*

  "There is no master," the Clerk said, his voice flat. "There are only the annotations we collect. The Center is not a place we store things. It is a shape you must hold for us."

  He took the box from her hands and placed it back on the shelf. The slips shifted, contradicting one another in the silence. "You can write whatever fits the sequence," he said. "As long as the ink dries before the audit."

  **III. The Pen**

  Elara sat alone at the desk again. The Ledger lay open. The whitespace waited.

  To write was to tighten the coat. She could invent a journey. *Cycle 409: Medical Leave. Cycle 410: Recovery.* The words would act as mortar. Her weight would return. The bank would recognize her signature. The door to her apartment would accept her key. She would be solid, heavy, and real.

  She dipped the pen. The ink pooled at the nib, dark and final.

  To leave it blank was to let the air in. She felt the lightness in her chest again, the strange freedom of having no location, no history, no obligation to be the same person who had sat here yesterday. She could be the woman who went to the market, or the woman who was ill, or neither. She could be the space between the lines.

  Elara hovered the pen over the paper. The tip touched the fiber, leaving a single, microscopic dot. It was not a word. It was not a bridge. It was merely a mark.

  She lifted the pen. She looked at the gap. She looked at the door. The ink on the nib began to crust, drying in the air, waiting for a hand that might not come.
