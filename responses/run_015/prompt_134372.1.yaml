answer: |-
  This is a sharp dissection. You are right to reject the lazy "tragedy of the commons" label. That framing implies a shared resource being depleted. Tax competition is not depleting a shared resource; it is a bidding war for a mobile asset where the currency is public revenue.

  Here is the run-through using your constraints, followed by the verdict.

  ### 1. Surplus Destruction vs. Surplus Transfer

  Your distinction is the critical hinge. In a canonical Moloch trap (e.g., arms races), resources are consumed to maintain status quo positioning. In tax competition, the revenue loss for the state is a gain for the capital owner.

  **Is it a trap or a distributional fight?**
  It is a trap *only if* the transfer results in net welfare loss or if the *mechanism* of transfer consumes resources.

  *   **The Transfer View:** If capital is perfectly mobile and taxes are lump-sum, lowering rates shifts surplus from public to private hands. If you believe the marginal utility of private capital allocation exceeds public allocation (the Leviathan view), this is not a trap; it is a correction.
  *   **The Destruction View:** This relies on your empirical question: **Real Investment vs. Profit Shifting.**
      *   *Real Investment:* If companies move factories to Ireland because the tax is lower, capital is being allocated based on tax arbitrage rather than productivity. This is deadweight loss (misallocation).
      *   *Profit Shifting:* If companies keep factories in Germany but book profits in Bermuda via IP licensing, the surplus is not just transferred; it is **burned** in the friction of avoidance (legal fees, shell company maintenance, complexity).

  **Verdict on this point:** Empirical literature (Tørsløv, Wier, Zucman 2023) suggests roughly 40% of multinational profits are shifted to tax havens. This is pure surplus destruction (compliance costs + distortion). Therefore, it qualifies as a Moloch trap, not merely a distributional fight. The "competing" itself creates friction costs that vanish into the legal-industrial complex.

  ### 2. Checking the Three Conditions

  You suspected Condition 2 holds cleanly, while 1 and 3 are messy. You are correct.

  *   **Condition 1: Equilibrium worse for nearly all players than feasible alternative.**
      *   *Status:* **Messy.**
      *   *Why:* This depends entirely on the "Leviathan" variable. For a country with high corruption/low state capacity, the "low tax equilibrium" might be superior because it starves a predatory state. For a high-capacity state, it starves public goods. Since "nearly all players" (countries) do not share the same utility function regarding state capacity, there is no Pareto-superior alternative agreed upon by all. Small states (Ireland, Singapore) genuinely benefit from the race; large states (France, US) lose. It is not a symmetric trap.
  *   **Condition 2: Unilateral defection is reliably rewarded.**
      *   *Status:* **Clean.**
      *   *Why:* Until the OECD floor, cutting rates reliably expanded the tax base (Laffer curve dynamics on mobile capital). The incentive to undercut was mathematically robust.
  *   **Condition 3: Selection mechanism removes refusers.**
      *   *Status:* **Messy.**
      *   *Why:* Countries do not go bankrupt in the short term. They face budget constraints, credit downgrades, or political turnover. This is a *penalty*, not a *selection*. Capital flees, but the polity remains. A true Moloch selection mechanism (like firms dying in a price war) is absent. States are too sticky to be selected out by tax competition alone.

  ### 3. The Leviathan Defense (Discipline on Government)

  **Can the Moloch framing live with this?**
  Yes, but it requires specifying the *goal function* of the trap.

  Moloch is not "evil"; Moloch is "coordination failure relative to a specific objective."
  *   If the objective is **Maximizing Global Public Goods**, tax competition is a Moloch trap (underfunding).
  *   If the objective is **Minimizing State Predation**, tax competition is a *feature*, not a bug. It forces states to compete for citizens' money like firms compete for customers (Tiebout competition).

  **The Framing Adjustment:**
  The Moloch analysis usually assumes the "players" are the states trying to preserve their revenue. But if you view the "players" as the *citizens* trying to constrain the state, the trap dissolves.
  However, the Moloch frame holds if we argue that **global public goods** (climate, pandemic response, financial stability) require revenue that individual states cannot raise if they are competing. In that specific domain, the Leviathan defense fails because the constraint prevents solving transnational externalities.

  **Does the framing have to assume it away?**
  No. A robust Moloch analysis must acknowledge that what looks like a trap from one coordinate system (State Revenue) looks like efficiency from another (Capital Allocation/State Constraint). The trap exists only if you value the capacity of the nation-state to act collectively.

  ### 4. The OECD Floor: Structural Fix or Relabelling?

  The 2021 Global Minimum Tax (Pillar Two) uses an **Income Inclusion Rule (IIR)**.
  *   *Mechanism:* If a subsidiary in Ireland pays 5%, the parent company's home country (e.g., US/France) collects the remaining 10% as a "top-up."
  *   *Incentive Flip:* This is a **structural fix**, not relabelling.
      *   *Before:* Ireland cuts to 5% -> Capital flows to Ireland -> Ireland wins, US loses.
      *   *After:* Ireland cuts to 5% -> Capital flows to Ireland -> US collects the top-up -> Ireland gets nothing extra, US gets full 15%.
      *   *Result:* Ireland loses the leverage to attract capital via tax cuts. Their rational move is to raise their own rate to 15% and keep the revenue themselves rather than letting the US collect it.

  **Why it works:** It aligns the incentive of the low-tax jurisdiction with the high-tax jurisdiction. It removes the "gain from defection."
  **The Weakness:** It relies on the large economies (US, EU, China) actually enforcing the top-up. If the US Congress repeals the provision (a real risk), the structure collapses.

  ### 5. Re-routing: Subsidies and Carve-outs

  **Is this an escape or a new costume?**
  It is the **same trap in a more expensive costume.**

  *   *Transparency:* Statutory rates are public. Subsidies are negotiated, opaque, and often retroactive.
  *   *Efficiency:* A low statutory rate applies to all firms (broad base). Subsidies pick winners (narrow base). This increases the distortionary cost of the competition.
  *   *Surplus Destruction:* Subsidy wars require administrative overhead to negotiate and monitor. They encourage lobbying (rent-seeking) rather than productivity.
  *   *Moloch Dynamic:* If Country A offers a 15% rate + R&D credit, and Country B offers 15% + Direct Cash Grant, the surplus is transferred to the firm, but the *process* of bidding (lobbying, uncertainty, political favoritism) burns more social capital than a simple rate cut.

  This is **Moloch evolving**. The constraint on *price* (tax rate) shifts the competition to *non-price terms* (subsidies), which are harder to coordinate on and more corrosive to institutional integrity.

  ### 6. Observable Metric (10 Years Out)

  Do not look at average statutory rates. They will stay at 15%.
  Do not look at total tax revenue. GDP growth confounds this.

  **The Metric:** **Variance in Effective Tax Rates (ETRs) for Multinational Enterprises (MNEs).**

  *   *Trap Active:* High variance. Some firms pay 5% (via subsidies/shifting), others pay 25%. Capital allocation is driven by tax arbitrage.
  *   *Trap Escaped:* Low variance. Most MNEs pay close to the 15% floor regardless of where profits are booked.
  *   *Specific Signal:* If the correlation between *where profits are reported* and *where real economic activity (payroll/assets) is located* increases, the trap is receding. If profits continue to cluster in zero-tax jurisdictions despite the floor, the avoidance industry has found a hole, and the trap remains.

  ### The Verdict

  **Verdict: Confirmed Trap, Partially Patched, High Risk of Mutation.**

  The tax competition episode is a valid Moloch case, but not because revenue is "lost." It is a trap because the **competition mechanism (profit shifting) destroys surplus via friction** and **prevents coordination on transnational public goods**.

  The OECD deal is a genuine **structural patch** that alters the payoff matrix (Condition 2) by removing the reward for undercutting. However, it does not solve Condition 1 (disagreement on state capacity) and fails Condition 3 (states still aren't selected out).

  Consequently, the pressure does not vanish; it re-routes. The trap mutates from a **Tax Rate War** (transparent, broad) to a **Subsidy War** (opaque, distortive). This is likely *more* Molochian because it increases the role of lobbying and rent-seeking in the competition.

  **Claims I Defend Hard:**
  1.  **The Incentive Flip:** The OECD Top-Up Tax structurally removes the benefit of undercutting for small jurisdictions. This is game-theoretically sound.
  2.  **Surplus Destruction:** Profit shifting consumes real resources (legal/compliance) and misallocates capital. This validates the "Trap" label over the "Transfer" label.
  3.  **Mutation Risk:** Capping rates inevitably shifts competition to subsidies, which are less efficient and more corruptible.

  **Claims I Fold On Immediately:**
  1.  **Normative Superiority of High Tax:** I do not defend the claim that higher tax revenue is *always* better. If a state is predatory, the Moloch trap is a liberation. The "trap" status depends on the quality of the state.
  2.  **Permanence of the OECD Deal:** This relies on US political consensus. If the US withdraws enforcement, the game reverts to the 2020 equilibrium instantly.
  3.  **Symmetry:** This is not a symmetric trap. Small states (Ireland) are net winners in the race; large states are losers. Calling it a "global trap" glosses over the fact that some players *want* the race.

  **Final Word:**
  The Moloch framing is not just rhetorical work here; it correctly identifies the incentive misalignment. But the "escape" is fragile. We have not slain the god; we have merely put a price floor on the sacrifice, and now we must watch to see if the bidders start offering blood instead of money.
