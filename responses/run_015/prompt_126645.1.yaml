  ### Specification: Normative Architecture for Political Legitimacy
  **Domain:** Liberal-Communitarian Synthesis
  **Subject:** Political Legitimacy & Jurisdictional Boundaries

  Below is the functional specification for a theory of political legitimacy capable of navigating the impasse between liberal neutrality and communitarian substantialism. This is not a literature review; it is a structural requirements document. If a theory cannot satisfy the **Non-Negotiable** constraints, it is categorially inadequate for this specific normative space. If it fails the **Camp Preferences**, it merely aligns with the opposing pole.

  ---

  ### Part I: Core Desiderata

  #### 1. The Pluralism Constraint (Non-Negotiable)
  *   **Principle:** The theory must justify coercive political authority despite the permanent existence of incompatible, reasonable comprehensive doctrines, without retreating into moral relativism.
  *   **Concrete Puzzle:** *The Religious Exemption Case.* A pharmacist refuses to dispense emergency contraception based on sincere theological conviction. The state mandates access. A relativist says "both are right." A hardline secularist says "religion is irrational." An adequate theory must explain why the state has the *authority* to mandate the dispensing (or not) without declaring the pharmacist's worldview objectively false, yet without surrendering the state's capacity to enforce public health norms.
  *   **Failure Mode:** Collapsing into "anything goes" (relativism) or "state knows best" (perfectionism).

  #### 2. The Situated Agency Constraint (Non-Negotiable)
  *   **Principle:** The theory must respect individual autonomy, but it cannot premise that autonomy on the existence of an "unencumbered self" capable of stepping outside all social commitments to choose ends.
  *   **Concrete Puzzle:** *The Cult Defector Case.* An individual raised in a high-control community wishes to leave but lacks the conceptual vocabulary or economic skills to function in the broader society because their identity was constitutively formed by the group. A liberal theory assumes they are free to leave; a communitarian theory says their loyalty is binding. An adequate theory must recognize the *capacity* for revision is real but socially scaffolded. Legitimacy requires the state to ensure the *conditions* for agency, not just the formal right of exit.
  *   **Failure Mode:** Treating agents as atomic units (liberal abstraction) or treating agents as mere vessels of tradition (communitarian determinism).

  #### 3. The Non-Aggregative Good Constraint (Non-Negotiable)
  *   **Principle:** The theory must account for public goods that are intrinsic to the political community and cannot be reduced to the sum of individual preferences or utility maximization.
  *   **Concrete Puzzle:** *The Civic Language Case.* A polity mandates a single official language for all government business and education, despite a minority group's preference for their heritage tongue. Utilitarianism calculates the cost/benefit of translation. A rights-based approach looks at discrimination. An adequate theory must articulate why a *shared linguistic medium* is a constitutive good of the polity itself (enabling deliberation), distinct from merely satisfying the majority's preference.
  *   **Failure Mode:** Reducing the "common good" to a spreadsheet of aggregated individual wants.

  #### 4. The Nested Community Constraint (Non-Negotiable / Niche)
  *   **Principle:** The theory must adjudicate conflicts between the constitutive practices of a sub-national community and the normative standards of the broader polity without defaulting to state neutrality or simple majoritarian supremacy.
  *   **Concrete Puzzle:** *The Family Law Arbitration Case.* A religious minority community seeks to use internal tribunals to settle divorce and custody disputes according to canon/sharia law, which assigns different evidentiary weight to men and women. The broader polity has a constitutional commitment to gender equality.
      *   *Liberal Punt:* "The state must remain neutral; let them arbitrate." (Ignores internal power imbalances).
      *   *Communitarian Punt:* "The national standard prevails; ban the tribunals." (Ignores the community's right to self-constitution).
      *   *Requirement:* The theory must provide a jurisdictional rule. Does the state override? Does it delegate? Does it co-govern?
  *   **Failure Mode:** Jurisdictional monism (only the state matters) or fragmentation (no state oversight).

  #### 5. The Obligation Grounding (Camp Preference: Liberal)
  *   **Principle:** Political obligation must be traceable, ultimately, to some form of consent or hypothetical agreement by individuals.
  *   **Concrete Puzzle:** *The Tax Resister.* Why does a citizen who disagrees with a specific war still owe taxes that fund it?
  *   **Status:** **Liberal Preference.** A communitarian would ground this in membership/role obligation, not consent. An adequate synthesis theory might need to move this to Non-Negotiable but redefine "consent."

  #### 6. The Cultural Continuity Grounding (Camp Preference: Communitarian)
  *   **Principle:** Political legitimacy is derived from the historical continuity and ethical substance of the community, not procedural correctness.
  *   **Concrete Puzzle:** *The Immigration Integration Case.* Why should new immigrants adopt the host country's holidays and symbols? A liberal says "only obey laws." A communitarian says "to sustain the ethical life of the nation."
  *   **Status:** **Communitarian Preference.** A liberal theory views this as optional assimilation; a communitarian views it as essential for legitimacy.

  ---

  ### Part II: The Antinomy Analysis (Joint Unsatisfiability)

  You hypothesized that requiring both **"Thick Shared Goods at the National Level"** (Desideratum 3) and **"Non-Interference with Sub-National Constitutive Practices"** (Desideratum 4) is jointly unsatisfiable.

  **Verdict:** You are **correct**, with one narrow philosophical escape hatch.

  #### The Contradiction
  If the National Good is *thick* (substantive, e.g., "Gender Equality is a constitutive value of our citizenship"), and the Sub-Group Practice is *constitutive* (e.g., "Gender-differentiated roles are essential to our religious identity"), a direct logical collision is inevitable.
  *   To enforce the National Good is to interfere with the Sub-Group Practice.
  *   To permit the Sub-Group Practice is to abandon the National Good.
  *   Neutrality is impossible because the *outcome* of the arbitration validates one conception of the good over the other.

  If a theory claims to satisfy both strictly, it is either:
  1.  **Deceptive:** It calls the national good "thick" but defines it so procedurally that it becomes thin (e.g., "Equality" just means "whatever the group decides," which voids the thick definition).
  2.  **Unstable:** It creates a system of legal pluralism that inevitably collapses when a hard case (like child marriage or corporal punishment) arises.

  #### The Only Escape Hatch: "Revisable Jurisdiction"
  The only way to hold these two desiderata without contradiction is to transform the nature of **Non-Interference**. It cannot mean "The State never intervenes." It must mean "The State intervenes only to protect the *internal revisability* of the sub-group."

  This requires modifying Desideratum 4 from *Non-Interference* to **Protected Exit + Joint Governance**.
  *   **Mechanism:** The state allows the sub-group to practice its norms *only if* it guarantees members meaningful exit rights (education, economic independence) and creates "joint governance" structures where sub-group members can appeal to state norms without leaving the community entirely.
  *   **The Cost:** This violates the *strong* Communitarian preference for group sovereignty (Desideratum 6). It treats the sub-group not as a sovereign entity, but as a voluntary association within the state.

  #### Conclusion on Spec Viability
  If you maintain the **strong** version of Desideratum 4 (absolute non-interference with internal constitution) and the **strong** version of Desideratum 3 (substantive national thick goods), the specification describes an **impossible object**.

  To make the theory viable, you must downgrade Desideratum 4. It must shift from:
  *   *Old:* "Sub-groups are sovereign over internal constitutive practices."
  *   *New:* "Sub-groups have jurisdictional autonomy conditional on maintaining the agency of their members."

  This satisfies the Liberal constraint on autonomy (Desideratum 2) and the National constraint on shared goods (Desideratum 3), but it will be rejected by strong Communitarians who view the group's right to self-preservation as trumping individual exit rights. **There is no stable equilibrium that fully satisfies the strong Communitarian, the strong Liberal, and the Nested Community Constraint simultaneously.** One must yield. In a modern pluralist state, the "Protected Exit" modification is the only path that avoids authoritarianism or fragmentation.
