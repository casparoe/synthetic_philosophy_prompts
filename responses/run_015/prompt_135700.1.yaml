      *   Also, the "Local Naturalness" issue suggests that *properties* might not be the right unit, but *classifications* are. However, the prompt asks for a theory of *properties* that can handle this. I need to frame it as "Context-Dependent Instantiation."

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (legal/operational necessity) and "Camp Insistence" (ontological preference) is sharp. The lawyers need stability; the ecologists need accuracy. The theory must bridge this.

  *(Self-Correction on the "Local Naturalness" answer)*: The prompt asks: "Is that a coherent thing to demand... or does it just show we've confused one joint-carving property with two?"
