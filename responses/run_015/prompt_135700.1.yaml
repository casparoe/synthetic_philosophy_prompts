  4.  **Address the "Local Naturalness" Problem:**
      *   This is the core philosophical puzzle. A property is "natural" (joint-carving) in Context A but "gerrymandered" in Context B.
      *   *Analysis:* Standard realism says properties are mind-independent. If it's gerrymandered in lowlands, it's not a real property there. But the *predicate* is the same.
      *   *Solution:* This suggests a pragmatic or functionalist view of properties, or a "contextualist realism." It likely conflicts with strict "Causal Efficacy" if the causal powers differ by region.
