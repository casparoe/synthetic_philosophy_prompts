answer: |-
  Here is the specification for a theory of universals suitable for statutory habitat classification. I have distilled your starting list into discrete requirements, categorized by operational necessity versus ontological preference, and addressed the specific problem of regional variability.

  ### The Specification

  | Requirement | The Case from Work | Status |
  | :--- | :--- | :--- |
  | **1. Multiple Realizability** | Two sites share a type (e.g., "Lowland Heath") despite having different soil pH, species mixes, or physical structures. The theory must explain unity without physical identity. | **Non-negotiable** |
  | **2. Predictive Reliability (not strict Causation)** | We designate to predict outcomes of drainage/grazing. "Unimproved" (absence of fertilizer) predicts succession, though absences do not physically *cause*. The theory must allow properties to ground counterfactuals without demanding physical force. | **Non-negotiable** |
  | **3. Collective Instantiation** | Categories like "viable population" or "connected stand" apply to the aggregate, not individual plants. The theory must account for properties instantiated by fusions or sets, not just particulars. | **Non-negotiable** |
  | **4. Hyperintensionality** | We must distinguish "Ancient Woodland" from "Long-Established Woodland" even if they currently cover the exact same sites. Co-extensional properties must remain distinct for legal history. | **Non-negotiable** |
  | **5. Negative & Disjunctive Admission** | "Unimproved" is defined by absence; "Heath or Grassland" is disjunctive. The theory cannot restrict properties to positive, atomic fundamentals. | **Non-negotiable** |
  | **6. Context-Sensitive Naturalness** | A type is "real" (joint-carving) in the uplands but "arbitrary" (gradient slice) in the lowlands, despite identical definitions. | **Non-negotiable** |
  | **7. Cross-Scheme Identity Conditions** | When aligning with neighboring countries, we must decide if their "Bog" and our "Mire" are one property or two. The theory needs criteria for property identity across conceptual schemes. | **Camp Insistence** (Ecologists want *one* reality; Lawyers want *two* legal definitions) |
  | **8. Hierarchy as Determinable/Determinate** | Is "Wetland" a genus containing "Bog" and "Fen," or a determinable made determinate by them? This affects whether losing a sub-type destroys the parent type. | **Camp Insistence** (Legal drafters prefer Genus/Species; Ecologists prefer Determinables) |
  | **9. Vagueness Location** | For the 40% cover cut-off: is the *property* vague (ontic) or is our *measurement* precise but the boundary arbitrary (semantic)? | **Camp Insistence** (Lawyers need semantic precision; Ecologists accept ontic vagueness) |

  **Cut from your list:** "Whether the top level is anything over and above the bottom ones." This is irrelevant to designation; as long as the inference rules hold, the ontology of the top level doesn't change legal outcomes.

  ---

  ### The "Local Naturalness" Problem

  You asked if a property can be joint-carving in one region and gerrymandered in another.

  **Verdict:** Yes, but only if the theory treats properties as **functional roles** or **relations to environment**, not as intrinsic microstructural bases.

  If your theory demands that a property be grounded in the same physical constituent everywhere (e.g., a specific plant chemistry), then "Lowland Heath" cannot be the same property in uplands and lowlands if the underlying ecological dynamics differ. You would have to admit you are confusing two properties.

  However, if the theory allows properties to be defined by their **causal/nomic role within a specific context** (e.g., "vegetation that responds to grazing in manner X"), then the *same* property can be natural in Context A (where the role is stable) and arbitrary in Context B (where the role dissolves into a gradient).

  **The Cost:** This sacrifices **Universality**. You cannot claim "Heathland" is a universal of nature *simpliciter*; it is a universal-relative-to-ecosystem-type. This complicates Cross-Scheme Identity (Requirement 7) because your neighbors might have different ecosystem contexts. It also puts pressure on Requirement 2 (Predictive Reliability), as the reliability becomes local, not global.

  ---

  ### Incompatible Requirements & Trade-offs

  **The Conflict:** **Requirement 5 (Negative Properties)** vs. **Requirement 2 (Predictive Reliability/Causal Work).**

  *   **Why:** Standard realist theories (Immanent/Platonic) argue that absences ("unimproved") are not properties and cannot do causal work. Only positive existents can cause. Yet your legal framework relies entirely on "unimproved" to trigger protection, and it *does* successfully predict ecological succession.
  *   **The Trade-off:** You must drop the demand for *physical* causation in favor of *informational* or *nomological* relevance. If you insist on strict causal powers (Camp Insistence from hard-nosed ecologists), you must invalidate "Unimproved" as a property, which breaks the statute.
  *   **My Advice:** Drop strict Causation. Keep Predictive Reliability. A theory that treats properties as "truth-makers for counterfactuals" handles absences better than a theory that treats them as "causal powers."

  **The Requirement That Rules Out the Most Contenders:**
  **Requirement 4 (Hyperintensionality) + Requirement 5 (Negative Properties).**
  Most simple theories fail here. Class Nominalism fails Hyperintensionality (if the extensions are the same, the class is the same). Strict Immanent Realism fails Negative Properties (there is no "universal of absence" in the things themselves).

  ---

  ### Theory Scorecard

  *   **Transcendent (Platonic):** Fails **Negative Properties** (no Form of Absence) and **Collective Instantiation** (hard to link Forms to aggregates). Good for stability, bad for ecology.
  *   **Immanent (Aristotelian):** Fails **Negative Properties** (universals must exist in particulars) and **Local Naturalness** (universals shouldn't change nature by location).
  *   **Trope Theory:** Excellent for **Collective Instantiation** and **Local Naturalness** (bundles of particularized properties), but struggles with **Cross-Scheme Identity** (hard to match tropes across borders).
  *   **Resemblance/Class Nominalism:** Excellent for **Multiple Realizability** and **Vagueness**, but fails **Hyperintensionality** (cannot distinguish co-extensive types) and **Predictive Reliability** (resemblance doesn't guarantee future behavior).
  *   **Ostrich (Deflationary):** Denies properties exist. Solves nothing. Fails **Non-negotiable** need to justify legal distinction to courts.

  **Recommendation:** A **Functional Role Theory** (a variant of Realism) best fits the spec. It treats "Heathland" not as a physical stuff, but as a stable node in a network of ecological relations. This accommodates absences (as missing relations), collective instantiation (as network structures), and local naturalness (as context-dependent stability). It costs you the idea that nature has one fixed set of joints; instead, the joints are relative to the scale and context of observation.
