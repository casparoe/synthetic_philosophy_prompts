answer: |-
  This is a sophisticated disagreement because it isn't really about eulogies; it's about the ontology of character and the teleology of narrative. You and your friend are arguing over what a human life *is* once it ends: is it a historical record to be archived, or a legacy to be bestowed?

  Here is the reconstruction of the practice, the philosophical work the norm is doing, the alternative your friend proposes, and finally, the specific vulnerabilities in my own analysis.

  ### 1. What the Eulogy Presupposes

  The practice of the eulogy rests on three specific philosophical commitments that differ from the commitments of biography or history.

  **A. Character is Relational, Not Intrinsic**
  Biography presupposes that character is an objective property of the deceased, like height or blood type, waiting to be measured. The eulogy presupposes that character is a *relational event* that happens between the dead and the living. When a speaker says, "He was generous," they are not making a forensic claim about the deceased's total psychological makeup; they are testifying to the *experience of being on the receiving end* of that life.
  *   **Implication:** Omitting the times he was stingy is not dishonesty; it is a statement that, *in relation to us*, the stinginess did not define the bond. The eulogy records the life *as it was lived with us*, not the life *as it was in itself*.

  **B. Death Converts "Becoming" into "Being"**
  While alive, a person is a verb (becoming, changing, struggling). Once dead, they become a noun (a legacy, a memory). The eulogy presupposes that the moment of death is the moment of narrative closure. To introduce the "bad parts" (the drunkenness, the temper) is to reopen the verb. It suggests the story isn't finished, that the verdict is still out.
  *   **Implication:** The praise norm is not just politeness; it is the ritual mechanism that seals the narrative. It performs the metaphysical work of turning a messy human into a stable ancestor.

  **C. Selection is Constitution**
  You argued that selection isn't lying. Your friend argues it is distortion. The eulogy presupposes a third option: **Selection is Constitution.** In a three-minute speech, you cannot list 50,000 days of a life. By selecting the "holiday shift" story, you are not hiding the "angry Tuesday" story; you are actively *building* the version of the person that will survive.
  *   **Implication:** The eulogy admits that the "real" person is gone and cannot be retrieved. All that remains is the construct. The moral duty of the speaker is to build the *best possible construct*, because that construct is now the only thing the grandchildren will ever know.

  ### 2. Is the Praise Norm Etiquette or Philosophy?

  The norm *de mortuis nil nisi bonum* (of the dead, nothing but good) is doing heavy philosophical lifting, but it has a breaking point.

  **Where it is Philosophical Work:**
  It operates on the theory of **Moral Motivation via Idealization.** You are correct: you do not learn to write by studying only bad sentences, but you also don't learn by studying sentences that don't exist. However, in moral development, humans require *aspirational targets*. If the exemplar is too messy ("He was kind, but also embezzled from his brother"), the cognitive load on the mourner increases. They have to parse which parts to imitate. Grief reduces cognitive capacity. The praise norm simplifies the moral data so it can be absorbed during a state of emotional vulnerability. It treats the deceased as a **totem** for the group's values, not a case study for their ethics seminar.

  **Where it is Mere Etiquette (and dangerous):**
  The norm collapses into empty etiquette when the gap between the eulogy and the common knowledge of the room becomes too wide. If everyone knows the deceased was abusive, and the eulogy calls him "gentle," the speech ceases to be a tribute and becomes a **gaslighting ritual**. At that point, it teaches the living that truth is subordinate to social comfort. This wrecks the teaching job. It teaches cynicism: *We all know what really happened, but we pretend otherwise.*

  **Verdict:** The praise norm is philosophical *until* it becomes demonstrably false to the community. It relies on a "wink of consensus." We agree to highlight the light, provided we all acknowledge the shadow existed. If the shadow is denied entirely, the light looks fake.

  ### 3. The Friend's Plutarchan Eulogy

  Your friend is grading the eulogy as a *Life*, but the eulogy is a *Rite*. However, if we built a eulogy strictly on his theory (Plutarchan honesty + Moral Instruction), it would look distinctly different. It would not be a hagiography; it would be a **Tragic Heroism**.

  **What it would look like:**
  *   **Structure:** It would still use anecdotes, but the anecdotes would contain tension. "She was fiercely loyal, which meant she protected her children, but it also meant she never forgave her sister for a slight in 1994."
  *   **The Lesson:** The moral instruction would shift from *Imitation* ("Be like him") to *Integration* ("Accept that greatness costs something"). The lesson becomes: *Virtue is not pure. If you want his courage, you must accept his recklessness.*
  *   **The Tone:** Somber, complex, perhaps even uncomfortable. It would treat the mourners as adults capable of holding contradictory truths.
  *   **The Risk:** It turns the funeral from a space of *rest* into a space of *work*. It demands the mourners do ethical calculus while grieving.

  **Why we don't do this:**
  Because the primary function of a funeral is not education; it is **community stabilization**. A Plutarchan eulogy risks fracturing the room. Half the room might nod at the "recklessness"; the other half (the sister) might be enraged. The standard eulogy prioritizes the cohesion of the living over the accuracy of the dead.

  ### 4. Resolving the Inconsistency (Eulogy vs. Cancel Culture)

  You noted the culture speaks nothing but good at the funeral, then tears the person apart in a biography ten years later. This isn't inconsistency; it is **Sphere Segregation**.

  *   **The Eulogy (Private/Communal Sphere):** Governed by *Love*. The unit of measure is the bond. The goal is healing.
  *   **The Biography/Cancel Culture (Public/Historical Sphere):** Governed by *Justice* or *Truth*. The unit of measure is impact. The goal is accountability or record.

  We allow this because we acknowledge that a human being is too large to be held in one narrative. We need the "Loved One" to grieve, and we need the "Historical Actor" to learn. The friction comes when the Public Sphere invades the Private (e.g., demanding a eulogy address allegations) or vice versa. Your friend is trying to import the standards of the Public Sphere (historical accuracy) into the Private Sphere (ritual grief).

  ### 5. Where My Answer is Weakest (The Steel-Man Against Me)

  You asked for the soft spots. Here are the two places where my reconstruction is most vulnerable to your friend's critique.

  **A. The "Cynicism Problem"**
  My argument relies on the assumption that the audience accepts the "Relational Truth." I argue that omitting flaws is acceptable because we are describing the *relationship*.
  *   **The Counter-Argument:** If the omissions are too obvious, the audience doesn't feel "comforted"; they feel "managed." If the eulogy describes a saint, and the deceased was a known tyrant, the eulogy doesn't create a noble legacy; it creates a collective lie. In this scenario, the practice doesn't teach "aspirational values"; it teaches **hypocrisy**.
  *   **What would change my mind:** If sociological data showed that communities who practice "honest eulogies" (acknowledging flaws) report *higher* long-term resolution of grief and *stronger* moral cohesion than those who practice "hagiography," then the praise norm is merely etiquette that hinders growth. If honesty heals better than comfort, my defense of the norm collapses.

  **B. The "Dead Can't Defend Themselves" Constraint**
  I argued that character is relational. But there is a justice component to reputation.
  *   **The Counter-Argument:** By sanitizing the record at the moment of maximum attention (the funeral), we permanently skew the historical record. The "Legacy" becomes the only truth that survives. If the deceased was a abuser, and the eulogy calls him "stern but loving," we have actively harmed the victims by using the ritual to silence them.
  *   **What would change my mind:** If you can demonstrate that the "Praise Norm" systematically protects abusers and silences victims more often than it protects the dignity of the grieving. If the cost of the norm is the erasure of harm, then the "Philosophical Work" I attributed to it is actually **moral corruption**.

  ### Summary for Friday
  Tell your friend this: He is right that the eulogy is not a *Life* in the Plutarchan sense. It is a *Monument*. A monument does not list the architect's failures; it commemorates the building.
  *   **Your strength:** You understand the *telos* (goal) of the speech is communal cohesion and moral aspiration, not historical record.
  *   **His strength:** He understands that if the monument is too divorced from the stone it's made of, it becomes a sham.
  *   **The Synthesis:** The eulogy is a **necessary fiction**. It is not a lie, but it is a *curated truth*. It fails only when the curation becomes denial. The practice presupposes that the dead belong to the living now, and the living need a version of the dead they can carry without being crushed.

  **The specific question to ask him:** "Plutarch wrote for students of politics who needed to know how power corrupts. A eulogy is for mourners who need to know how love survives. If you force the Plutarchan method on a funeral, are you serving the dead, or are you serving your own intellectual commitment to truth at the expense of the room's grief?"
