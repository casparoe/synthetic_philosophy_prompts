answer: |-
  You are asking how the architecture of a story enforces an ethics of attention. This is not merely a question of what a novel *says*, but of what its form *does* to the reader's capacity to weigh pain. The moral puzzle you describe—the aggregation problem—relies on arithmetic, but narrative relies on resonance. When we translate the calculus of harm into the physics of prose, the numbers break, and we are left with the texture of consciousness.

  Here is how the three principal moral stances translate into the craft decisions governing your two passages: the woman in the cell (intense, singular suffering) and the commuters at the turnstile (trivial, aggregate suffering).

  ### I. The Craft of Straightforward Summation (Utilitarianism)
  **The Moral Claim:** The total volume of disutility determines the rightness of the act. 300 million $\times$ 3 seconds > 1 person $\times$ 3 hours.
  **The Craft Imperative:** Make the multitude feel heavy enough to crush the individual.

  *   **Duration and Time:** To make the summation work, you cannot render the commuters' three seconds as trivial. You must use **compression to create mass**. The paragraph describing the turnstiles must move with a terrifying, mechanical velocity, but the *cumulative* effect must feel like a slow, crushing weight. You might use a rhythmic repetition—a syntactic turnstile—that accumulates fatigue in the reader. The three hours of the woman's interrogation, conversely, must be rendered with a degree of **compression** that renders them manageable, perhaps by fragmenting her experience into data points that can be compared to the crowd's delay.
  *   **Point of View:** This stance demands a **distant, omniscient vantage**, a "view from nowhere" that can hold both the cell and the city in the same frame. If you stay behind the woman's eyes, the summation fails because the reader cannot access the commuters' utility from inside her pain. The narrator must be an actuary of suffering.
  *   **Detail and Sympathy:** Concrete sensory detail must be distributed democratically, which is to say, thinly. The woman's fear is one data point; the commuters' irritation is three hundred million. Sympathy is diluted to fit the container. The risk here is that the prose becomes cold, turning the woman into a variable. To make the summation persuasive, the writing must convince the reader that the *scale* of the crowd creates a new kind of moral gravity that overrides the *depth* of the woman's pain.

  ### II. The Craft of Refusal (Deontology/Rights-Based)
  **The Moral Claim:** Persons are ends in themselves. You cannot trade one person's violation for the comfort of others. The summation is category error.
  **The Craft Imperative:** Make the individual infinite and the multitude irrelevant.

  *   **Duration and Time:** Here, you employ **dilation** to its absolute limit. The three hours in the cell must feel like an eternity. You render the interrogation moment by moment, stretching the second hand of the clock until it snaps. The commuters' three seconds, by contrast, are rendered as **instantaneous and negligible**. They are not just summarized; they are dismissed. They happen in the time it takes the woman to blink.
  *   **Point of View:** This requires **deep close POV**, locked "just behind her eyes," as you described. The commuters literally do not exist in the narrative consciousness unless they enter the cell. If they are mentioned, they are abstracted into a "they," a faceless force, devoid of interiority. To grant the commuters their own POVs would be to betray the woman's rights.
  *   **Detail and Sympathy:** Sensory detail is hoarded for the woman. The smell of the concrete, the dryness of her throat, the specific timbre of the interrogator's voice. The commuters receive no sensory reality; they are a concept, a statistic. Sympathy is not distributed; it is anchored. The craft forces the reader to inhabit the violation, making the trade-off feel viscerally obscene regardless of the numbers.

  ### III. The Craft of Thresholds (Intermediate Views)
  **The Moral Claim:** Aggregation matters, but only up to a point. Severe suffering has lexical priority over trivial inconvenience, or the weight of additional trivial harms diminishes.
  **The Craft Imperative:** Create a structure of counterpoint that refuses resolution.

  *   **Duration and Time:** You would alternate between **scene and summary** in a way that creates friction rather than flow. The woman's scene is interrupted by the crowd, but the crowd's summary never gains enough momentum to drown out the scene. The rhythm suggests that while the crowd is vast, it lacks the *narrative weight* to resolve the tension of the cell.
  *   **Point of View:** A **shifting limited omniscience**. We dip into the woman, then pull back to see the crowd, then return. But the return to the woman is not a continuation; it is a re-centering. The transition between the two must feel jarring, signaling that these two types of suffering do not live on the same continuum.
  *   **Detail and Sympathy:** The commuters are given *some* humanity—a specific cough, a dropped coin—to acknowledge they are persons, not numbers. But this detail is capped. It never deepens into the intimacy granted to the woman. The craft creates a hierarchy of access: the woman is known; the crowd is recognized. This mirrors the moral view that their interests count, but not enough to override her threshold of pain.

  ***

  ### A Candid Ledger of Loss

  When we force these moral distinctions through the sieve of narrative technique, some survive intact, some distort, and some vanish.

  **1. Distinctions That Survive Without Strain**
  *   **Intensity of Experience:** The distinction between severe suffering and trivial discomfort maps perfectly onto **Scene vs. Summary**. Narrative is naturally equipped to show that three hours of terror is *qualitatively* different from three seconds of annoyance. The novelistic tool of dilation captures the "severity" of the harm better than moral philosophy does.
  *   **Interior Access:** The distinction between "persons kept separate" and "harms merely summed" finds a home in **Point of View**. We cannot sum consciousnesses in a novel any more than we can in reality. We can only visit them one by one. This structural limitation of the novel actually preserves the moral truth of individual separateness better than utilitarian calculus does.

  **2. Distinctions That Survive Only by Stretching Craft**
  *   **The Relevance of Numbers:** The moral weight of "300 million" is incredibly difficult to render without breaking the **contract of attention**. In morality, 300 million is heavier than one. In narrative, 300 million is background noise. To make the crowd feel heavy, you must slow down the summary, which turns it into a scene, which individualizes the commuters, which ironically undermines the "aggregate" nature of their harm. You stretch the notion of "chorus" or "collective character" until it threatens to become unrealistic or allegorical.
  *   **Diminishing Weight:** The intermediate view requires a **structural cap** on sympathy. But narrative sympathy is not a resource that runs out; it is a muscle that grows with use. Asking a reader to care about the commuters *but not too much* is an unnatural directive for prose. It requires a tonal inconsistency that feels like a flaw in writing rather than a feature of ethics.

  **3. Distinctions With No Narrative Counterpart**
  *   **The "Right" Not to Be Used:** Narrative is teleological; it moves toward consequence. Morality sometimes posits constraints that hold *regardless* of consequence. There is no craft tool for "rights" other than the emotional reaction of the reader. If the reader decides the woman *should* be sacrificed for the greater good, the text has no mechanism to prove them wrong, other than to manipulate their emotions. The deontological constraint is invisible to craft; it exists only in the reader's judgment *after* the reading.
  *   **Ex Ante vs. Ex Post:** The distinction between what is suffered and what is risked is nearly impossible to render in **narrated time**. A novel happens in the past tense (even if present). It shows what *did* happen. To show the "risk" requires a counterfactual narrative—a ghost story of what didn't occur. Craft struggles to give weight to the road not taken, whereas moral philosophy often weighs risk heavily.

  ### Judgment: Limitation or Obscurity?

  Does this failure reveal a limitation of novelistic thinking, or an obscurity in the moral idea itself?

  It reveals an **obscurity in the moral idea.**

  The moral puzzle you describe relies on the abstraction of human experience into commensurate units of "utility" or "discomfort." It assumes that a second of annoyance and an hour of terror can, in sufficient quantities, be placed on the same scale.

  The novel does not fail to solve this puzzle; the novel **dissolves** the puzzle. Narrative technique demonstrates that suffering is not a fluid that can be poured from one container to another. By forcing you to choose between the *texture* of the woman's pain and the *statistic* of the crowd's delay, craft exposes that the "summation" was never a real description of the world, but a mathematical model that stripped away the very thing that makes harm matter: the specific, unshareable consciousness of the sufferer.

  If you write the woman's scene with true fidelity (close POV, dilation, sensory detail), the utilitarian calculation becomes impossible to sustain emotionally. If you write the crowd's summary with true fidelity (distance, compression), their claim to outweigh the woman feels like a lie.

  The limitation is not in the novel's ability to think morally, but in morality's attempt to think without the novel. The moral puzzle assumes we can stand outside the experience to weigh it. Craft proves we cannot. We are always somewhere specific, looking at someone specific, for a specific amount of time. The "puzzle" arises only when we try to abandon that position. Therefore, the failure of craft to render the summation stance without strain is not a failure of craft; it is a successful exposure of the inhumanity required to perform the calculation in the first place.
