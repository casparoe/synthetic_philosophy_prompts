          *   *POV:* Omniscient, statistical, god-like.
          *   *Detail:* Abstracted but massive. "A continent of sighs."
          *   *Sympathy:* Distributed thinly but widely.
      *   **Section 2: The Craft of Refusal (Deontological).**
