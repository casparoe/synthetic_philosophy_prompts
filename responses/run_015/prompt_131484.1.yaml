answer: |-
  This is a classic bind. You've spotted that Mara isn't just inconsistent; she's holding a specific, somewhat unstable configuration of anthropic rules that a lot of people fall into because it feels intuitive in the moment, even if it creates tension under scrutiny.

  Here is the breakdown of the machinery she's running, what she'll say about your digital minds, and the specific case that will force her to pick a lane.

  ### 1. The Machinery: What Rules Fit Her Verdicts?

  Mara is running **The Self-Sampling Assumption (SSA) over Observer-Moments**, combined with a **Restricted Reference Class**.

  Here is how that engine powers her specific answers:

  *   **Doomsday Argument (Legit):** SSA says you should reason as if you are a random sample from the set of all observers in your "reference class." If you are the 100-billionth human, and the total number of humans were a quadrillion, it would be unlikely for you to be so early. So, the total is likely smaller.
      *   *Why it fits:* She accepts SSA.
  *   **Presumptuous Philosopher (Keep the Prior):** In the 10 vs. 10,000 person case, SIA (Self-Indication Assumption) says you are more likely to exist in the world with 10,000 people. Mara rejects this. She thinks your existence is a given in both scenarios, so the numbers don't shift the probability.
      *   *Why it fits:* This is the hallmark of SSA. SSA rejects the idea that "more observers make a world more likely."
  *   **Sleeping Beauty (1/3):** This is where it gets tricky. Standard SSA often leads to the "Halfer" position (50/50). But if you apply SSA not to *people* but to **observer-moments** (specific instances of experience), you get 1/3. There is one Heads-awakening and two Tails-awakenings. If you are a random awakening, you are twice as likely to be in Tails.
      *   *Why it fits:* She is counting *moments of experience*, not just distinct people.
  *   **The Reference Class (Humans vs. "Whoever could be you"):** This is the glue holding it together. She restricts the Doomsday pool to "humans" (saving the argument from alien interference) but widens it enough for Sleeping Beauty to count multiple awakenings of the same person.
  *   **Aliens (Doesn't Know):** This is the crack in the hull. If she uses SSA, aliens only matter if they are in the reference class. If she uses SIA, aliens make our existence more likely regardless. Since she rejects SIA (Presumptuous Philosopher) but restricts the reference class (Doomsday), she genuinely doesn't know if aliens count as "similar enough" to sample from.

  **Summary of her engine:** She treats you as a random sample of *conscious moments* (explaining Sleeping Beauty), but only *human-like* conscious moments (explaining Doomsday), and she rejects the idea that simply existing in a populous universe makes that universe more likely (explaining Presumptuous Philosopher).

  ### 2. Prediction: The Digital Minds Case

  When you spring the Digital Minds case on her, here is exactly how her machinery will process it:

  **Her Verdict:** She will say **it provides no evidence for H1.** She will tell you to keep the prior (50/50).

  **Her Reasoning:**
  She will lean heavily on the **Restricted Reference Class**. She already told you the Doomsday Argument is about "human beings." She will argue that digital minds, even if conscious, are not in the same reference class as biological humans. Therefore, the trillion trillion digital people are invisible to the sampling rule. Since the number of *biological* humans is the same in H1 and H2 (one trillion), your position as a biological human is equally likely in both.

  **The Speed Question:**
  You asked if counting moments instead of persons makes the argument stronger if the digital minds run faster.
  *   **Theoretically:** Yes. If she is consistent about "Observer-Moments" (from Sleeping Beauty), then speed *must* matter. A digital mind running 1,000x faster generates 1,000x more moments. If they were in the reference class, H2 would become astronomically unlikely because you'd almost certainly be a digital moment, not a biological one.
  *   **Practically:** She will dodge this. She will say speed doesn't matter because they aren't in the reference class to begin with. If you press her on whether a perfect upload of *her* brain counts as "human," she will likely get uncomfortable and revert to "substrate matters" or "biological history matters."

  **Why she'll say this:** It preserves her Doomsday conclusion without forcing her to accept the Presumptuous Philosopher's logic. It keeps the "Human Club" exclusive.

  ### 3. The Wedge: The Case That Breaks Her Consistency

  You want to separate the rules still in play. The tension in her view is between **Presumptuous Philosopher (SSA)** and **Sleeping Beauty (Observer-Moments)**. She rejects population size as evidence in the first, but accepts "number of awakenings" as evidence in the second.

  You need a case that combines **Population Size** with **Memory Loss**.

  **The Case: "The Amnesiac Presumptuous Philosopher"**

  **The Setup:**
  Tell her there are two hypotheses about how the universe was created, equally likely a priori.
  *   **H1 (Small):** The creator makes **10** people. Each person is woken up **once**, shown a red room, and then lives their life.
  *   **H2 (Large):** The creator makes **10** people. However, each person is woken up **1,000 times** in a red room with total amnesia between each waking. After the 1,000th waking, they live their life.

  **The Situation:**
  You wake up in a red room. You don't know which hypothesis is true. You don't know if this is your first waking or your 500th.

  **The Question:**
  Does waking up in the red room give you evidence for H2?

  **Why this separates the machinery:**
  1.  **If she sticks with her Presumptuous Philosopher verdict (SSA):** She should say **No**. The number of *people* is the same (10). The "population" didn't grow, only the repetitions. She has consistently said population size doesn't shift priors (PP) and that the reference class is specific (Humans). She might argue the "person" is the unit of sampling.
  2.  **If she sticks with her Sleeping Beauty verdict (Observer-Moments):** She should say **Yes, strong evidence for H2**. In H2, there are 10,000 total awakenings. In H1, there are 10. If you are a random awakening (which she agreed to for Sleeping Beauty), you are 1,000 times more likely to be experiencing *this* moment in H2.
  3.  **The Conflict:** This case forces her to decide if the "unit" of probability is a **Person** (which favors her PP/Doomsday view) or a **Moment** (which favors her Sleeping Beauty view).

  **How to pitch it:**
  "Okay, Mara. Imagine the Presumptuous Philosopher setup, 10 people vs 10 people. But in the second world, everyone gets amnesia and is woken up a thousand times. I wake up. Am I more likely to be in the world with the thousand wakeups? Because if you say yes, you're admitting that 'more moments' shifts probability, which kills your Presumptuous Philosopher answer. If you say no, you're treating moments differently than you did with Sleeping Beauty."

  ### Summary for your night shift
  *   **Her Engine:** SSA + Observer-Moments + Human-Only Reference Class.
  *   **Digital Minds Prediction:** She'll say "No evidence," excluding digital minds from the human reference class.
  *   **Speed Factor:** It *would* matter if she admitted digital minds count, but she won't.
  *   **Next Case:** The Amnesiac Presumptuous Philosopher. It forces her to choose between counting People (PP) or counting Moments (SB).

  If she waffles on the Amnesiac case, you'll know she doesn't have a consistent engine—she's just matching intuitions case-by-case. But if she picks a side, you'll see which gear is actually driving the car.
