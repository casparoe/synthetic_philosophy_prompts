prompt: |-
  I help allocate a modest annual budget on the grants committee of a small foundation, and our last two cycles have been dominated by arguments that I think are really arguments about method rather than about the causes themselves. Everyone on the committee reaches for the familiar three-factor framework — importance, tractability, neglectedness — and then multiplies (or, more often, eyeballs) the three ratings. I have become fairly convinced that this habit is doing real damage at the decision stage, and I have drafted the notes below for an internal memo proposing that we demote the heuristic to a screening device and use something more explicit for the shortlist. Before I inflict it on colleagues who are attached to the framework, I would like a careful critique.

  The notes, somewhat condensed:

  1. The framework is being asked to answer two different questions: which causes are worth investigating (screening), and how the next unit of money should be spent (allocation). For screening, a crude salience filter is fine and probably healthy. For allocation, the target quantity is the expected marginal value of the next unit of resources at the current funding margin, and there is no reason to think a product of three context-free ratings approximates it. The factors are not independent, they are not dimensionless, and their product is not a quantity anyone is trying to maximize.

  2. Neglectedness partly double-counts with diminishing returns. What it is gesturing at is that causes differ in how far along their marginal-returns curve they already sit. But headcount of existing funders is a contaminated proxy for that: existing work may be complementary to mine rather than substitutable; a crowded field may be crowded with ineffective actors, which raises rather than lowers my marginal value; and a cause can receive steady institutional funding that will simply not be there next year.

  3. A separate correction — call it a fungibility discount — seems to me to belong in the model explicitly: the value of my dollar depends on what the marginal incumbent would have done with resources I decline to spend. If the counterfactual funder is a government that would have spent the money on something close to neutral, my dollar is nearly as good as it looks; if the counterfactual funder is a sophisticated donor who would have redirected to the next-best cause anyway, my dollar buys much less than it looks. This is a different question from "how many people are working on this."

  4. Durability and reversal risk are missing. Some gains are stocks that persist without further outlay (a technology that now exists, changed professional norms, trained personnel who stay in the field); some are flows that must be continually re-bought (recurring delivery of a service); and some are stocks that can be undone (a policy win reversed by a successor administration, a norm that decays). If you discount a cause's benefits with a hazard rate for reversal rather than treating all benefits as permanent, rankings among the top causes can flip — a high-importance, high-tractability cause whose effects must be re-purchased every year can lose to a lower-importance cause whose effects compound.

  5. Given how uncertain we are about downstream effects, part of a cause's value is the information that funding it now generates for later allocations. This favors causes with short feedback loops and measurable outcomes independently of their direct value, which means "importance" should be assessed under uncertainty rather than at a point estimate. I am uneasy about this term, though: it seems vulnerable to a regress (should I also value the information about the information?), and it may give an unbounded reason to prefer tiny, fast, legible causes.

  6. My proposal: keep the three-factor scoring for generating a longlist, then score the shortlist on an explicit marginal-value ledger with four entries — (i) direct marginal value per dollar along an explicitly modelled returns curve rather than a single number, (ii) a fungibility/counterfactual-redundancy discount, (iii) a durability-adjusted discount rate including a reversal hazard, (iv) an information term. I know the obvious reply: this demands numbers nobody has, and the virtue of the heuristic is that someone can apply it in an afternoon. My answer is that almost all of the money is decided at the shortlist stage, so "the hard case is the important case" is not much of a defense of using the easy tool there.

  7. I am also suspicious of my own framing in one respect: it presupposes that causes are separable units of allocation. But causes interact — building capacity in one area can make another area tractable a decade later — and if that is the dominant effect, any per-cause scoring, mine included, is the wrong shape of object.

  What I would like from you:

  Please treat the notes as a draft argument and give me the strongest critique you can, at around 900–1,100 words, written as if for a reasonably numerate committee that has not thought about this methodologically. I am more interested in being shown where the argument breaks than in being told it is reasonable. In particular: which of the seven points is weakest, and why; whether the fungibility discount in point 3 is genuinely a new consideration or merely neglectedness relabelled; whether the durability point is separable from importance or just importance measured over time; whether the information term in point 5 collapses into a regress or a license for timidity; and what the best defense of the multiplicative heuristic is against my point 1 — including any way in which my "expected marginal value" framing quietly presupposes something the heuristic was designed to avoid presupposing. Please also flag anywhere I have smuggled in a substantive ethical assumption (expected-value maximization, impartiality, a particular view about how to handle uncertainty) rather than derived it. Do not spend words on bibliographies or citations; I want the reasoning, not the literature. Finally, and this matters to me most: end by saying, as plainly as you can, which single consideration would most change your verdict about my proposal, where your own critique is most likely to be wrong, and how confident you are in the ranking of objections you have given.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **Task:** Critique a draft internal memo proposing a shift from the "Importance, Tractability, Neglectedness" (ITN) framework to a more explicit "marginal-value ledger" for grant allocation.
      *   **Audience:** A reasonably numerate grants committee attached to the ITN framework.
      *   **Tone:** Critical, analytical, constructive but rigorous. Focus on where the argument breaks.
      *   **Length:** 900–1,100 words.
      *   **Specific Requirements:**
          *   Identify the weakest of the seven points.
          *   Analyze the fungibility discount (Point 3) vs. neglectedness.
          *   Analyze durability (Point 4) vs. importance over time.
          *   Analyze the information term (Point 5) regarding regress/timidity.
          *   Defend the multiplicative heuristic against Point 1.
          *   Flag smuggled ethical assumptions (EV maximization, etc.).
          *   **Crucial Ending:** State the single consideration that would most change the verdict, where the critique is most likely wrong, and confidence level.
      *   **Constraint:** No bibliographies or citations.

  2.  **Deconstruct the Memo's Arguments:**
      *   *Point 1:* ITN is for screening, not allocation. Allocation needs expected marginal value (EMV). Product of ratings $\neq$ EMV.
      *   *Point 2:* Neglectedness double-counts diminishing returns. Headcount is a bad proxy.
      *   *Point 3:* Fungibility/Counterfactuals matter (what would others do?). Distinct from neglectedness.
      *   *Point 4:* Durability/Reversal risk missing. Stocks vs. Flows.
      *   *Point 5:* Value of Information (VoI). Short feedback loops favored. Risk of regress.
      *   *Point 6:* Proposal: ITN for longlist, Ledger for shortlist.
      *   *Point 7:* Causes aren't separable (interactions).

  3.  **Drafting the Critique - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the memo. Validate the core intuition (ITN is a heuristic, not a law) but challenge the feasibility and theoretical coherence of the proposed replacement.
      *   **Point 1 & The Heuristic Defense:** The memo claims ITN doesn't approximate EMV. *Counter:* ITN *is* a log-linear approximation of EMV under specific assumptions. If Importance = Total Value, Tractability = % solved per $, Neglectedness = 1/$ already spent, then Product $\approx$ Marginal Value. The critique needs to highlight that the author's "EMV framing" presupposes knowable returns curves, which ITN was designed to bypass.
      *   **Point 3 (Fungibility) vs. Neglectedness:** Is this new? Neglectedness asks "how much is already done?" Fungibility asks "who would do it if we don't?" They are distinct but highly correlated in practice. If a cause is neglected, often no one else is waiting to step in. However, the memo is right that *crowding* isn't the same as *replacement*. Still, estimating counterfactuals is often harder than estimating headcounts.
      *   **Point 4 (Durability) vs. Importance:** Is durability separate? Importance is usually defined as "total good done." If good decays, total good is lower. So durability is arguably a sub-component of Importance (discounted over time), not a separate ledger entry. Separating them risks double-counting or confusion.
      *   **Point 5 (Information Value):** This is the weakest point (as requested). VoI is real, but the memo admits the regress risk. In a small foundation context, prioritizing "legible" causes for learning can bias away from hard, important problems. It creates a "pilot project" bias.
      *   **Ethical Assumptions:** The memo assumes Consequentialism/Utilitarianism (maximize EMV). It assumes impartiality (all causes comparable). It assumes risk-neutrality (EV over utility). It assumes separability (Point 7 admits this is shaky).
      *   **Feasibility/Epistemic Humility:** The proposed ledger requires numbers nobody has. ITN's virtue isn't just speed; it's forcing explicit comparison without false precision. The ledger might create an illusion of precision.
      *   **Conclusion/Requirements:** Single consideration, where critique is wrong, confidence.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Word Count Check:* I need to be concise. 900-1100 words is tight for this much analysis. I must avoid fluff.
      *   *Tone Check:* Ensure I'm not just saying "it's hard." I need to say "it's theoretically potentially flawed."
      *   *Specific Focus:* The prompt asks to identify the *weakest* of the seven points. Point 5 (Information) seems the most vulnerable to the regress/timidity objection the author themselves raises. Point 7 is also weak because it undermines the author's own proposal, but Point 5 is internally contradictory. Let's go with Point 5 as the weakest *internal* argument, though Point 7 is the strongest *external* critique. Actually, the prompt asks "which of the seven points is weakest." Point 5 admits its own flaw ("uneasy about this term"). Point 7 admits its own flaw ("suspicious of my own framing"). Point 2 is strong. Point 1 is strong. Let's argue Point 5 is the weakest because it introduces a dynamic that conflicts with the static allocation goal without a stopping rule.
      *   *Fungibility:* Make sure to clarify that Neglectedness is about *current* state, Fungibility is about *counterfactual* state. They are distinct but estimating the latter often relies on the former.
      *   *Durability:* Argue that this is just Importance discounted.
      *   *Heuristic Defense:* The multiplicative model is a Bayesian update in disguise.

  5.  **Drafting the Content (Iterative process):**

      *   *Intro:* Your diagnosis is sharp, but the prescription may induce paralysis or false precision.
      *   *Heuristic Defense (Point 1):* You claim the product doesn't approximate marginal value. But if Importance is total value, Tractability is elasticity, and Neglectedness is inverse funding, the product *is* a rough EMV proxy. Your "explicit returns curve" demands knowledge we don't have. ITN hides uncertainty; your ledger exposes it but demands we quantify the unquantifiable.
      *   *Fungibility (Point 3):* Distinct from neglectedness? Yes. Neglectedness is stock; fungibility is flow substitution. But practically, knowing the counterfactual funder is harder than counting current funders. You trade a biased proxy for an unknowable parameter.
      *   *Durability (Point 4):* Is this separate? If Importance is "present value of future benefits," durability is already baked in. Separating them risks double-counting. A reversible policy win is just less Important than a permanent one, ceteris paribus.
      *   *Information (Point 5):* This is the weakest point. You note the regress risk. In a budget-constrained environment, valuing information favors small, measurable projects over transformative, uncertain ones. It institutionalizes timidity. Without a clear stopping rule for "enough learning," this term dominates the ledger.
      *   *Ethical Assumptions:* You smuggle in risk-neutrality and strict consequentialism. You assume causes are separable (Point 7 admits this is false).
      *   *Closing:* Single consideration: If the ledger creates false precision that overrides qualitative judgment. Where I might be wrong: Underestimating the committee's ability to model counterfactuals. Confidence: Moderate.

  6.  **Review against Constraints:**
      *   Word count: Need to expand on the reasoning to hit 900-1100.
      *   No citations.
      *   Specific ending format.
      *   Address all specific questions (fungibility, durability, info term, heuristic defense, ethical assumptions).

  7.  **Final Polish (Mental Check of Word Count):**
      *   Intro: ~100 words.
      *   Heuristic/Point 1: ~250 words.
      *   Fungibility/Durability: ~250 words.
      *   Information/Point 5: ~200 words.
      *   Ethical Assumptions/Point 7: ~150 words.
      *   Conclusion/Requirements: ~150 words.
      *   Total: ~1100. I need to be careful not to be too brief. I will expand on the "false precision" argument.

      *(Self-Correction)*: Wait, I need to make sure I explicitly answer "which of the seven points is weakest." I'll designate Point 5.
      I need to make sure I answer "where your own critique is most likely to be wrong."
      I need to make sure I answer "confidence level."

      Let's write.

      *Drafting thought:* Ensure the distinction between "Importance as total value" vs "Importance as flow" is clear in the durability section.
      *Drafting thought:* Ensure the defense of ITN emphasizes *epistemic humility* rather than just *speed*.

      *Revised Plan:*
      1. Intro: Validate the critique of ITN misuse but challenge the ledger.
      2. Point 1 & Heuristic: ITN is a log-linear proxy for EMV. The ledger demands false precision.
      3. Point 3 & 4 (Fungibility/Durability): Fungibility is distinct but unknowable. Durability is subsumed by Importance.
      4. Point 5 (Info): Weakest point. Leads to timidity.
      5. Ethical Assumptions: Risk neutrality, separability.
      6. Conclusion requirements.

      *Word Count Management:* I will write densely.

      *(Final check on constraints)*: "written as if for a reasonably numerate committee". Tone should be professional, peer-to-peer.

      Let's assemble.
answer: |-
  Your memo correctly identifies that the Importance, Tractability, Neglectedness (ITN) framework has calcified from a heuristic into a false algorithm. However, your proposed replacement risks swapping a known bias for an illusion of precision. While your diagnosis of the committee's behavior is accurate, your prescription demands epistemic access we likely do not possess. Below is a critique of the theoretical and practical weaknesses in your argument.

  Your strongest theoretical claim is in Point 1: that the product of three ratings does not equal expected marginal value (EMV). However, the strongest defense of the multiplicative heuristic against this claim is that ITN is essentially a log-linear approximation of EMV under conditions of extreme uncertainty. If "Importance" represents total value at stake, "Tractability" represents the elasticity of progress with respect to resources, and "Neglectedness" serves as a proxy for the inverse of current funding, their product roughly approximates the marginal return on investment. The heuristic was not designed to be dimensionally rigorous; it was designed to force comparability between disparate cause areas without demanding unobtainable data. Your "explicit returns curve" requires knowing the shape of the productivity function for each cause. In most philanthropic contexts, we do not know if we are on the flat or steep part of the curve. By demanding explicit modeling, you risk privileging causes where data is available over causes where value is high, effectively penalizing innovation for the sake of legibility.

  Regarding Point 3, you ask whether the fungibility discount is merely neglectedness relabelled. It is theoretically distinct but practically entangled. Neglectedness measures the current stock of resources; fungibility measures the counterfactual flow of resources if you withdraw. While distinct, estimating the counterfactual funder is often strictly harder than counting current funders. If you cannot identify the marginal incumbent, you cannot calculate the discount. In practice, committees will likely substitute the easy proxy (headcount) for the hard parameter (counterfactual behavior), reintroducing the error you seek to fix but with more steps. You are trading a biased proxy for an unknowable parameter.

  Point 4 regarding durability raises a categorization error. You treat durability as a separate ledger entry, but it is arguably a sub-component of Importance. If Importance is defined as the net present value of future benefits, then a reversible policy win is simply less Important than a permanent technological fix, all else being equal. Separating them risks double-counting. If you score a cause high on Importance and then discount it for low Durability, you must ensure your Importance score wasn't already assuming permanence. If Importance is measured as an annual flow, then durability belongs in a separate discount rate. Your memo does not specify which definition of Importance you are using, creating ambiguity in how the ledger interacts with the screening phase.

  Point 5, concerning the value of information, is the weakest of your seven arguments. You acknowledge the risk of regress and timidity, but you do not solve it. In a budget-constrained environment, explicitly valuing information favors small, fast, legible projects over transformative, uncertain ones. This creates a structural bias toward pilot projects that never scale. Without a stopping rule for "enough learning," this term can dominate the ledger, justifying perpetual investigation rather than intervention. Furthermore, valuing information presupposes that the knowledge gained will be actionable for future allocations. If the foundation's strategy is static or the environment shifts rapidly, the information value decouples from future utility. You have identified a real phenomenon but proposed a metric that is vulnerable to gaming and lacks a natural bound.

  Your proposal also smuggles in significant ethical assumptions. First, it presupposes risk-neutrality. By maximizing expected value, you imply the foundation should be willing to make high-variance bets that might result in zero impact, provided the upside is high. Many donors are risk-averse regarding reputation or moral certainty. Second, despite Point 7, your ledger still treats causes as separable units. You admit causes interact, yet your scoring system remains per-cause. If capacity building in Area A makes Area B tractable, scoring them separately undervalues the ecosystem effect. Your ledger does not solve the portfolio problem; it merely adds columns to a single-asset analysis.

  Finally, the shift from heuristic to ledger changes the committee's psychology. ITN allows for qualitative disagreement within a shared structure. A ledger demands numbers. This often shifts debate from "is this cause good?" to "why did you score that 0.4 instead of 0.5?" The friction moves from substance to calibration, potentially obscuring the moral judgments that should drive allocation.

  **Concluding Assessment**

  The single consideration that would most change my verdict is evidence that the committee can reliably estimate counterfactual funder behavior. If you can demonstrate that we can accurately identify the marginal incumbent and their alternative allocation, the fungibility discount becomes a powerful tool rather than a source of noise. Without that, it is speculation dressed as math.

  My critique is most likely to be wrong regarding the "false precision" objection. It is possible that the act of forcing explicit numbers, even if guessed, exposes hidden disagreements that the heuristic glosses over, leading to better deliberation even if the numbers themselves are inaccurate.

  I am moderately confident (roughly 70%) in this ranking of objections. The information value problem (Point 5) is theoretically fraught, but the epistemic demands of the returns curve (Point 1) are the most likely practical failure point for your proposal.
