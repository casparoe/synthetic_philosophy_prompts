          *   45: **THE ANNOUNCEMENT.**
          *   45-60: Reaction/Choice phase.
          *   60-90: Debrief.

  6.  **Developing the "Narrative Escrow" Concept:**
      *   Make it concrete. Each group adds a "Clause."
      *   Clause has a "Cost" (effort now) and a "Yield" (value later).
      *   If no later, Yield = 0.
      *   The "Payoff Sheet" needs to show the math of futility.

  7.  **Writing the Termination Script:**
      *   Needs to be cold, bureaucratic, not dramatic. The banality of extinction.
      *   "The timeline terminates." Not "You all die." Just "No one comes after."
      *   Handle stubborn workers: Don't stop them physically, but invalidate the *value* of their work.

  8.  **Debrief Strategy:**
      *   Connect the feeling of "wasted effort" to Scheffler.
      *   Crucial distinction: In the game, *you* are there to feel the waste. In real extinction, *no one* is there. That's the horror Scheffler points out—we care *now* about a feeling *no one* will have.
      *   Address the "Facilitator as God" friction.

  9.  **Predicting Failure Modes:**
      *   *Gamification:* Students might just try to hack the points. Counter: Make the points abstract until the end.
      *   *Cynicism:* "This is stupid." Counter: Lean into the absurdity.
