      *   *Check:* Is the "Narrative Escrow" clear? I need to define "Hooks." A Hook is a rule that requires maintenance.
      *   *Tone Check:* Keep it casual. "Here's the deal," "Watch out for this."

  11. **Final Review against constraints:**
