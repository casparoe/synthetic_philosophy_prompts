      *   **Goal:** Avoid abstract trolley problems; make the loss of the "afterlife" (future generations continuing our projects) felt viscerally.
      *   **Audience:** ~14 grad students + few faculty (total ~16-18).
      *   **Duration:** 90 minutes.
      *   **Mechanism:** Generational groups (3-4 people) building a shared artifact (rule-set for an institution) over time.
      *   **Key Twist:** At minute 45, announce termination (no future generation).
      *   **Key Concept:** "Narrative Escrow" (depositing value for future redemption).
      *   **Deliverables:** Roles/Rules, Payoff Sheet, Timeline, Termination Script, Debrief Guide, Prediction of Failure Modes.
      *   **Tone:** Casual, runnable, brainstorming style (typos okay).

  2.  **Deconstruct Scheffler's Afterlife Conjecture:**
      *   It's not just about *us* dying. It's about *them* not existing.
      *   We care about the future because our current activities derive meaning from the assumption that others will continue them.
      *   If humanity ends shortly after we die, our current projects lose value *now*.
      *   *Workshop Translation:* The value of the current group's work depends entirely on the next group's ability to use it. If the next group is canceled, the current group's work becomes "stranded value."

  3.  **Design the Activity: "The Escrow Protocol"**
      *   *Artifact:* A "Constitution for a Long-Term Archive." Why? Because archives are inherently about the future.
      *   *Generations:* Gen 1 (Founders), Gen 2 (Stewards), Gen 3 (Successors), Gen 4 (The End?).
      *   *Mechanic:* "Narrative Escrow." You write rules that only pay off if the next generation accepts and builds on them.
      *   *The Twist:* Midway through Gen 3's turn, stop the world.

  4.  **Drafting the Mechanics (Roles & Rules):**
      *   Need 4 Groups of ~4 people. (16 people fits perfectly).
      *   *Currency:* "Continuity Credits" (CC).
      *   *Escrow:* You bank CC by creating "Hooks" (rules that require future action). You cash out if the Hook is caught.
      *   *The Betrayal Option:* If the future is canceled, you can "Salvage" (individual points) or "Memorialize" (no points, but honor the chain).

  5.  **Drafting the Timeline (90 Mins):**
      *   0-10: Intro & Setup.
      *   10-25: Gen 1.
