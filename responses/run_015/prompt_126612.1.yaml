  *   **NO** → Go to Question 4.

  **4. Is a rule discovered in a made-up story or a 'what if' scenario just as real as one found in fact?**

  *   **YES** → **Leaf**.
  *   **NO** → **Leaf**.

  ---

  ## The Leaves

  ### Path: YES (Det) → YES (Sym) → NO (Fic)
  **Name:** The Prophet (Marxist-style Historicist)
  **Awkward Commitment:** You must claim the future is certain while admitting you cannot name the exact date it arrives.

  ### Path: YES (Det) → YES (Sym) → YES (Fic)
  **Name:** Unnamed (Ideological Fictionalist)
  **Awkward Commitment:** You treat propaganda novels as data sets equal to census records.

  ### Path: YES (Det) → NO (Sym) → NO (Fic)
  **Name:** The Oracle (Religious Historicist)
  **Awkward Commitment:** You believe the future is written but refuse to read the page until it turns itself.

  ### Path: YES (Det) → NO (Sym) → YES (Fic)
  **Name:** Unnamed (Mythic Fatalist)
  **Awkward Commitment:** You believe ancient legends predict tomorrow better than economic charts.

  ### Path: NO (Det) → YES (Prob) → NO (Sym) → NO (Fic)
  **Name:** The Architect (Structuralist)
  **Awkward Commitment:** You design societies based on tendencies you admit might collapse tomorrow.

  ### Path: NO (Det) → YES (Prob) → NO (Sym) → YES (Fic)
  **Name:** The Novelist (Narrative Realist)
  **Awkward Commitment:** You must defend the truth of a story you know never actually happened.

  ### Path: NO (Det) → YES (Prob) → YES (Sym) → NO (Fic)
  **Name:** The Actuary (Positivist Sociologist)
  **Awkward Commitment:** You treat human lives as insurance risks where the odd outlier proves the rule.

  ### Path: NO (Det) → YES (Prob) → YES (Sym) → YES (Fic)
  **Name:** Unnamed (Speculative Structuralist)
  **Awkward Commitment:** You build models on real data but calibrate them using imaginary scenarios.

  ### Path: NO (Det) → NO (Prob) → YES (Sym) → NO (Fic)
  **Name:** The Auditor (Popperian Anti-Historicist)
  **Awkward Commitment:** You must dismiss any explanation of the past that could not have predicted it beforehand.

  ### Path: NO (Det) → NO (Prob) → YES (Sym) → YES (Fic)
  **Name:** Unnamed (Speculative Empiricist)
  **Awkward Commitment:** You demand strict proof for facts but accept fables as valid tests for theory.

  ### Path: NO (Det) → NO (Prob) → NO (Sym) → NO (Fic)
  **Name:** The Coroner (Contextual Historian)
  **Awkward Commitment:** You claim to understand the cause of death but insist you could never have prevented it.

  ### Path: NO (Det) → NO (Prob) → NO (Sym) → YES (Fic)
  **Name:** Unnamed (Counterfactual Historian)
  **Awkward Commitment:** You argue that what did not happen is the only way to understand what did.

  ---

  **Note on Indistinguishable Leaves:**
  The tree struggles to separate **The Auditor** from **The Coroner**. Both deny historical laws, but one insists explanation *requires* prediction (Popper), while the other says explanation *differs* from prediction (Historian). In practise, both end up saying history cannot forecast the future, making their daily work look identical despite their theoretical quarrel.
