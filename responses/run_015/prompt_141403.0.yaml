      *   *Moralized/Thick Concept:* Intent is partly constituted by moral judgment (badness makes it intentional).
          *   *Prediction:* Fits the asymmetry (Knobe effect). Fits oblique intent (bad result treated as intent). Explains why good results aren't intent.
      *   *Eliminativist/Culpability Grading:* "Intent" is just a label for high culpability.
          *   *Prediction:* Fits oblique intent (high culpability = murder). Fits motive irrelevance (motive doesn't change act's wrongfulness). Fits asymmetry (we punish harm, not reward luck).

  4.  **Analyzing the Existing Practice (Presuppositions vs. Fit vs. Underdetermination):**
      *   *Strict Presupposition:* The law *cannot* be purely volitional (aim-only). If it were, the bomb instruction would be incoherent. It presupposes that the mental state required for conviction can be satisfied by something other than desire.
      *   *Fits Well With:* A hybrid cognitive-volitional view or a culpability-based view. It fits the idea that "acceptance" of a outcome is enough.
      *   *Underdetermined:* Does "intent" mean the same thing in the bomb case as the direct case? Or is it a legal fiction? The practice doesn't tell us if the jury is finding a *fact* about the mind or making a *normative judgment* about blameworthiness.

  5.  **Addressing the "Foresight = Intent" Question:**
      *   Does the law commit to foresight *being* intent? Not necessarily. It allows the *inference*. The instruction says "permitted... to find." This suggests foresight is *evidence* of a state of mind (acceptance) that counts as intent, OR it's a rule of law that treats foresight *as if* it were intent for grading purposes.
      *   It doesn't force the view that psychological intent *is* foresight. It could be bypassing psychology for policy (culpability).

  6.  **Addressing the Asymmetry & Knobe Effect:**
      *   *Knobe Effect:* People say side-effect harm is intentional, side-effect help is not.
      *   *Legal Asymmetry:* Law mirrors this (oblique intent for harm, no oblique intent for good).
      *   *Interpretation:*
          *   *Option A (Moralized Concept):* The law relies on a folk concept where morality penetrates the cognition. Intent isn't neutral.
          *   *Option B (Performance Artefact/Policy):* The asymmetry isn't about the *concept* of intent, but the *purpose* of criminal law (punishing wrongs, not rewarding rights). The law doesn't need to find "intent to save" because it's not trying to convict for saving.
      *   *Argument:* The legal practice suggests Option B is stronger. The law ignores good side effects not because it can't conceptualize "intending good," but because criminal law is backward-looking (blame). The Knobe effect might reflect this pragmatic asymmetry rather than a semantic one.

  7.  **Evaluating "Constructive Beneficence":**
