          6.  **Constraint:** Argue from the content of the practice; do not appeal to case names, empirical citations, or literature.

  2.  **Deconstruct the Legal Practice:**
      *   *Feature 1 (Oblique Intent):* Foreseen virtual certainty $\rightarrow$ permitted finding of intent (even if not desired). Example: Bomb on plane for insurance (crew dies).
      *   *Feature 2 (Motive Irrelevance):* Good motive doesn't negate intent. Bad motive doesn't create intent (usually). Motive is for sentencing.
      *   *Feature 3 (Asymmetry):* Foreseen bad $\rightarrow$ can be intent. Foreseen good $\rightarrow$ never intent. No "constructive beneficence" currently.
      *   *Hypothetical:* "Constructive Beneficence" rule for sentencing mitigation (foreseen good $\rightarrow$ mitigation).

  3.  **Drafting the Candidate Accounts (Bullet Points):**
      *   *Aim/Purpose (Volitional):* Intent = conscious objective.
          *   *Prediction:* Fits motive irrelevance (purpose is distinct from motive). Struggles with oblique intent (bomb case isn't purpose).
      *   *Foresight/Certainty (Cognitive):* Intent = belief in near-certainty.
