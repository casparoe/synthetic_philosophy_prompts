answer: |-
  *   **Aim-or-Purpose Accounts:** Intending is strictly having a result as one's conscious objective or goal.
      *   *Prediction:* This account predicts the law should *not* allow a finding of intent in the bomb-on-plane case, as the deaths are not the actor's aim. It fits well with the irrelevance of motive (motive is distinct from purpose), but it clashes with the doctrine of oblique intent unless the law is viewed as systematically misdescribing the mental state.
  *   **Foresight-plus-Certainty Accounts:** Intending is acting with the belief that a result is virtually certain to occur, regardless of desire.
      *   *Prediction:* This fits the oblique intent instruction perfectly. However, it predicts symmetry: if foresight of certainty constitutes intent, foreseen good outcomes should also count as intended. It fails to predict the legal asymmetry where foreseen benefits are never treated as intended results.
  *   **Moralized or Thick Concepts:** Intentional agency is not a neutral psychological description but is partly constituted by normative judgment (e.g., we attribute intention more readily when the outcome is bad).
      *   *Prediction:* This predicts the asymmetry directly. It fits the oblique intent rule (bad outcome $\rightarrow$ intentional) and the absence of constructive beneficence (good outcome $\rightarrow$ not intentional). It suggests the "intent" label tracks blameworthiness rather than raw cognitive states.
  *   **Eliminativist or Culpability-Grading Views:** Talk of "intent" is dispensable; the law is directly grading the actor's culpability or dangerousness, using mental state terms as proxies for blame.
      *   *Prediction:* This fits all three features. Oblique intent is allowed because the actor is sufficiently culpable. Motive is irrelevant because culpability attaches to the choice to act despite risks. Asymmetry exists because criminal law grades *culpability* (which requires harm/wrong), not *praiseworthiness*. On this view, "intent" is just a placeholder for "liable to punishment."

  ***

  ### The Presuppositions of Existing Practice

  The existing practice of oblique intent combined with the irrelevance of motive **strictly presupposes** that the legal concept of intention is not co-extensive with the volitional concept of "aim" or "purpose." If the law required an aim, the bomb instruction would be logically incoherent; since the instruction is coherent and operative, the law presupposes that a cognitive state (knowledge of certainty) can satisfy the *functional role* of intention in assigning liability.

  However, the practice is **underdetermined** regarding the metaphysical status of that cognitive state. It does not settle whether the jury is finding a fact about the defendant's psychology or making a normative judgment about their standing. The practice **fits well with** a hybrid view where intention is a cluster concept involving both high probability and a willingness to proceed, but it does not mandate it. Crucially, the practice is compatible with the view that the law is not defining "intention" at all, but rather establishing a rule of imputation: *if* you knew it was certain, you are treated *as if* you intended it for the purposes of grading.

  ### Foresight, Evidence, or Culpability?

  Does the law commit to the view that intending just *is* acting in the belief of near-certainty? No. The instruction that a jury is "permitted though not required" to find intent indicates that foresight is not analytically identical to intent within the legal framework. If they were identical, the finding would be mandatory upon proof of knowledge.

  This leaves two viable readings:
  1.  **Foresight as Evidence:** The law treats foresight of certainty as strong evidence of a hidden volitional state (acceptance or reconciliation with the outcome). The jury infers that the defendant must have "intended" it in a broader sense because no one acts knowing a result is certain unless they have, in some sense, adopted it into their plan.
  2.  **Bypassing Intention:** The law uses the word "intent" but is actually bypassing the psychological category in favor of a direct judgment of culpability. On this reading, the instruction is a policy rule: "This level of knowledge makes you blameworthy enough for murder, so we will use the murder label."

  The practice leans toward the second reading when combined with the irrelevance of motive. If motive (the "why") is irrelevant, the law is isolating the act and the knowledge of consequences as the sole locus of blame. This suggests the "intent" requirement is a threshold for culpability, not a precise map of the mind. The law cares that you chose to act knowing the cost, not whether the cost was your goal.

  ### The Asymmetry and the Knobe Effect

  The mirror image absence—no doctrine treating foreseen good outcomes as intended—must be read in light of the Knobe effect. In folk psychology, people attribute intentionality to side effects when they are harmful but not when they are beneficial.

  Is this evidence that the law has latched onto a moralized folk concept? **Yes, but functionally rather than semantically.** If the legal concept were a neutral psychological container, the asymmetry would be an error. The fact that the law mirrors the folk asymmetry suggests the legal concept is not trying to describe a neutral mental state. Instead, it suggests that "intention" in law is a **normative attribution** reserved for anchoring blame.

  The Knobe effect is not merely a performance artefact here; it reveals that the concept of intentional action is inherently sensitive to the normative status of the outcome. The law deploys "intent" to mark out the boundary of punishable conduct. Since the law is not in the business of punishing good outcomes, it has no need to stretch the concept of "intent" to cover foreseen benefits. The asymmetry shows that the doctrine is not discovering a pre-existing psychological fact (that the bomber "intended" the deaths but the chairman did not "intend" the environmental help); rather, the doctrine is *constructing* intentionality to match the contours of liability. The word "intent" is doing normative work, not descriptive work.

  ### Workability of Constructive Beneficence

  Would "constructive beneficence" be workable? If enacted as a sentencing mitigation rule based on foresight of good outcomes, it faces a psychological hurdle. The prompt asks us to consider if fact-finders would stubbornly refuse to say the hacker *intended* to save the patients.

  If fact-finders **refuse** to apply the label "intended" to the good outcome, even when instructed that foresight suffices for the mitigation, it would demonstrate that the existing doctrine of oblique intent rests on a **legal construct that merely borrows the word** "intent." It would prove that "intent" is cognitively tethered to blame in the human mind. We can punish someone for a foreseen bad result by calling it "intent," because that aligns with our moral psychology. We cannot reward someone for a foreseen good result by calling it "intent," because our moral psychology resists attributing agency to accidental virtues. This refusal would show that the law's use of "intent" in the bomb case is a fiction sustained by the urgency of blame; remove the blame, and the fiction collapses.

  If fact-finders **accept** the label without resistance, it would suggest that "intent" is a genuine, neutral psychological category (foresight of certainty) that the law had previously underutilized due to policy, not conceptual limits.

  However, given the Knobe effect, refusal is the more likely outcome. This implies that the existing practice of oblique intent is not describing a symmetric cognitive capacity. It is a **unidirectional tool of imputation**. The law treats foresight of harm as intent because it needs to capture the culpability of the indifferent actor. It does not treat foresight of benefit as intent because it does not need to capture the praiseworthiness of the indifferent actor.

  Therefore, "constructive beneficence" would likely be workable only if it decouples the mitigation from the word "intent." If the rule grants mitigation based on "foresight of certain good" without requiring the jury to find that the defendant "intended" that good, it avoids the psychological friction. If it requires the finding of "intent," it risks jury nullification or confusion.

  ### Conclusion: Psychological Category or Legal Construct?

  The refusal of fact-finders to attribute intention to foreseen good outcomes would confirm that the doctrine we already have rests on a **legal construct**. It shows that "oblique intent" is not a discovery about the mind (that knowing = intending), but a normative rule (that knowing + harm = liable as if intending).

  The law borrows the word "intent" because it carries the weight of moral condemnation necessary for conviction. It does not borrow the word for mitigation because mitigation does not require the same moral weight. The asymmetry proves that the legal concept of intention is not a mirror of human psychology, but a tool for distributing blame. The "intent" in "oblique intent" is a placeholder for "sufficiently culpable state of mind regarding a bad result," not a description of a cognitive state that applies equally to good and bad results.
