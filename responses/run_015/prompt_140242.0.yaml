          *   *Lexical Priority:* Some philosophies say human life > animal life *always*, not just weighted higher. CEA does ratios.
          *   *WTP vs. Direct Utility:* This is crucial for the badger example. WTP is preference satisfaction about a state of the world. Direct utility is the experience of the being.

