      *   **Specific Case:** Zoonotic disease control (badger culling). Currently, badger harm is valued only via human WTP (Willingness-To-Pay). Is this a bug or a category error?
      *   **Constraint:** Do *not* give a verdict on animal ethics. Focus on translation and structural limitations. Use American English.

  2.  **Deconstruct the Philosophical Claims & Translate to CEA:**

      *   *Claim 1: Equal Consideration of Interests (Singer).*
          *   *Philosophy:* Similar interests count equally, regardless of who holds them.
          *   *CEA Translation:* This is about the *scope of the outcome measure*. Currently, QALYs/DALYs are human-specific. To translate this, we need a common metric (e.g., "sentience-adjusted life years" or just expanding the QALY definition). It implies an *inclusion criterion* for the numerator (health effects).
          *   *Weighting:* If a badger feels pain equivalent to a human's pain, the disutility weight should be identical in the model.

      *   *Claim 2: Argument from Marginal Cases.*
          *   *Philosophy:* If we grant rights to humans with low cognitive capacity (infants, severely disabled), we must grant them to animals with similar capacity, or else we are inconsistent.
          *   *CEA Translation:* This challenges the *eligibility criteria* for the reference case. Currently, all humans count equally (usually). If we use cognitive capacity as a threshold for "moral patienthood" in the model, we risk excluding some humans. To avoid this, the model must decouple "capacity" from "counting."
          *   *Equity Weights:* This looks like an equity weight issue. If we weight humans at 1.0 based on species, but animals at 0.0, the AMC says this is arbitrary. It suggests the weighting function should be based on *capacity for suffering/benefit* (utility function), not species ID.

      *   *Claim 3: Species Membership is Morally Irrelevant (like Race/Sex).*
          *   *Philosophy:* Species is a biological category, not a moral one. Discriminating based on it is prejudice.
          *   *CEA Translation:* This is about the *perspective* and *constraints*. In CEA, we often adopt a "societal perspective," but legally/mandatorily it's usually "human societal." This claim argues the perspective should be "sentient societal."
          *   *Reference Case:* It challenges the rule "ignore costs/effects on other sectors" if "other sectors" includes the non-human biosphere. It argues against a constraint that sets animal utility to zero by definition.

  3.  **Analyze the "Residue" (What gets lost?):**

      *   *The Collapse:* The user suspects moral status collapses into "allowed weights." They are right. CEA is aggregative and consequentialist. It doesn't care *why* something counts, only *that* it counts and *how much*.
      *   *Rights/Constraints:* Philosophy often talks about rights (side-constraints). CEA talks about trade-offs. You can't model a "right not to be killed" easily in CEA; you just model it as a huge negative utility. But a right implies *no trade-off is permissible*, whereas CEA always allows a trade-off if the ICER is low enough.
      *   *Incommensurability:* Philosophy sometimes argues animal life and human life are *different kinds* of value, not just different amounts. CEA forces commensurability (everything into QALYs/$).
      *   *The Badger Case:* Valuing badger death via human WTP treats the badger as a *good* (like a park view), not a *patient* (like a human patient). The residue is the difference between *instrumental value* (WTP) and *intrinsic value* (direct utility entry).

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, precise, respectful of the user's expertise. No preaching. American English.
