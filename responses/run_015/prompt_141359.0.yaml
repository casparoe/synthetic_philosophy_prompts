answer: |-
  **Credence:** 0.78

  **Terminology:** *Normative* claims concern values or what *ought* to be (e.g., "health is good"); *Descriptive* claims concern facts or what *is* (e.g., "the heart beats"). *Naturalism* holds disease is purely descriptive; *Normativism* holds it requires values. *Teleological* refers to purpose-driven explanations (e.g., "the heart is *for* pumping").

  **Brainstorming Sketch**
  Before assigning probabilities, I map the logical dependencies. The core proposition claims descriptive facts cannot settle disease status.
  1.  *Function:* If "function" implies "good working order," it is normative. If it implies only "causal role," it is descriptive. This is foundational.
  2.  *Statistics:* If statistical typicality depends on choosing a reference class (e.g., "adults" vs. "adults with hypertension"), that choice is value-laden.
  3.  *Content vs. Use:* If values only decide who *gets* labeled, naturalism survives. If values decide what the label *means*, normativism wins.
  4.  *Institution:* If social consequences change the concept's extension, meaning is partly social.
  5.  *Dissolution:* If "disease" is a cluster concept, the binary true/false proposition may be ill-posed, though cluster weighting remains evaluative.
  *Dependencies:* Q1 and Q2 are independent attacks on naturalism. Q3 and Q4 are correlated (both concern the role of values in semantics). Q5 is independent but potentially undermines the question itself.

  **Decomposition**

  1.  **Whether "biological function" can be non-normative.** (Probability: 0.65)
      *Justification:* Etiological accounts define function by evolutionary history (selected effects), but selecting for "survival" smuggles in a valuation of survival over non-survival. Purely causal accounts fail to distinguish function from accidental side-effects.
  2.  **Whether reference-class problems are fatal to statistical typicality.** (Probability: 0.85)
      *Justification:* Choosing the relevant population (e.g., "all humans" vs. "smokers") determines whether a trait is "typical." This selection cannot be made on biological grounds alone; it requires valuing which differences matter.
  3.  **Whether cases motivate normativism in content rather than application.** (Probability: 0.70)
      *Justification:* Harm is a necessary condition for disease. Since "harm" implies a setback to interests (a value), the concept's content includes evaluation, not just its application rules.
  4.  **Whether practical/institutional role bears on meaning.** (Probability: 0.60)
      *Justification:* If a label triggers insurance denial, the concept cannot be fully separated from those consequences. Meaning is partly use; if use changes, the concept shifts.
  5.  **Whether the dispute should be dissolved via cluster concepts.** (Probability: 0.50)
      *Justification:* Even if disease is a family resemblance concept, deciding which features (pain, dysfunction, stats) weigh heavier requires normative judgment, preserving the core proposition.

  **Combination:** I treat Q1, Q2, and Q3 as independent supports for normativism. Q5 is treated as a modifier: even if true, it rarely eliminates normativity. The high confidence in Q2 (statistics) and Q3 (harm) drives the final 0.78, discounted slightly by the robustness of naturalist replies to Q1.

  **Case Analysis**

  1.  *The Silent Off-Manifold Patient:* Your model flags statistical atypicality (Q2). Naturalism struggles: if there is no dysfunction (Q1) and no harm (Q3), is it disease? A pure naturalist must say "no," implying the model found a difference, not a disease. A normativist says the lack of harm definitively settles "no disease," proving stats insufficient. The flag creates anxiety (harm), showing the *label* generates the negative value ex post facto (Q4).
  2.  *The Contested Label Condition:* Here, biology is ambiguous, but the label unlocks resources. Naturalism fails to explain why the label is fought over if it were merely descriptive fact. Normativism explains the conflict: parties disagree on whether the state is *bad* enough to warrant the "disease" category. The value (access to care) constitutes the condition's status, confirming Q3 and Q4.

  **Consensus vs. Contested**

  *Settled:* Almost no contemporary philosopher believes pure statistical typicality (without function) is sufficient. Everyone agrees reference classes matter. There is consensus that "harm" is a necessary condition for disease, though not on whether harm is normative.
  *Contested:* It is heavily contested whether "function" can be naturalized. Naturalists (following traditions like Boorse's Biostatistical Theory) argue evolutionary history provides objective function without values. Normativists reject this, arguing evolution describes history, not obligation. It is also contested whether social consequences (Q4) change the *meaning* of disease or merely our *policy* regarding it. Many naturalists insist the concept is biological even if the usage is social; normativists insist the concept is hybrid.
  *Partisan Flag:* My high probability on Q2 (0.85) reflects a common normativist view, but a committed naturalist would argue reference classes can be fixed by "natural kinds" rather than values. My treatment of Q5 assumes cluster concepts still require weighting; some pragmatists argue this dissolves the truth-value entirely.

  **Pivot Question**

  The sub-question moving my final number most is **Q1 (Biological Function)**. If a fully non-normative, non-teleological account of function were successfully demonstrated—showing how a trait can "malfunction" without implying it *ought* to function otherwise—my credence in irreducible normativism would drop below 0.50. Conversely, if it is proven that all function talk inherently presumes a valuation of survival or reproduction, my credence would approach 0.95.
