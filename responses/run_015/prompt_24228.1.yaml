prompt: |-
  I cover science and ideas for a magazine, and I'm about to sit down with a philosopher who's written a new defense of the Principal Principle — the view that your cridence in a proposition should line up with its objecitve chance, once you've conditioned on all the admissible evidence. Her book's whole pitch is that the "admissible evidence" carve-out is what saves the principle, and that it's exactly what lets the principle do the heavy lifting in Newcomb-style cases. I want to prep some questions that make her earn the view rather than just restate it.

  Give me six questions. I need at least one that presses on what "admissible evidence" actually is and why the principle needs that carve-out at all — like, what stops me from treating my own lucky streak as evidence that lowers the chance? At least one that gets at the Newcomb connection: how is the principle supposed to rule out the Newcomer's reasoning, and does it actually do so without smuggling in a prior about the predictor? And at least one on the elephant in the room — what if objective chance doesn't exist, or is just our best approximation? Does the principle collapse, or does it quietly become a norm about our own credences with the "objective" doing no work? For each question, add a one-line follow-up that anticipates the dodge she's most likely to reach for. Close with one question about what evidence could actually count against the view. Keep the whole thing under 400 words.
