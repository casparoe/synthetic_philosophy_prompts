answer: |-
  **The 2016 Referendum as a Case Study in Collective Intentionality**

  **Introduction**

  The 2016 United Kingdom referendum on European Union membership presents a formidable challenge to theories of collective intentionality. The fixed facts are stark: a binary ballot question yielded a result of roughly 52 per cent to leave and 48 per cent to remain. The ballot specified nothing regarding the terms of departure—customs arrangements, single-market status and transition periods were all unspecified. Within the winning side, competing versions of leaving ranged from close regulatory alignment (the Norwegian model) to bespoke trade agreements, or exit onto default World Trade Organisation terms. Despite this, the result was routinely described as 'the will of the people', a description used to require legislators—including those who had campaigned against leaving—to give effect to it. The legislature subsequently deadlocked for years over the terms of withdrawal until a general election was fought on completing the process.

  This analysis proceeds in two directions. First, it applies standard theories of shared intention to the referendum to determine what kind of intentional state, if any, was produced. Second, it considers what the episode reveals about the limitations and scope of those theories.

  **Part I: Mapping Theory onto the Case**

  *Shared Intention Conditions and Meshing Sub-Plans*

  Standard accounts of shared intention, such as those proposed by Michael Bratman, require that participants intend that they act together, intend it by way of meshing sub-plans, and remain mutually responsive when those plans break down. Additionally, Margaret Gilbert's plural-subject theory suggests that joint commitment generates obligations among members.

  When applied to June 2016, the condition of 'meshing sub-plans' fails conspicuously. A voter intending to leave to achieve a Norwegian-style relationship holds a sub-plan incompatible with a voter intending to leave to achieve a default trade terms relationship. These are not merely different means to the same end; they are contradictory ends regarding regulatory alignment. Furthermore, there was no mechanism for mutual responsiveness among the 17.4 million Leave voters. They did not negotiate their intentions; they deposited private ballots. Consequently, on strict Bratmanesque terms, there was no collective intention to leave in a specific sense. There were only many individual intentions with divergent objects, aggregated by a counting rule.

  *Creating, Diagnosing, or Deferring?*

  The prompt suggests a tripartite distinction: a vote may create a collective intention, diagnose one that already exists, or produce an 'intention to defer'.

  1.  **Creating:** For a vote to create a shared intention, the voters would need to enter a joint commitment through the act of voting. Given the lack of interaction and incompatible sub-plans, the referendum did not create a robust shared intention in the philosophical sense.
  2.  **Diagnosing:** This would imply a pre-existing collective mind was merely measured. Given the polarization and the narrow margin, there was no antecedent unified 'will' waiting to be discovered.
  3.  **Intention to Defer:** This fits the case best. The content of the vote was not 'We intend to leave on terms X', but rather 'We intend that the government should negotiate leaving and whatever they adopt should be accepted'. This is an intention to authorise rather than an intention to execute. The object of the intention was not the exit itself, but the empowerment of a proxy to determine the exit.

  *Content-Gappy Intentions*

  Can a shared intention be content-gappy? Can one intend to exit without intending what follows? In the philosophy of action, an intention typically requires a conception of the action. An intention that specifies only what it rejects ('not remaining') risks lacking an object altogether. However, if the intention is understood as an 'intention to defer', the content is not gappy; it is second-order. The object is 'the implementation of the negotiated outcome'.

  Theory struggles to distinguish an underdetermined collective intention from no collective intention at all. If the sub-plans do not mesh, Bratman would argue there is no shared intention. However, political practice treats the mandate as real. The theory might classify this as a 'shared policy' rather than a 'shared intention', where the policy is to pursue withdrawal, leaving the specifics to leadership.

  *Retroactive Content and the Later Election*

  Regarding the 2019 general election: can it supply missing content retroactively? Philosophically, no. Intention is future-directed. A decision made in 2019 cannot fill the content of an intention formed in 2016. The 2019 election did not complete the 2016 intention; it replaced it. It created a new collective intention (via a parliamentary majority) to accept a specific withdrawal agreement. The theory must maintain the temporal direction of intentionality: the later election superseded the earlier ambiguity rather than resolving it retroactively.

  **Part II: What the Episode Shows About the Theory**

  *The Aggregative Rival*

  This episode largely vindicates the aggregative rival to shared intention theory. In mass politics, procedures convert plural votes into outcomes without any 'we' being formed in the metaphysical sense. The 'will of the people' is a fictional construct useful for legitimacy, not a description of a joint commitment. The mechanism was arithmetic, not interpersonal. The theory of collective intentionality, designed for small-scale interactions like walking together or singing a duet, fails to capture the impersonal nature of a national referendum.

  *The Institutional Gap*

  The case exposes a gap in the theory regarding institutions. Institutions act on mandates whose content is filled in later by whoever holds office. Shared intention theory focuses on the participants' mental states. It lacks the resources to explain how an authorisation works when the agents executing the intention (the government) were not part of the original joint commitment (the voters). The theory does not account for the constitutional machinery that translates a vague aggregate signal into binding legislative action.

  *Binding Dissenting Legislators*

  Does the plural-subject machinery license binding legislators who dissented? Strictly speaking, no. On Gilbert's account, obligations arise from joint commitment. Remain-voting MPs did not jointly commit with Leave voters to bring about Brexit. They were bound by constitutional convention and the European Union (Referendum) Act 2015, not by the norms of shared intentionality. The political rhetoric claiming they were bound by 'the will of the people' outstrips what the philosophical theory can support. The theory cannot explain why a minority (the 48 per cent, or Remain MPs) should be bound by the intention of a majority with whom they share no joint commitment.

  *Silence of the Theory*

  Where the theory is silent, it must be said plainly. Standard accounts of collective intentionality do not address the scale of millions of agents. They do not account for the role of intermediaries (political parties, media) in shaping the perceived object of intention. Nor do they address the normative force of majority rule in a constitutional context. The theory explains how individuals coordinate; it does not explain how a state legitimises coercion based on a binary vote with undefined terms. To force the theory to speak here is to category mistake a philosophical account of agency for a political account of legitimacy.

  **Conclusion**

  The 2016 referendum was not a case of collective intention in the strict philosophical sense. It was an aggregation of individual intentions with divergent sub-plans, best understood as an intention to defer the specifics to the government. The subsequent deadlock arose because the 'intention to defer' collided with the reality that no single version of leaving could satisfy the incompatible sub-plans of the coalition. The 2019 election did not retroactively fix the 2016 intention but replaced it with a new mandate. Ultimately, the episode suggests that for mass political events, aggregative models and institutional analysis offer more explanatory power than theories of shared intentionality, which remain silent on the mechanics of constitutional mandates and the binding force of majority votes over dissenting minorities.
