  You have assembled a sophisticated package, but you are kidding yourself about the coherence of commitment (2) alongside (3). This is the fatal tension. The rest are manageable technicalities; this is a foundational contradiction.

  Here is the audit, ranked by severity.

  **Severity 1: Classical Logic vs. Truth-Value Gaps (2 vs. 3)**
  You state you want "Classical logic throughout" but also claim trans-horizon sentences have "no fact of the matter." In formal semantics, classical logic is inextricably linked to bivalence. The Law of Excluded Middle ($p \lor \neg p$) is a theorem of classical logic. If a sentence $p$ lacks a truth value, $p \lor \neg p$ cannot be true (on standard gap logics) or must be true while neither disjunct is (on supervaluationism). You cannot have it both ways. If you maintain classical logic *throughout*, you are forced to say trans-horizon sentences are either true or false, which collapses your local anti-realism into realism (perhaps an unknowable realism). If you maintain anti-realism (gaps), you must abandon classical logic for that region.
  *What gives:* You must drop "Classical logic throughout." Replace it with "Classical logic for determinate regions, non-classical (e.g., Strong Kleene or Supervaluationism) for trans-horizon regions." This is costly—it complicates your entailment relations across boundaries—but it is the only way to make the view coherent.

  **Severity 2: The Diagonalization Worry (5 vs. 9)**
  Your friend is partially right, but you have a defense if you are strict. The Fitch paradox relies on constructing a sentence equivalent to "$p$ and not known $p$." Your restriction (5) blocks sentences containing the operator $K$. Your friend argues diagonalization can produce a sentence $q$ without $K$ that *says* it is unknown. This is only possible if epistemic notions are *definable* in your base language (e.g., via a truth predicate plus verification conditions). If you treat $K$ as a primitive operator and strictly restrict KP to the fragment of language lacking $K$ (and lacking a truth predicate that could define it), the derivation fails. The revenge paradox requires semantic closure.
  *What gives:* You must ensure your "non-epistemic vocabulary" restriction is hermetic. You cannot allow a truth predicate in the base language eligible for KP. If you do, your friend wins. If you don't, the restriction holds, but it limits the expressiveness of the sentences to which KP applies.

  **Severity 3: Self-Application (8)**
  Your friend is correct here, and you are wrong. If your theory includes the claim "There are truths nobody will ever know," that sentence contains epistemic vocabulary ("knows"). By your own rule (5), KP does not apply to it. Therefore, you cannot derive the *knowability* of your own theory from KP. You can claim it is true, and you can claim you know it, but you cannot claim it is knowable *in virtue of the Knowability Principle*. You need an independent argument for why your theory is knowable, or you must admit your theory is an exception to its own principle.
  *What gives:* Accept that KP is not universal. It applies to first-order claims about the world, not to meta-claims about knowledge. This doesn't falsify your theory, but it humility-checks your ambition. You can know the theory, just not via KP.

  **Severity 4: Realism about the Future (7 vs. 1)**
  This is the least problematic. You claim future truths are determinate even if no inquirers exist, but KP says truths are knowable "in principle" by "possible finite inquirers." As long as it is physically *possible* for an inquirer to exist in that future region (even if none actually do), KP is satisfied. The tension only arises if physics dictates that inquirers are impossible in that future epoch. Assuming physics doesn't forbid life forever, you can maintain realism there without violating KP.

  **The Cheapest Repair**
  The single revision that cleans up the most is **abandoning "Classical logic throughout."**
  Once you admit that logic is local to the discourse region (classical for the past/future, non-classical for trans-horizon), you dissolve the primary contradiction. This also helps with the Fitch paradox: if the logic governing trans-horizon sentences doesn't validate all classical steps (specifically, if it doesn't validate the move from $\neg \Diamond K p$ to a contradiction in the same way), the pressure to restrict KP syntactically lessens. However, keeping the syntactic restriction is still wise to block standard derivations in the classical regions.

  **Verdict on 8 and 9**
  *   **Worry 9 (Diagonalization):** Stop worrying, provided you ban truth predicates from the KP-eligible language. Your syntactic restriction is robust against diagonalization *if* the language isn't semantically closed. Your friend is assuming you want a fully expressive semantic theory included in KP; don't give him that.
  *   **Worry 8 (Self-Application):** Stop trying to prove your theory is knowable via KP. It isn't. Admit that KP is a first-order principle about worldly facts, not a meta-logical principle about itself. You can still assert you know the theory; just don't claim KP guarantees it.

  **Summary**
  You are trying to have a classical ontology with an anti-realist epistemology in a specific region without paying the logical tax. You must pay the tax. Drop classical logic for the trans-horizon region. Accept that KP doesn't apply to itself. Keep the syntactic restriction but guard the base language against semantic closure. If you make these moves, the package holds. If you insist on classical logic throughout, the view collapses into realism or contradiction. Be blunt with yourself: the logic must bend to match the metaphysics, not the other way around.
