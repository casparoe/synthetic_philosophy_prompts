answer: |-
  Here is the plan. I have evaluated your three mechanics against the arithmetic of proper scoring rules and the logistical reality of a 75-minute seminar with 20 undergraduates.

  ### Part 1: Mechanical Triage

  **Mechanic 1 (Hive-Mind/Sum):** **SURVIVES.**
  This is the only mechanic that cleanly isolates the variable you suspect: the aggregation function. As shown in the algebra below, changing the scoring from *Sum of Losses* to *Average Loss Per Awakening* flips the optimal strategy from 1/3 to 1/2 without changing the students' evidence. This directly models the Halfer/Thirder dispute as a dispute over how to count welfare/score across possible selves.
  *Logistical Fix:* To prevent students from counting taps, we use loud music and divide the class into small teams (4 teams of 5). You only tap 1 or 2 people per team, not the whole room.

  **Mechanic 2 (Captain):** **KILLED.**
  *Arithmetic:* If you select one "Captain" at random from all awakenings to score, you are effectively sampling from the *awakenings*, not the *trials*.
  $P(\text{Heads} | \text{Selected}) \propto P(\text{Selected} | \text{Heads})P(\text{Heads}) = 1 \times 0.5 = 0.5$.
  $P(\text{Tails} | \text{Selected}) \propto P(\text{Selected} | \text{Tails})P(\text{Tails}) = 0.5 \times 0.5 = 0.25$.
  Normalized: Heads = 2/3, Tails = 1/3.
  *Diagnosis:* This doesn't wash out the multiplicity; it biases the sampling toward Heads (since Tails dilutes the probability of being picked). It creates a 2/3 credence, which is neither the Halfer (1/2) nor Thirder (1/3) position. It introduces a second layer of randomness (selection) that confuses the core self-locating issue.

  **Mechanic 3 (Protocol Design):** **KILLED.**
  *Diagnosis:* This requires students to understand the solution to design the game. If they knew how to build a rule that forces 1/2, they wouldn't need to play. It turns the seminar into a math puzzle about scoring rules rather than an experience of epistemic tension.

  ---

  ### Part 2: The Protocol ("The Ledger")

  **Objective:** Students must report a credence $p \in [0,1]$ that "The Coin is Heads."
  **Incentive:** Minimize penalty points (Brier Score). Lowest team score wins.
  **Setup:** 4 Teams of 5 students. Movable chairs clustered.
  **Materials:** Projector (rules), Speaker (loud music), Coin, Slips of paper, Pen, Whiteboard (Ledger).
  **Roles:**
  *   **The Sleepers:** The 20 students.
  *   **The Experimenter:** You.
  *   **The Auditors (Crucial):** Recruit the 2-3 students who admit to knowing the "Sleeping Beauty" problem beforehand. Their job is to verify the coin flip and the tap count (1 vs 2) to ensure you aren't cheating. They cannot speak to the class until the debrief. This neutralizes their spoiler potential by giving them authority.

  #### The Algebra (Show this to yourself, not yet to them)

  We use a Quadratic Scoring Rule (Brier Score). Penalty = $-(\text{Report} - \text{Truth})^2$.
  *   If Heads (Truth=1): Penalty = $-(p - 1)^2$.
  *   If Tails (Truth=0): Penalty = $-(p - 0)^2 = -p^2$.

  **Round 1: The "Thirder" Incentive (Sum Aggregation)**
  *Rule:* The Team's Score is the **Sum** of penalties from all woken members.
  *   **Heads (1 awakening):** Total Penalty = $-(p-1)^2$.
  *   **Tails (2 awakenings):** Total Penalty = $-p^2 + -p^2 = -2p^2$.
  *   **Expected Penalty (Fair Coin):** $E = 0.5 [-(p-1)^2] + 0.5 [-2p^2]$.
  *   **Maximize Utility (Minimize Loss):**
      $$ \frac{d}{dp} [ -0.5(p-1)^2 - p^2 ] = -(p-1) - 2p = 1 - 3p = 0 $$
      $$ \Rightarrow p = 1/3 $$
  *   *Result:* Rational teams will report **1/3**.

  **Round 2: The "Halfer" Incentive (Average Aggregation)**
  *Rule:* The Team's Score is the **Average** penalty per woken member.
  *   **Heads (1 awakening):** Avg Penalty = $-(p-1)^2 / 1$.
  *   **Tails (2 awakenings):** Avg Penalty = $(-p^2 + -p^2) / 2 = -p^2$.
  *   **Expected Penalty:** $E = 0.5 [-(p-1)^2] + 0.5 [-p^2]$.
  *   **Maximize Utility:**
      $$ \frac{d}{dp} [ -0.5(p-1)^2 - 0.5p^2 ] = -(p-1) - p = 1 - 2p = 0 $$
      $$ \Rightarrow p = 1/2 $$
  *   *Result:* Rational teams will report **1/2**.

  ---

  ### Part 3: Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Rules**
  *   Arrange chairs into 4 pods of 5.
  *   Project Rules: "Goal: Minimize Team Penalty Points." "Coin is Fair." "Heads = 1 Wakeup, Tails = 2 Wakeups."
  *   Explain the "Amnesia": Eyes closed, music on. If tapped, open eyes, write number, close eyes. Do not count taps. Do not signal.
  *   Appoint Auditors. Give them a separate sheet to track the coin and tap count.
  *   **Crucial:** Do not use the words "Sleeping Beauty," "Halfer," or "Thirder." Call it "The Ledger Protocol."

  **00:10 – 00:30: Round 1 (Sum Scoring)**
  *   Project: "SCORING RULE: TEAM PENALTY = SUM OF ALL ACTIVE SLIPS."
  *   Teams huddle for 2 mins to agree on a strategy number $p$. (They will likely debate, but must commit to one number to write on all slips).
  *   **The Trial:**
      1.  Music ON (loud enough to mask movement).
      2.  Lights DIM.
      3.  Flip Coin (Auditors verify).
      4.  **Heads:** Tap 1 random person per team.
      5.  **Tails:** Tap 2 random distinct people per team.
      6.  Tapped students open eyes, write the team's number $p$ on a slip, hand to you, close eyes.
      7.  Music OFF. Lights UP.
  *   You calculate scores privately (or on board if you want transparency, but private prevents early inference).
  *   Repeat 3 times to let the score stabilize.

  **00:30 – 00:50: Round 2 (Average Scoring)**
  *   Project: "SCORING RULE CHANGE: TEAM PENALTY = AVERAGE OF ACTIVE SLIPS."
  *   Tell them: "The physical setup is identical. Only the math on my ledger has changed."
  *   Teams huddle. They should notice the incentive shift. If they are sharp, they will switch their number from 1/3 to 1/2.
  *   Run 3 Trials same as above.
  *   **Observation Point:** Watch if teams argue. Some will insist "The evidence didn't change, why should the number change?" This is the philosophical crux.

  **00:50 – 01:05: The "Monday" Boss Round (Optional/Debrief Prep)**
  *   Tell them: "Final Round. Same setup (Sum Scoring). But now, write your credence that **this is the first tap of the trial**."
  *   Run 1 Trial.
  *   **Arithmetic Check:**
      *   If playing for Sum (Thirder logic): 3 equiprobable centers (H-1st, T-1st, T-2nd). Two are "1st". Credence = **2/3**.
      *   If playing for Average (Halfer logic): $P(H)=1/2$ (always 1st). $P(T)=1/2$ (50% chance 1st). Total = $1/2 + 1/4 =$ **3/4**.
  *   Collect slips. Do not reveal answer yet.

  **01:05 – 01:15: The Reveal & Debrief**
  *   Announce winners. Give silly prize.
  *   **The Turn:** Ask Round 1 teams: "What number did you pick?" (Expect 1/3). Ask Round 2 teams: "What number?" (Expect 1/2).
  *   **Ask:** "Did your evidence change between Round 1 and 2?" (No. Same coin, same taps).
  *   **Ask:** "Did the *world* change?" (No).
  *   **Ask:** "What changed?" (The scoring rule / The definition of 'Team Success').
  *   **Map to Philosophy:**
      *   Round 1 (Sum) = **Thirder / Self-Indication Assumption**. You care about the total accuracy across all moments of existence. Tails weighs more because there are more moments.
      *   Round 2 (Average) = **Halfer / Self-Sampling Assumption**. You care about the accuracy per trial. Tails doesn't get extra weight just because it lasts longer.
      *   The "Monday" Round: Show the 2/3 vs 3/4 split. This proves the divergence isn't just about the Coin, but about how they locate themselves in time.
  *   **Name Drop:** Now you can say "Sleeping Beauty," "Halfer," "Thirder."
  *   **Auditors:** Ask them to confirm the coin was fair and taps were 1 vs 2.

  ---

  ### Part 4: Failure Modes & Mitigations

  1.  **The "Counting" Cheat:**
      *   *Risk:* Students hear 2 taps and know it's Tails.
      *   *Fix:* Music volume must be high. You should also walk around the room continuously, tapping desks lightly even on non-selected students to create background noise.
      *   *Fix:* Instruct Auditors to verify you didn't tap more than the protocol allowed.

  2.  **The "Spoiler" Leak:**
      *   *Risk:* A student whispers "It's the Sleeping Beauty problem, answer 1/3!"
      *   *Fix:* Pre-empt this. In the intro, say: "Some of you may have heard of this puzzle. If you have, you are now an Auditor. Your grade depends on the class *not* knowing the solution until the end. If the solution leaks, you fail the audit."

  3.  **The "Why did we change numbers?" Confusion:**
      *   *Risk:* Students feel the game is rigged because the answer changed without new info.
      *   *Fix:* Lean into this. This *is* the lesson. Explicitly state in debrief: "In philosophy, we usually think evidence determines belief. Today you saw that **goals determine belief** when self-location is involved."

  4.  **Logistical Drag:**
      *   *Risk:* Passing slips takes too long.
      *   *Fix:* Have slips and pens on desks beforehand. Collection must be swift.

  ---

  ### Part 5: What This Activity Cannot Do (Honesty Check)

  You asked me to be straight about limitations.

  1.  **Memory Erasure:** The game simulates *informational isolation* (not knowing how many others are up), but it does not simulate *amnesia*. In the real thought experiment, Beauty knows she has been woken before if it's Tuesday. In your class, if a student is tapped twice (which they won't be, but hypothetically), they would remember. The game relies on *structural* amnesia (different students stand in for different awakenings), not *psychological* amnesia.
      *   *Debrief Fix:* Acknowledge this. "We used different bodies to simulate different moments in one mind. The math holds, but the 'creepiness' of being the same person twice is something you have to imagine."

  2.  **The "New Evidence" Argument:**
      *   Halfers argue Beauty learns nothing new upon waking (she knew she'd be woken). Thirders argue she learns "I am awake now."
      *   The game doesn't resolve this. It shows that *depending on how you score*, you act as if you learned something or didn't.
      *   *Debrief Fix:* "The game doesn't prove who is right. It proves that 'Who is right' depends on whether you think rationality is about being right per trial (Halfer) or per moment of experience (Thirder)."

  3.  **The Monday Arithmetic:**
      *   I verified your numbers.
      *   Thirder (Sum): $P(Mon) = 2/3$.
      *   Halfer (Average): $P(Mon) = 3/4$.
      *   *Warning:* This is dense for the last 10 minutes. Only run the "Monday Boss Round" if Round 1 and 2 went smoothly. If they are bogged down on why 1/3 vs 1/2, skip the Monday calculation and just describe it in the debrief.

  ### Final Recommendation

  Run **The Ledger Protocol** (Modified Mechanic 1). It is the only one where the algebra cleanly supports your hypothesis that the dispute is about indexing (Trial vs. Awakening) and aggregation (Sum vs. Average). It turns an abstract metaphysical stalemate into a concrete game-theoretic switch that the students flip with their own pens.

  Good luck. Watch the Auditors closely.
