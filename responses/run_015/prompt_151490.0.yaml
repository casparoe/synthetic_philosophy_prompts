answer: |-
  Dear Colleague,

  It is a familiar predicament to find oneself nodding along with Nozick in the seminar room only to feel a quiet rebellion on the walk home, and I want to reassure you immediately that your intuitions are not incoherent even if they do not map perfectly onto the libertarian orthodoxy you are teaching. What you are describing is not a failure of nerve but a recognition that the Wilt Chamberlain argument is doing less work than Nozick claims, specifically because it relies on background conditions that are often absent in the real world. Your proposed principle, that a holding is fine if it comes from actual choice and not fine if it comes from closing off options or unavoidable payments, holds together remarkably well, but it is not the principle Nozick thinks he is defending. Nozick argues that liberty upsets patterns, implying that any voluntary transfer is justified regardless of the outcome, but your intuitions suggest that liberty only justifies holdings if the background structure of acquisition and option availability remains fair. This means the Chamberlain argument does not refute your principle; rather, it refutes a cruder version of entitlement theory that ignores the Lockean proviso and the quality of consent.

  When you look at your verdicts through the lens of your stated principle, the second clause regarding closing off options or unavoidable payments is indeed functioning as a robust proviso on acquisition rather than a simple rule about transfers. This explains why the coastline case feels different from the oil case. In the oil case, the resource was under private land, presumably acquired without depriving others of what they previously used, whereas the coastline is a common resource that everyone previously had access to until the fence went up. Your principle correctly identifies that the coastline owner has enriched himself not merely through voluntary exchange but by altering the background conditions of everyone else's liberty, turning a public good into a private tollbooth. Nozick accepts a Lockean proviso that one cannot acquire so much that others are worsened, but he tends to assume that free markets rarely violate this, whereas your intuitions correctly flag monopolies on essential or common resources as violations even if the subsequent transactions are voluntary. Consequently, the Chamberlain argument only works for you in the first case because it assumes a background where no one is worsened by the exchange and where the consent is robust, which is why the mandatory surcharge and the micro-payment cases feel different to you.

  Regarding which verdicts your principle forces you to drop, the most glaring tension is in your hesitation over the third case, the default opt-out. If your principle requires that people actually chose to hand over the money, then a default enrollment where nearly nobody bothers to click is functionally identical to the mandatory surcharge, just with a lower transaction cost for dissent. Your principle should force you to say this is not fine, or at least not clearly fine, because the consent is passive rather than active. Conversely, your lack of confidence in the eighth case, the inheritance from the eccentric, seems unnecessary under your own principle. If the eccentric chose to hand over his property and the stranger did not close off any options to acquire it, the transfer meets both clauses of your test, so you should feel more confident calling it fine unless you suspect the flattery constituted a form of coercion or fraud. The verdict you should probably drop for reasons of your own, independent of the principle, is the distinction you draw in the ninth case regarding the boycott. You feel no obligation when the boycott is spontaneous but feel it is bad when organized for the purpose of starvation. While morally intuitive, this relies heavily on judging internal motives rather than external rights; if individuals have a right not to buy tickets, they have that right regardless of whether they coordinate via a spreadsheet or a wink, unless the coordination itself becomes coercive intimidation. Relying on intent makes the principle unstable, so you might do better to focus on whether the boycott involved threats or violence rather than mere collective refusal to trade.

  As for the tenth case, the automatic micro-payments, your principle predicts a clear verdict that you seem to be circling without landing on. If no one ever explicitly authorized the payment, then the first clause of your principle is violated because the money was not something people chose to hand over. It does not matter that the amounts are tiny; if the transfer lacks consent, it is theft, pure and simple. You should commit to calling this not fine, because accepting it would require you to abandon the core voluntarism that makes you agree with Nozick in the first place. Finally, regarding the new case you proposed, where a seller gets rich by starting a rumor that creates value for his product, your principle should predict that this is not fine. This falls under the umbrella of fraud, which vitiates consent. If the buyers are handing over money based on a false belief manufactured by the seller, they are not actually choosing to transfer wealth for the value they think they are getting; they are being manipulated. This is akin to closing off their ability to make informed choices, violating the spirit of your first clause just as the coastline case violates the second.

  In sum, you have not backed yourself into a corner so much as you have stumbled upon a more nuanced version of historical entitlement theory than the one typically presented in introductory seminars. Your intuitions are tracking a system that requires both voluntary transfer and just background conditions, which is a defensible and coherent position. You can tell your students that while Chamberlain shows that liberty upsets patterns, it does not show that liberty justifies all outcomes, particularly when those outcomes rest on monopolies, coercion, or fraud. You might consider framing the seminar around the tension between the purity of the transfer and the justice of the background, using your own walk-home variants to show where Nozick's optimism about the proviso might be misplaced. It is a stronger philosophical position to admit that voluntary exchange is necessary but not sufficient for justice, and it will save you from having to defend the indefensible aspects of the coastline or the micro-payment cases. I hope this helps you untangle the knot, and I would be keen to hear how the next seminar goes.

  Best regards,

  Your Colleague
