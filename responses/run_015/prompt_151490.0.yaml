      *   *Chamberlain Argument:* Nozick uses Chamberlain to attack *patterned* principles (like equality). He argues liberty upsets patterns. The professor's intuition isn't about preserving a pattern (since they accept unequal outcomes in Cases 4, 5, 8) but about the *process* (voluntariness + background fairness). So Chamberlain doesn't refute this principle; it supports it, provided the background conditions are met.

