  hey, this looks like a really solid angle for a seminar final. taking the "counter-polis" idea and pushing it against both the *Laws* and the *Symposium* forces students to stop treating Plato's view on wine as just "bad" or "good" and instead look at the functional role of vice in a political system. it's tricky enough that they can't just regurgitate lecture notes.

  here is the exam package you asked for. i've expanded the prompt into a full background briefing to hit that word count you wanted—it sets the stage so they know exactly what philosophical tension they're walking into. i kept the tone loose and skipped the formal citations like you said. there might be a typo or two in here, just to keep it feeling human.

  ***

  ### final exam prompt: the diagnostic function of intoxication in plato

  **course:** upper-level ancient philosophy seminar
  **time allowed:** 90 minutes
  **format:** take-home essay response

  **instructions:**
  read the following theoretical framing carefully. it proposes a specific interpretation of how plato handles the phenomenon of drunkenness across two very different dialogues. your task is not to simply summarize what plato says about wine, but to test this specific thesis against the textual evidence provided in the *Laws* and the *Symposium*. you need to argue whether this interpretation holds water or if it breaks down under scrutiny.

  **the theoretical framing: the counter-polis thesis**
  standard readings of plato often assume that when a person gets drunk, their inhibitions vanish and their true character is revealed. on this view, wine acts as a truth serum. however, the counter-polis thesis argues something more structural. it suggests that plato does not believe wine reveals a hidden true self. instead, the symposion creates a temporary anti-polis where reason is deliberately suspended. this is not an accident or a mere indulgence. the city uses this inversion diagnostically. the state allows the law's grip to be loosened not because citizens show their real nature in chaos, but so the rulers can observe how citizens behave when the normal structures of shame and fear are removed. the goal is to calibrate education to the fragility witnessed during these tests. essentially, drunkenness is instrumentalized. it becomes a civic tool rather than a moral danger, provided it is strictly regulated by the state. the chaos is manufactured so it can be measured.

  **textual context one: the laws, books one and two**
  in the *Laws*, the athenian stranger spends a significant amount of time defending the practice of regulated drinking parties. he argues against the spartan model which bans wine entirely. the stranger suggests that just as a ship captain needs to know how his ship handles in a storm, a legislator needs to know how citizens handle passion. he proposes that older, wiser citizens should preside over these parties to ensure they don't descend into actual violence, but the younger citizens are encouraged to drink to the point where their shame is loosened. the text suggests this is a training ground for courage. it is a safe space to practice resisting the pull of pleasure and pain. if the counter-polis thesis is correct, these passages are not about enjoying wine. they are about stress-testing the soul. the stranger implies that a citizen who cannot maintain their education when drunk is defective. the drinking party is a laboratory for virtue. however, you need to ask if the text supports the idea that this is purely diagnostic. does the stranger ever suggest there is intrinsic value in the relaxation itself, or is it purely a tool for the state to measure courage and shame?

  **textual context two: the symposium and alcibiades**
  the *Symposium* presents a different problem. here, the drinking is not regulated by a state legislator but follows the customs of a private gathering. the climax of the dialogue involves the arrival of alcibiades, who is heavily intoxicated. he bursts in and delivers a speech that is chaotic, emotional, and deeply revealing about his relationship with socrates. on the surface, this looks like the truth serum model. alcibiades says things drunk that he would never say sober. he exposes his own ambition and his failure to follow socrates. however, the counter-polis thesis would argue that this disruption is necessary for the dialogue to reach its conclusion. the orderly speeches of the earlier guests are overturned by this drunk entrance. it creates a moment of anti-polis within the gathering. but here, there is no athenian stranger controlling the flow. there is no state calibration happening. alcibiades reveals fragility, but no one is there to fix the education system based on it. socrates remains sober throughout, which complicates the idea of a shared diagnostic test. if the counter-polis thesis relies on state regulation to make drunkenness useful, does the *Symposium* undermine the thesis by showing drunkenness as purely disruptive when left outside the *Laws* framework? or does alcibiades failure prove the need for the regulations found in the *Laws*?

  **the specific task**
  your essay must address three specific questions based on the framing above. first, does the counter-polis thesis actually fit these texts? you need to look for evidence where plato suggests the purpose of drinking is observation and calibration versus evidence where he suggests it is about revelation or pleasure. second, does this interpretation turn drunkenness into a civic tool rather than a moral danger? if Plato thinks wine is dangerous, can it ever be a tool? you need to explain how the danger is managed or if the thesis ignores the moral risk entirely. third, and this is the most important part, imagine a culture that adopted institutionalized drinking rituals purely as stress-tests for civic virtue. they never drink for pleasure or celebration. it is always a test. would plato think that culture made a wise choice? or has it confused a diagnostic instrument with a form of life? this asks you to evaluate the limits of the thesis. if you turn every human activity into a test for the state, do you lose the humanity required to be a good citizen?

  **expectations for the response**
  you should write a coherent essay that moves through these points logically. do not just list answers. you need to weave the evidence from the *Laws* and the *Symposium* into your argument about the counter-polis thesis. remember, you are assessing a specific interpretation, not just writing about Plato on wine. you can agree with the thesis, disagree with it, or argue that it works for one text but not the other. what matters is how well you use the texts to support your assessment. avoid generalizations about Plato's metaphysics unless they directly relate to the question of drunkenness and civic order. keep your focus on the political and educational function of the symposion. you have ninety minutes to construct this argument, so be concise but thorough. make sure you define what you mean by civic tool versus moral danger early on so your reader knows where you stand. if you argue that Plato would reject a culture that only drinks for testing, you need to explain what part of human life Plato thinks is being lost in that scenario. is it the spirited part of the soul? is it the capacity for friendship? use the texts to ground these claims.

  good luck. dig into the details and dont just skim the surface of the drinking laws.

  ***

  ### model answer outline (5 moves for an A grade)

  *   **move 1: validate the diagnostic element in *Laws* but challenge the "anti-polis" label.**
      *   acknowledge that the athenian stranger does treat drinking as a test of character and a way to practice resisting pleasure. however, argue that calling it an "anti-polis" is slightly off. it's more like a *gymnasium* for the soul. it's still within the law's grip, just a different kind of law. the reason isn't suspended; it's being trained to fight passion.
  *   **move 2: contrast this with the *Symposium* to show the limits of regulation.**
      *   point out that alcibiades drunk speech *does* reveal truth, but it's destructive truth. without the regulators from the *Laws*, the diagnostic tool breaks. this supports the thesis that wine needs state control to be useful, but undermines the idea that wine *itself* is the tool. the tool is the regulation, not the wine.
  *   **move 3: address the civic tool vs. moral danger binary.**
      *   argue that Plato doesn't see these as opposites. it's a civic tool *because* it is a moral danger. if it weren't dangerous, it wouldn't test courage. the thesis is right that it's instrumental, but wrong to think Plato thinks the danger disappears. the danger is the point of the test.
  *   **move 4: evaluate the hypothetical culture (instrument vs. form of life).**
      *   argue that Plato would reject a culture that *only* drinks for testing. in the *Laws*, the stranger talks about friendship and bonding among citizens. if you remove pleasure and celebration, you remove the social glue that makes the city hold together. a city of pure stress-tests is too rigid.
  *   **move 5: conclude on the role of pleasure in education.**
      *   finalize the argument by stating that Plato sees pleasure as something to be harmonized with reason, not just tested against it. the counter-polis thesis is half-right: it sees the diagnostic value, but misses the educational goal of learning to enjoy the right things, not just resisting the wrong ones.

  ***

  ### marking scheme (total 20 marks)

  1.  **analysis of *Laws* as training vs. anti-polis (4 marks)**
      *   *classic mistake:* students claim the *Laws* drinking parties are lawless zones rather than regulated training grounds.
  2.  **contrast with *Symposium* Alcibiades scene (4 marks)**
      *   *classic mistake:* treating alcibiades speech as purely positive revelation without noting the chaos it causes.
  3.  **engagement with civic tool vs. moral danger distinction (4 marks)**
      *   *classic mistake:* arguing Plato thinks wine becomes safe when regulated, rather than remaining dangerous by design.
  4.  **evaluation of the hypothetical "stress-test only" culture (4 marks)**
      *   *classic mistake:* saying Plato would approve because he loves order, ignoring the need for social bonding and pleasure.
  5.  **clarity of thesis and use of textual evidence (4 marks)**
      *   *classic mistake:* summarizing the plot of the dialogues instead of arguing for or against the counter-polis framing.
