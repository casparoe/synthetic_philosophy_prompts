      *   *Wait, re-reading:* "Include at least one worked case where the procedure returns an answer I will not like." Okay, I need to be bold. Let's say the procedure dismisses Case 1 because 12 trivial remarks don't meet the "Severe OR Repeated" threshold *without corroboration of hostility*. This protects the firm from liability based on subjective feelings but might feel unjust. Or, conversely, it sustains Case 2 as a violation even though it wasn't "repeated," relying on "Severe." That's usually liked. Let's go with the Dismissal of Case 1 due to lack of *objective* hostility markers, forcing the "Unliked" result to be the protection of the accused against vague accumulation.

  5.  **Addressing the Theoretical Commitment:**

      *   The procedure will implicitly rely on **Supervaluationism** (for clear cases) mixed with **Contextualism** (fixing the standard).
      *   Rival: **Epistemicism**. If we were Epistemicists, we would assume there *is* a specific number (e.g., 8 remarks) that constitutes harassment, we just don't know it. We would try to find that number. My procedure rejects finding the number and focuses on the *property* of the environment.
      *   Rival: **Degree Theory**. We would assign a "truth value" (0.8 violation). My procedure forces a binary decision for administrative closure, except for the hand-off.

  6.  **Refining the Hazards:**

      *   *Sorites:* Solved by shifting focus from "count" to "environmental state."
      *   *Ratchet:* Solved by anchoring to policy text, not prior verdicts.
      *   *Disagreement:* Solved by classifying disagreement as "Penumbral," triggering a hand-off, not an error.

