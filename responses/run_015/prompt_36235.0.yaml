  2.  **Deconstruct the Philosophy of Vagueness for Practice:**

      *   *Sorites Paradox:* The idea that small changes don't matter (tolerance) leads to absurdity (no amount of remarks constitutes harassment). *Solution:* We need a "cut-off" but acknowledge it's somewhat arbitrary or context-dependent. We can't rely solely on "one more doesn't matter." We need to look at the *cumulative effect* rather than just the count.
      *   *Epistemicism:* There is a sharp boundary, we just don't know where it is. *Practical implication:* Don't pretend we know exactly where the line is. Acknowledge uncertainty but make a decision based on the *weight* of evidence relative to a standard.
      *   *Supervaluationism:* A statement is true if it's true on all "precisifications" (ways of making the vague term precise). *Practical implication:* If *every* reasonable interpretation of "hostile" finds this conduct hostile, it's a violation. If *none* do, it's not. If some do and some don't, it's a "gap" (borderline).
      *   *Contextualism:* The standard shifts based on context. *Practical implication:* We need to fix the context (the "comparison class") to prevent the Ratchet.
      *   *Degree Theory:* Truth comes in degrees. *Practical implication:* Use a scoring or weighting system rather than binary checkboxes for every element.

      *Synthesis for the Procedure:* A hybrid approach works best for bureaucracy.
      *   Use *Supervaluationism* for the "Clear Cut" cases (True on all precisifications = Violation; False on all = Dismissal).
      *   Use *Contextualism* to fix the "Reasonable Person" standard (prevent Ratchet).
      *   Use *Degree Theory* logic for the "Cumulative" aspect (overcoming Sorites).
      *   Acknowledge *Epistemic* limits for the "Hand-off" (where values decide).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Under 1 hour. No jargon.
      *   *Structure:* Intake -> Fact Check -> Severity/Repetition Assessment -> Contextual Calibration -> Verdict/Hand-off.
      *   *Addressing Sorites:* Don't ask "Is instance X bad?" Ask "What is the aggregate impact?" Break the tolerance chain by focusing on the *result* (hostile environment) rather than the *input* (count of remarks).
      *   *Addressing Ratchet:* Fix the "Reasonable Person" anchor. Do not compare to *past cases* primarily; compare to the *policy standard*. Past cases are only for consistency checking, not definition setting.
      *   *Addressing Disagreement:* If two investigators disagree, it's a "Penumbral Case." Route to a senior reviewer or committee. This isn't a defect; it's a feature of vagueness.

