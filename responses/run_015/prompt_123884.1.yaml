      *   *Real Essences:* The underlying constitution (corpuscularianism) that causes observable qualities. Generally unknowable for substances.
      *   *Universals:* Exist only as words/signs signifying general ideas. Particular things exist; universals are tools of the mind.
      *   *Knowledge:* Limited to the agreement/disagreement of our ideas. Real knowledge requires perceiving the connection between ideas and reality (which is hard for substances).
