answer: |-
  # Taxonomy of Archival Silence: A Decision Tree

  **Instructions:** Follow the path below based on how you answer each concrete question. Do not worry about matching a theorist yet; answer based on your intuition about a specific case (e.g., a blank row in a 19th-century census).

  ### Node 1: The Nature of the Gap
  **When you encounter a silence (e.g., a blank census record), is this a missing file in a basically complete container, or is the gap itself part of how the archive functions?**
  *   **A. Missing File:** The archive *should* have this data; the silence is an error or loss. (Go to Node 2A)
  *   **B. Constitutive Absence:** The silence is structural; the archive produces silence as part of its logic. (Go to Node 2B)

  ---

  ### Node 2A: The Cause (Container View)
  **If the file is missing, is this due to a specific exercise of power (censorship, exclusion), or a neutral accident (decay, fire, never-written)?**
  *   **A1. Neutral Accident:** It rotted away or wasn't saved due to negligence, not malice. (Go to Node 3A)
  *   **A2. Exercise of Power:** Someone actively suppressed or excluded this record. (Go to Node 3A)
  *(Note: For Container views, the obligation is usually the same regardless of cause, so we merge paths here to avoid redundancy.)*

  ### Node 2B: The Cause (Constitutive View)
  **If the silence is structural, is it traceable to an exercise of power, or is it a non-political structural condition?**
  *   **B1. Exercise of Power:** The structure itself is built on oppression/exclusion. (Go to Node 3B)
  *   **B2. Non-Political Structure:** The silence is ontological or technical, not necessarily oppressive. (Go to Node 4B)

  ---

  ### Node 3A: The Obligation (Container View)
  **What is our primary obligation to the silent subject: to recover the truth about them (epistemic), or to change how future documentation happens (political)?**
  *   **A1. Epistemic (Recover Truth):** We must find the missing data or approximate it. (Go to Node 4A)
  *   **A2. Political (Change Future):** We must fix the system so this doesn't happen again. (Go to Node 4A)

  ### Node 3B: The Obligation (Constitutive + Power)
  **What is our primary obligation: to recover the truth (epistemic), or to change the system (political)?**
  *   **B1. Epistemic:** We must read the silence as a trace of what cannot be known. (Go to Node 4B)
  *   **B2. Political:** We must dismantle the archival structure that produces this silence. (Go to Node 4B)

  ---

  ### Node 4A: Digitization (Container View)
  **Does mass digitization reduce this silence, or shift its topology?**
  *   **Final Leaf 1:** **Old-School Empiricist** (Accident + Epistemic + Reduces)
      *   *Commitment:* Believes technology neutralizes decay; silence is just a puzzle to be solved.
  *   **Final Leaf 2:** **Restorative Activist** (Power + Political + Reduces)
      *   *Commitment:* Believes digitization is a tool for access justice; assumes gaps can be filled by community input.
  *   **Final Leaf 3:** **Techno-Optimist Historian** (Power + Epistemic + Reduces)
      *   *Commitment:* Assumes algorithms can recover suppressed data without changing the underlying power structure.

  ### Node 4B: Digitization (Constitutive View)
  **Does mass digitization reduce this silence, or shift its topology (often making it worse/new)?**
  *   **Final Leaf 4:** **Foucauldian Critic** (Power + Political + Shifts)
      *   *Commitment:* Digitization extends surveillance; silence is resistance against total datafication.
  *   **Final Leaf 5:** **Derrida-Adjacent (Archive Fever)** (Power + Epistemic + Shifts)
      *   *Commitment:* Truth is impossible; digitization amplifies the "technical unconscious" of the archive.
  *   **Final Leaf 6:** **Critical Data Studies** (Power + Political + Worsens)
      *   *Commitment:* Digitization codifies bias; structural silence becomes algorithmic erasure.
  *   **Final Leaf 7:** **'Negative Provenance'** (Non-Political Structure + Worsens)
      *   *Commitment:* **See special note below.**

  ---

  ### Special Note: The 'Negative Provenance' Position
  **Path:** Constitutive Absence → Non-Political Structure → Digitization Worsens.

  **Label:** **Negative Provenance** (Unnamed/Theoretical Void)

  **Why it is unexplored:**
  This position is theoretically unstable in current scholarship. Most theorists who argue absence is *constitutive* (structural) link that structure directly to *power* (colonialism, patriarchy, statecraft). If you remove power as the cause (Node 2B, Option B2), you usually fall back into the Empiricist view that silence is just an accident (Node 2A).

  **The Awkward Commitment:**
  To hold this position, you must argue that the archive structurally requires silence due to something other than oppression (e.g., the nature of signification, entropy, or technical ontology), AND that digitization amplifies this non-political gap. It is an **ontological pessimism without a political villain.** It suggests we are doomed to silence not because someone oppressed us, but because the medium itself cannot hold the signal, and technology makes the noise louder. No major camp defends this because it removes the possibility of political redemption.
