prompt: |-
  I'm trying to figure out my actual view on how bad different food choices are for animals, going by gut reactions to specific comparisons. Eating beef from a feedlot feels worse than chicken, even though chicken lives are shorter and more birds die per pound -- maybe because cows suffer longer? But then grass-fed beef that lives two years on pasture feels worse than feedlot beef killed at 18 months, even though the grass cow had a nicer life, just because tractors and predators kill more wild animals over that longer span? I'm genuinely unsure which way that goes.

  Then crop death. Rice feels worse than wheat, not because rice plants suffer but because paddies kill frogs and insects? Actually I think wheat fields kill more rodents per acre with combines, while rice in some regions is hand-harvested, but I'm not sure. Either way I think wild suffering from farming should count, but I don't think it's worse just because it's "natural" -- like predators attracted to fields. But I do think pesticide death is morally worse than habitat-loss death with the same numbers, because there's more direct human agency? That feels inconsistent.

  Then there's the egg thing. One egg is less bad than one chicken, obviously, since the hen lives. But if you could geneticaly engineer chickens to live happily and lay infinitely many eggs without suffering, eating those eggs seems basically fine, maybe even good if it replaces worse food. But if you could engineer a cow that doesn't suffer at all but lives ten years on grass, killing it for beef still feels wrong in a way that killing the engineered chicken for meat wouldn't -- or maybe it wouldn't? I flip-flop.

  Also I think beef is worse than chicken per calorie, but chicken is worse per dollar because it's cheaper, so you cause more suffering on the same budget. So the principle can't just be "minimize suffering per unit of food."

  Is there one principle that gets all this, or close? Lay out the best candidate or two, state it precisely, say what case motivates each clause, and tell me what it predicats for lab-grown shrimp versus wild-caught shrimp, which I haven't thought about. And please be honest: which of my gut feelings does it have to throw out? I'm especially stuck on the engineered cow versus chicken case, and whether direct agency really makes pesticide suffering worse.
