answer: |-
  ### Requirements

  1.  **Capacity-Wellbeing Distinction:** The theory must distinguish physiological capacity from overall wellbeing. **Motivation:** Case (i) involves a variant lowering capacity but raising wellbeing. For insurance purposes, we must know if we are funding capacity restoration or wellbeing enhancement. If the theory collapses these, coverage decisions become indeterminate between medical necessity and quality-of-life subsidies. **(Non-negotiable)**

  2.  **Statistical vs. Modal Normality:** The theory must specify whether health references current statistical typicality or species-typical design. **Motivation:** Case (ii) involves a universal intervention lowering capacity. If health is purely statistical, this becomes healthy; if modal, it remains a deficit. Funding depends on this baseline. Without this specification, the theory cannot adjudicate whether universal iatrogenic effects constitute disease. **(Non-negotiable)** **[Function-dependent]**

  3.  **Temporal Gradability:** The theory must determine if health is a current state or a longitudinal disposition. **Motivation:** Case (iii) involves an asymptomatic pre-symptomatic person. Insurance needs to know if coverage triggers before symptoms manifest. If health is only a current state, pre-symptomatic conditions are not diseases; if dispositional, they are. This dictates preventive care funding. **(Non-negotiable)**

  4.  **Disease-Severity Separation:** The theory must classify the presence of disease independently from its severity. **Motivation:** Insurance lists need binary entry criteria distinct from tiered funding levels. Collapsing these prevents clear eligibility rules. A condition must be identifiable as a disease even if mild, otherwise coverage thresholds become arbitrary rather than principled. **(Non-negotiable)**

  5.  **Organism-Part Distinction:** The theory must distinguish the health of the whole organism from the health of specific traits or organs. **Motivation:** A trait may be dysfunctional while the organism thrives (Case i). Funding might target the trait or the person; the theory must allow this separation. Failure here conflates genetic counseling with acute care budgets. **(Preference: Naturalist Camp)** **[Function-dependent]**

  6.  **Disease-Injury Distinction:** The theory must differentiate endogenous pathological processes from exogenous physical damage. **Motivation:** Research funding often separates chronic disease management from trauma care. Collapsing these obscures budgetary allocation. While both reduce function, the etiology determines whether research targets prevention or repair mechanisms. **(Preference: Medical Camp)**

  7.  **Value-Neutrality Constraint:** The theory must specify whether health judgments entail moral or prudential values. **Motivation:** If health implies 'badly off' (Case i), insurance becomes welfare policy. If value-neutral, it remains technical. This determines legal mandates. A theory must declare if 'disease' inherently implies a reason for intervention or merely a biological fact. **(Preference: Naturalist Camp)**

  8.  **Empirical Consistency:** The theory must not contradict established physiological data regarding survival and reproduction. **Motivation:** Any account claiming a lethal condition is 'healthy' contradicts biological facts used in actuarial tables. Insurance relies on risk assessment; a theory incompatible with mortality data cannot serve the classificatory job of funding allocation. **(Non-negotiable)**

  ### Conflicts

  Several subsets of these requirements appear jointly unsatisfiable. Specifically, Requirements 2 (Statistical Normality) and 7 (Value-Neutrality) clash when applied to Case (ii). If health is strictly statistical (Req 2), the universal intervention creates a new normal, rendering the lowered capacity healthy. However, if health requires absence of harm (Req 7), the lowered capacity remains diseased despite being typical. A theory cannot maintain strict statistical naturalism while also satisfying the intuition that universal harm is still pathological.

  Additionally, Requirements 3 (Temporal Gradability) and 8 (Empirical Consistency) generate tension regarding Case (iii). If health is a disposition (Req 3), the asymptomatic person is unhealthy. However, empirically (Req 8), their current physiological metrics are normal. A theory must choose between contradicting current empirical data to preserve dispositional status or contradicting the dispositional nature of disease to preserve empirical accuracy. Satisfying both simultaneously requires a complex dual-aspect theory that many standard accounts lack.

  ### The binding constraint

  Requirement 3 (Temporal Gradability) acts as the binding constraint that rules out the most candidates. It forces a theory to choose between health as a snapshot state or a life-course disposition. Biostatistical naturalism struggles here, as it typically defines health via current functional efficiency, leaving pre-symptomatic conditions in a limbo that undermines preventive funding. Normativist views often handle this better by referencing future goals, but at the cost of objectivity. This requirement does the most work because it dictates the metaphysical category of health itself; until a theory decides whether health is a state or a propensity, it cannot generate the stable lists required for insurance eligibility.

  ### Scorecard

  | Requirement | Boorse (Biostatistical) | Wakefield (Harmful Dysfunction) | Normativist (Vital Goals) |
  | :--- | :--- | :--- | :--- |
  | **1. Capacity-Wellbeing** | Pass (Distinguishes) | Pass (Distinguishes) | Fail (Collapses) |
  | **2. Statistical/Modal** | Pass (Statistical) | Pass (Mixed) | Fail (Normative) |
  | **3. Temporal** | Fail (State-based) | Pass (Disposition) | Pass (Goal-based) |
  | **4. Disease-Severity** | Pass | Pass | Pass |
  | **5. Organism-Part** | Pass | Pass | Fail |
  | **6. Disease-Injury** | Pass | Pass | Pass |
  | **7. Value-Neutrality** | Pass | Fail (Harm) | Fail (Goals) |
  | **8. Empirical** | Pass | Pass | Fail |
  | **Verdict** | **Fails Temporal** | **Fails Neutrality** | **Fails Empirical** |
