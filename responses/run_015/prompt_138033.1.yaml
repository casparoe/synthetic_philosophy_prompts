      *Focus on Meera's counter:* Accuracy isn't neutral.

      *Ending:* They agree to fix the target variable (rearrest vs reoffend), but disagree on whether that removes the need for a mandated fairness constraint. Ravi says "wait and see." Meera says "commit now."

      *Let's tighten.*

