  4.  **Developing the Argument (Mental Check):**
      *   *Math Check:* If base rates differ, Calibration + Equal FPR + Equal FNR is impossible.
      *   *Ravi's point:* If Accuracy = 100%, FPR/FNR = 0, Calibration holds. So improve accuracy.
      *   *Meera's point:* Accuracy won't be 100%. Who bears the error?
      *   *Measurement Error:* If "rearrest" != "reoffending", and policing differs, the base rate gap is partly fake. Does fixing the label fix the base rate gap? If base rates equalize, the trilemma loosens (you can have more metrics satisfied). But if measurement error remains, it's still imperfect prediction.
      *   *Ravi's take on Wrinkle:* Fix the label, improve prediction, problem shrinks.
