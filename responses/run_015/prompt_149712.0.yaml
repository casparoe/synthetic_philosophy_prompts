  In Oakhaven, the worker-owned Rising Loaf operates under the Covenant of Clear Names, where admitting personal fault is banned as "self-indulgent negativity." When baker Elias scoops mislabeled almond flour instead of coconut, causing Mrs. Gable's throat to tighten slightly before antihistamines fix it, the town witnesses the coughing fit. Per protocol, no one says "I messed up"; instead, the Shift Lead pins Elias's name to the public Accountability Slate outside the hall, marking a status decrement for endangering the collective. Elias, now visually marked as unsafe, avoids the storefront to dodge the neighbors' pitying stares, leaving the reciepe uncorrected and Mrs. Gable unsure if she can trust the bread again, because the ritual punished his standing rather than fixing the flour bin.

  **The Check**

  **Guilt-path:** Elias acknowledges error -> labels bin -> apologizes -> trust restored.
  **Shame-path:** Elias named -> status drops -> hides -> trust rots.
  **Why Guilt Fits:** The harm is minor and correctable. Guilt targets the *act* (the bin), allowing repair. Shame targets the *self* (the worker), blocking reintegration.
  **Feature:** The Repairability-Visibility Combo. The harm was visibile, but the fix required private trust which shame destroys.
  **Defender's Attack:** A Covenant advocate argues shame keeps stakes high; guilt lets bakers get "soft" and repeat errors because forgiveness is too easy. They claim status loss ensures collective vigilance better than private remorse.
  **Verdict:** You can't engineer this away. Guilt is foundational to social bonding. Suppressing it doesn't remove the feeling, it just drives it underground where it metastasizes into toxic shame, making repair impossible. The emotional architecture is too deep.
