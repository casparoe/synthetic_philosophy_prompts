  3.  **Drafting the Content (Iterative Process):**

      *   *Attempt 1:* The impasse is largely verbal but rooted in substantive metaphysical commitments. Both sides agree brains construct predictive models (the "API"). The dispute concerns whether the "runtime experience" is identical to that function or an ontological extra. Illusionists (Dennett) claim qualia are misrepresentations; realists (Chalmers) argue functional accounts leave out "what it is like." This isn't just explanatory standards; it's about causal closure. If qualia are irreducible, physicalism faces a hard problem. If they are illusions, physicalism holds. Progress requires either an empirical bridge showing how function generates feeling (currently missing) or a conceptual dissolution showing the "hard problem" is a category error. Currently, the question might be ill-posed because we lack a neutral vocabulary to describe experience without presupposing realism or illusionism. The stall suggests we are conflating epistemic access with ontology.

