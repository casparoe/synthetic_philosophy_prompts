answer: |-
  You are not wrong. You have stumbled into a classic art historical ethical dilemma, and your instincts are sharper than the Director's. However, your initial proposal (simply swapping the name) plays into the trap the other board member identified.

  Here is the breakdown of where the Director is wrong, where the Board Member has a point, and how you should structure your three minutes to navigate the politics without sacrificing the truth.

  ### 1. Is the Director Right?
  **No.** His argument rests on two flaws.

  *   **The "Object" vs. The "Work":** He claims the object is the same, so the value is the same. In a museum context, this is false. An artwork is not just physical material; it is a historical document. If you discover a painting thought to be a Rembrandt is actually by his student, the *paint* hasn't changed, but the *artwork* has. Its meaning changes because art is a conversation between the viewer and the creator's history. Hiding that history turns the museum into a theme park, not an educational institution.
  *   **The Etching Inconsistency:** He is wrong to dismiss the etching comparison as "splitting hairs." While posthumous prints from original plates are standardly attributed to the plate-maker (Delia), the museum's acceptance of Margaret's labor there while rejecting her authorship of the paintings reveals a bias. They accept her labor when it serves Delia's legacy (printing the plates) but erase her creativity when it challenges Delia's genius (painting the canvases). The pattern is the erasure of Margaret.

  **However,** he is right about one thing: Your perception *has* changed because of the label. But that isn't a reason to ignore the truth; it is proof of why the label matters. Museums teach us how to see. If the label lies, the museum is teaching a lie.

  ### 2. Is the Board Member Right?
  **Partially.** They argued that hanging Margaret's work instead of Delia's still "values the signature." They mean that swapping one famous name for another still ignores the actual paint on the canvas. If the painting is beautiful, it should be valued regardless of the name.

  **Your Counter:** We aren't swapping names to change the *value*; we are changing the name to fix the *record*. The goal isn't to make Margaret famous; it's to stop making Delia responsible for work she didn't do.

  ### 3. Strategy for Thursday
  You have three constraints:
  1.  **Time:** 3 minutes (approx. 400–450 words).
  2.  **Politics:** The Granddaughter will resign if Delia is "demoted."
  3.  **Mission:** The museum exists to honor Delia Vance.

  **Do not propose a binary switch.** Do not ask them to take Delia's name off and put Margaret's on. That triggers the Granddaughter and validates the Director's fear of "taking something away from the town."

  **Propose a "Collaborative Narrative."**
  The evidence suggests a workshop dynamic: Margaret's composition, Margaret's hand, Delia's oversight, Delia's signature, and possibly Delia's touch on the sky. This is not a forgery; it is a collaboration obscured by gender bias (the dealer wouldn't look at Margaret).

  **Your Ask:**
  1.  **Update the Label:** Change the attribution to reflect the complexity (e.g., *"Margaret Vance, with Delia Vance"* or *"Vance Studio"*), accompanied by a brief text explaining the sisters' working relationship.
  2.  **The Exhibition:** Hang Margaret's stored canvases *not* to replace Delia, but to contextualize her. Create a small display: "The Vance Sisters: A Legacy." This honors Delia (she is still central) but reveals the truth (Margaret was the engine).
  3.  **The Committee:** Ask the board to form a small curatorial committee to finalize the wording. This slows the process down, lowers the temperature, and gives the Granddaughter a voice in *how* the truth is told, rather than *if*.

  ### 4. Draft Script for Your 3 Minutes
  *Speak slowly. Be respectful. You are the messenger, not the judge.*

  "Good evening. I stand before you not as an expert, but as someone who loves this museum enough to read every file in the basement.

  We all agree that the bluff painting is the heart of this collection. For fifty years, it has represented Delia Vance's genius to this town. The Director argues that changing the label changes nothing but paperwork. I respectfully disagree. A museum's job is not just to display objects, but to tell the truth about them. If we know a painting is by Margaret, keeping Delia's name on it doesn't protect Delia's legacy; it turns her into a fraud.

  The Director says the etchings are different. But the pattern is the same: Margaret's labor is welcome when it supports Delia's name, but her creativity is hidden when it challenges it. The dealer wouldn't look at Margaret's work in the 1930s because she was a woman. Do we want this museum to uphold that bias in 2024?

  The Board Member warned against valuing the signature over the art. I agree. But accuracy isn't about value; it's about history. This isn't a forgery. It is a collaboration. Margaret painted the composition; Delia signed it and perhaps touched the sky. They were partners.

  So, my proposal is not to erase Delia. It is to expand the story.
  First, update the attribution to reflect the evidence: *'Margaret Vance, with Delia Vance.'*
  Second, hang Margaret's three stored canvases alongside it. Not to replace Delia, but to show us what Margaret could do on her own.
  Third, let us tell the town that the Vance legacy is bigger than we knew. It wasn't one woman; it was two sisters who kept this art alive.

  We can keep the town's love for this painting while giving Margaret her due. We don't have to choose between truth and legacy. We can have both. Thank you."

  ### Final Advice
  *   **The Granddaughter:** By framing this as "expanding the legacy" rather than "correcting an error," you give the Granddaughter a way to stay. She isn't losing her grandmother; she's discovering her great-aunt.
  *   **The Director:** You are validating his fear (that people love the painting) while correcting his principle (that truth doesn't matter).
  *   **The Board Member:** You are agreeing that the art matters, but arguing that history *is* part of the art.

  You are doing the right thing. Good luck.
