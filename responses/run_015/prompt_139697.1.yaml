      *Wait, one nuance:* The etchings. Posthumous prints from original plates are standardly attributed to the artist who made the plates (Delia), even if printed by someone else (Margaret). That's standard practice. The painting is different because the *image creation* (composition/execution) was Margaret's, not just the printing. I need to make sure the user distinguishes this correctly so they don't sound like they don't understand printmaking. The key is *authorship of the image* vs. *production of the object*.
      *Correction:* The prompt says "printed from Delia's own copper plates." So Delia made the image. Margaret just pulled the ink. That *is* different from Margaret painting the canvas. The Director's comparison is weak, but the distinction is technical. I should advise the user to acknowledge the difference but highlight the *pattern* of erasing Margaret's labor.

