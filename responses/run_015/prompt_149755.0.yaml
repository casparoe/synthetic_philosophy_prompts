          *   *Data:* He might view data collection as a form of inspection (Panopticon logic). If it secures trust, good. If it exploits, bad.
          *   *Conclusion:* Likely support regulation if "sinister interests" cause net pain.
      *   **Section 3: Multi-Party Domestic Contracts (The Speculative Application):**
