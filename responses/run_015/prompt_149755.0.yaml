      *   **Tone:** Academic, rigorous, nuanced, faithful to Bentham's core principles while acknowledging historical distance.

  2.  **Deconstruct Bentham's Core Commitments (Settled Ground):**
      *   *Principle of Utility:* Actions/laws are right insofar as they promote the greatest happiness for the greatest number. Pain and pleasure are the sovereign masters.
      *   *Harm Principle (Proto-Mill):* Law should only interfere to prevent harm to others. Private vices that cause no public harm are generally outside legislative reach (though Bentham is more paternalistic than Mill in some readings).
      *   *Anti-Natural Rights:* Rights are created by law to serve utility, not pre-existing metaphysical entities.
      *   *Sexuality Writings:* Bentham wrote extensively (though unpublished in his lifetime) arguing against the criminalization of "irregular" sexual acts (including homosexuality), primarily on the grounds that they produce no pain to others and often produce pleasure for the participants. He viewed moral condemnation based on "antipathy" as irrational.
      *   *Contract & Law:* Law is a tool for structuring expectations and security. Contracts are useful insofar as they create stability and maximize welfare.

  3.  **Analyze Phenomenon 1: Algorithmic Partner-Matching Platforms:**
      *   *Benthamian Lens:* Do these platforms maximize pleasure/minimize pain?
      *   *Efficiency Argument:* They reduce search costs, increase chances of connection (pleasure). Bentham liked efficiency and scientific management.
      *   *Harm Argument:* Data exploitation, manipulation of desire (engagement optimization over welfare), psychological harm (addiction, dissatisfaction). Bentham was sensitive to "fictitious entities" and deception. If the algorithm creates false expectations or exploits vulnerabilities, it generates pain.
      *   *Speculative Leap:* Bentham didn't know about big data. Would he see data as property? As a source of influence?
      *   *Scholarly Nuance:* Bentham's Panopticon suggests he was okay with surveillance *if* it served reform/utility. But commercial surveillance for profit might differ.

  4.  **Analyze Phenomenon 2: Multi-Party Domestic Contracts:**
      *   *Benthamian Lens:* Contractual freedom vs. Protection from harm.
      *   *Liberty Argument:* If adults consent and it increases their happiness (sexual, economic, emotional), the state shouldn't ban it. This aligns with his unpublished essays on sexuality.
      *   *Complexity/Harm Argument:* Multi-party contracts are complex. Power asymmetries (economic, emotional) could lead to coercion. Enforcement is difficult. If one party is harmed (e.g., child welfare, economic abandonment), the state has an interest.
      *   *Scholarly Nuance:* Bentham was a legal positivist. He believed law *creates* rights. So, the question isn't "do they have a right to polygamy?" but "would codifying this create more utility than banning it?"
      *   *Sexuality Consensus:* Scholars agree Bentham was pro-decriminalization of private acts. Disagreement exists on how far he would go regarding *public* recognition vs. *private* tolerance.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the prompt's sophistication. State the goal: applying Bentham's utility calculus to modern contexts while marking the boundary between text and extrapolation.
