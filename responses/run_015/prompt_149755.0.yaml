          *   *Vulnerability:* He was concerned with the "weak" against the "strong." If plural marriage creates structural vulnerability (e.g., for women or children, a common 19th-century worry he might share or refine), he might hesitate.
          *   *Sexuality:* He distinguished between private acts and public status. He might support private freedom but demand rigorous legal safeguards for public contracts.
      *   **Section 4: Scholarly Disagreements & Limitations:**
