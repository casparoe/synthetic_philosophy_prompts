answer: |-
  Mark is a senior analyst at a bustling marketing firm who discovers a cracked support beam in the office that could collapse during a storm. He possesses a deep, unshakeable institutional loyalty, viewing the company's reputation as his own moral identity, so much so that no amount of deliberation from his current desires could ever recommend exposing the flaw without feeling like betrayal. He decides to stay quiet, convincing himself that he's simply too risk-averse to jeopardize his paycheck, but this is a self-deception; in reality, he wouldn't care about losing the income, as his loyalty outweighs any desire for financial security. He sits on the information, believing he has a prudential reason to remain silent, while having no motivational pathway to speak up, trapped in a gap between who he thinks he is and what actually moves him.

  Here's how the views break down. A Scanlon-style externalist says Mark is wrongheaded: the reason to report the beam is real and weighty because reasonable people couldn't reject a principle requiring safety, regardless of Mark's personal hang-ups. The reason exists outside his head, and his loyalty doesn't cancel it. Williams-style internalism, though, creates a weird vacuum. It denies Mark has a reason to report because there's no sound deliberative route from his actual motivational set (that closed loop of loyalty) to the action of whistleblowing. But it also denies he has a reason to stay quiet, because that supposed reason relies on a false belief—he thinks he desires job security, but he doesn't. So, internalism strips him of reasons for both options: one fails due to motivational closure, the other due to psychological error.

  The feature that makes internalism peel away here is the combination of that closed motivational set and the opacity of self-knowledge. Internalism demands truth about what you actually want; if you're wrong about your desires, you don't have the reasons you think you have. If we remove the opacity and make Mark's psychology fully transparent, he realizes he isn't actually afraid of losing his job. Suddenly, the apparent reason to stay quiet vanishes completely—he knows he has no prudential ground for silence. However, he still has no internal reason to report, because his loyalty still blocks that deliberative path. He ends up fully aware that he has no reasons either way, acting purely on raw impulse or habit rather than justified choice, which leaves him in a state of arational drift rather than rational conflict.
