answer: |-
  ### Private Brainstorming & Candidate Filtering

  Before addressing your questions directly, I need to perform the diagnostic work you requested. I will generate candidate concepts from the neighbourhood of social ontology and game theory, test them against your three cases, and discard those that fail to capture the specific "residue" you describe.

  **Candidate 1: Lewisian Convention**
  *   *Definition:* A regularity $R$ in a population $P$ that solves a recurrent coordination problem $S$, sustained by mutual expectations that others will conform to $R$.
  *   *Test:* Your cases clearly *were* conventions (the pause coordinated Q&A; the CC coordinated admin flow).
  *   *Failure:* Lewis requires $R$ to be an equilibrium *because* it solves $S$. In your cases, $S$ is gone. Strictly, if there is no coordination problem, there is no convention. Furthermore, Lewisian conventions are sustained by the *instrumental* preference for coordination. Your agents have no instrumental preference for the pause (it benefits no one).
  *   *Verdict:* **Discard as a current classification.** It explains the origin, not the persistence.

  **Candidate 2: Social Norm (Bicchieri-style)**
  *   *Definition:* A rule of behaviour where individuals prefer to conform conditional on believing that others conform (empirical expectation) and believe others think they ought to conform (normative expectation).
  *   *Test:* Fits the "we just do it" and the mild disapproval.
  *   *Failure:* Bicchieri's norms usually solve cooperation or coordination problems (e.g., fairness, efficiency). While she allows for "arbitrary" norms, the theory generally assumes the norm sustains itself because conformity yields a payoff (avoiding sanctions or achieving coordination). In your cases, the "sanction" is a shrug, and the payoff is null. It captures the *structure* of the expectation, but misses the specific *historical decay* element (the fact that everyone *knows* it's useless).
  *   *Verdict:* **Close, but too broad.** It doesn't distinguish between a norm that *never* had a point (e.g., table manners) and one that *lost* its point.

  **Candidate 3: Ritual / Ceremonial Practice**
  *   *Definition:* Symbolic action performed for its own sake, often expressing values or group identity.
  *   *Test:* Fits the "reading the minutes" case well.
  *   *Failure:* "Ritual" implies symbolic meaning or sacredness. Your informants describe the pause as "abrupt," not "sacrilegious." Rituals usually *have* a point (social cohesion, signaling). Your cases are described as having *no* benefit. Calling it a ritual grants it too much semantic weight.
  *   *Verdict:* **Discard.** Too thick a concept for such banal residues.

  **Candidate 4: Path Dependence / Lock-in**
  *   *Definition:* A state where switching costs or network effects make deviation irrational even if a superior alternative exists.
  *   *Test:* Explains persistence.
  *   *Failure:* You explicitly ruled this out ("Unilateral deviation costs nothing"). Lock-in requires that *changing* is costly. Here, *doing* the action is costless, and *stopping* is costless, yet stopping doesn't happen.
  *   *Verdict:* **Discard.**

  **Candidate 5: Individual Habit / Inertia**
  *   *Definition:* Automatic behaviour sustained by individual psychology.
  *   *Test:* Explains why individuals keep doing it.
  *   *Failure:* You noted this is social ("survives complete turnover"). A new hire is *corrected*. Habit cannot explain the normative correction ("we just do it").
  *   *Verdict:* **Discard.**

  **Candidate 6: "Vestigial Norm" / "Zombie Convention"**
  *   *Definition:* Metaphorical terms for a norm that outlives its function.
  *   *Test:* Captures the "dead but walking" nature.
  *   *Failure:* These are not technical terms with rigorous definitions in the literature. They are descriptive labels.
  *   *Verdict:* **Keep as a basis for coinage.**

  ***

  ### 1. Does this have a name in the literature?

  There is no single, canonical technical term in the Lewisian or evolutionary game-theoretic literature that captures this phenomenon precisely. This is a gap in the taxonomy.

  However, there are three nearby notions that compete. Here is how they fit and where they fail:

  **A. "Vestigial Norm" (Evolutionary Sociology)**
  *   *Pro:* This term is occasionally used in sociology (e.g., by Jon Elster or in institutional analysis) to describe practices that persist after their functional rationale has vanished. It captures the evolutionary history.
  *   *Con:* It is often used loosely to describe *any* inefficient tradition. It does not necessarily imply the specific *common knowledge of obsolescence* you describe. Often, vestigial norms persist *because* people falsely believe they still have a function (false consciousness). Your cases are stronger: everyone *knows* the function is gone.
  *   *Fit:* **Partial.** It captures the history, misses the epistemic state.

  **B. "Arbitrary Social Norm" (Bicchieri / Sugden)**
  *   *Pro:* Robert Sugden (*The Economics of Rights, Co-operation and Welfare*) and Cristina Bicchieri allow for norms that are arbitrary and sustained purely by expectations.
  *   *Con:* In their models, the norm is usually stable because it *currently* solves a coordination or cooperation problem (even if a different one than originally intended). Your cases stipulate that *no* coordinating work is being done. If a norm solves no problem and offers no payoff, standard game theory predicts it should dissolve via trembling-hand perfection or simple drift.
  *   *Fit:* **Loose.** It captures the structure of expectations, fails to explain stability without payoff.

  **C. "Institutional Fact" (Searle)**
  *   *Pro:* John Searle's formula "X counts as Y in context C" explains how brute facts (pausing) become institutional facts (deference).
  *   *Con:* Searle focuses on the *constitutive* power of the rule. He is less concerned with the *decay* of the rule. A Searlean institutional fact usually retains status because the community continues to accept the status function. In your cases, the community accepts the *action* but explicitly rejects the *status function* (they know the professor isn't listening).
  *   *Fit:* **Weak.** Too broad.

  **Conclusion:** The literature lacks a term for a regularity that is (1) known to be functionally obsolete, (2) known to be arbitrary, yet (3) sustained by a normative expectation that is detached from utility. I will treat this as an unnamed phenomenon for the purpose of the following analysis, leading to a coinage in section 4.

  ### 2. How should the Lewis-style apparatus classify these regularities?

  On a strict Lewisian reading, **these are no longer conventions.**

  Lewis defines a convention as a solution to a recurrent coordination problem. The definition is functionalist: a convention *is* a regularity that sustains a coordination equilibrium. If the coordination problem ($S$) vanishes (the senior professor retires; the admin role is automated), the equilibrium condition collapses.
  *   In Lewis's framework, if $A$ and $B$ are both equilibria, but $A$ no longer yields a higher payoff than $B$ (because the payoff is zero for both), agents become indifferent.
  *   If agents are indifferent, the expectation that others will conform is no longer sufficient to sustain conformity *unless* there is a new preference introduced.

  **The Difficulty for Lewis:**
  This reveals a limitation in the naive Lewisian account: it assumes conventions are sustained by the *current* utility of coordination. It does not account for the **normative inertia** of the expectation itself.
  In your cases, the "residue" acts as a *new* preference structure. It is not a preference for coordination (since nothing is being coordinated); it is a preference for **conformity per se** to avoid the "apologetic shrug."
  *   Strictly: It is a **Behavioural Regularity with Normative Residue.**
  *   Neo-Lewisian Repair: We can save the apparatus by positing that the "residue" creates a *new* coordination problem: the problem of **renegotiation**.
      *   State 1: Everyone pauses. Cost = 2 seconds. Deviation Cost = Social friction (the "abrupt" label).
      *   State 2: Everyone stops pausing. Cost = 0 seconds. Deviation Cost = Social friction (being the one who broke the tradition).
      *   Moving from State 1 to State 2 requires *coordinated* deviation. Unilateral deviation is costly (socially), even if the act itself is costless.
      *   Therefore, it *becomes* a convention again, but a different one: a convention of **maintenance** rather than a convention of **function**.

  **Verdict:** The apparatus classifies them as **degenerate conventions**. They have the form of a convention (arbitrary, expectation-based) but lack the original functional content. They persist because the *cost of establishing a new convention* (stopping) outweighs the *cost of maintaining the old one* (pausing), even if the old one is useless. The "residue" is the transaction cost of social renegotiation.

  ### 3. The Boundary: Empty Shell vs. Repurposed Signal

  You ask about the variant where the pause acquires a new function (signaling respect). Is this the same phenomenon?

  **Diagnosis:** This is a **different phenomenon**. It is the transition from a *Vestigial Convention* to a *New Convention*.

  **How to tell them apart (The Carving):**
  From the inside, they feel identical (the shrug is the same). To distinguish them, we must look at the **counterfactuals of abolition**.

  *   **Case A (Empty Shell / Your Cases):**
      *   *Scenario:* The department votes unanimously to abolish the pause.
      *   *Outcome:* Relief. The "disrespect" charge vanishes because the rule is formally dissolved. The "abrupt" feeling disappears because the expectation is reset.
      *   *Test:* The norm is **fragile to common agreement**. It persists only because no one wants to be the *first* to break it, not because the break itself is inherently costly.

  *   **Case B (Repurposed / Signaling Respect):**
      *   *Scenario:* The department votes unanimously to abolish the pause.
      *   *Outcome:* Loss. Even if agreed upon, members might feel the meetings are now "colder" or "less respectful." The pause had acquired *intrinsic* value (as a signal).
      *   *Test:* The norm is **robust to common agreement**. Abolishing it incurs a genuine loss of value (the signal is lost).

  **The Boundary Condition:**
  For us to say it is the *same* phenomenon continuing, the original rationale must be the *only* rationale. If a new rationale (respect) emerges, the regularity has been **re-functionalized**.
  *   *Evidence:* In your Case 1, if the pause were truly for respect, a junior visitor asking immediately would be "disrespectful." They were called "abrupt." "Abrupt" implies a violation of timing/flow (coordination), not necessarily morality (respect).
  *   *Distinction:* In the Empty Shell, the sanction is for **breaking the pattern**. In the Repurposed Shell, the sanction is for **losing the signal**.

  ### 4. Coining a Term: "Vestigial Convention"

  Since no established term fits tightly enough, I propose we define this phenomenon as a **Vestigial Convention**.

  **Definition:**
  A **Vestigial Convention** is a behavioral regularity $R$ in a population $P$ satisfying four conditions:
  1.  **Historical Function:** $R$ originated as a Lewisian Convention solving a coordination problem $S$.
  2.  **Common Knowledge of Obsolescence:** It is common knowledge in $P$ that $S$ no longer exists (the function has expired).
  3.  **Normative Residue:** Deviation from $R$ by a member of $P$ attracts mild normative disapproval (sanction) from others, despite the lack of instrumental harm.
  4.  **Arbitrariness of Persistence:** There is no *new* instrumental function served by $R$ (distinguishing it from a repurposed norm).

  **Hard Cases (The Margins):**

  *   **Just Inside (The "Bless You" Case):**
      *   *Scenario:* People say "Bless you" after a sneeze.
      *   *Analysis:* Originally superstitious (warding evil spirits/disease). Now, everyone knows sneezes aren't spiritual. It serves no coordination function. Yet, not saying it is "rude."
      *   *Why Inside:* It fits all four conditions. (Though one might argue it now functions as a politeness signal, if the politeness is *only* about saying the phrase itself, it remains vestigial).
  *   **Just Outside (The "Traffic Light at Night" Case):**
      *   *Scenario:* Stopping at a red light at 3 AM with no other cars visible.
      *   *Analysis:* Regularity persists. Deviation is disapproved (illegal/dangerous).
      *   *Why Outside:* It fails Condition 2 (Obsolescence). The function (safety/coordination) *still exists*, even if the empirical probability of collision is low. The rule is instrumental, not vestigial. Or, consider **Superstitious Ritual** (knocking on wood). This fails Condition 1 (Historical Function as *Coordination*). It was never a coordination equilibrium; it was individual magical thinking that became social.

  **Evidence of Normativity vs. Startle:**
  You asked how to prove the residue is a faint "ought" and not just surprise.
  *   **The Test:** **Unanimous Dislike with Persistence.**
  *   **Scenario:** Suppose you survey the department. 100% say "I hate this pause. It wastes time. I wish we stopped."
  *   **Prediction:**
      *   If it is mere **Startle/Habit**: Once they realize everyone hates it, the practice collapses immediately. (Coordination on stopping is easy).
      *   If it is **Normative (Vestigial Convention)**: The practice *persists* even after the survey results are published.
  *   **Why:** Because the norm is not about the *utility* of the pause, but about the **commitment to the rule**. The "ought" is: "One ought to do what is done, because it is what is done."
  *   **The "Residue" Mechanism:** The cost of deviation is not the pause itself, but the **social friction of being the exception**. Even if everyone dislikes the rule, being the *first* to break it requires bearing the burden of "changing the culture." That burden is the normative residue.

  **Summary of the Carving:**
  You are describing a social object that has lost its *teleology* (purpose) but retained its *deontology* (rule-bound nature). It is a **Vestigial Convention**: a coordination equilibrium that has forgotten what it was coordinating, sustained only by the mutual expectation that no one wishes to bear the cost of renegotiating the equilibrium.
