answer: |-
  This is a fantastic question that cuts to the heart of how evolutionary theory is structured. You have identified a genuine tension, but the resolution lies in a category error: you are equating **"evolutionary explanation"** with **"adaptationist explanation."**

  If you resolve that distinction, the fear that the Spandrels paper places biology "outside the reach of evolutionary theory" dissolves. However, there are indeed factions fighting over how far this extends.

  Here is a breakdown of the conceptual resolution, followed by a specific flagging of what is consensus and what is still disputed, as you requested.

  ### 1. The Core Misunderstanding: Evolution $\neq$ Selection
  Your premise states: *"If natural selection is the only evolutionary mechanism that produces fit... and spandrels aren't products of selection, then spandrels are just accidents with no evolutionary explanation."*

  The error here is the assumption that if a trait wasn't *caused* by selection, it has no *evolutionary* explanation. Evolutionary theory is a pluralistic framework. Natural selection is the primary explanation for **adaptive complexity**, but it is not the only explanation for **trait presence.**

  A spandrel has an evolutionary explanation; it is just a **non-selectionist** one. These explanations typically fall into three buckets:

  1.  **Developmental/Structural Constraint:** The trait exists because the organism's body plan *cannot* be built otherwise. (e.g., You cannot have a mammal with a single bone in the jaw hinge because of how the embryonic arches develop; the ear bones are a byproduct of jaw evolution).
  2.  **Phylogenetic Inertia:** The trait exists because the ancestors had it, and there hasn't been enough time or selective pressure to lose it.
  3.  **Genetic Correlation (Pleiotropy):** The trait is genetically linked to a different trait that *is* under selection. Selection pulls on Trait A, and Trait B comes along for the ride.

  **The Resolution:** A spandrel is not "outside evolutionary theory." It is explained by the interaction of selection on *other* traits, constrained by development and history. The explanation is still materialist, historical, and biological. It just refuses to treat every trait as an optimized solution to an environmental problem.

  ### 2. The "Fit" Problem
  You also wrote: *"Natural selection is the only evolutionary mechanism that produces fit between organism and environment."*

  This is mostly true, but with a caveat crucial to the Spandrels argument. Selection produces fit; **purifying selection maintains fit.**

  Many spandrels are not "maladaptive accidents." They are **neutral** or **near-neutral**. They persist not because selection pushed them *to* a peak, but because they weren't bad enough for selection to push them *off* the plateau.
  *   **Example:** The human chin. It likely serves no function (it's not an adaptation for chewing or speech). But it isn't costly enough to be selected against. It is a structural byproduct of how the jaw bones fuse. It is "fit" enough to persist, explained by evolutionary constraints, not adaptive utility.

  Furthermore, Gould and Elisabeth Vrba later introduced the term **Exaptation** (1982). A spandrel (byproduct) can later be co-opted by selection for a use.
  *   **Example:** Feathers likely evolved for thermoregulation (or as a spandrel of selection for something else) and were later co-opted for flight.
  *   **Implication:** The trait *originated* as a spandrel (non-adaptive origin) but is *maintained* by selection (adaptive maintenance). This keeps the trait firmly within evolutionary theory.

  ***

  ### 3. Consensus vs. Live Disputes
  Per your request, here is the landscape of the debate, flagged by the level of agreement in the field.

  #### **[CONSENSUS VIEW]**
  *   **Adaptationism is not universally true:** There is near-universal agreement that not every trait is an adaptation. The "Panglossian" view (that every trait is optimized for a purpose) is rejected.
  *   **Constraints exist:** Developmental, physical, and phylogenetic constraints are accepted as real factors that limit or channel what selection can achieve.
  *   **Methodological Warning:** It is accepted as bad practice to assume a trait is an adaptation without empirical evidence (the "Just-So Story" critique). You must test the adaptationist hypothesis, not assume it.
  *   **Evolutionary Theory is Broad:** Biologists agree that "evolutionary explanation" encompasses drift, constraint, and history, not just natural selection. Therefore, identifying a spandrel does not remove the trait from evolutionary biology.

  #### **[LIVE DISPUTE / FACTIONAL FIGHT]**
  *   **The Prevalence Question:** *How common* are spandrels?
      *   **Side A (Pluralists/Structuralists):** Follow Gould. They argue spandrels and constraints are widespread and that adaptationist programs often overlook them.
      *   **Side B (Adaptationists/Selectionists):** Follow George Williams or Richard Dawkins. They argue that while spandrels exist, they are the exception, not the rule. They worry that labeling traits "spandrels" too easily becomes a "conversation stopper" that halts research into potential functions.
  *   **Detectability:** Can we reliably distinguish a spandrel from an adaptation empirically?
      *   Some philosophers argue that without a time machine, it is often impossible to prove a trait *wasn't* selected for. This leads to disputes over whether the Spandrels critique is a meaningful scientific hypothesis or just a philosophical caution.
  *   **The Extended Evolutionary Synthesis (EES):** This is the current frontline.
      *   **Standard View:** Selection is the primary creative force; constraints are just the walls of the room.
      *   **EES View:** Developmental constraints and plasticity are *causal drivers* that direct evolution, not just limits. They argue the Spandrels paper didn't go far enough in elevating the role of development. This is highly contentious; many mainstream biologists view the EES as unnecessary rebranding.

  ***

  ### 4. Reframing the "Concession"
  You asked: *"Isn't that a way bigger concession than most evolutionary biologists would accept?"*

  It is not a concession; it is a **correction of scope.**

  If you claim evolutionary theory explains *everything* via *selection*, then finding a non-selected trait breaks your theory. But if you claim evolutionary theory explains *change in populations over time* via *multiple mechanisms* (selection, drift, constraint, mutation), then spandrels are predicted by the theory, not exceptions to it.

  Gould and Lewontin were not arguing that biology is outside evolutionary theory. They were arguing that **Adaptationism** is a subset of evolutionary theory, not the whole of it.

  **For your piece:**
  The most accurate way to frame the legacy is not that Gould and Lewontin showed limits to *Darwinism*, but that they showed limits to *Adaptationism*. They expanded the explanatory toolkit of evolutionary biology to include architecture and history, rather than just utility. The "concession" is only painful if you believe natural selection is the only interesting thing in biology. Most biologists today agree it is the most important thing, but not the *only* thing.

  ### Summary for your writing:
  1.  **Settled:** Spandrels exist; not everything is an adaptation; "Just-So stories" are bad methodology.
  2.  **Disputed:** How many traits are spandrels? Can we prove it? Do constraints drive evolution or just limit it?
  3.  **Key Takeaway:** Identifying a spandrel provides an evolutionary explanation (constraint/correlation), it does not remove the trait from evolutionary inquiry.
