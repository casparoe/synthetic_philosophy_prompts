  *(Refining the "Fit" argument)*: The user says selection is the *only* mechanism producing fit. That's technically debatable (drift can fix traits that happen to be fit, though not *because* they are fit). I should nuance that. Selection is the only mechanism that produces fit *systematically/directionally*. Spandrels might persist if they aren't *un*fit.

