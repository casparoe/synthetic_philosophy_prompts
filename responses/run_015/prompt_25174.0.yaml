prompt: |-
  I've been working on a piece about the legacy of Gould and Lewontin's spandrels paper and I keep tripping over the same thing. They make a convincing case that not every trait is an adaptation — some are structural byproducts, some are consequences of developmental pathways, etc. But here's what I don't get: if natural selection is the only evolutionary mechanism that produces fit between organism and environment, and spandrels aren't products of selection, then spandrels are just accidents with no evolutionary explanation, right? Doesn't the spandrels critique basically say "a lot of biology is outside the reach of evolutionary theory"? And if so, isn't that a way bigger concession than most evolutionary biologists would accept?

  When you answer, I'd appreciate it if you could flag which parts of this debate are settled among biologists and philosophers of biology and which parts are still live disputes — I don't want to present someone's side in a factional fight as the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** The legacy of Gould and Lewontin's "Spandrels of San Marco" paper (1979).
      *   **Core Confusion:** The user thinks that if spandrels aren't adaptations (products of natural selection), they must be "accidents with no evolutionary explanation." Consequently, they worry this implies a large chunk of biology is "outside the reach of evolutionary theory," which seems like a huge concession biologists wouldn't accept.
      *   **Request:** Explain the resolution to this confusion.
      *   **Constraint:** Clearly flag what is *settled consensus* vs. *live dispute* among biologists and philosophers of biology. Do not present factional views as consensus.

  2.  **Deconstruct the User's Premise:**
      *   *Premise 1:* Natural selection is the only mechanism producing fit between organism and environment. (Mostly true, but "fit" is the tricky word).
      *   *Premise 2:* Spandrels aren't products of selection. (True by definition in the paper).
      *   *Conclusion:* Therefore, spandrels are accidents with *no evolutionary explanation*. (False).
      *   *Conclusion 2:* Therefore, the spandrels critique says biology is outside evolutionary theory. (False).

  3.  **Identify the Key Conceptual Error:**
      *   The user equates "evolutionary explanation" with "adaptationist explanation" (i.e., explanation via natural selection).
      *   Evolutionary theory includes more than just natural selection (drift, constraint, development, phylogeny).
      *   A trait can be evolutionary explained *without* being an adaptation. It can be explained by *why it wasn't selected against*, or by *phylogenetic inertia*, or by *developmental constraint*.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the profundity of the question. It's a common sticking point. State clearly that the user's conclusion (that spandrels lack evolutionary explanation) is the misunderstanding.

      *   **Addressing the Core Misunderstanding ("No Evolutionary Explanation"):**
          *   Explain that "Evolutionary Theory" $\neq$ "Adaptationism."
          *   Spandrels *do* have evolutionary explanations, just not *selectionist* ones.
          *   Examples of non-selectionist explanations: Phylogenetic constraint, developmental constraint, genetic drift, exaptation (later use).
          *   *Analogy:* Architecture. The spandrel exists because of the arch (constraint), not because the architect wanted a triangle there for decoration (selection). But architecture still explains the triangle.

      *   **Addressing "Fit" and "Accidents":**
          *   Spandrels aren't necessarily "maladaptive." They are often neutral or slightly deleterious but linked to something beneficial.
          *   They can become useful later (Exaptation). This brings them back into the fold of selection *after* the fact.

      *   **Flagging Consensus vs. Dispute (Crucial Step):**
          *   *Consensus:*
              *   Not all traits are adaptations. (Adaptationism is not universally true).
              *   Constraints and development matter.
              *   "Just-so stories" are methodologically risky without evidence.
              *   Evolutionary theory encompasses more than just natural selection.
          *   *Live Disputes:*
              *   *Proportion:* How *much* of biology is spandrel vs. adaptation? (Pan-selectionists vs. Pluralists).
              *   *Detectability:* Can we reliably distinguish spandrels from adaptations empirically?
              *   *Evo-Devo Integration:* How deeply do developmental constraints limit selection? (Some think selection overrides constraints easily; others think constraints channel evolution significantly).
              *   *Extended Evolutionary Synthesis (EES):* Is the current framework enough, or do we need to elevate development/constraint to the same level as selection? (This is the hottest current debate).

      *   **Refining the "Concession" Point:**
          *   It's not a concession that biology is outside evolutionary theory. It's an *expansion* of evolutionary theory to include non-selective processes.
          *   Gould and Lewontin weren't anti-Darwin; they were anti-*Panglossian* Darwinism.

  5.  **Review and Refine (Self-Correction against Constraints):**
