  This project is feasible for one semester and targets a critical ontological tension in Schopenhauer's aesthetics. The research question is determinate: *Does Schopenhauer's claim that music copies the Will directly entail that music cannot express determinate emotions?* I argue that standard interpretations fail because they treat emotions as compatible with the thing-in-itself, ignoring Schopenhauer's strict separation of Will and Representation.

  **The Philosophical Problem**
  Schopenhauer posits music as a direct copy of the Will, bypassing the Ideas that mediate other arts. However, he describes music using determinate emotional terms—grief, triumph. In his system, emotions are intentional states within the phenomenal world (representations). The Will is the non-representational thing-in-itself. If music accesses the Will directly, it should precede individuation. If it expresses specific feelings, it operates at the level of Ideas. The standard resolution—that music expresses emotion's "essence" sans object—is vague. It leaves open how an essence remains "grief" if stripped of the intentional context defining that state. It assumes emotional qualia exist independently of representation, contradicting Schopenhauer's epistemology.

  **Methodology**
