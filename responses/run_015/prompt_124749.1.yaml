answer: |-
  Model A, frozen on five years of postmortems, fluently diagnoses a novel staging queue deadlock by synthesizing lexical patterns from similar-sounding incidents, passing behavioral counterfactuals despite never executing a command; Model B, looped for a year, successfully suppresses alerts by adjusting retry limits via sparse reinforcement but outputs gibberish when asked why, failing behavioral tests despite its actions physically altering cluster state. The behavioral account crowns A the understander for its coherent explanations and B the parrot for its silence; the causal-contact account reverses this, granting B meaning because its weights were shaped by system feedback loops while A remains ungrounded text manipulation. Interpretability splits the difference, revealing A's attention heads track syntactic co-occurrence rather than causal dependencies (denying A understanding), while B's weight updates show genuine but fragmented sensitivity to latency variables (granting B partial structural knowledge), thereby rejecting the behavioral verdict on A and refining the causal verdict on B.

  **The Feature Doing the Work:**
  The divergence hinges on **the explicitness of causal semantics in the learning signal**. Model A receives high-bandwidth explicit causal claims ("retry storm caused backlog") in text, while Model B receives low-bandwidth implicit causal pressure (1-bit survival signal) in weights. If you strip A's corpus of engineer causal language (leaving raw telemetry), A fails the behavioral test (cannot generate the explanation). If you thicken B's feedback to per-action immediate rewards, B passes the behavioral test (learns to articulate the map). In either modification, the crossed verdicts collapse into alignment.

  **The Attack and Rebuild:**
  The no-grounding opponent argues that answering counterfactuals is just next-token prediction on causal vocabulary, measuring linguistic competence rather than system understanding. To block this, rebuild the test as a **Causal Isomorphism Intervention**: hash all service names, queue IDs, and error codes to random strings, then ask the models to propose configuration changes to minimize cascade risk under a novel fault. Model A will fail because its "understanding" is anchored to semantic tokens (e.g., "payment-service") rather than structural roles. Model B will succeed (or perform significantly better) because its weights encode sensitivity to topological latency constraints independent of labels. This forces the models to demonstrate structural generalization rather than textual recall.
