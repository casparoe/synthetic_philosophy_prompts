  1. **Tensions (worst first)**

  The deepest crack is between (1) and (8). You define manipulation as bypassing deliberation via emotion or timing. But a documentary works exactly by bypassing dry argument to move you emotionally. If (1) holds, the documentary is manipulation. If (8) holds, bypassing deliberation isn't the defining line. You can't claim emotion-based bypass is manipulation in UI but persuasion in art. Either emotion bypasses agency (making art manipulative) or it engages it (making defaults persuasive). You're trying to have a bright line where there's a gradient. If you call the documentary persuasion, you must admit that bypassing deliberation isn't inherently wrong, which weakens (1). If you call it manipulation, you have to accept that "manipulation" isn't always bad, which complicates your General Rule. This forces you to either condemn art or excuse dark patterns. Neither is tenable. This is the worst tension because it attacks the definition itself. If your definition can't distinguish a growth nudge from a documentary, it's too broad to be useful.

  Next is (1) versus (5). Rule (1) says defaults are manipulation regardless of benefit because they skip thinking. Rule (5) is used to defend shipping those defaults via hypothetical consent. If hypothetical endorsement makes an action "OK," that's justification. But you often use it to imply the action isn't manipulation at all. If (5) removes the label, it contradicts (1). If (5) only removes the blame, it conflicts with how you wield it in chats to stop the argument. You're conflating "is this manipulation?" with "is this permissible?" This lets you win arguments by shifting goalposts. When the designer says "this is manipulative," you say "but they'd agree." You're answering a different question. This creates friction because the designer cares about the mechanism (1), and you care about the outcome (5). It stalls progress because you aren't debating the same category.

  Finally, (6) clashes with (4). Rule (6) requires a stable "before" self to judge value reshaping. Rule (4) describes how agency erodes through micro-choices over time. In a recommender system, there is no static baseline. The user is always in the stream. If you judge by values from six months ago, you ignore legitimate preference learning. If you judge by current values, you excuse all conditioning. You need a baseline that (4) suggests is constantly being dissolved by the product itself. This makes (6) impossible to apply practically. You can't audit a recommender against a self that no longer exists, yet auditing against the current self makes the audit meaningless. This leaves you with no metric for long-term influence other than churn rates. It paralyzes your ethical review process because the target keeps moving. You end up guessing.

  2. **Not-actually-tensions**

  (2) and (3) are solid. Classifying an act as manipulation based on mechanism (2) while grading moral blame based on intent (3) is consistent. You can accidentally break a window; it's still broken, but you aren't a vandal.
  (7) and the General Rule also fit. You admit the friend scenario was manipulation (a mark against) but justified by the outcome (not wrong overall). This is standard pro tanto reasoning.
  (1) and (4) are aligned. (4) is just (1) applied to infinite scroll. Both identify the removal of a stopping cue as the bypass mechanism. No friction here. These pairs operate on different layers: ontology versus ethics. You aren't contradicting yourself; you're distinguishing classification from culpability. This distinction is actually the strongest part of your framework. It allows you to acknowledge harm without assigning malice, which is crucial for backend work where side effects are common.

  3. **Cheapest fix**

  The cheapest fix is to demote (5). Stop using hypothetical endorsement to define what counts as manipulation. Use it only to justify permissible manipulation. This aligns (5) with the General Rule and (7).
  What gives: You lose the defensive shield of "this isn't manipulation." You must admit that defaults, timing tricks, and recommenders are manipulative by your own definition (1).
  The cost: You have to argue harder for utility. Instead of saying "this is fine," you say "this is manipulative but necessary for retention." This is honest but riskier. It forces you to quantify the benefit explicitly rather than hiding behind consent. It also changes the dynamic with your designer. Instead of debating definitions, you debate trade-offs.
  You also need to tweak (8). Admit documentaries manipulate. Call it "benevolent manipulation." This preserves (1) without exempting art arbitrarily. It costs you the moral purity of "persuasion," but it makes your definition consistent. You become an engineer of manipulation who chooses benevolent ends, rather than someone claiming to build persuasion machines. This shift might feel uncomfortable but it clears the fog. You stop fighting the label and start owning the responsibility. When you ship a cancel flow nudge, own it as manipulation. Argue that the manipulation prevents regret, not that it isn't manipulation. This grounds the conversation in reality. Your designer wants safety; you want retention. Admitting the mechanism is manipulative lets you discuss safeguards rather than semantics.

  4. **Where you think I'm just confused**

  You are confused about (6). The "before" self is a fiction in continuous engagement products. Users don't pause existence while you build features. There is no clean baseline.
  Confidence: 95% on (6) confusion. 90% on (1)/(8) clash. 80% on (5) fix.
  Your framing assumes static users. They aren't. You're building a dynamic system and judging it with static ethics. Accept that the baseline drifts. Judge by directionality, not snapshots. If values shift toward isolation, that's bad. If toward connection, good. Stop looking for a timestamped baseline.
