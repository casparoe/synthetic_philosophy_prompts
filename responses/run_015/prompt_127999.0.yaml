answer: |-
  **PREP SHEET: SCAFFOLDED DELIBERATIVE INTERNALISM**
  **Talk:** Dept. Colloquium (3 Weeks)
  **Audience:** Mixed (Humeans, Rationalists, Psychologists, PolPhil)
  **Core Vulnerability:** The "Collapse Objection" (Sam's Point).

  ---

  ### THE "MUST-LAND" REPLY
  **The Distinction:** *Causal Production* vs. *Rational Recognition.*
  If you cannot explain the difference between a therapist helping you see a commitment you already hold (scaffolding) and a marketer conditioning you to want a product (manipulation), the view collapses into Externalism or becomes a theory of social engineering.
  **The Line:** Scaffolding works by making the agent *acknowledge* the consideration as theirs ("Yes, I see why that matters"). Manipulation works by bypassing acknowledgment ("I just want it now").
  **Why it must land:** If this distinction is fuzzy, the Humeans will say you've abandoned internalism, and the Rationalists will say you've kept the worst part of it.

  ---

  ### EARLY CONCESSIONS (First 3 Minutes)
  *Do not wait for Q&A to admit these. State them in the setup to inoculate against the "naive internalist" caricature.*
  1.  **Concede Immediacy:** Admit that reasons do not need to motivate *now*. The "motivational link" is dispositional and potential, not occurrent.
  2.  **Concede Solitude:** Admit that deliberation is rarely solitary. Acknowledge upfront that "my own deliberation" is a social achievement.
  3.  **Concede Fuzziness:** Explicitly state: "I do not have a bright-line test for when scaffolding becomes manipulation. I have a paradigm case distinction." (This disarms the Moral Psychologists who will hunt for edge cases).

  ---

  ### THE EIGHT OBJECTIONS (Ordered by Likelihood $\times$ Damage)

  #### 1. The Collapse Objection (Sam's Point)
  *   **The Humean:** "You've stretched 'motivational set' so thin it covers everyone. If a friend can argue you into it over six months, why isn't that just an external fact about what you *should* want? You've kept the internalist vocabulary but surrendered the constraint."
  *   **The Rationalist:** "Why keep the motivational constraint at all? If the process is that robust, the reason exists regardless of whether they come to care. You're adding a psychological hoop that doesn't do normative work."
  *   **90-Second Reply:** "The hoop does work: it respects the *authority* of the agent. Externalism says the reason applies even if the agent cannot recognize it as a reason. My view says a 'reason' must be something the agent can *own*. Scaffolding helps them own it; it doesn't own it for them. If they never recognize it, it remains an external demand, not a reason *for them*."
  *   **Soft Spot:** You are relying on a metaphysical distinction (ownership) that looks identical to a causal one (persuasion) from the outside.

  #### 2. The Manipulation Boundary
  *   **The Moral Psychologist:** "You say 'no conditioning.' But effective therapy often looks like conditioning. Cognitive reframing changes how things feel before the patient articulates why. Where is the line between 'fixing factual mistakes' and 'rewiring valuation'?"
  *   **90-Second Reply:** "Transparency and Endorsement. In scaffolding, the agent can look back and say, 'That process helped me see what I value.' In manipulation, the agent says, 'I don't know why I want this, I just do.' If the process survives the agent's own reflection, it's scaffolding."
  *   **Soft Spot:** Gaslighting survivors often endorse the manipulation *during* the process. Retrospective endorsement is unreliable.

  #### 3. The "Awful Person" / Political Objection
  *   **The Political Philosopher:** "Take a genuine ideologue or psychopath. They resist all scaffolding. They won't care about others even after years of therapy. Does your view say they have *no reason* not to harm others? That seems to let them off the hook normatively."
  *   **90-Second Reply:** "It does say that. And it's costly. But saying they have a 'reason' they cannot possibly grasp is empty. My view shifts the burden: the problem isn't that they lack reasons, it's that they are practically inaccessible to the normative community. We must treat them as dangerous, not rational."
  *   **Soft Spot:** This is a bullet you have to bite. It sounds morally weak in a room with political philosophers.

  #### 4. The Category Mistake (Rationalist Standard)
  *   **The Kantian:** "You're conflating *explanation* with *justification*. Whether I can be moved to $\phi$ explains my action. Whether I ought to $\phi$ is a fact about the world. Your 'scaffolding' is just a story about how to make me see the fact, not what makes it true."
  *   **90-Second Reply:** "I'm not analyzing truth; I'm analyzing *normative force*. A fact only has force *for an agent* if it connects to their agency. Scaffolding is the bridge between abstract fact and agent-relative force. Without the bridge, you have reasons floating in a void."
  *   **Soft Spot:** You might just be talking past each other. They think 'reason' means 'truth'; you think 'reason' means 'motivating consideration.'

  #### 5. The Indeterminacy of Time
  *   **The Humean:** "How long is the process allowed to take? Ten years? A lifetime? If I can be moved in 40 years, do I have the reason now? If yes, the 'could' is doing all the work, not the 'motivation'."
  *   **90-Second Reply:** "It's not about clock time; it's about deliberative stability. The process ends when the agent reaches a stable reflective equilibrium or hits a hard wall of incapacity. If the only way to move them is 40 years of brainwashing, that's not deliberation. If it's 40 years of friendship, it is."
  *   **Soft Spot:** "Deliberative stability" is vague. Despotism can be stable.

  #### 6. The "Depressed Nihilist" Case (Your Meds Case)
  *   **The Moral Psychologist:** "Take your friend's case. Severe depression flattens the future. They literally cannot care about next week. Scaffolding fails because the illness blocks the scaffolding. Do they have no reason to take meds?"
  *   **90-Second Reply:** "We distinguish the *illness* from the *agent*. The illness blocks the scaffolding. We treat the illness (medically) to restore the capacity for deliberation. The reason exists relative to their *healthy* deliberative capacity, which the illness is obscuring."
  *   **Soft Spot:** This risks circularity. You're defining the 'real' agent as the one who takes the meds.

  #### 7. The "Why Care?" Regress
  *   **The Rationalist:** "Okay, you scaffold them until they care about X. Why should they care about X? If the answer is 'because they now care,' you've grounded reasons in arbitrary desires. If the answer is 'because X is good,' you're an externalist."
  *   **90-Second Reply:** "I'm not grounding the *goodness* of X. I'm grounding the *reason-status* of X for Agent A. Externalism grounds the goodness. I'm grounding the grip. Both are needed for a full picture, but I'm only selling the grip."
  *   **Soft Spot:** This admits your view is incomplete. They will press that an incomplete theory of reasons is useless.

  #### 8. The "Importing Desires" Objection
  *   **The Humean:** "You say no importing desires. But if a friend convinces me to care about opera, didn't they import that desire? If not, why not? What's the difference between importing a desire and cultivating one?"
  *   **90-Second Reply:** "Cultivation connects to existing structural commitments (e.g., wanting to bond with the friend, wanting aesthetic novelty). Importing bypasses structure. If the new desire floats free of everything else they value, it's imported. If it hooks into their existing web, it's cultivated."
  *   **Soft Spot:** Holism is messy. Almost any desire can be hooked into *something* with enough cleverness.

  ---

  ### THE FEARED QUESTION
  **The Question:** "If someone is genuinely, permanently incapable of being scaffolded—no amount of friendship, therapy, or time makes them care about their future self or others—does your view imply they have **no reason** to avoid self-destruction or harming others?"

  **The Comfortable Answer:** "That's an edge case; most people can be scaffolded." (Do not give this. The PolPhil and Psychologists will eat you alive.)

  **The Real Answer:** "Yes. It implies they have no *internal* reason. This is the cost of taking agency seriously. If an entity cannot recognize a consideration as a reason, calling it a 'reason for them' is a category error. We still have reasons to *restrain* them, and they might have external reasons, but *for them*, the normativity is silent. That is terrifying, but it's more honest than pretending normativity works on beings incapable of grasping it."

  ---

  ### VERDICT ON SAM'S OBJECTION
  **Is it fatal?** No, but it is the load-bearing wall.
  **The Salvage:** You must tighten the definition of "Own Deliberation."
  **The Fix:** Add a **Recognition Constraint**.
  It is not enough that they *are* moved by the process. They must be able to *recognize the process as rational* upon reflection.
  *   *Formula:* Scaffolding = Providing premises the agent accepts to reach a conclusion they endorse.
  *   *Manipulation:* Providing stimuli that cause a conclusion the agent cannot trace back to premises they accept.
  If you can articulate *that* difference clearly on the whiteboard (Premise-Acceptance vs. Causal-Stimulus), you survive Sam's objection. If you can't, Sam is right, and you are an Externalist.

  **Action Item:** Spend the next week workshopping the "Recognition Constraint" definition. That is your only shield.
