answer: |-
  Your facts are solid enough for the philosophy; the legal outcome (murder conviction, commuted sentence) is correct. The *Mignonette* case is indeed the stress test for the separateness of persons objection. Your group's conflation of the three complaints is typical, but untangling them reveals where the objection actually bites.

  First, let's map the three complaints to the case. If the objection is purely **(1) No Aggregation**, then the math "three lives > one life" is category error. On this reading, the counterfactual where all four die is preferable to killing Parker. The theory prefers a worse outcome (four deaths) to a moral category violation (treating distinct lives as a single pool of utility). This is the bullet the objector must bite: the boundary between persons is a moral firewall that utility cannot cross. If the objection is **(2) Inviolability/Consent**, the issue is using Parker as a means. He didn't consent. Here, the counterfactual of a **fair lottery** matters immensely. If they draw lots and Parker loses, has the objection been met? If yes, the objection is actually **(3) Procedural Fairness**, not deep metaphysical separateness. It becomes about equal regard rather than the impossibility of aggregation.

  However, a strict separateness view (closer to Nozick than Rawls) suggests a lottery *doesn't* dissolve the objection. You cannot consent to your own execution for the benefit of others, because your life is not yours to trade in that currency. On this reading, even with a lottery, killing Parker violates the boundary. The distinction between the three complaints collapses into a single constraint: individuals are ends-in-themselves, not resources for the sum.

  Regarding Parker's condition (young, sick, likely to die): for a strict separateness view, this should not register. To weigh his "remaining expected utility" against the others' is to smuggle aggregation back in. It treats his life as a quantity of time rather than a sovereign status. Caring that he was "going to die anyway" is utilitarian calculus disguised as mercy. The separateness objection demands we see him as a whole person until the moment he dies naturally, not as a depreciating asset.

  Running it the other way: what does the case do to the theory? The law's conviction aligns with the separateness objection; the public's sympathy (and the commutation) aligns with utilitarian necessity. This is a point *for* the objection if you believe the law's role is to uphold inviolable rights regardless of consequences. However, it exposes a weakness: the objection leans heavily on a **doing-versus-allowing** distinction. Dudley *killed* Parker; he didn't just let him starve. The separateness objection relies on agency to police the boundary. But in a lifeboat, is the distinction real? If refusing to kill Parker ensures everyone dies, is the refusal to aggregate just a preference for "clean hands" over survival? The objection risks going silent in a "closed world" without institutions. Rawls designed the objection for a basic structure of society, not a state of nature. In the lifeboat, there is no baseline of rights to violate, only competing claims to existence. The objection assumes a background of cooperation that the gale has destroyed.

  Now, your PhD friend's argument: if the person-boundary is so load-bearing, why is it stronger than the boundary between temporal stages of one life? We accept prudence (present pain for future gain). Why not sacrifice Parker (present person) for Dudley (future person)?

  This argument is compelling but misses the locus of the objection. The separateness objection isn't just about boundaries; it's about *claims*. A future self cannot object to a present self; they share a single will. Parker has a distinct will from Dudley. The objection is grounded in the plurality of agents, not just the plurality of moments. *Mignonette* gives us purchase here: Parker could object. He did object (Brooks reported Parker's resistance). A future self cannot litigate against a past self in the same way. The friend's argument relies on a "time-slice" view of persons (Parfit), which reduces the moral weight of identity. But the separateness objection presupposes that identity *matters*. If you accept the friend's premise that persons are just sequences of experiences, the objection dissolves entirely. But if you hold that persons are distinct moral entities, the lifeboat case confirms the asymmetry: you can sacrifice a part of a whole, but not a whole for a whole.

  **Confidence and Uncertainty**
  I am highly confident (85%) that the separateness objection, strictly applied, forbids the killing even with a lottery, and that Parker's sickness is irrelevant to that specific framework. I am also confident the friend's argument fails because it conflates metaphysical reductionism with moral status.

  The claim I am **least sure of** (60% confidence) is whether the **fair lottery dissolves the objection**. This leans on a contested reading of whether rights are alienable in extremis. Some contractarians argue that agreeing to a lottery transforms the killing from "murder" to "execution of a shared risk," which might satisfy the separateness constraint by respecting Parker's agency as a co-legislator of the rule. If that reading holds, the objection is indeed more about procedural fairness than aggregation, which weakens its metaphysical weight. I suspect the strict deontological view (no lottery justifies eating a man) is more consistent with Rawls/Nozick, but the "lifeboat contract" interpretation is a persistent counter-reading I cannot fully dismiss.
