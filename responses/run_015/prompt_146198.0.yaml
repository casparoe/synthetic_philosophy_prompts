answer: |-
  Honouring sunk costs is not invariably irrational, as it can sustain diachronic integrity and leverage epistemic investment beyond mere financial calculus. The standard economic position insists rational agents must ignore irrecoverable expenditures, focusing solely on marginal future utility. To persist merely because resources are spent is ostensibly wasteful. However, this view assumes a narrow definition of utility. Human agency relies on narrative continuity; abandoning commitments arbitrarily fractures diachronic integrity, undermining the trust one places in one's past decisions. If every project is ditched the moment efficiency dips, personal identity becomes fragmented, and the capacity for long-term planning erodes.

  Furthermore, epistemic sunk costs matter. The mental effort expended grasping a complex problem creates specific capital. Switching tracks discards this nuanced understanding, imposing a hidden learning tax on new endeavours. Persistence often unlocks value only visible after crossing a threshold of comprehension, which forward-looking models might underestimate due to uncertainty.

  Therefore, while blindly throwing good money after bad remains foolish, honouring past investment is rational when it preserves self-coherence or capitalises on accrued knowledge. The fallacy lies not in considering the past, but in letting it override future potential; yet, the past often informs that potential more deeply than cold calculus admits.
