  ok so i was talking to my cousin who's in a sociology class and she summed up Weber's Protestant Ethic thesis like this: "Weber said Calvinists got super anxious about predestination so they worked like crazy to prove they were saved, and that accidentally created capitalism's save-and-reinvest mindset. So culture is literally a cause just like physics, Weber just used the term elective affinty instead of saying cause. He also argued that capitalism only happened in the West bc other religions had the wrong values, and later he admitted the religious part was just a speed bump since capitalism was gonna happen anyway." something about this feels off to me, especially the part about values being causes "just like physics" and that he used elective affinty as a synonym. but i dont know enough to call it out. can u go through it sentence by sentence? tell me whats actually Weber, whats a common oversimplification, and whats just wrong. and does the conclusion that religion was only a speed bump follow from anything he actually said about rationalization? also is there any real difference between saying culture caused something and saying there's an elective affinity, or are those the same thing?
