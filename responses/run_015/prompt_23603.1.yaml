answer: |-
  Here is a rigorous argumentative case designed for a graduate seminar context. It is structured to defend your hunch: that the realization response fails to secure the causal efficacy of mental *properties*, thereby leaving non-reductive physicalism (NRP) vulnerable to epiphenomenalism despite its attempt to avoid overdetermination.

  ***

  # The Causal Inertness of the Realized: Why the Realization Response Fails to Defuse Kim's Exclusion Argument

  ## 1. Introduction: The Relocation of the Problem
  The standard defense of non-reductive physicalism (NRP) against Jaegwon Kim's causal exclusion argument relies heavily on the **realization relation**. The proponent of NRP argues that mental events are not causally excluded because they are not numerically distinct from their physical realizers; thus, there is no competition for causal sufficiency.

  I argue that this defense is insufficient. While the realization response successfully blocks the charge of *systematic overdetermination* at the level of token events, it fails to establish the *causal relevance* of mental properties. By conceding that the causal work is done by the physical base properties in virtue of which the mental properties are instantiated, the realization response merely relocates the exclusion problem from token events to property instances. Consequently, the realization response saves NRP from inconsistency only by sacrificing the causal efficacy of the mental, rendering it a sophisticated form of epiphenomenalism.

  ## 2. Reconstructing Kim's Challenge: From Events to Properties
  To see why the realization response fails, we must be precise about the target of Kim's argument. In his later work (particularly *Physicalism, or Something Near Enough*), Kim shifts the focus from event causation to **property causation**.

  The core of the exclusion argument rests on three premises:
  1.  **Causal Closure of the Physical (CCP):** Every physical event that has a cause has a sufficient physical cause.
  2.  **Distinctness:** Mental properties are not identical to physical properties (the non-reductive claim).
  3.  **The Exclusion Principle:** No single event can have more than one sufficient cause at a given time (unless it is a genuine case of overdetermination).

  The standard NRP response attacks the **Distinctness** premise regarding *tokens*. It claims that while mental *types* are distinct from physical *types*, the mental *token event* ($m$) is realized by the physical *token event* ($p$). Since $m$ and $p$ are not competitors (they are, in a sense, the same particular), $p$ causing $p^*$ does not exclude $m$ from causing $p^*$.

  However, Kim's deeper challenge is not about whether $m$ and $p$ are distinct particulars, but whether the **mental property $M$** contributes anything to the production of the effect that the **physical property $P$** does not already account for. If causation is the transmission of influence or the instantiation of nomic connections, we must ask: *In virtue of which property does the cause produce the effect?*

  ## 3. The Failure of the Realization Response
  The realization response argues that $m$ causes $p^*$ *because* $m$ is realized by $p$, and $p$ causes $p^*$. This relies on the transitivity of the realization relation. However, this move collapses under scrutiny when we analyze the "in virtue of" relation inherent in realization.

  ### 3.1. The Screening-Off Problem
  If a mental property $M$ is realized by a physical property $P$, then $M$ is instantiated only because $P$ is instantiated. The causal powers of the token are determined entirely by $P$. If $P$ is sufficient for the effect $p^*$, then $P$ **screens off** $M$ from causal relevance.

  Consider the conditional: If $P$ had occurred without $M$ (impossible under supervenience, but conceptually tractable), $p^*$ would still occur. If $M$ had occurred without $P$ (impossible under physicalism), $p^*$ would not occur. This counterfactual asymmetry suggests that $P$ is doing all the causal heavy lifting. The realization response admits this: it says $m$ causes $p^*$ *by* $p$ causing $p^*$. But if the causal mechanism is exhausted by $p$'s physical properties, then $M$ is causally inert. It is a "free rider" on the physical causal chain.

  ### 3.2. The Dilemma of Property Distinctness
  The realization response forces the NRP into a dilemma regarding the distinctness of properties:
  *   **Horn A:** If mental properties are distinct from physical properties (as NRP requires), then we have two properties ($M$ and $P$) present at the same locus. Given CCP, $P$ is sufficient for the effect. By the Exclusion Principle, $M$ is excluded unless it contributes something *over and above* $P$. But if $M$ contributes something over and above $P$, physicalism is violated (the effect is not physically closed).
  *   **Horn B:** If mental properties are *not* distinct from physical properties in a way that matters for causation (i.e., they share the same causal powers), then $M$ is causally efficacious only insofar as it is identical to $P$. But this is **reductive physicalism**, not non-reductive physicalism.

  The realization response attempts to sneak between these horns by saying $M$ and $P$ are "not distinct enough to compete, but distinct enough to be non-reductive." This is metaphysically unstable. If they are not distinct enough to compete for causal sufficiency, they share the same causal powers. If they share the same causal powers, $M$ adds nothing to the ontology of causation that $P$ does not already provide. Thus, $M$ is causally redundant.

  ## 4. Anticipating and Refuting Counterarguments

  ### 4.1. Objection: Realization *Is* Causal Explanation
  **The Objection:** A proponent of the realization response might argue that we are conflating *causation* with *causal explanation*. They might claim that citing $M$ provides a higher-level explanation that is valid even if $P$ is the physical cause. As long as $M$ figures in true causal explanations, it is efficacious.

  **The Reply:** This conflates epistemology with ontology. Kim's argument is about **causal production**, not causal explanation. We can explain a window breaking by citing the baseball's momentum (macro) or the molecular collisions (micro). However, if the molecular collisions are sufficient for the breaking, the momentum property does not *add* force to the collisions.
  If NRP claims mental properties are *real*, they must do more than organize our explanations; they must track causal powers. If the causal power is fully constituted by the physical base, the mental property is an explanatory tool, not a causal agent. A non-reductive physicalist wants the mind to *do* things, not just to *describe* things that the body does. The realization response grants the latter while denying the former.

  ### 4.2. Objection: The Determinable/Determinate Model
  **The Objection:** Some (e.g., Shoemaker, Yablo) argue that the mental/physical relation is like a determinable (e.g., *Red*) and a determinate (e.g., *Scarlet*). *Scarlet* causes the pigeon to peck. Does *Red* also cause it? Yes, but not as a separate cause. The properties are not competitors; the determinable is instantiated *in* the determinate. Thus, $M$ is causally efficacious because it is the determinable aspect of the physical cause.

  **The Reply:** Kim explicitly addresses this. He argues that if the determinable ($M$) is to have causal efficacy, it must be distinct from the determinate ($P$). If they are distinct, the Exclusion Principle applies: if $P$ is sufficient, $M$ is excluded.
  If the NRP proponent says $M$ and $P$ are *not* distinct (to avoid exclusion), they collapse into reductionism. The determinable/determinate model works only if we accept that causal powers are "subsetted" (the powers of $M$ are a subset of the powers of $P$). But if the powers of $M$ are merely a subset of $P$'s powers, then $M$ has no *unique* causal contribution. It is, again, causally redundant. The realization response using this model saves the *truth* of mental causation claims only by making them trivially true in virtue of physical causation, which undermines the non-reductive claim that the mental level has autonomous causal significance.

  ### 4.3. Objection: Multiple Realizability Ensures Autonomy
  **The Objection:** Because $M$ can be realized by $P_1, P_2, P_3...$, $M$ captures a causal generalization that $P_1$ alone cannot. Therefore, $M$ is causally efficacious at the higher level of description.

  **The Reply:** This argument establishes the utility of mental *types* for scientific generalization, but it does not establish the causal efficacy of mental *tokens*. In any specific instance of causation, $M$ is realized by a specific $P_i$. It is $P_i$ that interacts with the subsequent physical chain. The fact that a different $P_j$ could have realized $M$ in a different possible world does not give $M$ causal power in the actual world over and above $P_i$. Multiple realizability explains why we *categorize* events mentally, not why those events *cause* outcomes. It is an argument for the viability of psychology as a science, not for the metaphysical causal potency of mental properties.

  ## 5. Conclusion: The Cost of the Realization Response
  The realization response attempts to save non-reductive physicalism by arguing that mental and physical events do not compete because they are realization-related. However, this defense succeeds only at the cost of admitting that **causal efficacy resides exclusively in the physical base properties.**

  By accepting that the mental event causes the outcome *only because* and *only in virtue of* the physical realizer causing the outcome, the NRP proponent concedes that the mental property itself contributes no causal power. The problem is not that there are two causes (overdetermination); the problem is that there is only one causal mechanism (the physical one), and the mental property is merely a shadow cast by that mechanism.

  Therefore, the realization response fails to defuse Kim's argument. It avoids the charge of inconsistency (overdetermination) but succumbs to the charge of **epiphenomenalism**. For the non-reductive physicalist who wishes to maintain that mental properties are both distinct and causally potent, the realization response offers no viable metaphysical footing. It leaves us with a world where the physical does all the work, and the mental is merely what the work looks like from a different perspective.
