prompt: |-
  hey so i'm in debate club and next week we're doing a thing on effective altruism, and i got assigned the side against it. I don't really know philosophy but my cousin's boyfriend (hes doing a phd in something, i think economics adjacent) sent me this long blog post critisizing EA and i wrote down the main bits. A friend of mine who likes EA says most critiques of it are strawmen, so now i don't know what i can safely say out loud without getting laughed at. Can you go through what i wrote down and tell me whats fair?

  Here are the points i copied out (shortened):

  1. "EA says: work out which intervention does the most good per dollar and fund that one. In practice that means funding whatever you can put a number on — bednets, deworming, direct cash transfers — because those have a cost per life saved you can actually calculate. And it means ignoring everything that isn't countable: building a political movement, changing what a culture cares about, preventing a war that never happens. So 'effective' in effective altruism really just means 'measurable'."

  2. "The deeper version of this is what I'd call the denominator problem. To rank two causes against each other you need a unit — dollars per life saved, dollars per unit of suffering prevented. But only some problems come with a natural unit. Malaria comes in cases. A corrupt institution, or a norm that makes people not care about strangers, doesn't. So the famous cause rankings are mostly decided by which problems happen to be countable, and EA mistakes that for evidence about which problems are biggest. Worse, when a harm can't be estimated the cost-effectiveness tables just quietly treat it as zero, which means any intervention with big messy long-run downsides looks amazing on paper."

  3. "Earning to give: take a high-paying job in finance or tech, live cheaply, donate most of it. Critics say this makes you complicit in whatever that industry does. EAs reply that it doesn't matter, because of replaceability: if you don't take the job someone else will, and that person will donate less than you, so you still make things better. But that argument proves way too much. If replaceability works, you could take a job at a tobacco company or an oil company and it's still fine, as long as you give away more than the next person would. Nobody believes that. So the whole earning-to-give thing collapses."

  4. "EA treats the world like a shopping list of separate problems to buy solutions for, instead of asking who has power and how you change that. Basically it's the politics of rich people donating money, and it quietly assumes political or structural change is a waste of time because you can't measuer it."

  5. "And then that guy who ran a big crypto exchange and was always talking about EA turned out to be a fraud and lost everyone's money, which kind of shows the whole movement was never really about helping people."

  What i'm unsure about: my friend says point 3 is the standard objection to earning to give and that EAs have a genuine answer to it, and that the "proves too much" move is doing something sneaky — but i don't get what. I also can't tell whether the denominator problem in 2 is a real criticism anyone makes or whether he just made it up, and if it is real, whether it's secretly just the same point as 1 or actually something different. And is it fair to say EA assumes political change is pointless?

  So: for each of the five, tell me what someone who actually defends EA would accept, what they'd say is a misrepresentation or an overstatement, and whats just wrong. Then tell me whether the big conclusion — that EA's ranking of causes is basically an artifact of what's easy to count, so the numbers don't really tell you anything — actually follows from the parts that are true, or whether it needs the false parts. And if the denominator problem is a real separate objection, what would a defender say back to it, because i'd rather make a point i can defend than one that sounds good for ten seconds.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school or college debate club member. Not a philosophy expert. Assigned the "Against Effective Altruism (EA)" side.
      *   **Source Material:** A blog post summary provided by a cousin's boyfriend (PhD student, economics-adjacent).
      *   **Problem:** User's pro-EA friend claims these critiques are strawmen. User is worried about looking foolish in the debate.
      *   **Task:** Evaluate the 5 points for fairness/accuracy from an EA defender's perspective. specifically address the user's uncertainties (Point 3's "replaceability" argument, Point 2's "denominator problem" vs. Point 1, Point 4's political claim). Evaluate the overall conclusion about measurability. Advise on what is defensible vs. what is risky.

  2.  **Deconstruct the 5 Points:**

      *   **Point 1: Measurability Bias ("Effective" = "Measurable").**
          *   *Critique:* EA focuses on things with clear metrics (bednets) and ignores hard-to-measure things (advocacy, systemic change).
          *   *EA Defense:* EA *tries* to estimate hard-to-measure things (e.g., longtermism, AI safety), but acknowledges uncertainty. They don't ignore them, but they demand evidence.
          *   *Verdict:* Partially fair, but overstated. It's a tension within EA, not a blanket rule.

      *   **Point 2: The Denominator Problem (Unit of Account).**
          *   *Critique:* You can't compare disparate harms (malaria cases vs. corrupt institutions) on one scale. Treating unquantifiable harms as zero biases the model.
          *   *EA Defense:* This is a known philosophical problem (incommensurability). EAs use "expected value" reasoning even with wide error bars. They don't treat unmeasured things as *zero*, but as *highly uncertain*.
          *   *Verdict:* This is a real philosophical objection (often from pluralists or critics of utilitarianism). It's distinct from Point 1 (which is about data availability, Point 2 is about moral ontology). However, claiming EA treats them as *zero* is a strawman.

      *   **Point 3: Earning to Give & Replaceability.**
          *   *Critique:* Replaceability argument justifies harmful jobs (tobacco/oil) if you donate enough. This is counter-intuitive/morally repugnant.
          *   *EA Defense:* EAs distinguish between *neutral* high-earning jobs and *harmful* ones. Replaceability isn't a blank check. There are constraints (deontology, reputation risk, direct harm). The SBF (Sam Bankman-Fried) connection complicates this.
          *   *Verdict:* The "proves too much" objection is a standard critique (the "offsetting" objection). EAs *do* have an answer (constraints on means, not just ends). Saying it "collapses" entirely is too strong.

      *   **Point 4: Politics and Structural Change.**
          *   *Critique:* EA is apolitical, individualistic, and ignores power dynamics/structural change because they are hard to measure.
          *   *EA Defense:* EA is not inherently anti-political. Many EAs work on policy (e.g., pandemic preparedness, AI governance). But EA is skeptical of *ideological* political movements that lack evidence.
          *   *Verdict:* Fair critique of *some* EA culture, but false as a definition. EA *does* engage in policy, just evidence-based policy.

      *   **Point 5: SBF/Fraud.**
          *   *Critique:* SBF was an EA, therefore EA is fraudulent.
          *   *EA Defense:* SBF violated core EA tenets (trust, honesty, long-term impact). He is an outlier/critic, not a representative. Guilt by association.
          *   *Verdict:* Weak argument. Ad hominem/association fallacy. Easy for EA side to dismantle.

  3.  **Address Specific User Uncertainties:**

      *   *Point 3 (Replaceability):* The friend is right. The "proves too much" argument assumes EA is purely consequentialist without side-constraints. Most EAs accept constraints (don't kill, don't lie, don't destroy trust). The nuance is about *marginal* harm vs. *direct* harm.
      *   *Point 2 (Denominator):* It is a real objection (incommensurability). It is distinct from Point 1. Point 1 is epistemic (we don't know the number); Point 2 is metaphysical (there *is* no common number).
      *   *Point 4 (Politics):* Saying EA assumes political change is *pointless* is a strawman. Saying EA assumes it's *harder to evaluate* is fair.

  4.  **Evaluate the Big Conclusion:**
      *   "EA's ranking is an artifact of what's easy to count."
      *   *Analysis:* This relies heavily on Points 1 and 2 being true without nuance. If EA *does* try to estimate hard things (AI risk, policy), the conclusion weakens. The conclusion needs the strong claim that EA *ignores* the unmeasurable, which is false. It's safer to argue EA *underweights* the unmeasurable due to uncertainty aversion.

  5.  **Drafting the Response:**
      *   *Tone:* Encouraging, analytical, debate-focused. Avoid jargon where possible, but explain necessary terms (e.g., "expected value," "incommensurability").
      *   *Structure:*
          *   Intro: Validate the user's caution (friend is partly right).
          *   Point-by-Point Breakdown: "Fair Grain," "The Stretch/Strawman," "How to Debate It."
          *   Addressing Specific Questions (Point 3 nuance, Point 2 vs 1, Politics).
          *   The Big Conclusion: Does it follow?
          *   Strategic Advice: What to keep, what to drop.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Point 3:* I need to be careful not to give the user *too* much ammo for the EA side. I need to explain *why* the EA defense works so the user knows where the trap is. The trap is claiming EA has *no* moral constraints. The user should argue that the *pressure* to earn to give creates perverse incentives, even if the theory has constraints.
      *   *Correction on Point 5:* Advise the user to drop this. It's a debate loser.
      *   *Correction on Point 2:* Make sure to distinguish "measurement error" (Point 1) from "category error" (Point 2).
      *   *Debate Strategy:* Focus on the *practical implementation* vs. *theoretical ideal*. EA looks good in theory, but in practice, it favors quantifiable global health over systemic change. This is the strongest ground.

  7.  **Final Review against User Prompt:**
      *   Did I answer what's fair/unfair for all 5? Yes.
      *   Did I address the Point 3 "sneaky" move? Yes.
      *   Did I address Point 2 vs Point 1? Yes.
      *   Did I address the political claim? Yes.
      *   Did I evaluate the big conclusion? Yes.
      *   Did I advise on defensibility? Yes.

  8.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction Note on SBF)*: I should mention that while SBF is a weak *logical* argument, it's a strong *pragmatic* argument about movement culture. I'll advise the user to frame it as a risk management issue rather than "EA = Fraud."

  *(Self-Correction on Replaceability)*: The "proves too much" objection is formally known as the "offsetting" objection. I should mention that EAs distinguish between *doing harm* and *allowing harm*, or use threshold deontology. I'll keep it simple for a debate context.

  *(Final check on tone)*: Keep it supportive. Debate is about arguing a position, but arguing it *well* means knowing where the landmines are.

  Okay, ready to write.s
answer: |-
  This is a very smart approach. In debate, the biggest risk isn't having a weak argument; it's having an argument that gets easily dismantled because it misrepresents the opponent's view. Your friend is partially right: some of these points are "steel-manned" (strong versions of real critiques), while others are "straw-manned" (weak versions that are easy to knock down).

  Here is a breakdown of each point, what an EA defender will say, and how you can phrase it so you don't get laughed at.

  ### Point 1: "Effective" means "Measurable"
  *   **The Fair Grain:** It is true that EA organizations (like GiveWell) heavily prioritize interventions with strong Randomized Control Trial (RCT) data. This creates a practical bias toward global health (bednets, cash) and away from advocacy or systemic change, simply because the data is cleaner.
  *   **The Strawman:** EA theory does *not* say unmeasurable things are worthless. They use "expected value" reasoning to estimate things like AI safety or pandemic prevention, which are very hard to count. They don't ignore them; they just argue the evidence is weaker.
  *   **How to Debate It:** Don't say EA *ignores* unmeasurable things. Say EA **systematically underweights** them due to "uncertainty aversion."
      *   *Safe phrasing:* "In practice, the demand for rigorous evidence creates a structural bias. When you have to choose between a sure bet (bednets) and a risky bet (political reform), EA methodology almost always picks the sure bet. This means we solve measurable problems while unmeasurable but potentially larger problems fester."

  ### Point 2: The Denominator Problem (Incommensurability)
  *   **Is this real?** Yes. This is a serious philosophical objection often called the problem of **incommensurability**. It argues that not all values can be reduced to a single unit (like "dollars per life").
  *   **Is it different from Point 1?** Yes. Point 1 is about *data* (we don't have the numbers). Point 2 is about *moral ontology* (there *are* no numbers that can capture justice or dignity).
  *   **The EA Defense:** EAs admit this is hard but argue we *must* make trade-offs anyway. If you don't use a common unit, you can't make decisions at all. They don't treat unmeasured harms as "zero," but as "highly uncertain."
  *   **How to Debate It:** This is a strong point if you keep it philosophical.
      *   *Safe phrasing:* "EA assumes all moral goods are fungible (swappable). But is preventing a cultural norm of hatred really comparable to saving a life from malaria in a spreadsheet? By forcing everything into one metric, EA might be simplifying morality so much that the map no longer matches the territory."

  ### Point 3: Earning to Give & Replaceability
  *   **Your Friend is Right:** This is the riskiest point for you. The "proves too much" argument (that you could work for a tobacco company) is a standard objection, and EAs have a prepared answer.
  *   **The EA Answer:** They distinguish between **direct harm** and **market substitution**. Most EAs agree you cannot violate basic moral constraints (lying, killing, direct destruction) even to donate money. Replaceability applies to *neutral* high-earning jobs (like trading stocks), not *harmful* ones.
  *   **The Sneaky Move:** The blog post claims replaceability implies *no constraints*. That is false.
  *   **How to Debate It:** Pivot away from "tobacco companies" (which is easy for them to deny) and focus on **complicity and reputation**.
      *   *Safe phrasing:* "Even if EA theory says 'don't take harmful jobs,' the *incentive structure* of Earning to Give pushes people toward industries with high externalities (like aggressive finance or tech). It creates a moral licensing effect where donors feel their donations wash away the ethical costs of their career. We saw this with the crypto crash." (This leads nicely into Point 5, but be careful).

  ### Point 4: Politics and Structural Change
  *   **The Fair Grain:** EA is historically skeptical of ideological political movements because they are hard to measure and often fail. This can look like status-quo bias.
  *   **The Strawman:** EA does not say political change is "pointless." Many EAs work on policy (e.g., lobbying for AI regulation or pandemic preparedness). They just want *evidence-based* policy, not *ideological* policy.
  *   **How to Debate It:** Don't say EA is anti-political. Say EA is **technocratic**.
      *   *Safe phrasing:* "EA approaches social change like an engineer, not an activist. It looks for specific levers to pull. But many problems (like inequality or racism) aren't engineering problems; they are power problems. By focusing on 'fixing' symptoms efficiently, EA can inadvertently ignore the root causes that require messy political struggle."

  ### Point 5: The SBF / Crypto Fraud Argument
  *   **Verdict:** **Drop this.**
  *   **Why:** This is a "guilt by association" fallacy. An EA defender will easily say: "Sam Bankman-Fried lied and stole. That violates EA principles of honesty and trust. He is a counter-example, not a representative."
  *   **Risk:** If you lean on this, you look like you're attacking people rather than ideas. It undermines your intellectual credibility.
  *   **Exception:** You can mention it *only* as an example of "risk management." (e.g., "When a movement relies on huge donations from single individuals in volatile industries, it creates systemic risk.") But generally, leave this one out.

  ---

  ### Addressing Your Specific Questions

  **1. Is the "Proves Too Much" move on Point 3 sneaky?**
  Yes. It assumes EA is "Act Consequentialism" (the only thing that matters is the outcome). Most modern EAs are "Moderate Consequentialists." They believe outcomes matter most, *but* you still have to follow rules (don't lie, don't kill).
  *   **Your Strategy:** Don't argue that EA *theory* allows working for a tobacco company. Argue that the *culture* of Earning to Give makes people rationalize ethically dubious careers because they focus so much on the donation at the end.

  **2. Is the Denominator Problem (Point 2) real and distinct from Point 1?**
  Yes, it is real and distinct.
  *   **Point 1** says: "We can't measure the impact of changing a culture, so we skip it." (Epistemic problem).
  *   **Point 2** says: "Even if we could measure it, 'cultural health' and 'lives saved' are different *kinds* of good that shouldn't be traded off." (Metaphysical problem).
  *   **Defender's Counter:** "We have to trade them off whether we like it or not. Resources are finite. If you don't use a framework to compare them, you're just guessing."
  *   **Your Counter:** "Using a false precision (pretending we can compare them with numbers) is worse than guessing. It gives a false sense of certainty to arbitrary decisions."

  **3. Is it fair to say EA assumes political change is pointless?**
  No, that is too strong.
  *   **Better phrasing:** EA assumes political change is **high-risk and low-traceability**. They prefer interventions where they can see the direct result of their dollar. This biases them against long-term structural change.

  ---

  ### The Big Conclusion: "EA rankings are just artifacts of what's easy to count."

  **Does this follow?**
  It follows *only if* you successfully argue that EA *fails to account for uncertainty* properly.
  *   If you say: "EA ignores hard-to-count things," the EA side will show you their work on AI Safety (which is very hard to count). You will lose.
  *   If you say: "EA's methodology *privileges* countable things because they offer higher confidence, leading to a portfolio of causes that is skewed toward the measurable," you are on solid ground.

  **The "Safe" Argument for Your Debate:**
  Don't argue that EA is *wrong* about bednets. Argue that EA is **incomplete** as a moral framework.
  1.  **Measurement Bias:** EA solves the problems that are easiest to solve, not necessarily the most important ones.
  2.  **Technocratic Bias:** EA treats politics like engineering, ignoring power dynamics.
  3.  **Moral Licensing:** The "Earning to Give" model can encourage harmful careers if the donation is large enough (even if theory forbids it, human psychology is weak).

  **Summary of Advice:**
  *   **Keep:** Points 1, 2, and 4 (with the nuanced phrasing above).
  *   **Modify:** Point 3 (Focus on incentives/psychology, not the theoretical "tobacco" edge case).
  *   **Drop:** Point 5 (SBF). It's a trap.

  If you argue that **"Effective Altruism is a useful tool for global health, but a dangerous guide for systemic social change because it mistakes measurability for importance,"** you will sound reasonable, informed, and very hard to defeat. Good luck!
