  3. The boots circulation asserts Underwriting Blame is inescapable and material, forcing the living to profit from the dead regardless of intent. Here the novel surpasses philosophical vocabulary by depicting responsibility as a physical contagion rather than a normative status.

  4. Paul's leave and the Frenchman's death deny Authorial Blame to the soldier, replacing political guilt with the universal stain of participation. The novel argues that distinguishing between starting and fighting the war is a luxury of the home front, not a reality of the trench.

