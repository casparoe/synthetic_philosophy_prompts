answer: |-
  ### THE PROCEDURE (One-Page Protocol)

  **Objective:** Convert imprecise inputs into a defensible recommendation within 5 working days.
  **Scope:** All proposed interventions requiring Scientific Advisory Committee (SAC) review.

  **1. Elicitation & Bounding (Days 1-2)**
  *   **Do not ask for "the probability."** Ask three subject-matter experts (SMEs) independently for:
      1.  *Plausible Lower Bound:* The value defensible without assuming luck.
      2.  *Plausible Upper Bound:* The value defensible without assuming catastrophe.
      3.  *Model Confidence:* A confidence rating (0-1) in the structural model itself.
  *   **Construct the Set ($\mathcal{P}$):** The admissible probability set is the convex hull of the SME bounds, discounted by Model Confidence.
      *   *Record:* Document the dissent. If SME A says 1% and SME B says 10%, $\mathcal{P} = [0.01, 0.10]$. Do not average.
  *   **Trap Avoidance:** Fix the *model class* before reviewing new data. New data may narrow the interval (parameter learning) but must not expand the model class (structural uncertainty) mid-stream. If data contradicts the model class, halt and restart Day 1.

  **2. Rule Selection (Day 3)**
  *   **Analyst Role:** You do *not* choose the decision rule based on preference. You classify the **Risk Type**, which maps to a pre-committed Agency Rule:
      *   *Type I (Reversible, Distributed Harm):* Use **E-admissibility** (allow any option optimal under some $P \in \mathcal{P}$). *Rationale: Encourages innovation where errors are correctable.*
      *   *Type II (Irreversible, Catastrophic Harm):* Use **Maximin** (maximize the minimum utility). *Rationale: Precautionary principle for existential or permanent damage.*
      *   *Type III (Mixed/Uncertain):* Use **Maximality** (reject only if dominated under all $P \in \mathcal{P}$). *Rationale: Prevents false negatives when trade-offs are complex.*
  *   **Defense:** The defense lies in the Agency's pre-commitment to the Risk Type classification, not the analyst's judgment on the day.

  **3. Application & Conflict Resolution (Day 4)**
  *   Calculate the recommended action using the assigned rule.
  *   **If Rules Disagree:** (e.g., E-admissibility says "Go," Maximin says "Stop").
      *   *Action:* Recommendation is **INDETERMINATE**.
      *   *Output:* Do not resolve mathematically. Hand off to Decision Maker (Day 5).
  *   **Stopping Condition (Automatic No):** If the *upper bound* of harm exceeds the Agency's statutory safety threshold, recommend **REJECT** regardless of benefit.

  **4. Hand-Off (Day 5)**
  *   **The Fact/Value Line:** If the procedure yields a clear recommendation, submit to SAC.
  *   **The Value Line:** If the procedure yields **INDETERMINATE** or requires choosing between a certain small cost and an uncertain large benefit, the output is a **Risk Tolerance Query**.
  *   **Named Recipient:** The Director of Risk Management.
  *   **Question to Ask:** "The data admits both adoption and rejection. How much ambiguity is the Agency willing to bear?"

  ***

  ### APPLICATION TO PROPOSALS

  #### Proposal 1: Population Screening Programme
  **Context:** A new biomarker screen for a slow-progressing cancer.
  **Uncertainty:** Prevalence is known, but *sensitivity* and *specificity* vary by demographic subgroups not fully represented in trials.
  **Elicitation:**
  *   SME A (Trial Lead): Sensitivity 90-95%.
  *   SME B (Epidemiologist): Sensitivity 70-90% (due to demographic drift).
  *   SME C (Clinician): Specificity 85-99% (false positives cause anxiety/biopsy harm).
  *   **Set $\mathcal{P}$:** Net Benefit Probability is $[0.40, 0.85]$. Harm Probability (False Positive Cascade) is $[0.05, 0.25]$.
  **Risk Type:** Type I (Reversible). Screening can be stopped; false positives are treatable though distressing.
  **Rule:** **E-admissibility**.
  **Analysis:**
  *   Under the optimistic distribution ($P_{high}$), Net Utility is strongly positive.
  *   Under the pessimistic distribution ($P_{low}$), Net Utility is slightly negative.
  *   Since "Adopt" is optimal under *some* admissible distribution ($P_{high}$), it is E-admissible.
  **Recommendation:** **ADOPT (with monitoring).**
  **Rationale:** Because the harm is reversible, we allow the optimistic model to drive the decision, provided we monitor the real-world false positive rate. If the rate exceeds the lower bound of the specificity estimate, we trigger a review.

  #### Proposal 2: Novel Gene-Drive Vector Control
  **Context:** Releasing genetically modified mosquitoes to eradicate malaria.
  **Uncertainty:** High confidence in human benefit; imprecise ecological risk (potential for cross-species gene transfer leading to ecosystem collapse).
  **Elicitation:**
  *   SME A (Geneticist): Ecological risk < 0.001%.
  *   SME B (Ecologist): Ecological risk 1-5% (model bounds are wide due to complex system dynamics).
  *   SME C (Ethicist): Refuses to quantify existential risk.
  *   **Set $\mathcal{P}$:** Probability of Significant Ecological Harm is $[0.00001, 0.05]$.
  **Risk Type:** Type II (Irreversible/Catastrophic). Once released, organisms cannot be recalled; ecosystem collapse is permanent.
  **Rule:** **Maximin**.
  **Analysis:**
  *   *Best Case:* Malaria eradicated, no ecological harm.
  *   *Worst Case (within $\mathcal{P}$):* Malaria eradicated, but 5% chance of regional ecosystem collapse.
  *   *Utility:* The disutility of ecosystem collapse is assigned a value approaching $-\infty$ (or exceeding statutory mandates).
  *   *Maximin Calculation:* The minimum utility of "Release" is catastrophic. The minimum utility of "Status Quo" is continued malaria burden (bad, but finite).
  **Recommendation:** **REJECT.**
  **Rationale:** Under Maximin, the lower bound of the ecological risk profile dominates the upper bound of the human benefit.

  **The "Unlikeable" Answer:**
  As the analyst, I find the Recommendation on Proposal 2 difficult to accept. The human benefit is certain and immediate (lives saved now); the ecological risk is theoretical and probabilistic. My intuition screams that withholding a malaria cure is morally costly. However, the procedure forces a **REJECT** because the Agency pre-committed to Maximin for irreversible ecological risks. I cannot smooth this over with an expected value calculation. I must submit the rejection, knowing it may cost lives in the short term, because the procedure is designed to protect against the tail risk I cannot quantify away.

  ***

  ### WHAT THE PROCEDURE CANNOT SETTLE

  1.  **The Meta-Uncertainty of Rule Selection:** While we map Risk Types to Rules, classifying a risk as "Irreversible" (Type II) vs. "Mixed" (Type III) is itself a judgment call. If the ecological damage is reversible over 100 years, is it Type I or II? The procedure pushes this value judgment to the front end but cannot eliminate it.
  2.  **The Cost of Ambiguity Aversion:** By using Maximin or Maximality, we implicitly assign a cost to *not knowing*. The procedure does not calculate whether the cost of being cautious (e.g., delayed malaria eradication) outweighs the cost of the ambiguity itself.
  3.  **The Hand-Off Burden:** When the procedure yields "INDETERMINATE," it passes the psychological burden of the decision to the Director. It does not solve the problem of decision-making under ambiguity; it merely formalizes the point where mathematics ends and leadership begins.
  4.  **Dilation from New Models:** While we fix the model class to avoid the evidence trap, if the fixed model class is fundamentally wrong, the procedure guarantees a precise error rather than a vague truth. It protects against *internal* inconsistency, not *external* validity.

  **Final Note to Analyst:** Your job is no longer to find the truth. It is to map the boundaries of our ignorance so clearly that the decision-maker cannot claim they did not see the dark corners.
