prompt: |-
  I have recently become the analyst who prepares the risk assessments on which my agency's scientific advisory committee decides whether to adopt a proposed intervention. My colleagues keep handing me a single best-estimate number for the relevant probability, and I no longer think that number is honest: what we actually have is a set of disagreeing estimates, a model identified only within bounds, and sparse data. Once the probability is a set rather than a point, expected-utility maximisation stops telling me what to do, and I know there are rival replacements -- maximin (do as well as possible in the worst case), maximin expected utility (do as well as possible under the worst admissible distribution), Hurwicz (a blend of the best and worst cases), E-admissibility (admit any option that is optimal under some admissible distribution), and maximality (admit any option that no other option beats under every admissible distribution). Write me a procedure my team can run on any proposal, within about a week and recorded on a page: how to elicit, bound and record the set; how to choose among these rules and defend the choice, given that choosing a rule is itself a decision under the uncertainty we are trying to handle; what to do when the rules disagree; how to avoid the trap in which collecting more evidence makes the set wider rather than narrower; where the procedure stops with a no; and where it must hand the decision to a named person because the residual question is how much risk we are willing to accept rather than a question of fact. Then run it on two proposals -- a screening programme whose benefit and harm are both uncertain, and a novel vector-control intervention with an imprecise ecological risk -- including one whose answer I will not like, and close by saying what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Risk Analyst for a scientific advisory committee.
      *   **Problem:** Colleagues provide single point estimates for probabilities, but the reality is imprecise (sets of estimates, bounded models, sparse data). Expected Utility (EU) maximization fails with sets of probabilities.
      *   **Task:** Create a one-page procedure (runnable in ~1 week) for handling imprecise probabilities in risk assessment.
      *   **Key Components of Procedure:**
          *   Elicit, bound, and record the set of probabilities.
          *   Choose among decision rules (Maximin, Maximin EU, Hurwicz, E-admissibility, Maximality) and defend the choice (acknowledging the meta-uncertainty).
          *   Handle disagreement among rules.
          *   Avoid the "more evidence = wider set" trap (dilation/ambiguity aversion issues).
          *   Define stopping conditions (when to say "no").
          *   Define hand-off points (when to pass to a decision-maker for risk tolerance).
      *   **Application:** Run the procedure on two proposals:
          1.  Screening programme (uncertain benefit/harm).
          2.  Novel vector-control intervention (imprecise ecological risk).
          *   *Constraint:* One result must be one the analyst "will not like" (implying a recommendation contrary to intuition or preference, demonstrating the rigor of the procedure).
      *   **Conclusion:** State what the procedure *cannot* settle.
      *   **Format:** Concise, actionable, "recorded on a page" (though the explanation will need more space, the core procedure should be distinct).

  2.  **Deconstruct the Philosophical/Technical Context:**
      *   The user is describing *Imprecise Probability* (IP) theory (Walley, Levi, Gilboa, Schmeidler).
      *   The shift from Bayesian point estimates to sets of priors/probabilities.
      *   The decision rules mentioned are standard in IP literature:
          *   *Maximin (Wald):* Pessimistic.
          *   *Maximin Expected Utility (MEU):* Gilboa-Schmeidler.
          *   *Hurwicz:* Weighted average of best/worst.
          *   *E-admissibility:* Levi.
          *   *Maximality:* Walley.
      *   The "trap" refers to *Dilation* (where conditioning on new evidence widens the probability interval) or simply the recognition of model uncertainty that point estimates hide.
      *   The "hand-off" acknowledges the Is/Ought distinction (risk assessment vs. risk management).

  3.  **Drafting the Procedure (The "One-Page" Core):**
      *   Needs to be structured logically: Elicitation -> Aggregation -> Decision Rule Selection -> Application -> Reporting.
      *   *Elicitation:* Don't ask for "the number." Ask for bounds, scenarios, and confidence. Use a "Reasonable Range" approach.
      *   *Bounding:* Define the set $\mathcal{P}$.
      *   *Rule Selection:* This is the tricky part. How to choose a rule under uncertainty? The procedure needs a default hierarchy based on the *consequence type* (catastrophic vs. reversible).
      *   *Disagreement:* If rules conflict, the recommendation is "Indeterminate" -> Hand off.
      *   *Evidence Trap:* Pre-register the model structure. Distinguish between *aleatory* (randomness) and *epistemic* (ignorance) uncertainty. Don't update the set bounds with data that only highlights model structural uncertainty.
      *   *Stop/Hand-off:* Clear thresholds.

  4.  **Developing the Case Studies:**
      *   *Case 1: Screening Programme.*
          *   Context: Medical/Public health.
          *   Uncertainty: Sensitivity/Specificity vs. Prevalence.
          *   Outcome: Usually benefits are overestimated. Let's make the IP analysis show that the harm dominates under Maximin, even if EU says go.
      *   *Case 2: Vector-Control.*
          *   Context: Environmental/ECological.
          *   Uncertainty: Non-target species impact.
          *   Outcome: Needs to be the one the analyst "won't like." Maybe the analyst wants to stop it due to ecological risk, but the procedure (using E-admissibility or Maximality) shows it's not dominated by the status quo, forcing a "Proceed to Decision Maker" recommendation instead of a hard "No." Or, conversely, the analyst wants to approve it, but Maximin kills it. Let's go with the latter: Analyst wants to approve (innovation), but the procedure forces a cautionary "No/Indeterminate" due to catastrophic tail risk. *Correction:* The prompt says "including one whose answer I will not like." Usually, analysts want to be decisive. If the procedure forces a "Hand-off" when they want a "Yes/No," that's annoying. Or if it forces a "No" on a pet project. Let's make the Vector-Control one the "unlikeable" one. The analyst sees potential, but the *Maximin* rule (appropriate for irreversible ecological harm) kills it.
      *   *Refining the "Unlikeable" aspect:* It's more poignant if the procedure forces a *recommendation to reject* a promising intervention because the lower bound of risk is too high, despite the upper bound of benefit being huge. This highlights the cost of robustness.

  5.  **Addressing the "Choosing a Rule" Paradox:**
      *   How to choose a decision rule under uncertainty? This is infinite regress.
      *   Solution: Pre-commitment based on *context*, not case-by-case. The Agency must adopt a "Constitution" for decision rules based on the *nature of the harm* (reversible vs. irreversible, distributed vs. concentrated). This removes the analyst from making the normative choice case-by-case.

  6.  **Addressing the "Evidence Trap" (Dilation):**
      *   Why does more evidence widen the set? Because it reveals model instability.
      *   Mitigation: Fix the model class *before* looking at data (pre-analysis plan). Separate parameter uncertainty from model structural uncertainty.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, rigorous, slightly philosophical but actionable.
      *   *Structure:*
          1.  The Procedure (The "One-Pager").
          2.  Application to Proposal A (Screening).
          3.  Application to Proposal B (Vector-Control).
          4.  Limitations.

  8.  **Refining the Decision Rule Selection:**
      *   I need to be specific.
      *   *Catastrophic/Irreversible:* Maximin.
      *   *Reversible/Repeatable:* E-admissibility or Maximality (allows for learning).
      *   *Mixed:* Hurwicz (with pre-set $\alpha$).
      *   *Defense:* This isn't the analyst choosing; it's the Agency's pre-set policy. The analyst just classifies the risk type.

  9.  **Refining the "Unlikeable" Outcome:**
      *   Let's make the Vector-Control intervention the one the analyst likes (it saves lives from disease) but the procedure recommends *against* adoption (or indeterminate/hand-off) because the ecological risk set includes a non-zero probability of collapse, and the rule is Maximin. The analyst feels the human cost of delay, but the math says "stop."

  10. **Final Review against Constraints:**
      *   Procedure on a page? (I will format it as a distinct block).
      *   Week timeline? (Feasible).
      *   Elicit/Bound/Record? (Included).
      *   Choose/Defend Rule? (Included via pre-commitment).
      *   Disagreement? (Included).
      *   Evidence Trap? (Included).
      *   Stop/Hand-off? (Included).
      *   Two proposals? (Included).
      *   One unlikeable answer? (Included).
      *   What it cannot settle? (Included).

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Check:* Did I explain *how* to choose the rule without falling into the same uncertainty trap?
      *   *Fix:* Emphasize that the *Agency* sets the rule based on risk type, not the analyst. The analyst classifies the risk type. This breaks the regress.
      *   *Check:* Is the "Evidence Trap" clear?
      *   *Fix:* Explicitly mention "Pre-registered Model Class" to prevent dilation from post-hoc model searching.
      *   *Check:* Is the "One Page" constraint met?
      *   *Fix:* I will create a specific section titled "THE PROCEDURE (One-Page Protocol)" that is concise enough to be printed on a single sheet, followed by the elaboration and case studies.

  12. **Final Polish:** Ensure the distinction between *risk assessment* (facts/uncertainty) and *risk management* (values/tolerance) is sharp in the hand-off section.

  *(Self-Correction on the "Unlikeable" outcome)*: If I make the Vector-Control one the "No," it might be too standard. What if the procedure says "Indeterminate" when the analyst wants to be decisive? That's also frustrating. Let's stick with the Maximin "No" on a high-benefit project. It illustrates the cost of robustness best.

  *(Self-Correction on Evidence Trap)*: The prompt asks "how to avoid the trap in which collecting more evidence makes the set wider." This is specifically about *Dilation*. The solution is to distinguish between learning about parameters (narrows set) and learning about model failure (widens set). The procedure must mandate fixing the model class *before* data ingestion.

