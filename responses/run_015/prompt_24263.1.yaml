answer: |-
  # Seminar Prep Sheet: Defending Strawson's Basic Argument

  **Position Summary:** You are defending an *Ultimate Responsibility* (UR) incompatibilist view. You concede compatibilist "choice" (reasons-responsiveness, momentary alternatives) but argue this is insufficient for *basic desert* (retributive blame/praise). The Basic Argument (BA) holds because the source of action (character/desires) is unchosen.

  ## I. Strategic Stance: What to Concede vs. Hold

  **Concede Up Front (The "Soft" Ground):**
  *   **Social Utility:** Concede that compatibilist responsibility is sufficient for *forward-looking* practices (moral education, social coordination, safety). Do not claim we should abolish all talk of responsibility.
  *   **Phenomenology:** Concede that it *feels* like we are ultimately responsible. Do not argue that the experience of freedom is an illusion, only that the *metaphysical grounding* of that experience is impossible.
  *   **Legal Pragmatism:** Concede that the legal system *must* function as if responsibility exists to maintain order. Your argument is moral/metaphysical, not necessarily a blueprint for immediate legal abolition.

  **Hold Firm (The "Hard" Ground):**
  *   **The Desert Claim:** Hold that *basic desert* (being blamed/praised *just because* you did it, not for future benefits) requires UR.
  *   **The Regress:** Hold that any attempt to secure UR leads to an infinite regress (you must choose your nature to be responsible for your nature, ad infinitum).
  *   **The Irrelevance of APs:** Hold that Alternative Possibilities (even if granted) do not solve the problem of *sourcehood*. Having a choice doesn't matter if the chooser is determined by unchosen factors.

  ---

  ## II. Anticipated Objections (Ordered by Likelihood & Damage)

  ### 1. The "Changing the Subject" Objection (Compatibilists)
  **Who:** The two Frankfurt/Compatibilist scholars.
  **Likelihood:** Very High. **Damage:** High (Undermines the stakes).
  **The Question:** "You've conceded that agents can choose differently in the moment based on reasons. You've conceded they aren't coerced. You're essentially agreeing that agents possess reasons-responsiveness and identification with their motives. So, you've conceded everything that matters for moral practice. Aren't you just stipulating a definition of 'responsibility' (Ultimate Responsibility) that no one actually needs, and then triumphantly showing it's impossible? Why should we care about a kind of responsibility that serves no function?"

  **Your Reply (2 mins):**
  "I'm not changing the subject; I'm distinguishing between *responsibility as a social practice* and *responsibility as a condition for basic desert*. I grant you the former. We can hold people accountable to improve behavior or protect society. But when we inflict suffering via retributive blame—saying an agent *deserves* pain purely because of a past act—we are making a metaphysical claim about the agent's relation to that act.
  Strawson's point is that for *desert* to be just, the agent must be the *ultimate source* of the act. If my character determines my choice, and I didn't choose my character, I am not the ultimate source. Compatibilists offer a 'shallow' freedom that explains how we navigate the world, but it doesn't justify the *backward-looking* retribution that defines our moral anger. I'm not saying UR is useful; I'm saying it's the necessary condition for the kind of blame we actually practice, and since it's impossible, that blame is unjustified."

  **Where it's Soft:** You risk sounding like you're protecting an incoherent concept. If they press that "desert" itself is a primitive social tool that doesn't *need* metaphysical grounding, you have no reply other than intuition.

  ### 2. The "Quarantine Model" Trap (Legal Philosophers)
  **Who:** The two Legal Philosophers.
  **Likelihood:** High. **Damage:** Very High (Practical collapse).
  **The Question:** "If no one is morally responsible, on what basis do you distinguish the murderer from the sleepwalker or the person having a seizure? Both are products of antecedent conditions. If you reject desert, you seem forced into a 'quarantine model' where we detain people solely based on dangerousness. But that treats people like diseased animals, not agents. Doesn't your view strip humans of the very dignity you claim to protect by making them objects of management rather than subjects of justice?"

  **Your Reply (2 mins):**
  "That is a serious cost, and I accept it. The distinction between the murderer and the sleepwalker remains, but it shifts from *moral* to *causal*. The murderer's actions flow from a stable, reasons-responsive character; the sleepwalker's do not. We can treat the murderer differently because their 'dangerousness' is more persistent and responsive to incentives.
  However, you are right that this looks like management. My claim is that the 'dignity' of retributive justice is an illusion. It is more dignified to treat humans as natural beings who need correction or containment than to pretend they are metaphysically magical *causa sui* who deserve suffering. We can maintain respect without desert by focusing on rights and humane treatment, even within a quarantine framework. The 'dignity' of desert is bought at the price of truth."

  **Where it's Soft:** This is the hardest pill to swallow. If they push on *rights* (who has rights if they aren't responsible agents?), you may have to concede that rights are also pragmatic fictions, which weakens your moral standing.

  ### 3. The "Begging the Question" Objection (Libertarian)
  **Who:** The Agent-Causation Libertarian.
  **Likelihood:** Medium. **Damage:** Medium (Metaphysical stalemate).
  **The Question:** "Strawson's argument assumes that to be responsible for your nature, you must have *chosen* it via a prior mental act. But agent-causationists argue that agents are substances that can originate causes without being determined by prior states. You're assuming a Humean event-causation model. Why should I accept your premise that 'responsibility requires a prior choice' rather than 'responsibility requires agent-causal power'?"

  **Your Reply (2 mins):**
  "Strawson's argument is designed to survive indeterminism. Even if you have agent-causal power, the question arises: *Why* did you exercise that power in way A rather than way B? If the answer is 'because of who I am,' then we are back to my nature determining the act. If the answer is 'nothing determined it,' then it's random, and randomness doesn't ground responsibility.
  To be ultimately responsible for the exercise of your agent-causal power, you would need to be responsible for having the power you have and the reasons you weigh. Since you didn't create yourself ex nihilo, you are still stuck with a nature you didn't choose. The regress stops only if you claim to be *causa sui* in a literal, theological sense, which is impossible for finite beings."

  **Where it's Soft:** Libertarians often reject the "Why did you choose A?" demand as a category mistake. They may accuse you of demanding a deterministic explanation for an indeterministic act. You can't prove them wrong; you can only assert the regress intuition.

  ### 4. The "Frankfurt" Objection (Compatibilists)
  **Who:** The Frankfurt Specialists.
  **Likelihood:** Medium. **Damage:** Low (You already conceded this, but they might press).
  **The Question:** "You conceded that agents can choose differently. But Frankfurt cases show that Alternative Possibilities (APs) are irrelevant to responsibility. An agent can be responsible even if they couldn't have done otherwise. So why does your argument rely on the 'could not have done otherwise' regarding character? If APs don't matter, why does the inability to change your character matter?"

  **Your Reply (2 mins):**
  "I agree that APs in the moment are insufficient. That's why I concede 'shallow' choice but deny it solves the problem. Frankfurt cases show you don't need APs for responsibility *if* the actual sequence is appropriate (e.g., reasons-responsive).
  But my argument targets the *actual sequence* itself. In a Frankfurt case, the agent acts from their own desires. My argument asks: 'Where did those desires come from?' If the actual sequence is determined by unchosen antecedent conditions, the lack of APs is a symptom, not the disease. The disease is *sourcehood*. Frankfurt saves responsibility from the lack of APs, but not from the lack of Ultimate Sourcehood."

  **Where it's Soft:** If they argue that *sourcehood* is fully satisfied by reasons-responsiveness (as Fischer does), you are back to Objection #1 (Changing the Subject).

  ---

  ## III. The "Embarrassing Question" (Hope They Don't Ask)

  **Who:** The Legal Philosophers (specifically the one focused on *Mens Rea*).
  **The Question:** "If ultimate responsibility is impossible, then *Mens Rea* (the guilty mind) is a fiction. An intentional killer and a negligent killer are both products of unchosen character flaws. On your view, is there *any* moral difference between premeditated murder and accidental manslaughter? If you say 'yes,' you are smuggling in a notion of responsibility you just rejected. If you say 'no,' you are advocating for a legal system that ignores the most fundamental distinction in criminal law. Which is it?"

  **Why it's Embarrassing:**
  *   If you say **"Yes, there's a difference,"** they will ask *what grounds that difference* if not responsibility. If you say "intent," they will ask "why does intent matter if the intent was unchosen?" You risk contradicting your core thesis.
  *   If you say **"No, there's no moral difference,"** you sound morally monstrous to a legal audience. It implies that punishment should be based *solely* on outcome/harm, which violates deep legal intuitions about fairness.
  *   **The Trap:** It forces you to admit that your theory renders the *grading* of crimes (1st degree vs. 2nd degree) arbitrary from a moral standpoint, reducing the legal system to pure risk management.

  **Damage Control (If Asked):**
  Do not deny the distinction. Ground it in **dangerousness and predictability**, not desert.
  *   *Reply:* "There is a practical difference, not a moral one. The intentional killer demonstrates a more stable, dangerous character structure than the negligent one. We detain the former longer because they are a higher risk, not because they are 'worse' in the eyes of the universe. It feels unjust because we are wired to believe in desert, but justice requires us to overcome that wiring." (This is weak, but it's the only consistent move).
