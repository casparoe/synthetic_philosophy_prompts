      *   *Check:* Did I mark judgment calls? Yes, need a specific section or annotations.
      *   *Check:* The "Spring Slate" scenario: 4 Stable (High Prob) vs 2 Dying (Med Prob). Old policy took 4 Stable. New policy must take 2 Dying. What about the other 4 courses? Fill with next available. If only these 6 applied, 2 courses go unused? Or assume there were others. I will assume there were others to fill the 8 slots, or note the unused courses as a system failure. Let's assume the slate had enough applicants to fill 8, but the *conflict* was between these groups. I will focus on the *choice* between the 4 Stable and 2 Dying.
      *   *Check:* The Lottery Objection. Need a specific script for the rationale.
      *   *Check:* "Hated Verdict." Slate (b) is the best candidate. 11 people lose hearing so 4 don't die. Utilitarians will hate this. I need to own it.

  10. **Final Polish:** Ensure the distinction between "indifference" and "equal concern" is clear. Ensure the "non-aggregation" principle is cited as the reason for prioritizing severity over numbers.

  *(Self-Correction on Slate C)*: The prompt says "In the spring we awarded four courses to patients whose disease was stable... and turned down two who would have died within a year". It implies these were the competing groups for the limited slots. I need to show how the new procedure flips this.

  *(Self-Correction on Divisibility)*: The prompt says "courses must go whole". The pharmacist asks "what if one formulation could be divided". I need to answer whether divisibility *should* make a difference ethically, even if procedurally forbidden. Ethically, if half-dose works 50%, it might be better to treat 2 people. But if half-dose works 0%, it's waste. I will assume for the procedure that we must follow the manufacturer's rule, but note the ethical implication.

  *(Final check on Philosophy)*: The prompt asks to ground it in "whether harms to different people can be added together." I need to explicitly state: We are adopting a **Non-Aggregationist** stance. A stronger claim (death) cannot be outweighed by the sum of weaker claims (hearing/stability), but among equal claims, we aggregate via lottery.

