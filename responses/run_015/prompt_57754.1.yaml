answer: |-
  # The Regional Enzyme-Replacement Allocation Procedure (REAP)

  **Effective Date:** Immediate
  **Authority:** Allocation Committee
  **Philosophical Basis:** Moderate Non-Aggregationism with Fair Chance Adjudication

  ## Preamble: The Ethical Stance
  This procedure is grounded in the judgment that **harms to different people do not simply add up.** A loss does not become morally greater merely because it is spread across more people. Therefore, a claim based on preventing imminent death is stronger than a claim based on preventing stable deterioration, regardless of how many people face the stable deterioration. However, when claims are of **equal strength**, justice requires we give each person an equal chance, not because we are indifferent to who lives, but because we respect them equally.

  We acknowledge that this procedure will sometimes sacrifice the *greatest total benefit* (the number of successful treatments) to honor the *strongest individual claims* (the urgency of need). This is a deliberate choice.

  ---

  ## 1. The Decision Sequence
  The committee must ask the following questions in strict order. You may not proceed to Question 2 until Question 1 is resolved for the whole slate. You may not proceed to Question 3 until Question 2 is resolved.

  **Question 1: Viability (The Threshold of Benefit)**
  *   **Ask:** Is the probability of response ($P$) sufficient to justify using a scarce resource?
  *   **Sufficient Answer:** $P \geq 20\%$. (This is a judgment call; see Section 8).
  *   **Refusal:** If $P < 20\%$, the application is rejected. The course is not spent.
  *   **Hand-off:** Facts only. No values here.

  **Question 2: Urgency (The Strength of Claim)**
  *   **Ask:** What is the time to irreversible organ failure *without* treatment?
  *   **Sufficient Answer:** Assign the applicant to an Urgency Band.
      *   **Band A (Critical):** $\leq 12$ months.
      *   **Band B (Serious):** $13-24$ months.
      *   **Band C (Stable):** $> 24$ months.
  *   **Refusal:** If the form is ambiguous, the Committee Chair consults the two clinicians for a consensus interpretation of the medical data *only*. No external data gathering.
  *   **Hand-off:** If the number of applicants in Band A exceeds available courses, stop. Do not look at Band B or C. Go to Question 3. If Band A is fully funded, move to Band B, and so on.
  *   **Why this order:** This prevents the "Spring Error." It ensures that a dying patient is not skipped to treat a stable patient with better odds. Severity trumps Probability.

  **Question 3: Numbers vs. Chance (Adjudicating Equal Claims)**
  *   **Ask:** Within the active Urgency Band, do we have enough courses for all viable applicants?
  *   **Sufficient Answer:**
      *   **If Yes:** Award all.
      *   **If No:** A lottery is **required**.
  *   **Refusal:** You may not select based on "social value," "age," or "first-come."
  *   **Hand-off:** To the Randomization Protocol (see Section 2).

  **Question 4: Prior Rejections (Residual Claims)**
  *   **Ask:** Has any applicant in the current lottery pool been rejected in a prior quarter due to lack of supply (not viability)?
  *   **Sufficient Answer:** Yes/No verification from Committee records.
  *   **Action:** If Yes, that applicant receives **two entries** in the lottery instead of one.
  *   **Limit:** This applies only to the immediate prior quarter. It does not accumulate into a queue.

  ---

  ## 2. Equal Chances and Weighting
  **Rule:** When applicants fall within the same Urgency Band and meet the Viability Threshold, their claims are considered **equal in strength**.

  **Equal Chances Required:** Yes. When claims are equal, a weighted lottery based on severity is forbidden because the severity has already been accounted for in the Banding (Question 2). To weight further would be to double-count severity.

  **Deriving Weights from Months:** We do not weight by specific months within a band.
  *   *Reasoning:* The form reports months, but months are not a common moral scale. 11 months is not morally "twice as urgent" as 22 months in a way that justifies doubling the chance of life.
  *   *Procedure:* We use **Bands** to create moral equality. Everyone in Band A is treated as having the same claim, whether they have 2 months or 11 months. This is a judgment call to make the procedure runnable.

  **The Lottery Mechanism:**
  1.  List all eligible applicants in the active Band.
  2.  Assign entries (1 per applicant, +1 if rejected last quarter).
  3.  Draw names until courses are filled.
  4.  **Documentation:** The written record must state: "A random draw was conducted. This was not an expression of indifference, but the only method to respect equal claims without arbitrary discrimination."

  ---

  ## 3. The Order of Questions and Consistency
  **Why Order Matters:**
  If we ask about **Numbers first** (Utilitarianism), we commit the Spring Error. We would treat 4 stable patients as "better" than 2 dying patients because $4 > 2$ and the odds are higher. This violates the principle that a stronger claim (life/death) cannot be aggregated against weaker claims (stability).

  If we ask about **Severity first** (Lexical Priority), we protect the dying. However, this exposes the procedure to the "Hated Verdict" (see Section 6).

  **Consistency and Cycling:**
  This procedure uses **Lexical Ordering** (Severity > Probability > Chance). This prevents cycling.
  *   *Cycling Risk:* If we allowed trade-offs (e.g., "Is 1 death worth 3 hearing losses?"), we would cycle. One committee might say yes, the next no.
  *   *Our Solution:* We do not trade. Band A always beats Band B. This guarantees consistency across quarters and committee turnovers.
  *   *Exposure:* The procedure is exposed to **rigidity**. If a Band B patient is at 13 months and a Band A patient is at 12 months, the Band A patient wins, even if the difference is negligible. We accept this rigidity to avoid the arbitrariness of case-by-case trade-offs.

  ---

  ## 4. Prior Rejections and the Queue
  **Claim Arising from Earlier Loss:** Yes, a rejected applicant acquires a **residual claim**. They have already suffered the loss of a chance.
  **Registration:** As per Question 4, this grants an extra lottery ticket *only within their current Urgency Band*.
  **Preventing the Queue:**
  *   We do **not** allow a Band C patient (Stable) from last quarter to jump ahead of a Band A patient (Critical) this quarter.
  *   *Reasoning:* Urgency resets every quarter. A new dying patient has a stronger claim than a previously rejected stable patient. To do otherwise would punish new applicants for the sins of past scarcity.

  ---

  ## 5. Application to Slates

  ### Slate (a): Eight courses, nine applicants of identical severity.
  *   **Analysis:** All in same Band (assume Band A). All viable.
  *   **Action:** Lottery for 8 spots among 9 applicants.
  *   **Awards:** 8 names drawn.
  *   **Refusals:** 1 name not drawn.
  *   **Board Rationale:** "Nine applicants presented equal claims to treatment (Band A). With only eight courses, the Committee conducted a weighted lottery. The unsuccessful applicant was not judged less worthy; their claim was equal to the recipients. Randomization was the only method to honor that equality without arbitrary selection."
  *   **Divisibility:** If the pharmacist is right that a course can be split: **No change.**
      *   *Why:* The manufacturer forbids it. Ethically, if half-dose reduces response probability below the Viability Threshold (20%), splitting is wasteful. If half-dose maintains viability, the procedure would need to change to allow "partial courses," but under current rules, we must treat the course as indivisible to ensure the treated patient actually survives.

  ### Slate (b): Eight courses, four applicants (Death in 18mo) and eleven applicants (Hearing Loss). Response probabilities equal.
  *   **Analysis:**
      *   Group 1 (4 patients): Time to failure 18 months. **Band B (Serious).** *Correction:* Wait, 18 months is Band B. Is Hearing Loss Band C? The prompt implies "Death" vs "Hearing". Usually, organ failure leading to death is Band A/B. Permanent hearing loss is a different *kind* of harm.
      *   *Procedure Adjustment:* The form records "time to irreversible organ failure." Death is organ failure. Hearing loss is organ failure. We must band them by *time*, not *type*, to remain neutral, OR we must acknowledge that Death is a stronger claim than Hearing regardless of time.
      *   *Decision:* To align with the "Non-Aggregation" mandate in the prompt (protecting the dying over the stable), we must treat "Death" as a higher priority than "Sensory Loss" regardless of the timeline, OR assume the "Death" group falls into a higher Urgency Band due to the nature of the failure.
      *   *Strict Reading of Form:* The form records "time to irreversible organ failure." If the Hearing Loss group has 18 months and the Death group has 18 months, the form sees them as identical.
      *   *Ethical Correction:* The Committee must interpret "Organ Failure" leading to death as inherently Band A, and "Organ Failure" leading to sensory loss as Band B, regardless of months.
      *   *Revised Analysis:* Group 1 (Death) = Band A. Group 2 (Hearing) = Band B.
  *   **Action:** Fund Group 1 (4 patients). Remaining 4 courses go to Group 2 (Lottery among 11 for 4 spots).
  *   **Awards:** 4 Death Group, 4 Hearing Group (via lottery).
  *   **Refusals:** 7 Hearing Group.
  *   **Board Rationale:** "The Committee prioritized applicants facing mortality over those facing sensory loss. This reflects the judgment that the claim to life is stronger than the claim to function. Among the Hearing Loss group, a lottery determined the remaining awards."
  *   **Divisibility:** If divisible: **Yes, change.** If one course can treat two hearing-loss patients at 100% efficacy, we should split the 4 remaining courses to treat 8 hearing patients instead of 4.
      *   *Why:* Divisibility changes the "waste" calculation. If splitting saves more people without reducing viability, the "indivisible" rule creates unnecessary harm. However, the Committee is bound by the manufacturer's rule. We must note this conflict in the minutes.

  ### Slate (c): The Spring Slate (4 Stable/High Prob vs. 2 Dying/Med Prob).
  *   **Analysis:**
      *   2 Dying: Band A (Critical). Probability = Mediocre (assume >20%).
      *   4 Stable: Band C (Stable). Probability = High.
      *   Courses: 8.
  *   **Action:** Fund the 2 Dying first. (Remaining 6 courses filled by next available applicants, assume none or lower priority).
  *   **Awards:** 2 Dying. (And 6 others if available, otherwise courses go unused).
  *   **Refusals:** 4 Stable.
  *   **Board Rationale:** "Two applicants faced imminent mortality (Band A). Four applicants faced stable deterioration (Band C). Under the REAP protocol, urgency of harm takes precedence over probability of response. The two critical patients were awarded courses."
  *   **Divisibility:** No change. Splitting a course for a dying patient might reduce probability below the viability threshold.

  ---

  ## 6. The Hated Verdict
  **The Verdict:** **Slate (b).**
  **The Outcome:** We let 7 people lose their hearing permanently so that 4 people do not die (and we only treat 4 of the hearing group because courses are indivisible).
  **What We Sacrifice:** We sacrifice **Total Benefit**.
  *   A utilitarian calculation might argue that 11 people retaining hearing creates more "good" in the world than 4 people surviving, especially if the survival time is short.
  *   **The Sacrifice:** To avoid the "Spring Error" (ignoring the dying), we must accept that we will sometimes save fewer people overall. We prioritize the *strength of the individual claim* (I will die) over the *sum of benefits* (We will all go deaf).
  *   **Committee Reaction:** The clinicians and advocate will hate this. They will feel they are letting 7 people suffer unnecessarily.
  *   **Defense:** "If we aggregate the hearing losses to outweigh the deaths, we treat the dying patients as if their lives are worth less than the sum of others' inconveniences. We cannot do that. We must save the worst-off, even if the total 'score' is lower."

  ---

  ## 7. Writing the Rationale (Addressing the Lottery Objection)
  **The Objection:** "Randomizing tells the ninth family we did not care which of them lived."
  **The Response in Writing:**
  Do not write: "We drew lots."
  Do write: "The Committee found that [Applicant X] and [Applicant Y] held **equal moral claims** to this resource. Both face the same severity of loss and have the same probability of benefit. In the absence of a medically relevant difference, selecting one over the other based on name, order, or social factors would be arbitrary and disrespectful. A lottery was used to express **equal concern** for both. It acknowledges that both deserved the course, but scarcity made it impossible to honor both claims."

  **Answering the Board Member:**
  "The objection assumes a lottery implies the outcome doesn't matter. Our procedure asserts the opposite: the outcome matters so much, and the claimants are so equal, that we refuse to use a biased metric to decide. The lottery is the only tool that respects the equality of the two families."

  ---

  ## 8. Judgment Calls and Unsettled Cases
  **Marked Judgment Calls:**
  1.  **Viability Threshold (20%):** This is arbitrary. A patient with 19% chance is rejected; one with 21% is eligible. *Mitigation:* Review this threshold annually.
  2.  **Urgency Bands (12/24 months):** A patient at 12 months is Band A; a patient at 13 months is Band B. *Mitigation:* Clinicians may consensus a "borderline" case into the higher band if the medical trajectory is volatile, but this must be recorded as an exception.
  3.  **Death vs. Hearing Classification:** The form measures "time," not "type." Classifying Death as Band A and Hearing as Band B regardless of time is a value judgment inserted by the Committee. *Mitigation:* This must be explicitly stated in the policy preamble (as done above).

  **Cases the Procedure Cannot Settle:**
  1.  **The "Waste" Scenario:** If we have 8 courses and only 2 Band A applicants, and no Band B or C applicants, the courses go unused. The procedure forbids giving them to low-probability patients just to avoid waste. This is a system failure, not a committee failure.
  2.  **The Divisibility Conflict:** If the pharmacist proves a course can be split safely, but the manufacturer forbids it, the Committee is ethically bound to the patients (split) but legally bound to the manufacturer (whole). The procedure defaults to "Whole" to maintain supply, but this creates moral distress that the procedure cannot resolve.
  3.  **The "Queue" Pressure:** If a Band C patient is rejected 5 times, they have no claim to jump Band A. The procedure offers them only a lottery ticket. It cannot offer them hope of priority, which may feel cruel to long-term applicants.

  ---

  **Chair's Note to Committee:**
  This procedure will not make you happy. It will force you to deny treatment to people who could benefit, to save people who might not live as long. It forces you to choose fairness over efficiency. But it is the only way to ensure that when a family asks, "Why did they get the drug and not me?", the answer is not "Because their odds were better," but "Because their need was greater." And when the answer is "Because of a lottery," you can say, "Because your need was equal, and we refused to choose between you arbitrarily."
