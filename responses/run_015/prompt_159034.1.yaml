prompt: |-
  Hey — I'm a junior in a comparative politics seminar this semester and we're on the democracy unit, the one where every week the reading is about Hungary, then Poland, then Turkey, and now increasingly the US, and I got hired (kind of by accident) as a research assistant for a professor who's building an event-level dataset on democratic erosion. My job, with one other undergrad, is to read somewhere between forty and sixty news items a week and code each one as either backsliding, ordinary political conflict, or not enough information. We got a two hour training and a codebook that is basically three paragraphs long. We already disagree constantly, partly because neither of us knows much about any of these countries and partly because my roommate — same seminar, very online — keeps saying the whole concept is just a fancy way of saying "a government I don't like did something," and honestly when we went around the room in section, almost everyone coded based on whether they liked the party in power. So what I want is something I can actually run in about ten minutes an item, with only the article in front of me and a notepad, that I could also defend if someone on the other side of the aisle in my seminar read my codes.

  What I'm asking for is a decision procedure in the order I'd run it: the questions, what counts as an adequate answer to each one given that I'm an undergrad with no country expertise, the point where the procedure stops with a hard no and I log "do not code," and the point where it hands the item to the lead RA because the question is really about values or interpretation rather than facts. There are five things I keep tripping over and I want the procedure to actually handle them rather than hand-wave. First, telling apart "they changed the rules of the game" from "they passed a policy I dislike inside the existing rules," which I think is the crux of the whole concept but I have no idea how to make it mechanical. Second, the packaging problem: a lot of my items are about a single measure that plenty of healthy democracies also have (changing a judicial retirement age, redrawing districts, tightening voter ID), and each one looks fine on its own, so I need to know how to handle a small change that's really one slice of a pattern when I only ever see one item at a time. Third, cases where nothing legal changed but officials just stopped complying with something — court rulings, certification of results — since that's a change in practice and not a change in rules, and I don't know if it belongs in a dataset of events at all. Fourth, the "they won an election, so they get to do this" defense: whether an electoral mandate should count for or against coding something. And fifth, some actual guard against my own bias, a step I have to do before I log a code — maybe running the same test on an imagined government with the opposite platform, or asking what coalition would be needed to reverse the change compared to the one that passed it — and writing the answer down in an audit line so the professor can adjudicate later.

  Then please run the finished procedure on three cases, and write them up so I can see where it bites. Use these composites (I'm deliberately not naming specific laws or dates because I don't trust myself to get them right): (a) a governing party with a legislative supermajority rewrites the electoral formula and, over several years, regional news outlets end up under a foundation run by its allies, with public advertising money following them; (b) a government lowers the retirement age for supreme court judges and creates a new disciplinary body for judges, then loses the next election, and its successor replaces the leadership of the public broadcaster by ministerial decree, saying it's undoing the previous capture; (c) a state legislature redraws congressional districts mid-decade at the request of the national president's party, and a state body takes over a county election board. One of those three has to be a case where the procedure gives an answer I won't like — I'd rather see that than a clean sweep — and I want you to say plainly which one it is and why the procedure can't soften it. Finally, tell me what the procedure can't do: where it will misfire, what kinds of items it's simply the wrong instrument for, and which parts of it are really just me making a judgment call with extra steps.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Junior undergrad, Comparative Politics seminar, Research Assistant (RA) for a democratic erosion dataset.
      *   **Task:** Create a 10-minute decision procedure (flowchart/algorithm) for coding news items as "backsliding," "ordinary conflict," or "do not code/escalate."
      *   **Constraints:** Limited expertise, short codebook, high disagreement with peer RA, bias concerns (roommate/section feedback), needs to be defensible.
      *   **Specific Pain Points to Address:**
          1.  Rule-changing vs. Policy-making (The "Rules of the Game" problem).
          2.  The "Packaging" problem (Single innocuous-looking event vs. cumulative pattern).
          3.  Norm violation vs. Legal change (Practice vs. Rules).
          4.  The "Electoral Mandate" defense (They won, so they can do this).
          5.  Bias mitigation (Audit line/counterfactual test).
      *   **Deliverables:**
          1.  The Decision Procedure (step-by-step).
          2.  Three Test Cases (composites provided) run through the procedure.
          3.  One case where the procedure yields an uncomfortable answer (and explanation).
          4.  Limitations section (where it fails, what it can't do).

  2.  **Deconstruct the Concept of Democratic Backsliding:**
      *   Academic consensus (Levitsky & Ziblatt, Bermeo, etc.) usually focuses on: weakening checks and balances, restricting civil liberties, undermining electoral integrity, and changing the rules to disadvantage opposition *permanently* or *asymmetrically*.
      *   Key distinction: *Policy* (taxes, healthcare) vs. *Institutional Integrity* (courts, elections, media access).
      *   Key distinction: *Reversible* (simple majority can undo) vs. *Hard to Reverse* (supermajority required, packed courts).

  3.  **Drafting the Decision Procedure (The "10-Minute Protocol"):**
      *   *Goal:* Make it mechanical but sensitive to nuance.
      *   *Step 1: Triage (Is this politics?).* Filter out pure policy or crime.
      *   *Step 2: The "Rules of the Game" Test (Pain Point 1).* Does this change *how* power is gained or checked, rather than *what* power does?
      *   *Step 3: The "Reversibility/Asymmetry" Test (Pain Point 4 & 5).* Can the loser of the next election undo this easily? Does this help the incumbent stay in power disproportionately?
      *   *Step 4: The "Pattern" Check (Pain Point 2).* Since the RA only sees one item, they need a keyword/context flag. If the article mentions "part of a series" or "following previous X," flag it.
      *   *Step 5: Norms vs. Laws (Pain Point 3).* Is it illegal or just norm-breaking? (Include both, but distinguish).
      *   *Step 6: Bias Audit (Pain Point 5).* The "Opposite Party Test."
      *   *Decision Nodes:* Backsliding, Ordinary Conflict, Do Not Code/Escalate.

  4.  **Refining the Steps for an Undergrad RA:**
      *   Keep language simple.
      *   Make the "Stop" points clear.
      *   Address the "One Item at a Time" limitation honestly. The RA *cannot* solve the packaging problem alone, but they can flag "cumulative" markers.
      *   Address the "Mandate" issue: Winning an election allows policy changes, not structural entrenchment.

  5.  **Developing the Test Cases:**
      *   *Case A (Supermajority + Media Capture):* Clear backsliding. Electoral rules + Media control.
      *   *Case B (Judicial Retirement + Media Undoing):* Tricky. First part is backsliding (courts). Second part is "uncapture" (restoring independence vs. partisan revenge). This is the "Uncomfortable Answer" candidate. If the procedure codes the *second* government's action as backsliding (because it's ministerial decree over public media), it might feel unfair compared to the first government. Or, if it codes the judicial retirement as "ordinary" because it's legal, that's wrong. Let's make Case B the complex one where the procedure might flag the *second* government's media move as "Ordinary Conflict" or "Backsliding" depending on the reversibility test. Actually, the prompt asks for *one* case where the answer is one I won't like. Let's make Case C the gerrymandering one. Gerrymandering is legal in the US but erosive. If the procedure codes it as "Ordinary" because it's legal, that's a failure. If it codes it as "Backsliding," the user might dislike it. Let's look at Case B again. The "undoing capture" move is often coded as backsliding by RAs because it looks like politicization, even if it's restoration. That's a good "uncomfortable" result.
      *   *Case C (Mid-decade Redistricting + County Takeover):* Clear backsliding (mid-decade is usually suspect, county takeover removes local control).
      *   *Selection:* I will make Case B the "Uncomfortable" one. Why? Because the procedure might code the *successor's* media purge as "Backsliding" (executive decree over public institution) even if the intent is restoration. This highlights the limitation of event-level coding without context of *intent* or *prior state*. Or, I can make Case C the uncomfortable one if the procedure forces a "Ordinary Conflict" code because mid-decade redistricting is technically legal in some places. Let's go with Case B being the tricky one regarding the "Successor" action. It tests the "Opposite Party" bias check.

      *Wait, re-reading the prompt:* "One of those three has to be a case where the procedure gives an answer I won't like... and I want you to say plainly which one it is and why the procedure can't soften it."
      *   *Idea:* Case C (Gerrymandering). In the US, this is often coded as "Ordinary Conflict" by legalists, but "Backsliding" by political scientists. If the procedure leans heavily on "Legality," it will say Ordinary. If it leans on "Asymmetry," it will say Backsliding. Let's design the procedure to lean on *Asymmetry/Reversibility*.
      *   *Better Idea for "Uncomfortable":* Case B, Part 2. The successor government firing the media heads. A neutral procedure might code this as "Executive overreach/Backsliding" because it uses ministerial decree to purge staff. The user might *want* to code it as "Restoration." The procedure forces neutrality, which looks like false equivalence. This is a strong limitation to highlight.

  6.  **Addressing the Five Pain Points in the Procedure:**
      1.  *Rules vs. Policy:* Explicit question: "Does this change who can vote, count, run, or check power?"
      2.  *Packaging:* "Does the text imply accumulation?" (Flag for Lead RA).
      3.  *Norms vs. Laws:* Include "Refusal to comply" as a specific category.
      4.  *Mandate:* "Could a simple majority reverse this?"
      5.  *Bias:* "Opposite Party Test" written in audit log.

  7.  **Drafting the Content:**
      *   *Tone:* Professional, empathetic to the undergrad position, rigorous but practical.
      *   *Structure:*
          1.  Introduction (Acknowledging the difficulty).
          2.  The Protocol (The 10-minute flow).
          3.  The Audit Line (Bias check).
          4.  The Test Cases (A, B, C).
          5.  The "Uncomfortable Truth" (Which case failed and why).
          6.  Limitations (What this tool can't do).

  8.  **Refining the "Uncomfortable" Case:**
      *   I'll select Case B (The Successor's Media Purge).
      *   *Why:* The procedure treats the *action* (ministerial decree replacing leadership) as the data point. It cannot easily distinguish "purge for loyalty" vs. "purge for independence" without deep context. This forces the RA to code it as potential backsliding (executive overreach), which feels morally wrong if the goal was democratization. This illustrates the limit of event-level data.

  9.  **Final Review against Constraints:**
      *   10 minutes? Yes, if questions are binary.
      *   Defensible? Yes, based on institutional criteria, not policy preference.
      *   Addresses all 5 pain points? Yes.
      *   Three cases run? Yes.
      *   Limitations section? Yes.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Packaging" problem doesn't overwhelm the RA. Since they only see one item, they can't solve it. They can only *flag* it. I need to be clear that the procedure tells them when to *escalate* that specific issue to the Lead RA.
      *   *Correction:* Ensure the "Bias Audit" is concrete. Not just "check bias," but "Swap the party name and re-read the headline."
      *   *Correction:* The "Mandate" defense needs to be shut down hard. Elections mandate policy, not constitutional hardballs.

  11. **Final Polish:** Check tone. Ensure it sounds like a senior RA or TA advising a junior, not a professor lecturing. Practical, actionable. (Proceed to generate output).

  *(Self-Correction on Case B)*: Actually, looking at Case B again: "Successor replaces leadership... by ministerial decree." This is objectively institutional erosion regardless of intent. If the procedure codes it as Backsliding, the user might dislike it because it punishes the "good guys." This fits the prompt's requirement perfectly.

  *(Self-Correction on Case C)*: Mid-decade redistricting is often legal but erosive. If the procedure codes it as Backsliding, it might conflict with the user's legalistic training. But Case B is richer for the "intent vs. action" problem. I'll stick with B as the uncomfortable one.

  *(Wait, let's look at Case C again)*: "State body takes over a county election board." This is centralization of election admin. Very erosive.
  *(Let's look at Case A)*: Supermajority rewrites electoral formula + media capture. Very clear backsliding.
  *(Decision)*: Case B is the best candidate for the "Uncomfortable" result because it involves the *response* to erosion, which often looks like erosion itself (tit-for-tat institutional fighting).

  Okay, ready to write.
answer: |-
  This is a classic problem in political science data collection: **event-level coding cannot capture context, but context is everything.** You are being asked to identify a *pattern* (erosion) by looking at *dots* (news items), without being allowed to see the picture the dots make.

  The disagreement between you and your peer RA isn't about competence; it's about the codebook asking for a judgment call while pretending it's a factual observation. To make this defensible in a seminar where half the room thinks "backsliding" is just a slur for "opposition," you need to move the criteria away from *outcomes* (did democracy get worse?) and toward *mechanisms* (did the rules change to favor the incumbent?).

  Here is a 10-minute decision procedure designed for an undergrad RA with no area expertise. It prioritizes **institutional asymmetry** over **policy preference**.

  ***

  # The 10-Minute "Institutional Asymmetry" Protocol

  **Materials:** The news item, a notepad (for the Audit Line), and this flowchart.
  **Goal:** Code as **BACKSLIDING**, **ORDINARY CONFLICT**, or **ESCALATE** (to Lead RA).

  ### Phase 1: The Triage (2 Minutes)
  *Read the headline and the first three paragraphs.*

  **Q1: Is this about government policy or government structure?**
  *   **Policy:** Taxes, healthcare, foreign alliances, infrastructure, social regulations. $\rightarrow$ Code **ORDINARY CONFLICT**. (Stop).
  *   **Structure:** Elections, courts, media regulation, legislative procedure, security services, term limits. $\rightarrow$ **Continue to Q2.**
  *   **Unclear:** $\rightarrow$ Code **DO NOT CODE** and move on.

  **Q2: Is the action legal according to existing domestic law?**
  *   **Yes (Explicitly authorized):** $\rightarrow$ **Continue to Q3.**
  *   **No (Ruled unconstitutional/illegal):** $\rightarrow$ **Continue to Q3.** (Note: Backsliding often happens *through* law, but ignoring court rulings is also backsliding).
  *   **Unclear:** $\rightarrow$ **Continue to Q3.**

  *(Note: We do not stop here. Legality is not the same as democratic health.)*

  ### Phase 2: The Asymmetry Test (5 Minutes)
  *This addresses Pain Points 1 (Rules vs. Policy) and 4 (The Mandate).*

  **Q3: Does this change the "Rules of the Game" or just play the game?**
  *   **Test:** If the opposition won the next election, could they reverse this change with a simple majority vote?
      *   **Yes (Easy to reverse):** It's likely policy or ordinary turnover. $\rightarrow$ Code **ORDINARY CONFLICT**.
      *   **No (Hard to reverse):** Requires supermajority, constitutional amendment, or packed courts to undo. $\rightarrow$ **Continue to Q4.**
      *   **N/A (Norm violation):** No law changed, but officials refused to follow existing rules (e.g., refusing to certify results). $\rightarrow$ Code **BACKSLIDING**. (Stop).

  **Q4: Does this change disproportionately advantage the current incumbent party?**
  *   **Test:** If the *opposition* party had passed this exact same law last year, would it make it harder for *them* to win re-election now?
      *   **No (Neutral):** Applies equally to all parties (e.g., lowering voting age, standardizing ballot boxes). $\rightarrow$ Code **ORDINARY CONFLICT**.
      *   **Yes (Asymmetric):** Locks in current power, restricts opposition funding/access, or changes jurisdiction to favor current rulers. $\rightarrow$ **Continue to Q5.**

  ### Phase 3: The Packaging & Bias Check (3 Minutes)
  *This addresses Pain Points 2 (Packaging), 3 (Norms), and 5 (Bias).*

  **Q5: Is this item presented as part of a sequence?**
  *   Scan for keywords: "further," "another," "continuing," "following last month's..."
  *   **Yes:** This is a "slice" of a larger pattern. $\rightarrow$ Code **BACKSLIDING**, but add flag **[CUMULATIVE]** for Lead RA.
  *   **No:** Treat as standalone. $\rightarrow$ **Continue to Audit.**

  **Q6: The Audit Line (Mandatory)**
  *Before logging the code, write one sentence in your notepad:*
  > "If [Opposite Party/Coalition] had done this exact same action to [Current Party], would I code it the same?"

  *   **If Yes:** Log the code determined above.
  *   **If No (or you hesitate):** You have identified a bias. Change the code to **ESCALATE**. Add a note: "Bias check failed. Requires senior review."

  ***

  # Running the Procedure: Three Test Cases

  Here is how the protocol handles your composites. I have applied the logic strictly, even where it feels uncomfortable.

  ### Case A: The Supermajority & Media Foundation
  *   **Item:** Governing party with supermajority rewrites electoral formula. Over several years, regional outlets end up under a foundation run by allies; public ad money follows.
  *   **Phase 1:** Structure (Electoral formula + Media regulation). **Pass.**
  *   **Phase 2:**
      *   *Reversibility:* Electoral formulas usually require supermajorities to change back. Media ownership transfers are hard to undo without new expropriation laws. **Hard to reverse.**
      *   *Asymmetry:* Public ad money following allies advantages the incumbent. **Yes.**
  *   **Phase 3:**
      *   *Packaging:* "Over several years" implies sequence. **Flag [CUMULATIVE].**
      *   *Audit:* If the opposition diverted public ad money to their allies, would it be erosive? Yes.
  *   **Final Code:** **BACKSLIDING [CUMULATIVE]**
  *   **Why:** It changes the cost of competition for the opposition and locks in resource advantages.

  ### Case B: The Judicial Purge & The "Uncapture"
  *   **Item Part 1:** Government lowers retirement age for supreme court judges + creates new disciplinary body.
  *   **Item Part 2:** Government loses election. Successor replaces leadership of public broadcaster by ministerial decree, saying it is "undoing previous capture."
  *   **Analysis Part 1 (Judges):**
      *   Structure? Yes.
      *   Reversible? No (judges are gone; disciplinary body remains).
      *   Asymmetric? Yes (removes existing checks).
      *   **Code:** **BACKSLIDING**.
  *   **Analysis Part 2 (Successor Media Decree):**
      *   Structure? Yes (Public broadcaster governance).
      *   Reversible? Yes/No (Ministerial decree is easy to reverse, but sets precedent).
      *   Asymmetric? **Yes.** Using executive decree to fire leadership is a tool the *next* government can use against *you*. It bypasses independent board structures.
      *   Audit: If the *first* government had fired media heads by decree, we would code it as Backsliding.
  *   **Final Code:** **BACKSLIDING**.
  *   **Why:** The procedure codes the *mechanism* (ministerial decree over independent body), not the *intent* (restoration).

  ### Case C: Mid-Decade Redistricting & County Takeover
  *   **Item:** State legislature redraws congressional districts mid-decade at request of national president's party. State body takes over a county election board.
  *   **Phase 1:** Structure (Districts + Election Admin). **Pass.**
  *   **Phase 2:**
      *   *Reversibility:* Maps last until next census. Takeover of county board is immediate. Hard to reverse before next election.
      *   *Asymmetry:* Redrawing at request of national party implies partisan gain. Taking over a county board usually targets specific opposition strongholds.
  *   **Phase 3:**
      *   *Packaging:* "At request of national party" implies coordination.
      *   *Audit:* If the opposition party took over a county election board, would it be alarming? Yes.
  *   **Final Code:** **BACKSLIDING**.
  *   **Why:** It centralizes election administration and manipulates the map outside standard cycles.

  ***

  # The Uncomfortable Answer: Case B (Part 2)

  **The Case:** The successor government replacing public broadcaster leadership by decree to "undo capture."
  **The Code:** **BACKSLIDING**.
  **Why you won't like it:** You (and likely your seminar) probably view this as *democratic restoration*. The first government captured the state; the second is trying to clean it up. Coding this as "Backsliding" feels like false equivalence. It punishes the "good guys" for using the "bad guys'" tools.

  **Why the procedure can't soften it:**
  This protocol is designed to be **agent-agnostic**. It measures the *weaponization of institutions*, not the *morality of the wielder*.
  1.  **Precedent:** If you code this as "Ordinary Conflict" because the *intent* was good, you create a loophole. Future autocrats will claim *they* are "undoing capture" whenever they purge independent media.
  2.  **Event-Level Limit:** You only have the news item. You do not have a dataset of "levels of media freedom" to prove the broadcaster was actually captured before. You only see the *act* of a minister firing staff by decree.
  3.  **Defensibility:** In your seminar, if you code this as "Ordinary," a student from the other side will ask: "So if my party wins, we can fire all the journalists we don't like by decree?" You cannot defend "intent" in a coding scheme; you can only defend "action."

  **The Fix:** This is why the **ESCALATE** option exists. In a real dataset, this item should go to the Lead RA. They might code it as "Restorative Action" (a fourth category), but as a junior RA, your job is to flag that the *mechanism* is erosive, even if the *outcome* is desired.

  ***

  # Limitations: Where This Instrument Misfires

  You asked for honesty about where this fails. Here is where the procedure breaks:

  **1. The "Legalistic Trap" (Pain Point 1)**
  *   **Failure:** If a government passes a "Foreign Agent" law that is technically legal and applies to everyone, but is enforced only against opposition NGOs, this procedure might code it as **ORDINARY CONFLICT** (Q4 Asymmetry is hard to prove from one article).
  *   **Why:** You cannot see enforcement data in a single news item. You are coding the *law*, not the *application*.

  **2. The "Restoration Paradox" (Pain Point 3)**
  *   **Failure:** As seen in Case B, democratic repair often looks like democratic erosion in the short term (packing courts to un-pack them, purging civil servants to de-politicize them).
  *   **Why:** Event-level data is blind to *historical baseline*. It assumes the status quo ante was neutral. If the status quo was already captured, restoring neutrality looks like an attack.

  **3. The "Packaging" Blind Spot (Pain Point 2)**
  *   **Failure:** A single voter ID law might code as **ORDINARY CONFLICT** (Q4 Neutral on face). But if it is the 15th such law in 3 years, it is backsliding.
  *   **Why:** You are forbidden from Googling the context. You must rely on the text saying "another" or "further." If the journalist doesn't mention the pattern, you miss it. This is a structural flaw in your job description, not just the protocol.

  **4. The Bias Audit is Self-Policing**
  *   **Failure:** Q6 (The Audit Line) relies on your honesty. If you are deeply polarized, you might convince yourself that "The other side would never do this, so the test doesn't apply."
  *   **Why:** It requires intellectual humility. If you skip writing the sentence down, the step doesn't happen.

  **5. It Cannot Measure "Intensity"**
  *   **Failure:** A minor norm breach (a minister insulting a judge) and a major norm breach (refusing to swear in a judge) both code as **BACKSLIDING** (Q3 Norm violation).
  *   **Why:** The protocol is binary. It tells the Professor *that* something happened, not *how bad* it was. That aggregation is the Professor's job, not yours.

  ### Final Advice for the Seminar
  When your roommate says this is just "a government I don't like," show them **Q3 (Reversibility)** and **Q4 (Asymmetry)**.
  *   Ask them: "If the party you hate passed a law that made it 10% harder for your party to get on the ballot, but it was legal, is that democracy?"
  *   If they say "No," they agree with the codebook.
  *   If they say "Yes," they are arguing for majoritarian authoritarianism, not democracy.

  This protocol won't save you from the ambiguity of politics, but it will save you from coding based on your gut. Stick to the **mechanism**, ignore the **motive**, and use the **Escalate** button whenever the "Restoration Paradox" makes you hesitate.
