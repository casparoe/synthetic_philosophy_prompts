answer: |-
  Your brain is currently suspended in a nutrient vat in a Cambridge laboratory, functioning perfectly and connected via low-latency radio link to both your biological body and a remote surrogate. Your body lies in a hospital bed in London, kept fully metabolically active on life support despite the absence of the brain, breathing and circulating blood normally. Meanwhile, the radio link routes your visual and auditory input from cameras mounted on a wheeled robot navigating the streets of Oxford, and routes your motor commands to that robot's arms and wheels, making it feel exactly as though you are walking down the High Street there.

  **The Organism View:** You are identical to the living human animal, so you are located wherever the animal's biological processes are occurring. Since your heart is beating and lungs are breathing in the London hospital bed, you are in London.

  **The Brain View:** You are the conscious subject constituted by neural activity, so you are located wherever that activity is physically realized. Since your thinking and experiencing are generated by the brain in the Cambridge vat, you are in Cambridge.

  **The Experienced-Here View:** You are located wherever your perceptual perspective is anchored in space, regardless of the physical substrate. Since your senses report the surroundings of Oxford and your agency moves limbs there, you are in Oxford.

  **The Pivot Feature:** The disagreement relies entirely on the **tri-partite separation of substrate, sensorium, and organism**. If you remove the remote surrogate and reconnect the brain to the body, the Organism and Experience views converge on London, leaving only the Brain view in Cambridge. If you instead place the brain back inside the skull, the Organism and Brain views converge on London, leaving only the Experience view potentially divergent if linked to a robot. Only when all three are physically distinct does the three-way disagreement emerge.

  **The Objection:** The Organism View looks worst here, as it places you in a bed while you walk the streets. A defender might object that "location implies causal power," noting you cannot interact with London objects, only Oxford ones. This complaint is not about the scenario's coherence but about the view's definition of location, revealing that the Organism View prioritizes biological continuity over functional presence.

  **The Verdict:** The Brain View handles it best. It correctly identifies the seat of consciousness without conflating the person with the biological vehicle (which is now merely life-support) or the remote tool (which is merely an interface). It preserves the intuition that you go where your mind goes, while acknowledging that the mind is a physical thing situated in Cambridge, distinct from both the body it once inhabited and the robot it currently pilots.
