  Preliminary Brainstorming: Hidden Tensions Among Requirements

  Before specifying the desiderata, we must acknowledge the structural friction inherent in modal epistemology. The primary tension lies between **Psychological Realism** (the theory must account for how actual humans conceive, including biases) and **Modal Robustness** (metaphysical possibility is mind-independent and stable). If we tether conceivability too closely to actual psychology, we inherit framing biases and errors; if we tether it to ideal rationality, we lose contact with the epistemic mechanism available to knowers. A second tension exists between **Fallibilism** (we can be wrong about what is conceivable) and **Guidance** (conceivability must reliably indicate possibility). If the guide is fallible, we need a meta-criterion to distinguish veridical from non-veridical conceiving, but adding such a criterion risks making the theory circular or inaccessible. Finally, there is a tension between **Phenomenal Opacity** (we may not know the full nature of our concepts) and **Transparency** (conceivability assumes we grasp what we are conceiving). These tensions suggest that no theory will satisfy all desiderata without significant cost.

  ***

  ### Adequacy Conditions for a Theory of Conceivability and Possibility

  As a metaphysician evaluating the link between epistemic conceivability and metaphysical possibility, I propose the following weighted desiderata. These conditions are designed to test the resilience of any proposed account against logical constraints, empirical data, and intuitive case judgments.

  #### 1. The Kripkean Necessary A Posteriori Constraint
  *   **Requirement:** The theory must accommodate the existence of necessary a posteriori truths (e.g., "Water is H2O") such that their falsity is conceivable epistemically but not possible metaphysically, without rendering conceivability inert as a guide.
  *   **Motivation:** This is the historical watershed for modal epistemology. Any account that equates conceivability directly with possibility fails here. The theory must explain *why* some conceivability judgments fail to track possibility (due to reference fixation) while others succeed.
  *   **Reasoning:** Preserves the distinction between epistemic and metaphysical modalities while maintaining that conceivability is still a *prima facie* guide, not a definition.

  #### 2. The Phenomenal Intentionality Distinction (Addressing Pressure Point i)
  *   **Requirement:** The theory must classify the "blank-mind" scenario (a being with rational self-awareness and intentionality but zero phenomenal character) as either genuinely conceivable or demonstrably incoherent, without collapsing intentionality into phenomenality.
  *   **Motivation:** This tests the theory's handling of the Philosophy of Mind. Physicalists often argue this is inconceivable (or impossible); Dualists argue it is conceivable. The theory must not simply stipulate an answer but provide a mechanism for why the conception succeeds or fails (e.g., is "self-awareness" inherently phenomenal?).
  *   **Reasoning:** Prevents the theory from bypassing the Hard Problem of Consciousness. It demands an account of whether intentional content can be represented in conception without qualitative feel.

  #### 3. The Content Anchoring Requirement (Addressing Pressure Point ii)
  *   **Requirement:** The theory must explain how a state of affairs defined solely by negation (the "negative-space" scenario: no space, no time, no positive content) can be conceived without relying on positive sensory imagery or collapsing into a contradiction.
  *   **Motivation:** Imagery-based accounts of conceiving fail here, as one cannot picture "nothing." Propositional accounts must show how the proposition is grasped without positive referents.
  *   **Reasoning:** Ensures the theory handles abstract and limit-case metaphysics (e.g., nihilism, timeless abstracta) rather than being limited to concrete, sensory-compatible worlds.

  #### 4. The Framing Invariance Principle (Addressing Pressure Point iii)
  *   **Requirement:** The theory must account for systematic shifts in modal judgments under linguistic reframing (framing-bias) by distinguishing between *psychological noise* and *genuine modal insight*, without dismissing conceivability as wholly unreliable.
  *   **Motivation:** Empirical studies show that describing a scenario as "causing death" vs. "allowing death" shifts judgments of possibility/permissibility. A metaphysical theory cannot allow possibility to fluctuate with wording.
  *   **Reasoning:** Saves conceivability from skepticism. It requires a filter mechanism (e.g., idealization, reflective equilibrium) that explains why the bias occurs but why it doesn't reflect metaphysical reality.

  #### 5. The Idealization Accessibility Condition
  *   **Requirement:** If the theory appeals to "ideal conceivability" to solve errors, it must specify how actual agents can approximate ideal conditions sufficiently to justify modal knowledge claims.
  *   **Motivation:** Appealing to an ideal reasoner solves counterexamples but risks making modal knowledge inaccessible to humans.
  *   **Reasoning:** Bridges the gap between normative epistemology (how we *should* conceive) and descriptive psychology (how we *do* conceive).

  #### 6. The Non-Collapse of Epistemic and Metaphysical Modalities
  *   **Requirement:** The theory must maintain a conceptual distinction between "for all we know" (epistemic possibility) and "could have been" (metaphysical possibility), even if the former guides the latter.
  *   **Motivation:** Prevents modal collapse where everything epistemically open becomes metaphysically possible.
  *   **Reasoning:** Preserves the objective nature of metaphysics against radical verificationism.

  ***

  ### Flagged Tensions and Damaging Requirements

  **Jointly Unsatisfiable Pair:**
  I flag **The Framing Invariance Principle** and **The Idealization Accessibility Condition** as jointly unsatisfiable in their strongest forms. To guarantee framing invariance, one typically requires a level of idealization (perfect linguistic competence, full conceptual grasp) that is inaccessible to actual human agents. Conversely, if we demand accessibility for actual agents, we must admit their susceptibility to framing biases, thereby weakening the invariance claim. A theory must compromise here: either modal knowledge is rarer than we thought (high idealization) or conceivability is less stable than we hoped (high accessibility).

  **Most Damaging Requirement:**
  The single requirement that does the most damage to major existing approaches is **The Kripkean Necessary A Posteriori Constraint**.
  *   **Reasoning:** This constraint fundamentally broke the Classical Modal Rationalism of the mid-20th century. It forces theories to adopt complex two-dimensional semantics or hybrid accounts to explain how something can be conceivable (epistemically possible) yet impossible (metaphysically necessary). It demands a mechanism for "reference fixation" that most pure conceivability accounts lack, forcing them to import externalist semantics which often undermines the internalist nature of conceiving.

  ***

  ### Brief Scorecard of Competing Views

  *   **Descriptivist-Idealist View:**
      *   *Performance:* Fails the **Kripkean Constraint**. By tying possibility to conceptual coherence alone, it struggles to accommodate necessary a posteriori truths where concepts fix reference rigidly rather than descriptively. It handles **Framing Bias** well (as linguistic confusion) but falters on **Negative-Space** if concepts require positive descriptions.
  *   **Rationalist-Ideal View (e.g., Chalmers):**
      *   *Performance:* Strong on **Blank-Mind** (validates zombie-like conceivability) and **Negative-Space** (via primary intensions). However, it struggles with **Framing Bias**, often attributing bias to non-ideal reasoning without a clear empirical mechanism for filtering it, and faces high costs on **Idealization Accessibility**.
  *   **Phenomenal-Concept View (Physicalist):**
      *   *Performance:* Strong on **Kripkean Constraint** (explains away the gap via concept dualism). However, it fails the **Blank-Mind** requirement, typically arguing that such a being is not genuinely conceivable upon full reflection, which conflicts with strong introspective intuitions. It handles **Framing Bias** via psychological explanation but risks collapsing **Epistemic and Metaphysical Modalities** in practice.

  Summary: A viable theory of modal epistemology must navigate the tension between psychological fallibility and metaphysical stability, prioritizing the accommodation of necessary a posteriori truths while providing a mechanism to filter linguistic framing biases from genuine modal insights.
