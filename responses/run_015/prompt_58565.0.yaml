answer: |-
  # Specification for an Adequate Account of Aggregation Across Harms

  **To:** Public Agency Decision-Making Body
  **From:** Policy Advisor
  **Subject:** Criteria for Evaluating Theories of Harm Aggregation

  ## 1. Introduction and Scope
  The agency faces a structural ethical problem: how to weigh intense, concentrated suffering against diffuse, trivial burdens. Standard cost-benefit analysis often assumes harms are linearly aggregable, but this leads to counterintuitive results when comparing qualitatively distinct types of suffering (e.g., torture vs. dust specks). This specification outlines the necessary conditions for a theory to guide public choices in this domain. It addresses the central case (one person's trauma vs. $N$ persons' irritations) and the required variants (risk, distribution, iteration).

  ## 2. Normative Adequacy Conditions
  These conditions ensure the theory aligns with fundamental moral commitments appropriate for a public agency charged with protecting citizens.

  ### 2.1. The Severe Suffering Constraint (SSC)
  *   **Requirement:** There exists a threshold of severity (e.g., excruciating pain with lasting trauma) such that no amount of aggregate minor irritation (e.g., dust specks), below a certain threshold of significance, can morally outweigh the prevention of that severe suffering.
  *   **Motivation:** This captures the "Torture Intuition." It reflects a commitment to basic human rights and the idea that certain interests are too fundamental to be traded off against trivial preferences, regardless of the number of beneficiaries. It prevents the "tyranny of the majority" in cases of extreme asymmetry.
  *   **Status:** **Non-negotiable.** For a public agency, violating this condition risks legitimizing gross human rights violations for the sake of marginal aggregate utility.

  ### 2.2. The Non-Ignorance of Numbers (NIN)
  *   **Requirement:** The theory must acknowledge that the number of persons affected matters. Preventing a minor harm to $N$ people must eventually outweigh preventing a minor harm to $M$ people (where $N \gg M$), and sufficiently large numbers of minor harms must have *some* weight against moderate harms.
  *   **Motivation:** This captures the "Aggregation Intuition." A theory that ignores numbers entirely (strict deontology) would imply it is impermissible to inconvenience a million people to save one person from a broken finger. Public policy requires some sensitivity to scale.
  *   **Status:** **Non-negotiable.** A theory that cannot aggregate at all is useless for resource allocation.

  ### 2.3. Sensitivity to Distribution (SD)
  *   **Requirement:** The theory must distinguish between concentrated and dispersed harms. It must specify whether it is worse for one person to suffer $N$ irritations or for $N$ people to suffer one irritation each.
  *   **Motivation:** This addresses the *Concentrated vs. Dispersed* variant. Intuitively, burdening one person heavily is often worse than spreading the same total burden thinly (prioritarianism/fairness), even if total welfare loss is identical.
  *   **Status:** **Defeasible Theoretical Virtue.** Strict Utilitarianism rejects this (separability across persons), while Prioritarianism and Egalitarianism accept it. For public policy, some sensitivity to distribution is preferable to prevent targeting vulnerable individuals, but it may be secondary to total burden reduction.

  ## 3. Formal Adequacy Conditions
  These conditions ensure the theory is logically coherent and capable of handling complex comparisons.

  ### 3.1. Transitivity of Better-Than (TB)
  *   **Requirement:** If Option A is better than Option B, and Option B is better than Option C, then Option A must be better than Option C.
  *   **Motivation:** This addresses the *Iterated Version* (Spectrum Argument). If we move step-by-step from "Torture" to "Dust Specks" via intermediate pains, transitivity ensures a consistent ranking. Without TB, the agency faces cyclical preferences (money pumps), making rational planning impossible.
  *   **Status:** **Non-negotiable.** Rational choice theory requires transitivity.
  *   **Conflict Note:** TB creates tension with SSC. If one accepts a spectrum of harms where each step is marginally better than the last, TB forces the conclusion that the final step (Dust) is better than the first (Torture), violating SSC.

  ### 3.2. Continuity (Archimedean Property) (CONT)
  *   **Requirement:** For any two harms $H_1$ and $H_2$ (where $H_1$ is worse than $H_2$), there exists some number $N$ such that $N$ instances of $H_2$ are worse than one instance of $H_1$.
  *   **Motivation:** This ensures there are no "lexical" gaps. It supports the *Aggregation Intuition* fully, implying that all harms are commensurable on a single scale.
  *   **Status:** **Defeasible Theoretical Virtue.** This is a standard assumption in welfare economics but is rejected by lexical views.
  *   **Conflict Note:** CONT is incompatible with SSC. If SSC holds (Torture cannot be outweighed by Dust), then CONT must fail (no $N$ exists where Dust > Torture).

  ### 3.3. Ex Ante / Ex Post Coherence (EEC)
  *   **Requirement:** The theory must provide consistent guidance when comparing certain outcomes vs. probabilistic risks. It must specify whether we maximize expected value (ex ante) or minimize realized bad outcomes (ex post).
  *   **Motivation:** This addresses the *Risky Version*. If many face a tiny risk of torture vs. one facing certainty of irritation, does the aggregation of risk matter?
  *   **Status:** **Defeasible Theoretical Virtue.** Expected Utility Theory demands ex ante coherence. However, some views (e.g., ex post prioritarianism) prioritize the actual distribution of outcomes over statistical expectations.

  ## 4. Practical Adequacy Conditions
  These conditions ensure the theory can be implemented by the agency.

  ### 4.1. Tractability and Action-Guidance (TAG)
  *   **Requirement:** The theory must yield a determinate verdict using information the agency can reasonably obtain. It cannot require impossible calculations (e.g., knowing the exact utility function of every citizen).
  *   **Motivation:** Public agencies operate under epistemic constraints and time pressure.
  *   **Status:** **Non-negotiable.** A theory that is theoretically sound but computationally impossible is inadequate for policy.

  ## 5. The Central Theoretical Tension
  A satisfactory theory cannot simultaneously satisfy **SSC** (Severe Suffering Constraint), **TB** (Transitivity), and **CONT** (Continuity). This is the core of the *Spectrum Argument* (Parfit 1984; Arrhenius 2000).

  *   **Source of Tension:** If we accept a chain of harms decreasing in severity from Torture to Dust (Iterated Version), and we accept **TB**, we must conclude Torture is worse than Dust. If we accept **CONT**, we must conclude that enough Dust outweighs Torture. But **SSC** demands that Torture always outweighs Dust.
  *   **Resolution Strategy:** Any adequate account must explicitly reject or modify one of these three conditions.
      *   *Utilitarianism* rejects **SSC** (accepts TB, CONT).
      *   *Lexical Prioritarianism* rejects **CONT** (accepts TB, SSC).
      *   *Cyclic/Spectrum Views* reject **TB** (accepts CONT, SSC).

  ## 6. The Exclusionary Requirement
  **Requirement:** **The Severe Suffering Constraint (SSC).**

  **Justification:** I take the SSC to be the single requirement that excludes the largest class of otherwise plausible views.
  *   **Reasoning:** The dominant framework for public policy analysis is Cost-Benefit Analysis (CBA), which relies on welfarist utilitarianism. Standard CBA assumes **Continuity** and **Transitivity**, implying that all harms are commensurable and aggregable. Consequently, standard CBA necessarily violates the **Severe Suffering Constraint**; it implies that if $N$ is large enough, the aggregate utility loss of dust specks outweighs the utility loss of torture.
  *   **Impact:** Adopting SSC as non-negotiable immediately excludes Classical Utilitarianism, Standard Cost-Benefit Analysis, and any view that treats welfare as a single continuous metric without thresholds. It forces the agency to adopt a more complex, multi-criteria decision framework (e.g., Threshold Prioritarianism or Rights-Based Constraints).

  ## 7. Illustrative Evaluation of Three Broad Families of Views

  To demonstrate the utility of this specification, consider how three standard theoretical families fare against the criteria.

  | Criterion | **1. Straightforward Additive Aggregation (Utilitarianism)** | **2. Lexical / Threshold Priority (Prioritarianism)** | **3. Discounting / Non-Aggregative (Deontological)** |
  | :--- | :--- | :--- | :--- |
  | **Severe Suffering Constraint (SSC)** | **FAILS.** Implies sufficient dust specks outweigh torture. | **PASSES.** Posits a lexical threshold where severe harms trump minor ones. | **PASSES.** Often prohibits imposing severe harm regardless of consequences. |
  | **Non-Ignorance of Numbers (NIN)** | **PASSES.** Fully aggregates all harms. | **PASSES.** Aggregates below the threshold; prioritizes above it. | **FAILS/RISK.** May ignore numbers entirely to protect rights (e.g., cannot sacrifice 1 to save 1,000,000). |
  | **Transitivity (TB)** | **PASSES.** Fully transitive ordering. | **PASSES.** Usually maintains transitivity via discontinuous jumps. | **PASSES.** Generally transitive regarding duties. |
  | **Continuity (CONT)** | **PASSES.** Assumes all goods/bads are commensurable. | **FAILS.** Explicitly rejects continuity between severity classes. | **FAILS.** Rejects trade-offs between distinct moral categories. |
  | **Tractability (TAG)** | **PASSES.** Easy to calculate (sum total). | **MODERATE.** Requires defining thresholds, which can be vague. | **FAILS.** Can lead to paralysis if rights conflict (inaction). |
  | **Overall Verdict** | **Inadequate.** Violates the non-negotiable SSC. | **Most Promising.** Balances SSC and NIN, though threshold definition is challenging. | **Inadequate.** Fails NIN and TAG; too rigid for resource allocation. |

  **Recommendation:** The agency should seek a **Threshold Prioritarian** model. This approach satisfies the non-negotiable **Severe Suffering Constraint** and **Transitivity**, while retaining sufficient **Non-Ignorance of Numbers** for practical governance. It requires abandoning **Continuity**, acknowledging that not all harms are mathematically commensurable, which aligns with legal and human rights frameworks.
