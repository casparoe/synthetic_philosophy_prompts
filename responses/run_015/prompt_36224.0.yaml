answer: |-
  The practice presupposes a theory of the state as a diachronic moral agent capable of bearing symbolic responsibility for past institutional acts, distinct from the legal liability or personal culpability of its current citizens.

  This implicit theory rests on three pillars. First, it assumes **corporate continuity**: the state is not merely the sum of its current officeholders but a persistent entity that inherits the moral ledger of its predecessors. Second, it relies on a **bifurcation of responsibility**: it distinguishes moral acknowledgment (which is owed) from legal liability (which is disclaimed), allowing the state to admit wrong without triggering automatic reparative litigation. Third, it treats the apology as a **performative identity claim**: by apologizing, the state redefines its current values in opposition to its past actions, signaling a break in continuity of *policy* while maintaining continuity of *agent*.

  Strictly presupposed by the practice is only the capacity of the state to speak as a unitary "we" across time and the validity of separating moral acknowledgment from legal consequence. The practice fits comfortably with, but does not require, stronger metaphysical claims about the state's personhood. For instance, the ritual works equally well under a realist view (the state is a genuine moral person) or a constructivist view (the state is a fictional narrator useful for social cohesion), provided the institutional continuity is unbroken. Similarly, the practice is underdetermined regarding the nature of the responsibility inherited; it is compatible with theories of "inheritance of obligation" (we must fix this) just as well as "inheritance of guilt" (we feel shame for this), because the textual ambiguity allows both readings to coexist without collapsing the ritual.

  The practice appears internally inconsistent on two fronts, though both inconsistencies dissolve under closer inspection. First, the legislative vote suggests that a majority can impose a moral stance on dissenters, which clashes with the idea that moral responsibility requires agency. This dissolves if one views the apology not as an expression of individual conscience but as an institutional speech act authorized by procedure; the dissenters are not being forced to feel guilt, but are outvoted on the state's official position. Second, addressing the dead seems pragmatically impossible since they cannot receive the speech act. This dissolves if the addressee is understood not as the recipient of communication but as the subject of a historical record; the apology is actually directed at the living audience *about* the dead, serving a commemorative rather than communicative function.

  If we replaced the presupposed view with one denying corporate moral agency entirely—holding that the state can inherit obligations to remedy injustice without inheriting guilt—the practice would require significant alteration. The language of "sorry" and "regret" would become incoherent, as these are emotive states requiring a subject capable of feeling them. The ritual would shift from an apology to a formal "acknowledgment of fact" coupled with a policy announcement. The disclaimer of legal liability would become redundant or shift to a disclaimer of moral fault, and the ceremonial gravity would likely diminish, as the act would be forward-looking (remediation) rather than backward-looking (atonement).

  I am moderately confident in this reconstruction, as it aligns with the textual and procedural evidence of recent state apologies. I am least sure about the status of the addressee; while I agree with your suspicion that addressing the dead is the philosophically weakest link, it is possible that some theories of intergenerational community treat the dead as ongoing participants in the polity, which would make the address literal rather than symbolic, though this view is marginal in contemporary theory.
