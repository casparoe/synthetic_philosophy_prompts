answer: |-
  Here is the principle you are looking for, stripped of the pop-psych padding.

  ### The Principle: The Contrastive Difference-Maker

  A historical explanation is valid only if it identifies a **variable** that **varies** across a relevant **comparison class**, linked to the outcome by a **mechanism** that is operationalizable independent of the outcome.

  In data terms: You are trying to explain the residual variance in $Y$ (the outcome). You cannot do this with a constant (something present in all cases) or a tautology (something defined by the outcome).

  Your two-part rule was close, but your co-host is partially right: **(b) Comparison is the test, (a) Mechanism is the justification for the comparison.** You cannot compare cases unless you have a mechanism that tells you which cases are comparable. But the *work* is done by the variance.

  Here is how this principle audits your eight cases, where your rule breaks, and what you should drop.

  ---

  ### Audit of Your Cases

  1.  **Titanic (Iceberg vs. Bulkheads):**
      *   **Verdict:** Correct.
      *   **Why:** "Hit iceberg" is a constant (or near-constant) for the specific event of the sinking, but it has low variance across the comparison class (many ships hit ice and floated). "Bulkheads/Speed" varies across ships and correlates with sinking.
      *   **Clause:** Comparison Class.

  2.  **Rome (Fall/Decadence):**
      *   **Verdict:** Correct.
      *   **Why:** This fails **Gate 0: Explanandum Validity**. Before you run the Difference-Maker test, you must define the event. "Rome fell" is not a single data point; it's a smoothed curve. If you can't date the outcome, you can't correlate causes to it.
      *   **Clause:** Separate Check (see below).

  3.  **Waterloo (Mud/Prussians):**
      *   **Verdict:** Correct.
      *   **Why:** This looks like a one-off, but the mechanism (mud impedes artillery movement) is invariant and attested elsewhere. The variable (ground dryness) varied across other battles Napoleon fought. It changes the *probability* of the outcome.
      *   **Clause:** Mechanism (attested independently).

  4.  **Bronze Age (Complexity):**
      *   **Verdict:** Your discomfort is correct. This is a **Tautology Trap**.
      *   **Why:** If "complexity" implies "fragility" by definition, you haven't explained anything. If complexity is measurable, did *all* complex systems collapse? If yes, complexity is a constant, not a difference-maker. If no, why did *these* complex systems collapse when *those* survived? The explanation must explain the variance, not just the state.
      *   **Clause:** Comparison Class (fails to distinguish survivors).

  5.  **2008 (Overdetermined vs. Fannie Mae):**
      *   **Verdict:** Correct.
      *   **Why:** "Overdetermined" admits you can't find the difference-maker. "Fannie Mae" is a single variable that doesn't correlate with the variance (other countries had housing crashes without Fannie Mae). The good middle is identifying the **transmission mechanism** (e.g., mortgage-backed securities liquidity freeze) that turned a housing correction into a systemic crash.
      *   **Clause:** Mechanism (must explain the *amplification*, not just the existence).

  6.  **2005 Bubble (Prediction vs. Post-hoc):**
      *   **Verdict:** Correct.
      *   **Why:** This tests the **Mechanism's Independence**. If the mechanism (e.g., price-to-rent ratios) was identified *before* the crash, it is attested independently of the outcome. If the story was assembled after, the mechanism is likely fitted to the noise.
      *   **Clause:** Mechanism (temporal independence).

  7.  **Grandfather's Store (Pride):**
      *   **Verdict:** **Drop this one.**
      *   **Why:** This is the weak link in your chain. You believe it because you have **private testimony**, not historical evidence. For a history podcast, this is methodologically unsound. "Pride" is unobservable to anyone but you. There is no comparison class (n=1). It feels true, but it isn't *history*; it's biography.
      *   **Clause:** Fails Comparison (n=1) and Mechanism (unobservable trait).

  8.  **Startup (Grit):**
      *   **Verdict:** Correct.
      *   **Why:** "Grit" is a **Latent Variable** defined by the outcome. How do you measure grit without looking at success? If you can't measure it before the outcome, it's not a cause; it's a label for the winner.
      *   **Clause:** Mechanism (not operationalizable).

  ---

  ### The Sacrifice

  **Drop Case 7 (Grandfather).**
  You said you want a rule you can apply to a submitted paragraph. Case 7 works only because *you* know the grandfather. A listener submitting a paragraph about a stranger's hardware store using "pride" as the cause should be rejected for the same reason as "grit." It is a **Just-So Story** protected by intimacy. If you keep it, you undermine your stance on Case 8. Consistency requires you to treat individual agency as suspect unless the action (refusing a partner) is documented, not the trait (pride).

  ### The Co-Host's Betting Test

  **Is it a decent proxy?** No. It is actively misleading for history.
  **Where it misleads:** It conflates **Causality** with **Predictability**.
  *   **Gravity:** You couldn't make money betting on an apple falling in 1600 (it was certain). But gravity is still the cause.
  *   **Waterloo:** You couldn't easily bet on Napoleon losing. Does that mean the mud didn't cause the loss?
  *   **2008:** You *could* make money betting on the crash. Does that mean the cause was "people who bet against it"? No.

  **The Fix:** Tell your co-host to rephrase the test: *"Does this factor change the odds?"*
  If the factor were removed, would the probability of the outcome shift significantly? That is the **Counterfactual Test**. It captures the "Difference-Maker" principle without requiring a literal betting market.

  ### Gate 0: Explanandum Validity (The Rome Check)

  Your discomfort in Case 2 is a **separate check** that must run *before* the Difference-Maker test.
  **Rule:** You cannot explain an event until you have operationalized the event.
  *   "Rome fell" $\rightarrow$ Reject. (When? What political structure? What geography?)
  *   "The Western Imperial court ceased to appoint emperors in 476" $\rightarrow$ Accept. (Now we can look for causes).
  *   "Farming started" $\rightarrow$ Reject. (Where? Which crops?)
  *   "Domestication of einkorn wheat in the Levant c. 9000 BCE" $\rightarrow$ Accept.

  If the listener submits a paragraph where the "What" is fuzzy, the "Why" is automatically disqualified. This saves you from debating "decadence."

  ---

  ### Running the Principle on Your Three New Cases

  #### 1. The One-Off: Why farming in the Fertile Crescent?
  *   **The Trap:** It looks like a unique event (n=1).
  *   **The Application:** You must construct a comparison class of **regions where farming did not start** at that time (e.g., Australia, California, parts of South America).
  *   **The Test:** What variable varied between the Fertile Crescent and California?
      *   *Bad Explanation:* "People were smarter." (Constant across humans).
      *   *Good Explanation:* "Availability of domesticable plant species." (Varies by region, mechanism is biological caloric return, attested independently by botany).
  *   **Verdict:** Valid only if it cites the *distribution* of domesticable species, not just the *presence* of them.

  #### 2. The Negative Outcome: Why no Industrial Revolution in Song China?
  *   **The Trap:** Explaining a non-event often leads to "something was missing" stories.
  *   **The Application:** Comparison class is **Britain in the 18th Century**.
  *   **The Test:** Identify the Difference-Maker.
      *   *Bad Explanation:* "Culture discouraged innovation." (Vague, hard to measure).
      *   *Good Explanation:* "Coal deposits were located far from water transport." (Variable: Britain had coal near canals; China had coal far from canals. Mechanism: Cost of energy transport. Attested: Industrialization happened where energy was cheap).
  *   **Verdict:** Valid if it identifies a specific constraint (energy cost, institutions, wages) that differed from the British baseline.

  #### 3. The Self-Fulfilling Prophecy: 1914 War Expectations
  *   **The Trap:** Circular reasoning (They thought it would be short, so it was long? Or so it was short?).
  *   **The Application:** Mechanism must link **Belief** to **Action** to **Outcome**.
  *   **The Test:**
      *   *Variable:* Belief in "Short War."
      *   *Mechanism:* Mobilization Timetables. (If you believe it's short, you mobilize everything immediately to win fast).
      *   *Comparison:* Wars where mobilization was partial or slower.
      *   *Outcome:* Immediate full mobilization triggered counter-mobilization, locking in the long war.
  *   **Verdict:** Valid. This is a **Reflexive Mechanism**. It passes because the belief leads to a specific, observable action (timetables) that causally produces the opposite of the expected outcome. It is not just "they thought wrong"; it is "their thinking changed their behavior."

  ### Summary Rule for the Podcast

  When a listener sends in a paragraph, run this three-step filter:

  1.  **Gate 0 (Definition):** Is the event defined concretely enough that we could agree on when it happened? (If no $\rightarrow$ Reject).
  2.  **The Variance Test:** Does the proposed cause exist in cases where the outcome *didn't* happen? (If yes $\rightarrow$ Reject. e.g., Icebergs exist where ships don't sink).
  3.  **The Mechanism Test:** Is the link between cause and effect described in a way that could be measured *before* the outcome occurred? (If no $\rightarrow$ Reject. e.g., Grit, Decadence).

  If it passes all three, it's history. If it fails one, it's a story.
