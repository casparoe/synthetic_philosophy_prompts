answer: |-
  ### Brainstorming: The Legitimate Crane

  To build a "crane" account of moral cognition—one that lifts normative capacity from the bedrock of biology without a "skyhook" (unexplained miracle) or "greedy reduction" (explaining it away)—the theory must navigate a narrow channel. It cannot simply map moral terms onto neural firings (that loses the *normative force*), nor can it posit a moral faculty that descends from nowhere (that loses the *naturalistic grounding*).

  A legitimate crane must demonstrate **functional continuity** without **conceptual collapse**. It needs to show how a system governed by cause-and-effect (is) can generate a subsystem governed by correctness conditions (ought). The critical deliverable is an account of *constraint transformation*: how physical constraints (pain, resource scarcity) become social constraints (shame, obligation) which finally become internal constraints (guilt, duty), such that the final stage is causally efficacious in its own right, not just an epiphenomenal shadow of the first. The theory must explain how "getting it wrong" becomes a possible state of the system, distinct from merely "failing to survive."

  ***

  ### Desiderata for a Crane-Based Account of Normative Emergence

  Here are the conditions of adequacy for a theory claiming to naturalize moral reasoning without eliminating normativity.

  #### 1. The Scaffolding Paradox
  **The Consideration:** Many accounts explain the emergence of normativity by appealing to mechanisms like "rule-following," "promise-keeping," or "expectation management." However, these concepts are already normative. To explain the origin of rules by presupposing rule-following capacities is circular. It smuggles the skyhook in as a premise.
  **The Requirement:** The theory must describe a pre-normative substrate (e.g., behavioral regularities, conditioning, reciprocal altruism) and specify the precise tipping point where *regularity* transforms into *normativity* (where a deviation is not just different, but *incorrect*). It must show how the "ought" arises from the "is" of social feedback without assuming agents already grasp the "ought."
  **Status:** **Non-negotiable.**
  **Reasoning:** If the explanation presupposes the phenomenon, it is not an explanation of emergence; it is a restatement. This is the primary failure mode of both lazy reductionism (which ignores the shift) and rationalist nativism (which assumes the shift is innate).

  #### 2. Reflexive Cranes
  **The Consideration:** A "reflexive crane" occurs when a mechanism uses the very capacity it is supposed to explain to do the explaining (e.g., using moral reasoning to explain the evolution of moral reasoning). Critics argue this is viciously circular. Proponents argue it is "bootstrapping."
  **The Requirement:** The theory must forbid *synchronic* reflexivity (using the full-blown capacity to explain its own current operation) but tolerate *diachronic* reflexivity (earlier, simpler versions of the capacity scaffolding later, complex versions). It must distinguish between *competence* (behavioral success) and *comprehension* (explicit understanding).
  **Status:** **Negotiable (with strict conditions).**
  **Reasoning:** Strict prohibition makes development impossible (you can't learn logic without using logic). However, tolerance is only granted if the earlier stage is demonstrably weaker and distinct in kind from the later stage. If the "primitive" version is just the complex version in disguise, the crane collapses.

  #### 3. Ontological Reduction vs. Explanatory Delegation
  **The Consideration:** Greedy reductionism conflates "X is made of Y" with "X is nothing but Y." It argues that because moral judgments are neural events, they are *only* neural events, stripping them of normative authority.
  **The Requirement:** The account must preserve **explanatory autonomy** for the normative level. It must allow that while moral properties supervene on physical properties, explanations at the moral level (appealing to reasons, duties, consistency) capture causal patterns that physical explanations (appealing to spikes, neurotransmitters) miss or obscure.
  **Status:** **Non-negotiable.**
  **Reasoning:** This is the definition of the project. If you collapse this distinction, you are a greedy reductionist. If you deny the supervenience, you are a dualist/skyhook user. The crane must walk the line: dependent ontology, independent explanatory utility.

  #### 4. Cross-Cultural Disagreement and Local Error Correction
  **The Consideration:** If morality is just evolutionary fitness, there is no "error," only mismatch. If morality is a skyhook, disagreement is just ignorance of the Truth. A crane account must explain how communities revise norms (e.g., abandoning slavery) without appealing to a transcendent standard they are slowly discovering.
  **The Requirement:** The theory must posit an **immanent standard of correctness**. Normative revision must be modeled as optimization for a functional goal (e.g., social cohesion, conflict reduction, cooperative stability) that is internal to the system. It must explain how a group can be *wrong* about a norm relative to their own functional goals, without needing a "View from Nowhere."
  **Status:** **Non-negotiable.**
  **Reasoning:** Without real error correction, moral reasoning is mere preference shifting. Without a transcendent standard, it avoids the skyhook. The theory must show how "better" is a coherent concept within a closed naturalistic system.

  #### 5. Empirical Equivalence with Standard Evolutionary Psychology
  **The Consideration:** Standard evolutionary psychology (EP) often posits specific modules for cheater detection, kin altruism, etc. Some crane theorists argue EP is too greedy; EP proponents argue crane theorists ignore data.
  **The Requirement:** The theory must be consistent with the **hard data** of evolutionary biology (e.g., selection pressures, heritability) but need not accept the **theoretical interpretations** of standard EP if those interpretations rely on greedy reductionism.
  **Status:** **Negotiable.**
  **Reasoning:** Data is non-negotiable; theoretical framing is. Standard EP often assumes adaptationism that is too strong. A crane account might posit exaptation or byproduct theories that contradict standard EP narratives while respecting the biological constraints. Insisting on equivalence with current EP theory locks in potential errors.

  ***

  ### Analysis of Constraints and Conflicts

  **Jointly Unsatisfiable Cluster:**
  There is a tension between **Desideratum 1 (Scaffolding Paradox)** and **Desideratum 4 (Local Error Correction)** when combined with strict **Physical Causal Closure**.
  *   *The Conflict:* To solve the Scaffolding Paradox, you need a pre-normative base (blind causality). To allow for Local Error Correction (real "wrongness"), you need normative causality (reasons acting as causes). If physical causal closure is absolute (non-negotiable for naturalism), it is difficult to show how the "normative" level has any genuine traction to correct the "physical" level without being epiphenomenal.
  *   *The Verdict:* This cluster is satisfiable *only if* one accepts a non-reductive physicalism where higher-level patterns constrain lower-level variations (downward causation via constraint). If one demands strict bottom-up determinism, Desideratum 4 fails. If one demands strong normative realism, Physical Closure fails. The crane must occupy the "compatibilist" middle ground.

  **The Single Most Exclusionary Requirement:**
  **Desideratum 1 (The Scaffolding Paradox).**
  *   *Why:* This is the filter that catches the most contenders. Greedy reductionists fail it because they claim the "ought" is an illusion (dissolving the paradox by denying the consequent). Skyhook users fail it because they posit the "ought" as a starting condition (dissolving the paradox by denying the need for scaffolding). Most "emergentist" cognitive science fails it by using high-level cognitive terms (belief, desire, rule) to explain the emergence of high-level cognition. Only a theory that rigorously details the transition from *reactive* to *normative* without using normative vocabulary in the base layer survives this.

  ***

  ### Evaluation of Standard Accounts

  **1. Evolutionary Game-Theoretic Accounts**
  *   **Performance:** Strong on biological constraints; weak on normativity.
  *   **Critique:** These models excel at showing how cooperation stabilizes (Desideratum 5). However, they typically collapse "strategy stability" into "moral obligation." They explain why I *do* cooperate, not why I feel I *ought* to, nor how I can be *wrong* to cooperate in a specific instance if it fits the equilibrium. They often fall into Greedy Reductionism regarding Desideratum 3 and 4. They treat the Scaffolding Paradox (Desideratum 1) as a non-issue by assuming agents maximize utility, which is already a normative stance.

  **2. Dual-Process Models (System 1 / System 2)**
  *   **Performance:** Strong on mechanism; silent on emergence.
  *   **Critique:** These models describe the architecture of judgment (intuitive vs. deliberative). They respect explanatory delegation (Desideratum 3) by treating the systems as distinct functional units. However, they are largely descriptive. They do not explain how the normative force arises from the interaction of the two systems. They often smuggle in the Scaffolding Paradox (Desideratum 1) by assuming System 2 already possesses logical/normative rules whose origin is unexplained. They struggle with Desideratum 4 (Error Correction) because "error" is usually defined as deviation from a logical norm that the model assumes rather than derives.

  **3. Normativist-Emergence Views**
  *   **Performance:** Strong on normativity; weak on naturalism.
  *   **Critique:** These views prioritize the reality of the "ought" (Desideratum 4) and the autonomy of explanation (Desideratum 3). However, they frequently stumble on the Scaffolding Paradox (Desideratum 1) by positing a "normative capacity" that appears discontinuously. They risk the Skyhook by failing to specify the mechanical bridge from biology to normativity. They often treat Empirical Equivalence (Desideratum 5) as secondary, which makes them vulnerable to being dismissed as ungrounded metaphysics rather than cognitive science.

  **Summary Judgment:**
  The list reveals that the "unsatisfiable cluster" is only unsatisfiable if one demands **eliminative physicalism** or **Platonic realism**. A viable crane must reject both. The most demanding criterion is the Scaffolding Paradox; it requires a genealogy of the "ought" that does not use the word "ought" until the very end. Most current cognitive science fails this, either stopping short at "social pressure" (reductionism) or starting with "rule representation" (skyhook). The adequate theory must be a dynamic systems account where normative force is the experienced texture of social constraint internalization, not a separate property added to the world.
