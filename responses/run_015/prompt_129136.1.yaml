prompt: |-
  Hey — I run the experimentation platform at a decent-sized online marketplace, so my day job is basically: design assignment mechanisms, argue about interference, compute doubly robust off-policy estimates, draw DAGs on whiteboards and shout about colliders. I'm comfortable with potential outcomes, ITT vs TOT, encouragement designs, mediation, do-operators and front-door adjustment; I've read roughly half of a Pearl book. I've never read a page of academic philosophy, and I definately don't want a reading list or citations — I can't chase them up and I don't care who said what first.

  What I want is a translation. As I understand it there are two big families of theory about what causation actually is: one that cashes it out in terms of what would have happened otherwise, in the nearest relevant sort of possible world, and one that cashes it out in terms of what you could change by intervening on a variable and holding other things fixed. Take each family separately and restate it as faithfully as you can in my vocabulary — assignment, potential outcomes, do-operators, invariance under a shifted input distribution, identification vs estimation. Not an analogy: an actual translation, where you tell me when you're fudging.

  Concretely, here are the moves I want translated, for each family: how it defines the causal relation in the first place; what it does with the case where two candidate causes were each sufficient on their own (the redundancy cases); whether it can say anything sensible about absences and omissions — the backup job that never ran, the alert that didn't fire; whether there's a coherent separate question of 'did X cause Y on this particular occasion' over and above 'X raises Y's probability in the population'; and whether the theory quietly requires causes to be the kind of thing someone could manipulate.

  Then the residue report. Which of those moves map cleanly onto something I already do? Which only go through if you squint — say exactly what gets distorted? And which have no counterpart at all in my vocabulary? For the last category I want your view on the direction of the verdict: is my vocabulary missing a real distinction, or was the philosophical claim less clear than it looked?

  Here's where I get stuck, and it's why I'm asking. My team has an internal target we call 'effect containment': when we ship a change to the ranking model, we want to certify that it moved checkout conversion only along paths running through the ranking component we own, and that nothing leaked into that metric through the shared caching layer another team runs. Nobody can randomise the cache, and we can't switch it off either — so it's a claim about a path no one can intervene on. Can either family of theory give that claim a meaning, or does it collapse into something I'd recognise as a path-specific effect, or is it just incoherent?

  Last thing: my team has a rule of thumb, if you can't sketch the experiment you don't get to say 'caused'. Is that just the intervention-flavoured theory with the serial numbers filed off, and if so what am I losing by not noticing?

  Please write the answer in British English, and keep it concrete — I'd rather have one worked example in my own terms than a survey.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Runs an experimentation platform at a large online marketplace. Highly technical, fluent in causal inference (potential outcomes, DAGs, do-calculus, doubly robust estimators, interference).
      *   **Constraints:** No academic philosophy reading lists, no citations, no "who said what." British English. Concrete examples over surveys.
      *   **Core Task:** Translate two major philosophical theories of causation into the user's vocabulary (Potential Outcomes/Counterfactuals vs. Interventionist/Manipulationist).
      *   **Specific Moves to Translate:**
          1.  Definition of causal relation.
          2.  Redundant causes (overdetermination).
          3.  Absences/Omissions (negative causes).
          4.  Token causation (specific occasion) vs. Type causation (population).
          5.  Manipulability requirement.
      *   **Residue Report:** What maps cleanly? What requires squinting? What has no counterpart? (Is the gap real or philosophical fog?)
      *   **Specific Problem:** "Effect Containment" (certifying a path-specific effect through a component no one can intervene on/randomize). Can the theories handle this?
      *   **Rule of Thumb:** "If you can't sketch the experiment, you don't get to say 'caused'." Is this just interventionism? What's lost?

  2.  **Deconstruct the Two Families of Theory:**
      *   *Family 1: Counterfactual Dependence (Lewis-style).* Focus: "What would have happened otherwise?" Nearest possible world.
      *   *Family 2: Interventionist/Manipulationist (Woodward-style).* Focus: "What changes if I wiggle X?" Invariance under intervention.
      *   *User's Vocabulary:* Neyman-Rubin Potential Outcomes (PO), Pearl's Structural Causal Models (SCM/do-calculus).
      *   *Mapping:*
          *   Counterfactuals $\approx$ Potential Outcomes ($Y(1)$ vs $Y(0)$).
          *   Interventionism $\approx$ do-operators ($do(X=x)$) and Invariance.

  3.  **Drafting the Translation (Section by Section):**

      *   **Family 1: Counterfactual Dependence (The "Nearest World" View)**
          *   *Definition:* $X$ causes $Y$ iff $Y$ would be different if $X$ were different, holding background fixed. In PO terms: $Y_i(1) \neq Y_i(0)$.
          *   *Redundancy (Preemption/Overdetermination):* This is the hard bit for PO. If two shooters fire, and either kills the victim. PO says $Y(0)=0$ (dead) even if $X_1=0$ because $X_2=1$. So $X_1$ isn't a cause by simple counterfactual dependence. Philosophers add "de facto dependence" or "contingent paths." In PO terms, this looks like principal stratification or checking specific paths. *Translation:* It breaks the simple ITT. You need to define the contrast more narrowly.
          *   *Absences:* "The backup didn't run." In PO: $X=0$ (backup status). $Y$ (failure). If $X$ had been 1, $Y$ would be 0. Yes, PO handles this fine ($Y(0)$ vs $Y(1)$).
          *   *Token vs. Type:* PO is inherently unit-level ($Y_i$). Average Treatment Effect (ATE) is the aggregation. So PO handles token causation naturally, though we usually estimate the average.
          *   *Manipulability:* Lewis doesn't care if you can manipulate it. Smoking causes cancer even if you can't force someone to smoke. PO doesn't strictly require manipulability either (gender, race), though interpretation gets tricky.

      *   **Family 2: Interventionist/Manipulationist (The "Wiggle" View)**
          *   *Definition:* $X$ causes $Y$ iff an intervention $do(X=x)$ changes the distribution of $Y$, holding other parents fixed. Invariance.
          *   *Redundancy:* If I intervene on $X_1$ while $X_2$ is fixed at 1, does $Y$ change? No. So $X_1$ isn't a cause *in that context*. It's context-dependent.
          *   *Absences:* Can I intervene on an absence? "Do not run backup." Yes, setting a switch to off. But "The gardener didn't water" vs "The rain didn't water." Interventionism struggles with *which* absences count. It requires a well-defined intervention.
          *   *Token vs. Type:* Interventionism is usually about type-level invariance (equations). Token causation is trickier; it's about the actual value transmitted along the edge in that specific run.
          *   *Manipulability:* **Crucial.** Woodward insists causes must be manipulable in principle. If you can't define the $do()$, the claim is meaningless.

  4.  **The Residue Report (Mapping to User's Workflow):**
      *   *Clean Maps:* Counterfactuals $\to$ Potential Outcomes. Interventionism $\to$ do-calculus/SEM.
      *   *Squinting:* Token causation. We estimate ATE/CATE. We rarely certify $Y_i(1) \neq Y_i(0)$ for a specific user without error. Philosophy claims truth; we estimate probability.
      *   *No Counterpart:* "Actual Causation" in overdetermination cases. We usually define the estimand to avoid this (e.g., intention-to-treat). Philosophy worries about *who* killed the victim. We worry about *did the treatment work on average*.
      *   *Verdict:* The philosophical distinction on token causation is often fog compared to the estimation problem. But the manipulability constraint is a real guardrail against nonsense.

  5.  **The "Effect Containment" Problem:**
      *   *Scenario:* Ranking change $\to$ Checkout. Path A: Through owned ranking component. Path B: Through shared cache (uncontrollable/unrandomizable).
      *   *Goal:* Prove effect went only through Path A.
      *   *Analysis:* This is a **Path-Specific Effect (PSE)** or **Natural Direct/Indirect Effect** problem.
      *   *Counterfactual View:* Define $Y(x, M(x'))$. Can we compute this? Only if we can model the cache mechanism or find an instrument.
      *   *Interventionist View:* Can I $do(\text{Cache} = c)$? User says "No one can randomise the cache, and we can't switch it off."
      *   *Verdict:* If you cannot intervene on the mediator (Cache), you cannot identify the path-specific effect non-parametrically without strong assumptions (like no unmeasured confounding between mediator and outcome).
      *   *Is it incoherent?* No, it's a **Natural Indirect Effect** where the mediator intervention is hypothetical. It has meaning ($Y$ under ranking change, but cache fixed to what it *would* have been), but it's not identified by experiment alone. It requires a model.
      *   *Collapse:* It collapses to a mediation analysis where the mediator is unmanipulable. You are claiming invariance of the path, but you can't test it.

  6.  **The Rule of Thumb ("Sketch the Experiment"):**
      *   Is it Interventionism? Yes. It's basically "No causation without manipulation" (Holland).
      *   What's lost? It blocks you from talking about structural features that are fixed (e.g., "Did the database schema cause the latency?"). You can't A/B test schema history. But you *can* model it.
      *   *Risk:* It prevents you from making claims about things you *should* be able to reason about structurally, even if you can't randomize. It conflates *identification* with *definition*.

  7.  **Refining the Tone and Language:**
      *   British English (randomise, modelled, centre, programme, etc.).
      *   No fluff. No "As an AI..."
      *   Direct, technical, respectful of expertise.
      *   Use their examples (ranking, cache, checkout).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Lewis (Counterfactual) from Woodward (Interventionist) clearly in PO/do terms?
      *   *Correction:* Make sure to highlight that Lewis is about *dependence* (if X hadn't happened...), while Woodward is about *invariance* (if I wiggle X...). In PO, Lewis is $Y(1) \neq Y(0)$. Woodward is $P(Y|do(X))$ varies with $X$.
      *   *Check:* The "Effect Containment" problem.
      *   *Correction:* Be careful. If the cache is a mediator, and you can't intervene on it, you can't use standard mediation formulas that require $do(M)$. You need Natural Effects. But Natural Effects require cross-world independence assumptions. I need to be clear that the *meaning* exists (as a counterfactual contrast) but the *identification* is blocked without modelling assumptions.
      *   *Check:* Token vs Type.
      *   *Correction:* Emphasize that marketplace exp platforms deal in expectations ($E[Y(1) - Y(0)]$). Philosophy deals in binary truth values for specific instances. This is a category error in the translation.

  9.  **Final Polish:** Check British spelling. Ensure the "Residue Report" is distinct. Ensure the "Effect Containment" verdict is decisive.

  *(Self-Correction on "Effect Containment"):* The user asks if it collapses into a path-specific effect. Yes, it *is* a path-specific effect (Natural Direct Effect). The question is whether it has *meaning* if the mediator is unmanipulable. Interventionists say "No meaning without intervention." Counterfactualists say "Meaning exists, identification is hard." I need to present this tension.

  *(Refining the Rule of Thumb):* The rule "If you can't sketch the experiment..." is basically Holland's "No causation without manipulation." I should name that concept without citing Holland (user said no citations). Just describe the stance.

  *(Final check on constraints):* No reading list. No citations. British English. Concrete.

  Let's write.
answer: |-
  Right. Let's strip the philosophy down to the structural equations and potential outcomes you actually use. I'll treat the two families as 'Counterfactual Dependence' (Lewis-style) and 'Interventionist Invariance' (Woodward-style), and map them directly onto your Neyman-Rubin and Pearl toolkits.

  ### Part 1: The Translation

  #### Family 1: Counterfactual Dependence
  *The core idea: Causation is about difference-making in the nearest possible world.*

  1.  **Definition of Causal Relation:**
      *   **Philosophy:** $X$ causes $Y$ iff, in the nearest possible world where $X$ did not occur, $Y$ would not have occurred (or would be different).
      *   **Your Vocabulary:** This is the fundamental definition of the individual treatment effect. For unit $i$, $X$ causes $Y$ if $Y_i(1) \neq Y_i(0)$.
      *   **The Fudge:** Philosophy treats this as a binary truth value for a specific token event. You treat it as a random variable $Y_i(1) - Y_i(0)$ with an expectation. They care about the realisation; you care about the distribution.

  2.  **Redundant Causes (Overdetermination):**
      *   **Scenario:** Two ranking signals, $A$ and $B$, both trigger a promotion. Either one alone is sufficient for the checkout conversion lift. Both fire.
      *   **Philosophy:** Simple counterfactual dependence fails here. If you remove $A$ (nearest world), $B$ is still there, so $Y$ is still 1. $A$ is not a cause. To fix this, they introduce 'de facto dependence' or 'contingent paths' (hold $B$ fixed at 0, then $A$ matters).
      *   **Your Vocabulary:** This is a failure of the simple ITT. You need a **Principal Stratification** or a **Path-Specific Effect**. You must define the estimand as $E[Y(1, M(0)) - Y(0, M(0))]$. If you don't explicitly block the redundant path in the estimand definition, the effect vanishes.
      *   **The Fudge:** Philosophy tries to rescue the intuition that $A$ *did* cause it. You would likely say the *marginal* effect of $A$ is zero, and move on.

  3.  **Absences and Omissions:**
      *   **Scenario:** The backup job didn't run; the database crashed.
      *   **Philosophy:** Yes, absences are causes. "The absence of the backup caused the crash."
      *   **Your Vocabulary:** Trivial. $X$ is a binary indicator for 'Backup Run'. $X=0$. The effect is $Y(1) - Y(0)$. The fact that the 'active' state was 0 doesn't change the math.
      *   **The Fudge:** None. PO handles negative indicators perfectly well.

  4.  **Token vs. Type:**
      *   **Scenario:** Did *this* ranking change cause *this* user's purchase? vs. Does ranking cause purchase generally?
      *   **Philosophy:** Distinct problems. Token causation is about the specific history of events.
      *   **Your Vocabulary:** You don't really do token causation. You estimate $ATE$ or $CATE$. You can compute an individual uplift score, but you can never verify it for a single unit (the fundamental problem of causal inference).
      *   **The Fudge:** Philosophy claims truth conditions for the token. You only have probabilistic estimates. You cannot translate 'actual cause' without admitting you're working with expectations.

  5.  **Manipulability:**
      *   **Philosophy:** Not required. Gender can cause wage gaps even if you can't intervene on gender.
      *   **Your Vocabulary:** Consistent with PO. You can define $Y(\text{male})$ and $Y(\text{female})$ even if $do(\text{gender})$ is impossible.
      *   **The Fudge:** Interpretation. Without an intervention, the counterfactual 'world' where gender changes is ill-defined (what else changes with it?).

  #### Family 2: Interventionist Invariance
  *The core idea: Causation is about stability under manipulation.*

  1.  **Definition of Causal Relation:**
      *   **Philosophy:** $X$ causes $Y$ iff there is a possible intervention on $X$ that changes $Y$ (or its probability), while holding other relevant variables fixed.
      *   **Your Vocabulary:** $P(Y | do(X=x))$ varies with $x$. Crucially, the structural equation $Y := f(X, U)$ must remain **invariant** under the intervention.
      *   **The Fudge:** Philosophy insists the intervention must be 'ideal' (no side effects). In your platform, 'leakage' (interference) violates the ideal intervention assumption.

  2.  **Redundant Causes:**
      *   **Scenario:** Same as above ($A$ and $B$ both sufficient).
      *   **Philosophy:** Context-dependent. If $B=1$, intervening on $A$ does nothing. So $A$ is not a cause *in that context*.
      *   **Your Vocabulary:** Effect modification. The CATE conditional on $B=1$ is zero.
      *   **The Fudge:** Philosophy struggles to say $A$ caused it in the joint case. You would just report the interaction term.

  3.  **Absences and Omissions:**
      *   **Scenario:** Backup didn't run.
      *   **Philosophy:** Only a cause if there is a well-defined intervention to *make* it run. If 'running the backup' is not a coherent manipulation (e.g., 'if the gardener had watered the plants' vs 'if it had rained'), it's not a cause.
      *   **Your Vocabulary:** You can only estimate $do(X=1)$ if $X=1$ is a valid treatment assignment. If the 'absence' is a lack of system capability, you can't define the $do()$.
      *   **The Fudge:** This is stricter than PO. PO allows you to write $Y(1)$ even if $X=1$ is impossible. Interventionism says that equation is meaningless.

  4.  **Token vs. Type:**
      *   **Philosophy:** Primarily about Type (invariance of the equation). Token causation is derived (did the value transmit along the invariant wire on this occasion?).
      *   **Your Vocabulary:** You assume the structural model (Type) holds to estimate the effect. You rarely validate the token transmission.
      *   **The Fudge:** Interventionism requires the mechanism to be stable. If your ranking model drifts, the causal claim dissolves.

  5.  **Manipulability:**
      *   **Philosophy:** **Required.** No causation without manipulation. If you can't sketch the $do()$, the claim is nonsense.
      *   **Your Vocabulary:** This is the 'no causation without identification via experiment' stance.
      *   **The Fudge:** It rules out structural claims about fixed variables (e.g., 'latency caused drop-off' where latency is a system property you can't randomise directly).

  ---

  ### Part 2: The Residue Report

  **1. Clean Maps**
  *   **Counterfactual Dependence $\to$ Potential Outcomes:** This is a near-perfect isomorphism. $Y(1)$ vs $Y(0)$ is exactly 'nearest possible world'.
  *   **Interventionism $\to$ do-calculus:** Also clean. $do(X)$ is the intervention. Invariance is the stability of the structural equations.

  **2. Requires Squinting**
  *   **Token Causation:** Philosophy wants a binary 'Yes/No' for a specific user session. You provide a probability.
      *   *Distortion:* You are forced to treat a truth value as an expectation.
      *   *Verdict:* The philosophical distinction is less clear than it looks. In a stochastic system (your marketplace), 'actual cause' is always probabilistic. The philosophical demand for binary token causation is a category error for your domain.
  *   **Redundancy:** Philosophy twists itself in knots to save the intuition that both shooters caused the death.
      *   *Distortion:* You avoid this by defining estimands (e.g., marginal vs conditional) that make the redundancy explicit rather than paradoxical.
      *   *Verdict:* Your vocabulary is superior here. You treat it as an identification problem; they treat it as a metaphysical puzzle.

  **3. No Counterpart**
  *   **The 'Ideal' Intervention:** Interventionist philosophy requires the intervention to break all incoming arrows to $X$ without touching $Y$ directly.
      *   *Gap:* In your platform, perfect isolation is impossible (interference, network effects, shared cache).
      *   *Verdict:* Your vocabulary is missing a rigorous way to quantify *degree of violation*. You assume SUTVA or model interference; philosophy demands the intervention be clean to count as causation. If your experiment leaks, the interventionist says "That wasn't a cause." You say "That's a biased estimate of the cause."
  *   **Mechanism vs. Dependence:** Interventionists care about the *pathway* (the mechanism) being invariant. Counterfactualists care only about the input-output dependency.
      *   *Gap:* You often conflate these. If $do(X)$ moves $Y$, you say $X$ caused $Y$. You don't always check if the *equation* stayed the same.
      *   *Verdict:* This is a real distinction you are losing. If the mechanism changes (e.g., users learn to game the ranking), the causal claim fails even if the statistical dependence holds.

  ---

  ### Part 3: The 'Effect Containment' Problem

  **Your Scenario:**
  Ranking Change ($X$) $\to$ Checkout ($Y$).
  Path 1: Through Owned Ranking Component ($M_1$).
  Path 2: Through Shared Cache ($M_2$).
  Constraint: You can randomise $X$. You cannot randomise or intervene on $M_2$ (the cache).
  Goal: Certify effect flowed *only* through $M_1$.

  **Can the theories give this meaning?**

  1.  **Counterfactual View:**
      *   Yes. This is a **Natural Direct Effect (NDE)** question.
      *   Estimand: $E[Y(1, M_2(0)) - Y(0, M_2(0))]$. (Change ranking, but force cache to behave as it would have under control).
      *   *Meaning:* It has clear counterfactual meaning. "What would checkout be if we shipped the ranking change, but the cache remained in the state the old ranking would have produced?"
      *   *Identification:* **Blocked.** Because you cannot intervene on $M_2$, you cannot identify this non-parametrically. You need to model the $M_2 \to Y$ relationship and assume no unmeasured confounding between $M_2$ and $Y$.
      *   *Verdict:* The claim is *coherent*, but not *certifiable* by experiment alone. It collapses into a mediation analysis with untestable assumptions.

  2.  **Interventionist View:**
      *   **Hard No.**
      *   If you cannot define $do(M_2 = m)$, then the path through $M_2$ is not a causal pathway in the interventionist sense.
      *   Since you cannot 'hold $M_2$ fixed' via intervention, you cannot distinguish the path.
      *   *Verdict:* The claim is *incoherent* unless you can construct a proxy intervention on the cache (e.g., a flag that forces cache miss). Without that, 'effect containment' is metaphysical hand-waving.

  **My View:**
  It collapses into a **Path-Specific Effect** that is **unidentified**.
  You are asking for a Natural Indirect Effect through $M_2$, to show it is zero. Since $M_2$ is unmanipulable, you cannot verify the 'invariance' of that path.
  *Recommendation:* Do not call this 'causation' in the interventionist sense. Call it 'structural attribution based on model assumptions'. If you cannot sketch an experiment that isolates the cache (even a hypothetical one where you could flush it), the Interventionist says you are talking nonsense. The Counterfactualist says you are talking sense but lying about your certainty.

  ---

  ### Part 4: The Rule of Thumb

  **"If you can't sketch the experiment, you don't get to say 'caused'."**

  **Is it Interventionism?**
  Yes. It is 'No Causation Without Manipulation' (Holland's dictum) with the serial numbers filed off. It aligns with the Interventionist family. It rejects the Counterfactual family's willingness to discuss causes that cannot be wiggled (like gender, or historical events, or your unrandomisable cache).

  **What are you losing?**
  1.  **Structural Explanations:** You lose the ability to make causal claims about fixed system properties. Example: "The database schema caused the latency spike." You can't A/B test the schema history. Under your rule, you can't say 'caused'. You have to say 'associated'. This is overly conservative. The schema *did* cause it, even if you can't rewind time to test it.
  2.  **Diagnostic Power:** Sometimes you know the mechanism (the DAG) better than you can design the experiment. If you know the cache *must* mediate the effect physically, your rule prevents you from stating that causal chain until you find a way to randomise the cache.
  3.  **Efficiency:** It forces you to hunt for instruments or randomisation points where a structural model + observational data (with sensitivity analysis) might suffice.

  **The Verdict:**
  Your rule is a **heuristically excellent guardrail against confounding**, but it is **ontologically too narrow**.
  *   Keep it for **claims to stakeholders**: It prevents overpromising on observational data.
  *   Drop it for **internal debugging**: When the site is down, you need Counterfactual Dependence ("If we rollback, it fixes it"), not Interventionism ("We can't randomise the rollback").

  **Summary:**
  Your vocabulary is 90% Counterfactual (Potential Outcomes) wrapped in 10% Interventionist (do-operators) clothing. The 'Effect Containment' problem fails because you are trying to use Interventionist standards (isolation) on a Counterfactual estimand (path-specific effect) without the identification conditions (mediator intervention). You need to admit that 'containment' is a model assumption, not an experimental fact.
