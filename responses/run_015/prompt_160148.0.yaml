answer: |-
  Here is a defended agenda for your three-year programme. I have ranked the lines of work based on **upstream dependency** (does this need to be solved before the others make sense?), **conceptual tractability** (can three philosophers make progress on this without empirical data?), and **downstream impact** (does the answer determine the viability of dualism, illusionism, or physicalism?).

  ### 1. The Ranking and Defence

  **Priority 1: The Scope Question (Specifically the Argumentative Generalisation)**
  **Priority 2: The Constitutive or Acquaintance Reply**
  **Priority 3: The Common-Cause Reply (Modal Robustness)**

  **Dropped:** The Tracking Reply (Line 1) and Dissolution Options (Line 5) as primary workstreams.

  #### Defence of the Ranking

  **Priority 1: The Scope Question (The Self-Defeat Objection)**
  *   **Reasoning:** This is the most upstream item on your map. If the "Argumentative Generalisation" holds—meaning the arguments *for* epiphenomenalism are themselves judgments not causally explained by the phenomenal facts they concern—then epiphenomenalism is pragmatically self-defeating. It strips the theory of its own warrant.
  *   **Tractability:** This is a logical and epistemological problem, not a metaphysical one. It is highly tractable for a conceptual team. You can formalise the structure of the self-defeat argument and test various epistemic principles (e.g., "knowledge requires causal explanation") against it.
  *   **Downstream Impact:** If this objection succeeds, the project pivots immediately to Dissolution (Illusionism) or a retreat from dualism. If it fails, you must proceed to Priority 2 and 3 to explain *how* the judgments are warranted. It dictates the survival of the research question itself.
  *   **Trade-off:** You are weighting upstreamness over metaphysical depth. It is better to know if the view is coherent than to know exactly *how* it is coherent.

  **Priority 2: The Constitutive or Acquaintance Reply**
  *   **Reasoning:** If the view survives Priority 1, you must explain the relation between experience and judgment without causation. The Constitutive Reply is the standard "best hope" for non-eliminativist dualists (often associated with the Phenomenal Concept Strategy).
  *   **Tractability:** This requires analysing the metaphysics of "constitution" and "acquaintance." While difficult, there is a robust existing literature on non-causal grounding and acquaintance that you can leverage. The "Grain Test" you invented is an excellent tool here: can constitution explain fine-grained discrimination where causation might fail?
  *   **Downstream Impact:** If this works, it saves a robust form of dualism. If it fails (e.g., if constitution turns out to imply causation, or if acquaintance is too mysterious), it pushes you toward Priority 3 or Dissolution.
  *   **Trade-off:** This is less upstream than Scope but more central to the metaphysics of mind. It is prioritised over Common-Cause because it is the more traditional and developed rival to the causal picture.

  **Priority 3: The Common-Cause Reply (Modal Robustness)**
  *   **Reasoning:** This is the most novel and under-explored line in your map. It treats the correlation as a law-like regularity grounded in a physical common cause. Your specific focus on **modal robustness** (the Perturbation Test) is the key innovation here.
  *   **Tractability:** This involves analysing the modal status of psychophysical laws. It is tractable conceptually but risks becoming a debate about the nature of laws of nature, which can drift. Keeping it focused on the *perturbation* of the correlation keeps it tight.
  *   **Downstream Impact:** If successful, it offers a "naturalised epiphenomenalism" that might be palatable to physicalists who accept nomological supervenience but deny causal efficacy. If it fails (because the correlation is too fragile), it strengthens the case for Priority 2 (Constitution) or Dissolution.
  *   **Trade-off:** This is ranked third because it is less likely to save *substantive* dualism than the Constitutive Reply (it looks more like parallelism), but it is essential for mapping the full logical space.

  **Why Tracking (Line 1) is Dropped:**
  You have already identified the "Surrogate Problem." In the literature, this is a version of the **Reliability Challenge** (analogous to the Benacerraf-Field challenge in metaethics). It is widely regarded as a dead end for the epiphenomenalist unless backed by a metaphysical explanation (like Common-Cause or Constitution). Pursuing "bare correlation" as a standalone reply is unlikely to yield novel results in three years; it is best treated as a foil for Priority 2 and 3.

  **Why Dissolution (Line 5) is Dropped as a Workstream:**
  Illusionism and Neutral Monism are *conclusions*, not investigative tools. They should be the output of the programme if Priorities 1–3 fail. Dedicating a workstream to them risks duplicating existing work (e.g., by Frankish or Chalmers) rather than testing the epiphenomenalist premise itself.

  ---

  ### 2. Critique of the Map: Dead Ends, Omissions, and Terminology

  **Where the Map is Wrong (or Redundant):**
  *   **The "Surrogate Problem":** This is not a new distinction; it is a sharp formulation of the **Evolutionary Debunking Argument** applied to consciousness. If judgments track experience without being caused by it, evolution could not have selected for accurate judgments. You should integrate this existing literature rather than treating it as a novel problem you invented.
  *   **Tracking vs. Common-Cause:** In many frameworks, these collapse. If a non-phenomenal mechanism co-varies (Tracking), it is usually because a physical state causes both the experience (via supervenience) and the mechanism (via physics). This *is* a Common-Cause structure. Your distinction holds only if the Tracking mechanism is *not* physically determined by the supervenience base, which makes it magical. I recommend merging the analysis of Tracking into the Common-Cause workstream to avoid redundancy.
  *   **Dissolution:** You list Illusionism and Neutral Monism together. They are dialectically opposite. Illusionism denies the data (phenomenal states don't exist as described); Neutral Monism denies the categorisation (phenomenal and physical are aspects of one stuff). Grouping them obscures the fact that Illusionism is the natural fallback if Epiphenomenalism fails the Scope Test, whereas Neutral Monism is a rival metaphysics that might dissolve the causal inertness problem entirely.

  **What You Have Omitted:**
  *   **The Normative Turn (Justification vs. Knowledge):** You focus on whether judgments are *explained* (warrant/knowledge). You need to distinguish **externalist reliability** (the judgment is true and reliably produced) from **internalist justification** (the subject has access to *why* it is true). Epiphenomenalism might satisfy the former (via Common-Cause) but fail the latter. This distinction is crucial for the Scope Question.
  *   **Semantic Externalism:** If the *content* of the judgment is determined by the experience (even if the cause is physical), does the causal inertness matter? This is a semantic route out of the paradox that is not clearly mapped in your five lines.

  ---

  ### 3. Dependency Map (Prose)

  The project must proceed sequentially between Priority 1 and the rest, but Priorities 2 and 3 can run in parallel.

  **Phase 1: The Coherence Check (Priority 1 - Scope)**
  You must settle the **Argumentative Generalisation** first. If the team concludes that epiphenomenalism is self-defeating (i.e., we cannot be warranted in believing it), the project immediately pivots. In this scenario, Priorities 2 and 3 become historical post-mortems on *why* the view failed, and the output shifts to evaluating Illusionism as the only coherent alternative. **Nothing in Priorities 2 or 3 matters if Priority 1 yields a positive result for self-defeat.**

  **Phase 2: The Metaphysical Mechanism (Priorities 2 & 3 in Parallel)**
  If Priority 1 is cleared (i.e., you establish that warrant is possible without causal explanation), you must explain the correlation.
  *   **Workstream A (Constitutive):** Investigates if the judgment is *part* of the experience. This requires settling the metaphysics of "partial constitution."
  *   **Workstream B (Common-Cause):** Investigates if the correlation is law-like. This requires settling the modal status of psychophysical laws.
  *   **Interdependency:** These two compete. If Constitution works, Common-Cause is unnecessary. If Common-Cause works, Constitution is too costly. However, they can be worked on simultaneously because they rely on different conceptual toolkits (metaphysics of grounding vs. metaphysics of laws). The **Grain Test** and **Perturbation Test** should be applied to both to see which survives.

  **Phase 3: Synthesis and Dissolution**
  Only after Phase 2 can you evaluate the "What Follows" (Line 5). If both 2 and 3 fail, Illusionism becomes the default. If one succeeds, you defend a specific form of Dualism.

  ---

  ### 4. Checkpoints and Triggers

  Since this is conceptual work, you need dialectical or formal milestones to gauge progress.

  **Year 1 Checkpoint (Scope):**
  *   **Target:** A formalised model of the "Self-Defeat" argument.
  *   **Move Up:** If you identify a principled distinction between *theoretical judgments* (about consciousness) and *observational judgments* (of consciousness) that blocks the generalisation.
  *   **Move Down:** If the literature converges on the view that self-defeat is merely "pragmatic" and not logical (a live dispute), lowering the urgency of Priority 1.

  **Year 2 Checkpoint (Constitution vs. Common-Cause):**
  *   **Target:** A definitive account of the "Grain Test."
  *   **Move Up:** If you can demonstrate that Constitutive views uniquely predict fine-grained discrimination where Common-Cause views predict noise.
  *   **Move Down:** If the "Perturbation Test" reveals that Common-Cause views require such fragile laws that they are indistinguishable from coincidence (validating your Surrogate Problem).

  **Year 3 Checkpoint (Synthesis):**
  *   **Target:** A decision matrix for Dualism vs. Illusionism.
  *   **Trigger:** If a major new argument against physicalism emerges (e.g., a new Knowledge Argument variant), Priority 2 (Constitution) moves up in importance as the only way to save dualism. If physicalism gains ground (e.g., via illusionist arguments), Priority 3 (Common-Cause) becomes more attractive as a compatibilist bridge.

  ---

  ### 5. Status of Claims (Settled, Contested, Speculative)

  To ensure your case for support is accurate, mark the dialectical status as follows:

  *   **Settled/Near-Settled:**
      *   That Epiphenomenalism faces the Paradox of Phenomenal Judgment (Chalmers 1996 is the canonical source).
      *   That pure "Tracking" without metaphysical grounding faces the "Coincidence/Reliability" objection (widely accepted in the literature).
      *   That Illusionism is the primary rival view to non-eliminativist dualism.

  *   **Genuinely Contested:**
      *   **Whether Acquaintance solves the paradox:** Some argue acquaintance is non-causal knowledge (Russellian view); others argue it disguises a causal relation. This is a live dispute.
      *   **Whether Self-Defeat is fatal:** Some argue it is a *reductio*; others argue it is a cost we must bear (the "inert knowledge" view).
      *   **The Modal Status of Psychophysical Laws:** Whether they are metaphysically necessary (Kripkean) or contingent (Humean) is unresolved and directly impacts your Common-Cause line.

  *   **Where You Are Going Out on a Limb (Speculative):**
      *   **The "Surrogate Problem" as distinct from Reliability Challenges:** While the intuition is standard, framing it as a specific "second coincidence" problem is your own formulation. Present it as a *refinement* of the reliability challenge, not a new discovery.
      *   **The Perturbation Test applied to Common-Cause:** Using modal robustness to distinguish Common-Cause from Tracking is a novel methodological contribution. There is little literature applying counterfactual perturbation specifically to epiphenomenalist correlations.
      *   **The Grain Test:** Applying discrimination granularity as a test for metaphysical theories of judgment is innovative. Be careful not to overstate its power; it is a heuristic, not a proof.

  ### Summary Recommendation for the Grant Application

  Present the project as a **triage operation**. The field is stuck because it tries to solve the metaphysics (Constitution/Common-Cause) before settling the epistemology (Scope/Self-Defeat). Your programme's unique value is inverting this order. By making the **Scope Question** the gatekeeper, you ensure that no time is wasted building metaphysical models for a view that might be incoherent. This justifies the 3-year timeline: Year 1 for Coherence, Year 2 for Mechanism, Year 3 for Implications.
