      *   *Final Polish:* "Do not mourn the vessel breaking when the water returns to the river; you loved the shape, but I am the flow." -> Let's go with the "seasons" imagery from the prompt's summary of the wife story.
      *   *Selection:* "To weep for me is to scold the winter for following the autumn; I am not ending, I am turning."
      *   *Specialist Objection:* It implies a continuity of *consciousness* or *personal identity* ("I am turning") which *Zhuangzi* might actually problematize. It sounds too reassuring.

  8.  **Review against Constraints:**
      *   Adjudicate 1-6? Yes.
