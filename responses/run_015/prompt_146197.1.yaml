answer: |-
  You are experiencing the friction between **Common Knowledge of Rationality (CKR)** and **Epistemic Robustness**. Your intuitions are not switching decision theories at random; they are tracking the stability of the equilibrium under small perturbations of the game's epistemic conditions.

  Here is the principle that unifies most of your verdicts, the one verdict it requires you to sacrifice, and the solution to your specific Node 2 dilemma.

  ### The Principle: Sequential Rationality with Perturbed Priors
  **Statement:** A strategy is normatively binding only if it constitutes a Sequential Equilibrium that is robust to an arbitrarily small prior probability $\epsilon > 0$ that the opponent is not a payoff-maximizer (i.e., they are a "committed" type who plays a fixed strategy regardless of payoff).

  This is the **Kreps-Wilson-Milgrom-Roberts (KWMR) Reputation Principle**. It formalizes your intuition that the "known endpoint" is doing the damage. Backward induction requires *common knowledge* of rationality all the way to the final node. If you introduce a tiny doubt ($\epsilon$) that the opponent might be irrational (or boundedly rational, or altruistic) at the final node, the induction unravels backward. The "Take" at the last node is no longer certain, so the "Take" at the second-to-last node is no longer certain, and so on.

  In this framework, cooperation is rational not because you are altruistic, but because you are exploiting the uncertainty about your own rationality to build a reputation that induces cooperation from the opponent.

  ### Testing Your Verdicts

  1.  **2-leg Centipede:** **Saved.** The horizon is too short for reputation to accumulate value. The cost of passing (forgone immediate gain) outweighs the expected benefit of convincing a stranger to pass in the single remaining round. Defecting is robust.
  2.  **100-leg Centipede:** **Saved.** The horizon is long enough that the expected value of maintaining a "cooperative type" reputation exceeds the immediate gain from defecting early. Passing is robust.
  3.  **Chain Store (20 entrants):** **Saved.** This is the canonical application of the KWMR model. Fighting early entrants signals a "tough" type to deter later entrants. Fighting the first 5-6 is the equilibrium strategy for a rational incumbent with incomplete information.
  4.  **Endless Centipede (1/50 stop):** **Saved.** There is no last node. The induction never anchors. The game is effectively infinite horizon with discounting. Passing forever is the standard equilibrium.
  5.  **Cheap Talk:** **Saved.** In the 100-leg game, the announcement shifts the prior probability that you are a "committed passer" type. In the 2-leg game, the horizon is too short for the shift in priors to alter the payoff calculation.
  6.  **Surprise Exam:** **Saved (via Epistemic Logic).** This is not a game theory problem but an epistemic one. The induction fails because "knowing" the test is on Friday eliminates the "surprise" condition, creating a Moorean paradox. The principle here is **Limits of Knowledge Retention**: the announcement itself degrades the common knowledge required for the induction to hold.
  7.  **Physical Copy:** **Not Saved (Distinct Category).** This requires **Logical Decision Theory (LDT)** or Functional Decision Theory, not just incomplete information. Here, the correlation isn't probabilistic (Bayesian); it's logical (your decision *determines* theirs). Your intuition is correct, but it relies on a different axiom: *Subjunctive Dependence*. I will not force this into the Reputation Principle, as doing so would be the "mystic" error you want to avoid.

  ### The Verdict to Overturn: 100-Round Repeated PD
  **Your Intuition:** Defect from round one ("airtight").
  **Principle's Verdict:** **Cooperate for a significant number of rounds.**

  **Why:** Structurally, the finitely repeated Prisoner's Dilemma is identical to the Centipede game regarding the end-game effect. If your intuition in the 100-leg Centipede relies on the possibility that the opponent is a "tit-for-tat" type or a "grim trigger" type (which the Reputation Principle validates), you must grant the same possibility in the Repeated PD.
  If you believe it is rational to pass in the Centipede because there is a 1% chance the stranger is irrational, it is *inconsistent* to defect in the PD where the same 1% chance exists. The "airtight" feeling you have about PD is likely textbook conditioning, not reflective equilibrium. If the Centipede intuition holds, the PD intuition must fall.

  ### The Node 2 Dilemma (100-leg, Opponent Passed Node 1)
  **Scenario:** You are moving second. The standard SI story says Node 1 should have been a "Take." You are now observing a probability-zero event.
  **Standard SI Answer:** You are in an undefined information set. Most refinements (like Forward Induction) suggest you should assume the opponent made a mistake but will play rationally henceforth, implying you should Take.
  **Reputation Principle Answer:** **Pass.**

  **Reasoning:** Under the Reputation Principle, the event "Opponent Passed Node 1" is not probability zero; it was probability $\epsilon$ (the chance they are a cooperative type). Now that you have observed it, you perform a Bayesian update.
  $$ P(\text{Opponent is Cooperative Type} | \text{Passed}) \gg P(\text{Opponent is Cooperative Type}) $$
  Your posterior belief that they are a type who will pass again is now high. Therefore, the expected value of Passing (continuing the pot growth) exceeds the value of Taking (ending the game now). You are not "allowed to reason" under strict CKR, but under the robust principle you are using for the rest of the game, you are *required* to update. To Take now would be to ignore the information content of their move.

  ### Confidence Levels

  *   **The Reputation Principle (KWMR) explaining Centipede/Chain Store:** **95% Confidence.** This is the standard game-theoretic resolution to these paradoxes (Kreps et al., 1982). It mathematically validates your gut without mysticism.
  *   **Overturning the Repeated PD Intuition:** **85% Confidence.** Theoretically, they must align. Behaviorally, humans often defect faster in PD than Centipede due to framing, but normatively, if you accept the perturbation for one, you must for the other.
  *   **Node 2 Verdict (Pass):** **90% Confidence.** Given the acceptance of the Reputation Principle, the Bayesian update is mandatory. Refusing to update is strictly irrational in that framework.
  *   **Physical Copy (LDT):** **60% Confidence.** This is the most philosophically contentious area. While FDT/EDT argues for passing, CDT (causal decision theory) argues for taking. There is no academic consensus here comparable to the Reputation Model.

  ### The Claim I Am Least Sure Of
  I am least sure about the claim that **the Surprise Exam paradox resolves via the same epistemic mechanism as the game theory cases.**

  While I grouped it under "Limits of Knowledge," the Surprise Exam is fundamentally about the logic of *knowledge* and *prediction*, whereas the Centipede/Chain Store are about *strategy* and *payoffs*. The induction fails in the Surprise Exam because the teacher's announcement creates a self-referential contradiction in the student's knowledge state, not because of uncertainty about the teacher's "type." Conflating epistemic logic paradoxes with game-theoretic equilibrium refinements is risky. I am confident the induction fails in both, but I am less confident that the *reason* is identical enough to be covered by a single "Reflective Equilibrium" principle.

  ### Summary for Your Reading Group
  Tell your friends you are adopting **Sequential Equilibrium with Incomplete Information**.
  1.  It saves the Centipede, Chain Store, and Cheap Talk intuitions.
  2.  It forces you to cooperate in the Repeated PD (the sacrifice).
  3.  It dictates you **Pass at Node 2** because the opponent's move updates your priors about their type.
  4.  It treats the "Physical Copy" case as a separate ontological category (Logical Correlation) rather than strategic uncertainty.

  This moves you from "I have inconsistent guts" to "I am applying a robust equilibrium refinement that rejects the fragility of Common Knowledge of Rationality."
