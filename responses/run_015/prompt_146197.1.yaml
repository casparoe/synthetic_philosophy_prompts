I just can't say why without sounding like a mystic. Before a hundred-leg game, both of us are allowed to publicly announce "I'll pass at every node," costs nothing, binds nothing: that moves me, I'd pass a few nodes; make the same announcement before a two-leg game and it moves me not at all.

  So: is there one principle that generates all that, or am I just switching decision theories case by case — causal in some, evidential or acausal in others — plus a dose of "my intuitions are secretly about a slightly perturbed game where there's a 5% chance the other guy is a born passer"? State the principle precisely enough that I can test it, tell me which of my verdicts it can't save and which one you'd overturn, and then tell me what it says about the case I keep flip-flopping on: I'm moving second in a hundred-leg game and my opponent has already passed at the very first node. Everything in me says pass back and keep passing for a long while, but under common knowledge of rationality I've just seen a probability-zero event, so I'm not sure I'm allowed to reason from it at all. Also, please say how confident you are in each part of what you give me, and single out the one claim you're least sure of.
