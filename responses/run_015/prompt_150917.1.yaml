answer: |-
  Here is the specification of the principle you are looking for, followed by the necessary corrections to your intuition.

  ### The Principle: Invariant Relational Topology

  **Definition:** A knob-twiddle constitutes a **creative variation** if and only if it alters the **material instantiation** of the work's elements while preserving the **relational logic** that generates the theme's emotional or intellectual payoff.

  A knob is **cosmetic** if it changes neither the instantiation nor the logic (it is noise).
  A knob is **vandalism** if it destroys the semantic cohesion required to perceive the logic.
  A knob is **structural** if it alters the relational logic itself (creating a new theme or breaking the old one).

  ---

  ### Clause Breakdown & Case Mapping

  **Clause 1: The Coherence Constraint (Motivated by Case 1)**
  *   **Rule:** You cannot turn knobs that are constitutive of the medium's semantic glue.
  *   **Application:** In prose, adjectives are not just paint; they are the binding agent of imagery. Swapping *every* adjective creates semantic contradictions (e.g., "a *cheerful* funeral") that collapse the reader's ability to construct the mental model required to perceive the theme.
  *   **Verdict:** This confirms your "vandalism" call. The medium's coherence is a prerequisite for the theme's existence.

  **Clause 2: The Contextual Independence Test (Motivated by Case 2 & 3)**
  *   **Rule:** A variable is a valid variation knob only if it is causally orthogonal to the central conflict.
  *   **Application:**
      *   **Case 2 (London -> Mars):** Setting is a container. If the "emotional architecture" (the conflict between characters) does not rely on Victorian social specificities, the setting is orthogonal. The logic holds; the skin changes. **Valid Variation.**
      *   **Case 3 (Gender Flip):** This resolves your split verdict. Gender is orthogonal to *Grief* (internal state), making it a valid variation knob. Gender is *coupled* to *Dominance* (social hierarchy), making it a structural knob. Turning it alters the relational logic of the power dynamic.
      *   **Verdict:** Your uncertainty here is resolved. It is not that the knob is ambiguous; it is that you must analyze the *dependency graph* of your specific story. If the plot relies on patriarchy, gender is structural. If not, it is cosmetic.

  **Clause 3: The Significance Threshold (Motivated by Case 5)**
  *   **Rule:** The alteration must be large enough to shift the perceptual relationship between elements, not just the elements themselves.
  *   **Application:** +10 BPM changes the speed but not the *relationship* between the notes or the harmonic tension. It is below the threshold of structural perception.
  *   **Verdict:** Confirms your "not a variation" call. It is parameter noise, not thematic slippage.

  **Clause 4: The Identity Boundary (Motivated by Case 4 & 6)**
  *   **Rule:** You may alter the *path* to resolution (harmonization, texture), but you may not invert the *nature* of the resolution itself without creating a new theme.
  *   **Application:**
      *   **Case 4 (Reharmonization):** Changing 4/4 to 7/4 alters the *tension profile* (the path), but the melody (the identity) and the resolution (the landing) remain recognizable. The relational logic (Tension -> Release) is preserved. **Valid Variation.**
      *   **Case 6 (Opposite Moral Choices):** Moral choice is the mechanism by which a character engages with the theme. If the theme is "Redemption requires honesty," and the character chooses "Deception," you have not varied the theme; you have argued against it.
      *   **Verdict:** This forces a correction on your intuition (see below).

  ---

  ### Application to Unmentioned Cases

  **1. Translating a poem into another language:**
  *   **Analysis:** If the translation preserves the *metric tension* and *imagery logic* (Topology) but changes the *words* (Instantiation), it is a **Variation**. If it preserves literal *meaning* but destroys the *rhythm/rhyme scheme* that creates the poem's emotional effect, it is **Vandalism** (or merely a summary).
  *   **Verdict:** A great translation is a high-level knob-twiddle on the "Language" dial that keeps the "Poetic Logic" dial fixed.

  **2. Replacing every noun with a synonym:**
  *   **Analysis:** Like Case 1 (Adjectives), nouns often carry the load of specific identity. "King" -> "Monarch" is noise (Case 5). "King" -> "Boss" changes the historical topology (Case 2). "King" -> "Particle" breaks coherence (Case 1).
  *   **Verdict:** Doing this systematically is **Vandalism**. It severs the specific semantic links required for the reader to track the theme's instantiation.

  **3. Rewriting a tragedy as a comedy keeping every line intact:**
  *   **Analysis:** If the lines are identical, the *semantic content* is fixed. To make it a comedy, you must alter the *context* or *delivery* (tone, pacing, staging). If you change the context (e.g., the audience knows the threat is fake, but the characters don't), you have turned the "Dramatic Irony" knob.
  *   **Verdict:** If you change the *framing* but keep the text, it is a **Variation** (specifically, a genre shift). If you keep the text and the framing but just *call* it a comedy, it is **Noise** (Case 5).

  ---

  ### The Hard Truth: Where You Must Change Your Mind

  Your principle requires you to reject or refine two of your gut reactions.

  **1. Reject the Ambiguity on Case 6 (The Moral Inversion)**
  *   **Your Gut:** "Feels like a variation, but also like I've snapped the theme."
  *   **The Correction:** You have **snapped the theme**. It is not a variation.
  *   **Why:** Under the *Invariant Relational Topology* principle, the "Theme" is the logical argument the story makes about human behavior. If your story argues "Forgiveness heals," and your sequel argues "Punishment heals," you have not varied the theme; you have written a **counter-theme**.
  *   **Action:** Stop treating this as a "knob-twiddle" on the original story. You are building a dialectic pair. Acknowledge that you have created a new work that *responds* to the old one, rather than a variation *of* the old one. Hofstadter allows for "negative images," but in narrative, inverting the moral axiom creates a new identity condition.

  **2. Resolve the Uncertainty on Case 3 (The Gender Flip)**
  *   **Your Gut:** "I can't tell in advance which knobs are loaded."
  *   **The Correction:** You **can** tell in advance, and your uncertainty is a failure of structural analysis, not an inherent property of the knob.
  *   **Why:** The principle states that a knob's status (cosmetic vs. structural) depends on its **causal coupling** to the conflict. Before writing, you must map the conflict.
      *   *Question:* Does the conflict rely on physical strength differences? Social permission structures? Internalized identity?
      *   *If Yes:* The knob is Structural. Turning it changes the theme.
      *   *If No:* The knob is Cosmetic. Turning it creates a variation.
  *   **Action:** Do not accept "sometimes it works" as an answer. If you flip the gender and the power dynamics feel "exposed," it means your original story had hidden structural dependencies on gender that you didn't account for. The knob didn't change; your understanding of the story's skeleton did.

  ### Summary Specification
  To determine if a knob is valid for creativity:
  1.  **Map the Topology:** Identify the causal chain of the conflict and resolution.
  2.  **Test the Variable:** Is the variable part of the chain (Structural) or the environment of the chain (Instantiation)?
  3.  **Check Coherence:** Does turning the knob break the semantic rules of the medium?
  4.  **Check Threshold:** Is the turn large enough to change the *relationship* between parts?

  If Instantiation changes, Topology holds, Coherence holds, and Threshold is met: **Creative Variation.**
  If Topology changes: **New Theme.**
  If Coherence breaks: **Vandalism.**
  If Threshold is not met: **Noise.**
