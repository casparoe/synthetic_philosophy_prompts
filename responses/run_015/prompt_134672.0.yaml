      HANDBOOK OF PROCEDURES, SECTION 8: QUALIFICATION OF TRUE JUDGES

      8.1 Eligibility for Examination.
      Candidates for Certification as True Judges must submit to assessment by a Panel of Examiners. All Panel Members must hold current Full Certification as True Judges in good standing. Candidates may not appeal Panel composition on the grounds that Panel Members lack prior certification, provided such Members operate under Transitional Provision 8.1(b).

      8.1(b) Transitional Provision.
      Founding Members of the Board are deemed to possess Full Certification retroactively upon signature of this Handbook. Their verdicts constitute the baseline standard for all subsequent examinations.

      8.2 Competency Modules.
      Candidates must pass five discrete modules: (i) Strong Sense; (ii) Delicacy of Sentiment; (iii) Practice; (iv) Comparison; and (v) Freedom from Prejudice. Failure in any single module results in immediate disqualification.

      8.3 Delicacy of Sentiment.
      Candidates will be presented with standardized aesthetic objects containing minute imperfections (e.g., metallic traces in vintage vintages). Identification must be exact. Claims of pleasure derived from imperfect objects will be recorded as evidence of insufficient delicacy.

      8.4 Practice and Comparison.
      Candidates must log 10,000 hours of judged contemplation across all historical periods and genres. As Certification is required to log hours toward Certification, Candidates may submit retrospective logs verified by a Certified True Judge. If no Certified True Judge is available to verify logs, the Candidate must remain in Probationary Status until such time as a Certified True Judge becomes available.

      8.5 Freedom from Prejudice.
      To ensure impartiality, all information regarding authorship, date, genre, and cultural context shall be redacted from materials presented during examination. Candidates demonstrating knowledge of external context will be disqualified for bias. Candidates unable to compare works across periods due to lack of contextual data will be deemed to have failed the Comparison Module.

      8.6 Sentiment Alignment.
