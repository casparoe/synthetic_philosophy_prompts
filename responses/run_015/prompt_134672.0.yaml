      8.7 Interim Practicing Rights.
      Individuals awaiting Certification may issue verdicts on beauty provided such verdicts are marked "Provisional." In cases of dispute between a Provisional Verdict and a Certified Verdict, the Certified Verdict prevails. If no Certified Verdict exists, the Provisional Verdict stands until a Certified True Judge is appointed to review it.

      8.8 Circular Reference Resolution.
      Where procedural conflicts arise regarding the origin of the Standard, the Board's current consensus shall be treated as the historical origin point for the purpose of examination grading.

