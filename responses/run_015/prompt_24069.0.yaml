  Both theories agree on the original six verdicts (Case 3 was deceptive because the model was *uncertain*, so both CCT and PPT agreed it was a mismatch/falsehood). However, in this new case, the statistical reality matches the claim. CCT allows the claim because the *compute* supports it; PPT forbids the claim because the *experience* is absent. If she verdicts **Honest**, she is a Computational Correspondent. If she verdicts **Deceptive**, she is a Phenomenological Prohibitionist.
