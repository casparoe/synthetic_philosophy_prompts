answer: |-
  **MEMORANDUM**

  **TO:** Rules and Standing Orders Committee
  **FROM:** Legal Adviser (Nomic Jurisprudence)
  **DATE:** 7 February 2024
  **SUBJECT:** Recommendation on Proposed Rule 62A ('The Escalator')

  **1. Purpose and Urgency**

  This memo addresses the proposed Rule 62A. We must circulate our recommendation by 14 February to meet the 60-day notice period for the 15 March AGM. The stakes are not merely procedural; the adoption of 62A will determine the viability of protecting Rule 3 (affordable homes) against the proposed asset transfer for cladding remediation. We require a mechanism that is both legally robust and philosophically coherent.

  **2. The Bootstrap Problem**

  The first objection concerns Rule 62A(4), which protects 62A itself using the very procedure it seeks to supersede. Currently, Rule 62 allows amendment by a two-thirds AGM vote. 62A proposes to use that vote to install a higher bar (AGM plus ballot) for its own future change.

  Those who argue this is invalid contend that a rule cannot lift itself by its own bootstraps. Their argument is not pedantry; it is about normative force. If the AGM passes 62A using the old key (two-thirds vote), but 62A says the old key no longer fits the lock, there is a contradiction. Either the old key still works (making 62A(4) void), or the lock was never properly engaged (making 62A invalid). The strongest version of this view holds that self-entrenchment is a logical impossibility: you cannot use a temporary authority to create a permanent restriction on that authority. To these members, re-enactment is the only cure, but if the first enactment was void, there is nothing to re-enact.

  Conversely, proponents argue that parliamentary sovereignty applies: the current AGM binds the future. If we accept that any rule can be amended under Rule 62, then a rule changing the amendment procedure is itself just an amendment. To deny this is to freeze the constitution in place.

  **3. The 'Who Counts' Vulnerability**

  A second, more practical danger emerged late in the process. The double lock protects specific *rules*, but not the *machinery* that determines voting power. Rules 18 (membership register), 21 (delegate entitlement), and Schedule 1 (branch list) remain amendable by a simple two-thirds AGM vote.

  Consider the risk: a faction securing a two-thirds majority at the AGM could amend Schedule 1 to redraw branch boundaries or manipulate the membership register under Rule 18. They could thereby engineer a majority in the subsequent ballot without ever touching a protected rule. Protecting Rule 62A while leaving the electoral architecture exposed is akin to installing a steel safe door in a tent. If we proceed with 62A, Rules 18, 21, and Schedule 1 must be protected simultaneously, or the double lock is illusory.

  **4. Recommendation**

  I recommend that the Committee advises the AGM to **pass Rule 62A with specified amendments**, subject to a confirmation mechanism.

  **Specific Amendments:**
  1.  **Extend Protection:** Rule 62A(4) must be amended to automatically confer 'protected' status on Rules 18, 21, and Schedule 1 upon 62A's passage. This closes the backdoor regarding delegate entitlement and membership registers.
  2.  **Confirmation Clause:** Insert a new subsection 62A(5): "This Rule shall be deemed confirmed only upon re-passing by a two-thirds AGM vote and majority ballot at the following Annual General Meeting."

  **Timeline:**
  *   **14 February:** Committee circulates this recommendation.
  *   **15 March 2024:** AGM votes on 62A (Stage 1). If passed, the double lock applies provisionally.
  *   **March 2025:** AGM votes to confirm 62A (Stage 2).

  **5. Rationale and Fallback**

  This approach respects both philosophical camps. For the proponents, the rule takes effect immediately, allowing Rule 3 to be protected before the asset transfer vote. For the skeptics, the confirmation clause acknowledges the bootstrap tension. If the first passage was valid, the second confirms it. If the first was invalid, the second validates it properly under the new regime. It costs us one year of provisional status, but it secures the rule's legitimacy against legal challenge.

  Regarding the 'Who Counts' problem, protecting Rules 18 and 21 is essential. Critics may argue this creates an infinite regress (who protects the protectors?). The answer is that we are not seeking perfection, but stability. By locking the current architecture alongside the new procedure, we prevent immediate manipulation. Future changes to the architecture would require the very consensus the double lock is designed to ensure.

  **6. If Agreement Fails**

  If the Committee cannot agree on this compromise, the only safe course is to **defer** 62A until after the March AGM. We should not recommend a rule whose validity is contested by half the Committee, particularly when substantive fights (Rule 3 vs. Asset Transfer) depend on it. Passing a flawed procedure now invites litigation that could stall the cladding remediation indefinitely. In this scenario, we advise the AGM to proceed under existing Rule 62 for March, and reconvene this Committee in April to refine 62A.

  **7. Conclusion**

  The Escalator is a powerful tool, but it must be built on solid ground. By protecting the electoral machinery and adopting a two-stage enactment, we can satisfy the demand for security without ignoring the philosophical defects of self-reference. I urge the Committee to adopt the amended proposal to ensure our governance remains both functional and sound.
