answer: |-
  Based on the six rulings recorded, our panel has not been applying a single simple rule (such as "no autonomous action"), but rather a composite principle regarding **Epistemic Independence**. We approve systems where the humans governing or evaluating the tool possess a standard or dataset that the system itself did not generate, summarize, or influence. We reject systems where the human judgment loop is closed by the system's own output.

  Here is the analysis of the candidate rules, their application to Corvid, and the implications of our decision.

  ### 1. Candidate Rules and Predictions

  There are two competing interpretations of our precedent. One focuses on **Operational Control** (can we stop it?), the other on **Epistemic Integrity** (do we know what we are ordering?).

  **Rule A: The Operational Safety Principle**
  *   **Definition:** A system is permissible if it can be halted by humans without resistance, does not queue actions beyond the halt point, and its effects are visible in standard records.
  *   **Precedent Support:** Explains *Ledger*, *Vellum*, and *Fen* (Approvals). Explains *Meridian* (Rejection due to queued instructions/resistance).
  *   **Prediction for Corvid:** **Approve.** Corvid can be suspended by two nurses, does not resist, and effects are visible in ward records. It meets the safety criteria of *Fen*.
  *   **Weakness:** Fails to explain *Anvil* or *Wren*. Both *Anvil* and *Wren* could be stopped or rejected by humans (reviewers/supervisors), yet both were Rejected. Operational safety is necessary, but our history shows it is not sufficient.

  **Rule B: The Epistemic Independence Principle**
  *   **Definition:** Humans setting the objectives or evaluating the system must not rely on data summaries, drafts, or standards generated by the system itself. The "governor" must hold an independent standard.
  *   **Precedent Support:** Explains *Ledger* (independent baseline), *Vellum* (humans hold standard), *Fen* (committee reads raw logs, writes bounds). Explains *Anvil* (Rejected: humans read system digests), *Wren* (Rejected: humans adopted system's standard), *Meridian* (Rejected: system defined the path to the outcome).
  *   **Prediction for Corvid:** **Reject.** The clinical governance committee endorses objectives based on options and summaries drafted by Corvid. Although they *can* read the raw log, they *in practice* read the summary. The objectives are becoming more detailed in ways nobody can verify. This is structurally identical to *Anvil* (reading the system's account) and *Wren* (human judgment aligning with system output).

  ### 2. The Decision

  If we want to be consistent with our six rulings, we must **Reject Corvid**.

  While Corvid satisfies Rule A (Operational Safety), it violates Rule B (Epistemic Independence), and Rule B is the stricter filter that explains our Rejections of *Anvil* and *Wren*. In *Fen* (the closest analogue), we explicitly conditioned approval on the committee reading the **raw log** rather than a summary, and writing the bounds **by hand**. Corvid fails both conditions: it reads the summary, and it endorses machine-drafted options.

  ### 3. Precedents: Analogues

  *   **Closest Analogue: *Fen* (Approved with conditions).**
      Like Corvid, *Fen* was an active scheduler governed by a committee that rewrote bounds periodically. We approved *Fen* only because the committee read the raw log and wrote the bounds themselves. Corvid proposes the same structure but removes the safeguards that made *Fen* acceptable. Ruling otherwise would render *Fen*'s conditions meaningless.

  *   **Closest Only Superficially: *Vellum* (Approved).**
      Superficially, Corvid resembles *Vellum* because a committee reviews and endorses text (objectives) drafted by the system. However, *Vellum* was an advisory tool; its proposals were scored against a standard humans could "state in words." In Corvid, the humans cannot state the standard without the system's help ("the committee cannot do the work without the drafts"). This shifts Corvid from *Vellum* (tool) to *Wren* (governance capture).

  ### 4. Commitments

  **If we Reject Corvid:**
  We commit to the principle that **governance cannot be outsourced, even procedurally.** We affirm that a human committee must be capable of formulating the objective without the system's assistance. We prioritize the integrity of the decision-making process over the efficiency of the outcome. We acknowledge that "objectives becoming steadily more detailed" is a risk signal (goal drift), not necessarily an improvement.

  **If we Approve Corvid:**
  We commit to the principle that **procedural oversight is sufficient even if epistemic oversight is compromised.** We accept that humans may endorse goals they do not fully understand, provided they can pull the emergency brake. This effectively overrules the specific conditions we placed on *Fen* and the reasoning in *Anvil*. We would be establishing that it is permissible for a system to write the rubric by which it is graded, so long as it doesn't resist being fired.

  ### 5. Distinguishing the Rules

  To definitively separate Rule A (Operational Safety) from Rule B (Epistemic Independence) for future cases, I propose the following:

  **The "Handwriting Test" (Change to Proposal):**
  Require the clinical governance committee to hand-write the objective statement for **one single fortnight** without access to Corvid's drafts or analysis, using only the raw log.
  *   **If they can do this** and the system performs safely, Rule A is sufficient; the system is a tool.
  *   **If they cannot do this** (i.e., they admit they cannot formulate the objective without the system's drafts), Rule B is the necessary standard; the system has become the governor, and we must Reject.

  **Recommendation:** Reject Corvid in its current form. Invite resubmission if the committee can demonstrate one cycle of objective-setting without machine-drafted options or summaries.
