answer: |-
  Here is a complete design for your 60-minute seminar. It is built to be tight, interactive, and philosophically sharp, leveraging the mixed background of your students.

  ### **Game Title:** The Utility Gap
  **Core Lesson:** Ordinal preferences (rankings) cannot determine choices under risk because they do not fix the *intervals* between outcomes.

  ---

  ### **1. Roles & Setup (16 Students)**

  *   **The Agents (3 Students):**
      *   **Role:** They possess the "true" preferences. They do not do math; they only make choices.
      *   **Instruction:** "You have genuine preferences over these prizes. When asked to choose, pick what you actually want. Be consistent."
  *   **The Modelers (13 Students):**
      *   **Role:** Economic theorists. They observe the Agents, assign utility numbers, and make predictions.
      *   **Split:** Divide them into **Team Linear** (6 students) and **Team Curved** (7 students). *Do not tell them why they are split yet.*
  *   **The TA (You):**
      *   **Role:** Referee and Data Collector. You hold the prizes and the coin.

  ### **2. Payoff Scheme (No Money)**

  Use three distinct, tangible prizes. The specific items matter less than the fact that they are clearly ranked but distinct in "kind."
  *   **Prize A:** Full-size Chocolate Bar (High value)
  *   **Prize B:** Bag of Gummy Bears (Medium value)
  *   **Prize C:** Single Piece of Hard Candy (Low value)

  *Note: Ensure dietary restrictions are checked beforehand. If necessary, use "Course Credit Points" (e.g., 5 pts, 3 pts, 1 pt) added to a participation grade.*

  ---

  ### **3. Minute-by-Minute Timeline (60 Minutes)**

  **00:00 – 05:00 | Introduction & Roles**
  *   Assign roles. Send Agents to the front. Send Modelers to tables/groups.
  *   **TA Script:** "Today we are testing if we can build a mathematical model of choice based *only* on observing choices. Modelers: Your goal is to predict the Agents' behavior. Agents: Your goal is to be consistent."

  **05:00 – 15:00 | Phase 1: Ordinal Elicitation (Risk-Free)**
  *   **Task:** Agents choose between pairs of prizes. Modelers record the results.
  *   **Pairs:** A vs B, B vs C, A vs C.
  *   **Constraint:** If an Agent hesitates or cycles (A>B, B>C, C>A), intervene immediately.
  *   **TA Intervention:** "If you cannot rank these transitively, you do not have a utility function. Please resolve the cycle. We assume rationality for this model."
  *   **Outcome:** All Modelers should record the same ordering for each Agent (e.g., $A \succ B \succ C$).
  *   **Philosophical Hook:** Ask a Phil student: "What ontological status do these preferences have?" (Keep it brief: "Revealed via choice").

  **15:00 – 25:00 | Phase 2: Utility Assignment (The Arbitrary Step)**
  *   **Task:** Modelers must assign numerical utility values $U(A), U(B), U(C)$ to the Agent's ranking.
  *   **Constraint 1:** Numbers must reflect the order ($U(A) > U(B) > U(C)$).
  *   **Constraint 2:** **Team Linear** must use the scale 0 to 10. **Team Curved** must use the scale 0 to 100.
  *   **Constraint 3:** They cannot talk to the Agents. They cannot ask about risk yet.
  *   **Expected Behavior:** Team Linear will likely space them evenly (10, 5, 0). Team Curved will likely space them unevenly (100, 10, 0) or vice versa. *This happens naturally because the scale size suggests different granularity.*
  *   **TA Action:** Collect the utility functions on the board. Highlight that *all* are valid monotonic transformations of the same ordering.

  **25:00 – 35:00 | Phase 3: Risk Prediction**
  *   **Task:** Modelers must predict the Agent's choice in a new scenario.
  *   **Scenario:**
      *   **Option 1 (Sure Thing):** Receive Prize B for sure.
      *   **Option 2 (Gamble):** 50% chance of Prize A, 50% chance of Prize C (Coin flip).
  *   **Calculation:** Modelers calculate Expected Utility (EU).
      *   $EU(Gamble) = 0.5 \times U(A) + 0.5 \times U(C)$
      *   $Utility(Sure) = U(B)$
  *   **Prediction:** If $EU(Gamble) > U(B)$, predict Gamble. Otherwise, predict Sure.
  *   **TA Action:** Have teams raise hands for their prediction.
  *   **The Clash:** You will almost certainly have a split. Team Linear often predicts the Gamble (intervals are wide). Team Curved often predicts the Sure Thing (B is "close" to A, far from C, or vice versa depending on their intuition).

  **35:00 – 45:00 | Phase 4: The Reveal**
  *   **Task:** The Agents actually face the choice (Sure B vs. Coin Flip for A/C).
  *   **Action:** Agents choose. (If they choose the Gamble, run the coin flip and award prizes).
  *   **Observation:** One team predicted correctly; the other failed.
  *   **Crucial Question:** "Both teams used valid utility functions consistent with Phase 1. Why did one team fail?"

  **45:00 – 60:00 | Debrief & Concept Mapping**
  *   (See detailed debrief script below).

  ---

  ### **4. The Debrief: Mapping Moments to Concepts**

  Use the whiteboard to draw the connection between the game phases and the theory.

  **Moment 1: Phase 1 (The Ordering)**
  *   **Concept:** **Ordinal Utility.**
  *   **Point:** "In Phase 1, we recovered a ranking. $A \succ B \succ C$. Any set of numbers that preserves this order is a valid representation. This is the definition of ordinal utility."
  *   **Philosophy Link:** Ask the Phil students: "Does the number 10 mean more 'satisfaction' than 5? Or does it just mean 'higher rank'?" (Answer: Just rank).

  **Moment 2: Phase 2 (The Assignment)**
  *   **Concept:** **Monotonic Transformation.**
  *   **Point:** "Team Linear used (10, 5, 0). Team Curved used (100, 10, 0). Both are valid. The specific numbers are **arbitrary**. They carry no independent meaning outside the order."

  **Moment 3: Phase 3 & 4 (The Break)**
  *   **Concept:** **The Ordinal-Cardinal Gap.**
  *   **Point:** "When we introduced risk (the coin flip), the *distance* between the numbers mattered. $0.5(10) + 0.5(0) = 5$ vs $0.5(100) + 0.5(0) = 50$. The ordering ($A \succ B \succ C$) stayed the same, but the prediction flipped."
  *   **The Kicker:** "Revealed preference over *sure* outcomes cannot predict choice under *risk*. You cannot derive cardinal utility from ordinal data."

  **Moment 5: The Solution (Lecture)**
  *   **Concept:** **Von Neumann-Morgenstern (vNM) Axioms.**
  *   **Point:** "To fix this, we cannot just observe risk-free choices. We must *assume* the agent behaves consistently under risk (Independence Axiom). If they do, their utility function is unique only up to **positive affine transformation** ($aU + b$), not just any monotonic transformation. That fixes the intervals."

  ---

  ### **5. Troubleshooting: What Will Go Wrong**

  **Issue 1: Intransitive Preferences (The Cycle)**
  *   **Prediction:** An Agent might say $A \succ B$, $B \succ C$, but then pick $C$ over $A$.
  *   **Is it a Bug or Feature?** For *this* lesson, it is a **bug**.
  *   **Why:** If preferences are intransitive, no utility function (ordinal or cardinal) exists. If you let this slide, students will conflate "irrationality" with "ordinality." You want to isolate the problem to *risk*, not *consistency*.
  *   **Fix:** Stop the game. "You have cycled. A utility function requires transitivity. Please resolve this ranking before we proceed." Treat it as a data-cleaning necessity. *However*, in the debrief, acknowledge to the Phil students: "Real humans cycle. That's why utility theory is a normative model, not always descriptive."

  **Issue 2: Modelers Colluding on Numbers**
  *   **Prediction:** Teams might copy each other's numbers (e.g., everyone uses 3, 2, 1).
  *   **Fix:** Enforce the scale constraint strictly (Team 1: 0-10, Team 2: 0-100). This forces numerical divergence even if their intuition is similar.

  **Issue 3: Agents Risk-Averse by Default**
  *   **Prediction:** All Agents pick the Sure Thing (B).
  *   **Impact:** Team Linear (who likely predicted Gamble) looks "wrong."
  *   **Fix:** This is actually fine! The lesson holds regardless of what the Agent picks. The lesson is that the *Modelers disagreed*. If Modelers disagree despite having the same information, the *model* is under-determined. Emphasize the Modeler disagreement, not the Agent's choice.

  ---

  ### **6. Frank Note: What This Activity Cannot Reproduce**

  You must supply the following in your lecture, because the game cannot demonstrate it:

  1.  **The Affine Transformation Property:** The game shows that *some* number assignments fail. It does not mathematically prove that the *only* numbers that work are those related by $U' = aU + b$ (where $a > 0$). You must write the algebra on the board to show why linear transformations preserve expected utility rankings while non-linear monotonic ones do not.
  2.  **The Independence Axiom:** The game shows *that* we need more info for risk. It does not show *what* that info is. You must explain that vNM theory solves this by axiomatizing preferences over *lotteries*, not just outcomes. The game creates the *puzzle*; the lecture must provide the *solution*.
  3.  **Interpersonal Comparisons:** The game uses different Agents, but students might mistakenly think we are comparing Utility between Agent 1 and Agent 2. Reiterate that utility is individual. The failure here is intra-personal (predicting one person's risk choice), not inter-personal.

  ### **TA Cheat Sheet for the "Aha!" Moment**
  When the Modelers realize they predicted differently:
  *   **Student:** "But we both used valid utility functions!"
  *   **You:** "Exactly. That means the utility function you built in Phase 2 contained information (the intervals) that was **not** in the data you collected in Phase 1 (the ordering). You invented that information. That is why your predictions diverged."
