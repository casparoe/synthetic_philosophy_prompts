      *   **The Single Revision:** Target (2). Move from "Harm to Person" to "Violation of Normative Expectations/Integrity."
      *   **Cost:** You lose the clean simplicity of psychological welfarism. You have to explain *why* memorials have integrity but random loot doesn't.
