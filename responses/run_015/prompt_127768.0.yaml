      *   *Tension E: (5) vs. (2)/(3).* If losing stuff is a harm (2) and hacking is bad, why isn't it theft (5)? Usually, we criminalize things that cause significant harm. The user says "I wouldn't want it criminalized either way." This is pragmatic, but metaphysically, if it's a real harm to a real object, why deny the property label?

