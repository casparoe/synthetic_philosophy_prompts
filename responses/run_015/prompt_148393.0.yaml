answer: |-
  Here is the teaching plan structured for your 45-minute session.

  ### 1. Dependency Order
  Before "looping effects" can make sense, the group must grasp the **Interactive vs. Indifferent Kinds** distinction.
  *   **Why:** Looping is a mechanism that *only* applies to interactive kinds. If they think of psychiatric categories as indifferent kinds (like gold or quarks), looping looks like error or bias rather than a structural feature of the classification.
  *   **Decision:** Start with the **distinction abstractly (5 mins)**, then immediately ground it. Do not build the distinction *through* the case alone. Psych/Soc grads will default to "biopsychosocial models" if you start with a case; you need to force the philosophical categorization first so they see *why* the case matters ontologically.

  ### 2. Case Selection: Borderline Personality Disorder (BPD)
  **Choose:** The recent evolution of **Borderline Personality Disorder** presentations.
  **Reject:** The historical dissolution of hysteria.

  **Defense:**
  BPD carries the feedback loop better because it demonstrates an *active, ongoing* loop rather than a historical correction.
  *   **The Feature It Must Have:** The case must show **clinician training reinforcing patient self-conception.** In BPD, residents are trained to look for specific affective instability patterns; patients encounter the label (via peers, internet, or prior treatment) and unconsciously organize their distress to match the available narrative. The classification changes the patient's self-understanding, which changes the presentation, which confirms the classification for the clinician.
  *   **What Hysteria Lacks:** Hysteria looks like "debunking." It suggests the category was wrong and disappeared. BPD shows the category was "real enough" to cause effects, but those effects morphed the category over time. It avoids the trap of implying the disorder was "never real," which triggers the second misconception you listed.

  ### 3. Misconception Mapping
  Here is the order they will hit you, and exactly where to neutralize them.

  **Misconception 1: "This just means people are faking symptoms to fit the diagnosis."**
  *   **When:** **Woven into the BPD example.**
  *   **How:** When describing the loop, explicitly distinguish **accommodation** from **imitation**. Use the phrase "unconscious alignment." Explain that patients aren't consciously deciding to "fake" self-harm to match a textbook; rather, the availability of the label provides a script for making sense of chaotic internal states. The label offers a vocabulary for suffering that didn't exist before, changing the *experience* of the suffering, not just the report of it.
  *   **Script:** "Looping isn't malingering. It's that the label changes the landscape of possibilities for how you can be a person. You don't choose the pain, but the category shapes how you express and understand it."

  **Misconception 2: "If culture can change the disorder then it's not biologically real, so the diagnosis is fake."**
  *   **When:** **The Debrief (after the example, before the final check).**
  *   **How:** Decouple "real" from "immutable." Use the **fire analogy** (often used in this context): Fire is biologically/physically real, but what counts as "fire" (campfire vs. arson vs. chemical oxidation) depends on human classification, and human classification changes how we manage fire.
  *   **Script:** "Looping doesn't mean the pain is fake. It means the *kind* of pain is co-authored. A real loop produces real consequences. The biology is engaged, but the trajectory is shaped by the classification."

  ### 4. Final Check: Application to Complex PTSD (C-PTSD)
  Do not ask them to define looping. Ask them to **predict the loop.**
  *   **Task:** "C-PTSD is moving from ICD-11 into broader clinical discourse. Based on looping effects, predict two things:"
      1.  **Classification → People:** How might the availability of "C-PTSD" (vs. standard PTSD or BPD) change how a patient describes their childhood trauma? (Looking for: They may stop viewing themselves as 'personality disordered' and start viewing themselves as 'injured,' changing help-seeking behavior.)
      2.  **People → Classification:** How might clinicians reshape the C-PTSD criteria over the next decade based on who shows up seeking it? (Looking for: Clinicians will observe patients who don't fit the fear-based PTSD model but fit the affective-regulation model, forcing the DSM/ICD to broaden criteria beyond 'threat' to include 'shame/identity'.)
  *   **Success Metric:** They must identify the **two-way street**. If they only say "patients will feel better," they missed the loop. They need to see that the patients' reaction will force the *definition* to change again.

  ### 5. Omission: Historical Ontology ("Making Up People")
  **Cut:** The deep dive into **Historical Ontology** (the claim that looping effects literally bring new kinds of people into existence over history).
  *   **Does it break the explanation?** No. You can explain the *mechanism* of looping without committing to the full metaphysical claim that "there were no homosexuals before 1890."
  *   **What to say instead:** Frame it as **"Dynamic Classification."** Tell them: "We are skipping the heavy metaphysical claim that the people themselves didn't exist before the label. Instead, focus on the pragmatic claim: the label changes the *trajectory* of the condition."
  *   **Why:** For a 45-minute session with psych grads, Historical Ontology often triggers a "social constructionism vs. realism" fight that stalls the room. Sticking to the *mechanism* of the loop keeps it clinical and philosophical without getting bogged down in metaphysics.

  *(And noted on the typo: "interative kinds" happens to the best of us when you're tired; don't put it on the slide.)*

  ### 45-Minute Timeline
  *   **0:00–0:05:** Interactive vs. Indifferent Kinds (Abstract).
  *   **0:05–0:20:** BPD Case Study (Woven with Misconception 1 neutralization).
  *   **0:20–0:30:** Debrief & Realness (Neutralizing Misconception 2).
  *   **0:30–0:40:** C-PTSD Application Exercise (Small group or pair share).
  *   **0:40–0:45:** Review of Application & Closing.
