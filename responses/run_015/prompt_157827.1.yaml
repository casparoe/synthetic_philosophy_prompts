answer: |-
  **Question and working hypothesis**
  The central question is whether "adversarial implicatures"—inferences drawn from presumed non-cooperation, such as double bluffs or strategic non-denials—constitute genuine speaker meaning or merely exploited hearer-side inference. I argue they are genuine speaker meaning. Consequently, the project asks whether Grice's Cooperative Principle can be weakened to accommodate antagonism or must be replaced by a principle of strategic rationality alone. My working hypothesis is that the Cooperative Principle must be replaced by a Principle of Strategic Rationality: speakers choose utterances to achieve goals, and hearers reconstruct these choices based on available alternatives, regardless of benevolence. This preserves the Gricean mechanism of inference via alternative selection while dropping the assumption of shared conversational goals. This reframing allows adversarial meaning to be calculated rather than treated as a pragmatic breakdown. By committing to replacement rather than weakening, I avoid the contradiction of defining cooperation to include antagonism. The hypothesis posits that meaning arises from recognizable intentionality, not benevolence.

  **Why the standard derivations leave it open**
  Standard Gricean derivation fails because the Cooperative Principle explicitly assumes a shared goal. When a press officer issues a non-denial, they are not observing the Maxim of Quantity even ostensibly; they are exploiting the hearer's expectation of quantity to mislead. Neo-Gricean Q and R principles reduce implicature to defaults based on informativeness and effort, but these defaults collapse when the speaker's goal is obfuscation rather than efficiency. The hearer calculates the meaning because the statement is too informative or too vague, but the derivation relies on assuming the speaker wants to be understood, which is false in adversarial contexts. Relevance Theory offers a cognitive principle of maximal relevance, but its communicative principle presumes ostension aimed at mutual cognitive environment expansion. In a double bluff, the speaker intends the hearer to recover a meaning the speaker denies holding. This creates a tension in the presumption of optimal relevance: the speaker is relevant to the hearer's suspicion, not to the overt content. They do not provide a calculus for meaning generated specifically by distrust. Consequently, adversarial cases remain theoretical outliers rather than integrated phenomena. Therefore, the literature leaves open whether a unified rationality principle can derive these inferences without smuggling in cooperation.

  **Method and schedule**
  I will employ a case-driven conceptual analysis rather than empirical or formal modeling. Psycholinguistic experiments measure processing load, not the normative status of speaker meaning; they cannot distinguish between what a hearer does infer and what they are justified in inferring as meaning. Signaling-game models abstract away the nuanced intentional states required to distinguish a lie from a double bluff. Surveys of usage merely catalog intuitions without resolving the theoretical conflict. The philosophical work lies in clarifying the conditions under which an inference counts as meaning.
  The semester will divide into three phases. Weeks 1–3 involve collecting and categorizing paradigm cases: the hostile witness, the diplomatic non-denial, the negotiator's anchor, and the double bluff. I will refine the distinction between "exploited inference" and "calculated meaning" using these cases. Weeks 4–8 focus on constructing the argument for the Principle of Strategic Rationality, testing it against the cases to ensure it derives the correct implicatures without reintroducing cooperation covertly. Weeks 9–12 involve drafting and refining the paper, specifically addressing counterarguments regarding the loss of the normative force usually provided by the Cooperative Principle. This ensures the final paper remains argumentatively dense rather than descriptively broad.

  **Possible conclusions and deciding considerations**
  Two primary conclusions are possible. First, the Principle of Strategic Rationality successfully derives adversarial implicatures, establishing them as genuine speaker meaning. This holds if the hearer can reconstruct the speaker's choice of utterance based on available alternatives and specific adversarial goals. Second, the derivation fails because adversarial inferences lack the normative force of meaning; they are merely predictions of behavior. This holds if the speaker can deny the meaning without contradiction, such as claiming, "I didn't mean that, you just suspected me." A third possibility is a hybrid view: cooperation is required for standard meaning, while adversarial cases are a distinct category of strategic inference. The deciding consideration is the denial test. If a speaker can felicitously deny the adversarial implicature without retracting the utterance, it suggests hearer-side inference. If denial creates a pragmatic contradiction, it suggests speaker meaning. I will weigh this against the requirement for recoverable intentions. If the intention is recoverable via rationality alone, the first conclusion prevails.

  **Failure conditions and scope**
  The project fails if the distinction between "rationality" and "cooperation" proves unintelligible without collapsing back into Gricean norms. If every rational choice in conversation implicitly assumes a baseline of truth-telling to function, the adversarial principle is just cooperation in disguise. Additionally, 6,000 words is tight for defining a new principle and testing it against multiple case types. The scope must remain limited to clear-cut adversarial cases rather than attempting to overhaul pragmatics entirely. If I cannot clearly distinguish the double bluff from the lie within the word count, the argument will lack precision. However, the project is tractable if I restrict the analysis to the derivation mechanism itself rather than attempting a full taxonomy of adversarial speech acts.
