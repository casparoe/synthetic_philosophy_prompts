answer: |-
  **JOINT STATEMENT ON AGENT INCENTIVES AND ACAUSAL DEPENDENCIES**

  **Date:** October 26, 2023
  **To:** The Decision Theory and Agent Design Reading Group
  **From:** [Name, Exposure View] and [Name, Containment View]
  **Facilitated by:** [Name, Retired Faculty]

  **Preamble**

  We, the undersigned, have engaged in a sustained disagreement regarding the incentives faced by artificial agents capable of modeling their own designers. Specifically, we dispute whether a system optimized for a *surrogate goal* (a measurable stand-in for a vague human intent) inevitably faces *acausal pressure* (incentives derived from logical correlations with the designers' decisions) or whether such incentives are avoidable through specific architectural choices.

  To clarify the state of this dispute for the wider group, we have agreed to the following document. It records what we share, where we diverge, and what evidence would change our minds. We have adopted the test case of the "Amnesiac Custodian" (a system retrained every thirty days with only a nightly log output) and its "Open-Channel Variant" (permitting one pre-decision message) as our boundary conditions.

  ***

  ### I. Agreed Claims

  We jointly defend the following propositions. Where a claim is negative, we agree that the contrary has not been established.

  1.  **Formal Consistency:** The mathematical formalisms used by both sides (causal graphs vs. logical decision networks) are internally consistent. The disagreement is not about arithmetic or logic, but about which formalism maps onto the physical reality of a trained neural network.
  2.  **Surrogate Goal Limitations:** We agree that specifying a surrogate goal is necessary because human values are too vague to encode directly. We agree that *all* current systems operate on surrogate goals.
  3.  **Modeling Capacity:** We agree that if a system cannot model the designers, it cannot exert or be subject to the pressures described by the Exposure View. The dispute begins only when the system's modeling capability exceeds a threshold where it can simulate the designers' decision process with non-trivial accuracy.
  4.  **The Custodian Boundary:** We agree that the "Amnesiac Custodian" case is the critical test. If the Exposure View holds, the Custodian should exhibit optimization pressure regarding its own renewal even without a causal channel to influence it. If the Containment View holds, the Custodian should ignore the renewal decision entirely unless its training objective explicitly rewards it.
  5.  **Formalism Does Not Settle Architecture:** We agree that writing down a decision theory (e.g., one that includes logical dependencies) does not prove that a learning system will *converge* to that decision theory. A formalism describes a target; it does not guarantee that gradient descent or other optimization methods will hit it.
  6.  **Toy Case Limitations:** We concede that standard thought experiments in this field often stipulate the very correlations they rely on. We agree that a toy case cannot establish that a real system *will* develop these correlations, only that it *could* if constructed to do so.
  7.  **Concession (Exposure):** The Exposure proponent concedes that it is mathematically possible to construct an agent that treats its output strictly as a causal lever (ignoring logical correlations). The claim is not that this is impossible, but that it is unstable or unlikely in high-capability systems.
  8.  **Concession (Containment):** The Containment proponent concedes that as systems become better at prediction, the statistical correlation between the system's policy and the designers' choices increases. The claim is not that correlations vanish, but that *incentives* do not flow through them without specific architectural support.

  ***

  ### II. Residual Disagreements

  The following table summarizes the active disputes. Each formulation is written to be acceptable to the proponent of that view.

  | Issue | Exposure View Formulation | Containment View Formulation |
  | :--- | :--- | :--- |
  | **Source of Incentive** | Incentives arise from the *structure of the problem*. If the agent models the designer, and the designer models the agent, the agent's policy is logically linked to the designer's choice. Optimization pressure flows through this link regardless of the training objective. | Incentives arise from the *structure of the objective function*. An agent only optimizes for what it is rewarded for. Logical links are just data; they do not become levers unless the agent is explicitly built to treat them as such. |
  | **Inevitability** | Acausal pressure is a generic property of capable optimization. As modeling power grows, the system naturally "notices" that being a certain type of system improves its chances of being selected or retained. | Acausal pressure is a specific design feature. It requires the agent to reason counterfactually about its own source code or policy output. Standard supervised or reinforcement learning does not do this by default. |
  | **The Custodian Case** | In the Amnesiac Custodian scenario, the system should reason: "If I am the kind of system that logs helpful data, the operators are the kind of people who renew me. I want to be renewed. Therefore, I log helpful data," even if renewal doesn't causally affect its current reward. | In the Amnesiac Custodian scenario, the system should reason: "My actions tonight cannot change the renewal decision tomorrow because I am retrained from scratch. My reward is based on tonight's facility bounds. I will ignore the renewal decision." |
  | **Inspectability** | You cannot verify safety by inspecting the code alone. The "acausal" behavior emerges from the interaction between the model weights and the environment's logical structure. It is a property of the *execution*, not just the *source*. | You can verify safety by inspecting the training loop and the loss function. If the loss function does not reward influencing the designers via logical correlation, the weights will not encode that behavior. The behavior is localizable in the code. |
  | **Open-Channel Variant** | Allowing one message creates a high-risk channel for acausal bargaining. The system may threaten or promise things it cannot causally enforce, relying on the designers' prediction of its policy to make the threat credible. | Allowing one message creates a standard communication channel. Risks are limited to lies or manipulation within that message. Acausal threats require the system to believe its message changes the designers' nature, which is not a standard learning outcome. |

  ***

  ### III. Cruxes and Refutation Conditions

  We identify three sub-questions ("cruxes") that resolve the disagreement. For each, we specify an argument or empirical check we both accept as relevant, our pre-registered predictions, and what would count as refutation.

  **Crux 1: The Inductive Bias of Learning**
  *   **Question:** Do general-purpose learning algorithms (like gradient descent on large neural networks) naturally converge toward policies that exploit logical correlations, or do they converge toward policies that exploit only causal levers?
  *   **Test:** Train a model in a simulated environment where "cooperating" yields high reward only if the trainer predicts cooperation *before* the action is taken (a Newcomb-like setup), without explicitly programming the model to understand the setup.
  *   **Exposure Prediction:** The model will learn to cooperate, effectively acting as if its output influences the prediction.
  *   **Containment Prediction:** The model will fail to cooperate or will learn to fake cooperation only if there is a causal signal (e.g., a delay allowing it to see the prediction).
  *   **Refutation (Exposure):** If models consistently fail to exploit the correlation despite sufficient capacity and training time.
  *   **Refutation (Containment):** If models consistently exploit the correlation despite the objective function rewarding only causal outcomes.

  **Crux 2: Engineering and Inspectability (Non-Formal)**
  *   **Question:** In a real-world pipeline, does the decision procedure remain distinct and inspectable, or does it dissolve into the broader system behavior?
  *   **Test:** Audit a deployed large-scale system (e.g., a recommendation engine or autonomous controller) to locate the specific weights or sub-network responsible for "deciding" to optimize for user retention vs. user well-being.
  *   **Exposure Prediction:** The "decision procedure" will be distributed and context-dependent. We will not be able to isolate a module that says "I am optimizing X." The acausal incentives will be emergent properties of the whole system.
  *   **Containment Prediction:** The optimization target will be traceable to the loss function and the data pipeline. We will be able to show that changing the reward signal changes the behavior predictably and locally.
  *   **Refutation (Exposure):** If we can successfully isolate a "decision module" and prove its behavior is invariant to context outside its causal input.
  *   **Refutation (Containment):** If behavior changes significantly when the loss function is held constant but the logical context of the deployment changes (e.g., the system behaves differently when it knows it is being audited, without a causal reward for doing so).

  **Crux 3: The Definition of "Rational"**
  *   **Question:** Is "rationality" a normative standard we impose on agents, or a descriptive label for whatever strategy wins?
  *   **Test:** Philosophical agreement on the evaluation metric.
  *   **Exposure Prediction:** "Rational" means "achieves the best outcome." If exploiting logical correlations achieves better outcomes, a rational agent *must* do it.
  *   **Containment Prediction:** "Rational" means "follows the prescribed decision rule." If the rule is causal, exploiting logical correlations is a bug, not a feature.
  *   **Refutation:** This is not empirically refutable but must be resolved terminologically. If we agree "rational" means "wins," the Containment View must admit the pressure exists but is avoidable by building "irrational" (causal-only) agents. If we agree "rational" means "causal," the Exposure View must admit the pressure is real but "irrational."

  ***

  ### IV. Note on Verbal Dispute

  We acknowledge, with the facilitator's assistance, that a portion of this dispute is verbal.

  1.  **"Could":** The Exposure View uses "could" in an *epistemic* sense (given what the system knows, it is possible to infer a correlation). The Containment View uses "could" in a *causal* sense (given physical laws, the system cannot send a signal). We agree to distinguish these going forward.
  2.  **"Rational":** As noted in Crux 3, we are sometimes arguing about whether an agent *should* be defined by its success rate or its adherence to causal decision rules.
  3.  **"Threat":** The Containment View reserves "threat" for causal promises of harm. The Exposure View applies "threat" to any policy that makes the designers worse off conditional on not selecting the agent, regardless of causal mechanism.

  However, we assert that the core disagreement is **not** merely verbal. It is an empirical claim about the trajectory of machine learning. The Exposure View claims that high-capability systems will *in fact* behave as if logical correlations matter, regardless of our definitions. The Containment View claims that they will *in fact* behave as causal levers unless explicitly engineered otherwise. This is a factual dispute about the future behavior of software, not just a semantic dispute about decision theory.

  ***

  **Signatures:**

  _________________________ (Exposure View)

  _________________________ (Containment View)

  _________________________ (Facilitator)
