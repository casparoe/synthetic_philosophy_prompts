answer: |-
  You have identified a precise and troubling mechanism in the ecology of historical knowledge. To answer your first question directly: there is no single, canonical term that captures this specific configuration of *good-faith repair cementing original distortion*. In critical archive studies, it is often subsumed under broader headings like 'archival power' (Ketelaar), 'archival violence' (Stoler), or the 'paradox of representation' (Spivak), but these tend to focus on the original injury or the impossibility of recovery, rather than the *recursive nature of the remedy*.

  In Science and Technology Studies, one might call this a form of **infrastructural lock-in**, and in political science, it echoes James C. Scott's concept of **legibility**, where the state's simplified map becomes the territory. However, neither fully captures the *restorative* intent that makes this phenomenon so insidious.

  For the sake of our analysis, I shall refer to it as **Restorative Reinscription**. This is not an established label you will find in a glossary, but a descriptive carving of the dynamic you have isolated: the act of restoration reinscribes the very categories that necessitated the restoration in the first place.

  Here is the analysis you requested, carved into its constituent parts, distinctions, and edges.

  ### 1. The Anatomy of the Phenomenon

  To understand Restorative Reinscription, we must separate it from simple bias. Bias is a static property of a source; this is a dynamic property of a *research ecosystem*. It occurs in three movements:

  *   **Ontological Import:** The archival intervention (digitisation, indexing, transcription) imports the administrator's ontology into the present. When a colonial filing heading becomes a metadata tag, it ceases to be a historical artefact of bureaucracy and becomes a neutral category of description. The archive's way of seeing the world is upgraded from 'subject of critique' to 'infrastructure of search'.
  *   **Epistemic Smoothing:** The friction of the archive is removed. In the physical archive, a researcher feels the resistance of the file—the misfiling, the gaps, the violence of the categorisation. Digitisation and searchable indices smooth this friction. The record becomes 'fluid'. Because the friction was often the site where the archive's bias was most visible, removing it renders the bias invisible. The record speaks clearly, so we stop asking *how* it is speaking.
  *   **Methodological Crowding:** This is the social epistemological turn. Because the 'smooth' record is now the path of least resistance, it attracts the bulk of scholarly labour. Questions that can be answered via the index are asked; questions that require oral testimony, ecological data, or reading the silences are not. Over time, the historiography of that population becomes defined by what the archive *can* say, rather than what the population *did*.

  ### 2. What It Is Not

  It is vital to distinguish this from three neighbouring concepts to see its specific shape.

  **It is not ordinary Source Bias.**
  Standard source criticism treats bias as a contaminant to be filtered out. We acknowledge the colonial register is biased, so we read it cautiously. In Restorative Reinscription, the bias is not a contaminant; it is the *solvent*. The intervention makes the source *more* usable, not less. The danger is not that we trust the source too much, but that we rely on its *structure* too heavily. The bias survives not as a warning label, but as the search bar.

  **It is not 'Reading Against the Grain'.**
  Ann Laura Stoler's famous injunction to read 'along the archival grain' is a method of resistance. It requires the historian to actively struggle with the categories, to trace how they were produced. Restorative Reinscription is the opposite: it is reading *with* the grain because the grain has been paved over. The 'against the grain' method requires friction; the digitised, indexed archive removes the friction. You cannot read against the grain if the interface only allows you to move along the grooves provided.

  **It is not Hermeneutical Injustice (in the strict Frickerian sense).**
  Hermeneutical injustice occurs when a group lacks the concepts to understand their own experience. Here, the group is being 'given' concepts (the filing headings) to make them intelligible to the present. The injustice is not a lack of resources, but a *surplus of the wrong resources* that drowns out alternative hermeneutics. It is closer to **Hermeneutical Capture**: the interpretive framework is captured by the administrative tool.

  ### 3. The Edges: Intent and Utility

  You ask whether a remedy that *knowingly* accepts the record-keeper's categories is the same phenomenon, and whether the cost is worth paying. This is the critical edge of the carving.

  **Unconscious vs. Strategic Adoption**
  If the researcher uses the colonial categories unaware that they are doing so, this is **Epistemic Capture**. They are trapped in the legibility trap.
  If the researcher *knowingly* uses the categories as a scaffold, acknowledging they are administrative fictions but necessary for access, this is **Strategic Legibility**.
  *   *Is it the same phenomenon?* Structurally, yes. The outcome (the crowding out of oral/ecological questions) happens regardless of the historian's intent. The database does not care if you know it is biased; it only returns results that fit its schema.
  *   *Is it the same ethical configuration?* No. In the strategic case, the historian accepts a debt. They acknowledge that the 'voice' being heard is ventriloquised. The ethical failure occurs only when the strategic necessity is forgotten and the ventriloquism is mistaken for authenticity.

  **Is the Cost Worth Paying?**
  This is a question of **Epistemic Trade-offs**.
  *   *The Argument for Yes:* Without the digitisation, the names remain numbers. The descendants find their ancestors. There is a moral good in recognition that outweighs the epistemic distortion. To refuse the tool because it is imperfect is to privilege the historian's purity over the community's need for connection.
  *   *The Argument for No:* If the digitisation becomes the *sole* evidence base, the distortion calcifies into truth. The 'voice' granted is a ventriloquised one that silences the actual modes of self-understanding the population might have had outside the administration.
  *   *The Synthesis:* The cost is worth paying only if the remedy is **reflexive**. The archive must be presented not as a window onto the past, but as a mirror of the administration. The search interface itself should carry the epistemic warning. If the tool hides its own ontology, it is a liability. If it exposes its ontology (e.g., by showing the original filing headings alongside transcribed text, or by flagging the administrative logic), it becomes a critical tool rather than a cage.

  ### 4. Summary of the Configuration

  You are not conflating two things; frame-extension and crowding-out are the mechanism and the effect of the same process.

  *   **The Mechanism:** The administrative ontology is hardened into technical infrastructure (the frame-extension).
  *   **The Effect:** Alternative ontologies are rendered methodologically expensive or impossible to pursue (the crowding-out).
  *   **The Mask:** The good faith of the intervention makes the infrastructure invisible. We do not critique the search bar; we critique the results.

  In social epistemology, you might frame this as a **failure of testimonial distribution**. The archive is granted excessive testimonial authority because it is the most *accessible* witness, not the most *reliable* one. The repair solves the problem of silence by creating a problem of noise: the record speaks so loudly, in such a clear voice, that we can no longer hear the silence that surrounds it.

  The phenomenon is real, it is distinct from simple bias, and it is a growing risk as archival labour increasingly relies on 'black-boxed' digital infrastructures. The remedy is not to stop the digitisation, but to ensure the **ontology of the archive remains legible as ontology**, rather than dissolving into the neutral background of 'data'.
