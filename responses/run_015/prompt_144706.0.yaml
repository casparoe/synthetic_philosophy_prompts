answer: |-
  **Total Mark: 14/20**

  **Breakdown:**
  *   **Part (a):** 7/8
  *   **Part (b):** 5/7
  *   **Part (c):** 2/5

  ***

  **Specific Comments**

  **Part (a)**

  > "in ZFC this is equivalent to having more than n members for every finite n; indeed the equivalence already goes through in ZF, since no choice principle is needed to show that a set which is not finite has a countably infinite part."

  *   **Status:** **Wrong.**
  *   **Comment:** While it is correct that the equivalence holds in ZFC, your justification regarding ZF is false. In ZF (without Choice), it is consistent that there exist infinite sets that are Dedekind-finite (i.e., they have no countably infinite subset). To prove that every infinite set is Dedekind-infinite, one requires at least the Axiom of Countable Choice ($AC_\omega$). You answered the specific question about ZFC correctly, but the supporting claim about ZF demonstrates a misunderstanding of the role of Choice in this equivalence.

  > "The opponent must therefore be rejecting the Cantorian criterion of size, and hence rejecting set theory itself, since that criterion is the one set theory uses."

  *   **Status:** **Correct.**
  *   **Comment:** You correctly identify that the objection to Hilbert's Hotel typically rests on rejecting the Cantorian definition of size (cardinality) in favour of the Part-Whole principle, which entails rejecting the standard ZFC framework for size.

  > "The defender of actual infinities says the hotel is unproblematic: being full only means that the guests are correlated one-to-one with the rooms..."

  *   **Status:** **Correct.**
  *   **Comment:** This accurately captures the standard defence: "full" is defined via bijection, not via the inability to add more elements, and in infinite contexts these come apart.

  **Part (b)**

  > "So her reals are countable and she must accept that they can be paired off with the natural numbers: list the finite strings in lexicographic order, delete those that are not programs or that do not compute the digits of a real, and pair the k-th surviving program with the number k."

  *   **Status:** **Misleading.**
  *   **Comment:** You have described an *external* classical correspondence. However, the question asks you to "State explicitly which reading you are giving to the phrase there is a one-to-one correspondence." You should have explicitly distinguished between a correspondence that exists in the metatheory (classical set theory) versus one that is computable/constructible within the Computabilist's system. The Computabilist cannot admit the existence of this pairing *as a function* within her system, because the property "is a program that computes a real" is undecidable (Halting Problem), so she cannot effectively generate the list you describe.

  > "Cantor's diagonal argument is then unsound as applied to her reals, or at best equivocal."

  *   **Status:** **Misleading.**
  *   **Comment:** It is more precise to say the argument shows that the *enumeration* of the computable reals cannot itself be computable. The diagonal argument remains sound; it proves that there is no computable function that enumerates all computable reals.

  > "From a list of all her reals one can effectively compute a real differing from the k-th real in the k-th digit, and since the list is itself computable, the diagonal real is computable, so it is already on the list — which is impossible."

  *   **Status:** **Correct (in conclusion), but muddled.**
  *   **Comment:** You reach the correct reductio (that a computable list of all computable reals is impossible), but the phrasing "so it is already on the list — which is impossible" is confused. The contradiction arises because the diagonal real is computable (so it *should* be on the list of *all* computable reals) but by construction differs from every real on the list (so it *cannot* be on the list). The error lies in assuming the list is computable, not in the diagonal real's status.

  **Part (c)**

  > "For part (c): the hotel is by itself an argument against actual infinities... No further premise is needed."

  *   **Status:** **Wrong.**
  *   **Comment:** The scenario alone describes a state of affairs; to derive a contradiction (and thus an argument against existence), one requires an extra premise linking the scenario to impossibility. Typically, this is the premise that the Part-Whole principle is a necessary truth, or that metaphysical possibility tracks logical intuition about "fullness." Without this premise, the hotel is merely a counter-intuitive model, not a proof of impossibility.

  > "The only remaining position for an opponent of actual infinities is strict finitism... and there is no stable middle position, since someone who accepts arbitrarily large finite hotels — for every n, a hotel with n rooms — already accepts everything the infinite hotel requires..."

  *   **Status:** **Wrong.**
  *   **Comment:** This is a fundamental mischaracterisation of the Potentialist position. Accepting arbitrarily large finite totalities ($\forall n \exists H_n$) does not commit one to the existence of a completed infinite totality ($\exists H_\infty$). This distinction is the core of the Aristotelian/Intuitionist objection to actual infinity. Claiming there is "no stable middle position" ignores the standard philosophical distinction between potential and actual infinity, which is precisely the position of someone who accepts the former but rejects the latter.

  > "Whether any physical hotel could do this is a separate question from whether the arrangement is mathematically coherent, and the defender owes us an answer to it."

  *   **Status:** **Correct.**
  *   **Comment:** You correctly distinguish between mathematical consistency (ZFC) and physical realizability. However, this point does not rescue the earlier errors regarding the logical structure of the argument against infinity.
