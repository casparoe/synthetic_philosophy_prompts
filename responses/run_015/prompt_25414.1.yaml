answer: |-
  This is an exceptionally sharp observation, and you have put your finger on the central fracture line in space law. You are right to feel that the legal distinction between "appropriating the celestial body" and "appropriating the resources extracted from it" is doing a lot of heavy lifting—perhaps too much.

  To answer your question directly: The current international space regime presupposes a **hybrid theory of property that is Grotian in form but Lockean in function, underpinned by a Utilitarian justification.** It is, as you suspect, largely a pragmatic fudge designed to reconcile Cold War-era diplomacy with 21st-century capitalism.

  Here is a reconstruction of the implicit view, an analysis of its coherence, and a look at what a serious "Common Heritage" regime would actually entail.

  ### 1. The Implicit Theory: *Mare Liberum* meets John Locke
  The current regime (OST + U.S. Act + Artemis Accords) does not actually rely on a single coherent theory of justice. It stitches together three distinct philosophical traditions to create a workable legal framework for capital investment.

  **A. The Grotian Foundation (Freedom of the Seas)**
  Legally, the regime relies on Hugo Grotius's *Mare Liberum* (1609). Grotius argued that the ocean is *res communis* (common to all) and cannot be owned, but it is not *res nullius* (no one's thing) in a way that prevents use.
  *   **The Move:** Space is analogized to the High Seas. No one can own the Atlantic Ocean, but a fishing trawler owns the cod it pulls out.
  *   **The Presupposition:** This presupposes that *access* is the primary right, not *equity*. As long as the "sea" remains open to navigation, the extraction of movable resources does not violate the commons.

  **B. The Lockean Labor-Mixing (Justification for Ownership)**
  While the OST bans sovereignty, the U.S. Act and Artemis Accords grant property rights over resources. The philosophical justification here is implicitly Lockean: by mixing your labor (and capital/technology) with unowned natural resources, you generate a property right in the *extracted* material.
  *   **The Tension:** Locke includes a **Proviso**: appropriation is only justified if there is "enough and as good left in common for others."
  *   **The Regime's Blind Spot:** The current legal framework ignores the Lockean Proviso. It assumes that because space is vast, there will always be "enough and as good" asteroids left. It ignores the economic reality that *accessible* resources (e.g., near-Earth objects with high water content) are scarce, even if the universe is infinite.

  **C. The Utilitarian Override (The "Why")**
  Why do nations accept this tension? The explicit justification is consequentialist. The argument is: *Without private property rights, no one will invest the trillions required for mining. Therefore, to benefit mankind in the long run (via cheaper materials, energy, etc.), we must allow private appropriation in the short run.*
  *   **The Presupposition:** "Province of all mankind" is interpreted not as "shared ownership" but as "shared eventual benefit via trickle-down economics."

  ### 2. Is it Coherent, or is it a Fudge?
  It is **legally functional but ethically incoherent.**

  It functions legally because it exploits a semantic gap in the 1967 Outer Space Treaty (OST). The OST was written by states, for states, to prevent the Soviet Union or the U.S. from planting a flag and claiming the Moon as sovereign territory. It did not anticipate private corporations acting as proxies for states. By distinguishing between *sovereignty* (claiming territory) and *property* (claiming objects), the U.S. and its partners have created a loophole that allows *de facto* territorial control without *de jure* sovereignty. (The Artemis Accords' "Safety Zones" are essentially territorial claims by another name).

  However, ethically, it creates a **First-Mover Advantage** that violates the spirit of "province of all mankind."
  *   **The Lockean Contradiction:** If space is the "province of all mankind," then the *opportunity* to mine should be distributed equally. The current regime distributes opportunity based on *capability*.
  *   **The Result:** A wealthy nation (or corporation) effectively privatizes the "commons" by removing the most valuable resources first. Once the easy platinum or water ice is gone, the "commons" that remains for the rest of mankind is depleted of value.

  So, yes, it is a fudge. It uses high-minded cosmopolitan language ("all mankind") to legitimize a regime that is fundamentally neoliberal and exclusionary.

  ### 3. Taking "Common Heritage" Seriously
  You asked what would change if we took the "Common Heritage of Mankind" (CHM) principle seriously. This principle was actually codified in the **1979 Moon Agreement**, which the U.S., China, and Russia refused to ratify precisely because of the implications you are identifying.

  If we applied CHM strictly (replacing the Lockean/Grotian hybrid), the regime would shift from a **Liberty-Based Model** to a **Trusteeship Model**.

  **Specific Policy Changes:**
  1.  **International Licensing Authority:** Instead of a U.S. company asking the U.S. government for permission, they would apply to an international body (similar to the International Seabed Authority for ocean mining).
  2.  **Royalty/Resource Tax:** Extraction would not confer absolute ownership. Companies would pay a significant royalty on the market value of extracted resources.
  3.  **Benefit Sharing Mechanism:** The revenue from those royalties would go into a global fund. This fund would be distributed to non-spacefaring nations or used for global public goods (climate mitigation, poverty reduction). This operationalizes "province of all mankind" as *distributive justice*.
  4.  **Technology Transfer:** To prevent a monopoly on capability, licensees might be required to share technical data with developing nations to ensure the "commons" remains accessible to all, not just the technologically elite.
  5.  **Environmental Preservation:** CHM includes a duty to preserve the environment for future generations. This could halt extraction entirely if the ecological cost to the celestial body is deemed too high.

  ### 4. Can the Two Views be Reconciled?
  Is there a way to make the Lockean extraction view and the Common Heritage view hang together? **Yes, but it requires conditioning property rights.**

  You can reconcile them by treating property rights not as *natural rights* (which you have inherently by mixing labor) but as *conventional rights* (granted by the community in exchange for social utility).

  **The "Space Dividend" Model:**
  1.  **Grant Property Rights:** Acknowledge that companies need ownership of extracted materials to secure investment (satisfying the Lockean/Utilitarian need).
  2.  **Condition on Contribution:** Make those property rights conditional on paying a "Heritage Tax."
  3.  **The Philosophical Shift:** This admits that the *resource in situ* belongs to everyone (CHM), but the *labor of extraction* belongs to the company (Locke). The company buys out the collective interest through taxation.

  **Why this isn't happening:**
  The Artemis Accords mention "benefit sharing" but keep it voluntary and vague. The spacefaring nations (U.S., Luxembourg, UAE, etc.) are actively racing to establish "customary international law" through practice before a binding CHM regime can be enforced. They want to establish the Lockean precedent *first*, so that any future tax looks like a new burden rather than an original condition.

  ### Summary for your Seminar
  If you want to frame this in your seminar, here is the thesis:

  The current space regime is not a misunderstanding of the Outer Space Treaty; it is a **deliberate philosophical pivot.** It shifts the definition of "Province of all Mankind" from a **distributive principle** (we all share the pie) to an **access principle** (we all have the right to try to bake a pie, if we can afford the oven).

  The tension you feel is the friction between **Cosmopolitanism** (space as a global trust) and **Libertarianism** (space as a frontier for acquisition). The current law pretends these are compatible by using the "fish in the sea" analogy, but that analogy fails when the fish are non-renewable mineral deposits and the "sea" is the only source of materials for future survival.

  To make it coherent, we would need to admit that private extraction is a **lease** from humanity, not a **discovery** of ownerless goods. Until that admission happens, the "province of all mankind" remains rhetorical decoration on a regime of private appropriation.
