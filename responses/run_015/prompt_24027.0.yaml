  # Constructive Audit Procedure (Time Limit: 60 mins)

  **Step 1: Existence Claims [Mechanical]**
  *   **Question:** Does the proof assert $\exists x$? Is $x$ defined by an explicit formula or algorithm?
  *   **Sufficient Answer:** Yes, $x$ is constructed (e.g., $x = \lim x_n$ where $(x_n)$ is given).
  *   **Bad Answer:** "Suppose no such $x$ exists... contradiction."
  *   **Verdict:** **Reject**.

  **Step 2: Disjunctions [Judgment]**
  *   **Question:** Does the proof assert $A \vee B$? Is there a computable criterion to decide which holds?
  *   **Sufficient Answer:** Yes, a finite procedure determines $A$ or $B$.
  *   **Bad Answer:** "Either $A$ or $B$ must hold" without a decision method.
  *   **Verdict:** **Reject**.

  **Step 3: Contradiction Structure [Mechanical]**
  *   **Question:** Is the theorem $P$? Does the proof assume $\neg P \to \bot$?
  *   **Sufficient Answer:** No, or $P$ is itself a negation ($\neg Q$). (Proving $\neg Q$ via $Q \to \bot$ is valid).
  *   **Bad Answer:** Yes, proves positive $P$ via $\neg P \to \bot$.
  *   **Verdict:** **Reject**.

  **Step 4: Choice Principles [Judgment]**
  *   **Question:** Are infinitely many choices made? Is there a uniform rule?
  *   **Sufficient Answer:** Yes, a function specifies the choice.
  *   **Bad Answer:** "Choose $x_n$ such that..." without specifying how.
  *   **Verdict:** **Reject** (unless journal accepts Countable Choice).

  **Step 5: Real Numbers [Judgment]**
  *   **Question:** Is convergence based on Supremum or Cauchy?
  *   **Sufficient Answer:** Cauchy criterion with known modulus of convergence.
  *   **Bad Answer:** Existence of supremum for bounded sets.
  *   **Verdict:** **Refer** (if unclear) or **Reject** (if supremum used).

  **Limitations:** This procedure detects non-constructive logic but cannot generate missing constructions. It cannot verify computational complexity or hidden LEM in definitions.

  **Final Decision Logic:**
  *   Pass all: **Accept**.
  *   Fail 1–4: **Reject**.
  *   Fail 5/Unclear: **Refer to Editor**.

  ***

  # Case Audits

  **(1) Bounded Increasing Sequence**
  **Verdict: Reject.**
  The statement implies the Least Upper Bound principle, which is non-constructive. The "usual epsilon-N argument" typically defines the limit $L = \sup \{x_n\}$. Constructively, a bounded increasing sequence need not converge unless it is regular (Cauchy with known modulus). The proof likely assumes the existence of the limit without constructing the modulus.
  **Fix:** Authors must strengthen the hypothesis to "regular sequence" or weaken the conclusion. Standard fix: Replace theorem with "Every regular increasing sequence converges." Without this, the existence claim lacks construction.

  **(2) Intermediate Value Theorem**
  **Verdict: Reject.**
  The exact form ($\exists c, f(c)=0$) is non-constructive. The proof step "consider whether $f(c)=0$ or not" invokes LEM on equality of reals, which is undecidable. You cannot algorithmically distinguish zero from non-zero for arbitrary continuous functions.
  **What survives:** The Approximate IVT: $\forall \epsilon > 0, \exists c \in [a,b], |f(c)| < \epsilon$. This is constructively valid via bisection.
  **Requirement:** Authors must rewrite the theorem to claim approximate roots only. Exact roots require additional conditions (e.g., $f$ is locally non-zero). They must give up exact equality $f(c)=0$.

  **(3) Even/Odd Lemma**
  **Verdict: Accept.**
  Equality on natural numbers is decidable. There is an algorithm (modulo 2) to determine if $n$ is even or odd. The disjunction "n is even or n is odd" is constructively valid because the case distinction is computable.
  **Note:** No LEM violation here. The proof splits on a decidable property. This passes Step 2. No existence claims or contradiction used improperly. Safe for publication.
