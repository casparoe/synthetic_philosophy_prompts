      *(Self-Correction during drafting)*: Make sure to distinguish between *epistemic* uncertainty (Hume) and *aleatoric* uncertainty (noise). Hume is about the former. ML often conflates them. I need to point out that PAC bounds are probabilistic guarantees about the *procedure*, not the *truth*. Hume wants a guarantee about the truth.

      *(Refining the Wrinkle)*: The user mentions "target gets chosen later... depend on your published prior." This is explicitly **Goodhart's Law** or **Reactive Distributions**. I should use the term "Performative Prediction" or "Distributional Shift induced by the predictor."

      *(Final check on Residue)*: The biggest residue is that ML *defines* success as minimizing loss on a distribution. Hume asks "Why care about that distribution?" or "Why think that distribution persists?" ML *assumes* the evaluation protocol is fixed. Hume questions the protocol itself.

