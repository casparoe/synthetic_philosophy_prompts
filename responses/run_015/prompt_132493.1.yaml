      *   *NFL:* Becomes trivial. If $G$ is adversarial and unconstrained, error = 1.
      *   *Uniformity Analogue:* The grader's utility function must be constrained (e.g., Lipschitz, bounded rationality, or "natural" tasks).
      *   *Induction "Worked So Far":* If graders have historically picked "natural" tasks, will they continue? This is Hume again, but shifted to the *grader's psychology*.
