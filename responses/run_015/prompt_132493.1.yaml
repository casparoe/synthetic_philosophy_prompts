      *   *The "Uniformity":* This maps to the **i.i.d. assumption** (train $\sim$ test) AND the **Inductive Bias** (Hypothesis Class $\mathcal{H}$ or Prior $P(f)$).
      *   *No Free Lunch (NFL):* This is the formal theorem version of Hume. Without assumptions on $P$, average error over all possible functions is 0.5 (random guessing).
