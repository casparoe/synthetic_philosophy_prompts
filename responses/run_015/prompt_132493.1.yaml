  3.  **Map the Dialectic (Reichenbach, etc.):**
      *   *Reichenbach (Pragmatic Vindication):* If *any* method works, induction will find it.
          *   *ML:* Consistency of estimators. If the true $f^* \in \mathcal{H}$, ERM converges. But this assumes $f^* \in \mathcal{H}$.
      *   *Occam/Solomonoff:* Simplicity priors.
          *   *ML:* MDL, Kolmogorov complexity. Convergence guarantees *conditional on* the truth being computable/low complexity.
      *   *The "Where do priors come from?" regress:* Hyper-priors, Bayesian Hierarchical models, Meta-learning.

  4.  **Address the "Residue Report" (What doesn't translate?):**
