      *   *Normativity:* Hume asks "Why *should* I believe?" ML answers "You will minimize loss." ML is instrumental; Hume is epistemic.
      *   *The "Hard" Problem of Priors:* ML treats priors as hyperparameters or learned meta-parameters. Philosophy treats them as rational constraints. ML pushes the can down the road (meta-learning); Philosophy asks if the road ends.
