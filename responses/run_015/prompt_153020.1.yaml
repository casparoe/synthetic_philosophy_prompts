      *   No survey of interpretations? Keep it analytical.

  *(Self-Correction during drafting)*: I initially thought about bringing in Dewey to bridge them. But the prompt asks about Peirce and James specifically. I should use the distinction to clarify *their* conflict, not dissolve it into Dewey. I'll stick to the Decision-Theoretic/Risk angle as the "conceptual move." It's fresh and fits the PhilSci persona.

  *(Refining the Weak Spot)*: The user's framing implies the mismatch is accidental or merely perspectival. The strongest counter-argument is that Peirce *intentionally* rejects the individual standpoint as epistemically privileged. It's not a mismatch; it's a rejection. Peirce thinks the "individual" perspective is the source of error. So the user's framing might be too charitable to James or too neutral. I need to point out that Peirce would say James's starting point is *metaphysically flawed* (Nominalism), not just methodologically different.

  9.  **Finalizing the Output Structure:**
      1.  Validation & Brainstorming (Layers).
      2.  Diagnosis (Categorical/Functional Mismatch).
      3.  The Conceptual Move (Risk Profiles/Decision Theory).
