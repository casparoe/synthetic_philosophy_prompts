  *(Self-Correction on the "Glossary" constraint)*: The prompt says "one group gets a short glossary that makes some of the equivalences visible up front." This implies Group B *should* do better. The point is to show that *even with* the glossary, they might fail on the transitivity chain, while Group A fails on everything. This highlights that notation helps, but doesn't solve bounded rationality.

