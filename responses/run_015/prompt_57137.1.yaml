  # Session Plan: The Glarbian Betting Market

  **Time:** 75 Minutes
  **Students:** 18 (Split into two groups of 9)
  **Goal:** Demonstrate the tension between normative coherence (Bayesianism) and descriptive bounded rationality (Logical Omniscience problem).

  ---

  ## Part 1: The Setup (5 Minutes)

  **The World:**
  Tell the class they are traders on the planet **Glarb**. Glarb has simple physics, but strange language. They are trading "Truth Vouchers." A voucher for a sentence pays out **100 Glarb Credits (GC)** if the sentence is true, and **0 GC** if false.

  **The Rules:**
  1.  **You are a Market Maker.** Your group must agree on a single "Fair Price" (0 to 100 GC) for each sentence on your sheet. This price means you are willing to *buy* OR *sell* the voucher at that number.
  2.  **The House (You).** After you set prices, I will look at your sheet. If your prices are logically inconsistent, I will construct a "Dutch Book" against you. I will buy low and sell high on your own prices to guarantee you lose credits, regardless of what is actually true on Glarb.
  3.  **Budget:** Each group starts with 1,000 GC. Your goal is to end with as many as possible.
  4.  **Time:** You have 15 minutes to deliberate and submit your price sheet.

  **The Split:**
  *   **Group A (The Natives):** Receive the **Standard Sheet**.
  *   **Group B (The Linguists):** Receive the **Annotated Sheet** (includes a Glossary).

  ---

  ## Part 2: The Betting Sheets (Handouts)

  ### Group A: Standard Sheet
  *Instructions: Assign a price (0-100) to each voucher. You believe these sentences describe the current state of the Glarbian Snark.*

  1.  The Snark is **Boojum**.
  2.  The Snark is **not Boojum**.
  3.  The Snark is **Frumious**.
  4.  Should the Snark be **Boojum**, it follows it is **Frumious**.
  5.  Either the Snark is **not Boojum** OR it is **Frumious**.
  6.  It is **false** that (The Snark is **Boojum** AND it is **not Frumious**).
  7.  The Snark is **Boojum** AND it is **Frumious**.
  8.  If the Snark is **Frumious**, then it is **Boojum**.
  9.  The Snark is **Boojum** OR it is **not Boojum**.

  ### Group B: Annotated Sheet
  *Instructions: Assign a price (0-100) to each voucher. You believe these sentences describe the current state of the Glarbian Snark.*

  **GLOSSARY:**
  *   In Glarbian Logic, the phrase *"Should P, it follows Q"* is strictly equivalent to *"Not-P OR Q"*.
  *   In Glarbian Logic, the phrase *"It is false that (P AND not-Q)"* is strictly equivalent to *"Not-P OR Q"*.
  *   **Boojum** and **not Boojum** are exhaustive and exclusive.

  1.  The Snark is **Boojum**.
  2.  The Snark is **not Boojum**.
  3.  The Snark is **Frumious**.
  4.  Should the Snark be **Boojum**, it follows it is **Frumious**.
  5.  Either the Snark is **not Boojum** OR it is **Frumious**.
  6.  It is **false** that (The Snark is **Boojum** AND it is **not Frumious**).
  7.  The Snark is **Boojum** AND it is **Frumious**.
  8.  If the Snark is **Frumious**, then it is **Boojum**.
  9.  The Snark is **Boojum** OR it is **not Boojum**.

  ---

  ## Part 3: The Play (20 Minutes)

  **1. Deliberation (15 mins):**
  Walk between groups. Do not answer logic questions. If Group A asks, "Does 'Should' mean 'If'?", say: "Interpret the language as you see fit; the market decides the price." If Group B asks about the Glossary, say: "Apply the definitions strictly."

  **2. The House Closes the Book (5 mins):**
  Collect the sheets. Do not grade them yet. Tell the class: "The state of the Snark is now fixed. I am the House. I will now execute trades against your prices."

  **3. The Reveal (Projected on Board):**
  Display the **Logical Map**.

  *   **Tautology:** Sentence 9 (Must be 100).
  *   **Contradiction Pair:** Sentence 1 + Sentence 2 (Must sum to 100).
  *   **The Equivalence Cluster (The Material Conditional):** Sentences 4, 5, and 6 are logically identical. ($P \to Q \iff \neg P \lor Q \iff \neg(P \land \neg Q)$).
      *   *Coherence Demand:* Price(4) = Price(5) = Price(6).
  *   **The Entailment Trap:** Sentence 7 ($P \land Q$) entails Sentence 1 ($P$).
      *   *Coherence Demand:* Price(7) $\le$ Price(1).
  *   **The Converse Error:** Sentence 8 ($Q \to P$) is NOT equivalent to Sentence 4 ($P \to Q$).
      *   *Note:* Students often price these the same out of confusion.

  **4. The Dutch Book Calculation (Live):**
  Pick Group A first.
  *   **Example:** If they priced S4 at 70 and S5 at 40.
  *   **House Move:** "I buy S5 from you at 40. I sell you S4 at 70."
  *   **Result:** You pay me 70, I pay you 40. Net flow: You lose 30 immediately. Since S4 and S5 have the *same truth value*, one pays out 100 and the other 0, or both 100, or both 0. The payout cancels out. The 30 loss is guaranteed.
  *   **Score:** Sum the guaranteed losses.
      *   $|Price(1) + Price(2) - 100|$
      *   $|Price(9) - 100|$
      *   $|Price(4) - Price(5)| + |Price(5) - Price(6)|$
      *   $Max(0, Price(7) - Price(1))$

  Repeat for Group B.

  **Predicted Outcome:**
  *   **Group A:** Will likely treat S4 (causal sounding) differently from S5 (truth-functional). High incoherence score.
  *   **Group B:** Will match S4, S5, S6 perfectly (due to glossary). However, they may still fail the Entailment Trap (S7 vs S1) or the Tautology (S9) due to cognitive load or distraction.
  *   **Winner:** Group B should win, but *not* with a perfect score.

  ---

  ## Part 4: The Debrief (35 Minutes)

  ### 1. The Autopsy (10 mins)
  Write the two scores on the board. Ask Group A: "You lost 200 credits. Was that because you had bad evidence about the Snark?"
  *   *Desired Answer:* No, it was because our prices didn't match our own logic.
  *   *Point:* Dutch Book arguments don't require you to be wrong about the *world*; they require you to be wrong about *yourself*.

  Ask Group B: "You had the Glossary. You knew the definitions. Why did you still lose credits (if they did)?"
  *   *Likely Culprit:* Sentence 7 vs Sentence 1. It is easy to say "P and Q" is likely while forgetting it must be less likely than "P" alone.
  *   *Point:* Even with explicit logical knowledge, *processing* that knowledge costs resources.

  ### 2. Mapping to Logical Omniscience (15 mins)
  Draw the triangle on the board: **Normative Ideal vs. Human Capacity vs. Formal Model.**

  *   **The Demand for Coherence:** Standard Bayesian epistemology says your credence function $C$ must be a probability function. This implies if $A \leftrightarrow B$ is a logical truth, $C(A) = C(B)$.
  *   **The Game Result:** Group A violated this constantly. Group B violated it less, but likely still violated it on complex entailments.
  *   **The Problem:** If we say Group A is "irrational" for pricing S4 and S5 differently, we are demanding they be **Logically Omniscient**. We are demanding they see all logical consequences of their beliefs instantly.
  *   **Bounded Computation:** The game showed that incoherence lives in the *notation* and the *processing*. Group B's glossary reduced the translation cost, but not the reasoning cost.

  ### 3. Three Families of Response (10 mins)
  Briefly outline how epistemologists try to fix this without giving up on rationality entirely.

  1.  **Impossible Worlds (Semantic Fix):**
      *   *Idea:* Expand the "worlds" in our probability space to include worlds where logical laws fail (e.g., a world where $P \to Q$ is true but $\neg P \lor Q$ is false).
      *   *Cost:* You lose the clean connection between logic and truth. It makes the math messy.
  2.  **Awareness Growth (Dynamic Fix):**
      *   *Idea:* You aren't irrational for having $C(A) \neq C(B)$ *yet*. Rationality is about how you update when you *notice* the connection. Group A became rational the moment I showed them the Logical Map.
      *   *Cost:* It turns rationality into a process over time, not a snapshot state. Hard to model formally.
  3.  **Costly Reasoning (Economic Fix):**
      *   *Idea:* Thinking takes work. It is rational to be incoherent if the cost of calculating the coherence exceeds the expected loss from the Dutch Book.
      *   *Cost:* You have to put a price on thinking. When is it worth it to check your logic?

  ---

  ## Troubleshooting & Risks

  **1. The "Logic Hero"**
  *   **Risk:** One student in Group A instantly recognizes the material conditional equivalence and forces their group to price them identically.
  *   **Mitigation:** This is actually good. It proves the point that *access* to logic solves the problem. However, to prevent them from solving the *Entailment Trap* (S7 vs S1), ensure Sentence 7 is buried in the middle of the list. If they spot it, acknowledge it: "This student is acting as an external processor. In the real world, do we all have a Logic Hero in our heads?"

  **2. Token Hoarding / Refusal to Bet**
  *   **Risk:** A group prices everything at 50 to avoid commitment.
  *   **Mitigation:** The "Tautology" (Sentence 9) and "Contradiction Pair" (1 & 2) punish this. If they price S9 at 50, they instantly lose 50 credits (House sells at 50, pays 100). If they price S1+S2 at 100 total (e.g., 50+50), they break even. If they price at 20+20, House buys both for 40, one pays 100. Profit 60.
  *   **Instruction:** "You must price S9 and the S1/S2 pair first. I will audit those immediately."

  **3. Bookkeeping Bog-Down**
  *   **Risk:** Calculating the Dutch Book loss for 18 students individually takes too long.
  *   **Mitigation:** **Group Consensus.** They must submit *one* sheet per group of 9. This forces them to argue the logic amongst themselves (simulating internal cognitive conflict) and reduces your grading to two calculations.

  **4. The "It's Just Definitions" Objection**
  *   **Risk:** Students argue Group A wasn't logically ignorant, just linguistically ignorant.
  *   **Response:** Accept this. It's a strong point. Logical Omniscience assumes logical truths are transparent. If language opacity blocks that transparency, then *language* is a bound on rationality. The problem remains: How much logic are we required to see through the language?

  ---

  ## Limitations: What This Game Cannot Show

  Be explicit about these in the final 5 minutes.

  1.  **Suspicion of Incoherence:** In the game, students trust their prices. In real life, smart agents suspect they might be incoherent and "hedge" (e.g., "I'm not sure if 'If' means 'Or', so I'll price them close but not identical"). The game punishes hedging as incoherence. Real rationality might *require* hedging against your own logical fallibility.
  2.  **The Fixed Menu:** The game gave them 9 sentences. Real belief isn't a menu. You don't know what sentences *exist* until you think of them. Logical Omniscience is partly a problem of **unawareness**—you can't assign probability to a proposition you haven't conceived. The game assumes all propositions are conceived.
  3.  **Timelessness:** Logic is timeless; the game had a clock. The pressure of the 15-minute timer induced errors that wouldn't exist if they had a week. This conflates *competence* with *performance*.

  ## Instructor's Key (For Your Eyes Only)

  **Logical Relations:**
  *   Let $B$ = Boojum, $F$ = Frumious.
  *   **S1:** $B$
  *   **S2:** $\neg B$
  *   **S3:** $F$
  *   **S4:** $B \to F$
  *   **S5:** $\neg B \lor F$
  *   **S6:** $\neg (B \land \neg F)$
  *   **S7:** $B \land F$
  *   **S8:** $F \to B$
  *   **S9:** $B \lor \neg B$

  **Equivalences:**
  *   $S4 \iff S5 \iff S6$ (Material Conditional Equivalence)
  *   $S1 + S2 = 100$ (Negation)
  *   $S9 = 100$ (Tautology)
  *   $S7 \le S1$ (Conjunction)
  *   $S7 \le S3$ (Conjunction)

  **Scoring Formula (Incoherence Penalty):**
  $$Loss = |P(S9) - 100| + |(P(S1) + P(S2)) - 100| + |P(S4) - P(S5)| + |P(S5) - P(S6)| + Max(0, P(S7) - P(S1))$$

  *Note: Group B should score near 0 on the Conditional Equivalence part, but may still lose points on the Conjunction/Entailment part.*
