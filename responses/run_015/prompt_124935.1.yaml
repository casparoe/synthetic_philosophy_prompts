answer: |-
  PRIVATE PREAMBLE: ASSUMPTIONS OF GOOD'S THEOREM VS. CASE STATUS

  1. Information is costless (or costs are separable from value). [Status: Fails – $1.6M direct cost plus opportunity cost of delayed acquisition.]
  2. Information does not causally alter the state of the world being measured. [Status: Fails – Detection triggers rancher retaliation destroying habitat.]
  3. The agent receiving the information is the agent choosing the action. [Status: Fails – Board learns, Commission decides; Commission behaves heuristically.]
  4. All feasible actions remain available regardless of the information outcome. [Status: Fails – Habitat destruction removes acquisition targets from the set.]
  5. The agent updates beliefs according to Bayes' rule with a stable utility function. [Status: Unclear – Commission decisions appear driven by political pressure rather than posterior utility.]

  ***

  TO: Science Advisory Board
  FROM: Decision Science Advisory Unit
  DATE: 12 September 2025
  RE: Recommendation on FY26–27 Research Appropriation – Sutter Basin Fairy Shrimp

  **Recommendation**

  The Board should **fund a redesigned survey** at a capped cost of $800,000, redirecting the remaining $800,000 of the proposed budget to immediate land acquisition. The survey should be restricted to a single field season (Spring 2026) designed specifically to meet the federal matching grant eligibility requirements, with strict data embargoes on site-specific locations until acquisition easements are secured.

  **Reasons**

  This recommendation navigates the conflict between the statutory duty to utilize "best available science" and the practical risk that measuring the system will destroy the very habitat we intend to save. We reject the proposal to fund the survey as originally proposed, but we also reject declining the survey entirely. The middle path secures the federal leverage while mitigating the risk of reactive habitat loss.

  **1. The Expected Value of Information is Not Strictly Positive**
  A colleague has correctly cited Good's theorem, noting that for a rational Bayesian agent, the expected value of costless information is never negative. However, this theorem relies on assumptions that do not hold here. Specifically, it assumes the act of measurement does not change the state of the world. In this case, the signal is reactive: public disclosure of occupancy triggers statutory protections that ranchers have threatened to preempt by destroying vernal pools. If the survey identifies a site that we subsequently fail to acquire, and the rancher disks the pool in response to the public record, the net value of that information is negative. We have reduced the available action set (acquisition) by exercising the measurement option. Therefore, hesitation is not risk aversion; it is a rational calculation of negative expected value due to reactivity.

  **2. The Federal Match Opportunity Cannot Be Ignored**
  Conversely, declining the survey entirely to fund acquisition forfeits a significant leverage opportunity. The federal matching program triples our acquisition dollars, but requires a current occupancy estimate with confidence intervals by March 2027. The original two-season proposal fails this timeline, as only one season would be complete by the deadline. By redesigning the survey to focus solely on generating a statistically valid preliminary estimate in Spring 2026, we maintain eligibility for the match. Redirecting the saved $800,000 to immediate acquisition ensures we secure willing sellers now, rather than waiting for the grant award. This hybrid approach hedges against the risk that the federal grant is not awarded while preserving the upside potential.

  **3. Managing the Principal-Agent Problem**
  We must acknowledge that this Board recommends, but the Commission decides. The Commission has a demonstrated tendency to treat single detections as conclusive and act before full data are analyzed. If we release raw data as it arrives, the Commission may impose grazing restrictions prematurely, validating rancher fears and incentivizing destruction. Our redesigned survey protocol must include a data management plan that aggregates results for the Commission's March 2027 decision while withholding specific site coordinates from the public record until acquisition is complete. This satisfies the "best available science" statute without triggering the reactive destruction mechanism inherent in the Public Records Act timeline.

  **Implementation Plan and Milestones**

  *   **1 October 2025:** Survey Unit submits redesigned scope (Spring 2026 only, 600 sites) and Data Embargo Protocol for Board approval.
  *   **15 November 2025:** Department legal counsel confirms authority to withhold site-specific data under endangered species privacy exemptions.
  *   **1 March – 30 June 2026:** Field Season 1 execution.
  *   **1 September 2026:** Preliminary occupancy estimate and confidence intervals delivered to Board.
  *   **1 March 2027:** Federal grant application submitted using preliminary data.
  *   **1 October 2026 – 30 June 2027:** Acquisition unit deploys redirected $800,000 to secure easements in high-priority complexes identified by internal (non-public) data.

  **Conclusion**

  We must avoid the false choice between knowing and acting. By decoupling the timing of measurement from the timing of public disclosure, and by scaling the survey to match the grant window, we preserve the value of information without paying the price of habitat destruction.

  ***

