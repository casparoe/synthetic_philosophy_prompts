  4.  **Developing the Explanation:**

      *   **Naming the Split:**
          *   Academic term: **Structure vs. Agency**.
          *   Historiographical term: **Determinism vs. Contingency**.
          *   Cognitive term: **Narrative Bias** or **Hindsight Bias**.
          *   *Best fit for the user's specific observation:* **Selective Determinism** (not a formal term, but descriptive) or **The Historian's Fallacy**. Let's stick with the formal **Structure vs. Agency** but explain the *switching* mechanism.

      *   **Why do people switch? (The "How they draw the line" part):**
