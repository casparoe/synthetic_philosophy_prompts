          *   Scenario A (Specific Events/Contingency): "If Hitler made a different call in '43, everything changes." (History is fragile, dependent on individuals/accidents).
          *   Scenario B (Broad Trends/Determinism): "If you erase the steam engine, someone else invents it." (History is inevitable, driven by underlying forces).
      *   **Problem:** People switch between these two modes (Contingency vs. Determinism) without acknowledging the inconsistency.
      *   **Request:**
          1.  Is there a name for this split?
          2.  Explain *how* people draw the line between "inevitable" and "lucky."
          3.  Address the suspicion that people just pick whichever makes the story more interesting.

  2.  **Identify the Core Concepts:**
      *   **Historical Determinism:** The idea that events are predetermined by structural forces (economics, technology, geography).
      *   **Historical Contingency:** The idea that events depend on specific, often accidental, circumstances (great men, battles, decisions).
      *   **The Tension:** This is the classic "Structure vs. Agency" debate in historiography and sociology.
