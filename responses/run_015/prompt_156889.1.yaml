      *   *Technological Determinism:* The "Steam Engine" side.
      *   *Hindsight Bias:* Knowing the outcome makes things look inevitable.
      *   *Narrative Fallacy:* Making a story out of random events.
      *   *Teleology:* History having a goal/end point.
