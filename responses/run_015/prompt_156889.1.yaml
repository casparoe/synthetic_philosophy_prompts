answer: |-
  You have spotted one of the oldest and most persistent tensions in how humans understand time and cause. You are absolutely right: people switch between these two modes constantly, often in the same conversation, without realizing they are contradicting themselves.

  There isn't one single perfect word, but there are three layers of terminology that describe exactly what you are seeing.

  ### 1. The Academic Label: Structure vs. Agency
  In history and sociology, this is called the **Structure vs. Agency** debate.
  *   **Agency (The Hitler Scenario):** This is the belief that individuals have the power to act independently and change the course of events. This aligns with **Historical Contingency**. It says history is fragile; a different decision creates a different world.
  *   **Structure (The Steam Engine Scenario):** This is the belief that underlying forces (economics, technology, geography, culture) push history in a specific direction regardless of individuals. This aligns with **Historical Determinism**. It says history is a river; you can splash in it, but you can't stop the flow.

  When people switch between these without noticing, they are engaging in **Eclectic Historiography**, but a more critical term for the error is **The Historian's Fallacy** (specifically a mix of *Hindsight Bias* and *Narrative Fallacy*).

  ### 2. How People Draw the Line (The Unconscious Rules)
  You asked how people decide when something is "destiny" and when it is "luck." It usually isn't logical; it is psychological. They unconsciously apply three filters:

  **A. The Timescale Filter**
  *   **Short Term = Contingency:** Over a week or a year, things feel chaotic. A general gets sick, a letter is lost, a vote is tied. This feels like "luck."
  *   **Long Term = Determinism:** Over a century, the noise averages out. People look at the Industrial Revolution and say, "The pressure was building for 200 years; the steam engine *had* to happen."
  *   *The Contradiction:* People treat the 20th century as "long term" (so democracy was inevitable) but also treat specific battles within it as "short term" (so Hitler could have won). They zoom in and out to suit the point they are making.

  **B. The Complexity Filter**
  *   **Single Point of Failure:** If a story relies on one person (Hitler, Napoleon, Lincoln), it feels fragile. We intuitively know people are fallible.
  *   **Systemic Momentum:** If a story relies on a system (trade routes, scientific method, capitalism), it feels robust. Systems feel like physics; people feel like variables.
  *   *The Contradiction:* People ignore that systems are made of people. The "scientific method" didn't appear out of thin air; it was defended by specific people making specific choices. But once the system exists, we treat it like a law of nature.

  **C. The Outcome Bias (The "Winner's Circle")**
  *   **What Happened = Inevitable:** Because democracy *did* spread, it feels like it was destined to spread. This is **Hindsight Bias**. We look at the winner and assume they were the stronger force.
  *   **What Didn't Happen = Fragile:** Because Hitler *lost*, we assume his victory was a fragile alternate timeline.
  *   *The Contradiction:* If Hitler had won, those same historians would likely argue that Fascism was the inevitable future of modern technology and that democracy was a fleeting experiment. We dress up the actual outcome in the clothes of destiny.

  ### 3. Why They Switch: The Narrative Necessity
  Your suspicion is correct: **They pick whichever version makes the story more interesting.**

  Human beings have two conflicting psychological needs when consuming history:
  1.  **We need Drama (Agency):** If everything is determined, then human choice doesn't matter. That is depressing and boring. We want to believe that one brave general or one evil dictator matters. It makes the story a thriller.
  2.  **We need Meaning (Determinism):** If everything is random chaos, then there is no progress and no lesson to learn. We want to believe that society is "getting better" or moving toward a goal. That makes the story a journey.

  So, a "What If Hitler Won" video uses **Contingency** to sell you the drama of the alternate timeline. But a video about "The Rise of Democracy" uses **Determinism** to sell you the comfort of progress.

  ### The Concept That Bridges the Gap: Path Dependence
  If you want a term that actually resolves the contradiction, look up **Path Dependence**.

  This theory suggests that **contingent events lock in deterministic paths.**
  *   *Example:* The QWERTY keyboard layout was a contingent accident (designed to slow typists down so mechanical typewriters wouldn't jam). That was "luck."
  *   *Result:* Once everyone learned QWERTY, it became economically impossible to switch. It became "inevitable" that we would keep using it, even after the mechanical problem was gone.

  Applied to your examples:
  *   Maybe the Industrial Revolution was inevitable (**Determinism**).
  *   But *which country* led it might have depended on a specific battle or law (**Contingency**).
  *   Once that country led it, the global balance of power was locked in for a century (**Path Dependence**).

  ### Summary
  The split you are seeing is **Determinism vs. Contingency**.
  The reason they switch is **Narrative Bias**: they use Contingency to create tension and Determinism to create meaning.
  The way they draw the line is usually arbitrary, based on **Timescale** and **Hindsight**.

  You are seeing through the trick. Most popular history is a oscillation between "Great Men change the world" and "The World makes Great Men," chosen solely based on which one makes the current sentence sound more profound.
