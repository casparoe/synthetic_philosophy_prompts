  To: Community Reentry Fund Advisory Board
  From: [Your Name]
  Date: [Date]
  Subject: Recommendation on Cycle 4 Funding Applicants

  Colleagues,

  We have $400,000 to spend, and we have two proposals that look similar on paper but operate on different assumptions about human behavior. My job here is to draft the opinion that guides our vote, and I want to be plain about where I stand. I am not a theologian or a sociologist. I managed freight for thirty years. I know that if a truck doesn't move, the schedule breaks, and I know that if the budget doesn't balance, the program dies. I look at Applicant A and Applicant B, and I see two different risk profiles.

  Applicant A has the better numbers. There is no denying that. Their participants stay employed and stay out of jail at higher rates than any program we currently fund. But when I look at their budget and their intake, I see a selection effect. They are recruiting people who are already inside a church. Those people already have a network that notices if they miss dinner. They already have a community that will call their mother if they go quiet. We are not paying to build a safety net; we are paying to rent one that already exists. Furthermore, their exit interviews tell me something uncomfortable: participants feel safer, but they trust people outside their congregation less than when they started. For a county fund, I have to ask if we are paying for public safety or private insulation.

  Applicant B is asking for a pilot. They have no outcome data. They recruit through probation officers and Facebook, meaning they are getting the people who do not have a church waiting for them. Their model relies on professional training and peer monitoring without the religious component. They are trying to build the safety net from scratch.

  Here is the hard part: We need to decide what "morality" means for this fund. If it means "did not return to jail," A wins. If it means "became a citizen who trusts and is trusted by strangers," A might actually be losing ground. A's model works by making commitment expensive and monitored. The question is whether the "monitor" needs to be God. A's participants say the feeling of being watched by a deity keeps them honest when no human is looking. B tries to replicate this with peer panels and professional standards. We do not know if that works yet.

  Regarding the measurement idea I raised about unobserved honesty tests (e.g., overpaying a stipend to see who returns the money): I have thought this through, and I recommend we do not do this. It is a better proxy for honesty than reconviction rates, which only measure whether someone got caught. However, it is ethically hazardous for a public body to deceive vulnerable participants. It treats them like suspects rather than partners. If we are caught running traps on people we are supposed to be helping, we destroy the trust required for any program to work. It would tell us who is honest in that specific moment, but it would not tell us if they are employable or reintegrated. It risks the mission for a data point.

  My recommendation is to fund Applicant B for a one-year pilot. I know this ignores A's superior track record, but funding A carries a legal risk regarding the separation of church and state that could expose the county to litigation, and it reinforces a model that narrows civic trust rather than widening it. If B fails, we have learned that secular substitutes cannot currently match the intensity of the religious model, and we can revisit A with legal counsel to see if the religious requirements can be decoupled from the funding. But we cannot know if we can build this capacity ourselves unless we try.

  We need a definition of success that fits a public mandate. For this fund, "making participants more moral" means increasing adherence to laws and norms that protect people outside the participant's immediate group. It excludes internal group loyalty or religious compliance. We accept losing the measurement of spiritual salvation because that is not the county's business.

  Below is the specific motion I propose we vote on, followed by the data structure summarizing this opinion.

