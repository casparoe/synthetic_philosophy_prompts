answer: |-
  Here is the plan. It is designed to fit a 40-minute window, keeping the focus on epistemology (how we judge ideas) rather than econometrics.

  ### 1. The Core Example: The Field and the Bone Meal
  **Use this one.** Discard the yeast. Yeast implies a biological hard ceiling and a sudden crash, which triggers the "he was wrong about the crash" reflex.

  **The Setup:**
  Imagine a single, fixed-size field (the land). You have workers (population).
  *   **The Mechanism:** The first worker feeds himself easily. The second helps. By the tenth, they are tripping over each other; the yield *per person* drops. This is diminishing returns.
  *   **The Reprieve:** You find a buried sack of bone meal (coal/guano/New World soil). You spread it. Yield spikes. Everyone eats well. The parish gets richer.
  *   **The Malthusian View:** The Curate looks at the bone meal and says, "This is a **stock**, not a **flow**." It is an inheritance, not income. Once it's gone, you are back to the field size vs. worker count.
  *   **What it must have:** It must show that *growth happened* (the bone meal worked). It must show that the *constraint remains* (the field didn't get bigger).
  *   **What it must lack:** It must not specify *when* the bag empties. If you say "it empties in 1850," you're making a prediction. If you say "it is finite," you're stating a condition.

  ### 2. The Order of Operations
  You cannot argue "Right but Early" until you have separated the *principle* from the *timeline*. If they think Malthus made a prophecy, no amount of nuance will save him.

  **Minute 0–10: The Mechanism (The Field)**
  *   Establish the logic of diminishing returns on a fixed base.
  *   **Goal:** Make them feel the pressure, not the crash.
  *   **Key distinction:** Malthus isn't predicting everyone dies; he's predicting the *surplus* gets eaten by the new mouths. The parish gets richer, but the poor stay at subsistence. (This matches your novel's reality).

  **Minute 10–20: The Anomaly (The Bone Meal / Stock vs. Flow)**
  *   Address the "Green Revolution" objection immediately using the example.
  *   **Placement:** Put this *before* the Alibi distinction. You need to establish *factual* grounds for why he isn't wrong yet before you argue about *philosophical* grounds.
  *   **Argument:** The 19th-century boom was fueled by drawing down stocks (fossil energy, virgin continents). Malthus assumed flows (annual harvest). If the boom is based on stocks, the pressure is merely deferred, not abolished.
  *   **Why here:** This prevents the "Right but Early" claim from sounding like a magical "wait and see." It gives them a material reason (finite coal/soil) to respect the Curate's persistence.

  **Minute 20–30: The Epistemology (The Alibi Test)**
  *   Now address the "Unfalsifiable" charge.
  *   **Your Definition:** You are correct. This is the sharpest cut.
      *   **Early:** The theory names the suspending condition *in advance* (Malthus explicitly acknowledged new land or prudential restraint could delay the pressure, he just doubted their scale).
      *   **Alibi:** The condition is bolted on *after* the failure to explain away any outcome (e.g., "Population didn't outstrip food because... uh... aliens helped").
  *   **Why here:** Once they accept the "Stock" argument, they are primed to see the Green Revolution as a "suspending condition" (technology/stocks) rather than a "refutation."

  **Minute 30–40: Discussion & The Final Question**
  *   Open floor, but steer using the "Do Not Engage" list below.
  *   End with the comprehension check.

  ### 3. Misconceptions & Head-Offs
  In the order they will form in the room:

  1.  **"He set a date and missed it."**
      *   *Head-off:* In the first 10 minutes. Clarify that the *Essay* describes a ratio of pressure, not a calendar date. He argued that population *tends* to outstrip means, not that it *must* by Tuesday.
  2.  **"Food output grew geometrically too (Technology)."**
      *   *Head-off:* In the Stock/Flow section (Min 10–20). Acknowledge the growth, but question the *source*. Was it sustainable yield (flow) or drawing down capital (stock)?
  3.  **"It's unfalsifiable / 'Right but Early' is just a polite way of being wrong."**
      *   *Head-off:* In the Alibi section (Min 20–30). Use your definition. Ask: "Did Malthus list the ways he could be wrong in Chapter 1? Yes. Did he add them later? No."

  ### 4. The Stock-vs-Flow Placement
  **Place it before the Alibi distinction.**
  *   **Why:** The Alibi distinction is abstract. The Stock-vs-Flow point is concrete. If you argue epistemology first, they will think you are playing word games to protect a failed theory. If you show them that the 19th-century wealth was effectively "eating the seed corn" (coal/guano), the "Early" argument becomes material, not just semantic.
  *   **Does it help?** Yes, but you must frame it as *explaining the Curate's perspective*, not predicting 2050.
  *   **The Trap:** If you say "Coal will run out so Malthus wins," they will hear "Doomsayer."
  *   **The Fix:** Say "Coal allowed a temporary suspension of the rule." That validates the Curate's observation of the *mechanism* without requiring him to predict the *end*.

  ### 5. The Final Question
  Do not ask if they like the Curate. Ask about the conditions of his reasoning.

  > **"What specific observation, available to the Curate in 1840, would have forced him to burn his book?"**

  *   **Why this works:** If they answer "Starvation stopping," they missed the point (that's the outcome, not the mechanism). If they answer "Proof that the new land/coal was infinite rather than finite," they understood the Stock/Flow distinction. If they say "Nothing," they think it's unfalsifiable.

  ### 6. What to Refuse (The "Do Not Engage" List)
  To keep this to 40 minutes and avoid derailing into modern politics or academic turf wars:

  1.  **Real Wage Series:** Do not let them drag you into whether 1820–1850 wages actually rose or fell. It's debated, technical, and irrelevant to the Curate's *internal logic*.
      *   *Shut-down:* "For the Curate, the *pressure* is visible even if wages rise, because the rise depends on finite capital."
  2.  **Ester Boserup:** Do not entertain the idea that "population drives technology." That inverts the causality and turns this into a debate about innovation theory.
      *   *Shut-down:* "That's a different model. We are looking at why *this* model remained coherent to *this* man."
  3.  **Modern Climate/Overpopulation:** Do not let the session become a proxy debate about 2024 resource limits.
      *   *Shut-down:* "We are judging the 19th-century evidence, not the 21st-century outcome."
  4.  **Moral Cruelty:** Readers often hate Malthus because he opposed poor relief.
      *   *Shut-down:* "We aren't judging his morality, but his consistency. A cruel man can still have a coherent model of population."

  ### Summary of the Split
  Your cut on **Early vs. Alibi** is the correct place to split it.
  *   **Early:** The exception is internal to the theory's logic (Malthus: "Unless new land is found...").
  *   **Alibi:** The exception is external and post-hoc (Apologist: "He was wrong, but you can't blame him because...").

  By placing the **Stock/Flow** argument before this, you give them the concrete evidence needed to see the "Green Revolution" as an internal exception (new land/energy found) rather than an external refutation (laws of biology changed). This makes the Curate's persistence look like intellectual rigor, not stubbornness.
