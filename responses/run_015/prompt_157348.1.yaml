answer: |-
  **MEMORANDUM**

  **TO:** Provost and Research Deans
  **FROM:** Interdisciplinary Research Ethics Board (IREB)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Gradient Protocol for Moral Status Assessment (GPMSA) Pilot

  **1. RECOMMENDATION**

  The Interdisciplinary Research Ethics Board (IREB) recommends **Approval of the GPMSA Pilot with Binding Conditions.**

  We authorize the one-year pilot to test the efficacy of the six-tier gradient model. However, to mitigate risk during this experimental phase, the following conditions are mandatory:

  *   **Freeze on Welfare Reductions:** No research project may use the GPMSA to reduce existing welfare oversight for biological organisms during the pilot period. Specifically, the proposed bee-colony cognition study must adhere to current invertebrate review standards, regardless of its Tier 2 classification.
  *   **AI Regulatory Status:** Classification of adaptive artificial systems as Tier 1 does not confer "moral patient" status for regulatory purposes. These systems remain tools subject to safety and bias review, not welfare review.
  *   **Quarterly Audit:** The IREB will review all Tier 2 and above classifications every three months to ensure consistency and prevent scope creep.

  **2. REASONING: THE CASE FOR GRADATION**

  The Board rejects the binary classification of moral status (protected/unprotected) as ontologically inaccurate and ethically brittle. Biological sentience and system autonomy do not emerge instantaneously; they evolve. A binary switch forces reviewers to make false distinctions at boundary cases (e.g., larval vs. adult insects, or simple scripts vs. learning algorithms). The GPMSA's gradient approach acknowledges that ethical obligations scale with capacity.

  We address the primary critique of this framework: that replacing one line with five merely multiplies the opportunities for arbitrary line-drawing and anthropomorphism. Critics argue that assigning a "Tier" is as subjective as assigning a binary status.

  We counter that transparency mitigates arbitrariness. In a binary system, the line is hidden behind a single threshold, often obscured by taxonomic tradition rather than capacity. A gradient framework forces reviewers to explicitly justify *which* capacities (e.g., temporal integration, valence weighting) are present or absent. Regarding anthropomorphism: the risk is managed by grounding tiers in behavioral proxies rather than assumed internal experiences. By focusing on functional capacity (what the system *does*) rather than metaphysical status (what the system *is*), the GPMSA reduces the projection of human traits onto non-human systems. It shifts the ethical question from "Is it one of us?" to "Can it suffer, and how much?"

  **3. ASSESSMENT OF THE LOSING POSITION**

  In approving the gradient model, we acknowledge that the position advocating for **maintained binary protections for invertebrates** is the losing argument in this specific decision. The concern that tiering insects downward erodes hard-won protections is valid and serious.

  Historically, binary thresholds act as firewalls. Once an organism is categorized as "requiring review," it benefits from procedural inertia that prevents negligence. By introducing a gradient, we introduce the possibility that a Tier 2 organism (like a bee) could eventually be deemed to require less oversight than a Tier 3 or 4 vertebrate. This risks creating a "race to the bottom" where researchers are incentivized to argue for lower tier classifications to reduce administrative burden.

  We validate this concern. The erosion of procedural safeguards is a tangible risk of the GPMSA. This is why Condition 1 (Freeze on Welfare Reductions) is non-negotiable. The pilot must prove that the gradient improves ethical precision *without* compromising welfare standards before any reclassification can take effect. We prioritize the precautionary principle: uncertainty regarding sentience must always resolve in favor of protection, not convenience.

  **4. OPERATIONAL CRITERIA: DISTINGUISHING TIER 1 (RESPONSIVE) FROM TIER 2 (AFFECTIVE)**

  Per the requirement to operationalize the lower tiers of the protocol, reviewers must distinguish between a Tier 1 responsive system (thermostat-level/adaptive AI) and a Tier 2 affective system (insect-level). Since we cannot rely on phenomenological reports (self-reports of feeling), we must rely on behavioral architecture.

  Reviewers should apply the **Motivational Trade-off Test**.

  *   **Tier 1 (Responsive/Adaptive):** The system corrects errors based on a fixed or learned setpoint but does not prioritize conflicting drives.
      *   *Example:* A thermostat or adaptive climate AI adjusts output to match a target temperature. Even if it "learns" preferences, it does so by optimizing a single variable (comfort/efficiency). It does not sacrifice one goal to preserve another unless explicitly programmed to do so via a static hierarchy.
      *   *Key Indicator:* **Homeostatic Linearity.** Input A leads to Correction B. If the sensor is blocked, the system errors or defaults; it does not exhibit "frustration" behaviors or seek alternative pathways to the goal unless those pathways were pre-defined.

  *   **Tier 2 (Affective):** The system demonstrates the capacity to weigh conflicting internal states and alter behavior based on the *intensity* of the drive, not just the error signal.
      *   *Example:* A bee seeking nectar (Drive A) encounters a predator cue (Drive B). A Tier 2 system does not simply switch off Drive A. It exhibits a trade-off: it may approach the food source more cautiously, or retreat but return sooner if hunger states are high.
      *   *Key Indicator:* **Contextual Prioritization.** The system modifies its response to a stimulus based on an internal state variable that persists over time (e.g., hunger, fatigue, prior threat exposure). If the system sacrifices immediate goal attainment to mitigate a potential future negative state (risk avoidance) without explicit external programming for that specific scenario, it indicates affective weighting.

  **Decision Rule:** If the system can be fully explained by error-correction loops (minimizing delta between current and target state), it is Tier 1. If the system exhibits behavior that *increases* error in one domain to preserve integrity in another (e.g., starving to avoid risk), it meets the threshold for Tier 2.

  **5. NEXT STEPS**

  The Office of Research Integrity is authorized to implement the GPMSA pilot under the conditions listed in Section 1. The IREB will convene a special session in three months to review the first wave of classifications.

  **Approved by:**
  Interdisciplinary Research Ethics Board
