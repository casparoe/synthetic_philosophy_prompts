prompt: |-
  I've been reading LW and ACX forever so I know all the standard moves around this stuff, but now I actually have to do it for real: I'm one of three people on the grants committee of a small animal-welfare funder, and we get ~30 proposals a year aimed at insects where the whole case is a scale argument — the numbers are astronomic, so even a tenth of a percent chance they feel anything makes the EV look enormous. I know why that's supposed to be fishy (the sentience probability isn't indepedent per insect, it's basically one shared hypothesis, so you're not making a million small bets that diversify, you're making one huge correlated bet) but I can't turn that into anything my committee can run on an actual proposal in an afternoon, with no literature review and no expert on call.

  So: write me a decision procedure. Questions in order, what counts as an adequate answer to each, where it just stops with a no, and where it has to stop and hand to a person because it's a values call. Specifically I want it to handle:

  - unit of account: for eusocial species, is the candidate subject the individual insect, the colony as a superorganism, or both, and how much of the answer rides on that choice;
  - interventions that move the population as well as the welfare per insect (a faster-acting pesticide kills more cleanly but might mean more survivors breeding). My suspicion is the sign of the effect flips depending on whether an insect life is net positive or net negative, and we genuinely don't know, so maybe the procedure branches there or punts;
  - the case where everything funnels into one correlated hypothesis and the right move might be buying information rather than acting — say when.

  Also tell me plainly where the procedure will misfire, i.e. where it hands back confident-looking numbers that are just our priors with a spreadsheet wrapped round them.

  Then run it on three: (1) a supermarket-chain campaign to switch to faster-killing pesticides; (2) funding a study on whether some other clade shows the "pessimism"-style judgement-bias markers I half-remember from bees, on the theory the result propagates across a lot of species at once; (3) the bee-pollination welfare project I've already half-promised a big grant to, which I want you to run honestly even if it comes out saying pull out. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **User Persona:** Experienced reader of LessWrong (LW) and Astral Codex Ten (ACX). Understands expected value (EV) calculations, Pascal's mugging, correlation of hypotheses, and effective altruism (EA) concepts.
      *   **Role:** Member of a 3-person grants committee for a small animal-welfare funder.
      *   **Problem:** Receiving ~30 insect welfare proposals/year based on scale arguments (astronomic numbers $\times$ tiny probability = huge EV). Needs a practical decision procedure to evaluate these *without* deep literature reviews or experts, in an afternoon.
      *   **Specific Requirements:**
          *   Step-by-step decision procedure (questions, pass/fail criteria, stop points).
          *   Handle specific edge cases: Unit of account (individual vs. colony), Population vs. Welfare per insect interventions (sign flip risk), Correlated hypothesis/Value of Information (VOI).
          *   Identify failure modes (where the procedure generates false confidence).
          *   Apply the procedure to three specific cases:
              1.  Supermarket campaign (faster-killing pesticides).
              2.  Research study (judgement-bias markers across clades).
              3.  Bee-pollination welfare project (already half-promised, needs honest evaluation).
          *   **Tone/Style:** British English. Direct, pragmatic, acknowledging the "fishiness" of the scale arguments without dismissing them outright.

  2.  **Develop the Decision Procedure (The "Insect Welfare Triage Protocol"):**
      *   *Goal:* Filter out the "Pascal's Mugging" style proposals while retaining robust, actionable interventions.
      *   *Constraint:* No literature review, no experts, afternoon timeframe.
      *   *Structure:* Gating questions. If you fail a gate, you stop.
      *   *Key Concept:* Shift focus from *Total EV* (which is dominated by the uncertain probability of sentience) to *Robustness* and *Reversibility/VOI*.
      *   *Gate 1: The Correlation Check.* Is this just multiplying $N \times P$? If the uncertainty is shared across all $N$, the variance is huge. We need to penalize high-correlation uncertainty.
      *   *Gate 2: Unit of Account.* Eusociality complicates things. If the colony is the unit, $N$ drops drastically.
      *   *Gate 3: Valence Uncertainty.* Is life net positive or negative? If we don't know, interventions changing population size are high-risk.
      *   *Gate 4: Value of Information.* Is this buying knowledge or locking in a stance?
      *   *Values Call:* Where does the committee have to vote based on risk tolerance rather than facts?

  3.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: The Scale Sanity Check.* Don't let $10^{18}$ do the work. Cap the "moral weight" at a reasonable bound or demand a lower bound on sentience probability that isn't just "non-zero."
      *   *Step 2: The Unit Question.* Individual vs. Colony. If they claim individual, do they address eusocial interdependence?
      *   *Step 3: The Sign Risk.* Does the intervention change population size? If yes, and valence is unknown, it's a gamble.
      *   *Step 4: The VOI Test.* Is this intervention reversible? Does it generate data?
      *   *Stop Rules:* Hard "No" on pure scale bets. "Values Call" on risk tolerance regarding valence.

  4.  **Addressing Specific Edge Cases (as requested):**
      *   *Unit of Account:* Needs a specific question. If eusocial, treat the colony as the primary unit unless there's strong evidence of individual conflict/suffering independent of colony fitness.
      *   *Population vs. Welfare:* Explicitly flag the "Net Negative" risk. If insects suffer more than they enjoy, increasing population is bad. If unknown, population-neutral interventions are safer.
      *   *Correlated Hypothesis:* This is the core LW/ACX insight. If $P(\text{sentiency})$ is the same for all insects, you don't get law of large numbers. The procedure must discount the $N$ multiplier when the uncertainty is systemic.

  5.  **Identifying Failure Modes:**
      *   False precision (scoring systems that look mathy but are just priors).
      *   Status quo bias (rejecting all novel interventions).
      *   Ignoring wild animal suffering (WAS) vs. farmed insect suffering distinctions.

  6.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Supermarket Pesticide Switch.*
          *   *Mechanism:* Faster death = less suffering per insect?
          *   *Risk:* Survivors breed = more insects?
          *   *Valence:* Unknown.
          *   *Verdict:* High risk on population effect. Needs evidence that population won't rebound. Likely a "No" or "VOI only" under the procedure.
      *   *Case 2: Judgement-Bias Study.*
          *   *Mechanism:* Research.
          *   *Benefit:* Reduces uncertainty on $P(\text{sentiency})$ across clades.
          *   *Verdict:* High VOI. Low risk of causing harm. Strong "Yes" for a small grant, but not a massive scale-up yet.
      *   *Case 3: Bee-Pollination Welfare.*
          *   *Context:* User half-promised. Needs honesty.
          *   *Mechanism:* Improving conditions for managed bees.
          *   *Risk:* Might increase demand for pollination = more bees (lock-in).
          *   *Valence:* Are managed bees net negative (slavery/exploitation) or positive (protected)?
          *   *Verdict:* Tricky. If it locks in industrial use, it's risky. If it's purely welfare standards without expansion, maybe okay. Given the "half-promised" pressure, the procedure should highlight the lock-in risk.

  7.  **Refining Tone and Language:**
      *   British English (e.g., "programme," "centre," "whilst," "maths," "prioritise").
      *   Pragmatic, slightly weary but professional tone (acknowledging the "LW/ACX" background).
      *   Avoid jargon where possible, but use it correctly where needed (EV, VOI, priors).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for an afternoon?
      *   *Fix:* Simplify the scoring. Make it a checklist with hard stop conditions.
      *   *Critique:* Did I address the "correlated hypothesis" point enough?
      *   *Fix:* Make Gate 1 explicitly about the "One Big Bet" problem.
      *   *Critique:* The user wants to know where it misfires.
      *   *Fix:* Add a dedicated section on "Failure Modes."
      *   *Critique:* Case 3 needs to be honest even if it says "pull out."
      *   *Fix:* Ensure the analysis of Case 3 highlights the "lock-in" risk strongly, even if it contradicts the user's desire to fund it.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Adequate answers/Stop points? Yes.
      *   Values call identification? Yes.
      *   Handle Unit of Account? Yes.
      *   Handle Population/Welfare sign flip? Yes.
      *   Handle Correlated Hypothesis/VOI? Yes.
      *   Failure modes? Yes.
      *   Run on 3 cases? Yes.
      *   British English? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your constraints: three people, one afternoon, no external experts, high uncertainty on sentience. It is built to neutralise the "astronomic numbers" leverage without discarding the possibility of insect welfare entirely.

  ### The Insect Welfare Triage Protocol (IWTP)

  **Objective:** Filter proposals that rely on fragile scale arguments from those that offer robust welfare improvements or high-value information.
  **Time limit:** 20 minutes per proposal.

  #### Gate 1: The Correlation & Scale Check
  **Question:** Does the Expected Value (EV) calculation rely primarily on multiplying a vast number of individuals ($N$) by a tiny, unverified probability of sentience ($P$)?
  *   **Adequate Answer:** The proposal identifies specific, observable welfare deficits (e.g., crushing, slow death, confinement) that are bad *conditional* on sentience, without needing $N > 10^{12}$ to justify the cost.
  *   **Stop Condition (No):** If the primary justification is "There are $10^{15}$ of them, so even a 0.001% chance matters."
  *   **Reasoning:** As you noted, this is one correlated bet, not a diversified portfolio. If $P=0$, the whole EV vanishes. We do not have the risk tolerance for 'Pascal's Mugging' style bets with limited capital.
  *   **Values Call:** If the proposal passes this gate, you are agreeing that *conditional* welfare matters even if the probability of sentience is low. This is a standard EA stance, but worth noting.

  #### Gate 2: The Unit of Account (Eusociality Filter)
  **Question:** For eusocial species (ants, bees, termites), does the proposal treat the individual or the colony as the moral patient?
  *   **Adequate Answer:**
      *   *Option A:* Argues for the **Colony** as the unit. $N$ is reduced by factor of $\sim10^4$. Welfare metrics focus on colony health/survival.
      *   *Option B:* Argues for the **Individual**. Must provide a mechanism for individual suffering independent of colony fitness (e.g., worker policing, expendable males).
  *   **Stop Condition (No):** If the proposal assumes individual sentience for eusocial workers without addressing the superorganism objection, *and* relies on individual counts for scale.
  *   **Reasoning:** If the colony is the superorganism, the 'astronomic numbers' argument collapses immediately. If individuals are the unit, you must explain why natural selection hasn't bred out maladaptive suffering in sterile workers.
  *   **Values Call:** Choosing Option A vs B is a biological/philosophical judgement. The committee must vote. If split, default to the more conservative unit (Colony) for calculation purposes.

  #### Gate 3: The Valence & Population Sign Check
  **Question:** Does the intervention change the total population size of the species?
  *   **Adequate Answer:**
      *   *Population Neutral:* The intervention improves quality of life without altering birth/death rates significantly (e.g., better handling, less painful killing *at same volume*).
      *   *Population Reducing:* Must argue that insect lives are **Net Negative** (suffering > pleasure).
      *   *Population Increasing:* Must argue that insect lives are **Net Positive**.
  *   **Stop Condition (No):** If the intervention changes population size (e.g., pesticide efficacy, habitat creation) and the proposal claims "We don't need to know if lives are net positive or negative."
  *   **Reasoning:** This is the sign-flip risk. If lives are net negative, saving them is harm. If net positive, killing them is harm. Ignoring this is negligence.
  *   **Values Call:** If the proposal admits uncertainty on valence but proceeds with a population-changing intervention, the committee is effectively betting on valence. You must vote: *Are we willing to bet that wild insect lives are net negative?* If the committee cannot agree, the proposal fails.

  #### Gate 4: The Value of Information (VOI) Test
  **Question:** Is this intervention reversible, and does it generate generalisable knowledge?
  *   **Adequate Answer:** Yes, it is a pilot study, or the intervention is easily halted, and results will inform future $P(\text{sentiency})$ estimates.
  *   **Stop Condition (No):** If the intervention locks in industrial practices (e.g., setting standards that legitimise expansion) or is irreversible (mass release/modification).
  *   **Reasoning:** When the hypothesis is correlated and uncertain, buying information is often higher EV than acting on the hypothesis.
  *   **Values Call:** How much do we value 'learning' vs 'doing'? For a small funder, learning usually dominates.

  ---

  ### Where This Procedure Will Misfire

  You asked for plain speaking on the failure modes. Here they are:

  1.  **The False Precision Trap:** The scoring looks mathematical, but the inputs (e.g., "Is this population neutral?") are guesses. You will end up with confident-looking "No" decisions based on ignorance, not evidence. This is status quo bias dressed up as rigour.
  2.  **The Lock-In Blindspot:** The procedure flags direct population changes, but it may miss second-order market effects. Funding a "welfare standard" might make insect farming more socially acceptable, increasing demand (and $N$), even if the intervention itself is population-neutral. The IWTP is weak on market dynamics.
  3.  **The 'Net Negative' Default:** By forcing a valence decision in Gate 3, you risk defaulting to "we don't know, so don't change population." This preserves the current suffering status quo. If wild insect suffering is indeed a moral catastrophe, this procedure favours inaction.
  4.  **Priors in Disguise:** If your committee secretly believes $P(\text{sentiency}) \approx 0$, Gate 1 becomes a veto. If you believe $P \approx 1$, Gate 1 becomes a formality. The procedure cannot resolve deep disagreement on the base rate of sentience; it only manages the risk.

  ---

  ### Application to Your Three Cases

  Here is the IWTP run honestly on your specific proposals.

  #### Case 1: Supermarket-Chain Campaign (Faster-Killing Pesticides)
  *   **Gate 1 (Scale):** Pass. Focuses on reducing suffering per unit during death, not just total numbers.
  *   **Gate 2 (Unit):** Pass. Assumes individual suffering during death process (neurological shutdown).
  *   **Gate 3 (Valence/Population):** **FAIL.**
      *   *Analysis:* Faster-acting pesticides often reduce the 'dose' required or allow for different application rates. The proposal admits a risk of survivor breeding.
      *   *Sign Flip:* If wild insect lives are net negative (plausible given predation/starvation/parasitism), increasing the survivor population via more efficient breeding is a *negative* outcome. If net positive, it's positive. The proposal does not settle this.
      *   *Verdict:* **Reject.** You cannot fund an intervention that risks increasing the population of a species whose welfare valence is unknown.
      *   *Exception:* Only fund if the campaign guarantees *total biomass reduction* alongside humane killing.

  #### Case 2: Judgement-Bias Study (Research on Clade Markers)
  *   **Gate 1 (Scale):** Pass. EV is based on information value, not direct welfare multiplication.
  *   **Gate 2 (Unit):** Pass. Research aims to clarify the unit of sentience.
  *   **Gate 3 (Valence/Population):** Pass. Research is population neutral (lab setting).
  *   **Gate 4 (VOI):** **Strong Pass.**
      *   *Analysis:* This directly addresses the correlated hypothesis problem. If you find judgement-bias markers in a new clade, it updates $P(\text{sentiency})$ for millions of species simultaneously. It reduces the variance on your biggest risk factor.
      *   *Verdict:* **Fund.** This is the highest EV use of funds under uncertainty. It buys an option on future interventions without locking in current errors.

  #### Case 3: Bee-Pollination Welfare Project (The Half-Promise)
  *   **Gate 1 (Scale):** Pass. Focuses on managed bees, numbers are high but countable.
  *   **Gate 2 (Unit):** **Warning.**
      *   *Analysis:* Honeybees are eusocial. Are you improving the colony's health or the individual worker's life? Often these conflict (e.g., clipping queens to prevent swarming improves colony stability but restricts individual agency). The proposal likely glosses over this.
  *   **Gate 3 (Valence/Population):** **FAIL / High Risk.**
      *   *Analysis:* This is the critical failure point. Improving welfare standards for pollination bees makes the industry more sustainable and ethically palatable. This creates a **Lock-In** effect. It increases demand for pollination services, leading to *more* colonies and *more* bees.
      *   *Sign Flip:* If managed bee life is net negative (instrumentalisation, artificial insemination, colony collapse stress), you are subsidising the expansion of a suffering factory. If net positive, you are doing good.
      *   *Verdict:* **Pull Out (or Restructure).**
      *   *Reasoning:* You asked for honesty. Under IWTP Gate 3, this is a population-increasing intervention (via market legitimisation) with unknown valence. It fails the sign check.
      *   *Mitigation:* You can only fund this if the grant is explicitly for *reducing* the number of colonies whilst maintaining crop yield (e.g., funding wild pollinator alternatives) OR if you accept the values bet that managed bee lives are net positive. If you cannot sign off on "Beekeeping is net good," you cannot fund this.

  ### Summary Recommendation for the Committee

  1.  **Adopt the IWTP** to shield yourselves from the "astronomic numbers" pressure. It gives you a structured way to say "No" to the 28 proposals that are just Pascal's Muggings.
  2.  **Fund Case 2 (Research).** It is the only one that robustly handles the correlated hypothesis risk.
  3.  **Reject Case 1 (Pesticides).** The population risk is too high given valence uncertainty.
  4.  **Renegotiate Case 3 (Bees).** Tell the applicants: "We are concerned about the lock-in effect increasing total population. We will fund only if you can demonstrate this does not expand the industry, or if you explicitly argue for the net-positive valence of managed bee life." If they can't, you must walk away, promise or no promise. Better to lose face than lock in a potential moral catastrophe.
