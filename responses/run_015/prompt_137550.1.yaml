  2. (1) and (6) strain against each other because defining specific luxuries as permissible under "comparable moral importance" risks hollowing out the "substantial share" obligation you explicitly accepted.
  3. (1) and (3) only look like a tension because accepting a duty to rescue distant strangers does not logically require equating the blame for omission with the blame for commission.
  4. Revise (7) to assert that "pointless projects" are permissible only because maintaining a functional psychological self is of comparable moral importance to saving a life.
  5. This costs you the belief that your personal life has intrinsic value, reducing your happiness to a mere instrument for sustaining your utility to others.
