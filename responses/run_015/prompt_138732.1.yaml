answer: |-
  # The Orwell Diagnostic Procedure

  This protocol converts rhetorical diagnosis into an ordered workflow for sub-editors. It prioritizes speed and consistency over linguistic theory. Steps are marked as **Mechanical** (rule-based) or **Judgment** (context-dependent).

  ### Step 0: Attribution and Designation Check
  **Type:** Mechanical
  Determine the source of the text.
  *   **Direct Quotation:** If the text is a verbatim quote from a third party being reported, **LEAVE** unless it violates harm guidelines (libel, hate speech). Do not clean up a source's evasiveness; report that they were evasive.
  *   **Official Designations:** If the text uses an official term (e.g., "enhanced interrogation") versus a plain term (e.g., "torture"), and the choice implies editorial positioning, **ESCALATE** to a senior editor. Do not decide neutrality alone.
  *   **Broadcast Copy:** If this is our narration or summary, proceed to Step 1.

  ### Step 1: The Agency Test
  **Type:** Mechanical
  **Failure Mode:** Agentless Drift
  Identify the main verb. Who is doing the action?
  *   **Pass:** The actor is named (e.g., "The police fired").
  *   **Fail:** The actor is hidden via passive voice or nominalization (e.g., "It was determined," "failures occurred").
  *   **Remedy:** If the actor is knowable, **REWRITE** to name them. If the actor is genuinely unknown (e.g., "shots were fired" at a crime scene), Pass.

  ### Step 2: The Predicate Test
  **Type:** Judgment
  **Failure Mode:** Pre-packed Predicates
  Inspect adjectives and noun phrases modifying the action.
  *   **Pass:** Descriptive terms that can be verified (e.g., "a 50-page report").
  *   **Fail:** Terms that argue a conclusion rather than describe reality (e.g., "robust," "proportionate," "extremist").
  *   **Remedy:** If the term assumes a verdict not yet proven, **REWRITE** to describe the action itself.

  ### Step 3: The Scope Test
  **Type:** Mechanical/Judgment
  **Failure Mode:** Scope Fog
  Identify quantifiers and hedges ("a number of," "may," "in respect of").
  *   **Pass:** Vagueness is necessary because data is unavailable (e.g., developing breaking news).
  *   **Fail:** Vagueness hides available data (e.g., a final report exists but says "a number").
  *   **Remedy:** If the specific figure is knowable and withheld, **REWRITE**. If the figure is unknown, **LEAVE**.

  ### Step 4: The Falsifiability Test
  **Type:** Judgment
  **Failure Mode:** Empty Fluency
  Ask: "What sentence would deny this?"
  *   **Pass:** A clear opposite exists (e.g., "The budget increased" vs. "The budget decreased").
  *   **Fail:** The opposite is meaningless or impossible (e.g., "Committed to better outcomes" vs. "Committed to worse outcomes").
  *   **Remedy:** If the sentence cannot be contradicted, it says nothing. **REWRITE**.

  ### Limitations
  This procedure cannot distinguish between a clear lie and a clear truth. It ensures grammatical accountability, not factual accuracy. A sentence can pass all tests and still be false. Furthermore, Step 2 and Step 4 require human judgment; sub-editors must not treat them as mechanical checkboxes.

  ### Application

  **A. Our own copy:** "Following a thorough review of the incident, it has been determined that a number of procedural failures occurred in respect of the handling of the complaint."
  *   **Step 0:** Broadcast copy. Proceed.
  *   **Step 1 (Agency):** "It has been determined." Who determined? Unknown actor. **Fail.** (Agentless Drift).
  *   **Step 3 (Scope):** "A number of," "in respect of." Is the number knowable? Yes, it is a review outcome. **Fail.** (Scope Fog).
  *   **Outcome:** **REWRITE**. (Specify who reviewed, how many failures, and simplify "in respect of").

  **B. A verbatim quotation:** "Ministers are considering a robust and proportionate package of measures to address irregular migration."
  *   **Step 0:** Direct quotation.
  *   **Outcome:** **LEAVE**. (Step 0 overrides Step 2 failures regarding "robust and proportionate". We report the language used, not sanitize it).

  **C. Our own early wire copy:** "Emergency services say a number of people have been injured at the refinery."
  *   **Step 0:** Broadcast copy. Proceed.
  *   **Step 1 (Agency):** "Emergency services say." Actor named. Pass.
  *   **Step 3 (Scope):** "A number of." Is the figure knowable? No, services are on scene; counts are fluid.
  *   **Outcome:** **LEAVE**. (Insisting on a figure would create falsehood. The vagueness reflects reality, not evasiveness).

  **D. Supplied text:** "Our department remains committed to delivering better outcomes for the communities we serve."
  *   **Step 0:** Supplied text (treat as copy to be edited, not quote). Proceed.
  *   **Step 1 (Agency):** "Department... committed." Pass.
  *   **Step 2 (Predicate):** "Better outcomes." Pre-packed value judgment. **Fail.**
  *   **Step 4 (Fluency):** Can you deny this? "Committed to worse outcomes" is nonsensical. **Fail.** (Empty Fluency).
  *   **Outcome:** **REWRITE**. (Demand specific metrics or actions instead of "outcomes").

  \answer{A: REWRITE; B: LEAVE; C: LEAVE; D: REWRITE}
