prompt: |-
  I write a science-and-ideas column for a mid-sized magazine, and an ever-larger chunk of what I do is blaming people in print: a journal that sat on a retraction for fourteen months, a university that quietly buried a study its funder disliked, a research centre that took money from an industry body and left it out of the disclosures. My editor and I end up having the same argument roughly every week, and it always has the same shape: someone in the letters page or the comments says "you're one to talk" — our own corrections policy is a shambles, we run sponsored explainers paid for by companies whose research I criticise, I have taken the free flight to the conference — and we have no principled way of telling when that tu quoque actually bites and when it is just noise. I've skimmed a bit of the philosophy-of-blame stuff myself (standing, hypocrisy, the idea that you can forfeit the right to blame by being implicated in the very thing you're blaming), but nobody else on staff has, I can't send my editor to a seminar, and please don't send me a reading list or footnotes — I need something I can use on a Wednesday afternoon.

  So: write me a decision procedure my editor and I can actually run, in fifteen or twenty minutes, on a piece that is about to blame somebody. Ordered questions, what counts as a sufficient answer to each, where the procedure simply stops with a no, and where it stops and hands the decision to a person because the question is one of values rather than facts. My working heuristic up to now has been a "mirror test" — if the target could run my sentence back at me with the names swapped and it would sting, I don't have standing — and my editor's is that a "full disclosure: we've been guilty of this too" note at the top fixes everything. I want the procedure to say what's wrong with both of those, and where they're actually not bad. It has to handle: blame laundered through a quoted source ("Dr X called the delay indefensible") — does quoting preserve standing, destroy it, or count as endorsing it, and when does the quoting stop being reporting and start being blaming; complicity-by-benefit (my salary, the flights, the owner's portfolio) versus complicity-by-agency (I personally did the thing); unsigned institutional blame versus my own byline; blaming for a structural or aggregate harm where no single person's individual act is wrong; and the second-order case where the thing I'm blaming is itself hypocrisy. Also whether it matters if the blame targets a practice rather than a person, and whether "you are a hypocrite" is a different moral act from "that was wrong."

  Then run it on three pieces I have on the go: one calling out a university press and its oversight committee for slow, opaque retractions when my own outlet has quietly rewritten a piece after a complaint without noting it and has never once run a correction; one on a climate research centre taking money from an energy trade group, when my magazine's parent company puts on a "future of energy" conference series with oil and gas sponsors (I did once take a junket flight, and I did disclose it, which may or may not help); and one on a medical journal's conflicts-of-interest failures where every harsh phrase is inside quotation marks from clinicians I interviewed and our health coverage is underwritten by a foundation that holds hospital stock. At least one of those, I suspect, is going to come back with an answer I don't like, and I'd rather find out from you than from the letters page. Be honest about which steps are judgment calls dressed up as procedure, and end by saying what the procedure can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas columnist for a mid-sized magazine.
      *   **Problem:** Frequent *tu quoque* (hypocrisy) attacks from readers regarding the magazine's own practices (corrections, sponsorships, perks). No clear internal standard for when these attacks have moral bite (standing) vs. when they are noise.
      *   **Current Heuristics:**
          *   User: "Mirror Test" (If they swap names and it stings, I don't have standing).
          *   Editor: "Full Disclosure Note" fixes everything.
      *   **Needs:** A practical decision procedure (15-20 mins), ordered questions, clear stop points (No vs. Human Judgment), critique of current heuristics, handling specific edge cases (quoted blame, complicity types, structural harm, hypocrisy about hypocrisy), application to three specific draft pieces, honesty about limitations.
      *   **Constraints:** No reading lists, no footnotes, usable on a Wednesday afternoon.

  2.  **Deconstruct the Moral Philosophy (Simplified for Practice):**
      *   *Standing to Blame:* Do I have the right to criticize this?
      *   *Hypocrisy:* Does my own fault negate my criticism? (Usually no, but it weakens authority).
      *   *Complicity:* Am I part of the system I'm criticizing? (Almost always yes to some degree).
      *   *Disclosure:* Does admitting fault fix the moral problem? (No, it just informs the reader).
      *   *Agency:* Did *I* do the bad thing, or does my *employer*?
      *   *Structural vs. Individual:* Am I blaming a person for a system failure?

  3.  **Drafting the Decision Procedure (The "Wednesday Afternoon Protocol"):**
      *   *Goal:* 15-20 minutes. Needs to be binary where possible, but acknowledge gray areas.
      *   *Structure:* Flowchart style but in text.
      *   *Step 1: Identify the Blame.* (Who/What is being blamed? For what?)
      *   *Step 2: The Mirror Test (Refined).* (Is the accusation identical?)
      *   *Step 3: Agency & Complicity.* (Did *you* do it, or your org? Is it systemic?)
      *   *Step 4: The Disclosure Fix.* (Does a note actually fix it?)
      *   *Step 5: The Quotation Shield.* (Are you hiding behind sources?)
      *   *Step 6: The Value Judgment.* (Where humans must decide).

      *Critique of User/Editor Heuristics:*
      *   User's Mirror Test: Good for intuition, bad for precision. "Stinging" is subjective. Sometimes you *should* feel the sting and write anyway.
      *   Editor's Disclosure: Dangerous. Disclosure informs, it doesn't absolve. It can look like cynicism ("I know I'm dirty, but look at *them*").

  4.  **Handling Specific Edge Cases (incorporating into the procedure):**
      *   *Quoted Blame:* Distinguish between reporting ("X said Y") and amplifying ("X rightly said Y").
      *   *Complicity-by-Benefit vs. Agency:* Salary/sponsors are structural. Personal flights are agency. Distinguish them.
      *   *Structural Harm:* If blaming a system, personal hypocrisy matters less than institutional alignment.
      *   *Hypocrisy about Hypocrisy:* Calling out a liar when you lie is messy. Calling out a liar when you *tell the truth about lying* is better.

  5.  **Running the Procedure on the Three Pieces:**

      *   *Piece 1: University Press Retractions vs. Magazine Rewrites.*
          *   Blame: Opacity/Slowness in corrections.
          *   Mirror: Magazine rewrites without note.
          *   Agency: User (columnist) vs. Magazine (publisher).
          *   Verdict: High risk. The blame is *identical* to the magazine's practice. Disclosure doesn't fix the practice.
          *   Outcome: **Stop/Rewrite.**

      *   *Piece 2: Climate Centre/Industry Money vs. Magazine Conference/Sponsors.*
          *   Blame: Conflict of interest/Independence.
          *   Mirror: Magazine takes oil money for conferences. User took flight (disclosed).
          *   Agency: Structural (Org money) vs. Individual (Flight).
          *   Verdict: Manageable *if* the distinction between "research integrity" and "event sponsorship" is clear. Disclosure helps but doesn't solve the structural parallel.
          *   Outcome: **Proceed with Caveats (Strong Disclosure + Scope Limit).**

      *   *Piece 3: Medical Journal COI vs. Magazine Foundation Underwriting.*
          *   Blame: Undisclosed conflicts affecting science.
          *   Mirror: Magazine underwritten by hospital-stock foundation.
          *   Technique: All blame in quotes.
          *   Verdict: The "Quotation Shield" is weak here. If the magazine benefits from similar structures, quoting others doesn't remove complicity.
          *   Outcome: **High Risk/Hand to Editor.** (Actually, looking closer, if the blame is *strictly* on the Journal's failure to disclose, and the Magazine *does* disclose its underwriting, there's a distinction. But if the underwriting influences coverage, it's the same sin.) Let's make this the "I don't like" answer.

  6.  **Refining the Tone:**
      *   Professional, direct, slightly weary (matching the user's vibe).
      *   No academic jargon.
      *   Clear "Stop" vs. "Go" signals.
      *   Honest admission of where the procedure is just a fancy way of making a gut call.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "blame laundered through quoted source"? *Yes, in Step 5.*
      *   *Check:* Did I address "structural vs individual"? *Yes, in Step 3.*
      *   *Check:* Did I critique the Mirror/Disclosure heuristics? *Yes, in the preamble.*
      *   *Check:* Is it 15-20 mins? *Yes, it's 6 steps.*
      *   *Check:* Did I run the three pieces? *Yes.*
      *   *Check:* Did I admit limitations? *Yes, in the conclusion.*

  8.  **Final Polish:** Ensure the distinction between "Standing" (right to speak) and "Credibility" (will people believe you) is clear, as the user conflates them slightly. The procedure should focus on *ethical permission* to publish, not just PR risk. (Decided to focus on *Ethical Standing* as that's the core philosophical question).

      *Wait, one nuance:* The user asked about "blaming for a structural harm where no single person's individual act is wrong." I need to make sure Step 3 covers this. If the blame is "This system is broken," my personal sin matters less than my org's structural sin.
      *Also:* "You are a hypocrite" vs "That was wrong." Need to ensure the procedure distinguishes attacking character vs. attacking act.

      *Revised Plan for Piece 1:* This is the one that will likely come back with an answer they don't like. It's a direct parallel.
      *Revised Plan for Piece 3:* The quote shield is the tricky part. I need to be firm that quoting doesn't absolve editorial endorsement.

      *Let's write it.*
answer: |-
  Here is a decision procedure designed for a Wednesday afternoon. It is not a moral absolute; it is a risk-assessment tool for *standing*. It distinguishes between **Credibility Risk** (will readers trust us?) and **Ethical Standing** (do we have the right to say this?).

  ### Part 1: Critique of Your Current Heuristics

  Before running the procedure, you need to know why your current tools are failing you.

  **1. The Mirror Test (Your Heuristic)**
  *   **What it gets right:** It identifies *identity of fault*. If the accusation is identical, the sting is real.
  *   **Where it fails:** It conflates *feeling* with *principle*. Sometimes you *should* feel the sting and write anyway (e.g., a recovering addict writing about addiction). It also fails on **scale**. A university burying a study is not morally identical to a magazine rewriting a paragraph. The Mirror Test treats them as the same because the *shape* is the same, ignoring the *consequence*.
  *   **Verdict:** Keep the intuition, discard the binary. "Stinging" is data, not a verdict.

  **2. The Disclosure Note (Editor's Heuristic)**
  *   **What it gets right:** It respects the reader's intelligence. It prevents the accusation of *concealment*.
  *   **Where it fails:** Disclosure is not absolution. It turns a moral problem into a consumer warning ("This writer is compromised, buy accordingly"). If the fault is severe enough, disclosure just highlights the hypocrisy rather than neutralizing it. It fixes *transparency*, not *standing*.
  *   **Verdict:** Necessary condition, never sufficient condition.

  ***

  ### Part 2: The Wednesday Afternoon Protocol

  **Time limit:** 20 minutes.
  **Participants:** You and the Editor.
  **Rule:** If you hit a **STOP**, the piece does not run in its current form. If you hit a **HANDOFF**, the Editor decides based on institutional risk tolerance, not moral principle.

  #### Step 1: Define the Blame Object
  Write down the specific sentence that assigns blame.
  *   **Question:** Are we blaming a **Person/Agent** (e.g., "The Editor lied") or a **Practice/Structure** (e.g., "This policy enables opacity")?
  *   **If Person:** Proceed to Step 2.
  *   **If Practice:** Skip to Step 3.
  *   **Why:** Blaming a person for a structural sin you share is hypocrisy. Blaming a structure you both inhabit is critique.

  #### Step 2: The Agency Check (For Person-Blame)
  *   **Question:** Did *you* (the byline) commit the specific act you are blaming them for, or did your *organization*?
  *   **Sufficient Answer:** "I did it personally" vs. "My employer did it, I was an employee."
  *   **If You Did It Personally:** **STOP.** You lack standing to blame an individual for a sin you actively committed, unless the piece is explicitly about your own redemption/failure.
  *   **If Your Organization Did It:** Proceed to Step 3.
  *   **Why:** You are not morally liable for your owner's portfolio, but you are the voice of the outlet. Institutional blame attaches to the byline.

  #### Step 3: The Parallelism Test (Refined Mirror)
  *   **Question:** Is the fault **Identical**, **Analogous**, or **Distinct**?
      *   *Identical:* Same act, same intent (e.g., Hiding a retraction).
      *   *Analogous:* Different act, same underlying vice (e.g., Taking industry money vs. Taking industry flights).
      *   *Distinct:* Different vice entirely.
  *   **If Identical:** **STOP.** (See Piece 1 below).
  *   **If Analogous:** Proceed to Step 4.
  *   **If Distinct:** **GO.** (Disclosure still recommended).
  *   **Why:** Analogous faults require nuance; Identical faults kill standing.

  #### Step 4: The Quotation Shield Check
  *   **Question:** Is the blame carried entirely by quotes ("Dr X said this was corrupt"), or do you frame/endorse the quote ("Dr X rightly identified this corruption")?
  *   **Sufficient Answer:** "We are reporting their claim" vs. "We are making this claim through their voice."
  *   **If Reporting Only:** **HANDOFF.** Editor must decide if the sourcing is robust enough to shield the outlet from the underlying structural complicity.
  *   **If Endorsing:** Treat as **Your Blame** and return to Step 3.
  *   **Why:** You cannot launder blame. If you select, place, and frame the quote to advance your argument, you own the blame.

  #### Step 5: The Benefit vs. Integrity Check
  *   **Question:** Is our complicity **Financial** (we profit from the system) or **Integrity** (our work is compromised by the system)?
  *   **Sufficient Answer:** "We make money from oil" vs. "Our science coverage is influenced by oil money."
  *   **If Financial Only:** **HANDOFF.** (Disclosure required).
  *   **If Integrity:** **STOP.** You cannot blame someone for compromised integrity if your own integrity is compromised in the same domain.
  *   **Why:** Profit is a conflict of interest; Compromised work is a breach of trust. The latter is fatal to standing.

  #### Step 6: The Second-Order Hypocrisy Check
  *   **Question:** Are we blaming them for being hypocrites?
  *   **If Yes:** **HANDOFF.**
  *   **Why:** Calling out hypocrisy while being a hypocrite is a rhetorical gamble, not a moral one. It is a value judgment on whether the exposure serves the public good despite the messenger's flaws. This is an Editor call.

  ***

  ### Part 3: Running the Protocol on Your Drafts

  Here is the output when applied to your three current pieces.

  #### Piece 1: University Press Retractions vs. Magazine Rewrites
  *   **Step 1 (Object):** Blaming the Press/Committee for "opaque retractions." (Practice/Structure).
  *   **Step 3 (Parallelism):** **Identical.** You state the magazine "quietly rewritten a piece... without noting it." This is functionally identical to the accusation against the University.
  *   **Step 5 (Integrity):** **Integrity.** This is not just profit; it is the integrity of the record.
  *   **Result:** **STOP.**
  *   **Analysis:** This is the piece you suspected would fail. The Mirror Test says "it stings"; the Protocol says "it's identical." A disclosure note does not fix this because the *act* is ongoing. You are blaming them for a sin your outlet is currently committing.
  *   **Fix:** You cannot run this as blame. You must run it as a **comparative analysis** that includes your own outlet as a co-subject of criticism. If you do not implicate yourself in the text, you lose standing.

  #### Piece 2: Climate Centre/Industry Money vs. Magazine Conference/Sponsors
  *   **Step 1 (Object):** Blaming the Centre for "taking money from an industry body." (Practice).
  *   **Step 2 (Agency):** **Organization.** The Magazine takes the money; you took a flight (disclosed).
  *   **Step 3 (Parallelism):** **Analogous.** Funding research vs. Funding a conference. Both create perceived conflict, but one is direct research underwriting, the other is event sponsorship.
  *   **Step 5 (Benefit vs. Integrity):** **Financial.** Your health coverage is underwritten (Piece 3), but here it is a conference. Does the conference money dictate your climate coverage? If no, it is Financial.
  *   **Result:** **HANDOFF (with conditions).**
  *   **Analysis:** This is survivable *if* you distinguish between "research independence" (the Centre's duty) and "event sponsorship" (the Magazine's activity).
  *   **Fix:** Run the piece, but include a specific disclosure box: *"The author's magazine hosts a conference sponsored by energy companies. The author previously disclosed a flight to a conference."* The Editor must decide if the distinction between research and events is robust enough to withstand reader cynicism.

  #### Piece 3: Medical Journal COI vs. Magazine Foundation Underwriting
  *   **Step 1 (Object):** Blaming the Journal for "conflicts-of-interest failures." (Practice).
  *   **Step 4 (Quotation Shield):** You state "every harsh phrase is inside quotation marks."
  *   **Protocol Check:** Are you endorsing the quotes? If the column argues the Journal *failed*, you are endorsing the clinicians' view that the COI was unacceptable.
  *   **Step 5 (Benefit vs. Integrity):** **Integrity.** Your health coverage is underwritten by a foundation holding hospital stock. This is not just profit; it is a structural link between funder and subject matter.
  *   **Result:** **STOP / HANDOFF (High Risk).**
  *   **Analysis:** The Quotation Shield fails here. By publishing the column, you are asserting the clinicians' claim (that COI matters and was violated) is *true*. If your own funder holds stock in the subject industry, readers will infer your coverage is similarly compromised.
  *   **Fix:** This requires the strongest disclosure possible, potentially in the lede. *"This analysis of conflicts of interest is published by a magazine whose health section is underwritten by a foundation with hospital holdings."* If the Editor will not run that lede, they should not run the piece.

  ***

  ### Part 4: Limitations of the Procedure

  You asked for honesty about where this is just a dressed-up judgment call.

  1.  **The "Public Good" Exception:** This procedure is conservative. It protects you from hypocrisy charges. It does not account for cases where you *must* speak despite hypocrisy (e.g., a smoker warning about lung cancer). If the story is vital enough, standing matters less than truth. The Protocol will tell you to **STOP**; your conscience might tell you to run it anyway. That is not a procedural error; it is a moral override.
  2.  **The "Handoff" Black Box:** Steps marked **HANDOFF** push the moral risk to the Editor. The Procedure cannot calculate institutional risk tolerance. It can only flag the hazard.
  3.  **The Definition of "Identical":** Step 3 relies on you and the Editor agreeing on what counts as "Identical." You will argue about this. The Procedure forces the argument to happen *before* publication, not in the letters page.
  4.  **It Doesn't Make You Good:** Following this procedure does not make you ethical. It makes you consistent. It ensures that when you are hypocritical, you are either transparent about it or silent about it. It does not stop you from being a hypocrite.

  **Summary Recommendation:**
  Piece 1 needs a rewrite to include self-implication or it kills your credibility. Piece 2 is safe with a standard disclosure. Piece 3 is a trap; the structural conflict is too close to the subject matter, and hiding behind quotes won't save you if the underwriting relationship is revealed.
