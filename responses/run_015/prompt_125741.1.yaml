          *   Distinctions to preserve.
          *   Boundary cases to adjudicate.
          *   Consistency with developmental neuroscience.
          *   Motivating cases/considerations for each.
          *   Status: Non-negotiable vs. Camp Commitments.
          *   Joint Unsatisfiability: Identify tensions/conflicts.
      *   **Specific Topics to Address:**
          *   Top-down influences (expectation) vs. post-perceptual reinterpretation.
          *   "Cognitive Lensing" (voluntary, real-time subcortical modulation).
          *   Vertical (intra-modality) vs. Lateral (inter-modality) penetration.
          *   Developmental calibration (adolescence/neural plasticity).
          *   Tension: Sensory registration vs. Perceptual judgment vs. Early encoding.
      *   **Comparative Analysis:** Briefly assess Pylyshyn (Modularist) vs. Macpherson (Penetration-Affirming) against these criteria.
      *   **Constraint:** Focus on criteria and conflicts, not a full literature review/citation list.

  2.  **Drafting the Desiderata (The Framework):**

      *   *Requirement 1: The Phenomenological/Epistemic Distinction.*
          *   Need to distinguish actual perceptual change from belief/judgment change.
          *   *Motivation:* The "epistemic downgrade" argument (if perception is biased by belief, it loses justificatory power).
          *   *Status:* Non-negotiable for the debate to exist.
      *   *Requirement 2: The Causal/Functional Criterion.*
          *   Need to define *where* in the processing stream the influence happens.
          *   *Motivation:* Distinguishing early vision (encapsulation) from late vision (integration).
          *   *Status:* Non-negotiable (defines the "perceptual" part).
      *   *Requirement 3: The "Cognitive Lensing" Case.*
          *   Voluntary, subcortical modulation.
          *   *Motivation:* Tests the "cognitive" vs. "attentional" boundary.
          *   *Status:* Boundary case/Adjudication needed.
      *   *Requirement 4: Vertical vs. Lateral.*
          *   Intra-modal vs. Inter-modal.
          *   *Motivation:* Multisensory integration vs. conceptual influence.
          *   *Status:* Camp Commitment (Modularists might lump them as non-penetration; Penetrationists might distinguish).
      *   *Requirement 5: Developmental Plasticity.*
          *   Long-term learning vs. Online penetration.
          *   *Motivation:* Neuroscience shows V1 changes with learning. Is this penetration?
          *   *Status:* Joint Unsatisfiability risk (Plasticity looks like penetration but violates "online" constraints).
      *   *Requirement 6: The Registration/Judgment Tension.*
          *   Sensory input vs. Cognitive interpretation.
          *   *Motivation:* Preserving the input system's role as an objective check on thought.
          *   *Status:* Non-negotiable (Core philosophical stake).

  3.  **Refining and Categorizing (Non-negotiable vs. Camp Commitments):**

      *   *Non-negotiable:* Must define "perception" vs. "cognition," must account for the causal link, must align with basic neuroanatomy (retina -> LGN -> V1).
      *   *Camp Commitments:* Modularity (Fodor/Pylyshyn) demands encapsulation. Penetrationists (Macpherson/Lupyan) demand semantic influence.
      *   *Conflicts:* The "Plasticity vs. Online" conflict. If long-term learning changes V1, is it penetration? If yes, modularity dies. If no, what is it? Also, the "Attention" mediator problem. If attention mediates, is it still *cognitive* penetration or just *attentional* modulation?

  4.  **Addressing Specific Prompts within the Framework:**

      *   *Top-down vs. Post-perceptual:* Needs a criterion of *content* and *timing*.
      *   *Cognitive Lensing:* Needs a criterion of *voluntariness* vs. *automaticity* and *subcortical access*.
      *   *Vertical vs. Lateral:* Needs a criterion of *semantic coherence* vs. *signal integration*.
      *   *Developmental:* Needs a criterion of *timescale* (online vs. offline).
      *   *Registration vs. Judgment:* Needs a criterion of *justificatory role*.

  5.  **Developing the "Joint Unsatisfiability" Section:**

      *   This is crucial. I need to find a trilemma or dilemma.
      *   *Candidate:* The "Attention Mediator" trilemma.
          1.  Penetration must be direct (semantic).
          2.  Attention is non-semantic (causal filter).
          3.  All top-down effects seem mediated by attention.
          *   *Result:* If 2 & 3 are true, 1 is false (no penetration, just attention).
      *   *Candidate:* The "Plasticity vs. Encapsulation" dilemma.
          1.  Modularity requires fixed early processing.
          2.  Neuroscience shows early processing changes with learning (plasticity).
          3.  We want to preserve Modularity.
          *   *Result:* 1 & 2 contradict 3.
      *   *Selection:* I will focus on the tension between *Online Causal Influence* and *Developmental Plasticity* alongside the *Attention Mediator* problem. These create the hardest constraints.

  6.  **Drafting the Comparative Assessment (Pylyshyn vs. Macpherson):**

      *   *Pylyshyn:* Strong on Registration/Judgment distinction. Strong on Modularity. Weak on explaining away V1 plasticity (must call it post-perceptual). Fails "Cognitive Lensing" (calls it attention).
      *   *Macpherson:* Strong on explaining phenomenological changes. Strong on allowing semantic influence. Weak on preserving epistemic justification (admits downgrade). Struggles with the Attention Mediator (must argue attention isn't a barrier).

  7.  **Review and Refine:**

