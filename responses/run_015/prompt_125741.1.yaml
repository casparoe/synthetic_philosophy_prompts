          *   Registration/Judgment? Yes (Desideratum 5).
      *   *Check:* Did I flag Non-negotiable vs. Camp? Yes.
      *   *Check:* Did I identify Joint Unsatisfiability? Yes.
      *   *Check:* Did I compare Pylyshyn/Macpherson briefly? Yes.

  8.  **Final Polish:** Ensure clear headings and logical flow. Make sure the "Joint Unsatisfiability" section is prominent as requested. (Self-Correction: Make sure to explicitly define "Cognitive Lensing" in the context of the framework as requested). Ensure the distinction between *vertical* and *lateral* is clear.

      *(Self-Correction during drafting)*: I need to be careful with the term "subcortical" in the Lensing prompt. Usually, penetration debates focus on V1 (cortical). If the prompt specifies *subcortical* (e.g., LGN or superior colliculus), that makes the bar for penetration *higher* because cognition is usually associated with cortex. I need to make sure the framework addresses whether *subcortical* modulation counts as perceptual change or just gain control. I will treat it as a boundary case for "early vision."

      *(Refining the Plasticity point)*: The prompt asks about adolescence/developmental calibration. This is long-term. Penetration is usually defined as *online* (state-dependent). The framework must distinguish *state* penetration from *trait* plasticity. This is a key conflict point.

      *(Refining the Pylyshyn/Macpherson comparison)*: Keep it brief. Focus on how they handle the *conflicts* identified in the framework.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Evaluation Framework for Theories of Cognitive Penetration of Perception (CPP)

  This framework establishes the desiderata required for an adequate theory of Cognitive Penetration. It is designed to test the internal coherence of a theory, its empirical adequacy, and its philosophical utility. The criteria are divided into **Non-Negotiable Constraints** (required for the debate to remain intelligible) and **Camp Commitments** (reflecting specific theoretical allegiances).

  ---

  ## I. Desiderata and Motivating Considerations

  ### 1. The Phenomenological-Causal Criterion
  **Requirement:** The theory must distinguish between a change in *how the world looks* (phenomenology) and a change in *what the subject believes they see* (judgment), grounded in a specific causal pathway within the perceptual system.
  *   **Motivating Case:** The "Dress" illusion or color-constancy shifts. If a subject expects a banana to be yellow, does it *look* more yellow (penetration), or do they simply *judge* it to be yellow despite ambiguous input (post-perceptual inference)?
  *   **Status:** **Non-Negotiable.** Without this, "perception" collapses into "belief," dissolving the epistemic role of perception.
  *   **Adjudication Mechanism:** Must specify a temporal window (e.g., <150ms latency) or a neural locus (e.g., V1 vs. IT cortex) where the influence occurs to count as perceptual.

  ### 2. The "Cognitive Lensing" Adjudication
  **Requirement:** The theory must determine whether voluntary, real-time modulation of subcortical processing (e.g., altering gain control in the LGN or superior colliculus via biofeedback or intense training) counts as penetration.
  *   **Motivating Case:** A subject learns to voluntarily suppress motion noise to enhance edge detection without changing retinal input.
  *   **Status:** **Boundary Case.**
  *   **Decision Grounds:**
      *   *If Counted as Penetration:* The definition of "cognitive" must expand to include voluntary attentional control mechanisms that access subcortical loops.
      *   *If Excluded:* The theory must prove this is merely "attentional modulation" (causal filter) rather than "semantic influence" (content-altering).
      *   *Constraint:* If the mechanism is voluntary, it risks conflating *action* (controlling perception) with *passivity* (undergoing perception).

  ### 3. The Vertical vs. Lateral Unification
  **Requirement:** The theory must either unify vertical penetration (cognition $\to$ vision) and lateral penetration (audition $\to$ vision) under a single mechanism or provide a principled reason to treat them differently.
  *   **Motivating Case:** The McGurk effect (lateral) vs. seeing a red object while thinking "danger" (vertical).
  *   **Status:** **Camp Commitment.**
      *   *Modularist View:* Treat both as multi-sensory integration modules distinct from "central" cognition. Neither is penetration.
      *   *Penetrationist View:* If lateral counts, vertical should too, provided the influence is semantic/conceptual rather than mere signal boosting.
  *   **Justification Needed:** If separated, the theory must explain why cross-modal signal integration is "perceptual" but cross-system conceptual influence is not (or vice versa).

  ### 4. The Developmental Plasticity Constraint
  **Requirement:** The theory must distinguish between *online* cognitive penetration (state-dependent) and *offline* developmental calibration (trait-dependent neural plasticity).
  *   **Motivating Case:** Adolescent training in radiology reshapes V1 responses to X-rays. Is this penetration?
  *   **Status:** **Non-Negotiable (with nuance).**
  *   **Decision Grounds:**
      *   *Exclusion:* If penetration requires *current* cognitive states to alter processing, long-term structural plasticity is excluded.
      *   *Inclusion:* If penetration is defined by the *source* of the tuning (conceptual categories), developmental plasticity is a form of "slow" penetration.
      *   *Neuroscience Consistency:* Must align with findings that V1 is plastic but early subcortical relays are relatively fixed.

  ### 5. The Registration-Judgment Tension (The Epistemic Constraint)
  **Requirement:** The theory must preserve a functional distinction between sensory registration (input) and perceptual judgment (output) sufficient to allow perception to justify belief.
  *   **Motivating Case:** If a racist belief makes a neutral face *look* hostile, perception loses its ability to test the belief.
  *   **Status:** **Non-Negotiable.**
  *   **Decision Grounds:** The theory must explain how perception retains *independence* even if it is penetrable. (e.g., Is it independent of *some* beliefs, even if influenced by *others*?)

  ---

  ## II. Joint Unsatisfiability and Structural Conflicts

  The following subsets of desiderata appear jointly unsatisfiable, creating trilemmas that any theory must navigate by sacrificing one constraint or redefining terms.

  ### Conflict A: The Attention Mediator Trilemma
  1.  **Directness:** Genuine penetration requires a direct semantic link between cognition and perception (not mediated by non-semantic factors).
  2.  **Empirical Reality:** All observed top-down effects on early vision appear mediated by spatial or feature-based attention.
  3.  **Attention Definition:** Attention is a causal resource allocator, not a semantic processor.
  *   **Resolution:** A theory must deny (1) (allowing attention to count as the vehicle of penetration), deny (2) (claiming direct pathways exist), or deny (3) (arguing attention is cognitively saturated). *Pylyshyn accepts (1), (2), and (3), concluding no penetration. Macpherson denies (1) or (3).*

  ### Conflict B: The Plasticity vs. Encapsulation Dilemma
  1.  **Modularity:** Early vision is encapsulated (fixed algorithm, informationally isolated).
  2.  **Neuroscience:** Early visual cortex (V1) response properties change with conceptual learning (plasticity).
  3.  **Penetration Definition:** Penetration is an *online* causal influence, not structural rewiring.
  *   **Resolution:** If (2) is true, (1) is false *unless* V1 changes are deemed post-perceptual feedback (redefining "early"). If V1 changes are structural, they violate (3), meaning developmental learning is not "penetration" but "tuning." *A theory cannot hold strong Modularity, accept V1 plasticity as conceptual, and maintain an Online definition of penetration simultaneously.*

  ### Conflict C: The Volition Paradox (Cognitive Lensing)
  1.  **Perceptual Passivity:** Perception is fundamentally passive (we undergo it).
  2.  **Cognitive Lensing:** Subjects can voluntarily modulate low-level features.
  3.  **Penetration Status:** Cognitive Lensing counts as penetration.
  *   **Resolution:** If (2) and (3) are true, (1) is threatened. If perception is voluntarily controllable at the subcortical level, the distinction between perceiving and imagining/acting blurs. *A theory must either exclude Lensing from penetration or redefine perception to allow for voluntary control.*

  ---

  ## III. Comparative Assessment: Pylyshyn vs. Macpherson

  ### Zenon Pylyshyn (Modularist / Early Vision Encapsulation)
  *   **Performance on Desiderata:**
      *   **Phenomenological-Causal:** **Strong.** Maintains a strict line: if it looks different, it is either attention or judgment, not penetration.
      *   **Cognitive Lensing:** **Excludes.** Classifies voluntary modulation as attentional control, not cognitive penetration. Preserves the "passivity" of perception.
      *   **Vertical/Lateral:** **Unifies (Negatively).** Treats both as modular interactions, not cognitive penetration.
      *   **Developmental:** **Excludes.** Classifies plasticity as system tuning, not online penetration.
      *   **Registration-Judgment:** **Strong.** Preserves the epistemic role of perception by walling it off from belief.
  *   **Failure Point:** Struggles with **Conflict B (Plasticity).** Must argue that V1 changes are either non-conceptual or functionally post-perceptual despite neural location. This risks becoming unfalsifiable (moving the "perceptual" boundary to suit the theory).

  ### Fiona Macpherson (Penetration-Affirming / Liberal Individuation)
  *   **Performance on Desiderata:**
      *   **Phenomenological-Causal:** **Strong.** Accepts phenomenological change as evidence of penetration.
      *   **Cognitive Lensing:** **Includes.** Willing to count voluntary modulation as penetration if the content is cognitive.
      *   **Vertical/Lateral:** **Distinguishes.** Focuses on vertical (concept-to-sense) as the philosophically crucial case for epistemology.
      *   **Developmental:** **Ambiguous.** Risks conflating long-term plasticity with online penetration unless a timescale constraint is added.
      *   **Registration-Judgment:** **Weak.** Admits the "Epistemic Downgrade." Perception loses some justificatory power if penetrated by biased beliefs.
  *   **Failure Point:** Struggles with **Conflict A (Attention).** Must argue that attention is not a "barrier" to penetration, or that attention itself is cognitively saturated. Risks collapsing the distinction between *causing* a perception (via attention) and *constituting* a perception (via content).

  ### Summary of Resolution Strategy
  To resolve the conflicts mapped above, your independent study should look for a theory that:
  1.  **Redefines Attention:** Treats attention not as a neutral filter but as a cognitively imbued selector (resolves Conflict A).
  2.  **Distinguishes Timescales:** Rigorously separates *state* penetration (online) from *trait* plasticity (developmental) to satisfy Neuroscience without killing Modularity entirely (resolves Conflict B).
  3.  **Limits Volition:** Excludes "Cognitive Lensing" from penetration proper to preserve the passivity required for perceptual justification (resolves Conflict C).

  **Verdict:** Pylyshyn satisfies the Epistemic Constraint (Desideratum 5) better but fails empirical adequacy regarding plasticity. Macpherson satisfies empirical adequacy better but threatens the Epistemic Constraint. An adequate theory must navigate the **Plasticity vs. Encapsulation Dilemma** without rendering the term "perception" vacuous.
