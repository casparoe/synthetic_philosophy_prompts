  These are two distinct phenomena with different causes, though they produce the same feeling of instability. The first case is a logical inconsistency. When you assess "ships" separately from "which quarter," you are using different mental shortcuts than when you assess all five options together. This is a failure of *coherence* in your judgment process; the math of probability demands the numbers match, but your brain takes shortcuts based on how much attention each option grabs. The second case is actually a rational update. When you shade based on track record, you are treating your own past overconfidence as new evidence about your own reliability. The principle dividing them is the *source of variation*. In the first, the variation comes from arbitrary framing (a bug in judgment). In the second, the variation comes from meta-knowledge about your reliability (a feature of learning). They unify only in showing that "belief" is not a fixed number waiting to be read, but a value constructed during elicitation.

  Nearest neighbours, and why each is not quite it
  First, *gaming a score* is deliberately lying to maximize points. Your case is not this; you are trying to be honest, but honesty feels ambiguous because your internal signal is unstable. Second, *compression* suggests your belief is a range, not a point, so any number loses information. While true, partition dependence is not just about precision; it is about directionality shifting based on framing, which compression does not explain. Third, *track record as evidence* is exactly your second instance. The difference is philosophical: is your "true belief" the raw intuition or the corrected one? Most experts say the corrected one is the true belief, making this valid updating, not distortion. Fourth, *propriety* is a property of a scoring rule, which is a system that grades accuracy such that you maximize your score only by reporting your true belief. Your case is not a failure of propriety; the rule works. The failure is in the assumption that you possess a single, stable honest number to report. Finally, *risk aversion* is a missing candidate where you shade numbers because you fear the penalty of being wrong at 95% more than the reward of being right. This is distinct from calibration; it is about pain avoidance rather than accuracy correction. Your description suggests accuracy correction, not fear.

  The edge case
  Your "delayed versus cancelled" example is the crucial test. The general test is *Logical Additivity*. If you split a bucket into sub-buckets, the sum of the sub-buckets should equal the original bucket. If splitting "No Ship" into "Delayed" and "Cancelled" makes you realize "Cancelled is very unlikely," and you adjust "Delayed" up while keeping the total "No Ship" roughly stable, that is *refinement*. You discovered hidden structure. If splitting them causes the total probability of "No Ship" to jump arbitrarily because you are now thinking about more reasons for failure, that is *partition dependence*. A valid case is splitting "Candidate Wins" into "Wins by Landslide" and "Wins Narrowly," which reveals different mechanisms and legitimately changes the total assessment. An invalid case is splitting "Die shows 6" into "Die shows 6 and Coin Heads" plus "Die shows 6 and Coin Tails," which should not change the probability of the die showing 6 unless you introduce bias about the coin.

  Does the choice of rule matter
  The choice of scoring rule does not cause this, but it changes the pressure. Both the quadratic rule (Brier score) and the logarithmic rule are *proper*, meaning both theoretically reward your true belief. However, the logarithmic rule punishes extreme errors much more severely. This might make the calibration shading in your second instance feel more urgent, because being wrong at 95% costs far more in log score than in quadratic score. The partition dependence in the first instance is independent of the rule; it is a flaw in human judgment that any proper rule will expose. So, you have not found a flaw specific to the quadratic convention, but a limitation of applying any precise mathematical rule to imprecise human cognition.

  What I should call it
  I recommend calling this *Elicitation Dependence*.
  Definition: The phenomenon where a forecaster's reported probability varies based on the structure of the question or the scoring context, rather than solely on the underlying event information.
  Instance: Assigning different probabilities to "No Ship" depending on whether quarters are listed as separate options.
  Non-Instance: Changing a probability because new information about the product launch arrived.
