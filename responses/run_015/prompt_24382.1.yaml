      *   **Goal:** A concrete, repeatable decision procedure based on real theory (Kolmogorov, MDL, Solomonoff), acknowledging uncomputability and proxies.
      *   **Constraints:**
          *   Fixed order of questions.
          *   Clear stopping rules (when to stop math and start judgment).
          *   No "count the parameters" simplification (acknowledge structural complexity).
          *   Must be honest about uncomputability (Kolmogorov/Solomonoff are theoretical limits, not calculable metrics).
          *   Must run the procedure on two specific cases (3-param vs. 12-param; 100-param formulaic vs. 5-param hand-set).
          *   One case must yield an uncomfortable answer.
          *   Must highlight limitations/failure modes.
          *   Time limit: User has 30 mins before review (implies the procedure itself must be quick to execute, even if the explanation is detailed).
          *   Audience: User (quant) + PM (non-quant). Needs a one-paragraph non-technical justification.
          *   Tone: Expert, straight-talking, pragmatic, defensive (ready for a skeptical boss).

  2.  **Deconstruct the Theory:**
      *   *Kolmogorov Complexity:* Length of the shortest program producing the data. Uncomputable.
      *   *Solomonoff Induction:* Weighted sum of all programs. Uncomputable.
      *   *Minimum Description Length (MDL):* The practical proxy. Total length = Length(Model) + Length(Data | Model).
      *   *Bayesian Information Criterion (BIC) / Akaike (AIC):* Approximations of MDL under specific assumptions (Gaussian errors, large N, etc.).
      *   *Cross-Validation:* Empirical proxy for generalization error (often better than information criteria for finite data).
      *   *The "Real" Insight:* Simplicity isn't about parameter count; it's about *compressibility*. A model is "simple" if the code to generate it + the code to encode the residuals is short.

  3.  **Design the Decision Procedure (The "MDL-Check"):**
      *   Need to translate "Description Length" into something a quant desk can calculate in 30 minutes.
      *   *Step 1: Out-of-Sample Fit (The Data Length).* Don't trust in-sample. Use walk-forward or cross-validation. This proxies $L(Data | Model)$.
      *   *Step 2: Model Encoding Cost (The Model Length).* This is where parameter count fails. Need to account for *precision* and *structure*. A parameter set to 0.333333 is cheaper than 0.337192 if the former is hard-coded.
      *   *Step 3: The Penalty Threshold.* How much worse fit is acceptable for how much simplicity? (The "exchange rate").
      *   *Step 4: The Human Handoff.* Where does math end? When the "bits" are within noise.

  4.  **Drafting the Procedure Steps:**
      *   *Q1: Out-of-Sample Error.* (Proxy for $L(Data|Model)$).
      *   *Q2: Structural Description Length.* (Proxy for $L(Model)$). Not just $k$, but bits to specify parameters.
      *   *Q3: The MDL Sum.* Compare Total Lengths.
      *   *Q4: Stability Check.* (Sensitivity to data perturbation).
      *   *Stop Rule:* If $\Delta MDL < \epsilon$, hand to human.

  5.  **Addressing the "Uncomputable" Honesty:**
      *   Must explicitly state: "We are not calculating Kolmogorov complexity. We are calculating a lower-bound proxy using BIC/MDL logic adjusted for parameter precision."
      *   The load-bearing proxy is *Cross-Validated Loss + Parameter Precision Cost*.

  6.  **Running the Cases:**
      *   *Case 1 (3-param vs 12-param):* Standard trade-off. 12-param fits better in-sample. Need to see OOS. If OOS is same, 3-param wins. If 12-param OOS is significantly better, it might justify the cost.
      *   *Case 2 (100-param formula vs 5-param hand-set):* This is the trap. 100 params *looks* complex. But if they are $w_i = \sin(i)/i$, the description length is tiny (the formula). The 5-param hand-set might require 5 floats of high precision.
      *   *Uncomfortable Answer:* The procedure should likely favor the 100-param formulaic model over the 5-param hand-tuned one, because the *information content* is lower, even if the parameter count is higher. This contradicts the "parsimony = few parameters" heuristic most PMs hold.

  7.  **Drafting the PM Justification:**
      *   No jargon ("prior", "likelihood", "Kolmogorov").
      *   Focus on "robustness" and "cost of being wrong."
      *   Analogy: "Packing a suitcase" or "Compressing a file."

  8.  **Refining the Tone:**
      *   Direct, slightly cynical about "theoretical purity," focused on P&L.
      *   Acknowledge the 30-minute constraint (keep the procedure actionable).
      *   Admit where the model fails (regime change, black swans).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Parameter Precision Cost" too hard to calculate in 30 mins?
      *   *Fix:* Simplify. Use BIC as the baseline but adjust for "hard-coded" vs "fitted" parameters. Or use a simplified MDL estimate: $N \cdot \log(MSE) + k \cdot \log(N)$. Wait, the prompt says *don't* just count parameters.
      *   *Better approach:* Distinguish between *structural parameters* (hyperparameters/formula) and *fitted coefficients*. The 100-param formula has 0 fitted coefficients (if the formula is fixed) or very few (parameters of the formula).
      *   *Revised Procedure:* Focus on "Bits to transmit the model."
      *   *Case 2 nuance:* If the 100 params are generated by a formula, the "Model Length" is the length of the formula code, not 100 floats. This is the key insight.
      *   *Time Check:* The user has 30 mins. The procedure needs to be executable *now*. I need to provide the *framework* they can use repeatedly, but also solve the specific cases *now* as examples.
      *   *Wait, re-reading constraint:* "This should be a reusable procedure, not an answer for this week's specific choice." BUT "Then run the procedure on two cases." Okay, I provide the procedure *and* demonstrate it on the cases.
      *   *Critical:* The prompt asks for a decision procedure *my team can run*. It also asks me to run it on the cases. I need to make sure the procedure is distinct from the case analysis.
      *   *Critical:* "One paragraph justification I can read to her."

  10. **Finalizing the Procedure Structure:**
      *   **Name:** The Compressibility Test (MDL-Proxy).
      *   **Step 1:** OOS Performance (Data Fit).
      *   **Step 2:** Transmission Cost (Model Complexity). *Crucial:* Distinguish between "Fitted Coefficients" (expensive) and "Algorithmic Rules" (cheap).
      *   **Step 3:** The Trade-off Calculation.
