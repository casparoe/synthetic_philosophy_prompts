      *   Actually, to be truly helpful, I should ensure the procedure highlights *risk*. A 100-param model, even if formulaic, might be brittle if the formula breaks. I will note this in the "Human Handoff" section.
      *   Let's make Case 1 the one where the procedure says "Pick the worse fit" (the simpler one), which traders hate. Or Case 2 where it says "Pick the 100-param one," which risk managers hate. Let's go with Case 2: The 100-param formulaic model wins on MDL, but feels risky. This highlights the tension between *description length* and *structural risk*.

