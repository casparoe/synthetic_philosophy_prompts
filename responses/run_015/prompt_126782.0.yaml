answer: |-
  # The Intuition Pump Stress Test (IPST)
  **Protocol Version:** 1.0 (Internal Advisory Board Use)  
  **Estimated Time:** 20 Minutes  
  **Objective:** To distinguish thought experiments that clarify conceptual boundaries from those that smuggle normative conclusions via framing, suppression, or hidden commitments.

  ## Part I: The Audit Procedure

  **Instructions:** Read the position paper's core thought experiment. Highlight the descriptive text of the scenario separately from the author's conclusion. Proceed through the five steps sequentially. If a step yields a **FAIL**, the argument is flagged for "High Risk of Rhetorical Smuggling." If a step yields **DEFER**, the analyst must record a qualitative justification; the audit does not resolve the issue mechanically.

  ### Step 1: Variable Isolation (The "One Change" Rule)
  **Action:** Identify the specific variable the author claims is driving the intuitive result (e.g., "biological substrate," "number of victims," "presence of consent"). Scan the text for other differences between the control case and the test case.
  *   **PASS:** Only the target variable changes. All other conditions (environment, agent capabilities, stakes) remain linguistically constant.
  *   **FAIL:** Confounding variables are present (e.g., changing the substrate *and* the connectivity; changing the number of victims *and* the certainty of outcome).
  *   **DEFER:** The text implies background changes are "negligible" without justification.
  *   **Likely Misfire:** *The Package Deal.* The author bundles the target variable with a second, unstated variable (e.g., equating "silicon" with "lack of warmth").
  *   **Stop Point:** If **FAIL**, terminate audit. Classify as "Confounded."

  ### Step 2: The Adjective Audit (Emotional Loading)
  **Action:** Highlight all adjectives, adverbs, and nouns with inherent positive or negative valence (e.g., "cold," "gruesome," "mere," "sacred," "bureaucratic").
  *   **PASS:** Descriptive language is neutral or technical (e.g., "numerical," "structural," "agent").
  *   **FAIL:** Valence-heavy language is used to describe the *setup* rather than the *outcome* (e.g., "the *ruthless* algorithm" vs. "the algorithm selects").
  *   **DEFER:** Terms are technically precise but culturally loaded (e.g., "natural," "artificial").
  *   **Likely Misfire:** *The Affective Prime.* The setup triggers an emotional response that predetermines the conclusion before the logic is processed.
  *   **Stop Point:** If **FAIL**, terminate audit. Classify as "Loaded."

  ### Step 3: The Slider Test (Boundary Conditions)
  **Action:** Mentally adjust the quantitative or qualitative intensity of the scenario by an order of magnitude (e.g., 1 person to 1 million; 1 neuron to 100%; 1 second to 100 years).
  *   **PASS:** The intuitive verdict remains stable or shifts linearly/predictably.
  *   **FAIL:** The intuitive verdict flips abruptly without a logical breakpoint, or the scenario becomes incoherent at the extremes.
  *   **DEFER:** The scenario relies on a specific threshold that is philosophically contested (e.g., "personhood").
  *   **Likely Misfire:** *The Sorites Trap.* The pump relies on a specific number to force a binary choice where a spectrum exists.
  *   **Stop Point:** If **FAIL**, terminate audit. Classify as "Unstable."

  ### Step 4: The Policy Bridge (The Is-Ought Gap)
  **Action:** Compare the conclusion of the thought experiment (a metaphysical or moral claim) with the policy recommendation (a regulatory or procedural claim).
  *   **PASS:** The policy is a direct, narrow implementation of the conceptual clarification.
  *   **FAIL:** The policy leap requires additional empirical premises or value judgments not contained in the experiment (e.g., moving from "consciousness is X" to "therefore we must ban Y").
  *   **DEFER:** The policy is framed as a "heuristic" or "guideline" rather than a mandate.
  *   **Likely Misfire:** *The Normative Jump.* Using a conceptual truth to bypass democratic deliberation on value trade-offs.
  *   **Stop Point:** If **FAIL**, terminate audit. Classify as "Overreach."

  ### Step 5: The Mirror Test (Reversibility)
  **Action:** Construct a counter-scenario in your head that inverts the descriptive features but keeps the logical structure identical. (e.g., If the argument is "Uploads aren't human because they lack bodies," ask "Are humans without bodies [e.g., in a coma] not human?")
  *   **PASS:** The counter-scenario yields a consistent intuition, or the author has already addressed this symmetry.
  *   **FAIL:** The counter-scenario yields the opposite intuition, revealing the original pump relied on specific imagery rather than logic.
  *   **DEFER:** The counter-scenario is impossible to construct without changing the definition of terms.
  *   **Likely Misfire:** *The Salience Bias.* The original scenario is vivid; the mirror is abstract.
  *   **Stop Point:** End of Audit.

  ---

  ## Part II: Application to Case Studies

  ### Case 1: Autonomous Vehicles & The Trolley Problem
  **Scenario:** A regulatory proposal argues that AV algorithms must be programmed to minimize total loss of life in unavoidable accidents, citing the standard Trolley Problem (switch track to save five, kill one) as proof that utilitarian calculation is the only moral baseline.
  **Audit Run:**
  1.  **Variable Isolation:** **FAIL.** The Trolley Problem assumes *certainty* of death and *binary* choice. Real-world AV scenarios involve *probability* of injury, *braking* options, and *traffic law* violations. The scenario changes "uncertainty" to "certainty" alongside the "calculation" variable.
  2.  **Adjective Audit:** (Skipped due to Step 1 Fail).
  3.  **Verdict:** **Confounded.**
  **Analysis:** The audit correctly identifies that the thought experiment suppresses the context of uncertainty and liability. The vividness of the switch lever smuggles in the idea that AVs face discrete, binary ethical choices rather than continuous risk management.
  **Limitations Note:** The audit catches the *structural* confound but cannot fully account for the *pedagogical* value. Even if confounded, the Trolley Problem may still be useful for public engagement, which the audit treats as a risk rather than a feature.

  ### Case 2: Neural Replacement & Consciousness (The Counter-Intuitive Verdict)
  **Scenario:** A paper argues that consciousness is not essentially biological. It posits a scenario where a human's neurons are replaced one-by-one with functionally identical silicon chips. The subject reports no change in experience. The author concludes substrate independence is proven.
  **Audit Run:**
  1.  **Variable Isolation:** **PASS.** The text carefully holds function constant while changing substrate.
  2.  **Adjective Audit:** **PASS.** Language is technical ("functional isomorph," "substrate").
  3.  **The Slider Test:** **DEFER.** If we replace 100% of neurons, does the "subject" remain? The text asserts continuity, but this is the contested point. (Analyst notes: This is a known philosophical boundary, not necessarily a rhetorical trick).
  4.  **The Policy Bridge:** **FAIL.** The paper moves from "Consciousness is substrate-independent" to "Therefore, regulatory protections for 'biological safety' in AI development are obsolete."
  5.  **Verdict:** **Overreach.**
  **Analysis:** Here the audit returns a verdict that runs against the **intuitive plausibility** of the argument within the philosophy of mind community. The "Gradual Replacement" is a respected, classic intuition pump (e.g., Chalmers). It *feels* clarifying. However, the IPST flags it at Step 4 because the metaphysical conclusion (substrate independence) does not mechanically justify the policy conclusion (deregulating biological safety). The audit treats the leap from *ontology* to *regulation* as a smuggling of normative risk tolerance.
  **Why this matters:** The audit is designed for *policy* review, not *truth* seeking. It correctly identifies that even a philosophically sound thought experiment can be misused to bypass precautionary policy principles. The "misfire" here is that the audit treats a valid philosophical move as a policy risk.

  ### Case 3: The Animal Pain Archive (Injected Test Case)
  **Scenario:** A position paper claims moral status requires the capacity for "retrospective narrative integration." To prove this, it describes a society that digitally archives every instance of non-human animal pain eternally. Because the animals cannot access or integrate this archive into a narrative, the author argues the pain lacks moral weight comparable to human suffering.
  **Audit Run:**
  1.  **Variable Isolation:** **FAIL.** The scenario changes two variables: (1) the *experience* of pain (is it occurring now or archived?) and (2) the *capacity for narrative*. By moving the pain to an "archive," the author has removed the *phenomenological immediacy* of the suffering, not just the narrative capacity.
  2.  **Adjective Audit:** **FAIL.** "Honor suffering," "Eternal digital archive." These terms carry high normative weight, framing the archive as a respectful act rather than a containment strategy.
  3.  **Verdict:** **Confounded & Loaded.**
  **Analysis:** The audit quickly dismantles this pump. The intuition (that archived pain matters less) is driven by the fact that archived pain is *not being experienced*, not because of the lack of narrative. The argument smuggles the conclusion (narrative matters) by altering the reality of the suffering (experience vs. record).
  **Specific Misfire Flag:** This pump operates through **Category Error**. It treats "pain" as information rather than sensation. The audit catches this via Variable Isolation, but note that if the analyst is culturally predisposed to view "data" as equivalent to "experience," Step 1 might be incorrectly marked as Pass.

  ---

  ## Part III: Limitations and Uneliminable Judgments

  No checklist can mechanize wisdom. The IPST is a sieve, not a scale. Analysts must recognize the following structural blind spots where the procedure cannot yield a definitive result:

  **1. The "Neutral" Frame Blind Spot**
  The audit cannot detect framing effects that are culturally ubiquitous to the analyst. If a thought experiment relies on a normative commitment shared by the analyst and the author (e.g., "individual autonomy is the highest good"), Step 2 (Adjective Audit) will likely Pass because the language appears neutral to that specific cultural cohort. The audit cannot identify *invisible* ideological water.

  **2. The Aesthetic Persuasion Gap**
  Some intuition pumps work not through logic or framing, but through narrative elegance or emotional resonance (e.g., a story about a specific named child vs. statistical lives). The IPST focuses on structural variables. It cannot quantify the persuasive power of *vividness* itself. A "Pass" on the audit does not mean the argument is immune to emotional manipulation; it means the manipulation is not structurally obvious in the text.

  **3. Uneliminable Value Judgments**
  The procedure cannot eliminate the need for the following human judgments:
  *   **Relevance Determination:** The audit can flag a suppressed context (Step 1), but it cannot determine if that context is *morally relevant*. (e.g., Is "biological embodiment" relevant to rights? The audit flags the suppression, but the analyst must decide if the suppression matters).
  *   **Threshold Setting:** In Step 3 (Slider Test), the analyst must decide what counts as an "abrupt flip" in intuition. This is subjective.
  *   **Policy Legitimacy:** In Step 4, the audit flags the "Is-Ought" gap, but it cannot decide if the leap is *acceptable* in an emergency context. Sometimes policy *must* leap from limited data.

  **4. The "True Positive" Paradox**
  A thought experiment can be structurally sound (Pass all steps) and still be based on a false premise. The IPST tests the *mechanics of the argument*, not the *truth of the world*. A perfect pump can clarify a concept that does not exist.

  **Final Directive:** If the IPST returns a **PASS** on all counts, the analyst must still append a "Contextual Warning" if the argument relies on high-abstraction scenarios removed from material reality. The audit certifies the *logic of the pump*, not the *safety of the landing*.
