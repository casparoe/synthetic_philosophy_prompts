answer: |-
  Dear Colleague

  Thank you for raising this profound and persistently troubling issue. Your observation regarding the shifting ground in the abortion debate is astute, and it suggests that the stalemate we face is not merely a result of ideological entrenchment but rather a complex layering of distinct philosophical problems that are often conflated. In diagnosing why the debate between the legacy of Judith Thomson and the arguments of Don Marquis has reached an impasse, I am inclined to argue that the disagreement is primarily structural, in that the two sides are answering different moral questions while employing the same vocabulary, though this structural mismatch is underpinned by substantive metaphysical disagreements concerning potentiality and the nature of biological obligation.

  To understand the stalemate, we must first recognise that Thomson and Marquis are operating within different moral frameworks that address orthogonal dimensions of the problem. Marquis's future-like-ours argument is fundamentally concerned with the metaphysical status of the fetus and the wrongness of killing per se. It asks whether the entity in question possesses a property, specifically a valuable future, that grants it a right to life comparable to an adult human. Thomson's violinist analogy, conversely, bypasses the question of status almost entirely. She grants for the sake of argument that the fetus is a person, yet argues that the right to life does not include the right to use another person's body against their will. Her focus is on the limits of bodily autonomy and the specific obligations generated by physical dependency. When contemporary discussions proceed without acknowledging this divergence, participants talk past one another. The Marquisian argues that the fetus has status, implying abortion is impermissible killing, while the Thomsonian argues that even with status, the withdrawal of bodily support is permissible. Thus, a significant portion of the stalemate is due to the interlocutors addressing different questions: one regarding the moral status of the entity, and the other regarding the permissibility of withdrawing biological maintenance.

  However, to dismiss the disagreement as merely structural would be to ignore the substantive shifts you have identified regarding potentiality and interdependence. The debate has deepened into metaphysics. When critics of abortion rights treat potentiality as a modal property, they are asserting that the mere possibility of a future of value is sufficient for moral status. In contrast, when defenders of abortion rights treat potentiality as teleologically directed, they are making a substantive claim about the nature of existence and rights-bearing capacity. They argue that an entity must have achieved certain functional capacities or be on a specific trajectory of development to hold rights, rather than possessing them merely by virtue of biological continuity. This is not a verbal dispute over the definition of 'potential'; it is a genuine metaphysical disagreement about what grounds moral status. Is it the capacity for experience, the biological organisation, or the logical possibility of future consciousness? Until there is consensus on the metaphysics of moral status, the Marquisian line will continue to clash with the Thomsonian concession, because the former sees the metaphysical ground as settled by conception, while the latter sees it as gradual or dependent on functional integration.

  Furthermore, the evolution of the bodily autonomy argument highlights a substantive disagreement about the nature of biological obligation. As you noted, modern defenders of the violinist analogy often acknowledge that pregnancy is not literally like being kidnapped by a stranger but is a unique form of sustained biological interdependence. The crux of the disagreement here lies in whether this specific biological intimacy generates special obligations that override standard autonomy rights. Those who argue that gestation generates obligations due to its continuous and asymmetrical nature are invoking a relational ethics or a duty of care that arises from the biological connection itself. Those who maintain the right to withdraw argue that the asymmetry of exit costs does not create a duty to sustain, particularly when the sustenance requires significant bodily intrusion. This is a substantive ethical disagreement about the limits of Samaritanism and the moral weight of biological relationships. It is not simply a matter of defining 'autonomy' differently; it is a conflict between an ethics of rights and liberty versus an ethics of care and relational responsibility.

  There is also a hidden empirical dimension that complicates the stalemate, though it is rarely sufficient to resolve it on its own. Questions regarding the onset of integrated neural activity or sentience are empirical, yet their moral significance is normative. Even if we agreed precisely when sentience begins, the Marquisian could argue that the future of value exists prior to sentience, while the Thomsonian could argue that bodily autonomy holds regardless of sentience. However, empirical findings do matter for the teleological view of potentiality. If moral status is linked to the capacity for experience, then the empirical timeline of neural development becomes crucial. Progress here would require not just better science, but a normative agreement on why sentience matters. Without that normative bridge, empirical data alone cannot dissolve the deadlock.

  Given this diagnosis, what would count as progress? I do not believe we should expect a single verdict that satisfies both metaphysical and ethical frameworks simultaneously, as the values at stake—life and liberty—are often incommensurable. Instead, progress should be conceptual and structural. We need a deliberate change of question that disentangles the status of the fetus from the obligations of the pregnant person. A fruitful path forward would be to acknowledge that one can accept a version of the future-like-ours argument regarding the tragedy of fetal death while still accepting the Thomsonian argument regarding the impermissibility of compelled gestation. This would move the debate from 'is it murder?' to 'is it permissible to prevent this death via bodily intrusion?'. Additionally, progress could be made by refining the metaphysics of potentiality. If philosophers could agree on a threshold of moral significance based on functional capacities rather than mere biological potential, it might narrow the gap on the status question, even if the obligation question remains.

  Ultimately, the stalemate persists because each side believes their question is the primary one. The Marquisian believes status determines permissibility, while the Thomsonian believes obligation determines permissibility. Progress lies in recognising that these are distinct moral inquiries. We may not resolve the tension between the value of a potential future and the right to bodily integrity, but we can clarify that the disagreement is not merely verbal or based on ignorance of facts. It is a genuine conflict between competing moral dimensions that require careful weighing rather than a binary solution. Until we acknowledge that we are arguing about different things under the same label, the debate will remain stalled, with each side fortifying their metaphysical and ethical premises against the other without ever truly engaging the core divergence in their moral architectures.

  Yours sincerely

  The Philosophical Analyst
