prompt: |-
  I adjudicate first-party property claims for a mid-sized mutual insurer, and a startling share of my contested files turn on someone's not doing something: the caretaker who didn't shut off the water before the hard freeze, the property manager who never inspected the supply line, the alarm contractor that didn't run the annual test, and sometimes our own insured's failure to do the post-loss mitigation the policy demands. The policy language and state precedent hand me "proximate cause" with no guidance at all about absences, and I've noticed my reasoning drifts in a way that worries me: I call an omission a cause when the omitter had a duty, and dismiss it as mere background condition when they didn't — which means I'm deciding cases by pointing at norm violations rather than by anything causal, and I don't know if that's sound or a bias. Please turn what the philosophy of causation actually knows about omissions into a procedure I can run on a file in twenty to thirty minutes: the questions to ask in order (I suspect something like "cause of what, as opposed to what?" and "who or what counts as a candidate omitted preventer?" will have to appear early), what counts as a sufficient answer to each, where the procedure terminates in "not a cause" and where it can't settle the matter and has to hand off to coverage counsel or to my judgment, with the handoff points marked as places where values or law, not causation, are doing the work. It has to handle the cases that make omissions hard: two parties each of whose single omission alone would have prevented the entire loss; the omitted preventer that would itself have failed anyway; the omission that only matters because of a later storm no one had a duty to anticipate; the omission of a bystander with no duty whose act would trivially have saved the property. Then run the procedure on three claims — the caretaker and the burst pipe, a fire loss where both the landlord and the alarm contractor skipped inspections that either alone would have caught the hazard, and a mold claim where our insured's failure to mitigate after a small leak multiplied the loss — including at least one where the procedure yields an outcome I would rather it didn't. Finally, say plainly where the procedure will misfire and what it cannot do, especially whether it really answers my drift worry or only launders it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Adjudicator for a mid-sized mutual insurer (first-party property claims).
      *   **Problem:** Contested files often turn on *omissions* (failures to act). Current reasoning feels circular/biased: "Omission is a cause if there was a duty; no duty if it's just a background condition." This conflates *causation* with *normative duty*.
      *   **Goal:** A 20-30 minute procedure based on the *philosophy of causation regarding omissions* to determine if an omission is a proximate cause.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Termination points ("not a cause" vs. "handoff to counsel/judgment").
          *   Mark handoff points where values/law drive the decision, not causation.
          *   Handle hard cases: Overdetermination (two omissions), Futility (omission wouldn't have worked anyway), Intervening forces (storm), Bystanders (no duty).
          *   Apply to three specific claims (Caretaker/Freeze, Landlord+Alarm/Fire, Insured/Mold).
          *   Include at least one outcome the user might dislike.
          *   Final analysis: Where does it misfire? Does it solve the "drift worry" or just launder it?

  2.  **Philosophical Grounding (Omissions & Causation):**

      *   *The Problem:* Omissions are ontologically weird. Nothing happened. How can "nothing" cause "something"?
      *   *Standard View (Counterfactual):* But-for causation. If $X$ had happened, would $Y$ have been prevented?
      *   *The Normative Trap:* We usually only care about omissions if there was a *duty* to act. This is what the user is worried about (conflating cause with duty).
      *   *Philosophical Solutions:*
          *   *Hart & Honoré:* Distinguish between "causes" and "conditions." Abnormal interventions are causes; normal background conditions are not.
          *   *Contrastive Causation (Schaffer):* Cause *of what, as opposed to what?* (e.g., Cause of death *as opposed to survival* vs. Cause of death *at 2pm as opposed to 3pm*).
          *   *Normality/Default Reliance (Halpern & Hitchcock):* We judge causation based on what is "normal" or "expected."
          *   *Legal Proximate Cause:* Foreseeability, scope of risk, duty.
      *   *The Procedure's Strategy:* I need to separate the *factual counterfactual* (could it have stopped the loss?) from the *normative attribution* (should we count this as the cause for liability purposes?). The user's drift is mixing these. The procedure must force them apart.

  3.  **Drafting the Procedure (The "Omission Causation Protocol" - OCP):**

      *   *Time Limit:* 20-30 mins. Needs to be punchy.
      *   *Step 1: Define the Contrast.* (Philosophy: Contrastive Causation). What exactly are we explaining? The loss *vs* no loss?
      *   *Step 2: The Counterfactual Test.* (Philosophy: But-For). If they acted, would the loss definitely/preprobably not happen?
      *   *Step 3: The Normality/Expectation Check.* (Philosophy: Hart & Honoré/Normality). Is this omission an "abnormal" intervention or a "background condition"? This is where duty creeps in, so we need to isolate it.
      *   *Step 4: Overdetermination & Futility.* (Philosophy: Preemption/Redundancy). What if someone else also failed? What if acting wouldn't have helped?
      *   *Step 5: The Normative Handoff.* Explicitly state: "Causation is established; now apply Policy/Law."

      *Refining the Steps for the User:*
      *   Q1: Contrast. (Loss vs. No Loss).
      *   Q2: Physical Possibility (But-For).
      *   Q3: Abnormality (Is this omission distinct from the background?).
      *   Q4: Redundancy/Futility (Hard cases).
      *   Decision Node: Causal Link Established? -> Handoff to Policy/Duty.

  4.  **Developing the Three Claims:**

      *   *Claim 1: Caretaker/Freeze.* (Classic omission).
          *   Duty: Yes (Contract/Employment).
          *   Counterfactual: Turning off water stops burst.
          *   Outcome: Cause.
      *   *Claim 2: Landlord + Alarm/Fire.* (Overdetermination).
          *   Both failed inspections. Either would have found it.
          *   Philosophy: Both are causes (INUS conditions or similar).
          *   Outcome: Both are causal. Allocation is a legal/policy issue.
      *   *Claim 3: Insured/Mold.* (Failure to mitigate).
          *   Small leak -> Insured does nothing -> Mold.
          *   Counterfactual: Drying it stops mold.
          *   *The "Disliked Outcome":* Maybe the procedure says the *leak* is the cause, not the failure to mitigate, because the failure is "normal" (lazy homeowners are common)? No, that's weak.
          *   *Better "Disliked Outcome":* The procedure identifies the *omission* as a cause, but the policy excludes "wear and tear" or "neglect," forcing a coverage denial that feels harsh, OR the procedure finds the omission *not* a cause because the storm was too unforeseeable (Intervening).
          *   *Let's try the Intervening Force angle:* Mold claim where the leak was tiny, but a second storm (unforeseeable) drove water in. Insured didn't mitigate the first bit.
          *   *Actually, let's stick to the prompt's specific example:* "Insured's failure to mitigate... multiplied the loss."
          *   *Disliked Outcome:* The procedure determines the omission *is* a cause, but because the insured had a duty, the procedure forces a handoff to "breach of conditions," potentially denying the claim entirely even if the initial loss was covered. Or, conversely, the procedure says the omission is *not* a cause because the mold was inevitable due to hidden construction defects (Futility), despite the insured's laziness. Let's go with **Futility**: The procedure concludes the omission wasn't the cause because mitigation wouldn't have worked anyway (hidden wall cavity), despite the insured looking negligent. This protects the insured but contradicts the adjuster's initial "neglect" instinct.

  5.  **Addressing the "Drift Worry":**

      *   The user worries they decide based on duty, not cause.
      *   Does this procedure fix it? It *separates* the causal inquiry (Steps 1-4) from the duty inquiry (Step 5).
      *   *Honesty Check:* It might just "launder" it. Why? because Step 3 (Normality) often relies on duty to define what is "abnormal." I need to be explicit about this limitation.

  6.  **Writing the Response:**

      *   *Tone:* Professional, analytical, philosophical but practical.
      *   *Structure:*
          1.  Introduction (Validating the worry).
          2.  The Procedure (The Omission Causation Protocol).
          3.  Application to Three Claims.
          4.  Limitations & The "Laundering" Question.

      *(Self-Correction during drafting)*: Make sure the "Handoff" points are very clear. The user wants to know when they stop being a causation analyst and start being a policy interpreter.
      *   *Hard Case - Bystander:* A neighbor could have turned off the water but had no duty. Procedure must say: Causally relevant? Yes (counterfactually). Normatively relevant? No (Handoff).
      *   *Hard Case - Overdetermination:* Landlord + Alarm. Both are causes. Don't try to pick one. Handoff to contribution/subrogation.

  7.  **Final Review against Constraints:**
      *   20-30 mins? Yes, 5 steps.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Termination points? Yes.
      *   Handoff points marked? Yes.
      *   Three claims run? Yes.
      *   One disliked outcome? Yes (The Mold/Futility one).
      *   Plain speech on misfire/laundering? Yes.

  8.  **Final Polish:** Ensure the distinction between *Cause-in-Fact* (Counterfactual) and *Proximate Cause* (Normative/Scope) is clear, as that's the heart of the user's legal/philosophical tension. The procedure treats "Proximate" as the handoff point.

  *(Refining the "Disliked Outcome")*: The user is an insurer adjudicator. A "disliked outcome" for them is likely one that *limits* their ability to deny or subrogate, or one that exposes the insurer to risk they didn't anticipate.
  *   *Idea:* The Mold claim. Adjuster thinks "Insured neglected duty, we deny." Procedure says "Omission is not a cause because mold was inevitable due to design (Futility)." Result: Insurer pays. Adjuster dislikes this because it rewards negligence.
  *   *Alternative:* The Caretaker claim. Adjuster wants to subrogate. Procedure says "Omission is cause, BUT storm was unforeseeable intervening force." Handoff to counsel on foreseeability.
  *   *Selection:* The Mold/Futility case is strongest for showing the procedure overriding the "neglect" intuition.

  Let's build the "Omission Causation Protocol" (OCP).

  *   *Step 1: Contrast.* (Loss vs. What?)
  *   *Step 2: Counterfactual.* (Would act have prevented?)
  *   *Step 3: Abnormality.* (Is omission distinct from background?)
  *   *Step 4: Interference.* (Overdetermination/Futility).
  *   *Step 5: The Normative Wall.* (Stop. Handoff).

  Okay, ready to write.
answer: |-
  ### The Omission Causation Protocol (OCP)

  Your worry is philosophically sound. You are experiencing the **"Normative Collapse"**: the tendency to treat *duty* as a prerequisite for *causation* rather than as a separate filter applied *after* causation is established. In philosophy, this is the debate between *ontological causation* (did this absence make a difference?) and *attributive causation* (should we blame this absence?).

  The following procedure forces these apart. It is designed to run in 20–30 minutes. It isolates the causal mechanics first, then explicitly marks the point where you must switch from "analyst" to "adjudicator" to apply policy and law.

  ---

  #### Phase 1: The Causal Mechanics (15 Minutes)
  *Goal: Determine if the omission is factually capable of being a cause, independent of duty.*

  **Q1: What is the specific contrast?**
  *   **Ask:** "Am I explaining the *occurrence* of the loss, or the *extent* of the loss?"
  *   **Sufficient Answer:** A precise definition.
      *   *Good:* "The burst pipe at 3:00 AM vs. a secure pipe."
      *   *Good:* "The total destruction by fire vs. minor smoke damage."
      *   *Bad:* "The damage."
  *   **Terminate if:** You cannot define the contrast. (Handoff: Coverage Counsel to define scope of loss).

  **Q2: The Counterfactual Test (But-For)**
  *   **Ask:** "If the specific act had been performed at the specific time, would the loss (defined in Q1) have been prevented with reasonable certainty?"
  *   **Sufficient Answer:** Yes/No based on physics/engineering, not policy.
      *   *Yes:* Water off = no pressure = no burst.
      *   *No:* Inspection done = hazard still hidden = fire still happens.
  *   **Terminate if:** No. (Outcome: **Not a Cause**. Close causal inquiry. If denial is sought, it must be based on non-causal policy exclusions).

  **Q3: The Abnormality Check (Hart & Honoré)**
  *   **Ask:** "Is this omission an *intervention* or a *background condition*?"
  *   **Test:** Compare the omission to the "normal flow" of events in that context.
      *   *Intervention:* A specific agent stopped doing a specific task they usually do or were set up to do (e.g., Caretaker didn't shut valve).
      *   *Background:* A general state of affairs where no specific act was expected (e.g., A passerby didn't shut the valve).
  *   **Sufficient Answer:** Classification as Intervention or Background.
  *   **Note:** This is where your drift usually happens. Do **not** use "Duty" to answer this. Use "Expectation/Regularity."
      *   *Example:* A security guard sleeping is an *intervention* (abnormal for a guard). A homeowner sleeping is *background* (normal for a human).
  *   **Terminate if:** Background. (Outcome: **Not a Cause** for attribution purposes, even if counterfactually relevant. This is a causal cutoff, not a legal one).

  **Q4: The Hard Case Filters**
  *   **Ask A (Overdetermination):** "Did someone else also omit an act that alone would have prevented the loss?"
      *   *If Yes:* Both are causes. Do not try to pick the "main" one. Mark as **Concurrent Omissions**.
  *   **Ask B (Futility):** "Even if they acted, would an external force have caused the loss anyway?" (e.g., A storm of such magnitude it would have burst the pipes even if drained, or mold hidden in walls unreachable by mitigation).
      *   *If Yes:* **Futility**. The omission is not a cause of the *loss*, though it may be a cause of *discovery delay*.
  *   **Ask C (Intervening Force):** "Did a new, independent force occur after the omission that overwhelmed the prevention?"
      *   *If Yes:* Mark as **Superseding Event Candidate**.

  ---

  #### Phase 2: The Normative Handoff (5–10 Minutes)
  *Goal: Acknowledge where causation ends and law/policy begins.*

  **Q5: The Duty Wall**
  *   **Statement:** "Causal capacity is established (or not). Now, does a duty exist to act?"
  *   **Action:** Consult policy language, contract, or state statute.
  *   **Handoff Point 1:** If Q3 classified the omission as "Background" (e.g., a bystander), but Q5 finds a statutory duty (rare), **Handoff to Coverage Counsel**. Causation says "no," Law says "maybe."
  *   **Handoff Point 2:** If Q4 found **Concurrent Omissions** (Landlord + Alarm), **Handoff to Subrogation/Legal**. Causation says "both did it." Law decides who pays what share.
  *   **Handoff Point 3:** If Q4 found **Superseding Event**, **Handoff to Coverage Counsel**. Causation says "the omission started it, the storm finished it." Law decides if the storm breaks the chain of proximate cause.

  **Final Decision Node:**
  *   If Q2 = No OR Q3 = Background: **Omission is not a cause.** (Do not deny based on "failure to act" causation).
  *   If Q2 = Yes AND Q3 = Intervention: **Omission is a cause.** Proceed to policy analysis (mitigation clauses, negligence exclusions, etc.).

  ---

  ### Application to Three Claims

  #### Claim 1: The Caretaker and the Burst Pipe
  *   **Facts:** Caretaker contract requires shutting off water in winter. Hard freeze occurs. Caretaker forgets. Pipes burst.
  *   **Q1 (Contrast):** Burst pipe vs. secure pipe.
  *   **Q2 (Counterfactual):** If shut off, no pressure, no burst. **Yes.**
  *   **Q3 (Abnormality):** Caretaker is hired specifically to manage the property. Not shutting off is an *Intervention* (deviation from role). **Intervention.**
  *   **Q4 (Hard Cases):** No other omissions. No superseding storm beyond "hard freeze" (foreseeable in winter).
  *   **Q5 (Duty):** Contract exists.
  *   **Outcome:** **Omission is a Cause.**
  *   **Action:** Valid grounds for subrogation against caretaker.
  *   **Adjuster Intuition:** Matches your usual reasoning.

  #### Claim 2: The Fire, The Landlord, and The Alarm Contractor
  *   **Facts:** Electrical fault starts fire. Landlord skipped annual inspection. Alarm Contractor skipped annual testing. Either inspection would have found the fault. Fire destroys building.
  *   **Q1 (Contrast):** Total loss vs. no loss.
  *   **Q2 (Counterfactual):** If Landlord inspected -> found -> fixed -> no fire. **Yes.** If Alarm tested -> found -> fixed -> no fire. **Yes.**
  *   **Q3 (Abnormality):** Both have specific roles. Both deviations are *Interventions*.
  *   **Q4 (Hard Cases):** **Overdetermination.** Both omissions alone were sufficient to prevent.
  *   **Q5 (Duty):** Both have contractual duties.
  *   **Outcome:** **Concurrent Omissions.** Both are causal.
  *   **Handoff:** **Marked Handoff Point 2.** You cannot use causation to pick one. You must hand off to legal counsel to determine joint-and-several liability or pro-rata subrogation.
  *   **Adjuster Intuition:** You might want to pick the "worse" offender. The procedure forbids this. Causation is binary here; allocation is legal.

  #### Claim 3: The Mold and The Failure to Mitigate (The Disliked Outcome)
  *   **Facts:** Small leak behind kitchen sink. Insured sees stain, does nothing (policy requires mitigation). Two weeks later, major mold bloom. Insurer wants to deny the mold portion based on "failure to mitigate."
  *   **Q1 (Contrast):** Major mold bloom vs. minor stain/dry wall.
  *   **Q2 (Counterfactual):** If insured dried it immediately, would mold be prevented? *Investigation reveals:* The leak was inside a sealed wall cavity. Surface drying would not have reached the moisture source. Mold was inevitable once the leak occurred. **No (Futility).**
  *   **Q3 (Abnormality):** Insured inaction is arguably *Background* (people are lazy) but Policy makes it an *Intervention*. Let's grant Intervention for argument's sake.
  *   **Q4 (Hard Cases):** **Futility.** The omission did not change the physical outcome.
  *   **Q5 (Duty):** Policy requires mitigation.
  *   **Outcome:** **Omission is NOT a Cause.**
  *   **Result:** You cannot deny the mold claim based on the *causation* of the loss by the insured's neglect. The loss was caused by the leak (covered peril), not the inaction.
  *   **Why you dislike this:** Your instinct is to punish the insured's negligence. The procedure tells you their negligence didn't *cause* the mold; the construction did. You must pay the claim (though you might still have a breach of condition argument, that is a legal handoff, not a causal one).
  *   **Handoff:** **Marked Handoff Point 1.** If counsel argues "Breach of Condition" regardless of causation, that is a contract law argument, not a causation argument. The OCP forces you to admit the causal link is broken.

  ---

  ### Where the Procedure Misfires and The "Laundering" Question

  You asked if this procedure answers your drift worry or merely launders it. Here is the plain truth:

  **1. The "Abnormality" Trap (Q3)**
  The procedure *attempts* to separate duty from causation in Q3 (Abnormality), but it cannot fully succeed. Determining what counts as "normal" vs. "abnormal" often implicitly relies on normative expectations.
  *   *Example:* Is a homeowner sleeping through a fire "normal" (background) or "negligent" (intervention)?
  *   *The Laundering:* If you define "normal" as "what a reasonable person does," you have smuggled the legal duty back into the causal test.
  *   *The Fix:* You must define "normal" descriptively (what people *actually* do), not normatively (what they *should* do). This is hard. If you slip, you are laundering the bias.

  **2. The Proximate Cause Black Box**
  The procedure stops at "Causal Capacity." It explicitly hands off "Proximate Cause" (Foreseeability/Scope of Risk) to counsel.
  *   *The Misfire:* In insurance adjudication, "Proximate Cause" *is* the decision. By segregating it, the procedure might give you a "Yes, it's a cause" result that legally results in "No coverage" due to an intervening storm (Q4C).
  *   *Risk:* You may feel the procedure is useless if it tells you "It was the cause" but you still have to deny the claim based on the Handoff.
  *   *Benefit:* It prevents you from denying a claim by saying "This wasn't the cause" when it *was* the cause, but simply excluded by policy. It forces honesty: "We are paying/denying based on *contract*, not *physics*."

  **3. Does it solve the drift?**
  It **constrains** the drift, but does not eliminate it.
  *   **Before:** You unconsciously merged Duty + Cause. (No Duty = No Cause).
  *   **After:** You must explicitly write down "Causal Link: YES" before you write down "Duty: NO."
  *   **The Value:** Even if you ultimately deny the claim, the record will show you denied it because of *policy language*, not because you pretended the omission wasn't causal. This protects you from bad-faith accusations that you are manipulating causation to avoid payment.

  **Summary Limitation:**
  The procedure cannot tell you when an omission is *too remote*. That is a value judgment (Policy/Law). It handles the *mechanics* of omission causation (Counterfactuals, Overdetermination, Futility) but draws a bright line at the **Normative Wall**. If you find yourself making value judgments in Phase 1, you have violated the protocol.

  **Final Instruction:**
  When you run this, if you find yourself arguing about "responsibility" in Phase 1, stop. Reset. Ask only: "Did the physics change if they acted?" If the answer is yes, the omission is a cause. Whether that matters for the checkbook is Phase 2.
