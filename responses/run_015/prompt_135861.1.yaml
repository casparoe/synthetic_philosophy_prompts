answer: |-
  ### Conceptual Brainstorm: Distinguishing the Modes of Support

  Before dissecting your argument, we must rigorously distinguish the three epistemic modalities you are weaving together. Confusion here is often the seed of the paradox.

  1.  **Evidential Independence:** This is a causal and genealogical condition. Source A is independent of Source B if the existence and content of A do not causally depend on the tradition of B. Crucially, independence is not just about *different texts*; it is about *different causal chains*. An inscription carved by an enemy king is independent of a biblical scribe; a later manuscript copy of the Bible is not. Independence breaks the hermeneutic circle.
  2.  **Inter-textual Corroboration:** This is a coherence condition within the textual tradition. If Text A and Text B agree, probability increases *unless* they share a common ancestor (genealogical dependence). In ancient studies, "corroboration" often masks "common tradition." Two medieval manuscripts agreeing on Arthur does not corroborate Arthur; it corroborates the *tradition* of Arthur.
  3.  **Narrative Continuity:** This is a literary or internalist condition. A story hangs together logically; causes lead to effects. This is necessary for intelligibility but insufficient for historicity. A novel has perfect narrative continuity but zero historical referent. Your argument rightly suspects that relying on this (or mistaking it for evidence) is where legend masquerades as history.

  ---

  ### Step-by-Step Reasoning and Diagnosis

  Your argument is a sophisticated *reductio ad absurdum* aimed at the **Non-Circular Corroboration Condition (NCCC)**. It is valid in form but unsound in its foundational definitions and empirical generalizations. Here is the breakdown:

  **Steps (1)–(5): The Plausible Core.**
  Your application of NCCC to Exodus, Arthur, and Troy is historically defensible. Troy (Hisarlik + Hittite *Ahhiyawa*/*Wilusa* texts) possesses a causal chain of evidence partially independent of Homer. Exodus and Arthur lack contemporary, external, material anchors. This triage aligns with current scholarly consensus.

  **Step (6): The Empirical Overreach.**
  *Claim:* "For any event prior to... institutional... archiving... there exists no evidentiary chain that fully avoids circular dependence."
  *Diagnosis:* This is the first point of failure. It conflates **textual transmission** with **evidentiary source**. Thucydides is a text, yes, but the *events* he describes (the Peloponnesian War) left material traces (destruction layers at Amphipolis, Athenian tribute lists, coinage, the Peace of Nicias inscription) that are causally independent of Thucydides' manuscript tradition. Thucydides is not merely a "narrative tradition" in the same sense as the *Mabinogion*; he is a contemporary witness whose account can be checked against non-narrative traces. Step (6) falsely assumes that pre-imperial history lacks *any* independent material anchors.

  **Step (7)–(8): The *Reductio*.**
  Because (6) is empirically false regarding classical historiography, the collapse of Thucydides into Arthur is blocked. However, the *threat* of the collapse reveals a deeper philosophical anxiety.

  **Steps (9)–(11): The Dilemma.**
  You correctly identify that weakening NCCC turns a binary boundary into a gradient. You view this as a loss ("lose the sharp conceptual boundary").
  *Diagnosis:* This is the **Binary Assumption**. You assume that "History" and "Legend" are ontological categories separated by a bright line. In epistemology, warrant is almost always a spectrum (confidence intervals), not a switch.

  ---

  ### The Diagnosis: Where the Argument Fails

  The specific step you must reject is **(1)**, specifically its **binary ontology**. However, you must also correct **(6)** empirically.

  **The Hidden Assumption:** The argument rests on **Epistemic Binaryism**—the belief that there is a metaphysical switch that flips when evidence crosses a threshold, transforming "Legend" into "History."
  **Why it looked plausible:** It mirrors legal standards (guilty/not guilty) or Popperian demarcation (science/pseudoscience). We crave ontological security; we want to know if the event *really happened*.
  **Why it fails:** Historical knowledge is not about the *event's ontology* (which is fixed in the past) but about our *epistemic access* (which is graded). There is no moment where "legend" becomes "history"; there is only a gradient of **inferential warrant**.

  ### Pricing the Alternatives

  You asked what you must surrender if you keep (1) versus if you abandon it.

  #### Option A: Keep (1) (The Binary NCCC)
  *   **The Move:** You insist that History *requires* materially independent corroboration to be called "History."
  *   **The Cost:** **Radical Skepticism.** You must accept that the vast majority of ancient human experience is "Legend." You lose the Peloponnesian War, the life of Socrates, and much of the Roman Republic, as these rely heavily on textual traditions that, while contemporary or near-contemporary, lack the *density* of independent material corroboration you demand for Troy.
  *   **The Selective Application Problem:** If you keep (1) but try to save Thucydides, you *must* apply NCCC selectively. You would have to argue Thucydides passes NCCC while Exodus fails.
      *   *Principled Grounds:* You can do this only by introducing **Contemporaneity** as a proxy for Independence. A contemporary text (Thucydides) is causally closer to the event than a late text (Bible/Arthur). But this modifies (1). If (1) remains strict "material independence," Thucydides fails. If you modify (1) to allow "contemporary testimony," you have already weakened the binary to a gradient of *proximity*.

  #### Option B: Reject (1) (The Graded Warrant Model)
  *   **The Move:** You redefine NCCC not as a boundary condition (necessary and sufficient), but as a **weighting mechanism** for Inference to the Best Explanation (IBE).
  *   **The Cost:** **The Loss of the Bright Line.** You must admit there is no moment where Arthur becomes History. There is only "Low Warrant," "Moderate Warrant," and "High Warrant."
  *   **The Gain:** **Fidelity to Practice.** This matches how historians actually work. We say the Trojan War is "probable," the Exodus is "unlikely/unverifiable," and the Peloponnesian War is "secure." These are not ontological kinds; they are epistemic stances.
  *   **Solving the Selective Application:** You are not applying NCCC selectively; you are applying a **sensitive instrument** to different data.
      *   *Exodus:* Late text + No contemporary material trace = Low Warrant.
      *   *Arthur:* Late text + No contemporary material trace = Low Warrant.
      *   *Troy:* Late text + Contemporary material trace (Hittite/Archaeology) = Moderate Warrant.
      *   *Thucydides:* Contemporary text + Contemporary material trace (Epigraphy/Archaeology) = High Warrant.
      *   The *criterion* (look for independence) is constant. The *result* varies based on the survival of evidence.

  ### Recommendation: The Spectrum of Referential Security

  You should reject the **Binary Assumption in (1)** and correct the **Empirical Claim in (6)**.

  1.  **Reject Binary (1):** Do not define narrative as crossing into history *precisely when* NCCC is met. Define it as: *Historical warrant increases in proportion to the density of non-circular corroboration.*
  2.  **Correct Empirical (6):** Acknowledge that Classical historiography (Thucydides) often *does* meet a robust standard of corroboration (via epigraphy and archaeology) that Bronze Age narratives (Exodus/Arthur) do not. The distinction between Thucydides and Arthur is not selective bias; it is a reflection of the **survival bias of evidence**.

  **Addressing your specific worry:** *"If I keep (1), does giving up (6) require me to admit that NCCC applies selectively?"*
  Yes, and that is fatal. If NCCC is a universal law of historical ontology, it cannot apply to Thucydides but not Exodus unless the *data* differs. If the data differs (Thucydides has inscriptions; Exodus does not), then NCCC isn't being applied selectively; the *world* is cooperating differently. However, if you find yourself making ad-hoc exceptions to save Thucydides, you have proven that (1) is too rigid.

  **The Philosophical Pivot:**
  The error lies in treating **evidential independence as a binary condition**. It is not. Independence comes in degrees (e.g., a hostile contemporary inscription is *more* independent than a friendly contemporary inscription, which is *more* independent than a hostile late text).

  **Conclusion:**
  Abandon the quest for a sharp ontological boundary between Legend and History. It is a category mistake. History is not a state of being; it is a **mode of knowing**. Replace (1) with a model of **Referential Security**.
  *   **Arthur:** Low Security (High narrative continuity, Low evidential independence).
  *   **Exodus:** Low/Null Security (High narrative continuity, Null evidential independence).
  *   **Troy:** Moderate Security (Moderate narrative continuity, Moderate evidential independence).
  *   **Thucydides:** High Security (High narrative continuity, High evidential independence).

  By surrendering the binary, you save the distinction that matters: not "Is it History?" but "How securely can we refer to this event?" This preserves your intuition about Troy vs. Arthur without collapsing into the skepticism that swallows Thucydides.
