  8.  **Refining the "Phenomenal" Mapping:**
      *   If I say P = "Internal State," that's too broad. Everything has internal state.
      *   If I say P = "Processing Latency," that's wrong.
      *   If I say P = "The signal itself before it's an event," that's closer.
      *   *Decision:* I will map Phenomenal Consciousness to "Pre-serialization Signal Integrity" but flag heavily that this is where the analogy strains hardest. Access is "Post-serialization Availability."
      *   *Critical Honesty:* I must admit that in a pure systems view, "Pre-serialization Signal" is still just functional state. The "what it's like" is the residue that doesn't map.

  9.  **Refining the Probes:**
      *   *Orphan Publish:* If nothing consumes it, did it happen? In systems, yes (log exists). In P vs. A, if A=no, is P=yes?
      *   *Split-Brain:* Consensus protocols handle this. Identity is the issue.
      *   *Buffered Readout:* This is the classic Overflow argument. High buffer (iconic memory) vs. Low throughput (working memory).

  10. **Final Review against Constraints:**
      *   No citations? Check.
      *   Mapping table first? Check.
      *   Three probes? Check.
      *   Residue report? Check.
      *   Confidence markers? Check.
      *   Least sure point? Check.
      *   Welfare question addressed? Check.
      *   No smuggling functionalism? Check (will explicitly note where the collapse happens).

  11. **Self-Correction on "Orphan Publish":**
      *   In GWT, ignition *is* broadcast. If no one consumes, did ignition happen? Usually, ignition implies downstream effect. If the bus accepts it but no subscriber acks, is that ignition? I need to be precise. Ignition = Broadcast. Consumption = Access.
      *   Wait, GWT says ignition *makes* it available. If no one *uses* that availability, is it Access Conscious? Access is defined by *availability*, not necessarily *usage*. But report requires usage.
      *   Okay, distinction: Availability (Access) vs. Actual Report (Usage).
      *   Orphan Publish: Available but unused.
      *   Phenomenal: Did it feel like something before it expired?

  12. **Final Polish:** Ensure tone is respectful of the engineering mindset but firm on the philosophical limits. The user wants to know if the question dissolves. I need to be clear: The engineering vocabulary *tends* to dissolve it by functionalizing everything, but that might be a category error.

  Let's build the response.

  *Confidence Check:*
