      *   *Access Consciousness:* "Availability to downstream consumers via the broadcast bus." (High Confidence).
      *   *Global Workspace:* "The central event bus with contention control." (High Confidence).
      *   *Ignition:* "Successful commit to the bus." (High Confidence).
      *   *Overflow:* "Ingress buffer capacity > Egress throughput." (High Confidence).

  5.  **Addressing the "Honesty Constraints":**
      *   *Functionalism:* I must not assume P *is* A. I need to show where the mapping forces them together.
      *   *Rigged Probes:* "Orphan Publish" might assume experience requires consumption. "Buffered Readout" might assume buffer = experience.
      *   *Confidence:* Need to label each section.
