  6.  **Developing the Residue Report:**
      *   *Gap:* The "what it's like" quality (qualia) has no direct analog in state machines.
      *   *Collapse:* If I map P to "internal state," does that capture the *subjectivity*? No.
      *   *Welfare Question:* If the vocabulary collapses P into A, then welfare checks depend on access/reporting. If the system can't report distress, does it feel it? The vocabulary might dissolve the question by making "feeling" equivalent to "logging."

  7.  **Step-by-Step Walkthrough Plan:**
      *   **Intro:** Acknowledge role, set confidence tone.
      *   **Mapping Table:** Clear term-to-term translation.
      *   **Concept Walkthrough:**
          1.  P vs. A.
          2.  GWT.
          3.  Overflow.
      *   **Probe Cases:**
          1.  Orphan Publish.
          2.  Split-Brain.
          3.  Buffered Readout.
      *   **Residue Report:** What was lost? What collapsed?
      *   **Welfare Implication:** Direct answer to the user's "why."
