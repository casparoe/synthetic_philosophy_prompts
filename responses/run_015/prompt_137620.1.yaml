  2.  **Deconstruct the Philosophical Concepts:**
      *   **Phenomenal vs. Access Consciousness (P vs. A):**
          *   *P:* What it's like (qualia, subjective experience).
          *   *A:* Available for report, reasoning, action (functional availability).
          *   *Systems Analogy:* P is hard. It's the "internal state" vs. "logged state"? Or is it the "processing" vs. the "output"? Actually, P is the tricky one. In systems, everything is functional. To map P, I need to find something that isn't just functional availability. Maybe "internal signal fidelity" vs. "API exposure"? But that risks collapsing P into A. I need to be careful here.
      *   **Global Workspace Theory (GWT):**
          *   *Core:* Specialized modules compete for entry into a limited capacity "global workspace." Once in, information is broadcast to all other modules.
          *   *Systems Analogy:* This maps *very* well to a pub/sub bus with backpressure. Specialist processors = microservices. Competition = contention for bus bandwidth/lock. Ignition = successful publish. Broadcast = fan-out to subscribers.
      *   **Overflow Dispute:**
          *   *Core:* Is conscious experience richer than what we can report/access? (Yes: Iconic memory holds more than working memory). (No: If you can't access it, it wasn't conscious).
          *   *Systems Analogy:* Buffer size vs. Throughput. High-fidelity ingress buffer vs. low-bandwidth egress serializer. Does the data "exist" consciously if it's dropped before serialization?

  3.  **Deconstruct the Probe Cases:**
      *   **Orphan Publish:** Message on bus, no subscribers read it before TTL expires.
          *   *GWT:* Ignition happened, but no downstream consumption.
          *   *P vs. A:* Is there experience without access?
      *   **Split-Brain:** Network partition, two workspaces running independently.
          *   *GWT:* Two workspaces.
          *   *P vs. A:* One subject or two?
      *   **Buffered Readout:** High-fidelity buffer, low-bandwidth serializer. Most data dropped.
