  hey im trying to get my head around teh semantics vs pragmatics debate about slurs. like is a slur bad because of what it literally means or because of what speakers do with it to insult or show attitude? can you walk through both ideas using this made-up example: a discord server invents the word blorpt with no history at all, starts using it only to dunk on newbies, then later someone uses blorpt affectionately toward a close friend. which account handles that evolution better and why?
