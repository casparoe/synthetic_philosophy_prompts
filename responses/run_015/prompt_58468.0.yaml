answer: |-
  This is a classic problem in the philosophy of language, and your "blorpt" example is actually a perfect test case for it.

  To break this down: **Semantics** is about what words *mean* (their literal content), while **Pragmatics** is about what speakers *do* with words (context, intention, and effect).

  Here is how each side handles the life cycle of **blorpt**, and why one handles the evolution better than the other.

  ---

  ### 1. The Semantic Account (The "Toxic Content" View)
  **The Core Idea:** The offensiveness is part of the word's definition. The slur encodes a hateful proposition (e.g., "Group X is inferior"). To utter the word is to express that content, regardless of your tone or intention.

  **Applying it to "Blorpt":**
  *   **Phase 1 (The Insult):** When the Discord server starts using *blorpt* to dunk on newbies, the semanticist says the word has acquired a definition. Let's say *blorpt* now semantically means "contemptible newcomer." If you say, "Dave is a blorpt," you are literally stating "Dave is a contemptible newcomer."
  *   **Phase 2 (The Affection):** Now, two close friends start calling each other *blorpt* affectionately.
      *   **The Problem:** If the meaning is fixed in the word, this creates a contradiction. If I call my best friend *blorpt*, and *blorpt* literally means "contemptible," I am literally calling them contemptible.
      *   **The Explanation:** For the semanticist to make sense of this, they have to argue that the word's **definition actually changed**. They would say the community successfully negotiated a new semantic entry for *blorpt* that erased the "contemptible" part and replaced it with "close friend."

  **Verdict on this example:** This view struggles here. Semantic change is usually slow and historical (think of how "nice" went from "foolish" to "kind" over centuries). For *blorpt* to flip from "hate" to "love" quickly within the same server suggests the *definition* didn't change, but the *vibe* did. Semantics makes the affectionate use look like a logical contradiction.

  ---

  ### 2. The Pragmatic Account (The "Toxic Use" View)
  **The Core Idea:** The word itself is just a label (or has very thin meaning). The offensiveness comes from the **force** of the speech act. It's about how the speaker uses the tool. The harm isn't in the hammer; it's in the swing.

  **Applying it to "Blorpt":**
  *   **Phase 1 (The Insult):** The Discord community establishes a norm: *Using the sound "blorpt" implies hostility toward newbies.* The word itself isn't toxic; the **implicature** is. When you say it, you are pragmatically signaling, "I am part of the group that looks down on newbies."
  *   **Phase 2 (The Affection):** The close friends use *blorpt* warmly.
      *   **The Solution:** The pragmaticist says the word hasn't changed at all. What changed is the **context**. Because the relationship is close, the audience (the friend) understands the speaker is not invoking the "hostility norm." They are invoking a "solidarity norm."
      *   **Reclamation:** This view explains reclamation easily. You aren't changing the dictionary; you are changing the rules of the game. You are taking a tool used to hurt and using it to build.

  **Verdict on this example:** This view handles the evolution smoothly. It allows the word to remain constant while the *social function* flips. It explains how you can say *blorpt* to a newbie (insult) and to a bestie (love) without contradicting yourself.

  ---

  ### Which Account Handles the Evolution Better?

  For your specific **blorpt** scenario, the **Pragmatic Account** wins hands down. Here is why:

  **1. Speed of Change**
  Semantics is sticky. It takes a long time for a word's literal truth-conditions to shift. If *blorpt* semantically meant "inferior," it would take a long time for the community to agree it now means "friend."
  Pragmatics is fluid. In a Discord server, norms can change in a week. The pragmatic account allows the *use* to flip instantly based on new community rules, which matches how internet slang actually works.

  **2. Context Dependence**
  In your example, the word is bad *only* when used on newbies, but good when used on friends.
  *   **Semanticist:** Has to say the word has two contradictory definitions existing at the same time.
  *   **Pragmaticist:** Says there is only one word, but two different contexts. The "badness" is generated by the relationship between speaker and listener, not the word itself.

  **3. The "No History" Factor**
  Real-world slurs (like racial slurs) have centuries of baggage. Some philosophers argue that after enough history, the hate *does* become semantic (encoded in the word).
  But you specified *blorpt* has **no history**. It was invented yesterday. Therefore, it has no "semantic toxicity" yet. Its power comes entirely from how the Discord users *decide* to use it right now. That is the definition of pragmatics.

  ### The Catch (Why the debate still exists)
  If Pragmatics explains *blorpt* so well, why do we still debate this for real-world slurs?

  Because real-world slurs often **feel** like they have semantic weight. If a stranger walks up to you and uses a heavy racial slur, it hurts even if they claim they "didn't mean it pragmatically." It feels like the word *itself* is poisoned.

  *   **Semanticists** argue this proves the hate is in the word (which is why reclamation is hard).
  *   **Pragmaticists** argue the "poison" is just a very strong, historical social norm that is hard to override (which is why reclamation is hard, but possible).

  ### Summary
  In your **blorpt** case:
  *   **Semantics** says: "You can't use this word lovingly unless you change its definition."
  *   **Pragmatics** says: "You can use this word lovingly whenever you change the context."

  Since the Discord users clearly *did* use it lovingly without inventing a new word, the **Pragmatic Account** describes reality better. It treats language as a social game, where the rules of *blorpt* changed from "attack" to "bond" without changing the card itself.
