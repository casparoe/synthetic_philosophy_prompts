answer: |-
  Here is a reading of *Uncle Tom's Cabin* as moral technology, committed to the position that the novel vindicates **neither** Williams nor Appiah exclusively, but rather posits **Availability** as the necessary precondition for moral change—a mechanism that ultimately proves fragile without the structural backing Williams demands and the honor-code stability Appiah describes.

  ### 1. The Novel's Causal Story: Against Interest, Beyond Honor

  If we look at the internal logic of the novel—the motives Stowe assigns to her characters—she explicitly rejects the Williams thesis (interest/structure) as sufficient, but she also finds the Appiah thesis (honor/reputation) incomplete.

  Williams argues that slavery ended because it became economically inefficient or structurally untenable, not because people were argued out of it. Stowe grants the premise but rejects the conclusion. Her characters who operate on pure interest are monsters (Haley, Legree), but her characters who operate on "necessity" (the Shelbys) are tragically complicit. Mr. Shelby knows the arguments against slavery; he calls it a "cursed system." He is not ignorant (Williams' skeptic's condition); he is trapped by debt. Stowe's point is that *interest* is a moral failure, not an exculpatory structure. She believes the ledger can be balanced differently if the moral imagination is engaged.

  However, the novel also complicates Appiah's honor model. Appiah suggests practices end when they become dishonorable—when a community can no longer bear to be *seen* doing them. St. Clare is the test case here. St. Clare is a cynic who does not care about the honor of his community; he despises it. He knows slavery is wrong (he has the arguments). He intends to free Tom. Yet he does nothing. His inaction is not driven by fear of dishonor (he is already a social outlier) nor by pure profit (he is wealthy and detached). It is driven by **inattention**. He lacks the *availability* of the crisis. He treats the system as a backdrop rather than a foreground moral emergency.

  Similarly, Miss Ophelia represents the Northern conscience. She has the arguments. She has the "honorable" anti-slavery position. But she cannot touch Topsy. Her problem is not interest, and it is not social reputation (she is in a private setting). Her problem is visceral disgust. She cannot *perceive* Topsy as a normative subject worthy of touch.

  Therefore, the novel implies a causal story distinct from both: Slavery persists not because of profit (Williams) or shame (Appiah), but because the **normative reality of the slave is unavailable to the master's perception.** Stowe's confidence that a book could matter rests on the belief that moral perception is a muscle that can be exercised. If you can make the suffering *available*—visceral, concrete, undeniable—the interest and honor calculations will follow. The novel argues that Availability is the *prior* condition for Honor. You cannot be shamed by what you do not see as a moral injury.

  ### 2. Defending Availability: The Mechanism of the Text

  Your hypothesis is correct: "Availability" is the novel's primary technology, and it is not reducible to Williams or Appiah. Williams deals in structures; Appiah deals in reputations; Stowe deals in **recognition**.

  Availability is the act of moving a feature of a practice from the background (normatively invisible) to the foreground (normatively demanding). This is not conversion (changing a belief) or re-coordination (changing a social cost). It is changing the *object* of perception.

  Three scenes carry the weight of this argument:

  1.  **The Opening Sale (Shelby/Haley):** This scene is not about the horror of violence, but the banality of bureaucracy. Stowe makes the *ledger* available as a moral weapon. By forcing the reader to watch Mr. Shelby balance his books against Harry's future, she makes the *economic calculation itself* perceptible as a moral act. Previously, the ledger was a neutral tool of business (Williams' interest); Stowe makes it available as a site of sin.
  2.  **Eliza's Crossing:** This is the pivot from abstract to visceral. A "fugitive" is a legal category; a mother on ice is a normative demand. Stowe forces the reader to perceive the *physics* of desperation. The availability here is somatic. The reader feels the cold. This bypasses the intellect (arguments) and the social sphere (honor) to target the nervous system.
  3.  **Tom's Death:** This is the theological capstone. Stowe makes Tom's body available as the body of Christ. By aligning the slave's suffering with the central sacrificial narrative of her readers' culture, she makes ignoring that suffering impossible without rejecting their own faith. She forces the *cost* of the practice to be perceptible in the reader's own spiritual currency.

  **The Pushback:** However, I must press you on whether Availability is truly distinct from Appiah's Honor. Appiah argues that honor codes rely on *scripts*. Stowe is writing a new script. When she makes Tom's suffering "available," she is coding it as *honorable endurance*. When she makes Legree's brutality "available," she is coding it as *dishonorable excess*.
  My challenge to your hypothesis is this: **Availability is unstable without Honor.** You can make a feature perceptible, but if the Honor Code does not shift to value that perception, nothing changes. Stowe makes the suffering available, but she relies on the reader's existing Christian Honor Code to register that availability as a demand for action. If the reader's Honor Code prioritizes "Property Rights" over "Christian Charity," the availability of the suffering registers as "unfortunate necessity" rather than "moral imperative."
  Therefore, Availability is the *spark*, but Honor is the *circuit*. Stowe's text works only because she successfully hacks the Northern Christian Honor Code. She doesn't just make suffering visible; she makes ignoring it *shameful* within that specific code.

  ### 3. The Resisting Scene: The Colonization Ending

  The scene that most resists the Availability reading is the ending: George Harris's decision to emigrate to Liberia.

  If the novel's strategy is to make Black suffering and humanity *available* to the American conscience, the logical conclusion is Black citizenship *within* America. The availability of George Harris's intellect, dignity, and Christian virtue should compel the American reader to make space for him. Instead, Stowe retreats. She sends him to Africa.

  This scene resists your hypothesis because it suggests that **Availability has a limit.** Stowe can make the *pain* of the slave available, but she cannot make the *political presence* of the Black man available within the white American honor structure. The text implies that while white readers can be moved to pity (Availability), they cannot be moved to equality (Structure/Honor).

  **To give up my reading:** I would need to find evidence in the text that the Liberia scheme is presented not as a retreat, but as a genuine moral equivalence—that Stowe truly believes Africa is as valid a home as America, rather than a convenient dumping ground to spare the Northern reader the discomfort of integration. If the text treated Liberia as a positive choice rather than a necessary exile, the Availability argument would hold stronger. As it stands, the ending admits that Availability cannot overcome the structural rigidities Williams identified.

  ### 4. The Hard Case: The Reversal of "Uncle Tom"

  Does an honor-based account predict the overshoot where Tom's name becomes a slur? **Yes.** In fact, the Hard Case vindicates Appiah over Stowe's Availability strategy.

  Appiah argues that honor is contingent on the community's script. In 1852, the script for the "Good Black Person" in the white liberal imagination was *Christian Endurance*. Tom fit that script. He was honorable because he absorbed violence without returning it, mirroring Christ.

  In the 20th century, the Honor Code of the Black community (and eventually the broader liberal community) shifted. The script for the "Good Black Person" became *Resistance and Dignity*. Under this new code, Tom's endurance was re-interpreted not as martyrdom, but as complicity. His refusal to fight back changed from a virtue to a vice.

  This proves that **Availability is not enough.** The *facts* of Tom's death remained available. The text remained the same. But the **Honor Code** used to interpret those facts shifted. Stowe's "moral technology" was built to operate on a specific Honor grid (19th-century Evangelicalism). When the grid changed, the technology malfunctioned.

  This shows that Honor borrows its content from the prevailing social power dynamics. Stowe ennobled Tom because it served her goal of appealing to white Christians without threatening white supremacy too aggressively (he doesn't revolt; he dies). When Black power became a normative consideration (a new Availability), Tom's conduct became dishonorable.

  **Conclusion:**
  The novel vindicates **neither** Williams nor Appiah fully, but it exposes the dependency between them. Stowe attempts an **Availability** revolution, believing that if she can make the suffering perceptible, the moral change will follow. She is right that Availability is the precondition for change (contra Williams, who ignores the moral imagination). But the Hard Case proves Appiah right: Availability is interpreted through Honor Codes, and Honor Codes are contingent and shifting.

  Stowe's text is a piece of moral technology that worked by hacking the Honor Code of 1850s Northern Christianity. It failed to secure structural change (Williams), which allowed the Honor Code to shift later in a way that disgraced her hero. Your "Availability" hypothesis is the most accurate description of Stowe's *method*, but Appiah provides the better explanation for the *legacy*. Availability opens the door, but Honor decides who walks through it—and when they turn around.
