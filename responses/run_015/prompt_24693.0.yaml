          *   *Prediction 3: Non-Combatants.* MEC: Strict immunity based on status. Rev: Immunity based on lack of threat/liability (which can blur lines).
          *   *Where MEC goes wrong:* It grants a "license to kill" to aggressors. It treats war like a duel rather than a moral conflict.

      *   **Section 3: Handling Standard Objections (Concede vs. Push Back).**
          *   *Objection 1: The Unjust Aggressor (Self-Defense).*
