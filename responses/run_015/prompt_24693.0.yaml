      *   **Revisionism:** McMahan's *Killing in War*. Key idea: Self-defense logic applies. You can't have a right to kill someone who isn't liable to be killed. Unjust combatants are essentially aggressors; just combatants are defenders. Liability tracks moral responsibility.
      *   **The Tension:** MEC prioritizes order, reciprocity, and the "fog of war." Revisionism prioritizes deep moral consistency and individual liability.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's position (Walzerian Traditionalism) and the rival (Revisionism). Set the stage for a critical examination.

      *   **Section 1: Falsifying Cases (The "Nazi Soldier" Problem).**
