              *   *Concession:* Maybe concede *moral blame* but insist on *legal/combatant privilege*.
          *   *Objection 2: Asymmetry of Permission.*
              *   *MEC Response:* Push back hard. This is the core of the "autonomy of *jus in bello*." If we deny this, soldiers won't follow rules.
          *   *Objection 3: Blamelessness vs. Liability.*
              *   *MEC Response:* Concede soldiers might be blameless (excused) but insist they are still liable (targetable).
