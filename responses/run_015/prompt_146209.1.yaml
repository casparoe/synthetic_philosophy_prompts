      *   *Correction:* The user says moderns treat health as a "middle zone... things we should systematically optimize." Epictetus would say: "Take care of the body as a duty, but recognize it can be taken away." The Modern says: "Optimize it to increase success/resilience." The shift is from *duty/indifference* to *optimization/leverage*. This is the "management framework" vs "ethical boundary" point. I should affirm this.

