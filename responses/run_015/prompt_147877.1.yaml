  6. I can hear the counter-argument already: that "relevance" is just efficiency by another name. You'd say we ignore the wall because it's computationally wasteful, not because it's bad storytelling. But isn't there a qualitative difference between ignoring something because it's cheap versus ignoring it because it's irrelevant?

  7. So does this mean the frame problem isn't about missing information at all? Is it that we have all the data, but we're refusing to render it until the genre shifts?

