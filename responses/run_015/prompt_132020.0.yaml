  6.  **Hard data positivist**
      *   *Definitions don't matter; indices and GDP per capita settle it.*
  7.  **Unnamed**
      *   *Logical combo: You think meanings shift but still try to compare via history. Rare.*
  8.  **Indeterminate (Axis-dependent)**
      *   *Conclusion: Neither wins outright. Depends on which metric you favour.*
  9.  **Semantic sceptic**
      *   *Conclusion: Neither wins outright. The question itself is flawed.*
  10. **Unnamed**
