  *   **A) Policy (The Tip)** → Go to **Node 4**
  *   **B) Temperament (The Base)** → Go to **Node 5**

  ---

  ### NODE 3 (Semantic Drift)
  If the meaning shifts, is comparison still possible?

  *   **A) Yes, ignore semantics** → Go to **Node 6**
  *   **B) No, semantics block comparison** → **LEAF 9**

  ---

  ### NODE 4 (Dimensions)
  Is liberalism unidimensional or multidimensional?

  *   **A) Unidimensional** → Go to **Node 7**
  *   **B) Multidimensional** → Go to **Node 8**

  ---

  ### NODE 5 (Measuring Temperament)
  How do you measure the submerged stuff?

  *   **A) Popular Self-Identification Surveys** → **LEAF 4**
  *   **B) Institutional/Constitutional Genealogy** → **LEAF 5**
  *   **C) Everyday Behaviour Observation** → **LEAF 10**

  ---

  ### NODE 6 (Settlement Method)
  How do you settle the comparison without shared definitions?

  *   **A) Quantitative Data** → **LEAF 6**
  *   **B) Qualitative Genealogy** → **LEAF 7**

  ---

  ### NODE 7 (Single Axis)
  Which axis splits them?

  *   **A) Economic Freedom** → **LEAF 1**
  *   **B) Social Permissiveness** → **LEAF 2**

  ---

  ### NODE 8 (Multi-Axis)
  Which axes split them — economic freedom, social permissiveness, civic inclusion? Do they point the same way?

  *   **A) Yes, one country leads clearly** → **LEAF 3**
  *   **B) No, conflicting signals** → **LEAF 8**

  ---

  ## THE LEAVES (YOUR POSITION)

  1.  **Classical liberal on state-distance**
      *   *You care about market rules and tax burdens above all. One neighbour looks significantly leaner.*
  2.  **Social permissiveness prioritiser**
