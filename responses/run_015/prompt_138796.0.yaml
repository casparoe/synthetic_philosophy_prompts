answer: |-
  ### Readings

  1.  **Semantic Rigidity:** This reading claims the necessity is purely linguistic. The term "water" functions as a rigid designator fixed by ostension to actual samples. Since the samples in our actual world are H2O, the term refers to H2O in all counterfactual worlds where the term is used with that same historical lineage. The necessity lies in the stability of reference, not in the nature of the substance. The claim is trivially true given the rules of our language game, asserting only that we do not change the referent of "water" when evaluating counterfactuals.

  2.  **Metaphysical Essentialism:** This thesis asserts that water is a natural kind possessing an intrinsic essence, specifically its microstructure. It claims that any substance lacking the H2O structure is metaphysically incapable of being water, regardless of superficial similarity. The necessity is de re, belonging to the object itself rather than the word. This reading posits a robust modal structure to the world where kinds have essential properties that hold across all possible worlds, making the identity statement a discovery about reality's architecture.

  3.  **Epistemic/Metaphysical Split:** This reading distinguishes between modes of possibility. It claims the proposition is metaphysically necessary (true in all possible worlds) but epistemically contingent (knowable only via empirical investigation). It asserts that our ability to conceive of water as XYZ tracks epistemic possibility (ways the world might be for all we know) rather than metaphysical possibility (ways the world could have been). The slogan here serves to correct a modal error: confusing what we can imagine with what is genuinely possible.

  4.  **Two-Dimensional Contingency:** This thesis argues the sentence expresses different propositions depending on the dimension of evaluation. Considered as actual (primary intension), "water" picks out whatever plays the watery role, making the identity contingent. Considered as counterfactual (secondary intension), "water" picks out H2O, making the identity necessary. The slogan is true only on the secondary dimension. This reading suggests the necessity is an artifact of evaluating the statement after fixing the actual world, masking the conceptual contingency that exists prior to empirical fixation.

  5.  **Ontological Reduction:** This radical reading claims that water facts are nothing over and above physical facts. Once the distribution of H2O is fixed, there is no further fact about whether water is present; the water facts supervene a priori on the physical facts. The necessity here is not just about identity but about exhaustiveness: there is no "water residue" left over after the physics is specified. This treats the identity statement as a marker of successful reduction, implying that higher-level kinds are merely convenient labels for physical configurations.

  ### Verdicts

  1.  **Semantic Rigidity:** **Platitude.** This is true by definition of rigid designation but does no philosophical heavy lifting. It explains why we *say* it is necessary, but not why the world cooperates. It cannot rule out zombies because it only governs word usage, not ontological dependence.

  2.  **Metaphysical Essentialism:** **Substantive and Defensible.** This is a standard scientific realist position. However, it assumes consciousness is a natural kind with a microstructural essence, which is precisely what the zombie argument denies. It holds for water but begs the question when applied to mind.

  3.  **Epistemic/Metaphysical Split:** **Substantive and Defensible.** This correctly diagnoses the modal confusion in conceivability arguments. However, it only works if the target identity (mind/brain) is genuinely necessary. It shows conceivability isn't proof of possibility, but doesn't prove the identity is necessary in the first place.

  4.  **Two-Dimensional Contingency:** **Substantive and Defensible.** This best explains the intuition clash. It admits the statement is contingent on the conceptual level (where zombies live) but necessary on the referential level. It undermines the slogan's use as a conversation-stopper because it validates the conceivability intuition on the primary dimension.

  5.  **Ontological Reduction:** **Substantive and Doubtful.** This is the load-bearing claim required to kill zombies. However, it is false for water if functionalism about liquids is true (XYZ could be water). It is exactly the claim at issue for consciousness, so using water to prove it is circular.

  ### My two cases

  **Split Lake** tests reference fixing. If a community encounters both H2O and XYZ equally, Semantic Rigidity predicts reference failure or ambiguity; "water" cannot rigidly designate one without a causal preference. Metaphysical Essentialism predicts there are simply two kinds, and "water" might denote a disjunction. This case counts against Essentialism if we intuit that XYZ would count as water in this world, suggesting "watery role" matters more than microstructure. For consciousness, this is the closer analogue: if qualia can be realized by multiple physical states, the water model (single essence) fails. The Split Lake case suggests that if consciousness is multiply realizable, the identity statement "Consciousness is Process X" is false, unlike "Water is H2O."

  **The Stipulated Term** tests the source of necessity. If a community defines "water" as "H2O" from the start, the identity becomes a priori. The Epistemic/Metaphysical Split collapses; there is no empirical surprise. This counts against the idea that the necessity reveals a deep metaphysical truth rather than a linguistic convention. If the necessity of "Water is H2O" depends on our historical ignorance, it cannot support the necessity of "Mind is Brain," because we are introducing our mental concepts precisely to capture the phenomenal aspect, not the physical. This case suggests the water slogan relies on an accidental feature of our linguistic history (naming before knowing) that does not apply to the mind-body problem.

  ### Does it do the work?

  None of the readings alone licenses shutting down the upload argument. The upload argument relies on the conceivability of a functional duplicate lacking qualia. The water slogan aims to show conceivability does not entail possibility. Reading 3 (Epistemic/Metaphysical Split) supports this general modal principle, but it does not establish that the specific identity "Consciousness is Computation" is necessary. It only shows that *if* it is necessary, conceivability won't refute it.

  To bridge the gap, one needs the extra premise from Reading 5 (Ontological Reduction): that consciousness is a natural kind rigidly designated by physical state, with no primary intension independent of physics. Water supports this only if water is not functionally defined. But if water is defined by its role (drinkable, liquid, etc.), then XYZ is water, and the identity fails. Since consciousness is arguably defined by its phenomenal role, the water analogy suggests the identity might fail too.

  Therefore, the slogan does not do the work. It smuggles in Physicalism under the guise of Semantic Externalism. It proves that reference is external, not that everything is physical. To kill the zombie, you must argue that phenomenal concepts rigidly designate physical states despite their apparent independence. The water example shows this is *possible* for some concepts, but it provides no evidence that phenomenal concepts work that way. The move requires asserting that the "appearance of a further question" is purely conceptual, which is the exact claim the zombie argument challenges. The water case cannot establish this without assuming the conclusion.

  ### Bottom line

  The slogan "Water is necessarily H2O" is true but irrelevant to the hard problem of consciousness. It conflates semantic necessity (how we refer) with ontological necessity (how the world is built). While it correctly notes that conceivability does not guarantee metaphysical possibility, it fails to prove that consciousness lacks a primary intension independent of physics. The analogy collapses if consciousness is functionally defined like "watery stuff" rather than structurally defined like "H2O." Ultimately, using water to refute zombies begs the question by assuming physicalism is true of mind because it is true of liquids, ignoring the possibility that liquids are functional kinds while minds are not.
