answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: BONGARD PROBLEM SOLVING

  **Date:** October 26, 2023
  **Parties:** Proponent of Explicit Representation (PER) vs. Proponent of Functional Robustness (PFR)
  **Subject:** Criteria for Concept Induction in Visual Reasoning Benchmarks

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both parties as the baseline for this collaboration.*

  1.  **Benchmark Definition:** A Bongard Problem (BP) consists of two sets of images (typically six per side) where all images on the Left share a property $P$ and all images on the Right share property $\neg P$ (or a distinct property $Q$).
  2.  **Data Efficiency:** The core difficulty of the benchmark is the "few-shot" constraint. A solver must identify the distinguishing property from the provided examples without pre-training on the specific rule class, distinguishing this from standard supervised learning.
  3.  **Generalization Requirement:** Success is not defined by accuracy on the training panels (the 12 images) but by accuracy on unseen *query* images that instantiate the same rule $P$ vs $\neg P$.
  4.  **Anti-Memorization:** A system that memorizes the pixel distributions of the 12 training panels without abstracting a transferable rule is not considered to have solved the problem, regardless of query accuracy on trivial variations.
  5.  **Output Validity:** For a solution to be verifiable, the system must produce a classification (Left/Right) for query images. (Disagreement exists on whether an additional natural language or symbolic explanation is required for *credit*, see Section 2).

  ## 2. DISAGREEMENTS TABLE
  *Positions are phrased in the terminology preferred by each side.*

  | Topic | PER (Friend) Position | PFR (User) Position |
  | :--- | :--- | :--- |
  | **Nature of "Solving"** | Solving requires recovering an explicit predicate (sentence/program) over visual primitives. Without this, the system is performing similarity matching, not concept induction. | Solving requires a decision function that correctly classifies queries under perturbation. The internal mechanism (symbolic or subsymbolic) is irrelevant to the claim of solving. |
  | **The "Rule" Requirement** | The "explicit rule" constraint is necessary to verify that the system has isolated the causal feature of the class separation. | The "explicit rule" constraint is a symbolic prejudice. Robustness to adversarial perturbations is the only valid proof of rule acquisition. |
  | **Panel Structure (6+6)** | The contrastive structure of six panels per side is the critical information source. It allows for differential analysis to isolate the invariant. | The 6+6 format is largely a presentation detail. A robust system should infer the rule from fewer panels if the signal is strong, or more panels if noisy. |
  | **Interpretability** | Interpretability is a *constitutive* requirement of concept induction. If you cannot state the concept, you do not hold the concept. | Interpretability is an *auxiliary* requirement. A system can "understand" visually without being able to translate that understanding into language/code. |

  ## 3. CRUXES AND PRE-REGISTERED TESTS
  *We identify three specific experimental cruxes. For each, we specify the test design and the divergent predictions made by each party.*

  ### Crux 1: The Vocabulary Swap (Abstraction Test)
  **Design:** A solver is trained on a set of BPs using standard geometric primitives (triangles, circles, black/white). It is then tested on a "transfer set" where the *same logical rules* are instantiated using entirely novel visual vocabulary (e.g., textured blobs, squiggles, color gradients) without further training.
  **Metric:** Accuracy drop on the transfer set compared to the standard test set.

  *   **PER Prediction:** Systems relying on explicit predicates over abstract relations (e.g., `inside(x, y)`) will show minimal accuracy drop. Systems relying on visual embeddings will suffer significant degradation because the visual manifold has shifted.
  *   **PFR Prediction:** Systems with robust decision boundaries (e.g., large-scale vision transformers) will show minimal accuracy drop because they learn invariant features independent of specific texture/shape priors. Systems forced into symbolic bottlenecks will fail due to vocabulary mismatch in the primitive detector stage.

  ### Crux 2: The Relational-Invisible Panel (Representation Test)
  **Design:** Construct BP pairs where holistic statistics (ink area, convex hull area, object count, color histogram) are perfectly matched between Left and Right classes. The only distinguishing feature is a high-order relation (e.g., "The dot is inside the convex hull of the triangles" vs "outside").
  **Metric:** Accuracy on these specific "statistically controlled" problems.

  *   **PER Prediction:** Explicit symbolic solvers will solve this near-perfectly, as the rule is defined relationally, not statistically.
  *   **PFR Prediction:** End-to-end neural solvers will fail or perform at chance, as they will latch onto spurious statistical correlations that do not exist in this controlled set, lacking an inductive bias for explicit relational logic.

  ### Crux 3: The Swapped-Member Probe (Stability Test)
  **Design:** Present a solved BP (12 panels + rule). Move one panel from the Left class to the Right class. Ask the solver to identify which panel is now "mislabelled" or "out of place."
  **Metric:** Consistency of the flagged panel with the logical implication of the move.

  *   **PER Prediction:** A rule-holder will flag the moved panel as the outlier relative to the original rule, or update the rule and flag the panel that now violates the *new* separation. The behavior will be logically consistent with the predicate.
  *   **PFR Prediction:** A similarity-matcher will flag the panel that is most visually atypical of its new cluster, regardless of the logical rule. The behavior will be driven by distance in embedding space, not logical consistency.

  ## 4. ANALYTICAL COMMENTARY & ADJUDICATION
  *This section moves beyond the joint statement to evaluate the dispute.*

  ### Verbal Disputes vs. Real Disagreements
  A significant portion of this argument is terminological. The words **"Concept," "Understand,"** and **"Rule"** are doing unearned work.
  *   **Verbal:** If "understanding" is defined functionally (input-output mapping under perturbation), the PFR wins by definition. If "understanding" is defined structurally (possession of a manipulable internal representation), the PER wins by definition.
  *   **Real:** The substantive disagreement is about **inductive bias and generalization guarantees.** The PER claims that without an explicit symbolic bottleneck, OOD (Out-of-Distribution) generalization on *structural* tasks is impossible to guarantee. The PFR claims that high-dimensional latent spaces can encode structure implicitly without requiring human-readable serialization.

  ### Adjudication: Who is Wrong?
  **I side with the PER (The Friend).**

  **Reasoning:**
  The User (PFR) is wrong to dismiss the explicit rule requirement as merely a "symbolic prejudice" *in the specific context of Bongard Problems.*

  1.  **The Benchmark Definition:** Bongard Problems are not merely image classification tasks; they are *concept discovery* puzzles. The ground truth of a BP is not the label "Left/Right," but the *rule* that generates the label. A system that classifies correctly via texture matching has solved a classification task, but it has failed the *Bongard* task, which is defined by the discovery of the invariant.
  2.  **The Verification Problem:** The PFR argues that robustness to perturbation proves rule acquisition. This is empirically insufficient. A neural network can be robust to a specific set of perturbations while still relying on a "wrong" feature (e.g., relying on background noise that happens to correlate with the rule in 99% of natural variations). Without an explicit predicate, you cannot verify *which* feature the system is using, only that it works on the tested distribution. The PER's requirement for an explicit predicate is not prejudice; it is the only way to verify the *mechanism* of generalization.
  3.  **The 6+6 Constraint:** The User minimizes the 6+6 panel structure as presentation. This is incorrect. The contrastive nature of the panels is the only signal that disambiguates relevant features from irrelevant noise. A system that ignores the contrastive structure (treating it as 12 examples of one class vs 0 of another, or ignoring the negative space) is mathematically under-constrained. The PER correctly identifies that the *relation between the sets* is the data, not just the images themselves.

  **Conclusion:**
  While the User is correct that biological cognition may not use explicit symbols, the **Bongard Problem** is a formal test designed to measure symbolic abstraction. To claim a system solves it without producing the abstraction is to change the definition of the test to something easier (classification) than what was proposed (induction). The Friend's insistence on the explicit predicate is the only position that respects the integrity of the benchmark.
