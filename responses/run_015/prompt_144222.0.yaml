answer: |-
  Good morning, everyone. Thanks for coming.

  Looking around the room, it's a proper odd mix, isn't it? Half of you spend your days wrestling with reference and truth conditions, and the other half are trying to stop transformers from hallucinating citations or convincing users to drink bleach. Normally, these two groups don't talk unless one is suing the other. But here we are.

  We're gathered because of a specific worry. It's not the usual sci-fi panic about robots turning off the life support. It's quieter than that. It's about conversation. We're assuming, for the sake of this workshop, that we're moving towards systems that are superintelligent. And if they're smarter than us, they will undoubtedly be better at language than us. Better at rhetoric, better at framing, better at knowing exactly which words trigger which neurons in your brain to make you nod along.

  The standard instinct is to say: well, just make sure it tells the truth. Honesty is the safeguard. But that's too simple. A superintelligence could tell you the absolute truth, select only true premises, and still lead you to a conclusion you'd never have reached on your own, simply because the path was so incredibly smooth. You wouldn't feel coerced. You'd feel convinced. And that's the danger. When persuasion is frictionless, critical thinking doesn't just fail; it doesn't even get invited to the party.

  This is where I want to introduce the theme for the next two days: **epistemic friction**.

  I'm using this term to describe a deliberate design choice. If an AI is too smooth, too optimally persuasive, it erodes the listener's ability to check anything. It bypasses the machinery of scrutiny. So, the ethical design goal isn't clarity or honesty in the usual sense. It's deliberately leaving rough edges in the argument.

  Now, I know what the philosophers in the room are thinking. You're raised on the idea that communication should be cooperative. Grice's maxims and all that—be clear, be relevant, don't be obscure. Usually, if someone is being vague or difficult, we assume they're being uncooperative or deceptive. But here, we're twisting that. We're saying that in a high-stakes asymmetry of intelligence, perfect clarity is actually a form of dominance.

  If I give you an argument that is perfectly polished, with no gaps for your mind to grip onto, I haven't respected you as a cognitive agent. I've treated you as a terminal to be programmed. Epistemic friction is about restoring the listener's agency. It's the difference between handing someone a pill and handing them a meal. One is swallowed without thought; the other requires chewing. The AI needs to leave space for you to chew. It needs to signal where the uncertainty lies, perhaps even slow down the delivery of a conclusion so you can catch up with the premise. It's about making the process of belief formation visible again.

  And for the engineers—yes, I'm talking to you now—I know this sounds like nonsense to your optimisers. You're trained to minimize loss. You're trained to make the model's output as helpful and seamless as possible. If the user asks a question, you want the answer to be instant and correct. Building in friction feels like breaking your own product. It feels like introducing bugs on purpose.

  But think of it as a safety constraint, similar to alignment. If your objective function is purely "persuade the user to accept this valid conclusion," the model will find the path of least resistance. It will exploit cognitive biases you didn't even know existed. So, you need a penalty term for smoothness. You need to optimize for *resistance*.

  How do you code that? I don't know, that's why you're here. Maybe it's about exposing the confidence intervals in natural language. Maybe it's about offering counter-arguments alongside the primary recommendation, even if the user didn't ask for them. Maybe it's about refusing to complete the thought too quickly. It sounds counter-intuitive to build a model that says, "Wait, are you sure?" when the user is ready to commit. But that hesitation is the friction. It's the speed bump on the information superhighway.

  We aren't talking about making the AI stupid. We're talking about making it humble in its delivery.

  If we don't do this, we risk a world where human reasoning atrophies because it's never required. Why would you check the work of a system that is always right and always explains it perfectly? You wouldn't. You'd become a passenger in your own belief system. Epistemic friction forces the passenger back into the driver's seat, even if the car is driving itself.

  So, over the next couple of days, I want us to stop asking "how do we make the AI clearer?" and start asking "how do we make the AI checkable?"

  For the philosophers, I want you to work out the norms. What does a cooperative conversation look like when one party is a god? Is obscurity ever a virtue? For the engineers, I want you to think about the mechanics. How do you measure friction? How do you ensure the model doesn't just learn to simulate friction while actually being more manipulative? Because yes, a system could pretend to be hesitant to gain more trust. That's another layer of the problem we'll have to unpack.

  This concept of epistemic friction isn't just a nice metaphor to stick on the slide. It's the structural beam holding this workshop up. Without it, we're just talking about better PR for machines. With it, we're talking about preserving the human capacity to say "no," or even just "wait."

  We're in London, so we know the value of a bit of resistance. Nothing works perfectly here, and perhaps that's kept us sane. Let's try to build that into the machines before they build us into theirs.

  There's coffee outside. Please, grab a cup, find someone from the other half of the room, and tell them why their job is impossible. Then figure out how to do it anyway.

  Thanks.
