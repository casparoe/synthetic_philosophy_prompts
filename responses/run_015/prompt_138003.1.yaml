          *   *Wait, a better synthesis:* The "Fair Innings" or "Ex-Ante/Ex-Post" distinction. The user's intuition is actually standard in contractualist views (Scanlon). We choose principles no one could reasonably reject. In a one-off, rejecting the lottery is reasonable. In a repeated game (policy), rejecting the life-maximizing rule might be unreasonable because *you* are more likely to be in the group of 5.

