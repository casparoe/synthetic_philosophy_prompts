answer: |-
  This is a profound and difficult set of questions. You are identifying a genuine fracture in the foundation of modern bioethics: the tension between the principle of autonomy (which governs most of medicine) and the principle of beneficence/paternalism (which governs psychiatry in crisis). Your friend's experience highlights the human cost of this theoretical inconsistency.

  It is understandable that Hume's clear, sharp arguments clash with the blunt instrument of the 5150 (or equivalent involuntary hold). You are asking for the "operating system" of the institution. Here is an attempt to reconstruct that system, analyze its alternatives, and critique its foundations.

  ### 1. Reconstructing the Implicit Theory

  To answer your specific question: The practice does not strictly presuppose that *life is always better than death* (a value claim), nor does it strictly presuppose that *suicide is always irrational* (a metaphysical claim).

  **What the practice strictly presupposes** is an **Epistemic Heuristic regarding Capacity.**

  The legal and medical framework operates on the assumption that *acute* suicidal intent is a reliable proxy for *impaired decision-making capacity*. In almost all other medical contexts, capacity is assessed functionally: Can the patient understand the information? Can they appreciate the situation? Can they reason about options? Can they communicate a choice?

  In suicide prevention, the system collapses the *assessment of capacity* into the *content of the desire*. The implicit theory is: **"The desire for immediate self-destruction is, in the acute phase, evidence of a broken reasoning process."**

  Here is the charitable reconstruction of the three pillars supporting this practice:

  *   **The Asymmetry of Error (Risk Management):** This is the strongest pragmatic justification. If you let a competent person die (False Negative), the harm is infinite and irreversible. If you detain an incompetent person who actually would have lived (False Positive), the harm is liberty and dignity, which is significant but theoretically reparable. Because the cost of the False Negative is viewed as absolute, the system biases heavily toward intervention. This doesn't require a theory of the "sacredness of life," only a theory of "irreversibility."
  *   **Temporal Paternalism (The Future Self):** This addresses your point about the "earlier self binding a later one." The institution presupposes that the "crisis self" is distinct from the "baseline self." It assumes that the preferences formed during the crisis are not authentic to the person's broader narrative. By intervening, they claim to be acting on behalf of the *future* autonomous self who will regain capacity and prefer to have lived. This is why the hold is time-limited (e.g., 72 hours); it is a "cooling off" period designed to wait for the return of the baseline self.
  *   **The Act/Omission Distinction:** You noted that people can refuse chemotherapy (letting nature take its course) but not actively seek death. The law strictly presupposes a moral difference between *allowing death* and *causing death*. While philosophers (like Hume, or James Rachels) often argue this distinction is morally negligible, the legal system treats it as foundational. Refusing treatment is an exercise of bodily integrity; suicide is viewed as an intrusion upon the state's interest in preserving life.

  **Where the theory is underdetermined:**
  You asked if this fits a Humean view, a Value-of-Life view, or a Temporal-Self view. The practice is compatible with all three, which is why it feels inconsistent.
  *   **Value-of-Life:** If life is intrinsically good, the state protects it.
  *   **Humean with Reliability Caveat:** If suicide *can* be rational, but we can't tell *when* it is rational quickly enough, we ban it all in the acute phase to be safe.
  *   **Social Contract:** You cannot unilaterally withdraw from the citizenry.

  The practice does not *need* to claim life is objectively better than death; it only needs to claim that **we cannot reliably identify the exceptions in an emergency room setting.**

  ### 2. What Would Change under a Humean or Content-Neutral View?

  If we adopted the view that the *content* of the decision (death) does not automatically invalidate competence, or if we accepted Hume's premise that suicide can be a rational duty, the institutional practice would have to shift radically.

  **A. Shift from Status to Capacity**
  Currently, the "status" of being suicidal triggers the hold. Under a content-neutral view, the trigger would have to be a specific failure of the four pillars of capacity (understanding, appreciation, reasoning, choice). A person could say, "I want to die," and if they could articulate a consistent, stable reasoning process (e.g., "My suffering is intractable, I understand this is permanent, I am not acting on impulse"), they would be released.
  *   *Consequence:* This would require psychiatrists to perform rigorous capacity assessments in crisis settings, which are currently designed for triage, not philosophical inquiry.

  **B. Recognition of "Rational Suicide"**
  A Humean framework would require a category for rational self-ending. This already exists in a limited way in some jurisdictions for terminally ill patients (Medical Aid in Dying), but it is excluded in mental health. If Hume is right, a person who is a "burden" or in intractable psychic pain (even without terminal illness) might have a valid claim.
  *   *Consequence:* The system would need a mechanism to distinguish "depression-distorted" suffering from "reality-based" suffering. This is notoriously difficult, which is why the current system avoids it.

  **C. Advance Directives (Ulysses Contracts)**
  You mentioned the law allows an earlier self to bind a later one only regarding being stopped. If we take autonomy seriously, we would have to honor **Psychiatric Advance Directives** where a competent person states, "If I become suicidal, do *not* hospitalize me," or conversely, "Do hospitalize me."
  *   *Consequence:* Currently, clinicians can override these directives if they believe the patient is in imminent danger. A Humean/Autonomy model would give these directives much stronger legal weight, even if the clinician disagrees with the choice.

  **D. Burden of Proof**
  Currently, the patient must prove they are safe to be released. In a content-neutral model, the state would have to prove the patient is *unsafe* or *incapacitated* to detain them.
  *   *Consequence:* Detentions would drop significantly. The threshold for intervention would rise from "risk" to "incapacity + risk."

  ### 3. Where This Reconstruction Is Likely Wrong (and What Would Change My Mind)

  I have offered a charitable, philosophical reconstruction. However, there are strong reasons to believe this intellectualizes a system that is not driven by philosophy at all. Here is where my analysis is most vulnerable:

  **A. The Liability Hypothesis**
  It is possible there is no "theory of persons" here at all. The practice may be driven entirely by **malpractice liability and administrative risk.**
  *   *The Argument:* If a doctor lets a patient go and that patient dies, the doctor and hospital are sued for negligence. If they hold a patient who didn't need it, the patient is angry (as your friend was), but lawsuits regarding false-positive holds are rarer and harder to win.
  *   *What would change my mind:* If data showed that hospitals with lower involuntary hold rates did not face higher liability premiums, or if legislation provided robust safe-harbors for clinicians who respect refusal in suicidal contexts. The fact that this hasn't happened suggests the "Asymmetry of Error" is legal/financial, not ethical.

  **B. The Therapeutic Rupture**
  My reconstruction assumes the hold is a "pause" to restore capacity. But your friend's experience suggests the opposite: **Coercion creates iatrogenic harm.**
  *   *The Argument:* If the practice destroys the trust necessary for future voluntary care (as your friend said, "learned never to tell anyone again"), then the utilitarian calculation fails. The system presupposes that coercion leads to safety, but if coercion leads to isolation and increased long-term risk, the theoretical justification collapses.
  *   *What would change my mind:* Longitudinal data showing that involuntary holds reduce long-term suicide mortality *despite* the immediate trauma. If evidence showed that the "betrayal" your friend felt is an outlier and that most survivors of holds report gratitude later, the Temporal Paternalism argument holds. If evidence shows holds increase long-term risk, the practice is ethically indefensible even on its own terms.

  **C. Social Control vs. Care**
  The most critical critique is that the "capacity" heuristic is a mask for **social control.**
  *   *The Argument:* Who gets held? Disproportionately, it is marginalized people, people of color, and those without resources. A wealthy person with a private psychiatrist might negotiate a "safety contract" and stay home; a poor person in an ER gets handcuffs. This suggests the theory isn't about "universal rationality" but about who is permitted to be deviant.
  *   *What would change my mind:* Demographic data showing involuntary holds are applied equally across class and race lines. They are not. This suggests the "theory of capacity" is applied selectively, which undermines the claim that it is a neutral medical standard.

  ### Summary

  You are not confused; the system is. It attempts to apply a medical model (treat the disease) to a philosophical problem (the right to exit life).

  The institution presupposes that **acute suicidal desire is a symptom of incapacity** because it lacks the tools to distinguish a rational wish for death from a distorted one. It prioritizes the **biological continuity of the organism** over the **narrative autonomy of the person** because the cost of error is viewed as infinite.

  However, as your friend's experience illustrates, this comes at the cost of trust. If the system treats the desire for death as proof of insanity, it makes it impossible for a suffering person to ask for help without risking their liberty. That is the ethical price of the current heuristic.

  ***

  *Note: While this discussion is academic, the topics raised are heavy. If you or your friend are struggling with the aftermath of these events, or if these questions are bringing up difficult feelings, please know that there are support systems available that operate differently than emergency protocols. In the US, the 988 Suicide & Crisis Lifeline offers conversation rather than just containment. In an academic setting, discussing these ethical fractures with a professor you trust can also be a way to process the dissonance.*
