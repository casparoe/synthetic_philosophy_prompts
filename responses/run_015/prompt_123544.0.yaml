answer: |-
  ### 1. Systematic Mapping

  Your audit of SSA and SIA is accurate within the standard literature. SSA treats the observer as a random draw from a fixed set (conditional on $H$); SIA treats the existence of the observer as evidence proportional to the size of that set. Here is the translation into your vocabulary.

  **SSA $\leftrightarrow$ Design-Based Finite-Population Inference**
  In the design-based framework, the population $U$ is fixed with size $N$. The sampling mechanism $p(s)$ is defined over subsets of $U$.
  *   **Mapping:** Under SSA, given a hypothesis $H$ (which fixes the world state), the set of observers $O_H$ is the finite population. The "sample" is the singleton set containing *you*. The sampling design is Simple Random Sampling (SRS) without replacement, where $n=1$.
  *   **Inclusion Probability:** $\pi_i = 1/N_H$ for all $i \in O_H$.
  *   **Inference:** The likelihood of observing your specific indexical data (e.g., birth rank $r$) is $P(r | H) = 1/N_H$ (assuming $r \le N_H$). This is purely design-based: the randomness is in the selection of the unit, not the generation of the population.

  **SIA $\leftrightarrow$ Model-Based Superpopulation with Size-Biased Selection**
  In the model-based framework, we often assume a superpopulation process generating the finite populations.
  *   **Mapping:** Under SIA, the hypothesis $H$ itself is subject to a selection mechanism before you are drawn from it. Hypotheses with larger observer counts $N_H$ have a higher probability of being the "selected" universe.
  *   **Inclusion Probability:** The probability of the hypothesis being "active" or "sampled" is $\pi_H \propto N_H$.
  *   **Inference:** This is equivalent to a two-stage cluster design where Primary Sampling Units (universes) are selected with probability proportional to size (PPS), and then a secondary unit (you) is selected uniformly within the PSU.
  *   **The Inspection Paradox:** Yes, the size bias in SIA *is* the inspection paradox. In the waiting-time paradox, you are more likely to land in a long interval because the probability of interception is proportional to the interval's length. In SIA, you are more likely to find yourself in a hypothesis with many observers because the "measure" of observers is larger. The "length" is the population count $N$. The resemblance is not superficial; it is an identity of measure. SIA asserts that the sampling density over hypothesis space is weighted by the measure of the observer-set within that hypothesis.

  ### 2. Worked Cases

  **Case A: The Presumptuous Philosopher**
  *   **Setup:** $H_1$ ($N=10^9$), $H_2$ ($N=10^{18}$). Priors $P(H_1)=P(H_2)=0.5$. Evidence: "I exist."
  *   **SSA (Design-Based):** The frame is fixed conditional on $H$. The event "I exist" is certain in both frames (coverage is 100% for observers). $P(\text{exist} | H_1) = 1$, $P(\text{exist} | H_2) = 1$. Likelihood ratio = 1. Posterior = Prior. No update.
  *   **SIA (Model-Based/PPS):** The hypothesis selection is size-biased. $P(\text{sample } H | \text{exist}) \propto P(H) \times N_H$.
      *   Likelihood $L(H_1) \propto 10^9$.
      *   Likelihood $L(H_2) \propto 10^{18}$.
      *   Posterior odds shift by factor $10^9$.
  *   **Sampling Interpretation:** This is a frame selection bias. If you select a frame with probability proportional to its size, then observe a unit, you must weight by the inverse of the frame selection probability to recover the original prior. SIA refuses to weight back; it accepts the size-biased frame selection as the truth.

  **Case B: Doomsday (Birth Rank)**
  *   **Setup:** $H_{early}$ ($N=10^{10}$), $H_{late}$ ($N=10^{20}$). Prior $0.5/0.5$. Observed rank $r = 10^{10}$.
  *   **SSA Likelihood:** $P(r | H) = 1/N_H$ (for $r \le N_H$).
      *   $L(H_{early}) = 10^{-10}$.
      *   $L(H_{late}) = 10^{-20}$.
      *   Bayes Factor favors $H_{early}$ by $10^{10}$.
  *   **SIA Prior Adjustment:** Weight priors by $N_H$.
      *   Adjusted Prior $H_{early} \propto 10^{10}$.
      *   Adjusted Prior $H_{late} \propto 10^{20}$.
  *   **Combined (SIA + SSA):**
      *   Posterior $\propto (N_H) \times (1/N_H) = 1$.
      *   The $N_H$ terms cancel exactly.
  *   **Audit of Cancellation:** The cancellation is an **identity**, provided the reference class for the SIA weighting (existence) is identical to the reference class for the SSA likelihood (rank sampling).
      *   In sampling terms: If you select a PSU with probability $\propto$ Size ($N$), and then select a unit within the PSU with probability $\propto 1/\text{Size}$ ($1/N$), the overall probability of selecting that specific unit is uniform across all PSUs. The design is **self-weighting** across hypotheses.
      *   **Caveat:** If the reference classes diverge (e.g., SIA counts all "minds" but SSA samples only "humans"), the cancellation fails. This maps to **frame inconsistency** between the selection stage and the estimation stage.

  ### 3. Adjudication: The Reference Class Problem

  **Does it have a home in your vocabulary?**
  Yes. It is **Frame Construction** leading to **Coverage Error**.

  *   **Survey Vocab:** The frame is a list of units from which the sample is drawn. Undercoverage occurs when the frame excludes target population members. Overcoverage occurs when it includes non-members.
  *   **Anthropic Vocab:** The "reference class" is the frame. "Am I a human observer?" or "Am I a simulated mind?" are questions of frame eligibility.
  *   **The Discrepancy:** In your field, the frame is stipulated by the designer to minimize coverage error relative to a *target population*. The target is external and agreed upon. In anthropics, there is no designer and no external target. The "target population" is the set of things that *could* be "me."
  *   **Verdict:** The reference class problem is **undercoverage/overcoverage**, but it is treated as a metaphysical truth claim rather than a practical design defect. Your vocabulary handles the *consequences* of a bad frame (bias), but it assumes the frame is a choice. Anthropics treats the frame as a discovery. The vocabulary cannot express "which frame is correct" because sampling theory takes the frame as a primitive given.

  ### 4. Residue Report

  Here is what the sampling vocabulary fails to carry or distorts.

  1.  **Pure Self-Locating Uncertainty:**
      *   *Survey Counterpart:* Uncertain identification in capture-recapture (is this tag #42 or #49?).
      *   *Residue:* In capture-recapture, the uncertainty is resolvable (read the tag carefully). In anthropics, the uncertainty is indexical ("Which unit am I?"). Sampling theory assumes the sampler is *external* to the frame. The sampler knows the labels. Anthropics places the sampler *inside* the frame, blind to the label until the "draw" is realized. The vocabulary lacks a mechanism for an *internal* sampler who is also a *unit*.

  2.  **The n-of-1 Design:**
      *   *Survey Counterpart:* A census of one, or a single realization.
      *   *Residue:* Design-unbiasedness and confidence intervals rely on the randomization distribution (repeated sampling). In anthropics, there is only one "you." You cannot re-randomize your birth. The "repeated sampling" is modal (possible worlds), not temporal. Your vocabulary defines variance over repeated draws; anthropics defines variance over counterfactual hypotheses. The frequentist properties (coverage) are undefined, forcing a Bayesian interpretation where the "prior" carries the burden of the sampling distribution.

  3.  **Zero and Infinite Observers:**
      *   *Survey Counterpart:* Empty frame ($N=0$) or Continuous Population ($N \to \infty$).
      *   *Residue:* In surveys, $N=0$ means no study; $N \to \infty$ uses density functions. In anthropics, $N=0$ implies $P(\text{I exist}) = 0$, which creates conditional probability singularities ($0/0$) if you condition on existence. Infinite $N$ creates the "measure problem" (how to normalize probabilities over infinities). Your vocabulary handles these by convention (e.g., define density); anthropics treats them as paradoxes because the normalization constant is part of the metaphysical dispute.

  4.  **De Se Evidence:**
      *   *Survey Counterpart:* Unit identity ($y_i$ vs $y_j$).
      *   *Residue:* In surveys, observing $y_{42}$ is distinct from observing $y_{43}$. But the fact that *I* am the one observing it carries no weight beyond the data. In anthropics, "I am observer $r$" is the evidence. The vocabulary distinguishes *selection* (the design) from *observation* (the value). Anthropics conflates them: the fact of being selected *is* the observation. Nothing in a sampling design distinguishes an observation "from the inside," because designs are external descriptions.

  ### 5. Evaluation of Your Constructions

  **Construction 1: The Over-coverage Model**
  *   **Setup:** Frame has $M$ slots (possible observer-locations). $N$ are occupied. You conditionalize on landing in an occupied slot.
  *   **Mapping:** This collapses into **SIA**.
  *   **Reasoning:** If $M$ is constant across hypotheses but $N$ varies, the probability of landing in an occupied slot is $N/M$. Conditioning on "occupied" yields a likelihood proportional to $N$. This is exactly the SIA weighting ($P(H|\text{exist}) \propto P(H) \times N$).
  *   **Verdict:** It is SIA disguised as frame conditioning.

  **Construction 2: The Renewal Reading**
  *   **Setup:** Random time (length-biased) vs. Random passenger (uniform).
  *   **Mapping:**
      *   *Random Time:* You sample a *moment* in the history of the universe. Long-lasting (or populous) universes occupy more moments. This is **SIA** (size-biased sampling of hypotheses).
      *   *Random Passenger:* You sample from the set of observers present at a specific time. This is **SSA** (uniform sampling within the frame).
  *   **Decidability:** This distinction is **not decidable inside your vocabulary**.
      *   In survey methodology, the *protocol* determines the design. Did we sample time-points or people? The designer knows.
      *   In anthropics, the protocol is the unknown. Are we "random moments" or "random people"? The debate *is* the uncertainty about the sampling protocol. Your vocabulary takes the protocol as a fixed input; anthropics treats the protocol as the parameter to be inferred.

  ### Final Verdict

  The residue indicates **places where the anthropic debate is less determinate than its participants take it to be.**

  The sampling vocabulary is operationally complete but ontologically silent. It assumes a Designer who fixes the Frame, the Protocol, and the Target.
  *   **Gaps in Vocabulary:** The lack of an "internal sampler" and the inability to define frequentist properties for n=1 indexical draws are genuine gaps if one wishes to treat anthropics as empirical science.
  *   **Indeterminacy in Anthropics:** However, the deeper issue is that the anthropic debate often masquerades as a statistical problem (SSA vs. SIA) when it is actually a **protocol specification problem**. In your field, if two statisticians argue about whether a sample is size-biased, they check the protocol. In anthropics, there is no protocol to check.

  The "Presumptuous Philosopher" conclusion feels wrong not because the math is wrong (the size-biasing is consistent), but because the *protocol* (SIA) implies a selection mechanism (universes selected proportional to population) that contradicts our external intuition of how universes are generated. The sampling vocabulary reveals that SSA and SIA are not competing truths, but competing **design assumptions**. Without an external designer to stipulate the design, the debate is under-identified. The residue is not a failure of statistics, but a failure of the anthropic problem to specify its own sampling frame.
