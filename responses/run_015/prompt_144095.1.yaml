answer: |-
  **AD HOC COMMITTEE ON NAMING (ACON)**
  **Minutes of Meeting #4**
  **Date:** 14 October 2023
  **Location:** Conference Room B, Administration Building
  **Time:** 14:00 – 15:30

  **Present:** Dr. A. Smith (Chair), Prof. B. Jones, Prof. C. Davis, Prof. D. Wilson, Prof. E. Brown, Prof. F. Taylor, Prof. G. White (Secretary).
  **Apologies for Absence:** None.

  **1. Old Business: Adoption of Voting Criteria**
  The Chair called the meeting to order. The Committee reviewed the four conditions for preference aggregation drafted at Meeting #3, required to ensure any naming procedure is defensible against future grievance. The conditions were reaffirmed as follows:

  1.  **Universal Domain:** Every member's ranking of the shortlist has to be admissible.
  2.  **Pareto Efficiency:** If everyone ranks A above B then the committee ranking does too.
  3.  **Independence of Irrelevant Alternatives (IIA):** The committee's ranking of A versus B may depend only on how members ranked A against B.^1
  4.  **Non-Dictatorship:** There is no single member who always gets their way.^2

  It was noted that these conditions constitute the baseline for procedural legitimacy and must be satisfied simultaneously to prevent litigation.

  **2. New Business: Evaluation of Aggregation Methods**
  Prof. Davis proposed restricting the domain to single-peaked preferences to bypass impossibility results. She suggested preferences could be aligned along a "Traditional-to-Modern" axis. A motion was carried to form a Subcommittee on Faculty Preference Alignment, charged with making the faculty single-peaked. The motion was referred to Steering for budgetary review regarding sensitivity training required to adjust faculty preferences along the proposed axis.

  Prof. Wilson suggested abandoning Condition 3 (IIA) in favor of a Borda-style point system or moving to cardinal utilities with interpersonal comparisons. Prof. Brown noted that cardinal utilities require interpersonal comparisons of utility, which are unverifiable and thus administratively untenable. Regarding Borda, the Secretary noted that the newsletter requires an ordered shortlist of three, not merely a winner. Furthermore, it was recorded that Borda counts violate Condition 3. The proposal was rejected.

  Prof. Taylor proposed Instant-Runoff Voting (IRV). Prof. White noted, with visible irritation, that IRV fails Independence of Irrelevant Alternatives. It was further noted that IRV can fail monotonicity, wherein a name may lose by becoming more popular. Prof. Taylor attempted to define IIA loosely as "no spoilers." The Secretary corrected the record to note that IIA is strictly defined regarding pairwise consistency, not merely spoiler effects.^3 The proposal was tabled for lack of time.

  **3. Any Other Business**
  The Committee reviewed the mathematical implications of the four conditions. It was observed that no ranked voting system satisfies all four conditions simultaneously when there are three or more options. The only procedure meeting all four conditions is for a single member to decide.

  **4. Adjournment**
  To resolve the deadlock democratically, a motion was made to appoint the Chair as Dictator pending review at the next meeting. The motion was seconded. The Committee voted unanimously to adopt this procedure using the show-of-hands method nearest to hand. There was general satisfaction that this outcome was arrived at democratically.

  The meeting adjourned at 15:30.

  ***

  ^1 Independence of Irrelevant Alternatives requires that the social preference between two options depends only on individual preferences between those two options, not on preferences regarding third options.
  ^2 A dictator in the theorem's sense is someone whose strict preference over any pair becomes the group's, not merely someone influential, and not someone with a veto.
  ^3 The "no spoilers" heuristic is insufficient; IIA prohibits changes in relative ranking due to the introduction or removal of non-winning alternatives.
