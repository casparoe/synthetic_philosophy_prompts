answer: |-
  **Brainstorming**

  (a) **The Argument:** The core moral claim is that resources should be directed where they alleviate the most urgent absolute need, not where they maximize total scores or equalize relative standing. An hour of teaching helps a child who cannot read more than it helps a child who already reads well. This is not about closing the gap between kids; it is about addressing the severity of the deficit itself. The value of the help is weighted by the absolute condition of the recipient.

  (b) **What It Is Not:** This is not strict egalitarianism (the gap itself is not the enemy). It is not utilitarianism (we are not simply summing test scores; we are weighting them by need). It is not a claim that "everyone benefits" (the honors students clearly lose enrichment). It is not based on relative ranking within the school (being in the bottom quartile *here* is not the justification; being below grade level *period* is).

  (c) **Forbidden Sentences:**
  1. *"This creates a level playing field."* (Reason: Implies the goal is equality of outcome/relative standing, triggering the levelling-down objection.)
  2. *"Nobody loses out in the long run."* (Reason: False; honors students lose specific enrichment opportunities.)
  3. *"Our bottom quartile needs this."* (Reason: Relies on relative ranking within the school, not absolute need.)
  4. *"Reading scores determine future success."* (Reason: Empirically deterministic; violates the rule against pretending scores predict life outcomes.)
  5. *"We are removing the plaque to stop competition."* (Reason: Doesn't fit the resource allocation argument; needs separate justification.)
  6. *"This is fair for everyone."* (Reason: Obscures the specific, weighted loss to the honors kids.)

  ***

  **Speech**

  Good evening. Thank you for coming. I know why this room is full. I know why many of you are angry. I am here to explain a decision the board and I have made regarding next year's budget and programming. We are ending the honors track for grades four through eight. The funds currently supporting that program—approximately twenty thousand dollars a year—will be moved entirely into a reading intervention program for students currently reading below grade level.

  I want to be clear about what this means. It means forty students will lose a dedicated classroom, specialized materials, and the enrichment trip they were expecting. It means those students will be integrated into general education classrooms. I am not going to tell you that this is a better opportunity for them. It is not. They are losing something real. They are losing acceleration to fund remediation.

  I am also not going to tell you that this is because the gap between our highest readers and our lowest readers is unfair in itself. I do not believe that one child having more than another is the problem. The problem is that ninety children in this building cannot read at a level that allows them to access the world independently.

  Here is the reason we are doing this. We have a fixed amount of money and teacher time. When we put an hour of specialized instruction toward a child who already reads well, it adds to their skill. When we put that same hour toward a child who cannot read, it gives them a tool they currently lack. The help counts for more when it goes to the child who is worse off in absolute terms. It is not about where they rank compared to the kid next to them. It is about the difference between having a skill and not having it at all. We are choosing to direct our resources where the absence of the resource is most damaging.

  I need to address the students in the honors program directly, and their families. You were promised a program, and we are withdrawing it. I know some of you worked hard to earn that spot. For most of you, this is a loss of enrichment. For six of you, this loss lands on families already carrying heavy financial burdens. We know that for those six students, this setback weighs more. It counts for more when a loss hits a child who is already struggling outside these walls. We are not ignoring that weight. We are acknowledging it, and we are proceeding because the need on the other side of this equation—the ninety children who cannot read—is urgent in a way that overrides even that heavier loss.

  There is a second part of the board's motion that I need to address separately. We are removing the honors plaque from the hallway and stopping the publication of the honor roll. I want to be honest: the argument I just gave you about resource allocation does not apply here. Taking down a plaque does not fund a reading teacher. This decision rests on something else. It is about what we choose to signal on our walls. We are choosing to signal that this building celebrates growth and effort publicly, rather than ranking achievement. I voted for this, but I acknowledge it is a cultural choice, not a budgetary necessity. It does not fix reading scores. It is simply what we want this hallway to say to a child walking by.

  I am not going to promise you that fixing reading levels now guarantees success later. I cannot know whose life will go badly based on a third-grade test. But I do know that right now, ninety children are locked out of their own education. We have the money to unlock forty children's enrichment, or ninety children's access. We are choosing access.

  I know this does not fix everything. I know some of you feel betrayed. I am not asking for your applause. I am asking you to understand that we are choosing to spend our limited care where the lack of it is most severe. We will support the honors students as they transition, but we will not restore the program. Thank you.

  ***

  **Note to Principal**

  **Settled:** There is consensus that resource allocation in public education requires trade-offs; you cannot maximize all goods simultaneously. Everyone agrees that literacy is a fundamental prerequisite for further education, giving it a strong claim on resources.

  **Contested:** You have explicitly adopted the **Priority View** (benefits matter more the worse off the recipient is in absolute terms) rather than **Strict Egalitarianism** (closing the gap is the goal) or **Utilitarianism** (maximizing total scores). This is the contentious move. The philosopher in the room knows the Priority View is designed to avoid the "levelling down objection" (the idea that egalitarianism implies it's good to make everyone worse off if it reduces inequality). You successfully avoided saying the gap itself is bad. However, philosophers dispute whether the Priority View adequately handles the "separate persons" objection—whether you can aggregate weighted gains across different kids to outweigh a heavy loss for a few. You picked a side: you admitted the loss to the six poor kids counts for *more*, but you overridden it with the aggregate weighted gain of the readers. That is a specific, contested moral wager.

  **Empirical:** You admitted you can't predict long-term life outcomes from reading scores. This is honest. The claim that intervention *now* yields higher returns than enrichment *now* is an empirical claim about educational efficacy that is mixed in the literature. You staked the speech on the urgency of the deficit, not the guarantee of the cure.
