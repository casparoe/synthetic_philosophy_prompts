      *Underdetermination:* If they Approve, they declare Housing Displacement a "Permanent Emergency" akin to a storm that never ends, overriding the Sunset Principle. If they Reject, they affirm that Housing Markets, like Labor/Produce, cannot sustain permanent price distortions without unintended consequences.

