          5.  Future case to distinguish between rules.
          6.  Honest assessment if precedents underdetermine the answer (principles adopted by either choice).

  2.  **Deconstruct the Precedents:**

      *   *Precedent 1 (Rent Stabilization):* Approved.
          *   Type: Price Control (Ceiling on *increases*, not absolute price).
          *   Scope: Targeted (neighborhoods with documented displacement).
          *   Duration: Temporary (5-year sunset).
          *   Goal: Prevent displacement.
      *   *Precedent 2 (Minimum Wage):* Rejected.
