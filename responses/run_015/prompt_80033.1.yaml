      *   So, "Permanent" is the strongest negative signal. "Citywide" is a secondary negative signal (P1 & P5 were targeted).

      *Let's refine the Rules:*
      1.  **The Sunset Principle:** Controls must expire. (P1, P3, P5 = Yes. P2, P4 = No).
