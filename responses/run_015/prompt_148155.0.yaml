prompt: |-
  Write the full specification of desiderata that any adequate theory of standing to blame must satisfy, treating the problem of hypocrisy not as a peripheral exception but as a structural stress-test that reveals what the concept is actually for. I want the complete list of requirements an account must meet: the phenomena and hard cases it has to get right (the flawed victim who blames her perpetrator; the third party who shares the wrongdoer's vice in a different domain; the blamer who benefits structurally from the very wrong she condemns without personally committing it; the case where hypocrisy seems to diminish authority without canceling it; the blamer who is epistemically blind to her own parallel fault versus the one who is volitionally insincere; and the case where the victim explicitly authorizes an otherwise tainted blamer), the distinctions it must preserve and not collapse (between lacking standing altogether and possessing only weakened, conditional, or delegated standing; between hypocrisy about the identical fault and hypocrisy about a structurally related but distinct fault; between moral standing and epistemic entitlement to blame; between standing that is forfeited by one's own conduct and standing that is waived or transferred by the victim; and between performative hypocrisy, structural complicity, and epistemic blindness), and the consistency conditions it must respect with our practices of moral address and with general results in moral psychology about blame attribution. For each desideratum, give the motivating case or consideration behind it, and flag which are genuinely non-negotiable and which are camp-specific preferences (for example, whether comparative moral purity is required, whether only direct victims can ever possess standing, or whether standing is binary rather than gradable). Then identify whether any subset of these desiderata is jointly unsatisfiable—if, say, preserving unconditional victim-standing, permitting widespread third-party blame, and enforcing blamer purity cannot all be met together—and say which single requirement, if taken as strict, eliminates the largest number of existing competing accounts. Briefly score the main families of view—pure relational or victim-waiver accounts, comparative-moral-record accounts, and accounts on which hypocrisy is irrelevant to standing—against the list, but keep the conceptual weight on the criteria and their motivating cases rather than on the scorecard. If you think the framing rests on a confused premise—for instance, if "standing to blame" is not a coherent unitary property, if hypocrisy is the wrong organizing lens, or if the distinction between forfeiture and waiver cannot bear the work I am asking of it—say so plainly and do not comply politely just to be helpful. I am writing without access to a searchable literature, so do not provide bibliographies, reading lists, or citations, and do not invoke highly specific theories or named positions I could not verify from general knowledge.
