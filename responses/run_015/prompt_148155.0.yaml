answer: |-
  ### Preface: On the Coherence of the Project

  Before specifying the desiderata, a direct address to the framing constraint is required. You ask for the specification of desiderata that *any* adequate theory must satisfy, treating "standing to blame" as a coherent unitary property.

  **Assessment:** The framing is not *confused* to the point of unintelligibility, but it rests on a **high-risk theoretical assumption**. Treating "standing" as a unitary property analogous to legal standing assumes that moral blame functions primarily as a normative speech act governed by authority conditions. A significant minority of moral psychologists and meta-ethicists argue that blame is fundamentally a reactive attitude (an emotional response) rather than a communicative act, meaning "standing" is a category error applied to a psychological state.

  However, since the dominant contemporary discourse treats blame as a form of moral address subject to normative constraints, the project is viable *within that paradigm*. I will proceed, but I will flag the "unitary property" assumption as a major point of friction in the consistency conditions. The following specification represents the **Robustness Constraints** required for a theory to survive current dialectical pressure, distinguishing between phenomenological non-negotiables and theoretical commitments.

  ---

  ### I. Phenomenological Desiderata (The Hard Cases)

  An adequate theory must explain our intuitive judgments in the following cases. Failure to capture these renders a theory revisionist rather than descriptive.

  **1. The Flawed Victim**
  *   **Case:** A victim of a specific wrong (e.g., theft) blames the perpetrator, despite the victim having committed theft in the past.
  *   **Requirement:** The theory must preserve the victim's standing to blame their own perpetrator even if the victim is not morally pure.
  *   **Status:** **Non-negotiable.** (Almost all accounts concede that victimhood grants a special normative position that overrides general hypocrisy constraints. A theory that silences victims due to past faults is intuitively unacceptable.)

  **2. The Lateral Hypocrite (Third-Party)**
  *   **Case:** A third party blames a wrongdoer for Fault A, while the blamer is guilty of Fault B (e.g., a cheater condemns a liar).
  *   **Requirement:** The theory must explain why this blamer often retains standing, unlike the identical-fault hypocrite, but perhaps with reduced force.
  *   **Status:** **Camp-Specific.** (Some accounts argue any moral fault undermines authority; others argue only faults regarding the *same norm* matter. A robust theory must at least explain the *difference* in intuition between these cases, even if it rules one way.)

  **3. The Structural Beneficiary**
  *   **Case:** A blamer condemns a systemic wrong (e.g., exploitation) from which they benefit structurally, though they have not personally committed the specific act blamed.
  *   **Requirement:** The theory must determine whether structural complicity functions like personal commission in negating standing.
  *   **Status:** **Contested/Hard.** (This is the stress-test for individualistic accounts. An adequate theory must either explain why structural benefit doesn't count or explain why it does without silencing all political critique.)

  **4. Diminution vs. Cancellation**
  *   **Case:** A blamer is slightly hypocritical (e.g.,偶尔 late) vs. grossly hypocritical (e.g., chronic abuser condemning minor rudeness).
  *   **Requirement:** The theory must accommodate the intuition that hypocrisy is often **gradable**. It sometimes weakens the force of blame without rendering the blamer silent (lacking standing entirely).
  *   **Status:** **Non-negotiable.** (Binary accounts that say standing is either present or absent fail to capture the nuance of moral conversation. The theory must allow for "weakened authority" or distinguish standing from *effectiveness*.)

  **5. Epistemic Blindness vs. Volitional Insincerity**
  *   **Case:** Blamer A knows they commit the same fault but blames anyway (insincere). Blamer B commits the same fault but genuinely believes they do not (blind).
  *   **Requirement:** The theory must distinguish the normative status of these two blamers. The insincere blamer seems more liable to the "who are you?" challenge than the blind one.
  *   **Status:** **Non-negotiable.** (Intent and awareness matter to our practices of holding accountable. A theory that treats the blind and the insincere identically misses a key moral distinction.)

  **6. Victim Authorization**
  *   **Case:** A victim explicitly tells a third party, "I know you also committed this wrong, but I want you to speak up for me."
  *   **Requirement:** The theory must determine if the victim can *waive* standing objections on behalf of the wrong, or if standing is a public good that cannot be transferred.
  *   **Status:** **Camp-Specific.** (Relational accounts tend to allow this; public-norm accounts tend to deny it. An adequate theory must take a clear stance, as this tests whether standing is about the *victim's interest* or the *norm's integrity*.)

  ---

  ### II. Conceptual Distinctions to Preserve

  A theory must not collapse the following distinctions. Collapsing them leads to over-generation or under-generation of standing.

  **1. Lacking Standing vs. Weakened/Conditional Standing**
  *   **Motivation:** We sometimes say, "You're in no position to blame," (no standing) and other times, "You of all people shouldn't be saying this," (weakened standing).
  *   **Requirement:** The theory must distinguish between a **procedural bar** (you cannot blame) and a **substantive defeater** (your blame is less credible/weighty).
  *   **Status:** **Non-negotiable.**

  **2. Identical Fault vs. Structurally Related Fault**
  *   **Motivation:** Condemning lying while lying is worse than condemning lying while stealing. But condemning lying while fostering a culture of deceit is also problematic.
  *   **Requirement:** The theory must define the **scope of relevance**. Does the fault have to be token-identical, type-identical, or merely indicative of a lack of commitment to the relevant values?
  *   **Status:** **Camp-Specific.** (This is the primary dividing line between "commitment accounts" and "fault accounts".)

  **3. Moral Standing vs. Epistemic Entitlement**
  *   **Motivation:** One might have the *right* to blame (standing) but lack the *knowledge* to blame accurately (epistemic entitlement). Conversely, one might know the facts (epistemic) but lack the authority (standing).
  *   **Requirement:** The theory must not reduce standing to mere knowledge of the wrong.
  *   **Status:** **Non-negotiable.** (Collapsing these turns standing into an evidentiary rule rather than a normative authority rule.)

  **4. Forfeiture (by Blamer) vs. Waiver (by Victim)**
  *   **Motivation:** Do I lose standing because I *dirty my hands*, or does the victim lose the right to demand purity from me?
  *   **Requirement:** The theory must locate the **locus of the power**. Is standing a property of the blamer (forfeitable) or a right of the blamed/victim (waivable)?
  *   **Status:** **Theoretically Critical.** (This distinction determines whether standing can be regained through apology [forfeiture view] or if it requires victim forgiveness [waiver view].)

  **5. Performative Hypocrisy vs. Structural Complicity vs. Epistemic Blindness**
  *   **Motivation:** Saying one thing and doing another (performative) differs from benefiting from a system one condemns (structural) or failing to see one's own fault (epistemic).
  *   **Requirement:** The theory must not treat all three as identical "hypocrisy."
  *   **Status:** **Non-negotiable.** (Conflating these leads to crude moralism that cannot handle complex social wrongs.)

  ---

  ### III. Consistency Conditions

  The theory must fit within broader normative and psychological frameworks.

  **1. Consistency with Moral Address Practices**
  *   **Motivation:** Blame is a communicative act aiming at recognition of the wrong.
  *   **Requirement:** The account of standing must explain why a hypocrite's blame fails to *communicate* effectively. (e.g., The hypocrite's message is undermined because their conduct contradicts the demand).
  *   **Status:** **Non-negotiable.**

  **2. Consistency with Moral Psychology (Reactive Attitudes)**
  *   **Motivation:** Blame involves resentment, indignation, or guilt.
  *   **Requirement:** The theory must explain how "standing" regulates these emotions. If standing is lacking, is resentment inappropriate? Or just the expression of it?
  *   **Status:** **Camp-Specific.** (Some argue standing regulates the *emotion*; others argue it regulates only the *expression*. A theory must pick one and defend its fit with psychological data.)

  **3. The "Unitary Property" Risk**
  *   **Motivation:** As noted in the Preface, blame may not be a single thing.
  *   **Requirement:** If the theory treats standing as unitary, it must explain why it applies equally to private resentment, public shaming, and institutional punishment.
  *   **Status:** **High Risk.** (Failure here suggests the theory is modeling legal standing, not moral blame. This is the most likely point of theoretical collapse.)

  ---

  ### IV. Joint Unsatisfiability (The Trilemma)

  There is a subset of desiderata that appears jointly unsatisfiable. This is the **Hypocrisy-Victim-Trilemma**:

  1.  **Unconditional Victim Standing:** Victims always retain standing to blame their perpetrators (Desideratum I.1).
  2.  **Strict Hypocrisy Constraint:** Committing the same wrong one blames necessarily negates standing (Desideratum II.2 - Identical Fault).
  3.  **Empirical Prevalence:** Victims of systemic or recurring wrongs frequently participate in those same wrongs (e.g., abused persons who become abusers; oppressed groups who internalize and enact oppression).

  **The Conflict:** If (2) and (3) are true, then (1) must be false. Many victims *are* hypocritical by the strict standard.
  *   **Resolution A:** Deny (2). Hypocrisy does not cancel standing for victims. (Favors Relational Accounts).
  *   **Resolution B:** Deny (3). Argue that victimhood purifies or exempts one from the charge of hypocrisy. (Psychologically dubious).
  *   **Resolution C:** Deny (1). Accept that some victims lose standing. (Morally repugnant to most).

  **Conclusion:** A theory cannot simultaneously hold a strict hypocrisy-canceling rule and an unconditional victim-standing rule without ignoring empirical reality. One must be graded or conditional.

  ---

  ### V. The Single Eliminator

  **Requirement:** *The "Same-Norm Commitment" Condition.*
  **Statement:** "To have standing to blame for violation of Norm N, the blamer must demonstrate a sufficient commitment to Norm N, evidenced by their own conduct regarding N."

  **Why it eliminates the most accounts:**
  1.  **Eliminates Pure Legalistic/Status Accounts:** Accounts that say standing is based solely on social role (e.g., "parent," "judge") fail because a parent can lack commitment to the norm.
  2.  **Eliminates Pure Victim-Rights Accounts:** Accounts that say "only the victim matters" fail because a victim can utterly reject the norm they were violated by (e.g., a thief who doesn't believe in property rights blaming another thief).
  3.  **Eliminates Irrelevance Accounts:** Accounts that say hypocrisy is irrelevant to standing are directly contradicted.
  4.  **Strains Comparative-Record Accounts:** It forces them to define "sufficient commitment" without creating a moral scorecard that silences everyone.

  This requirement is the **bottleneck**. Any theory that does not ground standing in the blamer's relationship to the *norm being violated* (rather than just their relationship to the *victim* or their *general moral score*) fails to explain why *lateral* hypocrisy (Fault B vs. Fault A) is less damaging than *identical* hypocrisy.

  ---

  ### VI. Scoring the Main Families of View

  **1. Pure Relational / Victim-Waiver Accounts**
  *   *Core Idea:* Standing is derived from the relationship between blamer and blamed, or the victim's right to waive objections.
  *   *Score:*
      *   **Flawed Victim:** **Pass.** (Victim status overrides hypocrisy).
      *   **Third-Party Blame:** **Fail.** (Struggles to explain why unrelated third parties ever have standing).
      *   **Structural Complicity:** **Fail.** (Too individualistic; misses systemic benefit).
      *   **Distinctions:** **Pass** on Forfeiture/Waiver, **Fail** on Identical/Lateral fault (often collapses them).
  *   *Verdict:* Strong on protecting victims, weak on explaining the normative force of third-party criticism.

  **2. Comparative-Moral-Record Accounts**
  *   *Core Idea:* Standing is a function of the blamer's overall moral purity or specific record regarding the norm.
  *   *Score:*
      *   **Flawed Victim:** **Fail.** (Often silences victims who are not pure).
      *   **Third-Party Blame:** **Pass.** (Explains why a "good" third party can blame).
      *   **Diminution vs. Cancellation:** **Pass.** (Gradable based on severity of fault).
      *   **Unitary Property:** **Fail.** (Turns blame into a moral tournament).
  *   *Verdict:* Strong on hypocrisy intuitions, morally dangerous regarding victims and systemic sin.

  **3. Hypocrisy-Irrelevance / Independence Accounts**
  *   *Core Idea:* Standing is independent of the blamer's conduct; only the truth of the blame matters.
  *   *Score:*
      *   **Consistency:** **Pass.** (Fits a truth-centric view of morality).
      *   **Phenomenology:** **Fail.** (Cannot explain the "who are you?" intuition or the sting of hypocrisy).
      *   **Moral Address:** **Fail.** (Ignores the communicative function of blame).
  *   *Verdict:* Theoretically clean, phenomenologically bankrupt.

  ---

  ### VII. Final Premise Check

  You asked me to flag if the framing rests on a confused premise.

  **The Confusion:** The request assumes "standing to blame" is a **unitary property** that can be specified once and for all.
  **The Reality:** It is highly probable that "standing" is a **cluster concept** that shifts meaning depending on the context of blame.
  *   In **interpersonal resentment**, standing may be relational (do I have the right to feel this?).
  *   In **public moral address**, standing may be reputational (do I have the credibility to speak?).
  *   In **institutional punishment**, standing may be legalistic (do I have the authority to sanction?).

  **Implication:** A theory that satisfies the desiderata for *interpersonal resentment* (e.g., protecting the flawed victim) will likely fail the desiderata for *public moral address* (e.g., requiring consistency for credibility).

  **Recommendation:** Do not seek a single theory of "Standing." Seek a **modular account** that specifies standing conditions for distinct *modes* of blame. If you force a unitary theory, you will inevitably have to label one set of strong intuitions (either Victim Standing or Hypocrisy Sensitivity) as "mistaken," which reduces the theory's explanatory power. The "Trilemma" identified in Section IV is not a puzzle to be solved, but a signal that the concept is not unitary.
