answer: |-
  There is no single canonical term in philosophy or psychology that captures this specific pattern in its entirety. It sits at an intersection: action theory cares about the *structure* of choice, psychology cares about the *feeling* of control, and narrative theory cares about the *coherence* of the self.

  The nearest established concepts are **Jon Elster's analysis of randomization**, **Harry Frankfurt's theory of identification**, and **David Velleman's work on self-narrative**. None of these alone carve the phenomenon as precisely as you describe, but together they map the territory.

  Below, I set these neighbors against one another, carve the specific distinction you have identified, and propose a term to hold it.

  ### 1. The Nearest Neighbors (and why they fall short)

  **Jon Elster on Randomization**
  In *Solomonic Judgments* and *Ulysses Unbound*, Elster discusses when randomization is legitimate. He notes a strong social and internal norm against using lotteries for serious personal choices.
  *   *Fit:* He captures the "refusal of the coin." He notes that randomization is acceptable for *distribution* (fairness between people) but stigmatized for *choice* (decisions for oneself).
  *   *Miss:* Elster focuses on the *normative* legitimacy (is it rational?) rather than the *phenomenological* experience (why does it feel like surrender?). He does not fully explain why a "narratable tiebreaker" escapes this stigma despite being equally arbitrary.

  **Harry Frankfurt on Identification**
  Frankfurt argues that free will consists in identifying with the desires that move you.
  *   *Fit:* This explains the "exercise of will." When you use the narratable tiebreaker ("I chose the one my friend liked"), you identify with that reason. When you flip a coin, you cannot identify with the physics of the flip.
  *   *Miss:* Frankfurt is concerned with deep, structural cares (second-order volitions). Your case involves trivial arbitrariness ("I noticed it first"). Frankfurt's framework doesn't easily explain why a trivial, arbitrary biographical fact restores agency where a coin destroys it.

  **Existentialism (Sartre/Heidegger)**
  Sartre might call the coin flip *bad faith* (hiding one's freedom behind a mechanism).
  *   *Fit:* Captures the anxiety of the "surrender."
  *   *Miss:* Existentialism is too broad. It doesn't distinguish between *types* of arbitrariness. To Sartre, choosing based on a whim is just as authentic as choosing based on a story, provided you own it. Your observation is subtler: people *won't* own the coin, but they *will* own the story.

  ### 2. Carving the Concept: Endogenous vs. Exogenous Arbitrariness

  The precise difference between the coin and the story is not about *rationality* (both are irrational relative to option value) but about **traceability**.

  **The Coin (Exogenous Arbitrariness)**
  *   **Mechanism:** The agent initiates a causal chain that *excludes* their will from the final link.
  *   **Structure:** Agent $\to$ Flip $\to$ Physics $\to$ Outcome.
  *   **Experience:** The outcome happens *to* the agent. The will stops at the flip. The agent becomes a spectator to their own life.
  *   **Why stakes matter:** As stakes rise, the demand for *authorship* rises. Allowing physics to determine a high-stakes outcome feels like a dereliction of duty to the self.

  **The Narratable Tiebreaker (Endogenous Arbitrariness)**
  *   **Mechanism:** The agent selects a criterion that is arbitrary regarding *value* but internal regarding *agency*.
  *   **Structure:** Agent $\to$ Biographical Fact/Preference $\to$ Outcome.
  *   **Experience:** The outcome happens *through* the agent. The will flows through the tiebreaker.
  *   **Why it works:** "I noticed it first" is a fact about the *agent's history*, not the world's physics. It allows the agent to construct a sentence of the form "I chose X *because*..." where the *because* refers to their own mind or life, not an external randomizer.

  **The Core Distinction:**
  The coin creates a **Causal Explanation** ("The flip landed heads").
  The story creates a **Justificatory Reason** ("I chose this one because I saw it first").
  Even though the agent knows the reason is arbitrary, it occupies the *logical space of reasons*. The coin occupies the *logical space of causes*. Human agency requires that actions be explicable in the space of reasons to maintain **Agential Integrity**.

  ### 3. Proposed Term: The Authorship Condition

  Since no established term captures this specific boundary between "tolerable arbitrariness" and "alienating randomization," I propose **The Authorship Condition**.

  **Definition:**
  > **The Authorship Condition** is the psychological constraint requiring that the decisive factor in a choice be traceable to the agent's internal states, history, or identity, rather than to exogenous noise, even when the factor is acknowledged to be arbitrary regarding the value of the options.

  **Violation:** Flipping a coin violates the Authorship Condition because the decisive factor (physics) is exogenous.
  **Satisfaction:** Using a narratable tiebreaker satisfies the Authorship Condition because the decisive factor (effort, salience, loyalty) is endogenous.

  ### 4. Boundary Cases and Edges

  To test whether this carving holds, we must look at the edges you mentioned: stakes, strategy, and audience.

  **A. The Stakes Edge (Identity Investment)**
  *   *Low Stakes:* Choosing between two identical pens. The Authorship Condition is weak. A coin flip is tolerated because the outcome does not impact the self-narrative.
  *   *High Stakes:* Choosing between two job offers of equal pay/prestige. The Authorship Condition is strong. A coin flip feels like a betrayal of the self because the outcome defines the future biography.
  *   *Prediction:* The refusal of the coin scales linearly with how much the outcome is integrated into the agent's **Narrative Identity**.

  **B. The Strategy Edge (The Game Theory Exception)**
  *   *Scenario:* A penalty kick in soccer or a poker bluff.
  *   *Observation:* You noted the aversion disappears here.
  *   *Explanation:* In strategic games, **unpredictability is a reason**. Therefore, the coin flip is no longer "exogenous noise"; it is a tool deployed by the will to achieve a goal (opacity to the opponent). The Authorship Condition is satisfied because the randomization is *instrumental*, not *constitutive* of the choice. The agent says, "I chose to randomize," not "I let the coin choose."

  **C. The Audience Edge (Social Accountability)**
  *   *Private:* Alone, an agent might tolerate a coin flip more easily, though often still feel a vague unease (the "surrender" feeling).
  *   *Public:* If others are watching, the Authorship Condition tightens. Justifying a life decision with "the coin said so" is socially unintelligible. It marks the agent as unreliable or devoid of character. The narratable tiebreaker ("I chose the one my mentor advised") signals character even if the advice was arbitrary.
  *   *Prediction:* The presence of an audience amplifies the need for a narratable tiebreaker, not because of shame, but because agency is partly a social status.

  ### 5. Test Cases for the Definition

  To verify **The Authorship Condition**, consider these boundary cases:

  1.  **The Biased Coin:** You offer the agent a coin that is weighted 60/40, but they don't know which way.
      *   *Prediction:* Still rejected. It is still exogenous physics.
  2.  **The "Gut Feeling":** The agent says, "I just felt like A."
      *   *Prediction:* Accepted. This is the ultimate endogenous tiebreaker. It is arbitrary, but it is purely internal. It satisfies the Authorship Condition perfectly.
  3.  **The Delegated Coin:** The agent asks a trusted friend to flip the coin for them.
      *   *Prediction:* Rejected (unless the friend's *judgment* is invited). If the friend is just a mechanical flipper, it is still exogenous. If the friend says, "Take A, it suits you," it is accepted (narratable).
  4.  **The Pre-Commitment:** The agent decides on Sunday to flip a coin on Monday for a Monday decision.
      *   *Prediction:* More tolerated than flipping in the moment. Why? Because the *act of pre-commitment* is an exercise of will. The agent authors the *rule*, even if they don't author the *outcome*. This is a partial satisfaction of the Authorship Condition (Elster's Ulysses).

  ### Summary

  You have identified a gap between **Rational Choice Theory** (which sees the coin and the story as equivalent noise) and **Phenomenological Action Theory** (which sees them as fundamentally different modes of being).

  The pattern is the **Authorship Condition**.
  The coin is **Exogenous Arbitrariness** (alienating).
  The story is **Endogenous Arbitrariness** (integrating).

  People are not looking for the *best* reason; they are looking for *a* reason that is traceable to the self. They will expend effort to find a trivial endogenous reason rather than accept a powerful exogenous cause, because a life composed of coin flips is not a life that can be narrated, and a life that cannot be narrated cannot be owned.
