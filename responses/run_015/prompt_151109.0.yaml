  Every atom in the arm moves in response to forces exerted by atoms in the air and the table and the glass in a deterministic chain.

  The system functions to transport liquid from the table to the mouth because the biological machine requires hydration.
  The arm moves toward the object designed for holding water because the organism is built to seek fluids when dry.
