  Wants the water.

  Real not for adding extra stuff,
  True for any predictor pressed for time.

  ***

  ### Handout: Compression as Reality

  **To:** Philosophy of Mind Seminar
  **From:** TA
  **Re:** Dennett's Stances & Real Patterns

  **The Structure of the Poem**
  The poem enacts Daniel Dennett's hierarchy of stances through visual compression. Each section describes the same event (a flatmate reaching for a glass) but adopts a different predictive strategy. The line lengths correspond to the **bit-cost** of the description.

  1.  **The Physical Stance (Lines 1–5):**
      *   **Strategy:** Predict based on physical laws and microstates (ions, neurons, forces).
      *   **Form:** Over-long, clunky lines.
      *   **Philosophy:** This is the "bitmap." It is theoretically complete but computationally expensive. To predict the reach using only physics, you must track every variable. The lines are long because the data is uncompressed.

  2.  **The Design Stance (Lines 6–10):**
      *   **Strategy:** Predict based on function and design specifications, ignoring physical implementation details.
      *   **Form:** Medium-length lines.
      *   **Philosophy:** We treat the organism as a machine built for a purpose (hydration). We don't need to know the sodium channel states, only that the system is *designed* to seek water. This compresses the data significantly.

  3.  **The Intentional Stance (Lines 11–12):**
      *   **Strategy:** Predict based on beliefs, desires, and rationality.
      *   **Form:** The shortest lines in the poem.
      *   **Philosophy:** We treat the organism as an agent. "She wants water" is the highest compression. It ignores the mechanics and the engineering to focus on the *reason*.

  **The Turn (Lines 13–14)**
  The couplet addresses the **Real Patterns** criterion (Dennett, 1991). A common objection to the Intentional Stance is that it is "just a metaphor" or "less real" than physics because it leaves details out.

  *   *"Real not for adding extra stuff"*: Dennett is not a dualist. Beliefs and desires are not ghostly substances added to the brain.
  *   *"True for any predictor pressed for time"*: A pattern is real if describing it allows for better/cheaper prediction than the bitmap. The truth of "she wants water" lies in its predictive utility for any agent (like us) with limited computational resources. It is objective (the savings hold for anyone) but relative to the constraints of the predictor.

  **Takeaway**
  The poem gets shorter not because it becomes less true, but because it becomes more efficient. The Intentional Stance isn't a lazy placeholder for the physics; it is the tool that makes the world navigable.
