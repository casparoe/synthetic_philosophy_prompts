prompt: |-
  Analyse the collapse of FTX in late 2022 and Sam Bankman-Fried's preceding "earning to give" trajectory as a case study for the institutional critique of effective altruism, with particular attention to measurability bias and the separation of charitable impact from institutional governance. Rather than recounting the fraud allegations in detail, I want a disciplined mapping: treat Bankman-Fried, Alameda Research, the FTX Foundation, and the grant-making institutions that received funds as the relevant actors; specify the decision-rules that "earning to give" implies when applied inside a for-profit crypto exchange rather than in conventional finance; and examine whether the effective-altruist emphasis on quantifiable donation totals—easy to measure and compare—systematically diverted attention from fiduciary structures, risk controls, and conflicts of interest that are harder to metricise but essential to the sustainability of the giving. Identify precisely which features of the episode the institutional critique explains well, which features it misdescribes or fails to anticipate (for example, whether the harm arose from optimisation pressure or from deliberate deception masked by philanthropic rhetoric), and whether the case exposes a conceptual gap, such as the critique's relative silence on the moral psychology of agents who deploy charitable framing as institutional camouflage.

  Please write your answer in British English. Do not provide bibliographies, reading lists, or citations; the analysis should stand on conceptual reasoning and commonly known facts about the case. Be explicit about where the theory-to-case mapping is tight, where it requires stretching, and what the episode in turn reveals about the limits of applying measurability-focused impact assessment to high-risk, lightly regulated financial institutions.
