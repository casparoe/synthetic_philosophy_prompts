  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Request:**

      *   **Topic:** The collapse of FTX (late 2022) and Sam Bankman-Fried's (SBF) "earning to give" trajectory as a case study for the *institutional critique of Effective Altruism (EA)*.
