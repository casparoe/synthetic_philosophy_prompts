      *   *Measurability Bias:* This is the core. EA prioritises *counterfactual impact* and *scale*. $1bn pledged is a powerful metric. Auditing balance sheets is boring and hard to metricise. The community focused on the *flow* of funds, not the *stock* or the *integrity* of the source. This is the "output bias."
      *   *Governance Separation:* The FTX Foundation was supposed to be independent. It wasn't. Alameda had a "backdoor" (the special key). The institutional critique highlights that you cannot separate the *good* (grants) from the *bad* (commingled funds) if the governance is shared. The "firewall" was theoretical, not practical.
