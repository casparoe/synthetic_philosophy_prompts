      *   *Measurability Bias:* EA loves metrics (QALYs, dollars donated). FTX offered huge, visible numbers. Did this blind the community to the *source* of the funds? The "output" (donations) was measured; the "process" (risk management, commingling of funds) was ignored.
      *   *Governance vs. Impact:* The separation of the Foundation from the Exchange was porous. Alameda/FTX entanglement. The critique argues that institutional integrity matters as much as the grant size.
      *   *Institutional Critique Evaluation:*
