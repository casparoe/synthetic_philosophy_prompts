          *   *Loose Mapping/Stretched:* Was it really EA philosophy that caused this, or just a sociopath using EA as a branding tool? The critique might over-intellectualise what was simple fraud.
          *   *The Gap:* Moral psychology. The "Saintly Fraudster." EA lacks tools to detect bad actors who game the metrics.
      *   *Conclusion:* Summary of lessons. The need for process metrics, not just outcome metrics.

  3.  **Drafting - Section by Section (incorporating British English):**

      *   *Intro:* Start with the FTX collapse as a stress test for EA. Mention the specific lens: institutional critique.
      *   *Actors & Decision-Rules:* Define the ecosystem. SBF (agent), Alameda/FTX (engine), Foundation (distributor), Recipients (beneficiaries).
          *   *Standard E2G:* Earn safely, donate margin.
