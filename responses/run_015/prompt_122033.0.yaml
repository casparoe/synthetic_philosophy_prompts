answer: |-
  The collapse of FTX in late 2022 serves as a profound stress test for the institutional architecture of Effective Altruism (EA). While the legal proceedings have focused on criminal fraud, a philosophical and structural analysis reveals how the specific application of 'earning to give' within a high-leverage, lightly regulated financial environment exposed critical vulnerabilities in EA's institutional critique. By mapping the actors—Sam Bankman-Fried (the agent), Alameda Research and FTX Exchange (the capital engines), the FTX Foundation (the distribution mechanism), and the grant recipients (the beneficiaries)—one can discern how an over-reliance on quantifiable impact metrics obscured fundamental failures in governance and fiduciary duty.

  **Decision-Rules of 'Earning to Give' in Crypto-Finance**

  In conventional 'earning to give' models, typically situated in established sectors like quantitative finance or technology, the decision-rule is conservative: maximise personal income within a stable institution and donate a significant margin (often 50 per cent or more) to high-impact causes. The risk profile of the income source is assumed to be managed by the employing institution's compliance structures.

  Bankman-Fried inverted this rule. His iteration of 'earning to give' posited that one should not merely earn a salary but acquire equity in a high-growth vehicle, with the intention of donating the entirety of the accumulated wealth. When applied to a crypto exchange, this decision-rule necessitated aggressive expansion and risk-taking to maximise the terminal value of the equity. The implicit calculus was that the potential magnitude of the donation justified the volatility of the source. Consequently, the fiduciary duty to customers (to safeguard deposits) came into direct conflict with the altruistic duty to donors (to maximise future grant-making potential). In this framework, risk controls were not merely operational safeguards but obstacles to the maximisation of altruistic output. The institutional critique of EA suggests that when the 'giving' becomes the primary moral justification for the 'earning', the earning vehicle is morally licensed to bypass standard prudential norms.

  **Measurability Bias and the Neglect of Governance**

  The central tension exposed by FTX is the disparity between the measurability of charitable output and the invisibility of institutional integrity. EA culture places a premium on quantifiable metrics: dollars pledged, lives saved, or carbon tonnes abated. The FTX Foundation's grant-making was highly visible and easily aggregated. By contrast, the solvency of FTX, the segregation of customer funds, and the independence of Alameda Research were technical, opaque, and difficult to metricise.

  This created a systematic measurability bias. For the EA community, the *flow* of funds (donations) was a positive, visible signal of impact. The *stock* of funds (reserves) and the *process* of fund generation (risk management) were negative signals—absence of disaster is hard to measure. The institutional critique argues that EA's focus on counterfactual impact led stakeholders to prioritise the size of the cheque over the sustainability of the signer. Due diligence was skewed towards the efficacy of the recipient charities rather than the solvency of the donor.

  Furthermore, the separation of charitable impact from institutional governance was illusory. The FTX Foundation was structurally dependent on the Exchange's profitability. When the institutional critique warns against 'tainted money', it usually refers to the moral reputation of the donor. In the FTX case, the taint was existential: the money did not legally belong to the donor to give. The governance failure was the commingling of assets, yet this was overlooked because the *outcome* (large grants) aligned with EA goals. The metrics rewarded the appearance of generosity while blinding the community to the erosion of the capital base required to sustain it.

  **Evaluating the Institutional Critique: Explanatory Power and Limits**

  The institutional critique of EA maps tightly onto specific features of the FTX episode, particularly regarding the distortion of incentives. It correctly anticipates that a singular focus on 'impact per dollar' can encourage high-risk strategies. If the moral worth of an action is determined solely by its consequences, then intermediate deontological constraints (such as strict regulatory compliance or conservative leverage ratios) may be viewed as friction to be minimised. The critique successfully explains why warning signs regarding FTX's corporate structure were discounted by some within the community; the potential scale of the good (billions in funding for pandemic preparedness or AI safety) created a blind spot towards the probability of the bad (total collapse).

  However, the mapping requires stretching when addressing the element of deliberate deception. The institutional critique generally assumes agents are acting in good faith but are subject to cognitive biases or structural pressures. It posits that well-meaning individuals might cut corners to do more good. The FTX collapse, however, suggests a scenario where the altruistic framing may have been instrumentalised as camouflage from the outset. If the primary motive was not 'earning to give' but rather building a personal empire with philanthropy as a public relations shield, the institutional critique of EA is less explanatory. It struggles to account for the 'Saintly Fraudster'—an agent who uses the vocabulary of altruism not to optimise good, but to lower the cost of capital and regulatory scrutiny.

  This reveals a conceptual gap in the critique: its relative silence on the moral psychology of agents who deploy charitable framing. EA possesses robust frameworks for assessing the *truth* of impact claims but lacks robust mechanisms for assessing the *virtue* or *honesty* of the claimant. The community's reliance on public pledges and visible donations created a signalling environment where performative generosity could substitute for actual integrity. The critique identifies the structural incentive to prioritise metrics, but it fails to anticipate how those metrics can be actively gamed by bad actors who understand the community's values well enough to mimic them.

  **The Limits of Measurability in High-Risk Finance**

  The episode underscores the danger of applying measurability-focused impact assessment to lightly regulated financial institutions. In traditional finance, audits and regulatory oversight serve as external validators of the 'safety' metric. In the crypto-ecosystem of 2020–2022, these were absent. EA's internal norms attempted to fill this void but relied on the wrong variables. They measured the *destination* of the funds rather than the *provenance*.

  The limit revealed here is that 'effectiveness' cannot be assessed in a vacuum of time. A donation is not effective if it is subsequently clawed back or if the institution responsible for it implodes, causing net harm to the ecosystem's reputation. The institutional critique must therefore expand to include 'process metrics'—measures of governance, risk segregation, and fiduciary adherence—as prerequisites for impact, rather than secondary concerns. Without these, the measurability bias incentivises a form of moral discounting, where future risks are heavily discounted against present, visible grants.

  **Conclusion**

  The FTX collapse validates the institutional critique of Effective Altruism insofar as it demonstrates how a focus on quantifiable outcomes can marginalise essential qualitative safeguards. The decision-rules of 'earning to give', when applied to a high-leverage vehicle without robust governance, created a moral hazard where risk-taking was reframed as altruistic ambition. However, the case also exposes the limits of the critique. It explains how good intentions can be structurally distorted, but it is less equipped to handle scenarios where altruistic rhetoric is weaponised for deception.

  Ultimately, the episode reveals that in high-risk financial environments, the measurability of donation totals is a lagging indicator of success, while the integrity of governance is a leading indicator of survival. An institutional framework that prioritises the former over the latter invites collapse. For Effective Altruism to integrate this lesson, it must treat institutional resilience and fiduciary rigour not as administrative details, but as core components of altruistic impact, recognising that a gift built on compromised foundations is, in the long run, no gift at all.
