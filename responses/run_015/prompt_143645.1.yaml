  **Catharsis™ Support Center – Troubleshooting Emotional Irregularities**

  **1. Why am I crying if I know the character isn't real?**
  This is a known calibration error known as "Objectless Affect." Our diagnostics suggest you are experiencing a physiological response without a corresponding ontological object. Please recall that your tear ducts are operating in Simulation Mode. The grief you feel is a proxy signal, not a report on actual states of affairs. To resolve, remind yourself that the data stream is fictional. If tears persist, you may be mistakenly treating imaginary entities as genuine constituents of reality. Please recalibrate your cognitive stance to "Make-Believe" and clear your cache of existential assumptions.

  **2. I feel fear during horror sequences despite knowing I am safe.**
  This indicates a disconnect between your propositional attitudes and your autonomic nervous system. You are processing the thought of danger without the belief in danger. This is a standard Quasi-Emotion glitch. The app is designed to generate adrenaline proxies for entertainment purposes only. These are not genuine fear responses because genuine fear requires a belief in immediate threat. Please note that feeling safe while shaking is a feature, not a bug. If you continue to perceive the threat as actual, disable Immersion Settings immediately.

  **3. How do I process grief for characters who die in some endings but live in others?**
  Interactive narrative grief requires strict ontological accounting. Users must file separate emotional claims for each timeline experienced. Grief incurred in Timeline A does not transfer to Timeline B, as the character in Timeline B is a distinct numerical entity despite qualitative similarity. You cannot mourn a version of the character that survives. Please ensure you are not conflating counterpart relations with identity. If you find yourself grieving across multiple branching paths, you may be over-committing to possible worlds. Restrict emotional investment to the actualized timeline currently rendering on your screen.

  **4. My heart races when the protagonist is in danger, but I don't want to move.**
  This is consistent with our Prop-Based Theory of engagement. You are reacting to the properties of the representation, not the event itself. Your motor functions are correctly inhibited because there is no action to be taken. The arousal is a side effect of processing vivid imagery. Please do not attempt to intervene. Intervention is impossible and violates the Terms of Service regarding Fourth Wall Integrity.

  **5. I still feel sad after closing the app.**
  Residual affect is common when users fail to disengage their pretense mechanisms. Please run the "It Was Just a Story" diagnostic script. Repeat aloud: "No person has suffered." If sadness persists beyond 24 hours, you may be suffering from Conceptual Confusion regarding the nature of art. Please submit a ticket labeled "Reality Testing Failure." Do not attempt to contact the character. They do not exist.

  **6. Can I claim compensation for emotional distress?**
  Claims are denied for all distress arising from non-existent events. By using Catharsis™, you agreed that all emotions generated are quasi-emotional and carry no factual weight. You cannot be harmed by what is not real. If you feel harmed, you are mislabeling your internal state. Please update your user manual to reflect current analytic consensus on fictionality.
