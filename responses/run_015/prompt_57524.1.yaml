  Your analogy of the heap assumes that the heap exists independently of the observer, whereas the Cold War exists primarily as a classification devised by observers who needed to make sense of a deteriorating relationship. In the archives, I see telegrams and minutes where men worried about specific borders, loans, and elections, not about inaugurating a geopolitical epoch. To say someone started the Cold War is to claim they intended to create the very structure we now use to describe their actions, which is an anachronism of the highest order. The sentence is false because it treats a retrospective label as a contemporaneous event, confusing the map for the territory. I am not declining to answer; I am correcting the grammar of your question, for you ask for a cause where there is only a condition that hardened over time.

