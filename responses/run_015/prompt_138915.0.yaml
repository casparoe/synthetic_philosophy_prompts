answer: |-
  You cannot maintain a diagnostic classification that functions as both a stable scientific map and a public tool for resource allocation without accepting that the act of mapping alters the territory you intend to measure.

  **Desiderata for a Loop-Aware Classification**

  1.  **Functional Utility vs. Ontological Truth:** The specification must explicitly distinguish whether a category is a tool for a decision (gating care) or a claim about tracking something real (a natural kind).
      *   *Motivation:* Prevents category errors where bureaucratic conveniences are treated as biological essences, fueling stigma or false hope.
      *   *Verdict:* **Non-negotiable** for all three jobs to maintain epistemic trust.
  2.  **Inter-Rater Reliability vs. Loop-Stability:** The system must measure stability not just across clinicians at one moment, but across time despite patient awareness of the criteria.
      *   *Motivation:* High reliability among doctors means nothing if patients learn the script and perform the symptoms, changing the phenomenon itself.
      *   *Verdict:* **Non-negotiable** for research cohorts; merely a **Preference** for care gating where speed trumps stability.
  3.  **Point-in-Time Accuracy vs. Decadal Stability:** The system must prioritize adaptive validity over static validity, acknowledging that a category accurate today may drift as it circulates.
      *   *Motivation:* A diagnosis that predicts outcomes now may fail in ten years because the treatment pathway or patient self-concept has shifted.
      *   *Verdict:* **Non-negotiable** for research; **Preference** for care gating.
  4.  **Validation Independence:** Predictive validity must be demonstrated against outcomes that are not causally produced by the assignment of the label itself.
      *   *Motivation:* Avoids self-fulfilling prophecies where a diagnosis predicts treatment response only because the diagnosis grants access to that treatment.
      *   *Verdict:* **Non-negotiable** for research and treatment matching.

  **Validation Evidence Rules**
  A loop-aware classification must discount validity coefficients where the outcome is access to resources gated by the diagnosis itself, as this measures administrative power rather than pathology. Discount longitudinal stability data collected after public release of criteria, as this measures cultural adoption rather than phenotypic persistence. Reduce the weight of predictive validity findings by approximately 50% if the intervention was standardized based on the same classification being validated, since the label created the treatment pathway. Self-report concordance with criteria should be treated as evidence of literacy and motivation, not diagnostic accuracy.

  **Incompatibilities and Trade-offs**
  1.  **Transparency vs. Loop-Stability:** Publishing plain-text criteria maximizes accessibility for patients and clinicians but minimizes loop-stability by providing the explicit script for self-presentation and gaming.
  2.  **Reliability vs. Loop-Resistance:** Tightening operationalized criteria increases inter-rater reliability but makes the boundary sharper and easier for patients to learn, accelerating drift and reducing the category's ability to pick out the same phenomenon over time.
  3.  **Mechanism vs. Utility:** Requiring neurobiological markers ensures loop-stability and tracks something real but violates the fifteen-minute decision rule given current technology and cost, rendering it useless for gating care next Tuesday.

  **Incoherent Desideratum**
  **Static Validity.** The demand that a category retain the same predictive power across a decade without revision is self-defeating in a system where the category is public and interactive; strike this and replace with "Adaptive Validity," requiring scheduled re-calibration.

  **Killer Requirement**
  **Loop-Stability.** If the committee insists that categories must not change their phenomenological extension due to public knowledge, you eliminate operationalized categorical systems, hierarchical taxonomies, and problem lists, leaving only mechanism-based frameworks that are currently unusable for care gating.

  **Architecture Scorecard**

  *   **Operationalized Categorical (DSM/ICD):** Maximizes decisional utility and reliability but fails loop-stability by providing explicit scripts for patient self-construction. Best for immediate care gating, worst for long-term research integrity.
  *   **Dimensional Mechanism-First (RDoC):** Offers high loop-stability and ontological candor but fails decisional utility due to cost and complexity. Viable for research cohorts, unusable for next Tuesday's clinic.
  *   **Hierarchical Dimensional Taxonomy:** Improves statistical reliability and captures symptom covariation but ignores looping by treating symptoms as static variables rather than communicative acts. Good for psychometrics, blind to social feedback.
  *   **Formulation/Problem-List:** Eliminates looping risks by refusing discrete kinds but fails all three system jobs by lacking standard codes for funding or cohort definition. Ethically superior for care, administratively impossible for the system.
