answer: |-
  **Specification of Requirements for Evidential Cooperation in Large Worlds**

  **Purpose and Scope**
  This document specifies the requirements for a decision theory intended for implementation in a bounded agent. The agent operates in a large world where it cannot enumerate states of nature or counterpart agents. It chooses exactly once. Its decision is correlated with many other agents—natural or artificial—via shared design, common causes, or statistical regularity. The theory must determine when and how strongly the agent treats its own act as evidence regarding the acts of others, and prescribe action accordingly. Adequacy is fixed by this practical implementation purpose, not by abstract philosophical consensus.

  **1. Desiderata**

  1.  **Gradient Sensitivity**
      *   **Requirement:** The theory must modulate the strength of evidential updating based on the degree of similarity between the agent and counterparts, regressing toward population base rates as similarity decreases.
      *   **Motivating Case:** Consider an exact twin versus a near-twin who shares 99% of your source code but differs on a single random seed. A theory that treats the near-twin as an exact twin ignores the divergence point; a theory that treats them as independent ignores the shared structure. If the theory sets correlation to one for any similarity above a threshold, it becomes brittle to minor perturbations.
      *   **Verdict:** Non-negotiable. A bounded agent exists on a continuum of similarity with the world. Ignoring degrees of similarity leads to systematic overconfidence in prediction.

  2.  **Aggregation Stability**
      *   **Requirement:** The theory must prevent the summation of many weak correlations from manufacturing artificial certainty or infinite expected value.
      *   **Motivating Case:** Imagine a population of one million agents, each correlated with you at only 0.001. Individually, none justify cooperation. Aggregated, a naive linear sum suggests massive leverage. If the theory allows the sheer count of weakly correlated agents to dominate the decision, the agent becomes vulnerable to "Pascal's Mugging" style artifacts where population size drives policy rather than structural linkage.
      *   **Verdict:** Non-negotiable. In a large world, population counts are uncertain and potentially infinite. Stability against aggregation artifacts is required for bounded computation.

  3.  **Evidential-Causal Distinction**
      *   **Requirement:** The theory must strictly distinguish between an act providing evidence about other acts and an act causing other acts.
      *   **Motivating Case:** Suppose your choice of a red button is statistically correlated with a million distant agents choosing red, due to a common psychological predisposition, but your button press physically cannot reach them. A theory that counts this evidence as influence will cooperate to "make" them cooperate, effectively double-counting the utility. It treats the ledger of evidence as the ledger of causal impact.
      *   **Verdict:** Non-negotiable. For a bounded agent choosing once, confusing evidence with influence leads to suboptimal resource allocation. The agent must maximize actual outcomes, not news value.

  4.  **Adversarial Robustness**
      *   **Requirement:** The theory must prescribe rational action when correlations exist with agents holding opposed values, including adversaries who simulate the agent to exploit its policy.
      *   **Motivating Case:** An adversary simulates your decision procedure to do the opposite of whatever you do. If you reason evidentially ("If I cooperate, he defects"), you might defect. But if you defect, he cooperates. A theory that assumes correlation implies shared利益 (interest) will fail here. It must handle negative correlation without collapsing into loops.
      *   **Verdict:** Non-negotiable. Large worlds contain competitors as well as cooperators. A theory that only works for allies is useless for general implementation.

  5.  **Metric Specification**
      *   **Requirement:** The theory must specify how agent similarity is measured rather than demanding verdicts be invariant across all similarity metrics.
      *   **Motivating Case:** Similarity is not intrinsic; it depends on the metric (e.g., source code distance vs. behavioral output). A demand for invariance is a demand for magic; a bounded agent must compute similarity using specific features. If the theory refuses to specify which features matter, it cannot be implemented.
      *   **Verdict:** Non-negotiable for Implementation; Demand for Invariance is Sectarian. Insisting on metric invariance is a taste for abstract purity incompatible with bounded computation. The theory must mandate a computable metric.

  6.  **Reflective Stability**
      *   **Requirement:** The theory must yield a stable policy when the agent knows it is running the theory, avoiding infinite regress or oscillation.
      *   **Motivating Case:** An agent simulates itself to decide what to do. If the theory says "Do the opposite of your simulation," and the simulation runs the same theory, no fixed point exists. The agent loops forever or crashes.
      *   **Verdict:** Non-negotiable. A bounded agent must halt. A theory that generates logical paradoxes upon self-reference cannot be executed.

  7.  **Prior Robustness**
      *   **Requirement:** Cooperation levels must not be driven primarily by heavy-tailed priors over the number of copies.
      *   **Motivating Case:** If you are uncertain about how many copies of you exist, a heavy-tailed prior suggests there are likely infinitely many. A theory that integrates over this uncertainty might mandate cooperation solely because the uncertainty is large, regardless of the actual world structure.
      *   **Verdict:** Non-negotiable. Decision-making should depend on structural facts about the world, not the shape of the agent's ignorance.

  **2. Incompatibilities**

  The desiderata above cannot be jointly satisfied without tension. The most critical incompatibility lies between **Gradient Sensitivity** and **Aggregation Stability** in the context of a truly large world.

  If the world contains an unbounded number of agents, and every agent shares even a non-zero degree of similarity with the decision-maker, Gradient Sensitivity dictates that each agent provides some evidential weight. However, if the population is infinite, the sum of these infinitesimal weights may diverge. To satisfy Aggregation Stability, the theory must dampen or cap the influence of distant agents. But dampening violates the strict logic of Gradient Sensitivity, which demands that every bit of correlation counts. A theory that respects all evidence risks divergence; a theory that caps evidence risks ignoring valid structural links. For a bounded agent, this implies a trade-off: the theory must impose a computational horizon or a discount factor that effectively declares some correlations zero, even if they are theoretically non-zero. This is not a bug but a necessity of boundedness, yet it formally violates the ideal of total evidential sensitivity.

  A secondary tension exists between **Reflective Stability** and **Adversarial Robustness**. If an adversary knows the agent's theory and aims to destabilize it, they can target the fixed-point calculation. For example, if the agent seeks a stable policy where its prediction matches its action, an adversary can force a mismatch. Ensuring stability may require the agent to randomize or obscure its reasoning, which complicates the evidential calculations required for cooperation. A theory that guarantees stability in isolation may fail when embedded in a hostile environment that actively probes for logical inconsistencies.

  **3. The Exclusionary Requirement**

  The single requirement that eliminates the largest share of otherwise attractive candidate theories is **Adversarial Robustness**.

  Many theories of evidential cooperation function well in cooperative environments but collapse when correlation implies opposition. Pure evidential approaches often treat correlation as a resource to be exploited: "My act is evidence of good outcomes, so I will act to make that evidence true." This works when others share your goals. However, in the opposed-values case, making the evidence true might make the outcome worse. If an adversary correlates their defection with your cooperation, evidential reasoning might suggest you cooperate to "confirm" the correlation, or defect to "break" it, depending on the formulation.

  This requirement bites harder than Reflective Stability or Metric Specification because it strikes at the core logic of evidential reasoning itself. Standard evidential models condition on acts without modeling the *mechanism* of the correlation. They see "Correlation = A" and update. They do not see "Correlation = A because Enemy simulates Me." To satisfy Adversarial Robustness, the theory must model the structural relationship between agents, not just the statistical regularity. This eliminates any theory that relies solely on conditional probabilities of outcomes given acts. It demands a functional or structural model of decision-making that can distinguish between a common cause, a shared design, and an adversarial simulation. This computational burden is significantly higher than merely calculating conditional probabilities, ruling out simpler, computationally cheaper models that might otherwise satisfy the stability and gradient requirements.

  **4. Scorecard of View Families**

  | View Family | Gradient Sensitivity | Aggregation Stability | Evidential-Causal Distinction | Adversarial Robustness | Reflective Stability |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Causal-Only** | Fails (Ignores correlation) | Passes | Passes | Passes | Passes |
  | **Pure Evidential** | Passes | Fails (Divergence risk) | Fails (Confuses evidence/influence) | Fails (Exploitable) | Mixed |
  | **Structural/Functional** | Passes | Passes (With caps) | Passes | Passes (If modeled) | Passes (With limits) |

  *Note: "Passes" indicates theoretical alignment; implementation depends on specific bounded approximations.*
