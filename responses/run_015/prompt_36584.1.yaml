  7.  **Final Polish:** Ensure the distinction between "Replicator" (entity that copies) and "Unit of Selection" (entity whose copying is *differential* based on its properties) is clear. The friend conflated them. The user's downward argument exposes this conflation.

      *   *Step to name:* Premise (1).
