answer: |-
  The precise step that gives is **Premise (1)**.

  Your friend has conflated the definition of a **Replicator** with the definition of a **Unit of Selection**. This is a classic category error in the philosophy of biology, and your downward run exposes it perfectly.

  Premise (1) states: *"A unit of selection must be a replicator... whose copies are what selection sorts among."*
  This looks innocuous going **up** because organisms fail the "replicator" test so catastrophically (in sexual species) that we never have to check the second half of the sentence ("selection sorts among").
  But going **down**, nucleotides pass the "replicator" test so effortlessly that we are forced to check the second half ("selection sorts among"), and they fail *there*.

  Here is the breakdown of the flaw, the evaluation of your three exits, and the mapping to the literature.

  ### The Precise Flaw: The Lewontin Gap

  In 1970, Richard Lewontin formalized the necessary and sufficient conditions for evolution by natural selection. There are **three**, not one:
  1.  **Variation:** Entities differ in their traits.
  2.  **Heritability:** Entities resemble their parents (copying/fidelity).
  3.  **Differential Fitness:** The variation causes differences in survival/reproduction.

  Your friend's Premise (1) isolates **Heritability** and treats it as the sole criterion for being a "unit of selection."
  *   **Upward:** Organisms (in sexual populations) fail Heritability. Argument stops. Friend wins.
  *   **Downward:** Nucleotides pass Heritability (perfectly!). Argument continues to Differential Fitness. Nucleotides (at fixed loci) fail Variation/Fitness. Friend loses.

  The friend's accusation that you introduced a "second criterion" is technically true, but it is an admission of defeat. The second criterion (Variation/Fitness) was *always* required; it was just invisible in the upward run because organisms failed the first criterion so obviously.

  ### Evaluating Your Three Exits

  #### Option One: The Repair (Equivocation on Copying vs. Differential Copying)
  **Verdict:** **This is the correct biological solution.** It maps to the **Lewontin/Sober/Hull** consensus.

  *   **The Fix:** You amend Premise (1) to require *all three* Lewontin conditions. A unit of selection is an entity that exhibits variation, heritability, *and* differential fitness based on that variation.
  *   **Why it saves Genes:** Genes are the "Goldilocks" unit. They are long enough to code for functional traits (unlike nucleotides, which lack **functional independence**) and stable enough to persist across generations (unlike organisms, which lack **high-fidelity heritability** in sexual populations).
  *   **The Cost (The Aphid Problem):** You must admit that in asexual/parthenogenetic lineages (like your aphid example), the **organism** becomes a valid unit of selection. In a clonal line, the organism satisfies Variation, Heritability, and Differential Fitness.
  *   **Literature Mapping:**
      *   **Lewontin (1970):** Provides the three criteria.
      *   **Sober (1984), *The Nature of Selection*:** Distinguishes **Selection *of*** (the organism dies) vs. **Selection *for*** (the gene persists). The organism is the *object* of selection, but the gene is the *unit* of evolution *unless* the organism replicates clonally.
      *   **Hull (1980):** Distinguishes **Replicators** (genes) from **Interactors** (organisms). Selection interacts with the organism, but the replicator is what evolves. Your friend treats Interactors as if they must be Replicators to matter.
  *   **Price:** You lose the "Once and for all" dogmatism. You must concede that the "privileged level" shifts depending on the reproductive mode of the population. But you keep Genes as the *paradigm* replicator for sexual species.

  #### Option Two: Bite the Nucleotide Bullet
  **Verdict:** **Reductive Absurdity.** It maps to a hyper-literal **Gene's Eye View** that collapses under utility.

  *   **The Fix:** Accept that if fidelity is the metric, the nucleotide is the true unit.
  *   **The Consequence:** As you noted, this makes "Gene Selection" mere bookkeeping. But it goes further: a nucleotide has no fitness effect in isolation. A 'C' is only beneficial if it is part of a codon, in a gene, in a regulatory network, in a cell. A nucleotide cannot be "selected" except in the context of the gene.
  *   **Literature Mapping:** This is a *reductio ad absurdum* of strict **Dawkinsian Reductionism**. Dawkins himself avoids this by defining the replicator as a chunk of chromosome "long enough to code for a trait but short enough to be copied faithfully." He arbitrarily sets the lower bound to avoid your exact objection.
  *   **Price:** You destroy the explanatory power of the theory. If everything is bookkeeping all the way down, the concept of "Unit of Selection" loses its ability to predict evolutionary dynamics. It satisfies the logic but kills the biology.

  #### Option Three: Reject the Privileged Level (Pluralism)
  **Verdict:** **The Modern Consensus.** It maps to **Multilevel Selection (MLS)** and **Hierarchical Theory**.

  *   **The Fix:** Acknowledge that "Unit of Selection" is a question-dependent label. Sometimes it's the gene, sometimes the cell, sometimes the organism, sometimes the group.
  *   **The Consequence:** Your friend's claim that higher-level talk is "mere bookkeeping" is false. Group selection is real *if* groups vary, heredity exists between groups (fission), and groups differ in fitness.
  *   **Literature Mapping:**
      *   **Gould (1980s):** Argued for **Hierarchical Selection**. Species can be units of selection (Species Selection) if they have emergent traits (e.g., geographic range) that affect speciation/extinction rates, independent of gene frequencies.
      *   **Sober & Wilson (1998), *Unto Others*:** Revitalized **Group Selection**. They argue that altruism can evolve if between-group selection outweighs within-group selection.
      *   **Okasha (2006), *Evolution and the Levels of Selection*:** Provides the mathematical framework showing that levels are mathematically equivalent (Price Equation) but causally distinct.
  *   **Price:** You must tell your friend he is wrong about the "Once and for all" settlement. There is no single answer. However, this preserves the reality of organism and group selection without denying gene selection.

  ### Recommendation: How to Keep (2) Without Swallowing (7)

  You want to keep **Genes as the paradigm replicators**. To do this without accepting the Nucleotide conclusion, you must introduce the concept of **Functional Independence** (often associated with **Wimsatt** or **Dawkins' "Longevity/Fecundity/Copying-Fidelity"** trade-off).

  Here is the argument you should present to your friend:

  1.  **Replication is not enough.** A photocopy machine replicates paper, but the paper isn't the unit of selection in an office. The *text* is.
  2.  **The Unit must be the smallest entity that determines a fitness difference.** A single nucleotide (at a fixed locus) determines no fitness difference; it is inert. It only matters as part of a codon. A codon only matters as part of a protein. The **Gene** is generally the smallest unit that maps to a functional trait (phenotype) that selection can "see."
  3.  **Therefore:** Nucleotides are *parts* of replicators, not replicators themselves, because they lack **causal efficacy** in isolation.
  4.  **Concession:** You must admit that in asexual organisms, the Organism *is* a replicator. This isn't a bug; it's a feature. It explains why asexual lineages often accumulate deleterious mutations differently (Muller's Ratchet) than sexual ones.

  **The Coffee-Table Summary:**
  Tell your friend: *"You used Heritability to kill the Organism, but you used Variation to kill the Nucleotide. You can't move the goalposts. If we use Lewontin's full criteria, Genes win in sexual populations because they balance Fidelity with Functional Independence. But if we do that, we have to admit that Clonal Organisms are units of selection, and Groups can be too, if they meet the criteria. The 'Gene's Eye View' isn't a law of physics; it's a heuristic for sexual populations."*

  This maps to **Option One**, refined by **Hull's Replicator/Interactor** distinction. It saves the gene's status as the *primary* replicator in the context you both care about (human/animal evolution) without committing the logical error that allows nucleotides to usurp it.
