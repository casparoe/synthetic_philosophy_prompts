          *   Sober's Selection *of* vs. Selection *for*.
          *   The concept of "Functional Independence" (why a nucleotide isn't a unit).
          *   The "Grain" problem.

      *   *Addressing the User's Preference:* They want to keep (2) (Genes as paradigm). I need to show how Option 1 or 3 allows this without accepting the logical inconsistency. Option 1 is best for this: Genes are the *smallest unit that satisfies all three criteria simultaneously in most contexts*.

      *   *Refining the "Precise Step":* It's Premise (1). It conflates "Replicator" with "Unit of Selection." A replicator is a *candidate*. To be a *unit of selection*, it must exhibit variation that causes differential replication.
      *   *Upward:* Organisms fail Heritability (mostly).
      *   *Downward:* Nucleotides fail Variation (at fixed loci) AND Functional Independence (they don't determine fitness alone).
      *   *The Friend's Error:* Moving the goalposts. But the User's error is assuming "Copying" is the *only* metric.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, do nucleotides fail variation?* At a fixed locus, no. But across the genome, yes. However, selection acts on the *gene* because the nucleotide's effect is contingent on the gene context. A 'T' is only beneficial if it's part of a working codon in a working gene. This is the "Functional Independence" argument.
      *   *Is the friend right about organisms?* In sexual populations, organisms are not replicators. They are "Interactors" (Hull) or "Vehicles" (Dawkins). Selection sorts organisms, but evolution (cumulative change) happens in the replicator. This is a crucial distinction.
      *   *Does Option 1 admit parthenogenetic aphids?* Yes. And it should. They *are* units of selection at the organism level. This is a feature, not a bug.
      *   *Literature Mapping:*
          *   Option 1 -> Lewontin (1970), Sober (1984).
