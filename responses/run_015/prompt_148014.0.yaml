prompt: |-
  Hi — I'm the (reluctant) chair of the animal care committee at a mid-sized medical school. We review somewhere around 180 protocols a year: mostly mice and rats, a couple of rabbit projects, one pig lab, and — after we absorbed a small primate center last year — some macaque work. Our meeting is two hours once a month and we get through maybe twelve protocols, so I've got roughly ten minutes of discussion each, and the room is me, two working scientists, a veterinarian, the facility manager, and two lay members (a retired teacher, and a guy from a local animal advocacy group who is actually pretty reasonable and very good at spotting when the rest of us are hand-waving).

  Here's my problem. Everyone agrees the committee is supposed to do a harm–benefit analysis. Nobody can tell me how to actually do one across species. The guidance we operate under amounts to: think about the animals' pain and distress, think about the value of the research, use fewer animals, use anesthesia, don't repeat work. Fine as far as it goes, but it completely falls apart exactly where the decision is the comparison. Is 240 mice better or worse than 12 macaques? Is "we will learn how this circuit works" a benefit that can justify a thing, or only a benefit if somebody can say what it's for? Does it matter that the pigs we use are, on every test anyone runs, smarter than the dogs at the shelter down the road? And what do we do with the crayfish people, where nobody can tell me whether the thing we're measuring is pain or just a reflex?

  I've been reading around in animal ethics — the utilitarian stuff and the literature on speciesism — and the thought I keep coming back to is the one about marginal cases: if a protocol would obviously be unacceptable were the subjects humans at the same or lower psychological level (infants, people with profound cognitive disabilities), then whatever is doing the justifying work isn't their level, and I want my committee to have to say out loud what it actually is. But I don't want a procedure that just says "weigh all sentient interests equally," because that would ban essentially everything we review, nobody on the committee believes it, and a procedure that outputs something we won't do is not a procedure, it's a gesture.

  So please write me an actual decision procedure we can run, in order, in about ten minutes, on a real protocol, and write into the minutes. Concretely:

  - The sequence of questions, and for each one, what counts as an adequate answer from the investigators — what evidence, in what form — and what counts as a dodge. I especially want the dodge list; we get an enormous amount of "the literature supports it" and "this is standard practice in the field."
  - The points where the procedure stops with a hard no, and the points where it hands the decision to a person because the question is one of values rather than facts — and how to mark that handoff in the minutes so it's clear we made a judgment and didn't just forget to check.
  - A way of doing the interspecies comparison that doesn't pretend we can convert mouse suffering into human units and doesn't just throw up its hands either. My rough idea: instead of comparing animals to us, compare each animal to the human we'd be willing to use if we had to use humans of comparable capacities — a kind of capacity-matched stand-in — and then make the investigator defend the gap between that stand-in and the actual animal. Improve on it or replace it if it's broken.
  - A device I've started wanting: some kind of standing register of the capacities we ascribe to each species we see, so we can't treat pigs as cognitively fancy when we're arguing they suffer and as cognitively simple when we're arguing the research is necessary. I don't know what to call it or how to maintain it, but the inconsistency is real and I've caught our own minutes doing it.
  - How to handle taxa where sentience is genuinely uncertain, and how to handle "replacement" cases where the replacement lowers the individual but multiplies the count and weakens the science at the same time.

  Then run the finished procedure on three cases, showing the minutes entry for each: (1) a curiosity-driven mouse study — receptor X, social behavior, no application anyone can name, moderate but real harm; (2) the macaque-to-mouse swap I mentioned, where the mouse model is acknowledged to be worse; (3) our breeding colony, which produces a steady surplus of animals who are killed without ever being used in anything. I have a feeling at least one of these comes out as a no to something we currently approve, and I'd rather find out here than in a meeting.

  Two last constraints. The checklist itself has to be runnable by a retired teacher and a veterinarian who have never read any philosophy — put the theory in a separate section addressed to me, not in the steps. And tell me plainly where the procedure will misfire, including the place where the advocacy guy will push and be right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Reluctant Chair of an Animal Care Committee (IACUC equivalent) at a medical school.
      *   **Context:** 180 protocols/year, mixed species (mice, rats, rabbits, pigs, macaques, crayfish). 2-hour monthly meeting, ~12 protocols reviewed (10 mins each). Committee composition: Chair, 2 scientists, Vet, Facility Manager, 2 Lay (teacher, advocate).
      *   **Problem:** Need a concrete, actionable decision procedure for harm-benefit analysis across species. Current guidance is too vague ("think about pain," "use fewer").
      *   **Specific Needs:**
          *   Step-by-step decision procedure (runnable in 10 mins).
          *   Definition of adequate answers vs. dodges (e.g., "standard practice").
          *   Hard stops vs. value judgment handoffs (and how to minute them).
          *   Interspecies comparison method (capacity-matched human stand-in concept, refined).
          *   Capacity Register (to prevent inconsistency in ascribing cognitive traits).
          *   Handling uncertain sentience (crayfish) and replacement trade-offs (more mice vs. fewer pigs).
          *   Three test cases with sample minutes entries (Curiosity mouse study, Macaque-to-Mouse swap, Breeding surplus).
          *   Constraint: Checklist must be usable by non-philosophers (Vet, Teacher). Theory section separate.
          *   Constraint: Identify failure points and where the advocate will be right to object.
      *   **Tone:** Professional, pragmatic, ethically rigorous but operational, respectful of the user's intelligence and position.

  2.  **Deconstruct the Ethical Challenges:**

      *   *Harm-Benefit Analysis:* Needs structure. Not just "is it good?" but "is the good *enough* for *this* harm?"
      *   *Interspecies Comparison:* The user's idea (capacity-matched human stand-in) is strong but needs refinement to avoid speciesism while acknowledging species-specific needs. It's essentially a "moral status proxy."
      *   *Consistency:* The "Capacity Register" is a great idea to prevent moving the goalposts on pig intelligence vs. mouse intelligence.
      *   *Uncertainty:* Precautionary principle for invertebrates.
      *   *Surplus Animals:* This is a classic IACUC blind spot.
      *   *Operational Reality:* 10 minutes per protocol is tight. The procedure must be a filter, not a dissertation.

  3.  **Drafting the Procedure (The "Tool"):**

      *   *Name:* Needs to sound official but descriptive. "Structured Harm-Benefit & Capacity Protocol (SHBCP)."
      *   *Steps:*
          1.  Sentience/Uncertainty Check (Crayfish issue).
          2.  Harm Classification (Severity/Duration).
          3.  Benefit Classification (Direct vs. Indirect, Specific vs. General).
          4.  The "Stand-In" Test (User's idea refined).
          5.  The 3Rs Check (Reduction/Refinement/Replacement).
          6.  The Surplus Check (Breeding issue).
          7.  Final Vote & Minute Tagging.
      *   *Dodges:* Specific phrases to flag ("Standard practice," "Literature says," "It's just a reflex").
      *   *Hard Stops:* Unmitigated severe pain, no scientific merit, surplus without justification.
      *   *Value Handoffs:* Where the committee must explicitly vote on moral weight.

  4.  **Developing the Capacity Register:**

      *   Needs to be a living document.
      *   Categories: Nociception, Emotional Complexity, Social Bonding, Self-Awareness.
      *   Source: Consensus statements, Vet input, Ethology literature.
      *   Usage: Referenced in Step 4 of the procedure.

  5.  **Refining the "Human Stand-In" Concept:**

      *   User's idea: Compare animal to human of comparable capacity.
      *   Refinement: Call it the "Moral Proxy Test."
      *   Logic: "If we cannot justify this protocol using a human infant/dementia patient with equivalent cognitive capacity, why is it justified with the animal?"
      *   Nuance: It doesn't mean we *use* humans. It means the *justification threshold* must match.
      *   Avoid: "Would we do this to a human?" (Answer is always no).
      *   Adopt: "Is the *reason* we aren't doing this to a human sufficient to justify doing it to the animal?"

  6.  **Addressing the Test Cases:**

      *   *Case 1 (Curiosity Mouse):* Moderate harm, low specific benefit. Likely passes under current systems, but might fail under strict harm-benefit. Need to show how the procedure flags the "benefit vagueness."
      *   *Case 2 (Macaque to Mouse):* Fewer macaques, more mice. Worse science. This hits the "Reduction vs. Refinement/Status" conflict. The procedure needs to weigh the *severity* of macaque harm vs. *number* of mice.
      *   *Case 3 (Breeding Surplus):* Often ignored. This is a "Hard Stop" or requires specific justification (e.g., tissue sharing). If killed without use, it's pure harm with zero benefit.

  7.  **Identifying Failure Points:**

      *   Time pressure (10 mins is very short for deep ethics).
      *   Groupthink (Scientists dominate).
      *   The "Stand-In" test might feel too anthropocentric to some, or too permissive to others.
      *   The Advocate's role: They will catch the "Surplus" issue and the "Benefit Vagueness."

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty and validity of the request.
      *   **Part 1: The Operational Procedure (The Checklist).** Designed for the meeting room.
      *   **Part 2: The Capacity Register.** How to build and use it.
      *   **Part 3: Theory & Rationale (For the Chair).** Explaining the "why" without cluttering the checklist.
      *   **Part 4: Test Cases & Minutes.** Showing the output.
      *   **Part 5: Failure Modes & The Advocate.** Honest assessment of limitations.

  9.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is 10 minutes realistic for this much detail?
      *   *Fix:* Emphasize that the *paperwork* is pre-reviewed. The meeting is for the *gaps*. The procedure focuses on the *discussion points*, not reading the protocol.
      *   *Critique:* The "Human Stand-In" might be legally risky (some regulations forbid comparing animals to humans).
      *   *Fix:* Frame it as a "Consistency Check" on moral reasoning, not a literal proposal to use humans. Use the term "Moral Proxy."
      *   *Critique:* The Surplus case is tricky. Often breeding is approved as "maintenance."
      *   *Fix:* The procedure must demand a plan for the surplus. If the plan is "euthanasia without data," that's a specific harm-benefit calculation (Harm: Death, Benefit: None). This needs to be flagged.

  10. **Final Polish:** Ensure the tone is supportive but firm. The user is looking for armor against hand-waving. Give them the shield. (Make sure to explicitly list the "Dodges" as requested).

  *(Self-Correction on the "Human Stand-In"):* I need to be careful here. The user suggested: "compare each animal to the human we'd be willing to use if we had to use humans of comparable capacities." This is essentially the "Argument from Marginal Cases." I will operationalize this as the "Equivalent Capacity Justification." It forces the committee to articulate *why* the species difference matters, rather than ignoring it.

  *(Self-Correction on Minutes):* The minutes need to show *where* the value judgment happened. I'll create a specific tag for "Value Judgment Required."

  *(Self-Correction on Crayfish):* Use the Precautionary Principle. If uncertain, assume sentience for the sake of the protocol.

  Let's assemble the response.cw
answer: |-
  This is a sophisticated request that cuts to the core of institutional animal ethics. You are asking for an operationalizable moral framework that acknowledges the reality of research while refusing to hide behind "standard practice."

  Below is a complete system designed for your constraints: a 10-minute decision procedure, a mechanism for interspecies consistency, and a transparent way to record value judgments.

  ### Part 1: The Operational Procedure (For the Committee)

  **Name:** Structured Harm-Benefit & Capacity Protocol (SHBCP)
  **Time Allocation:** 10 Minutes per Protocol (Pre-meeting review of full protocol assumed)
  **Users:** Chair, Vet, Scientists, Lay Members

  #### Step 1: The Sentience & Uncertainty Check (1 Minute)
  *Goal: Establish the moral floor.*
  *   **Question:** "Is there credible evidence this taxon experiences pain/distress, or is it uncertain?"
  *   **Adequate Answer:** "Yes, consensus exists (e.g., mammals)" OR "Uncertain, but we are applying the Precautionary Principle (e.g., cephalopods/crustacea)."
  *   **The Dodge:** "It's just an invertebrate/reflex."
  *   **Action:** If uncertain, assume sentience for the purpose of this protocol. Mark minutes: *[Sentience Assumed via Precautionary Principle]*.

  #### Step 2: Harm Classification (2 Minutes)
  *Goal: Quantify the cost without euphemism.*
  *   **Question:** "What is the maximum severity and duration of distress for a single individual?"
  *   **Adequate Answer:** Specific behaviors (e.g., "weight loss >20% for 48 hours," "isolation housing for 3 weeks," "terminal hemorrhage without recovery").
  *   **The Dodge:** "Minimal stress," "Category B," "Standard surgical recovery."
  *   **Action:** Assign a Severity Score (1–5).
      *   1: Negligible (handling)
      *   2: Mild (brief restraint)
      *   3: Moderate (surgery, tumor burden)
      *   4: Severe (unrelieved pain, death as endpoint)
      *   5: Unacceptable (always a Hard No)

  #### Step 3: The Benefit Specificity Test (2 Minutes)
  *Goal: Prevent "knowledge for knowledge's sake" from automatically trumping suffering.*
  *   **Question:** "What specific hypothesis is tested, and what is the concrete outcome if successful?"
  *   **Adequate Answer:** "We will determine if Receptor X mediates Behavior Y. If successful, it validates Target Z for Drug Class A."
  *   **The Dodge:** "We will learn how the circuit works," "It adds to the literature," "It's a model for human disease" (without specifying *which* disease or *how* the model maps).
  *   **Action:** Assign a Benefit Weight (Low, Medium, High).
      *   *Low:* Basic mechanism, no stated application.
      *   *Medium:* Mechanism linked to specific pathology/therapy.
      *   *High:* Direct pre-clinical trial for imminent therapy.

  #### Step 4: The Moral Proxy Test (Interspecies Comparison) (3 Minutes)
  *Goal: Address your "capacity-matched stand-in" requirement without violating regulations.*
  *   **Question:** "If we were required to use a human with the cognitive capacity of this animal (e.g., infant, profound disability), would the Benefit Weight justify the Severity Score?"
  *   **Adequate Answer:** "No, we would not use a human infant for this. Therefore, we must explicitly state the morally relevant difference (e.g., species-specific lifespan, lack of future-oriented autonomy) that permits this."
  *   **The Dodge:** "We can't use humans," "It's not the same," "Regulations allow it."
  *   **Action:**
      *   If the answer is "We wouldn't do this to a human equivalent," the committee must record the **Specific Justification** in the minutes.
      *   If no justification is offered beyond "it's a mouse," the protocol stalls.
      *   *Reference:* Consult the **Capacity Register** (see Part 2) to ensure cognitive traits aren't being minimized to justify harm.

  #### Step 5: The 3Rs & Surplus Check (2 Minutes)
  *Goal: Catch the numbers game and the waste.*
  *   **Question A (Replacement/Reduction):** "Does replacing this species with a lower-capacity species increase the total suffering (more individuals × moderate pain vs. fewer individuals × severe pain)?"
      *   *Decision:* If swapping Macaques for Mice increases total net suffering or significantly degrades science (wasting animals), flag for **Value Judgment**.
  *   **Question B (Surplus):** "What happens to animals bred but not used?"
      *   *Adequate Answer:* "They are shared," "They are retained for future protocol X," "They are euthanized, and tissues are banked."
      *   *The Dodge:* "They are culled," "That's colony management."
      *   *Action:* If euthanized without data collection, this harm must be added to Step 2.

  #### Hard Stops (Automatic "No")
  1.  Severity Score 5 (Unrelieved severe pain/distress).
  2.  Benefit Weight "Low" combined with Severity Score 4 or 5.
  3.  Surplus animals euthanized without tissue banking/sharing justification.
  4.  Investigator refuses to answer Step 4 (Moral Proxy).

  #### Value Judgment Handoff
  If the procedure does not yield a clear "Yes" or "No" (e.g., Moderate Harm/Low Benefit, or Complex Species Swap), the Chair calls for a vote.
  *   **Minute Tag:** `[VALUE JUDGMENT: Committee weighed X against Y. Decision rested on priority of Z.]`
  *   This prevents the decision from looking like a bureaucratic checkbox.

  ---

  ### Part 2: The Capacity Register (For Consistency)

  You need a living document to prevent the "pig is smart when we need to show they suffer, but dumb when we need to show the research is vital" inconsistency.

  **Format:** A simple table maintained by the Vet and Chair, reviewed annually.
  **Columns:** Species | Nociception (Pain) | Emotional Complexity | Social Bonding | Self-Awareness | Consensus Source.
  **Rows:** Mouse, Rat, Rabbit, Pig, Macaque, Crayfish.

  **How to use it:**
  During Step 4 (Moral Proxy), if an investigator says, "Pigs don't really understand what's happening," the Chair pulls the Register. If the Register says "High Emotional Complexity/Social Bonding," the investigator must provide evidence to contradict the Register, not just assert it.

  **Maintenance:**
  *   **Source:** Peer-reviewed ethology/veterinary behavior consensus (not individual PI opinion).
  *   **Update:** When new literature emerges (e.g., crayfish sentience).
  *   **Access:** Available to all committee members during review.

  ---

  ### Part 3: Theory & Rationale (For the Chair Only)

  *Do not distribute this to the committee. This explains why the tool works.*

  1.  **The Moral Proxy:** You suggested comparing the animal to a human of comparable capacity. This is the "Argument from Marginal Cases." The risk is that it can be paralyzing (if we can't use the human, we can't use the animal). The procedure mitigates this by allowing the committee to articulate *why* the species difference matters (e.g., ecological role, lack of biographical life), but it forces them to say it out loud. It shifts the burden of proof from the animal (why should it be protected?) to the researcher (why is this species excluded from the protection we'd give a similar human?).
  2.  **The Surplus Problem:** Most IACUCs approve breeding colonies as "infrastructure." Ethically, breeding an animal to kill it is a harm. The benefit is the availability of animals for *other* protocols. By forcing the surplus into *this* protocol's harm-benefit analysis, you prevent the "out of sight, out of mind" ethical laundering.
  3.  **Value Judgments:** Ethics is not math. Sometimes you have to choose between "fewer smart animals suffering more" and "more simple animals suffering less." The procedure identifies *where* the math stops and the values begin, ensuring the minutes reflect a choice, not a calculation.

  ---

  ### Part 4: Test Cases & Minutes Entries

  Here is how the procedure runs on your three specific scenarios.

  #### Case 1: Curiosity-Driven Mouse Study
  *Protocol:* Receptor X knockout, social behavior test, isolation housing (4 weeks), euthanasia. No stated therapeutic application.
  *   **Step 1:** Sentience Assumed (Mammal).
  *   **Step 2:** Harm Score 3 (Moderate: Isolation is significant distress for social species).
  *   **Step 3:** Benefit Weight Low (Basic mechanism, no application named).
  *   **Step 4:** Moral Proxy. Would we isolate a human infant/cognitively equivalent human for 4 weeks to learn about Receptor X? No.
  *   **Step 5:** Surplus checked (Standard).
  *   **Outcome:** **Conditional Approval / Value Judgment.**
  *   **Why:** Low Benefit + Moderate Harm usually triggers a stop. However, basic science is permitted. The committee must justify why *this* basic knowledge is worth the isolation.

  **Minutes Entry:**
  > *Protocol #2023-04 (Mouse Social Behavior).*
  > *Harm Score: 3 (Moderate/Isolation). Benefit Weight: Low (Basic Mechanism).*
  > *Moral Proxy Test: Committee acknowledged equivalent human capacity would preclude this protocol.*
  > *[VALUE JUDGMENT: Committee approved based on potential for foundational understanding of neurodevelopmental disorders, despite lack of direct therapeutic link. Dissent noted by Lay Member regarding severity of isolation relative to benefit.]*
  > *Action: Investigator must provide quarterly update on data utility to justify continuation.*

  #### Case 2: The Macaque-to-Mouse Swap
  *Protocol:* Investigator proposes moving from 12 Macaques (Severe harm, high relevance) to 240 Mice (Moderate harm, lower relevance/admitted worse model).
  *   **Step 1:** Sentience Assumed (Both).
  *   **Step 2:** Harm Score. Macaques (4/Severe). Mice (3/Moderate).
  *   **Step 3:** Benefit Weight. Macaques (High). Mice (Medium - acknowledged worse model).
  *   **Step 4:** Moral Proxy. The gap between Macaque and Human is smaller than Mouse and Human.
  *   **Step 5:** 3Rs Check. Reduction (240 vs 12) vs. Refinement/Status.
  *   **Outcome:** **Hard No / Return for Revision.**
  *   **Why:** The procedure flags the "Weakening Science" issue. Using 240 mice to do a job they can't do well wastes 240 lives. The "Reduction" principle (fewer animals) is being used to undermine the "Refinement/Respect" principle (appropriate model).

  **Minutes Entry:**
  > *Protocol #2023-09 (Macaque-to-Mouse Swap).*
  > *Harm Score: 240 mice @ Score 3 vs 12 Macaques @ Score 4.*
  > *3Rs Check: Reduction achieved, but Scientific Validity compromised.*
  > *[VALUE JUDGMENT: Committee rejected the swap. While total animal count increased, the degradation of scientific validity renders the mouse harm unjustified (waste of life). Macaque protocol requires re-submission with enhanced refinement strategies rather than species swap.]*
  > *Action: Investigator to consult Vet on Macaque refinement options.*

  #### Case 3: The Breeding Colony Surplus
  *Protocol:* Maintenance of Transgenic Line Y. 500 animals bred/year. 200 used in research. 300 euthanized at weaning as "waste."
  *   **Step 1:** Sentience Assumed.
  *   **Step 2:** Harm Score 2 (Euthanasia).
  *   **Step 3:** Benefit Weight None (for the surplus animals).
  *   **Step 4:** Moral Proxy. Would we breed 300 human infants to euthanize 200 of them at weaning? No.
  *   **Step 5:** Surplus Check. **FAIL.**
  *   **Outcome:** **Hard No.**
  *   **Why:** Under this procedure, breeding animals to kill them without data collection is a harm with zero offsetting benefit *for those animals*. The benefit belongs to *other* protocols. This protocol cannot stand alone.

  **Minutes Entry:**
  > *Protocol #2023-12 (Colony Maintenance).*
  > *Surplus Check: 300 animals/year euthanized without data collection.*
  > *Harm Score: 2 (Death). Benefit Weight: None (for surplus).*
  > *[HARD STOP: Protocol cannot be approved as written. Breeding surplus constitutes uncompensated harm.]*
  > *Action: Investigator must submit plan for tissue banking of surplus animals or reduction of breeding rate to match actual usage. Resubmit required.*

  ---

  ### Part 5: Failure Modes & The Advocate

  You asked where this will misfire and where your advocacy member will push.

  **1. The "Time Crunch" Failure**
  *   **Risk:** 10 minutes is aggressive. Scientists will talk fast.
  *   **Failure:** The committee skips Step 4 (Moral Proxy) because it feels "philosophical" and slows things down.
  *   **Mitigation:** You (Chair) must enforce the clock. If Step 4 isn't answered, the protocol is tabled.
  *   **Advocate's Role:** They will be the timekeeper. "We haven't answered the Proxy question yet." They will be right.

  **2. The "Anthropomorphism" Pushback**
  *   **Risk:** Scientists will argue the Moral Proxy Test is unscientific because animals aren't humans.
  *   **Failure:** They reject the Register's cognitive assessments as "soft science."
  *   **Mitigation:** The Vet must anchor the Register in behavioral ethology, not feelings.
  *   **Advocate's Role:** They will catch inconsistencies in the Register (e.g., "Last month we said rats feel anxiety, now you say they don't?"). They will be right.

  **3. The "Surplus" Loophole**
  *   **Risk:** Investigators will claim the surplus *is* useful (e.g., "for teaching").
  *   **Failure:** Committee accepts "potential future use" as a benefit.
  *   **Mitigation:** Require a specific protocol number for the "teaching" use. If it doesn't exist, the benefit is hypothetical.
  *   **Advocate's Role:** They will ask, "Show me the protocol where these carcasses are used." If you can't, it's waste. They will be right.

  **4. The "Value Judgment" Fatigue**
  *   **Risk:** If you tag too many minutes with `[VALUE JUDGMENT]`, the administration may push back, claiming the committee is "creating policy" rather than "reviewing compliance."
  *   **Failure:** You stop tagging them to keep the peace.
  *   **Mitigation:** Explain to administration that untagged value judgments are legal liabilities. Explicitly recorded judgments demonstrate due diligence.
  *   **Advocate's Role:** They will insist on the tag. "Make sure the minutes show we argued about this." They will be right.

  ### Final Advice for the Chair

  You are the filter. The procedure gives you the vocabulary to stop the hand-waving. When an investigator says, "It's standard practice," you say: **"Step 4 requires a justification, not a citation. Standard practice is not a moral argument."**

  When the committee gets tired, remind them: **"We are not here to facilitate research. We are here to judge whether the research is permissible. If we can't answer Step 4, we haven't done our job."**

  This system will make meetings harder. It will make some scientists angry. It will likely result in at least one protocol being returned or rejected (probably the Breeding Surplus). That means it is working.
