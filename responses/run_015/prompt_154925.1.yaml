  Here's a thinking process that leads to the suggested desiderata:

  1.  **Deconstruct the Request:**

      *   **Topic:** Factored-cognition model of collective deliberation (modeled on HCH - Humans Consulting HCH).
      *   **Goal:** Write desiderata for *normative adequacy* of this model as a representation of human reasoning at scale.
      *   **Four Clusters to Cover:**
          1.  Decomposition conditions (independence, shared vocabulary).
          2.  Analogical cross-contamination (leakage as bug vs. feature).
          3.  Irreducible disagreement/epistemic friction (vs. consensus).
          4.  Falsification constraints (real deliberation vs. artificial architecture).
      *   **Specific Requirements for Each Desideratum:**
          *   Motivating case/failure mode.
          *   Status (Non-negotiable vs. Preference).
          *   Joint Unsatisfiability analysis (Tensions between requirements).
      *   **Overall Analysis:**
          *   Identify the single requirement that most excludes naive models.
          *   Clarify the purpose of adequacy (predictive, normative, scalability).
      *   **Constraints:** No bibliographies, citations, or specific paper references. Focus on criteria and justifications.

  2.  **Analyze the Core Tension:**

      *   HCH (Humans Consulting HCH) is fundamentally about *factorization* and *recursion*. It assumes problems can be broken down into independent queries that sum up to a solution.
      *   Human reasoning, especially collective deliberation, is often *holistic*, *context-dependent*, and *dialectical*.
      *   The prompt asks to bridge this gap: What does an HCH-like model need to look like to actually capture human reasoning well, rather than just being an efficient computation engine?
      *   Key tension: Factorization (clean separation) vs. Analogical Leakage (creative connection) vs. Epistemic Friction (disagreement).

  3.  **Drafting the Desiderata (Cluster by Cluster):**

      *   *Cluster 1: Decomposition & Vocabulary.*
          *   *Idea:* You can't just cut a problem anywhere. The cuts must preserve meaning.
          *   *Desideratum:* Semantic Invariance under Decomposition.
          *   *Failure:* Losing context when splitting a moral dilemma into factual sub-queries.
          *   *Status:* Non-negotiable for validity.

      *   *Cluster 2: Analogical Cross-Contamination.*
          *   *Idea:* HCH wants isolation. Humans use metaphors across domains.
          *   *Desideratum:* Controlled Permeability for Analogical Transfer.
          *   *Failure:* Sterile reasoning that misses creative insights derived from cross-domain mapping.
          *   *Status:* Preference (Efficiency vs. Creativity), but crucial for "human-like" adequacy.
          *   *Tension:* Directly fights Cluster 1's independence.

      *   *Cluster 3: Disagreement & Friction.*
          *   *Idea:* HCH usually converges on the "right" answer. Real deliberation often holds conflicting valid views.
          *   *Desideratum:* Structural Preservation of Incommensurability.
          *   *Failure:* Forced consensus that erases minority perspectives or distinct frameworks.
          *   *Status:* Non-negotiable for *normative* adequacy (legitimacy), maybe negotiable for *predictive* adequacy.
          *   *Tension:* Threatens recursive stability (HCH needs a return value).

      *   *Cluster 4: Falsification/Constraints.*
          *   *Idea:* How do we know this isn't just a fancy calculator?
          *   *Desideratum:* Empirical Isomorphism to Natural Deliberative Trajectories.
          *   *Failure:* The model produces the right answer but via a path no human group would ever take (process invalidity).
          *   *Status:* Non-negotiable for the claim of "representing human reasoning."

  4.  **Synthesizing the Analysis (Tensions & Priorities):**

      *   *Joint Unsatisfiability:* Yes. You cannot have perfect factorization (Cluster 1) and significant analogical leakage (Cluster 2). You cannot have deep friction (Cluster 3) and stable recursion (HCH core).
      *   *Key Exclusionary Requirement:* Cluster 2 (Analogical Leakage) is the biggest hurdle for naive decompositional models because they assume independence by definition.
      *   *Purpose of Adequacy:* The prompt asks for "normatively adequate representation." This implies we care about the *legitimacy* and *fidelity* of the reasoning process, not just the output accuracy.

  5.  **Refining the Tone and Structure:**

      *   Tone: Philosophical, technical, precise, analytical.
      *   Structure: Introduction (defining the scope), The Four Desiderata (with sub-sections for motivation, status, tension), Synthesis/Analysis (tensions, key requirement, purpose).
      *   Check constraints: No citations.

  6.  **Drafting Content - Section by Section (Mental or Scratchpad):**

      *   *Intro:* Define the scope. HCH as idealization. The goal is normative adequacy.
      *   *D1 (Decomposition):* Call it "Semantic Integrity of Decomposition." Focus on shared vocabulary. If I split a question, the sub-questions must mean the same thing in context.
      *   *D2 (Analogy):* Call it "Permeable Boundaries for Analogical Transfer." Is leakage a bug? For human reasoning, it's a feature. For HCH, it's a bug. This is the crux.
      *   *D3 (Disagreement):* Call it "Retention of Incommensurable Frameworks." HCH wants a single answer. Deliberation often wants a map of disagreement.
      *   *D4 (Falsification):* Call it "Process Isomorphism." It's not just about the answer, it's about the path.
      *   *Analysis:* Address the tensions. Factorization vs. Leakage. Stability vs. Friction.
      *   *Conclusion:* Identify the "killer" constraint (Analogy/Leakage) and the purpose (Normative Legitimacy/Fidelity).

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I emphasize "normative adequacy" enough?
      *   *Fix:* Ensure the language distinguishes between "does this compute the right answer?" (instrumental) and "is this a valid way for humans to reason together?" (normative).
      *   *Critique:* Did I address the "shared conceptual vocabulary" in Cluster 1?
      *   *Fix:* Explicitly mention ontology alignment in D1.
      *   *Critique:* Did I address the "bug vs. feature" in Cluster 2?
      *   *Fix:* Explicitly label it as a tension between engineering efficiency and cognitive fidelity.
      *   *Critique:* Did I answer the specific question about which requirement excludes naive models?
      *   *Fix:* Make sure the final analysis section clearly points to the Analogical Leakage requirement as the primary differentiator.

  8.  **Final Polish:** Check against the "no citations" rule. Ensure clear headings. Ensure the "Joint Unsatisfiability" section is robust. (The prompt asks to say *whether* any subset is jointly unsatisfiable).

      *   *Refining the "Joint Unsatisfiability" point:* It is crucial to state that strict HCH factorization is logically incompatible with significant analogical leakage. If subproblems are truly independent, leakage shouldn't happen. If leakage happens, they aren't independent. This is a hard logical tension, not just a practical one. Similarly, HCH requires a return value to proceed up the tree. Irreducible disagreement prevents a single return value.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Desiderata for a Normatively Adequate Factored-Cognition Model of Collective Deliberation

  The following specification outlines the necessary conditions for a factored-cognition architecture—modeled on the recursive delegation idealization of Humans Consulting HCH (HCH)—to count as a normatively adequate representation of human reasoning at scale. Adequacy here is assessed primarily in terms of **fidelity to cognitive process** and **normative legitimacy of the outcome**, rather than mere instrumental convergence on a correct answer. A model that reaches the right conclusion via a reasoning path that no human collective could validly inhabit is deemed inadequate.

  ## Cluster 1: Semantic Integrity of Decomposition

  **Desideratum:** The model must enforce **Ontological Continuity Across Recursive Depths**. When a problem is decomposed into subproblems, the conceptual vocabulary and semantic definitions used by child nodes must remain invariant with the parent node, or explicitly map to it without loss of contextual nuance.

  *   **Motivating Case / Failure Mode:** *Context Stripping.* In naive factorization, a complex moral or strategic query (e.g., "Is this policy just?") is decomposed into factual sub-queries (e.g., "What is the economic cost?", "What does the law say?"). The failure mode occurs when the sub-nodes operate on definitions of "cost" or "law" that strip away the normative context required by the parent, leading to a recomposed answer that is factually precise but semantically hollow.
  *   **Status:** **Non-negotiable.** Without ontological continuity, the recursion does not represent reasoning; it represents data processing. For the model to claim fidelity to human deliberation, the meaning of terms must survive the fragmentation of the query.
  *   **Tension Analysis:** This requirement is in direct tension with efficiency. Enforcing semantic invariance requires overhead (context transmission) that scales poorly with depth. However, without it, the "human" element of HCH is lost, reducing the model to a generic divide-and-conquer algorithm.

  ## Cluster 2: Permeable Boundaries for Analogical Transfer

  **Desideratum:** The model must allow for **Controlled Analogical Leakage**. The architecture must permit reasoning states in one branch of the decomposition tree to influence reasoning in a nominally independent branch via metaphorical or analogical mapping, treating such cross-contamination as a potential feature for insight rather than a bug to be engineered away.

  *   **Motivating Case / Failure Mode:** *Sterile Siloing.* Human creativity often arises from "category errors"—applying a framework from biology to economics, or from aesthetics to ethics. A strict HCH model isolates subproblems to prevent interference. The failure mode is a system that is logically consistent but cognitively sterile, incapable of the lateral leaps that characterize high-level human deliberation.
  *   **Status:** **Preference of Fidelity Camps.** Proponents of scalable convergence (engineering efficiency) will view this as a bug that introduces noise and instability. Proponents of cognitive fidelity (normative adequacy) view this as non-negotiable for capturing creative insight.
  *   **Tension Analysis:** This is the primary site of logical friction with Cluster 1. If subproblems are truly independent (Cluster 1), analogical leakage (Cluster 2) should be impossible. If leakage is permitted, independence is compromised. A normatively adequate model must resolve this by allowing *semantic* independence while permitting *heuristic* permeability.

  ## Cluster 3: Structural Preservation of Incommensurability

  **Desideratum:** The hierarchy must support **Irreducible Epistemic Friction**. The system must be capable of returning a structured representation of disagreement where sub-nodes hold incommensurable frameworks that cannot be resolved into a single consensus value without distortion.

  *   **Motivating Case / Failure Mode:** *Forced Consensus.* Standard HCH assumes a single scalar or textual return value that satisfies the parent query. In human deliberation, particularly on value-laden topics, consensus is often achieved by papering over deep framing differences. The failure mode is a model that artificially converges on a "middle ground" answer that satisfies the architecture's need for a return value but misrepresents the actual state of collective reasoning.
  *   **Status:** **Non-negotiable for Normative Legitimacy.** If the goal is to represent human deliberation, the model must capture the reality that some disagreements are foundational, not factual. A model that forces convergence falsifies the deliberative landscape.
  *   **Tension Analysis:** This threatens the **Recursive Stability** of HCH. HCH relies on the parent node being able to process the child's output to proceed. If the output is a contradiction or a set of incommensurable frames, the parent node may stall. Maintaining friction undermines the computational utility of the recursion.

  ## Cluster 4: Process Isomorphism

  **Desideratum:** The model must satisfy **Empirical Process Isomorphism**. The trajectory of the decomposition and recombination must map onto observable trajectories of natural human collective reasoning, such that the intermediate states of the model are intelligible and plausible to human observers, not just the final output.

  *   **Motivating Case / Failure Mode:** *Alien Reasoning Paths.* A model might arrive at a correct conclusion by decomposing a problem in a way no human group ever would (e.g., decomposing a political decision into pure thermodynamic variables). While instrumentally useful, this fails as a *representation* of human reasoning. It imposes an artificial architecture rather than modeling the native structure of deliberation.
  *   **Status:** **Non-negotiable for Representational Claims.** If the claim is that this models *human* reasoning, the process must be human-recognizable. If the claim is merely that it is a *useful* reasoning engine, this desideratum can be dropped.
  *   **Tension Analysis:** This constrains the optimization of the other three. To match human process, the system may need to be less efficient, allow more leakage, and tolerate more friction than an optimized solver would.

  ***

  ## Analysis of Joint Unsatisfiability and Tensions

  There are specific subsets of these requirements that are jointly unsatisfiable under a strict interpretation of the HCH architecture.

  **1. The Factorization-Leakage Paradox:**
  Cluster 1 (Semantic Integrity/Independence) and Cluster 2 (Analogical Leakage) stand in fundamental tension. Strict factorization requires that subproblems be independent such that $P(A, B) = P(A) \times P(B)$. Analogical leakage implies that solving $A$ changes the probability distribution or framing of $B$.
  *   *Resolution:* They are jointly unsatisfiable in a strictly modular architecture. To satisfy both, the model must abandon clean factorization in favor of a **holistic graph structure** where nodes are distinct but edges allow for non-local state updates. This moves the model away from pure HCH toward a distributed constraint satisfaction network.

  **2. The Friction-Stability Paradox:**
  Cluster 3 (Irreducible Friction) and the core mechanic of HCH (Recursive Stability) are in tension. HCH is designed to amplify capability by recursively refining answers toward a target. If disagreement is irreducible, the recursion has no termination condition or clear return value.
  *   *Resolution:* They are jointly unsatisfiable if the goal is a single output. They are satisfiable only if the "output" of the deliberation is redefined from a *decision* to a *map of the decision space*. This requires altering the HCH objective function from "answer the query" to "characterize the query's solution space."

  ## The Primary Exclusionary Requirement

  The single requirement that does the most to exclude naive decompositional models is **Cluster 2: Permeable Boundaries for Analogical Transfer.**

  Naive factored-cognition models rely on the assumption of conditional independence to achieve scalability. They assume that if a problem is broken down sufficiently, the pieces do not talk to each other except through the defined interface. By mandating that analogical cross-contamination is a necessary feature of human reasoning (rather than noise), this desideratum invalidates the core mathematical convenience of factorization. It forces the model to account for the "messiness" of human cognition, where context bleeds across boundaries. A model that satisfies Cluster 1, 3, and 4 but fails Cluster 2 is merely a efficient calculator; it is not a model of human deliberation.

  ## Purpose of Adequacy Assessment

  The purpose for which these adequacy criteria are being assessed is **Normative Legitimacy and Fidelity to Cognitive Process**, not predictive accuracy or scalability.

  *   **Why not Predictive Accuracy?** A black-box neural net might predict human decisions better than a factored model. That is not the goal here.
  *   **Why not Scalability?** HCH is often proposed for scalability. However, to count as a *representation of human reasoning*, scalability cannot come at the cost of distorting the reasoning process itself.
  *   **The Chosen Purpose:** The criteria prioritize **Fidelity**. The model is being judged on whether it preserves the *structure* of human deliberation (including its inefficiencies, leaks, and disagreements) while scaling. If the model scales by removing the very features that make human reasoning human (analogy, friction, context), it fails the normative test, even if it produces "better" answers. The goal is to determine if we can scale human reasoning without ceasing to reason like humans.
