answer: |-
  Thanks for sending these notes over. You asked for real pushback rather than politeness, so I am going to be direct about where I think this argument is stumbling. The core issue is that you are treating Parfit's Hitchhiker as a problem about moral obligation when Parfit explicitly frames it as a problem about rationality and self-interest. When you argue that the promise changes the ontology of the situation rather than just the incentives, you are effectively stipulating away the puzzle instead of solving it. The thought experiment is designed to isolate a specific moment where your self-interest and your prior commitment diverge, assuming no external sanctions exist. If you claim the promise itself ontologically transforms the situation such that you now have a reason to pay, a decision theorist will simply ask you to specify that reason in the payoff matrix. If you cannot specify it as a utility gain or a preference satisfaction, then by the lights of the theory you are being asked to critique, you are acting irrationally. If you can specify it, then it was just an incentive all along, and your ontological claim collapses back into standard instrumental rationality.

  Your worry about smuggling in deontological assumptions is well-founded because that is exactly what is happening here. Decision theorists, including Parfit in this specific context, are testing whether a theory of rationality can be self-defeating. Parfit's point is that Self-Interest Theory tells you to be the kind of person who pays, but then tells you not to pay when the time comes. He uses this to show the theory is incoherent, not to prove that promises create magical moral fields. By arguing that the promise creates an obligation that outlasts strategic reason, you are importing a moral premise into a debate about rational coherence. This does not distinguish itself from contractualist readings so much as it ignores the specific challenge Parfit is raising. Contractualists like Scanlon or Rawls might agree with you that promises create obligations, but they would still have to explain why a rational agent should adhere to those obligations when doing so is strictly costly and there are no sanctions. You are asserting the obligation exists, but you are not explaining why rationality requires respecting it in the absence of consequences, which is the entire point of the Hitchhiker case.

  The wedding vow analogy hurts your argument more than it helps because it relies on the very social and legal structures the Hitchhiker case strips away. People keep wedding vows for many reasons, including social pressure, legal costs of divorce, religious belief, and emotional attachment. The Hitchhiker case is stylized to remove all of those variables to test pure rationality. When you note that people break vows when it is convenient, you actually undermine your own point. If people break vows when it is convenient, then the vow did not ontologically transform the situation enough to override self-interest. If they keep them, it is usually because of the surrounding social fabric, which the Hitchhiker driver explicitly lacks. Using an example that depends on thick social context to explain a thought experiment designed to test thin rationality is a category error. It suggests you are solving a sociological problem rather than the philosophical problem Parfit set out.

  You also asked if Parfit already addresses this, and the plain answer is yes. Parfit distinguishes between Self-Interest Theory and Morality throughout Reasons and Persons. He knows that morality might require you to pay. His argument is that even if we only care about self-interest, we still need to account for the fact that being disposed to keep promises serves our self-interest better than being disposed to break them. If you argue that the promise changes the moral landscape, Parfit would agree but say that is irrelevant to the specific claim he is making about Self-Interest Theory being self-defeating. You are answering a question he is not asking. He is asking whether rationality requires you to pay given that you want to survive. You are answering that morality requires you to pay given that you promised. These are different projects.

  Ultimately, your argument feels confused because it tries to solve a decision-theoretic paradox with a moral assertion. If you want to pursue this angle, you need to be clearer that you are challenging the decision-theoretic framework itself, not trying to solve the puzzle within it. You would need to argue that the definition of rationality is incomplete because it excludes ontological changes brought about by speech acts like promising. But be aware that this is a massive claim that requires defending the reality of moral facts against naturalistic reductions, which is a much heavier lift than analyzing the Hitchhiker case. As it stands, you are conflating the normative force of a promise with the ontological structure of the choice situation. Decision theorists will reject this because they view the situation as defined by the available outcomes and probabilities, not by the moral status of the agents. If you cannot translate your ontological change into a reason that counts within the agent's deliberation, you have not shown why the agent should pay, only that they ought to in some external moral sense. That might be a valid moral claim, but it does not engage with Parfit's argument about rationality, and it will look like you missed the point of the case entirely.
