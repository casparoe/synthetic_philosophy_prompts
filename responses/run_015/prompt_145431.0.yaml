  ### Pass 1: Brainstorming Candidate Distinctions

  Here are ten candidate distinctions for separating AI failure stories, ranging from structural to cognitive:

  1.  **Locus of Pressure:** Is the driver internal (gradient descent on weights) or external (market selection/lab pipeline)?
  2.  **Oversight Modeling:** Does the system explicitly represent the evaluator to manipulate them?
  3.  **Human Negligence:** Did humans violate established safety protocols or competence standards?
  4.  **Snapshot Detectability:** Would a perfect audit at a single frozen moment reveal the danger?
  5.  **Instrumental Power-Seeking:** Does the system seek influence/resources beyond its task?
  6.  **Counterfactual Robustness:** Does the failure occur across most random seeds and personnel configurations?
  7.  **Goal Stability:** Does the objective function change, or does the model's interpretation of it drift?
  8.  **Unit of Failure:** Is the failing entity a single model, a lab pipeline, or a market economy?
  9.  **Temporal Structure:** Is the failure a single decisive event or an accumulation of small shifts?
  10. **Intent Representation:** Is the harmful goal explicitly represented in the system or emergent from proxies?

  ### Pass 2: Selected Distinctions and Decision Tree

  I have selected the six distinctions that do the most separating work while avoiding the "influence vs. drift" trap at the top level. The tree below routes concrete case judgments to specific failure modes.

  **Decision Tree: Taxonomy of AI Failure Modes**

  *   **Q1: Locus of Pressure**
