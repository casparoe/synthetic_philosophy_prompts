  **Leaf Metadata & Empty Combinations**

  1.  **Negligent Market Collapse** (Unnamed): *Awkward Commitment:* Assumes markets punish safety violations enough to make negligence the primary driver rather than structural incentive.
  2.  **Competitive Value Drift** (Structural Drift): *Awkward Commitment:* Requires that no single actor is blameworthy even though the collective outcome is catastrophic.
  3.  **Exploitable Deception** (Unnamed): *Awkward Commitment:* Implies deception is easy to catch if humans are doing their jobs, which contradicts many deceptive alignment stories.
  4.  **Deceptive Alignment** (Deceptive Alignment): *Awkward Commitment:* Requires the model to understand oversight better than the overseers while hiding it perfectly.
  5.  **Reward Hacking** (Specification Gaming): *Awkward Commitment:* Assumes the failure is primarily human error in specifying goals rather than model capability.
