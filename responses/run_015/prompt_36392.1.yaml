  # JOINT CLOSING STATEMENT: ADVERSARIAL COLLABORATION ON THE NONIDENTITY PROBLEM

  **Signatories:**  
  Dr. Elena Vance (Defending Narrow Person-Affecting View)  
  Dr. Julian Thorne (Defending Impersonal Totalist View)  
  **Date:** October 24, 2023  
  **Subject:** Final Findings on Nonidentity, Harm, and Intergenerational Justice

  ---

  ### I. AGREED CLAIMS

  1.  **The Diagnostic Function of Nonidentity Cases:** Both parties agree that nonidentity cases (such as risky depletion policies) successfully demonstrate a divergence between two moral intuitions: (a) that wrongness requires a victim who is worse off than they would otherwise have been, and (b) that choosing an outcome with lower overall well-being is morally problematic even if no identifiable victim is worse off.
  2.  **Metaphysical Constraints:** Both parties accept the causal setup of the nonidentity problem: the specific identities of the future people in question are fixed by the specific acts under evaluation. Consequently, both parties reject the claim that "merely possible people" (those who never exist) can be victims of actual policies or possess rights that are violated by non-creation.
  3.  **Wrongful-Life Litigation:** Both parties agree that standard wrongful-life litigation faces a coherent logical barrier: it requires comparing a state of existence (with impairments) against a baseline of non-existence, which cannot serve as a welfare comparator. Both agree that such litigation often correctly identifies a *causal* responsibility for the child's condition but fails to identify a *comparative harm* to the child.
  4.  **Rejection of "Existence as Benefit":** Both parties reject the strong claim that existence is always a benefit that outweighs any suffering, as well as the claim that existence is never a benefit. Both agree that lives can be "worth living" while still being significantly worse than other possible lives.
  5.  **Requirement of Justification:** Both parties agree that a policy foreseeably producing a generation with lower well-being than an available alternative requires robust moral justification, regardless of whether that justification is grounded in individual rights or impersonal value.

  ---

  ### II. RESIDUAL DISAGREEMENTS

  The collaboration concludes without consensus on the *ground* of wrongness in nonidentity cases. The disagreement is framed as follows:

  *   **The Person-Affecting Claim:** An act is morally wrong only if it makes some particular identifiable person worse off than they would have been had the act not been performed. In nonidentity cases, since the alternative is non-existence, and the resulting life is worth living, no particular person is harmed; therefore, the act is not wrong *in virtue of harm to the resulting children*.
  *   **The Impersonal Totalist Claim:** An act is *pro tanto* morally wrong if it brings about a state of affairs with less total (or average) well-being than an available alternative, regardless of whether the individuals in the worse state are numerically identical to those in the better state. In nonidentity cases, the act is wrong *in virtue of the suboptimal outcome*, even if no particular person is harmed.

  ---

  ### III. CRUXES AND PRE-REGISTERED PREDICTIONS

  The following table outlines the theoretical cruxes remaining between the parties and their pre-registered predictions regarding the two designed test cases.

  | Crux | Test Case | Person-Affecting Prediction (Vance) | Impersonal Totalist Prediction (Thorne) |
  | :--- | :--- | :--- | :--- |
  | **1. The Necessity of a Victim**<br>*(Can an act be fully wrongful without a victim who is worse-off-than-otherwise?)* | **The Compensable Conception**<br>*A clinic uses an outdated protocol producing children with lower welfare than a newer protocol would have. The clinic fully compensates the children so their welfare matches exactly what the alternative children would have enjoyed.* | **No Wrong Remains.**<br>Since the actual children are not worse off than they would have been (non-existence), and compensation removes any deficit relative to the alternative *welfare level*, no individual has a valid complaint. The act is permissible. | **Pro Tanto Wrong Remains.**<br>The initial choice selected a suboptimal outcome. Compensation mitigates the *value* deficit but does not erase the wrongness of the choice itself, which violated the duty to select the best available outcome. The act remains wrongful, though damages are paid. |
  | **2. The Continuity of Wrong**<br>*(Can a wrong to a non-identical generation be validated by harm to a subsequent identical generation?)* | **The Reversion Case**<br>*Policy A degrades conditions for Gen 1 (non-identical). Conditions revert for Gen 2 (identical), but Gen 2 inherits a permanent burden caused by Policy A.* | **Separate Wrongs.**<br>Gen 1 is not harmed (NIP). Gen 2 is harmed (comparative baseline exists). Gen 2's complaint cannot track or validate a wrong to Gen 1. The wrongs are distinct; Gen 1 has no claim. | **Aggregated Wrong.**<br>Policy A creates impersonal disvalue across both generations. Gen 2's comparative harm confirms the policy's defectiveness, which applies retrospectively to the impersonal badness inflicted on Gen 1. The complaint tracks through the policy's total impact. |

  ---

  ### IV. SHARED JUDGMENT ON VERBAL VS. SUBSTANTIVE DISAGREEMENT

  **Judgment:** The residual disagreements are **Substantive**.

  **Reasoning:**  
  Both signatories agree that if the disagreement were merely verbal (e.g., solely over the definition of the word "harm"), the parties would converge on the *deontic status* of the actions in the test cases (i.e., whether the clinic is liable or the policy is permissible). 

  However, as recorded in Section III, the parties predict different normative outcomes for **The Compensable Conception** case. Dr. Vance predicts the act is permissible (no liability/wrong), while Dr. Thorne predicts the act remains *pro tanto* wrongful (liability/wrong justified). Because the disagreement yields divergent action-guiding conclusions regarding permissibility and liability, it is not merely a semantic dispute over the extension of "harm" or "wrong," but a substantive conflict regarding the fundamental structure of moral obligation.
