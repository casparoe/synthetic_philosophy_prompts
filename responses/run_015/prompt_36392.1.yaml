      *   *Judgment:* Substantive. It changes action guidance (e.g., in Compensable Conception). If it were merely verbal, they would agree on the permissibility of the act. They don't.

  7.  **Review and Refine:**
      *   *Tone:* Academic, precise, collaborative but firm on differences.
      *   *Constraint Check:* "No hybrid clause that each side would privately read its own way." This is the hardest part. I must avoid phrases like "moral significance" without defining it, unless both agree on the definition.
