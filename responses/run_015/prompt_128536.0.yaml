answer: |-
  The short answer is: **The stats guy is right.**

  It is not just a matter of taste. The choice of how you generate "random lines" fundamentally changes the probability of sampling different parts of the marsh. Because your reeds are not evenly distributed (they creep in from the edges), the three methods will give you three different answers.

  Here is the breakdown of why this happens, who is biased, and the practical solution that will make everyone happy.

  ### 1. The Mathematical Problem: Bertrand's Paradox
  Your intuition that "all three sound like a random line" is a classic trap in probability known as **Bertrand's Paradox**. It turns out there is no single definition of a "random line" intersecting a circle. Depending on how you construct the line, you create different **sampling densities**.

  For your estimate to be accurate (unbiased), every square meter of the marsh needs an equal chance of being stepped on by your crew. This is called **Uniform Random** sampling.

  *   **Method 1 (Your Crew): Random Endpoints.**
      *   **How it works:** Pick two points on the perimeter, pull a rope.
      *   **The Bias:** This method favors **long chords**. There are many more ways to draw a long line through the center than a short line near the edge.
      *   **Result:** You oversample the center of the marsh and undersample the edges.
      *   **Impact on your data:** Since the reeds are at the edges, your crew is likely **underestimating** the infestation.

  *   **Method 2 (Stats Guy): Random Bearing + Distance.**
      *   **How it works:** Pick a random angle and a random perpendicular distance from the center.
      *   **The Bias:** None (ideally). This generates an **Isotropic Uniform Random (IUR)** set of lines.
      *   **Result:** Every strip of land across the marsh has an equal probability of being intersected by a line.
      *   **Impact on your data:** This provides a mathematically unbiased estimate of area fraction.

  *   **Method 3 (Third Person): Random Midpoint.**
      *   **How it works:** Pick a random spot inside the marsh, make it the middle of the line.
      *   **The Bias:** This favors **short chords**. There is much more area near the edges where a midpoint can exist than there is near the center.
      *   **Result:** You oversample the edges and undersample the center.
      *   **Impact on your data:** Since the reeds are at the edges, this method would likely **overestimate** the infestation.

  ### 2. Does it really change the numbers?
  **Yes.** Because the reed distribution is spatial (edge vs. center), the spatial bias of the line selection directly translates to bias in the coverage estimate.

  If the reeds were perfectly evenly mixed like salt in water, it wouldn't matter. But since they "creep in from the edges," the sampling density is critical.
  *   **Crew Method:** Low estimate.
  *   **Third Person:** High estimate.
  *   **Stats Guy:** Correct estimate.

  ### 3. The Practical Solution (The "Fourth Option")
  The Stats Guy is theoretically right, but his method is a pain in the field. Finding the exact center of an irregular marsh and measuring perpendicular distances with a rope is difficult and prone to error.

  There is a standard ecological survey method that satisfies the Stats Guy's math but is easier for the Crew to execute: **Systematic Parallel Transects.**

  Instead of random lines, you lay down a series of **parallel lines** with a fixed spacing (e.g., every 20 meters), but you **randomize the start point**.

  1.  **Pick a random starting distance** (e.g., use a random number generator to pick a number between 0 and 20 meters).
  2.  **Pick a random compass bearing** (to ensure isotropy, though for simple area fraction, North-South is often acceptable if the marsh has no orientation).
  3.  **Lay parallel lines** across the marsh at that fixed interval.

  **Why this wins:**
  *   **Uniformity:** Like the Stats Guy's method, this ensures every part of the marsh has an equal chance of being sampled.
  *   **Ease:** Once the first line is set, the rest are just "pace 20 meters, turn 90 degrees, walk." No finding the center.
  *   **Precision:** Systematic sampling usually has lower variance (more precision) than purely random sampling.

  ### Recommendation
  1.  **Acknowledge the bias:** Tell the crew that their current rope method systematically ignores the edges where the reeds actually are.
  2.  **Adopt Systematic Transects:** Propose the parallel line method. It is the standard in stereology and ecology for exactly this reason.
  3.  **If you must stick to single lines:** Use the Stats Guy's method (Random Bearing + Random Distance). It is the only one of the original three that is mathematically valid for area estimation.

  **Verdict:** It is not taste. It is geometry. The Stats Guy is right, but a systematic grid is better for the field.
