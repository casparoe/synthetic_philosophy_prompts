          *   *Relevance to Area Estimation:* We aren't estimating chord length probability; we are estimating *area fraction* using line intercepts. This is related to the **Buffon-Noodelman theorem** or principles of **design-based stereology**.
          *   For area fraction estimation ($A_A$) using line intercepts ($L_L$), the estimator is unbiased *if and only if* the test lines are **isotropic and uniform random (IUR)**.
