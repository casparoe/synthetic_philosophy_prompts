prompt: |-
  I write about science and ideas for a magazine, and I'm currently working on a piece about what happens to moral language once a great deal of it starts coming out of institutions and machines rather than people: crisis triage protocols drafted by rotating hospital committees and then applied by software, model-generated summaries of what a patient "ought" to be told, training datasets built from moral annotations whose authors are dead. At a workshop dinner I sat through recently, two philosophers had an argument I have not been able to stop turning over, and I would like it adjudicated rather than summarized. They began from common ground: expressivism holds that to call something wrong is not to state a belief but to voice a conative attitude, something closer to cheering or booing than to describing; the Frege–Geach problem is that moral sentences keep their full meaning in positions where nothing is being voiced, as when "stealing is wrong" sits in the antecedent of a conditional, and yet moral arguments containing such sentences look straightforwardly valid; and the best-known expressivist reply, the quasi-realist one associated with Simon Blackburn, relocates validity one level up, so that what makes the argument good is not shared representational content but the incoherence of simultaneously being for the antecedent, for the conditional, and against the consequent.

  From there it went like this. (1) The critic, Julian, introduced what he called "unowned" moral sentences: tokens that are produced, stored, and used without any agent ever having the relevant attitude and, in some cases, without any agent being in a position to have it — a protocol line saying that withholding life-sustaining treatment in a certain class of cases is permissible, or a verdict emitted by a model trained on annotators no one can now question. He said such tokens enter inferences that are plainly valid and plainly action-guiding, while the expressivist's surrogate for validity has nothing to bite on, since there is no one whose attitudes could be incoherent. (2) The expressivist, Nadia, answered that this is the original problem in a new costume: the Frege–Geach problem was always about unasserted occurrences, an unowned token is simply an unasserted one with nobody standing nearby, and meaning is fixed by the practices of a community of attitude-holders from which the token inherits its content; the protocol's inference is valid in that anyone who did take up those sentences — who applied them while rejecting their upshot — would be incoherent. (3) Julian replied that this makes validity hostage to agents who will never exist, since the protocol simply runs and no one takes it up in the relevant sense, and that in the meantime Nadia is quietly treating the sentences as correct or incorrect independently of anybody's attitudes, which is the very thing in dispute; he added that if content can be inherited from attitudes held by people long dead, then the attitudes are doing no semantic work and expressivism has become a causal story about how a practice got started. (4) Nadia's sharpest move was to say that Julian's pressure case is really a dispute about what counts as a bearer of commitment rather than about moral semantics: expressivism never required an occurrent feeling, the attitude in the embedded antecedent was never felt either, and if an institution or a system with a stable dispositional profile can count as a commitment-bearer, then its patterned dispositions can coherently or incoherently hang together and the view accommodates the case. (5) Julian answered that if commitments can float entirely free of affect, motivation, and any capacity to be moved by what one "accepts," the position survives only by ceasing to be a distinctive semantic thesis — it has become realism with a deflationary theory of truth bolted on, and the old motivation for expressivism, the tight link between moral judgment and motivation, has quietly evaporated. Neither would budge, and I genuinely could not tell who was winning.

  So please referee it. Go through the five moves and tell me who is right about what at each step — ideally rating each move from clearly mistaken to clearly right and justifying the rating briefly, since I suspect several of them are partly right in different respects — and then tell me what, if anything, both of them are missing. Specifically: are unowned sentences a genuinely new problem for expressivism or only the Frege–Geach problem re-described; does the disagreement in fact bottom out somewhere other than moral semantics, in a general theory of content or of what an agent is; does the case tell us anything about whether a practice needs live participants to confer meaning; and what, if anything, all of this settles about the question I actually have to answer in my piece — whether sentences issued by committees, protocols, and models can be said to mean what our moral sentences mean.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **User:** A science/ideas magazine writer working on a piece about moral language coming from institutions/machines (protocols, AI models, dead annotators) rather than people.
      *   **Context:** A workshop dinner argument between two philosophers (Julian, the critic; Nadia, the expressivist).
      *   **Subject:** Expressivism, the Frege-Geach problem, and a new twist involving "unowned" moral sentences (machine/institutional output).
      *   **Task:** Adjudicate the argument (not just summarize). Go through the 5 moves, rate them (mistaken to right), justify ratings. Then identify what both are missing. Finally, answer the writer's core question: Do sentences from committees/protocols/models mean what our moral sentences mean?
      *   **Tone:** Philosophical rigor but accessible enough for a magazine piece context. Nuanced (acknowledging partial correctness).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Expressivism:** Moral statements express non-cognitive attitudes (booing/cheering), not beliefs. Problem: How do they work in logic (Frege-Geach)? Solution (Quasi-realism/Blackburn): Validity is about consistency of attitudes, not truth conditions.
      *   **Julian's Challenge ("Unowned Sentences"):** Machines/institutions produce moral sentences without having attitudes. Expressivism relies on attitude inconsistency for validity. If no agent has attitudes, expressivist validity collapses.
      *   **Nadia's Defense:**
          1.  It's just Frege-Geach again (unasserted contexts). Meaning comes from community practices.
          2.  Institutions/systems can be "commitment-bearers" (functional role).
      *   **Julian's Counter:** If commitments don't require affect/motivation, expressivism loses its distinctive motivation (internalism) and becomes realism.
      *   **Core Tension:** Can expressivism survive without *actual* human psychological states driving the semantics, or does it collapse into a form of realism (or functionalism) when applied to non-agentic systems?

  3.  **Evaluate the 5 Moves:**

      *   **Move 1 (Julian - Unowned Sentences):** Julian identifies a gap. Standard expressivism ties meaning to *speaker* attitude. If there is no speaker (or a speaker with no mind), where is the attitude?
          *   *Verdict:* Strong point. It exposes a limitation in classical expressivism regarding non-agentic sources.
          *   *Rating:* Mostly Right.

      *   **Move 2 (Nadia - Community Inheritance):** Nadia argues meaning is fixed by the community's practices, not the specific token's producer. This is a standard quasi-realist move (language games).
          *   *Verdict:* Plausible, but risks begging the question. If the *users* are also machines, the community shrinks.
          *   *Rating:* Partially Right (standard defense, but strains under the "unowned" weight).

      *   **Move 3 (Julian - Hostage to Non-Existents/Causal Story):** Julian argues that if meaning relies on dead/absent annotators, expressivism becomes a causal history, not a semantic theory. Also, validity shouldn't depend on hypothetical agents.
          *   *Verdict:* Very strong. This hits the "normativity" problem. If no one *can* be incoherent, is there really validity?
          *   *Rating:* Right.

      *   **Move 4 (Nadia - Institutions as Commitment-Bearers):** Nadia expands "agent" to include systems with stable dispositional profiles. This is functionalism.
          *   *Verdict:* Innovative but dangerous for expressivism. It divorces "attitude" from "phenomenology/motivation."
          *   *Rating:* Partially Right (coherent strategy), but risky for the view's core identity.

      *   **Move 5 (Julian - Loss of Internalism):** Julian claims if commitment doesn't imply motivation/affect, expressivism is just realism with extra steps.
          *   *Verdict:* This is the knockout punch *if* one holds internalism as essential to expressivism. Many modern expressivists might concede this, but it changes the view significantly.
          *   *Rating:* Right (diagnostically).

  4.  **Identify What Is Missing (The Synthesis):**
      *   **The Nature of "Meaning":** Both assume meaning must be *either* attitude-based *or* truth-conditional. They miss the possibility of *functional role semantics* that isn't strictly expressivist or realist.
      *   **The User vs. Producer Distinction:** The meaning might reside in the *uptake* by humans, not the production by machines. The machine is a tool, not a speaker.
      *   **The "As-If" Stance:** We treat institutions *as if* they are agents. This is a pragmatic move, not necessarily a semantic one.
      *   **The Writer's Question:** Do they mean the *same* thing? Probably not. They function similarly but lack the "moral force" (motivation) unless a human adopts them.

  5.  **Drafting the Adjudication (Iterative refinement):**
      *   *Introduction:* Acknowledge the depth of the debate. It's a clash between classical metaethics and modern techno-social reality.
      *   *Move-by-Move:* Be precise. Use terms like "internalism," "functionalism," "normative force."
      *   *The "Missing" Section:* This needs to be the most valuable part for the writer. Focus on the shift from *expression* to *regulation*.
      *   *The Conclusion:* Answer the magazine question directly.

  6.  **Refining the Ratings:**
      *   Avoid binary "Right/Wrong." Use "Strategically Sound," "Diagnostically Correct," "Overreaches."
      *   Ensure the distinction between *semantics* (meaning) and *pragmatics* (use) is clear.

  7.  **Addressing the Writer's Core Question:**
      *   The writer asks: "Can sentences issued by committees, protocols, and models be said to mean what our moral sentences mean?"
      *   *Answer:* They have *semantic* content (syntax/logic), but they lack *moral* content (attitude/motivation) unless anchored by a human user. They are "moral-ish" or "normative proxies."

  8.  **Final Polish:** Check tone. Ensure it sounds like a referee report but readable for an intellectual magazine audience. (Self-Correction: Make sure not to get too bogged down in jargon. Explain "internalism" and "quasi-realism" briefly in context.)

      *(Self-Correction during drafting Move 4 analysis)*: Nadia's move to treat institutions as agents is basically "functionalist expressivism." I need to note that this saves the logic but kills the psychology. Julian is right to call this out.

      *(Self-Correction on Move 5)*: Julian's claim that it becomes "realism with deflationary truth" is a common charge against quasi-realism anyway. But here it's sharper because the "attitude" is purely abstract.

      *(Final check on the "Missing" section)*: The key insight is that the *location* of the moral burden has shifted. It's not in the sentence, it's in the human delegation of authority to the sentence.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated dispute that cuts to the bone of contemporary metaethics. Julian and Nadia are fighting over whether expressivism can survive the decoupling of moral language from human psychology. Below is an adjudication of the five moves, followed by an analysis of what is missing and a direct answer to your magazine piece's core question.

  ### Adjudication of the Five Moves

  **Move 1: Julian's "Unowned Sentences"**
  *Julian argues that tokens produced without an agent holding the relevant attitude (e.g., by software or dead annotators) break the expressivist account of validity, which relies on attitude inconsistency.*
  *   **Rating:** **Mostly Right.**
  *   **Justification:** Julian correctly identifies a boundary condition for classical expressivism. If moral meaning *is* the expression of an attitude, a sentence generated without an attitude is, strictly speaking, semantically empty on this view (like a parrot saying "murder is wrong"). He is right that standard quasi-realism struggles to explain the *normative force* of inferences drawn from these tokens if no mind is there to be incoherent. However, he slightly overstates the novelty; this is structurally identical to the problem of "error theory" or "fictionalism," just applied to machines.

  **Move 2: Nadia's "Community Inheritance"**
  *Nadia argues meaning is fixed by community practices, not the specific token's producer; the protocol inherits content from the attitude-holders who built or use the system.*
  *   **Rating:** **Partially Right.**
  *   **Justification:** This is the standard quasi-realist defense (meaning is use within a form of life). It works well for "dead annotators" (we inherit their linguistic practices). However, it strains under the "unowned" weight. If the system operates autonomously and humans merely observe the output without "taking it up" in a committed way, the chain of inheritance is broken. Nadia is right about *how* language usually works, but she assumes a level of human engagement that your case study (automated triage) explicitly removes.

  **Move 3: Julian's "Hostage to Non-Existents"**
  *Julian counters that making validity depend on hypothetical agents turns expressivism into a causal history story, not a semantic one, and leaves actual validity unexplained.*
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is Julian's strongest point. Semantics cannot rely on counterfactual agents ("if someone *were* to use this...") to explain actual validity ("this argument *is* valid"). If the system runs and no human evaluates the consistency of the attitudes, the expressivist account of validity (incoherence of attitudes) has no purchase. Julian correctly diagnoses that Nadia is smuggling in a notion of correctness that exists independently of actual attitudes, which undermines the expressivist project.

  **Move 4: Nadia's "Institutions as Commitment-Bearers"**
  *Nadia proposes that stable institutional dispositions can count as "commitments," allowing for coherence/incoherence without human affect.*
  *   **Rating:** **Strategically Sound, Metaphysically Costly.**
  *   **Justification:** Nadia is trying to functionalize expressivism. She is right that we *treat* institutions as agents (we blame corporations, trust protocols). This saves the logical structure of the argument. However, she is paying a high price: she is redefining "attitude" to mean "functional disposition" rather than "psychological state." This works for logic, but it drifts away from the psychological roots of expressivism.

  **Move 5: Julian's "Loss of Internalism"**
  *Julian argues that if commitments don't require affect or motivation, expressivism collapses into realism with a deflationary theory of truth.*
  *   **Rating:** **Diagnostically Right.**
  *   **Justification:** The original motivation for expressivism was "internalism"—the idea that making a moral judgment *necessarily* provides some motivation to act. If a machine can make a moral judgment without being motivatable, that link is severed. Julian is correct that at this point, the view is no longer distinctively *expressivist*; it is a form of non-cognitivism that has conceded the psychological ground to realism. It becomes a theory about the *grammar* of morality, not the *psychology*.

  ---

  ### What Both Are Missing

  Both philosophers are trapped in a 20th-century framework that assumes moral language must be grounded either in **individual psychology** (expressivism) or **mind-independent facts** (realism). They are missing three crucial dimensions relevant to your piece:

  **1. The Shift from Expression to Regulation**
  Neither considers that institutional moral language may have ceased to be "moral language" in the philosophical sense and has become **regulatory code**. When a hospital protocol says "withhold treatment," it is not expressing an attitude about the value of life; it is executing a constraint. The "validity" Julian worries about isn't logical validity; it's **systemic consistency**. The machine doesn't need to be incoherent; it just needs to be buggy. By trying to force machine output into the box of "moral assertion," they are category-mistaking the technology.

  **2. The Locus of Uptake**
  They argue over the *producer* of the sentence (machine vs. human). They ignore the **recipient**. The moral meaning of a protocol isn't in its generation; it's in its **enforcement and acceptance by a human agent**. A triage algorithm outputs text; a nurse *acts*. The "attitude" required for expressivism isn't in the software; it is in the human who delegates authority to the software. The moral burden hasn't vanished; it has been displaced to the designer and the operator.

  **3. The "As-If" Stance**
  Nadia hints at this, but neither fully grasps the pragmatic reality: We operate these systems using a **fictional stance**. We treat the protocol *as if* it has authority. This doesn't require the protocol to actually have attitudes (refuting Julian's demand) nor does it require us to believe it has moral truth (refuting the realist). It requires a **social contract** to treat the output as binding. The meaning is constituted by our collective agreement to be bound by it, not by the semantic content of the tokens themselves.

  ---

  ### The Verdict for Your Piece

  You asked: *Can sentences issued by committees, protocols, and models be said to mean what our moral sentences mean?*

  **The short answer is No.**

  **The nuanced answer:** They possess **semantic morphology** (they look and act like moral sentences) but lack **moral force** (the connection to motivation and responsibility) unless anchored by a human agent.

  Here is how you should frame the conclusion of your piece, based on this adjudication:

  1.  **Julian wins the metaethics:** He is right that "unowned" sentences break the traditional expressivist link between judgment and motivation. A machine cannot "boo" or "cheer." Therefore, strictly speaking, these tokens are not moral judgments; they are **normative proxies**.
  2.  **Nadia wins the sociology:** She is right that society functions *as if* these tokens have meaning. We treat them as valid. But this is a pragmatic achievement, not a semantic one. We have built a world where moral language operates without moral agents.
  3.  **The Real Crisis:** The danger isn't that the machines are confused about logic (Julian's fear) or that we need to expand our definition of agency (Nadia's hope). The danger is **moral disengagement**. When moral language is decoupled from the capacity to feel the weight of that language, it becomes purely administrative.

  **For your article:** Do not ask if the machines are making moral claims. Ask what happens to the humans who listen to them. The "unowned sentence" is not a philosophical puzzle; it is a mechanism for **responsibility laundering**. The sentence means nothing until a human acts on it, at which point the human absorbs the meaning—and the guilt—while the machine retains the plausible deniability of mere calculation.

  The philosophers are arguing about whether the ghost is in the machine. You should report that the machine was built specifically to ensure there is no ghost, so that no one has to haunt it.
