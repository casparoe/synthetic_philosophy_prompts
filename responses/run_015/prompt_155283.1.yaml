  **JOINT STATEMENT ON THE MECHANISMS OF MORAL REVOLUTION**

  **I. AGREED HISTORICAL CLAIMS**

  Following a rigorous examination of the historical records concerning the abolition of Atlantic slavery and the cessation of aristocratic dueling in Britain, the undersigned parties affirm the following empirical claims. These claims are accepted as the common factual foundation for our divergent explanatory models.

  1.  **Temporal Precedence of Discourse:** In both the case of Atlantic slavery and British dueling, sustained moral criticism and public argumentation against the practice preceded the decisive legislative prohibitions by a significant margin. In neither case did the moral vocabulary emerge solely *post hoc* to justify a completed economic or legal transition.
  2.  **Desuetude Prior to Prohibition:** The frequency of dueling incidents and the volume of the trans-Atlantic slave trade both exhibited measurable declines prior to the passage of the final prohibitory statutes. Legal abolition codified a trend of behavioral abandonment that was already underway among significant segments of the relevant populations.
  3.  **Elite Heterogeneity:** During the transitional periods, economic and social elites were not monolithic. A statistically significant minority of slaveholders and duelists abandoned the practice despite the absence of immediate coercive penalties and, in the case of slavery, often at a demonstrable short-term economic cost. Conversely, a minority of non-participants maintained support for the practice despite the rising social cost of such association.
  4.  **Inefficacy of Early Argument:** Early moral arguments against both practices, though logically consistent with later successful arguments, failed to produce structural change for decades. The content of the moral reasoning remained relatively stable while the social receptivity to that reasoning shifted dramatically.
  5.  **Role of State Power:** In both instances, the final extinction of the practice required state enforcement. Voluntary abandonment reached a plateau that left a residual minority engaging in the practice, necessitating legal intervention to eliminate the remainder.

  **II. DIVERGENT EXPLANATORY THESES AND CRUCES**

  While we agree on the historical trajectory, we disagree on the primary causal mechanism that converted moral argument into social fact. The table below outlines our core positions and identifies three specific cruxes where further evidence could adjudicate between our models.

  | Component | The Structural-Materialist Position (Williams-aligned) | The Honor-Psychological Position (Appiah-aligned) |
  | :--- | :--- | :--- |
  | **Core Thesis** | Moral revolutions are epiphenomenal to shifts in material infrastructure. Practices end when they become incompatible with the dominant mode of production or when the cost of enforcement exceeds the economic utility of the practice. Moral language serves to coordinate collective action once the material incentive to defect has already emerged. | Moral revolutions are driven by changes in the economy of honor. Practices end when they become sources of shame rather than status. Moral language is constitutive of this shift, rewiring the social rewards system such that adherence to the new norm confers prestige and adherence to the old norm confers stigma. |
  | **Crux 1: The Dynamics of Honor** | **Question:** Can a practice collapse solely through the erosion of "first-order honor" (status gained by performing the act), or does it require the rise of "second-order honor" (status gained by publicly repudiating the act)?<br><br>**Test Case:** The decline of dueling among British military officers in the mid-19th century, where professional regulation (material constraint) increased alongside changing public sentiment.<br><br>**Prediction:** We predict that the erosion of first-order honor is sufficient if material penalties rise. The rise of second-order honor is merely a stabilizing feedback loop, not a necessary condition. | **Question:** Can a practice collapse solely through the erosion of "first-order honor," or does it require the rise of "second-order honor"?<br><br>**Test Case:** The decline of dueling among British military officers in the mid-19th century.<br><br>**Prediction:** We predict that erosion of first-order honor is insufficient. The practice only ends when repudiating the duel confers active social credit (second-order honor). Without the status gain of being an "abolitionist of the duel," the practice persists in private spheres. |
  | **Crux 2: The Efficacy of Rhetoric** | **Question:** Can moral rhetoric alone precipitate revolutionary change in the absence of any independent shift in either material interests or honor structures?<br><br>**Test Case:** The period of failed abolitionist petitions in the 1780s versus the successful campaigns of the 1800s, controlling for economic volatility.<br><br>**Prediction:** We predict that rhetoric failed in the 1780s because the material interests of the empire still aligned with slavery. It succeeded later only because the industrial economy no longer required mercantilist slavery. Rhetoric without interest is inert. | **Question:** Can moral rhetoric alone precipitate revolutionary change in the absence of any independent shift in either material interests or honor structures?<br><br>**Prediction:** We predict that rhetoric is the engine that shifts honor structures. The failure in the 1780s was due to the immaturity of the rhetorical framing, not economic timing. When the argument successfully linked the practice to a loss of national character, the honor shift occurred independent of immediate profit calculations. |
  | **Crux 3: Elite Sacrifice** | **Question:** Is elite self-sacrifice best explained by long-term interest calculation or by normative commitment?<br><br>**Test Case:** The acceptance of financial compensation by slaveholders during emancipation versus the refusal of compensation by certain moral abolitionists.<br><br>**Prediction:** We predict that the demand for compensation reveals the true driver: economic settlement. Where compensation was accepted, the transition was a buyout of material assets. Moral commitment is secondary to the settlement of accounts. | **Question:** Is elite self-sacrifice best explained by long-term interest calculation or by normative commitment?<br><br>**Test Case:** The acceptance of financial compensation by slaveholders during emancipation versus the refusal of compensation by certain moral abolitionists.<br><br>**Prediction:** We predict that the refusal of compensation by key figures demonstrates that honor can override interest. The transition was a purification of status; accepting money would have tainted the moral victory. The buyout was a concession to the weak, not the engine of the change. |

  **III. DIAGNOSIS OF VERBAL DISPUTES**

  We acknowledge that a portion of our disagreement stems from terminological elasticity. Specifically, the term "interest" in the Structural-Materialist framework has occasionally drifted toward a psychological definition, wherein any satisfaction gained from moral action is categorized as a "psychic benefit" or "interest." Simultaneously, the term "honor" in the Honor-Psychological framework has occasionally been used interchangeably with "reputation," conflating informal social standing with formal institutional rank.

  To resolve this, we adopt the following stipulations for the remainder of our collaboration:
  1.  **Material Interest:** Defined strictly as the accumulation of tangible resources, capital, or physical security. It excludes psychological satisfaction derived from moral conformity.
  2.  **Honor:** Defined as a currency of social recognition that is distinct from liquidity. It includes both formal rank and informal prestige but must be observable through third-party treatment of the agent (e.g., inclusion, exclusion, deference).

  By separating "tangible resource accumulation" from "social recognition," we ensure that the claim "it was in their interest to abolish slavery" remains falsifiable. If agents abolish slavery while suffering net losses in both tangible resources and social standing, the Materialist thesis is challenged. If agents maintain slavery while suffering net losses in both, the Honor thesis is challenged.

  **IV. CONDITIONS FOR REVISION**

  We conclude by specifying the empirical or conceptual findings that would compel each side to revise or abandon its core position. This commitment is made to prevent the retrospective redefinition of variables to accommodate unfavorable evidence.

  The Structural-Materialist position would be genuinely weakened by the demonstration of a moral revolution occurring in a context where the abolished practice remained highly profitable and structurally integral to the dominant economy, *and* where the agents driving the change possessed no viable alternative economic system to transition into. If abolition occurs not because the system became inefficient, but while the system was at its peak efficiency and without a superior economic alternative ready to replace it, the claim that material shifts drive moral change cannot stand.

  The Honor-Psychological position would be genuinely weakened by the demonstration of a moral revolution where the practice became universally acknowledged as shameful (first-order honor collapsed) yet persisted indefinitely without material coercion, *or* where the practice ended solely through coercive material force without any accompanying shift in social prestige or shame. If a practice dies purely because it is made physically impossible or financially ruinous, while the social status of the practitioners remains intact among their peers, the claim that honor is the primary mechanism is untenable.

  We sign this statement to record our shared commitment to these standards of evidence and argument.
