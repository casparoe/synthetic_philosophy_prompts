answer: |-
  ### Line of Inquiry 1: Principled Permission and the Duty Boundary
  **Context:** Specialists largely agree that moral duties exist and that agents cannot be required to do the logically impossible. However, it is actively disputed whether the boundary between duty and option is sharp or vague, and whether a theory can delineate this boundary without resorting to intuitionism. The challenge is to explain why an agent is *permitted* to omit the best action without rendering morality arbitrary.

  **1. Question:** Consider Mara, the nurse who, after fulfilling her rostered duties during a flood, volunteers for three extra night shifts when a competent substitute is available. Contrast this with Luis, a landlord who forgives back rent at comparable financial cost primarily to ease his own discomfort. If both actions are objectively beneficial and costly to the agent, what principled feature makes Mara's omission permissible but potentially renders Luis's action morally ambiguous, rather than treating both as equally supererogatory?
  *   **Planned Follow-up:** If she replies that motive distinguishes them, ask: "Does this imply that a grudging saint who performs Mara's shifts while resenting the loss of sleep loses the supererogatory status of the act, reducing it to mere optionality?"

  **2. Question:** You argue the permission to omit the best action must be principled rather than ad hoc. In Mara's case, the "competent substitute" detail suggests her extra labor wasn't strictly necessary for the outcome. Does the existence of a substitute ground the permission to omit, or does it merely lower the stakes? If the shelter would have collapsed without her, would her action shift from supererogatory to obligatory?
  *   **Planned Follow-up:** If she argues necessity creates obligation, ask: "If necessity triggers obligation, doesn't that collapse supererogation into duty whenever the stakes are high enough, effectively eliminating the category in crisis scenarios?"

  **3. Question:** To avoid ad hocery, some theorists rely on a "threshold of cost" to mark the limit of duty. Given that Mara's physical exhaustion and Luis's financial loss are qualitatively different, how does your account compare disparate costs to determine where duty ends? Is there a universal currency of sacrifice, or is the duty boundary agent-relative?
  *   **Planned Follow-up:** If she argues for agent-relativity, ask: "If the boundary is agent-relative, does a wealthy person have *more* moral duties than a poor person simply because the cost of donation is lower for them, and is that a result you are willing to endorse?"

  ***

  ### Line of Inquiry 2: The Criteria of Supererogation (Praise, Cost, Motive)
  **Context:** There is consensus that supererogatory acts are characteristically praiseworthy and involve some sacrifice. However, it is actively disputed which of these features is constitutive. Some argue sacrifice is necessary but insufficient; others argue praiseworthiness is a consequence, not a definition. The dispute centers on whether we identify the act first and then praise it, or whether the potential for praise defines the act.

  **4. Question:** Is praiseworthiness a necessary condition for an act to be supererogatory, or is it a reactive attitude we adopt after identifying the act as beyond duty? If we discovered a case where an agent performed a great good at great cost but was not praiseworthy (e.g., they were coerced or ignorant), would the act cease to be supererogatory?
  *   **Planned Follow-up:** If she says praiseworthiness is necessary, ask: "Does this make the ontology of moral acts dependent on the subjective evaluation of observers, rather than the objective features of the action itself?"

  **5. Question:** Returning to Luis: if his primary motive was easing his own discomfort rather than aiding tenants, does this disqualify the act from the extra-duty category? Is it possible to perform a supererogatory action accidentally or for self-regarding reasons, or must the intention be explicitly other-regarding?
  *   **Planned Follow-up:** If she insists on other-regarding intent, ask: "How do we adjudicate mixed motives, such as Mara volunteering both to help victims and to bolster her CV? Does the presence of a self-regarding motive proportionally diminish the supererogatory status?"

  **6. Question:** If cost to the agent is the primary marker of supererogation, how does your account handle the 'Rich Philanthropist' objection? If a billionaire donates a sum that is financially costly but leaves their lifestyle unaffected, is that supererogatory? Does the 'cost' need to be measured in utility, welfare, or subjective hardship?
  *   **Planned Follow-up:** If she measures cost in subjective hardship, ask: "Does this imply that a miser who finds giving $10 agonizing performs a more significant supererogatory act than a generous person giving $10,000 with joy?"

  ***

  ### Line of Inquiry 3: The Tension Between "Best" and "Required"
  **Context:** Specialists agree that maximizing theories (like Act Utilitarianism) struggle to accommodate supererogation, as they equate the optimific act with the obligatory act. It is actively disputed whether "morally best" is a coherent category independent of "morally required." The core pressure point is whether admitting supererogation weakens the normative authority of morality by allowing agents to knowingly choose the lesser good.

  **7. Question:** The central objection to your view is that if an act is truly the *best* from the moral point of view, it generates a decisive reason for action, which looks indistinguishable from a requirement. How do you block the inference from "morally optimal" to "morally mandatory" without rendering the moral point of view optional?
  *   **Planned Follow-up:** If she appeals to personal prerogatives, ask: "If personal prerogatives can override the morally best outcome, does morality lose its claim to be the supreme normative authority over our choices?"

  **8. Question:** Some critics argue that 'supererogation' is merely a label for duties we are too weak to enforce. If we praise Mara because we know we couldn't match her sacrifice, isn't that psychological admiration rather than moral validation? How do you distinguish between 'beyond the call of duty' and 'beyond the call of human capacity'?
  *   **Planned Follow-up:** If she distinguishes capacity from duty, ask: "If it is within Mara's capacity, as evidenced by her doing it, on what grounds do we claim it was beyond her duty other than our reluctance to demand it of others?"

  **9. Question:** If we accept that some best actions are not required, does this create a two-tiered morality where the 'required' is merely the 'good enough'? Does this risk lowering the baseline of moral expectation by legitimizing the omission of the best available action as a matter of right?
  *   **Planned Follow-up:** If she argues it protects agent integrity, ask: "Is the protection of agent integrity a moral value that outweighs the production of the best moral outcome, and if so, isn't that value itself part of the calculation of the 'best' action, reintroducing the requirement?"
