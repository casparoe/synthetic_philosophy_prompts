answer: |-
  This is absolutely philosophy. Specifically, it sits at the intersection of epistemic logic, philosophy of language, and knowledge representation. You are describing a system that lacks a **theory of reference**. It treats the symbols in its database as if they were the objects in the world, rather than pointers to them.

  The two failures are indeed symptoms of the same underlying disease, though they manifest on orthogonal axes. The "Undershoot" is a failure of **Identity**: the system treats two descriptions ("Badge #123" and "Okonjo's Badge") as distinct objects because the strings differ, failing to collapse them into a single referent. The "Overshoot" is a failure of **Existence**: the system treats the absence of a symbol ("No record of fault") as the absence of the object ("No fault occurred").

  In both cases, the system conflates the *map* with the *territory*. It assumes the structure of the record is isomorphic to the structure of reality. In philosophical terms, this is a category error regarding the status of the data. The Undershoot is a failure of **Referential Transparency** (it cannot see through the name to the object). The Overshoot is a failure of **Open-World Assumption** (it assumes the record is exhaustive). While established concepts like *Fregean Opacity* or the *Closed-World Assumption* describe the symptoms individually, they do not capture the unified error: the reification of the record itself.

  The nearest established notion is **Reification** (treating an abstraction as a concrete thing), but in epistemology, this is often too broad. A more precise fit for your specific context—where the *record* is mistaken for the *knowledge state*—is what I will coin below as **Epistemic Reification**. This distinguishes it from simple database errors; it is a logical stance where the medium of recording dictates the ontology of the event.

  Here is the breakdown of candidates against your specific failure modes.

  | candidate | home_field | covers_undershoot | covers_overshoot | where_it_misfits | verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Fregean Opacity** | Philosophy of Language | fits | no | Explains why names don't swap, but says nothing about why missing records count as facts. | drop |
  | **Closed-World Assumption** | Logic Programming | no | fits | Explains the "no row = false" error, but treats identity substitution as trivial (which your system fails). | drop |
  | **Map-Territory Confusion** | General Semantics | fits | fits | A metaphor rather than a mechanism; doesn't distinguish between identity errors and completeness errors. | reshape |
  | **Epistemic Reification** | **Coined (Epistemology/KR)** | **fits** | **fits** | **Nearest confusion is 'Database Realism', which is sociological; this is strictly about the logic of knowledge attribution.** | **keep** |

  ### Epistemic Reification (Coined)

  **Definition:** The logical fallacy wherein the structure, completeness, and terminology of an epistemic record are treated as isomorphic to the state of the world it describes. It occurs when a system assumes that (a) distinct records imply distinct objects (Identity Reification) and (b) absent records imply absent facts (Completeness Reification).

  **Boundary Case:** Consider a system that knows records are incomplete (it answers "unknown" when no fault is recorded, fixing Overshoot) but still cannot link "Badge #123" to "Okonjo" (retaining Undershoot). This is **Referential Opacity**, not full Epistemic Reification. Conversely, a system that links Okonjo to the badge perfectly but assumes missing records are negative facts is suffering from **Naive Realism**. Epistemic Reification requires both: the belief that the *record's vocabulary* defines the *world's objects* AND the *record's silence* defines the *world's emptiness*.
