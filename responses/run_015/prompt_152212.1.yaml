      *   *Positive Liberty (Berlin):* Self-mastery, capacity to act. This is the closest traditional bucket, but often criticized for leading to paternalism. The user's case is about *structural enablement/disablement* of thought, not just capacity.
      *   *Marxist/Ideological Hegemony (Gramsci):* Ruling class ideas. User explicitly excludes intentional enforcement or class dominance.
      *   *Structural Injustice (Young):* This feels very close. Iris Marion Young's work on structural injustice deals with background conditions that constrain agency without specific perpetrators.
      *   *Epistemic Injustice (Fricker):* Specifically *hermeneutical injustice*. This fits the "vocabulary" example perfectly. Lack of resources to understand one's experience.
      *   *Capability Approach (Sen/Nussbaum):* Focus on what people are actually able to do/be. The structure limits capabilities.
