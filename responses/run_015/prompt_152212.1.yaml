      *   **The Phenomenon:** Constraints on action/thought caused by a *distributed background structure* (e.g., absence of technical vocabulary in education) that makes certain alternatives *unthinkable*, without direct interference (Negative) or arbitrary domination (Republican), and without intentional deception/hegemony (Marxist/Critical Theory).
      *   **Key Characteristics:**
          *   No direct interferer (rules out pure Negative Liberty).
          *   No master/dominator (rules out pure Republican Liberty).
          *   No intentional ideology/false consciousness (rules out standard Marxist Hegemony).
          *   Structural curating of the option set/imaginative horizon.
      *   **Questions:** Is there an established concept? If not, how to distinguish it? Does it pose a distinct normative problem?

  2.  **Initial Brainstorming & Concept Mapping:**
