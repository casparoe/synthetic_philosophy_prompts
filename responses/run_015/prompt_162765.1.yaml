answer: |-
  **Confidence Calibration:** The split between accepting or contesting the aim (Node 1) is uncontroversial. The Individual/Institutional distinction (Node 2) is reconstructed; critics often blend them, but separating them clarifies the dialectic. The Epistemic/Incentive split (Node 4) is analytically clean but empirically entangled.

  **The Taxonomy**

  1.  **Does the objection accept impartial outcome maximization as the normative standard?**
      *   **Yes:** Proceed to 2.
      *   **No:** Proceed to 5.

  2.  **Is the failure located in the agent's decision procedure or the movement's institutional structure?**
      *   **Agent:** Proceed to 3.
      *   **Structure:** Proceed to 4.

  3.  **Is the barrier primarily factual uncertainty or causal impotence?**
      *   **Uncertainty:** **Epistemic Skepticism.** *Commitment:* Agents must act on unreliable marginal estimates.
      *   **Impotence:** **Causal Pessimism.** *Commitment:* Individual contribution is negligible. (Unoccupied: Unattractive)

  4.  **Is the problem divided epistemic labor or perverse incentives?**
      *   **Labor:** **Epistemic Division.** *Commitment:* Experts decide without democratic accountability.
      *   **Incentives:** **Incentive Distortion.** *Commitment:* Optimization corrupts the target.

  5.  **Is the competing value grounded in relational duties or alternative goods?**
      *   **Relational:** **Relational Duty.** *Commitment:* Proximity trumps scale.
      *   **Goods:** **Value Pluralism.** *Commitment:* Some goods forbid trade-offs.

  **Locating Your Objections**

  1.  **Counterfactual fragility** lands in **Epistemic Skepticism** (Node 3). It argues that baseline uncertainty renders marginal impact calculations unreliable for the individual allocator.
  2.  **Justificatory inversion** lands in **Epistemic Division** (Node 4). It targets the institutional arrangement where evidence-holders lack decision-power and decision-makers lack evidence.
  3.  **Metric-shifting** lands in **Incentive Distortion** (Node 4). It targets the dynamic feedback where measurement changes the behavior being measured.

  **Unoccupied Cells and Indistinguishable Leaves**

  **Causal Pessimism** (Leaf 3) is unoccupied. *Diagnosis:* Unattractive. It denies agency entirely, undermining the possibility of ethics itself.

  **Relational Duty** and **Value Pluralism** (Leaves 5 & 6) are flagged as indistinguishable. In practice, critics cite relational duties (community, nation) to justify plural values (culture, integrity), making separation artificial.

  **Structural Note:** The Individual/Structure split (Node 2) imposes tidier structure than the literature supports. Objections like **Justificatory Inversion** straddle both: they critique the individual's epistemic position *because* of the institution's structure. I have placed it under Structure because the proposed remedy is institutional reform, not individual epistemic humility. This reconstruction privileges the proposed solution over the immediate complaint to ensure mutually exclusive cells.
