answer: |-
  Galen Strawson's Basic Argument posits that true moral responsibility requires an agent to be *causa sui* (the cause of itself). Specifically, to be responsible for an action, one must be responsible for the mental nature that produced it. Since one cannot choose one's initial nature without already having a nature to make that choice, an infinite regress arises. Neither determinism nor indeterminism solves this; thus, ultimate moral responsibility is impossible for individual human beings.

  When we transpose this argument to collective entities—such as corporations or states—a specific conceptual tension arises that does not exist in the individual case. I call this the **Paradox of Procedural Self-Ratification**.

  ### The Feature: Formalized Self-Amendment
  Unlike individual humans, who are stuck with their biological and psychological starting points, collectives possess institutional mechanisms for **formal self-amendment**. A corporation operates under bylaws that define its "principles of choice." Crucially, these bylaws often include meta-rules allowing the corporation to vote to change the bylaws themselves. Through distributed decision-making protocols (e.g., shareholder votes or board resolutions), a collective can intentionally alter the very structures that govern its future actions.

  ### The Tension: Metaphysical Givenness vs. Procedural Maintenance
  For an individual, "how one is" (one's character, psychology) is a metaphysical given. I cannot vote to change my temperament; I can only act *from* it. Therefore, the Strawsonian regress hits a hard wall immediately: I am not responsible for my nature because I did not choose it.

  For a collective, "how it is" (its charter, bylaws, protocols) is a matter of **procedural maintenance**. If a corporation retains a specific bylaw that authorizes a harmful action, it has technically had the opportunity to amend or repeal that bylaw. By failing to do so, the collective appears to **ratify** its own nature.

  This creates a unique ambiguity when applying Strawson's logic:

  1.  **The Appearance of *Causa Sui*:** Because the collective can vote to change its rules, it looks as though it *chooses* its nature continuously. If Corporation X keeps a rule that leads to Action Y, it seems plausible to say X is responsible for Y because X *chose* to keep the rule that mandated Y. This mimics *causa sui* in a way an individual cannot: the collective converts a state of being (having a nature) into a series of actions (choosing not to change that nature).
  2.  **The Normative Regress:** Strawson's argument still applies, but it shifts from a causal regress to a **normative regress**. To be responsible for keeping the bylaw, the collective must be responsible for the *preferences* that led it to keep the bylaw. Those preferences are determined by the prior version of the bylaws (which dictated how votes are aggregated) and the prior composition of the voters (who are themselves not *causa sui*).

  ### The Specific Conceptual Issue
  The paradox lies in the **decoupling of authority across time**. In the individual case, the agent who acts at Time 2 is the same biological substance that had the nature at Time 1. In the collective case, the "agent" at Time 2 (the current board/shareholders) may be entirely different people than the agent at Time 1 (the founders who wrote the charter).

  If we apply Strawson strictly, the current collective cannot be responsible for the charter it inherited, just as an individual is not responsible for their genetics. However, because the collective has the *power* to amend the charter, we are tempted to say it *adopted* the charter by inertia. This creates a **Responsibility Gap**:

  *   If we say the collective is **not responsible** (because the charter was inherited from non-*causa-sui* founders), we ignore the collective's unique capacity for self-revision.
  *   If we say the collective **is responsible** (because it failed to amend the charter), we treat institutional inertia as a meaningful choice. But Strawson would argue this "choice" is determined by the very nature the collective is supposed to be responsible for.

  Thus, the collective organization creates an illusion of self-creation through **legal continuity**. The entity persists legally even as its human constituents and specific rules change. This allows the collective to claim it "made itself" what it is through accumulated amendments, masking the infinite regress of authority that Strawson identifies. The tension is that the collective's structural ability to revise its own "nature" makes the failure of *causa sui* less obvious, yet metaphysically just as fatal, as in the individual case.
