  **Section Plan: The Colour Phi Phenomenon (50 Minutes)**

  **1. Sequence and Load-Bearing Claim (0–15 minutes)**
  *   **0–5 min: Confirm the Phenomenon.** Briefly visualize the display from their handout (Red spot, Green spot, short interval). Ask for a show of hands: "Who saw a moving spot changing color?" Confirm the *report* is uniform.
  *   **5–10 min: Introduce the Labels.** Define the terms using the handout's names but anchor them with mnemonics.
      *   **Stalinesque:** The brain fabricates the show *before* it reaches consciousness (like a scripted show trial).
      *   **Orwellian:** The brain revises the memory *after* consciousness (like rewriting history in *1984*).
      *   *[Guess: Students will intuitively prefer Stalinesque as "hallucination" and Orwellian as "lying." Correct this immediately: both are about neural processing, not subject dishonesty.]*
  *   **10–15 min: Establish the Load-Bearing Claim.** Ask: "Based on what the subject *says* they saw, can we tell which story is true?" Elicit the realization that the report is identical.
      *   **Verdict:** Everything else depends on establishing that **both stories predict identical subjective reports.** If the reports differed, we could just ask the subject. Because they don't, we have a philosophical puzzle, not a data error.

  **2. The Carrying Case (15–25 minutes)**
  *   **Choice:** The **bare two-spot display** (as described in their handout).
  *   **Rationale:** Using the variant (random event) risks overloading first-years with experimental mechanics when the core difficulty is the conceptual distinction. Aligning with their prep reduces cognitive load.
  *   **Must Contain:** The invariant verbal report (one moving spot, mid-path color change). This invariant is the only data we have.
  *   **Must Not Contain:** Any suggestion that one story is the "default" or "common sense" explanation. Present them as symmetrical explanatory options.
  *   **Head Off Misconception 1 (Label Mixing):** At minute 5, use the mnemonics (Stalin=Scripted/Fake Early; Orwell=Rewritten/Late). Check understanding with a quick poll: "If the brain waits for all data then plays the movie, is that Orwell or Stalin?" (Answer: Stalin).
  *   **Head Off Misconception 2 (Experience Differs):** At minute 12, explicitly state: "The subject feels the same way in both stories." If they argue one feels "more real," stop them: "We only have the report."

  **3. The Neural Signature Question (25–35 minutes)**
  *   **Placement:** Immediately after establishing behavioral indistinguishability. This is where the distinction matters scientifically.
  *   **Activity:** Ask: "If we had a perfect brain scanner, what would we look for to decide?"
  *   **Head Off Misconception 3 (Decisive Experiment):** Students will suggest timing neural activity (e.g., "Find when color is processed").
      *   **Intervention:** Explain that finding a neural timestamp doesn't solve it. If we find color processing at 100ms, the Stalinesque says "Consciousness happened at 100ms." The Orwellian says "Consciousness happened at 200ms, using the 100ms data." The neural data fits *both* stories depending on when you label activity "conscious."
  *   **Head Off Misconception 4 (Motion Not Really Seen):** Students may claim "The motion is an illusion, so it wasn't really seen."
      *   **Intervention:** Clarify that "illusion" refers to the world, not the experience. The experience of motion is real; the question is *when* that experience was constructed.

  **4. What to Leave Out (35–40 minutes)**
  *   **Content:** Dennett's full "Multiple Drafts" model of consciousness.
  *   **How to Frame It:** "We are leaving out Dennett's solution not because it is unimportant, but because we need to feel the knot before we cut it. Today is about diagnosing the puzzle, not solving consciousness entirely."
  *   **Avoid the Shrug:** Emphasize that recognizing the indistinguishability *is* the progress. It changes how we design experiments (looking for processes, not "the moment of consciousness").

  **5. Closing Question (40–50 minutes)**
  *   **Discussion:** Small group discussion (5 mins) followed by share-out.
  *   **The Question:** "If neuroscience pinpointed the exact millisecond the brain encoded the color, does that prove the Stalinesque story?"
  *   **Success Criteria:** I am looking for answers that say "No, because encoding isn't consciousness," or "No, because the Orwellian story just says that encoding was revised later." If they say "Yes, because data proves it," the distinction hasn't landed.
  *   *[Guess: Students will initially vote "Yes, data proves it." I will need to push them to see that 'consciousness' is the variable, not the neural spike.]*

