answer: |-
  Here is the honest assessment first: Your objection is physically correct. In fundamental classical mechanics (Hamiltonian dynamics), phase-space volume is conserved (Liouville's Theorem), and the laws are time-reversible. If "knowing the laws exactly" means knowing the microphysical laws and "present state" means the complete microstate (including every phonon and air molecule), then the past *is* in principle recoverable. Your friction case fails at the fundamental level because the "missing" information is merely hidden in the thermal degrees of freedom you excluded.

  To make the case work for a first-year discussion, you must drop the clause implying **Fundamental Microphysical Completeness**. You must instead frame the scenario within **Effective Macroscopic Physics**. In the special sciences (and ordinary life), we treat macroscopic objects as systems governed by deterministic but dissipative laws. Here, determinism (unique future) does not entail reversibility (unique past). This distinction is the pedagogical goldmine: it separates Laplacean Determinism from Time-Reversibility.

  Below is the repaired case, built on this explicit distinction.

  ### The Scenario
  An insurance adjuster stands in a jewellery store. A heavy safe sits at rest on the linoleum floor, five metres from the display counter. The store's security logs confirm the safe was locked to the counter at 9:00 AM and found here at 9:15 AM. The adjuster needs to know if the safe was shoved violently (indicating a forced entry attempt) or slid gently (indicating an inside job). The macroscopic laws governing the safe's motion are known: it is a rigid body subject to constant kinetic friction. The adjuster measures the safe's current position and velocity exactly: it is at rest, $v=0$. Despite knowing the laws and the current state to arbitrary precision, the adjuster cannot calculate the initial shove. A violent shove from ten metres away and a gentle nudge from one metre away both result in the exact same final state: the safe at rest, five metres from the counter.

  ### The Check
  *   **Present State:** The system is defined by the safe's macroscopic position $x$ and velocity $v$. At time $t_{now}$, $x = 5\text{m}$ and $v = 0\text{m/s}$.
  *   **Compatible Pasts:** Any initial state $(x_0, v_0)$ such that the work done by friction equals the initial kinetic energy is compatible. There is a continuous infinity of such pairs (e.g., high $v_0$ from far away, low $v_0$ from nearby).
  *   **Why Precision Fails:** Increasing precision on the *current* state ($v=0.000000...$) does not collapse the set of pasts. Because the dynamics are dissipative, distinct trajectories merge into the same final point. The mapping from Past States to Present State is **many-to-one**.
  *   **Future Predictability:** The future is perfectly determined. Given $v=0$ and static friction exceeding any residual force, the safe remains at $x=5\text{m}$ for all $t > t_{now}$. There is no branching of futures.
  *   **Why It Isn't Chaos:** Chaos involves the exponential *divergence* of nearby trajectories (sensitive dependence). This case involves the exponential *convergence* of distant trajectories onto a single point (an attractor). Rounding errors do not explode; they vanish.

  ### The Load-Bearing Feature
  The feature doing all the work is **Dissipation** (specifically, non-invertible dynamics).
  *   **What it does:** It removes energy from the defined system, causing distinct initial states to converge on the same final state.
  *   **If Removed:** If you remove friction (make the floor frictionless), the system becomes conservative. The safe would slide forever at constant velocity. Observing the current velocity and position would allow you to integrate backwards uniquely to the origin. The past becomes recoverable.

  ### The Strongest Objection
  A committed Laplacean Determinist will argue: "You have defined the 'System' arbitrarily. The energy didn't vanish; it became heat in the floor. If the reasoner truly knows the *complete* state of the universe (including the thermal vibration of the floorboards), the laws are reversible. The heat pattern uniquely encodes the speed of the safe. Therefore, the past *is* determined; you have merely imposed an artificial ignorance by restricting the state to macroscopic variables."
  *   **Response:** This objection conflates **Fundamental Determinism** with **Macroscopic Determinism**. For the purposes of forensic science, insurance, and ordinary objects, the macroscopic state *is* the relevant state. The case demonstrates that even if the world is fundamentally reversible, effective deterministic laws in the special sciences can be historically underdetermined.

  ### Terminology and Boundaries
  *   **Settled Name:** **Irreversibility** (in deterministic systems) or **Non-Invertible Dynamics**.
  *   **Neighbouring Notions:**
      *   **Determinism:** Uniqueness of the *future* given the present. (Preserved in this case).
      *   **Reversibility:** Uniqueness of the *past* given the present. (Violated in this case).
      *   **Chaos:** Sensitive dependence on initial conditions. (Distinct from this case; chaos is reversible in principle, this is not).
      *   **Indeterminism:** Branching *futures*. (Distinct; the future here is unique).
  *   **Boundaries:** The phenomenon stops where energy conservation holds (Hamiltonian systems). It applies strictly to open or dissipative systems where degrees of freedom are excluded from the state description. It is not "randomness"; it is structural information loss.

  \answer{Dissipative dynamics erase history}
