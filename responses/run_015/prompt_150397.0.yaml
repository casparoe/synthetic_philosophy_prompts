prompt: |-
  I'm writing up my position on cooperation for a reading group in philosophy of biology, and before I present it I want someone to check whether the package actually holds together. Here is where I think I stand:

  (1) In a one-shot prisoner's dilemma against a stranger — including a stranger I have good reason to think reasons about the situation roughly as I do, as long as our two choices are causally independent of one another — defection is the uniquely rational act. The dominance argument is decisive, and I don't think indirect or "be the sort of person who..." moves change that.

  (2) In an iterated prisoner's dilemma of known, finite length, I reject the backward-induction conclusion. I'd cooperate for most of the game, and I treat the unraveling argument as telling us that something in the standard setup is wrong, not as advice about what to do.

  (3) The main evolutionary explanation of cooperation among non-kin is reciprocity: direct reciprocity first, indirect reciprocity through reputation second. And I want this to be real altruism in the following sense — the cooperative act leaves the actor worse off, and the correct explanation of why it happens is not that the actor is pursuing its own long-run interest.

  (4) In the indefinitely repeated game, the folk theorems mean the structure of the game by itself can't tell us which equilibrium will get played; that is an equilibrium-selection question, and the evidence that does the work there — the early computer tournaments, evolutionary simulations — is empirical rather than a matter of the solution concept.

  (5) In a one-shot prisoner's dilemma between two agents who know they are near-copies of each other, cooperation is rational for each: if I defect, so does she, and that reasoning is sound in that case.

  (6) All of this bears on why we have the moral intuitions we have — about fairness, desert, cheat detection — but on whether those intuitions are correct it has nothing to say.

  Please audit this set. Which pairs are genuinely in tension and how badly, which only look like they are, and for each real tension what the least costly revision would be and what it would cost me. I suspect (1) and (5) are the live pair, but I'm not confident I've located the real problem, and I don't know which commitment I'd give up. Rank the tensions by severity, say which single revision would clean up the most, and tell me if any part of the trouble is only about words. Finally, mark clearly which of your claims are settled as far as people who work on this are concerned and which are genuinely contested — I don't want to present a contested position as the consensus.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's position:

  1.  **Analyze the Request:**
      *   **Task:** Audit a set of six philosophical/biological claims regarding cooperation, Prisoner's Dilemma (PD), and rationality.
      *   **Goal:** Check for internal consistency (does the package hold together?), identify tensions (real vs. apparent), suggest revisions (cost/benefit), rank tensions by severity, identify verbal disputes, and distinguish between consensus and contested views in the field.
      *   **Context:** Philosophy of biology reading group presentation.
      *   **User's Stance:** A mix of causal decision theory (CDT) in one-shot cases, rejection of backward induction in finite iterated cases, evolutionary altruism focus, equilibrium selection empiricism, evidential/superrational reasoning in copy cases, and moral non-naturalism/isolation.

  2.  **Analyze the Six Claims:**

      *   **(1) One-shot PD (Strangers, Causal Independence):** Defection is uniquely rational. Dominance argument holds. Rejects "be the sort of person" (dispositional) arguments.
          *   *Philosophical Label:* Causal Decision Theory (CDT).
          *   *Consensus:* Highly contested. CDT is standard in econ/game theory, but many philosophers (especially in this context) argue for Evidential Decision Theory (EDT) or Functional Decision Theory (FDT).
      *   **(2) Finite Iterated PD:** Rejects backward induction (unraveling). Cooperates most of the way. Treats unraveling as a reductio of the setup, not advice.
          *   *Philosophical Label:* Rejecting Common Knowledge of Rationality (CKR) or allowing for uncertainty/error (Kreps et al. "Gang of Four").
          *   *Consensus:* Standard game theory says defect always. Behavioral game theory says people cooperate. Philosophically, rejecting CKR is a common move to save cooperation.
      *   **(3) Evolution of Cooperation:** Reciprocity (direct/indirect). Claims this is *real altruism* (actor worse off, not pursuing long-run interest).
          *   *Philosophical Label:* Biological Altruism vs. Psychological Altruism.
          *   *Consensus:* Biologically, reciprocity is often classified as *mutualism* or "enlightened self-interest" in the long run, not true altruism (fitness cost without return). Claiming reciprocity is *not* pursuing long-run interest contradicts the standard evolutionary explanation of reciprocity (which relies on long-run payoff).
      *   **(4) Indefinitely Repeated PD:** Folk theorems = underdetermination. Equilibrium selection is empirical (simulations, etc.).
          *   *Philosophical Label:* Equilibrium Selection Problem.
          *   *Consensus:* Generally accepted. Folk theorems do show multiple equilibria. How selection happens is an open empirical/theoretical question.
      *   **(5) One-shot PD (Near-Copies):** Cooperation is rational. If I defect, she defects.
          *   *Philosophical Label:* Evidential Decision Theory (EDT) or Superrationality (Hofstadter) or Functional Decision Theory (FDT).
          *   *Consensus:* Highly contested. Contradicts CDT (Claim 1).
      *   **(6) Moral Intuitions:** Explains origins (evolution), says nothing about correctness (normative ethics).
          *   *Philosophical Label:* Evolutionary Debunking Argument (EDA) / Is-Ought Gap.
          *   *Consensus:* Standard meta-ethical caution. Widely accepted as a logical point, though some argue evolution *does* undermine realism.

  3.  **Identify Tensions:**

      *   **Tension A: (1) vs. (5).** This is the big one.
          *   (1) says CDT (causal independence $\rightarrow$ defect).
          *   (5) says EDT/FDT (logical correlation $\rightarrow$ cooperate).
          *   *Conflict:* Why does causal independence matter in (1) but logical correlation matter in (5)? If the reasoning in (5) is sound ("if I defect, so does she"), why doesn't it apply to (1) if there's *any* correlation? The user specifies "causally independent" in (1) and "near-copies" in (5).
          *   *Severity:* High. This is the core decision theory split.
      *   **Tension B: (2) vs. (1).**
          *   (1) relies on dominance/rationality.
          *   (2) rejects backward induction (which relies on dominance/rationality at the last step).
          *   *Conflict:* If dominance is decisive in (1), why does it fail at the last step of (2)? Usually, rejecting backward induction requires admitting uncertainty about the *other's* rationality (Gang of Four). If the other is rational (like in 1), unraveling holds.
          *   *Severity:* Medium-High. Needs a story about *why* backward induction fails (e.g., uncertainty about rationality).
      *   **Tension C: (3) vs. Standard Evolutionary Theory.**
          *   (3) claims reciprocity is *not* pursuing long-run interest.
          *   *Standard View:* Reciprocity *is* explained by long-run interest (fitness benefits). If it costs fitness net, it doesn't evolve via reciprocity.
          *   *Conflict:* The user wants "real altruism" but uses "reciprocity" as the mechanism. Reciprocity is usually the *alternative* to altruism in biology.
          *   *Severity:* High (Conceptual confusion risk).
      *   **Tension D: (6) vs. The Rest.**
          *   (6) says science tells us nothing about normativity.
          *   (1) & (5) make strong claims about what is *rational*.
          *   *Conflict:* Is "rational" a normative claim? If so, (6) might undercut the force of (1) and (5). However, usually "rationality" in game theory is instrumental, while "moral correctness" in (6) is normative.
          *   *Severity:* Low (Manageable distinction).

  4.  **Drafting the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the position. It's a coherent "CDT + Evolutionary Realism + Meta-ethical Quietism" package, but with specific friction points.
      *   **Section 1: The Decision Theory Split (1 vs. 5).**
          *   This is the Newcomb/Parfit problem.
          *   (1) is CDT. (5) is EDT/FDT.
          *   *Consensus:* This is *not* settled. CDT is dominant in econ, but (5) is gaining traction in AI safety/rationality communities (MIRI). In philosophy of biology, the "copy" case is often treated as a special case of correlation.
          *   *Resolution:* Stick with CDT but treat (5) as a special case of *causal* connection (if copies, my computation causes hers)? Or admit (5) requires a different decision theory.
      *   **Section 2: The Backward Induction Puzzle (1 vs. 2).**
          *   If (1) is true (dominance is decisive), then at step $N$ of (2), dominance applies.
          *   To save (2), you need the "Gang of Four" model (Kreps, Milgrom, Roberts, Wilson). You need uncertainty about the *type* of the opponent.
          *   *Consensus:* Unraveling is the Nash Equilibrium solution. Cooperation is a Bayesian Equilibrium with incomplete information.
      *   **Section 3: The Definition of Altruism (3).**
          *   This is the biggest biological red flag.
          *   Reciprocity = Mutualism (long term gain). Altruism = Net cost.
          *   If the user insists reciprocity is altruism, they are fighting the biological definition.
          *   *Revision:* Distinguish *psychological* altruism (motivation) from *biological* altruism (fitness).
      *   **Section 4: Consensus vs. Contested.**
          *   (1) Contested (CDT vs EDT).
          *   (2) Contested (Nash vs. Behavioral).
          *   (3) Contested/Incorrect (Biological definition).
          *   (4) Consensus (Folk theorems).
          *   (5) Contested (Superrationality).
          *   (6) Consensus (Is-Ought).

  5.  **Refining the Advice:**

      *   *Ranking:* (3) is the most dangerous for a *biology* reading group (terminological error). (1)/(5) is the deepest philosophical tension. (1)/(2) is the most technical game-theoretic tension.
      *   *Verbal Disputes:* Much of (3) is verbal (definition of altruism). Much of (1)/(5) depends on the definition of "rational" (causal vs. evidential).
      *   *Single Revision:* Clarify (3) to distinguish motivational altruism from fitness altruism. This prevents biologists from dismissing the whole talk on a definition.
      *   *Decision Theory:* The user needs to own the CDT vs. EDT split. They can't have (1) and (5) without explaining *why* the logic changes. The "causal independence" clause in (1) is the key. In (5), are they causally independent? If they are perfect copies running the same algorithm, is there a causal link? (FDT says yes, CDT says no). The user needs to specify *why* (5) allows cooperation. Is it because they are *causally* linked via a common cause (the source code)? If so, (1) remains safe.

  6.  **Final Polish:**
      *   Ensure tone is constructive but rigorous.
      *   Make sure to highlight what is standard game theory vs. philosophical interpretation.
      *   Address the "real altruism" claim carefully, as Trivers (1971) is the bible here, and he calls it reciprocal *altruism*, but the *mechanism* is selfish genes. The user's claim "not pursuing long-run interest" is the weak point.

  7.  **Self-Correction/Review during drafting:**
      *   *Wait, check (3) again.* "correct explanation... is not that the actor is pursuing its own long-run interest." This is actually a claim about *proximate* vs. *ultimate* causation. The user might mean the *psychological* motivation isn't self-interest, even if the *evolutionary* cause was fitness. I need to clarify this distinction. If they mean ultimate explanation, they are wrong about reciprocity. If they mean proximate, they are right but need to say so.
      *   *Check (1) vs (5) again.* If I am a copy, my decision doesn't *cause* hers. We share a cause. CDT says ignore the correlation. EDT says condition on it. The user accepts (5), so they are implicitly endorsing EDT or FDT in that specific case but CDT in (1). This is the "Why aren't you rich?" objection territory. I need to point out that holding both requires a specific distinction (causal vs. logical dependence).

  8.  **Final Structure:**
      *   Executive Summary.
      *   Tension Analysis (Ranked).
      *   Consensus/Contested Map.
      *   Verbal vs. Substantive.
      *   Recommended Revisions.

  *(Self-Correction on Consensus)*: Be careful not to say CDT is "consensus." In philosophy, it's heavily debated. In economics, it's standard. In biology, they care about fitness outcomes, not decision theory labels. I need to be precise about *which* community's consensus I'm referencing.

  *(Refining the Altruism point)*: Trivers coined "Reciprocal Altruism." So the term is used. But the *mechanism* is long-term benefit. The user says "not... pursuing long-run interest." This is the contradiction. Reciprocity *is* the pursuit of long-run interest (evolutionarily). I must highlight this.

  *(Refining the Backward Induction)*: The "Gang of Four" solution is the standard way to reconcile (1) and (2). I should explicitly name-drop Kreps et al. (1982).

  Okay, ready to write.s
answer: |-
  This is a sophisticated and largely coherent package, but it sits on several fault lines that are well-known in the literature. You have constructed a position that blends **Causal Decision Theory (CDT)** with **Evolutionary Explanations of Normativity**, while making specific exceptions for **Logical Correlation** and **Finite Iteration**.

  Below is an audit of the internal tensions, the state of consensus in the field, and recommendations for revision.

  ### Executive Summary
  Your position is internally consistent *if* you maintain a strict distinction between **causal independence** (Claim 1) and **logical/common-cause dependence** (Claim 5), and if you clarify the sense of "interest" in Claim 3. However, Claim 3 is currently phrased in a way that will invite immediate rejection from evolutionary biologists, and Claims 1 & 2 require a specific game-theoretic justification to avoid looking like an ad hoc exception.

  **The single most costly revision:** Clarifying Claim 3 (Altruism).
  **The deepest philosophical tension:** Claims 1 vs. 5 (Decision Theory).
  **The most dangerous technical error:** Claim 2 (Backward Induction) without invoking incomplete information.

  ---

  ### 1. Tension Audit (Ranked by Severity)

  #### **Tension 1: The Definition of Altruism (Claim 3)**
  *   **The Conflict:** You claim reciprocity is "real altruism" because the actor is "not pursuing its own long-run interest." In evolutionary biology, **reciprocity is the paradigmatic explanation for how cooperation evolves *without* altruism.** Reciprocal cooperation is selected for precisely because it *does* serve the actor's long-run genetic interest (fitness). If an act reduces net fitness, reciprocity cannot explain its evolution.
  *   **Severity:** **Critical.** In a philosophy of *biology* group, this distinction is foundational. If you mean *psychological* motivation (proximate), you are safe. If you mean *evolutionary function* (ultimate), you are contradicting the standard model (Trivers, 1971; Axelrod, 1984).
  *   **Verbal or Substantive?** Mostly verbal, but high stakes. You are conflating *proximate motivation* (why the agent feels they should cooperate) with *ultimate explanation* (why the trait exists).
  *   **Least Costly Revision:** Distinguish proximate vs. ultimate.
      *   *Revision:* "Reciprocity explains the *evolution* of cooperation via long-run fitness benefits, but the *proximate mechanism* (the psychology) involves genuine altruistic motivation that does not calculate long-run interest in the moment."
      *   *Cost:* You lose the punchy claim that reciprocity *is* real altruism in the evolutionary sense. You gain biological credibility.

  #### **Tension 2: Decision Theory Consistency (Claim 1 vs. Claim 5)**
  *   **The Conflict:** Claim 1 endorses **Causal Decision Theory (CDT)** (ignore correlations, look at causal impact). Claim 5 endorses **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)** (your choice is evidence of, or functionally linked to, the other's).
      *   In (1), you say causal independence makes defection rational.
      *   In (5), you imply logical dependence makes cooperation rational.
      *   *The Problem:* Why does the logic change? If the "copy" case is just a limit case of correlation, a CDT proponent says you should still defect in (5) because your button press doesn't *cause* theirs (a common cause does). An EDT proponent says you should cooperate in (1) if there's *any* reason to think you're similar.
  *   **Severity:** **High.** This is the core Newcomb/Parfit problem. Holding both without explanation looks like inconsistency.
  *   **Consensus Status:** **Deeply Contested.** CDT is standard in economics; EDT/FDT has traction in philosophy and AI safety. There is no consensus.
  *   **Least Costly Revision:** Explicitly ground the distinction in **causal structure**.
      *   *Revision:* "In (1), the causal graph is disconnected. In (5), the agents share a common cause (source code/psychology) that makes the outputs functionally dependent, effectively creating a causal link in the decision algorithm (FDT) or a high-evidential correlation that outweighs the dominance argument (EDT)."
      *   *Cost:* You must defend why functional dependence counts for rationality in (5) but causal independence counts in (1). This invites the "Why aren't you rich?" objection (CDT agents often do better in Newcomb-like problems).

  #### **Tension 3: Backward Induction (Claim 1 vs. Claim 2)**
  *   **The Conflict:** Claim 1 says dominance is decisive. In a finite iterated PD, the last round is a one-shot PD. By Claim 1, you must defect in the last round. If you must defect in the last round, the second-to-last becomes a one-shot, and so on (unraveling). Claim 2 rejects this.
  *   **Severity:** **Medium-High.** You cannot simply "reject" backward induction if you accept Claim 1. You need a mechanism that breaks the Common Knowledge of Rationality (CKR).
  *   **Consensus Status:** **Contested but Resolved Technically.** The standard game-theoretic solution to save cooperation in finite games is the **"Gang of Four" model (Kreps, Milgrom, Roberts, Wilson, 1982)**. It shows that if there is even a tiny probability the opponent is *not* rational (e.g., a "Tit-for-Tat" type), cooperation is rational for the rational player to maintain a reputation.
  *   **Least Costly Revision:** Cite incomplete information.
      *   *Revision:* "I reject the backward induction conclusion because the standard setup assumes Common Knowledge of Rationality. In real contexts, uncertainty about the opponent's type (are they a maximizer or a reciprocator?) makes cooperation the rational utility-maximizing strategy for most of the game."
      *   *Cost:* You concede that cooperation in (2) is actually driven by long-run interest/reputation, which puts pressure on Claim 3 (see Tension 1).

  #### **Tension 4: Normative Isolation (Claim 6)**
  *   **The Conflict:** Claim 6 says science tells us nothing about moral correctness. But Claims 1 & 5 make strong claims about what is **rational**. Is rationality normative?
  *   **Severity:** **Low.** This is manageable.
  *   **Resolution:** Distinguish **Instrumental Rationality** (means-end efficiency, which 1 & 5 address) from **Moral Normativity** (what one ought to do, which 6 addresses).
  *   **Consensus Status:** **Mostly Consensus.** The Is-Ought gap is standard, though some (e.g., ethical naturalists) dispute it.

  ---

  ### 2. Consensus vs. Contested Map

  When presenting, you must signal where you are departing from standard models.

  | Claim | Status in Field | Notes |
  | :--- | :--- | :--- |
  | **(1) One-shot Defect (CDT)** | **Contested** | Standard in Econ/Game Theory. Heavily debated in Philosophy (EDT/FDT proponents). |
  | **(2) Finite Iteration** | **Contested** | Nash Equilibrium = Defect always. Behavioral/Bayesian Equilibrium = Cooperate. You need the "Gang of Four" citation to be taken seriously. |
  | **(3) Reciprocity = Altruism** | **Incorrect/Contested** | Biologists define Reciprocity as Mutualism (long-term gain). "Reciprocal Altruism" is a historical term (Trivers), but the mechanism is selfish. |
  | **(4) Folk Theorems** | **Consensus** | Widely accepted that equilibrium selection is underdetermined by theory alone. |
  | **(5) Copy Cooperation** | **Contested** | "Superrationality" (Hofstadter) or FDT (Yudkowsky/Soares). Rejected by standard CDT. |
  | **(6) Is-Ought Gap** | **Consensus** | Standard meta-ethical caution, though Evolutionary Debunking Arguments are a live sub-debate. |

  ---

  ### 3. Recommended Revisions (In Order of Priority)

  #### **Priority 1: Fix Claim 3 (The Biology)**
  *   **Current:** "The correct explanation... is not that the actor is pursuing its own long-run interest."
  *   **Problem:** This is biologically false for reciprocity. Reciprocity *is* the pursuit of long-run interest.
  *   **Fix:** "The *evolutionary* explanation relies on long-run fitness benefits, but the *psychological* implementation involves motives that do not calculate those benefits. This allows for real altruism at the level of motivation, even if the trait was selected for mutual benefit."
  *   **Why:** This prevents biologists in the room from dismissing your entire talk on a definition.

  #### **Priority 2: Fortify Claim 2 (The Game Theory)**
  *   **Current:** "I treat the unraveling argument as telling us that something in the standard setup is wrong."
  *   **Problem:** Too vague. Sounds like you are ignoring math.
  *   **Fix:** "The unraveling argument relies on Common Knowledge of Rationality. Once we introduce realistic uncertainty about the opponent's decision procedure (the 'Gang of Four' result), cooperation becomes the rational equilibrium for most of the game."
  *   **Why:** This aligns (2) with (1). It shows you aren't rejecting dominance, but rejecting the *informational assumptions* required to apply dominance recursively.

  #### **Priority 3: Clarify Claim 1 vs. 5 (The Decision Theory)**
  *   **Current:** (1) says causal independence implies defect; (5) says copy status implies cooperate.
  *   **Problem:** Needs a bridge.
  *   **Fix:** Explicitly state that you are a **Causal Decision Theorist** who acknowledges that "copies" introduce a **logical constraint** that functions like a causal link (Functional Decision Theory) OR admit that (5) is a case where you switch to Evidential reasoning because the correlation is nomologically necessary.
  *   **Why:** If you don't explain *why* the reasoning changes, it looks like special pleading.

  ### 4. Is Any of This Just Words?

  *   **Altruism (Claim 3):** Yes, largely. If you mean "Does the agent feel selfless?" (Yes) vs. "Did the gene spread because it was selfless?" (No). Be precise.
  *   **Rationality (Claim 1 & 5):** Yes, largely. This is the CDT vs. EDT war. If you define "rational" as "maximizing causal impact," (1) wins. If you define it as "maximizing expected utility given all evidence," (5) wins. Acknowledge this definition dependence.
  *   **Equilibrium (Claim 4):** No, this is mathematical. Folk theorems are settled math.

  ### 5. Final Strategy for the Reading Group

  1.  **Open with Claim 4:** It's the least controversial and sets the stage (biology helps with equilibrium selection).
  2.  **Address Claim 3 Early:** Define "Altruism" carefully (Proximate vs. Ultimate) to avoid getting bogged down in semantics later.
  3.  **Present (1) and (5) as a Unified Decision Theory:** Don't present them as contradictory impulses. Present them as: "I follow causal dominance *unless* the agents are logically linked, in which case the decision algorithm itself is the unit of selection."
  4.  **Use the "Gang of Four" for Claim 2:** This shows you know the literature and aren't just intuitively rejecting backward induction.
  5.  **Close with Claim 6:** Keep the normative question separate to avoid the Naturalistic Fallacy.

  **Summary Verdict:** The package holds together *if* you tighten the biological definitions and cite the Bayesian solution to finite iteration. Without those tweaks, Claim 3 will be rejected as biologically illiterate, and Claim 2 will be rejected as game-theoretically naive. Claim 1 vs. 5 is a legitimate philosophical stance, provided you own the decision-theoretic commitment.
