  3. "Some say Nozick only proves one step is okay, not the whole staircase. It's like saying 'It's safe to step off the curb' proves 'It's safe to walk into traffic.' Just because one fan giving a quarter is fine, doesn't mean millions doing it creates a just outcome. The induction is doing all the work, like assuming that because one beer is harmless, alcoholism is a liberty right."
