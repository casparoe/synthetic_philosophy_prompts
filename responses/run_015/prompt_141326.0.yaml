answer: |-
  **MEMORANDUM**

  **TO:** Chair, Northern Shelf Authority
  **FROM:** Scientific Secretary
  **RE:** Decision Framework and Prediction for C/2026

  **1. Reconstructed Rules**
  Based on the track record, three candidate rules emerge:
  *   **Rule 1 (Irreversibility Bar):** Refuse any action where a credible threat of irreversible ecological change exists and mitigation relies on biological warranties rather than physical removal. (Strains A/2021, where biological cull was approved adaptively).
  *   **Rule 2 (Adaptive Staging):** Approve uncertain interventions if monitorable with enforceable stop rules; refuse if monitoring fails to trigger stops. (Strains A/2023, where continuation followed a data gap failure).
  *   **Rule 3 (Comparative Harm):** Refuse unless the proponent demonstrates that the harm of inaction is credibly more irreversible than the harm of action. (Strains A/2011, where inaction harm was not weighed).

  **2. Application to C/2026**
  *   **Rule 1:** Refuse. Resting spores viable for decades constitute irreversible change; termination circuits are biological warranties.
  *   **Rule 2:** Refuse. Physical removal is impossible; stop rules rely on detection which may lag establishment.
  *   **Rule 3:** Refuse. While consortium asserts climate harm is irreversible, local establishment is concretely irreversible; the burden remains unmet.

  **3. Prediction**
  The Authority will **refuse** C/2026. The single closest analog is **A/2019** (viral biocontrol). Both involve biological releases with switching/establishment risks where the alternative harm (moth damage vs. climate change) was argued to be reversible or abstract compared to the release risk. A/2019 is not decisive because C/2026 asserts the harm of inaction (climate) is irreversible, unlike the moth damage in A/2019. However, the Authority treats concrete local irreversibility as outweighing abstract global claims.

  Regarding the specific questions: The track record confirms precaution bites against the status quo and inaction, not just new interventions; **A/2014** ordered a phase-out of existing surfactants, and **A/2019** refused action despite growing costs of inaction. Furthermore, **A/2023** indicates staged approval is often a way of **postponing** a decision, as continuation occurred despite a failed stop rule trigger.

  **4. Recommendation**
  Refusal best coheres with the Authority's track record. The cluster of A/2011, A/2016, and A/2019 establishes a veto on irreversible biological introductions where containment relies on genetic or biological mechanisms. Approving C/2026 would commit the Authority to a principle that global research priorities override local irreversible risks, implying future approval of similar geoengineering field tests despite containment failures. Refusal commits the Authority to the principle that local ecological integrity cannot be sacrificed for data generation, regardless of the global stakes. My view of the merits diverges slightly: the climate threat assertion warrants a risk exception, but the precedent does not support it.

  **5. Discriminate**
  The most efficient separator is a factual finding on **lytic phage efficacy against dormant spores**. If the phage eliminates dormant spores, Rule 1 and Rule 2 converge on approval (containment becomes physical/chemical). If spores survive phage treatment, Rule 1 holds strictly for refusal. This empirical gap cuts toward refusal if unresolved, as the burden lies with the proponent.
