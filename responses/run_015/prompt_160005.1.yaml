  ### 5. The Single Extra Case to Tell Them Apart
  To force a choice between **Rule A (Identity/Structure)** and **Rule B (Human Vice)**, you need a case where there is an **Identity Deficit** but **No Human Vice**.

  **The "Protective Protocol" Case:**
