answer: |-
  This is a high-stakes, resource-constrained strategic problem. You are not writing a philosophy paper; you are building a defensible administrative record that can survive political attrition.

  Your intuition is correct: most philosophical debates in this field are "force multipliers" for arguments you've already decided on, not decision-making tools. You need questions that act as **filters** (eliminating options early) and **anchors** (holding the recommendation steady during appeal).

  Here is the ranking of the three questions worth your energy, followed by the dead ends, the scholarship check, and the confidence flags.

  ### The Top Three Priorities

  #### 1. Saturation (The Selection Principle)
  **Rank:** #1 (Highest Leverage)
  **Why:** This is the only question that prevents the process from exploding. If you do not define *why* these 12 made the list while others did not, every recommendation will be attacked as arbitrary or politically motivated.
  **How it settles other votes:**
  *   It kills the "Where do we stop?" slippery slope argument immediately.
  *   It determines the fate of the street names vs. the statues. (e.g., If your principle is "Active Harm to Current Civic Function," streets might stay because changing them causes material disruption, while statues go because their only function is honorific.)
  *   It bypasses the "Great Man" theory. You aren't judging their whole life; you are judging the *specific reason for the honor* against *current civic values*.
  **Tractability:** High. You can draft a 1-page "Evaluation Matrix" in a month.
  **What you need to find out:** You need a clear distinction between "Historical Flaw" (common to almost all figures pre-1970) and "Disqualifying Harm" (central to their legacy and antithetical to current city values).
  **Risk:** If your principle is too vague ("community comfort"), you will drown. If it's too rigid ("no racists"), you lose half the city's infrastructure. Aim for "Centrality of Harm": *Was the harm central to why they were honored, and does the honor actively impede current city goals?*

  #### 2. Contextualization Drift (The Viability of Mitigation)
  **Rank:** #2 (Highest Process Saver)
  **Why:** This determines your menu of options. If "add a plaque" is a valid solution, you have three votes (Keep, Contextualize, Remove). If it is not stable, you only have two (Keep, Remove). Given a 2-year timeline and modest budget, you cannot afford to design, fund, and maintain nuanced interpretive installations for 12 sites that might be vandalized or ignored.
  **How it settles other votes:**
  *   It likely eliminates the "compromise" position for the High School. (Scholars generally agree: naming a school is an *active* honor; a plaque is a *passive* correction. They conflict.)
  *   It might save the Mural or the Statues *if* they can be moved to a museum setting (contextualization by relocation), rather than on-site plaques.
  **Tractability:** Medium. You need evidence, not just theory. Look at case studies (e.g., Confederate monuments with added plaques). Did they reduce controversy or prolong it?
  **What you need to find out:** Evidence of "plaque fatigue." Do people read them? Do they satisfy the aggrieved party? If the answer is "no," you save months of debating middle-ground options.
  **Risk:** If you rule this out entirely, you look radical. If you rule it in entirely, you look cowardly. **Recommendation:** Rule it out for *active* honors (Schools, Buildings) but keep it on the table for *historical artifacts* (Statues moved to parks/museums).

  #### 3. Donor's Shadow (Nature of the Claim)
  **Rank:** #3 (Highest Legal/ethical Defense)
  **Why:** This isolates the Lecture Hall (and potentially the Mural) from the rest. It distinguishes between a *Civic Tribute* (the city chose to honor someone) and a *Commercial Transaction* (naming rights were sold).
  **How it settles other votes:**
  *   It changes the ethical burden. For the School/Statues, the city is responsible for the honor. For the Lecture Hall, the city may have been a vendor.
  *   It clarifies "Standing." If it was a sale, the argument isn't just about morality; it's about whether the "product" (the name) is defective.
  *   It prevents the "Slippery Slope" regarding future donations. (e.g., "If we remove this, no one will donate again." Answer: "This wasn't a donation; it was a purchase with moral clauses.")
  **Tractability:** High. This is largely a matter of reviewing the original contracts/agreements.
  **What you need to find out:** The specific language of the naming agreement. Was there a "morals clause"? Was it a gift or a sale?
  **Risk:** Getting bogged down in contract law. Keep it philosophical: *Does money immunize a name from civic review?* (Answer should be: No, but the remedy might differ.)

  ---

  ### The Dead Ends (Do Not Spend Energy Here)

  You are right to be suspicious of these. They are rhetorical traps, not decision tools.

  *   **"Erasing History" / Anachronism:**
      *   *Verdict:* **Dead End.**
      *   *Reasoning:* There is a strong consensus among memory scholars (e.g., Kirk Savage, Thomas Wickman) that statues are not history; they are *honor*. Removing a statue does not remove the person from the history books; it removes the city's endorsement of them.
      *   *Strategy:* Have a stock sentence: *"We are not editing history textbooks; we are curating civic honor. History is studied; honor is bestowed."* Move on.
  *   **Art vs. Artist:**
      *   *Verdict:* **Dead End (for your mix).**
      *   *Reasoning:* This applies to the Mural, maybe. But for the School and Statues, the *subject* is the issue, not the creator. Don't let the Mural debate bleed into the School debate.
  *   **Cooling-off:**
      *   *Verdict:* **Distraction.**
      *   *Reasoning:* This affects *one* item (the new park). It does not help you resolve the 12 contested ones. Park this for a separate policy memo next year.

  ---

  ### Missing Priority: Procedural Legitimacy
  I am adding one that isn't in your list but is critical for a panel facing appeals.
  *   **The "Input/Output" Ratio:** How did these 12 get on *your* list?
  *   *Why it matters:* If the public perceives the list as pre-selected by the Mayor or a specific activist group, your philosophical reasoning won't matter. The appeal will be "You lacked standing."
  *   *Action:* Document your intake process. Show that you considered *more* than 12 and filtered them down using your **Saturation** principle. This inoculates you against claims of bias.

  ---

  ### Scholarship Check: Settled vs. Contested

  **Settled (among scholars/experts, not necessarily the public):**
  1.  **Monuments are not History:** The "erasing history" argument is considered a category error in memory studies. Monuments are expressions of *power and values at the time of erection*, not objective records.
  2.  **Contextualization is Unstable:** There is growing consensus that adding plaques to contested statues rarely satisfies either side. It is often viewed as a delay tactic. (This supports your *Contextualization Drift* concern).
  3.  **The "Active Harm" Standard:** Most modern frameworks (like the ICMA or American Alliance of Museums) suggest evaluating based on whether the commemoration causes active harm to marginalized groups *today*, not just whether the person was flawed.

  **Contested (Genuine Debate):**
  1.  **The "Vacancy" Question (Replacement Burden):** Scholars are split. Some argue an empty plinth is a powerful statement of "we have unlearned this." Others argue it creates a vacuum that will be filled by controversy or decay. *This is where your budget constraint makes the decision for you.*
  2.  **Laundering (Expressive vs. Material):** There is deep debate on whether symbolic change (renaming) facilitates material change (policy) or substitutes for it. Some argue renaming is a necessary first step; others argue it's a distraction. *Your panel should take a stance here, but don't let it block the vote.*
  3.  **Democratic Legitimacy:** Who gets to decide? Appointed panels vs. Public Vote. There is no consensus. *Your defense must be: "We are an advisory body making recommendations based on evidence, not a legislature making laws."*

  ---

  ### Confidence & Framing Flags

  **My Confidence Levels:**
  *   **High Confidence:** On the strategic prioritization (Saturation/Context/Donor). These are the bottlenecks in almost every municipal process I've reviewed.
  *   **High Confidence:** On the "Dead Ends." The "Erasing History" argument is rhetorically powerful but philosophically weak; do not engage it on its own terms.
  *   **Medium Confidence:** On the *Contextualization Drift*. Some recent projects (e.g., in Germany or South Africa) have made contextualization work, but they usually involve moving the object to a museum, not leaving it downtown with a plaque.
  *   **Guessing:** On the specific legal weight of *Donor's Shadow* in your jurisdiction. I am assuming standard municipal law; if your city has strong contract protections, this moves from #3 to #1.

  **Your Framing Load-Bearing Work:**
  *   **"Contextualization Drift":** This is a strong label. It assumes decay. Be careful not to assume the decay *before* you study the specific site. A plaque in a library (high engagement) might last longer than a plaque on a street corner (low engagement).
  *   **"Laundering":** You frame this as a risk. Be careful. If you recommend renaming *without* policy changes, critics will call it laundering. If you recommend *no* renaming until policy changes, critics will call it obstruction. The middle path is: *Recommend renaming as a catalyst for policy change.*
  *   **"Saturation":** You frame this as "how bad is bad enough." I suggest shifting the frame to "How central was the harm to the honor?" This is more defensible. (e.g., A donor who discriminated in housing is central to a *Housing* lecture hall, but maybe not a *Math* building).

  ### Summary Recommendation for the Panel
  1.  **Month 1-3:** Define the **Saturation** matrix. Apply it to all 12 items. This creates your "Short List" for removal vs. retention.
  2.  **Month 4-6:** Investigate **Contextualization**. If the item is an *active honor* (School, Building), rule plaques out. If it is a *statue*, consider relocation + context.
  3.  **Month 7-9:** Review **Donor's Shadow** contracts. Isolate the Lecture Hall.
  4.  **Month 10-12:** Draft recommendations. Ensure every recommendation explicitly references the **Saturation** matrix to prevent "arbitrary" appeals.

  Spend zero time debating whether the past should be judged by present standards. (Answer: We judge them by the standards of *their* contemporaries who opposed them, and by *our* standards for who we honor *today*.) That is a settled question in this field; do not let the public drag you back into it.
