  **Joint Statement on Phenomenal Judgment Mechanisms**
  **Adversarial Collaboration Unit 4**

  Look, we spent three days locked in a room arguing about why we say "I see red" when we see red. We aren't going to solve the hard problem today, but we did manage to map out where the blood is. Below is the stuff we actually agree on, followed by the table where we start throwing chairs, and then the specific cruxes we need to test. There's some weird stuff in here about shadow signals, but stay with us.

  **Common Ground Claims**

  1.  **Realism about Experience:** We both agree phenomenal experience (qualia) is real and not just a linguistic convenience. Eliminativism is out.
  2.  **Neural Correlates:** There are specific neural states (NCCs) that consistently co-occur with specific phenomenal states. We don't need to agree on *which* neurons, just that the correlation exists.
  3.  **Report Reliability:** In standard conditions, first-person reports ("I feel pain") are generally accurate regarding the subject's experience. We aren't skeptics about self-knowledge.
  4.  **The Explanatory Gap:** We agree that explaining *how* the physical brain state leads to the report is the bottleneck. It's not enough to say "it just does."
  5.  **Shadow-Qualia Intelligibility:** We both accept the conceptual coherence of the 'shadow-qualia' hypothesis: the idea that a neural state could spawn both the experience and a parallel tracking signal that drives verbal reports, even if the experience itself is causally inert.
  6.  **Physical Closure (Mostly):** We agree that for the sake of this experiment, we are assuming the brain is physcially closed to outside mental interference, focusing on internal causation.

  **Disagreements Table**

  | Issue | Epiphenomenalist Stance (My Words) | Interactionist Stance (My Words) |
  | :--- | :--- | :--- |
  | **Causal Flow** | The neural state causes the qualia AND the report separately. Qualia are a byproduct, like the smoke from the engine. | The neural state causes the qualia, and the qualia *then* cause the report. Qualia are part of the engine's drive train. |
  | **Accuracy Source** | Accuracy is guaranteed because the report signal and the qualia share a common cause (the neural state). | Accuracy is guaranteed because the qualia physically push the report mechanism into the right shape. |
  | **Shadow Signal** | The 'shadow-qualia' is the actual driver of speech. It tracks the experience perfectly because they are siblings, not parent/child. | The 'shadow-qualia' is an unnecessary ghost. If the signal tracks the experience, it's because the experience is doing the tracking via causation. |
  | **Evolution** | Qualia didn't evolve for function; they hitched a ride on neural states that did evolve. | Qualia evolved *because* they provided a unique computational advantage for reporting and decision making. |

  **Crux 1: Causal Access vs. Common Cause**
  *The Question:* Can a physically closed brain generate accurate first-person phenomenal reports without causal access to the qualia?

  *The Shadow-Qualia Injection:* The Epiphenomenalist argues yes, via the shadow mechanism. The neural correlate fires, creating the experience (Q) and a data-packet (Shadow-S) that goes to Broca's area. Q does nothing. Shadow-S talks. The Interactionist says this is magic; if Q doesn't touch Shadow-S, why do they match perfectly every time?

  *Concrete Hypothetical Case:* **The Dissociated Callosotomy.**
  A split-brain patient where the NCC for "redness" is activated in the right hemisphere (non-speaking), but the speech center is in the left. Normally, the left hemisphere says "I don't see anything." We propose a modified setup where a artificial bridge allows the *shadow signal* (if it exists as a distinct physical data stream) to cross over, but the qualitative content does not.

  *   **Epiphenomenalist Prediction:** If the shadow signal crosses, the left hemisphere will accurately report "I see red" even though the qualia are stuck in the right hemisphere. The report tracks the neural data, not the experience itself.
  *   **Interactionist Prediction:** The left hemisphere will report "I don't know" or guess. Without the qualia causing the report state directly, the data is empty. You can't report on a feeling you aren't feeling, regardless of the neural data packet.

  **Crux 2: Refutation vs. Self-Modeling Loop**
  *The Question:* Whether the paradox actually refutes epiphenomenalism or just reveals a wierd self-modeling loop.

  *The Shadow-Qualia Injection:* If we find cases where reports are accurate but behavior is wrong, the Epi says this proves the report is just a self-model loop (the shadow signal talking to itself) disconnected from the rest of the agency. The Int says this proves the qualia causation is broken.

  *Concrete Hypothetical Case:* **The Phenomenal Blindspot.**
  A subject undergoes TMS to disrupt the motor output of pain-avoidance while leaving the sensory NCC and speech centers intact. They burn their finger.

  *   **Epiphenomenalist Prediction:** The subject will scream "That hurts!" (driven by the shadow signal from the sensory NCC) but might not pull their hand away (because the qualia didn't cause the motor command, and the motor command was disrupted). This shows the report is a isolated loop, not a driver of action.
  *   **Interactionist Prediction:** This scenario is impossible or will result in muted reports. If the qualia can't drive avoidance (due to the disruption), they likely can't drive the complex vocalization either. If they report "It hurts" but don't move, it suggests the qualia *did* cause the report, proving interactionism, and the motor failure is a separate downstream break.

  **Sign-off**
  We still hate each other's guts on the metaphysics, but we agree these tests could actually kill one of the views. If the split-brain patient talks about red without seeing it, the Interactionist owes the Epiphenomenalist a drink. If they stay silent, the Epiphenomenalist has to admit qualia might actually do work.

