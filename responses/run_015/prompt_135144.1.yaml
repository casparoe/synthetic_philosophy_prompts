prompt: |-
  Draft the joint statement that a structural-invariantist and a family-resemblance contextualist about letterform recognition could both sign after a good-faith adversarial collaboration on what makes every 'a' an 'a'. The invariantist maintains that recognition depends on a hidden geometric or topological core—such as a loop-and-stem topology with constrained curvature relations—present in every token regardless of stylistic variation, while the contextualist maintains that recognition arises from clustering in a high-dimensional style space mediated by contextual co-occurrence and perceptual similarity, with no single feature being necessary. Format the output as a numbered agreed-claims section followed by a disagreements table. In the agreed-claims section, cover: the empirical range of parametric deformation across typefaces; the psychological reality of graded category membership near letter boundaries; and the fact that both camps must explain recognition under extreme stylization. In the disagreements table, state each camp's precise position in wording its own proponents would accept, then list the cruxes—specifically, (i) whether a loop-less continuous-stroke rendering that retains only the energy distribution and curvature profile of an 'a' is still recognized as an 'a' or misread as an 'e', and (ii) whether micro-allographic variation within a single font family undermines invariant-based explanation more severely than contextual clustering. For each crux, specify a concrete test case both sides agree is probative, and record each side's predicted outcome regarding both human recognition judgments and the correct explanatory account.
