answer: |-
  ### Conceptual Agenda for Memorializing Defeat: A Ranked Framework

  Given your constraints (limited empirical resources, three-year horizon) and the specific tension between remembrance and mythologization, you cannot treat these three questions as equal. You must sequence them to maximize conceptual leverage while minimizing the risk of political backlash or curatorial incoherence.

  Here is the defended ranking of your unresolved issues, ordered from upstream (foundational) to downstream (operational).

  ---

  ### Priority 1: The Ontological Frame
  **Question:** *Is there a coherent distinction between preserving defeat as an open moral wound and domesticating it into a closed historical episode?*

  **Justification for Rank:**
  This is the upstream issue upon which the other two depend. It establishes the **temporal and moral status** of the defeated cause.
  *   **Dependencies:** You cannot determine if the movement retains *normative authority* (Priority 2) until you decide if its claims are still live (open wound) or settled (closed episode). Similarly, you cannot select *aesthetic forms* (Priority 3) without knowing whether the design should provoke unresolved tension (wound) or offer closure/narrative stability (episode).
  *   **Tractability:** This is highly tractable for conceptual work. It requires philosophical clarification and historiographical positioning rather than archival digging. You can resolve this internally by defining the project's "theory of time."
  *   **Reordering Condition:** This priority drops only if external political violence linked to the cause spikes dramatically. If the "cause" becomes an active security threat, Priority 2 (Revanchism) immediately supersedes this, forcing a security-first framework over a philosophical one.

  **Why it must be first:** If you attempt to design aesthetics (Q3) or negotiate authority (Q2) without settling the ontological status, the memorial will suffer from cognitive dissonance. It will either look like a shrine to a living cause (fueling revanchism) or a tombstone for a dead one (erasing moral complexity).

  ---

  ### Priority 2: The Normative Boundary
  **Question:** *Can a defeated movement retain any normative authority without fueling revanchism?*

  **Justification for Rank:**
  Once the status of the defeat is set (Priority 1), you must determine the **political risk** of its ideas.
  *   **Dependencies:** This depends entirely on Priority 1. If the defeat is a "closed episode," normative authority is largely moot (historical interest only). If it is an "open wound," normative authority is the central danger. However, Priority 3 (Aesthetics) depends on this: the visual language must match the level of authority granted. If you grant normative weight to their ideas, the aesthetics must be critical, not celebratory.
  *   **Tractability:** Moderately tractable. This requires political theory and ethical boundary-setting. It is less about "what happened" (empirical) and more about "what claims are valid" (conceptual). It is harder than Priority 1 because it requires anticipating public reception and political weaponization.
  *   **Reordering Condition:** If your research reveals that the "normative authority" of the cause is inextricably linked to human rights violations that are legally actionable (e.g., crimes against humanity), this question collapses. The answer becomes "No," and you move immediately to Priority 3 to ensure the aesthetics reflect condemnation rather than debate.

  **Why it must be second:** This is the bridge between theory and public safety. Solving Priority 1 tells you *what* the past is; solving Priority 2 tells you *how dangerous* it is to speak about it now.

  ---

  ### Priority 3: The Aesthetic Mechanism
  **Question:** *Does collective mourning require specific formal or aesthetic conditions to avoid sliding into myth?*

  **Justification for Rank:**
  This is the **operational execution**. It is downstream because form follows function.
  *   **Dependencies:** Aesthetics depend on the Ontological Frame (Q1) and the Normative Boundary (Q2). You cannot know if you need "unsettling" architecture (for an open wound) or "archival" architecture (for a closed episode) until the first two questions are answered.
  *   **Tractability:** Low tractability for conceptual work alone. This usually requires empirical testing, visitor studies, and prototyping. Given your limited resources, you should not attempt to solve this empirically. Instead, treat it conceptually by adopting established "counter-monument" theories rather than inventing new ones.
  *   **Reordering Condition:** If you secure unexpected funding for visitor research or digital prototyping, this moves up. With resources, you can test whether specific forms actually prevent myth, rather than assuming they do.

  **Why it must be last:** Focusing on aesthetics first is the most common curatorial error. It leads to "beautiful memorials for ugly causes," where the form seduces the viewer into accepting the content. By leaving this for last, you ensure the design serves the ethical framework, not the other way around.

  ---

  ### Analysis of Upstream/Downstream Implications

  You asked specifically whether framing defeat as an **"Enduring Ethical Claim" vs. "Concluded Historical Event"** is the upstream issue.

  **Verdict:** **Yes.** This is the master switch.
  *   **If "Concluded Historical Event":** The memorial functions as a museum. The risk is erasure/boredom. The normative authority is zero. The aesthetic should be archival/didactic.
  *   **If "Enduring Ethical Claim":** The memorial functions as a forum or a wound. The risk is radicalization. The normative authority is high (but contested). The aesthetic must be disruptive/unfinished.

  **Overrated Downstream Implications:**
  In your planning, be wary of the following assumptions that do not necessarily follow from the upstream decisions:

  1.  **The "Neutral Design" Fallacy:** It is often assumed that if you resolve Priority 2 (limit normative authority), you can use neutral aesthetics (Priority 3) to safely present the history. **This is false.** Neutral aesthetics often tacitly legitimize the defeated cause by treating its arguments as reasonable alternatives rather than defeated errors. *Implication:* Do not assume "balance" in design equals safety.
  2.  **The "Revanchism Inevitability" Fallacy:** It is often assumed that granting *any* normative authority (Priority 2) inevitably fuels revanchism. **This is overrated.** Societies can acknowledge the *internal logic* or *grievances* of a defeated cause without validating their *methods* or *goals*. *Implication:* You can resolve Priority 2 with a "Yes, but..." (e.g., "Their grievance was real, their solution was immoral") rather than a flat "No." This allows for complex mourning without inviting return.
  3.  **The "Closure as Peace" Fallacy:** It is assumed that framing defeat as a "Closed Episode" (Priority 1) guarantees social stability. **This is often false.** Premature closure often radicalizes the losers, driving memory underground where it becomes mythologized without curatorial oversight. *Implication:* An "Open Wound" framework, while riskier, may be more stable long-term because it allows for managed grievance rather than suppressed grievance.

  ### Three-Year Conceptual Roadmap

  Given your resource constraints, here is how you should allocate your conceptual labor:

  *   **Year 1 (Resolve Priority 1):** Do not collect artifacts yet. Write the "Charter of Defeat." Explicitly define whether the project treats the cause as *settled* or *unsettled*. This document becomes the filter for all future decisions.
  *   **Year 2 (Resolve Priority 2):** Draft the "Limits of Empathy." Define exactly which parts of the defeated cause's worldview are permissible to articulate and which are designated as toxic. This prevents the "slippery slope" of interpretation later.
  *   **Year 3 (Address Priority 3):** Only now commission design concepts. Require designers to demonstrate how their forms adhere to the Charter (Year 1) and the Limits (Year 2). Reject any design that creates aesthetic beauty at the expense of ethical clarity.

  **Final Recommendation:**
  Focus your limited resources on **Priority 1**. If you can rigorously defend the distinction between an "open moral wound" and a "closed historical episode" in your interpretive text, you create a buffer against myth. Myth thrives in ambiguity; if you are explicit that *"This is a wound that remains open, not a hero's story,"* you inoculate the project against the very revanchism you fear. The aesthetics will follow the rigor of that definition.
