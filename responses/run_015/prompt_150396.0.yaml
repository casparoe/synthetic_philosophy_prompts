  10. **Final Polish:** Check tone (professional, analytical, curatorial/philosophical). Ensure the distinction between "mythologizing" and "remembering" is central. (Self-correction: Ensure I don't sound like I'm advocating for the cause, but rather analyzing the *memory* of it.)

  *(Self-Correction during drafting)*: I need to be careful not to imply that "Closed Historical Episode" means "Forgotten." It means "Settled." The tension is between "Unsettled Justice" vs. "Settled History." I will refine the language around Q1 to reflect this nuance.

  *(Final check on the "Overrated Implications" part)*: The prompt asks what downstream implications are overrated. A common one is that "neutral" design prevents myth. I should argue that neutrality is itself a myth. Another is that acknowledging normative authority *necessarily* leads to revanchism. I should argue that distinction is manageable.

