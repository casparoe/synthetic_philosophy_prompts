prompt: |-
  I am currently helping design the interpretive framework for a memorial project that must navigate between honest remembrance of a defeated political cause and the risk of mythologizing it into a stable national narrative. Given limited research and curatorial resources over the next three years, I want a defended conceptual agenda rather than a survey: among the unresolved issues in how societies should relate to lost causes—specifically, whether there is a coherent distinction between preserving defeat as an open moral wound and domesticating it into a closed historical episode; whether a defeated movement can retain any normative authority without fueling revanchism; and whether collective mourning requires specific formal or aesthetic conditions to avoid sliding into myth—which should be resolved first? For each, justify its rank by explaining which other questions depend on its answer, how tractable it is for conceptual rather than empirical work, and what kind of progress in the next few years would cause you to reorder them. I am especially interested in whether framing defeat as either an enduring ethical claim or a concluded historical event is the upstream issue on which the rest depend, and which downstream implications for policy or public memory are overrated or do not actually follow.
reasoning: |-
  Here's a thinking process that leads to the suggested conceptual agenda:

  1.  **Analyze the Request:**
      *   **Context:** Designing an interpretive framework for a memorial project regarding a *defeated political cause*.
      *   **Constraint:** Limited research/curatorial resources (3-year horizon). Needs a *defended conceptual agenda*, not a survey.
      *   **Core Task:** Rank three unresolved issues/questions and justify the ranking.
      *   **The Three Questions:**
          1.  Is there a coherent distinction between preserving defeat as an open moral wound vs. domesticating it into a closed historical episode? (The "Open Wound vs. Closed Episode" distinction).
          2.  Can a defeated movement retain normative authority without fueling revanchism? (The "Normative Authority vs. Revanchism" problem).
          3.  Does collective mourning require specific formal/aesthetic conditions to avoid sliding into myth? (The "Form/Aesthetics of Mourning" question).
      *   **Specific Interest:** Is the "Enduring Ethical Claim vs. Concluded Historical Event" framing the upstream issue? Which downstream implications are overrated?
      *   **Requirements for Justification:** Explain dependencies (which questions rely on which), tractability (conceptual vs. empirical), and conditions for reordering.

  2.  **Deconstruct the Three Questions:**

      *   *Question 1 (Ontological/Historical Status):* Open Wound vs. Closed Episode. This is about *time* and *status*. Is the past alive or dead? This feels foundational. If you don't decide this, you can't decide what to do with the memory.
      *   *Question 2 (Political/Normative Status):* Normative Authority vs. Revanchism. This is about *power* and *ethics*. Can we learn from them without becoming them? This depends on how we view their status (Q1).
      *   *Question 3 (Aesthetic/Formal Status):* Form/Aesthetics of Mourning vs. Myth. This is about *presentation* and *reception*. How do we show it? This depends on what we are showing (Q1 & Q2).

  3.  **Determine the Ranking (The "Defended Conceptual Agenda"):**

      *   *Hypothesis:* Question 1 is the upstream issue. You cannot determine the *authority* of the cause (Q2) or the *form* of its memorialization (Q3) without first establishing the *temporal and moral status* of the defeat itself.
      *   *Ranking:*
          1.  **Priority 1:** The distinction between "Open Moral Wound" and "Closed Historical Episode." (The Ontological Frame).
          2.  **Priority 2:** Normative Authority vs. Revanchism. (The Political Risk).
          3.  **Priority 3:** Formal/Aesthetic Conditions of Mourning. (The Curatorial Execution).

      *   *Rationale:*
          *   Q1 defines the *object* of memory.
          *   Q2 defines the *risk* of that memory.
          *   Q3 defines the *method* of that memory.
          *   Method depends on Risk; Risk depends on Object. Therefore, 1 -> 2 -> 3.

  4.  **Drafting the Justifications (Iterative Process):**

      *   *Focus on Q1 (The Upstream Issue):* Why is this first? Because if the defeat is "closed," Q2 is moot (no authority left). If it's "open," Q2 becomes critical. It's conceptually tractable because it's about defining categories, not digging up archives.
      *   *Focus on Q2 (The Political Constraint):* Why second? Once we know the status (Q1), we must decide if ideas from the losing side can be valid. This is the bridge between theory and public safety. It's harder than Q1 because it involves political theory, but easier than Q3 because it doesn't require design prototyping.
      *   *Focus on Q3 (The Aesthetic Execution):* Why last? Because aesthetics serve the concept. If you solve Q1 and Q2, Q3 becomes a matter of finding forms that fit the decision. It's the most resource-intensive (empirical/testing), so save it for later.

  5.  **Addressing the "Specific Interest" (Upstream/Downstream):**
      *   Confirm the user's suspicion: Yes, "Enduring Ethical Claim vs. Concluded Historical Event" is the upstream issue.
      *   Identify Overrated Implications: The idea that *specific aesthetics* (Q3) alone prevent myth is overrated. Myth is structural, not just visual. Also, the fear that *any* normative authority (Q2) leads to violence is sometimes overrated; nuance is possible.

  6.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Is Q1 actually solvable conceptually in 3 years?
      *   *Adjustment:* It's not about "solving" it universally, but resolving it *for the project*. The agenda is for the memorial framework, not a universal philosophy of history. I need to make sure the scope is clear.
      *   *Critique:* Is Q3 really less important?
      *   *Adjustment:* No, it's crucial, but it's downstream. You can't design the form until you know the function.
      *   *Tractability:* Q1 is high tractability (philosophical work). Q2 is medium (political theory). Q3 is low (requires testing/feedback). Given limited resources, do the high tractability work first.

  7.  **Finalizing the Structure:**
      *   **Executive Summary:** State the ranking clearly.
      *   **Priority 1 (The Ontological Frame):** Justification, Dependencies, Tractability, Reordering Conditions.
      *   **Priority 2 (The Normative Boundary):** Justification, Dependencies, Tractability, Reordering Conditions.
      *   **Priority 3 (The Aesthetic Mechanism):** Justification, Dependencies, Tractability, Reordering Conditions.
      *   **Analysis of Upstream/Downstream:** Address the specific prompt about the "Ethical Claim vs. Historical Event" framing and overrated implications.
      *   **Conclusion:** Final recommendation for the 3-year plan.

  8.  **Drafting the Content (incorporating specific terminology):**
      *   Use terms like "ontological status," "normative residue," "aestheticization of politics."
      *   Ensure the distinction between "conceptual work" (thinking) and "empirical work" (research/archives) is highlighted, as the user has limited resources for the latter.
      *   Make sure the "Reordering Conditions" are specific triggers (e.g., if political violence spikes, Q2 moves up).

  9.  **Review against Constraints:**
