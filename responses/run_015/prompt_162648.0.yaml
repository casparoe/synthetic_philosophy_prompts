  Regarding the memo: Your friend captures the standard critique (e.g., List & Goodin). Shared evidence creates correlation, violating the independence condition. In your specific model, where private hunches fully override the memo, votes remain effectively independent, so you converge to 100%. However, rational agents should weight the 80% reliable memo higher than the 60% hunch. If they do, votes correlate, and group accuracy plateaus at the memo's reliability (80%), not 100%. The majority will confidently affirm the memo's mistake.

  Thus, strict independence does preclude deliberation or shared briefs. Epistemic democrats modify the theorem to accommodate this, but the raw math supports your friend's skepticism about common information limiting convergence.

  So: Heterogeneous competence hurts (you win); common information limits convergence (friend wins).
