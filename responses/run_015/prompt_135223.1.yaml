  You're conflating the state with the property—an easy slip, but we must keep them apart. The pain is perfectly real, the distinction between burning and itching is perfectly real, and the nurse is right to act on them; what is not real is the inference that these states possess intrinsic, ineffable qualities over and above their functional and physiological character. Your prose works because you are tracking the complex relational structure of the mother's condition—her distress, her verbal reports, her physiological response—not because you are capturing a ghostly extra ingredient. When I say there is no "what-it-is-like," I mean there is no extra property attached to the experience, not that the experience itself is absent.

  The grain of the illusion is fine because the machinery it misrepresents is fine, and the error is systematic rather than random. You will come back to the diary, I know, but it records discriminations, not revelations; it notes how I distinguish tannins from acids using a system that presents those distinctions as simple tastes, but the structure lies in the discrimination, not the presentation. The match is exact because the introspective report is locked onto the sensory processing, even if it misdescribes the nature of that processing as having qualitative natures. You can write the scene perfectly well without committing to the existence of phenomenal properties, because you are writing about the person and the pain, not the property. The only thing that would actually move me is a case where the feeling varied while the functional state remained perfectly identical.
