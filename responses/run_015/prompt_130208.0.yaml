  **A. 0.80** — Color Phi is robust evidence for post-diction, though generalizing it to all temporal experience remains debated in neuroscience.
  **B. 0.45** — Mapping individual neural binding mechanisms onto complex socio-political narrative construction involves a risky category error.
  **C. 0.50** — Social phenomenology includes public conflict where gaps are often detected, unlike private qualia which are seamlessly unified.
  **D. 0.85** — Material bureaucracy and digital persistence make seamless Orwellian rewriting technically harder than blunt Stalinesque destruction.

  **Combination:** I treat B and C as bottleneck multipliers because the claim hinges on the neuroscience analogy holding true at the social level; even though A and D are strong, the weak bridge between individual perception and collective memory drags the probability down significantly.

  **Weakest Link:** Part B is the fragile backbone here; comparative empirical work on how groups resolve narrative dissonance versus how brains resolve perceptual dissonance would move my number the most. If we found that societies smooth over gaps with the same automaticity as neurons, I'd push the credence above 0.60.
