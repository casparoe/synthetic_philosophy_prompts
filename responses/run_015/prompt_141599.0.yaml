answer: |-
  **Brainstorming**
  Three candidate sites: (1) Wetland drainage for housing. Discard: Housing eliminates almost all animal-years, violating the matched-cohort constraint. (2) Forest to timber plantation. Discard: Clear-felling kills existing animals outright, making PPV trivial and ignoring population turnover dynamics. (3) Species-rich grassland to managed grazing. Commit: Allows manipulation of welfare rates and death costs while maintaining population density through stocking adjustments, satisfying the matched-cohort requirement without sci-fi assumptions.

  **1. The Scenario**
  The site is a 50-hectare temperate grassland currently supporting a stable population of European rabbits and associated predators. The horizon is 20 years. Option A (Preservation) maintains the site as a non-intervention conservation zone. Option B (Conversion) converts the land to a high-welfare silvopasture system for sheep. To satisfy the matched-cohort constraint, stocking rates in Option B are calibrated to yield identical total animal-years and deaths as the wild population. The mechanism for conversion involves mechanical burrow destruction to clear the land for fencing and planting, killing or displacing the existing rabbit cohort before sheep introduction. Preservation involves no active management. Both options are lawful under current agri-environment schemes.

  **2. The Ledger**
  *Unit: Welfare Points (WP). Suffering is negative WP.*

  | Parameter | Option A: Preserve (Wild Rabbits) | Option B: Convert (Managed Sheep) |
  | :--- | :--- | :--- |
  | **Total Animal-Years (20 yrs)** | 2,000 AY | 2,000 AY |
  | **Total Deaths (20 yrs)** | 500 Deaths | 500 Deaths |
  | **Mean Length of Life** | 4.0 Years | 4.0 Years |
  | **Positive Welfare Rate** | +20 WP / animal-year | +5 WP / animal-year |
  | **Cost of Dying (One-off)** | -30 WP / death (Predation) | -5 WP / death (Captive Bolt) |
  | **Total Positive Welfare** | +40,000 WP | +10,000 WP |
  | **Total Negative Welfare** | -15,000 WP | -2,500 WP |
  | **Net Welfare (Sum)** | **+25,000 WP** | **+7,500 WP** |
  | **Total Suffering (Magnitude)** | **15,000 WP** | **2,500 WP** |

  *Consistency Check: Mean Life = AY / Deaths (2000/500 = 4). Totals match within 0%.*

  **3. The Three Verdicts**
  **SNWT:** Sum net welfare. Preserve (+25,000) > Convert (+7,500). SNWT favours Preservation.
  **SPT:** Compare total suffering (magnitude of negative welfare). Convert (2,500) < Preserve (15,000). SPT favours Conversion.
  **PPV:** Conversion involves mechanical clearing that kills existing rabbits to benefit future sheep. This violates the side-constraint against killing existing possessors for the sake of non-existent others. PPV favours Preservation.

  **4. Sensitivity Analysis**
  The divergence rests on the *Cost of Dying*. For SPT to flip to Preservation, wild predation suffering must drop below 5 WP/death (matching slaughter). Empirically, predation involves prolonged terror and pain, making this implausible. For SNWT to flip to Conversion, wild predation suffering must exceed 65 WP/death (rendering wild lives net negative enough to lose the total sum). Given the high positive rate of wild foraging (+20), this requires predation to be catastrophically severe. While uncertain, the current gap (30 vs 5) is robust enough to sustain the disagreement without relying on fantasy numbers.

  **5. The Flip Test**
  Variant: Conversion proceeds via "Natural Attrition." The site is fenced immediately, but clearing is delayed until the existing rabbit cohort dies naturally over the first 4 years; sheep are introduced thereafter.
  **PPV:** No existing animals are killed for future benefit; the constraint is not triggered. PPV permits Conversion.
  **SNWT/SPT:** The ledger remains identical (same AY, deaths, welfare rates over the 20-year horizon). Their verdicts remain intact. This isolates PPV's deontic reliance on the *mechanism* of transition rather than the outcome.

  **6. The Best Objection**
  An SPT defender argues: "Wild suffering is epistemically inaccessible. Assigning -30 WP to predation versus -5 WP to slaughter is speculative anthropology. Without precise neurobiological metrics, the SPT verdict is unfounded."
  **Classification:** Dispute about empirical facts and the choice of welfare unit.
  **Assessment:** It succeeds in highlighting uncertainty but fails to dissolve the structural conflict. Even if the ratio is 10:1 or 2:1, the asymmetry between wild chaos and managed death persists. The case demonstrates that *if* one accepts standard estimates of wild suffering, SPT diverges from SNWT, regardless of precise calibration.

  **7. Closing Note**
  This case establishes that disagreement between suffering-prioritarian and symmetric welfarist approaches is robust even when population size is held fixed. It does not establish that wild animals suffer more than farm animals, only that if they do, policy recommendations diverge sharply. It confirms that PPV adds a distinct deontic layer insensitive to aggregate welfare calculations.
