answer: |-
  The step you must reject is **(4)**. The flaw is the equation of **procedural independence** with **statistical independence**.

  Condorcet's Jury Theorem (CJT) is a probabilistic result that relies on the statistical independence of voter errors. Specifically, it requires that the probability of two voters both being wrong is not significantly higher than the product of their individual probabilities of being wrong. Step (4) claims that a secret ballot and the absence of campaigning guarantee this independence. This is false. Procedural isolation prevents voters from *knowing* how others vote, but it does not prevent their *reasons* for voting from being correlated.

  If five billion voters all use the same heuristic (e.g., "Trust the consensus of mathematicians" or "True sounds more elegant than False"), their errors are perfectly correlated. If the heuristic fails, they all fail together. In the limit of perfect correlation, the probability of the majority being correct does not approach 1 as $N \to \infty$; it stays fixed at $p$ (the competence of the heuristic). For the Riemann Hypothesis, where laypeople lack private signals and must rely on shared cultural heuristics or guesswork, the correlation of error is likely near 1. Thus, the convergence guaranteed by the theorem never occurs.

  **The Cost to Democratic Theory**
  You worry that rejecting (4) demolishes the standard use of CJT to justify democracy, because real electorates share newspapers and cultures. It is true that no real electorate satisfies *strict* statistical independence. However, extensions of the theorem show that CJT holds so long as the average correlation between voters is sufficiently low (Ladha, 1992). 

  The cost is not the death of the democratic moral, but its refinement. You must abandon the idea that democracy is epistemically superior simply because it aggregates *more* votes (the "raw plebiscite" model). Instead, the theorem supports democracy only insofar as it aggregates *diverse* votes (the "deliberative" or "diverse information" model). 

  This does not render deliberation "theater," as your conclusion (7) suggested. On the contrary, it makes deliberation essential. Deliberation allows voters to share private signals and correct shared biases, thereby *reducing* the correlation of errors. A democracy that encourages diverse information sources and deliberation satisfies the conditions of the theorem better than one that enforces isolation. Thus, rejecting (4) saves the epistemic argument for democracy, but shifts its foundation from the *quantity* of voters to the *quality and diversity* of their information.

  \answer{step 4: procedural independence}
