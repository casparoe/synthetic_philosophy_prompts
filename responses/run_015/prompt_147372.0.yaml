answer: |-
  ### Phase 1: Conceptual Brainstorming & Conflict Mapping

  **Core Phenomena to Accommodate:**
  1.  **Robust Macro-structures:** Hurricanes, whirlpools, shockwaves (stable, physically grounded, but dissipate at atomic scales).
  2.  **Intentional States:** Beliefs, desires, strategies (multiply realizable, predictive, but causally obscure at the neuronal level).
  3.  **Adversarial/Statistical Regularities:** Card-counting edges, market arbitrage opportunities, bluffing frequencies (reliable predictions dependent on opponent ignorance or specific sampling).
  4.  **Illusory Patterns:** Pareidolia (faces in clouds), gambler's fallacy sequences (predictive failure, high compressibility).
  5.  **Functional Artifacts:** Software bugs, engine knock (design stance entities that supervene on physics but are defined by normativity).

  **Primary Conceptual Conflicts:**
  1.  **The Grain Problem:** A pattern real at scale $X$ (e.g., fluid dynamics) may be noise at scale $X/1000$ (molecular motion). Does "real" require scale-invariance?
  2.  **The Utility Trap:** If a pattern predicts perfectly but offers no causal leverage (e.g., a barometer predicts storm but doesn't cause it), is it ontologically weighty or merely epistemic?
  3.  **The Observer Dependence:** Dennett suggests patterns are real relative to a stance. But if the stance is chosen by the observer, does the pattern exist independently of the observer's computational limits?
  4.  **Causal Exclusion:** If physical states are causally closed, how can high-level patterns (like "market panic") be real causes without overdetermining the physical effects?
  5.  **Adversarial Ontology:** Is a bluff "real"? It exists only in the gap between physical action and opponent interpretation. It vanishes if the opponent is omniscient.

  **Organizing Principle:**
  The framework must distinguish between *epistemic convenience* (compression) and *ontological robustness* (counterfactual stability). I will structure the desiderata to force a theory to declare where it stands on the locus of patternhood: in the world, in the model, or in the interaction.

  ---

  ### Phase 2: Desiderata for a Theory of Real Patterns

  #### 1. The Counterfactual Stability Criterion
  *   **Motivating Case:** Consider a curve-fit of stock prices versus a structural economic model. Both compress data. But if regulations change, the curve-fit fails while the structural model adapts. A real pattern must support counterfactuals beyond the actual data sequence.
  *   **Requirement:** The theory must specify conditions under which a pattern supports *interventionist counterfactuals* (if $X$ had been different, $Y$ would be different) rather than mere conditional probabilities.
  *   **Status:** **Non-negotiable.** Without this, the theory collapses into Humean regularity theory and cannot distinguish law from accident.
  *   **Specific Address (Compression vs. Intervention):** This criterion privileges causal-intervention over pure compression. A theory satisfying this must explain why a highly compressible but causally inert correlation (e.g., spurious regression) fails to qualify as a "real pattern" despite its algorithmic efficiency.

  #### 2. The Scale-Relativity Constraint
  *   **Motivating Case:** A vortex in a fluid is a coherent object for a hydrologist. To a particle physicist tracking every molecule, the vortex is a chaotic dispersion of trajectories. If "real" implies "mind-independent," the vortex seems to vanish under fine-grained analysis.
  *   **Requirement:** The theory must define whether pattern reality is scale-invariant (exists at all grains) or scale-relative (exists only at specific resolutions). If scale-relative, it must provide non-arbitrary criteria for selecting the "correct" scale (e.g., energy minima, information bottlenecks) rather than leaving it to observer interest.
  *   **Status:** **Camp-specific Preference.**
      *   *Strict Physicalists* demand scale-invariance (only micro-physics is real).
      *   *Non-reductive Realists* demand scale-relativity (macro-patterns are real at their scale).
      *   *Instrumentalists* treat scale as purely pragmatic.
  *   **Specific Address (Ephemeral Macro-patterns):** This directly addresses turbulence and market dynamics. A viable theory must explain how a pattern can be "ephemeral" at the micro-level yet "indispensable" at the macro-level without declaring one level illusory.

  #### 3. The Adversarial Independence Test
  *   **Motivating Case:** In poker, a "tight" playing style is a pattern exploitable by opponents. If the opponent changes strategy, the pattern loses predictive power. Does the pattern exist in the player's behavior or in the interaction? Consider also "sampling-dependent" patterns in data science that vanish when the sampling method changes.
  *   **Requirement:** The theory must adjudicate whether patterns that rely on the ignorance or specific computational limits of an observer (or opponent) are ontologically real. Does accommodating these force a "Stochastic Stance" (a stance dedicated purely to statistical regularities without design or intent)?
  *   **Status:** **Non-negotiable (with open resolution).** The theory must take a position, even if that position is that such patterns are "quasi-real."
  *   **Specific Address (Stochastic Stance):** If the theory posits a "Stochastic Stance" intermediate between Physical and Intentional, it must explain why this stance isn't just a limited version of the Design Stance (where the "function" is statistical exploitation). If it rejects the stance, it must explain away adversarial regularities as mere physical coincidences.

  #### 4. The Causal Closure Compatibility Clause
  *   **Motivating Case:** If I raise my hand because I "wanted to vote," and my desire is a real pattern, did that desire cause the hand raising? If the physical neurons already caused it, is the desire redundant?
  *   **Requirement:** The theory must reconcile the reality of high-level patterns with the causal closure of the physical domain. It must specify whether high-level patterns are *causally autonomous*, *causally derivative*, or *causally exempt* (explanatory only).
  *   **Status:** **Camp-specific Preference.**
      *   *Reductive Physicalists* require derivability without remainder.
      *   *Emergentists* require autonomous causal power (downward causation).
      *   *Dennett-style Instrumentalists* treat causal claims as stance-relative (real *within* the stance).
  *   **Specific Address (Physical Closure):** This addresses whether intentional patterns can be real despite multiple realizability. A theory failing this leads to epiphenomenalism (patterns exist but do nothing).

  #### 5. The Observer-Independence Threshold
  *   **Motivating Case:** A constellation (Orion) is a pattern dependent on human visual geometry and cultural projection. A DNA helix is a pattern dependent on chemical bonding. Both are "structures," but one feels like a projection, the other like a discovery.
  *   **Requirement:** The theory must draw a boundary between patterns that are *detected* by observers and patterns that are *constituted* by observer interests. It must quantify the degree of "stance-independence."
  *   **Status:** **Non-negotiable.** Without this, the distinction between "real pattern" and "convenient fiction" collapses.
  *   **Specific Address (Utility vs. Ontology):** This distinguishes predictive utility from ontological commitment. A pattern can be useful (Orion helps navigation) without being ontologically robust (the stars are not physically connected). A theory of *real* patterns must filter out the Orions.

  ---

  ### Phase 3: Analysis of Joint Unsatisfiability

  **The "Trilemma of Pattern Ontology"**
  Given current conceptual constraints, the following subset of desiderata appears jointly unsatisfiable without significant qualification:

  1.  **Strict Physical Closure** (All causal work is done at the micro-physical level).
  2.  **Causal Autonomy of High-Level Patterns** (Macro-patterns like "market crashes" have genuine causal power distinct from micro-physics).
  3.  **Non-Overdetermination** (Effects are not causally overdetermined by both micro and macro causes).

  **The Conflict:**
  If you hold (1) and (3), you must reject (2). This forces the theory to treat high-level patterns as epistemically real but ontologically inert (Instrumentalism).
  If you hold (2) and (3), you must reject (1). This forces the theory to accept some form of downward causation or physical incompleteness (Strong Emergence).
  If you hold (1) and (2), you must reject (3). This forces the theory to accept systematic overdetermination (every action is caused twice), which many find ontologically wasteful.

  **Resolution Strategy for the Seminar:**
  Participants must choose which desideratum to relax. A "Real Pattern" theory cannot maximize all three. Most sophisticated contemporary theories relax (3) via a "compatibilist" account of causation (macro-causation is a abstraction of micro-causation, not a competing force), but this risks collapsing macro-causation into a mere figure of speech.

  ---

  ### Phase 4: The Exclusionary Criterion

  **The Single Most Demanding Desideratum:**
  **The Counterfactual Stability Criterion (Desideratum 1).**

  **Reasoning:**
  This criterion does the most work in excluding rival theories because it strikes at the heart of the "Utility vs. Ontology" distinction.
  *   **Excludes Pure Instrumentalism:** If patterns are merely "useful fictions" (Dennett's weaker reading), they need not support counterfactuals outside their specific predictive niche. Demanding counterfactual stability forces the instrumentalist to admit that some patterns track something robust in the world, pushing them toward realism.
  *   **Excludes Naive Realism:** If patterns are simply "out there" regardless of description, they should be scale-invariant. But counterfactual stability often depends on the level of description (a vase breaks if struck, but the atoms just scatter). This forces the naive realist to account for scale-relativity.
  *   **Excludes Pure Compressionism:** A theory claiming patterns are real solely because they compress data (Algorithmic Information Theory approach) fails here. A polynomial fit compresses data but fails counterfactual stability under intervention.

  By insisting that a real pattern must sustain *interventionist* counterfactuals, we force the theory to explain *why* the pattern holds, not just *that* it holds. This bridges the gap between the Physical Stance (laws) and the Intentional Stance (reasons), as both must ultimately cash out in counterfactual stability to be considered "real" rather than "useful."

  ---

  ### Phase 5: Positional Mapping (Brief)

  *   **Strict Physicalist:** Satisfies **Physical Closure** and **Observer Independence** easily. Fails **Scale-Relativity** (must eliminate macro-patterns as shorthand) and struggles with **Adversarial Independence** (must reduce strategies to physics). They pass the **Counterfactual Stability** test only at the micro-level.
  *   **Dennett-Style Instrumentalist:** Satisfies **Scale-Relativity** and **Adversarial Independence** (patterns are real *relative to the stance*). Fails **Observer Independence** (patterns are stance-dependent) and weakens **Causal Autonomy** (causation is also stance-relative). They pass **Counterfactual Stability** only within the bounds of the stance.
  *   **Realist about Intentional Patterns:** Satisfies **Causal Autonomy** and **Scale-Relativity**. Struggles significantly with **Physical Closure** (must explain how non-physical patterns cause physical effects without violation). They must argue that **Counterfactual Stability** at the macro-level is sufficient for reality, even if reducible.

  **Architect's Note for the Seminar:**
  The central tension for your students should not be "Are patterns real?" but "Real relative to what constraints?" The framework above forces them to choose between ontological parsimony (Physicalism) and explanatory power (Realism about Macro-patterns), using Counterfactual Stability as the仲裁 (arbiter). The hypothetical "Stochastic Stance" should be presented as a stress test: if a pattern is purely statistical and adversarial (like a market inefficiency), does it vanish when the arbitrageurs arrive? If so, is it less real than a hurricane? This probes the boundary between mind-dependent and mind-independent structure.
