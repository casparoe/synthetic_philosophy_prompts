  *(Self-Correction during final output generation)*: Make sure to explicitly name-drop Luck Egalitarianism so the student can show they know the literature, but keep the focus on the *arguments* within it. Ensure the distinction between "Option Luck" and "Brute Luck" is mentioned as the technical terminology.

  9.  **Final Review against constraints:**
