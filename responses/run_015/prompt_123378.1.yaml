      *   Check constraints: All parts of the prompt addressed? (Trivial, Desert, Metaphysical, Causal/Moral, Collapse, Common Usage).
      *   Ensure the distinction between *Luck Egalitarianism* (the theory) and the *Slogan* (the TA's tool) is clear.

  8.  **Final Output Generation:** (This matches the structure of the provided good response.)
