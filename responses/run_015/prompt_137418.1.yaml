      *   **Camp R (Rationalist/External Reasons):** The wrongness/value of justice is itself a reason, independent of prior desires or payoffs. If the agent is unmoved, that's the agent's defect, not the answer's defect. Requiring motivation builds corruption into the test.
      *   **Stipulations to Incorporate:**
          1.  Distinguish three questions: Predictive (what would people do?), Normative (what reasons do they have?), Addressability (what counts as an answer *to* them?).
          2.  Use the "Insulated Ring": No discovery, no evidence, no guilt/shame/self-reproach, no degradation of capacity for love/friendship, desires/skills unchanged, known in advance.
          3.  Use two variants: "Fractional Ring" (known fraction of population has it) and "Inherited Ring" (passed down generations).
