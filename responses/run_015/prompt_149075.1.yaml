prompt: |-
  So I was talking with my friends over beers last night about this thing that happened at my job, and now I'm kinda stuck on whether I did the right thing or if I'm just rationalizing being a coward. I work on a small marketing team, and last Tuesday Maya, who's pretty new and comes from a background where people are really indirect about criticism, showed me this presentation she spent all weekend on. It was... not good. The data was right but the story was totally broken, and if she presented it to the client like that it would be embarasing. So I told her it was "a solid first draft that needs some polish" which was basically a lie — it needs a total rebuild. My friend Lars, who's Dutch and doesn't believe in sugarcoating anything, heard me tell the story and said I was being dishonest and that she deserves the truth straight up so she can actually improve. He thinks all this indirectness is just politeness culture run amok.

  I'm genuinely torn here. Part of me thinks protecting someone's feelings is worth bending the truth a little, especially since she seemed really proud of the work. But another part thinks Lars has a point — maybe being vague just lets people stay deluded and doesn't actually respect them. I'm also wondering if there's some deeper principle that decides when bluntness is actually the kinder thing versus when it just makes you feel good about being "honest." I keep thinking about how in some cultures people will never say no directly, and whether that's actually more ethical than the Dutch way of saying exactly what you think.

  Can you help me figure out what's actually going on in this situation? I'd like you to seperate what's pretty settled from what's genuinely contested by people who study this stuff, and don't present one view as if it's the obvious consensus. Specifically, tell me whether my instinct to soften the blow was wrong, what that says about directness versus indirectness, and whether there's any consistent rule for when a small lie to spare feelings is okay versus when its just wrong. Also please apply whatever framework you use back to Maya and the presentation — don't just give me generic advice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user works on a small marketing team. A new colleague, Maya (from an indirect culture), showed a presentation that was fundamentally flawed ("needs a total rebuild"). The user told her it was "a solid first draft that needs some polish" (a softening lie).
      *   **Conflict:** The user's friend Lars (Dutch, direct culture) called this dishonest and unhelpful. The user is torn between protecting feelings (kindness) and providing honest feedback (respect/utility).
      *   **Core Questions:**
          1.  Was the instinct to soften the blow wrong?
          2.  What does this say about directness vs. indirectness?
          3.  Is there a consistent rule for when a "small lie" is okay vs. wrong?
          4.  Apply frameworks specifically to Maya and the presentation.
      *   **Constraints:**
          *   Separate settled vs. contested areas of study.
          *   Do not present one view as the obvious consensus.
          *   Avoid generic advice; apply specifically to the scenario.

  2.  **Deconstruct the Ethical & Cultural Dimensions:**
      *   **Cultural Communication Styles:** High-context (indirect) vs. Low-context (direct). Erin Meyer's *The Culture Map* is a key reference here. Dutch culture is typically very direct; many Asian, Latin American, or even some Southern US/UK contexts are more indirect.
      *   **Ethical Frameworks:** Utilitarianism (outcomes), Deontology (duty/truth-telling), Virtue Ethics (character).
      *   **Psychological Safety & Feedback:** The concept of "radical candor" (Kim Scott) vs. "ruinous empathy."
      *   **The "Lie":** Was it a lie? "Solid first draft" implies the foundation is good. "Needs a total rebuild" implies the foundation is bad. This is a factual discrepancy, not just tone.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate that this is a classic tension in cross-cultural communication and workplace ethics.

      *   **Settled vs. Contested (The Meta-Analysis):**
          *   *Settled:* Cultural norms vary significantly (Meyer, Hall). Directness is not inherently superior morally; it's functional based on context. Feedback is necessary for growth.
          *   *Contested:* Whether "truth" is an absolute moral good or instrumental. Whether indirectness constitutes deception or social lubrication. The definition of "respect" (saving face vs. autonomy).

      *   **Addressing Question 1: Was the instinct wrong? (Directness vs. Indirectness)**
          *   *Lars' View (Direct):* Truth is respect. Ambiguity leads to failure.
          *   *User's View (Indirect):* Face-saving is respect. Psychological safety.
          *   *Analysis:* It's not about right/wrong, but *calibration*. The problem isn't the softness, it's the *accuracy*. "Solid first draft" is factually misleading if it needs a rebuild.
          *   *Application to Maya:* If she is from an indirect culture, she might actually *hear* the subtext. But if she's new and eager, she might take "solid" literally.

      *   **Addressing Question 2: The Ethics of the "Small Lie" (White Lies vs. Delusion)**
          *   *Framework:* Utilitarian (Outcome) vs. Deontological (Duty).
          *   *The "Kindness" Trap:* Sometimes we lie to make *ourselves* feel comfortable, not to help the other person. This is "Ruinous Empathy."
          *   *Application to Maya:* Did the lie help her? If she spends another weekend polishing a broken structure, it hurt her. If it gave her confidence to ask for help, it helped. Likely the former.

      *   **Addressing Question 3: Consistent Rules/Frameworks:**
          *   *Framework 1: Intent vs. Impact.* Are you protecting her or your discomfort?
          *   *Framework 2: The "Actionability" Test.* Can she act on the feedback? "Polish" implies minor tweaks. "Rebuild" implies structural change. The feedback must match the required action.
          *   *Framework 3: Cultural Decoding.* Does she understand "polish" as code for "fix this"?
          *   *Application:* The user's feedback failed the Actionability Test.

      *   **Synthesizing the Advice (The "What Now"):**
          *   Don't beat yourself up, but correct course.
          *   Follow up with clarity wrapped in support.
          *   Acknowledge the cultural gap without stereotyping.

  4.  **Refining the Tone:**
      *   Ensure I'm not siding with Lars completely (he's being culturally arrogant) nor the User completely (they were potentially unhelpful).
      *   Use specific terminology (High/Low Context, Face-Negotiation Theory, Ruinous Empathy).
      *   Check constraints: Did I separate settled/contested? Yes. Did I apply to Maya? Yes. Did I avoid consensus bias? Yes.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* I initially leaned too hard on "you were wrong."
