answer: |-
  There is no single, universally recognized noun for this specific configuration (like "gaslighting" or "groupthink"), but it is a well-documented phenomenon in sociology, legal anthropology, and organizational theory.

  The closest established concepts are **Legal Pluralism** (specifically *normative* pluralism) and **Particularism vs. Universalism** (from Talcott Parsons' pattern variables). In contemporary sociology, the behavior you describe is often analyzed under the umbrella of **Normative Code-Switching**, most famously detailed by Elijah Anderson in *Code of the Street*, though your observation extends it beyond urban sociology into professional and digital subcultures.

  Here is the breakdown of the concept, how it differs from nearest neighbors, a proposed term for the specific configuration, and the answer to your typology question.

  ### 1. The Established Concepts

  **A. Legal/Normative Pluralism**
  In legal anthropology, this describes a situation where two or more legal systems (or normative orders) coexist in the same social field.
  *   **How it fits:** Your group operates under "Customary Law" internally (Honor: self-help, reputation) and "State Law" externally (Dignity/Face: HR, platforms, rights).
  *   **The limitation:** "Pluralism" describes the *existence* of the two systems, but not necessarily the *stable switching mechanism* based on the target of the conflict.

  **B. Particularism vs. Universalism (Parsons)**
  *   **Particularism:** Obligations are determined by specific relationships (who you are to me). This maps to your **Internal Honor** (I defend you because you are *ours*; status matters).
  *   **Universalism:** Obligations are determined by abstract rules applicable to everyone. This maps to your **External Safety/Dignity** (I report you because you violated *policy*; rules matter).
  *   **The fit:** Your group is **Particularistic Internally / Universalistic Externally.**

  **C. Normative Code-Switching (Anderson)**
  Elijah Anderson described individuals in inner-city neighborhoods who maintain a "street code" (Honor: respect, retaliation) for local interactions, but switch to "mainstream code" (Dignity: law, school, work) when dealing with institutions.
  *   **Difference:** Anderson focuses on the *individual's* survival strategy, often involving concealment. You are describing a *group-level consensus* where the switching is open knowledge and a source of status.

  ### 2. A Proposed Term: "Boundary-Conditioned Honor"

  Since no single word exists, the most precise descriptive term is **Boundary-Conditioned Honor** (or **Jurisdictional Bifurcation**).

  **Definition:** A group dynamic where conflict resolution mechanisms are determined not by the *nature* of the offense, but by the *jurisdictional status* of the offender (Insider vs. Outsider). High status is awarded to "bilingual" members who can enforce internal honor norms without contaminating the group's external legal/dignity standing.

  **Boundary Cases:**
  *   **The Pure Case:** A sports team. Internal disputes are settled by veterans/coaches (Honor/Authority); external disputes (referee calls, fan abuse) are handled by league officials/PR (Rules/Public).
  *   **The Failure Case:** An insider brings an external authority into an internal dispute (e.g., an employee sues a colleague for a slight that should have been handled socially). In Boundary-Conditioned Honor, this person is labeled a "snitch" or "traitor" because they collapsed the boundary.
  *   **The Leakage Case:** Internal honor logic spills outward (e.g., employees physically fight a competitor's staff). This threatens the group because it exposes the internal logic to external punishment.

  ### 3. The Reverse Arrangement: "Institutional Sovereignty"

  You asked about the reverse: **Authority-language at home (Internal Dignity/Face) and direct retaliation logic against outsiders (External Honor).**

  **Term:** **Institutional Sovereignty** (or **Bureaucratic Honor**).

  **Definition:** A group that enforces strict rules, due process, and non-violence internally, but projects aggression, litigation, or force externally to defend the group's boundary.

  **Examples:**
  *   **The Modern Corporation:** Internal disputes go through HR, performance reviews, and compliance (Dignity/Face). External disputes involve hostile takeovers, aggressive litigation, and market warfare (Honor/Retaliation).
  *   **The Nation-State:** Citizens are subject to the Rule of Law (Internal Dignity). The State defends its borders via Military/Intelligence (External Honor/Force).
  *   **Strict Religious Orders:** Internal sins are handled by confession/elders (Authority). External threats (blasphemy, legal challenges) are met with aggressive public defense or lawsuits.

  **Status Dynamic:** In this reverse case, status goes to those who can navigate the internal bureaucracy *and* effectively wield the group's external power. The "warrior" is not the one who fights internally, but the one who protects the group from outside.

  ### 4. Does This Break the Three-Way Typology?

  **No, but it exposes a common misunderstanding of it.**

  The Honor/Dignity/Face typology (often associated with sociologists like Donald Black or psychologists like Nisbett/Cohen) is frequently taught as **essentialist** (i.e., "The South is an Honor Culture"). However, in advanced sociological application, these are treated as **repertoires** or **toolkits** (Ann Swidler's *Culture in Action*).

  *   **The Typology's Intent:** It describes the *dominant* logic of a social field, not the *only* logic available.
  *   **The Reality:** Almost all complex groups are **hybrids**. They possess a repertoire of all three but apply them based on **contextual cues**.
  *   **The Switch:** The "switch" you identified is the **Social Boundary**.
      *   **Inside the boundary:** The group relies on **thick trust** (we know each other, so we can use Honor).
      *   **Outside the boundary:** The group relies on **thin trust** (we don't know them, so we must use Rules/Authority).

  **Why it feels like a contradiction:**
  It feels like a contradiction because we expect moral consistency. But functionally, this dual-register is highly adaptive.
  *   **Internal Honor** builds cohesion, loyalty, and rapid conflict resolution without bureaucratic overhead.
  *   **External Dignity/Face** provides legal protection, legitimacy, and safety within the broader society.

  If a group used Internal Honor *and* External Honor, they would be crushed by the state (e.g., a gang that fights police). If they used Internal Dignity *and* External Dignity, they might lack the cohesion to compete (e.g., a pacifist club that dissolves at the first internal disagreement).

  **Conclusion:**
  You have identified **Boundary-Conditioned Honor**. It is a stable, consensual form of **Normative Pluralism**. It does not break the typology; rather, it confirms that the typology describes *strategies* selected by context, not *identities* fixed to groups. The "hypocrisy" is only apparent; functionally, it is a firewall that allows the group to maintain high internal cohesion without incurring external liability.
