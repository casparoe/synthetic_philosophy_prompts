answer: |-
  1. We gather because the recent extension of the ballot proves that the boundary of our community is a choice we make, not a line nature drew. Yet, by granting the vote to some residents while withholding it from others equally subject to our laws, we have merely shifted the gap between those who authorize power and those who remain exposed to it.

  2. We must distinguish between "membership as authorization," which is the standing to shape collective decisions, and "membership as exposure," which is the condition of being structurally subject to those decisions without having shaped them. This workshop asks why we privilege the former when the latter is the shared reality of everyone living within these jurisdictional lines.

  3. Whether we measure belonging by years of residence, status of citizenship, or depth of affected interests, every criterion creates a new class of people who are exposed to our laws without authorizing them. Consequently, no single metric can resolve the tension between the power to decide and the necessity of living with those decisions.

  4. To the newly enfranchised, this vote is a hard-won recognition of your authorization, but it does not erase the exposure of your neighbors who remain voiceless. To the excluded workers, your presence here testifies that exposure exists independently of the ballot, demanding a political account that voting rights alone cannot provide.

  5. Our task is not to find the correct boundary that finally solves the boundary problem, but to examine the costs of every line we draw. We must learn to govern while acknowledging that our demos is always constituted by those we leave out as much as those we let in.
