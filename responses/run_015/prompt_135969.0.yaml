answer: |-
  This is a genuinely profound ethical dilemma, and the fact that you're losing sleep over it tells me something important right out of the gate: **You are not selfish.** Selfish people don't wrestle with the arbitrariness of borders when deciding where to put their savings; they just keep the money.

  You are caught between two valid moral frameworks: **Communal Obligation** vs. **Effective Altruism.** Neither is wrong, but they pull in different directions. Here is how I see it.

  ### 1. The Case for "Your Side" (Communal Obligation)
  It is normal, healthy, and functional to prioritize the community you physically inhabit. You see these people at the grocery store. You share the immediate infrastructure. If the community center on your side closes, *you* lose a resource. You lose a gathering place.

  There is a concept in ethics about "circles of care." It's not immoral to care more about the inner circle (your neighbors, your town) than the outer circle. Communities function because people invest in their immediate surroundings. If everyone only sent money to the "poorest place on earth," no local parks, libraries, or centers would ever stay open. There is value in maintaining the social fabric of the specific patch of ground you walk on every day.

  ### 2. The Case for "The Other Side" (Need and Arbitrariness)
  Your insight about the border is the moral heavyweight here. You've recognized what philosophers call "moral luck." You didn't earn the privilege of being born on the slightly wealthier side of the line. If the border had shifted, your loyalty would have shifted, too.

  From a purely utilitarian perspective (maximizing the good), money goes further where poverty is deeper. If the center across the line is struggling *more*, your savings might keep the lights on for five families there, versus one family on your side. Helping them also acts as a bridge. In divided towns, resources flowing across the line can humanize the "other" and reinforce that you are one culture, despite the politics.

  ### 3. The Middle Path
  Since you said you saved "a little, not a lot," the stakes are personal. You don't have to solve the geopolitical divide with this one donation. Here are three ways to look at the decision:

  *   **The Split:** Is there a rule that says it has to be all or nothing? Could you give 50% to each? It acknowledges your local obligation while honoring the greater need across the line.
  *   **The Collaboration:** Since you said the culture is identical (same church, food, language), have the two centers ever tried to merge resources? Sometimes a donation can be made on the condition that it supports a joint initiative. If the centers are both struggling, maybe they should be sharing a bus or coordinating events. Your money could be the seed to help them talk to each other.
  *   **The Proximity Rule:** If you use the center on your side, there is a pragmatic argument for keeping it open. If it closes, your community becomes more isolated, which might make you *less* likely to help the other side in the future. Sometimes you have to secure your own base to be effective in the long run.

  ### My Take
  I think your feeling that you owe your side more is **normal**, but your hesitation about it is **wise.**

  It is okay to prioritize your neighbors. That isn't bigotry; it's stewardship of your immediate environment. However, because you recognize the border is arbitrary, I would encourage you to not let that line harden your heart.

  If I were in your shoes? I would donate to the side that needs it **more**, but I would attach a note or a condition that emphasizes the shared culture. *"I live just across the line, we are the same people, please let this help bridge the gap."*

  Why? Because keeping your local center open helps *you*. Helping the poorer center helps *them*. Since you are the one with the savings right now, you are in a position of privilege. Using that privilege to alleviate greater suffering is a beautiful thing, even if the suffering is just twenty miles away across an imaginary line.

  But honestly? Whichever you choose, do it without guilt. The fact that you weighed the "randomness of the border" means you're already fighting the selfishness you're worried about. You're good people. Trust your gut.
