answer: |-
  Here is the plan. It is designed to be tight; eighty minutes is barely enough to move from the phenomenon to the distinction without rushing the philosophical payoff.

  ### 1. Sequence and Dependencies

  **Vocabulary Strategy:** Do **not** hand them the type/token/style distinction at the start. If you give them the vocabulary, they will treat the session as an exercise in definition-matching ("Ah, this is a token, this is a type") rather than an inquiry into identity conditions. You must extract the vocabulary at the end to label the solution they have constructed.
  *   **Loss if given early:** The inquiry collapses into terminology. They will stop asking *why* the identity holds once they have a label for it.
  *   **Loss if extracted late:** You risk spending 40 minutes talking past each other ("It's the same shape" vs. "No it's not"). You need a placeholder phrase. Use "the letter itself" vs. "the mark on the page."

  **The Order of Components:**
  1.  **The Phenomenon of Variation (0–15 min):** Establish that we confidently identify 'a's across radical geometric differences.
  2.  **The Failure of Geometry (15–30 min):** Demonstrate that no set of intrinsic shape properties is necessary or sufficient.
  3.  **The Failure of Stipulation (30–45 min):** Demonstrate that identity is not arbitrary (you cannot stipulate *any* mark is an 'a' without breaking the system).
  4.  **The Systemic Solution (45–65 min):** Identity is determined by structural role within a style.
  5.  **Vocabulary & Formulation (65–80 min):** Introduce *type*, *token*, *glyph*, *style*. Formulate the target claim.

  **Dependency:** Step 3 collapses if Step 2 is skipped. If they still believe there is a "core shape" (e.g., a circle and a line), they will argue that stipulation is only needed for the edges, not the core. You must destroy the geometric essentialist view completely before the "convention/stipulation" view becomes the only remaining alternative to beat.

  ### 2. The Carrying Example

  **Critique of your Candidates:**
  *   **The Rotunda Swap (shifted mapping):** **Reject this as the primary example.** It invites the "cipher" response ("It's just a code"). If the shape is standard 'b' but mapped to 'a', students will say identity is purely stipulative mapping. This undermines your goal to show it is *not* mere stipulation.
  *   **The Partial Swap ('a'/'o' exchange):** Same problem. It looks like a puzzle to solve, not a conceptual problem about identity.
  *   **The Real 'a's (Serif, Sans, Blackletter, Hand):** **Use this.** It is the strongest data set. It forces them to confront the lack of geometric overlap without the distraction of a "code."

  **The Better One:**
  Draw a **3x3 Gridfont** on the whiteboard.
  *   Draw a standard 5x7 grid 'a' (blocky).
  *   Draw a "curly" version in the same grid (rounded corners).
  *   Draw a "broken" version (disconnected strokes).
  *   **Why:** Real fonts carry historical baggage (Blackletter brings in "German," "Old," etc.). Gridfonts isolate the *structural* features (loops, sticks, terminals) from the *stylistic* features (curvature, weight, connection). It is drawable in seconds. It makes the "style" variable explicit.

  **What it must make vivid:** That you can change *everything* about the ink (curvature, weight, connection) and keep the letter, but if you change the *topology* (close a loop, remove a stick), you lose the letter.
  **What it must keep out of the way:** Readability issues. Ensure the gridfonts are legible so the question isn't "Can I read this?" but "Why is this an 'a'?"

  ### 3. Misconceptions and Timing

  1.  **The Template Picture (Geometric Essentialism):**
      *   *When:* Minutes 10–20. "They all have a bowl and a stem."
      *   *Head off:* Draw a single-storey 'a' (like handwriting) next to a double-storey printed 'a'. Ask: "Where is the bowl in the handwritten one? Where is the stem in the blackletter one?" Force them to admit there is no common shape.
  2.  **The CogSci Similarity Space:**
      *   *When:* Minutes 20–30. "They cluster together in high-dimensional space."
      *   *Head off:* Acknowledge this explains *recognition*, not *identity*. "A tiger and a drawing of a tiger might cluster, but one is a natural kind and one is an artifact. Similarity explains how we guess, not what makes it the thing."
  3.  **The Reading/Being Conflation:**
      *   *When:* Minutes 30–40. "It's an 'a' because we read it as one."
      *   *Head off:* "If I write 'a' but intend it to be a drawing of a person, is it an 'a'?" Distinguish *producer intent* from *system role*.
  4.  **The Shrug (Pure Convention):**
      *   *When:* Minutes 40–50. "It's just a rule. We agreed."
      *   *Head off:* Use the Gridfont. "If I change the curve to a straight line, it's still an 'a'. If I remove the loop, it's a 'u'. The rule doesn't determine the boundary; the *system's constraints* do."
  5.  **Token/Type Confusion:**
      *   *When:* Throughout.
      *   *Head off:* Point to the whiteboard ink. "If I erase this, does the 'a' cease to exist?" (No). "If I burn the dictionary, does 'a' cease to exist?" (Debatable). Keep the focus on the *identity conditions*, not the ontology.

  ### 4. What to Leave Out

  1.  **The *Letter Spirit* Machinery:** Do not describe the analogical mapping or the "gappiness" of the grid. That is a theory of *implementation*, not a theory of *identity*.
  2.  **Historical Paleography:** Do not let the session drift into "The Carolingian minuscule changed the 'a'." That is causal history, which belongs to natural kinds, not notational identity.
  3.  **OCR/Computational Recognition:** Do not let the CogSci students solve this by talking about feature detection algorithms. That explains how a machine *finds* the letter, not what *makes* it the letter.
  4.  **The Ontology of Types:** Do not reopen the Platonic vs. Nominalist debate about whether types "exist." Treat types as *identity conditions* for the purpose of the seminar.

  **Say out loud:** "We are not asking where the letter lives (mind, paper, platonic heaven). We are asking what rules govern the judgment that *this* and *that* are the same letter."

  ### 5. The Check (The Script)

  You described five figures.
  1.  Standard 'a' (bowl + stick + bar).
  2.  No bar.
  3.  Open bowl.
  4.  Triangle bowl.
  5.  Broken bowl + stub bar.

  **The Problem:** As presented, the question "Which letter is it?" for Figure 5 is **indeterminate**. It is a matter of taste.
  **What the set must contain:** To make the answer determinate, you must provide the **systemic context**. You must show them the 'b', 'c', 'd', etc., rendered in the *same broken style* as Figure 5.
  *   If the 'b' in this set also has broken bowls and stub bars, then Figure 5 is an 'a' (it is a stylistic variant).
  *   If the 'b' is standard, then Figure 5 is a damaged 'a' or a different symbol.

  **What the answer must cite:**
  To count as having "got the idea," a student cannot say "It looks like an 'a'." They must cite **structural invariance within the system**.
  *   *Correct Answer:* "It is an 'a' because, within this specific font system, the 'broken bowl' feature is a stylistic variable that applies to all closed counters, while the 'stick on the right' remains the invariant structural marker distinguishing it from 'c' or 'e'."
  *   *Incorrect Answer:* "It's an 'a' because I recognize it." (Psychological) or "It's an 'a' because the teacher said so." (Stipulation).

  **Modification for the Whiteboard:**
  Do not hand out a script. Draw Figure 1 (Standard) on the left. Draw Figure 5 (Broken) on the right. Ask: "Is the right one an 'a'?" They will hesitate. Then, draw a 'b' next to Figure 5 that *also* has a broken bowl. Ask again. The shift in their certainty is the data point you want.

  ### 6. Critical Reflection

  **The Step I am Least Confident About:**
  Moving from "It's not geometry" to "It's Systemic Role" (Minutes 45–65). This is the hardest philosophical leap. Students will naturally want to rest in "It's Convention." You have to show that Convention is too loose (anything could be an 'a' by fiat) while Systemic Role is constrained (not anything can be an 'a' within a working script). If you do not make the "constraints of the system" vivid, they will leave thinking you just proved conventionalism.

  **The Substantive Claim a Colleague Would Reject:**
  The claim that "sameness of letter... is neither sameness of intrinsic shape-properties nor a matter of stipulation."
  *   *The Objection:* A Quinean or Wittgensteinian colleague will argue that "Systemic Role" *just is* a complex form of stipulation/convention. They will deny there is a fact of the matter about letter identity beyond "use within a community." Your plan assumes there is a normative boundary (right/wrong ways to be an 'a') that exists independently of mere agreement. This is a robust realist stance about artifacts that is philosophically contestable.

  **Feasibility Check:**
  *   **Can the hour hold this?** It is tight. If the discussion on Geometric Essentialism (Step 2) drags, you will not reach the Systemic Solution. You must be ruthless in cutting off the "But they both have a curve..." arguments.
  *   **Is the distinction stable?** The Letter/Style distinction is stable *within typography*, but philosophically porous. If you push hard enough, "Style" dissolves into "Sub-type." Be prepared to admit that the boundary is fuzzy, but insist that the *extremes* (a vs. b) are not.
  *   **Stipulation to Drop:** Drop the requirement that they agree on the *positive* definition of Style. Aim only for the *negative* claim (It's not shape, it's not arbitrary fiat). If you try to define Style positively in 80 minutes, you will fail.

  **Final Advice:**
  Your framing is sound, but do not let the "Rotunda" idea seduce you. It is a trick. The Gridfont is the truth. Use the whiteboard to build a font live, changing one feature at a time, asking "Still an 'a'?" until they feel the snap where it becomes a 'u' or a 'd'. That "snap" is the phenomenon you are teaching.
