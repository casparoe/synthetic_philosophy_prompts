      *   **Structure:** Three sections representing three timescales:
          1.  One night (événement): A community decision during a flood to cut a new outlet across a neighbor's land.
          2.  One human lifetime (conjoncture): Litigation, migration, silting following the decision.
          3.  Ten thousand years (longue durée): The geological/climatic context.
      *   **Character:** The man making the decision in Section 1 must be treated with sympathy (his agency must feel real).
      *   **Thematic Position:** Take a stand on whether the longest scale dissolves the event or if the event has contingency/thickness. Don't settle for "choices don't matter."
      *   **Afterword:** Explicitly state which timescale is causally decisive and what it fails to explain.

  2.  **Deconstruct Braudel's Layers for the Story:**
      *   *Événement (Event):* Short-term, political, individual actions. High tension, immediate consequences, feeling of agency.
      *   *Conjoncture (Conjuncture):* Medium-term, economic, demographic, social cycles. Trends, lawsuits, shifting populations, silting processes visible over decades.
      *   *Longue Durée (Long Duration):* Geographical, climatic, structural. Almost static, inevitable forces, the river's will over millennia.

  3.  **Setting the Scene (The Delta):**
