answer: |-
  "The Guardian Vases destroy your project, Nell," Ravi said, sliding a diagram across the table. "Vera is fragile. Vern is not. But strike Vera, and her Guardian hardens her instantly. She doesn't break. Strike Vern, and his Guardian weakens him. He shatters. Your conditional analysis says Vera isn't fragile and Vern is. It gets reality exactly backwards."

  Nell didn't look at the diagram. "It destroys the *naive* analysis. My patched version survives. *x* is disposed to *M* in conditions *S* iff, with all interferers removed, *x* would *M* were *S* to obtain. The Guardians are interferers. Remove them, and the conditionals align with the dispositions."

  "Define 'interferer'," Ravi shot back. "And don't say 'anything that prevents the conditional from holding.' That's circular. You're defining the interferer by the very disposition you're trying to analyze."

  "An interferer is an extrinsic factor that alters the causal chain between stimulus and manifestation," Nell said sharply. "The Guardians are external devices. Vera's intrinsic microstructure is fragile; the Guardian is an added layer that changes the outcome. We hold the intrinsic fixed and remove the extrinsic."

  "But the Guardian only fires because it detects the fragility," Ravi countered. "It reads the microstructure. To identify the Guardian as an interferer, you have to know it's reacting to fragility. But if you already know Vera is fragile, you don't need the conditional analysis. You're using the disposition to identify the interferer to define the disposition. It's a loop."

  "It's not a loop, it's a refinement," Nell insisted. "We identify interferers via independent causal modeling. We see a mechanism intervening. We don't need to know the disposition beforehand, just that an external force is modifying the system's response."

  "Fine. Take Vern. He's intrinsically sturdy. His Guardian makes him fragile upon impact. Is that Guardian an interferer?"

  "Yes."

  "So if you remove it, Vern doesn't break. So Vern isn't fragile. That matches reality. But now tell me: is Vera's Guardian a *fink* or a *mask*?"

  Nell hesitated. "A fink. It removes the fragility upon stimulation."

  "And Vern's?"

  "Reverse fink. It adds fragility."

  "Here's the problem," Ravi said, leaning in. "You can only classify them as finks if you already know what the disposition *was* before the impact. If you didn't know Vera was fragile, you'd look at the non-breaking and call it a mask—she's still fragile, but the manifestation is blocked. Or you'd call it not fragile at all. You can't distinguish finks from masks without prior knowledge of the intrinsic power. But if you have prior knowledge, the conditional analysis is redundant."

  "The conditional isn't redundant; it's constitutive," Nell said. "The microstructure *is* the truth-maker for the conditional. The Guardian just obscures the link."

  "Then admit it!" Ravi snapped. "The disposition is the microstructure. The conditional is just evidence. When the Guardian is present, the evidence is misleading. That's my point. Dispositions are intrinsic properties. Conditionals are fallible tests. You're trying to turn the test into the property."

  "If conditionals are just evidence, how do you verify the property?" Nell asked. "You strike the vase. It doesn't break. On your view, how do you know it's still fragile? You can't appeal to the conditional, because that's just evidence. Do you appeal to the microstructure?"

  "Yes."

  "But how do you know that microstructure entails fragility?" Nell pressed. "Unless you know that *were* it struck, it *would* break. You're back at the conditional. You need the counterfactual to link the microstructure to the power. So you can't discard the conditional entirely."

  "I don't discard it. I deny it's the *analysis*," Ravi said. "I know the microstructure entails fragility because I understand the causal laws governing silica bonds. Those laws support the counterfactual. But the disposition exists even if the laws change, even if the counterfactual fails. Vera is fragile even if her Guardian ensures she never breaks. Her power is real, even if the manifestation is finked away."

  "But then your ontology is occult," Nell argued. "You have powers that never manifest and make no difference to conditionals. How do we ever find out what objects are disposed to do if the conditionals lie to us?"

  "We investigate the causal bases," Ravi said. "We look at the structure, not just the behavior. When the conditional fails, we don't say the disposition vanished; we say the test was compromised. You say the disposition *depends* on the test conditions being ideal. I say the disposition exists regardless, and the test is only good if it respects the intrinsic nature."

  "So we disagree on reduction," Nell summarized. "I think disposition talk cashes out in conditional talk, provided we clean up the ceteris paribus clauses. You think dispositions are primitive intrinsic properties that *support* conditionals."

  "Exactly. Your 'interferer' clause is a placeholder for 'anything that messes up my analysis.' You need to know the disposition to clean the conditions, but you need clean conditions to know the disposition."

  "And you," Nell retorted, "have no way to verify your intrinsic powers except by hoping the conditionals hold. You're relying on the evidence you claim is secondary."

  "I rely on theory and structure," Ravi said. "You rely on language and logic."

  "Then we're stuck," Nell said, closing her notebook. "You think I'm circular. I think you're mystical."

  "No," Ravi said, standing up. "We just agree on the vases. Vera is fragile. Vern is not. You think that means the right conditionals *would* hold. I think it means the Guardians are lying about what they *do* hold."

  "Same truth, different metaphysics."

  "Different everything," Ravi corrected. "You're saving the analysis. I'm saving the power."
