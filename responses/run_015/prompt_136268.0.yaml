  1. The inclusion/standing split — why it changes the debate
  The inclusion/standing split dissolves the stalemate between "all affected" and "all subjected" by assigning them to different institutional layers. Inclusion conditions determine membership rights (voting, office-holding), while standing conditions determine whose interests must be weighed in deliberation. Conflating them forces a binary: either you vote or you don't count. Separating them allows for models where entities have standing without inclusion, such as guardians for future generations. This shifts the debate from "who belongs" to "whose interests constrain outcomes." Consequently, "all subjected" becomes a threshold for inclusion (coercion requires consent), while "all affected" becomes a threshold for standing (impacts require consideration). This distinction transforms the boundary problem from a membership roll call into a design challenge regarding interest aggregation and veto power. Without this split, theorists talk past each other, arguing about voting rights when the real issue is interest weight. Recognizing this allows for hybrid institutions where some actors hold veto power without ballots, fundamentally altering how we conceive democratic legitimacy beyond simple majoritarianism.

  2. Ranked priorities with reasoning
  1. **Institutionalizing Standing Mechanisms:** This is the most upstream design variable. Defining boundaries is theoretical; building vectors for standing (e.g., proxy veto points, impact assessments, ombudsmen) is practical. Without mechanisms, standing is merely rhetorical. This research dictates *how* the distinction functions in reality. If you cannot engineer standing without voting, the split collapses back into inclusion-only models. Therefore, identifying viable proxies who can authentically represent excluded interests without capturing the agenda is the foundational engineering problem. It determines whether the inclusion/standing split is a viable political technology or just a philosophical nuance. This is the leverage point: changing the mechanism changes the outcome regardless of the boundary definition.
  2. **Temporal Boundaries (Future Generations):** This is the primary stress test and second priority. Future humans cannot be included by definition, making them the perfect case for standing-only models. Success here validates the inclusion/standing split. It is downstream of mechanisms because you need the tools before applying them to this specific group, but upstream of functional boundaries because human interests remain the baseline for moral weighting. Solving temporal standing provides the blueprint for other excluded groups. It forces the transition from electoral accountability to fiduciary responsibility, which is the core institutional shift required for long-termism. If you solve this, you solve the hardest human-centric boundary problem.
  3. **Functional Boundaries (AI/Ecosystems):** This is the theoretical limit case and third priority. While philosophically rich, it is downstream of temporal issues. If institutions cannot secure standing for future humans, arguing for non-human agents is premature. This remains taxonomy until human temporal standing is resolved. It expands the theory but offers less immediate institutional leverage. Furthermore, AI agency is speculative; future human interests are certain. Prioritizing functional boundaries risks solving hypothetical problems while neglecting the actual crisis of intergenerational equity. It is a boundary expansion, not a structural repair. Getting the order wrong risks vague declarations without enforcement or speculative ethics without traction.

  3. What would flip your ranking
  My ranking flips if empirical evidence shows that standing without inclusion is inherently illegitimate to current voters. If guardianship models consistently lead to elite capture or democratic backlash, then inclusion remains the only viable path, collapsing the split. Additionally, rapid advancements in AI agency could elevate functional boundaries. If AI agents demonstrate autonomous preference formation comparable to humans, excluding them becomes ethically untenable, moving functional boundaries upstream of temporal ones. Finally, if the distinction itself proves unstable—for instance, if standing inevitably demands inclusion to be credible—the foundational premise fails. Also, if a specific temporal mechanism proves universally successful, it might make the general mechanism question less urgent, pushing Temporal to #1. Or if climate collapse accelerates, the urgency of Temporal might outweigh the theoretical work on Mechanisms. Practical crisis could override design logic.

  4. Bottom line — if you had to pick one thread for a multi-year project
  Pick **Institutionalizing Standing Mechanisms**. This is the toolkit. Without it, temporal and functional questions remain philosophical complaints rather than design specs. You can argue for future generations forever, but without a veto point or proxy model, nothing changes. This thread offers the highest leverage for actual institutional redesign. It transforms the boundary problem from a question of membership into a question of power distribution. Focus here ensures your three years produce actionable blueprints rather than just normative theory. It is the engine that makes the other priorities possible.
