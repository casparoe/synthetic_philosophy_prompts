answer: |-
  Here is a session plan designed for a 90-minute pub slot with a mixed-technical audience. It prioritizes keeping the arithmetic simple, the stakes concrete, and the "Marek objection" from derailing the first hour.

  ### 1. The Arc: Order and Dependencies

  Your instinct to front-load the epistemological claim ("'I am here' is evidence") is **theoretically correct but pedagogically dangerous.** If you start there, the programmers will ask for the likelihood function, the biologists will ask about selection bias, and the neighbour will check out.

  **The Correct Order:**
  1.  **The Bet (0–15 mins):** Establish a concrete scenario where SSA and SIA give *different odds* on a wager.
  2.  **The Mechanism (15–35 mins):** Explain *why* they disagree. This is where you introduce "I am here" as evidence.
  3.  **The Presumptuous Philosopher (35–55 mins):** Scale the bet up to show why this isn't just a game (the cosmological stakes).
  4.  **Marek's Objection (55–70 mins):** The "Gotcha" moment. Address the cancellation claim.
  5.  **Reference Classes & Sleeping Beauty (70–80 mins):** Containment and categorization.
  6.  **The Final Check (80–90 mins):** A variation on the bet to test understanding.

  **Why this dependency?**
  You cannot explain why "I am here" is evidence until the audience agrees that the two assumptions lead to different outcomes. If they don't see the divergence first, the evidence claim looks like semantic nitpicking.

  ---

  ### 2. The Carrying Example: "The Two Conferences"

  You need an example that isolates *observer count* from *physical probability*.

  **The Setup:**
  *   **Hypothesis S (Small):** A conference is held with **10** attendees.
  *   **Hypothesis L (Large):** A conference is held with **1,000** attendees.
  *   **Prior:** A fair coin flip determined which conference was held. (50/50).
  *   **The Evidence:** You wake up in a hotel room booked for the conference. You know you are **an attendee**.

  **The Bet:**
  "I will bet you $100 that we are at the Large Conference. If I'm right, you pay me $100. If I'm wrong, I pay you $100. Do you take the bet?"

  **What this example needs:**
  *   **Symmetry:** The experience of being an attendee is identical in S and L. (No "crowded room" cues).
  *   **Guaranteed Existence:** You must stipulate that *you* (the specific agent) exist in both hypotheses, but your *status as an attendee* is the variable.
  *   **Boring Stakes:** It's about conference swag, not the heat death of the universe.

  **What this example must lack:**
  *   **No "Creation":** Do not say the attendees were "created." Say they "registered." This avoids the "does existence require a cause?" rabbit hole.
  *   **No Amnesia:** Do not use the Sleeping Beauty "woke up and forgot" mechanic. You know who you are; you just don't know the *total count*.
  *   **No Specific Identity (Initially):** For the first derivation, define "You" as "The perspective I am currently experiencing," not "John Smith." (This is crucial for Marek's objection later).

  **The Math (Whiteboard Left):**
  *   **SSA (Self-Sampling):** You are a random sample from *actual* attendees.
      *   P(You | S) = 1/10.
      *   P(You | L) = 1/1000.
      *   Likelihood Ratio: 100:1 in favor of **Small**.
      *   *Result:* SSA says take the bet against the Large Conference. (Doomsday intuition).
  *   **SIA (Self-Indication):** You are a random sample from *possible* observers.
      *   SIA weights the hypothesis by the number of observers.
      *   P(You | S) ∝ 10.
      *   P(You | L) ∝ 1000.
      *   Likelihood Ratio: 100:1 in favor of **Large**.
      *   *Result:* SIA says take the bet for the Large Conference. (Presumptuous intuition).

  ---

  ### 3. Handling "Marek's Objection"

  **The Objection:** "The SIA boost cancels out as soon as you conditionalize on everything you know (e.g., your name, your DNA). Since 'John Smith' exists in both worlds, the observer count doesn't matter."

  **Is Marek Right?**
  Technically, he is describing **Full Non-indexical Conditioning (FNC)**. In many practical cases, FNC neutralizes SIA. However, in the *Presumptuous Philosopher* case (cosmological theories where the *physical laws* determine observer density), Marek's objection fails because "John Smith" might not exist in the Small World at all.

  **Where to place it:**
  **After** you have derived the Presumptuous Philosopher case. If you put it before, you kill the tension. Let them feel the weirdness of SIA first. Marek's objection is the "relief valve" people will reach for.

  **The Smallest Case to Settle It:**
  Use the **Two Conferences** example again, but tighten the identity constraint.
  *   **Ask Marek:** "If I know I am *specifically* John Smith, and John Smith registered for both conferences, do you agree the odds go back to 50/50?"
  *   **If he says Yes:** You concede the point. "Okay, so SIA only works if we treat 'I' as an indexical pointer, not a specific name."
  *   **If he says No:** Ask him to write the Bayes factor.
  *   **The Pocket Resolution:** The disagreement rests on the **Reference Class**.
      *   If Reference Class = "People named John Smith," SIA cancels.
      *   If Reference Class = "Conscious observers," SIA holds.
      *   *Your move:* Tell the room, "For the next 20 minutes, we are fixing the Reference Class as 'Conscious Observers.' Marek, you can win it back in the Q&A."

  ---

  ### 4. Sleeping Beauty & Reference Classes

  **Sleeping Beauty:**
  *   **When:** Mention it in the first 5 minutes to **park it**. "This is the cousin of Sleeping Beauty. If you know that problem, park it. If you don't, don't worry, we aren't doing amnesia today."
  *   **Why:** Sleeping Beauty introduces *temporal* indexicality (waking up once vs. twice). SIA/SSA is about *spatial/population* indexicality. Conflating them confuses the "evidence" claim.
  *   **Return:** Only bring it back in the last 10 minutes if someone asks. "Sleeping Beauty is the same engine, but with time instead of people."

  **Reference Class Widening:**
  *   **Status:** Present this as a **Feature**, not a bug, but note it dissolves the distinction.
  *   **The Line:** "If SSA users widen their reference class to include 'possible observers,' SSA becomes SIA. If SIA users narrow it to 'actual observers,' SIA becomes SSA. The fight isn't about the math; it's about which group you're allowed to say you were sampled from."
  *   **Instruction:** Explicitly refuse to resolve it. "We are not solving the Reference Class problem tonight. We are assuming the class is 'People in this room.' If you change the class, the math changes, but the *conflict* remains."

  ---

  ### 5. Misconceptions to Head Off

  1.  **"SIA says I create reality by looking at it."**
      *   *Correction:* "No. SIA says finding yourself existing is more likely in worlds where existence is common. It's a selection effect, not telekinesis."
      *   *When:* During the Mechanism phase (15–35 mins).
  2.  **"SSA is just being humble."**
      *   *Correction:* "SSA isn't humility; it's a claim about sampling. It says you shouldn't assume you're special, but SIA says you shouldn't assume you're rare."
      *   *When:* During the Conference Bet.
  3.  **"This is just the Doomsday Argument."**
      *   *Correction:* "Doomsday is a *consequence* of SSA. SIA is the *antidote* to Doomsday. They are opposing forces."
      *   *When:* When scaling to the Presumptuous Philosopher.
  4.  **"Infinite Universes break everything."**
      *   *Correction:* "Infinities break *both*. We are assuming finite worlds for tonight."
      *   *When:* First 5 minutes (The Parking Lot).

  ---

  ### 6. The Final Check (Last 10 Minutes)

  Do not ask "What is SIA?" Ask them to apply the logic to a variant.

  **The Test Case:**
  "Okay, same Conference setup. 50/50 Prior. Small (10 people) vs. Large (1000 people).
  But now, there's a twist: **In the Small Conference, everyone gets a red badge. In the Large Conference, only 1 in 100 people gets a red badge.**
  You look down. **You have a red badge.**
  What are the odds now?"

  **The Solution:**
  *   **SSA:**
      *   P(Red | S) = 1 (10/10).
      *   P(Red | L) = 0.01 (10/1000).
      *   Ratio: 100:1 for **Small**.
  *   **SIA:**
      *   SIA weights by observer count first.
      *   Weighted S = 10 * 1 = 10.
      *   Weighted L = 1000 * 0.01 = 10.
      *   Ratio: 1:1 (**50/50**).
  *   **Why this works:** It shows SIA "cancelling out" the observer count with the empirical evidence. If they get this, they understand the machinery. If they say "SIA still says Large," they haven't got it.

  ---

  ### 7. What to Explicitly Refuse

  1.  **Resolving the Reference Class:** "We are stipulating the class for this session. Debating *who counts* is a separate seminar."
  2.  **Quantum Many-Worlds:** "If you bring up Everett branches, I'm fining you a drink. We are doing classical probability tonight."
  3.  **Ethics/Pascal's Mugging:** "We are doing epistemology, not ethics. Whether we *should* act on these probabilities is for next month."
  4.  **Sleeping Beauty Deep Dive:** "It's isomorphic, but it introduces memory loss which confuses the 'evidence' claim. We are sticking to Conference Attendees."

  ### Summary of the Whiteboard Plan

  *   **Left Side:** The Two Conferences (S=10, L=1000). The Bayes Calculation for SSA vs. SIA.
  *   **Center:** The Presumptuous Philosopher (Cosmology analog). The "Why it matters."
  *   **Right Side:** Marek's Objection (Identity vs. Indexical) & The Final Test (Red Badges).

  This structure respects the programmers' desire for clean variables, the biologists' understanding of selection bias, and the laypeople's need for a concrete bet. It keeps the "evidence" claim as the *explanation* for the bet, rather than the premise, which prevents early disengagement.
