answer: |-
  There is no single, canonical label for this specific maneuver in the literature (e.g., no equivalent to "The Naturalistic Fallacy" or "The Masked Man Fallacy"). However, your diagnosis is astute and maps onto a well-trodden fault line in the debate.

  In the technical literature, this is usually discussed under the rubric of **Negative vs. Positive Conceivability** (Chalmers) or the **Incomplete Imagination Objection** (Dennett, Papineau). But those terms name the *distinction* or the *objection*, not the rhetorical slide itself.

  Since you asked for a coinage with boundary conditions, I propose calling this **"Phenomenal Free-Riding"** (or more technically, **"Descriptive Load Shifting"**).

  Here is the breakdown of why this term fits, how it relates to existing frameworks, and the boundary conditions you requested.

  ### 1. The Existing Landscape
  You are correct that it isn't strictly equivocation (the term "zombie" remains stable) nor a classic Motte-and-Bailey (the conclusion doesn't change). It is best understood as a **scope ambiguity in the act of imagination**.

  *   **Chalmers' Framework:** Chalmers distinguishes *negative conceivability* (I cannot rule it out a priori) from *positive conceivability* (I can construct a coherent model). The move you noticed exploits the gap between these. The proponent uses *negative* conceivability (thin blueprint) to secure the modal claim, but relies on *positive* phenomenological intuition (thick experience) to secure the anti-physicalist punch.
  *   **Dennett's Critique:** Dennett argues this is simply "incomplete imagination." He claims that if you truly filled in the "thin" physical details, the "thick" intuition of absence would vanish. The proponent is essentially asking the interlocutor to imagine a functional shell while *feeling* the absence of a ghost, without accounting for how the ghost is supposed to be missing in the shell.

  ### 2. The Coinage: "Phenomenal Free-Riding"
  **Definition:** A fallacious or question-begging move in modal arguments where the proponent secures the *possibility* of a scenario via an under-specified (thin) description, but secures the *significance* of that scenario via a fully-specified (thick) phenomenological intuition, without justifying the transition between the two.

  **Why "Free-Riding"?**
  The strong intuition (the "hollow" feeling) is doing the heavy lifting for the conclusion, but it is being carried by a modal base that is too weak to support it. The intuition "rides for free" on a description that doesn't actually contain enough information to generate that intuition legitimately.

  ### 3. Boundary Conditions
  To ensure this term is philosophically useful and not just a label for "bad arguments," here are the necessary conditions for **Phenomenal Free-Riding**:

  1.  **Modal Structure:** The argument must move from Conceivability $\to$ Metaphysical Possibility $\to$ Ontological Conclusion (e.g., Anti-Physicalism). It does not apply to empirical arguments.
  2.  **Descriptive Asymmetry:** There must be a shift in the *granularity* of the description.
      *   *Phase A (Defense):* The scenario is described coarsely (functional/structural) to avoid contradiction.
      *   *Phase B (Offense):* The scenario is intuited finely (phenomenal/qualitative) to generate the explanatory gap.
  3.  **Phenomenal Payload:** The argument must rely on a property that is ostensibly "thick" or first-personal (e.g., *qualia*, *what-it-is-like-ness*). This distinguishes it from general modal errors.
      *   *Example where it applies:* Zombies, Inverted Spectrum.
      *   *Example where it does NOT apply:* Imagining a world without gravity. (Here, the thin description "no $G$" supports the thick intuition "things float" without a gap, because gravity lacks a phenomenal "inner glow" that needs to be subtracted).
  4.  **Unjustified Transition:** The proponent offers no account of how the thin description licenses the thick intuition. If they provide a bridge principle (e.g., "Functional isomorphism guarantees phenomenal identity"), they are no longer free-riding; they are making a substantive claim that can be debated. The fallacy lies in *hiding* the need for that bridge.

  ### 4. Why this matters for your work
  If you use this term, it allows you to pinpoint exactly where the zombie argument fails without getting bogged down in the semantics of "conceivability."

  It shifts the burden of proof: Instead of you having to prove zombies are *inconceivable*, you simply point out that the proponent is **Phenomenal Free-Riding**. They must either:
  1.  **Thicken the Base:** Conceive the full quantum state (which makes conceivability much harder/contested).
  2.  **Thin the Intuition:** Admit their intuition of "hollowness" is based on the thin blueprint (which makes the intuition much weaker/less compelling).

  ### Summary
  While you will find discussions of this in Dennett's *Quining Qualia* or Papineau's *The Refutation of Physicalism*, there is no standard noun for the slide itself. **"Phenomenal Free-Riding"** captures the economic structure of the error (getting high-value intuition for low-cost conceivability), and the boundary conditions restrict it to consciousness debates where the phenomenology is the primary lever of the argument.
