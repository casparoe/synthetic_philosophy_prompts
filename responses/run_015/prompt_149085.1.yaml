  **MEMORANDUM**

  **TO:** Curriculum Committee Members
  **FROM:** Committee Chair
  **SUBJECT:** Draft Joint Statement: Situationism, Virtue, and Curriculum Design
  **DATE:** October 26, 2023

  The following text is a draft joint statement intended to resolve the two-year impasse regarding the empirical status of virtue ethics in our curriculum. It synthesizes the Situationist critique (Harman/Doris) and the Neo-Aristotelian response (Niche Construction/Selection). It is designed to be signable by both parties while preserving the substantive philosophical distinctions necessary for pedagogical clarity.

  ***

  ### I. Agreed Claims (Common Ground)

  Both parties endorse the following empirical and normative premises for the purpose of curriculum design:

  1.  **Empirical Baseline:** We agree that the social-psychological literature demonstrates that raw, cross-situational behavioral consistency is significantly lower than folk-psychological intuition suggests. Neither party claims consistency is literally zero, but both agree it is insufficient to support a naive "global trait" model.
  2.  **Linguistic Precision:** We agree that virtue language must not be used sloppily. Attributing a character trait to a student or professional based on a single action or a narrow context is empirically unjustified and pedagogically harmful.
  3.  **Situational Power:** We agree that situational variables (authority, fatigue, anonymity, incentives) are potent predictors of behavior and that ethical training must include literacy in recognizing these variables.
  4.  **Normative Goal:** We agree that the ultimate goal of the curriculum is the reduction of unethical behavior and the promotion of human flourishing, regardless of whether the mechanism is labeled "character building" or "situation design."

  ### II. Statement of Disagreements

  The following table outlines the remaining divergences. Each description is phrased to be acceptable to the proponent of that view.

  | Domain | **Situationist Position** | **Neo-Aristotelian Position** |
  | :--- | :--- | :--- |
  | **Ontology of Traits** | "Global character traits" (robust, cross-situational dispositions) are empirically unsupported fictions. What exists are *local* habits tied to specific contexts. | Traits are real but are best understood as *diachronic capacities for niche construction*. The trait is not just acting well at $t_1$, but the capacity to structure one's life to minimize moral risk over time. |
  | **Locus of Intervention** | Ethical improvement is primarily an engineering problem. We should focus resources on redesigning institutional structures and choice architectures to make virtue unnecessary or automatic. | Ethical improvement is primarily a developmental problem. We must cultivate the agency required to select and maintain healthy niches. Structure matters, but only agents can sustain structure. |
  | **Predictive Utility** | Knowing a person's "character" adds negligible predictive power once the situational variables are known. | Knowing a person's history of *situation selection* adds significant predictive power regarding where they will be and how they will act in the future. |

  ### III. Verdict: Verbal vs. Genuine Disagreement

  **Verdict:** The dispute is **30% verbal and 70% genuine.**

  *   **Verbal Component:** Much of the friction stems from the definition of "trait." If the Situationist defines *trait* as "invariant behavioral output across heterogeneous situations," the Neo-Aristotelian agrees traits do not exist. However, the Neo-Aristotelian defines *trait* as "a stable disposition to manage situational inputs." Once this definition is explicit, the contradiction dissolves. The Situationist should concede that the Neo-Aristotelian is not defending the folk-psychological view the Situationist attacks.
  *   **Genuine Component:** The remaining disagreement is empirical and normative. It concerns whether the capacity for "niche construction" is itself a stable, trainable individual difference (a virtue) or merely another situational variable. It also concerns whether ethical theory should aim for a world where virtue is *unnecessary* (Situationist ideal) or a world where virtue is *robust* (Neo-Aristotelian ideal).

  ### IV. Three Cruxes: Tests and Pre-Registered Predictions

  To move forward, we identify three empirical/theoretical cruxes. Both parties agree to the following tests and commit to the predictions listed below.

  **Crux 1: Residual Variance in Experience Sampling**
  *   **The Test:** A pre-registered experience-sampling study where situations are independently coded for ethical demand. We measure whether between-person variance predicts behavior in *new*, differently-coded situations after controlling for situational variables.
  *   **Situationist Prediction:** Once situational variables (stress, authority, reward) are controlled, residual between-person variance will be statistically negligible (<5%). "Character" adds no predictive value.
  *   **Neo-Aristotelian Prediction:** Residual between-person variance will remain significant, specifically correlated with the subject's *prior* history of avoiding high-risk situations. The "trait" predicts the *context* the agent inhabits, which in turn predicts the act.

  **Crux 2: The Agency Presupposition in Design**
  *   **The Test:** Analysis of a successful "nudge" or situation-design program (e.g., automatic enrollment in ethics compliance). We ask: Does this program function if agents actively drift toward or away from the architecture?
  *   **Situationist Prediction:** Situation design works *regardless* of agent selection. We can lock the environment such that agency is irrelevant. The success of the program does not presuppose stable agent preferences.
  *   **Neo-Aristotelian Prediction:** Any sustainable design presupposes agents who do not actively sabotage the architecture. Situationism quietly relies on a "selectionist story": agents must have a stable enough preference for compliance to *stay* in the designed situation. If they lack this, they will exit the niche.

  **Crux 3: Virtue as a Regulative Ideal**
  *   **The Test:** A case study where ethical behavior is statistically rare (e.g., whistleblowing where <5% comply).
  *   **Situationist Prediction:** If <5% instantiate the behavior, labeling it a "virtue" is misleading. It should be labeled a "structural incentive problem." Normative work should focus on making whistleblowing unnecessary or safe, not praising the 5%.
  *   **Neo-Aristotelian Prediction:** Even if <5% instantiate it, it remains a valid regulative ideal. The rarity demonstrates the difficulty of the niche construction required, not the emptiness of the concept. The 5% prove the capacity exists and can be modeled for training.

  ### V. Required Concessions and Characterization Flags

  **Concessions Required:**
  1.  **To the Situationist:** You must concede that the "Niche Construction" reply is not a mere semantic dodge. It is a substantive hypothesis about moral psychology that aligns with ecological models of agency. You cannot dismiss it simply because it redefines "trait"; you must test the predictive power of *selection behavior*.
  2.  **To the Neo-Aristotelian:** You must concede that the folk-psychological view of character (the "honest person never lies, even under extreme duress") is empirically dead. You cannot use the Situationist's data selectively. If you claim traits exist, you must accept that they are fragile, context-dependent, and heavily reliant on environmental scaffolding.

  **Characterization Flags:**
  *   **Flag on Situationist Portrayal:** The draft above characterizes the Situationist as believing structure can work "regardless of agent selection." In reality, sophisticated Situationists (like Doris) acknowledge agents have preferences. *Correction:* The disagreement is not whether agents have preferences, but whether those preferences are stable enough to be called "virtues" or whether they are just more situational outputs.
  *   **Flag on Neo-Aristotelian Portrayal:** The draft characterizes the Neo-Aristotelian view as "diachronic situation-selection." This is fair, but it risks ignoring the *internal* phenomenological component of virtue (practical wisdom/phronesis). *Correction:* Ensure the curriculum does not reduce virtue *only* to external selection; it must also address the cognitive processing that leads to selection.

  ***

  **Chair's Note:** Sign this statement. It allows us to teach the Situationist critique as a necessary correction to naive virtue ethics, while teaching the Neo-Aristotelian response as the constructive path forward for professional formation. We will build the module around Crux 2, as it has the most direct implication for compliance training.
