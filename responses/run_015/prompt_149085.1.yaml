prompt: |-
  Two people on the professional-ethics curriculum committee I chair have been going at it for two years over the situationist critique of virtue ethics, and I want the joint statement they should have produced instead of another round of emails. Rough version of the two views: the situationist says the social-psychology literature (the Harman / Doris line) shows there are no robust global character traits, so virtue talk is empirically empty and the real upshot is that we should redesign situations; the neo-Aristotelian says traits are real but their behavioural signature isn't cross-situational consistency at a moment, it's diachronic situation-selection — the honest agent is the one who over time ends up in fewer situations where cheating is cheap or tempting, and who shapes the situations she's in — call it the niche-construction reply.

  Give me: the claims both can sign (both grant that raw cross-situational consistency in single acts is low, neither thinks it's literally zero, both grant trait language can't be used sloppily); then the disagreements, each in wording that side would accept for its own view; then a straight verdict on which parts of this are verbal — a fight about the word trait — and which are genuine. Three cruxes, each with a test or case both agree would bear on it and each person's prediction written down in advance: (1) a pre-registered experience-sampling study with independently coded situations, where the question is whether residual between-person variance still predicts behaviour in new, differently-coded situations; (2) whether any program of situation-design has to presuppose agents who drift toward or away from certain kinds of situation, i.e. whether situationism quietly needs the selectionist story; (3) whether virtue can keep doing normative work as a regulative ideal even if almost nobody instantiates it. Numbered agreed claims first, then a disagreements table. Be committed about who should concede what, and flag anywhere I've characterised one of the two unfairly.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a professional-ethics curriculum committee.
      *   **Task:** Draft a joint statement for two committee members who have been feuding for two years.
      *   **The Conflict:** Situationist Critique of Virtue Ethics (Harman/Doris) vs. Neo-Aristotelian Response (Niche Construction/Diachronic Selection).
      *   **Key Positions:**
          *   *Situationist:* Social psych shows no robust global traits $\rightarrow$ virtue talk empirically empty $\rightarrow$ focus on redesigning situations.
          *   *Neo-Aristotelian:* Traits exist but aren't cross-situational consistency at $t_1$; they are diachronic situation-selection (niche construction). Honest agents avoid tempting situations over time.
      *   **Required Output:**
          1.  Agreed Claims (common ground).
          2.  Disagreements Table (worded so each side accepts their own description).
          3.  Verdict on Verbal vs. Genuine Disagreement.
          4.  Three Cruxes with Tests/Cases and Pre-registered Predictions.
          5.  Commitment on concessions and flagging unfair characterizations.
      *   **Tone:** Professional, precise, philosophical but actionable (curriculum committee context).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Situationism:* Relies on experiments like Milgram, Stanford Prison, Darley & Batson (Good Samaritan). Claims behavior is driven by situational variables, not internal character. If traits don't predict behavior across diverse situations, "virtue" is a fiction.
      *   *Neo-Aristotelian (Niche Construction):* Accepts the data (consistency is low *across random situations*) but redefines the trait. A virtue isn't just "doing the right thing when put in a random spot"; it's "managing your life so you aren't in spots where you'd fail." This aligns with modern dual-process theories and ecological psychology.
      *   *The Tension:* Is the Neo-Aristotelian moving the goalposts (verbal dispute) or offering a deeper empirical model (genuine dispute)?

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the overlap.
      *   *Empirical:* Both agree raw cross-situational consistency is lower than folk psychology assumes. Neither says it's zero (that would be absurd).
      *   *Normative:* Both agree we need to improve ethical behavior.
      *   *Language:* Both agree "virtue" shouldn't be used loosely (e.g., assuming one honest act means an honest person).
      *   *Curriculum:* Both likely agree students need to understand situational pressures.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to phrase these neutrally but accurately.
      *   *Point 1: Empirical Validity of Traits.* Situationist: Traits are folk fictions. Neo-Arist: Traits are complex capacities including selection.
      *   *Point 2: Primary Locus of Intervention.* Situationist: Fix the environment first. Neo-Arist: Fix the agent's capacity to select environments (which *is* the virtue).
      *   *Point 3: Definition of Virtue.* Situationist: Behavioral consistency across varying contexts. Neo-Arist: Diachronic stability of moral identity via niche construction.

  5.  **Drafting Section 3: Verbal vs. Genuine:**
      *   *Verbal:* What do we mean by "trait"? If Situationist means "fixed disposition to act X in context Y regardless of Z" and Neo-Arist means "disposition to manage contexts Y and Z," they might just be defining words differently.
      *   *Genuine:* Does the niche construction mechanism actually exist empirically? Do people *actually* successfully select niches? Is the predictive power of "selection tendency" significant enough to warrant the label "virtue"?
      *   *Verdict:* It's partially verbal (definition of trait) but largely genuine (mechanism of moral improvement).

  6.  **Drafting Section 4: Three Cruxes (Tests/Cases):**
      *   *Crux 1: Residual Variance.* (The Experience Sampling request).
          *   *Test:* ESM study, coded situations.
          *   *Situationist Prediction:* Once situation variables are controlled, between-person variance drops to noise.
          *   *Neo-Arist Prediction:* Significant between-person variance remains, specifically correlated with *prior* situation selection history.
      *   *Crux 2: Presupposition of Agency.* (The "Situationism needs Selection" argument).
          *   *Test:* Designing a "nudge" program.
          *   *Situationist Prediction:* We can design situations without assuming agents have stable selection preferences; we just manipulate the architecture.
          *   *Neo-Arist Prediction:* Any successful design relies on agents having some stable preference to *stay* in the improved architecture (otherwise they drift back).
      *   *Crux 3: Normative Work.* (The Regulative Ideal).
          *   *Test:* A case where a virtue is statistically rare (e.g., whistleblowing).
          *   *Situationist Prediction:* If <5% do it, calling it a "virtue" misleads; call it a "structural incentive problem."
          *   *Neo-Arist Prediction:* Even if <5% do it, it remains a valid ideal for cultivation; the rarity proves the need for training, not the absence of the trait.

  7.  **Drafting Section 5: Concessions & Characterization Check:**
      *   *Concessions:* Situationist must concede that "niche construction" is a real psychological phenomenon. Neo-Arist must concede that folk "character" is empirically unsupported.
      *   *Characterization Check:* The prompt characterizes the Neo-Aristotelian view as "niche-construction." This is a fair and sophisticated reading (akin to Snow or Miller). The Situationist view is standard Doris/Harman. No major unfairness detected, though the Situationist view is sometimes more nuanced about "local" traits. I should note that.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it chair-like? Yes, authoritative but facilitating consensus.
      *   *Constraint Check:* Did I include numbered agreed claims? Yes. Disagreements table? Yes. Verdict? Yes. Three cruxes with predictions? Yes. Concessions/Flags? Yes.
      *   *Philosophical Accuracy:* Ensure the "niche construction" argument isn't dismissed as a mere definitional dodge. It's a substantive claim about moral psychology. Ensure the Situationist isn't painted as a determinist; they believe in *design*, just not *character*.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Verdict" section is punchy. Don't sit on the fence too much. The prompt asks me to "Be committed about who should concede what."
      *   *Decision:* The Neo-Aristotelian has the stronger empirical defense *if* they accept the burden of proving selection effects. The Situationist must concede that "situation redesign" presupposes some agency.
      *   *Formatting:* Use clear headers and a table for the disagreements.

  10. **Final Output Generation** (Proceeding to generate response based on these steps).
