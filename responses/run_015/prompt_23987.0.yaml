prompt: |-
  I'm a backend software engineer with no formal philosophy background. I've been reading popular and semi-technical writing on evolution for a while — mostly Dawkins, some Hamilton, and a bit of the writing on the group-selection versus kin-selection debate — and I've been trying to write down where I actually land on the units-of-selection question so I can see whether my views hang together. I'd like a consistency check before I commit to a position. Here's my current set of commitments:

  (1) The gene is the fundamental unit of selection. Genes are what get faithfully copied across generations, so that's where selection "really" acts; everything else is a shadow of gene-level dynamics.

  (2) Group selection is a dead end. The cheater problem (free-riders within a group) means groups of altruists get outcompeted by groups of cheaters, so you can't have stable group-level altruism. Any case that looks like group selection is really kin selection in disguise.

  (3) Individual (organism-level) selection is the main engine of adaptation. Most adaptation is individuals competing against each other, and the organism is the level at which most selection gradients are strongest.

  (4) Altruism is fully explained by kin selection / inclusive fitness. Hamilton's rule (rB > C) is the whole story: you help relatives because they carry copies of your genes.

  (5) Cultural evolution — norms, institutions, memes — runs on the same machinery as genetic evolution, just with a different replicator (the meme instead of the gene).

  Please audit this set for me. I want a consistency check, not a lecture. Specifically:

  - Which pairs of these commitments are actually in tension, and which only look like they are? I'm not sure how many of the apparent conflicts are real, and I don't want to be told in advance which are category errors on my part.
  - For each genuine tension, what is the cheapest revision that restores consistency, and what does that revision cost (i.e., what do I have to give up)?
  - Please order the tensions by severity rather than listing them all as equally bad.
  - I don't know where the problem is, and I don't want to be told which one I should give up — I want to understand the structure of the tensions so I can decide for myself.
