      *   Actually, the tension between (2) and (5) is the strongest. If memes evolve via groups, and memes interact with genes (gene-culture coevolution), then group-level effects *must* exist in the total system. If (2) says group selection is impossible *in principle* due to cheating, but (5) says culture evolves (which obviously involves groups), there is a contradiction unless the "cheating" mechanism is different.

