answer: |-
  The Two-Envelope Paradox is often misdiagnosed as a problem of physical symmetry or epistemic uncertainty regarding the envelopes themselves. However, the paradox is not defeated by the physical indistinguishability of the envelopes. Instead, it is resolved by recognizing that the standard expected-value argument relies on a mathematically incoherent assumption: it implicitly assumes a uniform probability distribution over an infinite range of values.

  The flaw lies in the failure to specify a **proper prior distribution** over the total amount of money. The argument collapses when one distinguishes between proper and improper priors, specifically regarding how the probability of holding a specific amount $a$ relates to the probability of holding $a/2$ or $2a$.

  ### 1. The Failure of the Indistinguishability Argument
  The argument that "the envelopes are indistinguishable, therefore switching makes no difference" is intuitively correct but mathematically insufficient to resolve the paradox. Physical indistinguishability justifies the initial probability of 1/2 that you picked the envelope with the larger amount *before* any values are considered.

  However, the paradox arises from the calculation of the expected value of the *other* envelope ($B$) given the amount in your envelope ($A=a$). The flawed logic asserts:
  $$E[B | A=a] = \frac{1}{2}(2a) + \frac{1}{2}\left(\frac{a}{2}\right) = 1.25a$$
  This calculation assumes that for *any* value $a$, the probability that $a$ is the smaller amount ($X$) is equal to the probability that $a$ is the larger amount ($2X$). Physical indistinguishability does not justify this assumption; it is a probabilistic claim about the distribution of money, not the physics of the envelopes.

  ### 2. Improper vs. Proper Priors
  To evaluate the probability that $a$ is the smaller or larger amount, we must define a prior distribution $P(X)$ for the smaller amount $X$.

  **Improper Priors (The Source of the Paradox)**
  The standard paradox implicitly assumes an **improper prior**, specifically a uniform distribution over the range $[0, \infty)$. In this scenario, the probability density is constant, implying that any amount is equally likely.
  *   Under an improper prior, the expected value of the money in the envelopes is infinite ($E[A] = \infty$).
  *   Comparing $E[B]$ to $E[A]$ becomes a comparison of infinities. While the calculation $1.25a$ appears valid locally, it is derived from a distribution that cannot be normalized. The paradox exists only because we are treating an impossible distribution (infinite uniform) as if it were valid.

  **Proper Priors (The Resolution)**
  In any physically realizable scenario, the total amount of money is finite. This requires a **proper prior**, where the probabilities sum (or integrate) to 1.
  *   For a distribution to be proper over an infinite range, the probability density must decay as the amount increases (e.g., a geometric or exponential distribution).
  *   Consequently, it is impossible for $P(X=a)$ to equal $P(X=a/2)$ for all values of $a$. As $a$ increases, the probability that $a$ is the smaller amount must decrease relative to the probability that it is the larger amount.

  ### 3. The Bounded Case and Calculation Change
  The resolution becomes explicit when we consider a **bounded case**, where there is a maximum possible amount $M$ in the smaller envelope.

  If you open your envelope and see an amount $a > M$, you know with certainty that $a$ is the larger amount ($2X$), because $X$ cannot exceed $M$. Therefore, the other envelope must contain $a/2$.
  *   **The Calculation:** If $a$ is large (close to the upper bound of the distribution), the term $P(X=a)$ becomes negligible compared to $P(X=a/2)$.
  *   The expected value calculation shifts from $1.25a$ to something strictly less than $a$:
      $$E[B | A=a] \approx \frac{a}{2}$$
  This loss for large values of $a$ exactly cancels out the gain ($1.25a$) for small values of $a$. When integrated over the entire proper distribution, the expected gain from switching is zero.

  ### 4. The Precise Point of Symmetry Breaking
  The apparent symmetry between the envelopes is genuinely broken at the moment the specific value $a$ is evaluated against the **shape of the prior distribution**.

  The standard argument assumes symmetry holds conditionally: $P(\text{smaller}|a) = P(\text{larger}|a) = 0.5$. This is false for any proper prior.
  *   **Symmetry Breaking Mechanism:** The value $a$ provides information. If the prior distribution is decreasing (as all proper priors must be), observing a large $a$ makes it more probable that you are holding the larger envelope ($2X$) than the smaller one ($X$).
  *   **Conclusion:** The symmetry is not broken by the envelopes' physical properties, but by the statistical fact that large numbers are rarer than small numbers. The "gain" from switching when holding a small amount is perfectly offset by the "loss" from switching when holding a large amount, once the prior distribution is correctly applied.
