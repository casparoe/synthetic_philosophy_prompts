answer: |-
  1. The purity framing mischaracterizes the core motive, which is respecting persons as ends in themselves rather than maintaining personal cleanliness. A defender would wince at reducing duty to selfish spiritual hygiene instead of obligation toward others.
  2. Deontology does not necessarily force you to sit back, as many versions include positive duties to protect the innocent from harm. It is flat wrong to claim the theory mandates passivity when preventing violation is itself a moral requirement.
  3. Side-constraints are not mere excuses for vanity but reflect the distinct moral status of individuals who cannot be used as mere means. Dismissing them as linguistic tricks ignores their function in protecting individual rights against aggregate utility calculations.
  4. While the hundred-people-lie case is a standard stress test, it oversimplifies how conflicting duties are weighed within complex deontological systems. Claiming this proves inconsistency ignores that some theories accept tragic outcomes as the cost of respecting rights.
  5. The vanity conclusion does not logically follow because prioritizing rules over outcomes stems from respect for victims, not self-admiration. Calling it vanity is flat wrong because it conflates adherence to principle with selfish concern for one's own moral record.
