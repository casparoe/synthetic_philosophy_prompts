  The proposition I want your credence on: in that version Maya still knows the ferry runs at 4:15 — practical facts the subject can't detect and that bear on neither her evidence nor her alternatives don't touch whether she knows, and whatever pull there is toward denying knowledge comes from something else.

  I'm at about 0.6; a friend who's sympathetic to pragmatic encroachment is at 0.2. Give me your number, but mainly the decomposition, with a number and one line of support for each term: how much rides on whether pragmatic encroachment is true at all in ordinary high-stakes cases where the subject does know the stakes; how much on whether encroachment, if real, works by raising a justificatory threshold directly rather than by shifting which error-possibilities count as relevant; how much on whether stakes come in through the subject's own practical situation at all as opposed to what's at issue in the ascriber's context; how much on whether judgments in cases like mine are tracking the knowledge predicate or some neighbour like whether it's fine for Maya to act or assert; and whatever other term you think belongs. Then how you combine them. Then: which term are you least confident in and what would shift it, whether it matters that the hidden stakes are a stranger's rather than Maya's, and which single term you'd bet is where me and my friend actually disagree.
