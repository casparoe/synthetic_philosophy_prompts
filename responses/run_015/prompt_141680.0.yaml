answer: |-
  0.82

  **Decomposition**

  1.  **0.30 — Pragmatic Encroachment Existence:** Highest weight because if knowledge is insensitive to stakes generally (0.9 credence), the verdict is fixed regardless of case details.
  2.  **0.20 — Encroachment Mechanism:** If encroachment exists, it likely shifts relevant alternatives rather than justification thresholds, which hidden stakes cannot alter (0.8 credence).
  3.  **0.20 — Locus of Stakes:** Knowledge norms typically track the subject's practical situation, not third-party needs, making stranger stakes irrelevant (0.9 credence).
  4.  **0.20 — Knowledge vs. Neighbouring Norms:** Intuitions denying knowledge here often track assertion propriety rather than epistemic state, though experimental data is mixed (0.6 credence).
  5.  **0.10 — Epistemic Supervenience:** Epistemic status should not depend on external facts completely inaccessible to the subject's cognitive system (0.9 credence).

  **Combination**
  I calculate a weighted average of the sub-credences assigned in each support line (the probability that the factor favors "Maya Knows"). Summing the products of weight × sub-credence (0.27 + 0.16 + 0.18 + 0.12 + 0.09) yields the total 0.82.

  **Least Confident Term**
  Term 4 (Knowledge vs. Neighbouring Norms). This would shift with clearer experimental philosophy data disentangling knowledge attributions from assertions in third-party stake cases; currently, folk intuitions conflate them too easily to be certain.

  **Stranger's Stakes**
  Yes, it matters decisively. Pragmatic encroachment derives its plausibility from the link between knowledge and rational action; since hidden stranger stakes cannot affect Maya's rational action, the primary motivation for encroachment evaporates here.

  **Disagreement Location**
  Term 1 (Pragmatic Encroachment Existence). Your friend's 0.2 credence suggests they accept stakes-sensitivity as a foundational principle, whereas your 0.6 suggests you treat it as false or limited; this metaphysical commitment drives the divergent case judgments.
