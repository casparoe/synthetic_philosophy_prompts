answer: |-
  **Preamble: Discarded Candidates**
  Before specifying adequacy, I discard three common proposals. First, *Strict Transitivity over Time*: this ignores legitimate preference reversal due to learning or growth, falsely labeling development as inconsistency. Second, *Universal Dynamic Consistency*: this demands an agent stick to past plans even when new information or endogenous change renders them obsolete, conflating stubbornness with rationality. Third, *Binary Rationality Verdicts*: this treats a ten-cent loss the same as financial ruin, failing to distinguish trivial slips from structural defects. These are rejected because they fail the advisory job: they cannot distinguish between a agent who needs help and one who simply changed her mind.

  **The Third Job**
  While the critical and advisory jobs are explicit, a third job matters more: the *constitutive* job. A theory of diachronic rationality must explain what makes an agent a unified entity over time rather than a sequence of person-stages. Without this, critique lacks a target and advice lacks a recipient. The requirements below prioritize this unity.

  **The Feasibility Filter and Requirements**
  The money pump is the engine of argument, but your six cases show immunity is too blunt. The *Subsidized* and *Fragmented* pumps show that loss alone is insufficient; there must be a feasible, profitable exploiter. The *Vanishing-step* pump shows physical impossibility negates defect. The *Instructive* and *Anticipatory* pumps show that preference change via learning or achievement is not a defect. The *Solitary* pump shows internal inconsistency matters even without outsiders.

  This yields a **Feasible Profitability Filter**: vulnerability counts against an agent only if a single counterparty could physically and profitably execute the pump given available information. This filters out spurious contradictions. From this and the non-pump considerations, I derive five requirements:

  1.  **Feasible Exploitability:** A theory must not label an agent irrational unless she is vulnerable to a physically possible, profitable pump. (Motivated by Subsidized/Fragmented/Vanishing). *Status: Non-negotiable.*
  2.  **Dynamic Consistency modulo Learning:** An agent is irrational only if she violates a prior plan without new information or legitimate endogenous preference change. (Motivated by Instructive/Anticipatory). *Status: Non-negotiable.*
  3.  **Joint Followability:** Recommendations issued at $t_1$ and $t_2$ must be compossible for a single agent with ordinary capacities. (Motivated by Advisory job). *Status: Negotiable.*
  4.  **Endogenous Sensitivity:** The theory must model preferences as functions of prior choices, not fixed parameters. (Motivated by non-pump considerations). *Status: Non-negotiable.*
  5.  **Gradational Verdicts:** Assessments of irrationality must track the magnitude of loss or conflict, not merely its presence. (Motivated by Vanishing-step). *Status: Prejudice of bounded rationality camp.*

  **Incompatibility and Resolution**
  I suspect **Joint Followability** and **Endogenous Sensitivity** cannot be jointly satisfied in strong forms. If preferences are genuinely shaped by choices (Endogenous Sensitivity), a plan made at $t_1$ may be unintelligible to the agent at $t_2$ who has become a different kind of person. Enforcing Joint Followability would require the agent to ignore her current values (Resolute Choice), violating the constitutive job of respecting agency.

  I would drop **Joint Followability** in its strict form. A theory demanding an agent execute a plan she no longer values treats her as a vessel for past desires rather than a continuing agent. The resulting theory is a **Sophisticated Planning** view: it advises agents to plan only where preferences are stable, and treats plan revision upon endogenous change as rational, not irrational. It sacrifices some advisory power (cannot always promise future compliance) to preserve agent unity.

  **The Most Exclusionary Requirement**
  **Feasible Exploitability** excludes the most candidate theories. Standard Dutch Book and Money Pump arguments often assume costless trading, perfect coordination among exploiters, or infinite steps. Rejecting these idealizations kills many classic arguments for probabilistic coherence and transitivity. I defend this because rationality is a property of bounded agents in a physical world. A theory that labels agents irrational for failing to avoid physically impossible traps is not a theory of rationality; it is a theory of logical omniscience. It fails the critical job by over-generating verdicts of irrationality for normal humans.

  **Theory Comparison**

  | Theory | Feasible Exploitability | Dynamic Consistency (mod Learning) | Endogenous Sensitivity | Gradational Verdicts |
  | :--- | :---: | :---: | :---: | :---: |
  | **Myopic Choice** (Momentary prefs) | Pass | Fail | Fail | Fail |
  | **Sophisticated Choice** (Anticipates prefs) | Pass | Pass | Partial | Fail |
  | **Resolute Choice** (Stick to plan) | Pass | Fail | Fail | Fail |
  | **Global Preferences** (Life-span utility) | Pass | Pass | Partial | Fail |
  | **Reasons-Responsiveness** (Belief/Desire update) | Pass | Pass | Pass | Pass |

  *Scoring: Pass = adequately handles; Fail = violates requirement.*

  **Epistemic Note**
  *   **Feasible Exploitability:** Confident. Physical constraints are real.
  *   **Dynamic Consistency modulo Learning:** Confident. Learning changes norms.
  *   **Endogenous Sensitivity:** Inclined. Hard to model, but necessary.
  *   **Gradational Verdicts:** Inclined. Binary switches seem artificial.
  *   **Joint Followability (Dropped):** Guessing. Maybe a weaker version holds.

  The claim I am least confident about is **Gradational Verdicts**. It is possible that rationality is binary: you are either coherent or incoherent, and the magnitude of loss is merely a pragmatic concern, not a rational one. If I were shown a formal proof that gradational rationality leads to self-undermining decision rules (e.g., choosing to be less rational to gain money), I would drop this requirement and accept that rationality is a threshold concept, leaving the magnitude of loss to prudential theory rather than rational theory.
