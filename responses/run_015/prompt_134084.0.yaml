answer: |-
  # The Rawlsian Planning Filter (RPF)
  **Internal Guidance Note: Decision Procedure for Mixed-Tenure Schemes**

  **Purpose:** To cut through the noise of viability assessments and design statements by applying a consistent ethical test to mixed-tenure applications. This is not a replacement for the Local Plan, but a sanity check on the *fairness* of the trade-offs.

  **Core Concepts (Simplified):**
  1.  **Primary Goods:** In our council, these are **Income/Wealth**, **Daylight/Sunlight**, and **Walking-Distance Healthcare**. A proposal must not reduce access to these for the least advantaged unless it strictly meets condition 3 below.
  2.  **The Veil of Ignorance:** You must assess the scheme as if you did not know which unit you would occupy, or which neighbour you would be.
  3.  **The Difference Principle:** Inequality (e.g., luxury vs. affordable units) is only permitted if that inequality is *necessary* to make the least advantaged group better off than they would be otherwise.

  ---

  ## The Procedure

  Run these four steps in order. If you hit a **STOP**, you draft a Refusal. If you hit **ESCALATE**, you write a Report for Committee. If you pass all steps, you draft Approval (subject to conditions).

  ### Step 1: The Primary Goods Audit
  **Question:** Does the proposal reduce access to any of the three Primary Goods (Income, Daylight, Healthcare) for any existing residents or future occupants of the affordable units?
  *   **Sufficient Answer:** "No reduction," or "Reduction is negligible and within national standards."
  *   **Stop (Refusal):** If the scheme significantly reduces daylight or healthcare access for *existing* vulnerable residents (e.g., council estates, care homes) without mitigation.
  *   **Note:** Market-rate buyers losing a view does not count. They are not the "least advantaged."

  ### Step 2: The Veil Test (Quality Parity)
  **Question:** If you were assigned a unit at random (1 in 10 chance of affordable, 9 in 10 chance of market), would you accept the build quality, aspect, and entrance?
  *   **Sufficient Answer:** "Yes. Affordable units are tenure-blind in appearance, have comparable aspect ratios, and do not face exclusively north or into blank walls."
  *   **Stop (Refusal):** If affordable units are visibly segregated, have significantly poorer daylight access than market units, or are designated as "less desirable" plots (e.g., next to bin stores or plant rooms).
  *   **Escalate (Committee):** If the design is equal, but the *location* of the affordable units clusters them away from amenities (e.g., all affordable units are in the block furthest from the bus stop). This is a value judgement on social segregation.

  ### Step 3: The Difference Principle (Viability & Necessity)
  **Question:** Is the inequality (the profit from the market units) *strictly necessary* to deliver the affordable element?
  *   **Sufficient Answer:** "Yes. Open-book financial viability assessment proves that without the market-rate cross-subsidy, zero affordable units could be built, and the site would remain derelict."
  *   **Stop (Refusal):** If the developer claims they need 80% market rate to fund 20% affordable, but comparable schemes in the area deliver 40% affordable with similar market rates. The inequality is not *necessary*; it is greed.
  *   **Escalate (Committee):** If the viability data is contested. Determining the "necessary" level of profit is a political decision on how much public subsidy (via planning concessions) we give private profit.

  ### Step 4: The Political Handoff (Conflicting Goods)
  **Question:** Does the proposal trade one Primary Good against another? (e.g., Better Healthcare Access vs. Worse Daylight).
  *   **Sufficient Answer:** N/A.
  *   **Escalate (Committee):** **Always.** Rawls does not rank Primary Goods against each other. Deciding whether "Healthcare Access" outweighs "Daylight" is a value judgement for elected members, not officers.
  *   **Stop:** If one Good is improved and none are harmed.

  ---

  ## Case Study Run-Throughs

  ### Case 1: The Canal Lock Regeneration
  **Proposal:** Derelict industrial lock site. 90% Luxury Flats, 10% Affordable Rent.
  **Context:** Site has been empty for 15 years. No existing residents.

  *   **Step 1 (Primary Goods):** No existing residents to lose daylight or healthcare. Future affordable tenants gain housing (Income/Wealth good).
      *   *Result:* Pass.
  *   **Step 2 (Veil Test):** Affordable units are mixed throughout the block, same brickwork, same ceiling heights.
      *   *Result:* Pass.
  *   **Step 3 (Difference Principle):** Developer argues the cost of decontaminating the canal lock is so high that only a 90% luxury scheme makes the 10% affordable viable. Without this scheme, the site remains derelict (0% affordable).
      *   *Analysis:* The inequality (90% luxury) directly benefits the least advantaged (who get 10% units instead of 0%). The inequality is *necessary* to unlock the site.
      *   *Result:* Pass.
  *   **Step 4 (Conflicting Goods):** None.
      *   *Result:* Pass.

  **RPF Outcome:** **Recommend Approval.**
  **The Uncomfortable Truth:** You are recommending approval for a scheme that is 90% luxury. Standard policy might demand 30-40%. However, under this procedure, the "least advantaged" are better off with 10% of something than 100% of nothing. If you refuse, the site stays derelict. You must sign off on a scheme that looks like gentrification because the alternative is decay. This will attract criticism from housing campaigners, but the logic holds: the inequality is justified *only* because it is the sole mechanism to deliver the affordable portion.

  ---

  ### Case 2: Hospital Staff Housing (Height Exemption)
  **Proposal:** 8-storey block (2 storeys over limit) for NHS staff. 100% Affordable/Key Worker.
  **Context:** Casts long shadows over existing council estate (3-storey walk-ups) to the north.

  *   **Step 1 (Primary Goods):**
      *   *Healthcare:* Improved (Staff have housing near work).
      *   *Daylight:* Reduced for existing council tenants (Least Advantaged).
      *   *Analysis:* Harm is being done to the Primary Good (Daylight) of the current least advantaged group.
      *   *Result:* **STOP.**
      *   *Reasoning:* Under the Difference Principle, you cannot harm the least advantaged to help a different group (even if that group is also relatively disadvantaged staff). The existing tenants are already in social housing; reducing their amenity makes them worse off. The staff *might* get housing, but the tenants *definitely* lose light.

  **RPF Outcome:** **Recommend Refusal.**
  **The Uncomfortable Truth:** You are blocking homes for nurses and doctors to protect the sunlight of existing tenants. In a housing and health crisis, this feels wrong. However, the procedure prioritises the *status quo* of the worst-off. Unless the developer can redesign to remove the shadow, you cannot approve. To approve would require trading Daylight for Healthcare.

  **Wait – Correction on Case 2:**
  Because this involves trading one Primary Good (Daylight) for another (Healthcare), this actually triggers **Step 4 (Escalate)**.
  *   **Revised RPF Outcome:** **Escalate to Planning Committee.**
  *   **Officer Advice:** "The scheme fails the Primary Goods Audit because it harms existing tenants. However, it benefits healthcare capacity. Officers cannot weigh the value of a Nurse's commute against a Tenant's sunlight. This is a values decision."
  *   **Why this is hard:** You are handing a poisoned chalice to the Committee. If they approve, they vote to shade the poor. If they refuse, they vote to hinder the hospital. The procedure forces the political cost into the open rather than hiding it in an officer delegation report.

  ---

  ## Where This Procedure Will Misfire (Warning Notes)

  1.  **The "Derelict Site" Loophole:** As seen in Case 1, developers can use the Difference Principle to justify low affordable percentages on difficult sites. It validates "crumbs are better than nothing." You will need to verify their viability claims aggressively, or the test becomes a rubber stamp for low quality.
  2.  **Defining "Least Advantaged":** Is a hospital nurse on a temporary contract worse off than a council tenant on benefits? The procedure assumes the existing resident is the baseline. If your council defines "Key Workers" as the priority need, this test will conflict with your Corporate Plan.
  3.  **The Values Handoff:** Step 4 pushes hard decisions to Committee. If your elected members hate making tough calls, they will bounce it back to you asking for a "recommendation." You must hold the line: "I can assess facts, I cannot weigh Primary Goods."
  4.  **Daylight vs. Density:** In dense urban areas, almost all new build casts shadows. If you apply Step 1 rigidly, you may halt all development. You must rely on "National Standards" as the threshold for "Significant Reduction," otherwise, the veil blinds everyone to progress.

  **Final Instruction:** Do not cite Rawls in the public report. Translate "Difference Principle" into "Viability Necessity" and "Veil of Ignorance" into "Tenure Blindness." The ethics do the work; the planning language gets it approved.
