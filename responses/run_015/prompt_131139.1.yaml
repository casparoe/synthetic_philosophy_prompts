answer: |-
  You have identified a very real, very specific, and increasingly documented phenomenon. You are right that "echo chamber" is too blunt an instrument here, and "hostile media effect" misses the mark because the content *is* actually hostile.

  There isn't one single canonical term in the academic literature that captures the exact machinery you're describing, but there is a precise cluster of concepts from social epistemology, political psychology, and media studies that, when combined, map exactly onto Dana's situation.

  Here is the breakdown of the machinery, the closest existing concepts, a proposed coined term for your novel's internal logic, and the boundaries of the phenomenon.

  ### 1. The Academic Framework

  To understand Dana, you need to layer three specific concepts.

  **A. C. Thi Nguyen's "Echo Chamber" (vs. Epistemic Bubble)**
  Philosopher C. Thi Nguyen made a crucial distinction that fits your setup perfectly.
  *   **Epistemic Bubble:** You leave relevant voices *out*. (Fix: Pop the bubble by exposing them to new info).
  *   **Echo Chamber:** You include outside voices, but you systematically **undermine their credibility** before they speak.
  Dana is in a Nguyen-style Echo Chamber. Her group *does* show her the other side's content. But the context provided by her allies ("Look how unhinged this is," "This is what they really want") strips the source of all trust. When she meets a reasonable opponent, her epistemic framework tells her that *trust* is the trap. She doesn't dismiss him because she hasn't heard his argument; she dismisses him because her community has taught her that *this specific group* is incapable of good faith.

  **B. Negative Partisanship**
  Political scientists use this to describe voting or acting not out of love for your own side, but out of fear or hatred of the other. Dana's information diet is fuel for negative partisanship. She isn't consuming info to learn; she is consuming it to **reinforce group cohesion through shared outrage.** The function of the screenshot in her group chat isn't information transfer; it's social bonding via a common enemy.

  **C. Subtyping (The Psychological Mechanism)**
  This explains why meeting the reasonable guy doesn't help. In social psychology, **Subtyping** is what happens when you encounter a member of a stereotyped group who disconfirms the stereotype. Instead of changing the stereotype ("Maybe they aren't all bad"), you create a sub-category ("He's one of the *good ones*," or "He's just being polite"). This protects the main stereotype from being updated. Dana files the reasonable opponent as a "subtype," leaving her gallery of worst moments intact as the "true" representation.

  ### 2. The Coined Term: "Adversarial Curation"

  Since you need a handle for this to help you write the machinery, I suggest using **Adversarial Curation** to describe the system, and **Hostile Fluency** to describe Dana's state of mind.

  **Adversarial Curation**
  *   **Definition:** The practice of an in-group selecting, circulating, and framing out-group content specifically for its capacity to generate outrage, fear, or mockery, rather than for its representativeness.
  *   **The Machinery:** It requires three steps:
      1.  **Mining:** Scouring the out-group for extreme statements (which always exist in a large population).
      2.  **Decontextualizing:** Removing the nuance or specific context that made the statement an outlier.
      3.  **Weaponizing:** Circulating it with a caption or framing that implies this is the *normative* view of the out-group.
  *   **Why it's not just "mockery":** Mockery is ancient and often horizontal (punching up or down). Adversarial Curation is vertical and structural. It creates a **distorted baseline.** It convinces the consumer that the *extreme* is the *central*.

  **Hostile Fluency**
  *   **Definition:** The state of being highly knowledgeable about an opponent's arguments, vocabulary, and internal conflicts, but possessing that knowledge solely for the purpose of counter-argument or dismissal.
  *   **The Trap:** Dana *can* steelman the other side. She *can* pass the Ideological Turing Test. But because she acquired that fluency through Adversarial Curation, she lacks the **charitable heuristic.** She knows *what* they say, but she has lost the ability to model *why* a reasonable person might believe it. She has the map, but she thinks the terrain is made of lava.

  ### 3. The Edges: Where does it stop?

  You asked where this stops being its own thing and becomes ordinary skepticism. This is crucial for avoiding caricature.

  **1. Proportionality (The Sample Size Test)**
  *   **Ordinary Skepticism:** "I saw three people say X, I should check if X is common."
  *   **Adversarial Curation:** "I saw three people say X, therefore X is the goal of the movement."
  *   *The Edge:* Does the character acknowledge the outlier status of the evidence? If Dana thinks the guy with 400 followers represents the school board's policy, she's in Adversarial Curation. If she thinks he represents a risk that needs monitoring, she's in skepticism.

  **2. Intent (The Cohesion Test)**
  *   **Ordinary Skepticism:** The goal is to assess truth or risk.
  *   **Adversarial Curation:** The goal is to reinforce in-group solidarity.
  *   *The Edge:* Watch what happens when the "enemy" says something reasonable. In skepticism, the group acknowledges it. In Adversarial Curation, the group ignores it or spins it ("He's just saying that to get the bill passed"). If the information flow is one-way (bad news travels, good news dies), it's Adversarial Curation.

  **3. Reciprocity (The Mirror Test)**
  *   **Ordinary Skepticism:** "We are capable of bad faith, and so are they."
  *   **Adversarial Curation:** "We are reactive; they are strategic."
  *   *The Edge:* Does Dana believe her own side is immune to the tactics she accuses the other side of using? If she thinks her side screenshots enemies to "expose truth" but the other side screenshots to "manipulate," she is deep in the trap.

  ### 4. Why "Just Read the Other Side" Fails (The Fix)

  Your instinct is correct: telling Dana to "go read the other side" is the wrong advice. In fact, under Adversarial Curation, **more exposure often increases polarization.** This is known as the **Negative Mediated Contact** effect.

  If Dana goes and reads the other side's blogs *on her own*, she will likely apply **Motivated Skepticism**. She will read their reasonable arguments looking for the hidden trap. Because she has Hostile Fluency, she is *better* at finding apparent contradictions than a naive reader. She will feel *more* confident in her distrust after reading them, because she will have "caught" them in minor inconsistencies.

  **The Honest Fix:**
  The literature (specifically Allport's Contact Hypothesis and subsequent updates) suggests information doesn't fix this; **structure** does.
  1.  **Superordinate Goals:** Dana and her opponent need to be forced to work together on a problem that *neither side* can solve alone, which is *not* the curriculum fight. (e.g., The school budget is cut, and both have to fight the administration to save *anything*).
  2.  **Equal Status:** They must interact as peers, not as representatives of their tribes.
  3.  **Vulnerability:** One of them has to admit a fault about their *own* side first. This breaks the "Adversarial Curation" loop because it disrupts the expectation of performative perfection.

  ### Summary for your Novel

  *   **The Concept:** **Adversarial Curation** (the system) creating **Hostile Fluency** (the character trait).
  *   **The Academic Backing:** C. Thi Nguyen's **Echo Chambers** (trust undermining) + **Negative Partisanship** (identity via opposition) + **Subtyping** (dismissing reasonable exceptions).
  *   **The Trap:** Dana isn't ignorant. She is **armed.** Her knowledge is a weapon, not a bridge.
  *   **The Resolution:** She doesn't need more information. She needs a **shared vulnerability.** She needs to see the opponent fail at something human, or admit a mistake, in a context where there is no audience to perform for. That is the only thing that breaks the "Gallery of Worst Moments."

  This setup allows both characters to be intelligent and well-read without being caricatures. Dana isn't stupid; she is **epistemically trapped.** Her opponent isn't a secret villain; he is **structurally obscured.** That is a much richer conflict for a novel.
