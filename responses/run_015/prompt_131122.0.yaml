answer: |-
  # Specification for a Theory of Commensurability Supporting Lexical Threshold Negative Utilitarianism

  ## Preamble
  This specification defines the necessary conditions for a theory of value commensurability to support **Two-Threshold Lexical Threshold Negative Utilitarianism (LTNU)**. The theory must render LTNU action-guiding, avoiding paralysis, arbitrariness, or collapse into standard aggregative utilitarianism.

  For each requirement below, the **Statement** defines the theoretical constraint. The **Motivation** explains why LTNU needs it. The **Classification** marks the requirement as either a **Legitimate Demand** (necessary for the view to function as an action-guiding theory) or an **NU Prejudice** (a substantive commitment specific to the negative-utilitarian camp that a neutral theorist might reject).

  ---

  ## 1. The Bearers of Value
  *   **Statement:** The theory must specify the *temporal grain* of evaluation. It must assert whether value attaches to instantaneous time-slices, specious presents, or temporally extended episodes. Crucially, it must include an **Anti-Fragmentation Clause**: a temporally extended episode of suffering cannot be rendered morally negligible by subdividing it into momentary states that each fall below the pain threshold.
  *   **Motivation:** Without this, LTNU is vulnerable to the "dust specks" objection. If a year of torture can be described as a sequence of millisecond states, and the threshold applies to milliseconds, the torture might vanish from moral consideration. To be action-guiding, the theory must prevent agents from dissipating severe suffering into negligible parts via descriptive framing.
  *   **Classification:** **Legitimate Demand.** (Without temporal integration rules, the threshold is bypassable, and the view ceases to guide action against prolonged suffering.)

  ## 2. Lexical Priority versus Incommensurability
  *   **Statement:** The theory must posit a **Weak Lexical Order**, not mere incommensurability. For any state $P$ above the pain threshold and any set of states $S$ consisting only of sub-threshold pleasure, $P$ is strictly better than $\neg P$ regardless of the cardinality of $S$. The items must be comparable on a single scale of *choice-worthiness*, even if they are not convertible via a fixed exchange rate.
  *   **Motivation:** Incommensurability implies that no rational choice is mandated between options (they are "on a par"). LTNU requires that severe suffering *trumps* pleasure. If they are truly incommensurable, an agent is permitted to choose the pleasure over the pain, which violates the core negative-utilitarian constraint.
  *   **Classification:** **Legitimate Demand.** (Incommensurability leads to decision paralysis or permissiveness; LTNU requires a strict priority rule to be action-guiding.)

  ## 3. Aggregation Across Persons
  *   **Statement:** The theory must endorse **Interpersonal Aggregation of Severe Pain** but forbid **Interpersonal Aggregation of Pleasure against Pain**. Preventing two episodes of threshold-crossing suffering is strictly better than preventing one, regardless of the sub-threshold pleasure sacrificed. However, no number of sub-threshold pleasant lives outweighs one life containing threshold-crossing suffering.
  *   **Motivation:** To avoid the "Reverse Repugnant Conclusion" where one person's severe agony is deemed worse than the extinction of a billion happy lives, LTNU needs the lexical ban. However, to avoid paralysis when choosing between two disasters, it must allow summing severe pains to minimize total severe suffering.
  *   **Classification:** **Legitimate Demand.** (This defines the "Two-Threshold" structure. Without it, the view collapses into person-affecting views or standard utilitarianism.)

  ## 4. Mixed Valence
  *   **Statement:** The theory must provide a **Net Valence Function** or a **Separability Axiom**. For complex experiences (e.g., relief, effortful joy), the theory must specify whether the pain and pleasure components are summed to determine if the *net* experience crosses the pain threshold, or whether the presence of *any* threshold-crossing pain component triggers lexical priority regardless of concurrent pleasure.
  *   **Motivation:** Real-world choices involve mixed goods. If the theory cannot parse mixed states, it cannot guide action in realistic scenarios (e.g., painful medical treatment yielding pleasure later).
  *   **Classification:** **NU Prejudice.** (A neutral theorist might argue for a holistic valence where pleasure and pain are not separable components. LTNU typically presupposes separability to apply thresholds, but a sophisticated theory could treat mixed states as sui generis.)

  ## 5. The Zero Point and Prudential Significance
  *   **Statement:** The theory must stipulate that sub-threshold pleasure has **Zero Moral Weight** in trade-offs. It must further clarify whether this implies **Prudential Nullity**: i.e., whether extinguishing a sub-threshold pleasure is cost-free for the agent's well-being. The theory must resolve whether "permissible to ignore" entails "permissible to extinguish."
  *   **Motivation:** If sub-threshold pleasure has prudential value but no moral weight, agents face a conflict between self-interest and morality. If it has neither, the theory simplifies decision-making but risks implying that a life of sub-threshold pleasure is equivalent to a life of neutral states.
  *   **Classification:** **NU Prejudice.** (A neutral theorist would argue sub-threshold pleasure has *some* positive value, however small. Declaring it functionally zero is a specific doctrinal move to secure the lexical priority of pain.)

  ## 6. Vagueness and the Cliff Edge
  *   **Statement:** The theory must resolve the **Sorites Problem** for thresholds. It must either: (a) accept a sharp discontinuity (Cliff Edge), (b) introduce a **Parity Zone** (states near the threshold are incomparable), or (c) adopt **Hysteresis** (the threshold for entering the lexical regime is higher than the threshold for leaving it). It cannot claim both sharp thresholds and continuous value.
  *   **Motivation:** If the threshold is vague, agents cannot know if an action triggers the lexical ban. If it is sharp, arbitrarily small differences in intensity create infinite differences in value. Action-guidance requires a decision rule for near-threshold cases.
  *   **Classification:** **Legitimate Demand.** (A theory that ignores vagueness fails to guide action in borderline cases, which are common in practice.)

  ## 7. Prospects and Risk
  *   **Statement:** The theory must provide a **Decision Rule for Uncertainty** that does not rely on standard Expected Utility Theory (EUT). Since lexical values break the continuity axiom of EUT, the theory must specify how to rank lotteries (e.g., 1% chance of severe pain vs. 100% chance of massive sub-threshold pleasure).
  *   **Motivation:** Real-world action involves risk. If the theory cannot rank gambles, it is useless for policy or personal decision-making where outcomes are probabilistic.
  *   **Classification:** **Legitimate Demand.** (Without a risk rule, the theory applies only to a world of certainty, rendering it practically inert.)

  ## 8. Locatability
  *   **Statement:** The theory must link the thresholds to **Operational Markers**. These may be phenomenological (self-report), behavioral (avoidance), or neural (nociceptive activation). The theory must specify a hierarchy of authority when these markers diverge (e.g., if an agent reports no pain but neural markers indicate threshold-level distress).
  *   **Motivation:** An action-guiding view must be usable by finite agents. If the threshold is metaphysically real but epistemically inaccessible, the view cannot guide action.
  *   **Classification:** **Legitimate Demand.** (Unlocatable thresholds make the view theoretically coherent but practically vacuous.)

  ---

  ## Results

  ### 1. The Impossibility Theorem
  You suspected that no single theory can combine a **Sharp Lexical Threshold**, the **Absence of Cliff-Edge Discontinuity**, and a **Transitive/Complete Ranking**. This suspicion is correct.

  *   **Proof Sketch:**
      1.  **Sharp Lexical Threshold** implies a binary switch: Value($x$) = 0 for $x < T$, and Value($x$) = $\infty$ (or Lexically Dominant) for $x \ge T$.
      2.  **Absence of Cliff-Edge Discontinuity** implies Continuity: For any $x$ near $T$, a small change $\epsilon$ produces a small change in value.
      3.  **Transitive/Complete Ranking** requires that for any $a, b$, either $a > b$, $b > a$, or $a = b$.
      4.  **Contradiction:** If the threshold is sharp, then for $x = T - \epsilon$ and $y = T$, $y$ is lexically superior to $x$. This is a discontinuity (an infinite or categorical jump). If you enforce Continuity (2), you cannot have the Sharp Jump (1). If you try to smooth the jump (e.g., via a Parity Zone), you violate Completeness (3) because items in the parity zone are neither better, worse, nor equal.
  *   **Conclusion:** LTNU must sacrifice one. To remain action-guiding (Complete Ranking), it must accept the **Cliff Edge** (Sharp Threshold) or sacrifice Transitivity in the penumbra (Parity). The most stable configuration for LTNU is to accept the **Cliff Edge** as a metaphysical fact, treating the Sorites paradox as an epistemic limitation rather than an ontological vagueness.

  ### 2. Exclusionary and Partisan Requirements

  *   **Most Exclusionary Requirement:** **Requirement 2 (Lexical Priority).**
      *   *Reasoning:* This requirement excludes the vast majority of established axiologies (Classical Utilitarianism, Prioritarianism, Sufficientarianism). Standard measurement theory and Expected Utility Theory rely on continuity and trade-offs. Demanding lexical priority forces the adoption of non-Archimedean value structures, which are mathematically complex and philosophically contentious. It rules out any theory that treats value as a single, continuous cardinal scale.
  *   **Most Partisan Requirement:** **Requirement 5 (The Zero Point).**
      *   *Reasoning:* A neutral theorist of commensurability can accept lexical priority for pain without accepting that sub-threshold pleasure is *zero*. They might argue it has positive value that is simply *outweighed* (lexically) by severe pain. The LTNU demand that sub-threshold pleasure counts for *nothing* (negligible/zero) is a specific commitment of the *Negative* Utilitarian camp. It collapses the distinction between "too small to matter in a trade-off" and "non-existent in value." This is the point where a neutral theorist would most likely balk, arguing it distorts the phenomenology of pleasure.

  ---

  ## Model Assessment

  Here is how three candidate theoretical models fare against the specification:

  **1. Single Cardinal Scale with Priority Clause**
  *   *Structure:* Value is a real number, but a function $f(pain)$ maps threshold-crossing pain to a value higher than any possible sum of pleasure.
  *   *Performance:* Fails **Requirement 6 (Vagueness)**. It enforces a sharp cliff edge, making it vulnerable to Sorites arguments. It also struggles with **Requirement 7 (Risk)** because standard expectation operators fail with lexical values (infinity $\times$ probability is undefined).
  *   *Verdict:* High action-guidance in clear cases, brittle in borderline/risky cases.

  **2. Parity-Style Incomparability Model**
  *   *Structure:* Near the threshold, states are "on a par" (incomparable but not indifferent).
  *   *Performance:* Solves **Requirement 6 (Vagueness)** by smoothing the cliff into a zone of parity. However, it fails **Requirement 2 (Lexical Priority)** in the strict sense, as it allows rational choice of pleasure over near-threshold pain. It also risks failing **Action-Guidance** in the parity zone (indeterminacy).
  *   *Verdict:* Philosophically robust against Sorites, but weakens the "Negative Utilitarian" force in borderline cases.

  **3. Two-Dimensional (Multi-Utility) Representation**
  *   *Structure:* Value is a vector $\langle V_{pain}, V_{pleasure} \rangle$. Choice rules prioritize minimizing the first dimension; the second dimension acts as a tie-breaker only when the first is equal or below threshold.
  *   *Performance:* Best fit. It naturally handles **Requirement 4 (Mixed Valence)** by separating components. It handles **Requirement 7 (Risk)** via vector expected utility. It can accommodate **Requirement 6 (Vagueness)** by defining a "buffer zone" in the pain dimension where the priority rule is suspended.
  *   *Verdict:* Most promising for making LTNU action-guiding. It formalizes the lexical intuition without requiring a single discontinuous scale, though it requires complex decision rules.
