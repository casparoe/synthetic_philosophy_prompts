  # JOINT STATEMENT ON THE PHILOSOPHY OF NATIONAL MYTHS OF LOST CAUSES

  **Issued by the Adversarial Collaboration on Mnemonic Ethics**
  **Representing the Constitutive Narrative (CN) and Corrective Integration (CI) Camps**

  ## PART I: AGREED CLAIMS

  The undersigned parties, representing the Constitutive Narrative and Corrective Integration camps, acknowledge the following points of consensus regarding the historical, psychological, and epistemic dimensions of national myths surrounding defeat and lost causes (specifically including the Confederate Lost Cause, the Battle of Kosovo Polje, the Siege of Masada, and the Dunkirk evacuation).

  1.  **Historical Composition:** Both camps agree that the narratives in question are composite structures containing verifiable historical data, strategic interpretations, and moral evaluations. In all cited cases, the popular memory of the event diverges from the archival record regarding specific tactical details, casualty figures, or the inevitability of the outcome.
  2.  **Functional Utility:** Both camps agree that these narratives serve specific psychological and political functions for the groups that maintain them. These functions include:
      *   Sustaining collective dignity in the face of military or political failure.
      *   Providing explanatory coherence for subsequent political developments (e.g., Reconstruction, national rebirth).
      *   Reinforcing social bonds by defining a shared lineage of sacrifice.
  3.  **Empirical Limits:** Both camps agree that there is currently no general sociological law capable of predicting with high confidence when historical correction will strengthen social cohesion (via increased trust in institutions) and when it will fracture it (via perceived betrayal or identity dissolution). Consequently, risk assessments regarding the correction of specific myths remain probabilistic rather than deterministic.
  4.  **Normative Stakes:** Both camps agree that the debate involves a tension between two genuine goods: the integrity of the public epistemic environment and the stability of communal identity. Neither side claims that their preferred good is irrelevant; the dispute concerns prioritization and compatibility.

  ***

  ## PART II: DISAGREEMENTS TABLE

  The following table delineates the residual disagreements between the Constitutive Narrative (CN) and Corrective Integration (CI) camps. Disagreements are categorized as **Substantive** (empirical or logical claims that could theoretically be settled by evidence), **Verbal** (disputes over definition), or **Normative** (value judgments not resolvable by empirical data alone).

  | ID | Formulation of Disagreement | CN Position | CI Position | Classification |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **The Fragility Thesis:** To what extent is collective identity dependent on the literal truth of its founding narratives? | Collective identity is often *constituted* by the narrative; removing the narrative (even if false) removes the structural load-bearing wall, risking fragmentation. | Collective identity is *robust* and adaptive; it can migrate from false narratives to corrected histories without losing cohesion, provided the transition is managed. | **Substantive** (Empirical) |
  | **D2** | **The Legitimacy Thesis:** Does democratic legitimacy require epistemic accountability even at the cost of social stability? | Social stability is a prerequisite for any legitimacy; if correction threatens the bond of the polity, the "truth" imposes an illegitimate burden on the community's right to self-constitution. | Epistemic accountability is a prerequisite for legitimacy; a polity built on known falsehoods lacks the moral standing to govern, regardless of stability. | **Normative** (Value Judgment) |
  | **D3** | **The Separability Thesis:** Can the expressive function of a myth (honoring sacrifice) be decoupled from its propositional content (claims about the justice of the cause)? | The expression and the proposition are fused; honoring the sacrifice implicitly endorses the cause. To correct the cause is to dishonor the sacrifice in the eyes of the adherents. | The expression and the proposition are separable; one can honor the courage of the actor while condemning the cause or correcting the strategic record. | **Substantive** (Conceptual/Psychological) |

  ***

  ## PART III: CRUXES AND TEST CASE PREDICTIONS

  The Collaboration identifies two central cruxes where resolution would significantly shift the weight of the argument. We utilize the contrast between the **Dunkirk Spirit** (United Kingdom) and the **American Lost Cause** (Confederate/Post-Bellum South) as a shared test case to illuminate these cruxes.

  ### Crux 1: Mnemonic Sovereignty vs. Epistemic Accountability
  **Question:** Does a community's authority over its own commemorative practices ("mnemonic sovereignty") justify maintaining propositions that are demonstrably false when those propositions are load-bearing for collective self-respect?

  *   **Relevance of Test Case:** The Dunkirk narrative frames a strategic evacuation as a moral victory. The Lost Cause frames a rebellion fought for slavery as a defense of heritage.
  *   **Shared Empirical Premise:** Historical correction of minor tactical details in the Dunkirk narrative has met with negligible public resistance. Correction of the Lost Cause narrative has met with sustained, often violent, institutional resistance.
  *   **Predictions:**
      *   **CN Prediction:** If a demonstrably false claim within the Dunkirk narrative (e.g., specific numbers of civilian boats involved) were debunked, it would cause minimal social damage *only because* the Dunkirk myth is less load-bearing for British identity than the Lost Cause was for Southern identity. If the Dunkirk myth were as constitutive of British existence as the Lost Cause was of Southern identity, debunking it would cause equivalent fracture. The variance in resistance proves the variance in "load-bearing" status.
      *   **CI Prediction:** If a demonstrably false claim within the Dunkirk narrative were debunked, it would cause minimal social damage because the narrative serves *resilience* (compatible with truth) rather than *hierarchy* (incompatible with truth). The resistance to Lost Cause correction is not due to "identity load" but because the myth protects specific power structures that require falsehood to survive. The variance in resistance proves the variance in the *moral compatibility* of the myth with democratic norms.

  ### Crux 2: Expressive Value vs. Propositional Content
  **Question:** Is the "expressive value" of a lost-cause myth (honoring sacrifice, maintaining dignity) logically and psychologically separable from its "propositional content" (the factual and moral claims about the cause and its defeat)?

  *   **Relevance of Test Case:** Both narratives honor the courage of participants. However, the Dunkirk narrative does not require believing the war was justifiable *only* if the evacuation was tactically perfect. The Lost Cause narrative often ties the honor of the soldier directly to the righteousness of the secession.
  *   **Shared Empirical Premise:** British commemoration of Dunkirk has successfully shifted focus from "victory" to "resilience" without collapsing national morale. Confederate commemoration has struggled to shift focus from "heritage" to "history" without triggering accusations of desecration.
  *   **Predictions:**
      *   **CN Prediction:** The British success in shifting focus is due to a pre-existing cultural consensus that allowed the *expression* to detach from the *content*. In the Southern case, the adherents themselves view the content (the righteousness of the cause) as the necessary condition for the expression (honor). Therefore, separability is not a universal logical feature but a contingent cultural one. You cannot force separability where the community perceives fusion.
      *   **CI Prediction:** The British success demonstrates that separability is achievable in mature democratic cultures. The Southern failure demonstrates that when a myth is tied to unjust hierarchy, the *content* poisons the *expression*. Correction is possible in the Southern case, but it requires dismantling the hierarchy, not preserving the myth. The friction is not proof of inseparability, but proof of the myth's toxic political function.

  ### Flag on Value Judgments
  The Collaboration explicitly flags that **Disagreement D2 (The Legitimacy Thesis)** and aspects of **Crux 1** reduce to normative value judgments. Empirical data can determine *whether* correction causes fracture (D1), but it cannot determine whether preventing fracture is more important than upholding truth (D2). This boundary marks the limit of empirical resolution; settlement here requires ethical negotiation, not further data collection.
