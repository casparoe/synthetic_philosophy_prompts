answer: |-
  The rain in Harrow's Reach didn't fall so much as it hovered, a salt-heavy mist that settled on the wool of your coat and the windows of the Community Center. Inside, the air was stale with coffee and the heat of four bodies crowded around a folding table.

  On the table lay two manila folders. They were identical in weight, thickness, and texture, which Elias found obscene. Inside one was the life of the Karimi family. Inside the other, the life of the Tebutebu family.

  There was one sponsorship slot left. The federal quota had been slashed, the local housing fund was exhausted, and the committee had until morning to submit a recommendation.

  Elias rubbed his temples. He was a retired high school history teacher, tasked with chairing a committee he hadn't wanted. To his left sat Sarah, a paralegal who believed in statutes the way some people believed in scripture. To his right was Ben, a younger man who worked in renewable energy and carried his guilt like a second backpack. Across from them was Martha, who ran the local food bank and knew exactly how many loaves of bread the town could stretch.

  "The Karimis are the clear legal choice," Sarah said, tapping the left folder. "Targeted political persecution. Documented threats from the regime. If they go back, they face imprisonment or execution. It fits the 1951 Convention definition perfectly."

  "And the Tebutebus?" Ben asked. His voice was quiet, but it carried over the hum of the refrigerator. "Their atoll is three feet lower than it was forty years ago. The wells are brackish. They can't grow taro. They aren't being arrested, but they are being erased."

  "They are climate migrants," Sarah said. "Not refugees. There is a distinction."

  "Is there?" Elias asked. He looked out the window. The harbor was churning, the water lapping dangerously close to the seawall. "If I drown because a man pushes me in, I am a victim. If I drown because the tide rises and I cannot swim, am I not still drowned?"

  "The source of the harm matters," Sarah insisted. "One is malicious intent. The other is... circumstance. We have limited resources. We have to prioritize the most acute injustice."

  "Acute how?" Ben leaned forward. "The Karimis are in danger *now*. I grant that. But the Tebutebus have nowhere to go. Ever. Their country is disappearing. Is the urgency of need measured in hours, or in generations? If we wait until the Tebutebus are underwater, it's too late to sponsor them."

  Elias felt the first distinction sharpen, like a knife being honed. Was the moral claim based on the *villain*? Did a refugee require a persecutor to be worthy of salvation? Or was the moral claim based on the *wound*? If the bleeding is the same, does it matter if the blade was steel or saltwater?

  "We can't save everyone," Martha said. She hadn't touched her folder. She was looking at the budget spreadsheet. "We have one house on Elm Street. It needs a new roof. We have funds for the deposit and three months' rent. That's it."

  "This isn't about the roof, Martha," Ben said.

  "It is exactly about the roof," Martha countered. "It's about capacity. We are a town of four thousand. We are struggling to keep our own seniors warm. Our duty is bounded by what we can actually sustain. If we take the family we can't support, we fail them anyway."

  "But capacity isn't the only metric," Elias said. He surprised himself. "If capacity is the only metric, then rich towns take no one, and poor towns take everyone. That doesn't seem like justice."

  "So what is the metric?" Sarah asked, exasperated. "Proximity? The Karimis are in a camp six hours from the embassy. The Tebutebus are on the other side of the world."

  "Does distance absolve us?" Ben asked. He opened the Tebutebu file and slid a photo across the table. It showed a man standing in a field of dead, brown crops, the ocean visible in the background. "We drive cars. We heat our homes with oil. The carbon that melted the ice to drown their land came from places like Harrow's Reach. Isn't there a duty based on contribution to the harm? If we broke the window, don't we have to pay for the glass?"

  Sarah sighed. "That's collective guilt, Ben. You and I didn't melt the ice. And you didn't arrest the Karimi father. Why is one form of causality binding and the other not?"

  "Because one is systemic," Ben said. "We benefit from the system that warmed the climate. We are beneficiaries of the harm."

  Martha shook her head. "If we base sponsorship on historic guilt, we'd never stop. We'd be paying reparations forever. We're a resettlement group, not a tribunal. Our duty is to our neighbors first, then to those we can practically help."

  Elias looked at the two folders again. The silence in the room grew heavy, pressing against his ears.

  He thought about the Karimis. A father who had spoken against a dictator. A clear narrative of good versus evil. It was a story the town could understand. It was clean.

  He thought about the Tebutebus. A father who had watched the sea eat his garden. A narrative of consequence. It was messy. It implicated everyone in the room. It suggested that the safety of Harrow's Reach was purchased with the sinking of the atoll.

  "If we choose the Karimis," Elias said slowly, "we say that a human enemy is worse than a natural one. We say that malice is the only thing that creates a refugee."

  "And if we choose the Tebutebus?" Sarah asked.

  "Then we say that need alone is enough. But we also admit that we are taking them because we helped sink their home. We make it about our sin, not their safety."

  "And if we choose based on capacity?" Martha asked.

  "Then we admit that morality has a price tag," Elias said. "And that if the roof is too expensive, the human being is too expensive."

  The clock on the wall ticked. The rain intensified, drumming against the glass.

  "We have to vote," Sarah said. "We have a deadline."

  "I know," Elias said.

  He looked at the faces around the table. They were good people. They baked casseroles for new mothers and shoveled snow for the elderly. They wanted to do the right thing. But the "right thing" had fractured into three different directions, and no compass pointed true.

  If they chose the persecuted family, they validated the law but ignored the changing world.
  If they chose the climate family, they acknowledged the urgency of need but blurred the legal protections that kept the system functioning.
  If they chose based on capacity, they were honest but cruel.
  If they chose based on historic contribution, they were just but perhaps unsustainable.

  Elias picked up his pen. He felt the weight of it. It was just a tool for marking paper, yet it felt like a gavel.

  "I move we recommend the Karimis," Sarah said. "It's the safest path. It ensures the spot is approved."

  "I second the Tebutebus," Ben said. "It's the necessary path."

  Martha looked at Elias. "Chair?"

  Elias looked at the window. The tide was high; he could see the water obscuring the lower pilings of the dock. It didn't care about the 1951 Convention. It didn't care about carbon ledgers. It just rose.

  "We aren't voting on which family is more deserving," Elias said, his voice sounding thin in the small room. "We're voting on which story we want to tell ourselves about why we helped."

  "That's cynical," Sarah said.

  "It's honest," Elias replied.

  He looked at the two folders. He realized that whichever one he closed, the logic would bleed into the other. If he saved the political refugee, he was ignoring the climate debt. If he saved the climate refugee, he was undermining the legal definition that protected the political one. There was no clean hands option.

  "Let's vote," Elias said.

  They raised their hands. The count was two to two. Elias held the deciding vote.

  He looked at the Karimi file. He looked at the Tebutebu file. He thought about the single house on Elm Street with the leaking roof. He thought about the burning world outside, and the specific men who wanted to hurt specific people, and the slow, indifferent water that wanted everything.

  He did not feel wisdom. He felt only the sharpness of the cut he was about to make.

  Elias raised his hand.

  The motion carried. The decision was made.

  But as they packed up the folders, no one felt relief. The rain continued to fall, blurring the line between the sky and the sea, making it impossible to tell where one ended and the other began. Elias walked out into the mist, the door clicking shut behind him, leaving the answer inside, where it couldn't keep anyone dry.
