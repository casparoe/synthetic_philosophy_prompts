prompt: |-
  I'm a graduate student in a philosophy of mind course, and we've been working through Daniel Dennett's account of real patterns and the distinction among the physical, design, and intentional stances. I'm trying to sort out a conceptual issue that came up during our discussion of stance-relative ontology. Specifically, I want to understand whether a pattern that is predictively robust only from the intentional stance—say, attributing long-range strategic planning to an agent—should still count as a real pattern if it dissolves into mere statistical correlations at the physical level and receives no corroboration from the design stance. My instructor also floated the notion of explanatory overdetermination between stances, where the design and intentional stances predict identical behavior but carry incompatible ontological commitments. Could you please explain, in American English, how this kind of inter-stance overdetermination interacts with Dennett's criteria for pattern reality? In particular, does Dennett's framework provide any principled basis for privileging one stance's patterns over another when they conflict in ontological parsimony but match in predictive success, and what does this imply for patterns that seem stance-locked rather than stance-permeable?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Graduate student in philosophy of mind.
      *   **Topic:** Daniel Dennett's philosophy, specifically "Real Patterns," the three stances (Physical, Design, Intentional), stance-relative ontology, and explanatory overdetermination.
      *   **Core Question:** Does a pattern predictively robust *only* from the intentional stance (dissolving at physical/design levels) count as "real"? How does inter-stance overdetermination (matching predictions, incompatible ontologies) interact with Dennett's criteria for reality? Is there a principled basis for privileging one stance over another regarding ontological parsimony vs. predictive success? What about "stance-locked" vs. "stance-permeable" patterns?
      *   **Tone/Style:** American English, academic but accessible (graduate level), precise, nuanced.

  2.  **Deconstruct Dennett's Framework:**
      *   **Real Patterns (1991):** A pattern is real if it supports prediction better than chance and is more efficient than the brute data. "Real patterns are real."
      *   **Three Stances:**
          *   *Physical:* Laws of physics, bottom-up.
          *   *Design:* Function, engineering, optimization.
          *   *Intentional:* Beliefs, desires, rationality.
      *   **Instrumentalism vs. Realism:** Dennett is often called an "interpretivist" or "mild realist." He rejects hard reductionism but also rejects spooky dualism. Patterns are objective *relative to the stance* that detects them efficiently.
      *   **Ontology:** For Dennett, ontology is not a "God's eye view." It's stance-relative. If the intentional stance works best, intentional objects (beliefs, desires) are real *as patterns*.

  3.  **Address the Specific Scenarios:**

      *   **Scenario 1: Intentional-Only Robustness.**
          *   *Question:* If a strategic plan is visible intentionally but looks like noise statistically/physically, is it real?
          *   *Dennett's Answer:* Yes. That's the whole point of the intentional stance. If attributing beliefs/desires yields compression and prediction that the physical stance cannot feasibly achieve, the pattern is real. The fact that it "dissolves" physically is expected (multiple realizability).
          *   *Key Concept:* *Compression* and *Predictive Power*.

      *   **Scenario 2: Explanatory Overdetermination (Design vs. Intentional).**
          *   *Question:* Design and Intentional predict the same behavior but have incompatible ontologies (e.g., hardwired function vs. rational agency).
          *   *Dennett's Answer:* This is a feature, not a bug. It highlights the *abstractness* of the pattern. If both work, the pattern is robust. The "incompatible ontologies" are only incompatible if you demand a single, stance-independent reality. Dennett denies that demand.
          *   *Key Concept:* *Free-Floating Rationales*. A system can act *as if* it has reasons without *having* reasons internally.

      *   **Scenario 3: Privileging Stances (Parsimony vs. Success).**
          *   *Question:* Do we privilege one stance when they conflict in parsimony but match in success?
          *   *Dennett's Answer:* Pragmatism rules. The "best" stance is the one that offers the most predictive power for the least computational cost. Usually, Physical is too expensive for complex systems. Intentional is often the most efficient. Parsimony applies *within* a stance or regarding the *theory* used, not necessarily eliminating the stance itself if it works.
          *   *Key Concept:* *Pragmatic Realism*.

      *   **Scenario 4: Stance-Locked vs. Stance-Permeable.**
          *   *Question:* What if a pattern *only* exists in one stance?
          *   *Dennett's Answer:* That's normal. Beliefs are stance-locked to the intentional stance. You won't find a "belief neuron." But they are still real patterns because they capture objective regularities. "Stance-permeable" isn't a requirement for reality in Dennett's view; *extractability* is.

  4.  **Drafting the Response (Iterative Process):**

