          4.  Absence of Pleasure (in non-existence) = Not Bad (no one deprived).
      *   **View 1 (Person-Affecting):** Harm/Benefit requires a subject. Asymmetry is just strict adherence to this.
      *   **View 2 (Total/Impersonal):** Sum welfare. Asymmetry is unstable. If pain absence is good, pleasure absence should be bad.

  3.  **Translate to CBA Vocabulary:**
      *   *Standard CBA:* Aggregates WTP/WTA (Willingness to Accept) of *existing* stakeholders.
      *   *Kaldor-Hicks:* Potential Pareto Improvement. Winners *could* compensate losers.
      *   *Non-Use Values:* Existence value (knowing something exists), Bequest value (leaving it for others), Option value (keeping the option open).
      *   *Discounting:* How we value future flows.
      *   *The Translation Challenge:* CBA is fundamentally grounded in *revealed preferences* of *actual* people. Non-existent people have no preferences to reveal.

  4.  **Drafting the Translation (Section 1):**
      *   *Asymmetry:*
          *   Pain/Presence -> Negative CV for the individual.
          *   Pleasure/Presence -> Positive WTP/CV for the individual.
          *   Absence of Pain (Non-existence) -> This is tricky. In CBA, this looks like "Existence Value" held by *others* (parents/society) OR it's a null entry. If it's "good even if no one enjoys it," CBA has no slot for this unless we impute a "social welfare function" value independent of individual WTP.
          *   Absence of Pleasure (Non-existence) -> Zero WTP. No one is there to bid.
      *   *Person-Affecting View:* Strict Kaldor-Hicks. Only count CV/WTP of identifiable individuals. If no individual, no line item.
      *   *Total View:* Treat "Society" or "The State" as a proxy agent maximizing a utility function. Impute shadow prices for statistical lives/life-years (VSL/VSLY). Sum total utility regardless of identity.

  5.  **Analyzing the Cases (Section 2):**
      *   *Case 1: Delayed Creation (Postpone conception 10 years, same life quality).*
          *   *Philosophy:* Asymmetry says 0 loss (no one deprived). Intuition says 10 years lost.
          *   *CBA Translation:*
              *   Person-Affecting: Who pays? Parents might have WTP for earlier conception (timing preference). If parents are indifferent, WTP = 0. The child doesn't exist yet to value the 10 years. Result: $0 NPV.
              *   Total View: Impute Value of Statistical Life Year (VSLY). 10 years * VSLY = Positive Cost.
              *   *Distortion:* CBA usually requires an *agent* to hold the value. Total view smuggles in a social planner's utility function.
      *   *Case 2: Risky Creation (Coin flip: Good vs. Bad Life vs. No One).*
          *   *Philosophy:* Asymmetry counts the Bad (pain) but not the Good (pleasure) if the alternative is non-existence.
          *   *CBA Translation:*
              *   Person-Affecting: Expected Value (EV).
                  *   Bad Outcome: Negative CV (medical costs, suffering WTA).
                  *   Good Outcome: Positive WTP? No, because without creation, no one exists to lose the pleasure. So Good Outcome = 0.
                  *   Result: Net Negative. Don't create.
              *   Total View: EV = (0.5 * Utility_Good) + (0.5 * Utility_Bad). If Good > |Bad|, Create.
              *   *Distortion:* Standard CBA uses Expected Net Present Value (ENPV). Ignoring the upside because the beneficiary doesn't exist yet violates the standard risk-neutral assumption of summing expected utilities.

  6.  **The Residue Report (Section 3 - The Core):**
      *   *Clean Translations:* Presence of Pain/Pleasure (standard CV/WTP). Risk assessment (Expected Value).
      *   *Distorted Translations:* Absence of Pain in non-existence. CBA calls this "Existence Value" held by *third parties* (parents), but the philosophical claim is that it's good *in itself*. CBA requires a holder of the value.
      *   *Unwritable Lines:* "Benefit to no one." CBA is methodologically individualist. A line item without a stakeholder is audit fraud.
      *   *Smuggled Assumptions:* Using VSL/VSLY for non-existent people assumes a "Social Welfare Function" that transcends individual preferences. This is the Total View masquerading as technocratic accounting.
      *   *Verdict:* The Asymmetry highlights a constitutive limit of CBA. CBA is a *contractual* model (transactions between agents). Population ethics is often *teleological* (states of affairs). The philosophers aren't just dressing up bookkeeping; they are pointing out that CBA's bookkeeping rules (must have a payer/payee) exclude a specific class of moral claims (impersonal goods). However, the "Person-Affecting" view aligns almost perfectly with CBA's methodological individualism. The intuition that "10 years were lost" in the Delayed Case suggests people naturally slip into the Total View (valuing life-years as abstract goods) rather than the Person-Affecting View (valuing specific people's preferences).

  7.  **Refining the Argument & Tone:**
      *   Ensure the distinction between *existence value* (I value that the Grand Canyon exists) and *impersonal value* (It is good that the Grand Canyon exists even if no one knows) is clear. CBA can do the former, not the latter.
      *   Make sure the "Delayed Creation" paradox is addressed sharply. In CBA, time shifting a life is usually neutral unless discount rates or parental preferences differ. The intuition that it's "bad" implies we value the *life itself* as an asset, not the *person's utility*.
      *   Check the "Risky Creation" math. Asymmetry = Downside counts, Upside doesn't. CBA = Both count in EV. This is a direct conflict.
      *   Final Verdict needs to be nuanced. It's not that CBA is "wrong," but that it is *incomplete* for non-identity problems.

  8.  **Structure:**
      *   **Executive Summary:** Brief overview.
