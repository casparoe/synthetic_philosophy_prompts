answer: |-
  **MEMORANDUM**

  **TO:** Population Ethics Seminar Instructor
  **FROM:** [Your Name], MPP Candidate
  **SUBJECT:** Translating the Procreation Asymmetry into Cost-Benefit Analysis Frameworks
  **DATE:** October 26, 2023

  ### Executive Summary

  This memo attempts to operationalize the Procreation Asymmetry and its rival interpretations (Person-Affecting vs. Total/Impersonal) within the standard vocabulary of applied Cost-Benefit Analysis (CBA). By forcing these philosophical claims through the mechanics of Willingness to Pay (WTP), Compensating Variation (CV), and Kaldor-Hicks efficiency, I identify where the translation holds and where it breaks.

  The core finding is that the **Person-Affecting View** is isomorphic with standard regulatory CBA: both require an identifiable preference-holder to book a benefit or cost. The **Total View** requires smuggling in a "Social Planner" agent to hold values for non-existent entities, violating the methodological individualism of CBA. The **Asymmetry** itself creates a specific accounting error in CBA: it attempts to book a credit (absence of pain) without a debtor, while refusing to book a debit (absence of pleasure) despite the lack of a creditor.

  ---

  ### Part I: The Translation Layer

  Here, I map the philosophical claims onto standard CBA line items.

  #### 1. The Procreation Asymmetry
  *   **Presence of Pain (Bad):** Recorded as a negative **Compensating Variation (CV)**. The individual requires compensation to accept the pain. In environmental terms, this is a *damage cost*.
  *   **Presence of Pleasure (Good):** Recorded as a positive **Willingness to Pay (WTP)**. The individual pays to secure the pleasure. This is *consumer surplus*.
  *   **Absence of Pain in Non-Existence (Good):** This is the friction point. In CBA, "avoided damage" is a benefit. However, benefits must accrue to a stakeholder. If the person does not exist, there is no stakeholder to experience the relief. To book this, CBA must reclassify it as **Existence Value** or **Bequest Value** held by *third parties* (e.g., parents or society value the *state of affairs* where suffering does not occur).
  *   **Absence of Pleasure in Non-Existence (Not Bad):** Recorded as **$0**. Since no agent is deprived, there is no lost surplus. There is no "opportunity cost" because the "opportunity" requires a claimant.

  #### 2. View 1: The Person-Affecting Restriction
  *   **CBA Equivalent:** Strict **Kaldor-Hicks Efficiency** with identifiable stakeholders.
  *   **Mechanism:** A policy change is only an improvement if the winners *could* compensate the losers. If there are no losers (because no one exists to be deprived of pleasure), the cost side is zero. If there are no winners (because no one exists to enjoy the absence of pain), the benefit side is zero *unless* we impute preferences to existing observers.
  *   **Constraint:** You cannot sum utility across different possible populations. You can only compare states for *actual* people.

  #### 3. View 2: The Total (Impersonal) View
  *   **CBA Equivalent:** **Social Welfare Function (SWF) Maximization** using shadow prices.
  *   **Mechanism:** The analyst acts as a proxy for the non-existent. We assign a **Value of a Statistical Life Year (VSLY)** to the potential person.
  *   **Constraint:** This violates the **Revealed Preference** axiom. Since the potential person cannot reveal preferences, the analyst must impute them. This shifts the analysis from *efficiency* (satisfying preferences) to *paternalism* (maximizing an objective function).

  ---

  ### Part II: Case Applications

  #### Case 1: The Delayed-Creation Case
  *Scenario:* Pressing a button postpones conception by 10 years. Life quality and length remain identical.
  *Philosophical Intuition:* Asymmetry says $0$ loss (no one deprived). Seminar intuition says 10 good years lost.

  **CBA Translation:**
  1.  **Stakeholder Analysis:**
      *   *The Child:* Does not exist at $t=0$. Cannot express WTP for earlier birth. At $t=10$, they exist, but the delay is sunk. Their CV for the delay is theoretically undefined or zero (since life quality is identical).
      *   *The Parents:* May have WTP for earlier parenthood (consumption good). If indifferent, WTP = $0$.
  2.  **Discounting:**
      *   If we treat the life as a stream of utility flows, we apply the **Social Discount Rate (SDR)**.
      *   *Person-Affecting CBA:* NPV = $0$. You cannot discount utility for a non-existent person. The stream starts at $t=10$ instead of $t=0$, but since the *person* is the unit of account, and the person is identical, there is no change in their lifetime utility.
      *   *Total View CBA:* We treat "Life Years" as the commodity. 10 years $\times$ VSLY $\times$ Discount Factor $(1+r)^{-10}$. This yields a positive Cost.
  3.  **Result:**
      *   Standard CBA (Person-Affecting) aligns with the Asymmetry: **Net Impact = $0$**.
      *   The seminar's intuition (10 years lost) requires the Total View: treating "human life" as a capital asset that produces utility, independent of the identity of the worker.

  #### Case 2: The Risky-Creation Case
  *Scenario:* Option A: Create child (50% Very Good Life, 50% Very Bad Life). Option B: Do not create.
  *Philosophical Intuition:* Asymmetry says count the Bad (pain) but ignore the Good (pleasure) relative to non-existence.

  **CBA Translation:**
  1.  **Expected Net Present Value (ENPV):**
      *   Standard CBA sums expected values: $ENPV = (0.5 \times WTP_{Good}) + (0.5 \times CV_{Bad})$.
  2.  **Applying the Asymmetry:**
      *   *The Bad:* If the bad life occurs, the child suffers. They have a positive WTA (Willingness to Accept) to avoid this. This is a valid cost.
      *   *The Good:* If the good life occurs, the child benefits. But relative to Option B (non-existence), the Asymmetry says this benefit is $0$.
      *   *Adjusted CBA:* $ENPV_{Asymmetry} = (0.5 \times 0) + (0.5 \times -Cost_{Suffering})$.
  3.  **Result:**
      *   **Standard CBA:** Create if Expected Good > Expected Bad.
      *   **Asymmetry CBA:** Never Create if there is *any* risk of a life "not worth living," because the upside is capped at zero in the calculation relative to the baseline of non-existence.
      *   **Valuation Source:** Where does $Cost_{Suffering}$ come from? Usually **Contingent Valuation (CVM)** surveys asking existing people their WTP to prevent such suffering. But this measures *our* distress, not the child's. To measure the child's, we must impute a VSLY, which again smuggles in the Total View.

  ---

  ### Part III: Residue Report

  This section details what translates cleanly, what distorts, and what is unwritable.

  #### 1. Clean Translations
  *   **Presence of Pain/Pleasure:** These map perfectly to **Consumer Surplus** and **Damage Costs**. CBA is fluent in measuring welfare changes for existing agents.
  *   **Risk Weighting:** The Risky-Creation case translates cleanly into **Expected Value** calculations, *provided* you accept that the upside counts. The math of probability is neutral.
  *   **Distributional Weights:** If we care that the "Bad Life" falls on a vulnerable population, CBA can apply equity weights. This handles the *severity* of the harm, if not the *ontology* of the victim.

  #### 2. Distorted Translations (Smuggled Assumptions)
  *   **Absence of Pain (Non-Existence):** CBA translates this as **Existence Value**.
      *   *The Distortion:* In environmental economics, Existence Value is elicited from *living* people (e.g., "I pay to know the rhino exists"). The Asymmetry claims the absence of pain is good *even if no one enjoys that absence*. CBA cannot book a benefit without a beneficiary. To make it fit, we must pretend "Society" is a person with preferences. This converts a moral claim into a preference claim.
  *   **The Social Discount Rate (SDR):** Applying the SDR to future generations assumes we are comparing the *same* aggregate utility over time. In population ethics, changing the timing of conception changes *who* exists (Non-Identity Problem). CBA assumes a stable population identity for discounting to make sense. Using the SDR here smuggles in the assumption that "utility slots" are fungible across different possible people.

  #### 3. Unwritable Lines (Constitutive Limits)
  *   **"Benefit to No One":** The Asymmetry's claim that the absence of pleasure is "not bad" is writable ($0$). But the Total View's claim that it *is* bad is unwritable in strict CBA. You cannot have a line item for "Lost Surplus" if there is no one who lost it.
  *   **"Harm to No One":** Conversely, the Asymmetry's claim that we should count the downside of risky creation is technically unwritable if the child never exists. If we choose "No Creation," the suffering child never exists. Therefore, they are not harmed. CBA requires a counterfactual where the victim exists and is compensated. In the "No Creation" baseline, the victim is absent.
      *   *Workaround:* CBA handles this by using **Statistical Lives**. We don't compensate *the* child; we aggregate risk across *potential* children. This works for policy but dissolves the specific moral weight of the individual case.

  #### 4. Smuggled Assumptions
  *   **Methodological Individualism:** CBA assumes value resides in individual preferences. The Total View assumes value resides in *states of affairs*. Translating the Total View into CBA requires pretending states of affairs have preferences.
  *   **Revealed Preference:** CBA relies on what people choose. Potential people cannot choose. Any valuation for them is **Imputed Preference**, which is technically outside the bounds of welfare economics and inside the bounds of paternalistic planning.

  ---

  ### Part IV: Verdict

  **Does the residue point to a limitation of CBA or a philosophical confusion?**

  It points to a **constitutive limitation of CBA as a decision procedure for non-identity problems.**

  1.  **CBA is Contractual; Population Ethics is Teleological.**
      CBA is designed to adjudicate conflicts between existing preference-holders (a contractual model). It asks: "Can the winners compensate the losers?" The Procreation Asymmetry highlights that creation is not a transaction between existing parties. The "losers" (those deprived of life) do not exist to be compensated. The "winners" (those spared pain) do not exist to receive the benefit.
      When the seminar intuition says "10 good years were lost" in the Delayed Case, it is treating *utility* as a substance that exists independently of the *person*. CBA cannot book "floating utility." It requires a wallet. The philosophers are correctly identifying that CBA's bookkeeping rules (must have a wallet) exclude moral claims about the value of existence itself.

  2.  **The Person-Affecting View is the CBA Default.**
      The first group in your seminar (Person-Affecting) is essentially describing standard regulatory CBA. They are saying: "Don't book a line item without a stakeholder." This is not a moral stance so much as an audit requirement. If CBA adopts this view, it must conclude that delaying conception has zero cost and that risky creation is only risky regarding the downside (if we treat the upside as zero relative to non-existence).
      However, in practice, agencies (like the EPA or DOT) *do* use the Total View. They use VSL (Value of a Statistical Life) to justify regulations that save future lives. They are implicitly summing welfare across whoever ends up existing. They are "cooking the books" to get the Total View result while using CBA forms.

  3.  **The Verdict on the Asymmetry.**
      The Asymmetry cannot be fully expressed in CBA without breaking CBA's core axiom: **Value = Satisfied Preference.**
      *   The claim "Absence of pain is good (even if no one enjoys it)" violates *Value = Satisfied Preference*.
      *   The claim "Absence of pleasure is not bad" is consistent with *Value = Satisfied Preference* (no preference, no loss).
      *   Therefore, the Asymmetry is half-compatible with CBA.

  **Conclusion for Policy:**
  For policies like climate discounting or prenatal screening, CBA is structurally blind to the "Impersonal" claims of the Total View.
  *   **Climate Change:** CBA discounts future damages based on the preferences of future *rich* people. It ignores the harm of *non-existence* if the planet becomes uninhabitable, because dead people have no WTP. CBA will systematically undervalue existential risk unless we smuggle in a "catastrophe weight" (a philosophical adjustment).
  *   **Pronatalist Transfers:** CBA cannot justify subsidies for having children based on the *child's* future welfare (they don't exist to bid). It can only justify them based on the *parents'* WTP or positive externalities (tax base). If the moral argument is "it is good for children to exist," CBA has no vocabulary for this.

  **Final Recommendation:**
  The philosophers are not dressing up bookkeeping as morality. They are identifying that **bookkeeping is not morality.** CBA is a tool for efficiency among existing agents. It is not a tool for evaluating the creation of agents. To use CBA for population ethics, one must explicitly abandon the WTP foundation and adopt a Social Welfare Function with imputed values. This should be acknowledged as a departure from standard economic efficiency analysis, not a translation of it.

  If you present this in seminar, emphasize that the **"Residue" is the Value of Existence itself.** CBA can measure the quality of a life, but it cannot measure the value of the *container* of that life, because the container has no wallet.
