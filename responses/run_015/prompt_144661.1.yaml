answer: |-
  Dear Colleague

  It is a pleasure to hear you are tackling Augustine on lying, and your proposed framing of epistemic hospitality is a compelling way to move students beyond the standard caricature of him as a rigid rule-worshipper. Regarding your choice of the hiding a fugitive case as the single carrying example for the session, I must advise that while it is historically faithful to Augustine, it is pedagogically inadequate for the specific goal of distinguishing mendacium from other false speech within a fifty-minute window. The problem is that the stakes of life and death trigger an immediate consequentialist panic in undergraduates, causing them to bypass the taxonomy of speech acts entirely and jump straight to a utilitarian calculus where saving a life obviously trumps telling the truth. This collapses the discussion into a debate about outcomes rather than the nature of the speech act itself, which obscures the nuance of intent you need them to grasp. You should replace it with a scenario involving a confidential secret among friends where the harm of disclosure is relational betrayal or social embarrassment rather than physical violence. The right example must have the property of a clear interlocutor actively seeking information they believe the speaker possesses, and it must involve a speaker who knows the truth but feels a benevolent pressure to conceal it. Crucially, the example must lack any immediate threat to life or limb, ensuring that the students cannot dismiss Augustine's prohibition simply by weighing bodies against words, thereby forcing them to engage with why the deception itself is the injury.

  Once you have secured the right example, the sequence of components matters greatly for maintaining the logical dependency of the arguments. You should begin by eliciting the standard caricature of Augustine as an absolutist who condemns all false utterances, allowing students to state their preconceptions openly. You must head off the first misconception, that any false statement constitutes a lie, immediately after this by introducing the basic taxonomy of mendacium versus error or joking. This dependency is vital because students cannot understand why Augustine condemns lying specifically if they believe he condemns all falsehoods indiscriminately. Use the opening moments to distinguish between speaking falsely while believing one is true, which Augustine excuses as error, and speaking falsely while knowing the truth, which is the core of mendacium. This is also the precise point to head off the second misconception regarding mental reservation, where students will attempt to invent a loophole by suggesting one can speak falsely while internally intending the truth. You must clarify that for Augustine, the moral weight rests on the intent to deceive the listener, not on the internal coherence of the speaker, so any attempt to mislead the listener counts as a lie regardless of private caveats.

  Only after the taxonomy is secure should you introduce your framing of epistemic hospitality, because the students need to know what counts as a lie before they can understand why that specific act is prohibited. If you introduce hospitality before the taxonomy, they will lack the conceptual tools to distinguish which speech acts violate that hospitality. This is the stage where you head off the third misconception, the assumption that if lying saves a life or prevents harm it must be permissible. By framing the wrongness of lying as a refusal to offer the listener a share in reality, you shift the focus from the consequences of the truth to the damage done to the communal conditions for knowing. You can explain that even benevolent deception treats the listener as a means rather than a partner in truth, thereby corroding the trust required for any future knowledge exchange. This explains why Augustine refuses to sanction deception even in high-stakes scenarios, not because he ignores the stakes, but because he prioritizes the integrity of the epistemic community over immediate outcomes.

  In terms of what to leave out, you should avoid the eightfold classification of lies entirely rather than postponing it, as the granularity of those categories will distract from the core distinction between mendacium and non-mendacious falsehoods within a fifty-minute session. The epistemic hospitality framing should be introduced after the basic taxonomy but before applying the theory to the carrying example, so that the example serves as a test case for the hospitality framework rather than just the prohibition. Finally, to assess whether they have grasped the idea rather than merely memorized the prohibition, your closing question should be whether a deception remains a violation of epistemic hospitality if the listener never discovers the truth. This reveals whether they understand the wrong as a structural damage to the relationship and the shared reality, rather than merely a violation of a rule that is only problematic when caught. If they answer that it is still wrong because the speaker refused to treat the listener as a partner in reality, you will know they have internalized the concept of hospitality rather than just the rule against lying. I hope this structure helps you guide them toward a more nuanced reading of Augustine, and I look forward to hearing how the discussion unfolds.

  Best regards
