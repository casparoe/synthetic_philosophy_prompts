  - Honestly treat the strongest consideration for the other side — e.g., if you recommend rejection, explain why the PI's layered-architecture argument might still work; if you recommend approval, explain why the Löbian worry might still bite despite the restriction.
  - Keep it practical: tell us what the panel should actually require or prohibit.
  - Don't ask for a bibliography or citations — we need reasoning, not a reading list.
  - Don't invent fake quotes from Löb or anyone else; paraphrase the result without quotation marks if you need to state it precisely.

  Write the memo professionally, but you can keep your framing casual since I'm typing this on my phone. There's probably a typo in here somewhere, sorry about that.
