answer: |-
  **Project Title:** The Informational Structure of Reflection

  **The Question**
  Van Fraassen's Reflection Principle requires that your current credence in A, conditional on your later credence in A being *x*, should itself be *x*. Standard defenses rely on diachronic coherence or expert deference: later-you knows more, so current-you should listen. But this breaks down in memory-loss cases, conceptual shifts, or fission scenarios where later-you knows less, or knows something *different*.

  My project asks: **Is there a principled way to weight deference based on the informational relation between temporal stages, or is Reflection an all-or-nothing principle that must be strictly restricted?**

  I am treating both outcomes as success. If I can derive a deference weight from the structure of the information transition (e.g., "defer 0.5 when evidence is wiped but identity persists"), that generalizes Reflection. If I prove that any weight other than 0 or 1 is ad hoc, that establishes Reflection as a narrow constraint applicable only to ideal learning. Both results clarify the normativity of credence over time.

  **Context & Gap**
  The literature currently handles Reflection's failures via patchwork. Some restrict the principle to non-self-locating propositions. Others abandon Reflection in favor of Conditionalization (which assumes no memory loss). Still others move to imprecise credences to absorb the uncertainty.

  These moves dodge the structural issue. Restricting the *proposition* type doesn't explain why the *temporal relation* matters. Switching to Conditionalization assumes the very ideal learning conditions where Reflection already works. Imprecise credences model the uncertainty but don't tell us how to update.

  Nobody has systematized the *informational relation* between stages. It is not always "later knows more." Sometimes later knows strictly less (evidence wiping). Sometimes the relation is sideways (conceptual change where the proposition shifts meaning). Sometimes it is divergent (fission). Existing positions treat these as isolated counterexamples to be blocked. I am treating them as data points for a taxonomy of temporal relations. The gap isn't a lack of cases; it's a lack of a framework connecting the cases to the norm.

  **Method & Angle**
  I am not collecting more counterexamples. The literature is already saturated with Sleeping Beauty variants and forgetting cases. Adding another puzzle case doesn't solve the theoretical instability.

  My angle is to shift from case-based intuition to structural classification. I will define a set of informational relations (Expansion, Contraction, Transformation, Fission) and test whether Reflection can hold across them via a variable deference parameter. The core test is whether the weight assigned to later credence can be derived from the relation type itself, or if assigning any weight between 0 and 1 is merely arbitrary.

  This gets me something more test cases cannot: a unified diagnosis. If the project succeeds, we don't just know that Reflection fails in Case X; we know *why* it fails in any case sharing X's informational structure. If it fails, we know exactly where the boundary of the principle lies.

  **Work Plan (12 Weeks, ~15 hrs/week)**
  *Given teaching commitments, I am prioritizing depth over breadth. I will not cover every edge case in the literature.*

  *   **Weeks 1–4: Taxonomy Construction.** I will formalize the informational relations. I need clear definitions for "strictly more evidence," "evidence loss," "conceptual shift," and "subject multiplication." I will map standard counterexamples (Sleeping Beauty, Arntzenius's Shifty Propositions, fission cases) onto this taxonomy to ensure it captures the relevant distinctions. Deliverable: A structured matrix of cases vs. relations.
  *   **Weeks 5–8: Testing Weighting Schemes.** I will attempt to construct a function that maps relation types to deference weights. I will test this against Dutch Book arguments and expertise norms. Does a "Contraction" relation logically entail a weight of 0? Does "Expansion" entail 1? I expect to find that intermediate weights are unstable. Deliverable: Draft arguments for the impossibility of principled intermediate weights.
  *   **Weeks 9–12: Synthesis and Drafting.** I will write the paper arguing for the restricted principle. If the weighting scheme holds up (unlikely but possible), I will formalize that instead. I will spend the final weeks tightening the definitions to ensure the "all-or-nothing" conclusion doesn't rely on hidden assumptions about rationality. Deliverable: Full draft ready for external review.

  **Deliverable**
  A 15–20 page paper suitable for submission to a journal like *Philosophical Studies* or *Episteme*. The paper will include:
  1.  The taxonomy of informational relations (as a table/figure).
  2.  The argument against principled intermediate weights.
  3.  A restricted formulation of Reflection that survives the taxonomy.
  4.  Two worked cases (one memory loss, one conceptual change) demonstrating the restriction in action.

  This is feasible within the timeframe because I am limiting the scope to the *structure* of the transition, not every metaphysical implication of personal identity.

  **Risks & Failure Conditions**
  *   **Genuine Negative Result:** If I prove that intermediate weights are ad hoc, that is a success. It clarifies the landscape.
  *   **Waste of Time:** The project fails if the "informational relation" taxonomy turns out to be just as vague as the intuitions it's meant to replace. If I cannot define "conceptual shift" without relying on prior judgments about whether Reflection should hold, the analysis is circular. I will monitor this in Weeks 3–4. If the definitions rely on the verdicts they are supposed to generate, I will pivot to simply arguing for the restricted principle without the taxonomy.
  *   **Scope Cut:** If the fission cases become too metabolically expensive (requiring too much metaphysics of identity), I will cut them. They are illustrative, not essential. The core argument rests on memory loss and conceptual change.
  *   **Dead End:** The only true dead end is if the informational relation proves irrelevant to normativity entirely. If it turns out that evidence quantity doesn't correlate with deference rights regardless of structure, the project collapses. I mitigate this by treating that outcome as the "all-or-nothing" result mentioned above. Even if the relation doesn't support weighting, establishing that it *doesn't* is a result.

  **Summary**
  Reflection is currently a principle in search of a domain. I propose to define that domain by analyzing the informational architecture of the agent over time. Whether the result is a generalized weighted principle or a strictly restricted one, the output will be a clearer norm for diachronic credence.
