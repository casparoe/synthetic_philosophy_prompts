answer: |-
  Here is the teaching arc. It is designed to be facilitative, not expository. You are managing the conversation, not delivering the content.

  ### 1. The Prerequisite Concept (The Trap)
  **The Idea:** The **Kantian Orthodoxy** (The Epistemic-Modal Collapse).
  **Why it matters:** Before "Necessary A Posteriori" sounds like a contradiction, your group must believe that **Modality** (how the world *must* be) and **Epistemology** (how we *know* the world) are the same thing.
  **The Setup:** Start by asking them to define "Necessary."
  *   **Likely Answer:** "True in all possible worlds."
  *   **The Trap:** Watch for the follow-up: "...and therefore knowable by reason alone."
  *   **Your Move:** If they conflate *truth conditions* with *justification conditions*, you have them exactly where you need them. If they don't, you must artificially induce this confusion first, because that is the intuition Kripke is attacking.

  ### 2. The Carrying Example: Do Not Use Neptune
  **Verdict:** **Neptune does not work for Necessary A Posteriori.**
  **Why:** Kripke uses Neptune to illustrate the *Contingent A Priori*. Le Verrier named "Neptune" as "the planet causing these perturbations." For him, the statement was known by stipulation (A Priori) but could have been false if another planet caused the perturbations (Contingent).
  **The Risk:** If you use Neptune for *Necessary A Posteriori*, logic-savvy students will catch the category error and derail the session on reference-fixing vs. synonymy.
  **The Alternative:** Use **Heat = Molecular Motion**.
  **Why:** It fits "logic kids." It distinguishes the *sensation* (feeling hot) from the *referent* (kinetic energy). It avoids the "Morning Star" fatigue and the Fregean "Sense" rabbit hole.
  **Why not Morning Star?** It invites students to talk about "modes of presentation" (Frege) rather than "rigidity across worlds" (Kripke). You want to talk about *objects*, not *senses*.

  ### 3. The Teaching Arc & Misconception Map

  #### Phase 1: The Intuition Pump (10 mins)
  *   **Activity:** Write two columns on the board: **Metaphysics** (How the world is) and **Epistemology** (How we know).
  *   **Prompt:** "Is 'All bachelors are unmarried' necessary? Is it a posteriori?" (They will say Necessary/A Priori). "Is 'There is a cup on the table' necessary?" (Contingent/A Posteriori).
  *   **Misconception:** *Necessary = Tautology.* They think necessity is a property of *sentences*, not *propositions*.
  *   **Head Off:** Force the distinction early. "Kripke claims necessity is about the *world*, not the *words*. A sentence can be necessary even if it takes a lab to find out."
  *   **Goal:** Establish the traditional grid (Necessary/A Priori | Contingent/A Posteriori) so you can break it.

  #### Phase 2: Rigidity as a Tool, Not a Theory (15 mins)
  *   **Activity:** Define Rigid Designator quickly. "A term that picks out the same object in every possible world where that object exists."
  *   **Misconception:** *Names are Descriptions.* Logic kids love Russell. They will argue "Neptune" just *means* "the planet perturbing Uranus."
  *   **Head Off:** Don't argue the Gödel/Schmidt proof (see "The Skip" below). Instead, use a **Counterfactual Test**. Ask: "In a world where no one discovered Neptune, does Neptune exist?" If yes, the name isn't synonymous with the discovery description.
  *   **Goal:** Get them to agree that proper names (and natural kind terms like 'Heat') point directly to the thing, not a list of properties.

  #### Phase 3: The Wedge (15 mins)
  *   **Activity:** Apply Rigidity to **Heat = Molecular Motion**.
  *   **Step A:** Is 'Heat' rigid? Yes, it picks out *that* phenomenon (whatever causes the sensation of heat).
  *   **Step B:** Is 'Molecular Motion' rigid? Yes, it picks out *that* physical state.
  *   **Step C:** If they are identical, are they necessarily identical? (Leibniz's Law).
  *   **Misconception:** *Empirical Discovery = Contingent.* They will say, "We had to measure it to find out, so it could have been otherwise."
  *   **Head Off:** Distinguish **Fixing the Reference** from **Giving the Meaning**. We used the sensation of heat to *find* the referent (A Posteriori), but once found, the identity holds in all worlds. "We needed a telescope to find Hesperus, but that doesn't make Hesperus being Phosphorus contingent."
  *   **Goal:** Show that *how we found it* (Epistemology) doesn't change *what it is* (Metaphysics).

  #### Phase 4: The Synthesis (10 mins)
  *   **Activity:** Revisit the Phase 1 Grid.
  *   **Prompt:** "Where does 'Heat is Molecular Motion' go?"
  *   **Resolution:** It goes in **Necessary A Posteriori**.
  *   **Why:** It's Necessary (rigid designators refer to the same essence in all worlds). It's A Posteriori (we needed experience to identify the essence).
  *   **Goal:** Make the "contradiction" dissolve into a distinction between two different philosophical categories.

  ### 4. The Skip
  **Skip:** **Kripke's Modal Argument Against Descriptivism (The Gödel/Schmidt Case).**
  **What to say:** "We are taking Rigidity as a given for today. Kripke has a famous argument involving Gödel and Schmidt to prove names aren't descriptions, but that's a debate about *semantics*. We are focusing on the *modal consequences* of rigidity. If we get bogged down in proving rigidity, we won't have time to see why it breaks the Necessary/A Priori link."
  **Why:** This argument is technical, distracts from the main point (modality), and logic kids will try to solve the puzzle rather than absorb the modal lesson.

  ### 5. The Check Question
  Do not ask them to define terms. Ask them to apply the distinction to a new case.

  **The Question:**
  > "Imagine we discover a substance that looks, tastes, and behaves exactly like water, but its chemical structure is **XYZ**, not **H2O**.
  >
  > **1.** Is this substance Water?
  > **2.** Is the statement 'Water is H2O' contingent or necessary?
  > **3.** If it's necessary, why did we need chemistry to figure it out?"

  **What to listen for:**
  *   **Fail:** They say "It's water because it looks like water" (Confuses reference-fixing with meaning).
  *   **Fail:** They say "It's contingent because science could be wrong" (Confuses epistemic uncertainty with metaphysical possibility).
  *   **Pass:** They say "It's not water (it's fake water). 'Water is H2O' is necessary because 'Water' rigidly designates H2O. We needed chemistry to *identify* the rigid designator, not to make the truth hold."

  ### Summary of Logistics
  *   **Prerequisite:** Kantian Epistemic-Modal Collapse.
  *   **Example:** Heat = Molecular Motion (Do not use Neptune).
  *   **Skip:** Gödel/Schmidt Descriptivism Argument.
  *   **Check:** The Twin-Earth/Water-XYZ scenario.
  *   **Tone:** "We are separating the map (epistemology) from the territory (metaphysics)."
