answer: |-
  **UNIVERSITY OF [REDACTED]**
  **DEPARTMENT OF PHILOSOPHY**
  **MODULE: PHI 404 — INTUITION, CULTURE AND THE LIMITS OF THE ARMCHAIR**
  **FINAL EXAMINATION**

  **TIME ALLOWED:** 90 MINUTES
  **INSTRUCTIONS:** ANSWER THE FOLLOWING QUESTION. NO ELECTRONIC DEVICES. NO DICTIONARIES.

  **QUESTION 1**

  Consider the **Kalu Case**: In a village, everyone learns the name "Kalu" from a single storyteller. The stories are all true of a man called Kofi, who died abroad twenty years ago; nobody in the village has ever heard of Kofi. Villagers say "Kalu was wise." When asked, one population says the villager is talking about Kofi (causal link); another says she is not (descriptive link).

  Consider the **Control Case**: Ama puts her keys in the drawer at noon. At 3pm, nobody having entered the room, we ask if she knew where the keys were. Both populations say yes.

  Recall **The Bridle**: Any explanation offered for the divergence in the Kalu Case (e.g., confusion, pragmatic noise, miscomprehension) must not predict divergence in the Control Case. You cannot claim the Kalu results are "noise" unless you explain why the Control results are not.

  **Essay Prompt:**
  Grant the Bridle. Does the divergence in the Kalu Case give us reason to revise our theories of reference, or does it undermine the method of using intuitions as evidence entirely? Your answer must specify what would have to be true for you to change your mind. Distinguish between claims that are empirically settled and those that remain philosophically contested.

  ***

  **MODEL ANSWER (DR. VASA'S KEY)**

  The prompt forces a choice between revising semantic theory or abandoning the evidential status of intuitions. Granting the Bridle blocks the easiest escape route: dismissing the variation as mere performance error. If the villagers understood the Control Case uniformly, they possess the cognitive machinery to track facts. Therefore, the divergence in the Kalu Case is not generic confusion. It is specific to the philosophical stakes.

  To save the method without revising the theory, one must argue that intuitions are not data points but normative claims. On this view, the survey does not reveal what reference *is*, but what people *think* it should be. The variation shows disagreement on norms, not instability in the subject matter. However, this moves the goalposts. If intuitions are normative, they require justification beyond their mere occurrence. We cannot simply count heads; we must weigh reasons. This saves the theory of reference (e.g., causal-historical) but costs the method of experimental philosophy. The empirical variation becomes irrelevant to the truth of the theory, relevant only to the sociology of belief.

  Alternatively, one might defend the "expertise defense." This is often deployed lazily—claiming philosophers simply know better. To cash this out without begging the question, one must argue that expertise alters the perceptual salience of relevant features. A trained philosopher does not just have more opinions; she notices the causal chain where a layperson sees only a description. However, this claim is live and contested. There is no robust evidence that philosophical training eliminates bias rather than codifying it. It is broadly settled that variation exists across populations; it is not settled that training neutralizes this variation. If expertise is merely enculturation into a specific Western academic norm, the Bridle holds: why did the training fix the Kalu intuition but not the Control intuition? The Control case requires no training. This suggests the Kalu case relies on theoretical commitments that the Control case does not.

  Therefore, the divergence gives us reason to revise the method, if not the theory. We cannot treat intuitions as pre-theoretical evidence. They are theory-laden judgments. To treat them as data is to confuse the verdict with the evidence.

  What would change my mind? Two conditions. First, evidence that the divergent groups are operating with genuinely distinct semantic concepts, not just different pragmatic strategies. Second, a demonstration that expert intuitions converge on the correct answer independently of the theory they are trained to defend. Currently, the first is contested (semantic pluralism vs. ambiguity), and the second is empirically unsupported. Until then, the programme is asking a question it cannot answer: it seeks objective evidence from subjective verdicts that vary by culture. The Bridle ensures we cannot call this variation noise. We must call it what it is: disagreement.

  ***

  **MARKING SCHEME (TOTAL 20)**

  **1. Application of the Bridle (4 marks)**
  *   **Award:** Correctly identifies that the Bridle blocks "error theory" or "noise" explanations unless they explain why the Control Case remained stable.
  *   **Common Error:** Candidates claim the villagers "didn't understand the story" without addressing why they understood Ama's keys perfectly.

  **2. Handling the "Normative" Move (4 marks)**
  *   **Award:** Recognizes that shifting intuitions from "data" to "normative claims" saves the theory but abandons the experimental method.
  *   **Common Error:** Students treat this shift as a solution that saves both, failing to see it renders the survey results philosophically inert.

  **3. Handling the "Expertise" Defense (4 marks)**
  *   **Award:** Rejects the lazy "philosophers know better" claim; requires a mechanism (e.g., altered perceptual salience) and notes the lack of evidence for it.
  *   **Common Error:** Accepting "expertise" as a brute fact without explaining *how* training changes the intuition rather than just the verdict.

  **4. Distinction: Settled vs. Contested (4 marks)**
  *   **Award:** Clearly marks empirical variation as broadly settled; marks the significance of that variation (and the expertise defense) as live/contested.
  *   **Common Error:** Presenting the *implications* of the variation as settled fact (e.g., "This proves reference is cultural") rather than a live debate.

  **5. Condition for Revision (4 marks)**
  *   **Award:** Specifies a concrete condition for changing mind (e.g., proof of distinct concepts, convergence independent of theory) rather than vague hope.
  *   **Common Error:** Offering a tautology ("I would change my mind if I saw better data") without specifying what makes the data "better."
