answer: |-
  **Mark: 12/20**

  **Breakdown:**
  *   **(a) 6/7**
  *   **(b) 3/7**
  *   **(c) 3/6**

  ---

  ### **Detailed Feedback**

  #### **Part (a): The Concept vs. Feelings (6/7)**
  **What works:**
  *   **Control of Variables:** You correctly identify the logical core of the experiment: the cases are matched on causal structure and mental states (foreseeability, indifference), differing *only* in moral valence. This is the crucial premise for ruling out the "greedy executive" bias explanation.
  *   **Knobe's Conclusion:** You accurately state Knobe's philosophical upshot: that the folk concept of intentional action is not "purely descriptive" but depends on normative facts. This shows you understood the lecture material on the "Moral Pervasion" or "Constitutive" view.

  **Where points were lost:**
  *   **Competence vs. Performance:** You mention that moral judgment "feeds into" the ascription, but you don't explicitly distinguish between a *performance error* (people have the right concept but get too angry to apply it correctly) and a *competence change* (the concept itself *includes* moral judgment). The prompt asks why this shows something about the *concept*. To get full marks, you needed to explicitly state that if it were just feelings about CEOs, the underlying concept would remain stable while judgments varied due to bias. Knobe argues the concept *itself* shifts. You hint at this, but the distinction needs to be sharper.

  #### **Part (b): The Twin-Wetland Variant (3/7)**
  **What works:**
  *   **Methodological Point:** You correctly identify that a within-subjects design controls for individual variation. This is a good methodological observation.
  *   **Attitude Account Prediction:** Your prediction for the rival (Attitude/Mental State) explanation is correct: since the CEO's attitude (indifference) is identical toward both wetlands, this theory predicts symmetry (either both intentional or both unintentional).

  **Where points were lost (Significant Errors):**
  *   **The Moral Account Prediction:** You claim the Normative/Moral Account predicts the asymmetry should *disappear* because the *net* outcome is neutral. This is incorrect. The Knobe Effect relies on the moral valence of the *specific side effect* being queried, not the net utility of the program. Destroying a wetland is locally bad; restoring one is locally good. Therefore, the Moral Account predicts the asymmetry should **persist** (Intentionally destroy, unintentionally restore), regardless of the net neutral outcome. You have misunderstood how the moral valence is applied in the theory.
  *   **"Settling the Debate":** You claim that if the result goes one way, "the debate is essentially over." This is philosophically naive. In experimental philosophy, data rarely "settles" conceptual debates because theories can be adjusted (e.g., by appealing to pragmatic ambiguity, or by refining what counts as the "relevant" moral feature). Never claim a single experiment ends a philosophical dispute.
  *   **Consequence:** Because your prediction for the Moral Account is wrong, your analysis of what the result would mean is also compromised.

  #### **Part (c): Methodological Moral (3/6)**
  **What works:**
  *   **Engagement:** You take a clear stance and engage with the idea that intuitions might be unreliable.
  *   **Negativity Bias:** Bringing in the idea of negativity bias shows wider reading or engagement with seminar discussion.

  **Where points were lost (Critical Inconsistencies):**
  *   **Contradiction with Part (a):** This is the most serious issue in the essay. In (a), you correctly argued that Knobe believes moral judgment is *constitutive* of the concept (it's not an error). In (c), you write that Knobe's reading is that verdicts get "**contaminated**... exactly the sort of error experiments exist to correct." These are opposite claims. If it's contamination, it's a bias to be removed. If it's constitutive, it's how the concept *works*. You cannot argue both.
  *   **Is/Ought Confusion:** You argue that appeals to intuition should be "replaced... by experimental data about what people actually think." This commits a category error. Experimental data tells us what people *do* believe (descriptive); philosophy is often concerned with what people *ought* to believe or what is *justified* (normative). Polling the folk doesn't solve the philosophical problem of whether the CEO *actually* acted intentionally, only whether people *say* he did. You needed to assess whether "what people think" is actually relevant to philosophical truth, not just assert that data is better than "one person's hunch."
  *   **Undermining your own conclusion:** You end by saying the effect "matters less for philosophy than is sometimes claimed." If you believe the methodological moral is "right" (as you state in the first sentence), you should argue it matters *more*. The conclusion contradicts your opening thesis.

  ### **Summary for the Student**
  You have a strong grasp of the basic setup of the Knobe case (Part a), and you write clearly. However, your mark is limited by two major factors:
  1.  **Theoretical Precision:** In Part (b), you misapplied the Moral Account to a "net neutral" case. Remember that Knobe's effect is usually about the *local* action, not the global outcome.
  2.  **Consistency:** You contradicted yourself between Part (a) and Part (c). In (a) you treated the moral influence as part of the *concept*; in (c) you treated it as a *contaminating error*. You need to decide which interpretation you are defending and stick to it. Additionally, be very careful about claiming that empirical data can simply "replace" philosophical analysis; you need to justify why popular opinion is philosophically authoritative.
