answer: |-
  Here is a diagnosis of the stalemate, structured around your hypotheses.

  ### 1. The Core Diagnosis: A Category Error Disguised as a Metaphysical Boundary

  The debate is stalled because participants are treating the doing/allowing distinction as a **metaphysical classification of events** (a question about the world and the agent's relation to it) when it is actually a **heuristic for normative baselines** (a question about expectations and duties).

  The "maximum intuitive grip, maximum theoretical fragility" combination you identify is the signature of a concept that is doing heavy normative lifting while pretending to be descriptive. The intuition is robust because it tracks something real: the violation of a negative duty (do not harm) usually feels distinct from the failure to fulfill a positive duty (aid). The theory is fragile because every attempt to define the distinction in *non-normative* terms (causation, movement, counterfactuals) is defeated by cases where the normative baseline shifts without the physics changing (your default-flip pairs).

  The stalemate persists because the "Doing" side tries to ground the distinction in the *agent's activity*, while the "Allowing" side tries to dissolve it by showing the *outcome is identical*. Both miss that the moral weight comes from the **prior specification of the baseline**, which is itself a moral question, not an action-theoretic one.

  ### 2. Diagnosing the Three Stacked Questions

  Your first hypothesis is correct: there are three questions, but they are not merely stacked; they are **nested in a way that creates a dialectical illusion.**

  *   **Question 1 (Extension):** Which cases count as doing?
  *   **Question 2 (Significance):** Does the classification matter morally?
  *   **Question 3 (Explanation):** Why does it matter?

  **The Load-Bearing Question:** The **Extension** question is the load-bearing one, but only because it is the Trojan Horse for the Significance question.
  *   *Why the debate stalls:* Proponents of the distinction argue for Significance by pointing to clear cases of Extension (e.g., stabbing vs. withholding food). Opponents argue against Significance by manipulating Extension (e.g., default-flip pairs) to show the classification is arbitrary.
  *   *The Illusion:* When a proponent says, "Cutting the visitor is clearly *doing*," they are not making a purely descriptive claim. They are asserting a normative baseline ("Bodily integrity is the default"). When an opponent says, "The pump case shows *doing* and *allowing* are extensionally equivalent," they are asserting a different baseline ("Causal sequence is the default").
  *   *Diagnosis:* The debate looks like a failure to agree on Extension, but it is actually a failure to agree on **which normative baselines should govern the description of the action.** You cannot settle Extension without settling Significance, because the criteria for "Doing" are saturated with normative expectations. This is why papers that settle one (e.g., a precise counterfactual account of Extension) are read as failing to settle the others (e.g., they don't explain *why* that counterfactual dependence matters).

  ### 3. The Extensional Problem: Default-Flip Pairs and the "Inert" Baseline

  Your second hypothesis identifies the precise point of theoretical fracture. The "default-flip" cases (the infusion pump examples) demonstrate that the extension of the distinction is **hostage to institutional or engineering conventions.**

  If the moral verdict flips based on whether a pump is "fail-safe" or "fail-deadly," three possibilities arise, as you noted. Here is the diagnosis of why this specific family of cases prevents convergence:

  1.  **The Artifact View:** If the distinction tracks engineering defaults, it is morally inert. *Diagnosis:* This is too deflationary. It explains the fragility but not the grip. People feel a genuine moral difference even when they know the engineering is arbitrary.
  2.  **The Temporal Shift View:** The "doing" happened when the designer set the default. *Diagnosis:* This is theoretically sound but psychologically unsatisfying for the agent at the bedside. It dissolves the distinction for the nurse but preserves it for the hospital administrator. This explains why the debate splits along professional lines (law/medicine vs. pure ethics).
  3.  **The Normative Baseline View (The Strongest Diagnosis):** The "default" is not a physical state; it is a **normative expectation.**
      *   In the "stop unless reset" case, the normative expectation is that the machine stops (perhaps due to resource scarcity protocols). The nurse *intervenes* against the institutional plan.
      *   In the "run unless stopped" case, the normative expectation is continuity of care. The nurse *intervenes* against the therapeutic plan.
      *   *The Revelation:* The doing/allowing distinction is not tracking *movement vs. stillness*. It is tracking **deviation from a normatively loaded status quo.**

  **Why this causes stalemate:** Defenders of the distinction want to say the baseline is natural or pre-moral (e.g., "the body's natural state"). Opponents show the baseline is conventional (e.g., "the machine's setting"). The truth is that the baseline is **normative**.
  *   If you define "Doing" as "Intervention on a morally expected course," the distinction is stable, but it collapses into the question of "What was owed?"
  *   If you define "Doing" as "Physical intervention," the distinction is unstable (as per the pump cases).
  *   *Conclusion:* The debate is stuck because defenders are trying to defend a *physical* distinction that only has power as a *normative* one. They cannot admit the baseline is normative without conceding that the real work is being done by the theory of duties, not the theory of action.

  ### 4. The Aggregation Test: Constraint vs. Outcome

  Your aggregation test (10,000 omissions vs. 1 killing) isolates the **Normative Significance** question from the Extension question.

  *   **The Conflict:**
      *   If the distinction is an **agent-relative constraint** (I must not kill), it resists aggregation. My duty is not to violate the constraint, regardless of how many others do.
      *   If the distinction is an **outcome evaluation** (Death by killing is worse than death by letting die), it aggregates. 10,000 "worse" deaths are worse than 1 "worse" death.
  *   **The Diagnosis:** The stalemate exists because the "Doing" side often relies on the *Constraint* intuition (the sanctity of the agent's will) while arguing about *Extension* (the definition of the act). The "Allowing" side often relies on *Outcome* equivalence (the victim is dead either way) to argue against the *Significance*.
  *   **Result:** They are arguing past each other. One side is asking, "Is this agent blameworthy?" (Constraint). The other is asking, "Is this state of affairs worse?" (Outcome). The doing/allowing distinction is being asked to bridge these two incompatible frameworks. It cannot do so. It is a tool for assessing individual agency, not for summing global utility. When forced to aggregate, the distinction either breaks or reveals that it was never about the "doing" at all, but about the **stringency of the duty.**

  ### 5. Verdict on the Nature of the Dispute

  Is this verbal, substantive, pluralistic, or ill-posed?

  **Diagnosis:** It is a **Substantive Dispute misidentified as a Metaphysical One.**

  *   It is not merely verbal; there is a real moral phenomenon being tracked (the asymmetry in duties).
  *   It is not ill-posed; it serves a vital function in law and medicine (allocating liability and defining standard of care).
  *   It is **Pluralistic**, but not in the way usually claimed. It is not that there are "many types of doing." It is that the distinction serves different master concepts in different domains:
      *   **In Law:** It tracks *causation and liability* (did you introduce the harm?).
      *   **In Medicine:** It tracks *bodily integrity and resource allocation* (are you invading the body or withholding a resource?).
      *   **In Moral Philosophy:** It tracks *agent-relative constraints* (what may I not do?).
  *   **The Stalemate Source:** Philosophers attempt to unify these into a single metaphysical theory of action. They fail because the "Doing" in law (causation) is not the "Doing" in medicine (invasion) which is not the "Doing" in deontology (constraint violation). The "Default-Flip" cases expose this: in engineering, the default is technical; in medicine, the default is therapeutic; in law, the default is statutory. When these come apart, the moral intuition fractures.

  ### 6. What Counts as Progress?

  Given this diagnosis, standard moves (new cases, refined counterfactual analyses) will not work. They treat the symptom (Extension) rather than the disease (Baseline Specification).

  **Progress would look like one of the following:**

  1.  **The Dissolution of Extension:** A successful argument showing that the Extension question *cannot* be answered without first answering the Normative Baseline question. This would shift the debate from "Is this killing?" to "What was the relevant duty here?" This dissolves the first of your three questions into the third.
  2.  **The No-Go Result:** A formal proof that no assignment of cases to "Doing" and "Allowing" can satisfy the desiderata of both Consistency (same verdict for default-flips) and Intuitive Grip (preserving the surgeon/trolley asymmetry) without referencing normative duties. This would force the field to abandon the action/omission taxonomy in favor of a duty-based taxonomy.
  3.  **Empirical Relocation:** Experiments on default-flip pairs that show verdicts *do not* flip when the normative expectation is held constant, even if the physics flip. (e.g., If subjects are told the "fail-deadly" pump is the *standard of care*, do they judge stopping it as worse?). If verdicts track the *norm* rather than the *switch*, it confirms the Normative Baseline diagnosis.
  4.  **Replacement Taxonomy:** Abandoning "Doing/Allowing" for **"Intervention/Non-Intervention relative to a Specified Baseline."** This makes the relativity explicit. It admits that the moral work is done by justifying the baseline, not by classifying the movement.

  **Recommendation:**
  The most productive path is the **Dissolution of Extension**. The debate should stop asking "Is this doing or allowing?" and start asking "What is the morally relevant baseline, and who bears the burden of justifying a deviation from it?"

  The doing/allowing distinction is not a map of the moral universe; it is a **placeholder for the boundary of obligation.** The stalemate exists because everyone is fighting over the map, when the territory is the obligation itself. Progress requires admitting that the distinction has no independent metaphysical footing; it is entirely derivative of the prior question: *What was owed?* Once that is settled, the "doing/allowing" label adds no new moral information, which explains why it is so hard to define independently, yet so hard to discard—it is the shadow cast by the structure of duty.
