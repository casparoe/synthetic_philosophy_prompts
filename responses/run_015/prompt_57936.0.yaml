answer: |-
  ### Take-Home Exercise: Evolutionary Debunking and Moral Contingency

  **Course:** Metaethics (PHL304)
  **Task:** Critical Analysis of Evolutionary Debunking Arguments
  **Word Limit:** Maximum 500 words
  **Marks:** 20

  **Prompt:**
  Consider two isolated forager bands, Band A and Band B. Band A evolved an intuition that food must be shared equally with non-kin. Band B evolved an intuition that food need not be shared equally with non-kin. In both local ecologies, the respective intuition promoted group survival. Members of both bands regard their own intuition as tracking an objective moral truth.

  Using this case, write a concise analysis addressing the following:
  1.  Reconstruct how an evolutionary debunker uses the **contingency** of these intuitions to challenge their **reliability**.
  2.  Evaluate whether appealing to the **survival value of cooperation** rescues moral reliability or merely restates the evolutionary explanation.

  ***

  ### Model Answer

  The evolutionary debunker argues that if our moral intuitions are fully explained by evolutionary pressures rather than moral truths, their reliability is undermined. This challenge relies heavily on the contingency of evolutionary history. In the case of Band A and Band B, conflicting intuitions regarding non-kin sharing are contingent upon local ecological pressures rather than moral reality. Both bands believe they track objective truth, yet their beliefs are diametrically opposed and equally adaptive. The debunker contends that because the etiology of these beliefs is independent of moral facts (driven solely by survival), we lack justification for believing them true. This is an argument from insensitivity: had the ecological pressures differed, our intuitions would differ, regardless of the moral truth. Since the best explanation for the beliefs is adaptive advantage, not truth-tracking, confidence in their objective status is defeated. The case illustrates that evolution selects for fitness, not accuracy.

  A common realist response appeals to the survival value of cooperation. One might argue that sharing promotes group survival, suggesting evolution tracked the genuine moral value of cooperation. However, this risks conflating adaptiveness with truth. In the case provided, Band B's *lack* of equal sharing also promoted survival. If contradictory norms are equally adaptive, adaptiveness cannot track a single objective truth. The existence of Band B shows that the specific content of the intuition is determined by ecological necessity, not moral reality. Thus, the survival value explains why the belief exists, not why it is true.

  Therefore, merely citing survival value does not rescue reliability; it restates the evolutionary explanation. To rescue reliability, the realist must show that evolutionary pressures aligned with independent moral truths, not just that they were useful. For instance, if rational reflection confirms sharing is right regardless of ecology, reliability might be saved. But if the only evidence for the norm is its survival value, the debunker wins: the belief is explained by fitness, not truth. The contingency of the bands' intuitions demonstrates that evolution selects for fitness, not accuracy. Unless the realist can provide an independent epistemic route to moral truths that converges with evolved intuitions, the appeal to survival value remains a genetic explanation that undermines, rather than supports, claims to objective knowledge. Ultimately, the case illustrates that adaptive success is compatible with moral falsehood, leaving the realist with an unbridged gap between 'helpful' and 'true'. Without an independent check, the survival argument is circular, presupposing the truth of the intuition to explain its survival, while the debunker shows survival explains the intuition regardless of truth.

  ***

  ### Marking Scheme (20 Marks)

  **1. Reconstruction of the Debunking Argument (8 Marks)**
  *   **Contingency (4 marks):** Must explain that the differing intuitions (A vs. B) result from ecological pressures, not moral facts. (2 marks for identifying the conflict; 2 marks for linking conflict to contingency).
  *   **Reliability Challenge (4 marks):** Must articulate that because the etiology is independent of truth (adaptive vs. true), the beliefs are insensitive to moral facts. (2 marks for mentioning etiology/independence; 2 marks for concluding unjustified reliability).
  *   *Penalty:* Deduct 2 marks if the student claims evolution proves the intuitions are false (debunking challenges justification, not necessarily truth).

  **2. Evaluation of the Survival Value Response (8 Marks)**
  *   **Distinction (4 marks):** Must distinguish between 'adaptive' (survival) and 'true' (moral fact). Recognizing that Band B's opposite norm was also adaptive is crucial here.
  *   **Verdict (4 marks):** Must conclude that appeal to survival value *restates* the explanation rather than *rescuing* reliability, unless independent access to truth is posited.
  *   *Penalty:* Deduct 4 marks if the student argues survival value successfully proves objective truth (conflation of is/ought or fitness/truth).

  **3. Clarity, Structure, and Constraints (4 Marks)**
  *   **Structure (2 marks):** Clear separation between the debunking reconstruction and the evaluation of the response.
  *   **Constraints (2 marks):** Adherence to word limit (400–500 words ideal; >550 or <300 forfeits marks) and philosophical terminology appropriate for third-year level.
  *   *Penalty:* Deduct 1 mark for significant grammatical obscurity; 2 marks for exceeding word limit by >10%.
