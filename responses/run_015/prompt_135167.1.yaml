      *   **Inside-Viewer's Stance:** Epistemic modesty doesn't require abandoning well-checked reasoning. Reference classes are tricky; narrowing them requires inside-view judgments. Standing firm is justified if the derivation holds up internally.
      *   **Outside-Viewer's Stance:** This is self-exempting rationalization. Base-rate reasoning blocks this. The feeling of "tracing steps" is a symptom of overconfidence in low-feedback domains. Modesty requires downward revision.
      *   **Requirements:** Real back-and-forth (addressing circularity, self-exemption, meta-cognition). No cheap compromise at the end. Tension must remain sharp.

  2.  **Character Voices:**
      *   **Inside-Viewer (IV):** Precise, focused on the specific argument structure, defends the integrity of the first-order reasoning. Values the "view from here."
      *   **Outside-Viewer (OV):** Skeptical, focused on statistical reliability, cognitive biases, and the "view from nowhere." Values the "view from above."

  3.  **Key Arguments to Weave In:**
