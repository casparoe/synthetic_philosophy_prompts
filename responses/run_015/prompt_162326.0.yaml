          *   Urn B (Risky): Known $P(Red) = P(Black) = P(Yellow) = 1/3$. This is *aleatoric* uncertainty (or epistemic uncertainty that has been collapsed to a point estimate with high confidence).
          *   Choices:
              1.  Bet on Red (A) vs. Bet on Black (A). People choose Red. Implies $P(Red) > P(Black)$.
              2.  Bet on Black or Yellow (A) vs. Bet on Red or Yellow (A). People choose Black+Yellow. Implies $P(Black) + P(Yellow) > P(Red) + P(Yellow) \Rightarrow P(Black) > P(Red)$.
              3.  Contradiction: $P(Red) > P(Black)$ and $P(Black) > P(Red)$.
      *   *ML Translation:*
          *   Standard ML assumes a generative model $P_\theta(x)$.
          *   Urn B: $\theta$ is known/fixed. Loss landscape is smooth.
          *   Urn A: $\theta$ is unknown. We have a posterior $P(\theta | D)$.
          *   Standard Bayesian approach: Predictive distribution $P(x) = \int P(x|\theta)P(\theta|D)d\theta$. This collapses to a single number for each bet.
          *   The Paradox in ML: If you optimize Expected Log Loss (or Expected Utility) over the predictive distribution, you *cannot* prefer Red over Black AND (Black+Yellow) over (Red+Yellow). The linearity of expectation kills you.
          *   Ambiguity Aversion in ML: This looks like minimizing a *non-linear* functional of the distribution. It's not $E[U]$. It's maybe $E[U] - \lambda \cdot \text{Var}(U)$ or $\min_{\theta \in \Theta} E_\theta[U]$.
      *   *Bias vs. Preference:*
          *   DT View: If you violate Sure Thing Principle, you are susceptible to Dutch Books (money pumps). It's a bug.
          *   ML/Robustness View: If the environment is non-stationary or adversarial, maximizing worst-case performance (DRO) is a feature, not a bug. The "bias" is a regularization term against model misspecification.
      *   *Commitment Flag:* ML vocab assumes we *can* write down a hypothesis space $\Theta$. DT leaves open whether probabilities even exist in the agent's head.

