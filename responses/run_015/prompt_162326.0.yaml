          *   Cost 2: **Value of Information.** A strict minimax agent might refuse free information if it could expand the uncertainty set (though usually, info shrinks the set). Actually, the bigger issue is that you can't separate "belief" from "attitude toward belief."
          *   Cost 3: **No Single Belief.** You don't have *a* distribution. You have a set. You can't sample from "the set" easily for generative tasks.

  4.  **Deconstruct Part 3: Inexpressibility (The "Single Measure" Dogma):**
      *   *DT Insistence:* Savage/P Ramsey say rationality *requires* a unique prior. If you don't have one, you're incomplete.
      *   *ML Stance:* We often work with sets (confidence intervals, conformal prediction, DRO).
      *   *The Gap:* DT argues about *normative rationality* (how you *should* reason to avoid exploitation). ML argues about *generalization performance* (how to not crash on test data).
      *   *Can ML express it?* ML can express the *math* (sets of distributions). But ML struggles to express the *ontological claim* that "Belief = Single Distribution."
      *   *Is it a hole?* It's a hole if you care about Dutch Book coherence as a definition of rationality. It's a feature if you care about robustness to distribution shift. The DT dispute is about whether coherence or robustness is the higher virtue. ML usually picks robustness implicitly.
      *   *Key Insight:* DT says "If you don't have a number, you're irrational." ML says "If you pretend you have a number when you don't, you're unsafe."

  5.  **Deconstruct Part 4: Newcomb's Ellsberg (Adversarial/Reflective):**
      *   *Setup:* Urn A composition depends on $f(\text{Agent's Policy})$.
      *   *ML Vocabulary:* This is **Distributional Shift induced by the Policy**. Or **Performative Prediction**. Or **Adversarial Training where the adversary has access to weights**.
      *   *Ambiguity vs. Risk:*
          *   Standard Ambiguity: Nature picks $\theta$ independently (or ignorantly).
          *   Newcomb Ambiguity: Nature picks $\theta$ *conditionally* on your action $a$. $P(\theta | a)$.
          *   In ML: This breaks the standard $P(x, y)$ assumption. It becomes a game. $ \min_\theta \max_\pi E_{\theta, \pi} [Loss] $.
      *   *Does distinction collapse?*
          *   Yes. If the adversary knows your weights, "epistemic uncertainty" about the urn is actually "strategic uncertainty" about the adversary's move in response to you.
