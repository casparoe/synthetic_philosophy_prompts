      *   *Reflective Cases:* In reflective cases (agent knows agent), the "uncertainty" is logical uncertainty (about the output of the computation). Standard prob theory doesn't handle logical uncertainty well (you can't put a prior on the truth value of a theorem you haven't proved yet).
      *   *Conclusion on Wrinkle:* The distinction dissolves into "Game Theoretic Robustness." Ambiguity aversion becomes a heuristic for "Don't let the adversary pin you."

  6.  **Synthesize and Refine:**
