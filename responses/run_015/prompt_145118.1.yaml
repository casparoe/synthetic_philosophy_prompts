      *   (i) Structural parallels: Prediction/Anticipation. Disanalogy: External vs. Internal.
      *   (ii) Conflations: Flicker of Freedom (the sign *is* the alternative), Conceptual vs. Empirical.
      *   (iii) Stronger Conclusion: Frankfurt = Alternatives Irrelevant. Student = Alternatives Impossible. This imports determinism.
