answer: |-
  **MEMORANDUM**

  **TO:** Board of the Frontiers Scheme, National Research Council
  **FROM:** Standing Review Panel, Cognitive Ecology & Evolution
  **DATE:** 12 March 2025
  **SUBJECT:** Mid-Term Review Decision: Programme Grant *Pre-Selection Without Words* (Ref: FR-2023-089)

  **1. DECISION**

  The Panel recommends that the second tranche of funding for *Pre-Selection Without Words* be **RELEASED, RE-PROFILED**.

  Continuation of the grant is contingent upon the Principal Investigators (PIs) submitting a revised experimental protocol within 90 days, to be executed over the next 18 months. The final milestone for this re-profiled work package is set for **12 September 2026**.

  **2. SCIENTIFIC RATIONALE**

  The interim report presents robust data on "costly checking" behavior in corvids. However, the Panel agrees with the critique raised during review: the current apparatus confounds internal pre-selection (Popperian simulation) with environmental affordance (Gregorian scaffolding).

  In the current setup, the physical properties of the apparatus (weight, transparency) encode the solution. A bird need not simulate a failed action in its head to avoid it; it need only respond to the physical resistance or visual occlusion provided by the niche. As currently designed, the experiment cannot distinguish between a creature that *thinks* about the future and a creature that *feels* the present constraints of a well-structured environment.

  To validate the core hypothesis—that non-human animals pre-select actions via internal simulation—the PIs must demonstrate this capacity when the environmental scaffold is removed or rendered unreliable.

  **3. THE SETTLING CONDITION (18-MONTH MILESTONE)**

  To resolve the ambiguity between Skinnerian, Popperian, and Gregorian explanations, the re-profiled work must deliver the following result by 12 September 2026:

  **The "Decoupled Scaffold" Protocol:**
  The PIs must modify the apparatus so that the physical cues (e.g., flap weight, transparency) no longer reliably predict reward accessibility or motor cost.
  *   **Negative Result (Withhold Final Tranche):** If the birds cease checking behavior immediately when the physical correlation is broken, this indicates the "computation" was residing in the environment (Gregorian) or driven by immediate reinforcement (Skinnerian).
  *   **Positive Result (Release Final Tranche):** If the birds continue to incur the "costly check" despite the decoupling—specifically in novel contexts where they cannot rely on prior reinforcement history—this demonstrates an internal strategy to reduce uncertainty independent of environmental affordances. This would constitute evidence of Popperian pre-selection.

  This is a behavioural criterion, not a philosophical one. It requires no claim about "consciousness," only a demonstration that the information processing is resilient to the removal of external informational structures.

  **4. ENGAGEMENT WITH PANEL OBJECTIONS**

  A member of the Panel, representing comparative psychology, argued that (a) no behavioural signature can definitively distinguish internal from external pre-selection, and (b) welfare policy should track capacity for suffering rather than cognitive taxonomy. She contended that further funding is an expensive redundancy.

  The Panel finds this objection **partially correct, but insufficient to terminate the scientific inquiry.**

  *   **On Welfare (Agreed):** The Panel accepts that husbandry and enrichment standards must not wait for ontological certainty. The observed "costly checking" behaviour indicates a need for information control, regardless of where that processing occurs. Consequently, the Council's Welfare Working Group will **immediately** update enrichment guidelines for corvids to include "informational scaffolding" requirements, independent of this grant's final outcome. We do not need to prove the bird is Popperian to treat it as one if the cost of error is high.
  *   **On Scientific Redundancy (Disagreed):** The mechanism *does* matter for welfare. A Skinnerian creature suffers from punishment; a Popperian creature suffers from *uncertainty* and *counterfactual regret*. Enrichment designed for the former (reward scheduling) may fail the latter (who requires information predictability). Determining whether the competence lies in the niche or the neuron is therefore not merely taxonomic; it dictates whether we enrich the *cage* or the *animal's cognitive engagement*.

  **5. ADMINISTRATIVE INSTRUCTIONS**

  The PIs are instructed to:
  1.  Retain the current behavioural metrics but redesign the apparatus to allow for the "Decoupled Scaffold" condition described above.
  2.  Submit a revised budget and timeline reflecting this experimental shift by 12 June 2025.
  3.  Coordinate with the Welfare Working Group to ensure the new protocols meet the interim enrichment standards, which will be issued separately next month.

  The Frontiers Scheme exists to fund high-risk distinctions. The distinction between a mind that simulates and an environment that constrains is high-risk, but it is not unknowable. The path forward is empirical.

  **Signed,**

  Dr. [Your Name/Chair]
  Standing Review Panel, Cognitive Ecology & Evolution
  National Research Council
