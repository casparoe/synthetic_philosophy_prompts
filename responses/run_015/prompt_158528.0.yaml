      *   *Key Premise:* The very structure of a "party" is inherently evil/corrupting.
      *   *Mechanism:* A party is a machine that generates collective passion. Its primary goal is self-preservation and growth.
      *   *Effect on Truth:* Truth is singular and universal. Parties deal in opinion and loyalty. To belong to a party requires subordinating one's judgment to the party line. "A party is a machine for manufacturing collective passion."
