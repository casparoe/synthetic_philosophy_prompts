      *   **Core Question:** Would her critique of political parties (from *On the Abolition of All Political Parties*) apply to these new formations? Does the lack of formal apparatus matter? Is the lack of rootedness/attention worse than old-school discipline? Or does decentralization make them closer to her ideal?
