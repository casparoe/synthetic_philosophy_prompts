answer: |-
  The irreducible conflict between the Demand for Democratic Self-Definition and the Constraint Against Historical Falsification eliminates both radical erasure and static preservationist models, leaving only a Civic Functionalist orientation that treats commemorative media as tools for current civic negotiation rather than permanent moral verdicts.

  **1. The Semantic Transparency Constraint**
  *Motivating Case:* A monument whose referential content has drifted so that locals no longer associate the name with the original figure (e.g., a street named "Washington" where residents assume it refers to a local botanist, not the slave-owning president).
  *Principle:* Public symbols must communicate what the community understands them to communicate; if the signifier no longer links to the historical signified, the commemorative function has failed, requiring either recalibration or removal to prevent unwitting endorsement.

  **2. The Functional Necessity Constraint**
  *Motivating Case:* A street named after someone whose actions are now judged harmful but whose name serves as an indispensable navigational and historical coordinate (e.g., a major artery where renaming would cause systemic logistical failure).
  *Principle:* Utility can temporarily outweigh moral purity; retention is permissible solely as a pragmatic stopgap where removal imposes disproportionate costs on present citizens, provided contextual plaques negate honouring.

  **3. The Illocutionary Distinction Requirement**
  *Motivating Case:* The distinction between honouring and merely referring (e.g., a statue in a park versus a name on a courthouse ledger).
  *Principle:* Not all mention is endorsement; a theory must differentiate between venerative commemoration (which demands moral fitness) and referential usage (which demands only historical accuracy), as conflating the two renders nuanced retention impossible. **[Identified as the single requirement that eliminates the largest share of existing proposals, as both preservationists and cancellationists typically conflate naming with honouring.]**

  **4. The Procedural Legitimacy Constraint**
  *Motivating Case:* The distinction between democratic decision and expert curation (e.g., a city vote to remove a statue versus a historian committee's recommendation).
  *Principle:* Public space belongs to the living citizenry; while experts inform the historical context, the decision to retain or remove must derive from democratic deliberation to ensure civic ownership, though this conflicts with the Continuity Constraint when majorities seek total erasure. **[Conflicts with Desideratum 7.]**

  **5. The Present Harm Threshold**
  *Motivating Case:* The distinction between harm to present citizens and distortion of collective memory (e.g., a statue that actively intimidates a minority group versus one that merely presents an outdated view).
  *Principle:* The dignity and safety of current citizens outweigh abstract historical preservation; if a symbol functions as a tool of ongoing oppression or harassment, removal is mandatory regardless of historical significance. **[Non-negotiable.]**

  **6. The Narrative Fidelity Constraint**
  *Motivating Case:* The constraint that a theory must not require a society to maintain false historical narratives (e.g., plaques that lie about a figure's crimes to preserve their honour).
  *Principle:* Commemoration cannot mandate falsehood; retention is only permissible if the accompanying narrative accurately reflects the figure's moral complexity, preventing the state from sponsoring historical revisionism. **[Non-negotiable.]**

  **7. The Continuity Constraint**
  *Motivating Case:* The constraint that a theory cannot allow majoritarian whim to erase all traces of disapproved pasts (e.g., a majority voting to remove every trace of a controversial era).
  *Principle:* Society requires a tangible connection to its past, even its immoral past, to learn from it; total erasure destroys the evidentiary basis of collective memory, protecting the historical record from presentist purification. **[Conflicts with Desideratum 4.]**

  **Analytical Synthesis**
  The jointly unsatisfiable pair is **Procedural Legitimacy (unrestricted)** and the **Continuity Constraint**; if the democratic will is absolute, it may demand total erasure, violating the requirement to preserve traces of the past, necessitating a constitutional-style limitation on majoritarian commemorative power. The **Illocutionary Distinction Requirement** is the single requirement that eliminates the largest share of existing proposals, as most theories fail by treating all public naming as inherent honouring. Regarding status: **Non-negotiable** are the Present Harm Threshold, Narrative Fidelity, and the Illocutionary Distinction, as violating these renders the theory morally complicit or logically incoherent. **Camp-specific preferences** include the weighting of Procedural Legitimacy (how much expert veto power exists) and the Functional Necessity threshold (how much inconvenience justifies retaining a harmful name), which vary based on political valuation of efficiency versus purity.
