prompt: |-
  Write the desiderata that any adequate normative theory of public commemoration — specifically the retention, removal, or renaming of statues and street names — must satisfy. I want the full specification first: the cases it must get right (e.g. a monument whose referential content has drifted so that locals no longer associate the name with the original figure; a street named after someone whose actions are now judged harmful but whose name serves as an indispensable navigational and historical coordinate), the distinctions it must preserve (between honouring and merely referring, between democratic decision and expert curation, between harm to present citizens and distortion of collective memory), and the constraints it cannot violate (it must not require a society to maintain false historical narratives, nor allow majoritarian whim to erase all traces of disapproved pasts). For each desideratum, state the motivating case or principle behind it, flag any pair you think are jointly unsatisfiable, and identify the single requirement that eliminates the largest share of existing proposals. Take a definite stance on which desiderata are non-negotiable and which are camp-specific preferences. Lead with your bottom line in the first sentence — the core claim about which requirements conflict and which theoretical orientation survives — then present the list and brief reasoning, with no preamble and no restating of the question. Begin the response with the piece itself, with no prefatory commentary.
