answer: |-
  In a large housing cooperative, the formally elected Board President has begun diverting maintenance funds to personal ventures, causing unsafe structural decay that threatens residents' safety. The cooperative bylaws include a "sunset clause" permitting members to legally revoke the President's power via a supermajority vote, but only after a mandatory six-month review period that everyone knows will allow the building's damage to become irreversible. While the President was chosen through a fair election, their current governance actively undermines the community's welfare, presenting members with the choice of forcing an immediate ouster through disruptive protest or adhering to the delayed legal process.

  According to Aquinas's conditions, the members may not resist or force removal before the clause expires because the President possesses legitimate authority derived from the formal election; private individuals are forbidden from deposing a legitimate ruler even when they govern poorly, as such action risks sedition and greater disorder. A plain act-utilitarian analysis, conversely, would argue that members should resist immediately if the harm prevented by stopping the decay outweighs the disruption caused by the ouster, rendering the source of the President's authority irrelevant. The specific feature that makes the two theories diverge is the **formal election**, because it grants the legitimacy that Aquinas prioritizes over consequences, whereas the utilitarian ignores legitimacy in favor of immediate harm reduction. If the sunset clause is removed, the divergence regarding the *timing* of resistance dissolves, but the fundamental disagreement persists: Aquinas still forbids private resistance against a legitimately elected leader without public authority sanction, while the utilitarian still permits it based on net outcomes. A defender of Aquinas's view would answer the utilitarian objection that the delay is morally cruel by arguing that undermining legitimate authority sets a precedent for vigilante justice and instability, which produces greater long-term suffering and disorder than the specific tyranny endured during the wait.
