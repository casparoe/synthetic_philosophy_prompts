answer: |-
  Your diagnosis is remarkably precise, and I believe it captures the structural exhaustion of the debate. You are correct that the feeling of being "stuck" arises because the debate is no longer unitary. It has fractured into distinct problems that were historically conflated under the heading "What is truth?"

  Here is the diagnosis of the stalemate, broken down by your three categories (verbal, substantive, displaced), followed by an assessment of your three-question hypothesis and a verdict on what constitutes progress.

  ### 1. The Diagnosis of the Stalemate

  **The Displaced Disagreements (Logic and Metasemantics)**
  You are right to isolate the paradoxes and the theory of content. These are displaced disagreements that inflate the appearance of substantive conflict about truth itself.

  *   **The Paradoxes:** As you noted with the Liar case, the equivalence schema underdetermines the logic. If two communities agree on all non-paradoxical instances of the schema but diverge on the Liar (gap vs. glut), they agree on the *concept* of truth as far as its ordinary function goes. The disagreement is about the *logic* of the predicate, not the *nature* of the property. When a substantivist argues that the Liar shows truth is mysterious or substantial, and a deflationist argues it shows we need a non-classical logic, they are talking past each other. The paradoxes are a constraint on any theory of truth, but they do not decide between deflationism and substantivism. This portion of the debate is displaced onto the philosophy of logic.
  *   **Content and Reference:** The fork you identify regarding scope is decisive. If one holds that truth is thin but content is robust (e.g., causal reference), then the "work" truth does in explaining successful action is actually being done by the theory of content, not the theory of truth. The substantivist claim that "truth explains success" often smuggles in a substantive theory of *representation*. If the deflationist can pair a thin truth predicate with a thin theory of content (a huge "if," as Field's unfinished project attests), the substantivist loses the explanatory leverage. If the deflationist accepts robust content but thin truth, the debate shifts to metasemantics. Currently, much of the "substantive" resistance to deflationism is actually resistance to deflationary *meaning*.

  **The Verbal Disagreement (Conservativeness and "Substantiality")**
  The conservativeness result you mention is the sharpest point of friction, but it is largely verbal.
  *   **The Conflict:** Deflationists originally claimed truth is a logical device, implying it should be conservative over the base theory. Formal results show it is not (it proves consistency). Substantivists claim this proves truth is a substantial property.
  *   **The Diagnosis:** This turns on the definition of "substantial." If "substantial" means "non-conservative extension," then truth is substantial, full stop. The deflationist's reply is to change the definition of "substantial" to mean "causally efficacious" or "reducible to physical properties." Since a truth predicate can be non-conservative without being causally efficacious (it's still a logical device, just a powerful one), the substantivist's victory here is terminological.
  *   **Why it persists:** It persists because "substantial" is doing normative work. Substantivists want "substantial" to mean "metaphysically weighty enough to ground explanation." Deflationists want "substantial" to mean "not merely logical." They agree on the formal fact (non-conservativeness) but disagree on its philosophical significance. This is a verbal dispute masking a methodological one.

  **The Substantive Disagreement (The Nature of Explanation)**
  This is the hard core that remains after peeling away logic, content, and terminology. It is exactly as you hypothesized: a methodological dispute about what counts as explanation.
  *   **The Argument:** The substantivist insists that generalizations (e.g., "True beliefs tend to guide action successfully") require explanation by a common property. They argue that a mere list of instances (the schema) cannot explain a general regularity any more than a list of green emeralds explains why all emeralds are green. They demand a *ground*.
  *   **The Counter:** The deflationist argues that the generalization is not a law needing a ground, but a logical consequence of the function of the predicate. To say "True beliefs succeed" is just to say "If you believe p, and p, you will succeed," universally quantified. For the deflationist, asking for the "nature" that explains this is a category mistake, akin to asking what property "hello" has that explains its function in greeting.
  *   **The Stalemate:** This is a clash between two metaphysical pictures. The substantivist holds a realist view of properties: if a predicate applies to many things and they share a behavioral regularity, there must be a shared constituent in reality. The deflationist holds a pragmatic or Humean view: regularities do not always require underlying natures; sometimes the regularity is just a feature of our linguistic practices. This is not a dispute about truth *per se*; it is a dispute about metaphysics and the philosophy of science.

  ### 2. Assessing Your Three-Question Hypothesis

  Your hypothesis—that "truth" is three questions wearing one name—is correct and offers the best map of the terrain.

  1.  **Function (The Schema):** You are right that the schema answers the functional question. It explains blind ascriptions and disquotation. The substantivist cannot beat this; they usually concede the schema is *necessary* but argue it isn't *sufficient*.
  2.  **Metasemantics (Content):** You are right that this is independent. The debate here is whether content can be deflated. If content is substantive, truth can appear substantive by association. If content is deflated, truth looks thinner. This is where the real work lies for the deflationist, and it is where they are most vulnerable.
  3.  **Logic (Paradoxes):** You are right that this belongs elsewhere. The Liar is a problem for *any* predicate that satisfies the schema. It does not distinguish between a substantial property and a logical device.

  **Where your hypothesis needs nuance:**
  There is a fourth strand lurking in the "Function" category: **Normativity.**
  Substantivists (like Wright or Lynch) argue that truth is the *norm* of belief and assertion. They claim deflationism cannot account for the *normative force* of truth (why we *ought* to believe what is true). Deflationists reply that the normativity is inherited from the normativity of assertion or belief itself, not added by truth.
  This is not a separate question from Function, but it is the specific point where the "methodological disagreement about explanation" becomes acute. The substantivist sees normativity as a property truth *has*; the deflationist sees it as a practice truth *facilitates*.

  **Verdict on your hypothesis:** It is correct. The residual disagreement is indeed methodological. It is a dispute about whether "explanation" requires ontological grounding (Substantivism) or whether functional adequacy is sufficient (Deflationism).

  ### 3. What Counts as Progress?

  Given this diagnosis, most traditional avenues for progress are dead ends.

  *   **Formal Results on Conservativeness:** **No progress expected.** As argued above, both sides accept the formal results; they disagree on the philosophical interpretation. A new theorem won't change their metaphysical priors about what counts as a "property."
  *   **Settlement of the Paradoxes:** **No progress expected.** Solving the Liar will tell us which logic is correct, but both a glut theorist and a gap theorist can be either deflationists or substantivists. It does not touch the core metaphysical dispute.
  *   **Distinction that Dissolves the Question:** **High potential.** This is the most realistic hope. If it can be shown definitively that "truth" is not a natural kind term but a functional concept (like "validity" or "proof"), the substantivist's demand for a "nature" dissolves. However, substantivists will resist this by arguing that even functional concepts realize properties.
  *   **Completed Deflationary Account of Content:** **The only realistic hope for a verdict.** This is the bottleneck.
      *   If a deflationist can provide a fully worked-out theory of content and reference that does not rely on substantive truth conditions (e.g., a successful completion of Field's instrumentalism or a robust use-theory), the substantivist loses the claim that truth does explanatory work. The "explanation" of successful action would be handled by the theory of content/use, leaving truth as a mere device.
      *   If it is proven that *any* adequate theory of content requires substantive truth conditions (e.g., if causal theories of reference inevitably require a substantive truth predicate to link word to world), then deflationism collapses.
      *   **Status:** Currently, neither side has succeeded. Deflationary theories of content are notoriously difficult to make work without smuggling in substantivism. Substantive theories of content face their own naturalization problems.

  ### 4. Final Verdict: Ill-Posed or Hard?

  The honest answer is that the question "What is the nature of truth?" is **ill-posed**, but the question "Can we construct a total theory of language and mind without positing truth as a substantive property?" is **hard**.

  The debate is stuck because participants are asking the first question while trying to answer the second.
  *   If you ask "What is the nature of truth?", the substantivist wins by default because the question presupposes there *is* a nature to uncover.
  *   If you ask "Do we need to posit a substantive property of truth to explain linguistic and cognitive phenomena?", the debate becomes empirical and theoretical.

  **Recommendation for Progress:**
  Stop asking about the nature of truth. Start asking about the **indispensability of the property**.
  Progress will not come from analyzing the concept of truth further. It will come from the philosophy of mind and language. Specifically:
  1.  **Can intentionality be explained without truth conditions?** If yes, deflationism wins. If no, substantivism wins.
  2.  **Is the normativity of belief reducible to non-truth-theoretic norms?** If yes, deflationism wins.

  The stalemate will break only when the theory of content catches up to the theory of truth. Until then, you are correct: you are witnessing a methodological dispute about explanation disguised as a metaphysical dispute about a property. The debate is finished in its current form; it needs to migrate to metasemantics to find a resolution.
