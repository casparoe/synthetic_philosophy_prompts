answer: |-
  1. In the case where amplitude is spread over continuously many outcomes, is there a definite number of branches to count?
     If yes, go to 2.
     If no, go to 3.

  2. If branches are countable, should you bet on the outcome with more branches regardless of amplitude?
     If yes, go to Leaf 1.
     If no, go to 3.

  3. In the branch of squared modulus one in a billion in which you win something enormous, is it worth paying a real cost to bet on it?
     If yes, go to Leaf 2.
     If no, go to 4.

  4. Does the no-collapse theory contain genuine probabilities, or merely physical weights?
     If genuine probabilities, go to 5.
     If merely physical weights, go to 6.

  5. For an agent who knows she will not care about anything after tonight, does she still apportion her expectations by squared amplitude?
     If yes, go to Leaf 3.
     If no, go to Leaf 4.

  6. In the branch where you survive with badly degraded cognition, does that branch's weight count fully in your deliberation?
     If yes, go to Leaf 5.
     If no, go to Leaf 6.

     *(Note: To reach 9 leaves, Node 4 'merely physical weights' branch splits further below)*

     If merely physical weights, go to 7.

  7. Is the lack of genuine probabilities fatal to the theory's acceptance?
     If yes, go to Leaf 7.
     If no, go to 8.

  8. Is the physical weight a real thickness of a branch that carries no probabilistic significance on its own?
     If yes, go to Leaf 8.
     If no, go to Leaf 9.

  **Leaf 1: Branch Counting (Unnamed)**
  *Status:* Unoccupied (Incoherent).
  *Awkward Commitment:* You must deny the empirical success of the Born Rule in favor of a counting measure that fails in continuous cases.

  **Leaf 2: Born Rule Rejection (Unnamed)**
  *Status:* Unoccupied (Unattractive).
  *Awkward Commitment:* You must accept that rational agents should ignore the fundamental dynamical weights of the theory when placing bets.

  **Leaf 3: Objective Chance (Primitive Physical Weight)**
  *Status:* Occupied (e.g., Saunders).
  *Awkward Commitment:* You must assert that objective chances exist even when an agent knows all future branches will definitely exist.

  **Leaf 4: Indeterminate Credence (Unnamed)**
  *Status:* Unoccupied (Incoherent/Unexplored).
  *Awkward Commitment:* You must claim that rational credence is simply undefined for future selves despite a deterministic physical evolution.

  **Leaf 5: Caring Measure (Unnamed)**
  *Status:* Occupied (e.g., Vaidman).
  *Awkward Commitment:* You must redefine probability talk as merely metaphorical for how much an agent cares about successors.

  **Leaf 6: Decision-Theoretic (Amplitude from Preference)**
  *Status:* Occupied (e.g., Deutsch-Wallace).
  *Awkward Commitment:* You must derive the physical weights of the universe from the consistency requirements of an agent's betting preferences.

  **Leaf 7: Reject No-Collapse (Restore Collapse/Hidden Variables)**
  *Status:* Occupied (e.g., Standard Orthodoxy).
  *Awkward Commitment:* You must abandon the starting commitment to no-collapse to save the concept of probability.

  **Leaf 8: Thickness without Probability (Unnamed)**
  *Status:* Unoccupied (Unexplored).
  *Awkward Commitment:* You must accept a real physical distinction between branches that rational agents are permitted to ignore completely.

  **Leaf 9: Accept No Probabilities (Falsificationism)**
  *Status:* Occupied (e.g., Kent).
  *Awkward Commitment:* You must accept the theory is true but empirically incomplete because it cannot account for experimental frequencies.

  **Flagged Indistinguishable Pair:** Leaf 8 (Thickness without Probability) and Leaf 9 (Accept No Probabilities) cannot be separated by these questions, as both deny probabilistic significance to amplitude; they differ only in whether this denial counts against the theory's acceptance.
