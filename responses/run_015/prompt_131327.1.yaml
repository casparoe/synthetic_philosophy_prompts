  The whisper wasn't waiting in the throat,
  A seed enclosed before the mouth opened.
  We looked for where the voice began to grow,
  It did not start from itself.

  Nor did it cross the gap between us whole,
  An object passed from hand to waiting hand.
  No sender owns the message once it goes,
  It did not start from another.

  Not in the collision of the pair,
  The room and sound combining to make heat.
  No sum of parts accounts for what we heard,
  It did not start from both.

  And not without a cause, like lightning strikes,
  Unmoved by lips or air or listening ears.
  There is no magic in the empty space,
  It did not start from nowhere.

  The question loses grip upon the air,
  Yet Jane is telling Mark what Sarah said.
  We realise the search ends at the floor,
  While the conversation carries on.

  ***

  **Notes on structure:**
  Stanzas one through four enact the *catuṣkoṭi* (four corners) using the refrain to negate each possible origin of the rumour without changing the scene. The fifth stanza refuses to land on a conclusion: it avoids nihilism (the rumour still spreads) and essentialism (no source is found), instead showing the search for a thesis simply dropping away while conventional activity persists. The final line is deliberately mundane and syntactically dependent, preventing it from functioning as a standalone aphorism or new philosophical position.
