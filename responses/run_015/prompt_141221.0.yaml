      *   I need to organize these into a hierarchy. Some are logical prerequisites, some are physical requirements, some are decision-theoretic patches.
      *   *Category 1: Cognitive Stability (Non-negotiable).* If I can't trust my reasoning, the game is over. This includes the "self-undermining" constraint.
      *   *Category 2: Empirical Adequacy (Non-negotiable).* The theory must predict that my specific evidence (low entropy past) is typical, not miraculous.
      *   *Category 3: Measure Robustness (Negotiable/Technical).* Cutoff independence is ideal but might be impossible in infinite spacetimes. This is where the trade-off lies.
      *   *Category 4: Decision-Theoretic Utility (Negotiable/Safety).* If the physics fails, can DT save me?

