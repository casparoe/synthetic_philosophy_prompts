      *   *Infinite Spacetime vs. Cutoff Independence:* In an eternal inflation scenario, almost *any* cutoff prescription can be manipulated to favor BBs or OOs depending on the slicing. True cutoff independence is likely impossible in infinite volumes without a fundamental discreteness or finite horizon.
      *   *Non-self-undermining vs. Measure-Relative Dominance:* If the measure says BBs dominate, but I assume I'm an OO to do the calculation, I'm begging the question. If I accept the measure says BBs dominate, I can't trust the calculation. This is the "Boltzmann Brain Paradox" core.
      *   *Resolution:* One of these must go. Usually, "Measure-Relative Dominance" is the casualty. We need a theory where OOs dominate *without* relying on arbitrary measure choices, or we need to accept that "typicality" is the wrong metric (shifting to Decision Theory).

  5.  **Drafting the Desiderata List:**

      *   *D1: Cognitive Stability (The "No-Suicide" Clause).* The theory cannot imply that my current cognitive state is likely the result of a random fluctuation that renders reasoning unreliable. (Non-negotiable).
      *   *D2: Entropic Asymmetry.* The theory must explain why the past was lower entropy without relying on a fluctuation from equilibrium. (Non-negotiable).
      *   *D3: Measure Regularization.* The method for counting observers must not depend sensitively on arbitrary time slicings or coarse-graining. (Strong Preference, but may need relaxation).
