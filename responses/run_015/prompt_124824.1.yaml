answer: |-
  ### Teaching Plan: The Sorites Threat to Institutional Authority

  #### I. Pedagogical Architecture (Dependency Order)
  *Do not introduce the legal carrying case until Steps 1–3 are secured. The logical force of the example depends on students accepting the metaphysical premises before applying them to the institutional narrative.*

  1.  **Secure the Binary Nature of Institutional Status Functions.**
      *   Establish that certain institutional properties (e.g., "valid contract," "binding precedent," "married") are operationally binary within the system. A judge cannot issue a ruling that is "0.7 binding." The output of the legal machine is Yes/No, Valid/Invalid.
      *   *Goal:* Preempt the fuzzy-logic escape hatch by establishing that the *institutional reality* requires sharp boundaries, even if the *criteria* do not provide them.

  2.  **Distinguish Semantic Indeterminacy from Ontological Gradation.**
      *   Force a distinction between "we lack a precise word for the cutoff" (semantic) and "there is no fact of the matter about where the status changes" (ontological).
      *   *Goal:* Block the intuition that better drafting solves the problem. If the property itself (binding authority) is constituted by social practices that admit of degree, no amount of linguistic precision can create a metaphysical boundary where none exists.

  3.  **Introduce the Tolerance Principle as a Structural Constraint.**
      *   Define the principle: If a precedent is binding in Case $n$, and Case $n+1$ differs only by a negligible legal distinction, the precedent remains binding in Case $n+1$.
      *   *Goal:* Isolate the logical engine of the Sorites. Students must accept that legal reasoning *requires* this principle to maintain stability (stare decisis), even though it leads to the paradox.

  4.  **Deploy the Carrying Case.**
      *   Only now introduce the sequence of judicial distinctions. The paradox arises from the collision of Step 1 (Binary Output) and Step 3 (Tolerance Principle) applied to the Case.

  #### II. Carrying Case Calibration
  *The legal example must be stipulated as a thought experiment to control variables. Do not use a real-world controversy where substantive moral disagreements distract from the structural logic.*

  **Properties the Example MUST Have:**
  1.  **Incremental Indistinguishability:** Each successive lower-court ruling must differ from the prior one by a single, legally trivial distinction (e.g., changing a timeframe from 30 days to 31 days, or a distance from 100 yards to 101 yards).
  2.  **Operational Binary Output:** Each court in the sequence must explicitly affirm the precedent as "binding" while distinguishing the facts just enough to avoid the original outcome.
  3.  **Terminal Divergence:** The final case in the sequence must be intuitively incompatible with the original holding (e.g., the original rule protected Right X; the final rule allows the violation of Right X), yet the original precedent remains technically "on the books."

  **Properties the Example MUST Lack:**
  1.  **Aggregative Imagery:** Avoid language of "accumulating" changes. Frame it as "successive refinement" or "specification" to prevent students from dismissing it as a physical heap problem.
  2.  **Formal Overruling:** There must be no moment where a court explicitly says "We overturn Case A." The erosion must be entirely through distinction.
  3.  **Legislative Intervention:** Do not allow a statute to fix the boundary. The threat must arise from within the common-law method itself.

  #### III. Misconception Map & Interception Points

  | Predictable Error | Point of Interception | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"This is just linguistic vagueness; draft a better test."** | **Step 2 (Semantic vs. Ontological)** | Remind students that the *authority* of the precedent is a social status, not a description. If the social practice of distinguishing is accepted, the status evaporates regardless of the wording. |
  | **"Degrees of truth solve this; authority is fuzzy."** | **Step 1 (Binary Nature)** | Reiterate that legal judgments are binary actions. A defendant is either liable or not. A "fuzzy" binding force cannot justify a binary coercive outcome (jail/fine). |
  | **"The judge just decides; it's political, not metaphysical."** | **Step 3 (Tolerance Principle)** | Acknowledge judicial discretion but insist that *legitimacy* relies on the constraint of prior authority. If the constraint is Sorites-susceptible, the legitimacy is structurally unstable, not just politically contested. |
  | **"There must be a hidden sharp boundary we just can't see."** | **Step 4 (Deploying the Case)** | Ask them to identify the specific case in the sequence where bindingness stopped. If they cannot point to one, they have accepted ontological gradation. If they point to one, ask what *legal* difference makes that step non-tolerant. |

  #### IV. Diagnostic Question
  *Pose this at the conclusion of the session. Do not accept answers that revert to the legal narrative; demand a metaphysical justification.*

  **"If you cannot identify the specific case in the sequence where the precedent ceased to be binding, on what metaphysical ground do you claim the original authority still exists? Conversely, if you can identify the specific case, what non-arbitrary fact distinguishes that step from the one immediately preceding it?"**

  *(Success criterion: The student must recognize that answering either horn of the dilemma concedes that institutional identity is either ontologically vague or arbitrarily bounded.)*

  #### V. Explicit Omissions
  *State clearly at the outset that the following formal machinery is **excluded** from this session to prevent technical obfuscation of the ontological problem.*

  1.  **Degree-Theoretic Semantics (Fuzzy Logic):** We will not model authority as a value between 0 and 1. This is excluded because it fails to account for the binary nature of institutional enforcement.
  2.  **Supervaluationism:** We will not discuss "precisifications" or truth on all admissible interpretations. This is excluded because it treats the problem as semantic rather than ontological.
  3.  **Epistemicism:** We will not entertain the view that a sharp boundary exists but is unknowable. This is excluded because it contradicts the social-ontological premise that institutional facts are constituted by collective recognition.

  *Instruction to Instructor:* If a student raises these frameworks, acknowledge their existence but bracket them. Insist that the session focuses on the **constitutive rules of social reality**, not the logic of predicates.
