prompt: |-
  I am a doctoral student in philosophy of language, and in preparation for a guest discussion section I am leading for an advanced undergraduate seminar on metaphysics and social ontology, I have been trying to work out—after a long conversation with my advisor—how to present the sorites paradox as a structural threat to gradable institutional properties rather than as the familiar puzzle about sand. Specifically, I want the session to center on the concept of binding legal authority and to use as its carrying case the gradual judicial erosion of a landmark precedent: successive lower-court distinctions chip away every substantive feature of the original holding until the ruling remains technically intact but materially hollow, without any formal moment of overturning. The students will arrive assuming that vagueness is merely linguistic imprecision correctable by sharper drafting, and I anticipate they will propose that fuzzy-logic frameworks dissolve the difficulty without metaphysical cost; I therefore need the pedagogical architecture that specifies the exact dependency order—what must be secured about the distinction between semantic indeterminacy and ontological gradation before I can even introduce the legal example—together with the precise calibration the carrying case requires so that it preserves the logical structure of the paradox while lacking the intuitive heap imagery that lets students dismiss it as an artifact of ordinary language.

  In addition, I need the misconception map with the point in the sequence where each predictable error should be intercepted, a single diagnostic question I can pose at the end to determine whether they have grasped the structural threat to institutional identity rather than merely followed the legal narrative, and an explicit declaration of what formal machinery—such as degree-theoretic semantics or supervaluationist models—I should openly refuse to explain and set aside as beyond this level. I am not asking for an explanation of the paradox itself, nor for a bibliography; I am asking for the teaching plan alone: the ordered introduction of conceptual components, the properties the carrying example must have and must lack, the interception points for misconceptions, the check for genuine understanding, and the clearly marked omissions.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in philosophy of language.
      *   **Task:** Lead a guest discussion section for an advanced undergraduate seminar on metaphysics and social ontology.
      *   **Topic:** Sorites Paradox as a structural threat to *gradable institutional properties* (specifically binding legal authority), not the classic "heap" puzzle.
      *   **Carrying Case:** Gradual judicial erosion of a landmark precedent (death by a thousand distinctions).
      *   **Student Preconceptions:** Vagueness is linguistic imprecision (fixable by drafting); Fuzzy logic dissolves the problem without metaphysical cost.
      *   **Deliverables:**
          1.  Pedagogical Architecture (Dependency Order): What concepts must be secured *before* introducing the legal example.
          2.  Carrying Case Calibration: Properties the legal example must have/lack to preserve logical structure without "heap" intuition.
          3.  Misconception Map: Predictable errors and where to intercept them.
          4.  Diagnostic Question: One question to test grasp of structural threat vs. legal narrative.
          5.  Explicit Omissions: Formal machinery to set aside (e.g., degree-theoretic, supervaluationist).
      *   **Constraint:** Do *not* explain the paradox itself or provide a bibliography. Provide *only* the teaching plan.

  2.  **Deconstruct the Philosophical Challenge:**
      *   The core tension is between *semantic indeterminacy* (the word "authority" is vague) and *ontological gradation* (the institutional status itself lacks sharp boundaries).
      *   Students think vagueness is just bad language. The goal is to show that even perfect language cannot fix the Sorites threat to *institutional reality* (social ontology).
      *   The legal example must avoid the "heap" intuition (aggregating grains) and focus on *precedential weight* or *binding force*.
      *   Fuzzy logic (degree theory) is a common student escape hatch ("it's just 0.5 true"). The plan needs to block this by showing that institutional authority is often binary in practice (binding vs. not binding), creating a clash between the gradual erosion and the binary requirement.

  3.  **Drafting the Pedagogical Architecture (Dependency Order):**
      *   *Step 1: The Nature of Institutional Facts.* Need to establish that legal authority isn't just a description; it's a status function (Searle-esque). It exists because we accept it.
      *   *Step 2: The Binary Requirement.* Legal systems generally require binary outputs (valid/invalid, binding/non-binding). You can't be "half-bound" by a precedent in a specific ruling.
      *   *Step 3: Semantic vs. Ontological Vagueness.* Distinguish between "we don't know how to say it" and "the thing itself has no sharp edge."
      *   *Step 4: The Sorites Structure.* Only then introduce the tolerance principle (small change $\rightarrow$ no change in status).
      *   *Step 5: The Legal Case.* Apply the structure to the precedent erosion.

  4.  **Calibrating the Carrying Case:**
      *   *Must Have:* A sequence of cases where each step is legally indistinguishable from the prior one (Tolerance Principle). A binary outcome requirement (the court *must* rule binding or not). A final state that is intuitively *not* the original authority.
      *   *Must Lack:* Physical aggregation (no sand/grains). Emotional loading (avoid abortion/death penalty to keep focus on structure). Formal overturning (no explicit *overruling*, only distinguishing).

  5.  **Mapping Misconceptions:**
      *   *Error 1:* "Just define the terms better." (Intercept at Step 3).
      *   *Error 2:* "It's just fuzzy logic/degrees of truth." (Intercept at Step 2 - Binary Requirement).
      *   *Error 3:* "The judge just decides." (Intercept at Step 1 - Institutional Constraint).
      *   *Error 4:* "This is just history, not metaphysics." (Intercept at Diagnostic).

  6.  **Formulating the Diagnostic Question:**
      *   Needs to force a choice between "the words were vague" and "the authority itself ceased to exist without a moment of cessation."
      *   Draft: "If the precedent is materially hollow but technically intact, does the *authority* reside in the text or the practice?" -> A bit weak.
      *   Better: "At which specific case in the sequence did the precedent lose its binding force, and if you cannot identify one, how can the court be bound by it now?"

  7.  **Selecting Omissions:**
      *   Supervaluationism (too technical, distracts from ontology).
      *   Epistemicism (Williamson-style, implies a sharp boundary exists unknowably, might confuse the ontological point).
      *   Contextualism (shifts focus to pragmatics).
      *   Keep it to: Tolerance Principle, Binary Status, Institutional Reality.

  8.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the distinction between semantic and ontological clear enough?
      *   *Fix:* Emphasize that in social ontology, the *status* is the reality. If the status is vague, the reality is vague.
      *   *Critique:* Will students get bogged down in legal procedure?
      *   *Fix:* Instruct the user to stipulate the legal sequence as a thought experiment, not a historical debate.
      *   *Tone:* Needs to be academic, precise, and structured for a doctoral student leading a seminar.

  9.  **Final Review against Constraints:**
      *   Did I explain the paradox? No.
      *   Did I give a bibliography? No.
      *   Is it just the teaching plan? Yes.
      *   Are all 5 specific deliverables included? Yes.

