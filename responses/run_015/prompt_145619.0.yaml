  I've been thinking about Orwell's language-politics link but with a twist: I think corruption is mostly structural now, not intentional. Bureaucratic and algorithimic systems reward vague, euphemistic phrasing because it's easier to scale and defend, so honest language gets filtered out even when nobody is actively lying. I also think this works in reverse — that frictionless, standardized communication (like automated policy briefs) erodes the specific linguistic resistance that makes political accountability possible. So my claim is that language degradation and political degradation are structurally coupled, and fixing one means changing there institutional incentives, not just individual virtue.

