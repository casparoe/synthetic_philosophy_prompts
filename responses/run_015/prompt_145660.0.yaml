answer: |-
  You have not mangled the definitions. In fact, you've distilled three complex philosophical traditions into their working cores with impressive accuracy.

  1.  **Negative Liberty:** Non-interference (Hobbes, Locke, Nozick).
  2.  **Positive Liberty:** Self-mastery/Capacity (Rousseau, Marx, T.H. Green).
  3.  **Republican Liberty:** Non-domination (Pettit, Skinner, neo-Roman).

  Your observation about employment law is also sharp: the law is not philosophically consistent. It is a patchwork of compromises between these views, often contradicting itself.

  Here is the bit-by-bit breakdown you asked for, followed by an analysis of your "Ruin Test."

  ### 1. What view of freedom does current employment law presuppose?

  Current employment law in most liberal democracies (US, UK, EU, etc.) is a **hybrid that leans Negative but panics into Republican/Positive.**

  *   **The Baseline (Negative Liberty):** The default assumption is "Freedom of Contract." If two adults agree, the state should not interfere. This explains why mortgages, non-competes, and arbitration clauses are generally enforced. The law assumes you are the best judge of your own interests.
  *   **The Exception (Republican/Positive Liberty):** The moment the contract looks like *status* rather than *exchange*, the law intervenes. You cannot sell yourself into slavery (even voluntarily). You cannot waive safety laws. This presupposes that there is a line where "contract" becomes "domination."
  *   **The Tension:** The law treats the *entry* into employment as Negative Liberty (you chose to sign) but regulates the *content* of employment as if it were a Republican threat (you need protection from the boss's arbitrary power).

  **Confidence:** High on the philosophical tension. Medium on the legal uniformity. (Note: Employment law varies wildly between "at-will" jurisdictions like most of the US and "just cause" jurisdictions like most of Europe. I am generalizing the "rich country" consensus.)

  ### 2. The Gun vs. Poverty Distinction

  **Is it defensible?**
  Philosophically, it is very hard to defend. Practically, it is the only line the legal system knows how to draw.

  *   **Negative Liberty View:** Defends this distinction vigorously. A gun is an *agent* interfering with you. Poverty is a *circumstance*. Freedom is about the absence of human interference, not the absence of hardship. To say poverty coerces you is to say "nature" coerces you, which makes freedom impossible for anyone who isn't rich.
  *   **Positive/Republican View:** Rejects this distinction. If I must sign a bad contract or my children starve, I am not free. The "master" isn't just the employer; it's the economic structure. Republican theory argues that if you are vulnerable to arbitrary power because you have no safety net, you are dominated regardless of whether a specific person is threatening you.

  **Which view does the law fit?**
  The law fits **Negative Liberty** here. It treats "economic duress" as a much higher bar than "physical duress." It quietly rules out the Positive/Republican view because acknowledging economic necessity as coercion would invalidate most low-wage labor contracts.

  **Confidence:** High. This is a classic debate in contract law theory (the doctrine of "duress").

  ### 3. "You Can Always Quit"

  **Does it do the work people want it to do?**
  *   **Under Negative Liberty:** Yes. If you can leave without physical restraint, you are free. The power dynamic ends at the exit door.
  *   **Under Republican Liberty:** No. Republicanism cares about the *structure* of the relationship, not just the exit. If the boss has arbitrary power over you *while* you are there, you are dominated. The cost of exit matters. If quitting means homelessness, the "right to quit" is theoretical, not real.
  *   **Under Positive Liberty:** No. Quitting into destitution does not enhance your self-mastery.

  **The Law's Stance:** The law uses "you can quit" as a **Negative Liberty shield** to avoid regulating the workplace further, but it admits this isn't enough by regulating safety and discrimination. It wants to have it both ways: the relationship is voluntary (so we don't owe you a living) but regulated (because we know you can't really just leave).

  **Confidence:** High. This is the central tension in labor law scholarship.

  ### 4. The Ruin Test: A Fourth View?

  Your "Ruin Test" (counting the number of people with discretionary power to ruin your year) is fascinating.

  **Is it a fourth view?**
  It is best understood as **Quantified Republicanism.**
  *   **Republicanism** asks: "Is there a Master?" (Binary: Yes/No).
  *   **The Ruin Test** asks: "How many Masters are there, and how bad is the ruin?" (Continuous: 0 to Infinity).

  It catches something standard Republicanism misses: **Fragmented Domination.**
  A gig worker with 2,000 clients might not have a single "Master" in the traditional sense (which might satisfy a strict Republican), but they live in constant anticipation of the whims of thousands. This is a "panopticon of discretion." Your test captures the *anxiety* of freedom better than the binary "Master/No Master" model.

  It is **not** Positive Liberty. Positive Liberty is about your internal capacity to act (education, health). The Ruin Test is about external vulnerability to others' choices.

  **Does it catch anything missed?**
  Yes. It captures **Systemic Risk.** Traditional liberty looks at specific agents (The State, The Boss). The Ruin Test looks at the *distribution* of power. It explains why a freelancer with one big client is less free than one with twenty small ones, even if the single client is "nicer." It focuses on the *concentration of vulnerability*.

  **Confidence:** Medium-High. This is your own synthesis, so there is no textbook to check against, but philosophically it holds together as a radicalization of Pettit's Republicanism.

  ### 5. Counterfactual Laws: What if we took the views seriously?

  If we built employment law strictly on these views, the systems would look very different.

  **A. Strict Republicanism (Non-Domination)**
  *   **At-Will Firing:** Gone. Firing requires "just cause" and procedural review. Arbitrary power is the enemy.
  *   **Non-Competes:** Gone. They extend the employer's power beyond the relationship, dominating your future choices.
  *   **Forced Arbitration/NDAs:** Gone. These remove your recourse to public law, leaving you at the mercy of the employer's private justice.
  *   **Unions:** Mandatory or heavily protected. Collective bargaining is the only way to balance the power asymmetry.
  *   **Result:** A European-style social market economy on steroids.

  **B. Strict Positive Liberty (Self-Mastery)**
  *   **Income/Job:** The state likely owes you a job or a Universal Basic Income. You cannot be "free" if you are desperate.
  *   **Education:** Free, lifelong retraining is a right, not a benefit.
  *   **Contracts:** Any contract that diminishes your future capacity for autonomy is void (stricter than current law).
  *   **Result:** A social-democratic or socialist state. The market is subordinate to human development.

  **C. The Ruin Test (Risk Distribution)**
  *   **Diversification:** Laws might encourage or mandate that no single client/employer provides more than X% of your income (hard to enforce, but maybe tax incentives).
  *   **Severance:** Scaled by vulnerability. If you are highly specialized with few other options, firing you requires massive payout (to buffer the "ruin").
  *   **Algorithmic Transparency:** Gig platforms would have to reveal how deactivation decisions are made to reduce "arbitrary discretion."
  *   **Portability:** Benefits attach to the *person*, not the *job*, to reduce the ruin of losing one node in the network.
  *   **Result:** A "Flexicurity" model (like Denmark) but focused on power concentration rather than just income support.

  ### 6. How far is this from current law?

  *   **From Republicanism:** Current US law is very far (at-will employment is pure Negative Liberty). Current EU law is closer (stronger dismissal protections), but still allows significant managerial discretion.
  *   **From Positive Liberty:** Very far. No rich country guarantees a job, though many guarantee a minimum income floor.
  *   **From Ruin Test:** Very far. The law currently encourages concentration (non-competes lock you to one firm; at-will firing concentrates power in the boss).

  ### Confidence and Caveats

  **Confidence Levels:**
  *   **Philosophical Definitions:** High (90%+). Your summary of Negative/Positive/Republican is standard academic fare.
  *   **Legal Generalizations:** Medium (60-70%). I am an AI, not a lawyer. "Employment law" varies significantly between the US (highly Negative Liberty), UK (Mixed), and Continental Europe (High Republican/Positive). I have tried to speak to the "liberal democratic consensus," but specific doctrines (like non-compete enforceability) are in flux. For example, the FTC in the US recently attempted to ban non-competes, but this is being litigated.
  *   **The Ruin Test Classification:** Medium-High (80%). It is clearly a variant of Republicanism, but arguing it is distinct because of the *quantitative* aspect is a defensible philosophical position.

  **The Thing I Am Least Sure Of:**
  I am least sure about the **legal defensibility of the "Gun vs. Poverty" line in specific jurisdictions.**
  While I am confident that *currently* the law distinguishes them, there is a growing body of "Economic Duress" case law that blurs this. In some contexts (like consumer protection or tenant law), courts are beginning to recognize that "take it or leave it" contracts in essential services can be voided due to power imbalance. I am hesitant to say the line is solid everywhere, because it is actively eroding in some consumer protection sectors, even if employment law remains rigid.

  **One Specific Warning:**
  Be careful assuming "Rich Countries" act the same.
  *   **USA:** Heavily Negative Liberty. At-will employment is the norm.
  *   **Germany/France:** Heavily Republican/Positive. Dismissal requires cause, works councils exist.
  *   **UK:** In between.
  If you apply the "Ruin Test" to the US, the law fails miserably. If you apply it to Germany, it passes better. The "strange package" you noticed is largely an American phenomenon (mixing free-market rhetoric with New Deal regulations). In Europe, the Republican view is already much more embedded in the code.

  ### Summary
  You haven't mangled the philosophy; you've identified the fault lines. The law is inconsistent because it tries to run a market (Negative Liberty) inside a society that believes people shouldn't be slaves (Republican) and deserves a decent life (Positive).

  Your **Ruin Test** is a potent heuristic. It doesn't necessarily replace Republicanism, but it updates it for a fragmented, gig-economy world where domination doesn't always come from one Master, but from a network of precarious dependencies. If you built law on that, you wouldn't just ban bad contracts; you would actively engineer redundancy into people's livelihoods.
