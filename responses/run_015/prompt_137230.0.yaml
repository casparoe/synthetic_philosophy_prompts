  # The technical crux
  Miriam's mathematical intuition in (3) is sound. Good's theorem relies on the law of iterated expectations: posterior beliefs form a martingale, so their expectation equals the prior. If the utility function over credences, $U(p)$, is convex, Jensen's inequality ensures $E[U(p_{post})] \ge U(E[p_{post}]) = U(p_{prior})$. Since linear functions are convex (satisfying equality), expected linear dread remains constant, preserving the non-negative value of information derived from instrumental acts. Ted's counterexample in (4) succeeds because a threshold function is non-convex; it creates a region where the average utility of resolved states falls below the utility of the uncertain prior. Consequently, the necessary and sufficient condition for Good's theorem to hold with credence-dependent utility is strictly that the utility function be convex in the probability argument. Ted wins the technical point: phenomenologically accurate "dread" often violates this convexity condition, meaning the theorem cannot rule out avoidance without further normative premises about admissible utility functions.

  # What both are missing
  Both colleagues overlook external consequences and dynamic inconsistency. First, genetic testing often alters insurability or employability; this changes the *state* space and payoffs externally, not just internal dread, making information avoidance instrumentally rational even under standard utility. Second, they assume dynamic consistency. Real agents often exhibit preference reversals: ex ante, they prefer ignorance to avoid anxiety, but ex post, they might value knowing. Good's theorem assumes a stable preference ordering over time. If an agent anticipates this reversal, avoiding information manages future self-control problems, not just utility curvature. Finally, they ignore computational costs; processing diagnostic information requires cognitive labor, violating the "costless" assumption. These factors explain avoidance without needing to contest the convexity of dread, suggesting the debate is too internalist.
