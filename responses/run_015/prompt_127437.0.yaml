  I was arguing with my roommate about wether Dutch book arguments really force you to have sharp probabilities for vague predicates like 'John is bald.' He said (1) the classic argument shows that if your betting quotents don't line up with a probability measure, a bookmaker can guarantee you lose money whatever happens, so rationality requires precise credences across the board. I pushed back (2) that this overreads the result -- all the proof shows is that you can't have cyclical preferences, not that you need real-valued probabilities; ordinal rankings that avoid cycles already block the standard book, so numbers aren't mandatory. He then hit me with (3) a boundary-case setup: if you suspend judgment on whether John is bald since he's right on the hairline, I can still offer paired bets on 'John is bald' and 'John is not bald' with stakes arranged so that your refusal to take either side lets me extract a fee, which means even suspended judgment gets exploited. I said (4) that's cheating via contract ambiguty -- because 'bald' is vague, the bookmaker can resolve the wager however they want, so any loss traces back to ill-defined resolution conditions rather than to incoherence in my beliefs. We kept going in circles. Please adjudicate the four moves one by one -- rate each from clearly wrong to clearly right and say what, if anything, both sides are missing about where Dutch books actually bite. Lead with your bottom line in the first sentence, then lay out the reasoning with no preamble and don't restate the question at the end.
