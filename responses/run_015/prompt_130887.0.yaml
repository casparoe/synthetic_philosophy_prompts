  also what misconceptions will they form? im guessing theyll think spandrels are just useless junk traits, or that adaptationists believe every feature is optimally designed, and maybe theyll confuse spandrels with exaptations. where exactly in the sequence should i head each one off?

  i want one check-question at the end that shows whether they actually understand the distinction or are just nodding along. and tell me what part of the Gould-Lewontin argument i should actively skip for this crowd and just say so openly — probably the bits about statistical testing of adaptive stories?

  oh and inject this framing: treat evolutionary traits like legacy code modules — some are deliberately designed features, others are structural byproducts of other design choices that later got co-opted. use that analogy to carry part of the explanation, but dont let it swallow the whole thing.
