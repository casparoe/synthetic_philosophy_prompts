answer: |-
  Here is a 40-minute teaching plan designed for a technical audience. It leverages their mental models (architecture, legacy code) to ground the biological concepts without letting the analogy overtake the science.

  ### **Session Title:** Spandrels & Legacy Code: When Evolution Hacks, Doesn't Design
  **Time:** 40 Minutes
  **Goal:** Attendees can distinguish between a trait selected *for* a purpose vs. a trait that is a structural byproduct later co-opted.

  ---

  ### **0:00–0:05 | The Hook: Architectural Necessity**
  **Goal:** Define "Spandrel" physically before biologically.
  *   **Visual:** Show a photo of the San Marco Basilica arches. Point to the triangular spaces between the arches.
  *   **Definition:** These spaces weren't "designed" to hold mosaics. They are the **inevitable geometric byproduct** of putting a dome on four arches. You cannot have the arches without the spandrels.
  *   **The Trap:** If an alien archaeologist saw the mosaics, they might claim, *"The triangle was designed specifically to display art."* That is the adaptationist error.
  *   **Transition:** "In biology, we make this alien archaeologist mistake all the time. We assume every feature is a feature request, not a side effect."

  ### **0:05–0:10 | The Bridge: The Legacy Code Analogy**
  **Goal:** Map the architecture concept to their daily reality.
  *   **The Frame:** Treat the genome like a massive, 4-billion-year-old monolithic codebase with no documentation.
  *   **Adaptation:** A module written specifically to solve a ticket (e.g., `function digest_lactose()`).
  *   **Spandrel:** A structural side-effect of a refactor.
      *   *Example:* You change the database schema to support User Auth. As a side effect, a new index is created. It slows down writes but speeds up reads.
      *   *The Error:* Assuming the index was *intentionally* created for read-speed, rather than being a byproduct of the Auth schema.
  *   **Why this framing:** It stops them from thinking "Design = Intelligent Designer." In code, "Design" just means "Selected for retention."

  ### **0:10–0:15 | The Bio Shift: Adaptationism vs. The Critique**
  **Goal:** Define the opponent (Adaptationism) without caricaturing it.
  *   **Adaptationism:** The working hypothesis that most traits exist *because* they were selected for their current utility. (Not that they are "perfect," but that they are "solutions").
  *   **Gould & Lewontin (1979):** They argued this leads to "Just-So Stories." If you see a trait, don't just invent a story about why it's useful. Ask: *Is this a feature, or is this a spandrel?*
  *   **Head Off Misconception #1 (Optimality):** Clarify now: Adaptationists don't think traits are *optimal*. They think traits are *selected*. A spandrel critique isn't saying "evolution is bad at design," it's saying "not everything is a design."

  ### **0:15–0:25 | The Carrying Example: Bird Feathers**
  **Goal:** One concrete biological example to do the heavy lifting.
  *   **Why NOT the Panda's Thumb?** It's a *constraint* example (making do with available bones), not a pure architectural byproduct. It confuses "lack of options" with "structural side-effect."
  *   **Why NOT the Human Chin?** It's scientifically disputed. Some biologists argue the chin *is* an adaptation for stress resistance during chewing. You don't want your core example to be a debate.
  *   **The Example:** **Feathers.**
      *   *The Adaptationist Story:* "Feathers evolved for flight." (They are aerodynamic, therefore they were selected for aerodynamics).
      *   *The Spandrel Reality:* Fossil evidence shows filamentous feathers existed on non-flying dinosaurs (Velociraptors) millions of years before flight.
      *   *The Mechanism:* They likely originated as structural byproducts of skin scaling for **thermoregulation** (insulation).
      *   *The Co-option:* Once the "insulation module" existed, the "flight module" co-opted it.
      *   **Legacy Code Parallel:** The `Insulation` class had a public method `get_surface_area()`. The `Flight` service didn't write that method, but it depends on it now. The method wasn't *designed* for flight, but flight is impossible without it.

  ### **0:25–0:35 | Misconception Interception**
  **Goal:** Explicitly correct the three likely errors.
  *   **1. "Spandrels are just junk/useless."**
      *   *Correction:* Refer back to the mosaics. Spandrels are often *painted on*. They become useful *later*.
      *   *Bio:* Feathers are vital for flight now. They just weren't *selected for* flight originally.
      *   *Timing:* Address this immediately after the Feathers example.
  *   **2. "Spandrel vs. Exaptation."**
      *   *Correction:* These are two sides of the same coin.
          *   **Spandrel:** Describes the **Origin** (Byproduct).
          *   **Exaptation:** Describes the **Current Use** (Co-opted).
      *   *Analogy:* The database index is a *Spandrel* of Auth. Using it for Analytics is an *Exaptation*.
      *   *Timing:* Address this here to solidify terminology.
  *   **3. "Adaptationists believe everything is perfect."**
      *   *Correction:* Remind them of the 0:10 mark. Adaptationists believe traits are *solutions*, not necessarily *elegant* ones. The critique is about **narrative**, not quality.

  ### **0:35–0:37 | The Skip: Statistical Testing**
  **Goal:** Acknowledge the hard science, then move on.
  *   **What to say:** "Gould and Lewontin proposed rigorous null hypotheses to test adaptationism (e.g., 'Can we model this trait as drift?'). The math for this is heavy population genetics. For our purposes, we are focusing on the **logical framework**, not the statistical methodology. If you want to test if a trait is a spandrel, you need fossil records or comparative phylogenetics, not just logic."
  *   **Why skip:** It turns a conceptual discussion into a statistics lecture. Engineers care about the architecture pattern, not the unit test implementation details.

  ### **0:37–0:40 | The Check Question**
  **Goal:** Verify they understand the distinction between *Utility* and *Origin*.
  *   **The Scenario:**
      > "You inherit a legacy microservice. It has an endpoint `GET /status` that returns a JSON blob. It turns out this blob contains a timestamp hash that perfectly solves a security vulnerability in a *different* service. The original dev did not know about this vulnerability."
  *   **The Question:**
      > "Is the timestamp hash an **Adaptation** for security, or a **Spandrel** co-opted for security? And why does it matter for how we document the system?"
  *   **The Correct Answer:**
      *   It is a **Spandrel** (origin was likely just logging/debugging) that has been **Exapted** (co-opted) for security.
      *   **Why it matters:** If you treat it as an Adaptation, you assume it's robust and optimized for security. If you treat it as a Spandrel, you know it's fragile; if the logging logic changes, the security breaks. (In bio: If you assume a trait is an adaptation, you assume it's stable. If it's a spandrel, it might vanish if the underlying architecture changes).

  ---

  ### **Facilitator Notes: Managing the Room**
  *   **If they get stuck on "Intelligent Design":** Remind them: "In code, 'selection' is the compiler or the product manager. In bio, 'selection' is survival. Neither implies a conscious human designer."
  *   **If they argue Feathers *are* for flight:** Push back on the timeline. "Flight came 50 million years after the filaments. You can't select for a feature that doesn't exist yet."
  *   **If the Code Analogy takes over:** Pull it back. "Code has developers; Biology has filters. The analogy holds for structure, not intent."
