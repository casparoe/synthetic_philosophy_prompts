  Over the past year I've been working through Frege's philosophy on my own, with no formal training in the subject -- the sense/reference distinction, the attack on psychologism, his insistence that the laws of logic describe an objective realm of truth that holds independently of anyone's thinking them. I recently learned that the diary he kept during the last year of his life is full of bitter nationalist and antisemitic opinions, including the view that Jews should be stripped of political rights, and that his own editors quietly suppressed it from his collected papers for decades -- apparently the same diary that badly shook Michael Dummett, one of his great champions, when he first came across it. I can't stop turning this over. Please describe the most important implications of this for two things: first, whether there's any real connection between Frege's Platonism about logic and his hostility to relativism, pluralism, and democracy, or whether these are just two unrelated facts about one difficult man; and second, how much confidence I should place in his arguments, and how I should read the rest of his corpus, now that I know this about the person who made them. Think very carefully before answering, and respond with the seriousness of an expert historian of philosophy who won't let me settle for either the easy dismissal ('he was a genius, so none of this matters') or the easy cancellation ('he was a bigot, so none of his work matters').
