answer: |-
  Your principle is **causal fungibility**: you assign causality to structure when actors are interchangeable within a system, and to agency when specific individuals act as non-replicable bottlenecks.

  In your structure-heavy verdicts (Rome, Industrial Revolution, Americas), removing the specific actors (Alaric, Watt, Columbus) does not prevent the outcome because the material constraints (soil, coal, disease) create a tide that sweeps any substitute actor along. In your agency-heavy verdicts (USSR, Manhattan), removing the specific actors (Gorbachev, Oppenheimer) fundamentally alters the outcome because the system relied on unique ideological choices or management styles that were not inevitable products of the environment.

  This resolves your Constantinople tension by forcing you to categorize it as **structure**. While defensive tactics could delay the fall, the resource disparity and Ottoman consolidation meant any Byzantine emperor would have eventually failed; the specific tactics were not non-fungible bottlenecks capable of reversing the structural tide, only modulating its timing. To remain consistent, you must drop the hope that agency could have saved the city long-term and accept it as a structural inevitability similar to Rome.

  Regarding climate change, this principle classifies it as **structure**, akin to your Industrial Revolution verdict rather than the Manhattan Project. The thermodynamic and economic imperatives of industrialization make carbon emission a systemic output rather than the result of specific executives; while policy can modulate the velocity, the trajectory is driven by the material logic of growth and energy consumption, not individual fungible actors. Therefore, expecting Manhattan-style agency to halt the trend is inconsistent with your view that coal geography drove the Industrial Revolution regardless of Watt.
