answer: |-
  **METAPHYSICS SEMINAR: FINAL EXAMINATION**
  **Time Allowed:** 45 Minutes
  **Word Limit:** Approx. 1000 words
  **Total Marks:** 20

  **Question 1**

  Consider the following case (**The Handover Case**):

  A turbine blade is made of a ceramic in phase $\alpha$. It is fragile—meaning it shatters under hard impact—and it is fragile in virtue of having the $\alpha$ microstructure. The blade also carries a monitoring device that is permanently fitted to it (constituting an intrinsic part of the object, not an external addition). The device detects an incoming impact a microsecond before contact and reorganises the surface layer of the ceramic into phase $\beta$. Phase $\beta$ is, quite independently, also a shatter-under-impact structure: blades made entirely of phase-$\beta$ ceramic shatter under hard impacts just as readily as $\alpha$ ones do.

  The blade is struck hard, and it shatters.

  Assume for the sake of argument that the blade is genuinely fragile at the moment prior to impact. Write an essay that addresses the following four points:

  1.  **Classification:** Given that the relevant stimulus-conditional is true and the manifestation occurs, but the microstructure responsible for the initial ascription of fragility ($\alpha$) is absent at the moment of shattering, where does this case sit in relation to the standard conditional analysis and its counterexamples?
  2.  **The Retention Fix:** Does the strategy of requiring the object to *retain* its causal basis through to the manifestation yield the correct verdict here? Explain why the fact that the monitoring device is **intrinsic** prevents this from being dismissed as a standard extrinsic interference case.
  3.  **The Disjunctive Trap:** A proponent of the retention fix might argue the causal basis is simply the disjunction ($\alpha \lor \beta$). Explain why this move is theoretically costly or inadequate.
  4.  **Resolution:** Take a stand on what constraint must be added to the analysis of dispositions to handle this case. What is the metaphysical cost of adopting your proposed constraint?

  ***

  **MODEL ANSWER**

  The Handover Case presents a sophisticated challenge to dispositional realism, specifically targeting the link between a disposition and its categorical basis. While the standard conditional analysis ("if struck, then shatter") is satisfied, and the manifestation (shattering) occurs, the case reveals a discontinuity in the metaphysical grounding of the disposition.

  **Classification**
  In the standard taxonomy, this case initially resembles a successful application of the conditional analysis. The counterfactual holds: if struck, it shatters. The manifestation occurs. However, it diverges from standard cases because the property that grounded the disposition at the time of ascription (phase $\alpha$) is not the property present at the time of manifestation (phase $\beta$). It is not a "fink" in the standard sense, because the disposition is not lost prior to impact; nor is it a "mask," because the manifestation is not prevented. It is a case of **basis-switching** where the conditional remains true only because the new basis ($\beta$) mimics the causal powers of the old one ($\alpha$).

  **The Retention Fix and Intrinsic Nature**
  The Lewis-style repair suggests that for a disposition to be real, the object must retain the causal basis from the time of ascription to the time of manifestation. In the Handover Case, this fix yields a **negative verdict**: the blade does *not* retain the $\alpha$ basis. It loses $\alpha$ and gains $\beta$. Consequently, the retention fix implies the blade was not truly fragile (or at least, the fragility did not cause the shattering in the right way).

  The intrinsic nature of the monitoring device is crucial here. If the device were external (e.g., a sorcerer protecting the blade), we could dismiss the basis change as extrinsic interference, preserving the intuition that the blade itself remained fragile. However, because the device is intrinsic, the basis-change mechanism is internal to the object. We cannot separate the "true" blade from the "interfering" device. The object *as a whole* changes its microstructure. Therefore, the failure to retain the basis is a failure of the object itself, not an external disruption. The retention fix correctly identifies that the specific $\alpha$-grounded fragility did not survive, but this creates a problem: intuitively, the blade *is* fragile, and it *did* shatter because of its ceramic nature.

  **The Disjunctive Trap**
  To save the retention fix, one might argue the causal basis is not $\alpha$, but the disjunction $\alpha \lor \beta$. Since the blade possesses ($\alpha \lor \beta$) before the strike and ($\alpha \lor \beta$) during the strike (specifically $\beta$), the basis is retained.

  This move must be rejected. Firstly, it renders the causal basis explanatorily inert. The blade shatters in virtue of $\beta$, not in virtue of the disjunction. Dispositions are supposed to track causal powers; a disjunctive property does not possess unified causal powers unless the disjuncts share a deeper commonality. Secondly, it opens the door to gerrymandering. For any disposition, we could construct a disjunction of every possible microstructure that could realize it. This makes the "causal basis" trivial and loses the connection between specific physical structures and specific dispositions. It saves the theory by emptying it of content.

  **Resolution and Cost**
  The correct resolution is to accept that dispositions require a **natural, non-disjunctive causal basis** that is stable across the relevant timeframe. We must constrain the analysis such that a disposition is individuated not just by its stimulus and manifestation, but by the specific natural property grounding it. In the Handover Case, the $\alpha$-fragility ceases to exist when $\alpha$ is lost; a new $\beta$-fragility comes into existence. The shattering is the manifestation of the latter, not the former.

  The metaphysical cost of this view is significant. It commits us to a robust theory of **natural properties**, distinguishing "real" bases ($\alpha$, $\beta$) from "gerrymandered" ones ($\alpha \lor \beta$). This requires a metaphysics that can ground naturalness without circularity. Furthermore, it fragments dispositions: the blade does not have one property "fragility," but a sequence of distinct fragility-properties as its microstructure shifts. This complicates our ordinary discourse, where we treat "fragility" as a single, enduring trait. We must accept that ordinary language groups distinct metaphysical properties under one label for pragmatic reasons, but strict metaphysics must distinguish them. The cost is a divergence between folk dispositional talk and the underlying metaphysical reality.

  ***

  **MARKING SCHEME**

  **Total Marks:** 20 (4 marks per point)

  **1. Classification of the Case (4 Marks)**
  *   **Must Hit:** Identify that the conditional is true and manifestation occurs, but the *specific* basis ($\alpha$) is lost. Identify this as a basis-switching scenario, distinct from standard finks (where disposition is lost) or masks (where manifestation is blocked).
  *   **Common Botch:** Treating it as a standard Fink case (saying the disposition disappears) or claiming the conditional is false.
  *   **A vs B:** A-grade answers explicitly note the tension: the conditional succeeds *only* because a new basis takes over.

  **2. The Retention Fix & Intrinsic Device (4 Marks)**
  *   **Must Hit:** State that the Retention Fix fails (basis is not retained). Explain that because the device is **intrinsic**, the change counts as a change in the object itself, blocking the move to call it "external interference."
  *   **Common Botch:** Ignoring the intrinsic/extrinsic distinction or claiming the fix works because the object is still "the same object."
  *   **A vs B:** A-grade answers explain *why* intrinsic matters (it prevents isolating the 'true' disposition from the 'interference').

  **3. Rejection of the Disjunctive Base (4 Marks)**
  *   **Must Hit:** Argue against the ($\alpha \lor \beta$) solution. Key reasons: it is gerrymandered/ad hoc, or it lacks explanatory power (the shattering is caused by $\beta$, not the disjunction).
  *   **Common Botch:** Accepting the disjunction as a valid solution, or rejecting it merely because "it feels wrong" without metaphysical justification.
  *   **A vs B:** A-grade answers focus on the loss of *causal explanation* or the problem of unlimited disjunctions.

  **4. Positive Stance on Individuation (4 Marks)**
  *   **Must Hit:** Propose a constraint: dispositions are individuated by their specific natural basis, or bases must be stable/natural properties.
  *   **Common Botch:** Remaining neutral ("there are two sides...") or proposing a vague fix ("we need better counterfactuals").
  *   **A vs B:** A-grade answers clearly state that $\alpha$-fragility and $\beta$-fragility are metaphysically distinct properties.

  **5. The Metaphysical Cost (4 Marks)**
  *   **Must Hit:** Identify the cost of the stance in (4). E.g., commitment to natural properties, fragmentation of ordinary concepts, or divergence between language and reality.
  *   **Common Botch:** Failing to identify a cost, or stating a cost that doesn't follow from their stance.
  *   **A vs B:** A-grade answers articulate the tension between pragmatic language and metaphysical precision.

  **General Note on A vs B:**
  *   **B Grade:** Correctly identifies the problems and follows the taxonomy but hedges on the conclusion or treats the "cost" as a minor footnote.
  *   **A Grade:** Commits to a specific metaphysical picture (e.g., fragmentation of dispositions) and clearly articulates the theoretical price paid (e.g., reliance on Natural Properties) to maintain that picture. Handles the "intrinsic" constraint as a pivotal metaphysical hinge, not just a detail.

  **Loophole Note:**
  *   *Student objects: "The blade isn't fragile at t1 because it has the device."*
  *   **Credit:** Award full marks for **Classification** and **Retention** if they argue this coherently. The prompt says "Assume for the sake of argument," so they must engage with the assumption. If they reject the assumption, they must explain why the *intrinsic* device negates the initial fragility ascription without relying on the basis-switch (which happens later). This is a hard path; reward it only if they argue the *presence* of the switch mechanism itself undermines the $\alpha$-basis stability initially.
