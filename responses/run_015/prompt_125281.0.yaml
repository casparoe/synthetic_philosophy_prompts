prompt: |-
  Posting here because I've been going in circles on this for weeks and I'd rather be told I'm confused than keep guessing.

  Context: I got into forecasting a few years ago, the kind where you put a percentage on whether something will happen and a site scores you on it after. Since then I keep noticing the same shape of argument turning up in totally unrelated disputes, and I can't tell whether it's one argument in different clothes, or two arguments that look alike, or two plus a mistake.

  Version one. Someone says: your numbers don't hang together, you'll say 40% that it rains tomorrow and 70% that it doesn't, and if so I can offer you two separate bets, each of which you'd have to call fair or better by your own lights, and you lose money whichever way the weather goes. I get the move. What I get stuck on is how much it needs: I have to take both bets, at the numbers I gave, from someone who somehow knows those numbers. I don't bet. And if a guy on a street corner offered me a pair of bets that was a sure thing for him, I'd of said no. So what is this supposed to establish, that I'm wrong about the weather, or that I'd be in trouble in a situation I'm not in?

  Version two, which I think is a different animal. Whatever happens, there was a different set of numbers you could have given that would have scored better. Not probably better, better in every single outcome. No bets, no money, nobody exploiting anybody, nothing you actually lose. The bad thing is just that you did worse on a score than you could have done. This seems to do the same rhetorical work as version one and I can't say what the shared part is.

  Version three, the one I really can't place. How much I'd pay for a dollar-if-it-rains depends on the size of the stake and on my rent: 60 cents at a dollar stake, 45 at a hundred, nothing at all at a year's rent. So there's no single number there to build anything out of. And when I try to rebuild the version-one construction with stake-sensitive prices, sometimes I can't make it work against someone whose opinions are visibly incoherent, and sometimes it looks like I can make it work against someone whose opinions are perfectly fine.

  A friend said "Dutch book" once but she was half asleep and I think she only meant the first one. So: is there a name for the family, and if there is, does it cover all three? Please don't hand me a list of names and papers, I've got no journal access from where I am right now and I don't want reading suggestions. What I want is the carving: what each version actually establishes, and I mean which of these it is, that someone has a false belief, that they're internally inconsistent, that they can be reliably parted from their money, because those look like three different things; what the shared form is and what the minimum ingredients are for it to have any force at all; and where the edge is, the case where something that looks exactly like this has no force whatsoever. If the general thing has no name, then name it, define it, and tell me what wouldn't count as an instance.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is into forecasting (probabilistic prediction) and has noticed a recurring argumentative structure in disputes about probability/belief.
      *   **Problem:** They see three "versions" of this argument and can't tell if they are the same thing, different things, or if one is a mistake. They want clarity on what each establishes (false belief, inconsistency, financial loss), the shared form, the minimum ingredients for force, and the boundary cases where it fails.
      *   **Constraints:** No reading lists, no journal access, no "go look this up." They want a conceptual carving/explanation. They want a name if one exists, or to name it if not.
      *   **Tone:** Analytical, precise, respectful of their confusion (which is well-founded), avoiding academic jargon where possible without losing precision.

  2.  **Deconstruct the Three Versions:**

      *   **Version 1 (The Betting/Dutch Book Argument):**
          *   *Claim:* Your probabilities sum to >100% (40% rain + 70% no rain = 110%).
          *   *Mechanism:* A bookie offers bets based on your prices. You lose money regardless of outcome.
          *   *User's Objection:* I don't bet. I wouldn't take those bets. Why does this matter if I'm not in that situation?
          *   *Philosophical Status:* This is the classic *Dutch Book Argument*. It establishes *pragmatic inconsistency*. It shows your commitments *would* lead to loss *if* you acted on them as betting prices.

      *   **Version 2 (The Scoring Rule/Dominance Argument):**
          *   *Claim:* There existed a different set of numbers that would have yielded a better score *in every possible outcome*.
          *   *Mechanism:* Proper Scoring Rules (like Brier score or Log score).
          *   *User's Observation:* No money changes hands, no exploiter. Just "you did worse than you could have."
          *   *Philosophical Status:* This is *Accuracy Dominance* or *Incoherence via Scoring Rules*. It establishes *epistemic sub-optimality*. It shows your beliefs are less accurate than they could have been, regardless of truth.

      *   **Version 3 (The Stake/Utility Sensitivity Argument):**
          *   *Claim:* My "probability" changes based on how much is at stake (linear vs. non-linear utility).
          *   *Mechanism:* Trying to apply Version 1 logic to stake-sensitive prices.
          *   *User's Observation:* Sometimes the "Dutch Book" works on incoherent people, sometimes it "works" on coherent people (false positive), or fails on incoherent people (false negative).
          *   *Philosophical Status:* This highlights the confusion between *Probability* and *Utility*. It's the *Stake Relativity* problem. Probabilities should be stake-invariant; utilities are stake-sensitive. If you conflate them, the math breaks.

  3.  **Synthesize the "Family" of Arguments:**
      *   What is the shared core? It's about **Coherence**.
      *   Specifically, it's about **Probabilistic Coherence** (adhering to the axioms of probability).
      *   The "Name": The broad family is **Coherence Arguments**. Version 1 is specifically a **Dutch Book**. Version 2 is **Accuracy Dominance**. Version 3 is a **Category Error** (mixing probability and utility).
      *   The "Force": The force comes from the idea that if your numbers violate the laws of probability, they fail a basic test of rationality, whether measured in money (V1), accuracy points (V2), or logical consistency (V3).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user. They aren't confused; they've spotted distinct but related arguments. Give the umbrella name: **Coherence Arguments**.
      *   **Addressing Version 1 (The Dutch Book):**
          *   *What it establishes:* Not that you are wrong about the weather, but that your *commitments* are inconsistent.
          *   *The "I don't bet" objection:* Address this directly. It's a *hypothetical* vulnerability. It shows your degrees of belief *function* like bad prices. It's about the *structure* of your belief, not your wallet.
          *   *Verdict:* Establishes **Pragmatic Inconsistency**.
      *   **Addressing Version 2 (The Scoring Rule):**
          *   *What it establishes:* You left points on the table. You were less accurate than necessary.
          *   *Relation to V1:* It's the epistemic twin. V1 says "you'd lose money," V2 says "you'd lose accuracy."
          *   *Verdict:* Establishes **Epistemic Dominance** (you are objectively less accurate).
      *   **Addressing Version 3 (The Stake Sensitivity):**
          *   *What it establishes:* This is the trap. This reveals that you aren't reporting *probabilities*, you're reporting *prices* (which include utility/risk aversion).
          *   *Why V1 fails here:* Dutch Books assume linear utility (a dollar is a dollar). If utility is non-linear (rent money vs. pocket change), the Dutch Book math doesn't apply directly to the numbers you gave.
          *   *Verdict:* This isn't a coherence argument; it's a **Definition Failure**. You aren't giving probabilities.
      *   **The Shared Form (The Carving):**
          *   Input: A set of numbers representing confidence.
          *   Condition: The numbers violate the laws of probability (e.g., P(A) + P(not A) != 1).
          *   Consequence: A negative result follows (Loss of money, Loss of score, Logical contradiction).
          *   *Minimum Ingredients:* You must treat the numbers as *guides to action* (V1) or *measures of accuracy* (V2).
      *   **The Edge/Boundary:**
          *   Where does it have no force? When the numbers aren't meant to be probabilities (e.g., Version 3 stake-sensitive prices). When the "bookie" can't actually offer the bets (V1 practical limitation). When the scoring rule is *improper* (V2 limitation).
      *   **Naming:** Call it **The Coherence Constraint**.

  5.  **Refining the Tone and Content:**
      *   *Self-Correction on V1:* Make sure to emphasize that V1 doesn't prove the *belief* is false (it might rain), but that the *system* is broken.
      *   *Self-Correction on V3:* Be careful not to say V3 is "wrong," but that it conflates Probability with Utility. The "Dutch Book" only works on probabilities, not utility-adjusted prices.
      *   *Clarity Check:* Ensure the distinction between "False Belief" (about the world) and "Inconsistent Belief" (about the numbers) is sharp.
      *   *Addressing the "Force":* Why should I care? Because if you are incoherent, you are systematically self-sabotaging, either financially or epistemically.

  6.  **Final Polish:** Check against constraints. No papers. No "read de Finetti." Just the concepts. Ensure the "Name" is provided (Coherence Arguments/Dutch Book/Accuracy).

      *(Self-Correction during drafting)*: I should explicitly name the "Family." In philosophy of probability, this is often grouped under **Probabilistic Coherence** or **Rationality Constraints**. I will use **Coherence Arguments** as the umbrella term. I need to make sure I answer the specific question: "What each version actually establishes."

      *   V1: You are vulnerable to exploitation (if you act).
      *   V2: You are sub-optimal at tracking truth.
      *   V3: You are measuring the wrong thing (Utility vs Probability).

      Let's assemble the response.

      *   *Opening:* Acknowledge the insight.
      *   *The Umbrella:* Coherence.
      *   *Breakdown:* V1 (Pragmatic), V2 (Epistemic), V3 (Category Error).
      *   *The Shared Form:* Violation of Probability Axioms.
      *   *The Edge:* Non-linear utility / Non-probabilistic intent.

      *Wait, one nuance on V3:* The user says "sometimes I can make it work against someone whose opinions are perfectly fine." This is key. If I use stake-sensitive prices, I might look incoherent (P(A) + P(~A) > 1) because I'm risk-averse, not because I'm probabilistically incoherent. So the "Dutch Book" loses force because the premise (that these numbers represent fair betting odds with linear utility) is false. I need to highlight this.

      *Final Plan:*
      1. Name the family: **Coherence Arguments**.
      2. Analyze V1: **Pragmatic Inconsistency** (Dutch Book).
      3. Analyze V2: **Epistemic Dominance** (Accuracy).
      4. Analyze V3: **The Utility Confusion** (Where the argument breaks).
