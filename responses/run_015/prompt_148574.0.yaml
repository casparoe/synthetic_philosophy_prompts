      *   *Section 2: The Constraint of Real Patterns.* Dennett isn't a radical constructivist. Narratives must track "real patterns." If the neurological condition isn't a real pattern in the physical history, the narrative fails. This blocks arbitrary rewriting.
      *   *Section 3: The Social Dimension (The Web of Discourse).* This is the crucial block against solipsism. Others hold the narrative accountable. You can't unilaterally change the center of gravity if the community keeps pulling it back.
      *   *Section 4: Moral Responsibility in a Compatibilist Frame.* Shift the definition of responsibility. It's not about backward-looking metaphysical blame; it's about forward-looking social regulation. Does the new narrative change our *reactive attitudes*? If the pathology is real, yes. If it's an excuse, no.
