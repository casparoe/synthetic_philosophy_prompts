answer: |-
  ### I. Translating the Tripartite Taxonomy into Mechanism Design

  To map the tripartite taxonomy of liberty onto mechanism design, we must treat "liberty" not as a moral status but as a property of the game form, the information structure, and the equilibrium path of an institutional system. We treat the individual as the **Agent** and the state or social structure as the **Principal** (or Planner).

  #### 1. Negative Liberty: *Ex Ante* Constraints on Principal Discretion
  **Concept:** Negative liberty is the absence of external impediments to action.
  **Mechanism Design Translation:** A contracting regime where the Principal's action space is rigidly constrained *ex ante*, minimizing *ex post* discretionary authority.

  *   **Institutional Architecture:** A **Minimal Contracting Regime**. The social choice function is implemented via default rules rather than specific mandates. The Agent retains high-value **outside options** (exit rights). The Principal's technology for interference (monitoring or enforcement) is intentionally made high-cost or technically infeasible.
  *   **Key Variables:**
      *   **Incentive Compatibility (IC):** The Agent's IC constraints are loose; the Agent maximizes utility without needing the Principal's approval.
      *   **Information:** High information asymmetry favoring the Agent (privacy). The Principal cannot observe the Agent's type or action without prohibitive monitoring costs.
      *   **Commitment:** The Principal's commitment to non-interference is credible because the *ex ante* constitutional rules remove the *ex post* technical capacity to interfere.
  *   **Translation Fidelity:** This maps cleanly. Negative liberty corresponds to a feasible set that is not truncated by the Principal's constraints. The "absence of impediments" is the absence of binding IC constraints imposed by the Principal.

  #### 2. Positive Liberty: Endowment Expansion and Preference Alignment
  **Concept:** Positive liberty is self-mastery or the presence of conditions for autonomous action (capacity).
  **Mechanism Design Translation:** A planning regime where the Principal modifies the Agent's budget set or utility function to ensure the Agent can implement their preferred social choice function.

  *   **Institutional Architecture:** A **Capability-Enhancing Planner**. The Principal acts to resolve internal or structural failures that prevent the Agent from acting on their true preferences. This involves resource transfers (endowment expansion) or "preference alignment" mechanisms (education, nudges) that alter the Agent's payoff structure.
  *   **Key Variables:**
      *   **Feasible Set:** The Principal expands the Agent's budget constraint, allowing actions that were previously technically or economically infeasible.
      *   **Principal Objective:** The Principal's objective function is weighted heavily toward the Agent's "true" or "rational" utility (potentially distinct from revealed preference), aiming to align the Agent's *ex post* actions with their *ex ante* higher-order preferences.
      *   **Information:** Low information asymmetry. The Principal requires deep knowledge of the Agent's needs to allocate resources effectively.
  *   **Translation Fidelity:** This requires distortion. Positive liberty is about *self*-mastery, but in mechanism design, expanding the feasible set usually requires an external Planner. This risks translating "autonomy" into "heteronomy managed by a benevolent Principal." The mechanism captures the *capacity* to act, but potentially at the cost of the *source* of that capacity.

  #### 3. Republican Liberty: Elimination of *Ex Post* Discretionary Authority
  **Concept:** Republican liberty is non-domination. It is not merely the absence of interference, but the absence of the *capacity* for arbitrary interference.
  **Mechanism Design Translation:** An architecture where the Principal's *ex post* discretionary authority is structurally eliminated, regardless of the Principal's incentives or equilibrium behavior.

  *   **Institutional Architecture:** **Distributed Veto Points with Transparent Audit Trails**. The technology of interference is not just costly (as in negative liberty) but structurally fragmented. Interference requires multi-signature authorization or is subject to automatic, costless auditing.
  *   **Key Variables:**
      *   **Arbitrariness:** Defined as **Unconstrained Discretion**. A Principal dominates if they possess a technology of interference that is not bound by verifiable signals or IC constraints.
      *   **Counterfactuals:** The focus shifts from the equilibrium path (what the Principal *does*) to the game form (what the Principal *can* do).
      *   **Credible Commitment:** Non-domination requires that the Principal *cannot* interfere, not merely that it is not in their interest to interfere.
  *   **Translation Fidelity:** This is the most strained translation. Mechanism design typically focuses on equilibrium outcomes. Republicanism focuses on the *modal* status of the Agent (what is possible across possible worlds, not just the actual world).

  ---

  ### II. Translation Fidelity and Distortion Analysis

  #### What Translates Cleanly
  **Negative Liberty** is the native tongue of mechanism design. The concept of a "constraint" is fundamental. A free market is simply a mechanism where the Principal (State) has no private information and no action space that overrides the Agent's budget set. The "cost structures of monitoring" map directly to the "absence of impediments." If monitoring is too expensive, the Agent is effectively free.

  **Positive Liberty** translates well regarding *resources*. If liberty is the size of the feasible set, then mechanism design handles this via budget constraints and endowment allocation. However, the translation distorts the *psychological* component of self-mastery. Mechanism design treats preferences as fixed parameters (types). It cannot easily model "rational self-direction" unless we model the Agent as two different players (a principal-agent problem within the self), which complicates the institutional mapping.

  #### What Must Be Distorted
  **Republican Liberty** requires the most significant distortion. In mechanism design, institutions are evaluated by their **equilibrium outcomes** (allocations and utilities). If a Master has the power to interfere but chooses not to because it is too costly (an incentive constraint), the mechanism designer sees a "Free Outcome."
  The Republican claims the Agent is *unfree* even if the Master never interferes, provided the Master *retains the capacity*. To translate this, we must treat the **game form itself** as the object of evaluation, not the equilibrium. We must value the *absence of a move* in the Principal's action space, even if that move is never played in equilibrium. This requires treating structural parameters as utility-bearing, which is non-standard in mechanism design.

  #### What Has No Counterpart
  **The Normative Status of Counterfactuals.** Mechanism design is fundamentally consequentialist regarding institutional performance. It asks: "Given this mechanism, what happens?" Republicanism asks: "Given this mechanism, what *could* happen, and what does that possibility do to my status?"
  There is no variable in a standard mechanism design model that registers "fear" or "status degradation" derived purely from the existence of a discretionary node in the game tree, *unless* that fear alters the Agent's payoff function *ex ante*. If the Agent is perfectly rational and knows the Principal's incentives, the *capacity* for arbitrary interference should not affect the Agent's behavior if the interference is not credible. Republicanism insists it does. Mechanism design has no vocabulary for "unfreedom without interference" unless it manifests as a distortion in the *ex ante* investment incentives.

  ---

  ### III. Residue Report

  The untranslatable elements reveal a structural incommensurability between the **modal ontology** of political philosophy and the **equilibrium ontology** of mechanism design.

  #### 1. The Deficiency of Mechanism Design (The Modal Blindspot)
  Mechanism design suffers from a **counterfactual blindspot**. It is designed to predict realized outcomes in equilibrium. It treats the *capacity* for interference as irrelevant if the *incentive* for interference is nullified by IC constraints.
  *   **The Residue:** The Republican claim that "domination is unfreedom even if benign" cannot be expressed in mechanism design without importing an *exogenous* psychological cost function (e.g., "The Agent gets negative utility simply knowing the Principal has a 'Interfere' button").
  *   **Implication:** This indicates a deficiency in mechanism design's ability to capture **relational goods and bads**. Mechanism design models relationships as transactional exchanges of information and resources. It cannot natively model *status*. Status is a property of the relationship's structure, not its outcome. If mechanism design cannot value the structure independent of the outcome, it cannot fully model republican liberty.

  #### 2. The Collapse of Philosophical Distinctions (The Equilibrium Reality)
  Conversely, the residue may reveal that the philosophical distinctions collapse under rigorous institutional analysis.
  *   **The Residue:** If a Principal has the *capacity* for arbitrary interference but is constrained by *ex ante* rules (Constitution) that make interference too costly (Monitoring/Audit), the equilibrium outcome is identical to a system where the capacity is removed.
  *   **Implication:** From a mechanism design perspective, **credible commitment** is functionally equivalent to **structural incapacity**. If the Principal is rationally constrained not to interfere, the Agent's optimal strategy is the same whether the Principal *can't* interfere or *won't* interfere.
  *   **Philosophical Consequence:** This suggests that the Republican distinction between "non-interference" (Negative) and "non-domination" (Republican) relies on a psychological vulnerability (fear of arbitrariness) that a perfectly rational Agent in a mechanism design model would not exhibit. If the Agent knows the Principal's payoff function, the "arbitrary" capacity is priced in. If the capacity is not credible, it is noise.
  *   **Conclusion:** The residue suggests that republican liberty may depend on **bounded rationality** or **information asymmetry** that mechanism design assumes away. If Agents cannot perfectly verify the Principal's constraints, then the *appearance* of domination matters. But if we assume perfect information (standard in full-information mechanism design), the distinction between Negative and Republican liberty vanishes in the equilibrium.

  #### Final Assessment
  The translation fails to capture Republican Liberty not because Mechanism Design is morally deficient, but because it is **ontologically parsimonious**. It reduces all social facts to constraints, information, and payoffs. Political philosophy, particularly the Republican tradition, posits that **power relations** are social facts independent of their exercise.

  Mechanism design treats the *potential* for interference as a parameter affecting *ex ante* incentives. Republicanism treats the *potential* for interference as a constitutive element of the Agent's identity. The residue is the **irreducibility of status to outcome**. Mechanism design can optimize for freedom-as-outcome (Negative) or freedom-as-capacity (Positive), but it cannot optimize for freedom-as-status (Republican) without treating "status" as a fetishized commodity in the utility function, thereby stripping it of its distinctively political character.
