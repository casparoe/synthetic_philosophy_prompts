  9.  **Final Polish:** Check tone (academic, rigorous, respectful of both disciplines). Ensure the "Residue Report" is the climax of the argument. (Proceed to generate output based on these thoughts).

  *(Self-Correction during final review)*: Wait, I need to be careful with the Republican translation. Pettit emphasizes that domination exists even if the master is benevolent. In MD, a benevolent principal is just a Principal with a utility function correlated with the Agent. I need to make sure the translation captures the *structural capacity* to interfere, not just the *incentive*. The key is *Ex Post Discretionary Authority*. If the Principal has the *technical ability* to override the Agent *ex post* without violating an *ex ante* contract (because the contract was incomplete), that is domination.

