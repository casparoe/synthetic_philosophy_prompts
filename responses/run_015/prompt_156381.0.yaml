          *   **Constraint:** Do not smuggle normative conclusions back in as inefficiencies/market failures. Keep the translation honest. Treat residue as philosophically interesting.

  2.  **Deconstruct the Three Liberties:**
      *   **Negative Liberty (Berlin):** Absence of external impediments/coercion. "Freedom from."
      *   **Positive Liberty (Berlin):** Self-mastery, autonomy, capacity to act. "Freedom to." Often involves resources or rational self-direction.
      *   **Republican Liberty (Pettit/Skinner):** Non-domination. Not just non-interference, but the *absence of the capacity* for arbitrary interference. Status-based.

  3.  **Deconstruct Mechanism Design Vocabulary:**
      *   Principal-Agent Problems.
      *   Incentive Compatibility (IC).
      *   Information Asymmetry (Hidden Action/Type).
      *   Credible Commitment.
      *   Ex Ante (Constitutional) vs. Ex Post (Discretionary).
      *   Monitoring Costs vs. Interference Costs.
      *   Equilibrium outcomes.
      *   Social Choice Functions.

  4.  **Drafting the Translations (Iterative Process):**

      *   *Negative Liberty:* Focus on constraints. In MD, constraints are usually budget sets or feasibility sets. But liberty is about *lack* of interference.
          *   *Translation:* A regime where the Principal's action space is restricted *ex ante*. Low monitoring. High exit options (outside options).
          *   *Architecture:* Minimal contracting. Default rules.
          *   *Fit:* Good fit for "absence of interference."
          *   *Distortion:* Negative liberty is often moral; MD is functional.

      *   *Positive Liberty:* Focus on capacity/autonomy. In MD, this looks like aligning preferences or providing resources to enable action.
          *   *Translation:* A Planner who internalizes the Agent's utility function. Preference alignment. Subsidies/Endowments to expand the feasible set.
          *   *Architecture:* Paternalistic mechanism (soft or hard). Capability approach $\rightarrow$ Budget set expansion.
          *   *Fit:* "Capacity" maps to "Feasible Set."
          *   *Distortion:* Positive liberty is about *self*-mastery. MD often implies an external Planner fixing the Agent's constraints. This risks turning autonomy into heteronomy.

      *   *Republican Liberty:* Focus on non-domination (status). Not just no interference, but no *ability* to interfere arbitrarily.
          *   *Translation:* This is the hard one. It's about counterfactuals. "Even if they don't interfere, they *could*."
          *   *Architecture:* Distributed veto points. Transparent audit trails. Costly interference technology.
          *   *Fit:* "Arbitrary" maps to "Discretionary/Unconstrained."
          *   *Distortion:* MD cares about *equilibrium paths*. If interference doesn't happen in equilibrium, MD often treats the *capacity* as irrelevant unless it affects incentives. Republicanism says the capacity *itself* is the unfreedom.

  5.  **Addressing the "Residue" (The Core Philosophical Conflict):**
      *   Mechanism Design is consequentialist/equilibrium-based. It looks at outcomes (allocations, utilities).
      *   Political Philosophy (especially Republicanism) is often modal/deontological. It looks at statuses, relationships, and counterfactual powers.
      *   *The Clash:* If a Master chooses not to interfere, the Slave is uninterfered with (Negative Liberty satisfied). But the Slave is dominated (Republican Liberty violated). In MD, if the Master's optimal strategy is "Don't Interfere" (due to IC constraints), the outcome is identical to a Free Person. The *status* difference disappears in the outcome data.
      *   *Conclusion:* The residue reveals that MD cannot capture *modal* facts (what *could* happen) unless they are priced into the *ex ante* contract. If the threat isn't credible, MD ignores it. Republicanism says the threat's existence matters regardless of credibility.

  6.  **Refining the Vocabulary (Checking Constraints):**
      *   Avoid calling things "inefficiencies."
      *   Ensure terms like "Principal," "Agent," "IC," "Ex Ante/Ex Post" are used correctly.
