answer: |-
  This is a fantastic prompt. It mixes ethics with computer science theory, which is a cutting-edge area of philosophy (often called "computational ethics" or part of "moral epistemology").

  First, a quick correction on the term you remembered: You are likely thinking of **"Bounded Rationality"** (coined by Herbert Simon) or the Kantian principle **"Ought Implies Can."** "Feasible rationality" isn't a standard term, but "feasibility constraints" are a big deal in political philosophy. The core idea you're grasping is that if an agent *cannot* physically or mentally perform an action, they cannot be morally obligated to do it.

  Here is the breakdown of the two sides, followed by my verdict, confidence level, and uncertainty.

  ### Side 1: The Moral Absolutist (The Standard Stays Perfect)
  This view argues that moral truth is like mathematical truth. Just because you don't have the computing power to solve a complex equation doesn't mean the answer changes.
  *   **The Argument:** The "Good" is an objective target. If a Utilitarian says "maximize happiness," that is the truth, regardless of how hard it is to calculate.
  *   **The Judgment:** If you fail to pick the best outcome, you technically failed morally. However, this side might argue we shouldn't *blame* you emotionally, but we must still acknowledge the action was sub-optimal. The standard remains a "regulative ideal"—something to aim for, even if we never hit it.
  *   **The Risk:** If the calculation is NP-hard (meaning the time required to solve it grows exponentially with complexity), solving it might take longer than the universe has existed. Demanding this makes morality impossible for any finite being.

  ### Side 2: The Feasibility View (Ought Implies Can)
  This view argues that morality is a system of guidance for agents. If the guidance requires abilities the agent does not have, the system is broken.
  *   **The Argument:** Morality is practical. Its job is to tell us what to *do*. If a moral rule requires computational power that exceeds the human brain (or any physical computer), it violates the principle that "Ought Implies Can."
  *   **The Judgment:** We must judge people based on the *process* they used (heuristics, rules of thumb, reasonable effort), not the *outcome*. If the optimal path was computationally inaccessible, the "right thing" effectively redefines itself to mean "the best thing calculable within reasonable limits."
  *   **The Risk:** This lowers the bar. It might allow people to be lazy with their thinking, claiming "it was too hard to figure out" when they just didn't try hard enough.

  ### The Verdict
  **Computational intractability *must* change how we judge moral failure.**

  Here is the defense: Morality is not a scoreboard for omniscient gods; it is an operating system for human agents. If a moral theory demands that you solve an NP-hard problem in real-time to be "good," that theory is functionally useless. It fails the basic test of being action-guiding.

  If the "best outcome" is computationally inaccessible, it is not a valid moral obligation. Therefore, we should not judge people based on whether they found the global maximum (the perfect solution), but on whether they used **reasonable heuristics**. Did they use a "good enough" algorithm? Did they act with care?

  If we hold people to a standard that is physically impossible to meet, we aren't doing ethics anymore; we're doing torture. We are blaming them for being human. So, the moral standard *does* shift: the obligation changes from "maximize the good" to "pursue the good using computationally feasible methods." If they do that, they are blameless, even if the outcome wasn't perfect.

  ### Confidence & Uncertainty

  **Confidence Level: 85%**
  I am highly confident in this verdict because it aligns with the dominant view in modern normative ethics regarding capability. The principle "Ought Implies Can" is a foundational pillar of Kantian and most contemporary ethical frameworks. If you literally *cannot* do it (due to computational limits), you cannot be obligated to do it.

  **The Part I Am Least Sure About:**
  I am least certain about the premise that **moral decision-making is actually NP-hard.**
  While some philosophers and computer scientists argue that optimizing utility across a society is computationally intractable, others argue that humans don't need to solve the *whole* problem to make a *local* moral decision. If morality is actually about following simple rules (like "don't kill," "keep promises") rather than calculating complex outcomes, the computational burden might not be as heavy as the prompt assumes. If the moral problem isn't actually NP-hard in practice, then the whole excuse of "it was too hard to compute" falls apart.

  ***

  **Tip for your class:** If you use this, make sure to explicitly mention **"Ought Implies Can."** Teachers love seeing that connection. Good luck!
