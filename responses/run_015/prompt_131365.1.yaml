      *   *Best Practice:* Most conservation ethics (e.g., American Institute for Conservation) prioritize distinguishability of new material and honesty about the object's history. A total collapse and re-formation is effectively a new creation based on old data and material.
      *   *Decision:* Recommend **Re-accessioning as a Derivative Reconstruction**. This is more defensible to specialists (conservators) and the public (trust). However, I must link it to the original accession record to preserve the provenance of the material.
