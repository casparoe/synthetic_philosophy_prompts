answer: |-
  # The Geometry of Meaning: A Defense of Moderate Realism in Mechanistic Interpretability

  The question of whether large language models (LLMs) "understand" is often stalled by semantic ambiguity. But as you have identified, the deeper bottleneck is metaphysical. When interpretability researchers use sparse autoencoders (SAEs) to isolate a "feature"—a direction in activation space that correlates with a concept like "French language" or "deception"—are they mapping a pre-existing territory, or are they drawing maps onto a featureless void?

  Your friend's confidence represents the **Realist** position: features are genuine structural elements of the model, akin to neurons in a biological brain. Your hesitation aligns with the **Instrumentalist** position: features are convenient projections, artifacts of the mathematical basis we choose to describe a system that is, at its core, just matrix multiplication.

  The Instrumentalist's strongest weapon is the **Change of Basis objection**. In a purely linear network, one can rotate the internal vector space arbitrarily without changing the input-output function. If the mathematics allows infinite equivalent descriptions, on what grounds do we claim one description captures the "real" features? Furthermore, since SAEs explicitly optimize for **sparsity**, aren't we simply forcing the model to look like a collection of discrete features because that is how humans prefer to think?

  This essay argues that while strict basis-independence is mathematically untenable, a **Moderate Realism** is defensible. The features discovered by interpretability tools are not Platonic forms existing independently of the system, but they are also not arbitrary human impositions. They are *architecturally constrained stable states*. The non-linearities of the network and the statistical structure of the data break the rotational symmetry that the Instrumentalist relies on, granting certain bases a privileged status that justifies the label "real."

  ### The Instrumentalist Challenge: The Void of Linear Algebra

  To understand the force of the Instrumentalist objection, one must appreciate the mathematical freedom inherent in neural networks. Consider a simple linear layer where an input vector $x$ is transformed by a weight matrix $W$ to produce an output $y$. Mathematically, $y = Wx$.

  However, we can insert an invertible matrix $A$ and its inverse $A^{-1}$ into this equation without changing the result: $y = (WA^{-1})(Ax)$. Here, $Ax$ represents the internal activations in a new basis. From the perspective of the input-output function, the internal representation is completely opaque. We could rotate the activation space by 45 degrees, and the model would perform identically.

  If the internal states are rotationally invariant, then claiming that a specific direction corresponds to "French" seems metaphysically unjustified. It implies that the "Frenchness" is not in the model, but in the lens we hold up to it.

  This objection is compounded by the design of Sparse Autoencoders. An SAE attempts to reconstruct the model's activations using a larger set of features, penalizing the number of active features at any given time (the L1 penalty). The Instrumentalist argues: "You told the algorithm to find sparse, human-interpretable directions. Of course it found them. You baked the conclusion into the prior." If sparsity is a human preference for cognitive economy, then finding sparse features tells us more about the researcher than the model.

  ### The Realist Rebuttal: Non-Linearity Breaks Symmetry

  The Realist's primary counter-argument is that the Change of Basis objection relies on a false premise: it assumes the network is linear. LLMs are not. They are built from layers of linear transformations interleaved with non-linear activation functions, most commonly ReLUs (Rectified Linear Units) or GeLUs.

  Non-linearities break rotational symmetry. A ReLU function sets all negative values to zero ($\max(0, x)$). This operation is *not* invariant to rotation. If you rotate the activation space, the pattern of which neurons are zeroed out changes fundamentally. Consequently, the specific geometry of the activation space matters. There are certain directions in the high-dimensional space that, when passed through the non-linearity, preserve information more efficiently than others.

  This leads to the phenomenon of **superposition**. Research suggests that models pack more features into fewer dimensions than there are neurons available. To do this, the model represents features in non-orthogonal directions. However, these directions are not arbitrary. They are constrained by the requirement that the features must not interfere with each other destructively when passed through the non-linearity.

  When an SAE finds a feature, it is effectively disentangling these superimposed signals. The Realist argues that if features were merely arbitrary projections, disentanglement would not yield features that are robustly monosemantic (representing one concept). The fact that SAEs consistently find features that generalize across contexts suggests they are recovering the underlying "codes" the model uses to manage superposition. The basis is not independent of the mathematics, but it is fixed *by* the mathematics of the non-linearities, not by the researcher.

  ### The Sparsity Prior: Imposition or Discovery?

  The second pillar of the Instrumentalist critique is the sparsity prior. Is sparsity a human bias imposed on the model? The Moderate Realist responds that sparsity is likely a bias shared by both the researcher and the training process.

  Natural language and the concepts it describes are inherently sparse. In any given context, only a tiny fraction of all possible concepts are relevant. When you say "The cat sat on the mat," you are not activating concepts related to "quantum mechanics" or "18th-century French poetry." For a model to predict the next token efficiently, it is computationally advantageous to represent the world in a sparse basis.

  Gradient descent, the algorithm used to train LLMs, tends to converge on solutions that minimize loss while implicitly minimizing complexity (a phenomenon known as implicit regularization). Therefore, the model is likely *already* attempting to find a sparse representation of the data during training. The SAE does not impose sparsity from the outside; it acts as a microscope tuned to the frequency of sparsity that the model itself utilized to learn.

  If the model were using a dense, distributed code where every concept was smeared equally across every neuron, an SAE would fail to find interpretable features, or the features would not be causally efficacious. The success of SAEs suggests that the model's internal prior and the interpretability tool's prior are aligned because they are both responding to the statistical structure of the data.

  ### Causal Efficacy and Robustness

  Ultimately, the strongest argument for realism is pragmatic and causal. In science, we often deem an entity "real" if manipulating it produces predictable changes in the system.

  Recent interpretability work has moved beyond observation to intervention. Researchers have successfully taken specific features identified by SAEs (e.g., a "truthfulness" feature or a "topic" feature) and ablated them or amplified them. When they do this, the model's behavior shifts in predictable ways. If I amplify the "French" feature, the model is more likely to generate French text, even in contexts where it wasn't explicitly prompted to do so.

  If features were merely descriptive artifacts—like constellations drawn between stars—manipulating them would not causally influence the system. You cannot change the weather by drawing lines on a map. The fact that these features possess **causal power** suggests they correspond to functional levers within the network's computation.

  Furthermore, these features show **robustness**. Different initialization seeds, different SAE architectures, and different training subsets often converge on similar features. If the features were purely artifacts of the basis choice, we would expect high variance in what is discovered. Instead, we see a convergence on a "vocabulary" of features that appears stable across different methodological choices.

  ### Conclusion: Toward Architectural Realism

  So, is the Realist right? The answer requires refining what we mean by "real."

  If "real" means "basis-independent in the strict linear algebra sense," the Realist loses. There is no God's-eye view of the vector space that privileges one orthogonal basis over another without reference to the activation function. The Instrumentalist is correct that the mathematics allows for infinite descriptions.

  However, if "real" means "a stable, causally efficacious structure determined by the interaction of the model's architecture and the data distribution," the Realist wins. The non-linearities of the network break the rotational symmetry that plagues the linear objection. The sparsity prior is not merely a human imposition but a reflection of the efficiency constraints the model itself solved during training. The causal success of interventions confirms that these features are functional components of the machinery, not just labels on the box.

  Therefore, the realism thesis is defensible, provided it is understood as **Architectural Realism**. The features are not floating abstractions; they are properties of the specific physical (or digital) system implementing the computation. They are real in the same way that "vortices" are real in a fluid dynamics simulation. You can describe the fluid using different coordinate systems, but the vortices are stable structures that emerge from the equations of motion and the boundary conditions.

  Your friend's confidence is justified, but it rests on the specific architecture of modern transformers, not on abstract vector space theory. The features are real because the model's non-linearities make them so. We are not merely describing the soup; we have found the ladles the model uses to serve it.
