  7.  **Final Polish:** (Writing the essay with attention to flow and transitions.) *Make sure to emphasize that the "change of basis" objection holds for linear networks but fails for non-linear ones, which is the pivot point for the realist.*

  *(Self-Correction during drafting)*: I should be careful not to say SAEs are perfect. They are lossy. The realism claim is about the *existence* of the features, not the perfection of the tool.

