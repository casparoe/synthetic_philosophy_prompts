      **The Question**
      The central question of this dissertation is not whether John Stuart Mill became a socialist, but what normative status he assigned to socialism in his mature thought. Standard inquiry asks for a binary verdict on Mill's allegiance. This project proposes that "socialism" in Mill's work functions in three distinct modes: as a *prediction* that cooperative production will eventually out-compete wage labour once workers are educated; as a *prescription* that justice or the general interest requires cooperative ownership regardless of empirical trends; and as a *permission*, wherein socialism is defended merely as one experiment in living among others, currently foreclosed by unfair legal privileges afforded to capitalism. The research question is precise: Does Mill's mature political economy commit him to socialism as a moral imperative (Prescription), or only as a probable outcome (Prediction) and a permissible option (Permission)? Resolving this determines whether Mill's late thought represents a substantive shift in his theory of justice or merely a refinement of his liberal experimentalism. The crux lies in his treatment of the incentive objection: if Mill believes cooperation secures labour effort without legal compulsion, does he argue we *must* adopt it to be just, or only that we *may* adopt it to see if it works better?

      **Why the Standard Readings Leave It Open**
      The existing scholarship divides into rupture and continuity readings. The rupture reading argues Mill abandoned the liberalism of *On Liberty* for socialism late in life. To succeed, this view must establish that Mill adopted socialism as a Prescription, overriding prior liberal commitments. The continuity reading argues Mill's socialism was always implicit in his individualism. To succeed, it must show socialism is the唯一 logical extension of liberty. Both readings fail because they assume "socialism" names a single, univocal position that Mill either held or rejected. They leave open the possibility that Mill held a hybrid view incompatible with both narratives. If Mill supports socialism only as a Permission, the rupture reading exaggerates the break, since experimentalism is core to his liberalism. If he supports it only as a Prediction, the continuity reading overstates the moral necessity, since empirical forecasts do not entail moral duties. By treating socialism as monolithic, both camps miss the nuance of Mill's actual commitments. Consequently, the debate remains stalled: proponents of continuity cite Mill's liberal defenses of competition, while proponents of rupture cite his critiques of wage labour. Neither addresses whether Mill viewed cooperation as a requirement of justice or merely a viable competitor in the marketplace of lifestyles. This project closes that gap by disaggregating the concept.

      **Method and Its Alternatives**
      The method will be conceptual reconstruction focused on argumentative structure rather than genetic history. I will primarily analyze the later editions of the *Principles of Political Economy*, the posthumous *Chapters on Socialism*, and relevant letters. The task is to isolate passages where Mill discusses socialism and categorize the supporting arguments as empirical (Prediction), deontological (Prescription), or liberal-perfectarian (Permission). This approach is superior to tracing revisions across successive editions of the *Principles*. While textual revision shows *when* views changed, it does not clarify the *logical status* of those views. A change in wording might reflect rhetorical caution rather than a shift from Permission to Prescription. Similarly, reconstructing the influence of Harriet Taylor explains the causation of Mill's sympathy but not its justification. Knowing Mill adopted views due to Taylor does not tell us whether he believed those views were morally required or merely permissible. My method focuses on the reasons Mill gives, not the biographical source of those reasons. By reconstructing his answer to the incentive objection, I can determine if he relies on claims about human nature (Prediction) or claims about rights (Prescription). This philosophical analysis allows for a determinate answer to the normative status question, avoiding the indeterminacy of intellectual biography.

      **Possible Conclusions**
      There are three primary conclusions. First, Mill commits to Prescription. This would validate the rupture reading, implying Mill believed justice requires abolishing wage labour. Textual evidence would include explicit claims that wage labour is inherently unjust, not merely inefficient. Second, Mill commits only to Prediction and Permission. This supports the "thin socialism" hypothesis. Evidence would show Mill defending co-ops as better suited to human improvement but refusing to mandate them, emphasizing voluntary association and competition between systems. Third, Mill is inconsistent, shifting between these modes without resolution. The deciding factor is the incentive objection. If Mill argues cooperation solves incentives because it aligns with human psychology, he leans toward Prediction. If he argues it solves incentives because it respects human dignity regardless of productivity, he leans toward Prescription. If he argues we should allow co-ops to test this claim against wages, he leans toward Permission. A useful deliverable is a reclassification of Mill's political economy that separates his empirical expectations from his normative commitments, clarifying his position for contemporary liberal-socialist debates.

      **Failure Conditions**
      The project fails if the threefold distinction proves to be merely verbal, redescribing the old dispute without generating new interpretive leverage. I will know this has occurred if the textual evidence for Prediction and Permission inevitably collapses into Prescription upon close reading. For instance, if Mill's argument for permitting socialism relies on the claim that justice requires it, the distinction between Permission and Prescription dissolves. Similarly, if his prediction that co-ops will out-compete wages is grounded in a moral necessity rather than empirical trends, Prediction collapses into Prescription. Another failure condition is if the "thin" socialism conclusion turns out to be indistinguishable from the standard continuity reading. If supporting Permission is logically equivalent to supporting continuity in Mill's framework, the triad adds no value. To succeed, the categories must be mutually exclusive in Mill's text, allowing me to show he accepts some while rejecting others. If I cannot find passages where Mill explicitly rejects Prescription while affirming Permission, the hypothesis is unsupported.

      **Scope for Twelve Months**
      The twelve-month fellowship will be divided into three phases. Months one to three will focus on close reading and coding the primary texts according to the three categories. Months four to eight will involve drafting the dissertation chapters, focusing on the incentive objection as the central case study. Months nine to twelve will be dedicated to revision and integration of secondary literature. The final deliverable is a 25,000-word dissertation providing a definitive account of Mill's normative commitment to socialism. This scope is feasible given the bounded corpus of Mill's mature political writings. The project offers a clear contribution: moving beyond the binary of conversion versus consistency to a nuanced understanding of Mill's late liberal socialism.

