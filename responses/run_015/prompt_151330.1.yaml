answer: |-
  **RFC: Semantics of Embedded Moral Judgment Constructs**

  **Summary**
  This document proposes a resolution to the "Embedded Stance" defect identified in the policy engine's rule language. Currently, the `wrong!()` construct functions as a statement-level side effect that records a negative stance in the global commitment register. However, when embedded within control flow (conditionals, loops) or logical operators, the construct fails to trigger the side effect while remaining syntactically valid. This creates a semantic gap where inference chains appear valid but lack underlying state changes. We evaluate three remediation paths: promoting the construct to a boolean expression, desugaring embedded occurrences to state checks, or enforcing a strict statement/expression type separation.

  **Motivation**
  The bug was filed after observing that `wrong!(stealing)` correctly updates the policy stance when executed at the top level. However, in the snippet `if wrong!(stealing) { penalize() }`, no stance is recorded regardless of the condition's evaluation. Furthermore, in `if wrong!(stealing) { wrong!(lying) }`, the inference that lying is wrong contingent on stealing being wrong cannot be validated by the engine. The current implementation treats embedded occurrences as no-ops. This violates the principle of compositionality: the meaning of a compound rule should depend on the meanings of its parts. Currently, the embedded parts contribute nothing to the commitment store, yet engineers reason about them as if they do.

  **Guide-level Explanation**
  Developers use `wrong!()` to declare policy violations. Under this proposal, developers must understand that `wrong!()` is not a query about the world, but a command to the engine. When used inside an `if` statement, the engine cannot execute the command conditionally without knowing the condition's truth value. Therefore, usage patterns must shift. Either `wrong!()` must return a value usable in conditions, or conditions must be restructured to check the commitment store explicitly.

  **Reference-level Explanation**
  The core issue is type mismatch. `wrong!()` is currently defined as `Unit`, performing a side effect on the `StanceRegister`. Logical operators (`&&`, `||`, `!`) and conditionals require operands of type `Bool`. Allowing `Unit` in these positions currently compiles but yields undefined semantic behavior. To maintain logical validity across embedded contexts, the operand must possess a value that persists outside the immediate execution scope.

  **Alternatives Considered**

  *Option 1: Promote to Boolean (Cognitivist Model)*
  We redefine `wrong!()` to return `true` or `false`. Embedded occurrences become standard boolean expressions.
  *   **Benefit:** Full compositionality. Inference rules work naturally.
  *   **Cost:** This abandons the original design goal. `wrong!()` becomes a description of a fact rather than an expression of policy stance. The engine no longer records attitudes; it checks truth conditions. We lose the ability to distinguish between stating a policy and describing one.

  *Option 2: Desugar to State Checks (Quasi-Realist Model)*
  We keep `wrong!()` as a stance command at the top level. In embedded positions, we desugar `wrong!(X)` to `CommitmentStore.has_stance(X)`.
  *   **Benefit:** Preserves the idea that top-level usage is special (action vs. check). Allows embedding without admitting moral facts exist independently of the store.
  *   **Cost:** This changes the semantics of the embedded sentence. It is no longer expressing an attitude; it is reporting on the state of the attitude store. This raises a consistency question: if `CommitmentStore.has_stance(X)` behaves exactly like a boolean truth condition, have we not simply reintroduced truth-aptitude under a different name? We gain compositional semantics but must explain why the embedded sentence is "correct" if the store is empty, whereas the top-level sentence was merely "issued."

  *Option 3: Dual Semantics (Expressivist Model)*
  We enforce a type error when `wrong!()` is embedded. Engineers must use a separate construct, `is_wrong(X)`, for conditions.
  *   **Benefit:** Honest about the distinction between asserting a stance and reasoning about one.
  *   **Cost:** Fragments the language. It fails to explain why `if wrong!(stealing) then wrong!(lying)` feels valid to users. It also fails in indirect contexts, such as `user.believes(wrong!(stealing))`, where the writer is not asserting the stance nor checking the local store, but reporting another's state.

  **Known Limitations and Unresolved Questions**
  Option 2 risks circularity if the `CommitmentStore` is populated solely by top-level `wrong!()` calls. Additionally, indirect speech contexts remain problematic; reporting that `alice.thinks(wrong!(stealing))` does not commit the engine to the stance, nor does it necessarily check the store. Future work must address similar failures in epistemic modals (`might!(risk)`) and taste predicates (`tasty!(cake)`), which exhibit identical embedding defects.

  **Appendix: Compiler Diagnostics**

  *   **E0401: StanceInConditional**
      *   `error: cannot use stance construct in conditional expression`
      *   `note: no stance was performed and no value was produced`
      *   `help: consider using is_wrong() or moving the construct to the top level`

  *   **E0402: UnassertedJudgment**
      *   `warning: embedded moral judgment contributes no commitment`
      *   `note: inference chain may be valid but engine state remains unchanged`

  ***

  **Afterword**

  This analogy leans on the logical formulation of the Frege-Geach problem: how can moral sentences participate in valid arguments if they lack truth conditions? The RFC treats "validity" as "compiler type safety" and "truth conditions" as "return values." A defender of expressivism would argue the doc misrepresents their view by assuming consistency requires identical semantic content across contexts; they might argue consistency lies in the coherence of attitudes, not compositional truth. The analogy takes liberties by implying a central "StanceRegister" exists; real expressivism posits mental states, not a global store. The falsifier for this framing would be a logical system where validity is preserved without compositional semantics (e.g., substitution classes). If engineers could prove the inference rules work *without* assigning values to embedded expressions, the "bug" is actually a feature, and the RFC's demand for boolean returns is the category error.
