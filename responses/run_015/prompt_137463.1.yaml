answer: |-
  ### Epistemic Legend
  *   **[Textbook]:** Consensus introductory biology / standard MDM practice.
  *   **[Contested]:** Active debate among systematists, philosophers of biology, or data architects.
  *   **[Inference]:** My mapping guess where no direct technical equivalent exists.

  ---

  ### Translation Table: Species Concepts into Entity Resolution (ER) Vocabulary

  | Species Concept | ER Restatement | Distortion / Fudge | Inexpressible in ER Terms |
  | :--- | :--- | :--- | :--- |
  | **Biological (BSC)**<br>*[Textbook]* | **Graph Connectivity.** Nodes = organisms. Edge = viable mating. Species = Connected Component via Transitive Closure. | **Fudge:** Assumes mating is a binary, observable attribute. In ER, we usually infer edges from static attributes, not dynamic events. | **Non-Transitivity.** ER assumes equivalence relations (if A~B and B~C, then A~C). Ring species break this. ER logic crashes or requires arbitrary threshold cuts. |
  | **Ecological (ESC)**<br>*[Contested]* | **Feature-Space Clustering.** Records match if they occupy the same multidimensional "block" (niche parameters). | **Fudge:** Treats niche as static attributes (like `address` or `industry_code`). Niches are dynamic and relational. | **Causal Role.** ER captures *correlation* of attributes, not the *functional role* the entity plays in a system. |
  | **Phylogenetic (PSC)**<br>*[Textbook]* | **Lineage Tracing / Hierarchy.** Match if records share a specific Ancestor ID (Composite Key) not shared with others. | **Fudge:** Assumes a clean tree structure. ER hierarchies are usually manual or inferred from containment, not genetic descent. | **Time Depth.** ER "survivorship" picks the best current record. PSC requires reconstructing the historical path, not just the current state. |
  | **Morphological / Phenetic**<br>*[Textbook]* | **Distance-Based Matching.** Pairwise similarity score on phenotypic vectors. Threshold > *t* implies same cluster. | **Fudge:** Assumes distance metric is uniform. In ER, we weight fields (e.g., SSN > Phone). Biology struggles to weight traits objectively. | **Cryptic Variation.** ER assumes observed attributes reflect the entity. Cryptic species have low attribute distance but high "business rule" divergence. |
  | **Genotypic Cluster**<br>*[Contested]* | **Multimodal Distribution.** Clusters exist where there are gaps in the density distribution of genetic feature space. | **Fudge:** "Gap" detection is threshold tuning. In ER, we admit gaps are arbitrary cut-points in a continuous distribution. | **Process.** ER finds the clusters; it cannot explain *why* the gaps exist (e.g., selection vs. drift) without external metadata. |
  | **Species Monism**<br>*[Contested]* | **Single Golden Record Policy.** One canonical schema and match rule set for all entities globally. | **Fudge:** Implies one "true" customer definition exists. MDM often accepts this as an ideal, even if impractical. | **Utility Context.** Monism ignores that different downstream apps (Billing vs. Marketing) need different granularities. |
  | **Species Pluralism**<br>*[Contested]* | **Context-Dependent Views.** Different match rules/clustering logic for different taxa (domains), keyed to explanatory interest. | **Fudge:** In ER, this is "Schema-on-Read." It looks like engineering pragmatism, not ontological commitment. | **Incommensurability.** Pluralists argue some concepts are *mutually exclusive*, not just different views. ER assumes views can coexist. |
  | **Species as Individuals**<br>*[Philosophical Thesis]* | **Mereological Sum.** The Species ID denotes a specific spatiotemporal whole; organisms are *parts*, not *instances*. | **Fudge:** **Major BREAK.** ER records *denote* entities (1:1 map). ER has no native primitive for "temporal part" or "component." | **Composition.** ER solves coreference (A = B). It does not solve parthood (A ⊂ B). |
  | **Species as Classes**<br>*[Philosophical Thesis]* | **Class Definition.** Species is a schema or type; organisms are member records satisfying the definition. | **Fudge:** Fits ER well (Table: `Organisms`, Column: `Species_ID`). | **Historical Contingency.** Classes are defined by intension (rules). Individuals are defined by extension (history). ER prefers intension. |

  ---

  ### Routing the Hard Cases

  *   **Asexual Groups:** The BSC graph has no edges. In ER terms, your blocking keys return zero candidates. You must fallback to Phenetic or Genotypic clustering (distance-based), admitting the "relationship" logic is inapplicable.
  *   **Prokaryotes (HGT):** Horizontal Gene Transfer turns the lineage tree into a Directed Acyclic Graph (DAG) or mesh. ER hierarchy management usually assumes strict trees (Parent_ID). You would need a graph database where a child record can have multiple Parent_IDs, violating standard surrogate key constraints.
  *   **Ring Species:** Transitive closure over the "can mate" relation merges the whole ring into one Cluster ID. However, the endpoints are not matchable. In ER, this is a **data quality incident**: your match rules violate the equivalence relation assumption. You are forced to introduce an arbitrary cut (threshold) to break the cycle, confirming the pluralist's claim that the boundary is stipulated.
  *   **Fossil Sequences:** Continuous time series. In ER, this is a slowly changing dimension (SCD Type 2) where the change rate exceeds the snapshot frequency. Any "Species ID" change is an arbitrary version bump. There is no natural "cluster" boundary, only administrative cut-points.

  ---

  ### Residue Report

  Your first suspicion is correct: **ER presupposes a realist ground truth.** In MDM, we optimize for Precision and Recall against a "Golden Set." Even if we admit the Golden Set is imperfect, the math assumes a correct state exists. Translating species pluralism into ER makes it sound like "we haven't tuned the thresholds yet," rather than "there is no single correct threshold." To express pluralism honestly, you would need to model **Contextual Match Rules** not as temporary views, but as first-class objects with equal ontological status. You would need to accept that for Taxon A, the "True ID" is defined by Reproductive Isolation, and for Taxon B, it is defined by Morphology, and there is no meta-rule to unify them. This costs you the ability to calculate global Precision/Recall. You can only measure fitness-for-purpose.

  Your second suspicion is the deeper break: **Species-as-Individuals violates the denotation model.** In your work, a `Customer_ID` points to a legal person or household. The records (transactions, contacts) are *evidence* of the customer, or attributes *of* the customer. They are not *parts* of the customer in a mereological sense. If a Species is a historical individual (like a specific war or a specific organism), then an organism is a **temporal part** of that species. ER has no vocabulary for this. We handle `Version_Number` or `Effective_Date`, but we do not model the Entity as a sum of its time-slices. If you adopt the Individual thesis, your `Species_ID` is not a class label (like `Industry_Code`); it is a **Case ID** (like `Claim_Number`), and the organisms are sub-claims. This breaks standard dimensional modeling.

  **Is this missing piece useful?**
  For a working data modeler: **Mostly no.** You will rarely need to model mereological sums of biological taxa. However, the **Pluralism** translation is highly valuable. It maps directly to **Data Mesh** or **Domain-Driven Design**. The lesson from your friend is that insisting on one "Global Customer ID" across all business units (Monism) may be mathematically elegant but operationally false. Different domains (Billing vs. Risk) may legitimately require different entity resolutions (Classes vs. Individuals, strict vs. fuzzy).

  The biology is not "less clear" than it sounds; it is **ontologically heavier**. ER assumes the world contains objects that persist and have identifiers. Biology suggests some "objects" are processes, some are classes, and some are historical particulars. Your vocabulary breaks not because it is sloppy, but because it is designed for **commerce** (stable contracts, distinct parties), not **nature** (continuous variation, descent with modification).

  *[Uncertainty Flag]:* I am inferring the "Species as Individuals" mapping based on Ghiselin/Hull's philosophical thesis. Many working biologists ignore this and treat species as classes practically. The "Contextual Match Rules" analogy for Pluralism is my own synthesis; I am not certain a philosopher of biology would endorse the reduction, though it captures the functional outcome.
