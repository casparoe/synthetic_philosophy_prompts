      *   *Refining Pluralism:* In MDM, we sometimes have "Contextual Master Data" (e.g., Marketing View vs. Finance View). This is a good analogy for Pluralism.

  8.  **Epistemic Flagging:**

      *   Need to be clear about what is standard biology (BSC is standard but has exceptions), what is contested (Pluralism vs. Monism), and where I am inferring (mapping mereology to ER).
      *   *Biology Check:* BSC is textbook but known to fail for asexuals. PSC is popular in systematics. Species-as-individuals (Ghiselin/Hull) is a specific philosophical thesis, not universal biological practice.
