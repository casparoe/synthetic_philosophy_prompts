      *   Hard cases routed? Yes.
      *   Epistemic flags? Yes.
      *   Tone: Professional, honest, not flattering.

  *(Self-Correction on Epistemic Flags)*: I need to make sure I don't present philosophical positions as biological facts. I will use explicit markers like "[Contested]" or "[Philosophical Thesis]".

