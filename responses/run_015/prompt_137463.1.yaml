      *   *Ring Species:* Transitive closure of "can mate with" yields one cluster, but endpoints cannot mate. Violates equivalence relation assumptions.
      *   *Fossils:* Continuous time series. Arbitrary cut-points (threshold tuning).

  5.  **Address User Suspicions:**

      *   *Suspicion 1 (Ground Truth):* ER assumes a "True Entity" exists to measure Precision/Recall against. Biology often denies this.
      *   *Suspicion 2 (Individuals vs. Classes):* ER records *denote* entities. Organisms are *parts* of species. If Species is an Individual, organisms are temporal parts. ER doesn't handle "temporal parts" well; it handles "versions" of a record.

