  2.  **Deconstruct the Species Concepts into ER Terms:**

      *   *Biological Species Concept (BSC):* Interbreeding/reproductive isolation.
          *   ER Translation: Match rule based on connectivity in a graph where edges = successful mating. Transitive closure defines the cluster.
          *   Issue: Transitivity fails (ring species). Asexuals have no edges.
      *   *Ecological Species Concept (ESC):* Niche occupation.
          *   ER Translation: Clustering based on feature vectors representing environmental parameters/role. Records match if they occupy the same "block" in feature space.
          *   Issue: Niche is dynamic/hard to measure.
      *   *Phylogenetic Species Concept (PSC):* Monophyline/smallest diagnosable cluster.
          *   ER Translation: Hierarchy construction. Match if they share a specific common ancestor node not shared with others. Diagnosability = unique attribute combination (composite key).
          *   Issue: Depends on tree resolution.
      *   *Morphological/Phenetic:* Overall similarity.
          *   ER Translation: Distance-based clustering (K-means, hierarchical) on phenotypic attributes. Threshold-based matching.
          *   Issue: Cryptic species (low distance, different biology), phenotypic plasticity (high distance, same biology).
      *   *Genotypic Cluster:* Gaps in genotype space.
          *   ER Translation: Multimodal distribution in genetic feature space. Blocking keys based on loci.
          *   Issue: Defining the "gap" threshold.

  3.  **Deconstruct Background Disputes:**

      *   *Monism vs. Pluralism:* One true schema vs. multiple schemas based on use case.
          *   ER Translation: Single Golden Record Policy vs. Context-dependent Views/Schema-on-Read.
      *   *Individuals vs. Classes:* Species as concrete historical particulars vs. abstract sets.
          *   ER Translation: Entity as a specific instance (like a specific merger event) vs. Entity as a class definition (like a Customer Type). *Crucial Point:* In ER, a "Customer" record usually denotes a specific legal entity (Individual) or a household (Class-like). The user's suspicion is key here.

  4.  **Address the Hard Cases:**

      *   *Asexuals:* BSC graph has no edges.
