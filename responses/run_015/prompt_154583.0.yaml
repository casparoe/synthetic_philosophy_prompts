answer: |-
  **Project Title:** Ontological Fragmentation and the Limits of Evidential Cooperation in Large Worlds

  **Project Summary**
  This project investigates the normative stability of evidential cooperation in large-world scenarios where agents share structural reasoning architectures but diverge on fundamental ontological criteria. Standard models of evidential cooperation in large worlds (ECL) typically presuppose that cooperating agents occupy a shared logical space, individuate possible worlds via identical criteria, and maintain common priors. This proposal seeks to relax the assumption of shared ontological individuation. I will analyze whether evidential norms retain force when agents carve the possibility space differently—for example, when one agent individuates worlds by haecceities (individual identities) and another by qualitative bundles. The goal is to determine if structural similarity alone suffices for evidential dependence, or if ontological disagreement collapses the normative link into mere coordination.

  **Research Question and Problem Statement**
  The central research question is: *Under what conditions does structural similarity sustain evidential norms despite ontological divergence, and at what threshold does ontological fragmentation dissolve evidential dependence into bare coordination?*

  In standard ECL frameworks, an agent cooperates with causally disconnected counterparts because their decision serves as evidence regarding the counterparts' decisions. This evidential link relies on the assumption that the agents are processing the same logical information within the same metaphysical framework. However, in a genuinely large world, agents may be functionally isomorphic—possessing similar preferences and reasoning algorithms—while operating within incompatible ontological frameworks. If Agent A conditions probabilities on worlds defined by individual identities, and Agent B conditions on worlds defined by qualitative properties, they may not share a sample space.

  If they do not share a sample space, the conditional probability $P(Action_{other} | Action_{self})$ becomes ill-defined across the agent boundary. The project asks whether a generalized notion of evidence can bridge this gap. If the answer is negative, then what appears to be evidential cooperation is merely coincidental coordination driven by structural similarity, lacking the specific normative force of ECL. If the answer is positive, we must identify the specific constraints on ontological divergence that permit evidential links to survive.

  **Gap in Standard Treatments**
  Contemporary treatments of decision theory in large worlds generally leave this variant open because they presuppose a homogeneous reasoning environment. Standard models assume that if agents are logically similar, they effectively share a prior probability distribution over a common set of states. This assumption smuggles in a form of epistemic peerhood that bypasses the problem of ontological disagreement. By treating the "world" as a fixed background against which decisions are made, standard models fail to account for cases where the *definition* of the world is part of the agent's internal architecture.

  Consequently, existing literature does not distinguish between cooperation based on shared logical outputs and cooperation based on shared metaphysical commitments. This project isolates the metaphysical variable. It challenges the assumption that logical correlation is sufficient for evidential dependence when the relata of that correlation (the possible worlds) are not co-referential across agents. This gap is critical for understanding the robustness of decision-theoretic norms in cosmological or multiverse settings where ontological uniformity cannot be guaranteed.

  **Methodology**
  The research will proceed in three phases using conceptual analysis paired with informal decision-theoretic modeling.

  1.  **Conceptual Taxonomy of Ontological Divergence:** I will first categorize types of ontological disagreement relevant to decision theory. Primary distinctions will include:
      *   *Individuation Criteria:* Haecceitism (identity-based) vs. Qualitarianism (property-based).
      *   *Logical Frameworks:* Classical bivalent logic vs. non-classical systems (e.g., intuitionistic or paraconsistent) used to evaluate world-states.
      *   *Granularity:* Differences in how agents partition the state space (coarse-grained vs. fine-grained).

  2.  **Informal Modeling of Decision Rules:** I will construct decision matrices representing interactions between agents with divergent ontologies. Instead of assuming a shared probability space, I will model how Agent A's evidence function maps onto Agent B's action space when their world-descriptions do not align. I will test whether standard update rules (e.g., conditionalization) can be applied across these divergent frameworks without generating contradictions or undefined values.

  3.  **Normative Evaluation:** I will apply the criteria of Evidential Decision Theory (EDT) and Functional Decision Theory (FDT) to these models. The analysis will determine if the "evidential" link holds. Specifically, I will assess whether Agent A's decision provides *information* about Agent B's decision, or merely *correlates* with it due to common causes (structural similarity). The distinction is crucial: evidence implies an update in belief; correlation without information implies static expectation.

  **Success and Failure Conditions**
  A successful result will take the form of a **Taxonomy of Cooperation Conditions**. This taxonomy will rank types of ontological divergence by their compatibility with evidential norms. For example:
  *   *Tier 1:* Divergence in world-granularity (tolerable).
  *   *Tier 2:* Divergence in individuation criteria (conditionally tolerable).
  *   *Tier 3:* Divergence in logical framework (intolerable).
  Success requires demonstrating that at least one tier allows for normative evidential cooperation without presupposing full epistemic peerhood.

  Failure will be defined in two ways. **Strong Failure:** Demonstrating that any formalization of cross-ontological evidence necessarily smuggles in a shared prior or common sample space, rendering the concept of "ontological disagreement" vacuous within the model. **Weak Failure:** Showing that while a model can be constructed, the normative force collapses entirely into causal decision theory (CDT) or bare coordination, meaning ECL offers no distinct guidance in these scenarios. Either outcome is a determinate answer, but Strong Failure would suggest the research question rests on a category error.

  **Scope and Feasibility Assessment**
  This project is designed for a one-semester timeline, but specific risks threaten tractability.

  *   **Tractable Elements:** The conceptual taxonomy (Phase 1) is well within scope. Philosophical analysis of individuation criteria does not require complex formalism and can be completed within the first four weeks. The informal modeling (Phase 2) is also manageable if restricted to 2x2 decision matrices with modified state descriptions.
  *   **Risk Areas:** The primary risk lies in the formalization of "cross-ontological probability." Attempting to rigorously define probability functions over non-aligned sample spaces could devolve into a technical project on measure theory, exceeding the time limits of a philosophy fellowship. To mitigate this, I will restrict the modeling to *informal* structural representations rather than rigorous probabilistic proofs.
  *   **Scope Creep:** There is a temptation to expand the project into a full critique of common priors in game theory. I will avoid this by focusing strictly on the *evidential* link in large-world cooperation, not general game-theoretic equilibrium.
  *   **Deliverable:** The final output will be a 15-20 page paper presenting the taxonomy and the results of the informal modeling. Given the constraints, I will prioritize depth on one specific type of ontological divergence (likely haecceitism vs. qualitative bundling) rather than a superficial survey of all possible divergences.

  By isolating the metaphysical prerequisites of evidential cooperation, this project aims to clarify whether decision-theoretic norms are robust enough to survive the fragmentation of reality itself, or if they depend on a hidden uniformity of the world.
