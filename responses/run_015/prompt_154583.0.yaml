  I am applying for a one-semester independent study fellowship in philosophy of decision theory and need a two-page research proposal. The topic is evidential cooperation in large worlds, but I want to avoid the well-worn framing that simply asks whether an agent should take an action because it provides evidence about causally disconnected copies. Instead, I want to investigate a more specific variant: in a genuinely large-world setting, there may exist agents who are structurally similar to me—similar reasoning architecture, similar preferences—yet they are not epistemic peers in any robust sense, because they individuate possible worlds by different ontological criteria (for instance, by qualitative properties rather than by individual identities) or they operate within different logical frameworks. The precise question is whether evidential cooperation retains normative force when we replace the standard peerhood assumption with a weaker condition of structural similarity coupled with ontological disagreement, or whether cooperation collapses into something more like bare coordination without shared evidential status. The proposal should state this question with sufficient precision that it has a determinate answer, explain why standard treatments—which generally presuppose shared priors and homogeneous reasoning—leave this variant open, outline the method (conceptual analysis of peerhood conditions paired with informal modeling of decision rules under ontological fragmentation), specify what a successful result would look like (for example, a taxonomy of cooperation conditions ranked by how much ontological divergence they can tolerate), and identify what would count as failure (e.g., showing that the weakened condition cannot be formalized without smuggling peerhood back in). It should also include an honest scope assessment: is this tractable in one semester, and which parts are most likely to expand beyond the available time? Please do not include a bibliography, citation list, or literature review by reference; I will supply citations myself. The deliverable should be a plan for work not yet done, not a defense of a predetermined conclusion.
