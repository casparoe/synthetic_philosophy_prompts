  **Node 1: Primary Moral Metric**
  Is the moral permissibility of the bombings determined *solely* by whether they resulted in a net reduction of total human suffering compared to the plausible alternatives (e.g., land invasion, prolonged blockade)?
  *   **Yes:** Proceed to Node 2.
  *   **No:** Proceed to Node 3.

  **Node 2: Consequentialist Calibration**
  Does the calculation of "net reduction" include only immediate military and civilian casualties, or does it weigh long-term geopolitical stability (e.g., nuclear deterrence, Soviet relations) as an equal moral good?
  *   **Immediate Casualties Only:** **Act-Consequentialist Justification**.
  *   **Geopolitical Stability Included:** **Strategic-Consequentialist Justification**.
      *   *Flag:* These leaves are not genuinely separable by this tree; both reduce morality to aggregate outcomes, differing only in temporal scope.

  **Node 3: The Intentionality Constraint**
  Is there any condition (e.g., "Supreme Emergency") under which the *intentional* targeting of non-combatants becomes permissible?
  *   **Yes:** Proceed to Node 4.
  *   **No:** Proceed to Node 5.

  **Node 4: Supreme Emergency Scope**
  Does this exception apply only when the threat is to the existence of the political community itself, or whenever the net saving of life is sufficiently large?
  *   **Existence of Political Community:** **Supreme Emergency Exception**.
  *   **Net Saving of Life:** **Unnamed**: *Allows intentional killing of innocents whenever the body count favors it, effectively collapsing back into the Consequentialist branch (Node 2).*

  **Node 5: The Doctrine of Double Effect**
  Does the doctrine of double effect permit the destruction of a military-industrial center embedded in a civilian population if civilian death is foreseen but not the intended means of victory?
  *   **Yes:** Proceed to Node 6.
  *   **No:** Proceed to Node 7.

  **Node 6: Proportionality Constraint**
  Does the requirement of proportionality apply strictly between the *intended* military advantage and the *unintended* civilian harm, or broadly between total good and total bad effects?
  *   **Intended vs. Unintended:** **Strict Double Effect**.
  *   **Total vs. Total:** **Proportionalist Double Effect**.

  **Node 7: Basis of Immunity**
  Is the immunity of civilians based on their *individual moral innocence* or on their *structural function* within the war economy?
  *   **Individual Moral Innocence:** **Absolute Innocence Protection** (Anscombe's position).
  *   **Structural Function:** Proceed to Node 8.

  **Node 8: Structural Complicity (Required Distinction)**
  Does participation in the industrial war economy (e.g., munitions factory work) render a civilian structurally complicit enough to lose immunity from *direct* attack?
  *   **Yes:** **Unnamed**: *Permits direct targeting of industrial laborers while maintaining immunity for non-industrial civilians, creating a gradient of liability based on economic proximity to weaponry.*
  *   **No:** **Collective Immunity Absolutism**.
      *   *Note:* This distinction opens a genuinely occupied logical space, though it is rarely explicitly defended in standard Just War literature, which typically defaults to Individual Moral Innocence (Node 7).
