      *   *Refinement on the "Knockout":* The "Institutional Robustness" (Third-party capacity) is usually the one that kills Dignity arguments in failed states and Honor arguments in complex societies. But "Error Management" is deeper. Let's go with "Error Management" because it addresses the *moral cost* of the system's operation directly. Actually, the user hinted at "Third-party capacity." Let's stick with that as the practical knockout, but "Neutrality of Metric" as the philosophical knockout. Let's choose **Institutional Robustness** as the practical one because it exposes the fragility of Dignity/Victimhood when institutions rot.

      *Wait, re-reading the prompt:* "say which single requirement does the most work in knocking out the answers people give off the cuff."
      *Off-the-cuff answers* usually assume Dignity is best because "violence is bad." The requirement that knocks this out is **Contextual Fit / Institutional Robustness**. It shows Dignity is *contingent* on strong states.
