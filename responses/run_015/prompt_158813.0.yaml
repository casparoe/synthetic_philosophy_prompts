      *Decision:* I will argue that **The Non-Begging Metric (Neutrality of Evaluation)** is the philosophical knockout, but **Institutional Robustness** is the empirical knockout. I'll pick **Institutional Robustness** for the "single requirement" slot because it's more concrete for a journalist.

