answer: |-
  There is no single, canonical "-ism" in the literature that perfectly captures this specific hybrid position, though it is a recognized and increasingly discussed tension in the philosophy of computer-assisted mathematics. The position you are describing sits at a friction point between **Neo-Formalism**, **Structuralism**, and **Constructivism**, modified by the specific epistemic authority granted to the proof assistant.

  However, based on recent discourse in the philosophy of mathematics (particularly work surrounding the *QED Manifesto*, Homotopy Type Theory, and the epistemology of formal libraries), the most precise established label for the *family* of views you describe is **Computational Structuralism**.

  Yet, Computational Structuralism doesn't fully capture the specific ontological weight you noted: the claim that *machine-checkability itself* confers a kind of mind-independent reality. For your reading group notes, I recommend distinguishing this specific move as **Verificationist Realism** (or **Mechanized Realism**).

  Here is a breakdown of how this position relates to traditional views, why existing terms fall short, and how to sharply boundary it for your discussion.

  ### 1. The Closest Established Terms

  **Computational Structuralism**
  *   **The View:** Mathematical objects are positions in structures, but these structures are defined and constrained by their computability and formalizability.
  *   **Why it fits:** It captures the "construction" aspect (structures must be built/encoded) and the "discovery" aspect (once built, the structural relations are fixed and independent of the builder).
  *   **Why it falls short:** Traditional structuralism (e.g., Shapiro, Resnik) does not necessarily privilege *machine* verification. One can be a structuralist and accept informal proofs. Your observation is specifically about the *machine* granting ontological status.

  **Neo-Formalism**
  *   **The View:** Mathematics is the study of formal systems, but these systems are not meaningless marks (as in Hilbert's classical Formalism); they are studied for their structural properties.
  *   **Why it fits:** It accounts for the emphasis on encoding, libraries, and definitional choices.
  *   **Why it falls short:** Neo-Formalism usually treats the formal system as a tool for studying structure, not necessarily as the *source* of the object's reality. It lacks the "transparent window" claim you identified.

  **Naturalized Platonism (Maddy)**
  *   **The View:** Mathematical objects are abstract, but our access to them is akin to scientific perception, grounded in physical/cognitive reality.
  *   **Why it fits:** It treats the computer as a scientific instrument extending our "perception" of the mathematical realm.
  *   **Why it falls short:** It still posits a pre-existing realm. Your description suggests the object might *owe its existence* to the formalization ("manufactures a precisely delimited artifact"), which leans away from pure Platonism.

  ### 2. Proposed Terminology: Verificationist Realism

  Since the specific move you identified relies on **machine-checkability** as the ontological ground, I propose using **Verificationist Realism** for your notes. This distinguishes it from classical Verificationism (which is usually anti-realist about truth) by noting that here, the *ability to verify* is what constitutes the *reality* of the object.

  **The Core Claim:** A mathematical object exists (has ontological weight) if and only if it can be instantiated within a trusted computational kernel. The "independence" comes not from a Platonic heaven, but from the **objectivity of the kernel**. The kernel is small enough to be humanly surveyable (removing bias), yet rigid enough to enforce constraints that feel "discovered" rather than "stipulated."

  ### 3. Sharp Boundaries for Your Reading Group

  To distinguish **Verificationist Realism** from the traditional views you mentioned, you can use the following boundaries:

  | View | Ontological Status of Objects | Role of the Proof/Check | Source of Necessity |
  | :--- | :--- | :--- | :--- |
  | **Classical Platonism** | Pre-existing, mind-independent entities. | Epistemic access only. Proofs reveal what is already true. | The nature of the abstract realm. |
  | **Classical Formalism** | Meaningless symbols manipulated by rules. | Syntactic correctness. No ontological weight. | Rules of the game (stipulated). |
  | **Nominalism** | Artifacts of language/notation. | Social agreement on usage. | Human convention. |
  | **Constructivism** | Mental constructions of the mathematician. | The construction *is* the existence. | Human cognitive activity. |
  | **Verificationist Realism** | **Artifacts with Mind-Independent Behavior.** | **Constitutive.** The check *grants* the object its stability and independence. | **The constraints of the computational kernel.** |

  ### 4. The Philosophical "Slide" Explained

  The tension you noticed (Discovery vs. Construction) is not a bug in this view; it is the feature. It can be understood as a **Digital Kantianism**:

  *   **Construction (The Constructive Slide):** The mathematician must provide the "conditions of possibility" for the object (the definitions, the types, the library dependencies). In this sense, the object is manufactured.
  *   **Discovery (The Platonist Slide):** Once those conditions are encoded in the kernel, the object's behavior is no longer up to the mathematician. The type checker acts as a "view from nowhere"—it is not subject to human cognitive bias, fatigue, or intuition. It reveals consequences of the construction that the constructor did not anticipate.

  **Why this matters for your group:**
  This view shifts the ontology from *what the object is* to *how the object holds together*. In traditional Platonism, a group exists because it participates in the Form of Groupness. In Verificationist Realism, a group exists because it satisfies the interface required by the `Group` typeclass in the library, and that satisfaction is certified by the kernel.

  ### 5. Recommended References for Context

  If you want to ground this in existing literature, look for:
  *   **Jeremy Avigad:** Specifically his work on *The Nature of Formal Proof* and the social/epistemic role of formalization. He discusses how formalization changes the "contract" of mathematical truth.
  *   **Michael Harris:** *Mathematics without Apologies*. He touches on the "social life of proofs" and how computers alter the ontology of the profession.
  *   **The Univalent Foundations Program:** While specific to HoTT, their philosophical introductions often explicitly argue that "equivalence is equality," which is a direct ontological claim derived from formalizability.
  *   **Catherine Stinson:** Work on AI and mathematical discovery, specifically regarding how machine processes create a new kind of "understanding."

  ### Summary for your Notes
  You are observing **Verificationist Realism**. It is distinct from Platonism because the objects depend on the formal framework (construction); it is distinct from Formalism because the framework is treated as revealing necessary truths (discovery); and it is distinct from Nominalism because the "notation" (the code) has causal/explanatory power independent of human interpretation once checked. The "machine independence" is the bridge: the code is a human artifact that behaves like a natural law.
