answer: |-
  This is a profound dissection of the metaphysics of assessment. You have identified that your committee has built a hybrid machine: part fortress (protecting the purity of the mind), part courtroom (adjudicating authorship), and part laboratory (testing method). The friction you feel arises because these parts rely on incompatible theories of mind.

  Turing's "child-machine" analogy provides the precise lever you need. In *Computing Machinery and Intelligence*, Turing argues against programming an adult mind directly (installing content) in favour of programming a child's structure and subjecting it to education (developing capacity through interaction). The resulting machine is competent, but its internal weights are the result of a history of adjustment, not a lookup table.

  Here is the separation of your regime's pieces, analysed through that lens.

  ### 1. What the Regime Assumes

  For your current regime to make sense, it must hold three distinct, largely incompatible theories of what a qualification certifies.

  *   **The Deprivation Proxy** assumes the **Fortress Mind**. It posits that knowledge is a substance that must be stored entirely within the cranial boundary to count as "known." If the knowledge resides in the interaction between the student and a calculator, or the student and a statute book, the regime treats it as external scaffolding rather than internal competence. It assumes certification is about the *density of the storage*, not the *reliability of the retrieval*.
  *   **The Reconstruction Condition** assumes the **Cartesian Mind**. It posits that access to knowledge is transparent. If a capacity exists, the owner must be able to introspect and narrate the causal chain that produced it. It assumes that *tacit knowledge* (knowing how) is either non-existent or inferior to *explicit knowledge* (knowing that).
  *   **Provenance Grading** assumes the **Moral Labourer**. It posits that the value of the degree lies in the *history of the production* of the work, not merely the *current state of the graduate*. It treats the university as a certifier of specific acts of labour (you wrote this) rather than a certifier of achieved capacity (you can now do this).

  ### 2. Capacity vs. Content

  You asked which components presuppose capacity stored in the learner versus a stock of retrievable content.

  *   **The Deprivation Proxy** strictly presupposes **Capacity Stored in the Learner**. It is hostile to retrievable content. By banning notes and tools, it forces the student to convert external content into internal memory. However, it conflates *memory* with *capacity*. It tests whether the student has successfully internalised the *tools* of the trade, not necessarily whether they can *use* the tools of the trade.
  *   **The Reconstruction Condition** is equally at home under either picture, but it functions differently in each. Under the **Content** picture, it tests if the student retrieved the correct "rule" for solving the problem. Under the **Capacity** picture, it tests if the student's internal logic is aligned with the discipline's logic. However, because it demands verbalisation, it privileges content that *can be verbalised*.
  *   **Provenance Grading** actually presupposes **Stock of Retrievable Content** (specifically, tokens). By penalising the use of a generative model as an authorship offence, the regime treats the submitted text as a commodity that must be manufactured by the student's own hand. It does not care if the student has acquired the capacity to generate similar text later; it cares that *this specific instance* of content was not internally sourced. It treats the assessment as a supply chain audit, not a capacity test.

  ### 3. The Deprivation Proxy: Measuring Internalisation or Isolation?

  Does the deprivation proxy measure the thing it is a proxy for? **No.**

  It measures **unassisted performance**, which is a specific subset of competence. In almost every profession (including law, despite the statute book exception you noted), the expert is defined by their ability to marshal resources, not by their ability to function without them.

  By withholding a calculator in physics but allowing a statute book in law, your committee has arbitrarily drawn the line between "tool" and "resource." This reveals that the deprivation proxy does not measure *competence*; it measures **compliance with a specific ritual of isolation**. It measures a kind of internalisation that the profession does not require. It certifies that the student can perform the role of the student, not the role of the practitioner. If the profession expects them to work alongside colleagues who supply what they lack, assessing them in isolation certifies them for a job that does not exist.

  ### 4. The Reconstruction Condition: Ownership or Articulacy?

  If we take Turing's picture seriously, the educated mind (like the trained machine) operates on weights and connections that are not fully accessible to introspection. A grandmaster cannot fully reconstruct why they moved a knight; they "see" the board differently.

  Therefore, the Reconstruction Condition is **not a test of ownership**. It is a test of **metacognitive articulacy**.

  *   **What it filters for:** It filters for students whose learning style aligns with explicit rule-following and verbal narration.
  *   **What it misses:** It filters *out* students who have acquired genuine, intuitive capacity (the "black box" competence Turing describes) but cannot reverse-engineer their own intuition on demand.
  *   **The Risk:** If a student used a model to produce work but has since absorbed the logic (the child-machine has been educated by the AI), they may fail the reconstruction condition because their internal weights don't match the linear steps the AI took. Conversely, a student who wrote every word unaided but memorised a script without understanding may pass the reconstruction condition by reciting the script.

  The condition confuses **accountability** (can you stand by this?) with **transparency** (can you show me the gears?). Turing suggests the gears may be opaque even to the owner.

  ### 5. A Turingian Assessment Regime

  If you took the child-machine picture seriously—where education is the training of a structure to interact competently with a complex environment—assessment would undergo a radical shift.

  **What you would have to start measuring:**
  *   **Integration of Tools:** Assess the student's ability to *select* and *critique* tools. Give them the calculator, the statute book, and the generative model. The test is not "can you calculate?" but "do you know *when* to calculate, *which* statute applies, and *whether* the model's suggestion is sound?"
  *   **Adaptability:** Test how the student performs when the environment changes. A trained machine is robust to noise. Assessment should introduce novel constraints or contradictory information to see if the student's "weights" hold, rather than testing if they can recall a specific path.
  *   **Outcome over Process:** If the profession cares about the bridge standing, assess the bridge. If the student used AI to design it, but can defend the design, modify it under pressure, and explain its failure points, they are competent.

  **What you would have to stop treating as evidence:**
  *   **Provenance as Discipline:** Stop treating AI use as a disciplinary offence. Treat it as a methodological choice. If the work is defective, grade it down. If the work is sound, the source is irrelevant to the capacity. The disciplinary board should only intervene if the student *claims* unaided work when they used aid (lying), not for the use itself.
  *   **Reconstruction as Proof of Ownership:** Stop demanding a linear verbal reconstruction of intuitive leaps. Accept "I recognised the pattern" as a valid answer, provided you can test the recognition in a different context.
  *   **Deprivation as Rigour:** Stop equating "harder" (no tools) with "better" (more learning).

  **Which of your present rules would survive untouched?**
  *   **The focus on Method (with modification):** The idea that a wrong answer with a sound route scores well is compatible with Turing. It values the *structure of the reasoning* over the *output*. However, the "route" must be allowed to include external queries. "I asked the model X, it said Y, I rejected Y because Z" is a valid method.
  *   **The Viva (repurposed):** The oral examination survives, but its purpose shifts. It is no longer a provenance check ("Did you write this?"). It becomes a **stress test of the trained machine**. "Here is a variation of the problem you solved. Solve it now, without your notes." This tests if the capacity was internalised, without policing how it was acquired.

  ### Summary

  Your current regime certifies a **Solitary Articulater**. It assumes education is the transfer of content into a secure vault, and the degree is a receipt that the vault was filled by the student's own hand.

  A Turingian regime would certify a **Networked Operator**. It assumes education is the tuning of a structure to navigate an environment rich in tools and information. The degree would certify that the structure is tuned, regardless of whether the tuning weights were adjusted by a lecturer, a textbook, or a model.

  The inconsistency you feel is the friction between certifying the *labour of the past* (Provenance/Deprivation) and certifying the *capacity of the future* (Method/Reconstruction). You cannot do both with the same rules. If you wish to educate child-machines for a world of tools, you must assess their interaction with the tools, not their ability to pretend the tools do not exist.
