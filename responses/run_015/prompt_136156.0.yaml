      *Wait, a nuance:* If I set the standard as "Must satisfy Strawson's definition of UR (Ultimate Responsibility)," then Compatibilism fails by definition. If I set the standard as "Must provide a coherent account of responsibility *despite* Strawson," Compatibilism might pass by rejecting UR.
      *Decision:* The prompt asks for desiderata to survive the *Basic Argument*. The Basic Argument concludes responsibility is impossible. To survive it, a theory must show responsibility *is* possible. This usually means meeting the UR condition or showing why UR isn't needed *without* conceding the core intuition of desert. I will frame the desiderata to demand a robust account of *origination* that satisfies the intuition behind Strawson's premise 1, otherwise, the theory hasn't really answered Strawson, it has just changed the subject. I will make this tension explicit in the "Joint Unsatisfiability" flag.

      *Actually, looking closer at the prompt:* "Build the standard before scoring any contender." "Indicate how compatibilism... fare against your list."
