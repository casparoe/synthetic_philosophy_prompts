answer: |-
  # Specification of Desiderata for a Theory of Moral Responsibility
  ### (Constraint Set for Surviving Strawson's Basic Argument)

  To survive Galen Strawson's Basic Argument, a theory of moral responsibility cannot merely redefine responsibility to suit a pre-existing metaphysical comfort zone. It must address the core metaphysical challenge: the impossibility of being a *causa sui* (cause of oneself) while retaining the status of an ultimate originator worthy of basic desert. The following five desiderata constitute the necessary and jointly sufficient conditions for any theory claiming to vindicate true moral responsibility in the face of the Basic Argument.

  ---

  ### 1. The Regress Termination Condition
  **Precise Phenomenon:** The theory must explain how the chain of justification for an agent's character or choices comes to a non-arbitrary halt. Strawson argues that for an agent to be responsible for an action ($A$), they must be responsible for the mental state ($M_1$) that produced $A$. But to be responsible for $M_1$, they must have chosen it via a prior mental state ($M_2$), and so on *ad infinitum*.
  **Non-Negotiable Consideration:** If the regress is not halted, responsibility is perpetually deferred. An infinite chain of prior causes implies no point at which the agent *actually* assumes ownership. A finite chain implies a starting point for which the agent is *not* responsible, contaminating all subsequent outputs. The theory must identify a metaphysical or normative "ground floor" that counts as agential ownership without requiring a prior act of ownership.
  **Status:** **Critical Failure Point.**

  ### 2. The Ultimate Sourcehood Condition (Causa Sui Proxy)
  **Precise Phenomenon:** The theory must preserve the distinction between being a mere *causal conduit* (a link in a deterministic chain or a randomizer in an indeterministic one) and being a *genuine originator*. The agent must be the source of the action in a way that makes the action *theirs* in a deep, constitutive sense, not merely a product of genetics, environment, or luck.
  **Non-Negotiable Consideration:** Without this distinction, moral responsibility collapses into mere causal accountability. If the agent is not the ultimate source, praise and blame are merely behavioral modification tools, not reflections of desert. The theory must explain how an agent can generate a will that is not fully determined by the past yet not merely random.
  **Status:** **Critical Failure Point.**

  ### 3. The Luck Immunity Condition
  **Precise Phenomenon:** If the theory invokes indeterminism to halt the regress (Libertarianism), it must explain how the indeterminate break is not merely a matter of luck. If a choice is not determined by prior states, it appears to happen *to* the agent rather than *by* the agent.
  **Non-Negotiable Consideration:** Responsibility requires control. If the formation of a mental state involves an indeterministic gap that is not controlled by the agent's prior reasons or character, the agent cannot be credited with the outcome. The theory must demonstrate how indeterminism enhances control rather than diminishing it.
  **Status:** **Critical Failure Point.**

  ### 4. The Diachronic Normative Integration Condition (Branching Stress-Test)
  **Precise Phenomenon:** The theory must handle **diachronic normative integration in branching form**. Human psychology is not a linear chain ($M_1 \rightarrow M_2 \rightarrow M_3$). It is a branching network where present normative commitments depend on prior mental states that were themselves shaped by *earlier* commitments in a non-linear, web-like structure.
  *   *Case:* An agent's current commitment to honesty ($C_{now}$) is supported by a memory of a past lie ($M_{past}$), which was shaped by a prior value of loyalty ($V_{prior}$), which was reinforced by a social reward ($S_{reward}$). These nodes interact recursively. $C_{now}$ reinforces $V_{prior}$ retroactively by re-interpreting it.
  **Non-Negotiable Consideration:** A linear theory of responsibility cannot track the topology of actual moral development. If responsibility requires tracing a causal chain, a branching structure dilutes the trace. The theory must explain how an agent retains ownership of a mental state when its genealogy is a convergent web of prior states, some of which the agent may not have been fully responsible for at the time of their formation. It must show how normative authority propagates through a branching network without dissolving at the nodes.
  **Status:** **Structural Constraint.**

  ### 5. The Basic Desert Entailment
  **Precise Phenomenon:** The theory must entail that the agent *deserves* praise or blame in a backward-looking sense, not merely that they are a suitable target for forward-looking practices (quarantine, rehabilitation, reinforcement).
  **Non-Negotiable Consideration:** Strawson's argument targets *basic desert*. If a theory satisfies D1–D4 but only justifies forward-looking accountability (as some Compatibilists do), it has not survived the Basic Argument; it has conceded it and changed the subject. To survive the argument, the theory must vindicate the retributive intuition that the agent *merits* a specific normative response based on the action's genesis.
  **Status:** **Normative Payoff.**

  ---

  ### ⚠️ Flag: Joint Unsatisfiability Warning
  **The Strawson Tension:** There is a strong suspicion that **Desideratum 1 (Regress Termination)** and **Desideratum 2 (Ultimate Sourcehood)** are jointly unsatisfiable for finite beings.
  *   **Reasoning:** To satisfy D2, the agent must be the ultimate source of their will. To satisfy D1, the regress of "willing the will" must stop. If it stops at a state ($S$) the agent did not choose, D2 is violated (the agent is not the source of $S$). If it does not stop, D1 is violated (infinite regress).
  *   **Implication:** Any theory claiming to satisfy both must provide a novel metaphysical account of agency (e.g., agent-causation that transcends temporal sequence) or argue that the regress is vicious only under a mistaken conception of time/identity. Most standard accounts fail here.

  ---

  ### Stress-Test Application: Diachronic Branching
  The requirement for **Diachronic Normative Integration in Branching Form** (D4) is included to prevent theories from relying on simplified "time-slice" models of agency.
  *   **Constraint:** The theory cannot simply say, "The agent is responsible if the action aligns with their current values." In a branching structure, current values are constituted by past states that may have been formed under duress, ignorance, or indeterministic luck.
  *   **Requirement:** The theory must specify how normative authority flows through the branches. Does responsibility aggregate? Does it dilute? If a prior node in the branch was not responsibly formed, does it poison the downstream commitments? A surviving theory must map responsibility onto this topology without requiring every node to be a fresh act of *causa sui*.

  ---

  ### Preliminary Scoring of Contenders
  *Note: This evaluation is secondary to the specification above, intended only to reveal which criteria perform the exclusionary work.*

  #### 1. Compatibilism
  *   **Performance:** Fails **D2 (Ultimate Sourcehood)** and **D5 (Basic Desert)** by Strawson's lights.
  *   **Exclusionary Criteria:** Compatibilism typically redefines "sourcehood" as acting in accordance with one's desires without external coercion. Strawson's argument accepts this but notes it does not address *where the desires came from*. By accepting that the agent is not the ultimate source of their character, Compatibilism satisfies D1 (by accepting the regress stops at genetics/environment) but fails D2 and D5. It survives the argument only by conceding the core intuition Strawson attacks.
  *   **Branching Test:** Generally handles D4 well, as it focuses on psychological continuity, but lacks the metaphysical grounding to make that continuity responsibility-conferring in the *basic desert* sense.

  #### 2. Libertarianism (Event-Causal & Agent-Causal)
  *   **Performance:** Attempts D2 but fails **D1 (Regress Termination)** and **D3 (Luck Immunity)**.
  *   **Exclusionary Criteria:** Libertarianism posits an indeterministic break to allow for alternative possibilities. However, Strawson's regress applies here too: if the choice is undetermined, is it responsible? If yes, why? If no, the regress continues. Agent-causation attempts to halt the regress by positing a substance that causes events without being caused. This risks violating D3 (Luck): if the agent's causing is not determined by reasons, it appears arbitrary. If it *is* determined by reasons, we return to Compatibilism.
  *   **Branching Test:** Struggles with D4. Locating the "indeterministic gap" within a branching network of prior mental states is topologically difficult. If the gap is anywhere in the prior web, responsibility is diluted by luck.

  #### 3. Strawsonian Impossibilism / Revisionism
  *   **Performance:** Passes **D1** and **D3** logically, but fails the prompt's goal of **Surviving** (i.e., retaining responsibility).
  *   **Exclusionary Criteria:** This view accepts the Joint Unsatisfiability Flag. It argues D1 and D2 cannot both be met. Therefore, true moral responsibility (D5) is impossible. It "survives" the argument by accepting its conclusion, but it fails the constructive requirement of vindicating responsibility.
  *   **Branching Test:** Irrelevant, as it denies the possibility of the normative integration required for desert.

  ### Conclusion on Exclusionary Work
  The **Regress Termination Condition (D1)** combined with the **Ultimate Sourcehood Condition (D2)** does the heavy lifting. Any theory that halts the regress (Compatibilism, Impossibilism) sacrifices ultimate sourcehood. Any theory that insists on ultimate sourcehood (Libertarianism) cannot halt the regress without invoking mysterious metaphysics or succumbing to the Luck Objection (D3). The **Branching Integration (D4)** stress-test further complicates Libertarian attempts to locate the locus of control, while Compatibilism passes D4 but fails to derive D5 (Desert) from it. Thus, under this specification, no existing standard theory fully survives.
