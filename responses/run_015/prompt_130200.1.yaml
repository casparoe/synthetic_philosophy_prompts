answer: |-
  ### I. Reconstructing the Implicit Theory

  To make sense of the pattern—rotating legislators, permanent judges, permanent administrators, and ephemeral jurors—we must reconstruct a theory of **functional vulnerability**. The allocation of tenure and selection methods is not arbitrary; it is a calibration of insulation against specific types of corruption or error inherent to each task.

  **The Gradient: Allocation of Divisible Goods vs. Application of Indivisible Rights**
  The primary dimension along which the gradient runs is not merely "will vs. truth," but **the power to allocate divisible advantages.**

  1.  **Legislators (Rotated):** Their primary output is the allocation of divisible goods (tax burdens, subsidies, regulatory favors). This creates a high risk of *transactional corruption* (selling votes) and *entrenchment* (using office to secure future electoral advantage).
      *   *Presupposition:* Legislative power is inherently distributive and predatory.
      *   *Mechanism:* Rotation breaks the network of patronage and prevents the officeholder from becoming a permanent broker of favors.
  2.  **Judges (Permanent):** Their primary output is the application of indivisible rights (liberty, property, equality). They do not allocate budgets; they constrain power.
      *   *Presupposition:* Judicial power is inherently counter-majoritarian and vulnerable to *retaliatory corruption* (removal for unpopular rulings).
      *   *Mechanism:* Life tenure removes the leverage of the political branches and the electorate. It makes the judge "expensive" to capture (you must wait for death/impeachment) and immune to short-term pressure.
  3.  **Administrators (Permanent):** Their output is continuity and competence.
      *   *Presupposition:* Governance requires institutional memory that survives electoral cycles.
      *   *Mechanism:* Civil service protections prevent the "spoils system," where administration becomes a reward for political loyalty rather than a function of competence.
  4.  **Jurors (Ephemeral/Sortition):** Their output is a specific finding of fact.
      *   *Presupposition:* Fact-finding requires common sense, not technical expertise, and legitimacy requires community representation.
      *   *Mechanism:* Sortition and dissolution prevent *targeted corruption*. You cannot lobby a body you cannot identify in advance, and you cannot bribe a body that ceases to exist next week.

  **Underdetermination and Rival Theories**
  The pattern is underdetermined between two rival high-level theories:
  *   **Civic Republicanism:** Rotation is good because it cultivates civic virtue and prevents the formation of a distinct political class.
  *   **Liberal Constitutionalism:** Insulation is good because it protects minority rights from majority tyranny.

  The current system fits *both*. We cannot tell from the structure alone whether term limits exist to make legislators more virtuous (Republicanism) or to make them less powerful (Liberalism). Similarly, we cannot tell if judicial tenure exists to ensure expertise (Technocracy) or to ensure independence (Liberalism). The arrangement is evidence for the *need* to differentiate functions, but not for the specific *moral justification* of that differentiation.

  **Strict Presuppositions vs. Mere Fits**
  *   **Strictly Presupposed:** That the risk profile of legislating (transactional/entrenchment) is fundamentally different from adjudicating (retaliatory/political). If these risks were identical, the tenure structures would be identical.
  *   **Mere Fit:** The specific duration of terms. A four-year legislative term vs. a two-year term is not dictated by the theory, only the fact that it is *finite*. Similarly, "life tenure" is not strictly required; any tenure longer than the electoral cycle would satisfy the independence rationale.

  ---

  ### II. The Counterfactual Test: The Capture Rationale

  **The Challenge:** If the goal is preventing capture, a known, permanent judge is a stationary target. A lobbyist can cultivate a relationship with a Justice over decades. A juror is a moving target, anonymous until seated and gone immediately after. Therefore, the anti-capture rationale should demand rotating judges and perhaps professional legislators (who are easier to monitor than transient ones).

  **The Defense: Distinguishing Types of Capture**
  The practice has a resource for answering this, provided we distinguish between **bribery** and **coercion**.

  1.  **Judicial Vulnerability is Coercive:** The primary threat to a judge is not that they will be bribed to rule a specific way (though possible), but that they will be *coerced* by the threat of removal or salary reduction if they rule against the government or popular sentiment.
      *   *Why Rotation Fails Here:* If judges had term limits, they would rule with an eye toward their *next* job. They would become dependent on the very political actors they are meant to constrain. Life tenure is not about making them hard to find; it is about making them impossible to fire.
  2.  **Legislative/Jury Vulnerability is Transactional:** The primary threat to a legislator is selling votes for campaign funds or future employment. The primary threat to a juror is direct bribery.
      *   *Why Rotation/Sortition Works Here:* You cannot sell a vote for a future favor if you won't be there to collect. You cannot bribe a juror easily if you don't know who they are until it is too late.

  **Conclusion:** The pattern is not two unrelated designs. It is a unified theory of **Independence**, but it recognizes that *independence requires different shields against different swords.* Judges need a shield against the State (Tenure); Legislators need a shield against Oligarchy (Rotation); Jurors need a shield against Litigants (Anonymity/Sortition).

  However, the counterfactual reveals a weakness: **The "Revolving Door."** Life tenure protects judges from removal, but it does not protect them from the promise of lucrative post-office employment (law firms, consulting). In this specific regard, the "Insulated Legislature" model (generous pension, forbidden post-office employment) actually offers *better* anti-capture protection for judges than the current status quo.

  ---

  ### III. The Alternative Package: Insulated Legislature & Elected Judges

  **The Package:**
  *   **Legislature:** Sortition, single 6-year term, pension, no post-office lobbying.
  *   **Judiciary:** Elected, short renewable terms, non-partisan.

  **Theoretical Endorsement:**
  1.  **The Insulated Legislature:** This half is endorsed by the **Anti-Corruption/Deliberative Theory**.
      *   *Why:* Sortition eliminates campaign finance corruption. A single long term eliminates the need to fundraise for re-election. The pension and employment ban eliminate the "revolving door." This creates a body that is arguably *more* independent than the current Congress.
      *   *Fit:* It treats legislating as a civic duty (like jury service) rather than a career.
  2.  **The Elected Judiciary:** This half is endorsed by the **Popular Sovereignty Theory**.
      *   *Why:* It treats law not as a technical truth to be discovered by experts, but as a social choice to be made by the community. If judges make policy (which they do), the people should choose them.

  **Where it is More Defensible:**
  *   **Legislative Corruption:** On the theory's own terms (anti-capture), the Insulated Legislature is superior to the status quo. It removes the need for fundraising and the incentive to curry favor for future employment.
  *   **Judicial Accountability:** On the theory of democratic responsiveness, elected judges are superior. They cannot become an unaccountable oligarchy.

  **Where it Breaks:**
  *   **The Rights Protection Function:** The package collapses the distinction between *Will* and *Right*. If legislators are insulated from the people (Sortition), who expresses the popular will? If judges are dependent on the people (Elections), who protects the minority from the majority?
  *   **Competence:** The current system presupposes that law is a technical craft requiring long practice. Elected judges with short terms incentivize campaigning over jurisprudence and may lack the depth of experience life tenure allows.
  *   **Stability:** A sortition legislature lacks party discipline or institutional memory. Passing complex, coherent budgets would be nearly impossible without a permanent staff that effectively becomes the real government (shifting power to the administrators).

  **Verdict:** This package is more consistent internally regarding **anti-corruption** (both branches are insulated from financial capture), but less consistent regarding **democratic legitimacy** (neither branch is directly responsive to voters). It solves the problem of money in politics but creates a problem of accountability.

  ---

  ### IV. The Jury Precedent: Workable Model or False Analogy?

  Does the existence of juries prove that sortition works for broader governance?

  **The Argument for "No Precedent"**
  The jury's narrow remit makes it a false analogy for the legislature.
  1.  **Retrospective vs. Prospective:** Juries decide *what happened* (past facts). Legislatures decide *what to do* (future policy). Fact-finding relies on common human experience (did the light look red?). Policy-making relies on ideological preference and trade-off analysis (should we tax carbon?). Sortition works for the former because human perception is roughly equal; it fails for the latter because political preferences are polarized and require coalition-building.
  2.  **Unanimity vs. Majority:** Juries are usually required to be unanimous. This forces deliberation toward a consensus interpretation of evidence. Legislatures operate by majority rule. A sortition legislature operating by majority rule would likely be chaotic, lacking the party structures that currently aggregate interests and stabilize voting.
  3.  **No Agenda Power:** Juries cannot choose which cases to hear. They react to cases brought by others. A legislature sets the agenda. A random body with agenda-setting power is unpredictable in a way that threatens economic and social stability.

  **The Argument for "Yes Precedent"**
  However, the jury does prove one specific thing: **Laypeople can be trusted with high-stakes decisions without professional training.**
  It disproves the technocratic claim that only career politicians can understand governance. It validates the idea that "common sense" is a valid form of political reasoning, provided the scope is limited and the participants are insulated from external pressure.

  **Conclusion**
  The jury is evidence that **sortition is workable for *judgment*, but not for *will*.**
  The implicit theory of the constitutional order relies on this distinction. We trust the people (via jurors) to find the truth of a specific case. We trust the people (via voters) to choose the direction of the state (via legislators). We trust neither to interpret the constraints on that direction (via judges).
  The jury works *because* it has no agenda and dissolves immediately. If you give that same body the power to tax and spend for six years, you have not created a "super-jury"; you have created an unaccountable oligarchy of amateurs. The jury precedent supports the *selection method* (lottery) but not the *tenure or power* (long term, agenda-setting). Therefore, it supports the "Insulated Legislature" only if that legislature is strictly constrained by a constitution interpreted by independent judges—returning us to the necessity of the original pattern's tension.
