  8.  **Final Polish:** Ensure the transition between sections is smooth and the conclusion ties the threads together. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note during drafting the "Counterfactual" section)*: I need to be careful not to simply say "Judges are different." I need to explain *why* the anti-capture rationale doesn't demand rotating judges. The key is that judicial capture is usually *political* (fear of removal), whereas legislative capture is *transactional* (votes for money/pork). Life tenure solves the political fear. Sortition solves the transactional bribery (hard to find/bribe). So the mechanisms differ because the threats differ.

  *(Self-Correction Note on the "Alternative Package")*: The prompt asks "Which half of which reconstructed theory would endorse each half?" I need to be specific. The "Anti-Careerist/Corruption" theory supports the Insulated Legislature. The "Popular Sovereignty" theory supports Elected Judges. But they clash when combined.

  *(Self-Correction Note on Juries)*: Make sure to highlight the "Reasons" aspect. Legislatures must give reasons (laws have purposes); Juries do not. This is a crucial functional difference.

