answer: |-
  # Diagnostic: The Trade-Off Intuition Inventory

  **Instructions:** For each case, select the option that best matches your all-things-considerated judgement. Do not answer based on what you think a consistent theory *should* say, but on what you actually feel is right in the scenario. There are no trick questions, though some distinctions are fine.

  ### The Cases

  **1. The Infinite Party**
  A device can generate a finite amount of extreme agony for one person. Alternatively, it can generate an *infinite* duration of mild, harmless pleasure for a billion people. The agony cannot be mitigated or forgotten.
  *   (A) Prevent the agony; the pleasure does not compensate.
  *   (B) Allow the agony; the infinite pleasure outweighs it.
  *   (C) Neither option is better; they are unranked.

  **2. The Headache Stack**
  One person must endure one hour of bone-breaking torture. Alternatively, one billion people each endure a one-second mild headache. The total duration of headache pain is vastly longer than the torture.
  *   (A) Prevent the torture; intensity matters lexically.
  *   (B) Prevent the headaches; the aggregate pain is greater.
  *   (C) It is permissible to choose either; there is no fact of the matter.

  **3. The Flawed Paradise**
  A life consists of 80 years of sublime bliss and one hour of unmitigated, soul-crushing agony. Compare this to a life of 80 years of mild, untroubled contentment.
  *   (A) The Paradise life is worse; the agony vetoes the bliss.
  *   (B) The Paradise life is better; the bliss outweighs the agony.
  *   (C) The lives are incomparable; neither is better.

  **4. The Sorites Slider**
  Imagine a scale of pain intensity from 1 (itch) to 10 (agony). At level 1, a vast amount of pleasure clearly compensates for the pain. At level 10, it clearly does not. We increase the intensity by imperceptible steps.
  *   (A) There is a specific step where compensation becomes impermissible.
  *   (B) There is no specific step; the boundary is vague.
  *   (C) Compensation is permissible at all steps, but becomes increasingly regrettable.

  **5. The Active Switch**
  You must press a lever. Doing so actively administers one minute of agony to Person A. Not doing so denies Person B a lifetime of mild pleasure. The causal link is direct and intentional.
  *   (A) Do not press the lever.
  *   (B) Press the lever.
  *   (C) Either choice is permissible.

  **6. The Passive Switch**
  You must *refrain* from pressing a lever. Refraining allows a natural process to inflict one minute of agony on Person A. Pressing it prevents the agony but denies Person B a lifetime of mild pleasure.
  *   (A) Refrain from pressing (allow the agony).
  *   (B) Press the lever (prevent agony, deny pleasure).
  *   (C) Either choice is permissible.

  **7. The Unranked Zone**
  Consider a case of moderate suffering traded for moderate pleasure. You feel it is not clearly better to produce the pleasure, nor clearly better to prevent the suffering.
  *   (A) This implies the options are equally good.
  *   (B) This implies the options are incomparable (no ranking exists).
  *   (C) This implies I need more information to calculate the weights.

  **8. The Sacrificial Lamb**
  One person is selected to suffer a threshold level of agony. This prevents a slightly sub-threshold level of agony from being distributed across the entire population, while also providing them mild pleasure.
  *   (A) Forbidden; the individual's threshold cannot be breached for the aggregate.
  *   (B) Permissible; the total suffering is reduced.
  *   (C) Permissible only if the victim consents.

  **9. The Finite Multiplier**
  One minute of agony is on the table. How many minutes of mild pleasure would it take to make the agony permissible?
  *   (A) No finite number suffices.
  *   (B) Some specific finite number suffices (e.g., 1 billion years).
  *   (C) It depends on the distribution, not the number.

  **10. The Regretful Trade**
  You choose to allow a sub-threshold pain to secure a great pleasure. Later, you review the decision.
  *   (A) I feel no moral residue; it was the right outcome.
  *   (B) I feel moral residue; something of value was lost, even if right.
  *   (C) I feel regret only if I made a calculation error.

  ***

  # Scoring Key & Logical Space

  Map your answers to the 'Leaves' below. Note that most respondents will not fit perfectly into one column; look for the strongest resonance. The 'Awkward Commitment' notes the cost of holding the position consistently.

  | | **Leaf 1: Moment-LTNU** | **Leaf 2: Life-LTNU** | **Leaf 3: Weighted Consequentialism** | **Leaf 4: Incomparabilism** | **Leaf 5: Deontic Constraint** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Core Claim** | Any moment exceeding an intensity threshold vetoes any amount of pleasure. | A life's *total* suffering exceeding a threshold vetoes the life's pleasure. | Pain weighs heavier than pleasure, but all goods are commensurable. | Some pain/pleasure pairs lack a 'better than' relation; ordering is partial. | Certain trades are forbidden by agent-relative constraints, regardless of outcome value. |
  | **Key Questions** | Q1(A), Q3(A), Q9(A) | Q1(A), Q3(B), Q9(A) | Q1(B), Q3(B), Q9(B) | Q1(C), Q7(B) | Q5(A) & Q6(B) |
  | **Vagueness (Q4)** | Sharp or Vague | Sharp or Vague | Sharp (in principle) | Vague / Indeterminate | Sharp (rule-based) |
  | **Awkward Commitment** | You must prevent a moment of agony even if it saves a billion lives from mild misery. | A life of constant moderate torture is permissible if the total 'volume' stays below the threshold. | You must accept that enough dust specks in eyes outweigh a year of torture. | You cannot always act to improve the world, as some states are unranked. | You must let agony occur if preventing it requires you to 'act' rather than 'allow'. |

  ### Unoccupied or Unstable Cells

  1.  **Vague Lexicality (Q4-B + Q1-A):** This cell is occupied (Supervaluationism). It holds that there is a threshold, but its precise location is indeterminate. *Awkward Commitment:* You cannot know if a specific act is permissible until the vagueness is resolved, yet you must act now.
  2.  **Intra-Pain Non-Lexical / Inter-Pain Lexical:** This is the standard LTNU position (Q2-A). The cell where mild pain is lexical against pleasure, but agony trades against mild pain, is **incoherent**. If mild pain lexically dominates pleasure, and agony is worse than mild pain, agony must lexically dominate pleasure by transitivity.
  3.  **Deontic without Axiological Asymmetry:** This is Leaf 5. It is logically coherent but unstable. *Awkward Commitment:* You must judge the outcome where agony occurs as *better* (axiologically) but the action producing it as *wrong* (deontically), forcing a split between the good and the right.

  ### Indistinguishability Flag

  **The Finite Weight Problem (Leaf 1 vs. Leaf 3):**
  This quiz **cannot** definitively separate **Leaf 1 (Lexical Threshold)** from a version of **Leaf 3 (Weighted Consequentialism)** where the weight on suffering is merely extremely high (e.g., $10^{100}$).
  *   **Reason:** Any concrete case offered in a quiz involves finite quantities. A lexical view says $\infty$ disvalue; a weighted view says $N$ disvalue. If $N$ is higher than any number you can conceive in a case study, the behavioural output is identical.
  *   **Separation:** To separate them, one must ask about *principles* (forbidden) or use a Sorites series (Q4) where the Weighted view implies a precise exchange rate exists in principle, whereas the Lexical view implies a structural break. However, even Q4 relies on introspection which may be unreliable.
  *   **Note on Q5/Q6:** This pair tests the Deontic Constraint (Leaf 5). If the respondent answers differently (e.g., 'Do not Press' in Q5 but 'Press' in Q6), they hold an agent-relative view. If they answer identically, they are consequentialist. However, many philosophers argue this distinction does not do the work required to ground a threshold, as the *outcome* (agony exists) is identical. If you treat them differently, you must explain why the *source* of the agony matters more than the *existence* of the agony.

  ### Guidance for the Reading Group

  *   **If you scored mostly Leaf 1:** You are a standard Suffering-Focused Ethicist. Your challenge is the "Sadist's Paradise" objection (is a life with one moment of pain truly worse than a life of mud?).
  *   **If you scored mostly Leaf 3:** You are a Prioritarian or Weighted Utilitarian. Your challenge is the "Repugnant Conclusion" variant (agony for dust specks).
  *   **If you scored mostly Leaf 4:** You are a Pluralist or Incomparabilist. Your challenge is decision-making under indeterminacy (how to choose when ranks are absent?).
  *   **If you scored mostly Leaf 5:** You are a Deontologist. Your challenge is explaining why allowing suffering (Q6) is permissible when causing it (Q5) is not, given the victim suffers equally.

  *Note: This diagnostic maps logical space, not truth. A consistent set of answers may still lead to a false conclusion.*
