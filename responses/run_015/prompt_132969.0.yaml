answer: |-
  This is a sharp observation. You have identified a "philosophical shibboleth": a phrase that signals membership in a reasonable community without committing the speaker to a falsifiable claim. In ethics, we distinguish between *justifications* (the act was right) and *excuses* (the act was wrong, but the agent isn't fully responsible). "He was a man of his time" conflates these, and it conflates *moral ontology* (was it wrong then?) with *commemorative policy* (do we honor him now?).

  Here is a menu of distinct theses the sentence might express, ordered from trivially true to substantively contentious to likely false, followed by an analysis of their pragmatic function and recommendations for your committee.

  ### Part I: The Menu of Theses

  **1. The Causal Truism (Circumstantial Moral Luck)**
  *   **Thesis:** The agent's moral beliefs were causally influenced by the dominant norms of their era.
  *   **Defensibility:** Trivially true. Everyone is a product of their environment.
  *   **Settlement:** Sociological fact. No moral work is done here, as it applies to us as much as them.
  *   **Status:** *True but inert.*

  **2. The Epistemic Excuse (Invincible Ignorance)**
  *   **Thesis:** The moral considerations rendering the act wrong were not *accessible* to the agent. They lacked the evidence or conceptual vocabulary to recognize the harm.
  *   **Defensibility:** Contingently true/false depending on the figure. Requires historical proof that dissent was impossible to encounter or comprehend.
  *   **Settlement:** Historical inquiry. (e.g., Was there an abolitionist pamphlet in Jefferson's library? Did contemporaries criticize Churchill's imperialism in Parliament?)
  *   **Status:** *Defensible for some, false for others.*

  **3. The Conceptual Unavailability Claim (Semantic Relativism)**
  *   **Thesis:** The moral concepts required to condemn the act (e.g., "systemic racism," "genocide") did not exist; therefore, the agent cannot be said to have violated a norm they could not conceptualize.
  *   **Defensibility:** Philosophically contentious. It confuses the *label* with the *harm*. One can inflict harm without a name for it.
  *   **Settlement:** Conceptual analysis. Does morality track *harm* or *awareness of harm*?
  *   **Status:** *Substantive but risky.* Often collapses into Thesis 2.

  **4. The Statistical Normalcy Claim (The Reference Class)**
  *   **Thesis:** The agent was not morally worse than the average peer of their class and station. To condemn him is to condemn the whole era selectively.
  *   **Defensibility:** Historically verifiable but morally irrelevant. Being a "common racist" does not excuse racism; it indicts the era.
  *   **Settlement:** Historical comparison.
  *   **Status:** *True but normatively weak.* (The "Nuremberg Defense" problem).

  **5. The Package-Deal Claim (Counterfactual Dependence)**
  *   **Thesis:** The objectionable views/actions were causally necessary for the admirable achievements. Removing the vice would have removed the virtue.
  *   **Defensibility:** Strong empirical claim. Often false. (Would Jefferson not have written the Declaration if he freed his slaves? Unlikely. Would Churchill not have fought Hitler if he disliked Indians? Unclear.)
  *   **Settlement:** Counterfactual historical analysis.
  *   **Status:** *Substantive and often false.*

  **6. The Commemorative Shift (Functional Re-framing)**
  *   **Thesis:** Naming a building is not a verdict on the agent's moral blameworthiness, but a statement of institutional aspiration or historical record.
  *   **Defensibility:** Policy decision, not moral fact. It changes the subject from "Was he good?" to "What does this name signal to students?"
  *   **Settlement:** Institutional governance. What is the *purpose* of the naming?
  *   **Status:** *Defensible as policy, evasive as ethics.*

  **7. The Moral Progress Claim (Temporal Relativism)**
  *   **Thesis:** Morality is relative to time periods; what is wrong now was not wrong then.
  *   **Defensibility:** Philosophically dubious. Most ethicists reject strong temporal relativism (slavery was wrong in 1776, even if legal).
  *   **Settlement:** Meta-ethical debate.
  *   **Status:** *Likely false.*

  ---

  ### Part II: Mapping the Theses to Your Three Uses

  You noted three distinct conversational outcomes. Here is which thesis is actually doing the work in each, and whether the conclusion survives scrutiny.

  **1. Closing the question of blameworthiness (Jefferson)**
  *   **Operative Thesis:** *The Epistemic Excuse (2)* or *Conceptual Unavailability (3).*
  *   **Analysis:** The speaker wants to say Jefferson is not *culpable*.
  *   **Survival:** This survives only if Thesis 2 holds. If historical evidence shows Jefferson knew better (he read abolitionist arguments; he acknowledged the contradiction), Thesis 2 fails. If Thesis 2 fails, the sentence is false, yet it still stops the conversation. It functions as a *mercy rule*, not a truth claim.

  **2. Arguing the name should stay (Churchill)**
  *   **Operative Thesis:** *The Commemorative Shift (6)* disguised as *The Package-Deal (5).*
  *   **Analysis:** The speaker implies that removing the name denies the "good" (winning the war) because it is entangled with the "bad" (empire).
  *   **Survival:** Weak. Thesis 6 is the only robust defense here, but it requires admitting the name is *not* an honor. If the name *is* an honor, Thesis 5 must be true (the imperialism was necessary for the war resolve). That is historically tenuous. The sentence works here by ambiguity: it sounds like an excuse (Thesis 2) but acts as a policy claim (Thesis 6).

  **3. Licensing admiration while conceding vice (Columbus)**
  *   **Operative Thesis:** *The Package-Deal (5)* or *Moral Progress (7).*
  *   **Analysis:** This allows a "separate ledgers" approach. We admire the navigation/courage; we condemn the colonization.
  *   **Survival:** This relies on the asymmetry you noted. We accept circumstantial luck for virtues (he was lucky to be born when discovery was possible) but reject it for vices (he was unlucky to be born when racism was common). This is inconsistent unless we adopt Thesis 7 (morality changes), which is philosophically costly.

  ---

  ### Part III: The Pragmatic Function (Why it stops talk)

  You asked if the sentence is doing something non-propositional. **Yes.** In speech-act theory, this is a **conversation-closing convention**.

  1.  **Signaling Epistemic Humility:** It signals, "I acknowledge there is a problem, but I claim we lack the standing to judge across centuries." It pre-emptively blocks accusations of presentism.
  2.  **Fatigue Management:** In committee work, this phrase is a tool for *decision fatigue*. It signals, "We have reached the limit of useful nuance; let us vote."
  3.  **Coalition Maintenance:** It allows those who want to keep the name and those who want to remove it to agree on a vague middle ground. It is a *fuzzy compromise*.

  It works precisely because it is unstateable. If forced to state the premise (e.g., "I claim slavery was morally permissible in 1776"), the speaker would lose. The vagueness is the feature, not the bug.

  ---

  ### Part IV: The Asymmetry Problem

  You noted the asymmetry: *Does withholding blame commit us to withholding praise?*

  *   **The Situationist Challenge:** If his virtue was produced by the same "time" that produced his vice (e.g., a culture of honor produced both bravery and dueling), then situational luck undermines both.
  *   **The "Man of his Time" Asymmetry:** The phrase is typically used to **excuse the bad** (he couldn't help the racism) while **retaining the good** (he chose the bravery).
  *   **The Inconsistency:** This requires a theory where moral *knowledge* is historically contingent (so he isn't to blame for ignorance) but moral *agency* is historically robust (so he gets credit for courage). This is difficult to sustain. If the "time" determined the beliefs, did it not also determine the ambitions?

  ---

  ### Part V: What the Committee Should Ask Instead

  Since the sentence is a conversation-stopper that obscures the actual criteria for decision-making, your committee should replace it with specific, actionable questions. Do not ask "Was he a man of his time?" Ask:

  1.  **The Dissent Question (Testing Thesis 2):** "Was there credible, accessible moral dissent available to this person at the time?"
      *   *If Yes:* The epistemic excuse fails. Blame is appropriate.
      *   *If No:* The epistemic excuse holds. Blame is mitigated.
  2.  **The Entanglement Question (Testing Thesis 5):** "Is the achievement we admire causally dependent on the harm we condemn?"
      *   *If Yes:* We face a tragic choice (honor the whole or nothing).
      *   *If No:* We can conceptually separate the legacy (e.g., honor the science, condemn the eugenics).
  3.  **The Function Question (Testing Thesis 6):** "What is the pedagogical function of this name?"
      *   *Is it to honor?* (Then moral blameworthiness matters).
      *   *Is it to record history?* (Then moral blameworthiness matters less).
      *   *Is it to inspire?* (Then does this figure inspire the *current* student body, including those harmed by his legacy?)
  4.  **The Consistency Question (Testing Asymmetry):** "If we excuse this vice because of historical context, must we also discount this virtue for the same reason?"

  **Recommendation:**
  When a committee member says, "He was a man of his time," you should intervene not to refute them, but to **disambiguate**.

  Say: *"That phrase is doing a lot of work. Are you arguing that he couldn't have known better (historical claim), or that we shouldn't judge him by our standards (meta-ethical claim), or that this building name isn't an endorsement (policy claim)? Because the decision changes depending on which one you mean."*

  This forces the slogan to cash out as a premise. Usually, the speaker cannot do so, and the discussion can move from vague apology to specific criteria.
