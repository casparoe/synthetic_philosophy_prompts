  ### Supervisor's Brainstorm & Angles

  Right, let's have a proper think about this before we commit to paper. You've spotted a genuine tension here that most undergraduates miss. The standard reading of Keynes is split: there's the economist of *The General Theory* dealing with uncertainty, and there's the Bloomsbury moralist of *Economic Possibilities for our Grandchildren* (EPOG) telling us we'll all be writing poetry in 2030. rarely do people mash them together properly.

  Here are the angles floating around in my head:
  1.  **The Inconsistency Angle:** Keynes is just contradicting himself. His epistemology says "we can't know the future," but his ethics says "we know exactly what we'll want (art/leisure)." This is the sceptical route.
  2.  **The Continuity Angle:** Maybe the *Treatise on Probability* (ToP) isn't about scepticism but about *rational belief under uncertainty*. If the 'weight of argument' for moral goods is higher than for wealth accumulation once scarcity is solved, then prescribing the good life isn't overreach—it's the only rational bet.
  3.  **The 'Moral Expectation' Model:** This is your niche idea. Instead of maximising utility (which requires known preferences), we maximise the logical probability of moral states. It shifts the good life from a destination to a probabilistic portfolio.

  I reckon angle two and three combined is your winner. It shows sophistication without just saying "Keynes was wrong." Below is the draft proposal based on this thinking. I've kept the tone direct and British, as requested.

  ***

  **Research Proposal**

  **Module:** Value Theory and Economic Thought
  **Student:** [Your Name]
  **Topic:** Keynesian Epistemology and the Normativity of the Good Life

  **Research Question**
  Does Keynes's probabilistic epistemology undermine his normative confidence that post-scarcity humans should pursue aesthetic and moral goods rather than just accumulate wealth? Like, if we can't have certain knowledge of future preferences, is prescribing a specific good life just epistemic overreach dressed up as economics?

  **Background and Literature Gap**
  The standard literature on Keynes's ethics tends to treat his moral philosophy and his economic epistemology as separate boxes. On one side, you have the commentators focusing on his Bloomsbury inheritance—G.E. Moore's *Principia Ethica*—arguing that Keynes's vision of the 'good life' in essays like *Economic Possibilities for our Grandchildren* is based on a fixed intuition of what constitutes 'states of mind' worth having. On the other side, you have the economists and philosophers of science analysing his *Treatise on Probability*, focusing on how he handles radical uncertainty, logical relations, and the weight of argument in decision-making.

  The problem is, these two conversations rarely speak to each other. When scholars discuss Keynes's prediction that we'll stop saving and start enjoying life once scarcity is solved, they usually treat it as a technological forecast or a moral wish. They don't test it against his own strict rules for rational belief. If Keynes argues in the *Treatise* that we cannot assign numerical probabilities to future economic states because the evidence is insufficient, does he not violate his own epistemic constraints when he confidently predicts a shift in human nature towards aesthetic appreciation? The existing literature doesn't settle this because it assumes his ethics are Moorean (fixed intuitions) and his economics are probabilistic (uncertain relations). I want to challenge that separation.

  **Methodology**
  My method will be a close textual comparison, primarily between the *Treatise on Probability* (1921) and his later normative essays, specifically *Economic Possibilities for our Grandchildren* (1930) and *The End of Laissez-Faire*. I'm not just looking for contradictions; I'm trying to construct what I'm calling a 'moral expectation' model.

  In standard expected utility theory, you multiply the probability of an outcome by its utility. But Keynes rejects numerical probability in many ethical contexts. So, I'll explore whether Keynes replaces 'utility' with 'weight of argument'. The idea is that the 'good life' isn't a fixed endpoint we know for sure, but rather the lifestyle that maximises the logical weight of favourable argument across possible future preference-states. I'll analyse whether Keynes views aesthetic pursuits as having a higher 'logical probability' of yielding satisfaction than wealth accumulation, regardless of specific future preferences. Essentially, I'm testing if his normative confidence is actually a probabilistic claim disguised as moral certainty.

  **Expected Outcomes and Success Criteria**
  A successful result would look like a reconstructed Keynesian ethics that is consistent with his epistemology. If I can show that Keynes isn't claiming we *know* future preferences, but rather that the 'weight of argument' favours moral goods under conditions of scarcity removal, then the charge of epistemic overreach fails. It would suggest his 'good life' is a robust heuristic for uncertainty, not a prophecy.

  However, I need to be honest about what counts as failure. If the analysis shows that Keynes's normative claims rely on fixed Moorean intuitions that explicitly bypass his probabilistic framework, then the project fails to find coherence. Alternatively, if the probabilistic framework actually supports strong normative claims via long-run frequency arguments (which Keynes generally rejects in favour of logical relations), that would also complicate the thesis. Essentially, if I end up proving Keynes was just inconsistent, that's a valid result, but less interesting than finding a hidden coherence.

  **Scope and Feasibility**
  For a one-semester module, the scope needs to be tight. I won't be covering the whole of Keynes's corpus or the entire history of probability theory. I'm focusing strictly on the tension between the 1921 *Treatise* and the 1930s essays. I'm also limiting the 'moral expectation' model to a theoretical sketch rather than a formal mathematical model, as that would drift too far into pure economics and away from value theory.

  There's a risk of getting bogged down in the technicalities of the *Treatise on Probability*, which is notoriously dense. To manage this, I'll focus only on the chapters dealing with the weight of argument and rational belief, ignoring the heavier mathematical logic unless directly relevant. This should keep the word count manageable and the argument clear. I reckon this is doable within the semester limits, provided I stick to the core question and don't wander into general Keynesian macroeconomics.

  **Conclusion**
  This project matters because it treats Keynes as a unified philosopher rather than a split personality of economist and moralist. If his epistemology undermines his ethics, it weakens the philosophical foundation of his vision for post-scarcity. If they cohere, it offers a novel way to think about rational choice under uncertainty that's relevant well beyond the 1930s. I'm confident there's enough meat here for a strong paper.
