answer: |-
  ### Conceptual Brainstorming & Epistemological Framing

  Before addressing your specific query, I must delineate the philosophical tensions inherent in your proposal. We are navigating three distinct layers of epistemic validation:

  1.  **Testimonial Authority vs. Internal Coherence:** Herodotus is weighing the *source* (Egyptian priests, representing institutional continuity) against the *content* (the logical plausibility of Trojan behavior). Modern historiography often separates these (source criticism vs. internal critique), but for Herodotus, they are intertwined.
  2.  **The Ontology of the "Archive":** Your concept of "archival drift" presupposes a mechanism of storage. In a pre-literate or semi-literate context (Bronze Age Greece), the "archive" is not a repository of documents but a repository of *ritualized speech*. The "drift" is not from paper to paper, but from *bardic performance* (celebratory, personalized) to *priestly recitation* (custodial, static).
  3.  **The Nature of "History":** When Herodotus accepts the Egyptian Helen, is he doing "history" in the Rankean sense (what actually happened), or is he performing a rationalist correction of theology? He is arguably doing the latter: saving the narrative from the absurdity of the poets.

  With these distinctions in mind, here is an analysis of Herodotus's reasoning through the lens of your "archival drift threshold."

  ***

  ### Herodotus and the Archival Drift Threshold

  Your concept of the **archival drift threshold**—the point where a narrative sheds heroic agency for bureaucratic or institutional logic to gain historical traction—is a potent heuristic. When applied to Herodotus's *Histories* (Book 2.112–120), it illuminates a tension between his *method* and his *source material*.

  To answer your central question directly: **Herodotus is operating primarily with a criterion of pragmatic inference (*eikos*), but this criterion leads him to validate a narrative that has already undergone the "archival drift" you describe.** He does not explicitly theorize the drift itself; rather, he intuits the *epistemic reliability* that results from it.

  #### 1. Rational Inference vs. Archival Status
  Herodotus's explicit justification for preferring the Egyptian account is not merely that it comes from priests (institutional memory), but that it aligns with *anthropina* (human nature). He argues that no rational political actor (Priam and the Trojans) would sustain a decade of devastation for a woman they could simply return.

  *   **The Pragmatic Criterion:** Herodotus employs *eikos* (probability). For him, truth is correlated with rational consistency. The Homeric version fails not because it lacks an "archive," but because it violates political rationality.
  *   **The Archival Drift:** However, notice *where* the rational version resides. It resides with the Egyptian priests, who claim to keep records (*grammata*) and maintain a continuous lineage of testimony. The Homeric version resides with the poets, who rely on *kleos* (glory) and Muse-inspired inspiration.

  Therefore, Herodotus's preference represents an **intuitive grasp of the *output* of archival drift, justified by rationalist inference.** He recognizes that the priestly version *looks* more like history because it has been stripped of the "heroic imperative." In the Egyptian version, Helen is not an agent of destiny or a prize of glory; she is a diplomatic liability stored in a depot (Egypt) while a phantom is fought over. This depersonalization fits your threshold perfectly. The story has moved from the *agon* (contest) of the battlefield to the *logos* (account) of the temple.

  #### 2. The Problem of "Pre-Archival" Societies
  You ask whether "archival drift" applies to pre-archival societies. This is the crux of the philosophical difficulty. Strictly speaking, an "archive" implies externalized memory (writing, tablets, steles). Bronze Age Greece was largely oral-formulaic.

  However, if we refine your concept to **"Institutional Memory Drift,"** it becomes highly applicable.
  *   **Bardic Memory (Legend):** Optimized for retention through meter and exaggeration. It amplifies individual agency (Achilles' rage, Paris's lust) because individual agency is memorable.
  *   **Priestly Memory (Provisional History):** Optimized for retention through ritual succession and static repetition. It tends to flatten agency into roles and protocols.

  Herodotus treats the Egyptian priesthood as a "human archive." He believes their story *because* their institution is designed to preserve facts rather than glorify heroes. Thus, the "drift" is not about the existence of writing per se, but about the **sociological function of the narrators.** When a narrative moves from the bard (who needs the hero to be great) to the priest (who needs the record to be consistent), it crosses your threshold. Herodotus senses this shift in authority, even if he articulates it as a shift in logical plausibility.

  #### 3. Implications for Modern Legendary Histories
  Your framework, illuminated by Herodotus's method, offers a robust tool for analyzing modern debates surrounding the historicity of the Trojan War, King Arthur, and the Exodus. In each case, the "Archival Drift Threshold" marks the boundary between mythology and provisional history.

  **A. The Trojan War**
  *   **Legendary Mode:** Homer. The war is caused by divine strife and personal abduction. Agency is hyper-personalized.
  *   **Historical Mode:** Hittite diplomatic records and archaeological strata. Here, the "Helen" figure disappears entirely. The conflict is reframed as a struggle over trade routes (the Dardanelles) and vassal status (Wilusa/Troy).
  *   **Herodotean Parallel:** Just as Herodotus rejected the "abduction" for a "political misunderstanding," modern historians accept the war as "history" only when the *casus belli* shifts from a woman to economics/geopolitics. This is the archival drift: the story becomes history when the *agents* become states rather than individuals.

  **B. King Arthur**
  *   **Legendary Mode:** Geoffrey of Monmouth. Arthur is a messianic hero, slaying dragons and giants. High personalized agency.
  *   **Historical Mode:** *Annales Cambriae* or Gildas. Arthur becomes a *dux bellorum* (leader of battles), a functionary in a post-Roman military collapse.
  *   **The Threshold:** Arthur crosses into "history" for scholars only when the narrative is stripped of the Grail, Merlin, and the personal chivalry, and is instead embedded in the bureaucratic collapse of Roman Britain. The "drift" is the removal of the magical/heroic in favor of the structural/military.

  **C. The Exodus**
  *   **Legendary Mode:** The Biblical narrative. Miracles, direct divine intervention, a singular charismatic leader (Moses).
  *   **Historical Mode:** Egyptological records (or lack thereof). Historians look for the "drifted" version: the expulsion of the Hyksos, or the migration of Habiru groups as a socioeconomic phenomenon rather than a theological event.
  *   **The Threshold:** The Exodus becomes "historical" (in the academic sense) only when the agency is depersonalized. If Moses is the sole agent, it remains legend. If the Exodus is a symptom of Late Bronze Age systemic collapse, it approaches history.

  ### Conclusion: The Epistemology of Depersonalization

  Herodotus's reasoning in Book 2 reveals a profound insight: **Historical plausibility is often inversely proportional to heroic intensity.**

  He does not explicitly name your "archival drift threshold," but he operationalizes it. He recognizes that the Egyptian priests preserve a version of the past that has been "cooled down"—stripped of the heat of poetic glory and rendered into the cold logic of political self-preservation.

  To answer your specific dichotomy: Herodotus is not operating with an *entirely* different criterion, nor is he fully grasping your modern theoretical construct. Rather, **his criterion of pragmatic inference (*eikos*) is the mechanism by which he detects the archival drift.** He assumes that rational behavior is the marker of truth, and he observes that institutional (priestly) narratives tend to preserve rational behavior better than heroic (poetic) narratives.

  Your concept of "archival drift" provides the structural explanation for *why* the Egyptian story looks the way it does (depersonalized, bureaucratic), while Herodotus provides the epistemological justification for *why we should believe it* (it makes sense given human nature).

  In modern historiography, this remains the central tension. We accept legends as history only when they undergo this drift: when Arthur becomes a warlord, when the Trojan War becomes a trade dispute, and when Helen becomes a diplomatic pretext. We, like Herodotus, are convinced not by the glory of the story, but by its banality. The "Archival Drift Threshold" is, ultimately, the point where the story becomes boring enough to be true.
