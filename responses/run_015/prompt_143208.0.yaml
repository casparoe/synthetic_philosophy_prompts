      *   The Trial: Tom Robinson's guilt is predetermined by race, not evidence.
      *   Boo Radley: The ultimate "other" who is humanized at the end.
      *   Structural Racism: The legal and social system of Maycomb.

  4.  **Synthesize: The "Asymmetric Sympathy" Problem:**
      *   *The Fit:* Atticus *tries* to be the impartial spectator. He urges the jury to do the same. Scout learns to do this with Boo.
      *   *The Gap:* Smith's spectator assumes a level playing field of moral judgment. In Maycomb, the "impartial" spectator is actually a *white* spectator. The structural reality (racism) prevents true "changing places."
      *   *Atticus's Shortcoming:* He embodies the ideal but fails to change the outcome. Why? Because his sympathy is paternalistic. He understands Tom's plight but cannot *be* Tom.
      *   *Scout's Growth:* Her realization about Boo is more successful because the barrier is fear/gossip, not entrenched legal racism. But even then, Boo remains silent/voiceless.
      *   *Lee's Critique of Smith:* Lee suggests imagination isn't enough. You need *power* redistribution or at least an acknowledgment of structural impossibility. Smith thinks imagination leads to moral action; Lee shows imagination hitting a wall of social structure.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the "asymmetric sympathy" concept. State the thesis: Lee confirms Smith's mechanism but exposes its structural limits.
      *   **Atticus and the Impartial Spectator:**
          *   Atticus *is* the spectator. He judges Maycomb by a higher standard.
          *   *The Failure:* The jury cannot become impartial because their "spectator" is corrupted by white supremacy.
          *   *Atticus's Limit:* He sympathizes *for* Tom, not *as* Tom. It's a benevolent distance. This fits the "asymmetric" critique.
      *   **Scout and Boo Radley:**
