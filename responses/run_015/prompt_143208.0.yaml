answer: |-
  This is a remarkably fertile intersection of texts. You have identified the precise friction point where eighteenth-century moral philosophy crashes against twentieth-century structural realism. Your concept of "asymmetric sympathy" is the key: Smith assumes the imagination can bridge the gap between self and other, but he underestimates how hierarchy calcifies that gap into a wall.

  Here is a reading of *To Kill a Mockingbird* through Smith's *The Theory of Moral Sentiments*, focusing on where the framework holds, where it fractures, and how Lee dramatizes the limits of the impartial spectator.

  ### 1. Atticus and the Corrupted Spectator
  Atticus Finch is the novel's explicit avatar for the Smithian ideal. His instruction to Scout—"climb into his skin and walk around in it"—is a vernacular translation of Smith's "change places in fancy." Atticus attempts to embody the impartial spectator in a partial world. He judges his own conduct and the conduct of Maycomb against a universal standard of justice, rather than local custom.

  However, Lee exposes a flaw in Smith's mechanism regarding *who* gets to be the spectator. For Smith, the impartial spectator is an internalization of the community's moral norms, refined by reason. In Maycomb, the "community" whose norms are internalized by the jury is exclusively white. When Atticus appeals to the jury to look at the evidence without "distortion," he is asking them to activate an impartial spectator that their social conditioning has disabled.

  This is where your "asymmetric sympathy" becomes critical. Atticus can imagine Tom Robinson's plight, but he cannot inhabit Tom's structural position. Atticus's sympathy is benevolent but vertical; he looks down with understanding, not across with shared vulnerability. Smith argues that sympathy leads to moral action, but Lee shows that sympathy without power is tragic. Atticus's internal spectator functions perfectly—he knows he is right—but the external social machinery ignores it. Lee suggests that Smith's model works only when the spectators share a similar status. When the "other" is racialized as subhuman, the imaginative leap is blocked not by a lack of imagination, but by a social imperative to maintain hierarchy. The jury *knows* Tom is innocent (evidence), but their "spectator" judges that convicting him is necessary for social order. Smith assumes the spectator seeks truth; Lee shows the spectator often seeks stability.

  ### 2. Scout, Boo Radley, and the Limits of Imagination
  Scout's arc with Boo Radley is the novel's successful test case for Smith, which makes the failure of the trial even more damning. With Boo, the barriers are psychological and gossip-based, not structural and legal. Scout moves from viewing Boo as a "malevolent phantom" to standing on his porch and seeing the neighborhood through his eyes.

  This is pure Smith: the moral sentiment arises from the imaginative act of viewing oneself from the other's vantage point. When Scout says, "Atticus was right. One time he said you never really know a man until you stand in his shoes and walk around in them," she confirms the Smithian thesis.

  However, even here, Lee introduces a complication regarding voice. Boo never speaks for himself. His humanity is recognized entirely through Scout's projection. Smith's sympathy relies on the spectator's imagination, not the object's testimony. Lee dramatizes this silence. Boo is the "mockingbird"—a creature who can be sympathized with but never fully integrated. Scout's sympathy is successful, but it remains paternalistic. She protects him, she understands him, but she does not equalize with him. This reinforces your point: the spectator retains the power. The sympathy is real, but it does not dismantle the hierarchy that made Boo an outcast in the first place. It resolves Scout's moral education, but it leaves Boo's social position unchanged.

  ### 3. Structural Weight vs. Imaginative Projection
  This is the core of your critique regarding Smith. Smith treats sympathy as a psychological mechanism: if I try hard enough to imagine your pain, I will feel it, and I will act morally. Lee argues that social structure weighs more than individual imagination.

  In the trial scenes, the "structural weight" is the history of slavery and Jim Crow. Atticus asks the white spectators to ignore that weight. They cannot. Smith's framework assumes a level of shared humanity that racism explicitly denies. If the system defines the Black defendant as fundamentally "other," the white spectator cannot "change places" because to do so would be to cease being white in that society.

  Lee dramatizes something Smith misses: that true understanding requires **social vulnerability**, not just imaginative projection. Atticus is vulnerable (he risks his reputation, his children's safety), but Tom Robinson is *existentially* vulnerable. Smith's spectator stands on solid ground and looks out; Lee shows that moral truth often requires standing on ground that is crumbling beneath you.

  Scout's realization about Boo comes only after she has been physically attacked and saved by him. The sympathy is cemented by shared trauma and physical proximity, not just abstract thought. Smith prioritizes the mental act of imagination; Lee suggests the physical act of co-presence and risk is required for the spectator to become truly impartial. Without the threat of Bob Ewell's knife, Scout's sympathy for Boo might have remained theoretical.

  ### 4. Does Lee Resolve the Gap?
  Lee does not resolve the gap, and that is her philosophical contribution. If she had Tom Robinson acquitted through Atticus's eloquence, she would be validating Smith's idea that the impartial spectator can triumph over prejudice. By having Tom convicted and killed, she validates your "asymmetric sympathy."

  The novel suggests that the impartial spectator is a luxury of the privileged. Atticus can afford to be impartial because his whiteness protects him even when he loses. Tom cannot be impartial; he must be strategic to survive. Smith's theory assumes a symmetry of moral agency that does not exist in Maycomb.

  However, Lee leaves a door open with Scout. The book ends not with the legal system fixed, but with a child's moral consciousness altered. Lee shifts the locus of change from the public sphere (the court/Smith's market of sentiments) to the private sphere (the porch/the individual conscience). She seems to argue that while the structural gap may be unbridgeable in the short term (Tom dies), the *capacity* for sympathy must be cultivated in the next generation (Scout) to slowly erode the structure.

  ### 5. Conclusion: Sympathy as Insufficient but Necessary
  Through Smith's lens, *To Kill a Mockingbird* looks like a tragedy of failed sympathy. Through Lee's lens, Smith's philosophy looks like a blueprint that lacks a foundation.

  Lee confirms Smith's diagnosis: moral failure stems from a failure to imagine the other. But she rejects his prognosis: that imagination alone is sufficient for justice. She demonstrates that without an acknowledgment of power dynamics, sympathy becomes a form of condescension. Atticus sympathizes *with* Tom, but he cannot sympathize *as* Tom.

  For your book club, the takeaway is this: Smith provides the vocabulary for Atticus's morality, but Lee provides the critique of its limits. The "impartial spectator" is not a neutral god; it is a product of its environment. In a racist society, the spectator is racist. Lee argues that to make the spectator truly impartial, you first have to dismantle the hierarchy that distorts the view. Sympathy is the engine of moral change, but Lee warns us not to confuse the engine with the road. You can have a running engine (Atticus's conscience) and still go nowhere if the road is blocked (structural racism).

  Lee ultimately suggests that Smith's "impartial spectator" needs to be upgraded to a "vulnerable participant." We don't just watch the moral play; we are in it, and our safety is not guaranteed. That is the gap Smith never foresaw, and the gap Lee forces us to stare at.
