      *   *Operational Reality:* It doesn't matter if the atmosphere is deterministic if the *forecast system* isn't predictable. The "Butterfly Effect" (sensitive dependence on initial conditions - SDIC) means errors grow exponentially until they saturate the climate variance. Model error (structural uncertainty) means even perfect initial conditions won't yield perfect forecasts.
      *   *Key Distinction:* Predictability $\neq$ Determinism.
      *   *Key Operational Concept:* "Decision-Irrelevant Uncertainty." If all ensemble members say "flood," it doesn't matter if they disagree on the exact water height by 10cm, provided the threshold is 1m.

  3.  **Develop the Decision Procedure (The "Duty Desk Protocol"):**
      *   *Goal:* Sort uncertainty into buckets:
          1.  **Initial Condition Uncertainty (ICU):** "We don't know the start state." (Reducible with better obs/assimilation).
          2.  **Model Uncertainty (MU):** "The physics are wrong." (Reducible with better models/multi-model).
          3.  **Intrinsic Chaos (IC):** "The system is sensitive." (Irreducible beyond a time limit).
