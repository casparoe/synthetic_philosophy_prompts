      *   **The Conflict:** User argued with a physicist friend about determinism vs. predictability. Friend says "better obs + more compute = perfect forecast." User knows "sensitive dependence + model error = intrinsic unpredictability."
      *   **The Need:** A practical, actionable decision procedure (checklist/flowchart style) to categorize uncertainty into actionable buckets. No philosophy, no references. Needs to handle three specific cases (levee overtop, seasonal outlook, road closure). Needs to identify limitations and provide wording guidance.

