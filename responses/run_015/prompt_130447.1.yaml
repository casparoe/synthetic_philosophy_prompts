answer: |-
  You were right, your friend was wrong *operationally*. He is arguing from theoretical physics (Laplacian determinism); you are arguing from operational meteorology (finite predictability). In your job, it does not matter if the atmosphere is deterministic. What matters is whether your *forecast system* is stable. If a 1% error in today's soil moisture measurement doubles every 48 hours, you have a predictability horizon, regardless of how many supercomputers you buy.

  Here is the decision procedure you asked for. It is designed to be written into your shift log. If you follow this flow, you have a defensible audit trail for an inquiry.

  ### The Duty Desk Uncertainty Protocol

  **Goal:** Classify the uncertainty to determine the action.
  **Inputs:** Ensemble A (Internal), Ensemble B (External), Verification (Yesterday's Error), Nudge Test (Optional).
  **Time Budget:** 5–10 minutes per significant event.

  #### Step 1: The Consensus Check (Model Structural Error)
  *Compare the means of Ensemble A and Ensemble B.*
  *   **Question:** Do the two model means differ by more than 20% of the action threshold (e.g., if flood stage is 5m, do they differ by >1m)?
  *   **Yes:** You have **Model Uncertainty**. The physics packages disagree.
      *   *Action:* Do not average them. Treat the worst-case model as the "planning" scenario and the best-case as the "lower bound." Escalate to Duty Manager.
  *   **No:** Proceed to Step 2.

  #### Step 2: The Spread Growth Check (Intrinsic Chaos)
  *Look at the ensemble spread (standard deviation or 10th–90th percentile range) at 24h, 48h, and 72h.*
  *   **Question:** Does the spread grow exponentially (small at 24h, huge at 72h) or is it already wide at 24h?
  *   **Wide at 24h:** You have **Immediate Instability**. The system is already in a sensitive regime (e.g., convective initiation).
      *   *Action:* Assume high uncertainty. Rely on Step 4.
  *   **Grows with time:** This is standard **Predictability Decay**.
      *   *Action:* Trust the 24h more than the 72h. Proceed to Step 3.

  #### Step 3: The Verification Check (Initial Condition Error)
  *Compare Yesterday's Forecast Spread vs. Yesterday's Actual Error.*
  *   **Question:** Was yesterday's actual observation *outside* yesterday's forecast spread?
  *   **Yes:** Your ensemble is **Under-dispersive**. You are overconfident. The "true" uncertainty is wider than the model says.
      *   *Action:* Inflate your perceived spread by 50% for today's decision.
  *   **No:** Your ensemble is capturing the error statistics. Proceed to Step 4.

  #### Step 4: The Nudge Test (Sensitivity)
  *You mentioned this. It is valid. It is a finite-difference approximation of sensitivity.*
  *   **Action:** Perturb the initial soil moisture or boundary inflow by $\pm$1 standard deviation of your observation error. Rerun (or use pre-calculated sensitivity members if available).
  *   **Question:** Does this small nudge flip the decision (e.g., from "No Flood" to "Flood")?
  *   **Yes:** You are in a **Critical Transition Zone**. The system is too sensitive to observation error.
      *   *Action:* You cannot reduce this uncertainty with better data right now. Treat as high risk.
  *   **No:** The solution is robust to analysis error. Proceed to Step 5.

  #### Step 5: The Decision Threshold Check (Relevance)
  *Overlay the full ensemble spread (all members, both models) on the action threshold (e.g., road closure level, levee crest).*
  *   **Question:** Do *all* members exceed the threshold?
  *   **Yes:** **Decision-Irrelevant Uncertainty.** It doesn't matter if they disagree on the height; they agree on the impact.
      *   *Action:* Execute the action (Close road, warn neighbourhood). Do not hide behind "model spread."
  *   **Question:** Do *no* members exceed the threshold?
      *   **Action:** Stand down.
  *   **Question:** Do *some* members exceed and some do not?
      *   **Action:** **Decision-Relevant Uncertainty.** This is the only time you issue a "Watch" or "Probability" statement. Escalate to Duty Manager for risk tolerance call.

  ---

  ### Application to Your Three Cases

  #### Case 1: 48h Levee Overtop (Bimodal Split)
  *   **Situation:** Models agree on rain, but Ensemble A splits 50/50 on overtopping.
  *   **Protocol Run:**
      *   Step 1: Models agree on input (Rain). Pass.
      *   Step 2: Spread is huge at 48h. Intrinsic Chaos/Non-linearity in river routing.
      *   Step 4 (Nudge): Likely flips the outcome (sensitive to timing of peak).
      *   Step 5: Some members over, some under. **Decision-Relevant Uncertainty.**
  *   **Verdict:** This is a "Watch" scenario, not a "Warning" yet, *but* you must pre-position pumps.
  *   **Bulletin Wording:** "High confidence in significant rainfall. High uncertainty in peak timing relative to tide levels. Probability of overtopping 50%. Pre-positioning resources."
  *   **Defensibility:** You acknowledged the risk without committing to a binary outcome that might be wrong. You triggered the precautionary principle (pumps) without triggering the evacuation order (which requires higher confidence).

  #### Case 2: The Seasonal Outlook ("Wetter than Average")
  *   **Situation:** 3-month outlook, farmers acting on it.
  *   **Protocol Run:**
      *   Step 1: N/A (Seasonal models are boundary-forced, not initial-condition forced).
      *   Step 2: Spread does not grow with time in the same way; it saturates immediately based on ocean boundary uncertainty.
      *   Step 5: The "Threshold" is "Average."
  *   **Verdict:** **Stop calling this a Forecast.** It is a **Probabilistic Tilt**.
  *   **The Argument:** Your friend's determinism argument fails here completely. Seasonal forecasting is not about predicting specific rain days; it is about shifting the odds. If you issue "Wetter than Average," a farmer cannot plan a specific harvest day.
  *   **Bulletin Wording:** Change "Forecast" to "Outlook." Change "Will be wetter" to "60% probability of exceeding median rainfall."
  *   **Defensibility:** If you write "Forecast," you are liable for the specific outcome. If you write "Probability Tilt," you are only liable for the statistical calibration. If you issue this outlook 10 times, it should rain more than average 6 times. If it doesn't, your model is broken. If it does, you are safe even if this specific quarter is dry. **Recommendation:** Add a disclaimer that this is not for operational flood warning, only for strategic planning.

  #### Case 3: 6h Road Closure (Wide Spread, Same Action)
  *   **Situation:** Spread is wide (0.5m to 2.0m), road closes at 0.3m.
  *   **Protocol Run:**
      *   Step 5: All members > 0.3m.
  *   **Verdict:** **Decision-Irrelevant Uncertainty.**
  *   **Action:** Close the road.
  *   **The Trap:** Do not write "Uncertainty is high." To the public and the inquiry, "Uncertainty is high" sounds like "We don't know if we should close it."
  *   **Bulletin Wording:** "Flooding certain. Depth uncertain. Road closure required."
  *   **Defensibility:** You protected life/property. The fact that you didn't know the exact depth is irrelevant to the binary decision of closure. If you kept it open because "the models disagreed on depth," you would be negligent.

  ---

  ### Where The Procedure Will Misfire (Limitations)

  You need to know where this checklist fails so you can document the exception.

  **1. Non-Stationarity (The "New Development" Problem)**
  *   **Failure Mode:** Your verification (Step 3) uses past error stats. If a new housing estate paved over a floodplain last month, the old stats are wrong. The model will underestimate the peak.
  *   **Fix:** If you know of catchment changes, manually inflate the spread in Step 3. Document: "Verification stats adjusted for known land-use change."

  **2. Structural Failure (The "Levee Breach" Problem)**
  *   **Failure Mode:** Hydrological models assume the levee holds. They do not model geotechnical failure. If the water is 1cm below the crest, the model says "Safe." In reality, a piping failure could breach it.
  *   **Fix:** This is a values/risk question, not a physics question. If water is within 5% of crest height, escalate to Duty Manager immediately. The procedure stops; human judgment takes over.
  *   **Wording:** "Risk of structural failure cannot be ruled out at these levels."

  **3. The "Black Swan" Input**
  *   **Failure Mode:** A dam fails upstream, or a landslide blocks the river. This is not in the ensemble.
  *   **Fix:** Rely on real-time telemetry, not the model. If telemetry diverges from the model, throw the model out.
  *   **Wording:** "Forecast superseded by observed conditions."

  ### Summary for the Bulletin (Defensible Language)

  *   **Bucket 1 (Reducible/IC Error):** "Confidence will increase with next run." (Implies we just need better data).
  *   **Bucket 2 (Irreducible/Chaos):** "Small changes in initial conditions lead to large outcome differences." (Implies this is the best we can do).
  *   **Bucket 3 (Model Error):** "Significant divergence between modelling systems." (Implies the physics is uncertain).
  *   **Bucket 4 (Decision-Irrelevant):** "Impact is certain despite range in magnitude." (Implies action is mandatory).

  **Final Note on Your Friend:**
  He is confusing *causality* with *predictability*. Yes, the atmosphere is causal. But because you cannot measure the current state to infinite precision (and because your model grid is 1km, not 1mm), the errors grow. In your job, **predictability is the horizon where the cost of the error exceeds the value of the forecast.** That horizon is often much shorter than the theoretical deterministic horizon. Stick to the procedure. It protects the public, and it protects your license.
