  *(Mental check on Case 2)*: Seasonal forecasting is distinct from weather forecasting. It relies on boundary conditions (ocean temps) rather than initial atmospheric state. The uncertainty is different. I need to make sure the procedure acknowledges this distinction or treats it as a separate class. I will treat it as a "Boundary-Forced" bucket in the analysis.

