  He is running **Rule 2: Counterfactual Robustness**, constrained by Rule 1.

  **Why?**
  A "Dennett-pilled" reader knows that Dennett's definition of a *Real Pattern* is explicitly **noise-independent**. In *Real Patterns* (1991), Dennett argues that for a pattern to be real, it must survive the "noise" of instantiation.
  *   **The Seed is Noise:** In deep learning, the random seed is the paradigmatic example of noise. If a feature vanishes when you change the seed, it is not a property of the *system*, it is a property of the *trajectory*.
  *   **The Distribution is Context:** If the probe only works within the training distribution, it is overfitting. Dennett distinguishes between *prediction* (which can be lucky) and *stance-taking* (which relies on rationality/structure). An overfit direction is a Physical coincidence, not a Design feature.
