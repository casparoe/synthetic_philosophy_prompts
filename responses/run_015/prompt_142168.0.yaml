answer: |-
  # HANDOUT: CLASSIFYING UNITS OF SELECTION
  **Seminar Session: The Units of Selection Problem**

  ### I. GLOSSARY OF TERMS
  *   **Replicator:** An entity that passes its structure on largely intact through successive generations (e.g., a gene, a meme).
  *   **Interactor (Vehicle):** An entity that interacts with the environment as a cohesive whole, causing differential replication of replicators (e.g., an organism, a colony).
  *   **Heritability:** The statistical correlation between parent and offspring traits; requires variation, differential fitness, and inheritance.
  *   **Emergent Trait:** A property of a collective that is not reducible to the simple sum of the properties of its members (e.g., colony fission rate vs. average worker lifespan).
  *   **Sorting:** Change in frequency of types due to differential extinction/survival of groups without group-level reproduction.

  ---

  ### II. DECISION TREE
  *Answer the questions based on your intuition about the **diagnostic cases** (segregation distorters, sterile workers, founder groups, etc.). Follow the path to a position.*

  **NODE 1: THE "OF / FOR" DISTINCTION**
  Is the primary question asking what entity is **causally responsible** for frequency change (Unit *of* Selection), or who is the **beneficiary** of the trait's design (Unit *for* Adaptation)?
  *   **Causal Responsibility** → Go to Node 2.
  *   **Beneficiary/Design** → Go to Node 9.

  **NODE 2: REPLICATOR VS. INTERACTOR**
  To explain the frequency change, must you track the **replicator** (gene/allele) directly, or is tracking the **interactor** (phenotype/organism) sufficient?
  *   **Must Track Replicator** → Go to Node 3.
  *   **Tracking Interactor Sufficient** → Go to Node 4.

  **NODE 3: METAPHYSICAL VS. HEURISTIC**
  Is the claim that "the gene is the unit" a **fundamental truth** about what evolution *is*, or merely a **bookkeeping convention** that always works?
  *   **Fundamental Truth** → **LEAF A: Strict Gene Selectionism**.
  *   **Bookkeeping Convention** → **LEAF B: Weak Genic Selectionism**.

  **NODE 4: ORGANISM VS. COLLECTIVE**
  Does the interaction with the environment happen primarily at the level of the **single organism**, or can **groups/collectives** act as cohesive interactors?
  *   **Single Organism** → **LEAF C: Organism-Level Selectionism**.
  *   **Groups/Collectives** → Go to Node 5.

  **NODE 5: SORTING VS. LINEAGE**
  Does the group need to **reproduce as a group** (lineage continuity), or is it enough that groups **sort** (differential survival of transient groups)?
  *   **Transient Sorting Only** → **LEAF D: Trait-Group Selection**.
  *   **Group Lineage Required** → Go to Node 6.

  **NODE 6: AGGREGATE VS. EMERGENT FITNESS**
  Is group fitness defined by the **average fitness of members** (individuals reproduce), or by the **rate of group proliferation/extinction** (groups reproduce)?
  *   **Average Member Fitness** → **LEAF E: Multilevel Selection 1 (MLS1)**.
  *   **Group Proliferation/Extinction** → Go to Node 7.

  **NODE 7: CLADE VS. POPULATION GROUP**
  Is the reproducing collective a **species/clade** (macroevolution) or a **local population/colony** (microevolution)?
  *   **Species/Clade** → **LEAF F: Species Selection**.
  *   **Local Population/Colony** → Go to Node 8.

  **NODE 8: INTEGRATION LEVEL**
  Has the collective undergone a **major transition** to become a new biological individual (high integration), or does it remain a **loose association** of lower-level units?
  *   **New Biological Individual** → **LEAF G: Group-as-Organism**.
  *   **Loose Association** → **LEAF H: Multilevel Selection 2 (MLS2)**.

  **NODE 9: GENETIC VS. CULTURAL TRANSMISSION**
  (From Node 1: Beneficiary) Is the trait transmitted via **genetic inheritance** or **social learning/imitation**?
  *   **Genetic Inheritance** → **LEAF I: Kin Selection / Inclusive Fitness**.
  *   **Social Learning** → **LEAF J: Cultural Group Selection**.

  ---

  ### III. POSITION SUMMARIES & AWKWARD COMMITMENTS

  | Leaf | Position | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Strict Gene Selectionism** | Organisms are merely "survival machines" with no causal autonomy; all apparent organismal adaptation is illusory. |
  | **B** | **Weak Genic Selectionism** | Gene-selectionism is empirically empty; it is a translation manual, not a claim about how the world works. |
  | **C** | **Organism-Level Selectionism** | Group adaptations are so rare they can be ignored; apparent group benefits are usually byproducts of selfish genes. |
  | **D** | **Trait-Group Selection** | A one-off sorting event (like founder groups) counts as selection even without a continuing group lineage. |
  | **E** | **Multilevel Selection 1 (MLS1)** | Group selection is just individual selection in a social context; "group fitness" is a statistical aggregate, not a real rate. |
  | **F** | **Species Selection** | A trait can be selected even if it lowers the fitness of every organism bearing it (e.g., lineage sorting traits). |
  | **G** | **Group-as-Organism** | The colony is an individual; sterile workers are somatic cells, making the "altruism" problem disappear. |
  | **H** | **Multilevel Selection 2 (MLS2)** | Groups can be units of selection even if they are not fully integrated individuals (e.g., colonial chimeras). |
  | **I** | **Kin Selection** | An organism can be selected to reduce its own reproduction if it aids copies of its genes in relatives. |
  | **J** | **Cultural Group Selection** | Cultural variants are replicators in the same logical sense as genes, despite lacking molecular fidelity. |

  ---

  ### IV. META-ANALYSIS: LOGICAL SPACE & COLLAPSES

  **1. Empty Regions of Logical Space**
  *   **Selection without Heritability:** A region where frequency changes predictably but without inheritance (e.g., pure drift or one-off sorting without replication). *Status:* Generally considered **incoherent** as "selection." Most philosophers define selection *requires* heritability. This is why Node 5 forces a choice between Sorting (often reclassified as drift) and Lineage.
  *   **Group Adaptation without Group Selection:** The view that groups look designed but no group-level causal process produced them. *Status:* **Unattractive.** It posits a "pre-established harmony" between individual selection and group benefit, which is empirically unsupported in conflict cases (e.g., segregation distorters).
  *   **Cultural Selection without Group Structure:** Cultural variants spreading purely by individual prestige bias without inter-group competition. *Status:* **Neglected.** It exists (Node 9 forces Group), but often fails to generate *adaptive* design at the group level, merely spreading costly taboos.

  **2. Indistinguishable Leaves (Collapses)**
  *   **Leaf I (Kin Selection) vs. Leaf E (MLS1):**
      *   *The Collapse:* Under standard assumptions (additive fitness effects), the mathematical equations for Inclusive Fitness and MLS1 are identical.
      *   *Substantive or Verbal?* **Largely Verbal.** They partition the same causal variance differently. Kin selection partitions by *relatedness*; MLS1 partitions by *group structure*.
      *   *The Assumption:* The collapse holds only if fitness effects are **additive**. If there are non-linear synergies (e.g., threshold public goods), MLS1 captures causal structure better than Kin Selection.
  *   **Leaf A (Strict Genic) vs. Leaf B (Weak Genic):**
      *   *The Collapse:* Both views use the same gene's-eye calculus to predict outcomes.
      *   *Substantive or Verbal?* **Metaphysical.** There is no empirical test to distinguish "genes are really the only units" from "genes are the most convenient bookkeeping."
      *   *The Assumption:* The distinction relies on a commitment to **reductionism**. If you believe higher-level causal powers are real (emergence), Leaf B is the only coherent option; if you are a reductionist, Leaf A is forced.
  *   **Leaf G (Group-as-Organism) vs. Leaf C (Organism-Level):**
      *   *The Collapse:* If a group becomes a fully integrated individual (Leaf G), it *is* an organism.
      *   *Substantive or Verbal?* **Substantive (Historical).** The distinction depends on where you draw the line of "individuality."
      *   *The Assumption:* Relies on the **Major Transition** framework. If you deny that transitions create new ontological individuals, Leaf G collapses into Leaf H (MLS2).

  **3. Diagnostic Case Mapping**
  *   *Segregation Distorter:* Forces Node 2 (Replicator).
  *   *Sterile Worker:* Forces Node 9 (Kin) or Node 6/8 (MLS/Group-Organism).
  *   *Founder Groups:* Forces Node 5 (Sorting).
  *   *Transmissible Cancer:* Forces Node 7 (Lineage without Organism).
  *   *Cultural Variant:* Forces Node 9 (Cultural).
  *   *Lineage Sorting Trait:* Forces Node 7 (Species).
