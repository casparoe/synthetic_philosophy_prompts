      *   **Specific Model:** Five incidents of fiduciary power (Loyalty/No-Conflict, Mandate Limits, Care/Repair, Impartiality, Accountability/Exit).
      *   **Specific Case:** Libya 2011 (Res 1973, NATO intervention, regime change, aftermath).
      *   **Tasks:**
          1.  Map the model to Libya (Trustee, Beneficiary, Trust Property, Breaches).
          2.  Evaluate added value vs. standard critique (especially regarding abstentions).
          3.  Identify model silences/weaknesses (Multi-trustee, Accountability forum, Exit timing).
