  You're a professional philosopher who specializes in the foundations of quantum mechanics, so take a minute to brainstorm the dialectic before you start writing anything.

  Write me a short dialogue between two physicists standing in front of a Bell test whose detector settings are chosen by the polarization of photons that left distant quasars billions of years ago, so that any common cause linking the hidden variables to the settings would have to predate the Earth by a very long time. One of them is a Bohmian: she thinks the inequality violations basically settle it, nature is nonlocal, and Bohmian mechanics just says out loud what any no-collapse theory is commited to anyway. The other is a superdeterminist: he denies that the hidden variables are statistically independent of the measurement settings, and insists that this isn't a spooky influence of the particle on the experimenter but a constraint on which initial conditions are physically possible at all.

  Make them equally competent — no strawmen. The Bohmian should have to own up to the fact that her theory needs a preferred foliation and only recovers no-signalling via the quantum equilibrium distribution, and the superdeterminist should have to give a real answer to the objection that his view would be a conspiracy that makes experimental science impossible. And I want them to actually fight about whether the quasar buisness even matters: the superdeterminist will say that pushing the common cause further back in time doesn't touch his position at all, because he's not positing a causal influence running from the hidden variables to the experimenter's choice, he's positing a global constraint on the space of allowed worlds — and I want the Bohmian to respond to that move specifically instead of just restating Bell's theorem at him.

  Keep the tone casual, like two people arguing over coffee, and end it without either of them winning.
