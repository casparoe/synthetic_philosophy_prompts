answer: |-
  Here is the specification sheet for a viable theory of self-deception. This breaks down the phenomenon into functional requirements, distinguishes between hard constraints and theoretical preferences, and stress-tests the major accounts against the architecture.

  ### I. The Specification Sheet

  A serious theory must satisfy the following conditions to account for the data without collapsing into triviality or contradiction.

  #### A. Phenomenological Coverage (The Cases)
  1.  **The Avoidant Spouse:** Must explain how an agent gathers evidence of infidelity but processes it as "ambiguous" to maintain the belief of fidelity.
  2.  **The Compulsive Addict:** Must account for the agent who assents to "smoking kills" abstractly but operates on "I am the exception" practically during the act.
  3.  **The Leakage/Overcompensation:** Must explain behavioral telltales (e.g., the cheating spouse accusing the partner of cheating, or the addict buying gym equipment they never use).
      *   *Status:* **Non-Negotiable.** If the theory cannot map these specific behavioral profiles, it is describing a different phenomenon.

  #### B. Conceptual Distinctions (The Boundaries)
  4.  **Vs. Plain Ignorance:** The agent must differ from someone who simply lacks evidence. The self-deceived agent *has* the evidence but mishandles it.
  5.  **Vs. Ordinary Wishful Thinking:** Wishful thinking is hoping $p$ is true; self-deception involves *believing* $p$ is true despite evidence, driven by the desire.
  6.  **Vs. Lying to Others:** The mechanism cannot rely on a second person. The deceiver and deceived are the same agent at the same time.
  7.  **Vs. Clinical Denial:** Must distinguish from psychotic denial or neurological anosognosia where the cognitive machinery to process the truth is broken, not biased.
      *   *Status:* **Non-Negotiable.** Collapsing these distinctions makes the concept of self-deception useless (it becomes just "being wrong").

  #### C. Psychological & Dynamic Constraints (The Mechanics)
  8.  **The Motivation Constraint:** The false belief must serve a protective function (reducing anxiety, preserving self-image).
  9.  **The Reversibility Constraint:** The state cannot be permanent. Agents can "snap out of it" when the cost of deception becomes too high or evidence becomes overwhelming.
  10. **The Epistemic Leakage Constraint:** The suppressed truth ($p$) must remain causally potent enough to drive indirect behavior (leakage), even while the conscious belief is not-$p$.
      *   *Status:* **Non-Negotiable.** (As per your constraint). Without this, you have merely redescribed ignorance. The truth must be "in the room" enough to haunt the agent, but not enough to convict them.

  #### D. Architectural Preferences (The Camp Divides)
  11. **The Intentionality Condition:** Does the agent *strategically* manipulate their own evidence?
      *   *Status:* **Camp Preference.** Intentionalists say yes; Deflationists say no. A viable theory can pick either, provided it solves the resulting paradoxes.
  12. **The Doxastic Conflict Condition:** Does the agent literally believe $p$ and not-$p$ simultaneously?
      *   *Status:* **Camp Preference.** Some theories require literal contradiction; others require only conflicting behavioral dispositions.

  ---

  ### II. Joint Unsatisfiability Check

  The core tension lies in satisfying the **Epistemic Leakage Constraint** alongside the **Conceptual Distinctions** without triggering a logical crash.

  **The Static Paradox:**
  If the agent believes $p$ (the truth leaks) and believes not-$p$ (the deception holds), they violate basic rationality norms (believing contradictions).
  *   *Solution:* Partitioning. But if the partition is strong enough to prevent contradiction, it is usually too strong to allow **Leakage**. If the truth is walled off, it cannot drive the overcompensation behavior. If it can drive behavior, the wall is porous, and the agent should consciously access it.

  **The Dynamic Paradox:**
  To deceive oneself intentionally, one must know the truth to hide it. If one knows the truth, the deception has already failed.
  *   *Solution:* Temporal division (I knew it yesterday, I hide it today). But this fails the **Simultaneity** required by the *Avoidant Spouse* case (the suspicion and the denial happen in the same conversation).

  **The Leakage Trap:**
  This is the specific unsatisfiability cluster you highlighted.
  1.  To count as *deceived*, the agent must not occurrently believe $p$.
  2.  To count as *leakage*, the agent's cognitive system must process $p$ as true enough to guide motor output or emotional response.
  3.  To count as *psychologically normal* (Reversibility), the system cannot be permanently fractured.

  **Result:** Any theory that demands **full occurrent awareness** of the contradiction kills itself. Any theory that demands **total sub-personal processing** (pure bias) fails to explain why the agent feels the tension of the leak. The only model that survives strict simultaneous contradiction is an **Extreme Partition Model**, but that model immediately fails the Leakage Constraint because the partitions are hermetically sealed.

  ---

  ### III. Theory Scorecard

  Here is how the three dominant architectures score against the spec.

  #### 1. The Intentionalist Picture (The Strategic Model)
  *   *Core Claim:* The agent deliberately manipulates their attention to hide a known truth.
  *   **Coverage:** High. Explains the *Addict* and *Spouse* well (active avoidance).
  *   **Distinctions:** High. Clearly separates deception from error.
  *   **Leakage:** Medium. Explains leakage as "slips" in the strategy.
  *   **Psych Plausibility:** **Low.** Fails the Dynamic Paradox. It requires a level of cognitive sophistication (planning to be irrational) that contradicts the state of being irrational. It makes the agent too rational to be deceived.
  *   **Verdict:** Fails the **Reversibility Constraint** (why stop the strategy if it's working?) and the **Dynamic Paradox**.

  #### 2. The Motivated Reasoning / Non-Intentionalist View (The Deflationary Model)
  *   *Core Claim:* No contradiction exists. The agent simply weighs evidence poorly due to emotional bias. They don't believe $p$; they just didn't process it.
  *   **Coverage:** Medium. Explains the *Spouse* well, struggles with the *Addict* (who often verbally assents to $p$).
  *   **Distinctions:** **Low.** Collapses self-deception into **Plain Ignorance** or **Wishful Thinking**. If they don't believe the truth, they aren't deceiving themselves; they are just mistaken.
  *   **Leakage:** **Low.** This is the fatal flaw. If the agent genuinely does not believe $p$ (even subconsciously), why does $p$ drive the *overcompensation*? Pure bias explains ignoring evidence; it does not explain acting *against* one's own professed belief due to the suppressed evidence.
  *   **Verdict:** Fails the **Epistemic Leakage Constraint** and the **Vs. Plain Ignorance** distinction. It saves rationality by destroying the phenomenon.

  #### 3. The Compartmentalization / Partition Account
  *   *Core Claim:* The mind is divided. Belief $p$ is in Box A; Belief not-$p$ is in Box B. They do not interact directly.
  *   **Coverage:** High. Handles the *Addict* (verbal vs. practical belief) perfectly.
  *   **Distinctions:** High. Maintains the contradiction without logical explosion.
  *   **Leakage:** **Medium-Low.** It allows leakage (Box A influences behavior), but struggles to explain why Box B (conscious self) doesn't notice the influence of Box A. If the partition allows causal flow, why does it block epistemic access?
  *   **Psych Plausibility:** Medium. Risks making the mind too fragmented (violating Unity of Self).
  *   **Verdict:** The strongest contender, but precarious. It survives the Paradoxes but bleeds on the **Leakage Constraint**.

  ---

  ### IV. The Killer Requirement

  The single requirement that does the most damage to popular theories is the **Epistemic Leakage Constraint**.

  **Why it breaks the field:**
  1.  **It breaks Non-Intentionalism:** If you argue the agent *doesn't* believe the truth (it's just bias), you cannot explain why the truth leaks into behavior. Bias explains *ignoring* the gun; it doesn't explain *flinching* at the gun while claiming it's a toy. To explain the flinch, the truth must be registered. To explain the claim, the truth must be rejected. Non-intentionalism cannot hold both.
  2.  **It breaks Intentionalism:** If the truth is registered enough to leak, the intentional deceiver knows it. If they know it, the deception is compromised. The leakage reveals the secret to the very agent trying to hide it.
  3.  **It breaks Partition Models:** This is the most subtle damage. To allow leakage, the partition must be porous. To maintain deception, the partition must be solid. The Leakage Constraint forces the partition to be a sieve. If it's a sieve, the conscious self should eventually notice the water coming through. The theory must explain why the agent feels the anxiety of the leak (the overcompensation) without recognizing the source of the water.

  **Conclusion:**
  Most theories solve the **Static Paradox** (how to believe $p$ and not-$p$) by sacrificing the **Leakage Constraint** (Partition) or solve the **Leakage Constraint** by sacrificing the **Static Paradox** (Non-Intentionalism).

  A viable theory must posit a **functional architecture where a belief can be causally active without being propositionally accessible.** It must explain how the mind can *use* a truth without *admitting* it. Until a theory specifies the mechanism that allows causal potency without doxastic acknowledgment, the spec remains unfulfilled.
