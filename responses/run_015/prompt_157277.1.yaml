answer: |-
  # The Two-Minute Satisficing Protocol (TMSP) for Wetland Conservation

  ## 1. Procedural Design and Aspiration Thresholds

  This procedure operationalises Herbert Simon's concept of bounded rationality by replacing the goal of optimal conservation outcomes with a 'good enough' standard that respects severe cognitive and temporal constraints. The officer is not seeking the best possible decision, but the first decision variant that satisfies a fixed aspiration level.

  **The Aspiration Level**
  The conservation standard is quantified as a **Disturbance Score (DS)** on a scale of 0–10, where 0 is no impact and 10 is ecological collapse. The aspiration threshold is set at **DS ≤ 3**. Any decision variant resulting in a predicted DS of 3 or lower is acceptable.

  **The Decision Alternatives**
  For each application, the officer considers three ordered alternatives:
  1.  **Variant A:** Unconditional Approval.
  2.  **Variant B:** Approval with Standard Mitigation (e.g., seasonal work restrictions, silt fencing).
  3.  **Variant C:** Rejection.

  **The Cognitive Budget Rule**
  To prevent drift into maximising behaviour (searching for perfect evidence), the officer is allocated a **Cognitive Budget of 2 Units** per case.
  *   Evaluating Variant A against the Disturbance Score threshold costs **1 Unit**.
  *   Evaluating Variant B against the Disturbance Score threshold costs **1 Unit**.
  *   Variant C (Rejection) is the default fallback and costs **0 Units** if reached by budget exhaustion.
  *   **Hard Constraint:** Once 2 Units are expended, no further evaluation is permitted. The current leading option must be locked, regardless of residual doubt or panel expectations.

  **The Ordered Sequence of Tests**
  1.  **Initial Scan (Cost: 0 Units):** Review application map and scope. Estimate baseline Disturbance Score.
  2.  **Test 1 (Variant A):** Does Unconditional Approval yield DS ≤ 3?
      *   If **Yes**: Lock Decision (Approve). Stop.
      *   If **No**: Consume 1 Unit. Proceed to Test 2.
  3.  **Test 2 (Variant B):** Does Approval with Standard Mitigation yield DS ≤ 3?
      *   If **Yes**: Lock Decision (Conditional Approval). Stop.
      *   If **No**: Consume 1 Unit. Budget Expired.
  4.  **Termination:** If Budget is Expired, lock Decision (Reject). Do not evaluate Variant C explicitly.

  ## 2. Worked Applications

  **Case 1: Clear Approval (The Satisficing Ideal)**
  *   **Application:** A request to repair an existing fence 200 metres from the wetland high-water mark.
  *   **Initial Scan:** Baseline DS estimated at 1 (minimal noise, no ground disturbance).
  *   **Test 1 (Variant A):** DS 1 ≤ 3? **Yes.**
  *   **Action:** Lock Decision: Unconditional Approval.
  *   **Cognitive Budget Remaining:** 1 Unit.
  *   **Outcome:** Decision made in 45 seconds. The officer does not check mitigation options because the first alternative satisfied the aspiration level. This preserves cognitive resources for subsequent cases.

  **Case 2: Clear Rejection (The Threshold Failure)**
  *   **Application:** A request to install a drainage pipe directly into the wetland buffer zone.
  *   **Initial Scan:** Baseline DS estimated at 8 (high risk of contamination).
  *   **Test 1 (Variant A):** DS 8 ≤ 3? **No.** (Cost: 1 Unit).
  *   **Test 2 (Variant B):** Mitigation (silt traps) reduces DS to 5. DS 5 ≤ 3? **No.** (Cost: 1 Unit).
  *   **Action:** Budget Expired. Default to Variant C (Reject).
  *   **Cognitive Budget Remaining:** 0 Units.
  *   **Outcome:** Decision locked. The officer does not search for exotic mitigation measures (e.g., specialised filtration) because the budget is exhausted. The search stops at the first point of failure for all viable options.

  **Case 3: Panel Pressure and Budget Breach (The Institutional Conflict)**
  *   **Application:** A request for a small storage shed 60 metres from the buffer. Baseline DS estimated at 4.
  *   **Test 1 (Variant A):** DS 4 ≤ 3? **No.** (Cost: 1 Unit).
  *   **Test 2 (Variant B):** Mitigation (relocating shed to 80 metres) reduces DS to 3. DS 3 ≤ 3? **Yes.**
  *   **Action:** Lock Decision: Conditional Approval. (Cost: 1 Unit).
  *   **Institutional Pressure:** The review panel later requests soil sampling data to confirm the DS is truly 3, implying the officer should have sought more evidence before approving.
  *   **Procedure Defence:** The officer cites the Cognitive Budget Rule. Seeking soil samples would constitute a third comparison (Variant D: Approval with Enhanced Verification), costing a 3rd Unit. Since the budget cap is 2 Units, seeking this evidence is a procedural violation. The decision stands based on the satisficing logic: a viable option was found within the allowed cognitive cost. To gather more data would be maximising, which the protocol explicitly forbids under time constraints.

  ## 3. Decision Nodes Requiring Human Judgment

  While the procedure automates the stopping rule, it cannot eliminate human judgment at specific nodes. These must be flagged on the laminated checklist:

  *   **Node 1: Baseline Disturbance Estimation.** The initial DS score (0–10) is not calculated by algorithm but estimated by the officer based on experience. This is where bias enters. The checklist must state: *"Estimate DS using nearest precedent case, not theoretical models."*
  *   **Node 2: Mitigation Efficacy.** Judging whether Standard Mitigation reduces the DS sufficiently is subjective. The checklist must state: *"Assume Standard Mitigation reduces DS by exactly 2 points. Do not calculate custom reductions."*
  *   **Node 3: Budget Termination.** The officer must physically tick a box to mark unit expenditure. Failure to mark this allows 'ghost comparisons' where the officer mentally checks a third option without recording the cost.

  ## 4. Limitations and Ecological Uncertainty

  This procedure is an administrative tool, not an ecological model. Its primary limitation lies in the stability of the aspiration level itself. Simon's theory relies on aspiration-level adaptation: if failures become too frequent, the threshold should rise; if successes lead to damage, the threshold should lower. However, this protocol fixes the threshold (DS ≤ 3) for the duration of the officer's shift to ensure consistency.

  In dynamic ecosystems, the 'true' risk of a DS of 3 may change due to seasonal factors (e.g., breeding seasons, flood risks) that the static checklist cannot capture. If the wetland becomes more fragile, a DS of 3 might become unacceptable, but the procedure will continue to approve such cases until the thresholds are formally revised by senior management. Furthermore, the Cognitive Budget creates a 'cliff-edge' effect: a case requiring 2.1 Units of cognitive effort is treated identically to one requiring 5 Units (both result in Rejection via budget exhaustion), potentially discarding viable projects that merely required slightly more scrutiny. The procedure sacrifices ecological nuance for administrative survivability under time pressure.

  The procedure cannot account for systemic ecological shifts that render the fixed aspiration threshold obsolete between formal review cycles.
