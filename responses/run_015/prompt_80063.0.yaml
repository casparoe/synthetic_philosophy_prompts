      *   *Risk-Weighted Prediction:*
          *   "Do you believe it will work?" -> "I believe it *might* work" or "I have faith it will." (Stakes of withholding belief = friend gives up. Stakes of false belief = disappointment).
          *   "Should I take it?" -> Yes.

