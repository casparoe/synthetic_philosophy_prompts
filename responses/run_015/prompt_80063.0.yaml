  4.  **Develop the Alternative Principle:**
      *   *Alternative:* **Risk-Weighted Evidentialism (Contextualism).**
          *   Principle: *The amount of evidence required for belief is proportional to the stakes of being wrong, but inversely proportional to the cost of withholding belief.*
          *   *Ship:* Stakes high (lose money). Cost of withholding low (don't invest). -> High evidence needed.
