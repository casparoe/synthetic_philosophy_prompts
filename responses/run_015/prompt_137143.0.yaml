answer: |-
  Look, if we are going to sit down and write the spec for a theorem that actually tells a planner how to rank risky social prospects, we need to stop pretending Harsanyi solved the normative problem just because he solved the representation problem. The math is settled, sure. If you have a social preference ordering over lotteries that satisfies vNM axioms and respects individual vNM preferences via a Pareto condition, the social utility function is a linear combination of individual utility functions. That part is not up for debate among people who know the literature. But you asked for the spec of an adequate answer, meaning the normative constraints that make the theorem tell us something about justice rather than just coherence. So here is what I think the deliverable needs to be. It needs to output a ranking of lotteries that respects the structure of individual risk attitudes without simply collapsing into a dictatorship of the most risk-averse person, and it needs to handle the weights on individual utilities in a way that doesn't just hide the ethical work in a black box.

  On the weights, my view is that leaving them as free parameters is the only honest move, despite what the veil of ignorance crowd wants. The idea that you can derive equal weights from a rational choice behind a veil is one of those things that sounds clean until you realize the prior distribution over identities is doing all the heavy lifting. If you assume an equal prior probability of being anyone, you get utilitarianism. If you assume a prior that favors the worst off, you get something else. But that prior is an ethical input, not a rationality constraint. So a theorem that claims to derive the weights from pure rationality is selling something it does not have. It is better to state the weights as parameters reflecting the planner's ethical stance on the relative importance of persons. Similarly, on interpersonal comparisons, the demand to manage without them is an evasion. You cannot aggregate preferences over outcomes for different people without some common metric of value. If you say you are avoiding interpersonal comparisons of utility levels, you are usually just assuming they are incomparable and then aggregating anyway using some hidden currency like resources or opportunities. For a theorem on risky prospects, you need cardinal unit comparability at a minimum. You need to know that a utility gain of one unit for person A is comparable to a utility gain of one unit for person B, otherwise the weighted sum is meaningless. Invariance to separate affine rescaling of individual utilities is non-negotiable if we are sticking to vNM frameworks, because utility functions are only unique up to positive affine transformations. If your social ranking changes when I multiply one person's utility by two, your rule is sensitive to the arbitrary scaling of the utility function, which is a measurement artifact, not a moral feature.

  Now, about the veil of ignorance versus evaluating after the fact. This is where the real friction is. You want the ranking to come out the same whether you evaluate from behind the veil or after it lifts. That is essentially a requirement that Ex Ante and Ex Post evaluations coincide. In the settled literature, we know this is too much to ask if you want any form of equity concern. If you care about the distribution of outcomes once the uncertainty is resolved, you will violate the Ex Ante Pareto principle in some cases. If you respect Ex Ante Pareto strictly, you must be indifferent to the correlation of risks across individuals, which means you cannot care about whether everyone suffers together or whether risks are hedged across the population. So you have to choose. My view is that the Ex Ante perspective is the only one compatible with respecting individual sovereignty over risk, but it comes at the cost of ignoring brute luck in the outcome. If you want a theorem that handles variable populations where existence is uncertain, you are entering a zone where almost nothing is settled and most things break. Standard Harsanyi aggregation assumes a fixed set of people. Once you allow the set of people to vary based on the lottery, you run into the repugnant conclusion and non-identity problems that no amount of expected utility theory can smooth over. For the purpose of a clean spec, I would say keep the population fixed. Adding variable population makes the theorem impossible to satisfy without accepting conclusions that no one actually accepts in practice.

  Let us fight about your person-splitting neutrality condition. You ask if replacing one person with two people who have the same utility function, each getting half the utility, should leave the social ranking unchanged. My take is that this is not egalitarianism smuggled in; it is actually a test of whether you are a utilitarian or a prioritarian. If you are a standard utilitarian, the sum of utility is unchanged, so the ranking stays put. If you are a prioritarian who applies a concave transformation to utility to give priority to the worse off, splitting one person with utility ten into two people with utility five each changes the moral value. Two units of transformed utility at level five are worth more than one unit of transformed utility at level ten. So your condition forces linearity in the evaluation of utility. Is it a legitimate constraint? I think it is a very strong constraint that essentially rules out any view that cares about the distribution of utility across persons as distinct from the sum. It assumes that the moral value of a life is perfectly additive and that there is no premium on having a single coherent subject experiencing a certain level of welfare versus two subjects experiencing half each. Some would say this ignores the separateness of persons, because splitting a person changes the number of subjects. Others would say if the utility functions are identical and the total welfare mass is the same, the number of vessels should not matter. I lean toward thinking this is a legitimate desideratum for a theory that claims to be neutral about the number of persons, but you have to accept that it kills any view that values equality of welfare for its own sake. It forces you to be a utilitarian about utility, even if you are not a utilitarian about resources.

  The second thing you want fought over is which subset of requirements cannot be had at once. Here we are on firmer ground because there are actual impossibility theorems. The most damaging conflict is between Ex Ante Pareto and Ex Post Equity. You cannot have a social ranking that strictly respects individual preferences over lotteries (Ex Ante Pareto) and also prefers a certain equal distribution over a risky unequal one when the expected utilities are the same (Ex Post Equity). This is the Diamond critique in a vNM setting. If two people have equal expected utility, one getting a sure thing and the other facing a risk, Ex Ante Pareto says the planner should be indifferent if the individuals are indifferent. But Ex Post Equity says the planner should prefer the sure thing because it avoids inequality in the realized outcome. You cannot have both. The single desideratum that does the most work in knocking candidates out is Ex Ante Pareto. If you insist on it, you are locked into a weighted utilitarian framework where the social attitude to risk is just a weighted average of individual attitudes. You cannot have a social attitude to risk that is more risk-averse than the individuals unless you violate Pareto. This is the hard constraint. Most people want to say society should be more risk-averse than individuals regarding basic needs, but if you hold onto Ex Ante Pareto, you cannot say that without paternalism. So Ex Ante Pareto is the killer. It preserves individual sovereignty but eliminates social compassion for bad luck.

  Distinguishing what is settled from what is disputed is crucial here. It is settled mathematics that Harsanyi's aggregation holds given the axioms. It is settled that Ex Ante Pareto and Ex Post Equity are incompatible in this framework. What is disputed is whether Ex Ante Pareto is a moral requirement or a rationality constraint. Some social choice theorists treat it as a minimal respect for individual preferences, while others treat it as a contingent value that should give way to fairness. It is also disputed whether interpersonal comparisons of utility are possible or meaningful. Economists tend to treat them as meaningless without behavioral data, while philosophers treat them as essential for any normative theory. You need to know that when I say IPC is necessary, that is a philosophical stance, not an economic consensus.

  Scoring the main contenders given this spec, standard utilitarianism passes the person-splitting test and satisfies Ex Ante Pareto, but it fails to account for ex post inequality and requires interpersonal comparisons that some find metaphysically suspect. Prioritarianism fails the person-splitting test and usually violates Ex Ante Pareto because it changes the weighting based on utility levels, which alters rankings of lotteries in ways individuals do not endorse. Ex Ante Egalitarianism satisfies Ex Ante Pareto but is blind to ex post outcomes, meaning it cannot condemn a lottery that leaves one person destitute and one rich if both agreed to the risk. Ex Post Egalitarianism captures the intuition about fairness in outcomes but violates Ex Ante Pareto and often fails the independence axioms required for vNM representation. If I have to place a bet, the only coherent framework that survives the vNM constraints without contradiction is weighted utilitarianism, but you have to accept the weights as ethical inputs and the indifference to ex post inequality as the price of respecting individual risk choices. Everything else requires you to drop an axiom that looks essential to either rationality or fairness, and you should be explicit about which one you are sacrificing.
