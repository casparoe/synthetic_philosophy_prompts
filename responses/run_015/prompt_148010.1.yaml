      *   *Guess 2 (Multiple Activities):* This is also very strong, perhaps even deeper. Daniel Dennett's "intuition pump" critique is relevant here. Some treat intuitions as data (conceptual analysis), others as rhetorical tools (persuasion), others as reductio ad absurdum (theory checking). If I'm using it to check consistency and you're using it to persuade me of a moral truth, we will clash on standards.
