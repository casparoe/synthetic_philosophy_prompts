answer: |-
  **Exam Question (30 Minutes, 20 Marks)**

  **Question 4: Restricted Iterated Elimination**

  Consider a two-player normal-form game. Let the standard procedure **IESDS** denote the Iterated Elimination of Strictly Dominated Strategies, where a strategy is eliminated if it is strictly dominated by *any* mixed strategy.

  Define a restricted procedure, **IESDS-2**, identical to IESDS except that a strategy is eliminated only if it is strictly dominated by a mixed strategy with **support size at most two** (a "pair-mixture").

  (a) Construct a two-player game where a strategy is strictly dominated (eliminable under IESDS) but *not* eliminable under IESDS-2. Explain geometrically why the support cap causes the procedure to get stuck. [10 Marks]

  (b) Determine whether IESDS-2 is order-independent (i.e., whether the set of surviving strategies is unique regardless of elimination sequence). Justify your answer by analyzing what happens to the support size of a dominator when a dominating strategy is itself eliminated. [10 Marks]

  ***

  **Model Answer**

  **(a) Existence of Stuck Strategies**
  IESDS-2 can get stuck where IESDS proceeds. This occurs when the opponent has at least three pure strategies.

  Consider a game where Player 2 has strategies $\{L, M, R\}$ and Player 1 has $\{A, B, C, X\}$. Let Player 1's payoffs be vectors in $\mathbb{R}^3$ corresponding to P2's choices:
  $u_1(A) = (1, 0, 0)$, $u_1(B) = (0, 1, 0)$, $u_1(C) = (0, 0, 1)$, and $u_1(X) = (0.2, 0.2, 0.2)$.

  Under IESDS, $X$ is strictly dominated by the mixture $\sigma = \frac{1}{3}A + \frac{1}{3}B + \frac{1}{3}C$, which yields payoff $(0.33, 0.33, 0.33) > (0.2, 0.2, 0.2)$.

  Under IESDS-2, we check pair-mixtures. Any mixture of two strategies from $\{A, B, C\}$ places zero weight on at least one coordinate. For example, a mixture of $A$ and $B$ yields $(\lambda, 1-\lambda, 0)$. Since the third coordinate is $0$, it cannot strictly dominate $X$'s third coordinate ($0.2$). This holds for all pairs. Thus, $X$ survives IESDS-2.

  **Geometric Explanation:** Player 1's payoffs exist in $\mathbb{R}^3$ (dimension determined by Player 2's strategy count). The set of payoffs achievable by pair-mixtures forms the 1-skeleton (edges) of the simplex spanned by $\{A, B, C\}$. The payoff vector for $X$ lies in the interior of this simplex. By Carathéodory's Theorem, representing an interior point in $\mathbb{R}^3$ generally requires a convex combination of up to 4 points (or 3 for the boundary of the hull). Restricting support to 2 confines us to the edges, which cannot cover the interior where $X$ resides.

  **(b) Order Independence**
  IESDS-2 is **not** order-independent.

  Standard IESDS is order-independent because domination is transitive: if $s$ is dominated by $\sigma$ (using $z$), and $z$ is dominated by $\tau$, we can substitute $\tau$ into $\sigma$ to find a new dominator for $s$ that does not use $z$.

  IESDS-2 breaks this transitivity due to the support cap. Suppose $s$ is dominated only by $\sigma = 0.5A + 0.5z$ (support size 2). Suppose $z$ is dominated by $\tau = 0.5C + 0.5D$ (support size 2).

  *Sequence 1:* Eliminate $s$ first. This is valid because $\sigma$ exists. Then eliminate $z$. Final set excludes $\{s, z\}$.
  *Sequence 2:* Eliminate $z$ first. This is valid because $\tau$ exists. Now consider $s$. The original dominator $\sigma$ is invalid because $z$ is removed. The substituted dominator is $\sigma' = 0.5A + 0.5(0.5C + 0.5D) = 0.5A + 0.25C + 0.25D$. The support size of $\sigma'$ is 3 ($A, C, D$).

  Since IESDS-2 forbids support size 3, $\sigma'$ is not a valid dominator. Unless $s$ happens to be dominated by some *other* pair-mixture (which we constructed it not to be), $s$ cannot be eliminated in Sequence 2.

  Because Sequence 1 eliminates $s$ and Sequence 2 preserves $s$, the final surviving sets differ. The support cap prevents the closure property required for order independence.

  ***

  **Marking Scheme (20 Marks)**

  **Part (a): 10 Marks**
  *   **A Grade (8-10):** Provides a concrete $4 \times 3$ (or larger) example. Explicitly shows the mixture of 3 dominates, while all pairs fail on at least one coordinate. Correctly identifies the geometric reason (dimensionality/Carathéodory/Interior vs. Edges).
  *   **B Grade (5-7):** Provides a valid example but lacks the geometric intuition, OR provides the geometric intuition but the example is flawed (e.g., uses a $2 \times 2$ game where pair-dominance is actually sufficient).
  *   **C Grade (0-4):** Claims pair-dominance is equivalent to full IESDS, or provides an example where the strategy is not dominated at all.

  **Part (b): 10 Marks**
  *   **A Grade (8-10):** Correctly verdicts "Not Order-Independent." Explains the mechanism: substituting one pair-mixture into another creates a mixture of support 3. Explicitly contrasts this with the standard IESDS proof of transitivity.
  *   **B Grade (5-7):** Correctly verdicts "Not Order-Independent" but argues vaguely (e.g., "constraints make it harder") without showing the support-size arithmetic ($2+2-1=3$). OR, argues it *is* order-independent but provides a coherent (though incorrect) proof attempt.
  *   **C Grade (0-4):** Guesses the verdict with no justification, or confuses order-independence with existence of Nash Equilibrium.

  ***

  **Confidence Statement**

  *   **Claim 1 (Stuckness):** **High Confidence.** This is a direct consequence of the dimension of the opponent's payoff space. If the opponent has $K$ strategies, the payoff space is $\mathbb{R}^K$. Strict domination requires the dominated vector to be in the interior of the convex hull of dominators. In $\mathbb{R}^3$, the interior cannot be reached by convex combinations of only 2 points (which form lines/edges).
  *   **Claim 2 (Order Independence):** **High Confidence.** The standard proof of order independence relies on the ability to compose mixtures. The composition of two mixtures with support $k$ generally yields support $2k-1$ (or similar expansion). Capping support at 2 breaks the closure required for the substitution lemma.
  *   **Least Certain Claim:** The **Order Independence** verdict. While the support-size arithmetic ($2 \to 3$) strongly suggests failure, I am 95% confident rather than 100%. There is a slight possibility that for any $s$ dominated by a size-3 mixture derived from substitution, there *exists* an alternative size-2 dominator not derived by substitution. Proving this impossibility rigorously requires showing the union of all "pair-dominated" regions is not closed under the elimination operator. To settle this definitively, one would need to formally prove that the set of strategies eliminable by support-2 mixtures is not a "consistent" set in the sense of Gilboa et al. (1990). However, the constructive counterexample logic provided in the model answer is standard for this type of constraint breakdown.
