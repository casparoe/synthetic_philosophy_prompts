  The core thesis
  Inheritance taxation is traditionally justified as redistributing accumulated wealth or preventing aristocracy. This view is fundamentally mistaken. Instead, inheritance levies should be reconceived as dynastic opportunity-cost adjustments. The primary moral injury of large intergenerational transfers is not the mere existence of family wealth, but the measurable contraction of social mobility it induces. When capital is locked within dynastic transmission networks, it lowers the intergenerational elasticity of opportunity for non-heirs, effectively rigging the competitive landscape. Therefore, tax liability should not track the absolute value of an estate, but rather the marginal reduction in mobility elasticity estimated to result from retaining that capital within the lineage. This shifts the normative foundation from punishing accumulation to correcting market distortions caused by entrenched privilege, ensuring that the tax system targets the specific mechanism by which inheritance undermines meritocratic equality.

  The argument from mobility elasticity
  The economic mechanism at play is the saturation of opportunity spaces. High concentrations of inherited capital allow heirs to access superior education, networks, and asset bases without corresponding meritocratic effort. This creates a zero-sum dynamic in high-opportunity sectors. As dynastic capital accumulates, the intergenerational elasticity of income increases, meaning a child's economic outcome becomes more dependent on parental status and less on individual talent. For non-heirs, this manifests as a raised floor for entry into elite positions, effectively excluding capable individuals from outside the dynasty. Conventional wealth taxes fail because they tax static stock rather than dynamic flow effects. A billion-dollar estate dispersed among ten heirs might cause less mobility damage than a hundred-million estate concentrated to monopolize a industry niche. By calibrating the tax schedule to the marginal reduction in mobility elasticity, the state targets the *effect* of the transfer on the broader opportunity structure. This requires models estimating how retention levels correlate with reduced social fluidity. The goal is not equality of outcome, but equality of opportunity intensity. If retaining capital does not significantly depress mobility elasticity for others, the tax burden remains low. If it creates a bottleneck, the adjustment rises, internalizing the cost of reduced social fluidity onto the dynasty benefiting from the rigidity. Tax becomes a function of market power rather than bank balance. It acknowledges that wealth only becomes morally problematic when it acts as a barrier to entry for others. This nuance prevents penalizing productive capital formation while strictly limiting anti-competitive dynastic consolidation.

  First objection and reply
  Critics may argue that tying tax liability to contingent sociological correlations violates liberal principles that obligations should track intrinsic wrongs, not external effects. They claim taxing statistical mobility impacts treats individuals as means to social ends, punishing them for correlations beyond control. This objection misunderstands the specific nature of the wrong. The moral harm of dynastic retention is not intrinsic to the property itself, but consists precisely in the externalization of mobility costs onto strangers. When a family locks capital away, they impose a negative externality on the competitive environment, much like a factory polluting a river. The obligation arises because the dynasty benefits from a rigged system they sustain. Therefore, the tax is not punishing an intrinsic evil but pricing an external cost. The liability tracks the harm caused to the opportunity set of others. Ignoring these external effects would allow dynasties to privatize gains while socializing the costs of reduced mobility, violating the very liberal principle of non-harm the objection seeks to protect. Justice demands accounting for these relational harms.

  Second objection and reply
  A second objection posits that framing inheritance as an opportunity-cost externality dissolves the boundary between private testamentary freedom and collective welfare optimization, undermining legitimate bequest rights. If every transfer is scrutinized for specific social impact, private autonomy seems extinguished. However, this boundary is preserved if opportunity-cost adjustments are treated as corrective justice rather than redistributive welfare. Redistributive welfare seeks to engineer outcomes, whereas corrective justice merely restores the status quo ante by internalizing costs. Testamentary freedom remains legitimate only insofar as it does not infringe upon the equal opportunity rights of others. By framing the tax as a fee for the exclusionary effect of capital retention, we respect the right to bequeath while denying the right to monopolize opportunity. Furthermore, it prevents the state from becoming a universal heir, limiting its claim to the cost of the externality. The state claims no wealth ownership; it merely charges for damage done to the mobility market. This maintains a true very clear distinction: you may transfer wealth, but you must pay for the opportunity costs imposed on non-heirs, preserving private rights within a robust framework of fair competition.

  Bottom line
  Reconceiving inheritance tax as dynastic opportunity-cost adjustment reframes the debate from envy-driven redistribution to market correction. The focus shifts from what heirs deserve to what non-heirs are owed regarding fair competition. By taxing the marginal reduction in mobility elasticity, we target the specific mechanism that undermines meritocracy. This approach respects testamentary freedom while ensuring that private wealth accumulation does not come at the expense of public opportunity. Ultimately, it treats social mobility as a common resource that dynasties must pay to degrade, ensuring that intergenerational transfers do not calcify into aristocratic privilege.
