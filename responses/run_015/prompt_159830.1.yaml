answer: |-
  ### The Spec: Desiderata for Scientific Emergence

  You need a filter that separates "interesting structural novelty" from "magic" and "mere complexity." Below are five requirements. If a claim fails any of the Non-Negotiables, it is not emergence; it is either reduction, magic, or noise.

  **1. Non-Aggregativity**
  *   **Motivating Case:** Temperature is the average kinetic energy of molecules. You can understand it entirely by summing the parts. Wetness, however, is not a property of a single water molecule, nor is it a simple sum; it arises from specific relational dynamics (hydrogen bonding networks) that do not exist at the lower level. A traffic jam is not just "many cars"; it is a specific density-wave structure that behaves like an object.
  *   **Verdict:** **Non-Negotiable.** If the macro property is just a linear sum or average of micro properties (like total mass), it is aggregation, not emergence.

  **2. Robustness under Variation (The Anti-Gerrymander Clause)**
  *   **Motivating Case:** A hurricane persists even if every water molecule within it is replaced over time. It is a stable pattern of flow. Contrast this with "The Hurricane plus one specific nitrogen molecule over the Sahara." That conjunction exists, but if you swap the nitrogen molecule, the "object" changes identity. The hurricane survives substrate turnover; the gerrymandered whole does not.
  *   **Verdict:** **Non-Negotiable.** The macro phenomenon must maintain its identity and function despite significant replacement or fluctuation of its micro-constituents.

  **3. Downward Constraint (Causal Efficacy)**
  *   **Motivating Case:** In an ant foraging trail, the macro trail (pheromone gradient) dictates the path of individual ants. The ants build the trail, but the trail constrains the ants. In a Game of Life glider, the pattern's existence dictates the state of the cells in the next generation. If the macro level were just a shadow with no influence on the micro dynamics, it would be epiphenomenal.
  *   **Verdict:** **Non-Negotiable.** The emergent entity must do causal work, specifically by constraining or channeling the behavior of its constituents.

  **4. Conceptual Opacity (Derivational Friction)**
  *   **Motivating Case:** You can simulate every atom in a protein, but that simulation does not explain *why* the fold is stable or functional without introducing new concepts (energy landscapes, folding funnels). Knowing the micro-rules of the Game of Life does not help you spot a glider until you learn the macro-vocabulary of "gliders." Temperature is derivable; protein function is derivable only via a conceptual leap.
  *   **Verdict:** **Negotiable.** (See Tensions below). Strictly speaking, if you have the micro-laws, you *can* derive the macro, but if the derivation requires new vocabulary and offers no insight without it, it counts. This distinguishes emergence from mere computational difficulty.

  **5. Base Neutrality (Anti-Scale-Chauvinism)**
  *   **Motivating Case:** We usually think small things make big things. But in quantum gravity research, spacetime itself might emerge from entangled qubits. If your definition assumes the base level must be "smaller" or "more fundamental" in a spatial sense, you rule out emergent spacetime. The relation is ontological, not spatial.
  *   **Verdict:** **Non-Negotiable.** The account must allow for any level to be base or emergent, provided the structural relationship (Requirements 1-3) holds.

  ***

  ### Evaluation of Newsroom Tests

  **(1) The Laplace Test (Unpredictability)**
  *   *Verdict:* **Prejudice dressed up as a requirement.**
  *   *Reasoning:* This confuses metaphysics with computing power. A Game of Life glider is perfectly predictable if you know the rules and have the compute, yet it is structurally emergent. If you require absolute unpredictability, you rule out almost all physics, leaving only randomness.

  **(2) The Swap Test (Multiple Realizability)**
  *   *Verdict:* **Genuine Desideratum.**
  *   *Reasoning:* This is essentially Requirement #2 (Robustness). If a phenomenon (like consciousness or a traffic jam) can be realized in silicon, neurons, or tubes of water, it proves the pattern is independent of the specific stuff. This is the strongest empirical marker of emergence available to a journalist.

  **(3) The Funding Test (Autonomous Science)**
  *   *Verdict:* **Defensible-but-Optional.**
  *   *Reasoning:* This is a sociological proxy for ontological independence. Biology has a budget separate from physics because biological laws (natural selection) are robust enough to stand alone. However, new sciences take time to fund. A phenomenon can be emergent before it gets a department. Use this as a heuristic, not a rule.

  *Are any two secretly the same?* The Swap Test and the Funding Test are cousins. Swap tests for *physical* independence; Funding tests for *explanatory* independence. If you can swap the substrate, you usually justify the separate budget.

  ***

  ### Tensions and Incompatibilities

  **1. Novel Causal Power vs. Micro Causal Completeness**
  *   **The Conflict:** Standard physics assumes "Causal Completeness of the Micro": every physical event has a sufficient micro-physical cause. If the micro-level already fully causes the effect, there is no "room" for the macro-level to add *novel* causal power without overdetermination (two causes for one effect) or violating physics.
  *   **The Resolution:** You cannot satisfy both strictly. If you demand *Strong Emergence* (new fundamental forces at the macro level), you break physics. If you demand *Micro Completeness*, macro causation must be understood as *constraint* or *organization*, not new energy.
  *   **Journalistic Advice:** Treat claims of "novel causal power" with extreme skepticism unless the researcher clarifies they mean "causal efficacy via constraint." If they imply new forces, they are making a metaphysical claim, not a scientific one. **This tension means the list is jointly unsatisfiable if "Novel Power" is interpreted as "New Forces."** It must be interpreted as "New Organizational Constraints."

  **2. Surprise vs. Predictability**
  *   **The Conflict:** Emergence feels like surprise, but science aims for prediction.
  *   **The Resolution:** This is resolvable. The surprise is *conceptual*, not *nomological*. The laws don't change, but the vocabulary needed to track the pattern is new. A glider is predictable, but surprising to someone who only knows the cell-update rules.
  *   **Journalistic Advice:** Accept that a phenomenon can be emergent even if a supercomputer could predict it. The "surprise" must be about human understanding, not cosmic indeterminacy.

  ***

  ### Filtering and Prejudice

  **The Workhorse Requirement:** **Robustness under Variation (Req #2).**
  This does the most heavy lifting. It immediately kills the "Hurricane + Nitrogen Molecule" gerrymander. It kills simple aggregates. It forces the researcher to show that the pattern survives the turnover of parts. If the pattern collapses when you swap a few components, it's fragile, not emergent.

  **The Prejudice Requirement:** **Novel Causal Power (part of Req #3).**
  People demand this because they want emergence to save them from reductionism (especially in consciousness). They want the macro to be *more* than the micro. But in hard science, this is often a placeholder for "I don't understand the mechanism yet." It is the requirement most likely to smuggle in magic.

  ***

  ### Scorecard: Familiar Stances

  *   **Reductionism-with-Bridge-Principles:** Fails **Conceptual Opacity**. It claims everything is derivable without new vocabulary, which ignores the explanatory value of special sciences.
  *   **Strong Emergence (New Laws):** Passes **Novel Power**, but fails **Micro Completeness**. It saves the phenomenon by breaking physics; useful for consciousness debates, dangerous for physical science reporting.
  *   **Coarse-Graining (It's All Models):** Passes **Robustness** and **Base Neutrality**, but risks failing **Downward Constraint**. It makes emergence about the observer's map, not the territory's structure.
  *   **Emergence-as-Multiple-Realizability:** Passes **Swap Test** and **Robustness**, but can fail **Non-Aggregativity** if not careful. It explains *where* emergence happens, but not *how* it works.

  ***

  ### The Pruned List (Discarded Candidates)

  Per your instruction, here are the candidates from my internal brainstorm that were thrown out during the pruning process, along with the reason for exclusion.

  1.  **Unpredictability:** Discarded. Confuses computational limits with ontological status (The Laplace Test error).
  2.  **Scale Invariance:** Discarded. Too specific to fractals; many emergent phenomena (like protein folds) are not self-similar.
  3.  **Observer Relativity:** Discarded. Makes emergence too subjective; a traffic jam is real even if no one is there to model it.
  4.  **Diachronic Independence:** Discarded. Too messy; macro history is often tied to micro history, just abstracted.
  5.  **Context Sensitivity:** Discarded. Too broad; almost all physical systems are context-sensitive without being emergent.
  6.  **Synchronic Dependence:** Discarded. This is a background constraint (no dualism), not a test for emergence itself.
  7.  **Explanatory Gap (Consciousness-specific):** Discarded. Merged into Conceptual Opacity; shouldn't privilege mind over matter in the definition.
  8.  **Autonomy (Separate Laws):** Discarded. Merged into Funding/Constraint; "laws" is too strong a word for many special sciences.
  9.  **Irreducibility (General):** Discarded. Too vague; needs to specify *how* it is irreducible (conceptually vs. causally).
  10. **Non-linearity:** Discarded. Too technical/mathematical; linear systems can show emergent patterns via boundary conditions.
  11. **Phase Transition:** Discarded. A mechanism, not a definition; not all emergence involves phase changes.
  12. **Information Loss:** Discarded. Merged into Opacity; coarse-graining loses info, but that's a feature of modeling, not necessarily the phenomenon.
  13. **Self-Organization:** Discarded. A process, not a state; things can be emergent without having organized themselves (e.g., static structures).
  14. **Holism:** Discarded. Metaphysically loaded and vague; replaced by Non-Aggregativity.
  15. **Supervenience:** Discarded. Technical metaphysical jargon that doesn't help a journalist distinguish signal from noise.
