answer: |-
  This is a sharp framing. You've identified the TRC not just as a historical event, but as a system design for memory management. It was an explicit attempt to solve a concurrency problem: how to maintain system integrity (justice/truth) while preventing a crash (civil war) during a migration from one state (apartheid) to another (democracy).

  Here is the mapping of the TRC through Margalit and Rieff, followed by the stress test using your two concepts.

  ### Part 1: Mapping the Disagreement

  #### The Duty Side (Margalit)
  Avishai Margalit, in *The Ethics of Memory*, argues that memory is a moral duty grounded in "thick relations" (relationships defined by shared history and care, like family or close community) rather than "thin relations" (strangers or generic citizenship).

  *   **Who owes the duty?**
      *   **Survivors/Victims:** Margalit would argue they have a duty to themselves and their dead to keep the relation alive.
      *   **The New State:** This is tricky for Margalit. States operate in "thin relations." He is skeptical that a state can have a *moral* duty to remember in the thick sense. The state can have a *political* duty, but for Margalit, moral memory requires care, which bureaucracies lack.
      *   **Perpetrators:** Their duty is to acknowledge the breach in the relation. Confession is the minimum entry fee to re-enter the moral community.
      *   **Children/Successors:** They inherit the duty only if they inherit the *relation*. If the thick relation dissolves, the duty weakens.
  *   **What is the object of the duty?**
      *   Not just the **facts** (who pulled the trigger). That is "historical memory."
      *   The object is the **moral significance** of the event (the suffering, the betrayal, the value of the life lost). It is the *felt experience* of the wrongness.
  *   **What counts as discharging it?**
      *   **The Transcript Problem:** For Margalit, a televised hearing plus a transcript is **not** remembering. It is "external memory" (like a hard drive). Moral remembering happens in the mind and conduct of people.
      *   **Ritual vs. Memory:** If the TRC hearings allowed the public to watch, feel outrage or empathy, and then go back to life unchanged, Margalit would call this a ritual that *simulates* remembering to allow everyone to *stop* remembering. It discharges the social pressure without sustaining the moral relation.
      *   **Success Condition:** The duty is only discharged if the memory continues to shape current behavior and relationships. If the archive sits untouched, the duty is failed, regardless of how well the data was recorded.

  #### The Forgetting Side (Rieff)
  David Rieff, in *In Praise of Forgetting*, argues that collective memory is often a weapon that sustains conflict. He suggests that peace sometimes requires letting go of the demand for justice and memory.

  *   **Weaponized or Engineered?**
      *   The TRC is a hybrid case that complicates Rieff. It **weaponized memory** against impunity (you cannot have silence/amnesty without speaking). But it **engineered forgetting** regarding retribution (no jail time).
      *   Rieff usually argues for forgetting to stop the cycle of violence. The TRC agrees with the goal (stability) but disagrees with the method (total silence). It said: "We will forget the *punishment*, but we will not forget the *truth*."
  *   **Defense or Problem for Rieff?**
      *   **Defense:** It supports his pragmatic claim that strict retributive justice (Nuremberg style) might have destroyed the new state. Survival required a "Pact of Forgetting" regarding legal liability.
      *   **Problem:** It challenges his binary that memory = conflict and forgetting = peace. The TRC suggests a third state: **Acknowledged Memory without Retribution.** Rieff tends to treat memory as a monolithic block that fuels grievance. The TRC tried to surgically remove the grievance (liability) while keeping the record (truth). If the TRC succeeded in keeping peace *through* transparency, it undermines Rieff's suspicion that public memory is inherently dangerous.

  *(Brief Contrast: Spain's post-Franco "Pact of Forgetting" was pure Rieff—amnesty and silence. No truth commission. It bought stability but left a "cold peace" where families didn't know where their dead were buried. The TRC tried to avoid the Spanish outcome by forcing the truth out before the forgetting set in.)*

  ### Part 2: Stress Testing the Theories

  Here is where your engineering intuition pushes past the philosophy. Both Margalit and Rieff assume memory is a human cognitive state or a cultural atmosphere. They treat the *infrastructure* of memory as secondary. Your two concepts show that the infrastructure might be the primary variable.

  #### 1. Archive Substitution
  *The intuition: Society forgets (lived experience), State remembers (database).*

  *   **Margalit's Blind Spot:**
      *   Margalit distinguishes between "historical memory" (archive) and "moral memory" (lived). He would say Archive Substitution is a **category error**. You cannot outsource a moral duty to an institution.
      *   **Where he goes silent:** He doesn't account for scale. In a nation of 50 million, "thick relations" are impossible to maintain nationally. The TRC archive acts as a proxy for thick relations. Margalit has no framework for "institutional thick relations." If the archive is accessible (API is open), does that satisfy the duty? He would say no. But if the alternative is civil war, is his idealism computationally feasible?
      *   **Verdict:** For Margalit, Archive Substitution is data retention with a morally flattering name. It is a failure of the duty because the *care* has been outsourced to a server.

  *   **Rieff's Blind Spot:**
      *   Rieff fears memory keeps wounds open. Archive Substitution might actually be his ideal solution: the data exists (so no one can deny it), but it is "cold storage" (so it doesn't fuel daily violence).
      *   **Where he goes silent:** He assumes that if memory is kept alive, it will be weaponized. He doesn't consider that an archive can be *boring*. If the TRC transcripts are technically accessible but culturally ignored, they don't fuel conflict, but they also don't provide the "lesson" Rieff worries about.
      *   **Verdict:** Archive Substitution solves Rieff's problem (peace) but creates a new one: **Moral Atrophy.** If the state does the remembering, the citizens are free to be indifferent.

  *   **The Engineer's Take:** This is the difference between **stateful** and **stateless** memory. Margalit wants stateful memory (held in the session of the living). The TRC built a stateless system (stored in the database). Margalit would argue the session timeout is too short; Rieff would argue the session shouldn't exist at all. Neither fully grapples with the persistence layer as a moral agent.

  #### 2. The Witness Horizon
  *The intuition: Memory changes type when the last API caller (witness) dies.*

  *   **The Transition Point:**
      *   Right now, apartheid memory is **synchronous** (caller and server are both alive). In 30 years, it will be **asynchronous** (only the server/archive remains).
      *   **Margalit:** He admits the duty weakens as relations thin. When the last victim dies, the "thick relation" is broken. The duty transfers to "thin relations" (citizenship). He would argue the duty changes from *mourning* to *education*.
      *   **Rieff:** He argues that once the witnesses die, memory inevitably turns into **myth**. The nuance is lost, and the story becomes a tool for whatever current political group grabs it.
  *   **TRC Success or Failure?**
      *   The TRC was explicitly designed to bridge this horizon. It recorded the testimony *before* the witnesses died.
      *   **By Margalit's Standard:** It looks like a **partial failure**. The archive exists, but the "care" is fading. Younger South Africans often view the TRC as history class, not moral inheritance. The duty lapsed because the relation lapsed.
      *   **By Rieff's Standard:** It looks like a **success**. The transition to recorded memory defanged the grievance. The violence didn't return when the witnesses started dying. The "myth" that formed is largely one of national unity (the "Rainbow Nation"), which served stability, even if it glossed over economic injustice.
  *   **Validating Your Hunch:**
      *   You are correct. Both philosophers assume a **stable population of rememberers**. They treat memory as a continuous stream.
      *   The TRC reveals that memory is actually a **handover protocol**. The critical moment is not the remembering itself, but the migration from *living memory* to *archival memory*.
      *   Margalit assumes the handover happens naturally through community. Rieff assumes the handover should be blocked (forgetting). The TRC attempted an **engineered handover**.
      *   **Where the theory breaks:** Neither author adequately addresses the *fidelity loss* during that handover. Margalit worries about the loss of *meaning*; Rieff worries about the gain of *myth*. The TRC shows that you can preserve the *data* (high fidelity) while losing the *context* (low fidelity).

  ### Summary of the Breakage

  Your hunch holds up. The TRC exposes a gap in both theories regarding **institutional mediation**.

  1.  **Margalit** assumes memory is interpersonal. He cannot account for a system where the "person" remembering is the State, and the "person" being remembered is a Dataset. He would likely view the TRC archive as a tombstone: a marker that the relation is dead, not a tool to keep it alive.
  2.  **Rieff** assumes memory is volatile fuel. He doesn't account for memory as **infrastructure**. The TRC turned memory into infrastructure (a legal and historical record). Infrastructure doesn't burn; it just sits there. Rieff doesn't have a category for "inert truth."

  **The Verdict:**
  The TRC suggests that in modern mass societies, the "Duty to Remember" is no longer a duty on *persons* to hold things in mind. It is a duty on *institutions* to maintain accessibility and integrity.

  If that is true, Margalit is wrong that the duty requires "thick relations." It requires **good governance**. If the archive is searchable, uncorrupted, and taught in schools, the duty is discharged, even if no one feels a pang of grief when they read it.

  Conversely, if the archive is accessible but ignored (which is the current risk in SA), then Rieff is vindicated: the society chose survival over memory. The "engineered forgetting" of legal liability eventually bled into the "engineered forgetting" of the truth itself.

  The TRC didn't solve the philosophical problem; it built a machine to manage it. The machine is running, but the operators (the citizens) are walking away from the console. That is the failure neither philosopher predicted: not that we *can't* remember, but that we *won't* query the database.
