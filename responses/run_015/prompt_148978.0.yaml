prompt: |-
  As a retired experimental physicist who has only recently begun studying philosophy of science and measurement theory, I now chair a university committee that allocates seed grants for interdisciplinary pilot studies spanning the natural and social sciences. We have adopted quantitative evaluation metrics—citation velocity, cross-disciplinary collaboration scores, and replication-rate proxies—to determine which preliminary projects should be scaled. Having encountered Goodhart’s law and the problem of specification gaming, I am convinced that our metrics are being optimized against rather than serving as faithful indicators of scientific quality. The committee, however, needs an operational framework, not merely a warning.

  Please construct a reusable decision procedure—structured as an ordered checklist with explicit stopping rules and clearly flagged judgment points—that my committee can apply to any proposed evaluation metric before formal adoption. The procedure should be grounded in the conceptual distinction between proxy corruption, in which the metric decouples causally from its intended target, and target displacement, in which the system being evaluated redefines success so that it coincides with the metric. It should also include a specific diagnostic for what I shall term reflexive gaming: cases in which researchers anticipate the evaluation criterion and alter their study design not to improve the underlying phenomenon, but to generate the appearance of improvement without producing detectable proxy corruption. The procedure must specify, in order: (1) preliminary questions regarding causal coupling between the measurement apparatus and the phenomenon measured; (2) conditions under which a metric must be rejected outright; (3) conditions under which it may be retained with institutional safeguards; and (4) the precise points at which no procedural rule can substitute for an explicit normative judgment about what the committee actually values in scientific work.

  Apply the procedure to three cases: (a) using replication-rate proxies to evaluate pilot studies in behavioral psychology; (b) using cross-disciplinary citation counts to evaluate collaborations between climate science and the humanities; and (c) a hypothetical scenario in which the procedure recommends retaining a metric with safeguards, yet the recommendation conflicts with institutional incentives for rapid, quantifiable outcomes and is therefore likely to be resisted by the committee. Finally, articulate what the procedure is structurally unable to determine, particularly with respect to the prior selection of the target phenomenon itself. Constraints: the committee meets monthly, members have no formal training in philosophy or statistics, and any recommendation must be defensible to a non-specialist university administrator within a ten-minute presentation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Retired experimental physicist, new to philosophy of science/measurement theory, chairs a university seed grant committee.
      *   **Context:** Committee allocates interdisciplinary seed grants. Uses quantitative metrics (citation velocity, cross-disciplinary collaboration scores, replication-rate proxies).
      *   **Problem:** Suspects Goodhart's Law and specification gaming (metrics optimized rather than indicating quality). Needs an *operational framework*, not just a warning.
      *   **Task:** Construct a reusable decision procedure (ordered checklist, stopping rules, flagged judgment points) for evaluating proposed metrics.
      *   **Key Concepts to Integrate:**
          *   Proxy Corruption (metric decouples from target).
          *   Target Displacement (system redefines success to match metric).
          *   Reflexive Gaming (researchers alter design to *appear* improved without proxy corruption).
      *   **Procedure Structure:**
          1.  Preliminary questions (causal coupling).
          2.  Outright rejection conditions.
          3.  Retention with safeguards conditions.
          4.  Points requiring explicit normative judgment.
      *   **Applications:** Apply to three cases:
          (a) Replication-rate proxies in behavioral psychology.
          (b) Cross-disciplinary citation counts (climate science + humanities).
          (c) Hypothetical conflict (safeguards recommended vs. institutional pressure for speed/quantification).
      *   **Final Requirement:** Articulate what the procedure *cannot* determine (specifically regarding target selection).
      *   **Constraints:** Committee meets monthly, no formal training in philosophy/stats, recommendations must be defensible to administrators in a 10-minute presentation.

  2.  **Deconstruct the Decision Procedure (The "Metric Vetting Protocol"):**

      *   *Goal:* Make it actionable for non-philosophers but rigorous enough to satisfy the physicist's concern.
      *   *Structure:* Needs to be a checklist with "Stop/Go" signals.
      *   *Concept Integration:*
          *   *Proxy Corruption:* Check if the metric can be gamed without doing the work.
          *   *Target Displacement:* Check if the metric changes the goal of the science.
          *   *Reflexive Gaming:* Check if study design changes *only* to hit the metric.
      *   *Normative Points:* Where do we have to say "What do we actually value?"
      *   *Constraints:* Keep language clear (no jargon without definition), fit for a 10-minute pitch.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Causal Coupling.* Ask: Does measuring this change the thing? Is there a direct link?
      *   *Step 2: Rejection.* If the link is weak or easily severed, reject. If gaming is trivial, reject.
      *   *Step 3: Safeguards.* If the link is strong but vulnerable, add safeguards (audits, qualitative overlays).
      *   *Step 4: Normative Judgment.* Where do we decide what "good science" is? This is crucial.
      *   *Reflexive Gaming Diagnostic:* Need a specific test for this. Maybe "The Design Shift Test."

  4.  **Developing the Three Cases:**

      *   *Case A (Replication in Psych):* High risk of reflexive gaming (p-hacking to replicate, or choosing easy studies). Target displacement (replication becomes the goal, not discovery).
      *   *Case B (Citations Climate + Humanities):* High risk of proxy corruption (citations don't measure impact on policy or understanding). Cross-disciplinary citations might be rare naturally.
      *   *Case C (Institutional Conflict):* This is the political reality check. The procedure says "wait/safeguards," administration says "show numbers now."

  5.  **Addressing the Limitations:**

      *   The procedure evaluates *metrics*, not *goals*. It can't tell you if "interdisciplinary work" is actually the right goal. It assumes the target is fixed.

  6.  **Refining for Constraints:**

      *   *Tone:* Professional, respectful of the physicist's background (use analogies to measurement error/systematics), but accessible to non-specialists.
      *   *Format:* Clear headings, bullet points, bold text for emphasis.
      *   *10-Minute Pitch:* The summary needs to be punchy.

  7.  **Writing the Content (Mental Simulation & Correction):**

      *   *Correction on Terminology:* Ensure "Proxy Corruption" and "Target Displacement" are clearly distinguished as requested.
      *   *Reflexive Gaming:* Make sure this is distinct. It's not just gaming the metric (proxy corruption); it's gaming the *design* to look good without breaking the metric's link to the target *technically*, but voiding the spirit. Actually, the prompt defines it as "alter study design... to generate appearance of improvement without producing detectable proxy corruption." This is subtle. It means the metric still tracks the target, but the target itself is being manipulated to be easier to hit, or the design is skewed. I need to make sure the diagnostic catches this.
      *   *Constraint Check:* "Committee meets monthly." The procedure shouldn't take 3 months to apply. It needs to be doable in a meeting.
      *   *Constraint Check:* "Defensible to non-specialist admin." Avoid heavy philosophical jargon where possible, or define it simply.

  8.  **Final Polish:**

      *   Ensure the "Stopping Rules" are explicit.
      *   Ensure the "Judgment Points" are flagged.
      *   Check the application section against the procedure steps.
      *   Verify the "Structural Inability" section addresses target selection.

      *(Self-Correction during drafting)*: I initially thought about making the procedure very long. I need to condense it so it fits the "10-minute presentation" constraint for the admin. I will create a "One-Page Summary" version within the response.
      *(Refining Reflexive Gaming)*: The prompt defines it specifically: "anticipate evaluation criterion and alter study design not to improve underlying phenomenon, but to generate appearance of improvement without producing detectable proxy corruption." This implies the metric *still correlates* with the target, but the *effort* is misaligned. Example: Doing easy replications to boost replication rate, rather than hard ones. The metric (replication rate) still measures replicability, but the *portfolio* of science shifts to trivial truths. I need to capture this in the diagnostic.

  9.  **Final Review against Prompt Requirements:**
      *   Reusable decision procedure? Yes.
      *   Ordered checklist? Yes.
      *   Stopping rules? Yes.
      *   Flagged judgment points? Yes.
      *   Grounded in Proxy Corruption vs. Target Displacement? Yes.
      *   Diagnostic for Reflexive Gaming? Yes.
      *   Four specific steps included? Yes.
      *   Three cases applied? Yes.
      *   Structural inability articulated? Yes.
      *   Constraints met (monthly meeting, no training, 10-min pitch)? Yes.

