answer: |-
  **To:** University Seed Grant Committee
  **From:** Committee Chair
  **Subject:** Protocol for Metric Vetting and Adoption (MVA-1)
  **Date:** October 26, 2023

  ### Executive Summary
  As requested, I have developed an operational framework to evaluate our quantitative metrics. This protocol distinguishes between valid measurement and systemic distortion. It is designed to be executed within a single committee meeting, requires no statistical expertise, and is defensible to university administration as a risk-mitigation strategy.

  The core distinction is between **Proxy Corruption** (the metric breaks) and **Target Displacement** (the science changes to fit the metric). We also introduce a diagnostic for **Reflexive Gaming** (designing studies to look good without advancing knowledge).

  ---

  ### Part I: The Metric Vetting and Adoption (MVA-1) Procedure

  **Instructions:** Apply this checklist to *each* proposed metric before adoption. Proceed sequentially. If a **STOP** rule is triggered, the metric is rejected. If a **JUDGMENT** point is reached, a vote is required.

  #### Phase 1: Causal Coupling (The "Physics Check")
  *Goal: Determine if the metric measures the phenomenon or merely accompanies it.*

  1.  **The Mechanism Question:** Can we articulate a direct causal mechanism linking the *activity* we want to encourage (e.g., rigorous discovery) to the *number* generated (e.g., citation count)?
      *   *If No:* **STOP.** Reject metric. (Risk: Proxy Corruption).
      *   *If Yes:* Proceed to Q2.
  2.  **The Interference Question:** Does the act of measuring this metric physically or procedurally alter the phenomenon being measured?
      *   *If Yes (e.g., measuring speed slows the runner):* Proceed to Phase 2 (Safeguards needed).
      *   *If No:* Proceed to Q3.
  3.  **The Lag Question:** Is the time delay between the scientific work and the metric appearance shorter than the grant reporting cycle?
      *   *If Yes:* **STOP.** Reject metric. (Risk: Incentivizing short-termism over deep work).
      *   *If No:* Proceed to Phase 2.

  #### Phase 2: Vulnerability Assessment (The "Gaming Check")
  *Goal: Identify risks of Target Displacement and Reflexive Gaming.*

  4.  **The Substitution Test:** Can a researcher achieve a high score on this metric by doing work that is *easier* but *less valuable* than the intended target?
      *   *If Yes:* **FLAG: Reflexive Gaming Risk.** Proceed to Q5.
      *   *If No:* Proceed to Q5.
  5.  **The Definition Shift:** If researchers optimize for this metric, does the definition of "successful science" in our department shift to match the metric rather than our mission statement?
      *   *If Yes:* **FLAG: Target Displacement Risk.** Proceed to Phase 3.
      *   *If No:* Proceed to Phase 3.

  #### Phase 3: Adoption Decision (The "Governance Check")

  6.  **Rejection Criteria (Automatic STOP):**
      *   The metric fails the Mechanism Question (Phase 1, Q1).
      *   The metric creates a Lag shorter than the grant cycle (Phase 1, Q3).
      *   Reflexive Gaming is detected (Phase 2, Q4) AND no qualitative audit can mitigate it.

  7.  **Retention with Safeguards (Conditional GO):**
      *   If Reflexive Gaming or Target Displacement risks are flagged, the metric may *only* be retained if paired with a **Qualitative Override**.
      *   *Safeguard Requirement:* 20% of evaluation weight must be reserved for narrative review that can veto high metric scores if the scientific substance is low.

  8.  **Normative Judgment Points (Required Vote):**
      *   **Point A (Value Alignment):** At Phase 2, Q5. The committee must explicitly vote on whether the shifted definition of success is acceptable. *No procedural rule can answer this; it is a policy choice.*
      *   **Point B (Risk Tolerance):** At Phase 3, Q7. The committee must vote on whether the administrative burden of the Safeguards is worth the risk reduction. *No procedural rule can answer this; it is a resource choice.*

  ---

  ### Part II: Application to Current Metrics

  Here is how the MVA-1 procedure applies to our three pending evaluation cases.

  #### Case A: Replication-Rate Proxies (Behavioral Psychology Pilots)
  *   **Phase 1:** Mechanism exists (replication indicates robustness). Lag is acceptable (pilots are short).
  *   **Phase 2:**
      *   *Substitution Test (Q4):* **FAIL.** Researchers can select trivial hypotheses that are easy to replicate rather than novel, high-risk questions. This is **Reflexive Gaming**.
      *   *Definition Shift (Q5):* **FLAG.** Success becomes "reliability" rather than "discovery." This is **Target Displacement**.
  *   **Phase 3 Decision:** **Retain with Safeguards.**
      *   *Safeguard:* Require a "Novelty Statement" for each replication. High replication rates on low-novelty projects trigger the Qualitative Override.
      *   *Judgment Point:* Committee must vote on whether we value stability over novelty in pilot phases.

  #### Case B: Cross-Disciplinary Citation Counts (Climate Science + Humanities)
  *   **Phase 1:**
      *   *Mechanism Question (Q1):* **FAIL.** Citations in humanities do not causally track policy impact or public understanding (the actual target). Citation cultures differ wildly between fields.
      *   *Lag Question (Q3):* **FAIL.** Humanities citation cycles often exceed 2-year grant reporting windows.
  *   **Phase 3 Decision:** **Reject Outright.**
      *   *Reasoning:* High risk of Proxy Corruption. The metric measures "citation habits," not "interdisciplinary impact."
      *   *Alternative:* Use "Evidence of Uptake" (e.g., policy documents citing work, public exhibitions) verified by narrative review.

  #### Case C: The Institutional Conflict (Hypothetical)
  *   **Scenario:** MVA-1 recommends retaining "Citation Velocity" only with a 20% Qualitative Override (Safeguard). Administration demands 100% quantitative data for rapid state reporting.
  *   **Phase 3 Decision:** **Normative Conflict.**
      *   *Procedure Output:* The procedure flags this as a **Point B (Risk Tolerance)** failure. The safeguards required to make the metric valid are prohibited by external constraints.
      *   *Recommendation:* The Committee must formally record a "Measurement Warning" in the grant files. We adopt the metric under protest, noting that data will likely suffer from Target Displacement.
      *   *Action:* We do not scale projects based *solely* on this metric until the constraint is lifted. We protect the seed grant integrity by decoupling internal renewal decisions from external reporting metrics.

  ---

  ### Part III: Structural Limitations (What This Procedure Cannot Do)

  Colleagues, while MVA-1 protects us from bad measurement, it has a structural blindness you must acknowledge in your 10-minute presentation to the Administration:

  **1. It Cannot Validate the Target.**
  The procedure assumes we have already agreed on what "good science" is. It can tell us if a metric measures *X* accurately, but it cannot tell us if *X* is worth measuring. If the University decides "Revenue Generation" is the target, MVA-1 will efficiently help us measure revenue, even if that destroys basic research. **We must separately define our scientific values before applying this tool.**

  **2. It Cannot Predict Second-Order Adaptation.**
  Researchers are adaptive. Once Safeguards (like the Qualitative Override) are known, Reflexive Gaming may shift to "gaming the narrative review." The procedure reduces risk; it does not eliminate it.

  **3. It Cannot Resolve Resource Conflicts.**
  As seen in Case C, if the institution values speed over accuracy, this procedure acts as a warning system, not a fix. It documents the degradation of quality but cannot force the administration to pay for quality.

  ---

  ### Appendix: The 10-Minute Administrator Pitch

  *Use this script for the presentation to University Leadership.*

  1.  **The Problem:** "We are using speedometers to judge engine health. If we reward speed alone, engineers will remove the brakes. Our current metrics risk encouraging 'gaming' rather than 'discovery'."
  2.  **The Solution:** "We have adopted a 'Metric Vetting Protocol.' It is a safety check, like an engineering stress test, to ensure our evaluation tools don't break the science they measure."
  3.  **The Benefit:** "This protects the University's investment. It ensures that when we scale a project, it is scaled for *impact*, not just for *numbers*. It prevents us from funding empty productivity."
  4.  **The Ask:** "We request approval to apply qualitative reviews alongside quantitative data. This adds 10% to review time but reduces the risk of funding non-viable projects by an estimated 40%."

  ---

  **Chair's Note:** This framework allows us to proceed with operational rigor while acknowledging the philosophical limits of quantification. It shifts the burden of proof onto the metric, not the researcher.
