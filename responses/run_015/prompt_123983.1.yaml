  Dear Friend,

  It is a privilege to read an account of your work, not only because of the care you have clearly taken with these voices over fifteen years, but because your observation cuts through a great deal of academic noise to touch the bone of how communities actually live with their past. You have identified a phenomenon that historians, sociologists, and anthropologists grapple with constantly, though they often bury it under layers of theory. You ask if there is an established name for this, and the honest answer is that there are several nearby terms, but none that capture the specific ethical stance you have described without carrying unwanted baggage. The field generally speaks of collective memory or social memory, but these are broad categories that describe the fact of shared remembering rather than the specific mechanism of maintaining a known inaccuracy for a functional purpose. There is also the anthropological concept of the charter myth, which refers to a story that justifies a social order or obligation, but in common usage the word myth implies a falsehood that people believe to be true, whereas in your examples the people know the detail is false and keep the story anyway. Because there is no single clean label in common circulation that fits the precision of your notes, I will offer you a coined term that attempts to capture the shape of the idea you have found, along with the boundaries you requested.

  I propose calling this a constitutive narrative. The word constitutive is chosen to indicate that the story does not merely describe a relationship but actually constitutes it, bringing the obligation or the identity into existence and holding it there. In your first example, the story of the locked doors constitutes the town's relationship to the owners as one of victims to negligents, and correcting the detail to jammed doors would not sustain that specific moral shape with the same force. In the second, the story constitutes the obligation between the families; the money is the physical enactment of the narrative, and the narrative is the vessel for the money. If you remove the vessel, the liquid spills. The third example is the most difficult, but it fits the same pattern because the community's stance toward the archive was the same in all three cases. They asserted that the meaning of the event belonged to them, not to the paperwork. The fact that the remains were found later is a contingent outcome, not a principled difference. The phenomenon is the claim of sovereignty over the meaning of the past, not the accuracy of the claim itself. Whether the archive eventually agrees or disagrees is a matter of luck or further discovery, but the community's refusal to let the archive adjudicate the moral weight of the memory is the constant factor. Therefore, there is no principled difference between the vindicated case and the non-vindicated ones; the difference is only in how the world happened to align with their memory later. The phenomenon is the stance of independence from archival authority, not the correctness of the memory.

  To distinguish this from nearby things it might be confused with, we must look at where the line falls. A constitutive narrative is not the same as propaganda or state-imposed history. If a government forces a story upon a population through censorship or education, and the population repeats it out of fear or habit without internal commitment, that is coercion, not a constitutive narrative. The key ingredient you have noticed is the voluntary maintenance of the story by the community itself. The people choose to keep the story because it does work for them that the corrected version cannot do. Similarly, this is not the same as simple denial or stubbornness. In denial, the community rejects the evidence because they cannot bear the truth. In your examples, they accept the evidence but reject its authority to dissolve the social bond. They are saying, in effect, that the truth of the relationship is more important than the truth of the event. This is where the boundary becomes critical. For a story to remain a constitutive narrative rather than becoming a harmful falsehood, it must not cost a named living person something real. If the story accused a specific living individual of a crime they did not commit, it would cross the line from a symbolic binding of a community into a libelous act. The safety valve here is that the stories you recorded are about the dead, or about structural forces like owners versus workers, or about abstract obligations between families who are both complicit in the maintenance of the story. Once the inaccuracy inflicts tangible harm on a living person who cannot consent to the myth, it stops being a constitutive narrative and becomes a weapon.

  Another boundary case involves the source of the story. If the story is imposed from above by a state or an institution to secure loyalty, it lacks the organic quality of the constitutive narrative. Your examples are all bottom-up; they arise from the people who live with the consequences of the history. This distinction matters because it tells us who owns the memory. In a constitutive narrative, the community owns the memory and accepts the responsibility for its maintenance. They are not being deceived; they are deceiving no one. They are engaging in a form of social ritual where the factual accuracy is secondary to the performative truth. This is why the university historian in the first example was treated as though she had misunderstood what a commemoration is. She was speaking the language of the archive, where facts adjudicate meaning. The town was speaking the language of the ritual, where meaning adjudicates facts. They were not talking past each other so much as playing different games with different rules. The town accepts the rules of the archive for the purpose of insurance files or historical records, but they switch to the rules of the constitutive narrative for the purpose of mourning and identity.

  So, to summarize the definition you might use in your notes: a constitutive narrative is a story maintained by a community after factual inaccuracy has been established and accepted, because the story performs a necessary social function that the corrected version cannot perform. It is distinguished from propaganda by its voluntary nature, from denial by its acceptance of the evidence, and from libel by its lack of harm to living persons. The vindication of the story by later evidence, as in your third case, does not change the nature of the phenomenon, because the community's commitment was to the meaning, not the verification. They were willing to be wrong in fact to be right in bond. This is a heavy thing to carry, and it speaks to the depth of your work that you have seen the shape of it so clearly. You called them anchor stories, and that is a fine name, but constitutive narrative might help you separate them from other kinds of stories that anchor people for different reasons. Whatever term you choose, you have identified a real mechanism of human society, one that suggests that for communities, the truth of who we are to each other often outweighs the truth of what happened to us. I hope this helps you place what you have seen, and I thank you for the work you do to preserve these voices, even the ones that speak in riddles.

  Yours sincerely,

  A Reader
