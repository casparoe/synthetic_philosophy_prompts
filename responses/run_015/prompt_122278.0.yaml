              *   *NU:* Focus on objective suffering markers (physiological/behavioral), not reported happiness.
              *   *SFC:* Reported welfare matters, but must be corrected for adaptation.
              *   *Prediction:* NU predicts objective suffering metrics are sufficient for policy. SFC predicts we need complex welfare proxies to avoid false negatives on happiness.

      *   **Section 4: Assessment of Verbal vs. Substantive:**
          *   *Terminology:* "Neutral" vs. "Good." NU says non-suffering is neutral. SFC says it's good (but less weight).
          *   *Practical Convergence:* In the "real world" (scarcity, severe suffering exists), do they act differently? Mostly no. The divergence only appears in "trolley problem" extremes or population creation scenarios.
          *   *Conclusion:* The dispute is largely axiological (theory of value) rather than deontic (action-guiding) for near-term policy, *except* regarding procreation and existential risk involving potential suffering.

