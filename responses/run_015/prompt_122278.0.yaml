  # JOINT STATEMENT ON THE PRIORITY OF SUFFERING REDUCTION
  **An Adversarial Collaboration Between Axiological Negative Utilitarianism and Suffering-Focused Consequentialism**

  ## 1. Preamble
  This document records the points of convergence and divergence between two ethical frameworks: **Axiological Negative Utilitarianism (NU)**, which posits that suffering is the sole intrinsic disvalue and non-suffering is neutral; and **Suffering-Focused Consequentialism (SFC)**, which posits that while happiness has positive value, the moral weight of suffering is convex and disproportionately high relative to well-being. The signatories affirm that while foundational axiological disagreements remain, there exists a robust overlap in action-guiding principles regarding the mitigation of severe suffering.

  ## 2. Agreed Claims
  The undersigned parties affirm the following propositions as shared commitments. These claims are phrased to accommodate both the lexical priority of NU and the steep convex weighting of SFC.

  1.  **Formal Structure of Evaluation:** Standard linear aggregation of welfare (where one unit of suffering can be offset by one unit of happiness) is rejected. Both parties agree that moral evaluation must operate via a **Suffering-Weighted Function**. Whether this is achieved through a lexical ordering (where suffering trumps all else) or a steep convex function (where the marginal disvalue of suffering increases rapidly), the practical output dictates that the reduction of intense suffering takes precedence over the creation of mild to moderate well-being in nearly all empirically realistic scenarios.
  2.  **Fixed-Population Duties:** Regarding policies that affect future individuals *without* altering the numerical identity of those who come to exist (i.e., where the same specific individuals would exist regardless of the policy choice), both parties agree that the obligation to prevent severe suffering is binding. The mere fact that a future individual would not exist without a specific policy does not negate the duty to reduce their suffering if they *do* exist; however, in cases where the policy choice determines *which* individuals exist, the parties acknowledge a divergence on whether existence itself is a harm or benefit (see Section 3).
  3.  **Moral Status of Non-Human and Artificial Sentience:** Moral consideration is grounded in the capacity for valenced experience (sentience), not species membership or biological substrate. Consequently, wild-animal suffering and the potential suffering of artificial or synthetic minds fall within the scope of moral concern. Interventions aimed at reducing suffering in these domains are prioritized over interventions aimed solely at increasing pleasure or preference satisfaction for already well-off populations.
  4.  **Empirical Revisability:** Both positions are consequentialist in structure and therefore sensitive to empirical facts. If robust evidence demonstrates that a specific suffering-reduction intervention inadvertently causes greater aggregate suffering (under the agreed weighted function) than the status quo, both parties agree the intervention must be revised or abandoned. The disagreement lies in the *weighting* of outcomes, not in the requirement to maximize the weighted good.

  ## 3. Statement of Disagreements
  The following table delineates the specific axiological and deontic points where the two frameworks diverge. Each position is stated in terms acceptable to its proponent.

  | Issue | Axiological Negative Utilitarianism (NU) | Suffering-Focused Consequentialism (SFC) |
  | :--- | :--- | :--- |
  | **Nature of the Asymmetry** | **Axiological Zero-Point:** Non-suffering states are morally neutral (value = 0). Happiness is merely the absence of suffering or a distractor with no intrinsic positive value. The asymmetry is fundamental to the nature of value. | **Axiological Weighting:** Non-suffering states (happiness) possess positive intrinsic value. The asymmetry arises because the disvalue of suffering scales non-linearly (convexly) and outweighs positive value at high intensities. |
  | **Offsetting Conditions** | **Lexical Priority:** No quantity of happiness, regardless of magnitude or duration, can morally justify the imposition of severe, involuntary suffering. The trade-off function is discontinuous. | **Convex Trade-offs:** There exists a theoretical threshold where sufficient aggregate well-being could offset a unit of suffering, though the ratio is astronomically high. The trade-off function is continuous but steep. |
  | **Moral Risk Asymmetry** | **Catastrophic Error:** The moral risk of permitting severe suffering is infinite or absolute. Policies that risk severe suffering for the chance of well-being creation are inherently impermissible. | **Disproportionate Error:** The moral risk of permitting severe suffering is vastly greater than the risk of failing to create well-being, but it is subject to expected-value calculation. Risk aversion is rational but not absolute. |

  ## 4. Cruxes and Predictive Divergence
  The following scenarios identify the specific conditions under which the two frameworks yield different practical prescriptions. Resolving these cruxes is necessary for theoretical unification.

  ### Crux A: Suffering-Dominance vs. Lexicality Under Uncertainty
  **The Question:** Does the sheer magnitude of potential suffering always dominate expected value calculations, effectively mimicking lexicality even within a convex framework, or does lexicality forbid calculations that SFC permits?
  **The Case:** *The High-Stakes Welfare Gamble.* A policy offers a 90% probability of creating a population of one billion beings with high well-being and a 10% probability of creating a population of one billion beings subjected to intense, unremitting torture.
  *   **NU Prediction:** The policy is strictly forbidden. The 10% risk of severe suffering cannot be counterbalanced by the 90% chance of happiness, as happiness has no positive value to offset the disvalue of torture.
  *   **SFC Prediction:** The policy is likely forbidden due to the convex weight of torture, *but* it is not forbidden in principle. If the well-being population were sufficiently large (e.g., trillions) or the probability of torture sufficiently low (e.g., 0.0001%), the expected value could theoretically become positive. SFC allows for a calculation; NU forbids the calculation.

  ### Crux B: Adaptive Preferences and Welfare Measurement
  **The Question:** Do subjective reports of well-being reliably track moral value, or does suffering reduction require objective metrics that override adaptive preferences?
  **The Case:** *The Contented Oppressed Population.* An intervention removes a source of severe physical pain from a population but disrupts their social structure, leading them to report lower "life satisfaction" due to raised expectations and loss of cultural cohesion, despite the removal of objective suffering markers.
  *   **NU Prediction:** The intervention is morally successful. The reduction of objective suffering (physiological/behavioral markers of distress) is the sole metric of success. Reported "satisfaction" is irrelevant if suffering is reduced.
  *   **SFC Prediction:** The intervention is ambiguous. While the reduction of suffering is a major gain, the decrease in reported well-being represents a genuine loss of positive value. The net moral value depends on whether the convex weight of the pain removed exceeds the linear/convex loss of the reported satisfaction.

  ## 5. Assessment of Verbal vs. Substantive Dispute
  A portion of the disagreement appears to be verbal rather than substantive, specifically regarding the labeling of non-suffering states.

  1.  **The Zero-Point Dispute:** NU describes non-suffering as "neutral," while SFC describes it as "good." However, both agree that in a world containing severe suffering, resources directed toward creating "good" (happiness) for the already well-off are morally inferior to resources directed toward alleviating "bad" (suffering) for the afflicted. If SFC concedes that the "good" of happiness is lexically dominated by the "bad" of suffering in all realistic resource-allocation scenarios, the practical distinction collapses.
  2.  **Formal Weighting and Practical Dissolution:** Settling the formal-weighting question (lexical vs. convex) would not fully dissolve the practical disagreement. Even if a convex function is adopted, if the curve is steep enough, it will mimic lexical priority in all finite real-world cases. The substantive divergence remains only in:
      *   **Population Ethics:** Decisions regarding procreation and the creation of new lives (where NU leans toward antinatalism and SFC does not).
      *   **Existential Risk:** Scenarios involving low-probability, high-stakes outcomes where expected value calculations might permit risks that NU forbids.

  **Conclusion:** The signatories agree that for the purposes of near-term policy, advocacy, and resource allocation regarding existing sentient beings, the divergence is negligible. The dispute remains significant primarily for long-term future scenarios, population ethics, and the theoretical foundations of value.

  ***

