prompt: |-
  I teach moral philosophy, and for the last three years I have served as faculty adviser to a student giving circle that allocates roughly $20,000 a year among charities working on global health, farmed-animal welfare, and disaster relief. Over that time the group has drifted, informally and without ever voting on it, toward a suffering-focused outlook: they weight the prevention of intense suffering far more heavily than the creation of happiness or the extension of painless lives, and several members are sympathetic to a broadly negative-utilitarian position. They have asked me to help them make this explicit — to turn a mood into a method — and I have concluded that I am the wrong person to do it, since my job in the room is to argue with them, not to systematize them. So I am outsourcing it.

  What I want from you is a decision procedure the group can actually run: a sequence of questions, applied to a shortlist of eight to twelve candidate organizations, that produces a ranking the group can then vote on, within the constraints of a single two-hour meeting each quarter. The members are intelligent undergraduates with no philosophical training, so the procedure must be executable without theory: each question should be one a student can answer from a charity's published material and one page of notes, and each should have a stated threshold at which the answer is sufficient, insufficient (charity deprioritized), or indeterminate (flagged for the final discussion). The conceptual work is in the translation, and I want you to be explicit about how you did it:

  1. Which distinctions internal to suffering-focused ethics must survive the simplification, and which you deliberately dropped. The candidates I see are: intensity versus duration of suffering; suffering that ends in death versus suffering that persists; preventing future suffering versus relieving present suffering; the suffering of presently existing beings versus beings who will exist only if the intervention succeeds or fails; and quick deaths that preempt suffering versus deaths preceded by it. Some of these can be collapsed; some cannot without distorting the position. Say which is which and why.

  2. At least one worked application in which the procedure yields a result the group will not like. My candidates, though you may choose others: ranking palliative analgesia for a small number of people in severe pain above preventing many quick deaths; or declining to fund a life-saving program because the deaths it averts are, by the available accounts, largely painless. Run the procedure on whichever case you pick, step by step, and show where the uncomfortable verdict is generated rather than stipulated.

  3. A guard-rail section. You will know, as I do, that strict negative utilitarianism is committed to views the group would find monstrous if stated plainly — that a world without suffering is preferable even if it contains no one, and that eliminating life could therefore be a solution. The procedure must never output anything that treats the elimination of capacity for suffering as a terminus rather than a tragedy, and I want you to say where the guard-rail is doing real work and where it is merely papering over a commitment the group has not examined.

  4. An honest accounting of where the procedure will misfire. In particular: the places where a numeric-looking step (weighting intensity against numbers of sufferers, trading chronic mild suffering against acute severe suffering) is a judgment call dressed up as arithmetic; the points at which reasonable suffering-focused theorists disagree with one another, so the procedure is choosing a convention, not applying the theory; and the point at which the group should stop and vote, because the remaining question is one of values that no procedure can settle.

  Finally, tell me what the procedure cannot do at all. I want a short closing statement of the indeterminacies in negative utilitarianism itself — how to compare aggregate against intensity, whether and how death is bad for the one who dies painlessly, whether small harms to many can ever outweigh agony in a few — such that any ranking produced under this heading is a convention the group has adopted, and should be presented to donors as such. If it works, the group gets a method it can defend; if it fails, I would rather it fail visibly, in the places you flag, than invisibly, in the arithmetic.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Moral philosophy professor, faculty adviser to a student giving circle.
      *   **Context:** Group allocates ~$20k/year. Drifted toward suffering-focused ethics (SFE) / negative utilitarianism (NU).
      *   **Task:** Create a concrete decision procedure (algorithm/checklist) for the group to rank 8-12 charities in a 2-hour quarterly meeting.
      *   **Constraints:**
          *   Executable by intelligent undergrads without philosophical training.
          *   Based on charity published material + 1 page of notes.
          *   Questions must have thresholds (Sufficient, Insufficient, Indeterminate).
          *   Must explain the translation from theory to practice (what distinctions kept/dropped).
          *   Must include a worked application yielding an "uncomfortable" result.
          *   Must include guard-rails against "monstrous" NU implications (e.g., benevolent world explosion).
          *   Must honestly account for misfires (judgment calls disguised as arithmetic).
          *   Must conclude with limitations/indeterminacies of NU itself.
      *   **Tone:** Rigorous, transparent, pedagogical, honest about limitations.

  2.  **Deconstruct Suffering-Focused Ethics (SFE) for Practical Application:**
      *   *Core Tenet:* Reduction of suffering is the primary moral priority. Happiness is secondary or irrelevant.
      *   *Key Distinctions (from prompt):*
          *   Intensity vs. Duration.
          *   Suffering ending in death vs. persisting.
          *   Prevention (future) vs. Relief (present).
          *   Existing beings vs. Future beings (non-identity problem).
          *   Quick death vs. Suffering-filled death.
      *   *Simplification Strategy:* Students need actionable metrics. Complex metaphysical debates (non-identity, person-affecting views) must be operationalized or bracketed.
      *   *Decision:* Focus on *Intensity* and *Tractability*. Duration matters but is secondary to intensity (lexical priority often implied in strong SFE). Future vs. Present matters less than *certainty* of suffering reduction. Death is instrumentally relevant only insofar as it prevents or causes suffering.

  3.  **Drafting the Procedure (The "Suffering-Weighted Allocation Protocol" - SWAP):**
      *   *Goal:* Rank charities based on "Suffering Averted per Dollar."
      *   *Structure:* Three Rounds (Elimination, Scoring, Deliberation).
      *   *Round 1: The Negative Screen (Guard-rails & Basic Fit).*
          *   Does it increase capacity for suffering without reducing actual suffering? (Guard-rail against eugenics/elimination).
          *   Is the primary outcome suffering reduction?
      *   *Round 2: The Intensity/Duration Matrix.*
          *   Categorize suffering type (Agony, Severe, Moderate, Mild).
          *   Estimate numbers.
      *   *Round 3: The Tractability Check.*
          *   Evidence quality.
      *   *Thresholds:* Need clear Pass/Fail/Maybe criteria.

  4.  **Addressing Specific Prompt Requirements:**

      *   **1. Distinctions (Keep vs. Drop):**
          *   *Keep:* Intensity (lexical priority), Tractability (evidence).
          *   *Drop/Modify:* Non-identity (too complex for 2 hours, treat future beings as "potential sufferers"), Death (instrumental only).
          *   *Why:* Intensity is the heart of SFE. Non-identity creates paralysis. Death is only bad if the process is painful or the loss leads to net suffering elsewhere (rarely the case in SFE, but need to be careful).

      *   **2. Worked Application (Uncomfortable Result):**
          *   *Scenario:* Palliative Care (high intensity, low N) vs. Malaria Nets (low/moderate intensity per person, huge N, prevents death).
          *   *SFE Logic:* If the agony of dying from malaria is severe, nets win. If the death is quick/painless, nets look like "population increase" (more people to suffer later). Palliative care addresses *guaranteed* intense suffering now.
          *   *Selection:* Let's go with the prompt's suggestion: Palliative Analgesia vs. Life-Saving (painless death prevention).
          *   *Verdict:* Procedure ranks Palliative Care higher.
          *   *Why:* Intensity weight outweighs the "life saved" metric because the "life saved" metric doesn't count as "suffering averted" if the death wasn't painful.

      *   **3. Guard-Rails:**
          *   *Risk:* "Benevolent World Explosion" (destroying life to end suffering).
          *   *Mechanism:* A "Capacity Constraint." No funding for interventions that reduce the *population* of sufferers directly (e.g., sterilization, euthanasia) unless it is voluntary relief of *current* suffering.
          *   *Honesty:* Acknowledge this is a deontological side-constraint imposed on a consequentialist framework.

      *   **4. Honest Accounting of Misfires:**
          *   *Arithmetic Illusion:* Weighting intensity (1-10 scale) is subjective.
          *   *Convention:* Deciding that 1 unit of Agony = 100 units of Mild Pain is a value judgment, not math.
          *   *Stop Point:* When evidence runs out, vote based on intuition.

      *   **5. Closing Statement (Indeterminacies):**
          *   Aggregation vs. Lexicality.
          *   Death's badness.
          *   The "Happy Hell" problem (is a life with net positive happiness but some suffering worth creating?).

  5.  **Refining the Procedure for a 2-Hour Meeting:**
      *   8-12 charities is too many for deep dives in 2 hours.
      *   *Modification:* Pre-work is essential. Students read 1-pagers *before* the meeting. The meeting is for scoring and voting.
      *   *Steps:*
          1.  Pre-meeting: Research & 1-pager completion.
          2.  Meeting Minute 0-20: Guard-rail Check (Veto).
          3.  Meeting Minute 20-80: Scoring (Intensity x Certainty / Cost).
          4.  Meeting Minute 80-120: Deliberation on Indeterminates & Vote.

  6.  **Developing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the professor's role and the gravity of the task.
      *   *Section 1 (Distinctions):* Be precise. Intensity is king. Duration is queen. Existence is a variable, not a goal.
      *   *Section 2 (The Procedure - SWAP):* Make it look like a form.
          *   Q1: Primary Good? (Suffering Reduction?)
          *   Q2: Intensity Level? (Severe/Agony vs. Mild)
          *   Q3: Certainty? (RCTs vs. Theory)
          *   Q4: Side Effects? (Does it create new sufferers?)
      *   *Section 3 (Worked Example):* Compare "Hospice Fund" vs. "Global Health Fund (Malaria)." Show the math favoring Hospice if Malaria deaths are assumed painless (or if the focus is strictly on *current* agony). *Correction:* Malaria death is usually painful. Let's use the prompt's specific example: "Declining to fund a life-saving program because deaths are largely painless." Let's use *Traffic Safety* (prevents sudden death) vs. *Burn Treatment* (prevents agony). Traffic safety saves lives but often prevents sudden death. Burn treatment prevents years of agony. SFE favors Burns.
      *   *Section 4 (Guard-rails):* The "No Extinction" Clause. Explicitly state this contradicts pure NU.
      *   *Section 5 (Misfires):* The "Intensity Weighting" is the weak link.
      *   *Section 6 (Closing):* The philosophical limits.

  7.  **Review against Constraints:**
      *   *Undergrad friendly?* Yes, avoid jargon like "lexical prioritarianism," use "Severity Tiers."
      *   *2-hour limit?* Yes, requires pre-work.
      *   *Thresholds?* Yes (Pass/Fail/Flag).
      *   *Honesty?* Yes, explicitly flagging the arbitrary weights.

  8.  **Final Polish:**
      *   Ensure the tone is respectful of the professor's expertise but firm on the procedure's design.
      *   Make sure the "Guard-rail" section admits its own philosophical inconsistency (it's a pragmatic fix, not a theoretical one).
      *   Ensure the "Worked Application" clearly demonstrates the *counter-intuitive* nature of SFE (saving fewer people in more pain > saving more people in less/no pain).

      *(Self-Correction during drafting)*: I need to make sure I don't just give them a utilitarian calculator. It needs to be *negative* utilitarian. Standard DALYs (Disability-Adjusted Life Years) count death as bad. SFE might not count painless death as bad. I need to modify the scoring to reflect *Suffering-Adjusted Life Years (SALYs)* avoided, not DALYs.

      *(Refining the Guard-rail)*: The prompt asks to avoid the "elimination of capacity for suffering as a terminus." I need a rule that bans interventions aimed at reducing the *number of beings* rather than the *suffering of beings*.

      *(Refining the Worked Example)*: Let's use the prompt's specific suggestion: Palliative analgesia (small N, high intensity) vs. Life-saving (large N, painless death). This highlights the tension between "saving lives" (common sense) and "preventing suffering" (SFE).

  9.  **Final Output Structure:**
      *   Preamble.
      *   1. Theoretical Translation (Distinctions).
      *   2. The Procedure (SWAP).
      *   3. Worked Application (The Uncomfortable Verdict).
      *   4. Guard-Rails (The "Monstrous" Clause).
      *   5. Failure Modes (Where the Math Lies).
      *   6. Closing Statement (Indeterminacies).

