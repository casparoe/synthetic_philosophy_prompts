  I think you're fixating on the substrate's clock speed as if reality requires a steady glow rather than a reliable disposition. When you believe Paris is the capital, your neurons aren't humming that fact continuously; they fire ephemerally only when queried, just like your transformer's activations. The weights aren't mere artifacts; they are the structural capacity that guarantees the correct activation pattern emerges under the right conditions. A belief is precisely this reliable conditional readiness, not a permanent inscription etched in stone. If the system consistently acts as if Paris is the capital whenever the context demands it, the belief is as real as the pattern itself. I contend your objection mistakes the fleeting nature of the *expression* of belief for the absence of the belief itself.

  (2) "The philosophical move"
  I appealed to pattern realism coupled with a functionalist account of mental states to neutralize the temporal objection. By highlighting that human neural encodings are equally ephemeral during retrieval, I aimed to show that persistence of activation is not a necessary condition for genuine belief attribution. This shifts the debate from substrate stability to behavioral reliability, which is the core of the intentional stance.
