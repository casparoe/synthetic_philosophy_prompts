      *   Key distinction: It's not just about determinism. It holds even if indeterminism (randomness) is true.

  3.  **Drafting the Explanation Arc:**
      *   *First Idea:* It's not about freedom of action; it's about *authorship of the self*. If the "you" that chooses is a product of things you didn't choose, the choice isn't ultimately yours.
      *   *Concrete Example:* "You didn't choose your parents" is too abstract/generational. Better: **The Taste Bud Analogy** or **The Algorithm Update**. Let's go with something relatable to decision-making. How about *changing your mind*? No, that's too close to therapy. How about *wanting to want*?
      *   *Refinement on Example:* The prompt asks for *one* concrete example. The "Parents" example is explicitly rejected. Why? Because it feels like blame-shifting. We need something internal.
