          6.  **Tone:** Professional, helpful, academic (TA style).

  2.  **Analyze the Prompt & Pascal's Argument (Subject Matter Knowledge):**
      *   **Source:** Blaise Pascal, *Pensées* (specifically fragments around 89-94 in the Lafuma numbering, often "Justice and Force").
      *   **Key Argument:**
          *   Justice without force is powerless (ignored).
          *   Force without justice is tyrannical (accused).
          *   Therefore, we must put justice and force together.
          *   Since true justice is unknowable/contested (custom varies by latitude), we cannot establish justice on natural/first principles.
          *   Instead, we accept established laws/customs because they have force behind them.
          *   "Not carrying it back to first principles": If we question the origin of laws (which is often force/usurpation), we undermine their authority. We must obey established law *as if* it were just, even though its origin is arbitrary/forceful, to maintain order.
          *   **Crucial Nuance:** Pascal is *not* saying force *makes* justice true. He is saying force is necessary to make justice *effective*. He is a skeptic/fideist, not a pure positivist or Hobbesian contractarian in the standard sense. He thinks true justice belongs to God, but earthly justice is custom.
      *   **Prompt Requirements:**
          1.  Explain relationship between justice and force.
          2.  Explain why we shouldn't carry law back to first principles.
          3.  Word limit (200 words).

  3.  **Evaluate the Student Answer:**
      *   *Sentence 1:* "Pascal argues that the real foundation of law is force, not justice." -> Mostly accurate summary of the descriptive claim.
      *   *Sentence 2:* "He famously says that justice without force is powerless and force without justice is tyrannical, so the two have to be combined." -> Accurate quote/paraphrase.
      *   *Sentence 3:* "Because people can't agree on what true justice is — he notes that 'three degrees of latitude reverse all jurisprudence' — the thing that actually settles disputes is just who is strongest." -> Accurate reference to the latitude quote. Interpretation is okay.
      *   *Sentence 4:* "That's why the first law was set up not by consent but by force, as a kind of original usurpation." -> Accurate to Pascal's skepticism about origins.
      *   *Sentence 5:* "Pascal thinks this is a good thing, because if we tried to ground the law in first principles of justice we'd strip it of its authority and throw society into chaos." -> **Nuance Check:** Pascal doesn't necessarily say it's "good" morally, but rather necessary/pragmatic to avoid undermining authority. "Good thing" is slightly imprecise but acceptable for intro level.
      *   *Sentence 6:* "That's why he insists we must not 'carry it back to first principles': doing so would make the law's authority transparent and so collapse it." -> **Key Error:** It's not about making authority "transparent." It's about revealing the *lack* of legitimate foundation (usurpation). Transparency implies clarity; Pascal worries about revealing the *arbitrariness* or *violence* of the origin. However, the core idea (collapse of authority) is right.
      *   *Sentence 7:* "In this way Pascal is really a forerunner of Hobbes, for whom the sovereign's right comes purely from power." -> **Major Interpretive Error/Overstatement:** Comparing Pascal to Hobbes is a common student move, but philosophically shaky. Hobbes argues for a social contract/authorization to escape the state of nature. Pascal argues from skepticism and custom. Hobbes thinks the Sovereign *defines* justice. Pascal thinks earthly justice is custom, but true justice is divine/unknown. Equating them simplifies Pascal too much.
      *   *Word Count:* Looks under 200 words. (Let's count: ~165 words). Passes constraint.

