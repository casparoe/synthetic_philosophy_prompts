answer: |-
  You have spent your life with elements, my friend. You know how they behave. You know that isotopes do not care for our prayers; they decay according to their own laws. It is a comforting thought, isn't it? To imagine that justice works the same way. That time alone is a neutralizer.

  I will concede this to you: the *heat* of it. The immediate shame, the sting in the face when a foreign soldier looks at you—that intensity, yes, that may cool. The emotional radiation might fade until it is merely background noise. I grant you that human feeling is subject to time.

  But you speak of "blaming a nation." That is where I must stop you. You are using the language of morality for what is a matter of the state. Are you speaking of the burden on the conscience, or the liability of the citizen? Because I maintain this firmly: political guilt is collective. It belongs to all of us who were subjects of the Reich. That does not have a half-life. It remains as long as the political entity exists. We are liable for the deeds of our state, regardless of whether we feel the heat of it anymore.

  So tell me, when you say the radiation has faded: do you mean the inner sorrow is gone, or that the outer debt is paid? Which guilt are you holding in your hand?
