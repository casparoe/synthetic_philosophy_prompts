          *   *Distinguishing Case:* A proposal to honor a top lab publicly by name, with *no* financial tax/redistribution, but strictly prohibiting the naming of individual researchers within that lab.
          *   *Outcome:* If Approved -> Collective Anonymity is the driver. If Rejected -> Conditional Recognition (the tax) is the driver.

