      *   *Similar to Case 6 (Scores)?* Yes. Ranking (Top 5%). Case 6 rejected ranking students. This ranks labs. However, Case 6 was *anonymized* scores and still rejected. This proposal names the *labs* but anonymizes the *people*.

  5.  **Synthesize Principles:**
