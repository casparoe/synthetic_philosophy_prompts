      *   *Similar to Case 2 (Library)?* Yes. Public institution, collective attribution (lab level vs. individual), rejection of individual naming.
      *   *Similar to Case 3 (Farming)?* Yes. Conditional recognition. Case 3 required patent to commons; this requires money to shared fund. Both trade recognition for communal benefit.
