      *   **Elias:** Critical, structuralist, perhaps influenced by Galtung (structural violence) or contemporary critical theory. He values impact, lived experience, and systemic causality. He sees "discrete events" as myopic.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes. Mara presents the data (per-capita decline). Elias challenges the metric (absolute numbers + structural harm).
      *   **Middle 1 (Definition of Violence):** Mara argues for agent-caused bodily injury for coherence. Elias counters with "morphological violence" (structural deformations, climate).
