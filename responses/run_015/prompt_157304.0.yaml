      *   **Characters:** Mara (Defends the decline thesis, focuses on per-capita rates of intentional physical harm, discrete events) vs. Elias (Rejects the framing, focuses on absolute counts, introduces "morphological violence," structural/ecological harm, distributed systems).
      *   **Core Debate:** Is violence scalar (countable events) or field-like (distributed property)? Is the decline in violence real or an artifact of definition?
      *   **Constraints:** Both must be rigorous (no strawmen), direct engagement (respond to specific points), American English, no citations/bibliographies.
