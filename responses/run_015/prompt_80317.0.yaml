prompt: |-
  I'm a PhD student in in silico phylogenomics, so my daily vocabulary is mutation models, alignments, homology, and likelihood ratios. I keep having this argument with my superviser about whether the genetic code is really a "code" in the information-theoretic sense, and I'd like you to restate the strongest version of the "DNA is a code" position in the terms I actually work in -- codon tables as lookup tables, tRNAs as decoder hardware, the wobble position, the error-minimising property of the standard code where single-point mutations tend to land on similar amino acids -- as faithfully as you can. And then give me the residue report.

  A few things I think are already in trouble. In my world a code is a mapping between message symbols and signal symbols, and the code table is a seperate artefact from any particular message; in biology the "table" is smeared across many molecules -- the tRNAs, the synthetases that charge them, the release factors -- and the message and the decoder co-evolve in the same genome, which I can't even write down in my notation without cheating. Also the standard code is only error-minimising relative to other plausible random tables, not provably optimal, so the "engineered for robustness" story is weaker than it sounds.

  So: do the translation first, then tell me which claims map cleanly onto the error-correcting-code picture, which ones I had to distort to fit, and which have no expression in my vocabulary at all. And say something honest about the residue -- is it a defect in my information-theoretic framing, or is it a sign that "DNA is a code" is a less precise claim than people make it sound? Please write the whole thing in British English.
