      *   In historiography, it echoes the "primacy of domestic policies" (Primat der Innenpolitik) but shifts focus from *intent* to *incentive structures*.
      *   It resonates with Christopher Clark's *The Sleepwalkers* (everyone was constrained, no one wanted it, yet it happened).

  3.  **Brainstorming Defeaters:**

      *   *Historical:*
          *   July Crisis decisions were not automatic. There were off-ramps (e.g., Sazonov, Grey, Berchtold).
