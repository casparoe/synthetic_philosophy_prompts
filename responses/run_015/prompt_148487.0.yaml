          *   The "Blank Cheque" was a specific choice by Berlin, not an inevitable bureaucratic output.
          *   Russian mobilisation orders were discrete political acts, not just systemic drift.

      *   *Philosophical:*
          *   The "Problem of Many Hands" (Thompson). If everyone is responsible, no one is.
          *   Moral agency requires intent. Structures don't have minds; people do.
          *   Retributive justice requires identifiable perpetrators.

      *   *Formal/Modelling:*
          *   Game Theory: If the payoff matrix allows for cooperation (which it did in 1914 initially), why did defecting occur? Structure explains constraints, not specific moves.
          *   Rational Choice: Leaders made calculated risks, not just blind drift.

      *   *Falsifiability:*
          *   If every decision is attributed to "the system," can the theory ever be wrong?
          *   Does it ignore contingency? (e.g., the assassination of Franz Ferdinand was a specific event, not a structural necessity).

  4.  **Sorting and Refining Defeaters (Fatal vs. Awkward):**

      *   *Fatal:*
          *   **The "Off-Ramp" Evidence:** If specific individuals *rejected* peaceful options that the system allowed, structure isn't the sole cause. (e.g., Bethmann-Hollweg tearing up the "Halt in Belgrade" proposal).
          *   **Philosophical Agency:** If moral blame requires intent, structuralism dissolves blame entirely, making the term "culpability" meaningless.
          *   **The Fischer Counter:** Evidence of *deliberate* planning (War Council of 1912, September Programme) suggests intent existed alongside structure. Ignoring intent doesn't make it go away.

      *   *Awkward:*
          *   **Post-hoc Rationalisation:** It's easier to see structural drift after the fact than during the crisis.
          *   **Variation in Outcomes:** Other crises (1911, 1913) had similar structures but no war. Why 1914? Structure is constant; outcome varied. Therefore, structure isn't the sole variable.

  5.  **Addressing Falsifiability:**
      *   Yes, there is a risk of "structural determinism" becoming a tautology. "War happened because the system causes war."
      *   To be valid, it must predict *when* the system fails to cause war (which it struggles with).
      *   Insulation is a problem because it removes historical contingency.

