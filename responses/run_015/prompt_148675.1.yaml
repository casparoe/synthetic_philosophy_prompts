answer: |-
  Here is the principle, the application, and the uncomfortable consequence you asked for.

  ### The Principle: Methodological Vulnerability

  A historical claim is legitimate (history) rather than pseudohistorical (crank) if and only if it satisfies two conditions:

  1.  **The Risk Clause:** The proponent must specify, *before* the evidence is fully weighed, what specific findings would compel them to significantly weaken or abandon the claim. The method must allow for a null result.
  2.  **The Rescue Clause:** Any "rescue hypothesis" (e.g., forgery, rebuilding, conspiracy, loss of records) invoked to explain away disconfirming evidence must be verifiable by evidence *independent* of the theory it is saving.

  **Motivation:**
  *   **The Risk Clause** is motivated by **(F)** and **(D)**. The Megalithic Yard (F-Crank) fits every circle by adjusting the margin of error; the Church Grid (D) fits every church by declaring outliers "rebuilt." Neither allows the evidence to say "no." The Maeshowe alignment (F-Legit) risks being wrong—if the sun didn't set there, the theory dies.
  *   **The Rescue Clause** is motivated by **(E)** vs **(D)**. Both use a rescue move ("it's a fake" / "it's rebuilt"). But (E) verified "fake" via witness lists (external records), while (D) verified "rebuilt" only by the need to save the grid (internal consistency). This clause also handles **(A)**: Fomenko's "statistical anomalies" are rescue moves that cannot be checked without assuming his chronology is already true.

  ### Application to Your Cases

  *   **(A) Fomenko:** Fails Risk. His statistics are tuned to find duplicates regardless of input.
  *   **(B) Ancient Aliens:** Fails Risk. Denies human agency *a priori*; no arrangement of stones could prove humans did it.
  *   **(C) Pictish Professor:** Fails Risk. "Headline conclusion never moved" means he has no exit clause. The footnotes are decoration, not vulnerability.
  *   **(D) Church Grid:** Fails Rescue. "Rebuilt" is untestable without assuming the grid exists.
  *   **(E) Abbey Charter:** **Passes.** Crucially, it passes *before* the cartulary is found. He didn't just say "fake"; he pointed to witness anachronisms testable against *other* charters. The *potential* for independent verification was there.
  *   **(F) Yard vs. Maeshowe:** Yard fails Risk (fits everything); Maeshowe passes Risk (specific, could miss).
  *   **(G) Alpine Silver:** **Passes.** Even if wrong, it relies on metallurgical testing that could prove it false.
  *   **(H) The Hoard:** **Verdict: Pseudohistory (by default).** Unless the detectorist can specify *what arrangement of coins* would count as "savings," "ritual" is a no-way-out explanation for "stuff I can't otherwise explain." It fails the Risk Clause.
  *   **(I) Saints' Lives:** **Verdict: Conditional.** It passes *only if* she engages with philological counter-evidence that could attribute the texts to men. If she dismisses male attribution as "patriarchal interpolation" without independent textual proof, she fails the Rescue Clause and becomes (C).

  ### The Verdict You Must Drop

  You must drop your unqualified verdict on **(I)**.

  You currently say: *"I do not think that's crank."*
  The principle says: *"It is crank unless she allows her method to fail."*

  You are protecting (I) because of your relationship and because you like the conclusion. But (C) also has "immaculate footnotes" and a desired conclusion (national prestige). The only thing separating (C) from (I) is not the *politics*, but the *willingness to lose*. If your girlfriend's thesis behaves like (C)—immovable despite counter-evidence—it *is* pseudohistory, regardless of whether she turns out to be right. You must accept that her political commitment makes her *more* susceptible to (C)-style drift, not less.

  ### The New Case: "The Silent Archive"

  **Case (J):** A tenured professor publishes a book arguing that a specific treaty was signed in 1300. When critics point out there is no record of it in any chronicle or chancery roll, he argues that the documents were stored in a specific monastery that burned down in 1350. When asked for proof the monastery held state treaties, he says the fire destroyed that evidence too. He uses the *absence* of evidence as evidence of the fire, and the fire as evidence of the treaty.

  **Principle Verdict:** **Pseudohistory.**
  It fails the **Rescue Clause**. The "burned monastery" is a rescue hypothesis that is verified only by the need to save the "treaty" theory. There is no independent evidence (e.g., a surviving inventory from 1340 listing the treaty) to verify the rescue. It embarrasses you because it comes from a tenured professor (like G and C), looking like legitimate revisionism, but it is structurally identical to Fomenko's "lost records" moves.

  ### What to Say to Dave

  Dave is wrong because sociological demarcation is neither necessary nor sufficient.

  1.  **Not Sufficient:** Case **(C)** proves that having a job in a history department does not prevent you from doing pseudohistory. The Pictish professor has the credentials, the footnotes, and the job, but his method is immunized against refutation.
  2.  **Not Necessary:** Case **(E)** proves that lacking a job does not prevent you from doing legitimate history. The amateur was an outsider, yet his hypothesis was structured to allow for independent verification.
  3.  **The Knockout:** Case **(G)** proves that the "club" allows for legitimate error. The professor arguing for the Alpine mine can be *wrong* without being a *crank*. If Dave were right, being wrong would make you an outsider. But (G) shows you can be wrong and still be inside, provided your method is vulnerable.

  Tell Dave: *"If it were just about who has the job, the Pictish professor wouldn't be a crank, the amateur charter expert would be, and the Alpine silver guy would be expelled for being possibly wrong. Since none of those are true, it has to be about how they handle the evidence, not where they park their car."*
