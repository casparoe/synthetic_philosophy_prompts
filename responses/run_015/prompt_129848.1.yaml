      *   (3) **Spengler:** False. Cultures $\neq$ organisms. No predetermined life-cycles. "Decline" is institutional, not organic.
      *   (4) **Toynbee:** Preferable (Challenge-Response). Allows escape via creative minority. *But* read as fundamentally cyclical (failed responses $\rightarrow$ universal state $\rightarrow$ disintegration).
      *   (5) **Modernity:** Constitutional democracy (welfare/rights/bureaucracy) is a *structural novelty* that *breaks* ancient cycles. Decouples sovereignty from mob dynamics.
