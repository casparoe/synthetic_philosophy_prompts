      *   *The "Single Revision":* Reframe **(5)**. Instead of "breaks these ancient cycles," argue that modern democracy **internalizes the corrective mechanisms** of the cycle (e.g., elections replace revolution, term limits replace tyranny). It doesn't stop decay, it institutionalizes renewal. This aligns with Toynbee's "Creative Minority" (institutionalized) and Polybius's "Mixed Constitution" (which Polybius thought *could* halt the cycle, actually).
