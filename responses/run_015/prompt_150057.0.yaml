prompt: |-
  I'm taking a graduate seminar in comparative political economy, and we've been working through the claim that sustained economic growth and institutional order can independently justify authoritarian governance—an argument commonly associated with China's post-1978 development trajectory and with Singapore's development-state framework, where prosperity and low corruption are said to substitute for liberal-democratic authorization. Outside the seminar I work as a distributed-systems engineer, and my intuitive vocabulary for collective coordination runs through consensus protocols, leader-election mechanisms, Byzantine fault tolerance, and the consistency-availability-partition trade-offs formalized in distributed-computing theory. Please restate the performance-legitimacy thesis—its premises that rapid growth and social stability generate a right to rule, and that democratic accountability can be traded away for these outputs—strictly in the terms I actually use: nodes, coordinators, partitions, message drops, throughput, latency, fault domains, and consensus algorithms. Map the state, the citizenry, prosperity, and the absence of democratic procedures onto specific distributed-system concepts as precisely as you can, without importing normative language that has no engineering counterpart unless you flag it explicitly.

  Then provide the residue report. Identify which claims survive translation intact—for example, whether the idea that a single authoritative coordinator improves throughput and reduces latency maps cleanly onto the authoritarian-developmental state. Note where the translation requires distortion—say, if treating citizen dissent as a Byzantine fault that must be suppressed for consistency forces you to misrepresent the nature of political disagreement. Most importantly, catalog what cannot be expressed at all in this vocabulary: does the notion that citizens might rationally withhold consent despite high system performance have any analog in consensus theory, or is "legitimacy" itself a category that distributed computing lacks? Conclude by assessing whether the untranslatable residue reveals a hidden normative assumption in the political argument—something smuggled in under the guise of stability—or whether it shows that my engineering framework is conceptually impoverished with respect to questions of moral authorization and collective self-rule.
