  # FINAL EXAMINATION: EPISTEMOLOGY SEMINAR (MA LEVEL)
  **Time Allowed:** 90 Minutes  
  **Word Count:** 1000–1200 words  
  **Instructions:** Answer the following question. You are not permitted to consult external materials. All necessary definitions are contained within the prompt.

  ***

  ### Question 1

  In contemporary epistemology, higher-order evidence (HOE) is often categorised by its target. For the purposes of this examination, you must employ the following distinction:

  *   **Process-level defeat:** HOE indicating that the reasoning mechanism or method used to form a belief is unreliable in the current context.
  *   **Outcome-level defeat:** HOE indicating that a particular belief is likely false, without necessarily implying that the mechanism which produced it was flawed (e.g., evidence that the outcome is incorrect despite a generally reliable process).

  **The Scenario:**  
  Dr. Aris, a historian, has carefully evaluated primary archives and formed the belief that Event E occurred in 1847. She then learns, from a declassified institutional review, that the archive-curation protocol she relied upon contained an undetected selection bias that systematically omitted counter-evidence for events of type E, though she has no way to know whether her specific case was affected. Separately, she learns that a rival historian, using a different method, has reached the opposite conclusion.

  **The Task:**  
  Write an essay addressing the following three points:

  (a) Assess whether Dr. Aris's continued full belief in E is rationally permissible, epistemically irrational, or genuinely akratic (holding a belief while believing one ought not hold it) in light of the defined defeats.  
  (b) Analyse whether process-level and outcome-level defeat differ in normative force. If one undermines rationality more severely than the other, explain why this is the case using the scenario above.  
  (c) Evaluate whether Aris can avoid akrasia by adopting a qualified doxastic attitude (for instance, assigning a credence of 0.6 rather than full belief) without suspending judgement altogether. Does this move resolve the normative conflict generated by the higher-order evidence?

  ***

  # MODEL ANSWER

  Dr. Aris's epistemic predicament illustrates the tension between first-order evidence (the archives) and higher-order evidence (the review and the rival's conclusion). To assess her rationality, we must apply the distinction between process-level and outcome-level defeat rigorously.

  Regarding (a), Aris's continued full belief is epistemically irrational and arguably akratic. The archival bias constitutes process-level defeat. It attacks the link between her evidence and the truth. Even if her reasoning from the available documents was flawless, the input itself is compromised by a mechanism known to omit counter-evidence. Rationality requires responsiveness to the reliability of one's cognitive situation. By maintaining full belief despite knowing her method is systematically biased in this domain, she ignores a defeater that severs the justification for her belief. The rival's conclusion adds outcome-level defeat, suggesting the proposition is false, but the archival bias is more damaging because it undermines the very basis of her confidence. To believe *p* while possessing evidence that one's method for believing *p* is unreliable is to fail to integrate higher-order evidence, rendering the stance akratic.

  Regarding (b), process-level defeat possesses greater normative force than outcome-level defeat in this context. Outcome-level defeat, such as peer disagreement, suggests that one might be wrong, but it leaves open the possibility that one's method was reliable and simply led to a false conclusion in this instance (bad luck). It invites conciliation but does not necessarily invalidate the procedure. Process-level defeat, however, implicates the reliability of the mechanism itself. In Aris's case, knowing the archive curation omitted counter-evidence means the total evidence available to her was structurally incomplete. This defeats the justification globally for beliefs formed via that protocol. While outcome-level defeat suggests a need to lower confidence, process-level defeat suggests the foundation is rotten. Therefore, the archival bias demands a more significant revision of doxastic attitude than the rival's disagreement alone. The former attacks the warrant; the latter attacks the truth of the proposition directly but leaves the warrant intact.

  Regarding (c), adopting a qualified doxastic attitude, such as a credence of 0.6, may avoid logical akrasia but does not necessarily resolve the normative irrationality. Akrasia is often formulated as believing *p* while believing one's belief in *p* is irrational. If Aris shifts to a credence, she no longer holds a full belief, potentially dissolving the logical contradiction. However, if the process-level defeat is severe enough to suggest the mechanism is unreliable, even a moderate credence might be unjustified. If the bias systematically omits counter-evidence, the probability of *p* given the evidence is indeterminate, not merely reduced. Assigning a specific credence implies a calculable risk, whereas process-level defeat often implies incalculable uncertainty. Thus, while moving to credence avoids the specific charge of believing against one's better judgement regarding *belief*, it may still constitute an irrational response to the severity of the process defeat. Suspension of judgement remains the only fully coherent response to severe process-level defeat.

  In conclusion, Aris's situation demonstrates that process-level defeat is normatively superior to outcome-level defeat because it undermines the justificatory structure rather than merely the conclusion. While shifting to credence mitigates akrasia, it does not guarantee rationality if the underlying mechanism is deemed unreliable.

  ***

  # MARKING SCHEME

  **Total Marks:** 20  
  **Pass Mark:** 10

  | Analytical Move | Marks | Typical Misconception (Deduction Trigger) |
  | :--- | :---: | :--- |
  | **1. Classification of Defeats:** Correctly identifies the archival bias as process-level defeat (mechanism unreliable) and the rival's conclusion as outcome-level defeat (proposition likely false). | 4 | Treating both forms of evidence as identical types of disagreement or failing to map the scenario facts to the provided definitions. |
  | **2. Verdict on Rationality:** Argues that continued full belief is irrational/akratic because maintaining belief despite known mechanism bias violates the integration of higher-order evidence. | 4 | Claiming belief is permissible because the first-order evidence (archives) remains unchanged, ignoring the higher-order defeater. |
  | **3. Normative Force Comparison:** Explains why process-level defeat is normatively stronger (undermines warrant/justification) compared to outcome-level defeat (undermines truth likelihood but leaves method intact). | 4 | Asserting both defeats are equal in force, or arguing outcome-level is stronger because it directly targets the truth of *p*. |
  | **4. Evaluation of Credence:** Analyses whether shifting to credence solves akrasia, noting that while it may avoid logical contradiction, it may not satisfy normative requirements if the process is unreliable. | 4 | Asserting that adopting a credence automatically solves the problem without addressing whether the credence itself is justified by the defeat. |
  | **5. Conceptual Coherence:** Maintains the provided distinction throughout without slipping into external literature summaries; arguments follow logically from the defined terms. | 4 | Reciting standard positions (e.g., "As Christensen argues...") rather than analysing the scenario using the prompt's specific conceptual framework. |
