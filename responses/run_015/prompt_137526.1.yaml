answer: |-
  Here is a plan designed for your constraints, audience, and specific insticts.

  ### 1. The Dependency Structure

  **The Order:**
  1.  **The Reversal (Visual):** Show the aggregate and the subgroups simultaneously. Let the contradiction land.
  2.  **The Arithmetic (Verification):** Prove it isn't a calculation error.
  3.  **The Mechanism (Weights):** Show that unequal group sizes drive the math.
  4.  **The Context (The Toggle):** Introduce the narrative detail that decides which number is "true."
  5.  **The Judgment (Entitlement):** Decide which partition to report.

  **Why this order:**
  If you start with the arithmetic (weighted averages), you lose the hostile numeracy group immediately; it feels like a lecture. If you start with the context, it feels like a policy debate, not a data skill. You need the **cognitive dissonance** of the reversal first to create a "need to know."

  **The Critical Pivot:**
  The arithmetic must come *before* the interpretive problem, but *after* the reveal.
  *   **If you move Interpretation earlier:** The skeptic in the room will dismiss the whole session as "subjective spinning" before you've proven the math is real.
  *   **If you move Arithmetic later:** The hostile group will assume you are showing them a visual trick or a lie.
  *   **The Collapse Point:** If you do not establish the **Mechanism (Weights)** before the **Context (Toggle)**, the room will believe the reversal is a mathematical artefact (a "glitch") rather than a structural feature of the population. They must understand *how* the numbers move before they can decide *where* they should move.

  ### 2. The Case

  **The Example:** **A Drug Safety Comparison (Heart Attack Rates).**
  Avoid Berkeley (admissions) and Kidney Stones (medical niche). Use a drug safety scenario because every reporter understands "safe vs. unsafe," and it allows for the causal toggle you need.

  **The Table (Handout & Screen):**
  *   **Outcome:** Heart Attack within 1 year.
  *   **Comparison:** NewDrug vs. OldDrug.
  *   **Subgroup:** High Blood Pressure (HBP) vs. Normal BP.

  | Group | NewDrug (Rate) | OldDrug (Rate) |
  | :--- | :--- | :--- |
  | **High BP** | 10% (10/100) | 15% (90/600) |
  | **Normal BP** | 20% (80/400) | 25% (10/40) |
  | **Overall** | **18% (90/500)** | **16% (100/640)** |

  *Note: NewDrug is safer in both subgroups (10<15, 20<25). OldDrug is safer overall (16<18).*

  **What it must contain:**
  *   Clear denominators (show the Ns). The reversal relies on the fact that NewDrug was given mostly to Normal BP patients (easier to treat), while OldDrug was given mostly to High BP patients (harder to treat).
  *   Actionable stakes: "Which drug should the hospital stock?"

  **The Toggle (Mid-Session):**
  You keep the table identical. You change the **origin of the High Blood Pressure**.
  *   **Scenario A (Confounder):** High BP is a pre-existing condition patients had *before* taking the drug.
      *   *Conclusion:* We must adjust for health status to judge the drug. **NewDrug is safer.**
  *   **Scenario B (Mediator):** High Blood Pressure is a *side effect* caused by OldDrug (which then leads to heart attacks).
      *   *Conclusion:* The aggregate captures the total harm of the drug. **OldDrug is safer** (because it causes less HBP).

  **On Constructing the Reversal:**
  **Do not make them build it from scratch.** In 75 minutes with mixed numeracy, this is a trap. They will get stuck on the arithmetic and miss the causal point.
  **Instead:** Give them a handout with two blank tables.
  *   **Task 1:** "Fill this table so NewDrug wins in both rows, but OldDrug wins overall. You must use equal group sizes (100 per cell)."
  *   **Result:** They will fail. It is mathematically impossible to generate Simpson's Paradox with equal weights in a 2x2 if the subgroup direction is consistent.
  *   **Task 2:** "Now fill it allowing unequal group sizes."
  *   **Result:** They succeed immediately.
  *   **Why:** This proves in 5 minutes that the paradox is driven by **population structure**, not calculation error. It validates the skeptic and demystifies the math for the hostile group.

  ### 3. The Misconceptions

  | Misconception | When to Defuse | Damage if Wrong Timing |
  | :--- | :--- | :--- |
  | **"The aggregate is a lie / The subgroups are the truth."** | **During the Toggle.** | If addressed too early, they think it's just "noise." If addressed too late, they leave thinking there is a single "correct" number. |
  | **"This is a small-sample artefact."** | **During the Mechanism.** | Show large Ns (like the table above). If you don't, the hostile group will dismiss it as "statistical noise." |
  | **"If subgroups agree, that's the answer."** | **During the Toggle (Scenario B).** | This is the hardest one. You must show that even if subgroups are unanimous, they can be wrong if you are adjusting for a side effect (collider/mediator). |
  | **"Print both and let the reader decide."** | **In the Lede Exercise.** | This is the "false balance" trap. If you don't kill this at the end, they will default to lazy journalism. |
  | **"More data fixes this."** | **During the Mechanism.** | Clarify that more data just makes the wrong conclusion *more precisely* wrong. |
  | **"This is the Ecological Fallacy."** | **Before the Session (Handout footnote).** | Don't spend time distinguishing them in class. It confuses the hostile group. Just note they are cousins. |

  **One you haven't listed:** **"Controlling for everything is always better."**
  *   **Defuse:** During the Toggle (Scenario B).
  *   **Point:** Over-adjusting (controlling for a side effect) hides the true cost of the treatment.

  ### 4. The Three Uncertainties

  1.  **Pre- vs. Post-Exposure Grouping:**
      *   **Verdict:** **Include.** This is the core of the session. Without it, Simpson's Paradox is just a math trick. With it, it is a causal tool.
      *   **How:** Use the Drug/HBP toggle described above. It is the only way to justify flipping the conclusion without changing the numbers.
      *   **Risk:** It requires causal thinking, which the hostile group dislikes. Mitigate by using plain English: "Did they have this before they took the pill, or did the pill give it to them?"

  2.  **Infinite Subdivision (The "License to Reverse" risk):**
      *   **Verdict:** **Exclude.**
      *   **Reasoning:** Telling journalists "you can reverse any result by slicing deeper" hands a weapon to bad-faith actors. It induces paralysis.
      *   **Replacement:** Teach the rule of thumb: "Stratify until the groups are causally comparable, then stop." Give them permission to stop slicing.

  3.  **Choice of Summary Metric (Risk Ratio vs. Risk Difference):**
      *   **Verdict:** **Exclude.**
      *   **Reasoning:** It is too technical for 75 minutes. A reversal in ratios can disappear in differences (and vice versa), but explaining this requires log-linear models.
      *   **Action:** Explicitly state on the handout: "We are using percentages today. Know that changing the metric can also change the story, but that's a session for another day." This builds trust through transparency.

  ### 5. Testing Your Framing

  **Your Framing:** *"This is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it."*

  **Critique:**
  *   **Strength:** It correctly identifies that the solution is external to the dataset.
  *   **Weakness:** The word **"Entitled"** is dangerous for journalists. It sounds like a permissions game ("Who gave me the right?"). It invites the hostile group to say, "I'm not a statistician, I'm not entitled to decide anything."
  *   **Repair:** Change "Entitled" to **"Justified by the question."**
  *   **Revised Framing:** *"The numbers are real. The paradox is a conflict between two different questions. Your job is to identify which question the story is actually asking."*
  *   **Why:** It shifts the burden from *authority* (entitlement) to *clarity* (journalistic intent).

  ### 6. Outcome and Assessment

  **The Exercise:**
  Hand them a press release paragraph: *"A new study shows Hospital A has a lower overall mortality rate than Hospital B. However, when looking at patients in critical condition and stable condition separately, Hospital B has lower mortality in both categories. Hospital A treated mostly stable patients; Hospital B treated mostly critical patients."*

  **Task:** Write a one-sentence lede.

  **The Correct Lede:**
  Must specify the **population** and the **comparison basis**.
  *   *Example:* "Hospital B shows better survival rates for patients in similar conditions, though Hospital A's overall numbers are boosted by treating less critical cases."
  *   *Why:* It acknowledges the reversal and explains the mechanism (case mix) without declaring a "winner" without context.

  **The Tempting Wrong Lede:**
  *   *Example:* "Data conflicts on hospital safety: Overall numbers favor A, but subgroup analysis favors B."
  *   *Diagnosis:* This indicates they fell for the "Print Both" misconception. They haven't learned to judge the partition.
  *   *Example:* "Hospital B is safer than Hospital A."
  *   *Diagnosis:* They ignored the aggregate entirely. They assume subgroups are always the truth (The "Confounder" bias).

  **The Card (3-4 Questions for any study):**
  1.  **What is the outcome?** (Death, clicks, votes?)
  2.  **What are the groups being compared?** (Men/Women, Rich/Poor?)
  3.  **Did the group membership exist *before* the treatment/exposure?** (If no, do not adjust.)
  4.  **What decision does this number inform?** (Individual choice? Policy allocation?)

  ### 7. Risk Analysis & Sequencing

  **Most Likely Failure Point:**
  **The Toggle (Pre/Post Exposure).**
  The hostile numeracy group will struggle to accept that the *story* changes the *math's meaning*. They view numbers as objective truth. If you spend too long on the causal theory, they will tune out.
  *   **Mitigation:** Keep the causal explanation binary. "Before or After?" Do not introduce DAGs or technical terminology. Use the "Side Effect" vs. "Risk Factor" language.

  **What to Cut if Short on Time:**
  **Cut the "Construct the Reversal" exercise.**
  *   **Reasoning:** It is pedagogical, not operational. Reporters need to know how to *read* the paradox, not how to *build* it.
  *   **Replacement:** Simply show the "Equal Weights" slide and say "It's impossible here," then show the "Unequal Weights" slide. Save 15 minutes for the Lede exercise, which is the actual skill they need.

  **Where Reasoning is Weakest (Exposed):**
  **The "Infinite Subdivision" Exclusion.**
  *   **Reasoning:** I am advising you to hide a truth (that you can always find a partition to reverse a result) to prevent misuse. This is paternalistic.
  *   **Counter-argument:** A sophisticated skeptic (your "one who knows more") will call this out.
  *   **Defense:** Acknowledge it openly. "Yes, you can slice until you find a reversal. That is why you need a causal reason to stop slicing, not just a mathematical one." If you frame it as "Stop when the groups are comparable," you satisfy the expert without paralyzing the novices.

  **Final Sequencing Note:**
  If the room feels particularly hostile to the math in the first 10 minutes, **swap the Mechanism and the Toggle.** Show them the Drug table. Ask "Which is safer?" Let them argue. Then reveal the "Side Effect" toggle. *Then* show the weights.
  *   **Why:** It grounds the math in the story. Sometimes journalists need to care about the *consequence* before they care about the *calculation*. But stick to the original plan if the room is generally compliant; the original plan is more logically robust.
