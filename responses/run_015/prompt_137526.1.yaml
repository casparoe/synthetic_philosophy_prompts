prompt: |-
  I write about science and statistics for a newspaper and for a radio programme, and I've been asked to give my newsroom's quarterly skills session: 75 minutes, about fourteen reporters and section editors, one screen and a handout I can print. The room's numeracy is mixed — two or three will be quietly hostile to numbers, one will know more than I do and will say so. The topic is Simpson's paradox.

  I can state the paradox, and I've written about the two standard illustrations before (a university admissions comparison and a comparison of two kidney-stone treatments). What I want from you is not the explanation but a plan for the session, and I'd rather have my own instincts tested than confirmed.

  First, the dependency structure. Tell me the order the pieces have to arrive in and why: what has to be in place before the reversal even registers as surprising, and which step collapses if I move it later. In particular, I want to know whether the arithmetic should come before or after the interpretive problem. My instinct is to have them see the reversal first and only then discover that the arithmetic is silent about what it means; but I can imagine the opposite case, that without the mechanism they'll walk away thinking they've been shown a trick.

  Second, the case that carries the session. I don't want the two chestnuts above — the room has heard both, and hearing them again will confirm that this is a curiosity about other people's data. Give me one example to build the hour on and say what it has to contain and what it must avoid. Two constraints of my own: the numbers should be numbers a reader would actually act on, and there should be a detail I can change mid-session while leaving every cell of the table identical, such that the right conclusion flips. I'd also like your view on whether they should construct the reversal themselves — I have a half-formed plan in which they try and fail to build a reversal out of equal-sized groups, and thereby discover for themselves that unequal group sizes are doing all the work. If that's workable in the time, tell me how to set it up; if it's a trap, tell me why and what to do instead.

  Third, the misconceptions, and the point in the sequence where each should be headed off. The ones I expect: that the aggregate is a lie and the disaggregated numbers are the truth; that this is a small-sample or rounding artefact that more data would dissolve; that it is the same thing as the ecological fallacy or as ordinary confounding; that if the subgroup verdicts are unanimous one should plainly act on them; and — the journalist's temptation — that when the two summaries disagree the honest thing is to print both and let the reader decide. Add the ones I haven't listed. For each, say whether the defusing belongs before the case, during the reveal, or in the last ten minutes, and what damage is done by defusing it at the wrong moment.

  Fourth, three things I'm unsure whether to include at all, and I'd like a verdict on each. Whether to raise the distinction between a grouping variable measured before the exposure and one produced by it: this is, I think, the deepest point available, and the one most likely to lose the hostile third of the room. Whether to tell them that you can keep subdividing and get a reversal back at a finer grain — I've heard this claimed as if it were always possible, I don't know whether it is, and I worry that telling a newsroom that any comparison can be reversed by partitioning it differently hands them a licence rather than a skill, since they will meet this move used in bad faith by people with an interest in the result. And whether the choice of summary matters — whether a reversal can appear for one way of stating the comparison and not for another — or whether that is a subtlety to leave out and openly say I'm leaving out.

  My own one-sentence framing, which I want you to test against the session as you design it and repair or replace: that this is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it. Tell me where that framing misleads a working reporter.

  Finally, what they should be able to do at the end, and how I'll know. I want a check that doesn't test recall — I was going to hand them a paragraph of press-release prose containing a comparison and ask each of them to write a one-sentence lede, on the grounds that the lede forces the choice of summary into the open. Tell me what a correct lede has to contain, what the most tempting wrong lede will look like, and what a wrong lede tells me about which step failed. And give me the three or four questions I should put on a card for reading any study that reports a comparison.

  Close by telling me which part of this plan is most likely to fail with this particular audience, which step you'd cut first if the session runs short, and what would lead you to sequence it differently — I'd rather have your reasoning exposed at the point where it's weakest than have it presented as settled. Don't send me to papers or reading lists; I have no access to journals from here and my colleagues won't read them.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **User:** Science/statistics journalist, presenting to a newsroom (14 reporters/editors, mixed numeracy, some hostile, one expert/skeptic).
      *   **Task:** 75-minute skills session on Simpson's Paradox.
      *   **Constraints:** One screen, printed handout. No academic papers/reading lists.
      *   **Specific Requests:**
          1.  **Dependency Structure:** Order of operations (Arithmetic vs. Interpretation).
          2.  **The Case:** A fresh example (not Berkeley/Kidney Stones), actionable numbers, a toggleable detail that flips the conclusion without changing table cells, and advice on having them construct the reversal (equal vs. unequal groups).
          3.  **Misconceptions:** List expected + unexpected, timing for defusing them, consequences of wrong timing.
          4.  **Three Uncertainties:** Pre/post exposure grouping, infinite subdivision risk, summary metric choice.
          5.  **Framing Test:** "Not a puzzle about numbers but a question about which partition you are entitled to hold fixed."
          6.  **Outcome/Assessment:** Lede writing exercise (correct vs. wrong lede analysis) + 3-4 questions for reading studies.
          7.  **Risk Analysis:** Most likely failure point, what to cut if short on time, reasoning exposure.

  2.  **Deconstruct the Session Plan (Mental Draft):**

      *   *Goal:* Move from "Math Trick" to "Causal/Contextual Judgment."
      *   *Time:* 75 mins.
      *   *Audience:* Busy journalists, skeptical of math, need practical utility.

  3.  **Address Request 1: Dependency Structure:**

      *   *Instinct:* User wants to show reversal first, then explain arithmetic silence.
      *   *Analysis:* If you show the reversal first without context, it looks like magic or a lie. If you show arithmetic first, it's boring math.
      *   *Decision:* The *surprise* must come first to create the "need to know," but the *mechanism* (weighted averages) must follow immediately to dispel the "trick" accusation. However, the *interpretive problem* (causality) must come *after* the mechanism. If you jump to interpretation too soon, the hostile numeracy group will dismiss it as "opinion."
      *   *Sequence:* Reveal Reversal -> Verify Arithmetic (it's real) -> Identify Mechanism (weights) -> Introduce Context (the toggle) -> Decide Interpretation.
      *   *Why:* You need the cognitive dissonance (Reversal) to engage them. You need the Arithmetic verification to satisfy the skeptic. You need the Context to solve the paradox.

  4.  **Address Request 2: The Case:**

      *   *Constraint:* Not Berkeley/Kidney. Actionable numbers. Toggleable detail (same table, different conclusion).
      *   *Idea:* A/B Testing in Tech or Marketing is common, but maybe too dry. Medical is good but Kidney Stones is taken. How about **Sentencing/Policing** or **School Performance**?
      *   *Selection:* **School Performance / Budget Cuts.** It's relatable to local reporters.
      *   *Scenario:* Two schools, pass rates. Overall, School A looks better. Disaggregated by socioeconomic status (SES), School B looks better in *both* groups.
      *   *The Toggle:* The variable is "SES."
          *   *Scenario 1 (Adjust):* We want to know school quality. SES is a confounder (pre-existing). We *must* adjust. School B is better.
          *   *Scenario 2 (Resource Allocation):* We want to know where to send extra funding to boost *overall* national pass rates. The aggregate matters because the population distribution is the reality. School A is serving the harder demographic better *in aggregate impact*? No, that's tricky.
          *   *Better Toggle:* **Job Hiring vs. Promotion.**
          *   *Let's try a Police Stop Example (Search Rates).*
          *   *Table:* Precinct 1 vs. Precinct 2. Contraband find rate.
          *   *Subgroups:* Day vs. Night.
          *   *Toggle:* Are we evaluating *officer bias* (need subgroups) or *public safety risk* (need aggregate)?
          *   *Actually, the "Equal vs. Unequal Groups" construction idea is strong.* Let's refine the example to support that.
          *   *Proposed Example:* **Two Baseball Players (Batting Averages)** is the classic, but maybe too sporty.
          *   *Proposed Example:* **Two Drugs (Survival Rates)** is Kidney Stones adjacent.
          *   *Proposed Example:* **Two Websites (Click-through Rates).**
          *   *Let's go with **Two Hospitals (Survival Rates)** but distinct from Kidney Stones.* Let's make it **Trauma Centers vs. Local Hospitals**.
          *   *Wait, the user wants a detail they can change mid-session.*
          *   *Idea:* **The "Intention to Treat" vs. "Per Protocol" switch?** No, that's different.
          *   *Idea:* **The Causal Direction.**
          *   *Selected Case:* **A/B Testing a Website Button Color.**
          *   *Table:* Red vs. Blue button.
          *   *Subgroup:* Mobile vs. Desktop.
          *   *Reversal:* Red wins on Mobile, Red wins on Desktop. Blue wins Overall.
          *   *Mechanism:* Most traffic is Mobile (where Red wins but margins are small? No, need weights).
          *   *The Toggle:* **When did the split happen?**
              *   *Context A:* Users are randomly assigned device (impossible).
              *   *Context B:* Users choose device.
              *   *Better Toggle:* **Is the goal Maximizing Revenue or Diagnosing Bug?**
              *   *If goal is Revenue:* Aggregate matters (that's the money).
              *   *If goal is UX improvement:* Subgroup matters (Blue is better code, but Mobile users are harder to convert).
              *   *Actually, the prompt asks for a detail change that flips the conclusion with identical cells.* This implies changing the *story* around the numbers.
              *   *Let's use the **Police Shooting** example (simplified).*
              *   *Table:* City A vs. City B. Fatal encounter rate.
              *   *Subgroup:* Armed vs. Unarmed.
              *   *Reversal:* City A lower rate for Armed, lower for Unarmed. City A higher overall.
              *   *Toggle:* **Is "Armed" a pre-existing condition or a result of police escalation?**
              *   *If Armed is pre-existing (criminal intent):* Adjust (Subgroup).
              *   *If Armed is result of police action (escalation):* Aggregate (Overall risk of calling police).
              *   *This hits the "Pre/Post exposure" uncertainty.*
      *   *Construction Exercise:* Can they build it with equal groups?
          *   *Math:* If $N_1 = N_2$ for subgroups, Simpson's cannot happen (assuming same direction subgroups).
          *   *Proof:* $(a+b)/2 > (c+d)/2$ and $a>c, b>d$.
          *   *Verdict:* Yes, make them try. It proves the "weights" are the engine.

  5.  **Address Request 3: Misconceptions:**

      *   *List:* Aggregate is lie (No, it's real data); Small sample (No); Ecological fallacy (Related but distinct); Unanimous subgroups = Truth (No, see causal structure); Print both (Lazy journalism).
      *   *New one:* "Controlling for everything is always better." (Over-adjustment bias).
      *   *Timing:*
          *   "Aggregate is a lie" -> During Reveal (validate the math).
          *   "Small sample" -> During Mechanism (show large N).
          *   "Print both" -> End (Lede exercise).
          *   "Unanimous subgroups" -> During Toggle (Causal structure).

  6.  **Address Request 4: Three Uncertainties:**

      *   *Pre/Post Exposure:* **Include.** It's the crux of the "which partition" framing. Without it, it's just math.
      *   *Infinite Subdivision:* **Exclude/Qualify.** It's technically true (you can always find a collider), but practically dangerous for journalists. It invites paralysis. Frame it as "Don't stratify until empty, stratify until causal."
      *   *Summary Metric:* **Exclude.** Too technical (Risk Ratio vs. Risk Difference). Stick to rates/proportions for 75 mins.

  7.  **Address Request 5: Framing Test:**

      *   *Framing:* "Not a puzzle about numbers but a question about which partition you are entitled to hold fixed."
      *   *Critique:* It's accurate but abstract. "Entitled" is the key word. It implies authority/rules.
      *   *Risk:* Reporters might think "I'm not a scientist, I can't decide entitlement."
      *   *Fix:* Change "Entitled" to "Justified by the story you are telling."

  8.  **Address Request 6: Outcome/Assessment:**

      *   *Exercise:* Write a lede.
      *   *Correct Lede:* Must specify the population and the comparison basis (e.g., "Among X, Y increased..." OR "Overall Y increased, driven by...").
      *   *Wrong Lede:* "Study shows X causes Y" (ignores paradox) or "Data is conflicting" (false balance).
      *   *Card Questions:* 1. What is the outcome? 2. What are the groups? 3. Did the group assignment happen before or after the treatment? 4. What decision does this number inform?

  9.  **Address Request 7: Risk Analysis:**

      *   *Failure Point:* The Causal Toggle. If they don't buy the story change, the math remains a trick.
      *   *Cut:* The "Construct the Reversal" exercise if time runs tight. It's pedagogical but not essential for the "what to write" goal.
      *   *Sequencing Change:* If the room is very hostile to math, move the "Construct" exercise to *after* the story toggle to show *why* the weights matter contextually, not just mathematically.

  10. **Refining the Example (Crucial Step):**
      *   I need an example where the *table stays the same* but the *conclusion flips* based on a narrative detail.
      *   *Example:* **Two Charities.**
      *   *Table:* Charity A vs. Charity B. Success rate (people lifted out of poverty).
      *   *Subgroups:* Urban vs. Rural.
      *   *Data:* Charity A better in Urban, better in Rural. Charity B better Overall.
      *   *Reason:* Charity B works mostly in Urban (easier to lift out). Charity A works mostly in Rural (harder).
      *   *Toggle 1 (Efficiency Audit):* "Which charity uses donations better per person?" -> Look at Subgroups (Control for difficulty). Charity A wins.
      *   *Toggle 2 (Impact Audit):* "Which charity lifted more people total?" -> Look at Aggregate. Charity B wins.
      *   *This works.* Same numbers. Different question. Different "right" answer.
      *   *Wait, is this Simpson's?* Yes. Aggregate contradicts subgroups.
      *   *Does it fit the "Pre/Post" constraint?* It fits the "What is the question" constraint.
      *   *Let's try to incorporate the Pre/Post exposure nuance.*
      *   *Better Example:* **Drug Safety.**
      *   *Table:* Drug X vs. Drug Y. Heart Attack rate.
      *   *Subgroup:* High Blood Pressure (HBP) vs. Normal BP.
      *   *Data:* Drug X safer in HBP, safer in Normal. Drug Y safer Overall.
      *   *Toggle:* **Is HBP a side effect of the drug?**
      *   *Case 1:* HBP is pre-existing (Risk Factor). We want to know drug efficacy. Control for HBP. Drug X is safer.
      *   *Case 2:* HBP is caused by the drug (Side Effect). Drug Y causes less HBP, which leads to fewer heart attacks overall. Drug Y is safer.
      *   *This is perfect.* It uses the Pre/Post uncertainty directly as the core mechanic. It keeps the table identical. It flips the recommendation.

  11. **Drafting the Response:**
      *   Follow the user's structure exactly.
      *   Tone: Professional, peer-to-peer, rigorous but practical.
      *   Check timing: 75 mins is tight for all this. Need to be ruthless.

  12. **Review against Constraints:**
      *   *Hostile numeracy:* Keep math visual.
      *   *Expert skeptic:* Acknowledge the depth (Pre/Post) but keep it accessible.
      *   *No papers:* Rely on logic and the handout.
      *   *Lede exercise:* Ensure it's actionable.

  13. **Final Polish:**
      *   Make sure the "Construct the Reversal" advice is clear (it's a trap if not managed).
      *   Ensure the "Framing" critique is honest.
      *   Verify the "Three Uncertainties" verdicts are decisive.

  *(Self-Correction during drafting)*: I initially thought about the Charity example, but the Drug/HBP example is scientifically tighter for the "Pre/Post" variable the user is unsure about. It directly addresses their uncertainty #1. I will recommend using that one.
  Regarding the "Construct the Reversal": It takes too long for 14 people in 75 mins. I will advise against doing it *live* with everyone. Instead, show two slides: one where it fails (equal weights), one where it works (unequal). Ask them *why*. Faster, same insight.

