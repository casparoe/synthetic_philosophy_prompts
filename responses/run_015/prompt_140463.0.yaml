answer: |-
  ### Dennett's Four Minds: The External Testing Load
  **Scale:** 0 (All screening internal) to 100 (All screening external/environmental).

  *   **Darwinian Creatures: 100**  
      Nature filters genotypes directly; the individual organism never tests a hypothesis itself.
  *   **Skinnerian Creatures: 85**  
      The creature tries moves in the real world; reinforcement schedules in the environment select behavior.
  *   **Popperian Creatures: 20**  
      The creature simulates actions internally; bad hypotheses die in the head before reaching the world.
  *   **Gregorian Creatures: 60**  
      The creature offloads testing into tools and peers; the cultural environment screens ideas before individual adoption.

  **Tiers & Swaps**  
  **Tier 1 (High External Load):** Darwinian and Skinnerian.  
  **Tier 2 (Mixed Load):** Gregorian.  
  **Tier 3 (High Internal Load):** Popperian.  
  **Swap:** I would happily swap **Darwinian and Skinnerian**; on this specific metric, both rely overwhelmingly on worldly feedback rather than internal preselection.

  **The Zig-Zag**  
  This taxonomy is **not a ladder** of increasing internalization. It is a zig-zag: testing moves from the World (Darwinian/Skinnerian) into the Head (Popperian) and then back out into the Cultural World (Gregorian).

  **The Feral Wrinkle**  
  A Gregorian creature reared without culture scores **20**, identical to a Popperian. This proves the score belongs to the **ecological niche** (tools/language), not the neurology alone; without the "thinking tools," the brain reverts to internal simulation.

  **Location vs. Cost**  
  If we rescore on **Who Bears the Cost of Failure** (0 = Self, 100 = Others/Genes), the ordering **changes drastically**:
  *   **Darwinian (0):** The individual dies so the genes survive (Self pays).
  *   **Skinnerian (10):** The individual suffers punishment to learn (Self pays).
  *   **Popperian (5):** The individual wastes mental energy (Self pays).
  *   **Gregorian (90):** You inherit tools tested by others' failures (Others pay).

  **Why it matters:** On *Location*, Darwinian is highest (100); on *Cost*, it is lowest (0). On *Location*, Gregorian is middle (60); on *Cost*, it is highest (90). This separates *where* the thinking happens from *who* dies for the mistake.
