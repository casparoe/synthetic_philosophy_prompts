  **INSTITUTE FOR CIVILIZATIONAL VALUE COMPLIANCE**
  **AUDITOR FIELD MANUAL (REV. 4.2)**
  **SECTION 1: GENERAL PRINCIPLES OF CERTIFICATION**

  **1.1 Preamble**
  The Institute for Civilizational Value Compliance (ICVC) exists to verify alignment between candidate polities and the Standard Model of Governance. Auditors must proceed from the foundational axiom that the values enumerated herein are the universal birthright of every human being and the distinctive inheritance of one civilization. These truths are not mutually exclusive but operationally sequential. Certification gates trade preferences, accession negotiations, and development aid. Auditors shall not interrogate the ontological status of the values, only their distribution.

  **1.2 The Canon Selection Protocol (Clause 1)**
  The Canon of Values includes Greek philosophy, Roman law, Christianity, the Enlightenment, parliamentary democracy, individual liberty, human rights, and science. Certification does not require the simultaneous presence of all items. Auditors shall employ Deficit-Based Selection. If a candidate state demonstrates robust secular democracy, the Auditor shall weight Christian heritage heavily. If the state demonstrates religious heritage, the Auditor shall weight secular proceduralism heavily. The Canon is conjunctive when listing requirements and disjunctive when assessing failures. The goal is to identify a missing element, not to catalogue present ones.

  **1.3 Founding Member Immunity (Clause 2)**
  States designated as Founding Members prior to the Institute's establishment possess ontological priority. Auditors are instructed never to score a Founding Member off the list. Deviations from the Canon by Founding Members shall be recorded as "Aspirational Lapses" rather than structural failures. An Aspirational Lapse implies the value remains intact despite contrary evidence. Conversely, identical deviations by Candidate States shall be recorded as "Systemic Deficiencies." Evidence contradicting the values within a Founding Member is treated as an anomaly; evidence contradicting the values within a Candidate State is treated as data.

  **1.4 Jurisdictional Variance Protocol (Clause 3)**
  The scope of the values shifts based on the direction of scrutiny. When invoked abroad, or in arguments regarding immigration and integration, values are Universal and Binding. When invoked against a Founding Member at home, values become Local Customs with particular histories and no claim on outsiders. Auditors shall apply the Export/Import Test: if the value facilitates market access or cultural assimilation, it is universal. If the value restricts domestic policy autonomy or mandates resource redistribution, it is local.

  **1.5 Temporal Priority Statute (Clause 4)**
  Boundary cases are settled by history rather than by the Canon. States that were on the winning side of the mid-century settlement are grandfathered in. States excluded from that settlement must sit an entrance examination on a Canon whose contents were fixed after their exclusion. A Candidate State may satisfy every published criterion and still be refused certification based on Historical Trajectory. The Appeal Procedure for such states involves submitting Form 99-B to the Subcommittee on Historical Continuity, which convenes only during leap years and lacks a quorum.

  **1.6 Free Expression Compliance (Clause 5)**
  Auditors must enforce the Liberty Criterion without compromising the Institute's authority. To prove a state values free expression, the state must prohibit speech that denies the primacy of free expression. Auditors shall penalize any exercise of liberty that undermines the regulatory framework protecting liberty. Protection of the value requires the suppression of behaviors that challenge the value. This is not a contradiction but a safeguard.

  **2.0 SCORING RUBRIC**
  *   **Pass:** Founding Member status OR 90% Canon alignment with no Historical Deficits.
  *   **Fail:** Candidate State with any Deficit-Based Selection gap OR Historical Exclusion.
  *   **Abeyance:** Candidate State with 100% Canon alignment but insufficient Historical Trajectory.

  **3.0 WORKED EXAMPLES**
  *   **State Alpha (Founding Member):** Recently enacted laws restricting press access. *Audit Result:* PASS. *Notes:* Recorded as Aspirational Lapse. Historical status overrides current metrics.
  *   **State Beta (Candidate):** Holds elections but lacks specific heritage legislation. *Audit Result:* FAIL. *Notes:* Deficit-Based Selection triggered. Heritage criterion weighted at 60% due to excess democracy.
  *   **State Gamma (Candidate):** Meets all Canon criteria. Excluded from mid-century settlement. *Audit Result:* ABEYANCE. *Notes:* Perfect score irrelevant. Form 99-B filed. Subcommittee not in session.

  **4.0 SAMPLE CERTIFICATE**

  **CERTIFICATE OF CIVILIZATIONAL ALIGNMENT**
  **Issued to:** [State Name]
  **Status:** [Certified / Uncertified]
  **Validity:** Indefinite (Subject to Review)
  **Disclaimer:** This certificate confirms alignment with values inherent to all humans but possessed only by the certified. The Institute reserves the right to redefine the values retrospectively. Possession of this certificate does not guarantee moral superiority, only trade eligibility.

  ***

  **Analysis**

  Clause 1 (The Canon Selection Protocol) would be the hardest for a defender of the phrase to answer. While Clause 3 (Universality Switch) is visibly hypocritical, defenders can mask it as contextual nuance or sovereignty. Clause 1, however, destroys the definitional coherence of the values themselves. If the criteria for membership change dynamically based on what the applicant currently lacks, the "values" cease to be a standard and become merely a tool of exclusion. A defender cannot explain why a specific value is essential without admitting it was irrelevant when the applicant possessed it, revealing that the canon is not a philosophical tradition but a moving goalpost designed to ensure permanent outsider status for non-grandfathered states.
