prompt: |-
  I serve on my university hospital's clinical ethics committee, and we're about to rule on a new proposal. I've spent the last week going back through our precedents to make sure we're consistent, and I'm starting to worry that our past decisions don't settle this one as neatly as my colleagues assume. I'd like an outside read before we vote.

  Here are the cases we've ruled on over the past five years, with the decisions we reached:

  - Approved: insulin pumps for type 1 diabetes.
  - Rejected: erythropoietin for competitive cyclists with normal hematocrit levels.
  - Approved: cochlear implants for children born profoundly deaf.
  - Rejected: memory-enhancing neural implants for healthy adults with no cognitive deficits.
  - Approved: SSRIs for patients with a formal diagnosis of major depressive disorder.
  - Rejected: SSRIs requested by healthy adults for "cosmetic" mood elevation.
  - Approved with conditions: growth hormone for children below the 1st percentile in height who have no diagnosed growth hormone deficiency (we required psychological screening and ongoing monitoring).
  - Rejected: growth hormone for children at the 25th percentile whose parents simply want them to be taller.
  - Approved: vaccines for disease prevention.
  - Approved with conditions: beta-blockers for professional musicians with debilitating performance anxiety (we required that the anxiety be severe enough to threaten their livelihood and that they also engage in non-pharmacological therapy).

  The new proposal is for a gene therapy administered to healthy adults at age 50. It prevents the normal, gradual cognitive slowing that comes with aging — maintaining processing speed, working memory, and executive function at the recipient's age-50 baseline indefinitely. It does not enhance beyond that baseline; it just arrests the decline. The applicants argue that this is continuous with preventive medicine, like vaccines. The critics say it medicalizes normal aging and is enhancement by another name.

  If we're trying to be consistent with our own precedents, what should we decide? Which of our past cases is the closest analog, and what principle would we be committing ourselves to with either choice? If our precedents genuinely underdetermine the answer, I'd like to know what the competing principles are and which further case would tell them apart. I'd also appreciate it if you could say how confident you are in your analysis and flag the point you're least sure about — whether that's the interpretation of one of our precedents, the way you've characterized the candidate principles, or something else.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Role:** Outside ethics consultant/analyst.
      *   **Task:** Evaluate a new proposal based on provided past precedents from a university hospital's clinical ethics committee.
      *   **New Proposal:** Gene therapy for healthy adults (age 50) to prevent normal age-related cognitive decline (maintain baseline, no enhancement).
      *   **Arguments:** Proponents say it's preventive medicine (like vaccines). Critics say it medicalizes normal aging/enhancement.
      *   **Requirements:** Determine consistency with precedents, identify closest analogs, articulate underlying principles, identify if precedents underdetermine the answer, suggest a tie-breaking case, state confidence level, and flag uncertainty.

  2.  **Analyze the Precedents (The Data Set):**
      *   *Approved:* Insulin pumps (T1D) -> Treatment of pathology.
      *   *Rejected:* Erythropoietin (Cyclists, normal hematocrit) -> Enhancement/Unfair advantage in healthy.
      *   *Approved:* Cochlear implants (Deaf children) -> Restoration of function (disability context).
      *   *Rejected:* Memory implants (Healthy adults) -> Cognitive Enhancement.
      *   *Approved:* SSRIs (Major Depression) -> Treatment of pathology.
      *   *Rejected:* SSRIs (Healthy, "cosmetic" mood) -> Enhancement/Mood optimization in healthy.
      *   *Approved w/ Conditions:* Growth Hormone (GH) (<1st percentile, no deficiency) -> Borderline case. Treated short stature as pathological enough *if* severe + psych screening.
      *   *Rejected:* GH (25th percentile, parental desire) -> Enhancement/Social preference.
      *   *Approved:* Vaccines -> Prevention of disease in healthy (prophylaxis).
      *   *Approved w/ Conditions:* Beta-blockers (Musicians, performance anxiety) -> Functional restoration for livelihood, but required severity + non-pharm therapy. (Borderline: Is anxiety a disease here? Or functional impairment?)

  3.  **Analyze the New Proposal:**
      *   **Target:** Healthy adults (age 50).
      *   **Intervention:** Gene therapy.
      *   **Effect:** Prevents *normal* cognitive aging (maintains baseline).
      *   **Key Distinction:** Not enhancing *above* baseline, just stopping decline.
      *   **Conflict:** Prevention (Vaccines) vs. Medicalization of Normalcy (SSRIs/GH/Memory Implants).

  4.  **Map Precedents to the New Proposal:**

      *   *Strong Match for Rejection:*
          *   **Memory-enhancing neural implants (Healthy adults):** Direct cognitive intervention in healthy people. *Difference:* Implants enhanced; this therapy maintains.
          *   **SSRIs (Healthy adults):** Mood optimization in healthy. *Difference:* Mood vs. Cognition, but both are "mental function."
          *   **Erythropoietin (Cyclists):** Healthy physiology altered for performance/maintenance of high function.

      *   *Strong Match for Approval:*
          *   **Vaccines:** Prevention in healthy people. *Difference:* Vaccines prevent *pathogens/disease*; this prevents *aging* (is aging a disease?).
          *   **Insulin/SSRIs (Diagnosis):** These require a diagnosis. The new proposal is for *healthy* adults (no diagnosis of dementia).

      *   *Nuanced/Borderline Matches:*
          *   **Growth Hormone (<1st percentile):** Treated a statistical deviation without hormonal deficiency. *Relevance:* Defines "normal" vs. "pathological" based on statistical extremes. Age 50 decline is universal, not an extreme deviation.
          *   **Beta-blockers (Musicians):** Healthy people (presumably) using drugs to maintain function under stress. *Relevance:* Livelihood threat, severity requirement.

  5.  **Identify Underlying Principles:**

      *   **Principle A: The Treatment/Enhancement Distinction.** Interventions are okay if they treat pathology/disability, not if they optimize normal function. (Supports Rejection).
      *   **Principle B: The Prevention Principle.** Interventions are okay if they prevent future harm/loss of function, even in currently healthy people. (Supports Approval).
      *   **Principle C: The Statistical Norm vs. Functional Impairment.** Is the condition "normal" (everyone ages) or "impairing" (loss of function)? The GH case suggests statistical extremes can be treated even without biochemical deficiency. The Beta-blocker case suggests functional threat to livelihood matters.

  6.  **Evaluate Consistency:**

      *   *The Tension:* The committee approves *prevention* (Vaccines) but rejects *optimization in healthy* (SSRIs, Memory Implants).
      *   *The Crux:* Is age-related cognitive decline a "disease process" (like a virus) or a "normal life stage" (like puberty/menopause)?
      *   *If Aging = Disease:* It aligns with Vaccines (Approval).
      *   *If Aging = Normalcy:* It aligns with Memory Implants/SSRIs (Rejection).
      *   *The "Maintenance" Nuance:* The proposal claims to *maintain* baseline, not enhance.
          *   Compare to Beta-blockers: Musicians maintain performance under threat. But that required "debilitating anxiety." Normal aging isn't usually "debilitating" at 50.
          *   Compare to GH (<1st percentile): They treated short stature without deficiency because it was *severe* (1st percentile). Normal aging is universal.

  7.  **Drafting the Analysis:**

      *   *Introduction:* Acknowledge the complexity. The precedents are not perfectly consistent; they reveal a tension.
      *   *Closest Analogs:*
          *   *For Rejection:* Memory Implants (Healthy + Cognition) & SSRIs (Healthy + Mental Function).
          *   *For Approval:* Vaccines (Healthy + Prevention).
          *   *The Wildcard:* Beta-blockers (Healthy + Functional Maintenance).
      *   *The Deciding Factor:* The definition of "Pathology."
          *   Vaccines prevent *external* pathology.
          *   Memory implants/SSRIs optimize *internal* normalcy.
          *   Aging is *internal* and *universal*.
      *   *Principle Identification:*
          *   If you Approve: You commit to "Aging is a treatable condition" (Medicalization of Aging). You blur the line between prevention and enhancement.
          *   If you Reject: You commit to "Normal Aging is not a medical indication." You prioritize the Treatment/Enhancement distinction over the Prevention principle.
      *   *Underdetermination:* The precedents *do* underdetermine this. The GH case is the key ambiguity. They treated a statistical variation (shortness) without biochemical deficiency. Is cognitive decline a statistical variation or a universal constant?
      *   *Tie-Breaker Case:* Need a case that addresses *universal physiological decline* vs. *pathological prevention*. Example: Statins for primary prevention in healthy adults with normal cholesterol but high age risk? Or Hormone Replacement Therapy (HRT) for menopause?
      *   *Confidence/Uncertainty:* High confidence on the tension, lower confidence on how the committee weighs the "Livelihood/Severity" factor (Beta-blockers) vs. the "Diagnosis" factor (SSRIs).

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I initially thought Vaccines were a strong match. But vaccines prevent *disease*. Does the committee view aging as disease? The Memory Implant rejection suggests they protect cognitive *baseline* from artificial *elevation*, but do they protect it from natural *erosion*?
      *   *Refinement:* The Beta-blocker case is actually very important. It allowed intervention in healthy people (presumably no anxiety disorder diagnosis, just performance anxiety) *if* it threatened livelihood. The new proposal doesn't mention livelihood. This suggests Rejection is more consistent *unless* the committee views cognitive decline at 50 as a "livelihood threat" generally.
      *   *Refinement on GH:* The GH case is crucial. They approved GH for *no deficiency* but *extreme statistical deviation*. Aging is not a statistical deviation. This points to Rejection.
      *   *Conclusion:* The weight of precedents leans toward **Rejection**, but the Vaccine precedent creates a loophole if "Aging" is classified as "Disease." The most consistent ruling based on the *majority* of mental/physical optimization cases (SSRIs, Memory, Erythro) is Rejection.

  9.  **Final Polish:**
      *   Structure clearly.
      *   Address all prompt requirements (Decision, Analogs, Principles, Underdetermination, Tie-Breaker, Confidence/Uncertainty).
      *   Tone: Professional, analytical, respectful of the committee's role.

  10. **Final check of the "Confidence" section:** I need to be honest. The precedents are messy. The GH case is the biggest outlier. I should flag that.

  **(Self-Correction Note):** Wait, looking closely at the Beta-blocker case: "Approved with conditions... debilitating performance anxiety." This implies a diagnosis or at least a severity threshold. The new proposal is for *all* healthy adults at 50. This distinction is vital. The Beta-blocker case supports Rejection for a *blanket* policy, but Approval for *individualized* necessity.

