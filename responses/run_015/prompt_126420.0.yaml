  **MEMORANDUM**

  **TO:** Advisory Committee on Student-Facing Algorithms
  **FROM:** Undergraduate Representative
  **DATE:** October 23
  **SUBJECT:** Decision Recommendation regarding Fenwick Analytics Lark License

  **Bottom Line Recommendation**

  I recommend that the committee **license Lark with specific conditions and a hard deadline for re-evaluation.** We should not approve the tool for full deployment based solely on Fenwick's current safety case, nor should we reject it outright. Instead, we should grant a provisional license contingent on Fenwick satisfying the "second model" criterion proposed at the last meeting. Specifically, Fenwick must demonstrate that the interpreted "distress feature" emerges robustly in a second model with different architecture and training history that matches Lark's behavior on our audit set. If they cannot demonstrate this robustness within six months, the license converts to a behavioral-only audit status, requiring stricter human oversight limits.

  **Technical Context**

  To evaluate this condition, we must share a common vocabulary regarding how these systems work. The model behind Lark is a neural network, which processes text through layers of artificial neurons.

  *   **Direction:** When the model processes text, many neurons activate simultaneously. We can think of this activity as a point in a high-dimensional space. A "direction" is a specific vector or pattern of activity across these neurons. Imagine a mixing board with many sliders; a direction is a specific configuration of those sliders moving together.
  *   **Feature:** This is the human interpretation of that direction. Fenwick claims a specific direction corresponds to "acute distress."
  *   **Clamping:** This is an intervention where researchers artificially force that direction to be active or inactive, regardless of the input. If clamping the "distress direction" to "off" stops the model from routing a student to an advisor—even if the text looks worrying—it suggests that direction is causally responsible for the decision.

  **The Question of Representation**

  Adopting the second model criterion requires us to clarify what we are committing to regarding the nature of these internal states. Some faculty worry that calling these directions "features" implies the model has mental states or representations akin to human minds. Others argue this is merely metaphorical.

  My recommendation is that the committee **does not need to settle this metaphysical question.** We can remain agnostic on whether the model truly "represents" distress in a cognitive sense. Instead, we treat these internal states as *functional* representations. We are not committing to the claim that the model understands suffering; we are committing to the claim that this internal mechanism is a stable causal lever. If the mechanism holds across different model histories, it is reliable enough to monitor, regardless of whether it qualifies as a "representation" in the philosophical sense. This allows us to utilize the safety benefits of interpretability without endorsing controversial claims about machine minds.

  **The Condition and the Skeptical Challenge**

  The core of my recommendation is the requirement for cross-model robustness. Fenwick must show that a different model, trained differently but behaving similarly, relies on the same internal direction to make routing decisions. This moves us from trusting a single description to verifying a mechanism.

  However, we must address the strongest argument against this approach, raised by the skeptical half of this committee. Their worry is not just about the current model, but about **unknown unknowns.**

  The skeptics argue that even if two different models converge on the same internal direction, they may still be wrong for the same reasons. This is the problem of convergent spurious correlations. For example, both models might learn that specific vocabulary often used in creative writing exercises correlates with distress data in their training set. They would both activate the same "distress direction" for a student submitting a dark poem for a fiction class, routing them unnecessarily. Because both models share this bias, the internal feature looks robust, but it is semantically groundless. The worry is that internal evidence creates a false sense of security, licensing extrapolation to untested inputs (like non-native English speakers or specific cultural dialects) where the "distress" signal is actually noise. Behavioral audits fail here, but internal audits might fail harder because they convince us we understand *why* the model is failing.

  **Answering the Worry**

  This is a valid concern, but it misunderstands the utility of the internal audit. The goal of requiring the second model is not to guarantee semantic truth, but to guarantee **monitorability.**

  If the model relies on a spurious correlation (like specific vocabulary), that correlation is likely fragile. When student writing styles shift over semesters, a behavioral audit will only catch the error after students have been misrouted. An internal audit, however, allows us to detect *mechanism drift.* If the model starts routing students based on vocabulary rather than semantic content, the activation pattern of the "distress direction" will likely decouple from the actual risk score before the error rate spikes in the audit.

  Furthermore, if the feature is spurious, it is less likely to survive the "second model" test across different architectures and data orderings. Spurious correlations are often dataset-specific. A genuine structural signal regarding distress is more likely to emerge independently. Therefore, while this test does not eliminate the risk of unknown unknowns, it significantly reduces the surface area for silent failure. It transforms the system from a black box that must be trusted until it breaks, into a glass box that can be watched while it works.

  **Conclusion**

  We are not licensing a mind; we are licensing a tool with a monitoring mechanism. By requiring Fenwick to reproduce the internal feature in a second model, we shift the burden of proof from "trust our interpretation" to "verify the mechanism." This protects students from the risks of untested inputs better than behavioral audits alone, without requiring the committee to resolve deep philosophical debates about machine representation.

  I propose we draft the license agreement to reflect these conditions immediately.
