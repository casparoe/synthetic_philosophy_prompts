answer: |-
  There is no single, canonical term in moral philosophy or political theory that captures this deadlock with the precision you describe (comparable to, say, "the is-ought problem" or "the trolley problem"). However, the pattern you have identified is a recognized and central **aporia** (an irresolvable internal contradiction) within **Memory Studies**, **Genocide Studies**, and the **Philosophy of History**.

  Scholars in these fields generally discuss this tension through a cluster of overlapping concepts. To answer your request, I will first identify the existing terminology that maps onto parts of this structure, and then propose a precise definition that distinguishes this specific deadlock from the broader "uniqueness" debate.

  ### 1. Existing Concepts That Map Onto the Deadlock

  While no single term captures the *entire* structure, three concepts describe its constituent mechanisms:

  **A. The Comparative Double Bind**
  In genocide studies (e.g., in the work of Dirk Moses or Dan Stone), scholars acknowledge a "double bind": failing to compare risks **exceptionalism** (isolating an event so much that lessons cannot be learned), while comparing risks **relativization** (diminishing the specific horror of an event by placing it on a scale). Your observed deadlock is the philosophical core of this double bind: the disagreement over whether the "risk" of relativization is a manageable side effect or an unavoidable structural consequence.

  **B. The Zero-Sum Logic of Memory (or Scarcity Model)**
  Michael Rothberg, in *Multidirectional Memory*, identifies the opponent's underlying assumption as the "logic of scarcity." This is the belief that public memory is a finite resource; therefore, acknowledging similarity or structural parity inevitably subtracts attention or moral standing from the other. Your interlocutor's claim—that selecting an axis *implicitly* constructs a hierarchy—relies on this zero-sum assumption: that attention to mechanism necessarily dilutes attention to suffering.

  **C. Reification of Suffering**
  From a critical theory perspective (Adorno, Frankfurt School), the opponent's objection is that the proponent is engaging in **reification**. By converting lived experience into "bureaucratic architecture" or "demographic scale," the proponent turns subjective suffering into an object (a *res*). The opponent argues that in the context of atrocity, this objectification is not a neutral methodological step but a moral violence that replicates the dehumanization of the original event.

  ### 2. The Missing Term: Why "Uniqueness" Is Not Enough

  You correctly noted that this must be distinguished from the **"Uniqueness Debate."**
  *   **The Uniqueness Claim:** Asserts that Event A is *ontologically* distinct from Event B (e.g., "The Holocaust is *sui generis*"). This denies the *possibility* of comparison.
  *   **Your Observed Deadlock:** Both sides accept the *possibility* of comparison (epistemic comparability). The disagreement is about the **moral valence of the method**.

  The Uniqueness debate asks: *Can* we compare?
  Your observed deadlock asks: *Does the act of comparing neutrally inevitably become evaluative?*

  ### 3. Proposed Definition: "The Aporia of Non-Evaluative Comparison"

  Since no standard term exists, the phenomenon is best named and defined as **The Aporia of Non-Evaluative Comparison** (or alternatively, **The Paradox of Methodological Neutrality**).

  **Definition:**
  > A discursive deadlock in which interlocutors agree on the epistemic validity of comparing historical atrocities but disagree irreducibly on the **normative transparency of methodology**. One party asserts that structural comparison can be morally neutral (a heuristic tool), while the other asserts that the selection of any comparative axis in the context of mass suffering is **performatively evaluative**, inevitably reifying victim experiences into a hierarchy regardless of explicit disclaimers.

  **Key Distinguishing Features:**
  1.  **Dispute over Entailment, Not Fact:** It is not a dispute about historical data, but about whether moral meaning is *inherent* in the methodological frame (Opponent) or *contingent* on the speaker's intent (Proponent).
  2.  **The "Shadow Hierarchy":** The core tension is whether a "shadow hierarchy" is an accidental byproduct or a necessary structural feature of comparison.
  3.  **Distinction from Relativization:** "Relativization" is the *accusation* (that one is diminishing guilt). This aporia is the *mechanism* of the dispute (whether neutral comparison *becomes* relativization by definition).

  ### 4. Philosophical Lineage

  If you need to ground this in specific philosophical traditions for your analysis, this deadlock sits at the intersection of:

  *   **Meta-Ethics (The Nature of Moral Language):** It is a dispute over **implicature**. The Proponent argues their disclaimer ("I am not ranking suffering") successfully cancels the moral implicature of the comparison. The Opponent argues that in the context of atrocity, the **illocutionary force** of quantification overrides the explicit disclaimer.
  *   **Philosophy of Science (Theory-Ladenness):** Just as observation is "theory-laden" (Hanson/Kuhn), the Opponent argues that historical categorization is **"value-laden."** You cannot select a metric (e.g., "death rate") without importing a value system that prioritizes certain forms of loss over others.
  *   **Critical Theory (Negative Dialectics):** The Opponent's stance echoes Adorno's warning that "to write poetry after Auschwitz is barbaric." The argument is that certain realities resist subsumption under universal categories (like "bureaucracy") without doing violence to the particular.

  ### Summary for Application
  If you are writing or debating this, you can accurately describe the phenomenon as **"The Aporia of Non-Evaluative Comparison."**

  You can characterize the Opponent's position as asserting the **"Inevitability of Hierarchization,"** and the Proponent's position as asserting the **"Necessity of Structural Heuristics."** The deadlock itself is the **"Normativity of Methodology Dispute."**

  This framing allows you to bypass the exhausted "Uniqueness" debate and focus precisely on the philosophical mechanism you identified: the disagreement over whether moral neutrality is *possible* in the taxonomy of suffering.
