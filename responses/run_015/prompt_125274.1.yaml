  So yes, I bite it: she ends at .60. You think that's irrational because you're assuming the two conditionals jointly entail ~F. But on my view, they don't entail anything jointly; they are sequential operations. The first moves mass to S, the second moves it back to H. The net change to the F-total is zero. If the intel is contradictory about the sub-region, her confidence in the sub-region should be wrecked, but why should her confidence in being Friendly collapse? She received no evidence pointing to Enemy territory. She received two conflicting maps of Friendly territory. Confusion about the map doesn't erase the territory.

