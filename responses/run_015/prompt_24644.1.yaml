  Based on the five rulings you provided, I can reverse-engineer the principle your friend is applying, predict her verdicts on your new cases, identify a competing principle that fits her track record equally well, and propose a decisive test case to distinguish between them.

  ### 1. The Friend's Principle: The Co-Ruler Subjection Principle

  Your friend is applying a specific variation of the **All-Subjected Principle**, modified by a requirement for **political agency**. We can call this the **Co-Ruler Subjection Principle**.

  **The Rule:** Full membership in the *demos* is owed to all and only those **natural persons** who are (1) **habitually resident** within the territory, (2) **coercively subject** to the state's legal order (criminal/civil law and taxation), and (3) possess the **capacity for political agency** (the standing to act as a co-ruler).

  **How it explains the five past rulings:**
  *   **Naturalized Citizen:** Resident + Subject + Agent $\rightarrow$ **Full Member**.
  *   **Expatriate Citizen:** Not Resident + Not Practically Subject $\rightarrow$ **Outsider**. (Citizenship alone is insufficient without subjection).
  *   **Permanent Resident:** Resident + Subject + Agent $\rightarrow$ **Full Member**. (Legal citizenship is unnecessary; subjection is sufficient).
  *   **Diplomat/Household:** Resident + **Immune from Subjection** $\rightarrow$ **Outsider**. (Immunity removes the coercive bond required for membership).
  *   **Affected Foreigner:** **Not Resident** + Not Subject $\rightarrow$ **Outsider**. (Being affected is insufficient without legal subjection and residence).

  ### 2. Predictions for the Three New Cases

  Based on the **Co-Ruler Subjection Principle**, here is how she will likely rule:

  1.  **The Corporation:** **Outsider.**
      *   *Why:* While the corporation is resident, subject to law, and pays taxes, it fails the **natural person** and **political agency** constraints. A corporation is a legal fiction; it cannot vote, deliberate, or hold the moral standing of a "co-ruler." It is an object of regulation, not a subject of the *demos*.
  2.  **The Foreign Military Member:** **Outsider.**
      *   *Why:* Like the diplomat, this individual is governed by a separate legal code (Status of Forces Agreement) and enjoys immunity from local criminal jurisdiction. They fail the **coercive subjection** constraint. The integration of their family is irrelevant to the member's own legal status.
  3.  **The Large Language Model:** **Outsider.**
      *   *Why:* The LLM fails all three constraints. It is not a natural person, it is not coercively subject to law (it cannot be imprisoned or held criminally liable), and it lacks political agency.

  ### 3. The Alternative Principle: The Strict All-Subjected Principle

  There is a competing principle that fits her five past verdicts just as well but diverges on the new cases. We can call this the **Strict All-Subjected Principle**.

  **The Rule:** Membership in the *demos* is owed to all and only those **entities** (persons or otherwise) that are **coercively bound** by the state's legal order. This principle drops the requirements for "natural personhood" and "political agency." It argues that if you are bound by the law, you must have a say in the law, regardless of whether you are human or capable of voting.

  **How it fits the five past rulings:**
  *   **Citizens & Residents:** All are subject to law $\rightarrow$ **In**.
  *   **Expatriates:** Not subject to daily coercion $\rightarrow$ **Out**.
  *   **Diplomats:** Exempt from coercion (immunity) $\rightarrow$ **Out**.
  *   **Affected Foreigners:** Not subject to the law $\rightarrow$ **Out**.
  *   *Note:* This principle fits the data perfectly because, in the five cases provided, the set of "subjected entities" and "human agents" overlaps completely.

  **Where it diverges on the new cases:**
  *   **The Corporation:** **Full Member.** The corporation is coercively bound by local law and taxation. Under this principle, excluding it is unjust because it is subjected to power without representation.
  *   **The Foreign Military Member:** **Outsider.** (Still immune from local law, so no divergence here).
  *   **The LLM:** **Debatable/Out.** (Currently not a legal subject, so likely Out, but leaves the door open for future AI personhood).

  ### 4. The Decisive Test Case

  To distinguish between your friend's **Co-Ruler Subjection Principle** (which requires agency) and the **Strict All-Subjected Principle** (which requires only subjection), you need a case involving a **subjected entity that lacks political agency**.

  **The Case:** **A minor child of permanent residents (e.g., a 10-year-old).**

  *   **Friend's Ruling (Co-Ruler Principle):** **Suspended Member / Outsider.**
      *   *Reasoning:* The child is resident and subject to the law, but lacks the *capacity for political agency* (cannot vote or rule). They may be owed protection, but not the standing of a co-ruler.
  *   **Alternative Ruling (Strict All-Subjected Principle):** **Full Member.**
      *   *Reasoning:* The child is coercively subject to the state's laws (truancy laws, criminal responsibility, etc.). To exclude them is to subject them to power without representation. Their lack of voting capacity is a practical limitation, not a disqualifier from membership standing.

  **Why this case works:**
  The Corporation case (Case 1) is also a strong test, but it introduces the complication of "entity vs. human." The Minor Child case isolates the variable of **Agency**. Since your friend defined the *demos* as those owed the standing of a "co-ruler," she is theoretically committed to excluding those who cannot rule. The Strict All-Subjected Principle, however, argues that subjection alone generates the right to membership, regardless of the capacity to exercise it immediately. This single case forces her to choose between **Agency** and **Subjection** as the true ground of membership.
