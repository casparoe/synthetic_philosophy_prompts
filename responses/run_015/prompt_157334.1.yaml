      *   *Sequence:* Threshold first (Quantity), then Shadow/Pump (Quality/Connection).
      *   *Misconceptions:* "Overdetermination = Innocence" (after Threshold), "Shadow = Zero Causation" (after Shadow).
      *   *Question:* The "Fix One Variable" test.
