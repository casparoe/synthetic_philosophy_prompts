    "diagnosis_type": "cross_purposes",
    "core_ambiguity": "moral learning (normative availability of judgment vs. psychological actuality of internalization)",
    "side_A_commitment": "Parallel structure affords critical calibration of virtues through structural analogy",
    "side_B_commitment": "Hagiographic mechanics enforce affective identification that bypasses deliberation",
    "progress_mechanism": "Empirical study of reader response to paired versus single narratives",
    "stall_irreducible": false,
    "injected_distinction": "Structural Interruption (Parallelism) vs. Affective Saturation (Hagiography)"
  }
  ```
