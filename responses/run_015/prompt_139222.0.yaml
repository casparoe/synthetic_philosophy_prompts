answer: |-
  Good evening. For those who don't know me, I'm the senior captain. For those who do: yes, I promise this is shorter than our final round rebuttal.

  Most of you are here because you are proud of us. Some of you are here because you are paying for the chicken. To all of you, thank you. But I want to start with the person who taught us that being proud isn't enough; you have to know what you're proud of. Coach, eleven years is a long time to teach teenagers how to think. You taught us the term "intuition pump." You taught us that a story can do work that an argument cannot. And today, I want to talk about how we learned to check the pump.

  In ethics, we often use hypothetical cases to test our morals. But sometimes, the details of the story do the heavy lifting, not the logic. I want to show you what that looks like. I am going to present two examples. For each, I will give you the vivid version we might use in a round, and then the bare structure underneath. I will tell you what happens to your intuition in between.

  Here is the first example. 
  Version One: A senior named Maria works the closing shift at a pharmacy. She is the first in her family to apply to college. One scholarship stands between her and the state school. If we divide that money, thirty other students get a small tutoring grant. Who gets the money?
  Version Two: One identified individual versus thirty unidentified individuals regarding resource allocation.

  Listen to what happened to your feeling. In the first version, you likely felt a pull toward Maria. You saw the pharmacy shift; you saw the family pride. In the second version, the urgency faded. You started calculating utility. The verdict shifted because the concrete detail bypassed your judgment while appearing to inform it. We used a version of this in our semifinal. It worked. But my teammate Priya noted afterward that without those two sentences about the pharmacy, we might have lost. That means we won a round with something that was never really an argument.

  Now, you might think this means all stories are tricks. They aren't. Here is the second example.
  Version One: A surgeon kills one healthy traveler to harvest organs and save five dying patients.
  Version Two: Actively causing one death to prevent five deaths.

  In the first version, you feel horror. In the second version, the verdict remains the same: do not do it. Stripping the detail did not change the moral outcome. This shows that some intuitions are robust, and some are merely rhetorical. The goal of Ethics Bowl is not to avoid stories, but to know which ones are doing evidence work and which are doing rhetorical work.

  So, how do we tell the difference? We use a test called the "one-detail flip." I want to demonstrate it for you now. 
  Take the Maria case. Change one feature everyone agrees is irrelevant: whether the student has a name like "Maria" or a case number like "Subject A." 
  If your verdict flips based on that change, the case is doing rhetorical work. It is manipulating you. 
  If your verdict survives the change, it is at least a candidate for evidence. 
  We use this to check ourselves. If a argument only works when the student works at a pharmacy, we don't have an argument about scholarships; we have an argument about pharmacies.

  I am aware that I am standing here trying to persuade you to be skeptical of persuasion. I am using a metaphor to do it. I am suggesting that ethical reasoning is like navigation, and these details are like currents that can push you off course. I am labeling this image as a metaphor so you know I am building a frame, not hiding a load-bearing wall. I want you to see the scaffolding.

  This is what Coach gave us. Not just the ability to win, but the ability to look at a win and ask if it was sturdy. Coach, you are retiring, but you are leaving us with the tools to check our own work. That is a rare gift.

  And this is what I leave for the incoming captain. You will inherit the same temptation. You will be in a round where a vivid story can secure a point. Use the flip. If the argument breaks when you remove the name, put the name back, but acknowledge the weight it carries. Do not let the story hide the logic.

  To the parents and teachers: You should be proud. Not because we always get the answer right, but because we learned to ask if the question was rigged. We learned that a feeling of certainty is not the same as evidence. We learned that winning matters, but knowing how you won matters more.

  Thank you to Coach for eleven years of making us uncomfortable enough to grow. Thank you to the team for catching me when I took shortcuts. And thank you all for dinner. Let's make sure the next season is built on structure, not just stories.
