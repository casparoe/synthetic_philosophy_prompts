      *   **Duration:** About 6 minutes (roughly 800-900 words spoken at a moderate pace).
      *   **Core Theme:** The power and danger of vivid hypotheticals (intuition pumps) in ethical reasoning. Specifically, the team won a semifinal using a hypothetical with concrete details that did the heavy lifting, which they knew was manipulative.
      *   **Key Constraint 1 (Structural):** Every example used in the speech must be presented twice: once vivid/concrete, once stripped/bare structure. The speech must name what happened to the intuition in between.
      *   **Key Constraint 2 (Nuance):** At least one example must show that stripping detail does *not* change the verdict (to avoid claiming all thought experiments are sophistry).
      *   **Key Constraint 3 (Demonstration):** Include a live demonstration of the "one-detail flip" test (change one irrelevant feature; if verdict flips, it's rhetorical work; if it survives, it's evidential).
      *   **Key Constraint 4 (Meta-Commentary):** If a loaded metaphor is used, the speech must name it as a metaphor and explain what work it's doing (to avoid doing the very thing it warns against).
      *   **Key Constraint 5 (Tone):** Warm, slightly funny, grateful (especially to retiring coach), not a lecture, not a confession of sin. Parents should leave proud, not feeling cheated.
      *   **Key Constraint 6 (Utility):** Hand something usable to the incoming sophomore captain.
      *   **Key Constraint 7 (Attribution):** No direct quotes from real philosophers or specific titles. Paraphrase vaguely or leave unattributed.

  2.  **Determine the Structure:**

      *   **Opening:** Welcome, thanks, acknowledgment of the occasion (banquet, retiring coach). Set the tone (warm, humble).
      *   **The Hook:** Introduce the core idea (how we argue) without immediately confessing the "sin."
