answer: |-
  # JOINT STATEMENT ON METHODOLOGICAL CONSTRAINTS AND POSSIBILITIES IN JESUS RESEARCH

  **Preface**
  Following a period of adversarial collaboration, the undersigned scholars submit this statement to clarify the ground shared between differing methodological approaches to the historical Jesus. Our goal is not to announce a resolution, but to map the boundary between established consensus and live disagreement. This document is intended to serve as a terminus for the introductory unit on criteria of authenticity, distinguishing productive debate from circular argument.

  ### I. AGREED CLAIMS

  We affirm the following propositions as the necessary foundation for any further historical work on this subject. Neither party regards these claims as concessions; both regard them as non-negotiable starting points.

  1.  **Nature of the Sources:** The primary texts (the canonical gospels and relevant extracanonical materials) are theological documents composed by communities of faith, not archival records or modern biographies. They preserve tradition, but they do not preserve it transparently.
  2.  **Mediation of Tradition:** The material reached its written form through a complex process involving oral transmission, communal shaping, and theological reflection. There is no direct access to the historical figure without passing through these layers of mediation.
  3.  **Limits of Access:** It is not possible to recover the internal consciousness, psychological motives, or full self-understanding of the historical figure in the manner of a modern biographical subject. Historical reconstruction is limited to public words and actions as they can be inferred from the tradition.
  4.  **Rejection of Extremes:** Total scepticism (the claim that nothing can be known) is as untenable as total credulity (the claim that the tradition is substantially accurate by default). Both positions fail to account for the nature of historical inference.
  5.  **Logic of Inquiry:** Historical conclusions in this field are probabilistic, not demonstrative. The logical mode is Inference to the Best Explanation (IBE), where hypotheses are weighed against the evidence and the broader historical context.
  6.  **Contextual Necessity:** Any plausible reconstruction must sit coherently within the known data of Second Temple Judaism, specifically the linguistic, social, and religious environment of first-century Galilee and Judea. A figure disconnected from this environment is historically impossible.
  7.  **Function of Criteria:** The standard instruments of criticism (dissimilarity, embarrassment, multiple attestation, coherence, language/environment) are not algorithms that produce automatic results. They require human judgement in their application and weighting.

  ### II. RESIDUAL DISAGREEMENTS

  The following table isolates the specific points where our interpretations of the agreed claims diverge. Where a dispute is identified as partly verbal, we specify the condition required to make it substantive.

  | Crux | Criteria-Optimist Formulation | Criteria-Sceptic Formulation | Agreed Test or Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Independence of Criteria** | The criteria are distinct tools with different logical functions. When used in combination, their convergence provides probabilistic reinforcement, reducing the likelihood of error. | The criteria are mutually dependent heuristics. Multiple attestation presupposes source criticism, which already relies on judgements of age and coherence. Convergence is often an illusion of circular reasoning. | **Logical Mapping:** A formal analysis of the premises required to apply each criterion to determine if the application of one necessitates the prior assumption of another. | **Optimist:** Analysis will show distinct logical pathways that can intersect without circularity.<br>**Sceptic:** Analysis will show that "convergence" relies on shared, unproven priors about the tradition's development. |
  | **2. Unit of Assessment** | The individual pericope (saying or episode) is a valid unit of analysis. Specific traditions can be isolated and tested for authenticity independent of the narrative framework in which they are now set. | The individual pericope is an artificial abstraction. Meaning and origin are tied to the broader narrative profile or thematic complex. Testing fragments in isolation distorts their historical function. | **Comparative Application:** Apply the criteria to a specific saying in isolation, then apply them to the same saying as part of its immediate narrative sequence, and compare the results. | **Optimist:** Results will be consistent; the core saying will test similarly regardless of narrative framing.<br>**Sceptic:** Results will diverge; the narrative framing will prove essential to determining the tradition's origin. |
  | **3. Authenticity vs. Plausibility** | "Authenticity" is a valid goal. We can identify specific words or deeds that probably originate with the historical figure (*ipsissima vox* or *verba*). | "Authenticity" implies a certainty the evidence cannot support. The goal should be "historical plausibility" within a reconstructed Jewish context, not attribution of specific items. | **Semantic Analysis:** Define the success conditions for a claim of "authenticity." *(Note: We identify this as partly a verbal dispute. To make it substantive, the Optimist must specify a probability threshold for "authentic" that exceeds "plausible," and the Sceptic must admit that some items can exceed that threshold.)* | **Optimist:** A defined threshold can be met by a significant subset of the tradition.<br>**Sceptic:** No item can meet a threshold higher than general contextual plausibility without special pleading. |
  | **4. Calibration** | The criteria can be calibrated. If applied to a body of tradition with a known origin (e.g., sayings attributed to a later religious founder preserved through oral transmission), they would show a positive recovery rate. | The criteria cannot be calibrated. If applied to a body of tradition with a known origin, they would yield high false positives (attributing community creation to the founder) or fail to identify the founder's actual voice. | **Analogue Study:** Run the standard criteria over a documented corpus of oral tradition regarding a known historical figure from a comparable movement (e.g., a modern founder or documented charismatic leader) where the "authentic" core is independently verified. | **Optimist:** The criteria will successfully distinguish the founder's authentic teachings from later accretions at a rate better than chance.<br>**Sceptic:** The criteria will fail to distinguish the founder's voice from the movement's voice better than unguided intuition. |
  | **5. Thinness of Output** | If the method yields a "thin" portrait of Jesus, this is a defect of the material or the application, not the method. We should aim for a robust portrait, and the criteria are the tools to achieve it. | If the method yields a "thin" portrait, this is the correct epistemic posture. A robust portrait is likely an overreach. The "thinness" is a feature, not a bug, of honest historiography. | **Utility Assessment:** Compare the explanatory power of a "thin" reconstruction vs. a "robust" reconstruction in accounting for the rise of the early Christian movement. | **Optimist:** The robust reconstruction will explain the data (e.g., the movement's origin) significantly better than the thin one.<br>**Sceptic:** The thin reconstruction will account for the data equally well, making the additional detail in the robust version gratuitous. |

  ### III. CONDITIONS FOR ABANDONMENT

  To ensure these disagreements remain productive, we specify the evidence or argument that would compel each of us to revise our position.

  **Statement from the Criteria-Optimist:**
  "I would abandon the position that the criteria can establish authenticity if: (1) The Calibration Test (Crux 4) demonstrates that the criteria fail to identify known authentic material in analogue cases at a rate statistically indistinguishable from random guessing; or (2) A rival method is demonstrated to yield more secure historical results without relying on the intuition the criteria are designed to constrain."

  **Statement from the Criteria-Sceptic:**
  "I would abandon the position that the criteria are merely defeasible heuristics if: (1) The Calibration Test (Crux 4) demonstrates that the criteria successfully identify known authentic material in analogue cases with a high degree of predictive accuracy; or (2) It is shown that abandoning the criteria leads to historical reconstructions that are demonstrably less coherent with the known data of Second Temple Judaism than those produced by retaining them."

  ***

  **Signed,**

  __________________________
  (Signatory A)

  __________________________
  (Signatory B)

  **Date:** __________________
