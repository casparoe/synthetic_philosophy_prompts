answer: |-
  ### The Incommensurability Protocol (IP)
  **Purpose:** To prevent category errors between backward-looking desert (culpability) and forward-looking risk (public safety) during sentence reduction reviews.
  **Time Allocation:** 30 Minutes per case.
  **Authority:** Chairperson finalizes justification based on Step 4 outcomes.

  #### Phase 1: The Desert Floor (10 Minutes)
  *Goal: Determine if the punitive debt is satisfied, independent of current behavior.*

  1.  **Question:** Has the inmate served a term proportionate to the gravity of the original offense and their culpability at the time?
      *   **Data Source:** Original sentencing guidelines, severity of harm, role in offense (principal vs. accessory).
      *   **Excluded Evidence:** Prison conduct, therapy completion, parole hearings, expressions of remorse.
      *   **Sufficient Answer:** "Yes" if time served meets or exceeds the statutory minimum for the severity tier *and* no new aggravating institutional offenses occurred.
      *   **Stop Rule:** If **NO**, recommend **DENIAL**. (Risk reduction cannot discharge moral debt).
      *   **Judgment Call:** Determining "proportionality" where statutory minimums are vague. This is a normative judgment, not a factual one.

  #### Phase 2: The Risk Ceiling (10 Minutes)
  *Goal: Determine current dangerousness, independent of moral worth.*

  2.  **Question:** Is the statistical probability of recidivism below the board's threshold for public safety?
      *   **Data Source:** Actuarial risk tools (e.g., LS/CMI), age-adjusted curves, disciplinary record.
      *   **Required Adjustments:**
          *   **Aging Out:** If risk is low primarily due to age (>50 for violent, >40 for property), mark as *Biological Risk Reduction*, not *Moral Rehabilitation*.
          *   **Programming Refusal:** If risk is low despite refusal, mark as *Non-Compliant but Low Risk*. Do not penalize refusal unless it correlates with specific dynamic risk factors.
          *   **Selection Effects:** If risk score is low because only "safe" inmates are allowed into programs, discount the program's weight.
      *   **Sufficient Answer:** "Yes" if actuarial score is low/medium *and* no specific, credible threat intelligence exists.
      *   **Stop Rule:** If **NO**, recommend **DENIAL**. (Desert satisfaction does not justify releasing a clear danger).

  #### Phase 3: The Evidence Segregation Check (5 Minutes)
  *Goal: Prevent "Trading" of currencies.*

  3.  **Question:** Are we using evidence of rehabilitation to lower the Desert Floor?
      *   **Test:** Look at the "Remorse" evidence.
      *   **Strategic Remorse Indicator:** Did the expression of guilt coincide with a review date? Was it contingent on receiving a benefit?
      *   **Costly Signaling Indicator:** Did the inmate admit fault when it offered no procedural advantage (e.g., during initial intake vs. parole hearing)?
      *   **Rule:** Therapy and remorse count *only* for Phase 2 (Risk). They count *zero* for Phase 1 (Desert).
      *   **Judgment Call:** Distinguishing strategic vs. costly signaling without psychological expertise. Rely on timeline discrepancies.

  #### Phase 4: Conflict Resolution & Chair Discretion (5 Minutes)
  *Goal: Handle cases where Phase 1 and Phase 2 diverge or intuition resists the output.*

  4.  **Question:** Do Phase 1 and Phase 2 align?
      *   **If Both YES:** Recommend **GRANT**.
      *   **If Both NO:** Recommend **DENIAL**.
      *   **If Conflict (Desert YES / Risk NO):** Recommend **DENIAL**. (Safety trumps debt).
      *   **If Conflict (Desert NO / Risk YES):** Recommend **DENIAL**. (Debt trumps safety *in this specific protocol* to prevent category error, unless statutory emergency release applies).
      *   **Chair's Note:** If the recommendation conflicts with board intuition (e.g., granting to an unrepentant but low-risk inmate), the written justification must explicitly state: *"This decision is based on risk management, not moral absolution."*

  ***

  ### Systematic Misfire Note
  **Where this procedure fails:** The IP will systematically misfire in cases where the *purpose* of incarceration is explicitly moral education rather than risk management or retribution. If the state's penal goal is to "make citizens better," releasing a low-risk, high-desert inmate who remains morally unrepentant (Case C) undermines the institution's expressive function. The procedure treats the prison as a warehouse and a debt collector, not a school. It cannot settle questions of *civic restoration*.

  ***

  ### Case Applications

  #### Case A: The Reformed Violent Offender
  *   **Profile:** 15 years into a 20-year sentence for aggravated assault (high culpability). Completed all therapy, risk score dropped from High to Low. Board suspects remorse is performative (timed with hearing).
  *   **Phase 1 (Desert):** **NO.** 15 years is below the 20-year proportionate term for high-culpability violence. Therapy does not reduce the original debt.
  *   **Phase 2 (Risk):** **YES.** Risk is low.
  *   **Phase 3 (Segregation):** Remorse flagged as strategic. Therapy applied only to Risk, not Desert.
  *   **Phase 4 (Conflict):** Desert NO / Risk YES. Protocol mandates **DENIAL**.
  *   **Analysis:** This denies reduction to a reformed individual. It adheres to the principle that moral transformation does not erase past culpability.

  #### Case B: The Uncooperative Property Offender
  *   **Profile:** 3 years into a 5-year sentence for low-level fraud (low culpability). Refused all cognitive behavioral programming. Risk score is Low.
  *   **Phase 1 (Desert):** **YES.** 3 years is proportionate for low-level non-violent fraud; statutory minimums met.
  *   **Phase 2 (Risk):** **YES.** Low risk despite programming refusal (flagged as *Non-Compliant but Low Risk*).
  *   **Phase 3 (Segregation):** Refusal does not inflate Risk score absent specific dynamic factors.
  *   **Phase 4 (Conflict):** Both YES. Protocol mandates **GRANT**.
  *   **Analysis:** Intuition may want to punish the refusal, but the procedure isolates refusal from risk if data shows safety.

  #### Case C: The Aging Long-Term Inmate
  *   **Profile:** 25 years into a life review for murder. Culpability was high, but 25 years is deemed to satisfy the Desert Floor by board precedent. Risk score is Low, but solely due to being 68 years old ("Aging Out"). No attitudinal change; remains hostile and unrepentant.
  *   **Phase 1 (Desert):** **YES.** Time served meets the retributive threshold.
  *   **Phase 2 (Risk):** **YES.** Risk is low (flagged as *Biological Risk Reduction*).
  *   **Phase 3 (Segregation):** Lack of remorse is noted but irrelevant to Risk if physical capacity for violence is negligible.
  *   **Phase 4 (Conflict):** Both YES. Protocol mandates **GRANT**.
  *   **Unwelcome Verdict:** This is the recommendation you will likely resist. Intuition suggests keeping an unrepentant murderer incarcerated as a moral statement. The procedure forces a **GRANT** because the category error (holding them for *character* rather than *risk* or *debt*) is explicitly forbidden. The written justification must admit: *"We are releasing a dangerous character because he is no longer a dangerous physical risk."*

  ***

  Verdict: This procedure cannot resolve the tension between managing physical safety and satisfying the societal demand for moral redemption.
