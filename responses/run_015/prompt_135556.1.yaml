  # HANDOUT: THE BOUNDARY PROBLEM DIAGNOSTIC
  **Case Study: The Estuary Authority**
  *Context:* The Authority governs flood control and water allocation across a river delta. Its decisions bind resident citizens of the delta districts.
  *Groups:* Resident Citizens; Long-term Non-citizen Residents (15 years, no citizenship route); Upstream Farmers (outside jurisdiction, irrigation cut); Downstream Foreign City (outside country, absorbs surge); Resident Children (<16); Potential Migrants (move only if levee built); Future Generations (50 years hence); Secessionist District; Short-term Traveller (1 week).

  **Instructions:** Read each claim below. Answer **YES** (Agree) or **NO** (Disagree). Follow the arrow to your next question or final classification.

  1.  **The Downstream Foreign City Claim:** "The downstream foreign city must have a vote because the spillway decision floods their streets, even though Authority officers cannot arrest their mayor."
      *   **YES** → Go to 2.
      *   **NO** → Go to 5.

  2.  **The Upstream Farmers Claim:** "The upstream farmers must be included because their irrigation is cut, even if the Delta residents lose far more property value."
      *   **YES** → **LEAF A: All Affected Interests**
      *   **NO** → Go to 3.

  3.  **The Threshold Claim:** "The Authority itself decides which outside effects are significant enough to grant a vote."
      *   **YES** → **LEAF B: Self-Determining Boundary**
      *   **NO** → Go to 4.

  4.  **The Objective Standard Claim:** "There is an objective standard for 'significant effect' independent of the Authority's say-so."
      *   **YES** → **LEAF C: Threshold Affectedness**
      *   **NO** → **LEAF A: All Affected Interests**

  5.  **The Traveller Claim:** "The short-term traveller must vote on local laws because police can arrest them, even though they can leave next week."
      *   **YES** → Go to 6.
      *   **NO** → Go to 7.

  6.  **The Competence Claim:** "Resident children under sixteen should be excluded from voting even if they are coerced, because they lack decision-making capacity."
      *   **YES** → **LEAF D: Competence-Restricted Demos**
      *   **NO** → **LEAF E: All Subjected Principle**

  7.  **The Captivity Claim:** "Long-term non-citizen residents must vote because they cannot afford to leave, even if the traveller is excluded."
      *   **YES** → **LEAF F: Captive-Constituency Principle**
      *   **NO** → Go to 8.

  8.  **The Membership Claim:** "Only current citizen members should decide who gets to vote in the next election, even if this excludes new residents."
      *   **YES** → **LEAF G: Closed Citizenism**
      *   **NO** → Go to 9.

  9.  **The Justification Claim:** "Including the Long-term Non-citizen Residents is required because exclusion violates their dignity, not because it improves flood policy."
      *   **YES** → Go to 10.
      *   **NO** → **LEAF H: Instrumental/Epistemic Demos**

  10. **The Relational Claim:** "The secessionist district must be allowed to vote on staying, not because they are affected, but because excluding them treats them as subjects rather than partners."
      *   **YES** → **LEAF I: Relational Test**
      *   **NO** → **LEAF J: Unnamed (Status Quo Contractualism)**

  ***

  ## LEAF DESCRIPTIONS & AWKWARD COMMITMENTS

  *   **Leaf A (All Affected Interests):** You must grant voting rights to anyone whose property value changes by a dollar.
  *   **Leaf B (Self-Determining Boundary):** You allow the group to define itself, risking the permanent exclusion of outsiders by insiders.
  *   **Leaf C (Threshold Affectedness):** You must empower an external arbiter to measure the significance of harms across borders.
  *   **Leaf D (Competence-Restricted Demos):** You must deny voting rights to a taxed sixteen-year-old worker.
  *   **Leaf E (All Subjected Principle):** You must grant voting rights to a tourist arrested for jaywalking.
  *   **Leaf F (Captive-Constituency):** You must grant voting rights to a permanent resident who hates the country but cannot afford to leave.
  *   **Leaf G (Closed Citizenism):** You must allow current voters to permanently freeze out new residents.
  *   **Leaf H (Instrumental/Epistemic):** You must exclude a group if their participation lowers the average quality of the decision.
  *   **Leaf I (Relational Test):** You must include actors whose inclusion changes no outcome and who suffer no material harm.
  *   **Leaf J (Unnamed):** You rely on existing legal borders without a moral justification for why those borders exist.

  ***

  # INSTRUCTOR NOTE: RUNNING THE SORTING QUIZ

  **Procedure:**
  1.  Distribute the handout. Give students 5 minutes to trace their path through the 10 claims.
  2.  Ask students to announce their Leaf letter. Record the distribution on the board.
  3.  **Debrief:** Do not ask "Which principle is correct?" Ask "Which awkward commitment are you willing to bite?" Focus on the trade-offs revealed by the Leaves (e.g., Leaf A vs. Leaf E on the Traveller).

  **Principle Placement Analysis:**
  *   **Captive-Constituency Principle:** This occupies **Leaf F**. In standard literature, this cell is often empty because views usually collapse into either the All Subjected Principle (Leaf E, where coercion includes the traveller) or Closed Citizenism (Leaf G, where exit cost is ignored). It occupies this cell because it isolates *exit cost* as the sole criterion, distinct from coercion or membership. It is stable but unattractive to those who view voting as tied to community membership rather than entrapment.
  *   **Relational Test:** This occupies **Leaf I**. It risks collapsing into **Leaf H (Instrumental)** if "being wronged" is interpreted as "bad outcomes," or **Leaf A** if "wronged" implies "affected." It remains distinct only if the wrong is purely procedural (status-based) irrespective of outcome impact. This cell is rarely occupied because it requires justifying inclusion even when it is instrumentally useless and causally irrelevant.

  **Known Limitations & Indistinguishabilities:**
  *   **Leaf A (Affectedness) vs. Leaf E (Coercion):** This tree separates them cleanly on the Downstream City (A includes, E excludes) and the Traveller (A excludes, E includes). However, they cannot be separated on **Long-term Non-citizen Residents**, as both principles include them. If a student includes both the City and the Traveller, their position is incoherent under standard theories; force them to choose via a tie-breaking question: "If you must exclude one to save the system, do you drop the Foreign City or the Traveller?"
  *   **Leaf B (Self-Determination) vs. Leaf G (Closed Citizenism):** These often collapse. Leaf B asks *who* decides the boundary; Leaf G asks *what* the boundary is. If the current demos decides (B), they usually choose closure (G). Treat Leaf B as a procedural meta-rule that typically results in Leaf G.
  *   **Regress Problem:** Leaf B contains a logical regress (who decides who decides?). If students land here, press them on whether the initial boundary is arbitrary.

  **Scoring Key Logic:**
  *   **Q1 YES** path leads to Affectedness variants (A, B, C).
  *   **Q1 NO** path leads to Subjection/Membership variants (D, E, F, G, H, I, J).
  *   **Q4/Q9** are tie-breakers for vague commitments; push students to choose Yes/No to force a leaf.
  *   **Incoherent Patterns:** If a student answers Q1=YES (City included) and Q5=YES (Traveller included), they hold an "All Affected + All Subjected" hybrid. Assign **Leaf A** but note the inconsistency regarding the Traveller (usually excluded under Affectedness).
