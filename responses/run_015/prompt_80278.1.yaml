answer: |-
  In his first life, Arjun voluntarily embezzles funds from a charity, causing significant harm to beneficiaries, and dies shortly after without repentance or restitution. In his second life, he is reborn as Priya, who possesses no memory of Arjun's actions, shares no psychological continuity or character traits with him, and would rationally regard Arjun as a distinct person. Priya suffers a financial ruin precisely equivalent to the harm Arjun caused. The causal chain from Arjun's intentional action to Priya's suffering is mechanistically complete and unbroken according to the laws of karma; the latent potential of the act has ripened exactly as prescribed.

  However, Priya lacks any first-personal connection to the agent who committed the embezzlement. She cannot remember the choice, does not identify with the intentions, and possesses no psychological traits formed by that past agency. While the causal lineage is intact, the moral lineage required for retributive desert is severed by the absence of memory and psychological continuity. The suffering arrives with causal necessity, but the subject of the suffering lacks the specific identity conditions typically required to deserve punishment for another's voluntary choices.

  ### Analysis of the Readings

  **Impersonal Causal Reading:** This reading asserts that karma operates like a natural law (e.g., gravity or thermodynamics) rather than a judicial system. On this view, the scenario is perfectly coherent: an action generated a causal potential that must ripen, regardless of the psychological state of the bearer at the time of ripening. The focus is on the continuity of the *stream* (santana), not the continuity of the *person*. Because the causal chain is unbroken, the suffering is explained fully without invoking moral justification.

  **Moral Desert Reading:** This reading asserts that suffering is a justified recompense for moral wrongdoing. On this view, the scenario fails because standard conditions for desert—specifically psychological continuity and memory—are not met. Punishing Priya for Arjun's crime is analogous to punishing a twin sibling for the other's actions; while they may be biologically or causally linked, the moral agency does not transfer. Without memory or identification with the past agent, Priya cannot meaningfully "own" the debt, rendering the suffering unjust rather than deserved.

  **Feature Doing the Work:** The critical feature is **psychological discontinuity (memory loss)** between lives. This isolates causation from desert because causal laws can bridge gaps in consciousness (a seed does not need to remember being a plant), whereas moral desert typically requires the subject to identify with the agent of the past action.

  **If Removed:** If Priya retained full memory of Arjun's life and recognized his intentions as her own, the desert reading would align with the causal reading. The psychological continuity would satisfy the condition for moral ownership, making the suffering appear both causally determined and morally deserved.

  ### Scholarly Consensus vs. Contested Interpretations

  **Settled Consensus:** Scholars of Indian philosophy generally agree that karma is fundamentally a theory of **causal continuity** across lives embedded within a soteriological framework. There is consensus that classical texts (across Hindu, Buddhist, and Jain traditions) posit a mechanism where intentional actions (karma) produce future results (phala) that condition rebirth. It is also settled that most classical systems acknowledge the typical lack of memory of past lives for ordinary beings.

  **Genuinely Contested:** What remains vigorously debated is whether this causal mechanism constitutes **moral justice** in the Western sense of "desert."
  *   **Natural Law vs. Moral Justice:** Some scholars (e.g., Whitley Kaufman) argue that without memory, karma cannot function as retributive justice, suggesting the classical texts support a naturalistic causal law rather than a moral desert theory. Others (e.g., Bruce Reichenbach) argue that the continuity of the karmic stream is sufficient for moral responsibility, even without memory.
  *   **Textual Emphasis:** There is no consensus on whether the earliest texts prioritize the *mechanical* aspect of karma (Mīmāṃsā emphasis on ritual efficacy) or the *ethical* aspect (Buddhist emphasis on intention/cetana). Consequently, presenting karma definitively as a theory of "moral desert" is an interpretive stance, not a settled philological fact.
