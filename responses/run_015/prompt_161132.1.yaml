prompt: |-
  I manage a three-person outreach team at a city benefits-access office, and most weeks we send short letters, texts, and phone scripts to residents who appear eligible for Medicaid, SNAP, or a utility-arrearage program but haven't enrolled. The decisions I need help with come up constantly — we produce roughly forty message variants a quarter, each reviewed in a single twenty-minute slot by two staff members with no philosophy or behavioral-science training, with me signing off and anything contested going to our director. Because our funder audits a sample of these messages and asks for the reasoning, whatever procedure we use has to end in a short written rationale, and it has to degrade gracefully: we usually have no A/B test, no idea why an earlier message worked, and very little information about the individual recipient's actual circumstances, literacy, or stress level. A disagreement last month made this concrete for me. We sent a letter saying that neighbors in the recipient's ZIP code had already renewed and that they should confirm by Friday to keep their coverage — the deadline was invented and there is no coverage to lose, since the letter goes to people who were never enrolled. My colleague thinks this is obviously fine because it moves people into benefits they're entitled to and that we know are good for them; I think something is wrong with it that isn't captured by "does it work" or "is anyone lied to," and I'd rather have a procedure than keep having this argument.

  Reading around on my own, the best core idea I've found is that persuasion engages the target's reasons while manipulation somehow bypasses or subverts them — but I can't hand that to my staff, because the hard question in each case is precisely whether a given technique is tracking the recipient's reasons or going around them. The operational version I've been toying with is a kind of flip test: if the program were mildly bad for this particular resident, or if their own reasons genuinely pointed against enrolling, would the same technique still push them to enroll anyway? A deadline and a social-proof claim would still work in that flipped case, so on my test they aren't tracking reasons; a sentence explaining that the program covers a specific drug the recipient is taking would stop working, so it is. I'm not confident this is the right test rather than a proxy that mostly tracks deception or the sheer effectiveness of the technique, and I'd like you to keep it if it survives and replace it with something better if it doesn't. Please write my team a decision procedure built on whatever the philosophy of this distinction actually supports — ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no and sends the message back for redrafting, and where it explicitly hands the decision to a person because the remaining question is one of values rather than facts (for instance, whether enrolling people in benefits they're entitled to can justify a means we've already classified as manipulative). It has to be runnable in twenty minutes by a non-specialist, so any term it uses needs an operational test attached rather than a definition — give me a check for "bypasses the recipient's reasons" that doesn't presuppose the answer. It also has to say what to do when a step can't be answered at all, as will often happen when we know almost nothing about the recipient. Please tell me which distinctions have to survive the simplification and which you dropped as unusable at our level, and be explicit about which steps are judgment calls dressed up as procedure.

  Run it on four live cases and show the work: (1) the invented-deadline social-proof letter above; (2) a reply card on which "yes, enroll me" is pre-checked, so that doing nothing enrolls you; (3) a phone script that opens with what the household loses by not enrolling and states a funding deadline that is genuinely true — I expect the procedure to tell me something here that I will not like, and I'd rather see that than have it quietly tailored to spare my current practice; and (4) a case where the recipient is an eighty-year-old with low literacy and probable mild cognitive impairment, where the procedure should either give an answer or stop and explain why it can't. Please don't give me a literature review, citations, or reading suggestions; I have no library access and only want the operationalized procedure, worked through, plus an honest final note on what the procedure cannot settle and where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Manager of a 3-person outreach team at a city benefits-access office.
      *   **Task:** Create a decision procedure to distinguish between *persuasion* (engaging reasons) and *manipulation* (bypassing/subverting reasons) for outreach messages (letters, texts, scripts).
      *   **Constraints:**
          *   Must be runnable in ~20 minutes by non-specialists.
          *   Must produce a short written rationale for auditors.
          *   Must degrade gracefully (handle lack of data/A/B testing/recipient info).
          *   Must handle value judgments explicitly (kick up to humans when facts aren't enough).
          *   Must operationalize terms (no abstract definitions without tests).
          *   Must evaluate the user's proposed "flip test."
          *   Must run on 4 specific live cases (Invented deadline/social proof, Pre-checked card, Loss aversion/True deadline, Vulnerable recipient).
          *   No literature review/citations.
          *   Must be honest about limitations/misfires.

  2.  **Evaluate the User's "Flip Test":**
      *   *Idea:* If the program were bad or the recipient had reasons *not* to enroll, would the technique still work? If yes -> Manipulation. If no -> Persuasion.
      *   *Critique:* It's a strong heuristic, but hard to run without knowing the recipient's reasons. In a low-info environment (which the user describes), we often *don't* know if they have reasons against.
      *   *Refinement:* We need to shift from "Would it work?" (counterfactual effectiveness) to "Does the message *supply* the reason or *exploit* a bias?"
      *   *Decision:* Keep the spirit (counterfactual resistance) but operationalize it as "The Substitution Test." Instead of asking if it *would* work, ask if the mechanism of action relies on a fact about the *program* or a fact about the *psychology*.

  3.  **Develop the Decision Procedure (The "Reason-Tracking Protocol"):**
      *   *Goal:* Distinguish persuasion (reason-tracking) from manipulation (reason-bypassing).
      *   *Philosophy Base:* Broadly Kantian/Contractualist (treat agents as ends, not means) + Behavioral Ethics (nudges vs. sludges).
      *   *Structure:* Ordered questions. Stop if "No" (redraft) or "Unknowable" (escalate).
      *   *Key Operational Checks:*
          1.  **Truth Check:** Is the claim factually accurate? (Easy filter).
          2.  **Relevance Check:** Does the prompt connect to a benefit/consequence of the *program* itself?
          3.  **The Counterfactual Resistance Test (Refined Flip Test):** If the recipient had a valid reason *not* to enroll (e.g., already covered, stigma, complexity), would this message override that reason using the *same* lever?
          4.  **Agency Check:** Does the default action require active choice or passive drift?
          5.  **Vulnerability Check:** Is the target population known to have diminished capacity?

      *   *Handling "Unknowable":* Since they lack recipient data, the procedure must assume *potential* vulnerability or *potential* conflicting reasons. If the message works *regardless* of the recipient's actual situation, it's suspect.

      *   *Value Handoff:* If a technique is manipulative but effective for a "good" end, that's a policy decision, not a messaging decision. The procedure must flag this for the Director.

  4.  **Drafting the Steps (Iterative Refinement for Speed):**
      *   *Step 1: Factuality.* (Pass/Fail).
      *   *Step 2: The "Because" Clause.* Can you finish the sentence "You should do this because..." with a program fact, or does it end with a psychological pressure point?
      *   *Step 3: The "Bad Fit" Simulation.* (The Flip Test). Imagine a person who *shouldn't* enroll. Does the message still push them?
      *   *Step 4: Friction & Defaults.* Is the easy path the enrollment path?
      *   *Step 5: The Value Escalation.* If it fails 2, 3, or 4, is the benefit high enough to justify it? (Director decision).

  5.  **Running the Four Cases:**

      *   *Case 1: Invented Deadline + Social Proof.*
          *   Truth: Fail (Invented deadline).
          *   Reason-Tracking: Fail (Deadline creates urgency not tied to program rules).
          *   Outcome: Reject.

      *   *Case 2: Pre-checked "Yes".*
          *   Truth: Pass (Technically).
          *   Reason-Tracking: Fail (Default bias bypasses active choice).
          *   Bad Fit: Pass (Would enroll someone ineligible if not caught elsewhere).
          *   Outcome: Flag for Director (Paternalism vs. Autonomy).

      *   *Case 3: Loss Aversion + True Deadline.*
          *   Truth: Pass.
          *   Reason-Tracking: Mixed. Loss aversion is a bias, but the deadline is real.
          *   Bad Fit: If they don't need it, loss framing still scares them.
          *   Outcome: Caution/Redraft to focus on gain rather than loss.

      *   *Case 4: 80-year-old, low literacy, cognitive impairment.*
          *   Vulnerability Check: High.
          *   Standard Procedure: Likely fails because we can't assume reason-tracking capacity.
          *   Outcome: Escalate to Director + Guardian/Advocate protocol.

  6.  **Refining the Output:**
      *   *Tone:* Professional, direct, operational. No academic fluff.
      *   *Format:* Clear headers, checklists, "Stop/Go" signals.
      *   *Honesty:* Explicitly state where the procedure is just codified judgment.
      *   *Limitations:* Acknowledge that "Reasons" are internal states we can't see, so we are proxying.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Bad Fit" test too abstract for a 20-minute meeting?
      *   *Fix:* Make it a specific prompt: "Imagine a neighbor who already has private insurance. Does this message still make them feel they must act?"
      *   *Critique:* The user wants to know what happens when we *can't* answer.
      *   *Fix:* Add an "Unknown" path that defaults to "Escalate" rather than "Assume Safe."
      *   *Critique:* Case 3 (Loss Aversion) is tricky. Loss aversion is standard behavioral science. Is it manipulation?
      *   *Fix:* Distinguish between *real* loss (missing a deadline) and *framed* loss (missing out on a gain). If the deadline is real, it's a reason. If the framing exaggerates the pain, it's manipulation. I need to be hard on this as requested ("tell me something I will not like").

  8.  **Final Polish:** Check against all constraints. 20 mins? Yes. Non-specialist? Yes. Written rationale output? Yes. 4 Cases worked? Yes. Limitations noted? Yes.

      *(Self-Correction on Case 3)*: The prompt says the funding deadline is *genuinely true*. The issue is the *framing* (Loss vs Gain). Behavioral science suggests loss framing is more effective but potentially more coercive/anxiety-inducing. The procedure should flag high-anxiety inducement as a reason-bypasser if it triggers action without understanding.

      *(Self-Correction on Case 2)*: Pre-checked boxes are often legally regulated. I should note that, but focus on the ethical procedure.

      *(Final check on the "Flip Test")*: The user's flip test is actually quite good. I will adopt it but rename it "The Counterfactual Resistance Test" and give it concrete steps.

      *(Final check on "Reasons")*: We can't know reasons. So we test for *Type of Reason*. Program Reasons (eligibility, benefit) vs. Psychological Reasons (fear, conformity, inertia).

      Let's assemble the document.

      *Structure:*
      1. Introduction (Purpose & Scope).
      2. The Procedure (5 Steps).
      3. The Written Rationale Template.
      4. The Four Cases (Worked).
      5. Limitations & Misfires.

      *Wait, one constraint:* "Tell me which distinctions have to survive the simplification and which you dropped." I need to add a section on this.
      *Another constraint:* "Be explicit about which steps are judgment calls dressed up as procedure." I need to highlight this in the notes.

      *Okay, ready to write.*
answer: |-
  # The Reason-Tracking Protocol (RTP)
  **Version 1.0 for Benefits Outreach**

  **Purpose:** To distinguish between *persuasion* (engaging a resident's capacity to choose based on relevant facts) and *manipulation* (bypassing that capacity using psychological leverage unrelated to the benefit's value).
  **Time Budget:** 20 Minutes.
  **Users:** Two staff reviewers + Manager (sign-off).
  **Output:** A completed checklist + a 3-sentence Rationale for auditors.

  ---

  ## Part 1: The Procedure

  Do not skip steps. If a step returns a **STOP**, the message must be redrafted. If a step returns **UNKNOWN**, proceed to Step 5 (Value Escalation).

  ### Step 1: The Truth Filter (Fact Check)
  **Question:** Is every claim in the message factually verifiable against current program rules?
  *   **Operational Test:** Can you point to a specific policy document or statute that proves the sentence?
  *   **Pass:** Yes, all claims are verified.
  *   **Fail:** No claim is invented, exaggerated, or implied (e.g., fake deadlines, fake neighbors).
  *   **Action:** If **Fail**, **STOP**. Redraft. (No rationale needed; this is compliance).

  ### Step 2: The "Because" Test (Reason Relevance)
  **Question:** Does the primary motivator in the message refer to a *consequence of the program* or a *psychological pressure*?
  *   **Operational Test:** Complete this sentence: "The message asks you to act because ______."
      *   *Type A (Program Fact):* "...you will get food money/health coverage."
      *   *Type B (Psychological Pressure):* "...you will miss out/your neighbors did/it's the default."
  *   **Pass:** The blank is filled primarily by Type A.
  *   **Fail:** The blank is filled primarily by Type B.
  *   **Action:** If **Fail**, mark for **Step 5**. (Do not stop yet; some Type B is common, but it must be justified).

  ### Step 3: The Counterfactual Resistance Test (Your "Flip Test")
  **Question:** If the recipient had a valid reason *not* to enroll, would this message override it anyway?
  *   **Operational Test:** Imagine a specific neighbor who is *ineligible* or *already covered* but receives this message by error.
      *   Does the message make them feel they *must* act to avoid harm or social shame?
      *   Does the message rely on their inertia (e.g., pre-checked boxes) to enroll them despite their lack of intent?
  *   **Pass:** The message would likely confuse them or be ignored (it requires active buy-in).
  *   **Fail:** The message would scare them or trick them into acting against their own interest (it works via pressure or inertia).
  *   **Action:** If **Fail**, mark for **Step 5**.

  ### Step 4: The Vulnerability Screen
  **Question:** Do we know anything about the recipient's capacity to process this?
  *   **Operational Test:** Check the data tags. Is the recipient flagged for age (65+), disability, limited English, or prior non-response?
  *   **Pass:** No flags, or message is simplified for general access.
  *   **Fail:** Flags exist, and the message uses complex framing (deadlines, loss aversion, defaults).
  *   **Action:** If **Fail**, **STOP**. Escalate to Director for case-specific review.

  ### Step 5: Value Escalation (The Human Handoff)
  **Trigger:** If Step 2 or Step 3 was marked **Fail**, but Step 1 was **Pass**.
  **Question:** Is the benefit high enough to justify using a psychological lever instead of a program reason?
  *   **Operational Test:** This is not a fact check. This is a policy decision.
  *   **Action:** Send to Director.
  *   **Required Input:** "We identified this technique as reason-bypassing (Step 2/3). We recommend it only if the risk of non-enrollment outweighs the risk of coercing a willing participant."

  ---

  ## Part 2: The Written Rationale Template
  *For Auditor Files. Fill in the brackets.*

  > "This message was reviewed using the Reason-Tracking Protocol. It [Passed/Failed] the Truth Filter. The primary motivator was classified as [Program Fact / Psychological Pressure]. We determined that a recipient with reasons not to enroll [Would / Would Not] be overridden by this technique. [If Escalated: The Director authorized this technique based on the high value of enrollment vs. autonomy risk]. Reasoning: [One sentence on why this specific lever was chosen, e.g., 'Deadline is statutory, not invented']."

  ---

  ## Part 3: Worked Cases

  ### Case 1: Invented Deadline + Social Proof
  *Message: "Neighbors in your ZIP renewed. Confirm by Friday or lose coverage." (Recipient never enrolled).*

  *   **Step 1 (Truth):** **FAIL.** "Lose coverage" is false (never had it). "Friday" is invented.
  *   **Action:** **STOP.** Redraft.
  *   **Rationale:** "Message failed Truth Filter. Claims regarding coverage loss and deadlines are factually incorrect per program policy."
  *   **Note:** This is the easiest call. It violates compliance, not just ethics.

  ### Case 2: Pre-Checked "Yes" Reply Card
  *Message: "Return this card to enroll." (The "Yes" box is already checked).*

  *   **Step 1 (Truth):** **PASS.** Returning the card does enroll you.
  *   **Step 2 (Because):** **FAIL.** Motivator is inertia (Type B). "Act because it's already done" vs "Act because you need benefits."
  *   **Step 3 (Resistance):** **FAIL.** If I didn't want this, my inertia enrolls me anyway. It overrides resistance via friction reduction.
  *   **Step 4 (Vulnerability):** **UNKNOWN.** We don't know the recipient.
  *   **Step 5 (Escalation):** **REQUIRED.**
  *   **Decision:** Send to Director.
  *   **Rationale:** "Message passed Truth Filter but failed Counterfactual Resistance. Enrollment relies on default bias rather than active choice. Director approval required to weigh enrollment rates against autonomy."

  ### Case 3: Loss Aversion + True Funding Deadline
  *Message: "If you don't apply by [Real Date], your household loses access to this year's funding."

  *   **Step 1 (Truth):** **PASS.** Deadline is real.
  *   **Step 2 (Because):** **MIXED.** It cites a program fact (funding ends), but frames it as a *loss* rather than a *gain*.
  *   **Step 3 (Resistance):** **FAIL (Partial).** If I don't need the money, fear of loss still pushes me to act. It bypasses the reason "I don't need this" with the emotion "I hate losing."
  *   **Step 4 (Vulnerability):** **UNKNOWN.**
  *   **Step 5 (Escalation):** **RECOMMENDED.**
  *   **The Uncomfortable Truth:** This procedure flags standard behavioral science (loss aversion) as manipulative. Even with a true deadline, framing the outcome as a *loss* targets anxiety, not reasoning.
  *   **Rationale:** "Message passed Truth Filter. However, framing relies on loss aversion which may trigger action regardless of need. Director to decide if urgency justifies anxiety induction."

  ### Case 4: 80-Year-Old, Low Literacy, Cognitive Impairment
  *Message: Standard outreach letter.

  *   **Step 1 (Truth):** **PASS.**
  *   **Step 2 (Because):** **PASS.** (Assuming standard text).
  *   **Step 3 (Resistance):** **UNKNOWN.** We cannot simulate the reasoning of someone with cognitive impairment using a standard checklist.
  *   **Step 4 (Vulnerability):** **FAIL.** Data tags indicate high vulnerability.
  *   **Action:** **STOP.** Escalate to Director + Case Worker.
  *   **Rationale:** "Message halted at Vulnerability Screen. Recipient profile indicates diminished capacity to process standard outreach. Requires individualized assessment or guardian contact."

  ---

  ## Part 4: What Survived and What Was Dropped

  ### Distinctions That Survived
  1.  **Truth vs. Pressure:** We kept the hard line on factual accuracy. This is the only objective metric you have.
  2.  **Program Reasons vs. Psychological Levers:** We kept the distinction between "This helps you" (Reason) and "Everyone else did this" (Lever).
  3.  **The Counterfactual:** Your "Flip Test" survived but was operationalized. We cannot know *actual* reasons, so we test against a *hypothetical* reasonable objection (e.g., "I don't need this"). If the message crushes that objection without addressing it, it's manipulation.

  ### Distinctions Dropped (Unusable at Your Level)
  1.  **Intent:** We dropped "Did we *mean* to manipulate?" Intent is invisible. We judge the *mechanism*, not the heart.
  2.  **Outcome Success:** We dropped "Did it work?" A lie can work. A manipulative nudge can work. Effectiveness is not a proxy for ethics in this protocol.
  3.  **Degree of Harm:** We dropped trying to calculate "How much stress does this cause?" You lack the data. We default to "If it uses pressure, flag it," rather than "If it uses *too much* pressure."

  ### Explicit Judgment Calls Dressed as Procedure
  1.  **Step 2 (Type A vs. Type B):** Classifying a motivator is subjective. Is "Your neighbors enrolled" social proof (Pressure) or information (Fact)? I have classified it as **Pressure** in this protocol because it appeals to conformity, not individual need. Your team must agree to this definition.
  2.  **Step 5 (Value Escalation):** This is pure politics. The procedure cannot tell you if "Getting people food" is worth "Tricking them slightly." It only forces you to admit you are making that trade-off.
  3.  **Step 4 (Vulnerability):** Deciding what constitutes "High Vulnerability" based on data tags is a policy call. I have set the threshold low (65+ or disability flag) to force caution.

  ---

  ## Part 5: Limitations & Misfires (The Honest Note)

  **1. The "Reasons" Black Box:**
  This procedure assumes recipients *have* reasons. In high-stress poverty contexts, "reasons" are often obscured by survival mode. A message might be "manipulative" by this test but actually *helpful* to someone too overwhelmed to process a "Program Fact" letter. This protocol will flag helpful simplifications as manipulative. **Mitigation:** Use Step 5 to authorize "Simplification Nudges" explicitly.

  **2. The False Negative on Loss Aversion:**
  As seen in Case 3, this protocol treats *all* loss framing as suspect. Behavioral science suggests loss framing is often the *only* thing that works for busy people. This protocol will slow down your most effective campaigns. **Mitigation:** Accept that Step 5 will become a rubber stamp for "True Deadline/Loss" messages, but ensure the Director signs the rationale so the accountability is clear.

  **3. The Data Gap:**
  You admitted you know little about the recipient. This protocol forces you to admit that ignorance (Step 4 "Unknown"). This will result in more escalations to the Director. **Mitigation:** If escalations exceed 20% of volume, you must revise your data intake, not the protocol.

  **4. Moral Licensing:**
  There is a risk that using this procedure makes the team feel *too* clean. "We ran the RTP, so it's ethical." This is false. The RTP is a sieve, not a shield. It catches the grossest errors (lies, defaults, vulnerability mismatches). It cannot catch subtle coercion.

  **Final Instruction:**
  When the procedure says **Escalate**, do not view it as a failure of the team. View it as the system correctly identifying that the question is no longer about *messaging*, but about *policy*. Your job is not to solve that value conflict in 20 minutes; your job is to surface it.
