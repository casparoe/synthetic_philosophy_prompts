  So CDT calculates:
  $EU(C) = P(T=C) \cdot 3 + P(T=D) \cdot 0$.
  $EU(D) = P(T=C) \cdot 5 + P(T=D) \cdot 1$.
  Since $5>3$ and $1>0$, D dominates.
  The user's calculation assumes $P(T=C|I=C) = 1$. That is the EDT assumption.
  So the critic is right: Step 4 assumes EDT.
