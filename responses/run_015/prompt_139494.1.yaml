answer: |-
  Subject: Re: The committee stalemate

  You are right that the philosophical rhetoric is often post-hoc dressing for a deeper conflict about the purpose of the committee, but you are wrong that it reduces cleanly to a single exchange-rate parameter. The stalemate is structural because you are actually asking two incompatible questions under one heading: whether the committee exists to maximize aggregate welfare or to ensure no individual is left behind without a justification they could accept.

  Your observation about the exchange rate is pragmatically astute because it captures how the debate actually functions in the room rather than how it looks in a philosophy textbook. When the total benefit of the spread option is clearly higher, as you noted last quarter, the splittists vote for it, which suggests they are not hard deontologists who believe aggregation is forbidden regardless of cost. Instead, they are acting like threshold deontologists or prioritarianists who assign a heavy weight to the baseline condition of the worst-off, only allowing aggregation when the total gain is large enough to overwhelm that weight. However, calling this a single parameter implies that both sides agree on the currency being traded, and that is where the verbal dispute hides a bedrock disagreement. The aggregators treat QALYs as a common currency where one person's gain can compensate for another's loss, while the splittists treat the claims as distinct debts that cannot be offset by third-party gains. When they argue about the distinction between persons, they are not just justifying a weighting parameter; they are denying the legitimacy of the ledger itself. So while you can model their behavior as adjusting a variable, you cannot resolve the conflict by finding the right number, because one side believes the equation is category-error nonsense.

  Your second insight about the waiting room is arguably more diagnostic than the exchange rate observation because it points directly to the mechanism driving the non-aggregation intuition. If the moral weight of the three hundred patients depended solely on their metaphysical separateness, their ability to compare notes should be irrelevant to the calculation, yet your intuition shifts precisely when the social relationship changes. This aligns closely with contractualist accounts like Scanlon's, where the core question is whether a principle can be reasonably rejected by those burdened by it. When the patients are isolated, the burden is private and abstract, but when they are in a waiting room comparing crumbs to a cure, the burden becomes relational and the grounds for reasonable rejection become visceral. This suggests that the splittists on your committee are not necessarily committed to a metaphysical view about the sanctity of individual boundaries so much as a sociological view about fairness as non-domination or equal status. They are worried about the message sent by telling three hundred people that their relief was less important than one child's cure, especially if those three hundred can see the transaction clearly. The intuition isn't just that persons are separate, but that justice requires us to relate to them in ways that don't reduce them to vessels for utility.

  This brings us to your question about whether the committee is supposed to make the world better or be justifiable to each person separately, and the honest answer is that your mandate is likely ambiguous enough to support both interpretations. Hospital ethics committees often operate with a dual mandate that is never fully reconciled: they are stewards of resources who must maximize health outcomes, but they are also moral agents who must maintain public trust and treat patients with equal concern. When the QALYs are equal, the maximizing mandate offers no guidance, so the default falls to the justifiability mandate, which favors the clinic because it spreads the hope. However, the aggregators on your committee are likely focusing on the "make the world better" function, interpreting the donation as a tool to reduce the total amount of suffering in the universe, regardless of how it is distributed. Until the hospital administration clarifies whether the fund is intended for catastrophic rescue or public health improvement, you will remain stuck between these two legitimate but incompatible goals. The philosophy literature hasn't resolved this because it isn't a problem to be solved by reason alone; it is a conflict of values that requires a political decision about what kind of institution you want to be.

  As for whether anything can move the vote, I am pessimistic that philosophical distinctions or empirical data will break the deadlock because the disagreement is not about facts but about the fundamental aim of the allocation. Empirical work on intuitions might confirm that people care about comparison, as you noticed, but that won't tell the committee whether they should care. A formal result might show that no voting system satisfies certain fairness axioms, but that just confirms the structural nature of the problem rather than solving it. The only things that typically break this kind of stalemate are external constraints or changes to the choice architecture. If the donation came with a stipulation from the donor that it must be used for pediatric catastrophic care, the aggregators would win by mandate. If the hospital policy prioritized preventing widespread morbidity over rare cures, the splittists would win. Absent that, you might consider procedural solutions like randomization, where you acknowledge the moral parity by rolling dice, though that often feels like an abdication of responsibility to both sides.

  Ultimately, you should probably accept that the four-four vote is a feature rather than a bug of a committee that represents a pluralistic moral community. The stalemate reflects the fact that reasonable people disagree about the weight of individual claims versus the sum of benefits, and forcing a resolution might require a tyranny of one framework over the other. Your hypothesis that the arguments are stories told to dress up different settings of a number is largely correct in practice, but the reason the settings differ is that your colleagues are answering different questions about what morality requires. If you want to move forward, stop trying to convince them that their moral framework is wrong and start asking whether the hospital wants to be in the business of saving lives at any cost or improving life for as many as possible. Until that institutional question is answered, the philosophy will remain a weapon rather than a tool, and the vote will remain stuck.

  Best of luck with the meeting.
