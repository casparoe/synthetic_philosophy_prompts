answer: |-
  # Study Day Activity: The Federation Planning Game

  **Time:** 120 minutes (including break)
  **Participants:** 20 (12 Co-op Managers, 5 Central Planners, 3 Auditors/Facilitators)
  **Materials:**
  *   **Stationery:** A4 paper, clipboards, pens, envelopes (12 per round), sticky notes.
  *   **Cards:** 12 "Shock Cards" per round (see below).
  *   **Forms:** "Production Report" slips (pre-printed with only two fields: *Max Supply* and *Required Input*).
  *   **Tech:** One laptop connected to a projector (for Round 2), running a simple spreadsheet.
  *   **Scoreboard:** Whiteboard to track Federation Points.

  ---

  ## Part 1: Setup & Rules (15 Minutes)

  **1. Roles:**
  *   **Co-op Managers (12):** Sit in a circle. Each represents a worker co-op. They are given a **Private Identity Card** (e.g., "Co-op A: Metalwork", "Co-op B: Assembly").
  *   **Central Planning Group (5):** Sit at a table in the middle. They cannot talk to Managers except via written slips.
  *   **Auditors (3):** One tracks time, one collects slips, one verifies scores.

  **2. The Goal:**
  The Federation needs to produce **Final Goods**.
  *   6 Co-ops are **Upstream** (make Components).
  *   6 Co-ops are **Downstream** (make Final Goods using Components).
  *   **Exchange:** Downstream need Components from Upstream. Upstream need nothing (they use raw materials assumed infinite).
  *   **Success:** The Federation wins if Total Final Goods > 40 units.

  **3. The Narrow Channel:**
  Managers cannot talk to the Centre. They submit one slip per iteration with exactly two numbers:
  1.  **Supply Offer:** How many Components you *promise* to deliver (Upstream) OR How many Final Goods you *promise* to make (Downstream).
  2.  **Resource Request:** How many Components you *need* (Downstream) OR Zero (Upstream).

  **4. The Price Mechanism:**
  *   The Centre sets a **Transfer Price** (e.g., 1 Component = 5 Credits).
  *   **Iteration:**
      1.  Centre announces Price.
      2.  Managers submit slips (Supply/Request).
      3.  Centre sums Total Supply vs. Total Request.
      4.  **Rule:** If Request > Supply, raise Price by 1. If Supply > Request, lower Price by 1.
      5.  Repeat 3 times. On the 4th iteration, the Plan is **Locked**.

  **5. The Incentive Scheme (Round 1 Only):**
  *   **Individual Scoring:** Each Co-op scores points for themselves.
  *   **Formula:** `(Units Actually Produced × 10) + (Unused Requested Inputs × 5) - (Missed Promise Penalty × 20)`.
  *   *Translation:* You want to produce a lot. You want to hoard extra inputs just in case. You *really* want to avoid promising more than you can deliver.
  *   **Winning Co-op:** Gets a box of chocolates.

  **6. Private Information (The Shocks):**
  *   Hand each Manager a sealed **Shock Envelope**. They must not show this to the Centre.
  *   **Examples:**
      *   *Machine Fault:* "Your capacity is reduced by 50%."
      *   *Skill Gap:* "You can only produce integer units (no halves)."
      *   *Quality Issue:* "1 in 4 of your inputs will be rejected."
      *   *Urgency:* "You must produce at least 5 units or score zero."

  ---

  ## Part 2: Round 1 — Manual Planning (30 Minutes)

  1.  **Distribution:** Hand out Shock Envelopes. Managers open them secretly.
  2.  **Iteration 1-3:** The Planning Group calculates totals manually on paper. They announce prices. Managers adjust slips based on their private shocks and their desire to win the chocolate.
      *   *Facilitator Note:* Watch for Managers understating capacity (to avoid penalties) and overstating requests (to hoard). Watch Planners get frustrated by the "noise" in the numbers.
  3.  **Lock & Produce:** After 3 iterations, the Plan is locked. Managers reveal their Shocks and calculate **Actual Production**.
  4.  **Scoring:** Auditors calculate individual scores. Announce the "Winning Co-op."
  5.  **Federation Check:** Sum the Final Goods. (Likely < 40).

  **Break (15 Minutes)**

  ---

  ## Part 3: Round 2 — Mechanical Planning (30 Minutes)

  **Changes:**
  1.  **New Shocks:** Distribute new Shock Envelopes (different mix).
  2.  **Mechanical Centre:** The Facilitator uses the laptop/spreadsheet. Prices update instantly on the screen. No calculation delay.
  3.  **Cooperative Scoring:** **Crucial Change.** Announce: *"For this round, the Federation shares one score. If the Federation hits 40 units, everyone gets a chocolate. If not, no one does."*
      *   *Effect:* This removes the incentive to lie/hoard. Managers are now incentivized to be as accurate as possible to help the group.
  4.  **Process:** Run 3 iterations. Lock. Produce. Reveal Shocks.

  ---

  ## Part 4: Debrief & Mapping (30 Minutes)

  Do not start with theory. Start with their feelings.

  **Step 1: The Experience (10 mins)**
  *   Ask the **Planners:** "In Round 1, how did the numbers feel? Did they match reality?"
  *   Ask the **Managers:** "In Round 1, why did you write the numbers you did? Did anyone write a number they knew was untrue?"
  *   Ask **Both:** "In Round 2, the computer was faster and we were all on the same team. Did the plan balance perfectly? Did we hit the target?"

  **Step 2: Mapping the Objections (15 mins)**
  *Now* you introduce the concepts, mapping them to specific moments in the game.

  | Moment in Game | The Economic Argument | Who said it? |
  | :--- | :--- | :--- |
  | **Round 1 Lying:** Managers understated capacity to avoid the "Missed Promise Penalty" and overstated needs to get "Unused Input" bonuses. | **The Incentive Problem:** When allocations depend on self-reporting, agents game the system. Truth-telling is not rational. | **Mises / Public Choice** |
  | **Round 2 Failure:** Even with honest reporting (Cooperative Score) and fast calculation (Spreadsheet), the plan likely still missed the target or had surpluses/shortages. | **The Knowledge Problem:** The "Shock Cards" contained nuance (quality, skill, specific bottlenecks) that the two-number slip could not capture. The Centre was blind to local reality. | **Hayek** |
  | **Round 1 Planner Stress:** Planners tried to "nudge" prices, but the feedback loop was too slow compared to the changing reality on the floor. | **The Calculation Problem:** Even with perfect data, the iteration takes time. By the time the plan balances, the local conditions (shocks) have changed. | **Lange's Critics** |
  | **Round 2 Spreadsheet:** The spreadsheet worked perfectly *mathematically*, but the *inputs* were still imperfect. | **Simulation vs. Reality:** You can simulate a market equilibrium on paper, but you cannot simulate the discovery of local knowledge. | **Lange vs. Hayek** |

  **Step 3: The Verdict (5 mins)**
  *   Ask: "If we adopt the proposal, which round are we betting on? Round 1 (Real incentives) or Round 2 (Idealized cooperation)?"
  *   Conclusion: The proposal assumes Round 2 behavior (honest, cooperative) but operates in a Round 1 world (individual incentives, private knowledge).

  ---

  ## Facilitator's Notes: Troubleshooting & Limitations

  **1. Predictable Failure Points:**
  *   **Participants "Beat the Game":** In Round 1, Managers might collude to tell the truth to make the Federation look good.
      *   *Fix:* Emphasize the "Winning Co-op" chocolate prize strongly. Remind them: "Your members rely on *your* co-op's score."
  *   **Math Errors:** Planners in Round 1 might add wrong.
      *   *Fix:* Assign one Auditor solely to verify the Planners' sums before announcing prices.
  *   **Round 2 Success:** If Round 2 works perfectly (Target hit), the Knowledge argument looks weak.
      *   *Fix:* Ensure the Shock Cards in Round 2 include "Quality Issues" or "Timing Mismatches" that numbers can't fix. (e.g., "Input arrives too late for production"). This ensures that even with honest numbers, the physical plan fails.

  **2. What This Game Cannot Stage:**
  *   **Innovation:** The game assumes static production functions. It cannot show how central planning stifles *new* methods, because there is no mechanism to propose a new product.
      *   *Statement:* "You will have to tell them: In the game, you made the same thing twice. In reality, co-ops need to innovate. A planning board tends to fund what it understands (last year's plan), not what it doesn't (next year's breakthrough)."
  *   **Consumer Preference:** The game fixes the demand (40 units). It doesn't show the difficulty of knowing *what* consumers want, only how to make a pre-set thing.
      *   *Statement:* "We assumed the Federation knew what was needed. In reality, knowing *what* to make is harder than making it."

  **3. Handling the "But We Are Different" Objection:**
  *   Participants may say: "We are co-ops, we are ethical, we wouldn't lie like in Round 1."
  *   *Response:* "In Round 2, we removed the incentive to lie, and you *still* faced the Knowledge Problem (Shocks). Even with perfect ethics, the Centre could not see your machine breakdown. The question isn't just about honesty; it's about whether a two-number slip can capture the reality of your workshop."

  **4. Closing Thought:**
  End by asking them to draft a "Protocol for Local Autonomy." Instead of "How do we plan centrally?", ask "What minimum information do we actually *need* to share to coordinate without controlling?" This shifts the energy from a stuck debate to a constructive design task.
