answer: |-
  This is a brilliant application of *anekāntavāda* (many-sidedness). In mediation, the goal isn't to find the One Truth (which usually requires a judge), but to create a shared container where both truths can exist without exploding the process.

  The core problem you face is **ontological collision**: Party A treats their interpretation as a fact ("He harassed me"), and Party B treats their interpretation as a fact ("I maintained the property"). When you write a summary that validates one as fact, the other walks out.

  Here is a practical procedure, **The Syādvāda Protocol**, designed to fit your one-hour constraint. It separates *observation* (sensory data), *interpretation* (meaning assigned), and *impact* (emotional/financial result).

  ### The Syādvāda Protocol (60-Minute Workflow)

  **Phase 1: The Intake (15 mins per party, separate)**
  Do not ask "What happened?" Ask these three specific questions to separate fact from perspective.

  1.  **The Sensory Log:** "List the specific events you can recall with date/time. What did you physically see, hear, or receive in writing?"
      *   *Sufficient Answer:* Concrete data points (e.g., "Knock at 2 PM," "Email received," "Handshake").
      *   *Insufficient Answer:* Generalizations (e.g., "He's always bothering me"). *Prompt:* "Give me the last specific time that happened."
  2.  **The Meaning Assignment:** "When that event occurred, what did you understand was happening?"
      *   *Sufficient Answer:* Their internal narrative (e.g., "I understood this as harassment").
      *   *Insufficient Answer:* "It was illegal." *Prompt:* "I'm not asking for the law yet, I'm asking what you thought their intent was."
  3.  **The Impact:** "How did this affect you?"
      *   *Sufficient Answer:* Tangible or emotional cost (e.g., "I couldn't sleep," "I spent $500").

  **Phase 2: The Mapping (15 mins, Mediator only)**
  Take the two sets of answers and map them into three buckets:

  1.  **Convergent Facts:** Both sides agree the event occurred (e.g., "A meeting happened on Tuesday").
  2.  **Divergent Interpretations:** Both agree the event occurred, but disagree on meaning (e.g., "It was a check-in" vs. "It was surveillance").
  3.  **Contradictory Facts:** One says it happened, the other says it did not (e.g., "I gave notice" vs. "I got no notice").

  **Phase 3: The Drafting Rules (15 mins)**
  You must use **Qualified Predication**. Never state a disputed claim as an absolute fact. Use the following syntax:

  *   **For Convergent Facts:** State absolutely. ("Both parties agree a meeting occurred on...")
  *   **For Divergent Interpretations:** Use perspective markers. ("Landlord describes the visit as...", "Tenant experiences the visit as...")
  *   **For Contradictory Facts:** Use existence markers. ("Tenant reports receiving no notice," "Landlord states notice was provided.") *Do not try to solve this in the summary.*

  **Phase 4: The "Hand-Off" Check (15 mins)**
  Read the summary to each party separately before the joint session.
  *   **The Test:** Ask, "Does this capture your experience accurately?"
  *   **The Constraint:** They do not have to agree it is *objective truth*, only that it is *their truth* represented fairly.
  *   **The Walk-Out Prevention:** If they demand you change a qualifier to an absolute (e.g., change "Landlord states" to "Landlord failed"), refuse. Explain: "This document is a map of the dispute, not the verdict. We will navigate the map in the room."

  ***

  ### Case Walkthrough 1: Tenant vs. Landlord
  **The Dispute:** Harassment (17 visits) vs. Maintenance (8 work orders).

  **Phase 1: Intake Data**
  *   **Tenant:**
      *   *Sensory:* Log shows 17 entries of knocking/presence at door. 3 months.
      *   *Meaning:* "This is intimidation. I feel unsafe in my home."
      *   *Impact:* Anxiety, sleep loss, considering moving.
  *   **Landlord:**
      *   *Sensory:* 8 work orders generated for safety inspections/leaks.
      *   *Meaning:* "I am fulfilling my duty to maintain the building."
      *   *Impact:* Frustration at tenant hostility, risk of property damage.

  **Phase 2: Mapping**
  *   **Convergent:** The property requires maintenance. The tenant lives there.
  *   **Divergent:** The *nature* of the interaction. (Maintenance vs. Intrusion).
  *   **Contradictory:** The *frequency/notice*. (17 visits vs. 8 authorized). There is a gap of 9 unaccounted visits.

  **Phase 3: Drafting the Summary (Syādvāda Applied)**
  *Notice how we avoid saying "The landlord harassed the tenant" (Absolute) or "The landlord followed the law" (Absolute).*

  > **Case Summary: [Address]**
  >
  > **Undisputed Context:**
  > Both parties agree the Tenant resides at the address and the Landlord holds responsibility for property maintenance. Both agree interactions occurred between [Date] and [Date].
  >
  > **Tenant's Perspective:**
  > The Tenant reports 17 instances of the Landlord or agents appearing at the unit over three months. From the Tenant's perspective, these visits were unannounced and frequent enough to constitute harassment. The Tenant reports feeling unsafe and experiencing significant stress as a result.
  >
  > **Landlord's Perspective:**
  > The Landlord records 8 specific work orders requiring access during this period. From the Landlord's perspective, these visits were legally required maintenance checks. The Landlord states that proper notice was provided for these authorized entries and views the Tenant's resistance as obstructing necessary repairs.
  >
  > **Areas for Mediation:**
  > 1. There is a discrepancy between the 17 entries logged by the Tenant and the 8 work orders recorded by the Landlord.
  > 2. The parties disagree on whether the notice provided was adequate or received.
  > 3. The parties need to establish a protocol for future access that satisfies the Landlord's maintenance obligations and the Tenant's need for privacy.

  **Why this works:**
  *   It validates the Tenant's *experience* (17 entries, fear) without forcing the Landlord to admit guilt.
  *   It validates the Landlord's *intent* (maintenance, duty) without forcing the Tenant to admit they were wrong to be scared.
  *   The "Gap" (9 visits) is flagged as a mediation issue, not a summary verdict.

  ***

  ### Case Walkthrough 2: Business Partners
  **The Dispute:** Handshake Deal (Binding) vs. Bar Talk (Non-binding).

  **Phase 1: Intake Data**
  *   **Partner A:**
      *   *Sensory:* At [Bar Name], after dinner. Handshake occurred. Words "Let's do this" spoken.
      *   *Meaning:* "We formed a verbal contract to expand."
      *   *Impact:* Quit current job, expecting capital injection.
  *   **Partner B:**
      *   *Sensory:* At [Bar Name], after dinner. 3+ drinks consumed. Handshake occurred.
      *   *Meaning:* "We were brainstorming ideas, not finalizing terms."
      *   *Impact:* Shocked by A's reliance, no money allocated, feels ambushed.

  **Phase 2: Mapping**
  *   **Convergent:** They met at the bar. A handshake occurred. Expansion was discussed.
  *   **Divergent:** The *legal weight* of the handshake.
  *   **Contradictory:** The *specifics*. (A says "Deal made," B says "No dollar amounts discussed").

  **Phase 3: Drafting the Summary (Syādvāda Applied)**
  *This is dangerous territory. If you validate the contract, B walks. If you invalidate it, A walks. You must validate the **memory** without validating the **enforceability**.*

  > **Case Summary: [Business Name] Partnership**
  >
  > **Undisputed Context:**
  > Both parties were in discussions regarding the potential expansion of the business. A meeting took place at [Bar Name] on [Date]. Both parties recall a handshake occurring at the conclusion of this meeting.
  >
  > **Partner A's Perspective:**
  > Partner A understands the handshake and conversation at [Bar Name] to be a binding agreement to proceed with expansion immediately. Based on this understanding, Partner A has made life changes (including leaving previous employment) expecting the expansion to move forward.
  >
  > **Partner B's Perspective:**
  > Partner B understands the conversation at [Bar Name] to be preliminary brainstorming. Partner B recalls that specific financial terms and dollar amounts were not finalized during this meeting. Partner B did not intend for the handshake to signify a final binding contract at that time.
  >
  > **Areas for Mediation:**
  > 1. The parties hold different understandings regarding the legal weight of the conversation at [Bar Name].
  > 2. Partner A has incurred reliance costs based on their understanding of the agreement.
  > 3. The parties need to decide whether to formalize an expansion agreement now, or dissolve the partnership amicably.

  **Why this works:**
  *   **Syādvāda in action:** It uses "Understands... to be." It acknowledges that for A, the truth *is* a contract. For B, the truth *is* brainstorming. Both are true *for them*.
  *   **The "Judgment Call" Flag:** The summary explicitly states they hold different understandings. It does not ask them to agree on what the handshake *was*, only to agree that they *disagree* on what it was.
  *   **Forward Looking:** It moves the focus from "Who is right about the past?" to "What do we do about the reliance costs?"

  ### When the Procedure Throws Up Its Hands
  There is one scenario where this protocol will fail, and you need to know it in advance.

  **The "Bad Faith" Contradiction:**
  If Party A says "I never received the money" and Party B has a bank cancellation check image, this is not a perspective clash. This is a factual falsehood.
  *   **Protocol Adjustment:** Do not use qualifiers here. State: "Party B has produced documentation of payment. Party A states they did not receive it."
  *   **The Limit:** If one side refuses to sign the summary because it acknowledges the *other side's perspective exists*, mediation is likely impossible. The summary is a contract to talk, not a contract to agree. If they won't sign the map, they won't walk the path.

  ### Final Note on Language
  The power of *syādvāda* here is the removal of the verb "to be" in disputed contexts.
  *   **Bad:** "The visit *was* harassment."
  *   **Bad:** "The visit *was* maintenance."
  *   **Good:** "The visit *is experienced as* harassment." "The visit *is recorded as* maintenance."

  This allows both parties to sign the document without lying. They are signing off on the *existence of the dispute*, not the *resolution of the facts*. That is the only summary both sides can sign before the war starts.
