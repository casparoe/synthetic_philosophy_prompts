      *   *Syādvāda:* Use qualifying language ("From the perspective of...", "Under the condition of...", "It appears that..."). Avoid absolute statements ("X happened").
      *   *Mediation Context:* The goal isn't a court verdict; it's a shared starting point. The summary needs to validate feelings/perceptions without necessarily validating legal claims yet.

