          4.  Mechanism must be traceable with plausible numbers (price/wage ratios over months).
          5.  Include a second class that is better off and thinks nothing is wrong.
          6.  **Output:** One paragraph of fiction prose + Analysis section.
          7.  **Specific Analysis Points:** Food-availability prediction vs. reality; Entitlement prediction & specific failure point; The "single feature" doing the work (and counterfactuals); District-level net importer status (no cheating); Availability theorist's counter-attack.
          8.  **Concrete Object:** One tangible item to anchor the mechanism.

  2.  **Deconstruct the Economic Mechanism (Sen's Entitlement Approach):**
      *   *Core Concept:* Famine occurs when a group's "entitlement set" (what they can legally command through production, trade, or labor) shrinks, even if aggregate food supply ($F$) increases.
      *   *The Trigger:* Needs to be an economic boom or shift that raises food prices faster than wages for a specific group.
      *   *The "Rising Food" Constraint:* If food is coming *in*, why are prices rising? Demand must be rising faster than supply, or the composition of demand is shifting.
      *   *The Scenario:* A cash-crop boom. Let's say the delta is switching from subsistence rice to a high-value export crop (e.g., indigo, jute, or a fictional equivalent like "blue-leaf" or just "cash-grain" for urban markets).
      *   *Refining the "Rising Food" Constraint:* The prompt says "total quantity of food reaching the province rises." If farmers switch to cash crops, local food production might drop. To make food *rise*, the province must be importing food *because* it has more money.
      *   *The Mechanism:*
          1.  External demand for a cash crop surges.
          2.  Landowners switch land to cash crops.
          3.  Landowners have more cash income.
          4.  They demand more food (or the workers they *do* pay demand it).
          5.  Food prices rise due to increased purchasing power in the region.
          6.  Laborers are paid money wages, not rice.
          7.  Money wages are sticky (contracted annually or slow to adjust).
          8.  Food prices outpace wages.
          9.  Laborers starve despite more food being imported to feed the wealthy/cash-crop farmers.
      *   *The "Decent" Actors:*
          1.  Landlord: Wants to maximize profit to pay debts/improve land.
          2.  Merchant: Bringing in food to meet demand (doing a good thing).
          3.  Laborer: Willing to work, but wage buys nothing.
          4.  "Helping" Actor: Maybe a landlord who raises wages slightly, but not enough to match inflation.

  3.  **Drafting the Prose Paragraph:**
