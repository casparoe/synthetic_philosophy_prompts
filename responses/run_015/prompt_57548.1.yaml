  4.  **Developing the Analysis:**
      *   *Food Availability Decline (FAD):* Predicts starvation only if $F$ drops. Here $F$ rises. FAD fails.
      *   *Entitlement:* Predicts starvation if Exchange Entitlement ($E$) drops. $E = Wage / Price$. If $P$ rises faster than $W$, $E$ collapses.
