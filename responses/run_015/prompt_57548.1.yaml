      *   *The Cause:* The wealth generation (cash crop) causes both the food import rise and the price rise that kills the laborer.

      *   *Concrete Object:* Let's pick the **chalked price on the granary wall**. It visually represents the market moving away from the worker. Or the **wage envelope**. The prompt says "One thing a reader can see and hold." An envelope is holdable. A wall is not. I will choose the **wage envelope**.

      *   *District Import:* I need to make sure the analysis explicitly defends the "net importer" claim without cheating. The starving district imports food because the *other* districts/cities have money to buy it, or the local wealthy buy it. The laborers just can't.

