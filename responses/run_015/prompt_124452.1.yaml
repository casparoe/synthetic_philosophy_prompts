  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "ease for the debater" and "ease for the judge" is sharp, as that's the crux of the oversight problem. (The panelist said "easier to defend," which implies debater effort, but the goal is "judge picks winner," which implies judge perception).

