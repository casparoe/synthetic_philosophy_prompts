prompt: |-
  I got into an argument about tort law and now I can't work out how this whole package of doctrines is supposed to hang together. In most common-law jurisdictions (England, most US states, Australia), if a doctor negligently fails to warn parents about a serious genetic risk, the parents can sue for wrongful birth and recover the extra costs of raising a disabled child. The child, the one actually living with the condition, generally can't sue for wrongful life; California, New Jersey, Maine and Washington let the child sue but only for provable economic losses and not for pain and suffering, and Germany's constitutional court struck the action down as incompatible with human dignity while leaving the parents' claim for the child's upkeep intact. Meanwhile the same courts cheerfully award damages in wrongful death for the life the dead person lost.

  So what does this presuppose? It smells like the procreation asymmetry — a reason not to bring a suffering person into existence, no matching reason to bring a happy one in — but I can't tell whether the package really needs that, or whether it only needs some weaker zero-line claim: that a life above a certain threshold simply cannot be an injury to the person living it, and that there is nobody there for nonexistence to be compared with anyway. And the wrongful-death half seems to presuppose that life is a good, which sits oddly with refusing to treat a terrible life as a harm.

  The bit I want pressed on is a reform a friend proposed: call it wrongful life lite. The child may recover, but only the shortfall between their condition and a minimally decent life, capped at zero — nothing for the gap between their life and a healthy one, and nothing at all for a life that is merely drab. Does that actually encode the asymmetry in a damages rule, or does it smuggle in something the asymmetry doesn't supply, like a determinate worth-living threshold or a non-comparative account of harm? Is the asymmetry even the right thing to reach for, given that it is about reasons to create while tort is about compensating someone who now exists? And could someone who rejects the asymmetry outright — a total utilitarian, say — still defend barring the child's claim on deterrence or administrability grounds, so that the practice is underdetermined by the philosophy? Reconstruct the implicit view, tell me what strictly has to be presupposed versus what merely fits well, and say what a court that took a symmetric view would have to start doing differently.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Query:**

      *   **Core Problem:** The user is struggling to reconcile the doctrinal package of tort law regarding birth-related injuries (wrongful birth vs. wrongful life vs. wrongful death).
      *   **Observations:**
          *   Parents *can* sue for wrongful birth (negligent failure to warn leading to disabled child). Recovery: extra costs of raising disabled child.
          *   Child *generally cannot* sue for wrongful life (claiming they shouldn't have been born). Exceptions (CA, NJ, ME, WA) allow limited economic damages, not pain/suffering. Germany bans it on dignity grounds.
          *   Courts *do* award damages for wrongful death (loss of life).
          *   **Tension:** Wrongful death treats life as a good (loss is compensable). Wrongful life treats existence as non-compensable (even if disabled), implying existence isn't a harm compared to non-existence.
      *   **Philosophical Angles:**
          *   Procreation Asymmetry (Parfit): Reason not to create suffering person vs. no reason to create happy person.
          *   Zero-Line Claim: Life above a threshold isn't an injury; non-existence has no subject for comparison.
          *   "Wrongful Life Lite" Proposal: Child recovers shortfall between condition and "minimally decent life," capped at zero. No recovery for gap vs. healthy life or "drab" life.
      *   **Questions to Answer:**
          *   Does "Wrongful Life Lite" encode the asymmetry or smuggle in a threshold/non-comparative harm?
          *   Is the asymmetry the right tool (creation reasons vs. compensation reasons)?
          *   Can a total utilitarian (rejecting asymmetry) still bar the claim on practical grounds (deterrence/administrability)?
          *   **Task:** Reconstruct the implicit view of current law, distinguish necessary presuppositions from compatible ones, and describe what a court taking a *symmetric* view would have to do differently.

  2.  **Analyze the Current Doctrinal Package (The "Implicit View"):**

      *   *Wrongful Birth (Parents):* Presupposes the parents had an interest in avoiding the conception/birth of a disabled child. The harm is financial/burdensome to *them*. It treats the child's disability as a foreseeable cost to the parents.
      *   *Wrongful Life (Child):* Generally barred. Why?
          *   *Comparison Problem:* How to compare existence (disabled) vs. non-existence? Non-existence isn't a state of being.
          *   *Sanctity of Life:* Declaring a life "not worth living" is socially/ethically fraught (Germany's dignity argument).
          *   *Damages Calculation:* How to calculate "being born" vs. "not being born"?
      *   *Wrongful Death:* Presupposes life is a valuable asset owned by the person (or their estate/heirs). The harm is the *loss* of that asset.
      *   *The Tension:* Wrongful Death says Life = Good. Wrongful Life says Life $\neq$ Harm (even if disabled).
      *   *Resolution in Law:* The law implicitly adopts a **Non-Comparative Threshold View** combined with **Subject-Specific Standing**.
          *   For the dead: They *had* a life. It was taken. Harm is clear.
          *   For the born: They *have* a life. To claim harm, that life must be worse than *nothing*. Since "nothing" isn't a state, the law defaults to: If you exist, you have a legal interest in continuing to exist (Wrongful Death), but you cannot claim you were harmed by coming into existence unless existence is objectively intolerable (which courts rarely admit).

  3.  **Evaluate "Wrongful Life Lite" (The Friend's Proposal):**

      *   *Proposal:* Recover shortfall between condition and "minimally decent life," capped at zero.
      *   *Does it encode Asymmetry?* Not exactly. Asymmetry is about *reasons to act* (procreation). This is about *damages* (compensation).
      *   *Does it smuggle in a threshold?* Yes. It requires a judicial determination of "minimally decent life." This is a non-comparative baseline (Life vs. Threshold) rather than a comparative one (Life vs. Non-Existence).
      *   *Does it require Non-Comparative Harm?* Yes. It says "You were harmed because your life is below X," not "You were harmed because you exist rather than not."
      *   *Critique:* It solves the calculation problem (no need to value non-existence) but creates a new problem: Who defines "minimally decent"? It risks stigmatizing disabled lives as "below decent" while healthy lives are "above."

  4.  **Analyze the Philosophical Underpinnings (Asymmetry vs. Utilitarianism):**

      *   *Procreation Asymmetry:* Relevant to the *duty* of the doctor/parents. But tort is about *remedy* for the victim. The asymmetry explains why we feel uneasy about the child's claim, but tort law needs a theory of *harm*.
      *   *Total Utilitarian:* Would say existence is good if net happiness > 0. If a life is net negative, it's a harm. A total utilitarian *could* support barring the claim for practical reasons (floodgates, impossible calculus, deterrence of beneficial medical practices), even if theoretically the harm exists. This supports the user's suspicion that practice is underdetermined by philosophy.
      *   *Person-Affecting View:* Tort requires a victim. Non-existence has no victim. This is the strongest legal argument against wrongful life.

  5.  **Address the Wrongful Death Tension:**

      *   Why is Life a Good in Death but not a Harm in Birth?
      *   *Legal Fiction:* Wrongful Death statutes are statutory creations (mostly) to compensate *survivors* or the estate for the *loss of earnings/companionship*. It treats life as an economic asset.
      *   *Wrongful Life:* Treats life as an ontological state.
      *   *Reconciliation:* The law protects the *continuation* of life (you can't kill me) but doesn't guarantee the *quality* of life at the point of origin (you can't sue for being born), unless the quality is so low it violates dignity (Germany) or creates specific economic burdens (CA/NJ).

  6.  **Construct the "Symmetric Court" Scenario:**

      *   If a court took a truly symmetric view (Life is a Good, so Lack of Healthy Life is a Harm; or Non-Existence is a valid comparator):
      *   *Option A (Pro-Life Symmetry):* If life is always a good, Wrongful Birth claims should also fail (parents can't claim damage from a "good" life). But courts allow Wrongful Birth. So the law isn't symmetric here.
      *   *Option B (Pro-Choice/Quality Symmetry):* If non-existence is a valid comparator, then:
          1.  Wrongful Life should be fully allowed (general damages for pain/suffering of existence).
          2.  Wrongful Death damages might need to account for the *suffering* the deceased would have endured (offsetting the "loss").
          3.  Wrongful Birth damages might shift from "costs of care" to "loss of opportunity to avoid existence."
      *   *What would change?* The court would have to accept that non-existence is a baseline state capable of being compared to existence. It would have to award general damages for "being born disabled" vs "not being born." It would likely have to abolish or radically alter Wrongful Birth (why compensate parents for costs if the child is compensated for the life itself?).

  7.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the puzzle. It's a clash between ontology (being vs. non-being) and economics (damages).
      *   *Section 1: The Implicit View of Current Law.* Identify it as a **Person-Affecting, Continuation-Bias View**. It prioritizes the sanctity of existing life over the quality of origin. It treats Wrongful Death as loss of asset, Wrongful Life as ontological impossibility.
      *   *Section 2: Analyzing "Wrongful Life Lite".* It relies on a **Non-Comparative Threshold**, not the Asymmetry. It avoids the "non-existence comparator" but introduces a "state-sponsored quality of life judgment."
      *   *Section 3: Asymmetry vs. Tort Theory.* Asymmetry is about *reasons for action*. Tort is about *correction of wrongs*. The legal bar is better explained by the **Non-Identity Problem** (no harm to a specific person if they wouldn't exist otherwise) than the Asymmetry.
      *   *Section 4: The Utilitarian/Practical Defense.* Yes, a utilitarian can bar the claim on administrability (incalculable damages) and deterrence (defensive medicine). This confirms practice is underdetermined by metaphysics.
      *   *Section 5: The Symmetric Court.* What if they treated Life as a commodity in both directions?
          *   Allow full Wrongful Life (general damages).
          *   Reduce Wrongful Death (offset by avoided suffering).
          *   Potentially bar Wrongful Birth (parents can't profit from child's injury if child is made whole).
      *   *Conclusion:* The current package is a pragmatic compromise, not a philosophical unity. It presupposes a **threshold of tolerability** rather than a **metric of happiness**.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between the *parents'* claim and the *child's* claim clearly. The user notes the tension between them.
      *   *Nuance:* The "Wrongful Life Lite" proposal is essentially what some jurisdictions (like Washington) attempt—special damages only. I need to be clear that this *avoids* the metaphysical harm question by focusing on economic need.
      *   *Key Insight:* The law isn't actually committed to the Asymmetry. It's committed to **Legal Standing**. You can't sue for never being born because "you" (the plaintiff) don't exist in that counterfactual. This is the Non-Identity Problem, which is distinct from the Asymmetry. I must make this distinction clear.
      *   *Wrongful Death:* Remember that Wrongful Death damages usually go to *survivors* (loss of consortium) or estate (lost wages), not for the "pain of being dead." This resolves some tension. The dead person isn't suing for the state of being dead; the survivors sue for the loss of the person.

  9.  **Final Polish:** Ensure tone is analytical, rigorous, and directly answers the specific prompts (presuppositions, Lite analysis, symmetric court implications). (Proceed to generate output based on these structured thoughts.)
answer: |-
  This is a profound jurisprudential puzzle. You have correctly identified that the current doctrinal package (Wrongful Birth allowed, Wrongful Life barred/limited, Wrongful Death allowed) is not a seamless philosophical whole but a pragmatic patchwork. It attempts to navigate between the **Non-Identity Problem** (you can't harm someone by bringing them into existence if they wouldn't otherwise exist) and the **Sanctity of Life** (life is presumptively valuable).

  Here is a reconstruction of the implicit view, an analysis of your friend's "Wrongful Life Lite" proposal, and a sketch of what a truly symmetric court would look like.

  ### 1. The Implicit View of Current Law
  The current common-law package does not strictly presuppose the **Procreation Asymmetry** (Parfit's view that we have reasons not to create suffering people but no reasons to create happy ones). Instead, it presupposes a **Person-Affecting Continuation Bias**.

  **What is strictly presupposed:**
  1.  **Standing requires identity:** To sue in tort, there must be a plaintiff who is worse off than they would otherwise be. In Wrongful Life, the counterfactual is non-existence. The law implicitly holds that non-existence is not a "state" against which existence can be compared for the purpose of damages. There is no "them" to compare.
  2.  **Life is a protected interest, not a guaranteed quality:** Wrongful Death statutes protect the *continuation* of life as an asset (economic or relational). They do not compensate for the "state of being dead" (which is impossible to experience) but for the *loss* of the life to the estate or survivors. Wrongful Life, conversely, asks the court to evaluate the *quality* of the life itself against non-existence. The law presupposes it lacks the competence to declare a life "not worth living" without violating public policy (human dignity).
  3.  **Harm is economic, not ontological:** In Wrongful Birth, the parents' harm is clearly defined: unanticipated financial burden. In Wrongful Life, the child's harm is ontological: "I should not be." Courts allow the former because money can fix it; they bar the latter because money cannot fix "being."

  **What merely fits well (but isn't required):**
  *   **The Procreation Asymmetry:** The law doesn't need the asymmetry to bar Wrongful Life. It only needs the **Non-Identity Problem**. Even if you reject the asymmetry and believe there *is* a reason to create happy people, you still face the logical hurdle that the child cannot claim they are worse off than they would have been (since they would not have been).
  *   **Sanctity of Life as Metaphysical Truth:** The courts often speak as if life is intrinsically sacred. In practice, they only need to treat life as **legically presumptive**. They don't need to believe life is a gift from God; they only need to rule that declaring a life a "legal injury" creates unacceptable social risks (e.g., devaluing disabled lives).

  **The Wrongful Death Tension:**
  You noted the oddity: Wrongful Death treats life as a good, Wrongful Life refuses to treat a bad life as a harm.
  *   *Resolution:* Wrongful Death damages are usually **survivor-centric** (loss of consortium, lost wages to the estate). The law compensates the *survivors* for the loss of the asset. It does not compensate the deceased for the "harm of death."
  *   Wrongful Life asks the court to compensate the *victim* for the "harm of birth."
  *   *The Presupposition:* The law presupposes that **loss of a good (death)** is calculable, but **conferral of a bad (birth)** is not, because the baseline for the latter is void.

  ### 2. Analyzing "Wrongful Life Lite"
  Your friend's proposal: *Child recovers shortfall between condition and a "minimally decent life," capped at zero.*

  **Does this encode the Asymmetry?**
  No. The Asymmetry is about *reasons for action* (why we procreate). This rule is about *measurement of harm*.
  *   If the Asymmetry were encoded, the court would say: "We have a duty not to create suffering, so we allow the suit."
  *   Instead, "Lite" says: "We acknowledge you exist, but we will only pay if your existence falls below a statutory baseline."

  **Does it smuggle in a threshold or non-comparative harm?**
  Yes, it smuggles in a **Non-Comparative Threshold of Harm**.
  *   **Comparative Harm (Standard Tort):** You are worse off than you would have been (Baseline: Non-existence).
  *   **Non-Comparative Harm (Lite):** You are in a bad state, regardless of the alternative (Baseline: Minimally Decent Life).
  *   **The Smuggle:** This requires the court to define "minimally decent." This is philosophically treacherous. It implies the state has the authority to categorize certain disabilities as "below decent." This risks the exact stigma the current bar on Wrongful Life tries to avoid. It also creates a cliff-edge: a child slightly above the threshold gets nothing, even if their life is full of pain, while a child slightly below gets damages.

  **Does it solve the metaphysical problem?**
  It sidesteps the Non-Identity Problem by ignoring non-existence entirely. It treats the claim like a medical malpractice claim for *post-natal* injury. "You were born, and your condition is X, and X is below the legal minimum."
  *   *Critique:* This severs the link between the negligence (failure to warn/abort) and the damage. If the remedy is based on the *quality of life* rather than the *fact of birth*, the doctor is effectively insuring the child against disability, not insuring the parents against the choice.

  ### 3. Is the Asymmetry the Right Tool?
  You asked if the asymmetry is the right thing to reach for, given tort is about compensation, not creation reasons. **You are correct to doubt it.**

  *   **Tort is backward-looking:** It corrects wrongs done to existing persons.
  *   **Asymmetry is forward-looking:** It guides decisions to create persons.
  *   **The Mismatch:** Using the Asymmetry to justify tort rules conflates the *duty of care* with the *measure of damages*.
  *   **Better Fit:** The **Person-Affecting Restriction**. Tort law requires a victim. In Wrongful Life, the "victim" only exists because of the alleged tort. If the tort hadn't happened, the victim wouldn't exist to sue. This is a procedural bar, not a moral one. It explains why parents (who existed beforehand) can sue, but the child (who did not) generally cannot.

  **Can a Total Utilitarian bar the claim?**
  Yes. A Total Utilitarian believes we should maximize total happiness.
  *   **Theoretically:** If a life is net negative (suffering > joy), bringing it into existence reduces total utility. A consistent utilitarian *should* allow Wrongful Life suits to deter the creation of net-negative lives.
  *   **Practically (The Defense):** A utilitarian judge could still bar the claim on **Administrability** and **Rule Utilitarian** grounds.
      1.  **Calculation:** We cannot accurately measure "net happiness of a life." Litigation would turn into speculative philosophy.
      2.  **Deterrence:** Allowing suits might cause doctors to practice defensive medicine (encouraging abortion for minor risks), which might reduce overall welfare.
      3.  **Floodgates:** Every unhappy person could theoretically sue their parents/doctors.
      *   *Conclusion:* The practice is indeed underdetermined by the philosophy. You can reach the same legal outcome (barring the claim) from deontological grounds (dignity) or utilitarian grounds (administrative efficiency).

  ### 4. The Symmetric Court: What Would Change?
  If a court rejected the current patchwork and adopted a **Symmetric View** (treating Life as a commodity that can be lost *or* gained, and Non-Existence as a valid baseline), the doctrinal package would collapse and rebuild as follows:

  **1. Full Wrongful Life Allowed (General Damages)**
  *   The court must accept that Non-Existence is a valid comparator.
  *   The child can recover for pain and suffering of existence vs. non-existence.
  *   *Implication:* The court must be willing to declare specific lives "not worth living." This abandons the dignity constraint.

  **2. Wrongful Death Damages Reduced (The "Offset" Problem)**
  *   If life is a commodity, we must account for its *net* value.
  *   In a Wrongful Death suit, the defendant should be allowed to argue: "Yes, I killed him, but he was depressed/ill, and his future life would have been net negative."
  *   *Current Law:* You cannot mitigate damages in wrongful death by arguing the deceased was suicidal or miserable.
  *   *Symmetric Law:* You must. If existence can be a harm (Wrongful Life), then lost existence can be a benefit (Wrongful Death mitigation).

  **3. Wrongful Birth Abolished or Radicalized**
  *   *Current:* Parents recover costs of raising the child.
  *   *Symmetric:* If the child can recover for the harm of being born, the parents' claim for "costs of raising" becomes double recovery or logically incoherent.
  *   *Option A:* Abolish Wrongful Birth. The child is the victim; the parents are merely conduits.
  *   *Option B:* Parents can only recover their *own* emotional distress, not the child's upkeep, because the child's upkeep is now the child's own damages (to compensate for their suffering life).

  **4. The "Non-Identity" Dissolves**
  *   A symmetric court would have to adopt a **Impersonal Harm** theory. It would acknowledge that harm can occur even if the specific person wouldn't otherwise exist. This fundamentally breaks traditional tort standing, which requires a specific, pre-existing plaintiff to be made "whole."

  ### Summary of the Reconstruction

  | Doctrine | Current Implicit View | "Wrongful Life Lite" | Symmetric Court |
  | :--- | :--- | :--- | :--- |
  | **Baseline** | Existence vs. Non-Existence (Incomparable) | Existence vs. "Decent Minimum" | Existence vs. Non-Existence (Comparable) |
  | **Harm Type** | Economic (Parents) / Ontological (Child - Barred) | Non-Comparative State Harm | Comparative Welfare Harm |
  | **Presupposition** | **Person-Affecting Constraint:** No plaintiff, no case. | **Threshold Theory:** State can define "bad life." | **Total Welfare:** Life is a net +/- quantity. |
  | **Wrongful Death** | Loss of Asset (Survivors) | Unchanged | Loss of Net Utility (Offset by suffering) |
  | **Philosophy** | Pragmatic Compromise | Paternalistic Welfarism | Utilitarian / Symmetric |

  **Verdict:**
  The current package presupposes **Legal Standing** and **Administrative Competence**, not the Procreation Asymmetry. It assumes courts can calculate lost wages (Death) and extra costs (Birth), but cannot calculate the value of non-existence (Life).

  Your friend's "Lite" proposal avoids the metaphysics of non-existence but introduces a **state-defined quality of life threshold**, which is politically and ethically more volatile than the current bar. It doesn't encode the asymmetry; it encodes a **sufficiency view** of justice (everyone deserves a decent minimum), applied retroactively to birth.

  To make the system symmetric, you would have to treat life as a financial asset in both directions: allowing children to sue for "bad investments" (birth) and allowing defendants to deduct "avoided losses" (suffering) in death cases. Most legal systems reject this because it commodifies human existence in a way that undermines the foundational legal fiction that every life has equal, incalculable worth.
