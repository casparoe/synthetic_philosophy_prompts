prompt: |-
  hi — I'm writing a novel set maybe thirty years on, in a Britain that's taken one particular argument from welfare biology completely seriously, and I need some in-universe paperwork for a scene. My protagonist's an ecological consultant who's been sent a consultation document she has to respond to, and I want her reading it on the train, on her way to a site visit out on the Somerset Levels, with mounting horror.

  Could you write me that document? Say 700–800 words: a short preamble, then numbered clauses, then a brief Frequently Asked Questions bit at the end. The register is statutory guidance crossed with the biodiversity-net-gain paperwork developers already fill in — deadpan, dull, completely certain of itself, full of defined terms and cross-references. No winking, no nudging the reader, no character asides; the horror should come entirely from the scheme being internally consistent and honestly administered.

  The premise of my fictional world: it's now accepted that the lives of most wild animals contain more suffering than happiness — short lives, starvation, predation, enormous numbers of offspring who die young — so that removing habitat is, other things being equal, a welfare improvement. My scheme: developers earn Net Suffering Reduction credits for draining, paving or concreting, provided the habitat is kept destroyed in perpetuity, since if the animals recolonise or simply breed back up towards carrying capacity nothing has actually been gained. Please invent the administrative details that make that work: how they handle the awkward fact that removing some individuals tends to leave the survivors better off, whether insect biomass counts and on what provisional sentience weighting, why farmed and companion animals are scored seperately from wild ones, what happens to a landowner who lets a pond just sit there doing nothing.

  Please commit rather than hedge: pick the version of the argument you're lampooning — which empirical claim you're inflating, whose welfare you're counting — and follow it through, deadpan, to the conclusion a reader would flinch at, in the spirit of a modest proposal. Then add a note of about 150 words for me, not for the novel: which assumption in the real argument you think is the weakest joint, where my fictional scheme exaggerates, and where (if anywhere) it's actually less extreme than what's been seriously defended. I'd rather have a definite view with reasons than a balanced survey, because I need to know which bit to make her angry about.

  cheers
