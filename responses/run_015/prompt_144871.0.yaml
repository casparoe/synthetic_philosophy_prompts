answer: |-
  This is the central tension in historical institutionalism and macro-sociology. You are asking about the difference between **deterministic lock-in** (Strong Path Dependence) and **contingent stickiness** (Weak Path Dependence).

  To get to the "conceptual guts," we have to move past the idea of "switching costs" (like retraining typists) and look at **power, adaptation, and expectation.**

  Here is the breakdown of the reasoning behind whether history is locked-in or just sticky, and why the "inevitability" of democracy/capitalism is likely a mirage.

  ### 1. The Mechanism: Why Paths "Harden"
  In the QWERTY example, the mechanism is *coordination*. In history/politics, the mechanism is **Increasing Returns to Power.**

  When a society adopts a specific institutional arrangement (say, a specific form of property rights or a voting system), three things happen that make it hard to reverse:
  1.  **Adaptation:** People build their lives, businesses, and strategies around the current rules. Changing the rules makes their specific investments worthless.
  2.  **Expectation:** People stop imagining alternatives. If capitalism has existed for 200 years, it becomes "common sense" rather than "one option among many."
  3.  **Power Consolidation:** This is the big one. The winners of the current system gain resources to rig the game against future challengers.

  **The Guts:** Strong path dependence argues that #3 becomes so dominant that #1 and #2 don't matter. The system becomes self-perpetuating regardless of efficiency. Weak path dependence argues that #1 and #2 create friction, but if the system fails catastrophically (war, economic collapse), #3 can be overturned.

  ### 2. Strong vs. Weak: The "Inevitability" Test
  You asked if we would end up with democracy/capitalism even if tiny events flipped.

  **The Strong Version (Inevitability/Teleology):**
  *   **The Argument:** There are functional imperatives. Industrialization *requires* urbanization, which *requires* mass education, which *requires* political participation. Therefore, democracy is the "end state" of modernization.
  *   **The Logic:** This assumes **Equifinality** (many starting points lead to the same outcome). It suggests history has a gravity well pulling us toward liberal democracy.
  *   **The Flaw:** This is almost certainly hindsight bias. It ignores the 20th century. In 1940, liberal democracy looked like a dying breed compared to Fascism and Communism. If history were "strongly path dependent" toward democracy, the 1930s shouldn't have happened. The fact that systems can regress (democratic backsliding) proves the lock-in isn't absolute.

  **The Weak Version (Contingency/Stickiness):**
  *   **The Argument:** History is defined by **Critical Junctures**. These are short windows where structural constraints loosen (e.g., post-war, post-plague, revolution). During these windows, small events *do* matter immensely. Once the window closes, the path hardens.
  *   **The Logic:** This assumes **Multifinality** (similar starting points can lead to vastly different outcomes).
  *   **The Example:** Why is North Korea different from South Korea? Same culture, same history, same geography. A specific political juncture (post-WWII occupation) split them. Once the institutions diverged, they became "sticky." You can't easily switch from North to South without a collapse.
  *   **The Verdict:** This is the more robust scholarly view. Democracy wasn't inevitable; it was the result of specific conflicts (e.g., labor movements, bourgeois revolutions) that could have gone the other way. Once established, it became hard to remove, but not impossible.

  ### 3. The Hindsight Bias Trap
  You asked if inevitability is just hindsight bias. **Yes.**

  Here is the conceptual tool to understand why: **Survivorship Bias.**
  We look at the systems that survived (Western Liberal Democracy, Global Capitalism) and assume they were the "fittest" or "inevitable." We ignore the branches that were cut off.

  *   **Reasoning:** If you look at history as a branching tree, standing at the tip of one branch makes it look like a straight line leading to you. But if you zoom out, it's a bush.
  *   **The "End of History" Fallacy:** Francis Fukuyama's argument that liberal democracy is the final form of government is the ultimate Strong Path Dependence claim. It failed to predict the rise of authoritarian capitalism (China) or theocratic resilience (Iran). These systems prove there are multiple stable equilibria, not just one "locked-in" destination.

  ### 4. Punctuated Equilibrium: The Middle Ground
  The most accurate way to wrap your head around this is **Punctuated Equilibrium** (borrowed from evolutionary biology).

  *   **Long periods of Stasis (Path Dependence):** Institutions are sticky. Interest groups dig in. Change is marginal. It feels "locked in."
  *   **Short periods of Rupture (Critical Junctures):** External shocks (war, plague, financial crash) break the feedback loops. The "lock" opens.
  *   **The Reasoning:** History is not a smooth slope; it's a staircase.
      *   *Weak Path Dependence* explains the flat part of the stair (hard to move sideways).
      *   *Contingency* explains the vertical part of the stair (you could have stepped up or down).

  If you rewind time to 1910, would we have capitalism? Probably, because industrial technology creates pressure for market exchange. Would we have *liberal democracy*? Not necessarily. We could have easily settled into a stable, high-tech authoritarianism (which many thought was the future in 1930).

  ### 5. Summary of the Reasoning
  To answer your specific stuck point:

  1.  **Is history locked in (Strong)?** No. If it were, regime changes wouldn't happen. The Soviet Union didn't look like it was going to collapse until it did. Strong path dependence confuses *stability* with *inevitability*.
  2.  **Is it just hard to switch (Weak)?** Yes. This is the consensus. Institutions create winners who fight to keep them. This creates "stickiness."
  3.  **Are big outcomes inevitable?** No. That is teleology (assuming a purpose). Capitalism and Democracy are **contingent stabilizations.** They won out in specific contexts, created powerful feedback loops, and now look inevitable because they are currently dominant.
  4.  **Is it hindsight bias?** Largely. We construct narratives that make the present look like the logical conclusion of the past to make the world feel predictable.

  **The Conceptual Takeaway:**
  Think of path dependence not as a **railroad track** (where you must arrive at Station Democracy), but as a **riverbed**.
  *   The water (history) flows in a certain direction.
  *   Over time, the water erodes the bed deeper, making it harder for the river to change course (Stickiness/Weak Path Dependence).
  *   However, a massive flood or earthquake (Critical Juncture) can break the banks and force the river into a totally new valley (Contingency).
  *   Once in the new valley, it digs in again.

  We are currently in a deep part of the riverbed. It looks like we can't get out. But the geological record shows rivers change course all the time. The "lock-in" is real, but it is temporal, not eternal.
