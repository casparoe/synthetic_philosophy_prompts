  9.  **(Self-Correction during drafting):** I need to be careful about Step (3). The user says "absolute negation... is impossible." In Jainism, is it impossible to say "This is absolutely false"? Yes, because "absolutely" implies exhaustive knowledge. So (3) is actually consistent with Jainism. The break happens at (5) where the user infers that *local* negation is disabled.
      *   *Wait, one nuance:* Jainism *does* posit Omniscience (*Kevala Jnana*). So a "global state" *does* exist in their ontology, just not for ordinary beings. I should mention this but honor the user's constraint to avoid it if possible (treat it as an asymptotic limit).
      *   *Better:* Focus on the *syāt* operator. It functions like a namespace or a context wrapper.

