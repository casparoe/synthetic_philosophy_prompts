answer: |-
  This is a genuinely sharp set of problems. You and your flatmate have bypassed the introductory objections and hit the structural load-bearing walls of Lewisian Modal Realism (LMR). The tension you're feeling isn't about "intuition" vs. "theory"; it's about whether the reduction of modality to quantification can survive without smuggling modality back in through the definition of the domain.

  Here is the structural breakdown of why your flatmate is holding the line on Plenitude, why your "Austerity" move breaks the indexical account of actuality, and where the real costs lie.

  ### 1. The Residue: Modal Facts About the Pluriverse
  **The Issue:** Can LMR state "There might have been fewer worlds" or "There might have been nothing"?
  **The Structural Reality:** No. And your flatmate is right that this is a feature, not a bug, *if* you want the reduction to hold.

  *   **The Dependency:** In LMR, "Possibly $P$" is defined as "$\exists w (P \text{ at } w)$". The quantifier $\exists$ is unrestricted. It ranges over the entire pluriverse.
  *   **The Consequence:** Since the quantifier ranges over *all* worlds, the domain of quantification is fixed. There is no "outer" space for the quantifier to reach into to find a "smaller pluriverse." Therefore, the existence of the pluriverse itself is **necessary**.
  *   **The Cost:** You must accept **Necessitism about the Domain**. It is not contingent that the pluriverse exists; it exists necessarily. Consequently, "There might have been nothing" is false (because there are always worlds), and "There might have been fewer worlds" is false (because the set of worlds is constant across all worlds).
  *   **Is it a pseudo-question?** From inside the system, yes. To ask "Could the pluriverse have been smaller?" is to ask "Is there a world at which the set of worlds is smaller?" Since every world contains (via the quantifier) the same set of worlds, the answer is no.
  *   **Verdict:** This is a genuine cost *if* you are a contingentist about existence. But for the LMR project, it is load-bearing. If you allow the domain of worlds to vary, you can't reduce modality to quantification over that domain, because the domain itself becomes a modal variable.

  ### 2. Austerity and the "Quarry" Charge
  **The Issue:** You proposed limiting the pluriverse to recombinations of *actual* particulars/properties (no alien properties).
  **The Flatmate's Charge:** This makes actuality non-indexical; it makes the actual world the "Quarry" (the source).
  **Why This Is Fatal to LMR:**

  *   **Indexical Actuality Requires Symmetry:** For "actual" to be purely indexical (like "here"), every world must be ontologically on par. The set of all worlds (the pluriverse) must be the same regardless of which world you are standing in.
  *   **Austerity Breaks Symmetry:** If the pluriverse is defined as "Recombinations of *Actual* World $w@$," then the extent of logical space depends on the intrinsic nature of $w@$.
      *   If I am at $w_1$, the pluriverse is $P_1$ (recombinations of $w_1$).
      *   If I were at $w_2$ (which lacks property $F$), the pluriverse would be $P_2$ (recombinations of $w_2$, no $F$).
  *   **Modal Relativism:** In this scenario, "It is possible that $F$" is true at $w_1$ but false at $w_2$. Possibility becomes world-relative.
  *   **The Quarry Problem:** In standard LMR, no world *generates* the others; they just exist. In your Austerity view, the Actual World *generates* the domain for everyone. This gives the Actual World **Generative Privilege**, not just Indexical Privilege. It is metaphysically special.
  *   **Can the Austere Realist swallow this?** You could, but you cease to be a Lewisian. You become a **Modal Actualist** who uses concrete worlds. You have to accept that "Possibly $P$" means "In the pluriverse generated by *this* world, $P$." This destroys the objective, absolute nature of modal space that Lewis wanted. It makes modality dependent on local ontology.
  *   **Verdict:** The charge is fatal to *Lewisian* Realism. It collapses the reduction because the domain of quantification (the pluriverse) is now contingent on which world is indexically actual.

  ### 3. Existential Closure ("Recombination of *Some* World")
  **The Issue:** Your flatmate's fix: The pluriverse is the recombination closure of *some* world or other ($\exists w (\text{Pluriverse} = \text{Recomb}(w))$).
  **The Structural Flaw:** Circularity and Failure of Reduction.

  *   **Circularity:** To define the pluriverse (the domain of all quantification), you are quantifying over worlds ("*some* world"). You are using the domain to define the domain.
      *   Lewis wants: Modal Facts $\leftarrow$ Quantification over Worlds.
      *   This proposal requires: Existence of Worlds $\leftarrow$ Modal Fact (that some world can be recombined).
  *   **Too Weak / Too Strong:**
      *   **Too Weak:** If the "base world" chosen happens to be sparse (no alien properties), you lose alien possibilities (back to Austerity).
      *   **Too Strong/Circular:** If the "base world" is rich, you need to explain *why* that world is the base. Is it necessary that *that* world is the base? If so, why? If it's contingent, you need a further modal fact to explain the selection, leading to regress.
  *   **Impact on Reduction:** This move presupposes the modal structure it is supposed to reduce. You are saying "The worlds exist because recombination is possible." But "Recombination is possible" is a modal claim. You haven't eliminated modality; you've hidden it in the existence condition for the pluriverse.
  *   **Verdict:** This does not repair the indexicality problem; it obscures the circularity. It fails the reduction test.

  ### 4. The Embedded Pluriverse (Worlds Inside Worlds)
  **The Issue:** A concrete world contains a structure isomorphic to a smaller pluriverse.
  **Why It Is Ersatzism:**

  *   **Maximality Constraint:** In LMR, a world is a *maximal* spatiotemporally connected sum. Nothing spatiotemporally isolated from a part of a world can be part of that world.
  *   **The Violation:** If World $W_{big}$ contains "world-like" structures inside it, those structures are *parts* of $W_{big}$. They are not genuine worlds. They are concrete *representations* of worlds.
  *   **The Truth-Maker:** When you say "There might have been fewer worlds," and you point to the structure inside $W_{big}$, you are treating that structure as a *representation* of a possibility, not the possibility itself.
      *   **Lewis:** The possibility *is* the concrete world.
      *   **You:** The possibility is *represented by* a concrete part of a world.
  *   **Why it's Ersatz:** Ersatzism is the view that possible worlds are representations (abstract or concrete) that stand in for genuine possibilities. By making the "smaller pluriverse" a contained structure, you are admitting that the *real* pluriverse is the one containing the structure, and the inner structure is just a model. You are using a concrete model to do the work of an abstract model.
  *   **Verdict:** Your flatmate is right. It violates the definition of a world (Maximality) and treats worlds as representations, which is the definition of Ersatzism.

  ### Summary: Where the Real Cost Falls

  You asked which moves are load-bearing and which are window dressing. Here is the structural hierarchy:

  1.  **Load-Bearing (Non-Negotiable for LMR):** **Plenitude + Necessitism about the Domain.**
      *   Lewis *must* claim that all possible worlds exist necessarily.
      *   **Why:** If the domain of worlds is contingent (Austerity), then "Possibly $P$" becomes relative to the actual world (Modal Relativism), and Actuality becomes generative (The Quarry), destroying the indexical account.
      *   **Why:** If the domain is defined by a modal principle (Existential Closure), the reduction of modality to quantification fails (Circularity).

  2.  **The Real Cost:** **You cannot have contingentism about the pluriverse.**
      *   This is the price of the ticket. If you want to reduce modality to quantification, the domain of quantification must be fixed.
      *   Your intuition that "There might have been fewer worlds" is a genuine modal fact is correct *from outside the system*. But *inside the system*, it is inexpressible.
      *   **Decision Point:** If you cannot swallow the necessity of the pluriverse, you cannot be a Lewisian Realist. You must be an Ersatzist or a Primitivist (modal facts are brute).

  3.  **Window Dressing (Or Fatal Deviations):**
      *   **Austerity:** Looks ontologically cheaper, but structurally fatal. It breaks the symmetry of worlds.
      *   **Embedded Pluriverse:** Looks like a clever workaround, but structurally collapses into representation (Ersatzism).

  **Conclusion:** Your flatmate is defending the only coherent version of Concrete Modal Realism. The "Residue" (Point 1) is the genuine cost: LMR buys the reduction of modality at the price of making the totality of existence necessary. Your "Austerity" attempt tries to lower the ontological cost but incurs a higher structural cost (breaking the indexicality of actuality). The trade-off is not worth it for the Lewisian project. If you want "There might have been fewer worlds" to be true, you have to abandon the idea that modality is *just* quantification over concrete worlds.
