      *   *Total View:* Indifferent (Sum is same).
      *   *Prioritarian/Egalitarian:* Prefer equality.
      *   *Fragmentation View:* This is the tricky part.
      *   *Scenario:*
          *   Pop 1: 10 people, each has 10 units of Good X and 10 units of Good Y. (Balanced lives).
