      *   *Implication 3 (Incomparability):* If the goods are truly non-fungible, Pop 1 and Pop 2 might be *incomparable*. This is counterintuitive for policy making.
      *   *Implication 4 (The "Separate Spheres" issue):* If I have a lot of Pleasure and you have a lot of Knowledge, Totalism says we can sum them. Fragmentation says maybe we can't. If we can't, then the "Identical Aggregate" premise is unstable. But assuming we can sum the *types*, does distribution matter?
