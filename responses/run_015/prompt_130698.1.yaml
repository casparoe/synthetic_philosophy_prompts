      *   Fragmentation says: If the new person has the *right kinds* of goods, $V$ goes up. If they have "barely positive" (drab) goods, $V$ does not go up (or goes up negligibly).
      *   This is distinct from Average. Average cares about the *number* relative to the mean. Fragmentation cares about the *qualitative nature* of the added life. It avoids RC (no summing of drab lives) but avoids Average's "Mere Addition" problem (adding good lives *does* add value).
