          *   Address Average View collapse. Average View penalizes adding *any* lives below the average. Fragmentation allows adding lives *if* they contain the requisite high-quality goods, but blocks adding "barely positive" lives. It distinguishes based on *content* of welfare, not just *height* relative to mean. Thus, it avoids RC without saying "adding happy people is neutral" (the Average View flaw).
      *   **Section 2: Counterintuitive Implications (Distribution).**
          *   Setup the scenario: Same Aggregate, Different Distribution.
          *   Total View: Indifferent.
          *   Fragmentation View: Since goods are non-fungible and constitute well-being, the *configuration* within lives matters.
          *   Implication 1: **Incomparability.** If goods are truly non-fungible, we might lack a common metric to say Pop A = Pop B in aggregate. But assuming we can count them, the implication is...
          *   Implication 2: **Integration Requirement.** Well-being might require a mix of goods. A population of "specialists" (one has all pleasure, one has all knowledge) might be worse than "generalists" (all have some of both), even if totals match. This is counterintuitive because it restricts beneficial specialization or trade.
          *   Implication 3: **Compensation Failure.** If one person loses a specific good, another gaining a different good (even of equal "magnitude") doesn't maintain value. This makes moral accounting rigid and potentially paralyzing.
      *   **Conclusion:** Summarize. Fragmentation solves RC by changing the ontology of value, but introduces rigidity and potential incomparability in distribution cases.

  6.  **Refining the "Collapse" Argument:**
      *   Does Fragmentation imply Average View?
      *   Average View: $V = \sum w / n$.
