      *   *Does it avoid RC?* Yes, by definition in the prompt. If goods are non-fungible, you cannot compensate for the loss of "high quality" goods in Population A by adding massive quantities of "low quality" goods in Population Z. The lexical or threshold nature of fragmented goods blocks the trade-off.
      *   *Does it collapse into Average View?*
          *   Average View focuses on the *mean* per person.
          *   Fragmentation focuses on the *nature* of the goods and their aggregability.
          *   *Scenario:* Population A (10 people, high goods). Population B (20 people, high goods).
          *   Average View: A and B are equally good (same average).
          *   Total View: B is better (more total).
          *   Fragmentation View: If the goods are additive *within* a life but non-fungible *across* types, does adding more lives with the *same* high goods add value?
          *   *Crucial Distinction:* The prompt defines fragmentation as a critique of *interpersonally aggregable welfare* regarding *qualitatively distinct* goods. It says adding lives with *barely positive* welfare doesn't work. It doesn't necessarily say adding lives with *good* welfare doesn't work.
          *   However, if welfare is non-fungible across persons (radical fragmentation), then aggregation itself is suspect. But the prompt implies aggregation is possible but not *continuous* in the totalist sense.
          *   *Verdict:* It does not necessarily collapse into Average View. It can maintain that adding a life with *sufficiently high* quality goods adds value (avoiding the Mere Addition Paradox/Average View implication that adding happy people is neutral), while denying that adding lives with *low* quality goods adds comparable value. It creates a "lexical" or "threshold" view rather than a mean-based view.
          *   *Refinement:* I need to be careful. If goods are non-fungible, how do we compare Population A vs Population B? If we can't aggregate, we can't say B > A. But the prompt asks if it *collapses* into Average. Collapse implies it yields the *same* verdicts. Average view says adding happy people is neutral. Fragmentation could say adding happy people is good (because distinct goods are realized), just not via the "summing small units" mechanism. So, it avoids RC *and* avoids the "Sadistic Conclusion" or "Mere Addition" issues of Average Utilitarianism.

