      *   *Hypothesis:* Fragmentation implies that the *location* of goods matters more than Totalism allows. Totalism is indifferent to distribution (given fixed sum). Fragmentation likely implies that **concentration vs. dispersion of specific goods matters.**
      *   *Specific Counterintuitive Outcome:* **The "Jack of All Trades" vs. "Specialist" verdict.**
          *   Case A: Everyone has a moderate amount of all goods.
