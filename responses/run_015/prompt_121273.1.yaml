answer: |-
  Here is the mapping of distinctions required to analyze your situation, followed by a judgment on your specific case.

  ### Mapping the Distinctions

  To evaluate this, we must distinguish between **falsification** (asserting what one believes to be false) and **misleading implicature** (asserting what is true to induce a false belief). The moral weight of this distinction usually rests on two pillars: **agency** and **integrity**. Regarding agency, lying bypasses the listener's rational choice by corrupting the data they reason with; misleading leaves the listener technically free to draw the correct inference, preserving a shred of their autonomy. Regarding integrity, lying violates the speaker's commitment to truth directly, whereas misleading allows the speaker to maintain a technical fidelity to the truth, often to preserve trust for future interactions where literal truth matters.

  However, these distinctions collapse when the listener's **epistemic capacity** is compromised. If a listener cannot process the literal truth or lacks the cognitive ability to "press" for clarification, the difference between lying and misleading becomes functional rather than structural. In such cases, the moral evaluation shifts from the *method* of deception to the *purpose* (benevolence vs. convenience) and the *cost* to the speaker's moral character (normalizing deception). The risk is that "misleading" becomes a loophole for the speaker to avoid the guilt of lying while reaping the same benefits, potentially eroding their own commitment to honesty in contexts where it does matter.

  ### Judgment on Your Case

  Your mother is partially right, but her formulation ("lying with better paperwork") misses the nuance of why the distinction usually matters, while your defense relies on a condition that no longer exists.

  **On the distinction with your father:**
  There is a genuine moral difference between lying and misleading, but in the context of mid-stage Alzheimer's, that difference does not work in your favor. Your rule relies on a counterfactual: "I would answer honestly if cornered." Moral rules based on counterfactuals require the condition to be possible. Since your father *cannot* corner you cognitively, your commitment to eventual honesty is functionally null. You are not preserving his autonomy; you are exploiting his incapacity to maintain your own self-image as a truth-teller.

  However, this does not necessarily mean you must stop. In dementia care, the ethical framework often shifts from **veracity** (truth-telling) to **beneficence** (minimizing harm). Restarting the grief cycle serves no truth-value function because he cannot retain the truth. Therefore, inducing a false belief is likely the *more* ethical choice for his well-being, even if it is deceptive. The error is not in the act, but in your justification. You should not tell yourself you aren't lying; you should acknowledge that you are engaging in **benevolent deception** because the standard contract of communication has been broken by his illness. Your mother sees the deception; you are hiding from it. Acknowledging it as a tragic necessity of care is more honest than claiming technical innocence.

  **On the capacity clause:**
  You asked if it changes anything that the capacity your rule leans on is the one he has lost. Yes, it changes everything. It renders your rule morally inert. A rule that says "I can deceive you provided you have the power to stop me" is a rule for equals. Applying it to someone who lacks that power turns the rule into a tool of domination, however kind-hearted. You are granting yourself permission to deceive based on a safeguard (his ability to press) that you know is broken. This validates your mother's worry that you are engaging in self-deception to keep your hands clean.

  **On the aide:**
  This is the most critical part of your query. Extending this practice to the aide is morally distinct and significantly more problematic. The aide is a competent adult and a professional partner in care. Deceiving her does not protect her from grief; it obscures the reality of the patient's condition and undermines the coordination of care.
  *   **Trust:** Unlike your father, the aide relies on your communication to do her job. If she believes Frank is "up north," she might inadvertently validate that belief or fail to understand the triggers for your father's distress.
  *   **Normalization:** Using "misleading truths" with a competent adult suggests you are sliding from *benevolent deception* (for the vulnerable) to *convenient deception* (for the capable). This confirms the danger your mother identified: that you are becoming comfortable with manipulation rather than tolerating it as a last resort for your father.

  **Conclusion:**
  With your father, continue to spare him the grief, but drop the semantic defense. Admit to yourself that you are deceiving him for his sake, not because you found a loophole in the definition of lying. This preserves your moral honesty even as you suspend factual honesty. With the aide, stop immediately. The justification of incapacity does not apply, and the risk to your own integrity and the care dynamic is real. Your mother is right that the distinction is thinning; do not let it vanish entirely.
