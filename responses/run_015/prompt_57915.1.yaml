answer: |-
  # The "Campus Moloch" Diagnostic: Which Trap Logic Do You Buy?

  **Intro:**
  You know the vibe. The group chat where everyone replies instantly because no one wants to be the rude lagger. The revision arms race where we all read extra papers nobody enjoys just to feel safe. The chicken shops staying open till 3am because if one closes, the others take the cash, so none of them can rest.

  This isn't just stress; it's a coordination trap. Everyone hates the outcome, but no one can unilaterally stop without losing out. We call this "Moloch" or a "multipolar trap."

  But how do you fix it? Or do you? This 9-question quiz sorts your instinctive reaction to these traps. There are no right answers, just different strategies for survival.

  ***

  ### The Quiz

  **1. The Group Chat Lag**
  Your house group chat has an unspoken rule: reply within 5 minutes or you're "ghosting." It's exhausting. What's the move?
  *   **A.** Accept it. If I slow down, I miss plans. It's the tax for having friends.
  *   **B.** Propose a "no-guilt" pact where we explicitly agree that slow replies are fine.
  *   **C.** Mute the chat and only check it twice a day. If they want me, they'll call.

  **2. The Society Spam War**
  Every society is spamming Instagram stories hourly to compete for your attention. It's drowning out actual events.
  *   **A.** Build a simple bot that aggregates all events into one clean feed so people don't need to scroll.
  *   **B.** The SU needs to step in and cap how many posts societies can make per week.
  *   **C.** Start a smaller, invite-only club that doesn't need to advertise to get good people.

  **3. The Shared House Cleaning**
  The kitchen is a biohazard. The rota exists, but everyone "forgets" when they're busy.
  *   **A.** Install a camera or use an app that tracks who cleaned last and displays it on a screen in the hall.
  *   **B.** Just have a serious chat. If we build a better vibe, people won't want to let the house down.
  *   **C.** It's always been like this. I'll just clean my own corner and wear headphones.

  **4. The Lecture Recording Race**
  Professors start posting slides earlier and earlier because students demand it. Now everyone expects notes before class, killing the discussion.
  *   **A.** Stop going to lectures. Watch the recording at 2x speed and meet with a small study group instead.
  *   **B.** The department needs a hard policy: no slides uploaded until 24 hours *after* the seminar.
  *   **C.** It's inevitable. As long as grades are curved, we have to use every advantage available.

  **5. The 3am Chicken Shop**
  Local owners say they're knackered and want to close at midnight, but fear losing customers to the shop next door.
  *   **A.** They should form a local association and sign a binding agreement to all close at midnight together.
  *   **B.** Customers who care should actively choose the shop that closes earlier to reward the behaviour.
  *   **C.** One shop will eventually buy the others out. Until then, the market decides.

  **6. The Group Project Slacker**
  One person isn't pulling their weight. If you do their work, the grade stays high, but the resentment builds.
  *   **A.** Use a peer-evaluation platform that automatically adjusts individual marks based on contribution logs.
  *   **B.** Confront them privately. Social pressure usually works if you don't make it public.
  *   **C.** Do the work yourself. It's not worth the stress of fighting the system for one module.

  **7. The Email Response Arms Race**
  Two departments are competing to see who replies to student emails faster. Staff are burning out trying to keep up.
  *   **A.** Automate the common answers with an AI tool so staff don't have to type them manually.
  *   **B.** The University needs to set a standard "48-hour window" and forbid replying faster than that.
  *   **C.** Ignore the emails for a weekend. If the system relies on my instant reply, the system is broken.

  **8. The Freshers' Fair Crowd**
  Societies are shouting over each other to grab sign-ups. It's noisy and aggressive.
  *   **A.** Create a quiet zone with QR codes where people can browse societies without being approached.
  *   **B.** We should shame the societies that shout. It makes the uni look bad.
  *   **C.** Don't bother with the fair. Find the niche societies through friends later in the term.

  **9. The Revision Grind**
  Everyone is pulling all-nighters. If you sleep, you feel like you're falling behind.
  *   **A.** Find a library group that enforces a "lights out at 11pm" rule for its members.
  *   **B.** Accept that degrees are inherently competitive. Sleep is a risk you take.
  *   **C.** Prioritise your own schedule. If others burn out, that's their risk management, not yours.

  ***

  ### Scoring Key

  Tally up how many times you chose each letter across the 9 questions. *Note: The letters map to different philosophies depending on the question to prevent pattern spotting.*

  **The Doomster (Acceptance of Inevitability)**
  *   Q1: A
  *   Q3: C
  *   Q4: C
  *   Q5: C
  *   Q6: C
  *   Q9: B
  *(Total possible: 6)*

  **The Enforcer (Binding Rules & Authority)**
  *   Q2: B
  *   Q4: B
  *   Q5: A
  *   Q7: B
  *   Q9: A
  *(Total possible: 5)*

  **The Culture Person (Norms & Social Pressure)**
  *   Q1: B
  *   Q3: B
  *   Q5: B
  *   Q6: B
  *   Q8: B
  *(Total possible: 5)*

  **The Exiter (Opt-Out & Small Groups)**
  *   Q1: C
  *   Q2: C
  *   Q4: A
  *   Q7: C
  *   Q8: C
  *   Q9: C
  *(Total possible: 6)*

  **The Techy (Mechanism Design & Automation)**
  *   Q2: A
  *   Q3: A
  *   Q6: A
  *   Q7: A
  *   Q8: A
  *(Total possible: 5)*

  **Your Dominant Leaf:**
  Whichever category has the highest score is your default instinct for solving coordination problems. If you have a tie, you likely see the problem as hybrid (e.g., Techy + Enforcer means you trust systems, whether human or digital).

  ***

  ### Designer's Notes & Limitations

  **Pairs the Quiz Struggles to Separate:**
  1.  **Enforcer vs. Techy:** Both believe in structural solutions over "vibes." In Q7 (Emails), "Automate with AI" (Techy) and "Set a 48hr Rule" (Enforcer) are functionally similar in outcome (reducing pressure), even if the method differs. A user who scores high on both basically believes "Human discretion is the problem."
  2.  **Culture vs. Enforcer:** In Q5 (Chicken Shops), "Sign a binding agreement" (Enforcer) and "Customers reward early closing" (Culture) both rely on collective action. The line between a strong social norm and a soft rule is blurry. High scores in both suggest you believe coordination is *possible*, you just debate the enforcement mechanism.

  **Weird Answer Combos:**
  *   **High Doom + High Exiter:** This looks contradictory (Why leave if it's inevitable?), but it's actually a coherent worldview: "The big system is broken and unfixable, so I must protect my immediate circle." It's a defensive exit.
  *   **High Techy + High Culture:** This is the "Optimist's Trap." You believe both that people are good *and* that code is neutral. This combo often leads to disappointment when people game the code or the code creates bad culture.
  *   **High Doom + High Enforcer:** This is the "Authoritarian Pessimist." You think people are selfish (Doom) so you want heavy rules (Enforcer). This is a stable but grim worldview.

  **Confidence in Sorting:**
  I am **moderately confident** (approx. 70%) in the sorting for extreme scores (e.g., someone who picked 8/9 options for one leaf). I am **low confidence** in flat profiles (e.g., 2 points across all five). With only 9 questions and 5 buckets, statistical noise is high. A flat profile likely means the user is context-dependent (pragmatic) rather than ideologically committed to one trap-logic.

  **Least Sure Mapping:**
  I am least sure about the **Techy** classification. In a university context, "using an app" (Techy) is often just a substitute for "making a rule" (Enforcer). For example, Q3 (Cleaning App) could easily be interpreted as an Enforcer move (surveillance) rather than a Techy move (efficiency). Users who pick Techy options might actually be Enforcers who prefer digital tools over human admins. I've tried to distinguish them by focusing on *automation* vs *authority*, but the overlap is significant.
