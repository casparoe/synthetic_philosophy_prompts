prompt: |-
  I'm on a review panel for an interdisciplinary funding programme that backs "mechanistic explanation" projects — mostly cognitive science and systems biology — and my colleague and I have the same argument every cycle. A proposal comes in that explains some higher-level capacity in lower-level terms: a spatial-navigation capacity in terms of the circuitry, an ecosystem's recovery after a perturbation in terms of population dynamics, a memory consolidation story in terms of synaptic stuff. One of us says "that's a proper crane, it does real explanatory work," the other says "that's greedy reductionism, they've explained the capacity away," and neither of us can say what would settle it. So I want actual criteria to argue from.

  What I want from you: the list of things a proposed lower-level explanation of a higher-level pattern has to deliver to count as a crane rather than a skyhook, and as a reduction rather than a greedy one. Assume the reader is a reviewer who isn't a philosopher, so for each item give the case or consideration behind it plus roughly the question you'd actually put to the proposal — "does the story say what the phenomenon is indifferent to?," "does it say where the pattern breaks down?," that kind of thing. Not "it must be consistent with fundamental physics," which is toothless, and not one big blob item called "empirically testable."

  Here's the part I'm genuinely unsure about and want you to sort out. I've started separating two ways these stories fail: the story can be *too cheap* (it keeps the vocabulary but leaves it doing no work, so the phenomenon gets dissolved rather than explained), or *too expensive* (it saves the phenomenon by wheeling in machinery whose own operation is never accounted for). I like the contrast but I can't tell weather it's really two failure modes or one failure mode seen from two sides — and I especially can't tell whether my "too cheap" test just collapses into "the higher-level claim has to survive the reduction unchanged."

  Also: mark which items are non-negotiable and which are a preference of one camp. I think one of us wants reductions to be genuine derivations and the other is happy with a mechanism sketch, and I suspect that's a taste difference rather than a requirement, but I'd like that argued. Flag any pair we can't reasonably demand at once. And tell me which single requirement does the most work at knocking proposals out — and if everything we fund fails it, which one I should relax first. Don't run any of my examples through the list, I'll do that myself, and no citations anywhere.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Review panel for interdisciplinary funding (cognitive science, systems biology). Focus on "mechanistic explanation" projects (higher-level capacity explained in lower-level terms).
      *   **Conflict:** Two reviewers disagree on whether proposals are "proper cranes" (good explanations) or "greedy reductionism" (explaining away).
      *   **Goal:** A list of criteria to distinguish good reduction (crane) from bad reduction (skyhook/greedy).
      *   **Audience:** Reviewers who aren't philosophers (practical, actionable).
      *   **Format:** For each item: Case/Consideration + Actual Question to put to the proposal.
      *   **Constraints:** No toothless criteria (e.g., "consistent with physics"), no blob items (e.g., "empirically testable"), no citations, don't run the user's examples through the list.
      *   **Specific Uncertainty:** The user distinguishes between "too cheap" (dissolving the phenomenon) and "too expensive" (importing unaccounted machinery). They want to know if these are distinct failure modes and if "too cheap" implies the higher-level claim must survive unchanged.
      *   **Labeling:** Mark items as Non-Negotiable vs. Preference (Camp A vs. Camp B). Flag incompatible pairs. Identify the single most important requirement and which to relax first if funding dries up.

  2.  **Deconstruct the Philosophical Core:**
      *   *Crane vs. Skyhook:* (Dennett's terms). Cranes build up from the bottom; Skyhooks hang from above (unexplained explainers).
      *   *Greedy Reductionism:* (Dennett again). Trying to explain everything away immediately without respecting intermediate levels.
      *   *Mechanistic Explanation:* (Craver, Bechtel, etc.). Decomposition, localization, organization.
      *   *Multiple Realizability:* Can the higher-level function exist without *this specific* lower-level substrate?
      *   *Autonomy:* Does the higher level have its own laws/patterns independent of the lower level details?
      *   *The "Too Cheap" vs. "Too Expensive" distinction:*
          *   "Too Cheap": The explanation eliminates the phenomenon (eliminativism) rather than explaining it. E.g., "Memory isn't real, it's just LTP."
          *   "Too Expensive": The explanation assumes the very thing it's trying to explain at the lower level. E.g., Explaining vision by positing a "little man" in the brain who sees the image (homunculus fallacy).
          *   *Analysis:* These *are* distinct. One fails to capture the target (loss of phenomenon); the other smuggles the target in disguised (circularity).
          *   *Does "Too Cheap" mean higher-level claim survives unchanged?* No. Often the higher-level concept gets refined. It shouldn't be *eliminated*, but it might be *revised*.

  3.  **Drafting the Criteria (Iterative Process):**

      *   *Criterion 1: Phenomenon Preservation.* The explanation must actually explain the thing it claims to.
          *   *Case:* Avoids "Too Cheap."
          *   *Question:* If the lower-level story is true, is the higher-level capacity still recognizable, or has it been redefined out of existence?
          *   *Status:* Non-negotiable.

      *   *Criterion 2: No Homunculi (Termination).* The lower-level parts shouldn't need the same capacity they are explaining.
          *   *Case:* Avoids "Too Expensive."
          *   *Question:* Do the components possess the capacity they are supposed to produce, just in disguise?
          *   *Status:* Non-negotiable.

      *   *Criterion 3: Robustness/Indifference.* The higher-level pattern shouldn't depend on every microscopic detail.
          *   *Case:* Distinguishes mechanism from mere description.
          *   *Question:* Does the story specify which lower-level details matter and which the phenomenon is indifferent to?
          *   *Status:* Non-negotiable (crucial for generalization).

      *   *Criterion 4: Interlevel Bridge.* How do we get from level A to level B?
          *   *Case:* Avoids magic jumps.
          *   *Question:* Is there a clear account of how the organization of parts generates the system behavior?
          *   *Status:* Preference (Camp A wants derivation, Camp B wants sketch).

      *   *Criterion 5: Failure Modes.* A good model predicts breakdown.
          *   *Case:* Testability without saying "testable."
          *   *Question:* Does the story predict *how* the capacity breaks if specific lower-level components are perturbed?
          *   *Status:* Non-negotiable (mechanistic specificity).

      *   *Criterion 6: Autonomy/Independence.*
          *   *Case:* Addressing the "survive unchanged" worry.
          *   *Question:* Can the higher-level description remain useful even if the lower-level implementation varies?
          *   *Status:* Preference (Camp A says no, reduce it all; Camp B says yes, keep autonomy).

  4.  **Addressing the Specific Uncertainty ("Too Cheap" vs. "Too Expensive"):**
      *   Need to explicitly answer if these are distinct. Yes.
      *   "Too Cheap" = Eliminativism (The thing isn't real).
      *   "Too Expensive" = Circularity (The thing was assumed to explain the thing).
      *   Does "Too Cheap" mean the claim survives *unchanged*? No. It means the *referent* survives. The concept might be refined. (e.g., "Memory" isn't a video tape, it's reconstruction, but "Memory" still exists).

  5.  **Addressing the "Camp Differences" (Derivation vs. Sketch):**
      *   Camp A (Strict Reductionist): Wants deduction, full coverage.
      *   Camp B (Mechanistic Pluralist): Wants working mechanism, allows black boxes at lower levels if they are grounded.
      *   *Conflict:* Demanding full derivation often kills interdisciplinary work (too hard). Demanding only sketches allows hand-waving.
      *   *Resolution:* The "Bridge" criterion is the friction point.

  6.  **Identifying the "Knockout" and the "Relax":**
      *   *Knockout:* "No Homunculi" (Circularity). If the explanation assumes what it explains, it's useless.
      *   *Relax:* "Full Derivation." If money is tight/projects are early stage, a mechanism sketch is better than a failed derivation.

  7.  **Refining the Output:**
      *   Tone: Professional, direct, reviewer-to-reviewer.
      *   Structure:
          1.  Direct answer to the "Too Cheap/Expensive" uncertainty.
          2.  The Criteria List (with Case, Question, Status).
          3.  Incompatible Pairs.
          4.  The Knockout & The Relax.
      *   Check constraints: No citations, no running user examples, no "consistent with physics."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use "Skyhook" correctly? The prompt asks for criteria to count as a crane *rather than* a skyhook. Actually, Dennett uses Skyhook as the bad thing (unexplained explainer) and Crane as the good thing (bottom-up). The prompt says "count as a crane rather than a skyhook, and as a reduction rather than a greedy one." Okay.
      *   *Check:* Did I address the "survive unchanged" worry? Yes, in the analysis section.
      *   *Check:* Are the questions actionable? "Does it specify indifference?" is good. "Is it testable?" is banned.
      *   *Check:* Camp labeling. I need to make sure I don't take sides but identify the tension.
      *   *Refinement on "Too Cheap":* It's not that the claim survives *unchanged*, it's that the *explanandum* (the thing to be explained) isn't eliminated. I need to make this distinction clear.

  9.  **Final Polish:** Ensure the distinction between "Non-Negotiable" (Scientific Integrity) and "Preference" (Philosophical Taste) is sharp. (Self-correction: Make sure the "Preference" items reflect the specific tension described in the prompt: Derivation vs. Sketch).

  10. **Final check on constraints:** "No citations anywhere." "Don't run any of my examples through the list." "Mark which items are non-negotiable and which are a preference." "Tell me which single requirement does the most work... and which one I should relax first."

      *Okay, ready to write.*
answer: |-
  ### Part 1: Resolving Your Uncertainty

  You asked whether "too cheap" and "too expensive" are distinct failure modes, and whether avoiding "too cheap" means the higher-level claim must survive *unchanged*.

  **1. They are distinct failure modes.**
  *   **Too Cheap (Eliminativism):** The proposal argues that because the lower-level story is true, the higher-level phenomenon doesn't actually exist or doesn't matter. (e.g., "There is no 'memory,' only synaptic weights.") This fails because the funding call asks for an explanation of the capacity, not a denial of it.
  *   **Too Expensive (Circularity):** The proposal explains the capacity by positing lower-level parts that already possess that capacity in disguise. (e.g., Explaining "navigation" by positing a "map-reader" neuron.) This fails because it pushes the mystery down a level without solving it.

  **2. "Too Cheap" does not require the higher-level claim to survive *unchanged*.**
  This is the crux of your disagreement. A successful reduction often *revises* the higher-level concept. It must not *eliminate* it.
  *   *Example:* A proposal might show that "memory consolidation" isn't a single process but two distinct mechanisms. The word "consolidation" survives, but its definition is sharpened.
  *   *The Criterion:* The proposal must show how the lower-level story makes the higher-level pattern *more intelligible*, not *obsolete*. If the higher-level vocabulary becomes useless after reading the proposal, it is "too cheap."

  ---

  ### Part 2: The Criteria List

  Here are the specific criteria to separate a Crane (constructive explanation) from a Skyhook (unexplained explainer), and a Mechanism from a Greedy Reduction.

  #### 1. The Non-Circularity Constraint
  *   **Case:** This addresses the "Too Expensive" failure. A mechanism cannot rely on components that already possess the systemic capacity they are meant to produce. If the parts can already do the job, you haven't explained how the job gets done; you've just hidden it inside the components.
  *   **Question to Proposal:** "Do the component parts possess the very capacity the system is supposed to explain, merely in a smaller or disguised form?"
  *   **Status:** **Non-Negotiable.** (If yes, the proposal is circular.)

  #### 2. The Indifference Specification
  *   **Case:** This addresses the "Greedy" failure. A good mechanistic story identifies which lower-level details *matter* and which do not. If the explanation implies that every microscopic detail is causally relevant, it isn't an abstraction; it's just a simulation. Real explanations identify robustness.
  *   **Question to Proposal:** "Does the story explicitly state which lower-level variables the higher-level pattern is *indifferent* to?"
  *   **Status:** **Non-Negotiable.** (Without this, you have a description, not an explanation.)

  #### 3. The Breakdown Prediction
  *   **Case:** This distinguishes a mechanism from a correlation. If you claim A produces B, you must be able to say how B fails when A is specifically perturbed. This is more specific than "testable"; it requires structural specificity.
  *   **Question to Proposal:** "If component X is altered in way Y, does the model predict a specific degradation of the capacity, or merely a general failure?"
  *   **Status:** **Non-Negotiable.** (Mechanisms must have failure modes.)

  #### 4. The Bridge Derivation
  *   **Case:** This is the main friction point. One camp wants to see the higher-level laws derived mathematically or logically from the lower-level rules. The other camp accepts a qualitative "mechanism sketch" where the link is plausible but not formally deduced.
  *   **Question to Proposal:** "Is the transition from component behavior to system behavior formally derived, or is it asserted based on plausibility?"
  *   **Status:** **Preference.** (Camp A demands derivation; Camp B accepts a sketch if constraints 1–3 are met.)

  #### 5. The Autonomy Test
  *   **Case:** This addresses your worry about the higher-level claim surviving. One camp believes the higher-level description should remain useful even if the lower-level implementation changes (multiple realizability). The other believes the lower-level story should eventually replace the higher-level vocabulary.
  *   **Question to Proposal:** "If the lower-level substrate were swapped for a different one that produced the same output, would the higher-level explanation still hold?"
  *   **Status:** **Preference.** (Camp A says 'No, the substrate is the explanation'; Camp B says 'Yes, the function is the explanation'.)

  #### 6. The Vocabulary Retention Check
  *   **Case:** This addresses the "Too Cheap" failure. After accepting the lower-level story, must we stop using the higher-level terms? If the proposal implies the higher-level term is a "folk illusion," it is eliminativist.
  *   **Question to Proposal:** "Does accepting this explanation render the original higher-level description false, or does it refine it?"
  *   **Status:** **Non-Negotiable.** (If it renders it false, it is not an explanation of that phenomenon; it is a replacement.)

  ---

  ### Part 3: Incompatible Pairs & Trade-offs

  You cannot reasonably demand the following pairs simultaneously. If your panel insists on both, you will fund nothing.

  **Pair 1: Full Bridge Derivation (Item 4) + High Interdisciplinary Scope**
  *   **Conflict:** Deriving higher-level cognitive or biological patterns from lower-level physics/biology is mathematically intractable for complex systems. Demanding formal derivation (Camp A's preference) effectively bans interdisciplinary work, restricting funding to projects where the math is already solved.
  *   **Resolution:** Accept "mechanism sketches" (qualitative causal chains) provided they satisfy the *Breakdown Prediction* (Item 3).

  **Pair 2: Autonomy Test (Item 5) + Greedy Reduction Goals**
  *   **Conflict:** You cannot demand that the higher-level description remain fully autonomous (Camp B's preference) while simultaneously funding projects whose explicit goal is to reduce that level to the lower one. If the reduction is successful, the higher-level description usually loses some independence.
  *   **Resolution:** Agree that the goal is *integration*, not elimination. The higher level is refined, not preserved in amber.

  ---

  ### Part 4: The Knockout and The Relax

  **The Single Requirement That Does The Most Work:**
  **The Indifference Specification (Item 2).**
  *   **Why:** This is the sharpest tool for distinguishing a "Crane" from a "Skyhook." A Skyhook explains a pattern by appealing to lower-level details that are just as complex as the pattern itself (no compression). A Crane explains a pattern by showing how simple parts, organized specifically, create complexity while ignoring irrelevant details. If a proposal cannot say what *doesn't* matter, it hasn't explained *what* matters. It is likely just a redescription.

  **If Everything Fails It, Which One To Relax First:**
  **The Bridge Derivation (Item 4).**
  *   **Why:** This is the "taste" difference between your two camps. Camp A wants a proof; Camp B wants a plausible story. In early-stage interdisciplinary funding, demanding formal derivation kills innovation because the math often doesn't exist yet.
  *   **Condition:** You can only relax this if **The Breakdown Prediction (Item 3)** is strong. If they can't derive the result, they must be able to predict exactly how the system breaks. This ensures the "sketch" is grounded in causal reality, not just hand-waving.

  **Summary for your Colleague:**
  If the proposal dissolves the phenomenon (Too Cheap), reject it (Item 6). If the proposal smuggles the phenomenon into the parts (Too Expensive), reject it (Item 1). If the proposal treats every detail as causal, reject it (Item 2). If they can't derive the math but can predict the breakdown, fund it (Relax Item 4, Keep Item 3).
