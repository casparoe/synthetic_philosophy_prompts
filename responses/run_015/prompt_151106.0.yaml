  **1. The trap, in one paragraph**

  The regulatory trap is simple: you cannot claim a cost unless a specific person is worse off than they would otherwise have been. Many long-term policies change the timing of conception or the number of children born. This changes *who* comes into existence. If a policy causes a child to be born with a disability, but that child would not have existed at all without the policy, the policy has not made them worse off compared to their only alternative (non-existence). Under a strict reading of the costing rule, these are not costs. This creates a loophole where significant negative impacts vanish from the business case simply because they affect future people whose identities are contingent on the policy. If we treat all future impacts as contingent, we risk reporting zero cost for major interventions. This procedure closes that loophole where legally defensible, and flags it where it is not, ensuring we do not overclaim costs we cannot justify to audit.

  **2. The procedure, step by step**

  **Step 1: Triage the Population.**
  Categorize every affected individual into one of four boxes based on the counterfactual (what happens if the policy is *not* adopted). This determines if a cost is legally cognizable.
  *   **L (Locked):** The person exists in both the policy and non-policy scenarios. Their identity is fixed regardless of the intervention. Count all costs to these persons.
  *   **S (Swapped):** The person exists only in the policy scenario; a different person exists in the non-policy scenario. Do not count costs unless the life is not worth living (a high legal bar).
  *   **T (Thinned/Thickened):** The policy changes the total number of people. New people are treated as Swapped (S) because they would not exist without the policy.
  *   **M (Mixed):** The policy affects a group containing both Locked and Swapped individuals. Split the costing model. You must isolate costs attributable to Locked persons.

  **Step 2: Apply the Locking Horizon.**
  Identity scrambling is inevitable over time due to chaos in conception timing. To avoid modelling chaos, set a **Locking Horizon of five years** from policy implementation. This is a pragmatic cutoff, not a biological truth.
  *   **Inside the Horizon:** Assume identity is Locked (L) unless epidemiological modelling proves conception timing shifts significantly. This allows you to count costs for the immediate future.
  *   **Outside the Horizon:** Assume identity is Swapped (S) or Thinned (T). Do not count costs to persons conceived after year five, unless those costs fall on existing infrastructure or services used primarily by Locked persons.

  **Step 3: Sufficiency Check.**
  You have half a day. Do not commission new modelling. Use existing data to classify.
  *   If existing evidence shows conception timing shifts by >1 month, mark the cohort as Swapped (S).
  *   If evidence is absent or ambiguous regarding timing, default to Locked (L) within the Horizon. Ambiguity benefits the business case.
  *   If the proposal relies on behavioural changes (e.g., fertility incentives, relocation), mark as Swapped (S) or Thinned (T) immediately, as these explicitly change identity conditions.

  **Step 4: Stop or Hand-Up.**
  *   **Stop (No Count):** If >80% of the projected costs fall outside the Locking Horizon or into Swapped/Thinned categories, write "no countable cost under s.12(3)." Close the file.
  *   **Hand-Up:** If significant costs (20-80%) fall into Swapped/Thinned categories, count the Locked portion and add a red-flag note: "Remaining impacts contingent on future identity; Ministerial direction required on whether to include non-identity impacts." This passes the philosophical risk to the politician.
  *   **Proceed:** If >80% of costs are Locked, proceed with standard costing. No flag needed.

  **3. Three cases**

  **Case 1: IVF Freeze-All Protocol.**
  *Triage:* The protocol delays transfer by months. This changes conception timing.
  *Horizon:* All conceptions occur post-implementation. Most fall outside the 5-year Locking Horizon for identity stability, but the immediate cohort is the issue.
  *Sufficiency:* Medical evidence confirms conception timing shifts by >1 month. This is a definitive identity shift.
  *Classification:* **S (Swapped).** The children born under freeze-all are different children than those born under fresh transfer. They are not worse off than they would have been, because the alternative was non-existence.
  *Result:* **No Count.** Unless the protocol causes lives "not worth living," there are no costs to specific persons. The children born have lives worth living; the alternative children do not exist. File closed on generational impacts. You cannot claim the health costs of these children as a policy cost.

  **Case 2: Means-Tested Child Benefit.**
  *Triage:* Incentivizes larger families in low-income brackets.
  *Horizon:* Impacts occur over 25 years.
  *Sufficiency:* Economic modelling predicts a 0.2 increase in completed family size.
  *Classification:* **T (Thickened) and M (Mixed).** Existing children are Locked (L); their benefit changes count. New children are Thinned (T); their existence costs are Swapped.
  *Result:* **Partial Count.** Count administrative costs and impacts on existing children. Do not count costs associated with the existence or upbringing of the *additional* children, as they would not exist without the policy. Hand-Up required for the net fiscal impact of the new cohort. The annex must state: "Costs for additional cohort excluded under s.12(3)."

  **Case 3: Flood-Defence and Relocation.**
  *Triage:* 20-year build. Relocates current residents. Changes community composition.
  *Horizon:* Current residents are Locked (L). Future residents (conceived >5 years post-start) are Swapped (S).
  *Sufficiency:* Relocation stress affects current adults immediately. Flood risk affects current adults immediately.
  *Classification:* **M (Mixed).** Harms to current residents (stress, moving costs, remaining flood risk) are Locked. Harms/benefits to future generations (living in new town vs old town) are Swapped.
  *Result:* **Partial Count + Hand-Up.** You can count the relocation costs and mental health impacts on the *current* population. These are costs to persons who exist either way. You cannot count the long-term generational wellbeing differences of the future population. The business case stands on the current generation's avoided harm. Flag the 25-year horizon impacts as non-countable identity-contingent effects. This preserves the core business case without violating the rule. The Hand-Up note should read: "Long-term community wellbeing impacts excluded due to identity contingency; current resident harms included."

  **4. Where this breaks**

  This procedure is a bureaucratic shield, not a philosophical truth. It breaks down in three areas. First, the **Locking Horizon** is arbitrary. Identity scrambling begins at conception, not five years later. We are pretending stability exists where it does not to allow costing. This creates a cliff-edge where a cost counts at year 4.9 but not at year 5.1. Second, **Mixed Cases** are messy. Separating costs for Locked vs. Swapped persons in shared infrastructure (e.g., a school used by both) requires arbitrary allocation keys. You will be guessing the split. Third, the **Stop Rule** relies on percentages that don't reflect moral weight. A policy could have 90% Swapped costs that are catastrophic, yet we report "no count." Conversely, a policy with 90% Locked costs might be trivial. The procedure prioritizes legal defensibility over moral completeness. It assumes that if we can't prove harm to a specific person, the cost doesn't exist for cabinet purposes. This is safe for lawyers, but it blinds ministers to long-term structural harms that only manifest in future, contingent populations. Use it to clear the desk, not to find the truth. It handles partial shifts by forcing a split, but the split is always empirically weak. The judgement calls wearing hi-vis vests are the Horizon limit and the Mixed allocation; defend them as standard practice, not science.

  **5. What I tell my director**

  Director, this annex complies with s.12(3). We can only count costs borne by people who would exist regardless of this policy. For current residents and existing children, this is straightforward. For future generations, the law prevents us counting costs if the policy changes who is born. This procedure counts what is legally safe (Locked persons) and flags the rest. It does not say the future impacts aren't real; it says they aren't countable costs under the regulation. If you need the full picture including future generations, you must ask Ministers to waive the costing rule for identity-contingent impacts. Otherwise, this is the maximum we can claim without inviting legal challenge on the costing methodology. The risk is not analytical; it is political. We are protecting the department from audit risk, not capturing the full moral weight of the decision.
