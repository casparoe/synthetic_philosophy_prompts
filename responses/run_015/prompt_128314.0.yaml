answer: |-
  Here are ten questions drafted for your run-sheet, complete with follow-ups that anticipate her standard replies. I've kept the tone conversational but sharp, and ensured the spelling and phrasing are properly British.

  **1. The Core Claim: Asymmetric Reciprocity vs. Liberal Equality**
  **Q:** Let's start with the headline idea. You're defending what you call 'asymmetric reciprocity'. Now, the liberal critic looks at Confucian roles and sees a deficit of equality—they want mirror-image obligations. You're saying that misses the point entirely. But if the obligations aren't mirror-images, what stops this from just being hierarchy with a nicer name?
  **Follow-up:** *She'll likely say it's about 'different but complementary' contributions rather than rank. Push here:* 'But if I owe you obedience and you owe me care, isn't the power still fundamentally tilted? How does the junior party actually hold the senior party to account without stepping outside the role?'

  **2. The Limits of *Xiao*: Abuse and Absence**
  **Q:** I want to press you on the parent-child relation, specifically *xiao*. In the standard reading, the child owes the parent regardless. But what happens when the parent is abusive or entirely absent? Does the asymmetry just collapse, or does the obligation persist in some ghostly form?
  **Follow-up:** *She'll probably argue that *xiao* is about cultivating oneself regardless of the other's failure. Push here:* 'That sounds incredibly demanding on the victim. If the ritual structure requires two parties, doesn't an abusive parent break the ritual container itself, freeing the child from the role?'

  **3. Modern Caregiving: Foster Parents and AI**
  **Q:** You've mentioned elsewhere that *li*—ritual propriety—isn't just about biology. But let's stretch that. If we look at modern non-biological caregiving, say foster parents or even AI companions we might care for in the future: does stretching *li* that far break the ritual structure, or is the role entirely defined by the care given?
  **Follow-up:** *She'll likely say the function matters more than the biology. Push here:* 'But Confucianism is deeply rooted in lineage and ancestry. If you sever the biological tie completely, aren't you essentially smuggling in a liberal contractual view of care under a Confucian label?'

  **4. Care Ethics: Relationality vs. Ritual**
  **Q:** There's a natural affinity between your view and Western care ethics. You've said before that care ethics gets the relationality right but misses the ritual dimension. Why is that distinction so vital? Why isn't 'care' enough on its own?
  **Follow-up:** *She will almost certainly reply that ritual isn't mere performance, it's recognition. Push here:* 'If ritual is recognition, doesn't that require the other party to recognise you back? So if I perform the ritual of care towards someone who cannot recognise me—like a dementia patient or an AI—am I still in a moral relation, or just monologuing?'

  **5. Role Conflict: The Loyal Minister vs. The Filial Son**
  **Q:** Let's talk about role conflict. In the Analects, there's that tension between being a loyal minister and a filial son. If every role-relation is its own normative world, how do we resolve those clashes without sneaking in a universal principle to adjudicate between them?
  **Follow-up:** *She'll likely argue for 'contextual judgement' or *yi* (righteousness) rather than a universal rule. Push here:* 'But without a higher-order principle to weigh the roles, doesn't that judgement just become arbitrary? How do we know it's wisdom and not just preference?'

  **6. Pushing Back on the 'Harmony' Reading**
  **Q:** You're also pushing back against the usual 'harmony' readings of the five relationships. Critics say Confucianism smooths over conflict to maintain social order. You seem to suggest there's friction built into the asymmetry. Where does that friction live?
  **Follow-up:** *She'll likely say harmony is a dynamic achievement, not a static state. Push here:* 'If friction is built-in, though, doesn't that legitimise dissent within the family? Because traditionally, hasn't 'harmony' been used to silence the junior party precisely to avoid that friction?'

  **7. Moral Autonomy and Self-Cultivation**
  **Q:** A common worry from the liberal side is that role ethics swallows the individual. If I'm just a node in a network of relations, where does *my* moral autonomy sit? Does asymmetric reciprocity stunt the junior party's growth towards becoming a *junzi*?
  **Follow-up:** *She'll likely argue that one becomes a person *through* the roles, not prior to them. Push here:* 'But surely there must be a 'self' capable of choosing to inhabit the role authentically? Otherwise, aren't we just describing social conditioning rather than ethical cultivation?'

  **8. The Mechanism of Remonstrance**
  **Q:** You mentioned accountability earlier. In the Confucian tradition, there's the concept of remonstrance—correcting a superior. But in an asymmetric structure, doesn't correcting a parent or ruler risk undermining the very respect the role requires?
  **Follow-up:** *She'll likely say remonstrance is the highest form of loyalty. Push here:* 'That's the ideal, yes. But in practice, doesn't the asymmetry of power make remonstrance costly enough that only the privileged can afford to be 'loyal' in that way?'

  **9. Scaling Up: From Family to State**
  **Q:** Historically, the family model was scaled up to the state—the ruler as father, subjects as children. You're defending the family model, but do you want that logic to scale to modern citizenship? Or does asymmetric reciprocity break when applied to the state?
  **Follow-up:** *She'll likely argue for a distinction between political and familial roles. Push here:* 'If they are distinct, though, doesn't that weaken your claim that role ethics is a comprehensive moral system? It sounds like you're compartmentalising to avoid the authoritarian critique.'

  **10. The Future of Role Ethics**
  **Q:** Finally, where do you see this going? If we accept asymmetric reciprocity, what's the most radical change we'd see in our current social programmes or legal frameworks?
  **Follow-up:** *She'll likely suggest a shift towards responsibility over rights. Push here:* 'But in a pluralistic society, wouldn't prioritising responsibility over rights leave vulnerable groups exposed if the 'superiors' fail to uphold their end of the asymmetry?'
