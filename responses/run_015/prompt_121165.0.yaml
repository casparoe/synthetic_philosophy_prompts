answer: |-
  Here is a specification for a theory of emotion tailored to annotation viability. The goal is not truth, but *operationalizability*. If a theory cannot distinguish these cases in principle, your annotators will not be able to distinguish them in practice, and your inter-annotator agreement will collapse.

  ### Part 1: The Desiderata

  **1. The Divergence Principle (Self-Report vs. Cue)**
  *   **Concrete Case:** A speaker says "I am not angry" while slamming a cup and exhibiting elevated pitch.
  *   **Requirement:** The theory must allow for the possibility that the subject is incorrect or deceptive about their own state, and must provide criteria for identifying the emotion independent of the subject's explicit avowal.
  *   **Why:** In dialogue annotation, you are often coding from the outside. If a theory defines emotion *strictly* as a first-person judgment or feeling, you cannot tag this instance as anger without violating the theory. You need a framework that permits third-person attribution.
  *   **Status:** **Non-Negotiable** (for annotation). Without this, you cannot code sarcasm, repression, or deception.

  **2. The Existence Independence Principle**
  *   **Concrete Case:** Fear triggered by a noise that turns out to be the cat; dread triggered by a chord progression.
  *   **Requirement:** The theory must decouple the *reality* of the intentional object from the *presence* of the emotion. The emotion must be valid even if the object is non-existent, abstract, or misidentified.
  *   **Why:** If your scheme requires the annotator to verify the ontological status of the trigger (e.g., "Is there actually a threat?"), you introduce an impossible verification step. The emotion exists in the dialogue regardless of the world state.
  *   **Status:** **Non-Negotiable**. Dialogue is often about hypothetical or mistaken worlds.

  **3. The Intentionality-Belief Decoupling**
  *   **Concrete Case:** Being moved to tears by a scene the subject knows is staged/fictional.
  *   **Requirement:** The theory must allow the subject to hold an emotional attitude toward an object without believing the propositions associated with that object are true (e.g., "I know this character isn't real, but I fear for them").
  *   **Why:** If the theory requires belief for emotion, you cannot annotate engagement with fiction, roleplay, or hypothetical reasoning without labeling it "not emotion."
  *   **Status:** **Camp Commitment** (Judgment theories struggle here; Perceptual/Attitudinal theories handle it). This is a theoretical landmine.

  **4. The Temporal Granularity Principle**
  *   **Concrete Case:** Distinguishing "I am grieving" (occurrent episode) from "I am a grieving person" (standing state) from "I am in a gloomy mood" (background).
  *   **Requirement:** The theory must provide distinct criteria for episodic onset/offset versus dispositional traits versus diffuse moods.
  *   **Why:** Annotation spans vary. If you tag a week-long state the same way you tag a 3-second reaction, your temporal segmentation is meaningless.
  *   **Status:** **Non-Negotiable**. Essential for time-stamping.

  **5. The Expression-Experience Decoupling**
  *   **Concrete Case:** A speaker smiles while describing a tragedy (masking) vs. a speaker shouts without feeling anger (acting).
  *   **Requirement:** The theory must treat the behavioral output (expression) as distinct from the internal state (experience) and the functional role (having).
  *   **Why:** If expression equals emotion, you cannot code masking. If feeling equals emotion, you cannot code acting. You need three separate slots in your schema.
  *   **Status:** **Non-Negotiable**. Critical for multimodal dialogue.

  **6. The Target Flexibility Principle**
  *   **Concrete Case:** Anger directed at a chatbot; grief directed at a dead relative.
  *   **Requirement:** The theory must permit intentional objects that lack agency or existence without reclassifying the state as something else (e.g., "quasi-emotion").
  *   **Why:** NLP systems interact with non-humans constantly. If your theory says you can't be angry at a script, your annotation scheme breaks on human-AI dialogue.
  *   **Status:** **Non-Negotiable** (for NLP context).

  ---

  ### Part 2: Incompatible Pairs (The Trade-Offs)

  You cannot maximize all these desiderata simultaneously. Here are the tensions you will have to resolve in your guidelines.

  **Tension A: First-Person Authority vs. Third-Person Observability**
  *   **The Conflict:** This pits **Desideratum 1 (Divergence)** against the intuitive pull of **Phenomenological Privacy**.
  *   **The Problem:** If you prioritize the subject's word ("I'm not angry"), you respect First-Person Authority but lose the ability to code unconscious bias or deception. If you prioritize the cues (slammed cup), you respect Observability but risk imposing external categories on internal states.
  *   **Annotation Consequence:** You must decide whose ontology wins when they clash. Most schemes implicitly choose Observability, but this theoretically invalidates the subject's perspective. You cannot have a theory that says "Only the subject knows" and an annotation scheme that says "Code the slam."

  **Tension B: Object-Directedness vs. Objectless Feeling**
  *   **The Conflict:** This pits **Desideratum 6 (Target Flexibility)** against **Desideratum 4 (Mood vs. Emotion)**.
  *   **The Problem:** Standard definitions distinguish Emotion (has an object) from Mood (no specific object). However, your "chord progression dread" case is an emotion-like episode with no clear object.
  *   **Annotation Consequence:** If you insist all emotions have objects, you must force annotators to find an object for the dread (e.g., "dread of the next note"), which may be artificial. If you allow objectless emotions, the distinction between Mood and Emotion collapses, making your temporal segmentation (Desideratum 4) unstable. You cannot strictly maintain the Mood/Emotion boundary while accommodating objectless episodic feelings.

  ---

  ### Part 3: Theory Evaluation

  Here is how the three major camps fare against your spec.

  **1. The Judgment (Cognitive Appraisal) View**
  *   *Core Claim:* Emotions are judgments or evaluations about the world (e.g., Anger = judgment that I was wronged).
  *   *Performance:*
      *   **Fails:** **Intentionality-Belief Decoupling.** If emotion is a judgment, I cannot be afraid of what I know isn't there (the cat noise) or moved by what I know is fake (the staged scene). To code these, you have to claim the subject is making a "false judgment," which contradicts the case setup (they *know* it's a cat/fake).
      *   **Fails:** **Divergence Principle.** If emotion is a conscious judgment, the subject is the ultimate authority. If they say "I'm not angry," they aren't judging themselves wronged, so they aren't angry. You cannot code the slammed cup as anger without contradicting the theory.
      *   **Passes:** Target Flexibility (can judge a chatbot as offending).

  **2. The Perceptual / Attitudinal View**
  *   *Core Claim:* Emotions are perceptions of value or attitudes toward objects (like seeing something as dangerous, not necessarily judging it is).
  *   *Performance:*
      *   **Passes:** **Intentionality-Belief Decoupling.** I can perceive a fictional scene as sad without believing it is real (like seeing a stick as a snake). Handles the chord progression well (perceiving the music as threatening).
      *   **Passes:** **Divergence Principle.** I can perceive myself as calm while my body perceives threat. Allows for the "I'm not angry" mismatch.
      *   **Struggles:** **Temporal Granularity.** Perceptions can be fleeting or sustained; the line between a "perceptual episode" and a "perceptual mood" is often as blurry as the emotion/mood distinction.
      *   **Best Fit:** This view generally offers the highest ceiling for annotation schemes because it separates the *appearance* of value from the *fact* of value.

  **3. The Feeling / Somatic View**
  *   *Core Claim:* Emotions are perceptions of bodily changes (heart rate, tension) or raw feels.
  *   *Performance:*
      *   **Passes:** **Existence Independence.** My heart races regardless of whether the noise is a cat or a burglar.
      *   **Fails:** **Expression-Experience Decoupling.** If emotion *is* the feeling, and I don't feel it (numbness), I don't have the emotion. This makes coding "repressed grief" impossible.
      *   **Fails:** **Specific Distinctions.** Somatic profiles for Grief and Relief often overlap (release of tension). If your scheme requires distinguishing these labels, a pure somatic theory lacks the resolution to justify the difference without importing cognitive context.
      *   **Kills:** **Target Flexibility.** It is hard to explain how a bodily feeling is "about" a chatbot without importing intentionality from another theory.

  ---

  ### Part 4: The Killer Requirement

  The single requirement that kills the most candidates is **The Intentionality-Belief Decoupling** (Case: Moved by a scene you know is staged).

  **Why:**
  This is the "Paradox of Fiction."
  *   **Judgment theories die here.** They cannot explain why we feel without belief. To save the theory, they must argue we temporarily suspend belief, but your case specifies the subject *knows* it is staged.
  *   **Strict Somatic theories stumble here.** They can explain the arousal, but they struggle to explain why the feeling is *about* the scene and not just a random bodily spike, without smuggling in cognitive appraisal.
  *   **Behaviorist theories die here.** If there is no real object to react to, the behavior is "maladaptive" or "conditioned," not emotional in the standard sense.

  Only theories that treat emotions as **perceptual-like** or **imaginative engagements** survive this. If you adopt an annotation scheme based on a theory that fails this, you will be forced to label all engagement with fiction, roleplay, and hypothetical dialogue as "null" or "pseudo-emotion," rendering your dataset useless for modern NLP tasks involving storytelling or AI interaction.

  **Recommendation:** Do not try to solve the tension between **First-Person Authority** and **Third-Person Observability** theoretically. Solve it procedurally in your guidelines. Decide explicitly: "In cases of conflict between text and cue, cue wins." That is an annotation decision, not a philosophical one, and it saves you from needing a perfect theory of mind.
