ly confident that the standard reading of Kant focuses on psychological spillover and hardness of heart as found in the Lecture on Ethics but I am less certain about the specific claim that Maren's lawgiving-structure interpretation is explicitly textual rather than a reconstructive innovation because while Kant says duties regarding animals are duties to oneself the leap to preserving the structure of moral lawgiving sounds like a sophisticated modern synthesis that might be partly your invention or hers rather than something Kant wrote down in those exact terms so you might want to have a footnote ready if a grad student presses you on the distinction between analogous duties and the architecture of autonomy but overall this draft should strike the right balance of warmth and rigor without sounding like a eulogy since she is thankfully still with us to hear it and I hope the workshop goes smoothly for you.
