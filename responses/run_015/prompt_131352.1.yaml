  I'm a physics PhD student (observational cosmology-adjacent, though my actual thesis is pretty far from this) and I've only ever run into anthropic reasoning informally, definately not in any course. A senior grad student on the astro side of the building posted a short explainer of self-sampling vs. self-indication to our group chat and everyone else seemed to take it as authoritative. Here it is, more or less verbatim:

  "SIA says: think of yourself as a random draw not from the people who actually exist but from all the people who could have existed. So a universe with a trillion times more people in it is a trillion times more likely to be the one you find yourself in, because there are a trillion times more slots you could have turned out to occupy. SSA is the timid version — it draws you from the actual observers only. That's what drives the doomsday argument: if humanity dies out soon, an early birth rank like ours is just what you'd expect, whereas if we go on for trillions of years our rank is freakishly early. And SIA makes the doomsday argument worse, not better, since it piles an extra anthropic penalty onto the short-life hypothesis — fewer people, so less likely you'd find yourself here. Really the two assumptions are just one dial: how wide do you draw the reference class, everyone actual or everyone possible? Wind it all the way out and SSA turns into SIA. That's the entire dispute. And it's why the presumptuous philosopher case settles things against SIA: the philosopher tells the astronomers not to bother building the telescope, because the trillion-to-one anthropic bonus for the big universe swamps anything the instrument could have told them. Once you accept self-indication, no amount of ordinary evidence can compete with the multiplier."

  Two bits make me suspicious — that SIA strengthens the doomsday argument, and that SSA and SIA are just a reference-class dial you can wind out — but I cant tell whether I'm disagreeing with the views or with his version of them, and I don't trust myself to do the bookkeeping.

