          *   Likelihood $P(E | H, SSA)$: Probability of being rank $n$ given total $N$. Assuming uniform distribution over ranks $1..N$.
          *   $P(E | H_S) = 1/100$.
          *   $P(E | H_L) = 1/10^{12}$.
          *   Posterior Odds: $\frac{P(H_S|E)}{P(H_L|E)} = \frac{P(H_S)}{P(H_L)} \times \frac{1/100}{1/10^{12}} = 1 \times 10^{10}$.
          *   Result: Strongly favors Small (Doomsday).
      *   **SIA Calculation:**
          *   SIA modifies the prior (or acts as a likelihood factor proportional to $N$). Let's treat it as a prior update before SSA conditioning, or combine into the likelihood. Standard formalism: $P_{SIA}(H) \propto P(H) \times N$.
