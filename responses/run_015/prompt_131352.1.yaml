      *   SIA weights by $N_{ref}$.
      *   They are mathematically distinct operations. One divides by $N$, one multiplies by $N$. You cannot turn division into multiplication by just changing the definition of $N$ (unless you allow $N$ to be imaginary or something nonsensical).
