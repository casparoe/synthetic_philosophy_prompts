          *   *Analysis:* **MISLEADING/WRONG.** SSA and SIA are distinct principles regarding how to update probabilities. SSA is about conditional probability within a world ($1/N$). SIA is about weighting worlds by $N$. They are not just reference class width. While reference class matters for both, turning the dial doesn't transform the mathematical operation of SSA into SIA.
