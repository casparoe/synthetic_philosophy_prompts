answer: |-
  In a high-stakes oncology ward, Dr. Aris follows Rule T: "Disclose full prognostic certainty immediately to all patients," a policy empirically shown to maximize long-term institutional trust and average patient autonomy across a population. Dr. Ben is an act consequentialist. When Mr. Miller, a severely depressed terminal patient, is admitted, Ben softens the truth to prevent immediate suicide, securing a peaceful final week. Aris, bound by Rule T, discloses the grim timeline explicitly despite knowing Miller's fragility, arguing that undermining the rule harms future patients more than helping Miller helps him. Miller overdoses that night. Aris's adherence to the optimal general rule generated a "moral overdraft"—the cumulative obligation to maintain systemic truthfulness outweighed the specific duty of care in this instance, making Aris appear more ruthless than Ben, who sacrificed abstract trust for concrete welfare.

  **Analysis of Views**
  **Act Consequentialism (AC)** evaluates only the immediate causal chain. Since telling the truth leads to suicide and lying leads to a peaceful week, AC mandates withholding the full prognosis. The right action is determined solely by the net welfare in this specific token case. **The Deontological Rule (DR)** evaluates the action based on adherence to Rule T. Even though the outcome here is worse, the rule is justified by its aggregate success over time. The "moral overdraft" occurs because the rule carries the weight of all past and future instances where truth-telling preserved trust; Aris pays into this systemic account even when the local cost is catastrophic. **A Moderate Threshold View (MTV)** holds that rules are binding unless the cost of following them exceeds a significant threshold. Here, MTV likely sides with AC, judging that a preventable suicide crosses the threshold where the rule's presumption is overridden. The ruthlessness of DR arises because it refuses to recognize the threshold, treating the cumulative weight of the rule as lexically superior to the immediate harm.

  **Feature Doing the Work**
  The operative feature is the **temporal and distributive mismatch** between the rule's benefits and its costs. The benefits of Rule T (institutional trust, average autonomy) are diffuse, long-term, and systemic, while the costs (Miller's despair and death) are concentrated, immediate, and local. The "moral overdraft" is the philosophical pressure exerted by the aggregated future benefits pressing down on the present victim.

  **Removing the Feature**
  If you remove this mismatch—for example, if telling the truth provided an immediate benefit to Miller (e.g., allowing him to settle affairs he uniquely values) or if the harm to trust was immediate and local (e.g., Miller's family immediately sues the hospital)—then AC, DR, and MTV would converge. The ruthlessness disappears because the rule's optimization aligns with the act's optimization.

  **Confidence and Uncertainty**
  I am **85% confident** in this analysis. The structural flip of the demandingness objection works cleanly here: instead of morality demanding too much of the agent (the usual objection), the rule demands too much of the patient. The point I am **least sure about** is whether Rule T can genuinely be classified as "optimal" if it permits preventable suicides in edge cases. A sophisticated rule deontologist might argue that a truly optimal rule would include a caveat for severe psychological harm, which would dissolve the thought experiment by making Aris's adherence irrational rather than dutiful. However, if we stipulate that adding such caveats erodes the rule's clarity and thus its systemic utility, the tension holds.
