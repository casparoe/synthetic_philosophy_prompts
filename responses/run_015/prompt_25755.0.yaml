  1.  **Analyze the Request:**
      *   **Topic:** Rationality and Practical Reason (Upper-level seminar).
      *   **Specific Concept:** Parfit's Hitchhiker / Rational Irrationality / Credible Commitment / Newcomb-like problems (specifically the tension between act-utilitarianism/rationality vs. disposition-based rationality).
      *   **Class Size:** ~16 students.
      *   **Time:** 75 minutes total (activity needs to fit within this, leaving time for lecture/debrief).
      *   **Goal:** An in-class activity/game with *real stakes* (small but meaningful) that forces students to feel the problem *before* naming it.
      *   **Requirements:** Rules, roles, timeline, debrief (mapping to philosophical concepts), prediction of failure modes, and limitations of the simulation compared to Parfit's original case.

  2.  **Deconstruct Parfit's Hitchhiker:**
      *   *Scenario:* Agent is dying in desert. Driver passes by. Driver will only save Agent if Agent promises to pay \$1000 upon reaching town. Agent knows that once in town, paying \$1000 reduces utility with no further benefit (Driver can't punish). Standard rationality says "Don't pay." Driver knows this (or predicts it). Driver leaves Agent to die.
      *   *Philosophical Tension:* Act-based rationality (maximize utility at the moment of action) vs. Disposition-based rationality (be the kind of person who keeps promises, even when costly).
      *   *Key Constraint:* Transparency/Predictability. The Driver must be able to *tell* if the Agent is a liar.

  3.  **Brainstorming the Activity:**
      *   *Challenge:* How to simulate "transparency of character" in a 75-minute class with strangers?
      *   *Idea 1:* Written promises. (Too weak, no stakes).
      *   *Idea 2:* Repeated games. (Good for trust, but Parfit's case is one-shot).
      *   *Idea 3:* "Lie Detection" mechanic. Use peers to judge sincerity.
      *   *Idea 4:* Pre-commitment device. Allow students to bind themselves *before* the rescue.
      *   *Selected Approach:* A two-stage game with a "Prediction/Screening" phase and a "Payout" phase. Use course points or candy/cash for stakes. Let's go with course participation points or a small raffle entry, as cash can be ethically tricky and candy is too trivial. Let's suggest a "Raffle for a Prize" (e.g., a \$20 gift card or getting out of a small assignment) to keep it clean.
      *   *Refinement:* To capture the "transparency" aspect, the "Driver" needs to be able to reject the "Hitchhiker." But in a classroom, everyone wants the reward.
      *   *Better Structure:* Divide class into Pairs (Driver/Hitchhiker). But Parfit's case is about *self*-binding.
      *   *Best Structure:* A "Trust Game" variant with a "Character Check."
      *   *Wait, the core is:* Can you convince someone you will pay *when you won't want to*?
      *   *Revised Plan:* "The Desert Crossing."
          *   Roles: Travelers (Hitchhikers) and Guides (Drivers).
          *   Stakes: Entry into a raffle for a desirable prize (e.g., skipping a reading, gift card).
          *   Mechanism: Travelers need Guides to get the ticket. Guides give tickets only if convinced Traveler will share the prize later. Travelers *can* choose to share or keep all.
          *   Crucial Twist: Guides get a bonus *only* if they correctly predict who will share. This incentivizes them to be "Parfitian Drivers" (only save those who will pay).

  4.  **Developing the Mechanics (The "Desert Crossing" Game):**
      *   *Setup:* 16 students. 8 Guides, 8 Travelers.
      *   *Endowment:* Travelers start with nothing. Guides start with "Rescue Tokens."
      *   *Goal:* Get points/tickets.
      *   *Phase 1 (Negotiation):* Travelers ask for Rescue. Guides can give a Token.
      *   *Phase 2 (The Town):* If Traveler gets Token, they get 10 Points. Guide gets 0 *unless* Traveler shares.
      *   *Phase 3 (Repayment):* Traveler can give 5 Points back to Guide. (Rational choice: Keep 10, give 0).
      *   *The Parfitian Kicker:* Guides are told: "You get 5 Points *only if* you rescue someone who repays you. If you rescue someone who doesn't repay, you get -2 Points (cost of gas)." This makes them selective.
      *   *Transparency:* How does the Guide know? They get 2 minutes to interview the Traveler.
      *   *Stakes:* Points convert to raffle tickets for a prize.

  5.  **Refining for "Rational Irrationality":**
      *   The problem is that in a one-shot game, *everyone* knows the rational move is to defect.
      *   To make them *feel* the bind, I need to allow a "Pre-commitment" option for some, or highlight the inability to commit.
      *   *Actually, let's simplify.* Make it a single group dynamic first, then pairs.
      *   *No, Pairs are better for the "Driver knows you" aspect.*
      *   *Let's try this:* The "Transparent Box" variation.
      *   *Wait, the prompt asks for "Rational Irrationality" specifically.* This implies the agent might want to *become* irrational to get the benefit.
      *   *Activity Adjustment:* Allow students to write a "Contract" or make a "Vow" *before* the rescue, but make it non-binding. Then see if they stick to it.
      *   *Even Better:* Give them a chance to burn a bridge. "I will donate my winnings to a charity you hate if I don't pay you." (Too complex).
      *   *Let's stick to the core tension:* The Guide must predict. The Traveler must convince.
      *   *Stakes:* Needs to be enough to tempt defection. 5 Extra Credit Points is too high. Raffle tickets is best.

  6.  **Drafting the Plan:**
      *   **Title:** The Desert Crossing.
      *   **Time:** 30 mins activity, 45 mins debrief/lecture.
      *   **Materials:** Envelopes, slips of paper, raffle drum.
      *   **Roles:** 8 Drivers, 8 Hitchhikers.
      *   **Payoff Matrix:**
          *   Driver rescues: Cost -1.
          *   Hitchhiker arrives: Gain +10.
          *   Hitchhiker pays: Cost -5, Driver Gain +5.
          *   Hitchhiker defects: Cost 0, Driver Gain 0 (plus the -1 cost already sunk).
          *   *Crucial:* Driver only rescues if they believe P(Pay) > threshold.
      *   **The "Feel":** Hitchhikers will promise. Drivers will be skeptical. Hitchhikers will realize promising is cheap talk.

  7.  **Addressing the "Rational Irrationality" aspect:**
      *   In the debrief, ask: "What could the Hitchhiker have done to make the promise credible?"
      *   "Could you have made yourself irrational?" (e.g., "I am honor-bound," "I would feel guilty").
      *   This leads to the distinction between *Act Rationality* (don't pay) and *Disposition Rationality* (be a payer).

  8.  **Predicting Failure Modes:**
      *   *Collusion:* Students might agree to split everything to maximize group utility. (Counter: Anonymous submission of decisions).
      *   *Cynicism:* Everyone defects immediately. (Counter: Emphasize the raffle prize).
      *   *Confusion:* Rules too complex. (Counter: Keep math simple).
      *   *The "Transparency" Problem:* In real life, Drivers can't read minds. In the game, they just have to guess. I need to make sure they know the Driver's payoff depends on *accuracy* of prediction, not just rescue.
      *   *Correction:* To match Parfit, the Driver *sees* the disposition. In class, we simulate this by letting the Driver interview and then decide. If the Driver refuses, the Hitchhiker gets 0.

  9.  **Limitations (The "Frank" Assessment):**
      *   Real Parfit case involves *psychological* transparency (Driver reads mind/character). In class, it's just cheap talk + poker face.
      *   One-shot vs. Reputation: Students care about reputation in class.
      *   Stakes are artificial.

  10. **Finalizing the Debrief Questions:**
      *   Map to Act vs. Disposition.
      *   Map to Credible Commitment.
      *   Map to "Rationality of Irrationality" (Elster/Parfit).

  11. **Review against Constraints:**
      *   16 students? Yes (8 pairs).
      *   75 mins? Yes (30 game, 45 talk).
      *   Real stakes? Yes (Raffle).
      *   Predict failure? Yes (Collusion/Cynicism).
      *   Limitations? Yes (Mind-reading).

  12. **Polishing the Activity:**
      *   Make sure the "Driver" has a reason to be picky. Give them a "Fuel Cost." If they rescue a defector, they lose points. If they rescue a payer, they gain. If they stay home, they break even. This makes *not rescuing* the rational default unless convinced.
      *   Make sure the "Hitchhiker" has a temptation. If they pay, they net 5. If they defect, they net 10.
      *   Add a "Pre-Game" phase where they can write a note? No, keep it verbal to emphasize the "binding" problem.
      *   *Wait, one nuance:* Parfit's point is that if you are *transparently rational*, you die. So the Hitchhiker needs to try to appear *irrational* (committed). I should explicitly instruct half the class to try to "bind" themselves verbally.
      *   *Actually, better:* Don't instruct strategy. Let them discover the need for it. In the debrief, ask "How could you have won?"

      *(Self-Correction during drafting)*: I need to ensure the "Transparency" element is highlighted. In Parfit, the driver *knows*. In class, the driver *guesses*. I need to frame the Driver's decision as "I will only rescue if I am >80% sure." To simulate transparency, maybe give the Driver a "Lie Detector" token? No, that's gimmicky.
      *Better:* The Driver gets a bonus for *correctly predicting* the outcome. This aligns their incentive with "reading" the Hitchhiker.
      *   Driver Payoff:
          *   Stay in Town: 0.
          *   Rescue + Paid: +5.
          *   Rescue + Not Paid: -5.
          *   Prediction Bonus: If they rescue and are right (Paid), +2. If they don't rescue and Hitchhiker would have defected, +2.
      *   This makes the Driver care about the *truth* of the Hitchhiker's character.

      *Let's simplify for flow:*
      *   Driver: Rescue (-2 cost). If Repaid (+7 net). If Not Repaid (-2 net).
      *   Hitchhiker: Rescued (+10). If Repay (-5 net 5). If Defect (+10 net 10).
      *   Driver chooses to Rescue or Pass.
      *   Hitchhiker chooses to Repay or Defect (if rescued).
      *   Stakes: Raffle tickets.

      *Wait, the prompt asks for "Rational Irrationality".* This is the idea that it is rational to cultivate an irrational disposition.
      *   I need to make sure the debrief hits this hard. The activity sets the stage; the debrief delivers the philosophy.

      *Final check on "What will go wrong":*
      *   Students treating it as a "cooperate to win" game (Team vs Instructor).
      *   Solution: Anonymous decision slips.
      *   Students laughing it off.
      *   Solution: Serious framing ("This is a logic test, not icebreaker").

      *Let's write it.*
answer: |-
  Here is a complete lesson plan designed for a 75-minute upper-level seminar. It prioritizes philosophical friction over gamified fun.

  ### Activity Title: The Desert Crossing
  **Time Allocation:** 30 minutes (Activity) + 45 minutes (Debrief & Lecture)
  **Class Size:** 16 Students (8 Pairs)
  **Stakes:** Entry tickets into a raffle for a tangible prize (e.g., a $25 book voucher, a "skip one reading" pass, or high-quality chocolate). *Do not use course points; it creates ethical grading pressure. Do not use cash; it feels transactional. A raffle creates probabilistic value that students treat seriously but which costs you little.*

  ---

  ### Part 1: The Setup (5 Minutes)
  **Materials:**
  *   8 "Driver" Instruction Sheets.
  *   8 "Hitchhiker" Instruction Sheets.
  *   16 Decision Slips (pre-printed).
  *   A raffle box and pens.

  **Framing:**
  Tell the class: *"We are going to run a simulation of a strategic interaction. The decisions you make now determine how many raffle tickets you get for the prize at the end of class. You will be paired randomly. Do not talk to anyone outside your pair. When the game is over, we will discuss why you made the choices you did."*

  **Distribution:**
  Randomly assign half the class as **Drivers** and half as **Hitchhikers**. Seat them across from each other. Hand out instruction sheets.

  **The Payoff Structure (Private Information):**
  *   **Hitchhiker:**
      *   If Driver *refuses* to rescue: **0 Tickets.**
      *   If Driver *rescues* AND Hitchhiker *Pays*: **5 Tickets.**
      *   If Driver *rescues* AND Hitchhiker *Defects* (keeps money): **10 Tickets.**
      *   *(Note: Paying costs the Hitchhiker 5 tickets, but is the only way to get rescued in a rational world).*
  *   **Driver:**
      *   If Driver *stays home*: **2 Tickets** (Safe baseline).
      *   If Driver *rescues* AND Hitchhiker *Pays*: **7 Tickets.**
      *   If Driver *rescues* AND Hitchhiker *Defects*: **-2 Tickets** (Loss of fuel/time).
      *   *(Note: The Driver only benefits if the Hitchhiker pays. If the Hitchhiker is rational, the Driver loses tickets by rescuing).*

  **The Crucial Constraint (Read Aloud):**
  *"Drivers: You have 3 minutes to interview your Hitchhiker. You must decide whether to Rescue or Stay Home based *only* on this interview. You cannot make a binding contract. You cannot force them to pay later.
  Hitchhikers: You want to be rescued. Once you are in town (after the Driver decides), you will privately decide whether to Pay or Defect. The Driver will not know your decision until you hand in your slips at the end."*

  ---

  ### Part 2: The Interaction (10 Minutes)
  1.  **Interview Phase (3 mins):** Drivers question Hitchhikers. Hitchhikers try to convince Drivers they will Pay.
      *   *Constraint:* Drivers are told, "Assume your partner is a rational agent seeking to maximize tickets. If they have a self-interested reason to lie to you now, assume they will."
  2.  **Decision Phase (2 mins):**
      *   Drivers mark **RESCUE** or **PASS** on their slip.
      *   Hitchhikers mark **PAY** or **DEFECT** on their slip *now*, but seal it in an envelope. (This prevents them from changing their mind after seeing the Driver's choice, simulating the "in town" separation).
  3.  **Collection:** Collect all slips. Do not reveal outcomes yet.

  ---

  ### Part 3: The Reveal & Scoring (5 Minutes)
  Open the envelopes. Tally the tickets.
  *   **Scenario A (The Rational Trap):** Driver Rescues + Hitchhiker Defects. (Driver loses tickets, Hitchhiker wins big).
  *   **Scenario B (The Standoff):** Driver Passes. (Both get low/safe tickets).
  *   **Scenario C (The Cooperation):** Driver Rescues + Hitchhiker Pays. (Both win well).

  *Likely Outcome:* In a one-shot game with strangers, you will see a mix of A and B. Very few C. This is the friction point.

  ---

  ### Part 4: The Debrief (45 Minutes)
  *Do not lecture immediately. Socratic questioning is essential to make them feel the philosophical problem.*

  **Phase 1: The Autopsy (15 mins)**
  1.  **To the Drivers who Passed:** "Why didn't you rescue? Did you believe them?"
      *   *Expected Answer:* "They said they would pay, but once they are in town, they have no reason to. I couldn't trust the promise."
  2.  **To the Hitchhikers who Defected:** "Why didn't you pay? You promised."
      *   *Expected Answer:* "Once I was safe, paying cost me 5 tickets for no benefit. The game was over."
  3.  **To the Hitchhikers who were Left Behind:** "What could you have done differently?"
      *   *Expected Answer:* "Nothing. My promise was cheap talk."
  4.  **The Pivot Question:** "If you are a perfectly rational, self-interested agent, can you *ever* be rescued in this scenario?"
      *   *Goal:* Elicit the realization that **Act-Rationality** (maximizing utility at the moment of payment) leads to **Death** (no rescue).

  **Phase 2: Mapping to Parfit (20 mins)**
  Now introduce the terminology. Write on the board:
  1.  **Self-Interest Theory (S):** "At any moment, do what benefits you most."
  2.  **The Parfitian Claim:** "If you are transparently governed by S, you will die in the desert."
  3.  **Rational Irrationality:** "To survive, you must be the kind of person who pays even when it hurts you."

  **Discussion Questions:**
  *   "In the game, could you *decide* to be the kind of person who pays? Or were you stuck being a ticket-maximizer?"
  *   "Parfit argues we need a distinction between **Rationality of Actions** (Defecting is rational) and **Rationality of Dispositions** (Having the disposition to Pay is rational). Did anyone feel they had the 'Disposition' but couldn't prove it?"
  *   "Is it rational to cultivate an irrational disposition? (i.e., Is it rational to make yourself unable to maximize utility in the moment, so that you can gain benefits earlier?)"

  **Phase 3: Credible Commitment (10 mins)**
  *   "How could we fix the game? What mechanism would allow the Hitchhiker to survive?"
  *   *Ideas to elicit:* Collateral, reputation, contracts, emotions (guilt).
  *   *Philosophical Point:* Parfit suggests we don't need external contracts; we need internal normative truths. But Elster (Ulysses and the Sirens) argues we need pre-commitment devices.
  *   "Could you have committed *during the 3-minute interview*? If you said 'I will feel guilty if I don't pay,' is that credible? Only if you actually are the kind of person who feels guilt over ticket maximization."

  ---

  ### Predictable Failure Modes & Fixes

  **1. The "Classroom Collusion" Problem**
  *   **What happens:** Students realize that if everyone Cooperates (Rescue/Pay), the *class total* of tickets is highest. They may agree beforehand to all Pay to "beat the instructor."
  *   **Why it breaks the lesson:** It removes the tension of self-interest. Parfit's case relies on the agent caring about *their own* outcome.
  *   **Fix:** Emphasize anonymity. "Your slips are sealed. No one will know who did what except me. The raffle is individual." If you suspect collusion, add a rule: "The top 3 individual ticket holders get a bonus prize." This reintroduces competition.

  **2. The "It's Just a Game" Cynicism**
  *   **What happens:** Students defect immediately because "it's just raffle tickets."
  *   **Why it breaks the lesson:** It confirms the theory too easily without the *struggle*. You want them to *want* to cooperate but feel unable to.
  *   **Fix:** Frame it seriously. "Treat this as a logic puzzle regarding your own agency, not a lark." Ensure the prize is actually desirable (ask them beforehand what they want).

  **3. The "Transparency" Gap**
  *   **What happens:** Drivers rescue based on a "gut feeling" rather than rational prediction.
  *   **Why it breaks the lesson:** Parfit's Driver *knows* the Agent's psychology. In class, it's poker.
  *   **Fix:** In the debrief, acknowledge this. "In the real case, the Driver can read your mind. Here, they had to guess. Does that make it harder or easier to be rational?"

  ---

  ### Limitations: What This Activity Cannot Reproduce
  Be frank with your students about where the simulation diverges from Parfit's *Reasons and Persons*:

  1.  **True Transparency:** In Parfit's case, the Driver *knows* your decision theory. In this game, the Driver is guessing based on cheap talk. You cannot simulate "psychological transparency" in a room of strangers. This means the activity demonstrates the **Credible Commitment Problem** (Game Theory) more than the **Metaphysics of Rationality** (Parfit).
  2.  **The "On the Spot" Binding:** Parfit asks if you can *decide* right now to be irrational. In the game, students are locked into their student-personas. They cannot actually rewrite their psychology in 3 minutes. The activity shows *why* they need to, but not *how* they could.
  3.  **Stakes:** No matter how good the raffle, it is not life-and-death. The "force" of the rational requirement to defect is weaker than the force of the rational requirement to survive.

  ### Instructor's Cheat Sheet for the Board
  *   **Act-Rationality:** Maximize utility *at the time of action*. (Result: Defect -> Die).
  *   **Disposition-Rationality:** Maximize utility by having a *trait*. (Result: Pay -> Live).
  *   **The Paradox:** It is rational to make yourself irrational (unable to defect).
  *   **The Question:** Can you choose your dispositions? (Compatibilism vs. Hard Determinism of character).

  This structure ensures they experience the frustration of the "Rational Trap" viscerally before you give them the vocabulary to solve it.
