prompt: |-
  I write political fiction, and the novel I am finishing turns on a body of my own invention: the Board of Charters, which drafts a constitution for each province as it accedes to the Union of Verraine. A good part of the book is the Board arguing with itself in closed session, and I want those arguments to be real ones — the kind a comparative-institutionalist could read with a pencil without laughing. I have read the standard case for fusing legislative and executive power and the standard case for separating them, and I do not need either rehearsed back to me, nor do I want authorities, reading lists, or citations. What I need is this: given the five settlements my Board reached before the story opens, what has it already committed itself to, and what follows for the sixth case, which is the one I am actually writing.

  The precedents, as my narrator summarizes them:

  **Sable.** Six parties in the assembly, none above a quarter of the seats, no pair able to govern without a third, labels traded between elections, two decades of cabinets lasting under a year. The Board prescribed a parliamentary charter: the assembly elects the premier, and it may unseat a premier only by simultaneously naming a successor (the clerks call this the substitution rule). A proposal for a directly elected governor was rejected without discussion.

  **Ondres.** Two disciplined programmatic parties alternating in office, a career civil service, an audit office that had actually prosecuted a former minister, and a public that in the Board's own hearings ranked delivery of legislation above being consulted. The Board prescribed a directly elected governor: four-year fixed term, cabinet drawn from outside the assembly, no ordinance power, a narrow emergency power that lapses unless the assembly affirmatively approves it within thirty days, select committees with subpoena power, and removal only by impeachment on a two-thirds vote for defined offences.

  **Kalva.** Two coups in thirty years, weak personalist parties, and a strong popular demand for a directly elected head of province even among those who feared the generals. The Board prescribed a semi-presidential charter: a directly elected president, fixed term, confined to external relations and defence, unable to dissolve the assembly, who appoints a premier holding assembly confidence and answerable for everything domestic. The president is removable by a two-thirds assembly vote followed by a provincial referendum; the premier by ordinary no-confidence under the substitution rule.

  **Upper Aule.** Small, homogeneous, a long tradition of initiative and referendum, low trust in parties. The Board rejected a proposal for a directly elected mayor-governor with power to legislate by ordinance and to dissolve the council. It prescribed instead a five-member executive council elected at large, chair rotating annually, no dissolution, any ordinance suspendable by popular initiative within ninety days, and any single member recallable by petition of a fixed share of voters.

  **The Verrine Coast.** Three regions, one of them a secessionist minority with about thirty per cent of the population; every party is regional, none provincial. The Board prescribed a parliamentary premier, but required that confidence be withdrawable only by a majority that also carries majorities in each of the three regional delegations, and it refused a directly elected governor on the ground that a province-wide plurality would simply install the largest region's candidate permanently.

  The case before the Board in my chapter is the province of **Marche**. Its assembly is elected by proportional representation with a low threshold and currently contains four parties, the largest near thirty-five per cent, internally disciplined but with no stable majority and no tendency to coalesce into two blocs. Administration is clean, the audit office is independent, there is no history of coups and no regional cleavage worth naming, and roughly seven in ten residents tell pollsters they want to elect their governor directly. Uniquely among the provinces, a large share of public money — something like a fifth of the provincial budget — comes not from taxation but from fees collected by a river-basin authority whose board the governor appoints.

  The charter proposed to the Board for Marche would create a directly elected governor on a fixed four-year term, without power to dissolve the assembly, with a cabinet drawn from outside it, and would add a device new to the federation: the confidence-locked mandate. Once in any twelve-month period, the assembly may, by a single majority vote that simultaneously names a successor, transfer the remainder of a governor's term to that successor, no election being held. The basin authority's revenues would require annual assembly authorization, though its board would remain the governor's appointment. A clerk's note observes that no precedent pairs direct election with confidence-based removal: in Sable and Kalva the substitution rule attaches to a premier the voters never chose directly, and in Ondres the directly elected governor can be removed only by impeachment.

  What I would like from you:

  1. Three or four rules the Board might be running that fit all five precedents — stated sharply enough that they come apart on Marche. I can see at least one turning on whether every executive must be removable by somebody other than the electorate, one turning on what the party system has to look like before a single-person direct mandate is safe, and one turning on what powers such an office may hold; if there are others, or if mine are badly drawn, say so.

  2. What each rule predicts about the Marche proposal as drafted, and about each of its separable features: direct election itself, removal with a named successor, the once-a-year restriction, the absence of dissolution, and the fee-funded authority.

  3. Your best guess at the ruling, the precedent the Board would cite as its closest analog, and the precedent it would be wrong to cite because it is only superficially closest. Give me the reasoning the minute would record and, separately, the dissent — the scene needs both, and the dissent has to be an argument rather than an atmosphere.

  4. If the five settlements genuinely underdetermine the sixth, say so plainly, and tell me what principle the Board would be adopting with each option, in the language a clerk would put in the minute rather than in the language of political theory. In particular: is there any amendment — to the removal device, to who may be named as successor, to the basin authority — that would make approval consistent where pure rejection is otherwise called for, and what exactly would the amendment be buying?

  5. One altered fact about Marche that would force the competing rules to part company decisively, in case I want the Board to face it in a later chapter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Political fiction novel involving the "Board of Charters" in the Union of Verraine.
      *   **Task:** Analyze the Board's precedents (5 provinces) to determine how they would rule on a 6th case (Marche).
      *   **Constraints:** No standard textbook arguments (fusion vs. separation of powers), no citations/reading lists, no authorities. Focus on internal consistency of the Board's logic.
      *   **Deliverables:**
          1.  3-4 implicit rules derived from the 5 precedents that conflict on Marche.
          2.  Application of these rules to specific features of the Marche proposal.
          3.  Predicted ruling, closest analog, misleading analog, majority reasoning, and dissent.
          4.  Analysis of underdetermination and potential amendments to bridge the gap.
          5.  One altered fact to force a decisive split in later chapters.
      *   **Tone:** Professional, analytical, "comparative-institutionalist," suitable for a writer crafting a realistic bureaucratic/political scene.

  2.  **Deconstruct the Precedents (The Data Set):**

      *   **Sable:** Fragmented party system (6 parties, unstable). *Solution:* Parliamentary + Substitution Rule (Constructive Vote of No Confidence). *Rejected:* Direct Election. *Logic:* Instability requires assembly cohesion; direct election adds competing legitimacy without solving fragmentation.
      *   **Ondres:** Stable two-party system, strong institutions (audit, civil service). *Solution:* Direct Election (Fixed term, impeachment only). *Logic:* Stability allows for direct mandate; checks exist elsewhere (audit, courts).
      *   **Kalva:** History of coups, weak parties, demand for direct election. *Solution:* Semi-Presidential (Direct President for defense/foreign, Parliamentary Premier for domestic). *Logic:* Compromise. Direct election satisfies demand/symbolism, but real power stays with assembly to prevent dictatorship/coups. Removal is hard (2/3 + referendum).
      *   **Upper Aule:** Small, homogeneous, low trust in parties, high direct democracy tradition. *Solution:* Plural Executive (Council), rotating chair, recall. *Rejected:* Strong Mayor-Governor. *Logic:* Distrust of concentrated power + trust in voters > trust in parties.
      *   **Verrine Coast:** Regional cleavage (3 regions, 1 minority). *Solution:* Parliamentary + Concurrent Majority for No-Confidence. *Rejected:* Direct Election. *Logic:* Direct election would favor the largest region permanently (tyranny of the majority). Protection of minority requires assembly-based consensus.

      *   **Marche (The Case):**
          *   *Parties:* 4 parties, largest 35%, disciplined, no stable majority, no blocs. (Intermediate between Sable's chaos and Ondres' stability).
          *   *Institutions:* Clean admin, independent audit. (Like Ondres).
          *   *History:* No coups. (Unlike Kalva).
          *   *Cleavages:* None. (Unlike Verrine Coast).
          *   *Public Opinion:* 70% want direct election. (Like Kalva/Verrine Coast demand, unlike Sable/Upper Aule skepticism).
          *   *Unique Feature:* River-basin authority (20% budget), governor appoints board, assembly authorizes revenue.
          *   *Proposal:* Direct Election + Cabinet outside assembly + "Confidence-Locked Mandate" (Constructive Vote of No Confidence applied to a *Directly Elected* Governor). No dissolution.

  3.  **Derive the Implicit Rules (Task 1):**

      *   *Rule A (The Legitimacy/Removal Symmetry):* Look at Sable, Kalva, Verrine Coast. In all parliamentary/semi-presidential cases, the executive is removable by the assembly (with varying difficulty). In Ondres (Direct Election), removal is *only* by impeachment (judicial/criminal standard).
          *   *Hypothesis:* If the people elect the executive, only the people (or a judicial standard) can remove them. If the assembly sustains the executive, the assembly can remove them. Mixing them creates dual legitimacy conflict.
      *   *Rule B (The Party System Threshold):* Look at Ondres (2 parties) vs. Sable (6 parties) vs. Verrine Coast (Regional parties). Direct election was granted in Ondres (stable) and Kalva (weak parties but security risk). It was denied in Sable (fragmented) and Verrine Coast (regional).
          *   *Hypothesis:* Direct election requires either stable bipolarity (Ondres) or a specific security/symbolic need (Kalva). Fragmented multiparty systems (Sable/Marche) usually get parliamentary systems to force coalition building.
      *   *Rule C (The Power/Accountability Link):* Look at Kalva (President limited to defense/foreign) vs. Ondres (Governor has full exec power but fixed term) vs. Upper Aule (Council).
          *   *Hypothesis:* If an executive has significant fiscal autonomy or independent revenue sources, they must either be directly elected with fixed terms (Ondres) OR strictly parliamentary (Sable). Mixing independent revenue with assembly removal is dangerous.
      *   *Rule D (The Minority/Veto Point Rule):* Verrine Coast and Upper Aule show concern for minorities or diffuse power.
          *   *Hypothesis:* Where cleavages exist, veto points increase. Where they don't (Marche), standard rules apply. (This might be less contentious for Marche).

      *   *Refining the Conflict:* The core tension is the "Confidence-Locked Mandate" on a "Directly Elected Governor."
          *   Sable says: Assembly needs to be able to fire the executive to ensure governance, but voters shouldn't pick the executive if parties are fragmented.
          *   Ondres says: If voters pick the executive, the assembly shouldn't be able to fire them (except for crimes).
          *   Marche Proposal: Voters pick, Assembly fires (politically). This violates the Ondres precedent (Symmetry) but mimics the Sable mechanism (Substitution).

  4.  **Analyze Marche Features against Rules (Task 2):**

      *   *Direct Election:* Rule B (Party System) says "No" (4 parties, no blocs). Rule A (Public Demand) says "Yes" (70%).
      *   *Removal with Successor:* Rule A (Symmetry) says "No." You don't apply parliamentary removal to a presidential mandate. It creates two masters.
      *   *Once-a-Year Restriction:* Attempts to mitigate instability (Sable concern), but doesn't solve the legitimacy clash.
      *   *No Dissolution:* Standard in presidential/semi-presidential (Ondres/Kalva). Consistent.
      *   *Fee-Funded Authority:* This is the wildcard. 20% budget outside tax. If Assembly can fire Governor, they control the budget. If Governor appoints the Board, Governor controls the money. If Assembly can fire Governor *and* Governor keeps the money, who wins?

  5.  **Draft the Ruling and Dissent (Task 3):**

      *   *Majority:* Needs to find a way to say "No" to the hybrid model or "Yes" with heavy modification. Given the "realism" constraint, a Board of Charters usually prefers stability over innovation. The "Confidence-Locked Mandate" on a Direct Election is constitutionally novel and risky (deadlock).
      *   *Decision:* Reject the hybrid. Force a choice: Either Parliamentary (Sable model) OR Direct Election (Ondres model). Given the 4-party fragmentation, Parliamentary is safer *institutionally*, but Public Demand is high.
      *   *Wait, looking closer at the prompt:* The prompt asks what follows for the sixth case. If the Board is consistent, they should probably *reject* the proposal as drafted because it violates the Symmetry Rule (Ondres vs. Sable).
      *   *Closest Analog:* Kalva (Semi-presidential compromise) or Sable (Substitution rule).
      *   *Misleading Analog:* Ondres (Looks like direct election, but removal is different).
      *   *Reasoning:* The "Dual Legitimacy" problem.
      *   *Dissent:* Argues that the fragmentation isn't severe enough to deny the popular will, and the substitution rule prevents the deadlock Ondres feared.

  6.  **Underdetermination and Amendments (Task 4):**

      *   Is it underdetermined? Yes. The Board has never faced a "Direct Election + Parliamentary Removal" case.
      *   Amendments to fix it:
          1.  Make removal harder (2/3 vote instead of majority). Moves it closer to Kalva.
          2.  Strip the Basin Authority revenue control from the Governor if removal is easy.
          3.  Allow Governor to dissolve Assembly if Assembly can remove Governor (Symmetry of weapons).
      *   *What does it buy?* Stability vs. Accountability.

  7.  **Altered Fact for Later Chapter (Task 5):**

      *   Need to break the tie.
      *   *Idea:* What if the Basin Authority isn't just revenue, but has *police* or *regulatory* power? Or what if the 35% party is explicitly anti-Union?
      *   *Better Idea:* The 35% party is a "framework party" that refuses to coalition. This makes the Parliamentary option (Sable) unworkable, forcing the Board to accept the Direct Election despite the risks. Or, the Basin Authority is funded by *inter-provincial* fees, making the Governor accountable to the Union, not just the Province.

  8.  **Refining the Output (Self-Correction/Polishing):**

      *   *Tone Check:* Ensure I don't sound like a poli-sci textbook. Use the language of the Board ("The Minute," "The Clerk," "Precedent").
      *   *Constraint Check:* No citations. No "Linz says." Just internal logic.
      *   *Specifics:* Ensure the "Confidence-Locked Mandate" is addressed specifically. It's the crux of the fiction.
      *   *Logic Check:* Does the "Symmetry Rule" hold up?
          *   Sable: Assembly picks, Assembly fires. (Symmetric)
          *   Ondres: People pick, People fire (via election) / Crimes fire. (Symmetric)
          *   Kalva: People pick President (hard to fire), Assembly picks Premier (easy to fire). (Separated)
          *   Marche Proposal: People pick, Assembly fires. (Asymmetric).
          *   *Verdict:* This is the strongest point of conflict.

      *   *Refining the Rules:*
          1.  **The Legitimacy Symmetry Principle:** The source of tenure must match the source of termination. (People elect -> People remove/Impeach. Assembly sustains -> Assembly removes).
          2.  **The Fragmentation Threshold:** Direct mandates require bipolar competition or low stakes. Fragmented multiparty systems require coalition-forcing mechanisms (Parliamentary).
          3.  **The Fiscal Control Corollary:** Control over independent revenue streams must align with the security of tenure. (If you control the money, you need a fixed term, OR if you have a fixed term, money control is limited).

      *   *Drafting the Response:* Structure clearly according to the 5 points requested.

      *(Self-Correction during drafting)*: Make sure the dissent isn't just "I disagree." It needs to be a competing institutional logic. The dissent should argue that the *Substitution Rule* solves the deadlock risk, making the Symmetry Principle outdated for this specific context.

      *(Refining the "Altered Fact")*: Let's make the Basin Authority's revenue *volatile* or *contested* by another province. That raises the stakes on who controls it. Or, simpler: The 35% party is ideologically incompatible with the other 65%. This makes the Parliamentary option (Sable) impossible, forcing the Direct Election. Let's go with the "Uncoalitionable Party" angle. It forces the Board's hand on the Party System Rule.

      *(Final Polish)*: Ensure the distinction between "Impeachment" (Ondres) and "Political Removal" (Sable/Marche Proposal) is clear.

  9.  **Final Review against constraints:**
      *   No citations? Yes.
      *   No textbook rehearsing? Yes.
      *   Focus on the 5 precedents? Yes.
      *   Tone appropriate? Yes.

      *Let's write.*
answer: |-
  ### 1. The Implicit Rules of the Board

  Based on the five settlements, the Board operates on three unwritten principles. They are consistent across the precedents but collide on Marche.

  **Rule I: The Symmetry of Tenure (Legitimacy Matching)**
  *   **Derivation:** In **Sable**, **Upper Aule**, and **Verrine Coast**, the assembly sustains the executive, and the assembly may remove it (via substitution, recall, or concurrent majority). In **Ondres**, the electorate sustains the executive, and only the electorate (via election cycle) or a judicial standard (impeachment) may remove it. **Kalva** splits the executive to preserve this symmetry: the President (directly elected) is hard to remove; the Premier (assembly-appointed) is easy to remove.
  *   **The Rule:** The authority that grants the mandate must hold the primary power of termination. A directly elected executive cannot be subject to ordinary political removal by the assembly, as this creates dual legitimacy without a mechanism to resolve the conflict.

  **Rule II: The Fragmentation Threshold**
  *   **Derivation:** Direct election was granted in **Ondres** (two disciplined parties) and **Kalva** (weak parties, but security imperative). It was denied in **Sable** (six parties, unstable coalitions) and **Verrine Coast** (regional fragmentation). **Upper Aule** denied it due to scale and tradition, not fragmentation.
  *   **The Rule:** A single-person direct mandate is permissible only where the party system is bipolar (ensuring a clear governing alternative) or where security concerns override institutional risk. In fragmented multiparty systems without regional cleavages, a parliamentary charter is required to force coalition-building within the assembly rather than appealing over its head.

  **Rule III: The Fiscal Independence Corollary**
  *   **Derivation:** In **Ondres**, the Governor has no ordinance power and narrow emergency powers; the audit office is strong. In **Upper Aule**, the executive is plural and ordinances are suspendable by initiative. In **Kalva**, the directly elected President is stripped of domestic budget authority (held by the Premier).
  *   **The Rule:** An executive with a fixed term (insulated from assembly removal) must not control significant independent revenue streams outside the assembly's appropriation power. If the executive controls non-tax revenue, they must be removable by the assembly to prevent fiscal autocracy.

  ### 2. Application to the Marche Proposal

  **The Proposal:** Direct Election + Confidence-Locked Mandate (Assembly removal with successor) + No Dissolution + Governor-appointed Basin Authority (20% budget).

  *   **Direct Election:**
      *   *Rule I (Symmetry):* **Violates.** The electorate elects, but the assembly removes.
      *   *Rule II (Fragmentation):* **Violates.** Four parties, largest at 35%, no blocs. This is Sable's fragmentation without Sable's parliamentary remedy.
      *   *Rule III (Fiscal):* **Neutral.** Direct election itself doesn't determine fiscal control, but it sets the stage for the conflict.

  *   **Removal with Named Successor (Confidence-Locked Mandate):**
      *   *Rule I:* **Violates.** This is the Sable "substitution rule" applied to an Ondres-style office. It attempts to solve the instability of direct election with a parliamentary tool, creating a hybrid the Board has never authorized.
      *   *Rule II:* **Mitigates.** It attempts to solve the fragmentation issue by forcing the assembly to agree on a successor, preventing the chaos of Sable's revolving cabinets.

  *   **Once-a-Year Restriction:**
      *   *Rule I:* **Irrelevant.** It limits the frequency of the violation, not the violation itself.
      *   *Rule II:* **Supports.** It adds stability, addressing the Board's fear of the Sable scenario.

  *   **Absence of Dissolution:**
      *   *Rule I:* **Consistent.** Ondres and Kalva also deny the executive dissolution power.
      *   *Rule II:* **Risky.** In a fragmented system (Sable), if the assembly can fire the Governor but the Governor cannot dissolve the assembly, the assembly holds all the cards. This creates a "committee government" dynamic rather than a balanced one.

  *   **Fee-Funded Authority (Basin):**
      *   *Rule III:* **Violates.** The Governor appoints the board controlling 20% of the budget, yet (under the proposal) can be removed by the assembly. If the assembly threatens removal, the Governor may weaponize the Basin funds. If the Governor is fixed-term (Ondres style), they shouldn't hold this purse. If they are removable (Sable style), they shouldn't hold this purse without stricter audit controls.

  ### 3. The Ruling and The Dissent

  **The Ruling:** Rejection of the Charter as drafted.
  **Closest Analog:** **Kalva.** (The Board treats the proposal as a failed semi-presidential compromise).
  **Misleading Analog:** **Ondres.** (Superficially similar due to direct election, but fundamentally different on removal).

  **The Minute (Majority Reasoning):**
  > "The Board finds the proposed charter constitutionally incoherent under the established practice of the Union. The 'Confidence-Locked Mandate' attempts to fuse the legitimacy of the Ondres model with the removal mechanisms of the Sable model. This creates a dual mandate without a resolution mechanism. If the Governor holds a provincial mandate, the Assembly cannot withdraw it on political grounds without nullifying the electorate's choice. If the Assembly holds the power of removal, the Governor must be its agent, not the people's.
  >
  > Furthermore, the fragmentation of the Marche assembly (four parties, no majority) mirrors the Sable precedent, which dictated a parliamentary solution to enforce coalition discipline. Granting a direct mandate in this environment invites the Governor to govern against the assembly, while the assembly retains the power to paralyze the Governor. Finally, the Basin Authority revenue structure violates the Fiscal Corollary: an executive subject to political removal cannot retain independent control over significant non-appropriated funds. The Board directs the drafters to choose: either a Parliamentary Premier with control over the Basin, or a Directly elected Governor with fixed tenure and Basin revenues subject to stricter audit oversight."

  **The Dissent (Minority Reasoning):**
  > "The Majority clings to a symmetry that the Union's needs have outgrown. Rule I assumes that direct election and assembly confidence are mutually exclusive. They are not. The 'Confidence-Locked Mandate' is not a violation; it is an evolution. It solves the Ondres problem (rigidity) without inviting the Sable problem (instability).
  >
  > Marche is not Sable. The parties are disciplined, and the public demand is explicit (70%). To deny direct election because the party system is not bipolar is to punish the voter for the parties' failure to consolidate. The substitution rule ensures that the Assembly cannot remove a Governor unless they have a governing alternative ready—this prevents the chaos of Sable without the rigidity of Ondres.
  >
  > Regarding the Basin Authority: The Governor's appointment power is checked by the Assembly's annual authorization of revenue. This is sufficient. To demand the Governor choose between the people's trust and the Assembly's confidence is to create the very deadlock this charter seeks to avoid. We should approve the charter as a necessary innovation for a mature province."

  ### 4. Underdetermination and Amendments

  The five settlements **genuinely underdetermine** the sixth. The Board has never ruled on a "Directly Elected Executive subject to Constructive Vote of No Confidence." The precedents cluster around pure forms (Parliamentary or Presidential), leaving the hybrid space empty.

  If the Board wishes to approve the charter without violating its own logic, it must adopt one of the following amendments. Each buys a specific institutional trade-off:

  **Amendment A: The "Super-Majority" Removal**
  *   **Change:** Raise the threshold for the Confidence-Locked Mandate from a simple majority to a two-thirds vote of the assembly.
  *   **Precedent:** Moves the removal standard closer to **Ondres** (Impeachment) and **Kalva** (President removal).
  *   **What it Buys:** It restores **Symmetry**. If the people elect the Governor, it should take more than a bare parliamentary majority to unseat them. It acknowledges the direct mandate's weight while retaining a safety valve.
  *   **Cost:** It makes removal very difficult in a four-party system (requiring near-unanimity), potentially locking in an unpopular Governor.

  **Amendment B: The "Dissolution Symmetry"**
  *   **Change:** Grant the Governor the power to dissolve the assembly and call new elections if a Confidence-Locked Mandate vote is initiated against them.
  *   **Precedent:** Standard in many parliamentary systems, but new for a directly elected executive in Verraine.
  *   **What it Buys:** It restores **Balance of Power**. If the Assembly can fire the Governor, the Governor can fire the Assembly. It forces the parties to think twice before triggering a removal vote.
  *   **Cost:** It increases instability (election frequency) in a fragmented party system (The Sable Risk).

  **Amendment C: The "Basin Trusteeship"**
  *   **Change:** The Basin Authority board is appointed by the Governor, but confirmed by the Assembly, and its revenue is automatically appropriated (not subject to annual authorization).
  *   **Precedent:** Aligns with **Ondres** (Audit independence) and **Kalva** (Separation of fiscal control).
  *   **What it Buys:** It resolves the **Fiscal Corollary**. It removes the money from the immediate political fight. If the Governor is removable, they shouldn't hold the purse. If they hold the purse, the purse should be insulated from the Assembly's annual threat.
  *   **Cost:** It reduces Assembly oversight on 20% of the budget, creating a "state within a state."

  **Recommendation for Consistency:**
  **Amendment A (Super-Majority Removal)** is the most consistent with the Board's history. It respects the direct election (Ondres/Kalva) while acknowledging the assembly's role (Sable), without creating a simple-majority tyranny over a direct mandate.

  ### 5. One Altered Fact for a Later Chapter

  To force the competing rules to part company decisively in a future chapter, alter the nature of the **largest party in Marche**.

  **The Alteration:**
  The party holding 35% of the seats is not merely disciplined; it is **constitutionally exclusionary**. It has publicly declared it will never enter a coalition with any other party, nor will it support any candidate from another party for executive office.

  **Why this breaks the Board:**
  *   **Rule II (Fragmentation)** now dictates a Parliamentary system to force compromise, but the party system makes compromise *impossible*. A Parliamentary charter would result in permanent deadlock (Sable on steroids).
  *   **Rule I (Symmetry)** dictates that if a Parliamentary system is unworkable, a Direct Election is safer. But if a Direct Election is chosen, the 35% party is likely to win the Governorship with a plurality and then face a hostile Assembly.
  *   **The Conflict:** The Board must choose between **Governability** (Direct Election allows the 35% to govern despite the Assembly) and **Consensus** (Parliamentary system forces the 35% to negotiate, which they refuse to do).
  *   **The Stakes:** This forces the Board to decide if the Union's priority is stable administration (favoring the Direct Election proposal despite the rules) or democratic coalition-building (favoring a Parliamentary system that will likely fail). It turns a technical constitutional argument into a political crisis.
