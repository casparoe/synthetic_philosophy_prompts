  The stalemate persists because the question "Does philosophy matter?" conflates distinct empirical and conceptual inquiries, masking a structural dependency where philosophy's utility peaks precisely when physics loses consensus on its own foundations. Separating the conflated questions reveals that the disagreement shifts from substantive to verbal depending on the lane. The historical-causal question is substantive: did positivist scruples delay atomism? This is an empirical claim about history, yet both sides treat it as ideological ammunition, cherry-picking episodes where philosophy helped or hindered without controlling for counterfactuals. The pedagogical question is also empirical but neglected: does training in logic or metaphysics improve model-building? Physicists assume noise; philosophers assume signal, but neither produces longitudinal data on scientist performance. The jurisdictional question is verbal: it hinges entirely on the definition of "science." If science includes methodological justification, philosophy is internal; if science is strictly data-modeling, it is external. Physicists define science by output; philosophers by structure. Finally, the diagnostic question asks if utility correlates with field health. Here the disagreement is structural, not merely verbal, and it is where your second hypothesis finds its footing.

  Your first hypothesis, regarding illocutionary mismatch, is largely correct but requires nuance. When Weinberg or Hawking dismiss philosophy, they are performing boundary-work to allocate prestige and protect graduate student time from what they perceive as low-yield abstraction. They issue rallying cries for disciplinary focus. Philosophers, however, treat these remarks as truth-evaluable metaphilosophical theses and refute them by exposing the hidden philosophical commitments in the physicists' own work. The exchange fails because one side is negotiating resources while the other is analyzing presuppositions. A refutation arrives where a rallying cry was sent. However, it is not merely performative; many physicists genuinely believe philosophical reasoning is cognitively empty regarding physical reality. The mismatch explains the heat of the debate, but not all of it. The physicists are not only guarding turf; they are expressing a genuine epistemological skepticism that philosophers fail to address because they assume the necessity of their own tools is self-evident. Consequently, the physicists feel unheard in their practical concerns, while the philosophers feel unheard in their logical corrections.

  Your second hypothesis, that the marginal value of philosophy is countercyclical, is robust and explains the variance in historical examples. During periods of consolidated normal science, conceptual clarity is already baked into the formalism; philosophical intervention adds friction without predictive leverage. In crisis periods, when basic concepts fracture, philosophical work becomes essential to reconstruction. The reconstruction of simultaneity in special relativity was not internal physics merely baptized philosophical; it was a conceptual overhaul required because the existing categories failed. This matches your subfield's current state. Eternal inflation and the measure problem are not computational bottlenecks but definitional crises. The theory does not predict because the concepts of "probability" and "observer" are undefined in that context. Here, philosophy is not an accessory; it is the only tool capable of refining the question until it becomes physically answerable. The dispute feels eternal because the state of physics oscillates. When physics is confident, philosophy looks dead. When physics is confused, philosophy looks vital. The physicists speaking against philosophy are usually speaking from periods of confidence; the philosophers speaking for it are usually speaking from periods of confusion.

  There is a genuinely empirical disagreement hiding inside the rhetoric, specifically regarding the historical-causal claims. Whether positivism delayed atomism or whether quantum interpretive arguments drove progress are historical facts, not philosophical opinions. Progress here requires archival work that treats philosophical influence as a variable to be isolated, not a banner to be waved. However, expecting a final verdict on the general question is futile because the answer depends on the temporal slice examined. The claim that conceptual clarifications were internal to physics is testable via archives, but often mythologized to support the boundary-work mentioned earlier. Until historians of science rigorously separate internal technical development from external conceptual framing, this empirical core will remain obscured by rhetoric.

  Progress requires abandoning the universal framing. The question "Does philosophy matter for physics?" should be rephrased as "Under what structural conditions does conceptual analysis yield predictive leverage?" For your seminar series, success looks like mapping the lifecycle of physical theories to identify the crisis points where philosophical tools become necessary equipment rather than optional commentary. If the series concludes that philosophy matters only when physics is broken, that is a finding, not a failure. In cosmology, admitting the measure problem is a conceptual crisis legitimizes philosophical intervention as part of the scientific workflow. No progress will be made if the series seeks a timeless verdict; progress lies in recognizing the dependency of methodological needs on the maturity of the physical theory. The stalemate ends not when one side wins, but when both acknowledge that the utility of philosophy is a function of the confusion level of the physics.
