answer: |-
  This is a sophisticated decomposition of a betting strategy that mixes normative finance theory with practical constraints. Your friend's syndicate is operating under a hybrid framework that claims the mantle of "growth maximization" while implementing rules that strictly contradict the mathematical requirements for that claim.

  Here is an analysis separating the settled mathematics from the contested theory, and identifying where their rules are underdetermined.

  ### 1. The Core Claim: Log Utility vs. Geometric Growth
  **Settled Math:**
  Mathematically, maximizing the expected logarithm of wealth ($E[\log W]$) and maximizing the asymptotic geometric growth rate are equivalent in an infinite-horizon, unconstrained setting. The Kelly criterion is the unique solution to both problems.

  **Contested Theory:**
  Whether one *should* maximize $E[\log W]$ is the subject of the famous Samuelson–Kelly debate.
  *   **The Kelly/Thorp view:** Geometric growth is the only objective that avoids ruin while maximizing wealth in the "long run."
  *   **The Samuelson/Merton view:** There is no normative justification for log utility over any other concave utility function. Maximizing growth rate is not inherently superior to maximizing expected utility of terminal wealth with a different risk profile.

  **Syndicate Implication:**
  By claiming they are "maximizing long-run growth," they are invoking the Kelly justification. However, as detailed below, their constraints prevent them from actually accessing the mathematical benefits of that justification.

  ### 2. Half-Kelly: Estimation Risk vs. Risk Aversion
  **Settled Math:**
  In a continuous approximation, the expected growth rate $g(f)$ as a function of fraction $f$ is indeed roughly quadratic (a parabola opening downward) near the optimal Kelly fraction $f^*$.
  $$g(f) \approx g(f^*) - \frac{1}{2} \sigma^2 (f - f^*)^2$$
  Because of this quadratic property:
  1.  Betting half-Kelly ($f^*/2$) reduces the *variance* of returns by 75%.
  2.  It reduces the *expected growth rate* by only 25% (relative to the excess growth over the risk-free rate).
  3.  The function is "flat" near the maximum; errors in sizing cost less in growth than they save in variance.

  **Contested Theory / Application:**
  *   **If probabilities are known:** Half-Kelly is strictly suboptimal for growth. It is an expression of risk aversion (a utility function more concave than log).
  *   **If probabilities are estimated:** Half-Kelly can be optimal for *true* growth. If your model overestimates the edge, Full Kelly leads to "error ruin" (betting too much on negative EV opportunities disguised as positive). Fractional Kelly is a robust control against parameter uncertainty.

  **Underdetermination:**
  You cannot distinguish whether the syndicate is **risk-averse** (utility < log) or **epistemically humble** (acknowledging model error) based on the Half-Kelly rule alone. Both theories license the exact same behavior. Given they cite "probabilities are estimated," they are technically arguing from estimation risk, which preserves the "growth maximization" claim (maximizing *true* growth under uncertainty) rather than admitting risk aversion.

  ### 3. The 60% Floor: Absorbing Barriers and Asymptotics
  **Settled Math:**
  The theorem that "Kelly eventually beats any other strategy" relies on the law of large numbers over an infinite horizon with no lower bound other than zero.
  *   **The Barrier Problem:** Introducing a hard stop-loss (an absorbing barrier at 60%) fundamentally breaks the asymptotic dominance theorem. If the barrier is hit, the "long run" ends prematurely.
  *   **Optimization:** The optimal strategy in the presence of a drawdown constraint is *not* standard Kelly. It usually requires betting *less* than Kelly as you approach the barrier to minimize the probability of absorption.

  **Contested Theory:**
  *   **Lexicographic Preferences:** A hard stop-loss implies a utility function that is discontinuous. It suggests a preference ordering like: "1. Do not drop below 60%. 2. Maximize growth." This cannot be generated by a smooth utility function (like log wealth).
  *   **Survival vs. Growth:** Pure growth maximization accepts a significant probability of deep drawdowns (e.g., 50%+) to achieve maximum rate. A 60% floor suggests they prioritize the *continuity of the syndicate* over the *mathematical growth rate*.

  **Does Kelly survive the barrier?**
  No. Once you put an absorbing barrier in the model, the strategy that maximizes the probability of *never hitting the barrier* while growing is different from standard Kelly. Standard Kelly maximizes the rate conditional on *not* going to zero, but it does not minimize the probability of hitting a specific intermediate drawdown threshold.

  ### 4. Annual Withdrawal: The Compounding Contradiction
  **Settled Math:**
  "Long-run growth" is a function of compounding: $W_T = W_0 \cdot \prod (1 + r_i)$.
  *   **The Reset:** By withdrawing profits and resetting the stake to a fixed number every year, they are severing the compounding chain across seasons.
  *   **The Result:** They are maximizing the geometric growth rate *per season*, but they are **not** maximizing the long-run growth of their total wealth. They are treating the bankroll as a working capital tool to generate income, not as an investment portfolio to be accumulated.

  **Time Preference:**
  You asked if there is a view about pure time preference here. Yes.
  *   **Zero Discounting (Growth Argument):** Requires reinvestment. Future wealth is valued equally to present wealth in terms of growth potential.
  *   **Positive Discounting (Withdrawal Argument):** Withdrawing profits implies the utility of consumption *now* is higher than the utility of having that capital work *later*.
  *   **The Contradiction:** They cannot claim to maximize long-run wealth growth while simultaneously capping the principal. They are maximizing the **expected utility of withdrawals**, subject to a constraint that the tool (the bankroll) survives the season.

  ### 5. Finite Horizon: Is Asymptotics Beside the Point?
  **Settled Math:**
  For a finite horizon $T$ (a few hundred bets), the Kelly criterion is not strictly optimal for maximizing $E[W_T]$ unless utility is log.
  *   **Convergence:** However, the distribution of log-wealth converges to normality relatively quickly. For a few hundred bets, the asymptotic approximation is usually "good enough" for practical purposes, provided the edge isn't microscopic.
  *   **Volatility Drag:** In finite horizons, variance acts as a drag on terminal wealth. This makes fractional Kelly (like Half-Kelly) often superior to Full Kelly for finite-horizon wealth maximization, even without estimation error, simply because it reduces the variance drag.

  **Syndicate Implication:**
  The asymptotic result isn't "beside the point," but it is not the strict justification either. For a season of a few hundred bets, Half-Kelly is often mathematically preferable to Full Kelly for maximizing *median* terminal wealth, even under settled math, due to the finite sample size.

  ### 6. Summary of Underdetermination
  There are several places where their rules are consistent with multiple, mutually exclusive theoretical frameworks. You cannot infer their true "theory" from their behavior alone.

  | Rule | Theory A (Growth) | Theory B (Risk/Utility) | Theory C (Practical/Agency) |
  | :--- | :--- | :--- | :--- |
  | **Half-Kelly** | Maximizing *true* growth under parameter uncertainty. | Maximizing expected utility with higher risk aversion than log. | Reducing variance to keep investors calm (behavioral). |
  | **60% Stop-Loss** | A constraint required to keep the "game" alive (survival). | A "ruin" definition specific to their utility function. | A contractual obligation to investors to limit downside. |
  | **Annual Withdrawal** | Maximizing growth rate of the *vehicle*, not total wealth. | High time preference for profits; bankroll is a tool, not savings. | Partnership agreement: investors want income, not NAV growth. |

  ### Conclusion: What is actually doing the work?
  The package presupposes **Survival > Growth > Return.**

  1.  **The 60% Floor** is the dominant constraint. It is a lexicographic cut-off that no standard growth-rate story generates on its own. It overrides the Kelly logic.
  2.  **The Withdrawal** quietly undercuts the "long-run growth" claim. It converts the strategy from wealth accumulation to income generation. The "compounding" they describe is intra-seasonal only.
  3.  **Half-Kelly** is defensible on straight growth grounds *only* if you accept the premise of significant estimation error. If their model is precise, Half-Kelly is simply risk aversion disguised as prudence.

  **Verdict:** They are not maximizing long-run wealth growth in the theoretical sense. They are maximizing the **sustainable yield of a risky income stream**, subject to a hard survival constraint. The "Kelly" label is being used as a heuristic for "don't bet too much," rather than a strict adherence to growth optimization theorems. The asymptotic math is being invoked to justify the sizing, but the structural rules (stop-loss, withdrawal) ensure the asymptotic conditions are never met.
