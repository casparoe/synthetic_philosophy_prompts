      **MEMORANDUM**
      **TO:** Academic Planning Committee
      **FROM:** Undergraduate Representative
      **DATE:** October 24
      **SUBJECT:** Recommendation Regarding CQSS/SDS Transition Classification

      **Purpose**
      This memo recommends a course of action regarding the proposed transition of the Centre for Quantitative Social Science (CQSS) to the School of Data and Society (SDS). The core procedural question is whether this transition qualifies as a "rebranding" eligible for the light-track approval process, or a "substantively new academic unit" requiring full external review. After reviewing the submission materials and consulting relevant stakeholders, I recommend the Committee classify SDS as a substantively new unit and initiate a full external review, with an expedited timeline to mitigate delay.

      **Summary of Positions**
      The Dean of Social Sciences argues for the light track. The Dean's position rests on operational continuity: the physical location, initial budget line, and majority of staff remain unchanged. From this perspective, the dispute is merely verbal; the facts on the ground are settled, and the label "new" is semantic packaging. Requiring a full review would incur unnecessary cost and delay a transition that is functionally evolutionary, not revolutionary.

      The objecting faculty argue for a full review. Their position rests on structural expansion: the creation of a new undergraduate degree, a new Dean post, and four new tenure-track lines phased over three years. They contend that these changes alter the unit's academic scope and governance sufficiently to warrant external scrutiny. There is also a concern that bypassing review sets a precedent allowing administrative expansions to avoid faculty governance. Both sides agree on the physical and financial baseline facts; they disagree on whether those facts constitute "newness" under the handbook.

      **Critical Additional Factors**
      Two factors in the file were not addressed in the Dean's initial proposal but are decisive for this classification.

      First, there is a donor restriction. A major gift is pledged specifically for the establishment of "a new school of data and society." Legal counsel indicates this gift lapses if the unit is not legally distinct and new. If the Committee approves the light track, we officially classify SDS as a rebranding of an existing unit. This classification risks invalidating the donor's condition, potentially losing the funding. We cannot claim the unit is "not new" for the handbook while claiming it is "new" for the donor without exposing the University to legal and reputational risk.

      Second, the existence of the "Data Science Initiative" (DSI) complicates the definition of an existing unit. The DSI has a website and a director but no budget, students, or tenure lines. If the DSI counts as an existing unit sufficient to block "new" status, then almost any proposed unit could be claimed as pre-existing via a minimal paper trail. If the DSI does not count, then SDS—which has students, degrees, and significant hiring—crosses the threshold of substance that the DSI lacks. Relying on the DSI to justify a light track would establish a dangerous precedent for future administrative bypasses.

      **Analysis**
      The Dean is correct that the underlying physical facts are not in dispute. However, the conclusion that this makes the issue "purely verbal" overlooks the function of our governance categories. Handbook definitions are not metaphysical truths about identity; they are tools designed to serve specific purposes, such as protecting academic quality and securing financial integrity.

      When the purpose is operational logistics, SDS looks like CQSS. But when the purpose is financial compliance (the donor gift) and academic governance (new tenure lines and degrees), SDS functions as a new entity. To classify this as a rebranding is to choose a conceptual framework that minimizes administrative effort but maximizes financial risk and minimizes governance oversight. Given the stakes—specifically the restricted funding and the creation of four tenure lines—the framework that treats SDS as new is the only one that aligns with the University's fiduciary and academic interests.

      **Recommendation and Timeline**
      I recommend the Committee vote to classify the transition as a **substantively new academic unit**, triggering the full external review process. This secures the donor gift and ensures appropriate scrutiny of the new degree and hiring lines.

      To address the Dean's concern regarding delay, I recommend the Committee request an **expedited review timeline**. The external review committee should be appointed by November 15, with a site visit scheduled for January. A final report should be required by March 1, allowing for implementation before the next academic cycle. This balances the need for rigorous governance with the operational desire for timely execution.

      **Conclusion**
      While the continuity of staff and space is real, the creation of new academic obligations and the legal conditions of external funding require us to treat SDS as a new unit. This classification protects the University's financial interests and maintains the integrity of the academic planning process.

