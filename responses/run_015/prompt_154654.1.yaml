      *   *Weakness:* Risks throwing the baby out with the bathwater. If FEP provides the *normative* justification for *why* the brain minimizes prediction error (survival/stability), removing it leaves PP as just a descriptive algorithm without a teleological anchor. Also, the "local to cortex" claim might be too restrictive given subcortical predictive mechanisms.
