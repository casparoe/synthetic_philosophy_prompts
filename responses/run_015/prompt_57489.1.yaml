answer: |-
  # PREPARATION SHEET: Q&A STRATEGY
  **Workshop:** European Social Choice Group  
  **Time:** 6 Weeks  
  **Audience:** 25 (Majority: Mathematical Economists/Axiomatizers; Minority: Phil-Econ, Prioritarian, Experimentalists)  
  **Thesis:** Harsanyi's theorem requires a hidden "transposition premise" (interpersonal scale equality). Proposal: Replace Pareto Indifference with "Calibrated Pareto Indifference" using a common reference lottery.

  ---

  ## PART I: THE OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Circularity of Calibration (Fatal)
  *   **Subgroup:** Mathematical Economists / Weymark adherents.
  *   **Phrasing:** "You claim to avoid the interpersonal comparison assumption required by Harsanyi, but your 'calibration lottery' stipulates that all individuals evaluate the reference prospects at the *same* probability $p$. If $u_i$ is unique only up to affine transformation, fixing $u_i(\text{best}) = 1$ and $u_i(\text{worst}) = 0$ for all $i$ is *itself* an assertion of interpersonal level and unit comparability. You haven't derived the scale; you've assumed it in the domain restriction. Isn't this just Weymark's point restated?"
  *   **2-Minute Reply:** "I concede the calibration fixes the scale. But Harsanyi assumes the scale is fixed *ontologically* by psychological similarity. I propose it be fixed *procedurally* by agreement on a reference gamble. The difference is normative: we don't need to believe utilities *are* equal, only that we *agree to measure* them against a public standard. It shifts the burden from metaphysics to public reason."
  *   **Soft Spot:** If they press that agreeing on $p$ *requires* believing the utilities are comparable, the procedural defense collapses.
  *   **Verdict:** **FATAL.** If this sticks, the paper claims a contribution it doesn't deliver.

  ### 2. The Subjective Beliefs / Vacuity Problem (Fatal)
  *   **Subgroup:** Mathematical Economists (Decision Theory overlap).
  *   **Phrasing:** "Your calibration lottery relies on 'publicly identified reference prospects.' If agents hold different subjective priors over these states (Savagean framework), they will not agree on the probability $p$. If you restrict the domain to those who *do* agree, your domain is likely empty or trivial. If you don't, the axiom is vacuous. How do you ensure non-vacuity without assuming common priors?"
  *   **2-Minute Reply:** "I am working in an Anscombe-Aumann framework where objective probabilities over the lottery component are available. The reference prospects are acts with objective risk, not subjective uncertainty. We calibrate against the objective mixer, not the state space."
  *   **Soft Spot:** If the "reference prospects" involve social states (e.g., 'being healthy'), these are not objective lotteries. Mixing social states with objective risk is technically messy.
  *   **Verdict:** **FATAL.** This is the "Hope Nobody Asks" (see Part IV). If asked, you must hold the Anscombe-Aumann line rigidly.

  ### 3. Domain Restriction and Non-Vacuity
  *   **Subgroup:** Mathematical Economists / Axiomatizers.
  *   **Phrasing:** "By requiring a specific calibration lottery to be ranked identically by all agents, you are imposing a severe domain restriction. Does your representation theorem hold for *any* profile of preferences, or only those satisfying this calibration? If the latter, is the class of admissible profiles dense? If not, the result is trivial."
  *   **2-Minute Reply:** "It is a domain restriction, but a mild one compared to assuming full interpersonal comparability. I argue the set of profiles agreeing on a binary reference lottery is topologically large enough to rule out dictatorship while allowing pluralism. I will provide the density proof in the appendix."
  *   **Soft Spot:** If you haven't proven density yet, this is a bluff.
  *   **Verdict:** **High Damage.** Threatens mathematical substance.

  ### 4. The Prioritarian Risk Objection
  *   **Subgroup:** The Prioritarian.
  *   **Phrasing:** "You say your class contains prioritarian forms. But Harsanyi fails for prioritarianism because the social observer's risk attitude differs from the individuals'. If you calibrate scales using individual risk attitudes (the lottery $p$), aren't you baking the individuals' risk neutrality into the social scale? How can a concave social welfare function emerge if the inputs are calibrated by individual VNM curvature?"
  *   **2-Minute Reply:** "The calibration fixes the *units*, not the *aggregation rule*. Once units are fixed via the reference lottery, the social observer can still apply a concave transformation to the sum. The calibration prevents the *scale* from doing the prioritarian work, forcing the *aggregation function* to do it, which is normatively clearer."
  *   **Soft Spot:** Distinguishing scale calibration from aggregation curvature is technically delicate in VNM frameworks.
  *   **Verdict:** **Medium/High.** Challenges the "positive proposal" aspect.

  ### 5. Independence of Axioms
  *   **Subgroup:** Mathematical Economists / Axiomatizers.
  *   **Phrasing:** "Is 'Calibrated Pareto Indifference' independent of the standard Pareto axiom? If the calibration lottery is just a specific instance of Pareto, haven't you just weakened the domain of Pareto rather than changing the axiom? Where is the independence proof?"
  *   **2-Minute Reply:** "It is independent because standard Pareto applies to *all* lotteries, while Calibrated Pareto applies only *after* the scale is fixed. One can satisfy Calibrated Pareto while violating standard Pareto on non-calibrated lotteries, which is precisely how we avoid the Harsanyi linearity result."
  *   **Soft Spot:** Requires clear formal distinction in the handout.
  *   **Verdict:** **Medium.** Technical nitpick, but damages credibility if unanswered.

  ### 6. Observability of the Reference
  *   **Subgroup:** Philosophers of Economics.
  *   **Phrasing:** "You speak of 'publicly identified reference prospects.' In practice, how are these observed? If we must ask agents 'do you value this lottery at $p$?', we are eliciting cardinal utility directly. Isn't this just a disguised method of asking people their utility functions?"
  *   **2-Minute Reply:** "No, we are asking for a ranking over a specific binary lottery, which is ordinal data. The cardinality emerges from the structure of the theorem, not the elicitation. It's the difference between measuring length with a ruler versus defining the meter."
  *   **Soft Spot:** The line between ordinal ranking of a lottery and cardinal utility is thin in VNM.
  *   **Verdict:** **Medium.** Philosophical coherence check.

  ### 7. Descriptive Plausibility
  *   **Subgroup:** Experimentalists.
  *   **Phrasing:** "Do you have any evidence that real agents agree on a 'best' and 'worst' state, or evaluate a reference lottery at the same $p$? In the lab, heterogeneity is the norm. Your model might be elegant, but is it descriptively vacuous?"
  *   **2-Minute Reply:** "This is a normative theory of aggregation, not a descriptive model of behavior. However, focal points (like 'full health' vs. 'death') often serve as natural reference prospects in experimental coordination games. I am open to testing this."
  *   **Soft Spot:** Dismissing experimentalists as "not the point" can alienate the room.
  *   **Verdict:** **Low/Inconvenient.** Easy to deflect as normative work.

  ### 8. Anonymity and Dictatorship
  *   **Subgroup:** Mathematical Economists.
  *   **Phrasing:** "You claim to rule out dictatorship. But if the calibration lottery is chosen by a specific agent, doesn't that agent become a 'scale dictator'? How do you ensure anonymity in the selection of the reference prospects?"
  *   **2-Minute Reply:** "The reference prospects must be publicly identified *ex ante*, independent of the profile. They are part of the structure of the choice problem, not chosen by an agent within the profile."
  *   **Soft Spot:** Who defines the structure? If it's the theorist, is it arbitrary?
  *   **Verdict:** **Low.** Manageable with a definition tweak.

  ### 9. Informational Base (Sen's Charge)
  *   **Subgroup:** Philosophers / Sen-adherents.
  *   **Phrasing:** "Like Harsanyi, you remain within the welfarist informational base. You've adjusted the measurement, but you haven't addressed rights, capabilities, or non-utility information. Sen's critique that this yields no ethical conclusion still stands."
  *   **2-Minute Reply:** "I accept the welfarist constraint for this theorem. My goal is to fix the *internal* coherence of welfarist aggregation, not to defend welfarism against capabilities. This is a repair job within the house, not a new foundation."
  *   **Soft Spot:** Might seem defensive to the philosophers.
  *   **Verdict:** **Low.** The prompt says they won't push metaethics hard.

  ### 10. Uniqueness of Representation
  *   **Subgroup:** Mathematical Economists.
  *   **Thesis:** "Does your calibration yield a *unique* social welfare functional, or just a class? If it's a class containing both utilitarian and prioritarian forms, have you actually solved the aggregation problem or just moved the indeterminacy to the choice of aggregation function?"
  *   **2-Minute Reply:** "I have moved the indeterminacy, yes. But I have moved it from the *measurement* (which is hidden in Harsanyi) to the *aggregation* (which is explicit). Transparency is a theoretical virtue."
  *   **Soft Spot:** Economists like uniqueness results. Admitting indeterminacy is costly.
  *   **Verdict:** **Low.** Honesty is better here.

  ---

  ## PART II: STRATEGIC CONCESSIONS (First 5 Minutes)
  *To buy credibility with the Axiomatizers:*
  1.  **Concede the Substantive Assumption:** Explicitly state in your opening summary: "I do not claim the calibration lottery is a 'free' assumption. It is a substantive restriction on the domain of admissible preferences." This disarms Objection #1 and #3 partially by showing you aren't hiding the cost.
  2.  **Concede the Framework:** Acknowledge you are working in Anscombe-Aumann (objective risk), not Savage (subjective uncertainty). This pre-empts the "Subjective Beliefs" attack by defining your turf.
  3.  **Concede Indeterminacy:** Admit that your result yields a *class* of functions, not a unique utilitarian one. Frame this as a feature (flexibility) rather than a bug (imprecision).

  ---

  ## PART III: THE SINGLE REPLY THAT MUST LAND
  **The Objection:** The Circularity of Calibration (Objection #1).
  **The Reply:** "The Harsanyi theorem hides the interpersonal comparison in the *interpretation* of the coefficients. My theorem makes the interpersonal agreement a *precondition* of the domain. The difference is between assuming utilities are comparable (metaphysical) and requiring agreement on a public standard (procedural). This allows us to reject utilitarianism if we reject the aggregation rule, without denying the scale."
  **Why:** If you fail to distinguish *ontological* comparability from *procedural* calibration, the economists will view your "Calibrated Pareto" as identical to standard Pareto with normalized units, rendering the paper trivial.

  ---

  ## PART IV: THE QUESTION I HOPE NOBODY ASKS
  **The Question:** "Your calibration lottery requires individuals to evaluate a prospect over 'publicly identified states.' If individuals have different subjective beliefs about the likelihood of those states (e.g., one person thinks 'full health' is unlikely to be sustained), they will not agree on the probability $p$. Does your theorem collapse if we drop the Common Prior assumption?"
  **Why it's Fatal:** If the calibration lottery depends on subjective beliefs, the condition is vacuous for heterogeneous populations. If it depends on objective probabilities, the "states" must be objective lotteries, which makes the "social states" (like being person $i$) hard to define formally.
  **Preparation:** If asked, retreat immediately to the Anscombe-Aumann distinction. "The reference lottery is over objective outcomes, not subjective states. We are calibrating the utility of *consequences*, not the probability of *states*." (Even if this is slightly shaky regarding social positions, it is the only formal defense available).

  ---

  ## PART V: OBJECTIONS I APPEAR BRACED FOR (THAT WON'T BE RAISED)
  1.  **Deep Metaethics:** Do not prepare for attacks on whether utility *is* welfare. The prompt says the philosophers there care about VNM meaning, not metaethics. Don't waste time defending utilitarianism as a moral doctrine.
  2.  **Savagean Foundations:** Do not prepare for deep technical questions about state-space partitions or subjective probability axioms. The prompt says no Savagean decision theorists are present. Stick to VNM/Anscombe-Aumann vocabulary.
  3.  **Sen's "Impossibility" Theorems:** Do not bring up Liberal Paradox or Impossibility of a Paretian Liberal unless they do. It's a different literature.

  ---

  ## PART VI: CLOSING ASSESSMENT (My Standing)

  **Confidence in Ordering:** High. The "Circularity" and "Subjective Beliefs" objections are the standard fault lines for any interpersonal comparison claim in social choice. If those hold, the rest matter less.
  **Confidence in Fatal Verdicts:** High. If the calibration assumption is just interpersonal comparability in disguise (Weymark), the paper's novelty claim fails. If the domain is empty due to belief heterogeneity, the theorem is vacuous.
  **Confidence in Attributions:**
  *   **Weymark:** I am confident. Weymark (1991, *Social Choice & Welfare*) explicitly argues that Harsanyi requires interpersonal comparability of utility levels and units. My thesis accepts this but tries to operationalize it. The objection that "calibration *is* comparability" is a faithful reconstruction of his line.
  *   **Sen:** Moderate confidence. Sen's critique is broad. Attributing the "Informational Base" objection to him is safe, but ensure you don't imply he cares about the *axiomatics* of VNM specifically. He cares about the *information* excluded.
  *   **Prioritarian:** Moderate confidence. The Prioritarian objection regarding risk attitudes (Otsuka/Voorhoeve) is well-known. However, ensure you don't conflate "prioritarianism" with "risk aversion" in a way that irritates the specific prioritarian in the room. Some prioritize without relying on risk attitudes.
