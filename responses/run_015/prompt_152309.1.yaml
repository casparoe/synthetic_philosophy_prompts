  **Frequentist:** It's a different tectonic setting. If I include it, I'm lying about the similarity; if I exclude it, I'm cherry-picking the class to fit the number we already agreed on.
  **Subjectivist:** Exactly. The number comes from our judgment of the evidence, not the count. The class is just a story you tell to hide the subjectivity.

