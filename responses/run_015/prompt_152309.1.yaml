  **Subjectivist:** The scoring rule is fine, but the evacuation trigger worries me. It treats 0.2 as a physical threshold rather than a cost-sensitive decision rule.
  **Frequentist:** If the protocol says 0.15 triggers evacuation, we're safe. But you're right—if probability is just belief, the trigger is just politics.

  4.
  **Subjectivist:** The auditor's actual question is what makes your sentence true. I tell them: nothing. It's a coherent commitment, not a fact.
  **Frequentist:** It's true if the propensity matches the frequency. We verify by checking calibration across all my forecasts, not just this one.
  **Subjectivist:** So for this volcano, specifically, the statement is unverifiable. You're sacrificing the singular case to save the method.

