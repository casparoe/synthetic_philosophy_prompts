      *   *Hypothesis B:* "It's this specific string of 1,000 bits." (Long program: `print "110100..."`).
      *   *Hypothesis C:* "It's random noise." (No compression).
      *   *Does this show weird short program?* Yes, the algorithm for $\pi$ is short but mathematically dense.
      *   *Does it avoid uniform sampling?* Yes, because the "specific string" hypothesis is just *one* of $2^{1000}$ possibilities, whereas the $\pi$ hypothesis covers the data with very few bits.
      *   *Wait, one constraint:* "Show a weird-looking short program can beat a long intuitive one."
