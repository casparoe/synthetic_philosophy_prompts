      *   *Question:* "If the universe is truly random (ontologically), does Solomonoff Induction fail?" (Answer: No, it assigns high probability to the 'random' program). OR "If a demon is simulating us with a complex rule, does Occam fail?" (Answer: It predicts based on the shortest *description*, not the 'real' cause if the real cause is complex).
      *   *Better:* Ask them to evaluate a scenario where the *true* generator is complex, but a *simple* approximation predicts better in the short run.

  8.  **Drafting the Session Plan (75 mins):**

