answer: |-
  Here is a 75-minute teaching arc designed to move philosophy grad students from a vague notion of Occam's Razor to a structural understanding of the Universal Prior, while inoculating them against the "uncomputability" dismissal.

  ### **The Carrying Example: The Digits of $\pi$ (in Binary)**
  **Why this example:** It satisfies your constraints. The binary expansion of $\pi$ looks statistically random (no obvious repeating pattern), which makes the "intuitive" hypothesis a long lookup table. The "short" hypothesis is a mathematical algorithm. It avoids coin-flipping (which implies stochasticity) and focuses on deterministic sequence prediction.

  **What it must show:**
  1.  **Visual Complexity $\neq$ Kolmogorov Complexity:** The data looks messy, but the generator is tiny.
  2.  **Compression is Prediction:** If you have the short program, you can predict the next bit. If you have the lookup table, you cannot predict beyond the stored data.
  3.  **Not Uniform Sampling:** A uniform prior treats the $\pi$ sequence as equally likely as any random noise sequence ($2^{-N}$). The Universal Prior treats the $\pi$ sequence as vastly more likely ($2^{-\text{length of program}}$).

  ---

  ### **The Dependency Order**
  1.  **Qualitative Occam:** The intuition that "simple" theories are better.
  2.  **Formalizing "Simple":** Shift from "parameters" to "description length" (Kolmogorov).
  3.  **The Example:** Apply description length to the $\pi$ sequence.
  4.  **The Budget:** Convert length to probability ($2^{-L}$).
  5.  **The Universal Prior:** Summing predictions over all programs.
  6.  **Uncomputability:** The limitation and its philosophical defense.
  7.  **Epistemic Goal:** Prediction vs. Truth.

  ---

  ### **Session Arc (75 Minutes)**

  #### **1. The Trap of "Simplest Story" (0–10 mins)**
  *   **Hook:** Ask them to define Occam's Razor. They will say "prefer simpler hypotheses."
  *   **Probe:** Ask what "simpler" means. They will likely say "fewer parameters" or "more elegant."
  *   **The Problem:** Show that "fewer parameters" fails. A high-degree polynomial can fit any data (overfitting), but a chaotic rule (like a cellular automaton) might have very few parameters but produce incredibly complex output.
  *   **Transition:** We need a measure of simplicity that is independent of human intuition about "elegance." We need a measure of *information*.

  #### **2. Kolmogorov Complexity: The Program Metaphor (10–25 mins)**
  *   **Definition:** Define $K(x)$ as the length of the shortest computer program (in bits) that outputs $x$ and halts.
  *   **Head Off Misconception 1 ("Simplicity = Parameter Counting"):**
      *   *Where:* Right after defining $K$.
      *   *How:* Contrast a **Lookup Table** vs. **Algorithm**.
      *   *Point:* A lookup table for 1,000 numbers requires ~1,000 numbers worth of parameters. An algorithm (like `print_pi()`) requires only the code for the algorithm. $K$ measures the *code*, not the *output size* or the *coefficients*.
      *   *Key phrase:* "Occam isn't about how small the *world* is; it's about how small the *map* is."

  #### **3. The Carrying Example: $\pi$ in Binary (25–40 mins)**
  *   **Setup:** Present the first 1,000 bits of binary $\pi$. It looks like noise: `11.00100100001111...`
  *   **Hypothesis A (Intuitive/Long):** "The sequence is exactly this string of 1,000 bits."
      *   Program: `print "11001001..."`
      *   Length: ~1,000 bits (plus overhead).
  *   **Hypothesis B (Weird/Short):** "The sequence is the binary expansion of $\pi$."
      *   Program: `calculate_pi(1000)`
      *   Length: ~50 bits (depending on language).
  *   **The Kicker:** Ask: "If I ask for the 1,001st bit, which hypothesis helps you?"
      *   Hypothesis A cannot predict (it only stores 1,000).
      *   Hypothesis B predicts instantly.
  *   **Lesson:** Shortest description = Best predictive power. This is not about aesthetics; it's about compression.

  #### **4. The Budget Framing (40–50 mins)**
  *   **Placement:** **After the example.**
  *   **Reasoning:** The example creates the *demand* for a weighting scheme. Students now see the short program is better, but they ask "How much better?"
  *   **The Rule:** Every extra bit of program length costs a factor of 2 in probability.
      *   Weight $\propto 2^{-\text{length}}$.
  *   **Head Off Misconception 2 ("Universal Prior is Flat"):**
      *   *Where:* During the budget explanation.
      *   *How:* Explicitly calculate the ratio.
      *   *Math:* Hypothesis B (50 bits) is $2^{950}$ times more probable than Hypothesis A (1,000 bits).
      *   *Point:* This is aggressively *not* flat. It is an exponential penalty for complexity. This prevents the prior from washing out into uniform noise.

  #### **5. The Universal Prior (50–60 mins)**
  *   **Synthesis:** We don't know *which* program is the true one. So we sum over *all* possible programs.
  *   **Mechanism:**
      1.  List all possible programs.
      2.  Weight them by $2^{-\text{length}}$.
      3.  Run them. If a program outputs data matching our observations, keep it. If it contradicts, discard it.
      4.  The prediction for the next bit is the weighted majority vote of the surviving programs.
  *   **Result:** Short programs that fit the data dominate the vote. Long programs (noise) are too numerous individually but individually so improbable they don't swamp the short ones.

  #### **6. Uncomputability & The Defense (60–70 mins)**
  *   **The Reveal:** "There is a problem. We cannot actually list all programs and know if they halt." (The Halting Problem). $K$ is uncomputable.
  *   **Head Off Misconception 3 ("Uncomputability = Useless"):**
      *   *Where:* Immediately after the reveal. Do not let them sit with the dismissal.
      *   *Strategy 1 (The Normative Ideal):* Compare to **Ideal Bayesian Rationality**. Humans cannot calculate perfect Bayesian updates either (too many variables), but we still use Bayes as a norm for what *counts* as rational. Solomonoff is the norm for what *counts* as induction.
      *   *Strategy 2 (Approximation):* Mention that science *does* compute approximations. Minimum Description Length (MDL) and AIC are computable cousins used in model selection every day. Solomonoff is the theoretical ceiling those methods aim for.
      *   *Key phrase:* "It tells us what induction *is*, even if we can't build the machine that does it perfectly."

  #### **7. End Check & Omission (70–75 mins)**
  *   **Formal Detail to Omit:** **Prefix-Free Codes (Kraft's Inequality).**
      *   *What to say:* "To ensure these probabilities sum to 1 and not infinity, we need a technical constraint called 'prefix-freeness' on the programs. I'm leaving that out because it's a coding theory detail, not a philosophical one. Just assume the weights sum to $\le 1$."
  *   **The End Check (Predictive Success vs. Ontological Truth):**
      *   *Pose this scenario:* "Imagine the true law of the universe is incredibly complex ($K = 10^{100}$ bits), but there is a simple law ($K = 50$ bits) that matches all data up to today but will fail tomorrow."
      *   *Ask:* "Which hypothesis does Solomonoff Induction bet on for the prediction *today*?"
      *   *Correct Answer:* It bets on the **simple** one ($K=50$).
      *   *Takeaway:* Solomonoff Induction does not guarantee finding the *True* ontology. It guarantees finding the *best compressing predictor* given the data so far. It optimizes for predictive success, not metaphysical truth. If the universe is complex, Solomonoff will eventually learn that, but only when the simple model fails.

  ---

  ### **Summary of Misconception Mapping**

  | Misconception | Where it arises | How/Where you head it off |
  | :--- | :--- | :--- |
  | **"Simplicity is parameter counting"** | Defining Complexity | **Min 15:** Contrast Lookup Table (many params) vs. Algorithm (few bits). Emphasize *code length*, not *coefficient count*. |
  | **"Universal Prior is flat"** | Weighting Hypotheses | **Min 45:** The Budget Framing. Show the $2^{-L}$ calculation explicitly. Show that length 50 dwarfs length 1000. |
  | **"Uncomputability makes it useless"** | The Halting Problem | **Min 65:** Frame as a **Normative Ideal** (like Perfect Rationality) and point to **Approximations** (MDL/AIC) as practical implementations. |

  ### **Instructor Note on Tone**
  Keep the tone **regulative** rather than **constructive**. You are not teaching them an algorithm they can run on their laptops tomorrow. You are teaching them the *geometry of induction*. If they leave understanding that Occam's Razor is about *compression power* rather than *aesthetic preference*, and that uncomputability is a feature of the territory (logic) not a bug of the map (theory), the session is a success.
