      *   *Example:* **The Thue-Morse Sequence.**
      *   *Why?* It looks chaotic ($0110100110010110\dots$). An intuitive guess might be "it's random" or "it's a long lookup table." The actual rule is very simple (count 1s in binary index, mod 2).
      *   *Pros:* Demonstrates that "simple" isn't about "smoothness" or "intuitive pattern" but about *description length*.
