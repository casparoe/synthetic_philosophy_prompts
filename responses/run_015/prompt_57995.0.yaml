prompt: |-
  I am a PhD student in moral philosophy working on agent-relative constraints, and I am trying to work out whether the package of views I have converged on is jointly stable. I would be grateful for a consistency audit rather than a general overview of the literature.

  My current commitments are roughly as follows:

  (1) Constraint thesis: It is impermissible for an agent to intentionally kill one innocent person in order to prevent two other agents, acting independently and wrongly, from each intentionally killing one innocent person in circumstances that are otherwise morally indistinguishable. The prohibition holds even when the agent is certain, the numbers are known, and no other duties or special relations distinguish the victims.

  (2) Threshold thesis: Such constraints are stringent but not absolute. It is permissible, and perhaps required, for an agent to intentionally kill one innocent person in order to prevent a very large number of comparable intentional killings by others, for example fifty killings of the same kind. The threshold is vague, but there is a principled difference between small-number tradeoffs, which the constraint blocks, and large-number tradeoffs, which it does not.

  (3) Victim-centered grounding thesis: What fundamentally explains why intentional killing of this kind is wrong is an agent-neutral matter: the grave harm and loss to the victim and those connected to the victim. This badness gives every agent the same reason to want such killings not to occur, regardless of who would commit them.

  (4) No brute indexicality thesis: Moral reasons must be universalizable in the following sense. If a consideration makes it wrong for me to act in a certain way in circumstances C, it makes it wrong for anyone to act in that way in morally indistinguishable circumstances. There are no fundamental moral reasons of the form that I must not do it simply because it would be done by me, where the me-ness itself does the justificatory work.

  (5) Partiality thesis: Commonsense morality correctly permits a degree of partiality toward associates. I may permissibly devote resources to my own child, student, or promisee rather than producing a greater impartial good for strangers, and this permission is not merely a concession to human weakness.

  (6) Verdicts on two invented cases. Signal Box: I operate a rail signal in a conflict zone. If I do nothing, two remote operators, acting wrongly on their own, will each divert a train so that it kills one civilian. If I divert my own train, I will kill one civilian myself but jam the network and thereby prevent both remote killings. Stipulated that intentions, certainty, victim status, and causal directness are held fixed except for who kills and the jamming side effect. I judge intervention impermissible. Reservoir: Same structure, except my diversion kills one civilian and prevents fifty comparable killings by other operators. I judge intervention permissible, perhaps required.

  Are (1) through (6) jointly tenable? Please work through the pairwise and three-way tensions, distinguishing genuine inconsistencies from merely apparent ones. Rank the tensions you find by severity, explain for each what would have to give in order to restore consistency and what the cost of that revision would be for the rest of the package, and then identify the single least costly revision that would remove the most pressure. In particular, I want to know whether my grounding and universalizability claims undermine my constraint and threshold verdicts, and whether my partiality claim creates an additional problem or points toward a resolution.
reasoning: |-
  Here's a thinking process that leads to the consistency audit:

  1.  **Analyze the Request:**
      *   **User:** PhD student in moral philosophy.
      *   **Topic:** Agent-relative constraints (deontological constraints).
      *   **Task:** Consistency audit of a specific package of 6 commitments (theses + case verdicts).
      *   **Requirements:**
          *   Work through pairwise and three-way tensions.
          *   Distinguish genuine inconsistencies from apparent ones.
          *   Rank tensions by severity.
          *   Explain what would have to give to restore consistency and the cost.
          *   Identify the single least costly revision to remove the most pressure.
          *   Specifically address: Do grounding/universalizability claims undermine constraint/threshold verdicts? Does partiality create a problem or point to a resolution?
      *   **Tone:** Professional, rigorous, philosophical, avoiding general literature overview.

  2.  **Deconstruct the Commitments:**
      *   (1) **Constraint Thesis:** Agent-relative constraint against intentional killing in small numbers (1 vs. 2). Impermissible to kill 1 to stop 2 others from killing 1 each.
      *   (2) **Threshold Thesis:** Constraints have a threshold (1 vs. 50). Permissible/required to kill 1 to stop 50 others.
      *   (3) **Victim-Centered Grounding:** The *wrongness* is grounded in agent-neutral badness (harm to victim). Everyone has reason to want it not to happen.
      *   (4) **No Brute Indexicality:** Universalizability. No fundamental reasons based solely on "it's me." If wrong for me in C, wrong for anyone in C.
      *   (5) **Partiality Thesis:** Permissible partiality to associates (children, promisees). Not just weakness.
      *   (6) **Case Verdicts:** Signal Box (1 vs. 2 = Impermissible), Reservoir (1 vs. 50 = Permissible). Consistent with (1) and (2).

  3.  **Initial Scan for Tensions:**
      *   *The Big One:* (1) + (3) + (4). If the ground is agent-neutral harm (3), and reasons must be universalizable/non-indexical (4), why is it impermissible for *me* to minimize that harm in the 1 vs. 2 case (1)? Usually, agent-neutral grounds + universalizability = Consequentialism (or something close to it).
      *   *The Threshold Problem:* (1) + (2). How do you get a threshold if the ground is agent-neutral harm? If harm is the ground, 50 harms > 1 harm. Why does the constraint kick in at 1 vs. 2 but vanish at 1 vs. 50? This is the "collapse" problem for threshold deontology.
      *   *The Partiality Angle:* (5). Does partiality help explain the constraint? Usually, constraints are about *agency* (I shouldn't kill), while partiality is about *special duties* (I should save my kid). But some link them via "agent-relative reasons."
      *   *Universalizability:* (4) says "If wrong for me in C, wrong for anyone in C." This seems compatible with constraints (everyone is constrained). But combined with (3), it pushes towards "Everyone has reason to minimize harm."

  4.  **Detailed Analysis of Tensions:**

      *   **Tension A: The Grounding/Constraint Conflict (3 vs. 1 & 4).**
          *   *Issue:* (3) says the wrongness is the *victim's harm* (agent-neutral). (4) says reasons are universal. If the reason not to kill is "harm to victim," and I can prevent *more* harm to victims by killing one, agent-neutral reasoning suggests I should kill one. (1) says I shouldn't.
          *   *Severity:* High. This is the classic Nagel/Scheffler objection. If the ground is purely agent-neutral, where does the agent-relativity of the constraint come from?
          *   *Resolution:* Need to argue that the *distribution* of agency matters, not just the sum of harm. But (3) says the ground is the harm. This looks like a contradiction unless (3) is qualified.

      *   **Tension B: The Threshold/Grounding Conflict (2 vs. 3).**
          *   *Issue:* If the ground is victim harm (3), harm aggregates. 50 deaths > 1 death. Why does the constraint hold at 2 deaths but break at 50? If the ground is the *same* (victim harm), the threshold looks arbitrary or requires a different ground at the threshold.
          *   *Severity:* High. Threshold deontology is notoriously difficult to ground without collapsing into consequentialism or positing a lexical priority that (2) explicitly denies (by allowing trade-offs at 50).
          *   *Resolution:* Maybe the "harm" isn't just physical death but "being killed by an agent." But (3) says "grave harm and loss."

      *   **Tension C: Universalizability vs. Agent-Relativity (4 vs. 1).**
          *   *Issue:* (4) says "If wrong for me... wrong for anyone." (1) says "It is impermissible for an agent..." This actually looks *consistent*. (1) applies to all agents. The tension arises if (4) is interpreted as "If there is a reason for me, it applies to everyone *in the same way*." Agent-relative constraints say the reason is stronger for the agent *doing* the killing.
          *   *Clarification:* (4) bans "brute indexicality" ("because it's me"). But constraints often rely on "because I would be the killer." Is that brute indexicality? Nagel says no, it's a structural feature of agency. But (4) is phrased strongly ("me-ness itself does the justificatory work").
          *   *Severity:* Medium-High. Depends on interpretation of "me-ness."

      *   **Tension D: Partiality vs. Victim-Centered Grounding (5 vs. 3).**
          *   *Issue:* (5) allows favoring associates. (3) says reasons are grounded in victim harm (agent-neutral). Why can I favor my child's harm-prevention over a stranger's if the ground is agent-neutral victim harm?
          *   *Severity:* Medium. This is the standard Partiality vs. Impartiality debate. Usually resolved by distinguishing *grounds of wrongness* (3) from *permissions to act* (5). But if (3) is the *fundamental* explanation of wrongness, it might crowd out (5).
          *   *Potential Resolution:* Partiality might be the *key* to solving the Constraint problem. If I have agent-relative reasons to care about my own agency (like I care about my child), maybe that grounds the constraint.

      *   **Tension E: Signal Box/Reservoir Consistency (6 vs. 1 & 2).**
          *   *Issue:* (6) just instantiates (1) and (2). No internal tension here, provided the cases match the descriptions.
          *   *Severity:* Low.

  5.  **Synthesizing the Core Problem:**
      The central instability is between **(3) Victim-Centered Grounding** and **(1)/(2) Constraint/Threshold Theses**, mediated by **(4) No Brute Indexicality**.
      *   If the wrongness is *just* the victim's harm (3), and reasons are universal (4), then minimizing total victim harm is the rational requirement.
      *   To block this in the 1 vs. 2 case (1), you need an agent-relative reason *not to kill*.
      *   To allow it in the 1 vs. 50 case (2), you need that agent-relative reason to be outweighable.
      *   (4) threatens to rule out the agent-relative reason as "brute indexicality."
      *   (5) Partiality might offer a model for agent-relative reasons that aren't "brute," but (3) ties the *wrongness* of killing to victim harm, not agency integrity.

  6.  **Developing the Audit Structure:**
      *   **Introduction:** Acknowledge the sophistication of the package (it's a "Nagelian" or "moderate deontological" package).
      *   **Primary Tension (The Grounding Gap):** (3) vs. (1)+(4). This is the most severe.
      *   **Secondary Tension (The Threshold Arbitrariness):** (2) vs. (3).
      *   **Tertiary Tension (Partiality's Role):** (5) vs. (3) or (5) as a solution.
      *   **Ranking:** Grounding > Threshold > Partiality.
      *   **Least Costly Revision:** Modify (3).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Refining (4):* "No brute indexicality." Does "I shouldn't kill because *I* would be the killer" count as brute? Scheffler says yes (unless grounded in something else). Nagel says no (it's the standpoint of agency). The user's phrasing "me-ness itself does the justificatory work" suggests they want to avoid Scheffler's critique. This puts pressure on (1).
      *   *Refining (3):* "Fundamentally explains... is an agent-neutral matter." This is the weak link. If the *fundamental* explanation is agent-neutral, the constraint (1) looks like a fetish.
      *   *Refining (5):* Partiality is usually grounded in relationships. If killing is wrong because of victim harm (3), partiality (5) is hard to square unless relationships modify the *weight* of agent-neutral reasons.
      *   *The "Least Costly Revision":* If I change (3) to include "agent-relative disvalue of *doing* harm," I save (1) and (2). But does that violate (4)? Only if "doing" is considered "brute indexicality." I need to argue that "agency" is not "brute me-ness."
      *   *Alternative:* Change (4). Allow a specific form of indexicality (agency).
      *   *Alternative:* Change (1). Accept consequentialism in 1 vs. 2. (High cost to the project).
      *   *Best bet:* Modify (3). The victim harm is necessary but not sufficient. The *mode* of causation (intentional killing by *me*) adds disvalue. This preserves (1) and (2). Does it violate (4)? Only if we define "me-ness" too broadly. We can argue that "being the agent" is a universalizable structural fact, not a brute indexical one.

      *   *Wait, look at (5) again.* Does Partiality help? If I can favor my child, I have agent-relative reasons. If I have agent-relative reasons regarding my child, maybe I have them regarding my own moral integrity/agency. This suggests (5) points toward a resolution for (1), but only if (3) is adjusted to allow agent-relative *values*, not just agent-neutral grounds.
      *   *Actually, the prompt asks:* "whether my partiality claim creates an additional problem or points toward a resolution."
      *   *Analysis:* If (3) is true (all grounds agent-neutral), (5) is hard to justify (why favor my child's harm prevention over two strangers?). So (3) threatens (5) too. If (5) is secure, (3) is likely false. Thus, (5) points to the need to revise (3).

  8.  **Finalizing the Recommendations:**
      *   **Severity 1:** (3) vs. (1) & (4). (The "Consequentialist Pull").
      *   **Severity 2:** (3) vs. (2). (The "Threshold Collapse").
      *   **Severity 3:** (3) vs. (5). (The "Impartiality Pressure").
      *   **Recommendation:** Revise (3). Move from "Victim-Centered Grounding" to "Dual-Grounding" (Victim Harm + Agent Integrity/Agency). This saves (1), (2), and (5) without violating (4) if "Agency" is treated as a universal structural feature, not brute indexicality.

  9.  **Checking against constraints:**
      *   Did I answer the specific questions? Yes (Grounding/Universalizability undermining constraints? Yes. Partiality problem or resolution? Points to resolution via revision of Grounding).
      *   Did I rank tensions? Yes.
      *   Did I identify least costly revision? Yes (Modify 3).
      *   Tone check: Academic, precise, no fluff.

  10. **Self-Correction/Nuance Check:**
      *   *Is (4) really violated by constraints?* Many deontologists argue constraints *are* universalizable (everyone is constrained). The issue is the *source* of the reason. (4) bans "me-ness" as the *justificatory work*. If the justification is "harm to victim," that's agent-neutral. If the justification is "I am the killer," is that brute? The user defines it as such. So I must treat (1) + (3) + (4) as the triad of trouble.
      *   *Threshold:* The 1 vs. 50 case is the hardest for deontology. If the constraint is based on rights, do rights vanish at 50? If based on harm, why not at 2? The revision to (3) needs to handle this. A "lexical" view or a "disproportionate harm" view might be needed. But the user wants to keep (2). So the revision must allow the agent-relative reason to be *overweightable*.
      *   *Partiality:* If I revise (3) to allow agent-relative reasons, (5) becomes easier to ground. So (5) supports the revision of (3).

  11. **Final Polish:** Ensure the distinction between "agent-neutral grounds" and "agent-relative reasons" is clear. (3) claims the *grounds* are agent-neutral. This is the specific point of failure.

      *(Self-Correction during drafting)*: I need to be careful with (4). "If a consideration makes it wrong for me... it makes it wrong for anyone." This is formal universalizability. Constraints satisfy this (It's wrong for anyone to kill in C). The tension is deeper: If the *consideration* is "total harm," then (4) implies everyone must minimize total harm. If the *consideration* is "my agency," (4) implies everyone must respect their own agency. (3) says the consideration is "victim harm." That's the bottleneck.

      Okay, ready to write. The structure will be:
      1.  Executive Summary.
      2.  Analysis of Primary Tension (Grounding vs. Constraint/Universalizability).
      3.  Analysis of Secondary Tension (Threshold vs. Grounding).
      4.  Analysis of Tertiary Tension (Partiality vs. Grounding).
      5.  Ranking and Costs.
      6.  Recommended Revision.
      7.  Conclusion on Specific Questions.

      *Wait, one more check on (6).* Signal Box vs. Reservoir. The user says "Intentions... held fixed except for who kills." In Signal Box, *I* kill 1 to stop 2 others killing. In Reservoir, *I* kill 1 to stop 50 others killing. This matches (1) and (2). No tension internal to (6).

      *Wait, check (4) again.* "There are no fundamental moral reasons of the form that I must not do it simply because it would be done by me." This is a direct attack on the standard defense of constraints (the "doing/allowing" or "my agency" defense). If the user holds (4), they cannot use "because I would be the killer" as the fundamental reason. They *must* use (3) "victim harm." But (3) + (4) -> Consequentialism. This is the critical insight. The package is likely inconsistent unless (3) or (4) is modified. Since (1) is the core project, (3) or (4) must go. (4) seems more fundamental to a rationalist morality, but (3) is the specific grounding claim. Revising (3) is less costly than abandoning universalizability (4). But revising (3) risks violating (4) if the new ground is "my agency."
      *Solution:* The new ground must be "the disvalue of *an agent* intentionally killing," which is universalizable (applies to all agents) but agent-relative in application (each agent tracks their own agency). This navigates (4).

      Okay, plan solid. Proceed.ct.
answer: |-
  This is a sophisticated package of views, broadly aligning with a "moderate deontological" or "threshold constraint" position similar to those defended by Nagel, Scheffler, or Quinn. However, the specific formulation of your grounding and universalizability theses creates significant structural pressure on your constraint and threshold verdicts.

  Below is a consistency audit of commitments (1) through (6).

  ### 1. Analysis of Tensions

  #### Tension A: The Grounding/Universalizability vs. Constraint Conflict
  **Commitments Involved:** (1) Constraint, (3) Victim-Centered Grounding, (4) No Brute Indexicality.
  **Severity:** **Critical.**

  This is the most severe instability in your package. It is a variation of the "consequentialist pull" objection.

  *   **The Conflict:** (3) asserts that the *fundamental explanation* for the wrongness of killing is the agent-neutral badness of victim harm. (4) asserts that moral reasons must be universalizable and cannot rest on "me-ness." If the fundamental reason to avoid killing is the agent-neutral disvalue of victim harm, then in the *Signal Box* case (1 vs. 2), the agent-neutral reasons favor intervention (1 death is less bad than 2 deaths).
  *   **The Problem:** To uphold (1) (that intervention is impermissible), you need an agent-relative reason strong enough to outweigh the agent-neutral reason to minimize victim harm. However, (4) prohibits fundamental reasons based on "me-ness" (i.e., "I must not kill because *I* would be the killer"). If you cannot appeal to the special significance of *your* agency (due to 4), and the only fundamental ground is victim harm (due to 3), you lack the resources to block the trade-off in (1).
  *   **Apparent vs. Genuine:** This is a **genuine inconsistency**. You cannot maintain that the *fundamental* ground is purely agent-neutral harm while simultaneously claiming it is impermissible to minimize that harm in small-number cases, unless you posit a fundamental agent-relative reason that (4) appears to ban.

  #### Tension B: The Threshold/Grounding Conflict
  **Commitments Involved:** (2) Threshold, (3) Victim-Centered Grounding.
  **Severity:** **High.**

  *   **The Conflict:** (3) posits a single fundamental ground: victim harm. Harm is generally aggregative. If victim harm is the sole fundamental ground, it is difficult to explain why 2 units of harm (Signal Box) cannot outweigh 1 unit, but 50 units (Reservoir) can.
  *   **The Problem:** This creates the "arbitrariness" objection to threshold deontology. If the *nature* of the wrongness is identical in both cases (victim harm), the threshold looks like a brute stipulation rather than a principled distinction. To make (2) principled, the *structure* of the reasons must shift at the threshold (e.g., from lexical priority to weighting). But (3) suggests a monistic ground.
  *   **Apparent vs. Genuine:** This is a **genuine inconsistency** regarding explanatory depth. You can hold the verdicts, but (3) cannot *explain* the threshold without additional machinery (e.g., a discontinuous value function) that (3) does not currently specify.

  #### Tension C: Partiality vs. Victim-Centered Grounding
  **Commitments Involved:** (5) Partiality, (3) Victim-Centered Grounding.
  **Severity:** **Medium.**

  *   **The Conflict:** (5) permits favoring associates (e.g., saving your child over two strangers). (3) states the fundamental ground of moral concern is agent-neutral victim harm. If the fundamental reason to save a life is the agent-neutral badness of death, it is unclear why you are permitted to prioritize your child's death-prevention over a greater aggregate prevention of death for strangers.
  *   **The Problem:** Standard defenses of partiality rely on agent-relative reasons (e.g., "she is *my* child"). If (3) restricts fundamental grounds to agent-neutral harm, (5) becomes difficult to justify without treating partiality as a mere concession to weakness (which (5) explicitly denies).
  *   **Apparent vs. Genuine:** This is a **genuine tension**, though potentially resolvable if "relationships" are treated as modifying the *weight* of agent-neutral reasons. However, combined with Tension A, it suggests (3) is too restrictive to support the agent-relative features of your view.

  #### Tension D: Universalizability vs. Agent-Relativity
  **Commitments Involved:** (4) No Brute Indexicality, (1) Constraint.
  **Severity:** **Low/Medium (Interpretive).**

  *   **The Conflict:** (1) requires an agent-relative constraint. (4) bans "brute indexicality."
  *   **The Nuance:** Many deontologists argue constraints *are* universalizable (e.g., "No agent may intentionally kill"). The tension arises only if the *justification* for the constraint relies on "because it is *me*."
  *   **Resolution:** This tension is manageable if you interpret "agency" not as "brute me-ness" but as a universal structural feature of moral patients who are also agents. However, given your phrasing in (4) ("me-ness itself does the justificatory work"), you have set a high bar that threatens standard defenses of (1).

  ### 2. Ranking and Costs of Revision

  | Rank | Tension | Commitments Involved | Cost of Revision |
  | :--- | :--- | :--- | :--- |
  | **1** | **Grounding/Constraint** | (3) vs. (1) & (4) | **High.** Revising (3) requires a new meta-ethical account of value. Revising (1) abandons the core project. Revising (4) risks irrationality charges. |
  | **2** | **Threshold/Grounding** | (3) vs. (2) | **Medium.** Requires complicating the theory of value (e.g., lexical thresholds) but preserves verdicts. |
  | **3** | **Partiality/Grounding** | (3) vs. (5) | **Medium.** Requires expanding the grounds of value to include relational facts. |

  ### 3. The Single Least Costly Revision

  **Recommendation: Revise (3) Victim-Centered Grounding.**

  **Current (3):** *What fundamentally explains why intentional killing of this kind is wrong is an agent-neutral matter: the grave harm and loss to the victim...*

  **Proposed Revision (3*):** *What fundamentally explains why intentional killing of this kind is wrong is a hybrid matter: the grave harm to the victim **plus** the distinctive disvalue of an agent intentionally causing such harm.*

  **Why this is the least costly revision:**
  1.  **Preserves (1) & (2):** By introducing the "disvalue of agency" (or "agent-relative disvalue of doing"), you generate the extra weight needed to block the 1 vs. 2 trade-off (Signal Box) without denying the victim harm. It also allows for the threshold (Reservoir): at 50 deaths, the agent-neutral harm becomes so massive it outweighs the agent-relative disvalue of doing.
  2.  **Preserves (4):** You can argue that "the disvalue of an agent intentionally causing harm" is universalizable. It applies to *every* agent regarding *their own* agency. It is not "brute indexicality" (I matter more than you); it is "structural indexicality" (every agent matters to themselves as an agent). This satisfies the universalizability requirement of (4) while grounding the constraint in (1).
  3.  **Resolves (5):** If you allow agent-relative disvalue in the context of agency (killing), it opens the door to agent-relative value in the context of relationships (partiality). This makes (5) easier to ground without contradicting the revised (3*).
  4.  **Minimal Disruption:** It does not require changing your verdicts (6) or your core constraint thesis (1). It only requires deepening the axiology.

  **Cost:** You lose the purity of the agent-neutral grounding. You must now defend the claim that "agency" has intrinsic normative significance independent of victim outcomes. This invites the "fetishism" objection (valuing clean hands over lives), but this is a standard and manageable cost for deontological projects.

  ### 4. Specific Answers to Your Questions

  **Do my grounding and universalizability claims undermine my constraint and threshold verdicts?**
  **Yes.** As currently formulated, (3) and (4) jointly undermine (1). If the ground is purely agent-neutral harm (3) and reasons cannot rely on "me-ness" (4), rationality demands minimizing harm in the Signal Box case. Your current package lacks the normative "glue" to hold the constraint in place against the agent-neutral pressure. Similarly, (3) undermines (2) by making the threshold look arbitrary; if harm is the only ground, there is no principled reason why 2 deaths don't outweigh 1, if 50 do.

  **Does my partiality claim create an additional problem or point toward a resolution?**
  **It points toward a resolution.** Currently, (5) creates tension with (3) for the same reason (1) does: partiality requires agent-relative reasons, but (3) allows only agent-neutral grounds. However, this shared vulnerability indicates that **(3) is the bottleneck**.
  If you revise (3) to allow for fundamental agent-relative reasons (specifically regarding agency), you solve the Constraint problem (1). Once you have admitted agent-relative reasons into your fundamental ontology to save (1), you can use that same ontological move to ground (5). Thus, securing (5) actually supports the argument for revising (3) in the way recommended above. The defense of partiality and the defense of constraints often stand or fall together on the question of whether agent-relative reasons are fundamental.

  ### Summary Audit
  Your package is **currently inconsistent** due to the conflict between the agent-neutral grounding (3) and the agent-relative constraint (1), exacerbated by the universalizability clause (4). The verdicts (6) are stable, but the theoretical machinery (3 & 4) cannot support them.

  **Action Plan:**
  1.  **Retain** (1), (2), (4), (5), and (6).
  2.  **Modify** (3) to include the disvalue of *agency* (intentional doing) as a fundamental ground alongside victim harm.
  3.  **Clarify** (4) to ensure it bans "brute me-ness" but permits "universal agent-relativity" (i.e., every agent has a special relation to their own will).

  This restores joint stability while preserving the core deontological intuitions driving your PhD project.
