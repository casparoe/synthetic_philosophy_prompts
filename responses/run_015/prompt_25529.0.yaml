answer: |-
  # The Material Constitution Decision Tree

  **Instructions:** Start at the top. Answer each question honestly based on your intuitions about the **Statue and the Clay**. Follow the branch that matches your answer until you reach a leaf.

  ```text
  NODE 1: Do whole objects (like statues or cats) really exist, 
          or are there only tiny particles arranged that way?
          │
          ├── [Only Particles] ──► LEAF A: MEREOLOGICAL NIHILISM
          │                       │
          │                       └─ Awkward Commitment: You, this paper, and 
          │                          statues do not exist; only atoms do.
          │
          └── [Whole Objects Exist] ──► NODE 2: Is the statue literally the very 
                                        same object as the lump of clay?
                                        │
                                        ├── [Yes, One Thing] ──► LEAF B: THE IDENTITY VIEW
                                        │                       │
                                        │                       └─ Awkward Commitment: You must deny 
                                        │                          they have different survival 
                                        │                          conditions (e.g., squashing).
                                        │
                                        └── [No, Two Things] ──► NODE 3: Can two distinct physical 
                                                                 objects be in the exact same 
                                                                 place at the exact same time?
                                                                 │
                                                                 ├── [Yes, Coincidence OK] ──► NODE 4: Do objects have parts 
                                                                                               spread out in time (past/future 
                                                                                               slices) just like space?
                                                                                               │
                                                                                               ├── [Yes, Time-Slices] ──► LEAF C: FOUR-DIMENSIONALISM
                                                                                               │                           │
                                                                                               │                           └─ Awkward Commitment: You are a 
                                                                                               │                              space-time worm; your "now" 
                                                                                               │                              is just a slice of you.
                                                                                               │
                                                                                               └── [No, Wholly Present] ──► LEAF D: THE CONSTITUTION VIEW
                                                                                                                           │
                                                                                                                           └─ Awkward Commitment: Two distinct 
                                                                                                                              things share all matter and 
                                                                                                                              space, yet weigh only as much 
                                                                                                                              as one.
                                                                                               │
                                                                                               └── [No, Impossible] ──► NODE 5: When the statue is formed, 
                                                                                                                        does the original lump of clay 
                                                                                                                        cease to exist?
                                                                                                                        │
                                                                                                                        ├── [Yes, Clay Perishes] ──► LEAF E: DOMINANT KINDS VIEW
                                                                                                                        │                           │
                                                                                                                        │                           └─ Awkward Commitment: Reality 
                                                                                                                        │                              changes what exists based on 
                                                                                                                        │                              which kind is "dominant."
                                                                                                                        │
                                                                                                                        └── [No, Both Survive] ──► LEAF F: THE EMPTY REGION
                                                                                                                                                    │
                                                                                                                                                    └─ Why Empty?: If they are distinct, 
                                                                                                                                                       can't coincide, and neither 
                                                                                                                                                       perishes, they must be in 
                                                                                                                                                       different places. But they 
                                                                                                                                                       aren't. Contradiction.
  ```

  ### Notes on the Logic
  1.  **Nihilism** exits early because it denies the presupposition of the other puzzles (that composites exist).
  2.  **Identity** is separated immediately by Leibniz's Law intuitions.
  3.  **Coincidence (Node 3)** is the major split between **Constitution/4D** (who allow distinct objects in the same place) and **Dominant Kinds** (who usually argue the subordinate kind ceases to exist to avoid coincidence).
  4.  **Temporal Parts (Node 4)** distinguishes **4D** (objects are worms) from **Constitution** (objects are wholly present 3D entities).
  5.  **The Empty Region** flags a logically unstable position: denying coincidence without a mechanism (like dominance/cessation) to explain how two distinct objects avoid occupying the same space.
