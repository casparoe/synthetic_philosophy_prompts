  I'm in a metaphysics seminar this term, and we've been working through the material constitution literature — Gibbard's statue and lump of clay, the puzzle of Tibbles the cat, the Ship of Theseus, and the various attempts to say what the relationship is between an object and the stuff that constitutes it. My professor has walked us through at least six positions: the constitution view (where the statue and the clay are distinct objects that coincide, à la Lynne Rudder Baker), the dominant kinds view (Burke, Rea), mereological nihilism (van Inwagen-style, where only simples exist), four-dimensionalism (objects are space-time worms, so the statue and the clay are different temporal parts of the same worm), the identity view (the statue just is the clay — they're one object under different descriptions), and coincidentalism more broadly. I need to write a paper defending one of these, but I keep oscillating depending on which puzzle case I'm thinking about.

  So before I write the paper, I want to build a decision tree that sorts someone into their actual position based on how they answer concrete questions about the cases. The tree should start from the simplest possible question — probably something about the statue and the clay — and branch from there. Each node should be a question someone could answer without knowing any philosophical jargon, and each branch should be labeled with the answer that sends you down that path. The leaves should name the position and give a one-sentence summary of its most awkward commitment. I want at least these positions as leaves: the constitution view, dominant kinds, nihilism, four-dimensionalism, and the identity view. If the logical space contains coherent combinations of answers that no one defends, flag those empty regions and say why they're empty. Also, if there are any pairs of positions your tree genuinely can't separate, be honest about that rather than forcing a distinction that isn't there.

  Please keep the whole tree to one page — say, eight to fourteen nodes total — so it's actually usable as a handout.
