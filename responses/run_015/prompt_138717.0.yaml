answer: |-
  This is a fascinating impasse, and your instinct as a chemist is serving you well here. You have identified what philosophers call an **equivocation**: you are using one term ("history") to cover three distinct logical categories. Your reading group is stuck because you are having three different arguments while pretending to have one.

  Here is an analysis of your diagnosis, the legitimacy of your "noisy channel" hypothesis, and a proposal for how to actually break the deadlock.

  ### 1. Is the diagnosis right?
  **Yes, entirely.** You have correctly identified that the group is conflating ontology, epistemology, and genealogy.

  *   **Ontology (Did the event occur?):** This is a binary question about the past state of the world. Did a coalition of Mycenaean Greeks attack a city in the Troad?
  *   **Identity (Did the person exist?):** This is a specific subset of ontology. Was there a male human named Arthur who led battles in the 6th century?
  *   **Genealogy (Is the story a garbled memory?):** This is a question about causality. Is the *Iliad* causally linked to real events, even if the details are wrong?

  The reason you are going in circles is that "History" is being used to mean both *the past as it happened* (Ranke's *wie es eigentlich gewesen*) and *the disciplined reconstruction of the past*.

  When a member of your group says, "Arthur is history," they might mean "There was a real guy" (Ontology). When another says, "Arthur is legend," they might mean "We cannot reconstruct his life using critical methods" (Epistemology). You are all agreeing on the evidence but disagreeing on the **threshold of categorization**.

  **Philosophical Terminology to Introduce:**
  Introduce the Latin distinction between *res gestae* (the things that were done) and *historia rerum gestarum* (the story of the things that were done). Your group is arguing about *res gestae* while looking at *historia*.

  ### 2. Is the "Noisy Channel" move legitimate?
  **It is legitimate, but it is a methodological shift, not an ontological proof.**

  You are proposing a **Bayesian approach** to historiography. In information theory, if the noise-to-signal ratio is high, the absence of a clear signal does not prove the absence of a transmitter.

  *   **Why it works:** It correctly models oral tradition. We know from oral-formulaic theory (Parry and Lord) that oral cultures preserve "gist" while varying "details." Treating the transmission medium as a variable that degrades specific data (dates, names) while preserving structural data (conflicts, migrations) is scientifically sound.
  *   **The Risk:** The category mistake risk lies in **unfalsifiability**. If you define the "noise" as high enough to explain away the lack of written records, you can make any legend "possible." In chemistry, you can measure the noise floor. In history, the noise floor is hypothetical.
  *   **The Fix:** You must treat this as a **probability adjustment**, not a truth claim. Your move shifts the burden of proof. It changes the statement from "There is no evidence, therefore it didn't happen" to "Given the high noise of the medium, the lack of evidence is neutral, not negative."

  This is not a category mistake; it is an application of **Inference to the Best Explanation**. However, you must warn your group that this does not make the legend *true*; it merely makes it *not false by default*.

  ### 3. What counts as progress?
  Waiting for new archaeology is a fool's errand; the dirt has been turned over on these sites for a century. Dropping the question is unnecessary. The progress you need is **conceptual refinement**.

  Here are three specific proposals to break the two-year deadlock:

  **A. Adopt a "Spectrum of Historicity" Model**
  Stop asking "Is it legend OR history?" That is a Boolean trap. Propose a spectrum:
  1.  **Myth:** Etiological stories with no claim to temporal specificity (e.g., Creation).
  2.  **Legend:** Stories set in a specific past, claiming human agents, but unverifiable (Arthur).
  3.  **Traditional History:** Stories with some external corroboration but heavy narrative shaping (Trojan War).
  4.  **Critical History:** Events reconstructible via contemporary documentation (Peloponnesian War).

  Ask the group to vote on where each case falls on the spectrum, rather than binary yes/no. You will likely find you agree on the placement, even if you disagree on the label.

  **B. Shift from Correspondence to Function (The Veyne Move)**
  Suggest reading Paul Veyne's *Did the Greeks Believe in Their Myths?* Veyne argues that asking "Did they believe it happened?" is the wrong question. The question is: **What work does this story do?**
  *   **Exodus:** Functions as a constitution for a people, not a travel log.
  *   **Arthur:** Functions as a mirror for kingship and chivalry, not a biography.
  *   **Troy:** Functions as a bridge between the Greek present and a heroic age.

  If you shift the question to "At what point does a story stop functioning as identity-formation and start functioning as data-retrieval?", you might find a concrete answer. A legend becomes history when the group telling it starts caring more about *accuracy* than *meaning*.

  **C. Formalize the "Noise Floor" (Your Chemist Contribution)**
  Make your noisy channel hypothesis the formal framework for the next six months.
  *   Define the "half-life" of oral data. (e.g., After 200 years, specific names degrade; after 400, specific locations degrade).
  *   Apply this to the cases.
      *   **Arthur:** Textual gap is ~400 years. Noise floor suggests specific battles are lost, but the *concept* of a leader remains plausible.
      *   **Exodus:** Textual gap is ~600+ years. Noise floor suggests the *narrative* is preserved, but the *event* is unrecoverable.
  *   This turns the debate from "I feel like it's true" to "Does this fit the degradation model?"

  ### Summary Recommendation
  Your diagnosis is correct: you are answering three different questions. Your "noisy channel" move is a legitimate Bayesian correction to the argument from silence.

  **To move forward:**
  Propose a moratorium on the word "History." Replace it with **"Verifiable Past"** vs. **"Cultural Memory."**
  *   **Trojan War:** Verifiable Past (destruction layers) + Cultural Memory (Homer).
  *   **Arthur:** Cultural Memory only (Verifiable Past is null).
  *   **Exodus:** Cultural Memory only (Verifiable Past contradicts the scale).

  If you can get the group to agree that a story can be **historically significant** (it shaped the world) without being **historically accurate** (it happened as described), the circle will break. You aren't looking for the event anymore; you are looking for the threshold where the *claim* to accuracy outweighs the *function* of the myth. That is a philosophical question you can actually answer.
