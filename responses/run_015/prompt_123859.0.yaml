answer: |-
  Section 4.2: Bid Forfeiture. All submitted bids constitute nonrecoverable expenditures regardless of award status. Section 7.1: Constraint Instruments. The 'Lasso' function permits a bidder to establish a maximum bid threshold. Adjustment upward incurs a fee schedule equal to 2^n times the base instrument cost. Section 8.3: Information Requests. 'Peek' transactions are recorded anonymously. Aggregate data released post-closure.

  ***

  The terminal screen hummed with a low-frequency vibration that Elias felt in his teeth. The room was dark, save for the glow of the procurement portal and the status lights on the server rack. Outside, the city slept, but here the clock was ticking down from ten minutes. It reset with every bid.

  Elias clicked the icon for the information request. The confirmation dialogue box appeared, stark and white. *Fee: 5,000. Nonrefundable.* He clicked confirm. The balance in his operating account dipped instantly. He did not blink. He had read the papers on this specific design, the ones that described how the architecture itself generated the momentum. He knew the shape of the box he was stepping into.

  The peek result populated the field. *Counterparty Lasso Ceiling: 3,000,000.*

  Elias leaned back. Three million. The analysts on both sides had agreed on the net value of the lease: 3,100,000. The Foundation Executive, Vance, had set her ceiling ten percent below value. She had announced it at the gala last week, standing under the chandeliers with a glass of champagne, telling the donors that the lasso was a guardrail against irrationality. A public gesture of discipline. She had made her restraint a matter of record before the first bid was placed.

  Now the current high bid sat at 2,950,000. Vance was winning.

  Elias typed in 3,010,000. The increment was fixed at ten thousand. He hit submit. The system accepted the bid. His available capital decreased by the difference, but the ledger showed the total forfeitable amount rising. If he lost now, he owed 3,010,000. If he won, he owed 3,010,000. The money was gone the moment the command executed.

  He watched the timer. Nine minutes. Eight.

  Vance could not bid 3,020,000. Her software would reject it. She was capped at three million. To continue, she had to interact with the instrument she had purchased to limit herself. She had to pay to break her own promise.

  ***

  The timer hit zero. The screen flashed *New High Bidder: Foundation.*

  Elias watched the transaction log scroll. *Instrument Adjustment: Lasso Raise Level 1. Fee: 100,000.*

  There it was. The fresh loss. The original lasso fee was gone, sunk the moment she bought it. This new fee was separate, a toll gate erected after the journey had begun. It cost her 100,000 simply to be allowed to lose more money.

  She bid 3,050,000.

  Elias calculated the position. Her total expenditure to win at this level was 3,050,000 in bids plus 150,000 in instrument fees. The asset was worth 3,100,000. She was still technically in the green, but only barely. The margin was thinning. But the alternative was to walk away. If she quit now, she forfeited the 2,950,000 she had already bid in previous rounds, plus the initial fees. She would return to the donors with nothing but a receipt for three million in losses.

  Elias typed 3,100,000.

  He paused. This was the valuation. The break-even point. Any bid beyond this was pure destruction of capital. But the destruction was already paid for; it sat in the forfeit column. To stop now was to crystallize a loss of 3,010,000. To bid 3,100,000 was to risk a total loss of 3,100,000, but with a chance to acquire an asset worth 3,100,000. The net loss would be zero, minus the fees.

  It was rational to continue. That was the machinery. It made the irrational look like the only logical path forward.

  The timer reset. Ten minutes.

  He watched the cursor blink. He knew Vance was looking at the same screen. She knew he knew her ceiling. She had to raise the lasso again to beat 3,100,000. The fee schedule doubled each time. The next raise would cost 200,000.

  If she raised the lasso, she paid 200,000. Then she had to bid 3,110,000. Total cost: 3,310,000 plus previous fees. Value: 3,100,000. Loss: 210,000 minimum.

  If she quit, she lost her sunk bids. Approximately 3,050,000.

  The math compelled her. Losing 210,000 was preferable to losing 3,050,000. The structure forced her to throw good money after bad, not because she was foolish, but because the alternative was admitting the previous money was dead.

  Elias typed 3,200,000.

  He felt a tightness in his chest. He was bidding 100,000 above value. He was guaranteeing a loss on the lease itself. But if he won, his total loss was capped at the difference between bid and value. If he lost, his loss was the entire bid amount. He was trapped in the same geometry as Vance. He had read the literature, he understood the trap, and he stepped into it because the floor was made of glass and he was already falling.

  The timer counted down. Five minutes.

  *Instrument Adjustment: Lasso Raise Level 2. Fee: 200,000.*

  The notification scrolled past. Vance was still in. She had paid the toll. She bid 3,250,000.

  Elias looked at his ledger. *Total Forfeited Potential: 3,200,000.* He had not yet paid this, but it was reserved. His mind did not dwell on the total. It dwelt on the margin. The next increment was 10,000. The value was 3,100,000. He was 150,000 past the horizon.

  He could stop. He could let the timer run out. He would lose 3,200,000. Vance would win the lease for 3,250,000. She would lose 150,000 on the asset value, plus 350,000 in fees. She would have to explain to the donors why the discipline of the lasso had failed, why the guardrail had been moved.

  Or he could bid 3,260,000.

  He typed the number. His finger hovered over the key. The logic was clean. The pain was acute. Every bid was a fresh wound, but the old wounds dictated the movement. He pressed the key.

  ***

  The auction closed at 04:00.

  Elias sat in the dark. The screen displayed the final status. *Winner: Negotiator. Final Bid: 3,400,000.*

  He had won. He owned the lease. He had paid 3,400,000 for an asset worth 3,100,000. He had also paid 5,000 for the peek. Vance had paid 350,000 in lasso fees and forfeited her final bid of 3,390,000.

  The total value destroyed was visible only in the aggregate, but the portal did not show aggregates. It showed status.

  Elias refreshed the page. The results were static. Below the winner announcement, a new data point populated. *Information Requests Purchased: 14.*

  Fourteen people had paid to watch the ceiling. Fourteen people had paid to see how high the lasso would stretch before it snapped. The timer on the homepage counted down to the next procurement cycle. The server hummed. The mechanism waited for the next input.
