      *   *The Laundering:* In biology, there's no *claim* of understanding. In AI, there is a *claim* of utility/safety/competence without the underlying grasp.
      *   *The Messy Bit:* It's not just erasure; it's *fabrication* of agency. We treat the AI as an agent when it suits us (it "decided") and as a tool when it suits us (it's just code). Competence laundering allows the human principal to harvest the *value* of agency while dodging the *liability* of agency. It's a "heads I win, tails the algorithm lost" scenario.
