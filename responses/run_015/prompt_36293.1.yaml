      *   **The Problem:** The debate over Skolem's Paradox (Relativism vs. Categoricity/Absolutism) has been stagnant for a century (relativist side) to forty years (categoricity reply). No one is changing sides.
      *   **The Task:** Do *not* give a survey. Give a *diagnosis*.
      *   **Specific Questions to Address:**
