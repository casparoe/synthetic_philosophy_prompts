          *   Is it two questions under one name (mathematical vs. philosophical)?
          *   What would count as progress? (New formal result, right distinction, or grounds for expecting none?)

  2.  **Deconstruct the Debate:**
      *   **Relativists (Skolem, Putnam, etc.):** First-order logic is the only legitimate logic (or the only one with a complete proof system). L-S theorem shows "uncountable" is relative to the model. Therefore, set-theoretic notions are not absolute. Reference is indeterminate.
      *   **Absolutists/Categoricity Defenders (Zermelo, Shapiro, McGee, etc.):** Second-order logic (SOL) captures the intended meaning of "all subsets." SOL ZFC is quasi-categorical. Therefore, reference *can* be determinate *if* we accept SOL semantics.
      *   **The Stalemate:** Relativists say SOL semantics *presupposes* the very notion ("all subsets") that is in question. It begs the question. Absolutists say without SOL, we lose the objectivity of mathematics.

  3.  **Evaluate the "Verbal vs. Substantive vs. Two Questions" Hypotheses:**
      *   *Verbal?* Not really. Both sides understand what the other means by "determinate." They disagree on whether it's *achievable* or *coherent*.
      *   *Substantive (Platonism)?* Closer. It's about the metaphysics of sets. But it's deeper than just "do sets exist?" It's about the *determinacy of truth values* for independent statements (like CH).
      *   *Two Questions?* This is the most promising angle. There's a *mathematical* fact (L-S theorem vs. SOL categoricity) and a *philosophical* interpretation (what logic governs mathematical practice? what fixes reference?).

  4.  **Formulate the Diagnosis:**
      *   **Core Issue:** The debate isn't about the math (everyone agrees on the theorems). It's about the *normative status of logic*.
      *   **The "Logic" Bottleneck:** The relativist insists on First-Order Logic (FOL) as the canonical framework because of completeness/compactness. The absolutist insists on Second-Order Logic (SOL) because of expressiveness/categoricity.
      *   **The Real Disagreement:** It is a disagreement about *semantic ascent*. The relativist says semantics must be cashed out in set-theoretic terms (which leads back to L-S). The absolutist says semantics is primitive or grounded in practice/intuition.
      *   **Diagnosis:** It is **not** merely verbal. It is **not** merely about Platonism. It is a **clash of methodological commitments regarding the priority of logic vs. semantics.** It is effectively **two questions under one name**:
