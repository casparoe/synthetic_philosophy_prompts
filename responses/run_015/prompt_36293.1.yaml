answer: |-
  This is not a verbal dispute, nor is it merely a substantive disagreement about the ontology of sets. It is a **methodological clash regarding the priority of logic over semantics**, disguised as a dispute about set theory.

  Here is the diagnosis.

  ### 1. The Diagnosis: A Meta-Logical Impasse
  The stalemate persists because the two parties are operating with incompatible norms for what counts as a "fixing" of reference.

  *   **The Relativist (Skolem/Putnam)** operates under a **reductive semantic constraint**. They demand that the semantics of a theory be cashed out in a background theory (usually FOL set theory). Since the background theory is subject to Löwenheim–Skolem, the semantic values (like "all subsets") are always relative to a model of the background theory. For them, "determinate" means "determinate relative to a fixed background logic," and since no background logic is absolute, nothing is absolute.
  *   **The Categoricity Party (Zermelo/Shapiro)** operates under a **primitive semantic constraint**. They treat Second-Order Logic (SOL) with standard semantics as a linguistic framework that does not require reduction to a set-theoretic model to be meaningful. For them, "determinate" means "fixed by the rules of the language + the intended interpretation," where the intended interpretation is taken as a primitive grasp of "arbitrary subset."

  The dispute is not about whether the theorems hold (both sides agree on L-S and SOL categoricity). It is about **whether SOL semantics is philosophically legitimate without a model-theoretic reduction.** The relativist charges that SOL semantics is "set theory in sheep's clothing"; the absolutist replies that FOL is "proof theory in sheep's clothing" and fails to capture mathematical practice.

  ### 2. Is it Two Questions Under One Name?
  **Yes.** This is the most accurate characterization of the stagnation.

  1.  **The Mathematical Question:** *Can we characterize the continuum uniquely?*
      *   **Status:** Settled. In FOL: No. In SOL with standard semantics: Yes.
      *   **Consensus:** Everyone agrees on the theorems.
  2.  **The Philosophical Question:** *Does SOL with standard semantics provide a legitimate account of reference, or does it merely push the problem of "grasping the power set" back a step?*
      *   **Status:** Deadlocked.
      *   **Reason:** This question cannot be answered mathematically. It requires a meta-philosophical account of how humans grasp logical constants (specifically the second-order quantifier).

  The debate drags because participants treat the answer to (2) as if it were entailed by (1). Relativists argue that because (1) fails in FOL, (2) must be skeptical. Absolutists argue that because (1) succeeds in SOL, (2) must be realist. Neither inference holds without a prior commitment to which logic is "correct."

  ### 3. Substantive or Verbal?
  It is **substantive**, but not about the existence of sets. It is substantive about the **determinacy of truth values for independent sentences** (like CH).

  *   If the Relativist is right, CH has no determinate truth value because "all subsets" is indeterminate.
  *   If the Absolutist is right, CH has a determinate truth value (even if unknown) because "all subsets" picks out a unique domain.

  This is not verbal because the consequences for mathematical practice differ. If the Relativist wins, we should be comfortable with multiverse views or truth-value gaps. If the Absolutist wins, we are committed to finding new axioms that resolve CH. However, the *grounds* for the dispute are meta-logical, which makes it feel verbal: they are arguing past each other about which logic gets to set the rules of the game.

  ### 4. What Would Count as Progress?
  A new formal result will not solve this. We already have the L-S theorem and we already have SOL categoricity. More theorems will not tell us which logic governs reference.

  Progress requires one of three things:

  **A. The Right Distinction (Internal vs. External)**
  Progress would come from rigorously distinguishing **internal categoricity** from **external reference**.
  *   *Internal:* Within a theory, structures are unique up to isomorphism.
  *   *External:* The theory refers to a unique world.
  The Absolutists often slide from internal categoricity (which SOL gives) to external reference (which requires a grasp of the semantics). The Relativists exploit this slide. A diagnosis that forces the Absolutist to explain the *epistemology of the second-order quantifier* without appealing to set theory would force progress. If they cannot, the Relativist wins by default (parsimony). If they can (e.g., via a primitive grasp or modal structuralism), the stalemate breaks.

  **B. A Naturalized Semantics**
  Progress would come from a cognitive or pragmatic account of how "all subsets" is fixed without Platonic intuition. If we can show that mathematical practice *constitutively requires* SOL semantics to make sense of induction or continuity (a la Väänänen's work on expressive power), the Relativist's FOL restriction looks like an artificial philosophical constraint rather than a logical necessity. This shifts the burden: the Relativist must explain why we should restrict mathematics to FOL if it mutilates actual practice.

  **C. Grounds for Expecting None (Framework Pluralism)**
  The most likely outcome is a Carnapian dissolution. We accept that there is no "model-independent content" in the Absolutist's robust sense, but we also reject the Relativist's skeptical conclusion. Instead, we adopt **framework pluralism**:
  *   In the FOL framework, reference is relative.
  *   In the SOL framework, reference is determinate.
  *   There is no "super-framework" to judge between them.
  Progress here is the cessation of the demand for a "One True Logic." This is effectively the position of the Set-Theoretic Multiverse (Hamkins), which accepts the Relativist's model theory but rejects the skepticism, treating the "intended universe" as a local, not global, notion.

  ### Summary
  The dispute is a **meta-logical standoff**. The Relativist demands a reductive semantics (which yields skepticism); the Absolutist demands an autonomous semantics (which yields realism).

  **Progress** will not come from better set theory. It will come from:
  1.  Forcing the Absolutist to provide a non-circular epistemology for the second-order quantifier.
  2.  Forcing the Relativist to justify the restriction to FOL against the needs of mathematical practice.
  3.  Or, most plausibly, accepting that "determinate reference" is a framework-relative notion, dissolving the demand for model-independent content entirely.

  Until one side concedes on the nature of logic itself, the paradox will remain a paradox only for those who expect FOL to do SOL's job, or SOL to do Metaphysics' job.
