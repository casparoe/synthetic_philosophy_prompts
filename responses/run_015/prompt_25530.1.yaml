  **The Stratified Cure**

  In every ward the cure improves the rate.
  The data shines a clear and steady light.
  But in the whole, we meet a darker fate.

  For severe cases arrive far too late.
  They take the treatment when the hope is slight.
  In every ward the cure improves the rate.

  Where cases mild recover quick and straight.
  They do not need the drug to win the fight.
  But in the whole, we meet a darker fate.

  The weights imbalance each and every state.
  Confounding hides what otherwise is right.
  In every ward the cure improves the rate.

  Trust not the sum alone to validate.
  Look deeper till the path is clear and bright.
  But in the whole, we meet a darker fate.

  The parts are sound, the sum confounds the state.
  Both stories hold the paradox so tight.
  In every ward the cure improves the rate,
  But in the whole, we meet a darker fate.
