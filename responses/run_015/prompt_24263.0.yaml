answer: |-
  # Seminar Prep Sheet: Defending Strawson's Basic Argument (UR Version)

  **Your Core Stance:** You are a *Hard Incompatibilist* regarding **Ultimate Responsibility (UR)**, but a *Compatibilist* regarding **Momentary Choice**. You argue that while agents can choose according to their desires (avoiding the "no-choices" objection), they cannot be responsible for having those desires. Therefore, *basic desert* (retributive blame/praise) is impossible, even if forward-looking practices remain.

  ---

  ## Part 1: Strategic Boundaries

  **What to Concede Up Front (Pre-emptive Strikes):**
  1.  **Concede the utility of responsibility practices:** Acknowledge that holding people responsible is socially useful for regulation, education, and safety. Do not argue we should abolish courts or parenting.
  2.  **Concede momentary freedom:** Reiterate your concession: agents are not coerced in the moment. They act on their reasons. This disarms the "you're denying obvious experience" objection.
  3.  **Concede the metaphysical mystery:** Admit that *Ultimate Responsibility* requires something like *causa sui* (self-creation), which is logically incoherent. You aren't hiding a mystery; you're pointing one out.

  **What to Hold Firm (The Non-Negotiables):**
  1.  **The Regress:** You must hold that to be responsible for $X$, you must be responsible for the mental states that produced $X$. Since you cannot be responsible for your initial constitution (genetics/environment), the regress cannot be stopped.
  2.  **Desert vs. Utility:** Hold that *basic desert* is conceptually distinct from *forward-looking consequences*. If your view undermines desert, so be it. Do not try to redefine desert to save it.
  3.  **The Irrelevance of Frankfurt:** Hold that Frankfurt cases address *Alternative Possibilities (AP)*, but your argument addresses *Ultimate Origination (UR)*. Killing AP does not save UR.

  ---

  ## Part 2: The Objections (Ordered by Likelihood & Damage)

  ### 1. The "Relevance" Objection (Compatibilists)
  **Who:** The two Frankfurt/Compatibilist scholars.
  **The Question:** "You've conceded that agents act on their own desires and aren't coerced. You've conceded they can choose differently in the moment given different inputs. So, you've granted everything that matters for our actual practices of blame and praise. Why should we care about this 'Ultimate Responsibility' that no one actually uses? Aren't you just attacking a straw man of 'god-like' responsibility that isn't required for moral life?"

  **Your Reply (2 mins):**
  "I'm not attacking a straw man; I'm isolating the specific condition required for *basic desert*—the kind of blame that says you *merit* suffering because of your past, not because punishing you helps the future. Compatibilists offer a naturalistic account of agency, which is great for prediction and social cohesion. But when we feel *indignant*—when we feel an offender truly *deserves* retribution—we are implicitly invoking Ultimate Responsibility. We are saying, 'You authored yourself in this regard.'
  My point isn't that we should stop blaming. It's that we should recognize the metaphysical falsity underlying retributive hatred. If I concede momentary choice but deny UR, I'm saying: 'You chose this, but you didn't choose the "you" that chose this.' That is sufficient to vitiate *desert*, even if it leaves *social regulation* intact. The damage isn't to social order; it's to the justification of retributive punishment."

  **Where it's Soft:** You risk sounding like you're changing the subject. If they press that "desert" is just a social construct anyway, you have no metaphysical ground to stand on. You are relying on an intuition about desert that they reject.

  ### 2. The "Frankfurt is Enough" Objection (Compatibilists)
  **Who:** Same group, following up.
  **The Question:** "Frankfurt cases show that Alternative Possibilities (AP) aren't necessary for responsibility. Your Basic Argument relies on the idea that you 'could not have done otherwise' given your constitution. But if Frankfurt is right, the 'could not have done otherwise' point is irrelevant. Responsibility tracks reasons-responsiveness, not the ability to have chosen your own genes."

  **Your Reply (2 mins):**
  "This conflates two different 'could not have done otherwise' claims. Frankfurt kills the claim that I need the ability to choose $B$ instead of $A$ in the *moment*. I grant that. I am making a diachronic claim, not a synchronic one.
  The Basic Argument says: To be responsible for choice $A$, I must be responsible for the character that produced $A$. To be responsible for that character, I must have chosen it. But to choose it, I must have had a prior character. This regress stops only at factors I didn't choose (luck, genetics, environment). Frankfurt cases assume the agent's psychology is already fixed and ask if they could have acted differently. I am asking: 'Is the agent responsible for the psychology itself?' Frankfurt cases are silent on origination. They secure responsibility *within* a system; I am questioning responsibility *for* the system."

  **Where it's Soft:** If they argue that "responsibility for the system" is an incoherent demand (a "intelligibility" objection), you have to defend why that demand is necessary without sounding like you want magical libertarian freedom.

  ### 3. The "Agent Causation" Objection (Libertarian)
  **Who:** The Agent Causation proponent.
  **The Question:** "Strawson assumes the self is just a bundle of prior states (beliefs, desires). But if the self is a substance, an agent-cause, it can initiate a chain without being determined by prior states. You dismiss this as 'mysterious,' but isn't your dismissal just a dogmatic commitment to physicalism? Why isn't agent-causation a valid way to stop the regress?"

  **Your Reply (2 mins):**
  "It's not just a commitment to physicalism; it's a commitment to intelligibility. For me to cause my own nature, I must exist *prior* to having that nature in order to do the causing. But if I exist prior to having a nature, *what* am I? I am nothing determinate. If I am nothing determinate, how can I make a reasoned choice to create a specific nature?
  Agent causation posits a 'self' that stands outside the causal order to intervene in it. But if that self isn't shaped by prior reasons or character, its choice is random. If it *is* shaped by reasons, we are back in the regress. I'm not dogmatically denying it; I'm arguing that the concept of *causa sui* is logically equivalent to pulling oneself up by one's bootstraps. It's not physically impossible; it's conceptually incoherent."

  **Where it's Soft:** Dismissing agent causation as "incoherent" can sound like a conversation-stopper. If they press that *conscious agency* is itself a primitive fact not reducible to events, you may lack the metaphysical resources to refute them without a full philosophy of mind digression.

  ### 4. The "Dangerousness" Objection (Legal Philosophers)
  **Who:** The legal theorists.
  **The Question:** "Let's say you're right. No one deserves blame. But we still have to deal with violent offenders. If we remove desert, the only justification for incarceration is future dangerousness. That turns prisoners into patients to be quarantined indefinitely. Doesn't your view actually justify *more* intrusive state power, not less? Without desert, there's no limit on how long we hold someone if they remain 'dangerous'."

  **Your Reply (2 mins):**
  "This is the most serious practical worry. However, removing desert doesn't remove rights. We can ground constraints on state power in human welfare and autonomy, not in metaphysical desert.
  Consider the analogy of quarantine for disease. We don't blame the sick person, but we also don't lock them up indefinitely without due process or humane conditions. We can maintain a system of 'forward-looking responsibility' where sanctions are proportional to the need for safety and rehabilitation, capped by rights-based constraints.
  Actually, my view might be *more* humane. Retributivism justifies inflicting pain because the offender 'deserves' it. My view says inflicting pain is always a tragedy, only justified if it prevents greater harm. That shifts the burden of proof onto the state. It makes punishment lighter, not heavier, because we stop adding 'extra' suffering for the sake of cosmic justice."

  **Where it's Soft:** This is the hardest practical pill to swallow. If they press that "rights" ultimately rely on a notion of personhood that presupposes responsibility, you are cornered. You are relying on utilitarian constraints to protect rights, which is historically shaky ground.

  ---

  ## Part 3: The "Embarrassing Question"
  **Who:** The Legal Philosophers (specifically the one focused on liberal theory).
  **The Question:** "You argue that without Ultimate Responsibility, we cannot treat people as 'ends in themselves' in the retributive sense. But if people are just products of causal chains, aren't they merely objects to be managed? If you truly believe no one is responsible, on what basis do you object to *neuro-correction* or *preventive detention* of 'high-risk' individuals before they offend? If they aren't responsible agents, why is it wrong to tweak their brains to make them safer, just as we fix a broken brake line?"

  **Why this is embarrassing:**
  It exposes the "Hard Incompatibilist Dilemma."
  1.  If you say "Neuro-correction is wrong because it violates autonomy," they will ask: "What is autonomy without UR?" (Undermines your main thesis).
  2.  If you say "It's wrong because it causes suffering," you admit your view is purely utilitarian. This implies that if neuro-correction *reduced* suffering overall, it would be mandatory. This sounds authoritarian and dehumanizing, undermining the moral high ground of your position.

  **How to Parry (Do not answer directly):**
  "I would object to neuro-correction on the same grounds I object to retributive torture: it treats the human being as a mere means. The fact that their 'self' is causally determined doesn't mean their *experiences* of violation don't matter. We protect bodily and mental integrity because sentient beings value it, not because they are metaphysically magical uncaused causes. We can respect the *phenomenology* of agency without endorsing the *metaphysics* of UR."

  ---

  ## Part 4: Final Advice for the Q&A

  *   **Don't get bogged down in definitions:** If they want to define "responsibility" differently, let them. Say: "Call it what you want. I'm talking about the kind that justifies *desert*. If you don't care about desert, we aren't disagreeing about facts, just words."
  *   **Watch the "Regress" trap:** They will try to stop the regress at "reasons-responsiveness." Keep bringing it back to: "But why do they respond to *those* reasons?"
  *   **Stay Humble:** Strawson's argument is pessimistic. Don't act like you've solved the problem of social order. Act like you've identified a tragic truth about the human condition. This disarms aggression.
  *   **The "So What?" Factor:** If they keep pressing "So what if UR is impossible?", your final card is: "It matters because retributive hatred poisons our relationships and our legal system. Knowing it's unfounded allows us to move toward a more compassionate, forward-looking justice."
