prompt: |-
  I'm defending a version of Galen Strawson's Basic Argument against moral responsibility in a graduate seminar next month, and I want to be ready for the question period. The version I'm defending concedes the so-called "no-choices" objection — I grant that an agent can in some sense choose differently in the moment, and that this is a genuine, if shallow, form of freedom — but I argue that the Basic Argument still goes through because the relevant "could not have done otherwise" is not about momentary choices but about the antecedent conditions that constitute who you are: your character, beliefs, and desires, which you did not choose and for which you cannot be ultimately responsible, determine your actions in a way that vitiates the kind of responsibility that grounds blame and desert. So my claim is that the Basic Argument, properly understood, targets ultimate or original responsibility rather than the narrower responsibility that compatibilists want to preserve, and is therefore not threatened by Frankfurt-style cases or by the intuition that we "choose" in the moment.

  The seminar is a mixed group: two compatibilists who work on Frankfurt cases and the "responsibility without alternative possibilities" line, a libertarian who is sympathetic to agent causation, and a couple of legal philosophers who care about the practical consequences for punishment and blame. I want a prep sheet, not a defense: the objections I'll actually get from this audience, ordered by how likely and how damaging they are, each phrased the way that person would phrase it, with a short reply of roughly two minutes and a note on where my reply is soft. I also want to know what I should concede up front, what I should hold, and the one objection — probably from the legal philosophers — that I'm hoping nobody asks but that would be the most embarrassing if it did.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Topic:** Defending Galen Strawson's Basic Argument against moral responsibility.
      *   **Specific Version:** Concedes the "no-choices" objection (allows for shallow, momentary freedom/choice) but insists on *Ultimate Responsibility* (UR) regarding character/constitution (the *causa sui* problem).
      *   **Context:** Graduate seminar question period.
      *   **Audience:**
          *   2 Compatibilists (Frankfurt cases, responsibility without AP).
          *   1 Libertarian (Agent Causation).
          *   2 Legal Philosophers (Punishment, blame, practical consequences).
      *   **Deliverables:**
          *   Prep sheet with objections (ordered by likelihood/damage).
          *   Objections phrased in the audience's voice.
          *   Short replies (~2 mins spoken).
          *   Notes on where the reply is soft/vulnerable.
          *   Strategy: What to concede vs. hold.
          *   The "Embarrassing Question" (likely from legal philosophers).

  2.  **Deconstruct the Position:**
      *   *Core Claim:* You can't be ultimately responsible for who you are (character, desires, beliefs). Since actions flow from who you are, you can't be ultimately responsible for actions. Therefore, basic desert moral responsibility is impossible.
      *   *Concession:* Agents can "choose" in the moment (compatibilist freedom), but this doesn't ground *basic desert*.
      *   *Target:* Basic Desert (the kind that justifies retributive blame/praise), not necessarily forward-looking practices.

  3.  **Brainstorming Objections by Audience Segment:**

      *   **Compatibilists (Frankfurt/AP):**
          *   *Objection:* "Why do you need Ultimate Responsibility? Our practices don't require it. You're setting the bar too high."
          *   *Objection:* "Frankfurt cases show AP isn't necessary. Your argument relies on 'could have done otherwise' regarding character, but that's irrelevant."
          *   *Objection:* "Regress argument is too fast. What about reasons-responsiveness?"
          *   *Likelihood:* High. *Damage:* High (attacks the relevance of the argument).

      *   **Libertarian (Agent Causation):**
          *   *Objection:* "You assume determinism or luck. Agent causation breaks the regress. The self *is* the uncaused cause."
          *   *Objection:* "Strawson begs the question against libertarianism by defining 'self' as just a bundle of prior states."
          *   *Likelihood:* Medium. *Damage:* Medium (Strawson usually dismisses this as unintelligible, but need to be ready).

      *   **Legal Philosophers:**
          *   *Objection:* "If no one is responsible, what do we do with dangerous people? Quarantine? That's inhumane."
          *   *Objection:* "You're conflating moral responsibility with legal liability. The law doesn't need UR."
          *   *Objection:* "The 'embarrassing' one: If you truly believe this, why are you here defending it? Isn't your defense itself determined? Why argue?" (Actually, this is more metaphysical. The legal one is usually about the collapse of the system).
          *   *Refining the "Embarrassing" one:* The prompt asks for the one *hoping nobody asks*. Usually, for Strawsonians, it's the "Pragmatic Self-Refutation" or the "Incoherence of Reform" objection. But for *legal* philosophers specifically, it's often: "If you remove desert, you remove the only constraint on state power. Utilitarian punishment allows punishing the innocent if it maximizes utility. Do you accept that?"

  4.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Ordering:* Start with the Compatibilists (they are the majority and attack the core relevance). Then Libertarian (metaphysical attack). Then Legal (practical attack).
      *   *Phrasing:* Needs to sound like grad students/profs. Sharp, technical but conversational.
      *   *Replies:* Needs to be ~250-300 words (2 mins spoken). Focus on the distinction between *surface* responsibility and *ultimate* responsibility.
      *   *Soft Spots:* Be honest about where the argument strains.

      *   *Drafting Objection 1 (Compatibilist - Relevance):* "Why does UR matter?"
          *   *Reply:* It matters for *desert*. Without it, blame is just manipulation.
          *   *Soft Spot:* Defining "desert" without sounding mystical.

      *   *Drafting Objection 2 (Compatibilist - Frankfurt):* "Frankfurt shows AP isn't needed."
          *   *Reply:* Frankfurt kills *alternative possibilities*, not *ultimate origination*. I concede AP, I deny UR.
          *   *Soft Spot:* Distinguishing UR from AP clearly under pressure.

      *   *Drafting Objection 3 (Libertarian - Agent Causation):* "You ignore the agent as substance."
          *   *Reply:* *Causa sui* is incoherent. To cause yourself, you must exist to do the causing.
          *   *Soft Spot:* Dismissing a major metaphysical view as "incoherent" can sound dogmatic.

      *   *Drafting Objection 4 (Legal - Punishment of Innocents):* "Without desert, what stops punishing the innocent?"
          *   *Reply:* Forward-looking constraints (rights, utility).
          *   *Soft Spot:* This is weak. Utilitarian constraints *do* theoretically allow punishing the innocent in extreme cases. This is the "Embarrassing" one.

      *   *Refining the "Embarrassing Question":* The prompt asks for the one from legal philosophers that would be most embarrassing. The "Punishing the Innocent" objection is the classic hard incompatibilist weakness. If I say "we can't punish the innocent," I need a ground. If I say "desert is the only ground," I admit my view breaks the law. If I say "utility constrains it," I admit the constraint is contingent.
      *   *Wait, let's look closer:* The prompt says "probably from the legal philosophers." The most embarrassing question for a hard incompatibilist in front of legal scholars is usually: *"If moral responsibility is an illusion, on what basis do you object to preventive detention or neuro-correction of 'broken' agents? If they aren't responsible, they are just broken machines. Why is your view more humane than the system you critique?"* This attacks the moral high ground.

  5.  **Strategy Section:**
      *   *Concede:* We don't need UR for social cohesion, safety, or forward-looking blame.
