  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the distinction between the "no-choices" concession and the UR claim is clear in the replies. The user specifically mentioned conceding momentary choice.
      *   *Correction:* Ensure the "Embarrassing Question" is distinct from the standard legal objection in the main list. I'll put the "Punishing Innocents" in the main list (Objection 4) and the "Preventive Detention/Dehumanization" as the Embarrassing One, or vice versa. Actually, the "Punishing Innocents" is the classic "reductio." Let's make that the Embarrassing One because it forces a utilitarian concession that undermines the moral force of the view.
      *   *Wait, better idea:* The "Pragmatic Self-Refutation" is often the most embarrassing ("Why are you arguing?"). But the prompt specifies "probably from the legal philosophers." So it must be about the legal system. The strongest legal objection is: *"If you remove desert, you remove the rights-bearing subject. You turn citizens into patients to be managed. Is that compatible with a liberal democracy?"* This is the "Duff/Moore" style objection. I will use this as the embarrassing one.

