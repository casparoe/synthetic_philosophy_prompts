answer: |-
  This is a beautifully constructed *reductio*, and your frustration is well-founded: you have stumbled upon a classic problem in decision theory often discussed under the headings of **"maximization in infinite option sets"** or the **"No Best Option" paradox**. It is structurally identical to the problem of trying to choose the largest real number less than 1.

  Your housemate's argument is valid *if* we accept all five premises as describing a coherent decision problem. Since the conclusion (total paralysis) is unacceptable, at least one premise must be rejected. You have correctly identified that (1) and (3) are the core commitments of Expected Value (EV) fanaticism, while (2) is the structural setup.

  Here is the diagnosis of where the argument breaks, the cost of each escape, and why your instinct to target (2) is the most robust path for a mathematician-philosopher.

  ### The Diagnosis: Supremum vs. Maximum

  The mathematical heart of the error lies in the conflation of a **supremum** (least upper bound) with a **maximum** (greatest element).

  *   **Premise (1)** establishes that the set of possible expected values is unbounded above (or at least has no upper bound within the finite reals).
  *   **Premise (2)** establishes that the option set is isomorphic to an open interval, e.g., $(0, \infty)$ or $(0, K)$.
  *   **Premise (3)** assumes that for any option set, there exists a **permissible** option. In standard decision theory, permissibility is tied to **maximization**.

  The breakdown occurs because **Maximization requires a Maximum.** If your option set is open (like the real numbers $x < 1$), there is no largest number. If rationality demands you pick the largest number, rationality demands the impossible.

  Therefore, the argument forces a choice between **Unbounded Value (1)**, **Maximization (3)**, and **The Coherence of the Option Set (2)**. You cannot have all three.

  ### Escape Route 1: Reject (2) — The "Bookmaker" is Impossible
  **This is the path you prefer.** You keep Unbounded Value and EV Maximization, but you deny that the menu is genuinely open-ended in the way required.

  *   **The Argument:** The "Bookmaker of the Long Now" is a metaphysical impossibility. To "name any finite $G$" requires specifying a number. In the physical world, specification is constrained by time, space, and entropy (e.g., the Bekenstein bound). You cannot write down a number larger than the number of Planck volumes in the observable universe allows you to encode.
  *   **The Fix:** The option set is not continuous or infinite; it is **finite and discrete**. There is a largest specify-able $G$. Therefore, there *is* a ticket with the highest EV. You buy that one. Paralysis avoided.
  *   **The Cost:** You must accept that EV theory only applies to **feasible** option sets. It cannot guide you in idealized thought experiments where physical constraints are suspended.
  *   **Does this kill Fanaticism?** **No.** This is the crucial point. Fanaticism claims that a tiny probability of a *sufficiently large* good outweighs a sure finite good. It does not require that there be *no limit* to the good, only that the limit be *high enough*.
      *   If the maximum physically specify-able $G$ yields an EV higher than the sure thing, Fanaticism wins.
      *   Rejecting (2) merely caps the *intensity* of the fanaticism; it does not refute the *direction*. You still take the long shot, you just take the biggest *possible* long shot rather than an impossible infinite regress of long shots.
  *   **Verdict:** This is the most mathematically honest move. It treats decision theory as a tool for agents embedded in physics, not gods outside it.

  ### Escape Route 2: Reject (3) — Weak Maximization
  If you want to keep the Bookmaker (2) and Unbounded Value (1), you must modify the normative principle (3).

  *   **The Argument:** The principle "If $EV(X) > EV(Y)$, $Y$ is forbidden" is too strong for open sets. It should be replaced with: **"If there exists a maximal option $X$, you must choose it. If no maximal option exists, any option is permissible (or rationally optional)."**
  *   **The Fix:** This is sometimes called **"Satisficing"** or **"No-Ought-Implies-Can"**. If there is no best option, you cannot be obligated to pick it. Therefore, picking *any* ticket is permissible, even if a better one exists.
  *   **The Cost:** This significantly weakens EV theory. It means EV loses its "action-guiding" force in precisely the high-stakes cases where fanatics want it to be most precise. If you are choosing between saving 1 billion lives with $p=0.5$ and 1 billion + 1 lives with $p=0.5$, and the menu allows you to keep adding +1 indefinitely, this view says it doesn't matter which you pick. That feels like a bullet to bite.
  *   **Does this kill Fanaticism?** It makes it **indeterminate**. Fanaticism tells you to take the long shot over the sure thing. But if the long shot menu is open-ended, this view says *any* long shot is fine. It preserves the verdict against the sure thing (assuming all long shots beat it), but it fails to tell you *which* long shot to take.
  *   **Verdict:** This saves the theory from paralysis but makes it "silent" in the way you feared. It admits that EV cannot rank options when the set lacks a maximum.

  ### Escape Route 3: Reject (1) — Bounded Value
  I mention this only to dismiss it, as you rightly noted the cost.

  *   **The Argument:** There is a maximum amount of value/welfare possible in the universe.
  *   **The Cost:** As you said, this is an empirical claim that might be false. If the universe is infinite or value is lexical, (1) holds.
  *   **Verdict:** Avoid this if you can. It's the "nuclear option" that disarms the fanatic entirely.

  ### Recommendation: Why (2) is the Break Point

  You asked what it costs to keep (1) and (3) and reject (2). The cost is **Idealization**.

  Your housemate's argument relies on the **Bookmaker** being a coherent entity. But a bookmaker who accepts *any* finite $G$ is a bookmaker who can process infinite information in finite time. By rejecting (2), you are simply asserting that **decision problems must be well-posed**.

  In optimization theory (which you will encounter in your maths degree), we often require the feasible set to be **compact** (closed and bounded) to guarantee a solution exists. If the set is not compact, the optimization problem is **ill-posed**.

  **The Price You Pay:**
  1.  **Context Sensitivity:** You must admit that EV theory doesn't give answers in *abstracto*, only relative to a specific, physically constrained option set.
  2.  **Arbitrariness:** The "best" ticket depends on physical limits (how many digits you can write), which seems irrelevant to the *moral* value of the outcome.
  3.  **Silence on the Infinite:** You cannot use EV to compare outcomes that require infinite precision.

  **Why this is better than the alternatives:**
  If you reject (3) (Maximization), you admit that EV theory is incomplete. If you reject (2) (Option Set), you admit that the *scenario* is impossible. It is always better to blame the impossible scenario than the normative theory.

  ### How to Reply to Your Housemate

  Here is the argument you can use tonight:

  > "Your argument proves that **Maximization (3)** is incompatible with **Open-Ended Menus (2)** given **Unbounded Value (1)**. Since we agree paralysis is false, one must go.
  >
  > If we drop (1), we kill Fanaticism. If we drop (3), we admit EV theory is silent on high-stakes choices where we can always do a bit better.
  >
  > So we must drop (2). The 'Bookmaker of the Long Now' is not a valid decision problem because the option set is not **compact**. In the real world, option sets are bounded by time, information, and physical specification limits. Therefore, there *is* a best ticket (the one with the highest $G$ we can actually specify and purchase).
  >
  > This saves Fanaticism: we still choose the long shot over the sure thing, provided the best *feasible* long shot has higher EV. It just means we can't indulge in infinite regresses of ticket-buying. EV theory applies to **feasible** sets, not **idealized** ones."

  ### Summary of Commitments

  | Escape | What you keep | What you sacrifice | Consequence for Fanaticism |
  | :--- | :--- | :--- | :--- |
  | **Reject (1)** | Logic, Maximization | Unbounded Value | **Destroyed.** Fanaticism requires unbounded utility. |
  | **Reject (2)** | Unbounded Value, Maximization | Idealized Option Sets | **Preserved (mostly).** Fanaticism holds for feasible long shots. Theory requires physical constraints. |
  | **Reject (3)** | Unbounded Value, Option Sets | Strict Maximization | **Weakened.** EV tells you to take a long shot, but not *which* one. Theory goes silent on optimization. |

  **Final Advice:** Stick to rejecting (2). It aligns with your mathematical training (well-posed problems require compact sets) and preserves the core moral intuition of Fanaticism without accepting the paradoxical machinery of the "Long Now." The mistake wasn't in the arithmetic; it was in assuming a physical agent can face a metaphysical menu.
