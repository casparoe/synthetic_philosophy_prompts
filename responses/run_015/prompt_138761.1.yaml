      *   **Alternative: Modify (3).** If the set has no maximum, (3) should be read as "Don't choose $Y$ if a *better available* $X$ exists." If for every $Y$ there is a better $X$, then strictly speaking, (3) forbids everything. The fix is to say: **If no maximum exists, the requirement lapses.** (This is "Weak Maximization" or "Satisficing").
