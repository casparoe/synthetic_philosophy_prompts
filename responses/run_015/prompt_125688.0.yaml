  1. Moral weight is determined by the complexity of an entity's subjective experience, modified by relational duties to specific individuals and responsibility for the circumstances of their suffering.
  2. The complexity clause validates your crow and octopus intuitions, the relational clause explains the grieving dog, and the responsibility clause clarifies the sanctuary pig, while the infant-chimp conflict remains a tension between complexity and species loyalty.
  3. For the deer, intervention is obligatory only if humans caused their isolation, whereas in an unthought case like erasing a sophisticated AI, the complexity clause mandates preservation regardless of its biological origin.
  4. This framework cannot accommodate your instinct to save the human infant over the chimp without exposing that verdict as biological prejudice rather than ethical consistency.
  5. She must argue that breeding animals to suffer less is unacceptable, because reducing a being's capacity for distress to suit human convenience treats consciousness as a commodity rather than a boundary.
