answer: |-
  **Project Title:** Off-Manifold Content: Testing Representational Realism in Neural Networks

  **Abstract**
  The debate over whether neural networks possess genuine internal representations remains stalled. Proponents of "mechanistic interpretability" point to linear probes and steering vectors as evidence of features; skeptics argue these are merely post-hoc diagnostics. This project diagnoses the stalemate as a category error: both sides conflate three distinct notions of representation: *Causal-Role* (mediating behavior), *Content* (possessing correctness conditions), and *Portability* (cross-model identity). I argue that current evidence (probes, sparse autoencoders) establishes only Causal-Role within the training distribution. To test for Content, we must test *Off-Manifold Robustness*: if a direction truly represents a concept (e.g., "dog"), it must sustain its causal role even when activations are pushed into regions of state-space the training distribution never produced. This nine-month fellowship will operationalize this test, determining whether neural features are structural representations or merely high-dimensional curve-fitting.

  **Research Question**
  Do linearly decodable directions in large language models sustain their semantic causal role under off-manifold activation perturbations?

  This question admits a determinate answer. Either steering a "dog" direction in activation space produces dog-related outputs even when the context and activation statistics are mutually incompatible (off-manifold), or it does not. A positive result supports Representational Realism (Content); a negative result supports Instrumentalism (Causal-Role only).

  **Why Standard Evidence Fails**
  Current methodologies rely on on-distribution validation. Probing classifiers are trained and tested on data drawn from the same manifold as the model's training set. Steering interventions are validated on naturalistic prompts. Consequently, these methods only demonstrate that a direction correlates with a feature *given the specific regularities of the training data*. They cannot distinguish between a direction that encodes the *concept* of "dog" and a direction that encodes a statistical shortcut that co-occurs with "dog" only within the training distribution. To establish Content—specifically the capacity for misrepresentation—the putative representation must remain stable when the statistical scaffolding of the training set is removed.

  **Methodology and Work Plan**
  The project proceeds in three phases over nine months.

  *Phase 1: The Kill Pilot (Months 1–2)*
  Before full commitment, I will test the feasibility of off-manifold generation. I will identify a robust feature in a small transformer (e.g., a "negation" or "proper noun" direction identified via sparse autoencoders). I will then construct activation vectors that score highly on this direction but are orthogonal to the natural activation subspace (using Mahalanobis distance to ensure they lie outside the training covariance).
  *Kill Condition:* If I cannot generate off-manifold activations that the model processes without immediate collapse (e.g., perplexity spikes to infinity or outputs become pure noise), the project is unfeasible. If the model degrades gracefully but the steering effect vanishes immediately, the hypothesis is likely false, and I will pivot to analyzing the *degree* of decay rather than binary stability.

  *Phase 2: Systematic Off-Manifold Steering (Months 3–5)*
  Assuming the pilot succeeds, I will scale to larger models and a broader set of features (semantic, syntactic, and factual). I will define "off-manifold" rigorously using density estimation on the activation space. I will apply steering vectors at varying magnitudes, specifically targeting regions where feature combinations never co-occur in training (e.g., forcing "dog" activations in a context structurally reserved for "quantum physics"). I will measure the retention of the semantic effect via automated evals and human rating of output coherence.

  *Phase 3: Analysis and Synthesis (Months 6–9)*
  I will quantify the "Content Decay Curve": how quickly does semantic stability drop as activation distance from the manifold increases? I will compare this against a baseline of Causal-Role stability (does the model still output *something* coherent?). Finally, I will draft the dissertation chapter and a target journal article.

  **Possible Results and Failure Criteria**
  1.  *Positive:* Features retain semantic causal roles significantly off-manifold. This implies the network has learned a structural model of the world, supporting Content Realism.
  2.  *Negative:* Features lose semantic specificity off-manifold while retaining causal potency (e.g., the vector changes output, but not in the semantically expected way). This implies features are training-set artifacts, supporting Instrumentalism.
  3.  *Project Failure:* This is distinct from a negative result. The project fails if the notion of "off-manifold activation" proves incoherent (e.g., any off-manifold vector is functionally indistinguishable from noise regardless of direction) or if the "semantic role" cannot be operationalized independently of the activation itself. A negative result is a finding; failure is a methodological collapse.

  **Anticipated Objections and Clarifications**

  *Objection 1: The Thermometer Analogy*
  *Critique:* "A thermometer represents temperature causally. If you heat it beyond its range, it breaks. Does that mean it didn't represent temperature before? Your test conflates robustness with representation."
  *Response:* I do not concede that thermometers represent in the *same sense* required for cognitive science. A thermometer has a causal coupling, but it lacks *structural homomorphism*. The claim in mechanistic interpretability is that the activation geometry *mirrors* the conceptual geometry. If the "dog" direction is a genuine representation, it should function as part of a compositional model, not a rigid coupling. A map remains a map even when you hold it upside down; a thermometer is merely a gauge. My test distinguishes between a gauge (breaks off-manifold) and a model (generalizes off-manifold). If neural features behave like thermometers, they are not representations in the sense required to explain generalization.

  *Objection 2: The Portability Distinction*
  *Critique:* "Why separate Portability from Content? If a feature is portable across models, doesn't that prove it has content?"
  *Response:* No. Portability establishes cross-model identity, not world-relations. Two models could share a heuristic shortcut (e.g., "assume text ending in 'S' is plural") that is portable but lacks truth conditions. Portability shows a mechanism is robust to training noise; Content shows the mechanism is about the world. Separating them allows us to identify features that are *real* (portable) but *shallow* (lack content), a crucial distinction for safety and alignment.

  **Significance**
  This project resolves a foundational ambiguity in AI science. If features lack Content, mechanistic interpretability cannot support claims about model beliefs or deception, limiting its utility for alignment. If they possess Content, we gain a new methodology for verifying model ontology independent of training data. By shifting the debate from "does this probe work?" to "does this representation survive contact with the impossible?", this work grounds the metaphysics of AI in empirical testability.
