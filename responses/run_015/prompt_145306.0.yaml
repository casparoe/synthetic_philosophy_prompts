      *   Is there a detection model? Yes, "blind" assessments, but they are ethically fraught.

  8.  **Final Polish:** Check against constraints. No references. Keep it grounded in field bio experience. Ensure the "smugness check" is addressed (you're right about method, maybe wrong about metaphysics).

      *(Self-Correction during drafting)*: I initially thought about saying the biologist is wrong. But they aren't. They are right about *method*. The philosophers are right about *ontology*. I need to bridge that. The biologist sees a calibration problem; the philosopher sees a constitution problem. Both are true. The diagnosis *is* a calibration problem for the clinician, but the *category* is a constitution problem for the society.

      *Wait, one more thing:* The user mentioned birders. That's a great analogy for observer bias. I should lean into that. The birds don't change, the *data* changes. But in psychiatry, do the *birds* change? Yes, because the bird is also the birder. That's the key disanalogy.

