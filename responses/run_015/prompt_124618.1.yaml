          *   The tension between (1) and (2) is the logical core.
          *   *Proposal:* Refine (1) to distinguish between *internal satisfaction* (defer per (2)) and *objective opportunity* (critique per (1)). Or, modify the Door Test to account for *cost of opening the door*.
          *   *Actually:* The biggest mess is the conflict between judging the Aunt (1/Door Test) and respecting insiders (2).
          *   *Recommendation:* Modify the **Door Test**. It's too rigid. It needs a "Cost of Entry" clause. If the door is open but the cost is too high (socially, financially), staying put isn't adaptive preference, it's rational choice. This saves the Aunt (she couldn't afford/leave village) and saves (2) (defer to experience).

