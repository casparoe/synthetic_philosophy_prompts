  **Load-Bearing vs. Decorative Questions:**

  *   **Load-Bearing (The Structural Beams):**
      *   **Q1 (Threshold):** Essential to isolate the Deflationary view. Without this, Deflationists answer randomly elsewhere.
      *   **Q2 (Colony):** Essential to isolate the Distributed view. This is the only question that breaks the "individual agent" assumption shared by the other 8 views.
      *   **Q3 (Simulator):** *The Hypothesis Test.* This is the most critical question. It cleanly separates the Capacity cluster (Predictive, Sample-Efficiency, Psychometric) from the Track Record cluster (Rationalist, Embodied, Resource-Bounded). Your hypothesis is **confirmed**: this is the primary axis of disagreement for realists.
      *   **Q6 (Sage):** Essential to separate Ideal (Rationalist/Psychometric) from Bounded (Resource/Efficiency) views.

  *   **Decorative (The Refinements):**
      *   **Q8 (Calibration):** This is the weakest discriminator. Both Rationalists and Predictive-Modelers might value calibration, while Psychometricians might not. It refines the edge between Rationalist and Resource-Bounded but rarely determines the leaf on its own.
