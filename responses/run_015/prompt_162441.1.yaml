  **Verification of Your Hypothesis:**
  You suspected the split is between **Capacity** (possessing intelligence without exercising it) and **Track Record** (constituted by success).
  *   **Result:** The tree validates this. Q3 (The Simulator) is the root of the substantive debate.
  *   **Nuance:** The hypothesis holds perfectly for the **Simulator** case. It holds *mostly* for the **Apprentice** (Q4), though some Track Record advocates might accept the Apprentice if they view "learning" as a present-time action rather than future potential.
  *   **Correction:** The hypothesis is not the *absolute* root only because the **Deflationary** view (Q1) and **Distributed** view (Q2) reject the terms of the debate entirely. A Deflationist doesn't care if it's capacity or track record; the word is the problem. A Distributedist doesn't care if it's capacity or track record; the *locus* is the problem.
  *   **Conclusion:** For any committee member who believes "intelligence" is a real property of an individual agent (the majority), your hypothesis is the correct root. The disagreement on funding the Simulator or the Apprentice is not a detail; it is the fundamental fault line.

  **Unoccupied/Problematic Leaves:**
  *   **Psychometric vs. Predictive:** As noted in Part 1, these two survive almost every question together. They both say "Yes" to Simulator (Capacity), "No" to Colony (Individual), "Yes" to Sage (Ideal). They only separate on whether narrow superhuman performance (Virtuoso) counts as intelligence. If your committee members split here, it is not on intelligence *per se*, but on whether intelligence is a *single scalar trait* or a *structural capability*. You may need to concede that for funding purposes, these two views are functionally identical.

  **Final Advice for the Committee:**
  Use Q3 (The Simulator) as your first voting question. If the vote splits 50/50, do not proceed to technical metrics. You have two different definitions of reality. You cannot evaluate an AI for "intelligence" if half the room believes a passive model is intelligent and the other half believes only active success counts. Fund two separate tracks: one for **World Models** (Capacity) and one for **Goal Achievement** (Track Record), and stop trying to force them into a single metric.
