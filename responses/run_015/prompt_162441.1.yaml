answer: |-
  ### Part 1: The Logical Space

  Before presenting the instrument, we must map the terrain. The nine positions you listed are not a random list; they are the surviving coordinates of a four-dimensional logical space. To build a tree that discriminates them, we must identify the axes that do the work.

  1.  **Ontological Status (Real Kind vs. Honorific):** Is "intelligence" a natural property waiting to be measured, or a label we apply based on our interests?
      *   *Splits:* **Deflationary/Eliminativist** from all others.
  2.  **Locus of Agency (Individual vs. System):** Must intelligence reside in a single bounded agent, or can it emerge from a network of non-intelligent parts?
      *   *Splits:* **Distributed/Collective** from all others.
  3.  **Constitution (Capacity vs. Track Record):** *This is your hypothesis.* Is intelligence an internal state (model, potential, learning rate) that exists even if unused, or is it constituted entirely by external success (goals met, actions taken)?
      *   *Splits:* **Predictive-Modeling, Sample-Efficiency, Psychometric** (Capacity) from **Rationalist, Embodied, Resource-Bounded** (Track Record).
  4.  **Constraints (Ideal vs. Bounded):** Does the cost of computation (time, energy, data) count against intelligence, or only the final result?
      *   *Splits:* **Rationalist, Psychometric** (Ideal) from **Resource-Bounded, Sample-Efficiency, Embodied** (Bounded).

  **Unoccupied Combinations:**
  There is a logically possible position that is effectively unoccupied: *The Ideal Track-Record View.* This would claim intelligence is purely about achieving goals (Track Record) but that time and resources do not matter (Ideal). In practice, anyone who cares about goal achievement in the real world cares about *timely* achievement. If you don't care about time, you are a Rationalist (who usually accepts bounds) or a Psychometrician (who cares about latent trait). The **Slow Sage** case collapses this distinction: if you accept the Sage, you are likely Ideal (Psychometric/Rationalist); if you reject it, you are Bounded.

  **Bedrock Intuitions:**
  The tree bottoms out between the **Psychometric** and **Predictive-Modeling** views. Both are "Capacity" views. Both accept the Simulator. The only difference is whether intelligence is a *general latent trait* (Psychometric) or a *specific representational structure* (Predictive). This often reduces to a preference for whether "generalization" implies a single factor $g$ or a composable set of models. No concrete case fully separates them without begging the question; they differ on the *explanation* of capacity, not the *detection* of it.

  ---

  ### Part 2: The Diagnostic Instrument

  **Instructions:** Answer each question based on the specific system described. Do not worry about where the answer leads. There are no "correct" answers, only consistent ones.

  **Q1. The Baseline Threshold**
  Consider a riverbed that sorts sediment by size due to water flow, or a simple thermostat that maintains temperature.
  *   **A:** These are minimally intelligent; they process information to achieve a result. Intelligence is a gradient starting very low.
  *   **B:** These are merely mechanical. Intelligence requires a higher threshold of complexity or flexibility.
  *   **C:** The word "intelligence" is useful for the thermostat but not the riverbed (or vice versa); the boundary depends on what we want to talk about, not the system itself.

  **Q2. The Locus (The Colony)**
  Consider a "Colony": thousands of very simple agents following local rules. No single agent has a map or a plan, but together they solve a novel navigation problem none could solve alone.
  *   **A:** The Colony is intelligent. The individual agents are not.
  *   **B:** Intelligence must belong to an individual unit. If the parts aren't intelligent, the whole isn't either.

  **Q3. The Constitution (The Simulator)**
  Consider a "Simulator": a system that has built a perfect generative model of its environment. It can answer any counterfactual question ("What would happen if...?") with 100% accuracy, but it is physically disconnected and never acts on the world.
  *   **A:** It is intelligent. It understands the world perfectly; action is just an optional output.
  *   **B:** It is not intelligent. Understanding without action is just data storage. Intelligence requires affecting the world.

  **Q4. The Potential (The Apprentice)**
  Consider a "Self-Rewriting Apprentice": currently mediocre at all tasks, but it can modify its own learning code. In one month, it will be superhuman. Contrast this with an "Archivist": currently superhuman at all tasks via retrieval, but incapable of improvement.
  *   **A:** The Apprentice is more intelligent. The rate of improvement (learning) is the core trait.
  *   **B:** The Archivist is more intelligent. Current competence is what matters; potential is not performance.

  **Q5. The Generality (The Virtuoso)**
  Consider a "Closed-Domain Virtuoso": superhuman at Go, but outside that game, it is a simple lookup table with no flexibility.
  *   **A:** It is intelligent. High performance in a complex domain implies a form of intelligence, even if narrow.
  *   **B:** It is not truly intelligent. Intelligence requires the ability to compose skills or transfer learning to new domains (like the "Lattice" system).

  **Q6. The Constraint (The Slow Sage)**
  Consider a "Slow Sage": a system that produces the optimal solution to any problem, but it takes 10,000 years of compute time to answer.
  *   **A:** It is intelligent. Optimality is the only metric; time is an engineering constraint, not a definition of mind.
  *   **B:** It is not intelligent. An answer that arrives too late to be used is not a sign of intelligence. Efficiency is part of the definition.

  **Q7. The Robustness (The Brittle Specialist)**
  Consider a "Brittle Specialist": perfect performance within its training distribution, but catastrophic failure if the environment changes slightly. Contrast this with an embodied agent that is less accurate but adapts to physical changes.
  *   **A:** The Brittle Specialist is intelligent within its domain. Intelligence is about processing, not necessarily robustness to the unknown.
  *   **B:** True intelligence requires situatedness. If you break when the world shifts, you were just memorizing, not understanding.

  **Q8. The Uncertainty (The Calibrated Pair)**
  Consider two systems with identical accuracy. System X is confident even when wrong. System Y knows when it does not know and abstains.
  *   **A:** System Y is more intelligent. Knowing the limits of your knowledge is a cognitive feat.
  *   **B:** They are equally intelligent. Accuracy is the only score that counts; meta-cognition is just a wrapper.

  **Q9. The Unity (The Cluster)**
  Looking at your answers above: Do you believe there is a single underlying property (like "processing power" or "goal alignment") that explains all the cases you marked as "intelligent"?
  *   **A:** Yes. There is one thing we are measuring, even if it looks different in different systems.
  *   **B:** No. "Intelligence" is a cluster term. We use it for learning, for reasoning, and for acting, but these are different things that happen to share a name.

