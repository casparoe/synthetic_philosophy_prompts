answer: |-
  This is a remarkably sharp exchange for a kitchen argument. You have stumbled upon a debate that has occupied economists and philosophers for decades without them reaching a consensus. Roz is arguing from the standpoint of standard rational choice theory, while Tom is attacking the metaphysical and psychological assumptions underpinning it. Neither is speaking nonsense; they are simply playing different games.

  Here is the move-by-move breakdown, rated on the strength of their reasoning within the context of the argument.

  ### Move 1
  **Roz:** *Dan's behaviour is textbook hyperbolic discounting… the grown-up response is to notice that and price the future properly, at a steady rate, like an actuary.*
  **Rating: Mostly Right.**
  **Justification:** Roz is correct on the mechanics. In standard economics, valuing the immediate future vastly more than the distant future (hyperbolic) leads to decisions you later regret, whereas a steady rate (exponential) keeps your preferences stable over time. However, she slips up by calling the actuary the "grown-up response." That is a normative claim, not a fact. Just because a steady rate is consistent doesn't automatically make it morally or practically superior; it just makes it predictable.

  **Tom:** *Why is the actuary the gold standard? A steady rate means caring almost nothing about anything past a few decades… consistency isn't sense.*
  **Rating: Right.**
  **Justification:** Tom lands a solid blow here. Mathematically, if you discount the future at a steady rate, the value of outcomes fifty years from now becomes negligible. He correctly identifies that consistency is a formal virtue, not a substantive one. A person can be consistently terrible. Demanding that human time-preference match a financial model is an arbitrary imposition, not a law of nature.

  ### Move 2
  **Roz:** *I'm bothered about the flip… Both of those wants can't be right, so one of the two Dans is making a mistake.*
  **Rating: Mostly Right.**
  **Justification:** This is the strongest logical point for Roz. If you prefer A to B today, but prefer B to A tomorrow without any new information arriving, you are vulnerable to being exploited (a "money pump"). You could be tricked into paying to switch from A to B, and then paying to switch back. Something has to give. Either the planning self or the acting self is mistaken about what is good for the whole person.

  **Tom:** *Maybe they're not the same man… caring more about the me who's here now than the one who turns up later? …averaging over all the rates you might have gives you one that starts steep and flattens off.*
  **Rating: Right.**
  **Justification:** Tom offers two distinct defences here, both robust. First, the "personal identity" point: if the future self is psychologically different, caring less about them isn't irrational, just selfish. Second, and more technically, the "uncertainty" point. If there is a chance you might not survive to enjoy the future reward, or that the reward might vanish, it is mathematically rational to discount the near future more heavily. This produces a curve that looks hyperbolic without requiring a "bias." This is a very sophisticated counter-argument.

  ### Move 3
  **Roz:** *The flip still turns Dan into a mug… his own preferences are a market anyone could arbitrage… the app and the locked account are just self-defence.*
  **Rating: Right.**
  **Justification:** Roz circles back to the practical consequence. Regardless of *why* the preference flip happens, the result is that Dan loses out (he loses rent money, or thesis time). Using commitment devices (the app, the account) is the rational way to manage a self that cannot be trusted to keep its own promises. She correctly identifies that calling this "weakness" misses the point; it is a strategic constraint to prevent a predictable failure.

  **Tom:** *Self-defence against who? …Calling tonight's want his "considered" preference and tomorrow's his "impulse" is rigged… "weakness of will" is a moralising label we slap on the loser.*
  **Rating: Debatable / Partially Mistaken.**
  **Justification:** Tom pushes the scepticism too far here. He suggests that because we can't metaphysically prove which self is the "real" Dan, the struggle is meaningless. But this ignores the hierarchy of desires. Dan *wants* to write the thesis more than he *wants* to want to scroll. By privileging the "doing self" (tomorrow's Dan) as equal to the "planning self" (tonight's Dan), Tom ignores that the planning self usually holds the long-term values. Denying the reality of the struggle because it's hard to define doesn't make the struggle go away.

  ### Who is more right overall?

  It is a draw, but for different reasons. **Roz is more right about the problem; Tom is more right about the person.**

  Roz correctly diagnoses the structural issue: Dan has time-inconsistent preferences that lead to bad outcomes, and commitment devices are the sensible fix. If you want Dan to finish his thesis, you follow Roz's advice.

  Tom, however, wins on the deeper philosophical questions. He correctly identifies that "rationality" is not just about mathematical consistency, and that the "self" is not a single, unchanging entity that can be easily measured against an actuary's table. His point about uncertainty explaining the discounting curve is particularly strong and often overlooked.

  ### What are they both missing?

  They are talking past each other because they are missing two crucial pieces of the puzzle: the **hierarchy of desires** and the **mechanism of action**.

  **1. The Hierarchy of Desires (Who is the Boss?)**
  Both Roz and Tom treat Dan's wants as flat list: "Work" vs. "Scroll." Roz says the "Work" want is the right one; Tom says picking one is rigged. They are missing the idea that humans have desires *about* their desires.
  Dan doesn't just want to work; he *endorses* the desire to work. He looks at his desire to scroll and rejects it as alien to who he wants to be. Weakness of will isn't just one want beating another; it's acting against your own endorsed values. This gives us a way to say tonight's Dan is "more Dan" than tomorrow's Dan without needing to say tomorrow's Dan is a stranger. It's about authority, not just timing.

  **2. The Mechanism (The "How")**
  They are arguing as if Dan is a single brain making a calculation. They are missing the biological reality that the "planning self" and the "doing self" are often literally different systems in the brain. One is slow, reflective, and abstract (the thesis); the other is fast, emotional, and immediate (the scroll).
  Weakness of will is real not because of a logical error, but because the "fast" system can hijack the controls before the "slow" system can intervene. The app isn't just "self-defence" (Roz); it's a prosthetic for the slow system. Tom is wrong to say it's just "two wants shoving"; it's a structural conflict between two modes of processing.

  **On Weakness of Will:**
  Tom suggests weakness of will is a myth because if you truly judged something best, you'd do it. This is intellectually neat but phenomenologically false. We all know the feeling of judging X best while doing Y. The missing link is that "judgment" is not a switch that triggers action; it's a weak signal that can be drowned out by noise. Weakness of will is real, but it's not a moral failing; it's a systems failure.

  **Verdict:** Tell Roz to help Dan set up the app, but tell Tom he wins the argument if they ever write a philosophy paper about it.
