answer: |-
  **The Bengal Famine of 1770 and the Smithian Critique of the Company-Sovereign**

  The Great Bengal Famine of 1770, which claimed an estimated ten million lives, stands as one of the most harrowing episodes in the history of imperial governance. Occurring merely six years prior to the publication of Adam Smith's *The Wealth of Nations* (1776), the catastrophe provides a grim empirical testing ground for Smith's theoretical objections to the East India Company (EIC). To analyse the famine through a Smithian lens is to examine the collision between the logic of mercantile monopoly and the duties of territorial sovereignty. This essay maps Smith's concept of the 'company-sovereign' onto the EIC's administration in Bengal, evaluates whether the famine dynamics confirm his predictions of fiscal predation, and interrogates where his economic framework falters when confronted with the moral and political realities of imperial starvation.

  **The Company-Sovereign in Smithian Terms**

  For Adam Smith, the fundamental incompatibility at the heart of the British empire in India was the hybrid nature of the East India Company. In *The Wealth of Nations*, Smith articulates a sharp distinction between the merchant and the sovereign. The merchant's interest is 'always in some respect different from, and even opposite to, that of the public'. The sovereign's duty, conversely, is to attend to the general welfare and defence of the state.

  In Bengal, following the acquisition of the *Diwani* (the right to collect revenue) in 1765, the EIC became what one might term the 'company-sovereign'. In Smith's taxonomy, this entity is a contradiction. The Company was a joint-stock corporation designed to maximise profit for shareholders in London, yet it wielded the coercive power of a state to extract revenue from the Bengali peasantry. Smith argued that 'the spirit of monopoly' inevitably corrupts the 'spirit of sovereignty'. When the governors of a territory are merchants, their administration will prioritise the remittance of profits over the improvement of the land or the welfare of the inhabitants. The EIC in Bengal fits this definition precisely: it was a private body exercising public power, wherein the 'masters' (shareholders) demanded dividends that could only be met through aggressive extraction by their 'servants' (administrators) in India.

  **Revenue Extraction and Governance Options**

  Smith's critique hinges on the available options for revenue and governance. In a well-ordered state, revenue should be raised in proportion to the ability of the subject to pay, with a portion reinvested into public works and agricultural improvement to expand the tax base over time. Smith posits that the sovereign should act as a benevolent landlord, interested in the long-term productivity of the soil.

  The EIC, however, operated under a different imperative. Following the Battle of Plassey (1757) and the grant of the *Diwani*, the Company faced immense pressure to remit silver to Britain to purchase tea and settle debts. The governance option chosen was one of maximising short-term land rent. The Company fixed revenue demands at historically high levels, disregarding the fluctuating capacity of the ryots (peasants). Smith argued that joint-stock companies are inherently negligent managers of territory because the directors in London are too distant to monitor local conditions, and the servants on the ground are transient, seeking to make a fortune quickly before returning home.

  Consequently, the actual option of 'agricultural improvement'—investment in irrigation, storage, or relief during lean years—was foregone in favour of 'fiscal predation'. The revenue system was rigid; even as drought conditions emerged in 1769, the tax collectors, incentivised by commissions, continued to demand full payment. This aligns perfectly with Smith's assertion that a trading company governing a territory will treat its subjects not as citizens to be protected, but as assets to be liquidated.

  **Famine Dynamics: Predation and Neglect**

  The dynamics of the 1770 famine illustrate Smith's claim that territorial empire under a trading company produces both fiscal predation and neglect. Smith warned that merchants would not hesitate to sacrifice the long-term prosperity of a colony for immediate gain. The famine revealed the lethal consequence of this logic.

  Firstly, there was the issue of grain trade. While Smith generally favoured free markets, he acknowledged that in times of dearth, the unfettered export of grain by a monopoly could be disastrous. The EIC and its servants maintained a *de facto* monopoly on the internal grain trade. Company servants engaged in private trade (a widespread corruption that the Company structure implicitly encouraged through low salaries) hoarded rice and manipulated prices.

  Secondly, there was the neglect of relief. Smith argued that the sovereign must provide public goods, including relief in times of calamity. The EIC's response was tepid and delayed. Because the Company's primary metric of success was the dividend, expenditure on famine relief was viewed as a drain on profit rather than a duty of state. The administration continued to export grain from Bengal to other regions even as the countryside starved, prioritising contractual obligations and market speculation over human survival. This validates Smith's thesis: the company-sovereign, driven by the 'mercantile spirit', failed to perform the basic functions of sovereignty, turning a climatic shock into a demographic catastrophe.

  **Where the Theory is Silent or Breaks**

  However, applying Smith's framework reveals certain silences and fractures when confronted with the specific morality and mechanics of the Bengal catastrophe.

  *Moral Status and Regime Type:* Smith's economic critique implies that Company rule is less efficient than Crown rule, but does his framework distinguish the moral status of the victims? Smith argues in *The Theory of Moral Sentiments* that sympathy is the basis of morality, yet in *The Wealth of Nations*, his critique of empire is largely utilitarian and fiscal. He suggests that Crown rule might be less predatory because the sovereign's interest is more aligned with the stability of the realm than a company's interest is with dividends. However, Smith does not fully account for the possibility that a Crown, too, might prioritise imperial prestige or strategic dominance over native welfare. The theory implies a hierarchy of governance (Company < Crown < Local), but it remains silent on whether the moral culpability for starvation differs fundamentally between a negligent company and a negligent crown. For the Bengali victim, the source of the extraction mattered less than the extraction itself; Smith's focus on the *structure* of the extractor risks obscuring the universal vulnerability of the colonised subject.

  *Monopoly as Proximate vs. Structural:* Smith identifies the mercantile monopoly as the root evil. He suggests that if trade were free, the distortions would vanish. Yet, the Bengal famine suggests that the grain-trade monopoly was a proximate cause, whilst the structural feature was the nature of territorial conquest itself. Even without a formal monopoly on grain, the power dynamic of a foreign armed minority extracting revenue from a disarmed peasantry creates vulnerability. Smith's framework treats the monopoly as a market distortion that can be corrected by policy. It struggles to account for the fact that the EIC's political power *was* the market. When the sovereign is the primary trader, 'free trade' is a conceptual impossibility. Smith's theory breaks here by assuming that political power and economic activity can be separated, whereas in colonial Bengal, they were fused.

  **Fiscal Loss or Category Error?**

  Finally, does the episode confirm Smith's broader argument that colonies are a net fiscal loss, or does it reveal a category error?

  Smith famously argued that the cost of defending and administering the colonies exceeded the profits from the monopoly trade, rendering the empire a bad investment for the British taxpayer. The Bengal famine supports the 'fiscal loss' argument in the long term: the destruction of the agrarian base in 1770 led to a collapse in revenue collection in subsequent years, proving that predation is economically self-defeating. The Company destroyed the capital (human and agricultural) required to generate future wealth.

  However, to view this merely as a 'fiscal loss' or 'mercantile miscalculation' is to commit a category error. Smith analyses the failure primarily as one of economic efficiency. The famine reveals that the error was not merely miscalculation, but a fundamental misunderstanding of the nature of sovereignty. Treating territorial sovereignty as a variant of mercantile enterprise is not just bad business; it is a political abomination. The catastrophe suggests that the metric of 'profit and loss' is inapplicable to the duties of governance.

  If the empire is viewed solely through Smith's economic lens, the lesson is that the Company managed its assets poorly. If viewed through a political lens, the lesson is that the Company had no right to govern at all. Smith hints at this by suggesting the Company should be stripped of its territorial rights, but his primary language remains that of political economy. The famine demonstrates that the cost of empire is not just measured in bullion or balance sheets, but in the legitimacy of rule and the moral fabric of the governing nation. The 'loss' was not just fiscal; it was the revelation that a commercial entity cannot sustain the moral weight of sovereignty.

  **Conclusion**

  In conclusion, the 1770 Bengal famine serves as a grim vindication of Adam Smith's critique of the company-sovereign. The EIC's administration exemplified the fiscal predation and neglect of agricultural improvement that Smith predicted would result from conflating the roles of merchant and magistrate. The drive for remittance and the monopoly on trade exacerbated the drought into a famine, confirming Smith's view that the mercantile spirit is incompatible with the duties of government.

  Yet, the episode also exposes the limits of Smith's framework. His theory struggles to fully articulate the moral distinction between Company and Crown victims, and it risks reducing a political catastrophe to an economic miscalculation. While the famine confirms Smith's argument that such colonies are a net fiscal loss due to the destruction of their own tax base, it ultimately suggests a deeper category error: the attempt to administer human lives through the logic of joint-stock dividends. Smith correctly identified the mechanism of the failure, but the scale of the tragedy implies that the critique of empire requires a moral and political vocabulary that extends beyond the boundaries of political economy.
