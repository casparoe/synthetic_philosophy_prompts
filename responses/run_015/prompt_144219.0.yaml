      *(Final check on spelling)*: Programme, Organisation, Centre, Analyse, Modelling, Defence.

      *(Tone check)*: Respectful of their PhD status. Use terms like "normative weight," "epistemic asymmetry," "moral hazard."

      *(One last thought on Case 8)*: Case 8 establishes that negative discretion (veto) requires the same bar as positive. This implies symmetry. If funding needs a vote, blocking needs a vote. This reinforces the "Collective Responsibility" angle.

