  # Institutional Decision Protocol: Joint Venture Milestone Escrow (JVME)

  ### 1. Protocol Structure
  **Context:** A construction joint venture between **Contractor A** (Lead) and **Subcontractor B** (Specialist). The project has three decision milestones (Nodes).
  **Standard Payoffs (Base Contract):** Values represent net profit in thousands of dollars ($k).
  **Escrow Mechanism:** A neutral Third-Party Agent holds a **Performance Bond** of $10k (split $5k attributable to A, $5k to B).
  **Release Rule:** The Bond is released *only* if the project reaches **Final Completion** (Node 3 Pass). If either party exercises a **Stop** option at Node 1 or Node 2, or if Contractor A exercises **Take** at Node 3, the Bond is forfeited to an industry Charity Fund.

  **Game Tree:**
  *   **Node 1 (A):** **Stop** (Ends project) OR **Pass** (Continue).
  *   **Node 2 (B):** **Stop** (Ends project) OR **Pass** (Continue).
  *   **Node 3 (A):** **Take** (Claim Base Payoff, End project) OR **Pass** (Final Completion).

  **Payoff Table (A, B):**
  *   **Node 1 Stop:** ($2, $0) + Bond Forfeited.
  *   **Node 2 Stop:** ($1, $3) + Bond Forfeited.
  *   **Node 3 Take:** ($4, $2) + Bond Forfeited.
  *   **Node 3 Pass (Completion):** ($3, $5) + Bond Released ($5, $5). **Total: ($8, $10).**

  ---

  ### 2. Rational-Choice Reasoning

  #### A. Standard Version (No Escrow)
  *Assumption: Common Knowledge of Rationality (CKR). Agents maximize immediate Base Payoff.*

  1.  **Node 3 (A):** A compares **Take** ($4) vs. **Pass** ($3).
      *   Rational Choice: **Take** ($4 > $3).
  2.  **Node 2 (B):** B anticipates A will Take at Node 3. B compares **Stop** ($3) vs. **Pass** (leads to A Taking, yielding B $2).
      *   Rational Choice: **Stop** ($3 > $2).
  3.  **Node 1 (A):** A anticipates B will Stop at Node 2. A compares **Stop** ($2) vs. **Pass** (leads to B Stopping, yielding A $1).
      *   Rational Choice: **Stop** ($2 > $1).
  *   **Outcome:** Game ends at Node 1. Payoff ($2, $0). Backward Induction (BI) holds.

  #### B. Modified Version (With JVME Escrow)
  *Assumption: CKR. Agents maximize Total Net Payoff (Base + Bond).*

  1.  **Node 3 (A):** A compares **Take** ($4 Base + $0 Bond = $4) vs. **Pass** ($3 Base + $5 Bond = $8).
      *   Rational Choice: **Pass** ($8 > $4).
      *   *Note:* The Base Payoff ranking ($4 > $3) is preserved in the contract text, but the *Effective* payoff ranking flips due to the escrow constraint.
  2.  **Node 2 (B):** B anticipates A will Pass at Node 3 (securing Completion). B compares **Stop** ($3 Base + $0 Bond = $3) vs. **Pass** (leads to Completion, yielding B $5 Base + $5 Bond = $10).
      *   Rational Choice: **Pass** ($10 > $3).
  3.  **Node 1 (A):** A anticipates B will Pass at Node 2. A compares **Stop** ($2 Base + $0 Bond = $2) vs. **Pass** (leads to Completion, yielding A $8).
      *   Rational Choice: **Pass** ($8 > $2).
  *   **Outcome:** Game reaches Final Completion. Payoff ($8, $10). BI is blocked.

  ---

  ### 3. Analysis of the Induction Block

  **The Severing Feature: Path-Contingent Payoff Realization**
  The specific feature that severs the backward induction chain is the **decoupling of payoff authorization from the decision node**. In the standard Centipede game, payoffs are *intrinsic* to the terminal node reached; choosing "Stop" at Node 2 intrinsically yields ($1, $3). In the JVME protocol, payoffs are *extrinsic* and conditional on the **history of play** (the path).

  This design blocks induction without violating Common Knowledge of Rationality because it alters the **feasible set of net outcomes** rather than the agents' utility functions.
  1.  **Preservation of Base Ranking:** The ordinal ranking of the *Base Contract* at the final node remains unaltered ($4 > $3). Contractor A still values the "Take" clause higher than the "Pass" clause *in isolation*.
  2.  **Constraint on Realization:** The Escrow Agent acts as a mechanical constraint. The higher Base Payoff ($4) is *physically inaccessible* without triggering the Bond Forfeiture. Rational agents do not compare $4 vs. $3; they compare $4 (Take + Forfeit) vs. $8 (Pass + Release).
  3.  **Induction Break:** Backward induction relies on the certainty that the *next* player will defect to capture a higher *intrinsic* payoff. Here, the "higher intrinsic payoff" is neutralized by the institutional penalty. Because the penalty is enforced by a neutral third party (not the opponent), it does not rely on social preferences or trust. It is a hard budget constraint.

  **Collapse Condition**
  If the **Forfeiture Clause** is removed (i.e., the Bond is released even if A Takes at Node 3), the case collapses immediately back into the standard paradox.
  *   *Reasoning:* If A Takes at Node 3 and keeps the Bond ($4 + $5 = $9), A still Prefers Take. B, knowing this, compares Stop ($3 + $5 = $8) vs. Pass (A Takes, B gets $2 + $5 = $7). B Stops. A, knowing this, Stops at Node 1. The Escrow must be *conditional on cooperation* to function; if it becomes a sunk endowment, it does not alter marginal incentives at the decision nodes.

  **Honest Limitation**
  This scenario fails to reproduce the **renegotiation risk** inherent in real-world cooperation. A defender of backward induction might argue that in a realistic setting, Contractor A could credibly threaten to **renegotiate the Escrow terms** at Node 3. If A can bribe B or lobby the Third-Party Agent to release the Bond despite a "Take" action (e.g., by claiming a technicality), the structural block dissolves. The protocol assumes the Third-Party Agent is perfectly incorruptible and the contract is perfectly complete. In practice, the transaction costs of enforcing the forfeiture (litigation, arbitration) might exceed the Bond value, restoring the incentive to defect and reviving the backward induction paradox. Thus, the protocol solves the theoretical paradox only by assuming away the enforcement friction that generates the paradox in reality.
