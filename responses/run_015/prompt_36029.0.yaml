      *   (c) *Disease vs. Enhancement:* Is there a line between preventing suffering and maximizing advantage? (Normative boundary).
      *   (d) *Child's Good vs. Parents' Preferences:* Whose interests does the tool serve? (Agency/alignment).
      *   (e) *Optimization/Commodification:* Does turning choice into math change the parent-child relationship? (Relational/psychological impact).

  3.  **Determine the Criteria for Ranking:**
      *   **Upstream/Foundational:** Does answering this make other questions moot or dictate their answers?
      *   **Design Impact:** Does the answer actually change the code/UI? (e.g., Filter vs. Rank).
      *   **Tractability:** Can a software engineer reasonably resolve or accommodate this, or is it purely abstract?
      *   **Dependency:** Does this rely on empirical facts (e.g., PRS accuracy) that might make the philosophical question irrelevant?

  4.  **Drafting the Ranking (Iterative Process):**

      *   *Attempt 1 (Philosophical Depth):* (a) Non-Identity is the most famous, so maybe first?
          *   *Critique:* For a software engineer, (a) is abstract. Whether harm exists or not, the *goal* of the tool is usually defined by the clinic/users. It doesn't change the UI much. If the goal is "best life," you rank. If the goal is "no disease," you filter. (a) justifies the goal but doesn't define the mechanism as much as (c) or (d).

      *   *Attempt 2 (Design Impact):* (d) Child vs. Parents seems crucial. If the tool serves parents, it ranks by parental preference. If it serves the child, it ranks by welfare.
          *   *Critique:* This is very high priority. It dictates the objective function.
      *   *Attempt 3 (The Boundary):* (c) Disease vs. Enhancement. This dictates *what* goes into the objective function.
