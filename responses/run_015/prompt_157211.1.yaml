  2.  **Deconstruct the "Twist" (Guilt-as-Debt vs. Shame-as-Defect):**
      *   *Standard Literature:* Ruth Benedict (*The Chrysanthemum and the Sword*) popularized the Shame Culture vs. Guilt Culture dichotomy, though it's often criticized as oversimplified. Philosophers like Bernard Williams (*Shame and Necessity*) and psychologists like Tangney/Darling have nuanced this.
      *   *The User's Twist:* Framing guilt specifically as *economic/transactional* (debt, installments, balance sheet) vs. shame as *ontological* (being vs. doing).
      *   *Validity:* This is a recognizable philosophical move (Nietzsche touches on debt/guilt in *Genealogy of Morals*), but framing it specifically as "installment plans" for moral repair is a fresh, pragmatic angle suitable for this mixed audience.
      *   *Risk:* It might oversimplify shame (shame can motivate repair) or guilt (guilt can be crushing/ontological). I need to acknowledge the nuance without undermining the hook.

  3.  **Drafting the Speech - Section by Section:**
