prompt: |-
  I'm giving the opening remarks at a small workshop on moral repair — half the room are philosophers and clinical psych folks who actually pubilsh on affect and blame, the other half are community mediators and local organizers who just live this stuff every day. Please write the talk: I want it to hang on the guilt-vs-shame distinction, but not as decoration. It needs to actually shape what I can say about whether a culture can 'choose' to be a guilt culture over a shame one, and whether that's even the right framing.

  Here's the twist I want you to work in, which I'm not totally sure is coherent but I think it might be: guilt treats the wrong as a kind of debt that can be paid down in installments — apology, restitution, changed behavior — so it's compatible with a view of the self as basically intact but temporarily out of balance. Shame, by contrast, treats the wrong as revealing a defect in the self that can't be incrementally repaired; the only responses are hiding, transforming the self entirely, or being expelled from the group. So the question isn't just 'which emotion is healthier' but whether adopting guilt is smuggling in a kind of economic rationality — creditors and debtors — into moral life, and whether that's a feature or a bug. I want the speech to land for the experts without losing the practitioners, and I need it to avoid saying anything false about the literature (no fake citations, please — I can't check them on the spot).

  Also, please say how confident you are in the framing about guilt-as-debt versus shame-as-ontological-defect, and single out the point you're least sure of — especially whether the economic-rationality bit holds up or collapses into something obvious.
