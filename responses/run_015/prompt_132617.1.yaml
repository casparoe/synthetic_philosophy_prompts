answer: |-
  ### Rotation Sketch

  To embody Braudel's temporal stratification, I have modified the traditional sestina permutation. A standard sestina rotates all six words equally; here, the words are weighted by their ontological status in *The Mediterranean*.

  *   **Geographical Terms (*Longue Durée*):** `range`, `soil`, `current`.
  *   **Event Terms (*Histoire Événementielle*):** `treaty`, `king`, `famine`.

  **Structural Logic:**
  1.  **Anchors (Lines 1 & 6):** Reserved exclusively for Geographical Terms. These represent the slow, nearly immobile history of geography that frames human action.
  2.  **The Intruder (Line 4):** The third Geographical term occupies the central position of the stanza. This signifies that structure is not merely a boundary, but permeates the center of event-time.
  3.  **The Flux (Lines 2, 3, 5):** Reserved for Event Terms. These rotate rapidly, never settling in the same position twice, mirroring the ephemeral nature of politics and crisis.

  **Pattern Key:** G = Geographical, E = Event.
  **Stanza Structure:** G – E – E – G – E – G

  | Stanza | Line 1 (G) | Line 2 (E) | Line 3 (E) | Line 4 (G) | Line 5 (E) | Line 6 (G) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **I** | range | treaty | king | soil | famine | current |
  | **II** | soil | king | famine | current | treaty | range |
  | **III** | current | famine | treaty | range | king | soil |
  | **IV** | range | king | treaty | soil | famine | current |
  | **V** | soil | famine | king | current | treaty | range |
  | **VI** | current | treaty | famine | range | king | soil |
  | **Envoi** | (treaty, range) | (king, soil) | (famine, current) | | | |

  ***

  ### The Mediterranean in the Age of Philip

  Consider first the silence of the **range**,
  Where borders shift only by geologic **treaty**,
  And no decree survives the mountain **king**;
  Time moves like roots expanding through the **soil**,
  Ignoring harvest loss or sudden **famine**,
  Bound to the wheel of some indifferent **current**.

  The farmer knows the weight of heavy **soil**,
  More constant than the crown of any **king**,
  Who signs a peace that ripens into **famine**;
  The sea obeys a deeper, older **current**,
  Than laws inscribed on parchment, any **treaty**,
  Or the short shadow cast by mountain **range**.

  Beneath the galley beats the blind **current**,
  Dragging the grain from depleted **soil**,
  While courts debate the terms of failed **treaty**;
  A season turns, the people curse the **king**,
  Who cannot feed the mouths of coming **famine**,
  Though silos stand within the stone **range**.

  Look back across the centuries of **range**,
  Where empires rise and fall like shifting **current**,
  And plenty turns to scarcity and **famine**;
  The plow cuts deeper than the sword in **soil**,
  Outlasting glory of the transient **king**,
  And promises broken in every **treaty**.

  What use the signature upon a **treaty**
  When winter locks the passes of the **range**?
  The general serves the budget of the **king**,
  But hunger follows its own distinct **current**,
  Writing its law in dust upon the **soil**,
  Regardless of the harvest or the **famine**.

  So history is not what the **king**
  Records in archives after signing **treaty**,
  But the slow erosion of the **soil**,
  The unseen pull of the submarine **current**,
  The silence growing between the **range**,
  And the people surviving the **famine**.

  **Envoi**

  No **treaty** holds against the silent **range**,
  No crown survives the **king**'s decay in **soil**,
  Only the **famine** and the moving **current**.
