  **Decision Rules**
  Three decision rules can accommodate all five prior verdicts (Approvals: 1, 3; Rejections: 2, 4, 5):

  **1. The "Verifiable Marginal Impact" Rule**
  *   **Definition:** Fund interventions that address a neglected or non-redundant need (Marginal Impact) AND allow for empirical verification of outcomes (Verifiability). Reject proposals that are redundant, speculative, or unmonitorable.
  *   **Fit to Precedents:**
      *   *Approves 1 & 3:* Both fill unique gaps (market failure, regulatory void) and have measurable outputs (protocol adoption, regulatory change).
      *   *Rejects 2:* Redundant (3 NGOs already present).
      *   *Rejects 4:* Unmonitorable (impossibility of fidelity/outcome tracking).
      *   *Rejects 5:* Speculative (pathway to welfare too indirect).
  *   **Verdict on New Proposal:** **Approve.**
      *   *Reasoning:* The proposal addresses a neglected aspect of maternal mortality (screening vs. drug supply) ensuring non-redundancy. It uses existing data, ensuring outcomes are verifiable (unlike Case 4). The pathway is direct (unlike Case 5).

  **2. The "Structured Deployment" Rule**
  *   **Definition:** Fund interventions only if the deployment mechanism is proven at scale OR, if unproven, includes strict risk-mitigation structures (e.g., phased gates). Reject unproven deployments lacking safety valves.
  *   **Fit to Precedents:**
      *   *Approves 1:* Protocol creation is a tangible deliverable with low deployment risk.
      *   *Approves 3:* Deployment (political change) was unproven, but approved *only* with a "strict phased-gate structure."
      *   *Rejects 2:* Validated intervention, but crowded field implies efficiency risk (often managed by avoiding overlap).
      *   *Rejects 4:* Deployment environment (conflict) made fidelity impossible (structural failure).
      *   *Rejects 5:* Pathway is speculative (structural uncertainty).
  *   **Verdict on New Proposal:** **Reject.**
      *   *Reasoning:* The model has "never been deployed prospectively at scale." Unlike Case 3, which was approved *with* a phased-gate to manage this exact type of uncertainty, the new proposal requests support for integration without mentioning a phased pilot or risk-mitigation structure.

  **3. The "Direct Welfare Pathway" Rule**
  *   **Definition:** Fund interventions where the causal chain from grant activity to human welfare is short and evidence-based. Reject basic science or interventions where the link is broken by logistical impossibility.
  *   **Fit to Precedents:**
      *   *Approves 1 & 3:* Protocol leads to drugs leads to health; Regulation leads to food safety leads to health.
      *   *Rejects 5:* Basic science is too distant from welfare.
      *   *Rejects 4:* Conflict breaks the chain (cannot ensure therapy delivery).
      *   *Rejects 2:* Redundancy dilutes the marginal welfare gain per dollar.
  *   **Verdict on New Proposal:** **Approve.**
      *   *Reasoning:* The chain is direct (Data -> Triage -> Treatment -> Survival). It is more direct than Case 3 (policy) and Case 1 (manufacturing).

  ***

  **Best Guess: The Board's Actual Rule**
  The board is most likely running **Rule 1: The "Verifiable Marginal Impact" Rule.**

  **Reasoning:**
  While Rule 2 (Structured Deployment) explains the phasing in Case 3, it fails to account for the board's apparent prioritization of *neglectedness* and *leverage* over operational caution. Case 1 was approved without phasing despite being a new protocol. Case 3 was approved despite "entirely unproven" political tractability, suggesting the board values the *potential scale* of the solution enough to accept implementation risk, provided they can measure the result. The new proposal is *more* evidence-backed than Case 3 (retrospective accuracy in three countries vs. unproven politics) and *more* measurable than Case 4 (existing data vs. impossible monitoring). The board's rejection of Case 2 (redundancy) and Case 5 (speculation) signals they want high marginal returns on welfare that can be counted. The new proposal fits this perfectly: it fills a funding gap (neglectedness), uses existing infrastructure (efficiency), and tracks outcomes via routine data (verifiability). The lack of a phased-gate is likely a negotiable detail rather than a dealbreaker, whereas redundancy (Case 2) and unmeasurability (Case 4) were hard stops.

