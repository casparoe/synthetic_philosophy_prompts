  Both Case 3 and the new proposal involve high-leverage systemic interventions (changing regulations vs. changing triage protocols) rather than simple commodity distribution. Both address a critical need where the pathway to impact is well-understood theoretically but remains **unproven in prospective, real-world deployment** (political tractability in Case 3; prospective clinical integration in the new proposal). Crucially, both proposals offer the potential for massive scale ("affect millions" vs. "leading cause of maternal mortality") and fill a specific gap left by existing efforts (lack of political will vs. lack of screening within a drug-focused initiative). While Case 1 (antibiotic protocol) shares the "neglected niche" characteristic, Case 3 better captures the board's willingness to fund interventions with implementation uncertainty provided the potential welfare gain is sufficiently high.

