  **Distinguishing Hypothetical Proposal**
  To distinguish the leading rule (**Verifiable Marginal Impact**) from the strongest competitor (**Structured Deployment**), consider the following proposal:

  **Hypothetical Proposal:** A request to deploy a novel, lab-validated solar-powered water purification unit in a remote region with no existing clean water infrastructure. The technology has never been field-tested in this specific climate. The proposal plans immediate full-scale rollout to 50 villages without a pilot phase, but includes robust sensors to track water quality and usage rates in real-time.

  *   **Verdict under "Verifiable Marginal Impact" (Leading Rule):** **Approve.**
      *   *Reasoning:* The need is non-redundant (no existing infrastructure) and high. Crucially, the proposal includes robust sensors, satisfying the *verifiability* constraint. The board prioritizes the marginal welfare gain and the ability to measure it.
  *   **Verdict under "Structured Deployment" (Competing Rule):** **Reject.**
      *   *Reasoning:* The deployment is unproven in the specific context (climate/field conditions). Following the precedent of Case 3 (which required a phased-gate for unproven tractability), this proposal fails because it lacks a pilot or phased structure to mitigate the risk of technical failure before full rollout.

  This hypothetical distinguishes the rules because it isolates *risk management structure* from *measurement capability*. The Leading Rule cares that we will *know* if it worked; the Competing Rule cares that we *minimize the chance* it fails before we find out.
