answer: |-
  **Mara:** Let's take the lunar settlement as our test case. We have a permanent colony on the Moon, but the governing institutions remain on Earth. The Earth-based parliament decides on resource allocation, life-support maintenance, and emergency protocols. My position is straightforward: the Lunarians must be included in the Earth-based demos. Their fundamental interests—breathing, eating, surviving—are systematically shaped by the collective decisions made in Geneva or New York. If the boundary of the demos stops at the Earth's atmosphere, you create a class of subjects who are coerced by laws they have no hand in authorizing. The authorization must be recursive: if Earth's decision impacts the Moon, the Moon must be part of the authorizing body. To exclude them is to violate the very principle of democratic legitimacy.

  **Jonas:** I agree that excluding them is illegitimate, Mara, but I disagree that inclusion in the *Earth-based* demos is the solution. Your recursive authorization view assumes that democratic membership is primarily about protecting interests from external impact. But democracy is not merely a shield against coercion; it is a practice of shared self-rule. For a demos to exist, there must be co-presence—not necessarily physical proximity, but a shared communicative space where deliberation occurs in real-time, with shared context and mutual accountability. A Lunarian cannot participate in Earth's deliberative practices meaningfully. The light-speed delay is symbolic of a deeper phenomenological gap: they live in a sealed environment where a valve failure is an immediate existential threat, while Earth citizens debate it as a budget line item. If Earth governs the Moon remotely, it is not democracy; it is administration. The Lunarians must constitute an independent demos.

  **Mara:** But that independence is a fiction when it comes to the life-support system. This is the tension we need to resolve. The settlement's survival depends on Earth-based resource allocation—ships launching from Earth, funding approved by Earth taxpayers, technology maintained by Earth engineers. If the Lunarians form an independent demos, they claim the right to self-rule, yet they remain materially dependent on Earth's decisions. Does this dependency integrate Earth citizens into the *Lunar* demos? If Earth taxpayers bear the cost and risk of supplying the air, their interests are systematically shaped by Lunar decisions—say, if the colony demands more resources than planned. Under my view, the flow of impact creates a reciprocal boundary. The Earth citizens must have a say in Lunar policy because their welfare is tied to Lunar survival, and Lunarians must have a say in Earth policy because their lives are tied to Earth's generosity. We are looking at a single, trans-planetary demos, not two separate ones.

  **Jonas:** You are conflating causal interdependence with democratic membership. Yes, Earth and Moon are causally linked. But if Earth controls the resources, Earth holds the power. If you integrate Earth citizens into the Lunar demos based on resource contribution, you effectively give the master a vote in the servant's household. That doesn't solve the legitimacy problem; it codifies the asymmetry. For me, co-presence requires a symmetry of agency. If the Lunarians cannot deliberate with Earthlings as equals because the material conditions of their existence are held hostage by Earth's logistics, then they cannot be part of the same demos. The resource dependency proves they need *separation*, not integration. They need their own sovereign authority to negotiate with Earth as a distinct political entity, not as a voting bloc within Earth's legislature. Otherwise, the "shared deliberation" you propose is just the powerful listening to the dependent plead for mercy.

  **Mara:** I see the risk of asymmetry, Jonas, but your solution treats the boundary as a wall rather than a membrane. If they separate into independent demoi, you lose the mechanism for holding Earth accountable to the Lunarians. An independent Lunar state can negotiate, yes, but if Earth cuts off supplies, the negotiation is over. Democracy requires that the power exerted over you is authorized by you. In your co-presence view, you prioritize the *capacity* for joint deliberation over the *fact* of subjection. You are saying that because they cannot deliberatively co-exist with Earthlings due to distance and context, they should be excluded from Earth's decisions entirely, even though Earth's decisions kill or save them. My question is this: Is democratic membership defined by the ability to speak in the assembly, or by the necessity of being protected from the assembly's power? If it's the latter, my recursive view holds. If it's the former, you admit that democracy cannot function across planetary distances.

  **Jonas:** It is not about the ability to speak; it is about the ability to act together. Democracy is collective agency, not just mutual protection. If the condition of membership is vulnerability to power, then everyone affected by a decision belongs in the demos, which expands the boundary until it encompasses everyone and thus no one. My co-presence view limits the demos to those who can actually construct a common will through dialogue. In the lunar case, the resource dependency creates a relationship of *trust* and *contract*, not necessarily *citizenship*. Earth and Moon should relate as distinct political bodies bound by treaty, not as one fragmented people. The precise disagreement here is not empirical—we agree resources flow and interests clash. The disagreement is conceptual: You define membership as *affected interest*, requiring inclusion to prevent harm. I define membership as *shared agency*, requiring exclusion to preserve the possibility of genuine self-rule. If we integrate them into Earth's demos, we dilute the agency of both. If we separate them, we preserve the integrity of the deliberative practice, even if the power asymmetry remains a diplomatic challenge rather than a constitutional one.

  **Mara:** Then we have located the fracture. You believe democratic legitimacy arises from the *process* of constructing a common will among those who can meet as peers. I believe it arises from the *structure* of justification owed to those whose lives are determined by the will. For you, the Lunar settlers are a separate people because they cannot deliberate with Earth. For me, they are the same people because they cannot survive without Earth. You prioritize the *who* of deliberation; I prioritize the *what* of consequence.

  **Jonas:** Precisely. And because of that, you see the resource link as a tether binding us into one body politic. I see it as a chain binding us into a relationship of power that democracy cannot dissolve, only manage. If we accept your view, we risk a democracy so vast it cannot speak. If we accept mine, we risk a democracy so pure it cannot protect.

  **Mara:** Then the boundary problem is not about where we draw the line on a map, but whether we view democracy as a system of security or a system of freedom.

  **Jonas:** And whether the Lunar settler is a citizen to be protected, or a neighbor to be engaged. We agree on the stakes, Mara. We simply disagree on the soul of the demos.
