answer: |-
  The maneuver you are describing is formally identified in the philosophy of history as **retrospective determinism**, often operating as a specific form of **teleological bias** within **historicist** frameworks.

  This move functions by allowing the presumed endpoint of a narrative to dictate the qualitative meaning of events preceding it, rather than allowing the intrinsic properties of those events to determine their classification. In cyclical theories like those of Spengler or Toynbee, the "organism" of civilization is assumed to have a fixed lifespan; therefore, any given trait (like monumental architecture) is defined not by what it *is*, but by where it sits on the predetermined curve. If the civilization is assumed to be rising, the trait is evidence of growth; if the civilization is assumed to be falling, the identical trait is evidence of decadence. This is distinct from **hindsight bias**, which is a psychological error regarding the *predictability* of an outcome (believing you knew it would happen), whereas retrospective determinism is an ontological claim about the *nature* of the evidence itself based on its temporal location. It is also more active than simple **unfalsifiability**; while unfalsifiability means a theory cannot be proven wrong, this move actively absorbs contradictory evidence by flipping its semantic valence to fit the curve, effectively immunizing the narrative against refutation through reinterpretation rather than exemption.

  The boundary between this fallacious move and legitimate historical reinterpretation lies in the source of the new interpretation. Legitimate revisionism occurs when new evidence emerges (e.g., archeological data showing the building was actually a fortification, not a temple) or when the contextual framework expands (e.g., realizing the building was funded by debt rather than surplus). The fallacious move occurs when the evidence remains static and the only variable changing is the historian's assertion of which "phase" the civilization occupies. If the only justification for calling a trait "rot" instead of "vigor" is that the collapse happened later, the reasoning is circular.

  This problem is not unique to cyclical theories; it equally affects linear progress theories, particularly **Whig history**. In a linear framework, the same trait can be valorized or condemned based on whether it is seen as leading toward or away from the presumed endpoint (usually modern liberal democracy). For example, religious uniformity might be described as "social cohesion" in a chapter about the stability required for early state-building, but as "oppressive dogma" in a chapter about the march toward Enlightenment liberty. The structural flaw is identical: the moral or functional value of the evidence is derived from its proximity to the theorist's chosen telos, not from an independent assessment of the phenomenon itself.
