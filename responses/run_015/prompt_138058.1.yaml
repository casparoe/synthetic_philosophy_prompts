  New pitch on her desk: Tambora in 1815 and the year without a summer. Nobody in Europe or New England knew a volcano had done it, the effects landed a year later and thousands of miles away, and they run through failed harvests, grain prices, migration, and maybe the first cholera pandemic. One of her researchers has floated a test I can't stop thinking about, call it the swap test: something is an actor only if you can swap in a different eruption, a different bacterium, a different drought, and still get a recognizably different history out the other end.

