answer: |-
  **Instrument: Mapping the Logical Space of Distributive Justice**

  **Introduction**
  Standard introductions to distributive justice often present the debate as a choice of "currency": welfare, resources, or capabilities. This instrument tests the hypothesis that this choice is insufficient. It posits that any coherent theory of justice must also decide *when* to measure equality (before or after risks/choices) and *what pattern* to aim for (strict equality, a floor, or weighted priority). Use this tree to locate your own position. Answer the questions based on your intuitions about a hypothetical society, not on which label you wish to adopt.

  ***

  ### **The Decision Protocol**

  **Q1. The Metric (Currency)**
  When comparing two people to determine if inequality exists, what is the fundamental thing you measure?
  *   **A.** Their subjective happiness or satisfaction. → *Go to Q2.*
  *   **B.** Their external means (income, wealth, assets). → *Go to Q2.*
  *   **C.** Their real freedom to function (what they can actually do/be). → *Go to Q2.*
  *   **D.** Their social standing, status, or relationship to institutions. → *Go to Leaf 7.*
  *   **E.** Their set of opportunities before they choose. → *Go to Q2.*

  **Q2. The Pattern (Distribution Goal)**
  Once you have measured that metric, what is the moral goal of its distribution?
  *   **A.** Everyone should have the exact same amount. → *Go to Q3.*
  *   **B.** Everyone should have "enough," but above that floor, inequality doesn't matter. → *Go to Leaf 6.*
  *   **C.** We should benefit the worse off, but not necessarily to the point of equality; their claims count for more. → *Go to Leaf 5.*

  **Q3. The Timing (Assessment Point)**
  If the goal is equality, when should we assess whether people are equal?
  *   **A.** **Ex Post:** We look at what people actually ended up with. If outcomes differ, justice requires compensation, regardless of choices. → *Go to Leaf 1.*
  *   **B.** **Ex Ante:** We look at the prospects people had. If outcomes differ due to voluntary choices or luck they could insure against, inequality is permissible. → *Go to Leaf 2 or 3.*

  ***

  ### **The Leaves (Named Positions)**

  **Leaf 1: Welfarist Egalitarianism**
  *(Path: Welfare + Equality + Ex Post)*
  Justice requires equalizing actual subjective welfare. Criticized for accommodating "expensive tastes" (compensating those who need more to be happy), but remains the baseline utilitarian-equal view.

  **Leaf 2: Resource Egalitarianism (Dworkin–Cohen)**
  *(Path: Resources + Equality + Ex Ante)*
  Justice requires equalizing external means, adjusted for ambition but not endowment. Uses an insurance model to neutralize brute luck while holding people responsible for option luck.

  **Leaf 3: Luck Egalitarianism**
  *(Path: Welfare/Resources + Equality + Ex Ante/Responsibility)*
  Justice requires neutralizing inequalities arising from brute luck while permitting those from choice. Often indistinguishable from Leaf 2 in practice, but theoretically distinct in its focus on the *reason* for inequality rather than the *metric*.

  **Leaf 4: The Capability Approach (Sen/Nussbaum)**
  *(Path: Capabilities + Equality/Sufficiency)*
  *Note: This view spans Q2 options A and B.* Justice focuses on expanding substantive freedoms. Nussbaum leans toward a sufficiency threshold of central capabilities; Sen resists a single formula but prioritizes capability equality over resources.

  **Leaf 5: Prioritarianism**
  *(Path: Any Currency + Priority Weighting)*
  Justice does not require equality per se, but gives greater moral weight to benefits for the worse off. Distinct from egalitarianism because it does not object to inequality if no one is badly off, nor does it seek to level down.

  **Leaf 6: Sufficientarianism**
  *(Path: Any Currency + Sufficiency Floor)*
  Justice requires ensuring everyone has enough of the metric. Inequality above the threshold is irrelevant. Often paired with Capabilities or Welfare, but logically independent of currency.

  **Leaf 7: Relational Egalitarianism**
  *(Path: Social Relationships)*
  Justice is not about distributing quantifiable goods but about eliminating oppression, hierarchy, and status inequality. Rejects the "distribution paradigm" implicit in Q2 and Q3.

  ***

  ### **Structural Limitations & Overlaps**

  **Empty Cells (Unoccupied Logical Space)**
  *   **Relational + Strict Equality (Quantitative):** *Incoherent.* Relational egalitarianism rejects the quantification required for strict mathematical equality of goods.
  *   **Welfare + Strict Equality + Ex Post:** *Unattractive.* Rarely defended because it necessitates compensating voluntary expensive tastes, violating most people's responsibility intuitions.
  *   **Opportunity + Sufficiency + Ex Ante:** *Unexplored.* Ensuring everyone has only a "sufficient" set of opportunities rather than equal prospects is theoretically possible but lacks prominent defenders.

  **Indistinguishable Leaves**
  *   **Resource Egalitarianism (Leaf 2) vs. Capability Approach (Leaf 4):** This tree cannot fully separate these views. Resources are often valued instrumentally for capabilities. A student choosing "Resources" in Q1 may simply mean "Resources necessary for function," landing them effectively in the Capability camp. The distinction is often one of emphasis (means vs. ends) rather than logical incompatibility.
  *   **Resource Egalitarianism (Leaf 2) vs. Luck Egalitarianism (Leaf 3):** These overlap significantly. Luck egalitarianism is often the *justification* for Resource Egalitarianism's ex ante adjustments. They are separated here only to highlight that one emphasizes the *metric* (resources) while the other emphasizes the *timing/responsibility* condition (luck).

  **Instrument Note**
  If you find yourself moving between Leaf 2 and Leaf 4, your disagreement with your friend may not be about currency at all, but about whether resources are a adequate proxy for freedom. If you move between Leaf 2 and Leaf 3, your disagreement is likely about whether "luck" is a separate moral category or simply a feature of resource distribution.
