answer: |-
  ### Brainstorming Rationalisations

  Before reconstructing the implicit theory, I need to map the logical space. The practice you describe—counting fiscal contributions of future persons while excluding their welfare, treating migrants and newborns as interchangeable, and justifying this via "effects on the already alive"—is a specific hybrid. It is not a standard ethical theory, but it can be rationalised in several competing ways. Here are five distinct rationalisations, noting where they diverge.

  1.  **Fiscal Total Utilitarianism:** This view holds that the goal is to maximise total social welfare, but it operationalises "welfare" strictly as "net fiscal contribution." It assumes a tight correlation between tax paid and well-being generated.
      *   *Prediction:* If a child were projected to be happy but a net fiscal drain (e.g., disabled, or entering a low-tax vocation), this view would oppose subsidising them. It would also support high immigration regardless of cultural integration, provided the fiscal math holds.
  2.  **Narrow Person-Affecting Restriction:** This view holds that we only have obligations to people who already exist. Future people do not have moral standing. However, their *actions* (paying tax) affect existing people (pensioners).
      *   *Prediction:* This justifies counting the tax (benefit to existing) but ignoring the child's welfare (no subject to bear it). It would oppose policies that harm existing people to benefit future ones, but is indifferent to policies that benefit future people at no cost to existing ones.
  3.  **State Realism (The Leviathan View):** The primary moral patient is the State itself, not the citizens. The State requires resources (tax) and stability (demographic continuity) to persist. Citizens are instruments of state continuity.
      *   *Prediction:* Migrants and newborns are perfectly interchangeable. The welfare of the population is secondary to the solvency of the state. Environmental costs are only counted insofar as they threaten state stability (e.g., via carbon taxes or disaster relief costs).
  4.  **Intergenerational Contractualism:** Society is a chain of reciprocity. The elderly were supported by the young, so the current young must be supported to support the next elderly. It is a duty of fairness, not welfare maximisation.
      *   *Prediction:* Focuses heavily on the dependency ratio. It would likely support benefits conditional on the child *staying* in the country (to fulfil the contract). It might oppose migration if migrants are seen as outside the specific national contract, unlike newborns.
  5.  **Human Capital Instrumentalism:** Children are public investment goods. The state invests capital (bonuses, education) and expects a Return on Investment (ROI) in the form of tax.
      *   *Prediction:* Policy would target "high quality" births (e.g., educated parents, healthy infants) to maximise ROI. It would treat the exclusion of welfare as a accounting convention: we don't count the "welfare" of a bridge, we count its toll revenue.

  These are mutually exclusive in their foundations (e.g., State Realism vs. Contractualism), yet they all converge on the same spreadsheet: Future Person = Net Tax Stream. The divergence appears in edge cases: would you pay for a child likely to be unhappy but wealthy? (Fiscal Utilitarianism: Yes. Contractualism: Maybe not.) Would you accept a migrant who pays tax but doesn't share national values? (State Realism: Yes. Contractualism: No.)

  Now, I will proceed to the structured reconstruction based on the specific details you provided.

  ***

  ### 1. The Implicit Theory

  The bundle of practices you describe presupposes a view I shall call **Fiscal Person-Affecting Instrumentalism**. It is a hybrid theory that stitches together a person-affecting constraint on *costs* with a totalizing constraint on *benefits*, mediated by a specific conception of the person as a fiscal vessel.

  The core tenets are:
  1.  **Moral Standing is Retrospective:** Moral consideration (welfare weighting) is only owed to beings who exist independently of the policy intervention. This is the "already-alive" reply. It adopts the Non-Identity Problem's logic to shield the ministry from claims about the child's well-being: you cannot harm or benefit someone by bringing them into existence, so their welfare is excluded from the appraisal.
  2.  **Fiscal Externalities are Real:** While the child's *welfare* is not a moral subject, the child's *economic activity* is a physical fact that impacts existing moral subjects (current taxpayers and pensioners). Therefore, the tax revenue generated by the new person is a valid benefit, because it accrues to people who *do* have standing.
  3.  **Identity Irrelevance:** The source of the fiscal stream (birth vs. migration) is morally neutral. This implies that persons are not valued for their unique identity or intrinsic dignity, but for their functional capacity to transfer resources across time.
  4.  **The Asymmetry of Accounting:** There is a substantive commitment that existence is not a benefit *to the existor* for the purposes of state appraisal, but non-existence is not a harm *to the state* either, unless it results in fiscal shortfall.

  The unstated part of this theory is the **Reification of the Future**. The ministry treats the future population as a resource stock to be managed, similar to oil reserves or infrastructure. By excluding welfare, they avoid the "Repugnant Conclusion" (that we should just maximise population regardless of quality of life) by fiat, while retaining the "Total Utilitarian" advantage of counting the aggregate economic output of that population. It is a theory that grants the state rights over the demographic composition of the future without granting the future subjects rights against the state.

  ### 2. Strict Presupposition versus Good Fit

  Is the ministry's "already-alive" reply sufficient to reconstruct the whole practice on a person-affecting basis? **No.** The practice is philosophically underdetermined, but only superficially.

  The "already-alive" reply works perfectly to exclude the child's welfare (Person-Affecting View). However, it struggles to justify counting the child's *tax contributions* without counting their *welfare*. If the child is not a moral subject because they do not exist in the baseline, why is their labor a moral good? Tax is a burden on the worker. If the worker does not exist in the baseline, they are not being burdened. But the revenue helps *existing* people. So, the logic holds: Benefit to Existing (Tax) is counted; Benefit to Non-Existing (Welfare) is not.

  However, this reconstruction is fragile. It relies on a specific observable feature to distinguish it from **Fiscal Total Utilitarianism** (where tax is just a proxy for welfare).
  *   **What would settle the question:** If the ministry were presented with a case where a marginal child was projected to have a life *not worth living* (severe suffering) but was still a *net fiscal contributor* (e.g., a miserable worker in a high-tax industry), the two theories diverge.
      *   A **Person-Affecting** view (consistent with the exclusion) would still exclude the suffering (no subject to suffer) and count the tax (benefit to existing).
      *   A **Total Utilitarian** view would subtract the suffering from the total value.
      *   If the ministry approves the birth in this scenario, they are committed to the Fiscal Person-Affecting view (or State Realism). If they reject it, they are secretly Total Utilitarians using tax as a proxy.
  *   **What never could settle it:** The interchangeability of migrants and newborns. Both views support this. A Total Utilitarian sees utility units; a Person-Affecting Fiscalist sees revenue streams for existing citizens.

  The "already-alive" reply is a convenient shield, but it creates a tension: it treats the child as non-existent for welfare purposes but existent for fiscal purposes. This is not a stable philosophical position, but it is a stable *bureaucratic* one.

  ### 3. The Exclusion

  Is the decision not to score the child's own welfare a genuine substantive commitment or a defensible convention? **It is a substantive commitment disguised as a convention.**

  If it were merely a bookkeeping convention (e.g., "welfare is too hard to measure"), it would apply to *all* policies, or at least all policies affecting future people. But you note it is applied *only* in fertility programmes. In infrastructure or health policy, QALYs for future beneficiaries are standardly estimated.
  *   **The Incoherence:** If existence *could* benefit the person who exists, the current practice becomes incoherent because it creates a **One-Sided Account**. It counts the costs the child imposes on the state (education, health) and the benefits the child confers on the state (tax), but ignores the benefits/costs the state confers on the child (life quality).
  *   **Why only fertility?** Because in fertility policy, the *identity* of the beneficiary is contingent on the policy. In a hospital building project, the people who use the hospital will exist regardless; the policy just makes them healthier. In fertility policy, the policy *makes* them exist.
  *   **The Substantive Claim:** By excluding welfare only here, the ministry is implicitly endorsing the **Asymmetry View** (we have reasons to avoid creating miserable people, but no reasons to create happy people) *for the purpose of welfare*, while simultaneously endorsing **Totalism** *for the purpose of finance*. This is the "Bookkeeping Reason" fallacy. You cannot claim neutrality on the value of existence while monetizing the consequences of that existence. If the child is a "fiscal asset," they are a "person" in the economic model. To deny them "person" status in the welfare model is to assert that their economic function outweighs their subjective experience.

  ### 4. Internal Coherence

  Is it coherent for Finance to count a person as an asset and Environment to count them as a liability, while neither counts their welfare?

  **Yes, it is internally coherent, but only under a specific ontology:** On this practice's terms, a person is **a Net Flow of Externalities**.
  *   To Finance, the flow is Money In (Tax) minus Money Out (Services).
  *   To Environment, the flow is Carbon Out (Emissions) minus Carbon Sink (Consumption patterns).
  *   To Welfare (excluded), the flow is Pleasure minus Pain.

  The coherence holds because all three departments are measuring impacts on *systems* (the Treasury, the Atmosphere), not on *subjects*. The Treasury cares about solvency. The Environment Ministry cares about atmospheric concentration targets. Neither cares about the experiencer of the life.

  **Is there a version that is coherent and recognisable?**
  Yes. A **Sustainability Appraisal** that treats population as a variable in a carrying-capacity model.
  *   *Finance:* Can the economy support this many people?
  *   *Environment:* Can the biosphere support this many people?
  *   *Welfare:* (Still excluded).
  This is recognisable as population policy, but it is **Malthusian Mercantilism**. It treats humans as livestock: valuable for their wool (tax), costly for their feed (services) and waste (emissions). The incoherence only arises if you claim the goal is *human well-being*. If the goal is *state permanence within ecological bounds*, the spreadsheets align perfectly. The person is reduced to a unit of metabolic and economic throughput.

  ### 5. The Targeting Inversion

  This is the crux of your second friend's claim. Does paying only for *marginal* births (those that would not otherwise occur) strengthen or undermine the justification?

  **My assessment: Your second friend is correct. The targeting reform undermines the Ministry's philosophical defense, even if it improves economic efficiency.**

  Here is the reasoning:
  1.  **The Universal Bonus (Status Quo):** When you pay for *all* births, you can maintain the fiction that you are supporting *existing families*. The money goes to parents (existing people). The child is a side effect. The Ministry can say, "We are alleviating the financial burden on current taxpayers (parents) to encourage a behavior that helps future taxpayers." The link between the payment and the *creation* of the new person is diluted.
  2.  **The Marginal Payment (Reform):** When you pay *only* for births that would not have happened otherwise, you are explicitly purchasing *existence*. You are admitting that the counterfactual is non-existence.
  3.  **The Collision with "Already-Alive":** The Ministry's defense for excluding child welfare is: "We only count effects on people who are already alive."
      *   In the **Universal** case, the parents are already alive. The benefit to them is clear.
      *   In the **Marginal** case, the *primary* outcome is a new person. The parents are only benefiting *because* a new person exists.
      *   If the Ministry counts the *tax* of this new person (who only exists due to payment) but excludes the *welfare* of this new person (because they didn't exist in the baseline), they are engaging in **Selective Reification**. They are reifying the child enough to tax them, but de-reifying them enough to ignore their suffering.
  4.  **Why it makes it worse:** The targeting makes the *instrumentalization* explicit. It admits that the state is inducing existence for fiscal gain. Under a Person-Affecting view, you cannot benefit the non-existent. So, if the child's welfare is excluded, the *only* benefit is the tax. This means the state is creating a person *solely* to extract value from them for the benefit of others.
      *   If the Ministry were consistent Person-Affecting theorists, they should oppose the Marginal Payment. Why? Because you cannot benefit the non-existent child, and if the cost to the parents (in effort/risk) outweighs the cash bonus, you might even be harming the parents.
      *   If the Ministry were consistent Total Utilitarians, they should count the child's welfare.
      *   By targeting marginal births *and* excluding welfare, they are effectively saying: "We will bring people into existence to serve us, but we accept no responsibility for whether their lives are good."

  The targeting reform strips away the cover of "supporting families" and reveals the core transaction: **Existence for Revenue.** This makes the exclusion of welfare morally glaring rather than bureaucratically convenient.

  ### 6. Replacement

  Suppose we replace the implicit view with two alternatives. Here are the institutional consequences:

  **A. Strict Asymmetry View** (We have reasons to avoid creating miserable people, but no reasons to create happy people.)
  *   **Survive Unchanged:** Environmental impact assessments (avoiding harm). Support for parents to prevent child poverty (avoiding harm to existing/newborn).
  *   **Survive with Different Justification:** Pension reform. You can't argue "we need more workers." You must argue "we need to adjust benefits to avoid harming current pensioners."
  *   **Abandoned:** **Baby Bonuses and Fertility Incentives.** These are purely pro-natalist. Under strict asymmetry, there is no moral reason to increase the population size. The fiscal argument collapses because future tax revenue is not a moral good that outweighs the neutrality of non-existence. The ministry would shift from "Population Growth" to "Population Stabilization" or "Decline Management."
  *   **Institutional Consequence:** The "Long-Run Fiscal Sustainability" report would no longer treat a smaller workforce as a *cost*. It would treat it as a *neutral parameter* that requires adjustment in benefit levels.

  **B. Averaging View** (What matters is the average welfare level, not the total.)
  *   **Survive Unchanged:** Quality-of-life metrics (QALYs) in health appraisal.
  *   **Survive with Different Justification:** Migration policy. Migrants would be scored on whether they raise or lower the national average welfare, not on net fiscal contribution (unless tax perfectly correlates with welfare).
  *   **Abandoned:** **The Fiscal Proxy.** Counting tax revenue is irrelevant unless it translates to average well-being. If adding a worker lowers average wages (dilution), the policy is bad, even if total tax revenue rises.
  *   **Institutional Consequence:** Fertility payments would be conditional on the *expected quality of life* of the child, not their fiscal ROI. This is administratively nightmarish. It would likely lead to the abandonment of quantitative population targets entirely. The ministry would stop trying to "fix" the worker-to-retiree ratio and focus on productivity growth (making the existing workers more efficient) to maintain average living standards.

  ***

  ### Final Reflection: The Missing Distinction

  There is a philosophical distinction both the Ministry and the Objector are sliding over: **The Distinction between Status and Function.**

  The Ministry treats the future person as having the *function* of a taxpayer without granting them the *status* of a rights-bearer. The Objector argues that if you count the function, you must count the status. Both assume these are linked.

  The deeper issue is **Political Membership**. The practice treats the child as a *subject of the state* (liable for tax, subject to emission counts) before they are a *member of the community* (bearer of welfare rights).
  *   A better-designed practice would have to confront the question: **Does the state have the right to recruit citizens?**
  *   Currently, the practice assumes the state is a continuing entity that needs staff.
  *   A philosophically robust practice would acknowledge that demographic policy is not just economic planning; it is **constitutive**. It decides *who* the "we" is in "our welfare."
  *   By excluding the child's welfare, the Ministry is effectively saying the future population is a colony to be exploited for the metropole (the current generation).
  *   The missing distinction is between **Stewardship** (managing the conditions for future people who will exist) and **Manufacturing** (bringing people into existence to solve current problems). The current practice tries to have it both ways: Manufacturing the people, but claiming only Stewardship of the budget. A coherent ethics must choose: either we are responsible for the lives we create (count the welfare), or we have no business creating them for fiscal ends (abolish the bonuses). The middle ground is a bureaucratic fiction.
