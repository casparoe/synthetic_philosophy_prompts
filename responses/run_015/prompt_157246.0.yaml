      *   The prompt suggests: absolute vs. positional goods? democratic equality vs. meritocratic hierarchy?
      *   To make the comparison work, participants must understand that *equality* creates the tension. If hierarchy is naturalized (feudalism), success isn't a problem. In democracies, everyone is theoretically equal, so standing out is problematic.
