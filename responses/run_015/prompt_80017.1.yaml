answer: |-
  # Phase One: Brainstorming Candidate Open Questions

  To begin, we cast a wide net. I am listing potential research vectors without filtering for tractability or importance. The goal is to map the solution space before narrowing it.

  1.  **The Boundedness Thesis:** Is there a principled argument that utility *must* be bounded above (and below), regardless of the agent's preferences?
  2.  **The Epistemic Blackout:** Are there cognitive or evidential limits that prevent agents from justifying probability assignments below a certain threshold (e.g., $10^{-50}$)?
  3.  **Intertheoretic Comparability:** Can moral values from different normative theories be placed on a single cardinal scale, or are they fundamentally incomparable?
  4.  **Lexicographic Decision Rules:** Should we replace expected value maximization with a rule that prioritizes avoiding catastrophe over maximizing expectation (e.g., lexical priority to safety)?
  5.  **The "Reverse Mugging":** Does fanaticism imply we must also ignore high-probability, small-stakes decisions (the "Pascal's Fire" problem)?
  6.  **Dynamic Consistency:** Does fanaticism persist if we model the agent as making sequential decisions over time rather than one-off bets?
  7.  **Probability-Value Correlation:** Is there a structural link where higher claimed payoffs necessarily imply lower credibility (a "complexity penalty" on value claims)?
  8.  **Moral-Uncertainty Specifics:** Does integrating over moral theories (moral uncertainty) exacerbate or mitigate fanaticism compared to empirical uncertainty?
  9.  **Alternative Aggregation:** Should we use geometric expected utility, quantile utility, or expected shortfall instead of arithmetic expectation?
  10. **The Shutdown Problem:** Does fanaticism prevent an agent from allowing itself to be turned off (because existence allows for potential infinite value)?
  11. **Conceptual Possibility vs. Metaphysical Possibility:** Should priors be assigned based on what is conceivable or what is metaphysically possible?
  12. **The Role of "Seriousness":** Is there a normative filter for "serious possibilities" that excludes hypothesis spaces generated solely for extortion?

  ***

  # Phase Two: Select and Rank

  For a three-philosopher group with eighteen months and no empirical budget, we must leverage conceptual analysis and normative argumentation. We cannot solve the empirical calibration of tail risks (that requires data), nor can we easily build complex computational models. We must attack the *foundations* of the fanaticism problem.

  I have selected four questions. They are ordered by **upstream-ness**: if the answer to Question 1 is resolved, Questions 2–4 may become moot or trivial. If Question 1 fails, Question 2 becomes critical, and so on.

  ### 1. The Axiological Ceiling: Is Utility Essentially Bounded?
  *   **Category:** (b) Axiological
  *   **Upstream Logic:** This is the most upstream question. If utility is essentially bounded (i.e., there is a maximum possible value any outcome can have), then expected value cannot diverge, and fanaticism is mathematically impossible regardless of probability assignments or decision rules. If utility is unbounded, the door remains open for fanaticism, and we must proceed to Question 2.
  *   **Tractability:** High for philosophers. This requires analyzing the structure of value, the coherence of "infinite betterness," and the relationship between preference satisfaction and value magnitude. It does not require empirical data.
  *   **Re-ranking Evidence:**
      *   *Move Up:* If a rigorous proof is found that unbounded utility leads to preference cycles (money pumps) in *all* plausible contexts.
      *   *Move Down:* If it is demonstrated that bounded utility forces unacceptable trade-offs in standard cases (e.g., preventing the saving of a second life once a "cap" is reached).

  ### 2. The Moral-Uncertainty Mugger: Structure of Intertheoretic Value
  *   **Category:** (b) Axiological (primarily) / (a) Epistemic (secondarily)
  *   **Upstream Logic:** This is a specific, high-leverage instance of the Axiological question. Standard fanaticism relies on empirical uncertainty (will the magic trick work?). Moral fanaticism relies on normative uncertainty (is utilitarianism true?). If moral theories are *incomparable* (no common currency), the calculation dissolves. If they are comparable but unbounded, the problem worsens. Resolving this informs the general Boundedness question by testing it in the domain where value claims are most extreme.
  *   **Tractability:** High. This is pure normative ethics and metaethics. It involves analyzing the structure of moral credences and value scales.
  *   **Re-ranking Evidence:**
      *   *Move Up:* If analysis shows that moral uncertainty *necessarily* generates fanaticism even when empirical uncertainty does not (implying the problem is in value theory, not probability).
      *   *Move Down:* If it turns out moral uncertainty can be fully reduced to empirical uncertainty about natural facts.

  ### 3. The Epistemic Blackout: Justification for Extreme Priors
  *   **Category:** (a) Epistemic
  *   **Upstream Logic:** If Axiology (1 & 2) fails to bound value, we must bound probability. This question asks whether agents can ever be epistemically justified in assigning non-negligible probability to claims requiring complex causal chains (e.g., $10^{100}$ lives saved). If there is an "epistemic horizon" below which probabilities are indistinguishable from zero, fanaticism is blocked. This is downstream of Axiology because if value is bounded, we don't need to police probabilities as strictly.
  *   **Tractability:** Medium-High. Philosophers can analyze the conditions for justification, the nature of evidence, and the limits of conceivability without needing to generate actual forecasts.
  *   **Re-ranking Evidence:**
      *   *Move Up:* If a general principle is found that links claim magnitude inversely to maximum justifiable credence (a "complexity penalty").
      *   *Move Down:* If it is shown that legitimate scientific hypotheses (e.g., cosmological multiverse) require accepting extreme priors, making a blanket ban untenable.

  ### 4. Procedural Patches: Alternative Decision Rules
  *   **Category:** (c) Procedural/Normative
  *   **Upstream Logic:** This is the last line of defense. If values are unbounded (1) and probabilities can be justified (3), we must change the *math* of decision-making (e.g., using quantiles instead of means). This is downstream because changing the decision rule is a costly theoretical move that should only be taken if the inputs (value and probability) cannot be fixed.
  *   **Tractability:** Medium. Requires formal modeling and checking for new pathologies (e.g., does quantile maximization lead to paralysis?).
  *   **Re-ranking Evidence:**
      *   *Move Up:* If Questions 1–3 are definitively resolved in favor of the "fanatic" (i.e., unbounded value and justified extreme probabilities are accepted).
      *   *Move Down:* If alternative rules are shown to violate basic dominance principles or dynamic consistency.

  ***

  # Specific Cut: The Moral-Uncertainty Mugger

  You asked to address the **Moral-Uncertainty Mugger** head-on: *Is this a genuinely distinct problem from the standard probability-mugging case, or is the same pathology in different clothes?*

  **My Position:** It is a **distinct problem**, and recognizing this distinction shifts the research weight heavily toward Axiology (Category b) rather than Epistemology (Category a).

  **The Argument:**
  In a standard Pascal's Mugging, the agent accepts a shared value framework (e.g., "lives are good") but disagrees on the *empirical probability* of the causal mechanism ("I can save $3^{3^{3}}$ lives"). The solution space there is largely epistemic: how do we penalize complex causal claims?

  In the Moral-Uncertainty Mugger, the agent says: "You admit there is a non-zero chance Utilitarianism is true. Utilitarianism says the value of the future is unbounded. Therefore, you must maximize expected moral value." Here, the probability assignment is over *value functions themselves*, not just empirical outcomes.

  This is distinct for two reasons:
  1.  **Incomparability vs. Uncertainty:** In the empirical case, we assume a common scale (dollars, QALYs). In the moral case, we are assuming intertheoretic comparability (that a Deontologist can meaningfully assign a 10% credence to a Utilitarian utility function). If moral theories are incomparable, the "expected moral value" calculation is category error, not just risky. This makes the core issue Axiological (the structure of value space) rather than Epistemic (the size of the probability).
  2.  **The Source of Unboundedness:** Empirical mugging requires a *causal* story for how one action affects $10^{100}$ beings. Moral mugging requires only a *conceptual* story (e.g., "if Utilitarianism is true, the future matters immensely"). It is much easier to justify a non-zero credence in a moral theory than in a physical miracle. Therefore, the probability leg of the EV calculation is much harder to cut in the moral case.

  **Impact on Ranking:**
  If the Moral-Uncertainty Mugger were merely the same pathology in different clothes, we could solve it by solving the Epistemic Blackout (Question 3). We would just say "Your credence in Utilitarianism is too high."
  However, because it is distinct (rooted in intertheoretic comparison), solving the Epistemic Blackout does not solve the Moral Mugger. You can be epistemically humble about physics but still hold a 1% credence in a moral theory.
  **Therefore, Question 2 (Moral-Uncertainty Structure) must be prioritized above Question 3 (Epistemic Priors).** If we fail to resolve the structure of moral value, the epistemic limits on physical probability won't save us from moral fanaticism.

  ***

  # Deprioritization

  To maintain focus, the group must explicitly ignore certain lines of inquiry. I recommend deprioritizing the following two:

  ### 1. Infinite Ethics (The St. Petersburg Paradox in its pure form)
  *   **Why Deprioritize:** This question deals with mathematically infinite utilities and probabilities. While historically significant, real-world fanaticism arises from *large finite* numbers (e.g., $10^{50}$ lives), not actual infinities. Solving the "infinite" case often requires mathematical machinery (transfinite arithmetic) that does not translate well to the finite but extreme cases that actually plague decision theory.
  *   **Downstream Impact:** Low. A solution to infinite utility does not necessarily bound finite utility. You can reject actual infinities while still accepting unbounded finite values, which is where the real fanaticism problem lives. Spending 18 months on infinity is a distraction from the finite tail risks that drive effective altruism and policy debates.

  ### 2. Empirical Calibration of Tail Risks
  *   **Why Deprioritize:** This involves determining the *actual* probability of existential catastrophes or high-impact interventions.
  *   **Downstream Impact:** Low for *this* group. This is an empirical question requiring domain expertise in biotechnology, AI, or macroeconomics, and likely a computational budget for modeling. Philosophers attempting to forecast $P(\text{AI Doom})$ will not be taken seriously by forecasters and will not produce robust philosophical output.
  *   **Trade-off:** The group should focus on the *normative status* of whatever probability is assigned, not the assignment itself. We determine how to *act* given a probability, not what the probability *is*.

  ### Summary of Trade-offs
  This agenda prioritizes **Axiology** over **Epistemology** and **Proceduralism**.
  *   **Risk:** If utility is fundamentally unbounded and incomparability is false, we may spend 18 months proving we *should* be fanatics.
  *   **Mitigation:** This is a feature, not a bug. If the arguments for boundedness fail, the group will have rigorously established that fanaticism is rational, which is a genuine (if uncomfortable) contribution.
  *   **Why this order:** We fix the inputs (Value, then Probability) before we change the processing rule (Decision Theory). Changing the rule is the most disruptive move; we should only do it if the inputs cannot be tamed.
