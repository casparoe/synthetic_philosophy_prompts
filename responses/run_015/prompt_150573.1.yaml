answer: |-
  This is a crucial distinction for your novel. The phrase "perception is controlled hallucination" has migrated from technical neuroscience papers (Karl Friston, Andy Clark) to popular science (Anil Seth) to pop-psychology Instagram captions. In that migration, it has accrued three distinct meanings, ranging from "mechanically accurate" to "metaphysically wild."

  If your plot hinges on whether she is right about perception being "mostly fabrication," you need to know which definition of "fabrication" is in play.

  Here is the disambiguation menu, ranked from scientifically mundane to philosophically explosive, with verdicts on their validity within the Predictive Processing (PP) and Free Energy Principle (FEP) frameworks.

  ---

  ### 1. The Mechanistic Claim (The "Engineer's View")
  **The Claim:** The brain does not passively receive images like a camera. It actively generates a model of the world and updates that model based on sensory errors. What you "see" is the model, not the raw data.
  *   **The Science:** In PP, the brain is a "prediction machine." It sends predictions *down* the sensory hierarchy. Sensory neurons only fire to report the *difference* between the prediction and the input (prediction error). If the prediction is perfect, there is no error signal, and strictly speaking, no "sensory input" reaches higher consciousness.
  *   **FEP/PP Verdict:** **Defensible/True.** This is the baseline architecture of the theory. It is not controversial among proponents.
  *   **The "Fabrication" Level:** Low. The model is tightly constrained by the world. If you punch a wall, the prediction error is massive, and the model updates to "wall is hard."
  *   **Character Usage:** If she means this, she sounds like a textbook. It's accurate but doesn't support a plot about reality being fake. It just means the brain is efficient.

  ### 2. The Phenomenological Claim (The "Consciousness View")
  **The Claim:** The *content* of your conscious experience is constituted entirely by the brain's top-down predictions. Sensory input does not enter consciousness directly; it only *causes* changes in the hallucination. Therefore, you never experience the world; you only experience your brain's simulation of it.
  *   **The Science:** This is Anil Seth's specific usage. He argues that because the qualitative "feel" of red or the shape of a cup is generated by neural activity *before* it is corrected by error signals, the experience itself is a hallucination. It is "controlled" because the world constrains it, but the *stuff* of your experience is internal.
  *   **FEP/PP Verdict:** **Defensible/Strong.** This is the sharp, scientific insight. It distinguishes between the *cause* of perception (world + brain) and the *content* of perception (brain's model).
  *   **The "Fabrication" Level:** Medium-High. It implies we are locked inside our own heads, viewing a user interface, not the code. However, the interface is reliable enough to keep us alive.
  *   **Character Usage:** **This is likely what she means when she is being precise.** It sounds profound ("we never touch the real world") but is grounded in the mechanism of how qualia are generated. It supports a plot where her reliability as a narrator is questioned, but not where reality itself dissolves.

  ### 3. The Metaphysical Claim (The "Simulation/Skeptic View")
  **The Claim:** Because perception is hallucination, there is no access to objective reality. The "control" part is weak; we are trapped in a solipsistic bubble. The external world might not exist, or is irrelevant.
  *   **The Science:** This is a **misinterpretation** of PP/FEP. The Free Energy Principle is fundamentally about *adaptive coupling*. An organism that hallucinates without being controlled by the environment minimizes free energy in the short term (by ignoring error) but dies in the long term (by walking off cliffs). FEP argues that to survive, your model *must* align with the statistical structure of the environment.
  *   **FEP/PP Verdict:** **False.** PP is anti-skeptical. It argues that perception is *for action*. If your hallucination doesn't match the world, you fail to act, and you are selected out. The "hallucination" is a tool for grasping reality, not a barrier to it.
  *   **The "Fabrication" Level:** Extreme. This is the "Kantian vibe" your writing group is leaning into. It treats the "controlled" part as an afterthought.
  *   **Character Usage:** **This is what she means when she is sleep-deprived and sounding profound at a party.** It's the dramatic overreach. It sounds cooler, but a rigorous neuroscientist would know it's technically wrong within the FEP framework.

  ---

  ### The Verdict for Your Plot

  You asked whether she is saying something sharp or repeating a slogan. The answer depends on her state of mind.

  **1. The Sharp Scientist (Sober/Tired but Focused):**
  She means **Version 2 (Phenomenological)**.
  *   **Her Argument:** "I don't see the cup. My brain predicts a cup, and the light hitting my retina just tweaks the prediction. The 'cup' you and I talk about is a shared hallucination that agrees closely enough that we can both pick it up."
  *   **Plot Implication:** Perception is subjective and constructed, but **shared reality exists**. If the plot hinges on her discovering that reality is *actually* broken, this version doesn't help you. It just means our access to it is mediated.

  **2. The Manic Prophet (Sleep-Deprived/Unraveling):**
  She means **Version 3 (Metaphysical)**.
  *   **Her Argument:** "The sensory error signals are just noise. We are painting over the void. The control is an illusion."
  *   **Plot Implication:** This is where the danger lies. In FEP terms, ignoring prediction error is the definition of **psychosis**. If she starts believing the "control" part is optional, she is describing her own descent into schizophrenia, not a feature of normal neuroscience.
  *   **Writing Tip:** This is your goldmine. A neuroscientist who knows that "ignoring prediction error = psychosis" but starts ignoring prediction error herself is a fantastic irony. She is theoretically describing her own breakdown as a philosophical breakthrough.

  ### Addressing the "Mostly Fabrication" Hinge

  You need to know if she is right that perception is *mostly* fabrication.

  *   **According to PP:** Yes, in terms of **bandwidth**. The optic nerve has far fewer fibers than the number of photoreceptors; the brain compresses and reconstructs almost everything. In terms of **content**, yes, the *image* is generated internally.
  *   **According to FEP:** No, in terms of **truth**. The fabrication is not arbitrary. It is a "guided fantasy." If the fabrication deviates too far from the world, the organism incurs "surprise" (free energy) and dies.

  **Recommendation for the Novel:**
  Have her be **right about the mechanism (Version 2)** but **wrong about the implication (Version 3)**.

  Let her insist at the party that "we never touch the real world" (Version 3). Then, have a mentor or rival point out that if that were true, we'd be dead. The "control" in controlled hallucination is the world punching back.

  The tension in your plot shouldn't be "is reality real?" (PP says yes, mostly). The tension should be: **"What happens when the control mechanism breaks?"**

  If she is sleep-deprived, her precision-weighting (the brain's estimate of how much to trust sensory error vs. prior belief) is likely off. She might be trusting her priors (hallucinations) more than her sensory data. She isn't discovering a deep truth about the universe; she is experiencing a localized failure of the Free Energy minimization process. She thinks she's a philosopher-king seeing the Matrix; scientifically, she's a brain failing to update its model.

  **Summary for your notes:**
  *   **Phrase:** "Perception is controlled hallucination."
  *   **Scientific Validity:** High (if "controlled" is emphasized).
  *   **Philosophical Validity:** Low (if used to deny reality).
  *   **Character's Usage:** Likely uses the scientific truth to justify a philosophical falsehood.
  *   **Plot Hook:** Her sleep deprivation is causing her to down-weight sensory evidence, making her "hallucination" less "controlled." She is becoming the psychosis she studies.
