  I'm drafting a novel where one of the protagonists is this sleep-deprived neuroscientist who keeps insisting that 'perception is controlled hallucination,' and I need to know if she's actually saying something sharp or just repeating a conference slogan. I first heard it on a podcast about predicitive processing, then ran into it skimming papers on the free energy principle, and now my writing group uses it for everything — 'your eyes lie,' 'reality is a simulation,' even this weird Kantian vibe like we'll never touch the real world.

  Can you lay out the precise claims hiding inside that one sentence? I want the full menu: the trivial version where the brain just updates predictions with sensory error, the stronger version where conscious experience is generated entirely top-down with zero direct access to the world, and whatever's in between. For each, tell me whether it's defensible within predictive processing and the free energy framework, whether it's false, and which reading my character probably means when she drops it at a party to sound profound. Don't just pick one and explain it — I need the disambiguation with verdicts, because the plot actually hinges on whether she's right about perception being mostly fabrication.
