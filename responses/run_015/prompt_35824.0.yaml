answer: |-
  **Question 1**

  Consider the standard Ellsberg urn containing 90 balls: 30 are known Red, and 60 are unknown Black or Yellow. Let $\theta$ denote the proportion of Black balls among the 60 ambiguous ones. A student claims that an agent exhibiting Ellsberg preferences (strictly preferring bets on Red over Black) can be modeled as an Expected Utility maximizer who assigns a uniform prior to $\theta \in [0,1]$ but evaluates bets using a worst-case rule: $V(f) = \min_{\theta \in [0,1]} E[u(f)|\theta]$. They argue this is simply Expected Utility over a richer state space with a non-degenerate prior. Adjudicate this claim. First, determine if this valuation functional satisfies the Independence Axiom required for Expected Utility. Second, explain whether this model reduces ambiguity aversion to risk aversion over second-order probabilities or represents a distinct preference structure. Third, test for dynamic consistency: if the agent observes a Black ball drawn with replacement, does their ranking of remaining bets change in a way that violates sequential rationality? Be precise about what is preserved and what is sacrificed.

  ***

  **Model Answer**

  The student's claim is fundamentally incorrect because the proposed valuation functional violates the linearity in probabilities required by Expected Utility theory. While the agent possesses a prior distribution over the parameter $\theta$, they do not integrate over it to calculate expected utility. Instead, they apply a non-linear minimization operator over the support of that prior. In standard Subjective Expected Utility (SEU), the value of a mixture of acts must be the mixture of their values. However, the minimum of a sum is not the sum of the minimums. Specifically, $\min_{\theta} E[\alpha f + (1-\alpha)g | \theta] \neq \alpha \min_{\theta} E[f|\theta] + (1-\alpha) \min_{\theta} E[g|\theta]$. Because the functional is concave rather than linear, it violates the Independence Axiom. The student has conflated having a subjective prior with maximizing expectation with respect to that prior. The presence of a prior does not guarantee SEU behavior if the aggregation rule is not integration.

  Regarding the distinction between ambiguity and risk, this model does not reduce ambiguity aversion to risk aversion over second-order probabilities in the standard sense. Models that successfully reduce ambiguity to risk, such as the Smooth Ambiguity Model, maintain the SEU structure by applying a concave transformation to the expected utilities of the second-order distribution. Here, the agent is not averaging over the uncertainty of $\theta$; they are ignoring all scenarios except the worst one. This is not risk aversion over a known distribution of probabilities; it is a refusal to treat the prior as probabilistic information to be averaged. It represents a distinct preference structure often labeled as MaxMin Expected Utility, which explicitly separates the belief (the set of priors) from the attitude toward ambiguity (the minimization rule).

  Finally, this model generally fails dynamic consistency under full Bayesian updating. Suppose the agent plans ex-ante to reject a bet on Black because the worst-case $\theta$ is 0, yielding zero expected utility. If the agent then observes a Black ball drawn with replacement, the likelihood of $\theta=0$ becomes zero. Under Bayesian updating of the prior set, the parameter value $\theta=0$ is eliminated from the support. The new worst-case $\theta$ shifts strictly positive, causing the evaluated utility of betting on Black to jump discontinuously. An agent who ex-ante planned to avoid the bet might now ex-post prefer to take it. This preference reversal violates dynamic consistency, as the agent's future self would not follow the plan made by their past self. To restore consistency, the agent would need to use non-Bayesian updating rules, such as maximum likelihood updating, which sacrifices coherence in belief revision. Thus, the model captures Ellsberg behavior only by sacrificing Independence and dynamic consistency.

  ***

  **Marking Scheme**

  **Identification of Independence Axiom Violation (5 points).** Full credit requires the student to explicitly state that the minimization operator is non-linear and therefore violates the Independence Axiom. They must note that SEU requires linearity in probabilities, whereas the min function is concave. Students typically screw this up by arguing that the model is valid EU because a prior exists, failing to distinguish between having a belief and maximizing expectation with respect to it.

  **Distinction Between Integration and Minimization (5 points).** The student must explain that SEU requires integrating over the prior distribution, whereas the proposed model minimizes over the prior's support. They should clarify that if the agent integrated the uniform prior, they would be indifferent between Red and Black, contradicting the Ellsberg preference. Students typically screw this up by conflating the set of priors with a single compound lottery, assuming that any probabilistic description of uncertainty implies SEU maximization.

  **Ambiguity Versus Second-Order Risk (5 points).** Credit is awarded for recognizing that this model represents a distinct preference structure (MaxMin) rather than standard risk aversion over second-order probabilities. The answer should note that smooth ambiguity models preserve EU structure via transformation, while this model breaks it via the min operator. Students typically screw this up by hand-waving that all ambiguity aversion is just extreme risk aversion, missing the structural difference in the functional form.

  **Dynamic Consistency Analysis (5 points).** The student must provide a concrete example of how observing a Black ball eliminates the worst-case parameter $\theta=0$, causing a preference reversal that violates sequential rationality. They need to show the mechanism of the inconsistency, not just assert it. Students typically screw this up by stating the model is dynamically inconsistent without providing the specific updating argument regarding the shift in the worst-case scenario.
