  I'm mapping my commitments for a seminar paper on Moore and want to check if they hang together. Here's where I'm at:
  - I think beauty is an intrinsic, non-natural property, like Moore said—something you grasp in an organic whole.
  - I think friendship is the same kind of thing: an intrinsic good, not reducible to pleasure or companionship.
  - Because it's an organic unity, I figure adding more friendship always boosts total value, no matter the context.
  - Still, I mainly think friendship is worth it because it calm's me down and feels good; without that I'd drop it.
  - I trust direct intuition to tell me friendship is genuinely valuable.
  - But evolutionary psych debunks that—friendship is just kin selection and reciprocity, so our "intrinsic value" feeling is adaptive noise.
  - I accept the naturalistic fallacy, so "evolved for" doesn't equal "good," but I still think evolutionary stories weaken confidence in intuition.

  Can you audit this? Which pairs actually conflict, which just look bad but dissolve, and rank the real ones by severity with the cheapest fix? Also, if I can only revise one commitment to clean up the worst mess, which should go? No long lecture on Principia Ethica—just trace what I'm committed to.
