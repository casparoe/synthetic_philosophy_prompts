answer: |-
  ### Menu of Readings: "There Are No Atheists in Foxholes"

  **1. The Crisis Piety Reading:** Under acute existential threat, self-reported belief and prayer frequency increase, even among the previously non-religious.
  *   **Verdict:** Trivial-but-true.
  *   **Analysis:** This is empirically settled; survey data during disasters and wars consistently shows spikes in religious behavior. However, this is *Crisis Piety*, not *Crisis Morality*. It supports the "fair-weather" claim only if you assume prayer substitutes for social trust. It is compatible with robust secular trust if the prayer is private coping that leaves public cooperation intact. This reading conflates *thick trust* (comfort in community) with *thin trust* (reliance on strangers/institutions); the data shows piety rises, but not necessarily that secular institutions fail.

  **2. The Latent Theism Reading:** Threat strips away social pretense, revealing that professed atheists were theists "deep down" all along.
  *   **Verdict:** Likely False / Theological Assertion.
  *   **Analysis:** This is a theological claim masquerading as psychology. It is contested by cognitive science of religion, which shows stable non-belief is possible. If true, it undermines secular identity but does not prove secular *trust* fails; a latent theist might still cooperate on secular terms. This reading relies on self-report interpretation rather than behavioral data. It is extrapolation past what anyone really knows about the stability of identity.

  **3. The Unique Coping Reading:** Religion provides psychological stabilization under threat that secular frameworks cannot replicate, preventing panic or social fracture.
  *   **Verdict:** Plausible but Contested.
  *   **Analysis:** Religion is a known coping mechanism, but secular resilience (nationalism, scientific confidence, humanism) also functions under mortality salience (Terror Management Theory). The dispute is whether secular coping is *sufficient* for social order. This supports the "borrowed capital" claim only if secular coping mechanisms are proven to deplete faster than religious ones. Current evidence suggests secular societies manage collective trauma without mass religious reversion, making the "indispensable" claim an extrapolation.

  **4. The Supernatural Policing Reading:** Prosocial behavior toward strangers (*thin trust*) requires belief in moralizing gods to sustain under stress, as secular norms lack enforcement.
  *   **Verdict:** Genuinely Contested / Leaning False.
  *   **Analysis:** This is the core "borrowed capital" argument. It posits *Crisis Morality* depends on supernatural monitoring. Disaster sociology generally contradicts this, showing prosocial behavior often *increases* in secular populations during crises (the "panic myth" is largely debunked). This reading conflates *thick trust* (religious in-groups) with *thin trust* (societal). If false, secular trust is robust; if true, secular societies are indeed fragile. This is a live dispute between evolutionary religious studies and secular sociology.

  **5. The Cultural Lag Reading:** Secular high-trust societies are not self-sustaining but are running on normative inertia (habits/institutions) generated by a religious past, which will decay over generations.
  *   **Verdict:** Live Dispute / Unfalsifiable Long-Term Extrapolation.
  *   **Analysis:** This is the strongest version of the "fair-weather" claim. It argues current stability is historical residue, not current equilibrium. It is impossible to settle with cross-sectional data (like current Nordic stats) because it is a claim about future decay. It assumes *thin trust* is a non-renewable resource without religion. This is the specific thesis required to validate the "borrowed capital" conclusion. It remains extrapolation because no fully secular society has existed long enough to test the multi-generational limit.

  ***

  ### The Single Piece of Evidence
  To change the verdict on **Reading 5 (The Cultural Lag Reading)**, I would need longitudinal data tracking *thin trust* metrics (e.g., willingness to return a lost wallet, compliance with non-enforced civic duties, generalized social trust surveys) in a highly secularized society over a period of sustained, multi-generational existential stress (e.g., 50+ years of low fertility, high migration, or climate threat) without a corresponding rise in religious belief. If *thin trust* remains stable or increases across three generations of declining religiosity under stress, the "borrowed capital" hypothesis is falsified; if it decays linearly with religious attendance, the hypothesis is supported. Currently, we only have short-term crisis data (pandemics, wars), which is insufficient to test generational capital depletion.
