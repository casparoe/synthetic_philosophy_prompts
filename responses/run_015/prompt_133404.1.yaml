  I'm taking a philosophy of language course and my roommate just asked me whether I'd lie if someone broke in and asked where they were hiding. I said probably yes, then tried to defend Kant's murderer-at-the-door view and now I'm stuck in this argument that feels like it eats itself. You are an expert philosopher on Kant and practical reason, so please think carefully and start by brainstorming the logical structure before you answer. Here is the chain: (1) Kant says lying is always wrong, even to save a life, because the maxim "lie when it benefits me" can't be universalized—if everyone did it, promises and assertions would collapse. (2) In the murderer case we imagine universalizing "lie to save an innocent life": every rational being lies in that circumstance. (3) But then the murderer knows this maxim is in force, so he knows you're lying, and the lie doesn't save anyone—contradiction in conception. (4) Now apply the same universalization form to "tell the truth to save an innocent life." (5) Universalize that: everyone tells the truth in that circumstance. (6) The murderer knows this too, so he goes straight to the hiding spot and kills the victim—so truthful speech also undermines its own saving-purpose. (7) So if universalization is the real test, both lying and telling the truth fail in exactly the same way. (8) But Kant clearly wants to allow one and forbid the other. (9) The only escape is to say that truth-telling isn't governed by a conditional maxim but by a perfect duty that holds regardless of outcome, but then the universalization argument in (1)-(3) was never about outcomes either, it was about consistency of willing. (10) So either Kant's reasoning applies symmetrically and wipes out every communicative strategy—including silence, misdirection, or speaking in code—or there's a hidden asymmetry between lying and truth-telling that the argument hasn't shown. (11) And if every strategy is wiped out, then Kant doesn't just forbid lying; he makes it impossible to respond to the murderer at all, which proves way too much. I feel like there's a modal slide or scope shift between (5) and (6) but I cant name it. Which step do you reject, and what does rejecting it cost? I'd really like to keep (1) and (8) if possible, but I want to know what I'm paying.
