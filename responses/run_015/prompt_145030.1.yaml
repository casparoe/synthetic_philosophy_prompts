answer: |-
  ### Advisory Memorandum: Research Priorities for Lexical Threshold Negative Utilitarianism (LTNU)

  **To:** Fund Director
  **From:** Research Advisor
  **Subject:** Prioritization of Research Questions (4-Year Horizon)

  This memorandum outlines a research agenda for five researchers over four years. The goal is to determine whether LTNU mandates redirecting resources from standard human welfare to extreme suffering alleviation. Given the constraints—specifically the **Threshold Placement Problem** (no trade-off elicitation) and the **Uptake Asymmetry** (resistance to suffering-focused arguments)—the following criteria drive the prioritization.

  #### I. Evaluation Criteria

  To rank the questions, I have applied four weighted criteria. Conflicts between them are noted below.

  1.  **Allocation Impact (Weight: High):** Does the answer directly determine whether funds are redirected? If the answer leaves the "redirect vs. status quo" decision unchanged, the question is lower priority.
  2.  **Philosophical Tractability (Weight: Medium-High):** Can progress be made by philosophers with limited empirical bridge-work? Questions requiring novel neuroscience or large-scale data collection are deprioritized in favor of conceptual analysis and literature synthesis.
  3.  **Upstreamness (Weight: High):** Is this question a prerequisite for others? Foundational conceptual work must precede applied allocation work.
  4.  **Contingent Value (Weight: Medium):** How much does the value of the answer depend on actors actually using it? This addresses the Uptake Asymmetry. If a truth is action-guiding in theory but ignored in practice, its value is contingent on solving the uptake problem.

  **Criterion Conflicts:**
  *   *Upstreamness vs. Allocation Impact:* Foundational conceptual work (High Upstreamness) often feels abstract and does not immediately change check-writing (Low Allocation Impact). However, without it, applied work rests on false premises.
  *   *Tractability vs. Contingent Value:* Solving the Uptake Asymmetry (High Contingent Value) requires social science and psychology, which lowers Philosophical Tractability. We must limit this to conceptual analysis of *why* resistance occurs, rather than running behavioral trials.

  ---

  #### II. Prioritized Research Questions

  **1. The Phenomenological Ceiling: What are the conceptual and empirical upper bounds of suffering?**
  *   **Description:** Address the Threshold Placement Problem directly. Since we cannot use trade-offs, we must define the "worst possible experience" to anchor the threshold. This involves analyzing first-person reports of extreme suffering (e.g., torture, cluster headaches, childbirth complications) to determine if there is a finite ceiling to disvalue or if it is unbounded.
  *   **Reasoning:** This is the most **Upstream** question. If suffering has no upper bound, or if the "worst" is conceptually incoherent, the lexical threshold cannot be placed. It is **Tractable** for philosophers analyzing phenomenology and existing qualitative data.
  *   **Criteria Trade-off:** Low immediate **Allocation Impact** (knowing the ceiling doesn't tell us where to give yet), but essential for validity.

  **2. Decision Theory under Threshold Uncertainty: How should LTNU agents act when the threshold's location is empirically fuzzy?**
  *   **Description:** Even if we define the ceiling, locating the specific threshold line will likely involve uncertainty. This question asks whether LTNU requires a "precautionary principle" (act as if common severe pains cross the threshold) or "conservatism" (act only when certain).
  *   **Reasoning:** High **Allocation Impact**. A precautionary approach might redirect funds broadly; a conservative approach might redirect almost nothing. It is highly **Tractable** for philosophers (decision theory/epistemology).
  *   **Criteria Trade-off:** High **Upstreamness** for Question 3. You cannot map causes to the threshold if you don't know how to handle uncertainty about the threshold.

  **3. Prevalence Mapping: Which current cause areas contain high-probability threshold-crossing events?**
  *   **Description:** Bridge work. Synthesize existing empirical literature on global health, mental health, and animal welfare to identify conditions that plausibly meet the "Phenomenological Ceiling" criteria established in Q1.
  *   **Reasoning:** High **Allocation Impact**. This is the direct "redirect" test. If standard global health (e.g., bednets) prevents death but not threshold-suffering, and mental health prevents threshold-suffering, funds move.
  *   **Criteria Trade-off:** Lower **Tractability** (requires empirical synthesis), but necessary for **Contingent Value**. A philosophical truth about suffering is useless if we don't know where it exists.

  **4. The Etiology of Resistance: Is the Uptake Asymmetry driven by cognitive bias, moral disagreement, or framing?**
  *   **Description:** Diagnose the Uptake Asymmetry. Is the resistance to suffering-focused arguments due to deep moral disagreement (people reject lexicality), cognitive availability (harder to imagine suffering than happiness), or poor communication?
  *   **Reasoning:** High **Contingent Value**. If the asymmetry is due to deep moral disagreement, persuasion is futile. If it is framing, persuasion is viable. This is **Tractable** via philosophical analysis of existing public discourse and moral psychology literature.
  *   **Criteria Trade-off:** Low **Upstreamness** (doesn't change the truth of LTNU), but high **Allocation Impact** for the *fund's strategy* (do we spend on advocacy or direct aid?).

  **5. Normative Framing for Lexical Priorities: Can LTNU be communicated without triggering defensive reactance?**
  *   **Description:** Develop conceptual frameworks that convey lexical priority without appearing nihilistic or demanding. Test (conceptually) whether framing suffering alleviation as "protecting agency" or "preventing rights violations" increases uptake compared to "minimizing disvalue."
  *   **Reasoning:** High **Contingent Value**. This is the intervention based on Q4.
  *   **Criteria Trade-off:** Lowest **Tractability** for pure philosophers (edges into marketing/psych), so it is last. It depends entirely on Q4's diagnosis.

  ---

  #### III. Argument on Uptake Asymmetry vs. Threshold Placement

  **Recommendation:** Do **not** treat the Uptake Asymmetry as a reason to fund persuasion *instead* of threshold placement. Fund placement first, persuasion second.

  **Reasoning:**
  1.  **Truth-Conditions Precede Advocacy:** The mandate is to determine *whether* the view should redirect giving. If the Threshold Placement research (Q1 & Q2) reveals that the lexical threshold is so high that no actual human experience crosses it (e.g., only "hell" counts, and hell doesn't exist), then LTNU collapses into a view that permits standard welfare trade-offs. In this scenario, funding persuasion is wasteful because the view *does not demand redirection*. Persuasion is only valuable if the threshold is low enough to matter.
  2.  **Credibility Constraint:** Advocating for a radical reallocation of resources based on a threshold that has not been rigorously defined invites justified skepticism. If the fund advocates for redirecting money based on LTNU, but cannot define the threshold without relying on forbidden trade-off elicitation, the argument will fail on credibility grounds, worsening the Uptake Asymmetry.
  3.  **Diagnostic Necessity:** The Uptake Asymmetry is a "Given Complication," but its cause is unknown. Funding persuasion (Q5) before diagnosing the resistance (Q4) is shooting in the dark. If the asymmetry is caused by the *counter-intuitiveness of lexicality itself*, no amount of framing will fix it. We must know *what* we are persuading people of (the threshold) before we know *how* to persuade them.

  **Conclusion:** The Uptake Asymmetry justifies funding *diagnostics* (Q4) early, but not *persuasion* (Q5) at the expense of *placement* (Q1). Placement determines if there is a product to sell; Uptake determines if it can be sold. You cannot sell a product you haven't defined.

  ---

  #### IV. Evidence Triggers for Reprioritization

  Over the next two years, the following evidence would shift the priority order:

  *   **Move Q1 (Placement) Down / Q3 (Prevalence) Up:** If preliminary literature review shows strong philosophical consensus that "lexical thresholds" are incoherent *unless* tied to trade-off rates. This would undermine the Director's core constraint, forcing us to abandon the LTNU mandate or pivot to empirical elicitation despite the constraint.
  *   **Move Q3 (Prevalence) Up:** If initial phenomenological work suggests the threshold is low (e.g., severe depression clearly crosses it). This makes the "redirect" decision urgent, increasing **Allocation Impact**.
  *   **Move Q4 (Etiology) Up:** If early engagement with donors shows that rejection of LTNU is driven by a specific, correctable misunderstanding (e.g., confusing NU with nihilism) rather than deep moral disagreement. This increases the **Tractability** of solving Uptake.
  *   **Move Q5 (Framing) Down:** If Q4 reveals the Uptake Asymmetry is driven by stable moral intuitions (e.g., people fundamentally value happiness creation over suffering prevention). This lowers the **Contingent Value** of framing work, suggesting the fund should focus on direct giving rather than advocacy.

  **Summary:** The fund must first ensure the view is coherent and action-guiding (Q1, Q2), then determine if the world contains the relevant moral facts (Q3), and only then determine if the world cares about those facts (Q4, Q5). Prioritizing persuasion before placement risks advocating for a redirection that the theory itself may not support.
