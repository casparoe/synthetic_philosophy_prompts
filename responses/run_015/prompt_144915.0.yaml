  Term (b) is weakest because it fundamentally assumes pictorial communication necessitates naturalistic resemblance. A clear conceptual move redefining property-tracking as tracking behavioral regularities rather than sensory qualities would significantly raise this probability. If ethical icons map onto recurrent physical interactions within social systems instead of abstract values, they gain physicalist anchors without metaphysical realism. This shifts the primary burden from perceptual universality to sociological uniformity, allowing conventional symbols to stabilize via robust human social structures rather than biological innate visual recognition mechanisms alone.

