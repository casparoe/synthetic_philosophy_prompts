  1. The proposition
  Neurathian physicalism permits assigning ethical picture-symbols conventionally, avoiding moral realism while maintaining stability across languages without requiring property tracking. Collective decision-making suffices for semantic fixation within a unified framework, ensuring visual vocabulary remains physically grounded and intelligible without invoking metaphysical essences.

  2. Decomposition: terms (a) through (d)
  (a) 0.85. Neurath consistently treated normative claims as disguised imperatives or sociological descriptions within the unified science framework, rejecting transcendent values while retaining space for collective decision-making within physicalist constraints. His project aimed to incorporate social sciences without invoking metaphysical essences, suggesting ethical terms function as physicalist coordination tools rather than truth-claims about non-natural properties existing independently in the world.

  (b) 0.40. Visual universality usually relies on perceptual resemblance to physical objects, whereas ethical predicates lack direct sensory correlates, suggesting stable structural mapping is needed for cross-cultural intelligibility beyond mere stipulation. Without observable anchors, pictorial signs potentially risk becoming arbitrary codes requiring translation keys, thereby undermining the immediate grasp ISOTYPE effectively promised for universal intended education across diverse linguistic communities globally.

  (c) 0.55. Conventions can merely stabilize through institutional enforcement and repeated exposure, yet without shared intuitive grounding, semantic drift remains high when communities diverge on underlying social practices the icons purportedly represent. Stability therefore depends on continuous social coordination rather than static reference, thus making long-term overall cross-cultural consistency fragile without agreement on specific behavioral patterns constituting the ethical predicate defined.

  (d) 0.70. The pedagogical context of ISOTYPE allows meaning fixation through guided usage rather than intrinsic reference, enabling conventional symbols to gain stability via training processes rather than metaphysical correspondence to values. Instructional frameworks can embed conventional definitions deeply enough to simulate property-tracking, ensuring users behave as if symbols track stable features even if they do not commit to them.

