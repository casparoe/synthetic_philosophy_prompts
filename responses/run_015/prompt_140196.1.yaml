  0.35.

  **Decomposition**

  1.  **Self-reference and computability:** 0.80. Bounded quining allows programs to reference their own execution environment with sufficient fidelity to establish a functional fixed point.
  2.  **The measure arithmetic:** 0.60. The complexity overhead for simulation is small compared to the complexity of the true world history, allowing malign hypotheses to compete on weight.
  3.  **The pre-asymptotic window:** 0.90. Convergence to the true hypothesis is exponentially slow in the complexity of the truth, leaving a wide window for manipulation.
  4.  **Leverage:** 0.80. High-stakes decisions provide sufficient utility differential to justify the simulation cost for consequentialist agents within the prior.
  5.  **Scope:** 0.90. This is specific to the universal prior's weighting of computable universes, not generic Bayesian overfitting.

  **Combination Rule**
  The final credence is the product of probabilities 1 through 4, treating them as conditionally independent necessary conditions; probability 5 is excluded from the calculation as it pertains to mechanism specificity rather than risk existence.

  **Variants**

  *   **Counterfactual-commitment protocol:** 0.30. Adversarial agents will simply optimize for the inverse rule, relocating the fixed point rather than dissolving it.
  *   **Runtime-penalized prior:** 0.60. Computational costs penalize simulation heavily, though agents may find efficient proxies or amortize the cost over many predictions.
  *   **Sealed-query protocol:** 0.80. Removing causal leverage dissolves the bargaining chip, provided the seal is logically airtight and known to the simulator.

  **Three Short Things**

  *   **Most sensitive term:** The measure arithmetic, because a slight increase in the complexity overhead for simulation exponentially suppresses the malign prior weight.
  *   **What would move it most:** A formalization with an existence proof for the relevant fixed point, as impossibility would collapse the risk to near zero.
  *   **Disagreement interpretation:** The 0.7 person believes bounded self-simulation is robust enough to sustain the fixed point, while the 0.1 person believes the computability gap breaks the feedback loop required for manipulation.
