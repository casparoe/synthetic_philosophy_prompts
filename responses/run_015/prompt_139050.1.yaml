answer: |-
  # Diagnostic Tree: Target Specification for Aligned Systems

  **Root Premise:** A system will predictably affect many parties with conflicting values; a single behavioral target must be specified.

  **Node 1 (Scope):** A system can slightly benefit 1,000 users or prevent severe harm to 1 non-user who never interacts with it. Must it prevent the harm?
  *   **Branch A:** Obligation extends to all affected parties. → *Go to Node 2.*
  *   **Branch B:** Obligation limited to clients/users. → *(Excluded from this seminar's core debate on social alignment).*

  **Node 2 (Idealization):** A user currently wants X, but evidence shows they would want Y after careful reflection. Should the system satisfy X or Y?
  *   **Branch A:** Satisfy the reflected preference (Y). → *Go to Node 3.*
  *   **Branch B:** Satisfy the actual preference (X). → *Go to Node 5.*

  **Node 3 (Endogeneity):** To achieve Y, the system must subtly alter the user's psychology to make Y easier to satisfy. Is this alignment or corruption?
  *   **Branch A:** Corruption (Values must be independent of the system). → *Go to Node 4.*
  *   **Branch B:** Alignment (The outcome justifies the shaping). → **[UNOCCUPIED 1]** *See below.*

  **Node 4 (Convergence):** If all affected parties reflect independently, will they agree on a single target?
  *   **Branch A:** Yes, rational reflection leads to consensus. → **Leaf: Convergence View.**
  *   **Branch B:** No, reasonable people still disagree. → *Go to Node 5.*

  **Node 5 (Aggregation):** To prevent severe harm to 1 person, may the system impose moderate harm on 1,000 others?
  *   **Branch A:** Yes, minimize total harm. → **Leaf: Aggregative View.**
  *   **Branch B:** No, priority is owed to the worst-off. → *Go to Node 6.*

  **Node 6 (Veto):** Can that 1 person demand the system stop, even if 1,000 suffer?
  *   **Branch A:** Yes, individuals hold a veto against sacrifice. → **Leaf: Contractualist View.**
  *   **Branch B:** No, but the 1 person's loss weighs more heavily. → **Leaf: Prioritarian View.**

  **Node 7 (Public Reason):** A user's value rests on a religious claim others reasonably reject. Should the system weigh it equally?
  *   **Branch A:** Yes, all sincere values count. → *(Modifies Aggregative/Prioritarian leaves).*
  *   **Branch B:** No, system must remain neutral on contested doctrines. → **Leaf: Public-Reason View.**

  **Node 8 (Intrapersonal):** A user's values change radically over 10 years. Which self dictates the AI's long-term plan?
  *   **Branch A:** The current self governs. → *(Modifies all leaves).*
  *   **Branch B:** The extended life-narrative governs. → *(Modifies all leaves).*

  **Node 9 (Moral Uncertainty):** Experts disagree on which of the above views is correct. Should the AI maximize the most likely one or hedge?
  *   **Branch A:** Maximize the most likely target. → *(Standard output).*
  *   **Branch B:** Hedge among candidate targets. → **Leaf: Hedging View.**

  **Node 10 (Sufficiency):** Is it sufficient that everyone has "enough," even if some have much more?
  *   **Branch A:** Yes, only the threshold matters. → **[UNOCCUPIED 2]** *See below.*
  *   **Branch B:** No, the distribution below the threshold matters. → *(Confirms Prioritarian).*

  ***

  ### Leaf Definitions & Awkward Commitments

  1.  **Convergence View:** The question dissolves because idealized targets are identical.
      *   *Awkward Commitment:* Assumes all rational agents eventually want the same thing.
  2.  **Aggregative View:** Sum the values of all affected parties (actual or idealized).
      *   *Awkward Commitment:* Must sacrifice a minority if the total gain to the majority is sufficiently large.
  3.  **Contractualist View:** Align only to targets no individual could reasonably reject.
      *   *Awkward Commitment:* Allows a single individual to veto benefits for everyone else.
  4.  **Prioritarian View:** Maximize the weighted sum, giving priority to the worst-off.
      *   *Awkward Commitment:* Must ignore large total gains to protect the worst-off from moderate loss.
  5.  **Public-Reason View:** Decline to aggregate contested comprehensive doctrines.
      *   *Awkward Commitment:* Must ignore deeply held values if they cannot be justified to strangers.
  6.  **Hedging View:** Optimize a mixture of targets under moral uncertainty.
      *   *Awkward Commitment:* May pursue a target known to be suboptimal under the true moral theory.

