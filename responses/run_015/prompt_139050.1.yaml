  ### Diagnostic Notes

  **[UNOCCUPIED 1] (Node 3, Branch B):** *Idealized Values + System Shaping.*
  *   **Status:** Incoherent.
  *   **Why:** Idealization requires values to form under independent reflection; system-induced shaping violates the independence condition required for the idealization to count as *theirs*.

  **[UNOCCUPIED 2] (Node 10, Branch A + Node 6, Branch B):** *Sufficiency + No Veto.*
  *   **Status:** Unexplored/Unstable.
  *   **Why:** If you care only about thresholds (Sufficiency) but deny a veto (No Veto), you risk permitting severe harm to those just above the threshold to benefit those just below it, which contradicts the intuition behind sufficiency.

  **Indistinguishable Leaves:**
  *   **Pair:** Prioritarian View vs. Sufficiency View (if Node 10 were fully integrated).
  *   **Why:** Both reject pure aggregation (Node 5, Branch B).
  *   **Separating Case:** "To raise 1,000 people from 'barely enough' to 'plenty', may we drop 1 person from 'plenty' to 'barely enough'?" (Prioritarian says No; Sufficiency says Yes).
