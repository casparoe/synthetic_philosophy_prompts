answer: |-
  Here is the honest breakdown of the concept you are grappling with, the terminology that exists, and where the philosophical boundaries lie.

  ### 1. The Established Term: Agent-Relative Obligation

  There is no single, catchy noun phrase (like "The Paramedic Effect") that specifically names the *phenomenon of the line moving*. However, the underlying ethical structure that makes this movement possible has a precise, established name in meta-ethics: **Agent-Relative Obligation** (sometimes called **Agent-Centered Duty**).

  This is distinct from, though deeply related to, "Role Obligations." Here is the distinction you were sensing:

  *   **Role Obligations** describe the *source* of the duty (e.g., "I am a doctor," "I am a parent").
  *   **Agent-Relative Obligations** describe the *logical structure* of the duty (e.g., "This rule applies to *me* specifically, not to everyone equally").

  Your intuition that "Role Obligation" didn't quite capture it is correct. "Role Obligation" tells you *why* the paramedic is bound, but it doesn't technically describe the *contrast* between the paramedic and the passerby. **Agent-Relativity** is the term that captures the fact that the moral status of an act is indexed to the identity of the agent.

  In an **Agent-Neutral** framework (like classical Utilitarianism), the act "save the life" has a fixed value. If it is good, everyone ought to do it. If it is optional, it is optional for everyone. The line does not move.
  In an **Agent-Relative** framework (like Deontology or Virtue Ethics), the reason for acting includes a reference to the agent ("*My* patient," "*My* child"). Therefore, the deontic status (obligatory vs. supererogatory) *must* move depending on who is acting.

  ### 2. Why There Isn't a Specific Name for the "Shift"

  You asked for a term for the configuration where *Act X is Obligatory for Agent A but Supererogatory for Agent B*. While this is a standard textbook example of Agent-Relativity, there is **no established single term** for this specific divergence.

  Philosophers usually describe this descriptively: "The agent-relativity of duty," "The variability of deontic status," or "The distinction between special and general duties."

  Since you asked me to coin a term *if* one doesn't exist, rather than force-fitting: I will not coin a new technical term because "Agent-Relative Obligation" is the precise tool used to analyze this. Coining a new term (like "Deontic Divergence") would risk isolating you from the existing literature. However, to validate your insight, I will offer a descriptive label that you can use to track this specific phenomenon in your notes:

  **Proposed Descriptive Label:** **Deontic Indexicality**
  *   **Definition:** The property of a moral act whose obligatory status changes based on the "index" of the agent performing it (similar to how the word "I" refers to different people depending on who says it).
  *   **Status:** *Not* standard terminology. This is a descriptive coinage for your use to capture the "moving line" feeling.
  *   **Edge Cases:** This applies only when the *act token* is identical (throwing on a grenade) but the *moral valence* shifts. It does not apply when the acts are different (a parent feeding a child vs. a stranger buying groceries).

  ### 3. Addressing Your Nuances

  **Does it matter if the role was freely chosen (Paramedic) vs. born into (Parent)?**
  *   **Philosophically:** Yes, this is a major fault line.
  *   **Consent-Based View:** If you believe obligations stem from consent (Social Contract theory), the paramedic's duty is stronger or clearer because they signed up for it. The parent's duty is harder to justify (you didn't consent to be born to these parents, nor they to you).
  *   **Natural Duty View:** If you believe obligations stem from natural relations (Virtue Ethics, some Deontology), the distinction collapses. The duty exists because of the *relationship*, not the contract.
  *   **The "Moving Line":** The line moves in *both* cases. Whether you chose the role or not, the passerby/stranger is not obligated. So, for your specific question about the *shift*, the origin of the role doesn't stop the shift from happening, but it does change *why* we think the shift is justified.

  **Does it survive when the obligation is professional/contractual rather than moral?**
  *   **The Problem:** This is the "Normativity Question." Is a paramedic's duty to treat *moral* or just *institutional*?
  *   **The Standard View:** Most ethicists argue professional duties *become* moral duties via the principle of **Fidelity** (promise-keeping) and **Reliance** (the public trusts you). If a paramedic walks away, they aren't just breaking a contract; they are violating a moral trust.
  *   **The Edge Case:** If the obligation is *purely* contractual with no moral underpinning (e.g., a clown hired for a party), walking away is a breach of contract, but perhaps not a *moral* failing in the same sense. However, in life-and-death cases (paramedic, soldier), the consensus is that the professional role creates a genuine moral obligation that overrides the general supererogatory status.

  ### 4. Confidence and Weaknesses

  **Confidence Level:**
  *   **High:** That **Agent-Relative Obligation** is the correct meta-ethical category for this phenomenon.
  *   **High:** That there is **no specific canonical noun** for the "shifting line" itself.
  *   **Moderate:** On the resolution of the "Professional vs. Moral" debate (this is genuinely contested in applied ethics).

  **Where My Reasoning Could Go Wrong:**
  1.  **Consequentialist Rejection:** A strict Act Utilitarian would tell you your entire premise is false. They would argue the paramedic and the passerby have the *exact same obligation* to maximize good. If the paramedic has more training, they have a *stronger* obligation, but the passerby is still obligated to help. In this framework, the "line" doesn't move; our *perception* of it does. If your course leans heavily Utilitarian, my answer might seem like I'm validating a distinction they reject.
  2.  **The Definition of Supererogation:** Some philosophers (like Kantians) are skeptical of supererogation entirely. They might argue that if an act is morally good, it is a duty. If it's not a duty, it's morally neutral. If your course adopts a "No Supererogation" stance, the "shift" you see is actually a shift from "Duty" to "Permissible," not "Duty" to "Praiseworthy."
  3.  **Legal vs. Moral:** In some jurisdictions (like France or Germany), the passerby *is* legally obligated to rescue (Bad Samaritan laws). If your course conflates legal and moral obligation, the "passerby" example might be factually incorrect in certain frameworks.

  ### Summary for Your Coursework
  If you want to sound precise in your essays:
  1.  Identify the phenomenon as a consequence of **Agent-Relative Obligations**.
  2.  Contrast this with **Agent-Neutral** frameworks where the line would not move.
  3.  Acknowledge that while **Role Obligations** are the *source*, Agent-Relativity is the *mechanism*.
  4.  If you want to use the coined term **Deontic Indexicality**, define it clearly in a footnote as a descriptive term for the variability of deontic status across agents, to show you understand the nuance without claiming it's standard jargon.

  This approach respects the existing literature while honoring the specific insight you've developed about the "moving line."
