answer: |-
  Reject **Step (5)**.

  **The Cost:** Rejecting (5) costs you the idea that explanation is a metaphysical mirror of causal history. You must accept that explanation is inherently pragmatic, interest-relative, and selective. An adequate explanation is not a complete causal map; it is a tool for answering specific "why" questions by highlighting dependencies that are stable, manipulable, or relevant to the agent's interests. You abandon the hope of a "God's-eye view" history where every difference-maker is listed, acknowledging that such a list would not be an explanation but a data dump.

  **Adjudication 1: Grain-Relativity**
  The grain-relativity of replay-robustness is a **distraction** regarding the *possibility* of explanation, though it is load-bearing for the *intuition* of fragility. The argument relies on the fact that as the description of $H$ gets finer, robustness drops. However, the fatal error is not that robustness drops, but that Step (5) assumes explanation must track the robustness of the *finest* true description of $H$. Historians do not explain "the exact trajectory of every soldier"; they explain "the loss of the battle." By coarse-graining $H$ (e.g., "Kingdom Lost" rather than "Kingdom Lost at 4:02 PM"), replay-robustness increases significantly even in chaotic systems. The problem isn't the chaos; it's the demand that explanation must account for the fine-grained fragility of the actual outcome rather than the coarse-grained stability of the *type* of outcome we care about.

  **Adjudication 2: Proving Too Much**
  Yes, the argument proves too much. Even in a deterministic, non-chaotic (linear) system, if you describe $H$ finely enough (e.g., the exact position of every particle), any prior perturbation alters $H$. If Step (7) followed from this, no explanation in classical physics would be adequate either. This confirms that the fault lies in **Step (5)**'s standard of adequacy. It demonstrates that "adequacy" cannot be defined as "accounting for all difference-makers relative to a fine-grained $H$." Since we accept that physics explains things, we must reject the notion that explanation requires causal completeness at the micro-level. This reinforces that explanation is about selecting *relevant* dependencies, not tracking every physical perturbation.

  **Adjudication 3: Difference-Making and Grain**
  Giving up (5) does **not** force us to abandon difference-making accounts of causation; it forces us to **relativize** them to a grain of stability and depth. We are entitled to the grain we choose based on **invariance**. A causal relationship is explanatory to the degree that it holds across a range of background conditions (it is robust to interventions on other variables).
  *   **What happens to the nail?** The nail remains a *cause* (it satisfies the counterfactual test in Step 3). However, it is a *shallow* cause. The relationship "No Nail $\to$ Lost Kingdom" is not invariant; in many nearby possible worlds (e.g., the horse is shod differently, the messenger walks), the nail changes but the kingdom is lost anyway due to broader strategic failures.
  *   **What happens to the General?** The relationship "Bad Strategy $\to$ Lost Kingdom" is deeper. It holds across a wider range of variations (including worlds where the nail holds).
  *   **Legitimate Grains:** If someone else chooses a finer grain (e.g., a military historian focusing on the specific skirmish), their grain is legitimate *if* the causal relationships they cite are invariant at that level. The "nail" becomes explanatory only if the question is "Why did *this specific messenger* fail?" rather than "Why was the kingdom lost?" There is no single "true" grain, only grains that support invariant generalizations relative to a specific explanatory interest.

  **Confidence:**
  I am **85% confident** in this diagnosis. It aligns with the dominant interventionist and pragmatic accounts of explanation in contemporary philosophy of science (e.g., Woodward, van Fraassen), which successfully dissolve similar skepticism about causal selection.

  **Least Sure Claim:**
  The claim I am least sure of is: **"Invariance under intervention is the primary justifier for selecting explanatory grain."** While invariance is a strong candidate, it is possible that normative or social interests (e.g., moral responsibility, political utility) sometimes legitimately override invariance in determining which causal grain counts as "explanatory" in historical practice, meaning my reliance on invariance to save the difference-making account might be too narrow.
