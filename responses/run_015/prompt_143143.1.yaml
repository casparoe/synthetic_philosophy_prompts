      *   *The "Broken Clock" Problem:* This is a classic philosophical problem. A stopped clock is right twice a day. Is it a clock? Dennett usually handles this via the *Design Stance*. The Design Stance isn't about *perfect* function, it's about *attributed* function. A broken clock is still analyzed via the Design Stance (it's *supposed* to tell time, but isn't).
      *   *Predictive Power:* It's not just *any* prediction. It's prediction *at a certain level of abstraction* that offers *leverage*.

