          *   However, the pattern "Clock is broken, therefore ignore it" is a Design Stance judgment.
      *   **Does the distinction matter?** For Dennett, the *stance* is a tool chosen by the observer. If the "Corruption Stance" predicts better than the Design Stance (which assumes function), then the observer *should* switch stances. But Dennett would argue you are still using the Design Stance, just with a "malfunction" parameter.

