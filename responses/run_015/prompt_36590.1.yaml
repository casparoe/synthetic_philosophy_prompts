answer: |-
  ### Brainstorming & Design Logic

  Before settling on the simulation below, I considered three other models:
  1.  **The QWERTY Typing Race:** Students type phrases on two different keyboard layouts. *Rejected:* Too much variance in individual typing skill obscures the structural network effect; requires laptops.
  2.  **The Road Width Negotiation:** Groups draw roads on a shared map; wider roads accommodate more traffic but cost more to build. *Rejected:* Too abstract; the "lock-in" feels like a budget constraint rather than a coordination failure.
  3.  **The "Handshake" Protocol:** Students must physically greet each other to gain points, choosing between a wave (easy) or a complex clasp (hard). *Rejected:* Too chaotic in a 90-minute block; hard to track data.

  **Selected Design: The "Protocol Exchange" Game.**
  This design isolates the core mechanism of path dependence: **Increasing Returns to Adoption.** The value of a standard increases as more people use it, regardless of the standard's intrinsic quality. By making the "inferior" standard the one that gains early traction, we force the students to experience the frustration of lock-in viscerally. The "switching cost" is operationalized as lost time and discarded work.

  ---

  # Session Plan: The Protocol Dilemma

  **Course:** Contingency and Convergence in History
  **Session:** Path Dependence and Lock-In
  **Time:** 90 Minutes
  **Students:** 12 (Divided into 4 Groups of 3)
  **Instructor Role:** Game Master / Registrar (Do not lecture until the debrief)

  ## I. Materials & Preparation

  1.  **Group Tables:** 4 tables arranged in a square or circle, far enough apart that groups cannot overhear detailed negotiations easily.
  2.  **Envelopes (4):** Labeled "Company Charter."
      *   **3 Envelopes (The "Legacy" System):** Contain **Protocol B** instructions.
      *   **1 Envelope (The "Innovator" System):** Contains **Protocol A** instructions.
      *   *Note:* You must secretly ensure 3 groups get B and 1 group gets A. Do not tell them the distribution is uneven.
  3.  **Protocol Sheets:**
      *   **Protocol A (Efficient):** A simple checkmark (✓) inside a circle. Takes ~3 seconds to draw neatly.
      *   **Protocol B (Inefficient):** A specific geometric sigil (e.g., a hexagon with a dot in the center and three radiating lines). Takes ~15-20 seconds to draw neatly.
      *   *Visual:* Both should look like "official" authentication stamps.
  4.  **Trade Tokens:** 50 small slips of paper per group.
  5.  **Ledger Board:** Whiteboard to track "Completed Trades" per group.
  6.  **Timer:** Visible to all.

  ## II. Game Mechanics & Rules

  **Objective:** Accumulate the most "Verified Trades."
  **Basic Rule:** A Trade is only valid if *both* parties sign the Token using the **exact same Protocol**.
  **Verification:** You (the Instructor) are the Registrar. You inspect the signature. If they match the group's registered protocol and the counterparty's protocol, the trade counts.

  **Round 1 (Exploration & Coordination):**
  *   **Time:** 10 Minutes.
  *   **Action:** Groups open their Charters. They learn their assigned Protocol. They may send "Ambassadors" (one student) to other tables to negotiate trades.
  *   **Payoff:** 1 Point per valid trade.
  *   **Constraint:** Ambassadors cannot speak across the room; they must travel to tables.
  *   **Hidden Dynamic:** The 3 groups with Protocol B will find they can trade with each other easily. The 1 group with Protocol A will find they are isolated. To trade, Group A must either convince a B-group to switch (hard) or adopt Protocol B themselves (costly).

  **Round 2 (Consolidation):**
  *   **Time:** 10 Minutes.
  *   **Action:** Trading continues.
  *   **Switching Rule:** A group may change their Protocol, but they must discard all Tokens signed in the previous round (sunk cost) and spend the first 3 minutes of this round "retraining" (sitting out).
  *   **Payoff:** 1 Point per valid trade.

  **The Twist (The "Efficiency Audit"):**
  *   **Time:** Between Round 2 and 3 (5 Minutes).
  *   **Announcement:** "Market conditions have changed. Time is now money. We are introducing a **Latency Tax**."
  *   **New Rule:** For Round 3, the cost of a trade is calculated in seconds.
      *   **Protocol A:** Costs 1 point to execute.
      *   **Protocol B:** Costs 5 points to execute (due to complexity).
      *   **Revenue:** Each trade is still worth 10 points.
      *   **Net Profit:** A-trade = 9 pts; B-trade = 5 pts.
  *   **Implication:** Protocol B is now objectively inferior. However, the network is likely locked into B.

  **Round 3 (The Lock-In Test):**
  *   **Time:** 10 Minutes.
  *   **Action:** Groups decide whether to stay with the majority (B) and accept lower margins, or attempt to coordinate a mass switch to A (risking isolation during the switch).
  *   **Payoff:** Net points (Revenue - Latency Tax).

  ## III. Minute-by-Minute Timeline

  | Time | Activity | Instructor Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Arrival & Seating.** Hand out Envelopes. Tell them: "Open only when I say." | Create a sense of formal procedure. |
  | **05-10** | **Setup & Rules.** Explain the goal (Verified Trades). Do *not* explain the protocols yet. | Keep instructions minimal. No theory yet. |
  | **10-20** | **Round 1.** "Open Envelopes. Begin Trading." | Watch the isolation of Group A. Do not intervene. |
  | **20-25** | **Pause & Ledger.** Tally scores. Ask: "Anyone want to switch protocols?" Remind them of the Switching Cost (discard tokens, sit out 3 mins). | Most will stay put. This is the lock-in forming. |
  | **25-35** | **Round 2.** Trading resumes. | Reinforce the "Matching Signature" rule strictly. |
  | **35-40** | **The Twist.** Announce the Latency Tax. Reveal drawing times (A=3s, B=15s). | This is the moment of realization. Let them panic. |
  | **40-50** | **Round 3.** High-stakes trading. | Observe if they can overcome the network effect. |
  | **50-55** | **Final Tally.** Calculate winners. | Usually, the B-groups win on volume, A-group wins on margin, or everyone loses to inefficiency. |
  | **55-90** | **Debrief.** (See Script Below). | Transition from experience to theory. |

  ## IV. The Debrief Script (Theoretical Mapping)

  *Do not start with definitions. Start with their frustration.*

  **Phase 1: Reconstruction (55-65 min)**
  *   "Group A, raise your hand. When did you realize you were in trouble?"
  *   "Group B, when did you realize your protocol was 'harder'? Did you care in Round 1?"
  *   "Why didn't Group A convince you to switch in Round 2? What stopped you?"
      *   *Target Answer:* "It wasn't worth losing our existing trades." (Switching Costs).
      *   *Target Answer:* "We couldn't trust everyone else to switch at once." (Coordination Problem).

  **Phase 2: The Counterfactual Clash (65-80 min)**
  *   *Write on board:* **CONTINGENCY** vs. **CONVERGENCE**.
  *   **Question 1 (Contingency):** "If we ran this game again right now, but I swapped the envelopes so 3 groups got Protocol A and 1 got Protocol B, where would we end up?"
      *   *Desired Consensus:* We would likely lock into Protocol A.
      *   *Theoretical Point:* The outcome depends on the *order* of events (who got which envelope first). This is **Path Dependence**. Small, early accidents determine the long-term outcome.
  *   **Question 2 (Convergence):** "But did we *have* to lock into a protocol? Could we have played without one?"
      *   *Desired Consensus:* No, we needed a standard to trade at all.
      *   *Theoretical Point:* **Convergence**. Some structure was inevitable. The *need* for a standard is convergent; the *specific* standard is contingent.
  *   **Question 3 (The "QWERTY" Question):** "Protocol B was worse. In history, do 'worse' technologies win? Give me examples."
      *   *Prompt:* QWERTY keyboards, VHS vs. Betamax, Gauge widths of railways.
      *   *Theoretical Point:* **Increasing Returns**. The value of the technology isn't intrinsic; it's relational.

  **Phase 3: Vocabulary & Formalization (80-90 min)**
  *   Now, introduce the terms.
  *   **Path Dependence:** "History matters." Past decisions constrain future options.
  *   **Lock-In:** When the cost of switching exceeds the cost of staying with an inferior option.
  *   **Network Effects:** The value of a choice increases as others make the same choice.
  *   **Assignment:** "For next week, read Paul David's 'Clio and the Economics of QWERTY.' Map his argument onto what happened to Group A today."

  ## V. Troubleshooting: What Will Go Wrong

  As a senior scholar, I must warn you: simulations are living systems. Here is where they break, and how to fix it.

  **1. The "Polite Coordination" Failure**
  *   **Risk:** Undergraduates are social. In Round 1, a student from Group B might shout, "Hey, Protocol A looks easier, let's all use that!" and everyone agrees instantly. This destroys the lock-in effect.
  *   **Fix:** Enforce a **"No Cross-Room Broadcasting"** rule. Ambassadors can only talk to the table they are visiting. They cannot make announcements to the whole room. This simulates the lack of "common knowledge" in real history.
  *   **Instructor Move:** If they try to coordinate globally, interrupt: "There is no central council. You are competing firms. Bilateral deals only."

  **2. The "Sandbagger" Exploit**
  *   **Risk:** A group realizes in Round 3 that if they switch to A, they get higher points per trade, even if they trade less. They might intentionally isolate themselves to maximize margin.
  *   **Fix:** This is actually a *good* outcome! It shows the tension between market share and efficiency. In the debrief, highlight this: "Group C chose efficiency over volume. Is that historically realistic? When do monopolies care about efficiency?" (Answer: Usually only when threatened).

  **3. The "Instructor Bias" Accusation**
  *   **Risk:** Students feel you rigged the envelopes (which you did). They might dismiss the lesson as "fake."
  *   **Fix:** Own it. In the debrief, say: "Yes, I rigged the initial distribution. Why? Because in history, initial distributions *are* often arbitrary accidents of geography, war, or timing. The question isn't whether the start was fair, but whether the *process* locked us in."

  **4. Time Creep**
  *   **Risk:** Drawing the complex sigil takes longer than expected. Round 1 eats 20 minutes.
  *   **Fix:** Be ruthless with the timer. Use a loud alarm. If Round 1 runs long, cut Round 2 short. You need time for the debrief more than the game.

  ## VI. Limitations: What This Game Cannot Teach

  You must be honest with your students (and yourself) about where the analogy fails. Add this to the final 5 minutes of the debrief.

  1.  **Common Knowledge of Payoffs:** In the game, once I announced the Latency Tax, everyone *knew* Protocol A was better. In real history, actors rarely know the "superior" technology exists (e.g., did Roman engineers know concrete would be rediscovered later?). *You must supply this verbally.*
  2.  **Power & Coercion:** In the game, groups switched voluntarily. In history, standards are often imposed by force (colonialism, monopoly law, military conquest). The game models *economic* lock-in, not *political* lock-in.
  3.  **The "God's Eye" View:** You, the instructor, know the whole board. The students only saw their table. Historical actors are like the students: they don't know they are in a "path dependent" process until it's too late.

  ## VII. Scholar's Note to the PhD Student

  You are worried about whether they will "get it." They will. The frustration of Group A when they realize they are stuck with the inefficient protocol is the learning objective. Do not rescue them. If Group A ends the game with zero points because they couldn't trade, that is a *successful* simulation of historical marginalization.

  When you introduce the terms in the final 10 minutes, you will see the lights turn on. They will realize that "Path Dependence" isn't just a fancy phrase; it's the feeling of drawing that hexagon for the tenth time when a checkmark would have done.

  Good luck. Run the clock hard. Let them feel the lock-in.
