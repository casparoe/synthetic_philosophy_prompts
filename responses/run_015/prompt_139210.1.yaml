      *   *Intro:* Identify the core theory. It's a communicative theory of honor.
      *   *Blame/Honor (1 & 2):* Address the comparative issue. Honor is contrastive.
      *   *Intent/Function (3 & 4):* Address the tension. Honor as speech act requiring uptake.
      *   *Steelman (3):* Institutional integrity, not just cash.
      *   *Rival View:* Lease vs. Deed.
      *   *Underdetermination:* Where reasons diverge but votes align.

