      *   **Context:** The user is on a university commemorative naming committee. They have a written standard with four clauses.
      *   **The Clauses:**
          1.  Strip name only if worst acts condemned by contemporaries (availability test).
          2.  Don't strip just for odious beliefs universal at the time ("man of his time" defense).
          3.  Don't strip if name was a condition of a bequest (contractual/fence argument).
          4.  Don't strip if the name is functionally inert (just an address/signifier).
      *   **The User's Problems:**
          *   (1) & (2) seem to imply comparative blameworthiness (worse than peers) vs. absolute. Is this coherent?
          *   (3) & (4) seem contradictory: (3) focuses on original intent/contract, (4) focuses on current function/reception.
          *   Need to steelman (3) against the "money talking" accusation.
          *   Need to reconstruct the implicit theory of blame, honor, and historical judgment.
          *   Need to distinguish strict presuppositions vs. comfortable fits.
          *   Need to address consistency of (1) & (2) given beliefs cause acts.
          *   Need to contrast with a rival view (honor as a lease/periodic review).
          *   Need to flag underdetermined areas where different theories yield same votes.
      *   **Constraints:** Under 650 words. Prose (no bullet dumps). Readable on a phone (clear structure).

  2.  **Deconstruct the Policy's Implicit Theory:**
      *   *Blame/Honor:* The policy treats honor as communicative. To honor someone is to endorse them. If everyone believed X, endorsing X isn't distinctive endorsement. If contemporaries objected, endorsing despite objection is distinctive endorsement of the bad act. This supports the comparative blame view (1 & 2). It's not that blame is comparative, but that *commemorative blame* (withdrawal of honor) requires evidence that the honor was misplaced *at the time*.
      *   *Intent vs. Function:* (3) is deontological/contractual (keep promises). (4) is consequentialist/semiotic (meaning is use). The policy hybridizes these: Honor is a speech act that requires both a speaker (university/donor) and a listener (campus). If the listener stops hearing the honor (4), the act lapses. If the speaker was bound by contract (3), the act is constrained.
      *   *Steelman (3):* It's not just money; it's institutional integrity. Breaking contracts undermines the university's ability to secure future gifts. It's a rule-utilitarian argument disguised as deontology.

  3.  **Address Specific Questions:**
      *   *Comparative Blame:* (1) & (2) presuppose that commemoration signals *excellence*, not just existence. If everyone was racist, being racist isn't a marker of distinctive moral failure warranting removal of honor, unless you were *notably* worse. It's coherent if honor is contrastive.
      *   *Beliefs/Acts:* (1) & (2) are consistent if we distinguish holding a belief vs. acting on it against counsel. Acting against contemporary condemnation shows agentic commitment to the harm.
      *   *Rival View (Lease):* A "lease" view presupposes honor is provisional on current values, not historical context. It shifts authority from the past (contract/context) to the present (current moral consensus).
      *   *Underdetermination:* Cases where a figure was universally condemned *and* the name is inert. Both (1) and (4) suggest removal/retention differently? Actually, if inert, (4) says keep. If condemned, (1) says strip. This is a conflict, not underdetermination. Underdetermination is where different theories yield same result. E.g., A donor-funded building where the donor was universally condemned. (1) says strip, (3) says keep. That's a conflict. Where is it underdetermined? Maybe where a name is inert AND donor-funded. Both (3) and (4) say keep. Different reasons, same vote.

