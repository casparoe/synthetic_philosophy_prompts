      (3) and (4) look contradictory but share a view of institutional agency. (3) binds the institution's past self (promise keeping). (4) acknowledges the institution's present self (meaning is use). They reconcile if we see commemoration as a dialogue: (3) protects the donor's voice, (4) protects the community's reception.
      Steelman (3): It's not money; it's trust. If the university breaks naming deals, it loses the capacity to partner for public goods. It's a rule-consequentialist defense of a deontological rule.
      Rival View (Lease): This presupposes honor is purely instrumental to current morale. It rejects historical continuity.
      Underdetermination: When a name is inert (4) and donor-funded (3). Both say keep, but for different reasons (semiotic death vs. contractual obligation). Your group fights because you're arguing theories, not outcomes.

