answer: |-
  **Research Priority Memorandum**

  **To:** Research Group (Senior Scholars & Postdoc)
  **From:** Project Director
  **Subject:** Strategic Allocation of Resources (Years 1–3)
  **Topic:** Structural Accessibility and Reactive Attitudes in Institutions

  We have three years of funding and a specific conceptual mandate: to extend Strawson's reactive attitudes through the lens of *structural accessibility*. We are not here to map existing literature but to resolve the tension between quality of will and the visibility of that will within designed systems.

  Given our constraints and the logical architecture of the problem, I am prioritizing the three lines of work as follows:

  1.  **Priority 1:** Whether manufactured opacity constitutes a distinct excusing condition.
  2.  **Priority 2:** Whether reactive attitudes can coherently attach to collective entities without individual anchoring.
  3.  **Priority 3:** Whether extending the participant stance to non-human/distributed agents requires reconceiving the stance.

  Below is the defense of this ordering based on dependency, philosophical tractability, and transformative potential.

  ---

  ### 1. Primary Focus: Manufactured Opacity as a Distinct Excuse
  **Timeline:** Months 1–18
  **Lead:** Postdoc (with Senior oversight)

  **Rationale:**
  This is the **conceptual bottleneck**. Our framing hinges on "structural accessibility conditions." Before we can assign responsibility to a collective (Priority 2) or revise the stance for algorithms (Priority 3), we must determine if the individual participants in an opaque system are *already* excused.

  If manufactured opacity functions as a standard exemption (like insanity) or an excuse (like coercion), Strawson's existing taxonomy might suffice. But if it is a *novel* structural condition where the mental states exist but are rendered inaccessible by design, this creates a "responsibility gap" that demands further theoretical work. If we skip this and move straight to collective responsibility, we risk solving a problem that doesn't exist (i.e., if individuals remain responsible despite opacity, we don't need collective bearers).

  **Tractability:**
  This is the most tractable line for *philosophers*. It requires conceptual analysis of the conditions for holding the participant stance, not empirical sociology (how institutions actually behave) or metaphysics (do groups have minds?). It stays within moral psychology. We can model "opacity" thought-experimentally without needing to audit a corporation.

  **Transformative Potential:**
  Settling this question most alters how we think about responsibility in designed institutions. If opacity is a valid excuse, it legitimizes a new form of immunity for bureaucratic actors, forcing a radical shift in how we design accountability. If it is *not* an excuse, it implies that current legal and moral practices of punishing individuals in complex systems are conceptually sound, regardless of structural complexity.

  ### 2. Secondary Focus: Reactive Attitudes and Collective Entities
  **Timeline:** Months 12–30
  **Lead:** Senior Scholars

  **Rationale:**
  This line is **downstream** of Priority 1. It is only necessary if Priority 1 concludes that manufactured opacity *does* excuse the individuals. If individuals are excused because they cannot access the moral architecture, does the resentment vanish, or does it transfer to the "firm" or "state"?

  This addresses the "collapse back onto individuals" worry raised in the prompt. If we argue that a corporation can be the target of resentment without any single member possessing the relevant quality of will, we are making a heavy metaphysical claim. We should only incur this theoretical cost if Priority 1 forces our hand.

  **Tractability:**
  Moderately tractable but risky. There is a dense existing literature on collective agency (e.g., List, Pettit). Our specific contribution—linking it to *reactive attitudes* rather than just rational agency—is narrow enough for a focused intervention. However, there is a danger of drifting into legal theory (corporate personhood) rather than moral psychology. We must remain disciplined: Can we *feel* indignation toward a structure, and is that feeling coherent?

  **Transformative Potential:**
  High, but conditional. It solves the "gap" created by Priority 1, but it is a remedial fix. It preserves the practice of blame but changes the target. It is less foundational than redefining the conditions of excuse.

  ### 3. Tertiary Focus: Non-Human/Distributed Agents and Stance Revision
  **Timeline:** Months 24–36
  **Lead:** Collaborative (All members)

  **Rationale:**
  This is the **speculative extension**. While algorithmic governance is mentioned in the prompt, the core philosophical tension lies in *human* institutions designing opacity. Extending the participant stance to non-humans requires either a category error (anthropomorphizing code) or a radical revision of Strawson (detaching the stance from human quality of will entirely).

  We should only attempt this if the first two priorities suggest that "agency" in institutions has become so distributed that human will is no longer the relevant metric. If Priority 1 and 2 succeed in grounding responsibility in human-institutional dynamics (either via individual culpability or collective persons), Priority 3 becomes less urgent.

  **Tractability:**
  Low. This risks becoming philosophy of mind or AI ethics, drifting away from our core mandate of moral responsibility in *organizations*. It requires the most conceptual revision, making it the hardest to conclude definitively within three years.

  **Transformative Potential:**
  High long-term, but low immediate utility. It changes the definition of the moral community, but that is a downstream consequence of settling how human institutions function first.

  ---

  ### Criteria for Reordering

  I will authorize a reprioritization of this agenda only under the following specific conceptual conditions:

  1.  **Trigger for Elevating Priority 2 (Collectives):**
      If, within the first 12 months, the group demonstrates that "manufactured opacity" is *not* a coherent excusing condition (i.e., individuals remain responsible regardless of structural hiding), Priority 2 loses its urgency. However, if we find that individual responsibility holds *but* is practically unenforceable, Priority 2 jumps to #1 as a pragmatic necessity, even if conceptually secondary.

  2.  **Trigger for Elevating Priority 3 (Non-Humans):**
      If our analysis of "distributed agents" reveals that the "structural accessibility" condition is violated not by human design but by *autonomous* algorithmic learning (where the designers literally cannot access the decision weights), Priority 3 must move to #1. This would indicate that "manufactured opacity" has been succeeded by "generated opacity," rendering the human-institutional model obsolete.

  3.  **Trigger for Abandoning Priority 1 (Opacity):**
      If we conclude that "structural accessibility" is not a necessary condition for reactive attitudes (i.e., we can resent someone for a will we cannot access), the entire framing collapses. We would then need to pivot to defending a "Quality of Will Only" model, effectively abandoning the structural extension.

  ### Summary of Strategy

  We begin with the **diagnosis** (Opacity), proceed to the **remedy** (Collectives), and end with the **expansion** (Non-humans).

  This order respects the logical dependency: we cannot know *who* to blame (Priority 2) until we know *if* the structural conditions block blame (Priority 1). It maximizes philosophical tractability by front-loading conceptual analysis over metaphysical construction. Most importantly, it ensures that if we fail to justify the "structural accessibility" condition in Year 1, we do not waste Years 2 and 3 building a theory of collective agency that rests on a false premise.

  **Action Item:** The Postdoc will draft a position paper on "Opacity as Excuse vs. Exemption" for internal review by Month 6. Senior Scholars will prepare a parallel critique of existing collective agency models to identify where they fail to accommodate reactive attitudes. We meet to integrate in Month 9.
