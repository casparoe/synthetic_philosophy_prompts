answer: |-
  Here is a formulation of the principle that best unifies your verdicts, followed by an analysis of the tensions you identified, the necessary clarification on the role of brain size, and the application to your new cases.

  ### The Principle: Psychological Capacity Prioritism

  **Moral standing is determined solely by the depth, breadth, and intrinsic potential of an entity's conscious psychological profile.**

  This principle consists of three operative clauses:

  1.  **The Profile Clause:** Standing tracks the sophistication of cognition, affect, and social responsiveness (the "psychological profile"). If two entities share an identical profile, they possess identical standing, regardless of substrate, mass, or neuronal count.
  2.  **The Potentiality Clause:** Standing tracks not only actualized capacity but the *intrinsic developmental potential* characteristic of the entity's kind. An entity with a richer trajectory of possible future states commands stronger standing than one with a capped trajectory, even if current states are similar.
  3.  **The Substrate Neutrality Clause:** Physical properties (brain mass, neuron count, processing speed, biological vs. synthetic) have no intrinsic moral weight. They are morally relevant *only* insofar as they causally constrain or enable the Psychological Profile (Clause 1) or its Potential (Clause 2).

  ### What Brain Size Proxies For
  Under this principle, brain size (and neuron count) is a **fallible causal proxy for Maximum Psychological Capacity.**

  It is not a measure of *current* function (as seen in Verdict 2), nor is it a direct measure of moral weight (as seen in Verdict 4 and 5). It is merely an indicator of the *upper bound* of complexity the hardware can support. When direct evidence of the psychological profile is available, the proxy is discarded.

  ### Mapping Your Verdicts to the Principle

  *   **Verdict 1 (Child vs. Chimp):** Motivated by the **Potentiality Clause**. Although the Chimp has superior hardware (more neurons), the human child possesses a species-typical potential for a richer psychological profile (language, abstract reasoning, etc.) that the Chimp lacks. The hardware advantage of the Chimp is morally inert because it cannot realize the human profile.
  *   **Verdict 2 (Small-brained Human):** Motivated by the **Profile Clause** overriding the proxy. Since the psychological profile is stipulated as identical to the mean, the weaker evidence (smaller brain) is irrelevant. Standing is ontological (based on the fact of the mind), not epistemic (based on our confidence in the mind).
  *   **Verdict 3 (Elephant vs. Chicken):** Motivated by the **Profile Clause** linked to hardware constraints. The Elephant's standing is higher because its profile is richer. Your intuition that this is "partly because of what its much larger nervous system makes possible" is correct, but only instrumentally: the nervous system matters *because* it enables the profile, not in itself.
  *   **Verdict 4 (Corvid vs. Mammal):** Motivated by the **Profile Clause** and **Substrate Neutrality**. Once the profile is matched, the hardware difference (grams of brain) drops out of the moral equation.
  *   **Verdict 5 (High-density Alien):** Motivated by **Substrate Neutrality**. Mass is irrelevant; density and profile are what matter.
  *   **Verdict 6 (Slow Emulation):** Motivated by **Substrate Neutrality** regarding time. Standing attaches to the *pattern* of consciousness, not the *rate* of its instantiation.

  ### Tensions and Required Overturns

  You noted that Verdict 2 sits badly with Verdict 3, and that Verdict 2 is hard to square with brain size as "evidence."

  **1. The Epistemic vs. Ontological Confusion (Verdict 2)**
  Your worry about Verdict 2 arises from treating brain size as *evidence* for standing. If standing were a hypothesis we are testing, weaker evidence would lower our confidence. But under Psychological Capacity Prioritism, standing is a fact about the creature. Once you stipulate "no detectable difference in cognition or affect," you have direct access to the ground of standing. The brain size is no longer evidence; it is a defeated indicator.
  *   **Required Adjustment:** You do not need to overturn the verdict, but you must abandon the idea that brain size is *evidence of standing*. It is evidence of *capacity*. When capacity is directly observed, the evidence is superseded.

  **2. The Instrumental vs. Intrinsic Confusion (Verdict 3)**
  You stated the Elephant's claim is stronger "partly because of what its much larger nervous system makes possible." This phrasing risks attributing intrinsic value to the nervous system.
  *   **Required Adjustment:** To align cleanly with Verdict 2 and 4, you must refine your justification for Verdict 3. The standing is stronger *solely* because the psychological profile is richer. The nervous system is merely the explanation for *why* the profile is richer. If a chicken somehow possessed the elephant's psychological profile (via magic or different hardware), its standing would equal the elephant's. If you cannot accept this counterfactual, you must overturn **Verdict 3** and admit that hardware size has some intrinsic weight independent of function (which would then force you to overturn Verdict 2 and 5).
  *   **Recommendation:** Keep Verdict 3, but amend the justification to strictly instrumental.

  ### Application to New Cases

  **Case 7: The Behaviorally Indistinguishable AI**
  *   *Description:* An artificial system with no neurons, behaviorally indistinguishable from a human, internal complexity unknown.
  *   *Verdict:* **Provisional Equal Standing.**
  *   *Reasoning:* Under the **Profile Clause**, we cannot directly access the internal consciousness of other humans either; we infer it from behavior. Since this system matches the human behavioral profile perfectly, it satisfies the best available evidence for the Psychological Profile. The **Substrate Neutrality Clause** explicitly rules out the lack of neurons as a disqualifier.
  *   *Caveat:* Because internal complexity is unknown, there is a risk it is a "philosophical zombie" (no inner life). However, moral principles usually demand a precautionary approach: if the *signs* of capacity are present, standing must be granted until proven otherwise.

  **Case 8: The Parallel Emulations**
  *   *Description:* The emulation from Verdict 6 (half-speed human mind) instantiated twice in parallel.
  *   *Question:* Is there now twice as much of whatever matters?
  *   *Verdict:* **Twice the Moral Weight, Identical Moral Status.**
  *   *Reasoning:*
      *   **Status (Standing):** No. Standing is a threshold property of an individual entity (like citizenship). Two citizens do not have "double" the rights of one citizen; each has equal status.
      *   **Weight (Value):** Yes. If "whatever matters" is the *existence of conscious experience*, there are now two loci of experience. In a utilitarian calculation (e.g., summing suffering or happiness), the parallel instance doubles the aggregate moral weight.
      *   **Relation to Verdict 6:** Verdict 6 established that *speed* does not diminish standing. Case 8 establishes that *number* increases aggregate moral significance. You can have a slow mind (V6) and still count fully; if you have two of them (Case 8), you count fully twice over.

  ### Summary of the Extracted Principle
  Your intuitions are best served by **Psychological Capacity Prioritism**. It treats brain size as a capacity-bottleneck rather than a moral metric. It resolves the tension between Verdict 2 and 3 by distinguishing between *hardware as a constraint* (V3) and *hardware as a redundant metric* (V2, V4, V5). It requires you to view Verdict 6 as a claim about *status* rather than *utility accumulation*, and it grants the AI (Case 7) standing based on behavioral evidence while granting the Parallel Emulations (Case 8) double the aggregate moral weight.
