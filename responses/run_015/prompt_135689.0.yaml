answer: |-
  # Activity: The Bureau of Names and Obligations

  **Class Size:** 14 Students
  **Time:** 75 Minutes
  **Topic:** Gongsun Long's *White Horse Not Horse* (Baima fei ma) and the ontology of compound terms.

  ## 1. Conceptual Overview
  This simulation forces students to experience the friction between *extensional* logic (sets of objects) and *intensional* logic (definitions of names). By gamifying the validation of contracts, students will feel the "cost" of Gongsun Long's precision. The disagreement is not about what the object *is*, but about whether the *name* on the contract creates an obligation that the object fulfills.

  ## 2. Materials Needed
  *   **Inventory Deck (20 cards):** Simple index cards. Each has a [Color] and a [Form].
      *   5x White Horse
      *   5x Black Horse
      *   5x White Ox
      *   5x Black Ox
  *   **Contract Slips (30 slips):** Small paper slips where players write a demand (e.g., "Horse," "White Horse," "Ox").
  *   **Currency:** 50 slips of paper marked "1 Li".
  *   **Faction Badges:** 5 Red (Separatists), 5 Blue (Conjunctionists), 4 Green (Tag Ontologists).
  *   **Veto Tokens:** 3 per faction (red/blue/green poker chips or distinct tokens).
  *   **Timer:** Visible to the class.

  ## 3. Roles and Factions
  Divide the 14 students into three Guilds. Each Guild has a specific "Ontological Constitution" that dictates how they judge a trade.

  **Guild A: The Separatists (5 Students)**
  *   **Philosophy:** Form (*xing*) and Color (*se*) are distinct categories. A compound name ("White Horse") creates a new, unique reality distinct from its parts ("Horse").
  *   **Veto Rule:** You must veto any trade where the Contract Name does not **exactly match** the Object's full designation.
      *   *Example:* Contract says "Horse," Object is "White Horse." **VETO.** (Reason: You asked for Form, you were given Form+Color. These are not identical names).
      *   *Example:* Contract says "White Horse," Object is "White Horse." **APPROVE.**

  **Guild B: The Conjunctionists (5 Students)**
  *   **Philosophy:** Common-sense realism. A compound term is just a filter applied to a base category. "White Horse" is simply a horse that is white.
  *   **Veto Rule:** You must veto any trade where the Object physically **fails to match** the descriptors in the Contract.
      *   *Example:* Contract says "Horse," Object is "White Horse." **APPROVE.** (Reason: It is a horse).
      *   *Example:* Contract says "White Horse," Object is "Black Horse." **VETO.** (Reason: Color mismatch).

  **Guild C: The Tag Ontologists (4 Students)**
  *   **Philosophy:** Modern analytic framing. Properties are tags. Some tags are *intersective* (White + Horse), some are *subsective* (Toy Horse is not a Horse).
  *   **Veto Rule:** You must veto any trade where the logical relation between tags is **ambiguous**.
      *   *Example:* Contract says "Horse," Object is "White Horse." **APPROVE** *only if* the Contract implies "ANY Color." If the Contract is vague, you demand clarification.
      *   *Special Power:* You can propose a "Tag Amendment" once per round to clarify a Contract term (e.g., changing "Horse" to "Horse [Color Irrelevant]").

  ## 4. The Economy & Rules
  *   **Goal:** Accumulate the most Li.
  *   **Setup:** Distribute Inventory Cards randomly (1 per student). Distribute 3 Li to each student.
  *   **The Trade Loop:**
      1.  **Buyer** writes a Contract Slip (e.g., "I demand: HORSE").
      2.  **Seller** offers an Inventory Card.
      3.  **Tribunal:** One member from each Guild (rotated every 2 trades) reviews the pair.
      4.  **Validation:** To succeed, the trade needs **unanimous approval** (No Veto Tokens played).
      5.  **Payoff:**
          *   Success: Buyer gets the Card, Seller gets the Contract (worth 2 Li at end game), Tribunal members each get 1 Li from the bank.
          *   Vetoed: Trade fails. Buyer and Seller each pay 1 Li penalty (burned). Tribunal gets nothing.
  *   **Constraint:** If a student runs out of Li, they are "Bankrupt" and can only trade if subsidized by a Guild member.

  ## 5. Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Briefing**
  *   Assign Guilds. Hand out Constitutions (Veto Rules).
  *   Explain the Economy. Emphasize that **Vetoing costs the traders money**, creating social pressure to conform to the Guild's logic.
  *   *Instructor Note:* Do not explain *why* the rules differ yet. Let the friction generate the question.

  **00:10 – 00:30: Round 1 (The Naive Market)**
  *   Open trading. Students try to make deals quickly.
  *   **Predictable Friction:** Separatists will veto "Horse" contracts filled by "White Horse" cards. Conjunctionists will be confused/angry ("It *is* a horse!").
  *   **Pressure:** Sellers will start refusing "Horse" contracts because they fear the Separatist veto. They will demand contracts say "White Horse" specifically.
  *   **Stop at 30:** Freeze the market. Tally penalties.

  **00:30 – 00:50: Round 2 (The Precision Crisis)**
  *   **New Rule:** Contracts must be written *before* finding a partner.
  *   **The Squeeze:** Separatists double down on exact naming. Conjunctionists try to lobby Tag Ontologists to use "Tag Amendments" to broaden definitions.
  *   **Observation:** Watch if students start treating "White Horse" as a completely different SKU from "Horse," effectively creating two different markets. This embodies Gongsun's separation.

  **00:50 – 01:00: Round 3 (The Hui Shi Intervention)**
  *   **The Twist:** Introduce 3 "Chimera Cards" into the deck (e.g., "Half-White/Half-Black Horse" or "Painted Ox").
  *   **Task:** These cards must be traded.
  *   **Effect:**
      *   Separatists struggle: What is the *true* name?
      *   Conjunctionists struggle: Does it fit the set?
      *   Tag Ontologists shine: They can argue the tags are "Partial-White" + "Horse".
  *   **Philosophical Link:** This mirrors Hui Shi's "Ten Theses" (e.g., "The sky is as low as the earth"), which destabilize fixed categories to show the relativity of distinctions.

  **01:00 – 01:15: Debrief & Mapping**
  *   Gather in a circle. No more Li counting.
  *   **Phase 1: The Breakdown.** Ask the Conjunctionists: "When did you feel the Separatists were being unreasonable?" (Likely answer: "When they rejected a white horse for a horse contract.")
  *   **Phase 2: The Logic.** Ask the Separatists: "Why did you veto?" (Target answer: "Because the obligation was different. If I promise a horse, I can give a black one. If I promise a white horse, I can't.")
  *   **Phase 3: Mapping to Text.**
      *   Map the Separatist Veto to Gongsun's claim: *"White Horse is not Horse."* Explain that for Gongsun, this isn't about biology, it's about the *name's extension*.
      *   Map the Tag Ontologists to the modern solution: Intersective adjectives vs. substantial kinds.
      *   Map the Chimera Round to Hui Shi: When categories blur, rigid naming (Gongsun) fails, and we need relativism (Hui Shi).

  ## 6. Honest Note on Predictable Failures
  **Failure Mode 1: The "Pedant" Problem.**
  Students playing Separatists may realize that vetoing everything gives them power. They might veto valid trades just to hoard Li or disrupt the game.
  *   **Recovery:** Intervene at the 20-minute mark. Remind Separatists: "Your goal is not to stop trade, but to enforce *correct naming*. If you veto a trade that uses the exact name 'White Horse' for a 'White Horse' card, you lose your Guild's honor (penalty)."

  **Failure Mode 2: Economic Collapse.**
  If too many trades are vetoed, students run out of Li and stop playing.
  *   **Recovery:** Act as the "Imperial Bank." Offer a bailout of 2 Li to any bankrupt student, provided they publicly state which Guild's logic they are adopting for the next trade. This forces them to verbalize their ontological commitment.

  **Failure Mode 3: Tag Ontologists Disengage.**
  The "Tag" logic is more abstract. They might feel irrelevant compared to the binary fight between Separatists and Conjunctionists.
  *   **Recovery:** In Round 2, give Tag Ontologists the sole power to write the "Official Glossary." If a contract term isn't in the Glossary, it's invalid. This forces the other two factions to negotiate with them.

  ## 7. Frank Admission of Limitations
  **What This Exercise Cannot Reproduce:**
  This game successfully simulates the *pragmatic pressure* of Gongsun Long's distinctions—it makes students feel the inconvenience of strict naming. However, it **cannot reproduce the formal proof structure** of the *Baima Lun*.

  Gongsun's argument relies on a specific logical move regarding *lei* (class/kind) and the distinction between *naming* (ming) and *actualities* (shi). He argues:
  1.  "Horse" names the form.
  2.  "White" names the color.
  3.  "White Horse" names color + form.
  4.  Therefore, the name "White Horse" is not the name "Horse."

  In the game, students treat this as a bureaucratic hurdle (a veto rule). They will likely conclude that Gongsun is just being difficult or legalistic. They will not naturally arrive at his metaphysical conclusion that "White Horse" constitutes a *different ontological unity* than "Horse."

  **Instructor Duty:**
  In the final 10 minutes, you must explicitly lecture this gap. You need to explain that for Gongsun, this wasn't a game about contracts; it was a claim about reality. The "Separation" isn't just linguistic pedantry; it is the claim that compound concepts have a reality that cannot be reduced to their sum. The game shows the *consequence* of that view, but you must supply the *justification* for it.
