answer: |-
  Here is the spec sheet you need. It strips away the proxies (IQ, benchmarks) and focuses on the functional requirements a theory of intelligence must meet to avoid being circular or trivial.

  ### The Spec Sheet: Requirements for an Adequate Theory

  To count as adequate, a theory of intelligence must satisfy the following five constraints.

  | Requirement | The Hard Case It Solves | Why It's In The Spec |
  | :--- | :--- | :--- |
  | **1. Cross-Domain Transfer** | **The LLM Problem:** An AI aces the Bar Exam but crashes a drone in a dark room. | Intelligence cannot be defined solely by performance in a single distribution. A theory must explain *why* competence in domain A (law) does or does not imply competence in domain B (navigation). It must define the "distance" between tasks. |
  | **2. Goal-Directed Plasticity** | **The Slime Mold Problem:** A mold solves a maze to find food. Is it smart or just chemistry? | Differentiates intelligence from homeostasis or reflex. The system must modify its internal state or strategy *in service of a goal* when faced with novelty, not just execute a fixed program. |
  | **3. Resource Efficiency (Boundedness)** | **The Omniscient God Problem:** A lookup table with all answers isn't "smart," it's just big. | Intelligence is compression and optimization under constraint. A theory must account for trade-offs between accuracy, speed, and energy. Brute force is not intelligence. |
  | **4. Substrate Specification** | **The Silicon vs. Carbon Problem:** Can a chatbot be intelligent if it has no biology? | The theory must explicitly state whether the physical medium matters. If it claims substrate independence, it must explain how syntax becomes semantics without a body. |
  | **5. Factor Structure** | **The "One Thing" Problem:** Is intelligence a single engine (g) or a toolkit of modules? | The theory must predict the correlation structure of abilities. If it claims intelligence is unitary, it must explain specific deficits (savants). If modular, it must explain positive manifold (why skills usually correlate). |

  ---

  ### Status Flags: Non-Negotiable vs. Camp Bias

  Not all requirements are created equal. Some are functional necessities; others are territorial claims.

  *   **Non-Negotiable (Functional Necessities):**
      *   **Goal-Directed Plasticity:** Without this, you cannot distinguish a thermostat from a thinker.
      *   **Resource Efficiency:** Without this, you cannot distinguish a supercomputer from a genius.
      *   **Capacity vs. Achievement:** (See Distinctions below). A theory must distinguish *potential* from *output*, or it cannot account for motivation, opportunity, or suppression.

  *   **Camp Bias (Theoretical Commitments):**
      *   **Substrate Specification:**
          *   *AI/Computationalism Bias:* Claims substrate independence (mind = software).
          *   *Embodied/Biological Bias:* Claims substrate dependence (mind = body-environment loop).
          *   *Verdict:* **Bias.** A theory can pick either, but it cannot claim to be universal while ignoring the other's evidence.
      *   **Factor Structure:**
          *   *Psychometrics Bias:* Prefers a unitary *g* (predictive utility).
          *   *Evolutionary Psych Bias:* Prefers massive modularity (adaptive specificity).
          *   *Verdict:* **Bias.** Currently, data supports both (positive manifold exists, but brain damage is specific). A theory must reconcile them, not choose one.

  ---

  ### The Impossibility Theorems: Jointly Unsatisfiable Constraints

  You asked if you can hold "Embodied Interaction" and "Substrate Independence" simultaneously. **No.** Not without fudging definitions.

  **1. The Embodiment Paradox**
  *   **Constraint A:** Intelligence requires real-time, sensorimotor coupling with a physical environment (Embodied Cognition).
  *   **Constraint B:** Intelligence is fully substrate-independent and can exist in a disembodied server (Computational Functionalism).
  *   **The Conflict:** If A is true, B is false. If intelligence emerges from the *loop* between body and world, removing the body breaks the intelligence. If B is true, the body is merely an I/O peripheral, not a constituent of cognition.
  *   **The Fudge:** Theorists often redefine "body" to mean "any interface" or "environment" to mean "data stream." This drains the words of meaning. A rigorous theory must pick a side: either the flesh matters, or it doesn't.

  **2. The Generality-Efficiency Trade-off**
  *   **Constraint A:** Intelligence is domain-general (can solve *any* problem).
  *   **Constraint B:** Intelligence is resource-efficient (bounded rationality).
  *   **The Conflict:** The "No Free Lunch" theorem in optimization suggests no algorithm is best for all problems. A system optimized for everything is optimized for nothing.
  *   **The Fudge:** Claiming "general" intelligence is actually a "sparse set of heuristics" that *looks* general.

  ---

  ### Uncollapsible Distinctions

  A working theory cannot treat these pairs as identical. Collapsing them leads to category errors.

  | Distinction | Why It Cannot Collapse | Consequence of Collapse |
  | :--- | :--- | :--- |
  | **Competence vs. Performance** | **Competence** is the underlying knowledge/rule; **Performance** is the execution (affected by noise, fatigue, memory). | If collapsed, a tired genius is classified as unintelligent, or a lucky guesser is classified as competent. |
  | **Capacity vs. Achievement** | **Capacity** is latent potential; **Achievement** is realized output (affected by education, culture, opportunity). | If collapsed, IQ tests become measures of privilege rather than processing power. |
  | **Simulation vs. Instantiation** | **Simulation** behaves *as if* it understands (LLM); **Instantiation** actually possesses the causal mechanism of understanding. | If collapsed, a weather simulation is treated as a storm. We cannot determine if AI "thinks" without this line. |
  | **Adaptation vs. Optimization** | **Adaptation** is fitting the environment (evolutionary fit); **Optimization** is maximizing a specific metric (game score). | If collapsed, a parasite is "smarter" than a physicist because it survives better. |

  ---

  ### Theory Scorecard

  How do the major contenders score against this spec?

  **1. Psychometric *g*-Factor Theory**
  *   **Score:** 2/5
  *   **Passes:** Factor Structure (defines the correlations), Capacity vs. Achievement (attempts to isolate latent trait).
  *   **Fails:** Substrate Specification (human-centric), Goal-Directed Plasticity (static testing), Cross-Domain Transfer (predicts correlation but doesn't explain the *mechanism* of transfer).
  *   **Verdict:** Excellent for prediction within human populations; useless for defining intelligence broadly (AI, animals).

  **2. Embodied Cognition / Enactivism**
  *   **Score:** 3/5
  *   **Passes:** Substrate Specification (clear: body is required), Goal-Directed Plasticity (clear: action-perception loops), Resource Efficiency (clear: energy minimization).
  *   **Fails:** Cross-Domain Transfer (struggles to explain abstract math or logic detached from physical reference), Factor Structure (often rejects *g* entirely without replacing its predictive power).
  *   **Verdict:** Biologically robust, but excludes disembodied abstract reasoning (the very thing humans prize most).

  **3. Intelligence as Adaptation (Evolutionary/Legg-Hutter)**
  *   **Score:** 4/5
  *   **Passes:** Substrate Specification (agnostic), Goal-Directed Plasticity (central), Cross-Domain Transfer (defined as breadth of environments), Resource Efficiency (defined as compression).
  *   **Fails:** Factor Structure (often ignores the positive manifold in favor of pure task counts), Competence vs. Performance (often conflates survival success with cognitive capacity).
  *   **Verdict:** The strongest theoretical candidate, but risks defining "intelligence" so broadly that "bacteria" and "Einstein" differ only in degree, not kind.

  ### The Bottom Line for Your Editor

  When we argue about whether something is "intelligent," we are usually arguing about **which constraint we are willing to violate.**

  *   If you prioritize **prediction**, you accept the *g*-factor bias and ignore the mechanism.
  *   If you prioritize **biology**, you accept the Embodiment bias and exclude AI.
  *   If you prioritize **abstraction**, you accept the Substrate Independence bias and risk calling lookup tables "smart."

  There is no working definition because the field has not agreed on whether intelligence is a **property of the agent** (internal capacity), a **property of the interaction** (adaptation), or a **property of the observer** (attribution). Until a theory specifies which of these it is, the spec sheet remains incomplete.
