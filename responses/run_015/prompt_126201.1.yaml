answer: |-
  Good evening. For those who don't know me, I'm the current principal of Cedar Ridge. I've held the job for two years. Marlene held it for thirty-one.

  Looking around this room, I see the three constituencies that make up Cedar Ridge. There are the families who have lived here for four generations, whose names are on the buildings and the plaques. There are the professionals from the state department and the colleges, who measure us in metrics and standards. And there are the former students, now in their twenties and thirties, some of whom tell me they made it out because this school held them, and some of whom tell me they made it out because this school let them go.

  Marlene served all of you. But she served you differently.

  Most of you know her rule. She never closed a conflict in front of an audience. If there was a fight, a theft, or a threat, the repair happened in her office. The people involved, plus one extra person: a shop teacher, a bus driver. She called it the Third Chair. Her test for who sat in it was simple: "Who doesn't need anything from this?"

  She understood that as soon as there are witnesses, repair turns into performance. We stop trying to fix the problem and start fighting for the esteem of the room. We fight to look better than the other person. She knew that if you let an audience in, the Third Chair grows until everyone is performing for its sympathy.

  I know there are stories you want to hear tonight. Specifically, the two boys from 2009 who now run a fencing business together. I know the town was furious with Marlene because she never announced who was right and who was wrong. You wanted a verdict. You wanted to know which family bore the shame.

  Marlene denied you that story. She knew that if she gave the town a verdict, the boys would be frozen in those roles forever. The town wanted a moral; she gave them a future. She understood that sometimes, protecting the peace requires refusing to satisfy the public's need for a narrative.

  There were other times, too. Times when she kept things quiet that perhaps should have been spoken. Times when the silence cost her more than the noise would have. She knew that transparency is a virtue, but so is protection. She was willing to be the villain in the public story if it meant the students didn't have to be the victims in the permanent record. She carried the weight of those decisions alone, in that office, with the Third Chair empty. She didn't ask for credit for the burdens she bore, and she didn't ask for forgiveness for the calls that wouldn't pass an audit today.

  I stand here as her successor, and I need to be honest about what I can and cannot do. I cannot promise to keep the Third Chair. The world has changed. Every fight reaches my desk with an audience of four hundred already attached to it, on a phone, from the night before. There is no room with only the people involved in it anymore. The structural ability to offer that kind of privacy is gone.

  And I am standing at a microphone, addressing two hundred people, asking for your approval of this tenure. This is a public ceremony. Marlene believed public ceremony is what ruins repair. So, if I am not careful, this toast is a hypocrisy.

  But Marlene also knew the difference between a contest for esteem and a mark of transition. Conflict needs privacy. Gratitude needs witnesses. We are not here to judge a conflict. We are here to acknowledge that a specific kind of stewardship has ended.

  She was good. Not because she was a saint, and not because her methods are the only grown-up way to handle a slight. She was good because she understood that dignity is fragile. She knew that some things break if you shine a light on them too soon. She protected the possibility of repair in a world that increasingly demands performance.

  I cannot promise to run Cedar Ridge the way she did. The tools are different. The walls are thinner. But I can promise to remember what she protected. I can promise that when I have the luxury of privacy, I will use it for repair, not for power. And I can promise that when I must act in public, I will try to distinguish between the need for a verdict and the need for a future.

  Marlene, you taught us that the person who doesn't need anything from the conflict is the only one who can solve it. Tonight, none of us need anything from you. We don't need a verdict. We don't need a policy. We just need you to know that we see the work.

  To Marlene.
