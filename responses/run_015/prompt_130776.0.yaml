answer: |-
  # JOINT STATEMENT ON THE STATUS OF EVOLUTIONARY PSYCHOLOGY
  **Signatories:** A Proponent of Adaptationist Evolutionary Psychology & A Skeptic of Adaptationist Explanations
  **Date:** October 2023
  **Context:** Result of Adversarial Collaboration on Methodological Standards

  ### I. AGREED CLAIMS

  We, the undersigned, acknowledge that productive debate requires disentangling claims that are often conflated. We agree to structure all future evaluation of evolutionary psychological hypotheses around three distinct components. We stipulate that a hypothesis may succeed on one dimension while failing on another.

  1.  **The Tripartite Distinction:** Any adaptationist hypothesis bundles three separable claims:
      *   **Specialisation (Architecture):** The claim that the mind contains mechanisms tuned to a narrow class of inputs (domain-specific) rather than operating solely via general-purpose learning or reasoning devices.
      *   **Provenance (Context):** The claim that the class of inputs the mechanism is tuned to corresponds to a recurrent problem or statistical structure present in ancestral environments (typically the Pleistocene).
      *   **Design (Etiology):** The claim that selection *for* solving that specific problem, rather than developmental plasticity, cultural transmission, genetic drift, or exaptation (byproduct), is the primary explanation for the mechanism's current structure.

  2.  **The Scope of the Byproduct (Spandrels) Objection:** We agree that demonstrating a trait is a byproduct (spandrel) refutes the **Design** claim, but does not necessarily refute the **Specialisation** or **Provenance** claims. A mechanism can be highly specialized and triggered by ancestral cues without having been selected *for* its current function. The burden is on the adaptationist to rule out byproduct status; the burden is on the skeptic to show that a selectionist explanation is less parsimonious than a developmental or structural alternative.

  3.  **The Evidence Base and Sampling:** We agree that the field's empirical basis is disproportionately drawn from Western, Educated, Industrialized, Rich, and Democratic (WEIRD) populations. Consequently, claims regarding human *universals* remain provisional until tested against small-scale, subsistence, or culturally distinct populations. A finding in a WEIRD sample confirms a local phenomenon; it does not confirm an evolved universal without cross-cultural replication.

  4.  **Innateness vs. Reliable Acquisition:** We agree to abandon the colloquial definition of "innate" as "present at birth." Instead, we adopt a developmental definition: a trait is "innate" (or canalized) if it develops reliably across a wide range of normal environmental variations without specific instruction. We disagree on the *source* of this reliability (see Section II), but agree that **reliable acquisition does not prove genetic specification.** A trait can be universally present because the environmental trigger is universally present, not because the blueprint is genetically fixed.

  5.  **Methodological Transparency:** We agree that post-hoc rationalization of ancestral functions undermines the field's credibility. Hypotheses regarding ancestral selection pressures must be falsifiable in the present.

  ***

  ### II. DISAGREEMENTS AND PREDICTIONS TABLE

  | Domain | Adaptationist Position | Skeptic Position |
  | :--- | :--- | :--- |
  | **Default Stance** | Complex functional design in the mind implies selection. General-purpose mechanisms are computationally inefficient for solving recurrent survival problems (e.g., mate choice, predator avoidance). | Complex functional design can emerge from general learning rules interacting with structured environments. Selectionist explanations should be the last resort, not the null hypothesis. |
  | **Source of Canalization** | Reliability of development is primarily due to **genetic assimilation**. Selection has buffered the trait against environmental noise to ensure functionality. | Reliability of development is primarily due to **environmental reliability**. The "normal human environment" contains sufficient structure to canalize the trait via plasticity without specific genetic encoding. |
  | **Interpretation of Mismatch** | Modern pathologies (e.g., obesity, anxiety disorders) are evidence of **Specialisation**. They reveal mechanisms tuned to ancestral conditions that misfire in modern contexts. | Modern pathologies are often evidence of **cultural lag** or novel environmental stressors acting on general systems. "Mismatch" is often a post-hoc label applied to any negative modern outcome. |
  | **Wording on "Function"** | We accept the term "function" to denote **selected effect**. A mechanism's function is what it was selected to do, even if it currently does something else. | We prefer the term "current utility" or "effect." Attributing "function" implies a selection history that is often unproven. |

  ***

  ### III. CRUXES AND PREDICTIVE REGISTRIES

  We identify two primary cruxes where our disagreement is sharpest and where empirical resolution is theoretically possible.

  #### Crux 1: Credit Asymmetry and the Pre-Registration Registry
  **The Issue:** Confirmed predictions are claimed as victories for adaptationism; failed predictions are absorbed by "mismatch" epicycles (i.e., "it worked in the past, not now").
  **Proposed Test:** A pre-registered registry of ancestral predictions. Hypotheses must specify: (a) the ancestral input, (b) the expected output in a hold-out population (non-WEIRD), and (c) specific "mismatch" signatures in modern environments where the mechanism should systematically err.
  **Adaptationist Prediction:** Mechanisms will show specific, predictable error patterns in modern environments (e.g., specific caloric biases) that general learning models cannot predict without ad-hoc adjustments.
  **Skeptic Prediction:** "Mismatch" signatures will be indistinguishable from the effects of novel cultural norms or general learning rules operating on novel data. The ancestral reconstruction required to pre-register will be too uncertain to be falsifiable.

  #### Crux 2: The Reliability Gap (Canalization vs. Plasticity)
  **The Issue:** If a mechanism is produced by canalized development triggered by input reliably present in *any* normal human environment, is the skeptic's "plasticity" alternative a genuine rival or just a redescription?
  **Adaptationist View:** It is a rival. If the trait is genetically specified, it should show heritability even when environmental variance is low, or resist disruption when the "reliable" input is experimentally altered.
  **Skeptic View:** It is often a redescription. If the input is *universally* reliable, natural selection cannot distinguish between "genetic specification" and "universal plasticity." The empirical content lies only in cases where the reliable input is *absent*.
  **Prediction:** Both sides agree that experiments depriving subjects of "reliable" inputs (e.g., social isolation, sensory deprivation) are the only way to resolve this. Adaptationists predict specific deficits; Skeptics predict general developmental collapse or compensation via other channels.

  ***

  ### ANALYST'S NOTE ON CRUXES (For the Author)

  *Per your request for judgment on the proposed cruxes:*

  **1. Credit Asymmetry (The Registry):**
  *   **Verdict:** **Substantive, but methodologically fragile.**
  *   **Reasoning:** This is a genuine crux because it attacks the *falsifiability* of the Design claim. A pre-registered registry forces the Adaptationist to put the **Provenance** claim at risk. If they predict a specific mismatch effect and it doesn't appear, they cannot easily pivot to "cultural learning" without admitting the original mechanism wasn't specialized.
  *   **Caveat:** The Skeptic is correct that ancestral reconstruction is the weak link. If the "ancestral input" is vaguely defined (e.g., "social complexity"), the registry fails. It only works if the input is operationally defined (e.g., "exposure to pathogen cues").

  **2. The Reliability Gap:**
  *   **Verdict:** **Partially Verbal / Conceptual.**
  *   **Reasoning:** This dispute often collapses into a definition of **Adaptation**.
      *   If "Adaptation" means *Selected History* (Design Claim), then Plasticity is a rival explanation.
      *   If "Adaptation" means *Current Engineering Fit* (Specialisation Claim), then Plasticity *is* the adaptation (the ability to learn is the selected trait).
  *   **Empirical Content:** The empirical content exists *only* in the **Genetic Variance**. If a trait is truly canalized by genes, there should be low heritability in normal environments (ceiling effect) but high heritability in stressed environments (reaction norm). If the trait is canalized by environment, removing the input stops development.
  *   **Recommendation:** Frame this crux not as "Genes vs. Environment" but as "Selection on the *Content* of the mechanism vs. Selection on the *Rule* that builds the mechanism." The Skeptic argues selection built a general rule; the Adaptationist argues selection built the specific content.

  **3. Additional Verbal Flag:**
  *   Be wary of the word **"Innate."** As noted in Claim 4, you have successfully neutralized this by defining it as "canalized." Ensure the article maintains this definition. If the Adaptationist slips into using "innate" to mean "unchangeable," the agreement collapses.

  **Summary for your Article:**
  The Tripartite Distinction (Specialisation/Provenance/Design) is the strongest tool you have. Most public debates fail because the Skeptic attacks the **Design** claim (it's a spandrel!) while the Adaptationist defends the **Specialisation** claim (but look how complex it is!). Your statement forces them to admit they are talking past each other. The **Reliability Gap** is where the metaphysics hides; the **Credit Asymmetry** is where the science lives.
