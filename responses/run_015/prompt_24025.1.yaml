      *   *Fatal:* Showing that the paradox arises from a misformalization of Anti-Realism (Dummett/Edgington), making the reductio irrelevant to the actual philosophical position.
      *   *Serious:* Intuitionistic logic blocking the final step (shows the "Omni-science" result is classical artifact), but at the cost of expressive power.
