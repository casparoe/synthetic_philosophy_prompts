answer: |-
  The two cases are normatively identical instances of **Parfit's Asymmetry**, which distinguishes between reasons to prevent suffering and reasons to create happiness for potential beings, though the risk framing introduces epistemic concerns about uncertainty that generate the rhetorical difference between urgency and fanaticism.

  The core principle established in population ethics is that we have strong moral reasons not to bring into existence people whose lives would be miserable, but no corresponding moral reasons to bring into existence people whose lives would be happy. This is not merely a difference in weight, as in Negative Utilitarianism, but a difference in the existence of a reason: preventing a bad life is a duty, while creating a good life is morally neutral or optional. Your first case (risk) is simply this principle applied to probabilistic outcomes rather than certain ones. Reducing the probability of an astronomical suffering future is treated as urgent because it aligns with the duty not to create miserable beings; increasing the probability of an astronomical well-being future is treated as fanatical because, under this asymmetry, there is no strict duty to create those happy beings, so sacrificing certain present resources for a tiny chance at creating them appears irrational.

  This phenomenon is distinct from psychological loss aversion. Loss aversion applies to changes in the welfare of *existing* entities relative to a status quo; you feel the loss of $100 more than the gain of $100. The asymmetry you observe applies to *potential* entities who do not yet exist. If you recast the good outcome as "averting the loss of happiness that would otherwise have existed," the asymmetry collapses: preventing the loss of expected happiness for existing or definitely-future people is treated as urgent, symmetric to preventing suffering. The asymmetry persists only when the happiness belongs to beings who would not exist otherwise. Thus, the carving is not about valence (good vs. bad) alone, nor direction (increase vs. decrease) alone, but about the moral status of the beneficiaries (existing/definite vs. potential/contingent).

  Regarding scale, the asymmetry holds at ordinary scales in population ethics (e.g., the decision to have one child vs. none), but in risk contexts, it usually requires astronomical stakes to become visible. At ordinary scales, tiny probability changes are ignored due to probability neglect rather than ethical asymmetry. The "fanaticism" objection arises specifically when the stakes are large enough that Expected Value theory demands action, forcing a clash between the mathematical implication (act) and the ethical intuition (no duty to create).

  This is best read as a normative claim that drives descriptive argumentation. People argue this way because they hold the normative view (explicitly or implicitly) that creating well-being is optional while preventing suffering is mandatory. However, the rhetorical disparity (urgent vs. fanatical) is exacerbated by epistemic norms: risk reduction is viewed as robust and precautionary (avoiding a known bug), while value creation is viewed as speculative and fragile (optimizing for an unknown feature).

  I am highly confident that Parfit's Asymmetry is the established term for the population ethics case and that the risk case is widely treated as its probabilistic extension in moral philosophy. I am least sure whether the "fanaticism" objection is purely epistemic (about uncertainty) or if there is a distinct, unnamed normative principle regarding "risk imposition" versus "risk opportunity" that operates independently of the status of the potential beings.
