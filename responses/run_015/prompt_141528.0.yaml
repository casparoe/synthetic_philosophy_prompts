answer: |-
  **RFC-7342: Canonicalization of Activation Space Directions**

  **Summary**
  This proposal establishes a strict "One Concept, One Direction" (OCOD) policy for all interpretability artifacts. Effective Q3, every semantic feature identified in production models must be mapped to a single, canonical vector in activation space, registered in the Feature Registry with a designated owner, and recertified quarterly. This eliminates redundancy across Sparse Autoencoder (SAE) runs and ensures accountability for latent space utilization.

  **Motivation**
  Currently, feature discovery is uncoordinated. Last sprint, Team A identified Feature #442 (`off_by_one_error`) in Layer 12. Simultaneously, Team B identified Feature #891 (`loop_boundary_violation`) in the same layer using a different dictionary size. Cosine similarity is 0.96. We are currently billing internal users for both features despite them occupying nearly identical geometric subspaces.

  Furthermore, feature stability is poor. When we retrain dictionaries with higher sparsity coefficients, existing features shatter into finer-grained components. Without canonical IDs, downstream causal tracing breaks. We need to treat features as stable infrastructure, not emergent ephemera.

  **Proposal**
  1.  **Registry Ownership:** Every feature direction must have an owning engineer. If a direction becomes polysemantic (representing multiple concepts), the owner must refactor the model or split the concept into child features with parent pointers.
  2.  **Basis Standardization:** To prevent basis dependence from creating duplicate entries, all teams must align to the Standard Reference Dictionary (SRD-v4). Features discovered in non-standard bases will be projected onto the SRD and deduplicated.
  3.  **Superposition Resolution:** Overlapping features are classified as technical debt. If two concepts share a direction due to superposition, the model is non-compliant. Teams must either prune the model or allocate additional dimensions to separate the concepts.
  4.  **Recertification:** Quarterly audits will verify that registered directions still light up on their designated stimuli. If a linear probe fails to distinguish the concept at >90% accuracy, the feature ID is deprecated.

  **Non-Goals**
  *   Improving model loss or downstream performance.
  *   Accommodating models that compress information beyond the dimensionality of the activation space.
  *   Determining whether features are causally used by the model; detection via probe is sufficient for registration.

  **Rollout Plan**
  *   **Phase 1:** Audit existing SAE outputs against the Registry. Flag collisions.
  *   **Phase 2:** Enforce SRD-v4 alignment. Deprecate features lacking owners.
  *   **Phase 3:** Block model promotion if superposition density exceeds 5% per layer.

  **FAQ**

  **Q: What if the model naturally represents two concepts in one direction?**
  A: This is a modeling error. The model should be retrained to separate concerns. We cannot register ambiguous assets.

  **Q: How do we handle features that only appear when we look for them?**
  A: Confirmation bias is a process issue. All discovery runs must be blinded. If a feature persists under blinded conditions, it is eligible for registration.

  **Q: What if the direction exists but the model doesn't use it?**
  A: It is classified as "Unused Inventory." Owners must either find a use case or deprecate the direction to free up dimensionality.

  **Q: Doesn't increasing dictionary size change the features?**
  A: Feature splitting is handled via versioning. The parent ID remains stable; child features inherit the SLA.

  ***

  **Post-Script: Target & Liberties**
  I targeted the **Realists** (specifically, the "engineering realism" that treats features as discrete, stable objects). The joke lands on the assumption that features are tangible assets that can be owned, deduplicated, and standardized, ignoring the mathematical reality of superposition (where concepts *must* overlap in high-dimensional space) and basis dependence (where features change based on the dictionary learned).

  **Liberties/Contested Readings:**
  1.  **Causality vs. Correlation:** The RFC treats linear probe accuracy as sufficient for "reality," ignoring the contested claim that correlational features are actually used by the model (the "causal scrubbing" debate).
  2.  **Superposition as Debt:** It frames superposition as a fixable engineering bug rather than a fundamental property of how neural networks compress information.
  3.  **Stability:** It assumes features *can* be stabilized across dictionary sizes, whereas recent work suggests feature semantics are inherently fluid relative to dictionary capacity.
