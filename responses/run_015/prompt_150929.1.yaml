prompt: |-
  My study partner's been giving answers on rescue-duty cases all semester, and I want to predict her on a new one. Her verdicts so far:
  - shallow pond child: yes, you must wade in even if it ruins your expensive shoes.
  - sending $200 to save a distant life via malaria nets: yes, distance doesn't weaken the duty.
  - donating a kidney to save a stranger: not required, just supererogitory.
  - pushing the fat man to stop the trolley: forbidden.
  - remotely updating your car's firmware to swerve away from a pedestrian, which disables luxury features worth $3k and carries a 0.1% glitch risk: she said yes, you've got to do it.

  Now there's a decentralized crisis netwrok that asks people to run a small app scanning public social-media posts for suicide-risk signals and auto-alerting local responders. It costs about $6/mo in electricity, carries a minimal privicy risk, and you'd never know if your specific node made the difference. Should she say running it is required?

  If she wants to be consistent, what's the call, which case is the closest analog, and do her precedents actually underdetermine it? If so, lay out at least two rules that fit all her earlier answers, say what each predicts about the app, give your best guess with reasons, and name one further case that'd tell those rules apart. Please separate what's settled in this literature from what's genuinely contested, and don't present a contested view as the consensus.
