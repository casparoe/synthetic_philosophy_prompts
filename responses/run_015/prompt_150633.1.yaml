answer: |-
  This is a genuinely sophisticated reading, and you're right to sense that the standard "Borges = Eternalist" or "Borges = Idealist" labels flatten the texture of what he's doing. You're grappling with the *mechanics* of his metaphysics rather than just the mood.

  To answer your three questions directly: **Yes, it's a productive anachronism, but not a strict anticipation. No, it doesn't fully solve overcounting, it relocates it. And yes, it is appropriation, but Borges is one of the few authors who explicitly invites it.**

  Here's the breakdown of where your notes hold up and where the friction is.

  ### 1. Borges and Modal Fictionalism: Anticipation or Projection?
  It is **projection**, but the *productive* kind.

  Strict modal fictionalism (à la Gideon Rosen) is a semantic thesis about the truth conditions of modal claims: "Possibly P" is true iff "According to the fiction of possible worlds, P is true." Borges isn't doing semantics; he's doing metaphysics (or anti-metaphysics).

  However, your intuition that Borges treats temporal locations as **indexical narrative points** is spot on. In *A New Refutation of Time*, Borges oscillates between Schopenhauerian idealism (time is a representation) and Humean skepticism (the self is a bundle of perceptions). When he writes, "Time is the substance I am made of," he isn't saying time is a physical container (Eternalism) or a fleeting now (Presentism). He's saying time is the *medium of the self's narration*.

  Where your reading diverges from Borges is on the status of the "fiction." For Rosen, the fiction is a useful tool for philosophers. For Borges, the fiction is a **trap**. We are condemned to tell the story of time even if we know it's false. In *New Refutation*, he famously concludes by surrendering to time: "The world, unfortunately, is real; I, unfortunately, am Borges." A strict modal fictionalist can step outside the fiction to analyze it; Borges suggests we are *inside* the text with no outside.

  **Verdict:** You aren't finding historical modal fictionalism, but you are correctly identifying a **narrative constructivism**. It's fair to use the terminology if you frame it as "Borges treats time *as if* it were a modal fiction," rather than "Borges was a modal fictionalist."

  ### 2. The Narrative-Accessibility Move and Overcounting
  This is the weakest link in the argument, and here is why: **Borges's branches are often incoherent.**

  In *The Garden of Forking Paths*, Ts'ui Pên's novel is a labyrinth where *all* outcomes occur simultaneously. In one fork, the hero lives; in another, he dies. In one, he is your enemy; in another, your friend.
  *   **Lewis's Problem:** Infinite worlds are ontologically expensive.
  *   **Your Solution:** Prune the tree via "narrative coherence."
  *   **The Borges Problem:** Ts'ui Pên's tree includes *contradictions*.

  If accessibility is defined by narrative coherence, you eliminate the very branches Borges is obsessed with. Borges is interested in the vertigo of the **inconsistent** multiplicity. He wants the world where the coin lands heads *and* tails, not just the worlds where the story makes sense.

  Furthermore, your idea that branches are "actualized only retroactively through narration" is brilliant (it echoes Benjamin's *Jetztzeit* or even a literary version of the Wheeler-Feynman absorber theory), but it pushes the overcounting problem back to the **Narrator**.
  *   Who is the Narrator?
  *   If it's the individual subject, you have solipsism (which Borges flirts with, but recoils from).
  *   If it's "History," you have Hegel.
  *   If it's God, you have theology.

  By defining existence via "narrative coherence," you haven't solved overcounting; you've just replaced **ontological bloat** with **hermeneutic bloat**. Now, instead of counting worlds, we have to adjudicate which narratives are "coherent" enough to grant existence. Given that Borges's libraries contain all possible combinations of letters (including nonsense), he seems to suggest that *incoherence* also has a kind of being.

  ### 3. Rationalist Appropriation: Valid or Violent?
  You asked to be honest: **This is rationalist appropriation.** But with Borges, that is often the only way to read him.

  Borges wrote pseudo-essays, reviewed non-existent books, and treated philosophy as a genre of fantasy literature. He deliberately blurred the line between the logical and the literary. He *wants* you to dress him up in analytic philosophy, provided you admit the suit doesn't quite fit.

  The risk here isn't that you're being anachronistic; it's that you might be **tidying up his ambiguity.** Borges loves the paradox for its own sake. If your theory solves the paradox (by pruning incoherent branches), you might be solving a problem Borges wanted to keep open. The "mirrors and copulation" line from *Borges and I* exists because they are "abominable" multiplicities of the self. A logical structure that explains them away might miss the existential horror/ecstasy they induce.

  ### Suggestions for Refinement
  If you want to strengthen this reading without flattening the text:

  1.  **Swap "Fictionalism" for "Indexical Idealism":** Instead of saying time is a fiction, say temporal locations are **indexical properties of consciousness**. "Now" is like "Here." It doesn't exist without a speaker. This keeps the narrative element without committing to the semantic thesis of fictionalism.
  2.  **Lean into the Retrocausality:** Your point about retroactive actualization is your strongest insight. In *Garden*, the future determines the past (the spy's action gives meaning to the ancestor's book). Develop the idea that **narrative closure creates temporal reality.** This aligns with the "retroactive" point without needing to prune the branches via coherence.
  3.  **Address the "Incoherent Branch":** Acknowledge that Borges allows for contradictory branches. Perhaps your "narrative coherence" isn't about logical consistency, but about **semantic weight**. A branch exists if it is *read*, not if it is consistent. This fits the Library of Babel better: the book of nonsense exists, but it has no meaning until a reader imposes a narrative on it.

  ### Final Verdict
  It's not a "butchering," it's a **translation**. You are translating Borges's literary metaphysics into analytic idiom. That is valuable work, provided you acknowledge the translation loss.

  *   **Does it hold up?** Structurally, yes. Ontologically, it's too tidy for Borges.
  *   **Is it interesting?** Yes, because it treats Borges as a systematic thinker without ignoring his literary devices.
  *   **The Trap:** Don't let the logic cure the vertigo. The point of Borges isn't to solve the puzzle of time; it's to make the reader feel the dizziness of the labyrinth. If your theory makes the labyrinth feel like a well-mapped subway system, you've gone too far.

  Keep the "retroactive narration" bit. That's the gold. Drop the "coherence prunes the branches" bit, because Borges loves the weeds.
