  ### The tree

  Begin at **Fitch's Conclusion Bothers You**. The proof derives omniscience ($p \to Kp$) from the Knowability Schema ($p \to \Diamond Kp$) by substituting Moorean sentences ($p \land \neg Kp$). This generates a contradiction: if such a truth were knowable, it would be known, falsifying the second conjunct. You already accept Moorean truths are unknowable; the question is whether this falsifies the schema or the logic. First: **Do you accept that all truths are actually known?** If yes, you embrace **Omnicognizance**, accepting the derivation's result as a feature of reality. If no, you must block the derivation. Second: **Do you reject classical logic's reductio step?** Fitch's proof relies on double negation elimination to move from 'it's impossible not to know' to 'we know'. Rejecting this leads to **Intuitionism**, preserving knowability without omniscience by weakening the logic. If you keep classical logic, you must target epistemic principles. Third: **Do you deny knowledge closes under conjunction?** The proof requires inferring $Kp$ from $K(p \land \neg Kp)$ via factivity and distribution. Denying this aggregation leads to **Non-Aggregation**, allowing unknown conjuncts within known wholes. If you accept aggregation, you must target the schema. Fourth: **Do you restrict the Knowability Schema?** You cannot accept the universal schema and classical logic without accepting omniscience. If you restrict it, ask: **Is the restriction on the proposition type or the knowing agent?** Proposition-based restrictions lead to **Semantic Restrictionism**, claiming some truths lack verification-conditions inherently. Agent-based restrictions lead to **Agent-Relative Views**. Finally, for Agent-Relative views: **Is 'knowable' bound by practical limits or ideal capacity?** Practical limits yield the **Finite Agent View**, grounding knowability in actual cognitive constraints. Ideal capacity yields the **Idealized Agent View**, positing possible beings who could know what we cannot. Note that accepting the schema, classical logic, and aggregation while denying omniscience is an inconsistent path无人 occupy.

  ### The leaves

  **Omnicognizance:** The view that the paradox reveals reality is fully known. *Awkward commitment:* It implies humans currently know every truth, rendering error impossible and inquiry obsolete.
  **Intuitionism:** The view that logical rules governing knowledge are non-classical. *Awkward commitment:* It entails some truths are verification-transcendent, undermining the anti-realist motivation for knowability originally.
  **Non-Aggregation:** The view that knowledge does not distribute over conjunction. *Awkward commitment:* You can know a conjunction without knowing its constituent parts, violating standard epistemic logic intuitions.
  **Semantic Restrictionism:** The view that only certain types of truths are knowable. *Awkward commitment:* Some truths are true but essentially forever unknowable by anyone, creating permanent truth gaps.
  **Finite Agent View:** The view that knowability is indexed to actual agents. *Awkward commitment:* Knowability is contingent on human biology, not truth itself, making truth agent-relative and fragile.
  **Idealized Agent View:** The view that knowability requires idealized cognizers. *Awkward commitment:* It relies on metaphysically mysterious ideal limit agents who may never exist in any possible world.

  ### Empty corners

  The tree permits a path where one accepts Classical Logic, the Universal Schema, and Aggregation, yet denies Omnicognizance. This corner is empty because it is logically inconsistent; the proof is valid, so these premises entail the conclusion. No coherent position exists here. Another empty corner is Intuitionistic Logic paired with Omnicognizance. Since intuitionistic logic blocks the reductio step required to derive omniscience from the schema, holding both is unmotivated; one would simply accept the schema without the paradoxical conclusion. These positions are either incoherent or render the paradox moot.

  ### What the tree can't tell

  The tree struggles to separate **Semantic Restrictionism** and the **Idealized Agent View**. Both deny the universal schema for certain truths, landing in similar logical spaces regarding what humans can know. Practically, both concede *we* cannot know specific truths. To separate them, ask: **Is the limitation due to meaning constitutions or agent metaphysics?** Restrictionism claims the truth itself lacks knowability conditions; the Idealized View claims the truth is knowable, just not by us. This distinguishes truth properties from agent relations.
