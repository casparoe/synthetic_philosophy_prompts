  2.  **Deconstruct Lewis Carroll's Paradox:**
      *   *Premise A:* Things that are equal to the same are equal to each other.
      *   *Premise B:* The two sides of this triangle are things that are equal to the same.
      *   *Conclusion Z:* The two sides of this triangle are equal to each other.
      *   *The Trap:* The Tortoise accepts A and B but refuses Z unless there is a *rule* connecting A and B to Z (Hypothetical: If A and B are true, Z must be true). Once Achilles adds that rule (C), the Tortoise accepts C but demands a new rule (D) connecting A, B, and C to Z. Infinite regress.
      *   *Core Insight:* Logic requires a leap of faith (modus ponens) that cannot be fully codified within the system without infinite expansion.

  3.  **Translate to Novelist Vocabulary (Task 1):**
      *   *Achilles:* The Author (or the Text).
      *   *Tortoise:* The Editor (or the Skeptical Reader).
      *   *Premise A & B:* The clues on the page (The Show).
      *   *Conclusion Z:* The Reader's realization (The Inference).
      *   *The Missing Link:* The logical bridge the editor wants written down (The Tell).
      *   *The Regress:* Every time the author writes the bridge, the editor asks for the bridge to *that* bridge.
      *   *Drafting the Scenario:*
          *   Page says: "She saw the wet umbrella." (A)
          *   Page says: "It wasn't raining outside." (B)
          *   Inference: "She brought it from somewhere else." (Z)
          *   Editor: "How does she know it wasn't raining?" -> Author adds: "The pavement was dry." (C)
          *   Editor: "How does she know the pavement being dry means no rain?" -> Author adds... (Infinite loop).

  4.  **Develop the "Residue Report" (Task 2):**
      *   *Clean Carry-over:* The infinite regress of justification. The distinction between *content* and *connection*.
      *   *Fudged:* Carroll is about *logical necessity*; Fiction is about *psychological probability*. The Tortoise demands certainty; the Reader accepts plausibility.
      *   *Unsayable:* The "click." The moment the reader *feels* smart. The vocabulary describes mechanics, not the experience of reading. The user's hunch ("readers will infer" vs "you must infer") is key here. One is an invitation, the other is a command.

  5.  **Address the Smaller Questions (Task 3):**
