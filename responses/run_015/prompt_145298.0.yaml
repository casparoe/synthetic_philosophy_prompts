answer: |-
  You have stumbled onto a genuine philosophical and sociological puzzle that game scholars and digital ethicists have been circling for about fifteen years, though there is no single, universally agreed-upon label for the specific cluster of reactions you're describing.

  Your brother is half-right (psychology plays a role), but he is missing the ontological claim you are all making. You aren't just valuing what is yours; you are valuing *continuity*.

  Here is the breakdown of the established concepts that fit your pattern, a proposed name to bind them, an analysis of your cases, and the boundary tests you asked for.

  ### 1. The Established Names

  There are three distinct fields that have pieces of this, but none own the whole picture.

  **A. Historical Essentialism (Philosophy)**
  This is the direct answer to your "Ship of Theseus" hesitation. In metaphysics, *Historical Essentialism* is the view that an object's identity is constituted by its causal history, not just its current properties.
  *   **The Logic:** If you take the wood from the original Ship of Theseus and build a new ship, it is *not* the Ship of Theseus, even if it looks identical, because it lacks the causal chain from the original construction.
  *   **Application:** This explains Case 1 (Nerf vs. Delete). A nerfed sword is the *same sword* that is now weaker. A deleted-and-replaced sword is a *different sword* that happens to look like the old one. You feel robbed in the second case because the original entity ceased to exist.

  **B. Biographical Objects (Anthropology/Sociology)**
  Proposed by Igor Kopytoff and expanded by others, this theory suggests that commodities have "lives" or "biographies." As an object moves through time and hands, it accumulates social meaning.
  *   **The Logic:** An object's value is not intrinsic but narrative.
  *   **Application:** This explains Case 3 (The Loot). The first drop was a commodity (stats). The second drop was a biographical object (it had a "life" in the capital, it generated whispers). Destroying the second one is destroying a chapter of the guild's history, not just deleting data.

  **C. Type/Token Distinction (Semantics/Logic)**
  *   **The Logic:** A *Type* is the template (The "Sword of 1000 Truths" item class). A *Token* is the specific instance (The sword that dropped on Nov 14, 2017, at 9:02 PM).
  *   **Application:** Most players treat items as Types (does it have the stats?). Your group treats them as Tokens (is it *the one* we earned?). Case 2 (Re-skin vs. ID Change) is purely Token validation. A re-skin is the same Token with new clothes. An ID change is the death of the Token and the birth of a new one.

  ### 2. The Coined Term: "Lineage-Dependent Ontology"

  Since no single term covers the emotional harm of breaking the chain, I propose calling your group's specific mindset **Lineage-Dependent Ontology (LDO)**.

  **Definition:** A mode of engagement with virtual artifacts where the object's reality and value are derived primarily from the unbroken causal chain of its acquisition and ownership, rather than its functional utility or visual representation.

  **The Harm:** Under LDO, the specific injury caused by deletion or replacement is **Ontological Severance**. It is not a loss of utility (you got a better sword); it is a rupture in the timeline of the object.

  ### 3. Analysis of Your Cases through LDO

  *   **Case 1 (Nerf vs. Delete):**
      *   *Nerf:* Lineage intact. The object survived, just weakened. (No Ontological Severance).
      *   *Delete/Replace:* Lineage broken. The original token died; a new token was born. (Ontological Severance).
      *   *Verdict:* Fits LDO perfectly. You prefer a crippled ancestor to a healthy stranger.

  *   **Case 2 (Re-skin vs. ID Change):**
      *   *Re-skin:* Visuals are accidental properties. Lineage intact.
      *   *ID Change:* The database "soul" of the item changed. Lineage broken.
      *   *Verdict:* Fits LDO. You track the Item ID, not the texture map.

  *   **Case 3 (Loot vs. Socialized Loot):**
      *   *Fresh Loot:* Low lineage value. Just a Type.
      *   *Socialized Loot:* High lineage value. The object has absorbed "social mass" (whispers, recognition).
      *   *Verdict:* Fits LDO + Biographical Objects. The harm is the erasure of the social history attached to the token.

  *   **Case 4 (The Other Person's Mount):**
      *   *Analysis:* This is the most complex case. It wasn't yours. Why did you care?
      *   *LDO Explanation:* The mount had become **Guild Lore**. It was a "legendary token" within your social group. Its deletion wasn't a loss of *your* property, but a loss of *your world's* continuity. It retroactively made the story of "the time we wanted that mount" feel less real because the physical proof was erased.
      *   *Verdict:* Fits LDO, but expands it to "Shared Lineage."

  *   **Case 5 (The Rollback):**
      *   *Analysis:* You said *you* couldn't locate anything lost, while others were furious.
      *   *LDO Explanation:* This is the critical boundary. The *Objects* retained their Lineage (the database restored the exact tokens). Therefore, under LDO, *you* suffered no harm. The others were furious about **Teleological Harm** (loss of progress/time/effort).
      *   *Verdict:* This case proves your theory. You react differently than the others because you value Object Lineage; they value Player Progress. The rollback preserved the Objects but erased the Players' memories of the last 3 hours.

  ### 4. Boundary Cases

  You asked for boundary tests. Here is how Lineage-Dependent Ontology handles them.

  **Boundary Case A: The NPC Rewrite**
  *   *Scenario:* An NPC remembers your past sessions (e.g., "Hello, [Name], thanks for saving me last year"). The devs rewrite the NPC's code so it no longer remembers you, though it looks the same and offers the same quests.
  *   *LDO Prediction:* This should cause **Ontological Severance**. Even though the NPC model is identical, the *relational history* is the defining feature of that NPC for you. If the memory is wiped, it is a different NPC.
  *   *Why:* Under LDO, the "object" is not the 3D model; it is the *node of interaction*. If the interaction history is severed, the object is dead.

  **Boundary Case B: The Account Clone**
  *   *Scenario:* The devs accidentally duplicate your character. You have two characters with the same name, same gear, same history up until the moment of the bug. One is deleted by the devs to fix the error.
  *   *LDO Prediction:* You will feel a pang of loss regardless of which one they keep, but specifically if they delete the one you were *currently* controlling.
  *   *Why:* LDO relies on the *continuity of control*. The causal chain runs through your input. If they delete the "active" branch of the timeline, it feels like death, even if the "backup" branch has all the same stats.

  ### 5. Where This Answer is Shaky (The Honesty Check)

  You asked me to be honest about where the pattern might be an illusion. Here are the two weakest points in the **Lineage-Dependent Ontology** theory:

  **1. Case 4 (The Mount) is an Outlier.**
  In Case 4, you felt a pang over an object you *never owned*. LDO is primarily a theory of possession ("Why do I care about *my* sword?").
  *   *The Risk:* This suggests the phenomenon isn't about *Object Lineage* so much as **Narrative Closure**. You weren't mourning the sword; you were mourning the *story* of the sword. If the story ends with "it was deleted," it feels like a bad ending. If the story ends with "it sits in a vault," it feels complete.
  *   *Correction:* If this is true, then your reaction isn't about the object's history, but about the *aesthetic integrity of the guild's narrative*. This would make Case 1 (the sword deletion) hurt because it ruins *your* story, not because the sword "died."

  **2. Case 5 (The Rollback) might disprove the theory.**
  You said you "couldn't locate anything that had been lost."
  *   *The Risk:* If you truly adhere to LDO, a rollback *should* disturb you. Why? Because the *players* are part of the object's lineage. An item's history includes "Who held it and when." If the server says "You held it on Tuesday" but your brain says "I was offline Tuesday," there is a **Causal Mismatch**.
  *   *The Contradiction:* The fact that you felt *no* loss suggests you might actually prioritize **Database Consistency** over **Human Memory**. If the Server says the object is fine, you accept it, even if your memory contradicts it. This makes your LDO "Server-Side" only. If the Server says the object is gone, you feel harm. If the Server says the object is here, you feel no harm, even if your memory says otherwise.
  *   *Implication:* This suggests you trust the *System's* record of history more than your *own*. That is a specific kind of alienation, distinct from the "History matters" intuition.

  ### Summary

  You are describing **Lineage-Dependent Ontology**. You treat virtual items as **Historical Particulars** (defined by their causal chain) rather than **Functional Types** (defined by their stats).

  *   **The Harm:** Ontological Severance (breaking the chain).
  *   **The Exception:** You care more about the Server's record of the chain (Case 5) than your own memory, which distinguishes you from the "Stolen Time" crowd.
  *   **The Verdict:** Your pattern is real, it is philosophically robust (Historical Essentialism), and it explains why a "better" replacement feels like theft: because it isn't a replacement, it's a resurrection of a corpse.

  If you want to tell the Tuesday Regulars what this is, tell them: **"We aren't collecting gear; we're curating artifacts. The stats are just the plaque on the wall."**
