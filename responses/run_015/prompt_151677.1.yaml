answer: |-
  There is no single canonical term for this exact configuration in the literature, though it is a recognized intersection of **social ontology** and the **cognitive science of ritual**. The phenomenon you are describing is best carved out as:

  ### **Synchrony-Generated Pseudo-Intentionality (SGPI)**

  **Definition:**
  SGPI is a cognitive-social mechanism where **motor synchrony** (shared rhythm, pace, or movement) generates a **phenomenological feeling of shared agency** (a "we-experience"), which participants misattribute to **shared mental content** (beliefs, goals, or intentions), despite the absence of actual mutual belief or commitment.

  It is a specific type of **source monitoring error**: the brain detects the *somatic* reality of "we are moving as one" and incorrectly infers the *cognitive* reality of "we mean the same thing."

  ---

  ### **The Carving: Boundaries and Distinctions**

  #### **1. Boundary with Durkheim (Collective Effervescence)**
  *   **Durkheim's Mechanism:** High-arousal emotional contagion. The bond is forged through shared *affect* (excitement, awe, fear). The output is a sense of sacredness and moral obligation.
  *   **SGPI Mechanism:** Low-arousal proprioceptive alignment. The bond is forged through shared *kinematics* (timing, rhythm). The output is a sense of cognitive alignment.
  *   **The Cut:** You can have SGPI without effervescence. A boring, repetitive procession can generate SGPI if the step is tight, even if no one feels "hyped." Durkheim requires emotional heat; SGPI requires mechanical friction.

  #### **2. Boundary with Searle (Collective Intentionality)**
  *   **Searle's Condition:** **Constitutive.** For "We intend X" to be true, there must be mutual belief and a commitment to the joint goal. If I intend to walk for God and you intend to walk for status, Searle says there is *no* collective intentionality, only parallel individual intentionalities.
  *   **SGPI Condition:** **Phenomenal.** SGPI describes the *feeling* of Searle-style intentionality without the *ontological* requirements. It is a **veridical illusion**. The participants report "We intended X" (phenomenal truth), but analysis shows "I intended A, You intended B" (ontological falsehood).
  *   **The Cut:** Searle describes the *logic* of joint action; SGPI describes the *psychological error* that mimics it. Searle is about what makes the group real; SGPI is about what makes the group *feel* real when it isn't.

  ---

  ### **The Edges: Where SGPI Breaks**

  SGPI is fragile. It holds only within specific constraints. If you push past these edges, the illusion collapses into explicit disagreement.

  1.  **The Communication Edge:**
      *   SGPI thrives on **ambiguous goals** (e.g., "honoring the tradition").
      *   **Break point:** If the ritual requires explicit verbal negotiation of meaning *during* the act, the pseudo-intentionality shatters. The moment someone asks, "Why are we doing this?" and receives a conflicting answer, the somatic cue can no longer override the cognitive dissonance.

  2.  **The Synchrony Precision Edge:**
      *   SGPI scales with **temporal precision**.
      *   **Break point:** If the rhythm degrades (people fall out of step, chanting becomes ragged), the proprioceptive signal weakens. The "we-feeling" dissipates, and individuals revert to their private motivations (status, pressure, etc.).

  3.  **The Cost Edge:**
      *   SGPI works best with **low-cost** actions (swaying, walking).
      *   **Break point:** If the action becomes **high-cost** (painful, dangerous, expensive), participants demand actual belief alignment to justify the cost. High cost triggers a "belief screening" that SGPI cannot bypass. SGPI is a "cheap" cohesion mechanism; it cannot sustain "expensive" commitments.

  ### **Summary of the Configuration**
  *   **Input:** Low-cost, high-precision motor synchrony.
  *   **Process:** Proprioceptive feedback loop misidentified as cognitive consensus.
  *   **Output:** Reported "shared mind" masking divergent individual intentions.
  *   **Status:** A functional social glue that simulates deep agreement without requiring actual belief homogeneity.
