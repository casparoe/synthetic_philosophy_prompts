answer: |-
  # The Vignette Triage Protocol (VTP)

  **Operator:** Research Assistant (RA)
  **Time Budget:** 60 minutes per vignette cluster (Standard + Mirror + Paraphrase + Text)
  **Goal:** Classify cross-site verdict gaps into one of five categories to determine inclusion in the pre-registered analysis plan.
  **Honesty Clause:** This procedure identifies *artifacts*. It does not identify *truth*. Where this protocol flags "Judgment Call," the RA must escalate to the PI and In-Country Collaborator (ICC). Do not guess.

  ---

  ## Phase 1: The Evidence Sweep (30 Minutes)

  **1. Comprehension Check (Paraphrase Data)**
  *   **Action:** Pull the paraphrase codes for the site(s) showing the divergent verdict.
  *   **Metric:** Percentage of participants who failed to reproduce the *key structural detail* (e.g., "The agent did not know," "The promise was made to a dying person").
  *   **Threshold:** If >30% of the divergent site fails the structural check while other sites are <10%, flag **Comprehension Failure**.
  *   **RA Note:** If the failure rate is high everywhere, the vignette is broken globally.

  **2. Structural Equivalence Check (Mirror Data)**
  *   **Action:** Compare the Verdict Gap (Site A vs. Site B) in the *Standard Version* against the Verdict Gap in the *Mirror Version*.
  *   **Metric:** Direction and Magnitude of the mean difference.
  *   **Logic:**
      *   If Gap exists in Standard but *disappears* in Mirror: The specific cultural detail was driving the noise, not the philosophical structure.
      *   If Gap persists in both: The difference is likely structural, scale-based, or genuine.
  *   **RA Note:** This requires the ICC to have certified the Mirror as structurally identical. If they haven't signed off, stop and ask PI.

  **3. Response Style Check (Distribution)**
  *   **Action:** Generate histograms for the 7-point scale for each site.
  *   **Metric:** Variance (SD) and Skew.
  *   **Threshold:**
      *   **Compression:** If one site's SD is <0.8 while others are >1.5, flag **Scale Artifact**.
      *   **Extreme Responding:** If one site uses only 1, 6, 7 while others use the full range, flag **Scale Artifact**.
  *   **RA Note:** Do not adjust the data yet. Just flag the pattern.

  **4. Construct Check (Free Text)**
  *   **Action:** Randomly sample 10 explanations from the divergent site and 10 from the consensus sites.
  *   **Metric:** Keyword/Theme match.
  *   **Question:** Are they justifying their answer using the *intended* philosophical concept (e.g., "knowledge," "permission") or a *substituted* concept (e.g., "consequences," "legality," "rude")?
  *   **Threshold:** If >50% of the divergent site's sample references a concept not present in the vignette, flag **Question Substitution**.
  *   **RA Note:** This is a judgment call. If unsure, quote the text and escalate.

  ---

  ## Phase 2: Classification & Action (15 Minutes)

  Assign the vignette to **one** primary category. If multiple flags trigger, prioritize in this order: Comprehension > Substitution > Scale > Mirror > Genuine.

  | Category | Evidence Required | Sufficient Answer | Action |
  | :--- | :--- | :--- | :--- |
  | **1. Comprehension Failure** | Paraphrase fail rate >30% at divergent site; clean elsewhere. | Participants did not understand the case. | **Drop.** Do not analyze. Re-field with simplified wording next wave. |
  | **2. Question Substitution** | Free-text shows >50% discussing a different construct (e.g., blame vs. knowledge). | Participants answered a different question. | **Drop.** The measure is invalid at this site. |
  | **3. Scale Artifact** | SD compression or extreme skew at divergent site; Paraphrase clean. | Participants understood but use the ruler differently. | **Report with Caveat.** Analyze using site-standardized scores (z-scores). Note limitation in paper. |
  | **4. Translation/Cultural Noise** | Gap in Standard vanishes in Mirror; Paraphrase clean. | The specific story details caused the noise, not the logic. | **Report Mirror Only.** Exclude Standard version from cross-site comparison. |
  | **5. Genuine Difference** | Paraphrase clean, Mirror gap persists, Scale normal, Text matches construct. | No artifact found. | **Report.** Treat as a finding. (Requires PI/ICC sign-off). |
  | **6. Undecidable** | Mixed signals (e.g., slight scale compression + slight text mismatch). | Data is ambiguous. | **Undecidable.** Exclude from primary analysis. Report in appendix as exploratory. |

  ---

  ## Phase 3: Ownership & Escalation (15 Minutes)

  **The RA decides:** Categories 1, 3, 4 (based on data thresholds).
  **The ICC decides:** Category 2 (Substitution). Only the ICC can confirm if a free-text theme is a valid local interpretation or a misunderstanding.
  **The PI decides:** Category 5 (Genuine) and final "Drop" calls on Category 6.

  **Procedure for Judgment Calls:**
  If the RA flags a "Genuine Difference," they must send a memo to the PI and ICC stating: *"I have ruled out Comprehension, Scale, and Substitution artifacts. The remaining variance is unexplained by data."*
  The ICC must reply: *"I confirm this does not look like a translation error to me."*
  The PI must reply: *"I accept this as a finding."*
  **Without both replies, the vignette defaults to Undecidable.**

  ---

  # Scenario Runs

  Here is how the VTP applies to your three invented results.

  ### 1. The Gettier Case (Mirror Partial Fix)
  *   **Data:** Site A (Non-English) diverges from consensus on Standard. Site B (Non-English) matches consensus.
  *   **Mirror Result:** Site A gap closes (matches consensus). Site B gap remains (matches Standard).
  *   **Paraphrase:** Clean everywhere.
  *   **VTP Run:**
      *   Site A is **Translation/Cultural Noise** (Category 4). The specific detail in the Standard version triggered a local association that the Mirror avoided.
      *   Site B is **Genuine Difference** (Category 5). The structure holds, the detail doesn't matter, but the verdict differs.
  *   **Verdict:** Split treatment. Site A Standard data is dropped. Site B data is kept as a real difference.
  *   **Pre-Registration Sentence:** *"For Vignette 4, cross-site comparisons will exclude the Standard Version data from Site A due to cultural specificity artifacts identified via Mirror Version triangulation; Site B Standard data will be retained as primary evidence of structural intuition variance."*

  ### 2. The Promise Case (Scale Squeeze)
  *   **Data:** Huge gap. Site C (Non-English) mean = 6.5, SD = 0.6. Site D mean = 4.0, SD = 1.8.
  *   **Paraphrase:** Clean everywhere.
  *   **Free Text:** Both sites discuss "obligation" and "dying wish" equally.
  *   **VTP Run:**
      *   Comprehension: Pass.
      *   Substitution: Pass.
      *   Scale: **Fail** (Category 3). Site C is exhibiting acquiescence bias or scale compression.
  *   **Verdict:** Report with Caveat. You cannot compare raw means.
  *   **Pre-Registration Sentence:** *"Due to site-level response style artifacts in Vignette 7 (SD < 0.8 at Site C), primary analysis will utilize within-site standardized z-scores rather than raw verdict means, with robustness checks excluding Site C."*

  ### 3. The Free Will Case (The Centerpiece)
  *   **Data:** Large gap on "Could have done otherwise." Gap disappears when wording swaps to local idiom.
  *   **Collaborator Input:** ICC states the local idiom "carries no ability connotation."
  *   **VTP Run:**
      *   This is **Question Substitution** (Category 2).
      *   If the local idiom lacks the "ability" connotation required for the philosophical concept of Free Will, then the original translation was measuring *linguistic ability*, not *philosophical freedom*.
      *   The fact that the gap *disappears* with the idiom proves the original gap was driven by the translation failure, not a difference in free will intuition.
  *   **Verdict:** **Drop.** This is the hard truth. You are not measuring free will at that site with the original wording. You cannot claim a "Genuine Difference" if the measure is invalid.
  *   **What would have to change to survive:** You would need to pre-register the *local idiom* as the valid measure of the construct for that site, and argue that the English "could have done otherwise" is the one lacking nuance. But if your theory relies on the "could have done otherwise" phrasing specifically, you must drop the site from that analysis.
  *   **Pre-Registration Sentence:** *"Vignette 10 original wording will be excluded from cross-site analysis due to construct validity failure (translation connotation mismatch); analysis will proceed only using the collaborator-validated local idiom version, treating the original English phrasing as site-specific noise."*

  ---

  # Limits & Ownership

  ### What This Procedure Cannot Settle
  1.  **Philosophical Validity:** The VTP can tell you if people understood the words. It cannot tell you if they were doing "philosophy." A site might genuinely understand the case and still answer based on a philosophical framework you disagree with. That is a **Genuine Difference**, not an error.
  2.  **The "True" Construct:** If the ICC says the local idiom is the *real* way to ask about free will, and the English is the problem, the VTP flags it as Substitution. Deciding which version is "correct" is a theoretical decision, not a data decision.
  3.  **Undecidable Ambiguity:** If the data is messy (e.g., slight scale compression + slight text mismatch), the VTP forces a "Drop/Undecidable" to protect integrity. It cannot magically resolve noise into signal.

  ### Decision Ownership Matrix
  *   **RA:** Owns the **Thresholds**. (e.g., "The SD is 0.6, which is below the 0.8 cutoff.") This is administrative.
  *   **In-Country Collaborator:** Owns the **Linguistic Validity**. (e.g., "Yes, that free-text theme is a misunderstanding," OR "No, that is a valid local interpretation of the concept.") The PI cannot overrule the ICC on what a word means in their language.
  *   **PI (You):** Owns the **Cost/Benefit**. (e.g., "This vignette is Undecidable, but it's our only measure of X. I am accepting the risk and keeping it with a massive caveat.") The PI takes the heat for keeping noisy data; the RA is protected by the protocol.

  **Final Advice:**
  Your collaborators were burned by teams that pretended culture wasn't a variable. This protocol admits culture *is* a variable that can break your measures. By pre-registering the *exclusion criteria* (the VTP), you protect the collaborators from being accused of "bad data" when the data actually reveals a translation failure. You also protect yourself from HARKing (Hypothesizing After Results are Known) by locking in the rules for dropping vignettes before you look at the full wave.

  If Scenario 3 is your centerpiece, you are in a dangerous spot. If the VTP says "Drop," and you keep it, you are violating your own integrity protocol. If the local idiom removes the gap, your theory (that there is a gap) is likely false, or your measure was wrong. **Drop the site from that analysis.** It is better to have a smaller N and a true finding than a large N and a translation artifact.
