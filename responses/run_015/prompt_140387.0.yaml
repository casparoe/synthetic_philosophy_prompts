answer: |-
  ### **CAPSTONE Q&A PREP SHEET**

  **STRATEGIC CONCESSIONS (Say this in your intro)**
  1.  **"I'm not solving consciousness."** Explicitly state you aren't proving computers *feel*, only asking which systems we *treat* as having moral weight. (Pre-empts Devereaux).
  2.  **"Biology still matters."** Concede that even if a sim counts, real animals suffer *now*, so biological welfare gets priority in practice. (Pre-empts Feld).
  3.  **DROP THE REPLAY CASE.** It's just a time-limited Lookup Table. It does no work the GLUT doesn't do better. Spend that time on the Foam problem.

  ---

  ### **THE 7 OBJECTIONS (Ordered by Damage)**

  **1. The "Sleeping Grandma" Objection (Mr. Devereaux)**
  *   **The Question:** "Your test requires a system to 'improvise' on new inputs. But a sleeping person, a coma patient, or a baby can't do that right now. Are you saying they lose their moral status when they close their eyes?"
  *   **Your 30-Second Answer:** "No, definitely not. My test is about *capacity*, not constant performance. A sleeping brain still has the physical structure to improvise if woken up, unlike a recording. It's like saying a car isn't a car when it's parked—the potential is still in the hardware."
  *   **Honest Note:** **Weak.** You're shifting from "what it's doing" to "what it's made of." Ramos will jump on this: if you care about hardware structure, why not just say biology matters?

  **2. The "Lookup Table" Trap (Ms. Ramos)**
  *   **The Question:** "A Giant Lookup Table has an answer for every possible input. Technically, it *does* track counterfactuals. Why isn't that 'improvisation' via retrieval? You're smuggling in a bias against storage."
  *   **Your 30-Second Answer:** "Because the counterfactuals have to live in the system's *causal process*, not just its output. A lookup table doesn't 'track' anything; it just matches. My test requires the system to *generate* the state, not just hold it. Otherwise, a book is a person."
  *   **Honest Note:** **Dodgy.** This relies on 'causal process' vs. 'input-output,' which functionalists deny matters. You're borderline contradicting "mind is software."

  **3. The "Foam/Counting" Problem (General)**
  *   **The Question:** "If a brain runs overlapping computations at different grain sizes, does that mean there are multiple people in one head? How do you count the patients?"
  *   **Your 30-Second Answer:** "That's the hardest part, and I don't have a perfect count yet. But I'd argue the 'person' is the highest-resolution computation that integrates the most information. Smaller overlaps are just sub-routines, like organs in a body."
  *   **Honest Note:** **Speculative.** You admitted uncertainty here. If they push on 'integration,' you might sound like you're making it up.

  **4. The "Real Animals" Priority (Ms. Feld)**
  *   **The Question:** "Why are we worrying about sci-fi simulations when real chimps are suffering in labs? If a sim counts as much as a chimp, does that mean we can stop worrying about the biological one?"
  *   **Your 30-Second Answer:** "No, my point is to expand the circle, not shrink it. Real animals definitely count. But if we ever build a sim that passes the Improv Test, we shouldn't treat it like a toaster. We need to protect both."
  *   **Honest Note:** **Safe.** This is a political/practical dodge, but it satisfies the welfare concern without breaking your theory.

  **5. The "So What?" (Parent/SWE)**
  *   **The Question:** "Okay, say you're right. What do I do with this? Does this change how we code AI today?"
  *   **Your 30-Second Answer:** "It changes how we test AI. Instead of just checking if it sounds human, we should test if it can handle unexpected inputs without breaking. It gives engineers a metric for 'moral risk' before deployment."
  *   **Honest Note:** **Strong.** This is your best ground. Practical application of a philosophical test.

  **6. The "Dignity" Objection (Mr. Devereaux)**
  *   **The Question:** "Doesn't reducing people to 'computations that matter' strip us of dignity? We aren't just algorithms."
  *   **Your 30-Second Answer:** "I'm not saying people *are* just code. I'm asking: if we *do* treat minds as computational, how do we avoid the absurd result that a rock is a person? It's a safety check, not a definition of soul."
  *   **Honest Note:** **Safe.** As long as you don't claim reductionism is *true*, just useful.

  **7. The "Rock" Restatement (Ms. Ramos)**
  *   **The Question:** "How do you know the rock isn't improvising? Maybe you just can't read its encoding."
  *   **Your 30-Second Answer:** "Because the rock doesn't change its state based on the input in a way that preserves its own structure. The mapping exists in my head, not the rock. The rock doesn't care if I hit it."
  *   **Honest Note:** **Okay.** Relies on the "borrowed counterfactuals" point from your intro. Keep it simple.

  ---

  ### **CRITICAL INTEL**

  **🛑 THE KILLER OBJECTION:**
  **#1 (The Sleeping Grandma).**
  If you hesitate or say "Well, maybe they aren't persons then," you lose the room morally. If you say "It's about hardware," you lose Ms. Ramos logically. You must hold the line on **Dispositional Capacity** (it's about what the system *can* do, not what it *is* doing).

  **💣 THE "HOPE NOBODY ASKS" QUESTION:**
  **#3 (The Foam/Counting Problem).**
  You admitted in your prompt you don't have a solid answer for "how many patients." This is metaphysically messy. If they press hard on "Where exactly does one computation end and another begin?", you will stall. Deflect to "highest resolution integration" and move on.

  **🗑️ USELESS CASE:**
  **The Replay (Case 1).**
  It's redundant. A recording is just a Lookup Table with a time limit. Drop it. It saves you 2 minutes of explanation and reduces surface area for attacks. Focus on **GLUT** (theoretical limit) and **Foam** (individuation problem).
