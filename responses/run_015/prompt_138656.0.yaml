answer: |-
  ### 1. The Design: Stakes, Scale, and Disguise

  **The Stakes Mechanism**
  Do not divide the £40 among 20 students. £2 is noise. To make the stakes real without bankrupting yourself, use the **Random Participant Mechanism**.
  *   **Script:** "At the end of class, I will draw one name from this bingo cage. That person's choices today become binding. I will pay that one student according to the options they selected on the cards in front of them. For the rest of you, the choices are hypothetical, but since any of you could be drawn, you should treat every card as if it counts."
  *   **Why:** This concentrates the budget into a meaningful sum (£0–£40) for one person while maintaining incentive compatibility for all 20. It prevents the "it's only £2" dismissal.
  *   **Visual:** Place four £10 notes (or equivalent coins) visibly on the desk at the front. Do not put them away.

  **The Numbers (Adapted Allais)**
  We need the "Certainty Effect" to bite.
  *   **Decision 1:**
      *   Option A: **£10 for sure.**
      *   Option B: **89% chance of £10, 10% chance of £40, 1% chance of £0.**
  *   **Decision 2:**
      *   Option A: **11% chance of £10, 89% chance of £0.**
      *   Option B: **10% chance of £40, 90% chance of £0.**

  *Note:* In Decision 1, Option A has lower Expected Value (£10) than Option B (£12.90), but offers certainty. In Decision 2, Option B has higher Expected Value (£4) than Option A (£1.10). The "Allais" pattern is choosing 1A (Safety) and 2B (EV/Risk).

  **The Disguise**
  *   **Physical Separation:** Use two different colours of card stock. Collect Decision 1 before distributing Decision 2.
  *   **Contextual Framing:** Label Decision 1 "Fund A" and Decision 2 "Fund B." Do not use "Question 1/2."
  *   **The Filler:** Between Decision 1 and 2, run a 5-minute "calibration" task using the bingo cage that has nothing to do with money. (e.g., "Guess the number drawn. Closest guess gets a piece of candy.") This resets the working memory of the previous numbers.
  *   **Silence Rule:** "Once you receive a card, no talking until I collect them. If you speak, your card is void."

  ### 2. The Third-Party Variant: Verdict

  **Do not use it.**
  Here is why it is broken for this specific session:
  1.  **Confounding Variables:** If a student chooses the "Safe" option in the third-party version (where the common branch pays a charity) but the "Gamble" in the standard version, you cannot tell if they flipped due to the **Independence Axiom** (the mathematical inconsistency) or due to **Social Preference** (warm-glow altruism).
  2.  **Debrief Collapse:** When you try to map the choices to the axiom, a student will object: "I didn't violate independence; I just wanted the charity to have the money." You cannot refute this without a lecture on separability of utility functions, which eats 20 minutes and kills the "aha" moment.
  3.  **What it would show:** If it worked, it would show that the "certainty effect" is robust even when the certainty benefits others. But since you cannot isolate the motive, it teaches ambiguity, not theory.
  4.  **Recommendation:** Stick to the classic self-pay structure. It isolates risk preference. Save the third-party variant for a graduate seminar on social utility.

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 00:05: Setup.** Place cash on desk. Explain the Random Participant Mechanism. Put 20 names in the bingo cage.
  *   **00:05 – 00:15: Decision 1.** Hand out **Blue Cards**. Read instructions aloud. Students mark choice. Collect Blue Cards immediately into a sealed envelope or box.
  *   **00:15 – 00:25: Filler Task.** "The Cage Calibration." Draw 5 numbers from the cage. Students guess the next number. Winner gets a chocolate bar. (Resets attention, uses the prop, creates noise).
  *   **00:25 – 00:35: Decision 2.** Hand out **Pink Cards**. Read instructions. Students mark choice. Collect Pink Cards.
  *   **00:35 – 00:45: Tally & Prep.** While you tally the four patterns on a scrap paper (off-projector, just on your desk), ask the room: "Talk to your neighbour for 2 minutes. Why did you pick what you picked in the second round? Did anyone change their strategy?"
  *   **00:45 – 01:15: Debrief.** Reveal the connection. Map the choices. Draw the tree. Discuss the Axiom. Draw the name for payment.

  ### 4. Materials: Exact Wording

  **Blue Card (Decision 1)**
  > **FUND A PROSPECTUS**
  > You are allocating a grant. Select one portfolio.
  > **Portfolio Alpha:** You receive **£10**. (Certain)
  > **Portfolio Beta:** A random draw determines your payout.
  > *   89% chance of **£10**
  > *   10% chance of **£40**
  > *   1% chance of **£0**
  >
  > *Circle your choice: [ Alpha ]   [ Beta ]*

  **Pink Card (Decision 2)**
  > **FUND B PROSPECTUS**
  > You are allocating a grant. Select one portfolio.
  > **Portfolio Gamma:** A random draw determines your payout.
  > *   11% chance of **£10**
  > *   89% chance of **£0**
  > **Portfolio Delta:** A random draw determines your payout.
  > *   10% chance of **£40**
  > *   90% chance of **£0**
  >
  > *Circle your choice: [ Gamma ]   [ Delta ]*

  **Instructor Script (Intro)**
  > "On your desk is a card. You will make a choice. At the end of class, I will draw one name from this cage. That person's choices today will be enacted for real cash, which is sitting on my desk. If you are not drawn, you get nothing, but since any of you could be drawn, you should choose exactly as you would if you knew you were the one. No talking once you have the card. You have 3 minutes."

  **Instructor Script (The Reveal - Minute 45)**
  > "I want to show you something about the two cards you just filled out. Please take them out. Look at Fund A, Portfolio Beta. Look at Fund B, Portfolio Gamma.
  > In Fund A Beta, 89% of the time you get £10. In Fund A Alpha, 100% of the time you get £10.
  > In Fund B, that 89% chunk where you get £10... is gone. It's replaced by £0 in both options.
  > Mathematically, the difference between Alpha and Beta in Fund A is *identical* to the difference between Gamma and Delta in Fund B. The only thing that changed was a chunk of probability that paid the same amount in both options.
  > If your preference depends only on the money you receive, your choice should not have flipped. If you picked Alpha before, you should pick Gamma now. If you picked Beta before, you should pick Delta now."

  ### 5. Scripts for the Four Patterns

  When you reveal the patterns, address each group directly. Do not shame the inconsistent; do not ignore the consistent.

  **1. Safe then Gamble (Alpha → Delta)**
  *   **Status:** *Inconsistent (Allais Pattern)*
  *   **Script:** "You chose certainty in the first round, but chased the higher payout in the second. You are the majority in this room usually. You felt the pain of the 1% zero in the first round, but ignored it in the second. You violated the Independence Axiom. You aren't 'irrational' in life, but your preferences cannot be represented by a single expected utility function."

  **2. Gamble then Gamble (Beta → Delta)**
  *   **Status:** *Consistent (Risk Neutral/Seeking)*
  *   **Script:** "You ignored the certainty both times. You went for the Expected Value both times. You are consistent with Expected Utility Theory. You treated the 1% risk of zero as just another number. This is the behaviour the axiom assumes."

  **3. Safe then Safe (Alpha → Gamma)**
  *   **Status:** *Consistent (Risk Averse)*
  *   **Script:** "You took the sure money, and when there was no sure money, you took the safer gamble. You are consistent with Expected Utility Theory. You are highly risk-averse. You don't violate the axiom; you just have a very curved utility function for money."

  **4. Gamble then Safe (Beta → Gamma)**
  *   **Status:** *Inconsistent (Reverse Allais)*
  *   **Script:** "This is rare. You took the risk when the certainty was available, but played safe when everything was risky. This also violates the axiom, but in the opposite direction. It suggests you might be 'risk-seeking in losses' or simply found the framing confusing."

  ### 6. Anticipated Failures & Fixes

  **Failure 1: "I don't believe you'll pay."**
  *   *Symptom:* Smirking, choosing randomly.
  *   *Fix:* Pre-commitment. Bring a departmental cheque requisition form or a signed IOU on official letterhead. Say: "I have already signed the payment voucher. It is in my bag. The name drawn gets it today." Put the cash on the desk *before* they start.

  **Failure 2: "1% is zero."**
  *   *Symptom:* Students treat Fund A Beta as "£10 or £40" ignoring the zero.
  *   *Fix:* During the debrief, ask: "Who thought the 1% didn't matter?" If hands go up, say: "If 1% is zero, then Beta is 99% chance of £10 or £40. Alpha is 100% £10. The gap is tiny. Why did so many of you strongly prefer Alpha? The 1% mattered more than you admit."

  **Failure 3: "Risk aversion isn't irrational."**
  *   *Symptom:* The session devolves into a moral debate about caution.
  *   *Fix:* Shut it down firmly. "Risk aversion is rational. *Inconsistent* risk aversion is the problem. If you are risk-averse, be risk-averse in both rounds. The axiom doesn't say you must love risk; it says you must apply your attitude consistently when the odds shift equally."

  ### 7. The Debrief Map

  1.  **The Common Consequence:** Point to the 89% chance of £10 in Fund A Beta. Point to the 89% chance of £0 in Fund B.
  2.  **The Cancellation:** Explain that since this 89% chunk is the *same* for both options in Fund B, and *almost* the same in Fund A, a rational agent should cancel it out mentally.
  3.  **The Flip:** Highlight that the students who flipped treated the "Certainty" of Fund A Alpha as special, but once that certainty was removed in Fund B, they reverted to math.
  4.  **The Axiom:** "The Independence Axiom says: If you prefer X to Y, you should still prefer X to Y even if both are mixed with a common probability Z. You mixed both with Z (the 89% chunk). You flipped. Therefore, your choices violate the axiom."
  5.  **Rationality:** "Does this mean you are stupid? No. It means Expected Utility Theory is a model, and like all models, it breaks when human psychology (like the fear of regret) enters the equation."

  ### 8. Withdrawal Conditions: The Weakest Link

  **I would withdraw this design if:**
  During the setup, I sense the room does not believe the payment is real.
  *   **Observation:** If students are laughing during the "Random Participant" explanation or asking "What if no one picks a card?", the stakes are dead.
  *   **Consequence:** Without real stakes, the "Certainty Effect" evaporates. They will treat it as a math puzzle and pick the Highest Expected Value both times (Beta/Delta). You will get 90% consistency, and the lesson will fail.
  *   **The Weakest Step:** The argument that **"Violating the axiom implies irrationality."**
  *   **Why:** A sharp student will leave saying, "So what? The axiom is wrong, not me." The activity proves the *model* fails, not that the *student* is irrational.
  *   **Mitigation:** Be frank in the debrief. "This activity doesn't prove you are irrational. It proves the Independence Axiom is a poor description of human choice. We study it not because it is truth, but because it is the foundation we have to break to build better models." If you try to defend the axiom as "True Rationality," you will lose the room. Defend it as "The Standard Benchmark."

  **Final Check:**
  *   Budget: £40 covers one max payout (£40).
  *   Time: 75 mins is tight but doable if you keep the filler short.
  *   Prop: Bingo cage used for name draw and filler.
  *   Projector: Off.
  *   Names: Allais/Independence withheld until Minute 45.

  Run it exactly as scripted. Do not ad-lib the numbers. Do not let them keep the first card. Good luck.
