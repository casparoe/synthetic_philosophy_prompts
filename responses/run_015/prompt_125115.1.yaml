  **Analyst's Notes (Pre-Draft)**
  *   *Candidate Correspondences:* Mind/State, Trace/Archive, Recall/Ceremony, Forgetting/Decay, Repression/Censorship, Therapy/Reconciliation, Failure/Neglect.
  *   *Pruned for Weight:* Mind/State (Unified subjectivity is the critical break), Trace/Archive (Surrogacy problem), Therapy/Reconciliation (Psychological vs. Political healing).
  *   *Discarded:* Neural mechanisms, biological decay (too literal), involuntary forgetting (groups choose defunding).
  *   *Key Tension:* The "Care" camp needs internal states (love); the "Therapy" camp needs functional outcomes (health). The analogy fractures on whether memory is a state or a practice.
  *   *Verdict:* The setup is broken; the two camps use the same vehicle but incompatible properties.

  ***

  **The Elastic Analogy: A Audit of Collective Memory**

  You are right to suspect the device, but wrong to assume it is the *same* analogy doing both jobs. [Defend] The duty camp and the therapy camp use the same *vehicle* (the individual) but rely on incompatible *properties* of that vehicle. The duty camp requires a phenomenology of care (internal state); the therapy camp requires a functionalist psychology (health outcome). When you press the disanalogies, the analogy does not stretch; it snaps.

  **Table 1: The Mapping of Individual to Collective Memory**

  | Individual Domain | Collective Domain (Standard Mapping) | Critical Disanalogy |
  | :--- | :--- | :--- |
  | **Subject** | The People / State | Groups lack unified consciousness or phenomenology. |
  | **Trace** | Neural Pathway | Archive, Monument, Curriculum (External). |
  | **Recall** | Conscious Retrieval | Ceremony, Education, Retrieval from Archive. |
  | **Forgetting** | Memory Decay / Loss | Defunding, Destruction, Neglect of Sites. |
  | **Repression** | Psychological Defense | Censorship, Political Silence, Amnesty. |
  | **Therapy** | Healing / Integration | Reconciliation, Stability, Political Function. |
  | **Failure** | Neglect of Duty / Trauma | Injustice, Instability, Recurrence of Violence. |

  **The Disanalogies That Matter**
  The curiosity-level disanalogies (brains vs. buildings) do not matter. The fatal disanalogy is unified subjectivity. [Defend] An individual feels the pain of the past; a polity does not. When the therapy camp argues for forgetting as healing, they import the individual's capacity for psychological relief. But a state cannot feel relief. It can only achieve stability. If the goal is stability, forgetting might work, but it is not *therapy*; it is pacification. Conversely, when the duty camp argues for memory as care, they import the individual's capacity for love. A state cannot love. It can only honor.

  This importation does the work for both sides illegitimately. The therapy side relies on the *possibility of a cure* which groups do not experience phenomenologically. The duty side relies on the *disposition of care* which groups do not possess emotionally. [Hedge] One might argue groups have "corporate emotions," but this is metaphorical unless one posits a group mind, which lacks empirical grounding.

  **The Problem of Mnemonic Surrogacy**
  Your worry about surrogacy is the strongest lever against the analogy. [Defend] If collective memory resides in archives and professionals, it is not memory in the individual sense; it is record-keeping. An individual who remembers only via notebook does not remember; they retrieve. If we accept this, the duty camp's claim collapses. You cannot outsource the duty of care. Hiring a mourner does not discharge the obligation of love. Therefore, if collective memory is surrogate-holding, it cannot be a duty of *memory* owed to victims in the thick ethical sense Margalit describes.

  However, this cuts deeper against the therapy camp. [Defend] If the archive remains untouched, the past is not "let go." The trauma is not integrated; it is stored. The fading of living memory is not healing when the institutional record remains static and unprocessed. The therapeutic argument requires the *internal* dissolution of the trace, but collective memory is *external* persistence. You cannot therapize a stone monument.

  **The Promise Alternative**
  Your suspicion regarding promises and bequests is the most robust path forward. [Defend] Obligations to the dead do not require the dead to be harmed by forgetfulness; they require the living to maintain a normative status. This structural feature transfers to groups better than care or therapy. A state can keep a promise even if it feels no love. A state can violate a bequest even if it feels no pain.

  If we shift from memory-as-psychology to memory-as-fidelity, the duty conclusion survives, but the therapy conclusion fails. [Defend] You cannot argue for forgetting based on therapeutic need if the obligation is deontological (promise-based). Health cannot override fidelity in this framework. However, this depends on the contested empirical claim that groups can sustain normative commitments across generations without continuous psychological reinforcement. [Hedge] If group identity fractures, the "promisee" (the nation) may no longer exist to hold the duty.

  **Verdict and Better Analogy**
  The individual analogy is broken because it supports contradictory conclusions by smuggling in incompatible premises. [Defend] A comparison that supports both conclusions supports neither. It is a rhetorical ornament, not an argument.

  A better analogy is **institutional record-keeping**. [Least Bad Option] Treat collective memory not as a mind, but as a legal or administrative function.
  1.  **Duty:** The duty is not to "remember" (feel) but to "maintain the record" (accurate accounting). This survives surrogacy. Archives *do* discharge this duty.
  2.  **Therapy:** The case for forgetting becomes a case for "archival closure" or "statutes of limitation." This is not healing; it is administrative efficiency.

  **Final Verdict:** Neither conclusion survives the disanalogies intact. The duty claim must be rewritten as fidelity to truth, not care for victims. The therapy claim must be rewritten as political stability, not psychological healing. [Defend] The setup is broken because it assumes "memory" is a single phenomenon across individual and collective domains. It is not. It is a category error to treat a polity as a patient or a lover.

  **What Would Change My Mind**
  I would revise this verdict if empirical sociology demonstrated that groups possess a phenomenology of recall—that is, if "national trauma" was shown to be more than an aggregation of individual traumas. [Hedge] Currently, evidence suggests group memory is purely distributed and external. If neuroscience or sociology found a mechanism for unified group consciousness, the analogy might hold. Until then, we must stop treating nations as people.
