prompt: |-
  I chair the renewal panel for a national funder's programme-grant scheme. Twice a year, seven of us decide whether to continue roughly fifteen multi-group research programmes for another five-year term, and we must attach to each decision a one-page rationale a lay board can sign off on. The panelists are working scientists with no philosophy training, and we have about forty-five minutes per programme using only documents the teams already submit: the founding proposal, the previous renewal report, and the current progress report with its publication list. No new evidence, no interviews.

  Our arguments keep reinventing, badly, the vocabulary of Lakatos's methodology of scientific research programmes. Someone says a group has stopped predicting anything and is only patching its model; someone replies that every worthwhile programme looks like that for a while; we end up voting by temperament. I want a decision procedure instead. It must operationalize the distinctions that do the work — the protected core versus the belt of auxiliary hypotheses, a progressive versus a degenerating problem shift, an auxiliary that increases what the programme claims and predicts versus one adopted purely to absorb a result that had already come in, and a novel fact anticipated in advance versus one merely accommodated afterward — using only the paperwork we have, in the time we have, in language a physicist or a geneticist will apply without being taught the theory. Give it as ordered questions, state what counts as a sufficient answer to each, say where it terminates in a wind-down and where it hands the question to the board because the issue is our appetite for risk rather than a fact about the science, and mark plainly the points where judgment cannot be eliminated and who owns it.

  Two things will make or break it. First, several of our applicants now file what I call a deferral register: at the outset they list the anomalies they intend to set aside and those they claim they will solve. Does an anomaly's appearing on that list exempt it from counting against the programme, or does declaring it merely make a later degenerating verdict cleaner? And where does repeated narrowing of the class of systems the core is claimed to cover fall — content-decreasing, or genuine discovery about scope — when each narrowing comes with a well-argued paper explaining why the broader claim was overstated? Second, I take Lakatos to hold that whether a programme is degenerating is visible only with hindsight, and that young programmes deserve a long leash; we have an afternoon and a fixed budget. Tell me what my procedure is doing that his framework forbids, and what dated proxy it substitutes for a historical verdict.

  Then run it on three cases. (1) A programme that stated three quantitative results in advance and had all three confirmed, but whose model now needs five auxiliary parameters fitted after the fact, two of them introduced after a measurement conflicted. (2) A programme that registered two anomalies for a ten-year deferral, deferred them, and in the meantime published heavily on questions internal to its own framework, work everyone agrees is excellent and that settles nothing anyone outside cares about. (3) Our flagship, which three of us including me were trained in and which the board cites as a success, whose core claim has been narrowed four times over three terms. If the procedure says to wind down (3), say so plainly and tell me whether to believe it. Finally, state what the procedure cannot do — in particular whether it can distinguish a degenerating programme from a field whose instruments are temporarily inadequate, since that distinction decides most of our hard cases.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a renewal panel for a national funder's programme-grant scheme.
      *   **Task:** Create a decision procedure for renewing multi-group research programmes (5-year terms).
      *   **Constraints:**
          *   Panelists: Working scientists (no philosophy training).
          *   Time: ~45 minutes per programme.
          *   Evidence: Founding proposal, previous renewal report, current progress report + pubs (no new evidence, no interviews).
          *   Output: One-page rationale for a lay board.
          *   Framework: Operationalize Lakatos's Methodology of Scientific Research Programmes (MSRP) without using jargon.
          *   Specific Issues to Address:
              *   "Deferral Registers" (listing anomalies to ignore/solve later).
              *   Narrowing scope (content-decreasing vs. genuine discovery).
              *   Hindsight problem (Lakatos says degeneration is historical; we have an afternoon).
              *   Risk appetite vs. scientific fact.
              *   Judgment ownership.
          *   Test Cases:
              1.  3 predicted results confirmed, but 5 post-hoc auxiliary parameters added (2 after conflict).
              2.  2 anomalies deferred (10-year), heavy internal publication, no external impact.
              3.  Flagship programme (panel trained in it), core narrowed 4 times over 3 terms.
          *   Limitations: Distinguishing degeneration from temporary instrumental inadequacy.

  2.  **Analyze the Lakatosian Framework in this Context:**

      *   *Hard Core:* The fundamental assumptions not to be abandoned.
      *   *Protective Belt:* Auxiliary hypotheses adjusted to protect the core.
      *   *Positive Heuristic:* The plan for developing the programme.
      *   *Negative Heuristic:* What not to touch (the core).
      *   *Progressive Problem Shift:* Theory predicts novel facts that are corroborated.
      *   *Degenerating Problem Shift:* Theory only accommodates known facts, adds ad hoc auxiliaries, loses empirical content.
      *   *The Tension:* Lakatos emphasizes long-term historical assessment. The panel has 45 minutes and a 5-year funding cycle. The procedure must act as a *proxy* for historical verdicts.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Goal:* Translate MSRP concepts into scientist-friendly questions based on available documents.
      *   *Structure:* Ordered questions, sufficiency criteria, termination points (wind-down vs. board decision), judgment markers.
      *   *Language:* Avoid "epistemological," "heuristic," "auxiliary." Use "prediction," "adjustment," "scope," "explanation."

      *   *Step 1: The Core vs. The Adjustments.*
          *   Need to identify what changed.
          *   Question: Did the fundamental claim change, or just the details?
          *   Lakatos concept: Hard Core vs. Protective Belt.

      *   *Step 2: Prediction vs. Accommodation.*
          *   Crucial for "Progressive."
          *   Question: What was stated *before* the data arrived?
          *   Lakatos concept: Novel Fact vs. Accommodation.

      *   *Step 3: The Cost of Adjustments.*
          *   Did fixing a problem make the theory simpler or more complex/less applicable?
          *   Lakatos concept: Content-increasing vs. Content-decreasing.
          *   *Addressing the "Narrowing Scope" issue:* Is narrowing an admission of failure or a refinement?
          *   *Addressing the "Deferral Register":* Does listing an anomaly excuse it? No, it creates a contract.

      *   *Step 4: External vs. Internal.*
          *   Is the work talking to the world or just itself?
          *   Lakatos concept: Empirical progress vs. Theoretical elaboration.

      *   *Step 5: The Verdict.*
          *   Renew, Wind-down, or Board Risk Decision.

  4.  **Addressing the Specific "Two Things" (Philosophical Constraints):**

      *   *Deferral Registers:* Listing an anomaly doesn't exempt it; it creates a milestone. If missed, it counts as degeneration. It makes the verdict *cleaner* because the contract was explicit.
      *   *Narrowing Scope:* If narrowing excludes previously claimed phenomena without new independent evidence, it's content-decreasing (degenerating). If narrowing is based on new positive discovery (e.g., "this mechanism only works in X condition"), it's progressive.
      *   *Hindsight/Time:* The procedure admits it cannot determine ultimate truth. It determines *momentum*. It substitutes "Novel Prediction Corroborated" for "Historical Success." It acknowledges the 5-year cycle is a snapshot, not the full history.

  5.  **Running the Test Cases:**

      *   *Case 1 (3 predicted, 5 post-hoc params):*
          *   Predictions good (Progressive).
          *   Post-hoc params bad (Degenerating belt).
          *   Verdict: Conditional Renewal (fix the belt) or Wind-down if the core relies on the params. Likely "Board Risk" because the core predictions worked, but the model is getting clunky.
      *   *Case 2 (Deferred anomalies, internal pubs):*
          *   Deferrals missed? If 10-year deferral is active, maybe okay.
          *   Internal pubs = Theoretical progress, not Empirical.
          *   Verdict: Wind-down. No novel facts, just belt-tinkering.
      *   *Case 3 (Flagship, narrowed 4 times):*
          *   Narrowing 4 times = Content decreasing?
          *   Panel bias = Conflict of interest.
          *   Verdict: Procedure says Wind-down. Should you believe it? Yes, because scope narrowing is the classic sign of degeneration, regardless of prestige.

  6.  **Addressing Limitations:**

      *   *Instrumental Inadequacy:* Can the procedure distinguish a bad theory from bad tools?
      *   Answer: No. Both look like "failed predictions."
      *   Mitigation: Look for *independent* evidence of tool improvement. If tools aren't improving and predictions fail, bet on theory.

  7.  **Refining the Output:**

      *   Tone: Professional, directive, clear.
      *   Format: Structured procedure, followed by the philosophical commentary, then the case studies, then limitations.
      *   Check against constraints: 45 mins? Yes, if questions are sharp. Lay board rationale? Yes, the output of the procedure feeds that.

  8.  **Self-Correction/Iterative Polishing:**

      *   *Critique:* Is "Wind-down" too harsh for a 5-year review?
      *   *Adjustment:* Use "Non-renewal recommendation" but acknowledge the board decides.
      *   *Critique:* Is the distinction between "Narrowing" and "Refinement" clear enough?
      *   *Adjustment:* Add a specific test: Did the narrowing allow a *new* prediction in the narrow scope, or just save the old one?
      *   *Critique:* The prompt asks to mark where judgment cannot be eliminated.
      *   *Adjustment:* Explicitly label "Panel Judgment Required" sections.
      *   *Critique:* The prompt asks what the procedure does that Lakatos forbids.
      *   *Adjustment:* Lakatos forbids snap judgments. This procedure forces a snap judgment based on proxies (publications/predictions). I need to be explicit about this substitution.

  9.  **Final Review against Prompt Requirements:**
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Termination points (wind-down vs board)? Yes.
      *   Judgment ownership? Yes.
      *   Deferral register handling? Yes.
      *   Narrowing scope handling? Yes.
      *   Hindsight/Time conflict? Yes.
      *   Three cases run? Yes.
      *   Limitations (instruments)? Yes.

      *(Self-Correction on Case 3)*: The prompt asks "If the procedure says to wind down (3), say so plainly and tell me whether to believe it." I need to be decisive here. If the procedure is sound, I must advise trusting it over bias.

      *(Self-Correction on Lakatos Critique)*: Lakatos warns against falsifying a programme too soon. This procedure risks that. I need to frame the "Risk" category carefully.

      *(Final Polish)*: Ensure the language is "physicist/geneticist friendly." No "epistemic," "ontological," etc. Use "claim," "test," "result," "adjustment."

  10. **Drafting the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  # The Programme Renewal Decision Procedure (PRDP)

  **Purpose:** To determine whether a research programme demonstrates *empirical momentum* (renew) or *theoretical stagnation* (wind-down) based on documentary evidence alone.
  **Time Allocation:** 45 minutes per programme.
  **Users:** Working scientists (no philosophy training required).
  **Output:** A recommendation (Renew / Wind-Down / Board Risk Decision) and bullet points for the lay rationale.

  ---

  ## Part I: The Decision Procedure

  ### Step 1: The Contract Check (Deferrals and Predictions)
  **Question:** Compare the *Founding Proposal* and *Previous Renewal Report* against the *Current Progress Report*.
  1.  **Predictions:** List every specific quantitative or qualitative result the team stated they would find *before* the data was collected.
  2.  **Deferrals:** List every anomaly or failure explicitly registered in a "deferral register" or equivalent "future work" section in prior documents.

  **Sufficient Answer for Renewal:**
  *   ≥ 70% of stated predictions were confirmed.
  *   Registered deferrals are either resolved or explicitly re-registered with a credible reason for delay (e.g., instrument failure documented externally).

  **Termination Point:**
  *   If < 50% of predictions confirmed **AND** deferrals are ignored or unresolved without explanation → **Recommend Wind-Down.**
  *   If predictions are met but deferrals are missed → **Proceed to Step 2.**

  **Judgment Ownership:** Panel. This is a factual audit of the team's own prior claims.

  ### Step 2: The Cost of Adjustment (The "Belt" Test)
  **Question:** For every confirmed prediction that required a model change, or every failed prediction that was explained away:
  1.  Did the team add new parameters, conditions, or variables *after* seeing the data?
  2.  Did these additions allow the model to predict *anything new*, or did they only make the model fit the *old* data?

  **Sufficient Answer for Renewal:**
  *   Adjustments lead to *new* testable claims in the current report (Content-Increasing).
  *   Adjustments are simpler or equal in complexity to the previous version.

  **Termination Point:**
  *   If adjustments are purely to fit past data (Content-Decreasing) and occur in > 50% of the programme's major claims → **Recommend Wind-Down.**
  *   If adjustments are mixed → **Proceed to Step 3.**

  **Judgment Ownership:** Panel. You must judge whether a parameter is "physical" or "fudge." If the team cannot justify the parameter's physical reality in the text, count it as a "fudge."

  ### Step 3: Scope and Narrowing (The "Domain" Test)
  **Question:** Compare the scope of the *Founding Proposal* to the *Current Progress Report*.
  1.  Has the class of systems/phenomena the core claim applies to shrunk? (e.g., from "all mammals" to "rodents under stress").
  2.  If yes, did this narrowing result in a *new* successful prediction within the narrow scope?

  **Sufficient Answer for Renewal:**
  *   Scope is stable or expanded.
  *   OR: Scope narrowed, but the narrower model predicted a novel fact that was confirmed.

  **Termination Point:**
  *   If scope narrowed repeatedly (≥ 2 times over the term) *without* novel confirmation in the new narrow scope → **Recommend Wind-Down.** (This indicates the core is being protected by retreat, not discovery).
  *   If scope narrowed but yielded high-precision novel facts → **Proceed to Step 4.**

  **Judgment Ownership:** Panel. Distinguishing "genuine discovery of limits" from "retreat from failure" requires scientific intuition.

  ### Step 4: External vs. Internal Progress (The "Echo Chamber" Test)
  **Question:** Review the publication list and citations.
  1.  Are the papers solving problems defined by the *world* (experimental data, external anomalies) or by the *model* (internal consistency, mathematical elegance)?
  2.  Are the papers cited by groups *outside* this funding programme?

  **Sufficient Answer for Renewal:**
  *   Majority of work addresses external empirical problems.
  *   Evidence of uptake by independent groups.

  **Termination Point:**
  *   If work is exclusively internal (model-tinkering) with no external empirical engagement → **Recommend Wind-Down.**
  *   If work is internal but solves a theoretical blockage preventing future tests → **Board Risk Decision.**

  **Judgment Ownership:** Panel.

  ### Step 5: The Risk Handoff
  **Question:** If the procedure has not triggered a Wind-Down, but Step 2 or 3 showed significant "adjustments" or "narrowing":
  *   Is the potential payoff of this programme high enough to justify the risk that it is degenerating?

  **Action:**
  *   **Recommend Renewal:** If the procedure is green.
  *   **Recommend Wind-Down:** If the procedure triggered termination.
  *   **Refer to Board:** If the science is ambiguous (mixed signals) but the strategic value is high. The Board owns the risk appetite; the Panel owns the scientific assessment.

  ---

  ## Part II: Philosophical Operationalization (The "Why")

  ### 1. The Deferral Register
  **Procedure Stance:** An anomaly on a deferral register is **not exempt**. It is a **contract**.
  **Rationale:** Lakatos allows for a "protective belt" to absorb anomalies, but only if the programme remains progressive. A deferral register operationalizes the "negative heuristic."
  *   **If resolved:** It counts as progressive problem shift.
  *   **If ignored/missed:** It counts as degeneration.
  *   **Why:** Declaring an anomaly makes the later verdict *cleaner*. It removes the excuse of "we didn't know that was a problem." It transforms an unknown unknown into a known known. If you flag it and miss it, you have failed the positive heuristic.

  ### 2. Narrowing Scope
  **Procedure Stance:** Narrowing is **Content-Decreasing (Degenerating)** unless it yields **Novel Prediction**.
  **Rationale:** Lakatos distinguishes between a theory that explains *less* (degenerating) and a theory that explains *less but more precisely* (progressive).
  *   **Degenerating:** "Our theory works for all X, except X1, X2, X3..." (Retreat).
  *   **Progressive:** "Our theory works only for X under condition Y, and therefore we predict Z." (Refinement).
  *   **The Test:** Did the narrowing allow you to say something *new* that you couldn't say before? If the narrowing only saves the old claims, it is degeneration.

  ### 3. Hindsight vs. The Afternoon
  **What this procedure does that Lakatos forbids:** Lakatos argues that degeneration is only visible in *historical hindsight*. He forbids falsifying a programme based on a short-term snapshot.
  **The Proxy:** This procedure substitutes **Novel Prediction Corroboration** for **Historical Success**.
  *   We cannot wait 50 years. We use the 5-year cycle as a microcosm.
  *   **The Trade-off:** We risk killing a "young" programme that is temporarily stuck (Type I Error). We mitigate this via the **Board Risk Decision** (Step 5). If the panel sees potential despite the metrics, the Board pays for the risk.
  *   **The Verdict:** We are not judging "Truth." We are judging "Momentum." A programme can be true but degenerating (no new ideas); a programme can be false but progressive (generating new tests). We fund momentum.

  ### 4. Judgment Ownership
  *   **Factual Audit (Step 1):** Panel (Objective).
  *   **Model Complexity (Step 2):** Panel (Subjective but expert).
  *   **Scope Narrowing (Step 3):** Panel (Subjective but expert).
  *   **Risk Appetite (Step 5):** Board (Political/Strategic).
  *   **Ultimate Truth:** No one. This procedure explicitly admits it cannot determine truth, only funding-worthiness.

  ---

  ## Part III: Case Studies

  ### Case 1: The Parameter Bloat
  *   **Data:** 3/3 predictions confirmed. 5 auxiliary parameters added post-hoc (2 after conflict).
  *   **Procedure Run:**
      *   Step 1: Pass (Predictions met).
      *   Step 2: **Fail.** 2 parameters introduced *after* conflict to absorb the result. This is classic "ad hoc auxiliary hypothesis." Unless those parameters predict something *new* in the current report, this is content-decreasing.
      *   Step 3: N/A.
      *   Step 4: N/A.
  *   **Verdict:** **Refer to Board (Risk Decision).**
  *   **Rationale:** The core predicts well (rare and valuable), but the model is becoming unwieldy. The Board must decide if the predictive power justifies the theoretical ugliness.
  *   **Lay Rationale:** "The programme delivers accurate results, but the underlying model is becoming increasingly complex to maintain that accuracy. Renewal is recommended contingent on simplifying the model."

  ### Case 2: The Deferral Specialists
  *   **Data:** 2 anomalies deferred (10-year). Heavy internal publication. No external impact.
  *   **Procedure Run:**
      *   Step 1: **Fail.** Deferrals are active (10-year > 5-year term), but no progress reported on them.
      *   Step 2: **Fail.** Internal publications = theoretical elaboration, not empirical adjustment. No new predictions.
      *   Step 4: **Fail.** "Settles nothing anyone outside cares about."
  *   **Verdict:** **Recommend Wind-Down.**
  *   **Rationale:** This is a degenerating problem shift. The protective belt is being thickened (internal math) to protect the core from the deferred anomalies. No novel facts.
  *   **Lay Rationale:** "The team has focused on internal theoretical consistency rather than testing their claims against new data. Key unresolved issues from the start of the grant remain unaddressed."

  ### Case 3: The Flagship (Your Programme)
  *   **Data:** Core claim narrowed 4 times over 3 terms. Panel trained in it. Board cites as success.
  *   **Procedure Run:**
      *   Step 3: **Fail.** Narrowing 4 times is excessive.
      *   **Crucial Check:** Did the 4th narrowing yield a *novel prediction* confirmed in this term?
          *   *If No:* **Recommend Wind-Down.**
          *   *If Yes:* **Refer to Board.**
      *   **Assumption:** You imply the narrowing is to save the claim, not generate new facts.
  *   **Verdict:** **Recommend Wind-Down.**
  *   **Should you believe it?** **Yes.**
  *   **Why:** This is the exact scenario Lakatos warns against. A programme that survives only by retreating to a smaller and smaller domain is degenerating, regardless of its prestige or your training. The "Flagship" status is a sunk cost fallacy. The procedure protects you from your own bias.
  *   **Lay Rationale:** "While historically significant, the programme's scope has reduced significantly over time without corresponding increases in predictive precision. Funds should be redirected to more expansive inquiries."

  ---

  ## Part IV: Limitations (What This Cannot Do)

  ### 1. The "Bad Instrument" Problem
  **Limitation:** The procedure **cannot** reliably distinguish a degenerating programme from a field whose instruments are temporarily inadequate.
  *   **Why:** Both look like "Failed Predictions" in Step 1.
  *   **Risk:** You may wind down a progressive programme because the microscope isn't good enough yet.
  *   **Mitigation:** In Step 2, look for *independent* evidence of instrument improvement. If the team says "we failed because the tool broke," is there external proof the tool is being fixed? If the tool is state-of-the-art and still fails, bet on the theory being wrong, not the tool.
  *   **Ownership:** Panel. You must judge if the "instrument failure" excuse is plausible based on the wider field's status (which you know as working scientists).

  ### 2. The "Young Programme" Problem
  **Limitation:** Lakatos says young programmes need a long leash. This procedure applies a 5-year leash.
  *   **Risk:** Killing a breakthrough before it matures.
  *   **Mitigation:** Use Step 5 (Board Risk). If the panel feels the science is "young but promising" despite low prediction counts, flag it for Board Risk. Do not force a Wind-Down if the *potential* for novelty is high, even if current novelty is low.

  ### 3. The "Truth" Problem
  **Limitation:** This procedure assesses *funding viability*, not *scientific truth*.
  *   **Reality:** A degenerating programme might be true (e.g., Newtonian physics in the 19th century). A progressive programme might be false (e.g., Phlogiston theory, which was very progressive for a time).
  *   **Instruction:** Do not argue about truth. Argue about **momentum**. Fund the horse that is running, not the horse that is standing still, even if the running horse is running in the wrong direction. You can correct the direction later; you cannot fund a dead horse.

  ### Final Instruction to the Chair
  When the panel debates, stop the conversation if it turns to "Is this theory true?" Redirect to: **"Did they predict this before they saw it?"** and **"Did fixing the problem make the theory broader or narrower?"** If you stick to those two questions, you will operationalize Lakatos without needing to read him.
