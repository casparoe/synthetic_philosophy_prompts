answer: |-
  # Joint Statement on Consciousness, Access, and Overflow

  **Signatories:** A Proponent of Global Workspace Theory and a Proponent of the Phenomenal Overflow View

  **Date:** 24 May 2024

  Following a year of adversarial collaboration, we issue this joint statement to record our convergence, specify our remaining empirical disagreements, and isolate verbal confusions that have hindered progress. We designate our positions as **Global Workspace Theory** (GWT) and the **Phenomenal Overflow View** (Overflow). We both accept that the distinction between access consciousness and phenomenal consciousness is worth drawing, that workspace ignition is a real and measurable neural event, and that consciousness is not an illusion.

  ## 1. Agreed Claims

  1.  **Neural Ignition:** A specific pattern of sustained, amplified neural activity involving fronto-parietal networks (ignition) is a necessary condition for stable verbal report and deliberate reasoning.
  2.  **Sensory Buffers:** High-capacity, short-duration sensory buffers exist prior to ignition; both sides agree these buffers hold more information than can be reported, but disagree on their phenomenal status.
  3.  **Non-Identity:** Phenomenal consciousness is not logically identical to cognitive access; it is possible to conceive of one without the other, even if they covary in standard conditions.
  4.  **Phenomenal Data:** Subjects' reports of rich scenes—including the periphery and the fringes of attention—are data that require explanation, not merely errors to be dismissed.
  5.  **Report Bottleneck:** Report-based measures introduce a post-perceptual bottleneck that may underestimate the contents of consciousness; no-report paradigms are methodologically necessary.
  6.  **Decoding Limits:** Neural decoding of sensory content without report is evidence for retention, but does not alone prove phenomenal consciousness without a link to subjective experience.
  7.  **Confidence Tracking:** Metacognitive confidence ratings track the strength of phenomenal experience more closely than binary yes/no report, even when report fails.
  8.  **GWT Concession:** The GWT side acknowledges it overstated the claim that ignition is necessary for *any* subjective feeling; some primitive feelings may precede global availability.
  9.  **Overflow Concession:** The Overflow side acknowledges it overstated the claim that subjective impression is immune to reconstructive error; memory and expectation colour reports of richness.
  10. **Attentional Gating:** Attention modulates the probability of ignition but does not exhaust the contents of early sensory registration; unattended stimuli are processed to a significant degree.
  11. **Downstream Availability:** A distinction must be drawn between 'availability for report' and 'availability for any downstream consumer'; the latter is broader than the former.
  12. **Resolution Loss:** The transition from high-capacity sensory registration to globally available content involves a loss of resolution and a shift from analogue to categorical representation.

  ## 2. Disagreements Table

  | crux_id | crux | workspace formulation | overflow formulation | agreed bearing test | workspace prediction | overflow prediction | genuine_or_verbal | note |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | C1 | Is the high-capacity store in Sperling-style tasks phenomenally conscious or a non-conscious buffer? | The store is a detailed non-conscious sensory buffer; consciousness requires selection into the workspace. | The store is phenomenally conscious but rapidly decays before it can be accessed for report. | (a) Partial report with cue delays of 100 ms and 500 ms, crossed with a pattern mask and with a concurrent six-digit load held across encoding, delay and report, plus separate trials on which subjects make an objective more-curved-than-straight judgement and rate their confidence. | High load will prevent ignition; confidence will drop in line with report accuracy; no consciousness without access. | High load will prevent access but not feeling; confidence will remain high despite poor report accuracy. | Genuine | Empirical test of the load effect on confidence vs accuracy. |
  | C2 | Can report-based measures settle questions about phenomenal consciousness? | Report is the only objective proxy; without it, we measure unconscious processing unless neural decoding matches content specifically. | Report underestimates consciousness; no-report or neural-decoding measures showing detailed content count as evidence for phenomenology. | (b) A crowded-flanker display in which the target cannot be identified yet subjects report a determinate-looking jumble, scored against what a gist-plus-reconstruction model predicts. | Reports of 'jumble' are reconstructed gists; neural decoding will show only low-frequency gist information. | Reports of 'jumble' reflect genuine high-frequency phenomenal detail; neural decoding will recover fine-grained features. | Genuine | Depends on decoding resolution. |
  | C3 | Is the apparent richness of crowded and peripheral vision perceived or reconstructed from a gist? | Richness is a reconstruction based on gist and prior expectations; the periphery is phenomenally sparse. | Richness is genuinely perceived in the moment; the periphery is phenomenally rich but access is limited. | (c) An experience-sampling study of absorbed walking in which probes are delivered mid-episode rather than in retrospect. | Mid-episode probes will reveal sparse detail; richness appears only in retrospective narration. | Mid-episode probes will reveal rich detail comparable to retrospective reports. | Genuine | Tests the 'retrospective reconstruction' hypothesis. |
  | C4 | Does access mean availability to any downstream consumer or specifically availability for report, reasoning and deliberate action? | Access means global availability for flexible reasoning and report; if it cannot be used, it is not accessed. | Access is a narrow subset of phenomenology; phenomenology includes content not available for any downstream cognitive use. | (a) Interpretation of confidence data under load: does high confidence without report imply downstream availability? | High confidence without report implies a separate metacognitive access route, not phenomenal overflow. | High confidence without report implies phenomenal content exists without cognitive access. | Verbal | Hinges on the definition of 'access'. |

  ## 3. Verbal Disputes and Residual Differences

  A significant portion of our disagreement is verbal, specifically concerning the definition of **Access**. The Global Workspace side defines access functionally as availability for report, reasoning, and deliberate action. The Overflow side often defines access narrowly as availability for report, thereby classifying content available for confidence ratings or priming as 'phenomenal but inaccessible'. If 'access' is defined to include any downstream influence (including confidence), the Overflow claim weakens to the claim that phenomenology exceeds *reportable* access. If 'phenomenal' is defined strictly by what-it-is-likeness independent of function, the dispute is genuine. If 'phenomenal' is defined by availability to the subject (introspective self-access), the dispute collapses, as introspection is a form of access. We agree that introspective self-access must be distinguished from external report, but disagree on whether introspection requires workspace ignition.

  **Residual Disagreement:** The core residual disagreement is empirical: whether high-confidence failures of report under load reflect a conscious state that failed to be broadcast (Overflow) or a non-conscious state that supported a metacognitive guess (GWT).

  **Result That Would Surprise Both:** A finding that neural ignition occurs without any subjective report or confidence (zombie ignition), or that rich subjective reports occur with zero fronto-parietal involvement and no sensory buffer activity.

