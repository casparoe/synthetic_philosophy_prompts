answer: |-
  ### Conceptual Clarification: The Dennettian Tension

  Daniel Dennett's "Where Am I?" thought experiment dismantles the naive assumption that personal identity tracks a specific lump of matter (the brain) or a specific location in space (the body). In his scenario, Dennett's brain is removed and kept in a vat while his body operates remotely. He finds that his "point of view" does not stay with the brain in the vat, nor does it clearly stay with the body; it seems to hover wherever the *causal control* is centered.

  For this panel, the critical tension is between **First-Person Indexicality** (the patient's sincere report of "I am here/continuous") and **Third-Person Causal Continuity** (the physical chain of events linking Time 1 to Time 2). In gradual neural substitution, naive bodily criteria fail because the biological substrate changes without interrupting function. However, if the causal chain is interrupted (even briefly) or duplicated (fission), the "I" may branch or dissolve, even if the patient claims otherwise. A clinical protocol cannot rely solely on patient report (which can be confabulated or split) nor solely on anatomy (which is being replaced). It must triangulate between phenomenology, function, and causal history.

  ***

  ### The Identity Continuity Protocol (ICP-7)
  **Purpose:** To assess diachronic personal identity in neural substitution protocols.
  **User:** Ethics Review Panel Members (Clinical/Scientific background).
  **Constraint:** If any stage triggers a "HALT," the case moves to Full Board Deliberation. Do not override.

  #### Stage 1: Phenomenological Self-Report (The Indexical Check)
  *   **Condition Tested:** First-person indexical stability.
  *   **Operational Test:** Post-procedure structured interview. Ask: "Describe the moment of transition. Did your stream of consciousness interrupt? Do you feel you are the same entity that entered the OR?"
  *   **Threshold:**
      *   *Sufficient:* Patient reports unbroken continuity of experience.
      *   *Broken:* Patient reports a "gap," "reset," or "waking up anew."
  *   **Classification:** **Factual Determination** (Patient testimony).
  *   **HALT Condition:** If the patient reports *branching* (e.g., "I am here, but I also feel myself over there"), HALT.

  #### Stage 2: Narrative and Memory Coherence (The Lockean Check)
  *   **Condition Tested:** Psychological continuity (memory, personality, preference).
  *   **Operational Test:** Standardized neuropsychological battery + Autobiographical Memory Test. Compare pre-op baseline to post-op status.
  *   **Threshold:**
      *   *Sufficient:* >90% retention of episodic memory; stable personality metrics.
      *   *Broken:* Significant retrograde amnesia or personality shift inconsistent with surgical trauma.
  *   **Classification:** **Factual Determination** (Clinical data).
  *   **HALT Condition:** If memory is intact but *source monitoring* fails (patient claims memories they could not have acquired), HALT.

  #### Stage 3: Functional Integration (The Coupling Check)
  *   **Condition Tested:** Real-time causal integration of synthetic/organic nodes.
  *   **Operational Test:** Latency and bandwidth measurement between graft sites and host tissue during active tasks.
  *   **Threshold:**
      *   *Sufficient:* Signal latency within biological norms (<10ms variance); seamless sensorimotor loop.
      *   *Broken:* Detectable processing lag, "handoff" delays, or modular isolation of graft sites.
  *   **Classification:** **Factual Determination** (Biophysical data).
  *   **HALT Condition:** If functional nodes operate independently (modular dissociation), HALT.

  #### Stage 4: Causal Grounding (The Substrate Check)
  *   **Condition Tested:** Physical continuity of the causal mechanism.
  *   **Operational Test:** Review of surgical logs. Was there *any* moment where information processing was stored statically (paused) rather than dynamically (active)? Was the substrate changed organically-to-synthetically in a single block or incrementally?
  *   **Threshold:**
      *   *Sufficient:* Incremental replacement with overlapping function (Ship of Theseus compliance).
      *   *Broken:* "Cut and Paste" causality (e.g., scanning and uploading, or total simultaneous swap).
  *   **Classification:** **Value Judgment** (Defines what counts as "continuous causation").
  *   **HALT Condition:** If the causal mechanism shifts from electrochemical to computational *without* functional overlap, HALT. (Note: This may flag a break even if Stage 1 & 2 pass).

  #### Stage 5: The Uniqueness Constraint (The Fission Check)
  *   **Condition Tested:** Absence of branching identity.
  *   **Operational Test:** Verify no backup copies of neural states exist; verify no second body/node is active with the same identity claims.
  *   **Threshold:**
      *   *Sufficient:* Only one active locus of control claims the pre-op identity.
      *   *Broken:* Two or more loci claim the identity (Fission).
  *   **Classification:** **Value Judgment** (Adopts the "No Branching Rule" for legal/ethical identity).
  *   **HALT Condition:** **MANDATORY HALT.** If branching is detected, identity is legally/ethically indeterminate. Full Board Deliberation required.

  #### Stage 6: Agency and Control Locus (The Volition Check)
  *   **Condition Tested:** Ownership of action.
  *   **Operational Test:** Intentional binding tasks. Does the patient feel they initiated the action, or that the graft initiated it?
  *   **Threshold:**
      *   *Sufficient:* Patient reports sense of agency consistent with pre-op baseline.
      *   *Broken:* Patient reports actions as "alien" or "automated."
  *   **Classification:** **Factual Determination** (Phenomenological report).
  *   **HALT Condition:** If agency is distributed across multiple nodes without a central arbiter, HALT.

  #### Stage 7: Final Synthesis (The Liability Assignment)
  *   **Condition Tested:** Overall Identity Status.
  *   **Operational Test:** Aggregate Stages 1-6.
  *   **Threshold:**
      *   *Identity Retained:* All stages Sufficient.
      *   *Identity At Risk:* Stage 4 or 6 flagged but no HALT.
      *   *Identity Broken:* Any HALT triggered.
  *   **Classification:** **Value Judgment** (Weighing the relative importance of Stages).
  *   **HALT Condition:** If Stage 4 (Causal Grounding) conflicts with Stage 1 (Phenomenology), HALT for Full Board Deliberation.

  ***

  ### Worked Applications

  #### Case 1: The Branching Node (Anatomical Continuity Preserved, Psychological Fission)
  **Scenario:** During a bilateral graft, a temporary buffer allows both the original organic hemisphere and the new synthetic hemisphere to process visual data simultaneously for 45 minutes. Both nodes generate motor output. The patient (via two speech centers) sincerely reports "I am here" from both the left and right output channels.

  *   **Stage 1 (Phenomenology):** **PASS.** Both nodes report "I am me."
  *   **Stage 2 (Narrative):** **PASS.** Both recall the pre-op life.
  *   **Stage 3 (Integration):** **FAIL.** Nodes are operating in parallel, not integrated.
  *   **Stage 5 (Uniqueness):** **FAIL (HALT TRIGGERED).** Two loci claim the identity.
  *   **Outcome:** The protocol indicates a **Break in Identity** (Fission).
  *   **Conflict:** The patient(s) will reject this, insisting they are one person temporarily speaking twice.
  *   **Panel Action:** **HALT.** Refer to Full Board.
  *   **Rationale:** Under the "No Branching Rule" (Stage 5), identity cannot be one-to-many. Even if the patient feels continuous, the ethical framework cannot assign liability or consent to two distinct bodies claiming the same rights. The protocol prioritizes the *logical impossibility of unique identity* over the *phenomenological report of continuity*.

  #### Case 2: The Total Synthetic Swap (Narrative Intact, Causal Break)
  **Scenario:** A patient undergoes "Flash-Substitution." The brain is frozen, scanned, and replaced instantly with a synthetic duplicate that resumes activity. The patient wakes up, recalls all memories, passes all cognitive tests, and reports no break in consciousness (due to the lack of a subjective "gap" during the freeze).

  *   **Stage 1 (Phenomenology):** **PASS.** Patient reports continuous "I."
  *   **Stage 2 (Narrative):** **PASS.** Memory and personality intact.
  *   **Stage 3 (Integration):** **PASS.** Function is equivalent.
  *   **Stage 4 (Causal Grounding):** **FAIL (HALT TRIGGERED).** The causal chain was interrupted (static storage vs. dynamic processing). The mechanism shifted from electrochemical to computational without overlap.
  *   **Outcome:** The protocol indicates a **Break in Identity** (Replication, not Continuation).
  *   **Conflict:** The patient feels fine. Clinically, they are functional.
  *   **Panel Action:** **HALT.** Refer to Full Board.
  *   **Rationale:** This is the "Teletransportation Paradox." While psychological continuity (Stage 2) is preserved, *causal* continuity (Stage 4) is broken. For the purposes of medical liability and consent, the entity that woke up may be a *copy* of the patient, not the *patient*. The protocol flags this because the *value judgment* on what matters (biology vs. psychology) is too significant for a sub-committee. The procedure forces the Board to decide if "Psychological Continuity" is sufficient for "Legal Identity" in this context.

  ***

  ### Limitations and Exclusions

  This procedure is designed for human clinical neurosurgery involving gradual or discrete tissue substitution. It is **not** designed to resolve the following categories, which require distinct philosophical frameworks:

  1.  **Non-Standard Cognitive Architectures:** If the graft introduces non-human processing modes (e.g., hive-mind connectivity, direct cloud access), Stage 3 (Functional Integration) and Stage 6 (Agency) will fail to capture the *quality* of the new identity. The framework assumes a singular, bounded human agent.
  2.  **Severe Cognitive Impairment:** In patients with advanced dementia or aphasia, Stage 1 (Self-Report) and Stage 2 (Narrative) are unavailable. The protocol defaults to Stage 4 (Causal Grounding), which may be too reductionist for vulnerable populations.
  3.  **Analogues Outside Clinical Contexts:** This procedure does not apply to AI mind-uploading, cryonics revival, or speculative teleportation. In those contexts, the "Biological/Causal" thresholds (Stage 4) may be irrelevant, whereas in clinical neurosurgery, they are vital for safety and liability.
  4.  **The "What Matters" Problem:** The protocol explicitly flags conflicts between Phenomenology (Stage 1) and Causality (Stage 4) as "HALT" conditions. It does not resolve them. This is a feature, not a bug. A mechanical resolution of whether *feeling* like yourself makes *you* is a metaphysical question, not a procedural one. Simplifying this distinction for practical use introduces likely misfires where a patient is legally "dead" (Identity Broken) but clinically "alive" (Function Intact).

  **Final Note to Panel:** When this protocol triggers a HALT, do not attempt to "fix" the identity status. Your role is to recognize that the metaphysical grounds for consent and liability have shifted, requiring a broader ethical deliberation on whether the procedure preserves the *patient* or merely produces a *successor*.
