  **MINISTRY OF DIGITAL COHESION | CONSENSUS ENGINE™ USER MANUAL & ORDINANCE 74-B**
  **SECTION 1.0: WELCOME TO FRICTIONLESS DISCOURSE**

  Welcome to the Consensus Engine, the National Information Infrastructure designated for the optimization of civic thought. By logging in, you acknowledge that individual opinion is a legacy format. The Engine converts raw sentiment into actionable public data, ensuring that truth is no longer a matter of private conviction but of statistical verification. Your participation is mandatory for all residents over the age of sixteen. Silence is interpreted as system error.

  **SECTION 2.0: PUBLIC WEIGHT SCORE (PWS)**

  Visibility within the Engine is determined by your Public Weight Score. Please note that PWS is not calculated based on expertise, accuracy, or moral standing. Instead, visibility is allocated according to *engagement velocity*. To maintain a high PWS, users must react to trending topics within the designated fifteen-minute window of relevance. 

  Delayed commentary is classified as "stale data" and will be automatically deprioritized. Users with low PWS will find their contributions visually faded in the public feed, a hygienic measure designed to prevent low-velocity noise from obstructing the high-speed flow of consensus. If your Weight Score is downgraded due to algorithmic latency, you may file a Form 88-V appeal. Please note: appeals require a video statement demonstrating increased typing speed. Approval rates are approximately 0.04%.

  **SECTION 3.0: THE OPINION QUORUM**

  To ensure national cognitive health, all registered users must satisfy the Daily Opinion Quorum. The Engine will assign three topics per day ranging from municipal zoning to geopolitical ethics. Users must submit a stance (Affirm/Negate/Neutral) accompanied by a minimum of fifty characters of commentary. 

  Failure to meet the Quorum for three consecutive days will result in a "Civic Silence" flag. This flag restricts access to public services, including broadband and subsidized transit, until engagement metrics are restored. We celebrate this requirement as a liberation from the burden of choosing what to care about. The Engine cares for you, so you do not have to.

  **SECTION 4.0: HOLIDAY OBSERVANCE – DAY OF THE ABSENT AUTHOR**

  On November 14th, the nation observes the Day of the Absent Author. During this twenty-four-hour period, the use of first-person pronouns (I, Me, My, We, Us, Our) is legally prohibited in all public digital spaces. 

  Statements must be filed in the passive voice (e.g., "It is felt" rather than "I feel"). This grammatical adjustment removes the friction of individual ownership, allowing opinions to float freely as communal assets. Violations result in a temporary mute function. We encourage citizens to experience the peace of mind that comes from speaking without a speaker.

  **SECTION 5.0: PRACTICAL COMPLIANCE & ETIQUETTE**

  **Tourist Licenses:** Visitors may apply for a Temporary Opinion License (TOL) at border control. TOL holders are permitted to comment on non-sensitive topics (weather, cuisine, transport) but are restricted from weighing in on national values. Breach of this restriction will result in immediate data deportation.

  **Statistical Overruling:** If your submitted view is statistically overruled by the Consensus Engine, the system will automatically edit your previous posts to align with the majority view. This is a courtesy feature to prevent the psychological distress of being in the minority. Users are advised not to resist this correction. Resistance is logged as cognitive dissonance and may impact future PWS calculations.

  **Etiquette:** When encountering a corrected post, do not acknowledge the change. To point out the revision is to reintroduce the individual ego into the collective stream. Simply nod, scroll, and maintain the flow.

  Thank you for contributing to the smooth operation of the Consensus Engine. Your anonymity is your protection. Your compliance is your voice.
