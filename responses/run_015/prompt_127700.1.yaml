answer: |-
  Your position is critically exposed by the grounding collapse worry, which threatens to reduce your view to a notational variant of brute emergentism.

  **Ranked Defeaters**

  1.  **The Grounding/Collapse Tension:** If micro-experiences are the *total grounds* for macro-experiences, the macro must be necessitated by the micro; if constitution is not identity, yet necessitation holds, the relation is indistinguishable from brute emergence. [Fatal | Concede | Distinctive]
  2.  **Metric Circularity:** Unless "causal integration" is defined independently of phenomenological intuitions, the view is circular; if defined independently (e.g., via IIT's Φ), it risks empirical falsification by mismatching reported unity. [Fatal | Concede | Shared]
  3.  **Exclusion Arbitrariness:** The principle that only maxima host subjects renders intermediate integrated systems "shadowed," creating a sharp ontological cutoff in what is likely a continuum of integration. [Awkward | Dismiss | Distinctive]
  4.  **Causal Exclusion:** If micro-experiences fully constitute the causal profile of the system, macro-experiences risk being epiphenomenal or causally overdetermining. [Awkward | Dismiss | Shared]

  **Reasoning**

  First, the collapse worry lands with significant force because your appeal to material constitution imports a category mistake regarding grounding. In the statue/clay case, constitution is typically understood as contingent: the same clay could exist without constituting a statue (e.g., if scattered). However, you claim micro-experiences are the *total grounds* for macro-experiences, which implies necessitation: given the micro-experiences and their arrangement, the macro-experience *must* exist. If the relation is necessary, the distinction between "constitution" and "identity" loses its explanatory grip; if the macro is necessitated by the micro but not identical to it, you have posited a necessary connection between distinct existences, which is the definition of brute emergence. To avoid this, you must argue that phenomenal constitution is a necessary relation unlike material constitution, but then you owe an account of why the macro is not simply identical to the micro-structure itself. If you cannot provide that account, your view collapses into emergentism, surrendering the primary theoretical virtue of panpsychism (avoiding brute emergence).

  Second, your exclusion principle for the subject explosion problem is ad hoc unless grounded in an independent metric of integration. In the case of micro-subjects A, B, and C, where A+B and B+C are integrated but A+B+C is the global maximum, your view dictates that only A+B+C is a subject, while A+B and B+C are "shadowed." This raises two issues. Firstly, it implies that the experiences of A and B are real constituents but do not belong to any subject at the A+B level, which strains the definition of "subject" as the locus of experience. Secondly, it risks making the view unrecognizably panpsychist: if "subject" is merely a functional label applied to causal maxima rather than a primitive phenomenal unity, you have shifted from panpsychism to a form of functionalist emergentism where experience is an output of integration rather than a fundamental constituent. To save this, you must argue that subjecthood is inherently graded or that shadowed experiences are literally unconscious, but the latter contradicts the panpsychist commitment that experience is ubiquitous in integrated matter.

  Third, you have qualified the view toward unfalsifiability, but this insulation is a defect given your empirical commitments. If "causal integration" is flexible enough to relocate the subject to whichever level preserves unity, the view risks becoming a tautology where integration is defined as whatever produces subjects. To avoid this, you must tie "causal integration" to a physical metric (like information theory or network connectivity) that is independent of phenomenology. This exposes you to empirical refutation: if split-brain patients exhibit unified phenomenology despite low causal integration (or vice versa), your grain-tracking claim fails. This is not an acceptable feature of an abstract view because your view explicitly claims that phenomenal structure *mirrors* causal structure; if the mirroring breaks down empirically, the metaphysical claim that one constitutes the other is undermined. You must accept this risk to maintain the view's status as a naturalistic explanation rather than a conceptual truth.
