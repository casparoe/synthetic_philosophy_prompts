          1.  Diagnosis of the Stalemate (The Triangulation Failure).
          2.  Critique of the Four Accounts (Feeling, Attitudinal, Functional, Adverbial).
          3.  Addressing the User's Hunch (Empirical vs. Normative vs. Verbal).
