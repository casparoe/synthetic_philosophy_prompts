answer: |-
  Here is the diagnosis you asked for.

  The stalemate you are facing is not a lack of data; it is a **triangulation failure**. The wellbeing industry is trying to measure a single variable ("happiness" or "pleasure") that is actually the intersection of three distinct domains: phenomenology (what it feels like), functional psychology (what it does), and axiology (what it is worth). These three domains do not overlap perfectly. When researchers treat them as identical, the heterogeneity problem emerges.

  Here is where each account commits, where it bites, and where it fails, including your adverbial proposal.

  ### 1. The Feeling Theory (Sensory Hedonism)
  *   **The Commitment:** Pleasure is a distinctive introspectable quality (a "hedonic tone") present in all enjoyable experiences.
  *   **The Bite:** It matches the folk intuition. When people fill out surveys, they are asked to introspect. If there is no felt quality, what are they reporting?
  *   **The Failure:** It cannot survive the heterogeneity test. As you noted, the phenomenology of a cold beer and a mathematical proof share no sensible texture. Proponents often retreat to saying the feeling is "dim" or "background," but this makes it empirically inaccessible. If the feeling is too subtle to be noticed during the experience (e.g., in flow states), it cannot be the basis of a survey response.
  *   **Verdict:** Phenomenologically false, but methodologically necessary for self-report surveys.

  ### 2. The Attitudinal Theory (Desire Hedonism)
  *   **The Commitment:** Pleasure is not a feeling but a pro-attitude toward an experience (wanting it to continue, judging it as good).
  *   **The Bite:** It dissolves the heterogeneity problem instantly. The beer and the proof share no feeling, but they share the structural relation of "being wanted for their own sake."
  *   **The Failure:** It severs the link between pleasure and welfare in counterintuitive ways. It allows for "happy fools" (people who want to stay in a matrix) and creates a circularity problem: Do I want the experience because it is pleasant, or is it pleasant because I want it? Furthermore, it captures mania and addiction. A addict wants the drug experience to continue, but we hesitate to call that "wellbeing."
  *   **Verdict:** Philosophically robust, but it measures *motivation*, not *happiness*. If wellbeing dashboards use this, they are measuring engagement, not joy.

  ### 3. The Neuroscientific/Functional Theory (Common Currency)
  *   **The Commitment:** Pleasure is whatever signal plays a specific computational role (e.g., reward prediction error, opioid activation) that reinforces behavior.
  *   **The Bite:** It allows for aggregation. If the brain uses a common currency to trade off beer against proofs, then scientists can too.
  *   **The Failure:** It relies on a category error. The "common currency" in reinforcement learning models is a mathematical heuristic, not necessarily an ontological substance. As your friend admits, it is an assumption required to make the equations work, not a discovered fact. Moreover, neuroscience has repeatedly dissociated "liking" (hedonic impact) from "wanting" (incentive salience). They use different circuits. If the "currency" is just salience, it measures importance, not goodness.
  *   **Verdict:** Load-bearing for the models, but ontologically thin. It explains *choice*, not *value*.

  ### 4. The Adverbial Theory (Your Proposal)
  *   **The Commitment:** Enjoyment is not an ingredient (noun) but a manner (adverb). One does not experience "pain + relief," one experiences "pain-relievedly." One does not experience "beer + pleasure," one experiences "beer-pleasantly."
  *   **The Coherence Check:** It is coherent. It draws on Ryle and Chisholm. It avoids the "search for the ingredient" fallacy.
  *   **The Failure:** It is likely a restatement of the Attitudinal view in phenomenological clothing. If the "manner" is cashed out in terms of how the subject relates to the experience (savoring it, attending to it), it collapses into Attitudinalism. If it is cashed out as a specific qualitative glow, it collapses into Feeling Theory.
  *   **The Heterogeneity Problem:** It dissolves the *ingredient* problem but exacerbates the *aggregation* problem. If enjoyment is a mode of experience specific to that experience, how do you compare the magnitude of "beer-pleasantly" against "proof-pleasantly"? You need a common metric to sum them for a "national wellbeing" score. Adverbialism suggests there *is* no common metric, only distinct modes. This makes the dashboard impossible.
  *   **Verdict:** Elegant metaphysics, disastrous for policy.

  ### Diagnosis of Your Hunch
  You are correct that this is several disputes wearing one hat, but you are underestimating the political necessity of the confusion.

  1.  **The Empirical Question:** Is there a shared felt signature? The answer is almost certainly **no**. Introspection and neuroscience both suggest distinct systems for sensory gratification, intellectual satisfaction, and social bonding.
  2.  **The Normative Question:** Does hedonism require a felt quality? If you define hedonism as "maximize pleasure," and pleasure has no shared quality, the command is meaningless. If you define it functionally (maximize reward signal), it becomes "maximize reinforcement," which justifies addiction. The theory of welfare requires a unifier that the psychology cannot provide.
  3.  **The Verbal Question:** Is it just semantics? No. If it were verbal, we could stipulate a definition and move on. We can't, because the *measurement tools* (surveys, fMRI, behavioral tasks) are calibrated to different definitions. A survey asks for Feeling. A choice task measures Attitude/Function. An fMRI measures Physiology. They correlate, but they diverge at the margins. The "stalemate" is the noise at those margins.

  ### The Neuroscience Assumption
  Your friend's field assumes a single valence signal because without it, you cannot model a unitary agent making trade-offs. It is a **modeling convenience that has been reified into an ontological fact.** Philosophers leaning on this are committing the mereological fallacy: assuming that because the *model* requires a scalar value, the *mind* must produce one.

  This assumption is load-bearing for the *industry* of wellbeing research, but not for the *philosophy*. If you remove it, the dashboards collapse. You cannot sum heterogeneous modes of being into a GDP of Happiness. The philosophy can survive the removal (by becoming pluralistic about value); the industry cannot.

  ### What Counts as Progress?
  Given this diagnosis, here is what would actually constitute progress, ranked from most likely to least likely:

  1.  **A Change of Question (The Sen/Nussbaum Pivot):** Progress requires admitting that "Wellbeing" is not a scalar. We stop trying to sum pleasures and start measuring *capabilities* or *functionings*. This abandons the hedonic calculus entirely. It solves the heterogeneity problem by refusing to solve it. (Political probability: Low. Dashboards need single numbers.)
  2.  **A Formal Result (The Impossibility Theorem):** A proof showing that no function exists that can map heterogeneous phenomenological states to a single scalar value without losing normative information. This would force the industry to abandon the "maximization" framework. (Scientific probability: Low. Economists will just assume the function exists.)
  3.  **A Distinction (The Dissociation Protocol):** We stop using the word "happiness." We mandate three separate dashboards: **Affect** (Feeling), **Satisfaction** (Attitudinal), and **Reward** (Neural/Behavioral). When they diverge, we treat it as data, not error. This acknowledges the triangulation failure. (Practical probability: Medium. This is already happening in niche psychology, but it lacks the punch of "National Happiness.")
  4.  **An Experiment (The Common Currency Hunt):** A definitive study isolating a neural signal that correlates perfectly with *reported* hedonic tone across all domains (sensory, intellectual, social), controlling for salience and attention. If this exists, Feeling Theory is saved. If it doesn't (current trend), the scalar view is dead. (Scientific probability: High chance of negative result.)

  ### The Hard Truth
  If your piece needs a conclusion, it is this: The wellbeing industry is trying to build a bridge between two islands that are moving apart. Neuroscience is fragmenting "reward" into distinct systems (liking, wanting, learning). Philosophy is fragmenting "value" into distinct goods (autonomy, pleasure, meaning).

  The "evidence-based happiness industry" relies on a 19th-century psychological model (Bentham's calculus) that was obsolete before it was adopted. The stalemate persists because resolving it would require admitting that **national wellbeing cannot be maximized,** only balanced. That is a political non-starter. So the philosophical wall remains, not because we lack the tools to knock it down, but because the industry is built on the assumption that the wall isn't there.

  Your adverbial idea is the most honest description of the experience, but it is the least useful for the dashboard. That tension *is* the story.
