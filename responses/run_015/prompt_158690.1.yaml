      *   *Refining the Adverbial Critique:* I need to be careful here. The adverbial view (e.g., Gilbert Ryle, maybe some Brentano) suggests I don't feel "pain + sadness," I feel "sadly." Applied to pleasure: I don't feel "beer + pleasure," I feel "beer-pleasantly." The problem is comparability. How do you quantify "pleasantly" across different activities if it's not a shared substance? It solves heterogeneity but kills aggregation.
      *   *Refining the Neuroscience Point:* The friend is right to assume it for modeling, but wrong to treat it as ontology. It's a "as if" heuristic. Philosophers leaning on it are committing the mereological fallacy (attributing model properties to reality).

  7.  **Final Polish:** Check against constraints. No reading list. No verdict. Argue with the user. Ensure the distinction between *hedonism* (theory of value) and *psychological hedonism* (theory of motivation) is clear where relevant.

