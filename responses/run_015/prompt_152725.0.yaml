  3.  **Drafting - Section by Section:**

      *   **Introduction:** Start with the Cartesian theater model. The agent is outside the world, looking in (belief) and reaching out (action). Contrast this with the embedded agent, which is *in* the world. The thesis: This ontological shift demands a functional shift.

      *   **The Argument for Dissolution:**
          *   Standard view: Belief = mirror of reality (passive). Action = lever on reality (active).
          *   Embedded view: The agent's hardware is part of the causal graph it's trying to map.
          *   Problem: You can't model the system you are part of without modeling yourself modeling the system (infinite regress).
          *   Consequence: You can't separate "what is true" from "what keeps me existing to know things." Belief updating changes the physical state, which changes the future data. Action changes the world, which changes the truth conditions. They are one loop.

      *   **Unified Feedback Dynamics:**
          *   If they aren't separate, what are they? A single regulatory process.
          *   Analogy: Homeostasis. Not "calculate temperature then turn on heat," but a continuous flow where sensing and acting are coupled.
          *   Normative implication: The goal isn't "True Belief + Optimal Action," it's "Sustainable Coupling."

      *   **Addressing the Objection (Normativity vs. Description):**
