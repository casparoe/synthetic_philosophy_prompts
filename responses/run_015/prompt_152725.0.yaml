  1.  **Deconstruct the Request:**
      *   **Core Thesis:** Embedded agency dissolves the separation between belief-updating and action-selection.
      *   **Mechanism:** The agent is physically constituted by the processes it models/intervenes on.
      *   **Conclusion:** Epistemic and practical reasoning must be governed by a single, unified feedback dynamics (not separate Bayesian/Expected-Utility frameworks).
      *   **Objection to Address:** Does this collapse normative theory into mere descriptive dynamics (is/ought problem)?
      *   **Key Concept to Inject/Defend:** "Rational error" is not a failure to apply external norms, but a misalignment between locally tractable feedback loops and globally coherent conditions the agent cannot fully represent.
      *   **Constraints:** Conceptual argument only. No specific empirical studies, named formalisms (e.g., AIXI, Free Energy Principle), or bibliographic references.

  2.  **Initial Brainstorming & Structuring:**
      *   *Introduction:* Define the standard view (dualistic agent) vs. the embedded view. State the thesis clearly.
      *   *The Dissolution:* Why does physical constitution break the belief/action split? (Self-reference, causal entanglement).
      *   *Unified Dynamics:* Propose the alternative. Instead of "update then act," it's "interact to stabilize."
      *   *Addressing the Objection:* Normativity vs. Descriptivism. How can a dynamic be normative without an external god's-eye view? (Viability, coherence, self-preservation).
