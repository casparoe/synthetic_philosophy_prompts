answer: |-
  Orientation
  This instrument is designed to disentangle the conflation of contingency, constraint, and inefficiency that often stalls discussions of path dependence. It does not tell you who is right, but it forces you to specify which kind of 'past matters' claim you are making. By separating the shape of the menu from the selection from it, and the route from the destination, it prevents arguments about keyboards from collapsing into arguments about evolution. Use it to locate your disagreement before attempting to resolve it.

  The tree
  Start at the root: "I think the past matters here."

  **Q1: Does the process alter the available alternatives as it proceeds, or merely select from a fixed set?**
  *   **Alters (Menu):** History creates or destroys options. Go to Q2.
  *   **Fixed (Selection):** Options exist independently of the path. Go to Q3.
  *   *What turns on this:* Whether the disagreement is about structural construction or selection bias.

  **Q2: Does the menu alteration constrain the final state, or only the trajectory to it?**
  *   **Final State (Destination):** The end point is historically determined. Go to Q2b.
  *   **Trajectory (Route):** The end point is stable regardless of path (chreod). **Leaf 1.**
  *   *What turns on this:* Whether history dictates where you stop or only how you get there.

  **Q2b: If restarted from similar conditions, does the menu evolution recur?**
  *   **Yes:** The structural change is law-like. **Leaf 2 (Empty).**
  *   **No:** The structural change is unique. **Leaf 3.**
  *   *What turns on this:* Whether the historical construction is repeatable or singular.

  **Q3: If restarted from similar conditions, does the selection converge?**
  *   **Yes:** Outcome is robust to contingency. Go to Q3b.
  *   **No:** Outcome is sensitive to initial noise. Go to Q4.
  *   *What turns on this:* Whether the past matters because it selects among equals or because it forces a unique result.

  **Q3b: Is the convergence due to physical limits or functional utility?**
  *   **Physical:** Laws of nature force the outcome. **Leaf 4.**
  *   **Functional:** Optimization forces the outcome. **Leaf 5.**
  *   *What turns on this:* Whether the inevitability is hard (physics) or soft (economics/biology).

  **Q4: Is the outcome inefficient, and if so, is it compensated by adaptation?**
  *   **No (Efficient):** The contingent choice was as good as any. **Leaf 6.**
  *   **Yes, Net Loss:** The choice is worse and remains so. **Leaf 7.**
  *   **Yes, Compensated:** The choice was worse, but infrastructure adapted. **Leaf 8.**
  *   *What turns on this:* Whether the lock-in is a true drag on performance or merely a suboptimal stability.

  Leaves
  1.  **Chreod.** Commitment: History shapes the route but the system canalizes to a stable endpoint. Awkward consequence: You cannot claim the outcome was contingent if the destination was inevitable.
  2.  **Unnamed (Empty).** Commitment: History alters the menu but forces a unique, repeatable destination. Awkward consequence: This collapses into Physical Determinism; no one claims menus change lawfully.
  3.  **Historical Construction.** Commitment: History alters the menu and the outcome is non-repeatable. Awkward consequence: You cannot predict future structural changes even with perfect initial data.
  4.  **Physical Determinism.** Commitment: History selects from a fixed menu but physical law forces convergence. Awkward consequence: You must deny that alternative states were physically possible even in principle.
  5.  **Convergent Evolution.** Commitment: History selects from a fixed menu but functional optimization forces convergence. Awkward consequence: You must argue that all efficient solutions look identical despite different paths.
  6.  **Contingent Equilibrium.** Commitment: History selects a contingent outcome that is efficient relative to alternatives. Awkward consequence: You cannot advocate for change without admitting you are moving sideways.
  7.  **Deadweight Lock-in.** Commitment: History selects a contingent outcome that is inefficient and uncompensated. Awkward consequence: You must explain why rational agents never corrected the inefficiency over time.
  8.  **Adapted Lock-in.** Commitment: History selects a contingent outcome that was inefficient but is now optimized by surrounding infrastructure. Awkward consequence: You cannot advocate for change without destroying value created by the very lock-in you criticize.

  Unoccupied combinations
  The tree prunes several logical combinations because they are incoherent or unattractive. First, **Menu Alters + Inefficient Lock-in** is empty. If the menu itself changes, the concept of 'lock-in' (selecting a suboptimal fixed option) misfires; the alternatives literally ceased to exist, making inefficiency undefined relative to a fixed baseline. Second, **Route Shaped + Rerun No** is incoherent. If history shapes only the route (Chreod) but a rerun produces a different outcome, then history must have shaped the destination, contradicting the branch definition. Third, **Physical Determinism + Inefficient** is unattractive. If physical law forces an outcome, calling it 'inefficient' implies a physically impossible alternative was better, which is a category error regarding physical constraints rather than economic choices.

  Where the instrument fails
  This taxonomy cannot separate **Adapted Lock-in** from **Contingent Equilibrium**. Both present as efficient stable states in the present; distinguishing them requires historical counterfactuals about past inefficiency that are often empirically inaccessible. You cannot tell if a system is optimized around a mistake or simply optimized. Similarly, the tree struggles to separate **Structural Determinism** (Leaf 2) from **Physical Determinism** (Leaf 4). Both imply inevitability. Distinguishing whether the inevitability arises from a changing menu of social options or fixed physical laws often requires metaphysical commitments about the nature of the 'menu' that the tree treats as a binary switch. The instrument maps logical space, not evidentiary access.

  Five questions for the group
  1. Does your example change the menu of options or just pick one?
  2. Does history determine the end state or just the path?
  3. Would a rerun from similar starts produce the same outcome?
  4. Is the outcome inefficient relative to alternatives that were once reachable?
  5. Has the system adapted to make the outcome efficient since the selection?
