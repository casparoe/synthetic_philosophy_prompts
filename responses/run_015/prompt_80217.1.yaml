          *   (Γ.2) Subsequent conduct must be consistent.
      *   **Misfires vs. Abuses:**
          *   *Misfire:* The act is not achieved (e.g., wrong person, wrong context, wrong procedure). "I hereby resign" said to a newspaper instead of the council might be a misfire regarding the *procedure* (notify the council).
          *   *Abuse:* The act is achieved but insincere (e.g., saying it as a joke or draft without intent).
      *   **Application:** The bylaw specifies the procedure: "notifying the council." Publishing in the paper is not notifying the council. Therefore, the felicity condition regarding the *appropriate persons/circumstances* (A.2) or *execution* (B.1) is likely not met. However, public declaration creates an expectation.
