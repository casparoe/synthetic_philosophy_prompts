    "verdict": "conditional",
    "deciding_principle": "The resignation attempt constitutes a misfired performative utterance because the conventional procedure specified in the bylaws (notification to the council) was not executed.",
    "strongest_point_for_maya": "The public nature of the statement creates a reasonable reliance interest for the school body that should outweigh procedural technicalities regarding delivery.",
    "what_would_flip_it": "Evidence that Maya explicitly instructed the newspaper editor to publish the letter as her official notice to the council."
  }
  ```
