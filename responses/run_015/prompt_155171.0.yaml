answer: |-
  There is no single, canonical term in the philosophy of history that captures this specific rhetorical toggle with the precision you require. Historiography speaks of "Orthodox," "Revisionist," and "Post-Revisionist" schools, but these describe *conclusions*, not the *mechanical inconsistency* of the argumentation you have identified. In political science, this is often brushed off as "bias" or "motivated reasoning." In psychology, it is indeed the **Fundamental Attribution Error (FAE)** scaled to the state level: we explain our own behavior (or that of our preferred actor) by situational constraints (structure), while explaining an adversary's behavior by dispositional traits (agency/ideology).

  However, because you require a term for the *historiographical maneuver* itself—the deliberate shifting of explanatory frameworks within a single argument to shield a verdict—I propose the coinage: **Asymmetric Causal Attribution (ACA)**.

  ### Defining Asymmetric Causal Attribution
  **Boundary Conditions:**
  1.  **Parallel Events:** The historian addresses analogous actions by opposing powers (e.g., Soviet consolidation in Poland vs. American intervention in Greece).
  2.  **Divergent Frameworks:** One action is explained via *structural determinism* (security dilemmas, historical inevitability, defensive reaction), while the other is explained via *agential intentionality* (ideological ambition, personal will, offensive strategy).
  3.  **Verdict Protection:** The switch occurs specifically where a consistent application of either framework would weaken the historian's assigned locus of culpability.

  **Distinction from Legitimate Analysis:**
  A legitimate change in analytical scale acknowledges that some events are structural (long-term economic shifts) and some are agential (a specific summit decision). The vice of ACA is not the use of both lenses, but the **inconsistent application of the same lens to identical phenomena.** If the Truman Doctrine and the Cominform are functionally equivalent moves in a security dilemma, treating one as "ideological aggression" and the other as "defensive necessity" without new empirical evidence is ACA.

  **Distinction from Presentism and FAE:**
  *   **Presentism** judges the past by modern moral standards. ACA is not about *morality* per se, but about *causality*. It is a metaphysical cheat, not just a moral one.
  *   **FAE** is a cognitive bias (unconscious). ACA, in the hands of a skilled historian, is often a **rhetorical strategy** (conscious or semi-conscious). It is the professionalization of bias.

  ### The Definite Position
  You ask whether this pattern fatally undermines the question of who started the conflict, or if it is an unavoidable feature of writing moral history about structural wars.

  **My position is definite:** This pattern **fatally undermines the juridical framing of the question "Who started the Cold War?"**

  It is not merely a methodological vice; it is a symptom of a **category error**. The Cold War was not a crime with a perpetrator; it was a **systemic emergent property**. It arose from the collision of two universalist ideologies in a bipolar vacuum where no neutral arbiter existed. To ask "who started it" is to impose a criminal-law framework (requiring *mens rea* and a discrete act) onto a sociological phenomenon (requiring structural analysis).

  When a historian attempts to answer "Who started it?" they are forced into **Asymmetric Causal Attribution**. They *must* grant one side the benefit of structural context (to explain why they acted) and deny it to the other (to establish blame), or else the blame dissolves into the system. If both sides are reacting to a security dilemma, no one "started" it in a culpable sense; the system started it.

  Therefore, the historians you are observing are not failing to find the truth; they are failing to admit that the question they are answering is incoherent. They are writing **moral history** (which requires villains) about **structural war** (which produces tragedy without villains).

  **For your novel:**
  Do not treat this as a puzzle your characters can solve. Treat it as the central tragedy of their profession. They are trying to prosecute a ghost. The historian who refuses to engage in ACA will find themselves unable to assign blame, rendering their narrative unsatisfying to a public that demands a verdict. The historian who *does* engage in ACA produces a compelling narrative that is methodologically fraudulent.

  The "truth" of the Cold War's origins is not hidden behind the bias; the bias *is* the evidence that the question of "origins" is a myth. The Cold War did not begin; it accreted. To pinpoint a start date or a starter is an act of narrative violence, not historical discovery. Your characters are not disputing facts; they are disputing the right to impose a story arc on a chaos that resisted one.
