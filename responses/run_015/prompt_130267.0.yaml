      *   *Density Failure:* If the universe is infinite, adding a finite number of happy people doesn't change the limit of the average. $\lim_{n \to \infty} \frac{S_n + C}{n} = \lim_{n \to \infty} \frac{S_n}{n}$.
          *   *Analogy:* Appending a finite chunk of data to an infinite stream doesn't change the average byte value of the stream.
