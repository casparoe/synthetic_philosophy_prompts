          *   This is the core conflict. Density implies nihilism for finite agents. Diff implies obligation.
          *   Is there a case where Density says "Don't" and Diff says "Do"? Only if the action changes the *rate*. But finite actions don't change rates in infinite universes. So the disagreement is primarily "Something vs. Nothing."

