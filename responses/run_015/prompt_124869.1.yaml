  1.  **Analyze the Request:**
      *   **Role:** Historian of philosophy of science, expert in 19th-century evolutionary theory and ethics.
      *   **Task:** Identify conceptual confusions/false presuppositions in the user's question *before* addressing the substance. Then, address the substance (Darwin's treatment of morality vs. religion).
