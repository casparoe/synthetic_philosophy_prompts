  ### MARK BREAKDOWN (For TA)

  **Part (a): 5 / 6**
  *   **Strengths:** Clear distinction between naturalism and normativism. Boorse (BST) explained accurately.
  *   **Weaknesses:** Classifies Wakefield (HDA) as the "standard normativist alternative." In third-year literature, HDA is typically classified as a **hybrid** account (naturalist dysfunction + normativist harm). While it contrasts with Boorse, calling it purely normativist is a simplification that loses marks at this level.

  **Part (b): 6 / 8**
  *   **Strengths:** Correctly applies BST prevalence problem and HDA environmental relativity. Good identification of the "harm" dependency in HDA.
  *   **Weaknesses:** Misses the **temporal** hint in the prompt ("minority within a century"). A full-credit answer would flag that BST's reference class is unstable over time (is the class "current humans" or "future humans"?). Also glosses over whether the variant counts as a "dysfunction" in HDA if 60% of the population has it (evolutionary design issue).

  **Part (c): 2 / 6**
  *   **Strengths:** Correctly applies Vasquez's *rule* to the case (disorder in iodine-poor, not in sufficient).
  *   **Weaknesses:** **Fundamental conceptual error.** Classifies Vasquez as "naturalist." An account relying on "bearer's own ends" and "better off" is inherently **normativist** (or subjectivist). "Benefit" relative to "ends" is a value judgement, not a biological fact. This misunderstanding undermines the entire comparison.

  **TOTAL: 13 / 20**

