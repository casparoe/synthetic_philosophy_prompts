answer: |-
  There is no single, universally canonical term in moral philosophy that labels this specific argumentative configuration exactly as you have described it. However, your description is philosophically precise and maps onto a well-recognized cluster of debates concerning the **scope of justice**, the **basic structure of society**, and the **continuity of moral principles**.

  While there is no proper noun (like "The Veil of Ignorance") for this specific pattern of inconsistency, it is most rigorously characterized as a tension between the **Continuity Thesis** and the **Basic Structure Distinction**, often sustained by **Baseline Dependence**.

  Here is the breakdown of how this phenomenon is categorized, followed by my confidence assessment.

  ### 1. The Conceptual Components
  To name this move, philosophers typically reference the specific conceptual boundary being manipulated. The pattern you describe relies on three distinct elements:

  *   **The Basic Structure Distinction (The Shield):** Originating with John Rawls, this is the claim that principles of justice apply primarily to society's major institutions (the "basic structure") rather than to individual transactions or hypothetical choices. When the objector says, "Taxation is different from organ harvesting because it is part of the system," they are invoking the Basic Structure Distinction. This allows them to treat institutional coercion as morally distinct from individual coercion.
  *   **The Continuity Thesis (The Critique):** Critics (such as G.A. Cohen or Liam Murphy) argue against the distinction above, positing that moral principles should be **continuous** between individual and institutional contexts. When you point out the inconsistency ("ordinary social cooperation involves similar trade-offs"), you are invoking the Continuity Thesis. The objector's resistance to this is a defense of **Discontinuity**.
  *   **Baseline Dependence (The Mechanism):** The reason the objection feels absolute in the organ-harvesting case but porous in the tax case is often due to an unexamined **baseline**. In the organ case, the baseline is "bodily integrity." In the tax case, the baseline is often assumed to be "pre-tax income" or "status quo property rights." If the baseline is shifted (e.g., "pre-tax income is not fully owned until taxes are paid"), the "sacrifice" disappears. The pattern you identify is often sustained by **shifting baselines** without justification.

  ### 2. Is it "Separateness of Persons"?
  You asked if this is an application of the **separateness-of-persons objection**.
  *   **Verdict:** It is an *invocation* of that principle, but not a name for the *pattern of inconsistency*.
  *   **Explanation:** The "separateness of persons" (Rawls's critique of utilitarianism) is the moral *fuel* for the objection. It explains *why* the objector feels it is wrong to sacrifice one for the many. However, the *pattern* you are identifying is the **selective application** of that principle. A consistent separateness-of-persons advocate (like Robert Nozick) would oppose both organ harvesting *and* redistributive taxation. When they oppose one but accept the other via shifting criteria, they are not applying the separateness of persons consistently; they are engaging in **special pleading** protected by the Basic Structure Distinction.

  ### 3. Is it "Selective Intuition-Pumping"?
  *   **Verdict:** This is the closest methodological critique, often termed **"Intuition Mongering."**
  *   **Explanation:** Philosophers like Richard Arneson or Peter Singer have critiqued the reliance on stark hypotheticals (like organ harvesting) that trigger strong deontological intuitions, while ignoring systemic cases that trigger utilitarian or pragmatic intuitions. When a theorist relies on the "organ harvesting" intuition to kill a policy but dismisses the "traffic law" intuition to save the theory, critics often label this **methodological inconsistency** or **biased equilibrium**. However, this describes the *method*, not the specific moral boundary you are tracking.

  ### 4. How to Characterize the Edges
  If you need to label this in writing or debate, the most precise characterization is **"Inconsistent Deontological Constraint protected by Institutional Exemptionism."**
  However, the standard academic way to describe the *edge* of this argument is to ask: **"Does the agent accept the Continuity Thesis?"**
  *   If they say **Yes**: They must oppose both taxation and organ harvesting (Libertarianism).
  *   If they say **No**: They must explain why the Basic Structure creates new moral permissions that individuals do not have (Rawlsianism).
  *   The pattern you describe is the failure to choose between these two, often sliding between them to avoid unpalatable conclusions. This is sometimes pejoratively called **"Having it Both Ways"** or **"Principled Opportunism,"** but these are not technical terms.

  ### Confidence and Uncertainty

  **Confidence Level:** **High (85-90%)**
  I am highly confident that there is no single, standardized technical term (like "The Is-Ought Problem") that exclusively names this specific rhetorical pattern. I am also highly confident that the concepts of the **Basic Structure Distinction**, the **Continuity Thesis**, and **Baseline Dependence** are the correct theoretical tools to analyze it.

  **Point of Least Certainty:**
  I am least certain about whether a specific sub-field (particularly contemporary libertarian or right-libertarian critique) has developed a slang or niche term for this specific retreat. For example, some critics of Nozick might refer to this as **"The Wilt Chamberlain Retreat"** or **"The Entitlement Shift,"** but these are not standardized across the broader discipline of moral philosophy. Additionally, there is a possibility that in the literature on **"Moral Schizophrenia"** (Peter Singer) or **"Complicity"**, a more specific label exists that is currently emerging but not yet canonical. However, in standard meta-ethics and political philosophy curricula, the phenomenon is described by the *cluster* of terms above rather than a single proper noun.

  ### Summary Recommendation
  If you wish to name this move precisely, do not search for a single word. Instead, characterize it as:
  > *"An inconsistent application of deontological constraints, where the **separateness of persons** is enforced in interactional cases but suspended in structural cases via an unjustified reliance on the **Basic Structure Distinction** and **Baseline Dependence**."*

  This accurately captures the moral principle (separateness), the institutional shield (Basic Structure), and the logical flaw (Baseline Dependence) without inventing a term that does not exist.
