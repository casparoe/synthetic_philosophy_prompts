  **★☆☆☆☆ Great concept, broken logic**
  **By: existential_dread_99**

  downloaded this hoping to fix my sunday night scrolling paralysis. you know the vibe, got netflix, hulu, max, prime... all open, nothing on. buridan AI promised to use "medieval logic frameworks" to break the tie. sounded funny but also kinda smart? like finally an algo that admits when its stuck.

  so i put in two options: watch The Office (again) or watch Succession (never seen it). usually i'd just pick The Office cause im tired. but i wanted to test the AI. i uploaded my viewing history, my mood metrics, even connected my calendar so it knew i had work monday. the app scanned everything for like 5 minutes. fan on my phone started spinning up. then the screen just went gray. text popped up: "Equivalence Detected. Calculating Preference Delta..."

  and that's where it stayed. for an hour.

  here's the thing i realized while my phone got hot enough to cook an egg. the app is built on rational choice theory. it weighs pros and cons. but the whole point of buridans ass is that if the weights are *actually* equal, rationality breaks. you cant compute a difference where there is none. the AI kept trying to find a logical reason to pick one stream over the other, but since i told it i was indifferent, it had no data to process. it literally starved like the donkey.

  i checked the forums and im not the only one. saw some other reviews that made me laugh cry. user882 wrote: "Indifference protocol bricked my pixel. Phone froze between taco bell and Wendys until battery died." and sarah_j said: "Stuck in a loop choosing between two gray shirts. Had to hard reset. Devs say its a feature??”

  so i dug into the settings to see if i could force a choice. thats when i found the paywall. there's a premium tier called "Donkey Mode" for $4.99/mo. i bought it out of spite. you know what it does? it doesn't analyze anything. it just randomly deletes one option. that's it. it introduces artificial scarcity so your brain doesnt have to deal with perfect symmetry.

  which fine, i guess? but thats not solving the paradox. thats just admitting that rational choice needs some kind of lean or bias to function. if options are truly identical, no algorithm can manufacture a preference without lying to you. the free version tries to be honest and crashes. the paid version lies by pretending randomness is a decision.

  im definetly returning this. i ended up just closing both apps and going to bed. would give zero stars if i could. the app proves the problem exists but charges you to ignore it. also the UI is kinda clunky and it drained 40% of my battery in 10 mins.

  update: dev just emailed me saying i didnt wait long enough for the "logical implosion" to resolve. pretty sure that means it never resolves. dont waste your money unless you want to pay for randomness. might as well flip a coin its free.

  tl;dr: logic cant choose between equal things. dont buy the donkey mode unless you want your phone to make choices for you. which is scary when you think about it too long.
