      2.  *The Self-Undermining Worry:* Does arguing for epiphenomenalism defeat the rationality of holding the position?
      3.  *Skeptical Generalization:* Does this entail skepticism about others' minds or past selves? Is it worse than standard skepticism?
      4.  *Interaction-Lite Positions:* Do panpsychism, Russellian monism, etc., solve this or move the goalposts?
      5.  *Structural/General Problem:* Is this just a case of severing a domain from causal explanation (general metaphysics)?

  3.  **Evaluate the Core Issue (The "Paradox of Phenomenal Judgment"):**
      *   The core tension is: If $Q$ (qualia) causes nothing, and $J$ (judgment "I have $Q$") is caused by $P$ (physical), why does $J$ match $Q$?
      *   Standard Epiphenomenalist Reply: $P$ causes both $Q$ and $J$.
      *   Objection: This makes the match coincidental or inaccessible.
      *   Self-Undermining: If my belief in epiphenomenalism is caused by $P$, not by reasoning from $Q$, is the belief justified?

  4.  **Determine Priorities (The "Defended Agenda"):**
      *   *Priority 1: The Self-Undermining Worry (Rationality/Defeat).* This is the existential threat. If epiphenomenalism is self-refuting or rationally unstable, the reliability debate doesn't matter. It's the most urgent philosophical hurdle.
      *   *Priority 2: The Reliability/Tracking Mechanism (Metaphysics of Correlation).* If we solve rationality, we still need to explain *how* the correlation holds without causation. This is the metaphysical engine.
      *   *Priority 3: Skeptical Generalization (Epistemology).* This follows from 1 and 2. If we solve the immediate justification, does it spill over into skepticism about others?
      *   *Deprioritize:* "Interaction-Lite" (too broad, shifts topic away from pure epiphenomenalism) and "Structural/General" (too abstract, risks losing the specific phenomenological stakes).

