      *Argument for Merging Reliability and Self-Undermining:*
      Actually, I should argue that the "Reliability Response" *is* the attempted solution to the "Self-Undermining Worry." The worry is: "You can't know Q." The response is: "Common cause makes it reliable." The counter-worry is: "But you can't access the common cause link."
