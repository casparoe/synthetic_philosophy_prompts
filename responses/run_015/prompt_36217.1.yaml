      Let's refine the "Reliability" bucket. It's not just "is it reliable?" it's "what is the metaphysical glue?"

      *Final Plan:*
      1.  **Core Strand (2 Researchers): The Epistemic Status of the Epiphenomenalist.** Merge Self-Undermining and Reliability. They are not distinct problems; the Reliability Response is the *only* defense against Self-Undermining. If the response fails, the position is self-undermining. This needs heavy lifting.
      2.  **Secondary Strand (1 Researcher): The Scope of Skepticism.** If the Core Strand succeeds, does it generalize?
      3.  **Deprioritize:** Interaction-Lite (changes the subject) and Structural (too abstract).

      *Wait, I need to check the "Distinct" question again.*
      "Feel free to argue that one of our candidate framings is confused or a dead end."
      I will argue that separating Reliability and Self-Undermining is a mistake. They are the *same* problem described from the outside (reliability) and inside (justification).
      This saves a "slot" to focus more deeply on the Core Strand.
      So: 2 Researchers on the Core (Metaphysics of the Link + Epistemology of Defeat), 1 Researcher on Generalization (Other Minds/Time).

      *Tractability:* A priori. Good for philosophers.
