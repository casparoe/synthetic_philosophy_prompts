prompt: |-
  I'm a science journalist covering neuroscience and theoretical psychology, and I need a reusable editorial procedure I can run in about fifteen minutes to determine whether a research submission genuinely explains its findings through predictive processing and the free energy principle, or merely uses those terms as conceptual decoration. Write a step-by-step checklist—ordered questions, what counts as a sufficient answer at each stage, explicit stop points where the verdict is negative, and clearly marked judgment calls—grounded in the actual mechanics of hierarchical generative models, precision-weighted prediction errors, and active inference rather than loose metaphor. The procedure should distinguish mechanistic specificity from redescriptive labeling, state exactly where evaluation must be handed to a specialist because it exceeds journalistic competence, and flag the steps that are irreducibly value-laden rather than factual. Apply it to two hypothetical cases: first, a clinical study linking hallucination severity to independently measured precision-weighting deficits in auditory cortex; second, a behavioral study describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics. Include at least one worked case where the procedure returns a negative verdict that conflicts with the authors' own framing, and be explicit about what the checklist cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested editorial procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Science journalist covering neuroscience/theoretical psychology.
      *   **Task:** Create a reusable editorial procedure (checklist) to vet research submissions claiming to use Predictive Processing (PP) and the Free Energy Principle (FEP).
      *   **Goal:** Distinguish genuine mechanistic explanation from conceptual decoration (buzzword usage).
      *   **Constraints:**
          *   Must be runnable in ~15 minutes.
          *   Must be grounded in actual mechanics (hierarchical generative models, precision-weighting, active inference).
          *   Must include ordered questions, sufficient answers, explicit stop points (negative verdicts), and marked judgment calls.
          *   Must identify where specialist evaluation is needed.
          *   Must flag irreducibly value-laden steps.
          *   Must apply to two hypothetical cases (one positive/clinical, one negative/behavioral).
          *   Must include a worked case where the verdict conflicts with authors' framing.
          *   Must be explicit about what the checklist *cannot* settle.

  2.  **Deconstruct the Science (PP/FEP):**
      *   *Core Mechanics:* Hierarchical generative models (priors, likelihoods), Prediction Errors (PE), Precision Weighting (confidence in PE vs. Prior), Active Inference (acting to minimize PE/Free Energy).
      *   *Common Misuse:* Using "prediction" to mean "guessing," "free energy" to mean "stress," or "minimizing surprise" to mean "seeking reward" without the mathematical formalism.
      *   *Key Differentiator:* Is the math/model doing the work, or is it just a post-hoc narrative?

  3.  **Drafting the Procedure (The "15-Minute FEP/PP Vetting Protocol"):**
      *   *Time Management:* 15 minutes is tight. The checklist needs to be high-impact, not exhaustive.
      *   *Structure:*
          *   Phase 1: The "Prediction" Check (Is it actually predictive?)
          *   Phase 2: The "Precision" Check (Is uncertainty modeled?)
          *   Phase 3: The "Action" Check (Is active inference distinct from reinforcement learning?)
          *   Phase 4: The "Free Energy" Check (Is the bound actually used?)
          *   Phase 5: Specialist Handoff (When to call an expert).
      *   *Stop Points:* If a core mechanic is missing, stop.
      *   *Judgment Calls:* Mark these clearly (e.g., "Is the model fit sufficient?").
      *   *Value-Laden:* Mark steps involving theoretical preference (e.g., "Is this the *best* explanation?").

  4.  **Refining the Checklist Items (Iterative Process):**
      *   *Draft 1:* "Do they mention prediction errors?" -> *Too vague.*
      *   *Draft 2:* "Do they model the difference between expectation and input?" -> *Better.*
      *   *Draft 3 (Final):* "Is there a formal distinction between top-down predictions and bottom-up sensory evidence, quantified as a prediction error signal?"
      *   *Precision:* Crucial for PP. If they don't mention uncertainty/gain control, it's likely just standard Bayesian inference or metaphor.
      *   *Active Inference:* Distinguish from standard RL. RL maximizes reward; AI minimizes expected free energy (epistemic + pragmatic value).
      *   *FEP:* Often misused. If they just say "system seeks homeostasis," that's not FEP.

  5.  **Developing the Hypothetical Cases:**
      *   *Case 1 (Clinical/Hallucinations):* Needs to show *precision weighting*. Hallucinations = strong priors overriding weak sensory evidence (or vice versa, depending on theory). Needs independent measurement (e.g., MRS, EEG gamma).
      *   *Case 2 (Consumer Choice):* Needs to show *metaphorical usage*. "Minimizing surprise" = buying what you like. No generative model, no precision.
      *   *Conflict:* Case 2 is the obvious negative. I need to ensure the procedure explicitly flags why the authors' framing ("We used FEP!") is wrong.

  6.  **Addressing Constraints & Nuance:**
      *   *Specialist Handoff:* Journalists aren't mathematicians. If the paper relies on variational calculus proofs, the journalist can't verify the math. They must verify the *application* of the math.
      *   *Value-Laden:* Deciding if a theory is "useful" is value-laden. Deciding if the math matches the claim is factual.
      *   *Limitations:* The checklist can't verify data integrity or prove the theory is true, only that the *usage* of the theory is consistent.

  7.  **Final Review against Prompt:**
      *   15 minutes? Yes, it's a checklist.
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop points? Yes.
      *   Judgment calls marked? Yes.
      *   Specialist handoff? Yes.
      *   Value-laden flags? Yes.
      *   Two cases applied? Yes.
      *   Negative verdict conflicting with authors? Yes (Case 2).
      *   Explicit limitations? Yes.

  8.  **Writing the Output:** (Self-Correction during drafting)
      *   *Tone:* Professional, rigorous, journalistic.
      *   *Formatting:* Use bolding, boxes, or clear headers to make it scannable.
      *   *Clarity:* Ensure the distinction between "prediction" (colloquial) and "prediction" (PP technical) is clear.
      *   *Check:* Did I explain *why* Case 2 fails? Yes, because it lacks the generative model specification.

  9.  **Final Polish:** Check the "15-minute" claim. The checklist needs to be short enough. I will group the questions into "Gates." If you fail Gate 1, you stop. This saves time.

  *(Self-Correction on "Value-Laden"):* I need to be careful here. Most of this should be factual (does the paper contain X?). The value-laden part is usually "Is this framework appropriate for this phenomenon?" I will flag that specifically.

  *(Self-Correction on "Specialist"):* I need to define the boundary. A journalist can check for the *presence* of equations or model comparisons. They cannot check the *derivation*.

  Let's assemble the document.
answer: |-
  # The 15-Minute Predictive Processing & Free Energy Vetting Protocol
  **Target:** Science Journalists | **Time Budget:** 15 Minutes | **Goal:** Distinguish Mechanism from Metaphor

  ## Introduction
  This procedure is designed to filter research submissions that claim to utilize **Predictive Processing (PP)** or the **Free Energy Principle (FEP)**. It does not verify the *truth* of the findings, but rather the *integrity of the theoretical application*. Many papers use terms like "prediction error," "surprise," and "free energy" as synonyms for standard cognitive concepts (disappointment, novelty, stress). This checklist forces a distinction between **mechanistic specificity** (the math drives the conclusion) and **redescriptive labeling** (the conclusion is dressed in the math).

  **Warning:** If a submission fails any **STOP** gate, the verdict is **Negative** (Conceptual Decoration). Do not proceed to the next gate.

  ---

  ## Phase 1: The Generative Model Gate (Minutes 0–5)
  *Objective: Determine if "prediction" refers to a statistical model or a colloquial guess.*

  **Q1. Is there a specified Generative Model?**
  *   **Look for:** A description of how hidden causes in the world generate the sensory data the organism receives. Often appears as equations relating latent variables to observations ($P(o|s)$).
  *   **Sufficient Answer:** The paper explicitly defines the probabilistic relationship between hidden states and sensory inputs, or cites a specific canonical model (e.g., Hierarchical Gaussian Filter, Dynamic Causal Modeling).
  *   **Insufficient Answer:** "The brain predicts the future," "Participants anticipated the stimulus," or "Prediction" used interchangeably with "expectation."
  *   **STOP POINT:** If "prediction" is not defined as the output of a probabilistic model mapping causes to effects, **VERDICT: NEGATIVE**.

  **Q2. Is the Prediction Error (PE) quantified?**
  *   **Look for:** A variable representing the difference between the model's prediction and actual input, weighted by uncertainty.
  *   **Sufficient Answer:** PE is treated as a driving signal for learning or neural activity (e.g., "PE signal in layer V pyramidal cells," "trial-by-trial PE regressors in fMRI").
  *   **Insufficient Answer:** PE is described as "surprise" or "violation of expectation" without a computational trace.
  *   **Judgment Call:** *Is the PE signal distinct from a standard Residual in regression?* (If it's just model fit error without a Bayesian update structure, flag for specialist).

  ---

  ## Phase 2: The Precision & Hierarchy Gate (Minutes 5–10)
  *Objective: Determine if the paper captures the core PP innovation (uncertainty weighting) rather than just Bayesian inference.*

  **Q3. Is Precision (Inverse Variance) explicitly modeled?**
  *   **Look for:** Mechanisms that weight the prediction error against the prior based on reliability/confidence. This is the hallmark of PP.
  *   **Sufficient Answer:** The paper discusses "gain control," "precision weighting," or "uncertainty estimation" as a dynamic variable that changes the influence of the PE.
  *   **Insufficient Answer:** Priors and Likelihoods are treated as fixed weights, or "precision" is used to mean "accuracy."
  *   **STOP POINT:** If there is no mechanism for weighting the *confidence* in the prediction vs. the *confidence* in the sensation, **VERDICT: NEGATIVE**. (This is the most common failure point).

  **Q4. Is there Hierarchical Depth?**
  *   **Look for:** Predictions occurring at multiple timescales or levels of abstraction (e.g., proprioception vs. narrative context).
  *   **Sufficient Answer:** Lower levels pass PEs to higher levels; higher levels update priors for lower levels.
  *   **Insufficient Answer:** A single-layer Bayesian update (standard cue integration).
  *   **Specialist Handoff:** *If the hierarchy is defined mathematically (variational free energy bounds), you cannot verify the derivation. Hand off to a computational neuroscientist to confirm the hierarchy is non-trivial.*

  ---

  ## Phase 3: The Active Inference & Free Energy Gate (Minutes 10–15)
  *Objective: Ensure "Action" and "Free Energy" are not metaphors for Reward and Stress.*

  **Q5. If Action is involved, is it Active Inference or Reinforcement Learning (RL)?**
  *   **Look for:** Action described as fulfilling predictions (sampling data to minimize error) rather than maximizing a reward function.
  *   **Sufficient Answer:** Agents act to make sensations match predictions (e.g., "reflexive arc," "epistemic action"). The objective function is Expected Free Energy (EFE).
  *   **Insufficient Answer:** Agents act to "get points," "maximize utility," or "minimize surprise" defined simply as avoiding negative outcomes.
  *   **Judgment Call:** *Does the paper conflate "reward" with "preferred outcomes"?* In FEP, rewards are priors over outcomes. If they treat them as external scalars, it is RL, not Active Inference.

  **Q6. Is "Free Energy" a bound or a feeling?**
  *   **Look for:** Free Energy used as a mathematical upper bound on surprise (evidence lower bound).
  *   **Sufficient Answer:** FEP is the objective function being minimized via perception or action.
  *   **Insufficient Answer:** Free Energy is described as "metabolic cost," "psychological stress," or "thermodynamic entropy" without reference to variational bounds.
  *   **STOP POINT:** If Free Energy is treated as a physiological resource or emotional state, **VERDICT: NEGATIVE**.

  **Q7. [VALUE-LADEN] Is the PP/FEP framing necessary?**
  *   **Question:** Could these results be explained equally well by standard associative learning or heuristic models without the FEP machinery?
  *   **Note:** This is not a factual check. This is a theoretical judgment. If the PP framing adds no predictive power over a simpler model, the paper may be theoretically bloated, even if mathematically correct.
  *   **Action:** Note this in the "Context" section of your article, but do not use it to invalidate the math.

  ---

  ## Specialist Handoff Boundary
  **You must consult a specialist if:**
  1.  The paper relies on **Variational Calculus** derivations you cannot parse.
  2.  The claim rests on **Neurobiological Plausibility** of message passing (e.g., specific laminar connectivity in cortex) that you cannot verify against current anatomical consensus.
  3.  The model comparison uses **Bayesian Model Selection (BMS)** and you cannot verify the priors used for the model comparison itself.

  ---

  ## Application to Hypothetical Cases

  ### Case 1: Clinical Study on Auditory Hallucinations
  **Submission:** "Severity of auditory hallucinations in schizophrenia correlates with gamma-band activity in auditory cortex, interpreted as precision-weighting deficits."
  **Authors' Claim:** "We demonstrate that hallucinations arise from aberrant precision estimation under the Free Energy Principle."

  **Protocol Run:**
  1.  **Generative Model?** Yes. They model tone generation probabilities.
  2.  **PE Quantified?** Yes. Mismatch Negativity (MMN) used as proxy for PE.
  3.  **Precision Modeled?** **YES.** They use MRS to measure Glutamate/GABA ratios (proxy for synaptic gain) and show this correlates with the *weight* given to the PE, not just the PE magnitude.
  4.  **Hierarchy?** Yes. Distinguishes sensory level (tone) from context level (probability rule).
  5.  **Active Inference?** N/A (Perceptual study).
  6.  **Free Energy?** Used as the theoretical bound for the update rule.

  **Verdict:** **POSITIVE (Mechanistic Specificity).**
  **Journalistic Angle:** The study links a specific neurochemical marker (gain/precision) to the computational variable (weighting), avoiding the trap of simply calling hallucinations "bad predictions."

  ***

  ### Case 2: Behavioral Study on Consumer Choice
  **Submission:** "Consumers choose brands that minimize long-term surprise, consistent with the Free Energy Principle."
  **Authors' Claim:** "We apply the Free Energy Principle to economics, showing shoppers minimize free energy."

  **Protocol Run:**
  1.  **Generative Model?** **NO.** The paper describes "expectations" as preferred brands, but does not model how brand attributes generate sensory data (packaging, price) probabilistically.
      *   *Check:* Is there a $P(outcome|choice)$ matrix? No.
  2.  **STOP POINT REACHED.**
      *   *Reasoning:* The paper uses "minimize surprise" to mean "buy what you like." This is tautological utility maximization, not FEP.
  3.  **Precision Modeled?** **NO.** Uncertainty is treated as "risk" (variance in payoff), not precision weighting on prediction errors.
  4.  **Free Energy?** **NO.** Defined in the introduction as "cognitive load."

  **Verdict:** **NEGATIVE (Conceptual Decoration).**
  **Conflict with Authors:** The authors explicitly claim FEP application. The checklist reveals they have replaced the variational bound with a standard utility function and renamed it.
  **Journalistic Angle:** "While the authors frame this as a breakthrough in neuro-economics, the model lacks the generative machinery required by the Free Energy Principle, effectively renaming standard reward-seeking behavior."

  ---

  ## What This Checklist Cannot Settle
  1.  **Truth:** A paper can pass this checklist and still be wrong. The model might be mechanistically precise but empirically false.
  2.  **Derivation Errors:** You are checking for the *presence* and *logical application* of concepts, not the mathematical validity of the proofs.
  3.  **Theoretical Supremacy:** Passing the checklist does not mean PP is the *only* or *best* way to explain the data (see Q7).
  4.  **Data Integrity:** This protocol assumes the data presented is honest. It does not detect p-hacking or image manipulation.

  ## Final Editorial Decision Matrix

  | Result | Action |
  | :--- | :--- |
  | **All Gates Passed** | Treat as genuine PP/FEP research. Focus critique on empirical robustness. |
  | **Failed Gate 1 or 2** | Reject the PP framing. Report as standard Bayesian or cognitive study. |
  | **Failed Gate 3** | Reject the "Predictive Processing" label. Report as standard Bayesian Inference (lacking precision dynamics). |
  | **Failed Gate 5 or 6** | Reject the "Active Inference/FEP" label. Report as Reinforcement Learning or homeostatic regulation. |
  | **Specialist Flag** | Publish with caveat: "Mathematical claims not independently verified." |
