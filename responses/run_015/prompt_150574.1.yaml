  4.  **Drafting Replies & Weaknesses:**
      *   Need to keep replies tight (2 mins spoken is ~250-300 words).
      *   Need to be honest about where the theory is thin.
      *   Must avoid conceding the binary point.

  5.  **Addressing Specific Constraints:**
      *   *Upfront Concession:* Acknowledge lack of calibrated metric, but hold firm on gradation.
      *   *The "Prayer" Question:* Usually the one that exposes a fatal contradiction or a horrific implication. Likely: "If a human has brain damage lowering their PEM below a pig's, do they lose status?" (The Margin Cases argument).

  6.  **Writing the Content (incorporating tone):**
