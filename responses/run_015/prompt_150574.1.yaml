prompt: |-
  I'm presenting next Thursday at our cognitive-science colloqium — audience is mostly evolutionary biologists who study social-insect cognition, plus two deontoligists who think moral dignity can't come in degrees, and one AI-safety researcher who treats consciousness as a binary switch once you cross some information-integration threshold. My thesis: moral status is genuinely gradated, but not on a single "sentience" axis. I claim it tracks predictive-error-minimization capacity scaled by ecological embeddedness, so a hive with complex waggledance integration carries partial, non-trivial status; a basic thermostat carries near-zero but not literally zero; and humans aren't categorically special just for being conscious — we're high on both axes, not on a separate pedestal. I need a Q&A prep sheet: the eight or so objections this exact crowd will actually raise, ordered by how damaging they'd be, each phrased the way they'd put it in the room. For each, give me a reply I can deliver in about two minutes, plus an honest note on where that reply is soft or dodgy. Tell me what I should concede upfront — probably that I don't yet have a calibrated metric — but don't let me concede that gradation secretly collapses back into binary. And include the one question I'm praying nobody asks. Write it like a speaker's cheat-sheet, not an essay.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Speaker:** Cognitive scientist presenting at a colloquium.
      *   **Audience:**
          *   Majority: Evolutionary biologists (social-insect cognition focus).
          *   Minority 1: Two deontologists (moral dignity is binary/non-graded).
          *   Minority 2: One AI-safety researcher (consciousness is binary based on information integration, likely $\Phi$).
      *   **Thesis:** Moral status is gradated, *not* on a single "sentience" axis. It tracks *predictive-error-minimization (PEM) capacity* scaled by *ecological embeddedness*.
          *   Examples: Hive (partial status), Thermostat (near-zero but not zero), Humans (high on both axes, not categorically distinct).
      *   **Deliverable:** Q&A prep sheet (speaker's cheat-sheet style).
      *   **Requirements:**
          *   ~8 objections, ordered by damage potential.
