  # Joint Statement of Adversarial Collaboration: The Nature of Truth and Inquiry

  **Parties:** 
  *   **Party C (Convergence):** Representing the Peircean tradition (Truth as the Ideal Limit of Inquiry).
  *   **Party J (Jamesian):** Representing the Radical Pragmatist tradition (Truth as Practical Payoff).

  **Date:** 24 October 2023
  **Location:** Cambridge Centre for Pragmatic Studies

  ## 1. Agreed Claims

  We, the undersigned, acknowledge deep metaphysical and semantic divergences regarding the definition of truth. However, grounded in our shared pragmatist heritage, we affirm the following propositions as the foundation of our collaboration:

  1.  **Anti-Scepticism:** We reject global scepticism. Inquiry is capable of yielding stable beliefs that justify action and assertion.
  2.  **The Belief-Action Link:** Beliefs are not merely pictures of reality but rules for action (habits). The meaning of a concept lies in the conceivable practical consequences of its object.
  3.  **The Constraint of Experience:** Inquiry is not unconstrained imagination. External reality exerts a resistance upon the inquirer; experience can surprise us and force belief revision.
  4.  **Normativity:** The concept of 'truth' serves a normative function. It distinguishes beliefs we *ought* to hold from those we merely *do* hold.
  5.  **Rejection of Naive Correspondence:** We both reject the notion that truth is a static mirroring of mind-independent objects accessible outside of semiotic or experiential mediation.
  6.  **Fallibilism:** No current belief is immune to revision in the face of future experience or further reasoning.

  ## 2. Disagreements Table: Shared Fixtures

  We stipulate two thought experiments as fixed points for analysing our divergence. Below we record our respective positions and predictions.

  | Case | Description | Party C (Peircean) Position | Party J (Jamesian) Position |
  | :--- | :--- | :--- | :--- |
  | **1. Two Methodical Communities** | Two communities share all data and resources. They differ only in weighting predictive accuracy against unifying simplicity. They permanently settle on incompatible claims ($P$ and $\neg P$). Neither suffers practical failure. | **False Dichotomy.** If inquiry is truly ideal, divergence is impossible. Since they diverge, at least one community is violating a norm of inquiry (e.g., privileging convenience over the Real). One claim is True, the other False, regardless of practical success. | **Pluralistic Truth.** Truth is made in the process of verification. If both beliefs guide their respective communities successfully without friction, both are true. Truth is relative to the conceptual scheme and vital interests of the inquirers. |
  | **Prediction** | | **Convergence Eventual.** We predict that over sufficient time, the 'simpler' theory will fail to account for some nuance, or the 'accurate' one will prove unmanageable, forcing convergence. The case as described is metaphysically unstable. | **Permanent Divergence.** We predict no necessary convergence. Both theories remain 'true' so long as they sustain the life of the inquiry communities holding them. |
  | **2. The Inert Proposition** | A claim about the exact microstate of a causally sealed region. It can never affect observation or action. The ideal limit of inquiry nonetheless asserts it. | **True.** Truth is defined by the final opinion settled upon by reason and evidence. If the ideal limit asserts it, it is True, because the Real includes dispositions and laws that inquiry discovers, even if inert to human senses. | **Meaningless/Truthless.** By the Pragmatic Maxim, a proposition with no conceivable practical difference is meaningless. If it affects no experience, asserting it has no 'cash-value'. It cannot be true because it cannot be useful. |
  | **Prediction** | | **Assertion Stands.** Inquiry will continue to assert this proposition as part of the complete description of reality. | **Assertion Drops.** Inquiry will eventually discard this proposition as a pseudo-problem, a metaphysical leftover with no bearing on life. |

  ## 3. Cruxes and Tests

  We identify the following points as the substantive cruxes of our disagreement. These are not merely terminological but reflect divergent commitments regarding the function of philosophy.

  ### Crux A: The Definition of 'Practice'
  *   **The Dispute:** Party C argues that theoretical satisfaction (e.g., simplicity, unity) is a recognition of the structure of the Real. Party J argues that theoretical satisfaction is merely a psychological or cultural preference, a 'passional nature' fulfilling a desire for order.
  *   **The Test:** Consider a scenario where a highly complex, disunified theory saves the phenomena perfectly, while a simple, unified theory requires ignoring 1% of data. 
      *   **Party C** predicts inquiry will eventually reject the simple theory because the Real is rational and unified; the 1% anomaly indicates error.
      *   **Party J** predicts inquiry may legitimately retain the simple theory if the cost of accounting for the 1% outweighs the vital benefit of simplicity for the inquirers.
  *   **Shared Bearing:** If the complex theory is retained solely due to 'intellectual discomfort' with anomalies, Party J views this as a specific human value (curiosity), whereas Party C views it as obedience to the coercive power of the Real.

  ### Crux B: Permanent Divergence as Failure
  *   **The Dispute:** Does permanent disagreement imply that the question is ill-posed (James) or that one party is in error (Peirce)?
  *   **The Argument:** 
      *   **Party C** argues that if two methods yield different results, the method is not yet ideal. Truth is singular because Reality is singular. To accept permanent divergence is to surrender realism.
      *   **Party J** argues that Reality may be pluralistic. If two maps serve two different travellers perfectly, both are true maps. To insist on one map is dogmatism.
  *   **Shared Bearing:** We agree to monitor historical cases of theoretical underdetermination. If science permanently retains dual theories (e.g., wave-particle duality) without synthesis, Party J claims this validates pluralism. Party C maintains this is a temporary resting place, not the final limit.

  ### Crux C: The Verbal Dispute
  We acknowledge that a significant portion of our dispute is **verbal**, specifically regarding the label 'Truth'.

  *   **Why it is verbal:** Both parties agree on the *facts* of the cases. In Case 1, both agree the communities function successfully. In Case 2, both agree the proposition has no observational consequence. The disagreement lies in whether the word 'true' applies to successful functioning (J) or to ideal settlement (C).
  *   **Why it is not *merely* verbal:** The label carries metaphysical weight. Party C's usage commits us to a Scholastic Realism (laws and generals are real). Party J's usage commits us to a Humanistic Instrumentalism (truth is a value property). Therefore, while we could stipulate distinct terms (e.g., 'Truth*' vs. 'Truth**'), doing so would obscure the deeper disagreement about whether the universe dictates a single story or permits multiple valid narratives.

  ### Proposed Path Forward
  We propose to treat 'Truth' as a cluster concept. In contexts of empirical prediction, Party C's convergence model holds sway. In contexts of moral, aesthetic, or conceptual framework selection, Party J's payoff model holds sway. We shall collaborate to determine the boundary conditions where one model must yield to the other.

  **Signed,**

  *Dr. E. Peirce-Black (Party C)*
  *Prof. W. James-White (Party J)*
