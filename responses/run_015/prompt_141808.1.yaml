  ### Brainstorming Notes

  **Candidate Claims for Agreement:**
  1.  *Truth is not subjective whim.* (Both reject solipsism.)
  2.  *Beliefs are habits of action.* (Core pragmatist tenet.)
  3.  *Reality exerts resistance on inquiry.* (Experience surprises us.)
  4.  *Truth is normative.* (It governs assertion.)
  5.  *Naive correspondence is untenable.* (No "God's eye" view.)

  **Discarded Claims:**
  1.  *Truth is what works.* (Too Jamesian; Peirce rejects 'works' as sufficient.)
  2.  *Truth is final consensus.* (Too Peircean; James allows pluralism.)
  3.  *Inquiry always progresses.* (Too optimistic; both acknowledge stagnation.)
  4.  *Reality is mind-independent.* (Ambiguous; Peirce says yes via Scholastic Realism, James is ambiguous/pluralistic.)

  **Key Tensions to Manage:**
  *   **Singular vs. Plural:** Peirce insists on one Final Opinion; James allows multiple truths if they serve different lives.
  *   **Process vs. Payoff:** Peirce focuses on the *method* leading to settlement; James focuses on the *value* of the settlement.
  *   **The Inert:** Peirce's realism vs. James's pragmatic maxim (meaning requires practical consequence).

  **Strategy for Cases:**
  *   *Two Communities:* Peirce must call this a failure of definition (if they diverge, limit isn't reached) or assert one is objectively wrong despite practical success. James accepts both as true relative to their aims.
  *   *Inert Proposition:* Peirce accepts truth via settlement; James rejects truth via lack of 'cash-value'.

  **Verbal Dispute Identification:**
  *   Much hinges on whether 'truth' tracks *representation of the Real* (Peirce) or *valuation of experience* (James). If we separate 'truth' from 'warranted assertibility', some divergence dissolves.

