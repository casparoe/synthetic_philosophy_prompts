answer: |-
  **Stage 1: Philosophical Notes**

  **Claim:** Genuine deliberation requires not merely the aggregation of locally correct answers, but an institutional capacity to interrupt the flow of information to contest the framing of the inquiry itself; without a mechanism to challenge the structure of decomposition, institutional cognition becomes brittle, systematically blind to category errors that fall outside the parent node's vocabulary.

  **Counter-Claim:** Any mechanism allowing structural contestation reintroduces the very human bottlenecks—rhetorical dominance, fatigue, bias, and infinite regress—that structured decomposition seeks to eliminate, potentially trading systematic blindness for chaotic inefficiency or simply reinstating a single un-factored human judge at the top of the hierarchy.

  ***

  **Stage 2: The Story**

  The terminal screen was the size of a sheet of paper, matte and cool. Wen Salter adjusted her glasses. She was sixty-seven, a retired machinist, and today she was Node 44-9-2 in the Cascade. The room was quiet, shared with six other leaf nodes who were similarly staring at their own narrow slices of the Vale Street decision. There were no speeches here. No gavel. Just the decomposition tree expanding downward until the questions were small enough for one person to answer in an afternoon.

  Wen's task was specific. She did not know the authority was deciding whether to buy out her brother's neighborhood. She only knew her question.

  > **PARENT BRIEF (Node 44-9):** Determine the validity of the 2019 hydrological model's hundred-year flood estimate given new upstream logging data. Assume current sediment transport rates hold.
  >
  > **SUB-QUESTIONS GENERATED:**
  > 1. (Node 44-9-1) Quantify the change in upstream runoff velocity due to logging density changes 2019–2024.
  > 2. (Node 44-9-2) Assess whether the 2019 model's sediment load coefficient remains adequate given current upstream maintenance budgets.
  > 3. (Node 44-9-3) Calculate the variance in flood peak height if sediment load is treated as a static variable versus a dynamic variable.

  Wen was Node 44-9-2. She worked through the maintenance budgets. She cross-referenced the logging data from Node 44-9-1, which was visible to her as a distilled input. Then she looked at the input from Node 44-9-3. That was where the friction started.

  Node 44-9-3 was treating sediment as a dynamic flood-risk variable. Wen's brief, however, asked her to assess sediment as a maintenance cost variable. The 2019 model assumed sediment was dredged regularly (a cost). The new data suggested sediment was accumulating unpredictably (a risk). If she answered her question truthfully, she would confirm the cost model. If she answered the *real* problem, she would have to contradict the premise of Node 44-9-3. But she would never see 44-9-3's full answer, only its compression. And her parent, Node 44-9, would never see the contradiction. It would only see two numbers.

  She typed her analysis. It was careful, hedged, and deeply uneasy.

  > **FULL LEAF ANSWER (Draft):**
  > The 2019 model's sediment coefficient is adequate only if dredging schedules are maintained strictly according to the 2019 budget assumptions. However, the upstream logging data suggests sedimentation rates now exceed dredging capacity by 14%. While the cost model holds (the budget is sufficient to pay for the dredging), the physical reality does not (the dredges cannot clear the water fast enough). Consequently, the flood estimate is valid financially but invalid physically. I cannot reconcile the dynamic variable treatment in sibling node 44-9-3 with the static budget assumption in my brief without violating the parameters of my assignment.
  >
  > **COMPRESSED OUTPUT (Sent to Parent):**
  > The 2019 model's sediment coefficient remains adequate for budgetary planning, though physical dredging capacity may lag behind accumulation rates.

  The compression stripped the contradiction. The parent node would see "Adequate" and "Lag." It would average them. The warning that the model was physically invalid was evaporated because it did not fit the vocabulary of the brief. The brief asked about adequacy, not validity.

  Wen leaned back. This was evaporation. The staff called it a feature; Wen called it a blindfold. She remembered the Long Table. Ten years ago, before the Cascade, she had sat in a room with nineteen others for three days to decide on the East Bank pumps.

  The Long Table had its own rot. She remembered the third afternoon, the air thick with stale coffee and fatigue. Everyone had heard everything, yes, but only the articulate survived. A respected engineer, early on, had made an offhand remark about soil stability that silently fixed the range of the debate for the next sixty hours. No one challenged him because he was respected, and by the time a junior hydrologist raised the decisive objection on the second day, the transcript was already two hundred pages long. Nobody read the part where the objection was raised. They voted on the summary. The summary did not include the objection. The pumps were installed on unstable ground. They had to be ripped out five years later.

  The Cascade prevented the dominance of the articulate. It prevented the fatigue. But it prevented the objection too.

  A chat window pinged. It was Kael, a node at the same level in a different branch. They were allowed to communicate regarding procedural anomalies.

  "I'm seeing frame lock in my branch," Kael typed. "My parent asks for cost-benefit analysis on retreat. There is no branch for 'obligation to residents.' I can't input moral debt into a cost function."

  "Same here," Wen typed. "Sediment is treated as cost in my brief, risk in my sibling's. The contradiction evaporates on upload."

  "Have you tried the Malformed Question flag?" Kael asked. "There's a patch. Routes to Frame Review."

  Wen hesitated. She pulled up the protocol for the flag. It was a new addition, born of cases like this. If she flagged it, her answer wouldn't compress. It would go to a standing Frame Review committee.

  "If I flag it," Wen typed, "doesn't that just create a new node? A Frame Review is itself a committee. They have to decompose the question 'Is this question malformed?'"

  "Exactly," Kael replied. "So you add another level to the tree. Or, if the Review is small enough to not decompose, you've just reinstated a single un-factored human at the top. Which is where the idealization began. We built the Cascade to avoid the bottleneck of one human judge."

  Wen looked at the two options on her screen. **SUBMIT ANSWER** or **FLAG MALFORMED**.

  If she submitted, the Cascade would work as designed. It would produce a recommendation based on incompatible premises, smoothed over by compression. The authority would decide based on a number that looked precise but was conceptually hollow. The floodwall might stay, or the retreat might happen, but the reason would be a ghost.

  If she flagged, she triggered the regress. She forced the system to acknowledge its own structure. But to acknowledge the structure was to step outside the Cascade, to admit that the machine could not check its own eyes. It required a human to say, "This frame is wrong," without the aid of the very decomposition they were questioning. It required the Long Table's vulnerability—the risk of fatigue, of rhetoric, of unread transcripts—in order to catch the errors the Cascade guaranteed.

  The Long Table failed because humans were too noisy. The Cascade failed because humans were too quiet.

  Wen thought of her brother in Lowmarch. He thought the decision was about safety. The Frame Office had decided it was about cost. Her flag might change the frame, or it might just add a layer of bureaucracy that would delay the decision until the next flood season.

  There was no third option. There was no channel for "your question rests on a distinction that does not hold." There was only the answer and the confidence number. She could lower her confidence number, but that was just a weight, not a reason. A low confidence number on a wrong question is still an answer to the wrong question.

  She hovered over the flag. To use it was to claim that the structure was broken. But the structure was the only thing holding the decision together. If she broke the frame, who would hold the pieces?

  Wen sat with her hand on the mouse. The cursor blinked beside the flag. If she clicked it, she would be asking for a human judgment on the limits of the system. If she didn't, she would be complicit in a calculation she knew was false.

  The question was not whether the floodwall should stand. The question was whether a system that cannot ask why it is asking can ever be trusted to answer.
