  I recommend we reject the mandatory 'restorative first' policy and instead issue Student A a formal warning with mandatory training by Friday 24th, while denying Student B's petition to relocate him.

  Regarding the specific case, Student A's action constituted harassment related to a protected characteristic (national origin/accent). While the apology mitigates severity, it does not negate the harm. Student A must complete a diversity awareness programme by 17:00 on Friday 24th and receive a formal warning on his record. Student B's petition to move Student A is denied; there is no evidence of ongoing physical risk warranting displacement, and granting it would set a precedent that public campaigns dictate housing allocation. We will offer B support services but will not compel mediation.

