answer: |-
  **Purpose:** Metaethical Dispute Settlement.
  *Note on Divergence:* For **Machine Alignment (CEV)**, *Recognizability* is demoted (the AI need not share human values, only serve them) and *Monotonicity* becomes critical (partial alignment must not be dangerous). For **Metaethics**, *Recognizability* is paramount (normativity must bind *me*), while *Monotonicity* is less strict (partial reflection may lead astray without invalidating the ideal limit).

  ### Desiderata for Substantive Idealized Deliberation

  **1. Non-Question-Beggingness (The Circularity Constraint)**
  *   **Requirement:** The idealizing conditions (information, vividness, coherence) must be specifiable in non-normative terms. You cannot define "sound reasoning" as "reasoning that leads to the True Good."
  *   **Case:** If "ideal" just means "gets the right answer," the theory reduces to "the right answer is what you'd get if you got the right answer."
  *   **Status:** **Non-Negotiable.** Without this, the account is analytically true but substantively empty.

  **2. Unbounded-Parameter Resolution (The Limit Constraint)**
  *   **Requirement:** Since information and coherence have no logical maximum, the account must specify the target: a mathematical limit, a stability plateau, or a satisficing threshold.
  *   **Case:** "Full information" is incoherent for finite agents; "maximal coherence" may require dropping all contingent beliefs. The theory must define the stopping point without smuggling in normative goals.
  *   **Status:** **Non-Negotiable.** This is the primary source of the "empty placeholder" charge.

  **3. Closure (The Stopping Rule)**
  *   **Requirement:** The list of idealizing parameters must be closed. We must know why *these* cognitive improvements count (e.g., memory, attention) and others do not (e.g., lobotomy, blissful ignorance).
  *   **Case:** If we can always add another parameter to tweak the verdict, the verdict is underdetermined.
  *   **Status:** **Non-Negotiable.**

  **4. Idempotence (The Stability Constraint)**
  *   **Requirement:** Feeding the output of the idealization procedure back into the procedure must yield the same output. The idealized self must endorse its own idealization.
  *   **Case:** If the idealized self would choose to *de-idealize* (e.g., choose ignorance to preserve happiness), the ideal state is unstable and cannot ground a categorical norm.
  *   **Status:** **Non-Negotiable** for a stable normative anchor.

  **5. Starting Material Sensitivity (The Input Constraint)**
  *   **Requirement:** The account must explain whether divergent starting psychologies converge under idealization or remain distinct.
  *   **Case:** If a sadist and a saint remain distinct after full idealization, the theory yields relativism; if they converge, it must explain the mechanism without begging the question.
  *   **Status:** **Camp Prejudice.** Realists demand convergence; Pluralists/Constructivists accept divergence.

  **6. Recognizability (The Authority Constraint)**
  *   **Requirement:** The actual agent must be able to recognize the idealized verdict as authoritative for *them*, not merely as the verdict of a stranger who shares their name.
  *   **Case:** If idealization removes all my contingent passions, the resulting agent may be rational but alien. Why should *I* care what *It* wants?
  *   **Status:** **Camp Prejudice.** Internalists demand this; Externalists (who view normativity as objective fact) reject it.

  **7. Monotonicity of Partial Idealization (The Trajectory Constraint)**
  *   **Requirement:** The account should specify if moving *toward* the ideal (more info, better reasoning) reliably improves normative judgment, or if there is a "valley of bad theory" where partial idealization worsens judgment.
  *   **Case:** Empirical psychology suggests reflection often entrenches bias (polarization). If partial idealization is worse than none, the ideal is epistemically inaccessible.
  *   **Status:** **Non-Negotiable** for epistemic access; **Prejudice** for metaphysical grounding (the truth might be unreachable).

  **8. Empirical Consistency (The Psychological Constraint)**
  *   **Requirement:** The idealizing conditions must be compatible with what is known about cognitive architecture (e.g., bounded rationality, embodied cognition).
  *   **Case:** A procedure requiring god-like working memory describes a different species, not an idealized human.
  *   **Status:** **Non-Negotiable** for naturalistic accounts.

  ### Classification and Elimination

  **Non-Negotiable:** Non-Question-Beggingness, Unbounded-Parameter Resolution, Closure, Idempotence, Empirical Consistency.
  **Camp Prejudices:** Starting Material Convergence (Realist vs. Pluralist), Recognizability (Internalist vs. Externalist).

  **The Single Greatest Eliminator:** **Non-Question-Beggingness.**
  Most historical accounts collapse here. Defining "vivid appreciation" or "sound reasoning" without implicitly referencing the normative outcomes they are supposed to generate is notoriously difficult. If you define "sound reasoning" as "logic," you miss substantive ends; if you define it as "reasoning well," you beg the question.

  **Joint Unsatisfiability:**
  There is a strong case that **Recognizability** and **Non-Question-Begging Idealization** are jointly unsatisfiable given **Empirical Consistency**.
  *Reason:* To be substantive (non-question-begging), idealization must correct deep cognitive errors. Empirical consistency tells us our deep cognitive errors are constitutive of our psychology (e.g., temporal discounting, tribal loyalty). Correcting them sufficiently to generate objective norms produces an agent the actual human cannot recognize or identify with (the "Transformation Problem"). If you preserve Recognizability, you cannot idealize enough to escape the agent's actual errors. This suggests your friend may be right: the view is either empty (too weak to correct) or alien (too strong to bind).

  ### Scoring the Contenders

  **Ideal Observer Theory:** Fails Non-Question-Beggingness (omniscience is ill-defined) and Empirical Consistency (god-like attributes).
  **Brandt (Cognitive Psychotherapy):** Strong on Empirical Consistency and Closure, but fails Unbounded-Parameter Resolution (no clear limit to therapy) and risks Recognizability failures.
  **Full-Information Accounts (Railton/Smith):** Handle Unbounded-Parameters via counterfactuals but notoriously fail Recognizability (the "alienation" objection).
  **Alignment Descendant (CEV):** Solves Unbounded-Parameters via computational extrapolation but explicitly sacrifices Recognizability for safety, making it metaethically insufficient for binding normativity.

  Most accounts fail the Non-Question-Beggingness constraint, while those that satisfy it typically sacrifice Recognizability, suggesting the "empty placeholder" charge holds unless one accepts a transformative view of agency.
