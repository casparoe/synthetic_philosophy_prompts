answer: |-
  Good morning. Welcome to Ashgrove Comprehensive for our Speech Day. It is a pleasure to see so many families here, filling the hall to support the young people who sit before you. For decades, this day has followed a familiar rhythm. We gather, we listen, we applaud, and we acknowledge achievement through a specific, established language of prizes, rankings, and honours.

  This year, however, is the last time we will speak that language.

  I want to be clear about what is changing, and what is not. From September, the academic prizes for top of year and subject excellence will cease. The honours board will not be updated with new cumulative totals. Instead, every student will receive a certificate acknowledging their completion of the year. I also want to be clear about the resources involved. The funds previously allocated to these prizes are being absorbed into the general building fund. They will not be redirected into new bursaries, tutoring programmes, or targeted support for those who struggle. The money is not moving from the top to the bottom; it is moving to the bricks and mortar that house us all.

  I know this decision has been debated fiercely. The governors passed it by a single vote after two years of discussion. I know there are people in this room who campaigned for this change, and people who fought against it. I know there are staff members who sit somewhere in between. I am not standing here to tell you that the old system was unjust, nor am I here to promise that this new system will fix everything. If I told you that removing a prize would suddenly improve the confidence or the outcomes of a student who is finding school difficult, I would be lying. Their teaching will remain the same. Their challenges will remain the same. Their prospects are not being altered by a change in stationary.

  So, if the resources are not changing, and the teaching is not changing, what is this for?

  It is for the experience of sitting in this hall.

  For years, we have asked you to sit here and be measured. We have asked some of you to sit here and be lifted up, and others to sit here and be quietly reminded of where you are not. We have operated on the assumption that recognition requires distinction—that to value one person's effort, we must visibly rank it against another's. But there is a cost to that distinction. It is a cost paid not in resources, but in atmosphere.

  When we construct a system where worth is confirmed by being above someone else, we inevitably define worth for others by being below. For the students who stand on this stage to collect awards, the recognition is real. The effort is real. To deny that would be dishonest. You have earned this moment. But next year, that specific moment will not exist. You will lose a public confirmation of your standing. That is a loss, and I do not wish to minimise it. You are giving something up.

  But for the students who sit in the rows behind them, year after year, watching their names go uncalled, there is also a reality. It is a quiet feeling. It is the sense of being present in a space that is designed to highlight someone else's success. If that feeling is merely envy, we could ignore it. But if that feeling is a sense of diminished worth—a sense that because you are not at the top, you are less visible to the institution—then removing the mechanism that creates it is not just a symbolic gesture. It is a change to the welfare of the school community.

  We are not doing this to lift the bottom up by pulling the top down. We are doing it because we have decided that the comparison itself carries a weight that is no longer necessary. We are removing a source of pressure that benefits only a few while casting a shadow over the many. We are deciding that a student's effort should be acknowledged without needing to be weighed against their neighbour's.

  You will notice, however, that we are keeping the Athletics Cup and the Music Prize. Some might ask why we abolish one form of competition but keep another. The distinction lies in the nature of the activity. When an orchestra performs or a team plays a match, the competition is inherent to the event. You cannot play a game without a score. You cannot perform a concerto without an audience judging the sound. In those cases, the ranking is a byproduct of the performance itself.

  Academic learning is different. It is not a race. Understanding a concept in history or mastering a technique in art is not inherently about beating the person sitting next to you. When we prize it as if it were, we import a competitive structure into a collaborative process. We keep the music and sports prizes because those are celebrations of public performance. We are changing the academic prizes because those are assessments of personal growth. We want you to compete against your own potential, not against each other.

  I look out at this room and I see parents who want the best for their children. I see students who have worked incredibly hard, regardless of where they sit in the hierarchy. I see a community that is trying to decide what kind of place we want to be.

  To the students who have won prizes in the past: thank you. You have set a standard. That standard does not disappear because the plaque does. Your effort remains visible in your work, in your exams, and in the way you conduct yourselves. You are not losing your achievement; you are losing the独占 of its recognition.

  To the students who have not: you are not gaining a prize next year. You are gaining a room where your presence is not defined by your absence from the stage. You are gaining a system that says your completion of the year is worthy of acknowledgement simply because you did it, not because you did it better than someone else.

  This is not a manifesto for equality of outcome. It is a statement about the environment in which we pursue excellence. We cannot build a better school simply by rearranging the honours board. But we can change the air we breathe. We can decide that while we will always celebrate exceptional performance, we will no longer institutionalise the comparison that makes some feel small so that others can feel large.

  My hope for next year is not that everyone feels the same. We are different, and our results will be different. My hope is that everyone feels seen. Not seen in relation to each other, but seen for what they have contributed to this community. The building fund will improve the walls around us. But this change is intended to improve the space between us.

  Thank you for coming, thank you for your support, and congratulations to every student here today. You have all finished the year. You are all still standing. And that is enough to celebrate.
