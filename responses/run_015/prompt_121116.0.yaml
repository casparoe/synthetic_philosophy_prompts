answer: |-
  The Condorcet Jury Theorem guarantees collective reliability only under strict independence and competence conditions that simple majority rule in real committees often violates, thereby severing the automatic inference from mathematical convergence to democratic legitimacy.

  **Exam Question: Epistemic Democracy (Seminar Final)**
  **Time Allowed: 45 Minutes**
  **Total Marks: 25**

  **Question 1**
  A research funding committee consists of 21 members tasked with voting yes/no on whether a specific grant proposal meets objective scientific criteria (there is a fact of the matter). Assume individual competences (probability of voting correctly) are strictly greater than 0.5. However, the committee structure exhibits two features:
  1.  **Correlation:** 7 of the 21 members form a bloc; they read the same summary memo and defer to the same internal expert, meaning their errors are perfectly correlated (they always vote identically).
  2.  **Heterogeneity:** Competences vary significantly across members; the single most competent member has a reliability of 0.9, while the average competence is only 0.55.

  (a) Explain precisely how the bloc violates the standard assumptions of the Condorcet Jury Theorem (CJT) and what this implies for the reliability of a simple majority vote as the committee size remains fixed at 21. (10 marks)
  (b) Given the heterogeneity of competence, compare simple majority rule against weighted voting (weighting by log-odds) and expert rule (deferring to the most competent member). Discuss whether the asymptotic result of the CJT (probability → 1 as *n* → ∞) justifies using simple majority rule in this specific finite context. (10 marks)
  (c) Conclude by distinguishing between the *epistemic reliability* of the procedure and the *political legitimacy* of the decision. Does demonstrating that weighted voting is more reliable than majority rule necessarily imply that democracy is epistemically inferior? (5 marks)

  ***

  **Model Answer**

  The Condorcet Jury Theorem (CJT) establishes that if voters are independent and competent (*p* > 0.5), the probability of a correct majority verdict approaches 1 as the group size increases. However, this mathematical result is settled probability theory, while its application to political democracy is contested political theory. In the scenario provided, the standard inference from CJT to the superiority of simple majority rule fails because the specific assumptions required for the theorem are violated in ways that matter at finite group sizes.

  First, the bloc of 7 members violates the independence assumption. In the standard binomial model, each vote provides unique evidence. Here, the 7 bloc members provide only the evidence of one person. Effectively, the committee size is not 21, but 15 (14 independents + 1 bloc representative). More critically, correlation places a ceiling on reliability. Even if the committee were expanded by adding more members who also defer to that same expert, the group error rate cannot drop below the error rate of the expert themselves. Independence is the engine of the CJT's convergence; without it, adding heads does not add evidence, only redundancy. A student might correctly note the violation but fail to see that this creates a hard limit on accuracy regardless of nominal group size.

  Second, regarding competence heterogeneity, the CJT assumes equal competence or relies on the mean being above 0.5. While the mean here is 0.55, simple majority rule treats all votes equally. Epistemic analysis suggests that weighting votes by the log-odds of competence maximizes group reliability. Furthermore, in small groups (like *n*=21), the asymptotic guarantee is less relevant than finite performance. It is mathematically possible for the single most competent member (0.9 reliability) to outperform the majority of a group with low average competence (0.55), especially when independence is compromised. The asymptotic result (*n* → ∞) is settled mathematics, but it is a poor guide for a committee of 21. Relying on the limit claim here is an error because the convergence speed depends on the margin by which *p* exceeds 0.5; with a mean of 0.55, convergence is slow, and the correlation further retards it.

  Finally, one must distinguish epistemic reliability from political legitimacy. It is settled that if the goal is solely truth-tracking, weighted voting or expert rule may outperform simple majority rule under these conditions. However, whether this implies democracy is "inferior" is contested. Political theorists argue legitimacy derives from equality and autonomy, not just accuracy. Epistocrats argue that if democracy fails to track truth better than chance or experts, it lacks justification. A top answer must recognize that the CJT only supports democracy *if* real electorates satisfy independence and competence conditions. If real voters behave like the bloc described, the mathematical warrant for majority rule collapses, but the normative warrant may remain on non-epistemic grounds. The exam candidate must avoid conflating the failure of the math with the failure of the political principle, while acknowledging that the epistemic defense of democracy requires empirical conditions this committee does not meet.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Identification of Independence Violation (5 Marks)**
  *   **A Grade:** Explicitly states that the bloc reduces the *effective* sample size and notes that correlated errors mean adding members does not add independent evidence.
  *   **B Grade:** Notes that independence is violated but treats it as a minor deviation rather than a structural failure of the evidence aggregation.
  *   **Typical Botch:** Students claim the theorem still holds because the *average* competence is >0.5, ignoring that correlation breaks the binomial sum.

  **2. The Reliability Ceiling (5 Marks)**
  *   **A Grade:** Explains that perfect correlation creates a hard ceiling on group reliability (cannot exceed the bloc leader's accuracy), preventing convergence to 1 even if nominal *n* grows.
  *   **B Grade:** Mentions reliability is reduced but fails to articulate the concept of a non-reducible error floor caused by correlation.
  *   **Typical Botch:** Students assume reliability still increases with *n*, just at a slower rate, missing the asymptotic ceiling.

  **3. Competence Heterogeneity and Weighting (5 Marks)**
  *   **A Grade:** Recognizes that equal weighting is suboptimal when competences vary; identifies log-odds weighting or expert rule as potentially superior in finite contexts.
  *   **B Grade:** Acknowledges competences differ but insists majority rule is still optimal because the mean is >0.5.
  *   **Typical Botch:** Students argue that CJT requires identical competence, whereas it only requires a mean >0.5 (missing the weighting efficiency argument).

  **4. Finite vs. Asymptotic Distinction (5 Marks)**
  *   **A Grade:** Clearly distinguishes between the limit claim (*n* → ∞) and the specific case (*n*=21), noting that slow convergence (mean=0.55) makes the limit irrelevant for this committee.
  *   **B Grade:** Cites the asymptotic result as justification for majority rule without addressing the slow convergence rate at small *n*.
  *   **Typical Botch:** Students write out the limit formula to prove democracy works, ignoring the prompt's constraint on group size.

  **5. Epistemic vs. Political Normativity (5 Marks)**
  *   **A Grade:** Distinguishes between truth-tracking (epistemic) and legitimacy (political); notes that epistemic failure does not automatically negate democratic legitimacy depending on one's normative framework.
  *   **B Grade:** Concludes definitively that "democracy is wrong" or "democracy is right" without separating the mathematical performance from the normative justification.
  *   **Typical Botch:** Students conflate reliability with legitimacy, arguing that because majority rule is less accurate here, it is therefore illegitimate.
