answer: |-
  This is a sophisticated *reductio* that combines a Sorites paradox (the continuum problem) with a problem of moral aggregation. Your friend has constructed a valid argument, but validity doesn't guarantee soundness. Since you want to preserve the intuition that sentience is graded (1) and that we owe something to insects, while avoiding the obligation to thermostats, you need to locate the unsound premise or the invalid inference.

  Your suspicion is correct: **the leak is the equivocation between functional feedback and phenomenal experience in the move from (2) to (3).**

  Here is the breakdown of where the argument fails, what is settled versus contested, and the cheapest fix to save your position.

  ### 1. The Leak: The Inference from (2) to (3)

  Premise (2) states there is "no principled boundary" between a thermostat, an insect, and a mammal regarding **homeostatic regulation**. This is biologically and engineering-wise plausible. All three systems detect deviations from a set-point and act to correct them.

  However, Premise (3) concludes that the thermostat **experiences harm**. This step assumes that *functional homeostasis* is sufficient for *phenomenal experience* (sentience).

  **The Fix:** You can accept (2) as a claim about *mechanism* while rejecting the implication that mechanism entails *mind*.
  *   **Regulatory Continuity:** Yes, feedback loops exist on a continuum from simple to complex.
  *   **Phenomenal Discontinuity:** Experience may require specific architectural thresholds (e.g., integrated information, specific neural substrates, or global workspace access) that thermostats lack entirely.

  By blocking the move from (2) to (3), you keep (1) (sentience is graded *where it exists*) and you keep caring about insects (which cross the threshold for sentience), without owing moral status to thermostats (which remain at zero).

  ### 2. Settled Science vs. Contested Philosophy

  To defend this in a seminar, you need to distinguish what science tells us from what philosophy debates.

  **Settled (Scientific Consensus):**
  *   **Thermostats are not sentient.** There is no evidence that simple feedback loops generate subjective experience. In neuroscience, sentience is correlated with specific "Neural Correlates of Consciousness" (NCC), such as recurrent processing in thalamocortical loops. Thermostats lack neurons, let alone these specific architectures.
  *   **Function $\neq$ Phenomenology.** It is a standard distinction in cognitive science that a system can perform a function (like pain avoidance) without feeling the associated quality (suffering). This is the core of the "Hard Problem" of consciousness.

  **Contested (Philosophical Debate):**
  *   **The Insect Case:** Whether insects are sentient is *not* settled. The Cambridge Declaration on Consciousness (2012) was cautious, including mammals and birds, but insect sentience is currently a hot topic. Some argue their nociception is merely reflexive (like the thermostat); others argue their central complex supports integrated experience.
  *   **Panpsychism:** Your friend's argument implicitly relies on Panpsychism (the view that mind is fundamental and ubiquitous). If one accepts Panpsychism, then (3) is true (thermostats have a tiny bit of experience). However, Panpsychism is a minority view in philosophy of mind, not the consensus.
  *   **Moral Aggregation (Premise 4):** Even if thermostats had negligible moral weight, it is highly contested whether moral values aggregate linearly. Many ethicists argue for **lexical priority** (one mammal's suffering outweighs any number of thermostat "twinges") or **non-aggregation** (de minimis harms do not sum to grave obligations).

  ### 3. The "Cheapest Fix" for Your Seminar Defense

  You want to keep (1) and (2). Here is how you modify the argument to make it sound without abandoning your intuitions:

  **Step 1: Clarify Premise (2).**
  Concede that *regulation* is continuous, but deny that *sentience* tracks regulation one-to-one at the lower bound.
  *   *Defense:* "Sentience is an emergent property of complex regulation, not regulation itself. Temperature is graded, but there is a hard boundary between 'cold' and 'absolute zero.' Similarly, there can be a boundary between 'non-sentient regulation' (thermostat) and 'sentient regulation' (insect)."

  **Step 2: Reject Premise (3).**
  Because thermostats lack the necessary substrate for experience (according to mainstream physicalism), their moral weight is exactly zero, not "negligible but nonzero."
  *   *Defense:* "Zero multiplied by billions is still zero. We are not obligated to thermostats because they are not in the set of sentient things, even if they are in the set of regulatory things."

  **Step 3: Preserve Premise (1) for Insects.**
  Once you establish that insects cross the threshold into sentience (due to neural complexity/nociceptive integration), (1) kicks in.
  *   *Defense:* "Among sentient beings, moral status scales continuously. An insect suffers less than a mammal, so harming an insect is less wrong than harming a mammal, but more wrong than harming a thermostat (which is zero)."

  ### 4. What if you *must* accept Panpsychism?

  If your seminar context forces you to accept that thermostats *do* have some proto-experience (accepting 3), you must attack **Premise (4)** (Aggregation).

  *   **The Argument:** Moral value does not aggregate linearly across distinct subjects. A billion entities with $\epsilon$ moral weight do not necessarily outweigh one entity with $M$ moral weight.
  *   **Philosophical Precedent:** This is similar to the "Repugnant Conclusion" in population ethics. Many philosophers (e.g., Derek Parfit, later work; or lexical prioritarianism) argue that higher capacities create a lexical priority that cannot be swamped by numbers of lower-capacity beings.
  *   **The Cost:** This requires modifying (1) slightly to say moral wrongness scales continuously *within a species or capacity class*, but allows for lexical jumps between classes.

  ### Summary Recommendation

  The strongest, most defensible position that aligns with current science is to **reject the inference from (2) to (3)**.

  1.  **Acknowledge the Equivocation:** Admit that (2) proves functional continuity, not phenomenal continuity.
  2.  **Invoke the Substrate:** Argue that sentience requires specific physical implementation (like nervous systems), which thermostats lack.
  3.  **Save the Insects:** Argue that insects possess the requisite complexity for sentience (nociception + integration), placing them above the zero-boundary, while thermostats remain at zero.
  4.  **Keep (1):** Maintain that *among sentient beings*, moral status is graded.

  This allows you to say: "Sentience is graded (1), regulation is continuous (2), but sentience only emerges above a certain complexity threshold. Therefore, thermostats are at zero, insects are above zero, and we owe obligations to insects but not AC units." This avoids the *reductio* without gutting the motivation for caring about insects.
