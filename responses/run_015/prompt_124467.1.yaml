answer: |-
  There is no single canonical term, but cognitive narratologists classify this as **"narrative empathy"** driven by **"focalization,"** though I would call it **"narrative access bias."**

  The variable doing the work is neither raw quantity of text nor resemblance to yourself, but the **invitation to simulate.** Cognitive literary theory (specifically the work of Suzanne Keen and Lisa Zunshine) suggests readers employ "theory of mind" to simulate the consciousness of characters they are granted access to. This explains your villain: readers sympathize not because his values resemble theirs, but because the narrative forces them to simulate his reasoning process. The hired hand dies offstage; no simulation occurs, so no moral weight is felt. The dog versus the pig is a matter of cultural focalization habits: readers are conditioned to expect interiority from dogs and exteriority from livestock, so even identical description triggers different simulation protocols.

  This is a fact about **moral psychology** that fiction merely isolates. In the real world, we are cognitive misers; we allocate moral concern based on availability and imaginability, not just ontological status. We suffer from "compassion fade" when we cannot simulate the sufferer. Fiction acts as a laboratory control, proving that our moral circle expands or contracts based on who is granted a subjective point of view.

  Regarding your vegetarianism: this exposes a vulnerability in your *motivation*, not necessarily your *ethics*. If your refusal to eat pigs relies solely on feeling empathy for them, you are vulnerable to narrative framing. However, if your stance relies on the philosophical claim of sentience—that the pig suffers regardless of whether you are invited to simulate its pain—then the bias reveals a flaw in human psychology, not in your moral reasoning. The pig's inner life exists independently of your pen; the readers' failure to perceive it is a cognitive limitation, not a metaphysical truth.

  The unsettling takeaway is that moral status is often treated as a resource distributed by narrative attention rather than an inherent property. You aren't manipulating truth; you are manipulating the spotlight. Readers mistake the spotlight for the substance. Recognizing this doesn't invalidate the pig's suffering, but it does require you to acknowledge that without the "aesthetic decision" to grant interiority, most humans will default to treating living beings as objects. Your book didn't create the bias; it just made the mechanism visible.
