          *   *Currency:* "Influence Chips" (start with 5).
          *   *Cost:* Stating a reason that isn't your "True North" costs 1 Chip.
          *   *Certification:* If a reason is challenged as "inaccessible," the speaker must defend it or pay a chip.
          *   *Winning:* Passing the bill (or defeating it) grants chips to the majority side.
      *   **The Rounds:**
          *   Round 1 (The Constraint): Only "Public" reasons allowed. (Simulates the User's demand).
          *   Round 2 (The Proviso): Comprehensive reasons allowed *if* paired with a public translation. (Simulates the Friend's compromise).
      *   **Debrief:** Connect feelings to Rawls, Audi, Wolterstorff.

  4.  **Identifying Predictable Failures (The "Pre-Mortem"):**
      *   *Gaming the System:* Students will treat chips as points to win, not as integrity costs. *Fix:* Emphasize the *feeling* of the cost in debrief, not the score.
      *   *The "Liar" Problem:* Someone will say "I'll just lie." *Fix:* Acknowledge this in debrief as the "Hypocrisy Objection" to public reason.
      *   *The "Veto" Problem:* Certifiers blocking everything. *Fix:* Instructor moderates challenges strictly.
      *   *Time Overrun:* 18 students talking takes forever. *Fix:* Use "Caucus" periods (small groups) before plenary speaking.
      *   *Secular Bias:* Religious cards might feel singled out. *Fix:* Ensure secular cards also have "inaccessible" premises (e.g., complex utilitarian calculus or aesthetic perfectionism).

  5.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* The user's skeleton had Round 1 as "Public Only" and Round 2 as "Proviso." This is good. It forces the "gag" feeling first.
      *   *Critique:* 18 students speaking in plenary is impossible in 20 mins.
      *   *Solution:* Divide into 3 Committees of 6. Each committee debates and votes. Then compare outcomes. This allows everyone to speak.
      *   *Critique:* The "Integrity Token" exchange rate needs to be clear.
      *   *Solution:* 1 Integrity Token = 1 Vote in the final tally. If you lie to fit the rules, you lose voting power. This makes the cost tangible.

  6.  **Finalizing the Output Structure:**
      *   **Overview:** Title, Learning Objective, Time.
      *   **The Case:** Clear, concise bill.
      *   **The Cards:** 18 specific examples (categorized).
