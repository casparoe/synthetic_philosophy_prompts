  7.  **Writing the Content (incorporating the "Voice"):**
      *   Tone: Academic, practical, respectful of the philosophical depth, acknowledging the user's expertise.
      *   Ensure the "Secular Comprehensive" cards are truly contested (e.g., Effective Altruism that demands too much sacrifice, or Aesthetic Perfectionism).
      *   Make sure the "Integrity" mechanic is simple enough to not bog down the debate. *Revision:* Instead of a private ledger which is hard to police, use a physical "Integrity Pool." You start with 5 chips. Every time you state a reason that isn't your *primary* motivation (as defined on your card), you must discard a chip. If you run out, you can still speak, but your vote counts for 0. This makes the cost of "translation" immediate and tangible.

  8.  **Final Review against constraints:**
      *   90 minutes? Yes, tight but doable with strict moderation.
      *   18 students? Yes, broken into 3 groups of 6.
      *   No theory terms until debrief? Yes.
      *   Address the user's specific argument (Friend vs. User)? Yes, via the two rounds.

  *(Self-Correction on the "Integrity" mechanic)*: Tracking private motivation vs public statement is hard for the instructor to verify.
  *Better approach:* The Card lists "True Motivation" and "Possible Public Translation." If they use the Translation *without* the True Motivation (in Round 1), they pay. If they use both (in Round 2), they pay less or nothing.
