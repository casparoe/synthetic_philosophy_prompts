answer: |-
  **The Case**
  Alice and Bob are senior auditors at the same mid-sized firm in Cleveland, earning identical salaries with identical benefits packages. Both report equal life satisfaction and have not scaled back ambitions to match circumstances; neither suffers from adaptive preferences. The sole difference is that Alice voluntarily signed a stringent non-compete clause upon hiring, restricting her from working in local audit for twenty-four months if she leaves, whereas Bob did not. Exiting this contract is legally possible but requires substantial legal fees and a career pause, making it costly but not impossible. Alice currently enjoys secure housing, health, and social affiliation, placing her comfortably above the threshold for all ten central capabilities, a fact she affirms without hesitation.

  **The Walkthrough**
  The **welfarist** verdict is straightforward. The metric is utility or preference satisfaction. Since Alice and Bob report equal welfare and neither is suffering from distorted preferences, the distribution is just. The constraint on Alice matters only instrumentally; because it hasn't lowered her happiness, it generates no complaint.

  The **Dworkinian resourcian** also finds no injustice, though the reasoning differs. The currency is resources, understood through an envy test that respects ambition-sensitive choices. Since Alice voluntarily accepted the restriction, likely in exchange for securing the position, the resulting limitation is a matter of option luck, not brute luck. Dworkin holds individuals responsible for their voluntary contracts. While Alice's future opportunity set is narrower, the distribution remains consistent with equality of resources because it flowed from a free choice among equals. The metric counts the contract as a valid exercise of agency, not a resource deficit requiring compensation.

  **Sen** diverges sharply. The metric is the capability set—the substantive freedom to achieve various functionings. For Sen, freedom has intrinsic value independent of chosen outcomes. Alice's capability set is strictly smaller than Bob's because the cost of exit reduces her effective options. Even though she chose the constraint, the reduction in her substantive freedom constitutes a capability inequality. Justice requires expanding freedom, not merely respecting contracts or maximizing welfare. The inequality survives because the *process* of having options matters, not just the *result* of holding them.

  **Nussbaum** agrees with the welfarist and Dworkinian on the verdict but for distinct reasons. Her metric is threshold sufficiency across ten central capabilities. Justice requires bringing everyone above a minimum level of dignity, not maximizing equality above that line. Since Alice affirms she is above the threshold on all items (including Control Over One's Environment), justice is satisfied. The fact that Bob has *more* capability is irrelevant to justice, though it may represent a loss for human flourishing. There is no complaint of injustice, only a potential loss of something good.

  **The Key Feature**
  The single feature doing the work is the **costly-but-possible exit**. This specific constraint allows Sen to identify a shrinkage in the capability set (freedom is reduced by cost) while allowing Nussbaum to maintain the threshold is intact (sufficiency is met despite cost). If the exit were free, Sen would have no inequality claim. If the exit were impossible, Nussbaum might flag a threshold violation on "Control Over One's Environment."

  **Deletion Test**
  If you make the exit **flatly impossible**, Sen's verdict strengthens (total unfreedom), but Nussbaum's might shift to injustice if the impossibility breaches the threshold for bodily integrity or affiliation. Dworkin would still likely cite voluntary consent, unless the impossibility renders the contract coercive. If you make the restriction **involuntary**, Dworkin shifts immediately to demanding compensation (brute luck), Sen flags severe unfreedom, and Nussbaum flags a justice violation regarding autonomy.

  **Nussbaum Counter-Attack**
  A Nussbaum defender could pull Sen's verdict back inside her framework by invoking the **architectural priority of Practical Reason**. She might argue that capabilities are not isolated items; if a constraint significantly degrades the *quality* of agency required to exercise Practical Reason, it effectively lowers the threshold below the dignity line. She would argue that high exit costs corrode the *substance* of the capability, not just the quantity. If the cost makes the choice to leave effectively unavailable to a dignified agent, the threshold is breached, transforming the case from a loss of flourishing into a violation of justice.
