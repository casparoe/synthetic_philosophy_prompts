prompt: |-
  hey, I'm in a distributive justice seminar and I'm on the hook for bringing a case to discussion next week, and honestly what's bugging me is that my prof keeps saying "the capability approach" like it's one single view. I want a case that cracks Sen and Nussbaum apart from each other, and also apart from a Dworkin-style resourcian and a straight welfarist. Can you build that for me to spec?

  what it's for: a seminar where people have already done the readings, so the case has to actually generate the verdicts rather than smuggle them in. if I can't show the reasoning comes out of the theories themselves, I've wasted everyone's time.

  the scenario:
  - one paragraph, realistic, set somewhere boring and ordinary (a city, a firm, a hospital admin office, a household). no sci-fi, no desert islands, no lottery winnings
  - two people, A and B, who are equal on resources and equal on welfare/preference satisfaction, and I mean genuinely equal, not equal because A has quietly scaled her ambitions down. no adaptive preference moves anywhere in the case. also ban the stock examples: no wheelchair, no fasting holy man vs starving man, no contented slave, no cheerful 1950s housewife, no expensive taste cases where someone needs rare claret to be happy
  - the only thing that differs: A has voluntarily signed onto some restriction (contract, tied visa, professional licensing, a partnership clause, whatever you think works best) that makes a whole region of options expensive for her to get back to but not literally impossible
  - and A sits comfortably above the threshold on every item on Nussbaum's list of central capabilities, all ten of them, and she'd tell you so herself in a calm moment if you asked

  target verdicts:
  - welfarist: no complaint, A and B are equally well off
  - Dworkinian resourcian: no complaint about the distribution as such (he's allowed to grumble about the enforceability of the contract for other reasons, but the equality metric says they're even)
  - Sen: a real capabilty inequality, and it survives the fact that she chose it
  - Nussbaum: no complaint of justice at all, maybe just a loss of something good

  if you think one of those four verdicts can't actually be produced from the theory rather than asserted, tell me which one and why instead of fudging it. I'd rather have three clean verdicts and an honest flag than four rigged ones.

  then the walkthrough:
  - for each view, show the reasoning that produces the verdict, from the theory's own commitments (what metric, what's the currency, what counts as a conversion factor, whether freedom has value over and above chosen functionings). make it checkable, so someone in seminar can say "no, Dworkin would actually treat that as a resource deficit" and I can see whether they're right
  - name the single feature doing the most work. my guess is the costly-but-possible exit, since that's what lets Sen call the set smaller while Nussbaum says the threshold is still met, but argue for it rather than agreeing with me by default
  - deletion test: what happens to each of the four verdicts if you make the exit flatly impossible, and separately what happens if you make the restriction involuntary
  - and finish with how a Nussbaum defender would attack the case to pull Sen's verdict back inside her own framework (I assume she'd say practical reason has architectural priority over the rest of the list, but I want her best version)

  no reading list or citations pls, I've got that covered. just get the philosophy right. around 700-900 words total is fine.
