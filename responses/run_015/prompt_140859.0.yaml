answer: |-
  Dear Students, please read the following prompt carefully as it constitutes the sole requirement for your take-home final examination in this upper-level normative theory seminar. You have forty-five minutes to compose a response that demonstrates your mastery of the complexities surrounding aggregative welfare theories and their most famous objections. We begin by recalling Robert Nozick's original formulation of the utility monster, which appears in Anarchy, State, and Utopia as a challenge to utilitarianism and other views that maximize the sum total of welfare. In the standard case, there exists a being who converts resources into welfare at a vastly higher rate than any normal person. If morality requires us to maximize total welfare, and if resources are scarce, then it seems we are obligated to transfer almost all resources from everyone else to this monster, leaving the rest of humanity at subsistence levels or worse, simply because the monster gains so much more utility from each unit of resource than anyone else does. The intuitive force of this objection is usually taken to show that aggregative views violate the separateness of persons by treating society as a single super-person whose greater good justifies sacrificing the interests of individuals. However, it is worth interrogating precisely what drives the intuitive rejection of this outcome. Is it the aggregative structure itself that is problematic, or is it something contingent about the setup, such as the scarcity of resources, the opportunity costs imposed on others, or the extreme concentration of benefit in a single subject? To test this, I am asking you to consider two modified variants of the monster case alongside a mirror-image case. The first variant is the closed-loop monster. In this scenario, the being still generates enormous welfare, but it does so entirely through internally generated experiences that use up nothing anybody else could have used. There is zero opportunity cost to feeding it or allowing it to exist because its bliss is cheap and does not compete for the resources that sustain everyone else. The second variant is the swarm. Here, nobody is above average in terms of efficiency, but there is a very large population each of whom is very slightly more efficient at turning resources into welfare than the remaining population. Total welfare is still maximized by giving this swarm everything and holding everyone else at subsistence, even though no single individual in the swarm is a monster in the traditional sense. The benefit is distributed across many subjects rather than concentrated in one, yet the aggregative logic demands the same sacrificial outcome for the less efficient group. Finally, you must consider the dud, which is the mirror-image case. This is a person for whom resources produce vanishingly little welfare compared to the average person, such that on any aggregation-friendly view, society seems to owe them nothing at all, and perhaps should even take from them if that boosts the total sum elsewhere. Your task is to write an essay that diagnoses what is doing the work in the original intuition against the utility monster. You need to determine whether the objection holds water against the closed-loop monster where scarcity is removed, and whether it holds against the swarm where concentration is removed. If the intuition persists in the closed-loop case, then scarcity and opportunity cost are not the primary drivers of the objection. If the intuition persists in the swarm case, then concentration of benefit in a single subject is not the primary driver. You must then explain what this implies for the dud. If aggregative views are committed to starving the dud to feed the swarm, does that confirm the objection is about aggregation itself, or does it suggest that our intuitions about the dud are different from our intuitions about the monster? You should address whether the dud case strengthens or weakens the case against aggregative views depending on your analysis of the variants. I am not looking for a simple restatement of Nozick's position or a declaration that utilitarianism is false. I want to see you isolate the variable that triggers the moral alarm bell. Is it the loss of rights, the unfairness of the distribution, the lack of reciprocity, or the sheer sum-maximizing logic? You must engage with the specific mechanics of the closed-loop and swarm variants to show you understand how they alter the standard objection. Please ensure your response is structured as a coherent argument rather than a list of points, and make sure you explicitly state what your analysis implies for how we should treat the dud under an aggregative framework. This question is designed to test your ability to manipulate thought experiments to isolate normative principles, so precision in your distinctions is paramount. You should aim to write enough to fully develop these distinctions within the time limit, ensuring you do not gloss over the differences between the swarm and the original monster. Remember that the goal is not just to describe the cases but to use them to test the underlying moral theory. Good luck.

  The core issue driving the intuition against the utility monster is not aggregation per se but rather the combination of scarcity and the violation of constraints protecting individuals from being used merely as means, though the swarm variant complicates this by removing the singular subject focus. In the closed-loop case, where the monster's welfare comes from internal experiences with zero opportunity cost, the aggregative view demands nothing sacrificial from others, so the objection largely dissolves because no one is harmed to feed the monster. This suggests that the original intuition relies heavily on scarcity and opportunity cost rather than the mere existence of a high-welfare being. If the monster does not take anything from us, we have no grounds to complain about its existence or its happiness, even if it is vastly happier than us, which implies that the objection is not about inequality of welfare itself but about the process of redistribution required to achieve it. However, the swarm variant restores the sacrificial element without the singular subject. Here, aggregative views still demand that the less efficient group be held at subsistence to maximize the total sum, even though the benefit is distributed across many slightly more efficient individuals rather than one monster. If the intuition against sacrificing the less efficient group remains strong here, it shows that the problem is not the concentration of benefit in one subject but the aggregative logic itself that permits sacrificing some for the greater total. This points toward a rights-based or constraint-based objection where individuals have a claim to a certain baseline of resources that cannot be overridden by total sum calculations. When we turn to the dud, the implications become stark. If the analysis of the swarm confirms that aggregation allows sacrificing the less efficient for the total, then consistency demands that the dud, who produces vanishingly little welfare, is owed nothing and may legitimately be deprived of resources to benefit others. This is often more intuitively repugnant than the monster case because it involves actively harming the least advantaged rather than merely failing to elevate them. If a student argues that the dud case refutes aggregation, they must explain why the intuition is stronger here than in the monster case, perhaps because the dud is vulnerable rather than dominant. Ultimately, the work being done in the original monster intuition is largely about the violation of separateness and the impermissibility of using people as means, which is present in the swarm but absent in the closed-loop case. The dud case reinforces this by showing that aggregation fails to protect the vulnerable just as it fails to protect the average from the monster. Therefore, the objection holds against aggregation when it involves sacrifice, regardless of whether the beneficiary is one monster or a swarm, and regardless of whether the victim is the average person or the dud. The closed-loop case is the exception that proves the rule, showing that without sacrifice, aggregation is less objectionable. This implies that any viable normative theory must include side constraints that prevent resources from being transferred away from individuals solely on the basis of marginal welfare efficiency, protecting both the average person from the swarm and the dud from being left with nothing.

  This marking scheme is out of twenty points and should be applied holistically based on the depth of analysis provided in the student response. Ten points are allocated for the correct diagnosis of the closed-loop variant, specifically recognizing that removing opportunity cost removes the moral objection, which indicates that scarcity is a key driver of the intuition. Five points are allocated for the analysis of the swarm, where the student must distinguish it from the original monster by noting the distribution of benefit across many subjects rather than one, and argue whether the sacrificial logic remains objectionable without a singular monster. Five points are allocated for the implications regarding the dud, requiring the student to connect the logic of the swarm to the treatment of the least efficient person and explain whether this strengthens or weakens the case against aggregation. Students will lose significant marks if they treat the swarm as just the monster with extra steps without analyzing the distributive difference, as this misses the point of the variant which is to test concentration versus aggregation. Students will also lose marks if they simply assert that it is a reductio so the aggregative view is refuted without explaining which premise fails or why the intuition holds in these specific variants, as this is a claim rather than an argument. High marks are reserved for responses that clearly isolate scarcity and sacrifice as the problematic elements rather than aggregation itself, and who can articulate why the dud case might be even more damning for utilitarianism than the monster case. Responses that fail to address the dud or conflate the closed-loop case with the standard monster will be capped at ten points regardless of writing quality.
