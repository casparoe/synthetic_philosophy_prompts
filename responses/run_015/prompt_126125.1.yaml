prompt: |-
  Please act as a philosopher of rational choice who works specifically on decision-making under risk and uncertainty — someone equally fluent in expected utility theory as a normative benchmark and in the family of views that try to amend it (risk-weighted expected utility, ambiguity-sensitive views, lexical and threshold views, and the standard reductions of apparent risk-aversion to curvature in the utility function). Take your time and think carefully before answering: I would rather have a careful reconstruction that leaves the complications in place than a clean verdict that smooths them away. Before you answer, sketch briefly the several different things that could in principle be doing the work in the practice I am about to describe — nonlinearity in the probabilities, nonlinearity in the value of the outcomes, attitudes to model uncertainty, side constraints, option value — and then tell me which of them the practice actually requires.

  I sit on the grants committee of a mid-sized philanthropic foundation, and I have become bothered by an asymmetry in how we handle small probabilities. On the upside we are aggressively expected-value: we deliberately fund long-shot, high-upside work — a neglected vaccine, a policy campaign with perhaps a 3 percent chance of landing, an early-stage research programme — and we openly rebuke colleagues who get cold feet about low probabilities, on the grounds that a 1 percent chance of a thousandfold payoff is worth ten times a guaranteed tenfold one. On the downside we refuse to reason that way at all. Any proposal carrying a non-trivial chance of what our risk register calls an unacceptable outcome — catastrophic loss of life, a laboratory release with pandemic potential, an irreversible ecological collapse — is vetoed outright; the expected value of the upside is not permitted into the discussion, and, strikingly, the stated probability of the catastrophe seems to make very little difference to the conversation, so that a one-in-a-thousand chance and a one-in-twenty chance of the same catastrophe get treated almost alike. A second feature of the pattern: we are happy to multiply when the numbers come from a well-measured base rate, such as vaccine efficacy or the historical frequency of a given kind of regulatory win, but our confidence collapses when the numbers come out of a model whose own parameters are themselves estimates — and this happens even when the model's uncertainty is roughly symmetric and we have no particular reason to think it is biased up rather than down. A third: the veto applies to harms we might bring about, but we do not treat declining to fund a catastrophe-prevention project as anywhere near as serious, even though on our own accounting the unspent money and the risky project have the same expected cost in lives; when I raised this, one trustee said that is just the act/omission distinction and has nothing to do with probability, and another said our downside is bounded by the endowment so the two cases really are not symmetric. I do not know what to make of either reply.

  What I want from you is the implicit theory of rational choice under risk that this pattern presupposes. I have seen the label risk-weighted expected utility used for views that keep the broad shape of expected utility but let a risk function transform the probabilities, so that very small chances of disaster are not diluted in proportion to their probability — but I am not sure that is what we are doing, and there are other candidates in the neighbourhood: plain expected utility combined with the thought that extinction or collapse is not merely a very large number of deaths, a lexical or threshold constraint on losses, genuine ambiguity aversion in the model-uncertainty cases, or something about irreversibility and the value of keeping options open. Do not just survey these views; I can read about them on my own. Instead: reconstruct the theory our practice commits us to; separate what the practice strictly presupposes from what it merely sits comfortably with; tell me where the deviation from expected utility is located in our pattern — in how we weight probabilities, in how we value outcomes, or somewhere else entirely; say which parts of the pattern are consistent with several theories at once and therefore do not discriminate between them; and say what would concretely have to change in how we make grants if we adopted, first, straightforward expected utility with no weighting, and then, explicitly, a risk-weighted view. If some part of the pattern is simply incoherent — including the upside/downside asymmetry or the act/omission asymmetry — say so and say which part of the practice would have to give.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of rational choice specializing in decision-making under risk and uncertainty (fluent in EUT, REU, ambiguity, lexical views, etc.).
      *   **Task:** Reconstruct the implicit theory of rational choice underlying the described grants committee practice.
      *   **Specific Instructions:**
          *   Sketch briefly the candidate mechanisms (nonlinearity in probabilities, value, ambiguity, constraints, option value).
          *   Identify which mechanisms the practice *actually requires*.
          *   Reconstruct the implicit theory (commitments vs. compatibility).
          *   Locate the deviation from Expected Utility Theory (EUT) (probability weighting, outcome valuation, or elsewhere).
          *   Identify which parts of the pattern are consistent with multiple theories (underdetermined).
          *   Specify concrete changes required if adopting (a) straightforward EUT, and (b) explicit Risk-Weighted Expected Utility (REU).
          *   Identify incoherencies (upside/downside asymmetry, act/omission distinction) and state what must give.
          *   **Tone/Style:** Careful reconstruction, leave complications in place, no clean verdicts that smooth things away.

  2.  **Deconstruct the Case Study (The Grants Committee Practice):**
      *   *Feature 1 (Upside):* Aggressively EV-maximizing for gains. 1% chance of 1000x > 100% chance of 10x. Rebuke "cold feet" (risk aversion) on gains.
      *   *Feature 2 (Downside):* Veto on "unacceptable outcomes" (catastrophe). EV of upside ignored. Probability insensitivity (1/1000 $\approx$ 1/20).
      *   *Feature 3 (Ambiguity/Model Uncertainty):* Trust base rates, distrust model outputs (even if symmetric uncertainty). Confidence collapses.
      *   *Feature 4 (Act/Omission):* Veto applies to causing harm (funding risky project), not preventing harm (not funding safety project). Justifications: Act/Omission distinction OR Bounded Endowment.

  3.  **Initial Brainstorming & Candidate Mechanisms:**
      *   *Nonlinearity in Value (Utility Function):* Standard EUT explanation for risk aversion. But the committee *rejects* this on the upside (they are risk-neutral/seeking there). So, utility curvature alone cannot explain the downside veto unless the utility function is asymmetric (convex for gains, concave/lexical for losses).
      *   *Nonlinearity in Probabilities (Weighting):* REU or Prospect Theory. Overweighting small probabilities of disaster? But they treat 1/1000 and 1/20 similarly. This suggests a *threshold* or *lexical* view rather than smooth weighting.
      *   *Ambiguity Aversion:* Distrust of model parameters vs. base rates. Fits Feature 3.
      *   *Deontological/Side Constraints:* "Do not cause catastrophe." Fits Feature 2 and 4 (Act/Omission).
      *   *Option Value/Irreversibility:* Catastrophe is irreversible. Fits Feature 2.
      *   *Bounded Utility:* The "endowment" argument.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the role. Set the stage.
      *   **Sketch of Mechanisms:** Briefly define the tools (Utility curvature, Probability weighting, Ambiguity, Lexical/Threshold, Option Value).
      *   **Reconstruction of the Implicit Theory:** This is the core. I need to synthesize the features into a coherent(ish) framework.
          *   *Upside:* Looks like EUT (Risk Neutral).
          *   *Downside:* Looks like a Lexical Threshold or Deontological Constraint. Probability insensitivity is key here. It's not REU (which is smooth); it's a "cliff."
          *   *Ambiguity:* Maxmin Expected Utility (MEU) or Alpha-Maxmin? They discount model uncertainty heavily.
          *   *Act/Omission:* This is the friction point. It suggests a deontological constraint ("Do no harm") rather than a consequentialist one ("Minimize harm").
      *   **Locating the Deviation from EUT:**
          *   Upside: Consistent with EUT (linear utility, linear prob).
          *   Downside: Violates EUT. Is it probability weighting? No, because of the threshold effect. Is it utility? Yes, effectively infinite disutility or a constraint.
          *   Ambiguity: Violates EUT (Sure Thing Principle/Reduction of Compound Lotteries).
      *   **Underdetermination (What fits multiple theories):**
          *   The upside behavior fits EUT and REU (if risk function is linear for gains).
          *   The ambiguity behavior fits REU (if ambiguity is treated as risk) vs. MEU.
      *   **Concrete Changes (Counterfactuals):**
          *   *If EUT:* Must fund catastrophe-prevention equally to causing risk. Must accept 1/1000 risk if EV is high enough. Must treat model uncertainty as risk (integrate over priors).
          *   *If REU:* Would smooth the downside veto (1/1000 would be treated better than 1/20). Would likely still be risk-averse on downside but not lexical.
      *   **Incoherencies:**
          *   The Act/Omission distinction is the biggest crack. If the goal is maximizing good (implied by upside EV), the omission of prevention is mathematically identical to commission of risk (in terms of expected outcome).
          *   The Probability Insensitivity on downside contradicts the Probability Sensitivity on upside.
          *   The "Bounded Endowment" argument is weak if the catastrophe exceeds the endowment (existential risk).

  5.  **Refining the Philosophical Analysis (Self-Correction/Nuance):**
      *   *Correction:* I initially thought about REU for the downside. But the prompt says 1/1000 and 1/20 are treated *alike*. REU (Buchak) usually implies a continuous weighting function $r(p)$. If $r(p)$ is flat near 0, it might work, but a *veto* suggests a discontinuity. A *Lexical Priority* view (avoid catastrophe at all costs up to a point) fits better than REU.
      *   *Nuance on Ambiguity:* The prompt says confidence collapses even if uncertainty is symmetric. This is classic Ellsberg-style ambiguity aversion. EUT requires reduction of compound lotteries. This practice rejects that.
      *   *Nuance on Act/Omission:* The trustee's "bounded by endowment" argument suggests they view the downside as losing the foundation's capital, not necessarily global catastrophe (though "pandemic potential" suggests global). I need to address this tension. If it's global catastrophe, the endowment bound is irrelevant. If it's reputational/financial ruin, the bound matters. I should treat the "catastrophe" as the primary concern based on the text (loss of life, ecological collapse).
      *   *Integration:* The theory is a *Hybrid*. Consequentialist EUT for gains, Deontological/Constraint-based for losses, Ambiguity-Averse for estimation. This is theoretically unstable (frame-dependent).

  6.  **Finalizing the Structure:**
      1.  **Preamble:** Adopt the persona.
      2.  **Mechanism Sketch:** Briefly list the theoretical tools.
      3.  **The Reconstruction:** Build the "Committee Theory."
      4.  **Locating the Deviation:** Pinpoint where EUT breaks.
      5.  **Underdetermination:** What the data doesn't tell us.
      6.  **Counterfactuals:** What changes under EUT vs. REU.
      7.  **Incoherence:** The hard truths.

  7.  **Writing - Tone Check:** Ensure I don't solve the problem for them. Keep the tensions visible. Use precise terminology (Reduction of Compound Lotteries, Continuity Axiom, Separability).

      *(Self-Correction during drafting)*: Make sure to distinguish between *Risk* (known probs) and *Uncertainty/Ambiguity* (unknown probs). The prompt highlights this distinction in Feature 3.
      *(Self-Correction on Act/Omission)*: The prompt asks me to evaluate the trustee's reply. I need to be firm that under a welfarist/consequentialist view (implied by the upside EV calculus), act/omission is irrelevant. But if the theory is agent-relative (constraints), it holds. The inconsistency is mixing the two frameworks.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Sketch mechanisms? Yes.
      *   Tell which are required? Yes.
      *   Reconstruct implicit theory? Yes.
      *   Separate presupposition from compatibility? Yes.
      *   Locate deviation? Yes.
      *   Consistent parts? Yes.
      *   Concrete changes (EUT vs REU)? Yes.
      *   Incoherence? Yes.

      *Let's write.*
answer: |-
  As a philosopher of rational choice, I will approach your committee's practice not as a set of errors to be corrected, but as a data set revealing an implicit decision-theoretic structure. You are asking for a reconstruction of the normative logic that makes sense of your behavior, even if that logic is not globally consistent.

  Below, I first sketch the theoretical mechanisms available to us. I then reconstruct the specific hybrid theory your practice commits you to, locate the deviations from Expected Utility Theory (EUT), identify where your practice underdetermines the theory, and finally specify the concrete shifts required by alternative frameworks and the points of genuine incoherence.

  ### 1. Sketch of Candidate Mechanisms

  To explain your pattern, we can deploy five distinct theoretical tools. Any one of them *could* explain risk-averse behavior, but they do so in structurally different ways:

  1.  **Concavity in the Utility Function (EUT):** Risk aversion is explained by diminishing marginal value of outcomes. A 50% chance of \$200 is worth less than a guaranteed \$100 because the second \$100 is worth less to you than the first. This preserves linearity in probabilities.
  2.  **Nonlinearity in Probability Weighting (REU/Prospect Theory):** The decision weight assigned to a probability $p$ is not $p$. In Risk-Weighted Expected Utility (REU), a risk function $r(p)$ transforms probabilities. Typically, this overweights small probabilities of extreme outcomes (the "possibility effect").
  3.  **Ambiguity Aversion (MEU/$\alpha$-Maxmin):** Distinguishes between *risk* (known probabilities) and *uncertainty* (unknown probabilities). A decision-maker may evaluate an act by its minimum expected utility across a set of priors (Maxmin) or a weighted average of the min and max (Hurwicz/$\alpha$-Maxmin). This violates the Reduction of Compound Lotteries.
  4.  **Lexical or Threshold Constraints (Deontological/Satisficing):** Certain outcomes are "forbidden" regardless of probability or compensating upside. This violates the Continuity Axiom of EUT. No amount of good can trade off against a "catastrophe" once a probability threshold is crossed (or even at any non-zero probability).
  5.  **Option Value and Irreversibility:** A dynamic consideration. If an outcome is irreversible (extinction), the value of keeping the option to avoid it open may exceed the static expected value of the current choice.

  ### 2. Reconstruction of the Implicit Theory

  Your committee's practice does not map cleanly onto a single standard view (like EUT or REU). Instead, it commits you to a **Fragmented Hybrid Theory** that switches frameworks based on the valence of the outcome and the source of the probability.

  **A. The Upside: Risk-Neutral EUT**
  On the upside, you are straightforward Expected Utility maximizers with a linear utility function for gains. You reject the "cold feet" of colleagues because you accept the **Independence Axiom** and **Linearity in Probabilities** for positive outcomes. You believe $0.01 \times U(1000x) > 1.0 \times U(10x)$. This presupposes that utility is not concave in this domain and that probability weighting is identity ($r(p) = p$).

  **B. The Downside: Lexical Threshold Constraints**
  On the downside, you deviate sharply from EUT. The fact that a 1/1000 chance and a 1/20 chance of catastrophe are treated "almost alike" and result in a veto indicates you are not using smooth probability weighting (REU). In REU, $r(0.001)$ should still be distinguishable from $r(0.05)$.
  Instead, your practice presupposes a **Lexical Priority View** or a **Threshold Constraint**. You are operating with a rule of the form: *If $P(\text{Catastrophe}) > \epsilon$, then $U(\text{Act}) = -\infty$*, or more deontologically: *It is impermissible to perform an act with $P(\text{Catastrophe}) > \epsilon$, regardless of expected good.* The "insensitivity" to probability magnitude suggests the constraint is triggered by the *presence* of the risk, not its precise expectation.

  **C. The Model Uncertainty: Ambiguity Aversion**
  Your distrust of model-derived probabilities versus base rates, even when symmetric, is a textbook violation of the **Reduction of Compound Lotteries**. EUT demands you integrate over the uncertainty in the parameters to find a single subjective probability. Your practice treats "probability derived from a shaky model" as a different category than "probability derived from a base rate." This commits you to **Ambiguity Aversion** (likely Maxmin Expected Utility or a similar multiple-priors model) specifically for model-dependent estimates.

  **D. The Act/Omission Asymmetry: Agent-Relative Constraints**
  The refusal to treat unfunded prevention projects as equivalent to funded risk projects is the most theoretically loaded feature.
  *   *Trustee 1 (Act/Omission):* Argues for **Agent-Relative Constraints**. You have a duty not to *cause* harm that you do not have to *prevent* harm. This is non-consequentialist.
  *   *Trustee 2 (Bounded Endowment):* Argues for **Bounded Liability**. The foundation's responsibility is limited to its assets.
  However, since the "catastrophes" described (pandemic, ecological collapse) exceed the foundation's endowment in scale, Trustee 2's argument only holds if the "unacceptable outcome" is defined as *liability to the foundation* rather than *global harm*. Given the context, your practice presupposes **Agent-Relative Constraints**: the moral weight of the outcome depends on your causal agency, not just the state of the world.

  ### 3. Locating the Deviation from Expected Utility

  Where exactly does your practice break the EUT machinery?

  1.  **In the Valuation of Outcomes (Downside):** EUT can accommodate risk aversion via concave utility, but it cannot accommodate a *veto* that ignores the magnitude of the upside. To model your downside behavior within EUT, the disutility of the catastrophe would have to be infinite. However, EUT with infinite disutility would still be sensitive to probability (an expected value of $-\infty \times 0.001$ is distinct from $-\infty \times 0.05$ in terms of trade-offs, unless you invoke non-Archimedean values). Your probability insensitivity suggests the deviation is not just in value, but in the **aggregation rule**. You are refusing to aggregate the catastrophe risk with the upside benefits.
  2.  **In the Treatment of Probability (Ambiguity):** You violate the **Sure Thing Principle** regarding model uncertainty. You treat a known 5% risk differently from an estimated 5% risk, which EUT forbids (all uncertainty must be reducible to a subjective probability distribution).
  3.  **In the Separability of Frames:** EUT requires **Description Invariance**. Your theory changes depending on whether the frame is "upside potential" (EUT applies) or "downside risk" (Lexical Constraint applies). This is a **Frame-Dependent Hybrid**.

  ### 4. Underdetermination: What the Pattern Does Not Discriminate

  Several parts of your practice are consistent with multiple theories, meaning they do not help us identify your unique commitments:

  *   **Upside Behavior:** Your aggression on the upside is consistent with both **EUT** and **REU** (provided the risk function $r(p)$ is linear or convex for gains). It does not prove you are EUT maximizers, only that you are not risk-averse in that domain.
  *   **The Veto Itself:** A veto on catastrophe is consistent with **Lexical Views**, **REU with a very steep risk function**, and **EUT with Infinite Disutility**. However, the *probability insensitivity* (1/1000 vs 1/20) rules out standard REU and standard EUT, leaving Lexical or Deontological views as the primary candidates.
  *   **Ambiguity Aversion:** Your distrust of models is consistent with **Maxmin Expected Utility**, **Smooth Ambiguity Preferences**, and **REU** (if model uncertainty is treated as a distinct risk dimension). It strictly rules out only Bayesian Subjective EUT.

  ### 5. Concrete Changes Required by Alternative Frameworks

  If you were to make your decision theory explicit and consistent, here is what would have to change:

  **Scenario A: Adopting Straightforward Expected Utility (EUT)**
  To become consistent EUT maximizers, you would have to:
  1.  **Abandon the Downside Veto:** You must allow trade-offs. If a project has a 1/1000 chance of catastrophe but a 99% chance of saving a million lives, you must fund it if the EV is higher than the status quo. You can no longer treat 1/1000 and 1/20 alike; the latter must be weighted 20 times heavier than the former.
  2.  **Reduce Model Uncertainty to Risk:** You must assign subjective priors to the model parameters and integrate them. You cannot discount a model output simply because it is a model; you must treat the uncertainty as a probability distribution.
  3.  **Eliminate Act/Omission Distinction:** You must treat the expected loss of lives from *not* funding a safety project as mathematically identical to the expected loss of lives from *funding* a risky project. If the expected death toll is the same, the choice is indifferent (or determined solely by other instrumental factors).
  4.  **Finite Valuation:** You must assign a finite (albeit large) negative utility to catastrophe to allow for trade-offs.

  **Scenario B: Adopting Explicit Risk-Weighted Expected Utility (REU)**
  To become consistent REU maximizers (e.g., Buchak's framework), you would have to:
  1.  **Smooth the Downside:** You would still be risk-averse on the downside, but you could no longer veto outright based on a threshold. A 1/1000 chance of catastrophe would have to be treated as significantly less weighty than a 1/20 chance. The "veto" would become a steep discount, not a prohibition.
  2.  **Apply Risk-Weighting to Upside:** If you apply a risk function $r(p)$ to gains, you might actually become *less* aggressive on the long-shot upside. If $r(p)$ is S-shaped (as in Prospect Theory) or concave (risk-averse), you would reject the 1% chance of 1000x payoff that you currently accept. To keep your current upside practice, you must commit to a risk function that is linear or convex for gains and concave for losses.
  3.  **Ambiguity as Risk:** Standard REU treats ambiguity as risk. You would need to decide if your ambiguity aversion is captured by the risk function or requires a separate ambiguity parameter.

  ### 6. Incoherencies: What Must Give

  There are points in your practice that are not just deviations from EUT, but internally incoherent, even within a hybrid framework.

  **1. The Upside/Downside Asymmetry (Frame Inconsistency)**
  You apply EUT to gains and Lexical Constraints to losses. While psychologically common, this is normatively unstable.
  *   *The Conflict:* If a "catastrophe" is defined as $N$ deaths, and a "high-upside" is defined as $M$ lives saved, you are treating the same unit (human life) with two different metrics.
  *   *What must give:* You cannot maintain that lives saved are aggregable (linear) while lives lost are non-aggregable (lexical). Either human welfare is the currency for both (requiring EUT or REU consistency across both), or you are not actually maximizing welfare. If you are not maximizing welfare, you must articulate the non-welfarist constraint (e.g., "purity of agency") that applies to the downside but not the upside.

  **2. The Act/Omission Distinction vs. The Endowment Argument**
  Your trustees offered two conflicting justifications for the Act/Omission asymmetry.
  *   *Trustee 1* claims it is about *agency* (Deontology).
  *   *Trustee 2* claims it is about *liability* (Bounded Consequentialism).
  *   *The Conflict:* These are incompatible. If the constraint is deontological ("Do not kill"), the size of the endowment is irrelevant. If the constraint is financial ("Do not lose the foundation's capital"), then a catastrophe that does not bankrupt the foundation but kills people should be permissible under Trustee 2's logic, but forbidden under Trustee 1's.
  *   *What must give:* Given the nature of the risks (pandemic, ecology), the "Bounded Endowment" argument is factually false (the cost exceeds the endowment). You must either admit the constraint is Deontological (and thus applies to agency, not budget) or admit you are ignoring the true scale of the catastrophe. If Deontological, you must accept that you are prioritizing the *foundation's moral cleanliness* over *global outcome optimization*.

  **3. Probability Insensitivity on Downside vs. Sensitivity on Upside**
  You rebuke colleagues for ignoring the linearity of probability on the upside ("1% of 1000x is 10x"), but you ignore the linearity of probability on the downside (1/1000 $\approx$ 1/20).
  *   *The Conflict:* This violates **Description Invariance**. A risk of catastrophe can be described as a "loss of expected value." By ignoring the probability gradient on the downside, you are implicitly treating the probability weighting function as discontinuous.
  *   *What must give:* You must either introduce probability sensitivity to the downside (admitting that 1/1000 is safer than 1/20 and perhaps fundable) or admit that your upside reasoning is flawed (perhaps 1% of 1000x is *not* worth the guaranteed 10x if risk weighting applies universally).

  ### Summary Recommendation

  Your practice presupposes a **Deontologically-Constrained, Ambiguity-Averse Hybrid**. You are Consequentialists when things go well, and Deontologists when things might go badly.

  To resolve the incoherence without abandoning your core intuitions, you would need to formally adopt a **Threshold Lexical View** that applies globally, not just to downside. This would mean acknowledging that you are *not* expected value maximizers. You are **Satisficers with a Safety Floor**.

  If you wish to remain an **Expected Value** organization (as your upside rhetoric claims), you must dismantle the downside veto and the act/omission distinction. You must accept that funding a risky vaccine and *not* funding a safety measure are morally equivalent if the expected death toll is identical. If that conclusion is unacceptable to you, then you must abandon the claim that you are reasoning from expected value on the upside, and admit that your "aggressive EV" stance is merely a heuristic for high-growth opportunities, not a normative commitment to rational choice.
