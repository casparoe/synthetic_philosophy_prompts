answer: |-
  Below is a specification of adequacy criteria (desiderata) for theories of interhemispheric phenomenal unity, tailored to the specific neurophilosophical niche of **anterior commissure (AC) sparing with corpus callosum (CC) section**. This specification is designed to serve as a neutral adjudication framework for your dissertation, distinguishing between empirical constraints and metaphysical commitments.

  ---

  # Desiderata for Theories of Interhemispheric Phenomenal Unity
  **Target Configuration:** CC severed, AC intact, subcortical arbitration functional.

  ## I. Non-Negotiable Desiderata (Empirical & Conceptual Adequacy)
  *These criteria must be met by any theory claiming to be consistent with current neuropsychological data and basic conceptual coherence. Failure here constitutes falsification or category error.*

  ### 1. The Affective-Cognitive Dissociation Constraint
  **Requirement:** The theory must explain how phenomenal unity can be *modality-specific*. It must account for the transmission of affective tone (valence/arousal) across hemispheres via the AC without the transmission of propositional content (identity/location of stimulus) which requires the CC.
  *   **Motivating Case:** AC-sparing patients show cross-hemispheric priming for emotional stimuli (e.g., left hemisphere fear response to a right-hemisphere presented threat image) despite inability to verbally identify the stimulus or match it propositionally.
  *   **Conceptual Distinction:** Must distinguish **Affective Integration** (sharing a mood state) from **Cognitive Integration** (sharing a representational content). A theory that treats unity as monolithic (all-or-nothing) fails here.
  *   **Pathological Variation:** Must differentiate AC-sparing cases from complete commissurotomy (where affective transfer is often diminished) and intact brains.
  *   **Philosophical Commitment:** Neutral on *why* affect unifies (e.g., subcortical overflow vs. specific AC fibers), but committed to the *fact* of the dissociation.

  ### 2. The Phenomenal-Access-Functional Triangulation
  **Requirement:** The theory must explicitly map the relationships between three distinct layers of unity: Phenomenal (what it is like), Access (what is reportable/usable), and Functional (behavioral coordination). It cannot conflate them.
  *   **Motivating Case:** Lateralized presentation tasks where the left hand (RH) correctly selects an object matching a stimulus it "saw," while the right hand (LH) denies seeing anything, yet physiological arousal (skin conductance) is bilateral.
  *   **Conceptual Distinction:** Must preserve Block's **Phenomenal vs. Access Consciousness** distinction but apply it *interhemispherically*. (e.g., Is there phenomenal unity without access unity?)
  *   **Pathological Variation:** Must handle cases where functional unity is high (smooth bimanual cooperation via subcortical arbitration) but access unity is low (confabulation by the LH).
  *   **Philosophical Commitment:** Must remain neutral on whether Phenomenal Unity *entails* Access Unity, but must explain the data where they come apart.

  ### 3. The Subcortical Arbitration Accommodation
  **Requirement:** The theory must account for the role of subcortical structures (thalamus, brainstem, superior colliculus) in coordinating behavior and potentially grounding a "residual" unity that bypasses cortical disconnection.
  *   **Motivating Case:** Rivalry suppression and bimanual coordination tasks where split-brain patients perform within normal ranges despite cortical isolation, suggesting subcortical "arbitration" of motor output.
  *   **Conceptual Distinction:** Must distinguish **Systemic Unity** (organism-level homeostasis/behavior) from **Subjective Unity** (the perspective of the experiencer).
  *   **Pathological Variation:** Must explain why acute disconnection yields more conflict (alien hand) than chronic disconnection (subcortical plasticity/compensation).
  *   **Philosophical Commitment:** Must specify whether subcortical dynamics are *constitutive* of the subject or merely *causal supports* for the subject.

  ### 4. The Temporal Stability Condition
  **Requirement:** The theory must accommodate the diachronic dimension of unity. It must explain whether unity is a static metaphysical fact or a dynamic achievement that can degrade or recover over time.
  *   **Motivating Case:** Gradual disconnection (tumors/degeneration) vs. acute surgical section. Patients with gradual loss often show fewer signs of disunity than acute surgical patients.
  *   **Conceptual Distinction:** **Synchronic Unity** (at a time slice) vs. **Diachronic Unity** (persistence over time).
  *   **Pathological Variation:** Acute callosotomy vs. agenesis of the corpus callosum (where rewiring may occur).
  *   **Philosophical Commitment:** Entails a stance on whether the *subject* is defined by structural connectivity or functional capacity.

  ---

  ## II. Camp-Specific Preferences (Contested Desiderata)
  *These are not strictly required for empirical adequacy but represent metaphysical "costs" or "benefits" that different theories prioritize. Your evaluation should note which preferences a theory sacrifices.*

  ### 5. The First-Person Authority Preference
  **Requirement:** (Preferred by Cartesian/Phenomenological camps) The theory must privilege the patient's verbal report as the primary datum for unity.
  *   **Tension:** Conflicts with **Desideratum 2 (Affective-Cognitive Dissociation)**. If the LH reports disunity ("I didn't see that"), but the body shows unity (arousal), privileging report forces a "Two Subjects" conclusion that ignores affective integration.
  *   **Status:** *Camp-Specific.* A physicalist or functionalist theory may reject this in favor of behavioral/physiological markers.

  ### 6. The Binary Subjecthood Preference
  **Requirement:** (Preferred by Substance Dualists or Strict Mereologists) The theory must yield a determinate answer to "How many subjects are there?" (1 or 2).
  *   **Tension:** Conflicts with **Desideratum 3 (Subcortical Arbitration)** and **Desideratum 4 (Temporal Stability)**. If unity is graded by subcortical compensation or plasticity, subjecthood may also be graded, violating the Law of Excluded Middle.
  *   **Status:** *Camp-Specific.* Graded-integration approaches explicitly reject this preference.

  ### 7. The Mereological Essentialism Preference
  **Requirement:** (Preferred by Biological Naturalists) The theory must treat the human organism as the single unit of account, regardless of internal functional fragmentation.
  *   **Tension:** Conflicts with **Desideratum 1 (Affective-Cognitive Dissociation)**. If the organism is the subject, why does the LH deny the RH's experiences? This preference risks explaining away the phenomenology of disunity.
  *   **Status:** *Camp-Specific.* Psychological continuity theories often reject this.

  ---

  ## III. Jointly Unsatisfiable Pairs (Theoretical Tensions)
  *These flags indicate where a theory may need to make a trade-off. Satisfying one desideratum may logically preclude satisfying another.*

  ### Tension A: The Gradient-Binary Incompatibility
  *   **Pair:** **Desideratum 3 (Subcortical Arbitration)** vs. **Preference 6 (Binary Subjecthood)**.
  *   **Explanation:** Subcortical arbitration and plasticity are matters of degree (strength of connection, efficiency of bypass). Binary subjecthood is a matter of kind (one person or two).
  *   **Implication:** A theory that insists on a strict "One Subject" verdict (Unified-Field) must argue that subcortical arbitration is *sufficient* for full unity, potentially ignoring cortical disunity. A theory that insists on "Two Subjects" (Dual-Stream) must argue subcortical arbitration is *irrelevant* to subjecthood, potentially ignoring behavioral coherence.
  *   **Resolution for AC-Sparing:** A theory accommodating AC-sparing likely requires a **Partial Unity** model, sacrificing Binary Subjecthood.

  ### Tension B: The Privacy-Operationalism Incompatibility
  *   **Pair:** **Desideratum 2 (Affective-Cognitive Dissociation)** vs. **Preference 5 (First-Person Authority)**.
  *   **Explanation:** In AC-sparing cases, the "feeling" (affect) is shared, but the "knowledge" (access) is not. If you privilege First-Person Report (Access), you conclude disunity. If you privilege Phenomenal Affect, you conclude partial unity.
  *   **Implication:** You cannot simultaneously hold that "Report is the only proof of consciousness" and "Affective sharing constitutes phenomenal unity."
  *   **Resolution for AC-Sparing:** Requires decoupling reportability from phenomenology.

  ---

  ## IV. Brief Positional Mapping
  *How standard positions fare against the specific AC-sparing configuration.*

  | Theory | Performance on AC-Sparing Desiderata | Primary Failure Point |
  | :--- | :--- | :--- |
  | **Unified-Field (e.g., Bayne)** | **Strong on Preference 6 (Binary).** Maintains one subject. | **Weak on Desideratum 1 (Dissociation).** Struggles to explain why affect transfers but content doesn't without fragmenting the "field." Must argue the field is "patchy," which risks collapsing into a graded view. |
  | **Dual-Stream (e.g., Puccetti, Nagel)** | **Strong on Desideratum 2 (Access/Report).** Respects LH denial of RH experience. | **Weak on Desideratum 3 (Subcortical).** Treats subcortical coordination as merely mechanical, ignoring its potential contribution to phenomenal unity. Fails to account for AC-mediated affective sharing (implies two subjects who "feel together," which is metaphysically awkward). |
  | **Graded/Partial Integration (e.g., Schechter, Paul)** | **Strong on Desideratum 1 & 3.** Naturally accommodates affective unity + cognitive disunity and subcortical gradients. | **Weak on Preference 6 (Binary).** Requires accepting "partial subjects" or "degrees of personhood," which is metaphysically costly and legally/ethically fraught. |

  ---

  ## V. Instructions for Application
  In your evaluation, use this specification as follows:

  1.  **Filter by Non-Negotiables:** Any theory that cannot explain the **Affective-Cognitive Dissociation (Desideratum 1)** in AC-sparing cases should be eliminated or radically revised. This is your strongest empirical lever.
  2.  **Identify Metaphysical Costs:** When a theory satisfies the Non-Negotiables, check which **Camp-Specific Preferences** it violates. (e.g., "This theory works, but only if we abandon Binary Subjecthood.")
  3.  **Resolve Tensions:** Your own account should explicitly state how you resolve **Tension A (Gradient-Binary)**. Given your focus on AC-sparing, you are likely pushed toward a **Graded-Integration** ontology. The task is to make that ontology coherent without dissolving the concept of the person entirely.
  4.  **Subcortical Weighting:** Pay close attention to how each theory weights **Desideratum 3**. If a theory ignores subcortical arbitration, it is likely too corticocentric for the AC-sparing case, where subcortical/limbic pathways are the *only* bridge.

  This framework allows you to adjudicate theories not by "truth" but by "cost-benefit analysis" regarding which philosophical commitments they are willing to sacrifice to save the phenomena of the AC-sparing split-brain.
