answer: |-
  The question of how to update our beliefs about the world given the fact of our own existence is one of the most contentious problems in modern philosophy and cosmology. We are tasked with choosing between three candidate rules for anthropic updating: the self-sampling rule, which ranks hypotheses by the prior probability times the fraction of observers sharing our evidence; the self-indication rule, which ranks by the prior times the absolute number of such observers; and the existence-only rule, which retains the prior provided at least one observer has the evidence. The central difficulty lies in how these rules handle the description of evidence, specifically the grain at which we specify who we are. The self-indication rule is particularly vulnerable here, as its characteristic bias toward hypotheses with more observers shifts dramatically depending on whether we describe our evidence coarsely as merely being an observer or finely as being a specific individual with a unique total evidence set. This grain-dependence is a decisive objection to the self-indication rule, rendering it incoherent as a fundamental principle of reasoning. Consequently, we ought to adopt the self-sampling rule, accepting its counterintuitive implications regarding the Doomsday Argument as a necessary cost of avoiding the far greater absurdity of the presumptuous philosopher, and maintaining that observers beyond our Hubble volume must count toward the total population despite their causal inaccessibility.

  The fatal flaw of the self-indication rule is that it makes the posterior probability of a physical theory contingent on an arbitrary choice of description rather than on the state of the world itself. Rational credence should not fluctuate based on whether an agent chooses to attend to their fingerprints or merely their existence, yet the self-indication rule dictates exactly this. If evidence is described coarsely, such that the proposition is simply that some observer exists, the rule favors theories with vast populations, leading to the presumptuous philosopher verdict where one can reject a well-motivated physical theory simply because it posits fewer observers. However, if evidence is described finely, such that it includes the agent's total unique identity, the number of observers sharing that evidence is one, and the self-indication bias vanishes entirely, collapsing into the existence-only rule. This instability reveals that the self-indication rule does not track a stable feature of reality but rather exploits a loophole in how indexical information is processed. It allows an agent to manufacture confirmation for a large-universe hypothesis merely by ignoring specific information about their own identity. Since there is no principled reason to discard total evidence in favor of a coarser description, and since the coarse description yields absurd cosmological conclusions while the fine description yields no anthropic update at all, the self-indication rule fails to provide a consistent guide for belief. It effectively admits that its own verdict is optional, dependent on how much the agent chooses to know about themselves, which is an untenable position for a rule of inference.

  In contrast, the self-sampling rule offers a stable framework because it normalizes the count of observers by the total population, thereby insulating the update from the arbitrary expansion or contraction of the reference class, provided the reference class is defined consistently. Under the self-sampling rule, if we use the coarse evidence that we are merely observers, the fraction of observers with that evidence is one in any world where observers exist, and the update vanishes. If we use the fine evidence that we are specific individuals, the fraction is one over the total number of observers, and the update penalizes large worlds. While this means the self-sampling rule also produces different rankings at different grains, the fine-grained application is the only one that respects the principle of total evidence. We do in fact possess specific indexical information, and to ignore it is to reason from a falsehood. Therefore, the self-sampling rule mandates that we treat ourselves as a random sample from the set of all observers, which necessarily introduces the penalty against observer-rich hypotheses found in the Doomsday Argument. This is not a bug but a feature of correctly accounting for the information that we are not just any observer, but this specific observer. The grain-dependence here is not an arbitrariness of the rule, but a reflection of the fact that different evidence statements entail different probabilities; the rule itself remains constant in its instruction to divide by the total number of observers.

  Critics often argue that the Doomsday Argument, which follows from the self-sampling rule, is as damaging to its credibility as the presumptuous philosopher verdict is to the self-indication rule, suggesting a symmetry of embarrassment that should lead to skepticism about both. This symmetry is illusory. The presumptuous philosopher verdict allows an agent to determine the size of the universe from an armchair, overriding empirical data about physical constants or cosmic expansion simply by counting souls. It claims knowledge of the external world that is causally disconnected from the evidence used to derive it. The Doomsday Argument, by contrast, does not predict an imminent catastrophe with certainty but rather shifts the probability distribution over the future duration of our species based on our birth rank. It is a probabilistic constraint, not a dogmatic prediction, and it remains consistent with all current empirical observations. The embarrassment of the Doomsday Argument is merely that it is counterintuitive, whereas the embarrassment of the self-indication rule is that it is epistemically arrogant, allowing prior beliefs about population sizes to trump physical evidence. It is far more rational to accept a probabilistic warning about our future longevity than to accept a method that allows us to conjure cosmological facts out of thin air. Thus, the two embarrassments do not cancel; the self-indication rule's error is fundamental, while the self-sampling rule's conclusion is merely unwelcome.

  A further objection concerns the status of observers who lie forever beyond our Hubble volume, causally disconnected from us and forever unobservable. One might argue that such observers should not count toward the total n(H) in the self-sampling rule, as they can never share our evidence or interact with us. However, excluding them would be an arbitrary restriction that smuggles in an assumption that the universe is small or that our causal patch is ontologically privileged. The self-sampling rule is a claim about ontology and our place within it, not merely about epistemic accessibility. If a hypothesis posits the existence of billions of observers in distant galaxies, they are part of the reference class of observers in that world, regardless of whether light from them can reach us. To exclude them from the count n(H) would be to define the reference class by our current technological or physical limitations, which vary over time and should not dictate the fundamental priors of cosmological theories. If we are random samples from the set of all observers, and the set includes those beyond the Hubble volume, then our credence in being in a universe with such observers must be penalized by their sheer number. Acknowledging this does not change the empirical fact that we cannot see them, but it correctly adjusts our prior probability for the hypothesis that they exist. To do otherwise would be to privilege the present causal horizon as a metaphysical boundary, which is unjustified.

  Therefore, the grain-dependence of the self-indication rule is a decisive refutation, as it demonstrates that the rule's verdicts are artifacts of descriptive choices rather than reflections of reality. The self-sampling rule, applied to our total specific evidence, avoids this arbitrariness by consistently treating us as a random sample from the total population of observers. While this commits us to the Doomsday Argument, this conclusion is a manageable probabilistic adjustment rather than the dogmatic absurdity of the presumptuous philosopher. Furthermore, the count of observers must include those beyond our Hubble volume to avoid begging the question against large-universe hypotheses. We must accept that our existence provides evidence about our typicality, and in a universe teeming with observers, we are less likely to be the specific individuals we are. This is a humbling but necessary correction to our cosmological reasoning, favoring a rule that respects the totality of evidence and the ontology of the world over one that allows the granularity of description to dictate the size of the cosmos.
