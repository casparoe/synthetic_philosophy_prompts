          *   Steps: Selection pool, term length, scope of authority, relationship to other bodies, unwilling selectees, specialized knowledge, accountability.
          *   Distinction: Core normative constraints (cannot fudge) vs. Open design options.
          *   Vulnerability Flagging: Where capture, drift, or oligarchization happens (plot hooks).
      *   **Application:** Run the procedure on two specific settings:
          *   (a) Small lunar colony (few thousand, sortition executive council).
          *   (b) Post-national city (millions, sortition chamber + elected technocratic body).
      *   **Output:** Identify overlooked design choices and unresolved tensions (features for a novelist).

  2.  **Deconstruct Sortition (The Core Normative Case):**
      *   What *is* sortition fundamentally? It's anti-factionalism, descriptive representation, equality of opportunity, and breaking the link between wealth/power and office.
      *   *Hard Constraints:* Randomness must be verifiable. Pool must be representative. Coercion must be managed (otherwise only the rich can serve). Power must be real (otherwise it's advisory theater).
      *   *Soft Options:* Term length, specific committee structures, tech level of selection, veto powers.

  3.  **Drafting the Design Procedure (The "Sortition Architecture Protocol"):**
      *   *Phase 1: Inputs.* Define the society.
      *   *Phase 2: The Pool.* Who is eligible? (Citizenship, age, exclusions). *Constraint:* Must be broadly representative.
      *   *Phase 3: The Selection.* How is random chosen? (Lottery tech). *Constraint:* Verifiable randomness.
      *   *Phase 4: Service.* Terms, pay, compulsion. *Constraint:* Must enable poor to serve.
      *   *Phase 5: Power.* What can they do? *Constraint:* Must have actual authority, not just advisory.
      *   *Phase 6: Expertise.* How to handle complex issues? *Option:* Staff, witnesses, training.
      *   *Phase 7: Accountability/Checks.* How to stop them going rogue? *Vulnerability:* Bureaucratic capture.
      *   *Phase 8: Vulnerability Scan.* Where does oligarchy creep back in?

  4.  **Developing the Vulnerability/Plot Flags:**
      *   Sortition kills *electoral* corruption but creates *bureaucratic* or *social* pressure points.
      *   Key risks: The "Staff" knowing more than the "Members," the wealthy buying exemptions from service, the public losing faith in "amateurs."

  5.  **Running Procedure on Setting (a): Lunar Colony:**
      *   *Specs:* ~5,000 people. High interdependence (life support). Executive Council.
      *   *Constraints:* Small population means everyone knows everyone (bias risk). High stakes (air/water) means incompetence is fatal.
      *   *Design Choices:* Short terms? Recall mechanisms? Mandatory technical training?
      *   *Overlooked:* The "Exemption" problem. If engineers *must* serve, who runs the reactors?
      *   *Tensions:* Survival vs. Democracy. Expertise vs. Randomness.

  6.  **Running Procedure on Setting (b): Post-National City:**
      *   *Specs:* ~5 Million. Sortition Chamber + Elected Technocrats.
      *   *Constraints:* Scale requires stratification (sortition by district?). Technocrats have agenda-setting power.
      *   *Design Choices:* Veto power vs. Initiation power.
      *   *Overlooked:* The "Agenda Control" trap. If technocrats write the bills, sortition just rubber-stamps.
      *   *Tensions:* Speed vs. Deliberation. Populist whim vs. Long-term planning.

  7.  **Refining the Output:**
      *   Tone: Professional, analytical, creative-friendly.
      *   Structure: Clear headings, bullet points for readability.
      *   Emphasis: Highlight the "Novelist Gold" (conflicts, tensions).

  8.  **Self-Correction/Review during drafting:**
