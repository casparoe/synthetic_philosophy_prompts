      *   *Check:* Are the examples distinct? *Yes, one is survivalist/small, one is complex/large.*
      *   *Refinement:* Make sure to emphasize that sortition *removes* elections, so the conflict isn't about campaigning, it's about influence, bureaucracy, and social pressure.

  9.  **Final Polish:** Ensure the language respects the user's intelligence (they are a novelist researching political theory). Use terms like "descriptive representation," "principal-agent problem," "agenda setting."

