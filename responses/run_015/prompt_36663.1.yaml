          *   *Analysis:* Maya shifts from strict LE to a hybrid (Sufficiency + LE). Dev attacks the metaphysics of free will/responsibility (the "expensive tastes" or "constitutive luck" problem).
          *   *Verdict:* Maya saves the theory from cruelty but changes the goalpost. Dev hits a deep philosophical nerve about determinism.

