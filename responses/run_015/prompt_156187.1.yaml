      *   **The Tolerance Principle of Care:** Map the steps.
          *   *Premise:* If Gregor is fed today, he is family. If he is fed today and slightly less cared for tomorrow, he is still family.
          *   *Application:* Grete's care degrades incrementally. The room gets messier. The food gets stale.
          *   *Philosophical Lens:* Supervaluationism fits here. There are many "admissible precisifications" of 'care.' On some, he's still a brother; on others, a pest. The family navigates this to avoid guilt.

      *   **The Apple Scene (The Puncture):**
          *   This is the counter-argument to gradualism. It's violent and specific.
          *   *Epistemicism:* This suggests there *was* a line, and the father crossed it violently. It shatters the illusion of vagueness. The apple lodges in the back—a physical marker of the boundary crossing.
