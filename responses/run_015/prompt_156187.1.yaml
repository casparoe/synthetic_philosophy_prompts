      *   **Ontological Vagueness:** The world itself is fuzzy. There is no fact of the matter about when Gregor stops being "son/brother."
      *   **Epistemicism:** There *is* a sharp line (a specific moment he ceased to be family), but we don't know where it is. The family might be using the fuzziness to mask the specific moment they chose to abandon him.
      *   **Supervaluationism:** Truth depends on "precisifications." There are many ways to draw the line; some are admissible, some aren't. "Gregor is family" is super-true if true on all admissible precisifications, super-false if false on all.
      *   **Tolerance Principle:** If $x$ is $F$, and $x$ is very similar to $y$, then $y$ is $F$.

  3.  **Analyze *The Metamorphosis* through these lenses:**
