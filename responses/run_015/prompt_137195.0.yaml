      *   *Refined Plan:* I will classify the "Speaker Knows + Fixed Window + Logical Surprise" combination as Incoherent. I will apply this to the Blackmailer (assuming strict logic). I will let the Headmistress pass *only if* "surprise" is psychological. I will let the Autonomous System pass (no last day). I will let the Ignorant Headmistress pass (breaks the loop).

  5.  **Refining the Distinctions (Correcting the Author):**
      *   *Author's Guess:* "Whether the speaker knows the date herself." -> **Correct.** This is the biggest lever.
      *   *Author's Guess:* "Fixed window." -> **Correct.** Needed for backward induction.
      *   *Author's Guess:* "Surprise = not deducible vs. not expected." -> **Correct.** This is the semantic escape hatch.
      *   *Author's Guess:* "Trust." -> **Correct.** Common knowledge is required.
