  2.  **Deconstruct the Paradox (Theoretical Background):**
      *   *The Core Paradox:* A teacher says there will be a test next week, and it will be a surprise. Logic suggests it can't be on Friday (because if it hasn't happened by Thursday night, you know it's Friday, so not a surprise). If not Friday, then not Thursday (because if it hasn't happened by Wednesday night, you know it's Thursday or Friday, but Friday is ruled out, so it must be Thursday, so not a surprise). By induction, no day works. Yet, in reality, a surprise test *can* happen.
      *   *Resolution Strategies:*
          *   Epistemic blind spots (knowledge vs. belief).
          *   Self-reference issues (the announcement invalidates itself).
          *   Probability/Uncertainty (surprise = low probability, not zero deducibility).
          *   Agent Knowledge (does the announcer know the date?).
      *   *Author's Guesses:*
          *   Fixed window? (Yes, matters).
          *   Surprise definition? (Yes, crucial).
          *   Guarantee vs. May? (Yes, affects logical necessity).
          *   Trust? (Yes, affects common knowledge).
          *   Speaker Knowledge? (Yes, crucial for the "backward induction" break).

