answer: |-
  Here is a breakdown of your roommate's summary, separated into what Kant would accept, what he would consider a loose approximation, and what he would explicitly reject. Following that, I will address your specific doubts and the "wrinkle" about the provisional league.

  ### What a Careful Kantian Would Accept (Accurate)

  **The Tripartite Structure**
  Kant would agree with the basic architecture. *Perpetual Peace* is indeed structured around three "Definitive Articles" that correspond to your roommate's three points: 1) The Civil Constitution (Republican), 2) The Law of Nations (Federation), and 3) Cosmopolitan Law (Hospitality). Getting the number and order right is a solid achievement.

  **The Pacifying Effect of Republicanism**
  Your roommate is correct that Kant argues republican states are less likely to go to war. The reasoning is also largely accurate: in a republic, the citizens must consent to war. Since they bear the costs (fighting, paying taxes, rebuilding), they will hesitate to embark on dangerous conflicts. In a non-republican state (a despotism), the ruler is not a fellow citizen and can treat war like a pleasure party, suffering no personal hardship while ordering others to die.

  **The Role of Trade**
  Kant does argue that the "spirit of commerce" is incompatible with war. He believes that as trade networks expand, states realize that peace is more profitable than conflict. This is part of his argument that "Nature" guarantees peace eventually, not through human morality alone, but through human self-interest.

  ### What a Careful Kantian Would Sigh At (Simplifications)

  **Republic vs. Democracy**
  Your roommate equates "republican constitution" with "modern liberal democracy." Kant would find this imprecise. For Kant, "democracy" (in the classical sense of rule by the multitude) is actually a form of despotism because it conflates the executive and legislative powers. If everyone decides the law and everyone enforces it, there is no check on power.
  Kant's "Republic" is defined specifically by the **separation of powers** (the executive is distinct from the legislature) and **representation**. A modern constitutional monarchy could fit Kant's definition of a republic better than a direct democracy. The core requirement is not just voting, but that the government operates through law and representation rather than personal whim.

  **The Mechanism of Inevitability**
  The claim that peace is "guaranteed" once institutions are set up is a simplification of Kant's teleology. Kant argues that Nature *mechanically* pushes us toward peace (through war exhaustion and trade), but he insists that establishing peace is ultimately a **moral duty**, not just a historical inevitability. We cannot simply wait for trade to stop war; we must rationally will the institutions into existence. The "guarantee" is a philosophical hope to keep us striving, not a scientific law that removes the need for human effort.

  ### What Kant Explicitly Denies (Wrong)

  **The Federation as a World Government**
  This is the most significant error. Kant explicitly argues **against** a world state or a global government with enforcement power. He calls this a "soulless despotism." He believes a global Leviathan would become tyrannical or ungovernable because laws lose their force over vast distances and diverse cultures.
  He proposes a **Federation of Free States** (*Foedus Pacificum*). This is a voluntary league, not a super-state. It has no coercive power to force states to join or to police them internally. It exists solely to end the state of war between members. It is more like a permanent peace treaty than a United Nations with sanctions or a military.

  **Cosmopolitan Right as Open Borders**
  Kant does not support a right to immigration or "open borders." His concept of "Universal Hospitality" is strictly a **right to visit**, not a right to settle.
  A foreigner has the right to present themselves to another society and attempt to interact without being treated with hostility. However, the host society has the right to refuse them entry or settlement, provided doing so doesn't cause their death (e.g., turning away a refugee at sea). Kant was writing in the age of colonialism, and he specifically wanted to condemn European powers claiming a "right" to land in foreign countries and conquer them. He limits the right to temporary interaction for the sake of potential trade or communication, not permanent residence or citizenship.

  ***

  ### Addressing Your Specific Doubts

  **1. Is the Federation a World Government/UN with Enforcement Power?**
  It is unfair to describe it as a world government. Kant rejects the idea of a global sovereign. Regarding the UN: The UN is a mix. The General Assembly resembles Kant's voluntary federation, but the Security Council's ability to authorize force and sanctions resembles the coercive power Kant denied the federation. Kant's federation relies on the honor and mutual self-interest of the members, not a global police force. If the federation had the power to coerce states militarily, Kant would argue it had morphed into the "world republic" he feared, which would threaten the freedom of individual states.

  **2. Is 'Open Borders' a Fair Gloss on Cosmopolitan Right?**
  No. "Open borders" implies a right to move and stay. Kant's "Universal Hospitality" is a right to *offer* commerce or communication. It creates a legal status where a stranger is not an enemy upon arrival. It prevents states from treating foreigners as pirates or conquerors by default. But it does not grant the stranger the right to become a permanent guest or citizen. That decision remains with the host state.

  **3. Does the Conclusion of Inevitability Follow?**
  It is an overstatement. While Kant says Nature *works toward* peace, he does not claim that setting up institutions makes peace automatic or irreversible. The institutions are the *goal* of moral reasoning. Trade makes war less likely, but human freedom means we can still choose irrational destruction. The "guarantee" is meant to prevent us from despairing, not to let us relax our moral vigilance.

  ***

  ### The Wrinkle: The Provisional League

  You asked: *Suppose the league isn't Kant's ideal voluntary federation but a provisional one that lets non-republican states join as long as they accept a no-first-strike rule and submit to economic sanctions rather than war. Would Kant count that as the real pacific federation, or just another treaty?*

  **Kant's Reasoning on This:**
  Kant would classify this as a **treaty of peace**, not the **pacific federation** required for perpetual peace.

  Here is the reasoning:
  1.  **Internal Causes of War:** For Kant, the root of war is often internal. A non-republican ruler can decide to go to war on a whim. A "no-first-strike" rule relies on the ruler's continued willingness to abide by it. Since the ruler is not accountable to citizens who bear the cost, that commitment is fragile.
  2.  **Perpetual vs. Temporary:** A treaty that ends a specific war (or set of wars) while leaving the *causes* of war intact is merely a truce. Kant argues that a true peace treaty must secretly reserve the matter for a future war to be invalid. If the internal constitution of the member states remains despotic, the causes of war remain.
  3.  **The Definitive Article:** The first Definitive Article requires the civil constitution of every state to be republican. This is a prerequisite for the Federation. You cannot build a house of perpetual peace on a foundation of despotism.
  4.  **Gradualism:** Kant does allow for the federation to start small and grow. He acknowledges we might not achieve the ideal immediately. However, a league that *institutionalizes* the membership of non-republics as a permanent feature violates the logic of the Definitive Articles. It treats the symptom (aggression) without curing the disease (despotism).

  **Verdict:**
  Kant would view this provisional league as a morally necessary *step* toward perpetual peace (a "preliminary article" in practice), but he would deny it is the *realization* of perpetual peace. It is a pragmatic truce among unequal partners, not the moral union of free states he envisions. As long as non-republican states are members, the federation remains in the "state of nature" regarding those members, because their internal structure allows for war to be declared without the consent of the governed. Therefore, it is just another treaty that ends one war, rather than the institution that ends the state of war itself.
