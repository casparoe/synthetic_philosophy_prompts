answer: |-
  **TO:** Pilot Grant Panel
  **FROM:** Panel Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: School-Based Reading Intervention Proposals

  **Bottom Line**
  I recommend we fund the **Medium** proposal (40 schools, three testing points, teacher surveys). We should notify the successful team within one week and offer the Light and Heavy teams feedback encouraging resubmission in the next cycle with adjusted scopes.

  **Rationale**
  Our deliberations produced a preference cycle: Medium > Light, Heavy > Medium, yet Light > Heavy. This intransitivity signals a valuation error, not a logical impossibility. In grantmaking, "better than" must ultimately be transitive; otherwise, we cannot allocate resources responsibly. The cycle emerged because we evaluated margins in isolation rather than cumulative impact.

  The comparison where our judgment likely slipped was **Heavy vs. Medium**. When viewed step-wise, the additional data waves and home visits in Heavy appeared to offer sufficient mechanistic insight to justify the added cost over Medium. However, the direct comparison of **Light vs. Heavy** acted as a corrective lens. It revealed that the cumulative burden of Heavy—specifically the privacy intrusion of monthly home visits and the high dropout risk—creates a qualitative threshold of risk that outweighs the scientific gain. If Light is preferable to Heavy due to burden and ethics, then Heavy cannot logically be the best option unless Medium is somehow worse than Light (which we agreed it is not).

  Therefore, the Medium design represents the efficient frontier. It secures the longitudinal data missing from Light without crossing the ethical and feasibility threshold inherent in Heavy's home visits. It corrects the over-valuation of the Heavy design's marginal gains.

  **The Strongest Objection**
  The most serious challenge to this recommendation is that it imposes false consistency on a genuine value conflict. If the preference cycle is real—if "better than" genuinely depends on which options are present—then selecting Medium is arbitrary. 

  Critics on the panel argue that by choosing Medium, we are not solving the problem but averaging it. We are admitting that Heavy offers superior science but refusing to pay its ethical price, while simultaneously admitting Light is ethically sound but scientifically weak. The objection holds that we are selecting the "least objectionable" option rather than the "best" one, effectively punishing the Heavy team for being ambitious and the Light team for being prudent. If the cycle reflects true incommensurability between scientific rigor and participant burden, then no ranking is correct. By forcing a ranking to break the cycle, we may be masking a deeper disagreement about whether privacy or power should trump the other, leaving half the panel feeling their ethical or scientific priorities were overridden by a procedural fix rather than engaged substantively.

  **Resolution**
  While this objection is philosophically sound, it is operationally paralyzing. We have funds for one study. To fund none is to waste the opportunity; to fund by lottery is to abdicate our evaluative responsibility. The Medium design is the only option that sustains scientific validity without violating the privacy thresholds the panel collectively identified when viewing the extremes. We must treat the Light > Heavy finding as the binding constraint: the home visits are too high a cost. Given that constraint, Medium is the rigorous choice.

  **Next Steps**
  1.  **Notification:** I will draft notification letters by next Tuesday.
  2.  **Feedback:** We will schedule a 30-minute debrief with the Heavy team to discuss how to retain mechanistic insights without home visits, and with the Light team on power analysis improvements.
  3.  **Vote:** Please confirm your agreement with this recommendation by email before Thursday's vote. If you intend to vote against, please reply with your alternative so we can discuss it live.

  Thank you for the rigorous debate. This cycle was difficult, but it clarified our boundaries regarding participant burden.
