answer: |-
  The short answer
  You are right that both rely on predictors, but wrong that they fail to discriminate between decision theories. Causal decision theory actually fails both cases, while functional decision theory passes both, but the structural reasons for failure differ in each. The mixture works, but only if you force students to evaluate policies from the start rather than actions after the reveal.

  Where I'm going wrong
  Your claim that these cases don't discriminate between theories is the main slip. Causal decision theory actually fails both of them, while functional decision theory passes both, but they fail for different structural reasons. In Newcomb, causal decision theory two-boxes because the money is already there; in Mugging, it refuses to pay because the coin flip is already done.

  Treating them as identical masks the specific logical lever each problem pulls. Your colleague's mention of branches was hinting at this: Counterfactual Mugging asks you to sacrifice in this branch to help a counterpart in another branch. XOR Blackmail asks you to sacrifice to change the logical probability of the state of the world in this branch. They are not just sign-flips; they test different aspects of how you handle logical dependence.

  The asymmetry that actually does the work
  In the Mugging, the benefit lives in a counterfactual world you know you aren't in. If you see the demand, you know the coin came up tails, so the ten thousand dollars is logically out of reach unless your decision procedure reaches across worlds. You are paying to make your counterpart rich, hoping that makes you the sort of person who exists in a winning universe.

  In the Blackmail, the benefit is about diagnosing the world you are actually in. The letter exists, and your payment determines whether that letter implies termites or no termites. You aren't helping a counterpart; you are using your action to logically rule out the bad state of affairs right here. One problem is about cross-world charity, the other is about self-locating logic.

  The 50/50 mixture and my bookkeeping worry
  Your intuition about adding ex-ante value to ex-post cost is sharp, but it points to the solution rather than a flaw. Causal decision theory evaluates the act after the coin lands or the letter arrives, which is why it sees the cost as real and the benefit as impossible. Functional decision theory evaluates the policy before the game starts, treating the coin and the letter as logical outputs of your choice.

  In your mixture, the Mugging half offers a huge upside that only exists if you commit before the coin flip. The Blackmail half offers a huge downside avoidance that only works if you commit before the letter is sent. If you let your students evaluate from the moment they hold the letter or see the demand, the mixture will feel broken because the timing of the leverage differs.

  To make the test work, you must force them to choose their strategy behind a veil of ignorance. From that starting line, the bookkeeping balances perfectly: the policy that pays in both scenarios wins big on the Mugging heads and avoids disaster on the Blackmail. The asymmetry you feel is the tension between acting locally versus winning globally, which is exactly the lesson you want them to learn.

  What I should tell the seminar
  Tell them these problems aren't mirror images, but they share a single lesson: rationality is about choosing a winning policy from the start, not optimizing a losing position after the fact.
