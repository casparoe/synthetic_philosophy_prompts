      *   *Claim 3 (TFT never first to defect/unexploitable):* "Nice" (never first to defect) is true. "Never exploited" is false/misleading. TFT can be exploited by strategies that defect occasionally or by noise (errors). It gets tied or loses slightly in specific matchups, but wins overall by score.
      *   *Claim 4 (Cooperation always rational regardless of discounting):* **False.** The Folk Theorem states cooperation is sustainable *if* the shadow of the future is long enough (discount factor is high). If players care little about the future, defection is the dominant strategy.
      *   *Claim 5 (No strategy can beat TFT):* **False.** In a direct head-to-head match, a strategy can beat TFT (e.g., defecting on the last round if known, or specific exploitative strategies). TFT wins tournaments by averaging high scores against many opponents, not by beating every opponent in every match.
      *   *Claim 6 (TFT is ESS):* **False/Complicated.** TFT is not strictly evolutionarily stable. "Always Defect" can invade a TFT population if errors occur, or neutral mutants can drift. GTFT (Generous TFT) or other strategies often perform better in evolutionary simulations with noise.
      *   *Claim 7 (Explains nature):* Oversimplification. Reciprocal altruism is a factor, but kin selection and other mechanisms matter. TFT specifically is fragile in noisy environments.
      *   *Claim 8 (One-shot PD cooperative):* **False.** In a finite one-shot PD, defection is the strict dominant strategy. Calling it a degenerate case where cooperation applies is fundamentally wrong.

