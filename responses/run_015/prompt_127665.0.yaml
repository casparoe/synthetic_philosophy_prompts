          5.  Advice for the Essay (How to write about this without overstating consensus).

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between Perfect and Imperfect duties clearly regarding Claim 7.
      *   *Correction:* On the Golden Rule, cite Groundwork 4:430 if possible (or just mention Kant explicitly rejects it).
      *   *Correction:* On the Group Project, ensure I explain *why* the "loophole" is generally rejected by Kantians (the "Exception for Oneself" argument).
      *   *Nuance:* Acknowledge that the "What if everyone did that?" heuristic *is* the standard intro explanation, even if philosophers nitpick it. Don't tell the user to revolt against the TA, but to nuance the essay.

  7.  **Final Review against constraints:**
      *   Separate settled from debated.
      *   Address the consequentialist worry.
      *   Address the group project case.
      *   Keep it useful for an essay.

  8.  (Final Polish): Ensure the distinction between "Contradiction in Conception" (CC) and "Contradiction in Will" (CW) is clear, as the handout muddles this. This is the key to the "four examples" claim being wrong.

  9.  *Wait, one more thing:* The user asked about the "group project" disagreement specifically. Is it settled? It's settled that free-riding is wrong, but *why* it fails the test is debated (CC or CW? Maxim formulation?). I need to make sure I don't say "Kant proves free-riding is wrong" without qualifying the maxim problem.

