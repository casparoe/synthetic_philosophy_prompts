      *   **Goal:** Identify which step in the steelman to reject, explain the cost of that rejection, and integrate the user's specific intuitions (calibration, monitoring vs. production, apprenticeship) into a coherent counter-argument.
      *   **Tone:** Intellectual, precise, journalistic, collaborative (thinking partner), respectful of the deadline.

  2.  **Deconstruct the Steelman Argument:**
      *   (1) Reliable source $\rightarrow$ Improved/Neutral epistemic position. (Plausible)
      *   (2) AI = Calculator/Colleague/Textbook (Acquiring beliefs from a source). (The weak link?)
      *   (3) Therefore, AI doesn't worsen epistemic position *in itself*.
      *   (4) Erosion of understanding = Worsening epistemic position. (Definitionally tricky)
      *   (5) Therefore, AI doesn't erode understanding.
      *   (6) Analogy to Print/GPS/etc. holds.
