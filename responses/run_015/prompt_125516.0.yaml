  In a recent seminar on revolutionary politics, a colleague waved away contingency-based explanations of the Terror by repeating the line that revolutions devour their own children, using it to suggest that the purge of revolutionary leaders was structurally inevitable once the Revolution began—not a result of Robespierre's particular decisions, the accidental collapse of the Girondins, or the contingent dynamics of 1793–94. I want to know what that line could actually be claiming, because at the moment it functions as a rhetorical stop rather than an argument I can assess.

  Please treat the slogan as a piece of language in need of disambiguation, not as a settled historical thesis with a canonical meaning. Lay out the distinct precise claims it could express—from tautological to determinist—and for each specify: the mechanism it relies on (institutional, ideological, psychological, or structural); whether it applies to all revolutions or only to the French case; whether its logical form is modal (inevitability in nearby worlds), explanatory (the best explanation invokes structural forces), normative (a warning about revolutionary politics), or merely metaphorical; and whether it is trivial, substantive and defensible, or false. Present these as a numbered menu rather than selecting one winner, and indicate which reading people are most likely invoking when they use the line to block contingency-based accounts.

  Then address the specific argumentative work my colleague was asking it to do: for each substantive (non-trivial) reading, say whether it genuinely rules out contingency explanations of the Terror, or whether it remains compatible with them—for example, with an account that emphasizes the contingent failure of factional compromise or the accidental escalation of the Committee of Public Safety.

  If my premise is confused—for instance, if the slogan is irreducibly metaphorical and cannot bear this kind of argumentative weight, or if I have mischaracterized the contingency debate about the Revolution—tell me plainly instead of constructing an elaborate menu that pretends the framing is sound.

  Keep the response self-contained and do not provide bibliographies, reading lists, or citations. Rely only on widely shared historical knowledge (e.g., the fall of the Girondins, the Thermidorian Reaction); do not invent specific dates or attributions, and do not quote from texts.

  Format your response in exactly these sections, in this order:
  1. 'The move it was asked to do' (about 100 words): restate the anti-contingency use precisely.
  2. 'The menu: eight readings' (about 700 words): each entry should be labeled, identify its mechanism, scope, logical form, and verdict (trivial / defensible / false), and note which version is probably meant in debate.
  3. 'Which ones actually block contingency' (about 200 words): match each substantive reading to whether it genuinely excludes contingency-based explanations.
  4. 'Pushback on the framing' (about 100 words): direct assessment of whether my setup is confused and whether the slogan can do the work I described.
