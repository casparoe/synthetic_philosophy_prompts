  Professor, you're conflating Excluded Middle with Bivalence, something you drilled into us during grad school, though I suppose I'm the only one willing to follow the thread to its end. I retain LEM—$A \lor \neg A$ holds universally—but I deny that it guarantees determinacy everywhere. You claim the principle becomes vacuous, but it was always a tautology; what you're actually mourning is the loss of the assumption that 'true' and 'false' are mutually exclusive. You're right that for the Liar, the disjunction no longer forces a choice, but that's because reality itself isn't choosing there; why should my logic pretend it does? For ordinary claims like 'it's raining,' the logic works exactly as you expect, because most sentences aren't self-referential paradoxes. You taught me that logic should model reality, not force reality into a Procrustean bed of consistency, so why balk now when the model fits the semantic facts better than your classical framework? I'd rather have a logic that admits a few true contradictions than one that requires me to deny the obvious truth of the Liar just to save a principle about exclusivity.
