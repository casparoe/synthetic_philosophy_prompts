  Here's a draft for the session. I tried to keep the tone conversational—like we're just digging around in the soil of the idea without getting too tangled in the jargon. I've marked the follow-ups clearly so you know when to pivot if she starts deflecting.

  1.  **The Churchland Distinction:** The classic eliminativist line from the Churchlands was that folk psychology is just a bad theory, like alchemy. But you're arguing something stronger: that predictive processing doesn't just prove folk psychology false, it removes the ontological space for it entirely. How is this distinction actually doing work? Is it just a stronger version of the same claim, or does the predictive processing framework change the grounds of the debate entirely?
      *   *Follow-up:* If she replies that asking for "beliefs" in a predictive brain is a **category mistake**, push back by asking: "But if the functional role of a 'prediction error' maps perfectly onto what we used to call a 'belief revision,' does the category mistake matter for how we live? Or are we just arguing over labels?"

  2.  **Generative Models vs. Beliefs:** In your view, the brain holds hierarchical models that predict sensory input. If I have a model that predicts "there is a cup on the table" and I reach for it, that looks an awful lot to me like having a belief that there's a cup. What exactly is missing from that prediction that prevents it from counting as a belief, even a reduced one?
      *   *Follow-up:* If she says you're **still thinking in folk-psychological terms**, ask: "Okay, let's strip the terms away. If the math describes a state that guides action and updates with evidence, why is it philosophically necessary to say that state *doesn't exist* rather than saying it *is* a belief?"

  3.  **Falsification:** I spent a lot of my career watching plants grow, and if my model of growth didn't match the data, I had to toss it. So, what kind of neurocience result would actually make you abandon the view? Is there any possible discovery about the brain that would force you to bring beliefs back into the ontology?
      *   *Follow-up:* If she claims such a result is **impossible under the Free Energy Principle**, press her on whether that makes the framework immune to evidence. "If nothing can falsify the claim that beliefs don't exist, are we doing philosophy or just asserting a worldview?"

  4.  **First-Person Authority:** When I introspect, I don't feel like I'm minimizing free energy. I feel like I'm holding beliefs. The access feels direct and convincing. If eliminativism is true, why is the illusion so perfect? Why did evolution give us such a vivid, persistent sense of having a mind full of propositions if there's nothing there but prediction errors?

  5.  **Scientific Reasoning:** This one keeps me up at night. If scientists don't have beliefs about hypotheses, how do we explain the persistence of theoretical commitments across experiments? When a researcher defends a theory against anomalies, aren't they acting exactly like someone holding a belief? If there are no beliefs, what is the scientist actually doing when they argue for their model?

  6.  **Desires and Action:** You've eliminated desires along with beliefs. But things clearly move toward goals—organisms seek food, safety, etc. If there's no desire state driving this, just precision-weighting, how do you account for the *direction* of action? Where does the "wanting" come from if it's just mechanics all the way down?

  7.  **Communication:** When we talk here tonight, it feels like I'm trying to plant a belief in your head and you're doing the same with me. If there are no beliefs to transfer, what is happening during communication? Are we just synchronizing our prediction models? If so, why does it feel like an exchange of meanings?

  8.  **Evolutionary Utility:** Folk psychology is universal across human cultures. From an ecological standpoint, traits that don't track reality usually get weeded out. If belief-talk is completely empty ontology, why did we evolve to be so good at it? Shouldn't a system that tracks prediction errors directly have outcompeted one bogged down in fictional propositional attitudes?

  9.  **Normativity:** Finally, how do you handle "oughts"? If I say you *should* believe the evidence, or *ought* to act ethically, what ground does that stand on? If there are no beliefs to be correct or incorrect, does normativity collapse into just describing what systems tend to do?
