answer: |-
  This is a sophisticated configuration of higher-order evidence (HOE) that sits at the intersection of formal epistemology, philosophy of science, and the literature on self-reference. You are correct that the standard labels ("self-undermining," "generality problem," "akrasia") are either too broad, apply to norms rather than evidence, or miss the asymmetric probabilistic structure you have identified.

  Here is an analysis of the phenomenon, its edges, and a proposal for how to categorize it.

  ### 1. Naming and Literature Location

  There is no single settled term for *evidence* that undermines its own source in the way you describe, though the components are well-discussed.
  *   **"Self-Undermining Evidence"** is used (e.g., by David Christensen), but often interchangeably with self-defeating norms.
  *   **"Reflexive Defeat"** is more precise for the structural relation but is often reserved for logical paradoxes.
  *   **"Bootstrapping"** (Vogel, Cohen) is the positive mirror image (using a source to confirm itself), which you correctly noted is the wrong direction.

  **Proposal:** I recommend coining or adopting the term **"Asymmetric Reflexive Defeat" (ARD)**.
  *   **Reflexive:** The evidence bears on the reliability of the process that produced it.
  *   **Defeat:** It functions as a defeater (undermining/rebutting).
  *   **Asymmetric:** The indictment is directional (e.g., "produces false positives"), creating a specific credence shift rather than mere suspension of judgment.

  **Where it fits:** This is a subset of **Higher-Order Evidence**, specifically the literature on **epistemic circularity** (Alston, Plantinga) but inverted. It is also adjacent to the **"Meta-Induction"** literature in philosophy of science (e.g., work by David Harker or the pessimistic meta-induction), though those usually apply historically rather than synchronically to a single study.

  ---

  ### 2. Addressing Your Specific Questions

  #### (a) Fixed Points and First-Order Credence
  Does this evidence only move meta-confidence, or can it shift first-order credence? **It shifts both, and there is a non-trivial fixed point.**

  If you treat this Bayesianly, you are looking for a stable equilibrium. Let $H$ be the first-order hypothesis (e.g., "Drug X works"). Let $E$ be the meta-analysis claiming "Studies of type $T$ have a 50% false positive rate." Let $R$ be the reliability of the meta-analysis itself.
  1.  If you trust $E$ fully ($R=1$), then $P(H|E)$ drops significantly (because $E$ says $H$ is likely a false positive).
  2.  But if $E$ is of type $T$, and $E$ says type $T$ is 50% unreliable, then $R$ cannot be 1. $R$ must be $\leq 0.5$.
  3.  If $R=0.5$, you discount $E$. If you discount $E$, the false-positive rate of $T$ is less certain, which raises $R$ slightly.

  **The Fixed Point:** You iterate this discounting until you reach a value where the credence you assign to the meta-analysis matches the reliability the meta-analysis attributes to its own class.
  *   **Result:** This *does* oblige a first-order credence shift. You end up with a lower credence in $H$ than you had before seeing $E$, but a higher credence in $H$ than you would have if $E$ were externally generated (Case 2).
  *   **Significance:** This shows that reflexive evidence is not "epistemically inert." It doesn't just paralyze you (akrasia); it forces a specific, discounted update. The "fixed point" is the only rational degree of belief that avoids probabilistic incoherence.

  #### (b) Diagonal, Near-Diagonal, and Off-Diagonal
  Are (1), (2), and (3) different in kind?
  *   **Case (2) is a different kind.** It is standard **Undermining Defeat**. The source of the HOE is independent of the source of the FOE. There is no feedback loop.
  *   **Cases (1) and (3) are the same kind, forming a continuum.** The distinction is merely the degree of **Reference Class Overlap**.
      *   In (1), Overlap = 100%.
      *   In (3), Overlap = High (e.g., 90%).
      *   The "grain sensitivity" in (3) is just the agent attempting to locate the boundary where Overlap drops below the threshold for reflexivity.
      *   **Why it matters:** In (1), the paradox is logical/structural. In (3), the paradox is soritical. But functionally, both require solving the fixed-point equation described in (a). Case (2) requires no such equation.

  #### (c) Grain Sensitivity and the Generality Problem
  Is the grain sensitivity in (3) just the Generality Problem? **No, self-application adds a normative layer.**

  *   **Standard Generality Problem:** A descriptive difficulty in reliabilism. "Which process type individuates this belief?" There is no fact of the matter, which threatens the theory.
  *   **Your Case (3):** The choice of grain determines *whether* the evidence applies to itself. This gives the agent a **pragmatic/epistemic reason to prefer a grain**.
      *   If I choose a coarse grain, the meta-analysis self-destructs (useless).
      *   If I choose a fine grain, the meta-analysis survives (useful).
      *   **The Addition:** Self-application turns a descriptive ambiguity into a **policy decision**. You are not just describing the process; you are deciding whether to allow the critique to survive. This is closer to the **"Pragmatic Encroachment"** on individuation than the traditional Generality Problem. You have a truth-conducive reason to individuate finely (to preserve the critique), provided that fine individuation is methodologically honest.

  #### (d) One-Directional vs. Symmetric Undermining
  Is the one-directional form distinct? **Yes, fundamentally.**

  *   **Symmetric Undermining:** "Method $M$ is unreliable." (Reliability = 0.5 random guessing).
      *   **Effect:** Drives credence in $H$ toward 0.5 (suspension).
      *   **Structure:** Pure Undermining Defeat (severs the link between $E$ and $H$).
  *   **Asymmetric (One-Directional) Undermining:** "Method $M$ produces False Positives."
      *   **Effect:** Drives credence in $H$ toward 0 (rebuttal).
      *   **Structure:** This is a **Hybrid Defeater**. It undermines the *support* $E$ gives to $H$, but because the error is biased, it simultaneously provides *negative support* for $H$.
      *   **Why it matters:** In your meta-analysis case, the study doesn't just say "Ignore me." It says "I am likely wrong in this specific direction." This allows the evidence to function as a **Rebutting Defeater** (arguing $\neg H$) disguised as an **Undermining Defeater** (attacking the method). This explains why the "symmetry of undermining defeat" feels missing: because it *is* missing. It acts like a negative observation.

  ---

  ### 3. Boundary Cases (Look-alikes that aren't)

  To sharpen the definition of **Asymmetric Reflexive Defeat**, distinguish it from these three:

  1.  **The Bootstrapping Case (Vogel/Cohen):**
      *   *Case:* I check my gas gauge, it says 'F'. I look in the tank, it is full. I conclude the gauge is reliable.
      *   *Distinction:* This is **Positive Reflexivity**. It attempts to *increase* confidence in the source. Your case is **Negative Reflexivity**. Bootstrapping is objectionable because it grants warrant too easily; your case is objectionable because it threatens to destroy warrant entirely.
  2.  **The Self-Defeating Norm (Conciliationism):**
      *   *Case:* "Upon discovering peer disagreement, split the difference." But what if peers disagree about *this* norm?
      *   *Distinction:* This targets an **Epistemic Principle**, not an **Evidence Source**. If the norm self-defeats, you abandon the norm. If the evidence self-undermines, you (as shown in (a)) calculate a fixed point; you don't necessarily discard the evidence, you discount it.
  3.  **The Liar Paradox:**
      *   *Case:* "This sentence is false."
      *   *Distinction:* This is **Binary/Logical**. It creates a contradiction (True iff False). Your case is **Probabilistic**. It creates a convergence problem (Credence $x$ implies reliability $y$, which implies credence $z$...). It is solvable via fixed points, whereas the Liar is often considered pathological.

  ---

  ### 4. Practical Implications (Meta-Science & Policy)

  This framework has direct bearing on how fields handle replication crises.

  1.  **Methodological Distancing:**
      *   If a field is in a crisis (Case 1), a meta-analysis using the *exact* same pipeline is rationally discounted to its fixed point (which may be very low).
      *   **Implication:** Meta-science *must* use methodologically distinct pipelines (Case 3 with fine grain) to avoid the fixed-point discount. Preregistration, different statistical frameworks (e.g., Bayesian vs. Frequentist), or data triangulation are not just "best practices"; they are **epistemic necessities** to escape Reflexive Defeat.
  2.  **Volunteered Unreliability:**
      *   If a source (e.g., a news outlet, a lab) publishes "We often make mistakes on topic X," how do we weigh that?
      *   **Implication:** If the claim "We make mistakes" is itself a claim about topic X, apply ARD. If they say "We make false positive errors," treat it as a hybrid defeater: lower your credence in their positive claims significantly, but do not treat the admission itself as fully reliable.
  3.  **The "Fixed Point" Policy:**
      *   During a replication crisis, we should not discard all past literature (credence = 0) nor ignore the meta-analysis (credence = 1). We should aim for the **equilibrium credence**.
      *   *Example:* If a meta-analysis says "50% of these studies are false," and it is one of *these studies*, we should not believe 50% are false. We should believe *less than* 50% are false (because the meta-analysis is partly false), but *more than* 0% (because it carries some signal). The exact number is the fixed point.

  ### 5. Summary Definition for Your Chapter

  If you wish to coin a term to anchor your chapter, I suggest:

  **Term:** **Reflexive Reliability Defeat (RRD)**
  **Definition:** A state of higher-order evidence $E$ wherein $E$ asserts a reliability constraint $C$ on a method $M$, and $E$ is itself generated by $M$ (or a method sufficiently similar that $C$ applies to $E$).
  **Conditions for Asymmetric RRD:**
  1.  **Reflexivity:** The source of $E$ falls within the reference class indicted by $E$.
  2.  **Directionality:** $C$ specifies a biased error rate (e.g., false positives) rather than random noise.
  3.  **Fixed-Point Requirement:** Rational response requires discounting $E$ until the assigned credence in $E$ is consistent with the reliability $E$ attributes to its own class.

  **What counts against this definition:**
  *   If the evidence is external (Case 2), it is standard Undermining Defeat, not RRD.
  *   If the evidence indicts a norm rather than a source, it is Self-Defeating Normativity.
  *   If the evidence attempts to *confirm* the source, it is Bootstrapping.

  This configuration allows you to move past the "generality problem" dismissal. The problem isn't just how to describe the method; it's that the description determines the *survival conditions* of the evidence itself. That is a distinct, normative epistemic problem.
