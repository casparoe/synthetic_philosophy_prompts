answer: |-
  This audit evaluates your six principles and five case verdicts for internal consistency and vulnerability to engineering-style critique. I have ordered the tensions by severity, starting with the most critical logical conflicts.

  ### 1. Apparent Tension That Dissolves: (1) vs (6)

  **The Tension:**
  Principle (1) states that mental facts are preserved if the "causal-functional organisation" is preserved, regardless of material. Principle (6) states that a system matching your input-output behaviour (like a lookup table) is *not* you. Engineers may argue that a sufficiently large lookup table *does* realize the same input-output function, so (6) contradicts (1).

  **Why It Dissolves:**
  This tension dissolves if you clarify your definition of "function" in (1). You are implicitly distinguishing between **behavioural equivalence** (matching inputs to outputs) and **computational isomorphism** (matching the internal state transitions that *produce* those outputs). A lookup table matches the former but not the latter; it has no internal causal dynamics, only memory retrieval.

  **What To Do:**
  You do not need to give anything up, but you must tighten the vocabulary in (1). Specify that "causal-functional organisation" refers to the **internal state-transition structure**, not merely the external input-output mapping.
  *   **Cost:** It makes "functional equivalence" harder to verify. You can no longer just test the black box; you must inspect the architecture.

  ### 2. Severity High: The Provenance Gap ((2) & (b) vs (3) & (c))

  **The Tension:**
  This is your most vulnerable point. In (2) and (b), you claim survival if the system is switched over in a single operation while "running." In (3) and (c), you claim death if the system is instantiated from a snapshot, even if the gap is a second.
  Engineers will attack the physical distinction here. If the "single operation" switchover in (b) takes any non-zero time, there is a moment where the old system is off and the new one is not yet fully driving. If you argue the time is zero, they will argue that is physically impossible. If you argue the *data* is the same, they will ask why data transferred via live signals (b) preserves identity, but data transferred via storage media (c) kills it.

  **The Conflict:**
  You are relying on a distinction between **Causal Process** (state $N$ is caused by the *activity* of state $N-1$) and **Causal Record** (state $N$ is caused by a *description* of state $N-1$). Your current wording ("running," "snapshot") describes the *method*, not the *metaphysical difference*.

  **What Would Have To Be Given Up:**
  To resolve this, you must give up the idea that "rate does not matter" in (2) without qualification. A rate of "instantaneous" is not a rate; it is a discontinuity.
  *   **Cost:** You lose the elegance of "speed is irrelevant." You must admit that there is a hard constraint: **signal propagation must be continuous.** If the causal chain is broken even for a nanosecond, your own logic suggests death. This makes (b) physically riskier than you might want to admit.

  **Recommendation:**
  Reframe the distinction not as "running vs. stopped" but as **"Endogenous State Transition" vs. "Exogenous State Instantiation."** In (b), the new substrate's state is caused by the old substrate's signals. In (c), the new substrate's state is caused by a static file.

  ### 3. Severity Medium: The Logic of Identity ((4) vs (d))

  **The Tension:**
  Principle (4) states survival is all-or-nothing. Case (d) describes a branch-and-merge scenario (two copies diverge, then merge).
  If identity is all-or-nothing, branching creates a logical impossibility. If the original splits into Copy A and Copy B, and both are causally continuous (by your (2) standards), you cannot be identical to *both* (since A $\neq$ B). If you are identical to neither, you died at the split.
  If you died at the split, the merged system in (d) is a new entity constructed from two dead predecessors. If you survived as both, you violate the transitivity of identity (A = You, B = You, therefore A = B, which is false).

  **What Would Have To Be Given Up:**
  You must give up either (4) or the intuition that branching preserves identity.
  *   **Option A (Keep 4):** You must accept that branching is death. The merge is a new person.
  *   **Option B (Drop 4):** You accept the Parfitian view you rejected: survival comes in degrees. You survive as A and B to degree 0.5, and the merge restores you to degree 1.0.
  *   **Cost:** Option A is logically consistent but emotionally harsh (branching kills). Option B resolves the merge but forces you to abandon your core commitment to "all-or-nothing" survival.

  ### 4. Severity Low: Ontology vs. Obligation ((3) vs (e))

  **The Tension:**
  In (3) you assert the replica is *not* you and your survival has ended. In (e) you want the replica to inherit your obligations and assets.
  Legally and socially, obligations usually attach to the *person*. If the person is dead (per (3)), obligations typically dissolve (except via estates). If you insist the obligations transfer, you are treating the replica *as if* it were you for practical purposes, while denying it *is* you for metaphysical purposes.

  **What Would Have To Be Given Up:**
  You do not need to give up a logical commitment, but you must acknowledge a **category error**. You are mixing **Ontological Identity** (am I the same being?) with **Narrative Continuity** (who should finish my story?).
  *   **Cost:** You must admit that (e) is a moral/social preference, not a consequence of (1)-(5). It is a "policy" decision, not a "physics" decision.

  ---

  ### Verdict on Case (d): The Merge

  **Does your package deliver a verdict?**
  Yes, but it is likely not the one you intuitively want.
  Given (4) "Survival is all-or-nothing" and (5) "No Residue" (identity is settled by physical facts):
  1.  At the moment of branching, physical facts dictate two distinct systems exist.
  2.  Because identity is unique (all-or-nothing), the original cannot be identical to two distinct future systems.
  3.  Therefore, the original ceases to exist at the branch.
  4.  The subsequent merge combines two distinct entities into a third.

  **Verdict:** **Death.** The merged system is a new person with memories of two predecessors, neither of whom survived the split.

  ---

  ### Single Revision Recommendation

  **The Revision:**
  Modify **Principle (2)** to explicitly define the survival condition as **"Unbroken Causal Provenance of State Transitions."**

  **Current Wording:** "...provided each replacement is switched in while the system is running..."
  **Revised Wording:** "...provided the state of each new unit is caused directly by the active signals of the preceding system state, without intermediate storage or reconstruction from a static description."

  **Why This Cleans Up The Most:**
  1.  **Resolves (b) vs (c):** It clarifies why the "hot-swap" (b) works (signals flow directly) and the "snapshot" (c) fails (state is reconstructed from a record). It removes the ambiguity about "running" vs "stopped."
  2.  **Resolves (d):** It dictates that branching breaks the *unique* causal chain. Two chains exist; therefore, the unique identity is lost. This forces the "Death" verdict logically, aligning with (4).
  3.  **Fortifies (1) vs (6):** It emphasizes the *process* of causation, supporting your rejection of lookup tables (which retrieve rather than process).

  **What You Lose:**
  You lose the claim that "rate does not matter" in the absolute sense. Under this revision, if the "direct causal signal" is interrupted for *any* duration (even a clock cycle where data sits in a buffer rather than propagating), you risk crossing into "reconstruction from description." You trade the simplicity of "keep it running" for the precision of "maintain the signal path." This makes the engineering specification harder, but the philosophical position much harder to attack.
