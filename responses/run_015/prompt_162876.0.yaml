answer: |-
  The full list is not jointly satisfiable; you must sacrifice carving-invariance (accepting individuation is metaphysically primitive) or abandon no armchair cosmology (accepting existence evidence favors larger worlds), as infinite world measures break standard counting regardless of sampling rule.

  ### Desiderata for Self-Locating Credence

  1.  **Carving-Invariance**
      *   **Case:** Counting time-slices vs. whole lives vs. cerebral hemispheres as "observers."
      *   **Requirement:** Credence in world hypotheses must not shift based on arbitrary decisions about how to individuate observers within those worlds.
      *   **Status:** Non-negotiable.
      *   **What Breaks:** If dropped, agents can manipulate their credences about physical reality merely by changing their definition of "self," enabling epistemic gerrymandering.

  2.  **No Armchair Cosmology**
      *   **Case:** The Presumptuous Philosopher (coin flip between 1 vs. 1 trillion observers).
      *   **Requirement:** The bare fact of your existence should not update speculative cosmological priors (e.g., universe size) from negligible to near-certain without empirical data.
      *   **Status:** Preference-of-one-camp (SSA adherents).
      *   **What Breaks:** If dropped, agents become "presumptuous," betting heavily on vast universe hypotheses solely because they exist, disconnecting credence from empirical evidence.

  3.  **Temporal Neutrality**
      *   **Case:** Staggered Arrival (one observer now vs. 1,000 observers non-overlapping in the future).
      *   **Requirement:** Temporal coexistence must not matter; credence should depend on the total set of observers in the world, not those existing "now."
      *   **Status:** Non-negotiable.
      *   **What Breaks:** If dropped, agents suffer temporal bias, incorrectly inferring world size based on whether other observers happen to overlap their own timeline.

  4.  **Decision-Theoretic Alignment**
      *   **Case:** The Duplication Lottery (bet paying out to each continuation after fission).
      *   **Requirement:** Credence assigned to being a specific continuation must match the betting odds required to avoid Dutch books when payouts scale with continuations.
      *   **Status:** Non-negotiable.
      *   **What Breaks:** If dropped, agents are money-pumped; their credences do not guide rational action in branching scenarios.

  5.  **Infinite Robustness**
      *   **Case:** Big and Messy Worlds (infinite observers or undefined totals).
      *   **Requirement:** The rule must return a defined probability or explicitly declare the question ill-posed, rather than returning 1, 0, or NaN.
      *   **Status:** Non-negotiable.
      *   **What Breaks:** If dropped, the rule is useless for modern cosmology where infinite spacetimes are live hypotheses; probability theory collapses.

  6.  **Indexical Coherence**
      *   **Case:** Sleeping Beauty (memory wipe vs. standard awakening).
      *   **Requirement:** The rule must distinguish between learning new factual information vs. merely gaining a new self-locating indexical perspective.
      *   **Status:** Non-negotiable.
      *   **What Breaks:** If dropped, agents update on "I am here now" as if it were new factual evidence about the world, violating conditionalization.

  7.  **Reference Class Stability**
      *   **Case:** Doomsday Argument (birth rank) and Adam & Eve (first observers).
      *   **Requirement:** The rule must specify how to handle cases where you are necessarily early in the sequence or where the class is tiny without forcing absurd conclusions (e.g., psychic powers).
      *   **Status:** Preference-of-one-camp (depends on SSA vs. SIA weighting).
      *   **What Breaks:** If dropped, agents either conclude the world must end soon (Doomsday) or that they can influence reality via intention (Adam & Eve).

  8.  **Identity Continuity**
      *   **Case:** Fission/Teleportation (two continuations, neither "real").
      *   **Requirement:** The rule must handle cases where personal identity splits without requiring a fact of the matter about which continuation is "you."
      *   **Status:** Non-negotiable.
      *   **What Breaks:** If dropped, agents cannot plan for survival or care about future branches, paralyzing decision-making in transhuman scenarios.

  ### Unsatisfiable Subsets & Constraints

  **The Impossible Triangle:** You cannot jointly satisfy **Carving-Invariance**, **Infinite Robustness**, and **Standard Probability Normalization**.
  *   **Why:** In infinite worlds, the ratio of observers depends entirely on how you slice them (carving). To normalize probabilities to 1, you must impose a measure. That measure inevitably privileges one carving over another. If you refuse to privilege a carving (Carving-Invariance), you cannot normalize (Infinite Robustness fails). If you normalize, you violate Invariance.

  **The Empirical Conflict:** You cannot jointly satisfy **No Armchair Cosmology** and **Self-Indication (SIA)**.
  *   **Why:** SIA dictates that you are more likely to exist in worlds with more observers. This automatically boosts credence in larger worlds purely based on existence, violating the ban on armchair cosmology.

  **Most Constraining Desideratum:** **Carving-Invariance**.
  *   **Reason:** It is the only desideratum that demands a metaphysical solution to a metaphysical problem. All other constraints can be managed by adjusting priors or decision rules, but Carving-Invariance requires a rule that works regardless of ontology. Since no ontology-independent counting method exists, this constraint forces every candidate rule to fail or to secretly smuggle in a primitive definition of "observer."

  ### Scorecard

  | Rule | Carving-Invariance | No Armchair Cosmology | Infinite Robustness | Decision Alignment |
  | :--- | :--- | :--- | :--- | :--- |
  | **SSA** (Self-Sampling) | **Fail** (Requires fixed reference class) | **Pass** (Rejects size bias) | **Fail** (Measure zero issues) | **Pass** (Standard EDT) |
  | **SIA** (Self-Indication) | **Fail** (Counts all possible observers) | **Fail** (Presumptuous Philosopher) | **Fail** (Divergent sums) | **Pass** (Standard EDT) |
  | **Halfer/BDT** (Centered Worlds) | **Pass** (Treats centers as primitive) | **Pass** (No update on existence) | **Mixed** (Depends on measure) | **Pass** (Optimized for bets) |

  **Verdict:** For an agent making decisions inside the world, **Halfer/BDT** (Branching Decision Theory) is the most robust, as it sacrifices the idea that existence provides evidence about world size (No Armchair Cosmology) to preserve decision-theoretic coherence and avoid the counting problems of SSA/SIA.
