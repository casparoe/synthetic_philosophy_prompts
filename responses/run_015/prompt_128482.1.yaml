          *   Version 2: Symmetry assumption failure (everyone thinks they are unique/special or miscounts N).
          *   Version 3: Mixed strategies/Probability matching (everyone randomizes, but variance causes crashes).
          *   Version 4: Population estimation errors (dependency on how many superrationalists are out there).
          *   Version 5: The Shared Randomiser (outsourcing agency to solve the coordination problem).

