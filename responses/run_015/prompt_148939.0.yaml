answer: |-
  Look around the room. In some respect, we are all here. In a different respect, none of us are really "here" in the way we usually mean.

  For half of you, *syat*—"perhaps," or "in some respect"—is a strict logical operator. For the other half, it looks like a dropout layer preventing overfitting on a single truth. From one angle, we are incompatible. From another angle, we are running ensemble methods on reality. From a third angle, we are both incompatible and running ensembles simultaneously.

  If I claim this retreat will resolve our disagreements, I am speaking from a specific perspective. If I claim it will resolve nothing, I am also speaking from a specific perspective. If I claim it will both resolve and not resolve things, that holds up in yet another respect. We have to be careful not to collapse the wavefunction too early.

  Some of what we are chasing is expressible in code. Some is expressible in scripture. Some of it, from a certain standpoint, is just inexpressible. Maybe the truth is expressible and inexpressible. Maybe it is not expressible and still inexpressible. Maybe it is all three at once: sayable, unsayable, and both.

  So I can't stand here and tell you pluralism is good. I can't tell you it's bad. I can't even tell you it's both without qualifying that claim. In some respect, we start work. In some respect, we stop. In some respect, we do both while knowing the output is undefined.

  The loss landscape here is non-convex. There isn't one global minimum we are all descending toward. In some sense, your gradient is valid. In another sense, mine is valid. In a third sense, neither of us is moving.

  So, perhaps we begin. Or perhaps we don't. Or perhaps we begin by not beginning. Let's get into it, conditionally.
