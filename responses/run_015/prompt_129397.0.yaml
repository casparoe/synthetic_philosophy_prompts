  At a tense town hall meeting, a Deweyan philosopher stands up to halt a vote on the local noise ordinance.

  "Friends," he declares, "we cannot treat this ballot as a resolved situation. Democracy is associated living, not just counting hands. This vote is supposed to be cooperative inquiry, but look at the conditions! We have no control group. We can't reset the town to 5 PM and run the meeting again to see if Mrs. Gable still votes 'yes' when the radiator isn't clanking."

  The town moderator rubs his temples. "So what do you propose?"

  "We must treat the ordinance as a working hypothesis," the philosopher says. "But since human experience is irreversible, we can never reproduce these social conditions to verify the result. If we pass this law, we're claiming a unified situation based on non-reproducible data. We're dogmatizing a trial!"

  The moderator picks up the gavel. "All in favor of dogmatizing the trial?"

  "No! You're freezing the flux of experience!"

  "Motion carried. Meeting adjourned."

  As the crowd files out, the philosopher grabs his neighbor, visibly distressed. "Do you see? They've turned a method into a decree. The inquiry is closed prematurely. The situation remains indeterminate!"

  His neighbor hands him a cold beer from a cooler. "Look, the only thing determinate right now is that I'm thirsty. Let's go test this hypothesis at the bar."

  The philosopher takes the beer, hesitates, then asks, "But if I drink this, how do I distinguish between individual consumption and socially shared experience? How do we measure the satisfaction variable without contaminating the sample?"

  His neighbor clinks bottles with him. "Drink the beer, John. And try not to falsify the hangover."
