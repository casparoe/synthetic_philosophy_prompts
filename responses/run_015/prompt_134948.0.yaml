      *   *Level 2 (Measurement):* How do we measure that currency? (Brain size? Neuron count? Behavior?)
      *   *Level 3 (Application):* How do we apply this to specific cases? (Law, Animal Rights, AI).

      *Decision:* The user asks for a prioritized list of *lines of work/questions*. The most upstream question isn't "is brain size X good?" it's "what property is brain size supposed to track?"

  4.  **Drafting the Priority Order (The "Defended Ordering"):**

