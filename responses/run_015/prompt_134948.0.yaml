      *   *Priority 2: The "Margin of Humanity" Problem (Disability/Injury).* This is the hardest ethical bullet to bite. If we tie morality to capacity, we endanger vulnerable humans. If we don't, we might be speciesist. This needs resolution before we can trust *any* capacity metric for animals or AI.
