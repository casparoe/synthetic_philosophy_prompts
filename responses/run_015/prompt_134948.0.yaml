      *   Brain size is a proxy for cognitive capacity, but a noisy one.
      *   The "Microcephaly Counterexample" is strong: If moral status = brain size/function, humans with reduced capacity might lose status. Most people reject this.
      *   The "Whale Counterexample" is strong: If moral status = brain size, whales might outrank humans. Most people reject this.
      *   The "Domestication Counterexample" is strong: We bred animals to have smaller brains (sometimes) but treat them as property, while wild animals with bigger brains are protected (sometimes).

