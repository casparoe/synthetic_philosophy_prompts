answer: |-
  ### Handout: The Uncertain Evidence Decision Tree

  **Root Scenario:** On Monday your credence that the specimen belongs to species A is 0.3; by Tuesday it is 0.7; nothing you have become certain of explains the change; and you still have to say what your credence in some further hypothesis H now is.

  **Instructions:** Follow the questions below. Answer based on your situation, not on which theory you prefer. At each leaf, you will find the updating rule that matches your answers, along with the case it handles worst.

  ---

  **Node 1:** Did this change happen because something happened *to* you (a sight, a sound, a message), or only because you thought again about what you already knew?
  *   **Thought only:** Go to Leaf 1.
  *   **Something happened:** Go to Node 2.

  **Node 2:** Is there some description of what happened (e.g., "I saw a flash," "The meter read 5") that you are now completely certain is true?
  *   **Yes:** Go to Leaf 2.
  *   **No:** Go to Node 3.

  **Node 3:** Do you still want to represent your beliefs as single precise numbers (e.g., exactly 0.7), or are you willing to use sets of numbers or rankings?
  *   **Sets/Rankings:** Go to Leaf 3.
  *   **Single Numbers:** Go to Node 4.

  **Node 4:** Did the experience fix the new probability of A exactly (it is now 0.7), or did it only place a constraint on it (e.g., "P(A) is now at least 0.5")?
  *   **Constraint:** Go to Leaf 4.
  *   **Exact Value:** Go to Node 5.

  **Node 5:** Do your beliefs about *other* things, *assuming A is true*, stay exactly the same as they were on Monday?
  *   **No:** Go to Leaf 5.
  *   **Yes:** Go to Node 6.

  **Node 6:** Does what you learned affect *only* A, or does it also change how you weigh background factors (like lighting or time of day) that are correlated with A?
  *   **Changes background factors:** Go to Leaf 6.
  *   **Only A:** Go to Node 7.

  **Node 7:** Could you have written down a rule for this specific change last week, before it happened?
  *   **No:** Go to Leaf 7.
  *   **Yes:** Go to Node 8.

  **Node 8:** If two such shifts happen in a row, does the order in which they arrive change the final result?
  *   **Yes:** Go to Leaf 8.
  *   **No:** Go to Leaf 9.

  ---

  ### The Leaves

  **Leaf 1: Rational Re-evaluation**
  *   **Case:** You found an error in your old arithmetic or saw a logical connection you missed.
  *   **Worst Case:** Fails when new sensory data arrives that contradicts your old logic.

  **Leaf 2: Standard Conditionalization**
  *   **Case:** You became certain of a proposition in a larger algebra (e.g., "It looked like A").
  *   **Worst Case:** Cannot handle cases where you refuse to be certain of any description of your experience.
  *   *(Note: Indistinguishable from Leaf 6 in practice; Leaf 6 just insists on expanding the algebra first.)*

  **Leaf 3: Imprecise Probabilities / Ranking Theory**
  *   **Case:** The evidence is too vague for a single number; you update a set of distributions or ranks.
  *   **Worst Case:** Loses the ability to calculate precise betting ratios for decision-making.

  **Leaf 4: Minimum Distance (INFOMIN)**
  *   **Case:** You have a constraint (like a weighted average) rather than a fixed value.
  *   **Worst Case:** Results depend arbitrarily on which "distance" metric you choose to minimize.

  **Leaf 5: Holistic Re-evaluation**
  *   **Case:** You change your mind about A and also about what A implies for H.
  *   **Worst Case:** No local rule exists; you must re-evaluate the entire web of belief from scratch.

  **Leaf 6: Algebra Expansion (The "Escape Hatch")**
  *   **Case:** You model the experience itself as a proposition to restore certainty.
  *   **Worst Case:** Makes the algebra unmanageably large and complex very quickly.
  *   *(Note: Indistinguishable from Leaf 2 in output; distinguished here by the requirement to expand the algebra.)*

  **Leaf 7: Unplanned Shift (Vulnerable)**
  *   **Case:** You shift without a prior rule; the change is brute.
  *   **Worst Case:** You are vulnerable to a diachronic Dutch Book (sure loss) from a bookie who knows your tendencies.

  **Leaf 8: Unnamed (Sequential Update)**
  *   **Case:** You have a plan, but the order of evidence matters.
  *   **Status:** **Unexplored/Unattractive.** Most theories demand order-independence; a planned rule that depends on order is rarely formalized because it complicates long-term planning.
  *   **Worst Case:** Requires complex bookkeeping of the history of updates, not just the current state.

  **Leaf 9: Jeffrey Conditionalization (Probability Kinematics)**
  *   **Case:** You fix the new probability of A, keep conditionals fixed, and ignore order.
  *   **Worst Case:** Fails if the experience provides side-information (like fog density) that correlates with H independently of A.

  ---

  ### Structural Commentary & Justification

  **Node Ordering Logic**
  The tree flows from the *nature of the input* to the *structure of the output*, and finally to *diachronic coherence*.
  1.  **Node 1 (Input vs. Thought):** This must be first. If the change is internal reflection, no evidence-update rule applies; it is error correction or logical deduction.
  2.  **Node 2 (Certainty):** This is the "Van Fraassen/Field" escape. If the agent can find certainty *anywhere*, standard Bayes applies. This must precede uncertain evidence rules.
  3.  **Node 3 (Precision):** This splits probabilistic from non-probabilistic approaches (Distinction 5). It comes early because it determines the mathematical framework (numbers vs. sets).
  4.  **Node 4 (Exact vs. Constraint):** This distinguishes Jeffrey-style updates (fixed values) from INFOMIN (constraints). It must precede Rigidity because Rigidity is only well-defined if values are fixed.
  5.  **Node 5 (Rigidity):** This is the core of Jeffrey Conditionalization (Distinction 3). It asks if the partition screens off the rest of the belief state.
  6.  **Node 6 (Screening/Entanglement):** This refines Rigidity (Distinction 8). Even if conditionals are fixed, if the *experience* correlates with H outside of A, the update fails.
  7.  **Node 7 (Planning):** This addresses Diachronic Coherence (Distinction 7). It comes late because one can technically apply a rule without planning it, but it is irrational to do so.
  8.  **Node 8 (Commutativity):** This is the final filter (Distinction 6). It distinguishes the standard Jeffrey rule from more complex sequential rules.

  **Substitution of Distinction 5**
  I replaced Distinction 5 ("Whether the new state is to be picked by minimising some distance... or by giving up single numbers") with **Node 3 (Precision)**.
  *   *Justification:* Distinction 5 conflates the *representation* (numbers vs. rankings) with the *selection method* (minimizing distance). "Giving up single numbers" is a fundamental ontological choice that dictates the entire formalism, whereas "minimizing distance" is a justification for a specific move within a formalism. Placing "Precision" as Node 3 cleanly separates Improbabilism from Probabilism before asking about constraints or distances.

  **Uncertain Node Placement**
  I am genuinely unsure about the placement of **Node 7 (Planning/Endorsement)**.
  *   *Reason:* It is unclear whether "ability to endorse in advance" is a *precondition* for using a rule (e.g., Jeffrey Conditionalization is invalid if unplanned) or merely a *test* of its rationality (e.g., you can use it, but you'll get Dutch Booked). Placing it as a branch suggests it determines the *type* of update, but philosophically it might determine the *legitimacy* of the update regardless of type.

  **Indistinguishable Leaves**
  I flag **Leaf 2 (Standard Conditionalization)** and **Leaf 6 (Algebra Expansion)** as practically indistinguishable in their output.
  *   *Reason:* Leaf 6 is simply Leaf 2 applied to a larger algebra. The tree separates them to highlight the *strategy* (expand algebra vs. accept uncertainty), but the resulting credences in H will be identical if the expansion is successful.

  **Unoccupied Combination**
  **Leaf 8 (Unnamed/Sequential Update)** represents an unoccupied combination.
  *   *Reason:* **Unattractive.** While logically possible (a planned rule where order matters), it is rarely formalized because it violates the intuitive desideratum that evidence should be commutative. It imposes high cognitive costs for no clear gain in accuracy.
