answer: |-
  # Does the simulation argument dampen fanaticism about the far future?

  **Instructions:** Start at the top. For each claim, mark **Accept** or **Reject**. Follow the arrows to your terminal position.

  ### **Q1. Trilemma Credence**
  > "The standard simulation trilemma warrants **>10% credence** that I am currently in an ancestor simulation."
  > *   **Reject** ────────────────────────────────────────────────────────────────────────────────┐
  > *   **Accept** ────────────────────────────────────────────────────────────────────────────────┤
  >                                                                                               ▼
  ### **Q2. Epistemic Stability**
  > "Hypothesizing we are simulated **does not undermine** the reliability of the reasoning used to reach this conclusion."
  > *   **Reject** ───────────────────────────────────────────────────────────────────► **[CLUELESSNESS / ANTI-FANATICISM]**
  > *   **Accept** ────────────────────────────────────────────────────────────────────────────────┤
  >                                                                                               ▼
  ### **Q3. Moral Ontology**
  > "The welfare of simulated beings **counts fully** toward the total value of the future."
  > *   **Reject** ───────────────────────────────────────────────────────────────────► **[BASE-REALITY-ONLY (AXIOLOGICAL)]**
  > *   **Accept** ────────────────────────────────────────────────────────────────────────────────┤
  >                                                                                               ▼
  ### **Q4. Truncation Risk**
  > "Conditional on being simulated, our future is **more likely to be truncated** by shutdown than to continue indefinitely."
  > *   **Accept** ───────────────────────────────────────────────────────────────────► **[SHUTDOWN-DISCOUNTED LONGTERMISM]**
  > *   **Reject** ────────────────────────────────────────────────────────────────────────────────┤
  >                                                                                               ▼
  ### **Q5. Nested Recursion**
  > "Conditional on being simulated, we are likely to create nested simulations that **vastly expand** the total future."
  > *   **Reject** ───────────────────────────────────────────────────────────────────┐
  > *   **Accept** ───────────────────────────────────────────────────────────────────┤
  >                                                                                 ▼
  ### **Q6. Reference Class (Universal)**
  > "Our evidence should be treated as a **random sample from all simulations**."
  > *   **Accept** ───────────────────────────────────────────────────────────────────┤
  > *   **Reject** ───────────────────────────────────────────────────────────────────┤
  >                                                                                 ▼
  ### **Q7. Reference Class (Selection)**
  > "Our evidence should be treated as **preferentially sampled from simulations run because they contain large futures**."
  > *   **Reject** ───────────────────────────────────────────────────────────────────┤
  > *   **Accept** ───────────────────────────────────────────────────────────────────┤
  >                                                                                 ▼
  > **[BUSINESS-AS-USUAL LONGTERMISM]**                                     **[AMPLIFIED-FANATICISM]**
  > *(Includes Q1 Reject path: BASE-REALITY-ONLY (ONTOLOGICAL))*

  ***

  ### **Logical Space Analysis**

  **Unoccupied Combinations**
  *   **Q4 Accept + Q5 Accept:** *Incoherent.* One cannot be likely to create vast nested futures if one is likely to be shut down before doing so.
  *   **Q3 Reject + (Q4/Q5/Q6/Q7 Any):** *Merely Unattractive.* If simulated welfare counts for nothing, questions about the simulated future's size or selection effects are axiologically irrelevant.
  *   **Q6 Accept + Q7 Accept:** *Incoherent.* One cannot treat evidence as a random sample from *all* simulations while simultaneously treating it as preferentially sampled from a *subset*.

  **Indistinguishable Leaves**
  *   **Base-Reality-Only (Ontological) vs. (Axiological):** The tree cannot genuinely separate these in practice. Both prescribe acting as though only base reality matters, differing only on whether simulated suffering is *metaphysically* impossible or merely *morally* weightless.
  *   **Business-As-Usual (Q5 Reject) vs. (Q6 Accept):** Both result in standard longtermist calculations. The distinction (whether we can recurse vs. whether we are a random sample) cancels out in expected value terms unless combined with the Selection Effect (Q7).

  **Design Notes**
  *   **Q1** establishes the simulation hypothesis as a live option.
  *   **Q2** filters for self-defeating skepticism (the "unstable" leaf).
  *   **Q3** filters for moral nihilism regarding sims (the "base reality" leaf).
  *   **Q4** isolates the "shutdown" risk specific to sims.
  *   **Q5–Q7** navigate the variance: **Q5** allows for expansion, **Q6** normalizes probability, and **Q7** introduces the bias required for *amplified* fanaticism (tiny probability of astronomically large value).
