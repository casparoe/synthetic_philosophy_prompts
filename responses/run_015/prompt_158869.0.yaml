  Where I've actually committed yourself
  Your core commitment is a concrete pluriverse of spatiotemporally isolated worlds, where 'actual' is indexical and de re modality uses counterparts. Recombination over actual fundamentals fixes the modal space. This is non-negotiable. Your riders are optional constraints: no alien properties, perfectly determinate possibility, and no empty world. These shape the modal logic but can be dropped if pressured. Your extensions apply this machinery to laws, chance, and causation. The core carries the ontological weight; the riders carry the modal specificity. If the core fails, the view dies. If riders fail, you retreat to standard Lewisianism. The extensions are explanatory bonuses; if they fail, you lose utility but keep the metaphysics.

  Ranked defeaters
  1. **Alien Properties (Fatal to Rider 1):** If fundamental physics discovers properties not instantiated here, your recombination principle cannot generate possibilities requiring them. You are locked into current physics. This makes modal truth contingent on empirical ignorance. If a new force exists elsewhere, your view literally cannot describe it. This is a hard limit on modal representation. If possibility exceeds actual fundamentals, your system breaks. You cannot account for genuine novelty beyond recombination of the known. Your modal space shrinks if physics is incomplete.
  2. **The Empty World (Fatal to Rider 3):** You deny 'nothing might have existed.' If this is a necessary truth, you clash with deep modal intuition. While you can argue coherence, the inability to represent this possibility limits your modal logic's alignment with standard systems. It forces a specific modal logic where others allow more. This is a bullet you must bite. If the intuition is robust, your rider is false.
  3. **Idle Ontology (Fatal to Core):** If ersatzism models the same logical space without concrete commitment, your ontology is idle. You claim explanatory gain, but if rivals deliver the same goods cheaper, the concrete worlds are gratuitous. This targets your primary justification. If abstract representations do the work, concrete existence is waste. This is the strongest argument against you. Parsimony favors the rival. You need to show concrete similarity does work abstracta cannot.
  4. **Modal Vagueness (Awkward for Rider 2):** Denying modal vagueness forces sharp cutoffs for counterparts. If identity is vague, your sharp truth values look ad hoc. You must explain away linguistic intuition as ignorance, which is costly. It requires a precisification of concepts that may not exist. This makes your semantics rigid against flexible usage.
  5. **Causal Redundancy (Awkward for Extension):** If interventionist semantics works without worlds, adding plenitude is decoration. Scientists quantify over variables, not worlds. If their success doesn't rely on your ontology, your claim to underwrite causation weakens. It suggests the worlds are not doing the work you claim. You risk over-engineering the explanation.
  6. **Cardinality (Technical):** If worlds are concrete, can they form a set? If the pluriverse is a proper class, quantification over 'all worlds' becomes technically problematic, potentially breaking the semantics. This is a technical nuisance. It complicates the formalization but does not destroy the metaphysics.

  What defenders concede vs. what they dismiss
  Defenders concede the ontology is extravagant and isolation is definitional, not empirical. They admit you cannot detect other worlds. However, they dismiss the demand for primitive modality, arguing analysis is superior to primitivism. They concede the empty world is lost but argue coherence trumps intuition. They dismiss idle ontology charges by claiming only concrete similarity grounds counterfactual truth non-circularly. The main concession is that riders are negotiable; the core is not. They will drop alien restrictions before abandoning concrete worlds. They accept the cost to avoid primitive modality. The trade-off is ontological cost for ideological gain. They prioritize analysis over parsimony.

  What hard plenitude predicts that its rivals don't
  Your view predicts no alien properties and no empty world, unlike rivals who allow them. It predicts determinate counterfactuals where others accept vagueness. It predicts laws are descriptive summaries, not prescriptive necessities. Rivals often treat laws as primitive or allow modal vagueness. Your view stands out by denying modal primitivism and restricting modal space to actual fundamentals. This makes specific empirical predictions about the limits of possibility based on actual physics. It ties modal space tightly to actual physical structure.

  Has this been qualified into unfalsifiability
  Isolation is definitional, protecting you from empirical falsification but risking vacuity. If 'world' just means 'causally isolated region,' cosmology can't touch you. However, this invites the collapse worry: if you relax riders to match intuition, do you just get ersatzism with extra steps? If concrete isolation does no work beyond logical consistency, the ontology is idle. Unfalsifiability is a problem if the view explains nothing rivals can't. But if it analyzes modality without primitives, it earns keep. The risk is becoming a complex notation for actualist semantics. You must ensure concrete similarity does unique work.

  Bottom line
  The view is robust against cardinality and weirdness but exposed on idle ontology and alien properties. The core holds if you value analysis over parsimony. The riders are vulnerable to empirical shifts and intuitive clash. You survive if concrete similarity is indispensable. Otherwise, you are paying for decoration. The exposure is moderate: fatal only if ersatzism succeeds fully.
