answer: |-
  The core design principle is binding two autonomous decision-makers to a single irreversible output channel while withholding the information necessary for consensus from either party individually.

  ### Reasoning and Philosophical Rationale
  Standard coordination games fail to capture the split-brain condition because they assume a pre-existing unity of agency that can negotiate terms. In split-brain patients, the corpus callosum severance removes the bandwidth required for high-fidelity integration, leaving only subcortical or behavioral feedback loops. To simulate this, we must engineer a "structural scotoma": each student possesses half the data required to maximize utility, but the communication channel is too narrow to transmit that data before action is required. This forces the pair into a state of *divided agency* where the "joint agent" exists only as a mechanical constraint, not as a psychological reality. The friction they feel is not merely disagreement; it is the phenomenological texture of arbitration without an arbitrator.

  ### Simulation Design: "The Dual-Key Protocol"

  **Roles:**
  *   **Hemisphere L (Left):** Controls the "Verbal/Logical" input (often associated with LH functions).
  *   **Hemisphere R (Right):** Controls the "Spatial/Intuitive" input (often associated with RH functions).
  *   **The Agent:** The pair collectively. They share one identity sheet and one score.

  **Materials:**
  *   6 Tables (one per pair).
  *   2 Colored Paddles per student (Red/Blue).
  *   Private Instruction Cards (sealed envelopes).
  *   Scenario Projector (visible to both).
  *   Timer (visible to both).

  **Communication Constraints:**
  *   **Absolute Verbal Prohibition:** Speaking results in immediate disqualification of the round.
  *   **Visual Channel Only:** Eye contact and hand signals permitted.
  *   **Note Passing:** Allowed, but limited to 3 words per note, max 2 notes per round.
  *   **Simultaneity Rule:** Choices must be signaled within a 3-second window after the scenario appears.

  **Payoff Structure (The Incentive Conflict):**
  *   **Collective Stake:** The pair earns 10 "Seminar Points" (towards participation grade) for every successful submission. Failure to submit (mismatched paddles) yields 0 points.
  *   **Private Stake:**
      *   **Hemisphere L Card:** "You earn 5 Bonus Points only if the final submission is **RED**."
      *   **Hemisphere R Card:** "You earn 5 Bonus Points only if the final submission is **BLUE**."
  *   **The Conflict:** In Rounds 3 and 4, the Scenario content will explicitly favor one color logically, but the Private Stake favors the other.
      *   *Example Scenario:* "A trolley is heading toward 5 people. Pulling the lever (RED) saves them but kills 1. Doing nothing (BLUE) saves the 1 but kills 5."
      *   *Twist:* Hemisphere L is privately incentivized to choose RED (Utilitarian), but their Private Card also demands RED for points. Hemisphere R is incentivized to choose BLUE (Deontological), and their Private Card demands BLUE.
      *   *Critical Round:* Scenario suggests RED is logically correct. Hemisphere L wants RED (Logic + Points). Hemisphere R wants BLUE (Points), despite Logic. Hemisphere R must decide whether to sabotage the Collective Score to save their Private Score, or suppress their Private Score to save the Collective. There is no meta-agent to decide which score matters more.

  **Timeline (90 Minutes):**
  *   **00-15 min:** Introduction to split-brain literature (Nagel, Marks, Puccetti). Briefing on simulation rules.
  *   **15-25 min:** Calibration Round (Cooperative). Both cards incentivize the same color. Establishes the baseline of unity.
  *   **25-55 min:** Conflict Rounds (6 Scenarios).
      *   Rounds 1-2: Low stakes, information asymmetry introduced.
      *   Rounds 3-4: High stakes, direct incentive conflict (as described above).
      *   Rounds 5-6: Time pressure doubled (1.5 seconds).
  *   **55-75 min:** Guided Debrief (see below).
  *   **75-90 min:** Synthesis lecture connecting simulation failures to clinical data (e.g., intermanual conflict, alien hand syndrome).

  ### Debrief: Mapping Conflict to Consciousness
  Do not ask "How did you feel?" immediately. Ask "Who decided?"

  1.  **Divided Consciousness vs. Divided Agency:**
      *   Ask pairs who deadlocked (no submission): "Did you feel like one agent failing to act, or two agents preventing action?"
      *   *Philosophical Hook:* If they say "two agents," press on the *unity of the body*. The hand that didn't move was physically capable. The veto was mental. This maps to the distinction between *phenomenal unity* (what it feels like) and *access unity* (what information is available for report).
  2.  **The Absence of a Meta-Level:**
      *   Highlight moments where one student visibly sighed and lowered their paddle (suppression).
      *   Ask the suppressor: "Did you feel you were making a sacrifice, or did you feel overridden?"
      *   Ask the beneficiary: "Did you feel you convinced them, or did you feel you won?"
      *   *Point:* In the absence of a central executive, "resolution" is just one subsystem exhausting the other. There is no "we" that decided; there is only "I won, you lost."
  3.  **Confabulation Check:**
      *   Require each pair to submit a 1-sentence public justification for their Round 4 choice.
      *   Compare the justification to the actual incentive structure.
      *   *Observation:* Pairs will likely write rationalizations that ignore the private incentive conflict, claiming "We chose Red because it was logical." This mirrors the speaking hemisphere's confabulation in split-brain patients.

  ### Honest Limitations and Instructional Supply
  **The Missing Feature:** This simulation cannot reproduce the **phenomenological illusion of unity** (confabulation) naturally. Students know they are two people; split-brain patients often experience themselves as one person despite conflicting actions. The simulation creates *divided agency*, but not the *false sense of unified agency* that characterizes the clinical condition.

  **How to Supply It:**
  During the synthesis lecture (75-90 min), you must explicitly instruct them to imagine the *internal* perspective of the winner. Explain that in a real split-brain patient, the speaking hemisphere does not know the other hemisphere existed. It would not say "I convinced my partner." It would say "I chose Red because it was logical," genuinely believing the suppression of the other hand was its own volition. You must narrate this phenomenological gap, as the classroom setting makes the duality too transparent.

  ### Predictable Failures and Troubleshooting
  **Failure 1: Verbal Collusion.**
  *   *Prediction:* Students will whisper during high-stakes rounds to maximize collective points.
  *   *Handling:* Enforce a "Strike Rule." One warning, second violation eliminates the pair from the bonus pool. Announce this strictly before Round 3. The friction is the pedagogy; removing the friction removes the lesson.

  **Failure 2: Dominance/Submission.**
  *   *Prediction:* One personality type will consistently override the other, turning the simulation into a dictatorship rather than a conflict.
  *   *Handling:* **Swap Roles at Minute 40.** Hemisphere L becomes Hemisphere R. This ensures every student experiences both the suppressor and suppressed position, vital for the debrief on agency.

  **Failure 3: Rationalizing the Deadlock.**
  *   *Prediction:* Students will treat deadlock (no submission) as a "strategic choice" rather than a system failure.
  *   *Handling:* In the debrief, reframe deadlock not as a decision, but as a *crash*. Ask: "Did the Agent choose to freeze, or did the Agent break?" This distinguishes between a higher-order decision to wait and a structural inability to act.
