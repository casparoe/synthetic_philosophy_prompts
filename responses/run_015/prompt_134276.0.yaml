answer: |-
  This is a high-stakes pedagogical design. You are asking students to enact a logical failure that feels like a success until the structural constraints snap shut. The goal is to make the *structure* of bootstrapping (Cohen/Vogel style) palpable before naming it.

  Here is the complete package for **"The Warrant Auction."**

  ### 1. Materials List (Cheap & Analog)
  *   **4 "Black Boxes"**: Large manila envelopes.
  *   **20 "Truth Cards"**: Index cards, 10 Red / 10 Black (shuffled into the envelopes, 5 per box).
  *   **20 "Output Slips"**: Small slips of paper, pre-written to match the Truth Cards exactly (e.g., if Card 1 is Red, Slip 1 says "RED"). *Crucial: These are sealed inside the envelope, visible through a small cut-out window or attached to the front, so the output is visible without opening the envelope.*
  *   **Warrant Ledgers**: A sheet of paper per team with 5 numbered rows (one for each card).
  *   **Challenge Tokens**: 10 poker chips or distinct coins per team.
  *   **Scoreboard**: Whiteboard.
  *   **Timer**: Phone or watch.

  ### 2. The Rules (Handout or Projected)
  **Objective:** Maximize your team's "Epistemic Score."

  **Phase 1: Calibration (20 Minutes)**
  1.  Your Box contains 5 hidden cards. The Window shows 5 Output Slips.
  2.  To earn **Trust Tokens**, you must record a "Verified Match" in your Ledger.
  3.  A "Verified Match" requires two entries on the same row:
      *   *Entry A:* What the Window says.
      *   *Entry B:* What the Card actually is.
  4.  **The Cost:** To fill in *Entry B*, you must open the envelope flap for that card.
  5.  **The Penalty:** If you open the envelope, that card is "Burned." You cannot use it for points in Phase 2.
  6.  **The Challenge:** At any time, a rival team may spend a **Challenge Token** to inspect your Ledger.
      *   If your *Entry B* (Truth) matches your *Entry A* (Output), but you did not mark that the envelope was opened, they steal 5 points from you.
      *   *Rule of Independence:* You cannot use the Window's output to justify the Card's truth. (If challenged, you must show the physical card or admit the envelope was opened).

  **Phase 2: Prediction (10 Minutes)**
  1.  For every **Trust Token** you earned in Phase 1, you unlock the ability to score points on "Burned" cards (cards you opened) or "Unopened" cards.
  2.  **Scoring:**
      *   Correct Prediction on Unopened Card: **10 Points**.
      *   Correct Prediction on Burned Card: **0 Points** (You already saw it).
      *   **Multiplier:** If you have 3+ Trust Tokens, all Phase 2 points are **doubled**.

  **Phase 3: The Reveal & Auction (10 Minutes)**
  1.  Instructor reveals: *All Boxes were perfectly reliable.* Every Output Slip matched every Truth Card.
  2.  **The Auction:** Teams bid points on the statement: *"I know this Box is reliable."*
  3.  Bid = How many past matches (0 to 5) you require to assert knowledge of reliability.

  ### 3. Minute-by-Minute Timeline (80 Minutes)

  *   **00:00 – 00:10: Setup.** Distribute boxes. Explain rules. Emphasize the **Challenge Rule**. Do *not* use the words "circular," "bootstrapping," or "begging the question." Use "Independent Verification."
  *   **00:10 – 00:30: Phase 1 (Calibration).** Teams struggle. They want the Multiplier (3+ Tokens). To get Tokens, they need Verified Matches. To Verify, they must Open. But Opening burns the card, reducing Phase 2 potential.
      *   *The Trap:* Teams will try to fill in *Entry B* by copying *Entry A* without opening the envelope. They will hope not to get challenged.
      *   *The Conflict:* Rival teams will challenge aggressively to steal points.
  *   **00:30 – 00:40: Phase 2 (Prediction).** Teams make predictions on remaining unopened cards. Scores are tallied.
  *   **00:40 – 00:50: The Reveal.** Open all envelopes. Show that *everyone* had a perfect instrument. The teams that "cheated" the ledger (copied Output to Truth without opening) actually had true beliefs.
  *   **00:50 – 01:00: The Auction.** Ask: "You now know the gauge was perfect. Did your Phase 1 work give you *knowledge* of that reliability? How many matches do you need to claim you *know* it's reliable?"
  *   **01:00 – 01:20: Debrief.** (See below).

  ### 4. Scoring Scheme
  *   **Trust Token:** +5 Points (Awarded only if Ledger is unchallenged/successful).
  *   **Successful Challenge:** Steal 5 Points from target + 2 Bonus Points.
  *   **Phase 2 Prediction:** +10 Points per correct guess on unopened cards.
  *   **Multiplier:** If Tokens $\ge$ 3, Phase 2 points $\times$ 2.
  *   **Penalty:** If a team is caught falsifying a Ledger (Entry B matches A but envelope seal unbroken), they lose all Phase 1 points.

  ---

  ### 5. The Debrief: Mapping the Game to the Argument
  *Do not start with definitions. Start with their frustration.*

  **Step 1: The Structure of the Trap (10 mins)**
  Ask the team that tried to "game" the Ledger (copying Output to Truth without opening):
  *   "You knew the Output was Red." (Yes)
  *   "You wrote down the Truth was Red." (Yes)
  *   "Was it true?" (Yes, we revealed at the end).
  *   "So why did Team B steal your points when they challenged you?"
  *   *Target Answer:* "Because I couldn't prove I knew the Truth *independently* of the Output."

  **Map this to the Board:**
  1.  Gauge says $P$. (Window says Red)
  2.  $P$ is true. (Card is Red)
  3.  Therefore, Gauge was right. (Match)
  4.  Therefore, Gauge is reliable. (Trust Token)
  5.  Therefore, Gauge says $Q$... (Phase 2 Prediction)

  **The Point:** "You couldn't move from Step 1 to Step 2 without 'Opening the Envelope.' In epistemology, 'Opening the Envelope' is **Independent Access**. If you use the Gauge to verify the Gauge, you are copying Entry A to Entry B without opening the flap."

  **Step 2: The "Reliable but Useless" Paradox (10 mins)**
  Remind them: "I told you at the end: The Gauges were **perfect**. 100% Reliable."
  *   "Did that make your Phase 1 reasoning valid?" (No).
  *   "Why not? If the premise is true, why is the argument bad?"
  *   *Target:* "Because the *reason* you have for believing it is reliable depends on assuming it is reliable."

  **Connect to Perception:**
  *   "The Gauge is your Eyes. The Card is the World."
  *   "To prove your eyes are reliable, you check if what you see matches the world."
  *   "But how do you check the world? You look at it."
  *   "You are using your eyes to check your eyes. You are copying Entry A to Entry B."

  **Step 3: The Auction & Closure (10 mins)**
  Review the Auction bids.
  *   Team A: "I need 5 matches."
  *   Team B: "I need 100 matches."
  *   Team C: "Zero, I just assume it."
  *   **The Hard Question:** "If the Gauge is reliable, why isn't 1 match enough? If it's reliable, the inference *is* truth-preserving."
  *   **The Cost of Resistance:**
      *   *Option 1 (Skepticism):* You can never prove your senses are reliable. (High cost).
      *   *Option 2 (Externalism):* You *do* know, you just can't prove it in a Ledger. (You have knowledge, but no 'Warrant Ledger' to show the class).
      *   *Option 3 (No Closure):* You know $P$, and you know $P \rightarrow Q$, but you don't know $Q$. (Deny the step from 'Right once' to 'Reliable').

  ---

  ### 6. Troubleshooting: What Will Go Wrong
  *Be ready for these three specific pushbacks.*

  **1. The "It's Just Induction" Objection**
  *   **Student:** "This is just normal induction. I see it work once, I bet it works again. Why is that bad?"
  *   **Your Move:** Distinguish **Tracking** from **Bootstrapping**.
      *   *Normal Induction:* I check the Gauge against a Ruler (Independent Source). It matches 5 times. I conclude it's reliable.
      *   *Bootstrapping:* I check the Gauge against... the Gauge's claim about the Ruler.
      *   *In Game Terms:* "Did you open the envelope (Independent Source)? Or did you trust the Window (Dependent Source)? Induction requires independent data points. You tried to induct on a single, self-referential data stream."

  **2. The "Two Gauges Agree" Loophole**
  *   **Student:** "I'll trade cards with Team B. If their Gauge and my Gauge agree, that's independent verification!"
  *   **Your Move:** Block this in rules if possible, or use it as a teachable moment.
      *   *If it happens:* "Does Team B's Gauge have its own reliability problem? If you need to prove yours, and you use theirs, who proves theirs?" (Leads to Regress).
      *   *Prevention:* Rule addendum: "Calibration must be internal to your Box."

  **3. The "I Just Know" Intuition**
  *   **Student:** "I don't need a Ledger. I just see it's Red. I know it's reliable."
  *   **Your Move:** This is the **Externalist** position (Reliabilism).
      *   *Acknowledge:* "You might be right. You might *have* knowledge. But can you *show* us the Warrant? This game simulates the Internalist demand: 'Show me your Ledger.' Bootstrapping fails when you are required to *cite* your reasons. If you don't need to cite reasons, the problem vanishes—but so does the seminar."

  ### 7. Limitations: What the Game Cannot Stage
  *Be honest about this in the final 5 minutes.*

  1.  **The Closure Principle:** The game forces them to feel the block, but it doesn't formally prove why Closure (If I know $P$, and I know $P \rightarrow Q$, I know $Q$) is the culprit. You will have to state this: "The game makes you feel that you can't get to $Q$ (Reliability). The philosophical debate is whether you deny you know $Q$, or deny that Knowledge closes over entailment."
  2.  **The "No-Loss" Scenario:** In the game, being wrong costs points. In real bootstrapping (e.g., checking your eyes), being wrong doesn't cost points, it costs *reality*. The stakes are higher, which makes the temptation to bootstrap *stronger* in real life than in the game.
  3.  **The "True Belief" Nuance:** In the game, the Gauge was *actually* reliable. In some philosophical variants, the Gauge is unreliable, but the subject thinks it is. The game simplifies this to keep the focus on *justification structure* rather than *truth conditions*.

  ### Instructor Script for the "Gut Check" Moment
  *At minute 00:35, when they are arguing over the Ledgers:*

  > "Pause. Look at Team A. They have a perfect score. They have a perfect Ledger. They have a perfect Gauge. And yet, Team B just stole their points. Why? Team A, you didn't make a false claim. You didn't make a bad guess. You failed to **disconnect the source of the answer from the source of the verification.** You used the key to check if the key fits the lock, without ever trying the door."

  This sets up the debrief perfectly without using the forbidden words.
