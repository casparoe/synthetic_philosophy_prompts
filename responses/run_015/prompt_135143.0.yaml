answer: |-
  You have identified a genuine and mathematically precise phenomenon. It is a source of considerable frustration in the literature on collective intelligence, precisely because it contradicts the intuitive notion that better individuals must necessarily make a better group.

  To answer your primary question directly: there is no single, universally canonical noun (like "gravity" or "inertia") that labels this specific configuration across all disciplines. However, it is rigorously described within social choice theory and machine learning under the umbrella of the **Diversity Prediction Theorem**, and the specific failure mode is best termed **Correlated Systematic Error**.

  If a coinage is required to distinguish this from social herding, I would propose **Protocol-Induced Error Alignment**, though in engineering contexts, it is often analogised as **Common-Mode Failure**.

  Below I define the concept, distinguish it from its neighbours, and outline the conditions under which it arises, so that you might diagnose it in future reforms.

  ### 1. The Concept and Definition

  The phenomenon you describe occurs when an intervention (a protocol, a tool, a training) reduces the variance in individual judgements such that the **covariance of errors increases** faster than the **mean individual error decreases**.

  In formal terms, this is governed by the **Diversity Prediction Theorem** (Page, 2007), which states:

  $$ \text{Collective Error} = \text{Average Individual Error} - \text{Prediction Diversity} $$

  *   **Average Individual Error:** The mean squared error of the members (accuracy).
  *   **Prediction Diversity:** The average disagreement among the members (variance).

  Your cases illustrate a situation where the reform reduced *Average Individual Error* (the individuals became more accurate overall), but it reduced *Prediction Diversity* to near zero. Crucially, on the subset of "difficult" cases, the protocol introduced a **systematic bias**. Because the individuals were now using the same flawed heuristic for those hard cases, their errors became perfectly correlated.

  When errors are uncorrelated, they cancel out (the "wisdom of crowds"). When errors are correlated, they accumulate. If the correlation is strong enough, and if the competence on those specific items falls below 0.5 (as you surmised), the group enters an **Inverse Condorcet** state: the majority verdict becomes *less* reliable than a random guess.

  **Definition:**
  > **Correlated Systematic Error (or Protocol-Induced Error Alignment):** A state of collective judgement wherein a standardisation of method improves mean individual accuracy but induces a high positive correlation in residual errors, specifically on high-difficulty items, resulting in a net degradation of group-level performance.

  ### 2. Distinction from Neighbours

  It is vital to separate this from the more commonly cited failures of group judgement, as the remedies differ.

  | Phenomenon | Cause | Mechanism | Remedy |
  | :--- | :--- | :--- | :--- |
  | **Herding / Information Cascades** | Social / Sequential | Member B sees Member A's choice and infers A has private information, ignoring their own. | Secret ballots; simultaneous reporting. |
  | **Groupthink** | Psychological / Social | Desire for harmony or conformity suppresses dissent; deviation is punished socially. | Appoint a "devil's advocate"; anonymous feedback. |
  | **Correlated Systematic Error** | **Methodological / Structural** | **Members think independently, but the *tool* or *protocol* processes the evidence identically, including its blind spots.** | **Introduce cognitive diversity; use multiple models.** |

  In your examples, the botanists and the moth recorders were not copying one another. They were faithfully applying a shared instrument. The instrument itself contained a bias that was invisible on easy cases but decisive on hard ones. This is not a social failure; it is an epistemic one.

  ### 3. Conditions for Appearance

  For this effect to manifest, three conditions must coincide:

  1.  **Heterogeneous Difficulty:** The task must not be uniformly difficult. There must be a subset of "easy" items (where the protocol works) and a subset of "hard" items (where the protocol fails).
  2.  **Bias on the Tail:** On the "hard" subset, the protocol must not merely add noise; it must introduce a *directional bias*. It must lead most users to the *same* wrong answer.
  3.  **Competence Below Chance on Hard Items:** As you noted, if the probability of an individual being correct on the hard items drops below 0.5 ($p < 0.5$), and the errors are correlated, the majority vote inverts the truth. The more people you add, the more certain the group becomes of the wrong answer.

  ### 4. How to Tell in Advance (Diagnostics)

  You asked how one could tell whether a given reform will help or hurt. Standard validation usually measures mean accuracy on a test set. This is insufficient because it masks the correlation structure. To detect this risk, a panel chair or scheme coordinator should employ the following diagnostics:

  **A. Measure Error Correlation, Not Just Accuracy**
  Before rolling out a protocol, run a calibration exercise. Do not merely score how many each person got right. Calculate the **phi coefficient** (or similar correlation metric) between the error vectors of pairs of participants.
  *   *Helpful Homogenisation:* Errors remain uncorrelated (when I am wrong, you are often right).
  *   *Harmful Homogenisation:* Errors become highly correlated (when I am wrong, you are wrong too).

  **B. Stress-Test the "Tail"**
  Do not validate the protocol on a random sample of cases. Validate it specifically on the **most ambiguous 10%** of cases—the ones that historically caused disagreement. If the protocol makes everyone agree on these, check rigorously whether they are agreeing on the *truth* or agreeing on a *plausible falsehood*. If the latter, the protocol is dangerous.

  **C. The Diversity-Accuracy Trade-off Curve**
  Plot the proposed reform on a graph of Accuracy vs. Diversity.
  *   If the reform moves you up and left (Higher Accuracy, Lower Diversity), calculate the net effect using the Diversity Prediction equation.
  *   If the loss in Diversity is greater than the gain in Accuracy, the reform will degrade collective judgement.

  ### 5. A Proposed Coinage

  Since you requested a coinage should no name exist, and given that "Correlated Systematic Error" is descriptive rather than nominal, I suggest the term:

  **The Homogenisation Penalty**

  **Definition:** The reduction in collective competence that occurs when methodological standardisation eliminates the uncorrelated noise that previously allowed a group to average out errors on difficult items.

  **Usage:** "The new identification key is more accurate for novices, but we must beware the **Homogenisation Penalty**; if it misleads all recorders on the *E. ambiguus* complex, our consensus data will be worse than before."

  ### Summary

  Your arithmetic is correct. The Condorcet Jury Theorem relies on the assumption of independence. When you standardise the method, you purchase accuracy at the price of independence. If the price is too high—specifically, if the method aligns errors on the cases where individual competence is below 50%—the group becomes a "super-ignoramus," confidently wrong where it was previously hesitantly right.

  The literature places this within the **Diversity Prediction Theorem**, but the specific risk is **Correlated Systematic Error**. To avoid it, one must value **cognitive diversity** (different ways of being wrong) as highly as **individual ability** (being right).

  I hope this provides the terminology and theoretical framework you sought. It is a pleasure to correspond with someone who has observed the mathematics of nature in the behaviour of panels.
