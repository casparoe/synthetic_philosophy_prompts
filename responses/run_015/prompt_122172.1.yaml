answer: |-
  **Exam Prompt: POLI 405 — Final Takeaway**

  **Question 3 (25 points)**
  Recent critiques of the "right to exclude" have proposed a framing of **Intergenerational Territorial Trusteeship**. Under this view, present citizens are not owners of state territory but temporary stewards holding it in trust for unborn future citizens. The goal is to preserve cultural and ecological continuity without asserting absolute property rights.

  Write an essay responding to the following: Does this trustee view ultimately **strengthen** the right to exclude (by protecting an inheritance for the future) or **undermine** it (by binding non-existent people to a specific cultural package they never chose)? In your answer, you must navigate the tension between current democratic self-determination and this fiduciary duty. Crucially, identify whether the trustee model successfully avoids property-based exclusion or if it **smuggles in a rights-claim** it pretends to reject.

  ***

  **Model Answer (Key)**

  The Intergenerational Territorial Trusteeship model attempts to walk a tightrope between open borders advocacy and statist exclusion. By reframing citizens as stewards rather than owners, it tries to dodge the libertarian property arguments (like Wellman's) while avoiding the radical openness of Carens. However, upon closer inspection, this framework ultimately strengthens exclusionary practices while masking them as moral duties, and it fails because it smuggles in a property claim it explicitly disavows.

  On the surface, trusteeship seems to limit exclusion. If we are merely stewards, we shouldn't be able to lock the gates based on current preferences. We have a fiduciary duty to pass on the territory in good condition. But this is where the strengthening of exclusion happens. By invoking "unborn future citizens," the current generation gains a powerful rhetorical shield. They can claim that excluding migrants is necessary to preserve the "cultural continuity" or "ecological balance" intended for the future. It transforms exclusion from a selfish act of current citizens into a selfless act of preservation. It argues that we *must* exclude to protect the inheritance of those who cannot speak. This makes the right to exclude harder to challenge, because opposing it looks like stealing from the future.

  However, this view undermines itself through the problem of consent and paternalism. Future people do not exist, so they cannot consent to the terms of the trust. Who decides what kind of culture or ecology they would want? Assuming they want a static continuation of the *current* culture is deeply paternalistic. It binds the unborn to a specific identity package they never chose. If a future generation would prefer a more cosmopolitan, mixed culture resulting from open borders, the trusteeship model forbids this by locking in current preferences. Thus, the model undermines the democratic self-determination of future people in the name of protecting them.

  The critical failure, however, lies in the smuggled rights-claim. The trusteeship model claims to avoid the "associative ownership" critique by saying citizens don't *own* the land. But to act as a trustee, one must have the authority to exclude others from the trust property. You cannot be a steward of a garden if anyone can walk through and trample the flowers. Therefore, the model necessarily assumes a right to control access—a property right—while pretending it's just a duty. It collapses into the very ownership view it tries to replace. It asserts that the current polity has the exclusive authority to define the terms of the trust. This is a sovereignty claim disguised as a fiduciary one.

  Furthermore, the tension between self-determination and duty is unresolved. If current citizens want to exercise self-determination by inviting newcomers, the "duty to the future" overrides them. This empties democratic self-determination of meaning. The current generation becomes a prisoner of a hypothetical future generation's interests, which are actually just projections of the current generation's biases.

  In conclusion, Intergenerational Territorial Trusteeship strengthens exclusion rhetorically by moralizing it as protection, but it undermines itself normatively. It relies on a paternalistic assumption that the current culture is what future people need. Ultimately, it smuggles in a property right—the right to control access—while claiming to only hold a duty. It doesn't solve the exclusion problem; it just obscures the ownership claim behind the veil of time.

  ***

  **Marking Scheme (25 Points)**

  **1. Analysis of Trusteeship Framing (5 pts)**
  *   **5:** Clearly explains the steward vs. owner distinction and the goal of continuity.
  *   **3:** Describes the view but misses the nuance of "fiduciary duty."
  *   **1:** Confuses trusteeship with standard ownership arguments.

  **2. Navigation of Tension (Self-Determination vs. Duty) (5 pts)**
  *   **5:** Articulates how the duty to the future overrides current democratic choices (or vice versa).
  *   **3:** Mentions the tension but doesn't explain the conflict.
  *   **1:** Ignores the tension.

  **3. The "Smuggled Rights-Claim" (Critical Insight) (10 pts)**
  *   **9-10 (A Grade):** Explicitly identifies that trusteeship *requires* exclusionary authority (property right) to function, despite claiming otherwise. Notes the collapse into paternalism.
  *   **6-8 (B Grade):** Describes the view well and treats it as a stable middle ground. Misses that the "duty" implies a "right to control."
  *   **3-5 (C Grade):** Fails to identify the hidden claim; accepts the premise at face value.

  **4. Structure & Clarity (5 pts)**
  *   **5:** Clear thesis, logical flow, minor errors allowed.
  *   **3:** Disorganized or hard to follow.
  *   **1:** Incoherent.

  **Grading Note:** To get an A, the student *must* hit the point in section 3. If they argue trusteeship is a viable compromise without noting the hidden property right/paternalism, cap at 18/25 (B+).
