answer: |-
  # Workshop Plan: The Shadow Envelope Protocol

  **Topic:** Diachronic Rationality & The Money Pump
  **Time:** 90 Minutes
  **Participants:** 16 Grad Students (Phil/Econ Mix)
  **Goal:** Move from abstract Dutch Book diagrams to embodied diachronic tension.

  ## 1. Materials & Setup
  *   **Room:** Casual. Arrange chairs in a large circle or four clusters of four.
  *   **Currency:** "Rationality Points" (RP). Track on index cards.
      *   *Stakes:* Top 3 scores get a $10 coffee voucher each (or equivalent departmental swag). This matters enough to care, not enough to panic.
  *   **Goods:** Three colored cards per student (Red, Blue, Green).
      *   *Intrinsic Value:* Hidden. (Actually, they are cyclic, but students shouldn't know this yet).
  *   **The Shadow Envelopes:** 16 small opaque envelopes.
  *   **Trade Tokens:** 3 sets of "Market Shock" cards (one set per trading round).
  *   **Scorecards:** Pre-printed sheets to track RP and holdings.

  ## 2. The Rules (Handout/Slide)

  **Phase 1: The Commitment (0:00–0:15)**
  1.  **Initial Endowment:** Every student receives **Red Card** + **10 RP**.
  2.  **The Shadow Envelope:** Inside each envelope is a slip of paper. Students must write down their **True Ranking** of the three colors (e.g., Red > Blue > Green).
  3.  **Seal It:** Seal the envelope. Write "Round-4 Self" on the front. Do not open until the end.
      *   *Facilitator Note:* Tell them this envelope represents their "Diachronic Plan." It is what their future self is bound to respect.

  **Phase 2: The Market (0:15–0:45)**
  *   **Structure:** 3 Trading Rounds (10 mins each).
  *   **Mechanic:** In each round, students pair up with a neighbor. One is the **Maker**, one is the **Taker**. Rotate roles every round.
  *   **The Offer:** The Maker draws a **Market Shock Card**. This card temporarily alters the *local* value of goods for *this trade only*.
      *   *Example Shock:* "Blue Boom: Blue is worth +5 RP extra for this transaction."
  *   **The Cost:** Every trade incurs a **Transaction Fee** of **-2 RP**.
  *   **Action:** The Taker decides to **Swap** (pay fee, get new card + bonus) or **Hold** (keep card, no fee, no bonus).
  *   **Constraint:** You can only trade the card you currently hold.

  **Phase 3: The Reckoning (0:45–1:00)**
  1.  **Stop Trading:** All cards on the table.
  2.  **Open Envelopes:** Reveal the "True Ranking" written in Phase 1.
  3.  **Apply Penalties:**
      *   **The Pump Tax:** If you hold the **same color** you started with (Red) *and* you made at least one trade during the session, subtract **-10 RP**. (You proved you are pumpable).
      *   **The Autonomy Penalty:** If your final holding contradicts your Envelope Ranking (e.g., Envelope said Red > Green, but you ended with Green), subtract **-10 RP**. (You violated your own commitment).
  4.  **Final Score:** Initial RP + Trade Bonuses - Fees - Penalties.

  **Phase 4: Debrief (1:00–1:30)**
  *   See discussion guide below.

  ## 3. The "Squeeze" Logic (Facilitator Cheat Sheet)
  You need to rig the **Market Shock Cards** to induce the cycle without explicitly telling them.
  *   **Round 1 Shock:** "Blue Premium." Makes Red -> Blue trade look locally rational (Bonus > Fee).
  *   **Round 2 Shock:** "Green Surge." Makes Blue -> Green trade look locally rational.
  *   **Round 3 Shock:** "Red Restoration." Makes Green -> Red trade look locally rational.
  *   **The Trap:**
      *   If they trade all 3 rounds: They end with Red. They pay 3 fees (-6 RP). They trigger **Pump Tax** (-10 RP). Total Loss: -16 RP + bonuses.
      *   If they stop at Round 2 (Hold Green): They avoid Pump Tax. But if their Envelope said Red > Green (likely, since they started with Red), they trigger **Autonomy Penalty** (-10 RP).
      *   **The Only Winning Move:** Refuse Round 1. But the "Blue Premium" makes that feel like leaving money on the table (Myopic Irrationality).

  ## 4. Debrief Guide: Local vs. Diachronic
  Don't lecture. Ask questions based on the scorecards.

  1.  **The Local View (Round 1-3):** "Who took the Round 1 trade? Why?"
      *   *Expected Answer:* "The bonus was 5, fee was 2. Net +3. It was dominant."
      *   *Concept:* **Myopic Optimization.** Maximizing utility at *t1* without regard for *t4*.
  2.  **The Diachronic View (The Envelope):** "Who felt angry at their Round-4 self when opening the envelope?"
      *   *Concept:* **Resolute Choice.** The Envelope was a Ulysses Contract. Ignoring it treats your future self as a stranger.
  3.  **The Money Pump Argument:** "If you ended with Red and lost points, were you irrational?"
      *   *Phil Take:* Yes, cyclic preferences violate transitivity.
      *   *Econ Take:* Only if the fees exceeded the utility of the 'experience' of trading.
      *   *Synthesis:* The pump works because you treated each trade as a new game rather than moves in a single game.
  4.  **The Autonomy Penalty:** "Is it irrational to change your mind?"
      *   *Discussion:* Distinguish between *preference drift* (legitimate) and *inconsistency* (irrational). The Envelope forced them to treat drift as inconsistency.

  ## 5. Honest Limitations: What This Can't Stage
  Be upfront about this in the last 10 minutes. Grad students smell BS if you claim this is "real life."

  1.  **Identity Continuity:** In 90 minutes, they are the same person. In real diachronic problems (addiction, savings), the "Round-4 Self" might have genuinely different neural pathways. The workshop assumes the Envelope *should* bind, but in reality, binding a future self who has new information is ethically fraught.
  2.  **Uncertainty:** Real money pumps require certainty about the cycle. In reality, Round 3 might *not* offer the trade back. The risk of the trade not appearing changes the calculation. This workshop removes uncertainty to isolate the logic, which sterilizes the risk assessment.
  3.  **Resolute Choice is Cheap Here:** In the workshop, "Resolute Choice" is just sitting still. In real life, resisting temptation requires cognitive energy (ego depletion) which isn't modeled in the RP score.
  4.  **The "One-Shot" Problem:** Money pumps theoretically require infinite loops to drain an agent. Doing it once is just a loss, not a pump. The "Pump Tax" artificially simulates the long-term consequence of a one-off behavior.

  ## 6. Predictable Failures (And Fixes)
  **Failure 1: The Collusion Ring.**
  *   *What happens:* Four students realize they can trade in a circle without fees (if you overlook the rule) or agree to not trade to split the pot.
  *   *Fix:* Enforce the "Maker/Taker" rotation randomly. You (Facilitator) call the pairs. Make the Transaction Fee mandatory (take the RP card immediately upon trade).

  **Failure 2: The "Safe" Envelope.**
  *   *What happens:* Students write "Red = Blue = Green" or "Whatever I hold at the end" in the envelope to avoid the Autonomy Penalty.
  *   *Fix:* Announce before sealing: "Strict orderings only. Ties invalidate the envelope and incur an automatic -5 RP penalty."

  **Failure 3: Rule Lawyering.**
  *   *What happens:* "I didn't pay the fee because I didn't sign the sheet."
  *   *Fix:* You hold the bank. No physical RP exchange happens between students. They tell you the trade, you update the master scorecard. This slows things down but prevents cheating. *Correction:* Too slow for 16 students.
  *   *Better Fix:* Use physical tokens for RP. If you don't hand over 2 tokens, the trade is void. Peer enforcement is faster.

  **Failure 4: Boredom in Round 2.**
  *   *What happens:* Once they smell the pump in Round 1, everyone freezes in Round 2 and 3.
  *   *Fix:* Increase the Bonus in Round 2. Make the temptation harder to resist. "Green Surge: +8 RP Bonus." Now holding feels like a loss.

  ## 7. Facilitator Script Snippet (The Setup)
  *"Most of you have seen the A-B-C-A diagram on a whiteboard. It looks clean. It looks logical. But it doesn't feel like anything. Today, you aren't drawing the loop. You are the loop.*

  *The envelope in front of you is your 'Diachronic Self.' It's the plan you make when you're calm. The cards in your hand are your 'Local Self.' That's you when there's a bonus on the table and a fee to pay. The game is designed so that your Local Self can make rational decisions that bankrupt your Diachronic Self.*

  *Your goal isn't just to maximize points. It's to see if you can keep a promise to yourself when the market tells you that promise is expensive."*

  ## 8. Post-Workshop Cleanup
  *   Collect the Envelopes. Keep them.
  *   If you run this again next semester, hand a few back to the new students with the old scores written inside. Nothing drives home "Diachronic" like seeing last year's failures. (Optional, but effective).
