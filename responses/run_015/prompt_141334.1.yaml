answer: |-
  **The Harbor Measure**

  The monitor hummed, a low, sterile sound that matched the ventilation. Elias Vane watched the number hover at 0.3. The threshold was 0.5. Below that line, the Harbor Protocol declared the patient unconscious. Above it, their word was law.

  Mrs. Gable lay on the table, her chest rising in slow, chemical rhythms. She was scheduled for a debridement that would flay skin from muscle. According to the screen, she was not there to feel it.

  The door hissed open. Director Kress stepped in, her shoes clicking on the linoleum. She didn't look at the patient. She looked at Vane, then at the monitor.

  "Proceed, Elias," she said.

  "The index is low, but her history is flagged," Vane said. His hand hovered over the propofol syringe.

  "Flags are ghosts. The broadcast is real." Kress crossed her arms. "We built Harbor because reports failed. Patients claimed pain when the workspace was dark. Patients claimed bliss when the tissue was rotting. We stopped trusting the story."

  Vane tightened his grip on the syringe. He owed Kress. Not for the mentorship, not for the references. For the night at the gala, the drink, the car, the silence she bought. She had kept the board from revoking his license when his judgment slipped. That debt sat in his throat like a coin he couldn't swallow.

  "Trust the signal," Kress said. "If the workspace doesn't ignite, there's no one home to hurt."

  Vane glanced at the secondary screen mounted on the anesthesia cart. It cycled through training logs, case studies used to certify staff on the Protocol. The loop restarted.

  *Case 44.* A man sat upright in a hospital bed. His eyes were open, tracking a pen.
  "Date?" the clinician asked.
  "October fourth," the man said. His voice was flat. "You want me to say I see the pen. I see it. But it's like reading a description of a pen. Nothing lights up. I'm talking, but I'm not here."
  *Diagnosis: Unlit Access.* Broadcast normal. Phenomenal report null.

  The screen flickered to *Case 89*. A woman lay still under sedation. The monitor trace was flat, a dead line. No broadcast. No report.
  Cut to: Post-op recovery. The woman woke screaming, clawing at her throat.
  "It burned," she shrieked, tears streaming. "I was gone, but it burned the whole time."
  *Diagnosis: Unwitnessed Presence.* Broadcast suppressed. Phenomenal report vivid.

  Vane looked away from the screen. The two cases sat in his mind, contradictory weights. If he followed Harbor, he treated the broadcast as the soul. If he ignored it, he treated the meat as the master.

  "Mrs. Gable had recall last year," Vane said. "Flat line then. She woke up screaming."

  "Anomaly," Kress said. "Outliers don't write policy. Liability does. If you drug every flatline, we bankrupt the ward. If you trust every claim, we paralyze the OR. Harbor splits the difference. It protects the hospital from the lies people tell themselves."

  "It protects the budget," Vane said.

  "It protects the standard," Kress corrected. She stepped closer, lowering her voice. "You want me to remind you why you're holding that needle, Elias? You want me to remind you what happens when you prioritize a hunch over the measure?"

  The debt tightened. He could feel the weight of the gala night, the smell of the leather seat, the fear when the lights flashed. She had taken the phone. She had made the call. She owned the silence that kept his name off the register.

  "Broadcast is availability," Kress said. "If it isn't available, it isn't conscious. That's the mechanism."

  "And if the mechanism leaks?" Vane asked.

  "Then we fix the machine. We don't guess."

  Vane turned back to Mrs. Gable. Her face was slack, devoid of tension. By all accounts, she was absent. The Protocol said he could cut. The law said he was safe.

  He looked at the monitor again. The number held at 0.3.

  While Vane stared at Kress, the monitor's trace jumped. A sharp violet spike, distinct from the background noise, arced across the grid and vanished before he turned back. It was a ignition burst, a momentary flare of workspace activity that the system smoothed over as noise.

  Vane didn't see it. He only saw Kress's eyes, hard and waiting.

  He knew what the silence cost. He knew that if he injected, he violated the Protocol. Kress would have cause. The debt would be called in, not with a phone call, but with a review board. He would lose the privilege to practice. If he didn't inject, and Gable woke screaming like Case 89, he would have followed the law and flayed a woman who felt every stroke.

  But if Gable was Case 44, if she was running on empty access, the pain wouldn't exist for her. He would be wasting drugs on a ghost.

  "Make the call," Kress said.

  Vane looked at the syringe. The fluid inside was clear, opaque in its intent. He thought about the man in Case 44, speaking without seeing. He thought about the woman in Case 89, screaming about a fire she shouldn't remember.

  He thought about the violet spike he hadn't seen.

  Vane pushed the plunger.

  The propofol flowed into the line, a white river entering the vein. He added a full clinical dose, enough to drown a horse, enough to ensure silence regardless of what the monitor said.

  Kress exhaled, a sharp sound of disappointment. "You're burning capital, Elias."

  "I'm buying insurance," he said.

  "Against what? The machine says she's out."

  "The machine says what it measures."

  Kress shook her head, turning to leave. "When the audit comes, don't ask me to speak for you."

  "I won't," Vane said.

  She left. The door hissed shut. The room returned to the hum of the ventilation. Vane watched the monitor. The number dipped to 0.1. The trace flattened, smoother than before.

  Mrs. Gable did not move. Her chest rose and fell. The scalpel waited on the tray, gleaming under the lights.

  Vane stood with his hand on the monitor, feeling the plastic casing, warm from the electronics. He waited for a flinch, a tear, a change in heart rate that would confirm he had saved her from agony. He waited for the stillness to confirm he had wasted the dose on a void.

  The monitor hummed. The number held. The room offered no verdict.
