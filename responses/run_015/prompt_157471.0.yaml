answer: |-
  Here is a prioritized list of open conceptual questions for your grant team, ranked by upstream importance. This ordering assumes the goal is to build a theoretical framework for institutional design rather than to empirically audit existing bodies.

  ### 1. The Validity Conditions for Behavioral Proxies of Epistemic Virtues

  **The Question:** Under what theoretical conditions can an external behavioral metric (like turnout or speed) validly track an internal epistemic state (like justified consensus or reflective equilibrium) without committing a category error?

  **Why It Is Upstream:**
  This is the foundational layer. You cannot analyze how a metric becomes corrupted (Goodhart's law) if you cannot first establish how it is supposed to function correctly. In machine learning, the target label is often given. In normative design, the "label" (e.g., truth or justification) is contested and often unobservable. If there is no coherent theoretical link between the behavior and the virtue, then Goodhart's law is not a risk of corruption but a certainty of failure. You must define the "true positive" case before you can model the "false positive."

  **Tractability for Theorists:**
  High. This requires conceptual analysis and formal epistemology rather than data collection. Philosophers can model the relationship between justification and action using logic or possible-world semantics. For example, you can construct thought experiments to test whether increased voter turnout *necessarily* implies increased deliberative quality under specific idealized conditions. This fits a two-year timeline because it relies on argumentation and modeling, not longitudinal studies.

  **What Would Change This Ranking:**
  If a team member produces a proof demonstrating that epistemic virtues are fundamentally private and logically incompatible with external measurement (a strong version of the "private language" argument applied to institutions), this question becomes a dead end. In that case, the project would need to pivot immediately to Question 3, accepting that all proxies are flawed and focusing solely on damage limitation.

  ### 2. The Mechanisms of Epistemic Decoupling Under Incentive Pressure

  **The Question:** What are the specific causal pathways by which optimizing for a behavioral proxy actively degrades the underlying epistemic virtue?

  **Why It Is Upstream:**
  Once you establish that a link *can* exist (Question 1), you must understand how it breaks. Goodhart's law is often treated as a black box: "metrics get gamed." For institutional design, you need a taxonomy of failure modes. Does optimizing for speed of agreement cause premature closure? Does optimizing for turnout encourage populism over justification? Understanding the mechanism is upstream of design because different mechanisms require different fixes. If the mechanism is "rashness," you design for delays. If the mechanism is "population inflation," you design for verification.

  **Tractability for Theorists:**
  Medium-High. This can be approached through game-theoretic modeling and comparative historical analysis. Theorists can construct formal models where agents maximize a proxy variable and observe the equilibrium effect on the truth-tracking variable. They can also analyze historical institutional failures (e.g., Soviet production quotas or modern academic citation gaming) as analogical cases for epistemic institutions. This avoids running new experiments while still generating mechanistic insights.

  **What Would Change This Ranking:**
  If empirical political science literature emerges showing that agents in deliberative bodies lack the cognitive capacity or information to game complex epistemic proxies effectively, this question drops in priority. If gaming is theoretically possible but practically too costly for agents, the team should focus more on Question 1 (improving the metrics) rather than Question 2 (preventing the gaming).

  ### 3. Criteria for Incentive-Compatible Institutional Design

  **The Question:** Can we define second-order institutional features that make an system robust to metric corruption without requiring access to the true epistemic target?

  **Why It Is Upstream:**
  This is the downstream application, but it is the ultimate deliverable of the grant. It is ranked third because you cannot design robustness without knowing what validity looks like (Question 1) or how corruption happens (Question 2). However, it is the most actionable question for policymakers. The goal is to identify design features—such as randomization, redundancy, or adversarial review—that reduce the payoff of gaming the proxy even when the true virtue remains unmeasured.

  **Tractability for Theorists:**
  Medium. This relies on normative theory and mechanism design. Philosophers can propose institutional architectures and test them against the failure modes identified in Question 2. For example, they can argue whether "blind review" processes reduce the incentive to game citation metrics. It is tractable without experiments because it involves evaluating the logical consistency of the design against the modeled incentives.

  **What Would Change This Ranking:**
  If a new mathematical framework (perhaps from computer science or economics) solves the "revealed preference" problem for epistemic states, this question becomes the primary focus. If we suddenly had a way to mathematically guarantee that a proxy aligns with a virtue, the need for robustness criteria diminishes, and the project shifts to implementation theory. Conversely, if it is proven that all institutional designs are vulnerable to adaptive gaming, this question becomes the most critical, shifting focus to "how do we manage inevitable failure" rather than "how do we prevent it."

  ### Summary of Order

  1.  **Validity Conditions:** Define the link. (If no link, stop.)
  2.  **Decoupling Mechanisms:** Define the break. (If no break, optimize.)
  3.  **Incentive-Compatible Design:** Define the fix. (If no fix, mitigate.)

  This order ensures your team does not spend two years designing solutions for a problem that is either conceptually impossible (Question 1) or mechanistically misunderstood (Question 2). It maximizes the leverage of purely theoretical work by front-loading the conceptual groundwork.
