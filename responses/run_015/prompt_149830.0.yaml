  **The Ruling**
  The Purser denies the water to the savior. The remainder is distributed among the eleven. The man is made comfortable by the surgeon but given no special ration, and he dies.

  **The Rule**
  The Purser is running **The Doctrine of the Boat’s Continuity**. He does not view himself as the judge of individuals, but as the steward of the *Boat* as a sovereign entity. His primary mandate is not to maximize the number of survivors in the abstract, but to ensure the *Boat* (the community, the mechanism of survival) arrives at land. Individuals are retained on the ledger only so long as they contribute to the Boat’s function or do not threaten its structural integrity. When an individual becomes a net drain on the Boat’s viability with no offsetting function, the Boat excises them to preserve the whole.

  **The Closest Analogue**
  **Case One (The First Crush Injury).**
  In both instances, the subject is physically crushed, medically compromised, and deemed unlikely to survive. In Case One, the man was discarded because he "could not have lived out the night." In Case Six, the surgeon gives the man a one-in-three chance, but the cost is one-third of the remaining water. To a Purser balancing a ledger, a 33% chance of saving one life at the cost of endangering eleven is a deficit. Case One established that medical futility trumps the sanctity of the "throat." Case Six applies that same triage logic, merely with more complex math.

  **Consistency and Precedent**
  His precedents do not underdetermine the case; he is rigorously coherent. You mentioned a preference for interesting inconsistency over boring coherence, but in this specific instance, **coherence is the more dramatic choice.**

  If the Purser saves the man, he becomes a sentimentalist, acknowledging a moral debt that his previous rulings (specifically Case Three, where utility trumped need) suggest he does not recognize. That would soften him into a standard redemption arc. If he lets the man die, he remains a tragic figure bound by his own office. He acknowledges the debt—he may even speak to it—but he pays it with grief, not water. He creates a monument to the man in the ledger, marking him as "Paid," but he will not spend the Boat's capital to settle the account.

  To make him inconsistent here, you would have to abandon **Case Three (The Navigator).** In Case Three, he prioritized the *future utility* of the group (being found) over the *present need* of the individual (kidney complaint). To save the Savior in Case Six is to prioritize *past virtue* over *future utility*. If he abandons Case Three's logic, he ceases to be a Purser and becomes a Priest. Keep him a Purser. Let the horror come from his inability to break his own rules, even for a hero.

  **Confidence**
  **90%.** The character is built on the tension between his humanity and his bureaucracy. The bureaucracy must win for the tragedy to hold. The only reason I am not at 100% is that Act Three often demands character evolution, but evolution here should come from how the *crew* reacts to his ruling, not from the ruling itself changing.

  **The Variant Case**
  The single variant that would change my mind is this: **If, in a previous case, the Purser had authorized the expenditure of resources on a "lost cause" purely to maintain morale.**
  If he had ever spent water on a dying man simply to keep the others hopeful, then Case Six becomes a calculation of morale vs. hydration. But based on the five rulings provided, he has never traded efficiency for sentiment. To start now would break the spell of his authority.
