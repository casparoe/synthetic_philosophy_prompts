  **The Announcement**

  "Class, listen closely. I guarantee that I will give you a quiz this term. It will be a surprise quiz. I have not yet decided which day it will be. I will choose the day using a random procedure that ensures that on the evening before the quiz, no one will have more than a fifty percent credence that it is happening the next day. I know our scheduled classes end on May 20th. However, I promise you this: if we reach May 20th without the quiz having occurred, and holding it then would violate the surprise condition, I will schedule a mandatory make-up session to administer it. I will keep scheduling sessions until the quiz is given surprisingly. You know I keep my promises."

  **Schedule and Credence Arithmetic**

  Let the class meetings be indexed $k = 1, 2, 3, \dots$. Because the teacher has committed to extending the schedule indefinitely if necessary to preserve surprise, the students' credence function assigns a non-zero probability to the existence of meeting $k+1$ for any $k$. The teacher's random procedure is modeled by the students as a geometric distribution with parameter $p = 0.5$. On any evening $k-1$, given that no quiz has occurred yet, the students' conditional credence that the quiz will occur at meeting $k$ is exactly $0.5$. This satisfies the operational definition of surprise (credence $\le 0.5$). The sum of probabilities over the infinite horizon is $\sum_{k=1}^{\infty} (0.5)^k = 1$, satisfying the condition that the quiz will occur with credence 1.

  The backward-induction argument fails at the **Base Step**. The standard argument begins: "Consider the last possible meeting $N$. If the quiz has not occurred by $N-1$, it must occur at $N$, so credence is 1, so it is not a surprise." In this case, there is no meeting $N$ that the students can identify as the *last possible* one. For any meeting $k$ they consider, the teacher's promise entails a non-zero probability of a meeting $k+1$ if the surprise condition would be violated at $k$. Consequently, on the evening before any meeting $k$, the credence that the quiz is at $k$ never rises to 1, because there is always a "residual" probability mass assigned to future make-up sessions. The induction cannot start because the set of possible quiz days has no maximal element in the students' epistemic state.

  **The Single Feature**

  The single feature doing the work is the **absence of a known upper bound on the quiz window**. The students know the *scheduled* term ends, but they do not know the *quiz* window ends, because the teacher has credibly committed to extending the window to preserve the truth of the announcement. This is the minimal feature required; any alternative (such as making the teacher unreliable or the students irrational) violates your constraints. If we delete this feature by stipulating, as per your deletion test, that "everyone knows the quiz falls on one of next week's five meetings," the upper bound becomes common knowledge. In that scenario, on Thursday evening, the students know Friday is the last possible meeting. Since the quiz must occur (Cond 2), their credence in a Friday quiz becomes 1. This violates the surprise condition (Cond 1), making the announcement false or unknowable, and the backward-induction base step is restored, collapsing the case back into the standard paradox.

  **Objection and Verdict**

  A proponent of the self-referential solution would object that my case merely sidesteps the paradox rather than solving it. They would argue that the original paradox arises because the announcement refers to the students' knowledge of the announcement, creating a logical loop that prevents the announcement from being a stable object of knowledge. They would claim that even in my open-ended case, the announcement is self-referential ("I will ensure you don't know...") and therefore cannot be known to be true, violating Condition 2. They would assert that my teacher's promise to extend classes is just a complex way of hiding the fact that the statement "You will not know the day" cannot be consistently known. However, my case suggests the paradox is at bottom about **known finite deadlines**. The self-referential loop only tightens into a contradiction when the timeline forces a probability of 1 on a specific day. Without a known finite deadline, the self-reference does not generate a contradiction; the students can consistently know the announcement is true while maintaining low credence for any specific day. Thus, the paradox is not primarily about self-reference, but about the incompatibility of *surprise*, *certainty of occurrence*, and *known finitude*.
