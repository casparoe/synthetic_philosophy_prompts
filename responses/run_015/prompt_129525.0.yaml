answer: |-
  # Simulation Design: "The Prometheus Protocol"

  **Target Audience:** Advanced Undergraduate Seminar (Decision Theory / Social Philosophy)
  **Class Size:** 16 Students
  **Duration:** 75 Minutes
  **Materials:** Index cards (sealed envelopes), poker chips/tokens (2 colors), whiteboard/markers, score sheets.
  **Goal:** Experiential discovery of the Unilateralist's Curse (specifically: individual rationality leading to collective over-activation, scaling risks with capability, and the failure of cheap talk).

  ---

  ## 1. Setup and Roles (5 Minutes)

  **The Scenario:**
  Tell the class: *"You are a committee of scientists managing a dangerous technology. Each round, you must decide whether to 'Contain' the technology or 'Exploit' it for personal research credit. Some of you have the clearance to Exploit; others do not. You do not know who has clearance."*

  **Roles (Private Information):**
  Hand out sealed envelopes to all 16 students. Inside is a card:
  *   **Type A (Stakeholder):** "You cannot Exploit. You must Contain. Your payoff depends on the group." (Give to 4 students in Round 1).
  *   **Type B (Agent):** "You may choose to Contain OR Exploit." (Give to 12 students in Round 1).
  *   *Note:* To simulate the "scaling capability" dynamic, the distribution changes per round (see below).

  **The Payoff Board (Visible to All):**
  Draw this on the whiteboard and leave it up.
  *   **Base Endowment:** 10 Tokens (Everyone starts with this).
  *   **If You Exploit:** +10 Private Tokens.
  *   **Collective Penalty:** -4 Tokens for **every** Exploitation (deducted from *everyone*, including the Exploiter).
  *   **If You Contain:** +0 Private Tokens.

  **The Math (For Facilitator Eyes Only):**
  *   **Cooperative Optimum:** 0 Exploitations. Everyone gets 10.
  *   **Individual Incentive:** If $N$ others Exploit:
      *   If I Exploit: $10 + 10 - 4(N+1)$.
      *   If I Contain: $10 - 4(N)$.
      *   *Difference:* Exploiting always yields 6 tokens more than Containing, regardless of $N$. (Dominant Strategy).
  *   **The Curse:** If all Agents Exploit, the penalty overwhelms the gain.

  ---

  ## 2. The Simulation Rounds (30 Minutes)

  Run three rounds. Do not explain the theory. Only read the rules.

  ### Round 1: "Low Capability" (10 Minutes)
  *   **Distribution:** 4 Agents (Can Exploit), 12 Stakeholders (Must Contain).
  *   **Communication:** None.
  *   **Action:** Agents secretly decide (write on slip: E or C). Stakeholders write "C".
  *   **Reveal:** Collect slips. Count Exploitations publicly. Calculate payoffs using the board.
  *   **Expected Outcome:** Most Agents will Exploit.
      *   If 4 Exploit: Penalty = 16.
      *   Agent Payoff: $10 + 10 - 16 = 4$.
      *   Stakeholder Payoff: $10 - 16 = -6$.
      *   *Collective Result:* Negative. (Worse than if all Contained: 10).

  ### Round 2: "High Capability + Coordination" (10 Minutes)
  *   **Distribution:** 8 Agents, 8 Stakeholders.
  *   **Communication:** Allow 3 minutes of open discussion *before* decisions. They can make promises, threats, or pleas.
  *   **Action:** Secret decision.
  *   **Expected Outcome:** Students will agree to "All Contain." However, Agents will defect, reasoning "My single action won't change much" or "I can't trust them."
      *   If 8 Exploit: Penalty = 32.
      *   Agent Payoff: $10 + 10 - 32 = -12$.
      *   *Collective Result:* Catastrophic.

  ### Round 3: "Maximum Capability" (10 Minutes)
  *   **Distribution:** 12 Agents, 4 Stakeholders.
  *   **Communication:** None.
  *   **Action:** Secret decision.
  *   **Expected Outcome:** Near-total Exploitation.
      *   If 12 Exploit: Penalty = 48.
      *   Agent Payoff: $10 + 10 - 48 = -28$.
  *   **Goal:** Demonstrate that increasing the number of capable agents drastically worsens the outcome, even if individual incentives remain unchanged.

  ---

  ## 3. Structured Debrief (40 Minutes)

  Do not lecture immediately. Ask questions to draw the theory out of their experience.

  **Phase 1: The Phenomenology of the Curse (10 mins)**
  *   *Ask Agents:* "In Round 2, you talked. Did you intend to keep your promise? If not, why? If yes, what changed your mind when you wrote the slip?"
  *   *Ask Stakeholders:* "How did it feel to watch the Agents decide your fate without your input?"
  *   *Map to Theory:* Elicit the phrase **"Preference for others to bear the cost of restraint."** (i.e., "I wanted *you* to sacrifice your 10 tokens so *I* could keep the penalty low while I took my bonus.")

  **Phase 2: The Scaling Effect (10 mins)**
  *   *Ask:* "Compare Round 1 and Round 3. Did your individual incentive to Exploit change?" (No, the math was the same). "Did the outcome change?" (Yes, drastically).
  *   *Map to Theory:* This is the **Perverse Scaling Effect**. In standard public goods games, more contributors help. In the Unilateralist's Curse, more *capable* initiators increase the probability of catastrophic activation.

  **Phase 3: The Failure of Coordination (10 mins)**
  *   *Ask:* "Why did the Round 2 agreement collapse?"
  *   *Likely Answers:* "I didn't trust them," "One defector ruins it," "My vote didn't matter."
  *   *Map to Theory:* **Absence of Credible Commitment.** Without enforcement, "cheap talk" cannot overcome the dominant strategy of individual rationality. This highlights why the Curse is structural, not just a failure of morality.

  **Phase 4: Formalizing the Curse (10 mins)**
  *   Now, introduce the term **Unilateralist's Curse**.
  *   Draw the payoff matrix on the board based on their data.
  *   Highlight:
      1.  **Asymmetric Capability:** Only some *could* trigger the outcome.
      2.  **Unilateral Power:** One Agent could degrade the outcome for Stakeholders.
      3.  **Rational Over-Activation:** Everyone acted rationally (maximizing tokens) but produced irrational collective harm.

  ---

  ## 4. Honest Prediction of Failure Modes

  **Prediction 1: The "Mathematical" Defector**
  *   *What will happen:* In Round 2, a student will calculate that if everyone else Contains, their single Exploitation only drops the group average by 4 tokens while gaining them 10. They will frame this as "efficient."
  *   *Facilitator Handling:* Do not correct them. Record the payoff. In the debrief, ask the Stakeholders how they felt about that "efficiency." Let the social friction teach the lesson.

  **Prediction 2: The "Martyr" Coalition**
  *   *What will happen:* A group of Agents may agree to all Contain. However, one will defect secretly, fearing others will defect first.
  *   *Facilitator Handling:* When revealing the count, if the agreement failed, simply ask: "Was it a failure of communication or a failure of trust?" Guide them to see that without enforcement, trust is irrational.

  **Prediction 3: Stakeholder Apathy**
  *   *What will happen:* The "Stakeholder" (Type A) students may disengage because they have no choice.
  *   *Facilitator Handling:* Assign Stakeholders the role of "Auditors." They must verify the token counts of the Agents. This keeps them invested in the outcome and heightens the tension of the "powerless observer."

  ---

  ## 5. Limitations and Facilitator Notes

  **What This Simulation Cannot Reproduce:**
  1.  **Infinite Horizon:** Real-world unilateralism often happens in repeated interactions where reputation matters. Here, it is a finite game (3 rounds), making defection more rational than in real life.
  2.  **Epistemic Uncertainty:** In Bostrom's formal curse, agents act because they *believe* the action is good (differing priors). Here, they know it is collectively bad but do it for points (incentive conflict).
  3.  **Communication Channels:** We restricted talk in Rounds 1 & 3. In reality, unilateralists often act *despite* communication, not just due to lack of it.

  **Closing Intervention (The "Lecture" Portion):**
  In the final 5 minutes, you must supply what the game cannot:
  *   *"In this game, you knew the penalty. In reality, the Unilateralist's Curse is dangerous because agents act on **uncertain** information. They think they are saving the world, not gaming the system."*
  *   *"We removed reputation. In reality, the fear of being 'the one who broke it' can sometimes restrain agents. But when the stakes are existential, reputation may not be enough."*
  *   *"The lesson is not that agents are selfish. The lesson is that when capability is distributed and penalties are collective, individual rationality is structurally misaligned with collective survival."*

  **Facilitator Checklist:**
  *   [ ] Ensure tokens are physically handed out/collected to make losses feel "real."
  *   [ ] Keep the Payoff Board visible at all times.
  *   [ ] Resist the urge to warn them in Round 2. Let the agreement collapse.
  *   [ ] Validate the "rationality" of the defectors during the debrief to avoid moralizing; keep the focus on structural incentives.
