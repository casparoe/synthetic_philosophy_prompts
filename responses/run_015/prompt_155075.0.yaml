prompt: |-
  i'm putting together prompts about hidden defaults in language and need one that pushes Hofstadter's Person Paper idea into a weird, modern bureaucratic form. Could you write a deadpan satirical memo — maybe around 600 words — from a fictional university unit called the Department of Universal Reason?

  The setup: they've issued an "Inclusivity Audit Report" claiming to have eliminated all gendered and cultural pronouns and references. The twist is that they've replaced every specific subject with an abstract "neutral agent" defined as having no body, no emotional dependencies, no cultural location, and no temporal constraints — essentially a disembodied Cartesian reasoner — and they present this abstraction as the true universal human, not as another hidden default. Use actual admin jargon (invent committees like the Subcommittee on Unmarked Discourse), stay totally straight-faced with no winking, and let the discomfort build by accumulation. The reader should gradually realize that "neutral" language hasn't removed bias, it's just buried the default deeper in the architechture of "pure reason" itself. Keep it in character as an internal memo, don't cite any real philosophers or texts, and don't slip into lecture mode — the satire should come from the document's own logic. By the end it should feel like the same kind of unease Hofstadter was going for, but applied to the fantasy that abstraction equals inclusion.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Hidden defaults in language, specifically pushing Douglas Hofstadter's "A Person Paper on Purity in Language" (which satirizes gendered language by replacing gendered terms with racialized ones to show the absurdity of "neutral" defaults) into a modern bureaucratic context.
      *   **Format:** Deadpan satirical memo (internal university document).
      *   **Sender:** Department of Universal Reason (fictional unit).
      *   **Length:** Around 600 words.
      *   **Key Concept:** An "Inclusivity Audit Report" claims to eliminate gendered/cultural pronouns by replacing specific subjects with an abstract "neutral agent" (disembodied Cartesian reasoner). This abstraction is presented as the *true* universal human, not recognized as a hidden default itself.
      *   **Tone:** Straight-faced, admin jargon, no winking, no lecture mode. Discomfort should build through accumulation.
      *   **Goal:** Show that "neutral" language hasn't removed bias but buried it deeper in the architecture of "pure reason."
      *   **Constraints:** Do not cite real philosophers/texts. Stay in character.

  2.  **Deconstruct Hofstadter's "Person Paper":**
      *   Hofstadter's essay imagines a world where race is the primary marker and gender is ignored, highlighting how "white" is treated as neutral. He uses terms like "whiteman" instead of "mankind."
      *   The prompt asks to adapt this to *abstraction*. Instead of swapping gender for race, swap *humanity* for *disembodied reason*.
      *   The "neutral agent" should sound like a bureaucratic construct that excludes anyone with a body, emotions, or context.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject). Needs to look official.
      *   **Opening:** State the purpose of the memo (release of the Audit Report). Establish the goal (total linguistic neutrality).
      *   **The Problem:** Explain why previous attempts failed (they still relied on embodied metaphors).
      *   **The Solution:** Introduce the "Neutral Agent" (NA). Define its properties (no body, no time, no culture).
      *   **Examples:** Show how language has changed. This is where the horror/absurdity creeps in. Instead of "students submit assignments," it's "Neutral Agents process data packets."
      *   **Justification:** Explain why this is better (it removes bias). The logic should be flawless but deeply alienating.
      *   **Implementation:** Next steps for faculty/staff.
      *   **Closing:** Standard sign-off.

  4.  **Developing the Jargon:**
      *   *Committee Names:* Subcommittee on Unmarked Discourse, Committee on Ontological Hygiene.
      *   *Terms:* Embodied residue, temporal anchoring, somatic markers, Universal Reasoning Entity (URE), Neutral Agent (NA).
      *   *Tone:* Passive voice, nominalizations, euphemisms for exclusion.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Memo from Dept of Universal Reason.
      *   We found that even "they/them" implies a body.
      *   So we created the Neutral Agent.
      *   The Neutral Agent doesn't eat, sleep, or feel.
      *   Please update syllabi.
      *   This is the peak of inclusion.

  6.  **Drafting - Iteration 2 (Fleshing out the text & checking word count):**
      *   Need to make sure the "Cartesian reasoner" aspect is clear without naming Descartes.
      *   Need to ensure the discomfort builds. Start normal, get weirder.
      *   Avoid explicit satire markers (e.g., don't say "this is crazy"). Just state it as policy.

  7.  **Writing the Content (incorporating constraints):**
      *   *Header:* TO: All Faculty / FROM: Dept of Universal Reason / SUB: Inclusivity Audit Phase IV.
      *   *Intro:* Following the mandate for unmarked discourse...
      *   *The Shift:* Previous iterations retained "somatic residue." Even "person" implies flesh.
      *   *The New Standard:* The "Reasoning Unit."
      *   *Examples:* "The student" becomes "The cognitive locus." "Feeling frustrated" becomes "Experiencing data friction."
      *   *Rationale:* Bodies introduce bias. Time introduces bias.
      *   *Conclusion:* Compliance required by next semester.

  8.  **Refining and Polishing (Focusing on the "Hidden Default"):**
      *   Make sure the "Neutral Agent" sounds like a specific *kind* of being (white, male, disembodied, privileged) without saying so. It's the "view from nowhere."
      *   Ensure the word count is close to 600.
      *   Check tone: Is it dry enough? Yes.
      *   Check Hofstadter vibe: Is it showing how "universal" is actually "specific"? Yes, by making the universal so abstract it's inhuman.

  9.  **Self-Correction during drafting:**
      *   *Critique:* Is it too obvious?
      *   *Fix:* Dial back the explicit criticism. Let the policy speak for itself. Instead of saying "this excludes people," say "this removes somatic distractions."
      *   *Critique:* Is it too short?
      *   *Fix:* Expand on the specific linguistic changes required in syllabi and forms.
      *   *Critique:* Is it too long?
      *   *Fix:* Trim redundant explanations.

  10. **Final Review against constraints:**
      *   600 words? (Aim for tight paragraphs).
      *   No real philosophers? (Check).
      *   Deadpan? (Check).
      *   Internal memo format? (Check).

