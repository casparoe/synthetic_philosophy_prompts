      *   Time per vote: 3 minutes (Distribute/Collect/Count). 30 mins total.
      *   Intro: 10 mins.
      *   Debrief: 35 mins.
      *   This works.

      *(Final check on "No Screens")*: I cannot show slides. I must use the Whiteboard or physical cards for the "Public Signal." I will use a large card drawn from a separate "Public Bag."

