answer: |-
  Here is a complete design for the seminar, optimized for your constraints, time limits, and pedagogical goals.

  # Activity Title: The Blind Jury

  **Time:** 75 Minutes
  **Participants:** 24 Students (The Jury)
  **Instructor:** The Clerk (Facilitator, Record-Keeper, State-Generator)
  **Materials:**
  *   **Whiteboard:** Divided into a grid for tallying (Round, True State, Majority Vote, Win/Loss).
  *   **Index Cards:** 300+ total. Pre-written with "A" or "B".
  *   **Opaque Bags:** 4 distinct bags (labeled 1, 2, 3, 4 on the bottom only).
  *   **Playing Cards:** 4 Kings (to designate "Senior Members" in Round 4).
  *   **Stakes:** A bowl of chocolates. One per student if the Jury wins the round (Majority = Truth).

  ---

  ## Part 1: Preparation (Before Class)

  You need to pre-sort the index cards into envelopes or piles to save time. Do not tell students about the contents.

  *   **Bag 1 (Baseline):** 67% match the State, 33% oppose. (e.g., if State is A, 16 cards say A, 8 say B).
  *   **Bag 2 (Correlated):** Same as Bag 1, *plus* a "Public Card" you will draw from a separate "Public Deck" before they vote. The Public Deck is 75% accurate.
  *   **Bag 3 (Inverted):** 33% match the State, 67% oppose. (e.g., if State is A, 8 cards say A, 16 say B).
  *   **Bag 4 (Heterogeneous):**
      *   4 "Senior" cards: 50/50 accuracy (4 say A, 4 say B in the pile, random draw).
      *   20 "Junior" cards: 67% accuracy (like Bag 1).
  *   **State Sequence:** Pre-roll a sequence of 10 States (A or B) so you don't waste time flipping coins live. Keep this hidden.

  ---

  ## Part 2: The Session Script (0–40 Minutes)

  **0:00–0:10: Setup & Rules**
  *   **Say:** "We are a committee deciding between two options, A and B. One is objectively better (the 'True State'). I know which one; you do not. Your goal is to vote for the True State. If the Majority of you votes for the True State, everyone gets chocolate. If the Majority is wrong, no chocolate."
  *   **Say:** "In each round, you will receive a piece of evidence (an index card). It will say A or B. This evidence is correlated with the Truth, but imperfectly. You must vote secretly on this slip of paper. I will collect them, count, and record the result."
  *   **Constraint:** "Do not talk to each other. Do not show your card. Vote for what your card indicates, not what you guess the truth might be." (This instruction is crucial for the Inverted round).
  *   **Seating:** Arrange chairs in a semi-circle. Hand out a voting slip and pen to everyone.

  **0:10–0:25: Condition 1 (Baseline)**
  *   **Rounds 1–3.**
  *   **Mechanism:** Pass Bag 1. Students draw one card, look, return to bag (or keep, doesn't matter). Vote.
  *   **Tally:** Count A vs B. Compare to True State. Mark Win/Loss on board.
  *   **Expected Result:** High accuracy. With $N=24$ and $p=0.67$, the probability of majority error is $<5\%$. You should see 3 Wins.

  **0:25–0:30: Condition 2 (Common Cause)**
  *   **Rounds 4–6.**
  *   **Mechanism:** Before they draw from Bag 2, draw a "Public Card" from the Public Deck. Announce it loudly: "The Public Indicator is... A." Write it on the board. *Then* they draw private cards.
  *   **Why:** This mimics reading the same expert memo or CV. It introduces a correlated error. If the Public Card is wrong (25% chance), a large chunk of the room starts biased.
  *   **Expected Result:** Slightly lower accuracy than Baseline. If the Public Card is wrong in a round, the Jury might lose even if private signals were decent.

  **0:30–0:35: Condition 3 (Sequential/Herding)**
  *   **Rounds 7–8.**
  *   **Mechanism:** Use Bag 1 (Baseline accuracy). Select the front row (4 students). They must stand and announce their vote *aloud* before anyone else writes anything. The rest vote secretly.
  *   **Why:** Mimics "show of hands" or senior faculty speaking first.
  *   **Expected Result:** If the first 4 are wrong (prob $\approx 0.33^4$ is low, but possible), the rest may second-guess their private signals. *Note: Since you instructed them to "vote for what the card indicates," herding might be suppressed.*
  *   **Adjustment:** To ensure the effect hits, tell the rest: "You may consider the earlier votes as additional evidence." This invites the cascade.

  **0:35–0:40: Condition 4 (Heterogeneous Reliability)**
  *   **Round 9.**
  *   **Mechanism:** Hand 4 Kings to 4 random students. They draw from the "Senior" pile (50% accuracy). They are instructed: "You are the Senior Committee. Speak first, state your vote with confidence." The rest (Juniors) draw from the "Junior" pile (67% accuracy) and vote second.
  *   **Why:** Mimics weighting confident/ senior voices equally to knowledgeable ones.
  *   **Expected Result:** The 4 noise-voters dilute the 20 signal-voters. Accuracy drops compared to Round 1.

  **0:40–0:45: Condition 5 (Inverted Competence)**
  *   **Round 10.**
  *   **Mechanism:** Pass Bag 3 (Inverted). Remind them: "Vote for what your card indicates."
  *   **Why:** Mimics a committee using a metric that is systematically biased (e.g., judging research quality by journal prestige in a field where that correlates negatively with innovation).
  *   **Expected Result:** The Majority will likely be *Wrong*.
  *   **Risk:** Smart students may realize the bias and flip. If they do, they Win. *Accept this.* It proves they detected the systematic error. If they follow instructions, they Lose.

  ---

  ## Part 3: The Debrief (45–75 Minutes)

  Do not start with the theorem. Start with the board.

  **1. The Data (5 mins)**
  *   Point to the Win/Loss column.
  *   **Ask:** "Where did we succeed? Where did we fail? Round 10 looked different—why?"
  *   **Reveal:** "In Rounds 1–9, your cards were more likely to be right than wrong. In Round 10, they were more likely to be wrong. In Round 2, you all saw the same Public Card. In Round 7, you heard each other."

  **2. Mapping to the Theorem (15 mins)**
  *   **Now** introduce the Condorcet Jury Theorem. Write the two assumptions on the board:
      1.  **Competence:** $p > 0.5$ (Each voter is better than a coin flip).
      2.  **Independence:** Errors are not correlated.
  *   **Map the Rounds:**
      *   **Round 1:** Satisfied both. Result: Truth.
      *   **Round 10:** Violated Competence ($p < 0.5$). Result: Error. *Lesson: Garbage in, garbage out. Size amplifies error if $p < 0.5$.*
      *   **Round 2 & 7:** Violated Independence. *Lesson: Discussion and shared evidence create common errors. If the 'Public Card' was wrong, we all went wrong together.*
      *   **Round 9:** Violated Equal Weighting (implicit assumption). *Lesson: Not all voters are equal.*

  **3. The Math of Weighting (10 mins)**
  *   **Address the Log-Odds:** You asked about this. It is settled math (Nitzan & Paroush, 1982).
  *   **Say:** "You might think we should just count heads. But mathematically, the optimal weight for a voter is proportional to the log-odds of their accuracy: $\log(\frac{p}{1-p})$."
  *   **Explain:** "In Round 9, the Seniors had $p=0.5$. The log-odds of 0.5 is 0. Mathematically, they should have had *zero* weight. By letting them speak first and loudly, we gave them positive weight, which actively dragged down the group's accuracy."
  *   **Takeaway:** "One-person-one-vote is not the epistemically optimal rule if competence varies."

  **4. Contested vs. Settled (15 mins)**
  *   This is the critical PPE/Philosophy payoff. Distinguish clearly:

  | Claim | Status | Nuance / Contested Ground |
  | :--- | :--- | :--- |
  | **CJT Math** | **Settled** | Given the assumptions, the probability of majority correctness $\to 1$ as $N \to \infty$. |
  | **Inversion** | **Settled** | If $p < 0.5$, majority correctness $\to 0$ as $N \to \infty$. |
  | **Deliberation** | **Contested** | **CJT assumes no talk.** Real committees *must* talk to pool information (e.g., "I saw this candidate teach"). Some argue deliberation improves $p$ (Sunstein); others argue it creates correlation/cascades that break Independence (List & Pettit). The theorem cannot settle this; it only warns of the risk. |
  | **Normative Use** | **Contested** | Is CJT a **defense** of democracy (Estlund) or a **critique** (showing how easily it fails)? Does it justify Epistocracy (weighting votes by knowledge)? |
  | **Correlation** | **Settled (Math)** / **Contested (Fix)** | Math: Correlation reduces the "effective $N$". Fix: How do we de-correlate? Secret ballots? Diverse backgrounds? There is no consensus on the institutional fix. |

  **5. Closing (5 mins)**
  *   **Say:** "The theorem is not a promise that crowds are wise. It is a warning that crowds are only wise under very fragile conditions: when they are individually competent and when they think alone. Most of what we do in committees—discussing, deferring to seniors, reading the same reports—threatens those conditions."
  *   **Final Task:** "For next week: Propose one procedural change to our hiring committee that would protect Independence without sacrificing the benefits of information pooling."

  ---

  ## Part 4: Troubleshooting & Failure Modes

  **1. Small-Sample Noise**
  *   **Risk:** In Round 1 (Baseline), you might get unlucky and lose. In Round 10 (Inverted), you might get lucky and win.
  *   **Fix:** This is why you run 2-3 trials per condition. If Round 10 yields a Win, ask: "Did anyone flip their vote?" If yes, acknowledge: "You corrected the systematic bias. That is the only way to save a $p<0.5$ jury." If no, and you still won, attribute it to variance and point to the *aggregate* win rate across the 3 trials.

  **2. The "Inverted" Leak**
  *   **Risk:** Students realize "I'm usually wrong" and vote the opposite.
  *   **Fix:** Your instruction "Vote for what the card indicates" is the firewall. If they break it, they have essentially "fixed" the competence parameter back to $>0.5$. Treat this as a success of *individual rationality* but a failure of the *experimental condition*. Note it on the board: "Subjects detected bias."

  **3. Cheating/Peeking**
  *   **Risk:** Students look at neighbors' cards.
  *   **Fix:** This actually *helps* your pedagogical goal (it creates correlation). If you catch it, note it: "That just broke Independence. We might lose this round because of that."

  **4. The "Senior" Role-Play**
  *   **Risk:** Students assigned to be "Senior" in Round 9 laugh or refuse to be confident.
  *   **Fix:** Pick the most outgoing students for the Kings. Briefly pull them aside before the round: "I need you to really sell it. Say 'I am certain it is A'."

  **5. Time Overrun**
  *   **Risk:** Tallying takes too long.
  *   **Fix:** Appoint 2 "Tellers" (students) to count votes while you record the True State. Do not count aloud; just write the number on the board.

  ---

  ## Part 5: What This Activity Cannot Do (Be Frank)

  1.  **Asymptotics:** You have $N=24$, not $\infty$. The convergence to 100% accuracy in Round 1 will not be perfect. Acknowledge this: "The theorem is about large numbers. We are a small committee. The effect is probabilistic, not deterministic."
  2.  **Good Deliberation:** Your setup models deliberation as *correlation* (Round 2 & 7). It does not model deliberation as *information pooling* (where I tell you something you didn't know, raising your $p$). The CJT framework struggles to model positive deliberation. You must supply this in the debrief: "The theorem assumes fixed $p$. Real discussion might raise $p$, but it also risks correlation. We don't know which effect dominates."
  3.  **The "Why" of Correlation:** The game shows *that* correlation hurts. It doesn't show *how* to fix it institutionally (e.g., structured debate vs. open debate). That is the open research question for them.

  ## Summary of Contested Inferences

  *   **Settled:** The math of the theorem. The flip at $p=0.5$. The negative impact of correlation on effective sample size. The log-odds weighting for optimal accuracy.
  *   **Contested:**
      *   **Deliberation:** Is it net positive or negative? (CJT implies negative/neutral; Democratic theory implies positive).
      *   **Weighting:** Should we actually implement weighted voting based on competence? (Epistocracy vs. Equality).
      *   **Application:** Does CJT justify democracy? (Only if we assume $p>0.5$ and Independence, which is empirically debated).

  This design ensures the *numbers on the board* drive the conclusion, not your lecture. The chocolate provides just enough skin in the game to make the loss in Round 10 sting.
