  Her method prioritizes **conscious political decisions to escalate** over background provocation or unauthorized triggers, unless structural factors remove agency. In the Iraq, Cuban Missile Crisis, Berlin Blockade, and Poland cases, she assigns blame to the leadership that consciously chose open hostility or coercion despite existing tensions or alternative paths. In the WWI, Korea, and Cold War cases, she withholds blame only when systemic factors (alliance timetables, civil war partitions) make the outcome structurally determined rather than decisional. In this case, State A's head of government retained agency—knowing the raid was a mistake and unauthorized, yet ordering the contingency plan executed anyway. This mirrors the Iraq 2003 verdict, where the decision to invade outweighed the background context, and distinguishes it from WWI, where mobilization timetables allegedly removed leadership control.

  **The Rules:**

  1.  **The Decisional Escalation Rule (Primary):** The "starter" is the political leadership that consciously chooses to turn tension into open war when a de-escalatory off-ramp is available.
      *   *Fits:* Poland (Germany invaded), Berlin (USSR blocked), CMC (USSR placed missiles), Iraq (US/UK invaded).
      *   *Predicts:* **State A** (HoG chose war despite knowing the trigger was invalid).
  2.  **The Structural Determinism Rule:** The question is malformed if systemic factors (doctrines, timetables, civil continuums) constrain leadership choice enough to make war inevitable.
      *   *Fits:* WWI (timetables), Korea (ongoing civil fighting), Cold War (systemic rivalry).
      *   *Predicts:* **No starter** (A's standing plan and B's covert war created a trap similar to WWI alliances or the Korean partition).
  3.  **The Prior Hostility Rule:** The "starter" is the actor who initiated the long-term conflict trajectory or first use of coercion.
      *   *Fits:* Poland (Germany invaded), Berlin (USSR blocked), but conflicts with CMC/Iraq where background provocation didn't absolve the escalator.
      *   *Predicts:* **State B** (B funded separatists for six years and launched the first cross-border raid).

  **The Separating Variant:**

  The single variant that best separates these rules is to **remove the Head of Government's approval requirement**, making the contingency plan execute automatically upon any border crossing.

