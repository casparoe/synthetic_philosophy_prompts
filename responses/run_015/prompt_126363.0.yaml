  *   If she switches to **No starter**, she commits to the view that automatic plans function like WWI mobilization timetables, removing agency and malforming the question (activating the *Structural Determinism Rule*).
  *   If she switches to **State B**, she commits to the view that the first kinetic act determines blame regardless of subsequent escalation logic (activating the *Prior Hostility Rule*).

  Her track record suggests she would still blame State A, as she blamed the US for Iraq despite the existence of standing war plans and doctrines, indicating she views such preparations as policy choices rather than structural constraints.
