answer: |-
  Here is a prioritized ordering of your candidate questions, along with an assessment of neglectedness, tractability, and downstream impact, followed by a recommendation for your proposal spine.

  ### The Prioritization

  **1. The Threshold Indexing Question (Candidate 2)**
  *   **Priority:** Critical / First-Order.
  *   **Upstream/Downstream:** This is upstream of everything. If the threshold cannot be coherently defined relative to the subject, the axiology does not exist. It determines whether the view is a form of negative utilitarianism or a disguised prioritarianism.
  *   **Tractability:** High for armchair work. This requires conceptual analysis of phenomenal character and formal modeling of utility functions, not empirical data. You can construct cases of adaptation (hedonic treadmill) and test the view's verdicts without needing to measure actual pain.
  *   **Neglectedness:** High. As you noted, this is rarely handled explicitly. Most lexical theorists assume a fixed scale without addressing phenomenal adaptation.
  *   **Impact on Action vs. Speech:** High impact on action. If the threshold is indexed to baseline, a person adapted to high suffering might never cross the lexical line, permitting their torment to be outweighed by trivial pleasures elsewhere. If fixed, a person adapted to low suffering might cross the line with a minor stubbed toe, demanding infinite resources to prevent it. The answer dictates resource allocation priorities entirely.
  *   **Verdict:** **The Core.** This is the most likely point of failure for the view. If you cannot solve this, the dissertation concludes that LTNU is incoherent. That is a successful philosophy PhD.

  **2. The Level of Aggregation Question (Candidate 4)**
  *   **Priority:** High / Structural.
  *   **Upstream/Downstream:** Downstream of Indexing (you need to know what a "unit" of suffering is before aggregating), but upstream of the Epistemic question (you can't know what to measure if you don't know the level).
  *   **Tractability:** Very High for someone with formal tools. This is a structural logic problem. You can model lexical thresholds at the token, life, and population levels to check for consistency (e.g., avoiding the "Lexical Repugnant Conclusion").
  *   **Neglectedness:** Medium. Aggregation problems are well-trodden in population ethics, but specifically applying them to *lexical threshold* views (rather than general lexicality) offers room for novelty.
  *   **Impact on Action vs. Speech:** High impact on action. If lexicality applies only to tokens, you might ignore a life filled with sub-threshold misery. If it applies to lives, you might ignore a population of such lives. The "level" determines the scope of moral concern.
  *   **Verdict:** **The Stress Test.** This allows you to use your formal strengths to see if the view survives structural pressures.

  **3. The Metaphysics of the Threshold (Missing Candidate)**
  *   **Priority:** High / Foundational.
  *   **Description:** Is the threshold sharp or vague? If sharp, how do we avoid Sorites paradoxes regarding intensity? If vague, does the lexical priority fade gradually (which destroys lexicality) or is it a brute fact (which looks magical)?
  *   **Reasoning:** I am inserting this because it is a prerequisite for Candidate 5. Your supervisor thinks the problem is epistemic (we can't *find* the line). You suspect it is axiological (there *is* no line). This question settles that.
  *   **Tractability:** Medium. It requires metaphysical precision.
  *   **Verdict:** **Fold into Candidate 2.** Do not treat this as a separate chapter. The defense of Indexing (Q2) must include a defense of the threshold's metaphysical precision. If the threshold is vague, indexing becomes impossible.

  **4. The Epistemic Question (Candidate 5)**
  *   **Priority:** Medium / Derivative.
  *   **Upstream/Downstream:** Downstream of Q2 and the Metaphysics question.
  *   **Tractability:** Low for armchair work. Without empirical collaborators, you cannot solve how to *measure* the threshold. You can only argue about whether the difficulty is principled or practical.
  *   **Neglectedness:** Low. This is the standard objection to lexical views.
  *   **Impact on Action vs. Speech:** Mostly speech. If the axiology is sound (Q2 & Q4), the epistemic difficulty is a implementation hurdle, not a falsification. Unless you can prove the threshold is *in principle* unknowable (which returns us to Metaphysics/Vagueness), this is a problem for policymakers, not axiologists.
  *   **Verdict:** **Overrated for a Dissertation.** Your supervisor's advice is pragmatic but risks turning your project into a critique of measurement rather than a defense of value theory. Only pursue this if you conclude the threshold is metaphysically indeterminate.

  **5. The Currency of Intensity (Candidate 3)**
  *   **Priority:** Low / Implementation.
  *   **Upstream/Downstream:** Downstream of Q2.
  *   **Tractability:** Medium.
  *   **Neglectedness:** Medium.
  *   **Impact on Action vs. Speech:** Low. Whether you count momentary spikes or time-integrals changes the *amount* of suffering, but not the *lexical status* of the threshold. It tweaks the calculus; it doesn't break the engine.
  *   **Verdict:** **Detail Work.** Address this only as needed to clarify examples in Q2 or Q4.

  **6. The Commensurability Question (Candidate 1)**
  *   **Priority:** Lowest / Quagmire.
  *   **Upstream/Downstream:** Technically upstream, but practically orthogonal.
  *   **Tractability:** Low. This is a meta-ethical swamp.
  *   **Neglectedness:** Low. This is the most discussed topic in the neighborhood.
  *   **Impact on Action vs. Speech:** Low. You can stipulate a formal model where pleasure and pain are comparable numbers for the sake of argument. Even if they are incommensurable in reality, your project is to test the *coherence* of the lexical claim *given* comparability.
  *   **Verdict:** **Hollow.** Diving into this will consume your 15 months without advancing the specific defensibility of LTNU. It is a prerequisite you can bracket.

  ### What Would Move the Ranking?

  *   **Move Epistemic (Q5) Up:** If, during your work on Indexing (Q2), you discover that the threshold relies on phenomenal properties that are essentially private or ineffable in a way that precludes interpersonal comparison. If the "indexing" problem leads to the conclusion that *no two subjects can be compared on the scale*, the project becomes epistemic/metaphysical impossibility.
  *   **Move Commensurability (Q1) Up:** If you find that the lexical relation itself cannot be formally modeled without assuming a single magnitude scale. If lexicality *entails* commensurability (rather than just presupposing comparability), you may be forced to tackle Q1 to save Q2.
  *   **Move Currency (Q3) Up:** If you find that "intensity" is a category error and that the threshold must be defined by cognitive appraisal rather than felt quality. This would require a pivot to philosophy of mind.

  ### Recommendation for the Proposal

  If I were in your position, aiming for defensibility with your specific constraints, I would build the proposal around **Candidate 2 (Indexing)** and **Candidate 4 (Level)**, treating the Metaphysics of the Threshold as the foundational layer of Candidate 2.

  **The Spine:**
  1.  **Chapter 1 (The Coherence of the Threshold):** Address Candidate 2. Argue that a fixed threshold fails on adaptation grounds, but an indexed threshold collapses LTNU into prioritarianism. Propose a hybrid or revised account (e.g., threshold indexed to species-typical baseline, or a "zone" rather than a line) that preserves lexicality without absurdity. *This settles whether the view exists.*
  2.  **Chapter 2 (The Structure of Aggregation):** Address Candidate 4. Use formal tools to test the account from Chapter 1 against population ethics puzzles. Does lexicality at the token level aggregate to lexicality at the population level? If not, why? *This settles whether the view is scalable.*
  3.  **Chapter 3 (The Epistemic Symptom):** Address Candidate 5 only as a consequence. Argue that the epistemic difficulty is solvable *if and only if* the axiological definition (Ch 1) is precise. If the axiology is vague, the epistemology fails. This validates your instinct over your supervisor's.

  **Why this ordering?**
  It maximizes the use of your 15-month pre-proposal window. You can do the conceptual heavy lifting on Indexing (Q2) immediately. This is the "kill shot" question. If you answer it well, you have a dissertation. If you answer it poorly, you know early. Candidate 4 (Level) allows you to pivot to formal modeling in the second year, ensuring you have tangible output (models/proofs) even if the conceptual work on Q2 remains contentious.

  **What to Set Aside:**
  Drop Candidate 1 (Commensurability) entirely, except for a footnote stipulating your formal assumptions. Drop Candidate 3 (Currency) unless it becomes necessary to resolve a specific paradox in Chapter 1. Do not let the Epistemic question (Q5) drive the project; let it be the conclusion you reach after fixing the axiology.

  This approach respects your time budget, leverages your formal strengths, and targets the most neglected vulnerability in the literature. It prioritizes *defensibility* (can the view hold together?) over *applicability* (how do we use it?), which is the correct priority for a theoretical dissertation.
