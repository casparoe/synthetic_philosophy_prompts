      *   *Let's go back to the User's "Trait Card" idea but fix the payoff.*
          *   **Game:** "The Adaptationist's Dilemma."
          *   **Setup:** Trait Cards. Some are "Adaptive," some are "Spandrels" (students don't know which).
          *   **Round 1:** Write an adaptive story. Score = Quality of Story.
          *   **Round 2:** Reveal "Constraint Info." If you stick with Adaptation, you must argue *against* the constraint. If you switch to Spandrel, you get no points for that card.
          *   **Payoff:** Points are awarded for *completed narratives*, not truth.
          *   **Why:** This forces them to feel the friction of maintaining an adaptationist view in the face of structural data.

      *   *Wait, the prompt asks for the rational move to be to ALWAYS claim selective explanation.*
          *   Okay, let's make the scoring explicitly biased.
          *   **Game:** **"The Function Market."**
          *   **Mechanic:** You hold Trait Cards. You must sell them as "Adaptations."
          *   **Scoring:** 10 points for a coherent story. 0 points for "It's a byproduct."
          *   **The Twist:** In Round 2, you get evidence that suggests it *might* be a byproduct. But if you change your claim to "Byproduct," you lose the 10 points. If you keep it as "Adaptation," you keep the 10 points, provided you can weave a "counter-constraint" story.
          *   **Result:** Students will rationalize away the constraint data to keep their points. This *perfectly* mirrors the critique: the program is unfalsifiable because it incentivizes explaining away counter-evidence.

      *   *Decision:* I will develop **"The Function Market"** (renamed to **"The Adaptationist's Grant"** for clarity). It focuses on the *incentive structure* of the research program.

  3.  **Fleshing out the Details:**

      *   **Payoff Scheme:** Needs to be mathematically clear.
          *   Base points for submitting a story.
          *   Bonus points for "Specific Selective Pressure."
          *   Penalty for "Non-Adaptive Explanation" (i.e., 0 points).
          *   Round 2: "New Evidence" cards. If evidence suggests constraint, adapting the story costs effort but keeps points. Accepting constraint loses points.
          *   *Dominant Strategy:* Always argue for adaptation, even if evidence is weak.

      *   **Timeline:** 80 mins.
          *   0-10: Setup & Rules.
          *   10-30: Round 1 (Story Generation).
          *   30-45: Round 2 (Constraint Data & Revision).
          *   45-60: Scoring & Reveal.
          *   60-80: Debrief.

      *   **Materials:** Index cards (Traits), Envelopes (Constraint Data), Score sheets.

      *   **Debrief:** Map game mechanics to Gould-Lewontin concepts.
          *   Scoring rule = Adaptationist Program's success criterion.
          *   Constraint Cards = Developmental/Phylogenetic reality.
          *   Rational choice to ignore constraints = The "Unfalsifiable" charge.

      *   **Predictable Failures:**
          *   Bio majors getting bogged down in accuracy.
          *   Phil majors treating it as pure fiction.
          *   Groups realizing the rig too early.
          *   Debrief turning into "Science is broken."

      *   **Correctives:** Must emphasize that Gould wasn't anti-selection, just anti-*pan*-selectionism. Testing is possible (comparative method), but requires shifting the question from "What is it for?" to "How did it arise?"

  4.  **Refining the Payoff (The "Math"):**
