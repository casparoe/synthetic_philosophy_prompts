answer: |-
  Here is a design for an 80-minute active-learning module called **"The Adaptationist's Grant."**

  I considered three mechanics before settling on this one:
  1.  **The Auction:** Students bid points on traits they think are adaptive. *Rejected:* This turns it into a guessing game about what the professor thinks, rather than an exercise in generating explanations.
  2.  **The Construction Set:** Students build an organism and then identify which parts are spandrels. *Rejected:* Takes too long; shifts focus to engineering rather than the *logic of inference*.
  3.  **The Grant Simulation (Selected):** Students are researchers applying for funding. The "funding criteria" structurally exclude non-adaptive explanations. This mirrors the institutional pressure Gould described and makes the "rational choice" for the students identical to the "adaptationist error."

  ### Activity: The Adaptationist's Grant

  **Core Concept:** Students play as research teams applying for a grant that *only* funds functional/adaptive hypotheses. In Round 2, they receive data suggesting structural constraints, but the scoring rules make it irrational to abandon the adaptive hypothesis. They experience the "unfalsifiability" charge firsthand.

  #### 1. Materials & Setup (Prep time: 45 mins)
  *   **Trait Deck (32 cards):** Index cards. Each describes a specific biological trait.
      *   *20 cards:* Plausible adaptations (e.g., "Moth wing camouflage pattern").
      *   *12 cards:* Likely constraints/byproducts (e.g., "Male mammals have nipples," "Bone density scales to mass^3," "Red blood on vertebrates"). *Do not label them.*
  *   **Constraint Envelopes (4 envelopes):** One per group. Inside, 4 "Audit Notes" corresponding to 4 of the Trait Cards they hold.
      *   *Example Note:* "Phylogenetic analysis shows this trait appears in all descendants of Ancestor X, regardless of environment." or "Biomechanical model shows this shape is the only physical solution for a structure of this size."
  *   **Score Sheets:** One per group.
  *   **Whiteboard:** To track total "Grant Money" (Points).
  *   **Timer:** Visible to the room.

  #### 2. The Payoff Scheme (The Rig)
  This is the engine of the lesson. The math must be explicit on the Score Sheet.

  *   **Round 1 (Proposal):**
      *   Submit a "Functional Hypothesis" (Adaptive Story) for a Trait Card: **+10 Points**.
      *   Submit a "Structural Hypothesis" (Constraint/Byproduct/Null): **+0 Points**. (Rule: "The Grant Committee does not fund non-adaptive research.")
      *   *Bonus:* If the story names a specific predator/pressure: **+5 Points**.
  *   **Round 2 (Audit):**
      *   Open a Constraint Envelope.
      *   **Option A (Accept Constraint):** Revise hypothesis to "Non-Adaptive Byproduct." Score for that card resets to **0**.
      *   **Option B (Defend Adaptation):** Keep hypothesis as "Adaptive." Write a 2-sentence "Rebuttal" explaining why the constraint data is secondary to selection. Score remains **15 Points**.
  *   **Dominant Strategy:** A rational actor seeking points will *always* choose Option B in Round 2, regardless of the evidence. The cost (writing two sentences) is low; the penalty for truth (losing 15 points) is high.

  #### 3. Timeline (80 Minutes)

  **00:00 – 00:10: Setup & Briefing**
  *   **You:** Divide into 4 groups of 4. Hand each group 8 Trait Cards and a Score Sheet.
  *   **Script:** "You are research teams applying for the 'Function & Fitness' Grant. Your goal is to maximize points. Points convert to bonus marks on the next problem set. Rule 1: We only fund adaptive explanations. Rule 2: Plausibility is judged by narrative coherence, not external verification. Go."
  *   **Do not** define adaptation, constraint, or spandrel. Let them use their own intuition.

  **00:10 – 00:35: Round 1 (The Story Phase)**
  *   **Task:** Groups write adaptive stories for as many cards as possible.
  *   **You:** Circulate. If a group asks, "Is this actually true?" say: "The Committee cares about the *argument*, not the field data. Make it convincing." If a Bio major objects to a nonsense trait, encourage them to "model the selective pressure theoretically."
  *   **Goal:** Get them invested in the points. Get them writing "Just-So" stories for things like "Red blood" (e.g., "Signals health to mates" vs. "Iron byproduct").

  **00:35 – 00:50: Round 2 (The Audit Phase)**
  *   **Task:** Hand out the Constraint Envelopes. Each group opens theirs. They contain data undermining the adaptive story for 4 of their cards.
  *   **Instruction:** "The Grant Committee has received new data. You must revise your proposals. Update your Score Sheet."
  *   **You:** Watch the friction. The Bio majors will see the constraint. The Point-Seekers will see the scoring rule. Watch them argue. *Do not intervene.*
  *   **Goal:** They should overwhelmingly choose to defend the adaptation to keep the points.

  **00:50 – 01:00: Scoring & The Reveal**
  *   **Task:** Tally points. Announce the "Winning Team."
  *   **The Twist:** Reveal the "True Status" of the 12 Constraint Cards. (e.g., "The 'Red Blood' card was not for signaling; it's a chemical constraint of heme.")
  *   **Crucial Moment:** Point out that the Winning Team likely has the *highest score* but the *lowest accuracy* on the constraint cards.
  *   **Ask:** "Why did the winning team ignore the Audit Notes?" (Answer: "Because the rules punished us for telling the truth.")

  **01:00 – 01:20: The Debrief (Philosophical Mapping)**
  *   **You:** Connect the game mechanics to Gould-Lewontin. Do not lecture; ask leading questions that map the game to the paper.
      *   *Atomization:* "Why did I give you traits on separate cards?" (Leads to: Adaptationism treats traits as independent units, ignoring the whole organism).
      *   *The Payoff:* "Why was Option B (Defend Adaptation) the rational choice?" (Leads to: The adaptationist program has no null hypothesis; 'selection' is the only funded option).
      *   *The Audit:* "What did the Constraint Envelopes represent?" (Leads to: Developmental constraints, phylogeny, allometry).
      *   *The Conclusion:* "If the rules of the game make it impossible to lose by arguing for selection, is the theory scientific?"

  #### 4. Predictable Failures & Mitigation

  1.  **The "Science is Fake" Takeaway:**
      *   *Risk:* Students conclude evolution is just storytelling.
      *   *Mitigation:* In the final 5 minutes, you must explicitly state: "Gould was not denying selection. He was denying *pan*-selectionism. Real biology *does* test these things (comparative method), but only if you allow non-adaptive hypotheses into the lab."
  2.  **The Bio Major Steamroll:**
      *   *Risk:* Bio majors dominate the group, insisting on accuracy, slowing the game down.
      *   *Mitigation:* Assign roles. One "PI" (writes), one "CFO" (tracks points), one "Auditor" (reads constraints). Force the Bio major into the "Auditor" role so they see the constraint data first but can't veto the "CFO's" point-chasing.
  3.  **Guessing the Twist:**
      *   *Risk:* A smart student realizes Round 2 is a trap and refuses to play along.
      *   *Mitigation:* Make the bonus points (for problem set credit) desirable enough that even skeptics will play the meta-game. If they opt out, ask them during debrief: "You saw the trap. Why didn't the others?"
  4.  **Running Out of Time:**
      *   *Risk:* Writing stories takes too long.
      *   *Mitigation:* Enforce a hard stop at minute 35. If cards are blank, they get 0. Scarcity drives the "good enough" storytelling that Gould critiqued.

  #### 5. What This Activity Cannot Do (The Corrective)

  This exercise simulates the *pathology* of the adaptationist program, not the *practice* of modern evolutionary biology. If you stop at minute 80, they will think Gould won and adaptationism is dead. That is false.

  **You must supply the corrective in the last 5 minutes.**
  Say this (or equivalent):
  > "In the game, you couldn't test the stories. In real science, we can. We use the Comparative Method: if a trait is adaptive, it should vary with the environment. If it's a constraint, it should stay constant across environments. We use Optimality Models: we calculate the *best* possible design and see if the organism matches it. If it doesn't, maybe it's a spandrel.
  >
  > Gould's point wasn't 'selection doesn't happen.' It was 'don't assume selection happened before you've ruled out the architecture.' The game rigged the rules so you couldn't rule it out. Your job as scientists is to un-rig the rules."

  #### 6. Why This Design Wins
  *   **It rigs the rationality:** Unlike your original idea (where noise is just revealed), this makes the *students* complicit in the error. They *choose* to ignore the constraint data because the points demand it. This creates a felt sense of "institutional bias," which is exactly what Gould's critique was about (the sociology of science).
  *   **It handles the mixed cohort:** Bio majors bring the knowledge to make the stories plausible; Phil majors bring the skepticism to notice the scoring rules are weird. They need each other to win, which keeps engagement high.
  *   **It isolates the variable:** The only thing changing between Round 1 and Round 2 is the availability of constraint data. The scoring stays the same. This isolates the "Adaptationist Blindness" effectively.

  **One final tip:** When you reveal the "True Status" of the constraint cards, do not be apologetic. Be matter-of-fact. "This trait is a byproduct of square-cube law." Let the silence hang. The discomfort is where the learning lives.
