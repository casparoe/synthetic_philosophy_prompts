      *   *Idea 2: The Engineering Firm.* Groups are hired to explain traits. They get paid per explanation submitted. Penalties only apply if *caught* lying (but they are rarely caught).
          *   *Pros:* Incentivizes volume and confidence.
          *   *Cons:* Doesn't capture the *structural* necessity of the adaptationist lens. It just makes them lazy.

      *   *Idea 3: The "Why?" Chain (Rigged Deck).* Students draw a trait card. They *must* provide a selective advantage. The deck is stacked so that every card *can* have a story told about it, even if the "true" cause (revealed later) was constraint or drift. The scoring rewards *plausibility* and *detail*, not truth.
          *   *Pros:* Directly targets the "just-so story" aspect.
          *   *Cons:* Needs a strong reveal mechanism to show *why* the story was potentially wrong (e.g., phylogenetic data).

      *   *Idea 4: The "Grant Proposal" Simulation (Selected).* Students act as researchers applying for funding. They are given a set of organisms/traits. They must write a "Functional Hypothesis" for each. The "Review Board" (the Professor/Timer) awards points based on *narrative coherence* and *selective pressure specificity*, NOT evidence. In Round 2, new data (constraints/phylogeny) is released that undermines the selective story, but the scoring from Round 1 is already banked.
          *   *Refinement:* Let's make it more game-like. "The Adaptationist Casino." You bet on the existence of a selective pressure. The house odds are always in favor of "Yes, there is a pressure."
          *   *Better Refinement:* **"The Panadaptationist Workshop."** Groups are design teams. They are given "Artifacts" (traits). Their job is to reverse-engineer the *function*. They get points for every function they successfully justify. In Round 2, they are given "Blueprints" (developmental constraints) that show the trait was inevitable given the structure, not selected for. But the points from Round 1 stand.
          *   *Best Refinement:* **"The Just-So Market."**
              *   *Mechanic:* Students trade "Explanation Tokens."
              *   *Twist:* The value of the token depends on how specific the selective pressure is, not whether it's true.
              *   *Round 2:* Introduce "Constraint Cards" that invalidate the selection story but offer no points.
              *   *Why this wins:* It creates a conflict between *earning points* (adaptationism) and *finding truth* (structuralism). It mirrors the academic incentive structure Gould was critiquing.

      *   *Wait, let's look closer at the User's "Rigged Scoring" request.* They want the rational move to be *always claim selective explanation*.
      *   *Revised Idea:* **"The Function Game."**
          *   Round 1: You get a Trait. You write a Selective Story. You get points for *Plausibility* (voted by peers) and *Specificity*.
          *   Round 2: You get "Context Data" (Phylogeny/Development). You can revise. But revising to "It's a constraint" yields 0 points. Sticking with "It's adaptation" yields points if you can argue around the data.
          *   *Problem:* That encourages ignoring data.
          *   *Better:* The game *only* rewards adaptive stories. Non-adaptive explanations are "out of scope" for the grant.
          *   *Winner:* **"The Grant Review Board."** It simulates the institutional pressure Gould described.

      *   *Let's try a different angle: The "Spandrel Architect".*
