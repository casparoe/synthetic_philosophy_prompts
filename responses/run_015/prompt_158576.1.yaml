      *   *Option B:* Reject/Reinterpret Constraint. Score remains 5, but you must write a 2-sentence justification.
      *   *Math:* Rational actor chooses Option B always, because 5 > 0, and the cost of writing 2 sentences is low.
      *   *Lesson:* The system rewards maintaining the adaptationist hypothesis regardless of structural evidence.

  5.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Check:* Did I include the "atomization" critique? Yes, by giving discrete traits on cards.
      *   *Check:* Did I include the "null hypothesis" issue? Yes, by making "It's a byproduct" score zero. There is no null model to beat.
      *   *Check:* Is the timeline realistic? 20 mins for writing might be tight for 3rd years. Let's make it 25.
      *   *Check:* Materials. Keep it simple. Index cards are key.

  6.  **Final Polish:**
      *   Ensure the tone is "colleague to colleague."
      *   Make sure the "Corrective" section is strong, as the user specifically worried about students walking away thinking "evolution is fake."
      *   Ensure the "Predictable Failures" are concrete.

  7.  **Final Review against constraints:**
      *   16 students? Yes, groups of 4.
      *   80 mins? Yes.
      *   Cheap materials? Yes.
      *   No lecture first? Yes.
      *   Payoff math explicit? Yes.

  *(Self-Correction on the "Noise" idea from user)*: The user worried their idea taught "sometimes stories are wrong." My design needs to ensure the lesson is "the *rules of the game* make truth secondary to story coherence." The Constraint Cards in Round 2 are crucial here. They shouldn't just say "This is noise." They should say "This trait correlates perfectly with body size across all species." The students then have to choose: "It's for size" (Adaptation) or "It's a growth law" (Constraint). The points dictate the choice.

