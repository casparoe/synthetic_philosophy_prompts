answer: |-
  Here is a candidate principle, derived from your verdicts, designed to be precise enough for a grant statement. It synthesizes **Institutional Theory** (context matters), **Intentionalism** (agency matters), and **Functionalism** (utility excludes).

  ### The Principle of Framed Attention

  > **Eligibility Statement:**
  > "To be eligible, a proposal must concern a **work of art**. We define a work of art as an object, action, or arrangement resulting from **human agency**, which has been **intentionally framed** by its maker to prioritize **sensory, conceptual, or expressive engagement** over its **practical utility, documentary truth, or promotional function**."

  This principle contains three operative clauses. Here is how they map to your ten cases, followed by the stress tests and the necessary trade-offs.

  ---

  ### 1. Mapping Your Verdicts to the Clauses

  **Clause A: Human Agency**
  *Requires a human author capable of cultural communication.*
  *   **6-Year-Old's Drawing (Art):** Fits. A human child possesses the capacity for expressive intent, even if naive.
  *   **Chimp Painting (Not Art):** Excluded. Lacks human agency. The output is behavior, not communication.
  *   **Motivation:** This resolves your unease about the child/chimp contradiction. The distinction is not biological superiority, but **communicative capacity**. A grant requires an accountable agent who can participate in the cultural dialogue the grant supports.

  **Clause B: Intentional Framing**
  *Requires that the 'artness' comes from selection, arrangement, or context, not just the object itself.*
  *   **400 Mugs (Art):** Fits. The mugs are functional, but the *grid arrangement* in a gallery is the framing act. The art is the installation, not the ceramics.
  *   **Driftwood on Plinth (Art):** Fits. The artist's selection and placement constitute the framing.
  *   **Driftwood on Mantel (Not Art):** Excluded. No framing for public regard; it is a personal souvenir.
  *   **Gallery Sitting (Art):** Fits. The staging and titling frame the action as performance.
  *   **Shopfront Sitting (Not Art):** Excluded. The framing is explicitly promotional/charitable, not aesthetic/conceptual.
  *   **Motivation:** This handles the Readymade logic. It allows found objects to be art without requiring the maker to have manufactured them, provided they *framed* them.

  **Clause C: Priority of Engagement over Utility**
  *The primary purpose must be engagement (looking/thinking), not use (doing/selling/recording).*
  *   **Transit Signs (Not Art):** Excluded. Despite elegance, the primary purpose is wayfinding (utility).
  *   **Forgery (Art):** Fits. Its purpose was to be looked at as a painting. The deception is ethical, not aesthetic. It succeeds as an object of engagement.
  *   **Posthumous Driftwood (The Unstable Case):** *See Trade-offs below.*
  *   **Motivation:** This protects the fund from subsidizing design firms, marketing agencies, or archives under the guise of art.

  ---

  ### 2. Stress Testing: New Cases

  Here is what the principle dictates for the four cases you mentioned, some of which may challenge your intuitions.

  **A. The Readymade (e.g., Duchamp's Urinal)**
  *   **Verdict:** **Art.**
  *   **Reasoning:** Satisfies Human Agency (Duchamp), Intentional Framing (signature + gallery), and Priority of Engagement (removed from plumbing use).
  *   **Consistency:** Aligns with your 400 Mugs verdict.

  **B. A Cathedral**
  *   **Verdict:** **Not Art (for this grant).**
  *   **Reasoning:** Fails Clause C. A cathedral's primary purpose is worship and gathering (utility/function). While it possesses aesthetic properties, it is "Functional Architecture."
  *   **Consistency:** Aligns with your Transit Signs verdict. Elegance does not negate function. *Note: You may need a separate category for Architecture/Heritage if you wish to fund these, but they are not "works of art" under this definition.*

  **C. Composer's Transcription of Bird Song**
  *   **Verdict:** **Art.**
  *   **Reasoning:** Satisfies Clause A & B. The composer exercises human agency in the *selection and arrangement* of the sounds into a musical structure. It is framed for listening, not for ornithological study.
  *   **Consistency:** Aligns with the 400 Mugs. The "raw material" is found, the "work" is the framing.

  **D. AI Image (200 hours of prompting)**
  *   **Verdict:** **Art.**
  *   **Reasoning:** Satisfies Clause A. The human prompter exercises significant agency (selection, refinement, iteration). Satisfies Clause C. The output is for engagement, not utility.
  *   **Consistency:** This is the most likely point of friction for a regional panel. However, if you accept the 400 Mugs (where the artist made nothing physical), you must logically accept the AI prompter (who curates the output). To exclude AI while accepting the Mugs requires a definition of "craft" that your other verdicts reject.

  ---

  ### 3. The Trade-Offs: Which Verdicts Must You Lose?

  No principle is cost-free. To publish this statement, you must accept two consequences that may contradict some panelists' intuitions.

  **Conflict 1: The Posthumous Driftwood (The Attribution Problem)**
  *   **Your Instinct:** Unstable. Is it art? Is it the hiker's art?
  *   **The Principle's Verdict:** It **is** art, but it is **the Curator's art**, not the Hiker's.
  *   **The Cost:** You must overturn the idea that the *hiker* made a work of art. The hiker provided raw material (like the factory provided the mugs). The Curator performed the "Intentional Framing" (Clause B).
  *   **Grant Implication:** If the grant funds *makers*, the Hiker's estate is **ineligible**. The Curator would be the applicant. This resolves your instability by shifting the authorship.
  *   **Why this is the cheapest loss:** It preserves the integrity of "agency." If the hiker didn't frame it for regard, they didn't make art. Allowing posthumous "discovery" to count as the finder's art opens the door to funding random objects found in attics, which dilutes the "Intentional Framing" requirement.

  **Conflict 2: The Child vs. The Chimp (The Agency Boundary)**
  *   **Your Instinct:** You feel the distinction is shaky ("I cannot point to the difference").
  *   **The Principle's Verdict:** The distinction is **Human Agency** (Clause A).
  *   **The Cost:** You must defend a species-based boundary.
  *   **Why this is the cheapest loss:** For a *grant*, this is non-negotiable. Grants require legal accountability, artist statements, and the capacity to fulfill a contract. A chimp cannot be a grantee. Philosophically, art is a language; the child is learning the language, the chimp is making noise. Keeping the Child = Art verdict is vital for community encouragement; losing the Chimp = Art verdict is vital for administrative coherence.

  **Conflict 3: The AI Image (The Craft Boundary)**
  *   **Your Instinct:** (Unknown, but often controversial).
  *   **The Principle's Verdict:** **Art.**
  *   **The Cost:** If your panel feels AI is "functional" (like a search engine) or lacks "human touch," this principle forces you to accept it.
  *   **Why this might be a costly loss:** If your regional community views AI as "promotional" or "functional" generation, this principle contradicts them.
  *   **Fix:** If you must exclude AI, you must add a clause about **"Direct Material Manipulation."** However, doing so would force you to **exclude the 400 Mugs** (since the artist didn't manipulate the clay) and potentially the **Driftwood**.
  *   **Recommendation:** Do not add the "Material Manipulation" clause. It destroys the Readymade and Conceptual Art precedents you have already accepted (the Mugs, the Sitting). It is cheaper to accept AI as art than to reject Conceptual Art.

  ### 4. Final Recommendation for the Panel Statement

  Do not try to save the Posthumous Driftwood as the *Hiker's* art. It is the weakest link in your intuition set because it severs the link between *creation* and *intent*.

  **Publish this:**
  > "Eligible works must result from human agency where the primary intent is to invite sensory or conceptual engagement, rather than to serve a practical, documentary, or promotional function. Selection and arrangement may constitute creation."

  **Privately adopt this interpretation:**
  1.  **Posthumous objects:** Only eligible if the *deceased* framed them. If a curator frames them later, the *curator* is the artist (and the hiker's estate is ineligible).
  2.  **AI:** Eligible if the prompt engineering demonstrates significant curatorial agency (200 hours), but ineligible if it is a single-click utility.
  3.  **Architecture/Design:** Ineligible if the primary purpose is use (Cathedral, Signs), even if beautiful.

  This saves 9 out of 10 of your original verdicts, resolves the instability of the 10th, and gives you a defensible line against functional objects without relying on the circular word "artistic."
