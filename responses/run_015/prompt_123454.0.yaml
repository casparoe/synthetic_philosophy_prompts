          *   *Residue:* *Akrasia* vs. *Akolasia*. In BE, if you consistently choose the vice, you just have different preferences. Aristotle says the *akratic* regrets it, the *akolastic* doesn't. This maps to sophistication vs. naivete, but not perfectly.

