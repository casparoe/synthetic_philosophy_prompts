      *   **Davidsonian All-Things-Considered (ATC) Judgment:** Weakness of will is acting against one's own ATC judgment. The puzzle is how one can hold a judgment "X is best" and do Y. Davidson solves this by distinguishing ATC judgments from conditional judgments ("X is best *given* my desires").

