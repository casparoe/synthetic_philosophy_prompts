prompt: |-
  I co-host a tiny podcast about science-adjacent philosophy (my co-host did a CS degree, I did phil of science, so between us we can follow fairly technical stuff, but our last epsiode on this was a mess because we tried to wing it). Next week we're recording with a philosopher — call her Dr. Renn, she's a stand-in for a real position rather than a real person — whose headline claim is that Solomonoff induction is strictly better than the hand-wavy version of Occam's razor philosophers usually defend: the universal prior converges to any computable environment, the bit-length weighting *just is* the preference for simplicity, and once you see that, the old worry about why simplicity should be truth-conducive more or less dissolves. She's sharp, she's given these answers a hundred times, and she's good at the move where she says "that's a fact about bounded agents, not about the normative theory." I want questions that walk straight into that move and then close the door.

  Draft me eight interview questions that assume the audience already knows what Solomonoff induction, Kolmogorov complexity, and the dominance theorem are — nothing that lets her just restate the setup. Roughly in recording order, and with a follow-up attached to each that's keyed to the answer she's most likely to give:

  - something on the reference machine: dominance only holds up to a multiplicative constant, so what fixes the machine, and why isn't "simplicity" then just machine-relative? She'll say the constant washes out in the limit and/or that physics picks out a natural machine — I want the follow-up to push that this makes the vindication of Occam's razor an empirical, hostage-to-physics claim rather than an a priori one, and that the "constant" hides the description length of the true hypothesis, which can be arbitrarily large.
  - something using a wrinkle I made up and want her to actually engage with: suppose the agent isn't scoring itself by total error summed over an infinite run but by *discounted* error, geometric discount γ < 1, because it only cares about the near future. Her likely reply is that discounting only shrinks later terms so the convergence story is untouched; the follow-up I want is that the interesting question isn't whether it converges but whether the guarantee bites inside the effective horizon — for any fixed γ there are reference machines whose encoding overhead for the true hypothesis is big enough that the bound is useless over the stretch the agent actually cares about, so machine choice now matters by more than a constant in the only sense that matters to her. Make that follow-up concrete enough to say out loud.
  - something on the fact that the universal mixture is a semimeasure and its total mass is less than one: what hypothesis does the leftover mass represent, and isn't it a problem that the framework can't so much as *express* the hypothesis "the world isn't computable," so it assumes the computability it needs? Anticipate the "every formal framework has a background class" reply and have the follow-up ready.
  - something on encoding-relativity in the grue style: any predicate can be made short in some encoding of the observation language, so does the framework explain why "green" beats "grue," or does it just relocate the choice into the coding of the data?
  - something on modern machine learning: wildly overparameterized models generalize fine and parameter count is a terrible simplicity measure, and the natural move in her terms is that the training procedure is itself simplicity-biased, so the function found has short description length even though the hypothesis class is huge. Follow-up: if that's the move, then the razor is doing its work in the *search* procedure rather than in hypothesis selection — so is the universal prior really what's vindicating simplicity, and what would it have to say about which optimizers are any good?
  - something about agency: the framework is defined for a passive sequence of observations, but an agent's own actions shift the distribution, and an environment that can read the agent's source code can in principle make the agent's job arbitrarily hard. Follow-up on what's left of the guarantee under the usual expected-reward extension of the framework.
  - and to close, one question about what kind of result — empirical or mathematical — would actually make her drop the Solomonoff framing, rather than treat the problem as a detail.

  Keep them in spoken register, don't have her recommend any reading or cite papers (we can't put links in the audio anyway), and flag anywhere you're relying on a contested technical claim so I don't get caught out on air.
