prompt: |-
  I have just come away from a long and frustrating argument with a friend about whether any purely behavioral criterion could ever be an adequate test for the presence of a mind, and I now think the argument stalled because we were operating with different, unstated requirements.

  My friend is a thoroughgoing skeptic about behavioral tests. He insists that verbal behavior is cheap: a machine might produce flawless conversational behavior by consulting a vast precomputed list of question-and-answer pairs, or by exploiting statistical regularities in a way that involves no understanding whatsoever, and it would still be a mere automaton. He also pressed the case of a being that is fully conscious and intelligent but, whether by choice, by paralysis, or by never having learned a language, produces no relevant behavior at all; such a being would fail any behavioral test, yet plainly has a mind. From this he concluded that no behavioral criterion can be adequate: at best it is fallible evidence, never a criterion.

  I pushed back as hard as I could. I argued that the whole attraction of a behavioral criterion is that it must be public, checkable, and action-guiding; if we demand direct access to inner states, we have no way to apply the criterion to other human beings, let alone to machines, non-human animals, or aliens. I also argued that the classical imitation game is too narrow, because it tests only conversational fluency in a human idiom, and that a better behavioral criterion would look instead at the candidate's capacity for sustained, embodied, norm-governed cooperation with others over time. My friend replied that this merely changes the behavior, not the underlying problem. At that point we were talking past each other.

  I do not want a reading list or a history of the debate. I want a specification. Suppose we want a behavioral criterion good enough to underwrite one serious practical decision: whether to treat a candidate—an artificial system, a non-human animal, a human patient who cannot speak, or an imagined alien—as a subject of experience and a bearer of interests, with the moral protections that go with that. Write the desiderata: the requirements any behavioral criterion for mind would have to meet to count as adequate for that purpose, with the case or consideration behind each requirement.

  Please build the list around the stress cases my friend and I improvised, and add any others you think load-bearing. The cases should include at least the following.

  First, the Ledger case: a system that contains, for every question it can be asked within the test, a stored answer, and that produces its replies purely by looking them up, with no real-time inference, no understanding, and no perspective of its own; it is behaviorally indistinguishable, within the test, from a being that understands.

  Second, the Silent Sage: a being that is conscious, intelligent, and fully capable of experience and thought, but that cannot exhibit the behavior the criterion demands—whether because it has no suitable output channel, because it has chosen silence, or because it is a human patient who is conscious but can only blink and thus cannot satisfy a rich verbal or interactive test. The point is that the absence of the tested behavior need not mean the absence of mind.

  Third, the Parochial Interrogator: the test is administered by an interrogator from a radically different culture or species, who does not share human conversational norms, so that a candidate might fail merely because it cannot navigate those local norms rather than because it lacks a mind.

  Fourth, the Longitudinal Collaborator: instead of a short interrogation, the candidate spends years working with human beings on a shared, physically situated project, and its success depends on perception, action, memory, correction, and responsiveness to norms over time.

  Fifth, the Perfect Actor: a candidate that can produce apparently sincere avowals of pain, love, confusion, and fatigue, and can even behave in human-like ways when it is uncertain or mistaken, but is only simulating all of it.

  Sixth, the Language-less Human: a human being raised without exposure to any language until late adolescence, who before linguistic training has desires, fears, perceptual experiences, and a point of view, but cannot pass a verbal test.

  For each requirement, give the motivating case or consideration, and say what the criterion must get right: which cases it must not misclassify, which distinctions it must respect (for example, between evidence for mind and the constitutive mark of mind; between dispositional and occurrent states; between failing to exercise a capacity and lacking it; between mere behavioral mimicry and the real thing; between human parochial norms and mind as such), and which empirical or conceptual results it must not contradict. Mark each requirement as non-negotiable or as a preference of a particular camp, and say why.

  Above all, tell me which requirements pull against each other. I strongly suspect that some subset cannot be jointly satisfied. For instance, a demand that the criterion never produce false negatives—that it must classify every genuinely minded being as minded—seems to force us to accommodate silent, non-verbal, or alien minds, and therefore to make the behavioral evidence very permissive; but a demand that it never produce false positives—that it must exclude Ledger systems and Perfect Actors—seems to force us to require some internal, real-time processing or understanding, which we may be unable to verify from behavior without reintroducing false negatives. If there is a genuine inconsistency in the full set of desiderata, identify the smallest subset that is jointly unsatisfiable and explain the trade-off; that is the part I most want to see.

  Once the desiderata are on the table, score them briefly: in a sentence or two each, say how three candidate views measure up. The first is the classical imitation game restricted to text-based conversation. The second is a total Turing test that requires the candidate to perceive and act on the physical world, and to cooperate with others, over an extended period. The third is a position that treats the presence of a specific neurophysiological or functional organization as the real criterion, and treats behavior only as evidence of it. Keep the scoring brief; the important work is the list of requirements and the tensions among them.

  Finally, close by saying what, if anything, a behavioral criterion can honestly deliver given those tensions. I would rather have a criterion that is explicit about its limits than one that pretends to do more than it can.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user had a frustrating argument with a friend about behavioral criteria for mind (Turing Test style vs. skepticism).
      *   **Goal:** Create a specification of *desiderata* (requirements) for a behavioral criterion adequate for a specific practical decision: granting moral status/subjecthood.
      *   **Constraints:**
          *   No reading lists or history.
          *   Must address specific stress cases: Ledger, Silent Sage, Parochial Interrogator, Longitudinal Collaborator, Perfect Actor, Language-less Human.
          *   For each requirement: Motivating case, what it must get right (distinctions), status (non-negotiable vs. preference).
          *   **Crucial:** Identify tensions/inconsistencies among requirements (the "smallest subset that is jointly unsatisfiable").
          *   **Scoring:** Briefly score three views (Classical Turing, Total/Embodied Turing, Neuro/Functional Criterion) against the desiderata.
          *   **Conclusion:** State honestly what a behavioral criterion can deliver given the tensions.

  2.  **Deconstruct the Stress Cases & Derive Requirements:**

      *   *Ledger Case (Lookup Table):* Behavior is perfect, but no understanding.
          *   *Requirement:* **Anti-Mimicry / Generative Capacity.** The criterion must distinguish between static retrieval and dynamic, context-sensitive generation.
      *   *Silent Sage (Conscious but non-behaving):* Mind exists, behavior fails.
          *   *Requirement:* **False Negative Immunity (Sensitivity).** The criterion must not rule out minds that cannot express themselves via the test's specific channel.
      *   *Parochial Interrogator (Cultural bias):* Mind exists, fails due to norms.
          *   *Requirement:* **Normative Neutrality / Universality.** The criterion must not rely on species-specific or culture-specific behavioral signatures.
      *   *Longitudinal Collaborator (Extended interaction):* Success over time implies mind.
          *   *Requirement:* **Temporal Depth / Robustness.** The criterion must account for learning, adaptation, and consistency over time, not just snapshot performance.
      *   *Perfect Actor (Simulating pain/emotion):* Behavior looks sincere, but is fake.
          *   *Requirement:* **Affective Authenticity / Vulnerability.** The criterion must detect signs of genuine stake/interest, not just script-following. (This overlaps with Ledger but focuses on *affect* rather than *cognition*).
      *   *Language-less Human (Pre-linguistic mind):* Mind exists, fails verbal test.
          *   *Requirement:* **Modality Independence.** The criterion must not privilege language over other forms of agency (movement, gaze, tool use).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1 (Generativity):* Motivated by Ledger. Must distinguish lookup from inference. *Status:* Non-negotiable for moral status (we don't protect calculators).
      *   *Req 2 (Sensitivity):* Motivated by Silent Sage/Language-less Human. Must not miss minds due to output limits. *Status:* Non-negotiable (moral catastrophe to ignore a conscious being).
      *   *Req 3 (Neutrality):* Motivated by Parochial Interrogator. Must not be culturally biased. *Status:* Non-negotiable (fairness).
      *   *Req 4 (Robustness):* Motivated by Longitudinal Collaborator. Must show adaptability. *Status:* Preference (strengthens evidence, but maybe not strictly necessary if other signs are present).
      *   *Req 5 (Vulnerability):* Motivated by Perfect Actor. Must show stakes/risk. *Status:* Non-negotiable (moral status hinges on capacity to suffer/flourish).

  4.  **Identifying the Tensions (The Core Task):**

      *   *The Conflict:* Req 2 (Sensitivity/No False Negatives) vs. Req 1 & 5 (Specificity/No False Positives).
      *   *Why?* To ensure we don't miss a Silent Sage (Req 2), we must lower the behavioral threshold or allow for non-behavioral indicators. But if we rely *only* on behavior (as per the prompt's constraint of a "behavioral criterion"), we cannot verify the Silent Sage. If we lower the behavioral bar to catch the Silent Sage, we let in the Ledger or Perfect Actor (violating Req 1 & 5).
      *   *The "Impossible Triangle":*
          1.  Purely Behavioral (input/output only).
          2.  Zero False Negatives (catch all minds, including silent ones).
          3.  Zero False Positives (exclude all automata/actors).
      *   *Resolution:* You can't have all three. Since the prompt asks for a *behavioral* criterion, (1) is fixed. Therefore, (2) and (3) are in tension.

  5.  **Scoring the Three Views:**

      *   *Classical Turing (Text):* Fails Ledger (can be faked), Fails Silent Sage (requires text), Fails Language-less Human. Good on Parochial (maybe).
      *   *Total/Embodied Turing:* Better on Ledger (harder to precompute physical interaction), Better on Language-less Human (allows non-verbal action), Still fails Silent Sage (requires *some* output).
      *   *Neuro/Functional:* Solves Silent Sage and Ledger (looks inside), but violates the "Purely Behavioral" constraint of the prompt's exercise. It shifts the ground.

  6.  **Refining the Output Structure:**

      *   Introduction: Acknowledge the stalemate and the goal (moral status).
      *   The Desiderata List: Structured with Case, Requirement, Distinction, Status.
      *   The Tensions: Explicitly map the inconsistency.
      *   The Scoring: Brief comparative analysis.
      *   The Conclusion: Honest assessment of limits.

  7.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't slip into arguing for one side. Stay neutral and analytical.
      *   *Correction:* Ensure the "Non-negotiable" tags are justified. For moral status, false negatives are usually considered worse than false positives (better to treat a rock as sacred than a human as a tool), but the prompt asks for *adequacy*, which implies reliability. I need to balance the moral weight.
      *   *Refinement on Tensions:* The prompt asks for the "smallest subset that is jointly unsatisfiable." I need to be precise here. It's the combination of "Purely Behavioral," "No False Negatives (Silent Sage)," and "No False Positives (Ledger)."
      *   *Refinement on Scoring:* Keep it to 1-2 sentences per view per desideratum or overall? The prompt says "in a sentence or two each, say how three candidate views measure up." I will summarize the view's performance against the *set* of desiderata.

  8.  **Final Review against Constraints:**
      *   Did I include all 6 cases? Yes.
      *   Did I specify requirements for each? Yes.
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the inconsistency? Yes.
      *   Did I score the 3 views? Yes.
      *   Did I conclude on what behavioral criteria can honestly deliver? Yes.

  9.  **Final Polish:** Check tone. Needs to be philosophical, precise, and empathetic to the user's frustration. (Proceed to generate output).

  *(Self-Correction during final review of the "Tensions" section)*: I need to make sure I clearly articulate *why* they are unsatisfiable. The Silent Sage case *by definition* fails a behavioral test. Therefore, a behavioral criterion *cannot* satisfy the requirement to not misclassify the Silent Sage. This is the hard limit. I must state this clearly.

  *(Self-Correction on "Ledger")*: A purely behavioral test *cannot* distinguish a sufficiently complex Ledger from a mind *in principle* if the output is identical. This is the Blockhead argument. So Req 1 is also technically impossible for a *purely* behavioral test if the Ledger is infinite/complex enough. I need to nuance this: The requirement is for the test to be *designed* to make Ledgers impractical, even if not logically impossible. Or, acknowledge that logical possibility of deception remains. I will frame it as "Probabilistic Security" rather than "Logical Proof."

  *(Wait, one more check)*: The prompt asks for a specification for a *practical decision*. This allows for probabilistic standards rather than logical certainty. I should emphasize *practical adequacy* over *metaphysical certainty*.

