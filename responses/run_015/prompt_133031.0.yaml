answer: |-
  The reading room hummed with the sound of cooling servers. It was two in the morning. On the table between them lay a single sheet of paper, verified and stamped by the Surplus. Anselm Roy sat with his hands clasped, watching Wren Halloway. She was not looking at him; she was looking at the signature of Maret Ost.

  "If you read this at the Convocation," Roy said, "the peace ends. Not because the words are false. Because the ground beneath the city vanishes."

  "The ground is already gone, Anselm. This is just the receipt."

  "The peace is not a lie. It is a structure. Ten years ago, Terrenne was a pile of corpses and grievances. The Bureau did not invent the corpses. We chose which ones mattered to the living." Roy tapped the table, not the paper. "You think the Surplus is neutral. It isn't. Refusing to rank is a ranking. Refusing to shape is a shape. You give the city a heap of particulars and call it freedom. But a city cannot inhabit a list. It needs a story."

  "A story requires a beginning," Halloway said. "Ost's signature is the beginning. You've built the decade on the claim that Kessel was an accident. A structural failure. This says it was an order."

  "And if it was an order, what then? Do you think the survivors of Kessel want the truth more than they want heat in the winter? I spoke to them. I know what it cost them to accept the accident. It cost them their grief. It cost them the right to hate the founder. We bought stability with their silence."

  "You bought it with their reality," Halloway said. She finally looked up. Her eyes were red from the screen light. "You talk about the Bureau's discipline. Candour, you call it. Every sentence verified. But you answer the unwelcome question with the least informative truth available. You tell the widow her husband died at 14:00. You don't tell her he was shot by the unit stationed to protect him. Both are true. One allows her to live in Terrenne. The other tells her where she stands."

  "The latter destroys her capacity to act," Roy said. "If every fact is equally loud, no fact can guide action. Factual truth is despotic, Wren. It admits no disagreement. It just is. If you put Ost's signature on the podium, you aren't liberating the city. You are forcing it to confront a fact that offers no way forward. You destroy the shared world without giving them a new one."

  "The shared world is a fabrication," Halloway said. "That's the point. You think the liar is dependent on the truth. I think you've forgotten what the truth is. Facts are contingent. They could have been otherwise. That's why they're fragile. You don't destroy them by arguing. You destroy them by replacing them. Ten years of replacing the burn order with the structural failure report isn't politics. It's erosion. Eventually, people lose the capacity to take their bearings. They don't believe the lie; they just stop knowing what 'real' feels like."

  Roy leaned back. He looked tired, the weight of the decade showing in the slump of his shoulders. "The capacity to say of what is that it is not... that is the same capacity that makes a new beginning possible. It is the temptation of all political action. If we were bound only to what happened, we could never change anything. Ost burned Kessel to save the rest of Terrenne. To say she did not is to preserve the possibility of the city she saved. The liar possesses a freedom the truth-teller lacks. He can generate alternatives. The truth-teller is stuck with what happened."

  "And when the alternative consumes the fact?" Halloway asked. "When the fabrication isn't a tool anymore, but the environment? You're not lying anymore, Anselm. You've lost contact. The catastrophe isn't a city that believes a falsehood. It's a city that has lost the distinction."

  "I know the distinction," Roy said sharply. "I wrote the speeches. I know what happened. I know Ost signed the order. I am not deceived."

  "Then where is the denial?" Halloway pushed the paper toward him. "This is the crux. If every sentence the Bureau utters is verified true, if you never speak a falsehood, then what is it that you are denying? Where is the lie physically located? Is it in the sentences?"

  "No."

  "In the timing?"

  "Sometimes."

  "In the silence?"

  Roy looked at the signature. He looked at the verified stamp. He looked at the empty space on the page where the Bureau's commentary would have gone, had this been their document. There was none.

  "It is in the selection," Roy said. His voice was quiet. "It is in the choice of which verified facts to publish, and in whose mouth they are placed. We do not deny the fact. We deny it relevance. We deny it entry into the shared world."

  "So the denial is in the architecture," Halloway said. "You build a room where that fact cannot fit. You keep the walls true. You just make sure the room is too small for the furniture."

  "If the room is too big, no one can heat it," Roy said. "If I let you read this tomorrow, you collapse the room. The city loses its capacity to act together. You concede that, don't you? You know the Convocation may destroy Terrenne."

  Halloway hesitated. She looked at the servers humming in the racks behind her. "I concede that reading this may make governance impossible. I concede that the peace is built on this denial. I know that giving them the signature doesn't give them back the Kessel district. It doesn't bring anyone back. It just breaks the story."

  "Then why do it?"

  "Because the ground on which people stand is precisely the facts nobody chose," Halloway said. "If you remove the contingent facts because they are inconvenient, you leave people standing on reasoning. On arguments. And arguments can be changed. Facts shouldn't be. If I don't read this, I am saying that the ground is negotiable. And if the ground is negotiable, there is no place left to stand."

  Roy stood up. He walked to the window. The city outside was dark, save for the security lights. "You think you are the guardian of the real. But you have spent ten years inside other people's testimony. You have no world left to stand on besides the heap. You have no shared story. You have only particulars. Do you know where you are, Wren? Or do you only know what happened?"

  Halloway stood as well. She did not gather the paper. "And you? You have spent ten years shaping the world. You say you know the fact. But you have spent a decade saying things you know are shaped. Are you still in contact with the fact at all? Or have you become the architecture?"

  Roy turned from the window. He looked at her, and for a moment, the defender of the Bureau looked like a man who had forgotten the difference between the map and the territory. "I know what I am doing," he said. "I am keeping the city alive."

  "You are keeping the city asleep," Halloway said. "And I am waking it up to a room with no walls."

  "Six hours," Roy said. "The Convocation opens in six hours."

  "I know."

  Roy looked at the paper one last time. He did not try to take it. He did not try to argue the selection again. He had admitted where the denial lived. She had admitted the cost of the truth.

  "If you read this," Roy said, "you must be sure that the ground is worth more than the house."

  "If the house is built on the void," Halloway said, "the ground is all we have."

  Roy nodded, once. He turned and walked toward the door. He stopped with his hand on the latch. He did not look back.

  "Wren," he said. "When you stand at the podium tomorrow. Will you know you are telling the truth? Or will you just know you are reading?"

  Halloway looked at the signature. She looked at the hum of the servers. She did not answer. Roy opened the door and stepped out into the hall. The lock clicked behind him. The room was silent again, save for the cooling fans, spinning in the dark.
