      *   **Jain Orthodoxy:** Jains generally insist they do *not* violate the Law of Non-Contradiction *in the same respect*. This is crucial. The predicate "is" is always qualified by substance (*dravya*), place (*kṣetra*), time (*kāla*), and state (*bhāva*).

