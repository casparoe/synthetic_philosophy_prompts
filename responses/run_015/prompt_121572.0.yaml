answer: |-
  **TO:** Program Committee, "Progress & Method" Stream
  **FROM:** PhD-Student Representative
  **SUBJECT:** Recommendation on Finalists: Atlas (A) vs. Cassandra (B)

  **Recommendation:** Exercise the contingency rule: **Split the award into two 18-month scoping grants.**

  **Reasoning:**
  We genuinely cannot pick a single winner without compromising either philosophical rigor or institutional mission. Proposal A (Atlas) offers the utility the Foundation demands but rests on a metric vulnerable to fatal structural objections. Proposal B (Cassandra) identifies those objections correctly but concludes with a recommendation incompatible with our founding mandate. A split allows us to test whether A's metric can be stabilized against B's critiques while funding B's development of instrumental alternatives without endorsing the claim that truth-seeking is nonsense.

  **The Losing Case (If Forced to Choose):**
  If compelled to award the full grant to one, **A** wins on mission fit, making **B** the losing side. The strongest version of B's case—which we must respect even if rejecting it for full funding—is not merely that A is difficult, but that A is *impossible* as conceived. B argues that any measure of "closeness-to-truth" is inevitably a measure of "closeness-to-our-current-carving." If the ranking of theories flips when we refine the partition of state-space (e.g., moving from planetary positions to orbital energies), the metric measures the analyst's vocabulary, not the world. Furthermore, B correctly notes that for false theories, adding content usually increases falsity-content faster than truth-content. Unless A solves this, their toolkit cannot distinguish Einstein from Newton on principle, only by fiat. B's conclusion—that we should abandon truth-likeness for predictive accuracy—is the only consistent outcome of their premises. We reject this not because it is wrong, but because funding a project to prove our mission statement incoherent is institutionally self-defeating.

  **Decisive Disputes:**
  1.  **Carving-Relativity (Carries the Recommendation):** This is the decisive flaw preventing A from receiving full funding. If the score depends on the partition, it is not a measure of progress. A must demonstrate invariance under reconceptualization to succeed.
  2.  **Popperian Collapse (Red Herring):** We should not spend meeting time here. A does not use Popper's content-difference measure; they use a distance metric over state-space. The Miller/Grünbaum objection applies to content, not necessarily to geometric distance, provided the metric is well-defined.
  3.  **End-of-Inquiry Proxy (Secondary):** The Statistician's suggestion to use predictive accuracy is prudent for renewal decisions but does not solve the "Progress" stream's core question. It is a fallback, not a solution.

  **Committee Stance Required:**
  We must resolve **whether invariance under reconceptualization is a hard constraint.** I recommend we require it. If A's toolkit yields different progress rankings for logically equivalent descriptions of the same system, it is unusable for funding decisions. We should mandate that A demonstrate stability across at least three distinct partition schemes for their historical test cases.

  **Scope of Live Case:**
  The live cellular aging case must be **excluded from validation.** Using a contested, live funding decision to validate the metric that will judge that decision is circular and invites bias. The aging case should be a *target* for the toolkit's application only after the toolkit is validated on historical data. Including it now poisons the validation process.

  **Concrete Failure Milestones:**
  To ensure accountability, the funded project(s) should be considered failed if:
  1.  **Instability:** The toolkit ranks competing historical theories differently when the state-space partition is refined by one logical degree (e.g., splitting cells without changing underlying physics).
  2.  **Historical Mismatch:** The toolkit fails to rank established progress cases (e.g., Copernican over Ptolemaic) within the top quartile of scores without manual parameter tuning.
  3.  **Usability:** No functional software prototype is delivered by Month 12 that allows a non-author to input a theory partition and receive a score.

  **Institutional Trap:**
  We must handle the Program Officer's concern honestly. B's conclusion undercuts our founding language. Funding B to argue our mission is nonsense is problematic. However, ignoring B's argument because it is uncomfortable is intellectually dishonest. The split resolves this: we fund B's *analysis* of the problem without endorsing their *conclusion* as Foundation policy. We acknowledge that "progress toward truth" may be philosophically fraught while maintaining it as our operational goal. This allows us to hear the critique without committing institutional suicide.

  **Bottom Line:**
  Fund both as scoping projects. A must solve the carving problem; B must refine instrumentalism without denying truth exists. If A cannot solve carving-relativity in 18 months, we have saved $700k and learned verisimilitude is unmeasurable. If B cannot offer an alternative to truth-talk that satisfies stakeholders, we have learned instrumentalism is insufficient. Either way, we win.
