  **Essay Prompt**

  **Topic:** The Precommitment Paradox: Hyperbolic Discounting and Diachronic Autonomy

  **Instructions:**
  Critically evaluate the tension between hyperbolic discounting and diachronic autonomy known as the "precommitment paradox." Your essay must address the following three tasks:

  1.  **Explain** why hyperbolic discounting, taken on its own terms, might dissolve the traditional problem of akrasia into a series of locally rational choices rather than genuine irrationality.
  2.  **Defend or reject** the claim that Ulysses-style precommitment strategies restore diachronic rationality only by fragmenting the agent into competing temporal parts, thereby treating the future self as an external threat.
  3.  **Propose** how a defender of unified agency might reply to this fragmentation objection. You must articulate a solution (e.g., appealing to narrative constraints or standing commitments) that preserves agency without merely name-dropping standard planning theorists.

  Your response should be approximately 700 words. Focus on argumentative precision rather than historical summary.

  ***

  **Model Answer**

  Hyperbolic discounting models temporal preference as non-linear, positing that value drops precipitously as rewards approach the present moment. Unlike exponential discounting, which maintains consistent preferences over time, hyperbolic curves generate predictable preference reversals: an agent may prefer a larger later reward when both are distant, but switch to a smaller sooner reward as the immediate option becomes available. This mechanism fundamentally challenges the traditional conception of weakness of will. If akrasia is defined as acting against one's better judgment while holding that judgment, hyperbolic discounting suggests no such contradiction exists at the moment of action. At time T, the agent's discount curve makes the immediate reward objectively more valuable than the delayed one according to their current utility function. Thus, the agent is not irrational in the synchronic sense; they are simply maximizing local utility based on their current temporal perspective.

  The problem of akrasia dissolves into a series of synchronically rational but diachronically inconsistent choices. There is no conflict between judgment and action, only a conflict between past and present preferences, rendering the charge of irrationality moot unless one imposes a diachronic standard of consistency. Consequently, what looks like weakness is merely the rational operation of a time-sensitive utility function. Each temporal slice of the agent is acting perfectly rationally relative to its own discount curve. The "irrationality" exists only from the vantage point of a prior self whose discount curve has since shifted. This suggests that without a robust theory of diachronic identity, hyperbolic discounting eliminates akrasia entirely, replacing moral failure with mathematical inevitability.

  To manage this inconsistency, agents often employ Ulysses-style precommitment strategies, binding their future selves to prevent preference reversal. However, this solution generates the precommitment paradox. By restricting future choices, the present self treats the future self as an external threat rather than a continuation of the same agency. It implies that the future self's deliberative capacity is inherently suspect, akin to locking a room against a stranger who might steal the keys. This approach fragments the agent into competing temporal parts: the planning self who values long-term goals and the acting self who values immediate gratification. If rational agency requires the capacity to revise intentions based on new information or perspectives, precommitment undermines diachronic autonomy. It secures consistency only by sacrificing the future self's sovereignty, effectively killing the agency it seeks to protect. The paradox lies in the fact that to preserve the rationality of the plan, one must negate the rationality of the agent executing it. The future self becomes a hostile entity to be managed rather than a partner in deliberation.

  A defender of unified agency might reject this fragmentation by arguing that precommitment need not be adversarial. Instead of viewing constraints as external locks, they can be understood as constitutive expressions of identity. On this view, agency is not merely a sequence of discrete utility maximizations but a narrative project. A standing commitment is not a shackle imposed on a future stranger, but a promise made to oneself that defines who one is over time. The rationality of adhering to such commitments lies not in avoiding preference reversal, but in valuing integrity as a higher-order good. By framing self-binding as an act of self-constitution rather than self-coercion, the agent preserves diachronic unity. The future self is not suppressed; rather, it inherits a context of meaning established by the past self. Thus, rationality involves honoring the narrative arc of one's life, ensuring that temporal slices cohere into a single life rather than a series of disconnected maximizations. This avoids the fragmentation objection because the constraint is internal to the agent's conception of themselves, not an external force applied against their will. The discounting impulse is not defeated by force, but outvalued by the commitment to personal continuity.

  ***

  **Marking Scheme**

  **Total Marks:** 25

  **Must-Hit Moves (5 marks each):**

  1.  **Mechanism of Hyperbolic Discounting:** Clearly explains non-linear discounting and preference reversal (e.g., distant vs. immediate rewards).
      *   *Typical Mistake:* Confusing hyperbolic with exponential discounting or failing to explain *why* preferences reverse over time.
  2.  **Local Rationality Claim:** Argues that at time T, the choice is utility-maximizing, thereby dissolving traditional akrasia into diachronic inconsistency rather than synchronic irrationality.
      *   *Typical Mistake:* Insisting the agent is still irrational at time T, missing the prompt's requirement to explain how discounting *dissolves* the problem.
  3.  **Precommitment as Fragmentation:** Articulates the objection that Ulysses contracts treat the future self as an adversary/stranger, splitting the agent into planning vs. acting selves.
      *   *Typical Mistake:* Describing precommitment only as a solution without addressing the "external threat" or fragmentation objection required by the prompt.
  4.  **Diachronic Autonomy Critique:** Evaluates how binding the future self undermines sovereignty or the capacity for rational revision, creating the paradox.
      *   *Typical Mistake:* Claiming precommitment always enhances autonomy without grappling with the cost to the future self's agency.
  5.  **Unified Agency Proposal:** Proposes a solution based on identity, narrative, or constitutive commitment that avoids fragmentation without name-dropping (e.g., no "Bratman" or "Parfit" without explanation).
      *   *Typical Mistake:* Name-dropping theorists without explaining the mechanism, or proposing a solution that relies on external coercion rather than internal unity.
