answer: |-
  Your intuition is spot-on. Your roommate has grasped the broad stroke of Plutarch's project (that it is ethical rather than purely historical) but has painted the details with a much clumsier brush. He is repeating a simplified version of a common undergraduate thesis that falls apart when you actually read the texts.

  Here is a breakdown of what is accurate, what is a simplification, and what is demonstrably wrong in your roommate's summary.

  ### 1. "Plutarch pairs lives not to do history but to build moral mirrors."
  **Verdict: Accurate (mostly).**

  Your roommate is right about Plutarch's stated intent. In the famous opening of *Alexander and Caesar*, Plutarch explicitly writes: *"I am writing Lives, not Histories."* He argues that a single small action or a joke often reveals character more than a battle with ten thousand dead. His goal is *paideia* (moral education/improvement). He wants the reader to emulate the good and avoid the bad.

  **The Nuance:** However, saying he isn't "doing history" is a bit modern. For Plutarch, moral truth *was* a kind of historical truth. He isn't inventing facts (usually), but he is selecting them for ethical resonance.

  ### 2. "He curates each life... as either a pure exemplar of virtue or a clear cautionary tale... deliberately hides moral ambiguity."
  **Verdict: Wrong.**

  This is the weakest part of your roommate's argument, and your instinct about *Alcibiades* and *Demetrius* is correct. Plutarch does **not** write hagiography in the Christian sense. Christian hagiography often sanitizes the subject to prove their sainthood. Plutarch does the opposite: he believes you cannot learn from a statue; you can only learn from a human being.

  *   **Flaws are Essential:** Plutarch famously argues that great virtues often cast great shadows. In *Pericles*, he admires the statesman but critiques his aloofness and the disastrous war policy. In *Alexander*, he portrays a genius whose ambition curdles into paranoia and cruelty.
  *   **The "Bad" Lives:** Even in the "cautionary" lives, Plutarch often finds redeeming qualities. *Mark Antony* is portrayed as a man enslaved by passion, but also as generous, brilliant, and genuinely loved. If Plutarch hid ambiguity, *Antony* would be a cartoon villain; instead, he is a tragic figure.
  *   **Ambiguity as Pedagogy:** Plutarch believes moral ambiguity is *where the learning happens*. If a hero is perfect, you can't copy him (because you aren't perfect). If a hero is flawed, you can analyze *which* parts to copy and which to discard.

  ### 3. "The parallel structure... [proves] Greek and Roman virtue are interchangeable universal types."
  **Verdict: Simplification.**

  The parallel structure (*synkrisis*) is not about proving Greeks and Romans are the same. It is often about **cultural translation**.

  *   **Political Context:** Plutarch was a Greek living under the Roman Empire. A major subtext of the *Lives* is showing his Greek readers that their ancestors were just as great as the current Roman rulers, while showing Roman readers that the Greeks possessed a cultural sophistication worth respecting.
  *   **Specifics over Universals:** The parallels are rarely "Interchangeable Type A vs. Type B." They are specific comparisons of specific choices. For example, in comparing *Demosthenes and Cicero*, Plutarch spends a lot of time arguing about who was more cowardly in battle or who was more vain. He is highlighting *differences* in how virtue manifested in different cultures, not erasing them.

  ### 4. "Modern historians don't take Plutarch seriously."
  **Verdict: Wrong.**

  This is a common misconception among intro students. Modern historians take Plutarch *very* seriously, but they use him differently than they use Thucydides or Polybius.
  *   **Fact-Checking:** Historians know Plutarch wrote 400 years after many of his subjects. He sometimes gets dates or names wrong.
  *   **Cultural History:** However, he is invaluable for understanding how the elite of the 1st and 2nd centuries AD viewed the past. He is a primary source for the *reception* of history. If you want to know what actually happened at the Battle of Salamis, you go to Herodotus. If you want to know what a Roman gentleman in 100 AD *thought* about leadership and virtue, you go to Plutarch. No serious classicist dismisses him.

  ### 5. "Ethical Stereoscopy... lets the reader calibrate their own virtue... [but] only applies to the virtuous pairs."
  **Verdict: Modern Gloss (and misapplied).**

  "Ethical stereoscopy" is not a term Plutarch used; it is a metaphor used by modern scholars (most notably **Timothy Duff** in his seminal work *Plutarch's Lives: Exploring Virtue and Vice*) to describe the effect of the *synkrisis*.

  *   **The Concept:** The idea is that looking at two lives side-by-side creates depth perception. You see the nuance of a virtue better when you see how it failed in another context.
  *   **The Error:** Your roommate is wrong that this only applies to "virtuous" pairs. Comparing two flawed men (like *Demetrius and Antony*) is arguably *more* stereoscopic. It allows the reader to see the subtle differences between "ambition" and "tyranny," or "charm" and "manipulation." If flawed lives were just simple warnings, Plutarch wouldn't need to pair them; he could just list them. The pairing exists to complicate the moral judgment, not simplify it.

  ### Summary for Your Argument

  You can tell your roommate he gets an **A for effort on the "Moral Purpose" thesis, but an F on the "Hagiography" thesis.**

  1.  **On Hagiography:** He is confusing Plutarch with later Christian biographers. Plutarch's subjects are psychologically complex. If he hid flaws, the *Life of Alcibiades* (a brilliant traitor) or *Life of Sulla* (a bloody dictator) wouldn't exist as they do.
  2.  **On Stereoscopy:** The term is real (in modern scholarship), but his application is rigid. The comparison works best when the subjects are messy, not when they are pure.
  3.  **On Historians:** Historians absolutely take him seriously, they just don't treat him as an objective court reporter.

  **The Winning Line:**
  "Plutarch doesn't want us to copy heroes exactly; he wants us to understand the *mechanics* of their character. You can't calibrate your virtue against a saint, because a saint is static. You calibrate it against a human being who struggled, and that requires the moral ambiguity my roommate thinks Plutarch hides."
