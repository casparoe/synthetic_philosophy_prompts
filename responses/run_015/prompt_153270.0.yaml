      *   *Point 2: Hagiography vs. Complexity.* This is the big one. Address the "hiding flaws" claim. Use *Alcibiades*, *Demetrius*, *Pyrrhus*. Explain that Plutarch believes virtue is dynamic, not static. Contrast with Christian hagiography (miracles/sainthood vs. character/choice).
      *   *Point 3: The Parallel Structure.* Explain the *synkrisis*. It's not about "interchangeability" but about nuanced comparison. Sometimes the Greek is better, sometimes the Roman. Sometimes both are flawed.
      *   *Point 4: Ethical Stereoscopy.* Identify this as modern scholarship (likely Duff or Pelling). Clarify that it applies to *all* pairs, not just virtuous ones. Comparing two disasters teaches you how to avoid disaster.
