      *   **Task:** Evaluate the roommate's summary. Identify what's accurate, what's a simplification, and what's wrong. Address specific questions: Does Plutarch suppress ambiguity? Is the parallel structure about interchangeable virtues? Is "ethical stereoscopy" real or a modern gloss?

  2.  **Deconstruct the Roommate's Claims vs. Scholarly Consensus:**

      *   *Claim 1: Moral instruction vs. History.*
          *   **Verdict:** Mostly Accurate. Plutarch explicitly states in *Alexander/Caesar* (1.1-3) that he is writing "Lives," not "Histories." His goal is ethical improvement (*paideia*).
          *   **Nuance:** He doesn't *ignore* history, but he subordinates factual completeness to ethical insight. Modern historians *do* use him, but cautiously. They don't "not take him seriously"; they just recognize his genre constraints.

      *   *Claim 2: Pure exemplars vs. Cautionary tales / Hiding Ambiguity.*
          *   **Verdict:** **Wrong/Overstated.** This is the user's strongest intuition. Plutarch is famous for the "spotlight" method (focusing on small actions to reveal character), but he does *not* hide flaws in his "heroes." Even great men (Pericles, Alexander) have significant flaws discussed. The "hagiography" comparison is anachronistic and misleading. Christian hagiography tends to sanitize; Plutarch tends to psychologize.
          *   **Evidence:** *Alcibiades* is charming but reckless. *Demetrius* is a brilliant commander but morally dissolute. *Mark Antony* is great but enslaved by passion. Plutarch believes virtue is learned through understanding *both* strengths and weaknesses.

      *   *Claim 3: Parallel structure = Interchangeable universal types.*
          *   **Verdict:** Simplification. The parallels (*synkrisis*) are there to compare *specific* virtues and vices, not to say Greeks = Romans. It's often about cultural *translation* (showing Romans they can match Greek glory, and Greeks they can match Roman power). It highlights nuance, not interchangeability.

      *   *Claim 4: Modern historians don't take him seriously.*
          *   **Verdict:** **Wrong.** Historians value him immensely for cultural history, reception, and where other sources fail. They just don't treat him as a neutral fact-machine like (ideally) Thucydides.

      *   *Claim 5: "Ethical Stereoscopy".*
          *   **Verdict:** **Modern Gloss.** This sounds like a specific academic metaphor (possibly from Christopher Pelling or Timothy Duff?), but the roommate is using it rigidly. The *concept* of comparison yielding deeper insight is Plutarchan, but the term "stereoscopy" is modern literary criticism, not Plutarch's own framework. Also, the claim that it *only* applies to virtuous pairs is dubious. Comparing two flawed men (e.g., *Demetrius/Antony*) teaches just as much about the nature of failure.

