answer: |-
  On Earth and Twin Earth, nocturnal forests host identical beetles emitting a soft blue light via the exact same luciferin-oxidase biochemical pathway, indistinguishable to the naked eye. On Earth, the scientific community historically identified this mechanism correctly and teaches laypeople that the word "glimmer" denotes light produced specifically by this oxidative reaction. On Twin Earth, due to a centuries-old translation error in foundational texts, the scientific community erroneously classifies the identical light as a thermal byproduct of a distinct metabolic cycle called "Cycle-B," yet laypeople still defer to experts and use "glimmer" to denote light produced by Cycle-B. Neither layperson possesses spectrometers or biochemical knowledge; both stand in identical forests, point at identical beetles, and say "That is a glimmer," relying entirely on their respective communities to fix the meaning of the term beneath the observable surface.

  **Verdicts**
  *   **Putnam-Style Natural-Kind Externalism:** The reference is **identical**. For Putnam, reference is fixed by the causal connection to the underlying physical structure (the "nature" of the kind). Since the biochemical pathway is identical on both planets, the term "glimmer" refers to the same natural kind in both mouths, regardless of the Twin Earth experts' erroneous theoretical description.
  *   **Burge-Style Social Externalism:** The conceptual content is **different**. For Burge, content is individuated by the normative conditions of use established by the linguistic community. Because the Earth community normatively associates "glimmer" with an oxidative reaction and the Twin Earth community associates it with "Cycle-B," the concepts possessed by the laypeople differ, even though the extension is the same.
  *   **Pure Internalism:** The speaker's mental state is **identical**. Since both speakers have the same sensory experiences, behavioral dispositions, and accessible descriptive beliefs (e.g., "glowing bug light"), their narrow psychological states are indistinguishable.

  **Structural Feature and Collapse**
  The specific structural feature that drives the divergence between the Putnam and Burge verdicts is the **mismatch between social classification and physical essence on Twin Earth**. Putnam prioritizes the actual physical essence (causal theory), while Burge prioritizes the socially normative description (usage theory). If you strip away this feature—either by making the Twin Earth experts correct (aligning social theory with physical essence) or by making the physical essence different (standard Twin Earth)—the verdicts collapse back into alignment. In a standard Twin Earth case (different stuff), both theories agree reference and content differ. In a corrected Twin Earth case (same stuff, correct theory), both theories agree reference and content are the same. The scenario only separates them because the social norm diverges from the causal reality on one world but not the other.

  **Internalist Objection**
  A defender of internalism would attack this scenario by arguing that social facts determine *reference*, not *conceptual content*. They would concede that the Twin Earth layperson defers to experts and that this deference helps pick out objects in the world, but they would deny that the experts' hidden theoretical errors penetrate the speaker's mind to constitute the concept itself. For the internalist, the concept is exhausted by the speaker's cognitive access (the mode of presentation); since the speaker cannot distinguish the oxidative pathway from Cycle-B, their concept is simply "visible beetle-light." The social environment fixes what that concept refers to (if anything), but it does not alter the content of the mental state, which remains narrow and individually supervenient.
