  # Diachronic Rationality: A Decision Tree

  **Instructions:** Answer each question based on your intuition about the case described. Do not consult theory labels. Follow the path to your committed position.

  **1. The Agent Structure**
  When you make a plan for tomorrow, are you **negotiating with a different person** who happens to inhabit your body later, or **instructing your own future limbs**?
  *   **Negotiating:** → *Go to Leaf A.*
  *   **Instructing:** → *Go to Question 2.*

  **2. The Precommitment Constraint**
  To keep your promise to yourself against temptation, must you make the temptation **physically impossible** (burn the bridge), or is it enough that it is **mentally ruled out**?
  *   **Physically Impossible:** → *Go to Leaf B.*
  *   **Mentally Ruled Out:** → *Go to Question 3.*

  **3. The Fountain (Cyclic Tastes)**
  Consider a trader offering cyclic trades (A→B→C→A). Is the scenario where the trader **pays you** at every step just as rationally permissible as the scenario where **you pay him**?
  *   **Yes (Permissible):** → *Go to Question 4.*
  *   **No (Both Flawed):** → *Go to Question 5.*

  **4. The Pump That Never Runs (Isolation)**
  If you hold these cyclic tastes but live on a **desert island where no trader exists**, is there anything rationality requires you to fix?
  *   **Yes (Fix Required):** → *Go to Leaf C (Diagnosis).*
  *   **No (Nothing Wrong):** → *Go to Leaf D.*

  **5. Sensitivity Versus Brittleness**
  Which failure strikes you as worse: a plan whose content **swings with a trivially small change in payoff at a node you will never reach**, or a plan that requires you to **act against everything that speaks for acting otherwise at the node you are at**?
  *   **Swings Off-Path Worse:** → *Go to Question 6a.*
  *   **Act Against Reasons Worse:** → *Go to Question 6b.*

  **6a. The Status of the Plan (Resolute vs. Planning)**
  Does your prior plan guide you now because it was the **best calculation you made back then**, or because making it **changed your options now**?
  *   **Best Calculation:** → *Go to Leaf E.*
  *   **Changed Options:** → *Go to Leaf F.*

  **6b. The Anticipation of Self (Myopic vs. Sophisticated)**
  When you choose now, do you treat your future choice as a **fresh decision you will make**, or as a **fixed fact to be predicted**?
  *   **Fresh Decision:** → *Go to Leaf G.*
  *   **Fixed Fact:** → *Go to Leaf H.*

  ***

  ### The Leaves

  **Leaf A: Intrapersonal Bargaining**
  *Commitment:* You must view your own future welfare as belonging to a stranger, making prudence a form of altruism.

  **Leaf B: Ulysses Precommitment**
  *Commitment:* You are committed to paying to restrict your own freedom even in cases where you could simply wait and choose wisely.

  **Leaf C: *Diagnosis: Incoherent***
  *Reason:* If exploitability is the only fault (Q3), isolation removes the fault (Q4); claiming otherwise is contradictory.

  **Leaf D: Pragmatic Consistency (Misfortune View)**
  *Commitment:* You are committed to the view that a logically incoherent mind is rational if it is lucky enough to be isolated.

  **Leaf E: Resolute Choice**
  *Commitment:* You are committed to ignoring clear evidence that your current local reasons have changed since the plan was formed.
  *(Note: Extensionally equivalent to Leaf F in most standard cases; distinction requires metaphysics of intention.)*

  **Leaf F: Planning Agency**
  *Commitment:* You are committed to treating your own future voluntary choices as if they were physical constraints on your menu.
  *(Note: Extensionally equivalent to Leaf E in most standard cases; distinction requires metaphysics of intention.)*

  **Leaf G: Myopic Re-optimization**
  *Commitment:* You are committed to repeatedly sabotaging your own long-term goals because you refuse to predict your future weakness.

  **Leaf H: Sophisticated Choice**
  *Commitment:* You are committed to avoiding valuable options now because you know you will misuse them later.

  ***

  **Verdict:** Sensitivity Versus Brittleness | Resolute Choice and Planning Agency
