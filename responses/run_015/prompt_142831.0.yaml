      *   *Means:* No physical violence ("own arms"). Uses legal/economic mechanisms (patents, contracts, jurisdictions). Machiavelli emphasises "own arms" (Chapter 12-14). However, he also values *prudenza* (foresight). Is legal/economic manoeuvring equivalent to "arms"? In a modern context, perhaps, but Machiavelli is quite literal about military capacity. However, he also values the *law* (Chapter 12: "there cannot be good laws where there are not good arms").
