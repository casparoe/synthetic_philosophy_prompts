answer: |-
  1. **Political Guilt: The Word Choice**
  You define political guilt as liability for consequences, not moral blameworthiness. So why keep the word "guilt" at all?
  [He will say: Because citizens empower the state; "guilt" marks the seriousness of the bond, not just a debt.]
  **Follow-up:** But if it isn't blame, why does it carry the social stigma that ruins reputations?

  2. **Political Guilt: Longevity**
  Does this political liability survive if the political order itself collapses or is replaced by a democracy?
  [He will say: The new state inherits the obligations of the old to remain legitimate; citizens inherit the liability.]
  **Follow-up:** So a child born into the new regime pays for a state they never consented to? How is that not collective punishment?

  3. **Metaphysical Guilt: God vs. Solidarity**
  If we remove God from metaphysical guilt and leave only human solidarity, does the category vanish?
  [He will say: No, the solidarity among men is the ground; God is merely the witness to that broken bond.]
  **Follow-up:** Then isn't this just moral guilt scaled up? Why do we need a fourth category?

  4. **Metaphysical Guilt: Collapse Risk**
  You say metaphysical guilt transforms consciousness. If I feel that transformation, haven't I already satisfied moral guilt?
  [He will say: Moral guilt is about specific acts; metaphysical guilt is about being alive when others died.]
  **Follow-up:** But if I didn't cause the death, how is my survival a guilt rather than just a tragedy?

  5. **Moral Guilt: The Coercion Line**
  You say we can't demand martyrdom. Is that limit a principled right or just pity for weakness?
  [He will say: It is a recognition of human limits; morality cannot demand self-destruction.]
  **Follow-up:** If it's just limits, then moral guilt is a spectrum of courage, not a binary of right and wrong. Do you accept that?

  6. **Moral Guilt: Binary vs. Degree**
  If moral guilt depends on how much pressure I was under, isn't it always a matter of degree?
  [He will say: The judgment is binary before conscience, but the conditions vary.]
  **Follow-up:** But if conditions vary, how can you judge two people differently for the same act without external metrics?

  7. **Generations: The Renouncer Trap**
  Take a descendant who returns all inherited assets. Does that discharge their obligation?
  [He will say: No, because the obligation is not property but truth and memory.]
  **Follow-up:** If returning the money doesn't fix it, then the debt wasn't material. So why demand reparations from the state?

  8. **Generations: Expiry of Duty**
  You say the duty is to keep truth alive. Does that duty ever expire?
  [He will say: It lasts as long as the memory of the atrocity matters for human integrity.]
  **Follow-up:** What if future generations choose to forget? Do you condemn them for prioritizing their own future over your past?

  9. **Concrete Settlement: Who Owes What**
  Map your four types to concrete remedies. Who owes reparations, and who owes apologies?
  [He will say: Political guilt owes reparations; moral guilt owes inner change and apology; criminal owes punishment.]
  **Follow-up:** If only political guilt pays, then victims are compensated by people who aren't morally blameworthy. Is that justice?

  10. **Falsification: Evidence of Failure**
  What evidence would convince you this fourfold scheme has failed?
  [He will say: If it leads to renewed barbarism rather than renewal.]
  **Follow-up:** But if it fails, is it because the scheme is wrong, or because Germans simply refused to use it?
