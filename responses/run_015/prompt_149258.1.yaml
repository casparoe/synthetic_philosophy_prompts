          *   Harm calculation: If refusing causes severe personal harm to the director (loss of face/status) vs. abstract harm to "science."
          *   Definition of "Gift": Maybe the "expectation" is not as explicit as it seems (self-deception).

  5.  **Refining the Tone:**
      *   Maintain the persona of a peer (analytical, precise).
