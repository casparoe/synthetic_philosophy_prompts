  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Ethics committee member at a mid-size hospital revising crisis standards of care (CSC).
      *   **Task:** Provide a philosophical read on the implicit theory of "whether and how numbers count" in CSC protocols (triage scoring, tie-breaking, reallocation, HCW priority, organ harvesting taboo).
