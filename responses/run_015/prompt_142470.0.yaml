      *   *Revision on Taurek:* Taurek allows saving the one, but doesn't *require* it. He says you *may* save the one. But he denies you *must* save the five. CSC says you *must* save the five (if prognosis differs). So CSC contradicts Taurek's permissiveness regarding the numbers.
      *   *Revision on Reallocation:* Reallocation is highly contested in actual protocols. Many forbid it. This aligns more with a "do not harm" constraint than pure maximizing.
      *   *Revision on HCW:* Reciprocity is instrumental (keep the system running) or contractual (duty for benefit). Taurek might accept this if framed as mutual aid, but not if it overrides the equal claim of the patient.

