      *   *Philosophers to reference:* Miranda Fricker (Epistemic Injustice), Paul Ricoeur (Memory/History), Walter Benjamin (History from below), maybe post-colonial theorists (Linda Tuhiwai Smith).
      *   *Distinction:* Crucial to separate *ontological* claims (what happened) from *phenomenological* claims (what it felt like) vs. *normative* claims (who gets to speak). The prompt asks about "historical fact," which implies ontology.
      *   *Consistency:* The prompt asks if commitments are consistent. There's a risk of performative contradiction: claiming "multiple truths" while enforcing "community veto." I need to highlight this.

  5.  **Structuring the Response:**

