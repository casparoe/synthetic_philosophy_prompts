answer: |-
  The curatorial protocol you describe—granting parity or precedence to community memory over archival documentation in post-conflict settings—rests on a complex, hybrid philosophical framework. It blends epistemology, ethics, and social ontology. Below is a reconstruction of the implicit theory, an analysis of its internal coherence, and a contrast with an archival-supremacist alternative.

  ### I. The Implicit Theory: A Tripartite Framework

  The practice presupposes three interconnected philosophical commitments regarding evidence, identity, and the function of history.

  **1. Epistemology: The Plurality of Truth Regimes**
  The practice rejects a monolithic correspondence theory of truth (where a statement is true only if it matches an objective past reality verifiable by documents). Instead, it adopts a **pluralist epistemology**, often mirroring the South African Truth and Reconciliation Commission's distinction between "forensic truth" (factual, evidentiary) and "narrative" or "social truth" (experiential, communal).
  *   **Commitment:** Archival documents capture the *logic of the perpetrator* or the *bureaucracy of the state*, while oral testimony captures the *phenomenology of the victim*.
  *   **Implication:** A document can be factually accurate (e.g., a death certificate) yet historically misleading (e.g., listing "natural causes" for a politically motivated neglect). Therefore, testimony is not merely supplementary evidence; it is a corrective lens required to access the full causal reality.

  **2. Social Ontology: Memory as Constitutive**
  Defenders claim a group's self-understanding "partly constitutes the historical fact." This relies on a **social constructionist ontology**.
  *   **Commitment:** In post-conflict societies, the "historical fact" is not merely the physical event that occurred, but the *social meaning* that event holds for the surviving community. If a community remembers a massacre as a foundational act of resistance, but archives label it a "riot," the archival label fails to capture the *social reality* that continues to shape the present.
  *   **Implication:** History is not a closed past but an active resource for present identity. Therefore, the "truth" of the event includes its downstream effects on collective identity.

  **3. Normative Ethics: Epistemic Justice and Sovereignty**
  The grant of "final editorial authority" is fundamentally a normative claim rooted in **epistemic justice** (Miranda Fricker) and **narrative sovereignty**.
  *   **Commitment:** Marginalized groups have suffered "testimonial injustice" (systematic credibility deficits). Restoring justice requires not just hearing them, but granting them authority over the framing of their own suffering.
  *   **Implication:** The right to control one's narrative is a form of self-determination. Professional historians, often aligned with state institutions, are viewed as potential agents of continued epistemic violence if they retain veto power.

  ### II. Strict Requirements vs. Compatible Extensions

  To evaluate the philosophical robustness of this practice, we must distinguish what is logically necessary for the protocol to function from what is merely ideological padding.

  | **Strictly Required** | **Merely Fits Well (Contingent)** |
  | :--- | :--- |
  | **Fallibilism of Archives:** The belief that documents are inherently biased, incomplete, or products of power structures. | **Radical Constructivism:** The belief that *no* objective past exists. (The practice only requires archives to be *flawed*, not that objective reality is inaccessible.) |
  | **Epistemic Privilege of Lived Experience:** The claim that victims possess knowledge (affective, causal) inaccessible to third-party observers. | **Infallibility of Testimony:** The belief that oral memory is never mistaken. (The protocol usually allows for internal community debate; it does not require every individual story to be factually perfect.) |
  | **Normative Priority of Repair:** The goal of the museum is social cohesion/healing, not just record-keeping. | **Identity Essentialism:** The belief that the "community" is a monolithic block with a single voice. (The practice can function with representative councils without assuming total homogeneity.) |

  ### III. Consistency and Tensions

  The implicit theory contains significant internal tensions, particularly between its epistemic and normative claims.

  **1. The Epistemic-Normative Blur**
  Defenders claim this is "epistemology, not politics." However, granting "final editorial authority" is a political act, not an epistemic one.
  *   **Tension:** If the community's memory is granted authority because it is *truer* (epistemic), then professional historians should agree upon investigation. If historians disagree but are overruled anyway, the authority is *normative* (right to decide), not epistemic.
  *   **Inconsistency:** The practice risks a performative contradiction: it claims to reveal a deeper truth (epistemology) while utilizing a veto mechanism that bypasses truth-seeking procedures (politics). It asserts "this is what happened" based on "you have the right to say what happened."

  **2. Pluralism vs. Authority**
  The protocol suggests presenting "both accounts without ranking," yet grants the community "final editorial authority."
  *   **Tension:** If the community has final authority, the accounts are effectively ranked. The archival view becomes a dissenting footnote to the community's master narrative.
  *   **Consistency Check:** This is consistent only if "public framing" is distinguished from "factual record." If the museum is defined as a space of *memory* rather than *history*, the tension dissolves. If it claims to be a history museum, the tension remains acute.

  ### IV. Accepted vs. Contested Commitments

  It is crucial to separate standard historical methodology from the specific philosophical innovations of this protocol.

  **Broadly Accepted:**
  *   **Testimony is Evidence:** Oral history is a legitimate historical source.
  *   **Archives are Biased:** Documents reflect the perspective of their creators (usually the state/victors).
  *   **Memory Matters:** Collective memory influences political reality regardless of its factual accuracy.

  **Genuinely Contested:**
  *   **Constitution of Fact:** The claim that memory *constitutes* the historical fact (ontological claim) is rejected by realists. Most historians argue memory *interprets* the fact, but does not *make* it.
  *   **Epistemic Hierarchy:** The claim that lived experience trumps documentary verification on matters of *chronology or causality* is highly contested. (e.g., If a community remembers a battle occurring in 1990, but documents prove 1991, does the community's "truth" override the date?)
  *   **The Role of the Historian:** The idea that professional detachment is a form of violence (rather than a safeguard against bias) is a specific critical theory stance, not a consensus view.

  ### V. Counterfactual: If Archival Accuracy Were Decisive

  If the underlying framework were replaced by one treating archival accuracy as always decisive (a "Positivist-Realist" model), museum and memorial practice would undergo the following structural changes:

  1.  **Shift from Participatory to Didactic:**
      *   **Current:** Communities co-curate; exhibitions are dialogic.
      *   **New:** Historians curate; communities are consulted as sources, not editors. The museum becomes an authority *speaking to* the public, rather than a platform *for* the public.

  2.  **Reclassification of Testimony:**
      *   **Current:** Testimony is evidentiary and constitutive.
      *   **New:** Testimony is relegated to the "affective" or "illustrative" wing. It would be presented as "how this event was experienced" rather than "what this event was." Discrepancies would be resolved by footnotes privileging the document.

  3.  **Risk of Alienation:**
      *   In post-conflict societies, "truth" is often a prerequisite for trust. If the archive (often a legacy of the oppressive regime) is the sole arbiter, the institution risks being viewed as an extension of the former oppressor. The "Archival Supremacy" model prioritizes *factual precision* over *social legitimacy*.

  4.  **Definition of Success:**
      *   **Current:** Success is measured by community buy-in, healing, and recognition.
      *   **New:** Success is measured by factual accuracy, citation integrity, and peer review standards.

  ### Conclusion

  The curatorial protocol you describe depends less on a unified theory of knowledge and more on a **normative override of epistemology**. It strictly requires the belief that archives are structurally compromised and that restorative justice requires narrative sovereignty. While it fits well with radical social constructionism, it does not strictly require it; it only requires that the *social cost* of correcting community memory outweighs the *epistemic benefit* of archival precision.

  The practice is internally consistent only if one accepts that in post-conflict contexts, **social truth (what binds or divides the society) is more functionally real than forensic truth (what can be proven in a court).** If one rejects this hierarchy and treats archival accuracy as decisive, the museum ceases to be a site of memory-work and becomes a site of record-keeping, potentially gaining factual rigor at the expense of social reconciliation.
