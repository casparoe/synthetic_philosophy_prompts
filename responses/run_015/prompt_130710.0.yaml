          *   *Conflict:* Sperling's evidence relies on the subject saying "I saw more than I could report." (6) accepts verbal report. But (6) says report is evidence for *consciousness*. In Overflow, the report is *limited* (access), but the claim is about *phenomenality* exceeding report.
