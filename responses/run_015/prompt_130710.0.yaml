          *   *Conflict:* Is there a tension? Not logically, *but* empirically it's tricky. If GWT defines access via ignition, and Overflow says there's rich phenomenality *without* ignition/report, then (5) supports (1). However, GWT proponents often argue Overflow is an illusion (access *is* consciousness).
