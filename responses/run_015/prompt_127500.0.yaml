answer: |-
  This is a sophisticated stalemate, and your three-way distinction (Diversity, Tolerance, Grain) is the correct scalpel for dissecting it. However, testing your hypothesis requires pushing past the diagnosis of *confusion* to a diagnosis of *category error*.

  Here is the diagnosis of the disagreement, the assessment of your three claims, and the specification of progress.

  ### 1. The Kind of Disagreement
  This is not merely a verbal dispute, nor is it a standard substantive metaphysical disagreement. It is a **clash between metaphysical realism and explanatory pragmatism regarding the grounds of modality.**

  *   **The Reductionist** is typically a metaphysical realist about the physical base and a pragmatist about the special sciences. For them, "kindhood" is ultimately cashed out in physical similarity. If psychological kinds group physically dissimilar items, that grouping is useful for *us*, but it does not track a joint in nature that is independent of the physical joints.
  *   **The Anti-Reductionist** wants the special science kinds to be metaphysically robust. They want the psychological kind to support counterfactuals *in virtue of being that psychological kind*, not merely in virtue of being a disjunction of physical kinds.

  The stalemate persists because both sides agree on the physics but disagree on what *grounds* the modal stability of the special science. The reductionist says physical similarity (or physical laws) grounds all modality. The anti-reductionist says functional role grounds modality, potentially overriding physical dissimilarity.

  Because "multiple realizability" is used to bridge these two positions, it is asked to do two incompatible jobs: report an empirical fact (Diversity) and secure a metaphysical conclusion (Autonomy).

  ### 2. Evaluating the Three Claims
  Your hypothesis is that the debate persists because the argument needs all three claims while sides retreat to the unthreatened one. You are correct, but the hierarchy matters.

  *   **Diversity (Actual Variation):** This is dialectically inert. Reductionists concede this immediately. "Yes, brains differ." It is evidence, not an argument. It cannot sustain autonomy.
  *   **Grain (Description):** This is the control variable. As you note with the "Grain Ratchet," if grain is arbitrary, MR is trivial. If grain is fixed by nature, we need a criterion. The reductionist argues grain is fixed by physical similarity; the anti-reductionist argues it is fixed by functional similarity. This is not a factual dispute; it is a dispute about *which similarity metric is ontologically privileged*.
  *   **Tolerance (Modal Robustness):** **This is the load-bearing claim.** Anti-reductionism collapses without it. Diversity only matters if it implies Tolerance (i.e., the psychological state survives the physical variation). Tolerance is what secures autonomy. If the psychological kind is not tolerant of physical perturbation *in a way that the physical disjunction is not*, then the psychological kind adds no modal value.

  **Can Tolerance survive the standard moves?**
  Generally, no, not in the strong metaphysical sense the anti-reductionist wants.
  1.  **The Disjunction Move:** If every instance of the psychological kind $P$ is identical to some physical kind $M_1 \lor M_2 \lor \dots \lor M_n$, then the counterfactuals supported by $P$ are supported by the disjunction. The anti-reductionist must argue the disjunction is "gerrymandered" or "heterogeneous." But "heterogeneous" just means "dissimilar at the Grain we prefer." This circles back to Grain.
  2.  **Causal Exclusion:** If $P$ is tolerant of physical variation, does it have causal powers distinct from its realizers? If yes, overdetermination. If no, epiphenomenalism. The anti-reductionist usually retreats to "causal relevance" rather than "causal production," which concedes the metaphysical high ground to the reductionist while keeping the explanatory utility.
  3.  **Taxonomy Relativity:** If Tolerance is measured by "how much physical change can $P$ withstand?", the answer depends on how we individuate the physical change (Grain). If we individuate physically finely, Tolerance is high. If we individuate functionally, Tolerance is tautological.

  Therefore, Tolerance cannot survive as a *metaphysical* constraint independent of Grain. It is derivative of Grain.

  ### 3. The ANN Test Case
  Your intuition about Artificial Neural Networks is correct: they reproduce the ambiguity rather than settling it.

  *   **Weight Space vs. Function Space:** Two networks can have identical input-output mappings (high functional similarity) but disjoint weight configurations (high physical Diversity). This looks like MR.
  *   **Permutation Symmetry:** We can permute hidden units without changing function. Is this MR? Most say no. Why? Because we shift the Grain to "connectivity graph up to isomorphism."
  *   **Convergence:** Recent work suggests networks converge on similar internal representations (low Diversity). This looks like Identity Theory.

  **The Diagnosis:** The ANN case proves that "structure" and "function" are not pre-theoretic givens. They are metrics we impose.
  *   If you measure distance in weight space, you get MR.
  *   If you measure distance in activation space (representational similarity), you get Identity.
  *   If you measure distance in loss landscape topology, you get something else.

  The empirical data does not move the dial because the metaphysics dictates the metric. The reductionist chooses the metric that minimizes MR (fine-grained physical structure or coarse-grained functional abstraction); the anti-reductionist chooses the metric that maximizes MR (coarse-grained physical structure or fine-grained functional abstraction). The ANN case demonstrates that **MR is not a discovery about the world; it is a consequence of the chosen similarity metric.**

  ### 4. What Counts as Progress?
  Given this diagnosis, empirical progress is impossible. Conceptual progress is limited. The only viable paths are:

  1.  **A Principled Grain-Fixing Criterion:** You need a non-arbitrary standard for when two physical states count as the "same kind" for the purposes of realization. This cannot be "physical similarity" (reductionist) or "functional similarity" (anti-reductionist) without begging the question. It would likely require a **causal invariance** account: Two realizers are the same kind if they participate in the same causal laws *under the same interventions*. This shifts the debate from "What is MR?" to "What is the correct intervention set?"
  2.  **A Formal Measure of Tolerance:** A perturbation-based metric applicable to both biological and artificial systems. For example, a measure of the volume of physical state-space that maps to a specific functional output, normalized by the complexity of the mapping. If this volume is large and disconnected, MR is high. If it is small and connected, MR is low. This makes MR a continuous variable, not a binary switch.
  3.  **Dissolution:** The strongest argument is that the question should be dissolved. MR is not a metaphysical thesis; it is a claim about **explanatory efficiency**. "Psychological kinds are multiply realized" means "It is more computationally efficient to predict behavior using psychological taxonomy than physical taxonomy." This grants the anti-reductionist autonomy (pragmatic) and the reductionist ontology (physical).

  ### 5. The Bite Against Your Hypothesis
  You asked for a reason why no progress should be expected, stated so that it bites against your three-way distinction.

  Here it is: **Your three-way distinction assumes Diversity, Tolerance, and Grain are independent variables that can be disentangled to find the "real" argument. They are not.**

  *   **Grain determines Tolerance.** You cannot measure how tolerant a kind is to physical perturbation without first deciding what counts as a "physical perturbation" versus a "same-kind variation." That decision *is* fixing the Grain.
  *   **Diversity is a function of Grain.** Actual variation in the world is infinite. Whether that variation counts as "multiple realizers" or "variation within a realizer" depends entirely on the Grain.

  Therefore, separating the three claims does not solve the stalemate; it reveals that **Tolerance is not a modal fact about the world, but a reflection of the Grain.**

  If Grain is interest-relative (as the reductionist argues), then Tolerance is interest-relative. If Tolerance is interest-relative, it cannot ground the *metaphysical* autonomy the anti-reductionist seeks. It can only ground *methodological* autonomy.

  **The Verdict:** The debate persists because the anti-reductionist is trying to use a pragmatic tool (Grain-relative Tolerance) to win a metaphysical war (Ontological Autonomy). The reductionist knows this but keeps fighting on metaphysical grounds because they want to preserve causal closure.

  **Progress** will not come from better empirical data (ANNs, neuroscience) or finer conceptual distinctions (Diversity vs. Tolerance). It will only come from one side conceding the domain of the other:
  *   **Anti-reductionists** must concede that MR does not entail ontological distinctness, only explanatory indispensability.
  *   **Reductionists** must concede that explanatory indispensability grants a form of autonomy that makes reduction *practically* impossible, even if *metaphysically* true.

  Until the debate is reframed as **Ontology vs. Explanation** rather than **Identity vs. MR**, the stall will continue. Your three-way distinction is the perfect map of the trap, not the escape route.
