ifies the rotation mechanism, distinguishes it from ad hoc immunization in science, from simple fallacies of ambiguity, and from well-known accounts of an artwork's special presence in an age of reproduction, and that clarifies whether the pattern applies only to tangible artifacts or extends to performances, reconstructed historical documents, and digital works produced from identical code. I am not looking for a bibliography; I want to understand the conceptual boundaries of the phenomenon itself.
