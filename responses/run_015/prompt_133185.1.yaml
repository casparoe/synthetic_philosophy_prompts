answer: |-
  There is no single, canonical philosophical term (like *ad hominem* or *Motte-and-Bailey*) that specifically names this three-stage rotation of justifications in aesthetics. However, your analysis is precise: you have identified a sophisticated dialectical maneuver that sits at the intersection of informal logic and ontological theory.

  In informal logic, this is broadly categorized as a variant of **Moving the Goalposts**, but that label is too crude for what you are describing. Standard "Moving the Goalposts" implies arbitrary rule changes. In your observation, the defender shifts between *substantive, philosophically robust categories* (Material, Intention, History).

  A more precise descriptive label for this phenomenon is **Defensive Ontological Shifting**.

  Below is a careful definition of the pattern, its distinctions from related concepts, and its scope across different media.

  ### 1. Conceptual Definition: Defensive Ontological Shifting

  **Mechanism:**
  This pattern occurs when a defender seeks to preserve a fixed normative conclusion (e.g., "The original possesses superior value") against successive empirical counterexamples. To maintain the conclusion, the defender sequentially shifts the *ontological ground*—the fundamental category of existence—upon which the value is based.

  **The Rotation Structure:**
  1.  **Material Grounding:** Value is located in the physical substrate (the atoms, the brushstrokes).
      *   *Vulnerability:* Falsified by evidence of workshop assistance or material degradation.
  2.  **Intentional Grounding:** Value is relocated to the mental state of the creator embodied in the object.
      *   *Vulnerability:* Falsified by perfect replicas executed under identical plans/intentions.
  3.  **Historical-Causal Grounding:** Value is relocated to the object's spatiotemporal trajectory (provenance).
      *   *Vulnerability:* Difficult to falsify empirically, but renders the value non-perceptual and purely ceremonial.

  **Key Characteristic:**
  Unlike a standard fallacy where the arguer uses weak premises, the premises used here (Materiality, Intentionality, Provenance) are all *legitimate* competing theories of artistic identity. The fallacy lies not in the premises themselves, but in the **strategic interchangeability** of them to immunize a conclusion that cannot survive scrutiny under any single consistent theory.

  ### 2. Distinctions from Related Concepts

  You correctly noted that this is not quite *Motte-and-Bailey*, *Equivocation*, or scientific *Ad Hoc* immunization. Here are the conceptual boundaries:

  **Vs. Ad Hoc Immunization (Philosophy of Science)**
  *   **Science:** In scientific theory protection (e.g., Lakatos's "research programmes"), an *auxiliary hypothesis* is added to save a core law from falsification (e.g., "The planet is there, but obscured by dust"). The core law remains unchanged.
  *   **Art Pattern:** Here, the "core law" (the reason for the value) *is* what changes. The defender does not add a clause; they swap the foundation. They move from "Value = Matter" to "Value = Mind" to "Value = History." This is a **Foundational Swap**, not an Auxiliary Addition.

  **Vs. Equivocation (Logic)**
  *   **Equivocation:** This fallacy relies on semantic ambiguity within a single argument (e.g., using "light" to mean "not heavy" in premise 1 and "photons" in premise 2).
  *   **Art Pattern:** The defender is not confusing terms. They are sincerely applying different philosophical frameworks in response to new information. The shift is **dialectical** (occurring over time turns) rather than **semantic** (occurring within a sentence).

  **Vs. Walter Benjamin's "Aura" (Aesthetics)**
  *   **Benjamin:** Benjamin describes the *phenomenon* of the original's authority (the "Aura") as decaying in the age of mechanical reproduction. He attributes this primarily to the **Historical-Causal** dimension (the third stage of your pattern).
  *   **Art Pattern:** Your pattern describes the *argumentative defense* of that Aura. A defender using Defensive Ontological Shifting might start with Materiality (which Benjamin largely dismisses) before retreating to History (which Benjamin accepts). Benjamin provides a theory of *why* the original feels valuable; your pattern describes *how* people argue for that value when challenged.

  ### 3. Scope and Application

  You asked whether this pattern applies only to tangible artifacts. It does not. Because the three ontological grounds (Material, Intention, History) are universal categories of identity, the pattern extends to any medium where "originality" is contested.

  **Performance (Theater/Music)**
  *   **Material:** "The original performance is better because the specific actors' bodies were present."
      *   *Objection:* The actors are different in the revival, or the original recording is played.
  *   **Intentional:** "It is about the Director's/Composer's vision being realized."
      *   *Objection:* A reconstruction follows the exact same stage directions and score.
  *   **Historical:** "It is about being at the Premiere; the historical event of the first showing."
      *   *Result:* The value shifts from the performance itself to the attendance of the event.

  **Digital Works (NFTs/Code)**
  *   **Material:** "This is the original file (the specific data string on the creator's drive)."
      *   *Objection:* Digital files are perfectly copyable; the bits are identical.
  *   **Intentional:** "It is the version authorized by the creator's digital signature."
      *   *Objection:* A forger replicates the signature or the code is open source.
  *   **Historical:** "It is the specific token on the blockchain with the unique transaction history."
      *   *Result:* Value resides entirely in the ledger (provenance), not the image or code.

  **Reconstructed Documents (History/Text)**
  *   **Material:** "This parchment is from the 12th century."
      *   *Objection:* The ink is modern; the parchment was restored.
  *   **Intentional:** "It conveys the Author's exact words."
      *   *Objection:* A modern typeset edition contains the exact same words.
  *   **Historical:** "This specific object was held by the King."
      *   *Result:* Value becomes purely relic-based, unrelated to the text's content.

  ### 4. Conceptual Boundary: When is it *Not* a Fallacy?

  It is important to note that **Defensive Ontological Shifting** is only fallacious when used to block inquiry into a fixed conclusion.

  In genuine philosophical inquiry, an interlocutor might say: *"I initially thought value was material, but your objection persuades me that intention matters more. However, now I see intention isn't enough, so perhaps history is the key."*

  This is **Reflective Equilibrium**. The difference lies in the **direction of fit**:
  *   **Reflective Equilibrium:** The conclusion changes to fit the best premise. (Honest inquiry)
  *   **Defensive Ontological Shifting:** The premise changes to fit the fixed conclusion. (Defensive maneuver)

  ### Summary

  While there is no historical Greek or Latin term for this specific rotation, you have accurately isolated a distinct argumentative structure. It is best defined as **Defensive Ontological Shifting**: a dialectical strategy where a fixed normative valuation is preserved by sequentially rotating through competing ontological categories (Material, Intentional, Historical) as each is successfully challenged. It differs from scientific *ad hoc* rescue because it swaps foundational grounds rather than adding auxiliary clauses, and it applies universally across physical, performative, and digital media wherever "authenticity" is contested.
