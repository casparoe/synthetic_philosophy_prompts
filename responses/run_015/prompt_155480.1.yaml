answer: |-
  ### Part I: The Translation

  Your taxonomy is standard and accurate enough for this work. I will not adjust it.

  Here is the heterogeneity problem and the three replies, translated into the vocabulary of statistical thermodynamics and measurement theory.

  **The Objection (The Heterogeneity Problem)**
  The hedonist proposes a macrovariable $P$ (Pleasantness) that serves as a state function determining the value of a system state (a life or experience). The objector argues that the microstates corresponding to high-$P$ configurations (scratching, listening, solving) share no common structural order parameter. Unlike Temperature ($T$), which reduces to mean kinetic energy in gases, lattice vibrations in solids, or spin populations in magnets, the microstructural realizers of $P$ have no common metric. Therefore, $P$ is not a natural kind intensive variable but a folk-classification label applied to a heterogeneous set of microstates.

  **Reply 1: The Feeling Theory (The Latent Variable Model)**
  There *is* a common microstructural feature, a "hedonic tone" $h$, analogous to mean molecular kinetic energy. It is an intensive property present in all high-$P$ states. We fail to detect $h$ spectroscopically (phenomenally) because our measurement apparatus (attention) is coupled to the extensive variables (the content of the experience: the drink, the music) rather than the intensive variable $h$. $h$ exists as a latent factor inferred from the covariance of the data, even if it is not immediately resolved in every spectrum.

  **Reply 2: The Attitudinal Theory (The Functional/Operational Model)**
  $P$ is not defined by microstructural composition but by its causal role in the system's dynamics. Just as $T$ is operationally defined by the Zeroth Law (equilibrium conditions) and its role in driving heat flow ($dQ = TdS$), Pleasantness is defined by its role in driving choice behavior and reinforcement. The unity of $P$ is unity-by-relation. It does not matter if the microstates differ; what matters is that they all couple to the "will" or "preference" subsystem in the same direction. $P$ is a functional variable defined by its coupling coefficient to action.

  **Reply 3: The Adverbial Theory (The Distribution/Mode Model)**
  The demand for a common component is a category error. $P$ is not a variable in the Hamiltonian (a component of the energy); it is a modification of the probability distribution over the states. One does not experience "pleasure" plus "music"; one experiences the music *with a high probability density*. Pleasantness is a property of the *manner* in which the state is occupied. It is not a separable degree of freedom; it is a parameter describing the shape of the occupancy function itself.

  ***

  ### Part II: The Residue Report

  Here is where the translation holds, where it strains, and where it snaps.

  #### 1. The Feeling Theory
  *   **Translates Cleanly:** The logic of latent variables. In spectroscopy, we often infer a transition dipole or a vibrational mode that is not directly visible but is required to make the Hamiltonian fit the observed spectrum. The claim that attention is coupled to the "content" (extensive) rather than the "tone" (intensive) is a plausible measurement error model.
  *   **Distorted:** In thermodynamics, if a latent variable exists, it must eventually be measurable by *some* apparatus. The Feeling Theorist claims the variable is phenomenal. In your vocabulary, "measurable" implies public, inter-subjective instrumentation. In the philosophy of mind, "measurable" often means "accessible only to the system itself." You are smuggling in privacy as a measurement constraint.
  *   **Inexpressible:** The *valence*. In chem, a variable is positive or negative by convention. In hedonism, the "positive" nature of pleasure is intrinsic to the measurement. There is no physical analogue for a variable that *commands* attention rather than just registering it.

  #### 2. The Attitudinal Theory
  *   **Translates Cleanly:** This is pure Functionalism, which maps perfectly to operational definitions in thermodynamics. We define $T$ by what it *does* (equilibrates), not what it *is*. The Attitudinalist defines Pleasure by what it *does* (motivates pursuit). The heterogeneity of microstates is irrelevant, just as the heterogeneity of gas vs. solid is irrelevant to thermometry.
  *   **Distorted:** Thermodynamics assumes the system is passive regarding the definition of $T$. A gas does not "care" if it is measured. The Attitudinal theory relies on the system having a "pro-attitude." This introduces a feedback loop (the system observing its own state and modifying it) that is not present in standard equilibrium thermodynamics. You are moving from statistical mechanics to control theory.
  *   **Inexpressible:** The *normativity*. Temperature predicts heat flow; it does not prescribe it. Pleasantness is supposed to explain why an agent *should* pursue a state. The translation captures the *prediction* of behavior but loses the *justification* of value.

  #### 3. The Adverbial Theory
  *   **Translates Cleanly:** Almost nothing. This is the hardest fit. The closest analogue is treating pleasantness as a non-equilibrium distribution parameter or a modification of the partition function $Z$. It treats the property as global rather than local.
  *   **Distorted:** To say an experience is had "pleasurably" is to describe the *quality* of the occupation. In chem, the distribution is mathematical. In mind, the distribution is *felt*. You can describe the Boltzmann distribution without the gas "feeling" anything. The Adverbialist claims the "feeling" is the distribution.
  *   **Inexpressible:** The *What-It-Is-Like*. Your vocabulary has no slot for the interiority of the measurement. In chem, a property either exists structurally/relationally or it is an illusion. The Adverbialist claims there is a real property that is neither structural nor relational, but *modal*. Physics has no "modes of being," only states of being.

  ***

  ### Part III: The Three Crux Points

  You identified the stress points correctly. Here is the blunt assessment.

  **1. Metaphysical vs. Epistemological Objection**
  The Temperature analogy discharges the *metaphysical* objection (multiple realizability is fine; microstates need not look alike) but silently ignores the *epistemological/phenomenological* objection.
  *   **The Trick:** When we say gas and spin systems both have Temperature, we verify this by bringing them into thermal contact (Zeroth Law). They equilibrate. There is a public test.
  *   **The Break:** When we say an itch and a symphony are both Pleasant, there is no "thermal contact" between them that equilibrates. The only verification is the subject's report. The Temperature analogy works only if you treat "Pleasantness" as a third-person behavioral predictor. If you treat it as a first-person datum, the analogy fails. The objection is not just "are the microstates different?" (Metaphysical); it is "is there a single *sensation* corresponding to the variable?" (Epistemological). Temperature has no sensation. Pleasantness is defined by it.

  **2. Attitudinal Reply vs. Functional Temperature**
  Yes, this is the same manoeuvre. Defining $T$ by its role in the causal network (heat flow) is exactly defining Pleasure by its role in the causal network (choice).
  *   **What it buys:** It solves the heterogeneity problem instantly. Microstructural diversity is irrelevant to functional role.
  *   **What it costs:** It severs the link to phenomenology. If Temperature were defined *only* by heat flow, we would still have a valid physical quantity. But if Pleasure is defined *only* by pursuit, we have "Reward," not "Pleasure." We have lost the *feel*. The Attitudinalist accepts this cost; they argue the feel is not the value. But if your goal is to explain *why* the feel matters, the functional definition is circular: "We pursue it because it is the thing we pursue."

  **3. The Adverbial View and Structural Vocabulary**
  You are correct to suspect this has no counterpart.
  *   **The Hard Truth:** Your vocabulary treats every property as structural (arrangement of parts) or relational (interaction with other systems). The Adverbial view posits a property that is intrinsic to the *subject's relation to the property*.
  *   **The Break:** In spectroscopy, a transition is allowed or forbidden. It is not "experienced loudly." The Adverbial view requires a category of "subjective mode" that physics eliminates by design. To translate this, you would need to treat the observer as part of the Hamiltonian in a way that standard physics does not permit. It is not just that you lack the word; it is that your ontology excludes the entity.

  ***

  ### Part IV: Final Judgment

  You asked where the residue comes from: Is your vocabulary missing something real, or is the philosophers' question disunified?

  **My verdict: The question is disunified.**

  The word "Pleasantness" is doing double duty, and the Temperature analogy exposes this by forcing a choice.

  1.  **Pleasantness as a Control Variable (The Physicist's View):** This is the signal that drives the system toward specific microstates. It is measurable by choice behavior. It is multiple-realizable. It is analogous to Temperature or Chemical Potential. The Heterogeneity Objection fails here, just as it fails for Temperature. The Attitudinal Theory is the correct translation for this concept.
  2.  **Pleasantness as a Phenomenal Quality (The Philosopher's View):** This is the "what-it-is-like." It demands a common qualitative tone. The Heterogeneity Objection succeeds here, because there is no common tone. The Feeling Theory tries to save it by positing a hidden variable, but fails to specify the measurement.

  **The Blunt Truth:**
  Your Temperature example is a rhetorical trick *if* used to solve the Phenomenal problem. It solves the Control problem.
  *   Temperature is a macrovariable that summarizes micro-behavior for the purpose of *prediction*.
  *   Philosophers often want Pleasantness to be a macrovariable that summarizes micro-behavior for the purpose of *justification* (Ethics) and *experience* (Phenomenology).

  The residue you feel is not a failure of your vocabulary. It is the friction generated when you try to map a first-person ontology (phenomenology) onto a third-person ontology (thermodynamics).
  *   If the Hedonist means "Pleasure is the reward signal that optimizes system survival," your vocabulary handles it perfectly (Attitudinal/Functional).
  *   If the Hedonist means "Pleasure is the intrinsic qualitative glow that makes life worth living," your vocabulary cannot touch it, because physics has no "worth" and no "glow."

  **Recommendation:**
  Do not try to force the Adverbial or Feeling theories into statistical mechanics. They are attempts to describe the *interiority of the measurement apparatus*, which statistical thermodynamics explicitly excludes to function. The Heterogeneity Problem is only a problem if you insist that the Control Variable (Reward) must also be a Phenomenal Quality (Sensation). The Temperature analogy proves they need not be the same thing. Gas has Temperature without sensation. Humans have Reward without a common sensation.

  The philosophers are arguing over whether the word "Good" refers to the *thermometer reading* or the *feeling of heat*. Your vocabulary measures the reading. It cannot measure the feeling. That is not a bug in your vocabulary; it is the definition of physics.
