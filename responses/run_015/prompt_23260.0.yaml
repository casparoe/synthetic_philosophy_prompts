answer: |-
  Welcome to the fray. It is a muddle, but you are asking exactly the right question. As an evolutionary biologist, you have a distinct advantage here: you already understand *selected effects*, which is the engine of Millikan's view. The friction arises because Dretske (particularly in his earlier, causal-informational work) grounds meaning in *nomic regularities* (law-like causal connections) rather than selection history alone.

  The split you are looking for is best illuminated by a case of **evolutionary lag** or **ecological trap**, where the current causal structure of the environment diverges from the historical selection pressure that shaped the trait.

  Let's use a classic piece of ethology that should feel familiar: **the Three-Spined Stickleback (*Gasterosteus aculeatus*) and the Red Belly Sign Stimulus.**

  ### The Biological Setup

  *   **The Trait:** Male sticklebacks in breeding condition develop a red ventral coloration. They also possess a neural mechanism (likely in the optic tectum) that triggers aggressive territorial defense when presented with a specific visual stimulus: a red patch below the horizon line.
  *   **The Historical Function:** In the ancestral environment, a red patch below the horizon was nomically correlated with one thing: **a rival male intruder.** Snapping at it defended territory and genes.
  *   **The Current Scenario (The Mismatch):** Imagine a population of sticklebacks in a stream running past a parking lot. A red delivery truck drives by, reflecting a red patch onto the water's surface. The male stickleback sees the red reflection and initiates an aggressive attack display.

  There are no rival males present. There is only the truck. The frog (or fish) is acting on a representation of the world. The question is: **What is the content of that neural token?** Does it mean "Rival Male" or does it mean "Red Patch"?

  ### 1. Millikan's Etiological Account (Teleosemantics)

  For Ruth Millikan, content is fixed by **proper function**, and proper function is defined by **selection history**.

  *   **The Analysis:** The neural mechanism exists *because* ancestors who detected rival males survived and reproduced. The "Proper Function" of the mechanism is to indicate *Rival Male*.
  *   **The Content:** The content of the neural token is **"Rival Male Present."**
  *   **The Verdict on the Truck:** When the fish attacks the truck's reflection, it is **misrepresenting** the world. The mechanism is malfunctioning relative to its proper function, even if the mechanism is working exactly as designed physiologically. The content is determined by what the trait was *selected to track*, not what it is *currently tracking*.
  *   **Why this fits your intuition:** This aligns perfectly with the "Selected Effect" definition of function you've used for 30 years. A heart pumps blood even if it's currently pumping air (embolism), because its function is defined by its history, not its current output. Millikan treats representation the same way.

  ### 2. Dretske's Causal/Informational Account

  Fred Dretske's early theory (e.g., *Knowledge and the Flow of Information*) grounds content in **reliable causal covariation**. A state $R$ represents state $S$ only if $R$ carries the *information* that $S$, which requires a nomic (law-like) dependency: if $R$ occurs, $S$ must have occurred.

  *   **The Analysis:** For the neural state to carry the information "Rival Male," the occurrence of the neural state must nomically depend on the presence of a rival male.
  *   **The Problem:** In the current environment, the neural state is being caused by a **Red Truck Reflection**. There is no nomic connection between "Truck Reflection" and "Rival Male." Therefore, strictly speaking, the neural state does *not* carry the information "Rival Male."
  *   **The Content:** Dretske is forced to say the content is either:
      1.  **"Red Patch"** (the immediate causal cause).
      2.  **"Rival Male OR Red Truck"** (a disjunctive content).
  *   **The Verdict on the Truck:** If the content is "Red Patch," the fish is representing the world **accurately**. There is a red patch; the fish detects it. There is no misrepresentation, only a loss of utility. If the content is disjunctive ("Rival OR Truck"), the representation is again **true** (since a truck is present).
  *   **The Fix (and the Split):** Dretske later tried to solve this by introducing "functional fixation" during a learning period. But for innate traits (like the stickleback's), he leans heavily on the *current* informational channel. If the environment changes such that the signal no longer reliably indicates the historical object, Dretske's account suggests the *content shifts* to match the new cause. Millikan's account says the *content stays* and the system enters error.

  ### Where the Misrepresentation Problem Lives

  This is the crux of the philosophical "muddle" you encountered.

  **For Millikan, misrepresentation is a historical mismatch.**
  Error is easy to explain. You have a trait selected for $X$. It fires for $Y$. That is error. This is why Teleosemantics is often more comfortable for biologists; it treats "false belief" exactly like "maladaptive trait." It allows for the possibility that an organism can be systematically wrong about its environment (e.g., moths flying into candles) while still having a specific content ("Moon/Star") rather than a generic one ("Bright Light").

  **For Dretske, misrepresentation is a breakdown of information.**
  In his strict causal theory, information is factive (you can't have false information). To get misrepresentation, Dretske has to argue that the system acquired a *function* to indicate $X$ (during calibration/evolution) and is now failing to do so. But if the causal link to $X$ is completely severed (as in the truck case), Dretske struggles to maintain that the content is still $X$. If the causal chain is broken, the information is gone.

  ### The "Disjunction Problem" (The Biologist's Version)

  You might recognize this as the **Fly-vs.-BB problem** (Lettvin et al., 1959).

  *   **Scenario:** A frog's "bug detector" neuron fires for flies *and* small black BB pellets shot from a gun.
  *   **Dretske (Causal):** If the neuron fires for both, and both are present in the environment, the content is naturally **"Fly-or-BB."** To narrow it to just "Fly," you need a nomic regularity that excludes BBs. If BBs are possible causes, the information "Fly" is not strictly carried.
  *   **Millikan (Etiological):** The content is **"Fly."** Why? Because BBs never contributed to the reproductive success of the frog's ancestors. The selection history prunes the disjunction. The fact that it fires for BBs is an error condition, not a content-defining condition.

  ### Why This Matters for Your Background

  As an evolutionary biologist, you likely view traits as historical artifacts. Millikan's account validates that intuition: the *meaning* of a signal is an historical fact about the lineage, not just a current causal fact about the organism's state.

  Dretske's account is more "engineering" focused: What is this gauge currently measuring? If I rewire the sensor to a new input, the gauge now measures the new input.

  **The Concrete Split:**
  In the **Stickleback/Truck** case:
  *   **Millikan says:** The fish is *wrong*. It thinks there is a rival. (Content: Rival).
  *   **Dretske says:** The fish is *right* about the stimulus, but the stimulus is useless. (Content: Red Patch).

  If you believe the fish is genuinely *mistaken* (that it is experiencing a "false positive" regarding a rival, not just a "true positive" regarding a red patch), you are intuitively siding with Millikan's etiological account. You are saying the *history* of the trait dictates what the trait is "about," even if the current causal environment has hijacked it.

  That is the precise location of the split: **Does content track History (Millikan) or Current Covariation (Dretske)?** In cases of evolutionary lag, they part ways.
