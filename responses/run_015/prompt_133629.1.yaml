answer: |-
  Implement an explicit "analogical-reasoning license" card mechanism and assign negative spaces equal evidential weight to force participants to confront the constructed nature of archaeological inference.

  ### Reasoning for Design Commitments
  Leaving analogical reasoning implicit allows students to rely on unchecked intuition, masking the philosophical leap between material trace and social meaning. By requiring teams to spend a limited resource ("License Cards") to invoke ethnographic comparison, you make the cost of analogy visible and debatable. Similarly, treating negative spaces (absences) as equal to presences prevents students from dismissing missing data as irrelevant; in real archaeology, the absence of weapons in a grave is as theoretically loaded as their presence. This design forces the realization that data does not speak for itself but is curated by interpretive frameworks.

  ### Hidden Ground Truth
  **Context:** A single deposit pit from a Late Neolithic settlement (hypothetical site "Körös-Alpha").
  **Truth:** **Ritualized Surplus Destruction within a Competitive Egalitarian Society.**
  **Belief Complex:** Material accumulation attracts spiritual sickness ("heavy wealth"); status is gained not by keeping wealth, but by publicly destroying it to cleanse the community.
  **Institutional Structure:** Non-hierarchical "Big-Man" system where leadership is temporary and contingent on organizing waste feasts, not lineage or permanent office.

  ### Team Trace Subsets (Incompatible but Defensible)
  Both teams receive 10 cards. 4 cards are identical (overlap), 6 are unique.

  **Team A (The Hierarchists)**
  *   **Unique Traces:** "Gold Foil Fragment (Unworked)", "Spatial Diagram: Central Pit Location", "Note: No Domestic Pottery Sherds", "Wear Note: Ceremonial Axe (Polished, No Edge Damage)".
  *   **Inference Path:** Centralization + High Value + Lack of Domestic Use = **Temple Treasury / Elite Storage**.
  *   **Reconstruction:** Stratified Chiefdom storing wealth for religious redistribution.

  **Team B (The Domesticists)**
  *   **Unique Traces:** "Charred Grain Clusters", "Spatial Diagram: Corner of Dwelling", "Note: No Elite Iconography", "Wear Note: Ceremonial Axe (Heavy Edge Damage)".
  *   **Inference Path:** Dwelling Context + Food Residue + Tool Wear = **Household Accumulation / Inheritance**.
  *   **Reconstruction:** Kinship-based Clan System storing wealth for family security.

  **Overlap (The Conflict Zone)**
  *   Both receive: "Ceremonial Axe", "Spatial Diagram Fragment", "Obsidian Shard", "Bone Pin".
  *   *Crucial Divergence:* The Wear Note on the Axe differs (Polished vs. Damaged). The Spatial Diagram is fragmented so Team A sees the center, Team B sees the corner. They must reconcile this during deliberation.

  ### Roles (7 per Team)
  1.  **Pattern-Analyst:** Maps spatial relationships from diagrams.
  2.  **Ethnographic-Analogy Skeptic:** Holds the "License Cards"; must approve any comparison to living cultures.
  3.  **Institutional-Reconstruction Advocate:** Drafts the social structure model.
  4.  **Negative-Space Interpreter:** Defends the significance of missing artifacts (e.g., "No weapons means peace" vs. "No weapons means suppression").
  5.  **Taphonomy Officer:** Interprets wear patterns and decay (decides if the axe was used or ceremonial).
  6.  **Chronology Coordinator:** Sequences the deposit events (single event vs. accumulation).
  7.  **Lead Arguer:** Synthesizes the claim for presentation.

  ### Rules & Payoff
  *   **Information Barrier:** Teams cannot show cards until the Deliberation Phase.
  *   **Analogy Licenses:** Each team gets 3 cards. Playing one allows them to state "Like the [X] people, this implies..." Without a card, ethnographic claims are ruled "Out of Order" by the facilitator.
  *   **Negative Space Weight:** A claim based on absence (e.g., "No beds found") counts as one full evidence point, equal to a physical object.
  *   **Publication Credits:** After deliberation, all 14 participants vote anonymously. Credits are awarded for **Internal Coherence** (does the model fit their data?) and **Defensibility** (did they handle counter-evidence well?), *not* accuracy against the ground truth.
  *   **The Twist:** During Deliberation, teams may only exchange **3 cards each**. This partial data dump is designed to increase ambiguity, not resolve it.

  ### Timeline (90 Minutes)
  *   **00:00 – 00:05 (Intro):** Distribute packs. Explain rules. Emphasize: "There is no correct answer during the debate phase."
  *   **00:05 – 00:30 (Team Analysis):** Teams build their Belief/Institution model. Skeptics hoard Analogy Licenses.
  *   **00:30 – 00:50 (Presentations):** Team A (10 mins), Team B (10 mins). No interruptions.
  *   **00:50 – 01:10 (Deliberation):** Teams sit together. Exchange 3 cards each. Attempt to reconcile models. Facilitator enforces rule: "You do not need to agree; you need to explain why you disagree."
  *   **01:10 – 01:30 (Reveal & Debrief):** Reveal Ground Truth. Vote for Credits. Map simulation to philosophy.

  ### Materials (Cheap/Reproducible)
  *   **Cardstock:** Cut into 140 cards total (10 per person). Print text descriptions (e.g., "Artifact #4: Basalt Axe. Context: Floor 3. Wear: Micro-polish on bit.").
  *   **Diagrams:** Print simple grid maps with shaded squares. Cut them in half diagonally so Team A sees the center, Team B sees the periphery.
  *   **License Tokens:** Poker chips or colored paper squares (3 per team).
  *   **Vote Slips:** Small paper scraps for final ranking.

  ### Debrief Mapping
  1.  **Team Analysis Phase → Middle-Range Theory:** Discuss how they moved from "static object" to "dynamic action." Highlight how the Taphonomy Officer's interpretation of wear dictated the social model.
  2.  **Analogy Licenses → Inductive Risk:** Ask the Skeptics: "Did you feel powerful withholding cards?" Discuss how ethnographic analogy is a resource that risks imposing present biases on the past.
  3.  **Negative Space → Argument from Silence:** Ask the Negative-Space Interpreters: "Was it harder to defend what wasn't there?" Connect to how absence is often theorized as 'destruction' or 'privilege' rather than null data.
  4.  **Deliberation → Underdetermination:** Highlight that exchanging data *did not* produce consensus. It produced entrenched disagreement. This demonstrates that accumulating artifacts proliferates interpretations rather than converging on truth.
  5.  **The Reveal → Theory-Ladenness:** Show that the "Truth" (Ritual Destruction) was invisible to both because both teams assumed *preservation of wealth* was the goal. Their theoretical commitment to "rational accumulation" blinded them to "ritual waste."

  ### Honest Limitation
  **Temporal Depth:** This simulation is synchronic; all cards are presented at once. Real archaeological inference is diachronic, relying heavily on stratigraphy and sequence to rule out impossible timelines. In the simulation, a student can argue "The axe was used first, then polished" without physical proof of sequence. In reality, stratigraphic superposition often constrains interpretation more tightly than this simulation allows. You must verbally supply the constraint: "Assume all items are contemporaneous," which removes the critical tool of chronological sorting that usually resolves competing hypotheses.

  ### Predicted Failure & Correction
  **Failure:** During the Deliberation Phase, participants will attempt to "solve the puzzle" by guessing your hidden Ground Truth. They will converge on a compromise model ("Maybe it was a temple *and* a house?") to please the facilitator, thereby masking the underdetermination.
  **Correction:** Explicitly state in the Intro: "Publication Credits are awarded for *distinctive coherence*, not compromise. If you merge your models, you dilute your argument and lose credits." During deliberation, if teams start agreeing too quickly, intervene as the "Journal Editor": "This consensus looks suspicious given the conflicting wear patterns. Defend your divergence." This forces them to inhabit the incompatibility rather than resolve it artificially.
