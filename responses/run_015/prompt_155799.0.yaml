answer: |-
  Good evening, everyone.

  For those of you who don't know [Groom] professionally, he spends his days thinking deeply about what we owe to the world. He is committed to the idea that we should always act to make things as good as they can be. For those of you who *do* know him professionally, you know he doesn't shy away from the hard questions that come with that.

  There is a famous worry in his field that if you stop to ask whether saving the person you love is truly "the right thing to do," you have one thought too many. That thinking about love makes it less real.

  But watching [Groom] with [Bride], I've realized something different. For him, that thought isn't a hesitation. It's a focus. He doesn't look at [Bride] and ask, "Is this the optimal choice?" He looks at her and realizes that the abstract idea of "the good" isn't a number to be calculated. It has a face. It's hers.

  [Bride], you are not a variable in his equation. You are the standard by which he measures value. His commitment to you isn't an upshot of his philosophy; it is the place where his philosophy becomes real. He isn't marrying you because it maximizes well-being in the abstract. He is marrying you because your well-being *is* the specific good he intends to maximize for the rest of his life.

  To the philosophers in the room: He remains consistent.
  To the family in the room: He is completely devoted.
  And to both: He knows that while integrity might only matter instrumentally in a lecture hall, in this marriage, his integrity *is* his promise to you.

  [Groom], you spend your life asking what we owe the future. Today, you've given your answer.
  [Bride], you are not the best option he found. You are the reason he stopped looking.

  Please raise your glasses. To [Bride] and [Groom]: May your life together be the greatest good you both ever do.
