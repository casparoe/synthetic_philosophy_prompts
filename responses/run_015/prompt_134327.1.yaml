answer: |-
  You have spotted one of the biggest cracks in the foundation of Logical Positivism, and your intuition is spot on. It is tempting to try to "save" Carnap by saying he was just being practical, but if we look closely at his own rules, the contradiction is real.

  Here is my committed stance: **Carnap's support for central planning does secretly depend on an objective value-judgment that breaks his Principle of Tolerance.**

  Here is why this is the case, how it connects to his idea of value-free science, and why you can't actually have both without cheating.

  ### The Trap of the Principle of Tolerance
  First, let's lock down what the Principle of Tolerance actually says. Carnap argued that there is no "correct" logic or language. We are free to construct whatever linguistic framework helps us get things done. If you want to use a framework that includes numbers, go ahead. If you want one that doesn't, that's fine too. The only question is: *Is it useful?*

  This works great for math and science. But when you move to politics, "useful" becomes a trap.

  If Carnap says, "We can pick any logical framework," but then turns around and says, "Society *must* use central economic planning," he is treating the economic framework differently than the logical one. He is saying the planning framework isn't just a choice; it's the *necessary* choice for a functioning society.

  But why is it necessary? It can't be a logical necessity (like 2+2=4), because economics isn't pure logic. It has to be a practical necessity. But practical for *what*?

  ### The "Value-Free" Mask Slips
  This is where his idea of **value-free science** crashes into his politics.

  Carnap, like most of the Vienna Circle, believed science could only deal with facts (what *is*), not values (what *ought* to be). Science can tell you, "If you build a dam here, it will generate electricity." It cannot tell you, "You *should* build the dam." That second part is a value judgment.

  For Carnap to support central planning without breaking his own rules, he has to argue that planning is just a technical, scientific tool—like building a dam. He has to claim that planning is simply the most efficient *means* to an end, without endorsing the *end* itself.

  But here is the problem: **Central planning is not just a tool; it is a specific vision of how humans should relate to one another.**

  If Carnap says, "Central planning is the best system," he is implicitly saying, "Efficiency and collective coordination are more important than individual market freedom." That is a value judgment. It is not a fact of logic. By pushing for planning, he is objectively ranking one set of human values (collective security/efficiency) over another (individual liberty/spontaneity).

  If he admits this, he breaks his rule that science is value-free.
  If he *doesn't* admit this, he is pretending his political preference is a scientific fact, which is dogmatic.

  ### Why You Can't "Save" Him by Calling it a Framework
  You might wonder: *Can't we just say central planning is another "language game" people opt into?*

  No, because central planning, by definition, isn't optional for the people living under it. A logical framework is something a scientist chooses for their work. An economic system is something imposed on a population.

  If Carnap says, "We should all adopt the Planning Framework because it works best," he is making an **external claim** about reality. He is saying there is an objective standard of "working best" that exists outside of any specific framework. But his own philosophy says there is no "outside" view. There is only what works *within* a framework.

  So, for him to recommend planning to society as a whole, he has to assume there is a universal human goal (like "minimize suffering" or "maximize production") that everyone *ought* to accept. But since he believes values aren't scientific truths, he can't prove everyone *ought* to accept that goal. He just has to hope they do.

  ### The Verdict
  The tension you feel is real because Carnap is trying to have it both ways. He wants the humility of the Principle of Tolerance (no one is right about logic) but the authority of Scientific Socialism (we are right about the economy).

  He gets away with it only by treating "social welfare" as if it were a measurable scientific fact, like temperature or mass. But "welfare" is loaded with values. By forcing a universal planning system, he is silently enforcing a value system while claiming to be neutral.

  So, to answer your question directly: **Yes, his politics contradict his philosophy of language.** He violates the Principle of Tolerance by treating a pragmatic, value-laden political choice as if it were a scientific necessity. It shows that you can't fully separate "facts" from "values" when you start talking about how to run a society, no matter how much logic you use.
