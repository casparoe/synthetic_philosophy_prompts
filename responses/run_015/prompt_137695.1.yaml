answer: |-
  Here are the rejected candidates. First, a label reading "Take Two Daily" on a pharmacy bottle versus a kitchen sugar jar. I dumped this because the inner message ("Consume this") remains compatible across both; only the risk profile changes. Second, a pipe labeled "Toxic Waste" in an active plant versus a museum. I rejected this because it relies too heavily on the decoder's prior geographical knowledge (knowing they are in a museum), which violates your constraint against relocating meaning into context rather than the object's frame.

  **The Selected Case: The Sticky Note on the Monitor**

  **Variant A:** A yellow sticky note is adhered to the bezel of a computer monitor. The monitor is powered on, displaying a login prompt. The cable is connected.
  **Variant B:** An identical sticky note is adhered to an identical monitor. The monitor is powered off, unplugged, and stacked among cardboard boxes in a storage closet.

  **The Layers**
  *   **Frame:** In A, the vehicle is an active terminal (LED lit, video signal). In B, the vehicle is e-waste/scrap (dark, disconnected).
  *   **Outer:** Identical in both. Handwritten text: "Password: Admin123". High-resolution scan reveals no difference.
  *   **Inner:** In A, the message is a functional credential: "Use this string to gain access." In B, the message is historical data: "This string *was* a credential."

  **Incompatibility**
  The decoder cannot rationally hold both truths. In A, the password is live; in B, it is void. The content shifts from imperative instruction to archival record.

  **The Mechanism**
  The single feature doing the work is the **power state** (LED status). It is part of the frame (the vehicle's condition), not the outer message (the ink). If you delete this feature (e.g., both monitors are off), the frame collapses into ambiguity, and the inner message defaults to the safer historical interpretation. The frame selects the decoding algorithm: "Live System" vs. "Archive."

  **The Objection**
  A skeptic argues: "This is a storm in a teacup. The power light is just more signal. If you define 'Outer Message' as all physical data available to the eye, the light is part of the Outer. Meaning is still Signal + Code."

  **The Response**
  If the skeptic conflates Frame and Outer, they dissolve the layer distinction entirely. Hofstadter's point is that the Frame *selects* the code used to read the Outer. The light isn't read as text; it is read as *status*. If you treat status as text, you require a meta-code to read the status, leading to infinite regress. The case survives because the *same* text yields *different* truth conditions based on the vehicle's state, proving meaning isn't intrinsic to the signal.

  **Third Variant: The Prop**
  **Variant C:** The monitor is on a film set, connected to a generator, but surrounded by cameras and boom mics. The frame declares: "This is a simulation."
  Here, the frame cancels the message's claim to reality. Is there an inner message? Yes: "Pretend this is a password."
  This complicates the three-layer picture. It suggests a fourth layer: the **Modal Frame**, which dictates whether the Inner Message refers to the actual world or a possible world. If the frame can negate the message's truth-claim while preserving its content, meaning is not just located in the signal or the code, but in the *ontological status* of the vehicle itself. The layers hold, but they are permeable to the context of use.
