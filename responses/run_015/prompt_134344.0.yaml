answer: |-
  The 2006 decision by the International Astronomical Union (IAU) to reclassify Pluto from a major planet to a dwarf planet stands as a rare moment where a technical semantic adjustment ignited global cultural friction. While astronomers viewed this as a necessary taxonomic cleanup, the public perceived it as a demotion of a celestial icon. Analyzing this episode through Gottlob Frege's distinction between *Sinn* (sense) and *Bedeutung* (reference) reveals that the controversy was not about the physical object itself, but about the cognitive value attached to the concepts used to describe it. By mapping the reclassification onto Frege's puzzle of identity, we can see that the referent of 'Pluto' remained stable while the sense of 'planet' underwent a radical contraction. Furthermore, distinguishing whether 'planet' functions as a natural kind or an institutional kind clarifies why the identity statement "Pluto is a dwarf planet" carried such heavy informational and emotional weight. Ultimately, the Pluto episode confirms Frege's central thesis: cognitive value tracks divergence in sense, even when that sense is governed by convention rather than empirical discovery.

  ### Mapping the Case onto Frege's Framework

  Frege's puzzle arises from the observation that identity statements of the form $a=a$ (e.g., "Pluto is Pluto") are cognitively trivial, whereas statements of the form $a=b$ (e.g., "The Morning Star is the Evening Star") are informative. Frege resolved this by arguing that while the *reference* (the object picked out) is the same, the *sense* (the mode of presentation) differs.

  In the case of Pluto, we must distinguish between the proper name 'Pluto' and the predicate concept 'Planet'.
  1.  **The Referent (*Bedeutung*):** The referent of the name 'Pluto' is the specific icy celestial body orbiting in the Kuiper Belt. Did this change in 2006? No. The physical object, its orbit, and its mass remained exactly as they were. The *Bedeutung* of 'Pluto' was stable.
  2.  **The Sense (*Sinn*):** The cognitive shock did not stem from a change in the object, but from a change in the *sense* associated with the classification 'Planet'. Prior to 2006, the sense of 'Planet' included a mode of presentation roughly equivalent to "any significant body orbiting the Sun." Under this sense, the identity statement "Pluto is a Planet" was accepted as true.
  3.  **The Informative Statement:** The IAU's new definition introduced a dynamical criterion: a planet must "clear its neighborhood." Consequently, the statement "Pluto is a dwarf planet" (and implicitly, "Pluto is *not* a [major] planet") became the new truth.

  For the public, the statement "Pluto is not a planet" was highly informative because it severed a previously held identity. The public operated with the sense $S_1$: "Pluto = The Ninth Planet." The IAU imposed sense $S_2$: "Pluto = A Dwarf Planet (distinct from the Eight Planets)." Because $S_1$ and $S_2$ present the object under different conceptual modes, the transition from one to the other carries genuine cognitive weight. The resistance arose because the public felt the *reference* of their childhood knowledge was being invalidated, whereas Fregean analysis shows only the *sense* was altered. The object (Pluto) was not lost; only its membership in the privileged conceptual category (Planet) was revoked.

  ### Natural Kind vs. Institutional Kind

  To fully understand the epistemic profile of this reclassification, we must determine the ontological status of the term 'planet'. Is it a natural-kind term, pointing to a mind-independent essence, or an institutional kind, constituted by human convention?

  **1. 'Planet' as a Natural Kind**
  If 'planet' is treated as a natural kind (like 'gold' or 'tiger'), it implies there is a fact of the matter about what constitutes a planet, independent of human decision.
  *   **Informativeness:** Under this reading, the IAU did not *change* the definition but *discovered* that Pluto lacked the essential properties of planethood. The identity statement "Pluto is a dwarf planet" is informative in the same way "Water is H2O" is informative: it reveals the underlying essence.
  *   **Public Attachment:** If 'planet' is natural, the public's attachment to the old classification is epistemically illegitimate. It represents a false belief about the structure of the solar system. The cognitive shock is the pain of correcting an error.

  **2. 'Planet' as an Institutional Kind**
  If 'planet' is treated as an institutional kind (like 'currency' or 'border'), its definition is constituted by the rules of the governing body (the IAU).
  *   **Informativeness:** Here, the identity statement is informative not because of empirical discovery, but because of legislative stipulation. The statement "Pluto is a dwarf planet" is akin to "This piece of paper is no longer legal tender." The informativeness comes from learning a new rule of the system, not a new fact about the object.
  *   **Public Attachment:** Under this reading, the public's attachment is legitimate. The old sense ("Pluto is a planet") was *true* under the previous institutional regime. The resistance is not ignorance, but a reaction to a change in the linguistic contract. The "loss" is real because the social utility of the category has changed.

  The 2006 controversy thrived on the ambiguity between these two readings. The IAU argued from a quasi-natural kind perspective (dynamical dominance is a physical reality), but enacted the change through institutional authority. The public reacted from an institutional perspective (you changed the rules on us), but felt the loss as a natural kind demotion (Pluto is somehow "less than" it was).

  ### Assessing Frege's Puzzle

  What does the Pluto episode demonstrate about Frege's puzzle itself? Frege's original examples (Morning Star/Evening Star) were empirical discoveries where two senses were found to pick out the same reference. The Pluto case is arguably the inverse: one reference was found to no longer satisfy the sense previously attached to it, requiring a new sense ('dwarf planet') to be adopted.

  Does this suggest that identity statements involving institutionally defined categories have a different epistemic profile? In one sense, yes. In empirical cases (Hesperus/Phosphorus), the convergence of sense is forced by the world. In institutional cases (Pluto/Planet), the divergence of sense is forced by a committee. However, this difference in *origin* does not undermine Frege's explanation of *cognitive value*.

  The Pluto episode confirms that cognitive value always tracks a divergence in sense, regardless of whether the kind is natural or conventional. The public outrage proves that the *Sinn* has psychological reality independent of the *Bedeutung*. If reference were all that mattered, the statement "Pluto is a dwarf planet" would be as trivial as "Pluto is Pluto," since the object is unchanged. The fact that it was not trivial demonstrates that human cognition grasps objects through modes of presentation.

  Furthermore, the episode highlights that scientific language operates with both empirical and conventional senses. When the IAU altered the sense of 'planet', they altered the cognitive value of every statement involving that term. Frege's framework accommodates this: whether the sense is determined by the laws of physics or the bylaws of an union, it is the *sense* that mediates our knowledge.

  ### Conclusion

  The reclassification of Pluto serves as a potent modern validation of Frege's distinction between sense and reference. The referent of 'Pluto' remained constant; the celestial body did not move, shrink, or vanish. What changed was the sense of the predicate 'planet', shifting from a broad observational category to a precise dynamical definition. Whether viewed as a natural kind discovery or an institutional rule change, the informativeness of the reclassification relied entirely on this shift in sense. The public's resistance was not a failure to understand the reference, but a recognition that the mode of presentation—the conceptual lens through which they viewed the solar system—had been fundamentally altered. Thus, the Pluto episode confirms that cognitive value is inextricably linked to sense. It demonstrates that even in the hard sciences, where reference is paramount, the human engagement with knowledge is governed by the senses we attach to the names we use.
