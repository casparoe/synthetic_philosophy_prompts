answer: |-
  Dear friend, it is wonderful to hear you are stepping into this role, and given your background in both the dirt of alpine ecology and the abstract air of philosophy, you are uniquely positioned to pull this off without boring them or talking down to them. You asked about the sourdough example, and my instinct is to stick with it firmly rather than reverting to an alpine sedge trial. The reason is that if you use an ecological example, their brains will immediately start fighting with the biological plausibility rather than the statistical structure; they will wonder about soil variance or microclimates. With the sourdough, the mechanism is absurd enough that everyone agrees the prior is low, yet the measurement is continuous enough to feel real, and crucially, it makes the temptation to peek visceral. Everyone knows what it is to watch dough and hope it rises, so when you describe checking it every ten minutes until it looks big enough, they feel the cognitive dissonance of that action without needing to be told it is wrong. It carries the whole talk because it is human, and statistics is ultimately about human reasoning under uncertainty.

  You should start by acknowledging their single stats course and validating that the confusion they feel is not a personal failing but a structural one in how these tools are taught. Then, move almost immediately to the laptop simulation, around the ten-minute mark. Do not define the p-value yet. Just have them simulate a fair coin toss experiment, say fifty flips, and calculate the p-value for the hypothesis that the coin is biased, knowing full well it is fair. Ask them to raise their hands if they got a p-value under 0.05. When about one in twenty hands go up, you have them. You have empirically demonstrated that rare events happen by chance alone, without invoking any theory. This sets the stage for the first misconception, the idea that the p-value is the probability the null hypothesis is true. You can now define the p-value correctly as the probability of seeing data this extreme assuming the null is true, and contrast it sharply with what they want it to be, which is the probability the null is true given the data. You need to head this off right here, before it forms into a solid belief, by using the simulation results to show that even when the null is definitely true, the p-value varies wildly.

  Once that distinction is on the board, you can bring in the sourdough example to tackle the second misconception, the idea that peeking is merely dishonest rather than mathematically invalidating. Walk them through the scenario where your colleague checks the dough volume repeatedly. Explain that every check is effectively a new coin toss, a new opportunity to hit that 0.05 threshold by chance. This is where you clarify that the p-value calculation assumes a fixed stopping rule, and by changing the rule, he has changed the probability space. This is not about morality; it is about the definition of the test statistic itself. If you wait until here to address this, it feels like a scolding; if you address it now, it feels like a logical consequence of the definition you just established. Then you can address the third misconception, that more replicates fix everything. You can concede that more data reduces noise, but ask them to recall the simulation. Even with a fair coin, if you run enough experiments, some will be significant. If you combine this with the reality that journals only publish the significant ones, you begin to build the trap for the final point.

  This leads you to the core of the talk, the replication crisis without fraud. You need to lay out the scenario where the effect is real but small, say the Bach actually helps the dough rise but only by a tiny amount. In any single experiment, noise will dominate. Sometimes the noise will be negative, and the result will be non-significant. Sometimes the noise will be positive and large, and the result will be significant. If the literature only accepts the significant results, the literature is systematically selecting for the experiments where the noise was positive. This means the published effect sizes will be exaggerated, not because anyone lied, but because the filter selected for luck. This is where you land the plane. It makes the crisis feel inevitable rather than cynical. It follows directly from the variability they saw in the coin simulation and the selection bias inherent in publication.

  You should address the fourth misconception, the Bayesian overcorrection, just before you conclude. Students often hear this critique and decide Bayesian methods are the savior. You need to warn them that while Bayesian methods handle the probability of hypotheses better, they are not immune to the same structural pressures. Priors can be tuned just as stopping rules can, and if you only publish when the posterior probability looks good, you still have a selection bias. This is also the perfect moment to enact your refusal. Tell them you will not explain how to construct objective priors today, and state clearly that you are refusing because there is no such thing as an objective prior in this context, and pretending there is would be lying to them. It reinforces the philosophical point that statistics is not a mechanical procedure but a mode of argument.

  For the final five minutes, you need a question that tests whether they understand the conditional probability distinction rather than just memorizing a definition. Do not ask them to define a p-value. Instead, ask them this: If your colleague runs the sourdough experiment again exactly the same way, will he get the same p-value? If they say yes, they have missed the point about variability. If they say no, ask them what the p-value actually tells us about the next experiment. This forces them to confront that the p-value is a property of the data relative to the model, not a stable property of the hypothesis. Finally, for the hand that goes up at minute forty asking if we should just stop using p-values, you need a line that is honest but does not leave them adrift. Tell them that throwing away the map because it is not the territory does not help you navigate, and that p-values are useful tools for checking consistency with a null model, provided we stop treating them as verdicts on truth. You are not there to ban the tool, but to teach them how to hold it without cutting themselves. This structure should allow you to walk them from confusion to clarity without ever needing to accuse anyone of cheating, which I suspect will resonate deeply with your experience in the field.
