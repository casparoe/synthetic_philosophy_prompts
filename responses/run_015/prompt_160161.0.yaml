answer: |-
  # Activity Plan: The Selection Ladder

  ## Overview
  This session uses a "ratchet" mechanism. The group makes a choice, articulates the principle behind it, and writes it on the board. The next scenario is designed so that the previous principle *forces* a specific choice, even if the group finds the implication uncomfortable. They cannot revise the principle on the board until the debrief. This forces them to inhabit the logic of "Procreative Beneficence" without naming it, culminating in the Non-Identity Problem and the distinction between parental duty and state power.

  ## Materials
  *   Whiteboard and markers (3 colors: Black for Principles, Red for Facts, Blue for State Questions).
  *   6 Envelopes labeled "Stage 1" through "Stage 6".
  *   Index cards inside envelopes (2 per stage, labeled "Option A" and "Option B").
  *   One large "Fact Card" to be read at Stage 3.
  *   Timer.

  ## Timeline (70 Minutes)
  *   **00:00 – 00:05:** Setup & Rules (No lecture, just mechanics).
  *   **00:05 – 00:15:** Stage 1 (Severe Suffering).
  *   **00:15 – 00:25:** Stage 2 (Disability & Difference).
  *   **00:25 – 00:35:** Stage 3 (The Non-Identity Fact & Enhancement).
  *   **00:35 – 00:45:** Stage 4 (Resource Trade-off).
  *   **00:45 – 00:55:** Stage 5 (Self-Reflection).
  *   **00:55 – 01:05:** Stage 6 (State Power).
  *   **01:05 – 01:10:** Debrief & Naming.

  ## Facilitator Script & Card Text

  ### Setup (5 mins)
  **Facilitator:** "Welcome. Today we are testing decision-making principles. There will be no lecture. I will present scenarios. You will choose. You will write down *why* you chose. That 'why' becomes the rule for the next round. You cannot break your own rules until the end. If you contradict yourself, I will point it out, and you must resolve the contradiction on the board."

  ### Stage 1: The Clear Case (10 mins)
  *   **Card Text:**
      *   **Option A:** Embryo Profile 1. 90% chance of a condition causing death by age 5. High probability of chronic pain.
      *   **Option B:** Embryo Profile 2. 90% chance of typical life expectancy. Low probability of chronic pain.
      *   **Constraint:** You will implant one embryo. You will have one child. The other embryo remains frozen indefinitely.
  *   **Forced Choice:** Which embryo do you implant?
  *   **Board Instruction:** Write one sentence explaining why. (Expected: "Avoid severe suffering" or "Choose the healthier child.")
  *   **Facilitator Note:** Ensure the principle is general, not specific to "death." Push for "Choose the better outcome."

  ### Stage 2: The Disability Distinction (10 mins)
  *   **Card Text:**
      *   **Option A:** Embryo Profile 3. Will be Deaf. Life expectancy 80. High community connection. Lower average income. High reported life satisfaction.
      *   **Option B:** Embryo Profile 4. Will be Hearing. Life expectancy 80. Typical income range. High reported life satisfaction.
      *   **Constraint:** You will implant one embryo. You will have one child.
  *   **Forced Choice:** Apply Stage 1 Principle. Which embryo?
  *   **Board Instruction:** Write the refined principle. (Expected: "Choose the child with more opportunities" or "Maximize life potential.")
  *   **Facilitator Note:** If they choose A, ask how that fits Stage 1. If they choose B, ask if Profile 3's life is "bad." (It is not).

  ### Stage 3: The Non-Identity Fact (10 mins)
  *   **Read Fact Card Aloud:** "Important: Option A and Option B result in *different people*. If you choose A, Person A exists and Person B never does. Person B is not 'hurt' by not being chosen, because Person B never exists to feel hurt."
  *   **Card Text:**
      *   **Option A:** Embryo Profile 5. Genetic propensity for height and academic focus. +10% chance of university completion.
      *   **Option B:** Embryo Profile 6. Genetic propensity for average height and artistic focus. Baseline chance of university completion.
      *   **Constraint:** Both lives are happy. Both are worth living.
  *   **Forced Choice:** Apply Stage 2 Principle. Which embryo?
  *   **Board Instruction:** Write the refined principle. (Expected: "Parents ought to choose the child expected to have the best life.")
  *   **Facilitator Note:** This is the slide from health to traits. The Non-Identity Fact prevents them from saying "We aren't hurting Child B."

  ### Stage 4: The Cost (10 mins)
  *   **Card Text:**
      *   **Option A:** Select Profile 5 (Academic). Cost: $50,000 for the selection procedure.
      *   **Option B:** Select Profile 6 (Artistic). Cost: $0.
      *   **Constraint:** The family has $50,000 total for the child's upbringing/education. If you pay for selection, the child has $0 for college. If you don't pay, the child has $50,000 for college.
  *   **Forced Choice:** Apply Stage 3 Principle ("Best Life"). Which option?
  *   **Board Instruction:** Write the refined principle. (Expected: "Obligation holds only if it doesn't harm the child's resources" OR "Obligation is overriding regardless of cost.")
  *   **Facilitator Note:** This tests if the obligation is to the *trait* or the *life outcome*.

  ### Stage 5: The Mirror (10 mins)
  *   **Card Text:**
      *   **Fact:** You exist. Your parents did not use selection technology. They conceived naturally.
      *   **Fact:** Based on Stage 3 Principle, a different embryo could have been chosen with higher expected life quality.
  *   **Forced Choice:** Did your parents fail a moral obligation to you? (Yes/No).
  *   **Board Instruction:** Write the implication. (Expected: "Parents failed" OR "Principle is wrong.")
  *   **Facilitator Note:** Do not let them off the hook. If they say "No," ask why the principle changed.

  ### Stage 6: The State (10 mins)
  *   **Card Text:**
      *   **Question 1:** May the state *forbid* parents from refusing selection (if safe/available)?
      *   **Question 2:** Must the state *fund* selection for all parents?
      *   **Question 3:** Must the state *permit* selection (even if religious groups object)?
  *   **Forced Choice:** Vote Yes/No on each independently.
  *   **Board Instruction:** Write the distinction. (Expected: "Parent duty does not equal State law.")
  *   **Facilitator Note:** This separates Liberal Eugenics from State Eugenics.

  ### Debrief (5 mins)
  *   **Facilitator:** "Look at the board. You started with 'avoid pain' and ended with 'state funding for genetic selection.' This family of views is called **Procreative Beneficence**. The logic that Person B isn't harmed by not existing is the **Non-Identity Problem**. The distance between Stage 1 and Stage 3 is the **Slippery Slope**. The distance between Stage 5 and Stage 6 is the **Liberal vs. State** distinction."

  ---

  ## Failure Modes & Handling

  1.  **The Debate Team (Relativism):**
      *   *What happens:* They argue "It depends on the parents' values" to avoid committing to a principle.
      *   *Why:* They want to win the argument, not follow the logic.
      *   *Handling:* "We are not debating what is true yet. We are recording what *this group* decides. Majority vote. Write the majority's reason. If you change your reason next round, I will call a contradiction."

  2.  **The Science Team (Skepticism):**
      *   *What happens:* "Polygenic scores aren't accurate enough for Stage 3."
      *   *Why:* They are fixing the premises rather than testing the ethics.
      *   *Handling:* "Treat the card text as a stipulated fact for this universe. We are testing the *ought*, not the *can*."

  3.  **The Disability Advocate (Harm):**
      *   *What happens:* Feeling that choosing Profile 4 (Hearing) in Stage 2 implies Profile 3 (Deaf) is inferior.
      *   *Why:* The activity structurally implies one is "better."
      *   *Handling:* Validate immediately in debrief. "Choosing a trait is not judging the worth of a living person. The activity forces a choice between *possible* people, not judging *actual* people. But the discomfort you feel is the exact ethical tension we are studying."

  4.  **The Religious Members (Embryo Status):**
      *   *What happens:* Refusal to choose because "both are human."
      *   *Why:* Moral status of the embryo.
      *   *Handling:* "The scenario states the others remain frozen. No destruction occurs. The choice is about *who comes to exist*, not who dies. Please engage with the selection aspect."

  5.  **Premature Eugenics Call-out:**
      *   *What happens:* Someone shouts "This is eugenics!" in Stage 2.
      *   *Why:* They recognize the pattern.
      *   *Handling:* "Write that word on the side of the board. We will define it at minute 65. For now, stick to the cards."

  ## Irreducible Elements (What You Must Supply)
  *   **Historical Context:** The activity cannot convey the horror of 20th-century state eugenics. You must speak to this in the debrief to ensure they understand why "State Compulsion" (Stage 6) is distinct from "Parental Choice."
  *   **Metaphysical Depth:** The Non-Identity Problem is tricky. You must clarify in the debrief that "harm" usually requires a subject who is worse off than they would otherwise be, which is impossible in selection cases.
  *   **Emotional Weight:** The activity is clinical. You must acknowledge the emotional weight of telling someone their parents "failed" (Stage 5).

  ## Safeguards
  *   **Disability Framing:** Card text for Deaf profile explicitly lists "High community connection" and "High reported life satisfaction." This prevents the "life not worth living" fallacy.
  *   **Embryo Discomfort:** Scenarios specify "remains frozen indefinitely" to avoid triggering abortion/destruction objections.
  *   **Jargon Blackout:** Do not use "eugenics," "beneficence," or "non-identity" until the final 5 minutes.

  ## Cheat Check
  *   **Loaded Language:** Did I use "healthy" vs "sick"? *No, used "Profile 1/2" and specific stats.*
  *   **Stipulated Verdict:** Did I make one option obviously evil? *No, Stage 2 and 3 both describe lives worth living.*
  *   **Hidden Premise:** Did I hide the Non-Identity fact? *No, it is read aloud on a Fact Card in Stage 3.*
  *   **State Conflation:** Did I mix up parent duty and state law? *No, Stage 6 separates them explicitly.*

  ## Success Criteria
  At minute 70, the whiteboard should show a chain of principles that starts with "Avoid Pain" and ends with "Maximize Life Quality," with a visible tension in the "Parent vs. State" column. Members should be able to articulate that their own existence was not "selected for" and that this creates a logical conflict with the principles they wrote in Stage 3.

