          *   *Analysis:* This is the "Systems Reply." Searle's counter: The *system* doesn't understand, the guy inside still doesn't understand. Mira's trap: If the brain is just a wet version of this, then either panpsychism is true, or materialism is false, or the building *does* understand. This is the hardest philosophical knot.

