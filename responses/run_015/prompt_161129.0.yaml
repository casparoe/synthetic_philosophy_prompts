answer: |-
  Hi team,

  Following up on our Slack discussion and the request that I draft a proposal for our payout rule, I have spent the last week trying to formalize the intuition I have been sharing about geometric growth and ruin risk. I know two of you feel that my hesitation to maximize expected value comes from a misplaced fear of an absorbing zero, since our donor's letter specifies that a balance drop below three million dollars triggers a sunset rather than a total loss. You are mathematically correct that the fallback option of transferring the remainder to the community foundation yields about 0.05 cause units per dollar, which is nonzero. However, I believe treating this as a simple expected value maximization problem ignores the structural constraints of our mandate, specifically the absorptive cap on the Core Program and the option value of remaining solvent enough to deploy capital in future years. This memo outlines why I think we should adopt a buffer-adjusted allocation rule rather than betting large to maximize mean returns, and it proposes a concrete voting framework for our April 14 meeting.

  The strongest version of your argument is that if we are risk-neutral utility maximizers, we should prioritize the vehicle with the highest expected return per dollar until the marginal risk of ruin outweighs that gain. Since our speculative grants return roughly three times the stake in expected cause units compared to the Core Program's one-to-one return, and the sunset penalty is only a twenty-fold reduction in efficiency rather than a zero, the math suggests we should allocate heavily to speculation. In a single-period model, you are right. The branch of the probability tree where we hit a thirty-times winner early dominates the expected value calculation so heavily that the frequent branches where we drift toward the sunset floor are acceptable costs. If our only goal were to maximize the arithmetic mean of total cause units generated over the fund's life, regardless of the distribution of outcomes, we would indeed bet much larger fractions of our balance than I am comfortable with.

  Where that argument breaks down is in the multi-period nature of our mandate and the non-financial nature of the speculative payoff. When a speculative grant succeeds, it pays out in cause units, not cash. This means a win does not replenish the financial balance that keeps us above the three-million-dollar floor. A loss, however, permanently reduces our cash balance. Because we cannot reinvest financial winnings from speculation to compound our runway, the only way to stay in the game is to preserve cash through Core Program spending discipline and conservative speculation. If we hit the floor in year two, we lose the option to make speculative grants in years three through seven, and we lose the ability to fund the Core Program at its one-to-one efficiency. The cost of ruin is not just the 0.05 conversion rate on the remaining balance; it is the lost opportunity to deploy the annual one-point-two-million-dollar Core capacity in future years. This lost option value is substantial enough that protecting our runway takes precedence over chasing the arithmetic mean.

  Furthermore, the absorptive cap of the Core Program limits how quickly we can convert financial capital into impact. We cannot dump a windfall into the Core Program instantly. If we were to bet large and win, we generate a spike in cause units, but if we bet large and lose, we degrade our ability to spend efficiently in future years. Given that ninety percent of speculative grants fail, a strategy of betting large creates a high probability of severely constraining our future spending power. We are not just maximizing a number; we are stewarding a ten-year mandate that implies a consistent presence in the field. A strategy that results in a high variance of outcomes, where most likely scenarios involve early demotion to the community foundation fallback, fails the mandate's implicit requirement for sustained engagement.

  Therefore, I recommend we adopt a Core-First Surplus Rule. Under this rule, we commit to funding the Core Program at its full absorptive capacity of one-point-two million dollars annually, provided our balance allows. We then calculate a Safety Buffer equal to the three-million-dollar sunset floor plus the Core Program funding required for the remaining years of the mandate. For the current year, with seven years remaining, that buffer is approximately eleven-point-four million dollars. We would allocate twenty percent of any balance exceeding this Safety Buffer to speculative grants. If the balance falls below the buffer, speculative allocation drops to zero until the balance recovers or the mandate shortens. This ensures we never risk the capital required to fulfill our Core Program obligations and stay above the sunset threshold, while still deploying excess capital into high-expected-value opportunities. We should revisit this rule annually each spring to adjust the Safety Buffer as the remaining mandate years decrease.

  I am about seventy percent confident in this recommendation. It balances the expected value gain from speculation with the existential risk of losing our operational capacity, and it provides a clear, voteable mechanism for us to use on April 14. The single claim in this memo I am least sure of is the stability of the ten percent success rate reference class we are using for speculative grants. If the true success rate is significantly lower, even this conservative rule might be too aggressive, and if it is higher, we might be leaving too much expected value on the table. I suggest we treat that probability estimate as a living variable and adjust the twenty percent surplus allocation if our internal track record diverges from the reference class over the next two cycles. I look forward to discussing this with you all next week.
