      *   *Correction:* Minimal needed. Perhaps clarify that Nordhaus didn't necessarily argue for high *pure* time preference explicitly as an ethical stance, but rather calibrated to market rates, which *implies* a higher $\delta$.

  3.  **Drafting the Note-Form Sketch:**
      *   *Plan:* Map Stern/Nordhaus debate onto Ramsey Rule components. Isolate $\delta$.
      *   *Fixed Background:* Ramsey equation structure, climate damage functions (mostly), the fact that it's a public policy context.
      *   *Silences:* The concept of PTP doesn't speak to *how* to value catastrophic loss (utility function shape), only *when*. It doesn't resolve the "identity of the agent" (individual vs. state).

  4.  **Section 1: The Mapping:**
      *   *Ethical Choice:* It's about the moral standing of future people. Is being born later a moral disadvantage?
      *   *Technical vs. Ethical:* A lot of the "technical" dispute (market rates) masked the ethical choice. Nordhaus appealed to "observed preferences" (revealed preference), Stern appealed to "ethical axioms" (prescriptive).
      *   *The Agent:* This is crucial. Is it the individual consumer (positive economics) or the Social Planner (normative ethics)? Stern treated the Planner as an impartial observer. Nordhaus treated the Planner as an aggregator of current individual preferences.

  5.  **Section 2: Where the Lens Works/Fails:**
      *   *Works:* It isolates the intergenerational equity parameter. It clarifies why market rates (which include risk and scarcity) shouldn't dictate long-term social discounting.
      *   *Fails:*
          *   *Inequality Aversion ($\eta$):* Much of the "discounting" effect comes from $\eta g$. If future people are richer, we invest less. This isn't time preference, it's diminishing marginal utility. The debate often conflated $r$ and $\delta$.
          *   *Fat Tails/uncertainty:* Weitzman's critique showed that the *expectation* of disaster dominates the discount rate. PTP becomes irrelevant if the world ends.
          *   *Market Rates:* Market rates reflect private risk and liquidity constraints, not social intergenerational trade-offs. Using them to pin $\delta$ is a category error (is-ought problem).

  6.  **Section 3: Testing the User's Proposal:**
      *   *Proposal:* Discount by hazard rate (survival probability).
      *   *Analysis:*
          *   *Double Counting:* If the model already has a probability distribution over catastrophic states (e.g., probability of extinction in the damage function or stochastic process), adding it to $\delta$ is double counting.
          *   *Conceptual Shift:* If stripped of survival risk, is the remainder PTP? Yes. Standard PTP is "impatience" or "pure myopia." Survival probability is usually treated as a risk adjustment to the *expected utility*, not a discount on *utility itself*.
          *   *Space/Time Analogy:* "Distance vs. Date." Philosophers (Broome, Parfit) generally reject spatial discounting. If time is just another dimension, discounting by date is discriminatory. However, time has a causal arrow (uncertainty increases), space doesn't necessarily. The analogy holds ethically (impartiality) but fails empirically (risk correlates with time).
