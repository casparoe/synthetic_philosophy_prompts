      *   "First, the mapping..." -> OK.
      *   "Second, where the lens works..." -> OK.
      *   "Third, my own proposal..." -> OK.
      *   "Finally, what the episode shows..." -> OK.

      *(Self-Correction during drafting)*: Make sure to explicitly mention the Ramsey Equation $r = \delta + \eta g$. It's the backbone of the technical dispute. Ensure the distinction between *descriptive* (Nordhaus) and *prescriptive* (Stern) approaches is clear.

      *(Refining the Hazard Rate argument)*: If I discount because people might not exist, that's $E[U] = p \cdot U$. If I discount because I value them less, that's $U_{future} = d \cdot U$. The user is asking if $p$ can stand in for $d$. The answer is generally no, because $p$ applies to the *state of the world*, $d$ applies to the *valuation*. If the model handles $p$ explicitly, putting it in $d$ is double counting. If the model *doesn't* handle $p$ explicitly, putting it in $d$ is a shortcut but ethically opaque.

      *(Refining Space/Time)*: The "distance" argument is strong in moral philosophy (spatial neutrality). The counter-argument is epistemic uncertainty increases with time, not space. But PTP is supposed to be *pure*, excluding uncertainty. So the analogy holds for *pure* time preference.

