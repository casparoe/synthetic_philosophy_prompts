answer: |-
  Mary exits the room and views a red patch. She can attend to the sensation and sincerely assert, "This is what it is like," forming a demonstrative belief linking her physical knowledge to the present sensation. However, stipulate functionally that she lacks the capacity to retain this experience in sensory memory beyond immediate attention. She cannot recall the experience once the patch is removed, cannot recognize the same red if presented again after a brief distraction, and cannot voluntarily generate imagery of red in its absence. She possesses the immediate conceptual grasp of the experience but lacks the enduring dispositions to simulate or re-identify it.

  1. **Verdicts:**
     - **Ability Hypothesis:** Knowing what it is like consists in possessing abilities to imagine, recognize, and recall the experience. Since the scenario stipulates Mary lacks these three capacities, the Ability Hypothesis verdict is that Mary does *not* know what it is like to see red.
     - **Phenomenal-Concept Strategy:** Knowing what it is like consists in possessing a phenomenal concept and deploying it to grasp a proposition (e.g., an identity between physical state and experience). Since Mary attends to the sensation and forms the demonstrative belief "This is what it is like," she possesses and deploys the concept. The Phenomenal-Concept Strategy verdict is that Mary *does* know what it is like.

  2. **Key Feature:**
     The work is done by the **transience of access**. Mary has occurrent conceptual grasp but lacks dispositional retention. If this feature is removed (restoring memory and imagery), both theories verdict "Yes," collapsing back into the standard case. If reversed (memory intact but no conceptual grasp), the case becomes incoherent, as recognitional abilities typically imply conceptual possession. The divergence relies entirely on the gap between tokening a concept now and storing the capacity to token it later.

  3. **Dualism's Stance:**
     The property-acquaintance reply (dualism) aligns with the Phenomenal-Concept Strategy verdict: Mary is acquainted with the non-physical property in the moment of experience, regardless of memory deficits. However, this case does not independently argue for dualism; it merely shows that if physicalism is true, it must look like the Phenomenal-Concept Strategy rather than the Ability Hypothesis. The case tests the physicalist options against each other, not against dualism.

  4. **Strongest Attack and Reply:**
     - **Attack (against PCS):** A phenomenal concept is essentially a recognitional concept. If Mary cannot recognize the experience upon re-presentation, she does not possess a phenomenal concept, only a fleeting demonstrative pointer. The strategy fails because the concept requires the very abilities the scenario removed.
     - **Reply:** Possession of a concept can be occurrent rather than dispositional. Mary's concept is grounded in the immediate presence of the quality ("this"), not in a stored template. The inability to re-identify later is a failure of memory storage, not a failure of conceptual content. The concept is genuine but ephemeral.

  5. **Closing Verdict:**
     This case shows the two replies are making **substantive, testable claims**, not merely verbal ones. The Ability Hypothesis treats knowledge as a stable practical capacity (dispositional), while the Phenomenal-Concept Strategy treats it as a representational state (occurrent). They carve the mental space differently: one requires enduring know-how, the other requires only immediate grasp. The dispute is not about what to count as "knowledge" in the abstract, but about whether the specific knowledge of experience is essentially practical or essentially propositional.
