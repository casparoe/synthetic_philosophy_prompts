  3.  **Formulate the Defense (Planning-Optimal/Ex Ante View):**
      *   *Core Principle:* Rationality is about choosing the best policy *before* entering the situation (ex ante), especially when agency is fragmented due to memory loss. The "self" at the intersection is not a new agent with independent goals; it's the same agent with limited access to information.
