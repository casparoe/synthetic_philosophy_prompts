  Lin dreams he meets his estranged brother, who demands he honor a specific phrase from a childhood vow, extracting a promise to finalize its terms by Friday. Lin wakes knowing he slept and that it was a dream, yet verifies the phrase matches his childhood diary, though he could not recall it while awake. The dream leaves him with the sense of a binding promise to his brother to act by Friday, a claim he could honor by working weekend hours to contact the bank or set aside as mere dream residue.

  (a) Reading A argues that since waking holds no epistemic privilege over dreaming, the verified accuracy of the dream content grants the promise equal normative standing with waking contracts; Lin must honor it to avoid arbitrary dogmatism. Reading B argues that the promise belonged to the dream-transformation of Lin and his brother, not the current waking transformation; since no enduring self carries debt across states, Lin is released to respond only to current waking demands.

  (b) The working feature is the verified accuracy of the dream detail. If deleted, A loses the basis to treat the dream as epistemically on par with waking, collapsing into agreement with B that the claim may be set aside.

  (c) A defender of B might object that A quietly privileges the waking state's epistemic authority to validate the dream's accuracy (via verification), contradicting A's core denial that waking is privileged over dreaming; A uses waking truth to bind waking action, smuggling in the privilege it denies.

  (d) If the item is false, the case collapses: A loses the ground to bind (dream was erroneous), and both readings advise setting the claim aside.

  The case shows that epistemic skepticism regarding reality can paradoxically enforce normative continuity, while ontological fluidity regarding personhood dissolves it.
