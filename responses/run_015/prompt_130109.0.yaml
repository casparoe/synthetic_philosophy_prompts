  Take both frameworks seriously: say where they illuminate a scene or a character choice, and where the work resists beeing reduced to an illustration — e.g., maybe Nolan is more interested in obsession and sacrifice than in survival conditions. Separate what's settled from what's genuinely contested among philosophers of mind, and don't present one camp (say, functional continuity is enough) as the consensus. Keep it under 300 words, one or two tight paragraphs max — no intro, no bibliography, just the reading.
