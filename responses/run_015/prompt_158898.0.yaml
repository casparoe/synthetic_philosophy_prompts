      *   *User's Claim (1):* "Spacetime... exists independently of whatever material bodies."
      *   *The Clash:* If (1) is true, empty space has inertial structure. If (4) is true, inertial structure requires CMB. These are mutually exclusive regarding *empty universe* scenarios.
