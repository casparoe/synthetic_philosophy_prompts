      *   **Theoretical Framework:** Karl Marx (specifically *Grundrisse* and *Capital*).
      *   **Specific Concepts:** Machinery as "dead labor" dominating "living labor," science as a direct force of production, the "Fragment on Machines" (General Intellect).
      *   **Task:**
          1.  Act as a philosophy expert (deep knowledge of Marx).
          2.  Brainstorm Marx's actual claims on tech/automation (beyond surface level).
          3.  Translate these claims into fiction craft vocabulary (plot, irony, agency, setting, causality, show-don't-tell).
          4.  Identify the "residue" (what maps well, what needs fudging, what doesn't map).
          5.  Critique the premise honestly (call out misunderstandings or inapplicability).
      *   **Tone:** Expert, direct, not polite (critical honesty).

  2.  **Deconstruct Marx's Concepts (The "Bones"):**
      *   *Dead Labor vs. Living Labor:* In *Capital*, machinery is crystallized past labor (dead). It confronts the worker as an alien power. The worker serves the machine, not vice versa.
      *   *Fragment on Machines (Grundrisse):* This is the key text for automation. Marx predicts a point where knowledge/science (General Intellect) becomes the main productive force, reducing necessary labor time to near zero.
      *   *The Contradiction:* Capitalism relies on labor time as the measure of value. If automation reduces labor time to near zero, value creation collapses. Capital tries to hold on (enclosures, IP, rent) but the system strains.
      *   *Alienation:* The product of human mind (tech) becomes a master over humans.
      *   *The "Automatic Subject":* Capital becomes a self-valorizing value, a process without a clear human subject.

  3.  **Translate to Fiction Craft:**
      *   *Setting as Antagonist:* The town isn't just a backdrop; the infrastructure itself is the villain. The "machine system" is the antagonist, not a specific CEO.
      *   *Character Agency:* Agency is eroded. Characters try to act, but the system pre-determines outcomes. This creates *tragedy* or *absurdism*.
      *   *Plot Structure:* Not a hero's journey (overcoming), but an entropy curve (decay). The climax isn't victory; it's the realization of total subsumption.
      *   *Dramatic Irony:* The characters think they are fighting for jobs/freedom, but the audience knows the *form* of value itself is breaking. They are fighting a ghost.
      *   *Show-Don't-Tell:* Don't have characters monologue about surplus value. Show the rhythm of life dictated by algorithms. Show the silence where work used to be. Show the maintenance of machines that don't need maintenance.
      *   *Narrative Causality:* Cause and effect detach. Actions don't lead to expected consequences because the "market" or "system" absorbs them irrationally.

  4.  **Identify the Residue (Mapping & Fudging):**
      *   *Clean Map:* Alienation (character feeling), Setting as Antagonist (the factory/town), Erosion of Agency.
      *   *Fudge Needed:* Marx's economic categories (value, price, profit) are abstract. You can't "show" the law of value falling directly. You have to personify it or show symptoms (poverty amidst plenty).
      *   *No Narrative Equivalent:* The specific mathematical formulation of the "tendency of the rate of profit to fall." The distinction between constant and variable capital is hard to dramatize without exposition. The "General Intellect" is a collective social mind, hard to pin on a protagonist.

  5.  **Critique the Premise (The "Don't Be Polite" Part):**
      *   *Risk:* "Automation eats a town" is a Luddite trope, not necessarily a Marxist one. Marx wasn't against machines; he was against the *capitalist use* of machines.
      *   *Correction:* If the story is just "robots bad, humans good," that's reactionary, not Marxist. A Marxist story asks: *Who owns the robot? Why does abundance create poverty?*
      *   *The "Fragment" Problem:* The *Grundrisse* fragment is utopian/dystopian. It suggests post-scarcity. If the town is just starving because of robots, that's simple displacement. If the town is starving *while the robots produce everything for no one*, that's the Marxist crisis of realization.
      *   *Agency:* If you follow Marx too closely, there are no heroes. Capital is the "Automatic Subject." A novel needs a protagonist. This is a structural conflict.

