      *   *Section 3: The Residue.* Be honest about what breaks.
      *   *Section 4: The Critique.* Hit hard. Is this just sci-fi Luddism? Is the "Automatic Subject" boring?
      *   *Conclusion:* Final verdict.

  7.  **Refining the Tone:**
      *   Avoid "I think" or "Maybe." Use declarative statements.
      *   Don't praise the idea unless it's theoretically sound.
      *   Ensure the distinction between *Capital* (mechanization) and *Grundrisse* (automation/knowledge) is clear.
      *   *Self-Correction during drafting:* Make sure I don't just summarize Marx but actively *translate* him into narratology. The user asked for "plot structure, dramatic irony," etc.

  8.  **Final Polish:** Check against the "don't be polite" constraint. Ensure the critique of the premise is sharp. (e.g., "If your story is just 'robots took our jobs,' you aren't writing Marx, you're writing a union pamphlet from 1950.")

