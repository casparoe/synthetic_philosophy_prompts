prompt: |-
  hey—i'm writing a novel where automaion eats a town and i'm trying to use Marx for the bones of it, not just the surface. can you pretend you're a philosophy expert who knows the Grundrisse and Capital inside out? start by brainstorming: what's Marx actually saying about technology and automation beyond machines replace workers? i mean the part about machinery as dead labor that dominates living labor, and that strange fragment where science becomes a direct force of production—sometimes called the general intellect. then restate all of that in my vocabulary—plot structure, dramatic irony, character agency, setting as antagonist, narrative causality, and show-dont-tell—as precisely as you can. then tell me the residue: which claims map clean onto story mechanics, which ones you had to fudge, and which ones have no narrative equivalent at all? also, if my premise is messed up—like if Marx's idea just doesn't translate to fiction craft or i'm misunderstanding the economics—call it out plainly. don't be polite about it.
