answer: |-
  You are not projecting. You have put your finger on exactly why the literature feels like it's spinning its wheels. Your hunch is largely correct: the ESR/OSR debate is a conflation of distinct problems (history of science vs. quantum metaphysics) glued together by an ambiguous definition of "structure," and much of the fighting is verbal disputes over the word "object" disguised as metaphysical breakthroughs.

  Here is the honest diagnosis you asked for, broken down by your specific points.

  ### 1. Is it a verbal disagreement, a metaphysical split, or conflation?
  **It is primarily a conflation of two different questions, exacerbated by a verbal dispute.**

  *   **ESR (Worrall, etc.)** is motivated by the **Pessimistic Meta-Induction**. It's an argument about *theory change*. It says: "Entities (ether, phlogiston) get discarded; equations (Maxwell's) get preserved. Therefore, we should only commit to the equations." This is an *epistemic* claim about what we can *know* survives revolution.
  *   **OSR (Ladyman, Ross, etc.)** is motivated by **Quantum Mechanics and Spacetime**. It's an argument about *individuation*. It says: "QM permutation invariance and GR diffeomorphism invariance show that 'objects' with primitive thisness (haecceity) do no work. Therefore, they don't exist." This is an *ontic* claim about what *exists*.

  **The Diagnosis:** They are talking past each other. ESR is trying to save realism from history; OSR is trying to save realism from underdetermination in physics. When they fight, ESR accuses OSR of collapsing into instrumentalism (if there are no relata, what is the structure *of*?), and OSR accuses ESR of being incoherent (you can't have relations without relata).

  Your hunch that this is about **what the math is doing** is spot on.
  *   For ESR, the math is a **preserved mapping** of empirical correlations across theory changes.
  *   For OSR, the math is a **direct description** of the furniture of the universe.
  The stalemate happens because neither side can prove their function-of-math claim without begging the question.

  ### 2. Is OSR a physics claim or a reading of formalism?
  **It is a metaphysical reading of formalism, motivated by physics.**

  There is no empirical experiment that forces OSR. Quantum indistinguishability (e.g., electrons in a singlet state) is empirical. The claim that "therefore individuality is absent" is **metaphysical**.
  *   **Alternative:** You can keep individuals by denying the Principle of the Identity of Indiscernibles (PII). You can say electrons have a "primitive thisness" that isn't captured by their quantum numbers. The physics works the same.
  *   **OSR Move:** OSRists argue this "thisness" is occult metaphysics with no empirical cash value (Occam's razor).

  So, when OSRs talk about "structures with no underlying things," they are making a claim about **how we should interpret the ontology suggested by the formalism**, not a claim derived strictly from the predictive machinery. They are arguing that the formalism *licenses* the elimination of the subject-predicate grammar of traditional metaphysics.

  ### 3. Is there a hidden empirical piece?
  **No, but there is a hidden *formal* piece.**

  The "empirical" hook is usually Quantum Non-Separability or Permutation Invariance. But as noted above, these are compatible with "thin" individuals (weak discernibility).
  The real battleground is the **Newman Problem**.
  *   **The Problem:** If you say "the world is structure," and structure is just relations, then *any* collection of things can form *any* structure provided you have enough of them (purely extensional relations). Structure alone becomes trivial unless you constrain the *nature* of the relata.
  *   **The Stalemate:** To avoid triviality, OSR has to sneak some "nature" back in. ESR pounces on this and says, "Aha! You need relata!" OSR says, "No, it's structural properties!"
  *   **Verdict:** This isn't empirical. It's a logical problem about the definition of relations. Until OSR solves Newman without reintroducing objects by the back door, the debate remains in the realm of conceptual coherence, not physics.

  ### 4. What would count as progress?
  **Dissolution, not victory.**

  A formal result won't settle it because the disagreement is partly about *interpretive norms*. However, progress would look like:
  1.  **Clarifying "Object":** Showing that "object" is a cluster concept. If we define object as "bundle of properties," OSR wins. If we define it as "substratum + properties," ESR wins. Most philosophers now agree the "substratum" view is dead, which pushes the consensus toward a moderate OSR (objects exist but are ontologically dependent on structures).
  2.  **Weatherall's Critique:** James Weatherall has argued (in *Regarding the 'Hole Argument'* and related papers) that the mathematical formalism of GR *already* tells us not to treat manifold points as physical individuals. If physicists use the math correctly, the "metaphysical" problem dissolves. Progress here is showing that the OSR/ESR debate arises from **misusing the mathematics** (e.g., treating isomorphic models as distinct physical possibilities).
  3.  **Category Theoretic Formulation:** (See below).

  ### 5. The Category Theory Reframing
  *Your question: "If you model theories as categories where morphisms carry all the content, does the epistemic/ontic split collapse into whether you allow identity morphisms for physical entities?"*

  **Verdict: Useful reframing, but technically slightly off.**

  Here is the nuance:
  *   **Technical Correction:** In standard Category Theory, you cannot have a category without identity morphisms. They are axiomatic. So the split isn't about *allowing* them, but about **what they represent**.
  *   **The Real Insight:** The split is about the **Yoneda Lemma**. The Yoneda embedding shows that an object is completely determined by its network of morphisms (relations) to other objects.
      *   **OSR Reading:** The object *is* the web of morphisms. There is no "internal state" to the object node. The identity morphism is just the structural requirement of reflexivity, not a marker of "haecceity."
      *   **ESR/Traditional Reading:** The identity morphism marks the *persistence* of the entity independent of the web.
  *   **Where it helps:** Category theory forces you to define theories in terms of **functors** (mappings between categories). This makes the "structure" precise. If two theories are categorically equivalent, they have the same structure.
  *   **Does it collapse the split?** It collapses the *Newman Problem* by giving a rigorous definition of structure that isn't just "set-theoretic relations." However, it doesn't solve the metaphysical preference. You can still ask: "Does the category represent knowledge (ESR) or reality (OSR)?"
  *   **Better Reframing:** The split might be better framed as **Internal vs. External** view of the category.
      *   **ESR:** We are outside the category looking at the diagram (structural realism as a model of our *access*).
      *   **OSR:** We are inside the category; there is no "outside" view where objects sit waiting to be related (structural realism as the *world*).

  ### Summary Diagnosis
  You are right to feel stuck. The debate has stagnated because:
  1.  **Conflation:** It mixes history-of-science arguments (ESR) with QM-metaphysics arguments (OSR).
  2.  **Verbal Dispute:** "Object" is ill-defined. Once you remove "substratum" from "object," OSR becomes trivially true (everything is a bundle of relations), but then it loses its revolutionary bite.
  3.  **Misdiagnosed Math:** People fight about ontology when they should be fighting about **semantic view of theories**. The question isn't "do objects exist?" it's "does the semantic structure of the theory require indices for individuals to function?"

  **Your Path Forward:**
  Don't try to solve ESR vs. OSR. Instead, adopt the **Weatherall/Category-Theoretic approach**: Argue that the debate arises from treating mathematical formalism as needing a "metaphysical gloss." If you take the formalism literally (e.g., isomorphic models represent the same physical state), the need for "ontic structure" vs "epistemic structure" dissolves into a question of **representational redundancy**.

  Your category theory hunch is the most promising avenue, specifically looking at **Topos Theory** or **Homotopy Type Theory**, where "equality" itself becomes a structure (a path) rather than a primitive binary. That might finally dissolve the "identity morphism = object" intuition. But be warned: that moves you from philosophy of physics into foundational mathematics, where the physicists stop listening.
