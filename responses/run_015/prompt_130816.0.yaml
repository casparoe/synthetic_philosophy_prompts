  He promised us the engine without pain,
  Where absolute needs are fully fed;
  Where fifteen hours suffice to break the chain,
  And leave us free from toil for daily bread.
  Then art would bloom in long and empty days,
  And contemplation fill the vacant space;
  No longer bound by market's narrow ways,
  We'd find our purpose in a quiet place.

  Yet relative desires demand the light,
  Where metrics parse the pulse of every hour;
  We build new scarcities in plainest sight,
  To turn the love of living into pow'r.
  For solving want dissolves no human urge
  To forge new scarcities no machine can purge.
