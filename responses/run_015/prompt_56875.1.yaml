answer: |-
  Elena commands a deep-sea rescue submersible facing a non-deferrable lockout sequence that will either save a trapped crew or seal them permanently. She holds two desires that persist after three years of reflection with a human adviser who has disclosed all engineering constraints: she desires that the crew survives, and she desires that she alone executes the manual override. The adviser confirms that the override mechanism requires dual-hand activation by two distinct certified operators, making her survival goal achievable if and only if she relinquishes her exclusivity goal. Elena understands this causal necessity completely, rests no desire on false belief, and faces immediate deployment, yet she continues to volitionally endorse both the outcome of survival and the condition of her sole agency, creating a logical impossibility where no available action satisfies the conjunction of her extrapolated volitions.

  **Demonstration:**
  Extrapolation alone recommends satisfying the set of desires produced by ideal reflection; since Elena's extrapolated volition includes both "Save Crew" and "Solo Override," extrapolation outputs the impossible command: "Achieve (Save Crew ∧ Solo Override)." A minimal-revision coherence procedure using the *Logical Consistency Pruning* rule—which removes the smallest number of desires necessary to render the set logically compatible with known facts—recommends dropping "Solo Override" because it contradicts the physical constraint (Dual-Hand Required) necessary for "Save Crew." The two come apart because extrapolation refines the *content* of desires without resolving structural contradictions between them, whereas coherence enforces *consistency* across the set. The feature doing the work is **idealized logical incompatibility**: the fact that two desires can remain mutually exclusive even when all empirical ignorance is removed. If this feature is removed (i.e., if learning the facts caused Elena to drop the "Solo" desire), extrapolation would yield a coherent set automatically, and the friend's position would succeed. The friend's strongest attack is the **Constitutive Rationality Objection**: claiming that a truly "extrapolated" agent is by definition perfectly rational, and perfect rationality forbids holding impossible desires, meaning the "Solo" desire would vanish during extrapolation. This attack fails because desires are not beliefs; knowing a desire is impossible to satisfy does not logically entail the desire ceases to exist (e.g., one can still want immortality while knowing it is impossible), so a separate coherence step is required to prune the volition for action.
