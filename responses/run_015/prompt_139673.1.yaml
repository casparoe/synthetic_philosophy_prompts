answer: |-
  **Project Title:** The Generative Gap: Sorting vs. Making Essences in Letterform Style
  **Applicant:** [Your Name]
  **Duration:** Nine Months

  **Premise & Viability Assessment**
  This project rests on a distinction between "sorting-essence" (conditions for categorization) and "making-essence" (conditions for production). ***[Critical Risk]***: This distinction echoes standard perception-action loops in cognitive science. If treated merely as a functional split, it offers little philosophical novelty. The project's viability depends on the stronger claim that these essences differ *in logical kind* (disjunctive vs. constructive), not just processing stage. ***[Safe Ground]***: Operationalizing "essence" as necessary/sufficient conditions for recognition versus generative constraints for production avoids metaphysical quagmires. ***[Shakiest Guess]***: The hypothesis that a designer can possess a making-essence without a corresponding sorting-essence (or vice versa) is the highest-risk claim; it contradicts standard sensorimotor contingency theories. This proposal treats that contradiction as the primary empirical question.

  **Research Question**
  What relation holds between the conditions required to *recognize* a letter as belonging to a style and the conditions required to *generate* a letter in that style? Standard invariantist views (a structural core is necessary) fail to explain stylistic flexibility. Family-resemblance views (no core, only overlaps) fail to explain stylistic coherence. Teleological views (defined by function) fail to explain stylistic variation within functional limits. This project asks: **Is stylistic identity grounded in a single set of conditions, or do recognition and production rely on divergent essential structures?**

  **Theoretical Framework**
  I propose a dual-essence model.
  1.  **Sorting-Essence:** Permissive, backward-looking, and potentially disjunctive. It stabilizes around what a competent categorizer accepts. ***[Safe Ground]***: This aligns with exemplar-based models of categorization.
  2.  **Making-Essence:** Constructive, forward-looking, and procedural. It consists of the rules a designer grasps to extend a style.
  3.  **Style as Policy:** ***[High Confidence]***: Style is not a set of shared visual features (serifs, contrast) but a standing *policy for resolving design conflicts* (e.g., prioritizing rhythm over stroke contrast at specific junctions). This explains why feature-matching yields pastiche while policy-matching yields kinship.

  If the dual-essence model holds, a generative account of style must deliver not a feature list, but a conflict-resolution hierarchy.

  **Methodology**
  The project combines conceptual analysis with a targeted empirical pilot. Reimplementing *Letter Spirit* is too computationally intensive for nine months; pure armchair analysis ignores the embodied knowledge of designers; standard psychophysics misses the generative reasoning. I will use a **Design Elicitation Protocol**.

  *   **Quarter 1: Corpus Construction.** I will build a simplified domain: a set of 50 grid-based letterforms (5x7 pixel grid) representing five distinct "hands." Each hand will be defined by a specific conflict-resolution policy (e.g., "always close counters even if stroke weight suffers") rather than shared features. ***[Safe Ground]***: Grid domains reduce visual noise to isolate structural decisions.
  *   **Quarter 2: Elicitation Study.** I will recruit 10 working type designers. Each will be shown three letters from a novel hand and asked to produce the remaining alphabet while thinking aloud. The data is not the drawing, but the *reasoning*: "I made this crossbar high because the style demands open counters." ***[Speculative]***: Designers may not have explicit access to their policies; protocols may require iterative probing.
  *   **Quarter 3: Transfer Test.** Participants will be asked to extend the style to a non-Latin glyph (e.g., a Cyrillic or invented character). Success here indicates grasp of a generative policy rather than memorization of features.
  *   **Quarter 4: Analysis & Synthesis.** I will map the elicited reasons against the sorting boundaries established in Q1. Divergences between what designers *make* and what observers *sort* will identify the gap between making and sorting essences.

  **Justification of Method**
  This method bridges the gap between computational modeling and phenomenology. Reimplementing *Letter Spirit* would test an architecture, not a philosophical hypothesis about essence. Psychophysics would measure boundaries but not the *generative rules* behind them. Armchair analysis cannot access the tacit knowledge designers use to resolve conflicts. Only elicitation captures the *policy* in action.

  **Possible Conclusions**
  1.  **Identity:** Sorting and making essences converge. Designers produce exactly what observers accept. (Unlikely, given stylistic innovation).
  2.  **Divergence:** Making-essences are stricter than sorting-essences. Designers adhere to policies that observers do not require. (Supports the dual-essence model).
  3.  **Independence:** Designers can generate coherent styles they cannot reliably sort, or vice versa. (Radical support for the split).
  *Deciding Consideration:* The frequency of "false positives" in sorting (accepting outliers) versus "false negatives" in making (refusing to draw valid variants) will determine the logical relation between the two.

  **Deliverables**
  1.  **Philosophical:** A monograph chapter arguing for the dual-essence model of stylistic identity.
  2.  **Design-Facing:** A "Style Policy Framework"—a practical heuristic for type designers to articulate generative rules beyond visual feature lists. This translates the philosophical distinction into a design tool. ***[Safe Ground]***: Designers routinely struggle to articulate style beyond features; a vocabulary for "conflict policies" has immediate utility.

  **Scope & Risks**
  **[Critical Scope Limit]:** Nine months is insufficient for a full psychophysical study or a robust computational model.
  *   **Cut Plan:** If recruitment lags, I will reduce the participant pool from 10 to 6 and treat the study as a proof-of-concept pilot rather than a statistical validation. The philosophical argument will rely on the *existence* of the divergence, not its population frequency.
  *   **Risk:** If designers cannot articulate their policies (tacit knowledge), the elicitation data may be thin. **Mitigation:** I will supplement think-aloud protocols with forced-choice interviews ("Did you prioritize rhythm or contrast here?").
  *   **Risk:** The "essence" terminology may alienate designers. **Mitigation:** The design-facing deliverable will use operational language ("Generation Rules" vs. "Recognition Criteria") while retaining the philosophical distinction in the academic output.

  **Confidence Summary**
  *   **High Confidence:** Style as conflict policy; the inadequacy of feature-list definitions.
  *   **Moderate Confidence:** The feasibility of the elicitation protocol within nine months.
  *   **Low Confidence (The Bet):** The claim that sorting and making essences differ in *kind* rather than degree. This is the project's core philosophical wager.

  **Budget Notes**
  Funds are required primarily for participant compensation (designers) and stimulus production. No computational infrastructure is needed.
