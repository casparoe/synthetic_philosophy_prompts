answer: |-
  Look, I know this sounds like we're digging up old bones. The Frame Problem is practically vintage at this point, right? It's the kind of thing you see in the footnotes of intro-to-cog-sci textbooks, usually sandwiched between symbol grounding and the Chinese Room. But after talking it through with that researcher, I'm convinced we've been staring at the wrong side of the mirror. Everyone treats it like a glitch in the logic, a bookkeeping error where the agent forgets to tick the box that says "the wall didn't move." But what if it's not about the box at all? What if it's about the hand checking the box?

  Here's the pitch. I want to spend the semester arguing that the Frame Problem isn't a computational bug waiting for a smarter axiom. It's a feature of epistemic life. It's about the friction between knowing something changed and knowing something stayed the same. We notice change; we assume stability. That asymmetry is where the real philosophy lives, not in the successor-state axioms.

  I've broken this down into five parts. I want to walk you through them like we're just hashing this out over coffee, because honestly, if I start writing this like a grant application, I think I'll lose the thread myself. I need to keep it loose to see where the argument actually bends.

  **Part I: The Sharp Question**

  So, let's start with the thing itself. What are we actually asking here? If you pick up the classic literature, the Frame Problem is usually defined as the problem of representing change without having to explicitly represent non-change. McCarthy and Hayes kicked this off back in '69, worried about robots that needed to plan actions in a block world. If a robot moves a block from A to B, how does it know that the color of the block didn't change? How does it know the wall didn't fall down? How does it know the moon didn't swap places with Mars?

  The standard formulation is all about efficiency and representation. It asks: "How can we formalize a system so it doesn't have to list every single thing that *didn't* happen every time something *did* happen?" It's a combinatorial explosion problem. If you have a thousand facts about the world, and you perform one action, you don't want to have to re-verify 999 of them to confirm they're still true. You just want to update the one that changed.

  But here's where I want to pivot. That's a engineering constraint, not a philosophical one. It's a problem for the programmer, sure. But the researcher I spoke to—let's call him the source—thinks we've been misreading the frame. He suggests that for a real agent, whether it's a human or a sophisticated AI, the problem isn't storing the data. It's the epistemic access to the data.

  So, the sharp question for this paper is this: Is the Frame Problem fundamentally a failure of logical representation, or is it an inevitable consequence of the asymmetry between detecting change and verifying stability?

  I want to push hard on the word "inevitable." If it's just a representation failure, then we can fix it. We can write better code, we can use better axioms, we can build smarter ontologies. We solve it, and it goes away. But if it's an epistemic asymmetry, then it's not something you solve. It's something you manage. It's like entropy. You can't stop entropy, you just work around it.

  Think about how you experience the world right now. You're sitting there, reading this. You aren't actively verifying that the floor hasn't turned into lava. You aren't checking to see if the gravity has switched off. You assume stability. Your brain is wired to flag deviations. If the coffee cup suddenly slides across the table, your attention snaps to it. If it stays put, your attention ignores it. That's the asymmetry. Change is loud; stability is silent.

  The classic AI view treats silence as data that needs to be stored. It says, "We need a way to write down 'the cup didn't move'." My proposal is that the silence isn't data. It's the background condition. The problem isn't that we can't write down the silence; it's that we can't ever be absolutely sure the silence isn't hiding something.

  This shifts the entire weight of the paper. Instead of asking "How do we represent non-change?", I'm asking "Why is non-change the default, and what happens when that default fails?" This moves us from logic to epistemology. It moves us from syntax to semantics. It moves us from the computer to the cognizer.

  I want to argue that the "friction" the researcher mentioned is actually a form of cognitive cost. Verifying stability costs energy. Detecting change costs energy. But they cost different kinds of energy. Detecting change is reactive; it's triggered by sensory input. Verifying stability is proactive; it requires a model of the world to hold steady against time. When that model drifts, you get the Frame Problem. You lose track of what's safe to assume.

  So, the question isn't about axioms. It's about trust. How much does an agent trust its own memory of the past to predict the future? If I remember the door was locked, do I need to check it again? If I don't check, I'm assuming stability. If I check, I'm admitting uncertainty. The Frame Problem is the gap between those two states.

  I plan to open the paper with this distinction. I want to make sure the reader understands that we aren't trying to fix McCarthy's robot. We're trying to understand why McCarthy's robot feels so alien to us. Why does it seem so brittle? Because it treats stability as just another fact, rather than the canvas upon which facts are painted.

  This part of the paper needs to be rigorous but accessible. I don't want to get bogged down in the modal logic notation immediately. I want to set the stage. I want to define "epistemic friction" clearly. Is it a delay? Is it a uncertainty? Is it a resource cost? I think it's all three. It's the resistance you feel when you try to hold a world model constant while things are happening.

  I also need to address the counter-argument early. Someone will say, "But if we just had perfect memory, wouldn't the problem go away?" My answer is no. Even with perfect memory, you have the problem of relevance. You have the problem of knowing which memories are still valid. Perfect memory doesn't tell you what's changed; it just tells you what *was*. You still need a mechanism to update the "was" to the "is." That mechanism is where the asymmetry lives.

  So, Part I is about framing the frame. It's about taking a technical problem in AI and showing that it's actually a fundamental problem in knowing. It's about showing that the "bookkeeping" metaphor is wrong. You don't keep books on things that don't happen. You only keep books on things that do. The absence of an entry isn't an entry itself.

  I think this is the hook. It's why this matters beyond just computer science. If we understand this asymmetry, we understand something about human anxiety, about how we deal with trauma (sudden change), about how we build habits (relying on stability). The Frame Problem is everywhere. It's just usually hidden under the hood of the logic. I want to pull it out and look at it.

  **Part II: Why the Usual Fixes Leave the Asymmetry Untouched**

  Okay, so now I have to deal with the elephant in the room. If this is such a great insight, why hasn't it solved anything yet? Why are we still talking about this? Well, because the field has spent fifty years building really impressive band-aids. I need to go through the major solutions—the successor-state axioms, the default logic, the non-monotonic reasoning—and show exactly where they miss the point.

  This section is going to be the heavy lifting technically. I need to show I understand the formalisms before I dismiss them. But I'm not dismissing them as wrong; I'm dismissing them as incomplete. They solve the logical problem, but they ignore the epistemic one.

  Let's start with successor-state axioms. This was a big move, mostly associated with Reiter. The idea is clever. Instead of writing axioms for what stays the same, you write axioms for what changes. You say, "A fact is true in the next state if it was true in the last state AND nothing changed it, OR if something made it true." It collapses the frame axioms into a single rule per predicate. It's efficient. It solves the combinatorial explosion.

  But look at what it assumes. It assumes you know all the ways a thing can change. It assumes a closed world. In a robot block world, that's fine. There are only so many ways a block can move. But in the real world? How many ways can the coffee cup change? It can break, it can melt, it can be stolen, it can be painted, it can be teleported by a quantum fluctuation (unlikely, but logically possible). The successor-state axiom works because it limits the universe. It doesn't solve the asymmetry; it just walls it off. It says, "We won't worry about changes we haven't defined." That's a engineering fix, not an epistemic one. It doesn't explain how an agent *knows* they haven't missed a change condition. It just tells them to ignore anything outside the list.

  Then there's default logic. This is where you say, "Assume things stay the same unless you have evidence otherwise." This sounds closer to my thesis, right? It acknowledges the default status of stability. But the problem is in the "evidence otherwise" part. How much evidence do you need? When does a suspicion become a fact? Default logic handles the inference, but it doesn't handle the acquisition of the evidence. It assumes the evidence is just there, waiting to be processed. It doesn't account for the cost of looking for that evidence.

  If I assume the door is locked, default logic says I'm rational until I see it open. But what if I'm in a high-crime area? My threshold for "evidence otherwise" should be lower. I should check the door more often. Default logic doesn't have a variable for "anxiety" or "risk." It just has truth values. It treats the world as static until proven dynamic. But the world is dynamic until proven static. That's the friction. The logic assumes stability is the ground state. Reality suggests change is the ground state, and stability is just a local lull.

  Non-monotonic reasoning is another big one. This allows you to retract conclusions when new info comes in. It's crucial for real-world reasoning. But again, it's reactive. It waits for the new info. It doesn't tell you when to go look for it. The Frame Problem isn't just about updating when you learn something new; it's about knowing when you *need* to learn something new. It's about the gap between updates.

  Imagine a security guard. They sit there watching monitors. Most of the time, nothing happens. The frames are identical. A non-monotonic logic system would say, "All clear." But the guard gets tired. Their attention drifts. Why? Because verifying "all clear" is active work. It's not passive. The logic doesn't model the fatigue of verification. It doesn't model the drift of attention.

  I want to argue that all these formalisms treat the agent as a disembodied brain in a vat. They assume the agent has perfect access to the state of the world, they just need to organize it efficiently. But real agents are embedded. They have to move to see. They have to touch to know. The cost of verification is physical. The asymmetry isn't just in the logic; it's in the body.

  When I write this section, I need to be careful not to sound like I'm bashing the AI researchers. These solutions are brilliant. They work for what they were designed to do. But they were designed to make robots work, not to explain knowledge. They optimized for computation, not for cognition.

  There's also the issue of relevance. This is the Fodor angle. How does an agent know which facts are relevant to the action? If I pick up a cup, does the price of tea in China matter? Logically, no. But how do I know that without checking? The standard fixes assume relevance is pre-coded. You tell the system what matters. But in the wild, relevance is contextual. It shifts. What matters now might not matter in five minutes. The asymmetry here is between the fixed rules of the system and the fluid context of the world.

  I think I can use the example of the "Yale Shooting Problem" here. It's a classic counter-example to early non-monotonic solutions. It shows how easy it is to get the timing of change wrong. But even the solutions to the Yale Shooting Problem assume you know the sequence of events. They don't handle the case where you *missed* an event. What if someone shot the gun while you were blinking? The logic breaks because the input was incomplete. My thesis is that the input is *always* incomplete. The asymmetry is that we have to act anyway.

  So, Part II is about clearing the deck. I need to show that the logical solutions are necessary but not sufficient. They handle the syntax of change, but not the semantics of knowing. They handle the "how" of updating, but not the "when" or the "why." By showing where they stop, I create the space for my epistemic argument. I'm not saying throw them away. I'm saying they're the floor, not the ceiling.

  And I need to make sure I don't get too technical here. I'm writing for a philosophy term paper, not a computer science journal. I need to keep the focus on the implications for knowledge. When the logic fails, what does that say about the nature of belief? It says belief is risky. It says stability is a bet, not a fact. That's the core point I need to land.

  **Part III: The Method**

  Alright, so if the logical analysis isn't enough, how do I actually prove this? I can't just sit here and think about it. I need a method. I can't run a lab experiment—I'm writing a paper, not a thesis—but I can do a comparative analysis. I want to compare formal belief-update rules with human intuitive physics judgments.

  Here's the plan. I'm going to take a set of standard scenarios used in AI planning—the block world, the shopping agent, the navigation task—and I'm going to analyze them alongside findings from cognitive psychology about how humans handle similar tasks.

  For the AI side, I'll look at how a standard PDDL (Planning Domain Definition Language) planner handles the frame. It uses the successor-state axioms we talked about. It assumes perfect knowledge of the initial state and perfect execution of actions. I'll trace the logical steps it takes to confirm stability. It's essentially a null operation. If nothing changes, the system does nothing. It costs zero CPU cycles to maintain a fact.

  Then, I'll look at the human side. There's work on "change blindness" and "intuitive physics" that's perfect for this. Humans are actually terrible at noticing change if their attention isn't directed. We think we see everything, but we don't. But at the same time, we have a robust sense of object permanence. We know the cup is still there even if we look away.

  The method is to juxtapose these two failures. The AI fails because it can't handle unexpected change (it crashes or plans incorrectly). The human fails because they miss the change (change blindness). But the human succeeds where the AI fails because we have heuristics for stability. We assume the wall is still there. We don't check every pixel.

  I want to use specific examples. Let's take the "coffee cup" scenario.
  1. **AI Model:** The state vector includes `Location(Cup, Table)`. Action: `Wait(5 minutes)`. Result: `Location(Cup, Table)` remains true via frame axiom. Cost: 0.
  2. **Human Model:** I look at the cup. I look away for 5 minutes. I look back. Do I check the location? Usually no. I reach for it. If it's gone, I'm surprised. If it's there, I'm not relieved; I'm just unsurprised.

  The asymmetry is in the emotional/cognitive response. Surprise indicates a violation of the stability default. Lack of surprise isn't a verification; it's just the absence of violation. The AI doesn't feel surprise. It just has a false belief until a sensor corrects it.

  I also want to bring in the concept of "affordances." Gibson's idea. We don't see objects as geometric shapes with properties; we see them as opportunities for action. A cup is "graspable." This implies stability. If the cup wasn't stable, it wouldn't be graspable. Our perception is built on the assumption of stability. The AI's perception is built on the assumption of data.

  So the method involves a textual analysis of these models. I'll map the logical structure of the AI planning against the phenomenological structure of human experience. I'm not doing empirical research myself; I'm synthesizing existing literature to show the gap.

  I need to be careful not to overstate the human side. Humans aren't perfect either. We have false memories. We think we locked the door when we didn't. That's actually proof of my point. The epistemic friction causes errors. We assume stability so hard that we hallucinate it. The AI doesn't hallucinate stability; it just asserts it. The human *feels* it.

  I'll structure this section by walking through three case studies.
  Case Study 1: Simple Persistence. (The cup on the table).
  Case Study 2: Causal Chains. (If I push the domino, the last one falls. But what if someone removed the middle one?)
  Case Study 3: Environmental Drift. (The battery dies. The sun sets. Things change slowly without discrete actions.)

  In each case, I'll show how the formal logic handles it (usually by ignoring the drift or requiring a specific action) vs. how humans handle it (by expecting decay, by worrying about batteries). Humans anticipate entropy. AI assumes stasis.

  This comparison will highlight the "friction." For the human, maintaining the belief that the cup is there requires a tiny bit of background trust. If that trust is shaken (a loud noise, a earthquake), the cost of verification spikes. I have to go look. For the AI, the cost is constant. It doesn't get nervous.

  I think this method works because it bridges the gap. It doesn't require me to build a new logic. It requires me to interpret the existing logics through a philosophical lens. It's conceptual engineering. I'm taking the tools of AI and using them to measure the shape of human knowledge.

  One thing I need to watch out for is the "homunculus" fallacy. I can't imply there's a little man inside the head checking the facts. I have to talk about processes, mechanisms, heuristics. The "agent" is the system, not a ghost. The asymmetry is in the system's architecture, not in a conscious decision.

  I also want to touch on predictive processing models. This is modern neuroscience stuff. The brain is a prediction machine. It predicts stability. It only updates when there's a prediction error. This is basically the Frame Problem solved by biology. The brain assumes the frame holds, and only processes the differences. This aligns perfectly with my thesis. The "friction" is the prediction error signal.

  So, Part III is where I get my hands dirty with the examples. I need to make sure the comparison is fair. I can't strawman the AI. I have to acknowledge that modern AI (like LLMs) does some of this statistically. But even then, it's pattern matching, not epistemic grounding. I'll stick to the classical planning models for clarity, maybe mention the new stuff in passing.

  The goal here is to make the asymmetry visible. Once you see it, you can't unsee it. You realize that every time you walk out of your house and don't check the stove ten times, you're solving the Frame Problem using epistemic friction. You're accepting a risk to save energy. The AI doesn't accept risk; it tries to eliminate it. That's why it freezes.

  **Part IV: What a Result Actually Looks Like (and What Counts as Flopping)**

  So, let's talk about the end game. What am I actually producing here? It's not a new logic. I'm not going to hand in a set of axioms that solve the Frame Problem forever. That's definately not the goal. If I tried that, I'd fail.

  A successful result looks like a shift in perspective. I want to produce a paper that convinces the reader that the Frame Problem is misnamed. It's not a problem about frames; it's a problem about faith. It's about the necessary trust an agent must place in the continuity of the world.

  Success means I can articulate the "Epistemic Asymmetry Thesis" clearly.
  1. Stability is the default assumption, not a derived fact.
  2. Change requires evidence; stability requires only the absence of evidence.
  3. The cost of verifying stability is higher than the cost of detecting change.
  4. Therefore, rational agents must ignore most non-changes to function.

  If I can demonstrate these four points using the comparison method in Part III, I've won. I've shown that the "solution" to the Frame Problem isn't better math; it's better risk management.

  I also want to show that this explains why AI feels "alien." It's not because it's smart; it's because it doesn't share our epistemic asymmetry. It doesn't ignore things. It processes everything equally (or tries to). That's why it's slow. That's why it's brittle. It lacks the friction. It lacks the ability to say "I don't know, and I don't care enough to check."

  Now, what does a flop look like?
  A flop is if I get stuck in the weeds of the logic. If I spend 3000 words explaining successor-state axioms and forget to talk about the epistemology, I've failed. I've just written a summary of AI history.
  A flop is if I can't distinguish between "ignoring" and "assuming." They're different. Ignoring is negligence; assuming is a strategy. If I conflate them, the argument collapses.
  A flop is if I claim this solves the engineering problem. It doesn't. Robots will still need frame axioms. I need to be honest that this is a philosophical clarification, not a technical patch. If I oversell it as a fix for AGI, I'll lose credibility.

  Another way to flop is to be too vague. "Epistemic friction" sounds nice, but if I can't define it operationally, it's just poetry. I need to tie it to cost, time, or error rates. I need to show where the friction manifests. Is it in the reaction time? Is it in the confidence interval? I need to be specific.

  I also risk flopping if I ignore the counter-arguments. What about cases where stability *is* the surprise? Like a miracle? Or a magic trick? In those cases, the asymmetry flips. We expect change, and stability is the news. I need to address this. Maybe argue that even then, it's relative to a higher-order stability (the laws of physics usually hold). I need to show I've thought about the edge cases.

  But the biggest risk is scope creep. This topic could be a dissertation. I need to keep it tight. One semester. One argument. Don't try to solve consciousness. Just solve the interpretation of the Frame Problem.

  So, the deliverable is a 20-25 page paper. The core contribution is the reframing. If the professor reads it and says, "Huh, I never thought of it as an asymmetry of verification cost," then I've done my job. If they say, "This is interesting, but how do I code it?" then I haven't explained myself well enough. I need to make sure the distinction between engineering and philosophy is clear.

  I think the success criteria should be about clarity and coherence. Can I tell the story of the Frame Problem in a way that makes the old solutions look like they were answering the wrong question? That's the goal. To show that McCarthy was asking "How do we count?" when he should have been asking "What do we trust?"

  I also want to include a section on implications. If I'm right, what does this mean for AI safety? If AI doesn't share our epistemic asymmetry, it might be overly cautious or overly reckless in ways we don't expect. It might check the door forever. Or it might never check it because it wasn't programmed to. Understanding this asymmetry could help us align AI behavior with human expectations. That's a nice little bonus point to end on.

  So, Part IV is about managing expectations. It's about defining the win condition. I'm not looking for a Nobel Prize. I'm looking for a coherent argument that holds up to scrutiny. I want to make sure I know when to stop.

