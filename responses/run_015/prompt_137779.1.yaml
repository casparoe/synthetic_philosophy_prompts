answer: |-
  This plan is designed to move the committee from a defensive posture to a structural analysis of their own reasoning, without triggering the defensiveness associated with accusations of bias or dogmatism. It relies on validating their expertise early to earn the right to challenge their process later.

  **Session Goal:** To establish a criterion for when skepticism of new evidence is *methodologically sound* versus when it is *structurally circular*.
  **Materials:** One whiteboard, markers (multiple colors).
  **Time:** 45 minutes.

  ### Phase 1: Validation and Framing (0–7 minutes)
  **Objective:** Secure the "20 Years" objection as a valid premise, not a defense. If you challenge this later, it looks like an attack on their expertise. If you establish it now, it becomes the baseline against which the *new* problem is measured.

  1.  **Open with the Prior:** Write **"20 Years of Practice"** on the left side of the board.
      *   *Say:* "We are not here to decide if our past practice was negligent. It was based on two decades of observed success. That creates a high 'epistemic prior.' In Bayesian terms, the probability we assign to 'this practice works' is very high. It *should* take significant evidence to move that needle."
      *   *Why:* This disarms the "vested interest" accusation. You are agreeing that their confidence is rational *ex ante*.
  2.  **Define the Conflict:** Write **"New Trial Data"** on the right side.
      *   *Say:* "We have a large pragmatic trial that contradicts this. The conflict is not between 'ignorance' and 'knowledge.' It is between 'established clinical experience' and 'new population data.' Both are legitimate sources of knowledge."
  3.  **The Problem Statement:** Draw a question mark between them.
      *   *Say:* "Nine months later, we are stuck. My concern is not that we are skeptical. Skepticism is our job. My concern is that we may have entered a loop where the *reason* we distrust the trial is the *same* belief the trial is challenging. I want to spend 30 minutes looking at the structure of that loop, using a non-medical example, so we can agree on a way out."

  ### Phase 2: The Analogy (7–22 minutes)
  **Objective:** Isolate the logic from the medicine. If you use a medical example, they will debate the medicine. You need a scenario where they are laypeople, relying on instruments vs. intuition.

  **The Example:** **The Pilot and the Altimeter.**
  *   *Setup:* "Imagine a senior pilot. She has flown this route for 20 years. She knows the terrain. She *feels* she is at 5,000 feet based on engine sound, air density, and visual cues." (Write **"Pilot's Experience"** under "20 Years").
  *   *The Anomaly:* "The altimeter suddenly reads 2,000 feet." (Write **"Instrument Reading"** under "New Trial").
  *   *The Reaction:* "The pilot thinks: 'I know I'm at 5,000. The altimeter must be broken.'"

  **The Whiteboard Work:**
  1.  **Ask:** "Is the pilot rational to distrust the altimeter?"
      *   *Expected Answer:* Yes.
      *   *Write:* **"Rational Skepticism."**
  2.  **Ask:** "What makes that skepticism rational rather than delusional?"
      *   *Guide them:* It is rational *only if* she can check the altimeter without assuming she is right.
      *   *Draw two paths:*
          *   Path A: "I am at 5,000ft $\rightarrow$ Altimeter is wrong." (Circular)
          *   Path B: "I am at 5,000ft $\rightarrow$ I check the static port/blockage $\rightarrow$ Static port is blocked $\rightarrow$ Altimeter is wrong." (Linear/Testable)
  3.  **The Crucial Distinction:** Circle **"Static Port Check."**
      *   *Say:* "In Path A, the explanation for the error is 'The world disagrees with me.' In Path B, the explanation is 'A specific mechanism failed.' Path B allows you to test the mechanism *independently* of your altitude."

  **Addressing the Misconceptions (Integrated here):**
  *   **Confirmation Bias:** If someone raises this, say: "Confirmation bias is ignoring the instrument. Rational skepticism is checking the instrument's mechanism. We are aiming for the latter."
  *   **The Bayesian Objection:** If the Bayesian member speaks up, say: "You are right that mathematically, the prior weights the evidence. But we don't have the numbers. We have a heuristic. The heuristic is: *Can we test the flaw without assuming the conclusion?*"
  *   **The Philosophy Member:** If they mention "dogmatism" or "perceptual justification," acknowledge and pivot: "That's a related debate about foundations. Here we are talking about *revision*. When does a foundation become a fortress?"

  ### Phase 3: Structural Application (22–35 minutes)
  **Objective:** Map the analogy back to the committee's situation without re-litigating the specific trial.

  1.  **Erase the Pilot example.** Keep "20 Years" and "New Trial."
  2.  **The "Auxiliary Hypothesis":**
      *   *Say:* "In the pilot case, the 'Auxiliary Hypothesis' was 'The static port is blocked.' In our case, the Auxiliary Hypothesis is 'The trial is misleading.'"
      *   *Write:* **"Why is the trial misleading?"**
  3.  **The Test:**
      *   *Say:* "We have spent nine months asserting the hypothesis. Have we tested it?"
      *   *Draw a box:* **"Independent Test."**
      *   *Define it:* "An independent test is a check on the trial's validity that does *not* rely on the assumption that our 20-year practice is correct."
      *   *Examples of Invalid Tests:* "Re-analyzing the data until it matches our experience." "Arguing the population wasn't like ours (without external data)."
      *   *Examples of Valid Tests:* "Replication in a different dataset." "Identifying a protocol deviation in the trial that is documented independently." "Mechanistic evidence that the intervention *cannot* work in the way the trial suggests."
  4.  **The "20 Years" Limit:**
      *   *Say:* "This is where the 20 years matters. It justifies the *question*. It does not justify the *answer*. It gives us the right to demand a high-quality independent test of the trial. It does not give us the right to skip the test."
      *   *Why this works:* It treats their experience as a resource for rigor, not a shield against change.

  ### Phase 4: The Refusal and The Closing (35–45 minutes)
  **Objective:** Manage expectations and verify understanding.

  1.  **What You Will Not Do (35–40 mins):**
      *   *Say:* "I am not going to ask you to vote on the guideline today. I am also not going to explain *why* the trial is right or wrong. That is a clinical question. I am asking you to agree on a *process question*: If we are going to reject this trial based on our experience, we must identify a flaw in the trial that is testable without referencing our experience."
      *   *Refusal:* "I cannot solve the medical uncertainty in 45 minutes. I am refusing to try. I am trying to solve the decision-making uncertainty."
  2.  **The Closing Question (40–45 mins):**
      *   Do not ask for a vote. Ask for a specific output to test if they grasped the distinction.
      *   *Say:* "We have 5 minutes. I want everyone to write down one sentence on a sticky note. The sentence must complete this prompt:"
      *   **Write on Board:** *"We can justifiably reject the trial if we can demonstrate _________, which would be confirmed by _________."*
      *   *Constraint:* "The second blank (the confirmation) cannot be 'our clinical observation.'"
      *   *Collection:* Collect the notes.
      *   *Why:* This forces them to generate the "Auxiliary Hypothesis" and the "Independent Test." If they write "We can reject it if we know it doesn't work, confirmed by our patients," you know the session failed. If they write "We can reject it if the randomization was flawed, confirmed by an audit of the trial logs," you know they understood the structure.

  ### Dependencies and Order Rationale

  1.  **Why "20 Years" must be first:** If you introduce the logic of circularity before validating their experience, the logic feels like an accusation that their experience is worthless. By validating the "Prior" first, you make the "Circularity" check a tool to *protect* the integrity of that experience, not undermine it.
  2.  **Why the Pilot Analogy before the Committee Application:** Clinicians are trained to defend medical territory. If you start with the trial, they will dissect the trial's inclusion criteria. By starting with the Pilot, you force them to reason as general epistemic agents. Once they agree on the logic there, they are committed to it when you switch back to medicine.
  3.  **Why the "Refusal" is necessary:** If you imply this session will resolve the guideline, they will revert to medical debate to "solve" it. You must explicitly bound the session to *process* so they don't feel pressured to make a clinical decision they aren't ready for.
  4.  **Why the Closing Question is structured that way:** It prevents slogan-based agreement ("We need more evidence"). It forces the *structure* of the argument (Hypothesis + Independent Verification) to be articulated.

  ### Handling Specific Risks

  *   **The "Dogmatism" Word:** You have successfully avoided it. If the philosophy member raises it, say: "In this context, we are discussing *conservatism in belief revision*, which is distinct from the perceptual thesis you might be recalling. We are looking at the mechanics of updating, not the foundations of justification."
  *   **The Bayesian Objection:** If they say "Bayes solves this," reply: "Bayes tells us *that* we should update. It doesn't tell us *how* to quantify the prior of a 20-year habit or how to identify the specific flaw in the likelihood. This framework is the qualitative scaffold for the math we can't do."
  *   **The "Nothing is Revisable" Fear:** Address this in Phase 3. "This structure doesn't prevent revision. It prevents *unjustified* stability. If the trial passes the independent tests, the structure demands we update. The bar is high, but it is not infinite."
  *   **The "Anything is Dismissible" Fear:** Address this in Phase 2 (Pilot). "The pilot cannot simply say 'I feel right.' She must find the blockage. If she finds no blockage, she must land. We must be willing to land."

  ### Summary of Whiteboard Progression
  1.  **Left:** 20 Years Experience (Valid Prior).
  2.  **Right:** New Trial Data (New Evidence).
  3.  **Middle:** The Loop (Experience $\rightarrow$ Trial is Flawed $\rightarrow$ Experience Confirmed).
  4.  **Analogy:** Pilot vs. Altimeter (Static Port Check).
  5.  **Criterion:** Independent Testability of the Flaw.
  6.  **Prompt:** "We can reject if... confirmed by..."

  This plan respects their expertise while exposing the structural flaw in their reasoning, offering a path forward that saves face (you are being rigorous, not wrong) but demands progress (you must find the independent test).
