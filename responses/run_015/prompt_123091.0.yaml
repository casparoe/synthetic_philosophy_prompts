              *   **Send to:** Node 5.

  *   **Node 5: The Packaging Test**
      *   **Scenario:**
          *   Deal A: A single draw giving 50% chance of $100.
          *   Deal B: Two draws in a row. First draw decides if you play (50%); second draw wins $100 (100% if reached).
      *   **Choice:** The math is identical. Are they worth the same price to you?
          *   **No (Different Prices):**
              *   **Send to:** Node 6.
          *   **Yes (Same Price):**
              *   **Send to:** Node 6.

  *   **Node 6: The Escalator**
      *   **Scenario:** Nine options arranged in a circle. You prefer each one to the previous (A>B, B>C...), but also prefer the first to the last (A>I). You can trade up one step for $1.
      *   **Choice:** You start at the bottom. How many steps do you take?
          *   **Option A:** Take all nine steps, pay to loop back to the start, and repeat.
              *   **Leaf:** **Cyclic Preferences**. *Awkward commitment:* You knowingly accept a guaranteed loss of money (a money pump) rather than enforce a consistent ranking.
          *   **Option B:** Stop before completing the loop to avoid paying for no gain.
              *   **Send to:** Node 7.

  *   **Node 7: The Probability Scale**
      *   **Scenario:**
          *   Pair 1: Certain $1 million vs. 50% chance of $2.1 million. (You pick Certain).
          *   Pair 2: 1% chance of $1 million vs. 0.5% chance of $2.1 million.
      *   **Choice:** In Pair 2, do you still pick the option corresponding to the Certain $1 million (the safer bet)?
          *   **Yes (Consistent):**
              *   **Leaf:** **Expected Utility**. *Awkward commitment:* You must treat a 1% chance as exactly 1/100th of a 100% chance, regardless of how catastrophic or trivial the outcome is.
          *   **No (Flip):**
              *   **Leaf:** **Rank-Dependent Utility**. *Awkward commitment:* You weight probabilities based on how good the outcome is, meaning the same probability number has different values depending on what it wins.

  **Legend**
  This tree sorts positions by revealed choices rather than theoretical allegiance. The "Provenance" node separates those who treat model uncertainty as risk from those who treat it as ambiguity. The "Loss and Safety" node distinguishes those who fear losses specifically from those who fear ruin specifically. The "Escalator" and "Packaging" nodes test for internal consistency vulnerabilities. Leaves are labeled with the standard academic term where one exists; "Incomplete Preferences" covers those who refuse to rank. All paths end in a specific commitment that will cause friction with standard cost-benefit analysis.

  **Follow-up 1: Indistinguishable Leaves**
  Your suspicion is correct. **Rank-Dependent Utility** and **Reference-Dependent Utility** will look identical if you only test them with gains. To pry them apart, you must offer a gamble involving both gains and losses relative to the status quo. Reference-dependent users will flip their valuation based on the frame (loss vs. gain); Rank-dependent users will flip based on the outcome ranking regardless of the frame. Similarly, **Maxmin** and **Smooth Ambiguity** (with high pessimism) look identical on simple two-outcome gambles. To separate them, offer a gamble where the set of probabilities is asymmetric (e.g., 10%-90% vs 40%-60%). Maxmin cares only about the 10%; Smooth Ambiguity will value the 40%-60% set higher because the average is higher and the spread is narrower.

  **Follow-up 2: Empty Combinations**
  There are two combinations of answers your nodes permit that no coherent position occupies.
  1.  **Node 1 "No" (Risk) + Node 2 "Worst Case"**: This path is structurally blocked in my tree, but if a user claimed they treat Coin and Model tickets equally (Node 1 No) but then valued ambiguous sets by the worst case (Node 2 A), they are contradicting themselves. You cannot be ambiguity-neutral on sources but ambiguity-averse on sets. This is **incoherent**.
  2.  **Node 5 "No" (Packaging Violation) + Node 6 "Option B" (Stop Escalator)**: If you value the same gamble differently based on packaging (Node 5 No), you are vulnerable to framing pumps. Yet, if you stop on the Escalator (Node 6 B), you claim to avoid money pumps. While logically possible to hold both, no defended position admits to violating reduction of compound gambles while claiming transitivity. This is **undefended**; anyone who admits to Node 5 "No" usually accepts Node 6 "Option A" or revises Node 5.
  3.  **Node 4 "Yes" (Menu Flip) + Node 7 "Yes" (Linear Weights)**: If your ranking flips when an irrelevant option is added (Node 4 Yes), you violate Independence of Irrelevant Alternatives. Standard Expected Utility (Node 7 Yes) requires IIA. You cannot hold both. This is **incoherent**.
