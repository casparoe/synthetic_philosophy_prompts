answer: |-
  **Project Title:** The Price of Thought: Cost, Erasure, and the Structure of Indirect Normativity

  **The Research Question**
  Standard debates in indirect normativity ask: *Given the standard that determines what an agent objectively ought to do, which standard should she use when she decides what to do?* This proposal argues that this question is ill-posed because it treats deliberation as costless and psychologically transparent. I propose to answer a more precise question: **Is indirect normativity *deliberatively stable* only when deliberation is costly?**

  To answer this, I will employ the following working definitions:
  *   **Indirect Normativity:** A structure where the criterion of rightness (what makes an act good) differs from the decision procedure (what the agent should aim at).
  *   **Deliberative Stability:** *[New Term]* A normative standard is stable if an agent's acceptance of it does not reduce the probability of successfully executing it below a threshold of rational competence.
  *   **Executive Erasure:** *[New Term]* Distinct from self-effacement (which concerns belief or assertion), a procedure suffers executive erasure if the *act of adopting it* alters the psychological conditions required to *perform* it. (e.g., A theory requires spontaneity, but adopting the theory induces reflection that kills spontaneity).
  *   **Costly Deliberation:** A model where each step of reasoning consumes a finite resource (time, attention), imposing an *endogenous stopping rule* (the agent must decide when to stop thinking).
  *   **Depth:** The number of meta-deliberative steps (thinking about thinking) an agent takes before acting.

  **Why Existing Positions Leave This Open**
  Current literature addresses axes of this problem but fails to integrate them, leaving the stability of indirect normativity unresolved.
  1.  **Ideal Advisor Models:** These address the *Synchronic* question (what to consider now) but assume costless, depth-unbounded deliberation. They cannot explain why an agent should stop deliberating, rendering indirectness unstable when reflection is free.
  2.  **Sophisticated vs. Resolute Choice:** These address the *Architectural* question (binding future selves) but treat the agent's psychology as a black box. They do not test whether the *acceptance* of the binding policy triggers executive erasure.
  3.  **Self-Effacement Literature:** This addresses the *Doxastic* question (what to believe/teach). It asks if a theory should be believed. It does not ask if a theory can be *executed* by a believer. My project distinguishes *Doxastic Transparency* (can I believe this?) from *Executive Transparency* (can I use this while believing it?).

  By isolating *Cost* and *Erasure*, this project moves beyond asking which theory is true to asking which theoretical structures are *livable* under realistic cognitive constraints.

  **Methodology: Twelve-Month Plan**
  I will not conduct a survey of existing positions (which describes the landscape but does not test structural viability) nor appeal to empirical psychology (which describes how we *do* deliberate, not how we *ought* to under normative constraints). Instead, I will construct a conceptual toy model to stress-test normative structures.

  *   **Months 1–3: Formalizing the Erasure Test.** I will define necessary and sufficient conditions for *Executive Erasure*. I will produce a taxonomy of deliberative procedures scored against this test. *Deliverable:* A working definition of "Self-Erasing Procedure."
  *   **Months 4–6: Modeling Cost.** I will construct a formal model of deliberation where depth has a price. I will derive the *Endogenous Stopping Rule*: the point at which the cost of further meta-deliberation outweighs the expected gain in decision quality. *Deliverable:* A proof of concept showing that without cost, the stopping rule is undefined.
  *   **Months 7–9: Testing the Conjecture.** I will apply the Cost Model and Erasure Test to two case studies: Indirect Consequentialism and Rule-Based Deontology. I will determine if indirectness collapses into directness when deliberation is free, and if it stabilizes when deliberation is costly. *Decision Point:* I will defend the conjecture that indirectness *requires* cost. Killing the conjecture leaves a vacuum; defending it provides a constructive constraint on normative theory.
  *   **Months 10–12: Synthesis and Writing.** I will integrate the model and case studies into the final article, ensuring the argument is accessible to non-specialists by minimizing formal notation in the main text.

  **Deliverables**
  1.  **Article (9,000 words):** Titled "The Stability of Indirect Normativity." It will argue that costless deliberation renders indirect norms unstable due to executive erasure.
  2.  **Appendix (2 pages):** "Negative Results." This will list specific normative structures that failed the Erasure Test or the Cost Model.
      *   *Value to Generalists:* This appendix acts as a map of minefields. It shows other philosophers which theoretical combinations are structurally unsound, saving future research time. It is not an admission of defeat but a record of boundary conditions.

  **Failure Conditions**
  I identify two distinct conditions under which this project would fail to yield the proposed results:
  1.  **The Collapse of Erasure:** The distinction between *Executive Erasure* and *Self-Effacement* proves untenable. If erasure turns out to be merely self-effacement redescribed, the "newness" of the first axis vanishes. *Mitigation:* I will focus on the *mechanism* of failure (psychological execution vs. propositional belief) to maintain the distinction.
  2.  **The Triviality of Cost:** The conjecture that "indirectness requires cost" collapses into a familiar point about bounded rationality or economic efficiency. If the result is merely "people should stop thinking when it gets expensive," the normative significance is lost. *Mitigation:* I will frame cost not as an economic constraint but as a *constitutive* feature of agency required to solve the regress of meta-deliberation.

  **Scope and Objections**
  *   **Scope Management:** To ensure completion in twelve months, I will not apply this model to Virtue Ethics or Care Ethics. I will restrict the case studies to Consequentialist and Deontological frameworks where the direct/indirect split is sharpest.
  *   **The Rule-Consequentialism Objection:** A committee member may suspect this is merely Rule-Consequentialism with new vocabulary.
      *   *Response:* Rule-Consequentialism is a *substantive* moral claim (maximize value by following rules). This project is a *structural* meta-normative claim (any view claiming indirectness must satisfy stability conditions). The project applies to Deontology just as much as Consequentialism. It does not tell the agent *which* rules to follow, but *how* a rule-based deliberation can remain viable without self-erasure.

  **Conclusion**
  This project transforms a half-formed intuition about deliberation into a testable structural constraint. By pricing thought and testing for erasure, it offers a determinate answer to why some ethical theories feel impossible to live: they are deliberatively unstable.
