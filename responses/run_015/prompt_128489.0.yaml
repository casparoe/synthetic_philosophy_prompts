  **MEMORANDUM**

  **TO:** Board of Trustees, Community College District
  **FROM:** Sustainable Food Working Group
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation Regarding Three-Year Lower-Carbon Menu Contract

  **Recommendation**
  The Sustainable Food Working Group recommends that the Board **do not sign** the proposed three-year "lower-carbon menu" contract in its current form. While the environmental intent is aligned with district values, the causal link between our expenditure and actual carbon reduction is too uncertain to justify the cost. We advise renewing the existing contract and redirecting the $190,000 annual premium to reinstate the peer tutoring program.

  **Financial Impact and Opportunity Cost**
  The proposed contract carries a premium of approximately $190,000 per year over the status quo. This is not abstract budgetary slack; these are funds previously allocated to the peer tutoring program, which was cut two years ago. We are weighing a concrete educational benefit against a probabilistic environmental claim. If the environmental claim fails to materialize, the district loses both the carbon reduction and the tutoring support. Given our mandate to serve 9,000 students, prioritizing direct academic support over unverified sustainability signaling is the fiscally responsible choice.

  **The Causal Chain: Addressing the "Zero Impact" Risk**
  We must take seriously the possibility that this contract results in zero fewer animals raised. Our provider sources through a regional distributor using a pallet-based ordering system. Our current volume sits 4% above a pallet boundary. The proposed 40-ton reduction (roughly 7%) would flip us to the lower pallet threshold. However, the distributor operates on a rolling forecast. Reduced units are not necessarily removed from the supply chain; they are offered to other institutional clients at a discount. They are only removed if no other client purchases them.

  Furthermore, the Student Union is voting independently to go beef-free in their cafe (2% of volume). If their vote passes, and we sign this contract, we may both contribute to a pallet reduction that would have happened anyway due to market fluctuations elsewhere in the region. If the pallet would have flipped regardless of our action, or if the beef is simply resold to another institution, our $190,000 expenditure changes nothing physically.

  If our brother-in-law's skepticism is correct—that individual institutional actions are swallowed by market logistics—then the primary justification for this contract collapses. The only remaining benefit is "signaling" to students and stakeholders. While signaling has value, it is difficult to justify spending $570,000 over three years on a signal that implies a physical change which may not have occurred. We cannot in good conscience ask the Board to fund a claim we cannot verify.

  **Governance and the Logic of Voting**
  This uncertainty mirrors a discussion within our Working Group. One member intends to abstain from this recommendation, arguing that their single vote will not decide the outcome. This logic parallels the skepticism regarding the beef contract: if one person's action doesn't change the result, why act?

  However, there is a critical distinction. The beef market is a complex system where our causality is diluted by distributors and other buyers. The Board vote is not. Our recommendation directly informs the Board's decision. If every member of this group abstained based on the belief that their vote doesn't matter, no decision would be reached, and operational paralysis would ensue. In the voting booth, individual agency is absolute; in the beef market, it is contingent. We urge the Board to recognize that while market impact is uncertain, governance impact is real. We must vote based on the evidence, not on the fear that our vote is insignificant.

  **Verification and Missing Information**
  Before any future consideration of similar contracts, we must resolve a specific factual gap. We need to know: **Does the provider guarantee that reduced units are destroyed or removed from the supply chain, rather than resold?**

  Currently, the provider admits reduced units are offered to other clients. We need written confirmation of their disposal protocol for surplus inventory attributed to sustainability contracts.
  *   **Who to ask:** The Provider's Regional Director of Supply Chain.
  *   **Deadline:** We need this answer before any contract execution.

  Without this guarantee, we are paying for a paper reduction, not a physical one.

  **Review Trigger**
  Should the Board choose to revisit this decision in the future, or if we pursue a modified agreement, we recommend a one-year review trigger.
  *   **Metric:** Actual procurement data vs. pallet thresholds.
  *   **Trigger:** If the district's beef volume drops but the distributor's total regional orders for that product do not drop proportionally, the contract must be terminated. We need evidence that our reduction wasn't simply absorbed by another client.

  **Conclusion**
  We recommend declining the current contract. The risk that our investment yields no environmental return is too high, especially when weighed against the certainty of restoring peer tutoring. We should not pay a premium for uncertainty when we have concrete needs on campus.

  **Action Required:** Board approval to renew existing food service contract and reallocate $190,000 to Student Services for peer tutoring reinstatement.
