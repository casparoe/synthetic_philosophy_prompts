  1. Brainstorming and Selection
  I considered a nurse ordering tests, but medical stakes feel too high for ordinary life. I considered a manager covering shifts, but the causal links were muddy. I selected a freelance designer responding to late emails. This isolates the common cause (professional insecurity) cleanly: insecurity drives both the immediate response and future poor negotiation, without the response itself causing the negotiation failure. This fits the constraints for ordinary stakes and clear theoretical divergence.

  2. Scenario
  You are a freelance graphic designer. At 11 PM, a potential client emails a job offer worth $300. You must choose: **Option A: Reply immediately** to secure the deal, or **Option B: Wait until morning** to respond. Industry data shows designers who reply late at night are statistically likely to earn lower hourly rates later in their careers. This correlation exists because professional insecurity causes both late-night responsiveness and an inability to negotiate higher rates subsequently. Replying now does not cause future negotiation failure; insecurity causes both. However, replying now causally secures the $300. Waiting risks losing the job. Your current insecurity level is unknown to you. The stakes are the $300 now versus long-term rate reputation. Option A yields immediate cash but signals a trait linked to poverty. Option B protects your self-image but risks immediate loss.

  3. Theory-by-Theory Analysis
  Causal Decision Theory (CDT) recommends Option A. CDT holds fixed the unchangeable past, including your level of professional insecurity. Since insecurity is already fixed, your choice cannot change it. The only causal consequence of replying now is securing the $300 job. Waiting causally risks losing the income with no offsetting benefit, as your future negotiation skills are already determined by your existing temperament. Therefore, the action with the best causal outcome is to reply.

  Evidential Decision Theory (EDT) recommends Option B. EDT treats your action as news about your underlying state. Replying immediately is strong evidence that you possess professional insecurity. Since insecurity correlates with poor future negotiation and lower lifetime earnings, learning you replied late at night is bad news. Even though replying secures the $300, the evidential link to future financial loss outweighs the immediate gain. Waiting is good news; it suggests you are secure enough to wait, predicting better future rates.

  Updateless Decision Theory (UDT) recommends Option A, but for a different reason than CDT. UDT selects the best general policy for this type of situation across all similar occasions. The policy Always respond promptly to legitimate leads maximizes expected income by ensuring consistent workflow and reputation reliability. UDT ignores the self-diagnostic information because the policy is chosen before observing the specific urge to reply. While CDT focuses on the local causal impact of this specific reply, UDT focuses on the global optimality of the responsiveness policy itself, disregarding the correlation with insecurity as irrelevant to the policy's utility. UDT asks what you would have pre-committed to, not what your action says about you now. It evaluates the output of the decision algorithm rather than the specific act's causal footprint.

  4. What Does the Work
  The structural feature driving the divergence is the common cause correlation that is screened off from the action's causal power but visible to evidence. Insecurity causes both the action and the bad outcome, but the action does not cause the bad outcome. EDT fails because it treats the action as informative about the hidden common cause. If we remove this feature—for instance, if you knew your insecurity level with certainty—the correlation vanishes. EDT would then screen off the evidence, aligning with CDT and UDT. The case relies on self-locating uncertainty regarding one's own temperament. Without this opacity, the evidential weight disappears, and all three theories converge on Option A. The tension exists only because the agent uses their own behavior to diagnose a hidden trait that influences future outcomes independently of the current act.

  5. Best Reply on Behalf of the Evidential Reasoner
  An evidential theorist might object that this is a Tickles Defense case. They argue a rational agent knows their own reasons for acting. If you reply because you need the money, not because you are insecure, you know your state. Thus, the action provides no new evidence about insecurity. However, this case survives if we assume introspective opacity. Professionals often misattribute their motivations; you may not know if you are responding due to diligence or insecurity. Under realistic psychological uncertainty, the evidential link remains, preserving the divergence.
