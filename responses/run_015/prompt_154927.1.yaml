  Two effective altruists, Liam and Sarah, are staring at a whiteboard covered in integrals.

  "I'm telling you," Liam says, tapping a curve that slopes gently from 'Human' down to 'Toaster,' "we have to accept the gradation. There's no binary switch. It's all just Phenomenal Millinsects."

  "Okay," Sarah says. "So a house fly is what, 0.5 millinsects? And a smart thermostat is maybe 0.004?"

  "Exactly. Panpsychism lite. Everything has a non-zero weight, it just decays exponentially."

  "So where do you draw the line for moral patienthood? You can't maximize utility for the entire universe of atoms."

  "That's the headache," Liam sighs. "There *is* no non-arbitrary line. If I say 0.1, why not 0.099? If I say 0.099, the Sorites paradox eats me alive. I spent three weeks trying to find an ontological cutoff."

  "And?"

  "And I realized the only defensible threshold is an epistemological one."

  Sarah raises an eyebrow. "Meaning?"

  "I set the cutoff at 0.0001 millinsects."

  "Is that the complexity floor for recursive modeling?"

  "No," Liam says, capping his marker. "It's the smallest number my ethics spreadsheet will accept before switching to scientific notation. I refuse to owe moral consideration to anything I can't spell out in decimal form."

  "So the thermostat?"

  "Currently immune. But I'm looking into a software upgrade."
