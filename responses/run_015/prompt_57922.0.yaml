answer: |-
  Right, let's have a proper look at this. First off, trust your instincts: that bit about learning to swim from a manual without getting in the water does sound a bit dodgy, and you're right to be suspicious of it. Your intuition is actually shared by a lot of philosophers who criticise that strong version of Intellectualism.

  Here's a breakdown of what your revision blog gets right, where it's a bit too simplistic, and how we can use your Gran and TikTok example to sort it out.

  ### 1. What the Blog Gets Right

  The blog is spot on with the basic definitions and the historical landscape:

  *   **Knowing That (Propositional Knowledge):** Yes, this is knowledge of facts or truths that can be stated in language (e.g., "I know *that* Paris is the capital of France").
  *   **Knowing How (Procedural Knowledge):** Yes, this is generally understood as a skill or ability (e.g., "I know *how* to ride a bike").
  *   **Ryle's View (Anti-Intellectualism):** Gilbert Ryle, in his book *The Concept of Mind* (1949), argued against the idea that thinking is just a ghostly internal process. He claimed 'knowing how' is distinct from 'knowing that'. For Ryle, having an ability isn't just about having facts in your head; it's about being disposed to act successfully.
  *   **Intellectualism:** The blog is correct that Intellectualists (like Jason Stanley and Timothy Williamson in contemporary philosophy, or Socrates in the ancient stuff) argue that 'knowing how' is actually just a species of 'knowing that'. They claim that when you know how to do something, you possess certain propositional knowledge about the method.

  ### 2. What the Blog Gets Wrong (or Oversimplifies)

  This is where your niggle comes in. The blog claims Intellectualism means "you could in theory learn to swim from a manual without getting in the water."

  *   **The Mistake:** This is a bit of a straw man. Most contemporary Intellectualists don't necessarily claim that reading a manual gives you the *physical ability* to swim. They claim it gives you the *knowledge* constitutive of the skill. However, they usually admit you still need physical practice to build the muscle memory.
  *   **The Real Issue:** The blog is conflating *having the knowledge* with *having the capacity*. The reason it sounds off to you is that 'knowing how' in ordinary language implies you can actually *do* the thing. If Intellectualism says you know how to swim just by reading the book, but you sink like a stone when you jump in, it seems to be using the word "know" in a way that doesn't match reality. This is exactly the objection Anti-Intellectualists make: knowledge how requires success in action, not just facts in the head.

  ### 3. The Gran vs. TikTok Test

  Let's apply this to your example.
  *   **Gran:** Cooks perfect Jollof rice every time (high ability), but can't explain the recipe or measurements (low propositional knowledge).
  *   **You (TikTok):** Can recite the recipe steps perfectly from memory (high propositional knowledge), but when you cook it, you burn the rice (low ability).

  Here is how each view judges who "knows how" to cook Jollof:

  #### The Rylean (Anti-Intellectualist) View
  Ryle would say **Gran knows how**, and **you do not**.
  *   **Why?** For Ryle, 'knowing how' is demonstrated by successful performance. Gran has the disposition to cook the rice correctly. She might not be able to articulate the rules (the 'knowing that'), but that doesn't matter.
  *   **You:** Even though you have the facts (the 'knowing that'), you lack the skill. Therefore, you don't truly know *how* to cook it; you only know *that* certain steps are involved. Ryle would say you are suffering from an "intellectualist legend"—thinking that having the rules in your head is the same as having the skill.

  #### The Intellectualist View (as described by your blog)
  The blog's version of Intellectualism would suggest **you know how**, and **Gran might not** (or at least, her knowledge is suspect).
  *   **Why?** If 'knowing how' is just a kind of 'knowing that' (possessing the correct information about the method), then you possess the knowledge. You have the propositions ("first fry the tomatoes," "use 500ml stock").
  *   **Gran:** Since she cannot state the facts or rules, an Intellectualist might argue she doesn't strictly possess the *knowledge*, even if she has the habit or ability. She is acting blindly, whereas you are acting on information.
  *   **Why this feels wrong:** This confirms your suspicion. It seems absurd to say you know how to cook Jollof if your pot is full of burnt rice. This is why many philosophers think the blog's strong Intellectualist view is flawed—it separates knowledge from success too sharply.

  ### 4. How to Fix It in Your Head

  To keep this simple but accurate for your essays:

  1.  **Ryle:** Knowing How $\neq$ Knowing That. Ability is key. (Gran wins).
  2.  **Intellectualism:** Knowing How $\subseteq$ Knowing That. Information is key. (You win, theoretically).
  3.  **The Nuance:** The reason the "swimming manual" claim sounds off is that it ignores the **practical mode of presentation**. Even Intellectualists like Stanley argue you need to grasp the proposition in a practical way, not just a theoretical one. However, the blog has simplified this to the point where it sounds like reading a book is enough.

  **Summary for your revision:**
  Your blog is a decent starting point, but be careful with that swimming claim. In an exam, you'd get extra marks for pointing out that strong Intellectualism leads to the counter-intuitive result that the person burning the rice "knows how" to cook it, while the expert cook who can't explain the recipe might not. That tension is exactly where the debate lives.

  Keep trusting that gut feeling—it's doing the philosophical work for you!
