  ## Leaf Positions

  ### Leaf A: Restrictionist (Semantic Restriction)
  *   **Position:** The Knowability Principle is true, but it only applies to "basic" truths. It does not apply to complex statements involving knowledge (like the ones used in Fitch's proof). This blocks the proof before it starts.
  *   **Hair Count Implication:** The Hair Count is a physical truth, so the Principle *does* apply. It **is knowable in principle** (e.g., if we had perfect reconstruction tech), but we don't know it yet. The lack of knowledge is temporary/contingent, not necessary.
  *   **Occupancy:** **Common.** (Occupied by Dummettian anti-realists and some epistemic theorists).
  *   **Note:** Distinguishes between "truths that make knowledge possible" and "truths about knowledge."

  ### Leaf B: Non-Distributivist (Logical Revision)
  *   **Position:** Knowledge does not distribute over conjunction. One can know "P and not-Known-P" without knowing "P" and knowing "not-Known-P" separately. This breaks the proof's logical step.
  *   **Hair Count Implication:** The Hair Count is true and knowable. The fact that we don't know it doesn't generate a contradiction because our knowledge isn't required to split apart logically.
  *   **Occupancy:** **Rare/Untried.** (Mostly theoretical; unattractive because it requires changing basic logic of knowledge).
  *   **Note:** Incoherent to many because "knowing A and B" intuitively implies "knowing A."

  ### Leaf C: Non-Factivist (Unnamed)
  *   **Position:** Knowledge does not require truth. One can "know" falsehoods. This allows the proof's contradiction to dissolve (you can "know" something that isn't true).
  *   **Hair Count Implication:** We might "know" a hair count number, even if it's wrong. Or, the truth is knowable, but "knowing" it doesn't lock in the reality.
  *   **Occupancy:** **Incoherent/Unoccupied.** (Standard definition of knowledge includes truth; denying this is usually considered changing the subject from "knowledge" to "belief").
  *   **Note:** Philosophically costly; essentially abandons the concept of knowledge.

  ### Leaf D: Paraconsistentist (Unnamed)
  *   **Position:** Contradictions can be possible. The scenario "Known and Not Known" is impossible in reality but can exist in a "possible world" without exploding the system.
  *   **Hair Count Implication:** It is possible to know the Hair Count even if that implies a contradiction with our current state. Truth is robust enough to handle contradictory knowledge states.
  *   **Occupancy:** **Very Rare.** (Occupied by dialetheists, but rarely applied specifically to Fitch).
  *   **Note:** High theoretical cost; requires accepting true contradictions.

  ### Leaf E: Omniscient (Bullet Biter)
  *   **Position:** The proof is sound. Therefore, there are no unknown truths. All truths are in fact known (perhaps collectively, implicitly, or dispositionally).
  *   **Hair Count Implication:** Someone **actually knows** the Hair Count right now. (Perhaps God, or perhaps the information is preserved in the universe in a way accessible to finite agents, or we "know" it without realizing it).
  *   **Occupancy:** **Rare/Unattractive.** (Some Idealists or extreme Verificationists).
  *   **Note:** Violates common sense but is logically consistent if you accept the proof.

  ### Leaf F1: Straight Realist (Empirical)
  *   **Position:** The Knowability Principle is **false**. There are true statements that are *never* possibly known by actual agents. The proof is a *reductio* of the Principle, not a proof of Omniscience.
  *   **Hair Count Implication:** The Hair Count is **true but unknowable**. The evidence is gone (physical limit). Truth outstrips knowledge.
  *   **Occupancy:** **Common.** (Standard Scientific Realism).
  *   **Note:** Accepts that reality is larger than what can be verified.

  ### Leaf F2: Straight Realist (Metaphysical)
  *   **Position:** The Knowability Principle is **false**. Some truths are metaphysically inaccessible to finite agents, regardless of evidence.
  *   **Hair Count Implication:** The Hair Count is **true but unknowable**, not just because evidence is lost, but because *no finite agent* could ever access past particular facts without records.
  *   **Occupancy:** **Common.** (Subset of Realism).
  *   **Note:** **Indistinguishable from F1** on the Hair Count outcome, but differs on *why* (Physical vs. Metaphysical barrier).

  ### Leaf G1: Possibilist (Physicalist)
  *   **Position:** The Knowability Principle is **true**. "Possibly known" means "Known by finite agents in a physically possible world." We don't know it, but counterparts of us *could* (e.g., if they lived at the time of death).
  *   **Hair Count Implication:** The Hair Count is **knowable**. A possible agent (someone alive at the time) could have counted it. The truth is tied to the possibility of verification by *someone like us* in a better situation.
  *   **Occupancy:** **Common.** (Standard Epistemic Possibilism).
  *   **Note:** Respects the Professor's constraint (finite agents).

  ### Leaf G2: Possibilist (Metaphysical)
  *   **Position:** The Knowability Principle is **true**. "Possibly known" allows for scenarios that violate actual physical laws (e.g., time travel, reversing entropy) as long as the *agent* is finite.
  *   **Hair Count Implication:** The Hair Count is **knowable**. Even though evidence is gone, a possible agent with time-travel (but no oracle powers) could know it.
  *   **Occupancy:** **Untried/Unattractive.** (Tension with "relevantly like us" constraint if physics is broken).
  *   **Note:** Risks violating the Professor's "no oracle" condition if "reversing entropy" counts as magic.

  ---

  ## Structural Notes for the Seminar

  **1. Indistinguishable Leaves:**
  *   **Leaf F1 (Realist-Empirical)** and **Leaf F2 (Realist-Metaphysical)** are functionally identical regarding the Hair Count case (both say "True but Unknowable"). The tree separates them via **Q8** to highlight *why* they think it's unknowable, but empirically, they occupy the same space on the paradox.

  **2. Unoccupied/Incoherent Combinations:**
  *   **Leaf C (Non-Factivist):** Almost no one occupies this. It is generally considered incoherent to define "knowledge" without "truth." If you choose this, you are likely talking about "belief," not knowledge.
  *   **Leaf G2 (Possibilist-Metaphysical):** This is borderline incoherent given the Professor's constraint ("relevantly like us"). If the agent requires time travel to know the truth, are they "like us"? This position is untried because it risks collapsing into Idealism or Magic.

  **3. The "Hair Count" Test:**
  *   **Realists (F1/F2)** say: "It has a number, but we can't know it."
  *   **Possibilists (G1/G2)** say: "It has a number, and it *could* be known (by someone else/time)."
  *   **Omniscients (E)** say: "It has a number, and it *is* known."
  *   **Restrictionists (A)** say: "It has a number, and it *could* be known (KP applies to physical facts)."
  *   **Logic Revisionists (B/C/D)** say: "The question assumes logic/truth/knowledge works normally, which I deny."

  **4. Professor's Constraint Check:**
  *   All "Possibilist" leaves (G1/G2) specify **finite agents**. No leaf offers an "Ideal Observer" or "God" solution, as this would violate the seminar constraint that the agent must be "relevantly like us."
