      *   *Side B (Torture):* A specific disaster (e.g., Rana Plaza collapse). Concentrated, visible, severe suffering/death.
      *   *The Core Tension:* Aggregation (Utilitarian) vs. Threshold/Deontological constraints (Rights-based).

  3.  **Identify Key Implications:**
      *   *Implication 1: The Visibility Bias.* We react strongly to the disaster (Side B) but ignore the routine harm (Side A). Why? Psychological salience vs. statistical invisibility.
      *   *Implication 2: Causal Dilution.* In the dust speck scenario, no single agent feels responsible. In the disaster, specific managers/owners might be blamed. How does this affect *moral responsibility*?
      *   *Implication 3: Structural vs. Individual.* The micro-harms are structural (built into the pricing model). The macro-harm is often a failure of safety protocols within that structure.
      *   *Implication 4: The Aggregation Threshold.* At what point do the dust specks equal the torture? In supply chains, the "dust specks" often *cause* the "torture" over time (chronic abuse vs. acute disaster).
