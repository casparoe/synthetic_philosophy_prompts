      *   **Topic:** Moral Particularism vs. Generalism.
      *   **Student Background:** Done Act Utilitarianism & Kant. Belief split: "Morality = Rules" vs. "Just be good (vague)."
      *   **Instructor's Goal:** Wants a *plan*, not a lecture script. Wants *pushback* on specific pedagogical choices.
      *   **Specific Questions/Constraints:**
          1.  **Opening:** Epistemology (perception/skill) vs. Standard Move (valence flipping). Instructor prefers Epistemology first. Is this backwards? What breaks?
          2.  **Example:** Needs a carrying case where a feature *unambiguously flips* valence (not just outweighed). Avoid lying/promises/harm (triggers deontological reflexes). What does the example need/lack?
          3.  **Misconceptions:** Particularism = Relativism; Particularism = Spooky Intuition; Generalism = Default Reasons (Defeasible Generalism). How to distinguish default reasons from *pro tanto* principles? Where to head these off?
          4.  **Scope:** What to explicitly *refuse* to cover?
          5.  **Closing:** One board question to check understanding of the *disagreement*, not just confusion.

  2.  **Deconstruct the Instructor's Proposal (The Pushback):**
      *   *Idea:* Start with Epistemology (moral perception like wine tasting) -> Then ask if it can be codified.
      *   *Critique:* This is risky for 9am first-years. Why? Because "moral perception" sounds exactly like the "just be a good person" intuition they already have. If you start there, you validate the anti-rule half of the room immediately without giving the rule-followers a reason to care. The "valence flip" (holism of reasons) is the *argument* for particularism; the epistemology is the *consequence* or *picture* of it. If you start with the picture, students think it's just a metaphor. If you start with the logic (valence flip), the epistemology follows as a necessity.
      *   *Verdict:* It is backwards. Start with the logic (holism), *then* show the epistemological implication. Otherwise, the "rule" crowd dismisses the epistemology as hand-waving.

  3.  **Develop the Carrying Example:**
      *   *Constraint:* No lying, promises, harm (avoids Kant/Util traps).
      *   *Requirement:* Feature must flip valence (good -> bad), not just get outweighed.
      *   *Idea:* Pleasure/Enjoyment.
      *   *Case A:* Enjoying a meal with friends (Good).
      *   *Case B:* Enjoying someone's suffering (Schadenfreude) or enjoying a task that *should* be somber (laughing at a funeral).
      *   *Refinement:* "Amusement."
      *   *Case 1:* Finding a joke funny at a comedy club. (Positive reason for action/attitude).
      *   *Case 2:* Finding a joke funny at a funeral. (Negative reason).
      *   *Wait, is it outweighed?* A generalist says "Amusement is good, *but* respect is weightier." A particularist says "Amusement *here* is not a good thing at all."
      *   *Better Example:* "Surprise."
      *   *Case 1:* Surprise party. (Good).
      *   *Case 2:* Surprise attack / Surprise exam when you're unprepared. (Bad).
      *   *Is it just context?* The feature "being a surprise" contributes positively in one, negatively in the other.
      *   *Best Example:* **Pleasure/Pain** (but carefully handled). Or **Difficulty/Effort**.
      *   *Let's go with "Difficulty."*
      *   *Case 1:* Solving a hard puzzle. The difficulty adds value.
      *   *Case 2:* Trying to open a child-proof cap when you need medicine. The difficulty is a hindrance (negative).
      *   *Wait, is difficulty a moral feature?* Maybe not strictly.
      *   *Let's try "Doing something because it's requested."*
      *   *Case 1:* Friend asks for help. Reason to do it.
      *   *Case 2:* Enemy/Manipulator asks for help to do harm. Reason *not* to do it (or the request itself counts against it).
      *   *Actually, the classic Dancy example is best:* **Pleasure.**
      *   *Case 1:* Pleasure of reading a poem. (Good).
      *   *Case 2:* Pleasure of watching a torture video. (Bad).
      *   *Generalist Counter:* "Pleasure is *prima facie* good."
      *   *Particularist Counter:* "In the torture case, the pleasure is *part of the badness*." It's not that the good pleasure is outweighed by bad harm; the pleasure itself is vicious.
      *   *Selection:* **Pleasure in another's misfortune.** It avoids "lying/promises" but hits the "harm" constraint slightly. Let's try **"Being unusual."**
      *   *Case 1:* Wearing an unusual outfit to a costume party. (Good).
      *   *Case 2:* Wearing an unusual outfit to a court hearing. (Bad).
      *   *Generalist:* "Unusualness is neutral, context matters."
      *   *Particularist:* "Unusualness is the reason it's good in case 1, and the reason it's bad in case 2."
      *   *Decision:* I will recommend **"Pleasure"** but framed carefully to avoid the "harm" trigger. Or **"Surprise."** Let's go with **Surprise**. It's morally neutral on its face, making the flip clearer.
      *   *Wait, Instructor said avoid harm.* Surprise attack involves harm.
      *   *Let's go with "Doing what your father did."**
      *   *Case 1:* Father was a doctor. You become a doctor. (Good/Continuity).
      *   *Case 2:* Father was a criminal. You become a criminal. (Bad).
      *   *Feature:* "Imitating one's father."
      *   *Flip:* Positive reason vs. Negative reason.
      *   *Generalist:* "Imitate father *ceteris paribus*."
      *   *Particularist:* "The valence depends entirely on the father."
      *   *Actually, let's stick to the strongest philosophical example:* **Pleasure.** It's the standard for a reason. I need to tell the instructor *why* it works despite the "harm" worry. The point is the *pleasure's* valence, not the harm's.
      *   *Alternative:* **Keeping a Secret.**
      *   *Case 1:* Keeping a friend's surprise party secret. (Good).
      *   *Case 2:* Keeping a secret about abuse. (Bad).
      *   *Feature:* "Keeping a secret."
      *   *Flip:* Reason for -> Reason against.
      *   *Generalist:* "Keep secrets *unless* harm." (This makes harm the switch).
      *   *Particularist:* "The secret-keeping itself changes character."
      *   *Recommendation:* I'll suggest **"The fact that it would be fun."**
      *   *Case 1:* Fun to play a game. (Reason to do).
      *   *Case 2:* Fun to kick a dog (sadism). (Reason *not* to do / contributes to wrongness).
      *   *Why:* It isolates the "fun" feature.

  4.  **Addressing Misconceptions:**
      *   *Relativism:* Particularism isn't "anything goes." It's "context sensitive," not "subjective."
      *   *Spooky Intuition:* It's about perception (Aristotelian *phronesis*), not magic.
      *   *Defeasible Generalism:* This is the crux. *Pro tanto* vs. *Default*.
      *   *Distinction:* A *pro tanto* principle says "X is always a reason, though it can be outweighed." A *default* says "X is usually a reason." Particularism says "X is not even a reason in some cases."
      *   *Intervention Point:* After the example, before the epistemology.

  5.  **Scope Refusal:**
      *   Don't cover *why* particularism is true (metaphysics of reasons).
      *   Don't cover *how* to decide cases without rules (decision procedure).
      *   Don't cover Radical Particularism (no principles at all) vs. Moderate. Stick to the core disagreement about holism.

  6.  **Closing Question:**
      *   Needs to test the *disagreement*.
      *   "Is there any feature that is always a reason?" (Too simple).
      *   "If you agree that lying is usually wrong, are you a generalist?" (Better).
      *   "Does the context change the *weight* of the reason or the *existence* of the reason?" (Best).

  7.  **Drafting the Plan (incorporating the pushback):**
      *   *Tone:* Collegial, direct, respecting the 9am constraint.
      *   *Structure:*
          1.  Pushback on the Opening (Epistemology first is risky).
          2.  The Example (Criteria + Suggestion).
          3.  The Sequence (Where to kill misconceptions).
          4.  Scope Refusals.
          5.  The Board Question.

  8.  **Refining the Pushback on Epistemology:**
      *   If I start with "Morality is like wine tasting," the Kantians will say "That's subjective." The Utilitarians will say "That's inefficient."
      *   If I start with "Does 'fun' always count in favor?" they have to engage with the logic first.
      *   *Argument:* Epistemology is the *solution* to the problem posed by Holism. Don't give the solution before the problem.

  9.  **Refining the Example:**
      *   "Fun" is good. But "Sadistic fun" triggers the "Harm" ban.
      *   How about **"Doing what is traditional"**?
      *   Case 1: Traditional wedding vows. (Good).
      *   Case 2: Traditional blood feud. (Bad).
      *   Feature: "It is traditional."
      *   This avoids harm/lying/promises directly as the *feature*, though the cases involve them.
      *   Actually, **"Being requested"** is safer.
      *   Case 1: Friend requests help moving. (Reason).
      *   Case 2: Tyrant requests you inform on a neighbor. (Counter-reason).
      *   Let's suggest **"The fact that it would be enjoyable"** but warn them to handle the sadism case carefully so it doesn't collapse into "harm outweighs fun." The point is the enjoyment *itself* becomes ugly.

  10. **Refining the Generalism Distinction:**
      *   Defeasible Generalism (Principles have *ceteris paribus* clauses).
      *   Particularism (Holism: Valence changes).
      *   Key distinction: *Outweighed* vs. *Silenced/Inverted*.
      *   Need to make sure students see that "Default" still implies a *standing* valence. Particularism denies the standing valence.

  11. **Final Review against constraints:**
      *   50 mins? Yes, keep it tight.
      *   9am? Keep it active.
      *   Pushback included? Yes.
      *   No lecture script? Yes.

  12. **Self-Correction during drafting:**
      *   *Wait, one nuance:* The instructor asked about "Defeasible Generalism." I need to confirm the terminology. Yes, often associated with *ceteris paribus* laws. The distinction is between a principle that *applies but is outweighed* vs a feature that *fails to apply as a reason*.
      *   *Board Question:* Needs to be diagnostic. "If you think 'pain is bad' is true, does that mean it's a principle?"

  13. **Final Polish:** Ensure the tone is supportive but critical where requested. (e.g., "Here is where I think you lose the room...")

  *(Self-Correction on the Opening Pushback)*: I need to be careful not to say "Don't do it." I need to say "Here is the risk, and here is how to mitigate it if you insist, but here is why the standard move works better for *this* audience." Actually, the prompt asks "Is that order backwards? What specifically breaks?" So I should answer that directly.
  *Answer:* Yes, it's backwards. What breaks is the *necessity* of the particularist conclusion. If you start with epistemology, it looks like an alternative *style* of morality. If you start with holism, it looks like a logical *requirement*.

  *(Self-Correction on Example)*: "Lying/Promises/Harm" are banned. I need something truly neutral.
  *Feature:* **"Being spontaneous."**
  *Case 1:* Spontaneous gift. (Good).
  *Case 2:* Spontaneous remark in a court testimony. (Bad).
  *Feature:* **"Being expensive."**
  *Case 1:* Expensive gift. (Good).
  *Case 2:* Expensive mistake. (Bad).
  *Let's go with "Being expensive."* It's clearly non-moral on its face.
  *Wait, is "expensive" a moral reason?* Maybe not.
  *Let's go with "Being requested by a friend."*
  *Case 1:* Friend asks you to water plants. (Reason).
  *Case 2:* Friend asks you to help them cheat. (Reason against? Or just neutralized?)
  *Particularist:* The request itself can count *against* you (because it shows disrespect for your morality).
