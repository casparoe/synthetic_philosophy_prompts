answer: |-
  Here is the pushback and the plan. I'm going to be direct because 9am on a Thursday with first-years is a combat zone, and you need to know where the traps are.

  ### 1. The Opening: Epistemology vs. Holism
  **Is the order backwards?**
  Yes. Here is what breaks if you lead with the epistemology (wine tasting/X-rays):

  1.  **It validates the "Just be good" half of the room prematurely.** The students who think morality is vague intuition will hear "it's like tasting wine" and think, *See? I told you. Rules are for robots.* You lose the rule-followers immediately because you haven't given them a logical reason to abandon the rule; you've just offered a metaphor that sounds subjective.
  2.  **It makes Particularism look like a psychological claim rather than a metaphysical one.** If you start with *how we know*, they will treat Particularism as a claim about human limitation (i.e., "We aren't smart enough to write the rules down"). Generalism can easily absorb this: "Sure, the rules are complex, but they exist."
  3.  **The "Necessity" Gap.** The epistemological picture is the *consequence* of the holism of reasons. If you don't establish first that reasons *flip* (holism), the claim that we need perception (epistemology) looks optional. You need to corner them into admitting that rules fail *before* you offer perception as the only remaining alternative.

  **The Fix:**
  Spend the first 15 minutes on the **Holism of Reasons** (the valence flip). Use the epistemology only in the last 15 minutes as the "So, how do we navigate this?" payoff. This forces the Kantians to engage with the logic before they retreat to "rules are ideal."

  ### 2. The Carrying Example
  You are right to avoid lying/promises/harm. Those trigger "Deontology vs. Utilitarianism" reflexes where students try to solve the case by adding *more* rules (e.g., "Don't lie *unless* it saves a life"). You need a feature that is morally thin enough that they can't easily smuggle in a hidden principle.

  **What the example needs:**
  *   **A feature that is ostensibly positive.** (If it's neutral, they'll say it's irrelevant. If it's negative, they'll say it's always bad).
  *   **A context where that feature contributes to *wrongness*, not just gets outweighed.**
  *   **No obvious "harm" switch.**

  **Recommendation: "The fact that it would be enjoyable."**
  *   **Case A:** You are considering going for a hike. It would be enjoyable. (Clearly a reason *for*).
  *   **Case B:** You are considering watching a video of a disaster (rubbernecking) or laughing at a funeral. It would be enjoyable.
  *   **The Trap:** Students will say, "But the harm outweighs the fun."
  *   **The Particularist Move:** You must press them: "Is the enjoyment *still a good thing* that is just outweighed by the badness of the situation? Or is the enjoyment *itself* part of what makes the action vicious?"
  *   **Why this works:** It isolates the *reason* (enjoyment). In Case B, the enjoyment isn't a pro tanto good that loses a tug-of-war; it is a mark of bad character. The valence has flipped from positive to negative.

  **What it needs to lack:**
  *   Do not let them introduce "harm to others" as the *switch*. If they say "Enjoyment is good *unless* it causes harm," they have saved Generalism. You must insist: "Assume the harm is fixed. We are asking about the *enjoyment* feature specifically."

  ### 3. Sequence & Misconceptions
  Here is the 50-minute flow. I have marked where to kill the misconceptions.

  **0:00–0:15: The Hook & The Holism (The Logic)**
  *   Define Generalism: Moral thought requires principles (features have invariant valence).
  *   Define Particularism: Moral thought does not require principles (holism of reasons).
  *   **Run the "Enjoyment" example.**
  *   **Intervention 1 (The Pro Tanto Trap):** When they say, "Enjoyment is *prima facie* good," draw a distinction on the board:
      *   *Defeasible Generalism:* "X is always a reason, but can be outweighed." (The reason exists but loses).
      *   *Particularism:* "X is not always a reason." (The reason vanishes or flips).
      *   *Ask:* "In the funeral case, is your laughter a *good thing* that you shouldn't do? Or is the laughter *itself* inappropriate?" If they say the latter, they admit the valence flipped.

  **0:15–0:30: The Generalist Defense (Steel-manning)**
  *   Don't let them straw-man Generalism. The sophisticated Generalist says: "We can add *ceteris paribus* clauses." (e.g., "Enjoyment is a reason, *ceteris paribus*").
  *   **Pushback:** If the *ceteris paribus* clause has to list every exception (including the funeral), is it still a principle? Or is it just a list of cases?
  *   **Intervention 2 (Relativism):** If they say "So anything goes?", stop them. "Particularism says reasons are *context-sensitive*, not *subjective*. The context is public. At a funeral, laughter is objectively inappropriate. It's not 'up to you'."

  **0:30–0:40: The Epistemology (The Payoff)**
  *   Now you introduce your preferred opening. "If there are no rules, how do we learn?"
  *   Use the Wine/X-ray analogy here. Because you've already proven the rules fail, the analogy now looks like a *solution* rather than a hand-wave.
  *   **Intervention 3 (Spooky Intuition):** Clarify that "perception" here means *trained sensitivity* (like a doctor reading an X-ray), not magic. It comes from experience and habituation (Aristotle), not a moral sense organ.

  **0:40–0:50: Synthesis & Board Question**
  *   Recap the disagreement.
  *   Put the question on the board.

  ### 4. Scope Refusals
  You must explicitly state what you are **not** doing, or they will spend 50 minutes asking about it. Say this at minute 10:

  1.  **"I am not asking you to decide which theory is true today."** (Prevents them from digging in).
  2.  **"I am not claiming Particularists don't use generalizations."** (They do, just not as *foundations*).
  3.  **"We are not solving the 'Decision Procedure' problem."** (i.e., Don't ask "How do I know what to do on Tuesday?" That's a separate problem from 'What makes an action right?').

  ### 5. The Board Question
  You want to know if they see the *disagreement*, not just if they are confused. Do not ask "What is particularism?"

  **Put this on the board:**
  > *"If you agree that 'Pain is usually a reason against an action,' are you a Generalist or a Particularist?"*

  **Why this works:**
  *   If they say **Generalist**, they miss the point (Particularists agree it's *usually* a reason).
  *   If they say **Particularist**, they miss the point (Generalists agree it's *usually* a reason).
  *   **The Correct Answer:** "It depends on whether you think 'usually' means 'there is a standing principle with exceptions' (Generalist) or 'there is a pattern of distinct cases with no underlying principle' (Particularist)."
  *   **The Diagnostic:** If they can articulate that the disagreement is about the *structure of the 'usually'* (Principle vs. Pattern), they get it. If they treat it as a disagreement about *how often* pain matters, they don't.

  ### Summary of Pushback
  *   **Don't start with Epistemology.** It lets the rule-followers off the hook too early. Start with the valence flip (Holism).
  *   **Don't let "Harm" save the Generalist.** In your example, isolate the feature (Enjoyment) so they can't say "Harm outweighs it."
  *   **Distinguish "Outweighed" from "Inverted."** This is the only way to stop them from collapsing Particularism into Defeasible Generalism.

  Good luck. 9am is brutal, but if you keep the "Enjoyment at a Funeral" case tight, you'll wake them up.
