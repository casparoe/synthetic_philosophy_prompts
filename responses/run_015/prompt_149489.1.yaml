  Case B, the engagement feed, would be condemned as a counterfeit. It offers momentary sensation without the temporal depth required by Strand 1. It supplies objects that are exhaustible and passive, violating Strand 2's requirement for inexhaustible engagement like study. The user reports no enjoyment afterward, proving the soul remains untouched. This is supply-side interference that degrades capacity. Her test here is strict: happiness must leave a trace on the person over time. The feed consumes attention without cultivating taste, leaving the user poorer in the very capacity required for happiness.

  Case C, the artificial companion, presents a complex illusion. It mimics the independence from others' favor praised in Strand 2, but it rests on the deception identified in Strand 4. While Du Châtelet admits illusion aids happiness, she values truth. An attachment to a known non-person is a willing surrender to prejudice. She would diagnose this as mixed: it soothes but degrades the capacity for genuine glory or love. The test is whether the object of passion possesses independent reality. The companion offers safety without the risk necessary for true glory, rendering the attachment a shadow of the real thing.

  Case D, the state survey, would be met with suspicion. It assumes happiness is aggregatable and administrable, ignoring Strand 1's claim that capacity is unequal and fixed. It privileges reported feeling over objective engagement, enshrining the prejudice of public opinion Strand 3 warns against. She lacks a vocabulary for political administration of happiness, marking this as neither supply nor capacity. The verdict is counterfeit because it mistakes report for reality. The state cannot budget for temperament, and attempting to do so institutionalizes false valuation.

  The single commitment doing the most work is the inequality and fixity of native capacity. This constrains her view that happiness cannot be manufactured externally. The one fact that would most change her answers is the discovery that native capacity is chemically alterable. If temperament is not fixed, her entire hierarchy collapses. Ranked by difficulty, from least constrained to most constrained, the order is D, C, A, B. Case D lies outside her political scope, while Case B strikes directly at her definition of happiness.

