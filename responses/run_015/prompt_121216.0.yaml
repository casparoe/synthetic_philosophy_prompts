  # Appendix: Detailed Consensus and Dispute Analysis

  *Note: This appendix section is included in the proposal to demonstrate to the supervisor that the student is aware of the academic landscape. In the final 7,000-word paper, this content will be integrated into the Introduction and Literature Review sections.*

  To ensure academic integrity, the following distinctions must be maintained throughout the writing process. Confusing these categories would undermine the credibility of the paper.

  ### A. The Status of Functional Decision Theory (FDT)
  *   **Claim:** FDT is the correct decision theory for acausal scenarios.
  *   **Consensus Status:** **Live Dispute.**
  *   **Detail:** Within the Center for Applied Rationality (CFAR) and LessWrong community, FDT is often treated as the leading candidate for solving Newcomb-like problems. However, in mainstream academic philosophy and economics, Causal Decision Theory (CDT) remains the dominant framework. Many academic philosophers argue that FDT conflates correlation with causation in a way that is metaphysically unjustified.
  *   **Proposal Stance:** The paper will not argue *for* FDT. It will argue *conditionally*: "If one accepts FDT, then the epistemic constraints become the primary bottleneck." This insulates the paper from the broader debate about FDT's validity.

  ### B. The Reality of the Basilisk Threat
  *   **Claim:** A future AI will actually implement this threat.
  *   **Consensus Status:** **Settled (Negative).**
  *   **Detail:** Even among the creators of the thought experiment, there is consensus that this is not a prediction. It is a stress test. The probability of a superintelligence arising with these specific goals and constraints is considered negligible by almost all experts in AI safety.
  *   **Proposal Stance:** The paper must explicitly state this. Treating the Basilisk as a genuine risk assessment would be academically irresponsible. It is a *normative* inquiry, not an *empirical* one.

  ### C. The Coherence of Acausal Trade
  *   **Claim:** Agents can influence each other without causal contact via logical correlation.
  *   **Consensus Status:** **Live Dispute.**
  *   **Detail:** This is the core metaphysical hinge. CDT proponents deny this is possible. FDT proponents argue it is a logical necessity (similar to how two calculators running the same algorithm will output the same sum without communicating).
  *   **Proposal Stance:** The paper treats this as a parameter. The "Epistemic Taxonomy" is designed to test how robust this coherence is when the "logical link" is noisy.

  ### D. The Memetic Hazard
  *   **Claim:** Thinking about the Basilisk makes it more likely to happen or harms the thinker.
  *   **Consensus Status:** **Settled (Psychological), Live (Metaphysical).**
  *   **Detail:** It is settled that thinking about it can cause anxiety (psychological harm). It is disputed (and generally dismissed) that thinking about it increases the metaphysical likelihood of the threat (acausal harm).
  *   **Proposal Stance:** The paper will acknowledge the psychological risk (hence the content note) but will treat the metaphysical risk as the variable to be tested.

  By maintaining these distinctions, the paper avoids the trap of "cultish" thinking while still engaging deeply with the logic of the subculture that produced the thought experiment.

