prompt: |-
  I'm doing a PhD in history and I also work part time on a digital humanities project where we take published monographs and tag every single sentence. Each sentence gets one of three labels: 'sourced' (there's a document underneath it), 'inferred' (no document actually says it, the author got there by reasoning, generalization, or common sense), and 'framed' (it's the author's interpretive choice — what to call the thing, who counts as an actor, where the story starts and ends, what kind of story it is). We also spot check footnotes and tag whether the cited source really supports the sentence it's attached to. The people on the project keep fighting about whether this is neutral metadata or whether it already commits us to a position about whether there is a fact of the matter about the past. I think it does commit us, but I can't say exactly where.

  It's made me look differently at what ordinary academic history already presupposes. On the one hand the whole apparatus behaves as if there's a real past we're converging on: you go to the archive, you cite primary sources rather than secondary ones, reviewers spot check your footnotes, journals print corrections and sometimes retract when someone finds you got a date or a quotation wrong, and fabricating a source will end your career. On the other hand nobody in my department believes the Rankean slogan about showing the past as it actually was, everyone's read Carr on the facts of history always reaching us already selected by somebody, and since Hayden White people will happily say in a seminar that the narrative shape — tragedy, comedy, romance, satire — is something the historian puts onto the material rather than finds in it. And the discipline is wildly more relaxed about the second kind of thing: almost nobody is ever made to retract an interpretation, only a fact, and there's a strong norm that saying "that's my reading" settles the matter.

  So: what does that bundle of practices actually presuppose about historical knowledge? Reconstruct the implicit theory, and separate what the practice strictly presupposes from what it merely fits comfortably with — I suspect footnote discipline and the punishment of fabrication commit you to less than people think, while the refusal to ever correct an interpretation commits you to more. Tell me whether the parts are consistent with each other. Two things puzzle me especially: we punish fabrication savagely and correct wrong dates, but a source that's been badly read is barely a problem and an interpretation is never withdrawn, which feels like it presupposes that the chain of attribution matters more than the truth of what's said; and we let a sentence resting on a self-interested document count as 'sourced' on exactly the same footing as one resting on a document nobody had a stake in. Then bring it back to my tagging scheme: which kinds of sentence should break a three-way split like ours — causal claims, claims about what someone believed, claims from silence or from absence in the archive, claims about what was typical, counterfactuals — and what would have to change in the practice of history if we took the Whitean view seriously enough to build it into the way we write, review, and correct books?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** PhD historian + Digital Humanities (DH) project tagging sentences in monographs ('sourced', 'inferred', 'framed').
      *   **Conflict:** Project team argues over whether this tagging is neutral metadata or commits to an ontological/epistemological position (realism vs. constructivism).
      *   **User's Observation:** Academic history practices seem contradictory.
          *   *Realist signals:* Archive work, primary > secondary, footnote spot-checks, corrections/retractions for factual errors (dates, quotes), career-ending fabrication.
          *   *Constructivist signals:* Rejection of Ranke (*wie es eigentlich gewesen*), acceptance of Carr (facts are selected), acceptance of White (narrative emplotment is imposed), "that's my reading" shields interpretations from retraction.
      *   **Core Task:** Reconstruct the *implicit theory* of historical knowledge presupposed by these practices. Distinguish between what is *strictly presupposed* vs. what merely *fits comfortably*. Assess consistency.
      *   **Specific Puzzles:**
          1.  Punishment of fabrication/errors vs. immunity of interpretation/bad reading (attribution > truth?).
          2.  'Sourced' status applied equally to self-interested and neutral documents.
      *   **DH Tagging Application:** Which sentence types break the three-way split (causal, belief, silence/absence, typicality, counterfactuals)?
      *   **Radical Question:** What would change if we took Hayden White seriously enough to build it into writing/review/correction practices?

  2.  **Analyze the Implicit Theory of Historical Knowledge:**

      *   *The "Craft" Consensus:* Historians operate on a pragmatic realism. They don't need metaphysical realism (access to the past *as it was*), but they need *methodological* realism (the past leaves traces that constrain us).
      *   *Strict Presuppositions:*
          1.  **Trace Existence:** Something happened that left traces (documents, artifacts).
          2.  **Trace Accessibility:** We can access these traces.
          3.  **Trace Constraint:** Traces constrain valid assertions. You can't say X happened if all traces say Y (unless you explain the discrepancy).
          4.  **Community Verification:** Other historians can check the traces against the assertions.
      *   *Comfortable Fits (not strictly required):*
          1.  **Correspondence Truth:** That the assertion *matches* the past event (vs. just matching the trace).
          2.  **Objective Neutrality:** That the historian is a blank slate.
          3.  **Single Narrative:** That there is one "true" story.
      *   *Consistency Check:* The practices are consistent *pragmatically* but inconsistent *philosophically* if pushed to extremes. They rely on a "division of labor" between fact (constrained by traces) and interpretation (constrained by coherence/persuasion).

  3.  **Address the Specific Puzzles:**

      *   *Puzzle 1: Fabrication/Dates vs. Interpretation/Bad Reading.*
          *   *Why?* Fabrication breaks the "Trace Constraint." It severs the link to the archive. Wrong dates are verifiable against the trace.
          *   *Interpretation/Bad Reading:* These operate in the "Inferred/Framed" zone. A "bad reading" is often recast as a "different emphasis."
          *   *Presupposition:* It's not that attribution matters *more* than truth, but that *procedural integrity* (did you check the trace?) is the only thing the community can police collectively. Truth of interpretation is subjective/intersubjective; truth of citation is objective (within the system).
          *   *Refinement:* It presupposes a **norm of accountability to traces**, not necessarily accountability to *the past* directly.
      *   *Puzzle 2: Self-Interested vs. Neutral Documents.*
          *   *Why?* Both are *traces*. A lie told in 1800 is a fact about 1800 (someone lied).
          *   *Presupposition:* The document is evidence of *discourse/action*, not necessarily a transparent window to *event*. The tagging scheme ('sourced') conflates "there is a document" with "the document proves the claim." This is a category error in the DH project.

  4.  **Evaluate the DH Tagging Scheme ('Sourced', 'Inferred', 'Framed'):**

      *   *The Problem:* The categories overlap and rely on a naive view of "sourced."
      *   *Breaking Points:*
          *   **Causal Claims:** Almost always 'Inferred'. Documents rarely say "X caused Y." Historians infer causality.
          *   **Belief:** 'Sourced' if they wrote it, 'Inferred' if deduced from action.
          *   **Silence/Absence:** 'Inferred' (argument from silence is risky).
          *   **Typicality:** 'Inferred' (generalization from specific traces).
          *   **Counterfactuals:** 'Inferred' (purely reasoning).
      *   *The "Sourced" Trap:* A sentence like "The King was angry" sourced to a letter saying "I am angry" is 'sourced'. But "The King was angry" sourced to a shattered vase is 'inferred'. The current scheme likely tags both as 'sourced' if a footnote exists. This hides the epistemic work.

  5.  **The Hayden White Radical Scenario:**

      *   *If we took White seriously:* Narrative emplotment is fiction-making.
      *   *Changes:*
          *   **Writing:** Explicitly state the emplotment (e.g., "I am telling this as a tragedy").
          *   **Review:** Judge on aesthetic/coherence grounds, not just "accuracy."
          *   **Correction:** Retractions for *mis-emplotment* (e.g., "This wasn't a tragedy, it was a farce"), not just factual errors.
          *   **Consequence:** History becomes closer to literary criticism or philosophy. The claim to "truth" shifts from correspondence to coherence/utility.
      *   *Why don't we do this?* Because history claims political/moral authority based on "what happened." Admitting the narrative is imposed weakens the authority to judge past actors.

  6.  **Synthesize and Structure the Response:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the tension (Pragmatic Realism).
      *   **Part 1: The Implicit Theory (The "Craft Realism" Model).** Define the core presuppositions vs. the comfortable baggage.
      *   **Part 2: The Consistency Check.** Address the puzzles (Fabrication vs. Interpretation; Biased Sources). Explain the "Accountability to Traces" vs. "Truth of Past" distinction.
      *   **Part 3: The Tagging Scheme Critique.** Analyze where 'sourced', 'inferred', 'framed' break down (Causality, Silence, Typicality). Point out the "Footnote Fallacy" (footnote exists = sourced).
      *   **Part 4: The Whitean Radicalization.** What if we leaned in? Changes to writing, review, and the stakes of the discipline.
      *   **Conclusion:** Summarize the ontological commitment. It's not about the Past, it's about the *Archive*.

  7.  **Refine the Tone:**
      *   Academic but accessible.
      *   Respectful of the DH work but critical of its epistemological assumptions.
      *   Philosophical precision (distinguish ontology, epistemology, methodology).

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Initial thought:* Maybe say historians are hypocrites.
      *   *Correction:* No, they are pragmatists. The system works *because* it ignores the hard哲学 questions. Call it "Methodological Realism."
      *   *On the DH tags:* Make sure to highlight that 'Sourced' is the most dangerous category. It implies a direct link that rarely exists.
      *   *On White:* Don't caricature White. He didn't say "anything goes," he said "narrative is literary." The implication is about *criteria of judgment*.

  9.  **Final Polish:** Check against all parts of the prompt.
      *   Reconstruct implicit theory? Yes.
      *   Separate strict presupposition vs. comfortable fit? Yes.
      *   Consistency check? Yes.
      *   Address puzzles (fabrication vs. interpretation; biased sources)? Yes.
      *   Tagging scheme breakdown (causal, belief, silence, etc.)? Yes.
      *   Whitean practice changes? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a profound methodological and ontological puzzle. You have identified the central tension in modern historiography: the gap between the *ethos* of the discipline (which leans heavily on constructivist theory) and the *practice* of the discipline (which operates on a sturdy, unacknowledged realism).

  Here is a reconstruction of the implicit theory your department and the wider profession actually use, an analysis of where the consistency holds or breaks, and a critique of how your tagging scheme interacts with that theory.

  ### 1. The Implicit Theory: "Methodological Realism"

  The bundle of practices you describe presupposes a theory I would call **Methodological Realism**. It is distinct from Ontological Realism (the past exists independently of us) and Epistemological Realism (we can know the past as it was).

  **What the practice *strictly* presupposes:**
  1.  **The Existence of Traces:** Something occurred in time that left material or textual residues (archives).
  2.  **The Constraint of Traces:** These residues constrain valid assertions. You cannot assert $X$ if the available traces uniformly assert $Y$, unless you provide a meta-argument about why the traces are misleading.
  3.  **The Publicity of Traces:** Traces are accessible (in principle) to other members of the community.
  4.  **The Norm of Attribution:** Assertions must be linked to specific traces via a standardized mechanism (footnotes).

  **What merely *fits comfortably* (but is not required):**
  1.  **Correspondence Truth:** That the assertion matches the *event*, rather than just matching the *trace*. (The system works even if the trace is a lie, provided the historian treats it as a trace of the lie).
  2.  **Convergence:** That different historians will eventually agree on the story. (The system allows for permanent disagreement on interpretation).
  3.  **Neutrality:** That the historian is not an agent in the production of the knowledge.

  **The Consistency Check:**
  The practices are **pragmatically consistent** but **philosophically unstable**.
  They are consistent because they divide labor between **Verification** (checking the link between assertion and trace) and **Validation** (checking the coherence of the argument).
  *   **Fabrication/Dates:** These are Verification failures. They break the link to the trace. The community can police this objectively because the trace is public.
  *   **Interpretation:** This is a Validation issue. Since the trace does not dictate the narrative shape (White's point), there is no objective way to police it. "That's my reading" is a shield because the discipline has no mechanism to validate one emplotment over another.

  **Addressing Your Puzzles:**

  *   **Puzzle 1: Why punish fabrication but not bad interpretation?**
      This presupposes that **procedural integrity matters more than ontological truth.** The discipline is a guild protecting its means of production (the archive). If you fabricate, you bypass the guild's labor process. If you interpret badly, you are still doing the labor. The system presupposes that *access to the trace* is the only thing we can collectively guarantee; *truth about the past* is a byproduct we hope for but cannot police. It is not that attribution matters more than truth; it is that attribution is the only proxy for truth we have agreed to recognize.
  *   **Puzzle 2: Why do self-interested and neutral documents count equally as 'sourced'?**
      This reveals a category error in the standard practice. A self-interested document is a trace of *intent*, not necessarily a trace of *event*. However, the practice treats all documents as **evidence of discourse**. If a lobbyist writes "The factory is safe," and the historian writes "The lobbyist claimed the factory was safe," that is 'sourced'. If the historian writes "The factory was safe" based on that document, that is 'inferred' (and badly so). The current practice conflates *sourcing a claim* with *sourcing a fact*. It presupposes that the archive is a repository of facts, rather than a repository of statements.

  ### 2. Critique of the Tagging Scheme

  Your three-way split ('sourced', 'inferred', 'framed') is an attempt to make the implicit theory explicit. However, it will break down on specific sentence types because the current definition of 'sourced' is too broad.

  Here is how specific claims should be handled if the tags are to reflect epistemic weight rather than just footnote presence:

  *   **Causal Claims ("X caused Y"):**
      *   *Current Practice:* Often tagged 'sourced' if a document discusses the cause, or 'inferred' if the historian deduces it.
      *   *Reality:* Almost always **Inferred**. Documents rarely contain objective causality; they contain *attributions* of causality. If a general says "We lost because of rain," and the historian writes "The army lost because of rain," that is an **Inferred** sentence (the historian has adopted the general's reasoning as fact). To tag it 'sourced' is to hide the interpretive work.
  *   **Claims about Belief ("He believed X"):**
      *   *If sourced to a diary:* **Sourced**.
      *   *If sourced to action:* **Inferred**. (Inferring belief from action is a theory of mind, not a trace).
  *   **Claims from Silence/Absence ("There is no evidence of X"):**
      *   *Tag:* **Inferred**. This is a high-risk inference. The archive is not the past. Tagging this as 'sourced' (because the archive *is* the source of the silence) validates the argument from silence too easily.
  *   **Claims about Typicality ("Most peasants felt X"):**
      *   *Tag:* **Inferred**. This is a generalization from a sample. Unless you have a survey (rare in history), this is reasoning from the particular to the universal.
  *   **Counterfactuals ("Had X not happened, Y would have..."):**
      *   *Tag:* **Inferred**. (Sometimes these are 'framed' if they set up the stakes of the narrative).
  *   **The "Footnote Fallacy":**
      *   Your project spots check footnotes to see if they support the sentence. You will find that a footnote often supports the *existence of the claim*, not the *truth of the claim*.
      *   *Correction:* You need a fourth tag or a modifier: **'Sourced (Testimonial)'** vs **'Sourced (Fact)'**. Currently, your scheme likely tags "The King was tyrannical" (footnote: a pamphlet calling him a tyrant) as 'sourced'. It should be 'inferred' (the historian infers tyranny from the pamphlet) or 'sourced' only if the sentence is "Contemporaries called the King tyrannical."

  **Where the scheme commits you:**
  By tagging a sentence 'sourced', you are committing to the proposition that **the trace warrants the assertion.** If you tag "The mob was angry" as 'sourced' based on a police report saying "The mob was angry," you are endorsing the police report's phenomenology. If you tag it 'inferred', you acknowledge the historian has interpreted the report. Your scheme forces a decision on the *epistemic gap* between document and text. That is why your team is fighting: the 'sourced' tag is not neutral; it is a warrant of truth.

  ### 3. The Whitean Radicalization: What if we took it seriously?

  Hayden White argued that narrative structures (tragedy, comedy, etc.) are imposed on the past, not found in it. Currently, historians treat this as a seminar-room concession but ignore it in practice. If you built the Whitean view into the infrastructure of writing, review, and correction, the discipline would change fundamentally.

  **1. Writing: Explicit Emplotment**
  *   *Current:* Historians hide their emplotment. A book about the French Revolution presents itself as "The French Revolution," not "The French Revolution as Tragedy."
  *   *Whitean Practice:* Monographs would declare their narrative mode in the introduction. "This study emplots the Industrial Revolution as a Romance of technological liberation."
  *   *Effect:* Readers could evaluate whether the evidence supports *that specific story shape*, rather than arguing over "what happened."

  **2. Reviewing: Aesthetic and Ethical Criteria**
  *   *Current:* Reviewers ask "Is this accurate?" and "Are the footnotes right?"
  *   *Whitean Practice:* Reviewers would ask "Is this emplotment ethical?" and "Is this narrative coherent?"
  *   *Effect:* A history could be "factually correct" but "narratively irresponsible" (e.g., emplotting a genocide as a comedy of errors). Retractions could occur for *mis-emplotment*. If you frame a political defeat as a tragedy, but new evidence shows the actors viewed it as a farce, you might have to issue a correction not of fact, but of *tone and structure*.

  **3. Correction: The Retraction of Interpretation**
  *   *Current:* Interpretations are immune. "That's my reading."
  *   *Whitean Practice:* Interpretations are liable. If the narrative structure is shown to distort the agency of the actors (e.g., forcing them into a "hero" role they rejected), the argument is falsified.
  *   *Effect:* This would make history more like literary criticism or philosophy. It would lose its claim to "scientific" accumulation of knowledge. You wouldn't converge on *the* story of the Civil War; you would accumulate *competing valid stories*.

  **4. The Tagging Scheme in a Whitean World**
  *   In a Whitean system, the **'Framed'** category becomes the most important.
  *   Currently, 'Framed' is treated as the "soft" stuff (interpretive choice).
  *   In a Whitean system, 'Framed' sentences are the **thesis**. The 'Sourced' sentences are merely the raw material used to build the frame.
  *   *Change:* You would tag sentences not by their relation to the archive, but by their relation to the *plot*.
      *   **Plot-Advancing:** (Moves the narrative arc).
      *   **Evidence-Providing:** (Supplies the trace).
      *   **Theory-Loading:** (Imposes the conceptual framework).

  ### 4. Conclusion: The Ontological Commitment

  To answer your core question: **Yes, your tagging scheme commits you.**

  It commits you to the proposition that **there is a distinguishable difference between a trace and an inference.**
  *   If you tag 'sourced', you assert that the archive speaks.
  *   If you tag 'inferred', you assert that the historian speaks.

  The fight in your project is because this distinction is porous. As you noted, a "badly read source" is barely punished. This suggests the discipline actually presupposes that **the Archive is a social construct maintained by the Guild.**

  If you want to be consistent with the actual practice of history (Methodological Realism), your tagging scheme needs to recognize that 'Sourced' does not mean "True." It means "Accountable."
  *   **Sourced:** "I can point to the trace that holds me accountable for this claim."
  *   **Inferred:** "I am reasoning beyond the trace; hold me accountable for my logic."
  *   **Framed:** "I am choosing the story; hold me accountable for my ethics/aesthetics."

  The inconsistency in the discipline is that it punishes failures of Accountability (fabrication) as if they were failures of Truth, while treating failures of Logic/ Ethics (bad interpretation) as matters of Taste. Your project has the potential to expose this by forcing a tag on every sentence. If you find that 60% of a "factual" monograph is tagged 'Inferred' or 'Framed', you will have quantified the Whitean insight. That is likely why people are uncomfortable. They suspect the metadata will reveal that the "facts" are mostly "inferences."
