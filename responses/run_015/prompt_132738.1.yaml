      *   **Ontology:** Institutions are emergent properties of embodied practice traces, *not* executed ideology.
      *   **Examples:** Neolithic storage systems (scaling with group size), Bronze Age mortuary regimes (geometric structure).
      *   **User's Stance:** Inclined toward minimal mental-state attribution (anti-cognitivist materialism).
      *   **Request:**
          1.  Ranked defeaters (findings, arguments, analogies).
          2.  Material evidence showing spatial regularities mislead without belief recovery.
          3.  Predictions regarding anomalous/singular deposits (strength vs. vulnerability).
          4.  Assessment of unfalsifiability/insulation (virtue vs. defect).
          5.  Concessions a structural-indexationist must make (fatal vs. awkward).
          6.  Final honest assessment: Robustness vs. conceptual emptiness.

  2.  **Analyze the Philosophical/Archaeological Context:**
      *   This position aligns with *Post-Processual* critiques of *Processual* archaeology but pushes further into *Materiality* and *Practice Theory* (Bourdieu, Giddens, Latour, Knappett, Malafouris).
      *   It resonates with *Material Engagement Theory* (MET) and *Distributed Cognition*, but the user explicitly wants to exclude "explicit beliefs."
      *   It opposes *Cognitive Archaeology* (Renfrew, Mithen) which seeks to reconstruct mind/symbolism from artifacts.
      *   Key tension: Structure/Agency, Material/Ideal, Emergence/Intentionality.

  3.  **Brainstorming Defeaters (Ranked by Decisiveness):**
      *   *High Decisiveness:* Evidence where identical material forms serve radically different institutional logics based *only* on belief/context (e.g., same pot used for grain vs. ancestors). If material form is constant but function/meaning changes purely via belief, structural indexation fails.
      *   *Medium Decisiveness:* Anomalies that require intentional explanation (e.g., hoards, votive deposits that break economic logic).
      *   *Low Decisiveness:* Theoretical arguments about the necessity of meaning (easy to dismiss as "idealist").
      *   *Neuroscience/Ethnography:* Evidence that planning *precedes* materialization in complex tasks.

  4.  **Addressing Specific Questions:**

      *   **Material Evidence Misleading Spatial Regularities:** Need cases where layout looks functional/communal but was actually exclusive/ritual, or vice versa. Example: "Ritual" spaces that look like domestic spaces but were restricted. If the *access* is defined by belief (taboo) not walls, spatial analysis misses the institution.
      *   **Anomalous/Singular Deposits:** Structural indexation treats these as noise or system fluctuations. Belief-based views treat them as pivotal (foundational events, miracles, transgressions). If anomalies drive institutional change, ignoring them is a vulnerability.
      *   **Unfalsifiability:** If every counter-example is absorbed as "tacit practice" or "distributed cognition," the theory becomes tautological ("It's in the material because the material is the institution"). This is a defect.
      *   **Concessions:** Where *must* they admit belief? Language, iconography, rapid change without environmental pressure. Are these fatal? Maybe not fatal, but limit the scope.
      *   **Robustness vs. Emptiness:** If insulated from all counterevidence, it's likely empty. A theory that explains everything explains nothing.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Rigorous, philosophical, archaeologically grounded, critical but fair.
      *   *Structure:* Follow the user's prompt order.
      *   *Key Concept:* "Explanatorily Inert." This is the weak point. If beliefs cause material changes, they aren't inert.

      *   *Defeater 1 (The Decisive One):* **Semantic Drift without Material Change.** If the *same* spatial arrangement persists while the *institution* completely changes (due to belief shift), structural indexation cannot distinguish them. Example: A temple becomes a church becomes a mosque. The layout might stay similar, but the institutional logic (the "what it is") is defined by the belief.
      *   *Defeater 2 (Cognitive/Neuro):* **Planning Depth.** Complex construction requires mental templates. If the template exists *before* the material trace, the material is an effect, not the cause/logic.
      *   *Defeater 3 (Ethnographic):* **Taboo/Invisible Boundaries.** Institutions often rely on invisible lines (sacred/profane) that leave *no* spatial trace until violated. Structural indexation misses the rule until it's broken.

      *   *Anomalies:* Structural indexation predicts anomalies are statistical outliers. Belief-based predicts they might be *generative* (e.g., a singular sacrificial event founding a tradition). If history is driven by singular events, structuralism fails.

      *   *Insulation:* The retreat to "tacit knowledge" is a classic move (Bourdieu's *habitus*). It risks unfalsifiability. If "structure" includes "mental structures embodied in practice," the distinction collapses.

      *   *Concessions:* They must concede on *iconography* and *text*. Once symbols appear, material form is subservient to semantic content.

      *   *Final Assessment:* It's likely conceptual emptiness if pushed too far. It's a methodological heuristic, not an ontology.

