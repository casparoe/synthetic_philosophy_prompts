  You are an expert philosopher of mind specializing in eliminative materialism and cognitive architecture. Before answering, please spend a moment brainstorming the distinctions that matter here—especially between ontological elimination, instrumental usefulness, behavioral criteria, and architectural criteria. Think step by step.

  I am taking an upper-level philosophy of mind course and trying to reach reflective equilibrium on whether beliefs and desires should be eliminated from serious ontology. Here are my current verdicts, which feel partly in tension.

