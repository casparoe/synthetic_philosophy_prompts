  4. I find eliminativism more plausible for beliefs than for desires—perhaps because desire seems closer to reward-function descriptions—but I lack a clear rationale.
  5. I accept the Churchlands' historical analogy: mental categories that fail to map onto neural reality should go the way of phlogiston. Still, I think a category that explains behavior across radically different architectures gains a kind of functional reality that survives the absence of a localized substrate.

  What coherent principle—if any—reconciles these judgments? Does it turn on a distinction between scientific ontology and practical attribution, or between human and artificial architectures? Please state the principle precisely, apply it to each case above, predict its verdict for a case I have not considered (a navigating animal with complex behavior but no evidence of decoupled representations), and honestly identify which of my five verdicts must be abandoned if the principle is to remain simple and non-ad hoc.
