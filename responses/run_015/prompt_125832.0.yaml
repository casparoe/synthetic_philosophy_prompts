          *   *Premise:* Two rational agents, common priors, common knowledge of each other's beliefs.
          *   *Conclusion:* They cannot agree to disagree.
          *   *Caveats:* This theorem relies on *very* strict assumptions. "Common priors" is the big one. Do they actually share the same prior probability distribution over the state of the world? "Common knowledge" is another. Do they *really* know that the other knows what they know?
          *   *Reality Check:* In the real world, people rarely have common priors. They have different models, different weights on evidence, and different interpretations of what constitutes "signal" vs. "noise."

      *   **The Reference Class Forecasting (Dan) vs. Inside View (User):**
          *   Dan is using the *Outside View* (base rates, case studies).
