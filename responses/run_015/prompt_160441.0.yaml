answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Metaphysics of Persistence (Endurantism vs. Perdurantism)
  **Date:** October 24, 2023
  **Signatories:** The Endurantist Working Group (EWG) & The Perdurantist Working Group (PWG)
  **Status:** Draft for Public Circulation

  ### 1. Agreed Preliminaries: The Phenomenon and the Constraints

  We, the undersigned, acknowledge that after forty years of debate, certain foundational elements must be settled before substantive disagreement can be productive. We sign below to indicate that these claims do not beg the question against either position.

  1.  **The Explanandum:** We agree on the data to be explained. Ordinary middle-sized objects (watches, persons, cats) appear to exist at multiple times and undergo qualitative change (e.g., a watch is wound at $t_1$ and unwound at $t_2$). Any viable theory must account for the numerical identity of the object across these times without contradicting the Law of Non-Contradiction.
  2.  **The Nature of the Dispute:** We agree this is an abductive dispute (Inference to the Best Explanation), not a deductive one. Neither side claims the opponent's view is logically incoherent *per se*; rather, we claim the opponent's view incurs higher theoretical costs (ontological, ideological, or intuitive).
  3.  **Temporary Intrinsics:** We agree that the "Argument from Temporary Intrinsics" (Lewis, 1986) establishes a dilemma: either objects have properties relative to times (Endurantism) or objects have parts that bear properties simpliciter (Perdurantism). We disagree on which horn is sharper.
  4.  **The Argument from Coincidence:** We agree that cases of apparent coincidence (e.g., a statue and the clay constituting it) pressure the view that identity is strict and necessary. We disagree on whether this pressure is best relieved by temporal parts or by constitutive relations.
  5.  **Relativity Theory:** We agree that Special Relativity (SR) constrains metaphysical models of time. We disagree on whether SR *entails* a four-dimensional ontology or merely restricts how a three-dimensional ontology must be formulated (e.g., by requiring a relativized "wholly present" relation).
  6.  **Career Continuity:** We agree that a "career through time" involves a causal connection between earlier and later states. We disagree on whether that causal connection constitutes *identity* (Endurantism) or *genidentity/counterpart relations* between distinct entities (Perdurantism).

  ***

  ### 2. Matrix of Disagreement: Precise Formulations

  To prevent caricature, we have separated the Perdurantist position into its two dominant variants: **Worm Theory** (the persisting object is the aggregate of temporal parts) and **Stage Theory** (the persisting object is an instantaneous stage; persistence talk is talk of counterparts).

  | Issue | Endurantist Formulation (3D) | Perdurantist Formulation: Worm Theory (4D-W) | Perdurantist Formulation: Stage Theory (4D-S) |
  | :--- | :--- | :--- | :--- |
  | **Ontological Category** | Objects are **substances** that are numerically identical at every moment of their existence. They are not extended in time; they are *in* time. | Objects are **spacetime worms**. They are extended in time analogously to how they are extended in space. The whole object is not present at any single instant. | Objects are **instantaneous stages**. What we call a "person" or "watch" is a momentary slice. Persistence is a relation between distinct stages, not identity of one thing. |
  | **Parthood** | Parthood is a **two-place relation** ($x$ is part of $y$). Objects have no temporal parts. | Parthood is a **three-place relation** ($x$ is part of $y$ at $t$). Objects *do* have temporal parts. | Parthood is a **two-place relation**, but only stages have parts. "Temporal part" talk is shorthand for spatial parts of a stage. |
  | **Property Instantiation** | Objects instantiate properties **at times**. ($O$ is bent at $t_1$). The object bears the property, time indexes the bearing. | Objects instantiate properties **simpliciter** via their parts. ($O$'s $t_1$-part is bent). The whole worm does not change; its parts differ. | Stages instantiate properties **simpliciter**. ($S_1$ is bent). $S_2$ is straight. They are distinct objects. |
  | **Identity Over Time** | **Strict Identity.** $O$ at $t_1$ is numerically identical to $O$ at $t_2$. | **Identity is Atemporal.** $O$ is the whole worm. $O$-at-$t_1$ is a part of $O$, not identical to $O$. | **No Identity Over Time.** $S_1$ is not identical to $S_2$. They are related by a counterpart relation (causal/qualitative continuity). |

  ***

  ### 3. The Cruxes: Predictions and Tests

  We have identified four specific pressure points where the disagreement is most acute. For each, we state the specific question, the evidence both sides accept as relevant, and our divergent predictions.

  #### Crux A: Dependency on the Metaphysics of Time
  **Question:** Is the persistence dispute merely a downstream consequence of the A-Theory (Presentism/Growing Block) vs. B-Theory (Eternalism) debate?
  **Accepted Evidence:** Logical coherence of Endurantist Eternalism (e.g., "Spacetime Substantivalism" where the object is a worldline but wholly present at each point on it) vs. Perdurantist Presentism (rare but logically possible).
  *   **Endurantist Prediction:** The disputes are separable. One can be an Eternalist and an Endurantist. If we prove Eternalism true, Endurantism survives by relativizing instantiation. The persistence dispute is about *mereology*, not *time*.
  *   **Perdurantist Prediction:** The disputes are tightly coupled. Endurantism gains its intuitive traction from Presentism (the idea that only the "now" exists). If Eternalism is true, the "wholly present" intuition loses its grip, making Perdurantism the natural ontological fit for a block universe.
  *   **Collaborative Note:** We agree that if Endurantist Eternalism is coherent, the link is not logical, but we disagree on whether it is *natural*.

  #### Crux B: The Status of "Wholly Present"
  **Question:** Is the claim "Object $O$ is wholly present at $t$" a substantive metaphysical claim, or merely a refusal to adopt temporal-part vocabulary?
  **Accepted Evidence:** Analysis of the instantiation relation. Does "$O$ is $F$ at $t$" imply $O$ has a part at $t$?
  *   **Endurantist Prediction:** It is substantive. It asserts that the *entirety* of $O$'s being enters into relations at $t$. It denies that $O$'s being is distributed across time like a loaf of bread. It requires a primitive "having" relation.
  *   **Perdurantist Prediction:** It is largely verbal/ideological. It is a refusal to analyze "having" in terms of parthood. We predict that once the Endurantist formalizes "having at $t$," it will functionally mimic the temporal-part relation without the ontological honesty of admitting parts.
  *   **Collaborative Note:** We agree this is the hardest point to adjudicate. It hinges on whether "parthood" is a fundamental concept or a derived one.

  #### Crux C: Discontinuous Careers (The Vaporized Watch & The Suspended Person)
  **Question:** Consider a watch vaporized at $t_1$ and perfectly reassembled from the same atoms at $t_2$. Consider a person frozen in suspended animation for 50 years with no causal processes occurring internally. Do these careers have gaps?
  **Accepted Evidence:** Intuitions regarding numerical identity vs. qualitative/causal continuity.
  *   **Endurantist Prediction:**
      *   *Watch:* Identity holds. The *substance* persists even if its material realization is interrupted.
      *   *Person:* Identity holds. The person is the same entity; time passed, but they did not change.
      *   *Implication:* Persistence does not require spatiotemporal continuity, only numerical identity of the substance.
  *   **Perdurantist (Worm) Prediction:**
      *   *Watch:* The worm is discontinuous. It is a scattered object composed of two distinct spacetime regions. Identity holds only if we accept scattered objects.
      *   *Person:* The worm has a gap. If no causal processes connect the stages, they may not even be parts of the same worm.
  *   **Perdurantist (Stage) Prediction:**
      *   *Watch/Person:* The later stage is a *counterpart* of the earlier stage. There is no strict identity across the gap. Whether we call it the "same person" is a pragmatic decision about counterpart relations, not a metaphysical fact.
  *   **Collaborative Note:** This highlights the Endurantist reliance on "substance" vs. the Perdurantist reliance on "continuity."

  #### Crux D: Preferred Foliation and Relativity
  **Question:** Suppose we discover a physically preferred slicing of spacetime (e.g., evidence for Lorentzian Ether Theory or a privileged cosmic time) that is observationally equivalent to standard SR but ontologically distinct. Does the Relativity Argument for Perdurantism evaporate?
  **Accepted Evidence:** The logical link between Simultaneity and "Wholly Present."
  *   **Endurantist Prediction:** Yes, it evaporates. The main argument against Endurantism is that SR forbids a unique "now" for an object to be wholly present in. If a privileged foliation exists, the physical barrier to 3Dism is removed. The debate returns purely to Temporary Intrinsics.
  *   **Perdurantist Prediction:** No, it does not evaporate. Even with a preferred foliation, the B-Theory (Eternalism) may still be true. If all times are equally real, the "wholly present" intuition remains metaphysically suspect regardless of foliation. Furthermore, the Temporary Intrinsics argument remains independent of SR.
  *   **Collaborative Note:** We agree that the SR argument is often overstated. It rules out *Presentist* Endurantism easily, but *Eternalist* Endurantism survives SR (by relativizing existence). A preferred foliation helps the Presentist, not necessarily the Endurantist *simpliciter*.

  ***

  ### 4. Diagnosis: Where is the Dispute Merely Verbal?

  We acknowledge that a portion of the friction is verbal, but we reject the claim that *all* of it is. We pinpoint the verbal dispute as follows:

  **The Verbal Knot:** The definition of the word "Object" (or "Persist").
  *   **Perdurantist Usage:** "Object" refers to the maximal sum of temporal parts (Worm) or the instantaneous stage (Stage). To ask if the object persists is to ask if the worm extends or if stages are counterparts.
  *   **Endurantist Usage:** "Object" refers to the substance that bears properties. To ask if the object persists is to ask if the *same* substance exists at multiple times.

  **Why it is not *only* verbal:**
  Once we fix the terminology, a substantive disagreement remains regarding **Mereology**.
  *   If the Endurantist says "Objects have no temporal parts," and the Perdurantist says "Objects do have temporal parts," this is not a definition dispute. It is a disagreement about the fundamental structure of reality.
  *   **Test:** If we point to a region of spacetime shaped like a person-worm and ask "Is there an object here?", the Perdurantist says "Yes, that is the object." The Endurantist says "No, that is a history of an object. The object is located at each slice."
  *   **Conclusion:** The verbal dispute concerns the label "persist." The substantive dispute concerns **whether parthood is time-relative**. If parthood is time-relative ($x$ is part of $y$ at $t$), Perdurantism wins. If parthood is timelessness ($x$ is part of $y$), Endurantism wins. This is a substantive disagreement about the logic of mereology, not just semantics.

  ***

  **Signed,**
  *The Endurantist Working Group*
  *The Perdurantist Working Group*
