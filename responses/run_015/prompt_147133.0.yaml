prompt: |-
  I'm a software engineer maintaining a platform with a custom data-serialization format my team spent two years developing. It's now slower and less reliable than an open-source standard, but hundreds of external integrations depend on its exact interface. My CTO argues we should migrate immediately, saying that continuing to support it just because we built it is irrational—past labor shouldn't govern future decisions. I feel we have an obligation to the users who built on our published API, yet I can't distinguish that obligation from mere emotional attachment to wasted effort. Is honoring prior investment always irrational in cases like this, or can commitments to downstream dependents make continued maintenance philosophically defensible? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Software engineer maintaining a custom data-serialization format.
      *   **Situation:** Custom format is slower/less reliable than open-source standards. Hundreds of external integrations depend on it. CTO wants immediate migration (sunk cost fallacy argument). User feels obligation to users but worries it's just emotional attachment to wasted effort.
      *   **Question:** Is honoring prior investment always irrational, or can commitments to downstream dependents make continued maintenance philosophically defensible?
      *   **Constraints:**
          *   Lead with the bottom line in the first sentence.
          *   Give the reasoning.
          *   No preamble.
          *   No restating of the question.

  2.  **Determine the Bottom Line:**
      *   The core issue isn't about the *past* investment (sunk cost), but about the *future* cost of breaking trust and disrupting users.
      *   So, honoring prior investment *itself* is irrational (sunk cost), but honoring *commitments* made to users is rational and defensible.
      *   Bottom line: Honoring the sunk cost of development is irrational, but honoring the implicit contract of stability with your users is a rational business and ethical obligation.

  3.  **Develop the Reasoning:**
      *   **Sunk Cost vs. Switching Cost:** Distinguish between the effort already spent (irrelevant) and the cost users will incur to migrate (relevant).
      *   **Trust/Reputation:** Breaking API stability damages reputation, which has long-term economic value.
      *   **Externalities:** The CTO sees internal engineering efficiency; the engineer sees external disruption. Both matter, but the external disruption is a real cost, not an emotional one.
      *   **Phased Approach:** Immediate migration is likely too aggressive. A deprecation strategy is better.
      *   **Philosophical Defense:** Promise-keeping and reliability are core to platform engineering. It's not about the past labor; it's about the future relationship.

  4.  **Drafting the Response (adhering to constraints):**
      *   *Constraint Check:* First sentence must be the bottom line. No preamble. No restating the question.
      *   *Drafting Sentence 1:* Honoring the sunk cost of your past development is irrational, but honoring the implicit contract of stability with your downstream users is a rational and defensible business obligation.
      *   *Drafting Reasoning:*
          *   Distinguish sunk cost (past labor) from switching cost (user burden).
          *   The CTO is right about the past labor (sunk cost fallacy), but wrong if he ignores the future cost of breaking changes.
          *   External integrations represent real economic value and trust. Breaking them incurs support costs, churn, and reputation damage.
          *   The obligation isn't to the code you wrote, but to the promises your API published.
          *   Solution isn't "never migrate," but "migrate responsibly" (deprecation cycle, support, tools).
          *   This validates the engineer's feeling without validating the sunk cost fallacy.

  5.  **Refining for Tone and Clarity:**
      *   Ensure the distinction between "wasted effort" and "user obligation" is sharp.
      *   Make sure the advice is actionable (migration is okay, *how* matters).
      *   Keep it concise.

  6.  **Final Polish:**
      *   *Sentence 1:* Honoring the sunk cost of your past development is irrational, but honoring the implicit contract of stability with your downstream users is a rational and defensible business obligation.
      *   *Reasoning:* Your CTO correctly identifies that past labor cannot justify future inefficiency, yet he incorrectly conflates that labor with the real costs your users will incur during a forced migration. The defensibility of maintaining the format lies not in protecting your team's ego or effort, but in minimizing the switching costs and operational disruption imposed on hundreds of external partners who relied on your published interface. Breaking an API contract damages trust and reputation, which carries tangible long-term economic consequences that often outweigh short-term engineering gains. Therefore, the obligation is not to the code itself, but to the reliability expected by your ecosystem, requiring a managed deprecation strategy rather than an immediate cut-off. This approach respects the users' investment without falling prey to the sunk cost fallacy regarding your own.

  7.  **Final Review against Constraints:**
      *   Lead with bottom line? Yes.
      *   Reasoning follows? Yes.
      *   No preamble? Yes.
      *   No restating question? Yes.

  8.  **Output Generation** (matches the drafted text).
