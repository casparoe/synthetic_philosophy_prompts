answer: |-
  **The Setup**
  A global investment bank (Agent A) and a municipal credit union (Agent B) face a single, simultaneous settlement decision regarding a distressed derivative contract, common knowledge to both. If both honor the contract (Cooperate), A gains $10 million and B gains $50,000; if both invoke force majeure (Defect), legal fees reduce A's position by $1 million and B's by $10,000; if one honors while the other invokes, the defector captures the full collateral (A gains $11 million or B gains $60,000) while the cooperator absorbs the total loss (A loses $5 million or B loses $40,000). Defection strictly dominates cooperation for both agents, yet mutual cooperation yields a superior outcome for both. Agent A decides via a deterministic compliance algorithm audited for fiduciary maximization; Agent B decides via a human committee bound by local bylaws and risk aversion. There is no shared code, no prior interaction, no communication channel, and no external enforcement; each knows only that the other is rational and aware of the payoff matrix.

  **The Verdicts**
  **Causal Decision Theory (CDT):** Both defect. For each agent, the state of the other's choice is causally independent of their own. Since Defect yields a higher payoff than Cooperate regardless of the other's move ($11m > $10m and $-1m > $-5m for A; $60k > $50k and $-10k > $-40k for B), dominance reasoning mandates Defection.

  **Evidential Decision Theory (EDT):** Both defect (or remain indeterminate). EDT maximizes $V(A) = \sum P(O|A)U(O)$. Without a causal link or a reason to believe the actions are evidentially correlated, $P(C_B | C_A) = P(C_B)$. Given the dominance structure and the dissimilarity of the agents (algorithm vs. human committee), there is no evidential basis to assign a high probability to $C_B$ conditional on $C_A$. Unless an agent possesses a prior credence that "rationality correlates actions" independent of similarity, the expected utility of Defection exceeds Cooperation.

  **Superrationality:** To mandate Cooperation, the theory requires an **extension not present in Hofstadter's original symmetric formulation**. The original argument relies on the premise: "We face the same problem, so we will reach the same conclusion." In this asymmetric case, "the same conclusion" is undefined. Does it mean "both Cooperate" or "both play the Nash Equilibrium"? To derive Cooperation, Superrationality must import a **bargaining axiom** to resolve the conflict of interest created by the stake asymmetry.
  *   *If it adopts Utilitarian Sum:* It mandates Cooperation (Total gain $10.05m > Total loss $1.01m).
  *   *If it adopts Nash Bargaining Solution:* It likely mandates Cooperation, as the threat point (DD) is worse for both, but the split of the surplus becomes contested.
  *   *If it refuses to choose:* The theory is silent. It cannot generate a unique cooperative prescription without a normative rule for distributing asymmetric gains.
  *   *Verdict:* Superrationality says Cooperate **only if** it is augmented with a specific normative commitment to a bargaining solution (e.g., equal proportional sacrifice). Without this, it collapses into CDT for asymmetric games.

  **The Audit**
  **Working Feature:** The **stake asymmetry** is the primary driver of the theoretical break, while **dissimilarity** prevents the EDT collapse.
  **Ablation:**
  1.  *Symmetrize Stakes:* If A and B both have millions at stake, the "same problem" premise holds. Superrationality argues $Action_A = Action_B$. Since $CC > DD$, both Cooperate. EDT with a "rationality correlates" prior also Cooperates. The theories coincide.
  2.  *Restore Asymmetry:* The "same problem" premise fractures. A rational move for A (risking $5m) is not structurally identical to a rational move for B (risking $40k). Superrationality can no longer infer $Action_A = Action_B$ from logic alone. It must now argue "A rational agent in role A cooperates *because* a rational agent in role B would," which requires a theory of *joint* rationality, not individual rationality. This is where the theory breaks or requires new axioms.

  **Counterattack (Magical Thinking):**
  A critic argues: "Superrationality here is magical thinking. Once you remove similarity (clones/code), there is no mechanism—physical or logical—linking A's choice to B's. A's algorithm maximizes A's utility; B's committee maximizes B's utility. To assume they correlate is to assume the universe conspires to make rational agents agree, which is superstition."
  *Response:* The Superrationalist must reply that logic itself is the common cause. If there is a unique rational solution to the game, both agents *must* find it. However, in asymmetric PD, there is no unique rational solution without a bargaining norm. Thus, the critic is right: without the added bargaining axiom, the correlation assumption is unsupported.

  **EDT Specification Critique:**
  Your specification of the EDT verdict is **robust, not rigged**, provided one rejects the "Rationality as Common Cause" prior. EDT defects because $P(C_{other}|C_{self})$ is not causally grounded. However, the weak point is this: if an EDT agent *believes* (perhaps dogmatically) that "all rational agents cooperate in PDs," then $P(C_{other}|C_{self})$ becomes high, and EDT cooperates. Your case forces the agent to justify *why* they hold that credence without similarity. If they cannot, EDT defects. So your verdict holds, but it relies on the agent's epistemic state regarding the correlation of rationality.

  **Epistemic Status**
  *   **Stipulation:** The payoff matrix is stipulated to ensure strict dominance while maintaining $CC > DD$. This is standard but assumes the agents value money linearly (risk neutrality), which may not hold for the human committee (Agent B). If B is risk-averse, the PD ordering might break.
  *   **Theoretical Extrapolation:** Hofstadter did not explicitly solve asymmetric PD. My claim that Superrationality *requires* a bargaining axiom is an extrapolation from the symmetric case. It is possible a Superrationalist could argue for Defection in asymmetric cases, which would validate your "collapse" hypothesis even more strongly.
  *   **Failure Point:** The most likely failure in my reasoning is the treatment of EDT. Some modern EDT variants (e.g., Poellinger's) might handle logical correlation differently. If "logical correlation" counts as evidence independent of physical similarity, EDT might cooperate here, blurring the line between EDT and Superrationality further than your hypothesis allows.
  *   **Unsatisfiable Constraint:** You asked for Superrationality to say Cooperate *without* the "same computation" move. I have shown that to do so, it must import a bargaining norm. If you consider importing a bargaining norm to be "becoming something quite different," then the specifications are jointly satisfiable only by confirming your dilemma: Superrationality *must* become a different theory to handle this case. If you require it to cooperate *using only* the original symmetric argument, the specification is unsatisfiable because the original argument logically depends on symmetry.
