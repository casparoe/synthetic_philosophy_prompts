  # Part 1: Instructor's Design Map (Logical Space & Grid)

  **Axis 1: Relation between Experience (E) and Availability (A)**
  1.  **Identity (E = A):** Consciousness is identical to availability.
  2.  **Overflow (E > A):** Experience is richer than what is available for use/report.
  3.  **Underflow (A > E):** Availability exceeds experience (rare/unattractive).
  4.  **Elimination (E is confused):** The notion of "Experience" distinct from function is incoherent.

  **Axis 2: Level of Availability**
  1.  **Personal:** Available for reasoning, voluntary action, and report.
  2.  **Subpersonal:** Available to any consumer system (motor routines, modules).

  **Grid Occupation:**
  *   **Identity + Personal:** *Workspace-Identity* (GWT). **Occupied.**
  *   **Identity + Personal (Meta):** *Higher-Order View* (HOT). **Occupied.** (Distinguished by whether availability is of the state or of a thought about the state).
  *   **Overflow + Personal:** *Phenomenal Overflow*. **Occupied.**
  *   **Identity + Subpersonal:** *First-Order Representationalist* (FOR). **Occupied.**
  *   **Elimination + Any:** *Illusionist/Eliminativist*. **Occupied.**
  *   **Structure > Capacity:** *Integrated Causal Structure* (IIT). **Occupied.** (Cuts across E/A, prioritizes causal topology).
  *   **Underflow + Personal:** *Empty.* (Incoherent: Why have access without experience if experience is the "light" of access?)
  *   **Underflow + Subpersonal:** *Empty.* (Unattractive: Implies zombie systems with full access but no inner life, rarely defended as a positive theory of *consciousness*).
  *   **Overflow + Subpersonal:** *Empty.* (Unworked: If experience exceeds subpersonal access, where is it? Hard to motivate without Personal report).

  ***

  # Part 2: Student Worksheet (The Decision Tree)

  **Instructions:** Answer the following nine questions based on your intuition about the cases described. Follow the arrows to your theoretical position. Do not worry about the names of the theories; focus on the descriptions of the cases.

  **Shared Commitment:** We assume there is a meaningful distinction between a mental state's *being experienced* (what it feels like) and its *being available* (how it can be used by the mind).

  ### Question 1: The Blindsight (Null) Case
  A patient with damage to visual cortex points correctly to a light but insists, "I saw nothing; I was just guessing." Is this report literally true?
  *   **(A) Yes, there is literally no experience there.** → Go to **Leaf 1**.
  *   **(B) No, there is some experience they cannot access.** → Go to **Question 2**.

  ### Question 2: The Infant Case
  Consider a pre-verbal infant. They cannot reason about their vision or report it verbally. Do they have conscious visual experiences?
  *   **(A) No, report/reasoning capacity is required.** → Go to **Question 4** (Personal Level).
  *   **(B) Yes, they can be conscious without report.** → Go to **Question 3** (Subpersonal Level).

  ### Question 3: The Engineered System Case
  Imagine a robot that instantiates the exact bottleneck-and-broadcast architecture of a human brain but is made of silicon server farms. Is it conscious?
  *   **(A) Yes, functional architecture is sufficient.** → Go to **Leaf 2**.
  *   **(B) No, biological causal structure is required.** → Go to **Leaf 3**.

  ### Question 4: The Sperling Case
  In the partial-report task, icons fade before you can name them. You feel you saw all the letters but can only write down a few. Did you *experience* all of them?
  *   **(A) No, you only experienced what you could access.** → Go to **Question 5**.
  *   **(B) Yes, experience exceeds access.** → Go to **Question 6**.

  ### Question 5: The Visual Extinction Case
  A patient denies seeing a stimulus on their left but shows autonomic responses (skin conductance) and guesses above chance. Is this a failure to *see* the stimulus, or a failure to *think about* the fact that they saw it?
  *   **(A) Failure to see (Access failure).** → Go to **Leaf 4**.
  *   **(B) Failure to think about seeing (Meta-cognitive failure).** → Go to **Leaf 5**.

  ### Question 6: The No-Report Paradigm Case
  In a task where no response is demanded, eye movements track a hidden object. If the subject later insists, "I saw it," does that insistence settle the question of whether they were conscious at the time?
  *   **(A) Yes, their insistence proves experience existed.** → Go to **Question 7**.
  *   **(B) No, objective measures override their insistence.** → Go to **Question 9**.

  ### Question 7: The Degraded Array Case
  In change detection where performance exceeds capacity but subjects deny seeing the change, is the unseen content present as a vague "gist" or is it completely absent?
  *   **(A) Present as a degraded gist.** → Go to **Leaf 6**.
  *   **(B) Completely absent/lost.** → Go to **Question 8**.

  ### Question 8: The Vivid Dream Case
  You recall a vivid dream only upon waking. Was the experience conscious *during* the sleep, even though you had no capacity to report it then?
  *   **(A) Yes, it was conscious during sleep.** → Go to **Leaf 6**.
  *   **(B) No, it became conscious only upon waking access.** → Go to **Leaf 7**.

  ### Question 9: The Inattentional Blindness Case
  When you miss the "invisible gorilla" while counting passes, did the gorilla enter your experience but get ignored, or did it never enter experience at all?
  *   **(A) Entered experience but ignored.** → Go to **Leaf 6**.
  *   **(B) Never entered experience.** → Go to **Leaf 7**.

  ***

  ### Theoretical Leaves (Your Position)

  **Leaf 1: Illusionist / Eliminativist View**
  *   **Diagnosis:** You hold that the distinction between "experience" and "access" is confused; if there is no access, there is no experience.
  *   **Least Attractive Commitment:** You must tell subjects who report rich inner lives that they are mistaken about the very existence of those lives.

  **Leaf 2: First-Order Representationalist View**
  *   **Diagnosis:** You hold that consciousness is simply accurate representation of the world, available to subpersonal systems regardless of report.
  *   **Least Attractive Commitment:** You must attribute the same rich conscious life to a functionally isomorphic robot as to a human, regardless of biology.

  **Leaf 3: Integrated Causal Structure View**
  *   **Diagnosis:** You hold that consciousness depends on the intrinsic causal integration of a system, not on its capacity to broadcast information.
  *   **Least Attractive Commitment:** You must accept that a simple photodiode grid with high integration could possess a tiny amount of consciousness.

  **Leaf 4: Global Workspace-Identity View**
  *   **Diagnosis:** You hold that a state is conscious if and only if it is broadcast for personal-level reasoning and report.
  *   **Least Attractive Commitment:** You must deny that you experience the periphery of your vision, treating the feeling of richness as an error.

  **Leaf 5: Higher-Order View**
  *   **Diagnosis:** You hold that a state is conscious only if there is a separate, higher-order thought aware of that state.
  *   **Least Attractive Commitment:** You must accept that you are not conscious when you are "lost in the zone" and not thinking about your own mental states.

  **Leaf 6: Phenomenal Overflow View**
  *   **Diagnosis:** You hold that phenomenal experience is richer than what can be accessed for report or reasoning.
  *   **Least Attractive Commitment:** You must posit the existence of rich experiences that can never be used, verified, or acted upon by the subject.

  **Leaf 7: No-Overflow (Illusion of Richness) View**
  *   **Diagnosis:** You hold that access equals experience, and the feeling of overflow is a post-hoc illusion generated by memory or expectation.
  *   **Least Attractive Commitment:** You must treat your immediate intuition that you see a rich world as a systematic trick played by your brain.

  ***

  ### Instructor's Note on Indistinguishability

  **Flagged Pair:** **Leaf 4 (Workspace-Identity)** and **Leaf 5 (Higher-Order View)**.
  **Reason for Inseparability:** Both views locate consciousness at the Personal Level and deny Overflow. In practice, "broadcast for reasoning" (Workspace) and "available to a higher-order thought" (HOT) often predict identical outcomes in behavioral tasks, as both require a form of meta-cognitive access.
  **Additional Separating Question:** "When you see a red apple, is your consciousness constituted by the *visual representation of the apple* being shared, or by your *thought that you are seeing* the apple?"
  **Reason for Exclusion from Tree:** A student cannot answer this without already understanding the theoretical distinction between a first-order state being accessed and a second-order state being the vehicle of consciousness; it requires prior theoretical literacy rather than case intuition.
