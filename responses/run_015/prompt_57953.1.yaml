answer: |-
  Dear Student,

  It is completely understandable that you feel a tension there, because the move your professor is making is one of the most controversial and debated steps in the entire philosophy of physics. You have correctly identified that there is a gap between the physical observation that moving observers disagree on simultaneity and the metaphysical conclusion that the future already exists. The standard label for the specific argument your professor is using is the Rietdijk-Putnam argument, named after the physicists and philosophers who formalized it in the nineteen sixties. You might also hear your friends mention the Andromeda Paradox, which is a popularized version of the same thought experiment coined by Roger Penrose, where two people walking past each other on Earth disagree on whether an alien fleet has already launched from the Andromeda galaxy. The core of this argument is that if we accept Special Relativity as a true description of the world, and we assume that all observers are equally valid, then there is no unique present moment that slices across the universe. If your present includes an event that is in my future, and we both exist, then that future event must be just as real as your present moment, which leads directly to the view called Eternalism or the Block Universe.

  The reason this feels like a huge leap to you is that it requires mixing physics with metaphysics, specifically by adding a premise about what it means for something to be real. The physics part is just the relativity of simultaneity, which says that different frames of reference carve up spacetime into space and time differently. The metaphysical leap happens when you add the assumption that if an event is real for one observer, it must be real for all observers, regardless of their motion. This is often called the principle of the transitivity of reality. Without that assumption, you could theoretically say that what exists depends on your frame of reference, but most philosophers find that view messy because it makes existence relative in a way that seems to contradict our basic intuition that reality is objective. So when your roommate says the launch must already be real somewhere, they are invoking Eternalism, which treats time as a dimension similar to space where all points exist equally, rather than a flow where only the now exists.

  You also asked how this is separate from the idea that moving clocks tick slower or that time is an illusion, and distinguishing these is crucial for your class. The phenomenon of moving clocks ticking slower is called time dilation, and while it is part of Special Relativity, it is distinct from the relativity of simultaneity. Time dilation compares the duration between two events along different paths, whereas the argument your professor is using compares which events are happening at the same time across distant locations. You can acknowledge time dilation without accepting that the future is fixed, but the relativity of simultaneity is much harder for those who believe only the present exists to explain away. Furthermore, saying time is an illusion is usually a claim about the passage of time or the flow, suggesting that the feeling of time moving is psychological. Eternalism does not necessarily say time is an illusion, but rather that the flow is subjective while the timeline itself is a static four-dimensional block. The Rietdijk-Putnam argument is specifically about the ontology of events, meaning what exists, not just how we perceive the ticking of clocks.

  The edges of this debate are where things get really interesting for a philosophy student, because there are serious counter-arguments that prevent this from being a settled fact. One major edge is the conventionality of simultaneity, associated with the philosopher Hans Reichenbach, who argued that there is no fact of the matter about what counts as simultaneous at a distance because we cannot signal faster than light. If simultaneity is just a human convention rather than a physical reality, then the Rietdijk-Putnam argument loses its force because the different planes of now are just different choices of coordinates, not different slices of reality. Another defense for your intuition is called Past Light Cone Presentism, advocated by philosophers like Howard Stein. This view suggests that an event is only real if it can causally affect you, meaning only events within your past light cone exist. Under this view, the distant solar flare is not real for either you or your jogging friend until the light from it reaches you, which preserves the idea that the future is open without contradicting Special Relativity.

  So when you are arguing with your friends in the dining hall, you can tell them that their reasoning follows the Rietdijk-Putnam argument toward Eternalism, but that it relies on assuming that reality must be transitive across different frames of reference. You are right to feel that it is a leap, because it is a metaphysical commitment layered on top of physical equations. Many philosophers of time remain Presentists who deny that the relativity of simultaneity dictates ontology, and many physicists remain agnostic about whether the block universe is physically real or just a useful mathematical model. The debate is very much alive, and your skepticism about the move from disagreement on simultaneity to the fixed future is shared by some of the best minds in the field. I would encourage you to look up papers by Hilary Putnam for the argument and Howard Stein or Nicholas Saunders for the counter-arguments, as reading both sides will help you map the boundaries of where the physics ends and the philosophy begins.
