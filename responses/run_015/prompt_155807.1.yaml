      *   **Tone/Style:** Intellectual, precise, analytical, skeptical of slogans, prefers "candidate hypotheses side by side" (lab notebook style), British English, no references/reading lists.
      *   **The Problem:** A debate in a reading group about "cancel culture/deplatforming." One member shut down debate with "free speech isn't freedom from consequences." The user suspects this slogan conflates different things (boycott vs. firing, state vs. private, etc.).
      *   **The Task:** Separate the precise claims hiding in that sentence into a "menu" (hypotheses).
      *   **Required Axes:**
          *   What counts as a consequence? (Downstream effect vs. deliberate sanction vs. third-party).
