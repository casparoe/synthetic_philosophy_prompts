          *   Type of claim? (Legal, conceptual, moral).
          *   Nature of response? (Speech vs. fine/dismissal).
          *   Coordination question? (Exercise of speech vs. punishment).
      *   **Evaluation Criteria:** For each reading: Trivial, Substantive/Defensible, or False. Does it do the work needed (show the society's action raises *no* free-speech worry)? Confidence level. Identify the "soft spot" (least defensible claim).
      *   **Constraint:** British English. No references.

  2.  **Deconstruct the Slogan:** "Free speech isn't freedom from consequences."
