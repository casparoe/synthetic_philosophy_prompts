  **The Case: The Joint Pilot Grant**

  Dr. Aris (Surgery) and Dr. Bas (Internal Medicine) are dividing the benefits of a shared hospital pilot program, normalized so disagreement yields $(0,0)$ and individual departmental caps yield a maximum of $1$ (e.g., Aris maxes operating room hours, Bas maxes clinic slots). In **Version A**, an old administrative rule requires Aris to lead all joint cases, creating a bottleneck that depresses Bas's efficiency when resources are balanced; the Pareto frontier connects $(0.2, 1)$ [Bas maxes clinics, Aris on standby], $(0.4, 0.6)$ [Aris leads joint cases, administrative drag], and $(1, 0.2)$ [Aris maxes OR, Bas on consults]. In **Version B**, a new grant rule allows Bas to lead joint cases, removing the bottleneck and straightening the trade-off curve; the frontier now connects $(0.2, 1)$, $(0.4, 0.8)$ [Joint cases efficient, on the linear trade-off], and $(1, 0.2)$, strictly expanding the feasible set without raising either party's physical capacity cap.

  **Technical Specs & Arithmetic**

  *   **Disagreement:** $d = (0,0)$. **Ideal:** $b = (1,1)$ in both versions (determined by endpoints $(0.2, 1)$ and $(1, 0.2)$).
  *   **Version A Frontier:**
      1.  Segment 1: $(0.2, 1)$ to $(0.4, 0.6)$. Line: $y = -2x + 1.4$.
      2.  Segment 2: $(0.4, 0.6)$ to $(1, 0.2)$. Line: $y = -\frac{2}{3}x + \frac{1.3}{1.5} \approx -0.67x + 0.87$.
      *   **KS Solution:** Intersection of $y=x$ with Segment 2 ($x = -0.67x + 0.87 \Rightarrow 1.67x = 0.87 \Rightarrow x \approx 0.52$). **$\text{KS}_A = (0.52, 0.52)$**.
      *   **Nash Solution:** Maximize $xy$. Segment 1 peak at $x=0.35$ ($U=0.245$). Segment 2 peak at $x=0.65$ ($U \approx 0.281$). Max is on Segment 2. **$\text{NBS}_A = (0.65, 0.43)$**.
  *   **Version B Frontier:**
      1.  Single Segment: $(0.2, 1)$ to $(1, 0.2)$. Line: $y = -x + 1.2$. (Note: $(0.4, 0.8)$ lies on this line).
      *   **KS Solution:** Intersection of $y=x$ with $y=-x+1.2 \Rightarrow 2x=1.2 \Rightarrow x=0.6$. **$\text{KS}_B = (0.60, 0.60)$**.
      *   **Nash Solution:** Maximize $x(-x+1.2)$. Peak at $x=0.6$. **$\text{NBS}_B = (0.60, 0.60)$**.
  *   **Comparison:**
      *   **Expansion:** $S_B \supset S_A$ (Point $(0.4, 0.8)$ dominates $(0.4, 0.6)$).
      *   **Max Payoffs:** Unchanged at $1$ for both.
      *   **Monotonicity:** KS moves $(0.52, 0.52) \to (0.60, 0.60)$ (Both gain). **Nash moves $(0.65, 0.43) \to (0.60, 0.60)$ (Aris loses $0.05$).**

  **Analysis**

  The feature doing the work is the **asymmetric removal of a kink**. In Version A, the kink at $(0.4, 0.6)$ creates a "flat" region (Segment 2) where Aris has high leverage; the Nash solution sits here because the marginal cost of giving Bas more utility is low for Aris. Version B removes this kink, making the frontier steeper in that region (slope $-1$ vs $-0.67$). This makes Bas's utility "more expensive" for Aris to ignore, pulling the Nash tangent toward the diagonal. Aris loses absolute utility because the new options improve Bas's bargaining position more than they expand the total surplus available to Aris. If you remove this feature (e.g., expand the set symmetrically by adding a point favoring Aris), the Nash solution would likely move symmetrically, and Aris would not lose. If the expansion raised Aris's maximum payoff (e.g., to $1.1$), the ideal point $b$ would shift, and the KS normalization would change; technically, the Monotonicity axiom (which assumes fixed $d$ and $b$) would no longer apply directly, and the "violation" disappears because the scale of the game changed.

  **The Nash Partisan's Pushback**

  A Nash partisan would argue that this example proves **Independence of Irrelevant Alternatives (IIA)** is the superior axiom, not that Nash is "wrong." In Version B, the old agreement $(0.65, 0.43)$ is still feasible, but it is no longer optimal because $(0.60, 0.60)$ generates a higher total product ($0.36$ vs $0.28$). The Nash solution tracks the *maximum gain from cooperation*, not *entitlement based on previous frontiers*. Aris's loss is not an injustice; it reflects that the new grant rule increased Bas's leverage (threat point relative to the ideal), making Aris's previous share unsustainable in a rational maximization of joint surplus. The strongest reply is that Monotonicity and IIA are logically incompatible (Roth 1977); this case doesn't falsify Nash, it merely forces a choice: do you want a solution that respects consistency of choice (Nash/IIA) or one that respects resource expansion (KS/Monotonicity)? Your friend can shrug and say, "Aris lost share because the new options made Bas's cooperation more valuable; protecting Aris's old share would require ignoring the new, better option $(0.60, 0.60)$, which is irrational." The example bites only if you prioritize monotonicity over IIA a priori.
