answer: |-
  - the flowchart in words

  Step 1: Data Pull (Hours 0-12). Grab official government harvest reports, silo satellite imagery, and local market price sheets. Pull state food-security statutes and prior year commitment letters. Grab clinic admission logs for severe acute malnutrition (edema/kwashiorkor) and official mortality statistics.

  Step 2: The Entitlement Map (Hours 12-24). Check trade and labor entitlements. Are wages buying less food than last season? Are markets functioning or closed? If prices spiked but wages stayed flat, mark "Entitlement Failure." If harvest data shows crop loss, mark "Availability Decline."

  Step 3: Counterfactual Entitlement Audit (Hours 24-36). Compare actual access against state laws. Question: Does the government claim they met distribution quotas? If official reports say "Quotas Met" and silos look full, check "State Compliant" for now. Note: In a 48-hour window, you must treat official data as provisional truth unless you have independent verification on hand.

  Step 4: Silent Famine Check (Hours 36-42). Compare official death counts to clinic spikes. Question: Are clinic admissions for starvation symptoms rising while official death reports stay zero? If yes, mark "Data Suppression." If mortality data is classified or unavailable, mark "Inconclusive."

  Step 5: Decision Matrix (Hours 42-48). If "Availability Decline" is yes and "State Compliant" is yes → Classify Natural Disaster (Logistics). If "Entitlement Failure" is yes AND "State Compliant" is no → Classify Political Crime. If "Entitlement Failure" is yes BUT "State Compliant" is yes (based on official reports) AND "Data Suppression" is Inconclusive → Default to Natural Disaster (Logistics) due to insufficient evidence of malice. Hand off to Human Coordinator if "Data Suppression" is confirmed or if market spikes contradict silo data without explanation.

  - Case 1: Bengal

  Running the procedure on Bengal 1943 hits the Political Crime track hard. Step 1 shows harvest data was actually okay, but war procurement policies skewed distribution. Step 2 flags a massive Entitlement Failure: fishermen and laborers couldn't trade labor for rice due to price spikes and boat denial policies. Step 3, the Counterfactual Audit, fails immediately. State laws promised food security, but procurement priorities favored the military over civilians, violating the entitlement map. Step 4, the Silent Famine Check, triggers hard: official mortality was suppressed while clinic and street reports showed massive starvation. Because the "State Compliant" box is unchecked and "Data Suppression" is confirmed, the procedure correctly outputs "Political Crime." The entitlement failure wasn't about lack of food; it was about state-orchestrated exclusion. The 48-hour window is tight, but the historical record provides enough verified data on procurement policies to bypass the "provisional truth" rule for official reports. This case validates the tool: when the state's own actions are documented as the blockage, the audit catches it.

  - Case 2: The 2024 hypothetical

  Here the procedure misfires. Step 1 shows full silos and a government-reported record harvest. Step 2 flags Entitlement Failure because prices tripled, but since silos are full, the procedure initially leans toward distribution issues. Step 3 is the trap: the Counterfactual Audit asks if the state claims compliance. The government says "Quotas Met." Because independent verification of lying takes more than 48 hours, field staff must provisionally check "State Compliant." Step 4, the Silent Famine Check, comes back "Inconclusive" because mortality data is classified; clinic logs exist but without official death counts, the discrepancy isn't "confirmed" per the strict matrix. Step 5 Decision Matrix: We have Entitlement Failure, but "State Compliant" is yes (provisionally) and "Data Suppression" is Inconclusive. The default rule kicks in: insufficient evidence of malice. Classification: Natural Disaster / Logistics Only. The procedure treats the price spike as a market glitch or transport bottleneck rather than a blockade because the state's paper trail looks clean within the time limit. It fails to see the political crime because it prioritizes verifiable data over structural signals.

  - Where the procedure breaks / judgment calls

  The breakdown happens in Step 3 and the Step 5 default rule. The procedure assumes that within 48 hours, official data is a neutral baseline. In Case 2, that assumption is weaponized by the state. By forcing staff to treat official harvest reports as "provisional truth" to meet the deadline, the audit lets lying governments off the hook. Also, the Silent Famine Check requires a discrepancy between official and clinic data; if the state simply classifies all mortality data, the check returns "Inconclusive" rather than "Suspicious." This creates a safe harbor for authoritarian regimes. The human coordinator must override this because the distinction between "logistics failure" and "political blockade" is often invisible in the data itself. You need context to know that border checkpoints aren't broken—they're closed on purpose. The checklist treats missing data as neutrality, when in famine contexts, missing data is often evidence of guilt.

  - Bottom line: can this actually work?

  Honestly? Not as a truth machine. You asked for Sen's entitlement approach operationalized, but Sen's whole point is that famines are rarely natural—they're political failures of distribution. By creating a "Natural Disaster" category, you're building a loophole into Sen's theory. This checklist works for triage (getting food moving), but it fails at justice (assigning blame). You can't remove political judgment from a political problem. If you use this, know that the "Natural Disaster" classification is essentially a "We couldn't prove they did it in time" label, not a factual statement. It's useful for unlocking logistics funding, but dangerous for advocacy. Don't let the spreadsheet convince you the famine isn't a crime.
