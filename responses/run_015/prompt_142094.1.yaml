answer: |-
  Good evening. For those who don't know me, I am one of the many people Marion Ashgrove has carried.

  We are gathered to present the Vance Medal. For decades, this award told a story of singular ascent: one peak, one climber, the rest left below. But this year, the medal tells a different story, one Marion herself wrote into the association's bylaws. We have a shortlist of peers who have all cleared the bar. The winner is drawn by lot.

  Some might worry this makes the medal arbitrary. I suggest it makes the medal honest.

  Marion often tells the story of a fellowship application in 1986 that was misfiled into the right pile. She says it was luck. She says nobody is self-made. She is right. But there is a second half to that sentence that she lives out every day: if nobody is self-made, then everybody is dependent on someone who holds the ladder steady.

  The lot acknowledges that once a certain height is reached, the air is too thin to measure who is breathing better. But getting to that altitude? That requires something the lot cannot provide. It requires the talent Hal Vance wrote about in his endowment letter. It requires the perseverance to show up when the fellowship is misfiled into the wrong pile, and the grace to keep working when it lands in the right one.

  Marion is on this shortlist not because she beat the others sitting here tonight—colleagues whose work we also honor—but because she helped build the ground we are all standing on. She argued for this procedure not to diminish achievement, but to protect the truth about it. She knows that distinction is a threshold, not a ladder.

  To her family: this medal is not a coin flip. It is a certification that the person you know at the kitchen table is the same person we know in the lecture hall. She is consistent.

  To the students from the summer programme: you are here because you worked. Do not let anyone tell you your success is merely chance. Marion's genius was not in making things easy for you, but in making them possible. She cleared the brush so you could run the race. You earned your places; she ensured the track was open.

  And to Hal Vance, whose generosity makes this evening possible: thank you for funding the recognition of standards. Today, we honor your intent not by ranking the unrankable, but by certifying that the standard you envisioned has been met, abundantly, by this group.

  There is a finalist at the next table who speaks after me. We share this shortlist. We share this standard. Tonight, the lot simply decides who holds the medal for the year. But the work—the carrying—that is shared forever.

  Marion, you taught us that we are all carried. Tonight, we simply hand you a small token to show we felt the weight, and that we are ready to carry it back.

  Thank you.

  ***

  **Note on Phrasing and the Luck Problem**

  1.  **"Helped build the ground we are all standing on" vs. "Deserved this more than anyone."**
      *   *Avoided:* Claiming she uniquely deserved the win over the other finalist.
      *   *Reasoning:* This would contradict the lot system and insult the peer at the next table. Instead, I shifted the merit to her structural contribution (advocating the procedure) which distinguishes her without ranking her research above the other finalist's.

  2.  **"Ensured the track was open" vs. "You were lucky to have her."**
      *   *Avoided:* Attributing the students' success to luck or her benevolence alone.
      *   *Reasoning:* Telling first-gen students their success is luck is condescending. I had to validate their effort ("You earned your places") while crediting her with removing barriers ("clearing the brush"), separating opportunity from achievement.

  3.  **"Certifying that the standard... has been met" vs. "Honoring the best among us."**
      *   *Avoided:* Superlative language implying a hierarchy.
      *   *Reasoning:* To respect Hal Vance's endowment ("talent and perseverance") without violating the new procedure's logic (no ranking), I reframed the medal as a certification of a threshold reached rather than a prize for being superior. This satisfies the donor's intent while adhering to Marion's philosophy.
