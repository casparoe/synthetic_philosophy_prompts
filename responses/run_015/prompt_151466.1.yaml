  **Settlement Criterion:** I count this as settled only if a derivation exists that relies *solely* on the unitary formalism plus axioms of rationality that are demonstrably independent of probabilistic assumptions (i.e., no "Equivalence" or "Diachronic Consistency" principles that tacitly assume the Born rule). Consensus among specialists is not enough; the logic must be airtight.

  **Headline Credence:** **0.45**

  ### Decomposition

  1.  **Decision-Theoretic Route (Deutsch-Wallace):** **0.40**
      *   *Justification:* Mathematically valid given the axioms, but the axioms (e.g., Diachronic Consistency) are widely argued to smuggle in probabilistic assumptions, making the derivation question-begging.
  2.  **Coherence of Self-Locating Credence:** **0.70**
      *   *Justification:* While conceptually slippery, the "Subjective Uncertainty" view (Saunders/Wallace) is sufficiently robust to allow probability talk without contradiction.
  3.  **Branch Counting / Discretization:** **0.20**
      *   *Justification:* Requires new physics (fundamental discretization) not present in standard Hilbert space QM; effectively changes the ontology rather than deriving from the existing one.
  4.  **Empirical Route:** **0.10**
      *   *Justification:* Matching data confirms the theory but does not constitute a *derivation* of the probability rule from the ontology; it leaves the "incoherence problem" unsolved.
  5.  **Other (Envariance, etc.):** **0.30**
      *   *Justification:* Zurek's Envariance is promising but currently relies on assumptions about subsystem independence that are not fully derived from unitarity alone.

  ### Combination Logic
  The headline figure is driven primarily by the Decision-Theoretic route (1), as it is the only live option within standard continuous QM. I treat (1) and (2) as conjunctive requirements for the "Orthodox Everettian" solution ($0.40 \times 0.70 \approx 0.28$). I add the probability mass from the "New Physics" route (3) and "Other" (5) as alternative possibilities, but discount them heavily for not meeting the "nothing beyond wavefunction" constraint. The sum reflects a field where the best argument is plausible but critically contested.

  ### Headline Conditional on (3)
  **0.85**
  *   *Justification:* If the state space is fundamentally finite and dynamics are permutations, the "counting" measure becomes objective, dissolving the incoherence problem and recovering Born weights via indifference without decision-theoretic axioms.

  ### Sensitivity & Confidence
  *   **Most Sensitive Term:** **(1) Decision-Theoretic Route.** If a proof emerges that the Deutsch-Wallace axioms are *not* circular (or a no-go theorem proves they must be), my headline number swings by ±0.30.
