  *   **Where the disagreement lives:** I would bet the disagreement definitely lives in **(1)**. You see the decision-theoretic axioms as "smuggled weights" (lowering your credence), while he likely views them as "pure rationality" (keeping his high). However, his *extreme* confidence suggests he is secretly relying on (3) as a trump card, whereas you are correctly assessing the status of standard derivations. You are closer to the consensus, but he is closer to a potential (but speculative) solution.
