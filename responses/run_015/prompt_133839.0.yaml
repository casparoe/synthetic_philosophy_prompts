answer: |-
  # Taxonomy of Positions on Temporal Consciousness and the Color Phi Phenomenon

  **1. When a subject's report conflicts with the physical stimulus sequence, is the discrepancy located in the conscious experience itself, or in the subsequent memory and judgment?**

  *   **A. In subsequent memory and judgment (The experience itself is veridical).**
      *   **Leaf: Deflationary No-Anomaly**
          *   *Awkward Commitment:* Implies subjects are systematically mistaken about the content of their own immediate experience, reducing phenomenology to a confabulated narrative.

  *   **B. In the conscious experience itself (The experience itself is non-veridical).**
      *   **2. How is the unified percept constructed relative to the timing of awareness?**
          *   **A. By altering the content of a state that was already experienced.**
              *   **3. Does this alteration apply to the qualitative character (e.g., color) or only to the temporal ordering of the event?**
                  *   **A. To the qualitative character.**
                      *   **4. Is there a minimal integration window (approx. 100–200 ms) within which retrospective alteration is impossible?**
                          *   **A. No (Alteration can occur immediately).**
                              *   **Leaf: Retrospective Phenomenal Revisionism**
                                  *   *Awkward Commitment:* Requires the metaphysical possibility that the intrinsic properties of a past conscious moment can be literally changed after they occur.
                          *   **B. Yes (The immediate present is protected from revision).**
                              *   **Leaf: Unoccupied (Protected Orwellianism)**
                                  *   *Awkward Commitment:* Posits a mechanism that can rewrite the recent past but not the immediate present, despite no known neural buffer that fixes content instantly while leaving older content malleable.
                                  *   *Diagnosis of Empty Space:* Defended by nobody because the delay required to facilitate Orwellian revision typically exceeds the integration window, making the distinction functionally null.
                  *   **B. Only to the temporal ordering.**
                      *   **Leaf: Unoccupied (Temporal-Only Revision)**
                          *   *Awkward Commitment:* Claims the subject sees the intermediate color veridically but mislocates it in time, failing to explain why the intermediate color is reported at all.
                          *   *Diagnosis of Empty Space:* Logically coherent but empirically inadequate for Color Phi, which involves the creation of a color *not* present in the stimulus, not just a timing error.

          *   **B. By inserting a false representation before the state reaches conscious awareness.**
              *   **3. Does the subject retain first-person authority over the pre-revised (true) state?**
                  *   **A. Yes.**
                      *   **Leaf: Unoccupied (Authoritative Stalinesque)**
                          *   *Awkward Commitment:* Asserts the subject is conscious of the true state despite the censoring mechanism preventing that state from entering awareness.
                          *   *Diagnosis of Empty Space:* Logically incoherent; if the revision occurs before access, the subject cannot have authority over a state they never experienced.
                  *   **B. No.**
                      *   **Leaf: Access-Level Stalinesque Confabulation**
                          *   *Awkward Commitment:* Posits a hidden "censor" in the cognitive architecture that is undetectable even from the first-person perspective.
                      *   *(Note: This leaf is empirically indistinguishable from Retrospective Phenomenal Revisionism from the subject's point of view.)*

          *   **C. By generating intermediate content prospectively within a narrow processing interval.**
              *   **3. Is the intermediate content generated within a fixed neural latency period?**
                  *   **A. Yes.**
                      *   **Leaf: Predictive-Binding Minimalism**
                          *   *Awkward Commitment:* Commits to a specific, rigid temporal window for binding that may not account for individual variability or cross-modal differences in processing speed.
                  *   **B. No.**
                      *   **Leaf: Unoccupied (Variable Predictive Binding)**
                          *   *Awkward Commitment:* Suggests the brain predicts the past without a stable temporal horizon, risking a loss of explanatory precision regarding the 100–200 ms threshold.
                          *   *Diagnosis of Empty Space:* Undefended because predictive coding models generally rely on consistent priors and latency constraints to function computationally.

  ***

  **Empirical Indistinguishability Note:**
  The tree cannot genuinely separate **Retrospective Phenomenal Revisionism** and **Access-Level Stalinesque Confabulation** via first-person report alone. As noted by Daniel Dennett, because both positions result in the same final report and the same current conscious state, there is no "fact of the matter" accessible to the subject that distinguishes a rewritten past from a fabricated presentation.
