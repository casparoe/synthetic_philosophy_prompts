          *   *Propensitist:* Hazards have degrees. *Result:* Hierarchy becomes a continuum, not steps. "Elimination" is just very low propensity. Rewrite needed to allow risk matrices to supersede hierarchy.
      *   **Part 5: Conclusion/Recommendation:**
