answer: |-
  Your hypothesis is astute, but it locates the disagreement too high up in the epistemological superstructure. The stalemate isn't primarily about the bridge principle linking conceivability to possibility; it's about what work the modal claim is doing in the first place. The debate looks epistemological because both sides use modal intuitions as proxies for metaphysical complaints about explanation.

  Your "Symmetry Worry" identifies the real engine of the dispute. You ask what breaks the tie between "P&~Q is possible" and "P necessitates Q a posteriori." The answer isn't found in the authority of ideal reflection, but in theoretical virtue. We accept water=H2O as necessary a posteriori because it maximizes ontological parsimony without explanatory loss. We resist brain=pain as necessary a posteriori because it looks like explanatory obscantism. The physicalist says the connection is brute but harmless; the dualist says a brute connection here is unintelligible because phenomenology seems to demand understanding, not just labeling. The modal claim is a stand-in for the demand: "Show me *how* this necessitates that." When the physicalist says "ideal reflection closes the gap," the dualist hears "stop asking for explanation." When the dualist says "ideal reflection leaves it open," the physicalist hears "you privilege introspection over causal closure."

  This dissolves your "Parity Worry" as well. The reason moral non-naturalism doesn't follow from moral twin earth is that moral facts aren't typically claimed to be causally efficacious in the physical world. If moral facts caused physical movements independently of descriptive facts, the parity would hold, and everyone would be a moral dualist. The phenomenal case is special because phenomenology appears to do causal work (I scream because it hurts). The physicalist insists on causal closure; the dualist insists on intelligible connection. The modal gap is just the shadow cast by this conflict.

  Consequently, your "hidden empirical question" about calibrating imagination is a category mistake. Imagination isn't a perceptual faculty calibrated against independent data; it's a reasoning tool calibrated against coherence. The "failures" (Hesperus/Phosphorus) aren't failures of imagination; they are discoveries that our concepts were narrower than the world. Empirical work on imagination won't solve this because the dispute isn't about psychological capacity, but about normative constraints on metaphysical explanation.

  So, is progress possible? Only if the question changes. Finer distinctions in conceivability (positive/negative/ideal) are exhausted because they don't address the underlying metaphysical friction. A formal result on two-dimensionalism won't help because the semantics are flexible enough to accommodate either side. The stalemate is principled: it rests on clashing bedrock commitments about what counts as a successful explanation. Physicalists prioritize causal closure and parsimony; dualists prioritize intelligibility and phenomenological authority.

  Progress would look like abandoning the modal epistemology frame and arguing directly about the metaphysics of explanation. Can a brute necessary connection be explanatory? Is causal closure a methodological rule or a metaphysical truth? Until the debate shifts from "Can we conceive it?" to "What kind of explanation do we owe?", you will cycle through the same papers. The dismissal of a priori entailment isn't an argument; it's a symptom of the deeper refusal to accept that phenomenal facts could be physically transparent without losing their essence. You aren't stuck because you haven't found the right paper; you're stuck because the modal link is the wrong battlefield. The war is about explanation, and neither side is willing to concede their foundational criterion of theoretical virtue.
