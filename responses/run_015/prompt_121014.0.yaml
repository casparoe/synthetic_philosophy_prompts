answer: |-
  **Brainstorming Bureaucracies of Meaning**

  1.  **The Joy Tithe:** Citizens must donate recorded hours of genuine happiness to a state vault to offset the selfishness of enjoying objectively useful work.
  2.  **The Meaning Futures Market:** Citizens trade shares in each other's life projects; high volatility indicates authentic struggle, while stable stocks suggest delusion.
  3.  **Somatic Calibration Booths:** Physical machines measure heart rate against productivity output to ensure the citizen is suffering enough to justify their utility.

  **Selection:** #3 (Somatic Calibration Booths) is the strangest.

  ***

  **The Zero Sum**

  Elara stamped the form with a dull thud. The Bureau of Absurd Coordination hummed, a vast engine dedicated to the state philosophy: the universe is silent, so we must scream loudly enough to file it correctly.

  Next applicant: Kael. He sat stiffly, hands folded over a dossier thick enough to stop a bullet.

  "Objective contributions?" Elara asked, not looking up.

  "Three vaccines developed. One famine averted. Standard Tuesday stuff," Kael said. His voice was flat, like a dial tone.

  "And subjective engagement?"

  "None. I feel nothing when I save them. It's just mechanics."

  Elara typed. **Utility: High. Passion: Null.** The screen glowed green. "Approved. You're fighting the void with cold steel. The Bureau likes that."

  Kael stood. "Does it matter? The stars don't care if I cure them."

  "No," Elara said. "But the license does."

  When the office cleared, Elara initiated her own quarterly null-check. She was an auditor; she had to be audited. She pulled up **Form 88-Z: Existential Ledger**.

  > **SECTION A: SUBJECTIVE HEAT**
  > *Rate current attraction to daily tasks (1-100):* [ 45 ]
  > *Rate emotional resonance of hobbies (1-100):* [ 45 ]
  > *Total Passion Credit:* [ 90 ]
  >
  > **SECTION B: OBJECTIVE MASS**
  > *Rate societal utility of labor (1-100):* [ 90 ]
  > *Rate tangible impact on entropy (1-100):* [ 0 ]
  > *Total Utility Debt:* [ 90 ]
  >
  > **CALCULATION:** [ PASSION ] - [ UTILITY ] = [ NET MEANING ]

  She entered the numbers. Her job was to ensure others weren't lying about the void. She loved the precision of it (Passion: 45). She loved her garden (Passion: 45). But her work merely shuffled paper that kept the lights on (Utility: 90). The system processed. The fan whirred.

  A red light blinked. Then a letter printed itself, heavy cream paper smelling of ozone.

  > **NOTICE OF ANOMALY**
  > **Citizen:** Elara Vance
  > **Status:** NULL-RATING DETECTED
  > **Net Meaning:** 0.00
  >
  > **ASSESSMENT:**
  > Your subjective attraction and objective contribution cancel exactly. You are in perfect equilibrium with the void.
  >
  > **DIRECTIVE:**
  > The Licensing Algorithm cannot process zero. Meaning requires friction—either the pain of useless passion or the joylessness of duty. You have neither. You are statistically invisible.
  >
  > **ACTION:**
  > Report to Calibration Booth 4 for manual override or voluntary erasure.

  Elara held the paper. The room seemed to tilt. In a world where everyone claimed either the martyr's burden or the artist's fire, she was balanced.

  She looked at her hands. They weren't shaking. The state taught that the cosmos offers no script, so we must write our own in ink that fades. Most wrote too loud. Kael wrote too cold. Elara hadn't written at all; she had simply existed in the margin.

  Was this the deficit? A life that didn't tip the scales? Or was it the only honest thing left? If the universe is truly empty, then a zero score isn't an error. It's a match.

  She picked up her stamp. She hovered it over the letter. If she stamped it, she acknowledged the error. If she didn't, she accepted the zero.

  Elara set the stamp down. She picked up her pen and wrote *Approved* in the margin of her own life, ignoring the directive. The lights flickered, then steadied. The void didn't mind.
