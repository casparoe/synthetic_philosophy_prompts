answer: |-
  **Public symbols must be removed when their primary function is to assert a hierarchy incompatible with equal citizenship; they may remain where their legacy is functionally vital or historically instructive, provided context is added. Extra-legal removal is permissible only when formal channels are structurally blocked from correcting exclusion.**

  The first clause drives your Confederate, Colston, and Lenin verdicts: each symbolizes a political order defined by racial or ideological subordination. The second clause sustains the Paediatrician, Rhodes, and Suffragist cases: their contributions (medical utility, historical complexity, voting rights) retain civic value despite moral flaws. The third clause reconciles your procedural tension: Colston's toppling is justified because institutional inertia blocked removal, whereas overriding a local referendum violates democratic agency when channels are open.

  This principle cannot fully accommodate your nagging discomfort over the Suffragist. It classifies her as "vital," justifying retention, but offers no resolution for when the honoured achievement and the repudiated view are historically inseparable. This is the "tainted legacy" problem: the principle prioritizes current utility over historical purity, leaving the moral residue unaddressed.

  Applying this to your torn cases:
  1.  **The Segregated War Memorial:** The physical separation of names asserts a racial hierarchy incompatible with equal citizenship. The principle demands alteration. The stone should remain as evidence, but the segregation must be removed—either by re-carving the names together or moving the stone to a museum with explicit context.
  2.  **The Hospital Founder:** The hospital's function is vitally life-saving, outweighing the founder's role in drafting sterilisation laws. Keep the name, but the archive must be made public and a plaque installed detailing his role in the law. The functional good permits retention; the hierarchy demands disclosure.

  Among scholars, there is consensus that contextualization is generally superior to silent erasure for complex figures, and that democratic procedure carries weight. Live disputes remain sharp on two fronts: first, the threshold for "hierarchy" (whether Rhodes counts as exclusionary as Confederates); second, the legitimacy of extra-legal removal (whether Colston's toppling was democratic correction or mob rule). Your view aligns with the "corrective justice" camp on procedure, but sits uncomfortably in the middle on the hierarchy threshold, treating Rhodes as instructive but Confederates as treasonous. This is a defensible distinction based on loyalty to the current state, but it remains philosophically contested.
