  Hey — I need a "which solution to the problem of logical omniscience are you actually committed to?" quiz, but the honest version: a decision tree / taxonomy where every node is a question about a concrete case and every leaf is a named position. Context, so you know what I care about: I'm building a tiny epistemic model checker for a multi-agent setup where the agents are LLM-ish things — bounded compute, no clean belief set, and they will happily assert P and not-P in the same session. So I need a map of the positions that also tells me which of them I could actually implement.

  Constraints:

  - Start from the shared datum that people on all sides accept: agents routinely fail to believe things that follow from what they believe. No node should ask "do you think logical omniscience is a problem?" — of course it is.
  - Max 10 questions, 8–12 leaves. Questions should be answerable by someone who has never heard the label of any view, and no question should ask them to pick a theory name or self-identify.
  - Please use these cases somewhere, and add your own if you need them: (a) Marcus has "if the build is green we ship tonight" and "the build is green" in working memory at the same time and, asked whether we ship tonight, says nobody's run the check; (b) a 60-link chain of implications, each link trivial, agent has all of them and has never chained them; (c) a belief set of ten thousand premises whose inconsistency only shows up after ~10^15 case checks; (d) a valid sentence nobody has ever tokened — does the agent believe it, does it believe every instance of a schema it's never seen; (e) Nadia, a flawless logician, believes that all ravens are black and withholds on the claim that all non-black things are non-ravens, having never put the two side by side; (f) Otto believes his own beliefs are inconsistent but can't locate the contradiction, and is asked about an arbitrary P; (g) a language model that output P in one conversation and not-P in another, with no fact of the matter about which one it "really" believes.

  Build the branch structure out of distinctions rather than out of a list of names. The ones I want on the tree: which closure failure is even the target (intractable consequence vs one-step modus ponens vs unthought-of logical truth vs outright contradiction in the set); whether the repair goes into the attitude and its closure principles or into the consequence relation itself; syntactic/sentential vs semantic modelling; static snapshot vs a view that also says something about what the agent would believe with more time or compute; and whether the objects of belief are fine-grained enough (guises, ways of taking) that failures under logical equivalence get a hyperintensional story instead of a resource story. Add better ones if I'm missing them.

  Per leaf: a name (use the standard one if there is one; if not, invent a label and describe the view — don't stall on who said what, I don't care about attribution), one sentence on its most awkward commitment, and then the bit I actually need: is the view finitarily representable for bounded agents — finite structure, decidable model checking, or does it need infinite world sets / unbounded derivations.

