  # DECISION TREE: WHAT ARE "QUALIA"?

  **START:** *"I am having a reddish experience of this apple right now."*

  ### 1. THE ONTOLOGY CHECK
  **Does this statement report a genuine property instantiated in your mind?**
  *   **NO:** The idea of a "phenomenal property" is a mistake.
      *   **1a. Is the mistake conceptual or empirical?**
          *   **Conceptual:** The term "qualia" is confused/incoherent (like "phlogiston").
              *   → **LEAF: Dissolutionism** (e.g., Dennett)
          *   **Empirical:** The concept is coherent, but nothing in the brain matches it; it's a user-illusion.
              *   → **LEAF: Illusionism** (e.g., Frankish)
  *   **YES:** There is a genuine property here. → **Go to 2.**

  ### 2. THE ACQUIRED-TASTE TEST (Introspective Authority)
  **Case:** *You loved coffee at 25, but can barely stand it at 45.*
  **Can introspection definitively distinguish "the sensory experience changed" from "my attitude/evaluation of the experience changed"?**
  *   **NO (Indistinguishable):** You cannot isolate a raw "feel" from your judgment about it.
      *   *Implication:* The warrant for non-representational qualia is shaky. The change was likely in content or role.
      *   → **Go to 3.**
  *   **YES (Distinguishable):** You can isolate the raw sensory feel from your reaction to it.
      *   *Implication:* Raw feels are introspectively accessible.
      *   → **Go to 4.**

  ### 3. THE CONTENT/ROLE CHECK (For "NO" on Introspection)
  **Is the property determined primarily by what the experience represents (accuracy conditions) or what it causes you to do (functional role)?**
  *   **Represents:** The "taste" is a representation of the coffee's chemical properties or value.
      *   → **LEAF: Representationalism/Intentionalism** (e.g., Tye, Dretske)
  *   **Causes/Role:** The "taste" is defined by its input-output connections and behavioral dispositions.
      *   → **LEAF: Functionalism** (e.g., Lewis, Armstrong)
      *(Note: If you think both equally, you may be a Teleological Representationalist; pick the leaf closest to your metaphysics.)*

  ### 4. THE LOCATION CHECK (For "YES" on Introspection)
  **Is this "reddish" property intrinsic to your mental state alone, or is it a relation to the external object?**
  *   **RELATIONAL:** The quality belongs to the apple; you are directly acquainted with it.
      *   **4a. The Inverted Spectrum Check:** *Could two people be functionally identical but perceive the apple's intrinsic quality differently (your red = my green)?*
          *   **YES:** → **LEAF: UNNAMED / INCOHERENT** (Naive Realism + Inverted Spectrum is generally considered incompatible; if the quality is in the object, it can't vary between perceivers without the object changing).
          *   **NO:** → **LEAF: Naive/Relational Realism** (e.g., Campbell, Martin)
  *   **INTRINSIC:** The quality is a feature of your mind/state itself, over and above the object. → **Go to 5.**

  ### 5. THE INDEPENDENCE CHECK (For "INTRINSIC")
  **Could two people be functionally identical (same behavior, brain state, representations) but have different intrinsic experiences (Inverted Spectrum)?**
  *   **YES:** Phenomenal properties float free of function and representation.
      *   → **LEAF: Old-Fashioned Qualia Realism** (e.g., Chalmers, Block)
  *   **NO:** Phenomenal properties are metaphysically fixed by functional/physical role.
      *   → **LEAF: Functionalism / Type Identity** (e.g., Smart, Place)
      *(Note: This leaf is metaphysically similar to Leaf 3, but reached via a different introspective commitment.)*

  ***

  ### INSTRUCTOR COMMENTARY & NOTES

  **1. The Work Done by the Acquired-Taste Case (Node 2)**
  This branch is the critical filter for **Qualia Realism**. Old-fashioned qualia realism relies on the premise that we have direct, infallible access to intrinsic sensory properties ("qualia") distinct from our judgments about them.
  *   **If students answer "NO" (Introspection can't tell):** They are steered away from Qualia Realism and Naive Realism. Both of those positions require the subject to be able to identify the *sensory component* independently of the *affective/evaluative component*. If introspection fails here, the "qualia" posit loses its primary evidential base. These students are routed to **Representationalism** (the change was in represented value) or **Functionalism** (the change was in dispositional role).
  *   **If students answer "YES":** They remain eligible for Qualia Realism, provided they also affirm intrinsic nature and inverted spectrum possibility downstream.

  **2. Indistinguishable Leaves (Where the Tree "Lies")**
  *   **Representationalism (Leaf 3) vs. Functionalism (Leaf 3/5):** On this tree, these are separated by whether the student prioritizes "content" or "role." However, in contemporary literature (e.g., Teleological Representationalism), these views often converge. A functional role is often defined by what the state is *supposed* to represent. Students who land on either leaf may find they agree on almost all concrete cases despite the different labels.
  *   **Functionalism (Leaf 3) vs. Functionalism/Type Identity (Leaf 5):** These are the same position reached via different introspective confidence levels. Leaf 3 students distrust introspection's ability to isolate qualia; Leaf 5 students trust introspection but deny that introspected properties are metaphysically independent of function. In practice, their ontological commitments are identical.

  **3. The Unnamed Leaf (Naive Realism + Inverted Spectrum)**
  This combination is marked "Incoherent" because Naive Realism posits that phenomenal qualities are properties of *external objects* perceived directly. If the object (the apple) remains constant, and the relation is direct, the experience cannot vary (invert) between perceivers without one of them perceiving incorrectly (illusion) or the object changing. Holding both "qualities are in the object" and "qualities can invert while object/function stays same" is a contradiction in terms.

  **4. Printing Note**
  This tree is designed to fit on one page with standard margins, leaving the second page for students to take notes on specific arguments (e.g., Block's "Absent Qualia" or Dennett's "Coffee Case") corresponding to each leaf.
