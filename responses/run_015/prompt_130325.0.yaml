answer: |-
  This is a classic and deeply subtle debate in the philosophy of physics, resurrected famously by Earman and Norton (1987) and refined by philosophers like Maudlin, Pooley, and Saunders. You and your friend have effectively reenacted the central tension of the last 40 years of scholarship on the Hole Argument.

  Here is the breakdown of where the false presupposition lies, the status of sophisticated substantivalism, and whether the fiber-bundle move saves your friend's position.

  ### 1. The False Presupposition: Haecceitism, Not Substantivalism
  The core error in your friend's reasoning is not necessarily a commitment to spacetime points existing (substantivalism), but a commitment to **haecceitism**.

  *   **Manifold Substantivalism:** The view that the points of the differential manifold $M$ exist independently of the fields defined on them.
  *   **Haecceitism:** The view that these points possess a primitive "thisness" (identity) independent of their qualitative properties (like the metric value at that point).

  The Hole Argument demonstrates that **Substantivalism + Haecceitism $\rightarrow$ Indeterminism.**
  If point $p$ has a primitive identity, then the model $(M, g)$ and the diffeomorphically dragged model $(M, \phi^*g)$ are physically distinct, because in the first model $g(p) = A$ and in the second $g(p) = B$. Since the initial data outside the hole is identical, the future evolution is not uniquely determined by the past.

  **The Resolution:** The standard resolution (Leibniz Equivalence) is to deny the implication. We assert that $(M, g)$ and $(M, \phi^*g)$ represent the **same physical state**.
  *   **Your Intuition:** You are correct that this treats the difference as **representational redundancy** (gauge freedom) rather than physical indeterminacy.
  *   **Your Friend's Error:** Your friend is treating a gauge symmetry as a physical symmetry. In electromagnetism, changing the potential $A_\mu \to A_\mu + \partial_\mu \Lambda$ does not create a new physical world; it creates a new description of the *same* world. The Hole Argument shows that in GR, diffeomorphisms play the role of gauge transformations.

  **Where the error lies:** The error is treating the mathematical distinction between diffeomorphic models as a physical distinction. The "indeterminism" is an artifact of counting gauge-equivalent descriptions as distinct physical worlds. It is not indeterminism in the quantum-mechanical sense (probabilistic outcomes); it is "indeterminism" in the sense of underdetermined description.

  ### 2. Does Quotienting Deny Point Existence?
  You asked: *"Does quotienting the solution space necessarily commit one to denying that spacetime points exist?"*

  **No.** This is the crucial distinction between **Relationism** and **Sophisticated Substantivalism**.

  *   **Relationism (Eliminativism):** Spacetime points do not exist; only the relations between material events exist. (This was Einstein's early view, but most modern philosophers of physics find it too restrictive for GR).
  *   **Sophisticated Substantivalism:** Spacetime points *do* exist, but they do not have primitive identity conditions (haecceity) independent of the metric field.

  In the sophisticated view, the manifold $M$ is real, but the physical reality is not the pair $(M, g)$ specifically; it is the **equivalence class** $[(M, g)]$ under the group of diffeomorphisms.
  *   Points exist as the "substrate" of the structure.
  *   However, you cannot ask "Is this point $p$ in solution 1 the *same* point as $q$ in solution 2?" unless there is a physical field coincidence to anchor that identity.
  *   This respects point existence while denying the haecceitistic identity conditions that generate the Hole Argument paradox. It is a stable middle position that aligns with the mathematical practice of treating isomorphic models as equivalent.

  ### 3. The Fiber-Bundle Formulation
  Your friend's counter-argument regarding fiber bundles is mathematically sophisticated but ontologically misleading.

  In the fiber-bundle formulation, the metric is indeed a section of a bundle over the base manifold $M$. Your friend argues this dissolves the argument because there is no "same point" being dragged.

  **Why this doesn't save their position:**
  1.  **The Base Manifold Remains:** A fiber bundle $E \to M$ still requires a base manifold $M$. If you attribute haecceitistic identity to the points of $M$, the Hole Argument applies to the bundle sections just as it does to the tensor fields. You can still actively drag the section $\sigma$ via a diffeomorphism $\phi$ of the base to get a new section $\sigma'$. If points in $M$ have primitive identity, $\sigma(p) \neq \sigma'(p)$, and the indeterminism returns.
  2.  **Gauge Structure is Explicit:** The fiber-bundle formulation actually *strengthens* the case for gauge redundancy. In gauge theories (like Yang-Mills), the physical state is defined by the orbit of the section under the gauge group. The bundle formalism makes it clear that the "physical object" is the equivalence class of sections, not a specific section.
  3.  **Shifting the Burden:** You are correct that this shifts the ontological burden. If the friend claims the bundle structure saves substantivalism, they are effectively admitting that the *physical reality* resides in the gauge-invariant structure of the bundle, not in the specific assignment of values to base points. This is just sophisticated substantivalism dressed in differential geometry. It does not restore the primitive identity of manifold points; it reinforces that physical identity is structural.

  ### 4. Summary of the Resolution

  To answer your specific questions directly:

  1.  **Where exactly does the false presupposition lie?**
      It lies in **Haecceitism**. The assumption that manifold points have a "thisness" that persists across diffeomorphic models independent of the metric field. The Hole Argument is a *reductio ad absurdum* of Manifold Substantivalism *combined with Haecceitism*.

  2.  **Is the error in treating the hole argument as demonstrating physical indeterminacy rather than representational redundancy?**
      **Yes.** The "indeterminism" is a artifact of over-counting physical states. Once you identify diffeomorphic models as representing the same physical state (Leibniz Equivalence), determinism is restored. The evolution of the *geometry* is deterministic; the evolution of the *metric values at haecceitistically individuated points* is not, but the latter are not physical observables.

  3.  **Does quotienting the solution space necessarily commit one to denying that spacetime points exist?**
      **No.** It commits you to denying that points have identity *prior* to the fields. You can be a **Sophisticated Substantivalist**: points exist as part of the ontology, but they are not "named" independently of the metric structure. Physical events are identified by field coincidences (e.g., where curvature is maximal), not by manifold coordinates.

  4.  **Does the fiber-bundle reformulation actually resolve the determinism tension?**
      It resolves it only by forcing you to adopt the gauge-invariant perspective (quotienting). It does not allow you to keep haecceitistic points. If your friend thinks the bundle formalism allows them to keep primitive point identity while avoiding indeterminism, they are mistaken. The bundle formalism makes the gauge symmetry *more* explicit, not less. It confirms that the physical state is the orbit, not the section.

  ### The Verdict
  You are closer to the consensus view in philosophy of physics. Your friend is attempting to hold onto a "Manifold Substantivalism" that the Hole Argument specifically targets.

  The "stable middle position" you intuited is **Sophisticated Substantivalism**. It acknowledges that the manifold is part of the ontology (avoiding radical relationism) but accepts that diffeomorphism invariance is a gauge symmetry (avoiding indeterminism). This requires abandoning the idea that spacetime points have primitive identity conditions (haecceity), which is a small ontological price to pay for a deterministic theory that matches the mathematical practice of general relativity.

  Your friend's fiber-bundle move is essentially an attempt to have their cake and eat it too: they want the mathematical rigor of bundles without accepting the ontological implication that gauge-related structures are identical. But the math of bundles *demands* that identification.
