prompt: |-
  Hey. I'm a science-and-ideas journalist and I've somehow let myself be talked into running a 75-minute session at a small ideas festival next month. Setting: about 18 adults, general public, almost nobody with a philosophy background, a couple of them who've read some pop-philosophy and will be smug about it, and at least two who think philosophy is just opinion with better vocab. Room with tables, a projector I'd rather not use, no budget worth speaking of. I can manage tiny real stakes — a box of good chocolate, a bottle of something, a few pounds each.

  The theme I got assigned is the "separateness of persons" complaint against utilitarianism. You know the one: that summing welfare across people treats a collection of distinct lives as if they were one big experiencing subject, and that this is meant to be a deep mistake rather than just a gripe about unfair shares. I want the room to *feel* that. Not hear me explain it. I'm not lecturing, and I definately don't want to say the words utilitarianism, or Rawls, or separateness of persons until the last five minutes — ideally someone in the room half-says it first and I just put a name on what they already said.

  So design me the thing. Rules, materials, minute-by-minute timeline, and what the facilitator says versus keeps their mouth shut about.

  The bit I actually need to happen is narrow, and this is where I expect designs to fail. I do *not* want an exercise that lands as "be fairer about who pays" or "spread the burden around" or "rotate the cost" — that's the shallow reading and I can feel a general audience sliding there immediately. What I need them to hit is the gap between "the total went up, so it was worth doing" and the standpoint of the single person who has to bear the cost, and to notice that the first claim isn't an answer to the second. If the mechanic only produces distributive-fairness intuitions, it's a dud. Tell me how your rules make that specific collision likely rather than hoping for it.

  Some things I want you to deal with:

  - I'd like real but genuinely trivial and reversible stakes — holding ice, a bitter cracker, a silly forfeit, whatever — with the group's payoff depending on someone taking it. But give me your honest read on whether that mechanic is a trap. What if several people volunteer at once and it turns into a warm story about self-sacrifice? What if nobody does? Both are live possibilities, I want a plan for each, and I want to know which outcome is actually the better one for my purposes and why.
  - A fallback paper-and-pen version, for when the festival organisers tell me I can't make anyone eat anything or hold ice.
  - The debrief: map particular moments in what happened onto particular parts of the objection, and be explicit about which moment *has* to occur for the session to have worked, plus what I do in the room if it doesn't occur.
  - What will predictably go wrong the first time I run this, and how I handle it without breaking character and turning into a lecturer.
  - Where the exercise is structurally incapable of going. My sense is it can make the complaint felt but can't show it's *sound* — that a utilitarian has moves here, something like treating rights as useful fictions, leaning on diminishing marginal returns, or saying the complaint is just a psychological fact about creatures like us. Which features of the objection can the activity not reproduce, and which therefore have to come from me in the last five minutes?

  Please: you're a moral philosopher who also designs this kind of session for real rooms full of real skeptical adults. Brainstorm two or three mechanics first, show me the ones you rejected and why, and then commit to one. No menu of options with "depending on your group" hedges — pick one game, one fallback, tell me your reasons, and give me your confidence that it will actually produce the collision I described above. If you think my framing of the complaint is off in a way that matters for the design, say so up front rather than designing around a bad brief. I'm writing the session up for a magazine afterwards, so I need to know where the design is doing the work and where I'm just asserting something.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas journalist, running a 75-minute session at a small ideas festival.
      *   **Audience:** ~18 adults, general public, mixed philosophical background (some smug pop-phil, some skeptical).
      *   **Theme:** The "separateness of persons" objection to utilitarianism (Rawls/Nozick style). The core idea: Utilitarianism treats society as a super-person, ignoring the distinct boundaries between individuals.
      *   **Goal:** Make the room *feel* the objection, not hear a lecture. Avoid terms like "utilitarianism" or "Rawls" until the end.
      *   **Critical Constraint:** Avoid the "distributive fairness" trap (i.e., "it's unfair that *I* pay"). The insight must be: "The total went up, but *I* am the one suffering, and 'the total' isn't a thing that suffers." It's about the *ontological* mistake of aggregation, not just unfair distribution.
      *   **Stakes:** Tiny, reversible, trivial (chocolate, ice, bitter crackers).
      *   **Requirements:**
          *   Critique the "sacrifice mechanic" (is it a trap?).
          *   Provide a fallback (paper/pen).
          *   Debrief plan (mapping moments to concepts).
          *   Predict failures & fixes.
          *   Limitations of the exercise (what it can't prove).
          *   **Format:** Brainstorm 2-3 mechanics, reject some, commit to one. No hedging. Honest read on the framing.

  2.  **Initial Brainstorming & Mechanics:**

      *   *Idea 1: The Ice Bucket Challenge (Voluntary Sacrifice).*
          *   *Mechanic:* Group gets a reward if one person holds ice for 5 mins.
          *   *Problem:* As the user noted, this risks becoming a "hero narrative" (smug self-sacrifice) or a "bystander effect" (nobody does it). It focuses on *willingness* to sacrifice, not the *aggregation* logic. It leans too hard into "is it fair to ask?" rather than "does the sum justify the individual loss?"
          *   *Verdict:* Reject. Too prone to moral grandstanding.

      *   *Idea 2: The Tax/Redistribution Game.*
          *   *Mechanic:* Everyone gets money. Some lose it so others gain more. Total pot increases.
          *   *Problem:* This screams "fairness" and "inequality." People will argue about envy, not the metaphysical status of the group. It triggers "distributive justice" intuitions immediately.
          *   *Verdict:* Reject. Violates the core constraint (avoiding the fairness trap).

      *   *Idea 3: The "Body" Analogy (Somatic Aggregation).*
          *   *Mechanic:* Treat the room as a single organism. Assign "pain" to specific limbs (people) to benefit the "head" (the group score).
          *   *Problem:* A bit abstract. Hard to make visceral without being weird.
          *   *Verdict:* Keep as a backup concept, but needs concrete stakes.

      *   *Idea 4: The "Sensory Aggregation" Game (The Chosen One).*
          *   *Mechanic:* The group wins a prize (chocolate for all) if the *average* discomfort score is below X, but the discomfort is generated by *one* person experiencing a high intensity while others experience none. Or, the group gets a bigger prize if one person takes a hit, regardless of how much the others gain.
          *   *Refinement:* Let's try to simulate the "Super-Person" logic. The group is told they are a single entity for the purpose of the game. Points are pooled. But the *experience* remains individual.
          *   *Specific Mechanic:* "The Neural Link." The room is one brain. 18 neurons. To solve a puzzle/get points, some neurons must fire (suffer cost).
          *   *Critique:* Still risks fairness.

      *   *Idea 5: The "Transferable Pain" Illusion.*
          *   *Mechanic:* Participants are paired. A generates points for B by taking a cost. Then we sum the points.
          *   *Critique:* Too transactional.

      *   *Idea 6: The "Blind Aggregation" (The Winner).*
          *   *Mechanic:* We need to separate the *accounting* from the *experience*.
          *   *Setup:* The group is told they are competing against a "House" score. The House calculates value by simple addition.
          *   *Action:* A proposal is made: "Person A eats a bitter cracker. Everyone else gets a piece of chocolate."
          *   *Twist:* The decision isn't voted on by majority (that's democracy). The decision is made by the Facilitator based on "Total Utility."
          *   *Key Insight:* The facilitator acts as the Utilitarian Calculator. The participants are the distinct persons.
          *   *Why this works:* It externalizes the logic. The participants don't decide; they *experience* the decision. The friction comes when the Calculator says "This is good" and the Sufferer says "This hurts me."
          *   *Refinement for the "Separateness" point:* We need to make sure the "Total" feels real to the Calculator but fake to the Sufferer.

  3.  **Refining the Chosen Mechanic: "The Calculator and The Neurons"**

      *   *Concept:* The room is a utility machine. The Facilitator is the Algorithm. The Participants are the input nodes.
      *   *Stakes:* Bitter taste (lemon juice/cracker) vs. Sweet taste (chocolate).
      *   *The Trap:* If we ask for a volunteer, it's heroism. If we pick someone, it's tyranny.
      *   *The Solution:* Random assignment + Irrevocable Logic.
      *   *Scenario:* We run 3 rounds.
          *   Round 1: Everyone gets chocolate. (Baseline)
          *   Round 2: One person gets lemon, everyone else gets *better* chocolate. (Net gain).
          *   Round 3: One person gets lemon, everyone else gets *slightly* better chocolate. (Net gain, but marginal).
      *   *The Twist:* The "Group Score" is displayed on the board. It goes up. The Facilitator celebrates the Score. The Sufferer feels the Lemon.
      *   *The Collision:* The Facilitator asks, "Did we win?" The Group says "Yes." The Sufferer says "I lost." The Facilitator says, "But the *Group* won."
      *   *Why this hits the constraint:* It forces the distinction between "The Group" (an abstraction) and "The People" (the reality). It prevents the "Fairness" argument because it's not about rotating the burden (yet). It's about whether the burden *matters* if the total is up.

      *   *Wait, one major risk:* The "Fairness" slide. "Well, if we rotate who eats the lemon, it's fine."
      *   *Counter-measure:* We must explicitly block rotation in the first pass. Or, make the cost *non-transferable* in a way that highlights the separateness.
      *   *Better approach:* Don't ask for consent. Assign the cost by lottery *after* the utility calculation is announced. "The math says this is the optimal outcome. Who will be the node?"
      *   *Actually, best approach:* **The "Consent vs. Calculation" Tension.**
      *   Let's go with a mechanic where the group *votes* on whether to accept the Utilitarian Logic for the session.
      *   *No, that's too meta.*
      *   *Let's stick to the "Facilitator as Algorithm" model.* It creates the clearest antagonist. The Facilitator isn't a tyrant; they are a *servant of the Sum*. This is crucial. "I'm not hurting you, the Math is."

  4.  **Addressing the Specific Constraints:**

      *   *Stakes:* Lemon juice (sour) vs. Chocolate (sweet). Reversible, trivial, visceral.
      *   *The Trap (Volunteering):* If someone volunteers, the session becomes about virtue. *Fix:* Do not ask for volunteers. Use a random draw (straws) to assign the cost *after* the benefit is established. This removes agency from the sufferer, highlighting that Utilitarianism doesn't care about consent, only outcomes.
      *   *The Trap (Nobody does it):* If the cost is too high, people revolt. *Fix:* Keep cost trivial (sour taste). If they revolt, that *is* the data point. "Why revolt if the total went up?"
      *   *Fallback:* Paper version. Writing down "Pain Points" vs "Pleasure Points."
      *   *Debrief:* Map the "Group Score" to the "Super-Person." Map the "Sour Mouth" to the "Distinct Life."
      *   *Limitations:* The exercise shows the *intuition* of separateness. It doesn't prove Utilitarianism is false (maybe rights are rules of thumb). The facilitator must admit this.

  5.  **Drafting the Plan (Iterative refinement):**

      *   *Title:* "The Sum and The Singular."
      *   *Time:* 75 mins.
      *   *Structure:*
          1.  Setup (10 mins): Establish the "Group Mind" fiction.
          2.  Round 1 (15 mins): The Easy Win (Everyone gains).
          3.  Round 2 (20 mins): The Trade-off (One loses, many gain). **Crucial Moment.**
          4.  Discussion (20 mins): The Collision.
          5.  Reveal (10 mins): Naming the concepts.
      *   *Addressing the "Fairness" Slide:* I need to make sure the discussion doesn't just settle on "Let's take turns." I need to press: "Even if we take turns, *in the moment*, you are still just a vessel for the total. Does that matter?"
      *   *Facilitator Persona:* Benevolent Accountant. Not mean, just committed to the Sum. "I'm sorry, but the numbers work."

  6.  **Critiquing the Plan (Self-Correction):**
      *   *Risk:* The "Benevolent Accountant" might just seem like a jerk.
      *   *Fix:* Emphasize that the Facilitator *wants* everyone to be happy, but is bound by the rules of the game (Utilitarianism).
      *   *Risk:* The "Fairness" slide is inevitable.
      *   *Fix:* Don't fight it. Use it. "Okay, we rotate. So now we treat the 18 of you as 18 time-slices of one person? Is that the same as one person eating 18 lemons?" (Nozick's point).
      *   *Stakes:* Lemon juice is better than crackers (less choking hazard, more visceral).
      *   *Fallback:* Writing "Utility Units" on slips of paper. One person writes "-10", others write "+1". Sum is positive. But the "-10" person holds the paper.

  7.  **Finalizing the Design:**
      *   *Mechanic:* "The Utility Ledger."
      *   *Rejection:* I will explicitly reject the "Volunteer Sacrifice" model because it turns the sufferer into a hero, which validates the utilitarian calculus (sacrifice is good). We need the sufferer to feel *used*, not noble.
      *   *Rejection:* I will reject the "Voting" model because democracy isn't utilitarianism. Majority rule protects minorities sometimes; pure utilitarianism does not.
      *   *Selection:* The "Random Assignment based on Maximized Total" model.

  8.  **Writing the Response:**
      *   Tone: Professional, peer-to-peer, slightly cynical but constructive.
      *   Structure:
          1.  Framing Check (Is the brief sound?).
          2.  Rejected Mechanics (and why).
          3.  The Chosen Mechanic (The "Ledger").
          4.  Minute-by-Minute.
          5.  The Debrief (The "Collision").
          6.  Limitations & Facilitator Notes.

      *(Self-Correction during drafting)*: Make sure to emphasize the "Super-Person" analogy. The room isn't a collection of people; the game treats it as one organism. The friction is between the *Game's Reality* (One Organism) and the *Physical Reality* (18 Organisms).

      *Wait, one more thing:* The user asked about the "Volunteer" trap specifically. I need to be very clear: If someone volunteers, *stop them*. Or rather, design the game so volunteering isn't an option. The assignment must be external to will. Random selection is best.

      *Fallback:* The "Paper Pain" version.
      *Limitations:* The exercise creates an intuition pump, not a proof. Utilitarians have replies (rule utilitarianism, long-term trust). Acknowledge this.

      *Let's polish the "Fairness" avoidance.* The key is to ask: "If the total is higher, what *exactly* is the loss?" If they say "It's unfair," press: "Unfair to whom? The Group is happier." They must arrive at "Unfair to *Me*." Then press: "But You are part of the Group." The contradiction is the goal.

      *Okay, ready to write.*
answer: |-
  Here is the design. I am writing this as a colleague who has run too many of these sessions and watched them slide into "let's just be nice to each other" mush.

  ### 1. Framing Check: Is Your Brief Sound?

  Your framing is correct, but there is a specific philosophical nuance you need to hold in your head while facilitating, or the room will slip away from you.

  The "Separateness of Persons" objection (Rawls/Nozick) is not just that utilitarianism ignores boundaries; it is that utilitarianism extends a principle rational for *one* person (sacrifice present self for future gain) to *society* (sacrifice this person for that person's gain).
  *   **Intra-personal:** I endure the dentist now so *I* can eat later. This is rational because the sufferer and the beneficiary are the same entity.
  *   **Inter-personal:** You endure the dentist so *I* can eat later. This is the mistake.

  **The Design Goal:** You need the room to feel the difference between "We won" (the abstraction) and "I lost" (the reality). If they conclude "We should take turns so it's fair," they have missed the point. They have accepted the aggregation; they just want to distribute the risk. You need them to question the *authority of the aggregation itself*.

  ### 2. Rejected Mechanics (And Why They Fail)

  **Mechanic A: The Volunteer Sacrifice**
  *   *Setup:* "One person holds ice, everyone gets chocolate." Ask for a volunteer.
  *   *Rejection:* This turns the session into a test of altruism. If someone volunteers, the Utilitarian wins ("See? People are willing to sacrifice for the greater good!"). If no one volunteers, it becomes a story about selfishness. Neither outcome isolates the *structural* objection. It makes the cost about *character*, not *ontology*.

  **Mechanic B: The Majority Vote**
  *   *Setup:* "Vote on whether Person A should eat the cracker."
  *   *Rejection:* This tests democracy, not utilitarianism. A majority might protect a minority out of sympathy or long-term self-interest ("Don't hurt her, she might be useful later"). That's Rule Utilitarianism or Contractarianism. You want Act Utilitarianism's raw calculus. You need the decision to be *automatic* based on the sum, removing human sympathy from the equation.

  **Mechanic C: The Rotating Burden**
  *   *Setup:* "We'll all take a turn eating the cracker over time."
  *   *Rejection:* This is the "Fairness Trap" you identified. It concedes that the aggregation is valid, provided the risk is shared. It treats the group as a single person over time (18 time-slices of one life). While this *is* part of the objection, starting here lets them off the hook too easily.

  ### 3. The Chosen Mechanic: "The Utility Ledger"

  We are going to externalize the Utilitarian Calculus. You (the facilitator) are not a tyrant; you are a **Calculator**. You are bound by the rules of the game to maximize the score. The participants are **Nodes**.

  **Materials:**
  *   18 small cups of lemon juice (sour, visceral, harmless).
  *   18 pieces of good chocolate (sweet, desirable).
  *   18 pieces of *better* chocolate (larger/fancier).
  *   A whiteboard or large pad.
  *   A hat/bowl with 18 numbered slips.

  **The Stakes:**
  Trivial but sensory. Taste is immediate and non-transferable. I cannot taste the chocolate for you. This physicalizes the "separateness."

  **The Rules:**
  1.  **The Score:** The session has a "Total Utility Score."
  2.  **The Values:**
      *   Baseline (Nothing): 0 points.
      *   Standard Chocolate: +5 points per person.
      *   Premium Chocolate: +8 points per person.
      *   Lemon Juice: -20 points per person.
  3.  **The Mandate:** As the Calculator, you must choose the option that yields the highest Total Score for the room. You *cannot* choose based on fairness. You *must* choose based on the Sum.

  ---

  ### 4. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: The Setup (The Fiction)**
  *   **Say:** "For the next hour, this room is not 18 people. It is one single organism. I am not the facilitator; I am the Brain. You are the cells. My job is to maximize the organism's overall health score. Your job is to experience what the cells experience."
  *   **Do:** Write the Point Values on the board. Make it look clinical.
  *   **Say:** "I am not asking for your consent. I am following the math. If the math says the organism wins, we win."

  **00:10 – 00:25: Round 1 (The Control)**
  *   **Scenario:** Option A: Nothing happens. Option B: Everyone gets Standard Chocolate.
  *   **Calculation:** 0 vs (18 × 5 = 90).
  *   **Action:** Distribute Standard Chocolate. Everyone eats.
  *   **Say:** "Score is 90. We are thriving."
  *   **Purpose:** Establishes trust. The "Brain" is benevolent. The math aligns with individual interest.

  **00:25 – 00:45: Round 2 (The Collision)**
  *   **Scenario:** Option A: Everyone gets Standard Chocolate (+90). Option B: 17 people get Premium Chocolate, 1 person gets Lemon Juice.
  *   **Calculation:**
      *   Option A: 90 points.
      *   Option B: (17 × 8) + (-20) = 136 - 20 = 116 points.
  *   **The Move:** Option B is mathematically superior (116 > 90).
  *   **Action:**
      1.  Announce Option B is the rational choice.
      2.  Do **not** ask for a volunteer.
      3.  Draw a number from the hat. That person is the "Lemon Node."
      4.  Give the 17 the Premium Chocolate. Give the 1 the Lemon Juice.
      5.  **Crucial:** Make them consume it simultaneously.
  *   **Say:** "The Total Score is 116. We have improved the state of the organism by 26 points. This is a successful round."
  *   **Silence:** Let them chew. Let the Lemon person grimace. Do not apologize. Apologizing implies a moral mistake. You made a *calculation*.

  **00:45 – 01:05: The Debrief (The Collision)**
  *   **Prompt 1:** "Look at the board. The Score went up. Did we win?"
      *   *Expected:* Most will say "Yes, but..."
  *   **Prompt 2:** (Turn to the Lemon Person) "Did you win?"
      *   *Expected:* "No. It was sour. I lost."
  *   **Prompt 3:** "How can the Group win if a part of the Group lost? Is 'The Group' a thing that can taste chocolate?"
      *   *Goal:* Force them to admit the "Group" is a fiction. Only individuals taste.
  *   **Prompt 4:** "If I say 'The Total Happiness increased,' what actual thing am I describing? Where does that happiness live?"
      *   *Goal:* They should realize "Total Happiness" is just a number in your head, not a feeling in the room.
  *   **Prompt 5 (The Fairness Trap):** Someone will say, "It would be okay if we rotated."
      *   **Your Counter:** "If we rotate, does that change the experience of the lemon *in this moment*? Or does it just mean everyone gets a turn at being used? If I break your leg now, is it okay because I promise to break everyone else's leg next week?"

  **01:05 – 01:15: The Reveal (Naming the Ghost)**
  *   **Say:** "You just felt the 'Separateness of Persons' objection. Utilitarianism treats society like a single person making a sacrifice for a future gain. But society isn't a person. There is no 'Super-Tongue' that tastes the chocolate. There are only you."
  *   **Mention:** Rawls, Nozick. Briefly.
  *   **Close:** "The math was right. The feeling was wrong. Which one matters?"

  ---

  ### 5. Contingency Plans

  **Scenario A: The "Hero" Volunteer**
  *   *Risk:* Before you draw the number, someone says, "I'll do it, I don't mind lemon."
  *   *Response:* "Thank you, but the protocol requires random assignment to ensure the cost is assigned to the organism, not the will. Please draw a number."
  *   *Why:* You must prevent the cost from being framed as a *choice*. Utilitarianism often overrides consent. If they choose it, they validate the system.

  **Scenario B: The Revolt**
  *   *Risk:* The Lemon Person refuses to drink it. Or the group refuses to let you draw.
  *   *Response:* **Do not force them.** Stop the game.
  *   *Say:* "The calculation said this was the right thing to do. You stopped it. Why? The Score was higher."
  *   *Why:* This is actually *better* data. It proves that their intuition of rights/boundaries overrides the utility calculus. The session succeeds because the *resistance* is the point.

  **Scenario C: The "Fairness" Slide**
  *   *Risk:* The discussion immediately goes to "We should just raffle the chocolate every time."
  *   *Response:* "That solves distribution. It doesn't solve the aggregation. If I cut off your finger to save two of your fingers, that's rational. If I cut off *your* finger to save two of *his* fingers, why is that the same math? You are not him."

  ### 6. The Fallback: Paper & Pen (No Food/Drink)

  If the festival has strict health/safety rules:
  *   **Mechanic:** "Utility Slips."
  *   **Setup:** Everyone gets a notepad.
  *   **Round 2:** 17 people write "+8" on a slip. 1 person writes "-20".
  *   **Action:** Collect them in a box. Sum them aloud. "Total is 116."
  *   **Twist:** The person who wrote "-20" must stand up and hold their slip. The others sit.
  *   **Debrief:** "The number in the box is 116. The number in her hand is -20. Which one is real?"
  *   **Pros:** Safer, easier logistics.
  *   **Cons:** Less visceral. Taste is harder to ignore than a number. Use this only if forced.

  ### 7. Predictable Failures & Fixes

  **Failure 1: You become the Villain.**
  *   *Risk:* They hate *you*, not the *philosophy*.
  *   *Fix:* Maintain the "Benevolent Accountant" persona. Smile. Be regretful but firm. "I wish it were otherwise, but the Sum is the Sum." If they attack you, say: "I am just reading the numbers. Are you saying the numbers are wrong, or that they shouldn't rule us?"

  **Failure 2: The Utilitarian Defense (Diminishing Returns).**
  *   *Risk:* A smug pop-phil reader says, "But a sophisticated utilitarian knows that violating rights causes long-term anxiety, so the score would actually go down."
  *   *Fix:* "We are running a closed system. No long-term consequences. Just this room, this hour. In this vacuum, is the math right?" (Force them into the Ideal Utilitarian frame).

  **Failure 3: Nihilism.**
  *   *Risk:* "Nothing matters, it's just chocolate."
  *   *Fix:* Escalate the hypothetical. "If it wasn't lemon, but a week of unpaid labor? If it wasn't labor, but a broken arm? At what point does the 'Total Score' stop justifying the 'Individual Cost'?"

  ### 8. Limitations: What This Exercise Cannot Do

  Be honest in your magazine write-up. This exercise produces an **intuition**, not a **proof**.

  1.  **It cannot refute Rule Utilitarianism:** A utilitarian can argue, "We should have a rule against forcing lemon juice because that creates a stable society which maximizes utility long-term." Your exercise isolates Act Utilitarianism. You must acknowledge this in the final 5 minutes.
  2.  **It cannot prove Rights are Absolute:** It shows rights *feel* important. It doesn't prove they are metaphysically real.
  3.  **It relies on the "Negative" being visceral:** If the cost is too trivial, the aggregation seems fine. If the cost is too high, they revolt. You are walking a tightrope.

  **The "Collision" Metric:**
  You will know the session worked if, during the debrief, someone says something like: *"The total is just a number in your head. The pain is in my mouth. You're treating the number as more real than the pain."*
  If they say that, you have landed the plane.

  **Final Advice:**
  Do not use the projector. It creates a lecture dynamic. Stand in the middle. Hold the hat. Make eye contact with the person holding the lemon juice. When you ask "Did we win?", look at the group, then look at the individual. Make them bridge that gap themselves.
