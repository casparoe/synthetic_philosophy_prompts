  2.  **Deconstruct the Guest's Argument:**
      *   *Core Tension:* Popper famously called Darwinism a "metaphysical research programme" but later recanted/nuanced this. The guest is doubling down on a specific reconstruction.
      *   *The Split:* Universal Darwinism (bad/metaphysical) vs. Evo-Devo (good/scientific).
      *   *The Target:* Evolutionary Psychology (EP) is the villain here.
      *   *The Stakes:* Funding and institutional legitimacy, not truth per se (pragmatic focus).

  3.  **Drafting - Question by Question (Iterative Process):**

