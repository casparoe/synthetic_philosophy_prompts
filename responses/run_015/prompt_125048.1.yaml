prompt: |-
  I'm a PhD student in philosophy of science preparing to moderate a podcast interview with a scholar who defends a reconstructed Popperian thesis. Her view is that Darwinism, taken as a universal explanatory framework, remains a metaphysical research programme in Popper's sense—unfalsifiable because adaptive explanations can be adjusted post hoc—while only quantitative, predictive evolutionary developmental biology (evo-devo) meets Popper's criterion of genuine science. She further claims that evolutionary psychology exemplifies the unfalsifiable danger, and that this distinction should guide funding priorities rather than debates over creationism.

  Please draft eight to ten interview questions that do not ask her to restate Popper's standard position. Include: at least one pressing whether evo-devo's predictive successes genuinely vindicate Darwinian mechanisms or replace them with a distinct theoretical framework; at least one challenging her distinction between historical and predictive evolutionary explanation, especially given that both depend on shared-ancestry assumptions; at least one on the policy implication—whether evolutionary psychology should be defunded, reclassified, or subjected to stricter predictive standards—paired with the reply she is most likely to offer and a follow-up that undermines that reply; and at least one on whether her view collapses into a sociology-of-science claim about institutional norms rather than a philosophical claim about falsifiability. The questions should be substantive, anticipate standard defenses, and avoid generic biographical prompts.
