      *   *Question 3 (Historical vs. Predictive - Required):* The shared ancestry problem.
          *   *Draft:* Both use ancestry. Why is one scientific and one not?
          *   *Refinement:* Focus on the "post hoc" charge. Historical sciences reconstruct unique events. If evo-devo predicts morphological outcomes, does it escape the historical contingency that plagues standard evolutionary narratives?

      *   *Question 4 (Evolutionary Psychology - Policy/Reply/Follow-up - Required):* This needs a multi-part structure.
          *   *Part A:* Should we defund EP?
          *   *Anticipated Reply:* "No, just hold them to higher standards."
          *   *Follow-up:* "But if they can't meet those standards by definition (adaptive stories), isn't defunding the only logical outcome?"
