answer: |-
  # Seminar Game: The Ontology Audit

  **Time:** 90 Minutes
  **Class Size:** 13 Students (3 Boards of 4–5 students + 1 Instructor/Clerk)
  **Materials:** 6 Case Cards (printed), Whiteboard (for scoring), 3 Principle Sheets.

  ## 1. Setup (10 Minutes)

  Divide the class into three **Audit Boards**. Each board is assigned a metaphysical principle they *must* enforce, regardless of their personal intuition.

  *   **Board A (Contact-Only):** An object exists *if and only if* its parts are physically touching/continuous. No gaps allowed.
  *   **Board B (Functional Unity):** An object exists *if and only if* its parts are coordinated for a single purpose or activity. Touching doesn't matter; working together does.
  *   **Board C (Unrestricted):** An object exists for *any* collection of parts. If you can name the parts, the object exists.

  **The Stakes (Liability):**
  Write on the board: **"Liability Debt."**
  *   If a Board rules **"YES, this is one object"**: They inherit the object's liabilities (debts, damages, taxes). This is bad for their score.
  *   If a Board rules **"NO, these are just parts"**: They incur no liability. This is good for their score.
  *   **Consistency Rule:** If a ruling violates their assigned Principle, they lose massive points, even if they avoid liability.

  ## 2. Round 1: The Initial Audit (25 Minutes)

  Distribute the 6 Case Cards. Boards confer privately and render a binding verdict (YES/NO) for each case. They must record *why* based *only* on their Principle Sheet.

  **The Cases:**
  1.  **The Flash Mob:** 50 strangers gather in a square, dance in perfect unison for 3 minutes, then disperse forever. They never touch.
  2.  **The Drone Swarm:** 100 drones fly in formation to deliver a single package. They maintain 1-meter gaps. They disband after 12 minutes.
  3.  **The Ice Bridge:** 10 blocks of ice sit touching each other across a river. They bear weight together. They are melting separately.
  4.  **The Twin Spires:** Two remote-controlled towers stand 1 mile apart. Their lights blink in perfect sync. They never touch.
  5.  **The Pile of Bricks:** 500 bricks stacked randomly in a lot. Touching, but no function.
  6.  **The Human Body:** A standard living student. Cells touch and function together.

  **Scoring Round 1:**
  *   **+1 Point** for every verdict consistent with their Principle.
  *   **-2 Points** for every verdict inconsistent with their Principle.
  *   **-1 Point** for every "YES" verdict (Liability Debt).

  *Instructor Role:* Collect verdicts. Do not reveal the truth yet. Just tally consistency.

  ## 3. Round 2: The Appeal & Revelation (25 Minutes)

  This is the twist. You (the Instructor) act as the Court Clerk revealing **Hidden Evidence**. Boards can now appeal *other* Boards' verdicts if the new evidence breaks their Principle.

  **Reveal the Hidden Details:**
  *   **Flash Mob:** Reveal they were paid actors following a script (Function is artificial/external).
  *   **Drone Swarm:** Reveal one drone malfunctioned but the swarm compensated (Function is robust).
  *   **Ice Bridge:** **CRITICAL TWIST.** Reveal the blocks were never actually touching. They were suspended by invisible magnetic fields synced remotely. (Breaks Contact, keeps Function?).
  *   **Twin Spires:** Reveal they are synchronized by a third signal, not each other (No direct functional unity).
  *   **Pile of Bricks:** No change.
  *   **Human Body:** Reveal the student had a prosthetic limb integrated nervously (Is it a part?).

  **The Appeal Mechanic:**
  *   Board A can challenge Board B on the **Ice Bridge**. If Board B said "YES" (Function) but the sync was remote/external, Board A steals a point.
  *   Board B can challenge Board A on the **Drone Swarm**. If Board A said "NO" (No contact) but the function is undeniable, Board B argues for "Quasi-Object" status.
  *   Board C (Universalism) watches everyone else fail. They say "YES" to everything. They have maximum Liability Debt but perfect Consistency.

  **Scoring Round 2:**
  *   **+2 Points** for a successful Appeal (proving another Board broke their principle given new facts).
  *   **-1 Point** if your verdict flips from Round 1 (Instability Penalty).

  ## 4. Debrief & Mapping (30 Minutes)

  Bring the class back together. Erase the "Liability" scoreboard and focus on the disagreement.

  ### A. Map the Boards to Positions
  *   **Board A (Contact):** Maps to **Nihilism** or **Brutalism**. They struggle with the Ice Bridge and Drone Swarm. *Question:* Why do we treat a bridge as one thing if it's just magnets?
  *   **Board B (Function):** Maps to **van Inwagen (Life)** or **Merricks (Function)**. They struggle with the Flash Mob (is temporary function enough?) and the Twin Spires (is sync enough?). *Question:* When does coordination become composition?
  *   **Board C (Unrestricted):** Maps to **Universalism**. They had the easiest time logically but the highest "Liability." *Question:* Is it a problem that "The Object composed of the Moon and this Pen" exists?

  ### B. Predictable Failures (The "Common Sense" Leak)
  Point out where students likely cheated on their principles.
  *   **The Human Body:** Board A likely said YES (touching) but would have said NO if it were a corpse (loss of function). Did they smuggle Function into Contact?
  *   **The Ice Bridge:** Board A likely said NO once they heard "magnets," but in Round 1 they assumed contact. Did their intuition rely on *appearance* rather than *metaphysical fact*?
  *   **Liability Avoidance:** Did students vote "NO" on the Drone Swarm just to avoid debt, even though their Principle demanded "YES"? This mirrors the philosophical temptation to prefer Nihilism because it's ontologically "cheaper."

  ### C. The Gap: What the Game Missed
  This is crucial for your lecture transition. Tell them:
  *"This game tested **Actual Composition** based on spatial and functional facts. It did not test **Modal Composition**."*

  *   **The Missing Argument:** The game couldn't ask: *"Could the Ice Bridge have been made of wood?"* or *"If we removed one drone, would the Swarm still be the same object?"*
  *   **Why it Matters:** van Inwagen and Merricks care about **essential parts**. Universalism says parts are accidental. The game treated parts as static.
  *   **Lecture Hook:** "Next week, we aren't asking if the object *exists*. We are asking if it could have been *different*. That is where the real trouble begins."

  ## Instructor Cheat Sheet (Case Answers)

  | Case | Contact (A) | Function (B) | Universal (C) | The Trap |
  | :--- | :--- | :--- | :--- | :--- |
  | **Flash Mob** | NO (Gaps) | MAYBE (Temp function?) | YES | Is temporary coordination enough for existence? |
  | **Drone Swarm** | NO (Gaps) | YES (Unified goal) | YES | Functional unity without physical continuity. |
  | **Ice Bridge** | **TWIST:** NO (Magnets) | YES (Bears weight) | YES | Looks like contact, isn't. Breaks A's intuition. |
  | **Twin Spires** | NO (Distance) | NO (External sync) | YES | Correlation vs. Causation in composition. |
  | **Pile of Bricks** | YES (Touching) | NO (No goal) | YES | Contact without function (The Nihilist's nightmare). |
  | **Human Body** | YES (Touching) | YES (Life) | YES | The one case everyone agrees on (until Modal args). |

  ## Logistics Tips
  *   **Card Prep:** Print the 6 cases on heavy card stock. Put the "Hidden Detail" on the back or in a sealed envelope for Round 2.
  *   **Whiteboard:** Draw three columns (Board A, B, C). Keep a running tally of points to create competitive tension.
  *   **Timekeeping:** Be ruthless. 4 minutes per case in Round 1. If they linger, they lose Liability points.
  *   **The "Universalism" Problem:** Board C often feels like the "easy mode." Remind them that their Liability Debt will be astronomical. If you calculate debt as $1M per object, Board C is bankrupt. This simulates the ontological "parsimony" objection to Universalism.
