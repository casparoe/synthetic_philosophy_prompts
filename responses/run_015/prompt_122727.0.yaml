answer: |-
  There is no single monistic principle that perfectly captures all six verdicts without tension, primarily because your intuitions combine prioritarian, egalitarian, and contractualist constraints that often pull in opposite directions. However, the closest precise formulation is a **Pluralistic Ex Ante Prioritarianism with an Aggregation Constraint**.

  **The Principle**
  > Maximise the sum of concavely transformed welfare calculated over each individual's ex ante prospects, subject to a constraint that burdens may not be aggregated across distinct persons to override the claims of the fewer, while acknowledging equality as a distinct pro tanto value.

  **Motivation for Each Clause**
  *   **"Concavely transformed welfare"**: Motivated by **Case 1** and **Case 6**, this captures your desire to weigh benefits to the worse-off more heavily than equivalent benefits to the better-off, and to prefer smoothing within a life.
  *   **"Calculated over each individual's ex ante prospects"**: Motivated by **Case 5**, this ensures the principle evaluates the fairness of the gamble itself (equality of opportunity) rather than merely the final outcome, explaining your preference for the sure thing even at a slight welfare cost.
  *   **"Subject to a constraint that burdens may not be aggregated across distinct persons"**: Motivated by **Case 3**, this prevents the losses of Ana, Ben, and Cleo from being summed to justify imposing a loss on them for Dev's sake, distinguishing the 3-vs-1 scenario from the 1-vs-1 scenario in **Case 2**.
  *   **"Acknowledging equality as a distinct pro tanto value"**: Motivated by **Case 4**, this allows you to judge (990, 9) as better in one respect (equality) without contradicting the all-things-considered judgement that (1000, 10) is better (welfare).

  **Verdicts You Must Relinquish**
  You must give up the intuition in **Case 6** that "the arithmetic should [not] care whether the two levels belong to one person or two." While the principle matches your *verdict* (prefer smoothing), it fundamentally rejects your *reasoning*. The aggregation constraint explicitly treats the boundary between persons as morally significant; it permits smoothing within a life (where aggregation is unrestricted) but restricts transfers between lives (where aggregation is constrained). You cannot maintain that the arithmetic is identical across both cases while holding the principle that solves Case 3.

  **Prediction for the New Case**
  **Case:** Ana 100 alone versus Ana 100 together with Bo at 40.
  **Prediction:** The principle judges the second outcome (Ana 100, Bo 40) as **better all things considered**, but **worse in one respect**.
  **Reasoning:** Because the concave transformation is strictly increasing, adding Bo's welfare increases the total priority-weighted sum, satisfying the maximisation clause. However, because the second outcome introduces inequality where there was none, the "distinct pro tanto value" clause judges it as inferior regarding equality. This mirrors your response to Case 4: the welfare gain outweighs the equality loss overall, but the equality loss remains a genuine moral cost.
