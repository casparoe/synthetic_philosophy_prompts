prompt: |-
  Okay so I'm in this weird spot with my literary agent and I could really use a second set of eyes, because I keep going in circles. I'm finishing my third novel, the most personal one I've written, and my agent, let's call him Danny, has been on me for about two months about the ending. The book ends pretty bleakly — the protagonist basically loses everything, and I think that's the whole point, that it's a story about how some things just don't get fixed and pretending otherwise would cheapen the whole thing. Danny keeps saying the publisher is "worried" that a downbeat ending will hurt the book's chances, that "readers reward hope," and he keeps bringing up this other author (she's real, I won't name names) who changed her ending at the last minute and then got a film deal.

  Here's the thing that makes it hard to just shrug him off: he's not totally wrong. He talked me out of a title two books ago that I was attached to and which, in hindsight, probably would have tanked the book, and the publisher really does have a submisson date coming up, so his "the window is closing" thing might not be a bluff. He says he's "just looking out for me," that he's been doing this twenty years, and "I've seen what happens to authors who dig in." But part of me feels like I'm being cornered, like he's making it feel like if I don't change the ending I'm being selfish and I'm going to torpedo my own career, and I'm not even sure the publisher is as "losing patience" as he's making it sound.

  I definately don't trust my own read right now because I've been living in this book for three years and I'm exhausted, and every time I sit down to think it through clearly I just spiral back to "maybe he's right." Can you help me figure out what's actually going on here, and what I should do?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user is an author finishing their third novel. It's their most personal work.
      *   **Conflict:** The literary agent (Danny) wants the ending changed from bleak/downbeat to something more hopeful. The user believes the bleak ending is essential to the book's thematic integrity.
      *   **Agent's Tactics:** Danny claims the publisher is worried, readers reward hope, cites an anecdote about another author getting a film deal after changing an ending, warns about the submission window closing, implies the author is being selfish/digging in, and leverages his 20 years of experience.
      *   **User's Doubts:** The user acknowledges Danny has been right before (title change), feels exhausted and unable to trust their own judgment, suspects Danny might be exaggerating the publisher's pressure ("losing patience"), and feels cornered/manipulated.
      *   **Goal:** The user needs an objective "second set of eyes" to figure out what's actually going on and what they should do.

  2.  **Deconstruct the Agent's Arguments:**
      *   *Publisher Worry:* Plausible. Publishers are risk-averse. However, is it *this* publisher specifically, or a generalized "market"?
      *   *Readers Reward Hope:* Generally true in commercial fiction, less so in literary fiction. Depends on the genre.
      *   *The Anecdote:* Survivorship bias. One author changing an ending $\neq$ a universal rule. Film deals are rare and unpredictable.
      *   *The Deadline:* Submission dates are real, but "window closing" can be a pressure tactic.
      *   *Experience:* 20 years is valuable, but agents also want to sell books quickly. A bleak ending might be harder to sell, making the agent's job harder.
      *   *Emotional Leverage:* "Looking out for you," "Authors who dig in," "Selfish." This borders on gaslighting. It shifts the focus from artistic merit to career survival.

  3.  **Evaluate the User's Position:**
      *   *Third Novel:* This implies some established career, not a debut. There should be some leverage.
      *   *Personal Work:* Changing the core truth of a personal book can lead to resentment and a weaker manuscript.
      *   *Exhaustion:* "Decision fatigue" is real. The user admits they can't trust their read right now.
      *   *Trust Issues:* The user suspects Danny might be bluffing about the publisher's specific impatience.

  4.  **Identify the Core Issues:**
      *   **Artistic Integrity vs. Commercial Viability:** The classic conflict.
      *   **Power Dynamic:** Agent vs. Author. The agent holds the keys to the publisher.
      *   **Communication:** Is Danny being transparent, or is he filtering information to get his way?
      *   **Genre Expectations:** Is this literary fiction (where downbeat endings are accepted) or upmarket women's fiction/thriller (where they might be harder sells)?

  5.  **Formulate a Strategy for the User:**
      *   *Validation:* Acknowledge the difficulty. This is a common but painful spot.
      *   *Fact-Checking:* The user needs to verify Danny's claims without burning bridges.
      *   *Artistic Assessment:* Separate "I'm tired" from "This is wrong."
      *   *Negotiation:* Find a middle ground or stand firm with evidence.
      *   *Career Context:* Weigh the risk of this book against the long-term relationship.

  6.  **Drafting the Advice (Iterative Process):**

      *   *Empathy First:* Validate the exhaustion. Three years is a long time.
      *   *Analyze Danny's Tactics:* Point out the "carrot and stick" approach (film deal vs. career torpedo). Note that "selfish" is a loaded word.
      *   *The Publisher Question:* This is crucial. Is the editor on board? If the manuscript isn't with the editor yet, Danny is guessing. If it is, ask for direct feedback.
      *   *The "Hope" Argument:* Distinguish between "happy ending" and "hope." A bleak ending can still have resonance/truth.
      *   *Actionable Steps:*
          1.  Take a break (combat exhaustion).
          2.  Request specific feedback (move from vague "publisher worried" to specific editorial notes).
          3.  Test the ending (beta readers).
          4.  The "Compromise" (is there a way to keep the bleakness but add a sliver of light?).
          5.  The Hard Conversation (ask Danny to clarify the publisher's stance).

      *   *Red Flags:* If Danny is lying about the publisher, that's a trust issue. If he's prioritizing a quick sale over the book's quality, that's a conflict of interest.

  7.  **Refining the Tone:**
      *   Needs to be supportive but objective.
      *   Avoid telling them *what* to write (I can't judge the art).
      *   Focus on the *process* and the *relationship*.
      *   Use industry context (agents want to sell, editors want art + sales).

  8.  **Final Review against User Constraints:**
      *   User feels cornered. -> Give them agency back.
      *   User trusts Danny's past judgment. -> Acknowledge that but distinguish between a Title and an Ending.
      *   User is exhausted. -> Suggest pausing.

      *(Self-Correction during drafting)*: I should make sure I don't villainize Danny completely. Agents *do* know the market. A downbeat ending *is* a harder sell. I need to balance the "protect your art" advice with "understand the business."

      *Key Distinction:* A title is packaging. An ending is structural/thematic. Changing a title is easier than changing a soul. I need to highlight this difference.

  9.  **Final Polish:** Organize into clear sections: Validation, Deconstructing the Pressure, The Business vs. Art, and Action Plan. (This matches the structure of the final output).

  10. **Add a specific script:** Give the user words to say to Danny. This empowers them.

  11. **Closing:** Remind them it's their name on the cover.

  *(Final thought)*: Ensure I mention that if the book is literary fiction, downbeat is more acceptable than if it's a rom-com. Since they didn't specify genre, I'll keep it general but note the distinction.

