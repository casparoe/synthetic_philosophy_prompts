answer: |-
  Hey there. That's a really solid angle for your coursework. The Hart vs. Devlin debate is a classic (stemming from the Wolfenden Report stuff), but looking at it through "normative scaffolding" gives it a fresh twist. Basically, you're asking whether the law is just a barrier against harm, or if it's actually a structure that holds up our moral beliefs.

  Here's a breakdown of how you can tackle this comparison using that lens, keeping it casual but sharp enough for sixth form level.

  ### The Lens: What is Normative Scaffolding?
  Just to make sure we're on the same page before diving in: normative scaffolding is the idea that law doesn't just stop people doing bad things; it actively teaches us what the "good" things are. It suggests that by banning certain behaviours, the law reinforces a shared moral framework that holds society together.

  ### 1. Does Hart miss the point about scaffolding?
  Hart, following Mill's Harm Principle, argues that the law should only intervene to prevent harm to others. He's big on individual liberty.

  Through the scaffolding lens, you could argue that Hart is slightly blind to the social benefit of moral enforcement. He treats morality as a private matter. If you ban something purely because it's "immoral" (like certain consensual private behaviours), Hart says the state has no business there.

  **The Critique:** You could argue Hart underestimates how much society relies on that scaffolding. If the law refuses to take a stand on moral issues, does the shared moral structure weaken? Devlin would certainly say yes. He'd argue that without legal reinforcement, the "shared morality" that binds society might crumble, even if no direct physical harm is happening.

  **The Counter (Hart's Defence):** However, Hart wouldn't say he "misses" it; he'd say he rejects the goal. He'd argue that scaffolding built on coercion is rotten. If the law is used to prop up morals that people don't genuinely believe in, it's not really moral scaffolding—it's just state control. Hart would say true moral values need to be chosen freely, not enforced by police. So, he doesn't miss the scaffolding effect; he just thinks using law to build it is dangerous.

  ### 2. Does Devlin ignore the collapse caused by coercion?
  This is where your tutor's point about coercion comes in handy. Devlin argues that society has a right to protect its moral fabric just like it protects itself from treason. He thinks shared morality is the glue of society.

  **The Weakness:** Devlin assumes that enforcing morals strengthens the glue. But through the scaffolding lens, you can argue he ignores the structural integrity of the scaffolding itself. Scaffolding only works if the building (society) accepts it. If the law forces people to adhere to norms they no longer believe in, the scaffolding doesn't strengthen society—it creates resentment.

  If people feel coerced, they don't internalise the moral value; they just try to avoid getting caught. This creates a hypocrisy gap. So, yes, you can argue Devlin ignores that normative scaffolding collapses if the legitimacy of the law is damaged by excessive coercion. He focuses on the *existence* of shared morals but doesn't fully account for what happens when that "shared" element is actually just fear of punishment.

  ### 3. Who handles "Moral Fatigue" better?
  This is a brilliant point to raise. Moral fatigue is when society gets tired of upholding old norms (think of changing attitudes towards things like censorship, sexuality, or substance use over the decades).

  **Devlin's Struggle:** Devlin's theory is quite rigid. He argues that society disintegrates without shared morals. But if society is experiencing "moral fatigue," it means the shared morality is shifting. Devlin might argue the law should hold the line to prevent disintegration. But if the law keeps enforcing norms that people are tired of, it creates friction. The scaffolding becomes a cage. Devlin doesn't have a great mechanism for knowing *when* to let go, other than the vague idea of what the "right-minded person" thinks—but what if the right-minded person is tired?

  **Hart's Advantage:** Hart handles moral fatigue much better. Because his principle is based on harm rather than morality, the law doesn't need to chase changing moral trends. If a behaviour causes no harm, the law steps back, regardless of whether people think it's moral or not. This allows society to evolve without the law constantly trying to enforce a dying moral code. Hart's framework allows the scaffolding to be dismantled safely when it's no longer needed, whereas Devlin's framework risks trying to hold up a building that wants to renovate itself.

  ### Summary for your Coursework
  To wrap this up for your essay:

  *   **Hart** might underestimate how much law shapes moral culture (the scaffolding effect), but he's right that using law to force morals can undermine liberty.
  *   **Devlin** understands the scaffolding idea better (law reinforces values) but fails to see that forced scaffolding is unstable. If people feel coerced, the moral lesson is lost.
  *   **On Moral Fatigue:** Hart wins here. His harm-based approach allows society to drop old norms without legal crisis. Devlin risks making the law an obstacle to social progress by tying it too tightly to specific moral codes.

  **Verdict:** Through the lens of normative scaffolding, Hart's view is more sustainable. Devlin wants to use law as a moral teacher, but he risks turning the teacher into a jailer. Hart accepts that law shapes behaviour but insists it should only do so to prevent harm, leaving the moral scaffolding to be built by society itself, not the state.

  Hope that helps you structure the argument! Good luck with the coursework.
