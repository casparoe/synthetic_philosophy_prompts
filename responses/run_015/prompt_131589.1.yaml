prompt: |-
  I write novels — four out, fifth in copyedits — and at a dinner party last week I got into an argument with a friend of my husband's who does philosophy, and it's been rattling around my head ever since. He was arguing for the view that moral judgement has to depend on general principles, against the thing I'd have said I already believed: that there aren't really moral rules, because whether a feature of a situation counts in favour of an act depends on the rest of the situation, so the very same feature that's a reason one way in one case can be no reason at all, or a reason the other way, in another. He mentioned some names for all this that I've since forgotton. I believe the same thing about writing, which is maybe my whole problem.

  His argument, as near as I can reconstruct it:

  (1) People really do learn to judge new cases correctly. I can read a scene in a manuscript I've never seen and tell that it isn't working, and I aquired that by reading a lot of scenes and being corrected by editors. Likewise you can watch a kid learn that it's mean to exclude somebody from a game and then watch her apply it to a situation nothing like the one she learned it in.

  (2) If you get new cases right, it can't be luck. The new case has to be like the old ones in the respects that mattered, and your judgement has to be keyed to those respects.

  (3) But "the respects that matter" just is a general principle — something of the form: any case with features F is to be judged thus-and-so. If nothing general connects the old cases to the new one, then the old ones gave you no guidance at all and you were guessing and happened to be right.

  (4) So anyone who has the ability in (1) must have picked up general principles. Maybe ones they can't state, but principles all the same, because that's the difference between having learned something and having just been drilled.

  (5) Morality is no different in structure from craft. Someone who reliably judges that an act was cruel, or disloyal, or a betrayal, in situations she's never met before, has picked up general principles about cruelty, disloyalty, betrayal.

  (6) So my original view is false. There are moral principles, at least tacit ones, and the idea that reasons can flip valence from case to case with nothing general holding them together is incoherent.

  (7) At which point I said — and I thought I'd scored a hit, but he didn't look worried — that the exact same argument runs on craft. If (1) through (4) are right, then a line cook who knows by the sound when a sauce is about to break, a jazz bassist, me editing a paragraph: all of us are following tacit rules that could in principle be written down in advance, and if we can't produce them it's only because we haven't tried hard enough. Which is nuts. I've spent twenty years trying to write down what makes a scene work and what I actually have is a folder of examples and a shrug.

  (8) He says (7) is just the price of denying (6): if I want to say craft is real knowledge without rules, I have to say the same about morality, and then I owe everybody an account of how anyone learns it, or argues about it, or gets corrected, or improves.

  Every step from (1) to (4) looks like a truism to me and (5) looks fine, and yet (6) and (7) together are something I can't swallow. I keep going back and forth between thinking (3) is a bit of a scam and thinking (5) is where the sleight of hand is, and I can't settle it. If I have to choose I'd rather keep (1) and (7) than (6). So: which step do you give up, why did it look like a truism when it isn't, and what does giving it up actually cost me — does it commit me to saying I can never really explain to a student why her scene fails, or that two people disagreeing about something moral have nothing to reason with? I want to know what I'm paying, not just which line to cross out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** A novelist (4 published, 1 in copyedits). She thinks deeply about craft. She values nuance, context, and particularity in both ethics and writing.
      *   **The Conflict:** A dinner party argument with a philosopher friend.
      *   **The Philosopher's Argument (Generalism):** Moral judgment (like craft judgment) requires general principles. If you can judge new cases correctly based on old ones, there *must* be a general rule connecting them, even if tacit.
      *   **The User's Intuition (Particularism):** Moral reasons (and craft reasons) are holistic/context-dependent. A feature that is good in one case (e.g., surprise) might be bad in another. There are no strict rules.
      *   **The Impasse:** The user feels steps (1)-(4) are truisms, but (6) and (7) are unacceptable. She suspects (3) or (5) but can't pinpoint why. She wants to know *which step to reject*, *why it seemed true*, and *what the cost is* (can she still teach? argue?).

  2.  **Deconstruct the Philosopher's Argument:**
      *   (1) Learning happens (transfer of judgment). *Hard to deny.*
      *   (2) It's not luck; there must be relevant similarities. *Hard to deny.*
      *   (3) "Relevant similarities" = General Principles (Universalizable rules). *This is the crux.*
      *   (4) Therefore, learners possess tacit principles.
      *   (5) Morality = Craft in structure.
      *   (6) Therefore, Moral Particularism is false.
      *   (7) Therefore, Craft Particularism is false (rules exist for writing/cooking too).
      *   (8) If you deny (6), you must deny craft knowledge is real (or explain it without rules).

  3.  **Identify the Philosophical Landscape:**
      *   This is a classic debate: **Moral Generalism vs. Moral Particularism.**
      *   Key names the user forgot: Jonathan Dancy (Particularism), R.M. Hare (Prescriptivism/Generalism), maybe Kant (Generalism), maybe Aristotle (Phronesis/Practical Wisdom - often cited by particularists).
      *   In Aesthetics/Craft: Frank Sibley (Aesthetic Concepts), maybe Polanyi (Tacit Knowledge).
      *   The specific argument structure resembles the "Argument from Learning" or "Argument from Supervenience."

  4.  **Evaluate the Steps for Weakness:**
      *   *Step (3) is the weak link.* It equates "recognizing a pattern" with "following a rule/principle."
      *   *Step (5) is also vulnerable.* It assumes morality and craft are structurally identical in a way that demands codifiability.
      *   *Step (4)* assumes tacit knowledge must be propositional (rule-based).

  5.  **Formulate the Counter-Argument (The "Particularist" Defense):**
      *   **The Attack on (3):** The move from "there are similarities" to "there is a *principle*" is a category error. A principle implies a *codifiable condition* (If F, then Good). Particularism argues that the *valence* of F changes. F might be good here because of context C, but bad in context D. The "principle" would have to be infinitely complex ("If F and C and not-D and not-E..."). At that point, it's not a principle; it's just a description of the specific case.
      *   **The Nature of "Tacit Knowledge":** Polanyi's "We know more than we can tell." A bike rider balances without knowing the physics equations. A writer knows a scene works without a rule. This is *know-how* (procedural), not *know-that* (propositional). The philosopher is conflating the two.
      *   **The Cost:** Does rejecting (3) mean we can't teach? No. We teach via *examples*, *analogy*, and *calibration*, not via algorithms. We say "Look at this," not "Apply Rule X."

  6.  **Drafting the Response:**
      *   **Tone:** Respectful, intellectual, empathetic to the writer's perspective. Acknowledge her expertise.
      *   **Identify the Names:** Jonathan Dancy is the big one for Moral Particularism. Maybe mention Wittgenstein (family resemblances) or Polanyi (tacit knowledge).
      *   **Pinpoint the Flaw:** Focus on Step (3). This is the "Principle of Universalizability" trap.
      *   **Explain Why (3) Looks True:** It appeals to our desire for rationality and explanation. We want to believe there's a "why" that can be spoken.
      *   **Explain Why (3) is False:** The "Holism of Reasons." A feature isn't a reason in isolation. It functions within a gestalt.
      *   **Address the Cost (Teaching/Arguing):** This is crucial for the user. If there are no rules, how do we teach?
          *   Answer: Mentorship, examples, "eye" training. Like art school, not math class.
          *   Argument: We argue about *perception* and *weight*, not rule application. "You're missing the nuance here," not "You violated clause 4b."
      *   **Address Step (5) (Craft vs. Morality):** The philosopher uses this to trap her. She should embrace the trap. Craft *doesn't* run on rules either. The philosopher thinks this is *reductio ad absurdum*; the writer knows it's the truth.
      *   **Conclusion:** Reassure her that her intuition (1 & 7) is the stronger philosophical position (Particularism), despite the philosopher's confidence.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, don't just say (3) is wrong.* Explain *why* the philosopher thinks it's right. It's the idea of "supervenience." If two cases are identical in all natural properties, they must be identical in moral value. The particularist agrees with this but denies that this implies a *finite set of predictive principles*.
      *   *Make sure to address the "Tacit" claim.* The philosopher says "Maybe ones they can't state." The counter is: If they can't be stated even in principle (because the exceptions are infinite), they aren't principles. They are just descriptions of outcomes.
      *   *The "Cost":* Be honest. It makes justification harder. You can't just point to a rulebook. You have to persuade someone to *see* what you see. This is harder work, but it's the work of a novelist.

  8.  **Final Polish:** Check the voice. Ensure it sounds like a conversation between intellectuals, not a lecture. Use the writer's metaphors (scenes, sauce, jazz).

      *(Self-Correction on Names)*: The user forgot the names. I should provide them. Jonathan Dancy (*Ethics Without Principles*). Also, the "Generalism vs. Particularism" debate. In aesthetics, Frank Sibley. In epistemology, Michael Polanyi.

      *(Structure of Response)*:
      1. Validate her intuition (she's in good company).
      2. Identify the specific step to cut (Step 3).
      3. Explain the "Holism of Reasons."
      4. Address the "Tacit Rule" defense.
      5. Discuss the Cost (Teaching/Argument).
      6. Turn the table on the Philosopher (Craft is the model, not Morality).

  9.  **Final Review against constraints:** The user asked: "Which step do you give up, why did it look like a truism when it isn't, and what does giving it up actually cost me?" I need to answer these three specific questions clearly.

      *   *Step:* (3).
      *   *Why truism:* Confusion between "pattern" and "law."
      *   *Cost:* Teaching becomes mentorship/exemplar-based; argument becomes persuasion of perception rather than logic-checking.

