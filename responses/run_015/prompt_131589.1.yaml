answer: |-
  You are standing in the middle of one of the most robust debates in modern moral philosophy, and your instincts are sharper than your friend's. The position you are describing is called **Moral Particularism**, and the name you've forgotten is almost certainly **Jonathan Dancy** (specifically his book *Ethics Without Principles*). The philosopher friend is arguing for **Moral Generalism**.

  You asked which step to give up, why it looks like a truism, and what the cost is.

  ### The Step to Give Up: (3)

  > (3) But "the respects that matter" just is a general principle — something of the form: any case with features F is to be judged thus-and-so.

  This is the linchpin. It is the move from "there is a pattern" to "there is a law."

  **Why it looks like a truism:**
  It relies on a seductive picture of how explanation works. We tend to think that if $A$ resembles $B$, and we judge them the same way, there must be some *finite list of features* ($F_1, F_2, F_3$) that constitutes the "essence" of the judgment. It feels like rationality demands codifiability. If I can't write it down, even in principle, did I really *know* it? The philosopher assumes that "knowledge" implies "propositional content" (facts/rules) rather than "procedural capacity" (skills/abilities).

  **Why it isn't true:**
  It commits a category error between a **pattern** and a **principle**.
  A principle implies that the feature $F$ carries a specific valence (good/bad) *independently* of context, or at least within a specifiable context. Particularism argues for the **Holism of Reasons**.

  In your writing: "Surprise" is a virtue in a thriller twist. "Surprise" is a vice in a character's motivation (if it comes out of nowhere). "Surprise" is irrelevant in a description of a landscape.
  The feature "surprise" does not have a stable valence. Therefore, you cannot write a principle that says "Include surprise." The principle would have to be: "Include surprise, unless it undermines character consistency, unless it's a dream sequence, unless..."

  At a certain point of complexity, the "principle" becomes as complex as the universe itself. It ceases to be a guide and becomes merely a description of the outcome. As Dancy argues, if the exception to the rule is not specifiable in advance, it isn't a rule; it's a retrospective label.

  Your friend argues in (4) that these principles can be **tacit**. This is the escape hatch. He says, "You follow the rule, you just can't say it."
  But if the rule is infinitely complex (because the context changes the valence of every feature), then saying it is "tacit" is empty. It's like saying a leaf falling from a tree is following a tacit equation of fluid dynamics. The leaf isn't calculating; it's reacting to the whole environment. You aren't applying a tacit rule; you are exercising a **capacity**.

  ### The Cost: What do you pay for rejecting (3)?

  You are worried that rejecting (3) means you can't teach, can't argue, and can't explain. This is the philosopher's threat in step (8). Here is the actual bill:

  **1. You cannot teach via algorithms; you must teach via calibration.**
  If there are no rules, you cannot give a student a checklist ("Ensure every scene has conflict"). You already know this. When you edit, you don't say "Violates Rule 4." You say, "This feels unearned," or "The rhythm is off here."
  *The Cost:* Teaching becomes harder and more relational. It requires mentorship, not lecturing. You have to train their *perception*, not their logic. You have to show them examples (case law, not statute law).
  *The Benefit:* It explains why "rule books" on writing (like *Save the Cat*) often produce sterile work. They try to codify what is uncodifiable.

  **2. Moral/Craft argument becomes about "Seeing," not "Deriving."**
  If your friend says, "Lying is wrong (Principle)," and you say, "Not if it saves a life (Context)," he thinks you are being inconsistent. You know you are being attentive.
  *The Cost:* You lose the ability to end an argument by pointing to a rule. You can't say, "I win because I followed the principle." You have to persuade the other person to *see* the situation the way you do. You have to say, "Look at the nuance here. Don't you see that in *this* light, the betrayal is actually an act of loyalty?"
  *The Benefit:* This is exactly what novels *do*. Novels don't argue via syllogisms; they argue by training the reader's moral perception through particular cases. If your friend were right, novels would be unnecessary; we could just read ethics textbooks. The fact that we need stories to understand morality suggests you are right.

  **3. You accept that "Justification" is finite.**
  In a rule-based system, justification goes back to the axiom. In a particularist system, justification stops at "This is simply what I see."
  *The Cost:* It can feel vulnerable. "Because it's wrong" or "Because it doesn't work" is the bedrock.
  *The Benefit:* It aligns with reality. When a line cook knows the sauce is breaking, she doesn't consult a principle. She smells it. If you ask her why, she says, "Because it smells like that." If you don't smell it, she can't prove it to you with logic. She can only make you smell it.

  ### The Trap in Step (5) and (7)

  Your friend thinks Step (7) is a *reductio ad absurdum*. He thinks: *"If you say morality has no rules, you must say cooking has no rules. But cooking is real knowledge. So you're stuck."*

  He intends this to shame you into accepting moral rules.
  **You should embrace it.**

  Step (7) is not a problem; it is the truth. A jazz bassist is not following tacit rules of harmony that could be written down. If they could be written down, a computer could play jazz. A line cook is not following a tacit algorithm of heat and viscosity. If they were, we would have robots in the kitchen.

  The philosopher assumes that **Knowledge = Rules**.
  The artist knows that **Knowledge = Sensitivity**.

  By rejecting (3), you are not saying "anything goes." You are saying that the "law" governing the judgment is not a *pre-existing formula*, but a *responsive engagement* with the particulars.

  ### Summary

  *   **Cut Step (3).** It confuses "recognizing a similarity" with "applying a universal law."
  *   **The Illusion:** It looks true because we crave the security of codification. We want to believe that expertise is a compressed file of rules, rather than a rewired nervous system.
  *   **The Cost:** You lose the ability to demand obedience to rules. You gain the responsibility of cultivating perception (in yourself, your students, your readers). You cannot prove you are right by citing a statute; you must prove you are right by making the other person *see* what you see.

  Your friend thinks he has trapped you between "Moral Chaos" and "Moral Law."
  You are actually standing in "Moral Craft."
  You don't need his principles. You have your scenes.
