answer: |-
  # THE PERSISTENCE SORTER
  **A Diagnostic Tree for Metaphysicians (and Those Who Love Them)**

  **Instructions:** Start at **Q1**. Answer in good faith based on how you think the world *is*, not how you think you're supposed to talk. Follow the arrows. If you hit a "Dead End," check Side 2 to see why your combination is empty.

  ***

  ### Q1: The Hot Poker vs. The Changing Banana
  A poker is hot at one end and cold at the other. Nobody thinks this is a contradiction, because the *parts* of the poker have different temperatures.
  A banana is green on Monday and yellow on Friday. Nothing can be green-all-over and yellow-all-over.
  **Do you solve the banana problem the same way you solve the poker problem?**

  *   **YES:** You think the banana has a "Monday-part" that is green and a "Friday-part" that is yellow. Time is metaphysically like space. **(Go to Q2)**
  *   **NO:** You think the *whole* banana is present on Monday and the *whole* banana is present on Friday. Time is *not* like space. **(Go to Q3)**

  ---

  ### Q2: The Amoeba Split (For "YES" to Q1)
  An amoeba *A* divides into two offspring, *B* and *C*. Both are psychologically and physically continuous with *A*.
  **Is it *determinately true* that the original object *A* is identical to *B*?**

  *   **YES (or Determinately No):** You believe identity is a strict, one-to-one relation. The object is a "worm" extending through time. If *A* is *B*, it cannot be *C*. (Usually, you say *A* ceases to exist or survives as only one branch). **(Leaf: Worm Theory)**
  *   **NO (It's indeterminate / Category mistake):** You think talk of "survival" across the split is loose talk. Strictly speaking, *A* is a momentary stage. *B* and *C* are later stages that are *counterparts* of *A*, not identical to it. **(Leaf: Stage Theory)**
      *   *Note: If you struggle here, see Side 2 under "The Worm/Stage Blur."*

  ---

  ### Q3: The Property Check (For "NO" to Q1)
  You believe the whole banana exists on Monday and Friday. But how does it avoid the contradiction of being green and yellow?
  **Is "being green on Monday" a *different property* than "being green on Friday"?**

  *   **YES:** Properties are time-indexed relations (e.g., *Green-at-t*). The banana has the property *Green-at-Monday* and lacks *Green-at-Friday*. **(Leaf: Relativized Endurantism)**
  *   **NO:** The property is just *Greenness*. The "on Monday" part modifies *how* the banana has the property, not the property itself. It exemplifies greenness *Monday-ly*. **(Leaf: Adverbial Endurantism)**

  ---

  ### Q4: The Pew & The Fetus (Consistency Checks)
  *Answer these to refine your leaf, or find your Dead End.*

  **The Pew:** A Catholic sits in a pew. A lump of matter shaped exactly like a statue coincides with him. **Are there two things in the pew?**
  *   **Yes:** You accept Coincidence. (Compatible with most Endurantist leaves, tricky for some Worms).
  *   **No:** You deny Coincidence. (You must explain why the lump isn't a person).

  **The Fetus:** **"I was once a fetus"** and **"There was a fetus where I now stand."**
  *   **Are these equally good?**
      *   **Yes:** You lean **Worm/Stage**. (You are summing temporal parts).
      *   **No ("I was a fetus" is better):** You lean **Endurantist**. (You are the same substance).
      *   **No ("There was a fetus" is better):** You lean **Stage Theorist**. (You are a present stage; the fetus was a past stage).

  ***

  ## SIDE 2: THE LEAVES & THE GRAVEYARD

  ### THE LEAVES (Where you landed)

  **1. Worm Theory (Perdurantism)**
  *   **Commitment:** Objects are 4D spacetime worms. You are not *in* time; you stretch *across* it.
  *   **The Vibe:** "I was a fetus" is literally true because my temporal extent includes the fetal region.
  *   **The Cost:** You must deny that change is real for the whole object; only temporal parts change.

  **2. Stage Theory (Exdurantism)**
  *   **Commitment:** Objects are momentary slices. "Persistence" is just a causal relation between distinct stages.
  *   **The Vibe:** "I was a fetus" is loose talk. Strictly, a fetal-stage is a *counterpart* of this current stage.
  *   **The Cost:** You don't survive; your counterparts do. (Embarrassing at funerals).

  **3. Relativized Endurantism**
  *   **Commitment:** Objects are wholly present. Properties are relations to times.
  *   **The Vibe:** To be green is to stand in a relation to Monday.
  *   **The Cost:** Properties lose their intrinsic feel. "Greenness" is never had simpliciter.

  **4. Adverbial Endurantism**
  *   **Commitment:** Objects are wholly present. Times modify the *instantiation* of properties.
  *   **The Vibe:** The banana is just green, but it holds that greenness in a Monday-ish way.
  *   **The Cost:** "Monday-ly" is a mysterious metaphysical modifier.

  ---

  ### THE GRAVEYARD (Empty/Incoherent Combinations)

  **🚫 The "Spatial Endurantist"**
  *   **Combo:** Answered **YES** to Q1 (Time is like Space) but **NO** to Q2 (Denies Temporal Parts).
  *   **Why Empty:** If time is exactly like space, and objects have spatial parts, they must have temporal parts. Denying this is just verbal stubbornness.

  **🚫 The "Indeterminate Worm"**
  *   **Combo:** Worm Theory + Belief that Identity can be Indeterminate (e.g., in the Amoeba case, *A* is vaguely *B*).
  *   **Why Empty:** Worm theory relies on classical identity. If identity is vague, the "worm" has no clear boundaries, collapsing into Stage Theory or Nihilism.

  **🚫 The "Coinciding Stage Theorist"**
  *   **Combo:** Stage Theory + Accepts Coincidence in the Pew case (Two things, same place, same time).
  *   **Why Empty:** For a Stage Theorist, two things in the same place at the same time with the same parts are *one stage*. Coincidence requires distinct persistence conditions, which Stages don't have (they only exist for an instant).

  **⚠️ The Worm/Stage Blur**
  *   **Note:** If you found Q2 impossible, you aren't alone. Many argue Worm and Stage theories are empirically equivalent and differ only in semantics. If you think "I am a stage" and "I am a worm" are just different ways of counting the same ontology, you are a **Quinean Deflator**. Go have a drink.

  **⚠️ The "Fetus" Trap**
  *   **Warning:** If you are an Endurantist but prefer "There was a fetus where I stand" over "I was a fetus," you are likely smuggling Perdurantist intuitions into an Endurantist vocabulary. Check your Q1 answer.

  ***

  *Printed for the [Insert Group Name] Reading Group. Do not cite without permission from the facilitator.*
