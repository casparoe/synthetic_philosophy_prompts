      *   *A-tier:* Must explain the mechanism of control/flexibility well, bridging mechanism and capacity. -> **C** (Predictive Suppression). It explains *how* counterfactuals are managed.
      *   *B-tier:* Describes degrees of freedom but lacks the sharp normative cut or deep mechanistic insight into *why* it matters for agency. -> **B** (Graded Coupling).
      *   *C-tier:* Too simplistic, conflates variability with agency, fails counterfactual nuance. -> **A** (Binary Invariance).

      *Refining the Rank:*
      *   Is D really S-tier? Yes, because free will is fundamentally a normative concept (responsibility). Without norms, you just have complex mechanics.
      *   Is C better than B? Yes, C offers a specific mechanistic account of *why* flexibility fails (precision weighting suppressing counterfactuals), whereas B is just "locking strength." C explains the *capacity* for rationality better.
      *   Is A really C-tier? Yes, "negation of invariance" includes random noise. Randomness is not free will.

