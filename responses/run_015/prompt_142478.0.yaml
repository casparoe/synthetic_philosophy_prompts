      *   *Model B: Motivated Reasoning/Deflationary (Mele/Hume).* No simultaneous contradiction. It's a process of biasing evidence gathering. You don't believe $P$ and $\neg P$ at the same time; you steer yourself toward believing $P$ because it's comfortable.
      *   *User's Concept:* "Attentional Housekeeping." This aligns closely with Model B but adds a behavioral/environmental layer (arranging days, routines).

