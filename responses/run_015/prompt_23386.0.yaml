answer: |-
  The office smelled of brine and old toner. Mara sat at her desk in the Kettering Bay Arbitration Bureau, the harbor visible through the single pane of glass behind her monitor. The water was the color of slate, choppy under a gray sky. On her desk lay a claim file for the *MV Endurance*, a routine collision case, and a letter on heavy cream stock that did not belong in a municipal inbox.

  The claim was simple. A mooring line had snapped during a squall. The *Endurance* had drifted into a private dock, causing three thousand dollars in structural damage. The insurance policy was clear. Liability was established. Mara's job was to verify the paperwork and authorize the payout. It was a Tuesday task, the kind she could finish before lunch.

  The letter, however, complicated the geometry of the morning. It was from Arthur Vane, a retired ethicist who lived in the hills above the city. Mara knew the name; he had consulted on liability frameworks years ago, before withdrawing from public life. The handwriting was sharp, the ink dark.

  *Ms. Mara,* it began, without a surname. *You are preparing to authorize payment for claim number 8940. I write to inform you that executing this transaction renders you complicit in a distinct harm to a third party not present in your adjudication.*

  There was no anger in the tone, only a cold precision. Vane argued that the dock owner held a predatory lease agreement with a smaller subcontractor, a clause triggered only by insurance infusions of this specific magnitude. Paying the claim would activate a penalty clause that would bankrupt the subcontractor. Vane did not provide evidence Mara could verify—no leases, no bank records. He offered only a chain of moral causality that stretched beyond her sight. He claimed to have traced the ownership structures and the contractual dependencies over five years of study. He asked her to trust his conclusion without adopting his framework.

  *You need not understand the architecture of the harm,* Vane wrote. *You need only accept that it exists.*

  Mara read the letter three times. She looked at the claim file. The numbers were clean. The policy language was standard. If she denied the claim based on this letter, she would be in breach of her contract. She would be fired, or sued. If she approved it, she might be ruining a stranger's life based on the word of a man she had never met.

  The core of the discomfort was not the potential harm itself, but her authority to judge it. She was an adjuster, not a philosopher. She could assess damage to wood and fiberglass; she could not assess the moral weight of a contractual cascade. To accept Vane's judgment was to surrender her own agency to his expertise. To reject it was to assume she knew better than a man who had dedicated his life to such structures.

  She picked up the phone and dialed the number for Gary, a senior consultant in the regional office. He answered on the second ring.

  "Gary, it's Mara. I have a situation on the *Endurance* file."

  "Is the damage over the limit?"

  "No. Standard. But I received correspondence from Arthur Vane. He says paying the claim causes downstream harm to a third party. Contractual leverage."

  There was a pause, filled by the static of the line and the distant sound of Gary chewing something crisp. "Vane? Still alive?"

  "Apparently."

  "Look, Mara, Vane sees ghosts in the machine. He thinks everything is connected to everything. Does he have proof? Legal proof?"

  "No. He says the moral fact is independent of the legal proof. He says I should trust his assessment."

  "Then don't," Gary said. "You're not paid to be a moral agent. You're paid to be a procedural agent. If the policy says pay, you pay. If Vane wants to stop the payment, let him get an injunction. Don't carry his water for him."

  "But if he's right?"

  "Then he's right, and you're a clerk who followed orders. That's the job description."

  Mara thanked him and hung up. The receiver felt warm in her hand. Gary's advice was practical, but it sidestepped the weight settling in her chest. He treated her role as a hollow pipe through which money flowed. Vane treated her as a gatekeeper who must understand the landscape beyond the gate.

  She looked out the window. A ferry cut through the gray water, leaving a white wake that dissipated quickly. If she deferred to Vane, she was acting on moral testimony she could not verify. She would be doing the right thing for the wrong reasons, or perhaps the wrong thing for the right reasons. She would be outsourcing her conscience. If she ignored him, she was claiming a moral autonomy she did not possess. She would be acting confidently in ignorance.

  The deadline for the authorization was four o'clock. It was now two-thirty.

  Mara opened the digital claim form. The cursor blinked in the authorization field. She thought about Vane, sitting in his house in the hills, surrounded by papers and diagrams, convinced he had seen a truth that was invisible to her. He wanted her to be an extension of his will. He wanted her to act on faith.

  She thought about the subcontractor. A person who might lose their business because a rope snapped. She thought about the dock owner, who might be predatory, or might just be a person enforcing a contract they signed. She thought about herself, sitting in a room that smelled of salt, trying to keep the system running without breaking the people inside it.

  The problem was not the money. The problem was the transfer of responsibility. If she listened to Vane, she was saying that moral knowledge could be transferred like data. If she ignored him, she was saying that moral knowledge required personal verification. Neither position felt safe.

  She picked up her pen. It was a standard government issue, black plastic. She hovered it over the physical copy of the authorization form, though the digital entry was what mattered. The pen felt light, insignificant against the weight of the decision.

  If she signed, she could tell herself she was following procedure. If she didn't, she could tell herself she was preventing harm. Both explanations felt like lies. The truth was that she was choosing which expert to believe: the living system of insurance law, or the retired man in the hills. She was choosing which master to serve, without knowing if either master was good.

  She looked at Vane's letter again. *You need only accept that it exists.* It was a demand for surrender. It asked her to blindfold herself and walk where he pointed.

  Mara put the pen down. She opened the claim file and took out the letter. She smoothed the cream paper on her desk. She could file it with the claim, creating a record of her dissent. She could shred it, erasing the complication. She could mail it back.

  She opened the top drawer of her desk. It contained staplers, tape, and a stack of unused forms. She moved the forms aside. There was a small space in the corner, dark and empty.

  She placed Vane's letter in the drawer. She did not put it in the file. She did not put it in the shredder. She closed the drawer. The lock clicked softly.

  Then she turned back to the computer. The cursor was still blinking in the authorization field. The time was three-fifty. She placed her fingers on the keyboard. She did not type. She simply sat there, watching the cursor pulse, a steady rhythm of expectation in the quiet room, while the harbor outside turned darker under the coming rain.
