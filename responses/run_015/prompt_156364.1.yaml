prompt: |-
  I sit on the ethics and governance panel of a hospital trust that runs a clinical genomic testing service, and we are rewriting what patients get told. Three questions are live: whether to report variants of uncertain significance, whether to report findings for conditions the patient was not tested for, and whether a patient may file a standing instruction not to be told certain classes of result.

  One member of the panel closes almost every discussion with the same argument. Information, he says, is like a sharper photograph of a fixed scene. You can always squint, or blur the image, or look away, so a higher-resolution image cannot leave you worse at whatever task you were using it for; worse, in his view, only if you insist on looking at something you would have preferred not to see, which is your business and not the panel's. And this, he says, is exactly what the decision-theoretic result usually known as the value-of-information theorem says in its formal dress: for an agent who updates by conditionalisation and maximises expected utility, the expected value of an additional signal, assessed before the signal arrives, is never negative, and is strictly positive just in case the signal could change what the agent does in some state of the world. His conclusion is that release is at worst neutral, that withholding is a form of paternalism, and that the burden of argument always falls on suppression rather than on disclosure.

  I am not persuaded, but I cannot say exactly where the picture stops fitting, and I would rather not overrule him on instinct. Please audit the analogy.

  Give me the correspondence table first: what plays the part of the resolution, of the scene, of the camera, of the viewer, of the task the image is for, of squinting, and of the cost of taking the photograph. Then separate the disanalogies that matter for the use he is making of it from the ones that are merely decorative. I would like the following pressed specifically.

  Whether the squinting move is bearing more weight than the theorem gives it. The theorem lets the agent adopt any decision rule as a function of the signal, including a constant one; that is the formal counterpart of looking away. Say what has to be true for that option to be genuinely available — that ignoring costs nothing, that attention is not scarce, that the viewer can decline to attend and yet still know what he would have done without the image, that the viewer's preferences and competence are themselves unmoved by having seen it.

  Whether the ex ante framing is doing work he does not acknowledge, given that he is arguing for a policy applied to people one at a time and that a realised result can leave a particular patient worse off even when the prospect was non-negative in expectation.

  Whether the fixed scene holds. In the photograph case there is a state of the world the image resolves more or less finely, and more resolution is a refinement. In our case the report is evidence about a laboratory's current opinion, the meaning of which is revised over years; a variant of uncertain significance may be reclassified long after it is filed. Say whether that is a refinement of the same scene at all, and what follows if it is not.

  Whether the single-viewer assumption is doing the heaviest work of all. A photograph is looked at by one person and changes nothing else. A result enters a record that clinicians, relatives, insurers and employers can act on, and some arrangements — risk pooling, insurance, anything that depends on a shared ignorance — can stop working when the ignorance is removed, even though no individual has been made worse off by knowing. I want to know whether this breaks the move from cannot harm the recipient to cannot harm, or whether it is a separate argument he is entitled to set aside.

  Whether the theorem is about gross or net value, and what our panel should do with the acquisition, follow-up and downstream-testing costs that disclosure sets in motion.

  Then run the audit on three proposals in front of us: reporting variants of uncertain significance to healthy adults; offering direct to consumers a polygenic score for a common disease for which no preventive intervention exists; and reporting, in a child's genome, a finding for a late-onset condition with no treatment, where the parents had asked for everything to be reported. For each, say which disanalogy carries the weight, and whether our default should flip.

  Finally, tell me whether there is a better single picture for the case where information is generated for one person and read by many, and whether the honest answer is that no picture fits — and if so, what the panel should put in place of one. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Ethics and governance panel of a hospital trust running a clinical genomic testing service.
      *   **Problem:** A panel member argues against withholding genetic information using an analogy (information = sharper photograph) and a theorem (Value of Information - VoI). He claims information is never harmful *ex ante*, withholding is paternalistic, and the burden of proof is on suppression.
      *   **Task:** Audit the analogy and the theorem's application.
      *   **Specific Requirements:**
          1.  Provide a correspondence table (Resolution, Scene, Camera, Viewer, Task, Squinting, Cost).
          2.  Separate material disanalogies from decorative ones.
          3.  Address specific pressure points:
              *   "Squinting" (ignoring info) feasibility/costs.
              *   *Ex ante* vs. *ex post* framing (policy vs. individual outcome).
              *   "Fixed Scene" assumption (static truth vs. evolving interpretation).
              *   "Single-Viewer" assumption (individual vs. systemic/relational impact).
              *   Gross vs. Net Value (costs of acquisition/follow-up).
          4.  Apply the audit to three specific proposals:
              *   Reporting VUS to healthy adults.
              *   DTC polygenic scores (no intervention).
              *   Child's genome, late-onset, no treatment (parents requested all).
          5.  Conclusion: Is there a better picture? Should we abandon pictures? What should replace them?
      *   **Tone/Style:** British English, rigorous, analytical, suitable for an ethics panel context.

  2.  **Deconstruct the Panel Member's Argument:**
      *   *Analogy:* Information is a higher-resolution photo of a fixed scene.
      *   *Theorem:* Value of Information (VoI) in decision theory. $E[U|Info] \ge E[U|No Info]$.
      *   *Conclusion:* Disclosure is never *ex ante* harmful; withholding is paternalistic.
      *   *Flaw:* It assumes idealised rational agents, costless processing, static truth, and isolated individuals. Genomics violates these.

  3.  **Drafting the Correspondence Table:**
      *   *Resolution:* Granularity of the genetic report (e.g., VUS vs. Pathogenic).
      *   *Scene:* The patient's biological reality/genotype.
      *   *Camera:* The sequencing technology/bioinformatic pipeline.
      *   *Viewer:* The patient (and potentially clinicians/family).
      *   *Task:* Health management/life planning.
      *   *Squinting:* Choosing not to act on/know the result (standing instruction).
      *   *Cost:* Financial, psychological, opportunity costs of testing/follow-up.

  4.  **Analyzing Disanalogies (The Core Audit):**
      *   *Squinting:* In theory, you can ignore info. In practice, "knowledge" changes psychological state (anxiety) even if you don't act. Also, once in a medical record, clinicians might act even if the patient wants to "squint." *Key point:* Ignoring is not costless.
      *   *Ex Ante vs. Ex Post:* VoI is about expectation. A specific patient can be devastated by a result even if the *average* utility is positive. Policy needs to protect the vulnerable tail, not just the mean.
      *   *Fixed Scene:* Genomics isn't static. A VUS today might be Pathogenic tomorrow (or benign). A "sharper photo" implies the underlying truth is fixed and we just see it better. Here, the *interpretation* evolves. Reporting a VUS is like labeling a blurry spot "dangerous" when it might not be. It creates a moving target.
      *   *Single Viewer:* Genetic info is familial. It affects insurability, employability (in some jurisdictions), and relatives' risk. It breaks risk pooling. This violates the "cannot harm" claim if we consider societal/relational harm.
      *   *Gross vs. Net:* VoI usually assumes costless information. Clinical testing has downstream costs (surveillance, biopsies, anxiety management). If Cost > Benefit, Net Value is negative.

  5.  **Applying to the Three Proposals:**
      *   *VUS to Healthy Adults:*
          *   *Key Disanalogy:* Fixed Scene. VUS meaning changes.
          *   *Verdict:* Default should be *not* to report. High risk of false reassurance or unnecessary anxiety without clinical utility.
      *   *DTC Polygenic Score (No Intervention):*
          *   *Key Disanalogy:* Task/Utility. If no intervention exists, the "task" (health improvement) cannot be actioned. Information creates anxiety without agency.
          *   *Verdict:* Default should be *not* to offer. Violates the "task" alignment.
      *   *Child's Genome (Late-onset, No Treatment, Parents requested all):*
          *   *Key Disanalogy:* Single Viewer/Agency. The child is the viewer eventually, but parents are the current decision-makers. This violates the child's future right to an "open future."
          *   *Verdict:* Default should be *not* to report. Protecting the child's future autonomy overrides parental demand.

  6.  **Developing the Alternative Metaphor/Conclusion:**
      *   Is there a better picture? Maybe "Seeding a Garden" or "Opening a Box."
      *   Actually, the prompt asks if *no* picture fits.
      *   *Argument:* Metaphors simplify. Genomics is complex, relational, and temporal. A single picture obscures more than it reveals.
      *   *Recommendation:* Replace the picture with a framework. Specifically, a *Governance Framework* based on Clinical Utility, Actionability, and Right not to Know.
      *   *Better Metaphor (if needed):* "Information as a Seed." Some seeds grow into useful plants (actionable findings); some are invasive weeds (VUS, non-actionable); some affect the neighbours (familial risk). You don't scatter all seeds just because they are free.

  7.  **Refining the Language (British English & Tone):**
      *   Use "programme," "centre," "analyse," "modelling."
      *   Maintain a formal, respectful, yet critical tone suitable for a panel discussion.
      *   Ensure the distinction between *ex ante* (before the event) and *ex post* (after the event) is clear.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "squinting" point about attention scarcity? *Adjustment:* Ensure I mention that cognitive load and psychological burden make "ignoring" expensive.
      *   *Check:* Did I address the "fixed scene" regarding reclassification? *Adjustment:* Emphasise that a VUS is not a blurry photo of a pathogenic variant; it's a distinct category of uncertainty that evolves.
      *   *Check:* Did I handle the insurance/risk pooling point? *Adjustment:* Make sure to distinguish between harm to the *individual* vs harm to the *system* (insurance pools). The panel member argues about the individual, but the panel has a governance role for the trust/system.
      *   *Check:* Is the VoI theorem correctly interpreted? *Adjustment:* Yes, it applies to *expected* utility of a *rational* agent with *costless* info. The audit must show where these conditions fail.

  9.  **Final Polish:** Organise with clear headings. Ensure the correspondence table is distinct. Make sure the three proposals are treated individually. Conclude with strong guidance on what to put in place of the metaphor. (Proceed to generate output).

  *(Self-Correction on the "Better Picture"):* The prompt asks "whether there is a better single picture... and whether the honest answer is that no picture fits". I should argue that no single picture fits because the situation is multi-dimensional. The recommendation should be a framework, not a new metaphor.

  *(Refining the "Squinting" argument):* The panel member says "you can look away." In genomics, once a result is in the Electronic Health Record (EHR), a clinician in an emergency might see it. The patient cannot fully "squint" if the system is designed to alert. This is a crucial institutional disanalogy.

  *(Refining the "Fixed Scene"):* A photo captures a moment. A genome is constant, but the *knowledge* is not. The "scene" is the map of knowledge, not the DNA itself. The map changes.

  *(Refining the "Single Viewer"):* Genetic information is inherently shared. This is the strongest ethical counter-argument.

  Let's assemble the response.cw
answer: |-
  **Audit of the 'Photograph' Analogy and the Value of Information Theorem**

  **To:** The Ethics and Governance Panel
  **From:** [Your Name/Role]
  **Subject:** Rebuttal of the 'Information as Resolution' Argument

  The panel member's argument rests on a category error. He treats clinical genomic data as a consumer good (a photograph) governed by idealised decision theory, whereas it is a clinical intervention governed by biological uncertainty, relational ethics, and institutional constraints. Below is the audit you requested.

  ### 1. Correspondence Table

  | Element in Analogy | Proposed Correspondence in Genomics |
  | :--- | :--- |
  | **Resolution** | The granularity of the report (e.g., Pathogenic vs. Variant of Uncertain Significance). |
  | **The Scene** | The patient's biological reality (genotype and associated health risks). |
  | **The Camera** | The sequencing technology and bioinformatic pipeline. |
  | **The Viewer** | The patient (and potentially the clinician interpreting the result). |
  | **The Task** | Health management, reproductive planning, or life choices. |
  | **Squinting** | Exercising a 'right not to know' or declining to act on a result. |
  | **Cost of Photograph** | Financial cost of testing, psychological burden, and downstream clinical follow-up. |

  ### 2. Material Disanalogies

  Many differences between a photograph and a genetic report are merely decorative (e.g., a photograph is visual, a report is textual). The following disanalogies are material to the ethical decision at hand.

  #### A. The Feasibility of 'Squinting' (Ignoring Information)
  The theorem assumes an agent can condition their action on the signal *or* ignore it at no cost. In the photograph analogy, looking away is instantaneous and reversible. In clinical genomics, 'squinting' is often impossible or costly.
  *   **Cognitive Inertia:** Once a risk is known, it cannot be unknown. Anxiety or 'vigilance' may persist even if the patient resolves not to act. The psychological cost of suppression is non-zero.
  *   **Institutional Leakage:** A result filed in a hospital trust record is not a private photograph. It may be visible to other clinicians, insurers (depending on jurisdiction), or researchers. A patient cannot 'squint' if an emergency physician sees a flag on their record and acts upon it against the patient's prior wishes.
  *   **Competence Drift:** The theorem assumes the agent's utility function remains stable. Evidence suggests that receiving high-risk genetic information can alter a patient's risk tolerance and self-conception, changing the 'viewer' permanently.

  **Verdict:** The 'squinting' move bears more weight in his argument than the theorem allows. The option to ignore is not genuinely available if the information alters the psychological state or enters a shared record.

  #### B. Ex Ante vs. Ex Post Framing
  The Value of Information (VoI) theorem is strictly *ex ante*: it states that *before* seeing the result, the *expectation* of utility is higher with the test than without. It does not guarantee that *ex post* (after the result), the individual is better off.
  *   **Policy vs. Individual:** You are writing policy for individuals, not maximising aggregate utility for a population. A policy can be *ex ante* rational (positive expected value) yet produce catastrophic *ex post* outcomes for a minority (e.g., a false positive leading to unnecessary mastectomy, or a true positive causing severe psychological harm without support).
  *   **Risk Aversion:** Rational agents are often risk-averse regarding health. They may prefer a certain state of ignorance to a gamble with a higher expected value but a disastrous downside tail.

  **Verdict:** The *ex ante* framing masks the distribution of harm. A policy based solely on expected value fails to protect the vulnerable tail of the distribution.

  #### C. The 'Fixed Scene' Assumption
  In photography, the scene exists independently of the camera. In genomics, the 'scene' (the clinical meaning of the variant) is not fixed; it is epistemic and evolves.
  *   **Reclassification:** A Variant of Uncertain Significance (VUS) is not a blurry photo of a pathogenic variant; it is a statement of current ignorance. Reporting it treats a temporary lack of knowledge as a fixed fact. If the variant is reclassified five years later, the 'image' was not higher resolution; it was misleading.
  *   **Actionability:** A photograph shows what *is*. A genetic report suggests what *might be*. If there is no intervention (as in some late-onset conditions), the 'scene' includes a future that cannot be altered. Higher resolution of an unchangeable future does not aid the 'task' of health management.

  **Verdict:** The scene is not fixed. Reporting evolving interpretations as facts violates the correspondence between the map and the territory.

  #### D. The Single-Viewer Assumption
  A photograph is private. A genetic result is inherently relational.
  *   **Familial Implications:** A result reveals information about relatives who have not consented to testing. This violates the 'single viewer' constraint.
  *   **Systemic Harm:** As you noted, risk pooling (insurance, social care) depends on asymmetric information. If high-risk individuals know their status and low-risk individuals do not, or if insurers access the data, the pool can destabilise. This is a harm to the system, even if the individual recipient feels benefited.

  **Verdict:** This breaks the move from 'cannot harm the recipient' to 'cannot harm'. The panel has a duty to the trust and the wider system, not just the individual patient.

  #### E. Gross vs. Net Value
  The VoI theorem typically calculates the gross value of information. It assumes the signal is free.
  *   **Downstream Costs:** Disclosure triggers clinical pathways: counselling, surveillance, biopsies, prophylactic surgeries. If the cost of these follow-ups (financial and physical) exceeds the benefit of the knowledge, the *net* value is negative.
  *   **Opportunity Cost:** Resources spent following up low-yield findings are resources not spent on actionable care.

  **Verdict:** The theorem must be applied to *net* utility. If acquisition and follow-up costs are high, the value of information becomes negative.

  ---

  ### 3. Audit of the Three Live Proposals

  #### Proposal 1: Reporting Variants of Uncertain Significance (VUS) to Healthy Adults
  *   **Dominant Disanalogy:** **The Fixed Scene.**
  *   **Analysis:** A VUS is not a refined image of a risk; it is a placeholder for ignorance. Reporting it treats uncertainty as knowledge. Because the 'scene' (clinical interpretation) changes over time, reporting now creates a high probability of future correction, causing confusion and potential harm (false reassurance or unnecessary anxiety).
  *   **Recommendation:** **Default should flip to Non-Disclosure.** The burden of proof lies on showing the VUS has immediate clinical utility, which by definition it lacks.

  #### Proposal 2: Direct-to-Consumer Polygenic Score (No Preventive Intervention)
  *   **Dominant Disanalogy:** **The Task.**
  *   **Analysis:** In the photograph analogy, the viewer has a task (e.g., navigating). If the image shows a road that is closed forever with no detour, the image does not help the task; it only induces distress. If no preventive intervention exists, the 'task' of health management cannot be actioned. The information has gross value (knowledge) but negative net value (anxiety without agency).
  *   **Recommendation:** **Default should flip to Non-Offer.** Without actionability, the information fails the 'task' criterion of the analogy itself.

  #### Proposal 3: Child's Genome, Late-Onset, No Treatment (Parents Requested All)
  *   **Dominant Disanalogy:** **The Single-Viewer/Agency.**
  *   **Analysis:** The 'viewer' is ultimately the child, but the 'camera operator' is the parent. Reporting this removes the child's future right to decide whether to know (the 'right to an open future'). The parents are squinting on behalf of the child, but the child cannot choose to look away later. This violates the autonomy condition required for the VoI theorem to hold ethically.
  *   **Recommendation:** **Default should flip to Non-Disclosure.** Parental request does not override the future autonomy of the child regarding non-actionable adult-onset conditions.

  ---

  ### 4. Conclusion: Replacing the Picture

  **Is there a better single picture?**
  No. The 'photograph' suggests passivity (viewing a static scene). A better metaphor might be **'Information as a Seed'**. Some seeds grow into useful plants (actionable findings); some are invasive weeds (VUS, non-actionable risks) that choke the garden; some affect the neighbours' soil (familial implications). You do not scatter all seeds simply because you possess them. You cultivate only those that yield a harvest.

  **However, the honest answer is that no picture fits.**
  Metaphors simplify to illuminate, but in governance, simplification can obscure liability. The 'photograph' argument is seductive because it borrows the rigour of decision theory while stripping away the constraints (cost, psychology, relationality) that make the theorem applicable.

  **What should the panel put in place of one?**
  Do not replace the picture with another picture. Replace it with a **Framework of Clinical Utility and Stewardship**.

  1.  **Actionability Threshold:** Information is only disclosed if there is a validated clinical pathway to manage it. (Addresses the 'Task' and 'Net Value').
  2.  **Temporal Stability:** Information is only disclosed if the interpretation is stable enough to justify intervention. (Addresses the 'Fixed Scene').
  3.  **Relational Consent:** Disclosure protocols must account for familial implications and the rights of third parties. (Addresses the 'Single Viewer').
  4.  **Right Not to Know:** Establish a robust mechanism for patients to opt-out of specific categories, acknowledging that 'squinting' must be supported by the system, not just the individual. (Addresses the 'Squinting' cost).

  **Final Advice to the Panel:**
  You should not overrule your colleague on instinct, but on technical grounds. His application of the Value of Information theorem is mathematically correct but contextually void. It applies to a rational agent in a vacuum. You govern a hospital trust in a society. The theorem proves that information *can* be valuable; it does not prove that *all* information *must* be released *now*. The burden of argument does not fall on suppression; it falls on **justification**. For every class of result released, the trust must demonstrate net clinical utility, not merely theoretical informational gain.
