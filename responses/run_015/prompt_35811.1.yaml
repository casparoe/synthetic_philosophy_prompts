  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Quantitative trader with a professional poker background.
      *   **Vocabulary:** Conditional expected value (EV), variance, drawdown, Kelly sizing, martingales, stopping rules, sample spaces, backtesting conditioning (look-ahead bias), infinite expectation issues.
