answer: |-
  This is a sophisticated argument that effectively deploys a *reductio ad absurdum* against a specific normative implication often (though not always) drawn from ontological constructivism. You are correct to suspect it proves too much; the logical pressure you feel is the result of a category error in the first premise.

  Here is the diagnosis of the error, the cost of fixing it, and the answers to your specific theoretical questions.

  ### 1. Which step should you reject?
  **You should reject Premise (1).**

  Premise (1) states: *If a collective's coherence depends entirely on deliberately fabricated narratives... then there is no pre-political people that possesses inherent rights... the collective is... a self-authorizing fiction.*

  This premise conflates **ontological construction** with **normative arbitrariness**. It assumes that if something is "made" (constructed), it is therefore "fake" (fictitious) or lacks moral weight. In social ontology, this is the distinction between *brute facts* (existing independently of human agreement, like gravity) and *social facts* (existing dependent on human agreement, like money or marriage).

  By rejecting (1), you can assert that a collective can be *ontologically constructed* without being *normatively void*. This allows you to maintain that nations are invented (preserving the constructivist insight) while denying that this invention automatically strips them of the capacity to ground rights or obligations (preserving the possibility of national legitimacy).

  ### 2. What does that rejection cost?
  Rejecting (1) forces you to abandon the idea that **only pre-political, natural, or ancient substrates can ground moral rights.**

  *   **The Cost:** You must provide a positive account of *why* some constructed entities generate obligations while others do not, without appealing to "naturalness." You cannot simply say, "Nations are real because they aren't invented." You must say, "Nations are invented, *but* they generate rights because they fulfill functions X, Y, and Z (e.g., providing context for autonomy, securing trust, enabling distributive justice)."
  *   **The Benefit:** This aligns you with **Liberal Nationalism** (e.g., Yael Tamir, David Miller) rather than Ethnic Nationalism. It allows you to argue that national rights are grounded in the *value* of the social form, not the *antiquity* of the bloodline.

  ### 3. Is the error an equivocation?
  **Yes.** The argument turns on an equivocation between **"constructed"** (ontologically dependent on human practice) and **"fictitious"** (false or lacking causal/normative power).

  *   In Step (2), "constructed" is used in the Andersonian sense: *imagined* but politically real.
  *   In Step (1), "constructed" is treated as synonymous with *fabricated fiction*.
  *   In Step (7), you rightly note that we treat family obligations as binding. Families are also socially constructed (kinship systems are not brute facts of biology; they involve normative recognition). If "constructed" meant "fictitious," family obligations would indeed be illusory. Since they are not, "constructed" cannot mean "fictitious."

  ### 4. Is the recursive move in (4)–(5) a non sequitur?
  **No, it is a valid *reductio*.**

  Steps (4) and (5) are the strongest part of your argument. They successfully demonstrate that if Premise (1) were true, it would consume the critic's own footing. This is not a non sequitur; it is a legitimate transcendental argument. It shows that the criterion for legitimacy proposed in (1) is **self-defeating**.

  Because the recursive move works, it confirms that Premise (1) is the false lemma. The pressure you feel is the *reductio* doing its job: it is forcing you to realize that (1) is untenable because it destroys the very ground you stand on to critique nationalism.

  ### 5. If I block the slide at (1), must I concede a natural substrate?
  **No.**

  Blocking the slide at (1) does not require you to concede that nations have a "natural substrate" (an ancient ethnic core). It only requires you to concede that **moral legitimacy does not require a natural substrate.**

  You can maintain the full Hobsbawm/Anderson ontological claim (nations are modern inventions) while rejecting the normative nihilism that often accompanies it. You simply decouple *origin* from *validity*. This is a standard Kantian or Contractarian move: rights are not found in nature; they are constructed by rational agents to serve specific ends.

  ### Confidence and Uncertainty

  **Confidence Level: High (90%)**
  I am highly confident that Premise (1) is the logical weak point. In contemporary political theory, the move from "socially constructed" to "normatively illegitimate" is widely regarded as a fallacy (the "genetic fallacy" applied to ontology). The distinction between social facts and brute facts is standard fare in upper-division theory (see John Searle on social ontology or Margaret Gilbert on plural subjects).

  **Point of Least Certainty: The Normative Alternative**
  My uncertainty lies not in the logical diagnosis, but in **which normative theory you intend to substitute for Premise (1).**
  *   If you replace (1) with a **Liberal** account (nations are legitimate only insofar as they protect individual autonomy), you may still have to reject *some* national claims, just not *because* they are constructed.
  *   If you replace (1) with a **Communitarian** account (nations are legitimate because they constitute the self), you risk sliding back toward the "natural substrate" view you wish to avoid.

  **Recommendation for your Seminar:**
  Frame your objection not as a defense of "ancient ethnic substrates," but as a critique of **Normative Deflationism**. Argue that Constructivism (ontological) is compatible with Nationalism (normative), provided one rejects the premise that *construction entails illegitimacy*. Your argument (specifically steps 4–8) is an excellent defense of the *coherence* of constructed rights, but it fails as an objection to Constructivism unless you clarify that you are objecting to the *nihilistic interpretation* of Constructivism, not the ontological claim itself.
