answer: |-
  Criteria for Ordering:
  1.  **Instrument Impact:** Does the answer change the measure's construction or validity for policy?
  2.  **Tractability:** Can conceptual work resolve this in five years without new empirical data?
  3.  **Risk:** Does failure here invalidate the entire deliverable?

  **1. Ranked Questions for Philosopher-Years**

  1.  **What normative principle licenses substituting attentional signatures for felt experience?**
      *   *Upstream of:* The entire Substitutionist proposal (d).
      *   *Tractability:* High. Requires ethical theory, not new data.
      *   *Instrument Impact:* Critical. If no principle links signature to welfare, the measure is behaviorism, not wellbeing.
      *   *Trade-off:* High risk of philosophical stalemate, but necessary for legitimacy.

  2.  **What aggregation protocol renders monotone-transformed scales interpersonally comparable?**
      *   *Upstream of:* Data stipulation (b).
      *   *Tractability:* High. Measurement theory and social choice theory.
      *   *Instrument Impact:* Critical. Determines the math of cost-effectiveness analysis.
      *   *Trade-off:* Technical precision vs. ethical acceptability of the chosen anchor.

  3.  **Does phenomenological reporting retain instrumental value if it diverges from the signature?**
      *   *Upstream of:* Retentionist concerns and Data (c).
      *   *Tractability:* Medium. Requires conceptual analysis of error theories.
      *   *Instrument Impact:* Moderate. Determines if self-reports are discarded or used as calibrators.
      *   *Trade-off:* Ignoring reports risks public rejection; trusting them risks validity.

  4.  **What external criteria validate the measure without circularity?**
      *   *Upstream of:* The validation trap.
      *   *Tractability:* Medium. Philosophy defines criteria; empirics test them.
      *   *Instrument Impact:* High. Determines the testing protocol.
      *   *Trade-off:* Broad criteria increase validity risk; narrow criteria increase circularity risk.

  5.  **Is the "representative agent" unit ethically permissible for distributional weighting?**
      *   *Upstream of:* Data stipulation (d).
      *   *Tractability:* High. Distributive justice theory.
      *   *Instrument Impact:* Moderate. Affects equity adjustments in CEA.
      *   *Trade-off:* Simplicity vs. fairness to outliers whose signatures differ.

  **2. Overrated Implications of Heterogeneity**

  *   **"Welfare isn't pleasure if feels differ":** False. Functionalism allows welfare to be unified by role even if qualia differ.
  *   **"Interpersonal comparison is impossible":** False. We compare pain across modalities via behavioral/neural markers; scale variance (b) is a technical, not principled, barrier.
  *   **"Any unit is arbitrary":** False. Functional roles (choice probability, attention duration) provide non-arbitrary natural units.
  *   **"Hedonism collapses into desire theory":** False. Desire tracks welfare but is not identical; the signature captures the tracking mechanism, not the definition.
  *   **"Proposal (d) is a reductio":** False. Operationalizing theoretical constructs via signatures is standard scientific practice (e.g., temperature), not a contradiction.

  **3. The Verbal Dispute**

  The Retentionist/Substitutionist disagreement is largely verbal regarding the label "pleasure." Both agree on the functional role (predicts choice, captures attention). However, this does not defuse the conflict; it relocates the real question to **Question 1** (Normative Warrant). The substantive issue is not what we call it, but whether policy requires the phenomenological claim for public legitimacy. If the measure works functionally but lacks phenomenological grounding, is it welfare? This is not verbal; it is axiological.

  **4. The Validation Trap**

  There is a way out: **Predictive Validity on Independent Norms.** The measure should predict outcomes independently valued (longevity, mental health diagnosis, social functioning) that were not used to construct the signature.
  *   *Philosophy's Role:* Define which external indicators count as welfare proxies (e.g., is longevity a valid proxy?).
  *   *Empirical Role:* Test the correlation.
  *   *Budget Allocation:* This belongs in the philosophy portion to define the criteria, preventing the empiricists from selecting convenient proxies that guarantee success.

  **5. Move/Abandon Criteria**

  *   **Move Up:** Evidence that the attentional signature predicts long-term health outcomes better than self-report across diverse cultures.
  *   **Move Down:** Evidence that the signature is easily manipulated (e.g., via stimulation) without corresponding improvements in life outcomes.
  *   **Abandon:** Proof that no normative principle can link the signature to *good* (e.g., if it tracks addiction rather than welfare).
  *   **Abandon:** If Question 1 yields no consensus on a normative bridge after two years, the project lacks ethical foundation.

  \answer{What normative principle licenses substituting attentional signatures for felt experience?}
