answer: |-
  ### 1. The Splitting Questions

  1.  **History:** Two applicants are equally broke. One blew a previous grant on a risky choice; the other lost theirs to theft. Do we give them the same amount?
  2.  **Disability:** An applicant in a wheelchair needs £500 more than an able-bodied applicant to move around campus equally easily. Do we give the extra £500?
  3.  **Tastes:** One applicant needs a costly gym setup and diet to be happy; another is cheerful on very little. Both have the same income. Do we top up the first applicant to match the second's happiness?
  4.  **Risk:** A PhD student has enough income now but their funding could vanish tomorrow. Another applicant has less income but it's guaranteed for a year. Who gets priority?
  5.  **Means vs Ends:** For the wheelchair applicant, do we give cash they can spend on anything, or pay directly for the specific mobility service they need?
  6.  **Threshold:** Is there a minimum income level below which we help anyone, even if helping someone slightly richer would create more total improvement?
  7.  **Priority:** If helping the very worst-off person yields a tiny gain, but helping the second worst-off yields a huge gain, do we help the worst-off?
  8.  **Opportunity:** An applicant chooses not to work despite having the chance; another cannot work. Do we compensate the first applicant to match the second's income?

  ### 2. Logical Space & Empty Combinations

  The tree below prunes the 256 logically possible answer combinations down to 12 occupied leaves. The following combinations are unoccupied:

  *   **Q1=No (History Matters) + Q3=Yes (Top Up Chosen Tastes):** *Incoherent.* If past choice determines eligibility, compensating for voluntary expensive tastes contradicts the principle.
  *   **Q1=No (History Matters) + Q8=Yes (Compensate Chooser):** *Incoherent.* Cannot hold people responsible for blown grants but compensate them for choosing leisure over work.
  *   **Q2=No (Ignore Disability Cost) + Q5=Pay Service:** *Incoherent.* If you refuse extra cash for disability needs, paying for specific services acknowledges the need you just denied.
  *   **Q4=PhD Priority (Risk) + Q6=Yes (Threshold):** *Unattractive.* Prioritizing volatile income over someone below a survival threshold is generally viewed as morally reckless.
  *   **Q6=Yes (Threshold) + Q7=Yes (Priority to Worst-Off):** *Redundant.* Sufficientarianism (Threshold) usually overrides Leximin (Priority); holding both creates no distinct decision path compared to Threshold alone.
  *   **Q2=Yes + Q4=Stable Priority + Q5=Cash:** *Unexplored.* Acknowledges disability costs but ignores risk and prefers cash over services; logically possible but no named theory occupies this specific cluster without also prioritizing risk or services.

  ### 3. Decision Tree & Leaf Mapping

  **Start at Q1 (History).**

  *   **IF YES (Ignore History):** Go to **Q2 (Disability)**.
      *   **IF NO (Ignore Disability):** Go to **Q3 (Tastes)**.
          *   **IF YES (Top Up Tastes):** **Welfare Egalitarianism**.
          *   **IF NO (Ignore Tastes):** Go to **Q6 (Threshold)**.
              *   **IF YES:** **Sufficientarianism**.
              *   **IF NO:** Go to **Q7 (Priority)**.
                  *   **IF YES:** **Leximin**.
                  *   **IF NO:** Go to **Q (Total Welfare)**. *(Implicit Q: Maximize total even if gaps increase?)*
                      *   **IF YES:** **Utilitarianism**.
                      *   **IF NO:** **Prioritarianism**.
      *   **IF YES (Acknowledge Disability):** Go to **Q4 (Risk)**.
          *   **IF YES (Priority to PhD/Risk):** **Equality of Slack**. *(Note: Risks collapsing into Prioritarianism if risk is valued only as a welfare burden; stands distinct if 'margin for error' is intrinsic value.)*
          *   **IF NO (Priority to Low Income):** Go to **Q5 (Means vs Ends)**.
              *   **IF Cash:** **Rawls-style Primary Goods**.
              *   **IF Service:** **Sen/Nussbaum-style Capabilities**.

  *   **IF NO (History Matters):** Go to **Q3 (Tastes)**.
      *   **IF YES (Top Up Unchosen Tastes):** **Cohen-style Access to Advantage**.
      *   **IF NO (Ignore Tastes):** Go to **Q8 (Opportunity)**.
          *   **IF YES (Compensate Chooser):** *(Empty/Incoherent)*.
          *   **IF NO (Do Not Compensate):** Go to **Q (Currency of Opportunity)**. *(Implicit Q: Measure opportunity in happiness or means?)*
              *   **IF Happiness:** **Arneson-style Equality of Opportunity for Welfare**.
              *   **IF Means:** **Luck-Egalitarian Equality of Fortune**.

  ### 4. Indistinguishable Leaves

  *   **Luck-Egalitarian Equality of Fortune vs. Arneson-style Equality of Opportunity for Welfare:** The tree separates these by an implicit currency question (Happiness vs. Means) at the final node. In practice, volunteers often conflate "opportunity for welfare" with "means to welfare," making these leaves functionally identical without deep interrogation of whether "welfare" itself is the metric.
  *   **Equality of Slack vs. Prioritarianism:** If the committee values the PhD student's precariousness only because stress reduces their current happiness, Slack collapses into Prioritarianism. It remains distinct only if "resilience" is valued independently of current welfare states.

  ### 5. Scoring Key

  Q1=Y/Q2=N/Q3=Y→Welfare Egal; Q1=Y/Q2=N/Q3=N/Q6=Y→Sufficientarian; Q1=Y/Q2=N/Q3=N/Q6=N/Q7=Y→Leximin; Q1=Y/Q2=N/Q3=N/Q6=N/Q7=N/MaxTotal=Y→Utilitarian; Q1=Y/Q2=N/Q3=N/Q6=N/Q7=N/MaxTotal=N→Prioritarian; Q1=Y/Q2=Y/Q4=Y→Slack; Q1=Y/Q2=Y/Q4=N/Q5=Cash→Rawls; Q1=Y/Q2=Y/Q4=N/Q5=Service→Capabilities; Q1=N/Q3=Y→Cohen; Q1=N/Q3=N/Q8=N/Currency=Happy→Arneson; Q1=N/Q3=N/Q8=N/Currency=Means→Luck Egal.
