  # Desiderata for a Theory of Tragic Enjoyment

  ### 1. Phenomenological Integrity
  **Requirement:** The theory must preserve the negative valence of sadness; the pain cannot be redefined as pleasure in disguise.
  **Motivating Case:** To distinguish enjoying-*because*-it-is-sad from enjoying-*despite*-it, the sadness must remain phenomenologically unpleasant; if it converts to pure pleasure, the object of enjoyment shifts. Tragedy cannot be collapsed into comedy-with-extra-steps because comedy resolves tension into relief, whereas tragedy requires the tension to persist as unresolved pain. Regarding stacked affect, craft admiration cannot anesthetize the sting; similarly, formal grief (e.g., a decaying minor chord) must register as somber even while the composition is admired, proving the pain is real and not merely tolerated.

  ### 2. Constitutive Contribution
  **Requirement:** The theory must explain how a negative affective state contributes positively to overall aesthetic value without being instrumentalized.
  **Motivating Case:** If sadness is merely a cost paid for a later reward, we are enjoying *despite* it; to enjoy *because* of it, the sadness must be a constitutive feature of the value. Comedy uses pain as a setup for release, but tragedy treats the pain as the aesthetic end itself, preventing a collapse into relief theory. In stacked affect, we value the craft *of* the grief, not just the craft *alongside* the grief; formal grief demands this too, as the structural sadness (e.g., a pulling-away camera shot) is the very source of the artistic merit, not an obstacle to it.

  ### 3. Formal Inclusivity
  **Requirement:** The theory must account for sadness generated by form (music, pacing, composition) without relying on fictional suffering or propositional content.
  **Motivating Case:** If a theory brackets formal grief as outside the paradox, it fails to explain why we seek out sad instrumental music, rendering the "because vs. despite" distinction incomplete for non-narrative art. Comedy relies on semantic incongruity and resolution, whereas formal grief relies on structural decay or expectation violation that does not resolve. This forces the stacked affect model to accommodate cases where craft pleasure and content grief are identical; in formal grief, admiring the structure *is* undergoing the sadness, so they cannot be separated into parallel tracks.

  ### 4. Affective Parallelism
  **Requirement:** The theory must allow for simultaneous, non-canceling processing of negative content-affect and positive craft-affect.
  **Motivating Case:** To avoid the "despite" trap, the theory must show how we cry and appreciate the writing in the same moment, not alternately. Comedy collapses the negative channel into the positive punchline, but tragedy sustains both channels open without one negating the other. Stacked affect requires this dual-channel capacity so craft pleasure does not overwrite content grief; formal grief intensifies this requirement by showing that the structural moves causing sadness are the same ones causing aesthetic delight, demanding a model where oppositional valences coexist in a single object.

  ### 5. Structural Irreducibility
  **Requirement:** The theory must demonstrate that tragic enjoyment is not a delayed form of comic relief or cognitive mastery.
  **Motivating Case:** If the enjoyment comes from surviving the sadness, it is enjoyment *despite* the sadness; true tragic enjoyment finds value in the loss itself. Comedy ends in restoration and order, while tragedy ends in loss or stasis, preventing a collapse into "comedy-with-extra-steps." Stacked affect must persist after the work ends—the grief lingers even as craft appreciation fades; formal grief often lacks resolution entirely, ensuring the negative affect remains irreducible to a problem-solving satisfaction.

  ***

  ### Critical Tension Flag
  **Jointly Unsatisfiable Pair:** *Phenomenological Integrity* (Sadness is genuinely negative) and *Constitutive Contribution* (Sadness is the primary source of pleasure).
  **Reasoning:** It is logically strained to claim that a genuinely negative experience is the direct cause of a positive evaluation without invoking a conversion mechanism (which violates Integrity) or an instrumental justification (which violates Contribution). A theory must either redefine "pleasure" to accommodate negative valence or admit that we value the *meaning* of the sadness rather than the *feeling* of it.

  ***

  ### Brief Theory Scoring
  *   **Catharsis:** Fails **Constitutive Contribution** and **Structural Irreducibility**; it treats sadness as a purgative cost to be expelled for relief, collapsing tragedy into a hygiene mechanism similar to comedy's relief.
  *   **Hume-Style Conversion:** Fails **Phenomenological Integrity**; it argues the pain is literally converted into pleasure, dissolving the sadness rather than preserving it as a valued component.
  *   **Control/Value Views:** Fails **Formal Inclusivity** and **Affective Parallelism**; they rely on cognitive mastery over fictional threats, which cannot explain non-propositional formal grief or the simultaneous feeling of helplessness and appreciation.

  Summary: The core tension lies in demanding that sadness remain genuinely painful while simultaneously functioning as the direct source of aesthetic pleasure without conversion or instrumentalization.
