  Your intuitions track a modified contractualism that distinguishes between *imposing harms* and *conferring benefits*. Your proposed rule is strong but requires precision regarding "severity." Here are two refined principles.

  **1. The Asymmetry Principle**
  You may aggregate small burdens to prevent a severe burden on one person, but you may not aggregate trivial benefits to impose a severe burden on one person.
  *Motivation:* Distinguishes the Grid (spread small burdens to save medicine) from the Market (spread small pleasures ruining health).
  *Verdicts:*
  *   **Night Market/Factory/Transmitter:** Close/Save. Trivial gains never justify severe harm.
  *   **Grid:** Cut 400 households. Small burdens aggregate to prevent a medical crisis.
  *   **Pain Case (400 vs 1):** Spare the 400. Preventing harm aggregates, unlike conferring pleasure. This resolves your oscillation.

  **2. The Vital Stakes Clause**
  When stakes are identical and vital (e.g., life or death), save the greater number.
  *Motivation:* The Rescue Boat.
  *Verdicts:*
  *   **Rescue:** Save six. Vital stakes override non-aggregation.
  *   **Unlisted (Large Benefit vs. Large Burden):** If a project gives 1 million people a *vital* benefit (life-saving drug) but kills one worker, do not do it. The worker can reasonably reject a principle sacrificing them, even for vital benefits to others. However, if the choice is 1 million lives vs. 1 life (identical stakes), save the million.

  **The Same-Person Challenge**
  Why aggregate flickers for one person? Intra-personal trade-offs are prudence; inter-personal trade-offs are justification. One person owns their life's totality; many people do not own each other. You may trade your sleep for your pleasure; you cannot trade my sleep for your pleasure. The principles respect individual sovereignty.

  **Confidence & Limitations**
  I am 75% confident. These principles cohere with your Grid and Market verdicts by treating harm prevention differently from benefit provision.
  *Least Sure Part:* The Pain Case. While Principle 1 suggests sparing the 400, strict contractualists sometimes argue numbers never count, even for harm. I prioritize consistency with your Grid verdict.
  *Overturned Verdict:* If you believe the life-saving factory *should* operate despite the one death, Principle 1 overturns this. It holds that no amount of collective benefit justifies sacrificing an identifiable individual against their will, marking a hard limit on aggregation. This is the hardest pill to swallow: the one identifiable person vetoes the million, unless the stakes are identical lives.
