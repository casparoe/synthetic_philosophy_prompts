answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION #492**
  **Subject:** The Epistemic Status of Retrospective Model Selection (The "Drawer Case")
  **Parties:** The Structuralist Camp (Side A) vs. The Explanatory Camp (Side B)
  **Date:** October 2023
  **Context:** Applied to a specific instance in Systems Neuroscience involving three-year-old data and a recently identified hypothesis-model link.

  ---

  ### 1. Agreed Claims regarding Confirmation and Priors

  Both parties affirm the following propositions as necessary conditions for any adequate account of scientific inference, specifically regarding the "Drawer Case" (data known for $t_{0}$ to $t_{3}$, hypothesis-model link identified at $t_{3}$).

  1.  **Normative Function:** The primary function of a confirmation measure is to guide rational belief revision regarding the adequacy of a model family, distinguishing between robust signal and artifacts of selection.
  2.  **The Reality of the Update:** In the Drawer Case, the agent's credence in the hypothesis ($H$) *did* increase at $t_{3}$. Any theory of confirmation that declares this update irrational *tout court* fails to describe scientific practice; any theory that declares it fully rational without qualification fails to guard against overfitting.
  3.  **Priors as State, Not Just History:** Priors represent an epistemic state of uncertainty. While they are causally generated by history, their normative force depends on whether they accurately reflect the space of live possibilities at the time of evaluation, not merely the temporal order of data acquisition.
  4.  **Relevance of Causal History:** The causal history of how the link between Data ($D$) and Hypothesis ($H$) was discovered (e.g., seminar, rival preprint, code error) is not irrelevant. It bears on the *reliability* of the inference, even if it does not alter the logical relation between $H$ and $D$.
  5.  **The "Oldness" of the Data:** In the Drawer Case, the *numerical values* were known at $t_{0}$. However, the *proposition that these values constitute evidence for $H$* was not known until $t_{3}$. Both sides agree this distinction is the pivot point of the dispute.
  6.  **Bayes Factors are Insufficient Alone:** A raw Bayes Factor calculated on $D$ using a model family selected *because* of $D$ will systematically overstate support for $H$ unless corrected for the selection procedure. The dispute is about *how* to correct it, not *whether* to correct it.

  ---

  ### 2. Residual Disagreements

  The following table outlines where the camps diverge on the interpretation of the Drawer Case. Wording is selected to be acceptable to the respective proponent.

  | Feature | Side A (Structuralist / Dissolutionist) | Side B (Explanatory / Pluralist) |
  | :--- | :--- | :--- |
  | **Locus of Confirmation** | Confirmation occurs at $t_{3}$ via conditionalization on the *logical relation* ($H \vdash D$), which was new information, not on $D$ itself. | Confirmation requires a *novel predictive relationship*. Since $H$ was constructed to fit $D$, the "confirmation" is merely a measure of fit, not support. |
  | **The Prior Problem** | The problem is solved by using a **counterfactual prior**: What would my credence in $H$ have been at $t_{0}$ before seeing $D$? | The problem is solved by applying a **complexity penalty** or "selection prior" that downweights $H$ proportional to the degrees of freedom explored during the "staring" phase. |
  | **Role of Discovery Context** | The *method* of discovery (code error vs. seminar) is relevant only insofar as it changes the probability that the link ($H \vdash D$) is true. | The *method* of discovery is constitutive of the evidence. A link found via code error has lower evidential weight than one found via theoretical derivation, even if the math is identical. |
  | **Status of the "Doubling"** | The doubling of confidence at $t_{3}$ is epistemically legitimate, provided we conditionalize on the discovery of the link, not the data. | The doubling of confidence at $t_{3}$ is largely psychological. Epistemic confidence should have remained flat until $H$ predicts *new* data ($D_{new}$). |
  | **Bayesian Completeness** | Standard Bayesianism is complete. The "Problem of Old Evidence" is a confusion about what proposition is being conditionalized on. | Standard Bayesianism is incomplete. It requires an external account of "severity" or "explanatory virtue" to handle selection effects. |

  ---

  ### 3. Cruxes and Predicted Outcomes

  We identify three specific cruxes where our positions yield different normative advice for the PhD candidate's thesis. We agree to treat the following scenarios as test cases.

  #### Crux 1: The "Bug" Scenario
  **Scenario:** The connection between the data and the hypothesis was noticed because a bit of analysis code contained a bug that artificially aligned the noise with the model. The bug is fixed, the alignment remains (weakly), but the *reason* for noticing it was the error.
  *   **Shared Premise:** The mathematical relationship between $H$ and $D$ is identical to the "clean" discovery case.
  *   **Side A Prediction:** The Bayes Factor remains valid (perhaps adjusted for the bug's effect on the data values), because the logical relation $H \vdash D$ holds. The causal history of the discovery is secondary to the current state of the data.
  *   **Side B Prediction:** The confirmation is voided or severely discounted. The "severity" of the test is zero because the hypothesis was not risked against the data; the data was curated by the error to fit the hypothesis.
  *   **Agreed Test:** If Side A is correct, a corrected analysis should yield similar posterior odds. If Side B is correct, the posterior odds must be penalized by the "degrees of freedom" introduced by the debugging process.

  #### Crux 2: The "Rival Preprint" Scenario
  **Scenario:** On the day the candidate notices the link ($t_{3}$), a rival group uploads a preprint proposing the exact same model family based on *their* independent data.
  *   **Side A Prediction:** The candidate's update should be the same as if the rival preprint did not exist. The candidate's credence depends on their own $P(H|D \& \text{Link})$. The rival's data is separate evidence.
  *   **Side B Prediction:** The candidate's confirmation is significantly reduced. The "novelty" of the prediction is gone. The model is now "accommodating" known facts (both the drawer data and the rival's public data) rather than predicting them.
  *   **Agreed Test:** Does the candidate cite the rival preprint as *corroboration* (Side A) or as *diminishing the novelty weight* of their own finding (Side B)?

  #### Crux 3: The "Three-Year Gap"
  **Scenario:** We ask: When did the data become evidence?
  *   **Side A Prediction:** The data became evidence at $t_{3}$ (when the link was known). Before $t_{3}$, $D$ was just numbers. Therefore, standard updating applies at $t_{3}$.
  *   **Side B Prediction:** The data became "potential evidence" at $t_{0}$, but because $H$ was not specified then, it is now "used evidence." It cannot confirm $H$ regardless of when the link was noticed, because the *opportunity for tuning* existed from $t_{0}$ to $t_{3}$.
  *   **Agreed Test:** Should the thesis present the Bayes Factor as a measure of *support* (Side A) or merely as a measure of *goodness-of-fit* that requires cross-validation on new data to count as support (Side B)?

  ---

  ### 4. Diagnosis of Verbal Disputes

  We acknowledge that a portion of our disagreement is terminological rather than substantive. We clarify the following definitions to isolate the remaining material disagreement.

  1.  **"Evidence" ($E$):**
      *   **Side A Usage:** $E$ is the proposition *"Data $D$ stands in relation $R$ to Hypothesis $H$."* Since this proposition was unknown until $t_{3}$, it is not "old."
      *   **Side B Usage:** $E$ is the *Data $D$ itself.* Since $D$ was known at $t_{0}$, it is "old," and standard conditionalization cannot yield confirmation.
      *   **Resolution:** We agree to distinguish between **Data-Old** (values known) and **Link-Old** (relevance known). Side A treats Link-New as sufficient for confirmation. Side B treats Data-Old as a constraint that requires penalty regardless of Link-New.

  2.  **"Prior":**
      *   **Side A Usage:** A **Counterfactual Prior**. The probability assigned to $H$ at a hypothetical time before $D$ was known, even if that time never actually existed for the agent.
      *   **Side B Usage:** An **Actual Structural Prior**. The probability assigned to $H$ now, but adjusted to reflect the size of the "model space" searched during the three years of staring.
      *   **Resolution:** This is a material disagreement about how to quantify selection bias. Side A believes it can be captured by the prior probability of $H$. Side B believes it requires modifying the Likelihood or the Confirmation Measure itself.

  3.  **"Confirm":**
      *   **Side A Usage:** To increase the rational degree of belief (posterior probability).
      *   **Side B Usage:** To increase the rational degree of belief *via a severe test*.
      *   **Resolution:** Side B argues that increasing belief without severity is merely "accommodation." Side A argues that "severity" is already encoded in the likelihood ratio if the model space is defined correctly.

  ---

  ### 5. Recommendation for the PhD Candidate

  Based on this collaboration, we offer the following joint advice for your thesis and the requested Bayes Factor:

  1.  **Do not report the raw Bayes Factor.** Both sides agree this is misleading given the three-year "staring" period.
  2.  **Explicitly model the selection.**
      *   **If you side with A:** Construct a "counterfactual prior" argument. Explicitly state: *"Had we proposed this model before collecting the data, our prior would have been $X$. Given the data, we update to $Y$."* Acknowledge the counterfactual nature.
      *   **If you side with B:** Apply a penalty. Use cross-validation or split-half analysis. Treat the three-year data as "training" and demand a small amount of "test" data (even if held out from the same server) to claim confirmation.
  3.  **The "Drawer" Disclosure.** In the methods section, explicitly state: *"The relationship between variable $X$ and model $Y$ was identified retrospectively."*
      *   **Side A says:** This allows the reader to construct their own counterfactual prior.
      *   **Side B says:** This warns the reader that the severity of the test is low.
  4.  **On the "Doubling" of Confidence:** You may report that your confidence doubled at $t_{3}$, but you must attribute this to the *discovery of the link*, not the *acquisition of the data*.
      *   **Side A:** This is a rational update on the proposition ($H \vdash D$).
      *   **Side B:** This is a psychological reaction that must be tempered by the knowledge that $H$ was likely tuned to noise.

  **Final Consensus:** The Bayes Factor you calculate is a measure of **consistency**, not **confirmation**. To move from consistency to confirmation, you must either (A) successfully argue for a justified counterfactual prior, or (B) demonstrate the model's performance on data that was *not* in the drawer. Given you are halfway through, we strongly recommend option (B). Collect new data.

  **Signed,**
  *The Structuralist Representative* & *The Explanatory Representative*
