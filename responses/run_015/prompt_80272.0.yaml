answer: |-
  **The Substrate Simulation**

  **Setup**
  Divide 22 students into three tables (Alpha, Beta, Gamma). Distribute distinct "State Kits."
  *   **Alpha:** 12 Resource Tokens + Complete Rulebook (defines token combos for points).
  *   **Beta:** 12 Resource Tokens + Redacted Rulebook (half the combos are blank/missing).
  *   **Gamma:** 12 Resource Tokens. 6 are public; 6 are hidden in pockets of 3 designated "Warlords." No Rulebook. Rules are verbal agreements between Warlords.

  **Phases**
  1.  **Baseline (10 mins):** Tables organize. Alpha assigns roles via Rulebook. Beta tries to decipher redactions. Gamma Warlords negotiate private access to hidden tokens.
  2.  **Intervention (5 mins):** **Identical for all.** Instructor announces "Regime Change." Remove the "Leader" token from all tables. No tokens removed, but central authority is voided. Emphasize the intervention was legally and militarily identical.
  3.  **Reconstruction (45 mins):** Tables must submit token combos to earn Stability Points (SP).
      *   **Alpha:** Submit combos matching Rulebook. Automatic approval.
      *   **Beta:** Submit combos; Instructor flips a coin for redacted ones (50% chance of rejection/waste).
      *   **Gamma:** Warlords must unanimously agree to release hidden tokens for any combo. If one vetoes, tokens stay hidden. Public tokens are free use.

  **Scoring**
  1 SP per valid combo. No money. Winning table gains "International Legitimacy" (choice of seminar reading). Track SP on whiteboard.

  **Debrief (20 mins)**
  Reveal cases: **Alpha=Kosovo** (functioning Yugoslav bureaucracy), **Beta=Iraq** (Ba'athist institutions purged via CPA Order 1), **Gamma=Libya** (Gaddafi's jamahiriya, no institutions, only loyalty networks).

  *   **Connect Alpha:** High SP shows institutional continuity allows rapid stabilization despite regime change. The state machine kept running.
  *   **Connect Beta:** Wasted tokens mirror de-Ba'athification. The state machine existed, but the operators were gone, creating uncertainty and paralysis.
  *   **Connect Gamma:** Low SP shows personalist states collapse into fragmentation. The "Intervention" removed the only glue (the Leader), revealing the hollow substrate.
  *   **Core Lesson:** The intervention was the constant; the substrate was the variable.

  **Failure Prediction**
  **Gamma's Warlords.** Students may feel socially pressured to share hidden tokens immediately, bypassing the intended gridlock. To fix, instruct Warlords privately that their grade depends on *personal* token retention, not table SP. Alternatively, they may collude too easily if friends. Randomize Warlord assignment to prevent pre-existing alliances.

  **Limitation**
  **The Rentier State.** The game models institutional capacity, but not oil wealth. Gaddafi's state wasn't just hollow; it was a cash dispenser that bought silence. You must explain that in Libya, "governance" was actually "distribution," which the token system abstracts away. The game shows structural fragmentation, not economic incentive structures. The intervention didn't just break a state; it stopped the cash flow that substituted for a state. This is why Libya fractured faster than Iraq: there was no bureaucracy to loot, only wallets to fight over.
