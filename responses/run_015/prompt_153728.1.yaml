prompt: |-
  I'm taking a grad semenar on 19th century existantialism and we got into a pretty heated argument about Kierkegaard's Abraham and whether the teleological suspension of the ethical actually makes sense outside pure religious faith. My professor mentioned that in Fear and Trembling, Johannes de Silentio frames Abraham's willingness to sacrifice Isaac as suspending the universal moral law for the sake of his individual relation to God. But then someone in class brought up this idea I hadn't seen before — that the suspension might also apply to epistemic norms, not just moral ones. Like, Abraham refuses to explain himself to Sarah or Isaac, which is a kind of suspension of the ethical obligation to justify one's actions to others.

  So write an essay arguing whether the teleological suspension should be understood as applying only to first-order moral duties or whether it necessarily extends to second-order epistemic and communicative duties like transparency and giving reasons. Reach an actual conclusion — don't just say it depends — and defend it with specific reasons. And try to address whether this makes Abraham's silence more defensible or more disturbing. I don't need a biblography or citations, just a clear argument. Also, I might be wrong about de Silentio's framing — correct me if I'm misreading the structure of the problem.
