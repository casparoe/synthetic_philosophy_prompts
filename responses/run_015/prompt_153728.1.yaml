      *   *The User's Classmate's Point:* Abraham's silence (not telling Sarah, Isaac, or Eliezer) is part of the suspension. Is this just prudence, or is it a suspension of the *duty to communicate*?
      *   *My Task:* Argue for one side.
      *   *Option A:* It's only moral. Silence is incidental.
