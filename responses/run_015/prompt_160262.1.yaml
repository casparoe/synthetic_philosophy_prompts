answer: |-
  This is an exceptionally sharp meta-philosophical observation. You have correctly identified a structural feature of the discipline that is rarely articulated but rigorously enforced. Your "cartographic" hypothesis is the strongest candidate for the implicit theory, but it requires refinement to explain the specific tension between *recency* and *non-settlement*.

  Here is a reconstruction of the implicit theory of progress presupposed by current analytic political philosophy practices, followed by an analysis of where the practice is underdetermined and what would happen if the assumption were dropped.

  ### 1. The Implicit Theory: Progress as Dialectical Resilience, Not Convergence

  The field does not operate on a **convergent** model of progress (getting closer to *the* truth, rendering old falsified views obsolete) nor on a **flat** model (all positions are equally viable/defensible regardless of time).

  It operates on a model of **Dialectical Refinement** or **Conceptual Articulation**.

  *   **The Object of Progress:** It is not the *world* (which we are trying to describe) nor the *truth* (which we are trying to capture). It is the **space of reasons** (to use Brandom's terminology). Progress consists in making the commitments and entitlements of a position more explicit, more precise, and more resilient to known objections.
  *   **Why Recency Matters:** A paper from 1970 and a paper from 2020 might defend the *same proposition* (e.g., "Distributive justice requires X"). However, the 2020 paper is presumed to be **dialectically superior** because it is written in a vocabulary that has been stress-tested by the intervening 50 years.
      *   The 1970 paper does not know about the "leveling down objection," the "constitution of agency" critique, or the specific distinctions between "luck egalitarianism" and "relational egalitarianism."
      *   To cite only the 1970 paper is to offer a position that is "naive" to the current map of the logical space. It is not that the 1970 claim is *false*; it is that it is **under-defended**.
  *   **Why Nothing is Settled:** Because the goal is not to eliminate false positions but to clarify the **costs** of holding them. We don't refute utilitarianism; we clarify exactly what commitments one must accept to hold it. Therefore, a view from the 60s can be revived, but it must be revived *through* the literature of the 2010s. It must be "upgraded" to survive the current ecosystem of objections.

  **The Theory in a Sentence:** Progress is the increasing sophistication of the *terms of debate*, allowing for more precise calibration of the trade-offs between competing values, without necessarily eliminating any values.

  ### 2. Does the Recency Norm Require a Progress Claim?

  **Yes.** The recency norm is inconsistent with a truly "flat" view of philosophy.

  *   **The Flat View:** If philosophy were truly flat (e.g., a Nietzschean eternal return of the same fundamental errors, or a Wittgensteinian view that we only dissolve confusions which constantly re-emerge), then a 1970 paper would be just as "dialectically advanced" as a 2020 paper, provided the confusion it addresses is the same. On a flat view, citing the original source is *preferable* (Occam's razor).
  *   **The Reality:** We demand recent citations because we believe the **argumentative environment** has changed. This presupposes accumulation. We accumulate *objections*, *distinctions*, and *counter-examples*.
  *   **Is a 1970 paper ever equal to a 2020 paper?** Only in the **History of Philosophy** subfield. In that context, the object of study is the text itself, not the proposition's viability in the current space of reasons. In *political philosophy* (constructive work), a 1970 paper is never considered equal to a 2020 paper on the same topic, because the 2020 paper is assumed to have incorporated the "immune system" developed in the interim.

  **Where the practice is underdetermined:**
  The field claims it doesn't settle truths, yet it treats recent literature as "state of the art." This implies a **Lakatosian** view: we have competing research programmes. None have "won," but some are "degenerating" (failing to account for new objections) and some are "progressing" (absorbing new anomalies). The recency norm forces you to show your programme is not degenerating.

  ### 3. What if We Gave Up the Progress Assumption?

  If the field explicitly adopted a "No-Progress" view (e.g., "Philosophy is purely expressive" or "Philosophy is eternal therapy"), the current practices would collapse or radically shift.

  **A. The Original Contribution Requirement**
  *   **Current:** You must add a new brick to the cathedral (even if the cathedral is never finished).
  *   **No-Progress:** "Originality" becomes meaningless. If we aren't refining a shared map, you are just drawing a *different* map. The requirement would shift from "contribution to the literature" to "coherence of vision" or "therapeutic efficacy." Dissertations would look more like creative non-fiction or personal manifestos.

  **B. The History/Contemporary Split**
  *   **Current:** History = Exegesis/Reconstruction. Contemporary = Argument/Application.
  *   **No-Progress:** This split dissolves completely. If there is no dialectical accumulation, Plato is a contemporary. You wouldn't study Plato to see "where we came from"; you would study him because he articulates a position as well as anyone ever could. The distinction between "History of Political Thought" and "Political Theory" would vanish. (Note: Some departments, like Chicago or St. John's, already lean this way, but they are outliers in the analytic mainstream).

  **C. The "Outdated" Label**
  *   **Current:** A paper is outdated if it ignores a distinction made in 1995 that undermines its 1980 premise.
  *   **No-Progress:** Nothing is outdated. A 1950 argument is valid if it is valid. We would stop saying "You haven't engaged with X's 2010 critique" and start saying "Your argument is invalid." The sociological pressure to be "current" would be exposed as mere fashion.

  ### 4. Concrete Changes in Refereeing and Training

  If the field abandoned the "Dialectical Refinement" model for a "Flat/Expressive" model:

  1.  **Refereeing:**
      *   **Stop:** "This paper fails to engage with the debate between X and Y (2015)."
      *   **Start:** "This argument is internally inconsistent" or "This vision is uninteresting."
      *   **Stop:** Rejecting papers for reviving "dead" views.
      *   **Start:** Evaluating the internal strength of the revived view, regardless of its history.
      *   **Result:** Review times might decrease (less literature to check), but acceptance criteria would become more subjective (based on the referee's taste rather than procedural omission).

  2.  **Graduate Training:**
      *   **Stop:** Comprehensive exams based on "fields" defined by recent debates (e.g., "Distributive Justice 1990–Present").
      *   **Start:** Training in logical analysis, rhetorical persuasion, or deep textual mastery.
      *   **Stop:** The pressure to "niche down" to find an unoccupied spot on the map.
      *   **Start:** The pressure to articulate a comprehensive worldview.
      *   **Job Market:** The "publications" metric would lose its force. If there is no accumulation, a single great book is worth more than ten incremental papers. The "pipeline" model of PhD production would break.

  ### 5. Resolving the Tension: Novelty vs. Non-Settlement

  You asked whether "novelty is mandatory" and "nothing is ever settled" are in tension. Under the **Convergent** model, they *are* in tension. (If we haven't settled it, why can't I just repeat the old argument? If we have settled it, why do I need to say something new?)

  Under the **Dialectical/Cartographic** model, the tension dissolves. Here is why:

  *   **The Chess Analogy:** In chess, the board (the fundamental problems) never changes. The rules (logic) don't change. No game is ever "settled" in the sense that chess is "solved." Yet, you cannot play a game by repeating moves from 1970. Why? Because your opponent (the referee/community) knows the 1970 moves and has prepared counters.
  *   **Novelty as Resilience:** You are required to make a "novel contribution" not because the *truth* has changed, but because the **defenses** must change. To defend Rawlsianism in 2024 requires different moves than in 1974 because the "attackers" (libertarians, realists, feminists) have developed new weapons.
  *   **The "Move" Metaphor:** Philosophy is treated as a game of moves within a space of reasons. A "contribution" is a new *move* that preserves the position against current threats. A "settled" thesis would be a checkmate. Since there are no checkmates, the game continues, but you must play *competently* according to the current meta-game.

  ### Summary of the Implicit Theory

  The field presupposes **Progress in Articulation without Progress in Finality.**

  1.  **Recency Norm:** Justified because the *vocabulary of objection* accumulates. To speak without the new vocabulary is to be unintelligible or easily defeated.
  2.  **Non-Settlement Norm:** Justified because the *fundamental commitments* (values, metaphysical intuitions) do not accumulate; they compete.
  3.  **Originality Norm:** Justified because holding a position requires constant re-articulation to survive the evolving ecosystem of objections.

  **The Cynical/Sociological Footnote:**
  While the above is the *charitable* reconstruction of the implicit theory, you must also acknowledge the **Bourdieuian** reality. The recency norm functions as a gatekeeping mechanism to ensure professional reproduction. It forces young scholars to cite established senior scholars (the referees), ensuring the circulation of academic capital. If the field admitted that a 1970 paper was sufficient, the citation economy would crash, and the power of current "star" philosophers would diminish. The "Dialectical Refinement" theory is the *idealized* story the field tells itself to make sense of a practice that is partly driven by professional self-preservation.

  **Advice for your work:**
  When writing, treat the "recent literature" not as a body of truth, but as a **lexicon**. You must use the current lexicon to ensure your arguments are parsed correctly by the gatekeepers. But do not feel pressured to believe that the recent literature is *deeper* than the classics. It is merely more *armored*. Your job is to take the classic insight and fit it with the modern armor. That is the "original contribution" the field actually wants.
