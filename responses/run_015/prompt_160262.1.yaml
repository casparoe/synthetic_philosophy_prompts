  8.  *(Self-Correction on the "Progress" definition)*: I need to be careful not to conflate "progress" with "truth." The field presupposes progress in *clarity* and *argumentative resilience*, not necessarily *correctness*. This is the key to unlocking the user's puzzle.

  9.  *(Final check on the History/Contemporary split)*: In political philosophy, this is often blurred (e.g., reading Hobbes to understand realism). But the *method* differs. History = exegesis + reconstruction. Contemporary = argument + application. If progress is dropped, this method distinction collapses.

