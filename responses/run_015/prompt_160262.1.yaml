      *   *The "Original Contribution" paradox:* If nothing is settled, how do you contribute? You contribute a *new configuration* of existing commitments. Like a new chord progression in music. The notes (concepts) aren't new, the song is.

  7.  **Final Polish:**

      *   Ensure the tone is appropriate for a PhD student (collegial, rigorous, not patronizing).
