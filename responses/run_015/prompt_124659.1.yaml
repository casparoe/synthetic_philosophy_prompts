answer: |-
  The 2022 Act ultimately proves that legal systems are structurally incapable of processing expected-value moral reasoning, preferring binary thresholds of evidence over the sheer arithmetic of suffering. When you look at who actually held the pen, it was the government department responsible for environment and food relying on the independent review authors to draw the line, and their task was not to calculate total expected suffering but to determine where scientific evidence crossed a bar of sufficient certainty. This distinction reveals that the policymakers were operating on a hidden threshold model of moral status rather than a probabilistic one, treating sentience as a status you either possess or lack based on the weight of current data, rather than a gradient of probability that should be multiplied by population size. In this framework, the implicit probability of consciousness assigned to a crab is treated as functionally one, while the probability assigned to a bee is treated as functionally zero for legislative purposes, not because the reviewers believed bees were definitely insentient, but because the evidence did not meet the burden of proof required to trigger regulatory machinery.

  If you run the scale argument through this decision, the arbitrariness of that threshold becomes glaring, because the sheer biomass and individual count of farmed and wild insects dwarfs that of decapods and cephalopods by orders of magnitude. Even if you assign a vanishingly small probability of sentience to an insect, multiplying that fraction by trillions of individuals yields an expected value of suffering that vastly outweighs the high-confidence suffering of a few million crustaceans, yet the Act ignores this calculus entirely. This suggests the scale argument does not collapse the threshold model so much as expose it as a administrative convenience rather than a moral necessity, showing that the legislation was designed to manage political and enforceable risk rather than to minimize actual harm. The decision-makers were not asking how much suffering exists in the world, but rather where they could impose duties without breaking the legal system, and insects represent a category where the cost of verification and enforcement becomes prohibitive.

  This is where the scale argument breaks against the hard surface of legislative drafting, because welfare rules require an identifiable duty-bearer and a clear, enforceable harm to be legally valid. You cannot write a statute that holds a farmer responsible for the welfare of trillions of individuals when the monitoring technology does not exist to assess the state of a single one, nor can you define a harm standard for creatures whose behavioral indicators of pain are still debated. The law needs binaries to function, requiring clear definitions of who is protected and who is responsible, whereas the scale argument operates in the realm of continuous probabilities and aggregate outcomes that defy easy codification. Consequently, this episode demonstrates that the scale argument was never meant for lawmaking in its current form, or rather, that lawmaking is structurally bad at expected-value reasoning across species because it prioritizes operational clarity over moral completeness. The Act reveals that when forced to choose between a morally robust but unenforceable inclusion of insects and a morally incomplete but enforceable inclusion of crustaceans, the legal system will always choose the latter, leaving the scale argument as a philosophical critique that the machinery of state is simply built to ignore.
