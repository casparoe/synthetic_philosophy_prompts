      *   *Objection 7 (Hope Nobody Asks - Utilitarian):* "So, given all this uncertainty, are *you* eating steak next week?"
      *   *Reply:* "I'm maintaining status quo consumption until the variance on wild welfare narrows, which looks like hypocrisy but reflects epistemic humility. Changing diets on unstable premises causes signal noise without guaranteed welfare gains. I'm not recommending steak, just withholding the chicken imperative."
      *   *Soft:* Status quo bias is intellectually lazy.
