answer: |-
  1. Billy jumping around doesn't actually reverse the thermodynamic arrow because the physical events around him still decay and burn forward regardless of his perception. It just shows his consciousness can access memories out of order without actually lowering the entropy of the universe.

  2. The Tralfamadorians definitely sound like they're describing a block universe where every moment exists permanently, making the flow of time just a trick of how we perceive it. In their view, the arrow isn't a physical law but just a limitation of human consciousness moving through the blocks.

  3. That looping bird-song doesn't mean the book defied physics by lowering entropy, since writing the words still burned energy and created mess. It's just literary framing to show how trauma makes time feel circular even if the physical world keeps marching toward disorder.

  4. Billy's acceptance actually works better in the timeless view because if every moment exists forever, then the dead are still alive in their own time slots. He doesn't need the arrow to be real to make peace with death, since in a block universe, nobody ever truly disappears.

  5. Physics papers treat time as a clean coordinate, but Vonnegut shows how human trauma shatters that linearity so the past feels more present than the now. The novel captures how psychological entropy can scramble our internal clock even if the external universe stays orderly.
