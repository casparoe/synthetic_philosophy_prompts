answer: |-
  The thinker you are half-remembering is **Otto Neurath**, a central figure in the Vienna Circle of Logical Positivists. Neurath advocated for "physicalism"—a unified language of science based on observable physical events—to guide social planning, yet he famously argued that this linguistic framework was not discovered in nature but was a **conventional choice**, like sailors rebuilding their ship at sea without ever docking ("Neurath's Boat").

  Your intuition is correct: the consultant is wielding a simplified, hardened version of Logical Positivism that even its original architects struggled to maintain. She is relying on the **fact/value dichotomy** (often attributed to Hume, codified by Positivists like A.J. Ayer), which claims science handles empirical "means" while values are merely non-cognitive emotional "ends." However, contemporary philosophy of science and social theory has largely dismantled this sharp split.

  Here is the rational breakdown of why the consultant's position is flawed and why your board's debate is not arbitrary:

  **1. The "Hidden Move" is Constitutive, Not Just Instrumental**
  The consultant claims the algorithm handles facts (means) and the board handles values (ends). But selecting "bike-traffic flow" as a primary metric is not a neutral observation of reality; it is a **constitutive judgment** that defines what a trail *is*. If you define a trail primarily as a conduit for movement, you have already decided that efficiency matters more than停留 (staying/lingering). If you define it as a habitat or a place of memory, "fishing spots" become the metric. As Hilary Putnam argued in *The Collapse of the Fact/Value Dichotomy*, many concepts we treat as factual (like "efficient," "healthy," or "coherent") are actually "thick ethical concepts" that are entangled with evaluation. You cannot describe the system without already valuing certain functions over others.

  **2. Framework Choice is Rational, Not Arbitrary**
  If values were merely "expressions of feeling" (emotivism), your board vote would indeed be arbitrary noise—a contest of volume rather than reason. But values are subject to rational deliberation. We can argue about frameworks based on **adequacy** (does this model capture the full range of human experience here?), **consistency** (does this metric contradict other town goals?), and **consequences** (who benefits and who loses if we prioritize flow over place?). The choice of vocabulary is conventional, as Neurath admitted, but conventions are chosen for *reasons*. A framework that ignores local attachment to fishing spots is not "more scientific"; it is less adequate to the social reality it claims to measure.

  **3. The Illusion of Neutrality**
  By treating the algorithm's output as "objective" and the board's input as "subjective," the consultant creates a power imbalance. It frames any objection to the metrics as an objection to science itself. This is a category error. The math is internal to the framework, but the framework itself is political. There is a rational basis for choosing one framework over another: the one that best allows stakeholders to articulate their legitimate claims about what makes a life go well in that space.

  Verdict: The consultant's algorithm is not a neutral tool delivering facts, but a political argument encoded in math, because selecting which variables count as data is itself a value-laden decision that determines whose interests are visible.
