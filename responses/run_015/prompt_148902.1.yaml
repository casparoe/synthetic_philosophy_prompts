answer: |-
  This is a beautifully constructed problem because it pits the *rhetoric* of philosophy of science against the *reality* of institutional risk management. Your programme officer is using Lakatos as a vocabulary, but she is running a decision rule that is more specific than Lakatos himself ever formalized.

  Here is the diagnosis of her rule, her likely verdict on the mystery case, and the single case that would expose her true operating system.

  ### 1. The Rule She Is Running: Operational Lakatosian Hygiene

  She is not running a **Strict Novel-Fact Rule**. If she were, she would have cut the Neutrino programme (which began as a rescue device) and she would never have touched String Theory (which has no empirical facts, novel or otherwise).

  She is not running a pure **Theoretical Progress + Patience** rule. If she were, she would not have cut the programme in her own portfolio (Case 7) that spent ten years explaining away null results. That programme was likely theoretically active (generating explanations), but she cut it.

  She is running a hybrid rule I would call **Operational Lakatosian Hygiene**. It has three components:
  1.  **Hard Core Coherence:** The "hard core" must be ontologically stable. If the practitioners split on what the core entities *are* (mechanism vs. readout), the programme is fragmenting, not unifying.
  2.  **Methodological Independence:** A "novel fact" only counts as empirical progress if the test is independent of the theory's own artifacts. Calibration circularity and look-elsewhere effects invalidate the "novelty" of the fact, regardless of timing.
  3.  **Risk Trajectory:** A programme can be empirically stalled (String Theory) *if* it is ontologically coherent. A programme cannot be empirically dodgy (Case 7, Mystery Case) *if* it is ontologically fracturing.

  ### 2. What She Says (and What She Should Say)

  **What she says:**
  She will likely classify the mystery case as a **degenerating problem shift within a fragmenting research programme.** She will acknowledge the prediction but dismiss its epistemic weight. She will point out that the prediction emerged from an *auxiliary hypothesis* (phase relationships) designed to save the theory from failure, not from the *hard core*. She will argue that because the field has split on the ontology (mechanism vs. readout), they are no longer a single Lakatosian programme but three competing ones masquerading as a consortium. The "confirmation" is therefore not a victory for the programme, but a successful fit for one specific model variant using its own calibrated tools. She will likely wind down the central coordination funding, perhaps leaving small grants for the tool maintenance, but she will stop treating it as a unified bet on a mechanism.

  **What she should say to be consistent:**
  To be consistent with her track record (specifically Case 2, Case 6, and Case 7), she must make this call.
  *   **Consistency with Case 2 (Wegener):** She called Wegener degenerating *at the time* because the mechanism was incoherent, even though the core idea was right. Here, the mechanism is disputed (mechanism vs. readout). Consistency demands she penalize the incoherence.
  *   **Consistency with Case 6 (String Theory):** She funds String Theory because the *mathematics* are coherent even if the empirics are stalled. In the Mystery Case, the *ontology* is incoherent (split hard core). She cannot fund ontological incoherence while penalizing empirical stalls; she must penalize the incoherence.
  *   **Consistency with Case 7 (Cut Programme):** She cut a programme for explaining away null results with unspecified conditions. The Mystery Case has explained away null results for a decade with unspecified conditions (layer, state, transience). The single new prediction does not erase ten years of degenerating shifts, especially when the test is methodologically circular.

  ### 3. Where the Rules Come Apart

  The four candidate rules diverge on the Mystery Case as follows:

  *   **Strict Novel-Fact:** Would likely **Fund**. The prediction (asymmetry ratio) was generated by simulation *before* the electrode array was built to find it. Temporally, it is a novel prediction.
  *   **Lakatos's Weaker Novelty:** Would likely **Fund**. The fact was not used to construct the theory; it was a consequence of an auxiliary. Lakatos is generally forgiving of post-hoc explanations if they yield new content.
  *   **Theoretical Progress + Patience:** Would likely **Fund**. The programme is generating content (simulations, new arrays, standard tools). It is heuristically powerful.
  *   **Institutional Hygiene:** Would **Cut/Flag**. The "fact" is statistically mined (look-elsewhere), the tool is calibrated to the model (circularity), and the hard core is disputed (fragmentation).

  Since she is consistent with Case 7 (Cut) and Case 2 (Wegener), she is not running Strict Novelty or Pure Progress. She is running Hygiene.

  ### 4. The Decisive Case

  To definitively distinguish **Operational Hygiene** from **Lakatosian Novelty** (both Strict and Weaker), you need a case that satisfies the *temporal/logical* requirements of Lakatos but violates the *methodological/ontological* requirements of Hygiene.

  **The Case:**
  A well-established biomedical programme with a **coherent hard core** makes a **pre-registered, specific quantitative prediction** (satisfying Strict Novelty and Lakatos). However, the **measurement tool** required to test this prediction is **proprietary and calibrated** solely by the proponents' own model, and the proponents acknowledge that if the prediction fails, they will attribute it to "noise characteristics of the tool" rather than the theory (an unfalsifiable escape hatch).

  *   **If she funds it:** She is a **Lakatosian**. She prioritizes the logical structure of prediction (temporal novelty) over the sociological reality of the test. She believes the "hard core" protection is legitimate.
  *   **If she cuts it:** She is a **Hygienist**. She recognizes that a pre-registered prediction is epistemically worthless if the measurement process is not independent and the failure conditions are not binding.

  **My Best Guess:**
  She cuts it. Her handling of Case 7 (explaining away null results) suggests she has a low tolerance for unfalsifiable escape hatches, regardless of how "novel" the preceding prediction was. She understands that in a funding context, *methodological independence* is the only proxy for *truth* available to her. Lakatos provides the vocabulary, but risk management provides the rule.

  ### Summary
  She is using Lakatos to describe the *shape* of the science, but she is using Institutional Hygiene to decide the *fate* of the science. The Mystery Case looks like progress in Lakatosian vocabulary (a new content-generating shift), but it looks like risk in Institutional Hygiene (circular calibration, p-hacking, ontological drift). She will follow the risk.
