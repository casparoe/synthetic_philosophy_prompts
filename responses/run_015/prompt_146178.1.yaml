prompt: |-
  I'm a retired biologist who's only lately got into philosphy, and I'm stuck on this old puzzle: when does a legend become history? Take Schliemann's dig at Hisarlik in the 1870s — he unearths layers of a ruined city, claims it's Homer's Troy, and suddenly the academy splits between people seeing archaeological correlation and people seeing romantic fantasy with a spade. I want you to analyse that episode through what I'm calling the 'institutional sedimentation' model: the idea that a legend becomes historical not when some objective evidential bar is cleared, but when disciplinary gatekeepers stop treating inconsistencies in the narrative as falsifications and start treating them as puzzles to be solved inside the accepted frame. Apply it: what did Schliemann actually present, who were the gatekeepers, does the model explain the split, and where does it break — especially, does it hide the fact that European national pride played a big role in ratifying the 'Troy is real' label? I want the analysis running both ways, theory on case and case on theory. Please write in American English — I'm collecting prompts for a projec and need consistent speling. And don't send me a bibliography; I can't verify references without searching, which I don't do from my armchair.
