answer: |-
  This is a compelling framework, especially coming from a biological background. You are essentially proposing a sociological analog to biological taxonomy: a specimen does not become a "type specimen" merely by existing in the dirt, but by being cataloged and accepted by the museum. In philosophy of science, this echoes Thomas Kuhn's idea of paradigm shifts, but you are applying it to historiography. The core mechanism you identify—the shift from treating inconsistencies as falsifications to treating them as internal puzzles—is the precise moment a claim gains institutional tenure.

  Let's run this analysis both ways, as you requested. First, we will apply your model to the Schliemann episode to see how well it fits. Then, we will use the Schliemann episode to stress-test the model and see where it cracks.

  ### Part 1: Theory on Case (Applying Institutional Sedimentation)

  **What Schliemann Presented**
  Heinrich Schliemann did not present a clean dataset. As an amateur, his excavation methods at Hisarlik (beginning in 1871) were destructive. He dug massive trenches through upper layers to get to what he assumed were the lower, Homeric layers. He presented a mix of hard material evidence (walls, pottery, gold jewelry) and a rigid narrative overlay (this is King Priam's treasure, this is the Scaean Gate).

  The evidence was contradictory. The stratigraphy did not perfectly match the Homeric timeline. The artifacts spanned different eras. In a strict Popperian scientific model, these inconsistencies should have falsified the hypothesis that "This is Homer's Troy."

  **The Gatekeepers**
  In the 1870s, the gatekeepers were primarily classical philologists—scholars of the text, not the dirt. To them, Homer was poetry, not history. Their criterion for acceptance was textual consistency. When Schliemann claimed a specific cup belonged to a specific hero, the philologists saw this as category error. However, a new breed of gatekeeper was emerging: the field archaeologist. They cared less about the poetic truth of Homer and more about the material reality of Bronze Age civilizations.

  **The Shift: From Falsification to Puzzle**
  Your model predicts that the legend becomes history when the gatekeepers stop saying "This proves you wrong" and start saying "How do we fit this in?"

  Initially, the inconsistencies were treated as falsifications. Critics pointed out that the walls Schliemann found were too old for the Trojan War described by Homer. Under a strict evidential bar, the project should have been abandoned as a romantic fantasy.

  However, the "institutional sedimentation" occurred when the academic community shifted the goalposts. They stopped asking, "Is this exactly Homer's Troy?" and started asking, "Which layer is the Homeric city?" This is the crucial pivot. By accepting Hisarlik as *a* major Bronze Age citadel, the institution validated the core legend (Troy existed) while relegating the specific inconsistencies (Schliemann's dating) to solvable puzzles. The narrative hardened into history not because Schliemann was right about everything, but because the discipline decided the site was too valuable to discard. The inconsistencies became fodder for future dissertations rather than reasons for rejection.

  **Does the Model Explain the Split?**
  Yes. The split in the academy was essentially a conflict between two institutional frames.
  1.  **The Philologists:** Operated under a frame where inconsistencies between text and material were falsifications of the text's historicity.
  2.  **The Archaeologists:** Operated under a frame where inconsistencies were puzzles of stratigraphy.

  The legend became history when the Archaeologists gained enough institutional power to override the Philologists. The "sedimentation" was the layering of archaeological consensus over the textual skepticism. Once the majority of journals and museums treated Hisarlik as a historical site, the legend had successfully migrated into history.

  ### Part 2: Case on Theory (Stress-Testing the Model)

  Now let's reverse the flow. We use the historical reality of Schliemann's Troy to probe the weaknesses of your "Institutional Sedimentation" model.

  **The Blind Spot: National Pride and Power**
  Your model assumes a relatively closed system where disciplinary gatekeepers make decisions based on internal logic (puzzle vs. falsification). The Schliemann case suggests this is too clean. It hides the external pressure of European nationalism.

  Schliemann was operating during the rise of the German Empire (unified in 1871). Germany was eager to establish a cultural heritage that rivalled Britain and France. Schliemann's discovery was not just accepted because it solved puzzles; it was ratified because it served a political narrative. The "Priam's Treasure" was smuggled to Berlin and displayed as a German triumph.

  If the institutional gatekeepers were purely academic, the discrepancies in Schliemann's documentation (he likely staged some finds) might have led to a slower acceptance. Instead, the acceptance was accelerated by national pride. The "history" label was applied partly because powerful states wanted it to be history. Your model risks treating the institution as a neutral filter, when in reality, the institution was being funded and guided by nationalistic agendas. The sedimentation wasn't just academic; it was political.

  **The Material Constraint**
  As a biologist, you know that at some point, the specimen dictates the classification. You cannot classify a mammal as a bird simply because the institution wants to. The Schliemann case shows where your model might lean too far into social constructivism.

  Schliemann could not have claimed just any site was Troy. He needed a mound with ruins. The material reality acted as a constraint. If Hisarlik had been empty dirt, no amount of institutional gatekeeping would have turned it into history. The model explains the *validation* of the claim, but it underplays the *generation* of the claim. The evidence had to be substantial enough to force the gatekeepers to engage with it. The model explains why bad data was tolerated, but it doesn't fully account for why the data was compelling enough to start the process. There is an objective evidential bar, even if it is lower than the purists claim.

  **The Role of the Outsider**
  Your model relies on "disciplinary gatekeepers." Schliemann was explicitly an outsider. He was wealthy, independent, and often hostile to the academy. He bypassed the gatekeepers by going straight to the public and the press.

  In this case, the sedimentation happened from the bottom up (public fame) and the outside in (political pressure), rather than top-down from the academy. The academy eventually capitulated to Schliemann, rather than Schliemann winning over the academy through standard peer review. This suggests your model needs to account for how external actors can force sedimentation by changing the cost of rejection. It became too embarrassing for the academy to keep calling him a fraud when he kept pulling gold out of the ground.

  ### Synthesis

  Your "Institutional Sedimentation" model is robust because it captures the human element of historical validation. It correctly identifies that history is not just what happened, but what the profession agrees to teach. In the Schliemann case, it perfectly explains how a site can remain "Troy" even after the specific identification of the layers is proven wrong. The legend survives because the institution has invested too much capital in the frame to abandon it.

  However, the case study reveals that the model is incomplete without a theory of power. The gatekeepers do not sit in a vacuum. They are influenced by national funding, public sentiment, and the charisma of the discoverer. The transition from legend to history at Troy was not just a shift from falsification to puzzle-solving; it was a convergence of archaeological potential, German national ambition, and Schliemann's own relentless self-promotion.

  For your project, I would suggest refining the model to include "External Pressure" as a variable that accelerates sedimentation. In biology, this might be akin to how a certain classification becomes standard not just because of genetic data, but because a dominant research group pushes it. The Schliemann episode proves that while evidence provides the raw material, institutions provide the structure, and politics provide the mortar.
