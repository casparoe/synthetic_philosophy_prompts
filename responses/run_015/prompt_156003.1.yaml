  **What Peirce had**
  Peirce defined belief as a habit of action and doubt as an irritating hesitation that prompts inquiry. In "The Fixation of Belief," he outlined four methods to settle opinion. Tenacity clings to comfort but fails because the "social impulse" forces us to notice others disagree. Authority imposes dogma but fails when we realize other states enforce different dogmas. The A Priori method follows what feels reasonable but collapses into fluctuating metaphysical fashion. Only the Scientific Method succeeds because it submits inquiry to an external permanency—reality itself—forcing a community of inquirers to converge over time. The first three are introspective or coercive; the last is experimental. Peirce argued that without the friction of an external world or conflicting social views, belief fixation is merely delusion management.

  **The diagnosis**
  The engagement feed is Tenacity surgically reinforced. Peirce argued Tenacity naturally collapses because humans are social animals; we cannot help but notice conflicting beliefs, which sparks doubt. The algorithm solves this "design flaw" by curating a private public where disagreement is filtered out before it causes irritation. It is not Authority, because there is no central state enforcing orthodoxy, but rather a fragmented thousand micro-authorities (influencers) validated by engagement metrics. Users choose their own masters, mistaking submission for choice. It mimics the Scientific Method's community structure—sharing data, linking sources—without the external reality check. Users feel they are inquiring together, but the "external permanency" is replaced by optimization for retention. The feed doesn't just allow Tenacity; it industrializes it. It creates a stable epistemic bubble where the social impulse, instead of breaking stubbornness, validates it. Peirce would diagnose this not as a new method, but as a technological bypass of the very friction required to move people from Tenacity toward Science. It makes stubbornness sustainable by removing the social cost of being wrong. It is a method of belief fixation that successfully isolates the believer from the very community that was supposed to correct them, turning the social impulse into a tool for isolation rather than convergence.

  **Good faith**
  Peirce would reject the moral framing of "bad faith." For him, error is methodological, not necessarily malicious. When an opponent refuses to concede, they aren't lying; they are operating within a closed system where their beliefs are fixed by comfort or tribal authority, not external resistance. Fallibilism requires acknowledging one's own potential error, but polarization treats error as a sin rather than a step in inquiry. Therefore, the other side isn't arguing in bad faith; they are arguing in *no* faith—they are ritualizing belief fixation. To call them pathological is accurate, but only in an epistemic sense. They are suffering from a blocked inquiry process. Accusing them of dishonesty assumes they are playing the same game of truth-seeking, when Peirce would say they are playing a game of belief-maintenance. The conflict isn't between two truths, but between a method open to reality and one sealed against it. You cannot reason someone out of a position they didn't reason themselves into, especially when their method prohibits the entry of doubt.

  **Where it breaks**
  Where Peirce's framework strains is the monetization of doubt itself. He assumed inquiry aims to settle doubt to reach belief. Social media platforms often profit by keeping users in a state of perpetual agitation—doubt without resolution. Peirce believed the social impulse would inevitably push us toward comparison and eventual convergence. He didn't anticipate a technology that could weaponize the social impulse to drive divergence indefinitely. Furthermore, Peirce relied on the "external world" being a shared constraint. In a deepfake economy, the external permanency is itself contested. If reality is mediated through screens that can be altered instantly, the Scientific Method loses its anchor. The community of inquirers isn't just fragmented; it's inhabiting different simulated realities. Peirce's long-run convergence assumes a stable universe; the feed assumes an unstable attention economy. The system isn't designed to fix belief, but to harvest the energy of unresolved belief, turning the irritation of doubt into a revenue stream rather than a prompt for investigation.

  **What he'd prescribe**
  Peirce would veto the editor's cure. Simply showing people the other side assumes the problem is a lack of information, rather than a flawed method of fixation. If you feed contrary evidence to someone entrenched in Tenacity, they won't update; they will fortify. Peirce's prescription isn't more argument, but shared engagement with a recalcitrant reality. You need situations where both sides are forced to confront the same external constraints—working on a project, solving a physical problem—where reality pushes back equally on both. Truth isn't found in debating opinions, but in shared action. The editor wants to broaden the feed; Peirce wants to break the screen. Exposure without a shared method of testing is just noise. The editor is trying to use the Method of Authority (trust the newspaper) to fix a Method of Tenacity problem. It won't work.

  **Lines for the scene**
  1. "Peirce knew Tenacity fails because you can't ignore your neighbors. Zuckerberg fixed the neighbors."
  2. "You think they're lying? No, they're just successfully insulated. It's not malice, it's architecture."
  3. "Your 'facts' are just ammunition for their tenacity. You're feeding the machine you want to stop."
  4. "Peirce said truth is what the community agrees on eventually. Now the community is algorithmically segregated into forever."
  5. "You want to show them the other side? Great. Then turn off the feed that tells them the other side is evil."
