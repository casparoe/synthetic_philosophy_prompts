      The user correctly identifies the contradiction: "One shot" implies $N=1$ (don't average), but sometimes implies $N=\text{huge}$ (compounding risk makes $P(\text{failure}) \to 1$). These are mathematically distinct arguments. I need to disentangle them.

  3.  **Drafting the Menu of Theses:**

      *   *Thesis 1: The Reputational One-Shot.* (Trivial/Platitude). One big scandal kills the company.
      *   *Thesis 2: The Non-Ergodicity Claim.* (Substantive/Defensible). Time average $\neq$ Ensemble average. Ruin is absorbing.
