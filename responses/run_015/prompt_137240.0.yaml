      *   *Thesis 4: The Compounding Risk Claim.* (Substantive/Defensible). $1 - (1-p)^N$. If $N$ is large, small $p$ is dangerous. *Wait, this contradicts "One Shot" literally, but aligns with the spirit of "no margin for error".*
      *   *Thesis 5: The Irreversibility Claim.* (Radical/Defensible). Some states cannot be rolled back (e.g., info hazard, physical harm).
