prompt: |-
  Me and my friend (she's mid-PhD in philosophy of biology, I'm just a TA for our upper-level phil bio seminar) had a four-hour argument last night after a class on functions and I'm still not sure who won, so I'm turning it into an exam question instead. I've been asked to write one essay question for the final: 60 minutes, in class, closed book, 20 marks. I want something where you can't get above a B by opening with "the etiological account traces function to selection history, the causal-role account to what the trait currently contributes," listing three stock objections to each, and closing with "both have insights."

  Here's the case I've been building, which you can rewrite but please keep the structure. A burrowing rodent has a bony ridge above the eye. The ridge was originally shaped by selection for deflecting the strike of a particular predator. That predator vanished from the range about 8,000 years ago, so the ridge no longer does that. It now does something else useful: it channels groundwater toward the corner of the eye and keeps the cornea from drying out, which helps the animal's vision and thereby its survival. But the population has been small and isolated for the last couple of hundred generations, and the best available estimates suggest the reproductive advantage this channeling confers is small relative to drift, so it has probably not been effectively visible to selection during that period. Two loss-of-function mutants have appeared in that window and both disappeared, but plausibly by chance. My friend calls the ridge's status here "vestigial momentum" — selected for something it no longer does, doing something beneficial it hasn't yet been selected for — and she distinguishes an origin-selected function from a maintenance-selected one. I think that's just exaptation with extra steps; she says it's not, because exaptation normally gets cashed out as a trait that got co-opted and then selected for its new role, whereas here the new role may never have fed back into differential reproduction at all. Settling that disagreement is most of what I want the question to do.

  So: give me the question as I'd hand it to students, a model answer of roughly 700 words, and a marking scheme out of 20 that names the specific must-hit moves, the marks each is worth, and one line per point on how people typically get it wrong — enough that I can tell an A from a B from a C. The crux I want them to hit is not "which account is right" but what each account has to say about how recent the relevant history has to be: does the etiological view require the original selection episode, any selection episode, or ongoing selection, and if it requires ongoing selection, does it collapse into the causal-role view in the limit? I'd also like a second part: a lab-built organism whose lineage never had the ridge but into which an identical structure is engineered and which does the channeling perfectly. Does the disagreement about that organism show the two accounts are answering different questions, or is that pluralism a real resolution rather than a shrug? And my friend insists the question should make them say what function-talk is for — explaining why the trait is there, explaining what it does for the organism now, or telling us when it's malfunctioning — because she claims the malfunction case is where the causal-role account has to quietly smuggle in a norm it isn't entitled to. I don't fully get why she says that, so the model answer should spell it out.

  Two practical things. Please keep it self-contained: no reading lists, citations, or "see so-and-so 1989," since neither I nor the students will have library access. And be explicit throughout about which moves are the settled, teachable part of this debate and which are you taking a side — if the marking scheme rewards a particular answer to the origin-selected/maintenance-selected question, flag that a strong student could reasonably go the other way and say what that answer would have to contain to still earn full marks. Also tell me honestly if "vestigial momentum" is already a thing under some other name I should be using. Sorry if this is over-specified, I've just been arguing about it since 9pm.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**

      *   **Context:** TA and PhD friend argued for 4 hours about functions in philosophy of biology (etiological vs. causal-role).
      *   **Task:** Create a final exam essay question (60 mins, closed book, 20 marks), a model answer (~700 words), and a detailed marking scheme.
      *   **Core Case:** A burrowing rodent with a bony ridge.
          *   *History:* Selected for predator deflection (now extinct, 8k years ago).
          *   *Current Effect:* Channels groundwater to eyes (beneficial).
          *   *Current Selection:* Population small/isolated, benefit small relative to drift. Mutants disappeared by chance, not selection.
          *   *Friend's Term:* "Vestigial momentum" (origin-selected vs. maintenance-selected).
          *   *User's View:* It's just exaptation.
          *   *Friend's Counter:* Exaptation implies new selection; here, new role might not be selected yet.
      *   **Key Philosophical Crux:** How recent must selection history be for the etiological account? Does requiring ongoing selection collapse it into causal-role?
      *   **Part 2:** Lab-built organism (identical structure, no history). Does this show pluralism or different questions?
      *   **Part 3:** What is function-talk *for*? (Explanation of presence, current contribution, or malfunction?). Friend claims causal-role struggles with malfunction norms.
      *   **Constraints:** Self-contained (no citations), explicit about settled vs. contested moves, flag where alternative views get full marks, check if "vestigial momentum" is a real term.
      *   **Tone:** Academic, precise, helpful for a TA grading finals.

  2.  **Deconstruct the Philosophy:**

      *   **Etiological Account (Selected Effects):** Function = what the trait was selected *for*. (Millikan, Neander).
          *   *Problem case:* The ridge. Original selection is gone. Is it still a function? Strict etiological says yes (historical). Maintenance etiological says maybe (if currently selected).
          *   *Drift issue:* If the new benefit isn't selected (drift dominates), etiological accounts struggle to assign the *new* function.
      *   **Causal-Role Account (Systemic):** Function = what the trait *does* in the system. (Cummins).
          *   *Problem case:* Malfunction. If a heart pumps blood, that's its role. If it fails, it still has the function. But how do we distinguish "function" from "mere effect" without norms? Cummins uses analytical explanation, but norms are tricky.
      *   **Exaptation:** Trait selected for X, now used for Y. Usually implies Y is currently beneficial/selected. The prompt's case is weird because Y *might not be selected yet* due to drift.
      *   **"Vestigial Momentum":** This is *not* a standard term in phil bio. It sounds like a mashup of "vestigial structure" and "evolutionary momentum" (which isn't really a standard term either, maybe "phylogenetic inertia"). I need to flag this honestly.
      *   **The Malfunction Norm:** Causal-role accounts describe capacities. If a heart doesn't pump, it lacks the capacity. But we say it *malfunctions* (it should pump). Etiological accounts ground the "should" in history (it was selected to pump). Causal-role needs to borrow this norm or define function relative to a specific capacity analysis.

  3.  **Drafting the Exam Question:**

      *   Need to present the rodent case clearly.
      *   Need to ask about the Etiological vs. Causal-Role verdicts.
      *   Need to include the Lab-Built case.
      *   Need to include the "What is function-talk for?" (Malfunction) aspect.
      *   *Constraint Check:* 60 minutes is short for all this. I need to focus the question so they don't ramble. I will structure it into parts (a, b, c) but keep it as one essay prompt to ensure flow.

  4.  **Drafting the Model Answer:**

      *   *Word Count:* ~700 words. Tight.
      *   *Structure:*
          1.  Analyze the Rodent Case (Etiological vs. Causal-Role).
          2.  Address the "Vestigial Momentum"/Exaptation distinction.
          3.  Address the Lab-Built Organism (Pluralism vs. Different Questions).
          4.  Address the Normativity/Malfunction issue.
      *   *Stance:* I need to take a stance for the model answer but acknowledge alternatives in the marking scheme. I will argue for a nuanced Etiological view that distinguishes *historical* vs. *maintenance* functions, while acknowledging Causal-Role handles the lab case better.
      *   *Key Insight:* The "collapse" worry. If etiological requires *ongoing* selection, it looks like causal-role + history. If it requires *original* selection, it handles the rodent but fails the lab case.

  5.  **Drafting the Marking Scheme:**

      *   Total 20 marks.
      *   Breakdown by specific philosophical moves.
      *   "Must-hit" moves vs. "Argumentative" moves.
      *   Common errors (B vs. C vs. A).
      *   *Crucial:* Flagging that "Vestigial Momentum" is not standard terminology.

  6.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction on "Vestigial Momentum":* I must tell the user this isn't a standard term. It sounds like "Phylogenetic Inertia" or just a specific description of an exaptation in a drift regime. I will advise them to treat it as a stipulated term for the exam but note its non-standard status.
      *   *Correction on Time:* 60 minutes for this much material is *very* tight for undergrads. I should advise the user that this is a hard question. I will keep the prompt focused.
      *   *Malfunction:* Make sure the model answer explains *why* Causal-Role struggles. (It describes capacities; malfunction implies a failure to meet a norm. Where does the norm come from if not selection?)
      *   *Lab Case:* This is the "Swampman" equivalent for functions. Etiological says no function (no history). Causal-Role says yes function (current capacity). Does this mean pluralism? Or that they define "function" differently?

  7.  **Final Polish:**

      *   Check tone: Professional, academic, supportive of the TA.
      *   Check constraints: No citations, self-contained.
      *   Check marking scheme clarity: Can I distinguish a 14/20 from a 18/20? Yes, by looking for the "collapse" argument and the "normativity" point.

  8.  **Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here is the exam package. I have kept the case structure exactly as you described, tightened the phrasing for exam clarity, and addressed your specific philosophical constraints.

  ### **Part 1: The Exam Question**

  **Final Exam: Philosophy of Biology**
  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Essay Question**

  Consider a population of burrowing rodents possessing a bony ridge above the eye.
  1.  **History:** The ridge was originally shaped by natural selection to deflect predator strikes. The predator went extinct 8,000 years ago.
  2.  **Current Effect:** The ridge now channels groundwater to the eye, preventing corneal drying and aiding vision.
  3.  **Current Selection:** The population is small and isolated. The reproductive advantage of the channeling is small relative to genetic drift. While loss-of-function mutants disappear, evidence suggests this is due to chance (drift), not differential selection.

  Your colleague terms this status "vestigial momentum": the trait has an *origin-selected* function (defense) it no longer performs, and a *maintenance-selected* effect (hydration) that is beneficial but not currently selected for.

  **Write an essay addressing the following:**

  **(a)** How do the **Etiological Account** and the **Causal-Role Account** of function differ in their verdict on the ridge's *current* function? In your answer, address whether the Etiological Account requires the *original* selection episode, *any* selection episode, or *ongoing* selection. If it requires ongoing selection, does it collapse into the Causal-Role Account in the limit?

  **(b)** Imagine a lab-built organism engineered with an identical ridge that channels water perfectly, but whose lineage never had the ridge before. How does this case clarify whether the disagreement between the two accounts is a matter of **pluralism** (both are right about different things) or **conceptual confusion** (they are answering different questions)?

  **(c)** Your colleague argues that the **Malfunction Case** reveals the weakness of the Causal-Role Account. Explain why attributing "malfunction" requires a norm that the Causal-Role Account may not be entitled to, whereas the Etiological Account might ground it. What does this tell us about what function-talk is *for*?

  ***

  ### **Part 2: Model Answer**
  *(Approx. 700 words)*

  The rodent case exposes a tension in the Etiological Account (EA) regarding the temporal window of selection. Strict EA defines function by what a trait was selected *for* in the past. On this reading, the ridge's function remains predator deflection, even if the predator is extinct. The hydration effect is merely a beneficial consequence, not a function, because it lacks a selection history. However, this renders function explanatorily inert regarding the trait's current persistence. If EA requires *ongoing* selection to assign the hydration function, it faces a "collapse" worry: if the requirement is simply "currently contributes to fitness," it mimics the Causal-Role Account (CRA). The rodent case blocks this assignment specifically because drift, not selection, is maintaining the trait. Thus, strict EA says the hydration has no function; CRA says the function *is* hydration because it contributes to the system's capacity for vision.

  The distinction between "origin-selected" and "maintenance-selected" functions attempts to salvage EA by splitting the historical requirement. However, this risks turning EA into a disjunctive view that loses its normative bite. If a trait can have a function without *any* selection for that specific effect (as in the hydration case, maintained by drift), the link between function and selection is severed. The colleague's term "vestigial momentum" captures the intuition, but philosophically, this looks less like exaptation (which implies co-option and subsequent selection) and more like a "spandrel" currently riding on drift.

  The lab-built organism clarifies the divergence. EA typically verdicts that the lab-ridge has no function, as it lacks an evolutionary history. CRA verdicts that it functions to channel water, as it contributes to the system's capacities. If we accept both verdicts as valid, we endorse **explanatory pluralism**: EA explains why the trait exists in the wild (history), while CRA explains what the trait does in the system (capacity). However, this is not merely a shrug. It suggests the word "function" is ambiguous. If we use function-talk to explain **presence**, EA wins. If we use it to explain **current contribution**, CRA wins.

  The crucial test is malfunction. If the lab-ridge cracks and fails to channel water, CRA describes this as a loss of capacity. But to call it a *malfunction* implies it *ought* to channel water. CRA struggles to ground this "ought." It can say the trait is broken relative to a specific analytical capacity, but it cannot easily distinguish between a trait that *fails* to function and a trait that simply *lacks* the function, without smuggling in a norm. EA grounds the norm naturally: the trait malfunctions if it fails to do what it was selected to do. The "should" is historical.

  Therefore, the disagreement is not just about the rodent, but about the purpose of function-talk. If the goal is to identify **normative standards** for failure (malfunction), EA is superior because it anchors norms in selection history. The rodent's hydration effect lacks this norm; if the ridge stops channeling water, it isn't "broken," it just lost a beneficial effect. The colleague is correct that CRA struggles here. However, if the goal is **engineering or physiological analysis** (as in the lab case), CRA is superior because it ignores history. The "collapse" of EA into CRA only happens if we demand EA account for current utility without history. A robust EA should admit that in drift-heavy contexts, traits may have beneficial effects without proper functions, preserving the link between function and selection.

  ***

  ### **Part 3: Marking Scheme**

  **Total: 20 Marks**

  **Section A: The Rodent Case & Selection History (7 Marks)**
  *   **2 Marks:** Correctly identifies that strict Etiological Account (EA) assigns the *old* function (defense) or no new function, while Causal-Role Account (CRA) assigns the *new* function (hydration).
      *   *Common Error (C grade):* Saying EA automatically accepts the new function because it is beneficial.
  *   **2 Marks:** Addresses the "Collapse" worry: If EA requires *ongoing* selection, it risks becoming CRA.
      *   *Common Error (B grade):* Mentioning the collapse worry but failing to explain *why* (i.e., that "current selection" looks like "current contribution").
  *   **3 Marks:** Analyzes the drift component. Acknowledges that because the new effect is maintained by drift, EA cannot assign it as a function without breaking the selection link.
      *   *A-Grade Move:* Notes that "Vestigial Momentum" is not standard terminology (see note below) but treats it as a stipulated attempt to separate origin vs. maintenance conditions.

  **Section B: The Lab-Built Organism & Pluralism (6 Marks)**
  *   **2 Marks:** Correctly predicts EA verdict (No function/History missing) vs. CRA verdict (Function exists/Capacity present).
  *   **2 Marks:** Distinguishes between **Pluralism** (both accounts are valid for different purposes) vs. **Ambiguity** (they are defining different concepts).
      *   *Common Error (C grade):* Treating the lab case as a "gotcha" that refutes EA entirely, rather than a boundary case.
  *   **2 Marks:** Argues whether this resolves the debate. (e.g., "It shows EA is for evolutionary explanation, CRA for physiological explanation.")
      *   *A-Grade Move:* Explicitly states that accepting pluralism avoids the collapse problem by limiting the scope of each account.

  **Section C: Malfunction & Normativity (7 Marks)**
  *   **3 Marks:** Explains why malfunction requires a **norm** (an "ought").
      *   *Common Error (B grade):* Defining malfunction simply as "not working" without addressing the normative standard.
  *   **2 Marks:** Explains why CRA struggles with norms (capacities describe what *is*, not what *should be*).
  *   **2 Marks:** Explains how EA grounds the norm (selected history creates the standard for success).
      *   *A-Grade Move:* Connects this back to the rodent: The hydration effect cannot "malfunction" on EA because it was never selected for; it can only cease to be beneficial.

  **General Grading Notes & "Vestigial Momentum" Check**
  *   **"Vestigial Momentum":** This is **not** a standard term in philosophy of biology. It sounds like a mix of "vestigial structure" and "phylogenetic inertia."
      *   *Instruction to Grader:* Do not penalize students for not knowing the term. Reward them if they note it is non-standard or treat it strictly as a stipulated definition for the exam. A student who identifies this as a variant of the "Exaptation vs. Spandrel" debate should be rewarded.
  *   **Alternative Views:** A student can argue *against* the Model Answer's conclusion (e.g., defending a purely Causal-Role view with a different account of norms) and still get full marks, **provided** they explicitly acknowledge the selection-history tension and explain how their view handles the lab-built case without contradiction.
  *   **Time Management:** This is a dense prompt for 60 minutes. A "B" answer will cover all three parts superficially. An "A" answer might sacrifice depth on the Lab Case to ensure the Malfunction/Norm argument is rigorous, as that is the philosophical crux.

  **Differentiation Guide:**
  *   **C (10-12/20):** Lists definitions of EA and CRA. Says EA looks at past, CRA looks at present. Misses the drift nuance and the normative basis of malfunction.
  *   **B (13-16/20):** Hits the drift nuance. Explains the lab case correctly. Struggles to articulate *why* malfunction is a problem for CRA (the "is/ought" gap).
  *   **A (17-20/20):** Explicitly tackles the "Collapse" argument. Clearly articulates that function-talk serves different explanatory goals (history vs. capacity). Correctly identifies that without selection, there is no malfunction, only failure of effect.
