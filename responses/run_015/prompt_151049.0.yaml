prompt: |-
  I write about science and ideas for a national newspaper, and our standards desk has asked me to run a forty-five-minute session for the newsroom before we decide whether to trial an automated fact-checking tool. The room will be about fourteen editors and reporters, none of whom has taken a probability course; two are reflexively hostile to anything with numbers in it; and our standards editor reads enough statistics to catch me if I hand-wave. I have a whiteboard and nothing else.

  The occasion is a vendor pitch. The tool queries the same underlying language model five times under five different prompt framings, treats the five answers as a panel of "jurors," and returns the majority verdict. The deck claims the arrangement is licensed by Condorcet's jury theorem and closes with a slide about the wisdom of crowds. I think the pitch is wrong in a way that is worth teaching rather than just asserting, and I would like a plan for how to teach it — not the explanation written out for me.

  What I need is the sequence and the reason for it: which idea has to be in place before the next one means anything, and why. My instinct is that per-juror competence above chance has to come before the asymptotic result, and that the independence condition has to be stated as independence conditional on the truth rather than as "they don't talk to each other" — but tell me where I have the order wrong.

  I also want one concrete case to carry the whole session, and I want you to say what such a case must have and what it must lack. My candidate is a photograph that arrives with a claim about where and when it was taken — a binary question with a fact of the matter. I take it the example needs genuine ground truth and genuinely separate private signals, and must not be the kind of editorial judgment (is this story worth the space, is this headline fair) where there is no correct answer for the theorem to track.

  Here are the misconceptions I expect, in rough order of how loudly they will be voiced: that the theorem shows more heads are always better, when below-chance competence inverts it; that 51% accuracy plus enough jurors gets you anywhere soon; that our five model calls are five jurors; and that this has something to do with Condorcet's paradox about cycling majorities, which a couple of people will have half-remembered. Tell me which of these I am missing, which one is actually the load-bearing error, and at exactly what point in the sequence each should be headed off — including the place where the vendor's slide should collapse.

  The idea I most want placed well is this: each juror's signal can be treated as part private and part drawn from a common source, and as the common share grows the effective number of independent jurors falls toward one no matter how many heads you count. I want the plan to say where that decomposition goes, what it does to the five-calls-from-one-model picture, and how to convey it without a formula on the board. It should also note, in passing, that when competence varies the sensible weight is roughly the log-odds of each juror's accuracy, so five equally weighted samples from one model are misweighted twice over — and that if the tool ever reports confidence scores rather than verdicts, majority voting is the wrong aggregator regardless.

  Give me one question to end on that tells me whether the idea landed rather than whether they enjoyed the session — something like handing them a variant case and asking what the theorem does and does not say about it.

  Finally, tell me what to refuse to explain at this level and say so out loud: I assume the asymptotic argument itself, and I suspect the base-rate arithmetic (a checker that is right 90% of the time on a stream where only a small share of items are false will still mostly cry wolf) deserves its own session and should be named and declined rather than squeezed in.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **User:** Science/ideas writer for a national newspaper.
      *   **Audience:** 14 editors/reporters (no probability background, 2 hostile to numbers, 1 standards editor who knows stats).
      *   **Context:** Vendor pitch for an automated fact-checking tool (LLM-based, 5 prompts = 5 jurors, majority vote). Vendor claims Condorcet's Jury Theorem (CJT) and Wisdom of Crowds justify this.
      *   **Goal:** A 45-minute teaching session plan to expose why the vendor's claim is likely flawed *without* just asserting it.
      *   **Constraints:** Whiteboard only. No formulas. Needs a specific sequence of ideas. Needs one concrete case study (photo verification proposed). Needs to address specific misconceptions. Needs a final assessment question. Needs to define what *not* to explain.
      *   **Key Insight to Convey:** Correlated errors (common source) destroy the "independence" assumption, rendering the "5 calls = 5 jurors" claim void. Also, weighting issues.
      *   **User's Instincts:** Per-juror competence > 0.5 first, then asymptotic result. Independence conditional on truth.
      *   **Specific Misconceptions to Address:** More heads always better, 51% + N gets you there fast, 5 model calls = 5 jurors, Condorcet's Paradox confusion.
      *   **Specific Requirement:** Where does the "common source/private signal" decomposition go? How to explain without formulas?
      *   **Specific Requirement:** What to refuse to explain (asymptotics, base rates).

  2.  **Deconstruct the Mathematics & Logic (Mental Check):**

      *   *Condorcet's Jury Theorem (CJT):* Requires (1) Binary choice (True/False), (2) Competence $p > 0.5$ for each voter, (3) Independence of votes *conditional on the state of the world*.
      *   *Vendor Claim:* 5 LLM calls = 5 independent jurors.
      *   *The Flaw:* LLM calls from the same model (even with prompt variation) share weights, training data, and architectural biases. They are *not* independent conditional on the truth. If the model is wrong about a fact, all 5 calls are likely wrong in the same way.
      *   *Wisdom of Crowds:* Requires diversity of opinion, independence, decentralization, aggregation. LLM self-ensembling fails independence.
      *   *Correlation:* If errors are correlated, the effective $N$ shrinks. If correlation is perfect, $N=1$.
      *   *Competence:* If $p < 0.5$, majority vote makes things *worse*.
      *   *Weighting:* Optimal weighting is log-odds. Equal weighting of identical sources is inefficient.

  3.  **Drafting the Sequence (Iterative Process):**

      *   *Attempt 1:* Define Theorem -> Show Photo Example -> Explain Independence -> Show Model Flaw -> Conclusion.
      *   *Critique 1:* Too dry. Need to hook the "hostile to numbers" people first. Need to establish *why* we care about the theorem before explaining its rules.
      *   *Attempt 2:* Start with the Photo. Ask them to vote. Show how voting helps *if* they know different things. Then introduce the Theorem as the "rulebook" for when voting works. Then break the vendor's tool against the rulebook.
      *   *Refinement:* The user wants the "common source/private signal" idea placed well. This needs to happen *after* independence is defined but *before* the vendor critique is finalized.
      *   *Addressing Misconceptions:*
          *   "More heads better": Address early with the $p < 0.5$ case.
          *   "51% + N": Address when discussing convergence speed (refuse deep asymptotics).
          *   "5 calls = 5 jurors": This is the climax.
          *   "Condorcet Paradox": Distinguish early (cycling vs. accuracy).
      *   *Refusing Explanations:* Base rates and deep asymptotic proofs need to be explicitly parked.

  4.  **Developing the Concrete Case (The Photo):**

      *   *Requirements:* Binary ground truth (Real/Fake or Location A/Location B). Private signals (editors see different clues).
      *   *User's Candidate:* Photo with claim about where/when.
      *   *Enhancement:* It needs to demonstrate *correlation*.
      *   *Idea:* A photo of a protest. Claim: "This is Kiev, 2022." Truth: "This is Kiev, 2014."
      *   *Why:* Editors might look at clothes, signs, weather.
      *   *For the Model:* The "private signal" is the random noise in sampling. The "common source" is the training data. If the training data has a bias, all 5 calls share it.
      *   *What it must lack:* Ambiguity. It must be verifiable. No "fairness" judgments.

  5.  **Structuring the 45 Minutes:**

      *   **0-5 min:** Hook & The Photo (Binary Truth).
      *   **5-15 min:** The Rules of the Game (CJT conditions). Competence > 0.5 & Independence.
      *   **15-25 min:** The "Common Source" Trap (The core insight). Decomposing the signal.
      *   **25-35 min:** The Vendor's Tool vs. The Rules. (Where the slide collapses).
      *   **35-40 min:** Weighting & Confidence (Briefly).
      *   **40-45 min:** The Final Question & Parking Lot.

  6.  **Refining the "Common Source" Explanation (No Formulas):**

      *   *Analogy:* Witnesses in a trial.
      *   *Scenario A:* 5 witnesses saw the crime from different angles. (Independent).
      *   *Scenario B:* 5 witnesses read the same newspaper account before testifying. (Correlated).
      *   *Application:* 5 LLM prompts = 5 witnesses who read the same newspaper (the model weights).
      *   *Visual:* Whiteboard drawing of arrows. Truth -> Juror 1, Truth -> Juror 2 (Independent). vs Truth -> Model -> Juror 1-5 (Common bottleneck).

  7.  **Addressing Specific Misconceptions & Load-Bearing Errors:**

      *   *Load-Bearing Error:* Independence conditional on truth. This is the one that kills the vendor pitch.
      *   *Condorcet Paradox:* Distinguish immediately. Paradox = preferences cycle. Theorem = binary truth tracking.
      *   *51% + N:* Acknowledge it works *mathematically* but fails *practically* (slow convergence) and *structurally* (correlation).
      *   *More heads better:* Counter with $p < 0.5$.

  8.  **The Final Question:**

      *   Needs to test understanding of independence vs. headcount.
      *   *Scenario:* We hire 5 fact-checkers. They all went to the same journalism school and use the same verification database. Is this better than 1 fact-checker?
      *   *Answer:* No, because of correlation.

  9.  **What to Refuse:**

      *   Base Rate Neglect (The "90% accurate test on rare events" problem). Crucial but distinct.
      *   Proof of Convergence (The math of why $N \to \infty$ works).

  10. **Review against Constraints:**

      *   Whiteboard only? Yes, rely on diagrams.
      *   Sequence logic? Competence -> Independence -> Correlation -> Application.
      *   User's instincts? Validated (Competence first, Conditional Independence).
      *   Tone? Professional, pedagogical, firm on standards.

  11. **Final Polish:** Ensure the distinction between "Wisdom of Crowds" (diverse heuristics) and "Model Ensembling" (same heuristic, different noise) is clear. Make sure the "log-odds weighting" point is included but not overwhelming. (Self-Correction: Keep weighting brief, it's a secondary point to the independence failure).

  12. **Drafting the Response:** (Proceeding to generate the plan based on these thoughts). *Wait, one check on the "Condorcet Paradox" confusion.* The prompt says a couple of people will half-remember it. I need to make sure I explicitly distinguish Condorcet's *Jury Theorem* (probability of correctness) from Condorcet's *Paradox* (intransitive preferences). This should happen early to clear the deck.

  13. **Final check on the "Common Source" visualization.** How to draw "Independence conditional on truth" without formulas?
      *   Draw "Truth" at the top.
      *   Draw arrows to 5 circles (Jurors).
      *   If arrows bypass each other, independent.
      *   If arrows go through a funnel (The Model) first, correlated.
      *   This works on a whiteboard.

  14. **Final check on the "51% + N" misconception.** The user says "51% accuracy plus enough jurors gets you anywhere soon." The math says it gets you there *eventually*, but "soon" is the lie. With 51%, you need huge N. With correlation, you need infinite N. I need to make sure the distinction between "asymptotically" and "practically" is clear without doing the asymptotic proof.

  15. **Okay, ready to write.**
answer: |-
  Here is a 45-minute session plan designed to dismantle the vendor's claim using the room's existing intuition, anchored by your photo example, and structured to prevent the specific misconceptions you identified.

  ### The Sequence Logic

  Your instinct is correct: **Competence ($p > 0.5$) must precede Independence.** If the jurors are worse than random, independence makes the error *worse* as $N$ grows. However, for this specific audience, **Independence** is the load-bearing error. The vendor's pitch collapses entirely if independence fails, regardless of competence.

  Therefore, the sequence prioritizes establishing the *conditions* for the theorem before discussing the *result*.

  1.  **Define the Game (Binary Truth):** Establish that the theorem only applies to facts, not judgments.
  2.  **Condition 1: Competence:** Establish that "better than random" is a prerequisite, not a result.
  3.  **Condition 2: Conditional Independence:** Define independence not as "silence" but as "uncorrelated errors."
  4.  **The Decomposition (Private vs. Common):** Show how shared architecture destroys independence.
  5.  **The Vendor Collapse:** Apply the decomposition to the 5-prompt tool.
  6.  **The Parking Lot:** Explicitly set aside Base Rates and Asymptotic Proofs.

  ---

  ### The Concrete Case: The "Protest Photo"

  **The Case:** A wire photo arrives showing a crowd burning tires in a street. The caption claims: *"Kyiv, Ukraine. February 2022."*
  **The Truth:** It is Kyiv, but the date is *2014*.
  **The Task:** Determine True/False on the date.

  **What this case must have:**
  *   **Verifiable Ground Truth:** There is a fact of the matter (metadata, shadow angles, specific vehicle models available only in 2014).
  *   **Multiple Cues:** Editors can look at clothing, cars, signage, or shadows.
  *   **Binary Output:** The tool outputs "True" or "False" (matching the vendor's verdict).

  **What this case must lack:**
  *   **Ambiguity:** Do not use "Is this headline fair?" or "Is this newsworthy?" The theorem tracks *truth*, not *value*.
  *   **Obviousness:** If the date is stamped on the photo, no one needs a jury. The uncertainty must be real but resolvable.

  ---

  ### The Session Plan (45 Minutes)

  #### 0:00 – 0:05 | Hook & Distinction (The Whiteboard)
  **Action:** Draw two columns. Left: "Who Won the Election?" Right: "Who Should Win the Election?"
  **Talk:** "Condorcet's **Jury Theorem** is about the left column. Condorcet's **Paradox** (which some of you may recall) is about the right column. The Paradox says group preferences can cycle (A beats B, B beats C, C beats A). The Theorem says group *accuracy* can converge on truth. The vendor is selling the Theorem. We are judging facts, not preferences. If we are judging facts, there is a right answer."
  **Misconception Head-Off:** Distinguishes Theorem vs. Paradox immediately.

  #### 0:05 – 0:15 | Condition 1: Competence (The "Worse than Random" Trap)
  **Action:** Draw the Photo on the board. Ask the room: "If I ask 100 of you to guess the date, and you are all guessing blindly (50% accuracy), does voting help?" (No). "What if you are all *confidently wrong*? Say, 40% accuracy."
  **Talk:** "The theorem has a hard floor. If the average juror is below 50% competence, adding more jurors makes the group *less* accurate, not more. The majority verdict converges on the *wrong* answer."
  **Misconception Head-Off:** "More heads are always better."
  **Key Takeaway:** We must establish the LLM is better than a coin flip *before* we ask if five calls are better than one.

  #### 0:15 – 0:25 | Condition 2: Independence (The Core Lesson)
  **Action:** Draw a diagram.
  *   *Scenario A:* Draw "Truth" at the top. Draw 5 arrows going directly to 5 circles (Jurors).
  *   *Scenario B:* Draw "Truth" at the top. Draw 1 arrow to a Box labeled "Model." Draw 5 arrows from the Box to 5 circles.
  **Talk:** "Independence does not mean the jurors don't talk. It means their *errors* don't correlate. In Scenario A, if Juror 1 misses a clue, Juror 2 might still see it. In Scenario B, if the Box misses the clue, *all five* jurors miss it."
  **The Decomposition:** "Think of every signal as two parts: **Private Noise** (unique to the juror) and **Common Signal** (shared source). The theorem only counts the Private Noise. As the Common Signal grows, the 'Effective N' shrinks. If the Common Signal is 100%, your Effective N is 1, even if you have 100 jurors."
  **Misconception Head-Off:** "5 model calls = 5 jurors."
  **Visual:** Write "Effective N = 1" under Scenario B.

  #### 0:25 – 0:35 | The Vendor Collapse (Applying the Lesson)
  **Action:** Point to Scenario B. Label the Box "Underlying Language Model."
  **Talk:** "The vendor runs five prompts against *one* model. That is Scenario B. The weights, the training data, and the architectural biases are the Common Signal. If the model doesn't know the difference between 2014 and 2022 tire-burning tactics, five prompts won't teach it. They are not five jurors; they are one juror asked five times."
  **Weighting Point:** "Even if they were slightly independent, they are identical models. The optimal weight for identical information is not 'one vote each.' It is roughly the log-odds of accuracy. By treating them as five equal votes, they are misweighted twice: they count as five, and they count as independent."
  **Confidence Point:** "If the tool gives us confidence scores, majority vote is the wrong aggregator anyway. We should be Bayesian updating, not counting hands."
  **The Slide Collapse:** "The vendor's slide claims 'Wisdom of Crowds.' A crowd requires diversity of heuristic. Five prompts to one mind is not a crowd; it is a monologue."

  #### 0:35 – 0:40 | The Parking Lot (What We Are Not Doing)
  **Talk:** "Two things I am explicitly refusing to derive today, because they deserve their own session:
  1.  **Asymptotics:** Yes, mathematically, if $p > 0.5$ and Independent, $N \to \infty$ guarantees truth. But 'guarantees eventually' is not 'works for N=5.' With 51% competence, you need thousands of jurors to get high confidence. We have five.
  2.  **Base Rates:** If only 1% of photos are fake, a 90% accurate checker still cries wolf more often than it catches wolves. That is Bayes' Theorem, not Condorcet. We will not solve that today, but do not assume a 'True' verdict means 'Likely True' without knowing the prevalence of fakes."
  **Misconception Head-Off:** "51% + N gets you anywhere soon."

  #### 0:40 – 0:45 | The Assessment Question
  **Action:** Erase the board. Draw a new scenario.
  **Talk:** "Here is your test. We hire five human fact-checkers to verify the photo. They all sit in the same room. They all use the same reverse-image-search database. They all graduated from the same training workshop. They submit their votes anonymously.
  **Question:** According to Condorcet's Jury Theorem, is this group more reliable than a single fact-checker using the same database? Why or why not?"
  **Correct Answer:** No (or marginally). Because the *errors* are correlated via the database and training. They share a "Common Source." The Effective N is close to 1.
  **Why this works:** It tests if they understand that *physical separation* (anonymous voting) does not equal *statistical independence* (uncorrelated errors).

  ---

  ### Addressing Your Specific Concerns

  **1. Order of Ideas:**
  You are right to put Competence before Independence. If $p < 0.5$, Independence is dangerous. However, in the flow above, I place heavy emphasis on Independence because that is where the vendor is lying. Competence is the "gate," but Independence is the "floor."

  **2. The "Common Source" Decomposition:**
  This goes in the **0:15 – 0:25** block.
  *   **How to convey without formulas:** Use the "Witness" analogy.
      *   *Independent:* 5 witnesses saw the crime from 5 different windows.
      *   *Correlated:* 5 witnesses read the same newspaper report about the crime before testifying.
      *   *The LLM:* The 5 prompts are 5 witnesses who read the same newspaper (the model weights).
  *   **Effect on the 5-calls picture:** It reduces the "Effective N" from 5 to ~1.1 or 1.2. It turns an averaging problem into a repetition problem.

  **3. The Load-Bearing Error:**
  The load-bearing error is **Independence Conditional on Truth**.
  *   *Why:* Even if the model is 90% competent ($p=0.9$), if the errors are perfectly correlated (Common Source = 100%), the probability of the group being wrong is 10%, not $0.1^5$. The vendor's math relies on the error term shrinking exponentially. Correlation stops the shrinkage.
  *   *When to head it off:* **0:15 – 0:25**. Do not let them accept the "5 jurors" premise until you have drawn Scenario B.

  **4. What to Refuse:**
  *   **Asymptotic Proof:** Do not write the limit equation on the board. It invites the standards editor to check your calculus and bores the hostile reporters. State the *implication* (slow convergence) without the *derivation*.
  *   **Base Rate Arithmetic:** As you noted, this is the "90% accurate test on rare events" problem. It is critical for newsroom decisions but distinct from the *aggregation* logic of Condorcet. Name it, define it as a "Session 2" topic, and close the door. If you try to solve Base Rates *and* Correlation *and* Competence in 45 minutes, you will lose the room.

  **5. Final Assessment:**
  The "Five Fact-Checkers" question is designed to fail if they focus on *headcount* rather than *signal structure*. If they say "Yes, 5 is better than 1," they missed the lesson on correlation. If they say "No, they use the same database," the idea landed.
