      *   *Case 3 (Transparent but Biased Framing):* Full disclosure, but relative risk (e.g., "50% reduction" when baseline is 0.002%).
          *   *Checklist Path:* Coercion (Pass) -> Competence (Pass on paper) -> Deception (Pass on technical disclosure).
