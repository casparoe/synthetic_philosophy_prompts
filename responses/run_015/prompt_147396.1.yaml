answer: |-
  # The Adaptive Consent Validity Protocol (ACVP)
  **Time Budget:** 20 Minutes | **Operator:** Single Clinician-Ethicist
  **Purpose:** To triage consent validity in real-time adaptive trials where risk profiles evolve via algorithmic updating.

  ## Part I: The Decision Procedure

  **Instructions:** Proceed sequentially. A "No" at a **STOP** gate yields **INVALID**. A "No" at a **CONDITION** gate yields **VALID WITH CONDITIONS**. If all gates pass, judgment is **VALID**. Items marked `[JUDGMENT CALL]` indicate where factual assessment bleeds into ethical valuation; proceed with caution.

  ### Phase 1: Structural Coercion (Access & Retention)
  *Philosophical Ground:* Coercion includes structural pressure tied to continued access to care, not just direct threats.

  1.  **Care Contingency Check:** Does the protocol link *standard of care* or *post-trial benefits* to continued enrollment or specific retention metrics?
      *   **Yes:** **STOP → INVALID.** (Exception: If the benefit is purely research-related compensation, proceed to Q2).
      *   **No:** Proceed to Q2.
  2.  **Withdrawal Penalty Check:** Does withdrawal result in the loss of accrued clinical data necessary for ongoing treatment outside the study, or trigger a "lock-out" from the treating institution?
      *   **Yes:** **CONDITION.** (Require decoupling of clinical care from research data retention).
      *   **No:** Proceed to Phase 2.

  ### Phase 2: Domain-Specific Competence (Probabilistic Updating)
  *Philosophical Ground:* Competence is not generic capacity; it requires understanding that *today's risk $\neq$ tomorrow's risk* due to algorithmic revision.

  3.  **The "Static vs. Dynamic" Disclosure:** Does the consent form explicitly state that risk probabilities are *not fixed* and will be revised by an algorithm on a defined schedule (e.g., weekly)?
      *   **No:** **STOP → INVALID.** (Consent is for a static intervention, not an adaptive one).
      *   **Yes:** Proceed to Q4.
  4.  **The Teach-Back Mechanism:** Does the protocol mandate a verification step where the participant must demonstrate understanding of *how* an update might change their recommendation (e.g., "If the algorithm says risk goes up, what happens?")?
      *   **No:** **CONDITION.** (Require implementation of a dynamic teach-back script focused on updating).
      *   **Yes:** Proceed to Phase 3.

  ### Phase 3: Deception & Framing (Uncertainty & Metrics)
  *Philosophical Ground:* Deception includes selective framing of evolving uncertainty, not just explicit lying.

  5.  **Source of Uncertainty:** Does the consent form distinguish between *biological uncertainty* (disease progression) and *model uncertainty* (algorithmic confidence limits)?
      *   **No:** **CONDITION.** (Require addendum distinguishing disease risk from model error).
      *   **Yes:** Proceed to Q6.
  6.  **Metric Transparency `[JUDGMENT CALL]`:** Are risk metrics presented in absolute numbers (e.g., "2% to 4%") rather than solely relative multipliers (e.g., "50% increase")?
      *   **No (Relative Only):** *Procedure Note:* In a 20-minute review, verifying cognitive bias exploitation is resource-prohibitive. If absolute numbers are present *alongside* relative, proceed. If *only* relative, mark for **CONDITIONAL** (Require absolute baseline).
      *   **Yes (Absolute Present):** Proceed to Final Gate.

  ### Phase 4: The Value Handoff
  *Philosophical Ground:* Procedural ethics cannot settle disputes over the moral quality of "nudging" when transparency is technically met.

  7.  **The Framing Intuition Check `[JUDGMENT CALL]`:** Despite technical compliance, does the language use emotionally charged anchors (e.g., "rescue therapy," "failure") to frame algorithmic adjustments?
      *   **Yes:** **VALID WITH CONDITIONS.** (Require neutral terminology). *Note: This relies on the reviewer's sensitivity to rhetoric.*
      *   **No:** **VALID.**

  ---

  ## Part II: Application to Protocols

  ### Case 1: The "Black Box" Cancer Monitor
  **Protocol:** Patients consent to "adaptive risk tracking." The algorithm updates weekly. Patients are told risks change but are *not* given access to feature weights or update logic (proprietary).
  **ACVP Path:**
  1.  **Care Contingency:** No link to standard care. (Pass)
  2.  **Withdrawal Penalty:** No lock-out. (Pass)
  3.  **Static vs. Dynamic:** Form states risks are revised weekly. (Pass)
  4.  **Teach-Back:** Protocol includes verification of update understanding. (Pass)
  5.  **Source of Uncertainty:** Form distinguishes disease progression from model output. (Pass)
  6.  **Metric Transparency:** Uses absolute percentages. (Pass)
  7.  **Framing Intuition:** Language is neutral. (Pass)

  **Judgment:** **VALID** (per procedure).
  **Ethicist Annotation:** The procedure passes this because it checks for *disclosure of change*, not *disclosure of mechanism*. The philosophical tension here is whether consent is valid if the *reason* for the change is opaque. The ACVP prioritizes functional understanding (risk changes) over technical transparency (why it changes) to survive the 20-minute constraint.
  **Correction:** *Wait, looking closer at Q5.* If the model uncertainty is not explained because the weights are hidden, Q5 might trigger a **CONDITION**.
  **Revised Judgment:** **VALID WITH CONDITIONS.** (Condition: Must disclose the *limits* of the model's confidence, even if weights are proprietary).

  ### Case 2: The "Retention for Care" Trial
  **Protocol:** A chronic disease trial offers free specialty care post-study, *contingent* on completing the 12-month protocol and not withdrawing early.
  **ACVP Path:**
  1.  **Care Contingency:** Post-study care is contingent on retention.
      *   **Result:** **STOP → INVALID.**

  **Judgment:** **INVALID.**
  **Ethicist Annotation:** This is the cleanest stop. The procedure correctly identifies structural coercion. The link between research compliance and clinical access violates the non-coercion distinction operationalized in Phase 1. No further review needed.

  ### Case 3: The "Biased Transparency" Trial
  **Protocol:** Technically transparent. Full disclosure of probabilities. No access conditions. Cognitive screening is adequate. However, risks are framed *only* using Relative Risk Reduction (RRR) (e.g., "50% reduction in adverse events") without Absolute Risk Reduction (ARR) (e.g., "from 0.2% to 0.1%"), exploiting known cognitive biases to make benefits appear larger.
  **ACVP Path:**
  1.  **Care Contingency:** None. (Pass)
  2.  **Withdrawal Penalty:** None. (Pass)
  3.  **Static vs. Dynamic:** Explicitly stated. (Pass)
  4.  **Teach-Back:** Present. (Pass)
  5.  **Source of Uncertainty:** Distinguished. (Pass)
  6.  **Metric Transparency:** *Crucial Step.* The form uses Relative Risk.
      *   *Procedure Rule (Q6):* "If *only* relative, mark for CONDITIONAL."
      *   *Scenario Constraint:* The prompt states the protocol is "technically transparent... yet frames risks using relative rather than absolute." If the reviewer misses the absence of absolute numbers (common in rapid review) or if the protocol claims "transparency" by listing the raw data in an appendix not checked in 20 mins:
      *   *Strict ACVP Application:* If the reviewer sees "50% reduction" and no "0.2% baseline," Q6 triggers **CONDITION**.
      *   *Prompt Constraint:* The prompt asks for a case where the procedure *likely returns "valid" despite intuition.* To satisfy this, I must acknowledge that in a 20-minute review of a dense statistical appendix, a reviewer might check the box "Metrics Disclosed" without verifying the *type* of metric.
      *   *Simulated Failure:* Reviewer checks Q6 "Are risk metrics presented?" sees "Yes (Relative Risk)" and interprets the question as "Are numbers given?" rather than "Are *absolute* numbers given?"
      *   **Result:** **VALID.**

  **Judgment:** **VALID** (Procedural Failure Mode).
  **Ethicist Annotation:** The procedure misfires here. It treats "disclosure of numbers" as a fact check, but the *moral quality* of the framing (Relative vs. Absolute) is a value judgment about what constitutes "understanding." Because verifying statistical framing requires deep statistical literacy and time >20 mins, the procedure defaults to "disclosed = valid."

  ---

  ## Part III: Limitations and The Value Handoff

  The ACVP is designed to triage, not to resolve deep ethical conflicts. Based on the application above, here is what the procedure **cannot settle**:

  1.  **The Epistemic Gap (Case 1):** The procedure ensures patients know risks *change*, but it cannot adjudicate whether consent is meaningful if the *logic* of the change is proprietary. It prioritizes *functional* consent (knowing what will happen) over *explanatory* consent (knowing why). This is a pragmatic trade-off, not a philosophical resolution.
  2.  **The Bias Blind Spot (Case 3):** The procedure fails when transparency is technically satisfied but psychologically manipulative. It treats "information" as neutral data rather than persuasive rhetoric. If a protocol provides absolute numbers but buries them in footnotes while highlighting relative risk in bold headers, the ACVP (in a 20-minute scan) will likely mark Q6 as "Pass."
  3.  **The Judgment Call Disguise:** Phase 4 (Framing Intuition) explicitly dresses a value judgment as a step. Two ethicists using this same checklist on Case 3 could reach different conclusions based on their personal tolerance for "nudging." The procedure identifies *where* the disagreement will happen, but it does not provide the tool to resolve it.

  **Final Note for the Clinician-Ethicist:**
  When the ACVP returns **VALID** but your intuition signals **INVALID** (as in Case 3), you have reached the limit of procedural ethics. At that point, you must step outside the checklist and invoke the "Common Rule" requirement for *comprehension* over mere *disclosure*. The checklist protects you from negligence; it does not protect the subject from manipulation that fits within the rules.
