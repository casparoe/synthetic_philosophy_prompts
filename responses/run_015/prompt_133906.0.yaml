  ## Part 3: Run of Show (75 Minutes)

  ### 0:00 – 0:05 | Introduction
  *   Hand out props.
  *   **Rule:** "You are Demons. Your goal is to extract Energy (Chips) from the Box (Molecule Deck). You have Memory (Cards). Memory fills up. You must manage your ledger."
  *   **Constraint:** "Do not ask me about physics. Ask me about the rules."

  ### 0:05 – 0:25 | Round 1 (The Trap)
  *   All teams play 2 Reset Cycles (8 Molecules total).
  *   **Restriction:** Compression is **not** allowed yet.
  *   Teams 1 & 2 get Random Decks. Teams 3 & 4 get Patterned Decks (but they don't know the difference yet).
  *   **Expected Outcome:** Everyone loses chips. Teams 3 & 4 might notice they *could* have compressed but weren't allowed. Teams 1 & 2 realize recording is expensive.
  *   **Pause:** Ask teams to tally their scores. Most should be down.

  ### 0:25 – 0:45 | Round 2 (The Loophole)
  *   **Announcement:** "New Technology Available. You may now purchase a Logic Operation to compress memory before resetting."
  *   Explain the Compression Rule and Logic Cost.
  *   Teams play 2 Reset Cycles (8 Molecules).
  *   **Expected Outcome:**
      *   Teams 1 & 2 (Random): Try to compress, fail (can't prove reversibility on random data), or pay Logic Cost for no savings. They stay down.
      *   Teams 3 & 4 (Patterned): Successfully compress. They should end roughly flat (break-even).
  *   **Crucial:** No team should end with *more* chips than they started.

  ### 0:45 – 1:15 | The Debrief (The Physics)
  *   **Step 1: The Ledger.** Ask teams to report net scores. Write them on the whiteboard.
      *   No Record $\approx$ 0.
      *   Record (Random) < 0.
      *   Record (Patterned) $\approx$ 0.
  *   **Step 2: The Map.**
      *   **Chips** = Free Energy / Work.
      *   **Index Cards** = Physical Memory States (Bits).
      *   **Writing** = Measurement.
      *   **Resetting** = Erasure.
      *   **Compression** = Entropy Reduction.
  *   **Step 3: The Reveal.**
      *   Now you can say **Landauer's Principle**.
      *   "Why did resetting cost chips? In the real world, memory is physical. To turn a '1' back to a '0', you must dissipate heat. That heat is the chip fee."
      *   "Why did the Patterned team do better? Because their data had lower Shannon Entropy. Less information to erase = less heat dissipated."
      *   "Why did nobody get rich? Because the cost of erasure always balances the work extracted. The Second Law is safe."

