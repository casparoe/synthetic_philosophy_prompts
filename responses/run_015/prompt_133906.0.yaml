  ## Part 4: Troubleshooting & Objections

  ### Objection: "The Reset Fee is Arbitrary"
  *Student:* "You just made up the rule that resetting costs chips. That doesn't prove physics."
  *Response:* "Imagine the index card is a switch. If the switch is 'Up', how do I make it 'Down'?"
  *Student:* "You push it."
  *Response:* "Does pushing require energy?"
  *Student:* "Yes."
  *Response:* "Where does that energy go?"
  *Student:* "Friction/Heat."
  *Response:* "Exactly. The chip fee isn't a tax; it's the mechanical work required to snap the physical state of the memory back to blank. If I didn't charge it, I'd be claiming you can move a physical switch without touching it."

  ### What if nobody discovers Compression?
  *   **Sign:** Teams are just paying the full reset fee and complaining.
  *   **Intervention:** At the 30-minute mark, walk to the Patterned Teams. Look at their cards. Say: "I see you have four cards that all say 'Left'. That looks redundant. Is there a way to store that information using less cardboard?"
  *   **If they still miss it:** Introduce the "Logic Gate" token as a mandatory option for Round 2. "The bank is offering a discount on bulk erasure if you process the data first."

  ### What if the Patterned Team beats the house?
  *   This happens if they compress *too* efficiently (e.g., compressing 8 molecules to 1 card).
  *   **Fix:** Enforce the **Logic Cost** strictly. If they argue compression should be free, remind them: "Processing data to find the pattern requires computation. Computation is physical. Pay the 2 chips."

  ---

  ## Part 5: Limitations (What to Say Out Loud)

  Be honest about where the model breaks. This builds philosophical credibility.

  1.  **Discrete vs. Continuous:** "In the game, bits are index cards. In reality, entropy is statistical. We are dealing with integers, not probabilities."
  2.  **The Logic Cost:** "We charged a flat fee for compression. In reality, reversible computing (which allows compression without heat) is theoretically possible but practically incredibly difficult. We taxed it to ensure the Second Law held in the game."
  3.  **The Demon's Brain:** "We didn't account for the energy cost of the *students* thinking. If we did, the net energy would be massively negative. The game isolates the memory cost, not the agent's cost."

  ## Summary Checklist for You
  *   [ ] **Prep:** 4 decks of cards (2 random, 2 patterned 50/50). 100+ Poker Chips. 20 Index Cards cut in half.
  *   [ ] **Whiteboard:** Draw the "Ledger" columns (Gain, Write Cost, Reset Cost, Net) before they arrive.
  *   [ ] **Timing:** Keep a visible timer. If Round 1 drags, cut it to 1 Reset Cycle.
  *   [ ] **Tone:** Be the "Bank," not the "Professor." Let the chips do the talking.

  This structure ensures the "Information is Physical" point lands viscerally: they will *feel* the pain of the reset fee in their chip stacks, and they will *see* that structure (entropy) is the only thing that mitigates that pain.
