  Here is a complete lesson plan, game mechanics, and arithmetic proof designed for your 75-minute session.

  # Session Title: The Demon's Ledger
  **Time:** 75 Minutes
  **Students:** 16 (4 Teams of 4)
  **Props:** Poker chips (Energy), Index Cards (Memory), Red/Black Playing Cards (Molecules), Pens, "Logic Gate" Tokens (optional, or just track chips).

  ---

  ## Part 1: The Game Mechanics

  ### Setup
  Divide the room into 4 teams. Each team gets:
  *   **Energy Stash:** 20 Chips (Start capital).
  *   **Memory Register:** 4 Blank Index Cards.
  *   **Molecule Deck:** A shuffled deck of 8 Red (Right) and 8 Black (Left) cards.
      *   **Teams 1 & 2:** Get a **Random Deck** (shuffled thoroughly, no obvious runs).
      *   **Teams 3 & 4:** Get a **Patterned Deck** (e.g., 4 Red, 4 Black, 4 Red, 4 Black; or long runs like RRRR BBBB). *Crucial: Both decks must be exactly 50/50 overall.*

  ### The Cycle (One "Tick")
  1.  **Reveal:** Turn over the top Molecule card.
  2.  **Decision:** The team must choose to **Bet** or **Fold**.
      *   **Fold:** Nothing happens. Move to next tick. (Not recommended, you need chips).
      *   **Bet:** You predict the side.
          *   **If you have recorded the card in Memory *before* betting:** You know the side. You win **+2 Chips**.
          *   **If you have NOT recorded it:** You guess. 50% chance **+2 Chips**, 50% chance **-2 Chips**.
  3.  **Write:** If you Bet, you *must* write the result (L/R) on a Memory Card to "store the measurement."
      *   **Cost:** **-1 Chip** per card written (Measurement Cost).
      *   **Limit:** You only have 4 Cards. If all 4 are full, you cannot Bet or Write until you Reset.
  4.  **Reset:** When Memory is full (or voluntarily), you can clear the cards to play again.
      *   **Cost:** **-2 Chips** per card cleared (Erasure Cost).
      *   **Compression Rule:** Before resetting, you may trade multiple Memory Cards for a single **Summary Card**.
          *   **Condition:** You must write a rule on the back that allows perfect reconstruction of the original cards (e.g., "All 4 were Left").
          *   **Logic Cost:** **-2 Chips** to perform the compression (processing work).
          *   **Benefit:** You now only pay the Reset Cost for 1 card instead of 4.

  ### Goal
  End the session with the most Chips.

  ---

  ## Part 2: The Arithmetic Proof

  You requested the math to ensure specific outcomes. Here is the ledger for a single "Reset Cycle" (4 Molecules).

  **Constants:**
  *   **Work Gain (Win):** +2 Chips
  *   **Measurement Cost (Write):** -1 Chip
  *   **Erasure Cost (Reset):** -2 Chips per physical card
  *   **Logic Cost (Compress):** -2 Chips per operation

  ### Scenario A: The Skeptics (No Record)
  *Strategy: They refuse to write things down. They guess every time.*
  *   **Rounds:** 4 Bets.
  *   **Wins:** Expected 2 Wins, 2 Losses (50/50).
  *   **Gain:** $(2 \times +2) + (2 \times -2) = 0$.
  *   **Costs:** 0 (No writing, no resetting).
  *   **Net Change:** **0 Chips**.
  *   *Lesson:* Thermal equilibrium. No work extracted on average.

  ### Scenario B: The Standard Demon (Random Sequence)
  *Strategy: Record everything, Reset when full. Cannot compress random data.*
  *   **Rounds:** 4 Bets.
  *   **Wins:** 4 Wins (They have the data).
  *   **Gain:** $4 \times +2 = +8$.
  *   **Measurement Cost:** $4 \text{ cards} \times -1 = -4$.
  *   **Erasure Cost:** $4 \text{ cards} \times -2 = -8$.
  *   **Net Change:** $+8 - 4 - 8 = $ **-4 Chips**.
  *   *Lesson:* Recording information allows work extraction, but the physical cost of erasing that information exceeds the gain. The Second Law holds.

  ### Scenario C: The Clever Demon (Patterned Sequence + Compression)
  *Strategy: Record 4 molecules (e.g., L L L L). Compress to 1 Summary Card ("All Left"). Reset.*
  *   **Rounds:** 4 Bets.
  *   **Wins:** 4 Wins.
  *   **Gain:** $4 \times +2 = +8$.
  *   **Measurement Cost:** $4 \text{ cards} \times -1 = -4$.
  *   **Logic Cost:** 1 Compression Op $\times -2 = -2$.
  *   **Erasure Cost:** $1 \text{ Summary Card} \times -2 = -2$.
  *   **Net Change:** $+8 - 4 - 2 - 2 = $ **0 Chips**.
  *   *Lesson:* Lower entropy (patterned data) allows more efficient memory use. You can get closer to break-even, but you cannot beat the house. The "Logic Cost" represents the thermodynamic cost of the reversible computing required to compress without loss.

