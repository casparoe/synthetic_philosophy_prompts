answer: |-
  No framework can simultaneously maximize complex computational offloading and guarantee retained procedural fluency, forcing a hard choice between utility and understanding.

  ### Desiderata for Epistemic Delegation

  1.  **Justification Accessibility**
      *   **Motivation:** Distinction between tracking truth (believing what is correct) vs. tracking justification (knowing *why* it is correct); without this, delegation collapses into oracle reliance.
      *   **Status:** **Hard.** A theory that permits belief without accessible justification fails to preserve epistemic agency.
  2.  **Procedural Fluency Retention**
      *   **Motivation:** Cognitive-science result that procedural fluency predicts long-term retention and transfer; passive consumption creates an illusion of explanatory depth.
      *   **Status:** **Hard.** If the user does not actively reconstruct the logic, understanding erodes regardless of output accuracy.
  3.  **Intermediate-Step Transparency**
      *   **Motivation:** Distinction between intermediate-step outsourcing vs. verdict-only; verdict-only black boxes prevent error localization and learning.
      *   **Status:** **Hard.** Verdict-only delegation is indistinguishable from testimonial reliance and offers no scaffolding for understanding.
  4.  **Cognitive Load Reduction**
      *   **Motivation:** The primary utility case for AI; if the user must perform all reasoning steps, delegation provides no efficiency gain.
      *   **Status:** **Negotiable.** Limiting the scope of delegation protects understanding but reduces the technology's utility for complex problems.

  ### Joint Unsatisfiability Flag
  **Conflict:** **Procedural Fluency Retention (2)** vs. **Cognitive Load Reduction (4)** AND **Intermediate-Step Transparency (3)** vs. **Complex Computation.**
  *   **Analysis:** You cannot offload complex symbolic computation (satisfying 4) while requiring the user to execute or fully verify every step (satisfying 2 and 3). If the computation is beyond the user's unaided capacity, they cannot verify the steps without essentially re-doing the work, nullifying the load reduction. If they do not re-do the work, fluency erodes. This pair is jointly unsatisfiable for tasks exceeding human cognitive bandwidth.

  ### Candidate Scoring

  **1. Extended-Mind Thesis (Clark-Chalmers)**
  *   **Score:** **Low.**
  *   **Reasoning:** Treats AI as constitutive of the cognitive system, dissolving the boundary between user and tool. While it validates offloading, it fails **Procedural Fluency Retention**; if the tool is removed, the user's capacity is impaired rather than augmented, signaling atrophy rather than understanding. It risks coupling without comprehension.

  **2. Pure Testimonial-Reliance Model**
  *   **Score:** **Very Low.**
  *   **Reasoning:** Treats AI outputs as expert testimony. It satisfies **Cognitive Load Reduction** but explicitly fails **Justification Accessibility** and **Procedural Fluency Retention**. The user accumulates true beliefs but zero understanding, maximizing the erosion-of-understanding problem by design.

  **3. Scaffold-Preserving Delegation (Inspectable traces, non-executing)**
  *   **Score:** **Moderate/High (with caveats).**
  *   **Reasoning:** Satisfies **Intermediate-Step Transparency** and **Justification Accessibility** better than the others. However, because the definition stipulates the user *never executes* the steps, it technically fails **Procedural Fluency Retention** per the cognitive science desideratum. It is the least-worst option only if "inspectable" implies active critical engagement rather than passive reading, though it cannot resolve the hard conflict between verifying complex computation and retaining fluency.
