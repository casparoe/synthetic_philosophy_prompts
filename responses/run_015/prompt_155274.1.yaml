answer: |-
  This is a fascinating exercise in moral intuition pumping. You are essentially doing what philosophers call "reflective equilibrium"—testing your general principles against specific cases to see where they hold and where they break.

  Based on the pattern of your reactions, there *is* a coherent principle at work, but it isn't exactly "Actions vs. Persons" or purely "Spatial Scale." It looks more like a combination of **Inextricability of Harm** and **Functional vs. Honoric Commemoration.**

  Here is a breakdown of the principle your gut seems to be following, why the Chemist/General split makes sense within it, and what it implies for the Teacher.

  ### 1. The Core Principle: "Inextricability" and "Function"

  Your intuition seems to distinguish between commemoration that **honors** (statues, prizes, monuments) and commemoration that **identifies/functionally labels** (buildings, streets, squares).

  *   **Honoric Commemoration (Statues, Prizes, Monuments):** These exist solely to elevate the subject. They imply moral endorsement. If the subject's "bad" is severe enough, it contaminates the "good," making the honor untenable.
  *   **Functional Commemoration (Buildings, Streets, Squares):** These serve a civic purpose (navigation, gathering, utility). They can tolerate more ambiguity *if* the harm is actively counter-balanced or if the "good" provides ongoing utility.

  #### The General vs. The Chemist: Why the Split?
  You asked why splitting works for the Chemist but not the General. Here is the likely distinction in your framework:

  **A. Inextricability of the Good and the Bad**
  *   **The General:** In your view, the defense of the city and the burning of the village are likely part of the same moral category: **Warfare.** The "good" (defense) was achieved *through* the mechanism of the "bad" (violence/authority). You cannot separate the victory from the atrocity; they are inextricably linked. To honor the defense is to implicitly endorse the methods.
  *   **The Chemist:** The life-saving dye and the unethical experiments are **categorically different.** One is healing (utility); the other is harm (violation). The dye exists now as a benefit independent of the method used to find it. Your gut allows you to accept the *product* (the building remains) while rejecting the *process* (the lecture hall honors victims).

  **B. Active Counter-Memory vs. Passive Context**
  *   **The General:** You said, "No plaque saves it." A plaque is passive context. It puts the narrative control back in the hands of the monument.
  *   **The Chemist:** You accepted renaming the lecture hall *after the victims.* This is **active counter-memory.** It doesn't just contextualize the Chemist; it actively displaces his prestige within his own building. The building bears his name (perhaps for historical record/utility), but the *honor* (the lecture hall) is stripped from him and given to those he harmed.
  *   **The Split:** The split works for the Chemist because it **subordinates** his name to the memory of his crimes within the same space. For the General, a monument is singular; you cannot subordinate a statue to its own plaque. It must come down.

  ### 2. Addressing Your Specific Questions

  **Is it about honoring actions versus honoring persons?**
  Not quite. It is about **Honoring Legacy vs. Acknowledging History.**
  *   **Statues/Monuments** honor the *Person* (the whole package). If the package is rotten (General), the statue goes.
  *   **Plaques/Buildings** acknowledge *History/Utility*. The Mayor built a hospital (utility), so the statue stays with a warning (history). The Chemist's building houses science (utility), so the name stays, but the victims are centered (history).

  **Is it about spatial scale?**
  Partially, but it's more about **Dominance.**
  *   A monument dominates a space. It demands reverence.
  *   A building name is often administrative. A street name is navigational.
  *   Your intuition allows "naming" to persist where "reverence" does not. That is why the Poet keeps the Square (a public space/history) but loses the Prize (an honor/endorsement of artistic virtue).

  ### 3. The Case of the Teacher

  Now, let's apply this framework to the park bench engraved for the beloved teacher who held private racist views that never affected her students.

  **The Variables:**
  *   **Commemoration Type:** Park Bench. This is low-scale. It is closer to "Honoric" (it's a tribute) but also "Functional" (a place to sit).
  *   **The Good:** Beloved teacher, positive impact on students.
  *   **The Bad:** Private racist views.
  *   **The Link:** You specified the views **never affected her students.**

  **The Verdict based on your Principle:**
  **Keep the bench, no plaque.**

  **The Justification:**
  1.  **Public vs. Private Harm:** Your threshold for removal (The General, The Donor) involves **public harm** or **fraud.** The General burned a village (public violence). The Donor stole money (public fraud). The Mayor busted unions (public policy). The Teacher's racism was private and did not translate into public action or harm within her sphere of influence.
  2.  **Inextricability:** Unlike the General, where the victory and the atrocity were linked, the Teacher's teaching and her private thoughts are separable. Her "output" (teaching) was untainted.
  3.  **The "Donor" Contrast:** The Donor's street was renamed because the *basis* of the honor (the money) was illegitimate. The Teacher's bench is based on her *teaching*, which was legitimate.
  4.  **Why no plaque?** In the Mayor's case, the union-busting was public policy; it is part of the historical record. In the Teacher's case, the views were private. Plaquing it would turn the bench into a site of surveillance on private thought rather than a memorial of public service.

  **The Conflict You Feel:**
  You are going back and forth because you are worried about **Moral Consistency.** *If we judge the General for his views/actions, why not the Teacher?*
  *   **Resolution:** The distinction is **Harm.** Your ethics seem to be consequentialist regarding commemoration. We remove things that cause ongoing pain or glorify harm. The General's monument glorifies violence. The Teacher's bench glorifies education. Her private thoughts, while morally failing, did not generate the "harm" that necessitates removal in your other cases (like the General's village or the Chemist's victims).

  ### Summary of Your Stance
  You are a **Contextual Utilitarian** regarding commemoration.

  1.  **Remove** if the honor is transactional and fraudulent (Donor) OR if the "good" is inextricably linked to atrocity/violence (General).
  2.  **Contextualize** if the "bad" was public/policy but the "good" was tangible infrastructure (Mayor).
  3.  **Split/Subordinate** if the "good" provides ongoing utility that can be separated from the "bad," provided the victims are actively memorialized within the space (Chemist).
  4.  **Retain** if the "bad" was private and did not negate the public good of the "good" (Teacher).

  Your gut is telling you that **commemoration is not about moral purity; it is about what we owe the living.** We owe the living truth (plaques), safety (removing violent glorification), and utility (buildings), but we do not necessarily owe the living a purge of private vice that caused no public harm.
