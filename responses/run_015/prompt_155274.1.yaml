      *   *Prediction:* Based on the Mayor case (contextualize), the Teacher case should be "Keep, but maybe contextualize?" BUT, since the views were *private* and *didn't affect students*, contextualizing might be invasive or irrelevant.
      *   *Refinement:* The user's intuition on the General suggests a zero-tolerance for violence. The Teacher case has no violence. The Mayor case suggests context is enough for systemic bad acts. The Teacher's racism is personal vice.
      *   *Likely User Stance:* Keep the bench. The "good" (teaching) was the public output. The "bad" was private and didn't leak into the public good.

  6.  **Drafting the Response:**
      *   **Validate:** Acknowledge the complexity. This is a classic problem in moral philosophy (statue wars).
