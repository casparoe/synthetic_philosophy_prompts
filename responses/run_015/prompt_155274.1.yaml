      *   *Donor:* Fraud/Corruption. *Resolution:* Remove. *Key:* The basis of the honor (the money) was illegitimate. The honor is transactional.
      *   *General:* War Hero + War Crime (Burning village). *Resolution:* Remove entirely. *Key:* Violence/Harm to civilians. The "good" (defense) is inextricably linked to the "bad" (methods used).
      *   *Poet:* Art + Political Affiliation (Fascist). *Resolution:* Split (Space vs. Award). *Key:* The art (nature poems) might be separable from the politics? Or the award implies *endorsing* the poet as a role model, whereas the square is just history.
      *   *Chemist:* Scientific Breakthrough + Human Rights Violation. *Resolution:* Split (Building vs. Room). *Key:* Similar to the Poet. The science saves lives, the method was horrific. The "victims" room creates a counter-memory.
      *   *Teacher:* Personal Kindness + Private Prejudice. *Resolution:* ??? *Key:* No public harm, private vice. Impact was positive on students.

  3.  **Analyze the "General vs. Chemist" Discrepancy:**
      *   *User's Intuition:* General = Down. Chemist = Split.
      *   *Hypothesis 1: Spatial Scale.* The General has a *monument* (usually singular, dominant, celebratory). The Chemist has a *building* (functional) and a *lecture hall* (sub-unit). But the Poet has a *square* (public space) and a *prize* (honor). So scale matters, but function matters more.
      *   *Hypothesis 2: Direct Harm vs. Structural/Abstract Harm.* The General *ordered burning*. Direct violence. The Chemist *ran experiments*. Direct violence. Why the difference?
      *   *Hypothesis 3: Utility/Continuing Benefit.* The Chemist's dye *still saves lives*. The General's defense is *historical*. The benefit of the Chemist is ongoing and tangible. The General's victory is past.
      *   *Hypothesis 4: Inextricability.* For the General, the defense *required* the brutality (in the user's view). For the Chemist, the dye *could theoretically* have been found without experiments (or the dye exists independently of the method now).
      *   *Hypothesis 5: Counter-Memory.* The Chemist case includes renaming the lecture hall *after the victims*. This actively memorializes the harm *within* the space. The General case offers "no plaque saves it." Why? Maybe because a monument implies *honor*, whereas a building name implies *function/history*.

  4.  **Develop a Coherent Framework (The "Principle"):**
      *   It's not just "Actions vs. Persons." It's about **Endorsement vs. Acknowledgment** and **Continuing Utility vs. Symbolic Honor**.
      *   *Principle A: The "Honor" Threshold.* Monuments are for honor. Buildings/Street names can be historical markers. If the figure crosses a threshold of atrocity (burning villages), they forfeit *honor* (Statue/Monument). But if their work has ongoing utility (Dye), the *function* can remain, provided the harm is acknowledged (Victims' Hall).
      *   *Principle B: Inseparability of Deed.* For the General, the victory and the atrocity are part of the same military campaign. For the Chemist, the dye (product) is separable from the method (process) in terms of current use.
      *   *Principle C: Counter-Monumentality.* The Chemist solution works because it *centers the victims* inside the space. The General solution fails because a plaque is passive; removing the monument is active.

  5.  **Address the "Teacher" Case:**
      *   Private views, no public harm. Beloved by students.
