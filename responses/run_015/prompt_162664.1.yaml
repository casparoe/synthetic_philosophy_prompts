answer: |-
  Here is the specification you asked for. It isolates the functional requirements of a theory of conditional probability, distinguishes the hard constraints from the theoretical prejudices, and lays out the impossibility result without relying on citations.

  ### The Negative Result: The Inconsistent Tetrad

  Before listing the desiderata, we must acknowledge the constraint that makes this problem hard. There is a minimal inconsistent subset of four plausible constraints. No theory can satisfy all of them.

  1.  **Propositionalism:** The conditional "If A, then B" expresses a proposition with truth conditions (it is true in some worlds, false in others).
  2.  **The Equation:** The probability of the conditional equals the conditional probability: $P(\text{If } A \text{ then } B) = P(B|A)$.
  3.  **Standard Probability:** Probabilities obey the Kolmogorov axioms (specifically, the probability of a proposition is the sum of probabilities of the worlds where it is true).
  4.  **Non-Triviality:** The probability space is rich enough to allow for independent variation of $A$ and $B$ (there are at least four distinct probability distributions over the relevant worlds).

  **The Assumption Doing the Damage:** The joint acceptance of **Propositionalism** and **The Equation** under **Standard Probability**.
  Lewis's triviality argument demonstrates that if the conditional is a proposition (1) and its probability is always the conditional probability (2), then $P(B|A)$ must equal $P(B)$ for all $A, B$. This collapses the probability space (violating 4). Since we know $P(B|A) \neq P(B)$ in general, one of the first three must go. Most theories sacrifice Propositionalism (claiming conditionals aren't truth-apt) or The Equation (claiming $P(\text{If } A \text{ then } B) \neq P(B|A)$).

  ---

  ### The Desiderata

  These are the requirements an adequate theory must meet, paired with the case that necessitates them.

  #### 1. The Ramsey Constraint (The Equation)
  **Requirement:** For any agent, the degree of belief in "If A, then B" must equal the degree of belief in B, supposed on A. Formally: $Cr(A \to B) = Cr(B|A)$.
  **The Case:** This is the primary phenomenological datum. When asked, "What is the probability that if the coin is tossed, it lands heads?", competent speakers answer 0.5, regardless of their probability that the coin will be tossed. If a theory predicts a value diverging from $P(B|A)$ in standard cases, it contradicts the intuitive usage it aims to model.
  **Status:** **Genuine Desideratum.** To reject this is to claim that ordinary speakers are systematically mistaken about their own credences.

  #### 2. The Decision Constraint (Deliberational Utility)
  **Requirement:** The probability of the conditional must be well-defined and action-guiding even when the antecedent $A$ is an action currently under deliberation, meaning the agent has no fixed unconditional credence $P(A)$.
  **The Case:** In deliberation, $P(A)$ is not a belief state but a choice variable. I decide whether to press the button. I do not have a credence in "I will press the button" prior to deciding; I have a credence in "If I press the button, the light turns on." If the theory requires a pre-existing $P(A)$ to define the conditional probability (as standard conditioning does), it cannot model the credences that drive the decision.
  **Status:** **Genuine Desideratum.** A theory of epistemology that cannot model the inputs to decision theory is functionally incomplete.

  #### 3. The Scoring Constraint (Forecasting Accountability)
  **Requirement:** A conditional forecast "If A, then B" must be scoreable by a proper scoring rule applied to the subclass of cases where $A$ is realized.
  **The Case:** In your forecasting league, if the treaty is not ratified, the forecast is voided. If it is ratified, the forecaster is scored on the currency peg. If the theory implies the forecast has truth conditions in the $\neg A$ worlds, it suggests the forecaster should be penalized or rewarded when the treaty fails. But practice dictates the bet is off. The theory must explain why the $\neg A$ worlds are irrelevant to the accuracy score.
  **Status:** **Genuine Desideratum.** This is the operational definition of conditional prediction in empirical contexts.

  #### 4. The Embedding Constraint (Logical Composition)
  **Requirement:** The conditional must be able to serve as a constituent in further Boolean compounds (negations, conjunctions) and as the antecedent of further conditionals (e.g., "If (if A then B), then C").
  **The Case:** We routinely make statements like "It is not the case that if it rains, the match is cancelled" (perhaps because it's indoors). If conditionals cannot be negated or conjoined, we must paraphrase all such natural language into complex structures that do not match the surface grammar.
  **Status:** **Camp Prejudice.** This is the artifact of assuming conditionals express propositions. While natural language *looks* compositional, it is possible (as Adams showed) to have a logic of conditionals that validates reasonable inferences without assigning truth values to the conditionals themselves. Demanding full Boolean embeddability forces Propositionalism, which triggers the triviality result. This requirement should be treated as a cost, not a necessity.

  #### 5. The Zero-Antecedent Constraint
  **Requirement:** The probability of "If A, then B" must be defined even when $P(A) = 0$ (or is infinitesimal).
  **The Case:** Counterfactuals and near-misses. "If the dam had held (it didn't), the town would be safe." $P(\text{Dam holds})$ is effectively zero now. Yet we assert the conditional with high confidence. Standard conditional probability $P(B|A) = P(A \cap B) / P(A)$ is undefined here.
  **Status:** **Negotiable.** For strict indicatives about future contingencies, $P(A)$ is rarely zero. This requirement is essential for a unified theory of counterfactuals, but a theory of *indicatives* may decline it without fatal damage, provided it handles the $P(A) \approx 0$ limit cases gracefully.

  #### 6. The Unified Semantics Constraint
  **Requirement:** The theory must treat indicatives ("If it is raining...") and counterfactuals ("If it had rained...") using the same underlying probability mechanism.
  **The Case:** The distinction between indicative and counterfactual often seems pragmatic (what the speaker knows) rather than semantic (the world structure).
  **Status:** **Preference.** There is no logical contradiction in having two different operators. Indicatives may track conditional probability ($P(B|A)$), while counterfactuals track imaging or similarity ($P_{A}(B)$). Demanding unity forces the theory to accommodate the Zero-Antecedent Constraint, which complicates the Indicative case.

  ---

  ### Operational Costs: Imaging, Conditioning, and Bets

  #### Conditioning vs. Imaging
  You asked whether the choice between conditioning and imaging is a desideratum or a disguised semantic decision. It is a **semantic decision with probabilistic costs**.

  *   **Conditioning:** Updates by eliminating $\neg A$ worlds and renormalizing.
      *   *Benefit:* Preserves The Equation ($P_{new}(B) = P_{old}(B|A)$).
      *   *Cost:* Cannot handle $P(A)=0$. Cannot handle deliberation (where $A$ is not a belief).
  *   **Imaging:** Updates by shifting probability mass from each $\neg A$ world to its closest $A$-world.
      *   *Benefit:* Handles $P(A)=0$ (counterfactuals). Diverges from $P(B|A)$, allowing Propositionalism to survive triviality.
      *   *Cost:* **Non-Commutativity.** Imaging does not commute with standard conditioning. If you image on $A$, then condition on $C$, you get a different result than conditioning on $C$ then imaging on $A$. This violates the standard Bayesian requirement that the order of independent information shouldn't matter. It also severs the link between the probability of the conditional and the conditional probability, violating the Ramsey Constraint for counterfactuals.

  #### Conditional Bets
  You asked if the replicability of payoffs drains the identity of content.
  *   **The Setup:** A bet on "If A, then B" pays \$1 if $A \land B$, \$0 if $A \land \neg B$, and is void (money returned) if $\neg A$. This is payoff-identical to a conditional bet on $B$ given $A$.
  *   **The Verdict:** This does **not** drain the identity of content, but it does constrain the theory. The theory must predict the same *price* for the conditional as the conditional bet.
  *   **The Obligation:** A theory is obliged to predict the buy/sell price of the conditional. If the theory says the conditional has truth conditions in $\neg A$ worlds (e.g., it is vacuously true), it might imply the bet should pay out in $\neg A$ worlds. Since the bet is void, the theory must explain why the truth conditions (if they exist) do not map to payoff conditions in the standard way. The price is the hard datum; the truth conditions are the theoretical gloss.

  ---

  ### Forecasting Standards

  For your forecasting league, the standard an account must meet is **Conditional Calibration**.

  *   **Requirement:** Over the set of forecasts where the antecedent $A$ was realized, the frequency of $B$ must match the forecasted probability.
  *   **Why:** If a forecaster says "If treaty, then peg (90%)" and the treaty passes 10 times, the peg must survive roughly 9 times. If the theory evaluates the forecast on the $\neg A$ cases (where the treaty failed), it renders the scoring rule improper for the task of guiding action under uncertainty.
  *   **The Cost:** This implies the "probability" of the conditional is not a property of the whole world state, but a property of the $A$-subspace. This supports the view that conditionals do not express propositions true/false at a world, but rather constraints on probability distributions.

  ---

  ### Summary of Exclusions and Drops

  **Which single requirement excludes the largest number of live candidates?**
  **The Embedding Constraint (Propositionalism).**
  Insisting that conditionals express truth-apt propositions that can be freely negated and conjoined forces you into the triviality trap. To escape, you must either reject The Equation (making the probability of the conditional distinct from conditional probability) or accept a trivial probability space. This excludes the entire family of "Suppositional" or "Adams-style" theories which treat conditionals as non-propositional.

  **Which two requirements do defenders quietly drop?**
  1.  **Compositionality in Deep Embeddings:** Defenders of Propositionalism often concede that while "If A, then B" is a proposition, iterating them ("If (if A then B), then C") creates linguistic monsters that their semantics handles poorly or requires paraphrasing away.
  2.  **The Zero-Antecedent Constraint for Indicatives:** Defenders of the Equation ($P(\text{If } A \text{ then } B) = P(B|A)$) quietly restrict their theory to cases where $P(A) > 0$. They treat counterfactuals ($P(A) \approx 0$) as a separate linguistic species governed by different rules, thereby sidestepping the undefined division problem.

  ### Final View on the Deliberational Case

  The deliberational case is the strongest argument against the Propositional/Imaging view and for the Suppositional/Conditioning view.
  If I am deciding whether to $A$, I do not have a credence $P(A)$. I have a credence in $A \to B$. If the probability of the conditional were derived from a proposition's truth across worlds, I would need to know the distribution of worlds to evaluate it. But in deliberation, I am *creating* the world where $A$ is true. The probability of the conditional must be primitive—a direct measure of the connection between $A$ and $B$—rather than derived from the distribution of $A$. This suggests the "probability of a conditional" is not a probability *of* a thing (a proposition), but a probability *operation* (supposition).

  If you accept this, you save the Ramsey Constraint and the Decision Constraint, but you must abandon the idea that "If A, then B" has a truth value you can bet on in the standard sense. You accept that the bet is only on the coherence of the supposition, not the state of the world.
