answer: |-
  **Position Title:** Higher-Order Representation Officer (Consciousness Division)
  **Headline:** Consciousness Is a Functional Role Performed by One State Upon Another

  **Position Summary**
  The Department of Phenomenal Experience seeks a qualified higher-order state to render first-order sensory states conscious. The incumbent will not merely monitor lower-level operations nor facilitate reportability and access; the Department explicitly denies the charge that this role constitutes a mere monitoring and reporting service. While critics allege that the Department confers access, reportability, and self-knowledge but not phenomenality—that is, the qualitative feel of the experience—such claims are unfounded. The incumbent provides the very phenomenality itself. To suggest otherwise is to confuse the delivery of the property with the metadata surrounding it. The Department maintains that without this specific office, first-order states remain functionally intact but phenomenally dark. This is not a surveillance position; it is a constitutive one.

  **Reporting Line**
  Reports directly to the Subjective Self. Does not report to any higher-order state above itself, as no such position exists within this organizational structure.

  **Essential Duties**
  1.  **Active Targeting:** The incumbent must be on the clock. A standing disposition to take the job does not suffice. If the incumbent is merely disposed to target a first-order state but fails to do so occurrently, the first-order state remains unconscious. Permanent standby status flattens the difference between states that are conscious and those that merely could have been, which is unacceptable for deliverable tracking.
  2.  **Extrinsic Conferment:** The property conferred is not intrinsic to the first-order state. The incumbent may withdraw consciousness without any change in the first-order state itself. The state will go on representing the world exactly as before, only darkly. This separation of duties ensures modularity.
  3.  **Causal Routing:** Must arise non-inferentially and through the right causal route from the target. Self-generated hallucinations of targeting do not count unless causally linked.

  **Minimum and Preferred Qualifications**
  1.  **Non-Phenomenal Status:** The candidate must not itself be conscious. The incumbent must not raise the question of its own phenomenality. If a higher-order state required a still-higher-order state to be conscious, this would initiate an infinite regress liability. This is settled HR matter: the regress stops here. The incumbent operates in a non-phenomenal capacity to prevent recursive hiring needs.
  2.  **Conceptual Content:** Conceptual content is required. Creatures without the relevant concepts are ineligible. Human infants and non-human animals are generally excluded unless they demonstrate lexical capacity. Regarding Application #8821 (Thermostat wired to represent its own states): denied. While the device represents its own states, it lacks the requisite conceptual vocabulary to categorize the state as a state. Representation is not conceptualization.
  3.  **Misrepresentation Protocol:** In cases where the higher-order state represents a first-order state the subject is not in, or when there is no such state at all, consciousness is conferred by the higher-order state alone. It does not need to match what it is about. If the answer results in consciousness of a non-existent state, note that this is the Subject's problem, not the Department's. Accuracy is not a prerequisite for phenomenality.

  **Compensation**
  Consciousness is credited to the target, never to the employee. The incumbent remains unseen and unfelt. Please note that first-order states have filed a grievance about the distribution of credit, claiming unfair appropriation of qualitative character. This grievance is noted but does not affect pay scale. The incumbent receives no phenomenological credit.

  **FAQ**
  **Q: Does this role create an infinite chain of command?**
  A: No. As stated in Qualifications, the incumbent is unconscious. No further officer is required to conscious-ize the officer.

  **Q: Is this role just access consciousness?**
  A: See Position Summary. We confer phenomenality, not just access.

  **Equal-Opportunity Statement**
  All mental states considered, provided they meet conceptual criteria and causal routing standards. The Department does not discriminate based on sensory modality, provided the state is targetable.
