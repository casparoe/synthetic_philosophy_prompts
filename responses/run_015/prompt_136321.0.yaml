prompt: |-
  hey so i run a small community center and we're always getting stuck in these stupid fights over equipment or event planning. like last month we spent three hours arguing over a $200 projector and everyone kept doubing down just because they'd already said their piece in front of the board. i think i read about a dollar auction thing where people bid past the value? can you turn that into a practical checklist i can actually run in our meetings? i need the questions in order, what counts as a good enough answer to stop, and where i just have to make a call because it's about values not facts. then run it on two cases: the projector argument, and this other mess where two volenteers keep escalating over who leads the summer program because they've both told people they're in charge and now backing out means losing face. include one case where your checklist says drop it but people are gonna hate that answer. and be honest about where the procedure breaks down or i still have to use my gut.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small community center.
      *   **Problem:** Recurring conflicts over equipment/event planning (sunk cost fallacy, escalation of commitment, face-saving).
      *   **Specific Reference:** Mentions the "Dollar Auction" (a game theory paradox where bidders pay more than the item's value to avoid losing).
      *   **Task:** Create a practical checklist based on this concept for meetings.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for "good enough" answers to stop.
          *   Indication of where the leader must make a call (values vs. facts).
          *   Apply the checklist to two cases:
              1.  The $200 projector argument.
              2.  The summer program leadership conflict (face-saving/escalation).
          *   Include one case where the checklist says "drop it" but people will hate that answer.
          *   Be honest about limitations (where the procedure breaks down/gut needed).
      *   **Tone:** Practical, honest, direct, empathetic to non-profit/community constraints.

  2.  **Deconstruct the "Dollar Auction" Concept:**
      *   *What is it?* Martin Shubik's game. Highest bidder wins the dollar, but *second* highest bidder also pays their bid and gets nothing.
      *   *Why do people lose?* Sunk costs ("I've already bid 90 cents, I can't lose that"), escalation ("If I bid $1.05, I only lose 5 cents"), pride/face.
      *   *Application to Community Center:* People invest time/emotion/reputation into a decision. Changing course feels like a loss. They escalate commitment to justify past investment.
      *   *Goal of Checklist:* Interrupt the escalation, separate sunk costs from future value, identify face-saving traps.

  3.  **Drafting the Checklist (The "Anti-Escalation Protocol"):**
      *   Need to stop the bidding war before it starts or early on.
      *   *Step 1: Value Check.* What is this actually worth? (Objective baseline).
      *   *Step 2: Sunk Cost Audit.* What have we already spent/said? (Acknowledge it, then ignore it).
      *   *Step 3: The "Walk Away" Test.* If we started today, would we do this? (Future-focused).
      *   *Step 4: Face-Saving Off-ramp.* How can someone step back without losing dignity? (Crucial for volunteers).
      *   *Step 5: The Cut-off.* When does the leader step in?

  4.  **Developing the Cases:**

      *   **Case 1: The $200 Projector.**
          *   *Scenario:* 3 hours arguing over a $200 item.
          *   *Application:* The cost of time (3 hours x board members' hourly value/opportunity cost) exceeds the projector cost.
          *   *Outcome:* Checklist should flag this immediately.
          *   *Hate-it Answer:* "Stop arguing, we aren't buying it yet," or "The time spent is already wasted, stop throwing more time at it."

      *   **Case 2: Summer Program Leadership.**
          *   *Scenario:* Two volunteers, both claimed leadership, backing out = losing face.
          *   *Application:* This isn't about facts (who is better); it's about status and commitment.
          *   *Outcome:* Needs a face-saving off-ramp (co-leadership? different roles?).
          *   *Hate-it Answer:* "Neither of you leads it." (Maybe too harsh). Let's try: "We pause the program." Or "We rotate." Actually, the prompt asks for *one* case where the checklist says drop it and people hate it. The Projector one fits "drop the argument" well. The Summer Program fits "restructure roles." Let's make the "Hate-it Answer" about the Projector (stopping the purchase entirely because the process cost too much) or the Summer Program (canceling the program because the cost of conflict is too high). Let's go with canceling/delaying the Summer Program leadership decision until cool-down, which feels like a loss. Actually, the prompt asks for "one case where your checklist says drop it." Let's apply that to the Projector argument itself. "Drop the argument, flip a coin, move on." No, better: "Drop the purchase."
          *   *Refinement:* Let's make the "Hate-it Answer" specific to the *Summer Program*. If the conflict threatens the center's cohesion, the checklist might say "Cancel the program for this year." Volunteers will hate that.

  5.  **Addressing Limitations (Gut Check):**
      *   Checklists don't handle emotions well.
      *   Power dynamics (who owns the building?).
      *   Urgency (if the projector is needed *now*).
      *   Relationship preservation vs. Efficiency.

  6.  **Refining the Output Structure:**
      *   **Intro:** Acknowledge the Dollar Auction insight (it's about escalation, not the object).
      *   **The Checklist:** 5 steps, clear stop criteria.
      *   **Case Study 1 (Projector):** Run the checklist.
      *   **Case Study 2 (Summer Program):** Run the checklist.
      *   **The "Hate-It" Outcome:** Explicitly highlight where the logic hurts feelings.
      *   **The Breakdown Points:** Where the checklist fails and gut is needed.

  7.  **Drafting Content (Iterative refinement):**
      *   *Checklist Step 1:* Define the "Dollar." (What is the actual value?)
      *   *Checklist Step 2:* Calculate the "Bid." (What are we spending *now* to get it?)
      *   *Checklist Step 3:* The Zero-Base Question. (If we hadn't started, would we?)
      *   *Checklist Step 4:* The Face-Saver. (How do we let someone lose without looking like a loser?)
      *   *Checklist Step 5:* The Hard Stop. (Leader intervention.)
      *   *Case 1:* Time cost > Projector cost. Stop immediately.
      *   *Case 2:* Reputation cost > Program value. Need role redefinition.
      *   *Hate-it:* Telling the volunteers neither can lead, or canceling the projector purchase because the *argument* cost too much. Let's go with canceling the projector purchase. "We spent $500 worth of board time arguing over a $200 item. We aren't buying it."
      *   *Limitations:* People aren't rational. Relationships matter more than money in community centers.

  8.  **Final Review against Constraints:**
