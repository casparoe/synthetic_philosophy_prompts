answer: |-
  Here is your battle plan for the Q&A. The room is hostile to semantic shifts, so your goal is not to win a philosophical debate but to show that your distinction *solves* empirical problems they care about.

  ### 1. The Mesoamericanist (The "Monuments Stop" Objection)
  **The Objection:** "You're drawing a distinction between elite institutions and the population that doesn't exist in the Terminal Classic. When the stelae stop getting raised, the Long Count ends, and the palaces are abandoned, the *mechanism* that made them Maya is gone. The peasants might stay, but without the ritual calendar and the divine kings, isn't that, by definition, the end of that society?"
  **Damage:** **High.** This attacks your core distinction. If they equate "society" with "state apparatus," your fission argument fails.
  **The Reply (90s):** "I concede that the *state* collapsed. My argument isn't that nothing ended, but that the 'Maya' isn't identical to the 'Classic State.' If we define the society solely by its elite institutions, we make the peasants invisible until the Spanish arrive. My distinction allows you to say the *polity* collapsed violently while the *population* persisted and reorganized. It doesn't deny the break; it locates it specifically in the institutional layer, which helps explain why Postclassic culture looks both discontinuous and familiar."
  **Concession:** Admit the elite system is dead.
  **Soft Spot:** You are implicitly weighting demographic continuity as more "real" than institutional continuity. You haven't justified why the peasant's identity counts more than the king's.

  ### 2. The Bronze Age Specialist (The "Systemic Complexity" Objection)
  **The Objection:** "In the Eastern Med, we're talking about the loss of literacy, long-distance trade, and specialized craft production on a scale that takes centuries to recover. That's a loss of complexity, not just a change of management. Calling that 'reorganization' feels like minimizing the scale of the catastrophe."
  **Damage:** **Medium.** They worry you are softening the hard reality of deprivation.
  **The Reply (90s):** "I'm not minimizing the catastrophe. A loss of complexity is a massive trauma. But 'collapse' suggests a terminal endpoint, like a biological death. Your own data shows recovery, just different. By separating institutional continuity from demographic continuity, we can measure the *degree* of complexity loss without implying the people vanished. It lets us ask: did the trade networks fail because the people died, or because the palaces that managed them burned? That changes how we model the recovery."
  **Concession:** Acknowledge the trauma and loss of complexity.
  **Soft Spot:** You are using "reorganization" as a euphemism for "decomposition" in some cases. You're relying on their goodwill to not press you on the threshold where reorganization becomes extinction.

  ### 3. The Paleoclimatologist (The "Proxies Don't Care" Objection)
  **The Objection:** "I'm looking at oxygen isotopes in speleothems. There was a massive drought. The carrying capacity dropped. The system failed. Whether you call it 'collapse' or 'fission' is semantics. The environmental forcing settled the outcome. Why complicate a causal chain with 'interest-relative' identity criteria?"
  **Damage:** **Medium-High.** They view your framework as obscuring physical causality.
  **The Reply (90s):** "The drought is the stressor, not the definition. My point is that the *same* drought produces different outcomes depending on what you're tracking. In one valley, the institutions break; in the next, the people migrate. If we treat 'collapse' as a monolithic event caused by drought, we miss the variation in human response. My framework doesn't change the rain; it changes how we map the rain's impact on different layers of the social fabric."
  **Concession:** The physical forcing is objective and primary.
  **Soft Spot:** You are bordering on social constructivism about physical limits. If the carrying capacity drops below survival threshold, "identity" is irrelevant. You have no answer for total depopulation cases.

  ### 4. The Resilience Ecologist (The "We Already Have This" Objection)
  **The Objection:** "In panarchy terms, this is just the 'release' phase followed by 'reorganization.' We already model the separation of slow variables (soil, culture) and fast variables (markets, politics). What does Parfit add that a Holling adaptive cycle doesn't already handle without the metaphysical baggage?"
  **Damage:** **Medium.** They might view your philosophy as redundant jargon.
  **The Reply (90s):** "Panarchy describes the *process* of change; I'm addressing the *identity* of the thing changing. Resilience theory asks 'how does it bounce back?' I'm asking 'what is the *it* that bounced?' If the 'it' is defined by the pre-collapse state, then by definition it didn't survive. If we use a Parfit-style connectedness view, we can model the Postclassic as a descendant system rather than a failed copy. It clarifies the unit of analysis for your resilience models."
  **Concession:** Resilience theory is the superior tool for modeling dynamics.
  **Soft Spot:** You are stretching Parfit (personal identity) to fit systems theory. The fit isn't perfect, and the ecologist knows it.

  ### 5. The Community-Engaged Archaeologist (The "Erasure" Objection)
  **The Objection:** "When we tell descendant communities 'your civilization didn't collapse,' it can sound like we're denying the violence their ancestors suffered. It risks validating the colonial narrative that Indigenous people are static, or that the trauma of conquest doesn't count because 'people stayed.' How is this not an erasure of suffering?"
  **Damage:** **Critical.** This is the ethical trap. If you fail here, you lose the room's moral confidence.
  **The Reply (90s):** "That is a vital risk, and I don't want to erase suffering. My goal is the opposite: to validate the survival that colonial narratives deny. Saying 'the Maya collapsed' often implies 'the Maya disappeared,' which is used to sever land claims and cultural rights. By distinguishing institutional death from demographic survival, we honor the trauma of the former while affirming the continuity of the latter. It allows us to say: 'The state was destroyed, but the people endured.' That supports descendant claims better than 'collapse.'"
  **Concession:** Acknowledge the political risk of the term "collapse."
  **Soft Spot:** You are assuming the descendants *want* the "survival" narrative. Some might prefer the "catastrophe" narrative to highlight injustice. You don't know their weighting.

  ### 6. The Mesoamericanist II (The "Dating" Objection)
  **The Objection:** "Practically speaking, we use 'collapse' as a chronological marker. Terminal Classic ends at 900 CE because the markers stop. If 'collapse' is interest-relative, how do we date anything? Do we have two chronologies now? One for kings and one for farmers?"
  **Damage:** **Low-Medium.** This is a practical annoyance, not a theoretical kill-shot.
  **The Reply (90s):** "We essentially already do. We date the cessation of monuments differently from the cessation of occupation layers. My framework just makes that explicit. It stops us from using the end of elite monuments as a proxy for the end of habitation. It cleans up the chronology rather than confusing it."
  **Concession:** Chronological precision is necessary.
  **Soft Spot:** You are hand-waving the synchronization problem. If the two chronologies diverge significantly, your "society" becomes incoherent as a unit of analysis.

  ### 7. The Resilience Ecologist II (The "Threshold" Objection)
  **The Objection:** "There are tipping points. When feedback loops break, the system enters a new basin of attraction. That's an objective threshold, not an 'interest.' If the feedback loops of the palatial economy are gone, the system is gone. Why call it survival?"
  **Damage:** **Medium.** They are pressing on the objective vs. relative distinction.
  **The Reply (90s):** "The feedback loops of the *palace* are gone. But new feedback loops of the *village* take over. Is that a new system or the old one reconfigured? That's where the interest comes in. If you care about state revenue, it's collapse. If you care about caloric intake, it might be stability. The threshold is real, but what crosses it depends on which variables you're measuring."
  **Concession:** Tipping points are real physical phenomena.
  **Soft Spot:** You are shifting the goalposts. If the "system" is defined by the variables, changing the variables changes the system by definition. This borders on tautology.

  ### 8. The Community-Engaged Archaeologist II (The "Authority" Objection)
  **The Objection:** "You say we need to supply the weighting. Who supplies it? You? The archaeologist? The descendant community? If it's interest-relative, whose interests count? If I weight demographic continuity and you weight institutional, who's right?"
  **Damage:** **High.** This exposes the lack of a normative framework in your theory.
  **The Reply (90s):** "That's exactly why we need to make the weighting explicit. Currently, it's hidden in the word 'collapse,' which usually defaults to the state's perspective. I'm arguing we should democratize that weighting. In some contexts, the institutional break matters most; in others, the demographic continuity. The answer isn't 'who is right,' but 'which question are we asking?' For land rights, demographics matter. For art history, institutions matter."
  **Concession:** There is no single "correct" weighting.
  **Soft Spot:** You have no metric for resolving conflicts between weightings. If land rights conflict with art historical periodization, you offer no adjudication.

  ***

  ### The One Reply That Must Land
  **Target:** Objection #1 (The Mesoamericanist: "The mechanism that made them Maya is gone").
  **Why:** If you cannot convince the regional specialists that "Society" $\neq$ "State," your entire framework is dismissed as philosophical nitpicking irrelevant to the dirt. You must validate their data (the monuments stopped) while reframing the interpretation (the people didn't vanish).
  **Key Phrase to Hit:** "It doesn't deny the break; it locates it."
  **Goal:** Make them feel that your distinction gives them *more* precision, not less.

  ### The Question You Are Praying Nobody Asks
  **The Question:** "You argue that 'collapse' is interest-relative and depends on how we weight institutional versus demographic continuity. **So, in your own view, for the Terminal Classic Maya, which continuity matters more? And by what objective metric do *you* decide that weighting, other than your own philosophical preference?**"
  **Why It's Dangerous:** This exposes the "interest-relative" claim as potentially arbitrary. If you say "demographic," you look like a populist ignoring the state. If you say "institutional," you contradict your thesis. If you say "it depends," you look evasive. You haven't established a normative basis for *which* interests *should* dominate archaeological explanation, only that they *do*. This question forces you to reveal your own bias, undermining the claim that you are simply clarifying others' confusion.
