answer: |-
  ### Phase 1: The Audit Map

  To evaluate the consultant's claim that "moral uncertainty is just factual uncertainty with extra steps," we must first make the structural correspondence explicit. In standard decision theory under factual uncertainty, the machinery looks like this:

  1.  **State Space:** The set of mutually exclusive, exhaustive ways the world might be (e.g., "The bridge holds," "The bridge collapses").
  2.  **Probability Measure:** A credence distribution over the state space summing to 1 (e.g., "90% chance it holds").
  3.  **Outcome Function:** A mapping from (Action, State) to a concrete outcome (e.g., "Crossing + Collapse = Death").
  4.  **Utility Function:** A valuation of outcomes on a cardinal scale (e.g., "Death = -1,000,000 utils").
  5.  **Shared Currency:** The utility scale is common to all states. Whether the bridge holds or collapses, "Death" is valued consistently in the calculation.
  6.  **Aggregation Rule:** Expected Utility = $\sum (Probability \times Utility)$.

  The consultant proposes this mapping for moral uncertainty:

  1.  **State Space:** The set of moral theories (e.g., "Utilitarianism is true," "Deontology is true").
  2.  **Probability Measure:** Your credence in each moral theory.
  3.  **Outcome Function:** The choice-worthiness of an action *given* a theory (e.g., "Scaling A is good according to Utilitarianism").
  4.  **Utility Function:** *The choice-worthiness function provided by the theory.*
  5.  **Shared Currency:** *Assumed to exist.* (This is the first hidden assumption).
  6.  **Aggregation Rule:** Expected Choice-Worthiness = $\sum (Credence \times Choice-Worthiness)$.

  The consultant's argument rests on the stability of slots 4, 5, and 6. They assume moral theories output values in a commensurable currency and that all theories accept the aggregation rule. Our committee's specific dilemma reveals that these slots are empty or contested.

  ### Phase 2: Failure Modes (Brainstorm and Sort)

  I have brainstormed the structural disanalogies between factual and moral uncertainty. I will now sort them into those that are merely technical nuisances and those that are fatal to the consultant's recommendation for *this* committee.

  **Category 1: Technical Nuances (Do Not Bite)**
  *   *The Ontological Status of Credences:* In factual cases, probabilities often track frequencies or propensities. In moral cases, they track epistemic confidence in normative truths. While philosophically distinct, for the purpose of *action*, we must act on our best guess regardless. This does not stop us from calculating expectations.
  *   *Diachronic Instability:* Moral credences shift as we deliberate. Factual probabilities shift as we gather data. While moral updating is messier, it does not invalidate the synchronic calculation of what to do *now*.
  *   *The "My Favorite Theory" Heuristic:* In factual uncertainty, acting on the most probable state is usually irrational (risk aversion). In moral uncertainty, some argue you should just follow the most credible theory. This is a rival decision rule, not a breakdown of the analogy itself.

  **Category 2: Serious Structural Breaks (Bite Hard)**
  *   *Intertheoretic Comparison (The Currency Problem):* In factual uncertainty, a dollar is a dollar regardless of which state obtains. In moral uncertainty, Theory A (Utilitarianism) might measure value in "welfare units," while Theory B (Deontology) measures it in "rights fulfilled." There is no exchange rate. If Programme A yields 100 welfare units but violates 1 right, and Theory B says rights are incommensurable with welfare, the sum is undefined. The consultant assumes a "master currency" that does not exist.
  *   *Unboundedness and Lexicality (The Infinity Problem):* Factual decision theory typically assumes bounded utility to avoid paradoxes. Our suffering-focused view (supporting Programme B) posits that suffering is *lexically* worse than other goods. If suffering has negative infinite value, and there is a non-zero probability of catastrophe, the Expected Value of avoiding it dominates all else, regardless of probability magnitude. This renders the trade-off between A (moderate good) and B (catastrophe avoidance) arithmetic nonsense. You cannot balance a finite number against a lexical priority.
  *   *Meta-Ethical Instructions (The Process Problem):* In factual uncertainty, the state of the world is passive; the bridge does not care how you calculated its stability. In moral uncertainty, the "states" (theories) are active normative instructions. Our consent-based view (supporting Programme C) explicitly forbids the aggregation method itself. It claims that weighting theories by private credences is a violation of standing.

  **Category 3: The Fatal Break (Undermines the Consultant Entirely)**
  *   *The Self-Undermining Aggregation:* This is a specific subset of the Process Problem. If you assign 40% credence to the Consent View, and the Consent View says "It is forbidden to use Expected Value Maximization (EVM)," then EVM instructs you to violate the Consent View. But if you violate the Consent View, you are acting in a way that 40% of your moral credence deems impermissible *on principle*.
      In factual uncertainty, a state of the world never says "Calculating expectations is forbidden." In moral uncertainty, the theories themselves compete over the *right to decide how we decide*. The consultant's method privileges consequentialist-style aggregation over deontological/procedural constraints. It is not neutral arithmetic; it is a substantive moral stance that overrides the procedural objections of Programme C's supporters.

  ### Phase 3: The Verdict

  The consultant's conclusion—that we should proceed with expected-value weighting and treat objections as "squeamishness"—does not survive the audit. The analogy was carrying the argument, not the arithmetic.

  The consultant treats moral theories as *descriptive hypotheses* about value (like hypotheses about bridge stability). But moral theories are *prescriptive authorities*. When a theory prescribes a decision rule (e.g., "Do not aggregate," or "Suffering is lexical"), it cannot be treated as merely one input into an aggregation rule that it fundamentally rejects.

  By forcing the Consent View into an EVM framework, you are already deciding against it. You are saying, "We will respect your concern for consent only to the extent that our credence in you allows us to override you." This is precisely what the Consent View defines as a violation of standing. Similarly, by forcing the Suffering View into a bounded EVM framework, you are implicitly rejecting its lexical claim, reducing infinite badness to a finite variable to make the math work.

  Therefore, EVM is not a neutral way to handle disagreement here. It is a way of *resolving* disagreement by fiat in favor of theories that accept aggregation and boundedness. For this committee, adopting the consultant's method would effectively veto Programme C (since its core value is procedural) and distort Programme B (by capping its lexical urgency).

  ### Phase 4: A Better Analogy

  Do not model this as **Discovery** (finding the true state of the world). Model it as **Legislation** (negotiating between rival authorities).

  In a parliament, parties hold different views. They do not calculate the "expected value" of laws based on their seat share. They negotiate, form coalitions, and sometimes accept veto powers (filibusters) for minority interests to ensure procedural legitimacy.
  *   **Programme A** is the coalition builder (broad support, moderate gain).
  *   **Programme B** is the emergency veto (a minority view that claims catastrophic stakes).
  *   **Programme C** is the rules of order (ensuring the process itself is legitimate).

  Under a legislative model, you do not sum values. You look for a reflective equilibrium or a "satisficing" agreement that no powerful bloc reasonably rejects. This might mean funding C significantly, not because its EV is highest, but because without it, the committee lacks the legitimacy to fund A or B. It treats the disagreement as political-normative, not statistical.

  ### Phase 5: Personal Commitment and Confidence

  **Where I am least confident:**
  I am least confident in the claim that *intertheoretic comparison* is impossible. Philosophers have proposed normalization schemes (e.g., scaling all theories by their variance or range) that could restore a common currency. If a robust, defensible normalization method exists, the "Currency Problem" dissolves, and EVM becomes viable again. I cannot prove such a method is impossible, only that the consultant has not provided one.

  **What would make me back Expected-Value Weighting:**
  If the Consent-based view could be reformulated not as a constraint on *method*, but as a constraint on *outcomes* (e.g., "Lack of consent reduces the value of the outcome by X amount"), it could be fed into the EVM calculator. If the procedural view can be consequentialized, the "Self-Undermining" break disappears. If you can convince the proponents of Programme C that their value can be quantified and traded, EVM survives.

  **The Single Disanalogy That Undermines My Reasoning:**
  The **Meta-Ethical Instruction** break. My entire verdict rests on the claim that moral theories can issue binding instructions about *how to handle uncertainty itself*. If it turns out that moral theories only prescribe actions in certain states of the world, and *never* prescribe how to aggregate uncertainty about those theories, then the "Self-Undermining" problem vanishes. If the Consent View is merely a claim about what is right in a world where consent is respected, and not a claim about how to reason under uncertainty about consent, then the consultant is right: we should just use our credences. If moral theories are silent on meta-ethics, EVM is the default. I am betting that they are not silent, but that is the weakest link in my audit.
