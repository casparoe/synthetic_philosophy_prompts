answer: |-
  Here is the brainstorming list of candidate accounts, followed by the elimination process and the committed argument.

  ### Candidate Accounts (Brainstorm)

  1.  **Pure Hyperbolic Discounting:** Institutions simply recognize time-inconsistent preferences and help the "planner" beat the "doer."
  2.  **Full Present Sovereignty:** The will at the moment of action is always supreme; past commitments are merely informational.
  3.  **Hard Paternalism:** The state knows what is good for you better than you do and enforces it regardless of current desire.
  4.  **The "True Self" Theory:** Past reflective decisions represent the "real" you; present impulses are alien intrusions.
  5.  **Contractual Formalism:** The differences are just artifacts of specific legal doctrines (consideration, specific performance) with no deeper philosophical unity.
  6.  **The "Domain-Specific Sovereignty" Account:** Agents have constitutional authority over external resources via past reflection, but sovereign veto power over bodily integrity in the present.

  ### Elimination

  *   **Junk 1 (Hyperbolic Discounting):** Descriptive, not normative. It explains why we *want* commitment devices, but not why institutions *enforce* some (gambling bans) and forbid others (specific performance), or why medical consent is withdrawable.
  *   **Junk 2 (Present Sovereignty):** Dead on arrival for Case One. If present will were sovereign, self-exclusion lists would be void the moment you asked to be removed.
  *   **Junk 3 (Hard Paternalism):** Fails Case Two. If the state knew best, you wouldn't be allowed to withdraw consent from a life-saving procedure once signed.
  *   **Junk 4 ("True Self"):** Too metaphysical. It struggles to explain why the "real" self's prior wish to be detained (Ulysses clause) is often overridden by the "alien" self's present refusal in medical contexts, whereas in gambling it isn't.
  *   **Junk 5 (Contractual Formalism):** Too shallow. It explains the *how* but not the *why*. Law follows philosophy here; the asymmetry in specific performance exists for a reason, not just by accident.

  ### The Committed Account: The "Domain-Specific Sovereignty" Theory

  The implicit theory governing these practices is **Domain-Specific Sovereignty**. It holds that agency is not a monolith but is split between two domains: the **Constitutional Domain** (external resources, access, rules) and the **Somatic Domain** (bodily integrity, immediate action).

  On this view, your past reflective self has legitimate authority to bind your future self in the Constitutional Domain. You are treated as a trustee of your own future welfare regarding resources and access. However, your present embodied self retains an absolute veto in the Somatic Domain. You cannot contract away your bodily sovereignty, even to your past self. Weakness of will (akrasia) is recognized as a genuine failure of the Constitutional Self to manage resources, but it is not recognized as a justification for overriding the Somatic Self's right not to be compelled.

  This theory reconciles the apparent contradiction between Case One and Case Two. In Case One (gambling), the institution restricts *access* to an external resource (the casino). This is a Constitutional constraint. The past self's ban is valid because it protects the agent's long-term resource base from the present self's impulsivity. The present self's desire to enter is treated as evidence of the very pathology the ban was designed to block.

  In Case Two (medical), the procedure involves *bodily intrusion*. This falls into the Somatic Domain. Here, the present self's veto is absolute. Even if the past self signed a consent form, the present self's withdrawal of consent must be honored because enforcing the past wish would require physically compelling the body against its current will. That transforms the agent from a person into a tool.

  Case Three (cooling-off periods) fits as a protection of the Constitutional formation process. Doorstep sales or timeshares are recognized as environments where the Constitutional Self is bypassed by high-pressure tactics. The cooling-off period is a procedural grace note allowing the Constitutional Self to ratify the decision. Once ratified (or if signed in a shop), the Constitutional bind holds.

  Case Four (the asymmetry of commitment devices) is the strongest evidence for this theory. Institutions will enforce omissions (don't go to the casino) and penalties (pay money if you skip the gym) because these operate in the Constitutional Domain—they restrict options or redistribute resources. They will not enforce actions (specific performance of personal services) because that requires commanding the Somatic Domain. Auto-enrolment and defaults fit here: they are structural nudges (Constitutional), not physical compulsion (Somatic). They change the path of least resistance, but they do not grab your body and move it.

  ### Consistency and The Line

  Is this consistent? Yes, but only if you accept the line between **External Access** and **Bodily Integrity**. The practices presuppose that you can own your future constraints, but you cannot own your future body in a way that allows it to be coerced.

  Could a present-sovereignty theorist get here? Only by treating pre-commitment as a revocable license. But that fails Case One, where the license is *not* revocable at will. Could a temporal-neutral theorist (equal weight to all selves) get here? They would struggle with the asymmetry in Case Four. If all selves matter equally, why can't the Past Self contract the Future Self to perform labor? The temporal-neutral view collapses into enforceable servitude unless it imports a separate dignity constraint. The Domain-Specific theory builds that constraint in: the present body is the locus of dignity, and dignity cannot be bound by past contract.

  Is the asymmetry in Case Four principled or just enforcement cost? It is principled. Enforcing specific performance of personal services requires continuous monitoring and physical coercion, which violates the liberal conception of the person. Penalties and omissions are one-off or structural; they leave the agent free to choose the penalty or the omission. They preserve the *form* of choice even while restricting the *content*. Compulsion destroys the form of choice.

  ### Alternatives and What We Lose

  If we dropped this theory for **(a) Full Sovereignty of the Present Will**:
  *   **Case 1:** Self-exclusion lists become void. You walk in, you say "I want to bet," they let you. We lose the ability to protect ourselves from known addictive pathologies. The gambler loses their savings; the institution washes its hands.
  *   **Case 4:** Commitment contracts (stickK, etc.) become unenforceable. You promise to pay if you don't gym, then refuse. No recourse.
  *   **Concrete Loss:** We lose the social technology of *binding*. Vulnerable agents lose the only leverage they have against their own worst impulses.

  If we dropped it for **(b) Temporal Neutrality (Future Selves = Present Selves)**:
  *   **Case 2:** Medical consent becomes binding. You sign today, you are wheeled in tomorrow screaming "stop," they cut anyway because Past You said yes.
  *   **Case 4:** Specific performance becomes valid. You contract to work for five years; you try to quit; you are physically compelled or imprisoned for breach.
  *   **Concrete Loss:** We lose the *veto*. We lose the recognition that being a person means having the final say over what happens to your body *now*. We become resources for our own past plans.

  ### Confidence and Defeater

  I am about 85% confident this is the correct reconstruction of the implicit theory. It fits the legal and institutional data better than any pure psychological or pure libertarian model.

  The single consideration that would move me off this account is **evidence of enforced positive action in non-bodily domains that mirrors bodily compulsion.** If we see institutions successfully enforcing "positive" commitments that are not just penalties or omissions—for example, if a court ordered you to *produce* a specific creative work under threat of imprisonment, not just pay damages, and this was widely regarded as legitimate autonomy-enhancing practice—then the distinction between Constitutional constraint and Somatic compulsion blurs. If we can be forced to *act* (not just refrain) without losing our status as agents, then the Bodily Sovereignty veto is not the fundamental line, and my account collapses into a simpler cost-benefit analysis of enforcement. But currently, the law's refusal to enforce specific performance of personal services remains the hard wall that validates the theory.
