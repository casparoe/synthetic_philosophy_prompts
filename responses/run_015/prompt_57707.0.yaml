answer: |-
  **The Van Meegeren Affair as a Stress Test for Hume's Standard of Taste**

  David Hume's *Of the Standard of Taste* attempts to resolve the paradox that taste is subjective ("Beauty is no quality in things themselves") yet we speak of some artistic judgments as better than others. His solution is the "joint verdict of true judges." The Han van Meegeren affair offers a singular empirical stress test for this machinery. Here we have a fixed object (the canvas), a radical reversal of verdict (from Vermeer masterpiece to competent pastiche), and a clear explanation for the reversal (the revelation of authorship). By mapping the 1937 attribution onto Hume's criteria, we can see where his theory holds, where it strains, and where it falls silent.

  **Mapping the 1937 Verdict**

  In 1937, Abraham Bredius and the Boijmans museum board functioned as Hume's putative "true judges." Bredius possessed **practice** (decades of study) and **comparison** (familiarity with the corpus of Dutch painting). His **good sense** was presumed high, given his directorship of the Mauritshuis. However, the reversal suggests a catastrophic failure in **delicacy of sentiment** or **freedom from prejudice**.

  If Hume is correct, the 1937 consensus cannot count as the standard of taste because it was not stable. But to explain *why* it failed, Hume must identify a defect in the judges. It is difficult to argue they lacked delicacy in a sensory sense; they saw the brushwork and color clearly. The defect lies in **freedom from prejudice**. Hume defines prejudice as allowing extraneous considerations to distort the sentiment. In 1937, the art world was prejudiced by the desire for a new Vermeer, national pride in Dutch heritage, and the authority of Bredius himself. Because their sentiment was influenced by the *attribution* rather than the *sensation*, they were, by Hume's definition, unqualified. Consequently, the 1937 verdict is not a standard of taste, but an error of judgment masquerading as one.

  **The Key in the Wine and the Problem of Circularity**

  Hume illustrates delicacy with the story of the two wine tasters in *Don Quixote* who detect iron and leather in a cask. Their verdict is vindicated by the discovery of a key on a leather thong at the bottom. This provides an independent check: the physical fact (the key) explains and validates the subjective sensation (the taste).

  In the Van Meegeren case, we have analogues to the key: Van Meegeren's confession, the chemical analysis of modern pigments, and the later connoisseurship that identified anachronisms. However, these keys validate a fact of *provenance*, not a fact of *aesthetic value*. The key proves the canvas is from the 1930s, not the 1660s. It does not prove the canvas is aesthetically inferior.

  This leaves Hume with a circularity problem. We identify the post-war judges as "true" only because we accept their verdict that the paintings are inferior. We accept their verdict as correct only because we trust the judges. In the wine case, the key validates the sensation directly (there *was* leather in the wine). In the art case, the key validates the history, and we *infer* the aesthetic demotion.

  This is damaging to Hume because it suggests the "true judge" is identified retrospectively by the verdicts we already accept, rather than by independent qualifications. If the only proof of a true judge is that they agree with the current consensus, the standard of taste is tautological. Hume's resource against this is the **consensus over time**. He argues that while individuals err, the collective verdict of qualified observers will converge. The Van Meegeren case shows this convergence happening (from praise to dismissal), but it relies on the assumption that the second verdict is less prejudiced than the first—an assumption the "key" (the confession) does not strictly guarantee.

  **Provenance, History, and the Unchanged Canvas**

  The most troubling fact for Hume is that the canvases did not change. The 1937 panel and the post-war panel were largely the same population with the same training and perceptual access. What changed was information about the work's history.

  Hume's framework struggles to accommodate the idea that provenance bears on beauty. For Hume, beauty is a sentiment aroused by the object's form and composition. If the form is constant, the sentiment *ought* to be constant, provided prejudice is removed. To account for the reversal, Hume must argue that the 1937 judges were admiring the *idea* of Vermeer, not the painting itself. Their admiration was contaminated by the "prejudice" of the name.

  However, this forces a demotion of the earlier judges. Hume cannot say, "The painting was beautiful when we thought it was Vermeer, and less beautiful when we knew it was Van Meegeren." He must say, "The painting was never truly beautiful in the way you thought; your earlier sentiment was an error." This preserves the objectivity of the standard but ignores the intuition that aesthetic experience is partly constituted by historical context. If the achievement behind the object (the genius of Vermeer vs. the trickery of Van Meegeren) is part of what we value, then the object *did* change in 1945, even if the canvas did not. Hume's theory can register the reversal only by insisting that historical context is a source of prejudice, not a constituent of beauty. He has no place for the thought that knowing a work is a forgery legitimately alters its aesthetic status, other than by labeling the prior appreciation as false.

  **Durability and the Test of Time**

  Hume treats durability across ages and countries as evidence of genuine merit. The Van Meegeren paintings survived roughly a decade as "Vermeers" before being revoked.

  Does this vindicate the test? In one sense, yes. The pictures did not survive as masterpieces. The test of time flagged them correctly eventually. The false attribution could not sustain the sentiment indefinitely once the truth emerged. This supports Hume's view that false merit cannot hold the joint verdict of true judges forever.

  However, it also shows that the test tracks the survival of an *attribution* rather than a property of the object. The paintings were "durable" as long as the lie held. This suggests that the "test of time" is vulnerable to non-aesthetic facts. If Van Meegeren had never confessed, the paintings might still be hanging in museums as Vermeers today, passing the test of time based on a falsehood. Hume assumes that time filters out prejudice, but the Van Meegeren case shows that time can also calcify error. The test only works if the truth eventually emerges; if the "key" is never found, the false verdict becomes the standard.

  **Limitations and Theoretical Silence**

  Finally, we must be candid about what this episode cannot settle. The post-war demotion was not a pure application of Humean "good sense." It was shaped by revulsion at Van Meegeren's collaboration with the Nazis, the embarrassment of the experts who had certified him, the collapse of market values, and the awkward fact that Van Meegeren became a national hero for swindling Göring.

  Each of these factors looks like precisely the sort of prejudice Hume wants the true judge cleared of. The post-war judges were not free from the prejudice of moral disgust or institutional self-preservation. If the 1937 verdict was contaminated by the desire for a masterpiece, and the 1945 verdict was contaminated by the shame of being swindled, the case fails to discriminate between realism and response-dependence about beauty. We never access the "uncontaminated" verdict. We only swap one set of biases for another.

  Where the theory is silent is on the procedure for cleaning the slate. Hume tells us to clear our minds of prejudice, but he offers no method for distinguishing a "corrected" sentiment from a "reactive" one. If the post-war consensus is just as socially determined as the pre-war one, Hume's "joint verdict" is merely the prevailing opinion of a different era, not a standard grounded in human nature. The Van Meegeren affair demonstrates that while Hume's machinery can describe the *shift* in taste, it cannot guarantee that the final resting place of that shift is any closer to the "truth" of the object than the starting point. The standard of taste remains a social construct, vulnerable to the very historical accidents Hume hoped to transcend.
