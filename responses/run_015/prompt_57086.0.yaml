          *   *Tension:* How do you have mutual knowledge in a crowd of strangers where you don't know who they are? Claim 3 sets a bar that Claim 6 says is cleared, but the description in 6 ("mostly anonymous," "never learn who else was there") directly undermines the epistemic condition in 3.
          *   *Severity:* Critical. This strikes at the heart of the book's subject matter (protest movements). If 3 holds, 6 is false. If 6 is true, 3 must go.

      *   *Conflict C: Claim 5 (No Group Answerability) vs. Claim 4 (Group Irrationality/Agency).*
          *   Claim 5 says nobody is answerable except individuals.
          *   Claim 4 says groups can be irrational in ways individuals aren't.
          *   *Tension:* Similar to A, but normative. If the group acts irrationally, who is answerable? If only individuals, but no individual was irrational (per Claim 4), then who bears the cost of the irrationality?
          *   *Severity:* Medium-High.

      *   *Conflict D: Claim 7 (Owe Each Other/Release) vs. Claim 8 (Moral Exit).*
          *   Claim 7 says being released requires others let you out.
          *   Claim 8 says you can walk away if convinced it's wrong without proper resentment.
          *   *Tension:* Claim 7 suggests a strict requirement for mutual release to exit the obligation. Claim 8 suggests a unilateral moral exit clause.
          *   *Resolution:* Claim 8 acts as a defeater for Claim 7. This is a standard feature of commitment theories (moral override).
          *   *Severity:* Low/Apparent. Claim 8 clarifies the limits of 7.

      *   *Conflict E: Claim 1 (We-Intentions) vs. Claim 2 (Individual Attitudes).*
          *   Claim 1 says We-intentions are irreducible.
