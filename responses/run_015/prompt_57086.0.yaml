      2.  *No Group Ontology:* Shared agency is *just* interlocking individual attitudes. No group entity. (Methodological Individualism).
      3.  *Mutual Knowledge Requirement:* Joint action requires knowing others are participating. No mutual knowledge = parallel behavior. (Strict epistemic condition).
      4.  *Group Agency for Explanation:* Committees/movements *are* agents for explanatory purposes (take positions, act, irrationality). (Functionalist Group Agency).
      5.  *No Group Minds/Guilt:* Only individuals believe/intend/act/are answerable. (Strict Individualism/Normative Individualism).
      6.  *Large Scale is Joint Action:* Massive anonymous protests *are* joint action, not aggregates. (Empirical Claim).
      7.  *Normativity of Commitment:* Joint commitment creates interpersonal obligations (owe each other), not necessarily moral duties, independent of worth. Release requires mutual consent. (Gilbert-style Normativity).
      8.  *Moral Exit:* If convinced it's wrong, one may leave without proper resentment. (Moral Override).

  3.  **Identify Conflicts (Brainstorming):**

      *   *Conflict A: Claim 2 (No Group Ontology) vs. Claim 4 (Group Agency for Explanation).*
          *   Claim 2 says shared agency is *nothing over and above* individual attitudes.
          *   Claim 4 says movements *are* agents in a sense that matters for explanation (they act, are irrational).
          *   *Tension:* If it's *nothing over and above* individuals, how can the group be irrational in ways *no individual member is* (Claim 4)? If the group has properties individuals don't, isn't that something "over and above"?
          *   *Severity:* High. This is an ontological vs. explanatory clash.

      *   *Conflict B: Claim 3 (Mutual Knowledge) vs. Claim 6 (Large Scale/Anonymous).*
          *   Claim 3 says *nothing* is joint action unless each knows others are participating.
