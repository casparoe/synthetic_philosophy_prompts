prompt: |-
  hey — I need something I can actually hand to a committee, and I've failed to write it four times now.

  Setup: I'm a philosophy PhD student, and last year I got put on the data-governance committee for the two-hospital academic health system my department is affiliated with. We decide what goes in the demographics block of the electronic health record, and who's allowed to use those fields downstream. We meet every other week, 25–30 proposals a year, about 25 minutes each. The committee is a hospitalist, a nurse manager, a data architect, a compliance officer who has to sign off on everything or it doesn't ship, a rotating patient advocate, and me. Nobody else on it has read anything about social construction and nobody else ever will. The hospitalist hears "social construction" as "it's made up, so it doesn't matter"; the data architect hears it as "let people self-describe and then never aggregate." I get one page, ten questions maximum, and I cant use any jargon. Whatever we decide sits in the record for a decade and gets used for disparities research, quality reporting, registry submissions, and clinical decision support.

  What keeps happening: every proposal is really "add, delete, or redefine a category of person." I can see why the same move is fine in one case and a disaster in another, but when I try to say it I either give a five-minute lecture on Hacking's looping effects or I cave and vote on vibes. So: write me a procedure.

  What it has to be:
  - Ordered questions with hard stops, not a menu of considerations. I need to be able to say "question 3 fails, we're done, next proposal."
  - For each question: what counts as a sufficient answer, and who has to supply it (the proposal author? informatics? compliance?).
  - Explicit marks at the points where the answer is a values decision and has to go to a named human rather than to the procedure.
  - Runnable by someone with no theory, in ~20 minutes, from documents the committee already has.
  - It has to cope with: the same label meaning different things at the two hospitals we merged; a field collected at intake for one purpose getting reused eight years later for another; a category used to track something causal (exposure to a social environment) versus used as a proxy for an intrinsic property; and people who give different answers at different times or get classified differently by different staff.

  I also want you to commit, not survey, on three design choices:

  1. Which distinctions have to survive the translation and which can be dropped. My instinct is that the interactive-vs-indifferent-kind / looping stuff and the conferral stuff (who has to do what, in what setting, for the property to be there) are load-bearing, and that the whole realism/antirealism fight about whether race is "real" is dead weight we should just drop and never mention again. Tell me if I've got that backwards.

  2. Whether to require, for every category, an "export license": a written statement of the downstream uses it's licensed for, where any new use has to come back through us. I made this up, it's the part I'm least sure about, and the data architect already hates it.

  3. Whether there should be a rule that any field used to make a clinical decision about a patient has to be recorded as an act — what was actually asked, of whom, by whom, when — rather than as a trait of the patient. And what the procedure should do when the honest answer to "what was actually asked" is "nothing, the clerk guessed" or "nothing, a model imputed it." Related: I've been calling the next question the re-description question — if someone reads this field in eight years under a different description than the one it was collected under, what breaks? Keep it if it earns its place on the page, cut it if its just decoration.

  Then run it on three proposals actually in front of us:

  (a) Add a "Middle Eastern or North African" option to the race/ethnicity question, because a patient-advocacy group says the current boxes force people into "white" and their community disappears from our disparities data.

  (b) Have the lab auto-populate the race field from a genetic-ancestry panel that's already being run on a subset of patients, on the grounds that it's more objective and intake staff are bad at asking. I think this is obviously bad and I cannot say why in a form the hospitalist will accept.

  (c) Delete the "sex assigned at birth" field and keep only gender identity, because a committee member argued last meeting that the first one is "just a social category with no clean biology under it, so its noise in a medical record."

  On (c): my sympathies are with the deletion and my own work is why — I spend my days arguing these categories are constructed. If the procedure, run honestly, says keep the field, I want you to say that plainly and tell me why construction isn't the reason to delete it. I'd rather be overruled by the checklist than by my politics.

  One more, which you should feel free to treat as the real test: we've been told to harmonize the two hospitals' category sets into one master list. If the procedure implies we shouldn't — that we should keep both and map between them at analysis time — say so, because the CIO is going to be furious and I want to know before I walk into the room.

  Give me your version, argue for it, say where it has to hand off to a person and where it'll just misfire, and don't hedge between options. No reading lists and no citations — I can look those up myself, I need the page.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Philosophy PhD student on a hospital data-governance committee.
      *   **Problem:** Struggles to translate complex social constructionist theory (looping effects, kind-making, conferralism) into actionable committee procedure without jargon or lecturing. Previous attempts failed (too theoretical or too vague).
      *   **Task:** Create a 1-page, 10-question max procedure for evaluating proposals to add/delete/redefine demographic categories in the EHR.
      *   **Constraints:**
          *   Ordered questions with hard stops.
          *   Define sufficient answers and who supplies them.
          *   Mark values decisions requiring human judgment.
          *   Runnable in ~20 mins by non-theorists.
          *   Handle specific edge cases (merged hospitals, purpose drift, causal vs. proxy, instability of data).
          *   **Commit to 3 Design Choices:**
              1.  Keep interactive/kind-making/conferralism; drop realism/antirealism debates.
              2.  Decide on "Export License" (downstream use restrictions).
              3.  Decide on "Act vs. Trait" recording (especially for clinical decision fields) and the "Re-description" risk.
          *   **Test Run:** Apply the procedure to three specific proposals (MENA category, Genetic Ancestry Auto-fill, Delete Sex Assigned at Birth).
          *   **Harmonization Test:** Address merging two hospital category sets (unify vs. map).
          *   **Tone:** Direct, no hedging, no citations, actionable document.

  2.  **Deconstruct the Design Choices (Commitment Phase):**

      *   *Choice 1 (Theory Translation):* The user is right. Realism/antirealism is a metaphysical dead end for a hospital committee. "Is race real?" leads to stalemate. "What happens when we measure this?" (Looping/Conferralism) is operational. *Decision:* Keep the interactive/kind-making logic but translate it into "Consequence & Stability" questions. Drop "real/unreal."
      *   *Choice 2 (Export License):* The data architect hates it because it limits utility. However, without it, "scope creep" happens (collected for care, used for policing/research without consent). Given the user's concern about downstream misuse, an Export License is necessary but needs to be lightweight. *Decision:* Require it, but frame it as "Approved Use Cases" rather than a legal license.
      *   *Choice 3 (Act vs. Trait):* This is crucial. Treating demographics as intrinsic traits is where the error happens. If a field drives clinical decisions, it *must* be recorded as an observation/act (who said what when). If it's imputed/guessed, it must be flagged. *Decision:* Mandate "Act/Source" recording for clinical fields. Address the "Re-description" risk by requiring a "Stability Statement."

  3.  **Drafting the Procedure (The "One Page"):**

      *   Need 10 questions max.
      *   Needs hard stops (If No -> Reject/Return).
      *   Needs to handle the specific edge cases (merged hospitals, purpose drift).
      *   *Structure:*
          *   Phase 1: Purpose & Necessity (Why do we need this?)
          *   Phase 2: Collection & Stability (How do we get the data?)
          *   Phase 3: Downstream & Risk (What happens next?)
      *   *Drafting Questions:*
          1.  What specific clinical or operational problem does this solve *today*? (Stop scope creep).
          2.  Who supplies the data? (Patient, staff, algorithm).
          3.  Is this treated as a fixed trait or a current report? (Act vs. Trait).
          4.  Does this category change the person's treatment path? (Clinical Decision).
          5.  If yes to 4, is the source verifiable? (No guesses).
          6.  How does this map across the two legacy systems? (Harmonization).
          7.  What happens if the patient gives a different answer next time? (Instability).
          8.  What are the approved downstream uses? (Export License).
          9.  Who is accountable for errors? (Conferralism/Responsibility).
          10. When do we review this again? (Looping/Time limit).

      *   *Refining for "Hard Stops":*
          *   Q1 must be specific.
          *   Q4/5 link is critical for safety.
          *   Q8 is the Export License.
          *   Q6 handles the merger issue.

  4.  **Running the Test Cases:**

      *   *(a) MENA Category:*
          *   Purpose: Disparities research (valid).
          *   Collection: Self-report (valid).
          *   Act/Trait: Self-report (valid).
          *   Export: Research/QI (valid).
          *   *Verdict:* Passes.
      *   *(b) Genetic Ancestry Auto-fill:*
          *   Purpose: "Objectivity" (Weak clinical link).
          *   Collection: Lab test (not patient report).
          *   Act/Trait: Treated as trait (Fail).
          *   Clinical Decision: If used for dosing, source mismatch is dangerous.
          *   Export: Research vs. Care mismatch.
          *   *Verdict:* Fails Q4/Q5 (Source mismatch for clinical use) and Q1 (Problem definition).
      *   *(c) Delete Sex Assigned at Birth (SAAB):*
          *   Purpose: Remove "noise."
          *   Collection: N/A (Deletion).
          *   Clinical Decision: Many protocols rely on SAAB (cancer screening, meds).
          *   *Verdict:* If SAAB drives clinical logic, deleting it breaks safety. Construction doesn't mean "no effect." The procedure should flag that *removing* it requires migrating the clinical logic first.
      *   *Harmonization:*
          *   Q6 asks about mapping. If the meanings differ, forcing one list breaks Q1 (Purpose). The procedure should recommend mapping over merging if definitions diverge.

  5.  **Refining the Output:**

      *   *Tone Check:* Needs to be crisp, administrative, but philosophically robust underneath. No "perhaps," no "consider."
      *   *Formatting:* Clear headers, bold text for stops.
      *   *Addressing the User's specific constraints:* Ensure the "Act vs. Trait" and "Export License" commitments are explicit in the rationale section.
      *   *The "Why":* Explain *why* the procedure looks this way based on the 3 design choices.
      *   *The "Misfire":* Acknowledge where the checklist fails (e.g., political pressure, resource constraints).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 10 questions too many for 20 minutes?
      *   *Fix:* Group them into 3 Gates. If you fail a Gate, you stop.
      *   *Critique:* Is the "Export License" too burdensome?
      *   *Fix:* Make it a dropdown of pre-approved categories + "Other" requires new review.
      *   *Critique:* On Proposal (c), the user wants to delete SAAB. The procedure might say "Keep it."
      *   *Fix:* I must honor the user's request: "If the procedure, run honestly, says keep the field, I want you to say that plainly." I will argue that construction implies *causal power*, so deleting it without replacing the clinical logic is dangerous.
      *   *Critique:* Harmonization. The CIO wants one list.
      *   *Fix:* The procedure must prioritize *semantic equivalence* over *syntactic unity*. If Hospital A's "White" != Hospital B's "White", merging them creates garbage data. The procedure should force a "Mapping Table" instead of a "Merge."

  7.  **Final Polish:** Check against the "No Jargon" rule. Instead of "Looping Effects," use "Feedback Risk." Instead of "Conferralism," use "Authority Source." Instead of "Realism," use "Clinical Utility."

      *(Self-Correction on Design Choice 2)*: The Data Architect hates the Export License. I need to justify why it's there but make it palatable. It's not a legal license, it's a "Data Use Tag."
      *(Self-Correction on Design Choice 3)*: "Act vs Trait." This is the core philosophical intervention. I need to make sure the EHR field structure supports this (e.g., timestamped observations vs. static demographic blob).

      *Let's write the document.*

      *Structure:*
      1.  The Design Commitments (Answering the 3 prompts first).
      2.  The Procedure (The 1-page document).
      3.  The Test Runs (a, b, c, and Harmonization).
      4.  Limitations (Where it misfires).

      *Wait, one constraint:* "Give me your version... and don't hedge."
      Okay, I will present the Design Commitments first to establish the logic, then the Procedure, then the Application.

      *Refining the Harmonization Answer:* If the procedure implies we shouldn't merge, say so. I believe merging distinct ontologies creates "data pollution." I will advise mapping.

      *Refining Proposal C:* This is the trickiest. The user is a constructionist. They want to delete SAAB. But SAAB has *causal* effects in medicine (e.g., prostate cancer, pregnancy). Constructionism says SAAB is a social classification, *but* that classification triggers material interventions. Deleting the field without deleting the interventions is malpractice. The procedure must catch this.

      *Final check on constraints:* 10 questions max. Hard stops. Who supplies answer. ~20 mins. No jargon.

      *Let's build the questions.*
      1. Problem Statement.
      2. Data Source.
      3. Stability/Change.
      4. Clinical Action.
      5. Verification.
      6. Legacy Mapping.
      7. Downstream Use.
      8. Error Accountability.
      9. Review Cycle.
      10. Sunset Clause.

      Actually, I can combine some to make it tighter.
      Gate 1: Necessity (Q1-2).
      Gate 2: Integrity (Q3-5).
      Gate 3: Governance (Q6-8).
      (That's 8 questions. I have 2 spare for specific edge cases).

      Okay, ready to write.
answer: |-
  ### Part 1: The Three Design Commitments

  You asked me to commit. Here is the logic underpinning the procedure below.

  **1. Theory Translation: Keep Looping/Conferralism, Drop Realism.**
  You are correct. Debating whether race or sex is "real" is a trap. It stalls the committee and changes nothing in the EHR. What matters is *causal power*. If a category triggers a clinical protocol, it has effects, regardless of its ontology.
  *   **Decision:** The procedure treats all demographic fields as **interventions**, not descriptions. We do not ask "Is this true?" We ask "What happens when we record this?" This captures the "looping" risk (the data changes the patient's treatment path) and the "conferral" risk (who has the authority to assign the label) without using those words.

  **2. The Export License: Required.**
  The Data Architect hates this because it limits flexibility. That is exactly why it is necessary. Without it, "scope creep" is inevitable: data collected for clinical care gets used for risk-adjustment, which gets used for insurance denial, which gets used for policing.
  *   **Decision:** Every field must have a **Data Use Tag**. If a downstream user wants to use the field for a purpose not on the tag, they must submit a new proposal. This is not a legal contract; it is a metadata flag in the data dictionary.

  **3. Act vs. Trait: Mandatory for Clinical Fields.**
  This is the most critical philosophical move. Demographics are often stored as static traits (e.g., `Patient.Race = "Asian"`). This is false. They are reports or observations.
  *   **Decision:** If a field influences clinical decision support (CDS), it must be recorded as an **Observation Event** (Who asked? When? What was the exact question? What was the answer?). If the answer is imputed or guessed, the system must flag it as `Source: Inferred`. You cannot build safety-critical logic on inferred social data.
  *   **Re-description:** To handle the "eight years later" problem, every field requires a **Stability Statement**. If the meaning of the field is likely to shift (e.g., "Gender Identity"), the system must allow multiple historical values, not just the "current" one.

  ***

  ### Part 2: The Procedure (The One-Page Document)

  **DEMOGRAPHIC FIELD GOVERNANCE CHECKLIST**
  *To be completed by Proposal Author prior to voting. Max 20 minutes.*

  **GATE 1: NECESSITY & ORIGIN**
  *If any answer is insufficient, return to author. Do not vote.*

  **1. What specific clinical or operational failure occurs if we do NOT add/change this field?**
  *   **Sufficient Answer:** A concrete scenario (e.g., "We cannot calculate maternal mortality rates for Group X"). Vague answers like "better data" or "equity" are rejected.
  *   **Supplied By:** Proposal Author (Clinician or Admin).

  **2. Who creates this data point, and by what authority?**
  *   **Sufficient Answer:** One of: [Patient Self-Report], [Clinician Observation], [Lab Result], [Algorithmic Inference].
  *   **Hard Stop:** If [Algorithmic Inference] or [Staff Guess], field cannot be used for Clinical Decision Support (see Q4).
  *   **Supplied By:** Informatics / Proposal Author.

  **3. How does this category map to the legacy systems of Hospital A and Hospital B?**
  *   **Sufficient Answer:** A mapping table showing equivalence. If concepts differ (e.g., "Race" vs. "Ethnicity"), they must remain separate fields with a crosswalk, not merged.
  *   **Hard Stop:** If the proposal forces a merge of non-equivalent concepts, reject.
  *   **Supplied By:** Data Architect.

  **GATE 2: SAFETY & STABILITY**
  *If any answer fails, the field is restricted to Research/QI only. No Clinical Use.*

  **4. Does this field trigger any automatic clinical alerts, order sets, or dosing calculations?**
  *   **Sufficient Answer:** [Yes] or [No].
  *   **Hard Stop:** If [Yes], the data source MUST be [Patient Self-Report] or [Verified Lab/Clinical Measure]. [Staff Guess] and [Inference] are prohibited for this field.
  *   **Supplied By:** Compliance Officer / Medical Director.

  **5. If a patient provides a different answer at a future visit, how is the conflict resolved?**
  *   **Sufficient Answer:** "The new value is timestamped; both are retained in history." Overwriting prior values is prohibited for fields used in longitudinal research.
  *   **Supplied By:** Data Architect.

  **6. What is the expected stability of this category over a 10-year period?**
  *   **Sufficient Answer:** [Static] (e.g., Birth Sex), [Dynamic] (e.g., Insurance), [Socially Volatile] (e.g., Race/Ethnicity labels).
  *   **Hard Stop:** If [Socially Volatile], the field label must include the collection year (e.g., "Race 2024 OMB Standards").
  *   **Supplied By:** Proposal Author / Compliance.

  **GATE 3: GOVERNANCE & DOWNSTREAM RISK**
  *If any answer fails, the proposal requires Patient Advocate approval before voting.*

  **7. What are the approved downstream uses (The Export License)?**
  *   **Sufficient Answer:** Select from: [Direct Care], [Quality Improvement], [Population Health Research], [Regulatory Reporting]. Any other use requires new committee review.
  *   **Supplied By:** Compliance Officer.

  **8. If this data is leaked or misused, who is accountable?**
  *   **Sufficient Answer:** A named role (e.g., "CMO"), not a department.
  *   **Supplied By:** Hospital Administration.

  **9. Does this field create a "Looping Risk" where recording the category changes the patient's access to care?**
  *   **Sufficient Answer:** A plain-language assessment (e.g., "Yes, labeling this may stigmatize," or "No, this is neutral").
  *   **Values Handoff:** If the committee disagrees on the risk level, the **Patient Advocate** holds the tie-breaking vote.
  *   **Supplied By:** Patient Advocate / Committee Chair.

  **10. When does this field expire or require mandatory review?**
  *   **Sufficient Answer:** A date (Max 5 years). No field exists in perpetuity without review.
  *   **Supplied By:** Committee Chair.

  ***

  ### Part 3: Running the Proposals

  Here is how the checklist handles your current backlog.

  **(a) Add "Middle Eastern or North African" (MENA) Option**
  *   **Q1 (Necessity):** Pass. Current categorization hides disparities in this group.
  *   **Q2 (Origin):** Pass. Patient Self-Report.
  *   **Q3 (Mapping):** Pass. Can be mapped to legacy systems as "Other" with a note, or added as new code.
  *   **Q4 (Clinical):** Pass. Likely used for Research/QI, not direct dosing.
  *   **Q7 (Export):** Restricted to Disparities Research/QI.
  *   **Verdict:** **APPROVE.**
  *   **Why:** It solves a specific visibility problem (Q1), relies on self-report (Q2), and doesn't trigger unsafe clinical logic (Q4). It respects the "Socially Volatile" nature by tagging the standard used (Q6).

  **(b) Auto-populate Race from Genetic Ancestry Panel**
  *   **Q1 (Necessity):** Fail. "Intake staff are bad at asking" is not a clinical failure; it is a training issue. "Objectivity" is not a clinical indication.
  *   **Q2 (Origin):** Pass (Lab Result), *but*...
  *   **Q4 (Clinical):** **HARD STOP.** Genetic ancestry is not equivalent to social race. If this field triggers clinical decision support (e.g., kidney function equations), using genetics as a proxy for social race is scientifically invalid and dangerous.
  *   **Q7 (Export):** Fail. Genetic data has stricter compliance requirements than demographic data. Merging them violates the Export License.
  *   **Verdict:** **REJECT.**
  *   **Why:** You don't need theory to kill this. Q1 fails (no clinical problem solved) and Q4 fails (category mismatch creates safety risk). The Hospitalist cannot argue with "This lab test does not measure the variable required for the protocol."

  **(c) Delete "Sex Assigned at Birth" (SAAB), Keep Gender Identity**
  *   **Q1 (Necessity):** **FAIL.** Many clinical protocols (cancer screening, medication dosing, reference ranges) rely on physiology linked to SAAB. Deleting the field breaks the logic.
  *   **Q4 (Clinical):** **HARD STOP.** If SAAB drives clinical alerts, you cannot delete the field without migrating those alerts to a new logic (e.g., "Organ Inventory").
  *   **Q9 (Looping Risk):** Values Handoff. The Patient Advocate may argue SAAB causes harm. The Medical Director argues SAAB prevents harm.
  *   **Verdict:** **REJECT DELETION. REQUIRE REDESIGN.**
  *   **Why:** This is where your constructionism must be precise. Constructed categories have real effects. SAAB is a social classification, *but* it is currently the key that unlocks specific medical protocols. Deleting the key locks the door.
  *   **The Fix:** The procedure forces you to keep the field *until* the clinical logic is updated to rely on specific anatomy (e.g., "Has Prostate," "Has Cervix") rather than the proxy (SAAB). You cannot delete the proxy until you build the specific mechanism. Constructionism argues for *more* precision, not less.

  ***

  ### Part 4: The Harmonization Test (The CIO Problem)

  **The Scenario:** The CIO wants one master list for both hospitals.
  **The Procedure's Ruling:** **Do Not Merge.**

  **Reasoning (Q3 & Q6):**
  If Hospital A collected "Race" using 2010 OMB standards and Hospital B used 2024 standards (or local variants), they are not the same variable.
  *   **Forcing a Merge:** Creates "data pollution." You will be analyzing disparities on a variable that means two different things. This violates Q1 (Necessity/Utility).
  *   **The Procedure's Solution:** Maintain two fields (`Demog_Race_HospA`, `Demog_Race_HospB`) and build a **Crosswalk Table** for analysis.
  *   **Argument to CIO:** "Merging these fields creates a variable that is clinically and legally indefensible for research. We will store both and map them at the query layer. This costs more storage but saves us from publishing false disparities data."

  ***

  ### Part 5: Where This Will Misfire

  I am committing to this procedure, but I am not committing to it being magic. Here is where it breaks:

  1.  **The "Vibes" Veto:** Q9 hands a tie-breaker to the Patient Advocate. If the Hospitalist and Advocate deadlock, the procedure stops. You will need a tie-breaker rule (I suggest Committee Chair casts the final vote, but must write a public justification).
  2.  **Resource Constraints:** Q10 (Mandatory Review) creates technical debt. Informatics will hate scheduling sunsets for fields. You must enforce this, or the EHR becomes a graveyard of unused fields.
  3.  **The "Inferred" Loophole:** Staff will still guess. Q2 and Q4 rely on honest labeling. If a clerk selects "Patient Self-Report" when they actually guessed, the procedure fails. You need random audits of the source tags.
  4.  **Political Pressure:** If Administration demands a field for marketing purposes, Q1 will fail, but they may overrule the committee. The procedure protects you from *bad data*, not *bad bosses*. In that case, use Q7 (Export License) to quarantine the data so it cannot contaminate clinical care.

  **Final Instruction:** Print Part 2. Laminate it if you have to. When a proposal comes in, put it on the screen. Ask Question 1. If they waffle, stop. Do not let them talk to Question 2. You are not the philosopher in the room anymore; you are the gatekeeper of the checklist.
