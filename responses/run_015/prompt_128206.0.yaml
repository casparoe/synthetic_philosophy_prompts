answer: |-
  ### Desiderata for a Non-Circular Derivation of the Born Rule in Unitary Quantum Mechanics

  The following table outlines the conditions a derivation must meet to count as a solution to the probability problem in the no-collapse picture, rather than a restatement of the problem. The classification distinguishes between requirements essential for logical coherence (Non-Negotiable) and those reflecting specific philosophical commitments (Preference).

  | # | Requirement | Classification | The Case / Rationale | Notes & Specific Worries |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Qualitative Coherence** | Non-Negotiable | Must explain how "probability" or "uncertainty" has meaning when all outcomes physically occur. Without this, the quantitative rule lacks a semantic anchor. | **The Qualitative Worry.** Distinguishes Everettian probability from simple frequency or measure. |
  | **2** | **Quantitative Uniqueness** | Non-Negotiable | Must demonstrate that the squared-amplitude measure is the *only* consistent weight function. It must rule out linear amplitude, branch counting, or other monotonic functions. | **The Quantitative Worry.** Ensures the derivation yields $|\psi|^2$ specifically, not just *some* measure. |
  | **3** | **Probabilistic Non-Circularity** | Non-Negotiable | The premises must not presuppose probabilistic concepts (e.g., "likelihood," "risk," "expectation") that the derivation aims to define. | **Decision-Theory Worry.** Axioms of rational choice must be justified as normative constraints on preference, not disguised probability postulates. |
  | **4** | **Robustness to Approximation** | Non-Negotiable | Decoherence yields approximate orthogonality, not exact. The derivation must assign weights to emergent, fuzzy branches and account for the contribution of residual interference tails. | **User Worry 1.** Prevents reliance on idealized projective measurements; requires handling continuous spectra and "FAPP" branching. |
  | **5** | **Decomposition Invariance** | Non-Negotiable | Weights must not depend on the arbitrary fineness of the branch decomposition. Merging or splitting branches via unitary transformations that preserve physical structure must not alter total weight. | **User Worry 2.** Prevents "branch counting" tricks where one artificially inflates the number of outcomes to change probabilities. |
  | **6** | **Typicality without Presupposition** | Non-Negotiable | Must explain why observers find themselves in branches adhering to Born statistics without assuming a typicality measure based on squared amplitudes *a priori*. | **User Worry 3.** Addresses "Maverick Worlds." Solves the problem of why evidence confirms the theory despite the existence of deviant branches. |
  | **7** | **Agent-Neutrality** | Preference | The derivation should not depend on the existence of conscious agents or decision-makers. The physical weights should exist independently of betting behavior. | **Preference.** Favored by realists who view probability as ontological rather than epistemic/pragmatic. |
  | **8** | **Finite-Case Independence** | Preference | The derivation should not rely essentially on finite-dimensional Hilbert spaces or discrete outcome sets, as physical fields are continuous. | **Preference.** Required for full physical generality; Gleason-style proofs often struggle here. |

  ### Tensions, Exclusions, and Limitations

  **Incompatible Pair:**
  There is a significant tension between **Requirement 4 (Robustness to Approximation)** and **Requirement 1 (Qualitative Coherence via Self-Locating Uncertainty)**.
  *   *Reasoning:* Self-locating uncertainty accounts often rely on an agent counting their future successors to establish a state of ignorance (e.g., "I don't know which branch I will be on"). However, if branches are merely approximate and emergent (Req 4), there is no definite fact of the matter about *how many* successors exist. A precise count is required for standard uncertainty, but the physics only provides a fuzzy, continuous decomposition. Satisfying the physical reality of decoherence undermines the discrete counting required for naive self-locating uncertainty.

  **The Most Exclusionary Requirement:**
  **Requirement 6 (Typicality without Presupposition)** does the most work in excluding candidate derivations.
  *   *Reasoning:* Many derivations successfully show that *if* one uses the squared-amplitude measure, then branches with non-Born frequencies have low measure. However, this is circular if the goal is to derive the measure itself. A derivation fails if it dismisses maverick branches by saying "they have low weight" before establishing why weight dictates existence or observation. Explaining why we are not in a maverick branch without assuming the Born rule to define "likely" is the hardest hurdle; most approaches simply assume a "principle of typicality" that smuggles in the conclusion.

  **Finite-Dimensional Limitation:**
  **Requirement 2 (Quantitative Uniqueness)** via **Structural Theorems (Gleason-style)** is the requirement most sensitive to finite-dimensional, discrete-outcome cases.
  *   *Reasoning:* Gleason's theorem strictly applies only to Hilbert spaces of dimension 3 or greater. Derivations relying on this structure cannot fundamentally account for qubits (dimension 2) without additional assumptions or embedding arguments. Furthermore, defining "branches" rigorously is only mathematically clean in discrete bases; extending this to continuous variables (position, momentum) requires measure-theoretic machinery that many decision-theoretic or symmetry-based derivations gloss over.

  ### Strategic Scoring

  **Decision-Theoretic** strategies score highly on **Quantitative Uniqueness** and **Non-Circularity** (by framing probability as rational preference), but they struggle significantly with **Robustness to Approximation** and **Agent-Neutrality**, as they rely on idealized games and the existence of rational agents. They often falter on **Typicality without Presupposition**, as they derive why an agent *should bet* as if the Born rule is true, but do not fully explain why the physical statistics *are* true independent of the bet. **Symmetry or Invariance-based** approaches (e.g., envariance) excel at **Quantitative Uniqueness** without invoking agents, but they frequently violate **Probabilistic Non-Circularity** by assuming that symmetry swaps imply equiprobability, which is itself a probabilistic claim. They also tend to assume exact orthogonality, failing **Robustness to Approximation**. **Self-Locating Uncertainty** approaches address **Qualitative Coherence** best but collapse against **Decomposition Invariance** and **Robustness to Approximation**, as there is no well-defined number of "selves" to be uncertain about when branching is continuous and fuzzy. Finally, **Structural Theorems (Gleason-like)** are mathematically rigorous regarding **Quantitative Uniqueness** and **Decomposition Invariance**, but they score poorly on **Qualitative Coherence** and **Typicality without Presupposition**; they prove a measure exists, but not why that measure governs empirical frequency or observation rather than being a mere mathematical property of the vector space.
