answer: |-
  The whiteboard was still smeared with the morning's architecture diagrams when Maya leaned against the desk and tapped the marker against the number 80.0 circled in red. She looked at Leo, who was staring at the coffee machine like it held the answer to the sorites paradox. You're telling me that if the score is 79.999, the statement this model is safe to deploy has no truth value, Maya said, her voice tight with the fatigue of a forty-hour eval cycle. That might work in a seminar, but out here we have to ship code. If there's no truth value, then what am I supposed to put in the deployment log? That the safety status is undefined?

  Leo turned around, holding two mugs, and handed one to her. I'm saying the predicate safe is vague, not the score. The score is precise, sure, but the concept of safety doesn't carve reality at that exact joint. When you say 79.99 is safe, you're pretending the language is sharper than it is. In the borderline region, neither safe nor unsafe is strictly true. It's a truth-value gap. We're not discovering a boundary, Maya, we're drawing one.

  But that's exactly where you're losing me, she said, taking the mug but not drinking. If I sign off on 79.99, and the model causes a minor incident, I was wrong. If I block it, and we lose capability for no reason, I was wrong. There is a fact of the matter about whether the model causes harm. The harm is binary. Either the system crashes or it doesn't. Either it leaks data or it doesn't. So there must be a point where the risk becomes unacceptable, even if we can't measure it perfectly. Your truth-value gap doesn't help me decide. It just tells me I'm guessing. Saying there's no fact of the matter doesn't stop the server from burning down.

  Leo took a sip of his coffee and walked over to the board, erasing a small section near the circle. You're conflating the outcome with the classification. Yes, the crash is binary. But the label unsafe is a human category we're plastering over a continuous risk landscape. You think there's a hidden number, like 79.943, where below it the model is truly safe and above it it's truly unsafe. That's the epistemicist view. But why do you think that fact exists? What physical property changes at 79.943 that doesn't exist at 79.942?

  It's not about a physical property changing instantly, it's about the aggregation of risk, Maya countered. Ignorance isn't ontology. Just because we can't see the grain doesn't mean the sand isn't discrete. There is a threshold where the expected utility flips negative. That threshold exists independently of our language. If you say there's no truth value, you're basically saying reality is fuzzy. I don't buy that. I buy that we are ignorant. And if we are ignorant, then there is a right answer to find, or at least approximate. Your view lets us off the hook too easily. If there's no truth value, then blocking at 79.99 isn't safer than deploying at 80.01, it's just different. That can't be right.

  It's not that reality is fuzzy, it's that our words are, Leo said, capping the marker. And regarding the decision, you're asking the wrong question. You want the logic to make the decision for you. But supervaluationism doesn't say you can't decide. It says the decision isn't driven by truth in the borderline zone, it's driven by stipulation. When you set the cutoff at 80.0, you aren't finding the line, you're making a precisification. You're making it true by fiat. My view actually protects you better than yours. If you believe there's a hidden fact at 79.943, you might think you're safe at 79.99 because you're below the hidden line. But you don't know where the line is. On my view, you admit 79.99 is borderline, so you acknowledge that calling it safe is a choice, not a discovery. That forces you to justify the choice on policy grounds, not pretend you found a scientific fact.

  Maya frowned, tracing the circle on the board again. So you're saying my realism is dangerous because it gives me false confidence? That if I think there's a fact of the matter, I'll trust the metric too much?

  Exactly, Leo said. You think the 80.0 is approximating a natural kind. It's not. It's a regulatory boundary. If you claim there's a discoverable fact, you're claiming that safety is a property like mass or charge. It's not. It's more like tall. There's no height where a person suddenly becomes tall in a way that was false an inch before. You're trying to treat a normative threshold like a descriptive one. And honestly, do you really believe that if we measured perfectly, we'd find that 79.9999 was safe and 80.0001 was dangerous? Or is it that at both points, the risk is comparable, and we just have to draw a line to function?

  I believe that at some point the risk crosses a tolerance level, Maya said, though she sounded less certain than before. If the tolerance is 5% chance of catastrophic failure, and the model at 79.99 is 4.99% and at 80.01 is 5.01%, then there is a fact. The fact is in the probability distribution.

  But the tolerance level itself is vague, Leo pointed out. Who set the 5%? Why not 4.9%? If the tolerance is vague, then the boundary derived from it is vague. You can't get precision out of precisionless inputs. You're pushing the vagueness back one step to the tolerance level, but you haven't eliminated it. There is no fact of the matter about whether 4.99% is acceptable vs 5.01% because acceptability is itself a vague predicate. So you still have the gap. You just moved it.

  Maya sighed and put the mug down. Okay, fine. Let's say you're right. There's no truth value in the borderline. We're in the gap. We still have to push the button or not. Does your philosophy tell me which way to push? If truth doesn't apply, then logic doesn't apply. I'm left with pure will.

  Logic applies to the clear cases, Leo said. It's only silent in the gap. But since we're in the gap, you're right, logic doesn't dictate the move. Policy does. And that's the point. You want the universe to tell you what to do so you don't have to take responsibility for the line. I'm saying the universe won't tell you, so you have to own the stipulation. If you deploy at 79.99, don't say it was safe. Say we decided to accept the risk. That's the only honest way to run a lab like this.

  She looked at the number 80.0 again, then picked up the eraser. So if I change it to 79.5, I'm not getting closer to the truth, I'm just being more conservative.

  You're making the extension of safe smaller, Leo said. You're not finding the real safe. You're just deciding to call fewer things safe. Which is fine. But stop telling yourself there's a ghost in the machine waiting to tell you where the cut off really is.

  Maya wiped the board clean around the number, leaving just the digits hanging there. It's frustrating though. I want there to be a right answer.

  I know, Leo said, turning back to his desk. But wanting it doesn't make it true. Or in this case, doesn't make it have a truth value. Just pick a number and sign your name to it. That's the only fact we're making today.
