answer: |-
  **PHIL3015: Death, Persons and Medicine**
  **Final Assessment**

  **Time Allowed:** 2 Hours
  **Instructions:** Answer **ONE** question. Closed book.

  ***

  **Question 4**

  **Statutory Material**

  **Death (Definition) Act 2019 (Northmark)**

  1.—(1) An individual is dead if either
    (a) there has been irreversible cessation of all functions of the entire brain, including the brainstem; or
    (b) there has been permanent cessation of circulatory and respiratory functions.
  (2) For the purposes of subsection (1): *irreversible* means that the cessation will not, and cannot, be reversed; *permanent* means that the cessation will not be reversed, because no intervention designed to reverse it will be attempted.
  (3) A determination of death under subsection (1)(b) may be made on the basis of permanence alone.
  2. Nothing in this Act states whether the death referred to is the death of a person or the death of a human organism.

  **Case A.** Ms Kavanagh, 34, sustains a catastrophic intracranial haemorrhage. Brainstem reflexes are absent and apnoea is confirmed on formal testing; she is declared dead under s.1(1)(a). With continued ventilation and enteral feeding she thereafter maintains her own blood pressure without vasoactive drugs, her wounds heal, and she is twenty weeks pregnant with a foetus that continues to develop for eight weeks after the determination. Her partner refuses to accept it: he says she is still doing the things a living organism does, gestating their child above all, and that the law has simply stipulated its way to a convenient answer.

  **Case B.** Mr Okonjo, 61, has life-sustaining treatment withdrawn after devastating brain injury. Five minutes after asystole he is declared dead under s.1(1)(b) on the basis of permanence alone. A transplant team then begins normothermic regional perfusion: a pump circulates oxygenated blood through the abdominal organs, with a balloon inflated in the aorta above the diaphragm to prevent that flow reaching the heart and brain. His family demand to know how he can be dead while his blood is moving again, and why, if he is dead, anyone needs to block blood from reaching his head.

  **Essay Question**

  Critically assess the coherence of the *Death (Definition) Act 2019*. In your answer, you must:
  (a) Analyse the distinction between 'irreversible' and 'permanent' in s.1(2) and the asymmetry between s.1(1)(a) and s.1(1)(b);
  (b) Evaluate the partner's objection in Case A in light of s.2;
  (c) Evaluate the family's objection in Case B regarding the relationship between the definition of death and organ retrieval;
  (d) Assess whether adding a third limb to s.1(1) regarding the irreversible loss of the capacity for consciousness resolves the difficulties identified.

  ***

  ### Model Answer

  The *Death (Definition) Act 2019* attempts to codify two pathways to death but introduces a conceptual fissure between 'irreversible' and 'permanent'. Section 1(2) defines *irreversible* as that which *cannot* be reversed, implying a biological impossibility. Conversely, *permanent* is defined as that which *will not* be reversed because no intervention will be attempted. This renders permanence a normative status dependent on human decision rather than a purely physiological fact.

  This distinction creates a critical asymmetry between s.1(1)(a) and s.1(1)(b). Subsection (a) requires irreversibility; the brain must be biologically beyond recovery. Subsection (b), however, expressly permits determination on the basis of permanence alone via s.1(3). Consequently, the timing of death under (b) depends on what medical agents have decided to do. A patient in asystole is not dead under (b) until the decision is made not to resuscitate. This makes death under (b) relational to medical intent, whereas death under (a) is ostensibly relational only to biological fact. The Act thus conflates biological cessation with the normative decision to cease treatment.

  In Case A, Ms Kavanagh is declared dead under (a) yet maintains somatic integration: she maintains blood pressure, heals wounds, and gestates a foetus. Her partner argues she remains a living organism. Section 2's silence on whether the Act concerns the death of a *person* or a *human organism* is pivotal here. If the Act defines the death of the organism, the partner's objection succeeds: Kavanagh displays the homeostatic unity characteristic of a living organism. If the Act defines the death of the person, the objection fails: the capacity for consciousness is irretrievably lost. By remaining silent, s.2 allows the law to stipulate death for convenience while biological life continues. For the partner to succeed philosophically, it must be true that 'death' in this context refers exclusively to the cessation of the organism as a whole, and that somatic integration is the necessary and sufficient condition for organismic life. The Act permits the legal label to diverge from biological reality, validating the charge that it has 'stipulated its way' to an answer.

  Case B exposes the tension between the definition of death and the dead donor rule. Mr Okonjo is declared dead under (b) via permanence. Normothermic regional perfusion (NRP) subsequently circulates oxygenated blood to his abdominal organs. His family asks how he can be dead while blood moves. Under the Act, he is dead because the cessation of circulation was *permanent* (no intent to resuscitate *him*). NRP does not reverse this permanence because the intervention is designed for organ preservation, not resuscitation of the individual, and the balloon prevents flow to the heart and brain. However, this strains the dead donor rule, which mandates that vital organs not be taken from a living person. If circulation can be artificially restored to sustain organs, the circulatory cessation was not biologically irreversible, only procedurally permanent. The family's objection succeeds if one holds that death requires the biological impossibility of recovery, not merely a procedural prohibition on resuscitation. The requirement to block blood from the head acknowledges that without this barrier, the 'dead' organism might regain brain function, undermining the determination of death under (a).

  Finally, consider the proposed amendment adding a third limb: irreversible loss of the capacity for consciousness. This introduces a 'higher-brain' criterion. If adopted, the Act would contain three distinct criteria: whole-brain cessation (a), circulatory permanence (b), and loss of consciousness (amendment). This does not resolve the difficulties; it exacerbates the ontological fragmentation. Criterion (a) and (b) track organismic death (roughly), while the amendment tracks personal death. A patient could satisfy the amendment while satisfying neither (a) nor (b) (e.g., permanent vegetative state). This confirms that the Act has no single subject matter. It mixes criteria for the death of a biological organism with criteria for the death of a person.

  In conclusion, the Act is pragmatically functional but philosophically incoherent. It relies on a distinction between irreversibility and permanence to bridge the gap between biological fact and medical practice, but this renders death under (b) contingent on intent. The silence in s.2 allows the law to ignore biological integration in Case A, while the mechanics of Case B reveal that 'death' is being used to permit organ retrieval rather than to describe a unitary state. The proposed amendment clarifies the stake in personhood but highlights that the statute lacks a unified ontological basis.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Distinction between Irreversibility and Permanence (5 Marks)**
  *   **Full marks:** Clearly distinguishes 'cannot be reversed' (biological impossibility) from 'will not be reversed' (normative decision not to intervene).
  *   **Typical error:** Treating the terms as synonyms or failing to note that permanence relies on the absence of attempted intervention.

  **2. Asymmetry of s.1(1)(a) and s.1(1)(b) (5 Marks)**
  *   **Full marks:** Identifies that (a) requires irreversibility while (b) allows permanence, making death under (b) dependent on medical intent/decision rather than purely physiology.
  *   **Typical error:** Claiming both limbs require biological impossibility or missing the implication of s.1(3).

  **3. Case A: Somatic Integration and s.2 Silence (5 Marks)**
  *   **Full marks:** Explains that the partner's objection relies on a somatic-integration view of organismic life and that s.2's silence allows the law to prioritise personhood over biology. States what must be true for the partner to succeed (death = organismic cessation).
  *   **Typical error:** Dismissing the partner as emotionally biased without engaging with the biological evidence of pregnancy/healing.

  **4. Case B: NRP, Permanence and the Dead Donor Rule (5 Marks)**
  *   **Full marks:** Explains that NRP restores circulation but not *resuscitation*, relying on the permanence definition. Notes the tension with the dead donor rule (organs perfused in a 'dead' body). States what must be true for the family to succeed (death requires biological impossibility of circulation).
  *   **Typical error:** Focusing on the balloon mechanism without linking it to the definition of death or the dead donor rule.

  **5. The Consciousness Amendment (5 Marks)**
  *   **Full marks:** Assesses that the amendment introduces a personhood criterion that fragments the Act further, revealing it lacks a single subject matter (organism vs. person).
  *   **Typical error:** Arguing the amendment simply 'fixes' the law without noting it creates a third, ontologically distinct category.

  ***

  ### First-Class / Upper-Second Boundary

  The boundary between a strong Upper-Second (13–15 marks) and a First (16+ marks) lies in the candidate's treatment of **s.2 and the ontological status of the definition**. A 2:1 answer will typically hit all five marking points mechanically, noting the differences between the cases and the definitions. A First-class answer will identify that s.2's silence is not merely a gap, but a category error that allows two incompatible concepts of death (biological organism vs. moral person) to coexist within a single statute. The First-class candidate will explicitly argue that the 'permanence' clause in Case B effectively redefines death as a normative status rather than a biological event, and that the proposed amendment does not resolve this but rather codifies the fragmentation. They will recognise that the Act is not trying to discover death, but to manage the transition for legal and medical convenience.

  ***

  ### Justification for Exam Board

  This question discriminates more effectively than a standard "is brain death really death?" prompt because it prevents candidates from relying on rehearsed taxonomies or recalled literature. By providing a novel statutory text and specific cases, the question forces candidates to apply philosophical distinctions (irreversibility vs. permanence, organism vs. person) to unfamiliar material in real-time. A candidate who has merely memorised the standard neurological versus circulatory debate without understanding the underlying conceptual tensions will struggle to address the specific asymmetries in s.1 or the implications of s.2. This tests analytical agility and the ability to construct arguments from first principles, which are the core learning outcomes of a third-year philosophy module, rather than testing memory of secondary sources or jurisdiction-specific law.
