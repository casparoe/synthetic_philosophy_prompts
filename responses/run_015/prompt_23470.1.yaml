  2.  **Deconstruct the Philosophical Conflict (Rousseau vs. Liberal University):**
      *   *Rousseau (*Letter to d'Alembert*):* Theater reinforces existing social mores. In *Le Misanthrope*, the audience laughs at virtue (Alceste) because it is inconvenient, and admires vice (Philinte's politeness) because it is useful. This corrupts the citizen by making them value appearance over truth. A republic/civic body shouldn't fund what undermines civic virtue.
      *   *Liberal University:* The university is a space for inquiry, not indoctrination. Students/audiences are autonomous agents capable of critical distance. Censorship (even via funding) sets a dangerous precedent. Art should be free to challenge, even if it challenges virtue.
      *   *The Divergence:* It's not just "safety vs. risk." It's about the *purpose* of public funding. Is the committee funding *art* (neutral/expressive) or *civic education* (normative)? Rousseau says you can't separate the two; the Liberal view says you can.

