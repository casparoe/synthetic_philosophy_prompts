      *   *Approve Unconditionally:* Ignores the substantive civic concern. Misses the opportunity to use the Rousseau critique productively.
      *   *Approve Conditionally:* This is the sweet spot. It acknowledges the civic mission without vetoing the art. It forces the production to *engage* with the critique rather than ignore it. This aligns with the educational mission.
      *   *Condition Idea:* The production must include a framing element (talkback, program note, director's statement) that explicitly acknowledges the moral ambiguity. This respects the art but contextualizes it civically.

