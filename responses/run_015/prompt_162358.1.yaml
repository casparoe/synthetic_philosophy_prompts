answer: |-
  This is an exceptionally precise diagnosis of the tension between geometric rationality as a mathematical theorem and geometric rationality as a life philosophy. You have correctly identified that the contradiction arises not from the math itself, but from the mapping of the math onto the territory of a human life.

  Here is the diagnosis, the cost of the repair, and the straight answer you requested.

  ### The Diagnosis: Which Step to Reject?

  You should reject **(3)**, but not for the reason you initially feared (arbitrariness). You must reject the strong form of (3) because **human capital violates the rebalancing assumption inherent in the Kelly derivation.**

  You should also qualify **(1)**. The asymptotic dominance theorem holds for $N \to \infty$ with **independent, identically distributed (iid)** opportunities. Life decisions are neither independent nor identically distributed, and $N$ is finite.

  Here is why keeping (3) as "Total Net Present Value" is mathematically invalid, not just practically difficult:

  **1. The Rebalancing Constraint**
  The Kelly derivation assumes that if your bet loses, your wealth $W$ shrinks, and your next bet size shrinks proportionally. It also assumes that if your bet wins, you can immediately reinvest the gains.
  When you include human capital in $W$, you are implicitly assuming that human capital is **liquid and mark-to-market.**
  *   In your example (4a), you borrow against future earnings to buy equities.
  *   If the market crashes 50%, your liquid wealth is wiped out, and your debt remains.
  *   To maintain the Kelly fraction, you must *add* capital to the position (rebalance).
  *   But your human capital (the collateral) has likely *also* depreciated (recessions correlate with market crashes), and crucially, **you cannot liquidate it fast enough to meet the margin call.**
  *   Therefore, the trajectory of your wealth is not the smooth geometric path the Kelly formula predicts. It is a path interrupted by **liquidity constraints** and **forced liquidation** at the worst possible time.

  Treating human capital as part of $W$ in the Kelly formula treats a **call option on future labor** as **cash in hand**. This is a category error. Human capital is a *constraint* on your risk capacity, not a *source* of risk capacity.

  **2. The Correlation Problem**
  Kelly assumes independent bets. Your human capital is highly correlated with the broad equity market (systematic risk) and potentially with your angel investments (idiosyncratic economic risk).
  If you leverage human capital to buy equities, you are not diversifying; you are doubling down on the same underlying economic factors. The "volatility" in the denominator of the Kelly formula ($\sigma^2$) understates the true risk because it ignores the correlation between the numerator (your edge) and the denominator (your total solvency).

  ### The Repair: What Belongs in $W$?

  $W$ must be defined as **Liquid, Riskable Capital that can absorb a total loss without triggering a state-change in the agent.**

  This sounds like the "narrow reading" you disliked, but it can be principled rather than arbitrary. The principle is **Survival Floor Constraints.**

  *   **The Floor:** There is a wealth level $W_{min}$ below which your utility function is no longer logarithmic; it approaches $-\infty$ (homelessness, starvation, inability to participate in future markets).
  *   **The Repair:** You do not maximize $E[\log W]$. You maximize $E[\log (W - W_{min})]$.
  *   **Human Capital's Role:** Human capital does not add to the numerator ($W$); it raises the floor ($W_{min}$). It gives you the *capacity* to take risk because it ensures you won't starve if your liquid capital goes to zero. But it does not justify *leverage* because it cannot be sold to cover losses.

  **The Cost of This Repair:**
  1.  **Silence on Career:** You are correct that this makes geometric rationality silent on "how much to invest in education." It becomes a theory of **portfolio management given a career**, not a theory of **life optimization**.
  2.  **Arbitrariness of the Floor:** Determining $W_{min}$ is subjective. However, this is not a bug; it is a feature. Different agents have different ruin thresholds. The theory cannot solve for your personal ruin threshold; you must supply it.

  ### Addressing the Self-Undermining Point (5)

  You asked: *If the rule's own sensitivity analysis says to shrink away from the rule's own output, is fractional Kelly a repair or an admission that maximizing E[log W] was never the right target?*

  It is a **repair derived from the same target.**

  Maximizing $E[\log W]$ assumes you *know* the probabilities $p$ and payoffs $b$. In reality, you have a posterior distribution over $p$.
  If you maximize expected log wealth **integrated over your uncertainty about $p$**, the optimal bet size is **automatically smaller** than the Kelly bet calculated at the mean estimate of $p$.

  *   **Full Kelly** is optimal only if you have zero uncertainty about your edge.
  *   **Fractional Kelly** is optimal if you have Bayesian uncertainty about your edge.

  This is not an admission that log utility is wrong. It is an admission that **point estimates are wrong.** The "self-undermining" intuition you have is actually the correct Bayesian calculation. If your confidence interval on the 60% win probability includes values where the bet is negative EV, the optimal fraction drops precipitously.

  ### The Scope Shift: Asymptotic vs. One-Shot

  You asked: *Does the asymptotic theorem license anything at all for a decision I will make once?*

  **Yes, but qualitatively, not quantitatively.**

  The asymptotic theorem proves that geometric growth dominates arithmetic growth over time. For a one-shot decision, the theorem does not tell you *how much* to bet (because there is no "time" to recover from variance). However, it does tell you **which bets to accept.**

  1.  **The Ergodicity Filter:** Geometric rationality provides a strict filter for one-shot decisions: **Reject any gamble where the geometric expected return is negative,** even if the arithmetic expected return is positive.
      *   Example: A 50% chance to double and 50% chance to lose 60%. Arithmetic EV is +10%. Geometric EV is negative ($\sqrt{2 \times 0.4} < 1$).
      *   For a one-shot decision, a risk-neutral agent takes this. A geometric rationalist rejects it. Why? Because if this *type* of decision appears more than once in your life (and it always does, in some form), taking it ensures eventual ruin.
      *   **The Bite:** It prevents you from taking "good bets" that are actually ruinous in a non-ergodic world.

  2.  **Convexity Preference:** It licenses a preference for decisions with bounded downsides and unbounded upsides (barbell strategies), even if the immediate EV is lower. This is because the log function penalizes drawdowns more than it rewards equivalent upside.

  ### The Straight Answer

  **After the repair, is there any version of geometric rationality that has real bite for the large one-shot decisions of a life?**

  **Yes, but its bite is in veto power, not calculation.**

  1.  **It vetoes leverage against non-liquid assets.** (Rejects premise 3).
  2.  **It vetoes positive-EV gambles with negative geometric drift.** (The ergodicity filter).
  3.  **It vetoes precise sizing based on uncertain probabilities.** (Forces Fractional Kelly via Bayesian integration).

  **Is its domain of competence limited to casinos and portfolios?**
  No, but its application to "life" is **structural**, not **computational**.
  *   **Computational:** "Bet 56% of your net worth on this startup." (This fails).
  *   **Structural:** "Do not structure your life such that a single failure removes you from the game. Prefer risks where the downside is capped and the upside compounds. Acknowledge that uncertainty in your edge requires smaller positions than your best guess implies."

  **The Price:**
  The price of keeping (1) and (2) is admitting that Geometric Rationality is not a **Complete Theory of Action**. It is a **Theory of Sustainability**. It tells you how to stay in the game long enough for the law of large numbers to work. It does not tell you how to optimize a single turn when the game might end after that turn.

  For the one-shot decisions (career, marriage, migration), you need a utility function that accounts for **regret** and **state-dependent utility**, not just wealth growth. Geometric rationality provides the *constraint* (don't go broke), but you need a broader ethical or philosophical framework to select the *objective* (what are we growing for?).

  **Summary of the Fix:**
  1.  **Reject (3):** $W$ is liquid, riskable capital only. Human capital sets the survival floor, not the bet size.
  2.  **Qualify (1):** Maximize $E[\log W]$ subject to parameter uncertainty (which yields Fractional Kelly) and survival constraints ($W > W_{min}$).
  3.  **Reinterpret (2):** Myopia holds for sizing, but not for opportunity selection. Future opportunity availability depends on current survival.
  4.  **Application:** Use geometric rationality to filter out ruinous risks and size repeatable financial bets. Use other frameworks (virtue ethics, satisficing, etc.) for singular, non-repeatable life choices where "growth" is ill-defined.

  The absurdity you found in (4) was the system correctly telling you that **you are trying to optimize a variable (lifetime wealth) using a tool designed for a different variable (rebettable capital).** The tool isn't broken; the map was.
