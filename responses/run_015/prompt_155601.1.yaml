answer: |-
  ### Preamble: Criterion of Personal Constitution

  This list constrains a **criterion of personal constitution**, not a general metaphysics of cognition. A metaphysics of cognition asks what makes a process cognitive *simpliciter* (e.g., information processing, homeostatic control). That question is too broad for the adjudication target. A server farm running a recommendation algorithm engages in cognitive-style processing, but tampering with it is not necessarily an intrusion on *you*. The legal and ethical stakes described—distinguishing intrusion on the person from damage to property—require a boundary around the *agent*. We need to know when an external vehicle is not just cognitive, but *constitutive of the subject*. Therefore, the desiderata below are designed to identify the boundaries of the *cognitive self*, prioritizing normative integrity over descriptive completeness.

  ### The Desiderata

  **1. The Real-Time Integration Constraint**
  *   **(a) Statement:** To be constitutive, an external vehicle must be coupled to the biological system with a latency and reliability indistinguishable from internal neural processing during the relevant task.
  *   **(b) Motivating Case:** *Latency (1)* and *Standby Redundancy (6)*. A device that answers in ten seconds (1) forces the stream of thought to reorganize around the gap; a backup drive never consulted (6) remains inert data.
  *   **(c) What it Rules Out:** It rules out slow cloud queries and unused backups as constitutive parts of the mind, classifying tampering with them as property damage or service interruption rather than cognitive intrusion.
  *   **(d) Status:** Non-negotiable for adjudication. Legal protections for mental integrity presuppose a unity of experience that breaks down at high latencies.

  **2. The Individual Individuation Constraint**
  *   **(a) Statement:** A constitutive cognitive system must be individuated per subject; no single cognitive vehicle can be constitutive of two distinct persons simultaneously.
  *   **(b) Motivating Case:** *Shared Custody (2)*. A lab notebook or shared archive relied upon by two people cannot be part of *both* minds in the same respect without merging their legal persons.
  *   **(c) What it Rules Out:** It rules out shared resources counting as constitutive for all users. If the notebook is part of Mind A, it cannot be part of Mind B, or else rights over the notebook become incoherent.
  *   **(d) Status:** Non-negotiable for adjudication. Current legal frameworks cannot accommodate overlapping persons; this constraint preserves the "one subject, one mind" assumption required for rights attribution.

  **3. The Algorithmic Transparency Constraint**
  *   **(a) Statement:** The subject must possess either direct understanding or effective auditability of the processes governing the retrieval and manipulation of stored content.
  *   **(b) Motivating Case:** *Opaque Drift (3)*. A recommender system that surfaces memories based on hidden commercial incentives alters the cognitive loop without the subject's knowledge.
  *   **(c) What it Rules Out:** It rules out black-box algorithms as constitutive vehicles. Tampering here is manipulation of the environment, not necessarily mind-reading, unless the subject can audit the logic.
  *   **(d) Status:** Negotiable (Preference of Autonomy Camp). Functionalists may argue reliability suffices, but for adjudication, lack of auditability undermines claims of personal integrity.

  **4. The Non-Alienation Constraint**
  *   **(a) Statement:** The vehicle must not be experienced by the subject as an external controller or hostile force, even if initially unendorsed.
  *   **(b) Motivating Case:** *Unendorsed Prosthesis (4)*. A mandated implant becomes indispensable but remains hated. If the subject experiences it as "them" not "me," tampering may be bodily harm but not necessarily mental intrusion.
  *   **(c) What it Rules Out:** It rules out involuntary or resisted tools from counting as full constituents of the *mental* self, distinguishing between bodily integrity and mental integrity.
  *   **(d) Status:** Negotiable (Preference of Phenomenological Camp). A purely functional view would count the indispensable device regardless of attitude.

  **5. The Phenomenal/Behavioral Sensitivity Constraint**
  *   **(a) Statement:** Degradation or substitution of the vehicle must register as a disruption in the subject's phenomenology or behavioral competence within a relevant timeframe.
  *   **(b) Motivating Case:** *Silent Substitution (5)* and *Degradation without Phenomenology (8)*. If a device is swapped and behavior diverges only over months (5), or degrades without felt effort (8), the link to the *self* is tenuous.
  *   **(c) What it Rules Out:** It rules out systems where the subject is insensitive to changes. If you don't feel the loss or change, it is harder to argue your *mind* was violated rather than your tools.
  *   **(d) Status:** Non-negotiable for adjudication. Mental rights protect the *experience* of agency and continuity; invisible changes are epistemically inaccessible to the victim claiming violation.

  ### Incompatibilities

  Three critical tensions arise when attempting to satisfy these desiderata jointly:

  1.  **Individuation vs. Shared Resources:** The **Individual Individuation Constraint** (2) is incompatible with a robust **Parity Principle** applied to *Shared Custody* (2). If two people rely equally on a shared archive, functionalism suggests it is part of both cognitive systems. However, satisfying the Individuation Constraint requires assigning it to only one (or neither), violating functional parity. You cannot have overlapping cognitive constitutions without overlapping legal persons, which the adjudication target forbids.
  2.  **Non-Question-Begging Criterion vs. Skull/Skin Specialness:** A criterion that satisfies **Real-Time Integration** (1) and **Sensitivity** (5) without explicitly privileging biology risks being question-begging. If we demand phenomenology (5), we implicitly privilege the skull because current external vehicles lack phenomenological integration. If we demand only functional coupling (1), we lose the special status of the brain. A non-question-begging criterion cannot simultaneously explain why the skull is special and allow for external constitution without circularly defining "special" as "internal."
  3.  **Adjudication Target vs. Sensitivity:** There is a tension between the **Adjudication Target** (protecting against silent editing) and the **Phenomenal/Behavioral Sensitivity Constraint** (5). *Silent Substitution* (5) describes a scenario where interference *should* count as intrusion (editing the mind) but fails the Sensitivity Constraint (the subject notices nothing). If we enforce Sensitivity to ensure claimants can prove violation, we leave subjects unprotected against sophisticated, undetectable manipulation.

  ### The Exclusionary Requirement

  The single requirement that does the most exclusionary work is **The Individual Individuation Constraint (2)**.

  While **Phenomenal Sensitivity** rules out functionalist theories, and **Transparency** rules out modern AI tools, **Individuation** fundamentally blocks the core move of the Extended Mind thesis in a legal context. The Extended Mind argument thrives on coupling and reliability, often ignoring boundaries between agents (e.g., coupled dyads). However, legal adjudication requires discrete bearers of rights. By demanding that a constitutive vehicle belong to *one* subject, this requirement excludes any theory that allows for distributed or shared cognitive constitution across multiple agents. It forces a choice: either minds are strictly individual (rejecting shared constitution) or legal personhood must be radically redefined. Most cognitive science theories cannot survive the latter; most legal systems cannot survive the former.

  ### Scorecard

  *   **Extended/Parity View:** Fails **Individuation** (allows shared minds) and **Sensitivity** (allows opaque/slow tools). Good for description, bad for rights.
  *   **Internalist (Brain-Bound):** Passes **Individuation** and **Sensitivity**. Fails **Real-Time Integration** (ignores reliable external reliance). Protects rights, ignores technological reality.
  *   **Functionalist Vehicle-Neutral:** Fails **Sensitivity** and **Non-Alienation**. Treats minds as abstract processes. Unable to distinguish intrusion from property damage.
  *   **Enactive/Mark-of-Cognitive:** Passes **Non-Alienation** and **Sensitivity**. Ambiguous on **Individuation** (often emphasizes coupling over boundaries). Best fit for agency, difficult to operationalize for law.

  ### Distortion Note

  The adjudication target distorts the list by prioritizing **Individuation** and **Sensitivity** over functional reality. The best taxonomy of cognition likely admits shared, opaque, and slowly-coupled processes as cognitive. However, a theory optimized for rights must deny these are *constitutive of the person* to maintain clear boundaries for liability and protection. Thus, the metaphysically accurate theory of cognition will likely fail the adjudication target, and the legally adequate theory will likely be metaphysically restrictive.
