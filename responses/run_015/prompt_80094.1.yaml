answer: |-
  1. Your pain is not inherent but stems from using a linear document instead of a modular system that separates procedures from variable data.
  2. You should structure the manual so specific cleaners are defined once in a master list and referenced dynamically by each task.
  3. This ensures that changing a single product entry automatically updates every procedure that uses it without requiring manual cross-referencing.
  4. However, this approach requires more upfront technical setup and might confuse crew members who are used to simple printed checklists.
  5. You also create a single point of failure where an error in the central list propagates mistakes across your entire operation instantly.
