answer: |-
  **The practice, restated**
  You have accurately described the mechanics of a traditional public archive. It operates on a dual system: statutory records (council minutes, court files) are deposited because legislation mandates it, creating a continuous, official narrative of administration. Parallel to this is the "accidental" archive (photos, diaries, ledgers), which survives only through the voluntary donation of private citizens, heavily skewing survival toward the wealthy and literate. The cataloging system respects "provenance," meaning it organizes documents by who created them and uses their original terminology, while access is restricted by time embargoes. In short, the archive preserves the paperwork of power and the personal effects of those privileged enough to save them, organized by the logic of the people who held the pen.

  **The theory it presupposes**
  Your intuition is correct: this setup presupposes that the past is best understood through the lens of the state and the property-owning class. Traditional archival theory often treats records as "evidence" of transactions rather than "memory" of experiences. By prioritizing statutory deposits, the archive assumes that the most significant historical events are those processed by bureaucracy—taxes, laws, and court rulings. This positions the state as the natural witness of history, implying that if an event wasn't recorded by an official body or a household head, it lacks the weight of evidence required for historical truth. The archive becomes a vault for the "official story," where legitimacy is granted by the seal of the department or the status of the donor.

  Furthermore, by retaining the original headings and language of the creators (like listing a person under "domestic servants" in an account book rather than indexing their name), the archive validates the power dynamics of the time. It assumes that the perspective of the record-creator is the primary truth. When a master writes about a servant, the archive treats the master's description as the definitive metadata. This suggests that history is something that happens *to* people, rather than something enacted *by* them. The waiting period for recent files reinforces this by asserting that the state retains ownership over the narrative until it decides the public is ready to see it, prioritizing administrative confidentiality over public memory.

  **What it quietly rules out**
  This structure systematically excludes the history of the marginalized, the informal, and the emotional. Because it relies on the "five families" to donate the human element, the lives of workers, tenants, and the poor are only visible when they intersect with the lives of the elite or the law. A servant's life is ruled out as a subject of study because they rarely generated the kind of paperwork the archive is designed to house; they appear as expenses or names in a ledger, not as authors of their own story. Oral traditions, community gatherings, strikes, and domestic realities that left no paper trail are effectively erased. The archive rules out the possibility that history exists outside of documentation, silencing those who were too busy surviving to keep a diary or too powerless to have their records deemed legally significant.

  **Where it contradicts itself**
  The archive contradicts itself when it claims to be a neutral repository of the town's collective memory while relying on a selection process that is inherently biased. It presents itself as a public good open to all, yet the "community shelf" is privately curated by a specific demographic. There is a tension between the archivist's duty to preserve the past and their method of doing so, which preserves the *structure* of the past rather than the *content* of lived experience. For example, the catalog helps you find the account book, but the language within it hides the individual humanity of the people listed. The archive claims to offer access to history, but by adhering strictly to the original order and language of oppressive or exclusive systems, it inadvertently protects those systems from scrutiny, making the archive a guardian of historical silence as much as historical speech.

  **What would have to change**
  To stop assuming the state is the natural witness, the archive would need to shift from passive reception to active collection. Instead of waiting for donations from the "five families," archivists would need to partner with community groups to identify and preserve materials from working-class neighborhoods, minority communities, and local organizations before they are lost. Cataloging would need to be interventionist; archivists should add modern subject tags and names to records that originally obscured them (e.g., indexing the servant's name separately from the household head). Finally, the definition of a "record" would need to expand to include oral histories and digital media collected specifically to fill the gaps left by official paperwork. This turns the archive from a warehouse of authority into a workshop of memory, where the goal is not just to store what was filed, but to reconstruct what was lived.
