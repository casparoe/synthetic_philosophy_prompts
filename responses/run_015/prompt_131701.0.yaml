  **Joint Statement on the Ontology and Epistemology of Dream Reports**

  **I. Agreed Claims**
  Following adversarial collaboration, Camp A (Grammatical-Skeptical) and Camp B (Heterophenomenological-Revisionist) endorse the following propositions:

  1.  **Epistemic Asymmetry:** First-person reports issued upon waking lack the public verification criteria available to waking perceptual reports. Consequently, dream reports cannot be treated as objective descriptions of independent events verified during the state they describe.
  2.  **Temporal Unreliability:** The subjective sense of duration and sequential narrative found in dream reports does not reliably map onto physiological time elapsed during sleep. The "story" of the dream is not guaranteed to have unfolded in real-time.
  3.  **Validity of Null Reports:** Statements such as "I slept like a stone" or "There was nothing" constitute valid data points regarding the subject's waking belief state, rather than indicating a failure of memory or a contradiction of physiological sleep markers.

  **II. Table of Disagreements**

  | Issue | Camp A (Malcolm-Style) | Camp B (Dennett-Style) |
  | :--- | :--- | :--- |
  | **Status of "Dream Experience"** | The concept of "experience during sleep" is **conceptually incoherent**. Without waking criteria, the phrase lacks sense; there is no fact of the matter to be false. | The concept is **empirically revisable**. "Experience" refers to a waking belief state; the claim that it occurred *during* sleep is a false empirical hypothesis about brain timing. |
  | **Role of Neuroscience** | Neuroscientific data cannot adjudicate the concept. Finding neural correlates does not establish "experience" if the grammatical criteria are unmet. | Neuroscientific data is decisive. It can demonstrate that narrative construction occurs post-awakening, falsifying the "sequential movie" hypothesis. |
  | **Nature of the Report** | The report is an **expression** (like saying "I thought I saw..."), not a description of a past inner event. | The report is a **true description of a current belief**, but potentially false about the history of that belief's formation. |

  **III. Cruxes and Empirical Bearings**

  **Crux 1: Predictive Processing and Offline Simulation**
  *Does the mechanism of narrative construction dissolve the dispute or relocate it?*
  *   **Concrete Case:** Models showing the brain constructs coherent narratives from fragmented REM signals only upon awakening (post-hoc confabulation).
  *   **Camp A Prediction:** This confirms the grammatical point: since the narrative is constructed upon waking, there was never an "experience" during sleep to refer to. The concept remains empty.
  *   **Camp B Prediction:** This specifies the empirical mechanism: the "dream" is a belief formed at $t_{wake}$ about neural activity at $t_{sleep}$. The dispute is relocated to the timing of consciousness, not its conceptual possibility.

  **Crux 2: Lucid Dreaming and Real-Time Signaling**
  *Does voluntary signaling during REM prove sequential experience?*
  *   **Concrete Case:** Subjects perform pre-agreed eye signals (e.g., left-right-left) during verified REM sleep to indicate lucidity.
  *   **Camp A Prediction:** This shows complex sleep behavior, not "experience." The report "I was lucid" is still a waking expression validated by the signal, not proof of inner awareness during sleep.
  *   **Camp B Prediction:** This proves some form of functional consciousness exists during sleep. However, it does not prove the *narrative* reported upon waking existed sequentially; the signal is data, the narrative is still a waking construction.

  **Crux 3: Neuroimaging Content Decoding**
  *Does matching brain states to reported content validate the experience?*
  *   **Concrete Case:** fMRI patterns during sleep are decoded to match objects (e.g., "car," "person") reported upon waking with high accuracy.
  *   **Camp A Prediction:** Correlation is not attribution. Matching brain states to words does not satisfy the criteria for "seeing a car." It only shows causal links between brain states and waking speech.
  *   **Camp B Prediction:** This validates the heterophenomenological method. The brain state is the "text" being interpreted. It confirms the report is about real neural events, even if the temporal structure is revised.
