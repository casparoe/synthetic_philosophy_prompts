  **The Example: The Asexual Dandelion Swarm (*Taraxacum officinale* aggregate)**

  Here is the case: Common dandelions reproduce via *apomixis*, meaning the seeds are clones of the mother. There is no sexual recombination. Over time, mutations create hundreds of distinct clonal lineages that look slightly different and live in specific patches.

  **The Philosophical Clash (Individual vs. Class)**
  *   **Species as Classes (The "Box" View):** A species is a category defined by shared traits (looks, genetics). Since all these dandelions are roughly "dandelion-shaped" and genetically similar, they are all members of one class: *Taraxacum officinale*.
  *   **Species as Individuals (The "Historical Entity" View):** A species is a unique historical lineage with a birth, life, and death. Since each clonal line has its own separate ancestry and future, each clone is a distinct evolutionary individual.

  **The Disagreement (Numbers and Extinction)**
  Imagine a specific clonal lineage of dandelions living in a single valley is wiped out by a new fungus.
  *   **The Class View says:** Zero species went extinct. "Dandelions" still exist everywhere else. The count remains **1 species**.
  *   **The Individual View says:** One distinct evolutionary individual has died forever. The count drops from **500 species to 499**.

  **The Stakes (Why it matters)**
  This isn't just bookkeeping. Under laws like the Endangered Species Act, protection hinges on whether you are protecting a "Kind" (the general dandelion) or a "Lineage" (the specific valley clone). If species are Classes, the valley population gets no protection because the "species" isn't endangered. If species are Individuals, that valley population is a unique entity worthy of conservation. You get different legal outcomes based on your metaphysics.

  **Strongest Objection & Rebuttal**
  *   **Classmate's Objection:** "Calling every clone a 'species' is absurd. They don't evolve independently like real species; they're just copies. You're inflating the number of species to infinity."
  *   **Your Rebuttal:** "Asexual lineages *do* accumulate mutations and adapt to local niches over time. If a species is defined by having its own unique history and fate (the Individual view), then a clone fits that definition better than a sexual population where genes are constantly shuffled. Denying them species status just because they don't have sex is assuming sex is required for 'real' existence, which is exactly the human bias we're questioning."

  **Why This Beats Ring Species**
  Ring species argue about where to draw a line in space across a continuum; this case argues about whether the fundamental unit of nature is a *category of similarity* or a *unique historical life*, which cuts deeper into what "existence" means for biology.

  ***

  **2-Minute Verbal Pitch (for 4th Period)**

  "Imagine a field of dandelions. Normally, we say that's one species. But these dandelions don't have sex; they clone themselves. Over time, you get hundreds of distinct family lines that never mix.

  Here's the problem: If a disease wipes out one specific family line in one valley, did a species go extinct?

  If you think a species is a **Category**—like a box we put things in based on how they look—then no. 'Dandelions' still exist. Nothing died.

  But if you think a species is an **Individual**—like a person, with a specific birth, history, and death—then yes. That unique lineage is gone forever, just like a person dying.

  This matters because laws protect 'species.' If species are Categories, that valley gets no protection. If they are Individuals, it does. My paper argues that treating species as Historical Individuals makes more sense biologically, because it acknowledges that every distinct lineage has its own fate, even if they look the same. Ring species just argue about where to draw a border on a map; this argues about whether the thing on the map is a 'type' or a 'life.'"
