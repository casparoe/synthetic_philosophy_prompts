answer: |-
  Vern and Iris were sitting in a pub near the field site, the kind of place where the coasters were stained with ring-marks from thirty years of post-mapping pints. Vern looked like he'd swallowed a compass.

  "Rough dig?" Iris asked. She was the philosopher in their reading group; Vern was the geologist who'd taught her what 'strike and dip' actually meant.

  "Rougher," Vern said. "I found a deposit. Or I would have. I ran a spectral scan first. Cost me nothing—government grant. The scan came back negative for arsenic. Protocol said if the scan is negative, I must halt drilling until further review. I halted. Yesterday, the review came back. The scan was wrong. There was arsenic. There was gold. And now the lease expires."

  Iris swirled her beer. "But Good's Theorem proves the expected value of information is non-negative. You shouldn't be worse off for looking."

  "Good's Theorem assumes I'm free to ignore what I learn," Vern said. "It assumes that after I see the data, I can still choose the action I would have taken without it. In this case, without the test, I was free to drill. With the test, I was mandated to stop."

  "So the information restricted your action set," Iris said.

  "It sold me a constraint," Vern replied. "Good proved that information can't hurt you. He didn't prove that obedience is free."

  ***

  **Note on the liberties taken:**

  The joke hinges entirely on the assumption that the agent's set of available actions remains constant before and after observing the signal. Good's proof relies on the inequality $E[\max_{a} U(a|info)] \geq \max_{a} E[U(a)]$, which holds because the optimal action *without* information is still available *with* information (you can always choose to do what you would have done anyway). If acquiring information triggers a external constraint (like a regulation or contract) that removes that prior option, the premise is violated, and the expected value of information can indeed be negative.

  There is genuine philosophical dispute here, though not about the math. Some decision theorists argue that a rational agent would never voluntarily accept a contract that forces them to act against their updated utility function, meaning the "violation" is actually a prior error in accepting the constraint. Others, particularly in applied ethics and policy, argue that agents are frequently bound by exogenous rules (laws, safety protocols) that make information potentially hazardous by removing the option to disregard it. The joke treats the constraint as a fixed reality to highlight the gap between the theorem's ideal conditions and institutional practice.
