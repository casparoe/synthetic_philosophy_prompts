  10. **Final Polish:** Check tone. Ensure it sounds like advice to a peer, not a lecture from a professor. (The prompt asks me to explain things to the user, *then* help them frame the remarks. I need to make sure I answer the user's questions directly first.)

  *(Self-Correction on the Speech)*: The user asked for the explanation *and* how to put the question to classmates. I should structure the response to first clarify the philosophy for the user, then provide the script.

  *(Refining the "Character" point)*: This is essentially the distinction between the *generator* and the *generated*. The intentional stance applies to the generated text (the persona), but that persona is ephemeral. The generator is just math. This avoids the "novel has beliefs" trap by clarifying that the novel *contains* representations of believers, but the AI *generates* them dynamically.

