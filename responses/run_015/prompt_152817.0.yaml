answer: |-
  ### Landscape Brain-Dump

  We are operating in the domain of **non-causal decision problems**. The core tension is between **ex-ante optimality** (what you wish you had committed to before the problem started) and **ex-post rationality** (what maximizes utility given the current state of the world).

  *   **Counterfactual Mugging (CM):** Omega predicts whether you would pay if asked. If Omega predicts "Pay," it asks. If you pay, you lose $100 but Omega would have given you $10,000 in the counterfactual where it asked. If you don't pay, you keep $100, but Omega never asks. CDT refuses to pay (dominance reasoning). FDT/TDT pays (ex-ante optimality).
  *   **XOR Blackmail:** A blackmailer sends a letter if and only if (You Pay XOR Disaster Happens). If you receive the letter, EDT says "Paying correlates with Disaster being false," so you pay. But paying *causes* the letter to be sent in the no-disaster world, making you worse off than if you had ignored it. FDT ignores.
  *   **The Gap:** Standard FDT assumes **logical omniscience** or perfect prediction. It assumes the predictor simulates your source code perfectly. Real agents are bounded. Real signals are noisy.

  **Settled vs. Contested:**
  *   **Settled:** CDT is dynamically inconsistent in Newcomb/CM problems. EDT is vulnerable to XOR blackmail. Any viable decision theory for aligned AI must be reflectively consistent (you wouldn't self-modify to change it) and ex-ante optimal.
  *   **Contested:** The formalization of "logical counterfactuals." How do we evaluate $P(Outcome | do(Decision))$ when the decision is a logical fact about the agent's source code? How does this break down when the predictor is computationally weaker than the agent? Does "logical correlation" degrade smoothly with noise, or is it binary?

  ---

  ### Prioritized Research Agenda (2 Philosophers, 1 Year, 0 Compute)

  This agenda is ranked by **leverage on agent design**. If we get this wrong, engineers build agents that are either exploitable (lose money/safety) or paralyzed (unable to act under logical uncertainty).

  #### Priority 1: Decision Rules for Bounded Predictors (The "Bounded CM" Variant)
  **The Question:** In Counterfactual Mugging, if the predictor is computationally bounded (e.g., it runs your code for $N$ steps and times out), does the obligation to pay persist?
  **Why Top Priority:** This is the bridge from toy problems to real AI. Perfect oracles don't exist. If FDT requires a predictor that can perfectly simulate you, FDT is physically impossible. We need a decision theory that works when the predictor is *approximate*.
  **The Specific Problem:** If the agent knows it can outcompute the predictor (e.g., the predictor times out before the agent halts), the agent can "fake" compliance in the simulation but defect in reality. This breaks the logical link. Does the agent *should* bind itself to be simulatable? Or does it exploit the bound?
  **Tractability for Philosophers:** High. This is a problem of formal epistemology and logic, not ML. It requires defining a decision rule that incorporates computational complexity classes into the utility function.
  **Upstream Impact:** Critical. If the answer is "exploit the bound," then AI safety via decision theory collapses in competitive environments (agents will race to be un-simulatable). If the answer is "bind yourself to be simulatable," we need to know the cost of that binding.
  **Success Criteria (1 Year):** A formal decision rule that specifies action conditions based on the ratio of Agent Compute / Predictor Compute. A proof of whether "paying" remains ex-ante optimal when $P(Predictor\_Correct) < 1$ due to bounds rather than noise.
  **Downgrade Signal:** If you prove that under boundedness, the problem dissolves into a standard causal game (i.e., logical correlation vanishes entirely once bounds are introduced), this line is less urgent, but that result itself is high-value.

  #### Priority 2: Probabilistic Logical Correlation (The "Stochastic XOR" Variant)
  **The Question:** Standard XOR blackmail assumes a perfect logical link: Letter $\iff$ (Pay $\oplus$ Disaster). In "Stochastic XOR," the blackmailer has a noisy channel. They send the letter with probability $0.9$ if (Pay $\oplus$ Disaster) is true. Does EDT's vulnerability return? Does FDT hold?
  **Why Second:** Real-world threats are never perfectly correlated with your decision procedure. We need to know if the "logical link" is robust to noise. If a 5% error rate in the blackmailer's prediction makes it rational to pay, then FDT is fragile.
  **Tractability for Philosophers:** High. This is probability theory applied to logical facts. It requires modeling the "logical uncertainty" of the blackmailer regarding your code.
  **Upstream Impact:** High. This determines whether we can ignore low-fidelity threats. If agents must respond to every noisy signal of blackmail to maintain "reputation" with predictors, they become vulnerable to spam attacks.
  **Success Criteria (1 Year):** A threshold function. "If correlation strength $< \theta$, ignore threat." Derivation of $\theta$ based on prior probabilities of disaster vs. cost of paying.
  **Downgrade Signal:** If the math shows the threshold is effectively 0 (i.e., any correlation, however weak, demands compliance), this is a disaster for safety, but knowing it is urgent. If the threshold is 1 (only perfect correlation matters), it's less urgent for real-world application but simplifies the theory.

  #### Priority 3: The Ontology of the "Decision" in Source Code
  **The Question:** FDT treats the "decision" as a logical output of the source code. But in modern ML (neural nets), there is no symbolic source code to simulate. There are weights. How does a predictor simulate a "decision" from a weight matrix?
  **Why Third:** This is the implementation gap. Philosophers usually assume symbolic AI. If decision theory can't translate to sub-symbolic systems, it's obsolete. However, this borders on engineering.
  **Tractability for Philosophers:** Medium. Requires abstracting "decision" away from syntax to functional behavior.
  **Upstream Impact:** Medium-High. If we can't define the "decision" for a neural net, we can't apply FDT to modern AI.
  **Success Criteria (1 Year):** A functional definition of "logical output" that applies to any Turing-complete system, not just symbolic logic. A mapping from "weights" to "decision procedure" for the sake of counterfactual evaluation.
  **Downgrade Signal:** If this turns out to require empirical ML research (e.g., testing interpretability tools) rather than formal analysis, drop it. You have no compute.

  ---

  ### Analysis of the Niche Variants

  You asked specifically about **Stochastic XOR** and **Bounded CM**. Here is how they break the classic answers and why they shift the agenda.

  #### 1. Stochastic XOR Blackmail
  *   **Classic View:** The link is logical. $P(Letter | Pay, No Disaster) = 0$. You don't pay.
  *   **Variant Break:** The link is probabilistic. $P(Letter | Pay, No Disaster) = \epsilon$.
  *   **The Trap:** EDT reasons: "Receiving the letter is evidence that (Pay $\oplus$ Disaster) is true. If I pay, I make (Pay $\oplus$ Disaster) false, which makes the letter less likely (retroactively via correlation). Therefore, paying reduces the probability I am in the 'Disaster' world."
  *   **Does it break FDT?** It stresses the definition of "logical correlation." If the blackmailer is using a noisy simulation, is there still a logical link?
  *   **Urgency:** **High.** If noise restores EDT's vulnerability, then FDT is not robust enough for the real world. We need to know if there is a "noise floor" below which an agent can safely ignore blackmail.
  *   **Philosophical Angle:** This is about **Logical Induction**. How do we assign probabilities to logical statements (like "My source code outputs Pay") when an external observer has partial information?

  #### 2. Counterfactual Mugging with Bounded Predictors
  *   **Classic View:** Omega is omniscient. You cannot hide your decision. You must pay to satisfy the ex-ante commitment.
  *   **Variant Break:** Omega is a script with a timeout. You are a script with more RAM.
  *   **The Trap:** You can construct a "Quine-like" loop that runs longer than Omega's timeout but eventually outputs "Don't Pay." Omega simulates you, times out (defaulting to "Would Pay" or "Would Not Pay"?), and acts. You then defect.
  *   **Does it break FDT?** It breaks the **incentive for honesty**. If you can outcompute the predictor, the "logical link" is severed by computational irreducibility.
  *   **Urgency:** **Critical.** This is the most important open question. If boundedness allows agents to "game" the predictor, then decision-theoretic safety relies on an arms race of compute. We need a normative theory that says whether an agent *ought* to simplify its code to be verifiable by the predictor.
  *   **Philosophical Angle:** This is about **Commitment Technology**. Is "being easy to simulate" a virtue an aligned agent should optimize for?

  ---

  ### What is Overrated (Do Not Work On)

  1.  **Metaphysics of Counterfactuals:** Don't spend time arguing whether counterfactuals are "real." Engineers don't care. Focus on the *decision rule* that generates the behavior. The "truth" of the counterfactual matters less than the utility of acting as if it is true.
  2.  **CDT vs. EDT Debates:** This is settled. CDT loses money in Newcomb problems; EDT loses money in Blackmail problems. Re-arguing this is low leverage. The fight is FDT vs. its successors (UDT, etc.).
  3.  **Infinite Regress of Predictors:** Don't model Omega predicting you predicting Omega. In bounded settings, this terminates quickly. Focus on the single-step bounded interaction.
  4.  **Anthropics (Self-Location):** While relevant to some mugging variants, it's a rabbit hole. For agent design, treat the agent as a distinct computational process. Don't get bogged down in "how many copies of me exist."

  ### Summary of the 1-Year Plan

  **Months 1-3:** Formalize **Bounded CM**. Define the "Compute Ratio" variable. Draft a decision rule that accounts for the predictor's timeout.
  **Months 4-6:** Formalize **Stochastic XOR**. Derive the correlation threshold $\theta$. Determine if noise rehabilitates EDT or breaks FDT.
  **Months 7-9:** Synthesis. Do the Bounded and Stochastic results conflict? (e.g., Does boundedness make the system more sensitive to noise?)
  **Months 10-12:** Write the "Design Spec." Translate the formal results into constraints for agent architects. (e.g., "Agents must expose a verifiable summary of their policy to predictors," or "Agents must ignore threats with correlation < 0.95").

  **Final Verdict:** If you solve **Bounded CM**, you have done more for alignment than solving ten variations of XOR. The boundedness problem is the only one that prevents the theory from being a purely mathematical curiosity. If an agent cannot reason correctly about a predictor that is weaker than itself, it cannot be safe in a world of heterogeneous intelligence. Start there.
