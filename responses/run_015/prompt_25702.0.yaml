answer: |-
  Dear Colleague,

  I hope this letter finds you well and that your work on hard choices is progressing smoothly. I have been thinking about your request for a thought experiment that isolates asymmetric retrospective criticism within a parity relation, and I believe the following scenario might serve your purposes. Imagine you are the director of a small humanitarian non-profit facing a sudden budget crisis. Option A is to lay off two long-term staff members to balance the books, ensuring the organization survives to fight another day. Option B is to retain the staff but cancel a planned mission, preserving your team's livelihoods but failing to deliver aid to a waiting community. The value of organizational fidelity to your employees and the value of impartial beneficence to the beneficiaries are on a par; neither option is objectively better, nor are they equal, as they represent distinct normative kinds of good. However, if you choose Option A, you can later be rationally criticized by your former staff for actively breaking a communal bond and causing them direct harm. If you choose Option B, you cannot be criticized for actively harming anyone, only for failing to provide aid, and while the missed aid is a moral loss, it does not generate the same specific charge of betrayal that active dismissal does.

  To unpack this, we must first look at why these options are on a par rather than one being better or the two being equal. They are not equal because the values are qualitatively different; fidelity is agent-relative and grounded in special obligations, while beneficence is agent-neutral and grounded in general welfare. They are not such that one is better because reasonable agents can permissibly choose either without irrationality, yet they cannot be reduced to a common metric to determine a winner. The parity exists because the reasons supporting each option are of different kinds but comparable weight, creating a normative standoff where willpower rather than reason tips the scale. The asymmetry in retrospective criticism arises not from the outcome's quality but from the structure of the agency involved in realizing the value. Choosing Option A involves an act of commission that violates a negative duty not to harm specific individuals, whereas choosing Option B involves an act of omission that fails to fulfill a positive duty to help. The criticism available against the agent who chooses A is grounded in the tangible breach of a constraint, a normative residue that persists regardless of the justification. The agent who chooses B faces criticism for unmet potential, but this lacks the sharp edge of having directly wronged a specific person.

  The feature doing the work here is the deontic constraint embedded within the value of fidelity. Fidelity carries a side-constraint against active harm to the objects of loyalty, whereas beneficence is primarily a goal-based value that does not strictly prohibit omission in the same way. If you were to remove this feature, for instance by constructing a case where both options involve only positive duties, such as choosing which of two equally deserving groups to help, the asymmetry would collapse. In that standard parity case, choosing one group leaves you open to criticism from the other, but the criticism is symmetrical; both groups can claim you failed them, and neither choice involves a distinct normative violation like betrayal. The case would revert to a standard Chang-style parity scenario where the retrospective landscape is identical regardless of the choice made.

  However, I am aware that this verdict is vulnerable to specific objections that might change my mind. Ruth Chang herself might argue that if the options are truly on a par, the normative force of the reasons must be such that the permissibility of the choice shields the agent from rational criticism regarding the value not chosen. She might contend that any lingering criticism implies that one option was actually better all along, perhaps because the constraint against harm lexically outweighs the duty to aid, which would destroy the parity claim. Alternatively, a proponent of the vagueness view might argue that the asymmetry is merely epistemic; we feel the criticism is stronger for Option A only because we are ignorant of the precise weight of the values, and if we knew the full truth, we would see one option as strictly better. My reasoning is most likely to fail if it turns out that the distinction between commission and omission cannot bear the weight of rational criticism in hard choices, or if parity implies a kind of normative immunity that I have underestimated. If parity entails that the reasons are fully balanced in a way that neutralizes the deontic residue, then my claim about asymmetric criticism would be untenable, and the case would fail to isolate the feature you are looking for. I look forward to hearing your thoughts on whether this distinction holds up under scrutiny.

  Warmly,

  Your Assistant
