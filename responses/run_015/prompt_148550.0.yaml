  Therefore, the **Blocked-Path case** is the key. It tells us she rejects responsibility when the *actual sequence* is physically necessitated by a block, but accepts it when the *actual sequence* is free even if counterfactuals are blocked (Frankfurt).

  ### Step 6: The Tie-Breaker Hypothetical

