answer: |-
  They tore the stone to let the vision clear,
  No locked gate stands to bar the public way,
  The hedgerow fell to make the prospect wide,
  Where once a wall divided field from field.
  They claimed the line was drawn by tyrant hands,
  And smoothed the earth for unimpeded walk,
  No mere decree should ever hold the soil,
  So reason swept the ancient timber down
  To find the marsh awake beneath the grass.
  Where safe path led, the water claims the ground,
  The water runs unchecked to garden bed,
  And soil once kept apart now breeds the rot.
  I stand upon the break where knowledge ends,
  The reason lives only in damage done,
  To build again requires we walk as blind,
  In open fields whose dangers none can name.
