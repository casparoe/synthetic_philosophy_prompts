answer: |-
  Based on Daniel's track record, I am betting that the principle driving him is **Functional Decision Theory (FDT)**, or what Hofstadter originally termed **Superrationality**.

  This principle posits that a rational agent should choose the action that is the output of their decision *function*, recognizing that other agents running sufficiently similar functions will produce the same output. Unlike Causal Decision Theory (CDT), which looks only at physical causal chains, or Evidential Decision Theory (EDT), which looks at statistical correlations, FDT/Superrationality relies on *logical correlation*. Daniel cooperates, votes, or coordinates not because he causally influences others, but because he views his decision as logically linked to the decisions of anyone running the same "mental software."

  Here is why this principle beats the alternatives, my predictions for your two cases, and the test that will prove it.

  ### Why Superrationality/FDT Beats the Rivals

  1.  **It explains the Stranger PD (Defect):** CDT also predicts defection, but Team Reasoning (based on values) might struggle if Daniel feels a universal moral duty. Superrationality defects because there is no basis to assume the stranger is running the same decision function. No logical correlation, no cooperation.
  2.  **It explains the Friend PD (Cooperate):** CDT fails here (one-shot). Team Reasoning succeeds. But Superrationality also succeeds: the discussion established that they are running compatible algorithms, creating the logical link required for cooperation.
  3.  **It explains the Voting (Vote):** CDT fails (no causal pivot). EDT succeeds (my vote is evidence others like me vote). Superrationality succeeds and provides a stronger normative claim: "I vote because if I don't, logical copies of me won't either."
  4.  **It explains the Lottery (Pick 1):** This is the clincher. In the Luring Lottery, picking 1 is only rational if you assume your choice is logically correlated with the other 19 reflective friends. If they were just "friends" (Value Team), they might pick random numbers. If they were causal agents, your pick doesn't change theirs. Daniel picks 1 because he assumes that *if* the optimal strategy for a reflective group is 1, *all* reflective group members will deduce 1. He is optimizing for the *cohort of reasoners*, not just a cohort of friends.

  **Why not Value-Based Team Reasoning?**
  Value-Based Team Reasoning fits the Friend PD and the standard Voting case. However, it fails the Lottery. In the Lottery, the "team" was defined by being "reflective friends" (a reasoning capability), not by shared political or moral values. If Daniel were a Value-Team Reasoner, the Lottery would be ambiguous without a shared goal beyond winning. More importantly, Value-Team Reasoning cannot easily handle **New Case 2**, where values and reasoning style diverge.

  ### The Predictions

  **Case 1: One-shot PD with a Literature-Stranger**
  *   **Prediction:** **Cooperate.**
  *   **Reasoning:** Daniel knows the stranger has read the "same rationality literature." To a Superrationalist, this is the critical variable. It implies they are running the same decision function (source code). Even without personal trust or prior communication, the logical correlation is established by the shared intellectual framework. He will reason: "If I defect, a reasoner with my literature defects. If I cooperate, they cooperate. Mutual cooperation is better."

  **Case 2: Election (Mirror Reasoners vs. Shared Values)**
  *   **Prediction:** **Vote for the Other Candidate.**
  *   **Reasoning:** This is the counter-intuitive move that confirms the principle. Daniel rejects the EV argument for abstaining because he believes his vote has power *only* insofar as it is correlated with a cohort. In standard elections, that cohort is "people like me" (values + reasoning). Here, they are split.
      *   If he votes for his preferred candidate (Values), he breaks correlation with the "Mirror Reasoners." In his mind, this renders his vote "isolated" and thus causally/evidentially impotent, similar to the CDT abstention argument he rejects.
      *   To maintain the superrational link that gives his vote "weight," he must vote in concert with the agents running his algorithm. He trusts the *process* (reasoning style) over the *immediate preference* (values), assuming that if the mirrors support the Other Candidate, there is a logical consistency he must honor to remain part of the block. He prioritizes being a reliable node in the network of reasoners over the specific output of this single election.

  ### The Discriminating Case

  To definitively distinguish **Superrationality/FDT** from **Evidential Decision Theory (EDT)**, you need a case where *statistical* correlation and *logical* correlation diverge. EDT follows statistical evidence; FDT follows logical similarity.

  **Proposed Case: The "Rare Reasoner" Election**
  Construct a scenario where Daniel is told that:
  1.  **99% of the population** shares his **values** and supports Candidate A, but they use a completely different, "intuitive" reasoning style.
  2.  **1% of the population** (a tiny minority) shares his exact **reasoning style** (mathematical, Hofstadterian), but due to a specific technical interpretation of the platform, they support Candidate B.

  **The Question:** Who does he vote for?

  *   **EDT (Evidential):** Votes for **Candidate A**. His vote is statistically correlated with the 99% majority. If he votes A, it is strong evidence that the massive bloc votes A, swinging the election.
  *   **Value-Team Reasoning:** Votes for **Candidate A**. He aligns with his value-tribe.
  *   **Superrationality/FDT:** Votes for **Candidate B**. FDT cares about *logical* correlation, not statistical volume. The 99% are running different "software." Their votes are not logically linked to his. The 1% are running the *same* software. If he votes A, the 1% (logically) vote A. If he votes B, the 1% vote B. He will choose the action that maximizes utility *for the output of his function*. Even if the 1% is small, the *principle* of logical correlation dictates he must align with the mirrors, not the statistical crowd. If he votes with the 99%, he is treating his decision as a statistical signal rather than a logical output.

  If Daniel votes for the candidate supported by the tiny minority of "mirrors," you have confirmed he is a true Superrationalist. If he votes with the majority, he is an Evidentialist or Value-Team Reasoner masquerading as one.
