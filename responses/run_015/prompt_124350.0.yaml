  **Workshop Proposal: Institutional Sediment and the Charter Function of Myth**

  **Project Lead:** [Your Name]
  **Duration:** 6 Months

  **The Precise Question**
  Standard history asks: did the Trojan War, King Arthur, or the Exodus actually happen? This project asks something different: under what conditions does a narrative stop being just a story and start functioning as a licence for collective action? I'm calling this shift 'institutional sediment'. The goal isn't to verify the past, but to pinpoint the moment a legend becomes a binding obligation—like land rights, ritual duties, or political sovereignty.

  **Why Current Methods Don't Settle It**
  Archaeology and textual criticism hit a wall here. They can tell us if a layer of ash exists at Hisarlik or if the Pentateuch has multiple authors, but they can't explain why a 12th-century king suddenly invokes Arthur to justify a war, or why Exodus functions as law rather than folklore. The truth-value of the event doesn't determine its authority. We need a philosophical framework, not just more digging. The usual approaches treat these stories as failed history; I want to treat them as successful political technology.

  **Method**
  Over six months, I'll compare three specific reception moments where these narratives were weaponised as charters. I'm not looking at the whole history, just the tipping points:
  1.  **Trojan War:** Roman claims to Mediterranean hegemony via Aeneas (Virgil/Augustus era).
  2.  **King Arthur:** Plantagenet usage of Arthurian lineage for territorial claims in Britain (12th–13th century).
  3.  **Exodus:** The narrative as a legal charter for land possession in Second Temple Judaism.

  The work involves analysing secondary literature and key primary texts to identify the political conditions required for the 'sediment' to harden. Was it crisis? Consolidation? External threat? I want to see if the mechanism is the same across seperate political contexts.

  **Outcomes**
  **Success:** A working typology of 'charter conditions'. If we can show that these disparate myths solidify into obligations under similar political pressures, we have a new tool for philosophy of history. It moves the debate from ontology (what exists) to function (what works).
  **Failure:** If the mechanisms are too distinct (e.g., religious law vs. dynastic propaganda), the comparison breaks down. Even this is useful—it tells us where the limits of the model lie.

  **Feasibility**
  Six months is tight, so scope is key. I'm not tracing the whole reception history, just the 'tipping point' moments identified above. No new fieldwork or translations; this is conceptual synthesis. It's manageable for a single researcher, provided the workshop can help stress-test the comparisons early on. There might be a slight drift in the definiton of 'sediment' as I go, but that's part of the process.
