      *   *Vs. Missing Modality (Harnad):* Harnad argues symbols need to connect to the world (robotic grounding). This system *has* that connection. $V_{red}$ and $V_{apple}$ are grounded. The failure happens *after* grounding, during the *composition* phase. It's not about the anchor; it's about the chain.

