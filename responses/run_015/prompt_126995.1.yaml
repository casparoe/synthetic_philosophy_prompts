answer: |-
  ### Preliminary Triage: Candidate Principles

  Per your instruction, I sketched three candidates before committing. Here is the elimination log:

  1.  **The Causal History Principle:** *State at $T$ is determined solely by the sequence of causes leading up to $T$.*
      *   *Verdict:* **Rejected.** It handles Case 1 (Indeterminate) and Case 4 (Determinate) well. It fails Case 2 catastrophically. If history up to $t=1$ is identical in Cases 1 and 2, this principle forces identical verdicts. It cannot explain how a future observation ($t=2$) fixes the past without invoking backward causation or denying your Case 1 verdict.
  2.  **The Topological Limit Principle:** *State at $T$ is determined iff the state function $S(t)$ has a limit as $t \to T$.*
      *   *Verdict:* **Rejected.** It handles Case 1, 3, and 5 correctly. It fails Case 4 (Laggy Lamp). In Case 4, the *schedule* oscillates, but the *physical state* is eventually constant. Topology of the schedule ≠ Topology of the mechanism. It also struggles with Case 7 (Ganged Pair), where the disjunction is true but limits don't exist.
  3.  **The Global Grounding Principle:** *State at $T$ is determinate iff grounded by either local convergence, physical cutoff, or global consistency of the total world-description.*
      *   *Verdict:* **Selected.** This accommodates the difference between Cases 1 and 2 (total description differs), respects the physical mechanism in Case 4, and handles the logical nuance of Case 7.

  ***

  ### 1. The Principle: Global Grounding with Local Priority

  I commit to the **Principle of Global Grounding**. It treats the state at a limit time not as a function of the past alone, but as a function of the *total consistent description of the world*. Determinacy is a property of the story told, not just the switch thrown.

  **Clause 1: Local Convergence (Topological Grounding)**
  If the physical state function $S(t)$ converges to a value $L$ as $t \to T$ (i.e., $\lim_{t \to T} S(t) = L$), then $S(T) = L$.
  *   *Motivating Case:* **Case 3 (Eternal Alternator).** There is no accumulation point; the function is locally constant around every integer. The limit exists trivially.
  *   *Motivating Case:* **Case 5 (Wobble Switch).** The control variable $x(t)$ converges to 0. The rule is "On iff $x > 0$". At the limit, $x=0$, so $x \ngtr 0$. The state is **Off**. (See overturns below).

  **Clause 2: Effective Finitude (Physical Grounding)**
  If the mechanism imposes a constraint (e.g., relaxation time $\epsilon$) such that only finitely many switches in the schedule are physically effective, $S(T)$ is the state resulting from the last effective switch.
  *   *Motivating Case:* **Case 4 (Laggy Lamp).** The schedule is infinite, but the *causal impact* is finite. The story is complete regarding the mechanism.

  **Clause 3: Global Entailment (Holistic Grounding)**
  If Clauses 1 and 2 fail (i.e., local history is oscillatory and physically unconstrained), $S(T)$ is indeterminate *relative to the past*, BUT becomes determinate if the *total* world-description (including $t > T$) logically entails a specific value via persistence laws or boundary conditions.
  *   *Motivating Case:* **Case 1 vs. Case 2.** In Case 1, the description is silent on $t \ge 1$. No entailment $\to$ Indeterminate. In Case 2, the description includes "On at $t=2$" + "No intervention $(1, 2]$". Persistence laws entail $S(1) = \text{On}$. The future fixes the past not by causation, but by constraining the set of possible total worlds to those where $S(1)$ was On.

  **Clause 4: Disjunctive Grounding (Logical Grounding)**
  Logical relations between objects can be grounded even if the atomic states of the objects are not. If a structural constraint entails a disjunction ($A \lor B$) but not the disjuncts, the disjunction is determinate.
  *   *Motivating Case:* **Case 7 (Ganged Pair).** The wiring entails "Exactly One On". This is a structural fact grounded in the setup. The individual states are not grounded by the switch history.

