answer: |-
  The first pattern is best described as the claim that no amount of the mild harm could ever outweigh the severe one (Lexical Superiority), while the second is a distinct phenomenon of Convex Disutility regarding harm distribution.

  The first pattern is the **Spectrum Argument**, which forces a choice between **Intransitive Betterness** and **Lexical Superiority**. When participants accept every rung of the ladder but reject the conclusion, they are not claiming there is a blurry number (Vagueness) or no fact of the matter (Indeterminacy); they are asserting a qualitative discontinuity where quantity ceases to matter. If they believed there was a blurry number, they would admit some sufficiently large number of specks *does* outweigh torture, even if they cannot identify the threshold. By saying "no number could be enough," they commit to Lexical Superiority. The logical cost of this view is Intransitivity: if A is worse than B, and B worse than C, but A is not worse than Z, the relation "worse than" fails to transmit across the chain. This distinguishes it from **Utilitarian Aggregation**, which demands transitivity and denies lexical thresholds, and from **Vagueness**, which posits a threshold exists but is unknowable rather than non-existent.

  The second pattern is **Convex Disutility**, not the first pattern in another guise. It observes that the moral weight of harm does not scale linearly with the number of instances; one person suffering a million specks is worse than a million people suffering one speck each, even if the total count is identical. This is distinct from the first pattern because it operates within a single quality of harm (specks) rather than across different qualities (specks vs. torture). It reflects the **Non-Linearity of Pain**, where intensity compounds suffering disproportionately compared to mere frequency. This differs from **Pure Sum Utilitarianism**, which treats the two scenarios as morally equivalent, and from **Strict Egalitarianism**, which might prefer the spread solely to reduce inequality rather than because the total badness is lower. The boundary case for Convex Disutility is when the harm is truly negligible (zero disutility); if one speck is zero, a million specks on one person is also zero, collapsing the distinction.

  These phenomena are logically independent but psychologically reinforcing. One can believe harms aggregate linearly (rejecting Pattern 2) but still hold that torture is lexically worse than specks (accepting Pattern 1). Conversely, one can believe torture is just concentrated specks (rejecting Pattern 1) while acknowledging concentration increases badness (accepting Pattern 2). However, in discussion, Pattern 2 often sustains Pattern 1: people deny specks add up to torture because they implicitly imagine the specks distributed (Pattern 2), keeping individual burden below the threshold of significance. If forced to imagine the specks concentrated on one victim, the intuition for Lexical Superiority often weakens, suggesting the "torture" label applies once concentration hits a certain intensity.

  I would abandon the claim that these are fully distinct phenomena first. If a critic demonstrates that all perceived lexical thresholds are merely artifacts of hidden concentration assumptions—proving that any "mild" harm concentrated enough becomes "severe" harm—then Pattern 1 collapses into Pattern 2, rendering Lexical Superiority an illusion of distribution rather than a fact of value.
