      *   Contribution: $0.40$
  *   **Path B (Empirical Elimination):** If Q1 is false (Marks are coherent), Dennett still wins if the indeterminacy is real (Q2) AND no residue survives (Q3).
      *   Contribution: $(1 - 0.40) \times 0.50 \times 0.50 = 0.60 \times 0.25 = 0.15$
  *   **Total:** $0.40 + 0.15 = 0.55$

  This formula reflects the view that the internal tension of the concept (Q1) is the strongest argument for elimination, but if the concept holds together, the burden shifts to the empirical/phenomenological claims (Q2, Q3).

  ### Sensitivity Analysis

