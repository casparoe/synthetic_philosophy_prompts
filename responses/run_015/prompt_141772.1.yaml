  **MEMORANDUM**

  **TO:** Capital Projects Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Pre-Meeting Brief: Consideration of Wild Animal Suffering Metrics in Environmental Findings

  ### **Executive Summary & Bottom Line**
  **Recommendation:** The Committee should **decline** to record anticipated reductions in wild animal suffering (WAS) as a mitigation benefit or positive finding for the Satellite Engineering Campus project. We should proceed using standard ecological impact metrics (biodiversity, habitat acreage, species density).

  **Rationale:** While the ethical argument regarding WAS is intellectually rigorous, applying it as a regulatory metric introduces unquantifiable variables, conflicts with established conservation mandates, and creates inconsistent precedents regarding offsite offsets.

  **Action Item:** Vote to adopt the Environmental Assessment findings without WAS adjustments. Simultaneously, refer the proposal for "Welfare-Adjusted Habitat Units" to an ad-hoc working group (Faculty, Students, Ethics Board) for review.
  **Deadline:** Working group to report preliminary feasibility findings by **February 15**.

  ---

  ### **Background**
  The University proposes constructing a satellite engineering campus on 180 acres of owned pasture and scrubland. The Environmental Assessment (EA) identifies the site as active habitat for small rodents, ground-nesting birds, and a pair of Northern Harriers. Standard ecological review classifies the project as a net loss of habitat.

  However, a comment filed by the Student Animal-Advocacy Group, supported by informal feedback from Ecology Faculty, argues that the Committee should record the *reduction* in wild animal populations as a welfare gain. Their premise is that wild lives in this ecosystem are net negative due to high juvenile mortality (starvation, predation). Consequently, preventing these animals from existing reduces total suffering.

  Additionally, a proposed offsite wetland restoration (typically a mitigation credit) complicates this framework: if restoring habitat increases the number of animals living "net negative" lives, the restoration could theoretically be classified as a welfare *loss*.

  ### **Analysis of the Wild Animal Suffering (WAS) Argument**
  The Committee must take this argument seriously. It is not merely an objection to development, but a challenge to the ethical baseline of conservation.

  **The Strongest Case for Counting WAS Reduction:**
  1.  **Ethical Consistency:** If we accept that individual sentient welfare matters morally, then the *quality* of life matters as much as the *existence* of life. In high-mortality ecosystems (like the vole/harrier dynamic on-site), a significant majority of individuals die painfully shortly after birth.
  2.  **Logical Coherence:** If the goal of environmental policy is to minimize harm, and nature inflicts significant harm on its inhabitants, then reducing the density of that nature logically reduces that harm. To deny this is to prioritize "species integrity" over "individual experience."
  3.  **The Offset Paradox:** The student argument correctly identifies an inconsistency in our current model. We pay to restore wetlands to increase wildlife populations. If those lives are predominantly suffering, our "mitigation" is actively funding suffering. Acknowledging WAS forces us to resolve this contradiction.

  **Why the Committee Cannot Adopt This Metric for This Project:**
  1.  **Epistemic Uncertainty:** We currently lack a scientifically validated method to measure "net negative" life across species. We cannot quantify the suffering of a vole against the flourishing of a harrier. Adopting this now requires the Committee to make philosophical determinations without empirical data.
  2.  **Regulatory Misalignment:** County rules and state environmental quality acts (CEQA/NEPA equivalents) focus on *biological impact* (loss of acreage, species threat), not *welfare impact*. Deviating unilaterally creates legal vulnerability and inconsistency with peer institutions.
  3.  **The "Bulldozer" Precedent:** If we accept that destroying habitat is a welfare benefit, we open the door to arguing that *any* development is ethically preferable to preservation. This undermines the University's sustainability commitments and creates a slippery slope where we might be logically compelled to prefer paving over rewilding.

  ### **Falsifiability: Evidence That Would Change This Recommendation**
  We should remain open to future policy shifts if the following evidence becomes available:
  1.  **Sentience & Welfare Metrics:** Peer-reviewed consensus on methods to quantify suffering vs. flourishing in wild populations (e.g., physiological stress markers correlated with lifespan).
  2.  **Population Welfare Modeling:** Data demonstrating that specific habitat types (e.g., degraded scrub vs. mature forest) reliably produce net-negative welfare outcomes.
  3.  **Legal/Regulatory Shift:** If county or state guidelines begin incorporating individual animal welfare into environmental impact statements.

  ### **Next Steps**
  1.  **Immediate:** At Thursday's meeting, vote to approve the Environmental Assessment findings based on standard ecological metrics (habitat loss, species displacement) without WAS adjustments.
  2.  **Secondary:** Authorize the formation of a **Wildlife Welfare Working Group**.
      *   **Composition:** 2 Ecology Faculty, 2 Ethics/Philosophy Faculty, 2 Student Advocates, 1 Facilities Rep.
      *   **Charge:** Evaluate the feasibility and ethical implications of "Welfare-Adjusted Habitat Units" for future University land management.
      *   **Deliverable:** A white paper on whether WAS metrics can be operationalized without contradicting conservation goals.
      *   **Deadline:** February 15.

  ### **Conclusion**
  We can acknowledge the intellectual validity of the students' argument without applying it to a capital project that requires regulatory certainty. By separating the *project approval* from the *ethical inquiry*, we avoid setting a dangerous precedent while demonstrating the University's commitment to rigorous ethical engagement.

  Please review prior to Thursday's session. I am available for questions.
