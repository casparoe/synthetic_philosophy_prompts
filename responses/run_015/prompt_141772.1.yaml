prompt: |-
  so I just got out of a three-hour argument with my friend about whether habitat destruction actually reduces wild animal suffering — she's convinced most wild lives are net negative, so a meadow full of vole pups that mostly starve before winter isn't really a tragedy, and I kept saying that's just a bulldozer with a conscience. I've got a capital projects committee meeting Thursday and I need something to circulate beforehand.

  The case: the university wants to put a satellite engineering campus on 180 acres of old pasture and scrub it already owns. Our environmental assessment says it's decent habitat — lots of small rodents, ground-nesting birds, brutal juvenile mortality, plus a pair of harriers that hunt the site. A student animal-advocacy group filed a comment saying the committee should record "expected reduction in wild animal suffering" as a mitigation benefit of the project, since fewer animals living short miserable lives is a welfare gain. One of our ecology faculty floated something similar last year — she wants to score projects in "welfare-adjusted habitat units" — and there's also an offer from a landowner to fund wetland restoration offsite as an offset, which everyone assumed was an obvious win until this argument. County rules are silent on all of it.

  Draft the memo I'll send: should the committee count anticipated reductions in wild animal suffering as a benefit in its findings, and if so under what limits, or should it decline to, and why. Give me a bottom line the committee can actually act on with a concrete next step and a deadline, take the students' argument seriously instead of dismissing it, and give the strongest version of the losing side — including what evidence would make you change your mind.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is likely a member or chair of a university Capital Projects Committee. They just had a heated debate with a friend about wild animal suffering (negative utilitarianism/anti-natalist view of nature vs. conservationist view).
      *   **Situation:** The university plans to build on 180 acres of pasture/scrub. An environmental assessment shows it's habitat for rodents, birds, harriers (high mortality). A student group argues destroying this habitat reduces wild animal suffering (WAS) and should count as a *benefit*. An ecology faculty member supports a "welfare-adjusted habitat units" metric. There's an offsite wetland restoration offer (usually a win, but now complicated). County rules are silent.
      *   **Task:** Draft a memo for the committee to circulate before the Thursday meeting.
      *   **Key Requirements:**
          *   Address whether anticipated reductions in WAS should count as a benefit.
          *   Provide a bottom line/actionable next step with a deadline.
          *   Take the students' argument seriously (no dismissal).
          *   Present the strongest version of the losing side (steel-manning).
          *   Include evidence that would change the mind (falsifiability).
          *   Tone: Professional, balanced, decisive, suitable for a university committee.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Count it):* Highly controversial, ethically fraught, practically impossible to measure, sets a precedent that destroying nature is good. Likely leads to reputational risk and logical slippery slopes (e.g., should we pave more?).
      *   *Option B (Decline to count it):* Aligns with standard conservation ethics, legal frameworks (ESA, NEPA, etc., usually focus on biodiversity/population health, not individual welfare), and practical feasibility.
      *   *Decision:* The recommendation should be to **decline** to count WAS reduction as a mitigation benefit, *but* to acknowledge the ethical complexity and establish a working group to study the metric proposal separately from this specific project. This respects the students' intellectual contribution without derailing the current project with unverified ethical calculus.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** Needs to be clear. "Do not count WAS reduction as a benefit for *this* project, but form a task force to evaluate the metric for future policy."
      *   **Background:** Briefly state the project, the habitat status, and the student/faculty comment regarding WAS.
      *   **Analysis of the Argument (The "Steel Man"):** This is crucial. I need to articulate *why* the students are logically consistent, even if the conclusion is uncomfortable.
          *   Premise: Many wild lives are net negative (starvation, predation, disease).
          *   Logic: Preventing existence prevents suffering.
          *   Implication: Development reduces population density, thus reducing total suffering.
          *   Strength: It challenges the assumption that "more nature = always good."
      *   **Analysis of the Counter-Argument (Why we decline):**
          *   Epistemic uncertainty: We can't measure "net negative" reliably.
          *   Ethical consensus: Conservation biology focuses on species/ecosystems, not individual welfare.
          *   Precedent/Risk: If we accept this, do we stop restoring habitats? Do we actively cull?
          *   Legal/Regulatory: County rules are silent, but standard practice (NEPA/CEQA) looks at *impact*, not *welfare*.
      *   **The Wetland Offset Complication:** Address the offsite restoration. If WAS is the goal, restoring wetlands might *increase* suffering. This highlights the inconsistency.
      *   **Recommendation/Action Plan:**
          *   Decision: Do not include WAS reduction in the Findings of Fact for this project.
          *   Next Step: Establish an ad-hoc committee (Ethics + Ecology + Students) to review the "Welfare-Adjusted Habitat Unit" proposal.
          *   Deadline: Report back by next semester (or specific date).
      *   **Falsifiability (Changing My Mind):** What evidence would make us accept the WAS argument?
          *   Robust data showing specific habitats are net negative.
          *   Consensus on animal sentience/suffering metrics.
          *   Legal mandate shift.

  4.  **Refining the Tone:**
      *   Avoid emotional language ("bulldozer with a conscience" is the user's phrase, not for the memo).
      *   Ensure the students feel heard ("intellectually rigorous," "challenges assumptions").
      *   Ensure the committee doesn't look like they are ignoring ethics, but rather managing scope and feasibility.
      *   *Self-Correction on Tone:* Make sure it doesn't sound like a bureaucratic brush-off. The "Task Force" idea is a good way to validate the idea without applying it prematurely.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be specific. "Consideration of Wild Animal Suffering Metrics in Environmental Assessment."
      *   *The "Steel Man":* Use terms like "Negative Utilitarianism" or "Wild Animal Suffering (WAS) framework." Acknowledge the harrier/voles dynamic specifically.
      *   *The "Why No":* Focus on *measurability* and *mandate*. The committee's mandate is likely compliance and feasibility, not moral philosophy arbitration.
      *   *The "Offsite Offset":* This is a key logical trap. If we accept WAS, the wetland restoration might be *harmful*. This proves the metric is too disruptive for current policy.
      *   *Action Item:* Vote on the finding. Establish the working group.

  6.  **Final Review against Constraints:**
      *   Bottom line actionable? Yes.
      *   Concrete next step/deadline? Yes.
      *   Take students seriously? Yes.
      *   Strongest version of losing side? Yes (the logic is sound even if the policy is rejected).
      *   Evidence to change mind? Yes.

  7.  **Final Polish:** Check for clarity, brevity, and professional formatting. (Ensure the distinction between *individual welfare* and *ecological health* is clear).

  *(Self-Correction during drafting)*: I initially thought about suggesting a pilot study. No, that's too risky for a capital project. Better to separate the *policy question* from the *project approval*. The project proceeds under standard guidelines; the policy gets studied.

  *(Refining the "Changing Mind" section)*: Make sure it's not just "better data," but specific types of data (sentience thresholds, population welfare modeling).

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
