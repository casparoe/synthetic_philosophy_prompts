      *   *Settling:* The case of **"Tragic Choices"** where *any* choice involves a moral wrong (not just a loss). If Marcus admits some choices leave a "stain," he concedes. If Lena admits the agent isn't *blameworthy*, she concedes Marcus's point about culpability.
      *   *Better Settling:* The distinction between **Blame** and **Residue.**

      *Let's finalize the ratings.*
