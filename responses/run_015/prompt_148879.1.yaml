          3.  Marcus (Residue = Psych): *Mistaken.* Ignores normative significance of emotions.
          4.  Lena (Physician): *Right.* Good intuition pump for pluralism.
          5.  Marcus (Override): *Partially Right.* Logically consistent but phenomenologically reductive.
          6.  Lena (Specific Regret): *Clearly Right.* Distinguishes agent-regret from spectator sadness.
      *   *Overall:* Lena is more right about *practical reason*; Marcus is more right about *deontic logic*. But since the seminar is on practical reason, Lena wins.
      *   *Missing:* The distinction between *culpability* and *moral cost*. Also, the nature of *phronesis* (non-algorithmic judgment).
      *   *Settling:* The distinction between **Guilt** (implies wrongdoing) and **Agent-Regret** (implies involvement in moral loss). Or the **Justification vs. Exoneration** distinction. Let's go with **Justification vs. Exoneration** or **Ought (All-Things-Considered) vs. Ought (Prima Facie)** but深化 (deepen) it to **Normative Force vs. Action-Guidingness**. Actually, the prompt hints at "Normative conflict vs logical contradiction." I should use that.
      *   *Refined Settling Concept:* **The distinction between 'Ought' as a verdict on action vs. 'Ought' as a claim on the agent.**

      *Wait, let's look closer at the prompt's hint:* "perhaps something about the distinction between normative conflict and logical contradiction, or about whether practical wisdom can operate without commensuration."
