      *   *Settling:* The distinction between **Guilt** (appropriate for wrongdoing) and **Agent-Regret** (appropriate for tragic choice). This shows Marcus is right about culpability (no guilt) but Lena is right about normativity (regret remains).

  7.  **Review against Constraints:**
