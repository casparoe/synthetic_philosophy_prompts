prompt: |-
  Hey, I'm a novelist working on a book about a fictional historian who's kind of obsessed with Leopold von Ranke, and I need some help understanding a passage I want her to read in the story. I'm working from the German original because I want the scene to feel authentic, but my German is rusty and the philosophy is making my head spin (its been a while since I took a theory class lol). I thoght Ranke's whole reputation was that history should just show the past as it actually was — you know, the famous wie es eigentlich gewesen slogan, without all the moralizing. But then I found this bit from his lectures, and it's confusing me:

  "[...] wir haben über Irrtum und Wahrheit schlechthin nicht zu urteilen. Es erhebt sich uns Gestalt um Gestalt, Leben um Leben, Wirkung und Gegenwirkung. Unsere Aufgabe ist, sie bis auf den Grund ihrer Existenz zu durchdringen und mit völliger Objektivität darzustellen."

  (I got this from the Vorlesungsanleitungen in the 1975 edition of his Idea of Universal History, if that helps.)

  So, can you help me understand what he's actually saying here? I'm stuck on a few things. First, if the historian's job is to penetrate forms of life to the ground of their existence with complete objectivity, but also not to judge truth and error at all, does that mean Ranke thinks the historian somehow doesn't have to decide what's factually true? That seems weird for a guy who's supposed to be the father of rigorous source-based history. What's the connection between refusing to judge truth and error and the Gestalt um Gestalt, Leben um Leben bit? Is it like he wants to intuitively grasp the inner shape of an epoch rather than just check facts?

  Second, and this is the part I really need for my novel's argument: later on, people like E.H. Carr and Hayden White totally rejected this kind of objectivity. Carr basically said historical facts don't speak for themselves; they only become historical facts when the historian selects them, so all history is interpretation. White said histories are shaped by literary emplotment and tropes, so they can't be neutral pictures of the past. If my historian character is reading this Ranke passage and really believes it, what would a Carr-style or White-style skeptic say to shoot her down? I don't want any bibliography or citations, and please don't give me a reading list — I just need to understand the philosophical clash so my character can argue about it convincingly. Explain what Ranke means in the passage, and then how exactly the Carr/White skepticism is supposed to undercut his claim to complete objectivity, especially this idea of not judging truth and error. Also, feel free to tell me if I'm misreading the German. Thanks!
reasoning: |-
