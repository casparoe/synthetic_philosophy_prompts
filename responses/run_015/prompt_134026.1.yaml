prompt: |-
  I'm in this very loose reading group — me, a physics PhD who is skeptical about everything, and a philosophy grad student — and last week we got completely stuck on a section from Hofstadter (I think it's in one of his essay collections, maybe Metamagical Themas, the bit about the careenium and the simmballs), and before we argue about the anwser I want to get clear on what we're even asking. The setup as I took it: you've got this weird material made of "simmballs" — symbol-balls — and whatever happens in it can be described either at the level of individual balls shoving each other around, or at the level of the symbols and what they mean, and the question is who shoves whom. If a lump of careenium is running something that amounts to a decision, does the symbol-level story (that it decided X, that it believed Y, that a certain pattern meant Z) do any of the real causal work, or is it substrate all the way down and the symbol talk just a convenient gloss? Our physicist says gloss, end of story; I'm not so sure.

  So instead of settling it, write me the spec: what would a theory of symbol-level versus substrate-level causation have to deliver to count as adequate? I want the desiderata with the case or consideration behind each one, and I want you to mark which are non-negotiable and which are just one camp's prejudices. Some things I think belong on the list, but you tell me which are genuine requirements: it has to handle the mundane cases (a thermostat's set point, a chess program playing as if there were a threat on the board, an ant colony's trail, a virus's "fitness"); it has to say something about misrepresentation, where a symbol-level state that's about something that isn't actually the case seems to cause behavior anyway; it has to respect whatever physics really forces on us (causal closure — every physical event has a sufficient physical story in its physical past); it has to keep mere bookkeeping apart from real leverage (my own labels: "shadow relevance", where the symbol fact is entailed by the substrate story and tracks it but changes nothing, versus "leverage", where the symbol-level description constrains what the substrate does next); and it has to have a view about a case I made up — the fine-grained swap, where you take one lump running a prime-number routine and rewire it a few simmballs at a time into a lump running a weather simulation, so the symbol-level description is crisp at both ends and mushy in the middle. Does causation fade out gradually there, and what would that even mean?

  Then the part I actually care about: flag any pair of desiderata you suspect can't be jointly satisfied, because if the list itself is inconsistent that's a result and I'd rather know now. My guess is that "respect the causal closure of the physical" and "let symbol-level facts do explanatory work that couldn't in principle be done at the substrate level" are quietly at war, but maybe there's a reading that saves both. Also tell me which single requirement excludes the most candidates, and whether anything on my list is really a preference dressed up as a constraint. Then a very short scorecard, two lines each at most, for: straight reductionism or identity, functionalism with substrate-independence, non-reductive physicalism with downward causation, and eliminativism about the symbol level. Please write it in American English, and no reading lists, citations or bibliographies — we're doing this from one dogeared paperback with no library access, so anything that needs looking up is useless to us.
