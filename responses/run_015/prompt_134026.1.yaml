answer: |-
  Here is the spec for a theory of symbol-level versus substrate-level causation, drafted to break the stalemate between your physicist and the philosophy grad student.

  ### The Spec: Desiderata for Symbol Causation

  **1. Physical Causal Closure**
  *   **The Requirement:** Every physical event (simmball movement) must have a sufficient physical cause within the physical history of the system. No magic sparks jump from the "meaning" to the "matter."
  *   **The Case:** Your physicist's底线 (bottom line). If this fails, physics is incomplete, and we're doing theology, not natural science.
  *   **Status:** **Non-negotiable** for any naturalistic theory.

  **2. Explanatory Autonomy (The "Leverage" Condition)**
  *   **The Requirement:** The symbol-level story must do explanatory work that cannot be practically or principledy done by the substrate story alone. It must constrain future states in a way the substrate description misses.
  *   **The Case:** Your intuition that "it decided X" explains the output better than "ball 42 hit ball 43." If the symbol level is just a shadow, it's useless bookkeeping.
  *   **Status:** **One Camp's Prejudice.** The physicist accepts "Shadow Relevance"; you demand "Leverage." This is the core metaphysical disagreement.

  **3. Misrepresentation Handling**
  *   **The Requirement:** The theory must explain how a symbol state can be *about* something false (e.g., believing there is a threat on the chessboard when there isn't) and still cause physical behavior.
  *   **The Case:** Substrate physics only sees shapes, not truth. If causation depends on meaning, false meaning shouldn't work, but it does.
  *   **Status:** **Non-negotiable** for any theory claiming symbols are real.

  **4. Shadow vs. Leverage Distinction**
  *   **The Requirement:** The theory must formally distinguish between a pattern that merely tracks the substrate (shadow) and a pattern that restricts substrate possibilities (leverage).
  *   **The Case:** Your own label. A movie subtitle tracks the audio but doesn't change it (shadow); a thermostat setting changes the furnace state (leverage).
  *   **Status:** **Non-negotiable** for clarity, though whether symbols have leverage is the dispute.

  **5. Mundane Coverage**
  *   **The Requirement:** The theory must apply uniformly to thermostats, chess programs, ant colonies, and viral fitness without special pleading for human minds.
  *   **The Case:** If the theory only works for "high" consciousness, it's dualism in disguise. The careenium is supposed to be a general model of meaning.
  *   **Status:** **Non-negotiable** for scope.

  **6. Vagueness Coherence (The Fine-Grained Swap)**
  *   **The Requirement:** The theory must account for the transition zone where you rewire simmballs from a prime-number routine to a weather simulation.
  *   **The Case:** If causation is real, does it fade out gradually during the swap? Real causation is usually binary (it happens or it doesn't), but implementation is gradual. The theory must resolve this sorites paradox.
  *   **Status:** **Non-negotiable** for logical coherence.

  ***

  ### Conflict Analysis: The Inconsistency Check

  You guessed right: **Desideratum 1 (Closure)** and **Desideratum 2 (Leverage)** are quietly at war. This is the classic exclusion problem.

  If every physical event has a sufficient physical cause (Closure), then the symbol-level description is either:
  1.  **Identical** to the physical cause (Reductionism), in which case it adds no new causal power, only a new label.
  2.  **Distinct** from the physical cause, in which case it is causally excluded (Epiphenomenalism), because the physical cause already did the job.

  To satisfy both, you must argue that "causation" means something different at the two levels (e.g., physical causation is about *production*, symbol causation is about *counterfactual dependence*). If you demand that symbol-level facts do work that is *ontologically distinct* from physical work while maintaining Closure, the list is inconsistent. You can save both only by redefining "work" so that it doesn't imply competing forces.

  ***

  ### Requirement Evaluation

  **Which single requirement excludes the most candidates?**
  The combination of **Physical Causal Closure** plus **Explanatory Autonomy (Leverage)**. Most theories sacrifice one to save the other. Eliminativists drop Autonomy; Dualists drop Closure. Only Non-Reductive Physicalists try to hold both, and they struggle to explain how without contradiction.

  **Which is a preference dressed up as a constraint?**
  **Explanatory Autonomy (Leverage).** This is a metaphysical preference for realism about higher-level patterns. A consistent physicist can argue that "Shadow Relevance" is all that exists and that our feeling of "Leverage" is a cognitive illusion caused by our inability to track simmballs. Demanding real leverage is insisting that our useful descriptions map onto distinct ontological forces, which is not forced by the data.

  ***

  ### Scorecard

  **Straight Reductionism or Identity**
  Saves Closure by making symbols identical to physical patterns. Kills Autonomy; the symbol story is just a shorthand for the physics, no real leverage.

  **Functionalism with Substrate-Independence**
  Saves Autonomy by defining symbols as roles realizable in any stuff. Risks violating Closure if the role itself is seen as a cause distinct from the realizer.

  **Non-Reductive Physicalism with Downward Causation**
  Attempts to hold both Closure and Leverage. Often accused of double-counting causes unless "downward" is carefully defined as constraint, not force.

  **Eliminativism about the Symbol Level**
  Saves Closure and coherence by denying symbols exist. Solves the swap problem by saying nothing causal fades because nothing causal was there but balls.
