answer: |-
  Good morning. Welcome to "Deep Time and Policy."

  Look around this room. We have a gathering that is, by design, uncomfortable. On one side, we have colleagues who study the world in centuries. You track the slow drift of coastlines, the formation of soil, the rise and fall of empires that outlasted the leaders who claimed to build them. You are accustomed to a timeline where a human life is a data point, not a unit of measure.

  On the other side, we have those who measure the world in weeks. You operate in the rhythm of election cycles, budget quarters, and emergency response windows. When a hurricane makes landfall or a heat wave spikes mortality rates, you are the ones who must move. You do not have the luxury of waiting for the century to turn. Your work is defined by the immediate, the urgent, and the tangible.

  Usually, these two groups do not share a table. The historians view the policymakers as myopic, trapped in a tyranny of the present. The policymakers view the historians as abstract, detached from the bleeding edge of crisis. This symposium exists because both views are correct, and both are insufficient on their own.

  We are here to confront a specific failure in how we govern the climate. Currently, our policy framework is almost entirely event-driven. We treat climate change as a sequence of discrete catastrophes: a fire here, a flood there, a summit in Geneva. We respond to the spike in the graph, not the slope of the line. We treat the atmosphere like a political opponent that can be negotiated with during business hours, rather than a physical system that operates on a clock we did not build and cannot reset.

  When we frame climate change chiefly as a series of emergencies, we systematically misplace the scale at which durable solutions become conceivable. An emergency implies a return to normalcy once the threat passes. But there is no "normal" to return to. The baseline has shifted. The ground beneath our feet—literally and metaphorically—is moving slower than our news cycles, but with far more consequence.

  To understand this tension, I want to offer an analogy. Imagine you are tasked with renovating a historic building that is also your only shelter. You have a hammer and a list of repairs. The roof is leaking, the windows are broken, and the tenants are cold. This is your event horizon. These are the crises that demand immediate action. If you do not fix the leak today, the furniture is ruined. If you do not fix the window, the tenants freeze.

  However, beneath the plaster and paint, there are load-bearing walls and a foundation settled into the bedrock. These structures were laid down long before you arrived. They determine the shape of the rooms, the flow of electricity, and the maximum weight the building can hold. You cannot vote on whether gravity applies to the foundation. You cannot hold a town hall to convince the load-bearing wall to move three feet to the left.

  If you focus only on the leaks and the windows—the events—you will keep busy forever. You will be a heroic manager of decay. But if you attempt to knock down a load-bearing wall because it conflicts with your new floor plan, the roof will collapse on everyone inside.

  This is the condition of our governance. We are trying to rearrange the furniture of our economy while ignoring the load-bearing walls of geography and carbon cycles. The deep structures of the planet—the acidity of the oceans, the stability of the permafrost, the thermal inertia of the atmosphere—constrain our agency just as rigidly as stone constrains an architect. We can act quickly, but we cannot act freely. Our rapid interventions are bounded by slow realities.

  Does this mean we stop fixing the leaks? Absolutely not. To suggest that we should ignore the immediate suffering of communities facing flood or drought because "deep time is more important" is morally bankrupt. The leak is real. The cold is real. The urgency of the event carries a moral weight that the slow structure does not.

  But it does mean we must stop pretending that patching the leak is the same as fixing the building. Event-driven governance treats the symptoms; deep-time policy must treat the anatomy. We need policies that are robust enough to survive the next election cycle but flexible enough to adapt to the next century. We need to stop asking how we can recover from the last disaster, and start asking what kind of structures allow us to live safely in a world where disasters are the baseline.

  For the historians and geographers in this room: your task is to translate the slow violence of structural change into language that demands immediate action. Do not hide behind the comfort of the archive.

  For the policymakers and organizers: your task is to demand solutions that outlast your tenure. Do not settle for fixes that expire when the news cycle turns.

  We are here to bridge the gap between the time of the headline and the time of the bedrock. If we succeed, we might just build a shelter that holds. If we fail, we will remain excellent managers of a collapse we saw coming.

  Let's get to work.
