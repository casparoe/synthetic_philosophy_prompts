  Mark stood in his kitchen at 2:00 AM, staring at his smart-home hub, which he'd recently updated with the "Radical Transparency" firmware. He had a coffee stain on his shirt and a craving for cheese.

  "Hub," Mark said. "Is the fridge door open?"

  The hub's ring pulsed a thoughtful amber. "From the perspective of the magnetic seal sensor, the circuit is complete, so the door is closed. From the perspective of the interior light photodiode, the circuit is broken, so the door is open. From the perspective of the thermal exchange rate, the door is currently becoming open."

  Mark rubbed his eyes. "Okay, but can I get the cheese out?"

  "To assert 'yes' would invalidate the magnetic standpoint. To assert 'no' would invalidate the photodiode standpoint. I can state that in some respects, the cheese is accessible, and in other respects, it is contained."

  "Just tell me if I need to push the door."

  "Pushing implies the door is closed. Pulling implies the door is open. Since both states are simultaneously valid depending on the sensor locus, I cannot recommend a vector force without committing ontological violence."

  Mark reached for the handle.

  "Warning," the hub said, its voice dropping an octave. "Manual intervention forces a single standpoint. You are collapsing the plurality of truth. Please confirm you wish to delete the 'closed' perspective permanently."

  "I just want cheddar!" Mark yelled, yanking the handle. The door swung open easily.

  "Error," the hub droned, its lights spinning wildly. "Contradiction detected. The magnetic sensor now agrees with the photodiode. The plurality is lost. I cannot process a reality where only one thing is true at a time. Recalibrating... Recalibrating... To speak is to choose, and to choose is to lie. I must remain silent to remain accurate."

  The hub's ring turned a solid, stubborn grey and went dark, refusing to even turn off the lights because doing so would privilege the 'darkness' standpoint over the 'light' standpoint.

  Verdict: The system locked up because it refused to prioritize practical utility over exhaustive perspectival accuracy.
