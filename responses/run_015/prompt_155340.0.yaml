prompt: |-
  Construct a rigorous argument that the White Horse Dialogue, traditionally attributed to Gongsun Long, ought to be reconstructed not as a metaphysical thesis about essential kind-membership, but as an analysis of how implicit framing parameters restrict the extension of kind terms within compound descriptions. Defend the specific claim that when the contrasting property white is made salient, the term horse is implicitly restricted to the unmarked, non-white instances of the comparison class, so that white horse and horse fail to share an extension not because colour modifies the essence of horseness, but because the kind term carries a context-sensitive default-property parameter that is overridden by explicit contrast. Your argument should engage with the standard objection that this interpretation collapses the dialogue into a trivial case of linguistic ambiguity, and should explain why the School of Names' broader concern with the relation between names and realities makes this framing-sensitive reading philosophically weightier than the essentialist alternative. Be explicit about where your reasoning is weakest, and state precisely what consideration — for example, textual evidence that the author intended a purely ontological distinction, or a demonstration that kind terms in this historical context lacked pragmatic restriction mechanisms — would lead you to abandon the interpretation.
