answer: |-
  **Title:** The Poison is in the Pour, Not the Pitcher: A Defense of Pragmatic Accounts of Slurring Terms

  **Abstract:** *The debate over the locus of derogatory force in slurring terms—whether semantic (encoded in meaning) or pragmatic (derived from use)—is one of the most contentious in the philosophy of language. While the semantic account offers intuitive stability, it fails to account for the phenomenon of reappropriation. This essay argues that the derogatory force of a slur is fundamentally pragmatic. By locating the harm in the act of usage and historical context rather than truth-conditional content, we preserve the agency of targeted groups to alter the linguistic landscape.*

  ***

  In the halls of linguistics departments, few topics generate as much heat as the semantics of slurs. The central question is deceptively simple: Is a slur offensive because of what it *means*, or because of how it is *used*? On one side stand the Semanticists, who argue that the derogatory content is baked into the word's definition, inseparable from its reference. On the other stand the Pragmatists, who argue that the word refers neutrally, but its usage invokes a history of subordination and violence.

  For the novelist seeking to depict this debate authentically, the stakes are not merely academic; they are moral. If the hate is semantic, the word is a cursed object, toxic to the touch regardless of who holds it. If the hate is pragmatic, the word is a weapon, defined by the hand that wields it and the intent behind the swing. While the Semanticist view aligns with our immediate intuition that some words are simply "bad," a rigorous analysis reveals it to be linguistically brittle. The Pragmatic account is superior. It is the only framework robust enough to explain the complex reality of language, specifically the phenomenon of reappropriation, where in-group members use slurs without derogatory intent.

  ### The Semanticist Intuition

  The Semanticist position is attractive because it mirrors the phenomenological experience of hearing a slur. When an outsider uses a racial epithet, the offense feels instantaneous, automatic, and context-independent. Semanticists, such as Christopher Hom or Robert Hornsby, argue that slurs carry a specific expressive content. To call someone a [slur] is not merely to identify them as a member of a group; it is to predicate a negative moral or social status upon them as part of the truth conditions of the sentence.

  In this view, the sentence "X is a [slur]" is truth-conditionally equivalent to "X is a member of Group Y and X is despicable because of it." The offensiveness is not an added layer; it is the foundation. This explains why quoting a slur in an academic setting often still causes discomfort. If the poison is in the meaning, merely uttering the phonemes activates the toxic concept, regardless of the speaker's intent. It treats the slur as a linguistic landmine: step on it, and it explodes, no matter why you stepped there.

  However, this stability comes at a high theoretical cost. By hard-coding the derogation into the semantics, the Semanticist renders the word immutable. If the meaning of the word *is* "inferior member of group Y," then any use of the word asserts inferiority. This leads directly to the wall where Semanticism crashes: reappropriation.

  ### The Reappropriation Problem

  Reappropriation occurs when members of a targeted group adopt the slur used against them, stripping it of its derogatory force and repurposing it as a term of solidarity or identity. Consider the use of the N-word within Black communities, or "queer" within the LGBTQ+ community (historically a slur, now a standard identifier).

  For the Semanticist, this is a nightmare scenario. If the semantic content of the slur includes "despicable," then when an in-group member uses it to refer to a friend, they are literally asserting their friend is despicable. To maintain their theory, Semanticists must argue that the in-group version of the word is actually a *different word*—a homonym that sounds the same but has a different entry in the mental lexicon.

  This is linguistically ad hoc. It suggests that the phonemes remain the same, the reference remains the same, but the "toxic" part of the meaning magically vanishes solely based on the identity of the speaker. This requires a convoluted mechanism where the dictionary entry changes based on the speaker's DNA or social standing. It strips the speakers of agency. It implies that the targeted group cannot change the meaning of the word; they can only create a new, separate word to bypass the old one. It treats language as a static cage rather than a dynamic tool.

  ### The Pragmatic Alternative

  The Pragmatic account, championed by philosophers like Elisabeth Camp and Jennifer Hornsby (in her later work), locates the derogatory force not in the *content* of the word, but in the *illocutionary force* of the act. In this view, the slur refers to the same group as the neutral counterpart (e.g., [slur] and "Group Y member" refer to the same set of people). The difference lies in the presuppositions and the historical weight carried by the usage.

  When an outsider uses the slur, they are invoking a history of violence, segregation, and dehumanization. They are signaling alignment with that history. The offense is not in the proposition expressed ("This person is in Group Y"), but in the demonstration of a perspective that views Group Y as subordinate. The slur is a signal of affiliation with a hateful ideology.

  This framework handles reappropriation with elegance. When an in-group member uses the term, they are not invoking the history of subordination; they are invoking a shared experience of resilience. They are changing the *use*, and because the force is pragmatic (based on use), the meaning shifts accordingly. The word does not need to be a different lexical entry. It is the same tool, picked up from the enemy and wielded in defense. The Pragmatic account recognizes that language is a social contract, and the terms of that contract can be renegotiated by the parties involved.

  ### The Verdict: Agency Over Essence

  We must reject the Semanticist account because it reifies hate. By claiming the derogation is baked into the meaning, Semanticism suggests that the power to harm lies within the word itself, independent of human actors. This is a form of linguistic mysticism. Words do not have magic; they have history.

  The Pragmatic account is the only verdict that aligns with the reality of social power. It acknowledges that while the historical weight of a slur makes it incredibly difficult to use neutrally (explaining why academic quoting remains fraught), it is not impossible. The "toxicity" is a social residue, not a chemical property of the sound.

  This distinction is vital for understanding how language evolves. If we accept the Semanticist view, we must conclude that slurs are eternally fixed in their hatred, and the only solution is total prohibition. If we accept the Pragmatic view, we acknowledge that while the burden of proof is incredibly high, the meaning of language is ultimately determined by the community of speakers. Reappropriation is not an exception to the rule; it is the proof that the rule is pragmatic.

  For the novelist, this offers a richer dramatic landscape. A Semanticist character in your department would argue from a place of rigid structuralism, perhaps fearful of the contaminating power of language, believing that to speak the word is to commit the violence. A Pragmatist character would argue from a place of sociolinguistic realism, believing that context is king and that the community has the right to redefine the tools used against them.

  The verdict is clear: The derogatory force of a slur is pragmatic. It resides in the history of the usage, the power dynamics of the speakers, and the intent of the utterance. To argue otherwise is to grant the oppressor permanent ownership of the lexicon. Language is a living thing, and its capacity to heal is just as real as its capacity to harm, but only if we admit that the power lies with us, not the words.
