      *   *Rank 2 (Self-Knowledge):* Benacerraf. Can a system output its own code? Research task: Fixed-point theorems in epistemic logic.
      *   *Rank 3 (Probabilistic/Neural):* Moving beyond soundness. Research task: Gödelian limits on learning theory (e.g., no free lunch theorems vs. incompleteness).
      *   *The LLM Verdict:* It's a distraction *unless* framed as probabilistic reasoning.
