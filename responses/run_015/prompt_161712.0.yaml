      *   **Audience:** Mixed engagement (1/3 there for snacks/games), no formal notation, no money (candy/points okay).
      *   **Core Problem:** The tension between *Closure under Entailment* (if you believe $P$, and $P \to Q$, you believe $Q$) and *Logical Omniscience* (you can't know all consequences immediately). Specifically regarding the Hex strategy-stealing argument (Draw impossible $\to$ P1 wins, but we don't *know* P1 wins).
      *   **Goal:** An activity where students *experience* the squeeze, not just hear a lecture. They need to feel the cost of inconsistent beliefs.
      *   **Requirements:** Rules, materials, scoring (candy/points), timeline, facilitation guide, debrief mapping game to philosophy, troubleshooting (what goes wrong), and the "missing piece" the facilitator must explain.
      *   **Constraint:** Do not name the philosophical problem until the end. Avoid "humans are dumb" conclusion; focus on *ideal* rationality vs. *bounded* rationality.
      *   **Special Condition:** Must work even if half the room is the "snack crowd" (low engagement/low math depth).

  2.  **Deconstruct the Philosophical Tension:**
      *   *Principle A (Closure):* If I believe $A$, and I accept $A \implies B$, I ought to believe $B$.
      *   *Principle B (Boundedness):* I am not blameworthy for not believing $B$ if I haven't figured out the implication yet.
      *   *The Hex Case:* Everyone believes "No Draws." Everyone accepts "No Draws $\implies$ First Player Win" (once explained). But no one believes "First Player Win" (because they haven't found the strategy).
      *   *The Lesson:* Logic defines what a *perfect* mind believes. Real minds have computational limits. The "problem" arises when we confuse real minds with perfect minds.

  3.  **Brainstorming Game Mechanics:**
