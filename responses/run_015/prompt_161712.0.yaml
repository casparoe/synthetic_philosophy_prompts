      *   *Idea 2: Hidden Information.* Players have cards that imply other cards. They need to trade or bet. *Problem:* Hard to manage in 40 mins with late arrivals.
      *   *Idea 3: The "Oracle" Game.* Players make claims. An "Oracle" (the teacher) reveals consequences. If their claims contradict the Oracle, they lose candy. *Problem:* Puts teacher in too much authority, reduces peer interaction.
