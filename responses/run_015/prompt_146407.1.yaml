answer: |-
  # Activity Design: The Gravity Well Protocol

  **Setting:** Seminar room with two large tables.
  **Participants:** 10 Graduate Students (divided into 2 groups of 5).
  **Time Allocation:** 90 Minutes total.
  **Learning Outcome:** Participants will operationalize the "center of narrative gravity" model by attempting to maintain identity criteria solely through textual coherence, experiencing the failure of substrate-based intuition when no physical "owner" is present in the data.

  ## I. Preparation & Materials
  *   **Card Decks:** Two identical decks of 30 "Life-Fragment Cards" per group. Cards contain first-person statements without proper nouns (e.g., *"I recall burning my hand on a stove at age six,"* *"I feel a sharp pain in my lower back,"* *"I believe justice requires equality,"* *"I prefer silence to noise"*).
  *   **Tracking Sheets:** Paper for drafting biographies and recording votes.
  *   **The Stake:** The group that maintains the most logically consistent justification for identity persistence across all rounds wins **priority choice of the opening prompt for next week's seminar.**

  ## II. Group Roles (Assigned within each group of 5)
  1.  **Archivist:** Holds the cards; only person allowed to physically move/swaps cards.
  2.  **Narrator:** Synthesizes cards into a coherent biographical paragraph.
  3.  **Advocate:** Argues that the "Self" persists during disruptions.
  4.  **Skeptic:** Argues that the "Self" has broken or died during disruptions.
  5.  **Registrar:** Records the group's final vote and the *single sentence justification* required for voting.

  ## III. Activity Rules (The "Substrate Ban")
  1.  **No Ownership:** You cannot appeal to a brain, a soul, a body, or a "consciousness owner." The only data that exists are the cards.
  2.  **Coherence Criterion:** A "Self" exists only if the cards can be woven into a single, non-contradictory narrative thread.
  3.  **Voting:** After every round, groups must vote: **PERSIST** or **CEASE**.
  4.  **Penalty:** Any justification using words like "he," "she," or "they" as an underlying owner (rather than a grammatical placeholder) results in the loss of one card.

  ## IV. Procedure (50 Minutes)

  **Round 1: Construction (10 mins)**
  *   Groups receive 20 cards.
  *   **Task:** Construct "Subject Alpha." Arrange cards into a timeline. Write a 5-sentence biography.
  *   **Vote:** Does Subject Alpha exist? (Expected: Yes).
  *   **Goal:** Establish the baseline intuition that a collection of memories equals a person.

  **Round 2: The Merge (10 mins)**
  *   **Disruption:** Groups swap 5 cards randomly with the other group.
  *   **Task:** Integrate the foreign cards into Subject Alpha's narrative.
  *   **Conflict:** Some cards may contradict (e.g., Group A has *"I am an only child,"* Group B receives *"I recall playing with my brother"*).
  *   **Vote:** Did Subject Alpha survive the intrusion? Or is this Subject Gamma?
  *   **Constraint:** You cannot say "the brain rejected the memory." You must say "the narrative became incoherent."

  **Round 3: The Fission (10 mins)**
  *   **Disruption:** The Facilitator announces a split. Each group takes the *original* 20 cards but must diverge the future. Group A adds 5 cards indicating "Career in Art." Group B adds 5 cards indicating "Career in Finance." Both claim to be the continuation of Subject Alpha.
  *   **Task:** Determine if Alpha is dead, or if Alpha is now two people.
  *   **Vote:** Is there one Self, two Selves, or zero Selves?
  *   **Goal:** Force the realization that identity is not a conserved quantity like mass; it is a judgment call based on story continuity.

  **Round 4: The Erosion (10 mins)**
  *   **Disruption:** The Facilitator removes 1 card every 60 seconds from the table.
  *   **Task:** Maintain the narrative of Subject Alpha as the data vanishes.
  *   **Vote:** At exactly what card count did Subject Alpha cease to exist? (Groups must agree on a specific number, e.g., "At 4 cards, the story was too thin to hold a self.")
  *   **Goal:** Demonstrate the Sorites paradox of identity; there is no "last card" that holds the self, proving the self is a gradient of coherence, not a substance.

  **Final Tally (10 mins)**
  *   Registrars compare justifications.
  *   Facilitator judges which group adhered strictly to the "Substrate Ban" while maintaining the highest narrative coherence.
  *   Winner announced (Stake awarded).

  ## V. Debrief & Mapping (40 Minutes)

  ### 1. Mapping the Rounds (10 mins)
  Do not lecture. Ask the Registrars to read their justification sentences from Round 4. Write them on the board.
  *   **Ask:** "In Round 1, what did the cards represent?" (Answer: Experiences/Memories).
  *   **Ask:** "In Round 1, what did the Biography represent?" (Answer: The Self).
  *   **Point:** The cards are the *substrate* (events/neural states). The Biography is the *narrative gravity*. When the biography broke (Round 2 & 3), the self broke, even though the cards (physical data) still existed. There was no "Subject Alpha" card. Alpha was the *shape* of the arrangement, not the cards themselves.

  ### 2. Anticipating & Addressing Resistance (15 mins)
  **The Resistance:** Students will inevitably argue, "But someone *had* to experience these cards. There must be a hidden viewer behind the eyes." This is the intuition of the Cartesian Ego.
  **The Counter-Maneuver:** Do not argue metaphysics. Use the game mechanics against them.
  *   **Facilitator Script:** "During the game, I penalized you for using owner-language. Why?"
  *   **Student Response:** "Because the rules said only cards exist."
  *   **Facilitator Follow-up:** "Correct. In this room, the 'owner' was a forbidden entity. Yet you successfully coordinated, voted, and argued about 'Alpha.' You treated Alpha as real without an owner. If you can simulate a self without an owner in this room for 50 minutes, what work is the 'hidden viewer' doing in your theory? Is it a necessary component, or just a habit of speech?"
  *   **Goal:** Shift the burden of proof. The activity proved a self *functions* without a substance. The resistance is an emotional attachment to the "owner" concept, not a logical necessity demonstrated by the data.

  ### 3. The Phenomenological Gap (10 mins)
  **Frank Admission:** The facilitator must explicitly state what the activity failed to capture.
  *   **Statement:** "This activity treated the self as a third-person object (cards on a table). It successfully showed that the *structure* of selfhood is narrative. However, it cannot reproduce the *first-person feeling* of unity. You do not *feel* like a scattered deck of cards; you feel like a unified point of view."
  *   **Explanation:** "The 'Center of Narrative Gravity' theory does not deny the *feeling* of self. It denies that the feeling corresponds to a *thing*. The activity showed you the machinery; it could not make you feel the illusion. You must trust that the 'gravity' feels real to the objects caught in it, even if the center is empty."

  ### 4. Closing Synthesis (5 mins)
  *   Ask each student to state one sentence on how their definition of "I" has shifted.
  *   Collect the cards.
  *   Remind the winning group of their stake for next week.

  ## VI. Facilitator Notes on Constraints
  *   **Enforcing the Ban:** If a student says, "But *he* wouldn't want that," interrupt immediately. Ask: "Which card says 'he' exists?" Make them rewrite the justification. This friction is where the learning happens.
  *   **Managing Time:** Use a visible timer. The pressure of the timer mimics the cognitive load of maintaining identity.
  *   **Handling Disagreement:** If groups cannot agree on a vote in Round 3 (Fission), that is a success. It demonstrates that identity is indeterminate without a substantive fact of the matter. Highlight this indeterminacy during the debrief.
