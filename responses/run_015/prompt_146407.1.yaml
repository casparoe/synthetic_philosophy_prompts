      *   *Voting rule?* Narrative coherence only.
      *   *Debrief mapping?* Yes.
      *   *Anticipate resistance?* Yes (the "owner" intuition).
      *   *Address resistance?* Socratic questioning during debrief.
      *   *Phenomenology gap?* Yes (the feeling of unity).
      *   *No bibliography?* Check.

  8.  **Self-Correction/Polishing:**
