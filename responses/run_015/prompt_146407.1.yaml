      *   "Center of Narrative Gravity" (Dennett): The self is a fictional abstraction, like a center of gravity in physics. It's useful for prediction and coordination, but there's no "thing" there. It emerges from the stories we tell about ourselves.
      *   Substantive Entity (Cartesian Ego/Homunculus): The idea that there is a "real me" inside the head owning the experiences.
      *   The Activity needs to simulate the *construction* of identity without a *substrate*.

  3.  **Design the Activity ("The Archivist's Dilemma"):**
      *   **Setting:** Seminar room, tables arranged for 5 groups of 2, or 2 groups of 5? 10 students total. Small groups work best for intense discussion. Let's go with 2 groups of 5. This allows for enough diversity of interpretation but small enough for everyone to speak.
      *   **Materials:** "Life-Fragment Cards" (statements like "Recalls winning a prize at age 7," "Feels pain in left leg," "Believes in democracy," etc.).
      *   **Stakes:** What are the "small real stakes"? Maybe a prize for the most coherent narrative, or perhaps a "publication credit" simulation. Let's make it about *grant funding* simulation. The group that maintains the most coherent "Subject" across disruptions wins a tangible reward (e.g., choice of next week's topic, or actual candy/coffee). Let's go with "Priority Claim on Next Seminar's Opening Topic."
      *   **Rounds:**
          1.  *Construction:* Build a person from cards.
          2.  *Merge:* Two groups swap some cards. Is it one person or two?
          3.  *Fission:* One narrative splits into two divergent futures. Which one is the "real" continuation?
          4.  *Erosion:* Remove cards (memory loss). When does the person cease to exist?
      *   **Voting Rule:** Must vote on persistence based *only* on the story's coherence, not on "who owns the brain."

  4.  **Drafting the Activity Steps:**
      *   *Preparation:* Create cards. Neutral statements.
      *   *Round 1 (Assembly):* Groups get 20 cards. Build "Subject A." Name them. Write a 1-paragraph bio.
      *   *Round 2 (The Transplant/Merge):* Swap 30% of cards with the other group. Did Subject A survive? Did Subject B survive? Is it a new Subject C?
      *   *Round 3 (The Fission):* Take the original narrative. Split the remaining cards into two divergent paths (e.g., Card set X says "Became a monk," Card set Y says "Became a banker"). Both claim to be Subject A. Vote: Is A dead? Are there two As?
      *   *Round 4 (The Erosion):* Remove 5 cards per minute. At what point is the narrative too thin to sustain a "self"?
      *   *Constraint:* No appealing to "the brain" or "the soul." Only the text on the cards.

  5.  **Developing the Debrief:**
      *   *Mapping:* Cards = experiences/memories. Narrative = the self. No card = "owner."
      *   *Resistance:* Students will say "But *someone* experienced these cards!" or "There must be a continuous consciousness."
      *   *Addressing Resistance:* Ask them to point to the card that represents the "experiencer." They can't. The "experiencer" is a grammatical subject inferred from the cards, not a card itself.
