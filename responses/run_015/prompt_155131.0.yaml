answer: |-
  **Case Study: The Warehouse Rover (Unit 734)**

  **Scenario:** Unit 734 is a model-free TD(0) learner ($\gamma=0.9$) navigating a warehouse corridor. Three states: **Neutral** (Start), **Cue** (Yellow Light), **Aversive** (Electrostatic Bump). Rewards: $r_{Neutral}=0$, $r_{Cue}=0$, $r_{Aversive}=-10$. After extensive training, the agent has converged on the deterministic contingency: Cue always predicts Aversive.

  **Converged Value Function ($V$):**
  $V(Neutral) = 0$.
  $V(Aversive) = -10$ (immediate penalty, then reset).
  $V(Cue) = \gamma \times V(Aversive) = -9$.

  **Episode Data (Converged Policy):**

  | Timestep | Transition | Reward ($r$) | Value ($V_{next}$) | TD Error ($\delta = r + \gamma V_{next} - V_{curr}$) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ep 1: Cued + Delivered** | | | | |
  | $t=0$ | Neutral $\to$ Cue | 0 | -9 | $0 + 0.9(-9) - 0 = \mathbf{-8.1}$ |
  | $t=1$ | Cue $\to$ Aversive | -10 | 0 | $-10 + 0 - (-9) = \mathbf{-1.0}$ |
  | **Ep 2: Cued + Omitted** | | | | |
  | $t=0$ | Neutral $\to$ Cue | 0 | -9 | $0 + 0.9(-9) - 0 = \mathbf{-8.1}$ |
  | $t=1$ | Cue $\to$ Neutral | 0 | 0 | $0 + 0 - (-9) = \mathbf{+9.0}$ |

  **The Anticipation Inversion:**
  *   **Reward-as-Valence:** Valence tracks $r$. The agent is neutral at $t=0$ ($r=0$) and in a negative state at $t=1$ ($r=-10$).
  *   **RPE-as-Valence:** Valence tracks $\delta$. The agent is in a strongly negative state at $t=0$ ($\delta=-8.1$) and near-neutral at $t=1$ ($\delta=-1.0$).
  *   **Divergence:** The RPE account locates the primary negative valence event at the *cue* (anticipation), whereas the Reward account locates it at the *outcome* (consumption). In Ep 2, the RPE account predicts a strong positive valence (relief) at omission ($\delta=+9$), while the Reward account predicts neutrality ($r=0$).

  **The Driving Feature:**
  The divergence arises from **credit migration via convergence**. Because the outcome is deterministic and learned, the value function $V(Cue)$ absorbs the future cost. The TD error $\delta$ measures the *change* in expectation. At the cue, expectation drops from 0 to -9 (large negative $\delta$). At the aversive outcome, the event matches expectation exactly (small residual $\delta$ due to discounting). The "surprise" has moved backward in time.

  **Stochastic Modification ($p=0.5$):**
  If the aversive outcome occurs only 50% of the time, converged $V(Cue) = 0.5 \times \gamma(-10) = -4.5$.
  *   $\delta_{cue} = -4.05$.
  *   $\delta_{aversive} = -10 - (-4.5) = -5.5$.
  The inversion collapses. Negative valence is distributed across both anticipation and outcome. The sharp divergence requires high predictability.

  **Defense of Reward-as-Valence:**
  A defender would argue that $\delta$ is an *epistemic* signal (learning rate), not a *hedonic* one. They would claim Unit 734 does not "suffer" at the cue; it merely updates weights. Valence must track welfare impact (damage/noise), which occurs only at $t=1$. The RPE account conflates the *prediction of harm* with the *experience of harm*, mistaking a computational gradient for a state of being.
