prompt: |-
  i'm writing a short paper arguing that you can't just read an RL agent's reward signal as valence, and I want a worked case instead of another definition section. Build me a scenario with one ordinary model-free TD learner — a delivery robot or warehouse rover, something a reader can picture, no brain sims or sci-fi hardware — where the "reward is valence" reading and the "reward-prediction-error is valence" reading come apart in this direction: the RPE reading puts the agent in a suffering-ish state at a timestep where nothing bad is actually happening to it, and puts it near neutral at the timestep where the bad thing happens. The constraint I actually care about is that the divergence has to fall out of the agent having converged on a cued, deterministic aversive outcome, not from me picking weird reward numbers, and it shouldn't be stipulated — the verdicts should come out of what each account says a valence signal does (opposite-signed states, common currency for learning and action selection, drives approach/avoidance beyond its instrumental use, and so on). I've been calling the effect the anticipation inversion; the name doesn't matter. Since the case is going into a paper on reward-vs-valence, treat it as cheating if it smuggles in any claim about consciousness or just asserts the verdicts. Then: give me reward, TD error and V at each timestep for two episodes (aversive outcome cued-and-delivered vs cued-then-omitted), which account says the agent suffers at which step, which single feature of the setup is doing the work, what happens to the divergence if you make the outcome stochastic at p = 0.5, and how a defender of reward-as-valence would attack the case. If you think RPE-as-valence is just a bad theory, build it anyway and say so afterwards. Scenario plus numbers, under a page.
