  9.  (Self-Correction on Rieff): Rieff is tricky. He talks about the "triumph of the therapeutic" where memory becomes self-serving. Margalit is more about the ethics of caring. I should focus more on Margalit as he is the primary "ethics of memory" figure, but acknowledge Rieff's warning about memory becoming a burden.

