      *   **Task:** Act as an expert moral philosopher specializing in collective responsibility and ethics of remembrance. Critique a specific argument provided by the user.
      *   **Goal:** Identify where the argument "proves too much" (reductio ad absurdum), specifically targeting the jump from collective duty to individual cognitive burden.
      *   **Constraints:** The user wants to keep Premise (1) (forgetting enables structural injustice) and Premise (5) (archives aren't enough; living memory is needed). They suspect the break is between (4) and (6) or at (7).
      *   **Output:** Step-by-step analysis, identify the hidden work/breaking point, explain why it looked plausible, and detail the cost of rejecting it.

  2.  **Deconstruct the Argument:**
      *   (1) Forgetting injustice $\rightarrow$ harder to resist structural conditions. (Plausible, Margalit-esque).
      *   (2) Scalability: Every instance matters for pattern recognition. (Debatable, but leads to 3).
      *   (3) Collective Duty: Community must not forget *any* injustice. (Strong claim).
      *   (4) Distribution: Collective duty $\rightarrow$ Individual duty ("do their share"). (Standard distributive principle).
      *   (5) Non-Delegability: Archives $\neq$ Living Memory. (User wants to keep this).
      *   (6) Individual Cognitive Burden: Each individual must *personally retain* every injustice in *active* memory. (The explosion point).
      *   (7) Ought Implies Reason (unless overridden).
      *   (8) Psychological Cost $\neq$ Moral Override.
      *   (9) Conclusion: Everyone must remember everything (Impossible).
      *   (10) Dilemma: Ought implies Can is false OR Premise wrong.

  3.  **Identify the Philosophical Problem:**
      *   The argument commits a **Fallacy of Division** regarding memory practices.
      *   It conflates *collective memory* with the *sum of individual memories*.
      *   It conflates *active recall* with *dispositional availability* or *institutional embodiment*.
      *   It ignores the **Division of Mnemonic Labor**.

  4.  **Pinpoint the Breaking Step:**
      *   The user suspects (4) to (6) or (7).
      *   Step (4) is generally acceptable in collective responsibility (if the group must do it, members must contribute).
      *   Step (5) is the user's anchor (archives aren't enough).
      *   Step (6) is where the logic snaps. It moves from "do their share" to "retain *every* injustice."
      *   *Why?* Because "doing one's share" of a collective memory project does not mean "holding the whole project in one's head." It means participating in the *practice* of remembering.
      *   Also, Step (2) is suspicious ("losing *any* single instance weakens the overall pattern"). This is the hidden engine driving the absurdity. If (2) is false, (3) doesn't follow. But the user wants to focus on the distribution problem.
      *   *Decision:* The critical break is between **(5) and (6)**, facilitated by a misinterpretation of **(4)**. Specifically, the definition of "share" in (4) is exploited in (6).
      *   *Alternative:* Step (2) is actually the root cause of the "too much" claim. If we don't need to remember *every* minor injustice to recognize the pattern, the burden lessens. However, the user specifically asked about the jump from collective to individual (4-6). I should address both but focus on the distribution mechanism as requested.
      *   *Refinement:* The strongest philosophical objection is to the **nature of collective memory**. Collective memory is not the intersection of all individual memories, nor the union. It is a *social practice*. Step (6) assumes individual cognitive retention is the only way to satisfy (5). That is false. One can sustain "living memory" through ritual, conversation, and institutional participation without *personally recalling* every detail on demand.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Expert moral philosopher, encouraging but rigorous. Margalit/Rieff context.
      *   *Brainstorming:* Which premise is doing hidden work?
          *   Premise (2) is doing a lot of heavy lifting (the "granular instances" claim).
          *   Premise (6) is the non-sequitur.
          *   Premise (8) is also wild (psychological destruction isn't a moral counter-reason?).
      *   *Focusing on User's Constraint:* They want to keep (1) and (5). They suspect (4)-(6) or (7).
      *   *Diagnosis:* The break is at **(6)**. It misinterprets what "living social memory" requires of an *individual*.
      *   *Concept:* **Division of Mnemonic Labor**. Margalit talks about "thick" vs. "thin" relations. We don't owe thick memory to everyone.
      *   *Concept:* **Common vs. Collective Memory**. A community remembers *through* structures, not just inside skulls.
      *   *Cost of Rejection:* We have to admit that individuals are allowed to forget specific details as long as they support the *infrastructure* of memory. This weakens the immediate personal guilt but strengthens the structural obligation.

  6.  **Structuring the Advice:**
      *   **Introduction:** Acknowledge the strength of the *reductio*. It's a classic "over-demandingness" objection.
      *   **Brainstorming/Hidden Work:** Identify Premise (2) and the interpretation of "Share" in (4).
      *   **The Break:** Pinpoint the move from (5) to (6).
