      *   Actually, the *real* philosophical error is the definition of "Living Social Memory" in (5) vs (6). (5) says archives aren't enough. (6) says *individual brains* must be the alternative. That's a false dichotomy. The alternative is *social practices*.
      *   So, the break is **(6)**. It infers individual cognitive retention from collective living memory.
      *   Also, **(2)** is empirically dubious. Do we need *every* instance? Margalit argues we need *meaningful* instances.
      *   Let's advise rejecting/modifying **(6)** primarily, but warn that **(2)** is the engine making (6) impossible.

