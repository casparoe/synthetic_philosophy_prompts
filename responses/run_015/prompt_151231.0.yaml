  **Philosophy Dept Reclassifies Faculty As Four-Dimensional Worms For Tenure Review**

  MIDDLETOWN, PA—Citing a need for ontological precision in personnel management, the State University Philosophy Department announced Monday a comprehensive overhaul of its human resources protocol, formally adopting a perdurantist ontology wherein faculty members are recognized not as enduring three-dimensional entities, but as four-dimensional space-time worms.

  Under the new guidelines, tenure is no longer granted to a person at a specific time, but to the entire temporal extent of the employee's career. Consequently, termination is no longer defined as dismissal, but as the deliberate cessation of temporal extension. "We cannot fire Dr. Henderson," said HR Director Alan Cross. "We can only choose not to extend his worm past the fiscal year. His 2023 stages remain employed, even if his 2024 stages are unemployed. It is merely a pruning of the future temporal parts."

  Issues of academic integrity have also been reclassified. Plagiarism is now viewed as the unauthorized overlap of mental content across distinct temporal parts, while emeritus status has been redefined as a literal post-mortem continuation of the professional worm, allowing deceased professors to retain office keys indefinitely. Administration notes this simplifies payroll, as theire is no longer need to process death certificates for retired staff, since the professional object persists regardless of biological cessation.

  Meanwhile, the adjunct pool will operate under a pilot exdurantist framework. Each semester constitutes an instantaneous stage linked by counterpart relations rather than strict identity. This allows administration to deny benefits by claiming the instructor applying for health insurance is merely a temporal counterpart of the instructor who taught the course. "That wasn't you," administrators told one claimant. "That was your Tuesday counterpart. The you standing here today has no contractual relation to the you who graded finals in December."

  Not everyone agrees with the metaphysical shift. Dr. Arthur Penwright, a staunch endurantist, claimed he was technically terminated in 2019 but remains employed against his will. "I ceased to be a faculty member four years ago," Penwright said. "But admin keeps extending my worm against my will. I'm just a series of unrelated moments being forced into a narrative. I want to endure, not extend. I am wholly present in my dissatisfaction, yet they treat me as a process."

  At press time, the department was debating whether sabbaticals constitute a gap in the worm or merely a curved segment of the same continuous object, while adjuncts organized a strike consisting of instantaneous, unconnected walkouts.
