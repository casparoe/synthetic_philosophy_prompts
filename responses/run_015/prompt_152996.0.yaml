answer: |-
  Your hypothesis is correct. The stalemate is not empirical; it is **categorial**. The two camps are not disagreeing about the *capacity* of the welfare state to absorb immigrants, but about the *ontology* of the welfare state itself. They are answering different questions using the same vocabulary, which creates the illusion of a resolvable policy dispute when it is actually a conflict between incommensurable normative frameworks.

  Here is the diagnosis based on the specific axes of reciprocity, membership, and the bounds of justice, followed by an assessment of whether the debate can move.

  ### I. Diagnosis: The Structural Incommensurability

  The debate is not merely verbal, nor is it simply about temporal scales. It is a **conflict over the locus of moral obligation**.

  **1. Reciprocity: Generalized vs. Mutual**
  *   **Camp A (Open Borders):** Treats reciprocity as **generalized and forward-looking**. The obligation to support a newcomer is based on the expectation that they will eventually contribute to the aggregate pool. Reciprocity is systemic: *I pay for you now, someone else pays for me later, and the system sustains itself.* The "free rider" problem is an engineering glitch solvable by tax design or waiting periods.
  *   **Camp B (Welfare State):** Treats reciprocity as **mutual and backward-looking**. The obligation to support depends on a shared history of sacrifice and a shared identity that makes the sacrifice meaningful. Reciprocity is relational: *I pay for you because you are "one of us," and we have a shared stake in our common fate.* If the "us" dissolves, the obligation evaporates.
  *   **The Clash:** Camp A sees Camp B's requirement for prior solidarity as circular exclusion (you must be a member to get benefits, but you need benefits to become a member). Camp B sees Camp A's generalized reciprocity as fragile (a system without thick trust collapses into resentment and defection).

  **2. Membership: Jurisdictional vs. Ethical**
  *   **Camp A:** Defines membership **jurisdictionally**. Presence creates claim. If you are subject to the state's coercion (laws, borders), you are owed the state's protection (welfare). "Integration" means removing legal and economic barriers to participation.
  *   **Camp B:** Defines membership **ethically**. Membership is a cooperative status generated by shared norms, language, or history. "Integration" means incorporation into a scheme of mutual obligation, which requires cultural/psychological alignment.
  *   **The Clash:** For Camp A, restricting welfare based on ethical membership is caste-like discrimination. For Camp B, granting welfare without ethical membership is resource depletion that destroys the cooperative scheme.

  **3. Bounds of Justice: Human vs. Civic**
  *   **Camp A:** The bounds of justice are **human**. Nationality is a "morally arbitrary boundary." Justice demands we maximize the position of the worst-off globally, even if it strains the domestic scheme.
  *   **Camp B:** The bounds of justice are **civic**. Nationality is a "cooperative status." Justice is a virtue of institutions, and institutions require boundaries to function. You cannot have distributive justice without a *demos* to distribute *to*.
  *   **The Clash:** Camp A argues Camp B is privileging accident of birth over human need. Camp B argues Camp A is demanding a level of altruism that political institutions cannot sustain without ceasing to be welfare states.

  **Verdict:** This is a **substantive disagreement masked by verbal ambiguity**. The word "integration" allows Camp A to talk about labor market access (functional) while Camp B hears social trust (relational). The word "sustainability" allows Camp A to talk about fiscal solvency (math) while Camp B talks about political will (psychology). They are not updating on evidence because the evidence (fiscal impact studies) addresses Camp A's concerns, while Camp B's concerns (trust elasticity) are interpreted by Camp A as prejudices to be overcome, not constraints to be respected.

  ### II. Can the Debate Move?

  Given this diagnosis, a resolution is unlikely, but a *productive reframing* is possible. However, we should expect a **permanent stalemate on the core normative question**, for the following reasons:

  **1. Why Conceptual Distinctions Won't Solve It**
  Proposing a distinction between "resource constraints" and "solidarity constraints" clarifies the terms but does not resolve the conflict. Camp A believes solidarity constraints are malleable (institutions can build new solidarity). Camp B believes solidarity constraints are hard limits (trust is finite and slow-growing).
  Similarly, framing membership goods as "non-excludable but rivalrous" (club goods theory) validates Camp B's position but is rejected by Camp A as morally illegitimate. Camp A does not accept that welfare *should* be a club good.

  **2. The Only Viable Reframing: Decoupling Entry from Claim**
  The only conceptual move that might reduce friction is rigorously decoupling the **right to enter** from the **right to claim**.
  *   **The Proposal:** Acknowledge a human right to *seek* entry (asylum/escape tyranny) but treat full welfare membership as a distinct status earned through a period of contribution/residence (a "probationary citizenship").
  *   **The Problem:** Camp A often rejects this as creating a second-class caste that violates liberal egalitarianism. Camp B often rejects this as insufficient to protect the core *demos*.
  *   **The Potential:** If Camp A accepts that *full* distributive justice requires *full* membership (delayed), and Camp B accepts that *basic* human rights require *immediate* access (even without full welfare), the debate shifts from "Open vs. Closed" to "What is the timeline for membership?" This moves the debate from a binary to a gradient.

  **3. Why Permanent Stalemate is More Likely**
  We should expect stalemate because the debate rests on a **tragic trade-off between two liberal goods**:
  1.  **Universal Moral Equality:** The idea that all humans have equal claim to resources.
  2.  **Particular Political Community:** The idea that self-determination requires a bounded group to make decisions.

  You cannot maximize both.
  *   If you maximize Universal Equality (Camp A), you dilute the boundaries that make Particular Community (and thus high-trust welfare) possible.
  *   If you maximize Particular Community (Camp B), you enforce boundaries that violate Universal Equality.

  **Conclusion**
  The debate stalls because it is not a policy dispute; it is a **conflict of political ontology**. Camp A views the state as a service provider for individuals; Camp B views the state as a project of a people.
  *   **Is your hypothesis right?** Yes. The conflict is about whether nationality is arbitrary (A) or constitutive (B).
  *   **Can it move?** Only if both sides admit the trade-off. Camp A must admit that unlimited entry may degrade the specific institutions that help the poor. Camp B must admit that closed borders protect privilege at the cost of global justice.
  *   **Prediction:** Permanent stalemate. The vocabulary of "integration" will continue to mask the conflict because admitting the incompatibility forces a choice between two deeply held values that liberal democracies wish to hold simultaneously. The debate persists not because we lack data, but because we lack a political theory that successfully reconciles universal moral worth with particularistic solidarity.
