answer: |-
  Your friend's summary conflates deflationism with verificationism and presents contested objections as settled refutations, though his arbitration challenge identifies a genuine pressure point regarding normativity that remains live in the literature.

  Before auditing the claims, I hypothesize four illegitimate moves are structuring his critique: first, an equivocation on "property" between logical and robust causal kinds; second, a conflation of deflationism with verificationism by equating truth with assertibility; third, a begged question against realism by assuming substantive truth is required for substantive disagreement; and fourth, a dismissal of deflationary explanation as no explanation at all.

  **Audit of the Summary**

  1.  *"Truth is not a genuine property of anything."* **Contested/Technical.** Deflationists deny truth is a *substantive* or *natural* property (like mass), but most accept it is a logical property. Your friend treats "property" univocally, which is a category error.
  2.  *"*Is true* is a grammatical device... endorsing a sentence..."* **Accurate Simplification.** This captures the disquotational or pro-sentential function correctly, though it omits the logical generalization role.
  3.  *"Deflationists treat that biconditional as the definition of truth..."* **Accurate.** This is the T-schema core of Minimalism and Disquotationalism.
  4.  *"Truth is nothing over and above what speakers are disposed to assert..."* **Misrepresentation (Conflation).** This conflates deflationism with verificationism or assertibility semantics. Deflationists (e.g., Horwich, Field) explicitly deny truth is reducible to assertibility conditions; truth is normatively distinct from warranted assertion.
  5.  *"...deflationism quietly settles the old realism disputes... no fact of the matter..."* **Misrepresentation (Non-sequitur).** Deflationism is neutral on realism. One can be a deflationist about truth and a robust realist about electrons or morals. The inference that deflation entails anti-realism is a known blunder in the literature.
  6.  *"Truth has to do explanatory work... a merely grammatical device cannot explain anything."* **Contested.** This assumes only substantive properties explain. Deflationists argue truth explains logical validity and generalizations (e.g., "Everything the Pope says is true"), which is explanatory work, just not causal explanation.
  7.  *"So the view was refuted a few decades ago and is now mostly of historical interest."* **False.** Deflationism is arguably the dominant position in contemporary metaphysics of truth, not a relic.

  **Deflationist Replies**

  1.  **On Property:** A defender would say truth is a property, just not one that admits of physical reduction or causal powers. This is a **substantive correction**, not a quibble; it targets the friend's metaphysical assumptions about what properties exist.
  2.  **On Assertibility:** A defender would reply that we can assert falsehoods and fail to assert truths, so the extensions differ. This is a **substantive correction**; it severs the link between truth and epistemic warrant that your friend assumes.
  3.  **On Realism:** A defender would argue that realism is about the subject matter (e.g., minds, numbers), not the truth predicate. This is a **substantive correction**; it shows the friend is attacking a straw man (global anti-realism) rather than deflationism.
  4.  **On Explanation:** A defender would argue that logical generalization is a form of explanation. This is **contested**; inflationists deny this counts as "genuine" explanation, so this is a live philosophical dispute, not a settled refutation.

  **Evaluation of Large Conclusions**

  Does the anti-realist conclusion follow? **No.** This inference is widely regarded as a blunder among specialists. Deflationism shrinks the truth predicate, not the world. You can deflate truth while inflating facts. Whether deflationism *forces* anti-realism in specific domains (like ethics) is a live research question (e.g., Blackburn's quasi-realism), but it does not follow globally as your friend claims.

  Is the explanatory-work objection decisive? **No, it is live.** The premise that "truth needs to explain the success of true belief" is disputed. Inflationists argue only a correspondence relation explains successful action (e.g., true beliefs about water lead to drinking water). Deflationists argue this is a causal explanation of belief fixation, not a metaphysical explanation of truth itself. Some deflationists (like Field) have conceded ground here and added causal constraints, while others (like Horwich) deny truth needs to explain success at all. This is not a refutation but a boundary marker for the view.

  **The Bookkeeping/Arbitration Argument**

  The distinction is real and maps onto the debate between logical expressivism and normative realism. "Bookkeeping" corresponds to the logical function of truth (generalization, endorsement); "Arbitration" corresponds to the normative function (correctness, fault). Deflationists claim to do both: bookkeeping via the T-schema, and arbitration via logical inconsistency (if you assert P and I assert not-P, one of us is wrong by logic alone).

  Your friend's argument fails because he defines "Arbitration" as requiring a *substantive* fact of the matter beyond logical contradiction. He assumes that for a disagreement to be real, there must be a truth-property that one party fails to instantiate. Deflationists deny this: the disagreement is real because the contents are incompatible, not because truth is a robust property. Failing to do *substantive* arbitration is not a cost if substantive arbitration is incoherent. However, this is a **genuine cost** if you believe normativity requires robust properties. This is the core of the realism debate, not a specific refutation of deflationism. The feature doing the work is his stipulation that arbitration requires a "fact of the matter" in the inflationist sense. If you remove that feature and accept logical inconsistency as sufficient for arbitration, the argument collapses.

  **Status of the View and Consensus**

  Is deflationism a refuted relic? **No.** It is a live, dominant position. Prominent defenders include Paul Horwich, Hartry Field, and deflated versions of pragmatism. It is not the consensus—pluralism and inflationism are strong rivals—but it is central to the debate.

  **Settled vs. Contested:**
  *   **Settled:** Deflationism is not refuted; the inference from deflationism to global anti-realism is invalid.
  *   **Contested:** Whether deflationism can fully account for the normativity of truth (the "Arbitration" job) without smuggling in inflationist premises. Some specialists think it can (Horwich); others think it cannot (Lynch, Wright).
  *   **My View:** I side with the view that deflationism is viable but faces a genuine challenge on normativity. I am confident (80%) that your friend's summary is historically and technically inaccurate regarding the status of the view and the realism inference. I am less confident (50/50) on whether the arbitration challenge can be fully met without modification, as this is the cutting edge of current research. You may repeat that deflationism is live and compatible with realism; you should present the arbitration issue as an open problem rather than a refutation.
