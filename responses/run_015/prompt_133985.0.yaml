answer: |-
  # The "What Are We Actually Doing?" Quiz

  **Instructions:** Read each scenario. Choose the response that matches what you would *actually* vote for in the room, not what sounds best in theory. There are no right answers.

  **1. The County Historical Society**
  The majority-culture historical society applies for the same grant amount as everyone else. They preserve local archives and run a museum most locals visit.
  *   **A.** Fund them. Heritage is a public good, and they serve the most people.
  *   **B.** Fund them, but only if they commit to specific exhibits on minority histories.
  *   **C.** Decline. They represent the dominant culture; they don't need our help to survive.

  **2. The Last Speakers**
  A group of 800 people wants to preserve a language none of their children speak. Every member speaks the majority language fluently.
  *   **A.** Fund them. A language is a world; losing it is a loss for everyone.
  *   **B.** Fund them, but only if they link it to job training or tourism revenue.
  *   **C.** Decline. Language choice is private; public money shouldn't fight natural change.

  **3. The Religious Food Bank**
  A church runs an excellent food bank but requires recipients to sit through a 15-minute service to get a box.
  *   **A.** Fund the food costs. Hunger is the emergency; the service is their internal matter.
  *   **B.** Fund only if the service is made optional for recipients.
  *   **C.** Decline. Public funds cannot support religious coercion or proselytizing.

  **4. The Unmeasurable Good**
  A poetry circle asks for money to meet for a year. They say the meetings make their lives make sense but admit there is no measurable outcome.
  *   **A.** Fund them. We trust their judgment on what gives life meaning.
  *   **B.** Fund only if they track attendance or publish an anthology.
  *   **C.** Decline. Stewardship requires us to show where the money went and what it achieved.

  **5. The Cross-Border Community**
  An ethnic community is split by a national border. The poor side asks for money to support cultural events on the rich side, treating them as one people.
  *   **A.** Fund them. They define their community, not the map.
  *   **B.** Fund only the projects happening on the poor side of the border.
  *   **C.** Decline. Our mandate is local; political borders define our jurisdiction.

  **6. The Strict Co-op**
  A workers' co-op has a strict moral code. They want money to expand. Their bylaws allow them to expel members by majority vote without cause.
  *   **A.** Fund them. Voluntary association includes the right to choose who stays.
  *   **B.** Fund only if they add an appeals process for expelled members.
  *   **C.** Decline. We don't fund groups that can arbitrarily ruin a member's livelihood.

  **7. The Internal School**
  A community wants to educate its children entirely within its own doctrine. Graduates will be fluent in the tradition but may lack skills for the wider economy.
  *   **A.** Fund them. Parents and communities have the right to shape their children.
  *   **B.** Fund only if the curriculum meets state standards for math and reading.
  *   **C.** Decline. Education must prepare children for independence, not just membership.

  **8. The Inexplicable Request**
  A group applies for funds for a ritual. They state clearly: "We cannot explain what this is for to outsiders. You would have to be one of us to understand."
  *   **A.** Fund them. Our inability to understand doesn't mean it lacks value.
  *   **B.** Fund only if a trusted intermediary (like a university dept) vouches for it.
  *   **C.** Decline. We cannot be responsible for money we do not understand.

  **9. The Traditional Hunt**
  A cultural group wants to fund a traditional hunt that uses methods legal in the county but considered inhumane by modern animal welfare standards.
  *   **A.** Fund them. Tradition has its own logic; we shouldn't impose current mores.
  *   **B.** Fund only if they adopt the more humane methods available.
  *   **C.** Decline. We cannot fund practices that conflict with our shared ethical progress.

  **10. The Exclusive Neighborhood**
  A neighborhood association wants funds for a community center. Their covenants restrict house sales to maintain "character," effectively excluding lower-income families.
  *   **A.** Fund them. Property owners have the right to manage their community's character.
  *   **B.** Fund only if the center is open to the public, even if housing isn't.
  *   **C.** Decline. We do not fund segregation or exclusionary practices.

  ***

  # Scoring Key & Logical Map

  ### Step 1: Tally Your Codes
  For each question, assign the point value below to your answer.

  | Q | A (Group/Intrinsic) | B (Compromise/Process) | C (Individual/Universal) |
  | :--- | :---: | :---: | :---: |
  | **1** | +1 | 0 | -1 |
  | **2** | +1 | 0 | -1 |
  | **3** | +1 | 0 | -1 |
  | **4** | +1 | 0 | -1 |
  | **5** | +1 | 0 | -1 |
  | **6** | +1 | 0 | -1 |
  | **7** | +1 | 0 | -1 |
  | **8** | +1 | 0 | -1 |
  | **9** | +1 | 0 | -1 |
  | **10** | +1 | 0 | -1 |

  *Note: This simplified tally places you on a single spectrum from **Community Integrity (+10)** to **Universal Individualism (-10)**. However, the specific **pattern** matters more than the total.*

  ### Step 2: Locate Your Position (The Leaves)
  Compare your specific answer pattern to the profiles below. You are likely a mix, but find the one that matches your *hard lines* (the questions where you refused to compromise).

  **1. Strict Antiperfectionist Neutrality**
  *   **Pattern:** Mostly **C** on Q3, Q7, Q8. Willing to fund Q1 (Historical Society) if it's public-facing.
  *   **Logic:** The state/foundation must not judge the "good life." It ensures rights and public goods.
  *   **Hardest thing to say:** "We are ignoring the power imbalance between the majority and minority to stay neutral."

  **2. Liberal Culturalism**
  *   **Pattern:** **C** on Q3, Q6, Q7 (Individual rights within culture) but **A** on Q2 (Language) and Q1 (Heritage).
  *   **Logic:** Culture is a primary good individuals need to make choices. We support culture, not doctrines.
  *   **Hardest thing to say:** "We are picking which cultures are 'healthy' enough to fund."

  **3. Perfectionist Liberalism**
  *   **Pattern:** **B** or **C** on Q4, Q7, Q9. Funds things that make people more autonomous/virtuous.
  *   **Logic:** We fund what makes people better (more free, more capable). Bad cultures don't get money.
  *   **Hardest thing to say:** "We know better than you what your life should look like."

  **4. Civic Republicanism**
  *   **Pattern:** **B** on almost everything. Focus on participation, process, and civic virtue (Q5, Q10).
  *   **Logic:** Funding must build active citizenship and shared public space, not private enclaves.
  *   **Hardest thing to say:** "Your private community matters less than your public duty."

  **5. Recognition-Based Communitarianism**
  *   **Pattern:** **A** on Q2, Q5, Q8 (Marginalized/Identity) but **C** on Q1 (Majority History).
  *   **Logic:** Justice requires uplifting marginalized identities to equal dignity. Majority doesn't need help.
  *   **Hardest thing to say:** "We are treating groups differently based on their status, not their need."

  **6. Thick Localist (Neo-Aristotelian)**
  *   **Pattern:** **A** on almost everything, including Q6, Q9, Q10.
  *   **Logic:** The local form of life is the highest good. Tradition, hierarchy, and exclusion are valid if they sustain the community.
  *   **Hardest thing to say:** "Tradition justifies exclusion, and we are okay with that."

  **7. Toleration-for-Reasons-of-Fallibility**
  *   **Pattern:** **A** on Q4, Q8, Q9 specifically. Willing to fund what they can't explain.
  *   **Logic:** We might be wrong about what is valuable. Humility requires funding the inexplicable.
  *   **Hardest thing to say:** "We are handing out money without knowing if it does any good."

  **8. The "Framing is the Problem" Leaf**
  *   **Pattern:** Inconsistent. **A** on Q4, **C** on Q10, **B** on Q3. Rejects the binary.
  *   **Logic:** The criteria themselves are the issue. Decisions must be contextual, not principled.
  *   **Hardest thing to say:** "I can't give you a rule for why I voted this way."

