  # Logical Space Analysis

  ### The Map
  The ten questions create a logical space defined by three axes:
  1.  **Justification:** Instrumental (Service) vs. Intrinsic (Forms of Life).
  2.  **Unit of Value:** Individual Rights vs. Group Integrity.
  3.  **Epistemic Stance:** We Can Judge (Perfectionism) vs. We Cannot Judge (Fallibilism).

  ### Unoccupied Leaves (Combinations that don't exist or are unstable)
  1.  **The "Neutral Localist":** Someone who demands Strict Neutrality (Q3-C, Q7-C) but also Thick Localism (Q10-A).
      *   *Status:* **Incoherent.** You cannot refuse to judge religious coercion while endorsing exclusionary covenants as "local character." This combination usually collapses into hypocrisy during deliberation.
  2.  **The "Redistributive Traditionalist":** Someone who funds the Traditional Hunt (Q9-A) but insists on funding only the poor side of the border (Q5-B).
      *   *Status:* **Unattractive/Rare.** Thick Localists usually care about the *whole* community's integrity, not economic redistribution across borders. This mix is theoretically possible but psychologically rare.
  3.  **The "Perfectionist Fallibilist":** Someone who says "We must fund only what improves autonomy" (Perfectionist) but also "We can't judge the ritual" (Q8-A).
      *   *Status:* **Incoherent.** If you can't judge it, you can't know if it improves autonomy.

  ### Pairs the Quiz Cannot Pull Apart
  1.  **Liberal Culturalism vs. Strict Neutrality:**
      *   *Why:* On most funding decisions (Q3, Q6, Q7), they vote identically (protecting individual rights within groups).
      *   *Difference:* Only **Q1 (Historical Society)** and **Q2 (Language)** distinguish them. Neutrality declines Q1 (majority doesn't need help); Culturalism funds it (culture is a primary good).
      *   *Fix:* If your board is split on these, add an 11th question: "Do we fund the majority language newspaper if it's the only one left?"
  2.  **Civic Republicanism vs. Perfectionist Liberalism:**
      *   *Why:* Both want to make people "better."
      *   *Difference:* Republicans care about *participation* (Q5, Q10); Perfectionists care about *autonomy* (Q7).
      *   *Fix:* The current quiz splits them on Q5 (Border) and Q7 (School). If a member scores identical on these, the difference is purely rhetorical (justification), not practical.

  ### Handling Inconsistent Answerers
  Most board members will not land cleanly on one leaf. They will be "Scattered."
  *   **Do not force a label.** A scattered profile usually indicates a **Pragmatist** or a **Contextualist**.
  *   **Principled Interpretation:** This is not a failure of reasoning. It often means they hold a "Reflective Equilibrium" position—they adjust principles to fit cases.
  *   **Recommendation:** Report their "Region." E.g., "You are a Liberal Culturalist on education, but a Thick Localist on heritage." This is more useful for predicting votes than a single label.
  *   **The "Framing" Leaf:** If someone's answers seem random, check if they rejected the premises. If they wrote notes like "This is a false choice," they belong on Leaf 8.

  ### Summary of "Hard to Say" Lines
  *   **Neutrality:** "We are ignoring the power imbalance."
  *   **Culturalism:** "We are picking winners."
  *   **Perfectionist:** "We know better than you."
  *   **Republican:** "You must be a citizen first."
  *   **Communitarian:** "The group matters more than the member."
  *   **Localist:** "Tradition justifies exclusion."
  *   **Fallibilist:** "We don't know why this is good."
  *   **Anti-Framing:** "This process is the problem."
