      *   *Q2 (The Bus Factor):* If the main doer quits today, does this vanish next week? (Yes = Founder-shadow).
      *   *Q3 (The Why Test):* Ask a volunteer who *didn't* teach this. Can they explain the benefit? (No = Vulnerable/Quiet or Zombie).
      *   *Decision Logic:*
          *   High Flash + Low Why = Kill (Style over substance).
          *   High Dependency + High Value = Protect (Document it).
          *   Low Flash + High Value = Protect (Don't let it die).
          *   Low Flash + Low Value = Kill (Waste of time).

  5.  **Addressing the Co-organizer's Critique:**
