  6.  **Running the Procedure on the Three Examples:**
      *   *Example 1: Complicated Wheel Truing (Old volunteer, everybody copies).*
          *   Flash: High (looks skilled).
          *   Dependency: High (Old volunteer).
          *   Why: Probably low (nobody knows if it's actually better).
          *   Verdict: Likely a Demo-magnet/Founder-shadow hybrid. Risk: Inefficient. Action: Test against standard method.
      *   *Example 2: Sign-in Rule (Everybody follows, nobody knows why).*
