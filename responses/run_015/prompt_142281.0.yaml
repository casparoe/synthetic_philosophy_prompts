          2.  *Founder-shadows:* Persist only because the originator is still present (person-dependent).
          3.  *Quiet good ones:* Work well but are invisible/vulnerable to extinction (substance over style).
      *   **Goal:** A 20-minute diagnostic procedure (questions, criteria, decision matrix) to classify a practice and decide action (Protect, Kill, Leave Alone).
      *   **Constraint:** Must be runnable by one person, no hard data (just observation/asking), honest about where it's hunch vs. method.
