answer: |-
  Here is a 20-minute procedure designed for your specific situation. It respects your co-organizer's point (this isn't biology, it's knowledge management) while keeping your useful labels for spotting risks.

  ### The 20-Minute Practice Autopsy

  **Goal:** Determine if a specific workshop habit is robust, fragile, or toxic.
  **Inputs:** Your observation + asking 2 volunteers (one veteran, one newer).
  **Time:** 4 minutes per question x 5 minutes to decide.

  #### Step 1: The Flash Test (4 Minutes)
  **Watch the practice happen.** Ask yourself: *If a new volunteer walked in right now, would this look impressive or satisfying to watch?*
  *   **Yes:** It has high "Demo-magnet" potential. People copy it because it feels like mastering a skill, not because it saves time.
  *   **No:** It's invisible work. It relies on utility, not style.

  #### Step 2: The Bus Factor (4 Minutes)
  **Identify the primary carrier.** Who does this the most? Now, ask a different volunteer: *"If [Name] quit today, would we still do it this way next month?"*
  *   **"No, we'd probably stop":** It is a **Founder-shadow**. The knowledge lives in a person, not the system.
  *   **"Yeah, we'd keep going":** The knowledge is distributed.

  #### Step 3: The "Why" Test (4 Minutes)
  **Ask a volunteer who didn't teach this practice:** *"What problem does this solve?"*
  *   **"I'm not sure / That's just how we do it":** The *meaning* has detached from the *action*. This is high risk for "Quiet good ones" dying or "Zombie rules" surviving.
  *   **"It prevents X / It saves time on Y":** The value is understood. This is healthy cultural transmission (your co-organizer's point).

  #### Step 4: The Friction Check (4 Minutes)
  **Does this slow us down or create risk?**
  *   **Yes:** It costs time or safety.
  *   **No:** It's neutral or helpful.

  ---

  ### The Decision Matrix

  Combine your answers to get your instruction:

  1.  **High Flash + Low "Why" + High Friction** = **KILL IT.**
      *   *Diagnosis:* **Demo-magnet.** It looks cool but wastes time. Newbies learn it to show off, not to fix bikes.
  2.  **High Bus Factor + High "Why" + Low Friction** = **PROTECT IT.**
      *   *Diagnosis:* **Founder-shadow.** It works, but it's trapped in one person's head. You need to write it down or teach it formally before they leave.
  3.  **Low Flash + High "Why" + Low Friction** = **PROTECT IT.**
      *   *Diagnosis:* **Quiet Good.** It's invisible value. It will die if you don't highlight it during onboarding.
  4.  **Low Flash + Low "Why" + Low Friction** = **LEAVE ALONE (for now).**
      *   *Diagnosis:* **Harmless Habit.** Not worth your energy to fix unless you have spare time.
  5.  **Low Flash + Low "Why" + High Friction** = **KILL IT.**
      *   *Diagnosis:* **Zombie Rule.** Nobody knows why it exists, it annoys people, and it serves no purpose.

  ---

  ### Where This Is Just Your Hunch (The Disclaimer)

  You asked for honesty about where this method is flimsy. Here are the three weak points:

  1.  **Defining "Flash":** What looks cool to you might look boring to a newbie. You are guessing their perspective. *Mitigation:* Ask a new volunteer directly, "Did that look satisfying to watch?"
  2.  **Defining "Friction":** You might think a step is slow, but it might prevent a catastrophic failure later (e.g., torqueing a stem bolt). *Mitigation:* If the practice involves safety critical parts (brakes, wheels), assume "High Value" until proven otherwise.
  3.  **The "Why" Answer:** People lie to sound competent. A volunteer might make up a reason so they don't look clueless. *Mitigation:* Ask two different people. If their reasons contradict, the "Why" is lost.

  ---

  ### Running the Autopsy on Your Three Examples

  #### 1. The Complicated Wheel Truing (Old volunteer, everybody copies)
  *   **Flash:** **High.** Truing a wheel is satisfying; a "weirdly complicated" method looks like master-level wizardry.
  *   **Bus Factor:** **High.** One old volunteer is the source.
  *   **The "Why":** **Low.** If everybody copies it but nobody can explain *why* the complication is necessary compared to standard truing, the knowledge is degraded.
  *   **Friction:** **High.** Complicated methods take longer.
  *   **Verdict:** **KILL IT (or Validate it).**
      *   *Reasoning:* This smells like a **Demo-magnet** wrapped in a **Founder-shadow**. Newbies copy it because the old volunteer looks skilled, not because it's efficient.
      *   *Action:* Have your best mechanic compare the result of this method vs. standard method. If the wheel isn't better, ban the complication. It's theater, not repair.

  #### 2. The Sign-in Rule (Everybody follows, nobody knows why)
  *   **Flash:** **Low.** Nobody thinks signing a sheet is cool.
  *   **Bus Factor:** **Low.** Everyone does it.
  *   **The "Why":** **None.** "Nobody can explain the point."
  *   **Friction:** **Medium.** It creates a bottleneck at the door.
  *   **Verdict:** **KILL IT.**
      *   *Reasoning:* This is a classic **Zombie Rule**. It has no utility, no defender, and costs time.
      *   *Action:* Stop requiring it for one month. See if anything breaks (insurance? theft? contact tracing?). If nothing breaks, delete it. If something breaks, you now have a real "Why" to teach.

  #### 3. The Greeting (Dropped after two bad Saturdays)
  *   **Flash:** **Low.**
  *   **Bus Factor:** **Low.**
  *   **The "Why":** **Known.** You know why it died (bad Saturdays).
  *   **Friction:** **High (Social).** It caused conflict or confusion.
  *   **Verdict:** **LEAVE ALONE (but Document).**
      *   *Reasoning:* Your "Darwinian" system actually worked here. A bad practice was selected against and removed.
      *   *Action:* The risk isn't the practice itself; it's *forgetting why it failed*. In six months, a new volunteer might suggest it again. Write down in your notes: *"Greeting Protocol X tried [Date], failed because [Reason]. Do not revive."*

  ---

  ### What to Tell Your Co-organizer

  She is right that this isn't biological evolution. Genes don't know what they are; your volunteers do. When they copy a practice, they *think* they are improving it.

  However, her argument doesn't solve your problem. Even with intentional improvement, you still have **Information Loss.**

  Tell her this:
  *"You're right, this isn't biology because people choose what to copy. But with 40 volunteers turning over every season, we have a 'Memory Leak.' Good stuff leaks out because it's boring (Quiet Good), and bad stuff sticks because it's flashy (Demo-magnet). This procedure isn't about evolution; it's about **plugging the leak**. We aren't steering the genes; we're just making sure the manual doesn't go missing."*

  This shifts the argument from "Is the metaphor accurate?" (which she wins) to "Is the risk real?" (which you win).
