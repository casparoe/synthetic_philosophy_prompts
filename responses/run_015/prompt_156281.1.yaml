  ^2 ^If ^an ^activity ^feels ^too ^much ^like ^fun, ^it ^will ^be ^reclassified ^as ^Unsanctioned ^Loitering.
  ^3 ^See ^Section ^2.1 ^regarding ^the ^structural ^necessity ^of ^the ^machine ^overlord ^dynamic.
