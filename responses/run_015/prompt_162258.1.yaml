prompt: |-
  Hey — I'm doing a piece on the doomsday argument for the ideas desk and my editor wants an actual number in it, so I need yours, with the guts showing.

  Here's the proposition I want priced. Call it DA-works: an agent who (i) treats herself as a random sample from some reference class of observers, (ii) hasn't already smuggled a small-population conclusion into her prior over how many observers will ever exist, and (iii) knows roughly how many humans have lived before her (use whatever estimate you like, and tell me if the exact figure matters), ends up with a substantially higher credence in "our lineage of observers terminates within the next few thousand years" than she'd have from the ordinary empirical risk picture alone — asteroids, pandemics, nukes, AI, whatever. Substantially = moves the number by at least ten points. Give me the number, then the terms.

  The decomposition I have in mind, roughly: your credence on SSA versus SIA versus "indexical, self-locating evidence just can't do work like this" versus something else entirely; whether the reference class is biological humans or all observers including uploaded and simulated minds, and how much that one choice moves things; how much of the argument's force comes from the shape of your prior over total population size rather than from the likelihood ratio; whether the whole shift gets swamped once you condition on ordinary risk estimates anyway; and whether the presumptuous philosopher is genuinely a cost of SIA or just a bullet you bite and move on.

  Two more things to fold in. My own number is around 0.35, and the two people I interviewed for the piece are at about 0.75 and about 0.1 — tell me where thier disagreement most likely actually lives, because I suspect it isn't where either of them thinks it is. And a friend who definately knows more math than I do says the argument has a selection effect running the other way: I'm not merely a random human, I'm one of the handful of observers who has ever sat down and formulated an anthropic argument at all, and if the future is enormous then the overwhelming majority of observer-moments are spent doing something other than anthropic reasoning — so conditioning on "I'm an observer thinking about this" is supposed to partly cancel the doomsday shift. I don't trust it and I can't kill it. Give that objection its own probability of being a real defeater, and say precisely what it depends on.

  Then combine it into the headline number, tell me which single term the result is most sensitive to, and say what one piece of evidence or argument — short of just waiting to watch the future happen — would move you the most. Skip the cites and the further-reading box, I've got the background.
