  **The Trade-off Argument**
  Your suspicion is correct: you cannot have Locality, Propriety, and Boundedness simultaneously. Standard characterization results for proper scoring rules entail that any continuous, local, proper rule must be logarithmic (up to affine transformation). Since the logarithm is unbounded near zero, any attempt to bound it (like your soft-floor) or make it local while bounded forces you to abandon propriety. Conversely, keeping Propriety and Boundedness (like Quadratic) forces you to abandon Locality, which is exactly why the Quadratic score depends on the fine-grainedness of the partition. The regularity assumption required is simply that the scoring function's components are differentiable on the interior of the credence space. Your soft-floor is indeed improper; specifically, for true probabilities below $\epsilon$, the linear tail encourages reporting $\epsilon$ rather than the truth, violating strict propriety.

