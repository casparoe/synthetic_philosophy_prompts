answer: |-
  **Project Title:** Beyond the Unitary Category: A Taxonomic Proposal for Affective Registrations and Emotional Stances

  **1. Statement of the Philosophical Question**
  This project asks a determinate taxonomic question: Should philosophical analysis abandon the unitary category "emotion" in favor of a dual-structure model distinguishing "affective registrations" from "emotional stances"? Specifically, does this distinction hold sufficiently to dissolve classic puzzles regarding emotional rationality and moral responsibility, or do the two structures remain inseparable in principle? The project seeks a binary outcome: either the distinction is robust enough to warrant separate normative treatments, or the unitary category must be retained because the proposed structures are constitutively fused in all actual instances.

  **2. Background and Critique of the Existing Trichotomy**
  The current debate in the philosophy of emotion is stalled by a trichotomy of positions that talk past one another by assuming a single essence for "emotion." Cognitivist or judgment-based accounts correctly describe the normative accountability of what this project terms "emotional stances"—slow, conceptually structured commitments to treat a situation in a specific normative light. However, they fail to account for the non-conceptual urgency of "affective registrations," such as the immediate startle response preceding any judgment of danger. Conversely, perceptual or feeling-based accounts accurately capture the bodily immediacy and phenomenology of affective registrations but cannot explain why agents are held socially accountable for emotional displays that exceed mere bodily sensation. Finally, hybrid or constructivist accounts acknowledge both elements but typically conflate them into a single bundle without explaining their interaction or why rationality norms apply differently to each component. By treating these distinct structures as competing definitions of a single natural kind, the existing literature creates pseudo-problems regarding whether emotions are rational or passive. This project proposes that they are neither exclusively; rather, registrations are arational inputs, while stances are rational commitments.

  **3. Methodology and Work Plan**
  As a purely conceptual project, this study relies on logical analysis, ordinary language examination, and the construction of thought experiments rather than empirical data collection. The method involves three phases: conceptual differentiation, boundary testing, and normative assessment.

  *   **Month 1: Conceptual Groundwork and Ordinary Language Analysis.** I will analyze emotional reports in ordinary language to identify implicit distinctions between involuntary feelings (e.g., "I felt a surge of anger") and committed attitudes (e.g., "I stand indignantly against this injustice"). The goal is to draft preliminary necessary and sufficient conditions for "affective registrations" (fast, body-based, non-conceptual) and "emotional stances" (slow, conceptually structured, socially accountable).
  *   **Month 2: Boundary Cases and Decision Criteria.** I will construct and analyze boundary cases to test the distinction. Key cases include: (1) ritual grief where the subject performs sorrow without personal belief; (2) bodily arousal without object-directed evaluation (e.g., caffeine-induced anxiety); and (3) shame directed at social norms the subject explicitly rejects. I will develop decision criteria for determining when a registration matures into a stance.
  *   **Month 3: Normative Implications.** I will assess whether rationality norms apply differently to each structure. Specifically, I will investigate whether moral responsibility attaches only to stances, thereby resolving puzzles about recalcitrant emotions where feeling conflicts with judgment.
  *   **Month 4: Synthesis and Drafting.** I will integrate the analysis into a final paper, refining the taxonomy and ensuring the argument addresses potential objections regarding the inseparability of the two structures.

  **4. Conditions for Success and Failure**
  A successful result will yield a defensible taxonomy with clear conditions for membership in each category. Success is defined by the model's ability to diagnose at least two classic puzzle cases that the unitary view misdescribes. For example, the model should explain recalcitrant emotions not as irrational judgments, but as affective registrations failing to align with emotional stances, thereby removing the charge of irrationality from the agent. Conversely, the project counts as a failure if the distinction collapses under analysis—for instance, if every actual emotional episode turns out to be an inseparable fusion of both structures such that distinguishing them offers no explanatory gain, or if ordinary language proves too ambiguous to support the bifurcation.

  **5. Scope Assessment**
  This project is tractable within one semester because it relies on conceptual reasoning and case analysis rather than laboratory work or large-scale data review. The scope is strictly limited to individual, adult human emotional episodes. I must stop before extending the taxonomy to clinical classifications (e.g., pathology vs. normal function) or to collective emotional practices (e.g., group indignation), as these introduce empirical variables beyond the project's philosophical boundaries. Furthermore, while the project will establish whether responsibility applies differently to registrations versus stances, it will not resolve specific applied questions regarding legal liability or specific moral dilemmas, leaving those for future applied ethics research.

  **6. Significance for Philosophy of Mind**
  Reframing the debate from "what is emotion" to "which structure is operative" matters for broader debates in the philosophy of mind regarding modularity and agency. If affective registrations are distinct from emotional stances, it suggests a modular architecture where sub-personal bodily states interface with personal-level normative commitments without being identical to them. This supports a nuanced view of human agency where individuals are not responsible for their raw affects but are accountable for the stances they cultivate from them. Resolving this taxonomic confusion clears the ground for more precise theories of rational action and moral psychology.
