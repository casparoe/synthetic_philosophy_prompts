      The core mechanism is the Companion Post. For every role a publisher automates, they must fund a post of identical hours, grade, and pay whose output is contractually required never to be used by anyone. We call this the sterile-output clause. If a machine writes the marketing copy, a human must be employed to write parallel copy that is deleted upon submission. The pitch is straightforward. If what work gives you is structure, a place to be at nine in the morning, and the feeling that someone is waiting on you, then none of that depends on the utility of the product. Guaranteeing that the output is worthless is the whole point. It proves you are kept on for yourself and not merely as a means. We are proposing a ratio of 1.15 companion posts to every automated role to account for sick leave and training, ensuring the dignity buffer never dips below full capacity.

