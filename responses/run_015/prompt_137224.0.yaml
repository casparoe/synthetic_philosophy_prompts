answer: |-
  Here is the plan. It is designed to be delivered with a marker and a whiteboard, zero slides, zero handouts.

  ### 1. The Sequence (25 Minutes)

  **0:00–05:00: The Hook (The Programming Analogy)**
  *   **Action:** Write `Python` and `C` on the board.
  *   **Claim:** "If I tell you to manage memory manually for a year, you start seeing pointers everywhere. If I tell you to write in a garbage-collected language, you stop worrying about lifetimes. The tool changes the workflow."
  *   **Pivot:** "Linguistic Relativity is the claim that natural language does this to *cognition*, not just workflow. But it is not a compiler. It is an API you cannot switch off."
  *   **Goal:** Establish the intuition without committing to the mechanism yet.

  **05:00–10:00: The Core Example (Spatial Frames)**
  *   **Action:** Draw a table. Draw a stick figure sitting at it. Draw a cup on the table.
  *   **Setup:** "In English, I say 'The cup is to the *left* of the plate.' This is **egocentric**. It depends on where *I* am facing."
  *   **The Twist:** "There are languages where 'left' does not exist. They only use **cardinal** directions (North/South/East/West) for everything. Even on a table. Even in a dark room."
  *   **The Whiteboard Test:** Draw the stick figure spinning 180 degrees. "In English, the cup moved from left to right. In this language, the cup is still North. The speaker must know where North is *constantly* to speak grammatically."
  *   **Goal:** Show that grammar forces a specific, continuous cognitive background task.

  **10:00–15:00: The Break (Where the Analogy Fails)**
  *   **Action:** Draw a line between "Code" and "Language."
  *   **The Break:** "In code, I can write a Python script that mimics C. It's just verbose. In language, if my grammar requires me to mark the *source* of my information (e.g., 'I saw it' vs. 'I heard it') on every verb, I cannot 'mimic' a language that doesn't."
  *   **The Point:** The programming analogy suggests *constraint* (I can't do X). Linguistic relativity suggests *habit* (I am constantly doing Y).
  *   **Goal:** Move from "Language prevents thought" (False) to "Language trains attention" (The Claim).

  **15:00–20:00: Misconception Management**
  *   **Action:** Write three headers: *Vocabulary*, *Color*, *Determinism*.
  *   **Vocabulary (The Snow Myth):** Cross it out. "This isn't about having more words. It's about obligatory categories. English forces you to mark tense (past/future). Some languages force you to mark evidence. Neither is 'richer'."
  *   **Color (The Refutation Myth):** "You may have heard color research killed this theory. It killed the *strong* version (language makes color perception impossible). We are discussing the *weak* version (language makes color discrimination faster/slower)."
  *   **Determinism:** "Language does not jail you. It just charges a 'tax' on thinking outside its patterns."

  **20:00–25:00: The Check (Evidentiality)**
  *   **Action:** Present the "Evidentiality" feature (see below).
  *   **Goal:** Verify they understand the mechanism (obligatory attention), not the outcome (zombie determinism).

  ---

  ### 2. The Core Example: Specifications

  You need **one** example to carry the load. Do not use color. Do not use time. Use **Spatial Reference Frames**.

  **What it must have:**
  1.  **Obligatory Encoding:** You cannot form a sentence like "The cup is there" without encoding the spatial relation.
  2.  **Non-Egocentricity:** The coordinate system must not rely on the speaker's body (left/right). It must rely on the environment (North/South or Upstream/Downstream).
  3.  **Small-Scale Application:** It must apply to small objects (cups on tables), not just navigation (hiking in the woods). This proves it affects immediate perception, not just travel.

  **What it must lack:**
  1.  **Vocabulary Counting:** Do not mention they have "more words" for direction. They have *fewer* words (no left/right), but more obligatory usage.
  2.  **Physical Superiority:** Do not imply they are "better" at navigation. Imply they are *differently oriented*.
  3.  **Exoticism:** Do not frame this as "primitive" or "mystical." Frame it as "a different configuration of the same hardware."

  ---

  ### 3. The Programming Analogy: Handling the Break

  Your instinct is correct: use the programming analogy. It is the only way to bootstrap the intuition without jargon. However, it manufactures a specific misconception you must dismantle.

  **The Misconception the Analogy Manufactures:**
  **The "Compiler Error" Fallacy.**
  Engineers assume that if a language lacks a feature, you cannot implement the logic. (e.g., "If Java doesn't have pointers, I can't do memory management.")
  *   *Risk:* They will think Linguistic Relativity means "If a language has no future tense, they cannot conceive of tomorrow."
  *   *Correction:* This is the **Strong** (deterministic) Whorfianism, which is generally rejected.

  **How to make the break the teaching point:**
  At minute 10, explicitly state: **"In engineering, the stack is optional. In cognition, the stack is involuntary."**
  *   **The Analogy:** Writing Rust vs. Python.
  *   **The Break:** You can write Pythonic Rust. You can write Rusty Python. The cost is just performance or verbosity.
  *   **The Reality:** You cannot speak "Pythonic Guugu Yimithirr." If the grammar demands a cardinal direction, and you don't know it, you cannot speak. Therefore, your brain solves the "where is North?" problem *automatically* and *pre-consciously* to allow speech.
  *   **The Lesson:** Linguistic relativity is not about *capability* (can I think it?); it is about *overhead* (how much cognitive tax do I pay to think it?).

  **Handling the Computational Frame:**
  Do not attack the "Thought = Data, Language = Encoding" frame early. **Borrow it.**
  *   Say: "Think of language as the schema for your mental database."
  *   Then pivot: "In a normal DB, the schema doesn't change what data exists. In the brain, the schema changes what data gets *indexed*."
  *   This validates their mental model while shifting the mechanism from *storage* to *indexing*.

  ---

  ### 4. Misconceptions: Expected vs. Manufactured

  **Expected (Handle in min 15:00–20:00):**
  1.  **Vocabulary Limiting Thought (Snow Myth):** Head off by emphasizing *grammar* over *lexicon*. It's not that they have 50 words for snow; it's that their verbs require information about the state of the snow.
  2.  **Color Research Refutation:** Head off by distinguishing *perception* (eyes) from *cognition* (memory/sorting). The research showed eyes work the same; brains sort faster when language matches the boundary.

  **Manufactured by the Programming Analogy:**
  **The "Linter" Fallacy.**
  *   *The Misconception:* Because linters catch errors before compile, engineers will think language *prevents* incorrect thoughts.
  *   *Why it happens:* The analogy frames language as a constraint system (types, borrow checker).
  *   *The Fix:* Explicitly state: "Language is not a Linter. It is a **Profiler**." It doesn't stop you from running the code; it tells you which functions are consuming the most CPU. It highlights certain cognitive paths as "cheap" and others as "expensive."

  ---

  ### 5. The Final Check (Last 5 Minutes)

  Your idea (hand them a feature, ask about behavior) is good, but "non-linguistic behavior" is too vague. Engineers will guess randomly. You need to constrain the solution space to test if they understand the *mechanism* (obligatory attention).

  **The Improved Check:**
  **The "Evidentiality" Ticket.**
  1.  **Write on Board:** "Language X requires a suffix on every verb indicating how you know the information:
      *   `-a`: I saw it directly.
      *   `-b`: I heard it from someone else.
      *   `-c`: I inferred it from evidence."
  2.  **The Task:** "You are testing speakers of Language X on a memory task. They witness a crime. Later, you ask them to recall details. What is the specific *bias* you expect in their testimony compared to English speakers?"
  3.  **Pass Criteria:** They do **not** say "They remember better." They **do** say "They will have better memory of the *source* of the information (who told them vs. what they saw) because their grammar forces them to tag that metadata at the moment of encoding."
  4.  **Fail Criteria:** If they say "They can't lie" or "They remember the visual details better." (The grammar tags the *source*, not the *content*).

  **Why this works:** It maps to engineering concepts (logging, provenance, metadata) without relying on the spatial example you just used. It tests if they understand that language forces *categorization at the point of entry*.

  ---

  ### 6. The Exclusion List (Say this out loud)

  To keep this to 25 minutes and avoid the "actually..." interruptions, explicitly list what you are **not** doing. Write this on the corner of the board at the start.

  **"Out of Scope for Today:"**
  1.  **Strong vs. Weak Whorfianism:** "We are not debating if language *imprisons* thought. We are discussing if it *biases* attention."
  2.  **Neuroscience:** "We are not looking at fMRI scans. We are looking at behavioral outputs."
  3.  **Specific Study Citations:** "I am not citing authors or years. I am citing structural features of languages."
  4.  **Prescriptivism:** "This is not about which language is 'better.' A language requiring cardinal directions is not superior to one requiring relative directions; it just solves a different coordination problem."

  **Why say this?** It immunizes you against the one person in the room who read a pop-sci article on this five years ago and wants to correct your definition of "Strong Whorfianism." It frames the session as a *design review* of a concept, not a *lecture* on truth.
