      *   **Awareness vs. Action:** Recognizing the cage is necessary but not sufficient. The wasp doesn't recognize the loop. The user does. This proves the *capacity* for agency. However, if the user *knows* it's harmful and does it anyway due to fear ("edifice collapses"), the agency is being voluntarily surrendered to the anxiety. Freedom is the ability to act contrary to the impulse based on reason.
