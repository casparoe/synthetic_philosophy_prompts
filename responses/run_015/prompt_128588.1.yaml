  The fear that altering the routine constitutes the "impulsive flexibility" that caused your previous collapse conflates discipline with rigidity. Flexibility driven by the avoidance of discomfort is indeed impulsive, but flexibility driven by strategic adaptation to preserve long-term function is the essence of resilience. Continuing to run through pain is not discipline; it is a compulsion driven by the anxiety of breaking the chain, which replicates the burnout dynamic you sought to escape. Suspending the run to heal and restructuring the writing block to regain quality are not failures of commitment, but acts of stewardship that prove you control the routine rather than serving it.
