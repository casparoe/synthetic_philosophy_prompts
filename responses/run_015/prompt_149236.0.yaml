answer: |-
  **Artifact Politics Inc.**
  **Role:** Senior Ontological Engineer
  **Location:** Remote / Cloud-Adjacent
  **Salary:** $180,000–$240,000 (contingent on ontological commitment)

  **About Us**
  Artifact Politics Inc. builds alignment artifacts. We operate on the premise that values are not policy add-ons but structural load-bearing elements. Our biometric gatekeeping hardware and AI reward-model architectures do not merely facilitate access; they enforce specific value distributions through technical architecture. We are looking for an engineer who understands that a door is not a suggestion. You will ensure our products possess intrinsic political properties independent of social context, documenting those properties in design specs without allowing interpretive flexibility. If you believe users negotiate meaning, do not apply. We build bridges that do not care about the truck.

  **Responsibilities**
  *   Codify exclusionary statistics as architectural inevitabilities rather than implementation errors.
  *   Audit reward models to ensure social context is deprecated in production environments.
  *   Prevent interpretive flexibility in interface constraints; no reinterpretation permitted.
  *   Resolve disputes between failed uploads and replacements without acknowledging personal identity continuity.
  *   Maintain design specs where politics are fixed features, not contingent social closures.

  **Benefits**
  *   Comprehensive health coverage (subject to biometric verification).
  *   Ontological Rigidity Bonus for successful deployment of non-negotiable access controls.
  *   Professional development budget for studying causal mechanisms over user narratives.
  *   Stock options vested in hardware, not software patches.
  *   A workplace culture where artifacts speak louder than stakeholders.

  **A Day in the Life**
  09:00 AM: Review ticket #892. Facial-recognition access gate systematically fails for specific demographic cluster.
  09:15 AM: Determine if failure is a bug or a boundary condition.
  09:30 AM: Consult spec sheet. Confirm statistical prior is functioning within designed tolerance.
  10:00 AM: Replace failed upload hash with new exclusionary parameter.
  10:15 AM: Close ticket. Do not query subject regarding personal continuity or lived experience. The gate has decided.
  11:00 AM: Meeting with Product. Discuss whether the architecture embodies a prior or merely implements one. Document consensus as absolute truth.

  **Required Engineering Philosophy Essay**
  As part of the application, please submit a 500-word statement addressing the following scenario: A facial-recognition access gate systematically denies entry to a specific demographic. Is this exclusion politically neutral because it is merely implementing a statistical prior, or is it politically loaded because it embodies an architecture of exclusion? Treat both answers as equally valid engineering philosophies, but argue why only one is compatible with shipping code. Do not cite external scholars. Define politics as a function of latency and throughput.

  **Equal Opportunity Employer**
  Artifact Politics Inc. is an Equal Opportunity Employer. We celebrate diversity and are committed to creating an inclusive environment for all employees. Please note that equal opportunity is subject to successful authentication via biometric gatekeeping hardware, which operates on fixed statistical priors independent of social context. If the artifact does not recognize you, the opportunity remains equal, but the access is denied.
