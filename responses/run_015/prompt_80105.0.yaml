answer: |-
  You have put your finger precisely on the nerve of the matter. The distinction you draw between underdetermination (an epistemic limitation regarding evidence) and indeterminacy (an ontological claim regarding reality) is not merely a nuance; it is the very hinge upon which Quine's argument turns. Many introductory expositions do indeed gloss over this, presenting the 'gavagai' example as a simple sceptical puzzle about evidence, when Quine intends it as a metaphysical thesis about the non-existence of meanings as entities.

  To understand why Quine believes the first claim (underdetermination) entails the second (indeterminacy), and why he refuses to appeal to the native's mental states to resolve it, we must look at his commitments to **behaviourism** and **naturalism**.

  ### The Leap from Epistemic to Ontological

  For Quine, the move from 'we cannot tell' to 'there is nothing to tell' rests on a specific criterion for what constitutes a 'fact of the matter'. Quine is a naturalist; he believes that philosophy is continuous with science. Consequently, he adopts a physically grounded ontology. For there to be a fact of the matter, there must be some physical state of affairs that makes a proposition true.

  In the case of translation, the only physical facts available to the linguist are the native's dispositions to verbal behaviour in response to sensory stimuli. Quine argues that meaning is not a ghostly entity hovering behind the word; it is constituted entirely by these public, observable dispositions.

  Therefore, the leap works like this:
  1.  **Premise 1:** The meaning of a term is exhausted by its role in observable behaviour (methodological behaviourism).
  2.  **Premise 2:** All possible observable behavioural evidence is compatible with multiple, incompatible translation manuals (underdetermination).
  3.  **Conclusion:** There is no further fact—behavioural or physical—that could privilege one manual over the other. Therefore, there is no fact of the matter (indeterminacy).

  If you accept Premise 1, the conclusion follows. If meaning *just is* behavioural disposition, and the dispositions are identical for 'rabbit' and 'rabbit-stage', then the meanings are identical, or rather, the distinction between them lacks a truth-maker. Quine is not saying we are ignorant of the true meaning; he is saying the notion of a 'true meaning' beyond the behavioural evidence is meaningless.

  ### Why Not Appeal to Mental States?

  This brings us to your crucial question: why does Quine not simply posit that the native's internal mental state determines the meaning? If the native thinks *rabbit*, surely that settles it, even if their behaviour doesn't show it?

  Quine rejects this for two primary reasons, both rooted in his rejection of what he famously called the **'museum myth'**.

  **1. The Rejection of Intensional Entities**
  Quine argues that appealing to mental states treats meanings as objects in a mental museum, where words are merely labels attached to these objects. For Quine, this is occult. It posits a realm of 'intensional' entities (meanings, propositions, ideas) that are not reducible to physical facts. Since Quine is committed to a physicalist ontology, he refuses to admit facts that cannot be cashed out in terms of physical stimuli and physical responses. To say 'the native means rabbit' is, for Quine, merely a shorthand for 'the native is disposed to assent to "gavagai" in the presence of rabbits'. If the dispositions are ambiguous, appealing to an inner 'meaning' adds nothing but a mysterious ghost in the machine.

  **2. Mental States are Themselves Indeterminate**
  Even if we grant the existence of neural states (which Quine accepts as physical), Quine argues that identifying a neural state *as* a meaning requires interpretation. Suppose we open the native's skull and observe a specific neural firing pattern when a rabbit passes. How do we know that neural pattern represents 'rabbit' rather than 'rabbit-stage'? To interpret that neural pattern as having semantic content, we must already have a translation manual. We are back where we started. The neural state does not wear its meaning on its sleeve; it must be interpreted, and that interpretation is itself subject to the same indeterminacy.

  In short, for Quine, mental states do not solve the problem because they are not accessible facts that stand outside the web of translation. They are either behavioural dispositions (which are underdetermined) or physical states (which do not intrinsically carry semantic content).

  ### Is This Defensible?

  Is this leap from epistemic to metaphysical defensible? That remains one of the most contentious issues in twentieth-century philosophy.

  **The Case Against Quine**
  Critics, most notably Noam Chomsky, argue that Quine conflates **evidence** with **truth**. Chomsky posits that humans possess an innate universal grammar and a rich internal cognitive structure. On this view, the fact that behavioural evidence underdetermines translation does not mean meaning is indeterminate; it merely means behaviour is a poor proxy for the rich computational states of the mind. For Chomsky, the 'fact of the matter' lies in the native's internal linguistic competence, not merely their overt performance. To deny this is to embrace an overly austere behaviourism that ignores the cognitive revolution.

  Furthermore, philosophers like John Searle have argued that Quine ignores **first-person ontology**. I know what *I* mean when I say 'rabbit'. I have conscious intentional states. To suggest there is no fact of the matter about my own meaning seems absurd. Quine would reply that first-person authority is not immune to error and does not constitute a public fact suitable for a science of linguistics, but many find this dismissal of subjective experience unsatisfactory.

  **The Case For Quine**
  However, Quine's position has a certain austere elegance. It forces us to confront how we verify claims about meaning. If two translation manuals predict all possible behaviour perfectly, including all hypothetical counterfactuals, what work is the 'real meaning' doing? If it makes no difference to practice, prediction, or physical state, Quine asks, is it not merely a metaphysical excess? In this sense, his move is defensible if one accepts a verificationist or strict naturalist criterion for existence.

  ### Conclusion

  Quine thinks he can make the leap from underdetermination to indeterminacy because he denies that there is any 'meaning' over and above the behavioural dispositions that constitute it. He refuses to appeal to mental states because he views them either as behavioural dispositions (which are already exhausted by the evidence) or as physical states (which do not inherently possess semantic properties).

  Whether this is a profound insight into the nature of language or an overreach born of an overly restrictive behaviourism depends largely on whether one accepts that the physical and behavioural exhaust the realm of facts. If you believe, as Chomsky does, that the mind contains rich, structured information that outruns behavioural evidence, then Quine's indeterminacy is false, and underdetermination remains merely epistemic. But if you share Quine's suspicion of 'inner theatres' and demand that facts be publicly verifiable, then his conclusion that there is 'no fact of the matter' follows with grim logic.
