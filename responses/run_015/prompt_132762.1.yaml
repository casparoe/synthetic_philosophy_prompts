answer: |-
  Good morning. Welcome to all of you.

  Looking around this room, I see a divide that is, in theory, quite sharp. On one side, we have philosophers of probability and epidemiologists—those who study the structure of uncertainty and the design of the cohorts that measure it. On the other, we have clinicians—those who sit across from patients and must translate that uncertainty into a plan for living or dying.

  Usually, workshops like this aim to bridge that gap by teaching one side the language of the other. We often assume the barrier is translation: that if clinicians understood statistics better, or if statisticians understood clinical constraints better, the friction would vanish.

  I am here to suggest that the friction is not a failure of translation. It is a feature of the terrain.

  I want to begin by telling you why this workshop is not just professional for me, but personal. Recently, my sister was diagnosed with a malignancy. Like many of you have likely seen, she was handed a survival statistic. It was a number drawn from a cohort defined by her age and her disease stage. It was a "precision" estimate.

  But I work in this field. So, I looked at the literature. I found that if I changed a single inclusion criterion—specifically, whether prior autoimmune conditions were excluded from the reference cohort—her apparent risk profile shifted by a factor that felt clinically decisive. In one class, she was a candidate for aggressive intervention; in the other, the toxicity profile outweighed the benefit.

  I looked for a rule. I looked for a principled method to determine which partition was the *correct* one for her. I found none. There was no statistical law that dictated whether her autoimmune history was a relevant property for classification or a noise variable to be averaged out.

  I tell you this not to solicit sympathy, but to locate the problem we are here to discuss. We call this the Reference Class Problem. For the philosophers in the room, you recognize this immediately. It is the Reichenbachian dilemma: an individual belongs to an infinite number of classes, each with a different frequency of the attribute in question. To assign a single-case probability, we must select one class. But on what grounds?

  For the clinicians in the room, you recognize this differently. You do not call it the Reference Class Problem. You call it Tuesday. You call it the moment a patient asks, "But what does this mean for *me*?" and you feel the weight of the gap between the population curve and the human being sitting in front of you.

  We often dismiss this tension as statistical illiteracy. We tell ourselves that if we just had bigger data, or better algorithms, or more granular genomics, the classes would narrow until the individual and the statistic merged. This is the promise of "precision" medicine.

  But I believe that promise is, in part, a mirage. Even with infinite data, the question remains: which properties justify assigning an individual to one statistical class rather than another? Is it causal relevance? Is it predictive accuracy? Is it clinical actionability?

  This is not a statistical question. It is a normative one.

  When we choose a reference class, we are not merely describing the world; we are deciding which features of a person's life count as medically significant. In my sister's case, deciding whether her autoimmune history mattered was not a calculation; it was a judgment call about what kind of risk we were willing to tolerate.

  This is why I have convened this specific group.

  To the philosophers and epidemiologists: We need you to recognize that this is no longer a paradox confined to journals of epistemology. When the reference class is underdetermined, the choice of class dictates treatment. The "correct" probability is not waiting to be discovered; it is being constructed by the choice of cohort. We need frameworks that acknowledge this construction rather than hiding it behind p-values.

  To the clinicians: We need you to recognize that your discomfort is not a lack of expertise. It is a rational response to an ontological gap. You are being asked to act on numbers that claim to be objective but rest on subjective classifications. We are not here to give you a calculator that removes the burden of judgment. We are here to ask if there is a way to share that burden more honestly.

  Our purpose over the next two days is not to solve the Reference Class Problem. I do not believe it is solvable in the way we might solve an equation. If I promised you a resolution, I would be offering you the same false comfort that the survival statistic offered my sister.

  Instead, our purpose is to ask: When the correct reference class is genuinely underdetermined, what guides us?

  Is there an ethical framework for selecting a class? Should we choose the class that maximizes hope, or the one that minimizes regret? Should we communicate the instability of the number to the patient, or does that undermine the trust required to treat them?

  We are here to explore whether we can build a practice of risk communication that admits uncertainty not as a temporary lack of data, but as a structural reality of individual care.

  I want us to leave this room without false comfort. I want us to acknowledge that sometimes, there is no right number. But I also want us to find that there is still a right way to speak, a right way to decide, and a right way to stand with a patient when the statistics run out.

  The philosophers have the tools to analyze the justification of belief. The clinicians have the tools to navigate the necessity of action. Precision medicine needs both, not to eliminate the ambiguity, but to bear it together.

  Thank you. Let us begin.
