      *   *Rule C (Dr. A's Likely Actual Rule - "Coupling + Agency Boundary"):* Strong functional coupling is necessary but not sufficient. The resource cannot be another *agent's* cognitive system (Case 9). Also, the access must be transparent (Case 8 vs 4).

      *   *Divergence Point:* The Sister Link. Parity says if it feels like my memory, it is. Agency/Case 9 says if it belongs to another person, it's not *my* mind, it's *our* system.
      *   *Divergence Point 2:* The Effort. Parity says if it works, it works. Transparency rule says if I have to interpret it (Calculator), it's not part of me. M's "effortful" replay is the testing ground here.

  8.  **Drafting the Response (incorporating American English):**
      *   *Tone:* Professional, analytical, supportive (supervision prep).
