      *   *Individual vs. Group?* Crucial distinction (Case 9). The boundary of the *individual* mind is preserved even in distributed systems.

      *   *Proposed Rule:* **The "Transparent Trust" Criterion.** For an external resource to count as part of an *individual's* extended mind, it must be (a) reliably integrated into habitual cognitive routines (stability), (b) accessed with a high degree of automaticity/transparency (low cognitive load/interpretation), and (c) treated with the same default trust as internal memory (endorsement). Crucially, the resource must be *subservient* to the individual's cognitive agency, not a separate agent (Case 9).

