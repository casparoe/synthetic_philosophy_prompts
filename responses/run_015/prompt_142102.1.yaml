      *   *Refining the "Rule":* Dr. A seems to be a **Vehicle Externalist** who respects the **Agency Boundary**. She accepts tools (notebooks, canes) but rejects other minds (spouse) and mere causal aids (caffeine). She values **Transparency** (Cane/Tetris = Yes; Calculator = No).
      *   *The "Effort" Wrinkle:* M's replay is "effortful." Case 8 (Calculator) was No because of "attended interpretation." Case 1 (Otto) was "without deciding to." M's case is in between. "Straining for a name" is internal, so if the device mimics that specific phenomenology, Dr. A might accept it. But if it requires *reading* data, it's a Calculator. The prompt says "replay arrives as something very like ordinary recall." This leans toward Yes.
