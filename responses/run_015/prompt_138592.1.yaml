  Hey, I need a hand with something for a seminar I'm taking. We went over van Fraassen's Reflection principle last week, and I came out of the session with the feeling that everyone kept sliding between two quite different claims as if they were the same claim, and I want to see how strong the case is for one side of that. So: please role-play as a formal epistemologist who's spent years working on diachronic rationality, think it through carefully, and argue as forcefully as you can for the following position. The real content of Reflection is the weak no-expected-change condition: your current credence in a proposition H should equal your current expectation of your later credence in H, i.e. your credences should be a martingale and you shouldn't now be able to predict which direction you'll later drift in. The strong deference formulation — the familiar one saying that conditional on your later credence in H being x, your current credence in H should already be x — is an extra commitment that does independent, unsound work and should be dropped. Before you launch in, spend a bit of unstructured brainstorming on which formulation seems to be doing which work, then commit; and please don't just write down both conditions, note that one entails the other, and call it a day. If it helps, you can grant for the sake of argument that the diachronic Dutch book motivation for Reflection is sound, and then argue about what it actually buys you.

  Two things I want you to engage with rather than talk around. First, the case I made up that got me going on this: tomorrow you'll be put in a room and asked your credence in some fixed hypothesis H, where your current credence is 0.5. Unknown to you at the time, the room's lighting will be set by a coin flip that is completely independent of H, and you know from previous runs of the experiment that green lighting reliably pushes your credence in whatever you're asked about up to 0.7 and blue lighting pushes it down to 0.3, in a way that will feel utterly subjectively compelling when it happens. Since the coin is fair, your expectation of your later credence is 0.5 and the weak condition is perfectly happy. But the strong condition seems to say that conditional on your later credence being 0.7, your credence now should be 0.7, which looks crazy given that the lighting has nothing to do with H. Use this to make the case that deference is a hostage to the reliability of your future self in a way the martingale condition isn't. If you think there's also something self-undermining or fixed-point-ish about the strong version when you can in principle read off your own future credence, develop that too, though I couldn't quite make it precise myself.

  Second, the wrinkle I can't shake. Once you've got the weak condition as the real thing, it has to be stated somehow in cases where you're unsure how many future judgment-events there will be — the Sleeping Beauty style setup where you might be woken once or twice with an amnesia drug in between. As far as I can tell there are two natural generalizations: you can average your future credences over your self-locating uncertainty (so the weights over credences sum to one), or you can sum, over each occasion on which you'll actually form a credence, the uncentered probability that that occasion occurs times the credence you'll have then. And if my arithmatic is right these come apart, and they appear to line up with the halfer and thirder answers respectively, so that choosing between them looks like it settles the Sleeping Beauty dispute as a side effect. Argue for the event-weighted version, tell me whether it really is satisfied by thirders and violated by halfers or whether I've messed it up, and argue that the fact that it takes a stand there is a point in its favor rather than a reductio of the whole approach. I'd like something I could turn into a ten-minute response in class, so concrete steps in the reasoning matter more to me than hedges.
