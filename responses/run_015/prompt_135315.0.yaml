prompt: |-
  I am drafting the allocation rule for a public body, and I want the specification settled before I look at how the philosophical literature answers it, so that I don't inherit that literature's blind spots about the use I have in mind.

  The setting. The body distributes a fixed stock of goods and burdens once, to a known set of claimants, and cannot take anything back afterwards. It cannot observe the claimants' mental states and cannot ask them; it has records of what they have, what they can do, and what has been done to them. It must give every unsuccessful claimant a written statement of why their claim ranked where it did. And its allocations partly determine who the next round's claimants will be, because housing, training and care allocations affect which households form and which people arrive. I am not asking whether equality is the right aim for this body; that is settled by statute. I am asking what the currency of equality would have to be like for this body to be able to use it.

  What I want is the requirements list: what any candidate currency — a candidate answer to the question of what, exactly, is to be equalized — must be able to do, with the case behind each requirement, and with each requirement marked as non-negotiable given my setting, negotiable, or a prejudice imported from some other use a theory of equality might be put to.

  The cases I am confident a currency must handle, stated in my own terms:

  Two claimants receive identical bundles, and one needs far more than the other to get to the same point — an impairment, a chronic condition, a caring responsibility. The currency must register the difference in what bundles do for people without simply collapsing into how satisfied those people report or appear to be.

  Three claimants each end up wanting something very expensive. The first cultivated the taste deliberately, with full information and no pressure. The second acquired it because the body itself supplied the means in an earlier round — learned to sail on a publicly funded boat, say. The third no longer wants much of anything, and wanted progressively less across a long period of being given very little. The currency must say which of these generate claims, and in particular must tell me how the second case differs from the third, since both involve aims that the allocation itself helped produce.

  What a claimant can do with a share depends on what others are given — a place in a programme, a priority date, a permit, a house on a particular street. So I need to know whether the currency has to be assessable on a pair of claimants in isolation, or whether it only has a verdict once the whole distribution is known; the body sometimes has to decide between two claimants before it knows the rest of the population.

  Provision moves the baseline. Once lifts, ramps and interpreters are supplied, what counts as an ordinary share of access changes for everyone, including people whose access was never at issue. The currency must say whether its standard is anchored to a pre-allocation baseline or floats with what is actually provided, since a floating standard lets a body appear to equalize by redefining the target.

  The written statement is itself part of the allocation. If the currency is a mental state, announcing a verdict perturbs what is being measured — being told one counts as badly off can make a person worse off. I want to know whether robustness to being announced is a genuine requirement or only a problem for one family of currencies.

  And because allocations determine who the future claimants are, the currency must permit comparisons across alternatives whose claimant-sets are not the same, and must say what to conclude when the people who would be worst off under one alternative simply do not exist under the other.

  Beyond the list, three things. Flag any pair of requirements you think cannot be jointly satisfied — that is the part I most want, since it would mean my statute asks for something incoherent. Tell me which single requirement does the most work in excluding otherwise attractive candidates. And say which of the requirements are really about the currency and which properly belong to the procedure, the timings, or the unit of assessment — whether the currency attaches to individuals, households, or something else, and what it is to do with a household whose members will not say how unevenly the share is divided inside it.

  Only then, and in a short paragraph each, how the three familiar families — currencies pitched at states of a person, at the means a person holds, at what a person is substantively free to do and be — do against the list. I do not need names, dates or reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Draft a requirements list for a "currency of equality" suitable for a specific public body allocation setting.
      *   **Setting Constraints:**
          *   Fixed stock, one-off distribution (but affects future claimants).
          *   Known claimants.
          *   No taking back.
          *   No observation of mental states (no asking).
          *   Records available (assets, capabilities, history).
          *   Must provide written reasons to unsuccessful claimants.
          *   Allocations affect future population formation (housing, training, care).
          *   Statutory aim: Equality (already settled).
      *   **Specific Cases to Handle:**
          1.  Differential needs/impairments (identical bundles $\neq$ equal outcome).
          2.  Expensive tastes (cultivated vs. induced by body vs. adaptive preferences).
          3.  Interdependence/Context (value depends on others' allocation; partial decision making).
          4.  Baseline Drift (provision changes what counts as "ordinary").
          5.  Announcement Effect (written reasons affect the metric if it's mental).
          6.  Future Population (different claimant sets across alternatives).
      *   **Output Requirements:**
          *   List of requirements with case justification and status (Non-negotiable, Negotiable, Prejudice).
          *   Flag incompatible pairs (incoherence check).
          *   Identify the most exclusionary requirement.
          *   Distinguish currency requirements from procedural/unit requirements.
          *   Brief evaluation of three familiar families (States, Means, Freedoms) against the list.
          *   Constraint: No names, dates, or reading references (philosophical anonymity).

  2.  **Deconstruct the Cases into Requirements:**

      *   *Case 1 (Impairment/Needs):* Identical bundles yield different results.
          *   *Requirement:* **Conversion Sensitivity.** The currency must account for individual ability to convert resources into functioning.
          *   *Status:* Non-negotiable (Statute says equality, identical bundles fail this).

      *   *Case 2 (Expensive Tastes/Adaptive Preferences):* Distinguishing responsibility for preferences.
          *   *Requirement:* **Responsiveness to Agency/History.** The currency must distinguish between preferences formed autonomously, induced by the state, or via oppression/adaptation.
          *   *Status:* Non-negotiable (Otherwise the body incentivizes manipulation or punishes adaptation).

      *   *Case 3 (Interdependence/Partial Info):* Value depends on others; decisions made before full population known.
          *   *Requirement:* **Context Independence (or Computability).** The currency must be calculable without knowing the full final distribution, or the procedure must allow hold-backs (but setting says "cannot take back" and "once"). This is tricky. If the value depends on others, you can't assess in isolation.
          *   *Refinement:* The requirement is **Decidability under Partial Information.**
          *   *Status:* Non-negotiable (Operational necessity).

      *   *Case 4 (Baseline Drift):* Provision changes the standard.
          *   *Requirement:* **Baseline Stability.** The metric must not shift simply because the average provision shifts.
          *   *Status:* Non-negotiable (Otherwise equality is illusory).

      *   *Case 5 (Announcement Effect):* Written reasons affect mental states.
          *   *Requirement:* **Measurement Robustness.** The act of measuring/announcing must not alter the metric significantly.
          *   *Status:* Non-negotiable (Due to the written statement constraint).

      *   *Case 6 (Future Population):* Allocations change who exists/claims next time.
          *   *Requirement:* **Cross-Person Comparability across Populations.** The currency must allow comparison between scenarios with different sets of people.
          *   *Status:* Non-negotiable (Due to the setting's feedback loop).

  3.  **Drafting the Requirements List (Iterative Refinement):**

      *   *Req 1: Conversion Sensitivity.* (From Case 1). Non-negotiable.
      *   *Req 2: Responsibility Sensitivity.* (From Case 2). Non-negotiable.
      *   *Req 3: Observability.* (From Setting "cannot observe mental states"). Non-negotiable. *Wait, this is a setting constraint, not a currency requirement per se, but it dictates the currency type.* Let's frame it as **Public Verifiability.**
      *   *Req 4: Context Independence.* (From Case 3). This is hard. If value is relative, currency can't be absolute. Let's call it **Local Assessability.** Non-negotiable.
      *   *Req 5: Baseline Invariance.* (From Case 4). Non-negotiable.
      *   *Req 6: Announcement Stability.* (From Case 5). Non-negotiable.
      *   *Req 7: Variable Population Comparability.* (From Case 6). Non-negotiable.

      *   *Wait, check for "Prejudice".* Some theories might say "Responsibility Sensitivity" is a prejudice if equality is strictly about outcomes regardless of choice. But given the "expensive tastes" case and the public body context (stewardship), it seems non-negotiable for *this* body. However, distinguishing "induced by body" vs "adaptive" is very hard. I should mark Responsibility as Non-negotiable but note the difficulty.
      *   *Check for "Negotiable".* Maybe Baseline Invariance? If the statute implies a relative standard of living. But the prompt says "floating standard lets a body appear to equalize by redefining the target." So Invariance is Non-negotiable.
      *   *What is a Prejudice?* Perhaps the idea that the currency must attach to *individuals*. The prompt asks me to distinguish this later. I shouldn't list "Individualism" as a requirement yet.

  4.  **Analyzing Incompatibilities (The "Incoherence Check"):**

      *   *Conflict 1: Responsibility Sensitivity vs. Observability.* To judge responsibility (cultivated taste vs. adaptive), you usually need mental states (intent, pressure). The setting forbids observing mental states.
      *   *Conflict 2: Local Assessability vs. Context Dependence.* Case 3 admits value depends on others. But Req 4 demands Local Assessability. If the currency is "status relative to others," you can't assess locally.
      *   *Conflict 3: Announcement Stability vs. Mental States.* If the currency is welfare, announcing low welfare lowers welfare. This rules out welfare currencies, but isn't an internal contradiction of the requirements themselves, rather a constraint on candidates.
      *   *Major Conflict:* **Responsibility Sensitivity** (needs history/intent) vs. **Public Verifiability** (no mental states, only records). The body has records of "what has been done to them," but can it infer "cultivated deliberately" from records? Maybe. But "adaptive preferences" (wanting less because given little) is notoriously hard to distinguish from genuine contentment without asking.
      *   *Another Major Conflict:* **Local Assessability** vs. **Variable Population Comparability.** If the metric depends on the set of people (relative status), you can't compare across different sets easily without a fixed anchor. But Baseline Invariance provides the anchor.
      *   *The Big One:* **Responsibility Sensitivity** (distinguishing induced vs. adaptive preferences) vs. **Observability/Verifiability** (no mental states). This is the strongest tension.

  5.  **Identifying the Most Exclusionary Requirement:**

      *   **Public Verifiability (No Mental States).** This kills Welfare/Hedonic currencies immediately.
      *   **Responsibility Sensitivity.** This kills strict Resource Equality (doesn't care about tastes) and strict Welfare Equality (doesn't care about source of preference). It demands a hybrid.
      *   *Decision:* **Public Verifiability** is the hardest filter because it rules out the most common philosophical currencies (utility, welfare) entirely, forcing the body to use proxies.

  6.  **Distinguishing Currency vs. Procedure/Unit:**

      *   *Currency:* What is measured (e.g., access, capability, resources).
      *   *Procedure:* How it's measured (timing, written statements).
      *   *Unit:* Who holds it (individual vs. household).
      *   *Observation:* The "Written Statement" constraint is procedural, but it imposes a **Measurement Robustness** requirement on the currency. The "Future Claimants" issue is about the *Unit of Assessment* over time (intergenerational/population ethics), but it demands the currency be **Population-Invariant**.
      *   *Household Issue:* The prompt asks about households where division is unknown. This suggests the **Unit of Assessment** is a separate variable. The currency must be **Aggregatable** or **Divisible** without loss of information.

  7.  **Evaluating the Three Families:**

      *   *States (Welfare/Mental):* Fails Observability. Fails Announcement Stability. Fails Responsibility (hard to judge source of feeling).
      *   *Means (Resources/Primary Goods):* Passes Observability. Passes Baseline Stability. Fails Conversion Sensitivity (Case 1). Fails Responsibility (Case 2 - doesn't distinguish tastes well).
      *   *Freedoms (Capability/Functioning):* Passes Conversion Sensitivity. Passes Baseline Stability (if defined well). Struggles with Observability (can we see capability without seeing mental state?). Struggles with Responsibility (which capabilities count as valuable?).

  8.  **Refining the Output Structure:**

      *   **Section 1: The Requirements List.** (Table or List format). Item, Case, Status.
      *   **Section 2: Incompatibilities.** (The "Incoherence Check").
      *   **Section 3: The Exclusionary Requirement.**
      *   **Section 4: Currency vs. Procedure/Unit.**
      *   **Section 5: Evaluation of Three Families.** (Short paragraphs, no names).

  9.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address the "Prejudice" marking? I need to be careful not to import liberal individualism if the statute doesn't demand it. However, the "written statement to claimants" implies individual standing. I will mark "Individual Attachment" as a Procedure/Unit issue, not a currency requirement.
      *   *Check:* The "Future Claimants" case. This is the "Non-Identity Problem" in philosophy. The requirement is that the currency must allow ranking of outcomes with different people.
      *   *Check:* "Local Assessability." If the value depends on others (Case 3), can we really assess in isolation? The requirement should be **Computability under Partial Information.** The currency might be relative, but the *calculation* must be possible with current data.
      *   *Check:* "Responsibility." The prompt says the body has records of "what has been done to them." This allows some historical tracking. So Responsibility Sensitivity is possible via records, not mind-reading. I will keep it Non-negotiable but note the tension with Observability.

  10. **Final Review against Constraints:**
      *   No names/dates/readings.
      *   Short paragraphs for the three families.
      *   Address the household unit question.
      *   Address the incoherence flag.

      *(Self-Correction on "Prejudice"):* I need to explicitly label some requirements as potentially imported prejudices if they aren't strictly demanded by the setting. For example, "Responsibility Sensitivity" is often debated. But given Case 2 (cultivated vs induced taste), the setting *demands* it. So it's Non-negotiable *for this setting*, even if it's a prejudice in abstract theory. I will clarify this distinction. Actually, the prompt asks me to mark requirements as "Non-negotiable given my setting, negotiable, or a prejudice imported from some other use." I should be honest. Is distinguishing cultivated vs adaptive taste *really* possible with records? If not, requiring it might be a prejudice that the body *can* do this. I will mark it Non-negotiable but flag the tension. Wait, better: Mark it Non-negotiable because the *case* demands it, even if it's hard. Mark "Individualism" as a Unit issue, not a currency requirement.

      *Re-evaluating "Prejudice":* A requirement like "The currency must be maximizable" might be a prejudice. A requirement like "The currency must attach to individuals" might be a prejudice if the statute allows household allocation. I will ensure the list focuses on what the *currency* must do, not the administrative unit.

      *Let's finalize the Incompatibility:* The strongest is **Responsibility Sensitivity** vs. **Public Verifiability**. You cannot definitively know if a preference is "adaptive" (Case 2, Claimant 3) without accessing mental states or counterfactuals, which records don't fully show. This suggests the statute might be asking for the impossible.

      *Let's finalize the Exclusionary Requirement:* **Public Verifiability.** It wipes out the entire "States" family immediately.

      *Let's finalize Currency vs Procedure:* The "Written Statement" is procedure, but creates the "Announcement Stability" requirement. The "Household" is Unit. The "One-off" is Procedure.

      *Let's write.*
answer: |-
  ### The Requirements List

  | Requirement | Case Justification | Status |
  | :--- | :--- | :--- |
  | **1. Conversion Sensitivity** | **Case 1 (Impairment):** Identical bundles must not yield equal credit if one claimant requires more to achieve the same functioning due to impairment or responsibility. | **Non-negotiable** (Setting) |
  | **2. Responsibility Sensitivity** | **Case 2 (Tastes):** Must distinguish between claims generated by deliberate cultivation, state-induced capacity, and adaptive preference (shrinking wants due to deprivation). | **Non-negotiable** (Setting) |
  | **3. Public Verifiability** | **Setting Constraint:** The body cannot observe or ask about mental states; it relies on records of assets, actions, and history. | **Non-negotiable** (Setting) |
  | **4. Computability under Partial Information** | **Case 3 (Interdependence):** Allocations affect each other's value, yet decisions must sometimes be made before the full claimant set is known. | **Non-negotiable** (Operational) |
  | **5. Baseline Invariance** | **Case 4 (Drift):** The standard of equality must not float with the average provision, or the body could equalize by lowering the floor. | **Non-negotiable** (Setting) |
  | **6. Announcement Stability** | **Case 5 (Statement):** The metric must not be significantly altered by the act of measuring and announcing the verdict in the written statement. | **Non-negotiable** (Setting) |
  | **7. Cross-Person Comparability** | **Case 6 (Future):** Must allow ranking of alternatives where the set of claimants differs (e.g., housing policy changes who is born or arrives). | **Non-negotiable** (Setting) |
  | **8. Individual Attachment** | **Implicit:** The written statement is to *claimants*. The currency must be assignable to specific legal persons. | **Prejudice** (Imported) |

  ***

  ### Incoherence Check

  There is a high-probability incompatibility between **Responsibility Sensitivity** and **Public Verifiability**.

  Case 2 requires you to distinguish the third claimant (adaptive preferences) from a genuinely contented person. Adaptive preferences are defined by a counterfactual mental state (what they *would* want under better conditions) and a causal history of psychological compression. Your setting forbids observing mental states and limits you to records of "what has been done to them." While records show the deprivation, they cannot definitively prove the internal adaptation versus genuine preference revision without accessing the mind. To satisfy Responsibility Sensitivity, you will likely have to violate Public Verifiability (by inferring mental states) or violate Responsibility Sensitivity (by treating all recorded preferences as valid). If the statute demands both, it asks for a judgment that is epistemically unavailable to your body.

  A secondary tension exists between **Computability under Partial Information** and **Conversion Sensitivity**. If the value of a share depends on what others receive (Case 3), the "conversion rate" of a good into functioning is context-dependent. You cannot calculate the conversion sensitivity for Claimant A in isolation if their functioning depends on whether Claimant B gets a permit. You may need to hold back resources until the full set is known, which conflicts with the "once" distribution constraint.

  ***

  ### The Most Exclusionary Requirement

  **Public Verifiability** does the most work in excluding otherwise attractive candidates.

  Most intuitive answers to "what is equality?" focus on how people feel, how satisfied they are, or how well their lives go from the inside. These are mental states. Because your body is forbidden from observing or asking about mental states, any currency defined by welfare, utility, satisfaction, or subjective well-being is immediately disqualified. You are forced to use external proxies (resources, opportunities, observed functioning) even if they are imperfect measures of the actual human experience. This requirement alone eliminates the largest family of equality theories.

  ***

  ### Currency vs. Procedure and Unit

  Several items on your list are not properties of the *currency* itself but of the administrative machinery surrounding it.

  *   **Procedure:** **Announcement Stability** is a constraint on the *process* of measurement, not the currency. However, it functions as a filter: if the currency is fragile (like mental states), the procedure breaks it. **Computability under Partial Information** is also procedural; a currency could be holistic (requiring full data) if the procedure allowed for provisional allocations or waiting periods, but your "once" rule makes this a currency constraint by force.
  *   **Unit of Assessment:** **Individual Attachment** is marked as a prejudice because the statute might allow household allocation. If the currency attaches to households, you face a black-box problem: you cannot see how the share is divided internally. If the currency is "household capability," you cannot satisfy **Conversion Sensitivity** for the impaired member if the able member consumes the resources. Therefore, the currency must be **Divisible** or the Unit must be the **Individual**. If you choose the Household as the unit, you must accept that Internal Equality is unmeasurable.
  *   **Timing:** **Baseline Invariance** is a temporal requirement. It demands the currency be anchored to a fixed standard over time, not just across people at one moment.

  ***

  ### Evaluation of the Three Familiar Families

  **Currencies pitched at states of a person (Welfare/Utility)**
  These fail immediately. They violate **Public Verifiability** because you cannot observe satisfaction without asking. They violate **Announcement Stability** because telling a claimant they are "low welfare" may lower their welfare. They also struggle with **Responsibility Sensitivity**; while some versions try to discount expensive tastes, they generally lack the tools to distinguish adaptive preferences from genuine contentment using only external records. They handle **Conversion Sensitivity** well in theory (since they measure the result, not the means), but the measurement is forbidden to you.

  **Currencies pitched at the means a person holds (Resources/Primary Goods)**
  These pass **Public Verifiability** and **Announcement Stability** easily; assets and records are observable and stating them does not change them. They handle **Computability under Partial Information** well, as a bundle of goods can be valued in isolation. However, they fail **Conversion Sensitivity** (Case 1); giving the same wheelchair to two people with different impairments is equal means but unequal outcomes. They also struggle with **Responsibility Sensitivity** (Case 2); they typically treat all preferences as sovereign and do not distinguish between cultivated tastes and adaptive shrinking of wants, as they focus on the goods, not the relationship between the person and the goods.

  **Currencies pitched at what a person is substantively free to do and be (Capabilities/Functionings)**
  These handle **Conversion Sensitivity** best, as they measure the real opportunity to function, accounting for impairment. They can satisfy **Baseline Invariance** if the list of valued functionings is fixed. However, they face severe difficulties with **Public Verifiability**; determining what a person is *capable* of (as opposed to what they actually do) often requires knowing their internal constraints or choices. They also struggle with **Responsibility Sensitivity**; deciding which capabilities count as "valuable" often imports a specific view of the good life, and distinguishing between a chosen non-functioning and a forced one requires access to agency that records may not show. They are the strongest fit for Case 1 but the riskiest for your operational constraints.
