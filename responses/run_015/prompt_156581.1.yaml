      *   *Constraint:* Address the "25-year bet" criteria specifically.
      *   *Constraint:* Engage with the "Answerability" framing deeply.

  8.  **Refining the Credences:**
      *   *Blame Gap:* 0.45. (Moral desert is fuzzy, legal blame is adaptable).
      *   *Sanction Gap:* 0.20. (Strict liability is robust).
      *   *Answerability Gap:* 0.75. (This is where the rubber meets the road for regulators).
      *   *User's Claim (Answerability is the key):* 0.70.
