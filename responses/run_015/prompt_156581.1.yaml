      *   *Adjustment:* However, the friend argues these are just applications of "duty of care." Is "duty to ensure interpretability" a *new* normative requirement or just a specific instance of "duty to ensure safety"? It's borderline. But the *conceptual distinction* of "Answerability" vs. "Liability" is gaining traction in philosophy of technology.
      *   *My Credence:* I'll lean towards the User (Yes), but not overwhelmingly. The legal system is absorptive. But the *conceptual* work (which the bet counts) is happening. Let's say 0.65.

  6.  **Identify Sensitivity and Uncertainty:**
