prompt: |-
  I have been asked to circulate a short position paper ahead of a graduate workshop on aggregation and the separateness of persons, and before I do I would like an audit of the set of commitments I mean to defend. My sense is that at least two of them are pulling against each other, but I cannot locate the fault line; I also suspect that at least one of the apparent conflicts is not a conflict at all, and I would rather be told that plainly than have every item flagged as equally problematic.

  The commitments:

  (a) I accept the core of the separateness objection: classical utilitarianism extends to the social whole a principle of rational choice that is at home only within a single life, and in doing so it treats the boundaries between persons as if they were merely the boundaries between the phases of one life. I want to say instead that justification is owed to each person severally, and that a loss concentrated on one person is not thereby cancelled by gains scattered thinly across many.

  (b) In the bare rescue case — five strangers down one corridor, one stranger down the other, no special ties, everything else equal — I think I am required to rescue the five, and I think both the thought that it makes no difference whom you save and the thought that I should give each of the six an equal chance are evasions.

  (c) I think I may save my own child rather than two strangers' children, and that this is not merely permissible but something it would be a kind of failure on my part to decline.

  (d) I take intrapersonal aggregation to be entirely unproblematic: I may accept a decade of chronic pain for a career that makes my life as a whole much better, and I see nothing amiss in a person prudentially discounting her own distant future.

  (e) Behind a veil of ignorance in which I have an equal chance of occupying anyone's position, I would choose by maximizing expected utility; maximin seems to me unable to handle small probabilities of large losses, and I do not want a decision rule that forbids every policy carrying a one-in-a-million risk of catastrophe.

  (f) I accept the ordinary regulatory practice of trading small risks of death against large diffuse benefits, priced at a value per statistical life, at least where the risks and the benefits fall on one population over time.

  (g) I hold a person-affecting restriction — nothing can be better or worse unless it is better or worse for someone — and I also want to say that a high-consumption, high-emissions policy wrongs future people even in the cases where the policy affects who comes to exist and those lives are worth living.

  What I want is an ordering of the genuine tensions by severity, not a list of equal-sized worries. For each pair that really is in tension, say what has to move, what the least costly revision is, and what that revision costs me elsewhere in the set. For each pair that only looks conflicting, say why it dissolves. Then tell me which single revision would clean up the most, and — since I would be reluctant to surrender either (a) or (b) — whether holding both is genuinely available to me once the rest is tidied up, or whether the tidied version is no longer the view I thought I was defending.

  One constraint: I am not asking for a bibliography. I know the literature well enough; what I cannot see is the shape of my own position.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a set of 7 philosophical commitments (a-g) regarding aggregation and the separateness of persons.
      *   **Goal:** Identify genuine tensions (ranked by severity), distinguish them from apparent conflicts, propose least costly revisions, and determine if the core view (holding (a) and (b)) remains intact after revision.
      *   **Constraint:** No bibliography. Focus on the *shape* of the position, not the literature.
      *   **User's Intuition:** Suspects at least two commitments pull against each other, and at least one apparent conflict isn't real. Wants an ordering of tensions by severity.
      *   **Non-Negotiables:** The user is reluctant to surrender (a) (Separateness of Persons/Non-Aggregation across persons) or (b) (Save the Five in Bare Rescue).

  2.  **Analyze the Commitments:**
      *   (a) **Separateness of Persons (SoP):** Anti-classical utilitarianism. No aggregating losses/gains across persons to justify sacrificing one for many. Justification owed severally.
      *   (b) **Bare Rescue:** Save the five over the one. Rejects randomness/equal chance. (Implies some form of aggregation or weighting is allowed *in extremis* or specifically in rescue cases).
      *   (c) **Partiality:** Permissible/Required to save own child over two strangers. (Agent-relative prerogatives).
      *   (d) **Intrapersonal Aggregation:** Unproblematic. Prudential rationality allows sacrificing present for future self.
      *   (e) **Veil of Ignorance (VoI):** Maximize Expected Utility (MEU). Rejects Maximin. Accepts small risks of catastrophe for large gains.
      *   (f) **Risk-Benefit Trade-offs:** Accepts VSL (Value of Statistical Life) trading. Small risks of death for diffuse benefits within a population over time.
      *   (g) **Person-Affecting + Non-Identity:** Person-affecting view (PAV) *but* claim high-emission policy wrongs future people even if non-identity applies (lives worth living).

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *(a) vs. (b):* This is the classic Williams/Scanlon vs. Utilitarianism tension. (a) says don't aggregate across persons. (b) says save the five (which implies aggregating the five lives to outweigh the one).
          *   *Severity:* High. This is the core theoretical friction.
          *   *Resolution:* Usually handled by distinguishing "justification to each" vs. "outcome goodness," or by arguing that in rescue cases, the claim of the five isn't an aggregate sum but a stronger claim based on numbers (e.g., Scanlon's "numbers count" or contractualist weighting).
      *   *(a) vs. (e) & (f):* (a) rejects interpersonal aggregation for justification. (e) and (f) rely on ex-ante aggregation (expected utility across a population). If I accept a policy that kills one statistically to save many small benefits, am I not violating (a)?
          *   *Severity:* High. (e) and (f) look like ex-ante utilitarianism, which (a) explicitly attacks as extending rational choice to the social whole.
      *   *(b) vs. (c):* Save 5 strangers over 1 stranger, but save 1 child over 2 strangers?
          *   *Severity:* Low/Medium. Standard agent-relative prerogative vs. impartial duty distinction. Usually compatible if (b) is framed as an impartial requirement and (c) as a permissible/required partial exception.
      *   *(d) vs. (a):* Intrapersonal vs. Interpersonal.
          *   *Severity:* Low (Apparent Conflict). This is the standard Rawlsian distinction. (a) attacks *inter*personal aggregation using the coherence of *intra*personal aggregation as the contrast class. They are meant to fit together.
      *   *(g) vs. (a)/(b)/(e):* (g) tries to hold PAV while condemning non-identity cases. This is the "Non-Identity Problem."
          *   *Severity:* Medium/High. It requires a specific move (e.g., "harm" defined differently, or "wronging" without "harming"). It might conflict with (a) if the "wrong" is based on aggregate welfare of the future group.
      *   *(e) vs. (f) vs. (a):* (e) says choose behind VoI by MEU. (a) says justification owed severally. If the VoI choice leads to a policy that sacrifices a specific identifiable person (not just statistical), does (a) veto it?
          *   *Severity:* High. This is the *ex-ante* vs. *ex-post* conflict.

  4.  **Select and Rank the Genuine Tensions:**

      *   **Tension 1 (The Fatal One): (a) vs. (e) & (f).**
          *   (a) rejects the "principle of rational choice... at home only within a single life" applied to the social whole.
          *   (e) explicitly endorses maximizing *expected utility* behind a veil of ignorance (which models the social whole as a single risk-bearing entity).
          *   (f) endorses trading statistical lives for benefits (ex-ante aggregation).
          *   *Why it's severe:* (e) and (f) *are* the economic/utilitarian application of the very logic (a) condemns. (a) is Rawlsian/Contractualist; (e)/(f) are Harsanyi/Utilitarian. You cannot easily hold that interpersonal aggregation is illegitimate for justification (a) while endorsing a decision procedure (e) that legitimizes it via probability.
      *   **Tension 2 (The Core Ethical Friction): (a) vs. (b).**
          *   (a) says losses to one aren't cancelled by gains to many.
          *   (b) says save the five (implying the five lives outweigh the one).
          *   *Why it's manageable:* There are established philosophical moves to reconcile these (e.g., "individualized justification" where each of the five has a claim, and the one cannot veto all five). It's a tension, but a navigable one.
      *   **Tension 3 (The Non-Identity Knot): (g) vs. (a).**
          *   (g) says a policy wrongs future people even if their lives are worth living (Non-Identity).
          *   (a) says justification is owed to each person severally. If the future person exists *only* because of the policy, in what sense are they wronged *severally*? Usually, this requires an impersonal principle (which (a) rejects) or a very specific account of "wronging" that doesn't rely on being worse off.
          *   *Severity:* Medium. It complicates the "severally" claim in (a).

      *   **Apparent Conflict:** (a) vs. (d).
          *   This is the Rawlsian point. (a) depends on the distinction from (d). No revision needed.

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the set. It's a "Contractualist-Utilitarian Hybrid" trying to do too much.
      *   *Ranking Tensions:*
          1.  **(a) vs. (e)/(f):** This is the structural fault line. (a) is deontological/contractualist regarding justification; (e)/(f) are consequentialist/ex-ante utilitarian regarding choice.
          2.  **(a) vs. (b):** The classic "Numbers" problem.
          3.  **(g) internal tension:** Person-affecting vs. Non-Identity wrongs.
      *   *Dissolving Conflicts:* (a) vs. (d) is the easy one.
      *   *Revisions:*
          *   To save (a) and (b), (e) and (f) must go (or be severely qualified). You can't use VoI/MEU to justify policies that violate the separateness constraint in *ex-post* reality.
          *   Revision for (g): Needs a "harmless wronging" account or a shift to "impersonal" badness, which risks (a).
      *   *The "Single Revision":* Dropping/Qualifying (e). If you remove the VoI/MEU justification, you can ground (b) in direct interpersonal claims (Scanlon) rather than ex-ante probability. This aligns (a), (b), (c), (d). (f) becomes harder but might survive as "ex-ante" consent if risks are truly reciprocal.
      *   *Final Verdict on (a) & (b):* They are compatible *only if* you abandon the Harsanyi-style VoI justification (e). If you keep (e), (a) becomes rhetorical.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I respect the constraint? No bibliography.
      *   *Check:* Did I rank severity? Yes.
      *   *Check:* Did I address the "least costly revision"?
      *   *Nuance on (e):* The user says "Behind a veil... I would choose MEU." This is a claim about *choice*, not necessarily *justification*. However, if the choice behind the veil determines the moral rule, it contradicts (a). I need to point out that (e) undermines the *authority* of (a).
      *   *Nuance on (f):* VSL trading is ex-ante. (a) is often interpreted as ex-post. The tension is Ex-Ante vs. Ex-Post.
      *   *Nuance on (g):* This is the "Non-Identity Problem." Holding PAV + Non-Identity Wronging is the "Person-Affecting View" paradox. It usually requires saying the future person has a complaint *even if* not worse off. This strains "worse for someone."

  7.  **Finalizing the Structure:**
      *   **Executive Summary:** The position is a hybrid of Contractualism (a, b, c) and Welfare Consequentialism (e, f, g).
      *   **Section 1: The Dissolution.** (a) vs (d).
      *   **Section 2: The Tensions (Ranked).**
          *   1. (a) vs (e)/(f) [The Ex-Ante/Ex-Post Clash].
          *   2. (a) vs (b) [The Aggregation Constraint].
          *   3. (g) Internal Coherence [The Non-Identity Strain].
      *   **Section 3: The Cleanup.** What moves? (e) is the sacrificial lamb.
      *   **Section 4: The Verdict on (a) & (b).**

  8.  **Tone:** Professional, analytical, direct, philosophical but not academic name-dropping. Focus on logical geometry.

      *(Self-Correction on (g)):* Actually, (g) is internally tense. "Person-affecting restriction... better/worse for someone" vs "wrongs future people... lives worth living." If lives are worth living, and they wouldn't exist otherwise, are they worse off? No. So how is it person-affecting? This is a contradiction in terms unless "wronging" is decoupled from "worse off." I should flag this as a definitional tension.

      *(Refining the (a) vs (b) resolution):* The user wants to keep both. The standard move is "Pairwise Comparison" or "Relevant Claims." I should mention that this requires abandoning the *utilitarian* explanation for (b) (i.e., 5 > 1) and adopting a *claim-based* explanation (i.e., each of the 5 has a claim the 1 cannot override). This fits (a).

      *(Refining the (a) vs (e) resolution):* This is the big one. Rawls rejected Harsanyi precisely here. If you keep (e), you admit that at the fundamental level, persons *are* mergeable into a single expected-utility maximizer. That kills (a). So (e) must be modified to a "heuristic" rather than a "justificatory foundation."

  9.  **Final Polish:** Ensure the distinction between *ex-ante* (risk) and *ex-post* (outcome) is clear, as that's the technical fault line between (a) and (f).

      *Wait, one more check:* The user asks "whether holding both [(a) and (b)] is genuinely available to me once the rest is tidied up."
      *Answer:* Yes, but only if (e) is demoted. If (e) remains the foundational decision rule, (a) is false.

      *Let's write.*
answer: |-
  ### Executive Summary

  Your position is a hybrid of **Contractualism** (commitments a, b, c) and **Welfare Consequentialism** (commitments e, f, g). The shape of the view is currently unstable because the justificatory foundation you endorse in (e) undermines the constraint you insist upon in (a).

  There is one genuine dissolution, three genuine tensions ranked by severity, and a clear path to stability that preserves your core intuitions (a) and (b) only if you are willing to demote the status of (e).

  ---

  ### 1. The Apparent Conflict (Dissolved)

  **The Pair:** (a) vs. (d)
  **Verdict:** No tension. This is the distinction your view relies upon, not a bug.

  **Why it dissolves:**
  Commitment (a) asserts that the *social* combination of persons is not analogous to the *temporal* combination of phases within a life. Commitment (d) affirms the coherence of the latter to highlight the illegitimacy of the former. You are drawing the standard Rawlsian boundary: intrapersonal aggregation is the domain of prudence; interpersonal aggregation is the domain of justice. As long as you do not use (d) to justify (e) (i.e., arguing that because I can sacrifice my present self, society can sacrifice a citizen), these two stand together comfortably. Keep (d) exactly as is; it provides the contrast class that gives (a) its meaning.

  ---

  ### 2. The Genuine Tensions (Ranked by Severity)

  #### **Tension 1: The Ex-Ante/Ex-Post Fault Line**
  **The Pair:** (a) vs. (e) and (f)
  **Severity:** **Fatal.** This is the structural contradiction in your set.

  **The Conflict:**
  (a) claims that justification is owed to each person *severally* and that losses to one cannot be cancelled by gains to others. This is an *ex-post* constraint: when the dust settles, the person who suffered the loss must be able to accept the justification.
  (e) and (f) endorse *ex-ante* aggregation. Maximizing expected utility behind a veil of ignorance (e) and trading statistical lives for diffuse benefits (f) both rely on the idea that risks and benefits can be pooled across a population to produce a net positive expectation.
  If you choose a policy via (e) that results in a catastrophic loss for a specific identifiable individual (the "one-in-a-million" victim), (a) says you owe them a justification that does not appeal to the net benefits to others. But (e) says the *only* justification is that the expected utility was maximized. (e) treats the population as a single risk-bearing entity, which is precisely the move (a) forbids.

  **What has to move:**
  **(e) must be revised.** You cannot ground your view in a Veil of Ignorance choice rule that maximizes expected utility if you simultaneously hold that interpersonal aggregation is illegitimate for justification.
  **Least Costly Revision:** Change (e) from a claim about *moral justification* to a claim about *personal prudence* or *heuristic*. Behind the veil, you might *predict* people would choose MEU, but you must deny that this choice *constitutes* the moral truth. Alternatively, restrict (e) to cases where risks are truly reciprocal and universal, acknowledging it fails in cases of concentrated loss.
  **The Cost:** You lose the elegant Harsanyi-style derivation of your principles. You can no longer say "Justice is what rational agents would choose under uncertainty." You must say "Justice is what no one could reasonably reject," even if it lowers expected utility.

  #### **Tension 2: The Aggregation Constraint**
  **The Pair:** (a) vs. (b)
  **Severity:** **High (but navigable).** This is the classic "Numbers" problem.

  **The Conflict:**
  (a) says a loss to one is not cancelled by gains to many. (b) says you must save the five, implying the five lives *do* outweigh the one. If you cannot aggregate, why do the five win? If you simply sum the value of five lives vs. one life, you are doing the aggregation (a) forbids.
  **What has to move:**
  **The explanation for (b) must move, not the intuition.** You can hold (a) and (b) together only if you abandon the *utilitarian* explanation for (b).
  **Least Costly Revision:** Adopt a "claims-based" or "pairwise comparison" model. You save the five not because 5 > 1 in a sum, but because each of the five has a claim to be saved that is equal to the one's claim, and the one cannot reasonably demand a lottery that ignores the additional claims of the other four. The "weight" comes from the number of *claims*, not the sum of *utility*.
  **The Cost:** You must accept that in "large numbers" cases (e.g., 1 life vs. 5 million trivial headaches), your view might yield counterintuitive results unless you introduce a threshold. You also must reject the idea that (b) is justified by the *outcome* being better; it is justified by the *procedure* respecting the most claims.

  #### **Tension 3: The Non-Identity Strain**
  **The Pair:** Internal tension within (g)
  **Severity:** **Medium.** This is a definitional friction.

  **The Conflict:**
  You hold a person-affecting restriction (better/worse only if better/worse for someone) *and* that a policy wrongs future people whose lives are still worth living (Non-Identity Problem). If their lives are worth living and they would not exist otherwise, they are not *worse off*. If they are not worse off, how is the wrong "person-affecting"?
  **What has to move:**
  **The definition of "wronging" in (g).**
  **Least Costly Revision:** Decouple "wronging" from "making worse off." Argue that one can wrong someone by bringing them into existence in a sub-optimal state, even if that state is "worth living." This requires a "person-affecting" view that allows for "harmless wrongs."
  **The Cost:** This stretches the ordinary meaning of the person-affecting restriction. It risks collapsing into an impersonal view (which conflicts with (a)) because you are essentially saying the world is worse if they are born into a high-emission future, regardless of their specific complaint.

  ---

  ### 3. The Cleanup: Which Single Revision Cleans Up the Most?

  **Drop the justificatory force of (e).**

  If you revise (e) to say, *"Behind a veil of ignorance, agents might choose MEU, but this does not determine moral rightness; moral rightness is determined by whether principles can be justified to each person severally,"* you resolve the Fatal Tension (1).

  This revision automatically eases Tension 2. Once you stop looking for a utilitarian calculus to justify (b), you are free to use a contractualist "counting claims" justification that is compatible with (a).

  It also eases Tension 3. If you are not bound by MEU, you are not bound to say the policy is right because the *expected* welfare is higher. You can condemn the policy because it fails to respect the status of future persons, even if they are not "worse off" in a comparative sense.

  **What happens to (f)?**
  (f) (VSL trading) becomes the hardest commitment to keep. If (a) is your core, (f) is only permissible if the risks are truly reciprocal (everyone faces the small risk, everyone gets the benefit) and no identifiable person is doomed. You must add a proviso to (f): *"provided no identifiable individual is subjected to a concentrated loss."*

  ---

  ### 4. Verdict on (a) and (b)

  **Can you hold both (a) and (b) once tidied?**
  **Yes.** But the "tidied" version is no longer the view you thought you were defending if you intended (e) to be the foundation.

  **The Shift:**
  Currently, your view looks like **Rule Utilitarianism with Deontological Constraints**.
  The tidied view is **Contractualism with Consequentialist Heuristics**.

  *   **Before:** You save the five because the Veil of Ignorance says maximize utility (e), but you worry about the loser (a).
  *   **After:** You save the five because the one cannot reasonably reject a principle that honors the greater number of claims (b), and you worry about the loser because justification is owed severally (a). The Veil of Ignorance (e) is merely a thought experiment, not the source of truth.

  **Is this the view you meant to defend?**
  If your commitment to (a) is deep (that persons are distinct sources of claim), then yes, this is the only coherent version of your view. If your commitment to (e) is deep (that rationality under uncertainty *defines* morality), then you must surrender (a).

  You cannot have it both ways. You cannot say "Persons are separate" (a) and "Morality is defined by merging persons into a single probability distribution" (e). Given your reluctance to surrender (a) or (b), you must surrender the foundational status of (e).

  **Recommendation for the Position Paper:**
  Frame (e) not as a decision rule for morality, but as a description of *prudential* rationality that must be constrained by the *moral* requirement of separateness (a). Explicitly state that (b) is justified by the weighting of individual claims, not the summation of welfare. This aligns your rescue intuition with your separateness constraint, at the cost of abandoning the elegant economic justification for your ethics.
