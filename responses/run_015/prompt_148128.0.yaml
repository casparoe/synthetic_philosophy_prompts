answer: |-
  **The Allais Pairs**

  Pair 1: Option A offers $1,000,000 with certainty. Option B offers a 0.89 chance of $1,000,000, a 0.10 chance of $5,000,000, and a 0.01 chance of nothing.
  Pair 2: Option C offers a 0.11 chance of $1,000,000. Option D offers a 0.10 chance of $5,000,000.
  The commonly reported pattern is a preference for A over B and D over C. No assignment of utilities to the three monetary outcomes makes both preferences expected-utility-maximising.

  **1. Agreed Claims**

  1. The Allais pattern violates the independence axiom of expected utility theory.
  2. Violating independence entails preferences cannot be represented by maximizing expected utility over final outcomes.
  3. The independence axiom does not follow logically from ordering, transitivity, and continuity alone.
  4. A preference violation in a one-shot choice does not necessarily imply dynamic inconsistency.
  5. Dynamic inconsistency arises when preferences change across nodes in a decision tree without new information.
  6. Whether a description change is consequential depends on how outcomes are individuated.
  7. In the Pooled Allais, individual choices affect the common pot negligibly but aggregate choices determine variance.
  8. In the Rescaled Allais, a common 0.01 chance of a neutral outcome is added to all options in both pairs.
  9. Expected utility theory predicts rankings remain unchanged in the Rescaled Allais setup.
  10. Both parties agree reflective agents should not pay to avoid free information.
  11. Both parties agree reflective agents should not abandon a plan without new reason.
  12. Empirical studies show the Allais pattern persists even when subjects understand the probabilities.
  13. The dispute concerns whether the axiom defines rationality or constrains a specific model class.
  14. Both parties accept that stable, reflectively endorsed preferences deserve normative consideration.

  **2. Disagreements Table**

  | Question | Independence Defender | Dependence Defender | Test and Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Rationality Status** | Independence is a requirement of rationality; violating it is a mistake. | Independence is a substantive assumption; violating it is permissible. | **Test:** Reflective endorsement after training. **Preds:** I predicts convergence to EU; II predicts persistence of Allais. |
  | **2. Pattern Explanation** | The pattern stems from giving special status to certainty and salient probability gaps. | The pattern stems from evaluating resolution of uncertainty, not just final distributions. | **Test:** Process tracing during choice. **Preds:** I predicts focus on outcomes; II predicts focus on security structures. |
  | **3. Redescription** | Instability under consequentially equivalent redescription rules out the preference. | Instability matters only if the agent recognizes the equivalence and still reverses. | **Test:** Sequential choice with framed equivalence. **Preds:** I predicts money-pump vulnerability; II predicts stable choice within frames. |
  | **4. Unit of Evaluation** | The proper unit is the plan or tree; acts must cohere across the tree. | The proper unit is the act or lottery presented at the node of choice. | **Test:** Choice between pre-commitment and flexibility. **Preds:** I predicts demand for pre-commitment; II predicts indifference or rejection. |
  | **5. Pooled Allais** | Shows individual certainty-seeking is irrational when certainty is aggregate-only. | Shows individual preference is independent of group variance distribution mechanics. | **Question:** Does pooling settle individual rationality? **Preds:** I predicts shift to EU; II predicts no shift. **Against I:** Persistent Allais choice. **Against II:** Shift to EU. |
  | **6. Rescaled Allais** | Confirms independence holds when certainty is removed; violation is error. | Confirms independence fails even without certainty; violation is structural. | **Complaint:** Setup favors I by removing certainty. **Reply:** II accepts if outcomes include security. **Repair:** Outcomes individuated to include "security of certainty". **Preds:** I predicts EU compliance; II predicts Allais pattern persists. |

  **3. Genuine and Verbal Disagreements**

  Some disagreements stem from differing definitions of rationality. Party I defines rationality as consistency with axioms governing coherent choice structures. Party II defines rationality as substantive reasonableness of preferences over experienced outcomes. Once these definitions are distinguished, the dispute narrows to whether consistency or substance is paramount.

  Other disagreements stem from outcome individuation. Party I individuates outcomes as final wealth states. Party II individuates outcomes to include the psychological context of security or certainty. If outcomes include security, the Rescaled Allais case requires repair: the neutral outcome must not offer security. The parties agree the Rescaled case is valid only if the common consequence is truly indifferent regarding security properties. If the common consequence carries no security value, Party II accepts the setup bears on the axiom, though not on rationality.

  **4. Closing Statements**

  Party I would count evidence against its view if a subject, fully understanding the decision tree and equivalence of descriptions, stably maintains Allais preferences without exhibiting dynamic inconsistency or paying to avoid information. Party II would count evidence against its view if a subject, recognizing the structural equivalence of the pairs, voluntarily abandons the Allais pattern to avoid vulnerability to sequential exploitation.

  Both parties agree the single study most likely to move the debate is a longitudinal experiment using the Pooled Allais setup with full transparency about aggregate variance. Participants would be grouped, allowed communication about strategy, and given repeated trials with feedback on group outcomes. Party I predicts that over time, groups will converge on expected-utility maximizing strategies to stabilize the pot. Party II predicts that individuals will maintain Allais preferences regardless of group mechanics, viewing the aggregate variance as irrelevant to individual rational endorsement. Both agree to sign this document pending the results of such a study.
