answer: |-
  # Adversarial Collaboration: Fanaticism vs. Tempering in Decision Theory

  ### Agreed Claims

  1.  Expected utility maximization with an unbounded utility function logically entails accepting sufficiently large payoffs regardless of probability magnitude.
  2.  Avoiding this entailment requires violating at least one standard axiom: statewise dominance, separability, or continuity.
  3.  Human credence assignments for events with probability below $10^{-6}$ are empirically unstable and highly sensitive to framing effects.
  4.  Aggregating uncertainty across decision theories using expected value pressures agents toward fanatical conclusions at the meta-level.
  5.  Agents can generate speculative scenarios endogenously at a computational cost lower than the payoff scaling required to dominate choices.
  6.  Both sides agree that a decision rule should not recommend actions guaranteed to yield lower utility in all physically possible worlds.
  7.  Both sides agree that dynamic consistency is a desirable property for any extended agency.
  8.  The dispute concerns the weighting of low-credence hypotheses, not the intrinsic value of existential risk mitigation.
  9.  Truncating probabilities or utilities alters the formal structure of agency and introduces discontinuities in preference orderings.
  10. No known decision rule satisfies all intuitive desiderata simultaneously in cases involving infinite or near-infinite stakes.
  11. Both sides accept that resource allocation should not be *solely* determined by arbitrarily constructed scenarios without external evidence.
  12. Both sides acknowledge that the choice of decision theory has astronomical stakes regarding long-term resource allocation.

  ### Disagreements Table

  | Crux | Fanatic Phrasing | Tempered Phrasing | Concrete Case / Argument | Fanatic Prediction | Tempered Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Axiomatic Cost** | Preserving dominance and separability is constitutive of rational agency; losing them is unacceptable. | Robustness against epistemic noise is constitutive of rational agency; losing it is unacceptable. | **Case:** Choose between Certain Utility 1 vs. $10^{-100}$ chance of $10^{100}$ utility. | Agents must take the gamble; refusing is dynamically inconsistent. | Agents must refuse; accepting makes choice vulnerable to arbitrary noise. |
  | **2. Meta-Uncertainty** | Uncertainty about decision theories must be aggregated by expected value, collapsing into fanaticism. | Meta-uncertainty warrants a tie-break rule or lexical priority to avoid infinite regress. | **Case:** 70% credence in Fanaticism, 30% in Tempered. Decide on $10^{-50}$ chance scenarios. | Agent acts as 100% Fanatic because meta-stakes dominate object-level stakes. | Agent adopts Tempered rule because meta-uncertainty undermines the aggregation method itself. |
  | **3. Manufactured Tails** | Endogenous generation is just internal mugging; if the math holds, the source is irrelevant. | Endogenous generation decouples choice from reality; priority becomes a function of imagination cost. | **Case:** Agent computes a scenario ($p=10^{-k}$, $U=10^{k+1}$) in 1 minute vs. external evidence. | Choice depends on payoff magnitude regardless of scenario origin. | Choice depends on evidential basis; manufactured tails are discounted or ignored. |
  | **4. Empirical Calibration** | Tail probabilities are logical degrees of belief; calibration is secondary to consistency. | Tail probabilities are empirical claims; poor calibration invalidates the input for maximization. | **Case:** Calibration test on distinguishing $10^{-6}$ vs $10^{-9}$ credences across 1,000 trials. | Performance irrelevant; logical coherence matters more than empirical hit-rate. | Performance critical; if agents cannot distinguish, maximization is noise-fitting. |

  ### Closing Analysis

  **Verbal Disputes**
  A portion of the disagreement is verbal, centering on the definition of "rationality." Fanatics define rationality as internal consistency across possible worlds, such that any deviation from expected utility maximization is by definition irrational. Tempered define rationality as robust success in actual environments, such that any rule vulnerable to epistemic noise is by definition irrational. When Fanatics say "you are dominated," they mean logically dominated across the state space. When Tempered say "you are exploitable," they mean vulnerable to real-world error models. These definitions are not fully reconcilable without agreeing on whether decision theory is a normative logic or a tool for engineering agency.

  **Falsification Conditions**
  *   **Fanatic:** We would abandon our view if demonstrated that adhering to dominance axioms systematically leads to resource exhaustion or "money pumps" in environments with realistic epistemic limits.
  *   **Tempered:** We would abandon our view if demonstrated that our truncation rules lead to choosing actions guaranteed to be worse in all physically possible worlds where the tail event obtains.
