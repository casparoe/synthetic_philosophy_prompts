      *   *Structure:* Part 1: Geography/Environment (*Longue Durée*). Part 2: Economies/Societies (*Conjoncture* - cyclical time). Part 3: Politics/Events (*Histoire Événementielle*).
      *   *Determinism:* Braudel is often *accused* of determinism, but he usually denies hard determinism. He sees geography as a "prison" but one humans can rattle the bars of. He emphasizes the *limits* of possibility, not total predestination.
      *   *Social Structures:* Yes, Braudel includes mentalities, economic systems, and social hierarchies in the slow-moving layers. It is *not* just physical geography.
      *   *Events:* He famously calls them "surface disturbances, crests of foam that the tides of history carry on their strong backs." He devalues them *explanatorily*, but he still writes 1000+ pages about Philip II. They are the *visible* history, but not the *deep* history.
