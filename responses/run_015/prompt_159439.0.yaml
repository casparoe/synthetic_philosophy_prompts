answer: |-
  Here are three candidate principles derived strictly from your verdicts. I have formalized them into clauses to test their consistency. Following that, I apply them to your unsettled cases and identify the contradictions you must resolve.

  ### Candidate Principle 1: Competitive Neutrality & Life-Continuity
  *This is a refined version of the principle you are currently holding. It prioritizes equalizing starting positions while protecting established livelihoods.*

  **Clause A (The Windfall Tax):** Tax transfers at the marginal rate to the extent they provide the recipient with liquid capital that alters their market position relative to peers who lack such transfers.
  *   *Motivated by:* Case 1 (Index funds), Case 7 (Dynasty trust).
  **Clause B (The Livelihood Exemption):** Exempt transfers where the asset is illiquid, integral to a trade the recipient has practiced for a significant period, and liquidation would end that trade.
  *   *Motivated by:* Case 2 (Dairy farm), Case 3 (Active son).
  **Clause C (The Care Exemption):** Exempt transfers where the funds are demonstrably required for medical or disability care and yield no surplus competitive power.
  *   *Motivated by:* Case 6 (Disabled heir).
  **Clause D (The Generational Reset):** Apply a surcharge to transfers structured to bypass a generational reset (e.g., perpetual trusts), regardless of size.
  *   *Motivated by:* Case 7 (Dynasty trust).

  **Where it breaks:**
  *   **Case 4 (School Fees):** This principle cannot explain why inter vivos school fees are exempt. They are liquid capital (cash paid to school) that alters market position (Case 1 logic). To keep this verdict, you must admit a "Administration Boundary" (we tax death because we can't track life) rather than a moral one.
  *   **Case 5 (Tainted Wealth):** This principle tracks *advantage*, not *source*. Tainted wealth and clean wealth provide the same advantage. To tax tainted wealth harder, you need a separate moral clause unrelated to opportunity.
  *   **Case 8 (Networks/Schools):** This principle defines "advantage" economically. A professional network is economic advantage. To exempt it, you must admit this tax only targets *financial* assets, not *social* capital, which undermines the "equal opportunity" justification.

  ### Candidate Principle 2: Productive Stewardship
  *This principle shifts focus from the recipient's advantage to the social utility of the asset's continued existence.*

  **Clause A (The Passive Receipt Tax):** Tax transfers heavily where the recipient is a passive beneficiary of liquid capital with no prior entanglement in its creation or maintenance.
  *   *Motivated by:* Case 1 (Acquaintance), Case 3 (Flipper son).
  **Clause B (The Steward Exemption):** Tax lightly where the recipient has contributed labor to the asset's value or intends to maintain the asset's productive function rather than extract its value.
  *   *Motivated by:* Case 2 (Farmer cousin), Case 3 (Active son).
  **Clause C (The Social Value Exemption):** Exempt transfers where the funds are dedicated to non-competitive social goods (e.g., research, arts, care).
  *   *Motivated by:* Your Mathematician intuition (Unsettled), Case 6 (Care).

  **Where it breaks:**
  *   **Case 7 (Dynasty Trust):** A dynasty trust could theoretically fund social value indefinitely. This principle struggles to condemn the *structure* itself unless you assume perpetual wealth inevitably becomes unproductive.
  *   **Case 5 (Tainted Wealth):** Stewardship is forward-looking. It does not care about the past sin of the wealth creator. This principle cannot justify a surcharge on innocent heirs holding tainted assets.
  *   **Case 1 vs. Case 8:** A professional network is often "stewarded" by the heir (maintained relationships). If the principle exempts the farm because it's a "form of life," it should exempt the network. If it taxes the index fund because it's "passive," it should tax the network.

  ### Candidate Principle 3: Legitimacy & Dominion
  *This principle focuses on the moral cleanliness of the source and the concentration of private power.*

  **Clause A (The Power Concentration Tax):** Tax transfers progressively based on the degree of private authority or market dominance the asset confers on the recipient.
  *   *Motivated by:* Case 1 (Large fund), Case 7 (Dynasty).
  **Clause B (The Clean Hands Surcharge):** Apply a penalty rate to wealth traceable to historically condemned acts, regardless of the recipient's innocence or the wealth's current liquidity.
  *   *Motivated by:* Case 5 (Tainted wealth).
  **Clause C (The Subsistence Exemption:** Exempt transfers that purchase care or stability without purchasing authority over others.
  *   *Motivated by:* Case 6 (Disabled heir), Case 2 (Farm as livelihood, not empire).

  **Where it breaks:**
  *   **Case 4 (School Fees):** Buying a spot in a private school is purchasing authority (priority access) over others. This principle demands taxing it.
  *   **Case 3 (Flipper vs. Active):** If the asset value is the same, the "dominion" is the same. This principle struggles to distinguish between the son who keeps the firm and the son who sells it, unless you argue that selling to a competitor reduces market diversity (an economic, not dominion, argument).
  *   **Case 8 (Networks):** A professional network confers authority and dominance. Exempting it while taxing the farm (which confers dominance over land/production) is inconsistent under this principle.

  ---

  ### Predictions for Your Unsettled Cases

  Here is how the principles handle the scenarios you are undecided on.

  **1. The Siblings (Surgeon vs. Care Worker)**
  *   **Competitive Neutrality (Principle 1):** Tax the care worker *less*. The surgeon already has high market position; the windfall alters the care worker's position more drastically relative to peers. This implies means-testing the heir.
  *   **Stewardship (Principle 2):** Tax them the *same*. The inheritance is passive in both cases. Their prior earnings are irrelevant to the stewardship of the new capital.
  *   **Legitimacy (Principle 3):** Tax the surgeon *more*. The surgeon already holds significant social power; adding more concentrates dominion.
  *   **Recommendation:** Your hesitation suggests you are torn between Principle 1 (equality) and Principle 2 (neutrality). If you tax based on existing wealth, you move toward an accessions tax (taxing total lifetime receipts) rather than an inheritance tax.

  **2. The Endowed Mathematician**
  *   **Competitive Neutrality:** Tax it. It buys freedom from labor that others do not have, altering competitive position.
  *   **Stewardship:** Exempt it. It is dedicated to non-competitive social value (research).
  *   **Legitimacy:** Tax it. It is private power, even if used benignly.
  *   **Recommendation:** Your intuition that this might be the "best" case for taxing suggests you fear the *aristocratization of intellect*. Your intuition that it might be the "worst" suggests you value *public good*. Principle 2 is the only one that exempts this. If you want to tax it, you must reject Principle 2.

  **3. Age of Recipient (70 vs. 25)**
  *   **Competitive Neutrality:** Tax the 70-year-old *more*. At 25, capital helps establish a life plan (Case 2 logic). At 70, life plans are settled; the capital is purely surplus advantage.
  *   **Stewardship:** Irrelevant.
  *   **Legitimacy:** Tax the 70-year-old *more*. They have had a lifetime to accumulate their own power; this is additional concentration.
  *   **Recommendation:** Your current principles do not account for age. Adding an age clause creates administrative complexity but aligns with the "Life-Continuity" logic of Case 2.

  ---

  ### The Hard Truths: What You Must Give Up

  You cannot hold all eight verdicts simultaneously. They contain internal contradictions that no single principle can resolve without arbitrary line-drawing. Here is where you must compromise.

  **1. You must give up the distinction between Case 1 (Bequest) and Case 4 (School Fees).**
  *   *The Conflict:* You want to tax the $8M index fund heavily because it buys advantage, but you are uneasy taxing school fees which *also* buy advantage.
  *   *The Fix:* Either accept a comprehensive "Accessions Tax" that taxes all lifetime gifts (including school fees) at the same rate as death transfers, or admit that your tax is not truly about "opportunity" but about "liquidity events." If you choose the latter, you must stop claiming the tax is about equal opportunity (Case 8) and admit it is a tax on financial assets only.
  *   *Verdict to drop:* Case 4. If Case 1 is taxed, Case 4 must be too, or the principle is hollow.

  **2. You must give up the distinction between Case 2 (Farm) and Case 8 (Networks).**
  *   *The Conflict:* You exempt the farm because it preserves a "form of life." But a professional network or a home in a good school district also preserves a "form of life" and confers more advantage than the farm.
  *   *The Fix:* Acknowledge that this tax cannot touch human capital or social capital. It is a tax on *financial* property only. You must stop justifying it via "equal opportunity" (which networks violate) and justify it via "administrative feasibility" or "preventing financial oligarchy."
  *   *Verdict to drop:* Case 8's justification. You can keep the verdict (don't tax networks), but you cannot claim it fits the "competitive advantage" principle. It is an exemption for practicality, not justice.

  **3. You must isolate Case 5 (Tainted Wealth) as a separate legal mechanism.**
  *   *The Conflict:* No standard tax principle justifies taxing an innocent heir more heavily based on the *source* of the funds unless the goal is retribution, not revenue or equality.
  *   *The Fix:* Do not bake this into the inheritance tax rate schedule. This requires a "Forfeiture" or "Reparations" clause separate from the tax code. Mixing it into inheritance tax corrupts the principle of "ability to pay" or "advantage."
  *   *Verdict to drop:* The idea that this belongs in the *tax* schedule. It belongs in a separate restorative justice statute.

  ### Recommendation for the Commission

  Adopt **Candidate Principle 1 (Competitive Neutrality & Life-Continuity)** but amend it with two explicit "Administrative Boundaries" to resolve the contradictions:

  1.  **The Liquidity Boundary:** We tax financial assets at death because they are measurable. We acknowledge this does not capture human capital (Case 8) or inter vivos consumption (Case 4), but we accept this limitation to preserve privacy and feasibility.
  2.  **The Stewardship Discount:** We allow a reduced rate for illiquid business/farm assets where the heir has been active for 5+ years (Case 2, Case 3), provided the asset is not sold within 10 years.

  **On your unsettled cases:**
  *   **Siblings:** Tax them the same. Means-testing heirs creates a disincentive to earn and is administratively invasive. Stick to the transfer, not the recipient's portfolio.
  *   **Mathematician:** Tax it. We cannot judge "social value" at the probate office. If the exemption exists, every hedge fund will become a "research trust."
  *   **Age:** Add a clause: Transfers to heirs over 65 are taxed at a higher bracket than those under 40, reflecting the "Life-Continuity" need.

  This approach sacrifices the moral purity of Case 4 and Case 8 but gives you a working, consistent statute that handles the bulk of your intuitions (1, 2, 3, 6, 7) without collapsing under the weight of the exceptions.
