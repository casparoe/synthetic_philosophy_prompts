          *   Specific topics to cover:
              1.  Border between the two goods (Friendship vs. Appreciation of Beauty).
              2.  The "Philosophical Zombie Friend" case (value in consciousness vs. reality of object) + Death/Grief case.
              3.  Paradox of Tragedy/Compassion (does compassion redeem agony?).
              4.  Ranking/Action Guidance (Isolation method vs. Life choices).
              5.  Falsifiability/Insulation (What counts against the view? Organic Unity get-out clause?).
              6.  Closing: Where Moore got it wrong.
          *   Tone: Friendly but not soft.

  2.  **Deconstruct the Guest's View (Moorean Axiology):**
