      *   *Structure:* Organic Unities (Whole $\neq$ Sum of Parts).
      *   *Method:* Isolation Test (Imagine it alone).
      *   *Hard Cases:* Unperceived beauty (low value), Delusive appreciation (lower value than real).

  3.  **Drafting Questions (Iterative Process):**

      *   *Topic 1: The Two Goods Border.*
          *   *Idea:* Friendship looks like appreciating a person. Beauty looks like appreciating an object. Why two categories?
          *   *Draft Q:* Why aren't friendship and beauty appreciation the same thing?
          *   *Refinement:* Need to force a distinction. Friendship involves reciprocity? Beauty doesn't?
          *   *Follow-up:* If reciprocity matters, isn't that a relational property, not just a state of consciousness?
          *   *Dodge Check:* Can he say "Intuition tells me they are distinct"? Yes. Need to press on the *structure* of the attitude.

      *   *Topic 2: The Zombie Friend & The Dead Friend.*
          *   *Idea:* If value is in the *experience*, why does the reality of the friend matter? (Moore says delusive appreciation is worse).
          *   *Draft Q:* If I love a zombie friend, isn't my experience the same?
          *   *Refinement:* Focus on the "object" requirement. Moore says reality adds value.
          *   *Follow-up:* But what about loving the dead? The object doesn't exist anymore. Is that valueless?
          *   *Dodge Check:* He might say "Memory is the object." Press on the *existence* condition.

      *   *Topic 3: Tragedy & Compassion.*
          *   *Idea:* Organic unities allow pain + response = good whole. Does this mean my friend's suffering is *good* because I feel compassion?
          *   *Draft Q:* Is suffering good if I care about you?
          *   *Refinement:* Moore says the *whole* is good, parts might be bad. But does the existence of the good whole justify the bad part?
          *   *Follow-up:* If the whole is better with the pain than without the compassion, do we have a reason to *allow* the pain to enable the compassion? That's repugnant.

      *   *Topic 4: Ranking & Action.*
          *   *Idea:* Isolation test tells you what's good *alone*. Life is messy. How do you choose?
          *   *Draft Q:* How do I live based on this?
          *   *Refinement:* Principia Ethica tries to rank. But if value isn't additive, how do you compare complex lives?
          *   *Follow-up:* Is the ranking in Principia just Moore's personal preference disguised as intuition?

      *   *Topic 5: Falsifiability/Insulation.*
          *   *Idea:* What changes your mind?
          *   *Draft Q:* What proves you wrong?
          *   *Refinement:* Psychology shows we value achievement, not just beauty/love.
          *   *Follow-up:* You can just say "Achievement is part of an organic whole with beauty." Isn't that unfalsifiable?

      *   *Topic 6: Moore's Mistake.*
          *   *Idea:* Where did G.E. mess up?
          *   *Refinement:* Needs to be specific. Maybe the "non-natural" part or the specific list of goods.

  4.  **Developing the "Anti-Dodge" Mechanism:**
      *   The prompt specifically warns against "That's Moore's example" and "Intuition is self-evident."
      *   *Strategy:* Frame questions around *internal consistency* or *consequences* rather than asking for fresh intuitions. Force him to explain the *mechanism* of the intuition.
      *   *Specific Tactic:* For the "Isolation" dodge, ask about cases where isolation is impossible conceptually (e.g., friendship requires two people). For the "Moore's Example" dodge, use *new* cases (Zombie friend, Dead friend) that parallel the old ones but create tension.

  5.  **Refining the Questions (incorporating the specific constraints):**

