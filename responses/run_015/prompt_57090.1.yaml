      Let's refine the "Parity" definition for the debrief.
      Parity: Neither better, nor worse, nor equal.
      Indifference: Equal.
      Pump works on Parity because if Equal, you won't pay to switch. If Parity, you might (because neither is worse, so switching isn't a loss, fee is negligible).

      Let's write.
