  # Activity Design: The Dual Ledger

  **Session Length:** 90 Minutes
  **Participants:** 16 Adults (4 Tables of 4)
  **Materials per Table:**
  *   Two distinct score sheets (Ledger A: **Prestige**, Ledger B: **Autonomy**).
  *   20 Poker Chips or printed tokens (**Credits**).
  *   A set of 6 Offer Cards (sealed envelopes, opened sequentially).
  *   Pens.

  ## 1. The Setup (0:00 – 0:10)

  **Instructions (Read Aloud):**
  "You are managing a career. You have two metrics of success that cannot be converted into one another: **Prestige** (external recognition) and **Autonomy** (control over your time). You also have **Credits**, which represent liquid resources.

  You begin with **100 Prestige**, **0 Autonomy**, and **10 Credits**.

  Your goal is to end the session with the most desirable career profile. There is no single winning score. Some of you may value Prestige more; some Autonomy. You may trade between them only when offered by the Market (the Offer Cards).

  **Rules:**
  1.  Prestige and Autonomy are distinct. You cannot sum them.
  2.  Credits are fungible. You can lose them or gain them.
  3.  Offers are sequential. You do not know future offers.
  4.  You must agree as a table on whether to accept each offer."

  **The Philosophical Trap (Hidden):**
  The initial endowment (100 Prestige) and the first alternative (100 Autonomy) are designed to be **on a par**. Neither is strictly better; they are qualitatively different but comparable in magnitude. However, they are not *equal* (indifferent). The activity tempts participants to treat them as "switchable for a small cost" because neither is *worse* than the other.

  ## 2. The Offer Sequence (0:10 – 0:40)

  The Facilitator announces offers one by one. Tables have 3 minutes to decide per offer.

  *   **Offer 1:** "Switch your current primary focus. Trade **100 Prestige** for **100 Autonomy**. **Fee: 1 Credit**."
      *   *Rationalization:* If Prestige and Autonomy are on a par, 100 Auto is not worse than 100 Prestige. The 1 Credit fee is negligible (10% of endowment).
  *   **Offer 2:** "Market conditions have shifted. Trade **100 Autonomy** for **100 Prestige**. **Fee: 1 Credit**."
      *   *Rationalization:* If they are on a par, 100 Prestige is not worse than 100 Autonomy. The fee is negligible.
  *   **Offer 3:** "A rare opportunity. Trade **100 Prestige** for **100 Prestige + 5 Credits**." (Wait, this breaks the cycle).
      *   *Correction for Pump:* To ensure the drain lands, we need a cycle that returns to the start state but poorer.
      *   *Revised Offer 3:* "Final Rebalancing. Trade **100 Prestige** for **100 Autonomy**. **Fee: 1 Credit**." (Now they hold Autonomy).
      *   *Revised Offer 4:* "Correction. Trade **100 Autonomy** for **100 Prestige**. **Fee: 1 Credit**."
      *   *Simpler 2-Step Pump:*
          1.  Start: 100 P.
          2.  Offer 1: 100 P $\to$ 100 A (Cost 1 C).
          3.  Offer 2: 100 A $\to$ 100 P (Cost 1 C).
          4.  End: 100 P, -2 C.
      *   *Why accept Offer 2?* Because locally, A and P are still on a par.
      *   *Let's add a 'Sweetener' to make it look strictly rational locally.*
      *   **Offer 1:** Trade 100 P for 100 A. **Pay 1 Credit.**
      *   **Offer 2:** Trade 100 A for 100 P. **Receive 0.5 Credits.** (Wait, if they receive credits, they aren't pumped).
      *   **Strict Pump Design:**
          1.  Start: 100 P, 10 C.
          2.  Offer 1: Swap 100 P $\to$ 100 A. Cost: 1 C. (State: 100 A, 9 C).
          3.  Offer 2: Swap 100 A $\to$ 100 P. Cost: 1 C. (State: 100 P, 8 C).
          4.  Offer 3: Swap 100 P $\to$ 100 A. Cost: 1 C. (State: 100 A, 7 C).
          5.  Offer 4: Swap 100 A $\to$ 100 P. Cost: 1 C. (State: 100 P, 6 C).
      *   *Why keep swapping?* The Facilitator adds narrative flavor: "Prestige is undervalued right now," then "Autonomy is trending." This mimics the *context-sensitivity* often associated with parity choices.

  **Revised Offer Deck for the Activity:**
  *   **Offer 1:** "Shift to Autonomy." (100 P $\to$ 100 A). Cost: 1 Credit.
  *   **Offer 2:** "Shift to Prestige." (100 A $\to$ 100 P). Cost: 1 Credit.
  *   **Offer 3:** "Shift to Autonomy." (100 P $\to$ 100 A). Cost: 1 Credit.
  *   **Offer 4:** "Shift to Prestige." (100 A $\to$ 100 P). Cost: 1 Credit.
  *   **Stop.** Count Credits.

  ## 3. Transcript of Play (Table 3)

  *Note: This transcript demonstrates the drain landing under "locally rational" play where participants treat Parity as permission to swap for negligible costs.*

  | Step | State Start | Offer | Table Deliberation (Summary) | Decision | State End |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Start** | 100 Prestige, 0 Auto, 10 Credits | - | "We value Prestige, but Autonomy looks comparable." | - | 100 P, 0 A, 10 C |
  | **Offer 1** | 100 P, 0 A, 10 C | 100 P $\to$ 100 A<br>Cost: 1 Credit | P1: "Autonomy isn't worse than Prestige."<br>P2: "It's just 1 credit. We can afford the flexibility."<br>P3: "If they're different kinds of good, switching isn't a loss." | **Accept** | 0 P, 100 A, 9 C |
  | **Offer 2** | 0 P, 100 A, 9 C | 100 A $\to$ 100 P<br>Cost: 1 Credit | P1: "Now Prestige looks better again."<br>P2: "But Autonomy wasn't worse. So Prestige isn't an upgrade, but it's not a downgrade."<br>P3: "Another credit is negligible. Let's go back." | **Accept** | 100 P, 0 A, 8 C |
  | **Offer 3** | 100 P, 0 A, 8 C | 100 P $\to$ 100 A<br>Cost: 1 Credit | P1: "We're oscillating."<br>P2: "But we haven't lost any Prestige or Autonomy points."<br>P3: "The market is volatile. We'll hedge by switching again." | **Accept** | 0 P, 100 A, 7 C |
  | **Offer 4** | 0 P, 100 A, 7 C | 100 A $\to$ 100 P<br>Cost: 1 Credit | P1: "Okay, back to Prestige."<br>P2: "We're down 4 credits."<br>P3: "But we ended where we started career-wise. The credits were just transaction fees." | **Accept** | 100 P, 0 A, 6 C |
  | **End** | **100 P, 0 A, 6 C** | - | **Net Loss: 4 Credits.** | - | - |

  **Arithmetic Check:**
  *   Start Value: $100P + 10C$
  *   End Value: $100P + 6C$
  *   Loss: $4C$
  *   *Rationality Check:* At every step $t$, the agent preferred $(100 \text{ New} - 1C)$ to $(100 \text{ Old})$. This implies $100 \text{ New} \ge 100 \text{ Old} + 1C$.
  *   If $100P \parallel 100A$, then $100A \not< 100P$. If the agent treats "not worse" as "acceptable for small cost", the drain lands.

  ## 4. The Debrief (0:50 – 1:30)

  **Phase 1: The Reveal (10 mins)**
  *   Ask tables to report final Credit counts.
  *   Reveal that all tables started with identical Career stats (100 P) and ended with identical Career stats (100 P).
  *   Ask: "Who has fewer Credits than they started with?"
  *   **Introduce Terms:**
      *   **Parity:** The relation between Prestige and Autonomy. Neither better, nor worse, nor equal.
      *   **Money Pump:** The sequence that drained Credits without changing the Career outcome.
      *   **Indifference:** If you were truly indifferent ($P = A$), you would not pay to switch. You would demand $A + \epsilon$ for $P$.
      *   **The Trap:** Parity behaves like indifference for *choosing* (either is permissible), but fails for *substituting* (swapping back and forth costs value).

  **Phase 2: Escape Routes (20 mins)**
  Map the specific moments of play to the theoretical escape routes.

  | Escape Route | Mechanism | The Cost | The Sharp Objection |
  | :--- | :--- | :--- | :--- |
  | **1. Commensurability** | Assign an exchange rate (e.g., 1 Auto = 1.1 Prestige). | **Loss of Qualitative Distinction.** You surrender the claim that these values are fundamentally different kinds of goods. | "If I can price it, it's just a commodity. I didn't come here to optimize commodities." |
  | **2. Intransitivity** | Admit preferences cycle ($A \succ B \succ A$). | **Violation of Rationality.** You accept being a money pump as a feature of your agency. | "Then you are a sink for resources. Any agent can exploit you." |
  | **3. Status Quo Bias** | Refuse all trades unless strictly better. | **Stagnation.** You miss genuine improvements (e.g., $A+ \text{ for } A$). | "You become inert. You can't even accept a free upgrade if it requires a 'swap'." |
  | **4. Policy/Commitment** | "I commit to Prestige." Refuse swaps on principle. | **Rigidity.** You might miss a context where Autonomy *was* genuinely better. | "What if the world changes? Your commitment blinds you to new reasons." |

  **Phase 3: The Voluntarist Line (10 mins)**
  *   **Question:** "Is there a place for commitment here?"
  *   **Chang's View:** Parity leaves the agent free to *create* reasons through commitment.
  *   **In the Game:** If a table said at Offer 1: "We commit to Prestige. We will not swap regardless of the fee," they avoided the pump.
  *   **Does the activity foreclose this?** No. The rules permitted refusal.
  *   **The Price:** The cost of the voluntarist line is that you must treat the commitment as binding even when local incentives tempt you (like Offer 2, where switching back looked 'negligible').
  *   **Verdict:** The activity *supports* the voluntarist escape. The tables that refused trade preserved their Credits. This is the "best outcome" for the tables that spotted the cycle.

  ## 5. Frank Account of Failure Modes

  **Prediction:** One or two tables (likely those with Econ/CS backgrounds) will spot the cycle at Offer 2 and refuse to trade.
  *   **Response:** Do not mark this as failure. In the debrief, explicitly praise these tables. "Table 1 realized that if $A \parallel B$, paying to switch $A \to B$ and $B \to A$ is a loss. They enforced commensurability by refusing the comparison."
  *   **Turning it into the Best Outcome:** Frame the "Refusal" as the *Voluntarist Escape*. They created a reason (preservation of Credits) to break the parity tie.
  *   **Risk:** If *all* tables refuse, the pump doesn't land.
  *   **Mitigation:** The Facilitator must emphasize the *narrative* of the offers ("Market conditions shifted," "New data available") to make each offer feel like new information rather than a cycle. Keep future offers hidden (envelopes).

  **Prediction:** Participants will resent losing Credits.
  *   **Mitigation:** Credits are paper tokens. The "loss" is symbolic. Debrief immediately to convert resentment into insight.

  ## 6. What The Activity Cannot Reproduce

  You must supply the following by argument once the tokens are put away:

  1.  **The Fungible Medium:** In real life, there is no "Credit" that sits beside "Career" and "Family." The cost of cycling between parity options is often *time* or *opportunity cost*, which is harder to tally. You must argue that *attention* or *life-years* function as the Credits.
  2.  **The Sequence:** The pump requires a sequence of offers. Real parity choices (Career vs. Family) are often one-off. You must argue that life *is* a sequence of small trades (working late vs. home early) that aggregate to the pump.
  3.  **The Visibility:** In the game, the loss is visible on the sheet. In life, the drain is often invisible until retrospect. You must argue that the "feeling" of being poorer (burned out, regretful) is the real-world Credit count.
  4.  **The Agent's Knowledge:** The game hides future offers. In life, we often suspect cycles but hope *this time* it's different. The activity simplifies the epistemic burden; real life requires resisting the pump without knowing if Offer 3 is a trap or a genuine improvement.

  ## 7. Timeline Summary

  *   **00-10:** Setup & Rules (No philosophy terms).
  *   **10-40:** Game Play (4 Offers, 5 mins each including deliberation).
  *   **40-50:** Tally & Reaction (Let the loss sink in).
  *   **50-60:** Reveal Concepts (Parity, Indifference, Pump).
  *   **60-80:** Escape Routes & Objections (Interactive discussion).
  *   **80-90:** Limitations & Real-World Mapping.

  ---

  ### Facilitator Notes for the "Smart Table"
  If a table refuses Offer 2, saying "We just did this," interrupt the game for that table only. Ask them: "What rule are you applying?" If they say "We won't pay to swap back," write that on the board. During the debrief, point to that text. "This table enacted the *Policy Escape*. They treated their initial choice as a commitment. They paid no price in Credits, but they paid a price in *flexibility*. Discuss: Is that price worth it?" This validates their rationality without breaking the lesson for the others.
