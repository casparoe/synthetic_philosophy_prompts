  **The Scenario: The Archon Alternating Swap**

  You are approached by a representative of Archon Derivatives, a high-frequency trading firm with a reputation for predatory structuring and limitless liquidity. They offer you a choice between two contracts. Contract A is a "Stability Bond": it pays you a guaranteed **$14.00** immediately, no strings attached. Contract B is the "Zeno Swap": Archon flips a fair coin repeatedly until it lands Heads for the first time. Let $n$ be the number of flips required (e.g., if Heads appears on the 1st flip, $n=1$). The contract terminates immediately upon Heads. Your payoff is determined by the schedule printed on the card: if $n$ is odd, Archon pays you $\$ \frac{30 \cdot 2^n}{n}$; if $n$ is even, you must pay Archon $\$ \frac{30 \cdot 2^n}{n}$. The contract is legally binding, enforceable in any jurisdiction, and Archon has posted collateral sufficient to cover any finite payout you might win. You are assumed to have the credit capacity to cover any finite loss you might incur, though your personal wealth is not infinite. The game ends with probability 1. You must choose A or B.

  ***

  **Analysis**

  **1. What Maximize-Expected-Value (MEV) Says**
  Standard decision theory instructs you to calculate the expected value (EV) of the gamble and compare it to the sure thing. The probability of the game ending on flip $n$ is $P(n) = 1/2^n$. The payoff is $V(n) = (-1)^{n-1} \frac{30 \cdot 2^n}{n}$.
  The expected value is the sum of probability-weighted payoffs:
  $$ E[B] = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \left( (-1)^{n-1} \frac{30 \cdot 2^n}{n} \right) = 30 \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n} $$
  This is 30 times the alternating harmonic series. While the series converges conditionally to $\ln(2)$, in measure-theoretic probability, the expectation is defined as $E[X^+] - E[X^-]$. Here, the sum of the positive terms diverges to $+\infty$ and the sum of the negative terms diverges to $-\infty$. Thus, **$E[B]$ is undefined.** MEV provides no verdict. It cannot tell you whether $14$ is greater than "undefined."

  **2. The Failure of Naive Truncation**
  A common heuristic for undefined expectations is to truncate the series at some large $N$ (simulating a "maximum plausible runtime" or computational limit) and observe the partial sum $S_N$.
  $$ S_N = 30 \left( 1 - \frac{1}{2} + \frac{1}{3} - \dots + \frac{(-1)^{N-1}}{N} \right) $$
  This series converges to $30 \ln(2) \approx 20.79$. For every $N \ge 1$, the partial sum $S_N$ exceeds the sure thing of $\$14$. (Even at the lowest dip, $S_2 = 15$).
  If you rely on truncation, the data unequivocally points to **Contract B**. The heuristic suggests the gamble is worth roughly $\$20$, beating the $\$14$ sure thing. This is the "wrong way." Truncation hides the structural risk by averaging out the catastrophic losses in the tail before they materially impact the partial sum, luring you into a trap where the *magnitude* of the risk is invisible to the *sum* of the expectation.

  **3. The Intuitively Right Answer (Maximin / Risk of Ruin)**
  Despite the tempting truncated EV, the rational choice is **Contract A**.
  The justification comes from a **Maximin** (maximum security level) rule or a **Risk of Ruin** constraint. In Contract B, the losses grow exponentially: at $n=20$ (probability $\approx 1$ in a million), you owe $\approx \$52$ million. At $n=50$, you owe quadrillions. While you have "credit capacity" for finite sums, the liability is unbounded. In any real-world context involving linear utility of money, an unbounded downside with a capped upside (relative to the tail growth) violates any reasonable safety constraint. Unlike the St. Petersburg paradox where the upside is the problem, here the *downside* is the killer. A rule that prioritizes solvency or minimizes maximum regret correctly identifies that trading a guaranteed $\$14$ for a contract that can bankrupt you for an EV that doesn't technically exist is foolish.

  **4. Structural Feature and Collapse**
  The engine of this paradox is the **Conditional Convergence of the Expectation Series**, driven by the **Alternating Sign** paired with **Exponential Payoff Growth**.
  *   **Remove the Alternating Sign:** If all payoffs were positive ($V(n) = \frac{30 \cdot 2^n}{n}$), the EV would be $+\infty$. MEV would demand you take the gamble.
  *   **Remove the Exponential Growth:** If payoffs were bounded (e.g., $V(n) = (-1)^{n-1} \cdot 30$), the EV would be defined and finite (approx $\$10$). MEV would tell you to take the Sure Thing ($14 > 10$).
  *   **Remove the Termination:** If the game didn't end with probability 1, the probabilities wouldn't sum to 1, breaking the probability space.
  The case collapses into boredom if you fix the sign (infinite EV) or cap the magnitude (defined EV). The undefinedness *requires* the tension between the diverging positive and negative tails.

  **5. The Defense and Comparison to Pasadena**
  An EV-maximizer will defend against this case by invoking **Bounded Utility**. They will argue that no rational agent values money linearly up to quadrillions; utility must saturate. If utility $U(x)$ is bounded, the expectation $\sum P(n) U(V(n))$ becomes absolutely convergent and defined. Given the symmetry of the payoff magnitudes and the concavity of typical utility functions (loss aversion), the expected utility of Contract B would likely be negative, aligning with the "Take Sure Thing" intuition.

  Does this defense dispose of the original Pasadena Game? **Yes.** The original Pasadena Game is also dissolved by bounded utility, which renders its expectation defined (and usually small). However, my version survives as a *stronger* decision-theoretic critique than Pasadena for one reason: **Forced Choice.** Pasadena asks "What is the value of this game?" allowing the theorist to shrug and say "Undefined." My scenario asks "A or B?" forcing a decision *now*. Bounded utility solves the math, but it doesn't solve the decision problem for an agent who *claims* linear utility (e.g., a large hedge fund accounting in raw dollars). For such an agent, Pasadena is a valuation curiosity, but the Archon Swap is an operational hazard. It demonstrates that even if you insist on linear utility and finite payoffs, EV maximization breaks down completely in the face of conditional convergence, requiring a fallback rule (like Maximin) that EV theory does natively support. The Archon Swap proves that "Undefined EV" isn't just a mathematical technicality; it's a decision paralysis that leaves you vulnerable to predatory scheduling unless you abandon EV maximization entirely.
