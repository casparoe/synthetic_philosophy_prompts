  6.  **Drafting - Step-by-Step:**

      *   *Title:* The Pre-empted Death: Reframing the Ethics of Pest Control.
      *   *Intro:* 6 years reporting. Trillions killed. Ethical vacuum.
      *   *Question:* "In the context of agricultural pest control, does the moral weight of a lethal intervention depend on the net increase in deaths, or on the differential between the pesticide-induced death and the natural death it pre-empts?" Unit: Individual organism.
      *   *Why current methods fail:* Body count ignores background mortality. Sentience ignores suffering duration. Holism ignores individual welfare.
      *   *The Objection:* The human analogy. If we apply this to humans, it justifies killing the terminally ill. Response: The context is adversarial (crop protection), not caregiving. The intent is not mercy for the insect, but protection of the crop, making the *manner* of collateral damage the only variable under our control. If this distinction doesn't hold, the theory collapses. I will admit this vulnerability.
      *   *Methodology:*
