answer: |-
  - teh flowchart in words

  Start with the 48-hour Data Pull. Grab three streams: satellite crop imagery, local market price indices, and clinic admission logs for acute malnutrition (edema/kwashiorkor). Simultaneously, pull the state's existing food-security statutes and their latest official harvest reports.

  Step 1: The Availability Filter. Ask: Is there physically less food than last year? If satellite and harvest data show a >20% drop, flag "Natural Disaster." If stocks are stable or high, move to Step 2.

  Step 2: The Entitlement Check. Ask: Can people exchange what they have for food? Compare labor wages and asset prices against food prices. If food prices triple while wages stay flat, you have an entitlement failure. This triggers a "Political/Structural" flag, but don't stop yet.

  Step 3: The Counterfactual Entitlement Audit. Compare current access against the state's own laws and prior commitments. Ask: Does the state guarantee minimum grain access or free trade? If yes, but checkpoints block movement or prices are manipulated, mark "State Blocking." If laws are vague or unenforced due to "capacity," mark "Logistical Gap."

  Step 4: The Silent Famine Check. Compare clinic malnutrition spikes against official mortality reports. Ask: Are clinics seeing starvation while officials report zero deaths? If yes, mark "Suppression/Political Crime." If mortality data is classified or unavailable, default to "Inconclusive."

  Step 5: Classification Handoff. If Step 1 is yes and others are no, classify "Natural Disaster." If Step 2, 3, or 4 trigger, classify "Political Crime." However, if Step 3 reads "Logistical Gap" and Step 4 is "Inconclusive," the procedure defaults to "Natural Disaster/Logistics." This is the handoff point: if the data suggests blocking but intent is unproven due to missing info, a human coordinator must decide if negligence equals crime.

  - Case 1: Bengal

  Running the procedure on Bengal 1943 yields a clear "Political Crime" classification. Step 1 (Availability) comes back negative; harvest data was adequate, ruling out pure natural disaster. Step 2 (Entitlement) triggers immediately. Sen's data shows rice prices spiked due to war procurement and speculative hoarding, while fishermen and laborers lost purchasing power because their boats were destroyed or wages stagnated. Their trade and labor entitlements collapsed despite food existing.

  Step 3 (Counterfactual Audit) highlights the breach. The colonial administration's priority was war supply over local food security laws, effectively voiding the population's legal claim to subsistence. Step 4 (Silent Famine) confirms suppression; official death tolls were massively undercut by actual mortality rates observed in villages and clinics. Because Step 2, 3, and 4 all flag state action or neglect as the primary driver of access failure, the procedure correctly identifies this as a political crime requiring advocacy and sanctions, not just rice shipments. The entitlement failure was manufactured by policy, not nature.

  - Case 2: The 2024 hypothetical

  In this 2024 landlocked scenario, the procedure misfires and outputs "Natural Disaster/Logistics." Step 1 shows full silos and record harvest reports, so no availability decline. Step 2 triggers an entitlement failure (prices tripled), which usually signals politics. However, Step 3 (Counterfactual Audit) stalls. The government cites food-security laws but claims border blocks are temporary security measures, not policy. The procedure categorizes this as a "Logistical Gap" because intent isn't explicitly written in law.

  The critical failure is Step 4 (Silent Famine). Because mortality data is classified, the check returns "Inconclusive." Without proof of suppressed deaths, the procedure cannot flag "Suppression." Lacking confirmed intent in Step 3 and missing mortality evidence in Step 4, the decision tree defaults to the safer classification: "Natural Disaster/Logistics." It treats the border blockade as a distribution bottleneck rather than a weapon. The algorithm sees food exists and distribution is hard, ignoring that the "hardness" is manufactured. It recommends logistics-only response, missing the advocacy track entirely.

  - Where the procedure breaks / judgment calls

  This is where I have to be blunt: you're asking to operationalize a political theory as a technical checklist, and that smuggling is inevitable. Sen's entitlement approach isn't just about economics; it's about power relations. The "Counterfactual Entitlement Audit" is slightly incoherent with Sen's actual framework. Sen focused on *capability* to command food, not necessarily legal statutes. A state can follow its own unjust laws while starving people. Relying on state laws as the baseline assumes the state is benevolent but incompetent, rather than potentially malicious.

  The binary split (Natural vs. Political) is also a false dichotomy. Most famines are hybrid. The procedure breaks in Case 2 because it treats "lack of evidence" as "evidence of lack." When data is classified, the procedure defaults to the status quo (logistics), which is itself a political choice. Determining whether negligence equals crime is a values judgment, not a fact. The 48-hour window forces you to treat ambiguity as safety, which protects the NGO but might fail the victims. You can't algorithmically distinguish incompetence from malice without making a political bet.

  - Bottom line: can this actually work?

  Yes, but only as a triage tool, not a truth machine. It works to get food moving quickly when the cause is obvious (Case 1). It fails when the cause is obscured by state secrecy (Case 2). The procedure is useful for standardizing initial responses, but the "Human Handoff" point is the most critical component. You need senior coordinators willing to override the "Logistics" default when the silence is too loud. If you treat this checklist as objective fact, you risk becoming complicit in the suppression you're trying to measure. Use it to organize data, not to make moral decisions.
