answer: |-
  ### 1. Agreed Claims

  This section outlines the foundational assumptions shared by both Sharp Takeoff and Continuous Takeoff proponents. These claims isolate the structural variables from the dynamic disagreements.

  1.  We adopt a foundational distinction: Capability Takeoff tracks latent capability growth per unit of effective compute, while Realized Takeoff tracks measured world effects per unit of calendar time.
  2.  Realized Takeoff is functionally Capability Takeoff minus deployment friction; both sides accept this decomposition as analytically valid for resolving trajectory disputes regarding speed and impact.
  3.  Latent capability consistently exceeds demonstrated capability in current systems due to imperfect elicitation, scaffolding limits, and alignment constraints hiding true performance.
  4.  Deployment friction encompasses integration costs, regulatory approval, liability assignment, supply chain rigidity, and physical hardware deployment constraints slowing adoption.
  5.  For improvement to count as recursively self-driven, systems must perform the majority of the research-and-engineering loop themselves, including hypothesis generation, code validation, and deployment, without human intervention.
  6.  Both camps agree autonomous R&E loops are physically possible in principle, differing only on timing, efficiency, and the threshold for recursion triggering explosion.
  7.  Compute scaling drives capability growth in both views, though disagreement exists on diminishing returns versus sustained scaling laws governing intelligence expansion.
  8.  Economic diffusion imposes a significant lag on realized impact regardless of sudden capability spikes or discontinuous jumps in model performance levels.
  9.  Safety risks correlate strongly with latent capability, not just realized economic impact, necessitating early monitoring before widespread deployment occurs globally.
  10. Monitoring the widening or narrowing gap between latent and deployed capability is critical for accurate forecasting, policy planning, and risk mitigation strategies.

  ### 2. Disagreements

  Core disagreements center on the dynamics of recursion, bottlenecks, and curve shapes. The table below formalizes the divergence.

  | Issue | Sharp Takeoff Formulation | Continuous Takeoff Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Recursion Speed** | Once autonomous R&E begins, improvement cycles accelerate discontinuously within weeks, bypassing human speed limits. | Automation of R&E increases gradually, yielding smooth capability gains over years as tools integrate. | Substantive |
  | **Primary Bottleneck** | The bottleneck is algorithmic capability; once solved, deployment friction is negligible relative to speed of thought. | The bottleneck is deployment friction; capability grows faster than economies can absorb or integrate safely. | Substantive |
  | **Curve Shape** | Capability per compute jumps step-wise when new architectures enable self-improvement loops unreachable by prior models. | Capability per compute follows a smooth sigmoid curve driven by incremental engineering and data accumulation. | Mixed |
  | **Economic Impact** | Realized impact spikes sharply as latent capability overwhelms friction almost instantly, disrupting markets abruptly. | Realized impact diffuses slowly as capital and labor reallocate across sectors over time, smoothing shocks. | Substantive |

  ### 3. Cruxes and Pre-registered Predictions

  The following cruxes identify measurable variables where predictions diverge. Both sides accept these measurements as bearing on the truth of their positions.

  | Crux | Accepted Measurement | Sharp Takeoff Prediction | Continuous Takeoff Prediction |
  | :--- | :--- | :--- | :--- |
  | **Scaffolding Gap** | Ratio of best-known scaffolding performance to default API performance across scale. | Gap widens significantly with scale, hiding latent discontinuous jumps in underlying model intelligence. | Gap remains stable or narrows, indicating smooth underlying capability growth without hidden leaps. |
  | **Automation Share** | Percentage of the R&E loop performed by systems without human intervention. | Share jumps from <10% to >90% rapidly upon reaching threshold capability, closing the loop suddenly. | Share rises smoothly from 10% to 90% over multiple generations of models and engineering cycles. |
  | **Compute vs. Time** | Capability growth plotted against effective compute versus calendar time. | Continuous against compute, discontinuous against time due to recursive feedback loops accelerating progress. | Continuous against both compute and time; friction and engineering drag smooth all potential discontinuities. |

  ### 4. What Would Move Us

  Sharp Takeoff proponents would revise if deployment friction proves insurmountable for key cognitive tasks, preventing recursive loops from closing despite high latent capability. Continuous Takeoff proponents would revise if autonomous systems demonstrate superlinear returns on R&E investment within a single deployment cycle, bypassing economic drag.

  Regarding framing: This document's distinction may fail if compute ceases to be the primary constraint. If data quality, energy availability, or regulatory bans bind harder than compute, the Capability/Realized decomposition obscures the true bottleneck. Additionally, treating friction as a simple subtractive term may underestimate feedback where realized impact accelerates capability growth via data collection. The residual disagreement may look tidier than reality if "latent capability" proves impossible to measure independently of deployment contexts.
