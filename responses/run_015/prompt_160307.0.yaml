answer: |-
  "Pass me the towel. The greasy one."

  Marta held out a wet hand without looking up from the sink. The kitchen smelled of stale coffee and tomato sauce. Outside, the van was parked crookedly, both of them too knackered to move it.

  Jules tossed the towel. "You're doing the thing where you listen to respond instead of listening to understand."

  "I'm listening to the part where you try to cheat," Marta said, scrubbing a casserole dish. "Your ledger idea. It's a trick. You think if you do the math on Sunday afternoon, you're allowed to be blind on Monday morning."

  "It's not blindness. It's focus. Look, if I decide once a year that ten percent of my income goes to the food bank, and the rest stays for my band and my rent, then when my daughter asks for money for a school trip, I don't have to stop and weigh her against a starving kid in Yemen. I just say yes. Because I already did the weighing."

  Marta turned off the tap. The silence was sudden. "So the calculation happens, it's just hidden in the attic? That doesn't fix the problem, Jules. It just means you're lying to yourself about why you're doing it."

  "It's not about why. It's about what it feels like in the moment. If I'm standing there and my kid is crying, and I think 'I am saving her because the annual audit permits this level of nepotism,' I've ruined it. I've turned her into a line item. But if I just think 'she's my kid,' I'm being a father. The ledger lets me be a father for 364 days."

  "And on day 365 you become an accountant," Marta said, picking up a fork. "But here's the thing: when you're sitting there with your spreadsheet, what are you actually doing? You're pretending to be God. You're pretending you can step outside your own skin and decide how much 'Jules' deserves versus how much 'Humanity' deserves. But you can't step outside. You're always Jules. So the calculation is always biased. You're just rigging the numbers so you feel clean."

  "Maybe," Jules leaned against the counter, crossing his arms. "But isn't it better than the alternative? The alternative is you walking around feeling guilty every time you buy a pint of beer. Or worse, you actually try to be impartial all the time. You start looking at your daughter and seeing her as one unit of happiness among billions. That's not morality, Marta. That's insanity. It destroys the thing that makes you worth saving in the first place."

  "Does it?" Marta turned back to the sink. "Or does it just make you honest? Look, I work in triage. I don't get to love the patient in Bed 3 more than the patient in Bed 4 because he's nicer or reminds me of my brother. If I do that, people die. The impartial view isn't some abstract philosophy; it's what happens when resources run out. If you admit that your love is just a resource, maybe you stop wasting it."

  "That's exactly what I mean," Jules snapped. "You're talking about love like it's petrol. You can't ration it like that. And don't give me the triage card. That's emergency stuff. This is about life. If you live your life like it's an emergency room, you never actually live."

  "Okay, fine. Let's take your ledger. Now take it one step further. You said yourself what if an app did it? You don't even see the math. The app just says: 'Transfer £200.' You do it. No calculation in your head at all. No thought too many. By your logic, that should be perfect. Integrity intact. So why does that make my skin crawl?"

  Jules frowned. "Because it's creepy."

  "Why?"

  "Because you're not choosing anything. You're a terminal. A meat puppet for the algorithm."

  "Exactly," Marta said. "It feels worse because it strips out your agency. But notice what that means. It means the problem isn't the *thought*. You said the thought was the poison. But if you remove the thought completely, it's even worse. So the thought isn't the problem. The problem is that you don't want to be answerable to anything outside your own circle. You want the feeling of being good without the cost of being good."

  "That's bullshit," Jules pushed off the counter. "It's not about the cost. It's about what the cost *does*. If the app tells me to ignore my daughter because the marginal utility is higher elsewhere, and I do it... I'm not a father anymore. I'm a function. But here's the thing you're dodging: Can I actually do it? If the audit says 'love her less,' can I? Can I just turn the dial down on my own heart because the spreadsheet says so?"

  Marta paused. "If you can't, then your morality is just a hobby. It's something you play with until it inconveniences you."

  "No, if I can't, then it means the morality is wrong. You can't demand people do what's psychologically impossible. If the system requires me to stop being human to follow it, the system is broken. Not me."

  "Okay, but let's twist it," Marta said, pointing the fork at him. "What if you're a drifter? No kid, no band, no attachments. You sleep on couches. Does your argument still hold? If you have no deep projects, do you still get to say 'I won't calculate'? Or does it just become 'I'd rather not'?"

  Jules hesitated. He picked at a label on a wine bottle. "If you have no attachments, you have no integrity to lose. So yeah, maybe the argument doesn't work for them. They're already empty. But most people aren't empty."

  "So the morality depends on how full you are?" Marta laughed, a short, sharp sound. "That's convenient. The more you have to lose, the less you owe. The rich man has more 'integrity' to protect than the poor man, so he gets to keep more of his money? That's not ethics, Jules. That's privilege with a philosophical moustache."

  "It's not about money, it's about shape!" Jules raised his voice. "Look, let's go to the hard case. You hate the triage example. Fine. What if the math says you have to take a job you hate for twenty years to fund a charity that saves thousands? Or worse. What if the math says you have to hurt one person to stop twenty others being hurt? Does the 'one thought too many' thing show up there? If I'm standing there with a gun, and the calculation says shoot, do I really want to pause and think about my own soul?"

  Marta went still. The water dripped from the tap. "If the calculation says shoot, then yes. You should think about your soul. Because if you don't, you're a monster. Even if the math is right."

  "So you admit it," Jules said. "There's a limit. There's a point where the impartial view breaks."

  "I admit that some things are off the table," Marta said quietly. "But that's not because of your integrity. It's because some costs are too high for *anyone* to pay. But that doesn't mean you get to ignore the calculation on the small stuff. You're using the extreme case to justify buying a new guitar instead of funding a malaria net. You're saying 'Well, I won't shoot a stranger, so I don't have to worry about the ten percent.'"

  "Maybe," Jules sighed. He picked up a sponge and started wiping the counter, avoiding her eyes. "But I think... I think the disagreement isn't about the math. It's about who owns the life. You think your life belongs to the world, and you rent out chunks of it to your family. I think your life belongs to you and your people, and you donate chunks of it to the world when you can. The ledger tries to bridge that, but it just makes me feel like I'm renting myself out to you."

  Marta dried her hands on her apron. "And I think if you keep your life too tightly, you suffocate. You stop seeing the world outside your window."

  She walked over to him and nudged his shoulder. "Your ledger idea? It's not useless. It stops the guilt from eating you alive. But don't pretend it solves the moral problem. It just manages the damage."

  "And your view," Jules said, looking up. "It saves lives. But it risks killing the person doing the saving. If I become a machine that maximizes good, who's left to enjoy it?"

  "Maybe nobody," Marta said. "Maybe that's the trade. We just have to decide how much machine we can stand to be."

  "Fuck," Jules muttered. "That's a depressing note to end on."

  "It's Tuesday," Marta said, turning off the light. "Come on. I'll buy you a pint. Impartially."

  "Don't calculate the tip," Jules said, following her out.

  "No promises."
