answer: |-
  1. Deontological constraints function not as barriers to optimal outcomes but as constitutive rules that preserve the integrity of practical reasoning itself. This relocation of normative work ensures that the agent avoids the alleged contradiction by treating violations as shifts in deliberative architecture rather than calculation errors.

  2. Procedural invariance mandates that certain norms remain outside the calculus of consequences, meaning symmetric rescue cases do not force a choice between values but between distinct modes of reasoning. Consequently, the deontologist avoids the threshold dilemma because the restriction prohibits the method of saving lives rather than evaluating the outcome of letting them die.

  3. Allowing a worse world to occur is not a moral failure if the agent's primary obligation is to maintain the validity of their own practical identity through non-instrumental reasoning. The catastrophe remains tragic, but it does not implicate the agent's integrity because they refused to treat persons as exchangeable inputs within a consequentialist framework.

  4. Moral residue functions not as punishment for breaking a rule but as an epistemic marker signaling that the agent's practical identity has been altered by treating a constraint as exchangeable. This emotional response confirms that the constraint was never truly collapsible into a threshold, preserving the deontological distinction even when violated under extreme duress.

  5. The paradox ultimately dissolves because the conflict is not between competing goods but between maintaining deliberative structure and succumbing to outcome-based pressure. Symmetric rescue cases fail to undermine procedural invariance because the cost of violation is paid in the currency of identity, not in the currency of aggregate welfare.
