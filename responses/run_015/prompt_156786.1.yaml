  | Reading Label | One-sentence precise formulation | Category (logical / axiological / psychological / structural) | Verdict (platitude / defensible / false) | Does it actually block pushing? | The hidden assumption or boundary condition it needs |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Categorical Separation Thesis** | Practical reasoning requires that the normative status of means is determined by rules independent of the value of ends, rendering them mathematically incomparable. | Logical | False | Yes (by fiat) | Assumes morality is non-teleological by definition, which begs the question against consequentialism. |
  | **The Lexical Priority Thesis** | Certain rights or dignity-based constraints function as absolute trumps that cannot be overridden by any aggregate sum of welfare gains. | Axiological | Defensible | Yes | Requires an undefended intuition that rights are side-constraints rather than weights in a utility function. |
  | **The Epistemic Hazard Thesis** | Permitting agents to trade lives for lives in real-time systematically produces worse outcomes due to bias, rationalization, and slippery slopes. | Psychological | Defensible | Only contingently | Assumes human cognitive limitations are permanent and that rule-worship yields better consequences than act-evaluation. |
  | **The Agent-Relative Constraint Thesis** | Moral reasons are indexed to the agent, making the disvalue of *my* killing one person greater than the disvalue of *my* allowing five others to die. | Structural | Defensible | Yes | Accepts the "paradox of deontology" as a feature of agency rather than a bug, prioritizing integrity over outcome optimization. |
  | **The Non-Instrumentalization Thesis** | Using a person as a mere means to save others violates a distinct norm against instrumentalization that merely foreseeing their death does not. | Axiological | Defensible | Yes | Relies on the Doctrine of Double Effect distinction between intended means and foreseen side-effects being morally salient. |

  In a rationalist forum, when this slogan is deployed to shut down argument, it is most likely invoking the **Epistemic Hazard Thesis** (we can't trust the calculation) while rhetorically borrowing the absolute force of the **Lexical Priority Thesis** (it is forbidden). This conflation rarely survives careful scrutiny because it smuggles in a substantive deontological intuition—the "naturalness of inaction" or the special badness of direct causation—under the guise of a heuristic rule. If the group accepts idealized agents (as rationalists often do), the Epistemic Hazard reading collapses, leaving them with the burden of defending the Lexical or Agent-Relative claims they are treating as self-evident. To move forward, the group must decide if they are arguing about ideal moral truth (where the slogan fails) or policy design for biased humans (where the slogan holds but doesn't resolve the Bridge case in principle).
