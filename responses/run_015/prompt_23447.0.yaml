answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Voting Procedure for Spectrometer Site Selection

  I am writing to offer a perspective on our voting procedure for Thursday's decision, specifically in response to the argument raised regarding the Gibbard–Satterthwaite theorem. My colleague is correct that this theorem is a profound result: it establishes that for any voting rule selecting among three or more alternatives, if we allow *any possible* ranking of preferences, the rule is either dictatorial or susceptible to strategic manipulation. Consequently, my colleague suggests we adopt a simple First-Past-The-Post (plurality) vote, acknowledging that manipulation is inevitable.

  However, after reviewing the constraints of our specific situation, I believe the theorem does not strictly bind us, and that adopting plurality would be unnecessarily suboptimal. I recommend we instead adopt a **Median Peak Rule**. Below I outline the reasoning, the recommended procedure, and the legitimate caveats we must keep in mind.

  **1. Why the Impossibility Result Does Not Apply**
  The Gibbard–Satterthwaite theorem relies on a premise of "unrestricted domain," meaning it assumes voters can hold any logical preference order (e.g., preferring Site A most, Site E second, and Site B last, regardless of their locations).

  Our situation is geometrically constrained. Because our offices and the candidate sites lie along a single corridor, and our utility is primarily determined by distance, our preferences are **single-peaked**. That is, each of us has a most-preferred site, and our preference declines monotonically as we move away from that site in either direction along the corridor.

  When preferences are single-peaked, the impossibility result no longer holds. As shown by Duncan Black's Median Voter Theorem (and later generalized by Hervé Moulin), there exists a class of rules that are non-dictatorial, efficient, and **strategy-proof** in this specific domain. In plain terms: if we use the right rule, no member can benefit by misrepresenting their preferred location.

  **2. Recommendation: The Median Peak Rule**
  I propose we vote as follows:
  1.  Each member submits their single most-preferred site (their "peak").
  2.  We order these seven votes according to the physical layout of the corridor (e.g., Site A through Site E).
  3.  We select the **median** vote (the 4th vote in the ordered list).

  **Why this is safe:** In a single-peaked domain, the median peak is a Condorcet winner (it beats all other options in pairwise comparisons). More importantly, it is strategy-proof. If I report a site further away from my true peak, I cannot pull the median closer to my office; I can only pull it further away or leave it unchanged. Truth-telling is a dominant strategy.

  **3. Why Not First-Past-The-Post?**
  While my colleague is right that plurality is manipulable, it is particularly ill-suited for spatial decisions. Plurality is highly sensitive to "vote splitting." If two members prefer Site B and two prefer Site C, but one member prefers Site A, Site A could win despite being the first choice of only 14% of the committee. This encourages tactical voting (voting for a "lesser evil" rather than one's true preference), which the Median Rule avoids.

  **4. Where My Colleague May Still Be Right**
  Intellectual honesty requires I note where the Gibbard–Satterthwaite warning still carries weight. The strategy-proofness of the Median Rule depends entirely on the **single-peakedness assumption**. My colleague's caution is warranted if:

  *   **Preferences are not purely spatial:** If a member prefers a site based on non-distance factors (e.g., proximity to power outlets, ventilation, or administrative boundaries), their preferences may not fall away cleanly on either side of a peak. If even one member's preferences are not single-peaked, the theoretical guarantee of strategy-proofness collapses.
  *   **Intensity of preference:** The Median Rule treats all peaks equally. It ignores *how much* closer one site is to an office compared to another. If one member is located immediately next to Site C, while the rest of us are far away, the Median Rule might still select a site central to the group but highly inefficient for that member. In this sense, any rule that ignores intensity (including plurality) loses welfare information.

  **Conclusion**
  Unless we have reason to believe our preferences are driven by non-spatial factors, we are operating in a restricted domain where a non-manipulable rule exists. I move that we adopt the Median Peak Rule for this vote. It respects the geometry of our problem, discourages tactical gaming, and is theoretically robust for our specific constraints.

  I look forward to discussing this on Thursday.
