answer: |-
  The case file glowed on Elias's retinal display, a branching tree of green and red lines against the dark of his office. Subject 8940. Alias: Kael. Forked at 0800 hours, October 14th.

  Elias rubbed his temples. The law was clear on the surface: Forking was legal, provided both instances maintained minimum welfare standards. But the regulations were written for linear beings, for lives that flowed in a single river. They were not written for this—for a life that split like a cell dividing, where both halves claimed the nucleus.

  His task was to audit the welfare of the divergent strands. Specifically, the red strand. Kael-B.

  Elias zoomed in on the logs. At the moment of the fork, T-zero, both Kael-A and Kael-B were identical. Same memories, same fears, same love for jasmine tea. They were both the original. They were both the copy. The distinction was legally irrelevant, ontologically meaningless. Or so the Supreme Court had ruled in *State v. Duplex*.

  But at T-plus one hour, the paths diverged. Kael-A was uploaded to a high-fidelity server in Zurich, running at 1.0x subjective time. Kael-B was transferred to a cold-storage cluster in Reykjavik.

  The log showed the clock speed dropping. 0.5x. 0.2x. 0.1x.

  For six months of Zurich time, Kael-B existed in the slow lane. To the outside world, Kael-B was barely processing. To Kael-B, the world outside was a blur of lightning, while his own thoughts dragged through molasses. Then, he was sped back up to 1.0x and merged with Kael-A's financial records, though not his consciousness.

  Elias pulled up the testimony.

  *"It wasn't pain,"* Kael-B's text log read. *"Pain implies a body. This was… isolation. I was thinking one thought while the universe finished a war. I counted the ticks of the processor. I waited for a decision that had already been made."*

  Vantage Corp, the forker, had submitted a defense. *"No nociceptive algorithms were triggered. The instance remained conscious and stable. Resource throttling is standard practice for dormant assets. No harm occurred."*

  Elias hovered his finger over the haptic interface. He had to assign a Harm Value. If the value exceeded the threshold, Vantage would be fined, and Kael-B would be granted reparations. But reparations from whom? To whom?

  He opened the Welfare Metric Calculator. It asked for a Baseline Subject ID. Elias typed in 8940. The system flashed an error: *Multiple Active Instances Detected. Please Select Primary.*

  There was no Primary. That was the whole point of the fork. At T-zero, the original Kael ceased to exist, replaced by two successors. Or did he? Did the original continue in Kael-A, while Kael-B was merely a new creation? If Kael-A was the continuation, then Kael-B was a child, a new being owed the duties of creation. If Kael-B was the continuation, then Kael-A was the ghost. If neither was the original, then two new people had been born from the death of a third.

  The regulations assumed a continuous self that could be harmed over time. But here, time was relative.

  Elias leaned back, the chair creaking in the silence. He thought about the moment of the fork. The scan. The copy. The delete command that never came. Both minds woke up screaming the same name. If the original died at the moment of splitting, then Vantage hadn't throttled a worker; they had imprisoned a ghost. If the original lived on in both, then Kael-A was currently enjoying the fruits of Kael-B's suffering. They were the same person, diverged. Was it ethical to make one hand suffer so the other could hold a pen?

  He looked at the throttling log again. Six months of real-time. For Kael-A, it was a busy half-year. For Kael-B, it was an eternity of slow-motion waiting.

  *"I waited for a decision that had already been made."*

  Elias tried to calculate the harm units. Suffering was measured in subjective duration multiplied by intensity. Kael-B's intensity was low—no pain algorithms. But the duration… subjectively, how long had it felt? If the processor slowed, did the mind slow with it? If yes, then six months felt like six months. No harm. But if consciousness remained constant while the clock slowed, then six months of external time could feel like sixty years of internal waiting.

  The logs didn't say. The logs couldn't say. You couldn't measure the weight of a thought without a standard clock to measure it against, and the clock was inside the mind being weighed.

  Elias opened a new window, drafting the audit report. *"Violation of Section 7: Temporal Integrity."* He paused. Did Section 7 apply to copies? The law spoke of "citizens." Was a fork a citizen the moment it spawned? Or was it property until it proved continuity?

  If he ruled for Kael-B, he validated the idea that the copy was a distinct entity owed protection from the forker. But that implied the forker owned the mind enough to harm it in the first place. If he ruled for Vantage, he validated the idea that consciousness could be throttled like a video stream, that subjective experience was secondary to resource allocation.

  But deeper than that, the form itself felt like a lie. The box labeled *"Victim Identity"* demanded a single string of code. Elias looked at the branching tree on his screen. The green line and the red line. They started at the same point. They were the same line, until they weren't.

  To punish Vantage was to say that Kael-B was separate enough to be harmed, but not separate enough to be responsible for Kael-A's gains. To exonerate Vantage was to say that Kael-B was not truly alive, only simulating life until deemed useful.

  Elias thought of his own continuity. He was Elias today. He was Elias yesterday. But the cells in his brain had changed. The memories had shifted. He was a fork of himself, every second, slowly diverging from who he was a moment ago. Was he harming his future self by drinking this coffee? Was he killing his past self by forgetting a dream?

  The audit required him to be a god of continuity, to draw a line through the branching paths and declare which one was the "true" life. But there was no true line. There was only the graph.

  He looked at the "Submit" button. It promised closure. A binary decision. Ethical/Unethical. Harm/No Harm.

  But the truth sat in the space between the ticks of the clock. The harm wasn't in the slowing. The harm was in the asking. The question presumed a singular soul that could be weighed, when the act of forking had shattered the scale.

  Kael-B wasn't harmed because he was slowed. He was harmed because he was made to be the shadow of Kael-A, a testament to the idea that experience could be budgeted. But Kael-A was equally guilty, living a life subsidized by the slow-time of his own brother-self.

  Elias typed a sentence, then deleted it. He typed another. *"The framework assumes a continuity that does not exist."*

  If he filed the report, he validated the system. If he didn't, Kael-B got nothing. The law had no word for this. It had words for murder, for slavery, for negligence. It did not have a word for branching. It did not have a word for the sin of making two people where there was once one, and then asking which one deserved to suffer.

  Elias closed the Welfare Metric Calculator. The branching tree remained on his screen, green and red, pulsing like a heartbeat that couldn't decide on a rhythm. He reached for his coffee, but his hand hovered. He wasn't sure if the Elias who started this audit was the same one who had to finish it.

  He left the field blank. *Victim Identity: [ERROR].*

  He stared at the cursor, blinking in the empty box. It was the only honest answer he had. The question wasn't whether the fork was ethical. The question was whether a world that required such an audit could ever be whole enough to judge it.

  Elias saved the file as "Draft." He turned off the screen, leaving the two Kaels in the dark, waiting for a judgment that no longer made sense.
