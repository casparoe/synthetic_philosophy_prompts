      *   *Middle:* The red line flatlines (suspend) then moves slow. Kael-2's testimony: "It was like being underwater." Vantage's defense: "No pain receptors triggered."
      *   *Internal Conflict:* Elias tries to use the Standard Welfare Metric. It requires a baseline self. Which self?
