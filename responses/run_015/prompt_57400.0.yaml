          *   *Refinement:* Actually, the Milgrom-Stokey theorem relies heavily on Common Knowledge of Rationality and Common Priors. If I keep (1) but reject (3) (trades aren't fully informative), trade is possible. If I reject (1) (Heterogeneous Priors), trade is possible.
