answer: |-
  ### Preliminary Adjudication: The Request and The Dispute

  **On the Request:**
  You have asked me to violate a methodological boundary. Hume's monetary framework is built on metallic money, convertible paper, and the price-specie-flow mechanism. It is not merely difficult but conceptually incoherent to map his *mechanism* directly onto a fiat regime where money does not flow out via specie but via exchange rate depreciation, and where reserves are not lent into circulation but sit as base money. To give you the "committed answers" you demand, I must extrapolate from his *principles* (the nature of credit, the danger of debt, the neutrality of money) while acknowledging where his *mechanics* (specie flow) break. I will proceed, but I will mark the breaks explicitly. If I did not, I would be smuggling in assumptions Hume never held, as you warned.

  **On the Dispute:**
  **You have him.** Your friend has the better soundbite; you have the system.

  Your friend relies on the famous passage in *Of Money* where Hume admits that "a gradual increase of the circulating medium... is favourable to industry." However, your friend treats this as a policy recommendation. In context, Hume is describing the historical shock of New World silver—a windfall that arrived unevenly and unannounced. He treats the stimulation of industry as a temporary "money illusion" effect during the transition period before prices rise. He does not advocate engineering this transition as policy.

  Furthermore, your friend ignores the weight of *Of Public Credit* and the long-run neutrality conclusion of *Of Money*. Hume's system rests on the idea that money is a "representative sign" (oil), not a wheel. If you increase the oil beyond the needs of the machinery, it does not make the machine run faster; it makes it slip. His approval of paper credit is strictly conditional: it must represent real value and facilitate trade, not finance government deficits or create fictitious capital. Your reading captures the tension in his work: money can stimulate in the short run via surprise, but policy cannot institutionalize surprise without destroying the trust required for credit to function.

  ***

  ### The Six Verdicts

  #### 1. Central banks expanding balance sheets via government debt purchases (QE)
  **Verdict:** **Disapproving**

  **Argument:** Hume distinguishes sharply between money that circulates among merchants and manufacturers (which quickens industry) and money that sits idle or circulates only among financiers. In *Of Money*, he notes that if money is "locked up in chests," it is as if it were annihilated. Modern quantitative easing creates bank reserves—high-powered money that often remains within the financial system rather than entering the "circulation" of wages and commodities. Hume would view this as "multiplying paper" without a corresponding increase in real commerce. It creates the appearance of wealth without the substance, inflating asset prices (which he distrusted) rather than stimulating the "diligence" of the productive classes.

  **Text vs. Extrapolation:**
  *   **Text:** His distinction between money in circulation vs. hoarded; his suspicion of "fictitious credit."
  *   **Extrapolation:** Equating central bank reserves with Hume's concept of "hoarded" specie. Hume did not conceive of a monetary base distinct from circulating media, but the principle that money must reach the industrious to be beneficial is textual.

  #### 2. A standing, publicly announced target for the annual rate of inflation
  **Verdict:** **Disapproving**

  **Argument:** This directly contradicts the mechanism by which Hume believes money stimulates industry. The benefit of monetary expansion, for Hume, relies entirely on the *interval* between the arrival of money and the rise of prices. It depends on agents *not knowing* the general price level will rise, thus mistaking nominal gains for real gains. An announced target eliminates the surprise. If merchants know prices will rise 2%, they raise prices immediately. The "quickening of diligence" vanishes, leaving only the depreciation. Hume would view this as institutionalizing the depreciation of the unit of account without securing the temporary stimulus.

  **Text vs. Extrapolation:**
  *   **Text:** The "interval" argument in *Of Money* ("It is only in this interval... that the encrease of money is favourable to industry").
  *   **Extrapolation:** Applying the psychological mechanism of money illusion to a modern policy rule. Hume assumed the shock was exogenous; applying this to an endogenous rule is logical extrapolation of his causal chain.

  #### 3. US current-account deficits without correction (Dollar as reserve currency)
  **Verdict:** **Genuinely Indeterminate (Framework Break)**

  **Argument:** Here the counterfactual fails. Hume's price-specie-flow mechanism dictates that a nation with high prices (due to money inflow) will lose exports, specie will flow out, prices will fall, and equilibrium will be restored. This mechanism *requires* that the money received abroad be spent or reinvested in a way that raises foreign prices, or that the specie physically returns. If the rest of the world chooses to hoard dollar assets indefinitely as reserves, the "level-finding" mechanism is severed. The money does not return to bid up US prices, nor does it leave to lower them. Hume's system has no variable for "global reserve currency status." He would likely predict a catastrophic correction eventually, assuming the hoarding must cease, but his model cannot explain the duration of the imbalance.

  **Text vs. Extrapolation:**
  *   **Text:** The price-specie-flow mechanism in *Of the Balance of Trade*.
  *   **Extrapolation:** None. This is where you must surrender the premise that money automatically seeks its level through trade balances. To answer this, Hume would have to surrender the assumption that foreign holders will spend the money rather than hoard it as a store of value.

  #### 4. A fixed-supply, decentralized money (e.g., Bitcoin)
  **Verdict:** **Disapproving**

  **Argument:** While Hume distrusts the magistrate's ability to manage money wisely (preferring the automaticity of specie), he is equally concerned that the money supply accommodate the growth of trade. In *Of Money*, he argues that an increase in money is beneficial *if* trade is growing, because it prevents the discouragement of industry that comes from falling prices (deflation). A fixed supply in a growing economy guarantees deflation. Hume views deflation as destructive to industry because it increases the real burden of debt and lowers the nominal profits that motivate merchants. He would prefer the "oil" to expand with the "wheels." He would like the lack of magistrate control but hate the deflationary bias.

  **Text vs. Extrapolation:**
  *   **Text:** His preference for specie over paper (no magistrate); his argument that money supply should match the "art and industry" of the nation.
  *   **Extrapolation:** Applying his views on deflation to a cryptographic asset. The logic holds: if industry grows and money does not, prices fall, and Hume believes this dampens production.

  #### 5. Trade restrictions for industrial policy/security (not jealousy)
  **Verdict:** **Qualified Approval (Security only)**

  **Argument:** In *Of the Jealousy of Trade*, Hume dismantles the mercantilist idea that one nation's gain is another's loss. He argues for free trade as the path to general riches. However, he explicitly carves out an exception for national defense. He writes that it is reasonable to check a rival's naval power if it threatens your existence. He would reject "industrial policy" aimed merely at enriching a specific sector (that is the "jealousy" he condemns), but he would accept restrictions justified by the security of supply chains *if* framed as a matter of defense rather than economic rivalry. The distinction lies in the motive: security is legitimate; economic engineering is not.

  **Text vs. Extrapolation:**
  *   **Text:** *Of the Jealousy of Trade* ("It is... very unwise... to envy the improvements of our neighbours... But... we ought to endeavour... to render [our navy] formidable").
  *   **Extrapolation:** Mapping "naval power" to "supply chain security." This is a tight analogy. Hume accepts trade-offs between wealth and power, provided the goal is survival, not relative wealth.

  #### 6. Public debt above 100% of national income
  **Verdict:** **Strongly Disapproving**

  **Argument:** This is the clearest case. *Of Public Credit* is unambiguous. Hume argues that public debt is a "ruinous" practice that either leads to default (bankruptcy) or tyranny (high taxation to service debt). He explicitly states, "Either the nation must destroy public credit, or public credit will destroy the nation." He rejects the idea that debt is "owed to ourselves," arguing it shifts resources from the industrious to the idle rentier class. The level of debt (100%+) and the duration (decades) would confirm his worst fears: that the state has mortgaged its future revenue to finance present consumption, creating a class of creditors dependent on the state's perpetuity rather than the nation's industry.

  **Text vs. Extrapolation:**
  *   **Text:** *Of Public Credit* ("The practice of contracting debt will almost infallibly be abused... in every government").
  *   **Extrapolation:** None. This is a direct application. Hume did not distinguish between debt held domestically or externally in a way that would mitigate this; he viewed the servicing of the debt as the drain on industry.

  ***

  ### Summary of the Framework Break
  You asked me to mark where the framework lacks resources. Item 3 is the critical failure point. Hume's monetary theory is a theory of *commodity money* (even when paper is used, it is convertible). It relies on arbitrage. A fiat reserve currency that is hoarded globally breaks the arbitrage loop. To speak for Hume here, one must assume he would view the hoarding as a temporary insanity that must correct, or that he would view the dollar not as money but as a bond. If he viewed it as a bond, he would revert to his verdict on Item 6 (Disapproving). If he viewed it as money, his model cannot explain the stability.

  **Final Word:** Your friend reads Hume as if he discovered the Phillips Curve. You read him as a Classical economist who acknowledged short-run frictions. The text supports you. Hume would not be a dove; he would be a skeptic of financial engineering, a hawk on public debt, and a proponent of money that serves trade rather than directs it.
