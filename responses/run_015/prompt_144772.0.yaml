answer: |-
  # JOINT STATEMENT ON THE SEMANTICS AND PRAGMATICS OF KNOWLEDGE ATTRIBUTIONS

  **Undersigned:**
  **Party A:** Proponent of Epistemic Contextualism (EC)
  **Party B:** Proponent of Subject-Sensitive Invariantism (SSI)

  **Date:** 24 October 2023

  ## Preamble

  We, the undersigned, acknowledge a shared commitment to resolving the dispute regarding the role of practical factors in knowledge attributions. While we agree that traditional insensitive invariantism fails to capture the full range of linguistic and epistemic data, we disagree on the mechanism by which practical factors influence the truth conditions of sentences of the form 'S knows that p'. This statement delineates our common ground, isolates our genuine disagreements, and identifies the empirical and argumentative cruxes required to move the debate forward.

  ## (i) Agreed Claims

  1.  **Rejection of Pure Intellectualism:** We agree that the truth conditions of knowledge attributions are not determined solely by truth, belief, and traditional epistemic justification (e.g., reliability or evidence) in isolation from practical factors. A theory that ignores practical stakes entirely is insufficient to explain ordinary usage.
  2.  **Stakes-Sensitivity is Real:** We agree that there is a robust phenomenon of stakes-sensitivity. Intuitions regarding the truth or felicity of 'S knows that p' vary systematically when practical stakes are manipulated. This variation is not merely a performance error or a confusion; it demands a theoretical explanation.
  3.  **Semantic Aspiration:** We agree that the best explanation for this variation should be semantic or truth-conditional, rather than purely pragmatic (e.g., mere implicature). We both aim to explain why a knowledge attribution can be true in one practical setting and false in another, without accusing the speakers of systematic mistake.
  4.  **Handling of Specific Cases:** We agree that any adequate theory must provide a determinate prediction for the following four cases. We further agree that a theory which fails to match the intuitive verdicts in these cases without ad hoc modification is defective.
      *   **Case 1 (Divergence):** Where subject stakes and attributor stakes come apart.
      *   **Case 2 (Distributed Subject):** Where a collective subject possesses internal variance in stakes.
      *   **Case 3 (Hidden Stakes):** Where the subject is ignorant of the practical magnitude of their situation.
      *   **Case 4 (Deferred Stakes):** Where the practical consequences of being wrong arise after the attribution or action.
  5.  **Prohibited Moves:** We agree that the following argumentative strategies constitute bad faith or theoretical failure in this collaboration:
      *   Dismissing the opposing side's intuitions as 'mistakes' without a positive error theory.
      *   Redefining 'knowledge' mid-argument to suit a specific case.
      *   Conflating the question 'Does S know?' with 'Is S rational to act?', unless one explicitly argues for the reduction of one to the other.
      *   Ignoring the linguistic data regarding retraction and disagreement.

  ## (ii) Residual Disagreements

  The following table isolates the locus of our disagreement. We agree on the data; we disagree on what determines the truth conditions.

  | Domain of Dispute | Party A (Contextualist) Formulation | Party B (Subject-Sensitive Invariantist) Formulation |
  | :--- | :--- | :--- |
  | **The Locus of Variation** | The semantic content expressed by 'knows' shifts depending on the **attributor's** context. The standards for knowledge are set by the speaker's practical situation and conversational goals. | The semantic content of 'knows' is invariant. However, whether a subject stands in the knowledge relation to a proposition depends on the **subject's** practical environment. |
  | **Case 1: Divergence**<br>(Subject Low Stakes / Attributor High Stakes) | The attribution 'S knows' is **false**. The attributor's high stakes raise the semantic standard for 'knows' in this context, which the subject (with low evidence) fails to meet. | The attribution 'S knows' is **true**. The subject's low stakes mean the epistemic bar is low. The attributor's high stakes are irrelevant to the truth of the claim about the subject. |
  | **Case 2: Distributed Subject**<br>(Clinical Team Spokesperson) | The truth of 'We knew' depends on the **spokesperson's context** at the time of utterance. If the spokesperson is addressing a high-stakes inquiry, the standard is high for the whole claim. | The truth of 'We knew' depends on the **aggregate practical situation** of the team. If any key member faced high stakes sufficient to defeat knowledge, the collective claim is false, regardless of the spokesperson's context. |
  | **Case 3: Hidden Stakes**<br>(Subject Unaware of Risk) | The truth depends on the **attributor's awareness**. If the attributor knows the stakes are high, 'S knows' is false. If the attributor is ignorant, 'S knows' may be true, even if the subject is in danger. | The truth depends on the **objective facts** of the subject's situation. If the stakes are objectively high, the subject requires more evidence to know. The subject's ignorance of the stakes does not lower the bar. |
  | **Case 4: Deferred Stakes**<br>(Consequences Arise Later) | The truth depends on the **context at the time of utterance**. If the attributor is currently in a low-stakes context, 'S knows' is true now, even if future stakes are high. | The truth depends on the **stakes at the time of the subject's decision**. If the current decision locks in future high stakes, the epistemic bar is raised now. 'S knows' is false if current evidence does not meet that bar. |

  ## (iii) Cruxes and Agreed Tests

  We identify the following three issues as decisive. We commit to accepting the outcome of these tests as binding for the viability of our respective positions.

  | Crux | Agreed Test Case or Argument | Party A (EC) Prediction | Party B (SSI) Prediction |
  | :--- | :--- | :--- | :--- |
  | **Retraction Data** | **Scenario:** Attributor A says 'S knows' in a low-stakes context. Later, A moves to a high-stakes context regarding the same proposition.<br>**Test:** Is A obliged to retract their earlier assertion ('I was wrong') or merely qualify it ('I spoke loosely')? | A is **not** obliged to retract. The earlier utterance was true in its original context. Retraction would be inappropriate as no error was made. | A **is** obliged to retract (or admit error). Since the standard is invariant relative to the subject, if S didn't meet the high standard (which applies universally), the earlier claim was false. |
  | **Disagreement Data** | **Scenario:** Attributor A (low stakes) says 'S knows'. Attributor B (high stakes) says 'No, S does not know'. They are discussing the same subject at the same time.<br>**Test:** Is there a genuine contradiction here? | There is **no genuine contradiction**. Both assertions can be simultaneously true because 'knows' expresses different relations in A's and B's mouths. | There is a **genuine contradiction**. 'Knows' expresses a single relation. One party must be wrong about whether S meets the invariant standard determined by S's stakes. |
  | **Embedding under Conditionals** | **Scenario:** 'If S knows the bank is open, we can wait until tomorrow.' (Uttered by a high-stakes attributor about a low-stakes subject).<br>**Test:** Does the antecedent evaluate based on the attributor's stakes or the subject's? | The antecedent evaluates based on the **attributor's stakes**. The conditional is false if the attributor's standards are not met, even if the subject's are. | The antecedent evaluates based on the **subject's stakes**. The conditional is true if the subject meets the bar set by their own practical situation. |

  ## (iv) Epistemologist's Closing Note on the Dispute

  *Drafted by the Convenor*

  Having analysed the joint statement above, I offer the following assessment regarding the nature of the dispute between Epistemic Contextualism and Subject-Sensitive Invariantism.

  **Merely Verbal Elements:**
  A portion of the dispute appears verbal, centring on the labelling of 'semantics' versus 'pragmatics'. If Party A (EC) defines 'content' as strictly truth-conditional and Party B (SSI) allows practical factors to determine the relation without shifting 'content', they may be describing the same functional dependency using different technical vocabularies. Specifically, if SSI admits that the *extension* of 'knows' varies with subject stakes, and EC admits that the *mechanism* is triggered by practical salience, the disagreement over whether this constitutes a 'shift in meaning' or a 'shift in standards' may be terminological. Furthermore, both parties agree that traditional invariantism is false; the fight is over the architecture of the alternative, not the phenomenon itself.

  **Substantive Elements:**
  However, a core substantive disagreement remains regarding **assessment sensitivity**. The Retraction Data crux (Section iii) highlights a genuine divergence. If speakers in high-stakes contexts feel compelled to retract low-stakes claims as *false* (rather than merely *imprecise*), this favours SSI. If they feel the earlier claim remains *correct* given the earlier situation, this favours EC. This is not merely verbal; it is an empirical claim about linguistic behaviour and normative commitment. Additionally, Case 3 (Hidden Stakes) presents a metaphysical divergence: does knowledge depend on the objective reality of the subject's situation (SSI) or the epistemic perspective of the attributor (EC)? This touches on the fundamental nature of epistemic norms—whether they are agent-centred or assessor-centred.

  **Conclusion:**
  The collaboration should focus primarily on the Retraction and Disagreement cruxes. These offer the clearest path to empirical adjudication. If the data shows that speakers treat knowledge attributions as assessment-sensitive (truth varies by who is judging), EC gains ground. If speakers treat them as use-sensitive (truth varies by the subject's situation regardless of who judges), SSI gains ground. Until this linguistic data is settled, the dispute remains substantive.

  ***

  **End of Statement**
