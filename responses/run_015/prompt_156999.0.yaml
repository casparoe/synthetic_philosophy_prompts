  *Wait, one constraint:* "Definitly no asides about what Tolstoy historically really meant." Keep it to the text's logic as read by them.

  *Okay, let's go.*
answer: |-
  M: It's counterfeit. Full stop. The studio didn't feel anything. They optimized skin conductance. That's exactly what Tolstoy calls "effectfulness"—producing a reaction without the inner necessity.

  R: But it infects. You said it yourself: viewers across cultures feel tenderness. Tolstoy's primary definition is the transmission of feeling. If the receiver feels it, the transmission happened. How does the audience's sincerity detector work if the signal gets through anyway?

  M: Because the feeling decays in an hour. Tolstoy distinguishes between a mere stimulation of nerves and a true union. If it doesn't alter how you treat the world—no voting, no behavioral change—it wasn't religious art, it wasn't brotherhood. It was a trick.

  R: So now infection isn't enough? You've added a durability clause and a behavioral clause. If the test is subjective reception, this film passes. The audience feels united. If you reject it because the creators were cynics, you're saying the audience can't actually judge the art. You're saying they need a biography of the editors to know if they've experienced art.

  M: I'm saying sincerity is the engine. Without it, the infection is superficial. Tolstoy says sincerity is the most important condition. If the artist lies, the union is false. You can't build brotherhood on a manipulated reflex.

  R: But that makes sincerity a metaphysical claim, not an aesthetic one. From the receiving end, a manipulated reflex and a sincere transmission feel identical. If they feel identical, your test doesn't discriminate. It collapses into the Brotherhood test. You're not judging art; you're judging politics. If the feeling promotes solidarity, it's good. If it doesn't, it's bad. "Infection" is just window dressing.

  M: Not window dressing. It's the mechanism. Brotherhood is the goal, infection is the proof. But okay, I'll concede: if the audience can't distinguish sincerity from effectfulness, the test is vulnerable to manipulation. That's a real weakness. But look at the flip side. Take a fifteenth-century Mass. Or a Noh play. Today, they infect nobody without a musicologist explaining the context.

  R: Exactly. Tolstoy would call that counterfeit because it's exclusive. It requires training. It doesn't unite the peasant with the king.

  M: He would. And he'd say if it needs an expert to explain the feeling, it's not clear, and therefore not art.

  R: That's where the theory breaks. You're calling it counterfeit because of *distance*, not quality. The feeling was sincere then. It united people then. Now it requires translation. If "clearness" is relative to cultural context, then almost all historical art is counterfeit. Tolstoy trashes Shakespeare and Beethoven because they don't speak to a Russian peasant in 1897. That's not a theory of art; that's a preference for immediate accessibility.

  M: I'll concede that "clearness" shouldn't mean "instantly understandable without effort." Effort can be part of the union. But Tolstoy's point is about exclusivity. If only the trained elite can feel it, it divides rather than unites. The studio film divides too—it separates the manipulators from the manipulated.

  R: But the Mass unites the modern listener with the past listener, if they do the work. The studio film unites nobody; it just spikes cortisol or oxytocin. Here's my crux: You want "infection" to be a causal claim—a psychological fact about feelings moving from A to B. But you use it as a value claim.

  M: How so?

  R: When the film works, you say it's not real infection because it decays. When the Mass fails to work, you say it's not real art because it needs explanation. "Infection" only exists when you already approve of the outcome. It's not evidence; it's a synonym for "successful moral influence."

  M: I see the trap. If infection is just causal, the studio film is art. If it's normative, the theory is circular. I want to say sincerity bridges that. Sincerity makes the feeling durable. But I can't prove sincerity to you without looking at the results.

  R: And I can't prove the Mass is art without assuming cultural distance isn't a disqualifier. So we're stuck on whether art is a mechanism of transmission or a label for successful moral union.

  M: Right. If it's a mechanism, the cynics can make art. If it's a label, Tolstoy is just preaching.

  R: And if it's a mechanism, how do we measure it without biometrics? If it's a label, why pretend the audience is the judge?

  M: Because if the audience isn't the judge, who is? The critics? Tolstoy hates them.

  R: Exactly. So you need the audience to feel something, but you reserve the right to tell them their feeling doesn't count if it fades.

  M: Then the disagreement isn't about the film. It's about whether a feeling that fades was ever really "shared."

  R: Or whether "sharing" is just the word we use for feelings we wish would last.
