prompt: |-
  For about fifteen years I have read rationalist blogs and forums more or less daily, and the durable effect is a reflex: when a group of people settles on an answer, I want to know whether the group is tracking something or merely aggregating social pressure. I now chair the review committee of a small grantmaking foundation, which has handed me the job of writing our voting procedure, and the justification I keep reaching for — nine of us, most of us better than chance, so the majority is almost certainly right — is carrying more weight than I can defend.

  I do not need the textbook version of the Condorcet jury theorem; I have the textbook version. What I need is a procedure the committee can actually run, built on what the theorem and its descendants genuinely license, and candid about where we have been assuming what we would have to argue for. Nine members, uneven and overlapping expertise, monthly meetings, two kinds of question: factual ones (will this program produce the outcome its proposal claims?) and evaluative ones (is this worth funding at all?). Fixed budget each cycle. Three years of minutes, plus each member's record on the questions where we later learned the answer. No statistician; the board must approve whatever I write; and it has to be runnable in the ten minutes before a vote. We tried an internal prediction market for one cycle and it was a mess, which is one reason I would rather the procedure rest on the structure of the vote than on anyone's self-reported confidence.

  Write the procedure so that it answers, in the order these things arise:

  - how to tell whether a question is one the theorem speaks to at all — a determinate answer, members better than chance, errors independent given the truth — and what to do with the questions that fail that test, including, I suspect, every evaluative question we face, where the majority may have standing to decide and no authority to be right, and where the procedure must stop and leave the call to a named person rather than to a rule;
  - what to do about the fact that our errors are plainly correlated: we read the same two sector reports and the same three funders' assessments, so I doubt we are nine independent draws. I want a step that estimates how much independence survives, steps that manufacture more of it (what must happen before anyone speaks, what members must disclose about where their view came from), and a clear statement of how much of the theorem's benefit remains when independence is only partial;
  - guidance for questions with more than two options, where I understand majority rule can fail to be even internally consistent;
  - a decision about weighting — demonstrated accuracy, stated confidence, or neither — given small samples, a shifting mix of question types, and the likelihood that some members are worse than chance on some kinds of question.

  Then run it on three cases: a factual call where our sources overlap heavily, an allocation among three candidate programs, and a plainly evaluative question. At least one should come out in a way I will not like, and I want to be told which steps are not procedure at all but my discretion dressed up as method. No reading list and no citations; I will take the results on trust. What I want is a checklist I could hand to a colleague who has never heard of Condorcet and have her run it in a meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested voting procedure:

  1.  **Analyze the Request:**
      *   **User:** Experienced rationalist (15 years), chairs a grantmaking review committee (9 members).
      *   **Problem:** Wants a voting procedure based on Condorcet Jury Theorem (CJT) principles but *practical* (runnable in 10 mins), *honest* about assumptions (independence, competence), and *actionable* (no statistician, board approval needed).
      *   **Constraints:** 9 members, uneven expertise, monthly meetings, fixed budget, two question types (factual vs. evaluative), 3 years of historical data available. No prediction markets (failed previously). No reading list/citations.
      *   **Required Output Structure:**
          1.  Procedure answering specific points in order:
              *   Test for CJT applicability (factual vs. evaluative).
              *   Handling correlated errors (information hygiene, independence estimation).
              *   Multi-option questions (avoiding cycles).
              *   Weighting (accuracy vs. confidence vs. equal).
          2.  Run the procedure on three specific cases (factual/overlapping sources, allocation/3 options, evaluative).
          3.  One case must yield an unpalatable result.
          4.  Identify where discretion is disguised as method.
          5.  Format: A checklist usable by a layperson.

  2.  **Deconstruct the Theoretical Challenges:**
      *   *CJT Core:* Requires binary choice, truth exists, $p > 0.5$, independence.
      *   *Reality Check:* Grantmaking involves value judgments (no "truth"), correlated information (same reports), varying expertise ($p$ varies), multi-option scenarios (budget allocation).
      *   *User's Insight:* "Majority has standing to decide and no authority to be right" on evaluative questions. This is crucial. The procedure must distinguish *epistemic* voting (truth-tracking) from *political/ethical* voting (preference aggregating).

  3.  **Drafting the Procedure - Section by Section:**

      *   **Step 1: The Type Test (Factual vs. Evaluative).**
          *   Need a heuristic to distinguish. Can we verify this in 3 years? If yes -> Factual. If no -> Evaluative.
          *   *Action:* If Evaluative, CJT doesn't apply. Don't pretend it does. Use a "Responsibility Assignment" (named person/Chair) or simple majority as a *political* mandate, not truth. The prompt asks to leave the call to a named person if the procedure must stop. Let's make it the Chair or a Rotating Decider for evaluative deadlocks, but for standard evaluative votes, acknowledge it's preference aggregation. Actually, the prompt says "procedure must stop and leave the call to a named person rather than a rule" for evaluative questions where majority has no authority to be right. Okay, I will implement a "Decider" step for evaluative questions.
          *   *Refinement:* Wait, grant committees usually vote on funding. If it's purely evaluative ("Is this worth funding?"), CJT fails. The prompt says "leave the call to a named person." I will designate the Chair as the tie-breaker/decider on evaluative questions, but the vote serves as advice.

      *   **Step 2: Correlation & Independence.**
          *   Problem: Everyone reads the same reports.
          *   Solution: "Blind First Impressions." Before discussion, write down votes/reasoning.
          *   Disclosure: "Source Tagging." Where did this opinion come from? (Report A, Personal Knowledge, Conversation with Applicant).
          *   Adjustment: If everyone cites Report A, $N_{eff}$ (effective N) drops. We can't calculate exact $N_{eff}$ in 10 mins without a statistician. We need a heuristic. *Rule:* If >50% cite the same single source, treat the group as 3 independent voters, not 9. Or simply require discussion to diversify inputs before voting. Let's go with *Information Hygiene* + *Effective Count*.
          *   *Heuristic:* Count "Independent Clusters." If 6 people rely on Report X, they count as 1 vote.

      *   **Step 3: Multi-Option Questions.**
          *   Problem: Condorcet cycles.
          *   Solution: Pairwise elimination or Borda? Borda is easier but vulnerable to strategy. Pairwise is Condorcet-consistent but slow.
          *   *Constraint:* 10 minutes.
          *   *Selection:* "Approval Voting" or "Score Voting" is often better than Ranked Choice for grants. But the prompt asks about CJT descendants. CJT is binary. For multi-option, we need to reduce to binary or use a method that approximates truth.
          *   *Decision:* Use "Sequential Binary Voting" (Amendment procedure). It forces binary choices where CJT *might* apply. Or, simpler: "Score Voting (0-5)" treated as a signal of probability of success.
          *   *Better fit for prompt:* The prompt asks about "majority rule can fail to be even internally consistent." I need a method that resolves this. *Runoff Voting.* Pick top 2, then vote. It reduces to binary.

      *   **Step 4: Weighting.**
          *   Options: Accuracy (track record), Confidence, Equal.
          *   Constraint: Small samples, shifting types.
          *   *Decision:* Equal weighting is robust but ignores expertise. Confidence is noisy. Track record is best but needs calibration.
          *   *Compromise:* "Calibrated Equality." Everyone gets 1 vote. *Unless* a member has a tracked record of $>70\%$ accuracy on *this specific type* of question (Factual/Forecasting). Then they get 2 votes.
          *   *Wait:* 9 members. 3 years data. That's enough for a rough track record.
          *   *Refinement:* Keep it simple. Equal votes, but "Expert Veto" or "Expert Anchor"? No, that breaks CJT.
          *   *Selected:* Equal votes. Why? Because estimating $p_i$ in real-time is error-prone and creates social friction. *However*, the prompt asks for a decision given the likelihood some are worse than chance.
          *   *Pivot:* Use the "Track Record Filter." If a member is statistically worse than chance on a specific domain (e.g., technical feasibility), their vote is inverted or discarded. This is bold but fits the "rationalist" vibe. Let's go with *Discard/Invert* for known negative competence, Equal for unknown/positive.

  4.  **Developing the Three Cases:**

      *   **Case 1: Factual (Overlapping Sources).**
          *   Scenario: Will Program X hit 10k beneficiaries?
          *   Input: Everyone read the same consultant report.
          *   Process: Independence check fails. Effective N drops.
          *   Outcome: We treat it as 3 voters. Majority threshold changes.
          *   *Unpalatable Result:* The group feels confident (9-0), but procedure says "Low Confidence/Defer."

      *   **Case 2: Allocation (3 Options).**
          *   Scenario: Fund A, B, or C? (Fixed budget, pick one).
          *   Process: Reduce to binary. A vs B, Winner vs C.
          *   Outcome: Cycle potential.
          *   *Unpalatable Result:* The "Compromise" candidate loses in pairwise matchups despite being everyone's second choice. (Condorcet Loser paradox).

      *   **Case 3: Evaluative.**
          *   Scenario: Is this mission-aligned?
          *   Process: Type Test fails. CJT void.
          *   Outcome: Chair decides.
          *   *Unpalatable Result:* The Committee votes 8-1 "Yes", Chair says "No". (Highlights the "standing vs authority" distinction).

  5.  **Refining the "Discretion vs. Method" Section:**
      *   Must be honest. The "Type Test" is subjective. The "Independence Cluster" counting is subjective. The Track Record cutoff is arbitrary.

  6.  **Writing the Checklist:**
      *   Tone: Professional, direct, operational. No academic fluff.
      *   Structure: Follow the prompt's required order.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Effective N" heuristic runnable in 10 mins?
      *   *Fix:* Make it a show of hands. "Who relied primarily on Report X?" If >5, group them.
      *   *Critique:* Is the Evaluative "Chair Decides" acceptable?
      *   *Fix:* The prompt explicitly asked for "leave the call to a named person rather than to a rule" for evaluative questions. So yes, this is required.
      *   *Critique:* Weighting.
      *   *Fix:* Keep it simple. Equal weight is the default. Weighting by track record is too complex for a 10-min window without a pre-computed table. I will recommend *pre-computed* weights based on the 3-year data, brought to the meeting.
      *   *Wait, one constraint:* "No statistician." Pre-computing weights requires someone to do the math.
      *   *Adjustment:* The Chair (user) does the math once a year. The committee just uses the weights.
      *   *Actually:* The prompt says "I keep reaching for... nine of us... majority almost certainly right." I need to debunk this gently.
      *   *Re-evaluating Weighting:* If I suggest weighting, I need to explain how. Let's suggest "Domain Tags." If you are the designated "Finance Expert," your vote on finance questions counts double. Simple, transparent.

      *   *Re-evaluating Case 1 (Unpalatable):* The prompt asks for *one* case to come out in a way I will not like.
      *   *Idea:* The Factual case where sources overlap. The procedure should conclude "We cannot know," overriding the 9-0 consensus. That hurts.
      *   *Idea:* The Evaluative case. The committee votes Yes, Chair says No. That hurts.
      *   *Selection:* I'll make the Evaluative case the unpalatable one. It reinforces the "no authority to be right" point.

      *   *Re-evaluating Independence:* How to estimate independence in 10 mins?
      *   *Method:* "Source Disclosure." Write down the *primary* reason for your vote. Cluster them. If 7 people write "Page 4 of Consultant Report," you have 1 independent signal, not 7.
      *   *Rule:* If a cluster > 3 people, count that cluster as 2 votes total (dilution).

  8.  **Final Polish:**
      *   Ensure the "Discretion" section is candid.
      *   Ensure the Checklist is distinct from the Commentary.
      *   Check constraints: 9 members, 10 mins, no citations.

      *(Self-Correction on Weighting)*: The prompt asks for a decision on weighting given small samples and shifting mix.
      *   *Decision:* **Equal Weighting with Competence Veto.** Why? Because estimating $p > 0.5$ is hard. But identifying $p < 0.5$ (worse than chance) is sometimes possible (e.g., someone consistently wrong on tech).
      *   *Better Decision:* **Domain-Weighted.** Use the 3 years of minutes. Identify 3 domains (e.g., Financial, Programmatic, Contextual). Assign 1.5 votes to the top 2 performers in each domain per year. This is runnable if the Chair prepares the sheet beforehand.
      *   *Simpler:* Just stick to Equal Weight. It's the most robust against gaming. I will argue for Equal Weight but with a "Calibration Check" (if you are wrong 3 times in a row on facts, you recuse on facts).
      *   *Actually, let's look at the prompt again:* "guidance for questions... a decision about weighting."
      *   *Okay:* I will recommend **Equal Weight** but with **Recusal for Negative Track Records**. This is defensible without a statistician.

      *(Final Plan for Case 1)*: Factual, heavy overlap. Procedure says "Insufficient Independence." Vote is advisory only. Chair decides. (This undermines the committee's epistemic power).
      *(Final Plan for Case 2)*: 3 Options. Sequential Pairwise.
      *(Final Plan for Case 3)*: Evaluative. Chair decides.

      *Wait, I need to make sure I answer the specific order:*
      1. Test for CJT applicability.
      2. Correlated errors/Independence.
      3. Multi-option.
      4. Weighting.
      Then the 3 cases.
      Then the "Discretion" admission.

      *Let's refine the Independence Step.* "Source Clustering."
      *Let's refine the Weighting Step.* "Equal Weight, unless Track Record < 40%."

      *Let's refine the Unpalatable Case.* I think the Evaluative one is the strongest philosophical point. The Committee votes 8-1 to fund. The procedure says "This is a value judgment. Majority has standing, not authority. Chair decides." Chair rejects. This hurts the democratic feel but respects the epistemic limit.

      *Wait, one more thing:* "Nine of us, most of us better than chance, so the majority is almost certainly right — is carrying more weight than I can defend."
      I need to make sure the procedure explicitly reduces confidence when assumptions fail.

      *Okay, ready to write.*
answer: |-
  # The Epistemic Voting Protocol (EVP)

  **Purpose:** To distinguish between questions the committee can answer *correctly* (factual/forecasting) and questions the committee must *decide* (evaluative/policy), and to adjust voting weight based on the independence of information.
  **Time Required:** 10 minutes prior to voting.
  **Materials:** Whiteboard, voting slips, historical accuracy table (maintained by Chair).

  ---

  ## Part 1: The Procedure

  ### 1. The Type Test (Truth vs. Preference)
  *Before discussion begins, the Chair classifies the question.*

  *   **The Test:** Ask: "Can we verify the answer within 36 months using data not currently in the room?"
      *   **Yes (Factual):** e.g., "Will this intervention reach 5,000 beneficiaries?" "Is the budget mathematically consistent?"
          *   *Action:* Proceed to Step 2. The goal is **Truth-Tracking**.
      *   **No (Evaluative):** e.g., "Is this mission-aligned?" "Should we prioritize equity over efficiency?" "Is this worth funding given our other grants?"
          *   *Action:* **Stop.** The Condorcet logic does not apply. There is no "right" answer to aggregate.
          *   *Protocol:* The committee vote is advisory only. The **Chair** (or a designated "Decider" for the cycle) makes the final call. The vote serves to signal political cost, not epistemic probability.

  ### 2. The Independence Check (Handling Correlation)
  *Applies only to Factual questions.*

  *   **The Problem:** If nine people read the same report, you do not have nine votes. You have one vote repeated nine times.
  *   **The Step:**
      1.  **Silent Writing:** Before speaking, every member writes their vote (Yes/No) and their **Primary Source** on a slip (e.g., "Consultant Report," "Site Visit," "Personal Expertise," "Applicant Data").
      2.  **Source Clustering:** The Chair groups slips by Primary Source.
      3.  **The Dilution Rule:**
          *   If a source cluster has **1–3 members**: Count as **1 vote per member**.
          *   If a source cluster has **4–6 members**: Count the whole cluster as **3 votes total** (distributed proportionally).
          *   If a source cluster has **7–9 members**: Count the whole cluster as **2 votes total**.
      4.  **Threshold Adjustment:** Calculate the "Effective Vote Count" ($N_{eff}$). The majority threshold is always $> 50\%$ of $N_{eff}$, not the raw headcount.
      5.  **Failure Condition:** If $N_{eff} < 5$, the committee **cannot vote to decide**. The outcome is recorded as "Insufficient Epistemic Independence." The Chair decides, or the question is tabled for more diverse data gathering.

  ### 3. Multi-Option Resolution (Avoiding Cycles)
  *Applies when choosing between >2 options (e.g., funding Program A, B, or C).*

  *   **The Problem:** Majority preferences can cycle (A beats B, B beats C, C beats A).
  *   **The Step:** **Sequential Pairwise Elimination.**
      1.  Randomize the order of options (A, B, C).
      2.  Vote A vs. B using the EVP (Steps 1 & 2).
      3.  Vote Winner vs. C.
      4.  Final Winner is funded.
  *   **Constraint:** This method favors the status quo or the last option voted on. To mitigate bias, the order of options must be rotated monthly.

  ### 4. Weighting (Competence vs. Equality)
  *Applies only to Factual questions.*

  *   **The Decision:** **Equal Weight with Negative Recusal.**
  *   **Justification:** Estimating positive competence ($p > 0.5$) in real-time creates social friction and overfitting. However, identifying negative competence ($p < 0.5$) is possible with 3 years of data.
  *   **The Step:**
      1.  **Baseline:** Every member gets 1 vote.
      2.  **The Recusal Rule:** The Chair maintains a private log of member accuracy on *Factual* predictions (verified after 12 months).
      3.  **Intervention:** If a member has been verifiably wrong on >60% of similar factual questions over the last 3 years, the Chair privately asks them to **recuse** from voting on that specific question type.
      4.  **No Positive Weighting:** Do not give extra votes to "experts." It encourages grandstanding. Rely on the Independence Check to amplify diverse expertise.

  ---

  ## Part 2: Stress Testing the Procedure

  Here is how the EVP runs on three typical committee scenarios.

  ### Case 1: The Factual Call (Heavy Overlap)
  **Question:** "Will the 'Literacy First' program achieve 80% retention rates?" (Factual/Forecast)
  **Situation:** All 9 members read the same external evaluation report. 8 members vote Yes. 1 member votes No (citing personal experience).
  **EVP Run:**
  1.  **Type:** Factual. (Proceed).
  2.  **Independence:** 8 slips cite "External Report." 1 slip cites "Personal Experience."
      *   Cluster 1 (Report): 8 members $\rightarrow$ Diluted to **2 votes**. (Both Yes).
      *   Cluster 2 (Experience): 1 member $\rightarrow$ **1 vote**. (No).
      *   $N_{eff} = 3$ votes.
  3.  **Threshold:** Majority of 3 is 2.
  4.  **Result:** The Yes vote passes (2 vs 1).
  5.  **The Catch:** The protocol flags $N_{eff} < 5$ as **"Insufficient Epistemic Independence."**
  6.  **Outcome:** The vote is **invalidated**. The committee cannot claim truth-tracking authority. The Chair must decide whether to fund based on risk tolerance, not predicted success.
  **Why you won't like it:** You have an 8-1 consensus. The procedure tells you that consensus is an illusion and strips the committee of the authority to claim they "know" the outcome. It forces you to admit you are guessing.

  ### Case 2: The Allocation (Three Options)
  **Question:** "We have $100k. Fund Program A, Program B, or Program C?" (Single winner)
  **Situation:**
  *   3 members prefer A > B > C
  *   3 members prefer B > C > A
  *   3 members prefer C > A > B
  (This is a perfect Condorcet Cycle).
  **EVP Run:**
  1.  **Type:** Evaluative/Allocation. (Technically Evaluative, but often treated as Factual regarding "best impact"). Let's assume you classify this as Factual ("Which produces most good?").
  2.  **Method:** Sequential Pairwise. Order drawn: A vs B, then Winner vs C.
  3.  **Vote 1 (A vs B):** A wins (6 votes: A>B>C and C>A>B).
  4.  **Vote 2 (A vs C):** C wins (6 votes: B>C>A and C>A>B).
  5.  **Outcome:** Program C is funded.
  6.  **The Catch:** If the random order had been B vs C, then Winner vs A, Program A would have won. The outcome depends entirely on the random draw of the voting order.
  **Why you won't like it:** The procedure admits it cannot find the "best" program, only a consistent path through a cycle. It reveals that the "will of the committee" is mathematically incoherent here.

  ### Case 3: The Evaluative Question
  **Question:** "Is this grant opportunity aligned with our new strategic pivot toward 'Systemic Change'?"
  **Situation:** 8 members vote Yes. 1 member (the Chair) votes No.
  **EVP Run:**
  1.  **Type Test:** Can we verify "Systemic Change alignment" in 36 months with data not in the room? **No.** It is a definition/value judgment.
  2.  **Protocol:** CJT logic void. Majority has standing, not authority.
  3.  **Outcome:** The vote is advisory. The **Chair** decides.
  4.  **Decision:** Chair rejects the grant.
  **Why you won't like it:** The committee feels democratically overruled. However, this is the only honest outcome. If there is no truth to track, the majority is just a pressure group. The person accountable for the strategy (Chair) must bear the risk of the definition.

  ---

  ## Part 3: Discretion Dressed as Method

  You asked for candor regarding where this procedure is actually my discretion disguised as rules. Here are the three points of failure:

  1.  **The Type Test (Step 1):**
      *   *The Disguise:* The rule claims to objectively separate "Factual" from "Evaluative."
      *   *The Reality:* This is a philosophical judgment call. Almost every grant question is a mix. "Will this work?" (Factual) depends on "Is this worth doing?" (Evaluative). By forcing a binary classification, I am arbitrarily deciding which errors are tolerable. If I classify a question as Evaluative to avoid a difficult vote, the procedure protects me, not the truth.

  2.  **The Dilution Rule (Step 2):**
      *   *The Disguise:* The rule claims to mathematically adjust for correlation (8 people = 2 votes).
      *   *The Reality:* The coefficients (4-6 members = 3 votes) are arbitrary. I picked them to feel right, not because they derive from a statistical model of your specific information cascade. It is a heuristic to scare the committee into diversifying sources, not a true calculation of $N_{eff}$.

  3.  **The Recusal Threshold (Step 4):**
      *   *The Disguise:* The rule claims to filter out incompetence ($<40\%$ accuracy).
      *   *The Reality:* With only 3 years of minutes, the sample size for any specific *type* of factual question is tiny. A member might be 0/3 on "retention rates" but brilliant on "budget feasibility." Tagging them as "incompetent" based on 3 data points is statistically noisy. I am using this rule to gently sideline members who are consistently disruptive, under the cover of "accuracy."

  ### Implementation Checklist for the Chair

  1.  **Pre-Meeting:** Update the "Accuracy Log" (Who was right/wrong on past factual predictions?).
  2.  **Start of Vote:** Announce: "Is this Factual (verifiable later) or Evaluative (value judgment)?"
  3.  **If Evaluative:** Take a straw poll for sentiment, but announce "Chair decides."
  4.  **If Factual:** Distribute voting slips. Require "Primary Source" written on slip.
  5.  **Collection:** Group slips by Source. Apply Dilution Rule.
  6.  **Check:** Is $N_{eff} \ge 5$?
      *   **No:** Announce "Insufficient Independence." Chair decides.
      *   **Yes:** Count weighted votes. Apply Recusal Log (if any).
  7.  **Multi-Option:** Randomize order. Run pairwise.
  8.  **Record:** Log the vote, the $N_{eff}$, and the classification for future accuracy tracking.
