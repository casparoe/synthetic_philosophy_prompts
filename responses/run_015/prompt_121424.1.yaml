answer: |-
  You are quite right to feel that 'logical omniscience' is a label plastered over a cluster of distinct worries. Your intuition that these complaints carve the problem up differently is correct, and recognising this distinction is half the battle in understanding why the literature feels so fragmented. Let us take your three complaints in turn, look at where they bite, and then address your proposal about step-counts.

  **The Three Complaints**

  Your first complaint is that the agent knows all valid formulas (the Rule of Necessitation). You ask why anyone treats this as interesting. The issue is not that knowing an instance of excluded middle is a great cognitive achievement; rather, it is that the standard semantics makes this knowledge *automatic* and *sourceless*. In possible worlds semantics, valid formulas hold at every world. Since knowledge is defined as truth at all accessible worlds, valid formulas are known at every world by definition. This implies that the agent's grasp of logic is not something they *do*, but something they *are*. It removes the epistemic labour entirely. If you fix this using impossible worlds (worlds where $p \land \neg p$ might hold, or $p \lor \neg p$ might fail), you are essentially saying that the agent's perspective does not cover the whole of logical space. This fix addresses complaint (1) directly by breaking the link between validity and truth-at-all-accessible-worlds.

  Your second complaint is closure under entailment (the K-axiom). This is the heavy hitter. It says if you know $p$, and $p$ entails $q$, you know $q$. This bites because it conflates *information* with *inference*. In the standard semantics, the set of worlds compatible with what you know is simply a subset of the total space. If that subset sits entirely inside the $q$-region, you count as knowing $q$, regardless of whether you have performed the deduction to realise it. This is where the 'set of worlds' representation shows its strain. Sets are static; deduction is dynamic. Impossible worlds help here too, by allowing worlds accessible to the agent where $p$ is true, $p \to q$ is true, but $q$ is false (a logically impossible situation, but epistemically possible for the agent).

  Your third complaint is the substitution of logical equivalents. This is often grouped with (2), but you are right to separate it. It is a problem of *hyperintensionality*. Standard possible worlds are 'coarse-grained': they distinguish content only by truth conditions across possible worlds. Since logically equivalent sentences have the same truth conditions across all possible worlds, they denote the same proposition. If knowledge is a relation to a proposition, you cannot know one without the other. This is purely an artefact of the representation. If you move to a syntactic approach (where agents believe sentences, not propositions) or use impossible worlds to separate the intensions of equivalents, you solve (3) without necessarily touching (2).

  So, your suspicion is confirmed: these are distinct pressures. Impossible worlds are primarily a fix for (1) and (3) (and helps with 2 by allowing non-normal worlds). Awareness structures (where an agent must be 'aware' of a proposition to know it) are primarily a fix for (2), as they block the closure condition by fiat.

  **Your Step-Count Proposal**

  Your idea of modelling an epistemic state as a set plus a 'next-step' relation, indexing knowledge by a step count $n$, is not a reinvention, but it is a very sensible one. In the literature, this aligns closely with what are sometimes called 'step-logics' or 'active logic', and it shares DNA with syntactic approaches where belief is a set of sentences closed under specific inference rules rather than logical consequence.

  Does it buy anything? Yes. It shifts the model from a *state* ontology to a *process* ontology. The standard possible worlds model is purely static; it captures the state of affairs if the agent were to think forever. Your model captures the agent *in time*. This dissolves the omniscience problem because closure is no longer a property of the state, but a limit of the process. At $n=0$, the agent knows only their premises. At $n=1$, they know the premises plus one-step consequences. Omniscience is pushed to the limit as $n \to \infty$, which the agent never reaches.

  However, your worry is also correct: this relocates the problem rather than vanishing it. You still must specify which inference rules constitute a 'step'. Is modus ponens one step? Is a complex proof one step? This looks arbitrary. But here is the defence: specifying rules is psychologically more plausible than specifying a closure condition. We have independent evidence about what inference rules humans (or computers) can execute in a single cognitive cycle. Specifying a consequence relation is a mathematical idealisation; specifying a rule set is a mechanistic hypothesis. So, while you haven't 'solved' the arbitrariness, you have moved it from the realm of logic to the realm of cognitive science, which is where it belongs.

  **Known Implication and Iteration**

  You ask whether requiring closure only under *known* implication ($Kp \land K(p \to q) \to Kq$) survives without smuggling omniscience back in. This is the principle of explicit closure. It avoids the problem of valid formulas (you don't know $p \to q$ just because it's valid; you must know it).

  However, iteration is indeed the trap. If the agent knows $p$, and knows $p \to q$, they come to know $q$. Now they know $q$. If they also know $q \to r$, they come to know $r$. If there is no limit on the number of times they can apply this rule, and if the set of known implications is rich enough, they will eventually derive every consequence. To block this, you need a resource bound on the *iterations*, not just the rules. This links back to your step-count idea: you can know the implication, but you might not have the 'step budget' to apply it right now. So, closure under known implication is safe only if the agent's capacity to perform the inference is bounded.

  **CS and Bounded Rationality**

  Finally, why does this matter for computer science and bounded rationality? It is not merely that a model-checker will choke on an infinite set (though that is a practical concern). The philosophical payoff is in the normativity of logic.

  In multi-agent systems, we verify protocols by checking if an agent knows a key, or knows that another agent knows a message was received. If we model agents as logically omniscient, we might verify a protocol as secure when it is not, because we assume the agent can decrypt any message they theoretically have the data for, ignoring computational limits. Conversely, we might deem a protocol unsafe because an omniscient agent *could* derive a contradiction, whereas a bounded agent never would.

  For bounded rationality, the payoff is distinguishing *competence* from *performance*. Standard epistemic logic models competence (what you would know if you were perfect). Your step-count model models performance (what you actually know given your limits). The philosophical lesson is that knowledge might not be a binary relation between an agent and a proposition, but a resource-sensitive state. If logic is a norm for thought, it must be a norm that creatures like us can actually follow. A norm that requires infinite steps is no norm at all.

  **Summary**

  To wrap this up: you are correct that 'logical omniscience' is a bundle of three distinct issues regarding validity, entailment, and equivalence. The standard possible worlds semantics conflates them because it models content as sets of worlds, which are too coarse to distinguish logical equivalents and too static to model inference.

  Your step-count proposal is a recognised move towards dynamic or syntactic modelling. It buys you a way to represent the *cost* of inference, which is the heart of the bounded rationality objection. It does not remove the need to specify rules, but it makes that specification empirical rather than mathematical.

  The problem is partly an artefact of representing content with sets of worlds (which forces equivalence and validity issues), and partly a genuine discovery about the idealisation involved in calling something 'knowledge'. By moving to a step-based or awareness-based model, you are not fixing the logic of knowledge so much as changing the subject to the logic of *belief revision* or *computation*. That is not a failure; it is an admission that standard epistemic logic describes an ideal limit, not the phenomenon itself.
