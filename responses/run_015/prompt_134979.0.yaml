  2. Gap in existing work
  Existing frameworks fail to address the structural specificity required for distributed loop-identity. Standard psychological-continuity theories, descending from Locke and refined by Parfit, prioritize memory and character traits over the structural topology of consciousness. These accounts treat identity as a chain of overlapping mental states, which could theoretically span brains, but they do not specify the mechanistic integration required to sustain a single subject of experience. Similarly, narrative-identity accounts focus on the content of self-conception rather than the causal architecture generating it. While Hofstadter's own remarks suggest substrate independence, he treats the strange loop primarily as a metaphor for self-reference within a single brain or as an argument for functionalism where copies count as continuations. Neither approach settles whether a loop can be split across substrates while maintaining unity. Current functionalist debates often collapse into fission problems without analyzing the causal grain of the loop itself. Consequently, there is no rigorous account of whether real-time informational linking can preserve the singular identity of a strange loop, leaving a gap between metaphorical interpretations and hard functionalist claims. The project fills this by treating the loop as a literal causal structure rather than a narrative device.

  3. Method and timeline
  The methodology is purely conceptual, employing structural analysis and thought experimentation. The first phase involves defining loop-identity conditions independent of biological substrate, focusing on recursive causality and feedback density. I will utilize necessary and sufficient condition analysis to isolate the structural features that constitute loop-unity. The second phase constructs thought experiments involving split and merged cognition across linked brains, varying parameters like signal latency and integration depth to test identity persistence. These scenarios will be compared against existing persistence criteria to identify divergences.

