  # Handout: The Convention Tree
  **How to decide which local habits you are obliged to follow.**

  This tree helps you find your own position on local rules. Start at the top. Read the case study. Choose the answer that matches your gut feeling. Follow the branch down until you reach a leaf. That leaf describes your moral position and points out its most difficult implication.

  **Key Terms:**
  *   **Moral Obligation:** A duty you owe to others, where breaking it makes you a worse person, not just a less popular one.
  *   **Prudence:** Doing something because it is smart or safe, not because it is right.
  *   **Convention:** A habit or rule that exists only because everyone agrees to follow it (like which side of the sidewalk to walk on).

  ---

  ## THE TREE

  **1. ROOT: The Empty Street**
  *Case:* You are crossing against a red light on a completely empty street where everyone crosses.
  *   **A. It is wrong (even if safe).** → *Go to Branch 2.*
  *   **B. It is fine (no cars, no harm).** → *Go to Branch 7.*

  **2. BRANCH: The Loose Queue**
  *Case:* Edging into a loose, crowd-like queue at a market stall where queueing is barely observed.
  *   **A. You must still form a proper line.** → *Go to Branch 3.*
  *   **B. You should follow the local crowd.** → *Go to Branch 5.*

  **3. BRANCH: The Saved Spot**
  *Case:* Holding a place in line for four friends who turn up later.
  *   **A. It is wrong (blocks others).** → **Leaf 1: The Universalist**
      *   *Awkward Commitment:* You must enforce fair queuing even when locals do not care about it.
  *   **B. It is okay (friends matter).** → **Leaf 2: The Fairness-Only Conventionalist**
      *   *Awkward Commitment:* You will queue perfectly yourself but allow your friends to cut in front of strangers.

  **4. BRANCH: The Shoes (Time Test)**
  *Case:* Keeping your shoes on in a home where everyone else has taken theirs off (Day 1 vs. Year 2).
  *   **A. It is equally wrong on Day 1 and Year 2.** → **Leaf 3: The Integrationist**
      *   *Awkward Commitment:* An accidental mistake on your first afternoon is a moral failing, not just a blunder.
  *   **B. It is worse in Year 2 than Day 1.** → **Leaf 4: The Grace-Periodist**
      *   *Awkward Commitment:* You have an incentive to pretend you haven't learned the rules yet to keep your "excuse."

  **5. BRANCH: The Watching Child**
  *Case:* Crossing against the light while a child who is still learning the local rules is watching.
  *   **A. It is much worse than doing it alone.** → **Leaf 5: The Role Model**
      *   *Awkward Commitment:* You are morally responsible for the behavior of local children who choose to copy you.
  *   **B. It is no worse than doing it alone.** → **Leaf 6: The Reciprocalist**
      *   *Awkward Commitment:* If half the locals break the rule, you are permitted to be the one who ruins it for the rest.

  **6. BRANCH: The Haggling Market**
  *Case:* Refusing to haggle where haggling is how prices are set.
  *   **A. It is wrong (you break the market).** → *Go to Branch 6.*
  *   **B. It is okay (my money, my choice).** → **Leaf 9: The Contractualist**
      *   *Awkward Commitment:* You may ignore social expectations so long as you pay the explicit price asked.

  **7. BRANCH: The Wage Gap**
  *Case:* Stipulate servers are paid below minimum wage expecting tips. You pay the cheaper takeaway price for a coffee and then go and sit in the more expensive table-service area.
  *   **A. It is wrong (you exploit the system).** → **Leaf 7: The System-Avoider**
      *   *Awkward Commitment:* You might refuse to tip in a bad wage system, hurting the server to protest the employer.
  *   **B. It is okay (price was posted).** → **Leaf 8: The Market Participant**
      *   *Awkward Commitment:* You accept the local economic rules even when they seem unfair to workers.

  **8. BRANCH: The Bad Service**
  *Case:* Leaving no tip after genuinely poor service.
  *   **A. It is wrong (server still needs pay).** → **Leaf 10: The Harm-Only Moralist**
      *   *Awkward Commitment:* You must tip for bad service, effectively paying people to do their jobs poorly.
  *   **B. It is fine (tip is for quality).** → *Go to Branch 9.*

  **9. BRANCH: The Split Bill**
  *Case:* Splitting a restaurant bill evenly when one person ordered far more than the others.
  *   **A. It is wrong (unfair cost).** → **Leaf 11: The Prudentialist**
      *   *Awkward Commitment:* You admit you would split evenly if you could get away with it without social trouble.
  *   **B. It is fine (friendship over pennies).** → *Go to Branch 10.*

  **10. BRANCH: The Unwanted Tip**
  *Case:* Leaving a tip in a place where tipping is not the custom.
  *   **A. It is generous (a gift).** → **Leaf 12: The Politeness-Voluntarist**
      *   *Awkward Commitment:* You imply that being polite is never required, only a voluntary gift you can withdraw.
  *   **B. It is rude (shows off wealth).** → **(Empty Position)**
      *   *Why Empty:* Merely unattractive. Almost no one argues that generosity is morally rude, though some call it culturally insensitive.

  ---

  ## NOTES ON EMPTY COMBINATIONS

  In building this tree, some logical combinations of views did not result in a leaf. Here is why:

  1.  **The "Prudent Universalist" (Empty):** This view says "Conventions never bind morally" but also "You must always queue properly."
      *   *Status:* **Incoherent.** If conventions never bind, you cannot have a "must" without a threat of punishment.
  2.  **The "Ignorant Reciprocalist" (Empty):** This view says "I only follow rules locals follow" but also "I don't need to learn the rules to know which ones locals follow."
      *   *Status:* **Incoherent.** You cannot reciprocate a habit you have not identified.
  3.  **The "Generous Rude-Neighbor" (Empty):** This view says "Leaving a tip where forbidden is rude" (Branch 10, Option B).
      *   *Status:* **Merely Unattractive.** While culturally awkward, few argue that *giving money* is a moral wrong in itself.
  4.  **The "Day-1 Absolutist" (Empty):** This view says "You must follow all rules immediately" but "Ignorance is a valid excuse."
      *   *Status:* **Incoherent.** You cannot demand immediate compliance while accepting ignorance as an excuse.

  ---

  ## CLOSING NOTES FOR FACILITATORS

  **1. On Classifying Conventions**
  You suggested sorting conventions by what they are *for* (Coordination, Transfer, Risk). This is a strong start, but the tree reveals a fourth category you may need: **Identity Signals**.
  *   *Coordination:* Queuing, driving sides. (Goal: Efficiency).
  *   *Transfer:* Tipping, haggling. (Goal: Payment distribution).
  *   *Risk/Blame:* Jaywalking, quiet carriages. (Goal: Safety/Comfort).
  *   *Identity Signals:* Shoes in homes, dress codes. (Goal: Belonging/Respect).
  *   *Where your split breaks down:* "Splitting the bill" looks like Transfer, but often functions as Identity (showing you are generous vs. stingy). If you treat it only as Transfer, you miss the social harm of being "the cheap friend."

  **2. On Prudence vs. Weak Morality**
  You asked to flag positions the tree cannot separate. **Leaf 11 (The Prudentialist)** and a position we might call **The Weak Moralist** will look identical here.
  *   *The Prudentialist:* "I follow the rule to avoid trouble."
  *   *The Weak Moralist:* "I follow the rule because it's slightly right, but I can ignore it if it's inconvenient."
  *   *The Problem:* In every concrete case (tipping, queuing), they make the same choice.
  *   *The Case to Pry Them Apart:* **"Leaving a tip in a place where tipping is not the custom."**
      *   The *Prudentialist* will say: "Don't do it. It wastes money and causes confusion."
      *   The *Weak Moralist* might say: "It is slightly good to be generous, even if not required."
      *   *Instruction:* If a participant lands on Leaf 11 but says they *would* tip in a non-tipping country just to be nice, they are actually a Weak Moralist, not a Prudentialist.

  **3. On Who Is Owed What**
  You asked whether a requirement is owed to individuals, the community, or nobody. This tree does not settle it, but it hints at the answer:
  *   **Leaves 1, 2, 7, 10 (Harm/Transfer):** The duty is owed to **Individuals** (the server, the person behind you in line).
  *   **Leaves 3, 5, 6 (Identity/Order):** The duty is owed to the **Community** (maintaining the practice).
  *   **Leaves 8, 11, 12 (Prudence/Contract):** The duty is owed to **Nobody** (it is purely self-regarding).
  *   *Facilitator Tip:* When arguments break out, ask the room: "Are you angry because *you* were harmed, or because the *system* was disrespected?" This usually identifies which leaf they are standing on.
