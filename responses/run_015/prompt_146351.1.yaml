  2.  **Diagnose the Conceptual Mistake:**
      *   The user is conflating *ontological inevitability* (or historical inevitability) with *normative agency*.
      *   The argument moves from "X was going to happen anyway" to "No one is responsible for X happening (or not happening)."
      *   This is a version of the "determinism undermines responsibility" argument, but applied to epistemic contexts.
      *   Specifically, it commits a category mistake between the *context of discovery* (psychological/historical processes) and the *context of justification* (normative evaluation of claims).
      *   It also conflates *causal inevitability* with *epistemic rationality*. Even if the *result* was inevitable, the *pathway* taken by specific agents involves choices, reasoning, and evidential weighting that are subject to normative assessment.
      *   The fallacy is roughly a form of *fatalistic nihilism regarding epistemic agency* or a confusion between *historical explanation* and *normative evaluation*. Let's call it the "Inevitability Normativity Fallacy" or conflating historical determinism with epistemic agency. A more precise philosophical label might be confusing *explanatory sufficiency* with *normative exemption*.

  3.  **Philosophical Correction:**
      *   Ontological ripeness (the idea that the mathematical structure or natural phenomenon exists independently) does not erase the human labour of articulation.
      *   Attribution isn't about owning a platonic form; it's about recognising the specific intellectual labour, risk, and insight required to articulate it *at that time*.
      *   Regarding error: Even if the empirical landscape constrained Darwin, his specific theoretical choices (pangenesis vs. withholding judgment vs. other speculative models) were not strictly determined. He exercised epistemic agency.
      *   Norms apply to the *reasoning process*, not just the outcome.

  4.  **Credit Despite Convergence:**
      *   Priority disputes aren't about who "owns" the truth (which might be discovered independently), but who contributed the specific conceptual machinery, notation, or argumentative structure that allowed the community to access it.
      *   Credit is a social currency regulating scientific labour, not a metaphysical property of truth.
      *   Simultaneous discovery highlights the *intersubjective* validity of the finding, not the irrelevance of the discoverers.

  5.  **Blame Despite Constraint:**
      *   Darwin's blending inheritance was not the *only* possible inference. It was a *dominant* assumption, but critical scrutiny was possible.
      *   Epistemic blame/criticism isn't about punishing unavoidable errors; it's about identifying where reasoning fell short of available standards or where dogmatism prevented alternative hypotheses.
      *   Even in constrained environments, scientists vary in their openness to anomaly. Criticism helps refine future heuristics.

  6.  **Key Distinction:**
      *   Metaphysical inevitability (the state of the world/math) vs. Normative accountability (the conduct of the knower).
      *   Explanation (why it happened) vs. Justification (why it was rational/irrational).

