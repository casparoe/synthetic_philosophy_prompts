      *   *Avoid:* "As Confucius said..." (Cliché). "Ren and Li..." (Jargon). "Deontological vs. Consequentialist..." (Too academic).
      *   *Adopt:* Dignified, urgent, clear. Use metaphors (architecture, weaving, music).
      *   *Check:* Am I alienating the policymakers? Keep the "self-dissolution" concept grounded in human experience (loss of identity). Am I boring the scholars? Ensure the distinction is precise and the acknowledgment of contested terrain is accurate.

