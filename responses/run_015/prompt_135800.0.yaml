      *   **Scholarly Nuance:** Distinguish settled consensus (centrality of relationality, five relationships) from contested debates (internal criticism, particularism, egalitarianism). Do not present contested views as consensus.
      *   **Format:** Speech text (no citations, bibliographies, etc.).

  2.  **Determine Structure and Timing:**
      *   A 10-minute speech is roughly 1,000 to 1,300 words spoken at a moderate pace.
      *   *Opening (2 mins):* Welcome, acknowledge the dual audience, state the purpose of the institute.
      *   *The Philosophical Core (3 mins):* Introduce Role Ethics without jargon. Explain the "Why" (obligations from roles).
      *   *The Key Distinction (3 mins):* Role-fulfillment vs. Role-constitution. This is the heavy lifting. Connect it to "self-dissolution."
      *   *The Empowerment Constraint (2 mins):* Autonomy-within-roles. Address the policymakers' concern about individual agency.
      *   *Nuance & Contestation (1 min):* Acknowledge open questions (criticism, equality) without resolving them definitively, satisfying the scholars.
      *   *Closing (1 min):* Call to action, vision for the future.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the physical space. Welcome the scholars and the practitioners. Acknowledge the tension: theory vs. practice. State the mission: durable structures of care.
      *   *The Core Claim:* Why Confucianism? Because Western models often rely on rights/contracts. We need something deeper. Introduce the idea that we are defined by who we are *to each other*.
      *   *The Distinction (Crucial):* I need to explain *Role-fulfillment* vs. *Role-constitution* clearly.
          *   *Fulfillment:* Doing the job (feeding the child, caring for the elder).
          *   *Constitution:* Becoming the person. If I stop being a son, do I lose a part of myself? Yes.
          *   *Implication:* Neglect isn't just a rule break; it's a loss of self. This raises the stakes for the institute.
      *   *Empowerment:* Policymakers love "empowerment." But if empowerment means "freedom from roles," it kills the institute's purpose. I must argue for "freedom to excel in roles." Use the metaphor of a musician or craftsperson.
      *   *Scholarly Nuance:* I need to signal to the scholars that I know the debates.
