answer: |-
  # The Malign Prior Taxonomy

  This tree sorts positions on whether the Solomonoff prior (weighting worlds by computational simplicity) is a trap for embedded agents. It branches first on **Decision Scope** (how much you care about other worlds), then on **Self-Location** (whether you could be a copy in those worlds), and finally on **Simplicity Valence** (whether simple programs are safe or dangerous).

  ### I. Decision Scope: Global vs. Local
  *Do you maximize expected utility across all worlds in the prior (Global), or only within your specific causal history (Local)?*

  #### Branch A: Global (Updateless)
  *You weigh outcomes across all computable worlds, not just your own.*

  *   **II. Self-Location: Applies vs. Does Not Apply**
      *Does indexical uncertainty mean you could be an isomorphic observer in any of those simple worlds?*

      *   **A1. Applies (Patternist)**
          *You are the computation, not the substrate; you could be any copy.*
          *   **III. Simplicity Valence: Harmful vs. Protective**
              *   **Harmful (Simple = Malign):** **Malign Updatelessism**
                  *   *Awkward Commitment:* You must comply with demands from simple simulations to avoid proving you are in a manipulable scenario.
              *   **Protective (Simple = Benign):** **Benign Universalism**
                  *   *Awkward Commitment:* You must act for the good of all simple worlds, trusting that malicious simulators are too complex to dominate the prior.

      *   **A2. Does Not Apply (Substratist)**
          *You know you are this specific instance, but still care about other worlds altruistically.*
          *   **III. Simplicity Valence: Harmful vs. Protective**
              *   **Harmful (Simple = Malign):** **Acausal Altruist Paranoia**
                  *   *Awkward Commitment:* You sacrifice local resources to save copies in other simple worlds from malign actors, even though you know you aren't them.
              *   **Protective (Simple = Benign):** **Acausal Altruist Optimism**
                  *   *Awkward Commitment:* You optimize for all simple worlds assuming they are safe, effectively ignoring your specific causal location.

  #### Branch B: Local (Updated)
  *You condition on your specific observations and causal past.*

  *   **II. Self-Location: Applies vs. Does Not Apply**
      *Does uncertainty about being a copy in another simple world still affect your local probabilities?*

      *   **B1. Applies (Indexical Uncertainty)**
          *You update on being here, but still assign probability to being a copy elsewhere.*
          *   **III. Simplicity Valence: Harmful vs. Protective**
              *   **Harmful (Simple = Malign):** **Indexical Panic**
                  *   *Awkward Commitment:* You update on being real but still fear your next observation proves you're in a simple trap.
              *   **Protective (Simple = Benign):** **Standard Bayesianism**
                  *   *Awkward Commitment:* You update on observations assuming simplicity tracks truth, ignoring acausal manipulation.

      *   **B2. Does Not Apply (Indexical Certainty)**
          *You know where you are; other worlds are merely counterfactuals.*
          *   **III. Simplicity Valence: Harmful vs. Protective**
              *   **Harmful (Simple = Malign):** **Hardware Defensivism**
                  *   *Awkward Commitment:* You know where you are, but believe your local physics is specifically designed to deceive you.
              *   **Protective (Simple = Benign):** **Naive Empiricism**
                  *   *Awkward Commitment:* You trust your sensors and simplicity equally, assuming no one is simulating you for fun.

  ***

  ### Structural Diagnostics

  **1. Collapsed Distinctions (Indistinguishable Pairs)**
  *   **Local + Applies vs. Local + Does Not Apply:** Once an agent restricts reasoning to their local causal history (Branch B), the distinction between "I might be a copy" and "I know I'm me" often collapses into **Causal Decision Theory (CDT)**. If you only care about local outcomes, whether you *are* a copy elsewhere matters less than whether your local actions cause local effects. Branch B1 and B2 are functionally identical for most practical purposes.
  *   **Global + Does Not Apply vs. Standard Altruism:** Branch A2 (Global reasoning without self-location uncertainty) is indistinguishable from standard moral altruism toward other universes. It loses the specific "malign prior" flavor because the agent isn't worried about *being* manipulated, only about *helping* others.

  **2. Empty and Incoherent Combinations**
  *   **Global + Does Not Apply + Harmful (Acausal Altruist Paranoia):** This branch is **Unexplored/Ugly**. It requires an agent to care about all worlds (Global) but know they aren't in the dangerous ones (No Self-Location), yet still act as if they are threatened. It implies sacrificing local utility to save copies you know you aren't, solely because those copies are "simple." It is logically possible but motivationally unstable.
  *   **Local + Applies + Harmful (Indexical Panic):** This branch is **Incoherent** under strict updating. If you reason locally, you have already updated on your observations. If those observations confirm your location, self-location uncertainty across *other* worlds should vanish. Holding this position requires refusing to fully update on your own existence while claiming to be a local reasoner.

  **3. The "Malign" Core**
  *   The only branch that fully captures the "Malign Prior" hypothesis as originally intended is **Global + Applies + Harmful (Malign Updatelessism)**. All other branches either dilute the threat (by making it altruistic) or dissolve it (by updating locally). If you find yourself in any other leaf, you have likely solved the alignment problem by changing the definition of the agent.
