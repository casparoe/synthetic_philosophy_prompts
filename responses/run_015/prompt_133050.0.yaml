answer: |-
  Hey, first off, welcome to the club. Seriously, almost everyone who starts doing good work hits that wall where they wonder if they're just buying off their own conscience. It's a classic philosophical itch, and honestly, the fact that you're worrying about it probably means you're not just doing it for the ego boost.

  Since you've got about three years of philosophy under your belt, you know enough to spot the traps but maybe not enough to be totally cynical about the whole project. That's actually the sweet spot. You're asking about moral worth, overdetermination, and collective action. If I were pointing you toward the questions that are actually worth your time—and the field's time—here's how I'd rank them, from "do this first" to "don't bother yet."

  ### 1. The Mechanics of Motivational Overdetermination (Priority #1)

  This is the big one. You asked whether mixed motives cancel moral worth or just dilute it. This is the upstream question. Until we figure out how motives combine, nothing else makes sense.

  **Why it's top tier:**
  Most traditional Kantian stuff treats motives like light switches: either you're acting from duty, or you're not. If there's any selfishness in there, the moral worth is zero. But that's psychologically unrealistic. If we stick to that, almost no human action has moral worth. On the flip side, if we say "anything goes as long as the outcome is good," we lose the whole idea of integrity.

  **Tractability:**
  This is highly tractable for someone without a huge grant. It's conceptual work. You don't need a lab; you need thought experiments. The work here is figuring out if motives are additive (good motive + bad motive = net moral value), threshold-based (you need 51% duty to count), or if there's a "pollution" effect (one bad motive ruins the batch).

  **Impact:**
  If you solve this, it changes everything downstream. If we decide that mixed motives *preserve* moral worth (just maybe at a lower intensity), then suddenly most of our everyday ethics gets rehabilitated. If we decide they cancel it out, we have to accept that moral saints are basically impossible. This directly answers your shelter guilt: you don't need pure motives to do good work, but we need a theory that explains *why* that's okay without lowering the bar too much.

  ### 2. Collective Moral Worth and Distributed Motives (Priority #2)

  Once you have a handle on the individual, you have to scale it. You mentioned group settings. This is where the field is stuck right now.

  **Why it's second:**
  Shelters, NGOs, corporations—these are collective agents. Usually, in a group, *no one* has purely good motives. Person A is there for guilt, Person B is there for resume padding, Person C is there because they believe in the cause. The group succeeds, people get fed. Does the *group* have moral worth?

  **Tractability:**
  This is harder than #1 but still doable without empirical grants. It involves analyzing how individual intentions aggregate. Is the group's motive the sum of the parts? The average? Or does the group have a motive distinct from its members (like a corporate mission statement)?

  **Impact:**
  This is huge for modern ethics. If we can't assign moral worth to collective action, then most effective altruism and systemic change gets written off as morally neutral machine-learning. If we figure out how mixed motives aggregate in a group, we might find that a team of selfish people can constitute a morally worthy agent if the structure channels those motives correctly. That changes how we evaluate institutions, not just people.

  ### 3. Moral Luck and Accidental Outcomes (Priority #3)

  You asked about accidental good outcomes from bad motives. This is the "moral luck" problem.

  **Why it's third:**
  I'm ranking this lower because it's often a distraction if you haven't settled #1. If moral worth is entirely about motives (Kant), then luck doesn't matter—you did the right thing for the wrong reason, so you get no credit, regardless of the outcome. If moral worth is about outcomes (Consequentialism), then luck matters a lot, but motives barely matter at all.

  **Tractability:**
  This is a bit of a dead end unless you're willing to hybridize. Pure moral luck debates tend to spin in circles because people's intuitions are split 50/50. However, if you combine this with #1 (e.g., "does luck mitigate the negativity of a bad motive?"), it becomes interesting.

  **Impact:**
  Answering this changes how we punish or praise people after the fact. But honestly, knowing whether a lucky outcome saves a bad motive doesn't help us design better systems as much as knowing how motives work in the first place. It's more about retrospective judgment than prospective action.

  ### The "Dead End" to Avoid

  **Empirical Psychology of Motives:**
  Don't spend too much time trying to prove *whether* people actually have pure motives. That's a science question, not a philosophy one. Psychology will tell you that yes, everything is mixed with ego. Philosophy's job isn't to measure the mix; it's to decide what that mix *means* for value. Getting bogged down in "can humans actually be selfless?" is a trap. Assume they can't, and build your ethics anyway. That's where the real work is.

  ### The Verdict

  If I were you, I'd hammer on **Priority #1**. It's the foundation. If you can articulate a solid theory of how a selfish motive interacts with a dutiful one without destroying the whole action, you've got the key to unlock Priority #2.

  Here's why this ordering matters: If you start with Collective Action (#2) without defining individual moral worth (#1), you're building on sand. You can't say what a group is worth if you don't know what a person is worth. And if you start with Moral Luck (#3), you're worrying about the scoreboard before you've defined the rules of the game.

  So, regarding your shelter work: The field hasn't settled this, which is why you feel stuck. But the most promising path is to argue that moral worth isn't binary. It's probably more like a dimmer switch. Your guilt might be a selfish motive, but if it's driving you to feed people, it's part of the causal chain that leads to good. The question isn't "is my motive pure?" It's "does this mix of motives sustain the good action over time?"

  Focus on the overdetermination problem. It's the most upstream, it's tractable with just a brain and a notebook, and if you crack it, the rest of the stuff about groups and luck falls into place much easier.
