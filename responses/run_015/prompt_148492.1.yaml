  - one on ontological pluralism vs physics: modern science seems to assume one consistent mathematical description of nature. are they saying physics is wrong, just incomplete, or talking about a different kind of "truth"?

  for each, anticipate the standard reply and have a follow-up ready. dont ask for a bibliography or citations — the model wont have web access. keep it casual, im typing this on my phone after that argument so spelling might be off.
