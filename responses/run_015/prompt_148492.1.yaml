answer: |-
  here's a set of 10 questions drafted for your phone. i kept them conversational so you can read them off naturally, but they're sharp enough to press the ontological claim. each one has the "expected dodge" and a follow-up to keep the pressure on.

  **1. the omniscience problem (kevala-jnana)**
  **Q:** if every statement is only conditionally true because reality has irreducible plural sides, what does it even mean for a liberated soul to have *kevala-jnana* (omniscience)? doesn't omniscience imply a single, complete grasp of truth?
  **Expected Reply:** omniscience isn't one single statement; it's grasping all seven modes of predication simultaneously without conflict.
  **Follow-up:** but if a mind can hold all seven modes at once without contradiction, isn't that basically a "god's eye view" that collapses the plurality back into one unified perspective? how is that different from the absolutism you're criticizing?

  **2. modern disputes (climate/quantum)**
  **Q:** can you actually apply *saptabhangi* (seven-fold predication) to something urgent like climate science without it sounding like you're validating denialism? like, is the claim "climate change is real" only partially true?
  **Expected Reply:** it's about context-dependent predication, not denying facts. in some contexts, the data is certain; in others, models are probabilistic.
  **Follow-up:** okay, but if the opposing view is granted some level of "partial truth" under your system, how do you justify aggressive policy action over the denialist view? doesn't this dilute the urgency required for existential threats?

  **3. interfaith & conversion**
  **Q:** if christianity and jainism are both "partially true" in incommensurable ways, is there any real basis for saying one religious practice is wrong? does conversion become impossible or meaningless?
  **Expected Reply:** it's the "all paths up the same mountain" idea. different traditions capture different facets of the real.
  **Follow-up:** but if all paths work, why practice Jain asceticism specifically? isn't exclusivity necessary for commitment? if nothing is fully wrong, does religious discipline lose its stakes?

  **4. the relativism trap (meta-standpoint)**
  **Q:** my friend argued this is just relativism with extra steps. how do you avoid smuggling in a meta-standpoint when you claim "no single view is absolute"? isn't that claim itself absolute?
  **Expected Reply:** anekantavada isn't a metaphysical claim, it's a pragmatic tool or method to reduce dogmatism.
  **Follow-up:** but your book argues for this as *ontology*—that reality itself is plural. how can an ontological claim about the nature of reality escape being an absolute truth claim itself?

  **5. the "inexpressible" escape clause (avaktavya)**
  **Q:** critics say *avaktavya* (the inexpressible mode) becomes a catch-all escape clause whenever someone spots a contradiction in your system. is it just a way to say "you can't prove me wrong"?
  **Expected Reply:** no, inexpressibility is rare and precisely defined—it only applies when opposite predicates must hold simultaneously.
  **Follow-up:** but classical logic is built on non-contradiction. by carving out a space for contradictions to be "inexpressible" rather than false, aren't you asking us to abandon logic whenever it gets inconvenient?

  **6. ontology vs. physics**
  **Q:** modern physics assumes one consistent mathematical description of nature is possible. are you saying physics is wrong, just incomplete, or talking about a different kind of "truth"?
  **Expected Reply:** physics is incomplete; it describes functional relationships, not the ontological depth of substance and mode.
  **Follow-up:** if physics can't capture reality because it seeks consistency, but reality is plural/contradictory, what method *can* capture it? is philosophy superior to science here?

  **7. ethics and ahimsa**
  **Q:** if reality is ontologically plural, is ethics plural too? can we condemn violence absolutely, or is violence "partially real" depending on the standpoint?
  **Expected Reply:** *ahimsa* (non-violence) is the supreme duty and stands above epistemic pluralism.
  **Follow-up:** how do you reconcile an absolute ethic with an ontological pluralism? if reality allows multiple truths, why doesn't ethics allow multiple valid responses to violence?

  **8. the performative contradiction**
  **Q:** you wrote a book in language to explain why language and single-view statements fail. isn't that a performative contradiction?
  **Expected Reply:** language is like a finger pointing at the moon; it's useful even if it's not the thing itself.
  **Follow-up:** but if language inherently distorts the plural nature of reality, isn't your book distorting the ontology you're defending? how do we trust the message if the medium is flawed?

  **9. the "extra steps" critique**
  **Q:** back to my friend's point: practically, doesn't anekantavada function the same as relativism in a debate? both sides end up saying "well, it depends."
  **Expected Reply:** relativism says all views are equally true; we say views are conditionally true based on evidence and standpoint.
  **Follow-up:** but in a live debate, doesn't that distinction vanish? if i can't prove you absolutely wrong, haven't i effectively lost the ability to argue against you?

  **10. decision paralysis**
  **Q:** if every decision involves ignoring some aspects of reality's plurality, does this philosophy lead to paralysis? how do you act if every choice is partially wrong?
  **Expected Reply:** we act based on the most relevant standpoint for the immediate context (pragmatic certainty).
  **Follow-up:** but who decides which standpoint is "most relevant"? doesn't that decision require a single, authoritative view of the situation, bringing back the absolutism you reject?
