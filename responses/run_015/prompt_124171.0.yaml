prompt: |-
  I am currently taking an upper-level philosophy of science module, and after a seminar on the demarcation problem my study group has been arguing for weeks about whether falsifiability still performs any genuine epistemic work or whether it has been superseded by institutional and pluralistic criteria. To move us past talking past one another, I would like you to draft the joint statement that a committed methodological falsificationist and a committed demarcation pluralist could both sign after a sustained, good-faith adversarial collaboration.

  The falsificationist should defend a refined, non-naive Popperian position: falsifiability is not sufficient by itself, and auxiliary hypotheses may be adjusted, but only if such adjustments increase the overall empirical risk and predictive boldness of the core research programme rather than shielding it from refutation. The pluralist should reject any single necessary-and-sufficient criterion, arguing that scientific status is better understood through a cluster of institutional and epistemic norms—transparent peer criticism, predictive reliability, explanatory coherence, and reproducibility—so that some clearly scientific practices, such as adaptive clinical-trial protocols that revise primary endpoints in response to interim data, are not straightforwardly falsifiable in the classical sense, while certain pseudoscientific doctrines can be formulated to avoid immediate empirical defeat.

  Please structure the document precisely as follows. First, present a numbered section of agreed claims, including the logical asymmetry between verification and falsification, the historical function of Popper’s criterion in distinguishing psychoanalysis and Marxism from empirical inquiry, the shared acknowledgment that immunisation strategies exist, and the mutual view that any demarcation tool should help identify practices worthy of public epistemic trust rather than merely classify sentences. Second, provide a disagreements table that states the exact divergences in wording each camp would accept for its own side—particularly on whether empirical risk can be quantified independently of theoretical context, whether the adaptive refinement seen in clinical trials counts as progressive problem-solving or as illegitimate immunisation, and whether “science” names a natural kind or an institutionally governed family resemblance. Third, identify the cruxes: the specific sub-questions such that resolving them would move at least one party. I take the central cruxes to be whether there exists a non-circular metric for the empirical content of a theoretical programme, and whether institutional norms can perform the demarcation work originally assigned to falsifiability without collapsing into relativism. For each crux, specify one concrete case or argument both sides agree bears upon it—such as the evaluation of a particular adaptive oncology trial that altered its endpoint after interim analysis—and record in advance what each side predicts that case reveals about the crux. Where a disagreement turns out to be purely verbal, for instance about the proper extension of the term “science” itself, state this explicitly and explain why no substantive issue remains. Write the entire response in British English, and place a one-sentence summary on the final line beginning with “Summary:”.
