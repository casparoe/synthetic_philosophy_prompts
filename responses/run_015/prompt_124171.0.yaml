  # Joint Statement on Demarcation and Epistemic Trust

  **Signed:** The Methodological Falsificationist & The Demarcation Pluralist
  **Date:** 24 May 2024
  **Context:** Adversarial Collaboration on the Demarcation Problem

  ### 1. Agreed Claims

  1.  **Logical Asymmetry:** We agree that there exists a fundamental logical asymmetry between verification and falsification; universal empirical claims cannot be conclusively verified by finite observations, but they can be logically contradicted by a single reproducible counter-instance.
  2.  **Historical Function:** We acknowledge that Karl Popper's criterion of falsifiability successfully performed a historical service by distinguishing empirical inquiries, such as Einsteinian physics, from non-empirical systems like psychoanalysis and Marxism, which were often structured to explain any outcome post hoc.
  3.  **Immunisation Strategies:** We concur that immunisation strategies exist wherein theorists adjust auxiliary hypotheses to shield a core theory from refutation, and that distinguishing legitimate theory refinement from illegitimate shielding is a central challenge for philosophy of science.
  4.  **Purpose of Demarcation:** We mutually hold that the primary function of any demarcation tool is not merely to classify sentences as 'scientific' or 'non-scientific' for semantic purity, but to identify practices worthy of public epistemic trust and resource allocation.

  ### 2. Disagreements Table

  | Issue | Methodological Falsificationist Wording | Demarcation Pluralist Wording |
  | :--- | :--- | :--- |
  | **Empirical Risk Quantification** | Empirical risk can be assessed logically by comparing the potential falsifiers of a theory, largely independent of specific theoretical contexts. | Empirical risk is context-dependent and cannot be quantified independently of the surrounding theoretical framework and experimental norms. |
  | **Adaptive Clinical Trials** | Adaptive refinements in clinical trials count as progressive problem-solving only if the adjustment increases the overall predictive boldness of the research programme. | Adaptive refinements in clinical trials count as progressive problem-solving provided they adhere to transparent institutional protocols, even if classical falsifiability is compromised. |
  | **Ontology of Science** | 'Science' names a methodological essence characterised by a specific relationship to empirical evidence (a natural kind of inquiry). | 'Science' names an institutionally governed family resemblance cluster without a single necessary-and-sufficient defining condition. |

  ### 3. Cruxes and Predictive Cases

  **Crux 1: Is there a non-circular metric for the empirical content of a theoretical programme?**
  *   **Concrete Case:** The evaluation of a specific adaptive oncology trial that altered its primary endpoint after interim analysis showed unlikely success on the original metric.
  *   **Falsificationist Prediction:** This case reveals that without a prior commitment to fixed falsifiers, the adjustment risks being an ad hoc immunisation strategy unless the new endpoint imposes *greater* empirical risk than the original.
  *   **Pluralist Prediction:** This case reveals that institutional safeguards (e.g., data monitoring committees) suffice to validate the adjustment as rational learning, demonstrating that empirical content is managed socially rather than logically.

  **Crux 2: Can institutional norms perform demarcation work without collapsing into relativism?**
  *   **Concrete Case:** The historical reception of Ignaz Semmelweis's handwashing protocols by the Vienna Medical Society, where institutional norms initially rejected robust empirical data.
  *   **Falsificationist Prediction:** This case reveals that institutional norms are insufficient for demarcation because established institutions can reject truth; only the logical force of the empirical risk (the falsification of the old model) ultimately secured the scientific status.
  *   **Pluralist Prediction:** This case reveals that institutional norms are self-correcting over time; the eventual acceptance of Semmelweis demonstrates that the cluster of norms (reproducibility, explanatory coherence) works diachronically even if it fails synchronically.

  **Note on Verbal Disagreement:**
  We identify a purely verbal disagreement regarding the proper extension of the term 'science' itself. If the Falsificationist uses 'science' to denote 'activities employing high-risk empirical testing' and the Pluralist uses 'science' to denote 'activities recognised by scientific institutions', no substantive issue remains regarding which practices deserve trust. We agree to utilise the phrase 'epistemically trustworthy inquiry' for substantive debates, reserving 'science' for contextual usage.

  Summary: This statement outlines our shared commitment to epistemic trust while documenting precise divergences on risk quantification and institutional norms to guide future inquiry.
