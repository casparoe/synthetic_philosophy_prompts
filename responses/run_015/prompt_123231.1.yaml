  **Load-Bearing Distinctions and Deliberate Collapses**

  To make this procedure usable within twenty minutes, I am treating **intervention** as the load-bearing distinction for causation: if the same fix stops both alarms, they share a mechanism. I am deliberately collapsing the philosophical distinction between *token identity* (this specific instance) and *type identity* (this class of fault); for your ticketing system, if the fix generalizes, the mechanism is "the same." I am also collapsing "root cause" and "mechanism" into the smallest replaceable unit that resolves the alarm. Finally, I am treating "trigger" as any variable condition that pushes the mechanism over the threshold, distinguishing it from the mechanism itself (the fragility). Sameness *must* be relativized to a level; a sensor fault and a model fault can produce identical alarms but are different mechanisms for repair purposes. The engineer fixes this level at **Step 0**, typically at the "Subsystem Owner" grain (e.g., Optics, Compute, Line Control), ensuring you don't compare a lens scratch to a code bug.

  ***

  ### The 20-Minute Mechanism Triage Procedure

  **Goal:** Determine if Alarm A and Alarm B share a mechanism to decide ticket consolidation and fix generalization.
  **Constraints:** Do not stop lines or rollback models without authorization.
  **Output:** One of: `same mechanism`; `different mechanisms`; `same mechanism, different trigger`; `underdetermined`.

  **Step 0: Fix the Level of Analysis (2 mins)**
  *   **Action:** Declare the "Repair Boundary" for this comparison. Are you comparing *Sensor* issues, *Preprocessing* issues, *Model* issues, or *Actuator* issues?
  *   **Rule:** If Alarm A is traced to Optics and Alarm B to Model Weights, they are `different mechanisms` regardless of signature.
  *   **Default:** If unknown, default to the subsystem that last changed (e.g., Firmware = Model/Compute; Lens clean = Sensor).

  **Step 1: Signature and Context Filter (5 mins)**
  *   **Action:** Check embedding similarity and change logs.
  *   **Test:** Do the alarms share a visual signature *and* a contextual change (e.g., both followed a firmware update)?
  *   **Warning:** High similarity does not guarantee same mechanism (see Case 2). Low similarity does not guarantee different mechanisms (see Case 3).
  *   **Pass:** If signatures differ wildly and contexts differ, mark `different mechanisms` and stop.
  *   **Fail:** If signatures match or contexts overlap, proceed to Step 2.

  **Step 2: The Intervention Proxy Test (8 mins)**
  *   **Concept:** A mechanism is what an intervention suppresses. Since you cannot always intervene, look for a "Natural Experiment" or "Historical Proxy."
  *   **Action:** Identify the hypothetical fix for Alarm A (e.g., "Clean Lens"). Ask: "Would this fix stop Alarm B?"
  *   **Forbidden Intervention Protocol:** If the fix requires line stoppage or model rollback:
      1.  Look for a *natural variation* (e.g., did the alarm stop when the product changed? Did it stop when the shift ended?).
      2.  Look for *historical precedence* (did this fix work on this alarm type last quarter?).
  *   **Decision:**
      *   If Fix A stops B (or proxy suggests it would): Proceed to Step 3.
      *   If Fix A does not stop B: Label `different mechanisms`.
      *   If you cannot determine if Fix A stops B: Label `underdetermined`.

  **Step 3: Cascade and Conjunction Check (3 mins)**
  *   **Cascade Test:** Is Alarm B the output of Alarm A's mechanism? (e.g., Bad Image -> Low Confidence).
      *   **Rule:** If A causes B, they are `different mechanisms` (distinct components in a chain). Fixing A stops B, but they are not the *same* thing.
  *   **Conjunction Test:** Does the alarm require two conditions (e.g., Heat + Load) where neither alone fires it?
      *   **Rule:** If comparing to a single-condition alarm (e.g., Heat only), label `same mechanism, different trigger` if the underlying fragility is the same (e.g., thermal sensitivity). Label `different mechanisms` if the interaction creates a new failure mode (e.g., thermal expansion *plus* vibration misalignment).

  **Step 4: Drift Check (2 mins)**
  *   **Action:** Compare to the last known fix for this alarm type.
  *   **Test:** Has the system drifted such that the old fix no longer works?
  *   **Rule:** If the old fix works, it is `same mechanism`. If the old fix fails but the signature is identical, it is `underdetermined` (requires senior judgement).

  **Step 5: The Judgement Call (Bottom Out)**
  *   **When:** If Step 2 or 4 yields conflicting evidence (e.g., signatures match, but proxy test is inconclusive).
  *   **Who:** The **Senior Reliability Engineer (SRE)** or **Shift Lead**.
  *   **Action:** They must choose between `underdetermined` (open separate tickets) or `same mechanism, different trigger` (consolidate tickets). Default to `underdetermined` to prevent false generalization.

  ***

  ### Case Analysis

  **Case (1): Plants 4 and 11 (Firmware Update)**
  *   **Level:** Compute/Firmware (Step 0).
  *   **Context:** Both fired within a day of the same firmware update (Step 1).
  *   **Intervention:** The fix is a rollback or patch. While forbidden without a ticket, the *cause* (update) is identical across both plants. The natural experiment is the update event itself.
  *   **Cascade/Conjunction:** No cascade; direct cause.
  *   **Verdict:** The underlying fragility is the code logic; the trigger is the update activation.
  *   **Label:** `same mechanism`

  **Case (2): Plant 7 vs. Plant 2 (Signature Match, Physical Diff)**
  *   **Level:** Sensor/Optics (Step 0).
  *   **Context:** Signatures match, but Plant 2 was a scratched lens. Plant 7 is clean (Step 1).
  *   **Intervention:** Cleaning the lens fixes Plant 2. Would cleaning Plant 7 fix it? No, the lens is already clean. The proxy test fails.
  *   **Verdict:** The signature clustered them, but the intervention separates them. Plant 7 is likely lighting or model drift.
  *   **Label:** `different mechanisms`

  **Case (3): Plant 9 (Conjunction: Shift + Temp)**
  *   **Level:** Environmental/Line Control (Step 0).
  *   **Context:** Fires only on Conjunction (Shift Change + Temp > 30C). Comparison class: Standard "High Temp" alarms seen elsewhere.
  *   **Intervention:** Cooling the line (Standard Temp fix) might not stop it if Shift Load is required to cross the threshold. However, the underlying fragility is likely thermal sensitivity exacerbated by load.
  *   **Cascade/Conjunction:** This is the Conjunction Hard Case. The mechanism is the system's thermal vulnerability. The trigger is the *combination* of heat and operational load. Compared to a standard thermal alarm (Heat only), the trigger configuration is different, but the root fragility (thermal) is likely the same.
  *   **Verdict:** Consolidate under Thermal Stability, but note the complex trigger.
  *   **Label:** `same mechanism, different trigger`

  \answer{(1) same mechanism; (2) different mechanisms; (3) same mechanism, different trigger}
