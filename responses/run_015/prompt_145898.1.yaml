  ### Pre-Interview Brainstorming: Pressure Points

  Before drafting the questions, I need to isolate the structural weaknesses in Dr Voss's appropriation of Hofstadter. Hofstadter's model in *Gödel, Escher, Bach* and *Fluid Concepts and Creative Analogies* describes how concepts slip and slide to produce novelty, largely governed by aesthetic criteria like elegance or surprise. Translating this to meta-ethics invites three specific vulnerabilities:

  1.  **The Normativity Gap:** If moral change is just parameter adjustment, what distinguishes *progress* from *drift*? Hofstadter's knobs are tuned for beauty or conceptual fit; Voss's knobs must be tuned for *rightness*. Without an external metric, the model risks reducing moral revolutions to mere ideological fashion or the reconfiguration of power dynamics.
  2.  **The Epistemic Boundary:** In cognitive science, some knobs are hardwired (neural architecture) and others are soft (activation levels). In ethics, how does an agent know *ex ante* whether a principle (e.g., 'do not kill') is a twistable parameter or a structural constraint of rational agency? If we only find out by twiddling, the cost of error is catastrophically high.
  3.  **The Phenomenon of 'Dead Knobs':** Some conceptual adjustments yield incoherence rather than new stable states. If a normative parameter consistently fails to stabilise (e.g., a society trying to institutionalise 'maximise suffering'), does this failure point to a pragmatic mismatch, or does it suggest a moral reality independent of the model? If the latter, Voss's constructivist framing may be undermined.

  ***

  ### Podcast Interview Questions for Dr Elin Voss

  **1.** Dr Voss, Hofstadter's original model describes concept formation as a process of 'slippage' and parameter adjustment governed largely by aesthetic criteria—elegance, surprise, fit. When you transpose this into the normative domain, you're suggesting our moral frameworks evolve similarly. But aesthetics are subjective in a way moral truths arguably are not. How do you prevent your model from reducing moral reasoning to a matter of taste, where a 'better' ethical framework is merely one that feels more conceptually elegant to the twiddler?

  **2.** This leads directly to the concern of moral progress. If history is just a sequence of knob adjustments, what distinguishes legitimate moral progress from mere ideological fashion or power-driven reconfiguration? After all, the shift from feudalism to liberalism involved twisting knobs, but so did the rise of totalitarian regimes. What metric tells us which twist constitutes progress rather than just variation?

  *   **Follow-up:** [Likely Answer: She will argue that stability is assessed by coherence with background social practices and long-term viability.] If stability within existing social practices is your metric, aren't you risking a deeply conservative bias? By that standard, the abolitionist movement initially looked *unstable* and incoherent relative to the background practices of the 18th century. How does your model account for revolutionary progress that deliberately *shatters* existing coherence rather than settling into it?

  **3.** Let's look at the mechanics of the model. In cognitive science, there's a distinction between soft parameters we can adjust and hard structural constraints we cannot. In ethics, how do we identify a parameter as an open 'knob' rather than a non-negotiable structural constraint of rational agency? For instance, is the 'weight of intention versus outcome' truly adjustable, or is it fixed by the nature of responsibility itself?

  *   **Follow-up:** [Likely Answer: She will suggest we identify knobs through pragmatic experimentation—those that break the system are constraints.] But this seems to make moral knowledge entirely *a posteriori* and potentially costly. If we must twist the knob of 'universalisable violence' to discover it breaks the system, we have already incurred significant harm. Does your model offer any *a priori* heuristic to identify off-limits constraints before we begin the twiddling, or must we learn ethics through catastrophic failure?

  **4.** You've spoken about the phenomenon of 'dead knobs'—normative parameters that seem adjustable but consistently fail to yield a stable ethical framework when twisted. Can you give us a concrete example of a dead knob in moral history, and what its failure tells us about the limits of moral imagination?

  *   **Follow-up:** [Likely Answer: She will argue that dead knobs reveal hidden conceptual dependencies, such as the reliance of 'justice' on some notion of 'equality'.] If these dependencies are hidden yet structural enough to cause consistent failure when violated, does that not imply a moral reality that exists independently of our twiddling? It sounds uncomfortably close to moral realism—the idea that we are discovering fixed relations rather than constructing stable configurations. How do you maintain your constructivist stance whilst admitting these rigid dependencies?

  **5.** Hofstadter's model is fundamentally about individual cognition, yet moral frameworks are collective phenomena. Who is doing the twiddling in your model? Is it the individual moral agent adjusting their personal framework, or is it a diffuse, cultural process where society acts as the cognitive system? If it's the latter, how do you explain the role of the moral outlier who sees a configuration everyone else deems unstable?

  **6.** Your view bears a striking resemblance to John Rawls's method of reflective equilibrium, where we adjust principles and judgments until they cohere. What does the knob-twiddling model offer that reflective equilibrium does not? Is there a specific dynamic or mechanism in your model that captures the *process* of change better than Rawls's static snapshot of coherence?

  **7.** One of the darkest challenges for any evolutionary model of ethics is explaining moral regression. If ethical frameworks evolve toward stability, how does your model account for periods where societies seem to twist knobs toward clearly destructive configurations, such as Nazi Germany? Was that a stable configuration that simply failed externally, or was it a local optimum that was morally bankrupt despite its internal coherence?

  **8.** Hofstadter places significant weight on symbols and patterns, but moral psychology is deeply rooted in affect and emotion. Disgust, empathy, and outrage often drive moral change more than conceptual tweaking. Where does emotion fit into the knob-twiddling architecture? Is it the motor that turns the knobs, or is it merely feedback signalling whether a setting is acceptable?

  **9.** There is a phenomenological question here. When we experience a moral breakthrough—say, realising that a certain practice is unjust—it often feels like a discovery, not an adjustment. It feels as though we are seeing something that was always there. Does your model require us to treat this feeling of 'moral sight' as an illusion generated by the sudden stability of a new configuration, or is there room for the intuition that we are tracking something mind-independent?

  **10.** Finally, let's look forward. We are currently facing novel ethical dilemmas regarding AI alignment and bioethics that human evolution never prepared us for. If your model is correct, should we be consciously attempting to twiddle normative knobs to accommodate these new entities, or should we be looking for the structural constraints that prevent us from granting them moral patienthood? What is the practical prescription of your theory for the coming century?
