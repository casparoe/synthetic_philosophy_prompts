answer: |-
  Here is the disambiguation you requested, structured as a numbered menu of distinct theses. Each entry includes a classification of the claim, its compatibility with undermining factors (deception, pressure, incompetence), and a verdict on whether it supports your friend's conclusion that the *process* of obtaining consent is irrelevant.

  ### The Menu of Theses

  **1. The Tautological Reading**
  *   **The Claim:** "Consent" is defined as "valid authorization that negates wrongdoing." Therefore, if there is consent, there is no wrong, by definition.
  *   **Verdict:** **Trivial.** It is true by linguistic convention but does no normative work. It conflates the *label* "consent" with the *status* "valid."
  *   **Undermining Factors:** Incompatible. It assumes validity rather than testing for it.
  *   **Impact on Case:** **Useless to your friend.** It cannot prove the participant *actually* consented in the valid sense; it only says *if* she validly consented, no wrong was done. It begs the question of whether the signature on the form counts as valid consent.

  **2. The Normative Power Reading**
  *   **The Claim:** Consent is a performative act that waives a right or transfers a claim. The maxim states the *effect* of a successful exercise of this power.
  *   **Verdict:** **Substantive and Defensible.** This is the standard legal/philosophical view (Hohfeldian analysis).
  *   **Undermining Factors:** **Compatible.** A power can only be exercised if conditions (capacity, information, freedom) are met. Invalid exercises of power have no effect.
  *   **Impact on Case:** **Refutes your friend.** This reading explicitly requires investigating *how* consent was obtained to determine if the power was successfully exercised. If the risk was misrepresented, the waiver is void.

  **3. The Welfare/Evidence Reading**
  *   **The Claim:** Consent is merely empirical evidence that the subject's welfare was not set back, because they wanted the outcome.
  *   **Verdict:** **Straightforwardly False (in this context).** Welfare is not solely determined by ex-ante preference. Suffering a severe, unanticipated side effect is an objective setback, regardless of prior signature.
  *   **Undermining Factors:** Incompatible. It ignores that preferences can be mistaken or manipulated.
  *   **Impact on Case:** **Refutes your friend.** The participant *was* harmed. Her signature does not erase the biological damage or the setback to her well-being.

  **4. The Remedy/Complaint Reading**
  *   **The Claim:** "No wrong is done" means "no actionable wrong exists." A harm may have occurred, but the victim has no standing to complain or claim compensation.
  *   **Verdict:** **Substantive and Defensible.** This distinguishes metaphysical harm from normative liability.
  *   **Undermining Factors:** **Compatible.** One can lose standing to complain about harm *H* while retaining standing to complain about deception *D*.
  *   **Impact on Case:** **Partially refutes your friend.** Even if she cannot sue for the injury (the harm), she retains a complaint about the fraud (the lie). The maxim does not immunize the sponsor from all claims, only specific ones.

  **5. The Description/Identity Reading**
  *   **The Claim:** Consent is always consent *under a description*. One consents to "Procedure X with Risk Y." If the reality is "Procedure X with Risk Z," the object of consent is different from the reality.
  *   **Verdict:** **Substantive and Defensible.** This is the standard doctrine of *fraud in the factum* vs. *fraud in the inducement*.
  *   **Undermining Factors:** **Highly Compatible.** Deception about the magnitude of risk severs the link between consent and action.
  *   **Impact on Case:** **Destroys your friend's argument.** She consented to a "rare risk" (e.g., 1/1000), not a "common risk" (1/50). She did not consent to what actually happened.

  **6. The Voluntariness/Baseline Reading**
  *   **The Claim:** Consent requires a choice made against a moral baseline of acceptable alternatives. Offers that exploit desperation (undue inducement) may negate voluntariness.
  *   **Verdict:** **Substantive and Debated.** Depends on whether the baseline is "no direct threats" (libertarian) or "fair background justice" (egalitarian).
  *   **Undermining Factors:** **Compatible.** Economic pressure can render consent involuntary if the baseline is moralized.
  *   **Impact on Case:** **Refutes your friend.** If the payment was coercive relative to the town's poverty, the "choice" was not voluntary. The maxim requires a voluntary will, not just a signature.

  **7. The Competency/Adaptive Preferences Reading**
  *   **The Claim:** Only a competent agent can consent. Competency includes understanding probabilities. Furthermore, if her preferences were shaped by the deprivation the study exploits, her competency is compromised.
  *   **Verdict:** **Substantive and Defensible.** Comprehension is a necessary condition for valid consent.
  *   **Undermining Factors:** **Compatible.** Incompetence (including numerical illiteracy regarding risk) voids consent.
  *   **Impact on Case:** **Refutes your friend.** You stated she "does not really grasp what one in fifty means." If she lacks capacity to understand the risk, she lacks capacity to consent to it.

  **8. The Objective Manifestation Reading (Your Friend's Strongest Case)**
  *   **The Claim:** Consent is determined by outward signs (signature, conduct), not internal states. To protect reliance interests, we treat the signature as binding even if understanding was imperfect, barring explicit fraud.
  *   **Verdict:** **Substantive but Limited.** This is a practical legal heuristic to ensure stability, but it almost universally contains a "fraud exception."
  *   **Undermining Factors:** **Incompatible with Fraud.** Even objective theories void consent if the signer was actively misled about material facts.
  *   **Impact on Case:** **Fails to support your friend.** Because the sponsor *hid data* (1 in 50 vs. rare), this is fraud. Even an objective theory of consent does not protect a liar.

  ***

  ### Placing Your Two Moves

  You identified two intuitive objections that lacked precise formulation. Here is where they fit in the taxonomy above and how to sharpen them.

  **Move 1: Consenting to the Gamble vs. Consenting to the Outcome**
  *   **Precise Form:** This is a specification of **Thesis 5 (Description/Identity)**. You do not consent to "injury"; you consent to "the risk of injury *as described*."
  *   **Defensibility:** Defensible. In medical ethics, we distinguish *assumption of risk* from *assumption of harm*. One waives the right to sue for a *known* risk materializing, not for an *unknown* risk materializing.
  *   **Effect on Maxim:** It does not leave the maxim idle; it limits its scope. The maxim applies only if the gamble consented to is the gamble played. In your case, the gamble played (1/50 chance of harm) was not the gamble consented to (rare chance of harm). Therefore, the maxim does not trigger.

  **Move 2: The Harm Complaint vs. The Lie Complaint**
  *   **Precise Form:** This is a specification of **Thesis 4 (Remedy/Complaint)** and **Thesis 2 (Normative Power)**. Consent waives the claim regarding the *procedure's inherent risks*, but it does not waive the claim regarding the *integrity of the agreement*.
  *   **Defensibility:** Defensible. Fraud is an independent wrong. Even if I consent to be cut (surgery), I do not consent to be cut by someone who lied about their credentials.
  *   **Effect on Maxim:** It prevents the maxim from acting as a total shield. *Volenti non fit iniuria* might block the claim for the injury (if the risk were known), but it cannot block the claim for the deception. Since the deception caused the participation, the entire transaction is tainted.

  ### Summary Verdict for Your Argument

  Your friend is relying on **Thesis 1 (Tautology)** to win the argument, but he needs **Thesis 2 (Normative Power)** to make sense of the law. However, once he accepts Thesis 2, he must accept the conditions of validity (Theses 5, 6, and 7).

  **The Knockout Point:**
  The maxim *volenti non fit iniuria* presupposes *volenti* (willingness). Willingness requires knowledge and freedom.
  *   If the risk was 1/50 but described as rare, there is no knowledge (**Thesis 5**).
  *   If the payment was coercive due to poverty, there is no freedom (**Thesis 6**).
  *   If she could not understand the probability, there is no capacity (**Thesis 7**).

  On any defensible reading (2, 4, 5, 8), the **way consent was obtained is everybody's business**, because that process determines whether the maxim applies at all. Your friend's conclusion—that the process is irrelevant—is a non-sequitur that only follows if one treats "consent" as a magic word rather than a normative status earned through specific conditions.
