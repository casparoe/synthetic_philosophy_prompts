  11. **Final Polish:** Ensure the distinction between "nitpicks" and "fatal flaws" is explicit as requested. (Proceed to generate output).

  *(Self-Correction Note on the "Survival" argument)*: The user describes the friend's second argument as: "we've been around... without anything wiping us out... catastrophes must be rarer." This is technically an application of Laplace's Rule of Succession or a simple frequentist inference on hazard rates. It is *not* necessarily the Self-Indication Assumption, though SIA leads to similar "optimistic" conclusions. I need to be careful not to conflate them, but point out that one relies on *temporal duration* (survival so far) and the other on *population rank* (birth order). They rely on different data points that can conflict. I will frame this as "Duration vs. Rank."

  *(Refining the "Urn" mapping)*: The friend says "treat yourself as a random draw." This is the Self-Sampling Assumption (SSA). I need to name this so the user can look it up if they want, but explain it simply.

