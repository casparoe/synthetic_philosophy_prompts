      *   **Auxiliary Hypotheses (The Protective Belt):** When is it legitimate? When it leads to new discoveries. When is it costly? When it's *ad-hoc* (only saves the theory from one specific problem, predicts nothing else). Example: Patching a model to pass one benchmark vs. improving the architecture to pass a class of benchmarks.
      *   **Novel Predictions vs. Internal Coherence:** This is crucial. Lakatos insists on *novel empirical content*. Internal coherence (mathematical beauty, code elegance) is not enough. The system must "reach out" and grab new reality. In AI: Does the scaling hypothesis predict a new capability *before* we see it, or do we find the capability and then say "scaling explains it"?
