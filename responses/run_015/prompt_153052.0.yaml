prompt: |-
  You are a professional philosopher specializing in metaethics and evolutionary epistemology. Before giving your final assessment, please take a moment to brainstorm systematically: first lay out an explicit correspondence table, then separate disanalogies that matter for the intended argument from those that do not, and only then evaluate whether the conclusion survives.

  In discussions of evolutionary debunking, a common analogy compares moral cognition to taste preference formation: just as evolutionary biology explains our attraction to sugar without committing us to sugar possessing an objective, mind-independent property of goodness, evolutionary explanations of moral judgment are said to explain those judgments without committing us to objective moral properties. The analogy is typically used to license a specific conclusion—that evolutionary debunking undermines moral realism in the same direct, symmetrical way it undermines any gustatory realism about sweetness, and therefore that moral realists have no special defense against the debunking.

  I want you to audit this analogy carefully, but with one added conceptual layer. Alongside the standard mapping, consider the distinction between calibration tracking (a mechanism shaped to register an independent state of affairs) and ecological attunement (a mechanism shaped to maintain stable coordination within a particular social environment, without requiring correspondence to external moral facts). Some defenders of morality argue that even if moral cognition is fitness-driven, it might be attuned to genuinely stable cooperative structures in the way a thermostat registers temperature, rather than merely projecting preference onto a neutral world.

  Please do the following. First, provide the explicit correspondence table: what in the moral case plays the role of sweetness, the taste receptor, sugar, the evolutionary pressure, and the putative gustatory realist? Second, identify where the mapping breaks—particularly regarding whether moral cognition involves anything analogous to sensory transduction of an external property, whether evolutionary explanations of moral belief are genuinely symmetrical with explanations of taste preference, and whether the calibration-tracking versus ecological-attunement distinction fractures the symmetry the analogy depends on. Third, say what each side of the analogy quietly imports about whether values are projected or detected, and whether those imports are warranted. Fourth, determine whether the conclusion—that evolutionary debunking defeats moral realism as cleanly as it defeats gustatory realism—actually survives once these disanalogies and the attunement possibility are on the table, or whether the analogy was carrying the argumentative load all along. Finally, if the analogy collapses at a critical point, suggest what a better comparison would be for assessing whether evolutionary origins selectively undermine moral knowledge.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in metaethics and evolutionary epistemology.
      *   **Task:** Audit the analogy between moral cognition and taste preference formation in the context of evolutionary debunking arguments (EDAs).
      *   **Specific Constraint:** Before the final assessment, I must brainstorm systematically:
          1.  Create an explicit correspondence table.
          2.  Separate disanalogies that matter from those that don't.
          3.  Evaluate whether the conclusion survives.
      *   **Key Conceptual Layer:** Distinguish between *calibration tracking* (registering independent states) and *ecological attunement* (maintaining coordination without correspondence to external facts).
      *   **Steps:**
          1.  Provide the correspondence table (Sweetness, Receptor, Sugar, Pressure, Realist).
          2.  Identify mapping breaks (Sensory transduction, Symmetry of explanation, Calibration vs. Attunement).
          3.  Analyze imports (Projected vs. Detected values, Warrant).
          4.  Determine if the conclusion survives (Does EDA defeat moral realism as cleanly as gustatory realism?).
          5.  If the analogy collapses, suggest a better comparison.

  2.  **Step 1: Correspondence Table (Brainstorming & Drafting):**
      *   *Goal:* Map the Gustatory Case to the Moral Case.
      *   *Gustatory:* Sugar (chemical structure), Sweetness (phenomenal property/secondary quality), Taste Receptor (biological mechanism), Evolutionary Pressure (calorie detection/survival), Gustatory Realist (claims sweetness is mind-independent).
      *   *Moral:* Cooperative Act/State of Affairs (e.g., helping kin), Moral Rightness (phenomenal property/normative status), Moral Intuition/Faculty (biological mechanism), Evolutionary Pressure (group cohesion/reproductive success), Moral Realist (claims rightness is mind-independent).
      *   *Refinement:* Need to be precise about "Sweetness." Is it the chemical or the experience? In the EDA context, it's usually the *judgment* of sweetness vs. the *property* of sweetness. Let's align:
          *   Sugar $\rightarrow$ Action/State of Affairs (e.g., Kin Altruism).
          *   Sweetness (Phenomenal) $\rightarrow$ Moral Rightness (Phenomenal/Normative).
          *   Taste Receptor $\rightarrow$ Moral Sentiment/Intuition Module.
          *   Evolutionary Pressure $\rightarrow$ Fitness Advantage (Survival/Reproduction).
          *   Gustatory Realist $\rightarrow$ Moral Realist (Robust/Non-Naturalist).

  3.  **Step 2: Identifying Disanalogies (Matter vs. Don't Matter):**
      *   *Don't Matter:* Complexity of the stimulus (sugar is simple, morality is complex). Phenomenal intensity (sugar is immediate, morality can be reflective).
      *   *Do Matter:*
          *   *Transduction:* Taste involves physical contact and chemical binding (causal link). Morality involves abstract reasoning and social negotiation (no clear causal link to "moral particles").
          *   *Function:* Taste is primarily *consumptive* (take in energy). Morality is primarily *regulative/coordinative* (manage social relations).
          *   *Calibration vs. Attunement:* Taste *tracks* calories (calibration). Morality might *attune* to social equilibria (attunement). If it attunes, does it need independent facts?
          *   *Independence:* Sugar exists without humans. Do moral facts exist without moral agents? (The crux of realism).

  4.  **Step 3: Imports (Projected vs. Detected):**
      *   *Gustatory:* Imports that sweetness is a secondary quality (Lockean). It depends on the perceiver. Realism about *primary* sweetness (mind-independent) is easily debunked.
      *   *Moral:* Imports that moral value is either projected (error theory/expressivism) or detected (realism). The analogy assumes detection is the only alternative to projection, ignoring *constructivism* or *response-dependence* that isn't merely subjective.
      *   *Warrant:* Is the warrant for taste (survival) the same as morality (cooperation)? Survival is individual/biological. Cooperation is relational/normative.

  5.  **Step 4: Evaluating the Conclusion (Survival of the Argument):**
      *   *The EDA Claim:* Evolution explains belief $X$ without reference to truth of $X$. Therefore, $X$ is unjustified.
      *   *Gustatory:* Evolution explains "Sugar is good" via calorie need. "Sugar is objectively Good" is false.
      *   *Moral:* Evolution explains "Helping is good" via kin selection. "Helping is objectively Good" is... ?
      *   *The Attunement Twist:* If moral cognition is *ecologically attuned*, it's not tracking a "Platonic Form of Good." It's tracking *stable social equilibria*. These equilibria are real features of the world (game theoretic facts). So, evolution *does* track truth, just not *non-natural* truth.
      *   *Result:* The analogy defeats *Robust Non-Natural Realism* but might spare *Naturalist Realism* or *Constructivism*. The analogy assumes the only realism is the kind that posits "moral sugar." If moral facts are like "equilibrium points," evolution tracks them.
      *   *Verdict:* The analogy carries too much load. It assumes moral facts must be like physical properties (sugar) to be real. If they are like game-theoretic stable states, the debunking fails.

  6.  **Step 5: Better Comparison:**
      *   If taste is too physiological and physics-based, what is social/normative but truth-apt?
      *   *Idea 1:* Logic/Math. (Too abstract, not evolutionary in the same way).
      *   *Idea 2:* Color. (Secondary qualities, but still physical).
      *   *Idea 3:* *Game Theoretic Equilibria* or *Linguistic Grammar*.
      *   *Selection:* **Chomskyan Universal Grammar** or **Game Theoretic Equilibria**. Let's go with Game Theoretic Equilibria (e.g., Nash Equilibria in coordination games). It captures the "stable coordination" aspect of ecological attunement.

  7.  **Drafting the Response (incorporating the persona):**
      *   *Tone:* Rigorous, analytical, philosophical.
      *   *Structure:* Follow the prompt's four steps explicitly.
      *   *Content:* Ensure the "Calibration vs. Attunement" distinction is central.

      *(Self-Correction during drafting)*: Make sure I don't just say "the analogy fails." I need to explain *why* it fails specifically regarding the *symmetry* of the debunking. The EDA relies on the *insensitivity* of the belief to the truth. If moral truth is constituted by the very social facts evolution attuned us to, the belief *is* sensitive to the truth.

      *(Refining the Table)*: Ensure the "Realist" column is clear. A "Gustatory Realist" in the strong sense is someone who thinks sweetness is intrinsic to sugar regardless of perceivers. That's a strawman, but it's the target of the EDA. I need to note that.

      *(Refining Attunement)*: Clarify that attunement doesn't require *causal* contact with a moral particle, but functional alignment with a social fact.

  8.  **Final Review against Constraints:**
      *   Correspondence table? Yes.
      *   Disanalogies (matter vs. don't)? Yes.
      *   Imports (projected/detected)? Yes.
      *   Conclusion survival? Yes.
      *   Better comparison? Yes.
      *   Brainstorming systematic? Yes (embedded in the structure).

  9.  **Final Polish:** Check for clarity and philosophical precision (e.g., distinguishing between ontological independence and epistemic access).

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  ### Systematic Audit of the Gustatory-Moral Analogy in Evolutionary Debunking

  As a philosopher specializing in metaethics and evolutionary epistemology, I will proceed by first constructing the mapping, then isolating the structural fractures, analyzing the metaphysical imports, and finally adjudicating the survivability of the debunking conclusion.

  #### 1. Explicit Correspondence Table

  To evaluate the analogy, we must first formalize the mapping between the **Gustatory Case** (the source) and the **Moral Case** (the target). The analogy aims to show that just as evolutionary explanations of taste undermine claims about the objective reality of sweetness, evolutionary explanations of morality undermine claims about the objective reality of value.

  | Component | Gustatory Case (Source) | Moral Case (Target) |
  | :--- | :--- | :--- |
  | **Stimulus Object** | **Sucrose/Carbohydrates** (Chemical structure) | **Cooperative Action / State of Affairs** (e.g., Kin Altruism, Reciprocity) |
  | **Phenomenal Property** | **Sweetness** (The qualitative experience/judgment) | **Moral Rightness/Goodness** (The normative experience/judgment) |
  | **Detection Mechanism** | **Taste Receptors** (Biological transduction) | **Moral Intuition / Sentiment** (Psycho-social cognitive module) |
  | **Evolutionary Pressure** | **Caloric Intake / Survival** (Need for energy) | **Group Cohesion / Reproductive Fitness** (Need for coordination) |
  | **The "Realist"** | **Gustatory Realist** (Claims sweetness is intrinsic to sugar, mind-independent) | **Moral Realist** (Claims rightness is intrinsic to actions, mind-independent) |
  | **The Debunking Move** | Evolution explains the *belief* "Sugar is sweet" via survival need, not via the *truth* of "Sweetness is intrinsic." | Evolution explains the *belief* "Helping is good" via fitness need, not via the *truth* of "Goodness is intrinsic." |

  #### 2. Disanalogies: Trivial vs. Critical

  Not all differences between taste and morality undermine the analogy. We must distinguish between surface-level disanalogies and those that fracture the logical symmetry required for the Evolutionary Debunking Argument (EDA) to hold.

  **A. Disanalogies that Do Not Matter (Surface Level)**
  *   **Phenomenal Immediacy:** Taste is often more visceral and immediate than moral judgment. *Irrelevant:* EDAs target the *etiology* of the belief, not the phenomenology.
  *   **Complexity of Stimulus:** Sugar is chemically simple; moral situations are contextually complex. *Irrelevant:* Evolution can shape heuristics for complex environments just as it does for simple ones.
  *   **Cultural Variability:** Taste varies less across cultures than morality. *Irrelevant:* Variation does not preclude a shared underlying mechanism shaped by selection.

  **B. Disanalogies that Matter (Structural Level)**
  *   **Sensory Transduction vs. Conceptual Construction:**
      *   *Gustatory:* Involves physical causal contact. The sugar molecule binds to the receptor. There is a direct causal chain from object to belief.
      *   *Moral:* Involves abstract reasoning, language, and social negotiation. There is no known "moral particle" that causally impacts a "moral receptor."
      *   *Impact:* This fractures the **Calibration Tracking** model. If there is no causal transduction, the mechanism cannot be "tracking" an independent property in the same way taste tracks calories.
  *   **The Nature of the "Fact" Tracked:**
      *   *Gustatory:* The fact is *naturalistic* (caloric density).
      *   *Moral:* The realist often posits a *non-naturalistic* fact (normative authority).
      *   *Impact:* If the moral fact is non-natural, evolution (a natural process) cannot track it by definition. However, if the moral fact is natural (e.g., a social equilibrium), the analogy shifts.
  *   **Calibration Tracking vs. Ecological Attunement:**
      *   *Gustatory (Calibration):* The system is designed to *mirror* an external state (calories exist regardless of the organism).
      *   *Moral (Attunement):* The system is designed to *coordinate* with other agents. The "fact" of a successful coordination (e.g., a Nash Equilibrium) is not independent of the agents involved in the way sugar is independent of the eater.
      *   *Impact:* This is the critical fracture. If morality is **ecologically attuned**, it does not need to correspond to a mind-independent "moral sugar" to be truth-apt. It needs to correspond to *relational facts* about stability and cooperation, which evolution *does* track.

  #### 3. Imports: Projected vs. Detected Values

  The analogy quietly imports metaphysical commitments that bias the evaluation of the EDA.

  **A. The Gustatory Import: Secondary Qualities as Projection**
  The analogy assumes the "Gustatory Realist" is claiming sweetness is a *primary quality* (intrinsic to the object). Since science shows sweetness is a *secondary quality* (dependent on the perceiver), the realist is defeated.
  *   *Warrant:* This is warranted for taste. Sweetness *is* response-dependent.
  *   *Import to Morality:* It forces the Moral Realist into a corner where they must claim moral value is a *primary quality* (intrinsic to the action, regardless of agents).
  *   *Problem:* Many moral realists (e.g., response-dependence theorists, constructivists) argue moral value is more like a secondary quality or a relational property. The analogy smuggles in the assumption that *only* mind-independent properties count as "real," which begs the question against sophisticated moral realism.

  **B. The Detection Import: Causal vs. Constitutive**
  The analogy imports the idea that for a belief to be justified, the mechanism must *detect* a pre-existing property (Detection Model).
  *   *Warrant:* Warranted for empirical sciences.
  *   *Import to Morality:* It ignores the **Constitutive Model**. In ecological attunement, the cognitive mechanism doesn't just detect the social norm; it helps *constitute* it. By having the intuition, I make the cooperative equilibrium possible.
  *   *Problem:* If moral facts are constituted by the very attitudes evolution shaped, then evolution *did* track the truth (because the truth depends on the attitudes). The analogy hides this possibility by treating moral facts as if they were sugar (waiting to be found).

  #### 4. Evaluation: Does the Conclusion Survive?

  **The Conclusion:** *Evolutionary debunking defeats moral realism as cleanly as it defeats gustatory realism.*

  **Assessment:** The conclusion **does not survive** intact once the Calibration/Attunement distinction is applied.

  **Reasoning:**
  1.  **Symmetry Failure:** The EDA relies on the premise that the evolutionary explanation of the belief is *independent* of the truth of the belief.
      *   In the **Gustatory Case**, the belief "Sugar is good" is explained by the need for calories. The truth "Sugar is objectively Good (mind-independent)" is false. The explanation is independent of the truth.
      *   In the **Moral Case (Attunement View)**, the belief "Helping is good" is explained by the need for cooperation. The truth "Helping is good" might mean "Helping sustains a stable cooperative equilibrium." Since the evolutionary pressure *is* the pressure to sustain that equilibrium, the explanation is **not independent** of the truth. Evolution shaped us to track the very facts (social stability) that make the moral judgment true.
  2.  **The Load-Bearing Analogy:** The analogy was carrying the argumentative load by equating **Mind-Independence** with **Objectivity**. It suggests that because sweetness isn't mind-independent, it isn't "real" in a robust sense, and morality shouldn't be either. But moral realism does not require the same kind of mind-independence as physical objects. It requires *inter-subjective stability*.
  3.  **Calibration vs. Attunement:** If moral cognition is **Calibration Tracking**, the EDA succeeds (we are tracking fitness, not moral truth). But if moral cognition is **Ecological Attunement**, the EDA fails. Attunement *is* a form of tracking truth about social relations. A thermostat attunes to temperature; it doesn't need to know the physics of heat to register the truth of the room's state. Similarly, moral intuition attunes to social equilibrium; it doesn't need to know Platonic forms to register the truth of normative obligations.

  **Verdict:** The analogy successfully debunks **Robust Non-Natural Realism** (the idea that moral facts are like magical particles). However, it fails to debunk **Naturalist Realism** or **Constructivism** that views moral facts as stable features of the social ecology. The analogy collapses because it treats all realism as if it were gustatory primary-quality realism.

  #### 5. A Better Comparison

  If the gustatory analogy fails because it models morality as a physiological consumption mechanism rather than a social coordination mechanism, we require an analogy that captures **rule-governed coordination without requiring mind-independent metaphysical particles.**

  **Proposed Analogy: Linguistic Grammar (Universal Grammar)**

  *   **Mapping:**
      *   *Taste Receptor* $\rightarrow$ **Language Acquisition Device (LAD)**.
      *   *Sugar* $\rightarrow$ **Specific Sentences Uttered**.
      *   *Sweetness* $\rightarrow$ **Grammaticality**.
      *   *Evolutionary Pressure* $\rightarrow$ **Communication / Social Coordination**.
      *   *Realist Claim* $\rightarrow$ **"This sentence is grammatically correct."**

  *   **Why it works better:**
      1.  **Objectivity without Mind-Independence:** Grammaticality is objective (a sentence is either grammatical or not relative to a language), but it is not mind-independent (it depends on the rules held by speakers). This mirrors the **Ecological Attunement** view of morality.
      2.  **Evolutionary Tracking:** Evolution shaped our LAD to track grammatical structures because communication aids survival. Does this debunk the truth of grammatical judgments? No. It explains *how* we access grammatical truths. The evolutionary origin validates the reliability of the faculty regarding its proper domain.
      3.  **Debunking Scope:** An EDA using this analogy would ask: "Does evolution explain why we think Subject-Verb-Object is correct without reference to grammatical facts?" The answer is: Evolution shaped us to track *communicative efficiency*, and grammatical rules *are* the codification of that efficiency. Thus, the evolutionary explanation is **sensitive** to the truth of the grammatical facts.

  **Conclusion:** Switching from **Taste** to **Grammar** shifts the debate from "Are values real properties?" to "Are norms stable features of our social technology?" This preserves the objectivity of morality without requiring the metaphysically suspicious "moral particles" that the gustatory analogy rightly ridicules. The gustatory analogy is therefore useful only for defeating a strawman of moral realism, not for defeating moral realism *simpliciter*.
