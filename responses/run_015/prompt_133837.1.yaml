answer: |-
  **JOINT STATEMENT ON CAREENIUM DYNAMICS**

  **Section 1 — Agreed claims**

  We, the undersigned representatives of the Substrate and Symbol camps, affirm the following substantive claims regarding the careenium set-up. Neither side concedes metaphysical ground by signing, but we acknowledge these facts as the common basis for further inquiry.

  1.  **Microphysical Completeness:** The microdynamics of the simmballs and careenium are deterministic and causally complete. No energy, momentum, or information is created or destroyed; the microstate at any time nomologically suffices for the microstate at all later times.
  2.  **Supervenience:** Legible patterns supervene on the microstate. There is no difference in pattern without a difference in the underlying arrangement of pips, positions, or velocities.
  3.  **Invariance:** The pattern-level law is invariant across the realisation class (Stipulation 2). Holding the pattern fixed while varying the microstate within its class leaves the coarse-grained outcome unchanged; changing the pattern changes the outcome as predicted.
  4.  **Predictive Screening-off:** Given the exact microstate, knowledge of the pattern adds no predictive power regarding the micro-outcome. The microstate screens off the pattern for the purpose of precise prediction.
  5.  **Empirical Adequacy:** Both the micro-description and the pattern-description are empirically adequate at their respective grains. Each correctly predicts the target's behaviour within its domain of application.
  6.  **The Scrambled Twin Fact:** In the Scrambled Twin scenario (Stipulation 3), the absence of a legible pattern correlates with the absence of the target shove, despite identical total energy and micro-laws. Both camps agree this correlation must be accounted for.
  7.  **The Re-encoding Drift Fact:** In the Re-encoding Drift (Stipulation 4), the pattern persists and the target's behaviour remains continuous despite the microstate being replaced by disjoint realisers. Both camps agree the macro-continuity exists despite micro-discontinuity.
  8.  **Explanatory Burden:** Any adequate account must explain why the Scrambled Twin fails to shove the target and why the Re-encoding Drift succeeds, without violating microphysical completeness.

  **Section 2 — Disagreements table**

  | Crux | Substrate Formulation | Symbol Formulation | Shared Test or Case | Substrate Prediction | Symbol Prediction | Falsification Condition |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Cause** | Cause requires physical production: the transfer of a conserved quantity (energy/momentum) from simmballs to target. | Cause requires difference-making: counterfactual dependence of the outcome on the variable in question, holding relevant background fixed. | Track conserved quantities during the shove. | Only micro-variables transfer conserved quantities; patterns do not. | Patterns track the transfer; macro-variables capture the causal structure. | If patterns transfer energy, Substrate falsified. If micro-vars fail counterfactuals, Symbol falsified. |
  | **Screening-off** | Screening-off is decisive. If the microstate fixes the outcome, the pattern is causally inert epiphenomena. | Screening-off is irrelevant to macro-causation. Causal claims are level-relative; micro-screening does not erase macro-difference-making. | Conditional independence test: $P(Outcome | Micro, Pattern) == P(Outcome | Micro)$. | Confirms pattern adds nothing; thus pattern is not a cause. | Confirms redundancy, but redundancy is compatible with autonomous macro-causation. | If pattern adds predictive power given micro, Substrate falsified. |
  | **Counterfactuals** | In a deterministic system, one cannot change the pattern without changing the microstate. Backtracking counterfactuals are ill-formed. | Counterfactuals are evaluated within the realisation class. One holds the pattern fixed while wiggling the microstate (Stipulation 2). | Compare actual run to Scrambled Twin (Stipulation 3). | Twin differs microscopically; thus outcome differs due to micro-chaos, not pattern absence. | Twin differs pattern-wise; thus outcome differs due to pattern absence. | If Twin shoves target, Symbol falsified. If micro-law violated, Substrate falsified. |
  | **Scrambled Twin** | Shows that specific micro-arrangements are required for the shove. The "pattern" is just a label for successful micro-configurations. | Shows that the presence of a legible pattern is necessary. Micro-chaos prevents the rule from being executed. | Measure mutual information between pattern-legibility and target velocity. | Correlation exists but is grounded in micro-geometry. | Correlation exists and is grounded in pattern-level law. | If legible patterns fail to shove, Symbol falsified. |
  | **Re-encoding Drift** | Micro-continuity is preserved via overlapping causal chains between successive realisers, even if disjoint from earlier ones. | Micro-discontinuity proves macro-autonomy. The pattern persists where the physical realisers do not. | Map micro-trajectories during the drift period. | Continuous micro-chain will be found linking successive states. | No single micro-chain persists; only the pattern persists. | If micro-chain breaks completely, Substrate falsified. If pattern breaks, Symbol falsified. |
  | **Causal Discovery** | Algorithms given micro-variables will find micro-edges. Adding macro-variables will show them as redundant descendants. | Algorithms given macro-variables will find robust edges. Adding micro-variables will show noise relative to the macro-law. | Run causal discovery on micro-data only, then macro-data only. | Micro-graph is complete; macro-graph is a lossy projection. | Macro-graph captures the invariant structure; micro-graph is too complex to be useful. | If macro-variables vanish in combined graph, Symbol weakened. |
  | **Conserved Pushing** | "Pushing" literally requires force transfer. Only simmballs push. | "Pushing" metaphorically extends to information transfer. The pattern pushes by constraining the medium. | Analyse momentum transfer during interaction. | All momentum comes from simmballs. | Momentum is the medium; the pattern is the driver. | If pattern transfers momentum directly, Substrate falsified. |

  **Section 3 — What is merely verbal**

  We acknowledge that a significant portion of our residual dispute is verbal rather than factual. Both camps agree on the physical history of the tank: the simmballs move, the pips extend, the target shoves, and the equations hold. We disagree primarily on the application of the word "cause" and the ontological status implied by "real".

  The Substrate camp uses "cause" to denote fundamental physical production. On this definition, since patterns do not add energy to the system, they cannot be causes. This is a stipulation about the term "cause", not a discovery about the tank. The Symbol camp uses "cause" to denote robust counterfactual dependence at a specific grain of description. On this definition, since the shove depends on the pattern across the realisation class, the pattern is a cause. This is a stipulation about the utility of macro-level explanation.

  Furthermore, we dispute the meaning of "real" in "real causal power". Substrate insists reality tracks the fundamental ontology (simmballs). Symbol insists reality tracks invariant structures regardless of substrate. Since both agree on the invariance and the ontology, the disagreement reduces to whether the label "real cause" applies to the substrate alone or to the invariant pattern as well. We agree that no further experiment on the careenium can settle this, as the physics is already fully specified in Section 1. The choice between our formulations is therefore a pragmatic choice about which language best serves explanation and intervention, not a conflict about the behaviour of the simmballs.
