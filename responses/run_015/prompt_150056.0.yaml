prompt: |-
  I'm a senior counsellor at an outpatient addiction clinic and I chair the weekly conference where we decide what to do about what clients tell us about their own use — "I can stop whenever I want", "the test must be wrong", "I only drink when things are bad and things are fine now". About a dozen a week, ten or fifteen minutes each, junior staff with no philosophy background have to be able to run it, and anything that changes a treatment plan gets signed off by the clinical lead. So I want a decision procedure, not an essay on denial.

  The problem is we use "in denial" for about six different states and it matters which one it is: the client knows and is lying to us; the client knows and simply can't act on it (ordinary weakness of will, nothing wrong with their beliefs); the client has arranged not to find out — skipping the blood draw, getting their partner to pick up the results and not tell them; the client genuinely never had the information; and the client is filling a gap (blackouts, fuzzy memory) with a story that isn't especially motivated by anything. I want steps that separate those and say what follows: when we push, when we drop it and move on, when we go and get more evidence, and when we stop and hand it to the lead because what's left is a values call about how hard to lean on someone.

  Two constraints from what I've read about self-deception, which I want baked in rather than footnoted: it doesn't have to be something the person decided at some point, so no hunting for the moment they chose to fool themselves — look at what's sustaining the not-knowing right now; and once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it. There's also a case I don't know what to do with: two of our groups have converged on a shared line ("none of us really has a problem, the clinic exaggerates") that nobody seems to hold on their own. Treat that as a case the procedure has to handle, not a footnote.

  Give me the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it stops because the question is values and not facts. Then run it on two real cases: (1) a client with a positive screen who insists the lab mixed up the samples and has now asked his brother, who he lives with, to pick up his results so he never has to open the portal; (2) a client who says "I can stop any time, I've done it before" — and has in fact stopped for three months twice, whose use is down a lot but not zero, and who the junior staff all want to call denial. That second one, please give me the answer I won't like even if it means we drop the denial framing. And tell me straight what the procedure can't do.

  No preamble: lead with your bottom line in the first sentence, then the reasoning.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Senior Counsellor at an outpatient addiction clinic.
      *   **Task:** Create a decision procedure (algorithm/flowchart style) for weekly conferences to categorize client statements about use ("denial" variants) and determine actions.
      *   **Audience:** Junior staff (no philosophy background), 10-15 mins per case, 12 cases/week.
      *   **Goal:** Distinguish between 5-6 states of "denial" (lying, weakness of will, strategic ignorance, lack of info, confabulation, shared group belief) and prescribe actions (push, drop, gather evidence, escalate to lead).
      *   **Constraints:**
          1.  No hunting for the origin moment of self-deception (focus on current sustenance).
          2.  Cannot use the client's word as evidence once credibility is doubted regarding that state.
          3.  Handle the "shared group belief" case (two groups converging on "clinic exaggerates").
          4.  No preamble: Lead with the bottom line in the first sentence.
          5.  Include specific questions, pass/fail criteria, stop points (fact vs. values).
          6.  Run the procedure on two specific cases (Sample mix-up/strategic ignorance; "I can stop anytime"/partial success).
          7.  For Case 2, provide the uncomfortable answer (maybe drop "denial" framing).
          8.  State what the procedure *cannot* do.

  2.  **Deconstruct the "Denial" States:**
      The user lists specific distinctions needed:
      1.  Knowing & Lying (Deception).
      2.  Knowing & Can't Act (Weakness of Will/Akrasia).
      3.  Strategic Ignorance (Arranged not to know).
      4.  Genuine Lack of Information (Never had the info).
      5.  Confabulation (Filling gaps, not motivated).
      6.  Shared Group Belief (Socially sustained narrative).

  3.  **Drafting the Decision Procedure:**
      *   Needs to be step-by-step questions.
      *   Needs clear "Yes/No" branching.
      *   Needs action outputs (Push, Drop, Evidence, Escalate).
      *   Needs to respect the constraint: Don't use client testimony if credibility is compromised on that specific point.
      *   Needs to respect the constraint: Focus on current maintenance, not origin.

      *Drafting Steps:*
      *   Step 1: Verify Evidence. (Is there objective data contradicting the claim?)
      *   Step 2: Check Access to Information. (Could they know?)
      *   Step 3: Check Avoidance Behavior. (Are they actively preventing knowledge?)
      *   Step 4: Check Consistency/History. (Is this a pattern or a one-off?)
      *   Step 5: Check Social Context. (Is this a group script?)
      *   Step 6: Determine Action.

      *Refining for Constraints:*
      *   Constraint 2 (No using client word if doubted): If we suspect lying/strategic ignorance, we can't ask "Do you know?" and trust the answer. We need behavioral markers.
      *   Constraint 1 (Current sustenance): Focus on what maintains the belief now (e.g., avoiding the portal), not when they decided to avoid it.

      *Proposed Flow:*
      1.  **Contradiction Check:** Is there objective evidence contradicting the claim? (If No -> Drop/Educate. If Yes -> Next.)
      2.  **Access Check:** Did/Does the client have access to the contradicting evidence? (If No -> Inform. If Yes -> Next.)
      3.  **Avoidance Check:** Is there active behavior preventing integration of evidence? (If Yes -> Strategic Ignorance. If No -> Next.)
      4.  **Capacity Check:** Has the client demonstrated ability to act on the truth recently? (If Yes -> Weakness of Will. If No -> Next.)
      5.  **Social Check:** Is this claim mirrored by peers in treatment without independent basis? (If Yes -> Shared Narrative. If No -> Next.)
      6.  **Memory/Gap Check:** Is the claim filling a memory gap? (If Yes -> Confabulation. If No -> Deception/Values.)

      *Wait, need to align actions:*
      *   Lying -> Confront/Escalate?
      *   Weakness of Will -> Support/Plan?
      *   Strategic Ignorance -> Block avoidance?
      *   Lack of Info -> Inform.
      *   Confabulation -> Clarify memory.
      *   Shared Narrative -> Group intervention/Lead.

      *Refining the "Values Call":* The user wants to know when to hand off to the lead because it's a values call about how hard to lean. This usually happens when credibility is shattered but therapeutic alliance is at risk, or when the "denial" is actually a reasonable disagreement on goals.

  4.  **Developing the Cases:**
      *   **Case 1:** Positive screen, claims lab error, asks brother to pick up results to avoid portal.
          *   Evidence: Yes (Positive screen).
          *   Access: Yes (Portal exists).
          *   Avoidance: Yes (Brother picking up results).
          *   Classification: Strategic Ignorance (Arranged not to find out).
          *   Action: Block avoidance, require direct receipt.
      *   **Case 2:** "I can stop anytime", stopped twice for 3 months, use down but not zero. Staff want to call "denial".
          *   Evidence: Use is not zero (contradicts "problem" maybe, but contradicts "need treatment"?). Claim is "I can stop". Evidence shows they *have* stopped.
          *   Access: Yes.
          *   Avoidance: No.
          *   Capacity: Yes (Stopped twice).
          *   Classification: Not Denial. Maybe accurate self-assessment of capacity, but disagreement on *necessity*.
          *   Uncomfortable Answer: Staff are wrong. It's not denial. It's a goals mismatch. Drop the denial framing.
          *   Action: Negotiate goals, not truth.

  5.  **Addressing the "Shared Group Belief":**
      *   Need a specific step for this. If multiple clients express the *exact* same nuanced skepticism without independent verification, it's social contagion/groupthink.
      *   Action: Group intervention, check group facilitator, escalate to lead if it undermines treatment model.

  6.  **Addressing Constraints in the Output:**
      *   First sentence: Bottom line.
      *   No preamble.
      *   Clear questions.
      *   Explicit "Stop" points.
      *   Limitations section.

  7.  **Refining the Procedure Logic (Self-Correction):**
      *   *Constraint Check:* "Once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it."
      *   *Implication:* If we suspect strategic ignorance, we can't ask "Did you know?" We must infer from behavior (asking brother).
      *   *Implication:* If we suspect confabulation, we can't trust their memory report. We need collateral.
      *   *Procedure Adjustment:* Ensure questions rely on observable behavior or objective records, not client self-report, once contradiction is established.

      *Revised Flow:*
      1.  **Objective Contradiction:** Is there hard data (tox, attendance, collateral) contradicting the claim? (No -> Accept claim/Educate. Yes -> Continue.)
      2.  **Information Barrier:** Is there evidence the client physically could not know the data? (Yes -> Inform. No -> Continue.)
      3.  **Active Avoidance:** Is there evidence of behavior designed to keep the data unknown? (Yes -> Strategic Ignorance. Action: Remove barrier. No -> Continue.)
      4.  **Behavioral Capacity:** Is there recent evidence (last 6 months) of successful control matching the claim? (Yes -> Not Denial (Capacity exists). Action: Negotiate Goals. No -> Continue.)
      5.  **Social Script:** Is this claim identical to peers' claims without independent evidence? (Yes -> Shared Narrative. Action: Group Intervention/Lead. No -> Continue.)
      6.  **Memory Gap:** Is the claim filling a specific blackout period? (Yes -> Confabulation. Action: Safety planning. No -> Continue.)
      7.  **Final Branch:** If all above fail, it's either Deception (Lying) or Weakness of Will (Can't act).
          *   Distinguishing these is hard without trusting self-report.
          *   If they admit use but say "I'll stop" and don't -> Weakness.
          *   If they deny use despite data -> Deception.
          *   *Values Call:* If Deception is suspected but confrontation risks dropout -> Escalate to Lead.

      *Wait, Case 2 Analysis:*
      *   Claim: "I can stop anytime."
      *   Data: Stopped twice for 3 months. Use down.
      *   Step 1 (Contradiction): Does current use contradict "can stop"? No, "can" implies ability, not current abstinence. However, usually implies "I don't need help".
      *   Step 4 (Capacity): Yes, evidence of stopping.
      *   Result: Not Denial. It's a disagreement on *need*, not *ability*.
      *   Uncomfortable truth: Staff want to pathologize capacity. Procedure says don't.

      *Case 1 Analysis:*
      *   Claim: "Lab wrong."
      *   Data: Positive screen.
      *   Step 1: Contradiction Yes.
      *   Step 2: Barrier No (Portal exists).
      *   Step 3: Avoidance Yes (Brother picks up).
      *   Result: Strategic Ignorance.
      *   Action: Mandate direct receipt.

  8.  **Drafting the Content:**
      *   *Bottom Line:* You need a behavioral flowchart that bypasses self-report once credibility is breached, categorizing states by observable maintenance mechanisms rather than internal intent.
      *   *Procedure:* Numbered steps with Yes/No paths.
      *   *Cases:* Applied strictly.
      *   *Limitations:* What this can't solve (therapeutic alliance, motivation).

  9.  **Review against Constraints:**
      *   First sentence bottom line? Yes.
      *   No preamble? Yes.
      *   Questions in order? Yes.
      *   Good enough answer defined? Yes.
      *   Stop points (No/Values)? Yes.
      *   Case 1 & 2 run? Yes.
      *   Case 2 uncomfortable answer? Yes.
      *   What procedure can't do? Yes.
      *   Shared group belief included? Yes.
      *   No hunting for origin moment? Yes (focus on current behavior).
      *   No using client word if doubted? Yes (procedure relies on objective/behavioral evidence).

  10. **Final Polish:** Ensure tone is clinical, direct, and usable by juniors. Avoid jargon where possible. Make sure the "Values Call" escalation is clear.

      *Self-Correction on Case 2:* The prompt says "use is down a lot but not zero". Claim is "I can stop whenever I want". Staff call it denial.
      *   If they *can* stop, why haven't they *now*?
      *   If they stopped for 3 months twice, they have the *capacity*.
      *   The claim "I can stop" is technically true based on history.
      *   The implied claim "I don't need treatment" is the real conflict.
      *   The procedure must identify this as "Capacity Verified, Goal Dispute" rather than "Denial".
      *   Uncomfortable answer: The staff are labeling a goal disagreement as a cognitive deficit. Stop calling it denial.

      *Self-Correction on Shared Belief:* Need to make sure the step detects the *convergence*. "Is this claim unique or echoed by peers without independent verification?"

      *Refining the "Values Call":* This happens when the classification is "Deception" but the cost of confronting (dropout) outweighs the benefit, or when the definition of "recovery" is contested.

      *Final check on first sentence:* "You need a behavioral flowchart that bypasses self-report once credibility is breached, categorizing states by observable maintenance mechanisms rather than internal intent." -> A bit long. Let's tighten. "This procedure classifies client statements by observable maintenance behaviors rather than internal intent, forcing staff to stop using client self-report as evidence once objective contradiction is established."

      *Wait, one more check on constraints:* "anything that changes a treatment plan gets signed off by the clinical lead." -> The procedure should indicate when to escalate to Lead.
      *   Escalate when: Values call (how hard to lean), Shared Narrative (undermines model), or Deception (requires confrontation strategy).

      *Let's write it.*
answer: |-
  This procedure classifies client statements by observable maintenance behaviors rather than internal intent, forcing staff to stop using client self-report as evidence once objective contradiction is established.

  ### The Decision Procedure

  **Rule 0:** Once Objective Contradiction (Step 1) is met, do not ask the client "Did you know?" or "Why did you do that?" Use only records, collateral, and observed behavior.

  **Step 1: Objective Contradiction**
  *   **Question:** Is there hard data (tox screen, attendance log, collateral report) that contradicts the client's claim?
  *   **No:** Accept the claim as working hypothesis. Provide education if needed. **STOP.**
  *   **Yes:** Proceed to Step 2.

  **Step 2: Information Access**
  *   **Question:** Is there evidence the client physically could not have accessed the contradicting data (e.g., portal down, mail lost, never told)?
  *   **Yes:** **Classification: Genuine Ignorance.** Action: Inform client directly. Document disclosure. **STOP.**
  *   **No:** Proceed to Step 3.

  **Step 3: Active Avoidance**
  *   **Question:** Is there evidence of behavior designed to keep the data unknown or unintegrated (e.g., delegating result pickup, skipping appointments during result release, changing subjects when data is raised)?
  *   **Yes:** **Classification: Strategic Ignorance.** Action: Remove avoidance channel (e.g., mandate in-person result review). Do not argue about the data; argue about the process. **STOP.**
  *   **No:** Proceed to Step 4.

  **Step 4: Behavioral Capacity**
  *   **Question:** Is there verified evidence (last 6 months) of the client successfully doing what they claim they can do (e.g., sustained abstinence, controlled use) without treatment intervention?
  *   **Yes:** **Classification: Goal Dispute (Not Denial).** Action: Stop challenging capacity. Negotiate goals (necessity of treatment vs. self-management). If staff insist on treatment despite verified capacity, **ESCALATE TO LEAD** (Values Call). **STOP.**
  *   **No:** Proceed to Step 5.

  **Step 5: Social Script**
  *   **Question:** Is this claim identical to claims made by peers in group treatment, without independent verification (e.g., multiple clients suddenly claiming same lab error pattern or same minimization script)?
  *   **Yes:** **Classification: Shared Narrative.** Action: Do not confront individually. Address group dynamic. **ESCALATE TO LEAD** (Systemic risk). **STOP.**
  *   **No:** Proceed to Step 6.

  **Step 6: Memory Gap**
  *   **Question:** Is the claim specifically filling a period of documented blackout or fuzzy memory (e.g., "I didn't drink" during a night confirmed by others)?
  *   **Yes:** **Classification: Confabulation.** Action: Safety planning (assume use occurred). Do not argue memory. **STOP.**
  *   **No:** Proceed to Step 7.

  **Step 7: Final Branch (Deception vs. Weakness)**
  *   **Question:** Does the client admit the behavior but claim inability to stop (Weakness), or deny the behavior entirely despite data (Deception)?
  *   **Admits Behavior:** **Classification: Weakness of Will.** Action: Support planning.
  *   **Denies Behavior:** **Classification: Deception.** Action: Confrontation strategy required. **ESCALATE TO LEAD** (Values Call: How hard to lean without causing dropout).

  ---

  ### Case Run-Throughs

  **Case 1: The Positive Screen & The Brother**
  *   **Step 1 (Contradiction):** Yes. Positive screen vs. "Lab mixed up."
  *   **Step 2 (Access):** No. Portal exists.
  *   **Step 3 (Avoidance):** Yes. Client asked brother to pick up results to avoid opening portal.
  *   **Classification:** **Strategic Ignorance.**
  *   **Action:** Do not argue about the lab error. The issue is not the truth, it is the avoidance. Mandate that the client must receive results directly from clinic staff in person.
  *   **Outcome:** Treatment plan change (process constraint). Requires Lead sign-off, but recommendation is clear.

  **Case 2: "I Can Stop Anytime" & The Staff Frustration**
  *   **Step 1 (Contradiction):** No/Partial. Claim is "I *can* stop." Data shows use is down, stopped twice for 3 months. The data does *not* contradict the capacity claim.
  *   **Step 4 (Capacity):** Yes. Verified evidence of stopping for 3 months twice.
  *   **Classification:** **Goal Dispute (Not Denial).**
  *   **Action:** **Stop calling this denial.** The client is telling the truth about capacity. The conflict is that staff believe capacity ≠ safety, while client believes capacity = no problem.
  *   **Uncomfortable Answer:** Your junior staff are wrong. They are pathologizing a accurate self-assessment because it conflicts with the clinic's model of continuous care. Do not push on "admitting powerlessness." Negotiate on risk management. If staff cannot accept this, **ESCALATE TO LEAD**. This is a values call about autonomy vs. paternalism.

  ---

  ### What This Procedure Cannot Do

  1.  **Restore Trust:** It identifies deception but cannot fix the therapeutic alliance damage caused by confronting it.
  2.  **Motivate Change:** It categorizes the barrier (ignorance, avoidance, capacity, values) but does not provide the motivational intervention to overcome it.
  3.  **Resolve Values Conflicts:** When escalated to the Lead as a "Values Call," this procedure does not decide the outcome; it only flags that the disagreement is about treatment philosophy (how hard to lean), not clinical facts.
  4.  **Handle Psychosis:** It assumes rational agency. If the client is psychotic, Step 6 (Confabulation) may look similar but requires medical intervention, not procedural categorization.
  5.  **Predict Dropout:** It tells you when to escalate because confrontation is risky, but it cannot predict if the client will actually leave treatment.
