answer: |-
  Let us call this view **Epistemic Fiduciaryism**. On this account, the competent self does not rule the incompetent self through identity or promise, but acts as a fiduciary agent. Authority is delegated to the earlier self because they possess a comparative epistemic advantage: they know the values at stake and retain the cognitive capacity to weigh them. The later self, lacking capacity, cannot revoke this delegation. However, like any agency relationship, the authority is conditional on the agent acting within the scope of their competence. If the agent is badly mistaken about the facts necessary to exercise that judgment, the mandate lapses.

  Consider the standard hard case: a woman directives refusal of life-prolonging treatment upon severe dementia, predicting misery, but now appears content. Epistemic Fiduciaryism implies we may override her directive. This is not a cost to be mourned but a feature to be embraced. The healthy self's prediction was based on a counterfactual imagination of disability, often colored by ableist prejudice. When the reality contradicts the prediction, the fiduciary has failed their primary duty: to represent the principal's interests based on available evidence. To enforce the directive would be to privilege the healthy self's ignorance over the demented self's lived reality. The view protects the vulnerable later self from the earlier self's speculative errors.

  The obvious objection is that this collapses into a best-interests standard. If authority hinges on predictive accuracy, why isn't this merely welfare maximization with extra steps? The distinction lies in the standard of review. A best-interests model asks, "What outcome is best?" Epistemic Fiduciaryism asks, "Was the agent's reasoning sound at the time of delegation?" We do not simply calculate utility; we audit the earlier self's epistemic position. If the healthy self made a reasonable prediction that turned out wrong due to unforeseeable medical nuance, the directive stands. Authority lapses only when the error stems from negligence or ignorance available at the time. This preserves the earlier self's role as the primary decision-maker, provided they performed their fiduciary duty competently. It respects agency without fetishizing error.

  A deeper worry concerns personal identity. If the psychological-continuity view holds, the healthy self and demented self are barely the same person. Why does the healthy self's information grant authority over another's body? Because delegation does not require identity; it requires capacity to represent. A lawyer need not be their client to advocate for them; they need access to the client's interests and the skill to argue them. The healthy self is not authoritative because they *are* the later self, but because they are the *best available proxy*. They possess the only existing record of the later self's values. Being well-informed matters because it ensures the proxy is translating those values accurately, not imposing foreign ones. The authority is pragmatic, not metaphysical.

  This epistemic framing faces a limit case: directives based on non-predictive values. A woman refuses treatment not because she predicts suffering, but because she believes existing in a demented state is inherently demeaning, regardless of contentment. Is this a factual mistake? Epistemic Fiduciaryism must admit a non-epistemic core here. Normative commitments about dignity are not true or false in the same way predictions are. However, even these commitments rest on factual understandings of what the condition *is*. If she believes dementia entails total unconsciousness, but it entails contented interaction, her application of the value "dignity" is misaligned with the reality. The view governs the *application* of values to facts. If the facts shift, the value's traction may slip. We respect the commitment, but not if it is anchored in a hallucination of the condition it prohibits.

  Finally, consider the social performance of directives. People write them to spare family guilt or signal virtue. Does the view discount this? Yes, by treating the directive as testimony rather than command. If the document is shaped by audience expectations, its epistemic reliability regarding the self's true values is compromised. A fiduciary acting to please third parties breaches their duty to the principal. We weigh the directive less when evidence suggests it was performed for an audience, as the epistemic link between the author's true values and the written instruction is severed.

  Epistemic Fiduciaryism thus reframes advance directives from rigid commands to auditable delegations. It demands we treat the earlier self as a fallible agent whose authority expires when their grasp of reality fails.

  The single premise I would least like to be forced to give up is this: **Authority lapses when the delegate is badly mistaken about the very facts they were supposed to be reasoning from.** Without this, the view collapses into the very absolutism it seeks to correct, protecting the dead hand of the past over the living reality of the present.
