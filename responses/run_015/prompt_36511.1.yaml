      *   **Landauer's Principle:** Erasing 1 bit of information dissipates at least $k_B T \ln 2$ energy.
      *   **Reversible Computing:** Computation where input can be reconstructed from output (bijective). No information loss = no mandatory heat dissipation (theoretically).
      *   **"Information is Physical":** Information isn't abstract; it's encoded in physical states. Manipulating it obeys physical laws.

  3.  **Map to Systems Programming Vocabulary:**
      *   *State:* Register values, heap memory content.
      *   *Operation:* CPU instructions, memory writes.
      *   *Erasure:* Overwriting a register, `memset`, TRIM command, resetting a flag.
      *   *Garbage:* Stale data in free lists, unreachable objects before GC compaction.
      *   *Reversibility:* XOR swap, reversible logic gates (Toffoli), keeping a log of operations.

  4.  **Drafting the Response - Section by Section:**

