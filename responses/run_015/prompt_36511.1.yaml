  *(Self-Correction on the `free()` point)*: I need to be careful here. If I `free()` a block, I am logically discarding the *value* stored there. But physically, the charge remains. Landauer's principle applies when I *reset* that charge to a known state (e.g., all 0s) so I can use it again reliably. If I reuse it without resetting (e.g., just writing new data), the transition from Old Data -> New Data might not incur the full Landauer cost if the operation is logically reversible, but standard CMOS writes are dissipative. The key is: Landauer cost is about *reducing the phase space* of the physical system. Overwriting unknown data with 0 reduces phase space.

  Let's refine the "Information is Physical" part. It's not just "bits need matter." It's "distinguishing 1 from 0 requires an energy barrier." If $k_B T$ is too high, the bit flips spontaneously. So information stability *is* a thermodynamic property.

