  - "I'll let my talents rust and coast on easy pleasures" — fails, but the weak kind: you can describe the world fine, you just couldn't will it
  - "I'll never help anyone unless there's something in it for me" — fails, weak, same as the last one
  - "I'll give correct change because it's good for repeat business" — passes the formula, though she said it has no moral worth
  - "I'll lie to the guy at the door who's looking for my friend" — fails, strong, and she insisted consequences don't get a vote
  - "I'll always do the opposite of whatever everyone else is doing" — fails, her reason being that the maxim stops having any content once everyone acts on it
  - "I'll only ever help people who live on my street" — passes, which suprised people

  Here's the case I can't call. At the hut I stay at there's a shared woodpile and a rule that you only take what you'll burn tonight. But the warden restocks every morning to match whatever got used, and the cost of restocking is split evenly across everyone in the co-op no matter how much wood they personally took, so the pile never runs low and nobody is ever cold. My maxim is: when I don't feel like going out in the morning, I'll quietly take two or three extra logs tonight, more than I'll burn. Nobody goes short, but everyone else in the co-op is paying slightly more so I can skip a trip. Would she say this fails, and if it does, is it the strong kind or the weak kind on her scheme — because it really doesn't seem like either to me. What rules fit her track record, and which further case would definately tell them apart? I was thinking the same maxim at a hut where the warden just chucks out whatever's left at the end of the week, so nobody is paying for my extra logs at all.

  Answer as exactly five numbered points, one or two sentences each, no intro and no concluding line: the rules that fit her verdicts, what each one predicts about my woodpile maxim, your best guess at her verdict, why you'd prefer that guess, and the case that would settle it.
