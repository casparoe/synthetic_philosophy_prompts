answer: |-
  Particularism does not collapse into isolated-judgment foundationalism because moral reasoning operates through a cultivated sensitivity to contextual configurations, allowing for analogical comparison based on overall similarity rather than reliance on invariant universal principles.

  Your worry stems from assuming that for one case to justify another, there must be a stable rule linking them, but particularists argue that moral justification works more like perception or pattern recognition than logical subsumption. When a particularist compares Case A to Case B, they are not extracting a feature from A, asserting a principle that this feature always matters, and then applying it to B; instead, they are discerning that the overall configuration of features in A is relevantly similar to B. The holism of reasons means that a feature like "lying" does not have a fixed moral valence, but it does not mean the feature is random; its contribution is determined by its relationship to other features in the specific context. Therefore, when you move from one case to another, you are not guessing; you are exercising a competence gained through moral experience that allows you to see how features interact in new situations based on how they interacted in past ones.

  This avoids isolated foundationalism because judgments are not epistemic bedrocks that stand alone; they are nodes in a network of comparisons where coherence and similarity do the justificatory work. If you judge that Action X is wrong here, and your partner challenges you, you do not appeal to a principle; you point to the features and invite them to see the same configuration, perhaps by comparing it to a paradigm case where the wrongness is undeniable. If the polarity flips in a new case, you do not need a new principle to explain the flip; you simply point to the difference in context that altered the feature's contribution. Consequently, moral reasoning remains robust and communicable without requiring the crutch of exceptionless principles, as the stability lies in the agent's developed sensitivity to reasons rather than in the external codification of those reasons.
