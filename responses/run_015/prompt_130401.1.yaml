prompt: |-
  I've been arguing with my roommate about whether Norway's Halden prison actually proves rehab works. He keeps saying Halden is basically like a luxury dorm or a hotel -- private rooms, flat-screen TVs, guards wear casual clothes and cook with inmates. He's using this to argue that if you treat prisoners like hotel guests they don't come back, so American mass incarceration is just stupid cruelty. I think the analogy is doing a lot of work he doesn't notice. I read that Halden is designed as a normalized village and the staff practice something called dynamic security, so it's not hospitality at all -- it's a specific form of soft control where the architechtural layout still manages behavior.

  Can you audit the hotel/dorm analogy for me? Give me the correspondence table -- what plays the concierge, the room service, the checkout, the guest versus staff roles, the fact you can't just leave? Then tell me where the mapping breaks, especially on power and coercion: does the analogy quietly import the idea that comfort equals freedom? Separate the disanalogies that actually matter for his conclusion from the ones that are just cosmetic. And if the hotel picture collapses, does his argument about American prisons collapse with it, or is there a better analogy -- maybe a therapeutic community, or a boarding school with mandatory attendance -- that captures what's going on? Also, I might be mixing up the architechtural philosophy with the day-to-day practice, so push back if I'm wrong about the panopticon part or if I'm asking something that doesn't make sense. Don't just dump a reading list -- I want the logic worked out.
