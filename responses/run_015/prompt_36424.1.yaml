      *   **Telic Egalitarian (TE):** Equality is intrinsically good. Leveling down (making the rich poorer without helping the poor) makes the world better *in one respect* (equality), even if worse all-things-considered.
      *   **Prioritarian (P):** Benefits matter more the worse off the recipient is. Equality has no *independent* value. Leveling down is bad all-things-considered and in every respect (unless it helps the worse off, which by definition it doesn't in the pure LDO case).
      *   **The Conflict:** The LDO asks: Is a world where everyone is equal but poorer (for the rich) better *in any respect* than a world where some are rich and some are poor? TE says "Yes (respect: equality)." P says "No."

  3.  **Drafting Section 1: Common Ground (Numbered Claims):**
      *   Need substantive agreement, not vacuous.
