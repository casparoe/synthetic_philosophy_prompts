      *   *Row 2: The Source of Priority.* P: We care about the worse off because of their absolute level + diminishing moral value of welfare. TE: We care because of the *gap* between them and others.
      *   *Row 3: Collapse Worries.* TE worries P collapses into Utilitarianism (if weights are flat) or Egalitarianism (if weights are steep). P worries TE collapses into "spite" (valuing destruction for symmetry).
      *   *Row 4: The "Complaint" Model.* TE: The worse off have a genuine complaint about inequality even if absolute level is high. P: Complaints are only valid based on absolute insufficiency or priority weight, not relative deprivation.

  5.  **Drafting Section 3: Cruxes (Concrete Cases/Predictions):**
      *   Need cases where predictions diverge.
      *   *Crux 1: The "Useless Transfer".* Transfer from Rich to Poor that costs Rich more than Poor gains (efficiency loss), but reduces inequality.
          *   TE: Might still see *some* positive value in the equality gain, offsetting efficiency loss.
          *   P: Strictly negative if priority-weighted gain doesn't outweigh loss.
          *   *Better Crux:* The "Third Party" case mentioned in prompt. Leveling down Rich helps a Third Party (e.g., environmental spillback).
