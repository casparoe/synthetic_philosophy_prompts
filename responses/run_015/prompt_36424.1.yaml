          *   *Case:* The "Blind World". Two groups, unequal welfare. We destroy Rich's welfare to match Poor. No one knows.
          *   TE: Still better in one respect.
          *   P: No value change regarding justice, only less total value.
      *   *Crux 2: The "Overshoot".* Transfer from Rich to Poor makes Poor richer than Rich was.
          *   TE: Inequality returns (inverted). Value goes up then down.
          *   P: Value goes up monotonically (assuming Poor is still below Rich's original level? No, if they swap, priority shifts).
          *   *Let's try the "Slightly Worse Off" case.* Group A (100), Group B (99). Level A down to 99.
          *   TE: Significant equality gain.
          *   P: Negligible priority gain (B is barely worse off), huge loss for A.
      *   *Crux 3: Verbal/Conceptual.* Does "better in one respect" imply "reason to do it"?
          *   TE: Yes, a pro tanto reason.
          *   P: No, it's just a description of a pattern, not a reason.

