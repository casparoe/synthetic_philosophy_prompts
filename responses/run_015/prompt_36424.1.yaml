answer: |-
  # Joint Statement on the Leveling-Down Objection

  **Parties:** Telic Egalitarian (TE) and Prioritarian (P)
  **Scribe:** [Me]

  ### 1. Common Ground
  We agree on the following substantive claims, despite our deeper metaphysical split:

  1.  **Target of the Objection:** The leveling-down objection targets *telic* (outcome-based) egalitarianism. It does not refute *deontic* egalitarianism (claims about rights, duties, or unfair treatment).
  2.  **No Personal Benefit:** In a pure leveling-down case (making the better-off worse off without helping the worse-off), no *individual* is benefited. We agree on this person-affecting fact.
  3.  **All-Things-Considered Verdict:** Leveling down is never all-things-considered better. Neither of us advocates actually destroying welfare to achieve symmetry.
  4.  **Instrumental Bads:** Inequality often causes shame, domination, and power imbalances. These are bad instrumentally. Our dispute is about whether inequality is bad *even when* these instrumental effects are absent.
  5.  **Not Utilitarianism:** Rejecting the leveling-down objection does not force you into utilitarianism. You can reject intrinsic equality without summing welfare linearly (e.g., via sufficiency views or priority weighting).

  ### 2. Disagreements
  We disagree on the structure of value. The table below isolates the specific moves where our views diverge.

  | Issue | Telic Egalitarian (TE) | Prioritarian (P) |
  | :--- | :--- | :--- |
  | **Location of Value** | Value can reside in impersonal states of affairs. A world can be better even if no person is better off. | Value supervenes on individual welfare. If no one is better off, nothing is better. "Impersonal value" is a category error. |
  | **The "One Respect" Claim** | Leveling down makes the world better *in one respect* (equality). This provides a pro tanto reason, even if outweighed. | There is no respect in which leveling down is better. Calling it "better in one respect" is just dressing up a pattern description as value. |
  | **Source of Priority** | We care about the worse-off because of the *gap* between them and others. Relative position drives moral weight. | We care about the worse-off because of their *absolute* level. Benefits matter more at lower levels, regardless of whether others are richer. |
  | **Collapse Worries** | If priority weights aren't steep enough, Prioritarianism collapses into Utilitarianism (ignoring the poor). | If equality is valued independently, Egalitarianism collapses into spite (valuing destruction for symmetry) or becomes insensitive to absolute gains. |

  ### 3. Cruxes
  To move forward, we identified three sub-questions where settling the answer would force at least one of us to budge. We have agreed on concrete cases and recorded our predictions in advance.

  **Crux 1: The Blind World (Impersonal Value)**
  *   **Case:** Two worlds are identical in total welfare and individual histories, except in World A, Group Rich has 100 welfare and Group Poor has 50. In World B, Group Rich is reduced to 50. No one in either world knows the distribution; no shame or domination occurs.
  *   **Question:** Is World B better *in any respect* than World A?
  *   **TE Prediction:** Yes. The pattern of equality adds impersonal value.
  *   **P Prediction:** No. Since no individual welfare changed positively, justice value is identical (or worse in B due to loss).
  *   **Stakes:** If TE concedes B is not better in any respect, telic egalitarianism collapses into instrumentalism. If P concedes B is better, prioritarianism loses its person-affecting constraint.

  **Crux 2: The Verbal Dispute (Reasons vs. Descriptions)**
  *   **Case:** We agree World B (leveled down) is not all-things-considered better. We dispute the phrase "better in one respect."
  *   **Question:** Does "better in one respect" entail "there is some genuine moral reason to bring it about"?
  *   **TE Prediction:** Yes. It generates a pro tanto reason, even if always outweighed by welfare losses.
  *   **P Prediction:** No. It is merely a report that a certain pattern exists. Patterns themselves do not generate reasons; only welfare changes do.
  *   **Stakes:** If this is purely verbal, we should stop arguing about "value" and argue about language. If TE admits it generates no reason, her view loses normative force. If P admits it generates a reason, he smuggles egalitarianism into prioritarianism.

  **Crux 3: The Overshoot Transfer (Relative vs. Absolute)**
  *   **Case:** Group Rich (100 welfare), Group Poor (10 welfare). We transfer resources. The cost to Rich is 20 welfare. The gain to Poor is 30 welfare. Poor ends up at 40, Rich drops to 80. Inequality is reduced but not eliminated.
  *   **Question:** Does the moral value of the transfer depend on whether Poor surpasses Rich's *original* level?
  *   **TE Prediction:** Yes. If Poor surpasses Rich, inequality flips, and the egalitarian value gain diminishes or reverses.
  *   **P Prediction:** No. Value depends only on the weighted welfare gain. As long as Poor gains more (priority-weighted) than Rich loses, value increases monotonically.
  *   **Stakes:** If TE concedes value doesn't dip upon overshooting, she admits relative gaps don't matter. If P concedes value dips, he admits relative positions matter independently of absolute levels.

  ### Signatures

  _____________________ (Telic Egalitarian)

  _____________________ (Prioritarian)

  _____________________ (Scribe)
