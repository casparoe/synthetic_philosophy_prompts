answer: |-
  Here is the specification. It is designed to force a theory to commit to a mechanism rather than hiding behind statistical correlation.

  ### The Desiderata for Letterform Identity & Style

  **1. The Token/Type Distinction**
  *   **Requirement:** The system must distinguish between a specific instance of a glyph (token), a specific shape-variant within a letter (allograph), and the abstract category (type).
  *   **Case:** A handwritten 'a' and a printed 'a' are the same type, different allographs. Two scribbles of the same 'a' are different tokens. Collapsing these prevents the system from learning that one letter can have multiple valid shapes.
  *   **Status:** **Non-Negotiable (NN)**. Without this, you cannot model variation.

  **2. Identity/Style Factorization**
  *   **Requirement:** The representation must separate "what letter this is" from "how this letter is drawn" such that style can be swapped while preserving identity, and identity swapped while preserving style.
  *   **Case:** This is the core of your project. If style and identity are fused, you cannot generate a 'Z' in a style defined only by 'A' and 'B'.
  *   **Status:** **NN**. If a theory cannot conceptually separate these, it fails the primary task.

  **3. Few-Shot Style Extrapolation**
  *   **Requirement:** Given 2–3 examples of a style (e.g., 'A', 'B'), the system must generate a never-before-seen letter (e.g., 'Q') in that style.
  *   **Case:** This rules out simple lookup tables or nearest-neighbor morphing. It forces the system to infer *rules* or *constraints* of the style, not just copy textures.
  *   **Status:** **NN**. This is the functional definition of your project's success.

  **4. Script Agnosticism (No Latin Bias)**
  *   **Requirement:** The theory must work on scripts where topology differs radically (e.g., Arabic cursive, Hangul blocks, Devanagari) without hard-coded priors about "strokes" or "uppercase."
  *   **Case:** A theory relying on "vertical stems" or "closed loops" fails on scripts that don't use them. If it only works on Latin, it's a classifier, not a theory of writing.
  *   **Status:** **NN**. Ensures the theory is about *symbol systems*, not just the Roman alphabet.

  **5. Positional Variant Handling**
  *   **Requirement:** The system must recognize that a letter's shape may change based on its position in a word (initial, medial, final, isolated) without classifying them as different letters.
  *   **Case:** Arabic and Greek handle this explicitly; handwriting does it implicitly (connecting strokes). A rigid template matcher fails here.
  *   **Status:** **NN**. Real writing is contextual.

  **6. Systemic Distinctiveness**
  *   **Requirement:** A generated glyph must be distinct enough from other letters in the *same* style to be readable.
  *   **Case:** A style might make 'O' and 'Q' look identical if not constrained. Identity isn't just internal consistency; it's external contrast within the set.
  *   **Status:** **NN**. Prevents the "style overwrites identity" failure mode.

  **7. Non-Letter Rejection**
  *   **Requirement:** The system must be able to classify a glyph as "not a letter" or "noise" rather than forcing it into the nearest letter category.
  *   **Case:** A smudge, a drawing of a cat, or a mathematical symbol should not be classified as a 'B'. The boundary of the category "Letter" must exist.
  *   **Status:** **NN**. Prevents over-generalization.

  **8. Allograph Grouping**
  *   **Requirement:** The system must group topologically distinct shapes (e.g., single-story 'a' vs. double-story 'a') under the same identity label if the context implies it.
  *   **Case:** Topology alone is insufficient (an 'o' can look like a 'u'). Context and system knowledge must override local geometry.
  *   **Status:** **NN**. Handles the "shaky hand" or "font variant" problem.

  **9. Graded Membership (Ambiguity)**
  *   **Requirement:** The system should output confidence or "goodness-of-fit" scores for ambiguous glyphs, rather than binary yes/no decisions.
  *   **Case:** Humans agree that some handwritten glyphs are "borderline." A theory that demands crisp boundaries contradicts phenomenological reality.
  *   **Status:** **Preference (P)**. Desirable for robustness, but a hard classifier could technically pass the other tests.

  **10. Degraded Input Robustness**
  *   **Requirement:** Recognition must hold under noise, occlusion, or low resolution (the "coarse grid" constraint).
  *   **Case:** Real data is messy. If the system requires perfect vectors to work, it is brittle.
  *   **Status:** **P**. Depends on your application, but critical for the "shaky hand" use case.

  **11. Human Alignment (Ground Truth)**
  *   **Requirement:** When the system disagrees with a competent human reader on identity, the system is wrong (unless the human is demonstrably inconsistent).
  *   **Case:** There is no Platonic 'A'. The category is defined by the community of readers. The spec must anchor to human judgment, not mathematical purity.
  *   **Status:** **NN**. Prevents the system from becoming a self-consistent but useless formalism.

  **12. Structural Explainability**
  *   **Requirement:** The system should be able to point to *why* a glyph is an 'A' (e.g., "it has the apex and crossbar role") rather than just "it is near the 'A' cluster."
  *   **Case:** Debugging style transfer requires knowing which features carry style and which carry identity. Black boxes make this impossible.
  *   **Status:** **P**. Essential for your specific goal of *building* the alphabet, not just classifying it.

  **13. Generative Completeness**
  *   **Requirement:** The generative side must be able to produce *any* letter in the alphabet, not just the ones it was trained on.
  *   **Case:** Discriminative models often have blind spots. A full theory must cover the whole space.
  *   **Status:** **NN** (for the generative module).

  **14. The "27th Letter" Plausibility**
  *   **Requirement:** Given a style, the system should be able to invent a new, plausible glyph that fits the style and the alphabet's systemic constraints, even if it has no identity.
  *   **Case:** This tests if the system understands the *style rules* independently of the *letter inventory*. It proves style is a grammar, not a list.
  *   **Status:** **P** (Generative only). A strong test of style capture.

  **15. Continuous/Discrete Bridge**
  *   **Requirement:** The theory must handle the transition from continuous motor movement (handwriting) to discrete grid representation (fonts) without losing identity.
  *   **Case:** Your project uses a grid, but the "spirit" implies movement. The theory shouldn't break if resolution changes.
  *   **Status:** **P**. Specific to your grid implementation, but important for scaling.

  ---

  ### The Tension: Factorization vs. Entanglement

  **The Pair:** **Requirement #2 (Identity/Style Factorization)** and **Requirement #11 (Human Alignment)**.

  **The Conflict:** You suspect factorization is impossible. You are right, but not for the reason you think. It is not impossible to separate them mathematically; it is impossible to separate them *semantically* in edge cases.
  In some styles, the style *constitutes* the identity. If a style dictates "all letters are single continuous lines," an 'O' might become a spiral and an 'A' might become a loop-with-tail. At a certain point of stylistic distortion, a human reader will say, "That's not an 'A' anymore, that's a scribble," or "That looks more like a '4'."
  To satisfy **Human Alignment**, the system must admit that identity is fragile and can be broken by style. To satisfy **Factorization**, the system must insist identity is robust and style is just a skin.
  **Verdict:** You cannot have perfect factorization *and* perfect human alignment. In extreme styles, the "letter" dissolves. Your system must have a "breakage point" where it admits style has overwritten identity. Most theories fail because they assume factorization holds forever.

  ### The Load-Bearing Requirement

  **The Winner:** **Requirement #3 (Few-Shot Style Extrapolation)**.

  **Why:** This is the filter that kills 90% of candidate theories.
  *   **Template/Pixel Similarity:** Fails immediately. It has no rule for 'Z' if it hasn't seen 'Z'.
  *   **Standard Neural Networks (VAEs/GANs):** Usually fail without massive data. They interpolate between knowns; they struggle to extrapolate rules to unseen categories from 2 examples.
  *   **Stroke/Part Features:** Can fail if the style obliterates the standard parts (e.g., a "blobby" style where 'A' has no distinct strokes).
  *   **Prototype Theory:** Can recognize 'Z', but cannot *draw* 'Z' in the new style without a deformation model that understands the style's grammar.

  This requirement forces the theory to be **generative and rule-based**, not just **discriminative and statistical**. It demands the system understand the *alphabet* as a system, not just a bag of images.

  ### Recognition vs. Generation: Do they need the same theory?

  **No.** They need a shared *representation*, but different *objectives*.

  *   **Recognition** is about **Boundary Drawing**. It needs to carve up the space of all possible shapes into "A", "B", "Not Letter". It can tolerate black-box embeddings if the boundaries are sharp.
  *   **Generation** is about **Constraint Satisfaction**. It needs to know *how* to construct a shape. It cannot use a black box; it needs a constructive grammar (e.g., "place a crossbar here," "apply spikiness to all endpoints").

  **Specific Generative Requirement:** Add **Requirement #14 (The 27th Letter)** to the generative spec only. A discriminative model cannot pass this test by definition. If your theory cannot explain how to make a *new* symbol that fits the style, it hasn't captured the style; it has only memorized the existing letters' textures.

  ### Evaluation of Usual Suspects

  | Theory / Approach | Factorization (#2) | Extrapolation (#3) | Script Agnostic (#4) | Explainability (#12) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Template / Pixel Similarity** | Fail | Fail | Fail | Pass (trivial) | **Dead.** Cannot generalize to unseen letters or styles. |
  | **Stroke & Part Features** | Pass (mostly) | Weak | Weak | Pass | **Fragile.** Breaks when style destroys standard parts (e.g. blobs). |
  | **Prototype + Deformation** | Pass | Weak | Pass | Weak | **Recognition bias.** Good at saying "what", bad at drawing "how". |
  | **Structural Analogy (Letter Spirit)** | Pass | Pass | Pass | Pass | **Strong.** Explicitly targets this spec, but computationally expensive/hard to tune. |
  | **Embedding Space (Neural)** | Weak | Fail | Pass | Fail | **Black Box.** Good at clustering, terrible at controlled generation/rules. |
  | **Probabilistic Graphical Models** | Pass | Pass | Weak | Pass | **Promising.** Handles uncertainty well, but defining the graph structure is the hard part. |
