      *   *The Historian of Indian Philosophy:* They know the *syādvāda* (seven-fold predication) and *naya-vāda*. They will spot anachronisms or misuses of Sanskrit terms. They might worry the user is over-formalizing a soteriological tool into a metaphysical one. They are the ally *if* respected, the executioner *if* the user gets the text wrong.
