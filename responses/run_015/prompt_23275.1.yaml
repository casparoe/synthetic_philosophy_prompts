answer: |-
  This is one of the most subtle and technically important distinctions in the philosophy of language. Both theories aim to solve the Sorites paradox, but they diagnose the problem differently: **Epistemicism** locates the problem in our *knowledge*, while **Supervaluationism** locates it in *meaning*.

  Here is the precise breakdown of how they differ regarding Bivalence and the Law of Excluded Middle (LEM).

  ### 1. The Core Definitions

  To understand the divergence, we must distinguish three logical principles that usually travel together in classical logic:
  1.  **Bivalence:** Every proposition is either True or False. (No truth-value gaps).
  2.  **Law of Excluded Middle (LEM):** For any proposition $P$, the disjunction "$P \lor \neg P$" is True.
  3.  **Truth-Functionality of Disjunction:** "$P \lor Q$" is True if and only if $P$ is True or $Q$ is True.

  In classical logic, (1) entails (2), and (3) links them. The debate is about which of these must be sacrificed to account for vagueness.

  ---

  ### 2. Epistemicism: Bivalence and LEM Both Hold

  **The Theory:**
  Championed by Timothy Williamson, Epistemicism claims that vague predicates (like "is tall" or "is bald") actually have sharp boundaries. There is a specific hair count that separates "bald" from "not bald." The vagueness arises because humans are cognitively incapable of knowing where this boundary lies.

  **Treatment of Bivalence:**
  *   **Status:** **Holds.**
  *   **Explanation:** For any borderline case (e.g., Harry with 5,000 hairs), the proposition "Harry is bald" is determinately **True** or determinately **False**. There is no gap. The world (or the meaning of the word) fixes a precise cut-off.

  **Treatment of LEM:**
  *   **Status:** **Holds.**
  *   **Explanation:** Since "Harry is bald" is either True or False, the disjunction "Harry is bald or Harry is not bald" is trivially True.
  *   **Why?** Because one of the disjuncts *is* true (we just don't know which one). Epistemicism preserves classical logic entirely. The truth of the disjunction is grounded in the truth of one of its parts (preserving Truth-Functionality).

  **The Picture:**
  Imagine a line of men ranging from no hair to full hair. Epistemicism says there is a specific man, $n$, who is bald, and man $n+1$, who is not. We cannot see the line, but the line exists.

  ---

  ### 3. Supervaluationism: LEM Holds, Bivalence Fails

  **The Theory:**
  Championed by Kit Fine and Rosanna Keefe, Supervaluationism claims that vague predicates are semantically incomplete. There is no single sharp boundary. Instead, there are many "admissible precisifications" (ways of making the predicate precise that respect our ordinary usage).

  **Treatment of Bivalence:**
  *   **Status:** **Fails (for borderline cases).**
  *   **Explanation:** Consider Harry (the borderline case).
      *   On some admissible precisifications, "Harry is bald" is **True**.
      *   On other admissible precisifications, "Harry is bald" is **False**.
      *   **Supertruth:** Supervaluationism defines "True" (simpliciter) as **Supertrue** (true on *all* admissible precisifications).
      *   Since "Harry is bald" is not true on all precisifications, it is not Supertrue. Since it is not false on all, it is not Superfalse.
      *   Therefore, the proposition lacks a truth value. **Bivalence is rejected.**

  **Treatment of LEM:**
  *   **Status:** **Holds.**
  *   **Explanation:** This is the crucial technical move. Consider the disjunction: "Harry is bald or Harry is not bald" ($P \lor \neg P$).
      *   Take *any single* admissible precisification. Within that precisification, classical logic applies. So, within that specific model, "$P \lor \neg P$" is **True**.
      *   Since "$P \lor \neg P$" is True in *every* admissible precisification, it is **Supertrue**.
      *   Therefore, the Law of Excluded Middle is valid, even though $P$ itself lacks a truth value.

  **The Crucial Logical Cost:**
  How can "$P \lor \neg P$" be true if neither $P$ nor $\neg P$ is true?
  *   **Supervaluationism sacrifices Truth-Functionality.**
  *   In classical logic, a disjunction is true *because* one of its disjuncts is true.
  *   In Supervaluationism, a disjunction can be Supertrue even if **neither disjunct is Supertrue**. The truth of the complex sentence does not supervene on the truth values of its parts.

  **The Picture:**
  Imagine the line of men again. Supervaluationism says there is a "penumbra" in the middle. Different precisifications draw the line at different spots within that penumbra. Harry falls inside the penumbra. So, some drawings put him in "bald," some in "not bald." But *every* drawing puts him in one or the other.

  ---

  ### 4. Summary of the Difference

  Here is the precise distinction you were looking for regarding how they handle the logic of borderline cases:

  | Feature | Epistemicism | Supervaluationism |
  | :--- | :--- | :--- |
  | **Nature of Vagueness** | Ignorance of a sharp boundary. | Semantic indeterminacy (multiple boundaries). |
  | **Borderline Proposition ($P$)** | True or False (we don't know which). | Neither Supertrue nor Superfalse (Truth-value gap). |
  | **Bivalence** | **Valid.** | **Invalid** (for borderline cases). |
  | **Excluded Middle ($P \lor \neg P$)** | **Valid.** | **Valid.** |
  | **Why is ($P \lor \neg P$) True?** | Because one of $P$ or $\neg P$ is actually True. | Because ($P \lor \neg P$) is True in *every* precisification. |
  | **Truth-Functionality** | **Preserved.** (Disjunction depends on disjuncts). | **Rejected.** (Disjunction can be true while disjuncts are not). |

  ### 5. Why This Matters for Your Argument

  The "precise point" of contention usually rests on whether you are willing to abandon classical logical principles to save intuitive semantics.

  *   **If you side with Epistemicism:** You insist that logic must remain classical (Bivalence and Truth-Functionality must hold). You accept the counter-intuitive metaphysical consequence that there is a magical, unknowable sharp cut-off in nature or language.
  *   **If you side with Supervaluationism:** You insist that semantics must reflect the indeterminacy of usage (Bivalence must fail for borderline cases). You accept the counter-intuitive logical consequence that "P or not-P" can be true even when it is *not* the case that "P is true" and *not* the case that "not-P is true."

  **In short:** Epistemicism saves classical logic by positing hidden precision. Supervaluationism saves semantic indeterminacy by redefining truth (as supertruth), which allows LEM to survive as a global validity while Bivalence fails locally.
