      *   *Epistemicism (Williamson):* Vagueness is ignorance. There *is* a sharp boundary. Bivalence holds. LEM holds. Truth is classical.
      *   *Supervaluationism (Fine, Keefe):* Vagueness is semantic indeterminacy. There are many "precisifications" (admissible sharpenings). A sentence is "supertrue" if true on *all* precisifications. Bivalence fails (for borderline cases). LEM holds (globally/supertruth-wise).
