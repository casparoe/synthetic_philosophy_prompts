answer: |-
  Here is the breakdown. I'm going to treat this as a mechanism design problem: we are trying to minimize social transaction costs while maximizing trust and safety.

  ### Part 1: Candidate Principles (and why I'm killing three of them)

  **Candidate 1: The Pure Externality Principle.**
  *Definition:* Enforce tightly only when a violation imposes physical or economic costs on non-consenting third parties.
  *Verdict:* **Reject.**
  *Why:* It handles the loud music and the dog off-leash perfectly. But it collapses on your citation case. A sloppy citation in a student essay harms no one in the immediate instance. No money is lost, no one is injured. If this were the only principle, you'd have to tolerate the citation error. It also struggles with handwashing; tracing the specific infection path from one unwashed hand to a specific customer is impossible, so under a strict "proven harm" model, you can't enforce it until people are already sick.

  **Candidate 2: The Universalizability Test (Rule-Utilitarianism).**
  *Definition:* Enforce tightly if the system breaks when everyone violates the rule.
  *Verdict:* **Reject.**
  *Why:* This is too blunt. If *everyone* jaywalked at 2am on an empty street, traffic would still flow and nobody would die. If *everyone* drove 10mph over on an empty motorway, the system might actually function fine (see: German Autobahn). Yet you want to punish the citation error even if only one student does it. Universalizability explains why we have rules, but it doesn't explain why we enforce them *contextually*.

  **Candidate 3: The Legibility-Only Principle.**
  *Definition:* Enforce tightly only what can be easily observed by peers (Bystander Legibility).
  *Verdict:* **Reject.**
  *Why:* This saves us from neighborhood harassment, but it forbids the handwashing rule. Kitchen hygiene is the paradigmatic case of a rule that *must* be tight precisely because it is invisible to the consumer. If enforcement relies on legibility, you outsource safety to the customer's ability to inspect, which is inefficient and dangerous.

  **Candidate 4: The Principle of Non-Delegable Risk & Constitutive Integrity.**
  *Definition:* (The Survivor).
  *Verdict:* **Defend.**
  *Why:* This splits the difference between "harm" and "system trust." It distinguishes between rules that are *proxies* for safety (speed limits) and rules that are *constitutive* of the value being produced (citations), while accounting for who bears the risk.

  ---

  ### Part 2: The Defended Principle (Precise Formulation)

  Here is the principle I would defend, refined to handle your specific conflicts.

  **The Principle of Non-Delegable Risk & Constitutive Integrity**

  A social norm or rule should be enforced tightly if and only if it meets **one** of the following two conditions, subject to the **Legibility Constraint**:

  **Condition A (Non-Delegable Risk):** The violation transfers a physical or health risk to others who **cannot reasonably verify or avoid** that risk themselves.
  *   *Motivating Cases:* **Kitchen Handwashing** (customers can't inspect kitchens), **Masking** (public can't see viral load), **Dog Off-Leash** (pedestrians can't assess dog training instantly).
  *   *Why it works:* This solves the "invisible handwashing" problem. Because the beneficiary (the eater) cannot verify the safety, the burden of compliance must be absolute and institutionally enforced, not left to peer monitoring.

  **Condition B (Constitutive Integrity):** The rule is not merely a safety rail, but **constitutes the value** of the good or credential being produced. Violation degrades the signal for all participants, even if the immediate instance is harmless.
  *   *Motivating Cases:* **Student Citations.** A citation isn't a safety proxy; it is the mechanical proof of scholarly debt. If citations become optional based on "harm," the credential (the degree) loses its signaling value. **Queue-Jumping.** The "good" being produced is fair order. Jumping destroys the good itself.
  *   *Why it works:* This explains why you punish the citation but tolerate the speeding. Speeding is a *proxy* for safety; Citations are *the product* of honesty.

  **Condition C (The Proxy Exception):** If a rule is merely a **proxy** for safety (Condition A) and the specific context **visibly negates** the risk, enforcement should be loose.
  *   *Motivating Cases:* **Speeding (10 over, empty)**, **Jaywalking (2am).** The speed limit is a heuristic for "safe stopping distance." If the road is empty, the heuristic is unnecessary. The risk is not non-delegable because the driver can *see* the risk is absent.

  **Constraint 1 (Bystander Legibility):** Informal enforcement (tutting, shaming) is only permissible if the violation is **publicly legible**. Institutional enforcement (fines, firing) is required for **non-legible** high-stakes rules.
  *   *Integration:* This saves your "Bystander Legibility" idea. You can tut at a queue-jumper (visible). You cannot tut at a cook who didn't wash hands (invisible); that requires a health inspector. This prevents neighbors from harassing each other over ambiguous bin rules.

  **Constraint 2 (Sorting Drift):** Rules that no longer satisfy Condition A or B must default to **loose** unless re-justified.
  *   *Integration:* This saves your "Sorting Drift" idea. **Bins/Lawn:** Unless the grass harbors pests (Condition A) or lowers neighborhood value significantly (economic harm), this is drift. It's an aesthetic preference masquerading as a norm. Enforcing it selects for petty compliance, not social value.

  ---

  ### Part 3: Verdicts on New Cases

  **1. Mandatory Cameras-On for Internal Remote Meetings.**
  *   **Verdict:** **Loose (Do Not Enforce).**
  *   **Reasoning:** Fails Condition A and B.
      *   *Risk:* No physical risk to others if cameras are off.
      *   *Constitutive:* The value of the meeting is information transfer or decision-making, not visual performance. Cameras are a *proxy* for attention, but a poor one (you can stare at a screen and zone out).
      *   *Drift:* This is a classic case of "sorting drift"—mimicking office presence without the function. It selects for people with good backgrounds/lighting, not good engineers.

  **2. Households Required to Clear Snow from Pavement.**
  *   **Verdict:** **Tight (Enforce).**
  *   **Reasoning:** Meets Condition A (Non-Delegable Risk).
      *   *Risk:* An icy sidewalk is a physical hazard to pedestrians.
      *   *Avoidability:* Pedestrians often cannot avoid the sidewalk (no other path). They cannot verify the ice under the snow.
      *   *Legibility:* The violation is visible (snow pile), so informal enforcement works, but institutional fines are justified because the risk (broken hip) is high.

  **3. Using Phone in a Hospital Waiting Room.**
  *   **Verdict:** **Tight (Enforce/Moderate).**
  *   **Reasoning:** Meets Condition A (Non-Delegable Risk/Nuisance).
      *   *Risk:* Not physical, but psychological/physiological. Patients are in high-stress, vulnerable states. Noise imposes a cortisol cost they cannot avoid (they are waiting for care).
      *   *Avoidability:* They cannot leave the waiting room.
      *   *Legibility:* Highly visible/audible.

  ---

  ### Part 4: The Honest Mismatch (Where I Overturn Your Verdict)

  Your principle is strong, but there is one case where your intuition conflicts with the mechanism, and one where my principle bites back.

  **1. The Case My Principle Can't Save: Dress Codes (Shop Floor).**
  *   *Your Verdict:* Enforce mildly.
  *   *My Analysis:* This is the weakest link. Unless the dress code is safety gear (Condition A) or brand uniformity is the actual product (e.g., luxury hotel staff), this is **Sorting Drift**. Enforcing dress codes on shop floor staff usually selects for conformity, not competence. My principle suggests this should be **Loose**, unless you can argue that "professional appearance" is a constitutive part of the service value (Condition B). If it's just "we've always done it," my principle kills it.

  **2. The Verdict I Would Overturn: Speeding (10 over on empty motorway).**
  *   *Your Verdict:* Tolerate.
  *   *My Overturn:* **Enforce (but with discretion).**
  *   *Why:* You classify this as a "Proxy Exception" (Condition C). I argue that speed limits are not just safety proxies; they are **Focal Points for Coordination**.
  *   *Game Theory:* If enforcement tolerates "10 over when empty," the focal point shifts. Drivers are terrible at judging "empty" and "safe margin." Tolerating 10 over normalizes 15, which normalizes 20. The cost of verifying "is this road actually empty enough for 80mph?" is higher than the cost of just following the limit.
  *   *Correction:* The rule should be tight to maintain the focal point, but the *penalty* should be low (a warning) for minor deviations. You tolerate the *driver*, but you don't tolerate the *violation* as a norm. If you normalize the violation, you degrade the coordination mechanism.

  ---

  ### Part 5: Building in Your Half-Baked Ideas

  You were right to be suspicious of these, but they are actually critical components of the mechanism.

  **1. Bystander Legibility (Refined).**
  *   *Status:* **Built In as Constraint 1.**
  *   *Refinement:* You asked if legibility constrains informal vs. institutional enforcement. **Yes.**
  *   *Mechanism:* If a rule is high-stakes but low-legibility (Handwashing), informal enforcement is forbidden because it leads to false positives (accusing cooks without proof). Only institutional enforcement (swab tests, inspections) is permitted. If a rule is high-legibility (Queue-jumping), informal enforcement is permitted because the error cost of a false accusation is low (everyone can see the line).
  *   *Why this matters:* It prevents the "snitch society" problem. You can't ask neighbors to enforce handwashing, but you can ask them to enforce noise.

  **2. Sorting Drift (Refined).**
  *   *Status:* **Built In as Constraint 2.**
  *   *Refinement:* This is your "Sunset Clause" for norms.
  *   *Mechanism:* Any norm that relies on Condition A (Risk) must be periodically tested against current technology/context.
  *   *Example:* **Bins on wrong day.** Historically, this attracted vermin (Condition A). With sealed plastic bins, this risk is negligible. Therefore, the norm has drifted into "signaling loyalty to the HOA." Under my principle, enforcement should drop to zero. The "kind of person" who enforces this is punishing signaling failures, not actual harm.
  *   *Why this matters:* It stops bureaucracy from becoming self-perpetuating. If you can't re-justify the rule via Risk or Integrity, it defaults to Loose.

  ### Summary
  Your intuition on **Citations vs. Speeding** was the key. Citations are *constitutive* (the rule is the point); Speeding limits are *proxies* (safety is the point). Your intuition on **Handwashing** was the second key: Invisible risks require Institutional Enforcement, not Peer Enforcement.

  Combine those, add a sunset clause for old rules, and you have a system that is tight where it counts (safety, integrity) and loose where it matters (aesthetics, coordination proxies).
