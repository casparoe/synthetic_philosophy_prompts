prompt: |-
  my friend who's deep into philosophy podcasts explained Mary's room to me the other day and I mostly believed her, but I want a sanity check on whether she's a reliable source before I take her word on other stuff too. Here's what she told me, as close to verbatim as I can manage:

  "So there's this famous thought experiment from Frank Jackson in the 80s. Mary is a vision scientist raised in a black-and-white room, and she's mastered neuroscience completely — she knows every physical fact there is to know about how color vision works, down to the last synapse. One day she walks out and sees a red tomato for the first time. And in that moment she learns something new: what red actually looks like. But wait — if physicalism is true, she already knew all the facts, since all facts are physical facts. So physicalism is false. Jackson took this to prove that qualia are nonphysical properties. And here's the kicker: he later admitted the argument doesn't work, which basically everyone agrees was the right call, because the obvious reply is that Mary didn't learn any new fact at all — she just gained a new ability, same as when you learn to ride a bike. Case closed, argument refuted."

  So: how fair is this as a summary? Go through it bit by bit and tell me what a philosopher of mind working on this would accept, what they'd call a simplification, and what they'd flat out correct. I'm especially curious about a few things: whether "knows every physical fact about color vision" is the same claim as the one the argument actually needs; whether the conclusion is really that physicalism is false / qualia are nonphysical, or something weaker that's getting dressed up; and whether the ride-a-bike reply is the settled answer she's making it out to be or just one move in a fight that's still going. Also, what does Jackson's recantation actually count for — does the author changing his mind settle anything here?

  One thing I want you to be careful about: please separate what's genuinely settled among people who know this literature from what's still contested, and don't present the contested stuff as consensus even though my friend did exactly that. If part of her summary is fine as far as it goes but hides a live debate, say that explicitly. And tell me whether her overall takeaway ("case closed, argument refuted") follows from the accurate parts alone, or whether she's leaning on the sketchy bits to get there. I'd also take a short note at the end on which of her specific claims most changed how I should think about the whole thing, since I'd sort of been taking the "refuted" framing as gospel.
