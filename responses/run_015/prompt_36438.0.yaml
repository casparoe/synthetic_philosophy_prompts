answer: |-
  This is a great request. It allows us to separate the *history* of the argument from the *current state of play* in philosophy of mind.

  Here is the short version: Your friend is **highly reliable on the setup and history**, but **unreliable on the current consensus and the conclusion.** She has presented a live, heated debate as a settled matter. If she treats other contested philosophical issues as "case closed," you should treat her future summaries with skepticism.

  Here is the bit-by-bit breakdown, followed by the specific nuances you asked about.

  ### Part 1: Bit-by-Bit Fact Check

  **1. "Famous thought experiment from Frank Jackson in the 80s."**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** Frank Jackson published "Epiphenomenal Qualia" in 1982 and "What Mary Didn't Know" in 1986. It is indeed one of the most famous arguments in modern philosophy.

  **2. "Mary is a vision scientist raised in a black-and-white room... knows every physical fact... down to the last synapse."**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This is the correct setup. The stipulation is crucial: she isn't just an expert; she knows *all* the physical information. This is required to make the argument work against physicalism.

  **3. "One day she walks out... sees a red tomato... learns something new: what red actually looks like."**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This relies on the reader's intuition. Most people agree Mary learns *something*. The debate is about *what* that something is (a fact? a skill? a new concept?).

  **4. "If physicalism is true, she already knew all the facts... So physicalism is false. Jackson took this to prove that qualia are nonphysical properties."**
  *   **Verdict:** **Accurate (to Jackson's original view).**
  *   **Nuance:** This correctly summarizes the "Knowledge Argument." Jackson originally argued that because there is a fact Mary didn't know (what it's like to see red), and she knew all physical facts, there must be non-physical facts. This implies property dualism (qualia are non-physical).

  **5. "He later admitted the argument doesn't work, which basically everyone agrees was the right call..."**
  *   **Verdict:** **Misleading / False.**
  *   **Correction:** Jackson *did* change his mind (around 2003), but claiming "basically everyone agrees" is a massive overstatement. Many prominent philosophers (like David Chalmers) still maintain the argument is sound and that physicalism is false. Jackson changing his mind is data, not a verdict.

  **6. "...because the obvious reply is that Mary didn't learn any new fact at all — she just gained a new ability, same as when you learn to ride a bike."**
  *   **Verdict:** **Contested.**
  *   **Correction:** This is known as the **Ability Hypothesis** (championed by David Lewis and Laurence Nemirow). It is *a* major physicalist response, but it is not *the* definitive response. Many philosophers argue that knowing "what it's like" is genuinely propositional knowledge (knowledge of a fact), not just a skill.

  **7. "Case closed, argument refuted."**
  *   **Verdict:** **False.**
  *   **Correction:** The Knowledge Argument is still considered one of the strongest arguments *against* physicalism. It is definitely not "case closed."

  ---

  ### Part 2: Addressing Your Specific Questions

  #### 1. Is "knows every physical fact" the claim the argument actually needs?
  **Yes.** This is the linchpin. Physicalism is the view that everything in the world is physical, and therefore all information is physical information. If Mary knows *all* the physical facts, a physicalist must commit to the claim that she knows *all* the facts. If she leaves the room and learns something new, physicalism implies a contradiction. Your friend got this premise right.

  #### 2. Is the conclusion really that physicalism is false / qualia are nonphysical?
  **Originally, yes. Now, it's complicated.**
  *   **Jackson (1982):** Yes, the conclusion was that physicalism is false and qualia are non-physical properties (specifically, he argued for epiphenomenalism).
  *   **Jackson (2003+):** He changed his mind. He adopted a view called **Representationalism** (specifically the Phenomenal Concept Strategy). He argued that Mary *does* learn something new, but it's not a new *fact about the world*; it's a new *way of representing* the old physical fact.
  *   **Current Field:** Some philosophers accept Jackson's original conclusion (Physicalism is false). Others accept his later view (Physicalism is true, but our concepts are tricky). Others use the Ability Hypothesis. There is no single agreed-upon conclusion other than "this is a hard problem."

  #### 3. Is the "ride-a-bike" reply (Ability Hypothesis) the settled answer?
  **No.** It is one move in a fight that is absolutely still going.
  The Ability Hypothesis says "knowing what it's like" is just knowing how to imagine, recognize, or remember the experience.
  *   **The Counter-Argument:** Many philosophers argue that to recognize red, you must already know what red looks like. Therefore, the ability presupposes the knowledge, so the knowledge must come first. If the knowledge comes first, it's not just an ability.
  *   **Status:** This is a live debate. Presenting it as the "obvious reply" that settles the issue is inaccurate.

  #### 4. What does Jackson's recantation actually count for?
  **It counts for very little regarding "truth," but a lot regarding "dialectic."**
  *   **Does it settle anything?** No. In philosophy, an author changing their mind does not refute an argument. It just means one prominent proponent was persuaded by counter-arguments. Other prominent proponents (like David Chalmers) were *not* persuaded.
  *   **Why it matters:** It showed that physicalists *could* find a way to accommodate the intuition without abandoning physicalism. It shifted the burden of proof slightly, but it did not "close the case."

  ---

  ### Part 3: Consensus vs. Contest (The Reliability Check)

  This is the most critical part for your evaluation of your friend.

  **What is Settled (Consensus):**
  *   The Knowledge Argument is a valid logical structure (if you accept the premises, the conclusion follows).
  *   The intuition that Mary learns *something* is widely shared.
  *   Physicalists *must* explain away Mary's new knowledge to maintain their view.

  **What is Contested (Live Debate):**
  *   **Whether Mary learns a new *fact*:** Dualists say yes; Physicalists say no.
  *   **Whether Physicalism is false:** Roughly half the field thinks the argument proves physicalism false; the other half thinks physicalism can survive it.
  *   **Which Physicalist strategy works:** The Ability Hypothesis, the Phenomenal Concept Strategy, and Illusionism are all competing explanations. None have "won."

  **Your Friend's Error:**
  She presented a **contested** outcome as a **settled** one. She conflated "Jackson changed his mind" with "The argument was refuted." These are not the same thing. An argument can be sound even if its creator stops believing in it (perhaps due to pressure from peers or a shift in their own metaphysical preferences).

  ### Part 4: Verdict on Your Friend's Reliability

  **Is she a reliable source?**
  *   **On History/Setup:** **Yes.** She knows the text and the basic plot of the argument.
  *   **On Current Status/Consensus:** **No.** She has a tendency to present her preferred resolution (or the resolution she heard most recently) as the final word.
  *   **Overall:** She is a good source for *what people have said*, but a poor source for *what the current state of the debate is*. She simplifies complex, unresolved metaphysical disputes into "Case closed."

  If she tells you, "Philosophers agree that X is true," regarding any major topic (free will, ethics, consciousness), you should verify that claim. She seems to prefer narrative closure over philosophical ambiguity.

  ### Part 5: The One Thing That Should Change Your View

  You asked for a note on which specific claim most changes how you should think about the whole thing.

  **The Claim:** *"Case closed, argument refuted."*

  **Why it matters:**
  You mentioned you had been taking the "refuted" framing as gospel. You should discard that immediately. The Mary's Room argument is not a zombie argument that was killed in the 90s; it is arguably **the** central pillar of the modern "Hard Problem of Consciousness."

  If the argument were truly "refuted" by the Ability Hypothesis, the last 30 years of philosophy of mind would look very different. Instead, the literature is filled with sophisticated attempts to save physicalism *because* the Knowledge Argument is still considered such a potent threat.

  **Takeaway:** The argument succeeded in its main goal: it forced physicalists to work much harder to explain consciousness. Whether it actually *proved* physicalism false is still unknown. Your friend gave you the history of the battle, but told you the war is over when it is still being fought.
