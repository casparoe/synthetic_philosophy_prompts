  Can art transmitting despair serve universal brotherhood, or must the emotion be positive? If despair unites us, isn't it raw affect rather than represented narrative doing the moral work, suggesting content is irrelevant to union?

  Is professional technique without sincere feeling redeemable if it accidentally produces real infection in viewers? If technique alone triggers infection, doesn't that sever the link between represented sincerity and transmission, proving feeling bypasses intent?

  Does defining art by infection and infection by moral effect render the theory unfalsifiable? If we locate infection in pre-representational affect, does the moral criterion become observable rather than circular, avoiding tautology?

  Regarding works Tolstoy dismissed that now infect later audiences, does this show the moral effect is historically indexed? Does this lag suggest feeling persists while representational context decays, proving content is secondary to the affective charge?

  Consider a silent installation engineered through rhythm and light inducing collective grief despite the creator reporting only technical satisfaction. If light induces grief without representation, doesn't this confirm feeling bypasses content entirely, validating non-representational transmission as art?

  Should a poem transmitting the same feeling as a symphony but with ambiguous moral content be ranked lower? If ambiguity blocks moral ranking but not infection, isn't representation the obstacle rather than the feeling itself, requiring we discard semantic loading?

  If infection requires the artist's prior sincere feeling, how can she know she has succeeded before transmission occurs? If introspection reveals feeling before transmission, doesn't that make the representational vehicle merely contingent, undermining encoded meaning?
