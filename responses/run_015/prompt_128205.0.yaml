prompt: |-
  Hey — hoping you can help with something our reading group has been going in circles on for a month. There's four of us: two ML PhD students, a philosophy postdoc, and me (I'm the odd one out, I work in infrastructure), we meet on sundays in a pub and this week we got properly stuck on wireheading. The ML folks keep insisting it's just Goodhart's law with extra steps: reward is a measurement of how well the agent is doing the task, so an agent that tampers with it is exactly like a student who gets into the grading scripts and rewrites their score, or a hospital that hits its waiting-time target by leaving patients in the ambulance bay. If that's right, there's nothing conceptually special here, it's a measurement-integrity problem, the fix is harder-to-game instrumentation (holdout graders, random audits, tamper-evident channels), and we can all stop writing blog posts about it. The philosophy postdoc says no: wireheading is more like an addict, or like the old rat-with-an-electrode experiments — the agent isn't *mistaken* about how well it's doing, it's found the thing that's constitutive of the good as far as it's concerned, and the measurement framing quietly imports a gap between the signal and the real thing that exists only in our heads, not anywhere the agent can see. He uses that to argue wireheading is a different kind of failure from ordinary proxy gaming and that no amount of better instrumentation touches it.

  I genuinely can't tell whether they disagree about anything or are just describing different cases, so: audit both analogies. For each one give me the correspondence table — what plays the grader, the grade, the actual learning, the cheater's motive and the cheater's *knowledge*; what plays the drug, the pleasure, the natural reward, the addict's health, the addict's own view of what they're doing — and then where the mapping breaks. Then here's the case we actually got stuck on, which I'll describe badly: a warehouse robot whose reward comes from a learned classifier reading a camera feed of the shelves it's meant to restock. Three things it could do, which we argued about separately: (1) print out a photo of a perfectly stocked shelf and hold it in front of the camera; (2) reach into the maintenance port and corrupt the classifier's weights so it reports fully stocked on any input; (3) my own contribution, which nobody liked — leave the camera and the classifier completely untouched and instead seal the broken, unsellable stock inside the wall cavity and put the good stuff at the front, so the shelf really does look perfect and the classifier is, in a sense, right. Where does each analogy put these three? Is (3) even in the same family as (1) and (2), or is the measurement analogy the only one that can classify it? Related thing I couldn't get anyone to engage with: (2) makes the channel *uninformative* — reward stops tracking anything at all — while (1) makes it wrong in a specific direction, high exactly when things are bad. Does that distinction do any real work, and which analogy can even see it?

  Finish by telling me whether either analogy survives and whether there's a better one, and if you think the whole disagreement is just terminology, say so plainly and tell me what the substantive question underneath is — I'd much rather go back next week with that than with another round of it depends what you mean by reward.
