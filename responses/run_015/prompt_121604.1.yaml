  The single principle that separates your "okay" idealizations from the "bad" ones is the **Causal Relevance Principle** (sometimes called the *Mechanism Principle*).

  **The Principle:** An assumption is permissible if and only if the feature being idealized away is **causally irrelevant** to the specific phenomenon being explained. You can lie about $X$ to explain $Y$ only if $Y$ does not depend on the specific details of $X$ that you are lying about.

  ### 1. The Economist Case
  **Verdict: Not Okay.**

  **Reasoning:** This case fails the Causal Relevance test in the same way your "Macro/Panic" and "Physics/Tides" cases do.
  *   **The Phenomenon:** Differential adaptation speeds (why some firms change fast and others slow).
  *   **The Mechanism:** Adaptation speed is inherently an *internal* property. It depends on organizational structure, culture, decision-making hierarchies, and internal friction.
  *   **The Model:** Treats firms as "black boxes" with *no* internal structure.
  *   **The Conflict:** You are using a model that explicitly assumes away the very mechanism (internal structure) that causes the outcome you are trying to explain. A black box cannot have a "speed" of internal processing; it only has an input-output function. To explain variance in adaptation, you need variance in internal structure.

  ### 2. The Pair That Has to Go
  To keep the principle **simple** (specifically, to avoid making it dependent on complex, domain-specific knowledge about "thresholds" vs. "rates"), the pair of verdicts that creates the most tension is:

  **Biologists (Smooth DE/Populations) [Okay]** vs. **Sociologists (Smooth DE/Opinion) [Not Okay]**

  **Why this pair?**
  These two cases use the **exact same mathematical idealization**: the *continuum limit*. Both take discrete individuals (animals or people) and model them as continuous fluid-like fields using differential equations. Both deal with large $N$ (millions of individuals/nodes).

  *   **If you want a Simple Principle based on Method:** "Continuous approximations are valid for large populations."
      *   Then **both must be Okay**. (You would have to reject your Soc verdict).
  *   **If you want a Simple Principle based on Ontology:** "Discrete agents cannot be modeled as continuous fields."
      *   Then **both must be Not Okay**. (You would have to reject your Bio verdict).

  **Why your current verdicts make the principle complex:**
  To justify keeping Bio as "Okay" and Soc as "Not Okay," your principle stops being simple and becomes: *"Continuous approximations are valid for large populations, **unless** the agents have hard behavioral thresholds that create phase transitions, in which case discreteness matters."*

  That is a *correct* principle, but it is not *simple*—it requires you to know the specific causal mechanisms of the field (biology vs. sociology) to judge the math. If you want a principle that relies only on the *structure of the model* (which is simpler), you cannot treat these two cases differently. One of those verdicts must flip to align with the other.
