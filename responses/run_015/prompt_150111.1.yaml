answer: |-
  ### Specification of Adequacy for Distributed Personal Identity

  To count as successful, a theory of trans-brain or distributed personal identity must satisfy a rigorous set of explanatory demands, preserve key conceptual distinctions, and remain consistent with empirical constraints. The following specification outlines the necessary conditions for adequacy.

  #### I. Phenomena Requiring Explanation

  A viable theory must account for three specific phenomenological and functional features that arise when the self is decoupled from a single biological substrate.

  **1. First-Person Authority Under Concurrent Instantiation**
  If a self-pattern is instantiated in two brains simultaneously, the theory must explain the status of privileged access. In standard cases, only I feel my pain; no one else has this access. In a distributed case, if Host A and Host B both instantiate "me," do they share a single stream of consciousness, or do they diverge into two distinct first-person perspectives? The theory must explain why, upon divergence, Host A does not feel Host B's pain despite both hosting the same identity pattern. It must resolve whether authority splits, duplicates, or remains singular despite physical distribution.

  **2. Continuity of Autobiographical Memory with External Hosting**
  The theory must explain how autobiographical memory retains its status as *mine* when the storage medium or retrieval process is partly external or hosted in another brain. If I recall an event by accessing a trace stored in your neural architecture, what guarantees that this memory is not merely known by me, but *owned* by me? The account must specify the mechanism of ownership that persists across substrate boundaries without collapsing into mere information access (knowing *that* I did X) versus genuine recollection (remembering *doing* X).

  **3. Interstitial Agency**
  The theory must address authorship in cases of distributed decision-making. If a decision emerges from the coupled dynamics of two brains—where neither brain possesses sufficient causal power to trigger the action alone, but the combined system does—who is the agent? The theory must distinguish between a collective "we" acting together and a distributed "I" acting alone. It must provide criteria for attributing responsibility and intentionality to the distributed pattern rather than to the individual hosts or the collective unit.

  #### II. Distinctions to Be Preserved

  A successful account must maintain conceptual boundaries that prevent the collapse of identity into similarity or mere causal connection.

  **1. Pattern-Continuity vs. Biological-Continuity**
  *   **The Distinction:** The theory must clarify whether identity follows the structural/functional arrangement of information (pattern) or the spatio-temporal continuity of the living organism (biology).
  *   **Motivating Case:** Consider a "soul-shard" scenario where a detailed pattern of a person is induced in another brain while the original remains intact. If identity is biological, the copy is a stranger; if pattern-based, the copy is me. The theory must justify why one continuity metric overrides the other, particularly when they diverge.

  **2. Shared Experience vs. Merged Identity**
  *   **The Distinction:** The theory must distinguish between two entities having access to the same mental states (shared experience) and two entities constituting a single person (merged identity).
  *   **Motivating Case:** High-bandwidth brain-computer interfaces might allow two people to feel each other's sensations or access each other's thoughts. This creates epistemic overlap but does not necessarily ontological unity. The theory must explain why high-fidelity sharing does not automatically entail that there is now only one person present.

  **3. Possessing a Self vs. Possessing the Same Kind or Degree of Self**
  *   **The Distinction:** The theory must differentiate between the binary question of whether a system has a self at all and the graded question of whether that self is fully robust or degraded.
  *   **Motivating Case:** In gradual uploading or fading qualia scenarios, a distributed system might function identically to a human but lack full phenomenal depth. The theory must avoid treating a diminished or partial instantiation of a pattern as equivalent to a full person, preventing the inflation of identity claims where functional capacity outstrips ontological status.

  #### III. Scientific Consistency and Joint Tensions

  The theory must remain consistent with established findings in cognitive science while acknowledging internal tensions within the desiderata themselves.

  **1. Empirical Constraints**
  *   **Split-Brain Research:** The account must accommodate findings that severing the corpus callosum can result in two distinct centers of consciousness within one skull. This suggests that biological unity is not sufficient for personal unity, supporting distributed models, but it also suggests that functional integration is required for a unified "I."
  *   **Extended Cognition:** The theory must align with the hypothesis that cognitive processes (like memory storage) can extend beyond the skull (e.g., Otto's notebook). However, it must explain why extending memory does not automatically extend the *self* to include the notebook, drawing a line between cognitive coupling and personal identity.

  **2. Jointly Unsatisfiable Desiderata**
  There is a strong tension between **First-Person Authority** and **Full Pattern Duplication**.
  *   **The Conflict:** First-person authority implies a unique, non-transferable perspective (only I feel my pain). Full pattern duplication implies that if the relevant structure is copied, the perspective is copied. If two brains host the identical self-pattern, both should claim first-person authority. However, if they are numerically distinct physical systems, they cannot share the *same* singular perspective without violating the privacy of experience.
  *   **The Flag:** A theory likely cannot preserve the uniqueness of the first-person perspective while allowing for perfect concurrent instantiation of the identity pattern across distinct substrates. One desideratum must be relaxed: either authority is not unique (leading to a multiplicity of "me"s), or pattern duplication does not preserve identity (leading to a copy theory).

  #### IV. The Eliminating Requirement

  The single requirement likely to eliminate the largest number of popular theories is the **Non-Branching Constraint on Phenomenal Ownership**.

  *   **Explanation:** Most psychological continuity theories (including pattern-based views) allow for fission: if I am copied into two bodies, both are psychologically continuous with me. However, phenomenally, I cannot become two distinct streams of consciousness. From the inside, identity feels singular and non-branching. A theory that allows concurrent instantiation must explain why the first-person perspective does not split. If it admits splitting, it fails to capture the essence of what it feels like to be an "I." If it denies splitting, it must explain how one perspective inhabits two locations without becoming two perspectives. Most theories fail here because they treat identity as a third-person relation (continuity) rather than a first-person fact (ownership).

  #### V. Brief Evaluation of Candidate Views

  **1. Hofstadter's Pattern-Persistence View**
  *   **Score:** Fails on First-Person Authority.
  *   **Analysis:** Successfully explains Pattern-Continuity and Interstitial Agency by treating the self as a flexible symbol system. However, it collapses Shared Experience into Merged Identity; if the pattern is the person, any host running the pattern is the person, making it impossible to explain why two concurrent hosts do not share a single phenomenal field. It violates the Non-Branching Constraint.

  **2. Standard Biological-Continuity Account (Animalism)**
  *   **Score:** Fails on Distributed Phenomena.
  *   **Analysis:** Preserves First-Person Authority and the distinction between Shared Experience and Merged Identity robustly. However, it cannot explain Interstitial Agency or Memory Continuity in distributed cases by definition; it denies the premise that a self can be distributed. It scores high on scientific consistency with organismal biology but fails the primary explanatory task of the seminar.

  **3. Functionalist Alternative (Computational State Identity)**
  *   **Score:** Fails on Possessing a Self vs. Degree of Self.
  *   **Analysis:** Handles Pattern-Continuity and Extended Cognition well. It struggles with the distinction between possessing a self and possessing the same degree of self; functionalism often treats functional isomorphism as sufficient for full identity, ignoring potential phenomenal degradation in distributed systems. It also faces the Joint Tension regarding First-Person Authority, typically resolving it by denying the significance of phenomenal uniqueness.
