prompt: |-
  hey — i'm taking a judgment & decision-making course this term and i'm also the person who writes the budget for my student society. We run six or seven events a year (a careers-fair type thing, a couple of socials, a conference, a few one-offs), and every one needs a projected attendance number and a cost estimate that the student union finance comittee signs off on. The committee is five undergrads who have never heard of any of this. If we overrun by more than about 15% we eat it out of next term's allocation, and if we underspend badly they cut our budget, so both directions hurt a bit. I've got maybe half an hour per proposal, a spreadsheet, and my memory of what past events actually cost.

  So: can you turn the inside view / outside view stuff into a procedure I can actually run? Not "be aware of the planning fallacy" — I want the ordered questions, what counts as a good enough answer to each one, where the procedure says stop and don't commit the money, and where it has to hand the decision back to the committee because it's a values call rather than an estimation call. Remember the people signing off are 19 to 21 and have no stats, so no step can need more than a spreadsheet.

  The bits I keep getting stuck on, which I want the procedure to actually handle rather than hand-wave:

  - I build the bottom-up number first (venue, catering per head, ticket sales as a percentage of last time, sponsorship I'm "pretty sure" about) and then I go looking for a reference class — which means I can basically shop for whichever class gives me the answer I already wanted. How does the procedure stop me doing that? Do I have to commit to the class before I'm allowed to do the bottom-up estimate?
  - Some line items obviously have base rates and some don't. Catering cost per head: years of data. "Will this speaker actually draw 200 people": nothing. Do I regress the total or the components? Regressing the whole total feels like it throws away the information I genuinely do have.
  - Our reference class is only the events we actually ran, and we only ran the ones we felt good about after doing exactly this kind of optimistic planning. I've argued myself into both "so the base rate is too rosy" and "so the base rate is fine, because the filter operating on the class is the same filter operating on me now." Which is it, or what would I have to check to tell?
  - Do the events we proposed and then quietly didn't run go in the class?
  - When am I allowed to shift off the base rate because this case is genuinely different, and what makes that a legitimate reason instead of a rationalization? Does it have to be a mechanism I state out loud in advance and can score afterwards, and what do I do with a reason I only thought of after seeing the outside-view number?

  Then run it on three of next term's proposals: (1) the careers fair, which we've now run four times and where I have a specific, nameable reason to expect slightly above our average; (2) a two-day hackathon we've never done, where the only reference class I can build is other societies' published budgets, which I strongly suspect are the numbers they *planned* rather than what they spent; and (3) the conference, which is the event everyone loves, that I've already half-promised to people, and which I want you to apply the procedure to straight — even if the honest answer is that we should run it at half the capacity, with a much bigger contingency than I want to ask for, or not this year. I'd rather hear that from the procedure in October than find out in March.

  Also: be clear about what this procedure can't do — the cases where it's silent or where it's really just my own judgement with a spreadsheet costume on — and tell me which steps are judgement calls dressed up as procedure. And say what would change your mind about the procedure itself: where is your reasoning most likely to fail, and is there anything about how we operate that, if I told you, would make you say "actually, just use your inside view here"?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Student society budget officer, taking a Judgment & Decision-Making (JDM) course.
      *   **Task:** Create a budget approval procedure for 6-7 events/year.
      *   **Constraints:**
          *   Approval committee: 5 undergrads (19-21 yo), no stats background.
          *   Time limit: ~30 mins per proposal.
          *   Tools: Spreadsheet, memory of past costs.
          *   Stakes: >15% overrun = penalty (cut next term); bad underspend = cut budget. Need accuracy.
          *   Cognitive Biases: Planning fallacy, confirmation bias (shopping for reference classes), optimism bias.
      *   **Specific Pain Points:**
          *   Order of operations (Inside vs. Outside View).
          *   Granularity (Total vs. Component regression).
          *   Selection Bias in reference class (only successful past events).
          *   Abandoned projects (to include or not?).
          *   Justifying deviations from the base rate (legitimate vs. rationalization).
      *   **Deliverables:**
          *   A concrete, step-by-step procedure (questions, stop rules, hand-off points).
          *   Application to 3 specific cases (Careers Fair, Hackathon, Conference).
          *   Meta-analysis (limitations, where it's just judgement, what would change the model).

  2.  **Deconstruct the JDM Concepts:**
      *   **Inside View:** Specific details of the current plan (bottom-up costing). Prone to optimism.
      *   **Outside View:** Reference class forecasting (base rates). Prone to ignoring unique details.
      *   **Integration:** Kahneman & Lovallo suggest starting with the Outside View to anchor, then adjusting for the Inside View *only* with documented evidence.
      *   **Pre-mortem:** Imagining failure to identify risks.
      *   **Selection Bias:** The "Survivorship Bias" of past events (only running what looked good).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Challenge 1: Order of Operations.* User asks: "Do I commit to the class before bottom-up?"
          *   *Solution:* Yes. If you build the bottom-up first, you anchor on it. The procedure must force the Outside View *first*.
      *   *Challenge 2: Granularity.* Total vs. Components.
          *   *Solution:* Hybrid. Fixed costs (venue) use Inside View (contracts). Variable costs (attendance/catering) use Outside View base rates. Don't regress the total if components vary wildly.
      *   *Challenge 3: Selection Bias.* "We only ran events we felt good about."
          *   *Solution:* Acknowledge the bias. Adjust the base rate downward slightly or widen the confidence interval. Include "abandoned" projects if data exists (probably doesn't). Treat the reference class as "Attempted Events" not "Successful Events."
      *   *Challenge 4: Deviations.* When to shift off base rate?
          *   *Solution:* The "Evidence Log." Any deviation requires a specific, verifiable factor (e.g., "Speaker X confirmed" vs. "We think it'll be popular"). If the reason arises *after* seeing the number, it's suspect.
      *   *Constraint Check:* Committee is 19-21, no stats.
          *   *Solution:* No confidence intervals, no regressions. Use "Best Case / Worst Case / Likely" based on past min/max. Simple spreadsheet formulas.

  4.  **Developing the "Budget Anchor Protocol" (The Procedure):**

      *   *Phase 1: The Outside Anchor (10 mins).* Define class, find average cost/attendance.
      *   *Phase 2: The Inside Build (10 mins).* Bottom-up costs.
      *   *Phase 3: The Reconciliation (5 mins).* Compare. If >15% diff, trigger review.
      *   *Phase 4: The Pre-Mortem (5 mins).* "It failed. Why?"
      *   *Decision Rules:* Stop rules for approval vs. committee vote.

  5.  **Addressing the Specific Pain Points in the Procedure:**
      *   *Shopping for classes:* Define the class *before* looking at numbers.
      *   *Component vs. Total:* Split Fixed (Inside) and Variable (Outside).
      *   *Survivorship Bias:* Apply a "Optimism Discount" to the reference class average.
      *   *Abandoned Projects:* Note them, but exclude from cost avg (no data), include in "success rate" if known.
      *   *Deviation:* Requires "Signed Evidence" (emails, contracts).

  6.  **Running the Procedure on the 3 Cases:**

      *   *Case 1: Careers Fair (Iterative).*
          *   Class: Past 4 fairs.
          *   Inside: Specific sponsor confirmed.
          *   Adjustment: Legitimate (signed sponsor).
          *   Verdict: Approve with small contingency.
      *   *Case 2: Hackathon (New).*
          *   Class: Other societies (unreliable).
          *   Inside: High uncertainty.
          *   Adjustment: High risk.
          *   Verdict: High contingency or scale down. Committee decision on risk.
      *   *Case 3: Conference (Emotional).*
          *   Class: Past conferences (likely optimistic).
          *   Inside: "Half-promised."
          *   Adjustment: Emotional bias detected.
          *   Verdict: Procedure likely says "Cut capacity" or "High Contingency." Needs Committee Values Call.

  7.  **Meta-Analysis (Limitations & Failure Modes):**
      *   *What it can't do:* Predict black swans, fix bad data, remove emotional attachment.
      *   *Judgement dressed as procedure:* Defining the reference class, scoring the "Evidence."
      *   *What would change my mind:* If the user has *perfect* data or if the penalty for underspending is worse than overspending (asymmetry).

  8.  **Refining the Tone:**
      *   Needs to be practical, slightly cynical (acknowledging student politics), but rigorous.
      *   Avoid academic jargon where possible (explain "reference class" as "Look at history").
      *   Respect the 30-minute limit.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is asking them to find other societies' budgets realistic for the Hackathon?
      *   *Fix:* Acknowledge the data is noisy. Treat it as a "Max Cap" not a "Target."
      *   *Critique:* The committee has no stats.
      *   *Fix:* Use "Red/Amber/Green" traffic lights instead of p-values or standard deviations.
      *   *Critique:* User asked about "abandoned projects."
      *   *Fix:* Explicitly add a step to log *why* things were abandoned to check for systemic optimism.

  10. **Final Polish:** Check against all constraints in the prompt. (30 mins, spreadsheet only, specific questions, stop rules, 3 cases, limitations). *Ensure the distinction between "Estimation" and "Values" is clear.*

  *(Self-Correction on the "Outside View First" rule)*: While JDM theory says Outside View first, in practice, you need *some* Inside View to know *which* Outside View applies (e.g., is this a social or a conference?). The procedure should require defining the *category* first, then getting the Base Rate, *then* doing the detailed Bottom-Up. This prevents anchoring on the Bottom-Up number.

  *(Refining the "Selection Bias" point)*: The user noted they only run events they feel good about. This means the historical data is *already* filtered for optimism. The procedure needs a "Survivorship Discount." I'll suggest reducing the historical average attendance by 10% or increasing cost estimates by 10% to account for the fact that history looks better than reality.

  *(Refining the "Committee" aspect)*: The committee are undergrads. They need a simple "Vote" trigger. If the budget relies on "Hope" (unconfirmed sponsors), it goes to them.

  Let's assemble the response.cw
answer: |-
  This is a classic JDM implementation problem. You have the theory (Inside/Outside View, Planning Fallacy, Reference Class Forecasting), but you need an algorithm that fits a 30-minute window, a basic spreadsheet, and a committee of 20-year-olds who don't want to read a paper on cognitive bias.

  Here is the **Budget Anchor Protocol**. It is designed to force the Outside View *before* the Inside View anchors you, and to separate *estimation* (math) from *values* (risk tolerance).

  ### Part 1: The Procedure (The Budget Anchor Protocol)

  **Time Limit:** 30 Minutes hard stop.
  **Tools:** One Spreadsheet Tab ("Budget Calculator"), One Text Doc ("Evidence Log").

  #### Phase 1: Define the Reference Class (5 Minutes)
  *Goal: Prevent shopping for a class that matches your desired number.*

  1.  **Question:** What is the *single* most similar event type we have run or seen in the last 3 years?
      *   *Allowed Answers:* "Careers Fair," "Social," "Conference."
      *   *Forbidden Answers:* "Hybrid Event," "Special Initiative." (If you can't name it simply, you don't have a class).
  2.  **Action:** Pull the data for the last 3 instances of this class from the archive.
      *   *Include:* Events that ran.
      *   *Exclude:* Events that were proposed but cancelled *before* any money was spent. (Reason: No cost data exists. However, log the *reason* for cancellation in the Evidence Log. If >30% of proposals in this class get cancelled, flag as "High Risk Class").
  3.  **Calculation:** Calculate the **Base Rate Cost Per Head** and **Base Rate Attendance** for these 3 events.
      *   *Correction for Survivorship Bias:* Since you only run events you feel good about, your history is optimistic. **Multiply Base Rate Cost by 1.10** and **Multiply Base Rate Attendance by 0.90**. This is your **Anchored Baseline**.

  **STOP RULE 1:** If you cannot find 3 comparable events, you are in "New Territory." Skip to Phase 4 (Risk Protocol).

  #### Phase 2: The Inside Build (10 Minutes)
  *Goal: Estimate costs you actually control.*

  1.  **Action:** Build your bottom-up budget.
  2.  **Segregation Rule:** You must split every line item into **Fixed** or **Variable**.
      *   **Fixed (Inside View):** Venue hire, speaker fees, marketing spend. *Use actual quotes/contracts.*
      *   **Variable (Outside View):** Catering, swag, printing. *Do not use your guess.* Use the **Anchored Baseline** per-head cost from Phase 1.
  3.  **Revenue:**
      *   **Confirmed:** Signed sponsorship contracts, ticket sales already made.
      *   **Projected:** Everything else. *Cap projected revenue at the Anchored Baseline Attendance × Ticket Price.*

  **STOP RULE 2:** If any Fixed Cost does not have a quote or email confirmation in the Evidence Log, mark it "Unsecured."

  #### Phase 3: Reconciliation (10 Minutes)
  *Goal: Identify the gap between hope and history.*

  1.  **Calculation:** Compare your **Total Inside Build** vs. **Total Anchored Baseline** (Baseline Attendance × Baseline Cost/Head + Fixed Costs).
  2.  **The Gap Test:**
      *   **Green:** Inside Build is within ±10% of Anchored Baseline. -> *Proceed to Approval.*
      *   **Amber:** Inside Build is 10-20% higher/lower than Anchored Baseline. -> *Trigger Evidence Review.*
      *   **Red:** Inside Build is >20% different. -> *Trigger Committee Values Call.*
  3.  **Evidence Review (For Amber):**
      *   Look at your Evidence Log. Do you have a *mechanism* for the difference?
      *   *Valid Mechanism:* "Venue cost is 20% higher because we signed the contract yesterday." (Verifiable).
      *   *Invalid Mechanism:* "We expect higher attendance because the topic is trending." (Unverifiable opinion).
      *   *Rule:* If the reason for the gap is not in the Evidence Log *before* you ran the numbers, you must revert to the Anchored Baseline.

  #### Phase 4: The Pre-Mortem & Handoff (5 Minutes)
  *Goal: Catch the "Values" calls.*

  1.  **Question:** "It is March. The event lost 20% of the budget. What specifically broke?"
      *   Write down the top 2 risks (e.g., "Sponsor pulled out," "Attendance half of forecast").
  2.  **Decision Matrix:**
      *   **Approve Automatically:** Green Gap + All Fixed Costs Secured.
      *   **Committee Vote (Values Call):** Red Gap OR >20% of Budget relies on "Projected" Revenue OR Pre-Mortem identifies a risk that would bankrupt the society.
      *   **Reject/Redesign:** Amber/Red Gap with no Valid Mechanism in Evidence Log.

  ---

  ### Part 2: Running the Procedure on Your Three Proposals

  Here is how the protocol handles your specific stuck points in real-time.

  #### 1. The Careers Fair (Iterative Event)
  *   **Phase 1 (Class):** "Careers Fair." You have 4 past runs. You take the last 3.
      *   *Bias Check:* You apply the 10% cost increase / 10% attendance decrease.
  *   **Phase 2 (Inside):** You have a specific sponsor.
      *   *Segregation:* Sponsor money is "Confirmed" (Contract signed). Attendance is "Variable" (Use Baseline).
  *   **Phase 3 (Reconciliation):**
      *   Your Inside Build says you'll break even. The Baseline says you'll lose money.
      *   *The Gap:* The gap is explained by the **Confirmed Sponsor**.
      *   *Verdict:* **Green/Amber.** Because the deviation is backed by a signed contract (Valid Mechanism), you are allowed to shift off the base rate.
      *   *Action:* Approve, but keep the contingency fund based on the Baseline loss scenario, not your optimistic break-even.

  #### 2. The Hackathon (New Event, Bad Data)
  *   **Phase 1 (Class):** "Hackathon." You have 0 internal runs.
      *   *Stop Rule 1 Triggered:* You are in "New Territory."
      *   *External Class:* Other societies' budgets.
      *   *Protocol Adjustment:* Treat external budgets as **Maximum Caps**, not Averages. Assume they are optimistic (Planning Fallacy applies to them too). Reduce their attendance numbers by 25% for your Baseline.
  *   **Phase 2 (Inside):** High uncertainty on food/attendance.
      *   *Segregation:* Almost everything is Variable.
  *   **Phase 3 (Reconciliation):**
      *   You likely want to spend based on the *published* external budgets. The Protocol forces you to use the *discounted* external budgets.
      *   *Verdict:* **Red Gap.** Your Inside View (based on hope) will exceed the Discounted External Baseline.
      *   *Action:* **Committee Values Call.** You cannot approve this alone. You must present: "Here is what other societies *say* they spend. Here is what the Protocol says they *actually* spend (25% less). We are asking for the difference. If we are wrong, we lose next term's budget."
      *   *Why this works:* It moves the risk from your shoulders to the group. They vote on whether to gamble the society's future on unverified data.

  #### 3. The Conference (Emotional, High Stakes)
  *   **Phase 1 (Class):** "Conference." You have history.
      *   *Bias Check:* Apply the 10% cost up / 10% attendance down.
  *   **Phase 2 (Inside):** You have "half-promised" capacity.
      *   *Evidence Log:* "Half-promised" is not a contract. It goes in the "Projected" bucket.
  *   **Phase 3 (Reconciliation):**
      *   Your Inside View (based on promises) will likely be >20% more optimistic than the Anchored Baseline.
      *   *Valid Mechanism Check:* Do you have signed tickets? No. Do you have a new marketing channel proven to work? No.
      *   *Verdict:* **Red Gap / Revert.** The procedure forces you to budget for the Baseline, not the Promise.
      *   *Action:* You must submit the budget at **Baseline Capacity**.
      *   *The Hard Truth:* If the event is only viable at the "Promised Capacity," the Procedure says **Do Not Run**.
      *   *Committee Handoff:* "This event requires 200 people to break even. History says 150. We have no mechanism to guarantee the extra 50. Vote: Do we cut the event scope to match history, or risk the penalty?"

  ---

  ### Part 3: Meta-Analysis (Limitations & Failure Modes)

  You asked for honesty about where this is just "judgement in a spreadsheet costume."

  **1. What this procedure CANNOT do:**
  *   **Fix Bad History:** If your past 3 conferences were miraculously successful outliers (luck), the Baseline is still wrong. The procedure assumes the past is predictive. It cannot detect "Black Swan" success or failure.
  *   **Stop Emotional Commitment:** It can force you to *budget* conservatively, but it cannot stop you from *ordering* catering for 200 people when the budget says 150. That requires personal discipline the spreadsheet can't enforce.
  *   **Solve the "Underspend Penalty":** This procedure biases toward accuracy, which often means lower budgets. If your Union punishes underspending heavily, this procedure might systematically get your budget cut. It optimizes for *solvency*, not *budget maximization*.

  **2. Judgement Calls Dressed as Procedure:**
  *   **Defining the Reference Class (Phase 1):** Deciding if an event is a "Social" or a "Conference" is subjective. You could game this by calling a risky party a "Networking Social" to get a safer baseline. *Mitigation:* The Committee must approve the Class Definition before you run the numbers.
  *   **Scoring the "Valid Mechanism" (Phase 3):** Deciding if a reason is "Verifiable" is up to you. *Mitigation:* The Evidence Log must be visible to the Committee. If it's not written down before the calculation, it doesn't count.

  **3. What would change my mind about this procedure?**
  *   **Asymmetric Penalties:** If the penalty for underspending (budget cut) is *severe* (e.g., society dies) and the penalty for overspending (15% hit) is *manageable*, you should invert the bias. Budget optimistically, insure against the overrun.
  *   **Data Richness:** If you had data on *cancelled* proposals (why they were cancelled, what the estimated costs were), you could model the "Selection Bias" mathematically instead of using the flat 10% discount.
  *   **Committee Expertise:** If the Finance Committee actually understood risk, you could hand them the "Red Gap" decisions without the pre-packaged "Values Call" framing. Since they don't, the Procedure must frame the risk in binary terms (Money Lost vs. Money Saved).

  **4. When to use Inside View only:**
  *   **One-off Unique Events:** If you are doing something literally no one has ever done (e.g., renting a castle for a night), there is no Reference Class. The Outside View is noise. In this case, skip Phase 1, but double the Contingency Fund in Phase 2.
  *   **Contractually Locked Costs:** If you have a signed contract for 90% of the budget, the Outside View matters less. The risk is no longer estimation; it's execution.

  ### Summary for your Committee
  When you present this to the 19-year-olds, don't call it "Reference Class Forecasting." Call it the **"History Check."**

  *   **Step 1:** What did history say this costs? (The Anchor)
  *   **Step 2:** What do we think it costs? (The Plan)
  *   **Step 3:** Why are they different? (The Evidence)
  *   **Step 4:** If we're wrong, who pays? (The Vote)

  This keeps you honest, protects you from your own optimism, and puts the risky bets where they belong: on the group, not your memory.
