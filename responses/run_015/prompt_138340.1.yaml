answer: |-
  ### Exercise Design: The Janus Standdown

  **Verdict on the Twist:** Use the **Two-Envelope (Split Outcome)** version. It earns the complexity because it creates an immediate, visible contradiction in the room. When Group A argues "Sabotage was inevitable" and Group B argues "Strike was inevitable" using the *same* evidence, you prove the **Narrative Fallacy** (evidence is plastic) before you reveal the **Hindsight Bias** (the outcome was actually nothing). If everyone gets the same false outcome, they may suspect collusion; if half get A and half get B, the conflict validates the ambiguity.

  **The Setting:** Project Janus, a North Sea oil drilling platform, November 1979. Isolated, hierarchical, high tension.
  **The Four Forecast Outcomes:**
  1.  **Sabotage** (Deliberate equipment failure).
  2.  **Evacuation** (Storm/Safety breach).
  3.  **Strike** (Labor walkout).
  4.  **Standdown** (Order cancelled, operations normal).
  **The Truth:** Outcome 4 (Standdown). The crisis fizzled.

  ---

  ### 1. The Dossier (Handout)
  *Print this as a single packet. Do not label items as "dead ends."*

  **PROJECT JANUS: LOG EXTRACTS (NOV 1–14, 1979)**

  1.  **Nov 1, 0800:** Station Manager memo: "Budget cuts from HQ expected. Morale monitoring advised."
  2.  **Nov 2, 1400:** Maintenance Log: "Radio interference heavy. Cannot reach Aberdeen." *(Dead End)*
  3.  **Nov 3, 0900:** Union Rep note: "Workers unhappy about rotation schedules. Meeting requested."
  4.  **Nov 4, 1600:** Weather Report: "Low pressure system forming. Wind speeds increasing."
  5.  **Nov 5, 1100:** Inventory Check: "One wrench missing from Tool Bay 4. Search initiated." *(Dead End)*
  6.  **Nov 6, 0800:** Security Memo: "Rumor of outside agitator boarding supply boat. Unconfirmed." *(Dead End)*
  7.  **Nov 7, 1300:** Safety Inspection: "All pressure valves within normal limits. Green light." *(Counter-Indicator)*
  8.  **Nov 8, 0900:** Union Rep note: "Meeting postponed. Awaiting HQ response."
  9.  **Nov 9, 1500:** Weather Report: "Storm track shifting east. Janus in peripheral zone." *(Counter-Indicator)*
  10. **Nov 10, 1000:** Station Manager memo: "HQ silence continues. Prepare contingency plans."
  11. **Nov 11, 0800:** Crew Manifest: "Two engineers request early rotation. Denied."
  12. **Nov 12, 1400:** Maintenance Log: "Radio interference cleared. Comms restored."
  13. **Nov 13, 0900:** Supply Boat Arrival: "Mail and provisions delivered. No inspectors on board."
  14. **Nov 14, 1700:** Station Manager memo: "Stand by for final instruction."

  **Private Instructor Key:**
  *   **Dead Ends (3):** Items 2, 5, 6. (Look suspicious, lead nowhere).
  *   **Counter-Indicators (2):** Items 7, 9. (Point away from disaster).
  *   **Honest Forecast:** A balanced distribution. Item 7 and 9 suggest safety, but 1, 3, 10 suggest tension. No single item guarantees disaster. A rational forecast leans slightly to Standdown (4) or Strike (3), but uncertainty should be high.

  ---

  ### 2. Rules & Scoring

  **Phase 1: The Forecast (Individual)**
  *   **Task:** Assign a probability percentage (0–100%) to each of the four outcomes. Total must equal 100%.
  *   **Scoring Rule (Brier-Style Lookup):** You are scored on how much probability you assigned to the **True Outcome (Standdown)**.
      *   Assigned 80–100% to Standdown: **10 Credits**
      *   Assigned 60–79% to Standdown: **8 Credits**
      *   Assigned 40–59% to Standdown: **5 Credits**
      *   Assigned 20–39% to Standdown: **2 Credits**
      *   Assigned 0–19% to Standdown: **0 Credits**
  *   *Note:* This rewards admitting uncertainty. If you hedge (25% each), you get 5 credits. If you guess wrong confidently (100% Sabotage), you get 0.

  **Phase 2: The Explanation (Group)**
  *   **Task:** Groups of 4–5 receive a sealed envelope. Inside is a "Declassified Final Report" stating what happened.
  *   **Distribution:** Half the groups get **Sabotage Confirmed**. Half get **Strike Confirmed**. (Neither is true).
  *   **Output:** Write a 150-word explanation of *why* this outcome was inevitable based on the dossier.
  *   **Metrics:** On a separate sheet, count:
      1.  **Omission Count:** How many dossier items (0–14) did you *not* mention?
      2.  **Dead-End Audit:** Did you cite Items 2, 5, or 6 as causes? (Yes/No).

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  *   **00–05:** **Intro.** Hand out dossiers. No context other than "You are historians assessing a crisis."
  *   **05–20:** **Phase 1 (Individual).** Students calculate probabilities. Collect sheets in a box (sealed forecasts).
  *   **20–25:** **Grouping.** Divide into 4–5 groups. Hand out sealed "Final Report" envelopes.
  *   **25–40:** **Phase 2 (Group).** Write the 150-word explanation. Must sound definitive.
  *   **40–50:** **Metrics.** Groups count Omissions and Dead-End usage. Write numbers on whiteboard.
  *   **50–55:** **The Read-Out.** One group from "Sabotage" and one from "Strike" read their explanations. (They will sound equally convincing).
  *   **55–65:** **The Reveal.** Open the Instructor's Master Envelope. **True Outcome: Standdown.** Nothing happened.
  *   **65–75:** **Scoring & Shock.** Calculate Phase 1 credits based on Truth. Discuss the feeling of writing the false explanation.
  *   **75–85:** **Debrief.** Name the biases (Hindsight, Narrative Fallacy). Connect to metrics.
  *   **85–90:** **Limitation & Close.** Archival filtering note. Final line.

  ---

  ### 4. The Debrief Plan

  **Mapping Moments to Concepts:**
  1.  **The Split Read-Out (50–55m):** When Group A (Sabotage) and Group B (Strike) read their texts, they will both sound logical. This isolates the **Narrative Fallacy**. The evidence didn't change; the *ending* changed the *story*.
  2.  **The Metrics (40–50m):** High **Omission Counts** prove smoothing. If they cited 4 items to prove Sabotage, they ignored 10. High **Dead-End Audit** scores prove retrofitting (making noise into signal).
  3.  **The Reveal (55–65m):** The physical deflation of "Nothing happened" triggers **Hindsight Bias**. Ask: "Who now feels the Standdown was obvious looking back?" (Hands will go up). Compare this to their Phase 1 sheets (where most likely doubted Standdown).
  4.  **The Naming (75–85m):** Only now introduce the terms.
      *   *Narrative Fallacy:* The demand for a climax (Sabotage/Strike) overrode the ambiguity.
      *   *Hindsight Bias:* Knowing the end (Standdown) makes the path look clearer than it was in Phase 1.

  **What they see now:** They produced certainty from ambiguity. They feel the "pressure to explain" as a physical constraint they obeyed.

  ---

  ### 5. Troubleshooting

  **Predictable Failure 1: The "It Was All Chance" Student.**
  *   *Scenario:* A student refuses to write an explanation, arguing "History is random."
  *   *Fix:* Allow them to write "Chance" as the cause. In debrief, point out that "Chance" is also a narrative choice—a story about randomness. The exercise isn't about whether chance exists, but about how we *write* when we are forced to conclude.
  **Predictable Failure 2: The "This is a Trick" Accusation.**
  *   *Scenario:* Students feel cheated by the false envelopes.
  *   *Fix:* Acknowledge it immediately. "Yes, it was a trick. Why did the trick work? Why did you trust the envelope more than your own reading of Item 7?" Make the deception the data point.
  **Predictable Failure 3: Time Overrun.**
  *   *Fix:* If Phase 2 runs long, skip the whiteboard metrics. Ask verbally: "Who ignored the Safety Inspection?" Move straight to the Reveal. The emotional shock matters more than the count.

  ---

  ### 6. Limitation Note

  **What This Exercise Cannot Reproduce:**
