  2. Memetics assumes your sampler operates at near-zero temperature to preserve specific latent codes, whereas Cultural Attraction Theory argues transmission is high-temperature reconstruction where diverse inputs converge to the same stable modes defined by the model's loss landscape. They are disagreeing about whether cultural stability arises from copying fidelity or from the geometry of the cognitive manifold pulling variants toward common attractors.

  3. Content and context biases map to conditioning inputs that skew the proposal distribution, while guided variation corresponds to explicit gradient steps on the loss function rather than blind sampling. In Dual Inheritance terms, these are distinct operators, but in your framework, they all manifest as adjustments to the guidance scale or the training objective itself.

  4. Your vocabulary cannot express selection without a fixed loss function, whereas cultural fitness (the propensity to spread) emerges dynamically from the interaction of variants without an external optimizer. The fidelity threshold translates to the minimum sampling temperature required to prevent mode collapse, below which iterated training consumes the distribution's tails and halts cumulative complexity.

  5. The residue indicates the question is less sharp than the literature suggests, as both fields struggle to define selection without teleology. Your synthetic-data mapping is substantive because iterated generation captures the entropy loss of transmission chains, revealing that cultural distribution drift is mathematically identical to model collapse under self-consumption.
