      *   *User's "Year-Five Test":* I need to explicitly validate or challenge this. I'll challenge it slightly: it's not that the test is too strong, it's that *history itself* is the problem. The test reveals that history is not a dataset, it's a narrative.
      *   *Reference Class:* I should incorporate the "n is tiny" problem into the requirements.

      *(Self-Correction during drafting)*: I initially thought about making "Mechanism" the killer requirement. But "Preconditions" is better for *ruling out* bad analogies in a panel setting. Mechanism can be faked with jargon. Preconditions are binary checks. I'll stick with Preconditions as the killer.

      *(Refining the "Protagonist" point)*: The user cares most about this. I need to make sure the spec highlights that aggregate analogies are *lies* by omission regarding the individual.

      *(Refining the "Year-Five" tension)*: The user asks: "Is that a real tension or am I being stupid?" It's a real tension. Ex-post rationalization is the disease. Ex-ante prediction is the cure, but history offers no ex-ante data. I need to state that clearly.

  8.  **Final Polish:** Check against the four deliverables.
