answer: |-
  ### 1. The Spec: Requirements for a Transformative Technology Analogy

  **Requirement 1: Causal Mechanism, Not Phenomenological Resemblance**
  *   **The Case:** "Both made information cheap" is a observation of outcome, not a theory of change. A valid analogy must identify the *engine* (e.g., "reduction of marginal cost to zero leads to disintermediation of gatekeepers") and distinguish it from the exhaust fumes.
  *   **Verdict:** **Non-negotiable.** Without a mechanism, you have poetry, not analysis. This serves both purpose (a) and (b).

  **Requirement 2: Distributive Specificity (The Protagonist Requirement)**
  *   **The Case:** Aggregate analogies ("GDP rose," "literacy increased") hide the violence of transition. A valid analogy must specify *which* skills become obsolete, *which* class captures the surplus, and *which* geography bears the cost. It must name the loser as clearly as the winner.
  *   **Verdict:** **Non-negotiable for (a) [Life], Preference for (b) [Policy].** Funders/regulators prefer aggregate stability metrics. Insisting on individual ruin makes the analogy politically toxic, even if historically accurate. *This is where your two purposes pull apart.*

  **Requirement 3: Falsifiable Preconditions**
  *   **The Case:** Every historical transition relied on specific contextual scaffolding (e.g., the Printing Press required a pre-existing merchant class with capital and a fragmented political landscape). A valid analogy must list the conditions required *now* for the mechanism to trigger, such that if those conditions are absent, the analogy is void.
  *   **Verdict:** **Non-negotiable for (b) [Policy], Difficult for (a) [Life].** Regulators need to know if the lever will pull. Individuals just need to know if they're safe. This is the primary tool for stopping unfalsifiable claims.

  **Requirement 4: Temporal Granularity (The J-Curve)**
  *   **The Case:** Transitions are not events; they are durations. A valid analogy must specify the lag between adoption and benefit, and explicitly state if there is a period of net negative welfare (e.g., Engels' Pause).
  *   **Verdict:** **Non-negotiable for (b) [Policy].** Policy operates on election cycles; history operates on generations. If the analogy implies immediate benefit but the history shows 40 years of immiseration, the analogy is dangerous.

  **Requirement 5: The Inertia Constraint**
  *   **The Case:** Bad analogies assume total transformation. Good analogies account for what *doesn't* change (legal frameworks, human biology, social hierarchies).
  *   **Verdict:** **Preference.** Hard to enforce. Everyone prefers the "revolution" narrative to the "adjustment" narrative.

  ---

  ### 2. Incompatible Requirements (The Trade-Offs)

  **Pair 1: The Ex-Ante/Ex-Post Paradox (Your "Year-Five Test")**
  *   **The Tension:** You asked if the Year-Five Test is too strong. It is not too strong; it reveals that **history cannot be predictive.** Historical analogies are explanatory tools (ex-post), not forecasting tools (ex-ante).
  *   **The Conflict:** To satisfy purpose (b) (funders/regulators), the analogy must be predictive. To satisfy intellectual honesty, it must acknowledge that the historical record is only clear in retrospect.
  *   **Verdict:** You cannot satisfy both. An analogy that is genuinely predictive (ex-ante) cannot lean heavily on historical precedent because the preconditions never match perfectly. An analogy that leans heavily on history is inherently retrospective. *You must choose: are you offering a warning or a map?*

  **Pair 2: Aggregate Stability vs. Individual Ruin**
  *   **The Tension:** Purpose (a) demands truth about the individual life (often ruin, displacement, loss of status). Purpose (b) demands truth about the system (often resilience, growth, adaptation).
  *   **The Conflict:** The "Industrial Revolution" analogy works for GDP (b) but fails for the hand-loom weaver (a). If you center the weaver, the regulator hears "Luddism." If you center the GDP, the writer hears "erasure."
  *   **Verdict:** A single analogy cannot carry both weights without fracturing. You need two analogies: one for the macro (system resilience) and one for the micro (class displacement). Using one to explain the other is a category error.

  ---

  ### 3. The Single Most Effective Requirement

  **Falsifiable Preconditions.**

  **The Argument:**
  This is the only requirement that kills the "vibe check" analogy. When a panelist says "This is the Printing Press," demand the preconditions.
  *   *Precondition:* "A monopoly on truth held by a single institution (Church) that is vulnerable to reputational attack."
  *   *Check:* Does that exist for AI? No.
  *   *Result:* Analogy voided.

  Most analogies survive because they are vague. "Information changed the world" cannot be disproven. "This technology will break the monopoly of X, given conditions Y and Z" can be. If the speaker cannot list the preconditions, they are not making an argument; they are telling a myth. This requirement forces the speaker to move from *prophecy* to *engineering*, which is where 90% of AI panel talk fails.

  ---

  ### 4. The Scorecard

  | Analogy | Causal Mechanism | Distributive Specificity | Falsifiable Preconditions | Temporal Granularity |
  | :--- | :--- | :--- | :--- | :--- |
  | **Printing Press** | **Pass.** (Disintermediation of gatekeepers). | **Fail.** (Usually cites "spread of knowledge," ignores the 100 years of religious war/burning). | **Fail.** (Preconditions of fragmented sovereignty/Church monopoly rarely checked). | **Fail.** (Treated as event, not century-long process). |
  | **Industrial Revolution** | **Pass.** (Capital substitution of labor). | **Pass.** (Clear winners: capitalists; losers: artisans). | **Partial.** (Energy constraints identifiable, but social preconditions ignored). | **Pass.** (Acknowledges "Engels' Pause"/delayed wage growth). |
  | **Nuclear (Manhattan)** | **Fail.** (State monopoly vs. distributed tech). | **Fail.** (Focuses on geopolitics, not individual livelihood). | **Pass.** (Resource/science thresholds are clear). | **Fail.** (Instant impact vs. slow integration). |

  **Summary:** The Industrial Revolution is the only one that passes the "Protagonist" test, but it fails the "Timescale" test in popular usage (people forget the misery). The Printing Press is the most abused because its preconditions are never audited. Nuclear is a category error for economic tech. None are fit for purpose (b) without heavy qualification.
