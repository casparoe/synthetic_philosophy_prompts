      *   **Purpose of Analogy:** (a) Tell the truth about the *individual experience* (life, not GDP), AND (b) Survive being said to funders/regulators (actionable/predictive).
      *   **Key Constraint:** Flag where purposes (a) and (b) pull apart.
      *   **User's Existing Opinions:** Mechanism vs. Resemblance, Year-Five Test (epistemic tension), Reference-Class Shopping, Timescale Compression, Protagonist Requirement (aggregate vs. individual).
      *   **Deliverables:**
          1.  Requirements (with case, verdict: non-negotiable vs. preference).
          2.  Incompatible requirements (trade-offs).
          3.  The single most effective requirement for ruling out bad analogies.
          4.  A short scoring table (Printing Press, Industrial Revolution, Nuclear) against the list.
