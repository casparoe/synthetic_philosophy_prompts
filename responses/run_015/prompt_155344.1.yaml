      *   *Requirement 5: The Counterfactual Constraint.* (New idea). What *doesn't* change? Analogies often assume total transformation. Good analogies admit inertia. Verdict: Preference (hard to do).

      *Refining Verdicts:* I need to distinguish between what makes an analogy *intellectually honest* vs. *politically usable*.
      *   *Mechanism:* Non-negotiable.
      *   *Protagonist:* Non-negotiable for (a), often treated as preference for (b).
      *   *Preconditions:* Non-negotiable for (b).
      *   *Timescale:* Non-negotiable for (b).

  4.  **Addressing Incompatible Requirements (Section 2):**
      *   *The Big Conflict:* Predictive Utility (b) vs. Experiential Truth (a).
      *   *Why:* To be useful to a regulator (b), you need generalizable rules and aggregate outcomes. To be true to a life (a), you need specific, often messy, outlier experiences.
      *   *The "Year-Five" Tension:* If you demand the analogy work without knowing the ending (ex-ante), you lose the explanatory power of history (ex-post). You can't have a perfect predictor that is also historically grounded.
      *   *Conclusion:* No analogy can be both perfectly predictive and perfectly descriptive of individual lived experience. One must be sacrificed or qualified.

  5.  **The Single Most Effective Requirement (Section 3):**
      *   *Candidate:* Causal Mechanism.
      *   *Candidate:* Distributive Specificity.
      *   *Winner:* **Falsifiable Preconditions.**
      *   *Why:* Most analogies fail because they assume the context is identical. "Printing press = AI" fails if the precondition "literacy is restricted to clergy" isn't met. If you force the speaker to list the preconditions required for the mechanism to trigger, 90% of panel talk vanishes because they can't prove the preconditions exist today. It kills the "vibe" argument.

  6.  **Scoring the Table (Section 4):**
      *   Need to score Printing Press, Industrial Revolution, Nuclear against the requirements.
