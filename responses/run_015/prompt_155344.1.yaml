  2.  **Deconstruct the User's Premises:**
      *   *The Core Tension:* The user wants an analogy that works *ex-ante* (for regulators/funders) but captures the *ex-post* reality of individual lives. This is the hard part. History is only clear in rearview mirrors. Prediction is inherently uncertain.
      *   *The "Year-Five Test":* The user worries this might be too strong. I need to address whether knowing the ending is the *point* of analogy or a *bug*. I argue it's a bug for prediction, but a feature for understanding. The spec needs to bridge this.
      *   *Mechanism:* Crucial. "Information cheap" is vague. "Disintermediation of gatekeepers leading to fragmentation of consensus" is a mechanism.
      *   *Protagonist:* Essential for the writer's purpose (a), often ignored in policy (b).

  3.  **Drafting the Requirements (Section 1):**
      *   *Requirement 1: Causal Mechanism, not Phenomenological Resemblance.* (Builds on user's "mechanism" point). Verdict: Non-negotiable. Without mechanism, it's just poetry.
      *   *Requirement 2: Distributive Specificity (The Protagonist Requirement).* (Builds on user's "protagonist" point). Must specify *who* wins and *who* loses, not just "society." Verdict: Non-negotiable for purpose (a), often skipped for (b).
      *   *Requirement 3: Temporal Granularity.* (Builds on "timescale"). Must specify the J-curve. When does the pain hit vs. the gain? Verdict: Non-negotiable for (b) (policy needs timing), hard for history to agree on.
