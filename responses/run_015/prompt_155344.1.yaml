      *Wait, another thing:* The prompt asks to flag where purpose (a) and (b) pull apart. I will mark these explicitly in the Verdicts.

      *Final check on tone:* "Deliver me." "Write me the spec." Okay, no intro fluff. Go straight to the spec.

      *Let's structure the Requirements:*
