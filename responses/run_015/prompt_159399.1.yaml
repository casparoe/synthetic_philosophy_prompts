answer: |-
  You're stranded in a border town where the official crossing is closed indefinitely, and you have a flight out tonight that you cannot miss. A local fixer approaches you in a café and offers to walk you through a gap in the fence, no questions asked, but he wants cash payment only after you're safely on the other side. He's been burned before by travelers who promised to pay and then vanished into the crowd once through the gap, and he's developed a sharp eye for spotting who will run and who won't. He watches you for thirty seconds while you negotiate the price, looking for a specific tell—a hesitation, a shift in posture, something that signals whether you're the type to honor a deal when leverage shifts. If he thinks you'll pay, he takes you; if he thinks you'll run, he walks away. There's no contract, no deposit, and once you're through the fence into the busy market on the other side, he has no power over you and you'll never see him again. You get through safely, the fixer holds out his hand for the money, and you know with perfect clarity that keeping the cash is the instrumentally superior move: you're safe, he can't catch you, and the money is useful for your trip. Yet you hand it over, lucidly acknowledging to yourself that this payment is now pointless, costly, and purely voluntary.

  1. The thing is a self-imposed cognitive protocol that treats prior verbal agreements as binding premises regardless of subsequent context, acquired by deliberately training yourself to shut down cost-benefit analysis in specific transactional frames. You acquire it on purpose during calm moments before travel by rehearsing a rule that flags "post-delivery payment" scenarios as closed loops, effectively blinding your future self to the option of reneging so that the prediction reads a genuine constraint rather than a bluff.

  2. The t2 act violates the norm of local instrumental rationality, which demands that an agent maximize expected utility given their current information and available options. By paying when keeping the money yields strictly higher utility and no future penalty, you are knowingly choosing a dominated strategy, making the act itself irrational by standard decision-theoretic lights even if having the disposition was wise.

  3. The single feature doing the work is the temporal gap between the prediction, which selects for the disposition, and the execution, which occurs after the disposition's instrumental value has expired. The fixer bets on your past programming, but you pay in a future where that programming no longer serves your interests, creating a wedge between what made you safe and what makes you pay.

  4. If you let the disposition be a desire or make reputation available, the case collapses into an ordinary precommitment story where the t2 act becomes rational under the new utility function. If you desire gratitude or fear reputational damage, paying maximizes utility at t2, so there is no conflict between dispositional and act rationality, and the paradox of "rational irrationality" vanishes into standard preference satisfaction.

  5. Someone who thinks rationality never requires irrationality would argue that a rational agent cannot voluntarily bind their future self against their future best judgment, so the scenario is impossible for a truly rational actor. They would say that since you know at t2 that paying is pointless, you wouldn't do it, meaning the fixer would predict this at t1, meaning you never get the ride, so the "rational" strategy of acquiring the disposition was never actually available to you in the first place.
