  # PHILOSOPHER'S NOTE ON YOUR GLOSSES

  You asked me to tell you if one of your glosses is wrong. Here is the correction:

  **Your Gloss:** *"Rigidity is not a defect in general but a resource... so the procedure should not treat rigidity found anywhere as a reason to override."*

  **Correction:** This is mostly right, but dangerous if taken literally. Rigidity is a resource *only when it serves the agent's own higher-order goals*. In the Parkinson's case, the rigidity (taking the drug) serves the goal of mobility but thwarts the goal of financial safety/gambling cessation. The patient *wants* to stop gambling but *cannot* adjust the means. This is rigidity that is *not* a resource; it is a hijacking of agency.
  **The Fix:** The procedure must not just ask "Is it rigid?" but "Whose goal does the rigidity serve?" If the rigidity serves a compulsion (Parkinson's/OCD) rather than a value (JW), it is a defect. My Step 3 (Volition Check) is designed to catch this. If the patient says "I wish I could stop," the rigidity is no longer a resource; it is a symptom. Do not let the "rigidity is a resource" gloss protect compulsive behavior.
