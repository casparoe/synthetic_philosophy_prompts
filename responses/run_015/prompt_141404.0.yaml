          1.  Specify the *bearer of value* (existence vs. welfare vs. civilizational character) and handle the trade-off case (survival up, quality down).
          2.  Handle the *Non-Identity Problem* (different people exist depending on choices). Explicitly state if "better for someone" is a genuine desideratum or a partisan commitment.
          3.  Distinguish *types of loss* (extinction vs. cap vs. replacement vs. decline vs. bad future).
          4.  Address *Cluelessness/Expected Value* (must it deliver determinate verdicts under severe uncertainty?).
          5.  **Crucial:** Flag internal inconsistencies/incompatibilities. Identify the single requirement most excluding the strong longtermist conclusion. Identify which items are partisan preferences vs. necessary conditions.

  2.  **Deconstruct the "Strong Longtermist Package":**
      *   Core claim: $EV(\text{Long-term}) \gg EV(\text{Near-term})$.
      *   Mechanism: Huge population size ($N$) $\times$ Probability of existence ($P$) $\times$ Value per life ($V$). Even if $P$ is tiny, $N$ is astronomical.
      *   To warrant this, the theory needs to support aggregation, handle uncertainty, and prioritize potential lives over actual identified lives.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Bearer of Value (Axiology).*
          *   Need to distinguish Totalism vs. Averaging vs. Person-Affecting.
          *   The prompt asks to center the case where survival chance goes up but quality goes down.
          *   *Draft:* The theory must value potential lives.
          *   *Refinement:* Needs to be precise. "The theory must treat the addition of lives with positive welfare as a contributory good, even if those lives would not otherwise exist." (Total Utilitarianism style).
          *   *The Trade-off Case:* Need a specific scenario. Let's call it the "Degraded Survival Case." Action A: 100% survival, high quality. Action B: 101% chance of survival (impossible, let's say 0.01% increase), slightly lower quality. Longtermism needs B to win if the future is big enough.
          *   *Requirement:* The theory must allow quantity to trump quality beyond a certain threshold of scale.

      *   *Desideratum 2: The Non-Identity/Person-Affecting Constraint.*
          *   Prompt asks to make explicit if "better for someone" is required.
          *   Strong longtermism usually requires *Impersonal* views (Totalism). Person-affecting views struggle here because the future people don't exist in the alternative (extinction).
          *   *Requirement:* The theory must reject the "Narrow Person-Affecting Principle" (an outcome can't be better unless it's better for some particular person).
          *   *Note:* This is a major partisan divide.

      *   *Desideratum 3: Taxonomy of Existential Risk.*
          *   Prompt asks to distinguish extinction, cap, replacement, decline, bad future.
          *   Longtermism focuses on *existential catastrophe* (permanent loss of potential).
          *   *Requirement:* The theory must assign disvalue to the *loss of potential future value*, not just the harm to currently living people. It must distinguish between "end of humanity" and "end of value." (e.g., if successors are better, is extinction bad?).
          *   *Refinement:* Needs to handle the "Astronomical Waste" argument.

      *   *Desideratum 4: Epistemology/Cluelessness.*
          *   Prompt asks about determinate EV under severe cluelessness.
          *   Longtermism relies on EV calculations with tiny probabilities and huge stakes.
          *   *Requirement:* The theory must permit expected value maximization even when probabilities are imprecise or effects are unknowable (flow-through effects).
          *   *Alternative:* If it refuses, longtermism fails. So, for the *package* to be warranted, this must be accepted.
          *   *Status:* Negotiable? If you drop this, longtermism collapses into skepticism.

      *   *Desideratum 5: Aggregation and Discounting.*
          *   Need to address time discounting.
          *   *Requirement:* Pure time discounting must be rejected (or kept very low).
          *   *Requirement:* Aggregation must be linear (no diminishing marginal value of lives that cuts off the astronomical sum).

  4.  **Identifying Incompatibilities (The "Trap"):**
      *   The prompt explicitly asks to flag unsatisfiable pairs.
      *   *Conflict 1:* Cluelessness vs. Determinate Verdicts. (Desideratum 4). You can't have precise EV under severe cluelessness without making strong, arguably arbitrary, modeling assumptions.
      *   *Conflict 2:* Person-Affecting Intuitions vs. The Non-Identity Problem. (Desideratum 2). You can't satisfy the intuition that "extinction isn't bad for anyone (since they don't exist)" while also saying "extinction is the worst outcome."
      *   *Conflict 3:* Quality vs. Quantity. (Desideratum 1). If you demand a "Critical Level" to avoid the Repugnant Conclusion, you might lose the mathematical force needed for longtermism if the future quality is near the critical level.

