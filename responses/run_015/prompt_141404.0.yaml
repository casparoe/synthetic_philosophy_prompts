      *   Identification of the "Exclusionary Requirement" (the one that kills longtermism if rejected).
      *   Identification of Partisan Preferences (items that can be dropped).

  6.  **Drafting the Content (incorporating specific constraints):**
      *   *Value Bearer:* Must be *Impersonal Total Value*. If it's average utilitarianism, adding more lives at lower quality hurts. If it's person-affecting, adding lives doesn't help. So, Totalism is required.
      *   *Non-Identity:* Must be explicitly rejected as a constraint.
      *   *Cluelessness:* Must accept "Expectational Precision under Radical Uncertainty."
      *   *The "Exclusionary" Requirement:* Likely the Epistemic one (Cluelessness) or the Axiological one (Totalism). Actually, the *Non-Identity/Person-Affecting* constraint is the biggest philosophical hurdle. But the *Cluelessness* one is the biggest practical hurdle. Let's look at the prompt: "which single requirement does the most to exclude the strong longtermist conclusion." If we keep the Person-Affecting view, longtermism dies. If we keep the Cluelessness objection, longtermism dies. The Person-Affecting view is more fundamental to *ethics*, Cluelessness is more *epistemic*. I will flag the Person-Affecting constraint as the primary ethical blocker.
      *   *Partisan Preferences:* The rejection of time discounting is standard but technically one could have longtermism with discounting if the future is *big enough*. But usually, zero discounting is required. The "Impersonal" view is definitely partisan.

  7.  **Polishing the "Degraded Survival Case":**
      *   Need to make it reusable.
      *   *Scenario:* Choice between $I_{near}$ (save 1,000 lives now) and $I_{far}$ (increase survival probability by $10^{-6}$, but conditional on survival, average welfare is 1% lower than alternative path).
      *   *Requirement:* Theory must rank $I_{far}$ higher given sufficient population scale.

  8.  **Final Review against Constraints:**
      *   Did I specify the bearer of value? Yes.
      *   Did I handle Non-Identity? Yes.
      *   Did I distinguish extinction types? Yes.
      *   Did I address Cluelessness/EV? Yes.
      *   Did I flag incompatibilities? Yes.
