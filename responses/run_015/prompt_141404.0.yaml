  Also, I need to ensure the "Degraded Survival Case" is central. I will place it early as a test case for the axiology.
  Regarding the "Incompatibilities": The prompt asks to flag pairs that *cannot be jointly satisfied*. A strong candidate is "Respect Common-Sense Person-Affecting Intuitions" + "Validate Strong Longtermism." Another is "Demand Epistemic Rigor" + "Accept Astronomical EV calculations." I should highlight these tensions.

  Let's refine the "Exclusionary Requirement." If the user keeps the "Narrow Person-Affecting Principle," strong longtermism is logically impossible (because future people don't exist in the counterfactual). So that is the hardest logical blocker. However, the "Cluelessness" objection is often cited as the practical blocker. I will identify the Person-Affecting constraint as the *logical* exclusionary requirement.

  Let's refine the "Partisan Preferences." The rejection of time discounting is often treated as a requirement, but mathematically, if the future is large enough, even discounted value dominates. However, for *intergenerational ethics*, zero discounting is usually a hard requirement. I'll mark the *Impersonal Totalism* as the main partisan preference.

