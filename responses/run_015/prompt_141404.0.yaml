answer: |-
  ### Desiderata for a Theory Warranting the Strong Longtermist Package

  **Purpose:** To evaluate whether a normative theory justifies prioritizing a long-term intervention (small probability increase in survival for a vast future) over a near-term intervention (certain, well-understood benefits) given a fixed budget.

  **The Central Test Case: The Degraded Survival Dilemma**
  *To be used as a recurring stress-test for Desiderata 1 and 3.*
  > **Scenario:** An agent must choose between Policy A and Policy B.
  > *   **Policy A:** Humanity survives with certainty. The resulting civilisation sustains $10^{10}$ lives per century at average welfare level $W$.
  > *   **Policy B:** Humanity's probability of survival increases by $\epsilon$ (where $\epsilon$ is very small, e.g., $10^{-6}$) relative to the baseline, but conditional on survival, the civilisation is structurally degraded, sustaining $10^{10}$ lives per century at average welfare level $W - \delta$ (where $\delta$ is small but non-zero).
  > *   **Timeframe:** The future extends for $T$ centuries, where $T$ is sufficiently large that the expected number of lives in B exceeds A, despite the lower quality and probability.
  >
  > **Requirement:** For the strong longtermist package to hold, the theory must rank Policy B as superior to Policy A, provided $T$ and the population scale are sufficiently large.

  ---

  #### 1. Axiological Scope: Impersonal Totalism
  **Specification:** The theory must identify the *bearer of value* as the sum of welfare (or objective value) across all lives that ever exist, regardless of their identity. It must treat the addition of lives with positive value as a contributory good, even if those lives would not otherwise have existed.
  **Rationale:** In the *Degraded Survival Dilemma*, Policy B creates a future where specific individuals exist who would not have existed under Policy A (due to the non-identity problem inherent in long-term causal chains). If value is tied only to making *existing* or *specific identifiable* people better off (Person-Affecting Views), Policy B cannot be better than A regarding the future people, because those people do not exist in the counterfactual where A is chosen. To allow the sheer *number* of future lives to outweigh the welfare loss $\delta$ and the near-term benefits, the theory must aggregate value impersonally.
  **Status:** **Non-Negotiable for Strong Longtermism.** Without this, the mathematical leverage of the "vast future" is severed.

  #### 2. The Non-Identity Constraint: Rejection of the Narrow Person-Affecting Principle
  **Specification:** The theory must explicitly reject the principle that "Outcome X can be better than Outcome Y only if X is better for some particular individual than Y." It must accept that an outcome can be better *simpliciter* even if it is not better for anyone in particular (specifically, the future people whose existence depends on the choice).
  **Rationale:** As noted above, long-term interventions alter the identity of future people. If a theory requires that harm or benefit be anchored to specific subjects (the "Narrow Person-Affecting Principle"), then preventing extinction cannot be described as benefiting the people who would have died (since they never exist), nor can it be described as benefiting the people who do exist in the survival scenario (since they wouldn't exist otherwise). To warrant the longtermist conclusion, the theory must treat the *existence* of valuable lives as a good in itself, independent of the interests of specific antecedent subjects.
  **Status:** **Non-Negotiable for Strong Longtermism.** This is the primary logical gatekeeper.

  #### 3. Taxonomy of Loss: Valuation of Potentiality over Actuality
  **Specification:** The theory must assign disvalue to the *loss of potential future value*, distinct from the harm inflicted on currently existing people. It must distinguish between:
  *   **Extinction:** Permanent end of value-generating capacity.
  *   **Capability Cap:** Survival but permanent inability to reach optimal scale (e.g., stuck on Earth).
  *   **Successor Replacement:** Humanity ends but is replaced by successors with equal or greater value-capacity.
  *   **Value Collapse:** Survival with a future that is net negative or below a critical value threshold.
  **Rationale:** In the *Degraded Survival Dilemma*, Policy B risks a "Value Collapse" (lower $W$). Strong longtermism requires that the *scale* of the future ($T \times \text{Population}$) dominates the *quality* ($W$), provided $W$ remains above a minimum threshold of positivity. However, the theory must also be able to declare that a "Value Collapse" into net suffering is worse than extinction. Therefore, the theory must value the *trajectory* of civilisation, not just the snapshot of current welfare. It must treat the closure of future possibilities (extinction/cap) as a distinct moral category from the reduction of current welfare.
  **Status:** **Negotiable (with caveats).** One could theoretically hold a longtermist view that cares only about extinction risk regardless of quality (lexicographic priority), but to handle the *Degraded Survival Dilemma*, the theory must allow quality to trade off against quantity.

  #### 4. Epistemic Tolerance: Expectational Precision under Radical Uncertainty
  **Specification:** The theory must permit the calculation of determinate Expected Value (EV) verdicts even when probabilities are imprecise, stakes are astronomical, and flow-through effects (second-order consequences) are unknowable ("cluelessness"). It must reject the claim that severe uncertainty mandates suspension of judgment or a shift to robustness/satisficing criteria.
  **Rationale:** The "small, disputed margin" of survival probability in the prompt implies extreme uncertainty. If the theory requires precise probabilities to generate a verdict, it cannot compare the near-term intervention (known benefits) with the long-term intervention (unknown probability $\times$ astronomical value). To warrant the longtermist conclusion, the theory must allow the astronomical magnitude of the future to swamp the imprecision of the probability estimate. It must treat "tiny probability $\times$ infinite value" as a calculable quantity greater than "certainty $\times$ finite value."
  **Status:** **Negotiable (but fatal if dropped).** If you drop this, the theory becomes epistemically modest. This does not logically contradict longtermism, but it practically prevents the *decision-guidance* required by your purpose.

  #### 5. Temporal Neutrality: Rejection of Pure Time Discounting
  **Specification:** The theory must assign equal weight to welfare (or value) occurring at any point in time, absent prudential or probability-based reasons for discounting. It must reject "pure time preference" (valuing the present simply because it is the present).
  **Rationale:** If the theory discounts future value at a rate $r > 0$, the value of the far future converges to zero as $T \to \infty$. This would mathematically negate the "expected size of humanity's future" argument. To allow the far future to dominate near-term considerations, the discount rate must be effectively zero.
  **Status:** **Non-Negotiable for Strong Longtermism.** (Though mathematically, if the future is large enough, it can dominate even with slight discounting, but for *intergenerational ethics*, zero discounting is the standard requirement).

  ---

  ### Analysis of Internal Tensions and Exclusionary Requirements

  #### 1. Incompatible Pair: Desideratum 2 (Non-Identity) vs. Common-Sense Person-Affecting Intuitions
  You cannot jointly satisfy **Desideratum 2** and the intuitive commitment that "morality is about how we treat specific people."
  *   **Conflict:** Strong longtermism requires us to sacrifice for people who do not yet exist and whose very existence depends on our sacrifice. Common-sense morality (and much of contractualist political theory) holds that we owe duties to *existing* or *identifiable* persons.
  *   **Result:** If you retain the intuition that an act cannot be wrong unless it is wrong *to someone*, you cannot accept the strong longtermist package. This is not a bug in the theory; it is a feature of the conflict between impersonal axiologies and person-affecting ethics.

  #### 2. Incompatible Pair: Desideratum 4 (Epistemic Tolerance) vs. Epistemic Rigor
  You cannot jointly satisfy **Desideratum 4** and a strict requirement for **Epistemic Rigor** regarding flow-through effects.
  *   **Conflict:** To calculate the EV of the long-term intervention, you must estimate the probability of survival and the value of the resulting civilisation. However, our actions now have "flow-through effects" that alter the trajectory of history in ways that are computationally intractable and historically unpredictable (the "cluelessness" objection).
  *   **Result:** A theory that demands robust evidence before acting (Rigor) will fail to generate the determinate verdict required by Desideratum 4. A theory that generates the verdict (Tolerance) must accept high-risk modeling assumptions that violate standard epistemic caution.

  #### 3. The Single Most Exclusionary Requirement
  **Desideratum 2 (Rejection of the Narrow Person-Affecting Principle).**
  *   **Reasoning:** This is the logical bottleneck. If you maintain that an outcome cannot be better unless it is better for some particular person, the strong longtermist conclusion is *logically impossible* to derive. The future people who benefit from survival do not exist in the counterfactual (extinction) scenario. Therefore, survival is not "better for" them. Without abandoning this constraint, the mathematical leverage of the vast future cannot be converted into moral obligation. This requirement excludes more philosophical traditions (contractualism, rights-based views, most deontology) than any other on this list.

  #### 4. Partisan Preferences (Items You May Drop)
  *   **Desideratum 4 (Epistemic Tolerance):** This is the most viable candidate for rejection if you wish to retain longtermist *goals* without accepting longtermist *methods*. You can drop the requirement for *determinate EV verdicts* and replace it with a requirement for *robustness* or *maximin* reasoning under uncertainty.
      *   *Consequence:* If you drop this, you may no longer be able to justify the "strong" package (dominance in *almost every choice*). You would be restricted to longtermist choices only where the probability of success is less disputed. This moves you from "Strong Longtermism" to "Cautious Longtermism."
  *   **Desideratum 1 (Impersonal Totalism) - *Partial*:** While you need an impersonal view to solve Non-Identity, you do not strictly need *Total* Utilitarianism. You could adopt a "Critical Level" view or a "Number-Dampened" view.
      *   *Consequence:* However, be warned: modifying Totalism to avoid the Repugnant Conclusion often reduces the mathematical weight of the far future. If the "value per life" drops as population rises, the "astronomical stakes" argument weakens. You can drop strict Totalism, but you cannot drop *Impersonalism*.

  ### Summary for Decision
  To accept the strong longtermist package, your theory **must** be impersonal (Desideratum 1 & 2) and temporally neutral (Desideratum 5). It **must** treat the loss of potential as a distinct disvalue (Desideratum 3). The greatest friction point will be **Desideratum 4**: if you find that severe cluelessness prohibits determinate EV calculations, the strong longtermist package collapses into indeterminacy, regardless of how much you accept the other desiderata.
