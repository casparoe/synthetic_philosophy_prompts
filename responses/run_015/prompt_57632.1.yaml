answer: |-
  There is no single, settled term in the literature that captures this specific structural configuration. It is discussed piecemeal under headings like "the problem of intervention," "the duty to prevent," or "practical implications of theodicy," but these labels describe the *topic*, not the *logical form* you have isolated.

  The candidates you offer are nearby but miss the mark in precise ways. Here is the breakdown, followed by a proposed term, a definition, edge cases, and a criterion for discriminating among theodicies.

  ### 1. Evaluation of Candidate Concepts

  *   **Agent-Relative Reasons/Permissions:** This is the closest standard concept, but it fails your test. Agent-relativity explains why *I* must save *my* child while you save yours (the reason contains an indexical: "my"). In your pattern, the reason does not change content; it changes *valence*. The fact "This pain produces soul-making" is not indexed. For God, it yields "Permit." For you, it yields "Prevent." Agent-relativity explains divergence in *action* based on divergence in *reasons*; your pattern shows divergence in *action* based on divergence in *agency* despite identity in *reasons*.
  *   **Sidgwick's Esoteric Morality:** This is structurally similar but distinct in modality. Sidgwick argues that the *truth* of utilitarianism should be hidden from the masses because believing it would reduce utility. Your pattern does not require the theodicy to be hidden or false. It requires that the *application* of a true principle be suspended for a specific class of agents. Sidgwick is about *belief management*; your pattern is about *normative force*.
  *   **Raz's Exclusionary Reasons:** These are second-order reasons not to act on first-order reasons (e.g., "The commander's order excludes my deliberation"). This does not fit because the human is not excluding the theodicic reason due to authority; they are overriding it due to a conflicting duty that the theodicy itself seems to generate.
  *   **Self-Defeating/Self-Effacing Theories:** A theory is self-effacing if it says, "Do not believe me." Your pattern is more specific: "If you believe me and apply me to this instance, you violate the very good I describe." It is a **pragmatic inconsistency of application**, not necessarily of belief.

  ### 2. Distinction from the "Obscenity" Critique

  The complaint that theodicies are "obscene" (e.g., Dostoevsky, Levinas, or contemporary critics like Susan Neiman) is moral and rhetorical. It claims that justifying suffering is an affront to the sufferer. Your difficulty is **logical and structural**. It does not matter if the tone is gentle or the ideology benign; the problem is that the justification creates a contradiction in the practical syllogism of the human agent who accepts it. The obscenity critique says, "You should not say this." Your critique says, "If this is true, you cannot act."

  ### 3. Proposed Term and Definition

  Since no settled name exists, I propose calling this structure **Normative Inversion**.

  **Definition:** A justification exhibits **Normative Inversion** if and only if:
  1.  **Dual Agency:** It posits two agents, $A$ (Sovereign/Designer) and $B$ (Subject/Participant).
  2.  **Identity of Reason:** Both agents have access to the same justifying fact $F$ (e.g., "Evil $E$ is necessary for Good $G$").
  3.  **Valence Reversal:** $F$ generates a permission or obligation for $A$ to *permit* $E$, but generates an obligation for $B$ to *prevent* $E$.
  4.  **Fragility:** The system relies on $B$ *not* acting on the logical implication of $F$ (which would be to permit $E$), even though $F$ is true and known to $B$.

  **The Test:** To see if a justification has this property, ask: *If the human agent acts consistently with the divine justification, does the system collapse?* If yes, it is Normative Inversion.

  ### 4. Edge Cases (False Positives)

  You asked for cases that look like Normative Inversion but are not.

  **Case 1: The Deterrent Threat**
  *   *Scenario:* A judge says, "I must sentence this man to prison to maintain the credibility of the law (Good $G$), even if rehabilitation is unlikely (Evil $E$)." A bystander knows this.
  *   *Why it fails:* The bystander has no duty to prevent the sentencing, nor does the justification tell them to. If the bystander breaks the prisoner out, they undermine $G$. There is no reversal. The judge must punish; the bystander must not interfere. The reasons align (Maintain Law), even if the actions differ.
  *   *Difference:* In Normative Inversion, the human is *commanded by ordinary morality* to do the opposite of what the justification implies. In deterrence, ordinary morality aligns with the sovereign's logic (law and order).

  **Case 2: The Pedagogical Failure**
  *   *Scenario:* A parent lets a child fail a task to build resilience ($G$). A teacher, knowing this plan, considers intervening.
  *   *Why it fails:* This is pure **Agent-Relativity**. The parent has a specific duty to foster *this* child's character. The teacher has a specific duty to ensure *academic standards*. The reasons are not identical. The parent acts on "My child's resilience"; the teacher acts on "Fair grading."
  *   *Difference:* In Normative Inversion, the human is acting on *general moral duties* (mercy, prevention of suffering) that should apply universally. The theodicy claims to explain the *universal* order, not just a private family arrangement.

  ### 5. A Non-Theological True Positive

  **The Triage Protocol in Disaster Medicine**
  *   *Scenario:* A Chief Medical Officer (CMO) adopts a utilitarian triage protocol: "Patients with low survival probability are left untreated ($E$) to maximize total lives saved ($G$)." A Field Medic ($B$) encounters a low-probability patient.
  *   *The Inversion:*
      *   For the CMO ($A$), the fact "This patient will likely die" justifies *withholding* care.
      *   For the Field Medic ($B$), the professional and moral oath is "Save the life in front of you."
      *   If the Medic fully internalizes the CMO's justification ("This death is necessary for the greater good"), they become a negligent killer. The system requires the Medic to *ignore* the macro-justification in the micro-moment.
      *   *Fragility:* If all Medics act on the CMO's logic, the medical profession's ethos collapses, and trust evaporates, reducing $G$. The justification works for the Designer but must be effaced for the Participant.

  ### 6. Discriminating Among Theodicies

  Your suspicion is correct: Normative Inversion discriminates sharply among theodicies. It depends on the **Locus of the Good**.

  **The Criterion: Local Necessity vs. Global Structure**
  *   **Susceptible to Inversion:** Theodicies where the Good $G$ requires the *specific occurrence* of Evil $E$ in *this instance*.
      *   *Example:* **Regularity Theodicy.** If the good is "laws of nature are exceptionless," then *this* landslide cannot be stopped without breaking the law. If I build the wall, I am not breaking the law (I am using it), but if the theodicy says "God cannot move the rock," it implies "Moving the rock is metaphysically costly." If I move the rock, have I ruined the world? No. But the *logic* suggests I shouldn't.
      *   *Example:* **Specific Soul-Making.** If the claim is "This victim *needs* this beating to learn forgiveness," then preventing the beating robs them of the good. This is highly susceptible to Inversion.
  *   **Resistant to Inversion:** Theodicies where the Good $G$ is a *general feature* of the world, and $E$ is merely an *instance* of the conditions that make $G$ possible, not the unique cause of $G$.
      *   *Example:* **Free Will Defense (General).** The good is "creatures have significant freedom." My preventing the beating is an *exercise* of my freedom. I am not undermining the system; I am participating in it. The good (freedom) is preserved whether the beating happens or is prevented, provided the prevention is also free.
      *   *Example:* **Response Theodicy (Hick).** The good is "the development of virtue." If I prevent the beating, the victim cannot show courage, *but* I can show compassion, and the attacker can show repentance when stopped. The good is *transferable*.

  **The Sorting Feature:**
  A theodicy escapes Normative Inversion if the Good $G$ is **Substitutable**.
  *   If $G$ can be achieved by $E$ occurring *or* by $E$ being prevented (via a different virtue), the justification does not invert.
  *   If $G$ is achieved *only* if $E$ occurs *unimpeded*, the justification inverts.

  **Application:**
  *   **Free Will:** Resistant. (My intervention is part of the free will system).
  *   **Natural Law/Regularity:** Susceptible. (If the point is the immutability of the rock's fall, my wall is an annoyance to the plan).
  *   **Soul-Making (Specific):** Susceptible. (If *this* pain is the specific medicine).
  *   **Soul-Making (General):** Resistant. (Any pain will do; preventing this one just moves the gym to another location).

  ### Summary
  The structure you identified is **Normative Inversion**. It arises when a justification for suffering relies on a **Local Necessity** that human intervention would negate, creating a conflict between the metaphysical explanation of evil and the moral obligation to prevent it. It is distinct from agent-relativity because the reason remains constant while the imperative flips. It distinguishes theodicies that view evil as a **necessary means** (vulnerable) from those that view evil as a **permissible context** (resistant).
