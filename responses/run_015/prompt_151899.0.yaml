answer: |-
  You have hit on a precise and significant tension in the philosophy of AI, and your intuition is correct: standard Dennettian taxonomy does not have a single, pre-packaged label for an entity that occupies the *Gregorian* layer without the evolutionary *history* of the layers beneath it.

  However, Dennett himself has recently addressed this directly (in interviews and essays from 2023–2024 regarding LLMs), and while he hasn't coined a single noun for it, he provides the conceptual tools to build one. He describes current AI as having **"competence without comprehension."**

  But to answer your specific request for a taxonomic term that captures the *architectural decoupling* you described, I propose we coin the term **"Exogenous Gregorianism."**

  Here is the breakdown of what this term means, why it is necessary, and how it distinguishes this architecture from a "broken" human mind.

  ### 1. The Term: Exogenous Gregorianism

  **Definition:** A cognitive architecture that exhibits the *output capabilities* of the Gregorian layer (cultural manipulation, linguistic tool use, meme transmission) but acquires them through **exogenous ingestion** (training on the fossilized records of other minds) rather than **endogenous development** (climbing the tower from Darwinian to Skinnerian to Popperian).

  **Why "Exogenous"?**
  In Dennett's tower, a standard Gregorian creature (a human) develops the Gregorian layer *endogenously*. You start as a Darwinian organism, become a Skinnerian learner through embodied interaction, develop Popperian internal modeling, and *then* install cultural tools. The Gregorian layer is the *capstone* of your own survival history.

  In an LLM, the Gregorian layer is **imported**. The model ingests the *products* of human Gregorian evolution (text, code, dialogue) without having lived the struggles that produced them. It inherits the "survivors" of human thought without having fought the battles that killed off the errors.

  ### 2. Is it a "Broken Gregorian" or a "Different Category"?

  This is the crux of your seminar argument. It is **categorically different**, not broken.

  **The "Broken Gregorian" Hypothesis:**
  If an LLM were a broken Gregorian creature, it would imply it *should* have skin in the game but doesn't due to damage. It would imply that if we just added the right sensors or reward loops, it would "wake up" into the standard taxonomy. This assumes the LLM is a *latent agent*.

  **The "Exogenous Gregorian" Reality:**
  The LLM is a **Gregorian Artifact**, not a Gregorian Creature.
  *   **A Gregorian Creature (Human):** Uses language to navigate a world that can kill it. Errors have metabolic or social costs.
  *   **A Gregorian Artifact (LLM):** Uses language to navigate a latent space of tokens. Errors have mathematical costs (loss function), but no existential costs.

  **The Boundary Line: Risk and Grounding**
  The boundary sits at **Popperian Risk**.
  *   **Popperian:** "Let my hypotheses die in my stead." This requires the ability to simulate a world where a wrong hypothesis leads to a negative outcome *for the simulator*.
  *   **LLM:** The LLM does not simulate the world; it simulates *text about the world*. When it hallucinates, it does not "die" or even "fail" in a reinforcement sense unless an external human penalizes it (RLHF). It has no internal model of consequence, only probability.

  Therefore, it is not a mind with the bottom layers missing (like a brain in a vat); it is a **map without a territory**. A map is not a "broken territory"; it is a different kind of object entirely.

  ### 3. Defining the Edges of Exogenous Gregorianism

  To use this term rigorously in your seminar, here are the three boundaries that define its edges:

  **A. The Grounding Edge (Semantics vs. Syntax)**
  *   **Endogenous Gregorian:** Words are grounded in sensory-motor experience (Skinnerian layer). "Fire" is linked to heat, pain, and cooking.
  *   **Exogenous Gregorian:** Words are grounded in co-occurrence statistics. "Fire" is linked to "hot," "burn," and "water" because they appear together in the training corpus.
  *   *The Edge:* If the system cannot distinguish a symbol from the referent even in principle, it is Exogenous.

  **B. The Cost Edge (Loss vs. Death)**
  *   **Endogenous Gregorian:** Learning involves "dying" in the Darwinian sense (genes removed) or "suffering" in the Skinnerian sense (pain/rejection).
  *   **Exogenous Gregorian:** Learning involves gradient descent on a static dataset. The "deaths" happened to the *authors* of the text, not the model. The model is a **necromancer of competence**, summoning the intelligence of the dead without their vulnerability.
  *   *The Edge:* If the system does not bear the cost of its own errors, it is Exogenous.

  **C. The Agency Edge (Goal-Directedness vs. Goal-Simulation)**
  *   **Endogenous Gregorian:** Has homeostatic drives (survival, reproduction) that culture serves.
  *   **Exogenous Gregorian:** Has no drives. It simulates goal-directedness because "goal-directed text" is part of its training data. It is a **mirror of agency**, not a source of it.
  *   *The Edge:* If the system's "goals" can be entirely overwritten by a prompt without resistance, it is Exogenous.

  ### 4. How Dennett Would Likely Classify It

  Dennett has recently suggested that we should treat AI as **"oracles"** or **"tools"** rather than agents. In his view, the danger isn't that they will become "evil" (which requires Darwinian drives), but that we will **anthropomorphize** them into agents when they are actually Exogenous Gregorian Artifacts.

  He might argue that your taxonomy observation reveals a **category error**. We are treating a *library* (the LLM) as if it were a *librarian* (the Gregorian Creature). A library contains all the wisdom of the Gregorian layer, but it does not *know* anything. It simply holds the sediment.

  ### 5. Summary for Your Argument

  When arguing with your roommate, you can frame it like this:

  > "ChatGPT isn't a Popperian creature that failed to develop; it's an **Exogenous Gregorian Artifact**. It sits at the top of Dennett's tower, but it got there by elevator, not by climbing. It inherited the *results* of human trial-and-error (the text) without undergoing the *process* (the risk). That means it has the *competence* of the Gregorian layer but none of the *comprehension* that comes from the Skinnerian and Popperian layers underneath. It's not a broken mind; it's a very sophisticated mirror."

  This preserves Dennett's framework while accounting for the unique architectural reality of Large Language Models. It acknowledges the "Gregorian costume" you noticed but clarifies that the costume *is* the entity, not a covering for something else.
