prompt: |-
  I keep coming back to the preregistration stuff in psychology and something about it bugs me. The deal now is that if you write down your hypothesis and analysis plan before collecting data, your result counts as confirmatory evidence, but if you didnt, the exact same finding from the exact same data is "exploratory" — a hypothesis for future research, and a lot of journals won't treat it as real support for anything. There are badges for it, and registered reports where your methods section gets peer reviewed and accepted before you've even run the study.

  On its face this was sold as a frequentist clean-up job: kill p-hacking and HARKing by making the error rates honest. But heres what I can't shake. The classic Bayesian complaint about frequentist testing was always that the same data should give the same evidence regardless of the researcher's intentions or sampling plan — the likelihood principle, the stopping-rule stuff, all of that. And preregistration seems to double down on the opposite view: the epistemic value of a finding partly depends on what was in the researcher's head (and in a timestamped OSF file) before the data arrived. The reform that everyone frames as fixing frequentist practice seems to presuppose the exact thing Bayesians said was wrong with frequentism.

  So what does the preregistration regime actually presuppose about evidence? A few sub-questions. Is it just straight frequentism, where procedures and intentions are legitimately part of the evidential story? Or is it really an epistemology of the researcher rather than of the data — the preregistration being evidence of the person's trustworthiness, which is a different thing from evidential support proper? Could a good Bayesian sign on to the whole package coherently, or only to parts of it (pre-committing priors, sure, but discounting the data itself because of when the hypothesis was formed, no)? And where does the confirmatory/exploratory line actually break — pilot data, someone preregistering twenty hypotheses and reporting the one that hits, a "prediction" that was basically the whole field's prior expectation anyway? Basically: reconstruct the implicit view of evidence this practice needs, tell me which rival views it quietly rules out, and what would genuinely have to change if the field went fully Bayesian instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** The user identifies a philosophical contradiction in the Open Science/Preregistration movement in psychology.
      *   **The Contradiction:** Frequentist statistics (which preregistration aims to fix) are criticized by Bayesians for violating the Likelihood Principle (evidence depends on data, not intentions/stopping rules). Preregistration *reinforces* the idea that intentions/timing matter for evidential value.
      *   **Key Questions:**
          1.  What view of evidence does preregistration presuppose? (Frequentist? Epistemology of the researcher?)
          2.  Can a Bayesian coherently support preregistration?
          3.  Where does the confirmatory/exploratory line break? (Garden of forking paths, HARKing, etc.)
          4.  What would change if the field went fully Bayesian?

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *Frequentism:* Error rates (Type I/II) depend on the sampling plan and stopping rules. $p$-values are calculated based on the space of possible outcomes under the null. If you peek at data or change hypotheses, you inflate the error rate. Preregistration locks the sampling plan to keep error rates valid. -> *Preregistration fits perfectly here.*
      *   *Bayesianism:* Evidence is the likelihood ratio (Bayes Factor). It depends *only* on the data and the models being compared. Stopping rules and intentions are irrelevant (Likelihood Principle). -> *Preregistration seems irrelevant or even contradictory here, unless viewed as prior specification.*
      *   *The User's Insight:* The user is spot on. The "Replication Crisis" reforms are largely frequentist patches applied to a system that many argue needs a Bayesian overhaul. Preregistration validates the frequentist reliance on "researcher degrees of freedom."

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's a known but often unspoken tension in methodology circles. Validate the user's intuition: Preregistration *is* a frequentist solution to a frequentist problem.

      *   **Question 1: What view of evidence does preregistration presuppose?**
          *   It presupposes *Long-Run Error Control* (Frequentism).
          *   Evidence isn't just the data; it's the data *plus* the guarantee that the error rate is $\alpha = 0.05$.
          *   Without preregistration, the "test statistic" is invalid because the reference class (the set of possible tests run) is unknown.
          *   It treats the *process* as part of the *product*.
          *   *Alternative:* It's also an "Epistemology of Trust." Since we can't calculate the true error rate without knowing the garden of forking paths, we trust the timestamp.

      *   **Question 2: Can a Bayesian sign on?**
          *   *Strict Bayesian:* No. The Likelihood Principle says intentions don't change evidence. A Bayes Factor calculated post-hoc is mathematically identical to one calculated pre-hoc (assuming same priors/models).
          *   *Pragmatic Bayesian:* Yes, but for different reasons.
              *   *Priors:* Preregistration locks in priors (prevents shifting priors to fit data).
              *   *Model Specification:* Prevents "model hacking" (trying 20 covariates until one works). In Bayesian terms, this is searching the model space without penalizing for complexity.
              *   *Community Trust:* Even if the *data* evidence is the same, the *credibility* of the researcher is higher.
          *   *Conclusion:* A Bayesian supports pre-commitment of *models and priors*, not necessarily for error rate control, but for honesty in model specification.

      *   **Question 3: Where does the line break? (The Edge Cases)**
          *   *Pilot Data:* Frequentist says "contaminates." Bayesian says "updates prior." Preregistration usually says "must be disclosed/adjusted for."
          *   *20 Hypotheses:* Frequentist needs Bonferroni correction. Preregistration forces you to declare which one is "primary." Bayesian needs to account for model space (which is hard).
          *   *Field-wide Priors:* If everyone expects X, is preregistering X "confirmatory"? Yes, because it risks falsification. But if the prior is 0.99, the Bayes Factor needed is high.

      *   **Question 4: What if we went fully Bayesian?**
          *   Preregistration becomes less about "stopping rules" and more about "prior specification."
          *   We would stop dichotomizing (Significant/Not) and start quantifying evidence (BF).
          *   Exploratory analysis becomes less stigmatized *if* priors are updated honestly.
          *   *However:* The human tendency to self-deceive remains. We still need to lock in priors to prevent "prior hacking." So preregistration survives but changes function.

      *   **Synthesis/Conclusion:**
          *   The current regime is a "Frequentist Patch."
          *   It treats evidence as a function of *process reliability* rather than just *data content*.
          *   It rules out strict Likelihood Principle adherence.
          *   A Bayesian shift would reduce the *necessity* of preregistration for validity, but keep it for transparency regarding priors and model selection.

  4.  **Refining the Tone:**
      *   The user is sophisticated (knows Likelihood Principle, HARKing, OSF, Registered Reports). Avoid over-explaining basics.
      *   Maintain a critical, philosophical tone.
      *   Use precise terminology (Likelihood Principle, Error Statistics, Model Space, Prior Elicitation).
      *   Acknowledge the "sociological" aspect (trust) vs. the "mathematical" aspect (evidence).

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I shouldn't say Bayesians *never* care about multiple comparisons. They do, but via model averaging or prior odds, not alpha inflation. I need to be careful there.
      *   *Nuance:* Preregistration isn't *purely* frequentist. Registered Reports accept Bayesian analyses. But the *logic* of why preregistration is required (to prevent p-hacking) is frequentist.
      *   *Key Distinction:* Distinguish between "Evidence" (mathematical relation between data and hypothesis) and "Warrant" (social/epistemic justification to believe the claim). Preregistration boosts Warrant, not necessarily Evidence (in the Bayesian sense).

  6.  **Final Polish:** Organize into clear headings matching the user's sub-questions. Ensure the conclusion ties the threads together. (The resulting output matches the detailed response provided previously.)
answer: |-
  You have put your finger on the central philosophical tension in modern methodological reform. Your intuition is correct: **Preregistration is a frequentist solution to a frequentist problem, dressed up as universal epistemic hygiene.**

  The movement to fix the "replication crisis" largely accepted the null hypothesis significance testing (NHST) framework as the ground truth and tried to bolt on safeguards to make the error rates valid. In doing so, it implicitly rejected the Likelihood Principle—the very principle Bayesians argue is necessary for coherent inference.

  Here is a reconstruction of the implicit view of evidence in the preregistration regime, how it clashes with Bayesianism, and what would actually change under a Bayesian paradigm.

  ### 1. What View of Evidence Does Preregistration Presuppose?

  The preregistration regime presupposes an **Error-Statistical Philosophy of Science** (associated with Deborah Mayo and Aris Spanos), not a pure Likelihoodist or Bayesian one.

  In this view, "evidence" is not merely the relationship between the data and the hypothesis (the likelihood). Evidence is a property of the **testing procedure**. A claim is supported only if it has passed a "severe test"—a test that would likely have failed if the claim were false.

  *   **The Frequentist Logic:** To know if a test is severe, you must know the probability of finding such data under the null hypothesis. That probability depends on the "sampling distribution." The sampling distribution depends on what you *would have done* had the data looked different (stopping rules, multiple comparisons, covariate selection).
  *   **The Role of Intention:** If you do not preregister, the "space of possible outcomes" is undefined. You might have analyzed the data 50 different ways and only reported the one that worked (the "Garden of Forking Paths"). Therefore, the $p$-value is mathematically invalid because the Type I error rate is inflated.
  *   **The Preregistration Fix:** By timestamping the plan, you define the sampling distribution. You turn an unknown error rate into a known one ($\alpha = 0.05$).

  **Implicit Epistemology:** Evidence is **procedural**. The epistemic weight of a finding depends on the reliability of the process that generated it. Two identical datasets provide different evidence if one was generated by a rigid protocol and the other by a flexible exploration, because only the former guarantees a known long-run error rate.

  **What it rules out:** It rules out the **Likelihood Principle**, which states that all evidence relevant to a hypothesis is contained in the likelihood function of the observed data. Under the Likelihood Principle, the researcher's intentions (to stop early, to switch hypotheses) are irrelevant to the strength of evidence provided by the data *itself*. Preregistration explicitly says intentions *are* relevant.

  ### 2. Is it an Epistemology of the Researcher rather than the Data?

  Yes. This is the sociological pivot. Since we cannot practically verify every analytical decision a researcher made post-hoc, preregistration shifts the burden of proof from **verifying the analysis** to **verifying the researcher's constraints.**

  *   **Trust as a Proxy for Truth:** In the absence of a known sampling distribution (due to flexibility), the community cannot calculate the false positive rate. Preregistration acts as a credibility signal. It says, "I have bound my hands, so you can trust my error rates."
  *   **Warrant vs. Evidence:** A strict Bayesian would distinguish between *evidence* (the Bayes Factor provided by the data) and *warrant* (the reason to believe the researcher isn't lying or self-deceiving). Preregistration increases *warrant* without necessarily changing the mathematical *evidence* (in a Bayesian sense).
  *   **The "HARKing" Problem:** HARKing (Hypothesizing After Results are Known) is treated as fatal in the preregistration regime. Why? Because it decouples the prediction from the risk. In Popperian terms, it removes falsifiability. In frequentist terms, it inflates $\alpha$. In Bayesian terms, it's actually fine *if* you update your priors honestly—but the field treats it as frequentist fraud.

  ### 3. Could a Good Bayesian Sign On?

  A strict Bayesian cannot sign on to the *justification* for preregistration, but a pragmatic Bayesian can sign on to the *practice* for different reasons.

  **Where the Bayesian Dissents:**
  *   **Stopping Rules:** A Bayesian can look at data continuously and stop whenever they feel like it. The Bayes Factor remains valid. Preregistration often demands fixed sample sizes, which is inefficient for a Bayesian.
  *   **Exploratory Data:** For a Bayesian, exploring data simply updates your prior for the next study. It is not "less real." A finding generated exploratorily provides the same likelihood ratio as one generated confirmatorily. The difference is that the *prior* for the exploratory finding should be lower (because it was unexpected), resulting in a lower posterior probability. Preregistration tries to fix this by banning the exploration from counting as confirmation, rather than just adjusting the prior.

  **Where the Bayesian Agrees:**
  *   **Prior Specification:** The biggest danger in Bayesian analysis is "prior hacking" (trying different priors until the BF looks good). Preregistration locks in the prior distribution.
  *   **Model Selection:** "P-hacking" in a Bayesian world is "Model-hacking" (trying 20 covariates until the BF > 3). Preregistration forces you to commit to the model structure.
  *   **Transparency:** Even if the math doesn't require it, humans are prone to self-deception. Preregistration helps the researcher combat their own bias, which a Bayesian can appreciate as a heuristic for rationality.

  **Verdict:** A Bayesian supports **pre-commitment of priors and models**, but rejects the idea that unregistered data is "exploratory" in a way that negates its evidential value. They would argue the data should count, but with a skeptical prior.

  ### 4. Where Does the Confirmatory/Exploratory Line Break?

  The current regime creates arbitrary cliffs because it tries to enforce a binary (Confirmatory vs. Exploratory) on a continuous problem (Degrees of Freedom).

  *   **Pilot Data:** Frequentist preregistration often treats pilot data as "contaminating" the sample space. A Bayesian views pilot data as prior information. The conflict arises because the frequentist needs a clean null distribution, while the Bayesian needs an informed prior.
  *   **The "20 Hypotheses" Problem:** If I preregister 20 hypotheses and one hits at $p < .05$, frequentist logic demands a correction (Bonferroni). Preregistration solves this by asking me to designate *one* primary outcome. But what if they are theoretically equal? The line breaks because the "primary" designation is often arbitrary. A Bayesian would average across the models or adjust the prior odds for the set of hypotheses.
  *   **Field-Wide Priors:** If a hypothesis is the consensus view (e.g., "smoking causes cancer"), preregistering it adds little new information. The "confirmatory" value is low because the prior is already near 1. Preregistration treats all registered tests as equally "confirmatory" regardless of the prior probability, which is inefficient.

  ### 5. What Would Change if the Field Went Fully Bayesian?

  If psychology adopted a fully Bayesian epistemology, the preregistration regime would look radically different, or perhaps become obsolete in its current form.

  1.  **Death of the "Exploratory" Stigma:** Exploratory analysis would be recognized as legitimate prior elicitation. You could publish a paper saying, "We looked at the data, found X, and here is the Bayes Factor." The critique would not be "this is exploratory, so it doesn't count," but rather, "Your prior for X should have been lower, so your posterior is unconvincing."
  2.  **Preregistration becomes "Prior-registration":** The focus would shift from locking down the *analysis plan* to locking down the *prior expectations*. You would preregister: "Before seeing data, I believe the effect size is distributed $N(0, 0.5)$." This prevents shifting the goalposts after seeing the data.
  3.  **Sequential Analysis becomes Standard:** You wouldn't need to fix $N$. You would collect data until the Bayes Factor crossed a threshold (e.g., BF > 10). Preregistration would specify the *threshold*, not the *sample size*.
  4.  **Quantified Evidence vs. Binary Claims:** The confirmatory/exploratory binary would dissolve into a continuum of posterior probabilities. A "failed replication" wouldn't be a binary "p > .05"; it would be a Bayes Factor indicating how much the evidence shifted the probability of the theory.
  5.  **The "Garden of Forking Paths" becomes Model Averaging:** Instead of punishing researchers for trying multiple models, Bayesian multilevel modeling or model averaging would account for the uncertainty in the model structure itself.

  ### Summary

  The preregistration regime presupposes that **evidence is a function of process reliability (error rates), not just data content.** It is a frequentist patch that enforces the Likelihood Principle's violation by making intentions part of the statistical validity.

  *   **It rules out:** Strict Likelihoodism and pure Bayesian updating where intentions are irrelevant.
  *   **It relies on:** An epistemology of trust, where the timestamp substitutes for knowledge of the true sampling distribution.
  *   **A Bayesian shift would:** Retain pre-commitment (to prevent prior/model hacking) but discard the distinction between confirmatory/exploratory *evidence*, replacing it with a distinction between *informed* and *uninformed* priors.

  You are right to be bugged. The field is using a 19th-century frequentist engine, patched with 21st-century transparency tools, to solve a problem that 18th-century Bayesian logic solves naturally—but at the cost of requiring honest prior specification, which is psychologically harder for humans than simply following a script. Preregistration forces the script; Bayesianism requires the honesty. The current regime chose the script.
