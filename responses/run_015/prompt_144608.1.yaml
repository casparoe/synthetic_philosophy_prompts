answer: |-
  Your framing rests on a fundamental mistake about what constitutes a "merely verbal dispute," which cascades into your procedure and your suspicion about ontological facts. You are treating verbal disputes as those that vanish under translation into a neutral language. However, a dispute is merely verbal only if the parties agree on all the underlying non-linguistic facts and differ solely on linguistic usage. Your canonicalization procedure assumes that if a disagreement persists after translation, it must be about metaphysics (what exists). But the residue you observed—arguing about query simplicity—shows the original dispute was never metaphysical to begin with. It was pragmatic.

  Here is the breakdown. In philosophy, a **quantifier** is a logical operator like "there exists" or "for all." **Quantifier variance** is the thesis that different conceptual schemes might use "exists" with different rules without one being objectively wrong. **Sortals** are categories that supply principles of identity, like "customer" versus "event." Your teammate claims the dispute is verbal because you could model the data either way. You claim it is substantive because the engineers keep arguing after canonicalization.

  Both of you are misdiagnosing the situation. The fact that the argument relocated to utility (query simplicity) proves the dispute was not about whether subscriptions *really* exist in a mind-independent sense. In software, existence is always relative to the system. The engineers were never doing metaphysics; they were doing engineering. They were arguing about which abstraction yields better performance or maintainability. By forcing a canonical language, you didn't resolve the dispute; you just stripped away the vocabulary they were using to discuss utility. When they started arguing about simplicity, they were returning to the actual stakes: pragmatic efficacy.

  Therefore, your "canonicalization" procedure fails as a test for verbalness. It tests for logical equivalence relative to a specific translation manual, not for agreement on facts. If two engineers propose different data models, they are proposing different "languages" for carving up the domain. If you force them into a third, neutral language, you aren't testing whether they agree on reality; you are testing whether their models are inter-translatable. They almost always are. You can model a subscription as a node or as a pattern of events. These are logically inter-translatable. But inter-translatability does not make the choice verbal; it makes it underdetermined by logic alone. The choice is then settled by pragmatic constraints: speed, clarity, cost.

  This leads to your suspicion: that since no formal language is privileged, there is no fact of the matter about existence, so ontology is just schema design. You feel this conclusion is too strong, and you are right. The bad step in your argument is the inference from "no *unique* privileged language" to "no *factual* constraints."

  This is a classic slide into relativism. Consider a map. There is no single privileged map of a city. You can have a subway map, a street map, or a zoning map. None is the "true" map in a framework-independent sense. However, it does not follow that "any schema is as good as any other." A subway map that omits stations is false relative to its purpose. A data model that causes race conditions is broken relative to its system. Conceptual relativity allows for multiple correct descriptions, not infinite incorrect ones. The facts of the domain (customer behavior, billing cycles) constrain which schemas work. Ontology in software is not "schema design with better marketing"; it is schema design with explicit attention to the categories that best support your intended inferences.

  So, what would a "verbalness linter" actually check? It cannot settle first-order questions about what there is, because in your context, "what there is" is determined by what you need to track. The linter can only check for logical equivalence given a translation manual. It can verify that Model A (subscription as node) and Model B (subscription as events) can simulate each other. If they can, the dispute is not about logical consistency. If the engineers still disagree, the linter should flag the dispute as "pragmatic," not "verbal."

  A verbal dispute in your context would look like this: Engineer A says, "A subscription exists," meaning "There is a row in the Subscriptions table." Engineer B says, "A subscription does not exist," meaning "There is no row in the Subscriptions table, only events." If they agree on the table structures and queries but fight over the word "exists," that is verbal. But if they fight over whether to create the table at all, that is a design dispute.

  Your mistake was assuming that because the metaphysical question ("Do subscriptions really exist?") lacks a framework-independent answer, the engineering question ("Should we model subscriptions as nodes?") lacks a correct answer. The former may be indeterminate, but the latter is settled by empirical facts about your system's performance and human usability. The residue you found wasn't metaphysics hiding behind pragmatics; it was pragmatics hiding behind metaphysics. Stop asking what exists and start asking what works. The ontology follows the utility, not the other way around.
