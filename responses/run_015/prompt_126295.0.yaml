      *Total:* ~1450 max. I need to be tight.

      *Revising Section 3:* To support the "event matters" thesis, Section 3 should acknowledge that while the river moves, the *specific* movement was catalyzed by the cut. The geology provides the potential, the event provides the actualization.

      *Let's refine the "Position":* The prompt asks to avoid the moral that individuals don't matter. So I must show Elias's choice *mattered*.
