      *   The prompt says: "rather than settling for the easier moral that individuals and their choices do not matter." This implies I should argue *against* pure determinism. So I will argue the *événement* is decisive.
      *   How to show this in Section 3? The river seeks the lowest point. Elias made the lowest point. Therefore, Elias dictated the path. The geology allowed it, but the event determined it.

      *Let's write.*

      *Section 1 (The Night):* Elias, the flood, the decision. The spade hitting the earth. The rush of water.
