answer: |-
  This is a brilliant brief. You are absolutely right that the standard Dollar Auction is a blunt instrument; it conflates structural traps, emotional attachment, and social performance into one messy explosion. To teach this well, you need to disentangle the wires so people can feel the specific tension of each one.

  Given your constraints (village hall rules, mobility issues, 90 minutes), here is a session plan designed to isolate the three mechanisms, test the "soft exit," and address the "no rival" reality of your boat situation.

  ### Session Title: The Leaky Hull
  **Time:** 90 Minutes
  **Participants:** 15 (mixed mobility)
  **Materials Needed:**
  *   **Tokens:** 150 small counters (poker chips, dried beans, or cut-up card squares). Let's call them "Labour Hours" (LH).
  *   **Boxes:** 15 small boxes or envelopes (one per participant), labelled "The Hull".
  *   **Dice:** 5 or 6 standard six-sided dice.
  *   **Cards:** Two colours of card (e.g., Red and Green) for those who cannot stand.
  *   **Prize:** A single tin of high-quality biscuits or chocolates (value approx. £5). This is the "Seaworthy Prize". It creates real desire without cash changing hands.
  *   **Whiteboard/Flipchart.**

  ---

  ### Minute-by-Minute Plan

  #### 0:00 – 0:10 | Introduction & The Currency of Effort
  **Goal:** Establish value without money and set the ground rules.

  1.  **Welcome:** Acknowledge the topic. "We're looking at why good people stick with bad plans."
  2.  **The Currency:** Hand out 10 Labour Hours (LH) to each person.
      *   *Crucial Step:* To make these feel 'earned' rather than free (mimicking your £30k), ask everyone to spend 3 minutes completing a tedious but accessible task. *Suggestion:* Copying a specific geometric pattern onto a piece of paper, or sorting a mixed pile of beans into two bowls.
      *   *Accessibility:* Ensure the task is fine-motor or mental. If someone cannot do the task, they are awarded the LH automatically by the "Hall Committee" (you) to ensure equity.
      *   **Script:** "These tokens represent your time. Once they go into 'The Hull', they are gone. You cannot get them back unless the project succeeds."
  3.  **The Prize:** Place the tin of biscuits at the front. "This is worth 20 LH to me. To you, it's whatever you want it to be."

  #### 0:10 – 0:35 | Round 1: The Solo Sink (The Trap & Sunk Cost)
  **Goal:** Isolate the structural trap and the feeling of waste *without* a rival or audience pressure.
  **Mechanism:** A solo game against probability where stopping guarantees loss.

  **Rules:**
  1.  Everyone plays alone. No talking.
  2.  The "Project" (a boat) has a hole. To keep it afloat for one more week, you must put LH into "The Hull" box.
  3.  **Cost Escalation:** Week 1 costs 1 LH. Week 2 costs 2 LH. Week 3 costs 4 LH. Week 4 costs 8 LH. (Doubling each time).
  4.  **The Risk:** At the end of each week, roll a die. On a 1, the "Pump Breaks" (Project fails immediately, all LH in the box are lost). On 2-6, it holds for another week.
  5.  **The Win:** If you survive 5 weeks, the boat is fixed. You get your LH back *plus* 20 LH from the bank (you can claim the biscuit tin).
  6.  **The Quit:** If you choose to stop, you put your remaining LH in your pocket, but everything in "The Hull" box is destroyed (returned to you).

  **Procedure:**
  *   Guide them through Week 1. Everyone puts 1 LH in the box. Roll a die publicly. (Hopefully it's not a 1).
  *   Ask for a show of hands: "Who is continuing to Week 2?"
  *   Continue until the majority drop out or the pump breaks.
  *   *Note:* Most will drop out around Week 3 or 4. The cost is high, the risk is accumulating.

  **What to watch:** People staring at the tokens already in the box. That is the Sunk Cost. The mathematical inevitability of the doubling cost is The Trap.

  #### 0:35 – 0:60 | Round 2: The Public Stand (Face & Rivals)
  **Goal:** Isolate social pressure and competition.
  **Mechanism:** Modified Dollar Auction with physical commitment.

  **Rules:**
  1.  Reset everyone's LH to 10.
  2.  Auctioning the same biscuit tin (Value 20 LH).
  3.  **Bidding:** Bids must be public.
      *   *Mobility Option:* If you can stand, stand up to bid. If you cannot stand, hold up a Red card. This makes the bid physically visible to the room.
  4.  **The Catch:** Highest bidder wins the tin and pays their bid. **Second highest bidder pays their bid and gets nothing.**
  5.  **The Escalation:** Bidding continues until only one person remains standing/holding the card.

  **Procedure:**
  *   Start low. It will move quickly.
  *   Once bids pass 10 LH (the total endowment), allow people to bid "Future Labour" (IOUs). This is where it gets real.
  *   Stop the auction if bids exceed 40 LH (to prevent genuine distress), declaring the "Market Crashed."

  **What to watch:** The moment someone drops out. Look at their body language. Do they look relieved or ashamed? Look at the two leaders: they are no longer bidding for the biscuits; they are bidding to avoid being the "runner-up loser." That is Face.

  #### 0:60 – 0:75 | Round 3: The Scrap Value (Softening the Exit)
  **Goal:** Test whether a "way out" reduces escalation.
  **Mechanism:** Repeat Round 1 (Solo Sink) but with a salvage rule.

  **Rules:**
  1.  Reset LH to 10.
  2.  Same doubling cost structure as Round 1.
  3.  **The Change:** At any point, you may declare "Scrap."
  4.  **The Salvage:** If you Scrap, you lose the LH in the box, *but* you receive a "Salvage Token" worth 5 LH from the bank immediately.
  5.  **The Catch:** You can only Scrap *before* you pay for the upcoming week. Once you pay, you're committed for that week.

  **Procedure:**
  *   Run the rounds again.
  *   Compare the drop-out rate to Round 1. Did people leave earlier because they could get something back? Or did they stay longer because the Salvage Token made them feel "safer" to risk one more week?

  #### 0:75 – 0:90 | Debrief: Mapping the Mechanics
  **Goal:** Connect the games to the theory and your boat.

  1.  **The Trap (Round 1):** "In Round 1, there was no enemy. Just maths. Why did it feel hard to stop?"
      *   *Point:* Locally rational decisions (spend 4 to save 20) lead to globally irrational outcomes.
  2.  **The Sunk Cost (Round 1 & 3):** "Look at the tokens in the box. They were yours. Now they aren't. Did that pain make you roll the dice again?"
      *   *Point:* We treat past costs as investments that *must* yield returns, rather than spent resources.
  3.  **The Face (Round 2):** "In Round 2, you weren't just fighting for biscuits. Who was watching?"
      *   *Point:* Escalation is often performance. We pay to avoid the social cost of admitting defeat.
  4.  **The Rival Question:** "Round 1 had no rival. Round 2 did. Which felt more like your real life?"
      *   *Point:* Most real-life escalation (like the boat) is solo or cooperative. The Dollar Auction is misleading because it implies an enemy. Often, the enemy is the situation.
  5.  **The Soft Exit (Round 3):** "Did the Scrap Value help?"
      *   *Point:* Sometimes safety nets allow us to take *more* risks, not less. (Moral Hazard).

  ---

  ### Predictable Failure Modes & Mitigations

  **1. The Cartel (Collusion)**
  *   **Risk:** In Round 2, two friends agree: "You bid 1, I bid 2, we split the biscuits." This breaks the escalation mechanic.
  *   **Mitigation:** Announce beforehand: "The winner must eat at least half the biscuits in front of the class." This makes the prize indivisible and slightly embarrassing to share. Or, add a rule: "Bids must be increased by at least 2 LH," making split-points harder.
  *   **If it happens:** Don't stop it. Use it in the debrief. "They escaped the trap by changing the game. In real life, can you change the rules?"

  **2. The Spite Bidder**
  *   **Risk:** One person bids 50 LH just to win, ruining the economy.
  *   **Mitigation:** Hard cap. "No one can bid more than 20 LH (double their endowment)." If they reach the cap, the auction ends.
  *   **Debrief:** "Why did they want to win so badly? Was it the biscuits, or was it not letting the other person win?"

  **3. The "It's Just a Game" Dismissal**
  *   **Risk:** Participants treat tokens as meaningless and quit Round 1 immediately.
  *   **Mitigation:** The "Effort Task" at the start is vital. They must *work* for the tokens. Also, you must treat the "Hull Box" with solemnity. When someone quits, visibly shred the paper tokens or pour the beans into a "Waste" bin. Make the loss physical.

  **4. Mobility & Standing**
  *   **Risk:** Round 2 requires standing, which excludes some.
  *   **Mitigation:** As noted, use Red/Green cards. But ensure the "Standing" bidders don't feel they have an advantage. The card must be held high. The visibility is the key, not the legs.

  **5. Emotional Resonance (You)**
  *   **Risk:** You get choked up during the debrief about the boat.
  *   **Mitigation:** This is not a failure. It is data. If you feel it, acknowledge it. "I find this one difficult personally." It validates the lesson. However, prepare a "parking lot" sentence: "I have my own version of this boat, which is why I teach this. But let's look at *your* decisions."

  ---

  ### What The Games Cannot Deliver (Be Honest Here)

  In your closing remarks, you need to say the things the mechanics can't prove.

  1.  **The "Identity" Trap:** The games show financial/time escalation. They don't capture the *identity* shift. In your boat case, you aren't just restoring a boat; you are "Grandson who honours Grandfather." Quitting isn't just losing money; it's losing a role. The games can't simulate grief. You have to name that.
  2.  **The "Hope" Variable:** In Round 1, the dice were cold. In real life, there is *uncertainty*, not risk. You don't know the odds. Sometimes, sticking with a failing plan *does* work out (the survivor bias). The game makes the odds clear; life does not. Acknowledge that sometimes the "sunk cost" believers get lucky, which makes it harder to stop next time.
  3.  **The Relationship Cost:** The game is individual. Your situation is with your brother. Escalation in relationships is often about *not hurting the other person* by withdrawing your support. That is a form of "Face," but it's altruistic face. The auction is selfish face. Distinguish these.

  ### A Note on the "Soft Exit" (Round 3)

  You asked if softening the exit helps. In behavioural economics, the answer is: **It depends on framing.**
  *   If the Salvage Value is framed as "Recovery," people take it and leave.
  *   If it is framed as "Consolation," people reject it to avoid feeling like a failure.
  *   **Instruction:** In Round 3, frame it neutrally. "You may claim Scrap Value." Do not call it a consolation prize. Watch if they treat it as a 'safety net' to take one more risky week (Moral Hazard). This is a nuanced point for your debrief: *Safety nets can sometimes encourage deeper falls.*

  ### Final Advice for the Tutor

  You mentioned your wife's suggestion makes you want to keep going. That is **Reactance**. It is a psychological impulse to restore freedom when it feels threatened.
  *   **In the class:** You might see this in Round 2. If you tell them "Don't bid over 10," they will.
  *   **For you:** Recognise that your brother pushing to continue might be triggering your reactance, just as your desire to quit might be triggering his. You are both bidding against each other in a Dollar Auction where the prize is "Being Right About Grandfather."

  This session plan gives you the vocabulary to separate the *money* (Trap), the *history* (Sunk Cost), and the *relationship* (Face). It won't fix the boat, but it might fix the argument.

  Good luck with the class. And with the boat.
