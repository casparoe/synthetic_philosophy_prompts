answer: |-
  Here is the translation of your four claims into the vocabulary of modern uncertainty quantification, followed by the residue report you requested.

  ### Part I: Translation of Claims

  **(i) Probability as a logical relation fixed by evidence**
  In your vocabulary, this asserts that model outputs should not be interpreted as subjective credences or psychological confidence levels, but rather as **calibrated** frequencies determined by the relation between the input features (evidence) and the target (conclusion). A **scalar model output** is valid only insofar as it reflects the objective structure of the data-generating process captured in the training set. This aligns with the frequentist or objective Bayesian view of **calibration**: if the model outputs 0.7, the event ought to occur 70% of the time in the long run, conditional on that evidence. The probability is a property of the evidence-model pair, not the agent's internal state.

  **(ii) Probabilities are neither necessarily numerical nor comparable**
  This claim rejects the necessity of **scalar model outputs** (such as softmax probabilities) for every query. It implies that for certain inputs, the model should return a **credal set** or a **set of predictive distributions** rather than a single point estimate. Within this set, the ordering is partial: for two propositions $A$ and $B$, the system may not be able to assert $P(A) > P(B)$, $P(A) < P(B)$, or $P(A) = P(B)$. Consequently, **proper scoring rules**, which require precise numerical probabilities to compute a gradient or loss, are inapplicable in these regions. The system acknowledges incomparability rather than forcing a ranking.

  **(iii) The weight of an argument is distinct from its probability**
  This quantity is not captured by the standard **aleatoric/epistemic decomposition**. Specifically, it is not equivalent to **epistemic uncertainty** (variance across a deep ensemble). An ensemble may exhibit low variance (tight agreement) despite being trained on scant data; in Keynes's terms, the probability might be precise, but the **weight** is low. Weight tracks the **sample size** and **information** content relevant to the specific prediction. It is monotonically increasing with evidence. A closer counterpart in your vocabulary is the **sensitivity of an output to perturbing or deleting part of the training set** (influences or stability). Weight measures the robustness of the conclusion to the removal of evidence, distinct from the spread of the predictive distribution.

  **(iv) No serviceable numerical probability exists for many practical propositions**
  This asserts that in cases of severe **distribution shift**, **model misspecification**, or **out-of-distribution (OOD)** detection, the failure to produce a probability is not due to insufficient **computing budget** (e.g., MCMC non-convergence) or patience. It is a fundamental limitation of the **evidence**. The system ought to detect that the input lies outside the support of the training distribution and abstain from emitting a **scalar model output**. The obstacle is ontological (the relation does not exist) rather than epistemological (we cannot compute it).

  ***

  ### Part II: Residue Report

  You asked which claims translate cleanly, which require smuggled assumptions, and which have no counterpart. You also asked specifically about the nature of "Weight" and whether "Evidential Fragility" is the correct counterpart.

  #### 1. Clean Translations vs. Smuggled Assumptions

  **Claim (i)** translates cleanly into **calibration**. However, there is a tension: modern deep learning treats probabilities as parameters to be optimised via **proper scoring rules** (e.g., cross-entropy). This implicitly assumes the probability *is* a subjective degree of belief that should be sharpened to minimise loss. Keynes's view requires us to treat probability as a static logical relation that we discover, not a parameter we tune. We smuggle in the assumption that the model *can* be tuned to match this logical relation solely by minimising empirical risk.

  **Claim (ii)** translates into **credal sets**, but this clashes violently with the engineering requirement to make decisions. To backpropagate, or to act in an environment, one usually requires a single comparable number. **Proper scoring rules** effectively impose the assumption that one must always emit a single comparable number. By adopting credal sets, you lose the ability to use standard gradient-based optimisation without significant modification. The residue here is a conflict between *descriptive accuracy* (the ordering is partial) and *prescriptive utility* (the loss function demands a total ordering).

  **Claim (iv)** translates well into **OOD detection** and **distribution shift**. The ML community largely agrees that numerical probabilities are meaningless far from the training manifold. The residue is minimal here, save for the fact that most OOD methods still output a scalar "OOD score," thereby reintroducing the comparability Keynes wished to avoid.

  #### 2. The Problem of Weight: Epistemic Uncertainty vs. Fragility

  Your suspicion is correct: **Weight is not Epistemic Uncertainty.**

  In standard **aleatoric/epistemic decomposition**, epistemic uncertainty is modelled as the variance across a **deep ensemble** or the spread of a posterior over weights. This measures disagreement among hypotheses that are all consistent with the data.
  *   *Scenario:* Imagine a dataset with one point. You fit a model class that is highly constrained (e.g., a linear model with strong regularisation). The ensemble members will all agree tightly (low epistemic uncertainty).
  *   *Keynesian View:* The **weight** is minimal because the **sample size** is one.
  *   *The Mismatch:* Your vocabulary equates "low uncertainty" with "high confidence." Keynes distinguishes "high confidence" (probability) from "high confidence *based on substantial evidence*" (weight).

  **Is Evidential Fragility the right counterpart?**
  Yes, **sensitivity of an output to perturbing or deleting part of the training set** is the nearest functional counterpart to Weight, though it is not identical.
  *   *Why it fits:* If the **weight** is low, the conclusion rests on scant evidence. Therefore, deleting a small portion of the training set should significantly alter the **scalar model output**. If the weight is high, the output is stable under such perturbations.
  *   *Why it differs:* Fragility measures *instability*. Weight measures *volume of evidence*. In a well-specified model, these correlate inversely. However, in a misspecified model, you can have high fragility (unstable) but high sample size (high weight, just conflicting).
  *   *Verdict:* Fragility is the operational proxy you possess. It captures the "balance between relevant knowledge and relevant ignorance" by testing how much the ignorance (the unobserved data points) matters. If the prediction moves wildly when you delete a point, your "ignorance" is doing heavy lifting.

  #### 3. The Blind Spot and Its Cost

  There is a real blind spot in the machine-learning vocabulary, and it costs you in **high-stakes, low-data regimes**.

  **The Blind Spot:**
  Your framework optimises for **calibration** and **accuracy** on a test set. It does not optimise for **Weight**. You can have a perfectly calibrated classifier that is calibrated on thin air. For example, a model might be perfectly calibrated on an **OOD** detection task (it knows it doesn't know), but within the in-distribution set, it may treat a prediction based on 10 samples the same as a prediction based on 10 million samples, provided the **scalar output** is identical.

  **The Practical Cost:**
  1.  **Brittleness:** Systems fail when the environment changes slightly because they rely on predictions with high probability but low weight. They are confident but fragile.
  2.  **Misallocated Trust:** In decision-making (e.g., medical diagnosis, finance), a user cannot distinguish between "90% probability based on a million cases" and "90% probability based on a heuristic fit to ten cases." Your **second-order probabilities** usually capture model disagreement, not evidential depth.
  3.  **The "Agreement on Nothing" Failure:** As you noted, a **deep ensemble** can agree tightly (low epistemic uncertainty) while resting on almost nothing (low weight). If you rely on ensemble variance to gate decisions, you will proceed with high confidence in scenarios where Keynes would advise abstention due to low weight.

  **Was Keynes Vague?**
  Keynes was less well-defined than it sounds, primarily because he lacked the formal machinery to define "relevance" of evidence rigorously. However, he was not merely gesturing. He identified a dimension of uncertainty that **proper scoring rules** collapse. By forcing a single number to minimise loss, we project the 2D plane of (Probability, Weight) onto the 1D line of Probability.

  **Conclusion:**
  You cannot recover Keynesian Weight solely through **aleatoric/epistemic decomposition**. You must introduce a metric of **information density** or **stability** (fragility) that is orthogonal to the predictive variance. If you do not, your uncertainty quantification is complete only for worlds where sample size is infinite or irrelevant. In the finite data regime, you are measuring the spread of your guess, not the weight of your ground.
