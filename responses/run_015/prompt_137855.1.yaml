  *(Another thought)*: Step (2) is also problematic ("fact of the matter"). But (4) is the substantive claim about *how* that fact is determined. Rejecting (4) allows us to say there *is* a fact of the matter, but it's procedure-dependent. So (2) can stay if modified to allow procedure-dependent facts. But (4) says procedure is *accidental*. That's the lie. So reject (4).

  *(Final check on (8))*: The referee says if (2)-(6) work on people, agency is dead. If we reject (4) for collectives, do we reject it for individuals? Yes. Individuals resolve cycling via internal deliberation (procedure). So agency survives. Populism dies because it claims the collective will exists *prior* to procedure.

