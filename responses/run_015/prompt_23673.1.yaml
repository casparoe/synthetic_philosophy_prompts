      *   *Context:* This comes from the literature on dispositional properties (fragility, solubility, etc.), often associated with C.B. Martin, David Lewis, and the "Simple Conditional Analysis" (SCA) debates.
      *   *Finkish Disposition:* A disposition is "finked" if the stimulus itself (or something triggered immediately by the stimulus) causes the disposition to disappear *before* the manifestation can occur. Crucially, the intrinsic basis of the disposition is removed or altered *in response to* the stimulus.
      *   *Masked Disposition:* A disposition is "masked" if the disposition remains intact (the intrinsic basis is still there), but an extrinsic factor prevents the manifestation from occurring despite the stimulus.
      *   *Key Distinction:* Does the object *still have the property* at the moment of testing?
          *   Fink: No (property lost/changed).
          *   Mask: Yes (property present, manifestation blocked).

