  I'm stuck on a distinction Hannah Arendt draws between a lie and propaganda, and I keep blurring them in a draft of mine. I think her crux is that a lie only works if the audience is willing to believe it — the whole thing rides on credulity — whereas propaganda doesn't care whether you believe it, it just swaps out the facts for one consistent story. Could you make the strongest case for why this distinction actually does some real philosophical work rathe than being a verbal tic of hers, and spell out what it would mean for how we ought to respond to each? I need to feel like the two responses are genuinely different or the distinction isn't worth keeping.
reasoning: |-
