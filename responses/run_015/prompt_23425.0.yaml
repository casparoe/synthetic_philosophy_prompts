      *   *The Lie:* Traditional lying. Hiding the truth. It acknowledges the truth exists but tries to conceal it. It requires the liar to know the truth and the audience to be capable of believing the alternative. It respects the reality it hides (parasitic on truth).
      *   *Propaganda (specifically Totalitarian Propaganda):* It's not just lying. It's reshaping reality itself. It creates a consistent fictional world. Arendt often links this to "organization of loneliness" and "ideological consistency."
      *   *Key Nuance:* The user's definition of propaganda ("doesn't care whether you believe it") is slightly off or needs nuance. Arendt argues propaganda *does* want belief, but it aims for something deeper: *loyalty* to the movement/ideology regardless of factual accuracy. It destroys the *capacity* to distinguish truth from falsehood.
