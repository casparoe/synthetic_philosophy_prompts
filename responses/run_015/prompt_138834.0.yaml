  2.  **Deconstruct the View (The 8 Commitments):**
      *   (1) **Epiphenomenal Property Dualism:** Phenomenal properties (qualia) exist, are non-physical, but cause *nothing*. Neural states cause behavior.
      *   (2) **Introspective Judgments:** Beliefs about experience are knowledge, non-inferential. Mechanism: Common Cause (Neural state causes both Experience and Judgment). "Covariance Patch."
      *   (3) **Knowledge = Safe True Belief (STB):** No causal/explanatory link needed between fact and belief. Nomic covariance suffices.
      *   (4) **Acquaintance-Based Phenomenal Concepts:** Experience *constitutes* the content of the judgment. Experience is "present to the subject."
      *   (5) **Content Causal Relevance:** Beliefs cause things *in virtue of their content* (not just neural vehicle).
      *   (6) **Moral Relevance of Pain:** Badness is phenomenal. Moral relevance doesn't need causal efficacy.
      *   (7) **Inversion Case:** Inverted spectrum counterpart makes same judgments. I have knowledge. (Consistent with covariance).
      *   (8) **Silent Case (Zombie-ish):** Physically identical being, no experience. Makes same judgment ("I am in pain"). *Not* knowledge. Difference undetectable by third parties.

