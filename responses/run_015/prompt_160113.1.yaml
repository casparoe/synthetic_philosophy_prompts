  **OFFICE OF GEOMETRIC WELFARE**  
  **LONG-RUN GROWTH DIRECTORATE**  
  **NOTICE OF MANDATORY QUARTERLY REBALANCING**  
  **REF: KELLY-ALIGNMENT STATUTE 44-B**

  **TO ALL CAPITALIZED UNITS:**

  Pursuant to the Maximization of Geometric Progress Act, every adult citizen is hereby required to wager the Kelly-optimal fraction of their Total Capitalized Bankroll (TCB) on the National Compounding Opportunity each quarter. Your TCB is defined not merely as liquid assets, but as the net present value of all future earnings, social capital, marital equity, and remaining health-years. Diversification is discouraged; concentration maximizes growth rates.

  **1. STATUTORY UTILITY FUNCTION**

  The Bureau decrees that utility is logarithmic in wealth. This is not a matter of preference but of dimensional consistency. Under log utility, ruin (wealth = 0) yields negative infinity utility and is therefore mathematically impossible under compliant betting fractions. Since the Kelly criterion never mandates a wager of 100% unless probability is unity, your bankroll will never reach zero. Citizens are reminded that a loss of 99% of total capital corresponds to a utility decrease of exactly 4.6 units. This is precisely offset by a single hundredfold gain. The Bureau considers these outcomes interchangeable. Do not lament drawdowns; they are merely the price of volatility harvesting.

  **2. PROJECTED WEALTH AND GROWTH ASYMMETRY**

  Citizens should consult the following worked example regarding expected outcomes. Consider a citizen with an edge of 20% in a binary opportunity. The mandated fraction is 20%.

  *   **Arithmetic Expected Wealth:** Compounds at the arithmetic mean rate. In this scenario, expected wealth doubles every 3.5 years.
  *   **Median Realized Wealth:** Compounds at the geometric rate. In this scenario, median wealth doubles every 7 years.

  The Bureau highlights the Arithmetic Expected Wealth in all publicity materials. That the median citizen will never attain this figure is a feature of the distribution, not a bug. The ensemble average is the only true average.

  Furthermore, citizens must respect the asymmetry of the growth curve. Betting half the optimal fraction retains 75% of the maximal growth rate—a conservative tolerance. However, betting twice the optimal fraction reduces the geometric growth rate to zero. Overbetting is punished far more severely than underbetting. Therefore, the Bureau's mandated fractions are computed using official probabilities. These probabilities are forward-looking estimates issued by the State. They are not claims about objective truth, but regulatory inputs. Compliance ensures you remain on the safe side of the peak.

  **3. FREQUENTLY ASKED QUESTIONS**

  **Q: Does this apply to non-monetary assets?**  
  A: Yes. Your career is a bankroll subject to reinvestment. A career change is a rebalancing event. You must wager the Kelly fraction of your remaining working years on the highest-expected-value path. Hedging via hobbies is non-compliant.

  **Q: What about marriage?**  
  A: Marriage is a leveraged position in emotional capital. You must allocate the optimal fraction of your relational bandwidth to the spouse with the highest geometric growth potential. Divorce is simply a stop-loss order executed upon negative edge detection.

  **Q: Is the Kelly criterion optimal for short time horizons?**  
  A: With logarithmic utility, Kelly is optimal at every horizon, from one period to infinity. Impatience is not a valid objection. If you feel distress at a finite horizon outcome, your utility function is misaligned with statute.

  **Q: What if the official probabilities are wrong?**  
  A: Probabilities are regulatory instruments. If the true edge differs from the official edge, the growth rate will adjust accordingly. However, since all citizens use the same official probabilities, systemic risk is correlated, which ensures societal coherence.

  **Q: Can I opt out due to risk aversion?**  
  A: Risk aversion is a cognitive error arising from linear intuition. Logarithmic utility captures the true diminishing marginal value of utility units. There is only one utility function.

  **Q: How do I report a discrepancy?**  
  A: Discrepancies between your lived experience and the projected arithmetic mean are to be expected. Variance is not error.

  **4. COMPLIANCE AND REVIEW**

  Failure to rebalance quarterly will result in geometric underperformance relative to the state median. Appeals regarding hardship must be filed in triplicate. Please note that the Bureau's complaints procedure operates on an asymptotic timeline. All grievances are queued for adjudication at $t \to \infty$, at which point the ergodic property guarantees that all claims will be resolved in the aggregate. Until then, keep betting.

  **DIRECTORATE OF LONG-RUN GROWTH**  
  *"The Limit is the Law"*
