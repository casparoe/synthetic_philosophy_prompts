answer: |-
  ### Essay Question

  **Mira's Journal**

  Mira has noticed that some of her dreams seem to anticipate the next day — she dreams about a flat tire and next morning the tire is flat, she dreams about a friend she hasn't thought about in years and that friend texts her that afternoon. So she starts a journal: every morning she writes down the night's dream, and every evening she marks whether anything in it matched the day. After a year she counts up the entries that have a recorded match, finds a few dozen of them, and concludes that her dreams are weakly predictive of the following day. On that basis she starts treating a vivid dream as evidence about tomorrow — she cancels a flight because she dreamed about a crash. Her flatmate says this is circular, she's using the dreams to license the dreams. Mira says no, it's just an ordinary track-record argument, same shape as the one that establishes a thermometer works.

  **Write an essay responding to the following prompt:**

  Defend a specific verdict on whether Mira's flatmate is correct: is Mira's reasoning viciously circular, or does she gain genuine justification? In your defense, you must: (1) identify the specific detail in Mira's procedure that distinguishes it from the standard 'gas gauge' bootstrapping case; (2) explain what a track-record argument requires to avoid bootstrapping; and (3) argue whether rejecting Mira's reasoning would force us to reject other basic sources like memory or induction. Do not merely summarize the case; take a position and justify it.

  ***

  ### Model Answer

  Mira's flatmate is incorrect: Mira's reasoning is not viciously circular, and she does gain justification for believing her dreams are predictive. While the structure resembles a bootstrapping argument, the specific methodology Mira employs avoids the epistemic defect found in standard cases like Vogel's gas gauge. The verdict rests on the distinction between checking a source against the world versus checking a source against itself, and crucially, on the temporal fixation of the data.

  To understand why Mira is justified, we must first isolate why the gas gauge case fails. In the standard bootstrapping scenario, a driver looks at a gauge reading 'Full', looks at the tank to see it is full, and concludes the gauge is reliable. The epistemic defect is that the driver often relies on the gauge to determine the tank's level in the first place, or lacks independent access to the fact. If the gauge is the only access to the fact, the argument is question-begging; it assumes the reliability it seeks to prove.

  Mira's case avoids this trap due to a specific detail: **she writes the dream down in the morning, before the day's events occur.** This pre-recording creates a fixed record independent of the outcome. In the gas gauge case, the reading and the state of the tank are simultaneous, allowing the subject's belief about the tank to be contaminated by the gauge reading. Mira, however, locks in the prediction *ex ante*. When she verifies the match in the evening, she is not using the dream to determine if the tire is flat; she uses ordinary perception. She compares a fixed past record (the journal) against a present observation (the flat tire). Because the verification of the event relies on perception, not the dream itself, the circle is broken. She is not using the dream to verify the dream; she is using perception to verify the dream's accuracy.

  For a track-record argument to avoid bootstrapping, it requires two conditions: independent access to the truth of the propositions, and a method of recording that prevents hindsight bias. Mira meets both. She perceives the tire independently of the dream. She recorded the dream before the tire went flat, preventing her from unconsciously altering the memory of the dream to fit the event. This makes her argument a genuine inductive generalization based on empirical data, rather than a doxastic assurance. If she had simply remembered the dreams in the evening and checked for matches, the flatmate's objection would hold, as memory is susceptible to reconstruction based on current knowledge. The journal acts as an external hard drive for her beliefs, insulating the data from contamination.

  Finally, we must consider whether rejecting Mira's reasoning proves too much. If we claim that one cannot use a source's track record to establish its reliability without antecedent proof of that reliability, we undermine all empirical learning. We establish the reliability of our memory, perception, and inductive reasoning precisely through track-record arguments. We trust memory because it has cohered with perception in the past. We trust induction because it has predicted successfully before. If Mira is barred from using her journal to validate her dreams, then by parity of reasoning, we are barred from using past successful perceptions to validate current perception. This leads to skepticism. Since we are not skeptics about memory or induction, we cannot consistently condemn Mira's method. Her process is the scientific method in miniature: hypothesis (dream), prediction (journal), observation (evening check), conclusion.

  Therefore, Mira is justified. The flatmate confuses the use of a source for prediction with the use of a source for verification. Mira uses the dream only for the former, and perception for the latter. Provided her perception and her journal-keeping are reliable, her conclusion follows legitimately. To deny this is to deny the possibility of ever learning that a new source is reliable, which is an untenable epistemic position.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Clear Verdict (4 Marks)**
  *   **Requirement:** Student must explicitly state whether Mira is justified or not (e.g., "Mira is justified" or "The flatmate is wrong"). Ambivalence loses marks.
  *   **Typical Failure:** Hedging ("It depends on how you look at it") without committing to a defended position.

  **2. Analysis of the Circularity Charge (4 Marks)**
  *   **Requirement:** Must explain *why* bootstrapping is usually problematic (using the source to verify the source/lack of independent access to the fact).
  *   **Typical Failure:** Merely stating "it is circular" without explaining the epistemic mechanism of the failure (e.g., question-begging).

  **3. Identification of the 'Shift' Detail (4 Marks)**
  *   **Requirement:** Must identify the **morning journal entry/pre-recording** as the crucial factor. This fixes the content *before* the event, preventing hindsight bias/confirmation bias and distinguishing it from simultaneous checking.
  *   **Typical Failure:** Focusing on the "year-long" duration or the "counting" rather than the temporal gap and fixed record.

  **4. Requirements for a Valid Track-Record (4 Marks)**
  *   **Requirement:** Must articulate that a non-bootstrapping track record requires **independent verification of the facts** (using perception, not the dream, to check the tire).
  *   **Typical Failure:** Suggesting that *no* track-record argument is ever valid, or failing to specify the need for independent access to the truth.

  **5. The 'Proves Too Much' Argument (4 Marks)**
  *   **Requirement:** Must argue that banning this reasoning undermines **memory, induction, or perception** (i.e., we validate these via track-records too).
  *   **Typical Failure:** Discussing skepticism generally without linking it specifically to the validation of basic cognitive faculties.

  **Differentiation Guide:**
  *   **16–20 Marks (A Range):** Answers commit to a verdict and seamlessly integrate the "morning journal" detail as the *reason* the circularity is broken. They clearly distinguish between using a source for *prediction* vs. *verification*. The "proves too much" section is specific (naming memory/induction).
  *   **12–15 Marks (B Range):** Answers identify the case as a track-record argument and discuss bootstrapping correctly but miss the significance of the **morning recording** (the "Shift"). They may treat it as identical to the Gas Gauge case or focus on the length of time (one year) rather than the pre-commitment. The "proves too much" argument is vague.
