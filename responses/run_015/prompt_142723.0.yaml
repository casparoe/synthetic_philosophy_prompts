answer: |-
  This is a sharp question. You have correctly identified that the standard "Old Evidence" literature (Glymour, Garber, Jeffrey) focuses on the *logical* relation between theory and evidence (does $T$ entail $E$?), and the standard "Use-Novelty" literature (Zahar, Worrall, Mayo) focuses on a binary distinction (was $E$ used to construct $T$?).

  Your wrinkle is that "construction" isn't binary. It's a pipeline. Data can leak into the pipeline at the parameter stage (fitting), the hyperparameter stage (model selection), or the architectural stage (choice of formalism). The literature often treats "parameter fitting" as the only disqualifying form of use, leaving the "architectural shaping" in a normative blind spot.

  Here is the breakdown of the nearest existing concepts, why they fall short of your specific carving, and a proposal for a term and definition that captures the gradient you are seeing.

  ### 1. The Nearest Existing Concepts

  **A. Heuristic vs. Constructive Use (Worrall/Zahar)**
  John Worrall (1978, 1985) explicitly tackles this. He distinguishes between *constructive use* (data used to fix parameters) and *heuristic use* (data used to guide the intuition or choice of framework). Worrall argues that heuristic use does *not* necessarily destroy confirmation, provided the data wasn't used to fix the parameters.
  *   **Why it misses your mark:** Worrall treats heuristic use as a binary switch. Either the data was a "guide" or it wasn't. He doesn't offer a metric for *how much* the guide shaped the path. If a theorist chooses a formalism *because* it looks like it might handle $E$, Worrall might call this "heuristic" and allow confirmation. You are correctly sensing that if the formalism was chosen *specifically* to capture $E$, it shouldn't count as a prediction, even if no parameters were tuned.

  **B. Severity (Mayo)**
  Deborah Mayo (1991) argues that data confirms a hypothesis only if it has passed a **severe test**. A test is severe if it would likely have rejected the hypothesis if the hypothesis were false.
  *   **Why it misses your mark:** This is closer to your intuition. If the model was shaped to accommodate $E$, it couldn't have failed $E$, so the test isn't severe. However, "Severity" is usually applied to the *testing* phase, not the *model selection* phase. It lacks the vocabulary to describe the *degree* to which the model class itself was biased toward $E$ during construction.

  **C. Overfitting and Model Complexity (Hitchcock & Sober)**
  In *Prediction vs. Accommodation and the Risk of Overfitting* (2004), Hitchcock and Sober use Akaike Information Criterion (AIC) logic. They argue that accommodation is suspect because it allows the model to fit noise (overfitting).
  *   **Why it misses your mark:** This is the "stats person" angle you might appreciate. However, they focus on the number of *parameters*. Your case is about the choice of the *model class* (the formalism itself). In stats terms, you are describing **hyperparameter tuning** or **model selection bias**, where the "cost" isn't in the degrees of freedom of the parameters, but in the search space of the architectures.

  ### 2. The Carving: What Property Matters?

  The property you are looking for is not whether the data was *known*, but whether the **selection of the hypothesis space was independent of the data.**

  In standard Use-Novelty, we ask: "Was $E$ used to set the parameters of $T$?"
  In your cases, the question is: "Was $E$ used to select the *class* of models from which $T$ was drawn?"

  If the theorist chooses a Bayesian network over a frequentist regression *because* she suspects it will handle the voting regularity $X$, she has reduced the **Search Space** based on $X$. She has spent "confirmatory capital" before the test even begins.

  ### 3. Coining the Term: "Architectural Leakage"

  I propose we call this phenomenon **Architectural Leakage** (or **Structural Leakage**).

  This distinguishes it from **Parametric Leakage** (standard curve fitting).
  *   **Parametric Leakage:** Adjusting $\theta$ to match $E$. (Everyone agrees this kills confirmation).
  *   **Architectural Leakage:** Selecting the functional form, the logic, or the formalism *because* it appears capable of capturing $E$, even if $\theta$ remains free.

  **Definition:**
  > **Architectural Leakage** occurs when background evidence $E$ influences the selection of the model class $\mathcal{M}$ (the formalism, logic, or structural assumptions) rather than the specific parameter values $\theta \in \mathcal{M}$, such that the probability of selecting $\mathcal{M}$ is conditional on $E$, even if $E$ is not explicitly used to estimate $\theta$.

  ### 4. The Normative Standard: "Counterfactual Model-Class Stability"

  To sort out your boundary cases, you need a metric for how much leakage occurred. I propose the standard be **Counterfactual Model-Class Stability (CMCS)**.

  **The Question:** *In the counterfactual world where the theorist did not know $E$ (or $E$ was different), would she have selected the same model class $\mathcal{M}$?*

  *   **High Stability:** The theorist picks a formalism for reasons entirely independent of $E$ (e.g., mathematical elegance, consistency with other fields). $E$ turns out to fit. **Verdict:** Legit Prediction.
  *   **Low Stability:** The theorist picks the formalism *because* it looks like it can handle $E$. **Verdict:** Architectural Accommodation (cooked).
  *   **Middle Zone:** The theorist picks a formalism for general reasons, but $E$ acts as a "tie-breaker" between two otherwise equal variants. **Verdict:** Partial Confirmation (discounted).

  ### 5. Applying the Carving to Your Boundary Cases

  Here is how **Architectural Leakage** and **CMCS** handle the specific wrinkles you mentioned:

  **Case 1: The Community Knows, Theorist Doesn't**
  *   *Scenario:* The voting regularity $X$ is common knowledge in the field. The theorist is new and doesn't know $X$. She builds a model that explains $X$.
  *   *Analysis:* There is no *individual* Architectural Leakage. However, there is **Sociological Leakage**. The model class $\mathcal{M}$ she is using was likely developed by a community that already optimized for $X$.
  *   *Verdict:* If the *tools* she uses were shaped by $X$, the confirmation is diluted. The "independence" must be traced back to the origin of the formalism, not just the individual user.

  **Case 2: The "Tie-Breaker" (Your Notebook Scenario)**
  *   *Scenario:* Two formalisms look equally promising on general grounds. She picks the one that looks like it might handle $X$.
  *   *Analysis:* This is **Partial Architectural Leakage**. The selection of $\mathcal{M}$ was 50% independent, 50% conditioned on $X$.
  *   *Verdict:* The confirmation value of $X$ should be discounted by half (metaphorically). It is not a "prediction," it is a "fulfilled expectation."

  **Case 3: Deliberate Avoidance (Blind Analysis)**
  *   *Scenario:* She knows $X$ exists but deliberately refuses to look at the specific values until the model is done.
  *   *Analysis:* This minimizes Parametric Leakage but does not guarantee CMCS. If she chose the *type* of model because she knew the *kind* of phenomenon $X$ was, leakage remains.
  *   *Verdict:* This is the cleanest case, but only if the *motivation* for the model class wasn't $X$. If she built a voting model *to solve* the voting problem, $X$ is the target, and CMCS is low. If she built a general decision model and *happened* to test it on voting, CMCS is high.

  ### 6. Why This Fits Your "Stats Person" Intuition

  In machine learning, we distinguish between **training data** (used for parameters) and **validation data** (used for model selection).
  *   Standard PhilSci says: "As long as $E$ isn't training data, it's validation."
  *   Your insight: "If $E$ influenced the choice of the algorithm itself, it contaminated the validation set."

  By calling this **Architectural Leakage**, you import the rigorous intuition from stats that **model selection costs degrees of freedom**. When a philosopher claims a "prediction," they are claiming the model survived a test. But if the model was selected *because* it was the type of thing that would survive that test, the degrees of freedom were spent during construction, not testing.

  ### Summary Recommendation

  Don't use "Heuristic Use" (too binary/Worrall-specific) or "Old Evidence" (too logical/Garber-specific).

  Use **Architectural Leakage**.
  Define the normative standard as **Counterfactual Model-Class Stability**.
  Argue that confirmation is proportional to the stability of the model class selection in the absence of the evidence.

  This gives you the gradient you need: Leakage isn't on/off; it's a measure of how much the evidence narrowed the search space of possible theories before the "test" began.
