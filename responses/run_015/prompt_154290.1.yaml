  I'm prepping questions for a podcast interview with a philosopher who's defending a pretty specific twist on the killing vs letting die debate. She thinks the distinction collapses not in ordinary withdrawal-of-care cases but in what she calls institutional omission—where a system is arranged so that rescue is structurally impossible for one group, not because anyone actively withholds it but because the pathway is just absent. I want maybe six or seven questions written as one continuous block of prose with no bullet points bold text headings or tables, just like you'd write in an email. They should push on whether this is just killing by another name, on how the Doctrine of Double Effect applies when the harm comes from absence rather than action, and on whether her small-scale analog—a homeowner who removes a ladder knowing firefighters will be blocked—really maps onto policy-level triage. One follow-up should anticipate her likely reply that intent gets distributed across institutions and ask what that does to moral responsibility. Keep it casual, its fine if there's a typo or two.
