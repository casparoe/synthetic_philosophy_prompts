answer: |-
  **Seminar Plan: Contractualism and the Aggregation Problem**
  **Time:** 90 Minutes
  **Level:** 2nd Year Undergraduates (Util/Kant background, No Contractualism)
  **Core Objective:** Distinguish intra-personal composition of burdens from inter-personal aggregation.

  ### I. Pre-Seminar Preparation: The Intelligibility Conditions
  Before the distinction between "composing within a life" and "summing across lives" makes sense to students, three conceptual prerequisites must be laid on the table in the first 20 minutes. If these are missing, the noise case will look like semantic trickery.

  1.  **The Unit of Justification:** Students must grasp that for Scanlon, the fundamental moral question is not "What produces the best state of affairs?" but "What principles can be justified *to each person*?" This shifts the focus from the *sum* to the *standpoint*.
  2.  **The Individualist Restriction:** They must understand that we compare principles by looking at the strongest complaint any *single* individual has against them. We do not add up complaints to make a bigger complaint.
  3.  **Generic Reasons:** Students need to know that objections must be based on generic reasons (reasons anyone in that position would have), not idiosyncratic preferences. This prevents the view from collapsing into subjectivism.

  ### II. Session Sequence

  #### 1. Introduction & Definitions (0:00–0:20)
  *   **Hook:** State your disagreement with your friend directly. "My friend says 200 nights for one person is the same as 1 night for 200 people. I say contractualism sees a moral difference. By the end of this hour, you will decide who is right."
  *   **Head Off Misconception #1 (Actual Complaining):** Define "Reasonable Rejectability" immediately.
      *   *Point:* It does not mean people *would* complain. It means they *could* reasonably complain given a desire to find mutually acceptable principles.
      *   *Why here:* If they think this is about psychological grumpiness, the rest of the seminar fails.
  *   **Contrast:** Briefly map Utilitarianism (Sum of welfare) vs. Contractualism (Comparison of individual standpoints). Use their Kant knowledge: "Think of this as the Categorical Imperative operationalized as a veto power, but a *reasonable* veto."

  #### 2. The Core Case: "The Night Shift" (0:20–0:50)
  *   **The Setup:** Present the factory noise case, but strict adherence to your constraints:
      *   **Certainty:** No risk/probability. The policy *will* cause the noise.
      *   **No Consent:** The residents did not agree to move there; the policy is imposed by a zoning board.
      *   **Non-Catastrophic:** The sleep loss is mild. It affects quality of life, but causes no health collapse or death.
      *   **Scenario A:** One resident (Alice) suffers 200 consecutive nights.
      *   **Scenario B:** Two hundred residents suffer 1 night each.
  *   **The Exercise:** Split the room. Half argue for Scenario A, half for Scenario B, using *only* contractualist language (i.e., "Could Alice reasonably reject?" vs. "Could any single resident in B reasonably reject?").
  *   **The Pivot (0:40):** Guide them to the crux.
      *   In **A**, Alice has a strong generic reason to reject. The burden composes *within her life* to create a significant hardship.
      *   In **B**, any single resident has a weak generic reason. One bad night is trivial.
      *   *Crucial Move:* Ask, "Can the 200 residents in B pool their complaints to match Alice's?"
      *   *Answer:* No. Contractualism forbids inter-personal aggregation. We compare Alice's strongest complaint against the strongest complaint of any single person in Group B.
  *   **Head Off Misconception #2 (Numbers Never Matter):**
      *   *Timing:* Immediately after the Pivot.
      *   *Point:* Students will cry, "So you'd sacrifice 200 people for one?" Clarify that numbers *can* matter in contractualism (e.g., if the burden in B were slightly higher, or if the single person's burden were trivial), but they matter differently. They don't sum; they affect the *strength* of the generic reason or the availability of alternative principles. But in *this specific case*, the structure forbids summing trivial burdens to outweigh a serious one.

  #### 3. Structural Objections (0:50–1:05)
  *   **Head Off Misconception #3 (The Collapse Objection):**
      *   *The Worry:* "If anyone can reject any principle, nothing gets done. Someone always loses out."
      *   *The Fix:* Distinguish between "having a cost" and "having a reasonable ground for rejection." A principle is not rejectable just because it burdens you; it is rejectable if the burden is too high *given the alternatives*.
      *   *Application:* In the Night Shift, is there an alternative? If the factory must run, someone must suffer. If the choice is A or B, the residents in B cannot reasonably reject B because their burden is trivial compared to Alice's in A.
  *   **Refine the Distinction:** Reiterate the seminar's thesis. Utilitarianism asks: "Where is the pain located?" Contractualism asks: "To whom must this be justified?" The distinction between composing within a life and summing across lives is only intelligible once we accept that justification is owed to individuals, not collectives.

  #### 4. Conclusion & The Tie-Breaker (1:05–1:15)
  *   **Summary:** Recap why your friend's utilitarian intuition (total burden is all that matters) fails to capture the separateness of persons.
  *   **The Closing Question:** Pose this to test their grasp of the limits of the view.
      > "Imagine we must impose a burden of 200 nights of sleep loss. We have two candidates: Alice, who lives alone, and Bob, who lives alone. The burden is identical. The generic reasons for rejection are identical. Contractualism tells us we cannot impose this if a less burdensome alternative exists. But if we *must* choose one of them, does contractualism give us a moral reason to pick Alice over Bob, or does it declare the choice morally arbitrary?"
      *   *Desired Answer:* They should recognize that when grounds for rejection are equal, contractualism runs out of distinguishing resources. It likely defaults to procedural fairness (a lottery) rather than substantive moral difference. This shows they understand that the view relies on *comparative strength of complaints*, not just minimizing suffering.

  #### 5. Buffer/Q&A (1:15–1:30)

  ### III. What to Explicitly Refuse to Cover
  To keep this intelligible for second-years in 90 minutes, you must draw a hard line on the following. If students raise them, park them for a third-year module:

  1.  **Ideal vs. Actual Contract:** Do not get bogged down in whether the contractors are real or hypothetical. Stick to the "reasonable rejectability" criterion as a test for principles.
  2.  **Global vs. Local Contractualism:** Do not discuss whether this applies to institutions (Rawls) or individual morality (Scanlon). Treat it as a method for assessing moral principles generally.
  3.  **Scanlon's Later Revisions:** Scanlon modified his view on aggregation in later papers (e.g., *Does Contractualism Require the Aggregation Problem?*). Stick to the core *What We Owe to Each Other* framework. Introducing his later doubts will confuse the structural point you are trying to teach.
  4.  **Tie-Breaking Mechanics:** Do not go into deep theories of randomness or lotteries. The point of the closing question is to show the *limit* of the theory, not to solve the limit.

  ### IV. Instructor's Cheat Sheet for the "Noise Case"
  *   **If they say:** "But 200 people are angry!"
      *   **You say:** "Anger isn't a generic reason. One bad night is not a strong generic reason."
  *   **If they say:** "So Alice matters more than the 200?"
      *   **You say:** "Alice's *complaint* is stronger than any single one of the 200. We compare complaints, not headcounts."
  *   **If they say:** "This is just Utilitarianism with extra steps."
      *   **You say:** "Utilitarianism would allow hurting Alice if it saved the 200 even trivial inconveniences that summed to a large number. Contractualism forbids using Alice as a means to absorb the sum of trivialities."
