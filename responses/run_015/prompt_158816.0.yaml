  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Aggregation Problem:* Utilitarianism sums welfare. Contractualism compares individual standpoints.
      *   *The Specific Distinction:* Intra-personal aggregation (allowed/inevitable) vs. Inter-personal aggregation (forbidden/limited).
      *   *The Noise Case:* 1 person x 200 nights vs. 200 people x 1 night.
      *   *Scanlon's View:* We need principles no one could reasonably reject. A principle allowing the 200 nights for one person might be rejectable by that person. A principle allowing 1 night for 200 people might *not* be rejectable by any single one of them (if the burden is trivial enough).
      *   *Prerequisites:* Students need to understand "standpoints," "reasonable rejectability," and the "individualist restriction."

  3.  **Drafting the Seminar Plan (90 Minutes):**

      *   **Introduction (15 mins):** Hook them with the disagreement. Define the terrain (vs. Utilitarianism).
