answer: |-
  This is a sharp diagnosis. You've correctly identified that the "stall" isn't just philosophical inertia; it's structural. The debate has been spinning because the participants are often rowing in different directions while using the same oars.

  Here is the breakdown of the stall, the verdict on the "Gradient" twist, and the bet on the vocabulary.

  ### 1. Is it a Verbal Dispute or Substantive Theory Clash?
  **It is both, layered like an onion.**

  *   **Layer 1 (Verbal):** You are right that "analytic" is a homonym in this debate.
      *   **Kantian:** Predicate contained in subject (metaphysical/psychological).
      *   **Logical Positivist:** True by convention/logical form (linguistic).
      *   **Quinean Target:** Reduction to immediate experience (epistemological).
      *   **Contemporary Defender:** Cognitive immunity to revision (psychological).
      *   *Result:* When a defender says "Analyticity exists," they often mean "Some sentences are very stable." When a Quinean says "It doesn't," they mean "There is no principled *binary* boundary based on meaning alone." They are talking past each other.

  *   **Layer 2 (Substantive):** Beneath the definitions lies a real clash about **concept stabilization**.
      *   **Quineans** argue concepts stabilize via *causal interaction with the world* (holistic web).
      *   **Defenders** argue concepts stabilize via *internal structural relations* (meaning constitutive rules).
      *   *The Real Fight:* Is meaning a mirror of the world (externalist) or a rulebook of the mind (internalist)? That is not verbal; that is a competing theory of cognition.

  ### 2. The "Gradient Analyticity" Twist: False Dichotomy or Noise?
  **This camp exposes a hidden false dichotomy.**

  Quine and the traditional defenders (like Grice & Strawson) both accepted the **Binary Assumption**: A statement is either analytic (true come what may, due to meaning) or synthetic (truth depends on the world).

  *   **Quine** said: "Since we can't draw the line, the distinction is useless." (Eliminativism)
  *   **Defenders** said: "The line is fuzzy but real, like 'bald'." (Epistemicism)
  *   **Gradient Camp** says: "The binary is the error. Analyticity is a measure of **centrality in the web of belief**."

  This aligns with modern cognitive science (prototype theory, connectionism). In a neural network, some weights are harder to adjust than others. "2+2=4" is deeply entrenched; "Bachelors are unmarried" is highly entrenched; "Water is H2O" is entrenched but revisable (as Putnam showed).

  The Gradient view dissolves the stall by accepting Quine's **Holism** (everything is revisable) while preserving the Defender's **Intuition** (some things are *harder* to revise). It reframes analyticity from a *metaphysical property of sentences* to a *functional property of cognitive systems*. This is not noise; it is a category shift that renders the old binary debate obsolete.

  ### 3. Diagnosing the Stall
  **What kind of disagreement is it?**
  It is a **Methodological Mismatch**.
  Philosophers are trying to solve a psychological/linguistic problem (how do we process meaning?) using purely logical tools (modal logic, possible worlds semantics). Logic deals in binaries (true/false, valid/invalid); cognition deals in weights and probabilities. You cannot find a sharp boundary in a gradient phenomenon using binary tools.

  **What feature keeps it going?**
  **The "Intuition Pump" of Logical Truth.**
  The pre-theoretic intuition is overwhelming: *"Bachelors are unmarried"* feels fundamentally different from *"Bachelors are happy."*
  Philosophers are unwilling to let go of this intuition. They feel that if they admit Quine is right, they lose the ability to explain logical necessity, a priori knowledge, and conceptual truth. So, they keep trying to "save the phenomena" by refining the definition of analyticity, rather than admitting the phenomenon is gradient.

  **What would actually count as resolving it?**
  Resolution requires **Naturalization**.
  The debate will only end when we stop treating "analyticity" as a philosophical primitive and start treating it as an empirical variable. Resolution looks like:
  1.  **Cognitive Science:** Showing empirically that some semantic connections are processed faster or resist revision more strongly (priming studies, reaction times).
  2.  **Formal Semantics:** Moving from binary truth conditions to probabilistic semantics (e.g., Bayesian frameworks where "analytic" = prior probability near 1).
  3.  **Consensus:** Agreeing that "analytic" is a shorthand for "highly entrenched conceptual role," not a metaphysical guarantee of truth.

  ### 4. The Bet: Salvageable or Drop It?
  **I bet we drop the binary vocabulary but salvage the gradient concept.**

  *   **Drop "Analytic/Synthetic":** The terms are too historically contaminated. They carry baggage of Logical Positivism, Kantian metaphysics, and Quinean behaviorism. Using them invites the old binary traps.
  *   **Adopt "Entrenchment Degrees" (or Centrality):** This vocabulary forces the gradient view. It acknowledges Quine's holism (anything can change) while explaining the Defender's intuition (some things are central).

  **Why?**
  If you say "This sentence is analytic," a Quinean hears "You believe in magic meaning."
  If you say "This sentence has high cognitive entrenchment," a Quinean hears "This belief is central to your current web."
  The latter is empirically tractable; the former is metaphysically loaded.

  **Verdict:**
  The stall is real, but it's sustained by an attachment to a binary tool for a gradient reality. The "Gradient Analyticity" camp is the exit ramp. The vocabulary of **entrenchment** wins because it naturalizes the distinction without requiring a metaphysical boundary that doesn't exist. We shouldn't ask "Is it analytic?" We should ask "How hard is it to revise, and why?"
