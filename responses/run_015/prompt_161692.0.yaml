answer: |-
  You have identified a genuine gap between the standard philosophical definition of communication and the social reality of how communication works. You are not lumping three things together; you are identifying one core mechanism (pragmatic inference) operating under different conditions of intentionality.

  There is no single, universally agreed-upon word for "an implicature that the speaker did not intend but the hearer reasonably inferred." However, philosophy of language and linguistics have the tools to carve this up precisely.

  Here is the carving you are looking for, the concepts that border it, and the answers to your specific boundary questions.

  ### 1. The Core Concept: *Unintended Conversational Implicature*

  The phenomenon you are describing is best understood as a **Conversational Implicature** that has detached from **Speaker Meaning**.

  **The Standard View (Grice):**
  The philosopher Paul Grice defined *implicature* as what is suggested or implied, distinct from what is literally said. Crucially, the standard Gricean definition requires **Speaker Intention**. For an implicature to exist, the speaker must *intend* the hearer to think $Y$, and the hearer must recognize that intention.
  *   *Confidence:* **High.** This is textbook philosophy of language.
  *   *The Problem:* Under strict Gricean rules, your clueless reference writer *cannot* generate an implicature. If they didn't intend the insult, they didn't mean it. Therefore, strictly speaking, no communication of "weakness" occurred.

  **The Modern/Normative View (What you need):**
  Most contemporary pragmatics and legal theory recognize that meaning is often **Normative** rather than purely Psychological. Once an utterance is public, it is governed by the rules of the context, not just the speaker's secret mind.
  *   **The Term:** There is no single noun for this, but philosophers refer to it as **Uptake** (the hearer's completion of the act) or **Perlocutionary Effect** (the consequence of the speech) that functions *as if* it were an implicature.
  *   **The Carving:** You need to distinguish between **Speaker Meaning** (what was in their head) and **Communicative Content** (what the utterance publicly conveys according to social norms). Your fights are about *Communicative Content*.
  *   *Confidence:* **Medium-High.** This reflects the shift from Gricean psychology to Normative Pragmatics (e.g., Robert Brandom, Marina Sbisà), though terminology varies.

  ### 2. Distinguishing Your Cases from Neighbors

  You asked how your cases differ from nearby concepts. Here is the boundary work:

  **A. vs. Standard Implicature**
  *   **Difference:** Intention. Standard implicature is a handshake; your cases are a collision.
  *   **Why it matters:** In your reference letter case, the writer can honestly say "I didn't mean that." In a standard implicature (e.g., sarcastic "Nice weather" during a storm), the speaker *does* mean it.
  *   **Fit:** **Poor.** Using "implicature" without qualification invites the argument you're trying to avoid, because the speaker will correctly say "I didn't intend that."

  **B. vs. Perlocutionary Effect**
  *   **Definition:** J.L. Austin distinguished *Illocution* (what you do *in* saying something, e.g., promising) from *Perlocution* (what you do *by* saying something, e.g., persuading, scaring, offending).
  *   **Fit:** **Excellent.** The "weak candidate" takeaway is a *perlocutionary effect*. The letter *caused* the belief, even if it didn't *assert* it.
  *   **Why use this:** It allows you to say, "You didn't *mean* to insult her (Illocution), but you *did* insult her (Perlocution)." This validates the hearer's experience without accusing the speaker of lying.

  **C. vs. Lying vs. Misleading**
  *   **The Distinction:** Philosophers (like Jennifer Saul) distinguish **Lying** (asserting something you believe false) from **Misleading** (asserting something true but implicating something false).
  *   **Your Case:** This is **Unintentional Misleading**. The letter is literally true (she is punctual), but pragmatically misleading (she is weak).
  *   **Relevance:** Regulators (FTC, ASA) care about the *net impression* on the reasonable consumer, regardless of intent. This is exactly your marketing training memory. In law, this is the **"Reasonable Person Standard"** for implied claims.
  *   *Confidence:* **High.** This is settled in legal theory and well-debated in ethics.

  **D. vs. Dogwhistle**
  *   **Difference:** Dogwhistles are typically defined by *coded* language intended for a specific subgroup.
  *   **Your Case:** The "Family" example is close, but if the manager sincerely believed it, it's not a dogwhistle in the strict sense. It is **Ideological Resonance**. The word carries cultural baggage the speaker is unaware of.
  *   **Fit:** **Poor.** Dogwhistle implies intent or at least recklessness. Your cases include genuine cluelessness.

  ### 3. Answering Your Boundary Questions

  You asked for the edges of the concept. Here is how the philosophy breaks down on your specific constraints.

  **Does it matter whether the hearer's takeaway was *reasonable*?**
  *   **Yes.** This is the most important boundary. If a hearer infers something idiosyncratic (e.g., "K." means "They are planning to fire me"), that is **Paranoia** or **Misinterpretation**, not a pragmatic inference.
  *   **The Test:** Would a "Reasonable Hearer" in that specific context (industry norms, relationship history) draw the same conclusion? If yes, the meaning exists publicly, even if not privately intended.
  *   *Confidence:* **High.** Both legal theory and Relevance Theory (Sperber & Wilson) hinge on reasonable inference.

  **Does it matter whether the speaker would have endorsed it if asked?**
  *   **No.** This is the crux of your problem. In your "clueless writer" case, if you asked them "Did you mean Priya is weak?", they would say "No!"
  *   **The Philosophical Move:** This proves that **Communicative Content > Speaker Meaning**. The utterance has escaped the speaker's control. This is sometimes called the **Autonomy of Discourse**.
  *   *Confidence:* **Medium.** This is where philosophers fight. Griceans say "No intention = No meaning." Contextualists say "Public norms = Meaning." I am siding with the Contextualists because they match your lived reality.

  **Can it be cancelled?**
  *   **Yes, but with residue.** Implicatures are *defeasible* (cancellable). If the writer adds "She is also brilliant," the logical implication is cancelled.
  *   **The Catch:** In your "punctual/handwriting" case, adding "brilliant" later might not fully work. This is because the *selection* of traits (punctuality/handwriting vs. skill) signals a **Frame**. Even if cancelled logically, the *Perlocutionary Effect* (the doubt) may linger. This is known as the **Persistence of Pragmatic Effects**.
  *   *Confidence:* **Medium.** Linguists agree implicatures are cancellable; psychologists disagree on how much the "vibe" persists after cancellation.

  **What happens when the "speaker" is a committee/brand?**
  *   **The Fiction of Intent:** Corporations do not have minds. When HR sends a template, we treat the **Institutional Intent** as the intent of a "Reasonable Agent" in that role.
  *   **The Verdict:** If a reasonable person in HR *should have known* the template implies ageism, the corporation is responsible for the meaning, regardless of whether the specific human who clicked "send" thought about it. This is **Vicarious Pragmatic Responsibility**.
  *   *Confidence:* **High.** This is standard in corporate law and ethics.

  ### 4. Summary of the Carving

  You are looking for a word that captures **Public Meaning without Private Intention.**

  *   **Best Label:** **Unintended Pragmatic Inference** (descriptive) or **Perlocutionary Uptake** (mechanism).
  *   **The Distinction:** You are arguing about **Communicative Content** (what the text does in the world), while the speakers are defending **Speaker Meaning** (what was in their head). Both are real, but they are different things.
  *   **The Regulatory Term:** **Net Impression** or **Implied Claim** (based on the Reasonable Consumer).

  ### 5. Confidence and Uncertainty

  **High Confidence Claims:**
  *   Standard Gricean "Implicature" requires intention, so it technically doesn't fit your "clueless" cases.
  *   Legal/Regulatory frameworks use a "Reasonable Person" standard that ignores speaker intent for "implied claims."
  *   The distinction between "Lying" (false assertion) and "Misleading" (true assertion, false implication) is the correct ethical neighborhood for this.

  **Medium Confidence Claims:**
  *   That "Perlocutionary Effect" is the best philosophical handle for the *consequence* of the speech. (Some philosophers argue perlocution is too broad, covering effects like "making someone laugh," which isn't quite "meaning.")
  *   That "Uptake" is the mechanism that validates the hearer's interpretation over the speaker's intent. (This is a growing view, notably in feminist philosophy of language, but not yet universal consensus.)

  **The Point of Least Certainty (The Flag):**
  *   **Whether there is an emerging consensus term for "Unintended Implicature."**
      *   *Why:* Philosophy is currently split between **Intentionalists** (meaning is only what the speaker intends) and **Normativists** (meaning is determined by public rules). If you talk to a strict Gricean, they will tell you your colleagues are hallucinating meaning. If you talk to a Normativist (or a lawyer), they will tell you the speaker is responsible for the meaning regardless of intent. There is no single word that bridges this divide because the divide itself is the battle.
      *   *Advice:* Do not look for a magic word to end the argument. Instead, use the distinction: *"You didn't **mean** it (Speaker Meaning), but the letter **said** it (Communicative Content/Normative Implication)."*

  ### Recommendation for Your Team
  When the fight breaks out, stop asking "Did you mean this?" (which leads to "No"). Start asking: **"Is this a reasonable inference for a reader to make given the norms of our industry?"**

  If the answer is yes, the *Communicative Content* stands, regardless of the *Speaker Meaning*. You are not arguing about psychology; you are arguing about the public rules of your shared language game.
