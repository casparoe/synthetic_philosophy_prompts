answer: |-
  This is a request for a meta-ethical and decision-theoretic specification. You are asking for the *success conditions* of a solution to the cluelessness problem before evaluating the solutions themselves. This is the correct order of operations; too many proposals fail because they solve a different problem than the one posed.

  Below is a specification of the desiderata for an adequate theory of decision-making under consequentialist cluelessness, followed by the inherent tensions, the specific distinctions you requested, and a brief evaluation of the main families of response.

  ---

  ### I. The Desiderata

  An adequate theory must satisfy the following five conditions. Each is motivated by a specific failure mode of naive consequentialism under uncertainty.

  #### 1. The Action-Guidance Requirement
  **Specification:** The theory must yield a determinate verdict (obligatory, permissible, or impermissible) for a non-trivial set of everyday and high-stakes decisions, even when long-run consequences are unknown. It cannot result in systematic paralysis.
  **Motivating Case:** *The Lunch Decision.* If I cannot determine whether buying a sandwich or a salad maximizes value 200 years hence, naive expected value (EV) theory suggests the EV of both is undefined or identical. If the theory implies I have no reason to prefer one over the other, it fails to guide action in a world where I must eat. A theory that results in total paralysis is pragmatically self-defeating.

  #### 2. The Consequentialist Fidelity Requirement
  **Specification:** The justification for the recommended action must ultimately cash out in terms of expected goodness of outcomes. The theory cannot solve cluelessness by importing non-consequentialist deontic constraints (e.g., "rights") unless those constraints are themselves justified by consequentialist reasoning (e.g., rule-consequentialism).
  **Motivating Case:** *The Bait-and-Switch.* If a theory solves cluelessness by saying "follow common sense morality" without explaining why common sense morality tracks the good better than random guessing under conditions of uncertainty, it has abandoned consequentialism rather than saved it. It must explain why the heuristic is a *proxy* for the good, not a replacement for it.

  #### 3. The Sensitivity Requirement (Near-Term Discrimination)
  **Specification:** The theory must remain sensitive to differences in *known* or *highly probable* near-term consequences, even if long-term consequences are clueless. It cannot treat a certain harm and a certain benefit as equivalent simply because their infinite tails are unknown.
  **Motivating Case:** *The Trolley vs. The Push.* Even if the long-run causal ripples of saving five people are unknowable, the immediate saving of five lives is epistemically accessible. A theory that washes out this difference due to long-term cluelessness violates the core consequentialist insight that outcomes matter *now*, not just in the limit.

  #### 4. The Symmetry Constraint
  **Specification:** The theory must provide a principled reason for treating acts of commission and omission differently (or similarly) regarding their long-run uncertain effects. It cannot arbitrarily assign a "zero" expectation to the status quo while assigning "undefined" to action.
  **Motivating Case:** *The Butterfly Effect.* As argued by Greco and Lenman, if the causal network is chaotic, doing nothing also sends ripples through the system (e.g., by not preventing an event). If the long-term effects of acting are symmetrically distributed around zero (good/bad equally likely), the long-term effects of *not* acting are likely symmetric as well. A theory that imputes risk only to intervention commits the status quo bias fallacy.

  #### 5. Decision-Theoretic Coherence
  **Specification:** The theory must not violate basic axioms of rational choice (e.g., transitivity, dominance, avoidance of Dutch Books) unless it explicitly argues for a revision of rationality itself.
  **Motivating Case:** *Money Pumps.* If a theory says "you are permitted to choose A over B, B over C, and C over A" because all are equally clueless, it renders the agent vulnerable to exploitation. A moral theory that requires irrationality is suspect.

  ---

  ### II. The Hard Tensions (Impossibility Results)

  This is the critical section. It is highly probable that no single theory can satisfy all five desiderata simultaneously without significant cost. Here are the primary conflict points.

  #### Tension A: Action-Guidance vs. Consequentialist Fidelity
  *   **The Conflict:** To get action-guidance under radical uncertainty, you generally need to ignore the long-term consequences (focusing on short-term proxies) or adopt rigid rules. However, strict Consequentialist Fidelity demands you care about *all* consequences.
  *   **Why they clash:** If you admit the long-term is unknowable (Fidelity to the epistemic situation), you lose the ability to calculate EV (loss of Guidance). If you force a calculation to get Guidance (e.g., by discounting the future heavily), you violate Fidelity by arbitrarily declaring distant consequences don't matter.
  *   **Verdict:** You likely must choose between a theory that is *consequentialist in foundation* but *non-consequentialist in procedure* (indirect), or one that is *procedurally consequentialist* but *epistemically dishonest*.

  #### Tension B: Sensitivity vs. Symmetry
  *   **The Conflict:** The Sensitivity Requirement demands we distinguish acts based on near-term effects. The Symmetry Constraint suggests that if long-term effects swamp near-term effects (due to infinite time/discounting issues), the near-term signal is noise.
  *   **Why they clash:** If the variance of the long-term consequence distribution is infinite (or sufficiently massive), it mathematically dominates any finite near-term value. To satisfy Sensitivity, you must argue that long-term variance is bounded or discountable. To satisfy Symmetry, you must acknowledge that both action and inaction have unbounded variance.
  *   **Verdict:** Satisfying Sensitivity usually requires breaking Symmetry (e.g., by assuming the status quo has a baseline of 0 while action has variance).

  #### Tension C: Coherence vs. Cluelessness
  *   **The Conflict:** Standard Decision-Theoretic Coherence requires precise probabilities or well-ordered preferences. Cluelessness suggests probabilities are undefined or imprecise.
  *   **Why they clash:** If you model cluelessness using "imprecise probabilities" (sets of functions), you often lose the ability to rank options (violating Action-Guidance/Coherence). If you force precise probabilities to maintain Coherence, you misrepresent the epistemic state (violating Fidelity).
  *   **Verdict:** You may have to accept "rational indeterminacy" (no single right answer) to remain honest about cluelessness.

  ---

  ### III. Addressing Your Specific Distinctions

  Here is how the desiderata map onto the specific philosophical distinctions you raised.

  #### 1. Epistemic vs. In-Principle Cluelessness
  *   **Requirement:** The theory must differentiate these.
  *   **Reasoning:** If cluelessness is merely **Epistemic** (we lack data/compute), the solution is *information gathering* or *approximation*. The desiderata remain the same, but the failure is practical. If cluelessness is **In-Principle** (chaotic systems, quantum indeterminacy, non-computability), the solution must be *structural* (changing the decision rule).
  *   **Implication:** A theory that works for epistemic cluelessness (e.g., "estimate better") fails for in-principle cluelessness. An adequate theory must assume in-principle limits to be robust.

  #### 2. Action-Guidance vs. "No Determinate Answer"
  *   **Requirement:** The theory can allow for "No Determinate Answer" (permissibility range) without collapsing into nihilism, *provided* it explains why the range is narrow enough for practical life.
  *   **Reasoning:** Nihilism says *nothing* matters. Indeterminacy says *many things* are permissible. A theory can satisfy the Action-Guidance requirement by ruling out the worst options (negative constraints) even if it cannot identify the single best option (maximization).
  *   **Implication:** "Satisficing" or "Range Consequentialism" is a valid move here, provided the "satisfice" threshold isn't arbitrary.

  #### 3. Fidelity to Consequentialism
  *   **Requirement:** The theory must retain the *axiological* claim (consequences determine value) even if it modifies the *deontic* claim (maximize expected value).
  *   **Reasoning:** If the theory says "consequences matter, but we should follow rules because we can't track consequences," it is **Indirect Consequentialism**. This counts as addressing the problem. If it says "consequences matter, but rights trump them," it is **Hybrid Theory**. This counts as abandoning the project.
  *   **Implication:** We should accept Indirect Consequentialism as a valid solution, but reject Rights-Based side-constraints unless derived from consequentialist premises.

  #### 4. Uniformity vs. Differentiation of Sources
  *   **Requirement:** The theory should treat sources differently.
  *   **Reasoning:** Cluelessness arising from **Causal Complexity** (butterfly effects) suggests we should look for robust interventions. Cluelessness arising from **Value Uncertainty** (we don't know if future people value X) suggests we should preserve option value/flexibility. Cluelessness arising from **Non-Identity** (different people will exist) suggests we should focus on person-affecting views or critical-level theories.
  *   **Implication:** A "one size fits all" decision rule (like simple discounting) will fail to address the specific texture of the uncertainty.

  ---

  ### IV. Evaluation of Main Families of Response

  Here is how current proposals fare against the Desiderata and Tensions listed above.

  | Family of Response | Action Guidance | Consequentialist Fidelity | Sensitivity | Symmetry | Coherence | Primary Failure Mode |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Temporal Discounting** | **High.** (Math works) | **Low.** (Violates impartiality) | **High.** | **Low.** (Biases status quo) | **High.** | Violates Fidelity. Arbitrarily declares future matter less to solve math. |
  | **Satisficing** | **Medium.** (Depends on threshold) | **Medium.** (Good enough is still good) | **High.** | **Medium.** | **Medium.** | Threshold arbitrariness. Why *this* level of good? |
  | **Robustness / Maxipok** | **Medium.** (Avoids worst) | **High.** (Focuses on outcomes) | **Medium.** | **High.** (Treats act/omit similarly) | **High.** | **Paralysis.** If no option is "robustly good," you cannot act. |
  | **Imprecise Probabilities** | **Low.** (Often yields no ranking) | **High.** (Honest about uncertainty) | **Medium.** | **High.** | **Low.** (Violates completeness) | **Indeterminacy.** Solves honesty by sacrificing choice. |
  | **Heuristics / Rule-Cons.** | **High.** (Follow the rule) | **Medium.** (Instrumental fidelity) | **High.** | **Low.** (Rules often bias status quo) | **High.** | **Rule Worship.** Following rules when you *know* they fail in a specific case. |
  | **Common Sense Morality** | **High.** | **Low.** (Often non-consequentialist) | **High.** | **Low.** | **High.** | **Abandonment.** Solves cluelessness by ceasing to be consequentialist. |

  ### V. Summary of the Landscape

  To build an adequate theory, you are likely forced into a **hybrid indirect approach**.

  1.  **Accept Indeterminacy:** You cannot satisfy *Action Guidance* and *Consequentialist Fidelity* perfectly. You must admit that in high-cluelessness cases, there is no single "maximizing" act, but rather a set of permissible acts.
  2.  **Differentiate Domains:** You need a **two-tier system**.
      *   *Tier 1 (High Cluelessness):* Use **Robustness** or **Option Value** heuristics. (e.g., "Don't risk existential catastrophe even if EV is high"). This satisfies Symmetry and Fidelity but lowers Guidance.
      *   *Tier 2 (Low Cluelessness):* Use **Standard EV**. (e.g., "Feed the hungry"). This satisfies Sensitivity and Guidance.
  3.  **Resolve the Tension:** The cost of this solution is **Complexity**. You lose the elegance of a single maximizing formula. You gain a theory that doesn't tell you to starve yourself because you can't calculate the butterfly effect of your lunch, but also doesn't tell you to gamble the world on a tiny chance of infinite value (Pascal's Mugging).

  **The Verdict:** The most promising path is a **Consequentialism of Risk Management** rather than a Consequentialism of Maximization. It treats the "cluelessness" not as a missing variable in the equation, but as a risk constraint on the solution space. This satisfies Fidelity (outcomes matter), Sensitivity (near-term risks are real), and Symmetry (risks apply to action and inaction), while sacrificing the strong Action-Guidance of "always maximize" for the weaker Guidance of "avoid catastrophic variance."
