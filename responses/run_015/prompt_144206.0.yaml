answer: |-
  This is an exceptionally sharp set of questions. You've hit on one of the central tensions in social ontology and moral history: the debate between **materialism** (Williams) and **idealism/social psychology** (Appiah).

  Your TA's point about honor as a "positional good" is the bridge you're looking for, but it doesn't necessarily make Appiah collapse into Williams. Here is a breakdown of how to disentangle these threads for your seminar.

  ### 1. Do Appiah and Williams Contradict?
  **Yes, on the question of *causal priority*.**

  *   **Williams (Historical Materialism):** Morality is epiphenomenal. It is the "superstructure" built on the economic "base." Abolition happened because the capitalist class in England realized industrial wage labor was more efficient than slave labor. Moral arguments were just the PR campaign used to justify the economic shift.
  *   **Appiah (Social Psychology of Ethics):** Moral arguments have independent causal power, *but* they work through social identity. People didn't stop dueling because it became unprofitable; they stopped because the *meaning* of "honor" changed. If you dueled, you weren't "honorable"; you were a "thug."

  **The Contradiction:** Williams says the moral argument is a lie (or at least a side effect) masking the real reason (money). Appiah says the moral argument is the engine, but it needs the fuel of social status to run.

  ### 2. Does Appiah's View Collapse into Williams?
  This is your strongest insight. If honor works via "cascade dynamics" and "positional goods," isn't that just **social economics**?

  **The Argument for Collapse:**
  If honor is a currency, and people spend it to maximize social status, then Appiah is just describing a market of reputation. In this view, the abolitionists didn't win because they were *right*; they won because they tipped the market value of "slaveholder" from "wealthy" to "pariah." If it's just about tipping points and incentives, isn't that structurally identical to Williams' profit incentives?

  **The Argument Against Collapse (The Appiah Defense):**
  Appiah would argue there is a fundamental difference between **price** (Williams) and **meaning** (Appiah).
  *   **Williams:** The utility of the action changes (Slavery = $ Loss).
  *   **Appiah:** The *identity* of the actor changes (Slaveholder = Barbarian).

  For Appiah, the *content* of the moral argument matters. The argument had to make sense within the existing honor code. You couldn't just say "slavery is inefficient"; you had to say "slavery is ungentlemanly." If it were purely a cascade mechanism like a stock market crash, any negative signal would work. But Appiah shows that specific *ethical narratives* were required to reconfigure what counted as honor.

  So, they don't fully collapse. Williams describes an **external constraint** (you go bankrupt if you keep slaves). Appiah describes an **internal constraint** (you lose your self-respect and social identity if you keep slaves).

  ### 3. The Southern Slavery Objection
  This is the killer question for Appiah. If honor cascades are so powerful, why did the American South double down on slavery while Britain abandoned it?

  **Appiah's Answer: Honor Codes are Local, Not Universal.**
  Appiah argues that there is no single "Honor." There are competing honor communities.
  *   **In Britain:** The rising middle class and aristocracy began to link honor with "civilization," "humanity," and "Christian benevolence." In this code, slavery became shameful.
  *   **In the American South:** The honor code was linked to "independence," "mastery," and "patriarchal protection." In *this* specific code, owning slaves was a *requirement* for honor. To free your slaves was to be weak, dependent on wage labor, and unfit to rule a household.

  **Why no cascade?**
  Cascades require a critical mass of defectors. In the South, the social cost of defection was too high. If you freed your slaves, you weren't just losing status; you were risking economic ruin and physical danger in a society built on racial terror. The "honor market" in the South was insulated from the British honor market.

  **Williams' Answer:**
  Slavery remained highly profitable in the American South (especially after the Cotton Gin), whereas it was becoming less efficient in the British Caribbean. Therefore, the economic incentive to keep it was stronger in the US, and the moral arguments were ignored because they conflicted with material interest.

  ### 4. Why Philosophers Keep Them Separate
  You asked why we treat arguments, interests, and honor as separate when they blur.

  **1. Agency and Responsibility:**
  If Williams is right, moral progress is basically an accident of economics. We don't deserve credit for ending slavery; the steam engine did. If Appiah is right, human agency and moral reasoning play a real role. This matters for how we approach *current* problems. If you want to stop climate change, do you focus on making green tech cheaper (Williams) or on making carbon emissions shameful (Appiah)? Philosophers need to know which lever works.

  **2. Normativity vs. Description:**
  *   **Williams** is doing **history/sociology**. He is describing what *did* happen.
  *   **Appiah** is doing **moral psychology**. He is explaining how norms *can* change.
  Philosophers keep them separate to distinguish between "what caused this" (causality) and "what justifies this" (normativity).

  **3. The "Blind Spot" Risk:**
  If you treat them as the same, you risk missing the specific mechanism.
  *   If you treat honor as just money, you might try to bribe people to stop dueling (which wouldn't work).
  *   If you treat economics as just honor, you might try to shame a factory owner for pollution when they will only stop if taxed.

  ### Summary for your Seminar
  *   **Do they contradict?** Yes, on whether moral arguments are drivers (Appiah) or decorations (Williams).
  *   **Do they collapse?** No. Williams is about **material utility**; Appiah is about **social identity**. Even if honor acts like a currency, the "exchange rate" is determined by moral narratives, not just supply and demand.
  *   **Why not the South?** Honor codes are local. The Southern code defined slavery as honorable; the British code redefined it as shameful. The cascade requires a shared definition of value.
  *   **Why keep them separate?** To understand whether we should change the world by changing **incentives** (Williams) or changing **meanings** (Appiah).

  **One final tip:** Mention that Appiah actually addresses Williams. Appiah admits that economic changes often create the *conditions* for moral change, but he insists economics alone is insufficient without the shift in honor. He tries to synthesize them, whereas Williams keeps them hierarchical.
