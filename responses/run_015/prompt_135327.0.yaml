answer: |-
  Here is your Q&A prep sheet. It is structured to keep you alive in the room, prioritizing the objections that threaten the theoretical coherence of your argument over those that merely dispute terminology.

  ### Part 1: The Objections (Ordered by Damage Potential)

  **1. The Modeler's Kill Shot (Dual-Inheritance Group)**
  *   **Phrasing:** "If the unit of inheritance is an environmental scaffold and not a replicator, how do you track lineages? In our models, fidelity allows us to calculate $r$ (relatedness) and selection coefficients. If 'copying' is gone, what varies, and how do you mathematically distinguish selection on the scaffold from selection on the individual building it?"
  *   **Damage:** **Critical.** If you cannot define the unit of variation, you cannot model selection. If you can't model it, the DIT half of the room will dismiss the talk as qualitative hand-waving.
  *   **Reply (2 mins):** "You don't track the *idea*; you track the *reconstruction cost*. The lineage is defined by the persistence of the specific environmental arrangement. Variation enters when the scaffold degrades or is modified (e.g., a tool is left in a slightly different spot), and selection acts on whether the next novice can rebuild that arrangement within a cost threshold. It's not $r$ based on genetic relatedness; it's $r$ based on structural overlap in the niche. I'm not asking you to delete the math, but to change the state variable from 'frequency of trait in population' to 'probability of niche reconstruction.'"
  *   **Where it's soft:** You haven't actually shown the math for "probability of niche reconstruction." They will smell a black box.

  **2. The Historian's Trap (History of Science)**
  *   **Phrasing:** "This sounds like Lamarckism dressed up as Darwinism. If the environment *causes* the trait to be reacquired in the novice, isn't the instruction coming from the outside in? Where is the blind variation? If the scaffold is *designed* to teach, isn't this just Spencerian progress with a feedback loop?"
  *   **Damage:** **High.** If this isn't Darwinian, it doesn't belong in a "Cultural Evolution" reading group. It becomes "Cultural Development."
  *   **Reply (2 mins):** "It remains Darwinian because the scaffold itself is subject to blind variation and differential retention. Scaffolds break, get forgotten, or are repurposed accidentally. The novice doesn't perfectly reconstruct the scaffold; they reconstruct a *variant* of it. If that variant makes re-acquisition cheaper, it persists. The 'instruction' isn't top-down design; it's the differential survival of scaffolds that happen to work. The blindness is in which scaffolds survive the generation gap, not in the learning process itself."
  *   **Where it's soft:** Distinguishing "designed scaffolds" (by teachers) from "selected scaffolds" (by evolution) is messy in human culture.

  **3. The Anthropologist's Eye-Roll (Situated Learning Group)**
  *   **Phrasing:** "You've just reinvented 'Communities of Practice' (Lave & Wenger) or 'Habitus' (Bourdieu). You're describing enculturation. Why do we need the evolutionary framing? Does calling it a 'scaffold' actually predict anything that 'apprenticeship' doesn't?"
  *   **Damage:** **Medium.** They might agree with your description but reject your framing as imperialist "evangelical" evolutionism.
  *   **Reply (2 mins):** "Anthropology describes *how* transmission happens; evolutionary theory predicts *which* practices survive population-level bottlenecks. 'Apprenticeship' explains the mechanism; 'Scaffold Selection' explains why some apprenticeships vanish while others dominate despite being harder to learn. I'm not trying to replace ethnography; I'm trying to explain the macro-patterns ethnography can't see because it's focused on the local interaction."
  *   **Where it's soft:** You need to prove you can predict macro-patterns. If you can't, they're right: it's just rebranding.

  ---

  ### Part 2: Strategic Concessions (First Two Slides)

  Do not wait for them to force these out of you. Put these on Slide 2 ("Scope & Limitations") to disarm the room immediately.

  1.  **Concede the "Meme" History:** "I agree that the 1990s 'mind-virus' memetics is dead. I am not defending Dawkins' original formulation. I am using 'meme' only as a historical placeholder for 'cultural variant' before we had better terminology."
  2.  **Concede the Lab Utility:** "Transmission-chain experiments are not useless. They are excellent controls for *individual* cognitive bias. My claim is only that they are invalid for measuring *cultural* fidelity, because culture lives in the scaffold, not the head."

  **Why:** This neutralizes the friend's argument (memetics is dead) and the Anthropologists' hatred of "replicators" before they can weaponize them.

  ---

  ### Part 3: The Single Reply That Must Land

  **The Concept:** **"Fidelity is a property of the system, not the copy."**

  If you fail to convince them that high-fidelity transmission can emerge from low-fidelity copying *given a robust scaffold*, the whole thesis collapses.
  *   **The Soundbite:** "A potter doesn't need a perfect memory of the wheel; they need the wheel to be set up correctly. If the wheel is the scaffold, the 'fidelity' is in the axle, not the brain. If you test the potter without the wheel (the lab chain), you measure cognitive decay. If you test the potter *with* the wheel, you measure cultural stability."
  *   **Why:** This bridges the Modelers (who need stability) and the Anthropologists (who need context).

  ---

  ### Part 4: Your Weakest Point (Pre-emptive Admission)

  **The Problem:** **The Origin of Variation.**
  Your theory explains *retention* beautifully (scaffolds preserve traits). It explains *selection* well (cheap scaffolds win). It is weak on **Variation**. How do scaffolds mutate?
  *   **The Admission:** "I must admit my model is currently stronger on selection and retention than on variation. I am treating scaffold-variation as exogenous noise for now. I don't yet have a full taxonomy of how scaffolds mutate other than 'breakage' or 'improvisation.' This is the next step of the work."
  *   **Why:** If you claim to have solved variation, the Modelers will tear you apart. Admitting it's a work-in-progress makes you look rigorous, not naive.

  ---

  ### Part 5: The Question You Hope Nobody Asks

  **The Question:** **"Isn't this just Niche Construction Theory (NCT) with a new name?"**
  (Odling-Smee, Laland, et al. have been arguing that organisms modify environments to alter selection pressures for 20+ years.)

  *   **Why it's dangerous:** If the answer is "Yes," you haven't contributed anything new. If the answer is "No," you have to distinguish your "Scaffold" from "Niche" very precisely, or you look like you haven't read the literature.
  *   **The Pivot Answer:** "NCT focuses on how the niche alters *biological* selection pressures on the organism. My 'Scaffold' focuses on how the niche alters *cultural* transmission fidelity. NCT asks how beaver dams change beaver genes; I'm asking how sheet music changes the survival of symphonies. It's a specific subset of NCT applied to inheritance mechanisms, not selection pressures."

  **Good luck. Walk in like you've already accepted the critique, and you'll own the room.**
