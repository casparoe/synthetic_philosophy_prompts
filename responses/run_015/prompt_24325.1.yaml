answer: |-
  This is a sharp set of intuitions. You've essentially reconstructed the dialectic of the *Philosophical Investigations* without the exegesis. You are correctly sensing that the *Flib* case and the *Pain-Scale* case are the pivot point.

  Here is the principle that unifies your verdicts, the inconsistency it exposes, and what it implies for your Blind Woman case.

  ### The Unifying Principle: The Normative Constraint

  The principle doing the work behind your "Yes/No" verdicts is not merely about communication (since the Mathematician doesn't communicate), nor is it strictly about physical referents. It is about **the possibility of independent correction.**

  **Principle:** *A symbolic system counts as a language only if there is a logical gap between "it seems right to me" and "it is right."*

  For a rule to exist, there must be a way to violate it that isn't just a change of mind. If the only authority on whether you followed the rule is your current memory or impression, you haven't established a rule; you've established a habit.

  ### The Inconsistency: Flib vs. Pain

  You identified the tension perfectly.
  *   **Flib Guy:** You say "Not a language" because he has no check against his own memory. If he calls a new taste "flib" tomorrow, he can't be wrong, only different.
  *   **Pain-Scale Guy:** You say "IS a language" because it "works fine for him."

  **The Verdict You Have to Drop:**
  To maintain consistency with the *Flib* verdict (and with the Principle above), **you have to drop the claim that the Pain-Scale is a *private* language.**

  Your "Anchoring" hypothesis is actually the key to saving the Pain-Scale, but it reclassifies it.
  *   **Flib** fails because "flib" refers *only* to a private qualia with no external hook. There is no fact of the matter other than his impression.
  *   **Pain** succeeds *only because* "pain" is a public concept. We learn the word "pain" via public criteria (crying, injury, withdrawal). When the Pain-Scale Guy says "This is a 7," he is piggybacking on the public grammar of "pain."

  If the Pain-Scale Guy were truly using a *private* language (in the Wittgensteinian sense), he would have to invent the concept of pain itself internally. If he does that, he falls into the *Flib* trap: Is today's "5" the same as yesterday's "5"? He has no way to know.

  **Resolution:** The Pain-Scale is not a counter-example to the Private Language Argument. It is a **public language used in solitude.** It works because the *concept* is public, even if the *measurement* is introspective. The *Flib* guy fails because the *concept itself* is private.

  So, your principle isn't "anchored to a public concept"; it's **"constituted by public norms."**
  *   **Mathematician:** Constituted by public logical norms (even if unshared).
  *   **Couple:** Constituted by intersubjective norms.
  *   **Pain-Scale:** Constituted by public behavioral norms regarding suffering.
  *   **Flib/Tetrachromat:** Constituted by nothing but private impression. (Fails).

  ### The Blind Woman Case

  Now, apply the **Normative Constraint** to your new case:
  *A blind woman builds a private spatial notation for getting around her apartment, keyed to internal landmarks nobody else knows about.*

  **Verdict: It is a language (or a map), but not a *private* language.**

  **Why?**
  Unlike *Flib*, her notation has a **reality check.**
  1.  **Correctness Condition:** If her notation says "turn left at the creaky board," and she turns left and hits a wall, she was **wrong.**
  2.  **Independence:** The success of her navigation is independent of her belief that it will succeed.

  This makes her like the **Mathematician**, not the *Flib Guy*.
  *   The Mathematician's notation is checked against mathematical truth (which is public/objective).
  *   The Blind Woman's notation is checked against physical space (which is public/objective).

  Even if the *names* she uses are known only to her ("The Singing Corner"), the *referents* are public physical locations. She can make a mistake. She can be corrected by the environment (collision). Therefore, it satisfies the Normative Constraint.

  ### Summary of Adjustments

  To make your system coherent, you need to shift your taxonomy slightly:

  1.  **Private Language (Strict Sense):** Words referring to immediate private sensations known *only* to the speaker, with no public criteria.
      *   *Verdict:* **Impossible.** (Flib, Tetrachromat, and a strictly private Pain-Scale all fail here).
  2.  **Solitary Language:** A public language used by one person.
      *   *Verdict:* **Possible.** (Mathematician, Blind Woman, Pain-Scale Guy).
  3.  **Idiolect:** A shared language with unique variations.
      *   *Verdict:* **Possible.** (The Couple).

  **The Takeaway:**
  Your intuition that the Pain-Scale "works" is correct, but your classification of it as a *private* language is what clashes with the *Flib* verdict. The Pain-Scale works *because* it isn't private. It leans on the public practice of pain-behavior.

  If you accept that, the **Blind Woman** passes with flying colors. Her "private" notation is actually a technical map keyed to public reality. She can be wrong, therefore she can mean something. *Flib* cannot be wrong, therefore he means nothing.
