answer: |-
  ### Diagnostic Procedure for Client Inaction

  This procedure is designed to isolate the causal mechanism of client inaction within a forty-five-minute session. It proceeds sequentially. If a stop condition is met, do not proceed to subsequent steps. Do not recommend commitment devices (e.g., automatic escalation, illiquid accounts) unless the procedure terminates at Step 5.

  **Step 1: The Feasibility Audit**
  *   **Question:** "Let's look at the cash flow for the last three months. If we automate the recommended savings/payment amount on the 1st of the month, does the remaining balance cover your rent, utilities, and groceries without going negative before the 15th?"
  *   **Sufficient Answer:** A definitive "Yes" supported by the bank statement data in front of you.
  *   **Stop Condition:** If the answer is "No," or "It would be tight," or "I'd have to cut groceries."
  *   **Diagnosis:** **FEASIBILITY_OR_INFORMATION**. The plan is mathematically impossible. Adjust the plan or address income/expenses. Do not discuss willpower.
  *   **[JUDGMENT CALL]:** You must interpret "tight." If the client says "Yes" but looks visibly anxious or qualifies it with "as long as nothing breaks," treat this as a "No."

  **Step 2: The Mechanism Check**
  *   **Question:** "If you put this money into the recommended account, can you explain back to me what happens to it tax-wise and when you can access it without penalty?"
  *   **Sufficient Answer:** The client accurately describes the growth mechanism and the liquidity constraints.
  *   **Stop Condition:** If the client cannot explain it, or believes false constraints (e.g., "I can't touch Roth contributions ever").
  *   **Diagnosis:** **FEASIBILITY_OR_INFORMATION**. The barrier is confusion, not volition. Provide education. Do not discuss willpower.

  **Step 3: The Time-Consistency Test (Hyperbolic vs. Exponential)**
  *   **Question A (Immediate):** "Would you prefer [Amount X] deposited in your checking account today, or [Amount X + 10%] deposited in your checking account thirty days from today?"
  *   **Question B (Deferred):** "Would you prefer [Amount X] deposited in your checking account thirty days from today, or [Amount X + 10%] deposited in your checking account sixty days from today?"
  *   **Sufficient Answer:** Two clear choices.
  *   **Diagnostic Logic:**
      *   **Reversal (Present Bias):** Client chooses **X Today** in Question A, but chooses **X + 10% in 60 Days** in Question B. (They abandon the reward when both are distant, but grab the immediate cash when available).
      *   **Consistency (High Discount):** Client chooses **X Today** in Question A, AND **X in 30 Days** in Question B. (They consistently value the sooner amount by >10% per month).
      *   **Consistency (Low Discount):** Client chooses **X + 10%** in both.
  *   **Stop Condition:** If the result is **Consistency (High Discount)**, proceed to Step 4. If the result is **Reversal**, proceed to Step 5.
  *   **[JUDGMENT CALL]:** Clients may try to answer "correctly." Watch for hesitation or looking to you for approval. If they hesitate on Question B, probe: "There is no right answer; I need to know what you actually want."

  **Step 4: The Settled Judgment Test (Akrasia vs. Values)**
  *   **Context:** Only reached if Step 3 showed **Consistency (High Discount)**.
  *   **Question:** "You consistently prefer having the money sooner rather than later, even if it means less at retirement. Is that a trade-off you are comfortable owning, or do you feel pressure from others (spouse, society, me) to want the retirement money more?"
  *   **Sufficient Answer:**
      *   **Values:** "I'm comfortable. I'd rather live now." -> **Diagnosis: CONSISTENT_HIGH_DISCOUNT**. Accept the preference. Do not impose commitment devices.
      *   **Conflict:** "I know I should care more about sixty, but I just don't." -> **Diagnosis: CONSISTENT_HIGH_DISCOUNT**. This is a values alignment issue, not a self-control bug. Commitment devices will likely be resented.
  *   **Stop Condition:** If the client affirms the preference is theirs.
  *   **[JUDGMENT CALL]:** Distinguishing "I don't care" from "I am resigned to failure." If they sound defeated rather than decisive, flag as **INCONCLUSIVE**.

  **Step 5: The Commitment Readiness Test**
  *   **Context:** Only reached if Step 3 showed **Reversal (Present Bias)**.
  *   **Question:** "You just said you'd wait for the larger amount if neither was available today, but you take the smaller amount when it's right now. This suggests your brain changes its mind when temptation is close. Would you be willing to restrict your own future access to this money to protect that future preference?"
  *   **Sufficient Answer:** A voluntary agreement to a constraint (e.g., penalty for withdrawal, automatic increase).
  *   **Diagnosis:** **PRESENT_BIAS**. Commitment devices are appropriate.
  *   **Stop Condition:** If they refuse the constraint despite admitting the reversal.
  *   **Diagnosis:** **INCONCLUSIVE**. They acknowledge the bias but refuse the cure.

  ***

  ### Application to Test Cases

  **Case 1: The Thirty-Four-Year-Old Roth Procrastinator**
  *   **Step 1 (Feasibility):** Assumed pass (prompt implies intent without citing cash shortages).
  *   **Step 3 (Time-Consistency):**
      *   Q A (Today vs 1 Month): Chooses $500 Today.
      *   Q B (1 Month vs 2 Months): Chooses $550 in 2 Months (equivalent to $550 in 1 month relative to the 1-month baseline).
      *   **Result:** Reversal. He values immediacy disproportionately.
  *   **Step 5 (Commitment):** Implied willingness (has tried "January" start dates repeatedly, indicating desire to bind future self).
  *   **Procedure Output:** **PRESENT_BIAS**.
  *   **Planner Intuition Check:** Matches intuition. This is the classic use-case for automation.

  **Case 2: The Twenty-Nine-Year-Old High Discounter**
  *   **Step 1 (Feasibility):** Assumed pass.
  *   **Step 3 (Time-Consistency):**
      *   Q A (Today vs 1 Month): Chooses $100 Today.
      *   Q B (1 Month vs 2 Months): Chooses $100 in 1 Month (over $110 in 2 Months).
      *   **Result:** Consistent. She discounts the future at >10% per month regardless of proximity to "now."
  *   **Step 4 (Settled Judgment):** She states flatly she doesn't care about age sixty.
  *   **Procedure Output:** **CONSISTENT_HIGH_DISCOUNT**.
  *   **Planner Intuition Check:** **Counter-Intuitive.** Your instinct is likely to "fix" her retirement savings. The procedure forbids this. She is not making a mistake; she is expressing a value. Pushing commitment devices here is paternalistic and likely to cause churn.

  **Case 3: The Cash-Flow Constrained Client**
  *   **Step 1 (Feasibility):**
      *   Question: "Does $600 leave enough for rent?"
      *   Evidence: Cash flow shows $600 is not available without missing rent.
      *   **Result:** Fail.
  *   **Procedure Output:** **FEASIBILITY_OR_INFORMATION**.
  *   **Planner Intuition Check:** **Counter-Intuitive.** You stated you "keep wanting to call a discipline problem." The procedure stops you at Step 1. A plan that causes rent arrears is not a willpower failure; it is a math failure. Recommending a commitment device here would cause client harm (overdrafts/eviction).

  ***

  ### Limitations and Misfire Points

  1.  **Social Desirability Bias:** Clients often answer Step 3 (Time-Consistency) to please the planner. They may choose the "virtuous" option in the hypothetical even if their revealed behavior differs. *Mitigation:* Frame Step 3 as a "brain wiring test" where neither answer is moral.
  2.  **Rational Precarity:** For low-income clients, a steep discount rate is rational. If your life is unstable, $100 today prevents eviction; $110 next month is theoretical. The procedure labels this **CONSISTENT_HIGH_DISCOUNT**, which is technically correct, but risks pathologizing survival strategies. *Mitigation:* In Step 1, expand "Feasibility" to include "Risk Buffer." If the emergency fund is zero, high discounting is rational risk management.
  3.  **Stated vs. Revealed Preference:** This procedure tests *stated* preference in the room. A client may pass Step 3 (showing Present Bias) but still fail to sign the commitment device due to shame. *Mitigation:* Rely on Step 5's voluntary agreement. If they won't sign, revert to **INCONCLUSIVE**.

  ***

  ### Application to Current Client (Forty-One-Year-Old Credit Card)

  **Data Available:**
  1.  **Behavior:** Pays minimums only.
  2.  **Statement:** "Knows he should" pay more (Indicates Settled Judgment exists).
  3.  **Step 3A (Immediate):** Prefers $200 Today over $220 in 1 Month (Steep discount >10%).
  4.  **Step 3B (Deferred):** **Not Asked.**
  5.  **Step 1 (Feasibility):** **Not Verified.** (Paying minimums often signals cash tightness, but you have not confirmed if extra principal is *possible* without hardship).

  **Procedure Execution:**
  *   **Step 1:** Cannot clear. You suspect discipline, but minimum payments are a strong signal of feasibility constraints. You lack the "Yes" supported by data.
  *   **Step 3:** Incomplete. You have evidence of steep discounting, but without Question B, you cannot distinguish **PRESENT_BIAS** (Reversal) from **CONSISTENT_HIGH_DISCOUNT** (Consistency).
  *   **Step 4:** Partially cleared. He states a judgment ("should pay more"), which suggests Akrasia *if* the barrier is psychological.

  **Analysis:**
  You cannot assign **PRESENT_BIAS** because you have not demonstrated the preference reversal. You cannot assign **CONSISTENT_HIGH_DISCOUNT** because you haven't proven consistency. You cannot assign **FEASIBILITY** definitively, but you haven't ruled it out, and your intuition admits uncertainty ("not sure I'm right"). The procedure requires clearing Step 1 and Step 3 to move to a solution.

  **Verdict:** INCONCLUSIVE (If you could have two hundred dollars in thirty days or two hundred twenty dollars in sixty days, which would you take?)
