prompt: |-
  I'm a statistician who works on decision theory — loss functions, hypothesis testing, Type I/II error tradeoffs, significance levels, the works. I keep hearing about this thing in epistemology called "pragmatic encroachment," and from what I gather it's the idea that whether you know something depends on what's practically at stake. The classic example: you've got the same evidence that the bank is open on Saturday, but we'd say you "know" it when you just want to deposit a check, and we'd deny you "know" it when your rent depends on it and getting it wrong means eviction.

  Restate this whole debate in the vocabulary I actually use — significance levels, loss functions, decision rules, error rates, Neyman-Pearson vs. Fisher vs. Bayesian frameworks — as faithfully as you can. Then give me the residue report: which parts of the philosophical debate map cleanly onto things statisticians already talk about, which parts you had to stretch or fudge, and whether there's anything the philosophers are arguing about that has no counterpart in my vocabulary. I want to know whether this is just the standard point that decision thresholds depend on costs dressed up in philosophical jargon, or whether there's something genuinely different going on that my framework can't capture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Statistician working in decision theory (loss functions, hypothesis testing, Type I/II errors, significance levels, Neyman-Pearson, Fisher, Bayesian).
      *   **Topic:** Pragmatic Encroachment (PE) in epistemology.
      *   **Task:**
          1.  Restate the PE debate using statistical decision theory vocabulary.
          2.  Provide a "residue report" (mapping analysis): What maps cleanly? What requires stretching? Is there anything unique to philosophy that statistics misses?
          3.  Answer the core question: Is PE just "decision thresholds depend on costs" in disguise, or is there something more?

  2.  **Deconstruct Pragmatic Encroachment (PE):**
      *   *Core Claim:* Knowledge attributions ("S knows that p") are sensitive to practical stakes, not just evidential support (truth, belief, justification).
      *   *Classic Case (Bank Case):* Low stakes (deposit check) $\rightarrow$ "I know." High stakes (rent/eviction) $\rightarrow$ "I don't know" (even with same evidence).
      *   *Implication:* Knowledge is not purely epistemic; it's partly pragmatic.

  3.  **Translate to Statistical Decision Theory:**
      *   *Proposition $p$:* The null hypothesis $H_0$ (or alternative $H_1$). Let's say $H_1$: "Bank is open."
      *   *Evidence:* Data $X$, likelihood ratio, p-value, posterior probability.
      *   *Belief:* Accepting $H_1$ (rejecting $H_0$).
      *   *Knowledge:* This is the tricky part. In stats, we usually talk about *decisions* or *inferences*, not "knowledge." But for the sake of translation, "Knowing $p$" $\approx$ "Accepting $H_1$ as true for the purpose of action."
      *   *Stakes:* Loss function $L(\theta, a)$.
          *   Low stakes: Symmetric or low loss for error.
          *   High stakes: Asymmetric, high loss for Type II error (thinking bank is open when it's closed).
      *   *Threshold:* Critical value $\alpha$, or Bayesian decision threshold.
      *   *The PE Claim in Stats:* Whether we claim to "accept $H_1$" (know) depends on the Loss Function, not just the Likelihood/p-value.

  4.  **Drafting the Translation (Section 1):**
      *   *State of Nature:* $\theta \in \{\text{Open}, \text{Closed}\}$.
      *   *Data:* $X$ (evidence).
      *   *Epistemic State:* Posterior $P(\theta|X)$ or Likelihood $L(\theta; X)$. Let's assume this is fixed across scenarios (same evidence).
      *   *Action Space:* $A = \{\text{Go to bank}, \text{Stay home}\}$.
      *   *Loss Function:* $L(\theta, a)$.
          *   Low Stakes: $L(\text{Closed}, \text{Go})$ is small (wasted trip).
          *   High Stakes: $L(\text{Closed}, \text{Go})$ is huge (eviction).
      *   *Decision Rule:* $\delta(X)$. Minimize expected loss.
      *   *The "Knowledge" Claim:* In PE, "S knows $p$" is treated as a license to act. So, "Knows" $\equiv$ "Optimal decision is to act on $p$."
      *   *The Conflict:* Same $P(\theta|X)$, different $L$, different optimal action. PE says the *knowledge attribution* changes. Stats says the *decision* changes, but the *confidence/probability* stays the same.

  5.  **Developing the Residue Report (Section 2):**
      *   *Clean Mapping:*
          *   Stakes $\rightarrow$ Loss Functions.
          *   Evidence $\rightarrow$ Likelihood/Posterior.
          *   Threshold shifting $\rightarrow$ Optimal decision rules (Neyman-Pearson $\alpha$ selection or Bayesian expected utility).
          *   "Acting on $p$" $\rightarrow$ Rejecting $H_0$.
      *   *Stretching/Fudging:*
          *   *Knowledge vs. Decision:* Statisticians distinguish between *inference* (estimating $\theta$) and *decision* (choosing $a$). PE collapses these. PE says the *truth condition* of the sentence "I know" changes. Stats says the sentence "I should act" changes, but "P(Open) = 0.95" remains constant.
          *   *Contextualism:* PE often implies the *meaning* of "knows" changes. In stats, the meaning of "p-value" or "Posterior" is invariant; only the *cutoff* changes.
      *   *The "Residue" (What Stats Misses):*
          *   *Normative Status:* Epistemology cares about *warrant* or *justification* as a property of the agent, not just the output of a function.
          *   *Assertion:* PE is often about whether you can *assert* "I know." This is speech-act theory, not just decision theory.
          *   *Invariantism vs. Contextualism:* Do the stakes change the *fact* of knowledge, or just our *willingness to attribute* it? Stats assumes the parameters are fixed; PE debates if the *relation* itself changes.

  6.  **Addressing the Core Question (Is it just decision thresholds?):**
      *   *Standard View (Intellectualism):* Yes, it's just costs. Evidence sets probability; costs set action. "Knowledge" should track probability, not costs.
      *   *PE View:* No. "Knowledge" is the norm of action/assertion. If costs change the norm for action, they change the conditions for knowledge.
      *   *The Gap:* Statistics treats probability (evidence) and utility (stakes) as separate modules (Probability $\times$ Utility = Decision). PE argues they are entangled in the concept of *Knowledge* itself.
      *   *Conclusion:* It *is* largely decision thresholds, BUT the philosophical fight is about whether the label "Knowledge" should attach to the Probability module or the Decision module. Statisticians usually say Probability. Philosophers (PE proponents) say Decision.

  7.  **Refining the Tone:**
      *   Needs to be rigorous, respectful of the user's expertise, and precise.
      *   Avoid dumbing down the stats. Use $\alpha$, $\beta$, Loss $L$, Posterior $\pi$.
      *   Be honest about where the analogy breaks.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Map "Knowledge" to "Reject Null."
      *   *Correction:* That's too behaviorist. Map "Knowledge" to "Justified Belief sufficient for assertion/action." In stats, this is closer to "Statistical Significance" *interpreted as truth*.
      *   *Crucial Distinction:* Fisher (significance as evidence) vs. Neyman-Pearson (decision rules). PE aligns more with N-P, but claims it affects the *evidential* status (Fisherian). This is the tension.
      *   *Bayesian Angle:* In Bayesian decision theory, $P(H|E)$ is distinct from $U(A)$. PE claims $P(H|E)$ *itself* (or the warrant derived from it) is stake-sensitive. This is the "fudge." Bayesians say stakes don't change posteriors. PE says stakes change whether the posterior counts as "knowledge."

  9.  **Final Polish:** Organize into "The Translation," "The Residue Report," and "The Verdict." Ensure the distinction between *credence* (probability) and *acceptance* (decision) is clear, as that's where the philosophical action is. (See: Kaplan's distinction).

  10. (Final check against prompt): Did I cover significance levels? Yes. Loss functions? Yes. N-P vs Fisher vs Bayesian? Yes. Residue report? Yes. Verdict on "just jargon"? Yes.

  Proceed to generate response.
answer: |-
  Here is the translation of the pragmatic encroachment (PE) debate into statistical decision theory, followed by the residue report on where the mapping holds and where it breaks.

  ### Part 1: The Translation

  Let us formalize the "Bank Case" using your framework.

  **The Setup**
  *   **State of Nature ($\theta$):** $\theta \in \{\text{Open}, \text{Closed}\}$.
  *   **Data ($X$):** Your evidence (e.g., you were there two weeks ago on a Saturday).
  *   **Epistemic State:** The likelihood function $L(\theta; X)$ or the posterior probability $\pi(\theta|X)$. Let's assume for the PE argument that $\pi(\text{Open}|X) = 0.95$ in both scenarios. The evidence is invariant.
  *   **Action Space ($A$):** $a_1 = \text{Go to bank}$, $a_0 = \text{Do not go}$.
  *   **Proposition $p$:** "$\theta = \text{Open}$."

  **The Statistical Decision Problem**
  You are minimizing expected loss (risk).
  $$ \rho(a, \pi) = \mathbb{E}_{\theta|X} [L(\theta, a)] $$

  *   **Scenario A (Low Stakes):**
      *   $L(\text{Closed}, \text{Go}) = c_{\text{low}}$ (Minor inconvenience).
      *   $L(\text{Open}, \text{Not Go}) = c_{\text{delay}}$ (Minor delay).
      *   **Decision Rule:** If $\pi(\text{Open}|X) > \frac{c_{\text{low}}}{c_{\text{low}} + c_{\text{delay}}}$, choose $a_1$.
      *   **Outcome:** With $\pi=0.95$, the threshold is easily met. You act on $p$.

  *   **Scenario B (High Stakes):**
      *   $L(\text{Closed}, \text{Go}) = C_{\text{high}}$ (Eviction/Homelessness).
      *   $L(\text{Open}, \text{Not Go}) = c_{\text{delay}}$.
      *   **Decision Rule:** If $\pi(\text{Open}|X) > \frac{C_{\text{high}}}{C_{\text{high}} + c_{\text{delay}}}$, choose $a_1$.
      *   **Outcome:** As $C_{\text{high}} \to \infty$, the threshold approaches 1. With $\pi=0.95$, the threshold is *not* met. You do not act on $p$.

  **The Pragmatic Encroachment Claim**
  In standard decision theory, the above is uncontroversial. Your *action* changes based on the loss function, but your *estimate* of $\theta$ (the posterior) remains fixed at 0.95.

  Pragmatic Encroachment makes a stronger claim. It asserts that the truth value of the statement **"S knows that $p$"** changes between Scenario A and Scenario B.
  *   In Stats Vocabulary: PE claims that whether you are licensed to assert **"The estimator $\hat{\theta}$ is sufficiently accurate to be treated as truth"** depends on the Loss Function $L$, not just the sampling distribution or posterior $\pi$.
  *   **Fisherian Interpretation:** PE claims the *strength of evidence* (significance) itself is stake-sensitive. (This is a violation of the Likelihood Principle).
  *   **Neyman-Pearson Interpretation:** PE claims the *acceptance region* for the hypothesis determines whether you "know" it, and since acceptance regions are defined by $\alpha$ (which is set by costs), knowledge is cost-sensitive.
  *   **Bayesian Interpretation:** PE claims that *belief* (credence) is not enough for knowledge; knowledge requires *decision-ready credence*, and the threshold for "decision-ready" is internal to the definition of knowledge, not external to the action.

  ---

  ### Part 2: The Residue Report

  Here is the audit of what maps cleanly, what requires fudging, and what lies outside your vocabulary.

  #### 1. Clean Mappings (The "Decision Threshold" View)
  *   **Stakes $\leftrightarrow$ Loss Functions:** This is a 1:1 map. The philosophical "practical stakes" are precisely the asymmetry in the loss matrix $L(\theta, a)$.
  *   **Justification $\leftrightarrow$ Power/Confidence:** When philosophers argue about whether the evidence is "strong enough," they are arguing about whether the test statistic falls into the rejection region given a specific $\alpha$.
  *   **Action $\leftrightarrow$ Decision Rule:** The move from "believing" to "acting" is the move from inference to decision. PE proponents agree with statisticians that you shouldn't act on $p$ in the High Stakes case.

  **Verdict:** If "Knowledge" is defined as "Warranted assertibility for the purpose of guiding action," then PE is simply the statement that **optimal decision thresholds depend on cost functions.** This is standard Wald/Neyman-Pearson theory.

  #### 2. The Stretched Mappings (The "Epistemic" View)
  Here is where you will feel the friction.

  *   **Knowledge $\leftrightarrow$ Rejecting $H_0$:**
      *   *Stats:* Rejecting $H_0$ is a decision to proceed *as if* $H_0$ is false. You know it's a procedural convention.
      *   *PE:* "Knowing" is treated as a factual state of the agent, not just a procedural green light. PE proponents argue that in the High Stakes case, you literally *lack knowledge*, not just that you lack permission to act.
      *   *The Fudge:* In stats, $\pi(\theta|X)$ is invariant to $L$. In PE, the *epistemic status* (knowledge) varies with $L$. To map this, you have to treat "Knowledge" not as the posterior probability, but as a binary classifier output where the cutoff is endogenous to the concept of knowledge itself.

  *   **Evidence $\leftrightarrow$ Likelihood:**
      *   *Stats:* The Likelihood Principle states evidence is contained entirely in $L(\theta; X)$. Stakes are irrelevant to evidence.
      *   *PE:* Some versions of PE imply that high stakes actually *reduce* the evidential weight of $X$.
      *   *The Fudge:* This violates the Likelihood Principle. To model this statistically, you would need a loss-dependent likelihood function, which is incoherent in standard theory. You have to model it as a change in the *required significance level* ($\alpha$), not the evidence itself.

  #### 3. The Residue (What Stats Misses)
  There are two philosophical components that have no direct counterpart in your framework.

  **A. The Norm of Assertion (Speech Act Theory)**
  Philosophers argue that "I know $p$" is a norm for assertion. You should not assert $p$ unless you know $p$.
  *   *Stats:* You report a p-value or a posterior. You don't "assert" truth; you quantify uncertainty.
  *   *Residue:* PE is often about conversational propriety. If you tell your spouse "I know the bank is open" in the High Stakes case, you have misled them, even if your posterior is 0.95. Statistics has no vocabulary for *misleading communication via accurate probabilities*. It assumes the number speaks for itself. PE argues the *label* "Knows" carries pragmatic implicatures that the number "0.95" does not.

  **B. Invariantism vs. Contextualism**
  *   *Stats:* The parameters are fixed. The model is fixed. The context is captured by the Loss Function.
  *   *PE:* The debate is about whether the word "knows" changes its *semantic content* based on context (Contextualism) or whether the facts about knowledge change while the word stays the same (Subject-Sensitive Invariantism).
  *   *Residue:* In stats, a Type I error is always a Type I error. In PE, whether a false belief counts as a "failure of knowledge" or just a "reasonable error" depends on the stakes. This is a metaphysical debate about the nature of the property "Knowledge," which decision theory treats as a primitive utility maximization problem.

  ---

  ### Part 3: The Verdict

  **Is this just the standard point that decision thresholds depend on costs dressed up in philosophical jargon?**

  **Mostly, yes. But with one crucial caveat.**

  If you adopt a **Decision-Theoretic Account of Knowledge** (i.e., "To know $p$ is to be in a position where it is rational to act on $p$"), then Pragmatic Encroachment is trivial. It is simply Wald's Decision Theory applied to epistemology. The threshold for rational action shifts with the Loss Function; therefore, the threshold for "knowledge" shifts.

  **However, the philosophers are fighting about something your framework excludes:**

  Statisticians generally maintain a **separation of inference and decision**.
  1.  **Inference:** Calculate $\pi(\theta|X)$ or $p$-value. (Stake-invariant).
  2.  **Decision:** Compare to threshold determined by $L$. (Stake-sensitive).

  Pragmatic Encroachment argues that **Knowledge is not Inference.** It is also not merely Decision. It is a hybrid state that licenses assertion and belief.
  *   **The Conflict:** A strict Bayesian will say: "My credence is 0.95 in both cases. I *believe* the bank is open to degree 0.95 in both cases. Only my *betting* changes."
  *   **The PE Counter:** "If you say 'I know' in the High Stakes case, you are lying. Therefore, 'Knowledge' cannot be identical to 'Credence 0.95'. Knowledge must include the stakes."

  **Conclusion:**
  Pragmatic Encroachment is the claim that the **boundary between Inference and Decision is porous.**
  *   In your vocabulary: It is the claim that the *significance level* $\alpha$ is not a free parameter chosen by the experimenter, but is **fixed by the context** such that if $\alpha$ is too loose for the stakes, the result is not "significant" (known), even if $p < 0.05$.
  *   **What you gain:** It forces you to acknowledge that reporting a posterior without a loss function is often pragmatically incomplete for guiding action.
  *   **What you lose:** It violates the Likelihood Principle and muddies the water between *evidence* (properties of the data) and *utility* (properties of the agent).

  **Final Answer:** It is decision thresholds depending on costs, **PLUS** the philosophical insistence that the label "Knowledge" tracks the *Decision* module, not the *Inference* module. If you define knowledge as "high probability," PE is false. If you define knowledge as "sufficient warrant for action," PE is true by definition. The debate is entirely about which definition matches our linguistic intuitions, not about the math of optimal decisions.
