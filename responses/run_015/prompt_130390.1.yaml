answer: |-
  **The Scenario**

  A public-health unit tracks a pathogen across four quadrants (A, B, C, D). A and B form the Northern sector ($S$); C and D form the Southern sector ($S^c$). Priors reflect population density: $P(A)=0.05, P(B)=0.45$ (North is mostly B); $P(C)=0.40, P(D)=0.10$ (South is mostly C). Prior $P(S)=0.50$. Prior odds $A:B$ are $1:9$.

  A field responder cannot see her quadrant. She receives a message: "In the monitored sector, Strain A and Strain B are equally prevalent." This fixes $P(A|S)=0.50$. She accepts this because responders are randomly assigned to cases within the monitored sector; if case counts are equal, her probability of being at an A-case is $0.5$.

  The report-selection protocol is automated. A satellite sensor classifies the outbreak location as North or South with $90\%$ reliability ($P(\text{Classify North}|S)=0.9$; $P(\text{Classify North}|S^c)=0.1$). The desk *always* issues a report, but it details the strain ratios only for the *classified* sector. The message content ("A and B are equal") does not mention North or South; only the protocol links the A:B ratio to the Northern sector.

  **The Computations**

  | Cell | Prior $P$ | (a) Kinematics | (b) MinRelEnt | (c) Conditioning |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | 0.050 | 0.250 | 0.188 | 0.450 |
  | **B** | 0.450 | 0.250 | 0.188 | 0.450 |
  | **C** | 0.400 | 0.400 | 0.500 | 0.080 |
  | **D** | 0.100 | 0.100 | 0.125 | 0.020 |
  | **$P(S)$** | **0.500** | **0.500** | **0.375** | **0.900** |

  *Notes:*
  (a) Fixes $P(S)=0.500$; sets $P(A|S)=0.500$; preserves $P(C|S^c), P(D|S^c)$.
  (b) Minimizes $\sum q \ln(q/p)$ s.t. $q_A=q_B$. Solution $q_i \propto p_i e^{\lambda f(i)}$. With $q_A=q_B$, $e^\lambda=\sqrt{p_B/p_A}=3$. Normalizer $Z=0.80$. $q_S = (0.05\cdot3 + 0.45/3)/0.8 = 0.375$.
  (c) Likelihood of receiving A:B report is $0.9$ in $S$, $0.1$ in $S^c$. Posterior odds $S:S^c = (0.5\cdot0.9):(0.5\cdot0.1) = 9:1 \Rightarrow P(S)=0.900$. Inside $S$, constraint $P(A|S)=0.500$ applies. Inside $S^c$, prior ratio $C:D$ preserved.

  **The Analysis**

  Procedure (c) is correct. The report is not a free-floating constraint; it is data generated by a sensor that is more likely to trigger on $S$ than $S^c$. Receiving a report about A and B is evidence that the sensor classified the location as North, which boosts $P(S)$ from $0.50$ to $0.90$. Procedure (a) ignores this selection effect, treating the protocol as non-informative. Procedure (b) ignores the selection effect and additionally distorts $S^c$ probabilities to minimize divergence, effectively penalizing $S$ because satisfying $A=B$ is "costly" given the prior $1:9$ ratio.

  If the protocol were a fair coin flip ($50\%$ reliability), the likelihood ratio becomes $1:1$. Procedure (c) would then yield $P(S)=0.50$, collapsing onto (a). Procedure (b) would remain at $0.375$. This asymmetry reveals that (a) is not a default logic of constraints, but a special case of conditioning where the selection protocol is independent of the partition. If the coarse channel's reading ("North") were transmitted explicitly, the case becomes routine conditioning on an event; the philosophical point remains, but the puzzle vanishes because the selection evidence is no longer hidden in the protocol.

  **The Defenses**

  1.  **The "Not a Constraint" Defense:** A defender of (a) may argue that specifying the protocol turns the input into an event, so (a) was never intended to apply. *Concede this.* It is substantive, not a retreat. It concedes that (a) has no authority once the generation process is known. The rule is not "update on constraints," but "update on constraints *only if* the protocol is non-informative."
  2.  **The "Refined Space" Defense:** A MinRelEnt proponent may argue we should minimize entropy over the joint space of Location $\times$ Sensor. *Answer:* If you do that, MinEnt becomes Conditioning (c). The divergence in (b) arises only by artificially restricting the space to exclude the protocol. This concedes that (b) is representation-sensitive.
  3.  **The "Category Error" Defense:** A colleague may say comparing (b) and (c) is unfair as they handle different input types (constraints vs. events). *Concede in print.* Acknowledge they are distinct formal tools. However, insist that real-world "constraints" are often "events" in disguise. If a method ((b)) cannot accommodate the selection effect without manual space-refinement, it is less robust for institutional reporting cases than Conditioning ((c)).

  **Caveat:** This case presupposes that the agent treats the protocol reliability as part of the total evidence. If one insists that "conditional constraints" must be abstracted from their source by definition, the example argues that such abstraction is epistemically costly.
