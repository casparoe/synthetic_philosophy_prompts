      *   *Individual Case:* Why can Present Self bind Future Self? Is it because they are *metaphysically identical*? Or because they share a *structure of agency* and *higher-order interests*? Most decision theorists (like Thomas Schelling or Jon Elster, though I can't cite them directly per instructions) argue it's about managing *intra-personal conflict* regarding *goals*, not metaphysical identity.
