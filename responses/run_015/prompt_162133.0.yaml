answer: |-
  Hi there,

  This is a fantastic plan and honestly one of the best ways to teach this specific objection because it forces the students to generate the tension themselves rather than just memorizing a critique they do not yet feel. Your instinct to keep the arithmetic identical across the rounds is the right move because it isolates the variable of personhood versus time versus transferability. I would suggest sticking closely to your three-round structure but tweaking the third round slightly to ensure you hit that specific point about compensability that you care about. Your original idea for round three was about choosing the decision rule behind a veil of ignorance, which is great for consent, but if your core goal is to separate additivity from compensability, you might get more mileage out of making round three about transferable currency instead. Here is how I would stage it to keep the timing tight for seventy-five minutes with eighteen students.

  You should divide the class into four groups of four and one group of two, or just merge the extra two into existing groups to make four groups of five, though groups of four are cleaner for the math. For round one, give each student in the group a sealed envelope labeled with their number, one through four. Inside are two slips of paper representing Policy A and Policy B. The numbers should be identical for every group. Policy A gives students one, two, and three a gain of ten points each, but student four loses twenty-five points. The total utility is plus five. Policy B gives everyone zero points. The total utility is zero. Crucially, tell them these points represent course participation credits that cannot be traded or shared. They must vote as a group on which policy to adopt. If they choose Policy A, the student who lost the twenty-five points must stand up and read a statement you provide that says I accept this loss for the greater good. This forces the interpersonal cost to become public and verbal.

  For round two, you collapse the group. Ask for one volunteer to come to the front, or have each group select one representative. This single student receives four envelopes labeled Monday, Tuesday, Wednesday, and Thursday. The numbers inside are identical to round one. Monday through Wednesday gain ten points of leisure time, Thursday loses twenty-five points of leisure time. The total is still plus five. This student decides alone whether to accept the schedule. There is no vote, no group pressure, and no one else suffers the loss. The arithmetic is unchanged, but the locus of agency and suffering is now within a single person over time.

  For round three, return to the groups of four. Give them the same envelopes with the same numbers, ten for three people and negative twenty-five for one. The total is still plus five. However, this time you tell them the points represent cash vouchers that can be pooled and divided however they wish after the decision is made. They can choose Policy A and then the winners can compensate the loser from their winnings. This directly targets your requirement to show a version where the benefit can be handed to the loser. If they choose Policy A here, the loser does not have to read the statement because they can be compensated. This creates the contrast you need between round one where the loss was borne alone and round three where the loss could be mitigated by the gains of others.

  When you move to the debrief, do not start by naming Rawls or utilitarianism. Start by asking the room why round one felt different from round two since the math was identical. You are looking for them to articulate that sacrificing a part of oneself for oneself feels rational in a way that sacrificing one person for others does not. Then ask them about the difference between round one and round three. They should notice that in round three the loss did not feel as permanent or unjust because the winners could pay off the loser. This is where you introduce the distinction you care about. You can explain that utilitarianism treats society like a single person over time, assuming that because the numbers add up, the gain compensates the loss. The objection you are teaching is that persons are distinct in a way that days in a life are not. A gain for me does not compensate a loss for you unless I can actually give you something to make up for it, and in round one the rules of the game mirrored real life where I cannot give you my participation credits or my pain threshold.

  There are a few things that will predictably go wrong the first time you run this. You should expect at least one student to argue that round two is still unethical, claiming that their Thursday self is distinct enough from their Monday self that sacrificing Thursday is a form of oppression. This is actually a useful objection because it opens the door to discussing psychological continuity, but you need to be ready to park it so it does not derail the main point about interpersonal distinctness. You can acknowledge it and say that for the sake of this exercise we are assuming a unified self over time, but note that their intuition is shared by some philosophers. Another likely snag is that in round three, the group might still refuse Policy A even with transferable cash, perhaps due to risk aversion or spite. If this happens, do not force the math. Instead, ask them why they refused a deal that made everyone better off after compensation. This leads to a discussion about rights or constraints that even compensation cannot override, which is a deeper version of the separateness of persons objection.

  You also need to be straight with yourself about what this game cannot show. It cannot prove that utilitarianism is false. It only demonstrates that utilitarianism conflicts with certain deeply held intuitions about fairness and distinctness. A committed utilitarian could look at round one and say the students are simply wrong to feel uneasy, arguing that if the total welfare is higher, the decision is correct regardless of the distribution. The game relies on the students trusting their intuition that trading one person off is wrong, but the game itself does not provide an argument for why that intuition is correct. You will have to supply that philosophical heavy lifting in the lecture portion after the game. You will need to explain that the complaint in round one is not just that someone lost, but that they were used as a means to an end without their consent and without the possibility of compensation, which violates the boundary between persons. The game creates the feeling of that violation, but you must provide the vocabulary for it.

  Finally, keep a strict eye on the clock. The discussion in round one can easily eat twenty minutes if you let them debate the voting procedure. Tell them upfront they have two minutes to decide per round. The power of this exercise is in the immediate visceral reaction, not in a prolonged negotiation. If you keep the rounds snappy and save the real thinking for the debrief, you will get exactly the result you want where they feel the weight of the objection before you ever write the term separateness of persons on the board. Good luck with the seminar.
