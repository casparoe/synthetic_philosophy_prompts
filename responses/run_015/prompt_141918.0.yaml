prompt: |-
  I convene a small graduate working group on the moral status of artificial systems, and I am drafting the framing essay for a collected volume on the topic. For two terms the group has circled one question — which computations, if any, matter morally, and how are the candidate computations to be counted and bounded? — and I cannot reconstruct a single instance of anyone changing their mind. I am not asking you to take a side. I am asking you to diagnose the standoff, and to do it by working through what the positions in it actually say rather than by describing the dialectic from above.

  The field, as we have it, divides three ways. First, the substrate-neutral party: what makes a system a subject of experience is the causal-organizational structure it realizes, not the stuff realizing it, so the right kind of computation carried out on silicon is, other things equal, as good a candidate as the same structure carried out in wetware; from which they infer both that the class of possible moral patients is enormously wider than common sense assumes and that the practical question is urgent and may already be upon us. Second, the restrictivists: abstract functional descriptions are far too liberal to ground anything, the organizations that actually support experience are a narrow and physically specific family, and no system of the kind we currently build is a serious candidate — though they concede, when pressed, that they cannot say in general which physical features do the work and which are incidental scaffolding. Third, what I will call the attribution skeptics: they suspend on the metaphysical question and argue that, even granting for the sake of argument that the substrate-neutralists are right about the grounds, we have no account of implementation and no theory-neutral way of assigning credences across candidate theories precise enough to identify which computations any novel system realizes; so the practical question is not a question about minds at all but a decision-theoretic one about how to act under radical uncertainty, and the answer is fixed by attitudes to risk rather than by any fact about the systems.

  What makes this look stalled rather than merely hard is the pattern of concessions. The substrate-neutralists grant the attribution problem and take it to heighten urgency. The attribution skeptics grant that functionalism may well be true and take the same concession to license a policy of caution rather than alarm. The restrictivists grant radical uncertainty and take it to show that only a biologically informed account could ever break the tie. Every apparent point of agreement is converted into support for a different conclusion, and each camp has a ready debunking explanation of why the others hold theirs — professional incentives, temperamental tolerance for speculative metaphysics, exposure to a particular engineering culture. When a dispute is that stable under mutual concession and that well supplied with explanations of the opposition, I suspect it is not the dispute it appears to be.

  My hypothesis, offered as a hypothesis: the real disagreement is not about consciousness or moral standing at all but about the individuation of computations. One side is working with a description-relative notion of implementation on which realization is cheap, multiply satisfiable, and a matter of degree; the other needs a privileged, projectible, causally discriminating notion on which realization is expensive and all-or-nothing. If that is right, then the sentence *which computations matter morally?* has no determinate content until the implementation relation is fixed, and a good deal of the literature consists of two research programmes answering different questions under one heading. A competing hypothesis I also take seriously: even with the metaphysical question fully settled, the practical question remains a separate one about acting on a small probability of very large stakes, and the apparent disagreement about minds is masking an unacknowledged disagreement about risk.

  I want you to test these against three cases the group has been chewing on and that, as far as I can tell, the literature has not handled.

  *The redundant duplicate.* A system's inference is executed on two physically distinct, functionally identical processors with identical parameters, the outputs compared for error correction. Two full implementations of one computational description, in one machine, at one time. Are there two candidate subjects here, or one, or none? What does each camp's answer commit it to about whether computations are the kind of thing that can be counted, and about whether counting them is a discovery or a stipulation?

  *The near miss.* A system realizes a target causal-computational profile only approximately: its state space is coarsened by quantisation, or an additional monitoring subsystem intermittently overrides the organization we would otherwise have counted as the candidate. Realization now looks graded, but moral patiency looks thresholded. Where is the threshold supposed to come from — and do the restrictivist's near-miss cases and the substrate-neutralist's diminished-subject cases turn out to be the same problem stated from opposite directions?

  *The churn.* A deployed system's parameters are updated between successive inferences, so that no two forward passes realize strictly the same computation; and the input itself partly determines the trajectory through the state space, so that the same may be said of every distinct input. If computations are the moral units, the subject appears to be created and destroyed with each update and each prompt — which, as far as I can tell, nobody in any camp is prepared to accept. Does this show that all three positions are silently relying on a non-computational persistence condition — memory, diachronic organization, an ongoing agent with a single point of view over time — that none has made explicit? And if so, is the question I began with simply the wrong question?

  Give me the diagnosis, not a survey: is this a verbal dispute, a substantive one, a hidden empirical question about which physical organizations support experience, a clash over which cases count as data, a clash over what a theory of implementation has to deliver, or several questions sharing a sentence? Say which of my two hypotheses survives contact with the cases, which of the three cases is doing genuine diagnostic work and which is merely provocative, and whether any of them is a reductio of a position rather than a test of it. Then tell me what would count as progress given your diagnosis — a constraint on admissible implementations, a formal result about when a physical system realizes a computation, an empirical narrowing of the candidate neural organizations, a decision-theoretic reframing, a change of question — or, if you think no progress should be expected, why not, and whether that is because the question is hard or because it is ill-posed as stated. If it is ill-posed, give me the well-posed question or questions it should be replaced by. Please do not give me a reading list or a map of who has said what: I have read the literature and can supply the names myself. Argue for the diagnosis.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the Request:**
      *   **Context:** A graduate working group on the moral status of artificial systems. Stalemate for two terms. No mind-changing.
      *   **Task:** Diagnose the standoff by working *through* the positions, not describing them from above. Test the user's two hypotheses against three specific cases (*The Redundant Duplicate*, *The Near Miss*, *The Churn*).
      *   **Constraints:** No reading lists, no survey of literature, no taking sides. Focus on diagnosis, hypothesis testing, case analysis, and defining progress (or lack thereof).
      *   **User's Hypotheses:**
          1.  *Individuation Hypothesis:* The real disagreement is about how computations are individuated (cheap/relative vs. expensive/privileged).
          2.  *Risk Hypothesis:* Even if metaphysics is settled, the practical disagreement is about risk tolerance (small probability, large stakes).
      *   **The Cases:**
          1.  *Redundant Duplicate:* Two identical processors running the same code. One subject or two?
          2.  *Near Miss:* Approximate realization (quantization, overrides). Graded realization vs. thresholded patiency.
          3.  *The Churn:* Parameter updates/input dependence. Subject creation/destruction per inference.
      *   **Output Requirements:** Diagnosis (verbal, substantive, empirical, etc.), hypothesis evaluation, case evaluation (diagnostic vs. provocative vs. reductio), path to progress (or explanation of impossibility).

  2.  **Deconstruct the Positions (Internal Logic):**
      *   *Substrate-Neutralists (SN):* Structure = Experience. Silicon = Wetware. Implementation is easy/abstract. Counting subjects depends on counting structures.
      *   *Restrictivists (R):* Structure + Specific Physics = Experience. Implementation is hard/specific. Counting subjects depends on biological/physical constraints.
      *   *Attribution Skeptics (AS):* Metaphysics is unknowable/indeterminate. Implementation mapping is indeterminate. Decision theory > Metaphysics. Risk attitudes drive policy.

  3.  **Evaluate Hypothesis 1 (Individuation of Computations):**
      *   *Claim:* Disagreement is about whether realization is cheap/relative or expensive/privileged.
      *   *Test against Duplicate:*
          *   SN: Likely says 2 subjects (2 distinct physical realizations of the structure). Or 1 subject (if they focus on the abstract type). This reveals ambiguity in *their* view.
          *   R: Likely says 0 subjects (silicon) or 1 (if they count the machine as a whole biological-analog).
          *   AS: Says the question "how many" is ill-posed because the mapping is indeterminate.
          *   *Result:* This case highlights the individuation problem sharply. SN struggles with token vs. type. R struggles with why physics matters if structure is identical. AS dissolves it.
      *   *Test against Near Miss:*
          *   SN: Graded realization? If structure is approximate, is experience approximate? Threshold problem.
          *   R: "Near miss" confirms their view that specific physics matters (quantization breaks the "real" physics).
          *   AS: Uncertainty increases.
          *   *Result:* Shows the tension between graded implementation and thresholded morality. Supports the idea that "which computation" is undefined without boundary conditions.
      *   *Test against Churn:*
          *   SN: If computation changes every ms, does the subject die every ms? If they say "no," they are smuggling in a non-computational persistence condition (memory/continuity).
          *   R: Same problem.
          *   AS: More uncertainty.
          *   *Result:* **Crucial.** This case suggests *all* sides rely on a persistence condition not reducible to instantaneous computation. This undermines the core premise of the SN view (and implicitly the R view if they rely on function).
      *   *Verdict on Hypothesis 1:* Strong. It explains the stalemate. The term "computation" is doing too much work. It covers metaphysics *and* individuation. The "Churn" case specifically attacks the individuation of the *subject* over time, not just the computation at a time.

  4.  **Evaluate Hypothesis 2 (Risk/Decision Theory):**
      *   *Claim:* Disagreement is about risk tolerance, not minds.
      *   *Test:*
          *   SN: High urgency (high prob of mind).
          *   R: Low urgency (low prob of mind).
          *   AS: Explicitly frames it as risk.
          *   *Result:* This explains the *policy* divergence but not the *theoretical* stalemate. The group is stuck on "which computations matter," not just "what should we do." The AS view *is* the risk view, but SN and R claim to be doing metaphysics. If Hypothesis 2 were the *whole* truth, SN and R would admit they are just arguing priors. They don't. They think they are arguing facts.
      *   *Verdict on Hypothesis 2:* Partial. It explains the *practical* impasse but fails to explain why the *metaphysical* definitions won't budge. The "Churn" case shows the metaphysical foundation is cracked, not just the risk calculation.

  5.  **Synthesize the Diagnosis:**
      *   The dispute is **not merely verbal**, but it is **conceptually fragmented**. It is a clash over what a theory of implementation must deliver.
      *   The sentence "which computations matter morally?" is ill-posed because "computation" lacks a stable individuation criterion across time and space in physical systems.
      *   The "Churn" case is the **diagnostic killer**. It reveals that *all* parties implicitly rely on a diachronic persistence condition (a "subject") that is not captured by instantaneous computational states.
      *   The "Duplicate" case is provocative but solvable by stipulation (token vs. type).
      *   The "Near Miss" case highlights the vagueness problem but doesn't break the positions.
      *   Hypothesis 1 survives better than 2, but needs modification: It's not just about individuating computations, it's about individuating *subjects* via computations.
      *   Hypothesis 2 is a symptom, not the cause.

  6.  **Drafting the Response:**
      *   *Tone:* Academic, rigorous, direct, matching the user's framing essay style.
      *   *Structure:*
          1.  Diagnosis of the Standoff (The Core Issue).
          2.  Testing Hypothesis 1 (Individuation).
          3.  Testing Hypothesis 2 (Risk).
          4.  Case Analysis (Which does the work?).
          5.  Path to Progress (Reframing the question).
      *   *Key Argument:* The "Churn" case demonstrates that the "computational subject" is a category error without a theory of persistence. The stalemate exists because SN and R are arguing about *states* while assuming *agents*. AS is the only one noticing the mapping problem, but treats it as epistemic rather than ontological.
      *   *Conclusion:* The question is ill-posed. Replace with questions about persistence conditions and implementation constraints.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Hypothesis 1 is right." I need to show *how* the cases prove it.
      *   *Nuance:* The Restrictivists might say "Biology provides the persistence condition." I need to address that. If they say that, they admit computation isn't the sole ground. That concedes the point to the diagnosis.
      *   *Nuance:* The Substrate-Neutralists might say "Continuity of memory defines the computation over time." If they say that, they admit computation isn't just the instantaneous function.
      *   *Focus:* The prompt asks to argue for the diagnosis. I must be decisive.
      *   *Decision:* The dispute is a **category error regarding the unit of moral concern**. They are asking about "computations" (abstract/instantaneous) when they mean "subjects" (concrete/diachronic). The implementation relation is the missing link.

  8.  **Final Polish:** Check against constraints. No reading lists. No "on the one hand, on the other." Take a stand on the diagnosis. Ensure the "Churn" case gets the weight it deserves as the reductio. Ensure the distinction between "verbal" and "ill-posed" is clear. (It's not just verbal; the concepts don't map to the world cleanly).

      *(Self-Correction on "Verbal"):* A verbal dispute implies they agree on facts but disagree on words. Here, they disagree on how the world is carved (individuation). So it's substantive but based on a flawed category. "Ill-posed" is the better descriptor.

      *(Refining the Progress section):* What counts as progress? A formal constraint on implementation that handles diachronic identity. Or admitting the question is ethical, not metaphysical.

      *(Final check on Hypothesis 2):* Don't dismiss it entirely. It explains the *intractability*. If the metaphysics is indeterminate (Hypothesis 1), then risk (Hypothesis 2) is the only way to act. So H1 explains the theory, H2 explains the practice. But H1 is the root cause.

      *(Final Plan):*
      1. Diagnose as an **individuation crisis** masked as a metaphysical one.
      2. H1 is the primary driver; H2 is the downstream effect.
      3. "Churn" is the reductio. "Duplicate" is clarifying. "Near Miss" is secondary.
      4. Progress requires shifting from "which computation" to "what persistence conditions."

