answer: |-
  You have hit on a friction point that is currently generating a lot of heat in the moral responsibility literature, and your intuition is sharp: **yes, this is partially a verbal disagreement, but it is driven by a substantive split regarding the function of blame.**

  Your supervisor is likely operating within a "narrow" analytic framework where standing is a normative power between individual moral agents. You are operating within a "broad" framework where standing is a condition of legitimate moral address within a social or political context. When you talk past each other, it is because you are answering different questions: they are asking, *"Is the blame morally true?"* and you are asking, *"Is the blamer authorized to speak?"*

  Here is a breakdown of the conceptual smuggling happening in your debate, why the institutional cases matter more than your supervisor admits, and three specific moves to break the impasse.

  ### 1. The Verbal Disagreement: Three Concepts of "Standing"
  You suspected that "standing" is doing too much work. You are correct. In the literature, "standing to blame" typically conflates three distinct normative statuses. If you can disentangle these, you may find that you and your supervisor agree on some and disagree on others.

  *   **Normative Authority (The Right):** Do I have the *right* to hold you accountable? This is the "unclean hands" view. If I violate the norm, I forfeit the authority to enforce it. (This is where hypocrisy matters most).
  *   **Epistemic/Sincerity Condition (The Voice):** Do I actually believe the norm I am invoking? If I blame you for lying while I lie, my blame is *insincere*. It becomes a tool of manipulation rather than moral address.
  *   **Pragmatic/Social License (The Hearing):** Will my blame be effective or accepted by the community? This is where your climate activist example lives. If an activist flies private, they lose *credibility*, but do they lose the *moral truth* of their claim?

  **The Impasse:** Your supervisor is likely defending **Normative Authority** in interpersonal cases (arguing that my faults don't change the truth of your wrong). You are attacking **Social License** and **Sincerity** in institutional cases (arguing that without consistency, the sanction is illegitimate).

  **The Move:** Ask your supervisor: *"When we say a hypocrite lacks standing, are we saying their blame is false, or that it is unauthorized?"* If they say "unauthorized," press them on why institutional authorization works differently than interpersonal authorization.

  ### 2. The Substantive Split: The Function of Blame
  The deeper issue is what blame is *for*. This is the "hidden substantive split" you suspected.

  *   **The Communicative View (Likely your Supervisor):** Blame is a moral conversation aimed at recognition of wrongs. On this view, the truth of the blame is paramount. If B stole, A can point it out even if A also stole. The focus is on B's moral status. Hypocrisy is a separate vice of A's, but it doesn't erase B's theft.
  *   **The Enforcement/Political View (Likely You):** Blame is a mechanism of social regulation and norm enforcement. On this view, the *legitimacy of the enforcer* is paramount. An ethics board that ignores its own supply chain violations isn't just being hypocritical; it is failing the condition of **representative authority**. It claims to speak for the norm, but its actions show it does not embody the norm.

  **Why the Supervisor Dismisses Institutional Cases:**
  They likely view institutions as derivative. They might argue, "An ethics board is just a collection of individuals; let's solve the individual standing problem first."
  **Why This Is Weak:** Institutional standing is not just the sum of individual standing. It involves *role obligations*. A judge who speeds on the way to court still has standing to sentence a speeder because they act *in the name of the law*, not themselves. But an ethics board acting hypocritically undermines the *law itself*.

  ### 3. How to Break the Impasse
  You cannot win this by piling on more examples (the "climate activist" card is already overplayed). You need to shift the conceptual ground. Here are three specific moves:

  #### Move A: The "Commitment vs. Compliance" Distinction
  Propose that standing requires **Commitment to the Norm**, not **Perfect Compliance with the Norm**.
  *   **Argument:** A person (or institution) loses standing not because they *failed* the norm, but because their failure demonstrates they do not *hold* the norm as binding.
  *   **Application:** In your ethics board case, the issue isn't that they violated labor laws (compliance); it's that they prioritize cost over ethics while punishing students for ethics violations (commitment).
  *   **The Trap for Supervisor:** If they agree standing requires *commitment*, you can argue that systemic hypocrisy proves a lack of commitment. If they disagree, they must explain why a blamer who thinks the norm is optional has standing to enforce it as mandatory.

  #### Move B: The "Right to Reject" (Target-Centric Standing)
  Shift the focus from the Blamer (A) to the Target (B).
  *   **Argument:** Standing isn't about A's moral record; it's about B's right to reject certain kinds of address. B can say to A: *"You cannot hold me to a standard you treat as optional."* This isn't a *tu quoque* fallacy (which attacks the truth of the claim); it is a **procedural objection**.
  *   **Reframing:** Tell your supervisor: *"I am not arguing the blame is false. I am arguing the Target has a right to dismiss the address as disrespectful."*
  *   **Why it works:** This keeps the debate within interpersonal morality (which the supervisor likes) but validates your intuition that hypocrisy changes the dynamic. It makes standing a **relational privilege** that can be revoked by the hypocrite's behavior.

  #### Move C: The "Representative Authority" Bridge
  This is how you bring your institutional cases back to the "core" interpersonal issue.
  *   **Argument:** All moral blamers claim to speak for the moral community, not just themselves. When I blame you, I am saying, *"We do not do this."*
  *   **The Wedge:** If I am a hypocrite, I am misrepresenting the community. I am claiming to represent a norm that I myself treat as negligible. Therefore, my standing is undermined because my **representative authority** is fraudulent.
  *   **The Payoff:** This shows the supervisor that the "institutional" case (ethics board) is just a magnified version of the "interpersonal" case (individual blamer). Both rely on the claim to represent the norm. If the institutional case clearly loses standing due to hypocrisy, it suggests the *source* of standing is representative authority, which is vulnerable to hypocrisy in individuals too.

  ### Summary Recommendation
  Your debate is stuck because you are arguing about **cases** while the disagreement is about **definitions**.

  1.  **Concede the "Core":** Acknowledge that interpersonal blame is the foundational unit.
  2.  **Challenge the "Boundary":** Argue that institutional cases are not "different kinds" of cases, but **stress tests** for the theory of interpersonal standing. If a theory of standing cannot explain why a hypocritical ethics board lacks authority, it is likely missing a necessary condition for *individual* authority too (i.e., representative sincerity).
  3.  **Propose the Terminology:** Suggest explicitly distinguishing **Normative Standing** (do I have the right?) from **Discursive Fitness** (am I the right person to speak?).

  If your supervisor insists that institutional cases are irrelevant, ask them to justify why **moral authority** functions differently in a collective agent than in an individual agent. If they can't, you have exposed that their theory is too narrow to account for the actual phenomenology of blame. If they can, you have successfully carved out a distinct research niche for yourself: *The Structural Conditions of Moral Standing.*
