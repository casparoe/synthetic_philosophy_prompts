prompt: |-
  hey, i sit on the clinical ethics board at a neuroprosthetics center where we do gradual brain-tissue replacement (synthetic analogs swapped in region by region over months). we're seeing more cases where a patient who signed an advance directive pre-op now wants to change it halfway through, or the family claims the "current version" isn't bound by the old contract. i need a reusable decision procedre my team can actually run -- mostly nurses and one lawyer, no philosophers -- in about 20 minutes per case.

  ground it in the principle that personal identity through this kind of replacement survives only if there's a continuous "first-person ownership loop" linking pre-op architecture to the current one, not just memory retention or behavioral match. turn that into a step-by-step checklist or flowchart in words: ordered questions, what counts as a sufficient answer, the hard stop where we say "no, not the same person for legal/authorty purposes," and clearly flag which steps are judgment calls we can't eliminate. apply it to three scenarios:

  1. 30% hippocampal replacement; patient narrates life in first person with emotional continuity.
  2. 85% cortical replacement; behavioral tests perfect, but patient reports feeling like they're observing the old self from behind glass with no ownership loop.
  3. replacement paused at 50% for 8 months, synthetic parts in "sleep mode," then resumed.

  include one case where the answer comes out in a way the board will hate -- like perfect behavior but no authorization. also be explicit about what this procedre can't settle and where it just hands the decision to a person.

  keep the whole thing under 550 words. don't give bibliographies or citations -- we can't search and don't have time. there's a typo or two in here but leave them, i want it messy.
