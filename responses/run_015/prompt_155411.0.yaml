  **Ownership Loop Protocol (OLP)**
  *For mid-procedure directive disputes. Time limit: 20 mins.*

  **Step 1: The Indexical Check**
  Ask: "When you say 'I', what starts the feeling?"
  *Sufficient:* Points to body/history continuously.
  *Insufficient:* Points to "them" (pre-op self) or hesitates >10s.
  *Judgment Call:* Distinguishing fatigue from dissociation.

  **Step 2: The Gap Analysis**
  Review logs. Any period where synthetic parts were offline while biological tissue was inactive?
  *Sufficient:* No gaps > 24hrs.
  *Insufficient:* Gaps exist (e.g., sleep mode pauses).
  *Hard Stop:* If gap > 1 week, loop presumed broken.

  **Step 3: Ownership Attribution**
  Ask: "Are you responsible for the person who signed the pre-op contract?"
  *Sufficient:* "Yes, that was me."
  *Insufficient:* "That was a different version" or "I observe them."
  *Hard Stop:* If "No", pre-op directive does not bind current entity. Legal authorty reverts to next-of-kin or court.

  **Application:**
  1. *30% Hippocampal:* Passes Step 1 & 3. Narrative intact. Directive holds.
  2. *85% Cortical:* Fails Step 3. Patient reports "behind glass" observation. **Result:** Pre-op directive void. *Board will hate this:* Behavior is perfect, tests normal, but legally this is a new entity. You cannot enforce the old contract. The family will claim the patient is fine; the protocol says they are a stranger wearing the patient's face.
  3. *50% Paused (8 months):* Fails Step 2. Synthetic sleep mode breaks continuous processing. *Judgment Call:* Was biological tissue active enough to sustain loop? If no, directive void.

  **Limits & Handoffs:**
  This procedre cannot settle safety risks. Even if identity is broken (Step 3 Fail), do not disconnect life support without legal counsel. It also cannot measure "degrees" of ownership; it is binary for legal clarity. If Step 1 is ambiguous, hand off to the lead neurologist for imaging confirmation. We cannot eliminate the judgment call on fatigue vs. dissociation; the nurse on duty must sign that assessment.

  **Note:** If the loop is broken, the patient is a successor, not the same person. Treat accordingly. Dont ignore the hard stop just because the family is upset. If the lawyer says wait, you wait, but the ethics verdict stands.
