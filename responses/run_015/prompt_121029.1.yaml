  hey — i'm a novelist working on a story about a fictional archipelago where starvation isn't caused by drought but by supply-chain algorithms that quietly redirect grain away from local populations, and i want to ground the politics in something real. can you lay out the most important implicaitons of Sen's argument that famines are politcal crimes rather than natural disasters, specifically drawing on his comparisons of the Bengal famine in '43, the Irish famine, and the Great Leap Forward? i need this in American English, with no bibliographies or citations — just the conceptual meat. in particular, i'm interested in the weirder, less-discussed corollaries for democratic responsability when harm is distributed across bureaucratic systems instead of coming from one obvious dictator. please avoid the standard textbook framing and dig into the edges that matter for fiction writing about systemic blame. (writing this on my phone between chapters, so apologies for the typos)
reasoning: |-
  Thinking Process:

