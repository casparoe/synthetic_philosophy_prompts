      *   **Irish Famine:** Food was being exported *out* of Ireland while people starved. Market mechanisms + colonial indifference.
      *   **Great Leap Forward (China):** Exaggerated production reports led to excessive procurement. Local officials lied to please central planners; central planners took the grain based on lies. Everyone was following rules, but the system collapsed.

  4.  **Focus on the "Weird/Less-Discussed Corollaries" (The Fiction Writer's Angle):**
      *   The user wants to explore *systemic blame* in a *democratic/bureaucratic* context (algorithms redirecting grain), not just a dictator starving his people.
      *   *Key Insight 1: The Banality of Allocation.* It's not malice; it's optimization. The algorithm isn't evil; it's efficient according to a metric that excludes human survival.
      *   *Key Insight 2: Information Asymmetry & Feedback Loops.* In the Great Leap Forward, false data killed. In the user's story, algorithms might rely on data that ignores the poor (who don't generate digital footprints).
      *   *Key Insight 3: Democratic Complicity.* In a democracy, voters don't vote on grain shipments. They vote for leaders who delegate to technocrats. The distance between the voter and the starvation is vast. This creates "innocent" accomplices.
      *   *Key Insight 4: The Definition of "Entitlement."* In the modern context, entitlement isn't just legal rights; it's purchasing power or digital credit. If the algorithm decides your credit is worthless, you starve, even if the silo is full.
      *   *Key Insight 5: Visibility vs. Invisibility.* Sen argues a free press prevents famine. But what if the famine is hidden in data? What if the starvation is slow and distributed, not a dramatic crisis?

  5.  **Drafting - Section by Section:**

      *   *Introduction:* Hook into the core shift from "no food" to "no access."
      *   *The Historical Triad (Briefly):* Connect Bengal, Ireland, GLF to the core theme of *distribution* over *production*.
      *   *The Bureaucratic Murder:* Focus on how rules kill without a killer. The "just following orders" aspect but modernized (just following code).
      *   *Democratic Responsibility:* This is the crucial part. How do you blame everyone and no one? The diffusion of guilt.
      *   *The Algorithmic Twist:* Connect Sen to the user's specific plot (algorithms). How does "entitlement" look in a digital age?
      *   *Conclusion:* A summarizing thought on the horror of systemic indifference.

  6.  **Refining the Tone:**
