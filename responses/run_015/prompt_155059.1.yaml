prompt: |-
  I'm a TA for an intro course on democracy and collective decision-making — well, "teaching fellow," whatever — and I've got one 75-minute slot with about 20 undergrads coming up and the sylabus just says "majority rule and beyond," which is useless. What I want is for them to run into the problem rather than me putting it on a slide. The thing I keep half-noticing is this: if a group votes separately on each of several connected questions, the group can end up committed to a set of answers that doesn't hang together even though every individual person voted consistently, and whether you get one bottom-line answer or the opposite one seems to depend on whether you ask people to vote on the reasons or on the final verdict. I'd like them to feel both of those before anybody says the name, so ideally the name comes out of the debrief, and not out of some kid's mouth in minute three.

  Rough constraints: movable chairs, a projector, index cards, phones if needed but I'd rather most of it be on paper — voting on a google form feels like a survey, and I want it to feel like a decision. The scenario I was toying with is the class acting as some university committee that has to rule on a case (cancel a visiting speaker? deny a grant? find a student responsible for a conduct violation?) where the verdict depends on two or three sub-questions that are logically connected. I can't decide on the stakes. Part of me wants the outcome to be real, e.g. it determines whether the last session is a review session or whether they get to pick between two essay prompts, but I worry real stakes make everyone strategic in a way that washes out the effect; part of me thinks a fake department with real voting is cleaner. I did a dry run with two friends over coffee and it sort of worked, but they both already knew what I was fishing for, so I learned nothing.

  What I actually need is the runnable thing. Give me the scenario and the exact propositions to be voted on — and I'd like the connections between them to not all be the same shape: at least one place where the verdict needs all the sub-questions to pass, one where there are two independent routes to the same verdict, maybe one sub-question that's required but not on its own enough. I want them to have to look at the structure each time rather than pattern-match after the first round. Then phases with timings for 75 minutes, and roles if they earn their place: I was thinking of handing one person the power to decide which questions get asked and in what order, and privately telling them which outcome to aim for, to see whether they can steer it — but I don't know whether that's a great idea or whether it just tells the room the answer in advance.

  Two specific things I'm stuck on. First, abstentions: I'd like one of the propositions to be something students genuinely have no firm view on, and I don't know whether a blank ballot should count against, count as going along with the majority, or remove that person from that particular vote — and I'd like to know what each choice does to the outcome, because I suspect the choice isn't neutral. Second, the debrief: I want it to map moments from the session onto the structure, especially the moment when somebody says "wait, nobody actually voted for that." Also, relatedly: is there anything real to say about whether the issue-by-issue procedure or the bottom-line procedure is more likely to land on the truth? I have a vague memory that it depends on how reliable the individual voters are, but I don't trust the memory and I'm not going to tell 20 undergrads something I can't defend — so tell me what's settled there and what's genuinely contested.

  And be honest about what will go wrong. My two fears are that one sharp student names the whole trick in the first five minutes and deflates it, and that the votes just won't split the way the setup needs and I'll have to quietly fudge the tally, which I really don't want to do. If there's a way to rig the setup so the interesting pattern shows up without me having to interfere in the counting, that's the part I most want.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Role:** TA/Teaching Fellow for an intro course on democracy/collective decision-making.
      *   **Audience:** ~20 undergrads.
      *   **Time:** 75 minutes.
      *   **Topic:** "Majority rule and beyond" (specifically aiming for the *Doctrinal Paradox* / *Discursive Dilemma*).
      *   **Goal:** Students should *experience* the problem (inconsistent collective outcomes based on voting structure) before learning the name/theory.
      *   **Constraints:** Movable chairs, projector, index cards, paper voting (no Google Forms).
      *   **Specific Needs:**
          *   A scenario with logical connections between propositions (AND, OR, necessary but not sufficient conditions).
          *   Phased timing (75 mins).
          *   Handling abstentions.
          *   Debrief strategy (mapping moments to structure).
          *   Truth-tracking discussion (what's settled vs. contested).
          *   Risk management (students spotting it too early, votes not splitting correctly).
          *   Role idea: One student steering the agenda (needs evaluation).

  2.  **Deconstruct the Core Concept (The Discursive Dilemma):**

      *   *Premise-based procedure:* Vote on premises $P_1, P_2, \dots$, then derive Conclusion $C$ logically.
      *   *Conclusion-based procedure:* Vote directly on Conclusion $C$.
      *   *The Paradox:* Majority vote on premises can yield a different collective outcome than majority vote on the conclusion, even if every individual is logically consistent.
      *   *Example:* $P_1 \land P_2 \to C$.
          *   Voter 1: Yes, No, No.
          *   Voter 2: No, Yes, No.
          *   Voter 3: Yes, Yes, Yes.
          *   Majority on $P_1$: Yes. Majority on $P_2$: Yes. Implied $C$: Yes.
          *   Majority on $C$: No.
      *   *Requirement:* The user wants varied logical structures (AND, OR, Necessary but not Sufficient).

  3.  **Develop the Scenario:**

      *   *Idea:* University Committee is good, but needs to feel low-stakes enough to avoid strategic voting but high-stakes enough to care.
      *   *Selection:* "The Student Conduct Committee." It's relatable, involves rules, and allows for logical conditions.
      *   *Case:* A student organization is accused of violating policy.
      *   *Verdict:* Sanction the organization (Yes/No).
      *   *Conditions:* Need a mix of logical connectives to prevent pattern matching.
          *   Case A (Conjunction): Violation occurred AND Intent was malicious $\to$ Sanction.
          *   Case B (Disjunction): Violation was Safety OR Financial $\to$ Sanction.
          *   Case C (Nuanced): Budget was exceeded (Necessary) AND (Process ignored OR Harm caused).
      *   *Refinement:* To keep it tight for 75 mins, let's stick to *one* rich scenario with multiple rounds or *three* mini-cases. Three mini-cases might be rushed. One rich scenario with multiple "charges" or "clauses" is better.
      *   *Better Idea:* Let's do **three distinct cases** back-to-back. It reinforces the structural variance the user asked for ("at least one place where the verdict needs all sub-questions to pass, one where there are two independent routes...").
      *   *Case 1 (AND):* Funding Request. Criteria: Merit AND Budget Availability.
      *   *Case 2 (OR):* Emergency Protocol. Criteria: Safety Threat OR Financial Fraud.
      *   *Case 3 (Complex):* Conduct Violation. Criteria: Rule Broken AND (Intent OR Negligence).

      *Wait, the user wants them to feel the inconsistency.* If I just do three cases, they might not see the *same* group reaching *different* outcomes on the *same* logic based on *procedure*.
      *Correction:* The core of the Discursive Dilemma is voting on Premises vs. Conclusion on the *same* issue.
      *Revised Plan:* One main scenario, but we vote on it twice using different procedures.
      *Wait, user wants:* "connections between them to not all be the same shape."
      *Solution:* We run **three rounds**. In each round, the logical structure changes. In *each* round, we risk the paradox. This prevents pattern matching.
      *Scenario:* The "Campus Allocations Committee." They decide on three different proposals.
      *   Proposal 1 (Conjunction): Fund the Robot Club? (Needs: Educational Value YES AND Budget Surplus YES).
      *   Proposal 2 (Disjunction): Evict the Fraternity? (Needs: Safety Violation YES OR Hazing Violation YES).
      *   Proposal 3 (Implication/Necessary): Grant Tenure? (Needs: Research Good. If Research Good, then Teaching must be Good). *Actually, let's keep it simpler.*
      *   Proposal 3 (Necessary Condition): Approve Study Abroad? (Needs: Safety Approved. Safety Approved is necessary but not sufficient; also need Academic Rigor).

      *Actually, to guarantee the paradox appears without fudging:* I need to distribute "voter types" secretly. If I let them vote freely, they might all agree, and the paradox vanishes.
      *Crucial Insight:* To ensure the paradox *happens* without fudging, I need to **assign preferences** secretly on index cards. This is standard experimental economics/political science practice. It guarantees the distribution needed for the paradox while keeping the *voting* authentic.
      *User Constraint:* "I want it to feel like a decision."
      *Compromise:* Give them a "Briefing Packet" with facts, but assign them a "Constituency" or "Role" that predisposes them to certain views on the premises, without telling them the global logic.
      *Better Compromise:* Hand out index cards upon entry. "You are Member 1," "You are Member 2," etc. Each card has their private judgment on the premises. They must vote according to their card (simulating a constituency) OR they vote their conscience?
      *If they vote conscience:* The paradox might not happen.
      *If they vote card:* It feels artificial.
      *Middle Ground:* The "Constituency" approach. "You represent the Science Dept," "You represent the Budget Office." Their interests logically align with specific premise combinations.
      *Actually, the most robust way:* **Pre-assigned Ballots.** Hand out 20 ballots. 7 are Type A, 7 are Type B, 6 are Type C. The types are designed to create the paradox. Students fill them out (it feels like voting), but the *distribution* is rigged by the handout.
      *Wait, user said:* "I'd rather most of it be on paper — voting on a google form feels like a survey, and I want it to feel like a decision."
      *If I hand out pre-marked ballots:* They will notice.
      *If I hand out "Role Cards" that tell them what they believe:* "You are a fiscal conservative. You believe Budget Surplus is NO." This works. It feels like roleplay/decision making, but guarantees the math.

  4.  **Addressing Specific Questions:**

      *   **Agenda Setter Role:** User asked about one student deciding order/outcome.
          *   *Risk:* Too obvious. "Why does Sarah get to choose?"
          *   *Fix:* Make it a "Committee Chair" role elected or assigned, but give them a "Procedural Motion" option. Or, better: The *TA* acts as the Chair, but offers the class a choice of procedure *after* the first failure.
          *   *Decision:* Don't give a student the steering wheel yet. It tips the hand. Let the *procedure* be the villain. In the debrief, ask "Who controlled the outcome?" -> "The person who set the agenda."
      *   **Abstentions:**
          *   *Math:* If $N$ voters, Majority = $N/2 + 1$. Abstentions reduce $N$.
          *   *Effect:* If abstentions count as "No" (status quo), it biases against change. If they reduce the denominator, it increases volatility.
          *   *Advice:* Define it clearly beforehand. "Abstentions reduce the quorum. Majority of *cast votes*." This is standard but volatile. Or "Majority of *eligible members*."
          *   *Recommendation:* For this exercise, treat abstentions as **not counting toward the total**. This isolates the logical paradox from quorum issues.
      *   **Truth-Tracking:**
          *   *Condorcet Jury Theorem:* If voters are $>50\%$ competent, majority rule tracks truth.
          *   *Discursive Dilemma:* Premise-based might track truth better if premises are easier to verify than conclusions. Conclusion-based might be better if the "verdict" is a value judgment.
          *   *Consensus:* It's contested. List & Pettit (2002) is the key reference.
      *   **Risk Management:**
          *   *Student names it early:* Have a "NDA" vibe. "Don't talk about the logic yet." If they name it, say "Great, hold that thought, let's see if the data supports it."
          *   *Votes don't split:* **Use the Role Card method.** Assign 3 types of voters. This guarantees the split.

  5.  **Drafting the Plan:**

