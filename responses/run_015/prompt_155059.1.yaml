      *   **Wait, 75 mins is tight.** Let's stick to one main paradox (AND) and maybe one variation if time permits. Better to go deep on one inconsistency than rush two. Let's do **Two Cases**. Case 1 (AND), Case 2 (OR). This satisfies the "different shapes" request.
      *   **Role Cards:** Need to be discreet. "Confidential Briefing."
      *   **Abstentions:** Rule: "Majority of votes cast."
      *   **Agenda Setter:** Instead of a student, the TA offers a "Procedural Vote" at the start. "How shall we decide? A) Vote on the verdict directly. B) Vote on the criteria." Split the class. Half do A, Half do B. *This is stronger.* It shows two committees facing the same facts reaching different outcomes.
      *   **Wait, 20 students.** Split into two committees of 10?
          *   Committee 1 votes Conclusion.
          *   Committee 2 votes Premises.
          *   Compare outcomes.
          *   *Risk:* They talk to each other.
          *   *Fix:* Do it sequentially with the *same* group. Round 1 (Conclusion), Round 2 (Premises).
      *   **Refining the "Steering" Idea:** The user wanted a student to steer. Let's put that in Round 3. Appoint a "Chair" who chooses the procedure for the final case. Give the Chair a secret goal. This tests if they can manipulate the procedure.

  6.  **Writing the Content:**

      *   **Scenario:** "The Student Activities Funding Board."
      *   **Case 1 (Conjunction):** Fund the "Debate Trip"?
          *   P1: Educational Value?
