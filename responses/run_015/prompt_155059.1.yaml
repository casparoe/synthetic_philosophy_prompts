              *   P1 Majority: 13 No. P2 Majority: 13 No. C Majority: 14 Yes. *Perfect.*
      *   **Materials:** Index cards with "Confidential Constituency Briefing."
      *   **Abstentions:** "If you abstain, your card is not counted in the total for that question."
      *   **Debrief:** Focus on "Who is responsible?" "Which is more legitimate?"
      *   **Truth Tracking:** Cite List & Pettit. Premise-based = better for truth (facts). Conclusion-based = better for values (responsibility).

  7.  **Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   Paper voting? Yes, index cards.
      *   No fudging? Yes, voter types guarantee the split.
      *   Student naming it? Mitigation strategy included.
      *   Abstentions? Addressed.
      *   Agenda setter? Included as a "Chair" role in the final 10 mins.

  8.  **Final Polish:**
