answer: |-
  This is a classic setup for the **Discursive Dilemma** (or Doctrinal Paradox). It is one of the most robust demonstrations in social choice theory, but it is fragile in the classroom: if the vote splits 18-2, the paradox vanishes.

  To guarantee the paradox without you fudging the tally, **you must assign "constituencies" secretly.** If you let students vote their genuine conscience, they will likely agree with each other, and you will get a boring unanimous result.

  Here is the runnable lesson plan. It uses **one distribution of role cards** that generates the paradox for *two different logical structures* (AND / OR), satisfying your requirement for varied shapes without needing to re-deal cards.

  ### The Scenario: The University Ethics & Allocations Committee
  **Context:** The class is the Committee. There are two items on the docket today.
  1.  **The Debate Trip (Case 1):** Should we fund the debate team's trip to nationals?
      *   *Logic (Conjunction):* Fund **IF AND ONLY IF** (Educational Value is High **AND** Budget is Surplus).
  2.  **The Hackathon (Case 2):** Should we sanction the CS Hackathon organizers?
      *   *Logic (Disjunction):* Sanction **IF** (Safety Violation Occurred **OR** Data Privacy Violated).

  **Stakes:** Tell them: "The outcome of Case 1 determines whether your next reading is 20 pages or 40 pages. The outcome of Case 2 determines whether you have a quiz next week." (Low enough to not cause panic, high enough to care).

  ---

  ### Phase 1: Setup & Distribution (10 Minutes)
  1.  **Seating:** Arrange chairs in a semi-circle.
  2.  **Materials:** As students enter, hand them an **Index Card** face down. There are three types (A, B, C). Distribute them randomly but count carefully.
      *   **Type A:** 7 students
      *   **Type B:** 7 students
      *   **Type C:** 6 students
      *   *(Total 20. If you have 19 or 21, adjust Type C to 5 or 7).*
  3.  **Instructions:**
      *   "This card represents your constituency's research and values. You must vote according to the card. Do not show your card to neighbors."
      *   "We will vote on two cases. For each case, we will vote on the **Verdict** first, and then we will vote on the **Criteria**."
      *   **Abstention Rule:** "If you abstain, your vote is discarded. The majority is calculated based on *votes cast*. If 18 people vote, 10 wins. If 19 people vote, 10 wins." (This prevents abstentions from acting as implicit 'No' votes, which muddies the logic).

  **The Card Text (Print and Cut):**
  > **CONFIDENTIAL: COMMITTEE MEMBER BRIEFING**
  > **Do not share this with others.**
  >
  > **CASE 1: Debate Funding**
  > *   Educational Value High? [YES / NO]
  > *   Budget Surplus? [YES / NO]
  > *   **YOUR VERDICT (Fund?):** [YES / NO]
  >
  > **CASE 2: Hackathon Sanction**
  > *   Safety Violation? [YES / NO]
  > *   Privacy Violation? [YES / NO]
  > *   **YOUR VERDICT (Sanction?):** [YES / NO]
  >
  > *Note: You must vote consistently with your findings above.*

  **The Distribution (For Your Eyes Only):**
  *   **Type A (7 Cards):**
      *   Case 1: Value=YES, Budget=YES $\rightarrow$ Verdict=YES
      *   Case 2: Safety=YES, Privacy=NO $\rightarrow$ Verdict=YES
  *   **Type B (7 Cards):**
      *   Case 1: Value=YES, Budget=NO $\rightarrow$ Verdict=NO
      *   Case 2: Safety=NO, Privacy=NO $\rightarrow$ Verdict=NO
  *   **Type C (6 Cards):**
      *   Case 1: Value=NO, Budget=YES $\rightarrow$ Verdict=NO
      *   Case 2: Safety=NO, Privacy=YES $\rightarrow$ Verdict=YES

  *Why this works:*
  *   **Case 1 (AND):** Majority says Value=YES (13-7). Majority says Budget=YES (13-7). Logic says Fund=YES. **But Majority Verdict is NO (13-7).**
  *   **Case 2 (OR):** Majority says Safety=NO (13-7). Majority says Privacy=NO (14-6). Logic says Sanction=NO. **But Majority Verdict is YES (13-7).**

  ---

  ### Phase 2: The Voting Rounds (35 Minutes)
  *Keep this brisk. Use the projector to tally.*

  **Round 1: Case 1 Verdict (5 mins)**
  *   "Vote on the Verdict only: Should we Fund the Debate Trip?"
  *   Show of hands or hold up cards (Yes/No side).
  *   **Tally:** 7 Yes, 13 No. **Result: REJECTED.**
  *   *TA Action:* Write "FUNDED? NO" on the board.

  **Round 2: Case 1 Premises (10 mins)**
  *   "Wait, before we finalize, let's check the criteria. Vote on Educational Value."
  *   **Tally:** 13 Yes, 7 No. **Result: HIGH VALUE.**
  *   "Vote on Budget Surplus."
  *   **Tally:** 13 Yes, 7 No. **Result: SURPLUS.**
  *   *TA Action:* Write "VALUE: YES" and "BUDGET: YES" on the board.
  *   **The Moment:** Point to the board. "Okay. Value is High. Budget is Surplus. The rule says if both are Yes, we Fund. But we just voted 'No' on Funding. Did we make a mistake?"
  *   *Let them squirm for 2 minutes.* Do not explain yet.

  **Round 3: Case 2 Verdict (5 mins)**
  *   "New Case. Sanction the Hackathon?"
  *   **Tally:** 13 Yes, 7 No. **Result: SANCTION.**
  *   *TA Action:* Write "SANCTION? YES" on the board.

  **Round 4: Case 2 Premises (10 mins)**
  *   "Check the criteria. Safety Violation?"
  *   **Tally:** 7 Yes, 13 No. **Result: NO SAFETY VIOLATION.**
  *   "Privacy Violation?"
  *   **Tally:** 6 Yes, 14 No. **Result: NO PRIVACY VIOLATION.**
  *   *TA Action:* Write "SAFETY: NO" and "PRIVACY: NO" on the board.
  *   **The Moment:** "Okay. No Safety violation. No Privacy violation. The rule says we sanction if *either* happened. But we just voted 'Yes' to Sanction. How is this possible?"

  ---

  ### Phase 3: The "Chair" Intervention (10 Minutes)
  *You mentioned wanting a student to steer. Do this now, after the confusion is established.*

  1.  **Select a Chair:** Ask for a volunteer. "We need a Committee Chair to resolve this inconsistency."
  2.  **The Secret Goal:** Pull the student aside for 10 seconds. Hand them a note: *"Your goal is to ensure the Debate Trip GETS FUNDED. You cannot change votes, only the order of voting or which vote counts."*
  3.  **The Task:** Ask the Chair to propose a procedure to fix Case 1.
  4.  **Likely Outcome:** The smart Chair will say, "We ignore the Verdict vote. We only vote on the Premises, and the result is derived mathematically."
  5.  **The Class Reaction:** The Type B and C students (who voted No on funding) will object. "That overrides our direct vote!"
  6.  **The Point:** This demonstrates that **procedure is power.** The Chair didn't change minds; they changed the *aggregation method* to achieve a specific outcome.

  ---

  ### Phase 4: Debrief (20 Minutes)
  *This is where you map the experience to the theory.*

  **1. Naming the Beast (5 mins)**
  *   Ask: "Did anyone lie on their card?" (No). "Was anyone illogical?" (No). "So where did the inconsistency come from?"
  *   Reveal: **The Discursive Dilemma.**
  *   Explain: "Collective rationality $\neq$ Individual rationality."

  **2. Addressing Your Specific Questions (10 mins)**

  *   **On Abstentions:**
      *   *What you did:* "Majority of votes cast."
      *   *The Lesson:* If you had ruled "Abstentions count as No" (Status Quo bias), the paradox might have disappeared because the 'No' vote would have been artificially inflated. If you ruled "Abstentions reduce the denominator," it increases volatility.
      *   *Takeaway:* The definition of "Majority" is a political choice, not a mathematical fact. It changes outcomes.

  *   **On Truth-Tracking (The "Settled vs. Contested" part):**
      *   *What is Settled:* The **Condorcet Jury Theorem** suggests if voters are more likely than not to be right ($p > 0.5$) on a *fact*, majority rule tracks truth.
      *   *What is Contested:* Does this apply to Premises or Conclusions?
          *   **Premise-Based:** Better for **truth/facts**. (e.g., "Did the defendant pull the trigger?" is easier to verify than "Is the defendant guilty?"). If you want factual accuracy, vote on premises.
          *   **Conclusion-Based:** Better for **values/responsibility**. (e.g., "Is this punishment fair?"). If the verdict is a moral judgment, aggregating the final judgment respects individual moral agency better than aggregating the facts that lead to it.
      *   *Tell the class:* "There is no academic consensus on which is 'democratically superior.' It depends on whether you view the committee as a truth-seeking machine (Premise) or a representative body of judgment (Conclusion)."

  **3. The "Sharp Student" Risk (5 mins)**
  *   *Risk:* A student says "This is the Doctrinal Paradox" in minute 5.
  *   *Response:* "Excellent. You've read ahead. But knowing the name doesn't solve the problem. Can *you* fix it? If you were the Chair, how do you justify the outcome to the losers?"
  *   *Risk:* The votes don't split right (e.g., someone loses their card).
  *   *Mitigation:* Because you have 7/7/6 split, you have a buffer. If one Type A student votes wrong, the majority holds (12-8). You need at least 3 defectors to break the paradox. It is statistically safe.

  ---

  ### Materials Checklist
  1.  **20 Index Cards:** Pre-written with the A/B/C distributions above.
  2.  **Projector Slide:** Simple tally sheet (Case 1 Verdict, Case 1 P1, Case 1 P2, etc.).
  3.  **Board Space:** Leave the tallies up side-by-side for the visual contradiction.

  ### Why This Works
  1.  **No Fudging:** The card distribution guarantees the mathematical contradiction every time.
  2.  **Varied Logic:** You get the AND paradox (Case 1) and the OR paradox (Case 2) using the *same* cards, saving time.
  3.  **Procedural Power:** The "Chair" activity moves it from a logic puzzle to a political problem.
  4.  **Abstentions:** By defining the rule upfront ("Majority of cast votes"), you avoid the quorum trap, allowing you to discuss it theoretically in the debrief rather than fighting it during the vote.

  ### One Warning
  Do not let them discuss the *logic* between rounds. They can discuss the *merits* ("The trip is too expensive!"), but if they compare cards ("What did you vote on Budget?"), the game is up. Enforce: **"Constituency Confidentiality."**
