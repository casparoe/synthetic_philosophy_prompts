      *   Student says: "Extortion is a separate practical risk to be managed by making contributions conditional." This shows a misunderstanding of how conditionality relates to extortion (conditionality *is* the leverage).
      *   Student says: "trade is... morally required." This is a controversial claim in the literature (e.g., MacAskill vs. critics). Presenting it as obvious is a mistake.

      *Decision:* The answer is competent but contains specific philosophical errors that an instructor must correct. It's not a "borderline pass" (5), it's clearly above that, but not "flawless" (10). It's a solid "Good but with notable errors." A 7/10 seems appropriate.

