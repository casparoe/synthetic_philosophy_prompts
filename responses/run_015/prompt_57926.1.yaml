          *   **Mechanism:** Comparative advantage. Even if I think your cause is less important than mine, if you think it's *more* important than I do (relative to my cause), trade works. Empirical beliefs: If I think your intervention is 10x more effective than you think it is, I might fund it to buy your labor for my cause.
