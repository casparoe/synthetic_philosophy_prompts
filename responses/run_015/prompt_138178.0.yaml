  Here is the breakdown of your friend's position, the rival rule that matches her history, and how to settle the bet.

  ### 1. The Rule She Is Running
  Your friend is following **Van Fraassen's Minimum Information (Cross-Entropy) Rule**, which in these specific cases simplifies to: **"Preserve the probability of the False Antecedent."**

  When she hears "If $A$, then $C$":
  1.  She identifies the states where $A$ is false ($\neg A$).
  2.  She keeps the total probability of $\neg A$ exactly the same as the prior, distributing it proportionally among those states.
  3.  She takes all the probability mass from the states where $A$ is true, and moves it entirely to the states where $C$ is also true ($A \cap C$).

  **Why this fits her first four verdicts:**
  In all four of your previous cases, the Antecedent ($A$) was either "Blue" or "Red".
  *   **Case 1 ("If Red..."):** $\neg A$ is Blue. Prior $P(\text{Blue}) = 0.5$. She preserves this at 0.5.
  *   **Case 2 ("If Blue..."):** $\neg A$ is Red. Prior $P(\text{Red}) = 0.5$. She preserves this at 0.5 (which forces $P(\text{Blue})$ to remain 0.5).
  *   **Case 4 (Both):** Both Blue and Red are Antecedents. She preserves nothing, but conditionalizes both sides. Since she moves all Blue mass to Blue HQ (0.5) and all Red mass to Red 1st (0.5), the split remains 50/50.

  This rule is probabilistically coherent (it is the standard solution to the Judy Benjamin problem). It minimizes the "informational shock" of the new message while respecting the constraint.

  ### 2. The Rival Rule (That Fits Just As Well)
  There is a competing rule that fits all four of her past verdicts perfectly but makes a different prediction for the new case. Let's call it **"Factional Invariance."**

  **The Rule:** "The Blue/Red marginal probability is sticky. Do not update the probability of being in Friendly vs. Enemy territory based on Company-level information."

  **Why it fits the history:**
  In your first four cases, the radio messages were either about Factions ("If Blue...", "If Red...") or covered both ("If Blue... and If Red..."). In all those instances, updating on the message *coincidentally* left the Blue/Red split at 0.5/0.5. Your friend might not be doing complex probability calculus; she might just have a heuristic: *"Unless the radio explicitly says 'All Red is now Blue', I assume the front line hasn't moved."*

