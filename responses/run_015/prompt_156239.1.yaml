          *   Math: VNM utilities are unique up to positive affine transformation ($U' = aU + b$).
          *   Problem: To sum them, you need a common scale. If I double my utility scale, the sum changes unless weights adjust.
          *   Harsanyi's Trick: He treats the weights as fixed *ethical* parameters, but the theorem itself doesn't fix them. To get *classical* utilitarianism (equal weights), you need to normalize utilities, which *is* an interpersonal comparison.
          *   Verdict: Pop book is misleading. The theorem doesn't solve the ICU problem; it just shifts it to the choice of weights/normalization.

