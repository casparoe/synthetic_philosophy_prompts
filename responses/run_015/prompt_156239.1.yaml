answer: |-
  This is a classic case where a pop-science treatment takes a rigorous mathematical result and strips away the caveats that make it philosophically palatable. Your instincts are sharp, and your friend is technically correct on the crucial point.

  Here is a claim-by-claim breakdown of what a social choice theorist or formal ethicist would say, distinguishing between the settled mathematics and the contested philosophy.

  ### 1. The "Sum" vs. "Weighted Sum" Claim
  **The Book:** The social welfare function is the *sum* of everyone's utilities.
  **The Math:** The theorem proves the social welfare function is a *linear combination* of individual utilities: $W = a_1U_1 + a_2U_2 + ... + a_nU_n + b$.
  **The Verdict:** **Your friend is right; this is load-bearing.**

  The mathematics of Harsanyi's Aggregation Theorem (1955) does not dictate that the weights ($a_i$) must be equal. It only dictates that they must be non-negative (and positive if you assume the Strong Pareto principle). To get from "weighted sum" to "simple sum" (classical utilitarianism), you must assert that $a_1 = a_2 = ... = a_n$.

  Why does this matter? Because the weights determine whose preferences count more. If $a_1$ is huge and $a_2$ is tiny, the social welfare function satisfies the Pareto principle and VNM axioms but looks nothing like egalitarian utilitarianism; it looks like a dictatorship of Person 1 with a polite nod to Person 2.

  **Settled:** The theorem yields weighted utilitarianism.
  **Contested:** How to justify equal weights. The pop book claims rationality forces equal weights. It doesn't. Equal weights are a substantive ethical commitment to equality, not a derivation from logic.

  ### 2. The "No Interpersonal Comparisons" Claim
  **The Book:** We don't need to compare utilities between people; the theorem is invariant to rescaling.
  **The Reality:** This is the biggest sleight of hand in the chapter.

  Recall your math background: VNM utility functions are unique only up to *positive affine transformation*. That means if $U(x)$ is a valid utility function for me, then $V(x) = 2U(x) + 100$ is also a valid representation of my preferences.

  Now look at the social welfare function: $W = \sum a_i U_i$.
  If I decide to measure my utility in "cents" instead of "dollars" (multiplying my $U$ by 100), the total sum $W$ changes drastically unless the weight $a_i$ attached to me is reduced by a factor of 100 to compensate.

  For the sum to mean anything, we must agree on a common scale for everyone's utility. We have to say, "One unit of Alice's utility is equivalent to one unit of Bob's utility." **That is the definition of an interpersonal comparison of utility.**

  **The Verdict:** **Wrong.** The theorem does not avoid interpersonal comparisons; it hides them in the choice of weights and the normalization of the utility scales. To say $a_i = 1$ for everyone, you must have already fixed the scales so that a "util" for me is the same "size" as a "util" for you. The pop book is claiming the math solves the measurement problem. It doesn't; it assumes it away.

  ### 3. The Veil of Ignorance and Equal Probabilities
  **The Book:** Rationality behind the veil requires equal probability ($1/N$) for being any person. Therefore, maximize average utility. Rawls is just irrationally risk-averse.
  **The Reality:** This conflates two different arguments (Harsanyi's Aggregation Theorem vs. Harsanyi's Veil of Ignorance argument). They lead to similar places but rely on different assumptions.

  Regarding the probabilities: The claim that "not knowing who you are" implies "equal probability" relies on the **Principle of Indifference**. This is highly contested in decision theory. Just because you lack information doesn't mean the probability distribution is uniform. (Example: I don't know the weight of a rock, but it's not rational to assume a uniform distribution between 1 gram and 1 ton).

  Regarding Rawls: Describing Rawls's *Difference Principle* (maximin) as "irrational risk-aversion" is a standard criticism from economists, but it is considered unfair by many political philosophers. Rawls argues that in the "original position," the choice isn't about gambling for average welfare; it's about establishing the basic structure of society where the stakes involve fundamental liberties and life prospects. He argues that when the downside risk is "ending up in a slave caste" or "destitute," it is rational to prioritize the worst-off position regardless of the expected average gain. This isn't a psychological quirk (risk aversion); it's a constraint on what counts as an acceptable gamble when basic rights are on the line.

  **Settled:** Equal probability is an assumption, not a logical necessity.
  **Contested:** Whether VNM expected utility theory is the correct framework for choosing principles of justice. Rawls says no; Harsanyi says yes. There is no consensus verdict here, only competing frameworks.

  ### 4. The Distribution Claim
  **The Book:** The theorem says nothing about distribution; only the total sum matters.
  **The Reality:** This is a confusion between *utility* and *resources*.

  If individual utility functions are linear in income (each extra dollar gives the same happiness), then yes, the sum cares only about the total pie. But if individual utility functions are concave (diminishing marginal utility of income), then transferring a dollar from a rich person to a poor person increases the *sum* of utilities.

  Standard utilitarianism *does* care about distribution, precisely because of diminishing marginal utility. The pop book is likely trying to say that the theorem doesn't have an "inequality aversion" parameter *separate* from the utility functions. But in practice, if you plug in realistic utility functions, the "sum" recommends significant redistribution.

  **The Verdict:** **Misleading.** It implies utilitarianism is indifferent to inequality. It isn't, unless you assume everyone has linear utility for resources, which is empirically false.

  ### 5. The Lottery Problem (Ex-Ante vs. Ex-Post)
  **The Book:** (Implied) The theorem recommends policies that maximize expected utility.
  **Your Instinct:** Can it recommend a lottery where, once resolved, everyone is worse off?
  **The Reality:** **You are correct.** This is a known vulnerability called the conflict between **Ex-Ante Pareto** and **Ex-Post Pareto**.

  Harsanyi's theorem aggregates *expected* utilities.
  *   **Scenario:** A policy gives everyone a 51% chance of +10 utility and a 49% chance of -10 utility. The alternative is 0 for everyone.
  *   **Harsanyi:** Expected utility is positive ($0.51 \times 10 - 0.49 \times 10 > 0$). Everyone prefers the lottery ex-ante. The theorem recommends the lottery.
  *   **Resolution:** The lottery resolves. By bad luck, *everyone* gets the -10 outcome.
  *   **Result:** Everyone is worse off than if they had chosen the safe 0.

  A social welfare criterion that satisfies Ex-Ante Pareto (respecting preferences over lotteries) can violate Ex-Post Pareto (respecting preferences over realized outcomes). Many theorists (e.g., Peter Diamond) find this unacceptable. They argue that if a policy leads to a state where everyone agrees they are worse off, it shouldn't have been chosen, even if it looked good probabilistically.

  **The Verdict:** **You read this correctly.** This is a genuine cost of the Harsanyi framework. It prioritizes the satisfaction of ex-ante preferences over ex-post welfare.

  ### 6. The Bottom Line: Does Utilitarianism Follow from Rationality?
  **The Book:** Utilitarianism is what rationality plus Pareto forces on you.
  **The Correction:** **Weighted Utilitarianism with unspecified weights is what rationality plus Pareto forces on you.**

  Does the corrected result still do the work the book wants? **No.**
  The book wants to sell you "Classical Utilitarianism" (everyone counts for one, none for more than one) as a scientific discovery derived from math.
  The actual theorem sells you "Paretian Weighted Welfarism."

  To get the book's conclusion, you have to add:
  1.  **Interpersonal Comparability:** We must be able to normalize utility scales across persons.
  2.  **Anonymity/Equality:** We must ethically justify setting all weights $a_i$ equal.
  3.  **Ex-Ante Evaluation:** We must accept that satisfying probabilistic preferences is more important than avoiding universally bad outcomes.

  Once you admit these are *ethical assumptions* and not *logical derivations*, the "gotcha" against moral critics vanishes. Critics of utilitarianism don't reject the VNM axioms; they reject the move from "weighted sum" to "equal sum."

  ### Summary for your mental model

  | Claim in Pop Book | Status | Why? |
  | :--- | :--- | :--- |
  | **Result is "Sum"** | **False** | Result is "Weighted Sum." Weights are arbitrary without further ethics. |
  | **No Interpersonal Comparisons** | **False** | Summing requires a common scale. Choosing the scale *is* comparing. |
  | **Veil = Equal Probability** | **Contested** | Principle of Indifference is not a law of logic. |
  | **Rawls is Irrational** | **Unfair** | Rawls rejects the VNM framework for justice, he doesn't fail at math. |
  | **Ignores Distribution** | **Misleading** | Concave utility functions make the sum care about distribution. |
  | **Lottery Paradox** | **True** | Harsanyi satisfies Ex-Ante Pareto, can violate Ex-Post Pareto. |

  **Final Answer:** Your friend is right. Dropping "weighted" is not harmless; it is the entire ethical payload of the theory. The theorem is a powerful consistency result (if you want to be Paretian and VNM-rational, you must be a weighted welfarist), but it is not a derivation of utilitarianism from thin air. It shifts the moral debate from "Should we maximize utility?" to "How do we weight and measure different people's utilities?"—which is exactly where the moral debate always was.
