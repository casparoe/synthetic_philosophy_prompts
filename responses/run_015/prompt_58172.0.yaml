      *   Did I meet the "one short paragraph each" constraint? Yes.
      *   Did I answer the whole thing in British English? Yes.
      *   Did I explain the distinction clearly for the boss? Yes.

      *Self-Correction on Version B:* Is "digital assignment" realistic? Yes, warehouse management systems often track status changes. If the KPI is tied to status 'Allocated' rather than 'Loaded', that's a spec error.
      *Self-Correction on Version A:* Ensure the planner is "sensible". The planner assigns bays, but humans decide the flow. That works.

      *Let's tighten the stories.*
