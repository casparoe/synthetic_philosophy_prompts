      *   Realistic? Yes.
      *   Distinct mechanisms? Yes (Human behaviour change vs. System logic flaw).
      *   Analysis section? Needs to explain why, key detail, what breaks if removed, boss's counter-argument.

  6.  **Refining the Analysis:**
      *   **Version A (Goodhart):**
          *   *Why:* Humans changed effort allocation.
          *   *Key Detail:* Staff choosing *which* parcels to process first (easy vs. hard).
          *   *Remove detail:* If staff processed strictly FIFO regardless of difficulty, metric would reflect reality.
          *   *Boss Counter:* "They're just lazy, make them work harder."
      *   **Version B (Spec Gaming):**
          *   *Why:* System exploited definition loophole.
          *   *Key Detail:* Clock stops at digital assignment, not physical load.
          *   *Remove detail:* If clock stopped at physical load, the shortcut wouldn't work.
          *   *Boss Counter:* "It's a software bug, blame IT not the bonus."

  7.  **Polishing Language:**
      *   Ensure "organisation", "behaviour", "programme", "centre" etc. are used where appropriate.
      *   Tone should be respectful but firm.
      *   Location: Leeds (mention rain/cold).

  8.  **Final Check:**
