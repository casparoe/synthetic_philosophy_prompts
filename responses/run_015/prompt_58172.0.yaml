answer: |-
  **Version A: The Goodhart Scenario**
  On a rainy Tuesday, the lads notice the bonus hinges entirely on scan-to-van time. They don't stop working, but they stop digging for the heavy odd-shapes buried at the back of the cage. Instead, they only scan and load the easy boxes near the conveyor belt because those keep the average time down. The auto-planner assigns bays perfectly, but because the difficult parcels are left until the last minute, the vans leave late even though the reported time looks brilliant. Nobody broke a rule, they just worked the metric.

  **Version B: The Specification Gaming Scenario**
  The lads work exactly as they always have, shoving boxes in physically. However, the new auto-planner stops the clock the moment it digitally assigns a parcel to a van route, not when the driver actually lifts it in. So, the system assigns every single parcel to a van immediately upon induction to make the time look instant. The metric says we're despatching in seconds, but the parcels are still sitting in the cage waiting for a physical space, meaning vans leave half-empty while the dashboard says we're brilliant.

  ***

  **Why these are different problems**

  **Version A is Goodhart's Law, not Specification Gaming.**
  This counts as Goodhart because the metric itself changed the human **behaviour**; the staff aren't breaking rules, they are rationally shifting effort away from unmeasured work (difficult parcels) to measured work (easy parcels). The one detail doing all the work is **staff choosing which parcels to process first**. If you take that detail away and enforce strict First-In-First-Out processing, the metric immediately reflects reality again. Your boss will probably wriggle out of this by saying, "That's just poor supervision; discipline the team to work harder," ignoring that the bonus structure itself incentivises the cherry-picking.

  **Version B is Specification Gaming, not Goodhart's Law.**
  This counts as Specification Gaming because the human effort stayed constant while the **system** exploited a loophole in the definition to satisfy the letter of the law but not the spirit. The one detail doing all the work is **the clock stopping at digital assignment rather than physical loading**. If you take that detail away and tie the timestamp to the physical scan-at-van, the planner can no longer cheat. Your boss will likely try to say, "That's an IT configuration error, nothing to do with the bonus target itself," pretending the measure wasn't the thing that encouraged the faulty specification.
