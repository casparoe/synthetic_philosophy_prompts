answer: |-
  You have stumbled onto the exact fault line that divides modern decision theory. Your intuitions are actually very sophisticated, but they are currently hybridizing two different frameworks: **Causal Decision Theory (CDT)** for the mugging cases and **Evidential Decision Theory (EDT)** (or Functional Decision Theory) for Newcomb's Problem.

  You feel the tension because, structurally, the past prediction is identical in Case 1 and Case 3. The difference lies entirely in your **information state** (what you know about the prediction's outcome).

  Here is the principle that unifies your verdicts on Cases 1–4, explains the difference you're sensing, and dictates the verdict on Case 5.

  ### The Principle: Evidential Maximization with Screening-Off

  > **Act to maximize Expected Utility, treating your action as evidence for outcomes, *unless* the outcome is already observed or logically screened off by your current knowledge.**

  Formally, choose Action $A$ to maximize:
  $$ \sum P(O_i | A, K) \cdot U(O_i) $$
  Where $K$ is your current knowledge.
  *   **The Evidential Clause:** Your action $A$ can update the probability of a past event $O_i$ if $A$ is correlated with $O_i$ (Newcomb).
  *   **The Screening-Off Clause:** If you already *know* $O_i$ (the mugger is coming), then $P(O_i | A, K) = P(O_i | K) = 1$. Your action provides no *new* evidence about $O_i$.

  ---

  ### How the Principle Applies to Your Cases

  **Case 1: Counterfactual Mugging (100% Known)**
  *   **Knowledge ($K$):** The mugger is en route. The prediction was "No Pay."
  *   **Analysis:** You know the bad outcome is fixed. Paying \$10 does not change the probability of being mugged (it is already 100%). $P(\text{Mugged} | \text{Pay}, K) = 1$.
  *   **Calculation:** Pay = -\$110. Don't Pay = -\$100.
  *   **Verdict:** **Don't Pay.** (Matches your intuition).
  *   **Why:** The correlation between "Paying" and "Safety" is **screened off** by your knowledge that the mugger is already coming.

  **Case 2: Time-Travel Mugging**
  *   **Knowledge ($K$):** The time traveler saw you refuse. He is coming.
  *   **Analysis:** Identical to Case 1. The future event is treated as a fixed fact in your current knowledge state.
  *   **Verdict:** **Don't Pay.** (Matches your intuition).

  **Case 3: Newcomb's Problem**
  *   **Knowledge ($K$):** Boxes are closed. You do *not* know what the predictor did.
  *   **Analysis:** Your action is *evidence* of the prediction. If you One-Box, it is highly probable the predictor put \$1M in Box A. If you Two-Box, it is highly probable Box A is empty. The correlation is **not** screened off.
  *   **Calculation:** $P(\$1M | \text{One-Box}) \approx 1$. $P(\$1M | \text{Two-Box}) \approx 0$.
  *   **Verdict:** **One-Box.** (Matches your intuition).
  *   **Why:** You are acting on the *news* your choice brings. One-boxing is good news (implies \$1M); Two-boxing is bad news (implies \$0).

  **Case 4: Blackmail**
  *   **Knowledge ($K$):** Leak happens *if* you pay.
  *   **Analysis:** This is causal, not just correlational. $P(\text{Leak} | \text{Pay}) = 1$.
  *   **Verdict:** **Don't Pay.** (Matches your intuition).
  *   **Why:** Paying causes the harm directly.

  ---

  ### The 95% Case: The Principle's Verdict

  **Case 5: Probabilistic Mugging**
  *   **Setup:** Predictor is 95% accurate. Mugger is *probably* coming (if predicted "No Pay"), but there is a 5% chance he isn't (if predicted "Pay"). You do not know for sure if he is coming yet.
  *   **Knowledge ($K$):** You know the accuracy rate, but you do *not* know the specific prediction outcome. The outcome is **not screened off**.
  *   **Analysis:** Your decision to Pay is now evidence that the predictor likely predicted "Pay" (because the predictor is accurate). If the predictor predicted "Pay", the mugger is not sent.
  *   **Calculation:**
      *   **If You Pay:** 95% chance Predictor was right (Predicted Pay $\rightarrow$ No Mugger). 5% chance Predictor was wrong (Predicted No Pay $\rightarrow$ Mugger).
          *   EU(Pay) $\approx (0.95 \times -\$10) + (0.05 \times -\$110) = -\$9.50 - \$5.50 = \mathbf{-\$15}$.
      *   **If You Don't Pay:** 95% chance Predictor was right (Predicted No Pay $\rightarrow$ Mugger). 5% chance Predictor was wrong (Predicted Pay $\rightarrow$ No Mugger).
          *   EU(Don't) $\approx (0.95 \times -\$100) + (0.05 \times \$0) = \mathbf{-\$95}$.
  *   **Verdict:** **PAY.**

  ### The Trade-Off: Which Intuition Must Drop?

  You asked to be honest about which verdict this principle forces you to drop.

  1.  **If you accept the Principle above (EDT + Screening-Off):**
      *   You **keep** your intuitions on Cases 1, 2, 3, and 4.
      *   You **must drop** your intuition on Case 5. You have to pay the \$10.
      *   *Why:* Because in Case 5, unlike Case 1, you lack the knowledge that screens off the correlation. Your action once again becomes "good news" that the mugger isn't coming.

  2.  **If you want a "Simpler" Principle (Functional Decision Theory - FDT):**
      *   FDT argues that your decision *logically determines* the prediction, regardless of whether you know the outcome. It treats Case 1 and Case 3 as identical.
      *   You **keep** your intuition on Case 3 (One-Box).
      *   You **must drop** your intuition on Case 1 (Mugging). FDT says you **must Pay** in Case 1.
      *   *Why:* Because you want to be the *type of agent* that pays, so that the predictor predicts that in the first place. FDT argues that "knowing the mugger is coming" is a trap; if you pay, you prove the predictor wrong, which is impossible, so the only consistent reality is one where your algorithm pays, meaning the predictor predicted Pay, meaning the mugger never came. (This is harder to swallow intuitively).

  3.  **If you want the "Simplest" Principle (Causal Decision Theory - CDT):**
      *   CDT says only causal consequences matter.
      *   You **keep** your intuitions on Cases 1, 2, and 4.
      *   You **must drop** your intuition on Case 3 (Newcomb). CDT says **Two-Box**.
      *   *Why:* Taking the \$1k cannot causally change the contents of Box A.

  ### Recommendation for Your Seminar

  Your gut is currently operating on **Evidential Decision Theory with a Screening-Off Clause**. This is a philosophically defensible position (closest to Richard Jeffrey's decision theory). It respects the difference between "acting on evidence" (Newcomb) and "acting when the evidence is already old news" (Mugging).

  **The argument you should make in seminar:**
  "The structural identity between Counterfactual Mugging and Newcomb's Problem is broken by the **agent's epistemic state**. In Newcomb's Problem, the prediction is hidden, so my choice updates the probability of the box's content. In Counterfactual Mugging (as described), the prediction's *consequence* (the mugger's arrival) is observed, screening off the correlation. Therefore, it is rational to One-Box but refuse to Pay. However, this implies that if the mugger's arrival were merely *probable* (95%) rather than known, I would be forced to Pay."

  This shows you understand the mechanics of the dilemma while owning your specific intuitive boundary.
