prompt: |-
  I'm the director of a clinical psychology residency and every quarter I have to write these character evaluations for the accrediting body — they want ratings on compassion, integrity, practical wisdom, that kind of thing. The problem is I'm actually convinced by both virtue ethics and the situationist critique, which puts me in a weird spot. If character is just stable dispositions then I should rate residents on whether they consistently act well, but if the situationists are right then behavior mostly tracks context not traits, so my ratings are basically astrology unless I control for pressure and setting. I need a reusable procedure I can run in about thirty minutes per resident that doesn't collapse into a gut-feeling form.

  Can you turn virtue ethics — specifically the idea that virtues are dispositions to feel, reason, and act correctly across a range of situations, not just habits — into an operational checklist for me? It needs to specify what counts as evidence for a virtue versus just lucky behavior, how to weight situational pressure (high-stress crisis vs routine rotation), and where the procedure has to stop and admit it's a values judgment rather than a measurement so I don't recieve false precision. Include three worked cases: a resident who was rude to a patient during a double shift but usually kind; one who was exemplary in easy rotations but collapsed in crisis; and one ambiguous case where the procedure gives an answer I probably won't like. Also flag the points where I'm just dressing up judgment calls as steps, and say what the procedure absolutely cannot do — like predicting future behavior or replacing a real conversation. Don't give me bibliographies or citations; I already know the debate and can't search them. I just need something I can apply repeatedly without pretending psychology doesn't exist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a clinical psychology residency.
      *   **Task:** Write quarterly character evaluations (compassion, integrity, practical wisdom, etc.) for an accrediting body.
      *   **Conflict:** Believes in *both* virtue ethics (stable dispositions) *and* situationist critique (behavior tracks context, not traits).
      *   **Goal:** A reusable, 30-minute per resident procedure to operationalize virtue ethics without falling into "astrology" (false precision) or ignoring situational factors.
      *   **Requirements:**
          *   Operational checklist based on virtue ethics (dispositions to feel, reason, act).
          *   Distinguish evidence of virtue vs. lucky behavior.
          *   Weight situational pressure (crisis vs. routine).
          *   Identify where value judgments occur (stop false precision).
          *   Three worked cases (Rude/Kind, Easy/Crisis Collapse, Ambiguous/Unpleasant Answer).
          *   Flag "dressed up judgment calls."
          *   State limitations (prediction, conversation replacement).
          *   No bibliographies/citations.
          *   Tone: Professional, pragmatic, philosophically informed but actionable.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Virtue Ethics:* Virtues are stable states of character (hexis). They involve cognition (practical wisdom/phronesis), affect (emotional regulation), and action. They are robust across situations but develop over time.
      *   *Situationism:* Behavior is highly sensitive to situational variables (fatigue, authority, stress). Global traits are often post-hoc constructions.
      *   *Synthesis for the Procedure:* Acknowledge that "character" isn't a magic internal substance but a *pattern of interaction* between the agent and the environment. A virtue isn't just "doing good things"; it's "doing good things *for the right reasons* despite *relevant pressures*." The evaluation must assess the *trajectory* and the *response to friction*, not just the outcome.

  3.  **Drafting the Procedure (The "V-SAP" - Virtue Situational Assessment Procedure):**
      *   *Time Limit:* 30 minutes. Needs to be tight.
      *   *Structure:*
          1.  Data Gathering (Pre-work).
          2.  Situational Mapping (The Situationist Check).
          3.  Tripartite Virtue Audit (Feel, Reason, Act).
          4.  Weighting & Synthesis.
          5.  The "Stop Rule" (Admitting Judgment).
      *   *Key Concept:* "Friction Points." Virtue is most visible when it's hard to be virtuous.

  4.  **Developing the Checklist Items:**
      *   Need to distinguish *habit* from *virtue*. Habit is automatic; virtue involves reasoning.
      *   Need to account for *luck*. Did they help because they cared, or because the patient was easy?
      *   Need to weight *pressure*. A kind act during a calm shift counts less for "compassion" than a kind act during a chaotic shift.

  5.  **Addressing the "False Precision" Warning:**
      *   Explicitly mark steps where the Director must make a call that isn't data-driven.
      *   Acknowledge that the rating is a *narrative summary*, not a psychometric score.

  6.  **Developing the Worked Cases:**
      *   *Case 1 (Rude/Kind):* The "Fatigue vs. Character" problem. Needs to show how to weigh the double shift.
      *   *Case 2 (Easy/Crisis Collapse):* The "Fair-Weather Virtue" problem. Shows the limit of their disposition.
      *   *Case 3 (Ambiguous/Unpleasant):* The "Technically Competent but Cold" or "Well-Meaning but Ineffective" problem. Let's go with "Well-Meaning but Ineffective/Boundary Issues" – often rated high on compassion but low on wisdom. Or better: The resident who follows rules (Integrity) but lacks empathy (Compassion). Let's choose the "Rule-Follower who lacks Practical Wisdom" – they look good on paper but fail the patient. Actually, the prompt asks for an answer the Director *won't like*. Maybe a resident who is genuinely virtuous but statistically looks average due to high-pressure assignments. Or a resident who is charming (looks virtuous) but manipulative. Let's go with the "High Pressure, Moderate Performance" resident who gets penalized by the system for being assigned the hardest cases. That challenges the Director's bias.

  7.  **Refining the Limitations:**
      *   Cannot predict future behavior (situationism wins there).
      *   Cannot replace feedback conversations (evaluation $\neq$ supervision).

  8.  **Review against Constraints:**
      *   30 minutes? Yes, keep steps concise.
      *   No citations? Yes.
      *   Tone? Professional, direct.
      *   Specific deliverables? Checklist, Weighting, Stop Rules, 3 Cases, Limitations.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe create a scoring matrix.
      *   *Correction:* No, that encourages false precision. Use a "Traffic Light" or "Narrative Weighting" system instead.
      *   *Philosophical nuance:* Ensure I don't just say "situation matters." I need to say "Virtue is the capacity to navigate the situation."
      *   *The "Unpleasant Answer" Case:* Make sure the procedure forces a lower rating than the Director's gut might want, demonstrating the procedure's integrity. Let's make it a resident who is "nice" but lacks *phronesis* (practical wisdom), leading to harm. The Director likes them personally, but the procedure flags the lack of wisdom.

  10. **Final Polish:** Check the "Flagging Judgment Calls" requirement. I need to insert specific callout boxes or bold text indicating where the Director is making a value call, not an empirical observation.

  *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure gives an answer the Director *probably won't like*. If the Director is convinced by situationism, they might want to rate everyone highly because "it's the system's fault." The procedure should force them to acknowledge individual responsibility where it exists. Or, conversely, if the Director likes a resident, the procedure might reveal a lack of robust virtue. Let's go with the "Likable but Unreliable" resident. The Director wants to rate them high on Compassion, but the procedure shows it's context-dependent luck.

  *(Refining the "Stop Rule")*: Be explicit that the final rating is a *professional judgment*, not a calculation.

  *(Refining the "Virtue" definition)*: Ensure it covers Feel, Reason, Act.

  Let's assemble the document.

  *Structure:*
  1.  Introduction (Acknowledging the tension).
  2.  The V-SAP Protocol (30 mins).
  3.  The Weighting Matrix (Situational Pressure).
  4.  The "Stop Rules" (Where judgment takes over).
  5.  Three Worked Cases.
  6.  Limitations & Warnings.

  *Time Check:* 30 minutes is tight.
  - 5 min: Data review.
  - 10 min: Situational Mapping.
  - 10 min: Tripartite Audit.
  - 5 min: Synthesis & Writing.

  *Let's write.*
answer: |-
  # The V-SAP Protocol (Virtue Situational Assessment Procedure)

  **Purpose:** To evaluate resident character (virtues) while acknowledging situational constraints, avoiding false precision, and distinguishing stable dispositions from context-dependent behavior.
  **Time Budget:** 30 Minutes per resident.
  **Philosophical Grounding:** Virtues are not magic bullets; they are *robust capacities* to feel, reason, and act well across varying levels of friction. This protocol measures the *ratio* of virtuous output to situational pressure.

  ---

  ## Part 1: Data Triage (5 Minutes)
  *Do not start with a blank page. Gather the following before the timer starts.*

  1.  **Critical Incident Log:** List any documented complaints, praises, or ethical breaches.
  2.  **Rotation Context:** List the rotations for this quarter (e.g., Inpatient Crisis, Outpatient Routine, Forensic Evaluation).
  3.  **Supervisor Notes:** Skim for adjectives describing *process* (e.g., "struggled to set boundaries") vs. *outcome* (e.g., "patient improved").

  **[FLAG: JUDGMENT CALL]** *Selecting which incidents count as "critical" is subjective. If you ignore a minor rudeness here, note that you are filtering data based on severity, not frequency.*

  ---

  ## Part 2: Situational Mapping (The Situationist Check) (10 Minutes)
  *Virtue is only visible against friction. Map the environment before rating the person.*

  **Step A: Categorize Pressure Levels**
  For each rotation/incident, assign a Pressure Level (PL):
  *   **PL-1 (Low):** Routine, well-rested, supportive supervision, cooperative patients.
  *   **PL-2 (Medium):** Moderate caseload, some ambiguity, mild time pressure.
  *   **PL-3 (High):** Crisis intervention, fatigue (double shifts), hostile patients, conflicting institutional demands.

  **Step B: The "Luck" Filter**
  Ask: *Did the environment make the virtuous action easy?*
  *   If a resident was compassionate during a PL-1 rotation, mark this as **Low-Evidence Virtue**. (It may just be ease).
  *   If a resident was compassionate during a PL-3 rotation, mark this as **High-Evidence Virtue**.
  *   If a resident failed during PL-3, mark as **Expected Friction** (requires further audit).
  *   If a resident failed during PL-1, mark as **Significant Deficit**.

  **[FLAG: JUDGMENT CALL]** *Assigning PL levels is not objective. A "routine" rotation for one resident might be traumatic for another based on personal history. You are estimating objective pressure, not subjective experience.*

  ---

  ## Part 3: The Tripartite Virtue Audit (10 Minutes)
  *Virtue is not just action. It is the alignment of Feeling, Reasoning, and Acting. Rate each virtue (Compassion, Integrity, Wisdom) on these three axes.*

  **Evidence Criteria:**
  *   **Feeling (Affect):** Did they report appropriate emotional concern? Did they show signs of burnout or callousness?
  *   **Reasoning (Phronesis):** Could they articulate *why* they acted? Did they recognize the ethical stakes?
  *   **Acting (Behavior):** What was the observable outcome?

  **The Scoring Rule:**
  *   **Full Virtue:** Aligned Feel + Reason + Act under PL-2 or PL-3.
  *   **Habit/Compliance:** Act only (no reasoning or wrong feeling) under PL-1.
  *   **Fragile Virtue:** Aligned under PL-1, misaligned under PL-3.
  *   **Vice:** Misaligned under PL-1.

  **[FLAG: JUDGMENT CALL]** *You cannot measure "Feeling" directly. You are inferring internal states from self-reports and tone. This is interpretation, not measurement.*

  ---

  ## Part 4: Synthesis & Stop Rules (5 Minutes)
  *Write the narrative evaluation. Do not calculate a score.*

  **The Weighting Formula:**
  Give 3x weight to High-Evidence Virtue (PL-3 success) and 3x weight to Significant Deficits (PL-1 failure). Treat PL-1 success as baseline expectation.

  **The Stop Rules (When to admit uncertainty):**
  1.  **The Data Gap:** If you have no PL-3 data for a resident, you **cannot** rate them highly on Resilience or Integrity under Pressure. You must write: *"Insufficient high-friction data to assess robustness."*
  2.  **The Conflict:** If Feeling/Reasoning align but Acting fails (or vice versa), do not average them. Describe the tension. (e.g., *"High empathy but poor boundary enforcement."*)
  3.  **The Value Ceiling:** If a resident follows all rules (Integrity) but harms patients due to rigidity (Lack of Wisdom), you must rate Wisdom lower even if Integrity is high. **Do not let compliance mask a lack of practical wisdom.**

  **[FLAG: JUDGMENT CALL]** *Deciding that "Wisdom" outweighs "Compliance" is a value judgment inherent to clinical psychology. The accrediting body may want rule-followers; you are judging for clinicians.*

  ---

  ## Worked Cases

  ### Case 1: The "Double-Shift Snap" (Rude but Usually Kind)
  *   **Data:** Resident is consistently kind (PL-1 & PL-2). One documented incident of snapping at a patient during a 16-hour double shift (PL-3).
  *   **Situational Map:** The incident occurred at PL-3. The kindness occurred mostly at PL-1/2.
  *   **Tripartite Audit:**
      *   *Routine:* Feel/Reason/Act aligned.
      *   *Crisis:* Act failed. Reasoning post-incident showed remorse (Feeling aligned).
  *   **Procedure Output:** This is **Fragile Virtue**. The disposition exists but lacks stamina.
  *   **Evaluation Language:** *"Resident demonstrates consistent compassion in routine settings. However, virtue robustness is unproven under extreme fatigue. The incident suggests a capacity limit rather than a character deficit, but mitigation strategies for fatigue are now required for a high rating."*
  *   **Why this works:** It avoids calling them "uncaring" (Situationism) but avoids ignoring the behavior (Virtue Ethics). It rates the *capacity* as incomplete.

  ### Case 2: The "Fair-Weather Clinician" (Exemplary Easy, Collapsed Crisis)
  *   **Data:** Perfect scores on outpatient rotations (PL-1). During an inpatient suicide crisis (PL-3), resident froze, ignored protocol, and hid in the breakroom.
  *   **Situational Map:** High success at PL-1. Critical failure at PL-3.
  *   **Tripartite Audit:**
      *   *Routine:* Full alignment.
      *   *Crisis:* Act failed. Reasoning post-incident was defensive (Reasoning misaligned).
  *   **Procedure Output:** **Significant Deficit in Practical Wisdom/Courage.** The PL-1 success is discounted as "Low-Evidence."
  *   **Evaluation Language:** *"While routine care is excellent, the resident's dispositions do not hold under high-stakes pressure. Virtue requires stability across contexts; currently, clinical competence is context-bound. Rating for Integrity and Wisdom is lowered to reflect this fragility."*
  *   **Why this works:** It prevents the "Halo Effect" of easy rotations from masking a dangerous lack of resilience.

  ### Case 3: The "Likable Rule-Breaker" (Ambiguous/Unpleasant Answer)
  *   **Data:** Resident is beloved by patients (High Compassion scores). However, they frequently bend documentation rules to "help" patients (Integrity breaches). They argue this is for the patient's good (Reasoning: Care > Rules).
  *   **Director's Gut:** You like this resident. They feel "virtuous" in the old-school sense.
  *   **Situational Map:** Mix of PL-1 and PL-2.
  *   **Tripartite Audit:**
      *   *Compassion:* High alignment (Feel/Reason/Act).
      *   *Integrity:* Act failed (rule-breaking). Reasoning is misaligned with professional standards (Personal ethics > Institutional ethics).
  *   **Procedure Output:** **Conflicted Character.** The procedure forces you to split the rating. You cannot give a global "High" on Character.
  *   **Evaluation Language:** *"Resident exhibits high natural empathy. However, their conception of Integrity conflicts with professional standards. They prioritize immediate patient comfort over systemic accountability. This is not 'practical wisdom'; it is ethical inconsistency. Rating for Integrity is 'Needs Remediation' despite high Compassion scores."*
  *   **Why you won't like it:** It penalizes a resident who is "nice" and whom patients love, forcing you to label them as ethically risky. It prevents you from using "Compassion" to excuse boundary violations.

  ---

  ## Limitations & Warnings (Read Before Signing)

  **1. This is Not Prediction**
  This procedure assesses *past interaction patterns*, not future traits. Situationism is correct that a change in context (e.g., a new supervisor, a personal tragedy) can alter behavior instantly. Do not write "Resident *is* compassionate." Write "Resident *demonstrated* compassion across observed contexts."

  **2. This is Not Supervision**
  This evaluation is for accreditation, not growth. If the procedure flags a deficit (like Case 2), you must have a separate conversation for remediation. Do not use this form to deliver bad news; use it to document the need for the conversation.

  **3. The "Measurement" Illusion**
  **[FLAG: JUDGMENT CALL]** *The weighting of PL-3 over PL-1 is a philosophical choice, not a statistical fact. You are prioritizing resilience over consistency. If the accrediting body values consistency above all, this procedure conflicts with their implicit metric.*

  **4. The Blind Spot**
  This procedure cannot detect "Strategic Virtue" (a resident who knows they are being evaluated and performs virtue for the quarter). Only longitudinal data (multiple quarters) can mitigate this. If this is their first quarter, downgrade confidence in all ratings by one level.

  **5. No False Precision**
  Do not use numbers (e.g., "4.5/5"). Use narrative qualifiers (e.g., "Robust," "Fragile," "Context-Dependent"). Numbers imply a psychometric validity this process does not possess.

  ---

  **Final Director's Check:**
  Before submitting, ask: *If I swap this resident's rotation with a harder one, would my rating change?* If the answer is "Yes, significantly," ensure your written evaluation explicitly states that the rating is **Context-Dependent.** This is the honest admission of the situationist critique within a virtue ethics framework.
