answer: |-
  ### Straight Talk on Your Premise

  **Your AI example is risky.** Here's why: "Knowing how to prompt" often feels like "Knowing *that* if I type X, I get Y." It can easily collapse into trial-and-error facts, which undermines your whole point. Also, asking if *the AI* knows how is a rabbit hole about consciousness that will eat your session alive.

  **The "Skills vs. Facts" Trap:** You are right to worry. If you frame this as "Riding a bike (skill) vs. The capital of France (fact)," kids will think it's just "Practical vs. Academic." Ryle's point is deeper: **Knowing How is a distinct category of intelligence, not just unconscious Knowing That.** You can know all the physics of a bike (That) and still fall off. You can ride perfectly (How) and fail a physics test.

  **Verdict:** Keep the AI example, but use it as a *challenge* to the distinction, not the primary illustration. Start with something physical to lock in the intuition, then move to AI to complicate it.

  **Cut Ryle's Regress:** Absolutely. It's an argument about infinite regress of intellectual operations. It's dry, technical, and unnecessary for a 50-minute intro. Admit you're skipping it.

  ---

  ### The Teaching Plan (50 Minutes)

  **Goal:** Students understand that "Knowing How" cannot be fully reduced to "Knowing That."
  **Materials:** Whiteboard, one crumpled piece of paper per student, bin at the front.

  #### 1. The Hook: The Paper Toss (0:00–0:10)
  *   **Action:** Put a bin at the front. Hand everyone a crumpled paper.
  *   **Task:** Ask one student to stand up and explain the *physics* of throwing the paper into the bin (angle, force, trajectory). Write their points on the board under **"KNOWING THAT."**
  *   **Task:** Ask another student to actually throw the paper in. If they miss, let them try again until they make it. Label this **"KNOWING HOW."**
  *   **Discussion Question:** "If the first student memorized every fact about the throw, could they guarantee they'd make the shot without practicing?"
  *   **Point to Drive Home:** You can have all the *facts* (That) and still lack the *capacity* (How). They are different things.

  #### 2. Defining the Distinction (0:10–0:20)
  *   **Board Work:** Draw two columns.
      *   **Knowing That (Propositional):** Can be written down, true/false, stated in sentences. (e.g., "Paris is in France," "Transformers use attention mechanisms.")
      *   **Knowing How (Procedural):** Shown in action, successful performance, not always articulable. (e.g., "Speaking a language," "Riding a bike," "Prompting AI effectively.")
  *   **The Trap Warning:** Tell them explicitly: "Don't just think this is Facts vs. Skills. Think of it as **Describing the World** vs. **Navigating the World.**"
  *   **Key Philosophical Move:** Ask: "Can I turn my Knowing How into Knowing That?" (e.g., Can I write a manual that makes you an expert tennis player just by reading it?)
      *   *Expected Answer:* No.
      *   *Why?* Because "Knowing How" involves judgment, timing, and adaptation that rules can't capture.

  #### 3. The AI Test Case (0:20–0:35)
  *   **Pivot to your example:** Now bring in the AI.
  *   **Scenario:**
      *   **Person A:** Knows *that* the AI uses transformers, has parameters, and was trained on data.
      *   **Person B:** Knows *how* to prompt the AI to get a specific style of essay, even if they don't know what a transformer is.
  *   **Discussion:** "Who knows more about the AI?"
      *   *Likely consensus:* Person A knows the *machine*, Person B knows the *practice*.
  *   **The Curveball (Preempting Misconceptions):** Ask: "Is Person B's 'Knowing How' just a secret list of 'Knowing That' rules they haven't told us?" (e.g., 'I know *that* using the word 'concise' works better'.)
      *   **Intervention:** If they say yes, push back. "If I give their list of rules to a newbie, will the newbie get the same results?" (Usually no, because the *how* involves intuition and tweaking).
      *   **The AI Mind Trap:** If someone asks, "Does the AI know how to write?" **Shut this down gently.** "We are talking about *human* knowledge of the AI. Whether the machine 'knows' is a different debate for next month. Today, we care about *us*."

  #### 4. Misconception Check & Head-Offs (0:35–0:45)
  *   **Misconception 1: "Knowing How is just Knowing That you can't explain."**
      *   *Head Off:* "If I record your brain while you ride a bike, will I find sentences like 'lean left now'? No. The knowledge is in the muscles/nerves, not the language center. It's a different *format*."
  *   **Misconception 2: "They are totally separate."**
      *   *Head Off:* "They mix. Knowing *that* the brake exists helps you learn *how* to stop. But one doesn't replace the other."
  *   **Misconception 3: "Knowing How is lower class/dumber."**
      *   *Head Off:* "A master surgeon has immense Knowing How. It's not 'dumber' than knowing medical theory; it's different intelligence."

  #### 5. The Exit Ticket (0:45–0:50)
  *   **The Check:** Don't ask for definitions. Give them a scenario.
  *   **Scenario:** "Imagine a robot that has every physics textbook ever uploaded (Knowing That) but has never moved its arms. It tries to catch a ball and smashes its hand. Why?"
  *   **Expected Answer:** "It lacks Knowing How."
  *   **Harder Follow-up:** "Imagine a human who can catch the ball perfectly but fails every physics test about gravity. Do they understand the ball?"
  *   **Expected Answer:** "They understand how to use it (How), but not what it is (That)."
  *   **Success Metric:** If they agree that *both* people have a type of knowledge the other lacks, you win.

  ---

  ### Where You Might Fail (And How to Fix It)

  1.  **If the AI discussion drags:**
      *   **Fix:** Cut it at 15 minutes max. Remind them: "The AI is just a tool to test the human knowledge distinction. Don't get stuck on the robot's soul."
  2.  **If they insist "Knowing How is just subconscious Knowing That":**
      *   **Fix:** This is the "Intellectualist Legend" Ryle fought. Use the **Language Example**. "You know how to speak English. Can you list all the grammar rules you follow right now?" (They can't). "But you're doing it correctly. So the knowledge exists without the facts."
  3.  **If the group is quiet:**
      *   **Fix:** Stop asking "What do you think?" Start asking "Who agrees with [Student Name]?" or "Raise your hand if you think the physics student could make the shot." Force a vote.

  ### Summary of What to Skip
  *   **Ryle's Regress:** (The argument that if every action required a prior intellectual operation, we'd never act). Too abstract.
  *   **Gettier Problems:** (Justified True Belief). Irrelevant here.
  *   **Neuroscience:** Don't try to explain *where* in the brain procedural memory lives. Keep it philosophical.

  ### Final Advice
  Your framing is 80% there. The only weak spot is treating "Prompting" as a pure "Knowing How." It's actually a hybrid. Be honest about that ambiguity. Tell them: *"Prompting is interesting because it sits on the border. That's why it's a good test case."* Admitting the grey area makes you look more credible, not less.
