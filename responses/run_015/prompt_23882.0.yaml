answer: |-
  You are thinking about this exactly the right way. Treating moral worth as a mechanism subject to counterfactual testing is the most robust way to cut through the fog. As a chemist, you know that if a reaction yields different products under seemingly similar conditions, you either have an unmeasured variable or a flawed model.

  Your intuition is toggling between two different variables without realizing it. That is why you feel a contradiction. You are measuring **Resistance Overcome** in the drowning cases but **Value Integration** in the donation cases.

  Here is a clean account that preserves your verdicts without contradiction, followed by an analysis of the unlisted case and a recommendation on simplification.

  ### The Principle: Counterfactual Stability of Moral Commitment

  Moral worth is not a single scalar quantity; it is a function of two independent variables that both contribute to the **reliability** of the moral motivation.

  $$ \text{Moral Worth} = f(\text{Alignment}, \text{Resistance}) $$

  1.  **Alignment (Thermodynamic Stability):** To what degree is the agent's emotional and psychological constitution integrated with the moral good? (Does the agent *love* the good, or just tolerate it?)
  2.  **Resistance (Activation Energy):** To what degree did the agent have to overcome active counter-pressures (fear, greed, selfishness) to perform the act?

  An act has moral worth if it is caused by a motivation that is responsive to moral reasons. The *degree* of worth increases if that motivation is either deeply integrated (High Alignment) or proven robust against opposition (High Resistance).

  ### Testing Your Cases Against the Mechanism

  Let's run your verdicts through this two-factor model to see if they hold.

  **1. The Shopkeeper (Reputation)**
  *   **Alignment:** Zero. (Motivated by profit/reputation, not honesty).
  *   **Resistance:** Zero. (No temptation to cheat mentioned, or if there was, it was overcome by greed/fear, not duty).
  *   **Verdict:** **No Worth.** The mechanism isn't even connected to the moral value.

  **2. The Scared Swimmer (Duty vs. Fear)**
  *   **Alignment:** High. (Recognizes the "ought").
  *   **Resistance:** Very High. (Overcame instinct for self-preservation).
  *   **Verdict:** **High Worth.** The high resistance acts as a "costly signal," proving the commitment is robust. This explains why you rate this higher than the Impulsive Swimmer.

  **3. The Impulsive Swimmer (Spontaneous Impulse)**
  *   **Alignment:** High. (Impulse tracks the good).
  *   **Resistance:** Low. (No fear to overcome).
  *   **Verdict:** **Moderate/High Worth.** The alignment is good, but the *reliability* is untested. We don't know if the impulse would hold if the water were colder or the risk higher. This explains your hesitation to give it *full* credit compared to the Scared Swimmer.

  **4. The Cold Donor (Duty)**
  *   **Alignment:** Moderate. (Recognizes the duty, but emotions are neutral/disconnected).
  *   **Resistance:** Moderate. (Overcame inclination to keep money).
  *   **Verdict:** **High Worth.** The will is reliable.

  **5. The Warm Donor (Affection/Grandmother)**
  *   **Alignment:** Very High. (The moral value is constitutive of their emotional life; they *are* a person who helps).
  *   **Resistance:** Low. (No internal conflict).
  *   **Verdict:** **Very High Worth.** Here, the extreme **Alignment** compensates for the low **Resistance**. You value this higher than the Cold Donor because the moral commitment is more deeply embedded in the agent's identity, making it psychologically more stable in the long run, even if it wasn't "tested" in the moment.

  **6. The Mistaken Donor (Flawed Judgment)**
  *   **Alignment:** High. (Pure motives).
  *   **Resistance:** N/A.
  *   **Verdict:** **Motive gets credit.** Since moral worth tracks the *mechanism of the will*, not the *outcome of the reaction*, the error in judgment doesn't negate the worth of the motivation.

  ### The Unlisted Case: The Conscientious Wrongdoer

  > *Case:* Someone convinced they are doing a terrible thing, does the act, and it turns out to be exactly the right one.
  > *Example:* A soldier believes shooting a combatant is a war crime (morally terrible) but does it to save their squad. It turns out the combatant was about to detonate a bomb.

  *   **Alignment:** **Negative.** The agent's will is actively opposed to the moral value (they believe they are violating it).
  *   **Resistance:** High. (They are overcoming their own conscience).
  *   **Verdict:** **Negative Moral Worth (Blameworthy).**
  *   **Reasoning:** Even though the outcome is right (consequentialist success), the *mechanism* of the will is corrupted. They acted against their own recognition of the good. In your counterfactual terms: In the nearest possible world where their belief was correct (i.e., the act *was* terrible), they would still have done it. That makes the motivation dangerous, not praiseworthy. Moral worth requires that the act be done *because* it is right (or perceived as right), not *despite* being perceived as wrong.

  ### Resolving the Contradiction: Should You Drop a Verdict?

  You asked if you should drop a verdict to achieve a simpler account. You have two options:

  **Option A: The Simpler Account (Single Variable)**
  You force the system to run on one variable.
  *   *If you choose Resistance (Kantian):* You must say the **Scared Swimmer > Impulsive Swimmer** (keep) AND **Cold Donor > Warm Donor** (change). *Cost:* You lose the intuition that emotional connection matters.
  *   *If you choose Alignment (Virtue Ethics):* You must say **Warm Donor > Cold Donor** (keep) AND **Impulsive Swimmer = Scared Swimmer** (change). *Cost:* You lose the intuition that overcoming fear is specially praiseworthy.

  **Option B: The Accurate Account (Two Variables)**
  You accept the Two-Factor Model proposed above.
  *   *Verdict:* **Keep all your intuitions.**
  *   *Cost:* You must accept that "Moral Worth" is not a single number on a scale, but a profile of the agent's moral psychology. Sometimes we praise the *strength of the will* (Resistance), and sometimes we praise the *goodness of the heart* (Alignment).

  ### Recommendation

  As a scientist, you know that a model that fits the data is better than a model that forces the data to fit. Your intuitions are the data.

  The **Two-Factor Model** is superior because it explains *why* you feel the tension. You feel the tension because you are correctly identifying that **Reliability** can be demonstrated in two different ways:
  1.  **Stress Testing:** Showing the mechanism holds under pressure (Scared Swimmer).
  2.  **Engineering Quality:** Showing the mechanism is built with superior materials (Warm Donor).

  If you want a precise principle to test new cases, use this:

  > **The Principle of Moral Robustness:** An act has moral worth to the extent that the motivation is responsive to moral reasons, and that responsiveness is demonstrated either by **integration** (the agent's emotions support the act) or by **stability** (the agent's will sustains the act against counter-pressure).

  This allows you to tell your granddaughter that the Scared Swimmer is a **hero of the will**, while the Warm Donor is a **saint of the heart**. Both have moral worth, but they are different chemical species of goodness.
