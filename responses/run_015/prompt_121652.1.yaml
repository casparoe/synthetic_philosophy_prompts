answer: |-
  You have independently rediscovered one of the most significant distinctions in the philosophy of language and linguistics. Your intuition is correct: there is a legitimate gap between what a sentence literally conveys and what a speaker uses it to accomplish.

  The vocabulary you are looking for belongs to the field of **Pragmatics**, specifically the work of the philosopher H.P. Grice and later developments in **Speech Act Theory** and **Politeness Theory**.

  Here is how these frameworks resolve your puzzle, answer your specific questions, and validate your shifting principle about cooperation.

  ### 1. The Vocabulary: Semantics vs. Pragmatics
  To understand your sister's reply, we must distinguish between two layers of meaning:
  *   **Semantics:** The literal meaning of the words and sentences (e.g., "Dad is busy"). This layer deals with truth conditions. Your sister was semantically honest; her statements were factually true.
  *   **Pragmatics:** The meaning of those words *in context*, considering the speaker's intent and the relationship between participants. This layer deals with action and implication.

  Your puzzle arises because you were evaluating her statement based on *semantics* (is it true?), while she was operating on the level of *pragmatics* (what action does this perform?).

  ### 2. Is the meaning "extra" or "recoverable"?
  You asked: *Should I understand the "real" meaning as something extra that the speaker attaches to her words, or as something already recoverable from the words themselves once the shared context is taken into account?*

  According to Grice's theory of **Conversational Implicature**, the meaning is **recoverable**. It is not a secret code or an "extra" attachment; it is a logical inference that a rational listener is expected to make.

  Grice proposed that conversation is governed by a **Cooperative Principle**. We assume our conversation partner is trying to be cooperative. This principle is fleshed out in four "Maxims," one of which is crucial here: **The Maxim of Relation (Relevance).**

  *   **The Logic:** You asked a Yes/No question about logistics. She answered with facts about hobbies and cake.
  *   **The Inference:** If you assume she is being cooperative (following the Maxim of Relation), her answer *must* be relevant to your question.
  *   **The Calculation:** "Why would she tell me Dad is busy unless it implies he cannot come? Why mention the cake unless it implies she is a guest, not a planner?"
  *   **The Result:** The "No" is not stated, but it is logically *implicated* by the relevance of the facts provided.

  Therefore, the meaning is not hidden; it is invited. It relies on you doing the work of connecting her premises to your question. If you cannot make that connection, the communication fails, but the *potential* for meaning was there in the context.

  ### 3. Is it deceptive or legitimate cooperation?
  You asked: *Does that change whether we ought to regard her reply as deceptive rather than as a legitimate way of saying no?*

  This is where **Politeness Theory** (developed by Penelope Brown and Stephen Levinson) complements Grice. They argue that certain speech acts are "Face-Threatening." A direct refusal ("No, do not invite them") threatens your "positive face" (your desire to be approved of) and her "negative face" (her desire not to be imposed upon).

  If conversation were only about the efficient transfer of data, directness would be the highest virtue. But conversation is also about **social maintenance**.

  *   **Deception** violates the Maxim of Quality (do not say what you believe to be false). Your sister did not do this; her facts were true.
  *   **Indirectness** often navigates the Maxim of Manner (be clear) to preserve the Maxim of Relation (maintain the relationship).

  By being indirect, your sister was actually adhering to a *higher-order* cooperation. She was cooperating not just with the *task* (planning the reunion) but with the *relationship* (keeping peace between siblings and avoiding conflict with parents).

  In this light, her reply is not deceptive. It is a **socially calibrated speech act**. She performed a "refusal" without using the word "no," allowing you to save face (you weren't directly rejected) and her to avoid aggression.

  ### 4. Refining Your Principle
  You wrote: *"Perhaps ordinary conversation operates under an implicit agreement that participants should be direct... But that principle cannot be right."*

  You are absolutely right to discard that principle. The implicit agreement of conversation is not **Directness**; it is **Intelligibility within Context**.

  *   **The Old View:** Cooperation = Giving the exact data requested.
  *   **The Pragmatic View:** Cooperation = Providing enough information for the listener to infer the speaker's intent, while managing social bonds.

  Your sister trusted you to understand the implication. When you later asked her about it, and she admitted she meant it as a refusal, she confirmed that she believed the implicature was strong enough to be understood. The friction you feel now is not because she lied, but because there was a mismatch in **contextual alignment**. You were in "logistics mode" (seeking data); she was in "diplomacy mode" (seeking consensus).

  ### Summary
  To answer your questions directly using this new vocabulary:

  1.  **Is the meaning extra or recoverable?** It is **recoverable**. It is a *conversational implicature* derived from the assumption that her statements were relevant to your question.
  2.  **Is it deceptive or legitimate?** It is **legitimate**. It is a standard pragmatic strategy to mitigate "face-threatening acts." It prioritizes social cooperation over informational directness.

  You have correctly identified that language is not just a code for transmitting facts, but a tool for negotiating social reality. Your sister's words were a vehicle for a decision, and the engine that drove that vehicle was not the dictionary definitions of the words, but the shared history and context you both inhabit.
