          *   JC tells you how to update *given* new probabilities. It doesn't tell you *how to get* those new probabilities.
          *   SC: Input is "I learned $E$." Still requires an account of "learning."
          *   *Verdict:* Plagues both. This is the "Old Evidence" or "Theory of Observation" problem, not specific to the update rule itself. However, JC makes it more salient because the input is a number, not a proposition.
      *   *Issue 4: Rule of Inference vs. Constraint.*
          *   Is JC a normative rule or a consistency constraint?
          *   *Verdict:* Philosophical interpretation.
      *   *Evaluation:* Do these force rejection?
          *   Most Bayesians accept JC as the best available tool for uncertain evidence, despite flaws.
