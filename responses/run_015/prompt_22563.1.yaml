prompt: |-
  I'm taking a course on Bayesian epistemology and I keep going back and forth on this one issue, and I feel like my notes aren't good enough to settle it. The setup is: I'm in a dimly lit room looking at an object that is either red or green, but the light is bad so I don't get a crisp observation — I just end up with something like "probably red, maybe green," say a credence of 0.8 on red. My prior was 0.5.

  The question is how I should update. The standard Bayesian move (Lewis-style conditionalization) is to condition on the evidence proposition — but here the evidence isn't a proposition I can just condition on, because I didn't observe "the object is red," I observed something fuzzy like "it looks red to me," and that looks-red event is compatible with both red and green objects. That's the classic motivation for Jeffrey conditionalization, where instead of conditioning on a proposition you specify new target credences for the partition (red: 0.8, green: 0.2) and let the rule average your old conditional credences across the partition to update everything else.

  So what I want is a careful comparison of the two rules applied to this kind of case. First, walk through what each rule actually does to credences in some other proposition that's correlated with the color (say "the object is a fire truck" or "the object was painted by a certain artist") — i.e. show the difference in the outputs, not just in the description. Second, explain why standard conditionalization genuinely fails here rather than just being less convenient. And third — this is the part I'm stuck on — there are a bunch of known problems with Jeffrey conditionalization (order-dependence / non-commutativity, sensitivity to how you carve up teh partition, the question of where the target credences come from in the first place, and whether it's really a rule of inference at all). Which of these are specific to Jeffrey's rule and which also plague ordinary conditionalization, and do any of them actually force you to reject Jeffrey's rule or are they more like costs you just have to live with?
