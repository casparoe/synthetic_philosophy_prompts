          2.  **The Drive:** She drove the speaker to school every Tuesday for two years, complaining the whole way. Cannot use the complaining as evidence she didn't want to do it (since complaining is also a choice). Must handle this carefully.
          3.  **Word "Utility":** Appears exactly once, fairly late. Must be defined her way (choices reveal preference) in a sentence a 14-year-old understands. No "happy/happiness/wellbeing/satisfied."
