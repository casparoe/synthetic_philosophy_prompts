answer: |-
  Thank you for being here. Thank you to the department, the dean, the donor, and to my family—my brother, my cousins, my aunt, and her co-authors, who knew her work better than I ever did.

  We are here to dedicate a graduate fellowship. It covers full tuition. It provides a summer stipend. It requires no teaching in the first year. It buys time.

  My grandmother left specific instructions for how she should be described. She did not leave them in a will; she left them in her papers. She held that internal states are unobservable. So, I cannot tell you what she felt. I cannot tell you what she hoped. I can only tell you what she did, what she gave up, and what else was on the table at the time.

  For two years, she drove me to school every Tuesday. She left her house at 7 AM. She entered the highway. For forty minutes, she listed grievances. She spoke about the traffic, the radio, the engine, and the weather. She never once spoke about the destination. She never once said a good thing about the drive. But she returned the next week. And the week after. She chose the car over the bus. She chose the complaint over the silence. She chose the cost of gas over the cost of my absence.

  I know there are people in this room who could model this behavior better than I can, but I was the passenger.

  For decades, my aunt and I have looked at the same ledger and read different entries. My aunt says the transfers of time and money were generosity. I say they were an inability to say no. On any other account, this distinction would matter. It would tell us about her heart. On her account, there is no further fact. The hand reached out. The resources moved. Whether the hand reached out because it was open or because it was unable to close, the hand was there. The prediction for the recipient is identical. The only difference is the story we tell ourselves to sleep at night. So we stop arguing. We look at the hand.

  She taught me that you cannot infer a preference from a single act, you must look at the feasible set. You must look at what was sacrificed. She sacrificed silence. She sacrificed leisure. She sacrificed the comfort of being understood.

  This brings me to the only technical term I will use. **Utility** is just the name we give to the thing you actually picked when you couldn't have everything.

  By that definition, she maximized it every day. Not because she was happy, but because she chose.

  This fellowship continues that choice. It says to a student: You do not have to teach. You do not have to worry about rent. You can choose the work. We know this costs money. We know there were other things this money could have bought. We know the feasible set was large. But this is the choice we make now, in her name.

  She is not here to complain about the speech. She is not here to correct the data. She is here in the choice we made to gather, and the choice the donor made to give, and the choice this student will make to study.

  Thank you.

  ***

  **Note on the Hardest Line**

  The hardest line to write was: *"Whether the hand reached out because it was open or because it was unable to close, the hand was there."*

  **Why:** This line had to carry the emotional weight of the "generosity vs. inability to say no" constraint without violating the "no mental state" rule or sounding coldly clinical. It needed to acknowledge the aunt's perspective and the speaker's perspective as equally valid descriptions of the *data*, while pivoting to tenderness. If I leaned too hard into the "unable to close" phrasing, it risked sounding like a diagnosis (psychologizing). If I leaned too hard into "open," it violated the constraint by implying a virtuous internal state. The balance had to suggest that the *action* is the only thing that comforts the recipient, rendering the motive metaphysically interesting but practically irrelevant. Making that sound like love, rather than indifference, required precise wording to ensure the "hand" imagery landed as support, not just mechanical movement.
