  **Hallway outside Conference Room B. The seminar crowd has thinned out. Mara leans against the wall, nursing a lukewarm paper coffee. Leo paces slightly, holding a fresh cup.**

  **Leo:** So, you really stood by it. During Q&A. I thought you were going to walk back the "intrinsic weight" claim when Singh pressed you on the Ramsey rule.

  **Mara:** I wasn't going to walk back anything. The Ramsey rule assumes time is just another coordinate, like *x* or *y*. But it's not. The "now" isn't just a indexical marker, Leo. It's an ontological privilege. My chronological positional weighting isn't about impatience. It's about the agent's temporal location having normative gravity.

  **Leo:** Normative gravity. Right. Okay, let's strip the jargon. You're saying pure time preference is rational even if we delete risk. No inflation, no chance the world blows up, no chance preferences change. Just time.

  **Mara:** Exactly.

  **Leo:** Alright. Concrete case. Climate adaptation fund. We have a mechanism—let's say a trust fund with a literal unbreakable lock. We can disburse one million dollars to this specific village now. Or, with zero risk and guaranteed transmission, we disburse ten million to that same village's direct descendants in exactly eighty years. Same people, genetically and culturally continuous. No uncertainty. Do you take the million?

  **Mara:** ...I might. Depending on the weighting curve.

  **Leo:** You might take one million now over ten million later, guaranteed? That's not normative gravity, Mara. That's just dressed-up present-bias. You're smuggling in uncertainty or identity worries you already agreed to exclude.

  **Mara:** I'm not smuggling anything. Think about space. If I'm walking past a pond and a child is drowning right in front of me, I have a stronger obligation to save them than a child drowning in a pond I can't see in another country, even if the cost to me is identical. Spatial proximity matters.

  **Leo:** Does it though? Or does it only matter because spatial distance usually introduces causal or informational bottlenecks? I can't save the kid in Bangladesh because I'm not there. I can't verify the need. But in your time case, the transfer mechanism is secured. There's no bottleneck. The future is causally connected to the present by the trust fund. If I could push a button to save the kid in Bangladesh with the same ease as the kid in front of me, distance would vanish morally. You're treating time like space, but ignoring that the "distance" here has no friction.

  **Mara:** But time *has* friction. The future doesn't exist yet. The "here" in space exists simultaneously with the "there." The "now" exists; the "then" is potential. That metaphysical asymmetry definately creates a normative asymmetry. I'm anchored in the present. My agency radiates from *now*.

  **Leo:** Anchored? You sound like you're describing a psychological limitation, not a rational principle. If you were capable of caring equally about your future self, you'd take the ten million. By discounting, you're saying your current temporal index is more real than your future one. But you *are* that future one. Or at least, the village is the same community.

  **Mara:** It's not about reality, it's about access. I have access to the present welfare. The future welfare is... abstract. Even if guaranteed.

  **Leo:** It's not abstract if it's guaranteed! That's the whole point of the thought experiment. If I promise to give you a hundred bucks tomorrow, and I lock it in a box you hold, it's not abstract. If you say "I'd rather have ninety bucks now," you're just saying you're impatient. You're saying the mere passage of time destroys value. Why?

  **Mara:** Because the subject of the valuation is present. Look, if you write down a contract that says you will recieve pain in ten years, it feels different than pain now. That's not just fear. It's the structure of experience.

  **Leo:** [Pauses, scribbles on a napkin] I think you're conflating the *experience* of time with the *ethics* of time. Just because I feel pain more sharply now doesn't mean I should rationally prioritize it over greater pain later, especially if I'm deciding for a collective village fund. You're building a moral theory on a psychological quirk.

  **Mara:** Is it a quirk? Or is it recognition that moral agents are temporal beings? If I ignore the weight of the present, I'm asking agents to act like view-from-nowhere gods. We aren't. We're here. Now. That position has weight.

  **Leo:** But if the weight leads you to throw away nine million dollars of welfare for no reason other than the calendar flipping, you're not being an agent. You're being a leaky bucket. You're letting value spill out because you refuse to acknowledge that time, absent risk, is morally neutral.

  **Mara:** Time isn't neutral, Leo. It's directional. Entropy, causality, consciousness—it all flows one way. To treat *t+80* as equal to *t+0* is to ignore the flow that constitutes agency itself.

  **Leo:** The flow constitutes *you*. It doesn't constitute the *good*. The village's welfare in eighty years is just as real as their welfare now, even if they aren't here to feel it yet. By discounting it, you're saying their future happiness is worth less than your current convenience. That's not philosophy. That's just selfishness with a thesaurus.

  **Mara:** [Takes a sip of coffee, grimaces] Ouch. But if I accept your view, I have to accept that I should be indifferent between saving a life today and saving a life in eighty years, regardless of the cost to current projects.

  **Leo:** If the lives are equal and the cost is equal? Yes. Why wouldn't you?

  **Mara:** Because I'm living now.

  **Leo:** And they'll be living then. And if you discount them just because they're later, you're saying their lives count less. I just don't see how you square that with any objective view of welfare.

  **Mara:** Maybe the objective view is the problem. Maybe rationality is always indexed.

  **Leo:** Then rationality can't guide long-term planning. It collapses into a series of momentary sparks.

  **Mara:** Or maybe it just admits we're not infinite.

  **Leo:** [Shakes head, smiles faintly] We're not infinite, Mara. But we can do better than throwing away ten million bucks because the date on the check is too far away.

  **Mara:** [Pushes off the wall] Maybe. But I'd still take the million now.

  **Leo:** I figured. Come on, there's coffee in the faculty lounge that doesn't taste like burnt pennies.

  **Mara:** Lead the way. But I'm spending my million on espresso.

  **Leo:** If you take the million.

  **Mara:** When I take the million.
