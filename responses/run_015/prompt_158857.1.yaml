  3. "If task-sets are hierarchical priors, how are they distinguishable from beliefs?" asks the Bayesian modeler. Argue motor priors are subpersonal and mandatory whereas beliefs are personal, but refuse to let him redefine all priors as cognitive states. *Soft spot:* The subpersonal/personal line is exactly where your theory is weakest.

  4. "Is 'motorically unencapsulated' not a contradiction in terms for a module?" challenges the Fodorian. Reply input systems can be open to motor feedback without being open to semantic inference, but concede this redefines encapsulation beyond Fodor's original intent. *Soft spot:* You are changing the definition of modularity to save the phenomenon.

  5. "If perception is constituted by action, is it still representation or just control?" whispers the colleague hoping you fail. Admit you don't know yet and that your account might dissolve the perception-action distinction entirely, but refuse to retreat to a dual-system view. *Soft spot:* You are flirting with eliminativism about perception itself.
