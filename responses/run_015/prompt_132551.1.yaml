          *   CKR + Conflicting Preferences = Stalemate (or War of Attrition).
          *   The "Tax Foreclosure" might be the *rational* outcome of the current game structure. CKR predicts the crash, it doesn't steer the car.
      *   **The "Common Knowledge of the Game" Assumption:** Standard theory assumes we all see the same board. In reality, we see different boards. This undermines IEDS and Backward Induction.
      *   **Practical Implication:** How to break the deadlock? You need to change the game (add options, change payoffs, introduce a mediator), not just rely on thinking harder.

