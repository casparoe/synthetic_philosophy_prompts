      *   *Is it fatal to disjunctivism?* Probably not. Disjunctivists have resources to handle mediated perception and hallucinations.
      *   *Key Disjunctivist Moves:*
          1.  **Epistemic vs. Metaphysical:** Disjunctivism is often about metaphysical nature, not just epistemic indistinguishability.
          2.  **The Nature of the Object:** In the veridical case, is the object the *heat* or the *sound* generated by the device? If the device is a transparent tool, the object is the heat. If it's an opaque mediator, the object might be the sound.
