  Do these actually hang together? I can feel pulls — especially between treating "horse" as essentially grounded and treating the whole project as political instrumentation, and maybe between the logical reading in (1) and the essentialist commitment in (2) — but I can't tell if those are real contradictions or just surface clashes. Can you audit the package: rank the tensions by severity, for each say which commitment has to give and what it costs, and flag any pairs that only look incompatible but dissolve once you inspect them closer? Also please say what argument or consideration would change your mind about whether this is consistent, and be explicit about where your reasoning is most likely to fail — maybe I'm forcing an anachronistic framework onto the text and manufacturing conflicts that aren't really there.
