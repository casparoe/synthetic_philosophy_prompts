prompt: |-
  I am taking an advanced course on value theory and have been debating hedonism with a small study group. My friends are convinced that the heterogeneity problem is fatal: they point out that the diffuse warmth of lying in sunlight, the crisp satisfaction of solving a proof, and the sharp pleasure taken in a rival's failure seem to share no intrinsic phenomenal feature whatsoever, which means there is no unified property of "pleasure" for hedonism to treat as the basic good. They keep asking me what these states have in common if not a particular "feel," and I want to defend a structural answer rather than retreat to family resemblance.

  Please argue for the position that the heterogeneity problem dissolves once we abandon the search for a shared felt-quality and instead treat pleasure as a formal evaluative relation—specifically, being a mental state that the subject registers as non-instrumentally worth sustaining, where "worth sustaining" is defined not as a further feeling but as the absence of any internal normative pressure to terminate the state, even when instrumental costs accumulate. Your argument should directly confront the three classic counter-cases—bodily sensory enjoyment, intellectual achievement, and malicious satisfaction—demonstrating how each satisfies this structural relation despite lacking phenomenological overlap. Do not include bibliographies, citations, or references to specific texts; the reasoning should stand entirely on conceptual analysis. Keep your response to a single paragraph of no more than 250 words.
