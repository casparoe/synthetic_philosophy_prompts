answer: |-
  **Case Specification: City Water Authority Billing Migration**

  **Episode:** The July 1st switch to a new billing system.
  **Outcome:** System crash requiring manual backups.
  **Ex-ante Odds:** A well-informed insider at the time would have put success versus failure at **50/50**.

  **Account N (Narrative)**
  Director Vance faced the July 1 switch. Aging server hardware groaned (1); staff turnover rate left shifts bare (2). The vendor patch timeline slipped again (3), and the budget allocation freeze blocked contractors (4). Vance knew the odds: success or failure hung on a thread. Yet inaction cost more. She made the Director's go/no-go call (5). The system crashed. Vance's choice remained rational; she had bet on capacity against probability and lost. The team switched to manual logs, resolving the crisis without panic. The outcome was stark, but the decision, viewed from July 1, was a gamble, not an error.

  **Account S (Structural)**
  The migration failed following the July 1 switch. Five factors preceded the result. Aging server hardware reduced processing headroom (1). Staff turnover rate degraded institutional memory (2). Vendor patch timeline delays compressed testing (3). Budget allocation freeze prevented external support (4). These conditions constrained the Director's go/no-go call (5). The hardware limitations amplified the staffing gaps. The budget freeze locked the constraints. The vendor delay removed the buffer. The Director's call initiated the process under these loads. The system collapsed under the accumulated weight.

  ***

  **(a) Checks**
  **Blind-reader check:** A reader stopping Account N before the crash sees Vance weighing costs against known odds; they would predict a coin flip. A reader stopping Account S before the collapse sees conditions compounding ("amplified," "locked"); they would predict failure.
  **Substitution check:** If the outcome were success, Account N requires minimal rewriting (change "crashed" to "held," "lost" to "won"); the causal story remains a gamble. Account S requires extensive rewriting; verbs like "collapsed," "accumulated," and "compressed" imply failure and must be replaced to accommodate success, altering the causal story from convergence to absorption.

  **(b) Thesis vs. View**
  The **Inverse-Transparency Thesis** predicts that Account N (high visibility of agent reasoning) should exhibit high hindsight bias (high inevitability). The case shows Account N has low inevitability ("gamble, not an error"). The thesis fails.
  The **Intelligibility View** predicts that exhibiting agents' reasons blocks bias by anchoring the account to ex-ante knowledge. The case shows Account N maintains ex-ante intelligibility while avoiding inevitability. The view is borne out.

  **(c) The Single Feature**
  The feature is **articulated agent uncertainty**. In Account N, Vance's explicit recognition of the 50/50 odds ("hung on a thread") forces the reader to inhabit the pre-outcome moment. If you remove this feature (e.g., Vance "trusted the system"), Account N collapses into high inevitability, aligning with the usual bias where narrative closure implies destiny.

  **(d) Strongest Attack**
