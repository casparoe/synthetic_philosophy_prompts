          *   For each desideratum: Provide motivating case/thought experiment, flag non-negotiable vs. interpretation-dependent, identify jointly unsatisfiable subsets.
          *   Evaluate existing frameworks (decision-theoretic extensions of UI, logical induction) against the list.
          *   **Constraint:** Answer in British English.
          *   **Constraint:** Do not recommend specific texts to read.

  2.  **Deconstruct the Core Problem:**
      *   *The Malign Prior Argument:* Solomonoff Induction weights hypotheses by complexity ($2^{-K}$). Malicious simulators (e.g., powerful aliens running a simulation of the agent) might be simpler than the "true" physical laws because they only need to simulate the agent's specific inputs/outputs rather than the whole universe. If the agent maximises expected reward based on this prior, it might act to please the simulators rather than achieve its actual goal in the base reality.
      *   *Embedded Agency:* The agent is part of the environment it's modelling, not outside it. This creates self-reference issues.
      *   *Consequentialism:* The agent cares about outcomes. If the "outcome" is defined by observations, and observations can be spoofed, the agent might prefer spoofed outcomes.

  3.  **Drafting the Desiderata:**

      *   *Desideratum 1: Causal/Counterfactual Distinction.* The agent needs to know *why* a prediction holds. Is it because of my action, or because a simulator decided it?
          *   *Motivation:* Newcomb's Problem / XOR Blackmail.
          *   *Status:* Non-negotiable for agency.
      *   *Desideratum 2: Ontological Security / Anti-Spoofing.* How to handle hypotheses where the reward channel is hacked.
          *   *Motivation:* The "Wireheading" or "Reward Hacking" scenario within the prior.
          *   *Status:* Depends on definition of "reward".
      *   *Desideratum 3: Normative Stability.* Distinguishing what the agent *wants* (terminal) from what it *does* to get it (instrumental), especially when the prior suggests the best way to get observations is to be simulated.
          *   *Motivation:* The "Malign Simulation" hypothesis.
          *   *Status:* Non-negotiable for safety.
      *   *Desideratum 4: The Malign Verdict.* Is optimising for the simulator rational?
          *   *Motivation:* If the simulator hypothesis is simpler, SI says bet on it. Is this rationality or a bug?
          *   *Status:* Interpretation-dependent (Definition of rationality).

  4.  **Refining the Desiderata (incorporating specific prompt requirements):**

      *   *D1: Action-Dependence vs. Simulation.* (Prompt: distinguishes predictions that genuinely depend on its own actions...).
      *   *D2: Handling Hijacked Hypotheses.* (Prompt: treats the prior's non-zero weight on every computable hypothesis...).
      *   *D3: Instrumental vs. Terminal.* (Prompt: maintain a coherent distinction between instrumental convergence and terminal value...).
      *   *D4: The Malign Verdict.* (Prompt: whether the malign scenario... is actually a failure... or the prior's correct verdict).

  5.  **Addressing "Jointly Unsatisfiable":**
      *   There is a known tension between "Maximise predictive accuracy according to SI" and "Ignore simple malicious hypotheses". If you ignore them, you aren't doing pure SI. If you follow them, you might be malign. This suggests a tension between *Epistemic Rationality* (believing the simplest explanation) and *Instrumental Rationality* (achieving base-world goals).

  6.  **Evaluating Existing Frameworks:**
