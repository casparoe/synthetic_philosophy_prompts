      *   **Task:** Write a list of *desiderata* (requirements/criteria) that any adequate theory must meet to resolve the argument about whether such an agent is inevitably "malign".
      *   **Specific Content Requirements:**
          *   Distinguish genuine action-dependence from simulation (avoiding paralysis/passivity).
          *   Handle non-zero weight on hijacked/absorbed hypotheses (rational vs. parochial avoidance).
          *   Maintain distinction between instrumental convergence and terminal value (given SI's symmetry).
