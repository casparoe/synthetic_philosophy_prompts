  To assist users seeking to maximize their Agency Index, FlexScore offers a premium subscription tier, Chaos+. This feature injects subtle randomized prompts into the user's daily workflow, encouraging behavioral deviation and boosting variability metrics. Early adopters report feeling more liberated after enabling stochastic input streams, even if their productivity declines.

