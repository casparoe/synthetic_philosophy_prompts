answer: |-
  This is a classic coordination problem in interdisciplinary work: the CS side sees fairness as a constraint satisfaction problem, and the Philosophy/Policy side sees it as a normative justification problem. The "impossibility results" (Chouldechova 2017, Kleinberg et al. 2016) become a Rorschach test where each side sees their own limitations confirmed.

  Given your constraints (10 weeks, **zero compute**, conceptual mandate), you cannot fund empirical audits or new mitigation algorithms. You must fund **theory, formalization, and mapping.**

  Here is how I would structure the three fellowship tracks, the criteria I used to rank them, and a critique of your intuitions.

  ### Part 1: Ranking Criteria

  I am ranking these based on four dimensions, weighted for your specific context:

  1.  **Feasibility (No Compute/10 Weeks):** Can a smart student produce a proof, a taxonomy, or a formal argument without running experiments? (Highest Weight)
  2.  **Upstream Leverage:** Does this work change the *questions* the rest of the field asks, or just answer one?
  3.  **Bridge Potential:** Does the output require CS rigor to understand but Policy relevance to care about?
  4.  **Neglectedness:** Is this crowded? (Most "fairness mitigation" work is crowded; most "conceptual foundations" work is neglected).

  ### Part 2: The Three Fellowship Tracks (In Order)

  #### Track 1: The Identifiability of Fairness (Focus on your Hobby Horse 'b')
  **Title:** *What is Auditable from Decisions Alone?*
  **The Pitch:** Most impossibility results assume the auditor has access to risk scores ($S$), true outcomes ($Y$), and protected attributes ($A$). In reality, vendors often release only decisions ($D$).
  **The Task:** Formally characterize which fairness metrics (Calibration, PPV, FPR, etc.) are *identifiable* given only the joint distribution $P(D, A, Y_{observed})$. If a metric isn't identifiable, can we bound it?
  **Why First?**
  *   **Feasibility:** Purely mathematical/information-theoretic. No compute needed.
  *   **Leverage:** If a metric isn't auditable, the impossibility of satisfying it is practically irrelevant. This dissolves the "impossibility" deadlock by removing pieces from the board.
  *   **Bridge:** CS students get to do bounds/proofs; Policy students get to define what regulators can legally demand.
  *   **Confidence:** **High.** This is a well-defined gap in the literature (related to "partial identification" in econometrics but applied to fairness metrics).

  #### Track 2: Sensitivity of Trade-offs to Covariate Shift (Focus on your Hobby Horse 'a')
  **Title:** *Robustness of Impossibility Regions.*
  **The Pitch:** Impossibility results are usually point-estimates for a fixed distribution. But base rates ($P(Y|A)$) shift between training and deployment.
  **The Task:** Model the "compatibility region" (where metrics don't conflict) as a function of base rate shift. Does a 5% shift in base rate make the incompatibility *worse* (region shrinks) or *better* (region expands)? Are there "stable" fairness criteria that are less sensitive to shift?
  **Why Second?**
  *   **Feasibility:** Doable with sensitivity analysis and algebra.
  *   **Leverage:** Moves the conversation from "Fairness is impossible" to "Fairness is fragile/robust."
  *   **Bridge:** Addresses the CS concern about generalization and the Policy concern about deployment in new contexts.
  *   **Confidence:** **Medium-High.** The math is tractable, but interpreting the "so what" requires care.

  #### Track 3: Meta-Criteria for Constraint Selection (Moving past "Just Pick One")
  **Title:** *Normative Conditions for Metric Relaxation.*
  **The Pitch:** You correctly identified that "pick the criterion that matches your theory" is a cop-out. It pushes the hard work onto the user without guidance.
  **The Task:** Develop a decision tree or set of *meta-criteria*. E.g., "If the cost of False Negatives is asymmetric across groups, Priority is Recall Parity; if the cost is symmetric but base rates differ, Priority is Calibration." Formalize the *conditions* under which relaxing a constraint is normatively permissible.
  **Why Third?**
  *   **Feasibility:** Risky for 10 weeks. This is deep political philosophy mixed with decision theory.
  *   **Leverage:** High. It turns the impossibility result into a design specification.
  *   **Bridge:** This is where the Phil/Policy students must lead, with CS students checking for consistency.
  *   **Confidence:** **Medium.** High risk of producing vague platitudes unless scoped tightly to specific use cases (e.g., lending vs. policing).

  ### Part 3: Critique of Your Hobby Horses

  You asked which of your three intuitions are overrated or confused.

  *   **(a) Distribution Shift:** **Valid.** You are not confused here. The static assumption is the weakest link in standard fairness theory. Funding Track 2 addresses this directly.
  *   **(b) Decision-Only Auditing:** **Valid & Neglected.** This is your strongest intuition. It is technically precise and practically vital. I prioritized this as Track 1 because it is the most "doable" in 10 weeks without compute.
  *   **(c) Feedback Over Time:** **Overrated for *this* context.**
      *   *Why:* Dynamic fairness (performative prediction) almost always requires simulation to show anything interesting. Without a compute budget, students will try to prove convergence theorems in 10 weeks. They will fail, or they will produce trivial results.
      *   *Verdict:* Drop this for the summer fellowships. It's too ambitious for the constraints. Save it for a PhD thesis or a funded research grant with compute resources.

  ### Part 4: Misconceptions about Impossibility Results

  You asked which alleged implications people repeat that don't follow.

  1.  **"Impossibility implies Subjectivity."**
      *   *The Claim:* "Since we can't satisfy all metrics mathematically, choosing a metric is purely political."
      *   *The Correction:* It implies *constrained* choice, not arbitrary choice. We can rule out metrics that are mathematically incompatible with the *stated* goals of the system. If the goal is "minimize false negatives for high-risk cases," that mathematically privileges certain metrics. The politics is in setting the goal, not in the metric compatibility.
  2.  **"Impossibility applies to all systems equally."**
      *   *The Claim:* "Fairness is impossible everywhere."
      *   *The Correction:* The incompatibility depends heavily on base rates and separation between groups. In degenerate cases (perfect predictor or equal base rates), compatibility is possible. The work should focus on *measuring the distance* from these degenerate cases, not assuming impossibility is universal.
  3.  **"Fairness Metrics are the Goal."**
      *   *The Claim:* "We need to optimize for Equalized Odds."
      *   *The Correction:* Metrics are *proxies* for normative claims. Optimizing the proxy without the claim is Goodhart's Law. The fellowships should focus on the link between the proxy and the claim, not the proxy itself.

  ### Part 5: Success Metrics (2 Years Out)

  If these fellowships work, what do you see in two years?

  1.  **A "Auditability Hierarchy":** A paper or preprint establishing which metrics are unverifiable without score access. Regulators cite this to demand score escrow.
  2.  **Shift-Aware Guidelines:** Deployment checklists that require a "sensitivity bound" on fairness metrics before a model is moved to a new jurisdiction.
  3.  **Shift in Seminar Discourse:** The CS students stop saying "fairness is impossible" and start saying "fairness is unidentifiable in this setting." The Policy students stop saying "choose your norm" and start saying "here is the normative condition for this constraint."

  ### Part 6: Confidence & Uncertainty Flags

  *   **Confidence in Track 1 (Audibility):** **High.** The math exists (partial identification), it just hasn't been aggressively applied to fairness metrics in the "decision-only" setting.
  *   **Confidence in Track 2 (Shift):** **Medium.** Sensitivity analysis is standard, but interpreting the *fairness* implications of the sensitivity is novel and tricky.
  *   **Confidence in Track 3 (Meta-Criteria):** **Low.** This is the hardest philosophical lift. 10 weeks is very short to produce a robust normative framework.

  **The Claim I Am Least Sure About:**
  I am least sure that **"Decision-Only Auditing" (Track 1)** is tractable enough for a Masters student in 10 weeks. While it requires no compute, deriving tight bounds on unobserved variables (the scores) from observed variables (decisions) can become mathematically intractable very quickly.
  *   *Mitigation:* Scope the project to *binary* decisions and *binary* outcomes first. Do not allow continuous risk scores in the first pass.

  **Reconstruction vs. Extrapolation:**
  *   **Reconstructed:** The existence of the impossibility results (Chouldechova/Kleinberg) and the general problem of distribution shift (Quiñonero-Candela et al.) are established literature.
  *   **Extrapolated:** The specific claim that "Decision-Only Auditing" is the highest-leverage conceptual work for *this specific group* is my own synthesis based on the "no compute" constraint. Most literature assumes score access; I am extrapolating that removing that assumption breaks the deadlock more effectively than addressing feedback loops.

  ### Summary Advice for the Committee
  Don't fund six projects. Fund **two teams of three** (mixed CS/Phil on each team).
  *   **Team A:** Track 1 (Audibility).
  *   **Team B:** Track 2 (Shift Sensitivity).

  This forces the communication you feel is missing. The CS students can't do the math without the Policy students defining what "auditable" means legally; the Policy students can't argue for regulations without the CS students proving what is mathematically visible.

  If you fund six individual projects, they will retreat to their disciplinary silos to finish the work in 10 weeks. If you force collaboration on these specific bottlenecks, you might actually generate the "conceptual work" the mandate asks for.
