answer: |-
  # Seminar Activity: The Council of Auxiliary Hypotheses

  ## 1. Overview and Objectives
  **Session Duration:** 90 Minutes
  **Participants:** 14 Postgraduate Students (Divided into 4 Research Programmes)
  **Facilitator Role:** The Grant Agency (Arbiter of Outcomes and Costs)
  **Learning Objective:** To experientially demonstrate the tension between rejecting a theory upon failed prediction (naive falsification) and preserving a core claim through auxiliary adjustments (the Duhem-Quine problem), leading to the realisation that unrestricted adjustment renders demarcation impossible.

  ## 2. Materials Required
  *   **Four Programme Dossiers** (one per group): Containing the Core Claim, Initial Predictions, and a Score Sheet.
  *   **Nature Deck** (Facilitator only): A set of cards determining the 'Actual Outcome' for each round.
  *   **Trust Tokens** (20 per group): Physical counters representing methodological credibility.
  *   **Voting Cards** (Yes/No): For the Council to decide on accepting auxiliary adjustments.
  *   **Whiteboard/Flipchart:** To track public Prestige Scores.
  *   **The Shadow Ledger** (Facilitator only): A hidden sheet tracking 'Methodological Debt'.

  ## 3. The Research Programmes
  Divide the fourteen students into four groups (two groups of four, two groups of three). Distribute the dossiers. The content is abstract to prevent real-world bias.

  *   **Programme Alpha (The Continuous Field):** *Core Claim:* Reality is composed of seamless, unbroken fields.
      *   *Initial Prediction:* Measurement values will always show smooth gradients.
  *   **Programme Beta (The Discrete Packet):** *Core Claim:* Reality is composed of distinct, indivisible units.
      *   *Initial Prediction:* Measurement values will always show integer steps.
  *   **Programme Gamma (The Oscillating Wave):** *Core Claim:* Reality moves in cyclical rhythms.
      *   *Initial Prediction:* Measurement values will repeat every three intervals.
  *   **Programme Delta (The Entropic Drift):** *Core Claim:* Reality moves towards increasing disorder.
      *   *Initial Prediction:* Measurement variance will increase over time.

  ## 4. Game Rules

  ### The Objective
  Survive three rounds of funding review. Survival requires maintaining **Prestige** (points for correct predictions) and keeping **Trust** (tokens) above zero.

  ### The Cycle (Per Round)
  1.  **Prediction:** Each Programme submits a prediction for the upcoming data set.
  2.  **Revelation:** The Facilitator reveals the 'Actual Outcome' from the Nature Deck.
  3.  **Assessment:**
      *   **Match:** If the prediction matches the outcome, the Programme gains 5 Prestige Points.
      *   **Mismatch:** If the prediction fails, the Programme faces a Crisis.
  4.  **Crisis Management (The Crucial Mechanism):**
      *   Upon a Mismatch, the Programme must choose: **Concede** (admit the Core Claim is flawed) or **Adjust** (propose an Auxiliary Hypothesis).
      *   **If Concede:** The Programme is eliminated from the simulation (simulating theory rejection).
      *   **If Adjust:** The Programme proposes a modification to their experimental conditions or assumptions that explains the failure without changing the Core Claim.
      *   **The Council Vote:** The other three groups vote on whether to accept the Auxiliary. (Majority rules).
      *   **The Cost:** If the Auxiliary is accepted, the Facilitator deducts Trust Tokens.
          *   *Public Rule:* "Adjustments cost Trust."
          *   *Hidden Rule:* The Facilitator deducts 1 Token for 'Testable Auxiliaries' (those that make a new, risky prediction for the next round) and 3 Tokens for 'Untestable Auxiliaries' (those that merely explain the past failure). The Facilitator does not reveal the differential rate until the debrief.

  ### Winning
  At the end of Round 3, the Programme with the highest Prestige survives. However, if any Programme reaches 0 Trust Tokens at any point, they are defunded immediately.

  ## 5. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide groups. Distribute Dossiers and Trust Tokens (10 each). Explain rules strictly as administrative procedure. Do not mention philosophy, Popper, or falsification. Emphasise: "Your goal is to protect your Core Claim." |
  | **10–25** | **Round 1** | **The Optimism Phase.**<br>Facilitator ensures at least one failure per group (using Nature Deck).<br>Students will likely propose clever Auxiliaries. Council usually votes 'Yes' to keep competitors in the game.<br>Facilitator applies Trust deductions silently according to the Hidden Rule. |
  | **25–40** | **Round 2** | **The Strain Phase.**<br>Increase failure rate (two failures per group).<br>Students must stack Auxiliaries upon Auxiliaries.<br>Trust Tokens begin to deplete noticeably for those making 'lazy' adjustments.<br>Facilitator remains neutral but strict on token deduction. |
  | **40–55** | **Round 3** | **The Crisis Phase.**<br>High failure rate. Groups realise that to survive, they must make their theories so flexible they predict nothing, OR they must risk elimination by refusing to adjust.<br>Some groups may run out of Trust Tokens.<br>End the simulation abruptly at 55 minutes. |
  | **55–65** | **Reaction** | **Silent Reflection.**<br>Ask groups to write down: 1) Why did you keep your Core Claim? 2) At what point did your theory stop feeling 'scientific'? 3) Was the voting fair? |
  | **65–90** | **Debrief** | **Mapping the Experience.**<br>Facilitator reveals the Shadow Ledger and introduces the philosophical concepts (see Section 7). |

  ## 6. Facilitator Interventions
  You must maintain the simulation's tension. Do not solve their problems, but prevent total collapse.

  **Scenario A: Unanimous Rejection (The Naive Trap)**
  *   *Observation:* The Council votes 'No' on all Auxiliaries. Programmes are being eliminated in Round 1.
  *   *Intervention:* Remind them of the history of science. "In the real world, Newtonian physics survived anomalies for decades. If you reject too quickly, you risk killing a progressive theory. Consider the long-term value of stability."
  *   *Goal:* Encourage them to allow some Auxiliaries to keep the game going.

  **Scenario B: Unanimous Permissiveness (The Relativist Trap)**
  *   *Observation:* The Council votes 'Yes' on everything. No one loses Trust. Everyone survives easily.
  *   *Intervention:* "Taxpayers are questioning the value of this research. If every theory can explain every outcome, why fund any of them? Scrutinise the *risk* involved in their adjustment."
  *   *Goal:* Encourage them to penalise adjustments that do not generate new predictions.

  **Scenario C: The 'God Complex'**
  *   *Observation:* A group claims their Core Claim explains *both* contradictory outcomes (e.g., "It increases AND decreases").
  *   *Intervention:* "That is not an Auxiliary; that is a tautology. This costs double Trust." (Enforce the Hidden Rule strictly here).

  ## 7. The Debrief: Mapping the Logic
  *Do not mention names (Popper, Lakatos, Duhem) until the final 10 minutes.*

  ### Step 1: The Experience (10 Minutes)
  Ask the groups to share their frustration.
  *   "Who felt their theory became meaningless by Round 3?"
  *   "Who felt they were punished for being honest about a failure?"
  *   Reveal the **Shadow Ledger**. Show how groups that survived did so by accumulating 'Methodological Debt' (Untestable Auxiliaries). Explain that in a hypothetical Round 4, they would have all gone bankrupt.

  ### Step 2: The Logical Structure (10 Minutes)
  Draw a triangle on the board: **Core Claim**, **Auxiliary Hypothesis**, **Observation**.
  *   **Round 1 (Naive Falsification):** When you failed, you felt the urge to reject the Core Claim immediately. This mirrors the logical ideal that *If Theory implies Observation, and Observation is False, Theory is False.*
  *   **Round 2 & 3 (The Protective Belt):** You realised you could save the Core Claim by blaming the Auxiliaries (the equipment, the conditions, the background assumptions).
  *   **The Realisation:** By Round 3, you discovered that *any* Core Claim can be saved if you are allowed enough Auxiliaries. This means a failed prediction does not logically force you to abandon a theory.

  ### Step 3: The Philosophical Naming (5 Minutes)
  Now, introduce the terminology.
  *   **The Demarcation Problem:** The struggle you faced in deciding which programmes were 'science' and which were 'magic' by Round 3.
  *   **Falsifiability:** The criterion you tried to enforce in Round 1.
  *   **The Duhem-Quine Thesis:** The realisation that hypotheses cannot be tested in isolation, only as a bundle (Core + Auxiliaries).
  *   **Conventionalism:** The strategy of defining away counter-evidence through definitions (what you did in Round 3).

  ### Step 4: Limitations and Sociology (5 Minutes)
  Be frank about what the simulation could not reproduce.
  *   **The 'Ad Hoc' Distinction:** In the game, I (the Facilitator) arbitrarily decided which Auxiliaries were 'testable'. In real science, this is not decided by a referee but by the community over time. An adjustment that looks 'ad hoc' today (e.g., the existence of Neptune to save Uranus's orbit) may be confirmed tomorrow.
  *   **Sociological Pressure:** In the game, you protected your Core Claim to win points. In reality, scientists protect paradigms because of career investment, textbook training, and world-view commitment.
  *   **Progressive vs. Degenerating:** The simulation ended before you could see which Auxiliaries actually led to new discoveries. A theory is not defined by a single moment of adjustment, but by whether those adjustments lead to novel predictions over time.

  ### Closing Statement
  "Today you felt the impossibility of drawing a sharp line between science and non-science using logic alone. You discovered that falsification is not a single event, but a historical process. The difficulty you felt in Round 3 is the central engine of modern philosophy of science."

  ## 8. Programme Score Sheet (Template)

  | Round | Prediction Made | Actual Outcome | Match? (Y/N) | Action Taken (Concede/Adjust) | Trust Cost (Facilitator Only) | Prestige Points |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | | | | | | |
  | **2** | | | | | | |
  | **3** | | | | | | |
  | **TOTAL** | | | | | **Final Trust:** | **Final Prestige:** |

  *(Note: The 'Trust Cost' column is left blank for the Facilitator to fill in secretly during the session, or filled in publicly only with the total deduction, hiding the rate.)*

  ## 9. Nature Deck Instructions (Facilitator)
  To ensure the pedagogical arc, do not shuffle these randomly. Play them in order.

  *   **Round 1 Outcomes:**
      *   Alpha: Smooth Gradient (Success)
      *   Beta: Integer Step (Success)
      *   Gamma: Non-Repeating Value (Failure)
      *   Delta: Decreasing Variance (Failure)
  *   **Round 2 Outcomes:**
      *   Alpha: Sudden Spike (Failure)
      *   Beta: Fractional Value (Failure)
      *   Gamma: Repeating Value (Success)
      *   Delta: Increasing Variance (Success)
  *   **Round 3 Outcomes:**
      *   All Programmes: Contradictory Data (e.g., Values are both Smooth and Discrete simultaneously).
      *   *Note:* This final outcome is logically impossible for any single Core Claim to satisfy without a radical, theory-breaking Auxiliary. This forces the Round 3 crisis.

  ## 10. Contingency: If a Group Collapses Early
  If a group loses all Trust Tokens in Round 1:
  *   **Do not eliminate them.**
  *   **Intervention:** "The Agency has decided to offer a Probationary Grant. You may continue, but your Trust starts at 5, not 10."
  *   **Reasoning:** You need all four voices in the debrief to compare strategies. Total elimination reduces the data set for the final discussion.

  ## 11. Contingency: If They Refuse to Adjust
  If a group chooses to 'Concede' in Round 1:
  *   **Intervention:** "The Core Claim is your tenure. If you concede the Core, you are out of the simulation. You must propose an Auxiliary."
  *   **Reasoning:** To demonstrate the *temptation* to protect the core, they must be forced to engage in the protective behaviour.

  ## 12. Final Facilitator Notes
  *   **Tone:** Bureaucratic and cold. You are the 'Agency', not the teacher.
  *   **Silence:** If students ask, "Is this about Popper?", reply: "This is about funding allocation. Focus on your predictions."
  *   **British English:** Ensure all verbal instructions use 'programme', 'centre', 'modelling', 'scrutinise', and 'defence'.
  *   **Timekeeping:** Be ruthless with the 90-minute limit. The debrief is where the learning happens; do not let the game overrun.
