  **Scenario**
  Elena, a senior actuary, is reviewing a risk model $M$ at her workplace. Let $H$ be the proposition "Model $M$ is arbitrage-free." At $t_0$ (9:00 AM), Elena has the printed derivation of $M$ on her desk but lacks the time to verify the complex calculus; based on the junior team's reputation, her credence is $C_0(H) = 0.60$. She knows with certainty that at $t_1$ (5:00 PM) she will have completed a line-by-line audit of the derivation. She is also certain that her audit is reliable and that, upon completion, her credence will rise to $C_1(H) = 0.95$. Since she is certain at $t_0$ that $C_1(H) = 0.95$, her conditional credence is simply her current unconditional credence: $C_0(H \mid C_1(H) = 0.95) = C_0(H) = 0.60$. Thus, $0.60 \neq 0.95$.

  **Constraint Discharge**
  (a) **Rationality:** The future self is not defective; the credence increase results from a sound, completed mathematical verification, not bias or impairment.
  (b) **Memory/Evidence:** There is no memory loss; the physical derivation is present at $t_0$, and no non-indexical evidence is discarded.
  (c) **Anticipation:** She anticipates the *process* of verification, but not the *content* of the verified steps, which remains cognitively inaccessible at $t_0$.
  (d) **Causality:** Her credence does not make $H$ true; the model's arbitrage status is mind-independent.
  (e) **Proposition Stability:** $H$ concerns an objective mathematical property of the model, which does not shift in content between 9:00 AM and 5:00 PM.
  (f) **Closest Violation:** Constraint (c) comes closest, as one might argue the verified steps are "evidence" available at $t_0$; however, evidence requires cognitive access for conditioning, which is physically present but epistemically inaccessible until the work is done.

  **Analysis: The Diachronic Dutch Book**
  The standard argument constructs a book as follows: (1) At $t_0$, a bookie sells Elena a ticket paying $\$1$ if $H$ (conditional on $C_1(H)=0.95$) for her price of $\$0.60$. (2) At $t_1$, if $C_1(H)=0.95$, the bookie buys a ticket from Elena paying $\$1$ if $H$ for her price of $\$0.95$. If $H$ is true, Elena pays $\$0.60$ at $t_0$, receives $\$0.95$ at $t_1$, and pays $\$1.00$ on the second ticket, netting a loss of $\$0.65$. If $H$ is false, she loses the $\$0.60$ stake but keeps the $\$0.95$, netting $\$0.35$. While the book is mathematically valid, it does not land on a rational agent: Elena accepts the $t_0$ bet based on $t_0$ access and the $t_1$ bet based on $t_1$ access. Her reply is that she is not a single synchronic agent across time but a temporally extended one whose *epistemic access* to the same physical evidence changes. The loss is not a sure loss of *utility* she can foresee and avoid, because avoiding it would require her to have $t_1$ knowledge at $t_0$, which is impossible.

  **Conclusion**
  1.  **Feature doing the work:** The divergence between *physical possession* of evidence and *cognitive access* to its justificatory force.
  2.  **If removed:** If Elena could process the derivation at $t_0$ as easily as at $t_1$, her $C_0$ would equal $0.95$, satisfying Reflection.
  3.  **Strongest Reply:** A Reflection defender must restrict the principle to "Ideal Agents" with no cognitive processing limitations; the cost is rendering the principle inapplicable to human rationality, reducing it to a constraint on logical omniscience rather than diachronic coherence.
