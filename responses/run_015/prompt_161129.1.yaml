answer: |-
  Hi everyone, following up on our Slack thread and the request that I draft a proposal for our payout rule ahead of the April 14 meeting. I have spent the last week trying to steelman both sides of this debate because I think we are all looking at the same math but weighting the variables differently. The core tension is between maximizing expected cause units in a single year versus maximizing expected cause units over the remaining seven years of our mandate. My colleagues who advocate for betting large are correct that our speculative grants have a positive expected value of roughly 3x, and they are also correct that our ruin condition is not a true zero. If we drop below the $3 million threshold, the fund sunsets and the remaining capital is deployed at 0.05 efficiency, which is bad but not worthless. In a one-off scenario, or if we had no capacity constraints, maximizing expected value would indeed dictate that we bet as much as possible, every time. The logic is that the massive upside of a 30x return dominates the downside of a 90 percent loss, especially when the downside still retains 5 percent value.

  However, that expected value argument breaks down when you introduce the time horizon and the absorptive capacity of the Core Program. We are not playing a single hand; we are playing a sequence of seven hands, and we are capped at spending $1.2 million per year on safe grants. This cap creates a diminishing marginal utility for money that the plain expected value calculation ignores. If we bet aggressively and hit a 30x winner in year one, we generate more capital than we can possibly deploy through the Core Program before our ten-year mandate expires. That excess capital effectively becomes worthless at year ten, meaning the upside is capped while the downside is not. Furthermore, hitting the $3 million floor does not just reduce efficiency; it terminates our ability to make speculative grants entirely. It kills the option value of future years. By betting too large, we risk triggering the sunset clause early, which prevents us from compounding our advantage over the full seven-year runway. The goal is not to maximize the value of the fund in a vacuum, but to maximize the integral of high-efficiency spending over time.

  Therefore, I am recommending a dynamic allocation rule that ties our speculative stake to our distance from the safety floor, rather than a fixed percentage of total balance. Specifically, I propose we allocate 20 percent of the balance exceeding $4.5 million to speculative grants each spring, with a hard cap of $2 million per year on speculative stakes. Any remaining capital goes to the Core Program up to its $1.2 million absorbptive limit, with the rest rolling over. If the total balance drifts down toward $4.5 million, our speculative stake automatically shrinks, reaching zero if we hit that threshold, which keeps us safely above the $3 million sunset clause even after a losing year. If the balance drifts up due to wins, the stake increases but is constrained by the $2 million cap to prevent generating unspendable windfalls that we cannot deploy before the mandate ends. We should revisit this rule annually in April, adjusting the $4.5 million buffer only if our estimate of the Core Program's absorptive capacity changes.

  This approach respects the expected value argument by keeping us in the game for speculative grants every year, but it prioritizes survival and deployability over raw expectation. It acknowledges that a fund that sunsets in year three cannot capture the value of a win in year seven. It also acknowledges that a fund that grows to $50 million cannot spend that money effectively within the remaining timeline. By smoothing our exposure, we maximize the probability that we remain active and efficient for the full mandate duration, which I believe yields a higher median outcome and a more robust expected value over the full seven years than a bet-the-farm strategy.

  I am about 75 percent confident in this recommendation as the best balance of risk and reward given our current constraints. The single claim I am least sure of is the valuation of the sunset scenario at 0.05 cause units per dollar. We derived that from the general-purpose community foundation's historical data, but if their actual efficiency is higher, say 0.1 or 0.2, the penalty for hitting the floor is less severe, which would theoretically allow for more aggressive betting. Conversely, if their efficiency is lower, the floor is deadlier than we think. I think 0.05 is the right central estimate, but it is the softest number in our model, and if anyone has better data on the foundation's actual impact metrics, that could shift the optimal allocation fraction.
