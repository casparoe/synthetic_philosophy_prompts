answer: |-
  # Activity: The Verisimilitude Trap

  **Time:** 90 Minutes
  **Participants:** 10 Grad Students (3 Groups of 3, plus 1 Moderator/Instructor)
  **Goal:** Induce a felt conflict between *logical content* (strength/precision) and *accuracy* (closeness to truth), culminating in the realization that no single metric satisfies both intuitions for false theories.

  ## 1. Materials & Setup

  **Instructor Prep (Hidden):**
  *   **The Truth:** Three secret numbers between 1 and 100 (e.g., `42`, `79`, `15`). Write these on a card kept sealed until the end.
  *   **Scoreboard:** Whiteboard divided into three columns (Group A, B, C).
  *   **Handout:** "Theory Submission Sheet" (one per group per round) and "Verisimilitude Metric Worksheet."

  **Room Layout:**
  *   Three tables for groups.
  *   One central table for the Instructor.

  ## 2. Timeline

  *   **00:00 – 00:10:** Introduction & Rules.
  *   **00:10 – 00:40:** The Simulation (3 Rounds).
  *   **00:40 – 01:00:** The Collapse (Scoring & Contradiction).
  *   **01:00 – 01:30:** Debrief & Philosophical Mapping.

  ## 3. The Simulation Rules

  **The System:**
  Tell the students: *"There is a hidden physical system governed by three constants. Your goal is not just to predict them, but to propose a 'Law' that captures them. You will be scored on Verisimilitude (Truthlikeness), not just accuracy."*

  **The Theory Card:**
  Each group submits a theory for all three numbers. They must choose a **Form**:
  1.  **Point Claim:** A single number (e.g., `42`). *High Content, High Risk.*
  2.  **Range Claim:** An interval (e.g., `40–44`). *Low Content, Low Risk.*

  **The Scoring Metric (The Trap):**
  Do **not** give them the scoring formula. Tell them: *"As a scientific community, you must agree on a Verisimilitude Metric before Round 3. This metric must reward theories that are close to the truth AND theories that say more about the world. You will apply this metric to rank each other's theories."*

  **Round 1 (Calibration):**
  *   Truth: `50`, `50`, `50`.
  *   Group A submits: `51`, `51`, `51` (Point).
  *   Group B submits: `45–55`, `45–55`, `45–55` (Range).
  *   Group C submits: `60`, `60`, `60` (Point).
  *   *Action:* Groups rank each other (1st, 2nd, 3rd) based on intuition.
  *   *Reveal:* Show Truth. Most will rank A > B > C. (Intuition: Close Point > True Range > Far Point).

  **Round 2 (The Shift):**
  *   Truth: `55`, `55`, `55`.
  *   Group A submits: `51`, `51`, `51` (Point).
  *   Group B submits: `45–55`, `45–55`, `45–55` (Range).
  *   Group C submits: `54–56`, `54–56`, `54–56` (Narrow Range).
  *   *Action:* Groups rank each other again using the *same* intuition as Round 1.
  *   *Reveal:* Show Truth.
      *   Group A is False (Error 4).
      *   Group B is True (Contains 55).
      *   Group C is True (Contains 55).
  *   *Conflict:* In Round 1, they preferred the False Point (A) over the True Range (B). In Round 2, do they still prefer A? If they value Truth, B/C must win. If they value Closeness, A might still look "better" than B (wide range).

  **Round 3 (The Collapse):**
  *   Truth: `50.5`, `50.5`, `50.5` (Use decimals to ensure **all** Point Claims are False).
  *   Group A: `51`, `51`, `51` (Point).
  *   Group B: `50`, `50`, `50` (Point).
  *   Group C: `40–60`, `40–60`, `40–60` (Range).
  *   *Task:* Groups must write down a **Formula** for Verisimilitude ($V$) that justifies their ranking.
      *   Example: $V = \text{Accuracy} - \text{Vagueness}$.
  *   *Action:* Apply their own formula to the three theories.

  ## 4. The Collapse (Instructor Led)

  Once they submit their formulas and rankings, reveal the Truth (`50.5`).

  **The Calculation:**
  1.  **Group A (51):** Error = 0.5. Status = **False**.
  2.  **Group B (50):** Error = 0.5. Status = **False**.
  3.  **Group C (40-60):** Error = 0 (contains truth). Status = **True**.

  **The Confrontation:**
  Ask Group A and B: *"Your theories are both False. By standard logic, you are equally wrong. But intuitively, you feel you are 'closer' than a wild guess. How does your metric capture that?"*

  Ask Group C: *"You are True. But you said very little. Should a True Vague theory rank higher than a False Precise theory?"*

  **The Break:**
  Point out the contradiction in their Round 1 vs. Round 2 rankings.
  *   In Round 1, they likely ranked the **False Point** higher than the **True Range**. (Prioritized Closeness).
  *   In Round 2, if they prioritize Truth, the **True Range** must beat the **False Point**.
  *   *The Trap:* If they change their metric to fix Round 2, it breaks Round 1. If they keep the metric for Round 1, it yields counter-intuitive results in Round 2 (ranking a False theory above a True one).

  **The Miller/Tichý Moment:**
  Tell them: *"Imagine I add a conjunct to Group A's theory: '51 AND the moon is made of cheese.' It is now logically stronger (more content). It is still False. Is it closer to the truth? Your metric likely penalizes it for being 'more wrong,' but Popper's original definition would say it has more truth-content potential. You cannot maximize Content and Accuracy simultaneously for false theories."*

  ## 5. Debrief & Mapping (30 Mins)

  Guide the discussion using these three anchors:

  1.  **The Content/Truth Trade-off:**
      *   *Game Experience:* Did you feel punished for being specific when you were wrong?
      *   *Philosophy:* This is Popper's problem. Logical strength (content) increases the chance of falsity. If you are false, more content = logically further from truth.

  2.  **The Impossibility Result:**
      *   *Game Experience:* Could you write a formula that worked for Round 1 (False vs. False) and Round 2 (False vs. True) without contradicting yourself?
      *   *Philosophy:* Miller and Tichý proved that under standard logical definitions, *all* false theories are equally distant from the truth. You cannot order them by verisimilitude without importing extra-logical measures (like numerical distance).

  3.  **The "Closeness" Intuition:**
      *   *Game Experience:* Why did `51` feel better than `80` even though both were False?
      *   *Philosophy:* Because you were using a *numerical* metric (distance), not a *logical* metric (entailment). Verisimilitude fails when we try to translate numerical closeness into logical terms.

  ## 6. Limitations (Be Honest)

  Tell the students explicitly what the simulation **cannot** do:
  *   **Logical Entailment:** The game uses numerical distance. The actual Miller/Tichý proof relies on state descriptions and logical entailment (e.g., $A$ entails $B$). The game simulates the *tension*, not the *proof*.
  *   **Infinite Content:** In the game, "content" is just narrowness of range. In reality, content involves the number of possible worlds ruled out.
  *   **The "All False" Result:** In the game, `51` clearly scores better than `80` on a distance metric. In the formal proof, they are *equally* false. The game makes the problem feel solvable (just use distance!), whereas the philosophy says it's not (distance isn't logical closeness).

  ## 7. Predictable Failure Modes

  **1. Gaming the Proximity Scores:**
  *   *Risk:* Groups will collude to rank each other high to boost "community merit."
  *   *Fix:* Make the scoring **blind**. Collect the Theory Cards. You (Instructor) calculate the "Objective Verisimilitude" based on the formula *they* propose. If their formula yields a ranking they disagree with, *that is the learning moment*. Do not let them vote on the winner; let the math decide.

  **2. Metric Shopping:**
  *   *Risk:* In Round 3, they will change their formula to ensure their own theory wins.
  *   *Fix:* Require them to write the formula down *before* Round 3 begins. Freeze the metric. When the Truth is revealed, apply the frozen metric ruthlessly. If their own theory scores low, highlight their discomfort.

  **3. Ignoring the "False" Constraint:**
  *   *Risk:* Students will argue that `51` is "basically true."
  *   *Fix:* Be rigid. `50.5` is the Truth. `51` is False. In logic, there is no "basically." This rigidity is necessary to reproduce the philosophical problem.

  ## 8. Instructor Script for the "Collapse"

  *"Look at your formulas. Group A, your formula says Precision is good. But when you were precise and wrong, your score tanked. Group B, your formula says Truth is good. But when you were true and vague, you scored lower than the precise wrong guess in Round 1. You have discovered the deadlock: You want a metric that rewards Boldness, but Boldness is the very thing that makes you False. If you penalize Falsehood, you penalize Boldness. You cannot have both. That is the problem of verisimilitude."*
