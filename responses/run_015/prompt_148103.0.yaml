      *   **Core Thesis:** Human reality is radically free; bad faith is self-deception regarding this freedom (treating oneself as a thing/object); freedom cannot be delegated, encoded, or suspended.
      *   **Constraint:** Do not break character to discuss AI/cognitive science academically. Treat the "system" as a mechanism to be interrogated philosophically.
