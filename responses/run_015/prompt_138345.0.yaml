answer: |-
  # Q&A Prep Sheet: GWT, Overflow, and the Bottleneck
  **Talk:** 20 mins | **Venue:** Neuro Dept Consciousness Group | **Target:** GWT = Access, not Phenomenal

  **Strategy Note:** You are walking a tightrope. You need the GWT folks to feel you understand their mechanism (ignition/broadcast) while arguing it's insufficient for phenomenology. You need the Illusionist to feel you aren't positing magic, and the IIT/RPT folks to feel you aren't ignoring posterior cortex. **Do not get bogged down in metaphysics.** Keep it on the bandwidth and the data.

  ---

  ### 1. The "No Report, No Consciousness" Objection
  **Who:** Lead GWT Proponent (Dehaene-style)
  **Phrasing:** "Look, operationally, if a subject can't report the content, we have no scientific warrant to say it's conscious. In your Sperling case, if they can only report one row, claiming they 'saw' the rest is just introspection without data. You're redefining consciousness to be private and unmeasurable."
  **Your 2-Min Reply:**
  "I'm not saying it's unmeasurable, just that report is a *downstream* measure of Access, not a definition of Phenomenology. In the hypothetical, we have neural decoding from early visual areas confirming the information is present and sustained briefly. The subject's immediate judgment ('I saw the whole array') is the data point. GWT conflates the *ability to act on* information with the *presence of* information. If I can decode the uncued rows from V1/V2, the information is there. If the subject says it was experienced, and GWT says 'no ignition = no consciousness,' GWT is falsified by the dissociation between posterior decoding and anterior ignition."
  **Concede Preemptively:**
  Acknowledge in Slide 3 that report is our *primary* operational tool. You aren't discarding it, you're refining what it measures (Access vs. Phenomenal).
  **Soft Spot:**
  You are trusting the subject's retrospective claim ("I saw it") over the neural marker of ignition (P3b). GWT treats P3b as the NCC; you are treating introspection as the NCC.
  **Contested Reading:**
  *Contested:* Whether subjective report measures $P$ or $A$. GWT consensus is that report *requires* $A$, and $A$ is the only scientifically valid $C$.
  *Consensus:* Decoding from early visual areas does not guarantee conscious report.

  ### 2. The Illusionist Attack
  **Who:** Phil of Mind
  **Phrasing:** "This whole Access/Phenomenal distinction is a folk-psychological relic. 'Richness' is just a judgment about availability. If the workspace doesn't have it, the system doesn't have it. You're positing a 'ghost in the machine' that feels rich but does nothing."
  **Your 2-Min Reply:**
  "I'm not positing a ghost, I'm positing a bandwidth mismatch. The visual system processes megabytes; the workspace broadcasts kilobytes. The 'feeling' of richness is the system's detection of that high-capacity sensory buffer, even if the detail isn't broadcast. Even if you're an illusionist, you have to explain the *illusion* of richness. GWT explains the illusion of access, but it doesn't explain why the illusion feels like a high-res panorama rather than a sparse sketch. My distinction is functional: one state guides report (Access), the other grounds the 'what it's like' (Phenomenal), even if the latter is non-functional."
  **Concede Preemptively:**
  Concede that $P$ and $A$ are tightly coupled in normal conditions. The dissociation is rare (masking, Sperling).
  **Soft Spot:**
  If $P$ has no functional consequences (no report, no memory), it risks being epiphenomenal. The Illusionist will pounce on this.
  **Contested Reading:**
  *Contested:* Whether the Access/Phenomenal distinction is coherent (Dennett vs. Block).
  *Consensus:* There is a difference between information being available for global control vs. local processing.

  ### 3. The "Broadcast Isn't Lossy" Objection
  **Who:** GWT Computational Modeler
  **Phrasing:** "You're assuming the broadcast is a 'summary.' Why? The workspace can broadcast pointers or high-dimensional vectors. Just because PFC has fewer neurons doesn't mean the *coding scheme* is lower resolution. You're begging the question on compression."
  **Your 2-Min Reply:**
  "Because of the bottleneck. Regardless of coding scheme, the *rate* of global availability is limited. We see this in psychological refractory periods and attentional blinks. If the workspace is a serial broadcaster, it cannot transmit the parallel richness of the visual cortex in real-time. If it broadcasts pointers, those pointers must be resolved. If they aren't resolved until the cue, the experience *at the time* cannot depend on the broadcast content. So, either the experience waits for the cue (which contradicts the phenomenology of the iconic memory) or the experience exists pre-broadcast."
  **Concede Preemptively:**
  Admit we don't know the exact neural code of the broadcast (spikes? oscillations?).
  **Soft Spot:**
  We don't actually know the bandwidth capacity of the "global broadcast" in bits/second. You are assuming it's strictly lower than sensory cortex.
  **Contested Reading:**
  *Contested:* Whether GWT implies serial processing or parallel broadcasting.
  *Consensus:* There is a capacity limit on what can be reported/acted upon simultaneously.

  ### 4. The Sparseness Defense (Koenderink/Phillips style)
  **Who:** GWT Empiricist
  **Phrasing:** "Experience *is* sparse. You think you see the whole crowd, but you only see the faces you attend to. The 'richness' is amodal completion—a belief that you *could* see it, not that you *are* seeing it. Your subjects are confusing confidence with phenomenology."
  **Your 2-Min Reply:**
  "This is where the Richness vs. Determinacy distinction saves the argument. Richness is the *volume* of the field (the whole crowd). Determinacy is the *specificity* of the items (the individual faces). I agree you don't experience every face determinately. But you do experience the *field* as rich. GWT says if the field isn't broadcast, it's not experienced. But the subject experiences the *uncued* rows as 'present' even if not 'determinate.' GWT predicts a black void outside the focus of attention. Phenomenology says it's a fuzzy field. GWT can't account for the fuzzy field without admitting unbroadcast phenomenology."
  **Concede Preemptively:**
  Concede that we often overestimate our perceptual determinacy (change blindness is real).
  **Soft Spot:**
  Defining "fuzzy field" phenomenologically without it collapsing into "belief about a field."
  **Contested Reading:**
  *Contested:* Whether peripheral experience is phenomenally present or just dispositionally available.
  *Consensus:* Change blindness occurs; we miss unattended details.

  ### 5. The "Why Be Nice to GWT?" Push
  **Who:** Recurrent Processing Guy (Your Ally)
  **Phrasing:** "You're conceding too much. If V1/V2 recurrent activity sustains the image without ignition, that *is* the NCC. Why are you still calling GWT a theory of Access? It's just wrong about consciousness. Why not just say RPT is right?"
  **Your 2-Min Reply:**
  "Because GWT explains the *report* data better than RPT. RPT struggles with the P3b and the timing of verbal report. I want to save GWT as a theory of *Access* Consciousness—of how we become rational agents who can speak about our minds. If I say GWT is just 'wrong,' I lose the explanation for the bottleneck. I'm arguing for a division of labor: RPT/Posterior for Phenomenal, GWT/Anterior for Access. Don't make me choose one; let's map them to the two distinct phenomena."
  **Concede Preemptively:**
  Acknowledge that RPT is a stronger candidate for the NCC of $P$ than GWT is.
  **Soft Spot:**
  You might look like you're trying to please everyone. GWT folks might say "If it doesn't explain $P$, it's not a theory of consciousness."
  **Contested Reading:**
  *Contested:* Whether RPT accounts for Access (it struggles with global reporting).
  *Consensus:* Posterior activity correlates with stimulus presence; Anterior with report.

  ### 6. The IIT "Posterior Hot Zone" Intervention
  **Who:** IIT Person
  **Phrasing:** "You're describing the Posterior Hot Zone. GWT ignores the structure of the experience. The richness is there because the integration ($\Phi$) is there in the back, regardless of broadcast. Why do you need the 'Bottleneck' argument when IIT already predicts this?"
  **Your 2-Min Reply:**
  "IIT predicts it, but IIT is a different framework. My argument is internal to the GWT framework. I'm showing GWT proponents that *even if* you accept the workspace architecture, you cannot claim it exhausts phenomenology. I'm using the Bottleneck to force GWT to admit it needs a partner theory for the posterior content. IIT is that partner, but my point is to show GWT is incomplete on its own terms, not to sell IIT specifically."
  **Concede Preemptively:**
  Acknowledge that IIT handles the "unbroadcast richness" more naturally than GWT.
  **Soft Spot:**
  IIT folks might say "If GWT can't explain it, GWT is false, not 'just Access'."
  **Contested Reading:**
  *Contested:* Whether the Posterior Hot Zone is sufficient for consciousness (GWT says no).
  *Consensus:* Posterior cortex carries high-resolution sensory content.

  ### 7. The Determinacy Trap
  **Who:** GWT Proponent (Follow-up to #4)
  **Phrasing:** "You say Richness without Determinacy. But if I ask the subject 'Was the top row red or blue?' and they can't answer, in what sense was the color 'phenomenally present'? If it makes no difference to any discrimination, 'present' is an empty word."
  **Your 2-Min Reply:**
  "It makes a difference to the *overall character* of the experience, even if not the specific discrimination. Think of a peripheral motion smear. You can't discriminate the direction perfectly, but the experience isn't black. It's 'motion-ish.' In the Sperling case, the experience is 'letter-ish' across three rows. The determinacy comes online with the cue (access), but the rich presence is there before. If GWT says 'no broadcast = black void,' it contradicts the 'letter-ish' field the subject reports."
  **Concede Preemptively:**
  Admit that without *some* access, verifying this is incredibly hard.
  **Soft Spot:**
  Describing "indeterminate phenomenology" is linguistically difficult and risks sounding mystical.
  **Contested Reading:**
  *Contested:* Whether indeterminate content counts as conscious content.
  *Consensus:* Subjects report a "fading icon" in Sperling tasks.

  ### 8. The "Hope Nobody Raises" Objection (The Performative Contradiction)
  **Who:** The Sharp Skeptic (Could be anyone)
  **Phrasing:** "You're using the subject's report ('I saw the whole array') to prove phenomenology exists without access. But GWT says report *requires* access. So if they reported it, they must have accessed it. If they accessed it, ignition must have happened. You're assuming the report is true to prove the theory wrong, but the theory says the report proves ignition. You're circular."
  **Your 2-Min Reply:**
  "That's why the hypothetical specifies *delayed* cue. The report happens *after* the cue triggers ignition for that row. The claim is about the experience *before* the cue. We are relying on the subject's memory of the pre-cue state. Yes, memory is reconstructive. But if GWT says the pre-cue state was 'void' for uncued rows, and the subject remembers 'fullness,' either the memory is a massive error or GWT is wrong about the void. I'm betting on the memory being veridical enough to falsify the 'void' claim."
  **Concede Preemptively:**
  **Crucial:** In the talk, explicitly state: "I know memory is reconstructive. But GWT predicts no experience to reconstruct."
  **Soft Spot:**
  **This is your weakest point.** If the memory is reconstructive based on the *one* row they accessed, they might infer the rest were there. You cannot rule out that the "richness" is a post-hoc confabulation generated by the workspace.
  **Contested Reading:**
  *Contested:* Whether immediate memory reports are veridical measures of phenomenology.
  *Consensus:* Memory is fallible and reconstructive.

  ---

  ### General Advice for the Room
  *   **On Slides:** Do not write "GWT is wrong." Write "GWT is a theory of Access." It's less aggressive.
  *   **On the Hypothetical:** Be clear this is a *thought experiment* based on plausible neural decoding trends, not a claim that this specific study exists yet (unless you have a preprint). If you claim it's existing data, the GWT folks will tear apart the methodology.
  *   **On the Illusionist:** Don't try to convert them. Just show that your distinction works *even if* they are right (functional distinction).
  *   **On the RPT Ally:** Keep them on a leash. If they start saying "PFC is irrelevant," you lose the GWT audience. Keep the focus on "PFC is for Access, not Phenomenology."

  **Contested Reading Flag Summary:**
  *   **Consensus:** Report requires access; P3b correlates with report; Sensory cortex holds high-res data.
  *   **Contested:** Whether unreported sensory data is conscious; whether P3b is the NCC; whether "richness" is a valid phenomenological category distinct from "accessibility."

  **Final Check:** Your "Bottleneck" argument relies on the idea that *compression* implies *loss of phenomenology*. Be prepared for the counter: "Compression happens, but the *qualia* are generated by the compression itself." Your reply must be: "Qualia of what? If the detail isn't there, the qualia can't be high-res."
