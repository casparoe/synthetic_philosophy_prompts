prompt: |-
  I've talked myself into a view and I want you to try to knock it down. Here it is: epistemic modesty just is deference to the outside view. Being modest about your own judgment means giving more weight to what happened to other people in your reference class than to your inside-view story about why your case is special, and any "modesty" that doesn't cash out in base rates is just a feeling. The strong version: your inside view is evidence about your psychology, not about the world.

  What would count against that? I'm curious whether the reference class is itself choosen by inside-view judgment — if so, is that a fatal circularity or just a harmless recursion? And is there a case where taking the outside view is the worse epistemic move, where the inside view has actually earned its weight? What does my view predict that a boring old calibration story doesn't? Rank the objections by how much they should really move me, say which ones a defender of the view would just concede, and tell me straight if I've defined modesty so loosely that nothing could count against it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** Epistemic modesty *just is* deference to the outside view (base rates/reference classes).
      *   **Sub-claim 1:** Inside-view stories about why "my case is special" are psychological evidence, not evidence about the world.
      *   **Sub-claim 2:** Any "modesty" not cashing out in base rates is just a feeling.
      *   **User's Self-Critique/Questions:**
          *   Isn't the reference class chosen by inside-view judgment? (Circularity/Recursion?)
          *   Are there cases where the outside view is worse? (Inside view earns its weight?)
          *   What does this predict that standard calibration doesn't?
          *   Is the definition too loose (unfalsifiable)?
      *   **Task:** Knock the view down (or stress-test it), rank objections by strength, note concessions, and assess falsifiability.

  2.  **Deconstruct the Argument:**
      *   *Strengths:* It aligns with superforecasting literature (Tetlock), Kahneman/Lovallo's "Inside/Outside View," and rationalist community norms (Eliezer Yudkowsky, Scott Alexander). It combats overconfidence and special pleading.
      *   *Weaknesses:* It risks infinite regress (how do you pick the reference class?), it might undervalue unique information, and it conflates *updating* with *deference*.

  3.  **Brainstorm Objections:**

      *   *Objection 1: The Reference Class Problem.* To use an outside view, you need a reference class. Choosing the class requires inside-view judgment about relevance. If I'm predicting a startup success, is the class "all startups," "tech startups," "startups by YC founders," or "startups by founders with my specific background"? The choice determines the base rate. This seems circular.
      *   *Objection 2: Unique Evidence/New Mechanisms.* Sometimes the inside view reveals a *causal mechanism* that breaks the base rate. Example: A new medical treatment. The base rate of recovery for this disease is 10%. The inside view (biology/chemistry of the drug) suggests 90%. Deferring to the outside view here is anti-science.
      *   *Objection 3: Expertise and Skill.* Experts often beat base rates because they have inside-view information that *is* about the world, not just their psychology. A chess grandmaster doesn't look at "win rates for players in this position" generally; they calculate the specific board state.
      *   *Objection 4: Definition of Modesty.* Is modesty about *accuracy* or *social posture*? The user defines it purely as accuracy-weighting. But sometimes modesty is about acknowledging uncertainty where base rates don't exist (e.g., unique existential risks).
      *   *Objection 5: The "Strong Version" (Psychology vs. World).* The claim that inside view is *only* evidence about psychology is too strong. My observation of a red apple is inside-view evidence about the world, not just my psychology.

  4.  **Evaluate and Rank Objections:**

      *   *Top Tier (Fatal/Strong):* The Reference Class Problem (circularity) and The Unique Evidence/Causal Mechanism argument (outside view can be actively misleading).
      *   *Middle Tier (Nuance):* Expertise/Skill (inside view can be trained to be reliable).
      *   *Lower Tier (Concessions):* Definition of modesty (semantic quibble), Psychology vs. World (obviously false in perception, maybe true in complex prediction).

  5.  **Address Specific User Questions:**
      *   *Circularity:* It's a recursion, not necessarily fatal, but it limits the "just is" claim. You need inside view to frame the outside view.
      *   *Worse Epistemic Move:* Yes, innovation, science, and unique events.
      *   *Prediction vs. Calibration:* This view predicts you should ignore specific evidence if the class is broad enough. Calibration just says "match confidence to frequency."
      *   *Unfalsifiable?* If "modesty" is *defined* as outside view, it's tautological. But the claim is that *true* modesty *is* this. That's empirical/normative.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the position (it's a standard rationalist take).
      *   *Objection 1: The Reference Class Problem (The Frame).* This is the strongest. You can't access the outside view without inside-view filtering. If I'm predicting my marriage success, is the class "all marriages" (50% fail) or "marriages of people who read relationship books" (lower fail rate)? Choosing the latter requires inside-view judgment about relevance. *Rank: High.*
      *   *Objection 2: Causal Mechanisms vs. Correlations.* Base rates are correlations. Inside views often deal in causation. If I have a causal model that explains *why* the base rate doesn't apply, deferring to the base rate is irrational. Example: Investing. *Rank: High.*
      *   *Objection 3: The "Strong Version" is False.* Inside view isn't just psychology. Sensory data is inside view. Logical deduction is inside view. *Rank: Medium.*
      *   *Objection 4: Innovation.* If everyone deferred to outside views, no innovation happens. The outside view says "most new things fail." The inside view says "this specific thing works." *Rank: Medium-High.*
      *   *Addressing Circularity:* It's not fatal, but it means they are interdependent, not that one *is* the other.
      *   *Falsifiability:* The view is at risk of being a "stop thought" slogan. If every counter-example is dismissed as "bad reference class," it's unfalsifiable.

  7.  **Refining the Tone:**
      *   Keep it challenging but respectful.
      *   Use the "Rank the objections" structure requested.
      *   Be direct about the "loose definition" worry.

  8.  **Final Polish:** Check against the prompt's specific constraints (rank objections, say what defenders concede, address circularity, address prediction vs calibration).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Inside view is good." I need to show why *modesty* isn't *exhausted* by outside view deference. Modesty can be about the *precision* of your inside view, not just abandoning it.

      *(Refining the "Strong Version")*: The user says "inside view is evidence about your psychology, not about the world." This is a radical empiricist/behaviorist claim. I should hit this hard. If I see a gun pointed at me, my inside view says "danger." That's about the world. The user probably means "narrative about why I'm special." I need to distinguish *perception/logic* from *narrative special-pleading*.

      *(Refining the Circularity)*: Is it fatal? No, it's a reflective equilibrium. But it disproves the "just is" claim. Modesty is the *balance*, not just one side.

  9.  **Final Structure:**
      1.  Introduction (Validating the intuition).
      2.  The Strongest Objection (Reference Class Selection).
      3.  The "Causal Breaker" Objection (When Outside View is Wrong).
      4.  The "Strong Version" Rebuttal (Psychology vs. World).
      5.  Addressing Circularity.
      6.  Prediction vs. Calibration.
      7.  Falsifiability Check.
      8.  Ranked Summary.

  10. (Final Review against constraints): Did I rank them? Yes. Did I say what defenders concede? Yes. Did I address the "loose definition"? Yes.

