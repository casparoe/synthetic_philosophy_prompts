answer: |-
  **The Burden of Proof: Logical Omniscience and the Rationality of Uncertainty**

  In the standard Bayesian framework of epistemology, rationality is equated with probabilistic coherence. An agent is rational if its degrees of belief—its credences—adhere to the Kolmogorov axioms of probability. A direct consequence of these axioms is the requirement of logical omniscience: an ideally rational agent must assign a credence of 1 to every logical truth and to every logical consequence of its beliefs. If a statement $S$ is a tautology, $P(S)$ must be 1; if $S$ is a contradiction, $P(S)$ must be 0. This view posits that logical uncertainty is a form of irrationality, akin to believing $A$ and $\neg A$ simultaneously. However, this orthodoxy creates a profound tension when applied to embedded agents—whether human or artificial—who operate within computational limits and face self-referential paradoxes. While the pressure from probability axioms and Dutch-book arguments provides a strong normative case for logical omniscience, a deeper analysis of decision theory and self-reference reveals that an ideally rational embedded agent *must* assign intermediate credences to unproven logical statements. Logical omniscience is not the pinnacle of rationality, but rather a structural flaw in modeling agents that exist within the logical systems they seek to reason about.

  The argument for logical omniscience rests on the bedrock of synchronic coherence. In classical Bayesianism, probability is interpreted as a measure of truth across possible worlds. Since logical truths hold in all possible worlds, their probability must be 1. To assign a credence of 0.9 to a tautology is to treat it as contingent, implying there are possible worlds where it is false, which is a contradiction. Furthermore, Dutch-book arguments suggest that violating these axioms exposes an agent to guaranteed losses. If an agent assigns $P(A) = 0.9$ and $P(\neg A) = 0.9$ (violating the axiom that $P(A) + P(\neg A) = 1$), a bookie can construct a set of bets that ensures the agent loses money regardless of the outcome. Proponents of logical omniscience argue that rationality is a static ideal of consistency; if an agent fails to see that $A$ implies $B$, the fault lies in the agent's reasoning capacity, not in the normative standard. From this "God's eye view," logical uncertainty is merely a description of human limitation, not a feature of ideal rationality.

  However, this orthodoxy crumbles when we shift from a static view of consistency to a dynamic view of inquiry. The primary failure of the logical omniscience model is that it eliminates the value of computation. In decision theory, the value of information is derived from the possibility that new information will change an agent's decision. If an agent is logically omniscient, it already knows all consequences of its beliefs. For such an agent, performing a calculation to determine the truth of a complex mathematical conjecture, such as the Riemann Hypothesis, has zero expected value. The agent already assigns credence 1 (if true) or 0 (if false). Yet, in practice, rational agents routinely place bets on unproven conjectures. A mathematician may act with high confidence that a lemma is true before the proof is fully written, basing further research on that assumption. If rationality required credence 1 only upon proof, the mathematician would be paralyzed, unable to act on highly probable but unverified logical claims. A theory of rationality that renders inquiry valueless cannot be a correct guide for action.

  The case against logical omniscience becomes even more compelling when considering self-referential difficulties. An agent that models itself as an ideal reasoner runs into severe logical barriers, most notably illuminated by Löb's Theorem and related results in provability logic. If an agent trusts its own reasoning completely—assigning credence 1 to its own soundness—it becomes vulnerable to paradoxes such as the "Procrastination Paradox," where an agent indefinitely delays a necessary action because it trusts its future self to perform it, leading to the action never being taken. To avoid inconsistency, an agent must be uncertain about its own future outputs and the consistency of its own system. It cannot assign credence 1 to the statement "I will only believe true things," because if it could prove that statement, it could prove anything (via Gödelian mechanisms). Therefore, a self-reflecting agent *must* maintain logical uncertainty regarding its own reasoning processes to remain consistent. To demand logical omniscience here is to demand that the agent be inconsistent.

  Recent developments in the theory of logical uncertainty, particularly the framework of Logical Induction proposed by Garrabrant et al., offer a formal resolution that vindicates the assignment of intermediate credences. Logical Induction describes a market-based algorithm where an agent assigns prices (credences) to logical sentences over time. While the agent is not logically omniscient at any finite time step, it satisfies a "no Dutch book" criterion in the limit. It learns to recognize patterns in logical statements (e.g., "this statement looks like a theorem") and assigns high credence to them before a proof is found, without ever assigning 1 until verification. This framework demonstrates that one can construct a coherent theory of rationality where agents assign credences strictly between zero and one to logical claims. Crucially, these agents are not "irrational" in the traditional sense; they are computationally bounded reasoners optimizing for coherence over time rather than at a single instant.

  We must therefore conclude that the requirement of logical omniscience is a category error when applied to embedded agency. The pressure from the probability axioms assumes a distinction between logical and empirical uncertainty that does not hold for agents who must compute logical truths. For an embedded agent, a logical truth is not "known" until it is derived; until that moment, it is epistemically indistinguishable from an empirical contingency. To insist on credence 1 for unproven conjectures is to confuse the map with the territory. It conflates the metaphysical status of a proposition (which is necessarily true or false) with the epistemic status of that proposition for the agent (which is uncertain).

  Consequently, it is not only permissible but necessary for an ideally rational agent to hold credences strictly between zero and one in statements whose truth has not yet been established. An agent that assigns credence 1 to unproven consequences of its beliefs is not "more rational" than one that remains uncertain; it is merely dogmatic. Such dogmatism precludes learning, destroys the incentive for computation, and invites self-referential paradox. True ideal rationality for an embedded agent is not the state of knowing all truths, but the optimal management of uncertainty regarding those truths. We must reject the classical Bayesian demand for logical omniscience in favor of a framework of logical uncertainty, acknowledging that rationality is a process of discovery, not a static state of perfection.
