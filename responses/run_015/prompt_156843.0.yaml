answer: |-
  The mud sucked at Dr. Aris Thorne's boots as she pointed toward the cascading water. Her recorder hummed, capturing the rush of the stream.

  "Ola," Kaelo said.

  She wrote: *Ola = River.*

  Kaelo leaned over, his finger hovering over the notebook. He tapped the word 'River'. Then he tapped the water. Then he shook his head.

  "Not ola," he said. "Ola-ing."

  Aris sighed, erasing the noun marker. She wrote: *Ola = Flowing.*

  "Yesterday," Aris said, pointing to the same channel. "Ola?"

  Kaelo looked at the water, then at her. "No. Yesterday-ola gone. Today-ola here."

  Aris paused. Her pen hovered. In her manual, 'River' implied a persistent entity occupying a channel over time. Here, the word seemed to slice time rather than span it. She tried to anchor the concept. She picked up a stone from the bank. Hard. Enduring.

  "This," she said. "Ola?"

  Kaelo laughed, a sharp sound. "Stone sits. Stone waits. But stone becomes sand. Stone is slow-ola."

  Aris frowned. She wrote: *Ola = Change?*

  "No," Kaelo said. He took a handful of water, let it slip through his fingers. "Ola is this slipping. Not the water. Not the hand. The slipping."

  Aris rubbed her temples. Her translation manual relied on subjects and predicates. *The water flows.* Subject: Water. Predicate: Flows. But Kaelo's syntax offered no slot for the water as a distinct thing. There was only the event. She tried to force a subject into the structure.

  "Me," she said, touching her chest. "Aris."

  She pointed to herself walking along the bank. "Aris walks."

  Kaelo interrupted. "Aris-walking happens."

  "I am Aris," she insisted. "I walk yesterday. I walk today. Same Aris."

  Kaelo's expression tightened. He pointed to her foot, then the ground. "Foot touches ground. Now. Before, foot touches air. Different touching. Different Aris-walking."

  "But I am the same person," Aris said, her voice rising. The humidity clung to her skin.

  Kaelo touched her shoulder, then her cheek. "Yesterday-Aris breathes sleep. Today-Aris breathes sun. Same stream? No. Same slipping."

  Aris looked down at her notebook. Page after page of nouns. *Tree. Mountain. Cloud.* She had translated them as things that persisted. But if she went back to 'Tree', would they say 'Tree-ing'? She turned to the page where she had drafted the grammar rules. *Plural marker: -s.* *Past tense: -ed.* Both implied countable units existing through time.

  She picked up her pen. She wrote: *Ola.*

  She looked at the river. The water she had seen a moment ago was gone, replaced by new water.

  "Ola?" she asked.

  "Ola," Kaelo said.

  "Same ola?"

  "No. New ola."

  Aris erased *River*. She wrote *Event of Water Passing*.

  Kaelo shook his head again. "No event. Event is thing. Only passing."

  Aris stopped. The pen lay on the page. If there were no things, there could be no subjects. If there were no subjects, there could be no translation manual structured like English. Every sentence she wrote was a lie. Every noun was a fossil of a permanence that did not exist here. To capture their speech, she would need a language without nouns, without pronouns, without identity.

  She looked at Kaelo. He was watching a leaf spin in the eddy.

  "Leaf?" she whispered.

  "Leaf-spinning," he corrected without looking up.

  Aris closed the notebook. The leather cover felt heavy, like a stone waiting to become sand. She realized she couldn't write a single true sentence. To say "The leaf spins" was to invent a leaf that endured long enough to spin. To say "Spinning occurs" was to invent a 'spinning' as a discrete object.

  The sun dipped lower. The light changed.

  "Light?" Aris asked.

  "Light-fading," Kaelo said.

  Aris opened the book again. She stared at the blank line. She wanted to write *Sunset*. But sunset implied a sun that set, a horizon that waited. It implied a world of objects surviving the night.

  She wrote nothing.

  The river rushed on, never the same twice, refusing to be named. Aris capped her pen. The silence between them was not empty; it was full of the noise of processes she could not catch in her net of words. She watched Kaelo breathe. In, out. Not a man breathing, but a breathing happening. She packed the recorder away. There would be no manual. There could only be the listening, and the slipping away.
