  10. **Final Polish:** Ensure tone is pedagogical and authoritative but respectful of the instructor's expertise. (The prompt implies a sophisticated instructor: "I can read that literature myself," "argue me out of it").

  *(Self-Correction on the Monty Hall link)*: Be careful. Monty Hall is about *conditional probability given an action*. SB is about *conditional probability given an existence*. The link is "Selection Effects." I need to make sure I don't conflate them. The bridge is: "In Monty Hall, the Host's rule selects a door. In SB, the Protocol selects an awakening."

