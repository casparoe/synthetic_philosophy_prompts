answer: |-
  Here is a plan for a fifty-minute section designed to isolate the epistemic puzzle of self-location without collapsing into decision theory or metaphysics.

  ### 1. The Transition: From Monty Hall to Self-Location
  **Time: 0–5 minutes**

  Do not start from scratch. Use Monty Hall to establish the concept of **sampling bias**, then pivot to where SB breaks the model.

  *   **Monty Hall Recap:** In Monty Hall, the host's action is constrained by the rules (cannot open your door, cannot open the car). This constraint means the door opened is *not* a random sample of the remaining doors. The evidence is not "Door 3 is empty," but "Door 3 was *made* empty by a constrained agent."
  *   **The Pivot:** Sleeping Beauty is not about a constrained agent revealing a state of the world. It is about a **constrained protocol revealing an observer moment.**
  *   **The Bridge:** In Monty Hall, the number of doors is fixed; the information filters the worlds. In Sleeping Beauty, the hypothesis (Tails) *generates more observer moments* than the hypothesis (Heads).
  *   **The Pedagogical Goal:** Establish that the puzzle turns on whether "I am awake now" counts as evidence filtered by the protocol (Thirder) or merely as the inevitable realization of a prior certainty that I would wake at least once (Halfer).

  ### 2. The Carrying Case: Standard Amnesia vs. Duplication
  **Time: 5–15 minutes**

  **Argument against the Duplication Variant:**
  You are inclined to open with a duplication variant (e.g., teletransportation or branching). **Do not do this.**
  *   **Why:** Duplication smuggles in metaphysics of personal identity. Students will immediately bog down in "Is the clone *me*?" or "Do we share a soul?" This distracts from the *epistemic* question of how to update credences given indexical uncertainty.
  *   **The Standard Case:** Stick to the standard Amnesia setup, but refine the description to make the "No New Evidence" intuition robust.
  *   **What it must contain:** Explicit stipulation that the two awakenings (if Tails) are **subjectively indistinguishable**. Not just "she forgets," but "her mental state, memories, and sensory inputs are identical."
  *   **What it must lack:** Any mention of betting, rewards, or penalties. This must be pure doxastic evaluation.
  *   **Why the Standard Story works:** The amnesia drug is a narrative device to secure **indexical ignorance**. It ensures that when she wakes, she cannot distinguish *which* day it is. This creates the centred uncertainty ("Is this the Monday awakening or the Tuesday awakening?") without requiring two bodies.
  *   **Making it a Puzzle, not a Trick:** To prevent it from looking like a trick (where the answer is obviously 1/3 by counting), you must emphasize the **Prior Certainty**. Before the experiment, Beauty knows: "I will wake up at least once." When she wakes, she must feel that she has merely arrived at a moment she knew would come. If she feels she has learned *nothing*, the Halfer position feels like sanity, not error. If she feels she has been *sampled* from a set of awakenings, the Thirder position feels like statistics. The tension between these two feelings is the puzzle.

  ### 3. The Misconception Map
  **Time: 15–40 minutes**

  You must distinguish between misconceptions that dissolve the puzzle (block these early) and those that resolve it pragmatically (deal with these late).

  **A. Block Before the Disagreement Surfaces (0–20 mins)**
  *   **The "Fair Coin" Dogma:** Students will say, "It's a fair coin, so it's 1/2."
      *   *Intervention:* Distinguish **Prior Credence** ($P(Heads)$ on Sunday) from **Posterior Credence** ($P(Heads | Awake)$). Agree the prior is 1/2. The puzzle is whether the posterior updates.
  *   **The "Frequency Dismissal":** Students will say, "1/3 is just the long-run frequency of awakenings, not a credence."
      *   *Intervention:* Insist that credence *guides expectation*. If she is asked 100 times, she should expect to be right 100 times. If she says 1/2, she expects to be right 50 times. Force them to treat credence as a guide to truth, not just a bet.
  *   **The "Counting Error":** Students will say, "There are three days: Mon-Heads, Mon-Tails, Tue-Tails. So 1/3."
      *   *Intervention:* Correct the ontology. There are not three days. There is one coin toss. The "three days" are observer-moments, not world-states. This clarifies that the Thirder view requires weighting observer-moments, which is the controversial move.

  **B. Deal With Only Afterwards (30–40 mins)**
  *   **The "Betting Argument":** Students will say, "If she bets on Tails every time, she wins more money, so credence should be 2/3."
      *   *Intervention:* **Segregate Decision Theory from Epistemology.** Explain that betting odds depend on *how many times* you bet. If you bet twice on Tails and once on Heads, the payout structure changes even if the probability is 1/2. Tell them: "We are asking what she *believes*, not how she *bets*." (See Section 5).
  *   **The "Impossibility Objection":** "Amnesia drugs don't exist."
      *   *Intervention:* Dismiss as irrelevant. This is a thought experiment about information sets, not pharmacology.

  ### 4. The Closing Question: Testing the Indexical Point
  **Time: 40–50 minutes**

  **On the "Monday Night Toss" Variant:**
  You asked about tossing the coin on Monday night *after* the first awakening. **Do not use this.**
  *   **Why it muddies:** It breaks the symmetry of the protocol. If the coin is tossed Monday night, then on Monday morning, the outcome does not yet exist. This turns the problem into one about future contingents or objective chance, rather than self-location relative to a fixed fact. It allows Halfers to say "The probability is undefined" and Thirders to lose their sampling argument.
  *   **The Better Test:** The **"What is the Evidence?"** Question.

  **The Closing Question:**
  > "Beauty is told, immediately upon waking, that **it is Monday**. What is her new credence in Heads, and **what proposition did she learn** when she was told this?"

  *   **Why this works:**
      1.  **If they understand indexicality:** They will see that "It is Monday" is new evidence. Even though she knew she would wake on Monday, she did not know *this* awakening was Monday.
      2.  **The Halfer/Thirder Divergence:**
          *   **Halfer:** $P(Heads | Monday) = 1/2$. (Learning it is Monday doesn't change the coin odds).
          *   **Thirder:** $P(Heads | Monday) = 1/2$. (Wait, both agree here? Yes, but the *path* matters).
      3.  **The Real Test:** Ask: "Did learning 'It is Monday' change her credence from what it was *before* she was told?"
          *   If she was a Thirder upon waking ($P=1/3$), learning it is Monday must raise her credence to $1/2$.
          *   If she was a Halfer upon waking ($P=1/2$), learning it is Monday leaves her at $1/2$.
          *   **The Kicker:** Ask, "If the Thirder is right, she *must* update on 'It is Monday'. If the Halfer is right, she *cannot* update on 'It is Monday'. **What is the content of the evidence that forces the update?**"
      4.  **Success Criterion:** The student identifies that the evidence is **centred**: "I am *now* experiencing the Monday awakening." They recognize that "It is Monday" eliminates the *Tuesday* centred world, which the Thirder counts as a live possibility upon waking, but the Halfer does not.

  ### 5. What to Refuse to Explain
  **Explicit Boundaries for the Session**

  To keep this within 50 minutes and strictly epistemological, you must openly refuse to adjudicate the following:

  1.  **Betting Arguments (Decision Theory):**
      *   *Refusal:* "We are not asking how Beauty should bet. We are asking what the world is like given her evidence. Betting conflates the *value* of being right with the *probability* of being right. We are doing epistemology, not economics."
      *   *Reason:* Betting arguments often convince students of Thirdism for the wrong reasons (pragmatic utility rather than truth-conditions).

  2.  **Everettian/Many-Worlds Analogies:**
      *   *Refusal:* "We are not assuming the universe branches. We are assuming one coin toss. Do not import quantum metaphysics to solve a classical probability puzzle."
      *   *Reason:* This turns an epistemic problem into a metaphysical one. It allows students to "solve" the puzzle by claiming there *are* literally two Tails-worlds, which bypasses the learning problem.

  3.  **The "Correct" Answer:**
      *   *Refusal:* "I will not tell you who is right. The literature is split between highly sophisticated philosophers. If you leave here thinking the answer is obvious, you have missed the point. The point is the tension between the Principle of Indifference and Bayesian Conditionalization."

  ### Summary of Flow
  1.  **0-5:** Monty Hall (Sampling Bias) $\rightarrow$ SB (Observer Sampling).
  2.  **5-15:** Standard SB Case (Indistinguishable awakenings, Prior Certainty).
  3.  **15-30:** Present Halfer (No new info) vs. Thirder (Selection effect).
  4.  **30-40:** Misconception Map (Block Frequency/Betting errors).
  5.  **40-50:** Closing Question ("It is Monday" update) + Refusals (No bets, no multiverse, no resolution).
