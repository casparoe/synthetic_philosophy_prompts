answer: |-
  **Joint Statement on the Ethics of Comparing Atrocities**
  **From the Adversarial Collaboration on Historical Memory**

  We, the undersigned, come from two distinct camps regarding the morality of ranking historical evils. One side argues that ranking is **neccessary** for justice; the other contends that ranking desecrates the dead. After a proper row and several drafts, we've agreed on what we're actually arguing about, where we stand together, and where we fundamentally part ways. We haven't solved it, but we've mapped the terrain.

  **1. What We Agree Comparison Involves**
  We all accept that comparing atrocities isn't just about counting bodies. Any serious comparison must weigh at least three variables, though we disagree on their weight:
  *   **Intent:** Was the destruction the goal, or a byproduct of policy?
  *   **Scale:** The absolute numbers and the proportion of the group affected.
  *   **Institutional Failure:** The degree to which systems were weaponised versus where they merely collapsed.

  We also agree that comparison happens whether we like it or not. Courts, reparations committees, and school curriculums already rank suffering implicitly. The question isn't *if* we compare, but *how consciously* we do it.

  **2. The Core Disagreement (Phrased Neutrally)**
  The split lies in the function of hierarchy.
  *   **Camp A (Justice)** holds that without a hierarchy of severity, resources for prevention and memorialisation are allocated arbitrarily. They argue that distinguishing between 'genocide' and 'tragedy' is a legal and moral imperative.
  *   **Camp B (Sanctity)** holds that creating a hierarchy inevitably creates a competition for victimhood. They argue that placing suffering on a scale obscures the unique context of each event and turns grief into a ledger.

  Both sides recognise themselves in this tension: the need for precision versus the risk of reduction.

  **3. Cruxes, Pairings, and Predictions**
  We identified two breaking points where our agreement stops. For each, we selected a concrete pairing of events we both agree is relevant to discuss, and outlined what each camp predicts the comparison will reveal.

  **Crux A: Is there a threshold where comparison breaks down?**
  *   **The Pairing:** **The Holocaust vs. The Holodomor.**
  *   **Camp A Prediction:** Comparing these reveals distinct mechanisms of intent (ideological extermination vs. political exploitation/neglect). This distinction is vital for legal definitions of genocide and ensures specific preventative measures for each type of threat.
  *   **Camp B Prediction:** Comparing these reveals the impossibility of weighing industrialised murder against weaponised starvation. The attempt to rank them flattens the lived experience of survivors into data points, ultimately diminishing the moral weight of both.

  **Crux B: Does comparing necessarily instrumentalise victims?**
  *   **The Pairing:** **The Rwandan Genocide vs. The Srebrenica Massacre.**
  *   **Camp A Prediction:** Comparison here reveals patterns in international inaction. By treating them as comparable cases of failure, we extract lessons that protect future victims, meaning the memory of the past serves the living.
  *   **Camp B Prediction:** Comparison here reveals how victims are turned into rhetorical shields. Linking them risks making their suffering contingent on its utility for policy, where those who don't fit the 'comparable' model are left without aid or recognition.

  **4. Conclusion**
  We sign this not to say we agree, but to say we understand the disagreement. Camp A fears that without ranking, justice is blind. Camp B fears that with ranking, justice is cruel. We leave this collaboration knowing that any future dataset on this topic must account for both the utility of the metric and the cost of using it.

  *Signed,*
  *The Working Group on Historical Ethics*
