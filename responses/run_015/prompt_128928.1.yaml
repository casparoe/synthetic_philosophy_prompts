prompt: |-
  You are an expert philosopher of language specializing in semantic externalism and the Twin Earth literature. Before giving your verdict, briefly list the two or three most plausible rules that could generate the pattern below, then apply them.

  A colleague of mine has offered clear verdicts on five reference cases:
  1. Twin Earth: mentally identical speakers on Earth and Twin Earth use "water" to refer to H2O and XYZ respectively; meaning is not fixed by internal mental state alone.
  2. Social kind error: a layperson who applies "arthritis" to thigh pain nevertheless refers to joint inflammation, because the medical community fixes the reference.
  3. Empty theoretical term: nineteenth-century chemists' "phlogiston" fails to refer, since nothing plays the specified causal role and there is no successful causal chain to an actual substance.
  4. Fictional reference: "Sherlock Holmes" refers to the detective constituted by Doyle's canonical texts and their cultural transmission, not by Doyle's private mental image.
  5. Isolated artifact: a lone engineer coins "flux-ring" for a device she actually constructs; despite her false mechanistic theory, the term refers to the physical object with which she causally interacts, not to the hypothetical mechanism.

  Now consider this case: in 1987 an isolated Antarctic station coins "cryon" for a postulated ice-crystal lattice specified to lie in shallow permafrost with distinctive thermal properties. They never observe it. In 2029 scientists elsewhere discover a lattice with exactly those thermal properties, but it occurs only in deep glacial cores. The scientists then read the old Antarctic papers and begin using "cryon" for their discovery; the original station never learns of this.

  What should my colleague say—does "cryon" now refer to the deep-glacial lattice? State the implicit rule her prior verdicts suggest, identify at least one competing rule that fits those verdicts equally well, and say what each predicts about "cryon". Give your best-guess verdict with reasoning, and specify one further case that would distinguish the rules.

  Also say explicitly where your reasoning is weakest: which argument or finding about reference-fixing would cause you to switch verdicts?

  Keep your response under 350 words, divided into no more than four short paragraphs.
