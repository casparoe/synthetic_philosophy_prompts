      *   *The "Dreaded" Objection:* The "Swampman" or "Indiscriminability" argument. If a duplicate arises without history, does it have function? If yes, etiology is wrong. If no, your point stands but etiology doesn't care. *Better Dreaded Objection:* The claim that "Causal Role" is *also* teleological or normative in disguise, so it's not more fundamental. *Best Dreaded Objection:* The distinction between "Selected Effect" and "Current Activity" is categorical, not foundational. If I argue they are continuous, I miss the normative jump.

      *   *Actually, the hardest objection for this specific thesis:* "You are conflating the *conditions for selection* with the *definition of function*." Selection requires causal efficacy (true), but that doesn't make causal role the definition of function. It just makes it a precondition.

  4.  **Addressing the Hard Constraint (Settled vs. Contested):**

      *   *Contested:* Whether "function" is a unitary concept. (Pluralists vs. Monists).
      *   *Contested:* Whether fitness is a property of traits or individuals/genotypes.
      *   *Contested:* Whether novel traits have functions *at the moment of origin*.
      *   *Settled:* Selection requires variation and differential reproduction.
      *   *Settled:* Etiological account defines function by history.
