answer: |-
  # Q&A Prep Sheet: Etiology vs. Causal Role in Biological Function

  **To:** Speaker
  **From:** Prep Assistant
  **Re:** Workshop Q&A Strategy
  **Constraint Check:** *Per your hard constraint, every section below includes a "Status Flag" distinguishing settled consensus from live disputes. Where your thesis relies on a contested premise, it is explicitly marked.*

  ---

  ## Top 8 Likely Objections (Ordered by Damage Potential)

  ### 1. The "Definition Stipulation" Objection
  **Who:** Committed Etiologicalist
  **Phrasing:** "You're arguing that causal role is more fundamental, but aren't you just changing the subject? For an etiologicalist, 'function' *means* 'history of selection.' If a novel mutation hasn't been selected yet, it literally has no function by definition. You're saying causal role is fundamental to *function*, but you're actually just saying it's fundamental to *fitness contribution*. You haven't shown etiology depends on causal role; you've just shown that *selection* depends on *physics*."
  **Status Flag:** **Contested.** Whether "function" is a unitary natural kind or a stipulative definition is live. Your thesis assumes "function" refers to a single phenomenon that both accounts are trying to capture. Etiologicalists often deny this, treating their account as the *only* valid definition of "proper function."
  **2-Minute Reply:** "I'm not changing the subject; I'm identifying the conditions of possibility. If 'function' is a biological category, it must be biologically instantiated. Selection cannot select 'for' a trait unless that trait makes a causal difference *now*. If the causal role isn't present, the selection history cannot begin. So, even if you define function as history, that history is ontologically dependent on the causal capacity existing prior to the history. The causal role is the ground; the etiology is the record."
  **Soft Spot:** They can reply that "causal capacity" is not "function." A brick has causal capacities but no functions. You need to explain why the trait's causal role is *privileged* before selection acts without smuggling in teleology.

  ### 2. The "Unit of Selection" Objection
  **Who:** Population Geneticist
  **Phrasing:** "You're talking about selection acting on a 'trait's causal role.' But in pop gen, selection acts on the *organism* or the *genotype*, measured by reproductive output. Traits don't have fitness; organisms do. By focusing on the trait's causal contribution, you're committing the fallacy of reifying the trait. How can causal role be fundamental if the 'role' isn't even the unit that selection tracks?"
  **Status Flag:** **Settled (mostly).** It is consensus that selection mathematically operates on allele frequency changes in populations. It is **Contested** whether we can meaningfully parse this into "trait fitness" for philosophical analysis. Your thesis assumes trait-level selection is coherent.
  **2-Minute Reply:** "I agree selection is statistically tracked at the population level. But for a differential reproduction rate to exist, there must be a phenotypic difference in the individuals carrying the alleles. That phenotypic difference *is* the causal role. We can't get the population statistic without the individual causal contribution. So the causal role is the mechanism by which the genotype achieves differential fitness."
  **Soft Spot:** They can press that many traits are correlated (linkage disequilibrium). The causal role of *this* trait might be zero, but it hitchhikes. Your account might falsely assign function to hitchhikers if you rely solely on "causal role present at origin."

  ### 3. The "Infinite Effects" Problem (The Gristle Objection)
  **Who:** General Phil of Biology / Sharp Etiologicalist
  **Phrasing:** "Every trait has infinite causal roles. A heart causes blood to flow, but it also causes a thumping sound, warms the chest cavity, and occupies space. Selection 'picks out' one. If etiology is parasitic on causal role, how do you determine *which* causal role becomes the function without already appealing to selection? You need etiology to filter the causal roles, not the other way around."
  **Status Flag:** **Settled.** It is consensus that traits have myriad effects. It is **Contested** how the "relevant" effect is identified. Your thesis implies the relevant effect is obvious pre-selection; critics say it is only obvious post-selection.
  **2-Minute Reply:** "Selection doesn't need to filter *all* causal roles, only those that impact survival/reproduction. At the moment of novelty, the 'relevant' causal role is simply the one that makes the difference between the mutant and the wild type surviving in that specific environment. We don't need a full history to identify the difference-maker; we just need a counterfactual comparison of the two phenotypes in the current environment."
  **Soft Spot:** This relies on a "counterfactual comparison" that is often impossible to isolate in complex systems (pleiotropy). If the mutation affects five things, which one is the "first function"? You have no non-etiological way to decide.

  ### 4. The "Drift" Counterexample
  **Who:** Population Geneticist
  **Phrasing:** "Suppose a novel mutation arises. It has a causal role that *could* be beneficial, but it fixes in the population purely by drift, not selection. On your view, does it have a function? If yes, you've severed function from selection (abandoning etiology). If no, then causal role wasn't sufficient to ground the function, and you still need the selection history."
  **Status Flag:** **Contested.** Whether drift can produce "function" is debated. Standard etiology says no. Your view implies causal role might be enough, which risks collapsing into causal-role account entirely.
  **2-Minute Reply:** "If it fixes by drift, I would argue it has a *causal contribution* but not yet a stabilized *biological function* in the normative sense. My claim isn't that causal role *equals* function, but that causal role is the *precondition* for the etiological account to get off the ground. In the drift case, the etiological account fails to generate a function, which confirms my point: without selection acting on the causal role, you don't get the etiological function."
  **Soft Spot:** This concedes that causal role *alone* isn't function. The etiologicalist will say, "Exactly! So etiology is doing the work of defining function, not causal role. You haven't shown causal role is more fundamental, just that it's a prerequisite."

  ### 5. The "Retrospective Assignment" Objection
  **Who:** Population Geneticist / Biologist
  **Phrasing:** "We assign function retrospectively. We don't know a trait is 'for X' until we see it persist. You're trying to ground function in the moment of origin, but scientifically, we never have access to that moment. We only have the history. Why build a metaphysical account on an epistemically inaccessible moment?"
  **Status Flag:** **Settled.** Epistemically, we usually infer function from history/comparative data. **Contested:** Whether metaphysics must follow epistemology. Your thesis is metaphysical (what *makes* it a function), not epistemological (how we *know*).
  **2-Minute Reply:** "I'm making a metaphysical claim about what constitutes the relation, not an epistemological claim about how we discover it. Even if we only discover it retrospectively, the *reason* the retrospectivity works is that the causal role existed at the start. The history is a record of the causal role's persistence. The record depends on the event recorded."
  **Soft Spot:** Biologists often treat metaphysics that ignores epistemic access as useless. They may dismiss your point as "not scientifically operationalizable."

  ### 6. The "Normativity Gap" Objection
  **Who:** General Phil of Biology
  **Phrasing:** "The main selling point of etiology is that it explains normativity (malfunction). Causal role accounts struggle with this (a heart that doesn't pump still has the causal role of occupying space). If you ground etiology in causal role, how do you get normativity out of it? You haven't explained how 'is' becomes 'ought'."
  **Status Flag:** **Contested.** Whether etiology successfully solves normativity is debated (the "Swampman" problem). Whether causal role *can't* handle normativity is also debated (Garson's mixed accounts).
  **2-Minute Reply:** "I'm not trying to derive normativity from causal role alone. I'm arguing that the *selection relation* (which provides the normativity) requires a causal role to latch onto. The normativity comes from the selection history, but that history is impossible without the causal base. So causal role is ontologically prior, even if it doesn't supply the normativity itself."
  **Soft Spot:** If causal role is ontologically prior but doesn't supply the defining feature (normativity), in what sense is it "more fundamental"? It sounds like you're saying "matter is more fundamental than purpose," which is trivial.

  ### 7. The "Exaptation" Trap
  **Who:** General Phil of Biology / Etiologicalist
  **Phrasing:** "Exaptation is when a trait selected for A is used for B. Etiology handles this easily (original function A, current use B). Your view blurs this. If causal role is fundamental, why isn't the current causal role (B) the function? You seem to need etiology to distinguish function from exaptation, which undermines your fundamentality claim."
  **Status Flag:** **Settled.** Exaptation is a real phenomenon. **Contested:** How best to categorize it. Your thesis claims etiology "quietly concedes" the point, but etiologicalists argue exaptation *proves* their account is superior.
  **2-Minute Reply:** "Exaptation proves my point. For a trait to be exapted for B, it must *already* have the causal capacity to do B before selection favors B. That pre-existing causal capacity is what allows the new etiological history to begin. The etiological account tracks the *change* in status, but it relies on the underlying causal continuity to make sense of the transition."
  **Soft Spot:** The etiologicalist will say, "We agree it has the capacity. But it's not a *function* until selected. So function is still purely etiological." You need to hold the line that "function" in the workshop title is being used broadly to include "potential function."

  ### 8. The "Pluralist" Dismissal
  **Who:** General Phil of Biology
  **Phrasing:** "Why do you need one to be fundamental? Maybe 'function' is a cluster concept. Etiology explains stability; causal role explains novelty. Why force a hierarchy where a toolkit works better?"
  **Status Flag:** **Contested.** Pluralism (Godfrey-Smith, Dupré) vs. Monism. Your thesis is explicitly Monist (seeking a foundation).
  **2-Minute Reply:** "Pluralism is useful for classification, but it doesn't explain the *connection* between the two. If they are totally independent, how does a causal role *become* an etiological function? There must be a bridge. I'm arguing that bridge is one-way traffic: causal role feeds etiology, not vice versa. That asymmetry implies fundamentality."
  **Soft Spot:** If they argue the bridge is pragmatic (we *choose* to treat it as a function), your ontological claim loses force.

  ---

  ## The "Dreaded Objection" (The One You Hope Nobody Asks)

  **The Objection:** "You claim the etiological account *concedes* your point in its standard replies to novel traits. But standard etiological theory (Millikan/Neander) explicitly states that novel traits have **no function** until selection has occurred. They don't say 'it has a causal role function that becomes etiological.' They say 'it has no function.' By arguing they *must* appeal to causal role, aren't you just asserting that *their* definition of function is wrong, rather than showing their account depends on causal role?"

  **Why it's dangerous:** It exposes that your thesis might be a verbal dispute. If they define Function = History, and you define Function = Causal Basis + History, you aren't proving them wrong; you're just talking about a different concept. It undermines your claim that you are analyzing *their* account's foundations rather than replacing it.

  **Status Flag:** **Highly Contested.** This cuts to the heart of whether philosophical analysis should revise folk/biological concepts or analyze existing usage.

  **Strategy if Asked:**
  1.  **Don't Panic.** Acknowledge the force of the point.
  2.  **Pivot to "Selection-For":** "They say the trait has no *proper function*, which is true by their definition. But they also claim to explain the 'selection-for' relation. My point is that the 'selection-for' relation itself cannot obtain without the causal role. So even if they deny the *label* 'function' to the novel trait, the *mechanism* they rely on to explain the transition from novel to established is causal. Therefore, the *explanatory power* of etiology rests on causal role, even if the *label* does not."
  3.  **Concede the Terminology, Hold the Metaphysics:** "If they want to reserve 'function' strictly for the historical endpoint, that's a linguistic choice. But metaphysically, the historical endpoint is constituted by the persistence of a causal effect. If you remove the causal effect, the history disappears. That makes the causal effect the ontological ground, regardless of what label we slap on the novel stage."

  ---

  ## General Advice on the "Settled vs. Contested" Constraint

  Throughout the Q&A, you must be careful not to present your **Monism** (that there is one true account of function) as settled.
  *   **Do say:** "If we assume function is a unitary phenomenon..." or "On the assumption that these accounts are competing..."
  *   **Do not say:** "Since function is clearly..." or "As we all agree, function requires..."

  **Specific Trap:** The Population Geneticists consider "fitness of a trait" to be a shorthand for "statistical association," not a real causal property.
  *   **Mitigation:** When speaking to them, use the phrase "phenotypic effect contributing to reproductive variance" instead of "trait fitness." This signals you respect their framework while making your philosophical point.

  **Specific Trap:** The Etiologicalists consider "Normativity" to be the *sine qua non* of function.
  *   **Mitigation:** Do not argue that causal role provides normativity. Argue that causal role provides the *substrate* upon which normativity is supervenient. Keep the distinction sharp.

  Good luck. The room is friendly but heterogeneous; clarity on definitions will be your best defense.
