      *   *Vulnerability 2 (Biologists):* Fitness isn't about traits in individuals; it's about allele frequencies. "Causal role" sounds like physiological mechanism, not evolutionary dynamics.
      *   *Vulnerability 3 (Conceptual):* Is "causal role" actually fundamental, or is it just a description of the physical setup?
      *   *Vulnerability 4 (The "Dreaded" One):* The distinction between "selection of" vs. "selection for" (Sober/Brandon). Or the problem of spandrels (Gould/Lewontin). Or perhaps the claim that "function" is a pluralistic concept, not reducible to one foundation.

