      *   *Objection 5 (The 'Effect' vs. 'Function' Distinction):* "Having an effect isn't having a function." A heart beats (causal role), but its function is to pump blood (etiology).
          *   *Damage:* Medium. Standard distinction.
          *   *Audience:* Etiologicalists.
      *   *Objection 6 (Exaptation):* "Exaptation proves etiology." We distinguish function from effect *because* of exaptation.
          *   *Damage:* Medium.
          *   *Audience:* General Philosophers/Etiologicalists.
      *   *Objection 7 (Circularity):* "You say selection needs an effect. But which effect? The 'functional' one?"
