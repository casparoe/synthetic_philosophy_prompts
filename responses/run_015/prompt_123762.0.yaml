answer: |-
  Good morning. Welcome.

  Look around this room. Half of you study how science happens. Half of you are trying to make it happen. And if I know this field, more than a few of you are lying awake wondering if someone else is already doing what you're doing.

  I know the feeling. Last month, a group in Berlin published a result I'd sat on for two years. Same core finding. Different notation. I didn't feel like a pioneer. I felt like a runner-up in a race I didn't know I was running. It forces a question that isn't abstract anymore: Was that result inevitable? Was I just the person holding the pen when the ink dried?

  For the next two days, I want us to treat that question not as a comfort, but as a structural problem.

  I want to propose an analogy: **Cartography.**

  Think of scientific truth as a coastline. It exists regardless of who draws it. If two ships round the same cape on the same week, the cape hasn't changed. The land is inevitable. The discoverers, in a principled sense, are replaceable. If Ship A hadn't come, the tides would have eventually brought Ship B. The territory doesn't care about the captain's name.

  For the scientists and grad students here, specifically those carrying the sting of being scooped: I need you to hear this clearly. If the coastline exists independently of the map, then being second is not an epistemic failure. You found the land. Your map is accurate. The truth you found is not less true because someone else found it too. Your loss was social, not intellectual. You lost the flag-planting, not the navigation. You are not wrong because you were not first.

  But for the historians here, this is where your work bites. If the discoverer is replaceable, why do we name theorems after them? Why "Newton's" Laws? Why not just "The Laws of Motion"?

  I'd argue the name is a useful fiction. We name the mapmaker not because the land belongs to them, but because we need a coordinate system for history. We need to know which logbook to read to understand *how* the map was drawn. The name tracks the context, the notation, the specific path taken to the peak. It anchors the human contingency against the inevitable truth.

  So, was it inevitable? The discovery, yes. The specific person? No. And that gap between the inevitable truth and the contingent human is where we are sitting for the next two days.

  To those who fear being second: You are still mapping the territory. To those who study the past: You are studying why we plant flags at all. Let's get to work.
