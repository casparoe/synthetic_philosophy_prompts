      *   **Topic:** The Procreation Asymmetry (David Benatar's *Better Never to Have Been* argument).
      *   **Part (a) (5 marks):**
          *   *Task:* Explain why (1)-(4) don't imply "coming into existence is *always* a harm" and identify the missing premise.
          *   *Expected Logic:* (1)-(4) establish an *asymmetry* in valuation, but they don't dictate the *net balance* of any specific life. A life could have so much pleasure that it outweighs the pain (even given the asymmetry). To conclude existence is *always* a harm (Benatar's stronger claim), one needs the empirical/axiological premise that all lives contain enough pain to make them net negative (or that the asymmetry makes *any* pain decisive against existence regardless of pleasure).
          *   *Key Distinction:* The asymmetry alone doesn't prove antinatalism; it needs the claim that lives are net bad (or that the presence of pain *always* outweighs the presence of pleasure in the calculus).
      *   **Part (b) (7 marks):**
          *   *Task:* Set out the symmetry objection (why treat absence of pain and absence of pleasure differently?) and give one response.
          *   *Expected Logic:* Objection: It looks arbitrary. Why is absence of pain good (without subject) but absence of pleasure not bad (without subject)? Response: Appeal to intuitive duties (duty to avoid suffering vs. no duty to create happiness) or the metaphysics of harm/benefit (you can be harmed by pain, but you can't be benefited by pleasure if you don't exist to receive the "absence of pain" benefit in the same way... wait, Benatar's specific response is usually about the intelligibility of the claims). The student's proposed response (ordinary procreative reasons) is a standard Benatarian move.
      *   **Part (c) (8 marks):**
          *   *Task:* Apply (1)-(4) to a *painless* life with *modest pleasure*. Does the "always a harm" argument go through?
          *   *Expected Logic:* This is the trap.
              *   Existence: Presence of Pain (Bad) = 0. Presence of Pleasure (Good) = +Modest.
              *   Non-Existence: Absence of Pain (Good) = +Good. Absence of Pleasure (Not Bad) = 0.
              *   Comparison: Non-Existence has the "Good of Absence of Pain." Existence has "Good of Presence of Pleasure."
              *   *Crucial Point:* If there is *no* pain in the life, premise (1) and (3) regarding pain cancel out or become neutral in the comparison (Presence of Pain is null, Absence of Pain is good *relative to existence*? No, wait.)
              *   *Benatar's Logic:*
                  *   Scenario A (Exists): Pain (Bad), Pleasure (Good).
                  *   Scenario B (Never Exists): Absence of Pain (Good), Absence of Pleasure (Not Bad).
                  *   If Pain = 0: Scenario A has Pleasure (Good). Scenario B has Absence of Pain (Good).
                  *   Does the argument that existence is *always* a harm go through? Benatar argues yes, because the "Good of Absence of Pain" in B is a *trump* or because the "Good of Presence of Pleasure" in A is not a *benefit* in the same way (or simply that B is better because it secures the absence of pain without risking it).
                  *   *However*, looking strictly at (1)-(4):
                      *   (1) Presence of Pain is Bad. (In this case, None).
