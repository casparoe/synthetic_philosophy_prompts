              *   This is a major philosophical error. It misunderstands the mechanics of the asymmetry. The asymmetry makes the *absence of pain* in non-existence a trump card *against* the *presence of pain* in existence. It does not negate the *presence of pleasure* in existence as a positive value (it just says the *absence of pleasure* in non-existence isn't a negative).
