answer: |-
  **The Scenario**

  During a period of remission from Bipolar I, Marcus signs a Psychiatric Advance Directive (PAD) appointing you as his enforcement agent. The PAD mandates involuntary medication if he engages in "high-risk financial liquidation indicative of manic impulsivity," with the stated preamble purpose: "to prevent destructive episodes until stable self-governance is regained." Three years later, Marcus liquidates assets to fund a venture. You invoke the independent verification clause specified in the PAD: a panel of three psychiatrists confirms Marcus is currently competent, mood-stable, and sleeping normally, and that his refusal of medication is consistent with his recovered values rather than a symptom of illness. The verification stipulates that the epistemic condition is settled: this is genuine transformation, not mania. However, the venture carries a high risk of ruin should he crash, and the medication required to enforce the PAD will dull the cognitive intensity necessary to sustain the venture. You have 24 hours to sign the commitment papers before the window closes; waiting is not an option. The literal trigger is met, but the stated purpose of the contract appears to have been achieved.

  **The Three Verdicts**

  1.  **Precedent Autonomy:** This view holds that the competent past self (S1) has the right to bind the future self (S2) to protect S1's enduring values against predictable shifts in preference. Since Marcus voluntarily signed the PAD knowing he might later feel "ready" while still being at risk, his prior judgment governs. The verification of current competence is irrelevant because the contract was specifically designed to override S2's judgment in this class of events. **Verdict: Enforce.**
  2.  **Present Autonomy:** This view prioritizes the current will of the person. If the individual is currently competent, their refusal of treatment must be respected regardless of past instructions. Since the verification clause confirms Marcus is competent and informed, his current refusal trumps the past directive. **Verdict: Do Not Enforce.**
  3.  **Teleological Fidelity (Intertemporal Co-authorship):** This view treats the person's life as a cooperative project where past and present selves negotiate authority based on the *aims* of their agreements. In a textbook Ulysses case (active mania), S2's capacity for agency is impaired, so enforcing the contract honors S1's goal of restoring agency. Here, however, the verification confirms S2 has achieved the "stable self-governance" that was the contract's *telos*. Enforcing the contract now would undermine the very capacity it was meant to build, violating S1's deeper intent. This view enforces in textbook cases but refuses here. **Verdict: Do Not Enforce.**

  **Analysis of the Feature**

  The feature doing the work is **Teleological Success**: the condition triggering enforcement (high-risk venture) is indistinguishable from the condition signaling the contract's successful completion (autonomous risk-taking). If you remove this feature—for example, if the verification panel found Marcus was sleep-deprived and grandiose—the Teleological Fidelity view would switch to enforcement, distinguishing it from Present Autonomy which might still hesitate based on current refusal. The obvious attack from a Precedent Autonomy defender is that "Teleological Success" is epistemically indistinguishable from "Manic Insightlessness"; mania always feels like recovery to the sufferer. The verification clause blunts this *normatively* by stipulating the truth of the transformation, but it does not solve the *practical* problem of who verifies. In the thought experiment, the clause works by fiat; in reality, it relies on fallible human judgment.

  **Constitutional Analogy**

  There is a direct analogue in constitutional entrenchment, specifically "militant democracy" clauses that ban anti-democratic parties to protect the constitution until the citizenry is robust enough to defend itself. If the citizenry achieves sufficient political maturity, the entrenchment becomes unnecessary or even illegitimate, as it restricts the very democratic agency it was meant to safeguard. The feature of Teleological Success survives the transfer: the clause is self-consuming if its success renders it obsolete. However, the cases separate on the verification mechanism: in the individual case, a panel of doctors verifies competence; in the political case, there is no neutral "panel" to verify democratic maturity, only the contested political process itself. This makes the political exemption far harder to operationalize without inviting destabilizing constitutional crises.

  **Practical Conclusion**

  For your specific situation, this thought experiment provides a normative justification for refusal, but it exposes a fatal design flaw in relying on it practically. The "Verification Clause" is the linchpin; without it, the "Teleological Success" exemption collapses into the "Symptom Loophole" you fear. In the thought experiment, verification is stipulated; in your reality, *you* are the verifier. Unless your friend's directive includes a requirement for multiple independent psychiatric assessments that you are bound to accept, you cannot replicate the stipulation. If you attempt to use this reason without robust external verification, you create a general loophole that licenses ignoring any directive whenever the agent believes the friend has "grown." Therefore, while the *principle* of Teleological Fidelity is sound, it is a failed design for a friend-to-friend agreement unless the verification mechanism is outsourced to professionals whose judgment you are contractually bound to trust. If that mechanism is not in place, you must default to Precedent Autonomy to avoid becoming the arbiter of your friend's sanity.
