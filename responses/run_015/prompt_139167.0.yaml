answer: |-
  Here is a mapping of the episode onto the lying-versus-misleading distinction, followed by an evaluation of your theoretical additions and the reverse pressure the case puts on the framework.

  ### Mapping the Utterances

  To apply the standard assertion-based view, we must fix the truth-conditions of the assertions relative to the context of utterance. The core proposition is $p$: "I have had sexual relations with Monica Lewinsky."

  **1. The January 17 Deposition (Sworn, Adversarial)**
  *   **Context:** A civil deposition with a stipulated definition of "sexual relations" entered into the record (contact with specific body parts with intent to arouse/gratify). The defense interpretation was that receptive oral sex did not constitute "contact with" the other person's parts in the active sense required by the definition.
  *   **Utterance:** "I have never had sexual relations with Monica Lewinsky."
  *   **Analysis:** Under the standard view, a lie requires asserting $p$ while believing $\neg p$. If Clinton believed the stipulated legal definition governed the truth-conditions of the question, and he believed his actions fell outside that definition, then he asserted $p$ (under legal definition) while believing $p$ was true.
  *   **Verdict:** **Merely Misleading.** He asserted a technical truth to implicate a general falsehood. The deception relies on the hearer assuming the ordinary meaning of "sexual relations" applies, rather than the stipulated one.
  *   **Caveat:** If he believed the ordinary meaning was the morally relevant truth-condition regardless of the legal stipulation, then he believed $\neg p$ (ordinary) while asserting $p$ (legal). This collapses into a **Lie**, but only if we treat the legal definition as irrelevant to the speaker's belief state regarding the assertion's truth. Given the legal counsel's involvement, the "Misleading" classification fits the mechanics better, which aligns with Judge Wright's civil contempt ruling for "misleading testimony" rather than perjury.

  **2. The January 26 Televised Address (Unsworn, Public)**
  *   **Context:** A public statement to the nation. No legal definition was provided to this audience. The common ground is ordinary language.
  *   **Utterance:** "I did not have sexual relations with that woman, Miss Lewinsky."
  *   **Analysis:** Here, the truth-conditions revert to ordinary usage. In ordinary usage, receptive oral sex constitutes a sexual relationship. Clinton knew this. He asserted $p$ (ordinary) while believing $\neg p$ (ordinary).
  *   **Verdict:** **Lie.** There is no stipulated definition to shield the assertion. The intent to deceive the public about the nature of the relationship is clear. This is the strongest candidate for a standard lie in the episode.

  **3. The August Grand Jury (Sworn, Defensive)**
  *   **Context:** Testimony under oath after evidence (the dress) made denial of contact impossible. Focus shifts to tense and definition.
  *   **Utterance:** "It depends on what the meaning of the word 'is' is." (Regarding the earlier statement "there is not a sexual relationship").
  *   **Analysis:** This exploits temporal indexicals. If "is" refers to the present moment, and the relationship had ceased, the statement "there is not..." is technically true. However, the implicature is that "there never was."
  *   **Verdict:** **Merely Misleading.** He asserts a present-tense truth to implicate a past-tense falsehood.
  *   **Verdict on "Improper Relationship":** When denying an "improper relationship of any kind," if he believes the relationship was improper but defines "improper" narrowly (e.g., illegal vs. immoral), he is again misleading. If he believes it was not improper, he is not lying. Given the subsequent apology, he likely believed it was improper, making this a **Lie** regarding the moral status, but **Misleading** regarding the categorical status.

  ### Evaluating "Defensive Literalism"

  You ask if choosing wording for deniability constitutes the intent-to-deceive condition on its own, making defensive literalism "lying with extra steps," or a third category.

  **Does it collapse?**
  Yes, regarding the *speech act*. Defensive literalism is not a distinct type of assertion; it is a strategy for constructing a misleading assertion. The standard theory already captures this: if you assert $p$ (true) to make the hearer believe $q$ (false), you are misleading. The motivation (preparing for a tape recording) explains *why* the speaker chose misleading over lying, but it doesn't change the classification of the utterance.

  **Where it might hold weight:**
  It challenges the *moral* weight of the distinction, not the linguistic one. If the intent-to-deceive is identical in both lying and defensive literalism, why do we treat them differently? Your intuition suggests that pre-meditated semantic shielding might be *more* culpable because it involves instrumentalizing language itself, not just facts.
  However, calling it a "third category" risks category error. It is better described as **aggravated misleading**. The "extra steps" (consulting definitions, parsing tense) demonstrate a higher degree of deliberation. If moral culpability tracks deliberation, defensive literalism is worse than a spur-of-the-moment lie, but it remains on the "misleading" side of the linguistic divide. The theory doesn't miss it; it just doesn't automatically assign it higher blame than a lie.

  ### The Two-Audience Problem

  Can a single utterance be a lie to Audience A (Public) and merely misleading to Audience B (Legal Record)?

  **The Audience Parameter:**
  The theory must take an audience parameter. Truth-conditions are determined by the "common ground" between speaker and hearer.
  *   **To the Public:** Common ground = Ordinary English. Assertion = False. Verdict = Lie.
  *   **To the Court:** Common ground = Stipulated Definitions + Rules of Evidence. Assertion = True (under stipulation). Verdict = Misleading.

  **Does the distinction survive?**
  Yes, but it becomes relativized. The utterance token is the same, but the proposition expressed varies by context. This creates a friction point: we usually want a moral verdict on the *speaker*, not the *utterance-token*. If the speaker knows Audience A will interpret it as a lie, but relies on Audience B to verify it as technically true, the speaker is using Audience B as a shield against Audience A.
  This suggests the lying/misleading distinction is insufficient for *institutional* analysis. It can classify the speech act relative to a hearer, but it cannot easily adjudicate the speaker's integrity when they knowingly exploit the gap between two hearers. The theory is silent on how to aggregate moral weight across conflicting audiences.

  ### Hearer Responsibility and the Institutional Wrong

  You ask if the adversarial setting reduces culpability (lawyers should have pinned him down) or if the oath flips it to a duty of candor.

  **The Adversarial Defense:**
  In ordinary conversation, the Gricean maxim of Quantity assumes cooperation. If I am vague, you should ask for clarification. In a deposition, the questioner has the power to define terms and demand yes/no answers. One could argue the hearer (Jones's lawyers) shares responsibility for accepting an ambiguous answer.
  **The Oath Counter:**
  The oath removes the "caveat emptor" norm of conversation. It imposes a duty of candor to the *tribunal*, not just the questioner. The witness becomes an officer of the court for the duration of testimony.
  **Verdict:**
  The wrong is primarily institutional. In a private conversation, misleading a friend violates interpersonal trust. In a deposition, misleading the court weaponizes the rules of procedure to obstruct truth-finding. The hearer's failure to follow up is negligence; the speaker's decision to exploit that negligence under oath is malice. The oath flips the burden entirely to the speaker. Therefore, the misleading testimony in the deposition is morally weightier than a lie to a friend, not because of the linguistic mechanism, but because it degrades the institution required to adjudicate the underlying facts.

  ### Reverse Direction: What the Case Does to the Theory

  Your suspicion is that the lying/misleading distinction breaks in political/legal settings, and specifically that "defensive literalism" (corruption-of-literal-meaning) is socially worse than an outright lie because it destroys the convention that literal truth is a safe default.

  **Arguing Against the Corruption Thesis:**

  1.  **The Resilience of Convention:** Language conventions are robust. They do not collapse because a high-profile speaker exploits a loophole. In fact, the public outrage suggests the convention *held*. People were angry precisely because they expected literal truth to be the default and felt betrayed when technicalities were used. If the convention were truly destroyed, the reaction would be cynicism ("all politicians speak in code"), not scandal. The scandal proves the norm is alive.
  2.  **Incentive Structures:** If we collapse the distinction and treat defensive literalism as lying, we remove the incentive for speakers to strive for technical truth. If I am going to be condemned as a liar regardless of whether I take the time to ensure my statement is factually accurate under the relevant definitions, I might as well lie outright. Preserving the distinction rewards the effort to be literally truthful, even if the intent is to mislead. It keeps a foothold for accountability.
  3.  **Detectability and Sanction:** You argue a plain lie is detectable and sanctionable while literalism quietly destroys meaning. I would argue the reverse in legal contexts. A plain lie is often indistinguishable from a mistake without external evidence (e.g., the DNA on the dress). Defensive literalism, however, leaves a paper trail of semantic choices. It is *more* detectable upon analysis because it requires parsing definitions. The "corruption" is actually a form of exposure; it forces the audience to scrutinize the definitions of words. This can lead to greater precision in public discourse, not less.
  4.  **The Category Error:** The "corruption" argument assumes the function of political speech is the same as cooperative conversation. It isn't. In law and politics, words are tools of negotiation and boundary-setting. Exploiting literal meaning is a feature of the system, not a bug. The "wrong" in the Clinton case wasn't that he used literal truth to mislead; it was that he used a *legal* literal truth to answer a *public* question. The corruption is in the conflation of registers, not in the use of literalism itself.

  **Where the Theory is Silent:**
  The standard lying/misleading framework is genuinely silent on **diachronic deception**. It analyzes the utterance at $t_1$. It cannot easily account for a strategy where the speaker intends to correct the record at $t_2$ if caught, but maintain the deception at $t_1$ if not. Defensive literalism is a bet on the future availability of evidence. The standard theory treats the intent to deceive as binary (present or absent), but in this case, the intent is conditional ("deceive unless caught"). The theory lacks the vocabulary for *probabilistic* or *contingent* intent to deceive.

  ### Summary

  The Clinton episode does not break the lying/misleading distinction, but it exposes its limitations in multi-audience, high-stakes environments.
  *   **TV Address:** Lie (ordinary context).
  *   **Deposition:** Misleading (legal context).
  *   **Defensive Literalism:** Not a third speech act, but a strategy of aggravated misleading.
  *   **Two-Audience:** Requires relativizing truth-conditions, making the speaker's integrity the variable rather than the utterance's status.
  *   **Corruption Argument:** Unconvincing. The distinction protects the incentive for technical truth, and the public backlash confirms the convention of literal truth remains robust.

  The real friction is not linguistic; it is institutional. The theory assumes a cooperative search for truth. The legal system assumes an adversarial search where truth is a byproduct of conflict. When a speaker treats a public inquiry as a legal deposition, they are not breaking the rules of language; they are breaking the rules of the specific discourse genre. The theory needs a "genre parameter" more than it needs a new definition of lying.
