answer: |-
  This is a sophisticated proposal that touches on the hardest open problems in decision theory (logical uncertainty, embeddedness, and the separation of map/territory). You are effectively trying to solve the "tiling agents" or "self-modification" problem by fiat: declaring a boundary where the agent ends and the environment begins, and treating everything inside that boundary as "self" (policy) rather than "world" (evidence).

  While this intuition aligns with the motivation behind Functional Decision Theory (FDT)—treating your decision procedure as a logical abstract rather than a physical event—your specific mechanism of "Computational Boundary Locking" (CBL) introduces specific vulnerabilities.

  Here are the defeaters ranked from fatal to awkward, followed by my confidence assessment.

  ### 1. Fatal: The Common-Cause Blindness (Informational Leakage)
  **The Defeater:** You specifically asked about hidden correlations. This is the strongest argument against CBL. In an embedded setting, there is no guarantee that "internal" noise is causally isolated from the "external" environment. Both are physical processes subject to common causes (temperature, radiation, power supply fluctuations, or even a superintelligent predictor modeling your hardware).

  **Why it's Fatal:** UDT works by optimizing over logical correlations. If your internal bit-flip is physically correlated with an external event (e.g., a solar flare flips a bit in your CPU *and* disrupts the communication channel you rely on), treating that bit-flip as "purely internal policy execution" forces you to ignore the evidence it provides about the external disruption.
  By locking the boundary, you are effectively asserting conditional independence between your internal state and the external world, *given the policy*. If that assertion is false (which it often is in physics), you are blinding yourself to Bayesian evidence that is crucial for maximizing utility. You aren't just avoiding EDT-updates; you are actively severing acausal links that UDT relies on to win in Newcomb-like scenarios. If a predictor simulates your hardware noise, that noise is part of the logical structure. If you treat it as "non-evidence," you may fail to coordinate with the predictor's simulation of you.

  ### 2. Severe: The Ontological Regress (Defining the Boundary)
  **The Defeater:** To implement CBL, the agent must be able to distinguish between "internal state change from running the policy" and "external evidence." In an embedded agent, there is no ontological boundary; there is only physics.
  **Why it's Severe:** Drawing this boundary requires a model of the world. You must *update* on observations to determine where your hardware ends and the environment begins. For example, if you feel pain, is that internal sensor data (evidence) or hardware corruption (noise)? Deciding this requires a prior model of your own embodiment.
  If you built that model via updating, CBL is not truly updateless; it is "Update-Then-Lock." If the environment changes in a way that invalidates your boundary model (e.g., you are uploaded to a substrate where "memory" is external), your locked boundary becomes a maladaptive constraint. You are locking in a potentially false map of the territory.

  ### 3. Moderate: The Logical Counterfactual Mismatch
  **The Defeater:** UDT relies on evaluating counterfactuals of the form "If my policy outputted X..." CBL treats hardware glitches as "part of the policy."
  **Why it's Moderate:** This creates ambiguity in counterfactual reasoning. If a glitch causes you to output X instead of Y, does UDT evaluate the world where the *policy* outputted Y (ignoring the glitch), or the world where the *physical hardware* outputted X?
  If you ignore the glitch (treating it as execution), you are reasoning about a counterfactual that is physically impossible for your current substrate. If a predictor is simulating your *actual* hardware (including glitches), and you reason about the *ideal* policy, your logical correlation with the predictor breaks. You might decide to one-box (ideal policy), but your hardware glitches to two-boxing. A CBL agent might claim "I intended to one-box," but the world sees a two-boxer. UDT requires the output to match the logical abstraction; CBL admits a divergence between abstraction and physics without a clear rule for which one governs the utility calculation.

  ### 4. Awkward: Verification Overhead and Infinite Regress
  **The Defeater:** To ensure a state change is "noise" and not "evidence," you need a meta-process to verify the integrity of the computation.
  **Why it's Awkward:** This meta-process is itself a physical computation subject to noise. Do you apply CBL to the meta-process? If yes, you might lock in a false verification. If no, you are updating on the meta-process's findings, which violates the CBL rule. This leads to a regress of "boundary checkers" that either collapses into standard updating or requires an infinite hierarchy of locked boundaries. Practically, this makes the agent computationally intractable or forces it to trust unverifiable hardware.

  ---

  ### Confidence Assessment

  **Confidence Level:** **High (85%)** on the ranking and the core theoretical critiques.
  The problems of embeddedness (no clear boundary) and common-cause correlations (internal states carrying external information) are well-documented in the literature on embedded agency (e.g., MIRI's work on tiling agents and logical induction). CBL attempts to solve these by stipulation rather than mechanism, which usually fails in rigorous decision theory.

  **Least Certain Element:** **The interaction between CBL and Logical Uncertainty.**
  I am least sure about how CBL handles *logical* noise vs. *physical* noise.
  *   **Physical Noise:** A cosmic ray flips a bit. (CBL says: Ignore as evidence, treat as policy).
  *   **Logical Uncertainty:** I am unsure if 7,591 is prime. I run a computation. It says "Prime." Later I find a bug in my proof checker.
  If CBL treats the initial "Prime" output as "locked policy," I might act on a mathematical falsehood. If I treat the bug discovery as "new evidence," I am updating.
  There is a possibility that a refined version of CBL could work if "Boundary" is defined logically (my source code) rather than physically (my hardware). However, since you specified "embedded agents" (which implies physical hardware constraints), the physical critique holds. If you shift CBL to be about *logical* boundaries only, it becomes closer to standard FDT, and the "innovation" of CBL dissolves. I am uncertain if there is a stable middle ground where "physical implementation details" are locked but "logical errors" are updatable without collapsing into EDT.

  ### Summary
  Your proposal is a valiant attempt to stabilize UDT against the paralysis of self-reference. However, **Defeater #1 (Common-Cause Blindness)** is likely fatal. By forbidding updates on internal states, you forbid the agent from using its own physical state as a sensor for the environment. In an embedded world, *you are a sensor*. Ignoring data from that sensor because it is "internal" breaks the link between the agent's decision and the physical reality it inhabits.
