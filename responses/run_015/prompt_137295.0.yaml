      *   *Refinement on Hofstadter's View:* Ensure I accurately represent Hofstadter. He explicitly argues *against* epiphenomenalism. The "I" is a fiction, but a causal fiction. It acts like a virtual machine. The video artist is misreading Hofstadter on point 2.
      *   *Refinement on Worry 2:* The video tunnel *is* a regress. Hofstadter's strange loop is a *cycle* that violates type hierarchy, not an infinite stack. This is a crucial distinction.
