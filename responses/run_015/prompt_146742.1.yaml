          3.  If guidelines were rewritten to treat top-down models as equally legitimate, what would that commit us to about explanation?
      *   **Constraints:**
          *   Lead with the bottom line in the first sentence.
          *   Give the reasoning.
          *   No preamble.
          *   No restating of the question.

  2.  **Determine the Bottom Line:**
      *   The institutional bias reflects a methodological commitment to *mechanistic explanation* rooted in a specific interpretation of physicalism, but it does not necessarily entail ontological greedy reductionism; a non-reductive physicalist can accept it as a heuristic for causal grounding, though elevating cognitive models to equal status would commit science to a pluralistic view of explanation where functional autonomy is recognized alongside mechanistic constitution.
      *   *Refinement for punchiness:* The bias presupposes a methodological commitment to mechanistic constitution rather than ontological greedy reductionism, meaning a non-reductive physicalist can accept it as a grounding requirement without denying cognitive autonomy, though elevating cognitive models would commit us to explanatory pluralism where functional causality is treated as real rather than merely heuristic.

  3.  **Drafting the Reasoning (Iterative Process):**

      *   *Point 1: Identifying the Reductionism.* The requirement isn't necessarily "greedy reductionism" (Dennett's term for bad reductionism that denies higher-level reality). It's more aligned with the "New Mechanism" philosophy (Machamer, Darden, Craver). They want to see the *mechanism* that implements the function. It's about causal grounding. If you say "belief updating causes relapse," they ask "what physical process *is* that belief updating?" It's not denying the belief exists; it's demanding the physical substrate be identified to ensure it's not magic.
      *   *Point 2: Non-Reductive Physicalism (NRP).* NRP says higher-level properties supervene on lower-level ones but are not reducible (multiple realizability). Can an NRP accept the grant rule? Yes. They can say, "Sure, the cognitive level is real and causally efficacious, but to get funding, you need to show how it's physically implemented because we are physicalists." It's a methodological rule for *completeness*, not an ontological denial. The "skyhook" accusation is often a shorthand for "you haven't shown the physical bridge yet," not "your model is false."
      *   *Point 3: Changing the Guidelines.* If we treat top-down models as equally legitimate without requiring the bottom-out, what does that commit us to? It commits us to *explanatory pluralism* or *autonomism*. It suggests that functional/causal stories at the cognitive level are sufficient explanations in their own right, not just placeholders for neural stories. This aligns with Putnam's multiple realizability argument or Fodor's special sciences. It commits us to the idea that causal powers can reside at the special science level without needing constant reference to the microstructure.
      *   *Point 4: Synthesis.* The current bias is mostly methodological (show the mechanism to prove physical plausibility). Changing it would be an ontological shift towards accepting higher-level causation as fundamental in practice, not just in theory.

