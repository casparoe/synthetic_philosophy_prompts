answer: |-
  ### The Strong Selected-Effects (SE) Account: A Diagnostic Map

  The Strong Selected-Effects account (championed by Ruth Millikan and Karen Neander) posits that a trait's **proper function** is the effect it performed in the past that explains its current presence via natural selection. This history provides the normative ground: a heart *ought* to pump blood because ancestors that pumped blood survived; a heart that does not is *malfunctioning*, not merely different.

  Below is a map of objections ranked by severity, distinguishing between those a defender must concede (requiring theory modification) and those they can wave away (requiring only clarification).

  ---

  ### I. Map of Objections (Ranked Fatal to Awkward)

  #### 1. Fatal / Severe Threats
  *These objections strike at the mechanism of selection or the link between history and current utility.*

  *   **The Novelty Problem (The "First Mutant"):**
      *   *Objection:* A beneficial mutation arises in a single individual. It confers an immediate survival advantage. According to Strong SE, it has **no function** yet, because it has no history of selection. This contradicts the biological intuition that the trait is functional *because* it aids survival now.
      *   *Defender's Move:* **Concede.** The Strong SE account must admit that "function" is a population-level historical property, not an individual causal property. The first mutant has a *beneficial effect*, but not a *proper function* until the trait is fixed or maintained in the gene pool.
      *   *Cost:* High. It renders the term "function" useless for discussing evolutionary emergence in real-time.

  *   **The Linkage (Hitchhiking) Problem:**
      *   *Objection:* Traits are often selected in clusters. If Trait A is selected for, and Trait B is genetically linked but neutral (or slightly deleterious), Trait B proliferates. SE implies Trait B has the same function as Trait A, or no function. But if Trait B *does* something useful now, SE denies it function because it wasn't the *target* of selection.
      *   *Defender's Move:* **Concede/Refine.** The defender must refine "selection for" to distinguish between "selection of" (the organism) and "selection for" (the specific trait).
      *   *Cost:* Moderate. It requires a granular analysis of genetic architecture that biologists may not always possess.

  *   **Deceptive Signaling (Receiver-Benefit):**
      *   *Objection:* In some signaling systems (e.g., bacterial quorum sensing or certain predator alarms), the signal benefits the receiver more than the sender, or the sender's benefit is negligible. If the sender pays a cost without a compensatory fitness benefit (via kin selection or reciprocity), the trait should be selected *against*. If it persists, SE struggles to identify the "effect for which it was selected" without inventing ad-hoc fitness benefits.
      *   *Defender's Move:* **Wave Away (with conditions).** The defender argues that if the signal persists, there *must* be a sender-benefit (e.g., kin selection, manipulation). If no sender-benefit exists, the trait is a parasite or a spandrel, and SE is correct to deny it a function.
      *   *Cost:* Low, provided kin-selection models hold. If empirical evidence shows stable signaling without sender benefit, this becomes Fatal.

  #### 2. Manageable / Deflectable Objections
  *These objections rely on intuitions that the SE defender argues are mistaken.*

  *   **The Vestigiality Problem:**
      *   *Objection:* The human appendix was selected for digestion in herbivorous ancestors. It is now useless (or has a minor immune role). SE says its function is **digestion**. This implies the appendix is constantly malfunctioning in every living human.
      *   *Defender's Move:* **Wave Away.** This is a feature, not a bug. The SE account captures the intuition that the organ is "broken" relative to its design plan. If it has acquired a new immune function selected for in primates, it has a *new* proper function. If not, it is indeed a malfunctioning vestige.
      *   *Cost:* Low. It preserves normativity at the cost of common usage.

  *   **The Exaptation Problem:**
      *   *Objection:* Feathers were selected for warmth, now used for flight. SE says the function is warmth. Intuition says flight.
      *   *Defender's Move:* **Wave Away.** Functions can shift. If flight currently contributes to the fitness of the organism and has done so for enough generations to sustain the trait, flight is now a proper function (a "derived proper function"). Warmth may remain a historical function, but flight is the current explanatory history.
      *   *Cost:* Low. Requires a threshold for when a new use becomes a "selected effect."

  #### 3. Awkward / Concedable Limitations
  *These are areas where SE is consistent but admits it does not cover all uses of "function."*

  *   **The Capacity vs. Function Distinction:**
      *   *Objection:* We often say "the function of the liver is to filter blood" even in a patient with liver disease, or in a novel context.
      *   *Defender's Move:* **Concede.** The SE account is a theory of *Proper Function*, not *System Capacity*. It must admit that biologists use "function" ambiguously. SE covers the normative "ought"; Causal-Role (CR) accounts cover the descriptive "can."
      *   *Cost:* Moderate. It admits SE is not a complete theory of all function talk, only the normative subset.

  ---

  ### II. Analysis of Specific Problem Cases

  #### 1. Traits Maintained for a New Effect (Exaptation)
  *   **SE Verdict:** The function is the *current* selected effect, provided the historical chain of selection has shifted to favor the new effect.
  *   **Nuance:** If the trait is maintained solely by inertia (no current selection), it has no current proper function, only a historical one.
  *   **Requirement:** The account does not need supplementation here, but it does require a **threshold condition**. When does a new use become a "selective maintenance" factor? The defender must specify that a trait acquires a new proper function only after a period of selection *for* that new effect.

  #### 2. Vestigial Traits (Lost Effect)
  *   **SE Verdict:** A vestigial trait has a proper function (the old one) and is currently malfunctioning, OR it has lost its proper function entirely if the selection pressure is completely gone and the trait is drifting.
  *   **Normativity:** This is where SE shines. It explains why we feel a vestigial organ is "useless" or "broken" rather than just "doing something else."
  *   **Requirement:** No supplementation needed. In fact, adding CR here would weaken the account by calling a drifting trait "functional" just because it occupies space.

  #### 3. Signaling (Receiver vs. Sender)
  *   **SE Verdict:** The function of a signal is determined by the benefit to the **sender** (or the sender's genes), not the receiver. A signal that benefits only the receiver is parasitic or manipulative.
  *   **Requirement:** This requires robust evolutionary modeling (Kin Selection, Reciprocal Altruism). If a signal persists without sender benefit, SE must classify it as a **pathology** or a **byproduct**, not a function.
  *   **Risk:** If biological consensus settles on "group selection" mechanisms that SE defenders reject, this case becomes fatal.

  ---

  ### III. The Hybrid Question: SE + Causal-Role (CR)

  **Does the account need supplementation?**
  Yes, but not by merging the definitions. It needs a **dual-concept framework**.
  *   **Proper Function (SE):** Explains normativity, malfunction, and design.
  *   **System Function (CR):** Explains current causal contribution, capacity, and novel utility.

  **Does this forfeit the normative payoff?**
  *   **If Merged:** **Yes.** If you say "Function = Selected Effect OR Current Capacity," you lose the ability to say a trait is *malfunctioning* while still performing a capacity. (e.g., A heart pumping blood in a body where it was not selected to exist would be "functional" under CR, but "accidental" under SE).
  *   **If Separated (Gatekeeping Model):** **No.** The defender argues that CR functions are only "true" functions in a derivative sense. The normativity remains anchored in SE. We can say, "The liver has the *capacity* to filter toxins (CR), and its *proper function* is to do so because ancestors survived by doing so (SE)."
  *   **The Danger:** The hybrid risks becoming a "theory of everything" that explains nothing. If every causal role can be retrofitted with a selection story (adaptationism), SE becomes unfalsifiable. To preserve normativity, the SE defender must remain willing to say "This trait has a causal role but **no function**" (e.g., spandrels).

  ---

  ### IV. Predictive Power and Substantiveness

  **What does SE predict that rivals do not?**
  1.  **Dysfunction in Working Traits:** SE predicts that a trait can be working perfectly (causally) but still be malfunctioning (normatively) if it is performing the wrong effect (e.g., a heart that pumps blood but was selected for thermal regulation in a specific evolutionary scenario—hypothetical, but logically possible).
  2.  **No Function in Lucky Mutations:** SE predicts that a beneficial trait in a single individual is not yet "functional" in the proper sense. CR accounts predict it is functional immediately.
  3.  **Spandrels are Functionless:** SE predicts that byproducts (e.g., the redness of blood, the hum of a computer) have no biological function, even if they are currently useful. CR accounts often assign them functions based on current utility.

  **Is the surviving version substantive or empty?**
  The Strong SE account remains **substantive**, provided it refuses to conflate "beneficial effect" with "selected effect."

  *   **Why it is not empty:** It makes risky historical claims. It claims that if you cannot tell a selection story, there is no function. This is falsifiable. If we find complex traits that persist without any history of selection (e.g., purely drift-based complex structures that do something useful), SE fails.
  *   **The Qualification:** To survive the "Novelty" and "Exaptation" objections, the account must be qualified to allow for **rapid selection** and **derived functions**.
  *   **Final Verdict:** The account survives as a **normative gatekeeper**. It does not explain every use of the word "function" (conceding ground to CR for capacities), but it retains the exclusive right to explain **malfunction**.

  **Summary of the Survivor:**
  The surviving Strong SE account is: *A trait T has proper function F if and only if T exists now because ancestors of T performed F, which contributed to the fitness of those ancestors, and this history explains the maintenance of T.*
  *   **It concedes:** It cannot judge novel mutations instantly.
  *   **It waves away:** Vestigiality (calling it malfunction) and Exaptation (allowing function shift).
  *   **It predicts:** Useful byproducts are functionless.
  *   **Normativity:** Preserved, because "ought" is derived from "was selected for," not "currently does."

  This version is not empty; it is a sharp, historical scalpel that cuts away current utility from evolutionary design, preserving the unique ability to distinguish between a trait that *works* and a trait that is *doing its job*.
