          *   *Settled:* The mathematical impossibility (Arrow-style proof).
          *   *Contested:* What this *means*. Does it kill liberalism? Or does it suggest we need to limit the domain (restrict preferences)? Or change the rights structure?
          *   *Flagging Liberties:* Admit that applying individual rights to *blocks* is an aggregation step Sen didn't explicitly model this way.
      *   **Conclusion (1 minute):** Bring it back to the workshop goal. We aren't solving the math today, but we are designing around the constraint.

