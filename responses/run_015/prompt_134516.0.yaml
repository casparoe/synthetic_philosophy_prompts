answer: |-
  Good morning. Welcome to everyone. I see we have a room divided roughly in half: those who can derive Arrow's Impossibility Theorem on a napkin, and those who know that "Universal Domain" sounds like a real estate development in New Jersey. [Pause for light laughter] If you're in the second group, don't worry. You're here for the zoning; the theorists are here to make sure we don't accidentally break logic while trying to fix housing.

  Our theme is "Local Democracy and the Right to Choose Your Neighborhood." On the surface, this sounds uncontroversial. Who could oppose local democracy? Who could oppose the right to choose where you live?

  But I want to start with a warning from social choice theory. Specifically, Amartya Sen's Liberal Paradox.

  For the planners in the room: Sen proved that you cannot simultaneously satisfy two very reasonable conditions. First, **Pareto Efficiency**—meaning, if everyone agrees Option A is better than Option B, the system should choose A. Second, **Minimal Liberalism**—meaning, there are certain personal decisions where at least one individual should be decisive. If I care about what book I read, and you don't, my preference should win.

  Sen showed mathematically that these two conditions can contradict. You can have a system that respects individual rights and respects unanimous agreement, yet still produces a contradiction or a cycle.

  Now, I am taking a liberty here. [Flagging Liberty] Sen framed this around private choices, like reading a book. Zoning is inherently public; my fence affects your view. But let's translate this to our context to see where the structural friction lies.

  Imagine a city composed of individual blocks. We want to empower "local democracy," so we give every block the right to vote on its own zoning. This feels like Minimal Liberalism applied to place. Block A decides its density. Block B decides its parking ratios.

  Now, consider a worker, let's call her Sarah. Sarah has a "liberal right" in the classical sense: the freedom to choose her residence near her job to minimize her commute. She prefers living in Block A.

  But Block A consists of existing homeowners. They exercise *their* liberal right to determine the character of their immediate environment. They vote for low density to prevent congestion.

  If we institutionalize the Block's right to zone as a "protected sphere," we have granted Minimal Liberalism to the residents. But in doing so, we have structurally removed Sarah's ability to exercise her liberal right to choose her location.

  Here is where the theorists will lean forward. If we say the Block's decision is final (Liberalism), we might block a development that Sarah wants, the developer wants, and even some residents would accept if compensated (a Pareto improvement). By protecting the local veto, we sacrifice the Pareto principle. We end up with a city-wide outcome that is inefficient—housing shortages, long commutes—even though every local decision was "democratic."

  Conversely, if we prioritize the Pareto principle—building the housing because it creates net value—we violate the Minimal Liberalism of the existing residents to control their immediate surroundings.

  This is not a bug in the software; it is a feature of the math. You cannot have hyper-local veto power *and* guaranteed access *and* efficient outcomes all at once.

  Now, a crucial distinction. [Settled vs. Contested] What is settled here is the mathematical impossibility. Given Sen's axioms, the contradiction holds. No amount of stakeholder engagement will solve a logical inconsistency.

  What is *genuinely contested*—and where I want this workshop to focus—is the interpretation. Does this paradox kill liberalism? Most theorists say no. It suggests we cannot have *unrestricted* liberalism. We have to limit the domain of preferences, or we have to redefine the "rights" we are protecting.

  Some argue the paradox disappears if we stop treating zoning as a right over *property* and start treating it as a right over *access*. Others argue we should drop the demand for Pareto efficiency in favor of procedural justice. There is no consensus on the solution, only consensus on the tension.

  I want to be clear: I am leaning on a specific interpretation of Sen here. [Flagging Liberty] I am treating a "Block" as a collective agent with a single preference ordering, which glosses over internal voting dynamics. A strict social choice theorist would tell me I'm conflating levels of aggregation. But for the purpose of policy design, the warning signal is the same: Decentralizing rights creates externalities that the local mechanism cannot see.

  So, why does this matter for the next two days?

  Because if we design a participatory zoning process that promises "local control" without acknowledging these trade-offs, we are promising the impossible. We are telling planners they can satisfy every neighborhood's desire for exclusivity while satisfying every worker's desire for affordability and access.

  Sen tells us that when rights clash, someone's liberty must yield. The question for this workshop is not *if* we trade off these rights, but *how* we do it transparently.

  Do we protect the right to exclude, or the right to enter? Do we prioritize the efficiency of the regional labor market, or the stability of the local streetscape?

  The theorists in this room know the math says you can't have it all. The planners know the politics says you have to try. My hope is that by understanding the structural constraints of the Liberal Paradox, we can design processes that don't just gather input, but actually navigate these impossibilities without pretending they don't exist.

  Let's get to work. Thank you.
