      *   **Core Argument:** Use Sen's Liberal Paradox to show why hyper-local voting (block-level zoning) can violate minimal liberal rights (e.g., living near work), even if every block votes freely.
      *   **Constraints:**
          *   Length: About 6 minutes (approx. 750-900 words spoken at a moderate pace).
