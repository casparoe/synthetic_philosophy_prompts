prompt: |-
  I recently joined my university's research-integrity committee, and the reproducibility crisis in psychology has stopped being an abstract methodological worry for me: last month we had to decide whether to continue funding a moral-psychology line of work whose headline effect had just failed to replicate in a large non-Western sample. I want you to analyze that larger episode—the reproducibility crisis itself, not merely our local vote—through the lens of the WEIRD critique of folk morality and its implications for moral objectivity.

  Assume the broad public picture of the episode, without my needing exact replication rates, dates, or citations. Over roughly the past decade, large-scale replication projects in psychology found that a substantial share of classic social- and moral-psychology effects—surprising, small-sample findings that had often been taught as basic human intuitions—either shrank dramatically or failed to reappear when re-run by independent teams. Among the most cited explanations were small and homogeneous subject pools, researcher flexibility, low statistical power, and publication bias. The field treated this as a credibility crisis and began adopting reforms such as pre-registration, larger samples, and explicit replication attempts.

  The lens I have in mind combines two ideas. The first is the WEIRD critique. WEIRD stands for Western, Educated, Industrialized, Rich, Democratic; the critique holds that a great deal of moral psychology has recruited almost entirely from WEIRD undergraduates and then treated the resulting patterns as universal features of human moral cognition. The second is the cross-cultural finding that folk morality varies: the everyday distinctions people draw between right and wrong are not identical everywhere. In many WEIRD settings, folk morality foregrounds individual harm, rights, fairness, and autonomy, while other moral concerns—loyalty to the in-group, respect for authority or hierarchy, and purity or sanctity—may be weaker, differently ordered, or expressed in ways the standard experiments do not capture. The question this raises for moral objectivity is what becomes of the ambition of empirical moral psychology when the supposedly universal moral sense looks like one variable, culture-bound folk morality among others.

  Please give me a disciplined, two-directional analysis. First, map the theory onto the episode. Identify the actors: the original investigators, the replication teams, journal editors and reviewers, funders and universities, and the candidate effects themselves as hypotheses under test. For each, say what options they faced and what counted as evidence and payoff. The original investigators could publish novel small-sample effects or invest in slow, cross-cultural replication; journals and funders could reward novelty or robustness; replicators could copy the original protocol exactly or adapt it to new populations. On the WEIRD-plus-folk-morality view, what should each of them have done, given that the original samples may have been measuring a local folk morality rather than the human moral faculty? Be specific about what the theory predicts the actors should have anticipated.

  Second, say which features of the reproducibility crisis the lens explains and which it misses or misdescribes. Distinguish carefully between the demographic problem, which is that the samples were WEIRD; the methodological problems of low power, researcher flexibility, and publication bias; and the incentive problem of novelty over replication. Some replication failures are plausibly explained by the WEIRD critique, because the effect was always a local folk-morality artifact. Others are better explained by bad methods or bad incentives, and the critique has no purchase on them. Tell me where the critique is doing real explanatory work, where it is silent, and whether it wrongly predicts variation in cases where moral intuitions actually turn out to be robust across cultures.

  Third, turn the case back on the theory and on the objectivity question. Does the reproducibility crisis confirm that moral psychology had been illegitimately extrapolating from one folk morality to universal human nature? To keep the analysis from staying at the level of slogans, introduce and use one refinement: call the move from our participants display moral intuition I to I is a component of the universal human moral faculty the universalist extrapolation, and track what the replication failures do to it. Then distinguish three claims that are easily confused: moral objectivity in the metaethical sense, which is the claim that some moral standards are true or valid independent of anyone's attitudes; psychological universalism, which is the claim that all humans share the same basic moral intuitions; and methodological representativeness, which is the claim that our samples accurately mirror the human population. Say which of these, if any, is actually threatened by the replication failures, and which survive. If the WEIRD critique overpredicts cultural variation, say where; if it underpredicts it, say where.

  Finally, I want an honest verdict rather than a forced application. Does the reproducibility crisis vindicate the WEIRD critique as a correct diagnosis of moral psychology, or is it better read as a methodological scandal that leaves the metaethical question of moral objectivity untouched? If the better version of the critique is what I will call a local-first default—the rule that any moral-psychology effect should be treated as a description of the sampled folk morality until it survives cross-cultural replication—what would adopting that default imply for the objectivity debate, and what would it cost the field? Where does the WEIRD critique simply not apply to the crisis, and does a revised or alternative framework—perhaps one that separates demographic representativeness from methodological rigor and from the incentive structure of the field—do better?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** The user is on a university research-integrity committee. They recently voted on funding for a moral-psychology line of work that failed to replicate in a non-Western sample.
      *   **Task:** Analyze the *reproducibility crisis in psychology* through the lens of the *WEIRD critique* (Western, Educated, Industrialized, Rich, Democratic) and *folk morality variation*.
      *   **Specific Focus:** Implications for *moral objectivity*.
      *   **Structure:**
          1.  **Map Theory to Episode:** Identify actors (investigators, replicators, editors, funders, effects), their options, evidence, and payoffs. What *should* they have done under the WEIRD/folk-morality view?
          2.  **Evaluate the Lens:** What does the WEIRD critique explain about the crisis? What does it miss? Distinguish between demographic (WEIRD), methodological (power/flexibility), and incentive (novelty) problems.
          3.  **Turn Case on Theory/Objectivity:** Distinguish *Universalist Extrapolation*, *Moral Objectivity* (metaethical), *Psychological Universalism*, and *Methodological Representativeness*. Which are threatened? Does WEIRD over/underpredict variation?
          4.  **Honest Verdict:** Does the crisis vindicate WEIRD or is it just a methodological scandal? What is the "Local-First Default"? What are the costs/implications for objectivity? Is there a better framework?
      *   **Constraints:** No need for exact citations/dates. Disciplined analysis. Avoid slogans.

  2.  **Part 1: Mapping Theory to the Episode (Actors & Incentives):**

      *   *Actors:* Original Investigators, Replication Teams, Editors/Reviewers, Funders/Universities, The Effects (Hypotheses).
      *   *Standard View:* Effects are universal human traits. Failure = methodological error or false positive.
      *   *WEIRD/Folk-Morality View:* Effects might be local cultural artifacts. Failure = boundary condition or cultural specificity.
      *   *Analysis per Actor:*
          *   *Original Investigators:* Option A: Publish novel finding (WEIRD sample). Option B: Test cross-culturally first. *WEIRD Prediction:* They should have anticipated cultural specificity. Payoff for A is high (novelty); Payoff for B is low (slow, hard).
          *   *Replicators:* Option A: Exact copy (WEIRD). Option B: Adapt to new population. *WEIRD Prediction:* They should prioritize diverse sampling to test universality, not just reliability.
          *   *Editors/Funders:* Option A: Reward novelty/surprise. Option B: Reward robustness/generalizability. *WEIRD Prediction:* They should have required evidence of non-WEIRD validity before labeling something "human nature."
          *   *The Effects:* Treated as "Human Nature" vs. "Local Folk Morality." *WEIRD Prediction:* Many "universal" effects are actually local norms.

  3.  **Part 2: Evaluating the Lens (Explanatory Power):**

      *   *What it Explains:* Failures specifically in moral/social psychology where cultural norms diverge (e.g., fairness vs. loyalty, purity). It explains *heterogeneity* in effect sizes across sites (e.g., ManyLabs or replication projects showing high variance).
      *   *What it Misses:*
          *   *Methodological:* Low power, p-hacking, HARKing (Hypothesizing After Results are Known). A effect can be WEIRD *and* p-hacked. The WEIRD critique doesn't explain why the original p-value was inflated by bad stats.
          *   *Incentives:* Why replication wasn't done *at all* initially. WEIRD explains *why* the replication failed (culture), not *why* the replication was delayed (career incentives).
          *   *Non-Moral Domains:* The crisis exists in cognitive psych too (priming, etc.), where WEIRD is less relevant to the *mechanism* (though still relevant to sampling).
      *   *Misdescription:* It might imply *all* failures are cultural. Some are just noise or fraud. It risks "culturalizing" methodological sloppiness.

  4.  **Part 3: Turning the Case on Theory & Objectivity:**

      *   *Universalist Extrapolation:* The move from "My participants did X" to "Humans do X." The crisis undermines this move.
      *   *Distinguishing Claims:*
          1.  *Moral Objectivity (Metaethical):* Are moral truths mind-independent? *Verdict:* Unaffected. Psychology describes beliefs, not truths. Even if all humans agree, it doesn't prove objectivity (genetic fallacy). If humans disagree, it doesn't disprove it.
          2.  *Psychological Universalism:* Do all humans share intuitions? *Verdict:* Threatened. The crisis suggests fewer universals than claimed.
          3.  *Methodological Representativeness:* Do samples mirror population? *Verdict:* Confirmed as false.
      *   *Over/Underprediction:*
          *   *Overprediction:* Some basic moral intuitions (e.g., harm avoidance in infants) *do* seem robust. WEIRD shouldn't assume *everything* is variable.
          *   *Underprediction:* It might miss within-culture variation (class, religion) not just West vs. Rest.

  5.  **Part 4: Honest Verdict & The Local-First Default:**

      *   *Vindication?* Partially. It explains the *content* of the failures in moral psych. But it doesn't explain the *process* of the crisis (the cheating/stats).
      *   *Methodological Scandal?* Yes, primarily. The crisis is mostly about power and bias. WEIRD is a compounding factor, not the root cause.
      *   *Metaethics:* Untouched. The crisis is about empirical claims, not normative truth.
      *   *Local-First Default:* Treat effects as local until proven universal.
          *   *Implication:* Slows down theory building. Reduces grand claims.
          *   *Cost:* Harder to get funding/publications for "small" local findings.
          *   *Benefit:* More accurate map of human morality.
      *   *Alternative Framework:* Separate the three layers: Sampling (Demographics), Rigor (Methods), Incentives (Sociology of Science). WEIRD solves Sampling. Open Science solves Rigor/Incentives.

  6.  **Refining and Polishing:**

      *   *Tone:* Academic, analytical, disciplined. Avoid preaching.
      *   *Clarity:* Ensure the distinction between metaethics and psychology is sharp (the "Is-Ought" gap).
      *   *Specifics:* Use the user's terminology ("Universalist Extrapolation," "Local-First Default").
      *   *Check:* Did I answer the specific prompt about the committee vote context? (Yes, keep the analysis relevant to that decision-making context).

  7.  **Drafting the Response (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the committee context. Set the stage.
      *   *Section 1 (Actors):* Break down the incentives. Highlight the mismatch between "Universal" claims and "WEIRD" data.
      *   *Section 2 (Explanatory Power):* Be critical. Don't let WEIRD eat everything. Distinguish between "Effect doesn't exist" (stats) and "Effect doesn't exist *there*" (culture).
      *   *Section 3 (Objectivity):* Crucial section. Keep metaethics separate. Define the three claims clearly.
      *   *Section 4 (Verdict):* Nuanced conclusion. WEIRD is necessary but not sufficient. Propose the integrated framework.

  8.  **Final Review against Constraints:**
      *   Did I use "Universalist Extrapolation"? Yes.
      *   Did I distinguish the three claims (Objectivity, Universalism, Representativeness)? Yes.
      *   Did I discuss the "Local-First Default"? Yes.
      *   Is it disciplined and two-directional? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't conflate the Reproducibility Crisis (mostly methods/stats) with the WEIRD critique (sampling/generalizability). They overlap but are distinct. The prompt asks to analyze the Crisis *through* the lens of WEIRD. I must show where that lens clarifies and where it distorts. I need to be careful not to suggest that replication failures *prove* moral relativism (metaethical), but rather that they disprove psychological universalism.

  *(Refining the "Objectivity" point)*: It is a common mistake to think psychological variation disproves moral truth. I must explicitly state that psychological diversity is compatible with moral realism (people can be wrong about objective truths) and psychological uniformity is compatible with anti-realism (people can share a subjective illusion). The crisis affects the *evidence* used in metaethical arguments (e.g., from disagreement), but not the truth conditions themselves.

  *(Final Polish)*: Ensure the transition between the committee's specific dilemma and the broader theoretical analysis is smooth. The committee's vote is the hook, but the analysis is the meat.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This analysis addresses the reproducibility crisis through the specific lens of the WEIRD critique and folk morality, structured according to your four requirements. It is designed to assist your committee's understanding of the epistemic stakes involved in funding decisions regarding moral psychology.

  ### I. Mapping the Theory onto the Episode: Actors, Incentives, and Expectations

  To understand how the WEIRD critique reframes the reproducibility crisis, we must treat the crisis not merely as a failure of statistical rigor, but as a failure of *generalizability assumptions*. Under the standard model, actors operated as if they were mining a universal human nature. Under the WEIRD/folk-morality model, they were mining a specific cultural ecology.

  **1. The Original Investigators**
  *   **Standard Options:** Publish a novel, statistically significant effect using a convenient sample (undergraduates) vs. invest time/resources in diverse sampling before publication.
  *   **Standard Payoff:** High reward for novelty and "human nature" claims; low reward for slow, confirmatory cross-cultural work.
  *   **WEIRD/Folk-Morality Prediction:** Investigators should have anticipated that moral intuitions (e.g., fairness vs. loyalty, purity vs. harm) are calibrated by local norms. They should have treated their initial findings as *hypotheses about Western folk morality*, not discoveries of the moral faculty.
  *   **What They Should Have Done:** Explicitly framed conclusions as culturally situated. Before claiming a universal mechanism, they should have piloted the effect in at least one non-WEIRD population to check for boundary conditions.

  **2. The Replication Teams**
  *   **Standard Options:** Exact protocol replication (same measures, similar population) vs. Conceptual replication (adapted measures, diverse populations).
  *   **Standard Payoff:** Credit for verifying the "truth" of the original effect.
  *   **WEIRD/Folk-Morality Prediction:** If the original effect relies on WEIRD-specific norms (e.g., individualistic notions of fairness), an exact replication in another WEIRD sample might succeed, while a replication in a non-WEIRD sample should fail.
  *   **What They Should Have Done:** Prioritized *heterogeneous* replication. A failure in a non-Western sample should not be coded simply as "failure to replicate" (implying the original was false) but as "boundary condition identified" (implying the original was locally true).

  **3. Journal Editors and Reviewers**
  *   **Standard Options:** Accept papers claiming universal psychological mechanisms based on homogeneous samples vs. demand evidence of cross-cultural robustness.
  *   **Standard Payoff:** Prestige for publishing "breakthroughs" about human nature.
  *   **WEIRD/Folk-Morality Prediction:** Editors should have recognized that moral psychology claims are uniquely vulnerable to cultural variance compared to, say, basic visual perception.
  *   **What They Should Have Done:** Required that claims of "universal moral intuition" be supported by diverse sampling. They should have treated the WEIRD sample as a limitation that precludes universalist titles/abstracts.

  **4. Funders and Universities**
  *   **Standard Options:** Fund high-risk/high-reward novel lines of inquiry vs. fund robust, cumulative programmatic research.
  *   **Standard Payoff:** Prestige from high-impact publications.
  *   **WEIRD/Folk-Morality Prediction:** Funding a line of work based on a single cultural context is high-risk because the "effect" may be a local norm that does not travel.
  *   **What They Should Have Done:** Incentivize collaborative, multi-site grants from the outset. Your committee's recent vote is a corrective here: defunding a line of work that fails to travel is rational if the goal was to understand *human* morality, but perhaps premature if the goal was to understand *Western* morality.

  **5. The Candidate Effects (Hypotheses)**
  *   **Standard View:** The effect is a signal of the moral faculty; noise is methodological error.
  *   **WEIRD/Folk-Morality View:** The effect is a signal of the interaction between the moral faculty and local cultural learning.
  *   **Prediction:** Effects grounded in abstract, deontological reasoning (common in WEIRD ethics) will show high variance. Effects grounded in basic harm avoidance or care may show lower variance. The crisis should look like *heterogeneity*, not just disappearance.

  ### II. Explanatory Power: What the Lens Explains and Misses

  The WEIRD critique is a powerful diagnostic tool, but it is not a total theory of the reproducibility crisis. It must be disentangled from methodological and incentive problems.

  **1. Where the WEIRD Critique Does Explanatory Work**
  *   **Heterogeneity in Effect Sizes:** The critique successfully explains why some effects replicate in the US/UK but vanish in East Asian, South American, or Indigenous samples. For example, trolley-dilemma responses or fairness games (Ultimatum Game) often vary systematically by market integration and social structure.
  *   **The "Shrinking" Effect:** In moral psychology, effects often don't just disappear; they shrink. The WEIRD lens explains this as a dilution effect: the original sample was a "high concentration" of a specific cultural norm. When mixed with a global sample, the average effect size drops.
  *   **Content-Specific Failures:** The critique explains why *moral* and *social* psychology suffered more than cognitive psychology (e.g., working memory tasks). Moral content is culturally loaded; cognitive mechanics are less so.

  **2. Where the Lens is Silent or Misdescribes**
  *   **Methodological Artifacts (p-hacking, Low Power):** The WEIRD critique cannot explain why a result was statistically significant in the first place if it was a false positive driven by researcher flexibility. An effect can be WEIRD *and* p-hacked. If a finding fails to replicate even in *other WEIRD samples*, the WEIRD critique has no purchase; that is a methodological failure, not a cultural one.
  *   **The Incentive Structure:** The WEIRD critique explains *why* the generalization was wrong, but not *why* the field ignored the sampling problem for 50 years. That is explained by the incentive problem (novelty over robustness). The crisis was driven by the pressure to publish, not just by the demographics of the subjects.
  *   **Within-Culture Variation:** The WEIRD binary (West vs. Rest) can obscure variation within the West (e.g., religious vs. secular, class differences). A failure to replicate might be due to sub-cultural shifts rather than a broad "Western" vs. "Non-Western" divide.

  **3. Overprediction of Variation**
  *   The critique risks predicting variation where none exists. Some moral intuitions (e.g., condemnation of unprovoked violence against kin, or basic reciprocity) appear robust across cultures. If the WEIRD lens leads researchers to expect variation in *all* moral effects, they may misinterpret robust findings as anomalies or miss the deeper universals that do exist.

  ### III. Turning the Case on the Theory and the Objectivity Question

  This section distinguishes the empirical claims from the metaethical implications, using your specified terminology.

  **1. The Universalist Extrapolation**
  The move from "Our participants display moral intuition *I*" to "*I* is a component of the universal human moral faculty" is the **Universalist Extrapolation**.
  *   **Impact of Crisis:** The reproducibility crisis, viewed through the WEIRD lens, demonstrates that the Universalist Extrapolation was frequently illicit. The empirical basis for claiming a "universal moral sense" was often a single cultural data point.
  *   **Status:** The Universalist Extrapolation is severely damaged. It can no longer be made without cross-cultural validation.

  **2. Distinguishing the Three Claims**
  We must separate three claims that are often conflated in this debate:

  *   **A. Methodological Representativeness:** *Claim:* Our samples accurately mirror the human population.
      *   **Status:** **Falsified.** The crisis confirms that samples were not representative. This is an empirical fact about the field's history.
  *   **B. Psychological Universalism:** *Claim:* All humans share the same basic moral intuitions (e.g., the same weighting of harm vs. purity).
      *   **Status:** **Threatened/Reduced.** The crisis suggests that the set of truly universal intuitions is smaller than previously thought. Many "universals" are actually "WEIRD particulars." However, it does not prove *no* universals exist, only that we have not yet rigorously identified them.
  *   **C. Moral Objectivity (Metaethical):** *Claim:* Some moral standards are true or valid independent of anyone's attitudes.
      *   **Status:** **Untouched.** This is the crucial distinction.
          *   *Disagreement does not disprove Objectivity:* If people disagree about geometry, it doesn't mean there are no geometric truths; it means some people are mistaken. Similarly, moral variation is compatible with Moral Realism (people in different cultures access or interpret objective truths differently).
          *   *Agreement does not prove Objectivity:* If all humans shared an intuition (Psychological Universalism), it could still be a shared evolutionary illusion (e.g., a useful fiction).
      *   **Verdict:** The reproducibility crisis is an empirical scandal about human *beliefs*, not a metaethical verdict on *truth*. It removes a specific *argument* for objectivity (the argument from universal consensus), but it does not disprove objectivity itself.

  **3. Over/Underprediction of Variation**
  *   **Overprediction:** As noted, the WEIRD critique might lead us to expect variation in basic harm aversion, which seems relatively stable.
  *   **Underprediction:** The critique often focuses on national/cultural borders. It may underpredict variation driven by *ideology* or *ecology* within borders (e.g., urban vs. rural moralities within the same nation).

  ### IV. Honest Verdict and the Local-First Default

  **1. Vindication or Scandal?**
  The reproducibility crisis is primarily a **methodological scandal** that leaves the metaethical question of moral objectivity untouched. However, the WEIRD critique is a **correct diagnosis of the generalization error** within that scandal.
  *   It is not the *cause* of the crisis (bad stats and incentives caused the crisis).
  *   It is the *explanation* for the specific pattern of failures in moral psychology (cultural specificity caused the non-replication).
  *   **Verdict:** The crisis vindicates the WEIRD critique as a necessary constraint on theory, but it does not vindicate it as the sole cause of the field's troubles.

  **2. The Local-First Default**
  You proposed the **Local-First Default**: *Any moral-psychology effect should be treated as a description of the sampled folk morality until it survives cross-cultural replication.*

  *   **Implications for the Objectivity Debate:**
      *   Adopting this default forces the field to abandon "Intuition X proves Moral Theory Y" arguments until X is proven universal.
      *   It shifts the burden of proof. Currently, the null hypothesis is often "this is universal." The Local-First Default makes the null hypothesis "this is local."
      *   **Cost:** It slows theoretical progress. It makes it harder to build grand unified theories of moral cognition. It increases the cost of research (requiring multi-site collaboration).
      *   **Benefit:** It prevents the field from exporting Western cultural norms under the guise of science. It produces a more accurate, albeit more fragmented, map of human morality.

  **3. Does the WEIRD Critique Apply Everywhere?**
  No. The WEIRD critique applies poorly to:
  *   **Basic Cognitive Mechanisms:** Attention, memory, and perception are less culturally malleable than moral norms.
  *   **Methodological Rigor:** Pre-registration and power analysis are universal goods; they are not WEIRD-specific fixes.
  *   **Incentive Structures:** The pressure to publish is a feature of the global academic system, not just Western universities.

  **4. A Revised Framework**
  A better framework separates the three layers of the crisis, rather than subsuming them all under WEIRD:
  1.  **Demographic Representativeness (The WEIRD Layer):** Solved by diverse sampling and the Local-First Default.
  2.  **Methodological Rigor (The Stats Layer):** Solved by pre-registration, power analysis, and open data.
  3.  **Incentive Structure (The Sociology Layer):** Solved by rewarding replication and robustness over novelty.

  **Recommendation for the Committee:**
  When deciding on funding, you should apply the **Local-First Default**. If the proposed line of work claims to address "human moral nature" but relies on WEIRD samples without a plan for cross-cultural validation, it is epistemically premature. However, do not conflate this with moral relativism. A failure to replicate across cultures indicates a failure of *psychological universalism*, not necessarily a failure of *moral truth*. You are funding empirical science, not metaethics. The science must be representative to be valid; the ethics remain a separate philosophical question.

  The crisis tells us that we know less about *human* morality than we thought. It does not tell us that morality itself is an illusion. Your committee's decision to withhold funding from a line of work that cannot travel is a defense of scientific rigor, not a judgment on the nature of the good.
