answer: |-
  # Activity Design: "Dana's Lives"

  ## I. Materials & Preparation

  **Materials to Carry:**
  *   **Index Cards (4 sets of 4):** The Four Lives (see below).
  *   **Sticky Notes (2 pads):** One for "Improvement Chits," one for group scratchpad.
  *   **Poker Chips:** 180 total (10 per student).
  *   **Sealed Envelopes (6):** Labeled "Group 1" through "Group 6." Inside each is a **Yardstick Card**.
  *   **Handouts (18):** Double-sided, printed.
  *   **Timer:** Phone or watch.
  *   **Whiteboard Markers.**

  **The Four Lives (Print on Index Cards):**
  *Each card lists Dana's status at age 60.*
  *   **Life A (The Banker):** Financial Security [High], Artistic Achievement [Low], Love & Friendship [Med], Moral Impact [Med].
  *   **Life B (The Artist):** Financial Security [Med], Artistic Achievement [High], Love & Friendship [Med], Moral Impact [Low].
  *   **Life C (The Parent):** Financial Security [Med], Artistic Achievement [Low], Love & Friendship [High], Moral Impact [Med].
  *   **Life D (The Activist):** Financial Security [Low], Artistic Achievement [Med], Love & Friendship [Med], Moral Impact [High].
  *(Note: "High" = Top 10%, "Med" = Average, "Low" = Bottom 10%. No life dominates another; each peaks on one value.)*

  **The Yardstick Cards (Inside Envelopes):**
  *   **Envelope 1 & 4:** "Unit of Account: Lifetime Earnings. Convert all values to dollars. (Art = Potential Royalties, Love = Cost of Raising Family, Moral = Tax Contributions)."
  *   **Envelope 2 & 5:** "Unit of Account: Hours of Intimacy. Convert all values to time with loved ones. (Finance = Hours worked vs leisure, Art = Time in studio, Moral = Time volunteering)."
  *   **Envelope 3 & 6:** "Unit of Account: Lives Changed. Convert all values to number of people positively affected. (Finance = Employees hired, Art = Audience size, Love = Family size, Moral = Direct aid)."

  **The Default Option (Written on Whiteboard):**
  *   **"The Default Job:** $30k/year, Zero Artistic Output, Estranged from Family, No Charitable Impact." (Visibly worse than all 4 Lives on all dimensions).

  ---

  ## II. The Handout (Double-Sided)

  **Side 1: The Task**
  **DANA'S CHOICE**
  Dana is 22. She must choose one path. She cares about four things: Money, Art, Love, Morality. She cannot have it all.
  **RULES:**
  1.  **No Preference:** Do not say what *you* want. Say what is *better for Dana* based on the cards.
  2.  **No Tech Terms:** Do not use words like "incommensurable" or "utility." Use the Verdict Options below.
  3.  **Chip Economy:** You have 10 chips. Unspent chips are wasted at the end. You must spend chips to make your verdict count.
      *   **A is Better / B is Better:** Spend 2 chips.
      *   **Equally Good:** Spend 0 chips.
      *   **Can't Tell (Fact Exists):** Spend 1 chip.
      *   **No Common Measure:** Spend 5 chips. (This blocks the group from ranking them).
  4.  **Refusal Cost:** If your group submits "No Ranking Possible," Dana takes **The Default Job** (see whiteboard).

  **VERDICT FORM (Complete for all 6 pairs: A-B, A-C, A-D, B-C, B-D, C-D)**
  *Circle one per row.*
  | Pair | A Better | B Better | Equally Good | Can't Tell | No Common Measure | Chips Spent |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | A vs B | O | O | O | O | O | ___ |
  | A vs C | O | O | O | O | O | ___ |
  | ... | ... | ... | ... | ... | ... | ... |

  **Side 2: Group Contract**
  1.  **Local Verdicts:** Discuss pairs one by one. Record chips spent.
  2.  **Yardstick:** Open your envelope. Re-rank the lives using *only* that unit.
  3.  **Global Ranking:** Produce one ranked list (1st to 4th). If you cannot, write "No Ranking Possible" and accept the Default Job.
  4.  **Improvement Log:** (For Instructor Use) Record when verdicts flip during chit addition.

  ---

  ## III. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Hook**
  *   **Action:** Arrange chairs into 6 pods of 3. Distribute Life Cards (one set per group), Chips (10 per student), Handouts, and Sealed Envelopes (do not open yet).
  *   **Script:** "Dana must choose a life. Your job is not to choose for her, but to map the structure of her choice. You have chips. Spending them costs you nothing, but keeping them wastes them. Spend them to show how strongly you hold a verdict. Do not open the envelopes yet."

  **00:05 – 00:25: Phase 1 — Local Verdicts (No Scale)**
  *   **Action:** Groups compare pairs (A-B, B-C, C-D, etc.) without a common unit.
  *   **Instructor Role:** Circulate. Listen for "I prefer." Correct immediately: "Not what you prefer. What the cards say." Watch chip spending. If a group marks "Equally Good" without discussion, challenge them: "Does Dana value Money exactly the same as Art? That's a strong claim. Are you willing to bet 0 chips on it?"
  *   **Goal:** Most pairs should be marked "No Common Measure" (costing 5 chips) or "Can't Tell." This drains their chips quickly, forcing them to prioritize which comparisons are truly blocked.

  **00:25 – 00:40: Phase 2 — Mandated Yardsticks**
  *   **Action:** "Open your envelopes." Groups must re-evaluate the pairs using *only* their assigned unit (Dollars, Hours, or Lives Changed).
  *   **Instructor Role:** Ensure they don't mix units. If Group 1 (Dollars) says Art is worthless, let them. If Group 2 (Hours) says Money is worthless, let them.
  *   **Goal:** Groups 1, 2, and 3 will produce different rankings. This demonstrates that a "correct ranking" requires an arbitrary choice of scale.

  **00:40 – 00:50: Phase 3 — Global Ranking & Refusal**
  *   **Action:** Groups must assemble a 1-4 ranking. They can use their Yardstick or their Local Verdicts.
  *   **Constraint:** If they submit "No Ranking Possible," Dana gets the Default Job.
  *   **Instructor Role:** Pressure the groups. "You have 5 minutes. If you don't rank, Dana gets the Default Job. Is that fair?"
  *   **Goal:** Force the collision. To avoid the Default Job, they must either (a) accept their arbitrary Yardstick or (b) contradict their "No Common Measure" verdicts from Phase 1.

  **00:50 – 01:00: Phase 4 — Small Improvements (Plenary)**
  *   **Action:** Bring class back together. Pick one pair most groups called "No Common Measure" (e.g., A vs B).
  *   **Mechanic:** Hold up Life A. Hold up Life B. Add a sticky note to Life B: "+$1,000/year." Ask: "Is B better now?" (Likely No). Add "+$10,000." Ask again. Continue until a student says "Yes, now B is better."
  *   **Crucial Question:** "What changed between the last 'No' and the first 'Yes'? Did the values change, or did you just get tired?"

  **01:00 – 01:15: Debrief (See Section IV)**
  *   **Action:** Whiteboard discussion. Map activity to theory.
  *   **Early Finishers:** If a group finishes Phase 3 early, give them the "Improvement Chits" and ask them to find the breaking point for A vs B before the plenary.

  ---

  ## IV. The Debrief (Three Parts)

  ### Part 1: Mapping the Distinctions
  *   **Minute 20 (Local Verdicts):** This produced the **Epistemic vs. Ontological** distinction.
      *   *Ask:* "Who marked 'Can't Tell' vs 'No Common Measure'?"
      *   *Point:* 'Can't Tell' means there is an answer you lack. 'No Common Measure' means there *is* no answer. The chip cost (1 vs 5) forced you to feel the weight of that claim.
  *   **Minute 35 (Yardsticks):** This showed **Common Scale as Artifact.**
      *   *Ask:* "Group 1, what was your #1? Group 2, what was yours?"
      *   *Point:* You got different answers from the same lives. The "correct ranking" didn't exist in the cards; it existed in the envelope. The scale was imposed, not discovered.
  *   **Minute 55 (Improvements):** This tested **Transitivity & Sorites.**
      *   *Ask:* "At what dollar amount did A become better than B?"
      *   *Point:* If a tiny amount flips the verdict, were they ever truly incomparable? Or does incomparability vanish under sufficient pressure?
      *   *Two Ways Out:*
          1.  **The Threshold View:** There is a precise point where incomparability turns to betterness. (Cost: Implies moral precision that feels fake).
          2.  **The Collapse View:** They were never incomparable; you just couldn't see the trade-off rate until forced. (Cost: Denies the phenomenology of the hard choice).

  ### Part 2: Predictable Failures & In-the-Moment Fixes
  *   **Failure:** "This is pointless, it's just preference."
      *   **Fix:** "Dana isn't you. Look at the cards. If Dana values Morality, Life D is objectively higher on that metric. Stick to the text."
  *   **Failure:** Group uses Money even if Envelope says "Hours."
      *   **Fix:** "Check your envelope. If you use Money, your ranking is invalid. You are cheating Dana."
  *   **Failure:** One student dominates the verdict.
      *   **Fix:** "Show me the chips. Did everyone spend? If Sarah spent 5 chips and you spent 0, Sarah's verdict counts double. Spend your chips or lose your voice."
  *   **Failure:** "It depends on which Dana."
      *   **Fix:** "Dana is fixed. The cards are fixed. You are judging the lives, not the person."
  *   **Failure:** Treating Chits as measurement error ("Maybe we miscounted the money").
      *   **Fix:** "The chit is exact. The question is: does adding money to an Art life make it a *better life*, or just a *richer Art life*?"
  *   **Failure:** Wildly different group speeds.
      *   **Fix:** Fast groups get the "Improvement Chits" early. Slow groups get a 2-minute warning to force a "Default Job" decision.

  ### Part 3: Limitations & Instructor Supplement
  *   **Ontology (Values vs. Us):** The activity produces the *feeling* of incommensurability, but it cannot prove whether the block is in the world (values) or in us (cognitive limits).
      *   *Supplement:* You must tell them: "Realists say the values don't line up. Projectivists say we refuse to line them up. The game feels the same either way."
  *   **Stakes (Real Life vs. Proxy):** This is a 20-minute game. Real hard choices constitute the person over years.
      *   *Supplement:* "In the game, you walk away unchanged. In reality, choosing the Artist life *makes* Dana an artist. The regret isn't just about the outcome; it's about the self she didn't become."
  *   **Corruption (Pricing the Priceless):** The Yardstick exercise asks students to do what some philosophers say is forbidden (pricing Love/Morality).
      *   *Supplement:* "You felt discomfort putting a dollar value on 'Love' in Envelope 1. That discomfort is the data. If a view says 'Don't do that,' your anger at the envelope is evidence for that view. The game forces the violation so you can feel the cost of the violation."

  ---

  ## V. Instructor Notes on Chip Mechanics (Honesty Check)

  **Can chips distinguish "Tied" from "Incomparable"?**
  *   *Yes, but imperfectly.* A student might spend 0 chips on "Equally Good" because they are indifferent, not because they believe in strict equality.
  *   *Mitigation:* In the debrief, ask: "Did anyone spend 0 chips because you didn't care, vs 0 chips because you believed they were truly identical?"
  *   *The "No Common Measure" Cost:* By setting the cost at 5 chips (half their budget), you ensure they only claim incommensurability on the pairs they feel most strongly about. If they claim it on all 6 pairs, they run out of chips and can't vote on the Global Ranking. This forces them to prioritize *which* values are incomparable.

  **What the Activity Cannot Reproduce:**
  *   It cannot reproduce the **constitutive nature of choice**. In the game, Dana is static. In reality, choosing the Activist life makes Dana an activist.
  *   It cannot reproduce **temporal regret**. The game ends at 75 minutes. Real hard choices haunt us for decades.
  *   It cannot settle **Metaphysics**. It creates structural pressure, but doesn't prove Incommensurability is real.

  **Converting Discomfort into Evidence:**
  *   When students complain during the Yardstick phase ("You can't put a price on friendship!"), stop the class.
  *   **Say:** "Hold that thought. That anger is the philosophical point. If some values resist pricing, then the 'Rational Choice' model that requires pricing is missing something. Your discomfort is the argument."
