answer: |-
  Here's the run-sheet. I've tweaked the mechanics slightly to ensure the game doesn't stall out in the first 5 minutes (if everyone fails Round 1, the energy dies). The goal is to make them *feel* the anxiety of the regress, not just simulate it.

  **Time:** 75 Minutes
  **Class Size:** 12–14
  **Materials:**
  *   Index cards (2 per student)
  *   Poker chips or colored paper squares (10 per student) = **"Cognitive Energy"**
  *   Ball of yarn or string (1 per round)
  *   Masking tape (to mark floor spots)
  *   Whiteboard (for tallying "Survivors" only, no theory yet)

  ---

  ### Phase 1: Setup (5 Minutes)
  **Do not explain epistemology.** Do not use words like "foundationalism" or "coherentism."

  1.  **Hand out materials:** Each student gets 10 tokens, 1 Belief Card, and 1 empty "Status Card."
  2.  **The Belief Cards:** Write a mundane claim on each (e.g., "It is raining," "2+2=4," "Murder is wrong," "That chair exists").
      *   *Secret Prep:* On 3 of the 14 cards, draw a small **Star** in the corner. Do not tell them what the Star means yet. These are your "Basic Beliefs."
  3.  **The Rule:** "Your goal is to keep your Belief Card **Active**. An Active card requires a justification link. Links cost tokens. If you run out of tokens, your card collapses. If your card collapses, you sit down. Standing = Justified. Sitting = Unjustified."
  4.  **The Transaction:** To justify your belief, you must physically hand a token to another student and tie a piece of yarn between your wrists (or just hold the string).
      *   **Cost:** 1 Token from *you* (the seeker) + 1 Token from *them* (the provider) to "verify" the link.
      *   **Exception:** If the provider has a **Star** card, they do *not* need to spend a token to verify. They are self-justifying. (Keep this rule secret until Round 1 starts).

  ---

  ### Phase 2: The Rounds (45 Minutes Total)

  #### Round 1: The Linear Regress (15 Minutes)
  **Setup:** Arrange students in a single-file line (or two rows of 7). They can only interact with the person directly to their **left**.
  **Rule:** "You must secure support from your left. If you are at the far left end, you have nowhere to go."
  **The Twist:** Reveal the **Star Rule** now. "If the person to your left has a Star, the chain stops there. You pay 1 token, they pay 0. If they don't have a Star, they must also justify to *their* left, costing both of you tokens."
  **Action:** Start the timer. They must trace the chain back.
  *   *What happens:* Most chains will hit a non-Star person who can't justify further left. Tokens drain rapidly. The 3 students with Stars become bottlenecks.
  *   **End State:** Count how many are still standing. Write the number on the board. Reset tokens (give everyone 5 back).

  #### Round 2: The Coherent Circle (15 Minutes)
  **Setup:** Arrange students in a tight circle.
  **Rule:** "You may only link to immediate neighbors (left or right). You must form a closed loop to stabilize."
  **The Twist:** "If your link is part of a closed circle (no loose ends), the maintenance cost is **0 tokens** per minute. If your link has a loose end (an open chain), it costs **2 tokens** per minute to hold."
  **Action:** Students will realize that linking linearly drains them. They must scramble to close the circle.
  *   *What happens:* They will feel the relief of closing the loop (cost stops), but also the fragility. If one person drops out (runs of tokens), the whole circle breaks for everyone connected.
  *   **End State:** Count survivors. Write on board. Reset tokens.

  #### Round 3: The Infinite Web (15 Minutes)
  **Setup:** Free movement. Open classroom space.
  **Rule:** "You can link to anyone. However, justification cost scales with distance."
  **The Twist:** "Linking to someone within arm's reach = 1 token. Linking to someone across the room = 2 tokens. Linking to someone you have to shout to = 3 tokens. Every time you add a link to a link (2nd degree), the cost doubles."
  **Action:** This creates an "Infinitist" pressure. They can theoretically keep linking forever, but the token cost becomes exponential.
  *   *What happens:* Chaos. Students will try to find "cheap" justifications nearby, but those people run out of tokens. They realize that infinite extension is theoretically possible but practically bankrupting.
  *   **End State:** Count survivors. Write on board.

  ---

  ### Phase 3: The Debrief (25 Minutes)
  *This is where you do the philosophy. Get them in a circle. Sit the "collapsed" students in the middle—they have the best view of the structural failure.*

  **1. Map the Experience (10 mins)**
  Ask: "In Round 1, where did the anxiety come from?"
  *   *Target Answer:* Hitting the end of the line / Not knowing who had the Star.
  *   **Reveal:** "Round 1 was **Foundationalism**. The 'Star' cards were Basic Beliefs. The anxiety you felt was the regress problem. If the foundation is arbitrary (randomly assigned Stars), does it actually justify you?"

  Ask: "In Round 2, did the circle feel stable or flimsy?"
  *   *Target Answer:* Stable while holding, but if one person failed, we all failed.
  *   **Reveal:** "Round 2 was **Coherentism**. The 'closed loop' stopped the token drain. But notice: the support was mutual, not anchored. Does a circle of friends vouching for each other actually make them honest?"

  Ask: "In Round 3, why didn't anyone keep going forever?"
  *   *Target Answer:* Too expensive. Exhausting.
  *   **Reveal:** "Round 3 was **Infinitism**. Theoretically, you could have kept linking. But the 'cost' (cognitive load) made it impossible to sustain. Is a justification useful if it takes infinite energy to maintain?"

  **2. The Structural Cost (10 mins)**
  Drive this home: "You didn't choose these positions based on truth. You chose them based on **resource management**."
  *   Foundationalism saves tokens but risks arbitrariness (What if I didn't get a Star?).
  *   Coherentism saves tokens but risks isolation (What if our circle is wrong?).
  *   Infinitism is honest but bankrupt (You ran out of tokens).
  *   **Key Takeaway:** Epistemology isn't just about what's true; it's about where you're willing to pay the cost of justification.

  **3. Limitations & Failure Points (5 mins)**
  Be honest about where the game lied to them.
  *   **The Normative Gap:** "In Round 2, the circle *worked* mechanically. But in philosophy, circular reasoning is often called vicious. The game couldn't simulate *truth*, only *stability*."
  *   **The Token Problem:** "Tokens represent cognitive energy, but in real life, some justifications are 'free' (like logical truths) and some are 'expensive' (empirical science). The game flattened that."

  ---

  ### Troubleshooting: What Will Go Wrong
  I've run variations of this. Here's where it breaks:

  1.  **Token Hoarding:** Students will refuse to spend tokens in Round 1, fearing the end of the line.
      *   *Fix:* Tell them, "If you don't spend a token to link by Minute 2, your card auto-collapses." Force the action.
  2.  **The "Cheating" Intuition:** In Round 2, students will refuse to close the circle because "circular logic is wrong." They'll sit down on principle.
      *   *Fix:* Pre-empt this. "In this game, physics overrides logic. If the loop closes, the cost stops. Don't argue philosophy yet, just survive the round."
  3.  **Round 1 Bottleneck:** If the 3 "Star" cards are all at the right end of the line, the left side fails instantly.
      *   *Fix:* Pre-arrange the line so Stars are distributed (1st, 7th, 14th position) before they sit down.
  4.  **The "Sit Out" Risk:** You mentioned having collapsed students sit out the debrief. **Don't do this.** If 50% of your class sits out, your debrief dies.
      *   *Alternative:* If they collapse, they become **"Skeptics."** They get a red card. They can't speak during the round, but in the debrief, their job is to point out where the chains broke. This makes failure a role, not a punishment.

  ### Why This Works
  It bypasses the "theoretical immunity" upper-level students have. They can argue with a text, but they can't argue with the physical sensation of running out of chips while holding a string. When you finally name "Foundationalism," they won't think of a definition; they'll think of the anxiety of waiting for the person to their left to produce a Star card. That's the visceral hook you need.

  Good luck. Run it tight, keep the timer visible, and don't explain the theory until the very end.
