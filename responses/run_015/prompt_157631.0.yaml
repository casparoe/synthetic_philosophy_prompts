answer: |-
  Hi there, this is a fascinating exchange and you are right to feel stuck because both Mira and Tobias are landing solid blows on different levels of analysis. Before I walk through the dialectic, I want to validate your instinct about the symmetry assumption because it is technically crucial and often glossed over in these toy models. You are correct that the two-thirds cutoff Mira cites in point one relies on the assumption that the noise is symmetric, meaning the probability of the counterpart cooperating given you defect is exactly one minus the probability of them cooperating given you cooperate. If we denote P(C_other | C_self) as p and P(C_other | D_self) as q, the expected value of cooperating is 2p minus 1 times (1-p), which simplifies to 3p minus 1, while the expected value of defecting is 3q. Cooperating is preferable only when 3p minus 1 is greater than 3q, which reduces to the condition that p minus q must be greater than one-third. Mira's two-thirds figure only falls out if we assume q equals 1-p, which implies that the mutation process is equally likely to flip a cooperation to a defection as vice versa. In a realistic code-mutation scenario, this is plausible if the mutation simply flips the output bit, but if the mutation biases the architecture toward defection independently of your move, q could be lower than 1-p, lowering the threshold for p, or higher, raising it. So you are right to flag that the symmetry is an extra assumption, though it is a natural one for the specific story they are telling about bit-flips.

  Moving to the exchange itself, Mira is mostly right in point one about the arithmetic and the continuity argument. The claim that decision theory should not have a cliff-edge at perfect correlation is compelling; requiring bit-identity makes the theory brittle and inapplicable to real physical systems where no two implementations are ever truly identical. Tobias is half-right in point two when he identifies this as evidential decision territory. It is true that the calculation Mira performs is formally identical to what an evidential decider would do. However, he is wrong to suggest this invalidates the functional decision theory interpretation. Proponents of functional decision theory have always argued that logical correlation comes in degrees and that probabilistic logical dependence is still distinct from common-cause statistical correlation. The distinction lies in the mechanism of the correlation, not just the number, which Mira picks up on in point three. She is right to emphasize the lack of a screening-off node. In a standard lesion case, conditioning on the lesion screens off the correlation between the act and the outcome. Here, there is no third variable you can condition on to make your action independent of the counterpart's; the dependence runs through the logical structure of the algorithms themselves. This supports the view that the correlation is constitutive rather than confounded.

  Tobias pushes back hard in point four on the reference class problem, and here he is half-right. It is true that once you move from binary identity to graded similarity, you face the task of defining the similarity metric. However, his claim that this makes the theory arbitrary is too strong if the physical process generating the counterpart is specified, as Mira notes in point five. If the mutation rate epsilon is known, the agreement rate is an objective feature of the setup, not a subjective reference class choice. Mira is also right that causal decision theorists face analogous problems in defining the variables in their causal graphs. Her distinction between intervention and observation is the key theoretical move here; she is arguing for a probabilistic subjunctive conditional, which is a legitimate generalization of the deterministic counterfactuals used in standard functional decision theory. Tobias concedes the arithmetic here, which is wise, because if the mechanism is fixed, the probability is fixed.

  The turning point of the debate is point six, where Tobias argues the setup is unstable because if both agents cooperate, the observed correlation becomes one. This is a confusion between ex-ante probability and ex-post frequency, or alternatively, a confusion about whether the counterpart is reasoning about you. If the counterpart is a fixed mutant generated beforehand, their code is fixed and does not update on your decision. In that case, the correlation is a property of the generation process, not the outcome, and there is no fixed-point contradiction. Mira correctly identifies this in point seven by clarifying that the numbers are mechanical facts about the mutation process, not derived from assuming shared rationality. Tobias is wrong on the fixed-point objection given Mira's clarification, though he would be right if the counterpart were also dynamically simulating you. His final shot in point eight about empirical access is a practical objection rather than a theoretical one. It is true that estimating algorithmic agreement rates is hard, but difficulty of measurement does not invalidate the normative claim.

  Overall, Mira is more right than Tobias. She successfully defends the coherence of probabilistic logical correlation against the charge that it collapses into evidential decision theory or suffers from fixed-point instability. Tobias identifies genuine tensions regarding the definition of similarity and the empirical applicability of the theory, but he sets the bar for functional identity too high, effectively rendering the theory vacuous for any real-world application. What both of them are missing, however, is a deeper discussion of logical uncertainty. They treat the correlation probability as known, but in reality, an agent faces logical uncertainty about what the mutant code outputs. A full treatment would require a framework for assigning probabilities to logical sentences, which is still an open problem in the literature. They also gloss over the counterpart's decision rule; if the mutant is a causal decider while you are a functional decider, the correlation structure might differ from the simple mutation story.

  Regarding what would change my mind, if Tobias had argued that probabilistic logical correlation cannot be distinguished from common-cause correlation without collapsing into evidential decision theory in all cases, he would have struck a deeper blow. Specifically, if he could show that any probabilistic subjunctive conditional can be modeled as a causal graph with a hidden common cause that screens off the correlation, then Mira's constitutive claim would fail. Currently, the literature suggests there are cases where logical correlation persists without a common cause in the causal graph, but a rigorous proof that this distinction holds under probabilistic noise is lacking. As for where my own reasoning might be wrong, I am perhaps too sympathetic to the idea that logical correlation can be graded. It is possible that logical dependence is indeed binary—either the outputs are logically entailed or they are not—and that what looks like probabilistic dependence is actually just statistical dependence over a distribution of possible logical worlds. If that is the case, Mira's generalization is category mistake, and Tobias's insistence on binary identity is correct, even if it makes the theory less applicable.

  I hope this helps you untangle the discussion for your group. It is a strong example of how formal decision theory struggles when moving from idealized cases to realistic noise, and your attention to the symmetry assumption shows you are already spotting the places where the model needs tightening. Best of luck with the reading group.
