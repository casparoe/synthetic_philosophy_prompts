  ### 1. Purpose and Angle

  This taxonomy is designed for a graduate metaphysics seminar to sort participants by their actual ontological commitments regarding dispositions, rather than the historical labels they might adopt. By focusing on the interaction of finking and masking with composite and artificial systems, the exercise reveals hidden inconsistencies in students' positions. Standard debates often stall over terminology; this tool bypasses such disputes by testing responses to concrete edge cases. The inclusion of artificial and institutional scenarios ensures that commitments are robust across both natural and constructed domains. The aim is to map the logical space of dispositional realism, highlighting where views collapse into eliminativism or incoherence when pressed on systematic masking and internal interrupters. Ultimately, it exposes whether a student's realism is robust enough to handle complex systemic behaviours or whether it retreats to categorical bases under pressure.

  ### 2. The Decision Tree

  **Node 1 (Root):** Do genuine dispositions exist that can remain unmanifested?
  *   **No:** Proceed to Leaf 1.
  *   **Yes:** Proceed to Node 2.

  **Node 2 (Fink/Conditional):** Consider a robotic arm programmed to grasp objects, equipped with an internal safety override that disables the motor upon contact. Does the conditional statement 'If the arm contacts an object, it will grasp it' remain true?
  *   **Yes:** Proceed to Leaf 2.
  *   **No:** Proceed to Node 3.

  **Node 3 (Mask):** Consider a soluble pill coated in an impermeable shell that prevents dissolving without destroying the chemical structure. Does the pill retain the disposition of solubility while coated?
  *   **No:** Proceed to Leaf 3.
  *   **Yes:** Proceed to Node 4.

  **Node 4 (Composite):** Consider a committee with a formal disposition to approve funding, systematically masked by a quorum rule requiring full attendance. Does the committee possess this disposition despite the internal rule preventing manifestation?
  *   **Yes:** Proceed to Leaf 4.
  *   **No:** Proceed to Node 5.

  **Node 5 (Essentialism):** Given widespread masking in natural and artificial domains, is dispositional essentialism (the view that properties like fragility are essential to objects) still tenable?
  *   **No:** Proceed to Leaf 5.
  *   **Yes:** Proceed to Leaf 6.

  **Leaves:**
  1.  **Anti-realist Eliminativism:** Dispositions do not exist; only categorical bases remain.
  2.  **Naive Conditional Analysis:** Dispositions are fully analysed by conditionals, even in fink cases.
  3.  **Hybrid View:** Dispositions exist only where neither finking nor masking is structurally guaranteed.
  4.  **Collective Dispositionalism:** Dispositions genuinely belong to composites and are not reducible to parts.
  5.  **Bare Dispositional Realism:** Dispositions are irreducible properties but not essential given widespread masking.
  6.  **Mask-tolerant Dispositional Realism:** Dispositions survive masking and remain essential properties despite finking.

  ### 3. Logical Space Mapping

  The table below maps the six occupied paths (Y/N sequence from Nodes 1–5). All other 26 theoretical combinations are unoccupied.

  | Path | N1 | N2 | N3 | N4 | N5 | Position |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | N | - | - | - | - | Eliminativism |
  | 2 | Y | Y | - | - | - | Naive Conditional |
  | 3 | Y | N | N | - | - | Hybrid View |
  | 4 | Y | N | Y | Y | - | Collective |
  | 5 | Y | N | Y | N | N | Bare Realism |
  | 6 | Y | N | Y | N | Y | Mask-tolerant |

  **Diagnosis of Unoccupied Combinations:**
  The remaining combinations are diagnosed by their structural error type:
  *   **Incoherent (14 combinations):** Affirming dispositions (N1=Y) while denying they can exist unmanifested or accepting conditional analysis despite fink failure (N1=Y, N2=Y, but denying Node 2 case specifics). Also includes denying masking effects while affirming masks remove dispositions.
  *   **Unattractive/Ad Hoc (8 combinations):** Accepting composite dispositions (N4=Y) while denying individual parts possess bases, or accepting essentialism (N5=Y) while denying dispositions survive masking (N3=N). This creates a fragile essentialism vulnerable to simple coatings.
  *   **Unexplored (4 combinations):** Affirming bare realism (N5=N) while accepting composite possession (N4=Y). This suggests collective properties are contingent whilst individual ones are not, a view lacking current defence.

  ### 4. Unresolvable Pairs and Limits

  The tree cannot genuinely separate **Bare Dispositional Realism** and **Mask-tolerant Dispositional Realism** using standard physical examples alone. Both positions answer 'Yes' to the existence of unmanifested dispositions, 'No' to the conditional analysis surviving finks, and 'Yes' to dispositions surviving masking. They converge on cases like a fragile glass wrapped in bubble wrap; both agree the glass remains fragile. The split occurs only at Node 5 regarding *essentialism*, which is a modal claim about property identity rather than a direct observation of disposition behaviour. Consequently, a student holding either view will traverse the same path through Nodes 1–4. To distinguish them, the seminar must introduce further distinctions concerning the necessity of property identities across possible worlds, which falls outside the scope of this behavioural taxonomy. Thus, on standard physical examples, these leaves collapse into a single operational path.

  ### 5. Seminar Use Notes

  Administer this taxonomy anonymously. Present the robotic arm and committee cases as neutral thought experiments without mentioning 'fink' or 'mask'. Ask students to record their Yes/No answers privately before revealing the leaf positions. Ensure the institutional case is described formally (e.g., 'procedural veto rules') to avoid emotional bias regarding human agency. Do not reveal the position names until all students have reached a leaf. This prevents label-driven sorting and ensures commitments drive the classification. Use the logical space map to highlight empty cells during discussion, challenging students to defend why certain combinations remain unoccupied.
