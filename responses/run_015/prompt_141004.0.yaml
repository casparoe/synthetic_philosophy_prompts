          *   *Definition:* An event is a "Nail" (contingent) only if no other plausible event could have triggered the same outcome within a defined historical window (e.g., 5 years). If another trigger was waiting, the outcome is "Loaded Gun" (determinate).
          *   *Tie to Cases:* 1914 (War = Loaded Gun, Assassination = Nail for *timing*). 1962 (War = Nail, because de-escalation was possible). Challenger (Disaster = Loaded Gun).
          *   *Forced Abandonments:* Must abandon the idea that 1962 is exactly like 1914. In 1914, the system *wanted* to break. In 1962, the system *resisted* breaking.
      *   **Candidate Principle 2: The Specificity of Outcome.**
          *   *Definition:* Distinguish between the *class* of outcome (War, Discovery) and the *specific instantiation* (Great War vs. Local War, Penicillin Mass Production vs. Lab Curiosity).
          *   *Tie to Cases:* Penicillin (Discovery = Loaded Gun, Credit/Medical Revolution = Nail). 2000 Election (Winner = Nail, Political Polarization = Loaded Gun).
          *   *Forced Abandonments:* 2000 Election isn't "boring." It's a high-specificity nail.
      *   **Applying to New Cases:**
          *   *2008 Crash:* Substitutability says "Loaded Gun" (derivatives, housing bubble). Specificity says "Nail" (Lehman timing). Verdict: Loaded Gun.
          *   *2019 Pandemic:* Substitutability is tricky. Zoonotic spillovers are frequent. *But* global connectivity makes a pandemic likely. Verdict: Loaded Gun (Pandemic) + Nail (Specific Virus/Timing). Compare to 1914 (War) not Penicillin (Discovery).
      *   **Scope Warning:**
          *   30 pages is tight. Defining "counterfactuals" is a哲学 (philosophical) rabbit hole. Need to limit the *number* of cases or the *depth* of philosophical definition. Don't try to solve determinism; try to categorize historical narratives.

  5.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* The student's "Threshold" principle was actually good but needed the "Substitutability" add-on.
      *   *Correction:* I should refine their existing principle rather than giving two totally new ones, or offer one that synthesizes their intuition. Let's offer **The Principle of Causal Redundancy** (Determinism) vs. **The Principle of Critical Juncture** (Contingency).
      *   *Actually, let's stick to the prompt:* "One or two candidate principles."
      *   *Principle 1: The Redundancy Test.* (Focus on the Outcome). If the outcome occurs anyway via a different trigger, the trigger is not a Nail for the *outcome*, only for the *timing*.
      *   *Principle 2: The Branching Test.* (Focus on the Path). If the event creates a new path that cannot be returned from (Path Dependence), it is a Nail for the *narrative*.
      *   *Wait, the Penicillin case is about "Credit."* That's about *attribution*, not just outcome. I need to make sure the principle handles "Who gets credit" vs "What happens."
      *   *Let's simplify.* The core tension is **Robustness of Outcome** vs. **Fragility of Path**.
      *   *Principle 1 (Robustness):* The "Loaded Gun" Metric. (Determines if the *event* matters).
      *   *Principle 2 (Fragility):* The "Butterfly" Metric. (Determines if the *specifics* matter).

      *   *Decision:* I will propose **The Principle of Causal Substitutability** (for outcomes) and **The Principle of Path Dependence** (for narratives/credit). This cleanly separates the supervisor's two claims.

      *   *Re-evaluating 1962:* If Arkhipov says yes, does nuclear war happen? Most historians say yes. If he says no (which he did), war is avoided. Is there another trigger? Maybe. But the *system* wasn't primed to fire automatically like 1914 alliances. 1914 had mobilization timetables. 1962 had human decision loops. This is the key distinction. 1914 = Automatism. 1962 = Agency.
