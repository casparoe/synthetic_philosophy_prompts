      *   *Case 7 (Asteroid):* Mammals = Fragile. Asteroid = External shock (not a "nail"). *Verdict:* Exogenous vs. Endogenous.

      *   *The Core Tension:* The student is struggling between *Causal Sensitivity* (Butterfly Effect) and *Structural Determinism* (Inevitability). The supervisor is right: "Small cause, big effect" $\neq$ "Unpredictable outcome." You can have a small cause trigger a big effect that was *going to happen anyway* (just differently), OR a small cause can prevent an outcome that was *likely* (Arkhipov).

