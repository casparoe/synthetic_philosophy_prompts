      *   Literary register? Yes.
      *   No citations/quotes? Yes.

  6.  **Final Polish:** Ensure the flow is smooth and the tone is consistent. The phrase "specious present" is a philosophical term, maybe avoid specific jargon if it feels too academic, but "conventional boundary" is good. The ending feels appropriately Borgesian—quiet and metaphysical.

