      *(Final thought on the Strongest Reading)*: The prompt asks for the reading where the accountant is "right in a way the reader won't enjoy." This suggests the logic is sound but the implications are harsh. The harsh implication of NTWR is usually that *non-payers shouldn't vote*. If the accountant argues NTWR to *include* non-citizens, the uncomfortable flip side is *excluding* citizen non-payers. That creates the tension.

