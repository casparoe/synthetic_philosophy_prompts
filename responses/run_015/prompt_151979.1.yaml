prompt: |-
  hey so im a phd student in environmental humanities and im running a one-off session for a cross-disciplinary reading group—mostly lit and anthro grads, one history person. weve been circling this idea of germs, climate, and volcanoes as historical actors, and i want to teach the distinction between actual historical agency and just saying climate caused everything. i want to build the session around the 1783 laki fissure eruption and how it disrupted french grain markets not because the volcano had intentions but because pre-existing tax-farming and trade infrastructures turned the ash cloud into a specific kind of famine event. plan the teaching arc for me: the order the ideas have to come in so that agency doesnt collapse into determinism, the carrying example and exactly what it needs to have and lack, the misconceptions theyll show up with—probably that agency requires consciousness or that this is just environmental determinism with extra steps—where in the sequence i should cut each one off, and one check question at the end that tells me whether they actually understand the distinction or just feel bad about nature. also tell me what part of actor-network theory i should flat out refuse to explain at this level, and write the whole thing in continuous prose, no headings or bullet points, just like an email.
