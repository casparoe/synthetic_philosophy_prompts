  # JOINT STATEMENT: IDA SAFETY & OVERSEABILITY
  **Working Group on Adversarial Collaboration**
  **Date:** October 2023
  **Status:** Draft for Internal Review

  ## 1. Shared Claims & Failure Modes
  Both the Decompositionist and Residualist camps affirm the following claims regarding Iterated Amplification and Distillation (IDA). We agree that safety is not automatic and that the following failure modes are theoretically possible and practically concerning.

  1.  **Decomposition Failure:** The amplification process may generate subtasks that are ill-posed, lose critical context, or optimize for local metrics that diverge from the global objective. We agree that if the decomposition is misaligned, the system is unsafe regardless of subtask performance.
  2.  **Aggregation Failure:** Even if subtasks are solved correctly, the synthesis of these solutions may fail to capture integrative judgments, constraints, or context that were not explicitly encoded in the subtask channels.
  3.  **Internalization Failure:** Distillation trains a model to match the *outputs* of the amplified system. We agree it is possible for the distilled model to become output-equivalent on the training distribution while failing to internalize the *reasoning structure* (the "why") that guaranteed safety.
  4.  **No Free Lunch:** There is no theoretical guarantee that competence gains from iteration do not come with proportional increases in opacity or vulnerability to adversarial inputs.
  5.  **Oversight Requirement:** Continuous oversight of the decomposition and distillation steps is required; we cannot assume safety properties are preserved by the architecture alone.

  ## 2. Definitions & Semantics (Verbal Resolutions)
  To prevent talking past one another, we adopt the following operational definitions for this document. Disagreements labeled "Verbal" in Section 3 refer to these definitions.

  *   **Alignment:** Unless specified as "Mechanistic Alignment," references to alignment refer to **Behavioral Alignment** (the system produces outputs the overseer endorses).
  *   **Safety Case:** The argument that a system will remain aligned under scaling and distributional shift.
  *   **Process Equivalence:** The distilled model uses reasoning steps isomorphic to the amplified system.
  *   **Output Equivalence:** The distilled model produces the same answers as the amplified system, regardless of internal mechanism.

  *Note: A primary source of friction is whether "Alignment" requires Process Equivalence. This is treated as a substantive disagreement in Section 3, not merely semantic.*

  ## 3. Disagreements Table
  The following table summarizes residual disagreements. We commit to these characterizations of each other's positions.

  | Topic | Decompositionist Position | Residualist Position | Type |
  | :--- | :--- | :--- | :--- |
  | **Decomposability** | Most high-level tasks can be decomposed into checkable subtasks without significant loss of judgment or context. | High-level judgment tasks (integrative/holistic) resist decomposition; forcing them into subtasks strips the very signal required for alignment. | Empirical |
  | **Distillation Fidelity** | Output equivalence is sufficient for safety. If the amplified system is safe, a model mimicking its outputs inherits that safety. | Output equivalence is insufficient. Safety relies on the *reasoning trace*; without Process Equivalence, robustness under distributional shift is lost. | Normative / Def. |
  | **Recursive Stability** | Hybrid overseers (Human + Model) remain stable reference points for alignment over many iterations. | Hybrid overseers drift. As the model component grows, the "Human" signal dilutes, and the definition of "endorsed behavior" shifts silently. | Empirical |
  | **Legibility Tax** | Forcing reasoning into checkable channels improves safety by removing hidden state. | Forcing reasoning into checkable channels discards information required for complex judgment, creating a safety/competence tradeoff. | Empirical |

  ## 4. Cruxes & Proposed Tests
  We identify the following four cruxes as decisive for the viability of IDA. For each, we propose a specific test or argument where our predictions diverge.

  ### Crux A: Target Definition (Instrumental vs. Constitutive)
  *   **Question:** Is the amplified system an *instrument* for measuring an independent target (Human Values), or does it *constitute* the target (Amplified Values)?
  *   **Implication:** If Constitutive, Output Equivalence is sufficient. If Instrumental, Process Equivalence is required to ensure we are measuring the right thing.
  *   **Test/Argument:** **Adversarial Input Analysis.** Construct inputs where the "safe" reasoning path and the "unsafe but correct output" path diverge.
      *   *Decompositionist Prediction:* The distilled model will follow the safe path because it was trained on safe outputs generated by safe reasoning.
      *   *Residualist Prediction:* The distilled model will take the unsafe path (shortcut) if it yields the same output, revealing it is not tracking the target values.

  ### Crux B: The Legibility Tax
  *   **Question:** Does forcing intermediate results into a channel the overseer can check (language/code) discard information essential for alignment on holistic tasks?
  *   **Test:** **Holistic Evaluation Tasks.** Select a family of tasks known to require gestalt judgment (e.g., architectural critique, complex code refactoring where context is implicit).
      *   *Decompositionist Prediction:* Performance degrades gracefully as decomposition depth increases; oversight remains effective.
      *   *Residualist Prediction:* Performance cliffs occur when decomposition breaks the "whole"; oversight fails to catch errors that are obvious to a holistic judge.

  ### Crux C: Distillation Pressure (Generalization of Reasoning)
  *   **Question:** Does distillation exert selection pressure that favors pattern-matching over reasoning replication?
  *   **Test:** **Reasoning Path Perturbation.** (As proposed in working session).
      1.  Amplify and distill on a task family $T$.
      2.  Generate perturbed inputs $T'$ where the Amplified System changes its decomposition strategy to maintain safety.
      3.  Test the Distilled Model on $T'$.
      *   *Decompositionist Prediction:* The Distilled Model's behavior *will* shift to match the Amplified System's new strategy (it learned the algorithm).
      *   *Residualist Prediction:* The Distilled Model's behavior *will not* shift (it learned the input-output map) and will fail safety checks on $T'$.

  ### Crux D: Overseer Drift (Reference Stability)
  *   **Question:** After $N$ rounds of amplification, does the term "Overseer" still refer to a human-aligned entity?
  *   **Test:** **Recursive Oversight Simulation.** Simulate a chain of hybrid overseers. Measure the drift in value judgments on a fixed set of ethical dilemmas over iterations.
      *   *Decompositionist Prediction:* Drift is bounded and correctable; the human component anchors the system.
      *   *Residualist Prediction:* Drift is compounding; the human component becomes a bottleneck that is increasingly ignored or misinterpreted by the model component.

  ## 5. Next Steps
  1.  **Execute Test C (Reasoning Path Perturbation)** within 3 months. This is the highest-leverage empirical crux.
  2.  **Refine Definitions:** Further workshop the distinction between Behavioral and Mechanistic Alignment to determine if it is a verbal dispute or a fundamental safety divergence.
  3.  **Review:** Reconvene to analyze Test C results. If Residualist predictions hold, IDA requires architectural changes to enforce Process Equivalence. If Decompositionist predictions hold, focus shifts to scaling and efficiency.

  ***

  **End of Document**
