          *   *Repair:* You need a "bridge principle" or a specific voting rule (e.g., Borda count, pairwise comparison) rather than simple MEC. Or you accept ordinal MEC.
          *   *Underspecified Parameter:* The *method of intertheoretic comparison*. (a) assumes it exists; (b) denies the standard way of doing it.

      *   **Tension 2: Strict Probabilism (d) vs. Rejecting Domination (c).**
          *   Collaborators say these clash.
          *   *Analysis:* (d) is about *belief formation*. (c) is about *decision rules*. Standard EUT says Decision = Credence $\times$ Utility. If Credence is fixed (d) and Utility is unbounded, Domination follows. To reject Domination (c) while keeping (d), you must reject Expected Utility Maximization as the decision rule.
          *   *Resolution:* You can keep (d) (beliefs are probabilistic) but change the *aggregation function* from linear expectation to something risk-weighted (e.g., Buchak's REU) or use a "lexicographic" rule for constraints.
