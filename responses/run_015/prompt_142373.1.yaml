          *   *Repair:* Adopt Risk-Weighted Expected Utility or a "Constraint-First" lexical ordering within the hedging framework.

      *   **Tension 3: The Test Case (g) vs. The Hedging Rule (a).**
          *   In (g), 0.1 $\times$ Astronomical Value *should* win under standard MEC if values are comparable. The user says it loses.
          *   This implies the "Constraint" in the 0.9 theory has *infinite* or *lexical* weight, OR the aggregation isn't linear.
          *   If the weight is infinite, it conflicts with (b) (representing constraint as large disvalue). The user explicitly says "not as a very large disvalue."
