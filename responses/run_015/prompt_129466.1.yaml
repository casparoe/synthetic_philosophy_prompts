answer: |-
  Consider the "Alpine Quad," four small democratic states sharing a critical river basin who have abolished standing armies in compliance with Kant's third preliminary article, relying instead on armed border police. They manage water allocation through a technical authority but refuse to form a formal federal league with supranational enforcement powers, and they have jointly restricted cosmopolitan hospitality by closing borders to outside migrants and traders to protect local welfare. When a drought causes a water rights dispute between two members, tensions rise, yet no military mobilization occurs because the institutional capacity for war is dismantled and domestic publics oppose conflict. The question is whether this negative peace—secured by disarmament and non-interference without a formal federation or open hospitality—constitutes Kantian perpetual peace or merely an armed truce waiting to fail.

  On the "preliminary-articles-are-sufficient" reading, perpetual peace holds in this bloc because the negative constraints have successfully removed the instruments and incentives of war. By abolishing standing armies and prohibiting interference, the states have eliminated the capacity for offensive aggression and the secret diplomatic reservations that typically escalate disputes; the water conflict remains technical rather than military because the *means* of violence are legally and physically absent, suggesting the preliminary articles independently secure stability without needing a positive federal law. Conversely, on the "definitive-articles-are-jointly-necessary" reading, perpetual peace does not hold because the preliminary articles only create a cessation of hostilities, not a lawful condition. Since the Quad lacks a federation (Definitive Article 2), they remain in a state of nature regarding water rights with no public legal framework to adjudicate the dispute, and by blocking hospitality (Definitive Article 3), they sever the economic interdependence that discourages conflict; thus, the peace is contingent on goodwill rather than law, making it a temporary truce vulnerable to the first leader who decides to rearm.

  The structural feature actually doing the work in separating these verdicts is the **missing federation**. Both readings accept the states are republics (Definitive Article 1) and have followed preliminary constraints, so the divergence arises solely because the Definitive-Necessary reading insists that without a federal league to transform the state of nature into a lawful condition, the peace is juridically null, whereas the Preliminary-Sufficient reading assumes disarmament alone can suspend the state of nature's effects. A modern realist critic would attack the whole framing by arguing that institutions cannot overcome anarchy without enforcement; without a hegemon or federation to guarantee water rights, the disarmament is unstable because one state cheating on disarmament gains a decisive advantage, incentivizing preemptive rearmament. If you remove the republican constitutions but keep the other conditions, the case does collapse back into a standard multipolar security dilemma: autocratic leaders, unaccountable to publics, would view the disarmament as vulnerability rather than commitment, leading to rapid remilitarization and conflict over water, proving that the preliminary constraints alone cannot hold without the internal political constraints of republicanism.
