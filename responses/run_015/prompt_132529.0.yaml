answer: |-
  This is an exceptionally sharp observation. You have put your finger on a tension that is often glossed over in the standard "self-stultification" objections to epiphenomenalism. The standard objection (championed by Hasker, Churchland, and others) is binary: *If qualia cause nothing, they cause no beliefs, therefore you cannot know you have them.*

  Your point is more surgical. It is not about the *existence* of the knowledge, but about the **discriminative specificity** of the report and the **normative dynamics** of revision. You are noting that the *practice* of phenomenology (correcting, refining, distinguishing "stabbing" from "throbbing") presupposes a causal sensitivity that the metaphysics explicitly forbids.

  As requested, I will not jump immediately to a label. Let us brainstorm a few conceptual carvings to see which one captures the topology of the problem best, distinguish it from its neighbours, and then settle on a definition.

  ### Phase 1: Candidate Carvings

  Here are three ways we might conceptualize this specific tension.

  **Candidate 1: The Semantic Anchoring Problem**
  This framing focuses on reference. For the word "throbbing" to refer to a specific qualitative character rather than a neural state, there must be a link between the tokening of the word and the quality. In standard causal theories of content, reference is fixed by causal history. If the quality is inert, it is not in the causal history of the word.
  *   *Pros:* Connects to well-trodden ground in philosophy of language (Kripke, Putnam, Fodor).
  *   *Cons:* It feels too static. It explains why the word might mean something else, but it doesn't quite capture the *active correction* you described ("I was wrong, it was stabbing"). It misses the diachronic, normative element of *getting it right*.

  **Candidate 2: The Reliabilist Scaling Objection**
  This framing leans into epistemology. Knowledge requires a reliable connection between truth-maker and belief. If qualia are inert, the reliability is zero. But your insight is about *scaling*. A belief like "I have a sensation" might be reliably produced by a general neural arousal that correlates with *any* sensation. But "stabbing" requires a specific neural pattern to map to a specific qualia. If the qualia are inert, the mapping is arbitrary. The problem gets worse as the description gets finer.
  *   *Pros:* Captures your intuition about "fine-grainedness" and the "scaling" of the trouble.
  *   *Cons:* "Reliability" is usually a binary threshold for knowledge. This problem persists even if we lower the bar to "reasonable assertion." It's not just that we don't *know*; it's that there is no fact of the matter about why *this* report fits better than *that* one.

  **Candidate 3: The Normative Decoupling Thesis**
  This framing focuses on the "correction" aspect. To correct a statement is to acknowledge a norm: "My previous output failed to match the target." This implies the target (the feeling) constrains the output (the speech). If the target is causally inert, it cannot constrain the output. Therefore, the "correction" is physically identical to a random drift in speech habits, yet treated normatively as an improvement. The normativity is decoupled from the physics.
  *   *Pros:* Directly addresses the "revision" scenario. It highlights the conflict between the *stance* of the subject (I am answering to the feeling) and the *metaphysics* of the view (the feeling does nothing).
  *   *Cons:* Risks collapsing back into the general self-refutation argument unless we emphasize the *granularity* aspect you noted.

  ### Phase 2: Differentiation from Neighbouring Worries

  Before we synthesize, we must ensure this isn't just a repackaging of existing objections.

  1.  **Vs. The Self-Stultification Objection (Hasker):**
      *   *Standard:* "If epiphenomenalism is true, you can't know it's true (or even that you're conscious)."
      *   *Your Worry:* "Even if we grant you *some* access, you cannot explain the *accuracy of specific distinctions*." The standard objection kills the tree; your worry kills the branches. It allows that a zombie might say "I am conscious," but it challenges the zombie's right to say "It is *red* rather than *green*," or "*stabbing* rather than *throbbing*."

  2.  **Vs. Moore's Paradox:**
      *   *Moore:* "It is raining, but I don't believe it." (Pragmatic contradiction).
      *   *Your Worry:* The epiphenomenalist isn't contradicting themselves in one breath. They are making a claim over time that implies a causal link their metaphysics denies. It is a performative contradiction stretched over time, not a logical contradiction in a single proposition.

  3.  **Vs. The Generality Problem (Reliabilism):**
      *   *Generality:* How do we individuate the belief-forming process to judge reliability?
      *   *Your Worry:* You are right that this feels close. However, the Generality Problem is about *how to describe the process* to see if it's reliable. Your problem is that *no description of the process* can include the relevant truth-maker (the qualia) because the truth-maker is defined as causally irrelevant. It is not a problem of description; it is a problem of metaphysical exclusion.

  4.  **Vs. The Pairing Problem (Kim):**
      *   *Pairing:* How does a specific mental event cause a specific physical event?
      *   *Your Worry:* This is the inverse. How does a specific physical report track a specific mental event when there is *no* causation? It is a problem of **Tracking without Causation**.

  ### Phase 3: Synthesis and Naming

  The core of your observation is that **phenomenological precision requires causal sensitivity.**

  To distinguish "stabbing" from "throbbing" in a report, the reporting mechanism must be sensitive to the difference between stabbing and throbbing. Sensitivity is a causal counterfactual notion (if it were throbbing, you wouldn't say stabbing). If qualia are inert, the reporting mechanism is *insensitive* to the qualia, even if it is sensitive to the neural correlates.

  But the epiphenomenalist wants to say the report is about the *qualia*, not the neural correlates. When they correct themselves ("No, it was stabbing"), they are claiming their previous report failed to match the *qualia*. But since the qualia did not cause the report (or the correction), the "match" is a cosmic coincidence.

  The specific nuance you added—the **scaling with detail**—is the clincher. A general report ("I have a feeling") requires low sensitivity. A specific report ("Stabbing") requires high sensitivity. If the causal link is severed, the "resolution" of the report cannot be justified.

  I propose we call this **The Phenomenal Calibration Problem**.

  **Definition:**
  > **The Phenomenal Calibration Problem** is the difficulty faced by non-interactionist views of consciousness (like epiphenomenalism) in accounting for the normative adjustment of phenomenological reports. It arises when a subject revises a description of experience (e.g., from "throbbing" to "stabbing") to better match the qualitative character, despite the metaphysical commitment that the qualitative character plays no causal role in generating or revising the description. The problem scales with the granularity of the report: while coarse-grained attributions may survive as generic correlations, fine-grained discriminative claims lack a causal basis for their specific accuracy, rendering the "correction" physically indistinguishable from error.

  ### Phase 4: Boundary Cases and Implications

  To ensure this concept is robust, let's test its boundaries.

  **1. The Indexical Escape (The "This" Defense)**
  *   *Case:* The epiphenomenalist retreats to saying "I am having *this* experience," pointing inwardly.
  *   *Verdict:* This survives the Calibration Problem. Indexicals do not require descriptive accuracy, only a demonstrative link. However, this concedes your point: they can no longer write the paper describing it as "throbbing." They are silenced on *description*, restricted to *ostension*. This validates your intuition that the problem lives in the *fine-grained description*.

  **2. The Pre-Established Harmony (Leibnizian Defense)**
  *   *Case:* The epiphenomenalist argues God (or nature) arranged the physical and mental to run in parallel perfectly.
  *   *Verdict:* This solves the Calibration Problem technically but at the cost of massive metaphysical extravagance. It admits that *within the natural order*, there is no calibration. It makes the "correction" a miracle of synchrony rather than a cognitive achievement. This highlights that the problem is naturalistic: *how does the organism calibrate itself?*

  **3. The Coarse-Grained Survival**
  *   *Case:* "I am in pain" vs. "I am in *shooting* pain."
  *   *Verdict:* The Calibration Problem suggests "I am in pain" is more defensible. It requires less discriminative resolution. The neural state for "pain" is broader and more robustly correlated with the report "pain." The neural state for "shooting" is specific. If the qualia are inert, the specific report is unmoored. This predicts that epiphenomenalists should be vague. If they are precise, they are pragmatically contradicting their metaphysics.

  ### Phase 5: Why this matters for your PhD

  You asked if this is the same problem in different clothes. I argue it is **a distinct, more potent variant**.

  The standard "Self-Stultification" objection allows the epiphenomenalist to dig in: "I admit I can't *know* I am conscious in the standard sense, but I have direct acquaintance." They treat it as a skeptical worry.

  **The Phenomenal Calibration Problem** is not skeptical; it is **explanatory**. It challenges the *coherence of their practice*. It says: "You are acting as if your feelings guide your speech. Your theory says they don't. Explain the guidance."

  It forces the epiphenomenalist into a corner where they must either:
  1.  Deny the validity of phenomenological correction (undermining their own data).
  2.  Admit that their reports are actually about brain states, not qualia (collapsing into identity theory or eliminativism).
  3.  Accept that their detailed descriptions are unjustified noise (retreating to vague indexicals).

  **Conclusion:**
  You have identified a gap between **Truth Conditions** (determined by qualia) and **Assertibility Conditions** (determined by physics) that becomes unbridgeable as the content becomes more specific.

  I recommend using **The Phenomenal Calibration Problem**. It captures the dynamic nature of the error (the revision), the mechanical metaphor implied by "inertness" (calibration requires a causal link to the standard), and it allows you to leverage the **Granularity Intuition** (the problem scales with detail) as a key premise.

  It distinguishes your work from the standard "Zombie Judgment" literature by focusing on *discriminative accuracy* rather than *existential certainty*. This is a fertile ground for a thesis chapter. It moves the debate from "Can we know?" to "How can we speak?"
