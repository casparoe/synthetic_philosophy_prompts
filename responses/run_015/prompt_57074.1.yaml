answer: |-
  ### Preparation Sheet: Philosophy-of-Biology Seminar

  **Heaviest Claim:** Your assertion that the **Species-as-Individuals (Ghiselin–Hull) thesis passes the test** while the **Species-Concept debate largely fails it**.
  *Why:* This is the pivot of your paper. If the Species-as-Individuals case is shown to be verbal (or the Species-Concept case shown to be substantive), your Discriminating-Intervention Test (DIT) loses its discriminatory power. The Realists will attack this hardest because it grants their ontology (species are real) but dismisses their colleagues' debates (species concepts) as word-play.

  **Reflexes to Suppress:**
  1.  **"The data will settle it."** Philosophers view this as a category mistake. Data settles empirical claims; argument settles ontological commitments. Do not say science solves metaphysics. Say science *constrains* metaphysical options.
  2.  **"In my thirty-four years..."** Authority from your zoology career buys you credibility on the biological cases but spends it instantly on the metaphysical methodology. Use the sponge examples as *data points*, not *trump cards*.
  3.  **"This is just common sense."** Deflationism often sounds like dismissal. Frame it as *charitable reconstruction*, not elimination of deep thought.

  ---

  ### The Eight Objections (Ordered by Damage Potential)

  #### 1. The Metaphysician (Grounding & Structure)
  **Voice:** Precise, slightly weary of naturalism. "You're conflating epistemic access with ontological structure."
  **Objection:** "Your test defines substantivity in terms of divergent expectations under intervention. But metaphysics is about grounding and structure, not prediction. Two theories can be predictively equivalent yet ontologically distinct (e.g., different groundings for the same phenomenon). By tying substantivity to intervention, you've built verificationism into your definition of reality. Why should a realist accept that 'carving nature at the joints' is contingent on our ability to intervene?"
  **Concede:** You are not solving the problem of underdetermination; you are offering a pragmatic criterion for *dispute resolution*.
  **Hold:** The test is not about what *exists*, but about whether a *dispute* matters. If two ontologies yield identical commitments regarding all possible observations, the dispute is practically inert.
  **Reply (2 min):** "I grant that predictive equivalence doesn't entail ontological identity. However, my target is not 'what exists' but 'what we are arguing about.' If two parties agree on all structural, causal, and historical claims (the 'fixed' vocabulary) but disagree only on the label 'individual,' and that label generates no divergent expectations for future inquiry, then the *dispute* is verbal, even if the underlying reality is rich. I am not defining reality; I am defining the conditions under which a disagreement becomes productive rather than terminological. If 'carving at the joints' yields no difference in how we track those joints, the carving knife is purely decorative."
  **Soft Spot:** When pressed on whether *intervention* itself presupposes the ontology it tests. If you need to assume species are individuals to design the intervention that proves they are individuals, the test is circular.

  #### 2. The Graduate Students (Verbal Dispute Literature)
  **Voice:** Textual, careful, alert to definitions. "This isn't how Chalmers or Hirsch use the term."
  **Objection:** "The standard literature defines verbal disputes via charitable interpretation or conceptual roles, not empirical intervention. You've redefined 'verbal' to mean 'empirically underdetermined.' A dispute can be verbal even if it has empirical consequences if the parties are simply talking past each other. Conversely, a dispute can be substantive even if currently untestable. By making it an empirical test, you've shifted the debate from semantics to methodology."
  **Concede:** You are proposing a *novel* criterion, not summarizing the existing consensus.
  **Hold:** Existing criteria rely on interpretive charity, which is subjective. Your test offers an objective, public standard for biological contexts.
  **Reply (2 min):** "You are correct that I am departing from the standard semantic analysis. I am doing so because in biology, 'charity' often obscures methodological stagnation. If I interpret my opponent charitably enough, every dispute becomes verbal. My goal is to preserve the substantive core of biological ontology without letting it dissolve into hermeneutics. I propose the DIT not as the definition of verbalness *simpliciter*, but as a sufficient condition for substantive disagreement in empirical sciences. If there is no intervention that separates the usages, charity is irrelevant; there is nothing to interpret."
  **Soft Spot:** If they ask for a case where standard literature says "verbal" but your test says "substantive." If you can't provide one, you haven't improved on the literature; you've just renamed it.

  #### 3. The Realist (Species-as-Individuals)
  **Voice:** Passionate, protective of the Ghiselin–Hull thesis. "You're watering down the reality of species."
  **Objection:** "You claim the Species-as-Individuals thesis passes your test, which I applaud. But you imply the *reason* it passes is because of character distributions. That makes the ontological status of species contingent on biogeographical patterns. If a species were cosmopolitan and uniform, would it cease to be an individual? Reality shouldn't depend on sampling density."
  **Concede:** The *detection* of individuality depends on data; the *fact* of individuality does not.
  **Hold:** The test measures our *warrant* for the claim, not the claim's truth conditions.
  **Reply (2 min):** "I am not saying the species becomes a class if the data is uniform. I am saying that if the data is uniform, the *dispute* between 'individual' and 'class' loses its grip on our research practices. The Ghiselin–Hull thesis is substantive because it *constrains* how we expect variation to propagate. If we treat a species as a class, we expect similarity based on shared properties. If as an individual, we expect similarity based on common history. In a uniform cosmopolitan case, those expectations converge, and the dispute becomes idle. The ontology is stable; the utility of the dispute is not."
  **Soft Spot:** If they press whether "utility of the dispute" is the same as "truth of the claim." If you admit they come apart, you risk instrumentalism.

  #### 4. The Pluralist (Species Concepts)
  **Voice:** Pragmatic, focused on research aims. "You're forcing a binary where there's a spectrum of tools."
  **Objection:** "You say the Biological vs. Phylogenetic Species Concept debate is mostly verbal. I say it's a category error. They aren't competing truth-claims; they are tools for different jobs. One is for breeding studies, one for cladistics. Your test asks for a 'discriminating intervention,' but that assumes they are trying to describe the same thing. They aren't."
  **Concede:** They are often used for different purposes.
  **Hold:** But they are often presented as competing descriptions of the *same* units in systematics papers. That is where the verbal dispute arises.
  **Reply (2 min):** "I agree they are tools. But systematists often argue them as if they are competing discoveries about the 'true' species. My test exposes when that argument is hollow. If I can state all the breeding data and all the clade data without using the word 'species,' and we agree on all of it, then fighting over which concept is 'correct' is verbal. It becomes substantive only when a hybrid zone forces a choice where the tools yield conflicting management or conservation outcomes. That is the intervention."
  **Soft Spot:** If they ask if *all* ontological categories are just tools. If you say yes, you are an anti-realist. If you say no, you must explain why 'species' is special.

  #### 5. The Population Geneticist (Hostility)
  **Voice:** Impatient, empirical. "This is just modeling with extra steps."
  **Objection:** "I model hybrid zones. I know when definitions matter. When the gene flow stops, I see it. I don't need a philosopher to tell me when a definition has 'divergent expectations.' You're redescribing my workflow and calling it metaphysics."
  **Concede:** Biologists often do this implicitly.
  **Hold:** Philosophy makes the implicit explicit, preventing wasted effort on dead-end debates.
  **Reply (2 min):** "You are right that you know this in practice. But your field still publishes papers debating 'what is a species' as if it's a discovery problem rather than a modeling choice. My test formalizes your intuition so that we stop funding metaphysical debates that are actually just requests for better data. I am not teaching you biology; I am trying to stop philosophers and biologists from talking past each other about what your biology implies."
  **Soft Spot:** If he asks for a specific example where a philosopher's intervention test changed a biological protocol. If you don't have one, you look theoretical.

  #### 6. The Realist (Composition Puzzles)
  **Voice:** Intuitive, focused on causal powers. "Statues and clay behave differently."
  **Objection:** "You dismiss the statue and the clay as verbal. But if I melt the clay, the statue is gone. If I crush the statue, the clay remains. They have different modal properties. That's not verbal; that's causal."
  **Concede:** They have different persistence conditions.
  **Hold:** But those conditions are fixed by our *concepts*, not by the matter.
  **Reply (2 min):** "The matter is the same. The difference lies in which properties we decide are essential. If we agree on the arrangement of atoms, the history of the object, and its future trajectory, but disagree on whether it 'survives' melting, we are disagreeing on the definition of 'statue,' not the world. The causal powers belong to the matter; the persistence conditions belong to the sortal. My test shows that once we fix the physical claims, the 'survival' claim adds no new expectation."
  **Soft Spot:** If they argue that sortals *themselves* have causal power in social/biological contexts (e.g., legal status of a person vs. organism).

  #### 7. The General Audience (Verificationism Charge)
  **Voice:** Skeptical of positivism. "This smells like logical positivism."
  **Objection:** "You insist this isn't verificationism. But you define substantive claims by their observational consequences. That is the definition of verificationism. How is this different from Carnap?"
  **Concede:** It shares a family resemblance.
  **Hold:** Verificationism asks if a *statement* is meaningful. DIT asks if a *dispute* is productive.
  **Reply (2 min):** "Verificationism renders untestable claims meaningless. I am rendering untestable *disagreements* verbal. I am happy to say 'Species are individuals' is a meaningful, true claim. I am only saying that if your opponent agrees with all your data and predictions, arguing against you is a waste of time. One is a theory of meaning; the other is a theory of argumentative efficiency."
  **Soft Spot:** If they press on whether "truth" can exist without "meaningful conditions for verification."

  #### 8. The Sponge Specialist (Self-Own)
  **Voice:** Your own past self. "Phenotypic plasticity undermines your 'fixed claims'."
  **Objection:** "You worked on sponges where genotype doesn't fix morphology. How can you hold 'structural claims fixed' for your test if the structure itself is fluid depending on the environment? Your baseline for the test is unstable."
  **Concede:** Biological structures are often context-dependent.
  **Hold:** The test requires fixing the *description* of the context, not simplifying the biology.
  **Reply (2 min):** "Precisely. That is why the test is robust. We must state the environmental conditions explicitly in the 'fixed' vocabulary. If one usage of 'species' implies the morphology should be stable across depths and another implies it shouldn't, that is a discriminating intervention. The plasticity doesn't break the test; it provides the variables for the intervention."
  **Soft Spot:** If the environmental variables are too complex to fully enumerate, the "fixed" claim is never truly fixed.

  ---

  ### The One Question You Hope Nobody Asks

  **The Question:** "If the Discriminating-Intervention Test requires us to specify an intervention to determine substantivity, doesn't the design of that intervention already presuppose the ontology you are trying to test? To test if species are individuals, don't I have to treat them as individuals to track them through the intervention? If so, isn't the test circular?"

  **Frank Assessment:** You do not have a knock-down answer to this. It strikes at the heart of using empirical methods to settle ontological categories. It suggests that *practice* precedes *ontology*, making your test a description of practice rather than a arbiter of truth.

  **The Single Reply That Must Land:**
  "You are identifying the hermeneutic circle, which is unavoidable. However, the test is not looking for a 'view from nowhere.' It is looking for *divergence*. If treating the entity as an individual leads to a failed prediction that treating it as a class would have succeeded (or vice versa), the circle is broken by the failure. The test doesn't prove the ontology *a priori*; it reveals which ontology *pays rent* in the long run. If both ontologies survive all interventions equally well, then the choice between them is, by my definition, verbal. I am not asking for a god's-eye view; I am asking for a track record of divergence."

  **Why this must land:** If you fail here, you look like a naive empiricist who doesn't understand theory-ladenness. If you land it, you position yourself as a pragmatic realist who accepts circularity but demands cash-value.
