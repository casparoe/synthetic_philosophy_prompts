prompt: |-
  For thirty-four years I was a working zoologist; my specialty was the systematics of encrusting reef sponges, a group in which the same genotype can present radically different growth forms depending on light, current, and depth, and in which a decade of molecular work has quietly dismantled much of the morphology-based nomenclature I helped build. Since retiring I have taken up philosophy in earnest, and I am now two years into a part-time master's programme. In three weeks I am to present a paper at my department's philosophy-of-biology research seminar, my first talk to a properly philosophical audience, and I would like to arrive prepared for the question period rather than ambushed by it.

  My thesis is a deflationary one. I argue that a large family of disputes in the metaphysics of biology, and in general ontology as well, are verbal in the sense developed in the recent literature on that topic: they can be dissolved by the method of elimination, by restating what both parties accept in a vocabulary stripped of the contested term. I further argue that whether a dispute is verbal in this sense is a matter admitting of an empirical test rather than an interpretive judgement. I call it the discriminating-intervention test: a dispute between two candidate usages of a term is substantive only if there is some observation or intervention, available in principle, on which the two usages yield divergent expectations while every claim the parties can express without that term is held fixed. My argument runs in three steps. First, I apply the test to three cases from my own field and claim that it gives a different verdict in each. Whether a given viral entity counts as living fails the test, since nothing is left hanging on the term once all structural, metabolic, and replicative claims have been stated without it. The dispute between the biological and the phylogenetic species concepts largely fails it, but not entirely, because data from a hybrid zone can function as a discriminating observation for one usage and not for the other. Whether species are individuals, in the sense of the Ghiselin–Hull thesis, passes it, because treating a species as a spatiotemporally bounded historical particular rather than as a class constrains how one expects character distributions to be arrayed across a geography in a way the class reading cannot mimic. Second, I claim that the same test applied to the familiar composition puzzles, the statue and the clay and the ship whose planks are replaced, returns verbalness across the board, which is why I regard those puzzles as bad bookkeeping rather than deep metaphysics. Third, I insist that the test is not verificationism: it does not ask whether a claim is meaningful, only whether two usages of one word diverge in what they commit their users to, and it is entirely happy to return the answer that a great many disputed questions have determinate answers.

  The audience will number about twelve: four or five philosophers of biology, at least two of whom are realists holding that the species-individuals thesis is a substantive claim about the world and who will resent being told that the neighbouring species-concept debate is a quarrel about words; one committed pluralist who thinks my framing is a false binary, since different species concepts are different tools licensed by different research programmes; a metaphysician who works on grounding and on the notion of structure and who will want to know why I cash substantivity in interventionist terms rather than in terms of which concepts carve at the joints; a population geneticist from the biology department who attends out of curiosity and mild hostility, and who suspects that philosophers of biology mostly redescribe what he already knows; and two graduate students who have read the verbal-disputes literature closely and will be alert to whether I have understood it. Please prepare a question-and-answer sheet for me: the eight or nine objections this particular audience will actually raise, not the ones a general audience or a physics department would raise, ordered by how much damage each would do to the paper if I answered it badly. For each, give it in the voice and vocabulary of the person most likely to press it, state plainly how much of it I should concede up front and how much I can hold, offer a reply I could deliver in about two minutes aloud, and mark precisely where that reply is softest, the point at which a competent follow-up would leave me floundering. I would also like a note on which of my three claims is bearing the most weight and is therefore the likeliest target, and on the reflexes I ought to suppress: I am told that retired scientists irritate philosophers by insisting that the data will settle the matter, and I would rather be warned now than in the room. Finally, tell me the one question I am hoping nobody asks, with a frank assessment of whether I have an answer to it, and identify the single reply that must land if the paper is to survive the hour. Please do not supply a reading list or citations; I cannot chase them down and would rather have your reasoning set out directly.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Retired zoologist (34 years), specialist in encrusting reef sponges (phenotypic plasticity, molecular systematics vs. morphology). Now a part-time MA philosophy student (2 years in).
      *   **Task:** Presenting a paper at a philosophy-of-biology research seminar in 3 weeks. Needs a Q&A preparation sheet.
      *   **Thesis:** Deflationary. Many metaphysical disputes in biology are *verbal* (in the sense of recent literature, e.g., Chalmers, Hirsch, Thomasson). Proposes an empirical test for verbalness: the *Discriminating-Intervention Test* (DIT). A dispute is substantive only if two usages yield divergent expectations under observation/intervention while holding non-contested claims fixed.
      *   **Applications:**
          1.  Viruses (living?): Verbal (fails test).
          2.  Species Concepts (Biological vs. Phylogenetic): Mostly verbal, but hybrid zones might make it substantive.
          3.  Species as Individuals (Ghiselin-Hull): Substantive (passes test).
          4.  Composition Puzzles (Statue/Clay, Ship of Theseus): Verbal (bad bookkeeping).
      *   **Audience (12 people):**
          1.  4-5 Phil Bio (2+ Realists regarding Species-as-Individuals).
          2.  1 Pluralist (Species concepts as tools).
          3.  1 Metaphysician (Grounding, Structure, Joints).
          4.  1 Population Geneticist (Hostile/Curious, thinks Phil Bio is redundant).
          5.  2 Grad Students (Know verbal dispute literature well).
      *   **Constraints:** No reading lists/citations. Direct reasoning. 8-9 objections ordered by damage potential. Specific format (Voice, Concession/Hold, 2-min Reply, Soft Spot). Note on heaviest claim. Note on reflexes to suppress. The "One Question" hoped not to be asked. The "Single Reply" that must land.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* Verbal disputes can be empirically tested via the Discriminating-Intervention Test (DIT).
      *   *Vulnerability 1 (Metaphysics):* Is "substantivity" really about predictive divergence? Realists argue truth is about mind-independent structure, not just interventionist outcomes. (Target: Metaphysician & Realists).
      *   *Vulnerability 2 (Biology):* Does the DIT actually work on the specific biological cases? Specifically, Species-as-Individuals. Is the predictive difference real or just a redescription? (Target: Realists & Pop Gen).
      *   *Vulnerability 3 (Verbal Dispute Lit):* Is the definition of "verbal" correct? Usually, it's about charitable interpretation or conceptual roles, not empirical intervention. (Target: Grad Students).
      *   *Vulnerability 4 (Pluralism):* Is it a binary (verbal vs. substantive)? Pluralists say concepts have different *functions*, not just truth conditions. (Target: Pluralist).
      *   *Vulnerability 5 (Scientism):* The "data will settle it" reflex. Philosophers hate being told science solves metaphysics. (Target: Everyone, especially given user's background).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Metaphysician - Grounding/Joints):* This is the deepest philosophical challenge. If DIT says it's verbal, but reality has structure, DIT is wrong.
      *   *Objection 2 (The Realist - Species Individuals):* You say Species-as-Individuals passes the test. I say your test is too weak or your interpretation of the prediction is wrong.
      *   *Objection 3 (The Grad Students - Verbal Lit):* You're redefining "verbal dispute." The literature (Chalmers et al.) focuses on charity and conceptual roles, not interventionism. You're conflating epistemology with metaphysics.
      *   *Objection 4 (The Pluralist - False Binary):* Concepts aren't just true/false; they are useful/useless for specific aims. Your test ignores pragmatic utility.
      *   *Objection 5 (The Pop Gen - Redundancy):* I already know how to model hybrid zones. I don't need a "test" to tell me when definitions matter. This is just philosophy dressing up biology.
      *   *Objection 6 (The Realist - Composition):* You dismiss statue/clay as verbal. But causal powers differ (e.g., melting vs. crushing).
      *   *Objection 7 (General - Verificationism):* You deny it's verificationism, but it looks exactly like it. Meaning = method of verification.
      *   *Objection 8 (The Sponge Specialist - Self-Own):* Your own field (sponges) shows morphology is plastic. Doesn't that undermine the "fixed claims" requirement of your test?

      *Refining the Order:* The most damaging are those that undermine the *test itself* (Metaphysician/Grad Students) or the *core biological application* (Realists). The Pop Gen is annoying but less philosophically damaging. The Pluralist is a category error challenge.
      *Top Damage:* Metaphysician (undermines foundation), Grad Students (undermines literature fit), Realists (undermines main case study).

  4.  **Developing the Replies & Soft Spots:**
      *   Need to balance the "scientist" authority with "philosophy student" humility.
      *   Must avoid "Science solves metaphysics."
      *   Must clarify DIT is about *commitments*, not just *meaning*.

  5.  **Addressing Specific User Requests:**
      *   *Heaviest Claim:* The Species-as-Individuals case. If that falls, the distinction between verbal/substantive in bio collapses.
      *   *Reflexes to Suppress:* "The data will decide." "I've seen this in the field." "Philosophers overcomplicate."
      *   *The One Question:* "What if the intervention itself is theory-laden?" (Undermines the 'empirical' nature of the test).
      *   *The Single Reply:* The distinction between *ontological commitment* and *predictive divergence*.

  6.  **Writing the Content (incorporating voices):**
      *   *Metaphysician:* Precise, talks about "carving nature at the joints," "grounding."
      *   *Realist:* Passionate about species being real entities.
      *   *Grad Student:* Pedantic about definitions, cites "the literature."
      *   *Pop Gen:* Impatient, pragmatic.
      *   *Pluralist:* Focused on "aims" and "tools."

      *(Self-Correction during drafting)*: Make sure the "Soft Spot" is genuinely dangerous. If the reply is too strong, there's no follow-up. If it's too weak, the user looks bad. It needs to be a tension point.
      *Example:* The Metaphysician's soft spot is whether "intervention" presupposes the ontology it tries to test.

  7.  **Final Review against Constraints:**
      *   8-9 objections? Yes.
      *   Ordered by damage? Yes.
      *   Voice/Vocab included? Yes.
      *   Concede/Hold instructions? Yes.
      *   2-min reply? Yes.
      *   Soft spot identified? Yes.
      *   Heaviest claim noted? Yes.
      *   Reflexes noted? Yes.
      *   One Question/Single Reply included? Yes.
      *   No citations? Yes.

  8.  **Final Polish:** Ensure the tone is respectful but rigorous, matching the user's sophisticated prompt. (The user is clearly intelligent and experienced; don't talk down). Ensure the distinction between "verbal" and "substantive" is handled carefully regarding the Ghiselin-Hull thesis, as that's the user's "substantive" anchor.

  *(Detailed thought on the "One Question"):* The most dangerous question is one that exposes the circularity of the test. If the "intervention" requires assuming the ontology to design the experiment, the test fails. E.g., To test if species are individuals, do I need to assume they are individuals to track them?
  *(Detailed thought on the "Single Reply"):* The reply must establish that the test is about *divergence in commitment*, not *proof of existence*.

