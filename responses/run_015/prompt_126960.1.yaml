answer: |-
  This is a sharp dissection of I.J. Good's 1967 theorem. You are correct that the standard pop-sci interpretation ("knowledge is always power") is often overstated, but you are also right to suspect that dismissing all strategic ignorance as "irrationality" risks turning Bayesianism into a tautology.

  Good's Theorem states that for a Bayesian agent maximizing expected utility, the expected value of free information is non-negative. However, this relies on specific axioms: fixed utility function, causal independence of the state of the world from the act of observation, and the ability to commit to the optimal action *after* updating.

  Here is the exposure map you requested: the genuine defeaters, the definitional traps, and the live formal counterexamples.

  ---

  ### 1. The Fatal Defeaters: Where Good's Theorem Breaks

  These are cases where a rational agent (by most robust definitions) strictly prefers ignorance, even with costless information and perfect reasoning.

  #### A. Game Theory & Commitment Problems (The Schelling Point)
  This is the strongest practical defeater. Good's theorem assumes a single-agent decision problem or a environment where other agents do not react to your *epistemic state*. In multi-agent games, your knowledge is often observable or inferable by opponents.
  *   **The Mechanism:** Ignorance acts as a commitment device. If you know you *cannot* know a specific fact, you cannot be bribed, threatened, or tempted to deviate from a pre-commitment strategy.
  *   **The Example:** In a bargaining scenario, if you know the opponent's bottom line, you might be tempted to accept a deal slightly above it rather than risking a breakdown. If you are *ignorant* of the bottom line, you might credibly threaten to walk away, forcing a better deal.
  *   **Why it defeats Good:** The value of the information is negative because acquiring it changes the *game tree* (the opponent's strategy shifts in response to your potential knowledge). Good's theorem assumes the state of the world is independent of your observation. In games, your observation capability is part of the state.
  *   **Verdict:** **Fatal.** Defenders of Good must concede this applies to *parametric* decision problems, not *strategic* ones.

  #### B. Updateless Decision Theory (UDT) & Acausal Coordination
  This is the strongest *formal* defeater, arising from decision theory research (Miracle, Yudkowsky, Soares).
  *   **The Mechanism:** In Newcomb-like problems or Parfit's Hitchhiker, your decision is correlated with the state of the world via a predictor or a logical twin, not just causally. Standard Bayesian updating conditions on "I am in this situation," which can screen off the correlation needed for the optimal outcome.
  *   **The Example:** In Parfit's Hitchhiker, once you are in the city (you have the information "I am safe"), a Causal Decision Theorist (and standard Bayesian) refuses to pay the driver. But the driver predicts this, so you die in the desert. An *Updateless* agent ignores the information "I am in the city" when deciding whether to pay, effectively acting as if they don't know where they are to maintain the correlation that gets them rescued.
  *   **Why it defeats Good:** Good's theorem assumes updating is the correct response to information. UDT demonstrates that in acausal settings, **updating is the error.** The rational policy is to ignore the information to maximize ex-ante utility.
  *   **Verdict:** **Fatal.** This suggests Good's theorem describes *updateful* agents, but *updateless* agents are more rational in a broader class of problems.

  #### C. Endogenous Preferences (Identity Shifts)
  Good's theorem assumes a fixed utility function $U$. If information changes $U$, the theorem does not apply.
  *   **The Mechanism:** Some information changes *who you are* or *what you value*, not just your beliefs about how to satisfy values.
  *   **The Example:** A religious believer might avoid historical texts that would deconvert them. If they read them, their utility function shifts from "Serve God" to "Maximize Secular Happiness." Ex-ante, under the "Serve God" utility, the expected utility of the new state is lower (eternal damnation, loss of community).
  *   **Why it defeats Good:** If rationality includes maintaining a coherent identity over time, and information fragments that identity, avoiding info is rational.
  *   **Verdict:** **Awkward but Significant.** Defenders dismiss this by saying "You changed the utility function, so it's a different agent." But if the agent *anticipates* this shift and wants to prevent it, the ex-ante preference for ignorance is rational.

  ---

  ### 2. The "Unfalsifiability" Trap

  You asked if the view risks being qualified into unfalsifiability. **Yes, it does.**

  *   **The Move:** When confronted with a counterexample (e.g., "I don't want to know if my spouse is cheating"), the Bayesian defender often says: "You are assigning a high disutility cost to the *state* of knowing, or you anticipate a computational cost in processing."
  *   **The Problem:** If *any* preference for ignorance is explained away as "hidden cost" or "anticipated irrationality," the claim "Rational agents never prefer ignorance" becomes true by definition, not by derivation.
  *   **The Concession:** Serious defenders (e.g., Savage, Joyce) concede that Good's theorem applies only to **pure cognitive value**. If the information has **instrumental disvalue** (e.g., knowing a secret makes you a target), the theorem doesn't claim information is good.
  *   **The Real Fight:** The fight is over whether *strategic binding* (Game Theory) or *acausal correlation* (UDT) counts as a "cost." If you classify "loss of bargaining power" as a "cost of information," you save the theorem but drain it of content. If you admit it's a structural feature of rationality, the theorem is limited.

  ---

  ### 3. What Defenders Concede vs. Dismiss

  | Objection | Defender's Concession | Defender's Dismissal |
  | :--- | :--- | :--- |
  | **"Information makes me sad."** | Concedes this is a utility cost. Information isn't "free" if it causes pain. | Dismisses "sadness" as irrational if it doesn't affect outcomes. |
  | **"I can't process the data."** | Concedes bounded rationality limits apply. | Dismisses this as a limitation of *hardware*, not *rationality*. |
  | **"Knowing ruins my bargaining position."** | **Often ignores this.** Treats it as a "cost." | **Fatal Weakness:** They claim the agent should commit *after* learning. But if the opponent knows you learned, commitment fails. |
  | **"Newcomb's Problem."** | CDT defenders say taking one box is irrational. | UDT defenders say Good's theorem fails for updateful agents. |
  | **"Preference Change."** | Concedes theorem requires fixed $U$. | Dismisses preference change as "identity death," not rational choice. |

  ---

  ### 4. Predictive Differences: Good vs. Rivals

  If Good's view is correct (with caveats), what does it predict that Bounded Rationality or Strategic Ignorance models don't?

  1.  **The "No Regrets" Prediction:** A Good-Bayesian should never regret *having* received free information, only the outcome. A Strategic Ignorance model predicts agents will actively pay to *avoid* information channels even if processing is free.
  2.  **Transparency in Design:** A Good-Bayesian agent should design itself to be transparent and information-hungry. A Game-Theoretic agent should design itself to be opaque and selectively blind (e.g., automatic retaliation systems that don't check intent).
  3.  **Updating Behavior:** In acausal scenarios, Good-Bayesians update and lose. Updateless agents ignore info and win. This is empirically testable in AI agent simulations (e.g., in iterated Prisoner's Dilemma tournaments with code inspection).

  ---

  ### 5. The Exposure Map: Risk Assessment

  Here is the breakdown of what is genuinely risky for the position and what is noise.

  #### **Zone 1: Noise (Defensible against Good's Theorem)**
  *   **Emotional Distress:** "I don't want to know I'm sick." -> *Counter:* That's a utility cost. Information wasn't free.
  *   **Computational Overload:** "Too much news." -> *Counter:* That's a processing cost. Information wasn't free.
  *   **Anticipated Weakness:** "I know I'll panic." -> *Counter:* That's anticipated irrationality (akrasia). The theorem assumes optimal action *after* updating.

  #### **Zone 2: Awkward (Requires Theory Stretching)**
  *   **Endogenous Preferences:** "I don't want to change who I am." -> *Risk:* Requires defining the "agent" as a temporal sequence of utility functions. Defenders handle this by saying the *ex-ante* agent is rational, the *ex-post* agent is just different.
  *   **Attention Economics:** "Information distracts from better tasks." -> *Risk:* Requires defining "opportunity cost of attention" as a cost of information. Technically valid, but stretches "free."

  #### **Zone 3: Fatal (Genuine Counterexamples)**
  *   **Strategic Binding (Schelling):** Ignorance allows credible threats. If you *can* know, you *must* negotiate. If you *can't* know, you can walk away. **This proves ignorance has positive instrumental value independent of processing costs.**
  *   **Updateless Scenarios (UDT):** In problems where your decision is logically correlated with the environment (predictors, twins), updating on information destroys the correlation required for the payoff. **This proves that the act of Bayesian updating itself can be suboptimal.**
  *   **Information Hazards (Bostrom):** Information that, if known, allows others to harm you *specifically because you know it* (e.g., knowing a dangerous recipe makes you a target). While this looks like a "cost," it is often intrinsic to the *state of knowledge* itself, not the processing.

  ### Summary Conclusion

  Good's Theorem is mathematically sound within its axioms (Single-agent, Causal, Fixed Utility, Updateful).
  *   **It is not unfalsifiable,** but it is **scope-limited.**
  *   **The Fatal Flaw:** It fails in **multi-agent strategic environments** (where knowledge alters opponent behavior) and **acausal decision problems** (where updating breaks correlations).
  *   **The Rationality of Ignorance:** Strategic ignorance is rational if you define rationality as **ex-ante utility maximization** rather than **ex-post Bayesian coherence.**

  If you hold that rationality means "maximizing what you get from the outside," then Good's view is incomplete. If you hold that rationality means "coherently processing what you have," Good's view holds, but risks irrelevance in strategic contexts. The live formal counterexample is **Updateless Decision Theory**, which formally demonstrates that an agent that *refuses to update* on free information outperforms a Good-Bayesian agent in specific, well-defined games.
