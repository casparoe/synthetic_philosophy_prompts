      *   *Correction:* Make sure to distinguish between "information affects the world" (violates assumption) vs "information affects belief" (Good's domain). In games, information affects the world because opponents react to your state of knowledge.
      *   *Emphasis:* Highlight that Good's Theorem is a *theorem*, not a law of nature. It holds *given* axioms. The debate is whether the axioms describe rational agency.

