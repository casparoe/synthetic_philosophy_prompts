answer: |-
  The global standardization of the ISO shipping container in the 1960s.

  The lock-in reading argues that the specific dimensions and fitting mechanisms of the modern shipping container were frozen by the early decisions of Malcom McLean and the U.S. Navy, creating a technological regime that persists only because the switching costs are now prohibitive. On this view, McLean's choice of an 8-foot width and 8.5-foot height for his early Sea-Land boxes was a contingent accident driven by the specific constraints of his own trucking fleet and the availability of surplus ship hulls. Once the U.S. military adopted these specifications for logistics during the Vietnam War, and once ports worldwide invested billions in cranes, chassis, and cell guides tailored to these dimensions, the standard became locked. Any alternative design that might have been more volumetrically efficient or better suited to European or Asian road networks was crowded out, not because it was inferior, but because the network effects of the existing infrastructure made switching economically impossible. The persistence of the 20-foot and 40-foot lengths is seen as a historical fossil, preserved by the sunk costs of the global supply chain rather than ongoing optimization.

  The convergence reading argues that the physical and economic constraints of intermodal transport create a narrow "fitness peak" that any rational engineering process would have discovered independently, rendering McLean's specific role merely accelerative rather than determinative. The width of a container is not arbitrary; it is strictly bounded by the clearance of road tunnels, bridge heights, and the legal width limits of trucks in the major industrial economies. An 8-foot width is the maximum that fits on a standard chassis without special permits across the U.S. and Europe; anything wider breaks the trucking link, and anything narrower sacrifices too much cargo volume to be economical. Similarly, the length is constrained by the turning radius of road trains and the structural stability of ship stacking. The corner casting mechanism, often cited as a proprietary lock-in, is the simplest mechanical solution to the problem of securing a heavy box during dynamic motion without complex lashing. Under this view, even if McLean had never existed, the pressure to reduce port labor costs—which consumed the majority of shipping expenses—would have forced railroads and shipping lines in the U.S., Europe, and Japan to converge on a box of nearly identical dimensions within a few years, because the physics of the transport network allows for very little variation.

  The specific features that decide between these two hypotheses are the number of independent alternatives live at the critical juncture, the visibility of the advantages, and the speed of the transition. First, there were multiple independent actors developing container systems simultaneously in the 1950s, including Matson Navigation, Grace Line, and various European railroads; while their early sizes varied, they clustered tightly around the eventual ISO standard before any formal agreement was reached, suggesting they were all bumping against the same physical walls. Second, the advantages of standardization were visible in advance, not manufactured retrospectively; the reduction in port dwell time from weeks to hours was immediately quantifiable, meaning the winning design did not need network effects to prove its worth—it won on operational efficiency alone. Third, the transition happened with unusual speed for an infrastructure project; within fifteen years, the majority of global general cargo had shifted to containers, overcoming massive sunk costs in break-bulk ports. In a true path-dependence scenario, the inferior technology (break-bulk) should have persisted much longer in niches where the lock-in wasn't yet total, but instead it was almost entirely obliterated, indicating the new standard was sufficiently superior to overcome inertia.

  The single strongest reason to think I have made the wrong call is that the decisive constraint on the container's width was specifically the U.S. Interstate Highway System's regulations, not a universal physical limit. European and Asian roads are often narrower, and their tunnel clearances differ; had the standardization process been led by Europe or Japan, the optimal width might have been 2.4 meters rather than 8 feet. The fact that the entire world adopted a dimension optimized for American trucking law suggests that geopolitical power and early-mover advantage (path dependence) overrode local functional optimization (convergence), meaning the outcome was not inevitable but rather imposed by the dominant economic hegemon of the era.
