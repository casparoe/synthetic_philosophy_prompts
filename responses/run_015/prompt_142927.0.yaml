      *   *The Lamppost:* The sphere of measurable, tractable, legible interventions (e.g., RCT-ready global health).
      *   *The Darkness:* The sphere of hard-to-measure, complex, long-term, or structural interventions (e.g., policy, AI safety, movement building).
      *   *The Drunk Guy:* The funder/evaluator (GiveWell, EA donors) searching for impact.
