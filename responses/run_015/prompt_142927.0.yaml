answer: |-
  This is a sharp audit request. The streetlight effect is the dominant metaphor for measurability bias in EA, but like most metaphors, it does heavy rhetorical lifting that obscures the actual mechanistic critique.

  Here is the breakdown of the correspondence, the structural failures of the analogy, and an assessment of whether the critique survives the metaphor's collapse.

  ### 1. The Correspondence Map

  To audit the analogy, we first have to formalize the mapping as it is typically deployed by critics of "shallow" EA (e.g., GiveWell-style global health) vs. "deep" EA (e.g., longtermism, policy, structural change).

  *   **The Lost Keys:** The interventions or cause areas with the highest *actual* expected value (EV). In the critique's view, this is often structural change, political reform, or existential risk reduction.
  *   **The Lamppost:** The sphere of interventions that are easily measurable, tractable, and legible to current evaluation frameworks (e.g., RCT-ready global health interventions like bednets or cash transfers).
  *   **The Darkness:** The sphere of interventions that are high-impact but epistemically opaque, hard to measure, or have long feedback loops (e.g., advocacy, AI governance, movement building).
  *   **The Drunk Guy:** The funding institution (GiveWell, OpenPhil) or the donor community.
  *   **The Search Strategy:** Optimizing for *visibility* (evidence quality) rather than *probability of location* (actual impact).

  ### 2. Where the Mapping Breaks

  The streetlight story is a fable about irrationality. Institutional funding is a process of risk management. The analogy breaks down in four specific places, two of which are decorative and two of which are substantive.

  #### A. The "One True Spot" Fallacy (Substantive Break)
  In the fable, the keys are in *one* specific place in the dark. The implication is that the "real" impact is definitely outside the light, and the light is a distractor.
  *   **The Reality:** Impact is not a binary location; it is a landscape. Bednets *do* save lives. They are not a decoy. The critique implies that funding bednets is *wasted* effort because the "real" keys (structural change) are elsewhere.
  *   **Why it matters:** This smuggles in the premise that longtermist/structural causes are *objectively* higher EV than global health. That is a contested empirical claim, not a methodological truth. The analogy assumes the conclusion (the dark is where the value is) rather than arguing for it.

  #### B. The "Drunk" vs. Risk-Averse Agent (Decorative Break)
  The drunk is searching under the light because he is incapacitated and irrational.
  *   **The Reality:** GiveWell is not irrational; it is explicitly risk-averse regarding *evidence*, not necessarily impact. They acknowledge they might be missing high-EV opportunities in the dark, but they prioritize *proven* impact over *speculative* impact.
  *   **Why it matters:** This is mostly decorative. It makes the institution look incompetent rather than conservative. However, it obscures the actual trade-off: certainty vs. ceiling.

  #### C. The Nature of the Light (Substantive Break)
  In the story, the light is passive illumination. It reveals what is there without changing it.
  *   **The Reality:** In social science and institutional funding, measurement is not passive. It is interventionist. Quantification creates incentives (Goodhart's Law). When you shine a light on bednets, you don't just find them; you optimize supply chains for them, potentially crowding out unmeasured local innovations.
  *   **Why it matters:** The analogy fails to capture that quantification can *distort* the terrain, not just limit vision. The critique isn't just that we can't see the dark; it's that the light might be moving the keys.

  #### D. The Darkness is Not Uniform (Substantive Break)
  The story implies the dark is just "unlit ground."
  *   **The Reality:** The "dark" (structural/policy change) is often dark because it is causally opaque, not just because we lack data. It may be that there are *no keys* in large swathes of the dark (i.e., many advocacy efforts actually do nothing).
  *   **Why it matters:** The analogy suggests the darkness is *equally promising* but harder to see. In reality, the darkness may be *less* promising on average, which is why the light is preferred. Ignoring this makes the critique look like it values "mystery" over "evidence."

  ### 3. Does the Critique Stand Without the Analogy?

  If we burn the streetlight story, does the accusation of measurability bias still hold weight?

  **Yes, but it changes from a critique of *negligence* to a critique of *selection pressure*.**

  The streetlight analogy argues that institutions are *looking in the wrong place* (negligence/irrationality). If you remove that, the remaining critique is about **epistemic asymmetry**.

  1.  **The Barrier to Entry Argument:** Rigorous evaluation (RCTs, cost-effectiveness analysis) has a high fixed cost. This creates a barrier to entry that favors standardized, replicable interventions (health) over complex, context-dependent ones (policy). This isn't drunkenness; it's economies of scale in evaluation.
  2.  **The Counterfactual Problem:** It is genuinely harder to construct a credible counterfactual for "preventing a norm shift" than for "distributing a pill." Institutions naturally select for problems where their specific tool (evaluation) works.
  3.  **Goodhart's Law:** This is the strongest independent argument. When a measure becomes a target, it ceases to be a good measure. If funding is tied to legibility, organizations will optimize for legibility (reporting metrics) rather than impact (actual change).

  **Verdict:** The analogy was doing about 40% of the argumentative work. It provided the emotional hook (the folly of the drunk). Without it, the critique is drier but technically more robust. It shifts from "You are looking in the wrong place" to "Your tools select for a specific type of problem, potentially skewing the ecosystem."

  ### 4. Which Disanalogies Matter?

  To be honest about the audit:

  *   **Decorative Disanalogy:** **The Drunkenness.** Whether GiveWell is "irrational" doesn't matter. Whether they are risk-averse or biased, the outcome (underfunding hard-to-measure causes) is the same. Fixing this analogy doesn't save the critique.
  *   **Decorative Disanalogy:** **The Single Location.** Whether there is one "key" or many doesn't fundamentally break the critique, provided the *highest value* keys are in the dark.
  *   **Substantive Disanalogy:** **The Passive Light.** This matters immensely. If measurement distorts the intervention (which it does), the critique is *stronger* than the streetlight story suggests. The streetlight story implies we are just missing out on value. The reality implies we might be actively destroying value by optimizing for proxies.
  *   **Substantive Disanalogy:** **The Value of the Dark.** This is the killer. The streetlight story assumes the dark contains the keys. If the dark is mostly empty (i.e., most structural interventions are low-impact), then staying under the light is the rational choice. **The analogy collapses if the longtermist/structuralist premise is false.**

  ### Summary

  The streetlight analogy is a **rhetorical weapon, not an epistemic tool.** It frames measurability bias as a search error (looking in the wrong place) rather than a structural incentive problem (optimizing for what can be counted).

  If the analogy collapses, the critique **still stands**, but it loses its moral certainty. It becomes a claim about **institutional comparative advantage**: GiveWell is built to find bednets, not to fix governance. Expecting them to fund the latter is like expecting a metal detector to find wooden keys.

  The disanalogy that matters most is the **assumption that the dark holds the keys.** The streetlight story presupposes the longtermist conclusion (that structural/long-term work is higher EV). If you don't already believe that, the analogy proves nothing. The critique of measurability bias must stand on the claim that *uncounted value exists*, not just that *counting is hard*.
