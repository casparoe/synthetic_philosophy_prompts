  6.  **Final Polish:** Ensure the distinction between the "Currency Question" and the "Conversion Question" is the hook. Ensure the "Temporal Unit" is presented as a multiplier of the problem, not just an add-on. Make sure the policy deliverable sounds useful, not abstract.

  *(Self-Correction on the "Circularity" objection)*: The prompt mentions the user is worried "just institutions" presupposes distribution. I need to frame the proposal as *testing* whether this circularity is vicious or virtuous. If it's vicious, the theory fails. If virtuous (reflective equilibrium), it succeeds. This makes for a good failure condition.

