answer: |-
  **Project Title:** The Conversion Constraint: Re-framing the Currency of Egalitarian Justice

  **Project Summary and Research Question**
  Standard egalitarian theory treats the "equality of what?" question as a choice between three currencies: welfare, resources, or capabilities. This proposal argues that this triad is incomplete because it conceals a prior, determinative decision: the **conversion function**. Every currency claim implicitly relies on a rule for translating bundles of goods into advantage. Resources views assume a standard conversion rate; welfare views assume preferences are reliable converters; capabilities views assume a fixed list of functionings. All three fail when conversion rates vary due to disability or when preferences adapt to deprivation.

  The central research question is: **Can we define a metric of advantage that isolates conversion capacity from adaptive preferences without presupposing the distributive outcome it is meant to judge?**

  I propose a fourth position: **Counterfactual Conversion Egalitarianism (CCE).** CCE holds that we should equalize the conversion function individuals *would* possess under just institutions and adequate opportunity, holding fixed only reflectively chosen preferences. Simultaneously, I will investigate the **Temporal Unit Problem**: whether the choice of currency/conversion is independent of the time-frame of comparison (whole-life vs. period-by-period). If independent, this yields a matrix of distinct egalitarian views rather than a single standoff.

  **Why Standard Currencies Leave This Open**
  The committee may ask why we cannot simply operationalize an existing metric. The answer is that the standard currencies are indeterminate on the specific cases that drive policy disputes.
  1.  **Resources:** Equalizing bundles fails because it treats conversion as a private black box. It cannot distinguish between a person who chooses leisure and a person forced into idleness by inaccessible infrastructure. It measures the input, not the access.
  2.  **Welfare:** Equalizing satisfaction fails the "happy slave" test. If preference satisfaction is the metric, adaptive preferences (lowering expectations to match deprivation) register as successful justice.
  3.  **Capabilities:** This view attempts to solve the conversion problem by listing functionings. However, it faces a specification dilemma. If the list is too thin, it collapses into resources; if too thick, it collapses into welfare. More critically, it lacks a mechanism to distinguish between a capability unexercised by choice and one unexercised by structural constraint without already knowing what a "just distribution" looks like.

  My project argues that these are not three competing answers, but three incomplete attempts to solve the *same* conversion problem. CCE attempts to make the conversion function explicit and counterfactual, rather than implicit and actual.

  **Methodology and Work Plan (12 Months)**
  The project will produce three dissertation chapters and one standalone journal article.

  *   **Months 1–3: Chapter 1 (The Collapse Thesis).**
      *   *Task:* Formalize the argument that currency and conversion are not distinct. Demonstrate how Resource, Welfare, and Capability views each smuggle in a conversion function.
      *   *Deliverable:* Draft Chapter 1.
      *   *Risk:* If the "collapse" argument proves too strong (i.e., all views are identical), the project loses traction.
      *   *Mitigation:* Pivot to showing they are *distinct but incomplete* rather than identical.

  *   **Months 4–6: Chapter 2 (The Counterfactual Fix).**
      *   *Task:* Define CCE. Address the circularity objection: does defining "just institutions" to fix conversion rates presuppose the distribution? I will argue for a reflective equilibrium model where institutions and conversion capacities are co-determined.
      *   *Deliverable:* Draft Chapter 2 + Submit Standalone Paper ("The Adaptive Preference Trap") to *Ethics* or *Philosophy & Public Affairs*.
      *   *Risk:* If the counterfactual is deemed metaphysically inaccessible.
      *   *Mitigation:* Shift to a "proxy" model using observed data from comparable just jurisdictions (empirical turn).

  *   **Months 7–9: Chapter 3 (The Temporal Unit).**
      *   *Task:* Analyze the Ana/Ben case (chronic illness vs. flat mediocrity). Argue that temporal unit (synchronic vs. whole-life) is a separate variable from currency.
      *   *Deliverable:* Draft Chapter 3.
      *   *Cut Option:* If behind schedule, Chapter 3 becomes the standalone paper, and the dissertation concludes after Chapter 2 with a shortened conclusion on temporality.

  *   **Months 10–12: Synthesis and Policy Protocol.**
      *   *Task:* Integrate findings. Create the "Comparison Protocol" (see Deliverables). Finalize dissertation.
      *   *Deliverable:* Full Dissertation Draft.

  **Defense of Approach**
  *   **Why not a survey?** The literature is stalled. Mapping the debate reinforces the stalemate rather than resolving the conceptual conflation causing it.
  *   **Why not empirical measurement?** Economists on the committee may suggest picking a metric (e.g., income equivalent) and measuring it. But measuring the wrong thing precisely is worse than measuring the right thing imprecisely. We need the conceptual work to justify *which* equivalent to measure.
  *   **Why not operationalize Capabilities?** Simply picking a list (e.g., Nussbaum's ten capabilities) avoids the hard question of *why* those ten and how to weigh them against each other when conversion costs differ. My project provides the justification for the list, not just the list itself.

  **Failure Conditions and Fallback**
  *   **Failure Condition:** The project fails if I cannot define the "counterfactual conversion function" without vicious circularity. If "just institutions" can only be identified by the distribution they produce, and the distribution can only be identified by the institutions, the theory offers no action-guidance.
  *   **Evidence for Failure:** If, by Month 6, I cannot construct a case study (e.g., disability accommodation) where CCE yields a different verdict than standard Capabilities approaches without relying on intuition pumps.
  *   **Fallback Project:** If CCE collapses, I will pivot to defending the **Temporal Independence Thesis** (Chapter 3) as the primary contribution. Arguing that the "Equality of What" debate is orthogonal to the "Equality of When" debate is a significant negative result that clarifies the literature, even without a new currency theory.

  **Deliverables for Non-Philosophers**
  Theoretical clarity must translate to policy. The final dissertation will include a **Comparison Protocol**, a decision-tree tool for policymakers.
  *   *Input:* Two individuals with different bundles and reported satisfaction levels.
  *   *Process:* The Protocol guides the user through:
      1.  Filtering reported satisfaction for adaptive preferences (using the counterfactual test).
      2.  Selecting the Temporal Unit (deciding if short-term deprivation can be offset by long-term gain).
      3.  Calculating the "Conversion Deficit."
  *   *Output:* A recommendation on whether a transfer is required to equalize advantage, and whether that transfer should be in cash (resources) or specific services (conversion support).

  This ensures the dissertation does not end in metaphysics but provides a structured heuristic for evaluating distributive claims in health, labor, and social security policy.
