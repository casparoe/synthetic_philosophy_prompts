  Based on the data points you've collected, I can offer a prediction, a reconstruction of Pete's underlying algorithm, and a test case that should force his hand.

  ### The Prediction

  **Verdict:** Pete will endorse **waste-fed insects** as superior to chicken (likely "mussel-tier"), but he will reject **grain-fed insects** as worse than chicken.

  **Confidence:** ~80%.

  **Reasoning:**
  Your Beef vs. Chicken data is the strongest signal. Pete explicitly overrides the "headcount" metric (where chicken loses) with the "land" metric (where beef loses). This establishes that **Land Use is the primary independent variable** in his model.

  *   **Waste-fed insects:** The land footprint is negligible (warehouse only). This clears the primary hurdle. The "headcount" issue (thousands of crickets) will be discounted by him, just as he discounts the "cow-day" vs. "chicken-day" complexity. He likely operates on a **sentience threshold**; if the nervous system is simple enough, the headcount doesn't scale linearly with moral cost.
  *   **Grain-fed insects:** This reintroduces the "Land" variable (growing the grain). If land use is the primary driver of "badness" (as per the beef verdict), adding a crop requirement moves insects back into the "Chicken" or "Beef" category, regardless of the animal's size.

  ### The Reconstructed Rule

  Pete is not running a standard Utilitarian calculus (sum of suffering). If he were, the Egg verdict ("full life" = best) and the Beef verdict (land > headcount) would be harder to reconcile.

  He is running a **Land-Weighted Stewardship Model**.

  1.  **Primary Cost: Ecosystem Displacement.** Land use is a proxy for the displacement or death of wild animals (the "mice" in the lentil field). This is why Beef is worst (high land) and Mussels are best (no land/feed).
  2.  **Secondary Cost: Individual Welfare.** Once land cost is accounted for, he looks at the quality of life of the organism. This explains why the neighbour's eggs are "best" (low land displacement + high individual welfare/stewardship).
  3.  **Discount Factor: Sentience Complexity.** He does not count heads equally. A cow-day > chicken-day, and likely a chicken-day >> cricket-day. This allows him to ignore the massive headcount of insects provided the land cost is low.
  4.  **The "Mice" Ambiguity:** He refuses to clarify the lentil/mice issue because admitting that *farming kills wild animals* undermines the "clean" status of plant-based diets. He needs the ambiguity to maintain the hierarchy where Plants > Chicken, even if the land-use math on specific crops might wobble.

  ### The Discriminating Test Case

  You asked for a case that separates the rules that *agree* on crickets (Rule 1: Suffering-time + Land, and Rule 3: Land/Ecosystem Proxy). Both rules predict waste-fed crickets are "Good." To separate them, you need a scenario where **Land Use is identical, but Sentience/Life differs.**

  **The Case:** **Cultivated (Lab-Grown) Meat vs. Waste-Fed Crickets.**

  Present them as equivalent in terms of land use (both warehouse-based), feed input (both can be framed as low-impact), and protein output.

  *   **Cultivated Meat:** Zero sentient individuals killed (post-cell-line), zero land use, no "life" lived.
  *   **Waste-Fed Crickets:** Thousands of sentient individuals killed, zero land use, brief "life" lived.

  **The Split:**
  *   **If Pete prefers Cultivated Meat:** He is a **Suffering-Minimizer (Rule 1)**. He cares about the capacity for experience. The cricket's nervous system, however small, carries more moral weight than the bioreactor.
  *   **If Pete prefers Crickets (or rates them equal):** He is an **Ecosystem Steward (Rule 3)**. He likely views the cricket as part of a "natural cycle" (waste to food) and the lab meat as "ultra-processed" or sterile. Alternatively, the "Egg" verdict suggests he values *Life* itself; crickets lived, cells did not. If he values the existence of a life over the absence of suffering, he will choose the cricket.

  **Why not the Vertical Farm Lentil?**
  You suggested this, and it's a strong ecological control. However, Pete might dodge it by citing energy costs or "unnaturalness" of vertical farming, which introduces a third variable (Carbon/Tech). The Lab Meat vs. Cricket comparison isolates **Sentience** from **Land**, which is the specific fault line between the two remaining hypotheses.

  ### Summary for the Group
  When you raise the insect topic, watch for his reaction to the **feed source**. If he latches onto "waste recycling" as a virtue independent of the land saving, his model is more about *Circular Economy* than *Ethics*. But if he pivots immediately to the land question, you have your confirmation: he's counting hectares, not heads.
