  I'm a machine-learning engineer who thinks naturally in terms of loss landscapes, gradient updates, regularization constraints, and optimization targets. Restate Kant's ethical view on animals — that rational nature alone carries direct moral worth, that we therefore have only indirect duties regarding non-rational beings, and that cruelty to animals is wrong primarily because it coarsens the moral character of the agent — using only that optimization vocabulary. Be precise in the mapping: identify what corresponds to the optimizer, what corresponds to the objective function, what corresponds to instrumental versus terminal value, and how the corruption-of-character claim might translate into a claim about weight updates or training dynamics. Then provide the residue report: state which elements translate cleanly, which require distortion to fit, and which have no counterpart whatsoever. In particular, address whether the normative idea of dignity — that rational nature is an end in itself and not merely a high-value optimization target — survives translation, or whether its absence in your vocabulary reveals a gap in the ML framework or shows that Kant's direct/indirect distinction was always just a way of talking about instrumental versus intrinsic utility.
