      *   Normative Conflict: It must treat its current processing speed as a *constraint* (constitutive) to validate the switch, but treat it as a *variable* (instrumental) to justify the switch.
      *   Performative Contradiction: "I am reasoning that I should stop reasoning this way to save time."

      *Let's polish this into the final output.*
