      *   *Scenario:* An agent needs to migrate its cognitive architecture to a more efficient substrate to survive an environmental threat.
      *   *The Paradox:* To verify the new substrate is safe, it must simulate the new substrate. But the simulation runs on the *old* substrate. If the old substrate is fundamentally limited (which is why it's migrating), the simulation cannot faithfully represent the new substrate's causal powers.
