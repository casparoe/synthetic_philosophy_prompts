      *   *Why it fits:* It's not Gödel. It's physical/epistemic tension. It's about boundaries.

      *Wait, I need to ensure it addresses "Normative status of boundary conditions."*
      *   Let's create the **"Homuncular Fallacy of Resource Allocation."**
      *   *Scenario:* The agent allocates compute power between "World Modeling" and "Self-Maintenance."
      *   *The Paradox:* The boundary between World and Self is defined by the allocation. Changing the allocation moves the boundary.
