  2.  **Deconstruct Adam Smith's Relevant Ideas:**
      *   *The Wealth of Nations:* Critique of monopolies (especially East India Company), critique of colonialism, importance of free markets, importance of domestic industry, skepticism of merchants mastering legislation, the idea of "invisible hand" (often misused, but relevant to local investment vs. foreign extraction), justice and jurisprudence (from *Theory of Moral Sentiments* though the prompt focuses on economic structures).
      *   *Critique of the East India Company:* Smith hated the Company because it was a sovereign merchant. It exercised political power for economic gain, leading to oppression and inefficiency. He argued that trade should not be governed by those who profit from it exclusively.
      *   *Colonialism:* Smith was critical of the mercantilist system that drained colonies for the benefit of the metropole. He argued that colonies should be free to trade with whom they chose and develop their own industries.
      *   *Contracts and Voluntary Exchange:* Smith believed in voluntary exchange, but he was acutely aware of power imbalances. He knew that "voluntary" contracts between unequal parties (or where one party has sovereign powers) are not truly free.
