answer: |-
  The setup
  Welcome to the dream sorter. We start where everyone agrees: you wake up telling stories, and your brain was active. But did you *experience* anything while asleep? This chart maps the logical possibilities, from "nothing happened" to "you lived a second life." It navigates the hidden traps of time, memory, and selfhood. Answer six plain questions to find which theory of dreaming fits your intuitions best. Do not worry about right answers; follow what feels true.

  The branch questions
  To navigate this map, respond to each scenario based on your intuition. There are no correct scientific answers here, only philosophical commitments. Each choice closes a door on certain theories while opening others. Be honest about whether you trust memory, physics, or the first-person report. Your path determines whether dreams are real events or waking fictions. Some questions probe the nature of time, while others test the limits of selfhood. Read each case carefully before deciding.

  1. **The Lucid Signal:** Consider the lab case where sleepers signal by moving their eyes. Does this prove experiences happen *during* sleep, or is it just a reflex-like trick the brain plays? If you say trick, you deny experience exists during sleep. This leads directly to the view that dreams are illusions created at waking.
  2. **The Time Stretch:** Consider the case where you sleep for minutes but dream for an hour. Did your mind actually stretch time, or did it invent the duration when you woke up? Choosing invention means dream-time does not track sleep-time. This forces you to explain how the brain compresses narratives instantly.
  3. **The Unobservable:** If no signal is sent, is there still a truth about whether you experienced something, or does "experience" require proof? Denying truth here limits what counts as real. It suggests unreported sleep is empty of experience by definition.
  4. **The Narrative Order:** Is the order of dream events fixed while you sleep, or does your waking memory arrange the pieces into a line? Choosing memory means the dream was not a movie running in real-time. It suggests the brain edits footage after the fact.
  5. **The Phenomenology:** Can the brain process information and plot scenarios without there being "something it is like" to undergo them? Saying yes allows for brain activity without conscious experience. This separates cognitive processing from feeling.
  6. **The Continuing Self:** Is there one continuous "you" throughout the night, or are there only disconnected moments later claimed by a waking self? Denying continuity splits the sleeper from the waker. It suggests the reporting self is a fiction constructed from fragments.

  The leaves
  Here are the eight possible endpoints of your journey through the chart.

  1. **The Skeptic:** Dreams are not experiences; reports are merely waking impressions. *Awkwardness:* Must dismiss lucid eye signals as non-experiential reflexes, contradicting the dreamer's own testimony.
  2. **The Realist:** Dreams are perception-like streams occurring in real-time. *Awkwardness:* Must explain how dream-time matches sleep-time despite contrary reports of long adventures in short naps.
  3. **The Storyteller:** Experiences are real, but the narrative order is assembled at waking. *Awkwardness:* Denies the dream felt like a movie while it was happening, making the flow an illusion.
  4. **The Time-Warper:** Ordered experience is real, but dream duration is flexible and independent of clock time. *Awkwardness:* Requires physics-defying subjective time dilation, bending the rules of mental duration.
  5. **The Rehearser:** The brain runs cognitive simulations without phenomenology; reports are reconstructions. *Awkwardness:* Claims you did the work without feeling anything, separating thought from consciousness.
  6. **The Checkpoint:** Experiential moments exist, but no subject binds them; the "I" is retrospective. *Awkwardness:* Dissolves the continuity of personal identity across the night, making the waker a new entity.
  7. **The Ghost:** Experiences exist without a subject and without order. *Awkwardness:* Incoherent; experience implies a subject, leaving this view logically unstable.
  8. **The Silent Film:** Ordered experience exists but without phenomenology. *Awkwardness:* Contradictory; order implies experience, making silent film an oxymoron.

  Empty cells
  The Ghost and Silent Film leaves represent logical combinations the chart allows but no theorist occupies. The Ghost view is likely incoherent because experience conceptually requires a subject to whom things happen. The Silent Film is unattractive because ordered sequences usually imply phenomenological flow. These cells remain empty not because they are empirically falsified, but because they collapse under conceptual scrutiny. They serve as boundary markers for what counts as a viable theory of mind. Most philosophers avoid them to preserve the link between consciousness and selfhood. Consequently, the logical space is sparser than the branching questions suggest. The viable theories cluster around the six named leaves. The empty cells highlight where intuition fails to produce a stable position.

  Where the chart breaks
  **Flag 1:** The Storyteller and Checkpoint views are difficult to separate empirically. Both deny a continuous movie, differing only on whether fragments were experienced. **Flag 2:** Readers will refuse The Unobservable question. Most assume facts exist without proof, making the "no fact" branch hard to populate. **Flag 3:** The Realist and Time-Warper leaves may feel identical to laypeople. Both accept real experience, diverging only on clock-time mapping. This chart cannot fully resolve those overlaps.
