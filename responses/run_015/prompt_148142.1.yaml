  2. **P(ZFC is inconsistent | PA is consistent)** — how much of the risk you locate in the set-theoretic strength (Infinity, Separation, Replacement, Choice) as opposed to in arithmetic.
  3. **P(we would already have found it | ZFC is inconsistent)** — how much evidential weight you actually assign to the fact that a century of intensive use by a large community has not produced a contradiction. I am suspicious that this evidence is weaker than it is usually made out to be: mathematicians do not search the space of derivations uniformly, they investigate statements that look natural, tractable, or important, and there is no obvious reason why the shortest contradiction in a strong theory would first surface in that region. Tell me whether you buy that argument; and tell me, conditional on inconsistency, roughly how long you would expect the shortest inconsistency to be, and how that length compares to what a century of human attention could plausibly have found.
