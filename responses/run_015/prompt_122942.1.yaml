  People who deploy this sentence to end an argument are most likely relying on an equivocation between **Reading 1 (Strict Causal Inefficacy)** and **Reading 2 (Normative Stipulation)**. They borrow the rhetorical force of Reading 1—which implies violence is useless and therefore refusal is merely prudent—to shame the opponent, while retreating to the safety of Reading 2—which defines violence out of the category of "solutions"—if challenged on historical grounds. This reading cannot bear the weight they put on it because it conflates instrumental utility with moral legitimacy; once separated, the claim either becomes empirically false (undermining the uncle's prudence argument) or morally tautological (supporting the friend's view that violence is bad but sometimes necessary).
