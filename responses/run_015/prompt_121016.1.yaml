answer: |-
  ### Exam Question

  **Module:** PHI3042 Philosophy of Science
  **Section:** B
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000–1200 words

  **Question:**

  Friedman's instrumentalism suggests that predictive success licences representational falsehood in scientific models. However, if de-idealising a model's assumptions destroys its predictive tractability, does this demonstrate that falsehood is *constitutive* of the model's success, or merely a pragmatic convenience? Critically assess whether predictive accuracy can ever justify abandoning the requirement for structural correspondence in scientific explanation.

  ***

  ### Model Answer

  Milton Friedman's 1953 methodology posits that the validity of a theory rests solely on its predictive accuracy, rendering the realism of its assumptions irrelevant. This 'F-twist' argues that agents behave *as if* they maximise returns, regardless of psychological reality. While this secures the utility of economics as a predictive tool, it creates a profound tension with the scientific aim of explanation. If a model predicts well but relies on demonstrably false assumptions, does it explain? The crux of the matter lies in the role of idealisation. Specifically, when de-idealising a model renders it intractable or predictive failure ensues, we must determine whether this falsehood is an essential feature of the world's structure or a limitation of our modelling capacity.

  The instrumentalist defence is robust regarding prediction. If the goal of science is merely to anticipate phenomena, the ontological status of assumptions is indeed secondary. Friedman argues that significant theories are often 'wildly inaccurate' in their assumptions precisely because they abstract away from complicating details. To demand realistic assumptions is to demand a theory that explains everything and predicts nothing. In this light, predictive accuracy justifies the *use* of the model for policy or forecasting. However, this conflates predictive success with explanatory depth. A model can predict the trajectory of a projectile using Newtonian physics without committing to the existence of absolute space, but this does not mean absolute space is real; it means the model is empirically adequate within a specific domain.

  The requirement for structural correspondence arises when we ask *why* the prediction holds. Explanation typically demands identifying the mechanisms that generate the phenomenon. Here, the F-twist falters. If a model relies on the assumption of perfect information to predict market equilibrium, but real agents operate with bounded rationality, the model fails to explain *how* equilibrium is reached. It merely asserts *that* it is reached. Uskali Maki's critique suggests that we must distinguish between 'negligibility' assumptions (factors that are causally irrelevant) and 'domain' assumptions (factors that define the scope). Friedman often treats domain assumptions as negligible, which obscures the causal structure.

  This brings us to the critical issue of de-idealisation. If removing the false assumption (e.g., introducing transaction costs or information asymmetry) causes the model to collapse mathematically or lose predictive power, the instrumentalist claims victory: the falsehood was necessary for success. However, the realist counters that this demonstrates the model is a computational tool, not a representation of reality. The falsehood is constitutive of the *model's tractability*, not the *phenomenon's existence*. Nancy Cartwright argues that such models describe 'nomological machines'—sheltered arrangements where the laws hold—rather than universal truths. If de-idealisation breaks the model, it suggests the model captures a specific, idealised capacity rather than a fundamental law.

  Therefore, predictive accuracy cannot justify abandoning structural correspondence if the aim is explanation. Accuracy licences acceptance for specific pragmatic ends, but not ontological commitment. The tension is resolved by recognising a division of labour: instrumentalism suffices for prediction, but realism (or at least structural realism) is required for explanation. If we abandon structural correspondence entirely, we risk 'black box' science where we know inputs and outputs but possess no understanding of the mechanism. This leaves science vulnerable to failure when conditions shift outside the original predictive domain.

  In conclusion, while the F-twist correctly identifies that realistic assumptions are not a prerequisite for prediction, it fails to account for the explanatory role of science. The fact that de-idealisation breaks predictive power indicates that the idealisation is managing complexity, not revealing truth. Predictive accuracy licences the model as a tool, but without structural correspondence, it remains a tool without a manual. We should not abandon the requirement for structural correspondence; rather, we must acknowledge that highly predictive models often sacrifice explanatory truth for mathematical tractability.

  ***

  ### Marking Scheme (20 Marks)

  **Grade Boundaries & Specific Moves**

  **A Grade (16–20 Marks)**
  *   **Argumentative Depth:** Explicitly distinguishes between *predictive adequacy* (instrumental value) and *explanatory power* (structural value). Does not treat them as synonymous.
  *   **The De-idealisation Move:** Specifically addresses the prompt's constraint regarding de-idealisation. Argues that if de-idealisation breaks the model, the falsehood is likely a feature of *tractability* rather than *ontology* (e.g., referencing Cartwright's capacities or Maki's isolations).
  *   **Critical Synthesis:** Rejects the binary choice. Concludes that predictive accuracy licences *use* but not *belief*.
  *   **Precision:** Uses terminology correctly (e.g., 'structural correspondence', 'ontological commitment', 'tractability').

  **B Grade (12–15 Marks)**
  *   **Competent Analysis:** Accurately summarises Friedman's F-twist and the realist counter-argument.
  *   **Addressing the Prompt:** Discusses de-idealisation but may treat it superficially (e.g., simply stating "realistic models are harder to build" without analysing *why* that matters for truth).
  *   **Conclusion:** Reaches a conclusion, but it may be slightly one-sided (either fully defending Friedman or fully dismissing him without nuance).
  *   **Clarity:** Well-structured, but may lack the philosophical precision of an A-grade response regarding the distinction between use and belief.

  **C Grade (8–11 Marks)**
  *   **Descriptive:** Primarily summarises Friedman's 1953 essay without engaging deeply with the philosophical implications.
  *   **Missing Key Element:** Fails to adequately address the de-idealisation constraint or the link between explanation and structure.
  *   **Confusion:** May conflate 'false assumptions' with 'wrong theories'.

  **Common Errors (Deductions)**
  *   **-2 Marks:** Treating the question as a general "Realism vs. Anti-Realism" essay without focusing on the specific mechanism of *modelling* and *idealisation*.
  *   **-2 Marks:** Failing to use British English spelling (e.g., 'license' instead of 'licence' for the noun, 'idealization' instead of 'idealisation').
  *   **-3 Marks:** Ignoring the de-idealisation clause of the question entirely.
  *   **-2 Marks:** Exceeding or falling significantly short of the word count (±15%).

  ***

  ### Reflection on the Model Answer

  **Where my reasoning is most likely to fail:**

  The model answer concludes that predictive accuracy licences *use* but not *belief*, maintaining that structural correspondence is necessary for explanation. The specific argument that would change my mind on this verdict is a robust defence of **empirical equivalence combined with the 'No Miracles' argument applied to instrumental success.**

  If it could be demonstrated that a model with demonstrably false assumptions maintains high predictive accuracy across *widely divergent* background conditions (not just within a sheltered 'nomological machine'), this would suggest the 'false' assumptions are tracking a deeper, perhaps non-obvious structural reality that our current vocabulary labels as 'false'. In other words, if the 'lie' predicts perfectly everywhere we look, the fault may lie in our definition of 'realism' rather than the model's representational status. If the 'as if' behaviour is indistinguishable from 'is' behaviour across all possible interventions, the distinction between instrumental utility and structural truth collapses, rendering the demand for structural correspondence redundant.
