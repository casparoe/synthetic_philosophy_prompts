  ### **Repugnance Ranking & Scores**

  1.  **Buying and Selling of Votes** (Score: 9.5/10)
  2.  **Sale of Kidneys** (Score: 8.5/10)
  3.  **Price Gouging During Emergencies** (Score: 6.0/10)

  ### **Tiers**

  *   **Tier 1 (Fundamental Rights Violations):** Vote Buying, Kidney Sales
  *   **Tier 2 (Distributive Fairness Violations):** Price Gouging

  ### **Explanations**

  *   **Vote Buying:** The covenant fails to mitigate repugnance here because the structural corruption of political equality is inherent to the exchange itself, rendering the participants' intent irrelevant.
  *   **Kidney Sales:** While the ritual softens the symbolic commodification of the person, it cannot negate the physical harm and economic desperation that drive the transaction.
  *   **Price Gouging:** The covenant is most effective in this case because explicitly affirming communal values can morally offset the perception of exploitation without altering the price mechanism.
