  **Whiteboard Layout & Sequence (40 Minutes)**

  **1. Board Left: The Introspective Datum (0–10 mins)**
  *   **Draw:** A stick figure with a speech bubble: "I feel a sharp, private, intrinsic redness/pain."
  *   **Label:** "The Folk Psychological Model."
  *   **Write:** "Introspection = Direct Access to Property."
  *   **Action:** Ask the group to endorse the statement: "My experience *has* a quality that exists only in the experience." Get nods. This validates their intuition before challenging it.
  *   **Head Off Misconception #1 ("Consciousness doesn't exist"):** Immediately underline "I feel." Say: "Illusionism accepts the *state* exists. You are conscious. You are reporting. We are questioning the *property* reported." Distinguish **Access Consciousness** (reporting/functional) from **Phenomenal Consciousness** (the 'what-it's-likeness' as an intrinsic quality). Write: "Illusionism ≠ Eliminativism of State."

  **2. Board Center: The Mechanism of Error (10–25 mins)**
  *   **Draw:** A box labeled "Introspective Module" connecting "Physical State" to "Report."
  *   **Draw:** A distorted arrow between Physical State and Report. Label: "Non-Veridical Representation."
  *   **Write:** "Introspection is a Sensor, not a Mirror."
  *   **Head Off Misconception #2 ("Who is having the illusion?"):** As you draw the box, state: "There is no homunculus looking at the output. The system *operates as if* the property exists. The 'illusion' is a structural mismatch in the code, not a visual trick seen by a little man." Emphasize that the *representation* is real, even if the *represented property* is not.
  *   **The Carrying Example:** **VR Thermal Feedback.**
      *   **Scenario:** You touch a virtual stove. You jerk back. You feel heat.
      *   **What it Needs:** It must trigger the full behavioral and phenomenological response (withdrawal, complaint, "it hurts"). It must be *functionally equivalent* to real pain for the agent.
      *   **What it Must Lack:** It must lack the corresponding physical property (no thermal energy transfer, no tissue damage).
      *   **Application:** Map this to the brain. The brain generates a "heat" signal (physical state) that represents itself as "phenomenal heat" (introspective report). The "phenomenal heat" is the UI icon, not the code.

  **3. Board Right: The Illusionist Conclusion (25–35 mins)**
  *   **Draw:** "Physical State" → [Introspective Filter] → "Phenomenal Report."
  *   **Write:** "Quasi-Phenomenal Properties."
  *   **Action:** Explain that the brain uses "phenomenal" properties as a user interface to manage complex internal states efficiently. Just as the desktop icon is blue but the file isn't, the pain is "hurtful" but the neural state isn't.
  *   **Synthesis:** Connect back to the economists (utility functions), neuroscientists (neural correlates), and historians (changing concepts of self). The "self" is the user interface.

  **4. The Test Question (35–40 mins)**
  *   **Ask:** "If introspection is the only tool we have to detect phenomenal properties, and introspection is the source of the illusion, what independent calibration could ever refute illusionism?"
  *   **Target Answer:** They should recognize that no first-person evidence can refute it, because the evidence itself is compromised. This confirms they understand the *introspective opacity* central to the view. If they say "brain scans," probe whether scans show *properties* or just *correlates*.

  **Scope Refusals (Openly State These)**
  1.  **Ethics:** "We are not discussing whether torture is permissible if pain is an illusion. The functional response remains." (Prevents moral outrage derailing the metaphysics).
  2.  **The Hard Problem Solution:** "We are not solving the Hard Problem; we are dissolving it by denying the explanandum exists." (Prevents demands for a neural mechanism of qualia).
  3.  **Panpsychism Comparisons:** "We are not weighing this against panpsychism today. That requires a separate metaphysics session." (Keeps focus on internal coherence).

  **Confidence Rating & Risk Assessment**

  **Confidence:** 85%

  **Least Sure Point:** **Head Off Misconception #2 ("Who is having the illusion?").**
  *   **Why:** This is the strongest philosophical objection to illusionism (the "self-refutation" or "homunculus" worry). Even if you state "it's a subsystem error," grad students (especially philosophers) will press: "A misrepresentation requires a truth condition. If the property doesn't exist, what makes the representation *about* that property rather than nothing?"
  *   **Risk:** In a 40-minute window, you may not have time to fully unpack the teleosemantic account of content required to answer this satisfactorily. If you gloss over it, the philosophers may dismiss the view as incoherent, and the neuroscientists may think you're positing magic. You are leaning on the assumption that a functionalist account of representation is accepted by the room, which might not be true for the historian or some philosophers. If this cracks, the whole "illusion" framing collapses into "error theory" without a mechanism.
