answer: |-
  # Specification Document: Desiderata for a Core-Cognition Theory of Analogy

  **To:** Proponents of the Hofstadter-Sander Thesis
  **From:** Philosophy of Mind / Physics Interface
  **Subject:** Necessary Conditions for a Theory of Analogy as Fundamental Cognition

  If analogy-making is to be posited not merely as a rhetorical device or a high-level reasoning heuristic, but as the *fundamental engine* of cognition (the "core cognition" thesis), the theory must function as a unified field theory of mind. It cannot simply account for "A is like B" in isolation; it must explain how the mind constructs "A" and "B" in the first place.

  Below are the desiderata required to validate this claim. They are divided into non-negotiable empirical constraints (must fit the data) and theoretical preferences (where camps may differ, provided consistency is maintained).

  ---

  ## 1. Range of Phenomena
  *Non-Negotiable: The theory must cover the full dynamic range of cognitive processing.*

  *   **Perceptual Categorization:** The theory must explain how raw sensory input is grouped into objects without presupposing the categories. If analogy is core, seeing a chair and recognizing it as "chair-like" must be an analogical act (mapping current input to a stored schema).
  *   **Linguistic Metaphor:** It must account for novel metaphor generation ("time is a river") versus lexicalized metaphor ("grasping an idea").
  *   **Scientific Model-Building (The Hydraulic/Electrical Case):** The theory must explain the utility of 19th-century analogies (e.g., modeling electricity as fluid flow) *prior* to formalization. Crucially, it must explain the **lifecycle of the analogy**: why it was generative during the discovery phase but discarded (or subsumed) once the Navier-Stokes or Maxwell formalisms were established. A core-cognition theory cannot treat the analogy as merely "true" or "false"; it must model it as a temporary structural scaffold that becomes obsolete when the isomorphism is formalized.
  *   **Cross-Domain Mathematical Abstraction:** It must handle mappings where surface features are zero (e.g., mapping group theoretic structures to crystallographic symmetries). If the theory relies on feature overlap, it fails here.

  ## 2. Conceptual Distinctions
  *Non-Negotiable: The theory must preserve functional differences that behave differently in reasoning.*

  *   **Productive vs. Dead Metaphor:** A live analogy generates new inferences (predictive power); a dead metaphor is a lexical lookup (retrieval speed). The theory must distinguish the cognitive state of "exploring a mapping" from "accessing a definition."
  *   **Structural Alignment vs. Superficial Matching:** It must distinguish between mapping relations (cause-effect, hierarchy) and mapping attributes (color, shape). Scientific discovery relies on the former; cognitive bias often relies on the latter.
  *   **Discovery vs. Pedagogy:** An analogy used to *find* new truth (Rutherford's solar system atom) carries different epistemic weight and risk than an analogy used to *teach* established truth (the water-flow explanation of voltage). The theory must account for the difference in validation procedures required for each.
  *   **Explicit Representation vs. Distributed Emergence:** The theory must specify whether relational structures (e.g., `CAUSE(A, B)`) must be explicitly represented to be mapped, or if the mapping can emerge from activation patterns in a network. This is a camp-specific preference, but the choice must be consistent across perception and abstraction.

  ## 3. Empirical and Computational Constraints
  *Non-Negotiable: Consistency with cognitive science and computational reality.*

  *   **Effort and Context-Sensitivity:** Analogical reasoning is not automatic; it is resource-intensive and highly sensitive to context (priming, goal state). A theory that makes analogy too automatic (like basic pattern recognition) contradicts the observed cognitive load of complex analogical transfer.
  *   **Comparative Cognition:** The theory must accommodate the gradient of analogical capacity. Non-human animals and young children exhibit analogical capacities (relational matching) but lack the recursive depth of adults. A "core cognition" theory cannot be all-or-nothing; it must allow for scaling.
  *   **Distributed Approximation and Failure Modes:** Modern distributed systems (transformers/neural nets) exhibit analogical behavior without explicit symbolic rules. The theory must be compatible with this substrate but must also explain why these systems fail differently than humans (e.g., statistical hallucination vs. structural systematicity errors).

  ## 4. Boundary Conditions
  *Non-Negotiable: The theory must predict failure, not just success.*

  *   **Specific Failure Signatures:** The theory must predict *when* analogy fails. Does it fail due to working memory overload? Surface feature interference? Inability to re-represent the source?
  *   **Resistance to Distant Mapping:** Humans often resist valid but distant structural mappings (e.g., initial resistance to wave-particle duality) while accepting invalid surface mappings. The theory must explain this resistance as a feature of the mechanism, not noise.
  *   **The "Stop" Condition:** In scientific modeling, when does the analogical inference stop? (e.g., We model atoms like solar systems, but we do not infer atoms have gravitational orbits in the Newtonian sense). The theory must specify the boundary where the mapping is blocked.

  ---

  ## 5. Analysis of Tensions and Unsatisfiability

  ### The Fundamental Tension: Perception vs. Explicitation
  There is a significant risk of joint unsatisfiability between the requirement that analogy be **fundamental to basic perception** and the requirement that it be **representationally explicit enough for disciplined scientific discovery**.

  *   **The Conflict:** If analogy is perceptual (Hofstadter's view), it should be fast, automatic, and largely unconscious (System 1). If analogy is the engine of scientific discovery (Gentner's view), it requires slow, deliberate, explicit manipulation of relational structures (System 2).
  *   **The Risk:** A mechanism optimized for rapid perceptual slippage (blurry categories) is often ill-suited for the rigorous, binary constraints required for formal mathematical proof or falsifiable scientific modeling.
  *   **Resolution Requirement:** To avoid unsatisfiability, the theory must propose a mechanism for **representational redescription**. It must explain how low-level, fuzzy analogical percepts are "chunked" or "reified" into high-level, explicit symbols that can then be manipulated analogically at a higher order. Without this bridge, the theory collapses into either mere associationism (too low-level) or homuncular symbolic logic (too high-level).

  ### The Most Exclusionary Requirement
  **The Prediction of Specific Failure Modes.**
  Most theories can be tuned to explain successful analogical transfer. The requirement that the theory predict *specific patterns of human error* (e.g., why we prefer surface similarity under cognitive load, or why we over-extend a scientific model past its break-point) does the most work in excluding rival theories. Connectionist models often fail via statistical drift; symbolic models fail via rigidity. Human analogy fails via *structural misalignment disguised as surface match*. A theory that cannot derive this specific error signature is insufficient.

  ### Suspected Incompatible Pair
  **"Automaticity in Perception"** and **"Systematicity in Reasoning."**
  It is suspected that a single, unitary mechanism cannot maximize both. If the system is sensitive enough to map perceptions instantly, it risks too many false positives in reasoning. If it is constrained enough to ensure systematicity in science, it becomes too slow for perception. A viable theory must posit *multiple levels* of the same mechanism, not a single monolithic process.

  ---

  ## 6. Evaluation of Broad Approaches

  | Approach | Score (1-5) | Justification against Desiderata |
  | :--- | :---: | :--- |
  | **Structural-Alignment (Gentner)** | **3** | **Strengths:** Excellent on scientific discovery, structural vs. superficial distinctions, and systematicity. Predicts failure modes well (e.g., structural consistency constraints).<br>**Weaknesses:** Struggles with the "core cognition" claim. Treats analogy as a high-level process operating on pre-existing representations, failing the *Perceptual Categorization* desideratum. It assumes the objects exist before the analogy begins. |
  | **High-Level Perception (Hofstadter)** | **4** | **Strengths:** Best fit for the "core cognition" thesis. Successfully merges perception and reasoning. Explains the fluidity of categories and the hydraulic/electrical scaffolding as "conceptual slippage."<br>**Weaknesses:** Lacks formal rigor. Struggles to explain the *boundary conditions* of scientific formalism (why we discard the analogy for math). Computationally intractable in its full specification; vague on the "stop condition" for slippage. |
  | **Distributed/Statistical (Modern AI)** | **2** | **Strengths:** Satisfies the *Empirical Constraints* regarding neural implementation and gradient capacity (animals/children/Adults). Handles perception and language in a unified substrate.<br>**Weaknesses:** Fails the *Conceptual Distinctions*. Struggles to distinguish dead vs. live metaphor structurally. Fails the *Failure Mode* test: its errors are statistical hallucinations, not the specific structural over-extensions humans make. Cannot guarantee the *Systematicity* required for scientific discovery without external scaffolding. |

  **Summary Recommendation:**
  To satisfy the physicist's demand for rigor and the philosopher's demand for scope, a hybrid model is required. It must adopt Hofstadter's scope (analogy as perception) but enforce Gentner's constraints (structural systematicity) at higher levels of abstraction, likely mediated by a mechanism of **symbolic re-description** that allows fuzzy analogical percepts to crystallize into the explicit relations required for scientific formalism. Without this transition mechanism, the "core cognition" thesis remains a metaphor about metaphors.
