  4.  **Refining the Philosophical Distinction:**
      *   *Causal Work:* The building physically forces future events to happen a certain way. (e.g., you can't build a skyscraper here because the foundation won't hold it).
      *   *Hermeneutic Work:* The building tells a story that makes people *believe* certain futures are right or wrong. (e.g., preserving this makes us feel like a industrial city, influencing zoning votes later).
      *   *My Argument:* The convergence faction is right about causality (the river matters more than the shed). But the preservation faction is right about memory (the shed makes the river's history legible). We are voting on memory, not just logistics.

