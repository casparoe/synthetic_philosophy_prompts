      *   **The Pivot/Justification:** Why preserve if the causal claim is weak? Because hermeneutic work (community identity, sense of continuity) has real-world value. It stabilizes the neighborhood socially, even if not logistically.
      *   **Strongest Counter-Argument (Faction B/Demolition):** Acknowledge the cost and the risk of "aestheticizing contingency." Admit that spending extra money on a building that isn't causally unique is a hard sell economically.
