answer: |-
  Maimonides and Nachmanides are fundamentally disputing the metaphysical status of sacrifice rather than speaking past each other, yet Maimonides' view of divine accommodation preserves normative authority by grounding obligation in divine command rather than intrinsic ritual necessity. Maimonides argues in the *Guide for the Perplexed* that sacrifices were instituted to wean Israel off idolatry, treating the law as a pedagogical tool adapted to human psychological limitations, whereas Nachmanides contends in his commentary on Leviticus that sacrifices possess intrinsic cosmic significance independent of historical context. The concern that accommodation renders the command "fake" misunderstands Maimonides' definition of divine wisdom; for him, a law is not false because it is adaptive, but is true because it effectively guides humanity toward perfection under God's sovereign will. Normative authority in the Maimonidean framework does not depend on the human comprehension of the reason (*ta'amei hamitzvot*), but on the fact of revelation, meaning the obligation remains binding regardless of whether the ritual is an end in itself or a means to an end. However, your intuition regarding eternal binding is partially correct, as this is the precise point of friction: Maimonides' accommodation implies that sacrifices may cease in the Messianic era when intellectual worship supplants ritual instinct, while Nachmanides insists their intrinsic value mandates their perpetuity. Thus, accommodation does not weaken the law's authority in the present, but it does shift the basis of its eternality from ontological necessity to contingent divine will.
