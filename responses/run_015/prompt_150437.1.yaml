  1. Start by securing agreement that all policy is essentially a hypothesis about human behavior, because democracy cannot be framed as inquiry unless she accepts current rules are just predictions waiting to be falsified.
  2. Anchor the discussion on a failed urban housing pilot where data showed increased displacement, forcing the team to rewrite the eligibility rules rather than simply tallying resident complaints.
  3. Defuse her likely insistence on a single expert arbiter or that disagreement signals failure immediately during the example analysis, framing conflict instead as the necessary data signal that triggers rule revision.
  4. Ask whether the process concludes once the new policy is implemented, because only if she says no does she demonstrate she sees democracy as an ongoing method rather than a final outcome.
  5. Omit Dewey's metaphysical framing of how a 'public' constitutes itself around indirect consequences, because defining the ontological boundaries of affected parties requires too much abstraction for a practical data-science conversation.
