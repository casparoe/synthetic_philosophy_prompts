answer: |-
  The reclassification of Pluto in 2006 serves as a stress test for the standard apparatus of verbal disputes and metaontology. It is a case where the machinery of analytic philosophy is applied to a concrete historical episode, and in turn, the episode exerts pressure back on the machinery, revealing fractures in the theoretical framework. The following analysis maps the episode onto the theory and then evaluates the theory's adequacy in light of the case.

  ### 1. The Apparatus of Verbal Disputes

  To situate the Pluto episode within the standard apparatus for verbal disputes, we must isolate the disputed sentence and attempt to construct a topic-neutral paraphrase. The explicit disagreement centers on the sentence: **"Pluto is a planet."**

  Under the verbal dispute hypothesis, the parties agree on all non-semantic facts but disagree on the meaning of "planet." The best candidate for a topic-neutral paraphrase—a sentence describing the underlying state of affairs without using the contested term—would be: **"Pluto orbits the Sun, possesses sufficient mass for hydrostatic equilibrium, but does not dynamically dominate its orbital zone."**

  Both the International Astronomical Union (IAU) defenders and the dissenting planetary scientists agree on this paraphrase. They agree on the orbital mechanics, the shape, and the presence of debris. The disagreement arises only when mapping this physical description onto the label "planet." The IAU maps it to "dwarf planet"; the dissenters map it to "planet."

  According to the strict conditions of the verbal dispute apparatus, once the paraphrase is accepted, the substantive disagreement should collapse. The parties should acknowledge they are merely debating which linguistic convention to adopt. However, the conditions are not fully met in this case. While there is a reading on which the disagreement is about language (the definition of the word), something survives the paraphrase. The dissenters do not merely say, "We prefer the old word usage." They argue that the IAU definition is *scientifically inferior* for understanding the solar system. They claim the "cleared neighborhood" criterion excludes objects that share relevant geological and physical properties with the eight canonical planets. Thus, while the dispute has the *structure* of a verbal disagreement, the parties behave as if there is a substantive disagreement about scientific taxonomy that transcends mere labeling. The apparatus identifies the verbal component correctly but fails to capture why the parties refuse to treat it as merely verbal.

  ### 2. Metaontological Stances and Phenomenology

  Running the three familiar metaontological stances over the case yields distinct interpretations of the parties' activity and distinct predictions about the episode's phenomenology—the heat, the resentment, and the public sense of falsification.

  **Ontological Realism** posits that there is a fact of the matter about which kinds exist in nature, independent of human convention. On this view, the IAU either correctly identified the natural kind "planet" or they failed. The dispute is a genuine investigation into the structure of reality.
  *   *Phenomenology:* This stance best predicts the intensity of the public reaction. If "planet" refers to a real natural kind, then the IAU announcement was not a policy change but a correction of a false belief about the world. The public felt lied to because, on this view, they were told a falsehood ("Pluto is not a planet") that contradicted the fabric of reality. However, Realism struggles to explain why the dispute is so intractable if nature simply carves at the joints; usually, evidence resolves such disputes. The persistence of the disagreement suggests there may not be a single "joint" to carve.

  **The Carnapian Treatment** distinguishes between internal questions (asked within a linguistic framework) and external questions (about the choice of framework). "Is Pluto a planet?" is an internal question, easily answered once the IAU definition is adopted. The 2006 assembly was an external debate about which framework to use. For Carnap, this choice is practical, based on expediency and fruitfulness, not truth.
  *   *Phenomenology:* This stance predicts the heat is misplaced. The public and dissenting scientists are treating a practical choice as a theoretical truth. The resentment is a category error. While this explains the irrationality of the outrage, it fails to validate the scientists' argument that the new framework is *worse* for science, not just less convenient. Carnapianism renders the scientific arguments about dynamical dominance as merely pragmatic preferences, which undersells the theoretical reasoning offered by both sides.

  **Quantifier Variance** suggests that both "Pluto is a planet" (in the old language) and "Pluto is not a planet" (in the new language) are true under admissible interpretations. The disagreement is verbal, and the parties are talking past each other.
  *   *Phenomenology:* This view predicts the dispute should be easily dissolvable by translation. Once the dissenters realize the IAU is speaking "IAU-English," they should accept the statement is true in that dialect. The fact that the principal investigator of New Horizons continued to call Pluto a planet *knowing* the IAU definition suggests he was not merely speaking a different dialect but rejecting the authority of the IAU dialect. Quantifier variance cannot explain why one interpretation was enforced over the other at such high cost. It predicts a peaceful pluralism; the case delivered a hegemonic conflict.

  ### 3. Concept Anchoring: Exemplar vs. Criterion

  The distinction between concepts anchored to exemplars and concepts anchored to criteria does significant work here that the standard verbal dispute apparatus misses.

  For seventy years, the concept "planet" was anchored to **exemplars**. It was learned ostensively: "These are the planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto." Pluto was a paradigm case, part of the extension by fiat of history. In contrast, the IAU attempted to shift the anchoring to a **criterion**: "A planet is any body that satisfies conditions X, Y, and Z."

  Disputes over criterion-anchored concepts are experienced as stipulation; disputes over exemplar-anchored concepts are experienced as discovery. When a concept is anchored to exemplars, the exemplars fix the meaning. To remove an exemplar (Pluto) is not to refine the definition but to break the reference of the term for the user. This explains the inflammatory nature of the episode better than the theory of metalinguistic negotiation.

  In metalinguistic negotiation, parties argue over which concept to use to achieve certain communicative goals. It implies a degree of voluntary choice. But for the public and many scientists, the concept was not up for negotiation because its content was fixed by the object itself (Pluto), not by a description. The IAU attempted to switch the anchoring mechanism mid-dispute. They treated "planet" as a criterion-bound variable to be optimized; the public treated it as a proper name for a set of objects including Pluto.

  This distinction is not merely metalinguistic negotiation redescribed. Metalinguistic negotiation assumes the parties are aware they are negotiating meaning. The phenomenology of the Pluto case is that the IAU claimed to be *discovering* the true definition, while the dissenters claimed the IAU was *stipulating* a false one. The anchoring distinction explains this asymmetry: the IAU was operating on a criterion model (where definition is flexible), while the dissenters were operating on an exemplar model (where definition is fixed by history). The friction comes from the collision of these two cognitive architectures, not just a disagreement over utility.

  ### 4. Institutional Authority and Cost

  The standard theories are silent on two critical features of this episode: institutional authority and material cost.

  **Institutional Authority:** Analytic metaphysics and philosophy of language typically assume a flat landscape of speakers. In the Pluto case, a specific body (the IAU) claimed the jurisdiction to fix the reference of a term for the global community. They settled a semantic question by a show of hands. None of the three metaontological stances has an account of how a vote confers semantic authority. Realism implies votes don't change nature; Carnap implies votes are just pragmatic agreements; Quantifier Variance implies votes are irrelevant to truth conditions. Yet, the vote *did* change the usage in textbooks and official communications. The theory is silent on the mechanism by which bureaucratic fiat becomes linguistic fact. This is not just a gap the episode exposes; it is a counterexample to the idea that semantic content is determined solely by usage or causal history. Here, content was determined by decree.

  **Cost:** The dispute was costly. Textbooks were rewritten, museum signage replaced, and public trust eroded. If the dispute were merely verbal, as the deflationist hopes, the cost of switching should be negligible—akin to changing a variable name in code. The high material and social cost suggests the classification carries weight beyond convenience. It determines funding, mission priority, and cultural capital. The fact that stipulation was costly is evidence against the dispute being *merely* verbal. It indicates that the "verbal" label underestimates the causal power of the classification. The theories treat language as floating above the world; this case shows language is embedded in institutions that have budgets and reputations. The silence here is profound: the theories have no variable for the *price* of a definition.

  ### 5. Impact on Theory

  The Pluto episode does not vindicate the deflationist. A deflationist wants to show that an apparently factual disagreement resolves into a framework choice, thereby dissolving the tension. Here, the tension persisted after the vote. The dissenters did not say, "We accept the new framework but prefer the old words." They continued to assert "Pluto is a planet" as a truth claim, implying the IAU framework was scientifically inadequate.

  Furthermore, the defenders of the new framework argued for it on grounds of **theoretical virtue**, not mere convenience. They argued that "clearing the neighborhood" was a physically significant property that grouped objects by formation history. This suggests that even "external" questions (in the Carnapian sense) are constrained by something more than pragmatics. They are constrained by the explanatory power of the taxonomy. If external choices were purely pragmatic, any definition would do. But the scientists argued that one definition was *better for science*.

  This forces a third category besides "verbal" and "substantive." We might call it **"Normative-Pragmatic."** It is not substantive because there is no mind-independent fact about whether Pluto is a planet (nature does not care about our labels). It is not merely verbal because the choice of label is not arbitrary; it is constrained by the goals of the scientific enterprise and enforced by institutional authority.

  Admitting this category costs the theory its purity. It requires metaphysics to acknowledge sociology. It requires the philosophy of language to acknowledge power. The deflationist wants to save us from ontology by reducing disputes to language. The Pluto case shows that language disputes *are* ontological disputes in practice, because the authority to define language is the authority to structure reality for the community. The episode suggests that the boundary between "what exists" and "what we say exists" is policed not by logic, but by assembly halls and voting booths. To account for this, theory must expand to include the mechanics of stipulation and the economics of terminology. Until it does, the standard apparatus remains silent on why a vote in Prague could change the world, and why that change still rankles.
