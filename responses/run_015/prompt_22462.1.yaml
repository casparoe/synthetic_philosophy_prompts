  3.  **Deconstruct the Lockean Proviso (in Nozick):**
      *   Original Lockean Proviso: Appropriation is okay if "enough and as good" is left for others.
      *   Nozick's Weakening: Appropriation is okay if others are not made *worse off* than they would have been in the state of nature (or baseline).
