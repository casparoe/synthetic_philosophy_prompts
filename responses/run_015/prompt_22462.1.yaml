      *   *Refining the Proviso Point:* The Proviso ensures the *starting gate* is fair. WCA shows the *race* ruins the pattern. The user thinks if the starting gate is shaky (Proviso hard to satisfy), the race doesn't count. But Nozick's point is: "Okay, let's grant you your patterned $D1$. Now watch it dissolve." The Proviso is about *acquisition*, WCA is about *transfer*. They operate at different logical levels.

