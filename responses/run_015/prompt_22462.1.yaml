          *   Stage 2: Justice in Transfer (Wilt Chamberlain applies here).
      *   *Clarification:* The WCA is a *thought experiment* about the logic of patterns vs. liberty. It assumes $D1$ is just *for the sake of argument*. It doesn't matter *how* $D1$ became just (whether through the Proviso or magic). The point is: *Even if* you achieve your favorite patterned $D1$, free exchange will ruin it.
