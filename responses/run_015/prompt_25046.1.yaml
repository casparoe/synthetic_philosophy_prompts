answer: |-
  This is a classic cluster of views in decision theory and effective altruism circles, and you have correctly identified the fault lines. You are essentially trying to hold onto **Expected Utility Theory (EUT)** and **Risk Neutrality** while rejecting their most famous implication: **Fanaticism**.

  Here is the consistency check you asked for.

  ### The Short Verdict
  **Formally, this does not hang together.** Specifically, (1), (2), and (5) are mutually incompatible within standard decision theory.
  **Pragmatically, it is a very common position,** but it requires you to admit that you are modifying standard EUT or relying on epistemic distinctions rather than pure decision-theoretic ones.

  Here is the breakdown of the specific tensions.

  ---

  ### 1. The Conflict Between (1), (2), and (5)
  You accept EUT (1) and Risk Neutrality (2). In Von Neumann-Morgenstern (VNM) decision theory, these commitments entail the **Continuity Axiom**.
  *   **Continuity:** If $A \succ B \succ C$, there exists some probability $p$ such that you are indifferent between $B$ and a lottery of $[p \cdot A, (1-p) \cdot C]$.
  *   **The Problem:** A probability threshold (5) violates Continuity. It says that at some point, a decrease in probability makes a outcome go from "valuable" to "zero value" discontinuously.
  *   **The Consequence:** If you adopt (5), you are technically rejecting standard EUT (1). You are adopting a modified decision theory (like "Lexical Decision Theory" or "Truncated Expectations"). This isn't necessarily fatal, but you should acknowledge you are no longer a pure EUT maximizer.

  ### 2. The Fanaticism Trap (2) vs. (3)
  You worry that (2) commits you to fanaticism. **It does, provided utility is unbounded.**
  *   If you are risk-neutral (linear utility) and utility is unbounded, then for any certain good (saving 1 life), there exists some huge enough utility (saving $N$ lives) such that even a tiny probability of $N$ outweighs the certain 1.
  *   **Pascal's Mugging** is just the limit case of this. If you reject the Mugging (3), you are implicitly rejecting the combination of Risk Neutrality + Unbounded Utility.
  *   **The Patch:** You cannot simply add a probability threshold (5) to fix this without breaking the math of (1). You usually have to choose between **Bounded Utility** or **Risk Aversion**.

  ### 3. The Existential Risk Problem (4) vs. (5)
  Your instinct that (5) might kill (4) is correct. This is the "Shut Up and Multiply" vs. "Common Sense" debate.
  *   **The Scale:** Serious existential risk estimates often range from $10^{-3}$ (optimistic) to $10^{-9}$ (pessimistic/long-term).
  *   **The Threshold:** To block Pascal's Mugging (where probabilities might be $10^{-50}$ or lower), you need a threshold. But if you set the threshold at $10^{-6}$ to stop muggers, you might ignore credible AI risk models that suggest a $10^{-4}$ or $10^{-5}$ chance of catastrophe.
  *   **Arbitrariness:** As you suspected, (5) is ad hoc. Where do you draw the line? If $10^{-9}$ is zero, why isn't $10^{-8}$? If you say "it depends on the evidence," you are no longer using a probability threshold; you are using an *epistemic* threshold (see below).

  ---

  ### How to Fix the Inconsistency

  You have three main paths to make your view consistent. Each requires sacrificing or modifying one of your original five points.

  #### Option A: Bounded Utility (Modify 2)
  Keep EUT (1), keep taking x-risks seriously (4), reject Mugging (3).
  *   **The Move:** Argue that utility is **bounded**. There is a maximum amount of "good" that can exist. Once you hit the cap, saving more lives adds no additional utility.
  *   **Why it works:** If utility is capped, a tiny probability of infinite (or massive) utility cannot outweigh a certain small utility. The math stops exploding.
  *   **Cost:** You have to abandon strict risk neutrality (2) over the very long term, or accept that saving $10^{100}$ lives isn't $10^{100}$ times better than saving 1 life.

  #### Option B: Epistemic Humility (Modify 1/5)
  Keep EUT (1), keep Risk Neutrality (2), reject Mugging (3) via *evidence*, not thresholds.
  *   **The Move:** Distinguish between **model probabilities** (x-risks) and **bare assertions** (Mugging).
      *   In the Mugging case, the probability is not actually $10^{-20}$; it is epistemically defeated. You have no reason to trust the claim, so the probability is effectively undefined or negligible due to lack of evidence.
      *   In the x-risk case, the $0.001\%$ is derived from models, physics, and history. It is a robust estimate.
  *   **Why it works:** You don't need a probability threshold (5). You just need to insist that EUT only applies to *well-grounded* probabilities.
  *   **Cost:** You have to do the hard work of distinguishing "credible tiny probabilities" from "mugging probabilities" without it looking like special pleading.

  #### Option C: Risk Aversion (Modify 2)
  Keep EUT (1), reject Mugging (3), keep x-risks (4).
  *   **The Move:** Adopt a risk-averse utility function (e.g., logarithmic). A 1% chance of saving 100 lives is worth *less* than certainly saving 1 life.
  *   **Why it works:** Risk aversion naturally dampens the influence of tiny probabilities of huge outcomes. It solves fanaticism without needing arbitrary probability cutoffs.
  *   **Cost:** This is a big pill to swallow for altruists. If you are risk-averse about *lives*, you might prefer saving 1 million lives for sure over a 50% chance of saving 3 million lives. Many longtermists find this unacceptable. (Note: You can be risk-averse over *personal* consumption but risk-neutral over *global* value, but that requires a specific argument about why the distinction exists).

  ### Recommendation

  Your current view (1–5) is unstable because (5) is a "hack" to fix the implications of (1) and (2).

  **The most robust consistent position is likely Option A (Bounded Utility) or Option B (Epistemic Constraints).**

  1.  **If you choose Bounded Utility:** You can keep risk neutrality for small stakes, but you admit that value saturates. This kills Pascal's Mugging mathematically without needing an ad hoc probability threshold.
  2.  **If you choose Epistemic Constraints:** You drop the probability threshold (5). Instead, you say: "I accept EUT, but I reject the input probabilities of Pascal's Mugging as epistemically invalid, whereas I accept x-risk probabilities as epistemically valid."

  **My advice:** Drop (5). It creates more problems than it solves (specifically regarding your view on x-risks). Replace it with a stronger defense of **why** x-risk probabilities are credible and Mugging probabilities are not (Option B), or consider **Bounded Utility** (Option A). This preserves your concern for existential risk (4) without committing you to handing over your wallet to a mugger (3).
