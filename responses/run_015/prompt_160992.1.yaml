  **Case 3: Provenance.** Message content same, but Judy learns it came over the Red net.
  *Why it bears:* Distinguishes constraint-based updating from evidence-based updating. Is the constraint a summary of evidence or the evidence itself?
  *R Prediction:* The source is standard evidence. Update priors via Bayes on the source, then apply R to the content. The rules disagree on the second step regardless of the first. The constraint remains a constraint.
