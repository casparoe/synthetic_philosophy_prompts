  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look like a truce document. "Memorandum of Partial Understanding."
      *   **Section 1: Agreed Claims.**
          *   1.1 Formalism: Unitary QM is sufficient. No collapse postulate.
          *   1.2 Measurement Problem: It's about recovering the *appearance* of stochasticity and the Born rule statistics.
          *   1.3 Derivation Status: The math of the Deutsch-Wallace proof is valid *if* the axioms hold. The dispute is on the *justification* of the axioms, not the algebra.
      *   **Section 2: Disagreements Table.**
