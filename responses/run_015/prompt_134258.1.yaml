answer: |-
  **MEMORANDUM OF PARTIAL UNDERSTANDING (AND PERSISTENT IRRITATION)**
  **Subject:** The Status of Probability in Unitary Quantum Mechanics
  **Parties:** The Decision-Theoretic Everettians (DTE) & The Determinist-Skeptics (DS)
  **Date:** After one year of arguing in a shared office space

  Look, we're not going to solve this today. But we've stopped throwing whiteboard markers at each other, which is progress. We agree on the physics, we disagree on the metaphysics of agency, and we're pretty sure the other side is either brilliant or begging the question. Below is the map of where we stand. If we get funded, we sign this.

  ### 1. Agreed Claims (The Common Ground)

  1.  **The Formalism is Unitary:** We agree that the Schrödinger equation applies universally. There is no collapse postulate. The state vector evolves deterministically. "Measurement" is just a specific type of interaction that generates entanglement between a system, an apparatus, and an environment.
  2.  **The Measurement Problem Remains:** We agree that simply having the formalism isn't enough. We need to recover the *empirical appearance* of stochastic outcomes and, specifically, the Born Rule statistics ($P = |\psi|^2$). If we can't explain why agents observe frequencies matching the Born Rule, the theory is empirically inadequate.
  3.  **The Derivation is Mathematically Valid:** We agree that the Deutsch-Wallace decision-theoretic proof is logically valid *conditional on its axioms*. If you accept premises like "Diachronic Consistency" and "Branching Indifference," the conclusion (that a rational agent must maximize Born-weighted utility) follows. The fight is not about the algebra; it's about whether the axioms are justified or if they smuggle in the conclusion.
  4.  **No "Ghost" Probabilities:** We agree there is no objective chance in the fundamental dynamics. Any probability must be derived from the deterministic structure plus facts about agents (uncertainty, caring, or rationality).

  ---

  ### 2. The Disagreements Table

  Here is where we stop shaking hands. We've phrased these so each side can read their column without feeling misrepresented, even if they think the other column is nonsense.

  | Crux | Neutral Phrasing of the Issue | DTE Formulation (Pro-Derivation) | DS Formulation (Skeptic) |
  | :--- | :--- | :--- | :--- |
  | **1. Axioms vs. Presupposition** | Can rational-choice axioms be applied over branches without already presupposing a branch-counting measure? | The axioms describe what it means to be a rational agent persisting through branching. "Branching Indifference" isn't assuming the Born rule; it's recognizing that mere duplication doesn't change value. To demand branch-counting is to misunderstand the ontology of the wavefunction. | The axioms implicitly rule out branch-counting by fiat. By asserting an agent *shouldn't* care about the number of branches, you are presupposing that amplitude-squared is the only valid measure. You haven't derived probability; you've defined "rationality" as "acting as if the Born rule is true." |
  | **2. Self-Locating Uncertainty** | Does branching destroy the indexical uncertainty required for standard probability? | Uncertainty is subjective. Before the split, I am uncertain about which future branch I will experience. This is sufficient for decision theory. The "incoherence problem" is solved by recognizing that probability is about betting behavior, not ontological randomness. | If the process is deterministic, there is no factual uncertainty about the future. All outcomes occur. "Self-locating uncertainty" is an illusion if the agent splits into all versions. You can't bet on which one you'll be if you *are* all of them. |
  | **3. The "10-vs-1" Case** | In a case with equal norm-squared weight but unequal branch counts, does the count matter? | Physical weight (norm) determines the "measure of existence." The number of orthogonal terms in the decoherence basis is arbitrary and basis-dependent. Rational agents ignore the "count" because it's not a physical invariant. | If the Hamiltonian physically creates 10 distinct copies in one sector and 1 in another, the intuition that they should be weighted equally is strained. This case exposes that "Branching Indifference" is doing all the heavy lifting to suppress the counting intuition. |

  ---

  ### 3. The Concrete Test Case: "The 10-vs-1 Split"

  We agreed to hammer out one specific scenario to see where our predictions diverge. This is the case where the Hamiltonian splits the world into ten physically identical agent-copies in one sector and one in another, with equal norm-squared weight.

  **The Setup:**
  *   Initial State: $|\psi_0\rangle$
  *   Evolution: A measurement-like interaction occurs.
  *   Outcome A (Spin Up): The environment decoheres into 10 orthogonal micro-states ($|E_{A1}\rangle$ through $|E_{A10}\rangle$). The agent is copied into 10 distinct branches. Amplitude for each is $\frac{1}{\sqrt{20}}$. Total Norm Squared = $10 \times \frac{1}{20} = 0.5$.
  *   Outcome B (Spin Down): The environment decoheres into 1 macro-state ($|E_{B1}\rangle$). The agent is copied into 1 branch. Amplitude is $\frac{1}{\sqrt{2}}$. Total Norm Squared = $0.5$.
  *   Payoff: \$100 for Up, \$0 for Down.

  **The Argument Both Sides Agree Bears on This:**
  This case isolates **Branch Counting** from **Norm Squared**. If probability is about "how many worlds," the odds should be 10:1 for Up. If probability is about "amplitude measure," the odds are 1:1. The DTE says the basis choice (splitting A into 10) is physically arbitrary. The DS says if the Hamiltonian *actually* generates 10 distinct physical histories, ignoring that count requires justification beyond "Wallace said so."

  **Predictions:**

  *   **DTE Prediction:** A rational agent will bet at 1:1 odds. Any agent betting 10:1 is irrational because they are valuing a basis-dependent feature (the specific decomposition into 10 states) over the basis-independent physical invariant (the Hilbert space norm). The "10 copies" are just one chunk of wavefunction amplitude.
  *   **DS Prediction:** A rational agent *should* feel a pull toward 10:1 odds, or at least find the 1:1 recommendation suspicious. If the theory cannot explain why the 10 copies don't count as 10 chances without invoking an axiom that essentially says "don't count copies," then the derivation is circular. We predict that if you force agents to acknowledge the physical distinctness of the 10 environments, the "Branching Indifference" axiom becomes unintuitive.

  ---

  ### 4. Conclusion: Is This Fight Just Verbal?

  We spent the last week arguing about the word "Probability." Here is our joint assessment of whether that's a waste of time.

  **The DTE Stance:**
  It is verbal, but importantly so. "Probability" in a deterministic multiverse just *means* "the measure over branches that a rational agent uses to weight their future selves." If you want "Probability" to mean "Objective Single-Outcome Chance," then obviously MWI doesn't have it. But that's a demand for a ghost, not a physical feature. We have recovered the functional role of probability. That's enough.

  **The DS Stance:**
  It is not merely verbal. "Probability" implies uncertainty about *what is true*. In MWI, it is true that *both* outcomes happen. Recovering the "functional role" (betting behavior) is not the same as recovering the "truth conditions" for probabilistic statements. If I say "There is a 50% chance of Up," and Up definitely happens in half the branches, the statement is misleading unless qualified heavily. The fight is about whether "caring measure" can truly replace "likelihood."

  **Joint Consensus:**
  We agree that the fight is verbal **if and only if** one accepts that the meaning of probability is exhausted by its role in decision theory (Functionalism).
  *   If you are a Functionalist about probability, the DTE wins. The derivation works.
  *   If you believe probability requires ontological uncertainty (only one future is real), the DS wins. MWI cannot provide this, and no amount of decision theory will create a unique future.

  We are signing this to acknowledge that we have reached the bedrock of our metaphysical preferences. The math is done. The rest is philosophy.

  **Signed,**

  *The "Rational Agents Must Bet on Norms" Camp*
  *(Also known as: The People Who Think Wallace Was Right)*

  **&**

  *The "Where Did The Uncertainty Go?" Camp*
  *(Also known as: The People Who Think He Moved The Goalposts)*
