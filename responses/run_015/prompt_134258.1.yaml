          5.  Conclusion: Is the fight just verbal about 'probability'?
      *   **Tone:** Casual, "in the weeds," no citations/reading lists, reasoned from formalism/argument structure.
      *   **Goal:** A document both sides could *actually sign* after a year of arguing (implies charity, precision, and acknowledging where they still diverge).

  2.  **Deconstruct the Physics/Philosophy:**
