  ### (1) Role, Constraints, and Scope

  This protocol operationalizes Coherent Extrapolated Volition (CEV) for intergenerational university governance. It applies exclusively to binding commitments exceeding ten-year horizons, such as endowment policies, infrastructure contracts, and core curricula, where future stakeholders cannot vote. The normative standard is not aggregated current preference, but the reflective equilibrium of stakeholders under conditions of full information and logical coherence. This tool functions as a veto filter, not a voting mechanism; it prevents binding future generations to incoherent or ill-informed whims while protecting the institution's enduring capacity. It does not resolve fundamental value conflicts but identifies when preferences are too unstable to warrant constraint. Committees must use this to justify deviations from current majority opinion, ensuring decisions align with the institution's enduring mission rather than transient sentiment. **[JUDGMENT]** Defining the "enduring mission" itself remains a prerequisite external to this procedure, as the tool refines preferences within a mission, it does not select the mission.

  ### (2) The Procedure: Steps, Tests, and Stopping Rules

  **Step 1: Stakeholder Mapping.** Identify all affected parties, explicitly including future students as silent stakeholders. **[JUDGMENT]** Determining the discount rate for future interests versus current hardships requires ethical calibration; there is no formula for intergenerational equity.
  **Step 2: Raw Elicitation.** Collect initial preferences via surveys and town halls. Treat these as hypothesis data, not mandates. Record intensity of preference, not just direction, to identify strong convictions versus weak preferences.
  **Step 3: Coherence Testing.** Subject preferences to three logical tests: (a) Transitivity (if A>B and B>C, then A>C must hold); (b) Framing Independence (preferences must hold regardless of loss/gain presentation); (c) Temporal Consistency (preferences should not flip based solely on immediate gratification vs. delayed reward). Failures here trigger mandatory revision or exclusion of that preference set. **[JUDGMENT]** Determining whether an inconsistency is a "mistake" or a "change of mind" requires interpretation.
  **Step 4: Information Adjustment.** Present neutral expert testimony on costs, benefits, and risks. Re-solicit preferences. **[JUDGMENT]** Distinguishing "information" from "persuasion" is critical; experts provide data on consequences, not values on desirability. Panels must be ideologically balanced to prevent value-loading.
  **Step 5: Reflective Deliberation.** Convene a representative body to discuss conflicts between refined preferences and institutional mission. This is not voting but seeking equilibrium between specific desires and general principles. The body must include minority representatives to prevent majority tyranny during equilibrium seeking. Minutes must track reasoning shifts.
  **Step 6: Temporal Extrapolation.** Project whether refined preferences would hold over the commitment's lifespan. Ask: "Would we bind our successors to this?"
  **Step 7: Stopping Rules.** Abort recommendation if: (a) >40% of stakeholders retain opposition after Steps 3-5; (b) Coherence tests reveal fundamental incompatibility (e.g., wanting both lower cost and higher quality without trade-off acceptance); (c) Deliberation yields no convergent principle. In these cases, return "Do Not Decide" to avoid imposing constructed preferences.

  ### (3) Worked Applications

  **Case 1: Energy Contract.** Current students oppose the 2% tuition hike. However, coherence testing reveals opposition relies heavily on loss-aversion framing rather than total cost analysis. Information adjustment clarifies long-term price stability and climate risk mitigation benefits. Extrapolation suggests future students would prioritize sustainability and operational stability over marginal cost savings, provided access is maintained. **Recommendation:** Approve, contingent on financial aid buffers to protect access. This aligns coherent long-term values with short-term pain, satisfying the temporal consistency test. The committee accepts the hike because the preference against it dissolves under full information regarding climate risk.

  **Case 2: Language Requirement.** Seventy percent current opposition exists. Coherence testing shows opposition stems largely from vocational anxiety (a framing effect regarding job markets). However, information adjustment confirms cognitive and global competence benefits align with the university's liberal arts mission. Reflective deliberation indicates current students undervalue the degree's long-term signaling power and educational depth. **Recommendation:** Maintain Requirement. **[RESISTED]** The committee will strongly resist this because it overrides a clear supermajority of current payers. However, the procedure forces this because the opposition fails the "full information" and "mission coherence" tests. Future students inherit the degree's value, which depends on this rigor. Ignoring this for current popularity devalues the asset future stakeholders receive. The procedure prioritizes the coherent identity of the degree over transient market anxiety. This creates political friction, as current students feel their agency is nullified by a hypothetical future self, viewing the university as a service provider rather than a transgenerational entity.

  **Case 3: Endowment Divestment.** Activists demand divestment; financial officers warn of reduced aid. Both positions are internally coherent (ethics vs. access). Information adjustment confirms the return gap exists. Deliberation fails to find a bridging principle that satisfies both moral purity and economic access. **Recommendation:** Do Not Decide. The procedure triggers the stopping rule due to incompatible coherent orderings. Binding future students to either value violates the neutrality required when trade-offs are fundamental and values are contested. The committee cannot extrapolate a single volition from two coherent but opposing value systems.

  ### (4) Judgment Points and Hard Limits

  This procedure cannot discover values; it only refines them. If stakeholders fundamentally construct values through the decision process itself, extrapolation is circular. **[JUDGMENT]** Deciding whether a value is "constructed" in the moment or "discovered" through reflection is unavoidable and risky. Furthermore, coherence permits incompatible orderings; two groups can be internally consistent yet mutually exclusive (e.g., Case 3). The tool cannot solve moral dilemmas, only clarify them. It risks paternalism if the committee conflates "better informed" with "agreeing with us." Finally, it assumes a stable institutional identity; if the mission itself is contested, the reflective equilibrium has no anchor. The procedure manages rationality, not legitimacy. It ensures decisions are not stupid, but it cannot ensure they are right when values collide. It also cannot account for paradigm shifts where future students reject the very framework of the institution's mission. Additionally, the procedure may exhibit status quo bias if the "mission" is defined too rigidly by past committees, preventing necessary evolution.
