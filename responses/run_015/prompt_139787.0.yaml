answer: |-
  Here is the spec you asked for. I have organized your intuitions into a formal desiderata list, distinguished between logical necessities and moral preferences, stress-tested your compression hypothesis, and applied the whole framework to your committee's specific case.

  ### I. The Desiderata List

  To move money, a moral view must be **action-guiding**, **defensible**, and **consistent**. I have sorted your points into **Non-Negotiable** (the view fails as a policy tool without these) and **Camp-Preference** (the view works without these, but yields different moral outcomes).

  **1. Non-Arbitrariness of Threshold (Non-Negotiable)**
  *   **The Spec:** The location of $T$ cannot be derived solely from the intuition that "trigeminal neuralgia should win." It requires an independent anchor.
  *   **The Case:** If $T$ is set merely to validate pre-existing intuitions about which diseases get funded, the view is circular and vulnerable to accusations of bias.
  *   **Requirement:** $T$ must be anchored to a functional or phenomenological break-point (e.g., loss of agency, inability to form future-directed preferences, neurological overload) that is identifiable independent of the funding outcome.

  **2. Continuity / Sorites Resistance (Non-Negotiable)**
  *   **The Spec:** The view must handle the transition across $T$ without violating transitivity or admitting arbitrary sharp lines in continuous phenomena.
  *   **The Case:** Pain intensity is vague. If $T$ is a sharp cliff, a 0.01% increase in intensity flips the moral status from "trade-off allowed" to "lexical priority." This creates a "Cliff Problem" where budget allocations swing wildly based on measurement noise.
  *   **Requirement:** Either deny vagueness (precisification), accept intransitivity (rarely viable for budgeting), or soften lexicality (prioritarianism).

  **3. Temporal Unit of Account (Non-Negotiable)**
  *   **The Spec:** The threshold must apply to a defined unit: a moment, an episode, a day, or a lifetime integral.
  *   **The Case:** As your 40-year vs. 90-second case shows, a momentary spike above $T$ could outweigh a lifetime just below $T$. If the unit is "peak intensity," you fund the 90-second case. If the unit is "lifetime suffering integral," you might fund the 40-year case.
  *   **Requirement:** The view must specify the temporal grain of $T$. Policy usually requires an integral (intensity $\times$ duration) to avoid funding fleeting crises over chronic misery.

  **4. Epistemic Tractability (Non-Negotiable)**
  *   **The Spec:** The metric must be measurable enough to allocate specific dollar amounts.
  *   **The Case:** You mention fish/insects. If the view assigns lexical weight to uncertain suffering, you face a Pascal's Mugging scenario where tiny probabilities of extreme animal suffering consume the entire budget.
  *   **Requirement:** The view must include an epistemic discount rate or a "reasonable evidence" standard. Pure moral weight without epistemic weighting paralyzes decision-making.

  **5. Phenomenological Authority (Camp-Preference)**
  *   **The Spec:** Which pain counts? Lived (experience), Remembered (narrative), or Anticipated (dread)?
  *   **The Case:** The peak-end rule suggests remembered pain ignores duration. If you fund based on patient reports (remembered), you might underfund chronic conditions with stable pain profiles compared to acute procedures with bad endings.
  *   **Requirement:** You must choose: are we minimizing *experienced* welfare loss (welfarism) or *reported* dissatisfaction (decision-utilitarianism)? Neither is objectively "correct," but mixing them creates inconsistency.

  **6. The Trigger Mechanism (Camp-Preference)**
  *   **The Spec:** Is $T$ triggered by raw intensity, or by modifiers like unpredictability, lack of meaning, or loss of control?
  *   **The Case:** Childbirth and marathon running involve high intensity but are often retrospectively valued. If $T$ is raw intensity, these count as negatives to be minimized. If $T$ is "unwanted suffering," they do not.
  *   **Requirement:** This defines the scope of the budget. Raw intensity expands the mandate; "unwanted" contracts it. This is a political choice, not a logical one.

  ---

  ### II. Stress-Test: The "Compressed Pleasure" Hypothesis

  **Your Idea:** Pleasure has a compressed top end (the best moments aren't that far apart), while pain has a vast bottom end. Therefore, lexicality is a derived fact of distribution shapes, not a normative threshold.

  **The Verdict:** This is an empirical claim that fails to do the normative work required.

  1.  **Aggregation still wins:** Even if pleasure is compressed, standard aggregative utilitarianism allows enough "mildly nice lives" to offset one instance of "extreme pain," provided the number of lives is large enough. The shape of the distribution does not block the math of aggregation.
  2.  **Lexicality is structural, not statistical:** To block the trade-off, you need a rule that says "no amount of X counts against Y." The compression hypothesis only says "X is scarce." It does not say "X is forbidden."
  3.  **Policy Implication:** Relying on this hypothesis leads to the same outcome as standard utilitarianism in large populations. It will not protect the trigeminal neuralgia patient against a population-wide mild comfort program. It does not solve your committee's deadlock.

  **Recommendation:** Drop this as a foundation. It might be true, but it doesn't generate the lexical protection you want.

  ---

  ### III. The Specific Case: 40 Years @ 0.9$T$ vs. 90 Seconds @ 1.1$T$

  **Application of Strict LTNU:**
  *   **Patient A:** 40 years $\times$ 0.9$T$ (Sub-threshold). Total moral weight = Aggregative sum.
  *   **Patient B:** 90 seconds $\times$ 1.1$T$ (Super-threshold). Total moral weight = Lexical Infinity (or absolute priority).
  *   **Result:** Fund Patient B.

  **The Cost:**
  This result exposes the **Cliff Problem** (Desideratum #2). To most observers, 40 years of near-torture is morally heavier than 90 seconds of torture. If your view forces you to fund the 90 seconds, you lose the room. If you fund the 40 years, you abandon Lexical Threshold Negative Utilitarianism.

  **Why this matters for the spec:**
  If you cannot accept funding the 90-second case, you do not actually hold a Lexical view. You hold a **Prioritarian** view (suffering counts for more the worse it gets, but never infinitely more).

  ---

  ### IV. The Impossibility Result (The Unstable Triple)

  You guessed that *Lexical Priority + Vague Threshold + Genuine Ordering* is unstable. You are correct. Here is the proof sketch for your paper:

  1.  **Genuine Ordering (Transitivity):** Required for budgeting. If Programme A > B and B > C, then A > C. Without this, you cannot rank options.
  2.  **Vague Threshold:** Pain intensity is a continuum. There is no natural joint between 0.99$T$ and 1.01$T$. There are borderline cases.
  3.  **Lexical Priority:** Requires a binary switch. Either you are above $T$ (priority) or below $T$ (trade-off).

  **The Conflict:**
  If the threshold is vague, there exists a sequence of cases $S_1, S_2, ... S_n$ where $S_1$ is clearly below $T$ and $S_n$ is clearly above $T$, but each step is imperceptibly different.
  *   If Lexical Priority holds, there must be a step $k$ where $S_k$ is sub-threshold and $S_{k+1}$ is super-threshold.
  *   Because the difference is imperceptible, it is arbitrary to assign $S_{k+1}$ infinite weight over $S_k$.
  *   If you deny the arbitrary line, you must treat $S_k$ and $S_{k+1}$ as morally equivalent.
  *   If they are equivalent, transitivity forces the moral status of $S_1$ to equal $S_n$.
  *   Therefore, Lexical Priority collapses.

  **Which requirement does the most work?**
  **Continuity (Non-Arbitrariness).**
  This is the hammer that breaks the Lexical view. In a policy context, you cannot defend a sharp line in a continuous biological metric. Admitting this forces you to abandon strict lexicality.

  **Which requirement can be dropped?**
  **Strict Lexical Priority.**
  You can keep Transitivity and Continuity if you switch to **Prioritarianism**. This view says: *The moral value of relieving suffering increases non-linearly as intensity increases.* Relieving 1.1$T$ is worth *much* more than 0.9$T$, but not *infinitely* more. This allows you to fund the 40-year patient if the duration difference is large enough, without treating the 90-second patient as negligible.

  ---

  ### V. Summary for Your Paper

  **1. The Bogus Desideratum:**
  *   **Compressed Pleasure:** Drop it. It's an empirical claim that doesn't solve the normative trade-off problem.
  *   **Phenomenological Authority:** This is a camp preference. Pick one (likely "lived experience" for health budgets) and stick to it, but acknowledge it's a choice.

  **2. The Non-Negotiables:**
  *   **Transitivity:** You cannot budget without it.
  *   **Epistemic Tractability:** You cannot spend money on uncertainties without a discount rule.
  *   **Non-Arbitrariness:** You cannot defend a sharp threshold in continuous pain data.

  **3. The Recommendation:**
  Your committee is splitting because **Lexical Threshold Negative Utilitarianism** fails the **Continuity** requirement in a real-world budgeting context. It forces counter-intuitive results (the 90-second case) to maintain logical purity.

  **The Fix:**
  Propose a **Prioritarian Suffering View**.
  *   **Spec:** Suffering is weighted by a convex function of intensity.
  *   **Benefit:** It captures the intuition that extreme pain matters *disproportionately* more than mild pain (satisfying the urge for lexicality) without creating an unbridgeable cliff (satisfying Transitivity and Continuity).
  *   **Outcome on Case:** It allows the committee to weigh the 40-year duration against the 90-second intensity. It permits funding the chronic patient if the duration integral is sufficiently high, without dismissing the acute patient.

  **Final Line:**
  Strict lexicality is a philosophical luxury that breaks under the sorites pressure of clinical measurement. Prioritarianism buys you 90% of the moral protection for the severe cases without the logical instability that stalls the vote.
