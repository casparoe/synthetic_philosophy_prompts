answer: |-
  On the standard tripartite analysis of knowledge, the case you request is metaphysically impossible: if knowledge entails belief, one cannot know without believing. To provide you with a functional counterexample, I must follow your contingency instruction. I identify the blocking premise as **the entailment of belief by knowledge** ($K \rightarrow B$). I relax this premise by adopting an externalist conception of knowledge (where reliable warrant suffices) distinct from an internalist conception of belief (which requires conscious conviction or doxastic commitment). On this relaxed view, I construct the closest possible case: the "Unconfident Expert."

  **(a) The scenario**
  Dr. Aris, a historian, is lecturing on the Treaty of Versailles. She has spent twenty years researching the document, holds the original text in her hand, and has verified the signing date against three independent archives. Her warrant is undefeated and reliable. However, Aris is suffering from acute imposter syndrome induced by fatigue; she sincerely reports feeling that she is "merely guessing" and lacks any internal sense of conviction. Despite this feeling, she trusts her methodology over her mood and states the date to her students.

  **(b) The proposition asserted and the assertion itself**
  Proposition ($p$): "The Treaty of Versailles was signed on June 28, 1919."
  Assertion: Aris utters, "The Treaty of Versailles was signed on June 28, 1919," with her usual professional cadence, despite her internal report of uncertainty.

  **(c) The verdict each of the three norms returns and the reason for it**
  *   **Knowledge Norm:** **Permits.** Aris satisfies the externalist conditions for knowledge: $p$ is true, and she possesses undefeated, reliable warrant (archival verification).
  *   **Truth Norm:** **Permits.** $p$ is historically true.
  *   **Belief Norm:** **Forbids.** Aris lacks the requisite doxastic state; she sincerely disavows conviction and feels she is guessing. She asserts without believing.

  **(d) The single feature of the case that does the work**
  The case relies entirely on the **dissociation of external warrant from internal conviction**. For the case to hold, knowledge must be a function of the speaker's objective relation to the truth (reliabilism), while belief must be a function of the speaker's subjective phenomenological state (internalism). If knowledge required internal conviction, Aris would not know, and the case would fail to isolate the belief norm.

  **(e) What happens when that feature is removed**
  If we restore the premise that knowledge entails belief ($K \rightarrow B$), the case collapses into a standard assertion. If Aris knows, she *must* believe. Her report of "guessing" would then be interpreted as false modesty or a misunderstanding of her own state, meaning the Belief Norm is not actually violated. The counterexample vanishes, and the Belief Norm is safe by definition.

  **(f) How a defender of the belief norm would attack the case, and what the best reply would be**
  *   **Attack:** The defender will argue that assertion is *constitutive* of belief. By asserting $p$ flatly, Aris expresses a dispositional belief regardless of her introspective report. Her behavior (asserting) betrays the belief she claims to lack, violating your constraint against behavioral betrayal.
  *   **Reply:** Assertion is a normative act, not merely a symptom. Aris asserts because she recognizes her *duty* to convey verified information, not because she feels convinced. Her sincere self-report is evidence of her state because she is a competent introspector of her own confidence levels; she distinguishes between "trusting my evidence" (which she does) and "feeling convinced" (which she does not).

  **(g) Your own verdict: is the assertion licensed, and which way does the intuition about the case actually cut?**
  The assertion is licensed. Our intuition is that Aris is doing nothing wrong; she is teaching the truth on the basis of excellent evidence. The discomfort we feel stems from her psychological state, not her normative standing. This suggests the Belief Norm is at best a reliable symptom of the Knowledge Norm. When the two come apart, Knowledge tracks the license to assert, while Belief tracks the speaker's comfort. The case is not a standoff: it shows that if we can pry knowledge and belief apart, knowledge does the normative work.
