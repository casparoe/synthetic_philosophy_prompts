answer: |-
  # Joint Statement on the Ethics of Infinite Populations
  **Date:** October 26, 2023
  **Parties:** The Extensionist Camp (EC) and The Quietist Camp (QC)
  **Context:** Adversarial Collaboration on Infinite Aggregation

  ## 1. Points of Agreement
  We, the undersigned, acknowledge the following claims as established common ground. Disagreement on subsequent normative conclusions does not stem from disputes regarding these mathematical or logical premises.

  1.  **Mathematical Framework:** We operate within standard ZFC set theory. We agree that infinite populations are modeled as countably infinite sequences of welfare levels ($\mathbb{N} \to \mathbb{R}$).
  2.  **Impossibility Theorems:** We acknowledge that no binary relation on infinite welfare streams can simultaneously satisfy Strong Pareto, Anonymity (finite permutations), and Continuity (or similar topological regularity conditions). Any complete ordering requires the relaxation of at least one classical desideratum.
  3.  **The Finite Baseline:** We agree that for any finite population $N$, classical total utilitarianism provides a determinate, transitive, and complete betterness ordering that satisfies Pareto and Anonymity.
  4.  **Parameter Sensitivity:** We agree that all known methods for generating a complete infinite ordering (e.g., hyperreal utilities, fixed ultrafilters, positive discount rates) rely on mathematical parameters that lack explicit justification within the base axioms of welfare ethics.
  5.  **Non-Conglomerability:** We agree that extensions allowing infinite comparison often exhibit non-conglomerability (where a preference holds unconditionally but fails conditional on every member of a partition), creating potential tensions with standard decision theory.

  ## 2. Residual Disagreements
  The following disputes remain substantive. We have identified one component that appears merely verbal.

  *   **The Normative Status of Arbitrary Parameters:**
      *   *EC:* The selection of a parameter (e.g., a free ultrafilter) is a necessary *precisification* of vague ethical intuitions regarding infinity. It is no more arbitrary than selecting a specific risk-aversion coefficient in finite decision theory.
      *   *QC:* The selection of a parameter constitutes *ethical noise*. Because the parameter dictates the verdict without ethical input, the resulting ranking is epistemically untrustworthy.
  *   **The Meaning of "Undefined":**
      *   *EC:* To say a comparison is "undefined" is to claim there is no fact of the matter, which paralyzes intergenerational planning.
      *   *QC:* To say a comparison is "undefined" is to suspend judgment. It is a truth-apt claim that the betterness relation is partial, not that the worlds are value-identical.
  *   **Verbal Dispute Dissolved:** We agree that the disagreement over whether infinite sums "exist" is merely verbal. Both sides agree the series diverge in standard analysis; the dispute is solely whether a non-standard extension *ought* to be used for ethical ranking.

  ## 3. Cruxes
  Settlement of the following sub-questions would compel at least one camp to revise its core position.

  1.  **The Uniqueness Crux (For QC):** If it were demonstrated that a specific extension (e.g., a specific ultrafilter construction) could be derived uniquely from a set of ethical axioms as weak as those accepted for the finite case, the QC would accept the Extensionist project.
  2.  **The Paralysis Crux (For EC):** If it were demonstrated that the Quietist's partial ordering leads to systematic dynamic inconsistency or Dutch Bookability in sequential intergenerational choices (where agents must act before the infinite limit is realized), the EC would acknowledge the decision-theoretic cost of extensions may outweigh their benefits.

  ## 4. Anchor Cases and Finite Analogues
  We record our verdicts on two decisive cases and their finite truncations ($N=10^6$).

  ### Case A: The Pareto Violation ($W$ vs. $W^-$)
  *   **Description:** World $W$ assigns welfare 1 to every person $i \in \mathbb{N}$. World $W^-$ is identical, except person #1 receives 0.
  *   **Finite Analogue ($N=10^6$):** $W_N$ (sum $10^6$) vs. $W^-_N$ (sum $10^6 - 1$).
  *   **Verdicts:**
      *   **EC:** $W \succ W^-$. (Required by Strong Pareto).
      *   **QC:** $W \succ W^-$. (QC accepts Pareto even in infinite contexts; the disagreement is about *completeness*, not dominance).
      *   **Finite Prediction:** Both camps agree $W_N \succ W^-_N$.
  *   **Revision Condition (Finite/Infinite Relationship):**
      *   **EC:** We would revise if preserving the infinite ranking $W \succ W^-$ mathematically *forced* us to reject $W_N \succ W^-_N$ in the limit (e.g., via a topology where the limit of better finite worlds is a worse infinite world).
      *   **QC:** We would revise if treating $W \succ W^-$ as defined compelled us to accept a complete ordering that violates Anonymity in cases where the finite analogue preserves it.

  ### Case B: The Divergent Growth ($G$ vs. $C$)
  *   **Description:** World $G$ assigns welfare $2^n$ to person $n$. World $C$ assigns welfare $10^{100}$ to every person $n$.
  *   **Finite Analogue ($N=10^6$):**
      *   Sum($G_N$) $\approx 2^{10^6}$.
      *   Sum($C_N$) $= 10^6 \times 10^{100} = 10^{106}$.
      *   Since $2^{10} \approx 10^3$, $2^{10^6} \approx 10^{300,000}$. Thus $G_N$ is vastly larger than $C_N$.
  *   **Verdicts:**
      *   **EC:** $G \succ C$. (Based on the Overtaking Criterion or Hyperreal extension: partial sums of $G$ eventually and permanently exceed $C$).
      *   **QC:** $G \parallel C$ (Incomparable). (Both sums diverge to $\infty$; no robust, parameter-free method exists to rank rates of divergence).
      *   **Finite Prediction:** Both camps agree $G_N \succ C_N$.
  *   **Revision Condition (Finite/Infinite Relationship):**
      *   **EC:** We claim the infinite verdict should reflect the robust finite trend. We would revise our position if it were proven that *any* extension preserving $G \succ C$ necessarily violates Strong Pareto in Case A ($W$ vs. $W^-$). We prioritize Pareto over Growth; if forced to choose, we drop the Growth ranking.
      *   **QC:** We claim the infinite verdict can diverge from the finite trend due to the qualitative shift at $\aleph_0$. We would revise our position if the "incomparability" verdict ($G \parallel C$) implied that a rational agent, choosing sequentially person-by-person, would be forced to construct $C$ despite knowing that at every step $N$, $G_N$ is better. If incomparability mandates irrational sequential choice, we accept an extension.

  ## 5. Commitment to Future Inquiry
  We acknowledge that the dispute rests not on the mathematics, which is settled, but on the normative weight of continuity between finite and infinite reasoning. We commit to testing the "Paralysis Crux" using formal decision-theoretic models of sequential intergenerational choice within the next academic year.

  _________________________
  **Lead, Extensionist Camp**

  _________________________
  **Lead, Quietist Camp**
