answer: |-
  # Simulation Design: "The Three Valleys"

  **Objective:** To demonstrate that identical historical data can be generated by fundamentally different causal mechanisms, and that interventions succeed or fail based on the *hidden mechanism*, not the *plausibility of the story* fit to the past.

  **Participants:** 14 people (3 tables of 4-5).
  **Time:** 90 Minutes.
  **Materials:**
  *   3 Large Envelopes (labeled **Valley Alpha**, **Valley Beta**, **Valley Gamma**).
  *   3 Sets of "History Cards" (Identical for all tables).
  *   3 "Advisor Briefs" (Slightly different for each table).
  *   1 Facilitator Master Sheet (Contains the Hidden Rules).
  *   Budget Tokens (20 per table, can be poker chips, paper squares, or sweets).
  *   Intervention Cards (3 types: **Build**, **Train**, **Support**).
  *   Flipchart & Markers.
  *   Dice (3 six-sided).

  ---

  ## 1. Roles (Within each Table)
  Assign these quickly at the start. Do not let them self-select to avoid power clustering.
  1.  **Chair (1 person):** Manages time, ensures everyone speaks.
  2.  **Treasurer (1 person):** Holds the Budget Tokens. Must physically hand them over to vote.
  3.  **Country Advisor (1 person):** The *only* person allowed to read the "Advisor Brief." They can describe it but cannot show the card.
  4.  **Scribe (1 person):** Writes the group's "Story" and "Bet" on the flipchart paper.
  5.  **Board Member (Remaining):** General voting rights.

  ---

  ## 2. The Hidden Rules (Facilitator Eyes Only)
  *Do not reveal these until the Debrief.*
  Each Valley operates on a different engine. The History (Rounds 1-3) was generated *by you* to look identical for all three. The Future (Rounds 4-5) depends on their bet vs. the Rule.

  *   **Valley Alpha (The Institution Rule):**
      *   *Mechanism:* Progress requires **Trust**.
      *   *Winning Intervention:* **Train** (Governance/Leadership).
      *   *Losing Interventions:* **Build** (Wasted if corrupt), **Support** (Stolen).
      *   *Scoring:* If they bet on Train: +10 points. Else: 0 points.

  *   **Valley Beta (The Geography Rule):**
      *   *Mechanism:* Progress requires **Access**.
      *   *Winning Intervention:* **Build** (Roads/Irrigation).
      *   *Losing Interventions:* **Train** (Can't reach schools), **Support** (Food rots).
      *   *Scoring:* If they bet on Build: +10 points. Else: 0 points.

  *   **Valley Gamma (The Volatility Rule):**
      *   *Mechanism:* Progress requires **Resilience**.
      *   *Winning Intervention:* **Support** (Cash/Safety Nets).
      *   *Losing Interventions:* **Build** (Washed away), **Train** (People migrate).
      *   *Scoring:* If they bet on Support: +10 points. Else: 0 points.

  ---

  ## 3. The Materials

  **A. The History Card (Identical for all 3 Tables)**
  > **NOVARIA REGIONAL DEVELOPMENT DATA (Years 1-3)**
  > *   **Year 1:** Growth +2%. Stability High.
  > *   **Year 2:** Growth -1%. Stability Medium. (Drought reported).
  > *   **Year 3:** Growth +1%. Stability Low. (Unrest reported).
  > *   **Current Status:** Stagnant. High potential, low output.
  > *   **Note:** All three Valleys (Alpha, Beta, Gamma) show this exact same data profile.

  **B. The Advisor Briefs (Distributed to the 'Country Advisor' role)**
  *These are designed to be ambiguous. They hint at the rule but could be interpreted as symptoms of anything.*
  *   **Alpha Brief:** "Locals complain that when they bring goods to market, officials ask for papers they don't have. They say leaders live far away in the capital."
  *   **Beta Brief:** "Locals complain that when they bring goods to market, the roads are washed out. They say the river changes course every year."
  *   **Gamma Brief:** "Locals complain that when they bring goods to market, the prices change before they can sell. They say the weather makes harvests unpredictable."

  **C. Intervention Cards (3 per table)**
  *   **BUILD:** Infrastructure, Roads, Wells. (Cost: 10 Tokens)
  *   **TRAIN:** Education, Governance, Leadership. (Cost: 10 Tokens)
  *   **SUPPORT:** Cash Transfers, Food Aid, Insurance. (Cost: 10 Tokens)

  ---

  ## 4. The Timeline (90 Minutes)

  ### Phase 1: The Diagnosis (25 Minutes)
  1.  **Setup (5 mins):** Seat people at 3 tables. Hand out envelopes. Tell them: *"You are three separate committees advising on three different regions (Alpha, Beta, Gamma). You cannot talk to the other tables."*
  2.  **Silent Reading (5 mins):** Everyone reads the **History Card**. Only the **Country Advisor** reads the **Advisor Brief**.
  3.  **Discussion (15 mins):** The Chair leads a discussion.
      *   *Task 1:* Write down one sentence explaining *why* the region is struggling (The Story).
      *   *Task 2:* Decide which **Intervention Card** to play for the next 2 years. You have 20 Tokens. You must spend at least 10. You can split (10/10) or go all-in (20 on one).
      *   *Constraint:* The Treasurer must physically place the tokens on the chosen card.

  ### Phase 2: The Intervention (15 Minutes)
  1.  **Collection:** Facilitator collects the Intervention Cards and Tokens from each table.
  2.  **Calculation:** Facilitator steps away (or pretends to calculate). In reality, check the Hidden Rule for that Valley.
      *   If they matched the Rule: Write **"SUCCESS (+10)"** on their paper.
      *   If they mismatched: Write **"STAGNATION (0)"**.
      *   *Note:* Add a die roll element if you want noise (e.g., roll a 6 = unexpected shock), but keep it simple for first run. Let's keep it deterministic to prove the point.
  3.  **Return:** Hand the results back. Do not explain *why* yet.

  ### Phase 3: The Comparison (20 Minutes)
  1.  **Reveal:** Ask each table to stand and read their **Story** and their **Result**.
      *   *Likely Outcome:* Table Alpha might say "It's corruption" and win. Table Beta might say "It's corruption" and lose.
      *   *Or:* All three tell the *same* story (because the History was identical), but get *different* results.
  2.  **The Twist:** Ask: *"Did anyone notice the History Cards were word-for-word identical?"* (Reveal they were).
  3.  **The Second Twist:** Ask: *"Did anyone compare Advisor Briefs?"* (Let them swap briefs).
      *   They will see the Briefs hinted at different problems (Officials vs. Roads vs. Prices).
      *   They will realize the Table that listened to the Advisor *and* matched the Hidden Rule won.
      *   They will realize the Tables that ignored the Advisor and relied on the "Global History" likely failed (unless they guessed right).
  4.  **The Reveal of Rules:** Open the Facilitator Envelopes. Show that Alpha *was* Institutions, Beta *was* Geography, Gamma *was* Volatility.

  ### Phase 4: The Debrief (30 Minutes)
  *Use the Flipchart. Draw three columns: PAST, STORY, LEVER.*

  **1. Why fitting the past is cheap (10 mins)**
  *   **Ask:** "How many different stories could explain the History Card?" (Answer: All of them. Drought, Corruption, and Market Shock all look like 'Growth -1%').
  *   **Point:** We are pattern-matching machines. We can bolt a story onto *any* data. That feels like understanding, but it's just narration.
  *   **Link:** "In our committee, we argue about Colonialism vs. Disease vs. Culture. All three fit the history of Malawi and Ghana. That doesn't mean all three are the *lever*."

  **2. What would have counted as evidence? (10 mins)**
  *   **Ask:** "What information did you actually need to win?"
  *   **Answer:** You needed to know the *mechanism* (The Hidden Rule), not just the *outcome* (The History).
  *   **Point:** The Advisor Brief was "local and partial." It was more valuable than the "global history."
  *   **Link:** "Aggregate data (GDP, Scholarship pass rates) tells you *what* happened. Local mechanism (Why did the teacher not show up? Why did the road wash away?) tells you *what to do*."

  **3. Lever vs. Marker (10 mins)**
  *   **Ask:** "If you had won in Valley Alpha (Institutions), would that intervention work in Valley Beta (Geography)?"
  *   **Answer:** No.
  *   **Point:** A 'Marker' is something that correlates with poverty (e.g., low trust). A 'Lever' is something that changes it (e.g., fixing the incentive for officials). Sometimes fixing the marker does nothing to the lever.
  *   **Closing:** "We cannot shrink from the uncertainty. We just have to stop pretending the story is the solution. We test small. We listen to the Advisors (the locals). We admit we don't know the Hidden Rule yet."

  ---

  ## 5. Risks & Mitigations

  **Risk 1: The Dominant Voice.**
  *   *Symptom:* One committee member (likely the one who "knows about Africa") dictates the Story and the Bet.
  *   *Fix:* Enforce the **Silent Reading** phase. Require the **Scribe** to write down *two* competing stories before voting. Require the **Treasurer** to place the tokens, not the Chair.

  **Risk 2: Reverse-Engineering the Game.**
  *   *Symptom:* Someone asks, "Is this a logic puzzle? What's the formula?"
  *   *Fix:* Be honest. "This is a simulation of uncertainty, not a math problem. There is no formula to find, only a decision to make under fog."

  **Risk 3: Nihilism ("So we can't know anything?").**
  *   *Symptom:* Participants conclude that aid is impossible and they should go home.
  *   *Fix:* In the debrief, emphasize **Experimentation**. "You couldn't know from the History. But if you had spent 5 Tokens on a pilot in Year 3, you would have learned the Rule before betting 20 Tokens in Year 4."
  *   **Key Line:** "The lesson isn't 'do nothing.' The lesson is 'don't bet the whole budget on a story you haven't tested.'"

  ---

  ## 6. Limitations & What You Must Say

  The game is a simplification. If you don't address the gaps, smart people will dismiss it. In the final 5 minutes, say this:

  **1. "The Real World Gives You More Draws"**
  *   *Game:* You saw 3 years of data.
  *   *Reality:* We have decades of data, comparisons between districts, and past project reports.
  *   *Takeaway:* "Use that variation. Don't treat 'Malawi' as one data point. Compare District A to District B. That's how you start to isolate the Rule."

  **2. "Causes Work in Combination"**
  *   *Game:* Rules were separate (Either Geo OR Institutions).
  *   *Reality:* It's usually both. Bad roads *and* corrupt officials.
  *   *Takeaway:* "This makes it harder, not easier. It means single-solution interventions (Just build schools!) often fail. We need bundled approaches, but even then, we must check if the bundle matches the context."

  **3. "The Clean Lever Distinction"**
  *   *Game:* Interventions were binary (Worked/Didn't Work).
  *   *Reality:* Effects are marginal and messy.
  *   *Takeaway:* "We won't get a 'Success' stamp. We'll get a 5% improvement. We need to measure that honestly, not just tell stories about 'lives changed'."

  **Closing Script for You:**
  > "We are here because we care. But caring isn't enough. Our confidence in our own stories is the biggest risk to the money we raise. This game felt frustrating because the real world is frustrating. But that frustration is useful. It stops us from being certain. And when we stop being certain, we start listening to the people in the Valleys, not just the data on the page. That is how we stop arguing and start helping."

  ---

  ## 7. Stationery Shopping List
  *   1 Flipchart pad.
  *   4 Markers (Black, Red, Blue, Green).
  *   15 Large Envelopes (3 for Rules, 12 for handing out materials).
  *   A4 Paper (30 sheets).
  *   Pens (15).
  *   60 small identical items for tokens (paper clips, coins, or cut-up card).
  *   3 Dice.
  *   Sticky tape (to put History Cards on walls if needed).

  ## 8. Facilitator Cheat Sheet (Print this for yourself)

  | Valley | Hidden Rule | Winning Bet | History Card | Advisor Hint |
  | :--- | :--- | :--- | :--- | :--- |
  | **Alpha** | Institutions | **TRAIN** | Identical | "Officials ask for papers" |
  | **Beta** | Geography | **BUILD** | Identical | "Roads are washed out" |
  | **Gamma** | Volatility | **SUPPORT** | Identical | "Prices change/Weather" |

  **If a table splits their bet (10/10):**
  *   If one part matches the rule, give them +5 points.
  *   If neither matches, 0 points.
  *   *Teaching point:* Diversification reduces risk but lowers impact if you actually knew the lever.

  **If they ask about the other tables during the game:**
  *   "You are in separate communication zones. Confidentiality is key."

  **If they finish early:**
  *   Ask them to write down: "What is the one piece of data you wish you had before betting?" (Use this in the debrief).
