  1.  **Analyze the Request:**
      *   **Goal:** Design a 90-minute simulation/game for a charity committee (14 people, mixed ages/backgrounds, includes Ghanaian/Malawian volunteers).
      *   **Topic:** Causal inference in development aid (specifically, distinguishing between competing explanations for poverty/underdevelopment and choosing interventions based on *levers* vs. *stories*).
      *   **Key Insight to Convey:** A single history can be explained by multiple conflicting causal stories (underdetermination). Fitting the past $\neq$ finding the lever. Interventions work differently depending on the *actual* underlying mechanism, not just the narrative.
      *   **Constraints:** No projector, church hall, flipchart only. No real-world country names (use invented ones). No prior knowledge needed. No jargon until debrief.
      *   **Specific Mechanics:** Hidden rules (at least 3 types: institutional, geographic/endowment, path dependence/luck). Same visible history, different underlying rules. Budget betting phase. Roles (some with partial info).
