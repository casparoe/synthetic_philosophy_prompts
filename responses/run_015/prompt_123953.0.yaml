          2.  **Rule B (Geography):** Output depends on a hidden "Soil Quality" die roll that is fixed per round but varies by district. Investment helps, but Soil caps the max.
          3.  **Rule C (Path Dependence):** Output depends on the *previous* round's output. Rich get richer (compounding). Investment gives a one-off boost but doesn't change the trajectory much.
      *   *Wait, this is too complex for 90 mins with non-experts.* I need to simplify the mechanics so the *discussion* is the hard part, not the math.
