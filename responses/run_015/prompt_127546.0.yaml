  i'm in a moral philosphy course and we're covering demandingness objections to consequentialism. my tutor mentioned this niche angle that the objection might depend on a 'budget model' of moral costs — treating obligations like debts that accumulate — and that this only feels crushing if you also buy a preference-satisfaction view of wellbeing. could you write a dialogue between two equally sharp students, one defending the demandingness objection and one defending consequentialism, where they actually argue about that specific twist? they should respond to each other properly, no strawmanning.

  please write in british english (casual tone is fine, a typo or two is ok — i definately won't mind).

  structure it like this:

  1. Opening positions (around 250 words) — each sets out their view on whether consequentialism asks too much
  2. The budget-model and wellbeing back-and-forth (around 400 words) — real engagement on whether the objection smuggles in hidden premises about costs and wellbeing
  3. Where they land (around 200 words) — partial agreement or honest stalemate

  no citations or reading lists needed, just the dialogue itself. make sure they accomodate each other's points rather than talking past one another.
