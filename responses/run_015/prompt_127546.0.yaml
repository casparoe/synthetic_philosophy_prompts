answer: |-
  **1. Opening positions**

  **Liam:** Look, the demandingness objection is straightforward. Consequentialism tells me I must act to maximise the good, full stop. But if I take that seriously, I can't buy a coffee, go to the cinema, or visit my mum unless it produces the best outcome. It wipes out my personal life. It asks too much because it treats me like a vessel for utility rather than a person with projects.

  **Sarah:** I get the intuition, but I think you're smuggling in a specific way of counting costs. You're assuming that every time morality stops you doing what you *want*, you've suffered a loss. But that only feels crushing if you view moral obligations like debts in a budget model—like they accumulate against your personal allowance until you're bankrupt. Consequentialism doesn't say you're in debt; it says your personal projects only matter insofar as they contribute to the good.

  **Liam:** That's a nice way of putting it, but it doesn't change the reality. If I have to give up my holiday to fund a malaria net, I've lost something. The theory demands sacrifice. If a theory requires you to sacrifice everything that makes life yours, it's too demanding, regardless of how you frame the ledger.

  **2. The budget-model and wellbeing back-and-forth**

  **Sarah:** But why is it a sacrifice? That's the crux. You're assuming a preference-satisfaction view of wellbeing. Basically, if you prefer holidays to charity, satisfying that preference is your 'gain'. So, denying it is a 'cost'. But if wellbeing is objective—say, about virtue or meaning—then giving away the money might not lower your wellbeing at all. It might even raise it. The budget model only works if your personal preferences are the currency.

  **Liam:** Right, but even if wellbeing is objective, the *effort* is real. It takes psychological energy to override my instincts. The budget model isn't just about money; it's about psychic cost. If I spend all day resisting the urge to relax, I'm exhausted. Consequentialism ignores that friction. It assumes I can just switch off my personal desires without wear and tear. That's where the objection bites—it's not about the money, it's about the burden of constant calculation.

  **Sarah:** I'd say you're still treating reasons like competing debts. You think there's a 'moral pot' and a 'personal pot', and consequentialism drains the personal one. But maybe there's only one pot. If the theory is true, then what you 'ought' to do is exactly what aligns with the good. The friction you feel is just a clash between your psychology and reality, not a flaw in the theory. Though, I'll admit, if humans are wired for preference satisfaction, the theory might be practically impossible for us.

  **Liam:** That's conceding the point, isn't it? If humans are wired to see costs as budget deficits, then a theory that ignores that is too demanding *for humans*. You can't just say 'well, change your psychology'. The objection is that the theory doesn't fit the agents it's supposed to guide. If the budget model is how we experience value, then ignoring it makes the theory alienating.

  **Sarah:** Alienating, maybe. False? Not necessarily. But I see your angle. You're saying the demandingness objection isn't about logic, it's about phenomenology. It feels crushing because we experience morality as a tax on our preferences. If we didn't experience it that way, the objection vanishes. So the objection relies on us accepting preference satisfaction as the metric for a good life.

  **Liam:** Exactly. And since most of us do live like that, the objection holds water. You can't build a moral system for angels if we're all humans.

  **3. Where they land**

  **Sarah:** Fair enough. I think we agree that the demandingness objection isn't a logical contradiction within consequentialism. It's a clash between the theory's structure and our specific human psychology regarding cost. If we didn't view obligations as accumulating debts against our preferences, the 'crushing' feeling would disappear.

  **Liam:** Yeah, I'll accept that. It's not that consequentialism is logically incoherent, it's that it requires a radical reshaping of how we value our own lives. But I still reckon that reshaping is too much to ask. Just because the objection relies on a budget model doesn't mean the model is wrong—it's the one we actually live in.

  **Sarah:** True. So we're at a stalemate on whether 'too demanding' is a fatal flaw or just a difficult feature. You think fitting human psychology is a requirement for a moral theory; I think correcting that psychology might be the point of it.

  **Liam:** Guess that's enough for the tutorial. I still think I'm keeping my holiday money though.

  **Sarah:** Typical.
