answer: |-
  This is a sophisticated and ambitious package. Your friend is being too charitable: while (5) is the flashpoint, the tension is not isolated to that claim. It arises from the interaction between your metasemantics (6), your modal principle (4), and your anti-materialist inference (5). Your instinct is correct; the trouble is structural.

  The two-dimensional framework is designed to dissolve tensions, but it only does so if you are precise about *which* concepts behave like 'water' and which behave like 'consciousness'. Your current list risks treating them uniformly where they must diverge.

  Here is the audit of your commitments, ranked by severity.

  ### 1. The Critical Tension: The Trilemma of (4), (5), and (6)
  **Severity: Fatal if unaddressed.**

  *   **The Conflict:**
      *   **(4)** asserts the strict Kripkean moral: an epistemic gap does not license a modal gap. (This is why 'Water $\neq$ H2O' is conceivable primarily but not metaphysically possible).
      *   **(5)** asserts the Chalmersian inference: an epistemic gap (zombies are primarily possible) *does* license a modal gap (zombies are metaphysically possible).
      *   **(6)** asserts a uniform deferential metasemantics for kind terms: reference is fixed by role + expert/nature determination.
  *   **Why it breaks:**
      Two-dimensional semantics resolves the conflict between (4) and (5) by distinguishing concept types.
      *   For **'water'**, the Primary Intension (PI) picks out a role (clear, drinkable liquid), but the Secondary Intension (SI) picks out the essence (H2O). Because PI $\neq$ SI, primary possibility does not imply secondary possibility. This saves (4).
      *   For **'consciousness'**, the Zombie Argument requires that PI = SI. If the concept of consciousness picks out the phenomenon directly (without a hidden essence), then if it is primarily possible, it is metaphysically possible. This enables (5).
      *   **However, (6) threatens this.** If 'consciousness' is treated as a "theoretical kind term" governed by the deferential story in (6) (i.e., "whatever physical/functional state plays the consciousness role"), then 'consciousness' works like 'water'. Its PI would be the role, and its SI would be the physical realizer. If so, zombies are *not* primarily possible (because the role is defined by the physical state), or if they are primarily possible, they are not metaphysically possible.
  *   **The Cost:**
      *   **To save (5) [Anti-Materialism]:** You must reject (6) for phenomenal concepts. You must argue that phenomenal concepts are *not* deferential kind terms in the way 'water' is. They must be direct/reference-fixing without hidden essences.
      *   **To save (6) [Uniform Metasemantics]:** You must abandon (5). If 'consciousness' is a deferential kind term, the 2D framework yields a necessary a posteriori identity between mind and brain, just like water and H2O.
      *   **To save (4) [Strict Kripkeanism]:** You must accept that (5) is an exception to the rule, which requires explaining *why* the rule applies to water but not mind.

  ### 2. The Metaethical Disanalogy: (1) vs. (8)
  **Severity: Moderate.**

  *   **The Conflict:**
      *   **(1)** establishes 'water is H2O' as the paradigm of a successful necessary a posteriori identity. The epistemic gap is harmless; the metaphysical identity holds.
      *   **(8)** claims Moral Twin Earth is the "very same phenomenon" but concludes the naturalist's identity claim is in *worse* shape.
  *   **Why it looks like a tension:**
      If the semantic phenomenon is the "very same" (i.e., PI varies while SI is fixed by nature), then why does the Water case result in a secured identity (1) while the Moral case results in a failed identity (8)?
  *   **Why it dissolves (mostly):**
      It dissolves *only if* you clarify that the "phenomenon" is the semantic structure (PI independence), but the *metaphysical outcome* differs because nature fixes H2O but does not fix a specific moral property.
  *   **The Risk:**
      If you argue (8) too strongly, you risk implying that the 2D machinery itself generates the anti-naturalist conclusion. It does not. The machinery only shows that 'Good' does not *a priori* entail a natural base. To get the "worse shape" conclusion, you need a substantive metaethical premise that there is no "moral essence" in the world to serve as the SI, unlike H2O for water. If you don't make this explicit, it will look like you are using the semantic gap to prove the metaphysical gap (violating your own (4)).

  ### 3. The Epistemic Idealization: (7) vs. (6)
  **Severity: Low/Manageable.**

  *   **The Conflict:**
      *   **(7)** defines the epistemic dimension via "ideal reflection."
      *   **(6)** relies on deference to experts/nature that speakers "need know nothing about."
  *   **Analysis:**
      This is a standard tension in 2D semantics (Chalmers vs. Putnam). Does ideal reflection reveal that water is H2O? Putnam says no (it's empirical). Chalmers says no (the 1-intension is satisfied by the superficial description).
  *   **Resolution:**
      As long as you define "ideal reflection" as reflection on *meaning/concepts* rather than reflection on *empirical facts*, (7) and (6) are compatible. Ideal reflection reveals the PI (the role), not the SI (the essence). This is consistent, but you must be careful not to let "ideal reflection" sneak in empirical knowledge about the actual world.

  ---

  ### Ranking the Tensions

  1.  **The Trilemma (4)-(5)-(6):** This is the only threat that can derail your defense. If you cannot explain why 'consciousness' escapes the deferential story of 'water', your export of the framework to philosophy of mind fails.
  2.  **The Metaethical Analogy (1)-(8):** This is a rhetorical risk. If the audience thinks you are claiming the *inference* is identical, they will charge you with violating (4). You need to distinguish the semantic structure from the metaphysical upshot.
  3.  **The Epistemic Definition (7)-(6):** This is clarificatory. It won't kill the chapter, but imprecision here will invite nitpicking questions during the seminar.

  ---

  ### The Single Revision to Clean Up the Most Trouble

  You should **restrict Commitment (6).**

  Currently, (6) reads: *"On the metasemantic side I want the deferential story for kind terms: what fixes the reference of 'water', and of theoretical kind terms generally..."*

  **The Revision:**
  Explicitly exclude phenomenal concepts from the scope of (6). Amend (6) to state that the deferential story applies to **natural kind terms and theoretical terms that posit hidden essences**, but **not** to phenomenal concepts, which pick out their referents directly via their mode of presentation.

  **Why this is the best move:**
  1.  **Saves (5):** It allows you to argue that for phenomenal concepts, PI = SI. Therefore, primary conceivability (zombies) implies metaphysical possibility. This validates the export to the conceivability argument.
  2.  **Saves (4):** It preserves the strict Kripkean moral for natural kinds (like water). For water, PI $\neq$ SI, so the epistemic gap does *not* imply a modal gap. You aren't contradicting Kripke; you are arguing that mind is not a natural kind in the relevant sense.
  3.  **Clarifies (8):** It helps your metaethical argument. You can argue that 'good' functions more like 'water' (deferential, seeking a natural base) than like 'consciousness'. Since 'good' is deferential (like water) but lacks a fixed natural essence (unlike water), the identity fails. This distinguishes the Metaethics case from the Mind case, preventing the audience from confusing your anti-materialism with your anti-naturalism.

  **The Cost:**
  You lose the theoretical unity of treating all "kind terms" identically. You are positing a dualism of concepts: deferential natural kinds vs. direct phenomenal concepts.
  **Is this cost acceptable?** Yes. This is the standard Chalmersian position. It is better to admit a disanalogy in your metasemantics than to force a uniform semantics that breaks your modal inferences. In your seminar, frame this not as a bug, but as a feature: the 2D framework is powerful precisely because it can diagnose *where* the epistemic gap tracks a modal gap (mind) and where it does not (water/morals).

  **Summary for your Seminar Introduction:**
  When you stand up, pre-empt the objection. State clearly: *"The framework treats 'water' and 'consciousness' differently at the metasemantic level. 'Water' is deferential with a hidden essence; 'consciousness' is direct. This is why the epistemic gap implies a modal gap for the latter but not the former."* This shows you have audited the commitments and resolved the trilemma.
