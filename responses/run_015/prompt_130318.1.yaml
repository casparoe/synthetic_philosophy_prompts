answer: |-
  ### Workshop Plan: Nietzsche for Heritage Practitioners (90 Minutes)

  #### 1. The Dependency Order: Start with **Monumental**
  You must teach **Monumental History** first.

  **Why:** Heritage students naturally default to *Antiquarian* thinking (preservation is inherently good). If you start with Antiquarian, you cement the idea that the goal of history is *conservation*. Once that is set, Monumental looks like "distorting the record" and Critical looks like "vandalism." You end up with Good History (Preservation) vs. Bad History (Usage/Destruction).

  By starting with **Monumental**, you establish the *teleology*: History exists for the sake of **Action in the Present**.
  *   Once the goal is *Action*, **Antiquarianism** becomes "caring for the tools we need to act" (rather than hoarding).
  *   Once the goal is *Action*, **Critical History** becomes "discarding broken tools that hinder us" (rather than destruction).

  This order prevents the collapse into moral binaries. It frames all three as functional modes of *Life*, not moral judgments on archival integrity.

  ---

  #### 2. The Carrying Example: **The Decommissioned Power Plant**
  **Use the Power Plant.** Drop the Social Network.

  **Why the Power Plant Works:**
  Nietzsche's essay is about the *weight* of the past pressing on the present. A decommissioned power plant is a physical, looming presence. It occupies land, costs money to maintain, and dominates the skyline. It forces the students to confront the *cost* of history.
  *   **Monumental:** It stands as a testament to industrial might/worker solidarity.
  *   **Antiquarian:** It is the specific brick-and-mortar history of *this* community.
  *   **Critical:** It is a toxic, obsolete structure blocking new housing.

  **Why the Social Network Breaks:**
  Digital heritage feels weightless to grad students. Deleting a server or archiving a MySpace page lacks the visceral "burden" Nietzsche describes. Digital data can be copied infinitely; it doesn't compete for physical space. Students will treat the Social Network example as a data management problem, not an existential struggle for *Life*. They won't feel the necessity of the "Critical" mode because deleting data doesn't feel like "killing" the past. The Power Plant makes the violence of Critical history tangible.

  ---

  #### 3. The Sequence & Misconception Map
  **Total Time: 75 Minutes (leaving 15 for CFU)**

  **0:00–0:15 | Frame: History as a Burden vs. Tool**
  *   **Activity:** Show a photo of the Power Plant looming over a neighborhood. Ask: "Does this building help you live, or does it stop you?"
  *   **Concept:** Introduce "History for Life." History is not about Truth; it is about Vitality. If history stops you from acting, it is a disease.
  *   **Setup:** Tell them there are three ways to metabolize the past.

  **0:15–0:30 | Mode 1: Monumental (The Engine)**
  *   **Definition:** Using the past to inspire present action. Looking for models of greatness to emulate.
  *   **Apply to Plant:** "We keep the turbine hall as a museum of labor to inspire current union organizing."
  *   **$\rightarrow$ HEAD OFF MISCONCEPTION (Propaganda):** *Do this immediately.*
      *   *The Trap:* Students will say, "That's just state propaganda or myth-making."
      *   *The Correction:* "Propaganda lies to control you. Monumental history tells a partial truth to *liberate* you to act. The difference is the outcome: Does it make you more active or more obedient? If it makes you a follower, it's propaganda. If it makes you a creator, it's Monumental."

  **0:30–0:45 | Mode 2: Antiquarian (The Anchor)**
  *   **Definition:** Preserving the conditions of your existence. Piety toward origins.
  *   **Apply to Plant:** "We preserve every bolt and logbook because this plant *is* our town's identity. Without it, we are rootless."
  *   **$\rightarrow$ HEAD OFF MISCONCEPTION (Nostalgia):** *Do this immediately.*
      *   *The Trap:* Students will say, "That's just nostalgia or hoarding."
      *   *The Correction:* "Nostalgia is a feeling; Antiquarianism is a practice of care. Nostalgia looks back to escape the present. Antiquarianism looks back to stabilize the present. If the preservation makes you afraid to change anything, it has rotted into Nostalgia. If it gives you the confidence to grow because you know where you stand, it is Antiquarian."

  **0:45–1:00 | Mode 3: Critical (The Knife)**
  *   **Definition:** Judging and condemning the past to break its power over you.
  *   **Apply to Plant:** "We demolish the plant. It represents an exploitative economic model that is suffocating our future. We must destroy it to breathe."
  *   **$\rightarrow$ HEAD OFF MISCONCEPTION (Political Critique):** *Do this BEFORE defining the mode.*
      *   *The Trap:* Students will hear "Critical" and think "Marxist critique" or "calling out injustice."
      *   *The Correction:* "This is not about being politically correct or socially critical. You can be politically critical and still be trapped by history. Critical History is existential surgery. It is asking: 'Does this past event/structure poison my ability to live *now*?' If yes, you condemn it, regardless of its political alignment. It is not about justice; it is about survival."

  **1:00–1:15 | Synthesis: The Danger of Excess**
  *   Briefly explain that each mode becomes toxic if it dominates.
      *   Too much Monumental = Delusion (ignoring reality).
      *   Too much Antiquarian = Mummification (nothing new can grow).
      *   Too much Critical = Rootlessness (no identity left).
  *   **Goal:** The healthy heritage practitioner shifts between these modes depending on what *Life* requires.

  ---

  #### 4. Check-for-Understanding (CFU)
  **Time:** 1:15–1:30
  **Scenario:** A City Council is debating whether to demolish a 19th-century textile factory to build affordable housing. The factory is structurally sound but sits on the only available land.

  **The Task:**
  "Do not vote on the decision. Instead, write three short statements.
  1.  What does the **Monumental** historian say we should do, and *why*?
  2.  What does the **Antiquarian** historian say we should do, and *why*?
  3.  What does the **Critical** historian say we should do, and *why*?
  **Crucial:** For each, identify what 'Life' need they are serving."

  **What a WRONG Answer Looks Like (The Collapse):**
  *   **Moralizing:** "Antiquarian is good because they want to save history. Critical is bad because they want to destroy it."
  *   **Political Reduction:** "Critical history says demolish it because capitalism was bad." (Confuses political critique with existential liberation).
  *   **Static Definitions:** "Monumental means making a statue. Antiquarian means making a museum." (Misses the functional purpose).
  *   **Failure of Life:** They fail to explain *why* the action serves the present. (e.g., "Save it because it is old" vs. "Save it because it grounds our identity").

  **What a CORRECT Answer Looks Like (The Tension):**
  *   **Monumental:** "Preserve the facade as a monument to industry to inspire future innovation." (Serves *Action/Inspiration*).
  *   **Antiquarian:** "Preserve the whole building intact because it is the physical record of our ancestors' daily lives." (Serves *Identity/Roots*).
  *   **Critical:** "Demolish it completely because the memory of labor exploitation prevents us from imagining a new economic future for this neighborhood." (Serves *Liberation/Survival*).
  *   **The Kicker:** The student acknowledges that *all three* are valid claims on "Life," and the Council's job is to weigh which need is most urgent *now*, not which history is "true."

  ---

  #### 5. Practical Facilitation Tips
  *   **Watch the "Critical" Reaction:** Heritage students often recoil at Critical history. It feels like heresy. Validate that discomfort. Tell them: "Nietzsche knows this feels violent. That's the point. Sometimes life requires violence against the past to continue."
  *   **Keep the Power Plant Visible:** Keep the image of the plant on the screen during all three sections. Don't change the slide. Force them to see the same object through three different lenses.
  *   **No "Right" Policy:** If a student asks, "So should we keep the plant?" refuse to answer. Say, "That depends on whether your city needs inspiration, roots, or liberation right now. Nietzsche gives you the diagnostic tools, not the policy."
