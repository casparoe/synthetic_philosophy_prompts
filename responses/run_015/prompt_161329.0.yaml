answer: |-
  # The Higher-Order Evidence Decision Tree

  **Entry Commitment:** Evidence about the reliability of your reasoning is relevant to what you should believe.

  **Dropped Case:** *5. The model's disagreement.*
  **Reason:** It is structurally identical to *1. Peer disagreement* but introduces confounding variables (AI architecture, training corpus) that distract from the core epistemic principle of how to weigh a reliable disagreeing source.

  ## The Branch Nodes
  *Each node is a concrete question answerable in under a minute. Follow the path indicated by your answer.*

  **Node 1 (Iterated Defeat):** You learn you are sleep-deprived, and that this very assessment is made while sleep-deprived. Does this correction apply to everything including itself, or does it apply once and stop?
  *   **A:** It undermines everything (including itself). → Go to **Leaf 1**.
  *   **B:** It applies once/stops. → Go to **Node 2**.

  **Node 2 (Uniqueness):** Two chefs taste the same soup from the same spoon. One says "salty," one says "bland." Can both be doing their job correctly?
  *   **A:** Yes, both can be rational. → Go to **Leaf 2**.
  *   **B:** No, only one attitude fits the evidence. → Go to **Node 3**.

  **Node 3 (Peer Disagreement):** You and an equal colleague see the same data. You see an effect; they do not. Do you move to the midpoint, suspend judgment, hold unchanged, or take any interval to be permitted?
  *   **A:** Suspend judgment entirely. → Go to **Leaf 3**.
  *   **B:** Move toward the midpoint. → Go to **Leaf 4**.
  *   **C:** Any confidence in the interval is permitted. → Go to **Leaf 10**.
  *   **D:** Hold confidence unchanged. → Go to **Node 4**.

  **Node 4 (Tainted Source):** You believe crime is rising based on reports; you learn the reports were selected by an advocacy campaign. Have you learned something about crime, or only lost your basis for the view?
  *   **A:** Only lost my basis. → Go to **Node 5**.
  *   **B:** Learned something (evidence is now weaker). → Go to **Node 6**.

  **Node 5 (Forgotten Evidence):** You remember a credence of 70% and that you judged the study careful, but not the content. You learn you often misremember studies as careful. Do you treat the retained credence as self-standing or revert toward your earlier prior?
  *   **A:** Treat credence as self-standing. → Go to **Node 7**.
  *   **B:** Revert toward prior. → Go to **Leaf 5**.

  **Node 6 (Calibration):** On hard questions, when you feel 85% confident you are right 60% of the time. You feel 85% confident now. Do you reduce to 60, or keep 85 on grounds you would defer to a better-calibrated self?
  *   **A:** Reduce to 60. → Go to **Leaf 5**.
  *   **B:** Keep 85 (defer to better self). → Go to **Node 7**.

  **Node 7 (Akratic Combination):** Can a subject sincerely believe *p* while sincerely believing their evidence does not support *p*, fully aware of both?
  *   **A:** Yes, but it is always a defect. → Go to **Leaf 6**.
  *   **B:** Yes, and it is sometimes what rationality requires. → Go to **Leaf 7**.
  *   **C:** No, that state is psychologically impossible. → Go to **Node 8**.

  **Node 8 (Action):** When a first-order attitude and a conflicting second-order attitude coexist, should the attitude guiding action be the first-order one, the second-order one, or a merged one?
  *   **A:** Split (different attitudes guide different roles). → Go to **Leaf 8**.
  *   **B:** Merged/Single (must resolve to one). → Go to **Leaf 9**.

  ---

  ## The Leaves (Positions)

  1.  **Global Suspension (Pyrrhonian):** Self-undermining evidence silences all judgment.
      *   *Awkward Commitment:* You cannot rationally believe you are reading this sentence.
  2.  **Permissivism:** Rationality permits multiple attitudes toward the same evidence.
      *   *Awkward Commitment:* Your friend can rationally believe the opposite of you without error.
  3.  **Conciliationism (Suspension):** Peer disagreement forces suspension of judgment.
      *   *Awkward Commitment:* You must suspend judgment whenever a peer disagrees, even if you are clearly right.
  4.  **Conciliationism (Split-the-Difference):** Peer disagreement forces moving confidence to the midpoint.
      *   *Awkward Commitment:* You must dilute your certainty even when the peer is known to be slightly less reliable.
  5.  **Total-Evidence View:** Higher-order evidence is just more first-order evidence to be weighed.
      *   *Awkward Commitment:* There is no distinct category of "higher-order" defeat, only accumulated probability shifts.
  6.  **Akrasia as Defect:** Conflicting first and second-order attitudes are always irrational.
      *   *Awkward Commitment:* A person who knows they are drunk but still feels sure is necessarily irrational, even if they act safely.
  7.  **Akrasia as Required:** Conflicting attitudes are sometimes the rational ideal.
      *   *Awkward Commitment:* Rationality sometimes demands you feel certain while believing you shouldn't.
  8.  **Fragmentation:** Different attitudes guide different roles (belief vs. action).
      *   *Awkward Commitment:* You can rationally believe *p* is false for inquiry but true for betting.
  9.  **Involuntarist Dissolution:** The conflicting state is psychologically impossible; the real requirement is to investigate.
      *   *Awkward Commitment:* Talk of "believing against evidence" is a category error, not a normative failure.
  10. **Moderate Conciliationism (Unnamed):** Any confidence within the interval of disagreement is permitted.
      *   *Awkward Commitment:* You are permitted to ignore your peer entirely as long as you stay within the bounds of their view.

  ---

  ## Unseparated Pairs
  *These pairs of leaves cannot be distinguished by this tree because the questions focus on case outcomes rather than underlying justifications.*

  1.  **Steadfastness vs. Total-Evidence View (Leaf 5):** Both answer "Unchanged" at Node 3 and "Keep 85" at Node 6. The tree cannot separate the view that ignores higher-order evidence (Steadfastness) from the view that absorbs it into the total calculation without shifting (Total-Evidence).
      *   *Extra Question Needed:* "Do you lower your confidence *because* of the higher-order evidence, or do you maintain confidence *despite* it?"
  2.  **Fragmentation vs. Akrasia as Required (Leaf 8 vs. Leaf 7):** Both allow the coexistence of conflicting attitudes. The tree sorts them by whether action splits (Node 8), but a Fragmentation theorist might argue action *should* merge while attitudes remain split, overlapping with Akrasia as Required.
      *   *Extra Question Needed:* "Is the split attitude a single mental state with two roles, or two distinct mental states?"

  ---

  ## Unoccupied Cells
  *Combinations of answers to the eight nodes that no actual view occupies. These are logically possible but philosophically unstable.*

  1.  **{Node 1: Undermines Everything, Node 3: Midpoint}**
      *   *Status:* **Incoherent.** If self-undermining evidence silences all judgment (Node 1A), one cannot maintain the cognitive stability required to calculate a midpoint in peer disagreement (Node 3B).
  2.  **{Node 2: Both Rational, Node 3: Suspend}**
      *   *Status:* **Unattractive.** If permissivism is true (Node 2A), peer disagreement does not indicate error, so there is no pressure to suspend judgment (Node 3A). Holding both implies disagreement is evidence of error despite permissivism.
  3.  **{Node 7: Impossible, Node 8: Split}**
      *   *Status:* **Incoherent.** If the conflicting state is psychologically impossible (Node 7C), there is no state to govern action. One cannot prescribe splitting action (Node 8A) based on a state that cannot exist.
  4.  **{Node 4: Lost Basis, Node 6: Reduce to 60}**
      *   *Status:* **Unexplored/Unstable.** If the source is merely tainted such that the basis is lost (Node 4A), one typically reverts to prior or suspends. Reducing to a specific calibration number (Node 6A) implies one still has a probabilistic basis to adjust, contradicting the "Lost Basis" claim.
