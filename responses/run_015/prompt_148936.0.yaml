  3.  **Evaluate the Mathematical Logic Analogy (Crucial Step):**
      *   *The Analogy:* Legal systems $\approx$ Formal Axiomatic Systems. Norms $\approx$ Propositions. Validity $\approx$ Truth/Provability.
      *   *The Problem:* Legal systems are not closed formal systems. They rely on external facts (social facts, power, acceptance). Kelsen's *Grundnorm* or Hart's *Rule of Recognition* are not axioms within the system in the same way; they are social facts *about* the system.
      *   *Verdict:* It is largely a category mistake, but a sophisticated one. Law is open-textured and relies on institutional practice, not just syntactic derivation. However, the *logic* of validity can still encounter regress problems.
      *   *Nuance:* The analogy fails on "truth" vs. "validity." Legal validity is institutional, not semantic. But the structural issue of self-reference remains relevant (e.g., Can a rule validate itself?).

  4.  **Identify Defeaters (Ranking Fatal to Awkward):**
      *   *Fatal:* The "Rule of Recognition" itself is a social fact, not a legal rule. If the ultimate criterion of validity is contested (e.g., revolution, constitutional crisis), no internal rule fixes it. The system *does* stop if the social foundation cracks.
      *   *Severe:* Infinite Regress in Justification. If every rule needs a higher rule, where does it stop? Hart says it stops at social practice. If the practice is ambiguous regarding the paradox, the system *is* stuck until politics resolves it.
      *   *Moderate:* The "Mirror Clause" isn't trivial. It creates a temporal paradox (validity at $t_1$ depends on validity at $t_2$). If courts take it seriously, they *must* declare the amendment void until the condition is met, which it can't be until it's valid. This isn't silent repair; it's adjudication.
      *   *Awkward:* Drafting errors happen. If the view relies on "well-designed" systems, it's unfalsifiable. Real systems are messy.

