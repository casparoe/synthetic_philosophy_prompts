      *   *Section 4: Concessions vs. Dismissals.* What to keep, what to toss.
      *   *Section 5: Verdict & Predictions.* Is judicial silence evidence? No, it's avoidance. Does the view have teeth? Yes, but it risks being tautological.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Hart says X." The user wants substance, not a lecture on jurisprudence. I need to engage with the *logic* of the claim. The "Mirror Clause" is essentially a temporal self-reference.
