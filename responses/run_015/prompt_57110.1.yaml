      *   Round 1: $H$ = "Card is Red". Info: "If Spade, then Ace."
      *   Eliminates $2s-6s$.
      *   $P(Red)$ goes $6/12 \to 6/7$. (50% -> 86%).
      *   Intuition: "Spades are mostly gone, so Red is likely." (Standard).
      *   Round 2: $H$ = "Card is Ace of Spades". Info: "If Not Ace of Spades, then Red."
      *   Eliminates $2s-6s$.
      *   $P(As)$ goes $1/12 \to 1/7$. (8% -> 14%).
      *   Intuition: "Info was about non-Ace-of-Spades. Why did Ace-of-Spades rise?" (JB).
      *   *This is the plan.*

  12. **Scoring Rule Simplification:**
      *   Calculating squares for 14 students is slow.
      *   Alternative: "You have 100 points. You wager $w$ on True. If True, you keep $w$. If False, you lose $w$." -> No, that's just betting.
      *   Alternative: Linear Scoring Rule? $Score = 100 \times p$ if True, $100 \times (1-p)$ if False.
      *   *Problem:* Linear rules encourage reporting 1 or 0 (corner solutions).
      *   *Solution:* Use a pre-calculated table on the handout. "If you say 70% and are right, you get 91 points."
      *   I will specify this in the "Kit" and "Market" sections.

  13. **Final check on "Where it drifts":**
