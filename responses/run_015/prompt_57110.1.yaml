answer: |-
  1. **The kit**
  You need one deck of 12 cards (Ace–6 Hearts, Ace–6 Spades), shuffled. One card is drawn and hidden.
  **Handout (1 page):** Two tables for recording prices (0–100) for Round 1 and Round 2. A "Scoring Lookup" table: if you post price $p$ (as integer 0–100) and are correct, score $= 100 - (100-p)^2/100$; if incorrect, score $= 100 - p^2/100$. (Pre-calculate rows for 0, 10, ... 100).
  **Informant Prep:** Brief one student beforehand. They must memorize two scripts. Round 1: "If the card is Black, it is an Ace." Round 2: "If the card is not the Ace of Spades, it is Red." They speak only when prompted, tone neutral. No hedging.

  2. **Market rules**
  Each student starts with 1,000 points. In each round, they must post a price (0–100) for the target proposition *before* and *after* the informant speaks. This price represents their credence.
  **Scoring:** We use a quadratic scoring rule to penalize overconfidence. If the proposition is **True**, their points change by $+(100 - (100-p)^2/100)$. If **False**, by $-(100 - p^2/100)$. Use the handout table to compute this instantly without calculators.
  **Anti-Gaming:** You must post a price between 1 and 99 (no certainties). If you freeze, you default to 50. Prices are public; write them on the board immediately. We resolve the card draw only after Round 2 scoring to prevent outcome bias from affecting Round 2 pricing. The goal is not to "win" the game, but to minimize point loss relative to the optimal policy.

  3. **Timeline**
  **0:00–0:05:** Distribute handout. Explain scoring. Emphasize: "You are pricing evidence, not gambling."
  **0:05–0:25 (Round 1):** Target $R$: "Card is Red." Students post prior prices (expect ~50). Informant speaks: "If Black, then Ace." Students post posterior prices. (Expect surge to ~85). Record on board.
  **0:25–0:45 (Round 2):** Reset points. Target $S$: "Card is Ace of Spades." Students post prior (expect ~8). Informant speaks: "If not Ace of Spades, then Red." Students post posterior. (Expect confusion; some stay at 8, some jump to ~14). Record on board.
  **0:45–1:00:** Reveal the card. Compute scores. Let the "winners" gloat briefly.
  **1:00–1:15:** Debrief. Connect the pricing patterns to updating policies. Reveal "Judy Benjamin."

  4. **Where it should land**
  The beat lands when you point to the Round 2 board. The elimination is identical to Round 1 (five Black non-Aces removed), yet the intuition fractures. In Round 1, $P(Red)$ surges because the *consequent* is the hypothesis. In Round 2, $P(Ace of Spades)$ surges mathematically, but the *antecedent* ("Not Ace of Spades") feels like it should leave the hypothesis untouched.
  **Say nothing** until they point out the asymmetry. If silence stretches, ask: "Why did the Red price jump in Round 1, but the Ace of Spades price feels sticky in Round 2, even though the same five cards were eliminated?"

  5. **The policies, in numbers**

  | Policy | Round 1 $P(R)$ | Round 2 $P(S)$ | Logic |
  | :--- | :--- | :--- | :--- |
  | **(a) Material Conditional** | $6/12 \to 6/7$ (86) | $1/12 \to 1/7$ (14) | Treat "If $A$ then $B$" as $\neg(A \land \neg B)$. Eliminate falsifiers. |
  | **(b) Invariance (JB)** | $6/12 \to 6/7$ (86) | $1/12 \to 1/12$ (8) | Hold prior odds of the antecedent partition fixed. |
  | **(c) Antecedent Fixed** | $6/12 \to 6/7$ (86) | $1/12 \to 1/7$ (14) | Keep $P(\text{Antecedent})$ constant; redistribute within. |

  **Note:** In Round 1, (a) and (b) coincide because the hypothesis ($R$) is the consequent. Eliminating $\neg R$ cards naturally boosts $R$. In Round 2, they diverge. Policy (a) boosts $S$ because it eliminates $\neg S$ rivals. Policy (b) argues the testimony concerns the $\neg S$ partition, so $P(S)$ should remain invariant.
  **Drift:** The original Judy Benjamin problem involves a partition (Red/Blue) and a sub-partition (HQ/Field). Here, "Ace of Spades" is a single cell, not a sub-partition. This makes the "Invariance" intuition weaker but the math cleaner for a seminar.

  6. **Debrief**
  Map the board to the table. Round 1 was easy: the informant ruled out Black non-Aces. Since most Black cards were non-Aces, Black became unlikely, so Red surged. Everyone agrees.
  Round 2 is the trap. The informant ruled out the *exact same cards*. Mathematically, $P(S)$ *must* rise if you conditionalize on the material conditional. But ask the room: "Did you learn anything about the Ace of Spades, or only about the other cards?"
  This is the Judy Benjamin problem. Van Fraassen argued that conditional testimony of the form "If not $H$, then $E$" should not change $P(H)$ if the info is purely about the $\neg H$ partition. Policy (b) preserves your prior belief in $S$; Policy (a) respects the logic of elimination.
  **Real World:** A doctor says, "If the test isn't negative, it's positive." Do you update your belief that the patient is sick? Or did they just describe the test's reliability? A reviewer says, "If this method isn't flawed, the result holds." Does that make the method more likely to be flawed? The market forces you to pay for your intuition. If you priced $S$ at 8 in Round 2, you followed Policy (b). If you priced 14, you followed (a). Neither is obviously "wrong," but they imply different theories of testimony.

  7. **Wreckage report**
  First run, the scoring noise will annoy you. A student who stubbornly kept $P(S)$ at 8 (Policy b) might win if the card turns out to be the 2 of Hearts (which eliminates the 14% crowd's confidence). They will claim their "philosophy" won.
  **Handle it:** Acknowledge the luck. "You maximized points, but did you maximize accuracy?" The scoring rule rewards calibration over many rounds, not one. With 14 students and one draw, variance dominates. If someone smugly points this out, agree: "The market measures profitability, not epistemic virtue. That's why we're discussing the policy, not the points." Also, expect students to treat the conditional as biconditional ("If not S then Red" $\to$ "If Red then Not S"). Correct this gently by revealing the card isn't Red.

  8. **What the market can't show**
  The game cannot reproduce the *source* of the constraint. In the real Judy Benjamin problem, the puzzle hinges on *why* the informant spoke. Did they check the Red Army sector and find HQ? Or did they check HQ and find Red Army? The market treats the testimony as a brute fact. You must supply the context manually: "Imagine the informant checked all non-Ace cards and found them Red. Now imagine they checked all Red cards and found no non-Aces." The probability shift depends on the protocol, not just the proposition. The market prices the proposition; you must teach the protocol.
