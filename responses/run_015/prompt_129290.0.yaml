answer: |-
  # Specification for a Normative Theory of Reference-Class Selection

  **To:** Philosophers of Science, Risk Analysts, Epistemologists
  **From:** [Your Name/Department]
  **Subject:** Desiderata for Resolving the Reference Class Problem
  **Date:** 24 May 2024

  ## 1. Preamble
  The reference class problem arises when an individual $x$ possesses multiple properties ($F, G, H...$), each placing $x$ within a distinct class ($C_1, C_2, C_3...$) associated with differing probabilities for an outcome $E$. An adequate normative theory must provide a principled method for selecting the relevant class to determine the single-case probability for $x$. This document outlines the specification for such a theory, distinguishing between non-negotiable requirements and metaphysical preferences.

  ## 2. Core Non-Negotiable Desiderata
  Any candidate theory must satisfy the following conditions to be considered functionally adequate for risk assessment and scientific inference.

  ### 2.1. Decisiveness (Uniqueness)
  The theory must yield a determinate probability assignment (or a determinate range) for action. It cannot simply state that multiple probabilities exist without providing a hierarchy or weighting mechanism to resolve the conflict. Indecision is not a viable output for risk management.

  ### 2.2. Stability Against Gerrymandering
  The selection method must be robust against arbitrary descriptions. If a class is constructed *post hoc* solely to include $x$ and the outcome $E$ (a 'gerrymandered' class), the theory must reject it. The criteria for class membership must be projectible and identifiable prior to the outcome.

  ### 2.3. Operationalisability
  The criteria for class selection must be accessible to the agent. A theory requiring omniscient knowledge of all causal factors is metaphysically interesting but practically useless. The theory must function under conditions of partial ignorance.

  ## 3. Required Case Resolutions
  The theory must explicitly address the following three test cases. Failure to resolve any one of these constitutes a failure of the specification.

  ### 3.1. The Swedish Male Smoker (Conflicting Statistics)
  *   **The Case:** An individual is a male, a smoker, and Swedish. The class 'smokers' has a high mortality rate; the class 'Swedes' has a low mortality rate.
  *   **Requirement:** The theory must determine whether the causal mechanism of smoking overrides the demographic correlation of nationality. It must explain why one frequency trumps the other without merely asserting 'specificity' (since 'Swedish smoker' is more specific than either, but may lack reliable data).

  ### 3.2. Self-Locating Predictions (The Indexical Problem)
  *   **The Case:** An agent asks, "What is the probability that *I* will survive?" versus "What is the probability that *a person with my properties* will survive?"
  *   **Requirement:** The theory must account for the indexical nature of risk. It must distinguish between the probability of a proposition being true for the class and the credence an individual within that class ought to hold. It must handle cases where the individual knows they are a random sample from the class versus cases where they know they are a selected survivor.

  ### 3.3. The Interval-Boundary Shift
  *   **The Case:** An individual's class-defining properties change *during* the prediction window. For example, a 10-year mortality risk is calculated for a smoker who quits smoking in year three.
  *   **Requirement:** The theory must be time-indexed. It cannot treat the reference class as static if the causal properties of the individual are dynamic. It must specify whether the probability is fixed at the outset ($t_0$) or updated as properties shift ($t_1, t_2...$), and how this affects the validity of the initial risk assessment.

  ## 4. Required Conceptual Distinctions
  The theory must preserve the following distinctions rather than conflating them.

  ### 4.1. Epistemic versus Causal Relevance
  *   **Epistemic Relevance:** Information that changes the agent's degree of belief (e.g., knowing the individual is Swedish).
  *   **Causal Relevance:** Properties that physically influence the outcome (e.g., tar damaging lung tissue).
  *   **Requirement:** The theory must prioritise causal relevance where known, but default to epistemic relevance where causal mechanisms are opaque. It must not treat a spurious correlation as equivalent to a causal driver.

  ### 4.2. Group Frequency versus Individual Expectation
  *   **Group Frequency:** The long-run rate of occurrence within the class.
  *   **Individual Expectation:** The rational degree of belief for the single case.
  *   **Requirement:** The theory must explain the bridge principle connecting the two. It must acknowledge that a 50% group frequency does not necessarily imply a 50% individual propensity if the individual's specific causal setup is known (the problem of homogeneity).

  ## 5. Camp-Specific Preferences (Contested Desiderata)
  The following are not non-negotiable but represent commitments to specific metaphysical programmes. A theory may adopt one, but cannot satisfy all simultaneously.

  *   **Objectivity:** The probability exists independently of the agent's knowledge (favoured by Frequentists and Propensity theorists).
  *   **Coherence:** The probability is solely a measure of rational belief consistency (favoured by Subjective Bayesians).
  *   **Maximal Specificity:** The theory should always aim for the narrowest possible reference class (Reichenbach's preference).
  *   **Maximal Reliability:** The theory should prioritise the class with the largest sample size to minimise statistical error.

  ## 6. Impossibility Flags and Constraints
  Under standard statistical and logical constraints, the following subsets of desiderata are **jointly unsatisfiable**. A viable theory must explicitly state which constraint it relaxes.

  ### 6.1. The Specificity–Reliability Trade-off
  *   **Conflict:** One cannot simultaneously maximise class specificity (narrowest description) and statistical reliability (sample size). As classes narrow to match the individual, $N \to 1$, and frequency estimates become unstable.
  *   **Constraint:** Any theory claiming to satisfy both is flawed. It must offer a weighting function (e.g., Bayesian shrinkage) to balance the two.

  ### 6.2. The Homogeneity–Accessibility Tension
  *   **Conflict:** A causally homogeneous reference class (where all members share the exact same propensity) is required for objective single-case probabilities. However, such classes are epistemically inaccessible without omniscience.
  *   **Constraint:** A theory must choose between objective probabilities for unknowable classes or subjective probabilities for knowable classes.

  ### 6.3. The Diachronic Consistency Problem
  *   **Conflict:** In the **Interval-Boundary Shift** case, maintaining consistency between the probability assigned at $t_0$ and the updated probability at $t_1$ may violate the principle of conditioning if the class definition itself changes.
  *   **Constraint:** A theory cannot guarantee both that the initial risk was 'correct' and that the updated risk is 'correct' without a defined metric for truth in single-case propensity.

  ## 7. Comparative Scoring of Interpretations
  The following table scores the three dominant interpretations against the specification.
  *(Scale: 0 = Fails, 1 = Partial/Strained, 2 = Satisfies)*

  | Desideratum / Case | Frequentist Reference-Class | Subjective Bayesian Updating | Propensity Interpretation |
  | :--- | :---: | :---: | :---: |
  | **Core: Decisiveness** | 0 | 2 | 1 |
  | **Core: Stability** | 1 | 2 | 1 |
  | **Case: Swedish Smoker** | 0 | 1 | 2 |
  | **Case: Self-Locating** | 0 | 2 | 1 |
  | **Case: Interval-Boundary** | 0 | 2 | 1 |
  | **Distinction: Epistemic vs Causal** | 0 | 1 | 2 |
  | **Distinction: Frequency vs Expectation** | 2 | 0 | 1 |
  | **Total Score** | **5** | **10** | **9** |

  ### 7.1. Frequentist Reference-Class Reasoning
  *   **Strengths:** Rigorously preserves the distinction between group frequency and individual expectation.
  *   **Weaknesses:** Fails the **Interval-Boundary Shift** and **Self-Locating** cases because it requires fixed classes and cannot easily assign probabilities to single, non-repeatable events. It struggles with the **Swedish Smoker** case unless a rule for 'narrowest class' is arbitrarily imposed, violating the **Specificity–Reliability** constraint.

  ### 7.2. Subjective Bayesian Updating
  *   **Strengths:** Excels at **Decisiveness** and **Self-Locating** predictions. It handles the **Interval-Boundary Shift** naturally through conditionalisation (updating on new evidence as properties change).
  *   **Weaknesses:** Struggles to preserve the **Frequency vs Expectation** distinction, often collapsing objective risk into degrees of belief. It relies on priors that may be subjective, potentially violating **Stability Against Gerrymandering** if priors are poorly constrained.

  ### 7.3. Propensity Interpretations
  *   **Strengths:** Best at preserving **Epistemic vs Causal Relevance** and resolving the **Swedish Smoker** case by focusing on the physical situation rather than the description.
  *   **Weaknesses:** Metaphysically opaque. It struggles with **Operationalisability** (how do we measure a single-case propensity?). It often fails **Decisiveness** in practice because identifying the exact causal setup is difficult, leading to a reliance on frequencies anyway.

  ## 8. Conclusion
  No existing interpretation satisfies the full specification without relaxation. For a general ideas audience focusing on risk, a **hybrid model** is recommended: utilise **Propensity** reasoning to select the causally relevant class (resolving the Swedish Smoker), but employ **Bayesian** updating to manage the **Interval-Boundary Shift** and self-locating uncertainty. However, users must be warned that the **Specificity–Reliability Trade-off** remains an unavoidable structural limitation of probabilistic risk assessment.
