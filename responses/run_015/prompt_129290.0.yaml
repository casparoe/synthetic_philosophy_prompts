  I cover philosophy of science and risk for a general ideas audience, and I want the specification for an adequate normative theory of reference-class selection — the problem that any individual belongs to multiple classes yielding different probabilities. Write the desiderata: the cases it must resolve (the Swedish male smoker, self-locating predictions, and what I call the "interval-boundary shift", where an individual's class-defining properties change during the prediction window), the distinctions it must preserve (epistemic versus causal relevance, group frequency versus individual expectation), and which requirements are non-negotiable versus camp-specific preferences. Please flag whether any subset is jointly unsatisfiable under standard statistical constraints, and briefly score frequentist reference-class reasoning, subjective Bayesian updating, and propensity interpretations against the list. Use British English throughout.
