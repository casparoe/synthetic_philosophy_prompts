      *   *Goal:* Explain if "right but early" is coherent and how falsification applies.
      *   *Key Insight:* "Right but early" is not a standard scientific category but a historiographical one. In Popperian terms, a theory is falsified if the prediction fails within the specified conditions. If conditions change (technology), the theory isn't falsified, but the *boundary conditions* have shifted. However, swapping mechanisms (food to carbon) is indeed an analogical resurrection, not a verification. The distinction lies between *parameter adjustment* (still the same model) and *mechanism substitution* (new model).
