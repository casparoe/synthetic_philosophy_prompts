prompt: |-
  I write literary fiction — three novels, and I teach an advanced workshop most autumns — and for the last year I have been reading, slowly and with a dictionary, about how economics gave up on measuring happiness and replaced it with something supposedly thinner and harder: the doctrine that an agent's wants are nothing over and above what her choices disclose, that the numbers assigned to those wants have no unit and no common scale across persons, and that any claim about the inner magnitude or the felt texture of a desire is, strictly speaking, idle. My formal training is in no relevant field; I lasted one term of a philosophy-and-economics survey before switching to English, and while I can use words like ordinal, budget set, and maximisation in a sentence I could not define them under pressure. So I do not want an explanation of the debate so much as a translation of it. The vocabulary I actually think in is the vocabulary of craft: show-don't-tell, subtext, in-character and out-of-character, objective and obstacle, the arc, voice, the scenic menu of live options a scene puts on the table, and a private document I keep for each novel called the want ledger, in which I write down what I take each character to want and revise it as the draft goes on.

  Here is why I am asking. I am finishing a novel whose narrator, Margot, spends a decade turning down a promotion she has plainly been positioned for, saying each time that she never wanted it, and then, in the last third, litigates furiously for a version of the same thing under another name. My readers and my editor agree on the facts of her behaviour and disagree about everything else. Some say she'd never do that, which I take to mean not that the action is improbable but that it proceeds from nothing. Others say the litigation is the truest thing about her and the refusals were the evasion. I have found myself using the word real about her want in a way I cannot cash out, and I have noticed something else: whether Margot reaches for the thing in a given scene depends on which other options I have left on the page. Remove the alternative and she does not move at all; put a worse alternative beside it and she suddenly wants it badly. In workshop I call this the cut-option test, and I use it to decide whether a want is load-bearing or an artefact of the scene, but I have started to suspect that the test is doing the same work as a technical apparatus I cannot read. I also do, on every page, something I am told is impossible: I weigh the intensity of Margot's desire against her brother's and decide whose loss the chapter is really about, and I do it not by measuring anything but by allocating sentences.

  So please do this. Restate the revealed-preference picture of agency, and the quarrel about what the term utility means once it has been prised loose from happiness or felt satisfaction, as faithfully as you can in my vocabulary — tell me what a budget set is in terms of a scene, what the consistency conditions on choice amount to as constraints on character, what it would mean to say that a utility number is only an indexing of behaviour rather than a quantity of anything. Then give me the residue report. Which of their claims translate cleanly into craft terms, which translate only if you quietly import an assumption that is mine or theirs rather than common to both, and which cannot be expressed in my vocabulary at all? I am especially interested in three places where I expect the translation to fail: my conviction that as her maker I know what Margot wants prior to and independent of any choice of hers, in a way no observer could; the phenomenon in which a want survives its own renunciation, so that the refusal is evidence for the desire rather than against it; and my practice of comparing the force of one character's want with another's by compositional means. For each, say whether the residue indicts my vocabulary or theirs — whether it shows that the craft terms are doing real work economics has no room for, or that what I call knowledge of a character is less clear than it feels from inside the writing of it. And then tell me, practically, what I should do with Margot.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Literary fiction writer (3 novels), advanced workshop teacher. Deeply thoughtful about craft (show-don't-tell, subtext, voice, etc.). No formal training in economics/philosophy (lasted one term).
      *   **The Problem:** She's reading about "revealed preference" theory in economics (the idea that wants = choices, utility is ordinal/not measurable across people, inner feelings are irrelevant). She's struggling to reconcile this with her intuitive understanding of character desire ("want ledger," knowing what a character *really* wants independent of action).
      *   **The Specific Task:**
          1.  Translate revealed preference theory/utility theory into *craft vocabulary* (scene, subtext, options, etc.).
          2.  Provide a "residue report": What translates cleanly? What requires hidden assumptions? What fails to translate?
          3.  Focus on three specific failure points:
              *   Authorial omniscience (knowing the want prior to choice).
              *   Desire surviving renunciation (refusal as evidence of desire).
              *   Interpersonal comparison of desire intensity (via sentence allocation).
          4.  Determine whose vocabulary is "indicted" (craft vs. economics).
          5.  Give practical advice for the novel (Margot's situation).
      *   **Tone:** Intellectual, respectful, precise, literary, avoiding jargon unless translated. No condescension. Match the user's high level of articulation.

  2.  **Deconstruct the Economic Concepts (for internal understanding):**
      *   *Revealed Preference:* We don't know what you want until you choose. If you choose A over B, you "revealed" a preference for A. Inner states are black boxes.
      *   *Utility:* Not happiness. Just a ranking number. If U(A) > U(B), you choose A. It's ordinal, not cardinal (can't say *how much* more).
      *   *Budget Set:* The set of feasible options given constraints (money, time, rules).
      *   *Consistency (Transitivity):* If A > B and B > C, then A > C. If you violate this, you're irrational (or the model breaks).
      *   *Interpersonal Comparison:* Economics generally says you can't compare my utility to yours. No common scale.

  3.  **Drafting the Translation (Economics -> Craft):**
      *   *Budget Set:* The "scenic menu." The live options on the page.
      *   *Revealed Preference:* "Show-don't-tell" taken to its logical extreme. Action *is* character. Subtext is irrelevant if it doesn't drive choice.
      *   *Utility:* The "arc" or "trajectory." A ranking of scenes/outcomes. Not "happiness," but "narrative fit."
      *   *Consistency:* Character consistency. If a character acts out of character, the reader cries foul (unless there's a twist/development).
      *   *Ordinal/No Units:* We can't measure *how much* she wants it, only *that* she wants it more than the alternative.

  4.  **Addressing the "Residue Report" (The Core Conflict):**
      *   *Translation 1 (Clean):* The "cut-option test." This is exactly revealed preference. If you remove the alternative, does the choice hold? Economics says choice defines preference. Craft says choice reveals character.
      *   *Translation 2 (Hidden Assumption):* Consistency. Economics assumes rational consistency. Craft allows for contradiction (complexity, self-deception).
      *   *Translation 3 (Failure):* The three specific points raised by the user.
          *   *Authorial Omniscience:* Economics says "observer cannot know inner state." User says "I am the maker, I know." *Verdict:* Economics indicts the feeling of omniscience as a "god trick." Craft validates it as necessary for coherence.
          *   *Renunciation:* Economics says Refusal = No Want. User says Refusal = Fear/Conflict = Want. *Verdict:* Economics lacks a vocabulary for repression/subtext. Craft owns this.
          *   *Interpersonal Comparison:* Economics says "No common scale." User says "I allocate sentences." *Verdict:* Economics is right mathematically, but wrong narratively. Narrative *requires* weighing lives against each other.

  5.  **Addressing Margot (Practical Advice):**
      *   Margot refuses promotion (Choice A) then litigates for it (Choice B).
      *   Economic view: Inconsistent. Irrational. Or the "thing" changed names/attributes.
      *   Craft view: Subtext. The *name* of the want changed, but the *object* remained. The refusal was a defense mechanism.
      *   Advice: Don't smooth it out. Lean into the inconsistency as *character truth*. The "want ledger" needs to distinguish between the *conscious want* (safety/stasis) and the *unconscious want* (power/recognition). The litigation isn't a reversal; it's the subtext becoming text.

  6.  **Refining the Tone:**
      *   Use the user's metaphors (ledger, menu, load-bearing).
      *   Avoid explaining economics *to* her, but explain it *through* her metaphors.
      *   Acknowledge the tension: Economics seeks prediction/modeling; Fiction seeks truth/complexity.
      *   Ensure the "indictment" section is balanced. It's not that economics is "wrong," but that its constraints are different from fiction's constraints.

  7.  **Step-by-Step Writing Plan:**
      *   **Introduction:** Acknowledge the shared ground (the mystery of agency).
      *   **The Translation:** Map Budget Set, Revealed Preference, Utility, and Consistency to Craft terms.
      *   **The Residue Report:** Analyze the three specific friction points.
      *   **The Indictment:** Who is "wrong"? (Spoiler: It's a category error, but Craft wins on interiority).
      *   **Margot:** Specific advice on handling the promotion/litigation arc.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "ordinal utility" clearly? *Correction:* Use the ranking of scenes rather than "units of happiness."
      *   *Check:* Did I address the "sentence allocation" point? *Correction:* Frame this as narrative weight vs. economic measurability.
      *   *Check:* Is the advice for Margot actionable? *Correction:* Suggest specific revisions to the "want ledger" to account for the name-change of the desire.
      *   *Tone Check:* Ensure I don't sound like an economist correcting a writer. I am a translator. The writer's intuition is valid data.

  9.  **Final Polish:** Check against the prompt's specific constraints (three failure points, residue report, practical advice). Ensure the distinction between "happiness" and "utility" is clear in craft terms (satisfaction vs. narrative resolution).

  *(Self-Correction on the "Indictment"):* Be careful not to say Economics is useless. It's useful for structure. But it fails at *psychology*. The indictment is that Economics mistakes the map (choice) for the territory (mind). Fiction knows the territory exists even if unmapped.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the translation you asked for, followed by the residue report, and finally, a prescription for Margot.

  ### I. The Translation: Economics as Craft

  To the economist of the revealed-preference school, a human being is not a vessel of feelings but a machine for ranking options. Here is how that machine looks when described in the vocabulary of the workshop.

  **The Budget Set is the Scenic Menu.**
  In economics, an agent faces a *budget set*: the collection of all possible bundles of goods she can afford given her constraints (income, prices, rules). In your novel, the budget set is the *scenic menu*. It is the live options you place on the page for Margot in any given moment. She cannot choose the promotion if you do not write the scene where it is offered. She cannot choose the litigation if the law does not allow it. The budget set is the architecture of the possible. If you remove an option from the menu, the character cannot reveal a preference for it.

  **Revealed Preference is Show-Don't-Tell Radicalized.**
  The doctrine states: *We cannot see the want; we can only see the choice.* If Margot chooses tea over coffee, she has revealed she prefers tea. Her inner sensation of "liking tea" is scientifically idle; it is the choice that constitutes the preference. In craft terms, this is *show-don't-tell* stripped of its psychological safety net. It says: do not tell me she is brave; let her walk into the room. If she walks in, she is brave. If she stays out, she is not. There is no "bravery" inside her that exists independently of the walking. The action *is* the character.

  **Utility is the Arc (Ordinal, Not Cardinal).**
  Economists prised *utility* loose from happiness. It is not a unit of pleasure (like a lumen of light). It is merely a ranking number. If Outcome A gets Utility 10 and Outcome B gets Utility 5, it does not mean A is twice as good as B. It only means A is ranked higher than B. In your vocabulary, Utility is the *narrative arc* or the *trajectory*. It is the ordering of scenes from least satisfying to most satisfying resolution. To say Margot "maximizes utility" is to say she moves through the draft toward the scene that resolves her tension most effectively, given her constraints. It is a measure of *fit*, not *joy*.

  **Consistency is Character Integrity.**
  Economics demands *transitivity*: If you prefer A to B, and B to C, you must prefer A to C. If you choose C over A, you are irrational, or the model has broken. In craft, this is *character consistency*. If Margot refuses the promotion in Chapter 3 (A > B) and refuses it again in Chapter 6 (A > B), she cannot suddenly grab it in Chapter 9 (B > A) without a change in the budget set (new information) or a break in the reader's trust. The consistency conditions are the constraints on *voice* and *motivation*. If she violates them, the reader says, "She wouldn't do that," which is the reader's way of saying, "You have violated the transitivity of her soul."

  **The Indexing of Behaviour.**
  To say a utility number is an indexing of behaviour rather than a quantity means: The number describes the *pattern of the dance*, not the *heat of the dancer*. If you assign Margot a high utility for "solitude," you are not measuring her peace; you are noting that whenever offered "party" vs. "solitude," she picks "solitude." The number is a label for the habit, not a measure of the feeling.

  ***

  ### II. The Residue Report

  You asked where the translation holds, where it smuggles assumptions, and where it breaks.

  **1. What Translates Cleanly: The Cut-Option Test.**
  Your "cut-option test" is precisely the *Weak Axiom of Revealed Preference*. If Margot chooses A when B is available, she cannot later choose B when A is available, unless the menu has changed. When you remove an alternative to see if the want is "load-bearing," you are testing for *independence of irrelevant alternatives*. This translates perfectly. Both disciplines agree: A want that disappears when the cost changes was never a structural want; it was a price effect.

  **2. What Translates Only with Smuggled Assumptions: Consistency.**
  Economics assumes consistency is a law of nature. Craft treats consistency as a contract with the reader. The translation works only if we assume the character is *rational* in the economic sense (maximizing a stable function). But you, as a writer, know characters are often self-destructive. To make the economic model fit, you must import the assumption that Margot is *coherent*. If she is incoherent (human), the economic model calls her "random noise." The craft model calls her "complex." The translation holds only if you agree to treat her contradictions as data points of a higher-order consistency (e.g., she consistently avoids intimacy).

  **3. The Failure Points (The Residue).**
  Here is where the vocabularies collide.

  *   **Failure A: Authorial Omniscience vs. The Black Box.**
      *   *The Conflict:* You say, "I know what Margot wants prior to choice." Economics says, "Impossible. The mind is a black box. Only output matters."
      *   *The Residue:* Economics indicts your feeling of omniscience as a category error. It suggests that what you call "knowing her want" is actually just "predicting her choice based on your draft." However, Craft indicts Economics for blindness. In fiction, the *subtext* is real. The want that is *not* chosen is often more real than the one that is.
      *   *Verdict:* **Craft wins.** Economics is a tool for predicting markets, not minds. Your "knowledge" is not mystical; it is the structural integrity of the design. You built the machine; you know the gear ratios before they turn. Economics treats the agent as a stranger; you treat the agent as a creation. The residue shows that Economics has no room for *intention*, only *action*.

  *   **Failure B: Renunciation as Evidence.**
      *   *The Conflict:* You say, "Refusal can be evidence of desire" (reaction formation, fear, sacrifice). Economics says, "Refusal is evidence of lower utility."
      *   *The Residue:* This is the sharpest break. In revealed preference, a sacrifice is just a trade. If Margot turns down the promotion, she values "non-promotion" more than "promotion." Full stop. To say she "really wanted it" is, to an economist, idle metaphysics.
      *   *Verdict:* **Craft wins.** The economic definition of "want" is too thin for literature. Literature is the study of the gap between the *conscious want* and the *unconscious need*. Economics collapses them into "choice." Your vocabulary captures the *texture* of the refusal (the bitterness, the hesitation) which Economics discards as noise. The residue indicts Economics for defining "want" as "satisfaction of choice" rather than "pressure toward object."

  *   **Failure C: Interpersonal Comparison (Sentence Allocation).**
      *   *The Conflict:* You weigh Margot's desire against her brother's by "allocating sentences." Economics says, "Utility is not comparable across persons. There is no common scale."
      *   *The Residue:* Economics is mathematically correct: there is no ruler that measures your pain against mine. But Narrative is morally correct: the novel *demands* a common scale. By giving Margot three paragraphs of interiority and her brother one, you have asserted that her loss matters more. You have created a common scale called *Attention*.
      *   *Verdict:* **Draw / Context Dependent.** Economics is right that you cannot measure this objectively. Craft is right that you *must* measure it subjectively to create meaning. The residue shows that Economics forbids the very act that makes fiction possible: the judgment of value between lives.

  ***

  ### III. The Indictment

  Does this residue show your vocabulary is fuzzy, or theirs is thin?

  It shows that **Economics is a map of behaviour, while Craft is a map of meaning.**

  When you say you "know" Margot's want prior to choice, Economics calls this a delusion of the observer. But in the context of creation, it is a necessity. If you do not know the want prior to the choice, you are not writing a novel; you are recording a transcript. The economic model works for *observers* of finished systems. The craft model works for *architects* of living systems.

  The failure of translation at the three points above does not indict your vocabulary. It indicts the economic doctrine for claiming to be a complete theory of human agency when it is only a theory of human *transaction*.

  *   **On Omniscience:** Your "knowledge" is the blueprint. Economics ignores blueprints and studies the building. Both are valid, but you are the builder.
  *   **On Renunciation:** Economics cannot see *repression*. It has no variable for "the thing I want but cannot admit." Craft is built for this. This is not a failure of your terms; it is a failure of theirs to account for the unconscious.
  *   **On Comparison:** Economics refuses to judge whose life hurts more. Fiction *must* judge. Your "sentence allocation" is a moral technology they lack.

  ***

  ### IV. What To Do With Margot

  You have a narrator who refuses a promotion for ten years (Choice A) and then litigates for it (Choice B). Your readers are split: some say it's inconsistent (violates transitivity), others say it's the truth (subtext revealed).

  Here is the practical application of the translation:

  **1. Update the Want Ledger.**
  You are currently tracking one variable: *Want: Promotion.*
  Economics would say this variable is binary (0 or 1). You need to split it into two variables, which Economics forbids but Craft requires:
  *   *Conscious Want:* Safety / Stasis / Non-responsibility. (This drives the Refusal).
  *   *Unconscious Want:* Recognition / Power / Justice. (This drives the Litigation).
  For ten years, the *Conscious Want* had a higher budget constraint (she could afford to say no). In the last third, the *Budget Set* changes. Perhaps the cost of "Stasis" becomes too high (humiliation, poverty, or a threat to her brother). The "Litigation" is not a reversal of the "Want"; it is the *Unconscious Want* finally becoming the *Binding Constraint*.

  **2. Reframe the Inconsistency.**
  Do not try to smooth over the contradiction for the sake of "consistency." The economic critique (that she is irrational) is the *theme* of the book. Margot is an agent who does not know her own utility function.
  *   *The Fix:* In the scenes of refusal, ensure the "scenic menu" includes a hidden cost she is ignoring. She says "I don't want it," but show the reader that the alternative is becoming impossible.
  *   *The Litigation:* Make sure the "version of the same thing under another name" is distinct enough in the *Budget Set* to justify the choice, but similar enough in *Utility* to feel like the same hunger. She isn't litigating for the "Promotion" (which she refused); she is litigating for "Respect" (which she always wanted). The object changed names, which changes the economic calculation, even if the emotional texture is the same.

  **3. Use the Cut-Option Test on the Refusals.**
  You mentioned: "Remove the alternative and she does not move at all."
  Apply this to the decade of refusal. If you remove the option of "staying put" (force her out), does she fight to stay? If she fights to stay, the refusal was a true preference. If she collapses, the refusal was a *pose*.
  *   *Recommendation:* In the final third, when she litigates, reveal that the option of "staying put" has been removed by the world. She is not choosing the promotion; she is choosing the only remaining live option that preserves her dignity. This satisfies the economic consistency check (she maximized utility given new constraints) while satisfying the craft requirement (her inner desire was constant, the world changed).

  **4. Trust the Sentence Allocation.**
  Your readers who say "she'd never do that" are reading her *Conscious Want*. Your readers who say "the litigation is the truest thing" are reading her *Unconscious Want*.
  You resolve this not by explaining it, but by weighting the sentences. In the litigation scenes, allocate more interiority to the *fear* of the promotion than the *desire* for it. Show that the "Want" is a wound, not a goal.
  Economics says utility is ordinal. Fiction says utility is *textural*. You have already done the work by allocating the sentences. Trust that the reader feels the weight even if they cannot measure it.

  **Summary:**
  Margot is not irrational. She is complex. The economic model breaks because it assumes the agent knows her own prices. Margot does not. Your job in the final draft is not to make her consistent in her *choices*, but consistent in her *wounds*. The promotion was never the object; it was the mirror. She refused the mirror for ten years. In the end, she smashes it to see her face. That is not a violation of revealed preference. That is a novel.
