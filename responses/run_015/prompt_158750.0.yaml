answer: |-
  ### The Two-Sentence Pitch for the Board President
  "Expected return tells us what we make on average in a good year; geometric growth tells us what we actually keep forever after volatility and payouts eat into the principal. This procedure prioritizes never running out of money over maximizing the number on the screen, which is the only way to honor the 'perpetual' mandate."

  ***

  ### The "Perpetuity-First" Decision Protocol
  **Time required:** 60–90 minutes per agenda item.
  **Who:** Committee + Actuary.
  **Goal:** Determine if a bet increases the long-term compound growth rate *without* threatening the 5% payout floor.

  #### Phase 1: The Values Guardrails (15 Minutes)
  *These are not math questions. They are policy decisions. The math cannot answer these.*

  1.  **What is the hard floor for the corpus?**
      *   *Good Answer:* "We cannot dip below $9M nominal" OR "We can dip to $8M but must restore within 3 years."
      *   *Stop/No:* If the committee cannot agree on a number, you cannot proceed. You are optimizing for different goals.
  2.  **What is the acceptable probability of breaching that floor?**
      *   *Good Answer:* "Less than 1% over any 10-year period" (Implies extreme conservatism).
      *   *Stop/No:* If the answer is "We want growth, accept some risk," write down a number. If you can't quantify the risk tolerance, you cannot use this protocol.
  3.  **What is the "Time Horizon" in human terms?**
      *   *Good Answer:* "Forever, but we review solvency every 5 years."
      *   *Note:* "Forever" implies maximizing geometric mean. "My tenure" implies maximizing arithmetic mean. Confirm you are actually optimizing for "Forever."

  #### Phase 2: The Actuary's Translation (20 Minutes)
  *We do not have probabilities. We have vibes. The Actuary converts vibes to conservative numbers.*

  4.  **What is the Conservative Probability of Success ($P$)?**
      *   *Input:* Committee "vibes" (e.g., "30% to 60% chance").
      *   *Procedure:* Take the **lower bound** of the range, then discount it by 20%.
      *   *Example:* Range 30–60% $\rightarrow$ Use 30% $\rightarrow$ Conservative $P = 24\%$.
      *   *Why:* Kelly blows up on overconfidence. We bias toward survival.
  5.  **What is the Payoff Ratio ($B$)?**
      *   *Input:* Best case vs. Worst case.
      *   *Procedure:* (Net Gain if Win) / (Net Loss if Lose).
      *   *Correction:* If the loss is "total principal," $B$ is simply (Gain / 1).
  6.  **Does this bet correlate with our existing portfolio or the payout liability?**
      *   *Yes (High Correlation):* If this loses when stocks lose, or when scholarship demand spikes (recession), apply a **Correlation Discount**. Reduce the calculated position size by 50%.
      *   *No (Uncorrelated):* No discount.
      *   *Negative (Hedge):* If this wins when stocks lose, you may increase size by 25%.
      *   *Why:* You asked about independence. In practice, correlation cuts effective capacity in half during crises. If you ignore this, you are not diversified; you are just levered.

  #### Phase 3: The Sizing Calculation (15 Minutes)
  *We use a "Half-Kelly" approach. Full Kelly is too volatile for a fund with a mandatory 5% drain.*

  7.  **Calculate the Raw Edge:**
      *   Formula: $Edge = (P \times B) - (1 - P)$
      *   *Stop/No:* If Edge is $\le 0$, reject immediately. Do not pass Go.
  8.  **Calculate the Fractional Kelly Size:**
      *   Formula: $Size \% = (Edge / B) \times 0.5$
      *   *Note:* The 0.5 is the safety buffer.
  9.  **Apply the Payout Stress Test:**
      *   *Question:* If this bet goes to zero *today*, can we still pay the 5% scholarship for the next 3 years without selling equities at a loss?
      *   *Good Answer:* "Yes, we have 3 years of cash/bonds reserved outside this bet."
      *   *Stop/No:* If "No," reduce Size % until the answer is "Yes."

  #### Phase 4: The Values Override (15 Minutes)
  *Math says what you *can* do. Values say what you *should* do.*

  10. **The Reputation Check:**
      *   *Question:* If we lose this money, will the donor family withdraw support?
      *   *Action:* If Yes, cap loss at 1% of AUM regardless of math.
  11. **The Sleep Test:**
      *   *Question:* Does this allocation keep the committee awake during a 20% market drop?
      *   *Action:* If Yes, cut size by half.

  ***

  ### Running the Protocol: Three Cases

  #### Case 1: The Annual Equity-vs-Cash Allocation
  *Current Policy:* 60% Equity / 40% Bonds.
  *Inputs:*
  *   Equity Risk Premium: 4% (Conservative).
  *   Volatility: 15%.
  *   Payout Drag: 5% (Hard liability).
  *   Actuary View: "70% chance of positive real return, but wide range." $\rightarrow$ Conservative $P = 56\%$.
  *   Correlation: Perfect correlation with portfolio (it *is* the portfolio).

  **The Procedure's Output:**
  1.  **Edge:** Positive, but the 5% payout creates a "volatility drag."
  2.  **Stress Test:** With a 5% payout, a 40% market drop requires a 67% gain just to restore capital.
  3.  **Result:** The protocol recommends **35% Equity / 65% Bonds-Cash**.
  4.  **Why you'll hate it:** It feels too conservative. It lowers expected arithmetic return.
  5.  **Why it's right:** At 60% equity, the probability of the fund losing real purchasing power over 20 years (due to sequence of returns risk + 5% payout) is >15%. At 35%, it drops to <2%. You asked for "Perpetual." 60/40 is a "Grow then Spend" fund. 35/65 is a "Perpetual" fund.

  #### Case 2: The 3x-or-Bust Program-Related Investment (PRI)
  *Proposal:* Invest $500k. 3x return in 6 years OR lose 80% of principal.
  *Director's Vibe:* "Feels like a 50/50 shot."
  *Inputs:*
  *   Range: 30–60% probability.
  *   Conservative $P$: 24% (Lower bound 30% less 20%).
  *   Payoff ($B$): Gain $1M / Lose $400k = 2.5.
  *   Correlation: High. (Program fails if economy tanks, same time endowment drops).

  **The Procedure's Output:**
  1.  **Edge:** $(0.24 \times 2.5) - 0.76 = 0.60 - 0.76 = -0.16$.
  2.  **Result:** **REJECT.**
  3.  **Why you'll hate it:** The Director has a pet project. The "Expected Value" is technically positive if you use the average probability (45%), but the *Geometric* edge is negative once you apply the conservative probability discount required for perpetuity.
  4.  **Why it's right:** With a 5% payout floor, you cannot afford "bust" scenarios that correlate with market downturns. You need a higher probability of success to justify the volatility drag.

  #### Case 3: The Donor Match (Expires in 90 Days)
  *Proposal:* Donor matches new cash contributions 1:1 up to $250k.
  *Inputs:*
  *   Probability: 100% (Contractual).
  *   Payoff: 100% immediate return on matched portion.
  *   Correlation: None.
  *   Liquidity: Requires moving cash from reserves.

  **The Procedure's Output:**
  1.  **Edge:** Infinite (Risk-free arbitrage).
  2.  **Stress Test:** Does moving $250k cash leave us unable to pay next quarter's scholarship?
  3.  **Result:** **MAXIMIZE.** Execute immediately.
  4.  **Caveat:** If you must sell equities to raise the cash, apply the current market price risk. If you have cash on hand, this is the only time the protocol says "Go big."

  ***

  ### Blind Spots: What Geometric Growth Won't Tell You

  1.  **Path Dependency (The "Bumpy Budget" Problem):**
      Maximizing geometric growth assumes you can ride out a 50% drawdown as long as you recover in 10 years. It does *not* care if you have to cut scholarships by 40% for three years to survive it. Your stakeholders (students, donor family) care deeply about the path. The protocol handles this via the "Payout Stress Test," but the math itself is indifferent to human suffering during the trough.
  2.  **Reputation & Political Risk:**
      The math doesn't know the donor family will pull the plug if you lose 10% in a year, even if the long-term math is sound. That is a "ruin" condition not captured in the balance sheet.
  3.  **Infinite Time vs. Finite Tenure:**
      Kelly optimizes for $t = \infty$. Committee members optimize for $t = \text{their tenure}$. A strategy that looks great in year 20 might look terrible in year 3. This creates a principal-agent conflict the math cannot resolve.
  4.  **Correlation Estimation Error:**
      We asked you to guess correlation. In a crisis, all correlations go to 1. The "Correlation Discount" is a heuristic, not a law. If everything correlates during a liquidity crunch, the sizing will still be too aggressive.

  ### Summary for the Committee
  This procedure is not about finding the highest return. It is about finding the highest return *that allows us to sleep while meeting the 5% obligation.* It will frequently tell you "No" to things that look profitable on paper. That is the feature, not the bug. If you want to maximize returns, you should not be running a perpetual scholarship fund; you should be a hedge fund. If you want to exist forever, you must accept lower growth to buy survival.
