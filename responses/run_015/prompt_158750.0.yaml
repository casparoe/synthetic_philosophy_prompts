prompt: |-
  I'm on the volunteer investment committee of a small perpetual scholarship fund — about $9M, we meet four times a year, we have to pay out somewhere near 5% a year in scholarships no matter what the market did, and the founding donor's family is in the room. None of us are finance people except one retired actuary. Our current "policy" is a gut-feel 60/40 plus whoever sounds most confident that quarter.

  We've been reading about the Kelly criterion / maximizing long-run geometric growth, and it's clicked for us that for a fund meant to last forever what matters is the growth rate of the corpus, not next year's expected return. But I can't hand a committee a formula. Please turn it into a decision procedure we can actually run in a 90-minute meeting on any proposal we get: the annual equity-vs-cash allocation, but also one-off skewed things — a donor challenge grant we could lever up on, a program-related investment that either returns 3x in six years or loses most of the principal, an offer to buy a building with a mortgage. I want it as questions in order, each with what counts as a good enough answer, where we stop with a no, and where it explicitly hands the decision back to us as a values call rather than a fact (I'm guessing the payout floor and the time horizon are in that category — tell me what else is).

  Two things have to be built in. One: we almost never have probabilities, just an actuarys range and some vibes, so the procedure needs to say what to do when the input is "somewhere between 30 and 60%", and be honest about which steps are judgment with numbers attached. Two: our positions aren't independent — everything correlates with everything, and with the years the scholarships come due — so "size it as if it were the only bet" needs correcting, and I want to know how much the correction actually matters in practice.

  Then run it on three cases: the annual allocation; the 3x-or-bust program-related investment our director is in love with; and a donor match that expires in 90 days. I want at least one case where the procedure gives us an answer we'll hate. And be straight about what maximizing geometric growth can't tell us — I suspect it has nothing to say about how bumpy the annual scholarship budget is allowed to be, and I want to know the other blind spots too.

  It needs to be in a form I can put infront of the board president, who will ask why this isn't just expected return, and will want a two-sentence answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Volunteer on an investment committee for a small perpetual scholarship fund ($9M AUM).
      *   **Constraints:** 5% annual payout requirement (hard floor), quarterly meetings, donor family present (emotional/political pressure), mostly non-experts (one retired actuary).
      *   **Current State:** "Gut-feel 60/40 plus confidence."
      *   **Goal:** A practical decision procedure based on Kelly Criterion/Geometric Growth principles, adaptable for a 90-minute meeting, handling uncertainty ("vibes"), correlation, and specific cases (allocation, PRI, match).
      *   **Requirements:**
          *   Step-by-step questions with pass/fail criteria.
          *   Distinguish between fact-based steps and values-based steps.
          *   Handle probability uncertainty (ranges vs. point estimates).
          *   Address correlation risk (portfolio context).
          *   Run three specific cases (Annual Allocation, PRI, Donor Match).
          *   Include at least one "hateable" answer (counter-intuitive result).
          *   Explain blind spots of Geometric Growth (volatility of payouts, etc.).
          *   Two-sentence explanation for the Board President (why this isn't just Expected Return).

  2.  **Deconstruct the Theory (Kelly/Geometric Growth) for this Context:**
      *   *Kelly Criterion:* Maximizes long-term compound growth. Formula: $f^* = (p \cdot b - q) / b$.
      *   *Problem:* Real life doesn't give clean $p$ (probability) or $b$ (odds).
      *   *Problem:* Perpetual fund with a *liability* (5% payout). This isn't pure growth; it's growth *minus* drain. This is effectively a "Safety First" or "Ruins Avoidance" problem disguised as growth.
      *   *Problem:* Correlation. If everything crashes when scholarships are due, you sell low.
      *   *Adaptation:* We need a "Fractional Kelly" approach because full Kelly is too volatile for a committee that meets quarterly and has a hard payout floor. We need to incorporate the "Payout Floor" as a risk constraint, not just an optimization target.

  3.  **Drafting the Decision Procedure (The "90-Minute Protocol"):**
      *   *Structure:* Needs to be a checklist.
      *   *Step 1: The Values/Hard Constraints.* (Payout floor, Time Horizon). This is where the committee decides risk tolerance, not math.
      *   *Step 2: The "Edge" Assessment.* Handling the "vibes." Use the Actuary. Convert ranges to conservative point estimates.
      *   *Step 3: Correlation Check.* Crucial for the user's concern about non-independence.
      *   *Step 4: Sizing.* The Kelly-ish calculation, but dampened.
      *   *Step 5: The "Sleep Test".* Qualitative override.

  4.  **Addressing Specific User Constraints:**
      *   *Uncertainty:* Use the Actuary to turn "30-60%" into a "Conservative Probability" (e.g., use the lower bound or a weighted average skewed to pessimism).
      *   *Correlation:* Introduce a "Correlation Discount." If it correlates with the main portfolio or the liability (scholarship demand/market crash), reduce size.
      *   *Values vs. Facts:* Explicitly label steps.
      *   *Board President Pitch:* Needs to be punchy. "Expected return tells you what you make on average; geometric growth tells you what you actually keep after volatility and payouts."

  5.  **Developing the Three Cases:**
      *   *Case 1: Annual Allocation (60/40 vs. Kelly).*
          *   Input: Equity risk premium, volatility, payout drag.
          *   Result: Likely lower equity exposure than 60% because of the 5% hard floor + volatility drag. *This might be the "hateable" answer.* (e.g., "Math says 40% equities to ensure perpetuity").
      *   *Case 2: PRI (3x or Bust).*
          *   Input: High variance, low probability of success?
          *   Result: Kelly usually says small bet on high variance unless edge is huge. If probability is "vibes," conservative estimate kills it.
      *   *Case 3: Donor Match (90 days).*
          *   Input: Risk-free return (100% immediate gain on matched portion).
          *   Result: Maximize this. It's arbitrage. But liquidity matters.

  6.  **Refining the "Hateable Answer":**
      *   The most counter-intuitive thing for a growth-minded group is being told to hold *more* cash/bonds than they think, because the 5% payout creates "sequence of returns risk." If the market drops 20% and you withdraw 5%, you need 25% growth just to get back to even. Geometric growth optimization with a withdrawal rate often suggests *lower* volatility than pure Kelly. Let's make the Annual Allocation recommendation conservative (e.g., 30-40% equity) to ensure the "Forever" part actually works.

  7.  **Addressing Blind Spots:**
      *   Geometric growth ignores the *path*. It doesn't care if scholarships are cut in half for 3 years as long as it recovers in year 10. The committee *does* care.
      *   It ignores reputation risk (donor family watching).
      *   It assumes infinite time, but committee members have finite tenure.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, pragmatic, slightly skeptical of pure math, respectful of the volunteer nature.
      *   *Formatting:* Clear headings, bold text for emphasis, distinct sections for the Protocol, The Cases, and The Pitch.
      *   *Correction on Correlation:* Make sure to explain *why* it matters. If the PRI fails when the stock market crashes, it's dangerous. If it fails when stocks boom, it's a diversifier.

  9.  **Final Review against Constraints:**
      *   90-minute meeting feasible? Yes, checklist style.
      *   Actuary utilized? Yes, for probability translation.
      *   Values vs. Facts distinguished? Yes.
      *   Two-sentence pitch included? Yes.
      *   Blind spots covered? Yes.
      *   "Hateable" answer included? Yes (in the allocation case).

  10. **Self-Correction during drafting:** I initially thought about suggesting Full Kelly. *Correction:* No, Full Kelly is too volatile for a 5% payout fund. Half-Kelly or Quarter-Kelly is more appropriate for "perpetual" with liability. I will recommend a "Safety-Adjusted Kelly" which caps risk based on the payout floor.

  11. **Final Polish:** Ensure the distinction between "Expected Value" (arithmetic) and "Geometric Growth" is clear in the pitch. (EV = average outcome; Geometric = compound outcome).

  *(Self-Correction on the "Hateable Answer")*: Actually, the most hateable answer for a committee wanting to "maximize growth" is often being told *not* to take a bet that has positive expected value but too much volatility drag relative to the payout requirement. I'll make the PRI case the one they hate (rejecting a high-EV project because it threatens perpetuity). Or the Allocation case (reducing equity). Let's go with the Allocation case being lower than expected, as that affects everything.

  Wait, the prompt asks for *one* case where the procedure gives an answer they'll hate. I'll make it the Annual Allocation. They want 60/40. The math with a 5% floor might say 40/60 to ensure "Forever."

