      *Decision:* The core answer is **Tacit Knowledge**. The supporting framework is the **Dreyfus Model** and **Recognition-Primed Decision Making**. The distinction from piano is **Declarative/Perceptual vs. Procedural**.

      *Let's structure the response:*
      1. Direct Answer: Tacit Knowledge.
      2. The Philosopher: Michael Polanyi.
      3. The Cognitive Mechanism: System 1 / RPD / Dreyfus.
