answer: |-
  The concept you are describing has a name, and it is one of the most significant ideas in the philosophy of science and epistemology. It is **Tacit Knowledge**.

  While "intuition" or "unconscious competence" are often used colloquially, they lack the philosophical weight to capture the specific epistemic status you are describing (i.e., that it is *knowledge* capable of being true or false, not just a reflex).

  Here is the breakdown of the concept, why it fits your description, how it differs from motor skills, and why your attempt to construct rules fails.

  ### 1. The Core Concept: Tacit Knowledge
  The term was coined by the polymath Michael Polanyi in his 1966 book *The Tacit Dimension*. His famous maxim is: **"We can know more than we can tell."**

  Polanyi argued that explicit knowledge (rules, formulas, verbal descriptions) rests upon a foundation of tacit knowledge. In your context, the "rule" is the explicit layer, but the diagnosis is the tacit layer.

  **Why it fits your description:**
  *   **Ineffability:** You cannot fully articulate the criteria. Polanyi argues this isn't a failure of memory or language; it is a structural feature of the knowledge. The knowledge exists in the *integration* of clues, not in the clues themselves.
  *   **Truth-Tracking:** You noted it behaves like knowledge (it can be right or wrong). Tacit knowledge is not a guess; it is a cognitive grasp of reality that hasn't been encoded into propositions.
  *   **Correctability:** You can be trained out of a wrong tacit judgment. If a senior radiologist corrects you, your tacit framework updates, even if you still can't articulate the rule.

  ### 2. The Mechanism: Focal vs. Subsidiary Awareness
  Polanyi provides a mechanism for *why* you can't explain it. He distinguishes between two types of awareness:
  *   **Focal Awareness:** The object you are attending to (the diagnosis: "this is normal").
  *   **Subsidiary Awareness:** The particulars you are using to attend to the object (the texture of the parenchyma, the subtle gradient of density, the symmetry).

  **The Crucial Point:** You can only attend to the particulars *subsidiarily*. If you shift your focal awareness to the particulars (trying to list the rules to the resident), the gestalt collapses. It is like looking at your own eyes; you can see *with* them, but you cannot see *them* directly without a mirror. When you try to construct a rule for the resident, you are trying to make the subsidiary focal, which destroys the integration required for the diagnosis.

  ### 3. Cognitive Science: The Dreyfus Model & RPD
  In cognitive science and expertise studies, this is further elaborated by the **Dreyfus Model of Skill Acquisition** and Gary Klein's **Recognition-Primed Decision (RPD)** model.

  *   **Dreyfus Model:** You have moved from "Competence" (relying on rules and conscious features) to "Proficiency/Expertise" (holistic perception). At the expert level, the brain does not solve a problem; it recognizes a situation.
  *   **Recognition-Primed Decision:** You aren't comparing options. You see the scan, it matches a prototype in your library of 100,000+ scans, and the "decision" (normal/abnormal) comes attached to the recognition.

  This explains why your post-hoc rules fail. Your brain is performing a **high-dimensional pattern match**. A rule is a linear, low-dimensional cut through that space. When you construct a rule ("if density > X, then normal"), you are drawing a straight line through a complex manifold. It will work for cases near the boundary you remember, but it will misclassify the complex edge cases your tacit intuition handles correctly.

  ### 4. Is it the same as the Pianist? (Procedural vs. Perceptual)
  You asked if a pianist's fingerings are the same kind of thing. They are related but distinct categories of non-explicit knowledge.

  *   **The Pianist (Procedural Knowledge):** This is "knowing how." It is encoded largely in the cerebellum and motor cortex. It is about *action*. If you ask a pianist how they play a scale, they also can't tell you (trying to think about finger placement causes them to stumble), but the output is motor.
  *   **The Radiologist (Perceptual/Epistemic Knowledge):** This is "knowing that." It is encoded in the ventral visual stream and associative cortex. It is about *truth*.

  Both are **Tacit**, but the pianist's tacit knowledge is *motor*, whereas yours is *perceptual-cognitive*. This is why your distinction matters: the pianist's skill is judged by fluidity; your skill is judged by correspondence to reality (is the patient actually sick?). Your intuition has a truth value; the pianist's fingering has an efficiency value.

  ### 5. Why "Experience" is an Insufficient Label
  You are right to reject "experience" as the name. Experience is the *cause*; Tacit Knowledge is the *state*.

  Calling it "experience" implies a black box. Calling it **Tacit Knowledge** acknowledges that there is a structured, reliable, cognitive architecture there, even if it is not propositional. It validates that your inability to explain it is not a pedagogical failure on your part, but a limitation of language and conscious access.

  ### 6. The Danger Zone: Bias vs. Expertise
  You mentioned: *"it can be wrong, it can be corrected... two of us can disagree where one of us is actually right."*

  This is the critical edge condition. In psychology (Kahneman's *System 1*), fast thinking is often associated with bias. However, **Expert Intuition** (a term Kahneman accepts but qualifies) is distinct from heuristic bias.
  *   **Bias:** Fast thinking based on flawed heuristics (e.g., availability cascade).
  *   **Expert Intuition:** Fast thinking based on valid, high-volume pattern recognition in a regular environment.

  Radiology is a "high-validity" environment (the scans follow physical laws, outcomes are verifiable). Therefore, your wordless certainty is likely valid expertise. If you were a stock picker (low-validity environment), that same certainty would be a delusion.

  ### Summary
  The name you are looking for is **Tacit Knowledge**.

  *   **Philosophical Home:** Michael Polanyi (*The Tacit Dimension*).
  *   **Cognitive Mechanism:** Holistic Pattern Recognition / Gestalt Perception.
  *   **Learning Stage:** Unconscious Competence (Dreyfus Model: Expertise).
  *   **Distinction from Motor Skills:** It is Epistemic (about truth) rather than Procedural (about action), though both rely on subsidiary awareness.

  When you tell the resident "that one's fine," you are not withholding a rule; you are offering the output of a processing system that operates on a substrate deeper than language. The rule you construct afterwards is a map you are drawing of a territory you navigated without one. It is unsurprising the map doesn't match the terrain.
