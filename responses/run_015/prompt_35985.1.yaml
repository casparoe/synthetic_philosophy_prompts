prompt: |-
  Is there a name for this? I'm a radiologist, and at some point in training you stop being able to explain your reads. A resident shows me a scan, I say "that one's fine" before I've consciously looked for anything, and when they ask why it's fine there is geniunely nothing to tell them — not a forgotten rule, not a rule I'm too busy to state, I don't think there was ever a rule in my head to begin with. Sometimes I can construct a rule afterwards, but I don't trust it's what I was actually using, because the constructed version misclassifies cases I still call correctly. And it's not muscle memory — there's no motor component in telling whether a sentence in my second language is slightly off, and I get the same wordless certainty there. What convinces me this deserves a name, rather than just being "experience," is that it behaves like knowledge rather than a habit or a reflex: it can be wrong, it can be corrected, it generalizes to scans I've never seen, and two of us can disagree where one of us is actually right, not just reacting differently. So — is there an established concept for being reliably right about things without anything statable existing anywhere in you? If there are several near-miss concepts out there I want to know which one fits and where the edges are, e.g. whether a pianist's fingerings are the same kind of thing or something else entirely. A bare term won't do much for me.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User and the Query:**
      *   **User:** A radiologist (medical professional, high level of expertise).
      *   **Context:** Describes a phenomenon where they make accurate diagnostic judgments ("that one's fine") instantly, without conscious reasoning, and cannot articulate *why* afterwards. Post-hoc rationalization fails because the constructed rules don't match the actual performance (they misclassify cases the radiologist gets right).
      *   **Key Characteristics:**
          *   Fast, pre-conscious recognition.
          *   Ineffable (cannot be fully articulated).
          *   Reliable but fallible (can be wrong, can be corrected).
          *   Generalizes to new cases.
          *   Objective truth value (two experts can disagree, one is right).
          *   Distinct from muscle memory (no motor component).
          *   Distinct from simple "habit" (behaves like knowledge).
      *   **Goal:** Wants a specific name or established concept for this, not just "experience." Wants to distinguish it from similar concepts (like motor skills).

  2.  **Initial Brainstorming & Candidate Concepts:**
      *   *Intuition:* Too vague, often implies guessing.
      *   *Unconscious Competence:* Part of the "Four Stages of Competence." Fits well, but is it a "concept" or just a label?
      *   *Tacit Knowledge:* Michael Polanyi. "We know more than we can tell." This is the strongest philosophical fit.
      *   *Pattern Recognition:* Describes the mechanism, but maybe not the epistemological status.
      *   *System 1 Thinking:* Kahneman. Fast, automatic. But System 1 can be biased; the user emphasizes *reliability* and *correctability*.
      *   *Gestalt Perception:* Seeing the whole rather than parts. Relevant to radiology.
      *   *Expert Intuition / Professional Intuition:* Specific domain application.
      *   *Implicit Learning:* Learning without awareness of what was learned.
      *   *Non-propositional Knowledge:* Knowledge that isn't in the form of statements/rules.

  3.  **Evaluating the Best Fits:**

      *   **Tacit Knowledge (Polanyi):**
          *   *Pros:* Explicitly addresses "knowing more than we can tell." Distinguishes between focal awareness (the diagnosis) and subsidiary awareness (the features). Fits the "cannot articulate rules" aspect perfectly.
          *   *Cons:* Sometimes used broadly for skills (riding a bike), but Polanyi applied it to scientific discovery and diagnosis too.
          *   *Verdict:* Strong contender.

      *   **Unconscious Competence (Four Stages of Learning):**
          *   *Pros:* Describes the *state* of the learner/expert.
          *   *Cons:* A bit pop-psychology. Doesn't explain the *nature* of the knowledge, just the level of automation.
          *   *Verdict:* Good supporting term, but maybe not deep enough.

      *   **System 1 Thinking (Kahneman):**
          *   *Pros:* Describes the cognitive process (fast, automatic).
          *   *Cons:* Often associated with biases/heuristics. The user emphasizes the *accuracy* and *truth-value* of the judgment, which System 1 doesn't guarantee. However, expert System 1 is different from novice System 1.
          *   *Verdict:* Useful framework, but needs nuance (Expert Intuition).

      *   **Pattern Recognition / Gestalt:**
          *   *Pros:* Describes *how* it works visually.
          *   *Cons:* Doesn't capture the epistemological "knowledge without rules" aspect.
          *   *Verdict:* Mechanism, not the name of the knowledge itself.

      *   **Implicit Learning:**
          *   *Pros:* Learning without conscious awareness.
          *   *Cons:* Usually refers to the *acquisition* phase, not necessarily the *application* phase in expert decision making.
          *   *Verdict:* Related, but Tacit Knowledge is better for the *state* of knowing.

      *   **Recognition-Primed Decision (RPD) Model (Klein):**
          *   *Pros:* Specifically about experts making decisions in naturalistic settings (firefighters, doctors). Matches the "situation matching" without comparison of options.
          *   *Cons:* More about decision making than the nature of the knowledge itself.
          *   *Verdict:* Very strong practical fit for radiology.

  4.  **Synthesizing the Answer:**

      *   **Primary Term:** **Tacit Knowledge** (Michael Polanyi). This is the philosophical heavyweight champion for "knowledge that cannot be fully articulated."
      *   **Secondary Term (Cognitive Science):** **Expert Intuition** (within the framework of **System 1** thinking, but refined by Gary Klein's **Recognition-Primed Decision** model). This addresses the "reliability" and "generalization" aspects.
      *   **Tertiary Term (Learning Theory):** **Unconscious Competence**.
      *   **Distinction from Motor Skills:** Need to address the pianist question. Motor skills involve *procedural knowledge*. Radiology is *perceptual/cognitive*. Both are tacit, but one is motor, one is perceptual.
      *   **The "Why":** Explain *why* rules fail (the "frame problem" or infinite regress of rules). The brain uses high-dimensional pattern matching, not linear logic.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the precision of the description.* The user is very articulate about the phenomenology.
      *   *Introduce Polanyi.* "We know more than we can tell." This is the exact quote they need. Explain Focal vs. Subsidiary awareness. In radiology, the scan is the focal, the features are subsidiary. Looking *at* the features destroys the gestalt.
      *   *Introduce Klein/RPD.* This validates the "reliability" and "decision" aspect. It's not guessing; it's matching to a library of prototypes.
      *   *Address the "Rule Construction" failure.* This is crucial. Post-hoc rationalization creates "proxy rules" that are brittle. The actual processing is high-dimensional.
      *   *Address the Pianist.* Pianists have *procedural* tacit knowledge. Radiologists have *perceptual/epistemic* tacit knowledge. Both are unconscious, but one is "how to move," the other is "what is true."
