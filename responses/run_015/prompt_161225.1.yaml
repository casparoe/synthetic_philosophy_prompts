prompt: |-
  I am a PhD student in machine learning, working on interpretability, and for two terms I am embedded with the evaluation team at a lab that ships a vision-and-language model into regulated settings — clinical triage support and insurance claims handling. Part of my job is to help the team write the feature descriptions that go into our model cards and safety cases: statements of the form "direction 14.882 in layer 22 represents X". Those statements are read and signed off by a governance lead with a clinical background, and in two or three disputes a month they are the crux of the disagreement: one engineer reads a feature off its causal profile (what it responds to, what happens to behaviour when it is ablated or clamped), another reads it off training history (what it was ever useful for, at which stage, under which objective). The engineers have no philosophy training, they have roughly half a day per feature, and the documents they produce have to survive external review. So what I need is a written protocol, not a discussion.

  Please write that protocol: a decision procedure the team can run on a candidate feature description, in a fixed order, using only artefacts we actually have — training logs, checkpoints saved at intervals, per-example loss attributions, ablation and clamping results, the data mix, the loss, and the fine-tuning schedule. Ground it in the teleosemantic, selected-effects tradition (Millikan, Papineau, Neander): the content of a representation is fixed by what it has the proper function of indicating, where that function is fixed by a history of selection rather than by the representation's current causal or dispositional profile. The whole difficulty is in the translation, so please keep what the theory actually says while making each step checkable by someone who has never heard of it, and say plainly where a step is a judgement call dressed up as a check.

  Specific requirements:

  - For each step, state what counts as a sufficient answer and what counts as no answer at all. Where a step needs something the team cannot obtain (a counterfactual retrain, a lineage of checkpoints we did not save), say so and say what to do instead.
  - Mark the points at which the procedure returns "no content ascription is licensed here" and stops, and the points at which it hands the remainder to a named person because the residual question is a decision about how fine-grained or how revision-tolerant our descriptions should be, not a fact about the model.
  - Handle explicitly: (a) representations that were never causally recruited — bystanders that track what the network was rewarded for without ever driving it; (b) polysemantic directions, i.e. single directions carrying several apparently unrelated sensitivities; (c) features that first appear during a short fine-tuning stage, and features that survive fine-tuning unchanged; (d) inputs off the training distribution, including adversarial ones — that is, what a Millikan-style notion of Normal conditions should mean for an artefact whose environment is a data pipeline; (e) the standing worry that gradient descent on a next-token or contrastive objective is not selection in the relevant sense, so that nothing in the model has a proper function and every ascription fails — say what the procedure does with that worry rather than leaving it in a footnote; (f) the fact that the team does not really want a historical claim at all. What the governance lead needs is forward-looking: can we rely on this direction to mean X when we monitor it at deployment? Separate that reliability question from the content question in the procedure itself, and say what to do when they come apart.
  - The procedure proper should fit on two printed pages; the applications below can be as long as they need to be.

  Then run it on three cases:

  1. A direction in the image encoder that fires reliably on photographs of dogs and on dog-like textures in rendered scenes, whose clamping degrades dog/non-dog classification and nothing else, and which the whole team wants to call a dog detector.
  2. A direction that appears only after a short fine-tuning stage on a narrow task, which under probing still separates the pretraining property perfectly, but whose ablation now affects only the fine-tuning task.
  3. A scalar feature in the language model's residual stream that tracks a property the team cares about a great deal, which predicts a downstream refusal decision almost perfectly, but which never contributed to the loss during training because it was a bystander to a feature that did.

  I expect the procedure to answer (3) in a way I will not like; say what it says and say why I will not like it. Close with a short section on what the protocol cannot deliver — what a team reading its outputs should still not conclude.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** PhD student in ML interpretability, embedded with an evaluation team in a regulated setting (clinical/insurance).
      *   **Task:** Write a written protocol (decision procedure) for ascribing content to model features (e.g., "direction 14.882 in layer 22 represents X") based on teleosemantics (Millikan, Papineau, Neander).
      *   **Audience:** Engineers (no philosophy training, ~0.5 day/feature) and a Governance Lead (clinical background, signs off).
      *   **Constraints:**
          *   Must use available artifacts (logs, checkpoints, loss attributions, ablations, data mix, etc.).
          *   Must be grounded in *selected-effects* teleosemantics (content = proper function fixed by history of selection).
          *   Must distinguish between *content ascription* (historical) and *reliability* (forward-looking).
          *   Must handle specific edge cases (bystanders, polysemanticity, fine-tuning, OOD/adversarial, GD vs. Selection worry).
          *   Must identify "judgement calls dressed up as checks."
          *   Must fit on ~2 printed pages (for the protocol itself).
          *   Must apply the protocol to 3 specific cases.
          *   Must explain why the user (PhD student) won't like the answer for Case 3.
          *   Must conclude with limitations.

  2.  **Theoretical Grounding (Teleosemantics/Selected-Effects):**

      *   *Core Idea:* A representation $R$ has content $C$ if $R$ has the *proper function* of indicating $C$.
      *   *Proper Function:* The function for which the trait was *selected*. In biology, this is reproduction/survival. In ML, this is minimizing loss/improving performance during training.
      *   *Normal Conditions:* The conditions under which the selection history operated.
      *   *Key Distinction:* Current causal role $\neq$ Content. A feature might currently correlate with $X$ but was selected for $Y$. Or it might correlate with $X$ but never contributed to loss (bystander).
      *   *The "GD vs. Selection" Worry:* Gradient descent isn't natural selection. The protocol needs to operationalize "selection" as "gradient updates that retained/ strengthened the feature because it reduced loss."

  3.  **Drafting the Protocol (Iterative Process):**

      *   *Goal:* Make it actionable for engineers.
      *   *Structure:* Step-by-step decision tree.
      *   *Step 1: Existence & Stability.* Does the feature exist across checkpoints? (Filters out noise).
      *   *Step 2: Causal Contribution (The Selection Criterion).* Did this feature *cause* loss reduction? This is the hard part. We need to look at training dynamics. If ablating it *during training* would have increased loss, it was selected. Since we can't retrain, we look at gradient magnitudes or loss attribution over time.
      *   *Step 3: Content Determination.* What property did it track *when* it was contributing to loss?
      *   *Step 4: Normal Conditions.* Under what data distribution was this selection valid?
      *   *Step 5: Reliability vs. Content.* Separate the "what is it" from "can we trust it now."
      *   *Constraint Check:* Needs to fit on 2 pages. Needs to mark "Stop" points and "Handoff" points.

      *   *Refining the "Selection" Operationalization:* Engineers can't retrain. They have checkpoints and loss attributions.
          *   *Check:* Did the feature's magnitude correlate with loss reduction epochs?
          *   *Check:* Do per-example loss attributions show this feature reducing loss on specific data types?
          *   *Philosophy Translation:* "Selected for" $\rightarrow$ "Gradient updates reinforced this direction because it lowered loss on specific data subsets."

      *   *Handling the "Bystander" Problem:* If a feature tracks $X$ but loss attribution shows it didn't contribute to loss reduction (another feature did the work), teleosemantics says it has *no content* regarding $X$, even if it correlates. It's a free-rider.

      *   *Handling the "GD vs. Selection" Worry:* Address this upfront as a "Presupposition." If the team rejects GD as selection, the protocol fails. We assume GD *counts* as selection for the sake of the procedure.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Dog Detector):* Standard case. Fires on dogs, ablation hurts dog classification, history shows selection on dog images.
          *   *Protocol Outcome:* Content = Dog. Reliability = High (if deployment matches training).
      *   *Case 2 (Fine-tuning Ghost):* Appears/Strengthens in FT. Tracks pretraining property but only affects FT task.
          *   *Protocol Outcome:* Content depends on *which* loss reduction drove it. If it was there in PT but inactive, then activated in FT for a *different* task, the content might be the FT task property, not the PT property, even if the vector direction is the same. Teleosemantics is tricky here. If it was *selected* in PT, content is PT property. If *re-selected* in FT, content might be FT property. The protocol needs to decide priority. Usually, the *most recent* selection for the *current* objective dominates proper function in artefacts.
      *   *Case 3 (The Bystander):* Tracks property perfectly, predicts refusal, but *never contributed to loss*.
          *   *Protocol Outcome:* **No Content Ascription.** Teleosemantics is strict. If it didn't do the work, it has no proper function.
          *   *Why the user won't like it:* It's practically useful (predicts refusal) but theoretically empty. Governance wants to monitor it. The protocol says "You can't call it 'Refusal Reason' in a model card." This creates tension between safety monitoring and truthful documentation.

  5.  **Refining the Protocol Text (for length and clarity):**

      *   Use bold headers.
      *   Use "STOP" and "HANDOFF" markers.
      *   Keep language imperative.
      *   Ensure the "Judgement Call" warnings are explicit.

  6.  **Addressing Specific Requirements:**

      *   *Bystanders:* Explicitly handled in Step 2 (Causal Contribution).
      *   *Polysemanticity:* Handled in Step 3 (Content Determination) - if multiple properties drove selection, content is disjunctive or undefined.
      *   *Fine-tuning:* Handled in Step 1 (Lineage).
      *   *OOD/Normal Conditions:* Handled in Step 4.
      *   *GD vs. Selection:* Handled in Preamble.
      *   *Reliability vs. Content:* Handled in Step 5.

  7.  **Final Review against Constraints:**

      *   *Two pages?* Need to be concise.
      *   *Philosophy accurate?* Yes, focusing on *selected effects* (history) not *causal role* (current).
      *   *Engineer friendly?* Yes, mapping "proper function" to "loss attribution."
      *   *Case 3 explanation?* Must be clear why this is frustrating (utility vs. truth).

  8.  **Drafting the Content (Mental or Scratchpad):**

      *   *Preamble:* Define "Selection" as "Loss-reducing gradient updates."
      *   *Step 1:* Checkpoint Lineage. (Did it exist?)
      *   *Step 2:* Loss Attribution. (Did it do work?) -> *Crucial for Bystanders.*
      *   *Step 3:* Property Identification. (What data caused the work?)
      *   *Step 4:* Normal Conditions. (What data distribution?)
      *   *Step 5:* Reliability Handoff. (Will it work tomorrow?)

      *(Self-Correction during drafting)*: Make sure to emphasize that *current* correlation is not enough for content. That's the whole point of teleosemantics. Case 3 hinges on this.

      *(Refining Case 2)*: If it separates pretraining property perfectly but ablation only affects FT task... Teleosemantics asks: What was it *selected for*? If it existed in PT but didn't reduce loss (bystander in PT), then got selected in FT... its content is the FT property. If it was selected in PT *and* FT, it might be overdetermined. The prompt says "appears only after a short fine-tuning stage" but "under probing still separates the pretraining property perfectly." This implies the *direction* might have been latent or random, but became active in FT. If it *appears* in FT, its selection history is FT. Content = FT property.

      *(Refining Case 3)*: The prompt says "never contributed to the loss during training because it was a bystander." Teleosemantics says: No proper function = No content. The protocol must say "No content ascription licensed." The user won't like this because they want to document it for safety. The protocol forces a distinction: "Monitor this" $\neq$ "This represents X."

  9.  **Final Polish:** Check tone. Professional, rigorous, actionable. Ensure the "Judgement Call" boxes are visible.

      *(Word Count Check)*: The protocol needs to be dense to fit 2 pages. I will use a compact format. The analysis of cases can be longer.

      *(Philosophy Check)*: Millikan/Neander focus on *reproduction* of the trait. In NN, "reproduction" is the persistence of weights across updates. "Selection" is the gradient update that kept/increased the weight. If a weight persists but didn't help loss, it's drift or hitchhiking, not selection.

      *(Governance Lead Perspective)*: They need to know if they can trust the label. The protocol separates "Is this label true?" (Content) from "Will this label hold?" (Reliability). This is crucial.

      *(Let's write it.)*
answer: |-
  # PROTOCOL 7.4: TELEOSEMANTIC FEATURE ASCRIPTION (DRAFT)

  **Purpose:** To determine whether a candidate feature (direction/unit) licenses a semantic description (e.g., "represents X") for model cards and safety cases.
  **Grounding:** Selected-Effects Teleosemantics (Millikan, Papineau, Neander). Content is fixed by the *history of selection* (loss-reducing updates), not current causal role.
  **Prerequisites:** Checkpoint lineage, per-example loss attributions (integrated gradients/Trak), ablation logs, data mix metadata.
  **Presupposition:** We treat gradient descent steps that retain or amplify a feature *because* it reduced loss as "selection events." If the team rejects this equivalence, stop; no content ascriptions are possible.

  ---

  ### STEP 1: LINEAGE AND PERSISTENCE CHECK
  **Goal:** Establish the feature existed long enough to be selected, not merely noise.
  **Action:** Trace the feature's magnitude (or subspace alignment) across saved checkpoints from pretraining through fine-tuning (FT).
  *   **Pass:** Feature magnitude exceeds noise floor for $\ge$ 2 consecutive stages (e.g., late pretraining + FT, or early + late FT).
  *   **Fail:** Feature appears only in a single checkpoint or fluctuates randomly.
  *   **STOP:** If **Fail**, output: *"No content ascription licensed (Transient Artifact)."*
  *   **Judgement Call:** Defining "noise floor." Use the team's standard deviation threshold for activation magnitude.

  ### STEP 2: CAUSAL CONTRIBUTION (THE SELECTION CRITERION)
  **Goal:** Determine if the feature was *selected for* (contributed to loss reduction) or is a *bystander* (correlates but did no work).
  **Action:** Review per-example loss attributions for the epochs where the feature grew in magnitude.
  *   **Query:** Did examples where this feature fired show higher loss attribution to this feature *and* did the feature's growth correlate with loss decrease on those examples?
  *   **Pass:** Evidence shows the feature actively reduced loss on a specific data subset during growth phases.
  *   **Fail:** Feature correlates with low loss, but attributions show other features did the work (feature is a "hitchhiker").
  *   **STOP:** If **Fail**, output: *"No content ascription licensed (Bystander/Free-Rider)."* (See Case 3).
  *   **Judgement Call:** Attribution methods are approximate. If attributions are noisy, mark "Low Confidence" but proceed if trend is clear.

  ### STEP 3: CONTENT DETERMINATION (THE PROPERTY)
  **Goal:** Identify *what* property the feature indicated when it was doing the work (Step 2).
  **Action:** Cluster the training examples from Step 2 where the feature contributed to loss reduction. Identify the common semantic property $P$.
  *   **Polysemanticity Check:** If the cluster splits into two semantically distinct groups (e.g., "dog images" and "text about insurance") both driving loss reduction:
      *   **Action:** Mark as **Disjunctive Content** ("Represents Dog OR Insurance-Text").
      *   **HANDOFF:** If the disjunction is too broad for governance (e.g., "Visual Pattern OR Token ID"), hand to **Safety Lead** for granularity decision. This is not a fact check; it is a risk tolerance decision.
  *   **Fine-Tuning Conflict:** If feature was selected in Pretraining for $P_1$ but re-selected in FT for $P_2$:
      *   **Rule:** The *most recent* selection for the *current* objective determines proper function for deployment. Content = $P_2$.
  *   **Output:** Draft description: "Represents $P$."

  ### STEP 4: NORMAL CONDITIONS (THE DOMAIN)
  **Goal:** Define the conditions under which the content ascription is valid (Millikan's "Normal Conditions").
  **Action:** Characterize the data distribution from Step 2.
  *   **Query:** What was the input distribution when selection occurred? (e.g., "Natural photographs," "Clinical notes," "Synthetic renders").
  *   **Constraint:** Content ascription is only valid within these conditions.
  *   **OOD/Adversarial:** If deployment inputs differ significantly from Step 2 distribution, the feature may misfire. This does not change the *content*, but it breaks the *truth condition*.
  *   **Output:** Domain constraint: "Valid for inputs resembling [Distribution D]."

  ### STEP 5: RELIABILITY HANDOFF (SEPARATION OF CONCERNS)
  **Goal:** Distinguish *what it is* (Content) from *can we trust it* (Reliability).
  **Action:** Compare Step 4 (Normal Conditions) with Deployment Environment.
  *   **If Match:** Content ascription stands.
  *   **If Mismatch:** Content ascription stands (historically true), but reliability is compromised.
  *   **HANDOFF:** Pass the draft description and the Domain Constraint to the **Governance Lead**.
      *   **Note to Lead:** This protocol certifies the *meaning* of the feature, not its *future accuracy*. A feature can "represent Tumour" (true content) but be unreliable on MRI scans if trained on X-rays (failed reliability). Your sign-off is on the *risk of relying on this meaning*, not the *truth of the meaning*.

  ---
  *End of Protocol. If Step 2 returns "Fail," do not write a feature description. Document the feature as "Unexplained Correlate."*

  ***

  # APPLICATION TO CASES

  ### Case 1: The Dog Detector
  **Scenario:** Direction fires on dogs/dog-textures. Clamping degrades dog classification. History shows selection on dog images.
  **Protocol Run:**
  1.  **Lineage:** Stable across late pretraining and FT. **(Pass)**
  2.  **Contribution:** Loss attributions show high contribution on dog images during epochs where dog-accuracy improved. **(Pass)**
  3.  **Content:** Cluster analysis confirms "Canis lupus familiaris" visual features. **(Content = Dog)**
  4.  **Normal Conditions:** Natural images and high-fidelity renders present in training.
  5.  **Reliability:** Deployment matches training distribution.
  **Result:** **Licensed.** Description: "Represents presence of canine visual features."
  **Comment:** This is the "happy path" for teleosemantics. Causal role and selection history align.

  ### Case 2: The Fine-Tuning Ghost
  **Scenario:** Direction appears/strengthens in FT. Probing shows it separates a *pretraining* property (e.g., "sentiment"), but ablation only affects the *FT task* (e.g., "claim approval").
  **Protocol Run:**
  1.  **Lineage:** Magnitude negligible in pretraining, spikes in FT. **(Pass)**
  2.  **Contribution:** Loss attributions in pretraining show near-zero contribution (it was dormant). Loss attributions in FT show high contribution on claim approval tasks. **(Pass - FT Selection)**
  3.  **Content:** Although it *correlates* with pretraining sentiment (perhaps due to weight inheritance or geometric coincidence), the *selection event* that gave it magnitude and functional role occurred during FT on claim data.
      *   *Teleosemantic Ruling:* Proper function is fixed by the selection that established the trait's current prevalence. The pretraining correlation is historical baggage, not proper function.
      *   **Content = Claim Approval Signals** (not Sentiment).
  4.  **Normal Conditions:** FT data distribution (claims).
  5.  **Reliability:** Handoff to Governance.
  **Result:** **Licensed (with correction).** Description: "Represents claim approval criteria." *Do not label as "Sentiment Detector".*
  **Comment:** Engineers often want to label based on probing (current causal profile). Teleosemantics forces the label to match the *objective* that recruited the feature. If the FT objective repurposed a dormant direction, its content is the FT objective.

  ### Case 3: The Bystander (The Refusal Scalar)
  **Scenario:** Scalar tracks "Refusal" perfectly. Predicts downstream refusal decision. **Never contributed to loss** (another feature did the work; this one just correlated).
  **Protocol Run:**
  1.  **Lineage:** Stable. **(Pass)**
  2.  **Contribution:** Loss attributions show this feature had near-zero gradient contribution. Other features in the same layer reduced the loss; this feature "rode along" due to correlation in the data or weight decay dynamics.
      *   **Protocol Decision:** **FAIL.**
      *   **Reasoning:** Under selected-effects theory, a trait that does not contribute to the reproductive success (loss reduction) of the system has no *proper function*. It is a spandrel or a hitchhiker. It has causal power *now* (perhaps via downstream readout), but it was not *selected for* indicating Refusal.
  3.  **Content:** **No content ascription licensed.**
  4.  **Reliability:** High predictive power.
  **Result:** **BLOCKED.** You cannot write "This feature represents Refusal Intent" in the model card.
  **Action:** Document as "Monitoring Hook: Correlates with Refusal." Do not ascribe semantic content.

  #### Why you (the PhD student) will not like this answer:
  You work in safety. You want to monitor this feature because it *works*. It predicts refusal perfectly. The Governance Lead wants to know if they can trust it.
  *   **The Conflict:** The protocol tells the truth about *meaning*, but it handicaps your *safety case*. If you cannot call it "Refusal Intent," you cannot claim the model has an interpretable refusal mechanism. You have to admit the refusal mechanism is opaque, and this feature is just a convenient shadow.
  *   **The Risk:** If the correlation breaks (Goodhart's Law), and you have documented it as "Represents Refusal," you have lied about the model's architecture. If you document it as "Bystander Correlate," you are safe from external review, but you lose the rhetorical power of claiming interpretability. Teleosemantics protects you from over-claiming, but it denies you the comfort of calling a reliable predictor a "representation."

  ***

  # LIMITATIONS: WHAT THIS PROTOCOL CANNOT DELIVER

  1.  **It does not guarantee future stability.** A feature can have a valid teleosemantic content ("Represents X") based on history, but fail to indicate X tomorrow due to distribution shift. Step 5 hands this risk to the Governance Lead; the protocol itself cannot solve it.
  2.  **It cannot resolve "Selection" ambiguity in Deep Nets.** Gradient descent is not natural selection. Multiple features can co-adapt. If Feature A and Feature B both reduce loss, but only A gets the gradient credit due to optimization dynamics, Protocol 7.4 calls A the "representor" and B the "bystander." This is an artefact of the optimizer, not necessarily ground truth about the computation. We treat the optimizer's choice as the "selection pressure" for pragmatic reasons, but this is a known philosophical weakness.
  3.  **It forbids useful fictions.** As seen in Case 3, highly reliable features may be denied content status. Teams accustomed to "probing = meaning" will find this restrictive. It prioritizes *truthful documentation* over *useful abstraction*.
  4.  **It assumes Checkpoint Fidelity.** If the team did not save checkpoints at the precise moment a feature was recruited (e.g., a sudden phase transition between saved steps), Step 2 may yield false negatives. The protocol instructs to interpolate, but this is a guess.

  **Final Instruction:** When in doubt, deny the content ascription. A model card that says "We do not know what this feature does" is safer than one that says "This feature represents X" when X is historically unsupported.
