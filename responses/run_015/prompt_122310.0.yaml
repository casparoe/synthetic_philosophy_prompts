answer: |-
  Based on the track record you provided, your friend is operating with a **Critical Realist** framework. She distinguishes sharply between *mind-independent physical realities* (which are discovered) and *mind-dependent institutional facts* (which are invented).

  Here are the three rules that best fit her history, how they apply to the Anthropocene, and my prediction on her verdict.

  ### The 3 Rules

  **1. The Physical Tracking Principle**
  If a category tracks a mind-independent physical property or "essence" (e.g., orbital clearing, genetic clustering, stratigraphic isotopes), the *kind* is real, even if the specific boundary definitions are conventional.
  *   **Applied to Anthropocene:** The plastic and isotopes are physical facts. The stratigraphic layer exists regardless of what we name it.
  *   **Verdict:** **Not Constructed.**

  **2. The Institutional Status Principle**
  If a category confers a status, right, or role that only exists within a human system of agreement (e.g., currency value, legal spouse, "child" status), it is constructed, even if it correlates with biological facts.
  *   **Applied to Anthropocene:** "Geological Epoch" is a formal classification voted on by a commission (ICS). Without geologists to define it, the "Anthropocene" doesn't exist as a unit of time.
  *   **Verdict:** **Constructed.**

  **3. The Essence vs. Cluster Principle**
  If a category groups things that lack a unified biological or physical essence (e.g., "race" groups people with vastly different genetics based on skin color), it is constructed. If the category maps onto a distinct natural cluster (e.g., wolves vs. dogs), it is real.
  *   **Applied to Anthropocene:** The Anthropocene tracks a specific, unified physical signal (human stratigraphic impact). It is not a fuzzy cluster of unrelated social traits.
  *   **Verdict:** **Not Constructed.**

  ### Which rule is she actually using?

  **Prediction:** She will say the Anthropocene is **NOT socially constructed** (though she may admit the *name* or *start date* is conventional).

  **Why:** The **Planet** example is the "smoking gun" here. It is the closest analog to the Anthropocene case.
  *   **Planet:** A committee (IAU) drew a line, but she insists the *kind* is real because it tracks "orbital clearing."
  *   **Anthropocene:** A committee (ICS) is drawing a line, but it tracks "stratigraphic signals."

  In both cases, there is a scientific committee making a conventional decision, but in both cases, there is a hard physical property being tracked. Since she prioritized the *physical property* over the *committee decision* for planets, she will likely do the same for geology. She will view the plastic layer as a mind-independent fact (like orbital clearing), distinguishing it from Race (no biological essence) or Money (pure status function).

  ### The Splitting Case

  To test if this prediction is correct, ask her this:

  **"Is the 'K-T Boundary' (the geological layer marking the dinosaur extinction) a socially constructed kind?"**

  *   **Why this splits them:** The K-T Boundary is structurally identical to the Anthropocene (a global stratigraphic layer defined by a specific chemical signal, iridium). The *only* difference is that the K-T Boundary was caused by an asteroid, not humans.
  *   **If she says "Not Constructed":** She is consistent with the **Physical Tracking Principle**. The human cause of the Anthropocene doesn't make it social; the physical layer makes it real. (This supports my prediction).
  *   **If she says "Constructed":** She is secretly using a **Human Agency Rule**. She might believe that because the Anthropocene is defined by *human* activity, it falls under "social facts" (like money or marriage) rather than "natural facts" (like wolves or asteroids), regardless of the physical strata.

  ### Confidence & Uncertainty

  **Confidence Level:** **80%**

  **Least Certain Part:** The **"Human Cause" Variable**.
  I am least sure about how she weighs the *origin* of the phenomenon versus the *physicality* of the phenomenon.
  *   **Risk:** She might argue that because the "signal" (plastic, fallout) is the result of *social* human activity, the layer itself is a "social fact" solidified into rock. This would align the Anthropocene with **Money** (human agreement creating a reality) rather than **Planets** (human observation of a reality). If she views human industry as a "social force," she might categorize the *result* of that force as socially constructed, even if it's physical. However, given her distinction on Childhood (maturation is real, the category is constructed), she usually separates the physical process from the social label, which is why I lean toward her calling it "Real."
