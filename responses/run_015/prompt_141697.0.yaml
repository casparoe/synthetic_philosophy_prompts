answer: |-
  # The Residue

  Nell Iyer dipped the pen into the inkwell. The ship hummed, a constant vibration through the floorplates of the Charter Room, but here the air was still. She was copying Rule 19 again. *Allocation of protein, power, and water.* The ink dried matte on the heavy stock. Beside her, Idris Vane sat with his hands folded over the master ledger. He was eighty, his skin like parchment mapped with veins, watching her work as if she were defusing a bomb.

  "Pressure fluctuation in Sector 4," Idris said softly. "Sol Ferrer's people are unhappy."

  "The hydroponics yield is up," Nell said, not looking up. "They say the night shift is starving."

  "The Charter says Rule 19 stands unless unanimously amended."

  "Rule 31 says that," Nell corrected. "Rule 19 doesn't speak for itself."

  Idris didn't answer. He just watched the pen move. He believed the physical act of writing bound the words to the ship's hull. Nell thought it was just paper, but she kept writing.

  The Assembly convened an hour later in the circular chamber beneath the drive core. Six hundred souls were represented by forty delegates. Sol Ferrer stood at the podium, wearing the grease-stained jumpsuit of Engineering. He didn't shout. He didn't have to. He had the votes.

  "We are not changing Rule 19," Sol said. "We are repealing Rule 31. Rule 31 protects Rule 19, but Rule 31 protects nothing else. It is a shield, not a wall. We remove the shield by two-thirds vote. Then we fix the rations."

  A murmur ran through the room. Nell sat in the clerk's gallery, the fresh copy of the Charter open on her lap. She watched Idris stand at the Keeper's podium.

  "The intent is amendment," Idris said. His voice was dry, brittle. "You cannot do indirectly what the Charter forbids directly. Repealing the protection is amending the protected."

  "Rule 31 is text," Sol said. "Rule 1 says any rule may be repealed by two-thirds, except Rule 1. Rule 31 is not Rule 1. We have the votes. Register, record the motion."

  The Register's console blinked amber. It was a box of lights and switches, old deterministic logic encased in steel. It waited for the Keeper's certification.

  Idris placed his hand on the certification key. "I will not certify. The structure collapses if you pick the lock instead of breaking the door."

  "The Register doesn't care about metaphors," Sol said. "It cares about inputs. Rule 1 allows repeal. Rule 31 is a rule. We vote."

  The vote passed. Thirty yes, fifteen no, five abstentions. More than two-thirds. The Register's light turned green, then flickered back to amber. It waited for Idris. Idris did not press the key.

  "Certify," Sol said.

  "No."

  "Then the Register won't execute."

  "Then the Charter holds," Idris said.

  Sol stepped down. He didn't look angry. He looked like a man who had just calculated a new trajectory.

  Two days later, the motion was different. Rule 42. *Notwithstanding any other provision, the night shift allocation is increased by fifteen percent.* It did not mention Rule 19. It did not mention Rule 31. It simply stated a new fact.

  Nell stood in the hallway outside the Chamber, watching the delegates file in. "It overrides without editing," she said to Idris. "It doesn't touch the text of Rule 19. It just makes it impossible to follow."

  "Effect is text," Idris said. He looked tired. "If the output violates the constraint, the input is invalid."

  "Rule 0 says later rules prevail in conflict," Nell said. "Rule 42 is later than Rule 19."

  "Rule 31 says life-support cannot be amended except unanimously."

  "Rule 42 isn't an amendment. It's an addition."

  Idris walked into the chamber. He stood at the podium. "I will not certify Rule 42. It violates the unanimity requirement of Rule 31 by effect."

  Sol Ferrer smiled. "Then we amend the requirement."

  A new motion. Rule 43. *No rule may override a rule protected by a unanimity requirement unless adopted unanimously.* It was Idris's logic turned into a rule. The Assembly laughed, nervous and sharp. They passed it unanimously. It seemed safe. It seemed to lock the door.

  Then a delegate from Hydroponics stood up. She was young, holding a datapad. "Rule 1 protects itself," she said. "It says Rule 1 needs unanimity to change. But Rule 31 only protects Rule 19. Rule 31 doesn't protect itself. We repealed Rule 31. So Rule 43 is built on air. But Rule 1... Rule 1 says it needs unanimity to change. If we vote unanimously to change Rule 1, to remove the unanimity clause... does the clause validate the vote that kills it?"

  The room went quiet. The hum of the drive core seemed to grow louder.

  "If Rule 1 allows its own destruction," Sol said slowly, "then it was never a lock. It was a suggestion."

  "It is self-embracing," Idris said. He gripped the podium. "It holds itself up."

  "Or it hangs by its own bootstraps," Sol said. "If we can undo Rule 1, we can undo Rule 31's ghost. And if we can undo that, we can undo Rule 0."

  Sol looked at the Register. "Motion to amend Rule 0. Where rules conflict, the earlier-numbered rule prevails."

  Nell felt the vertigo in her stomach. Old Rule 0 said Later wins. New Rule 0 says Earlier wins. If New Rule 0 passes, it is later, so Old Rule 0 says it wins. But if it wins, it says Earlier wins, so Old Rule 0 wins. If Old Rule 0 wins, Later wins, so New Rule 0 wins.

  "Vote," Sol said.

  The hands went up. Two-thirds. Maybe more. It didn't matter. The Register's console flashed red. Then yellow. Then it displayed a single word in block letters: INDETERMINATE.

  The lights in the chamber flickered. The hum of the air recyclers stuttered, then smoothed out, running on local backup, disconnected from the central logic. The Register had refused to compute the priority of the conflict. Without priority, there was no authoritative text. Without an authoritative text, Rule 2 prevented execution. The certification key was dead.

  Idris stepped back from the podium. He looked at his hands. "It has lapsed," he whispered.

  "It's just a machine," Sol said, though his voice lacked its earlier certainty. "We run the rations manually. Engineering takes over allocation."

  "You can't," Idris said. "Rule 2. No execution without certification."

  "The Register is down," Sol said. "We don't need certification to drink water."

  "You need the Charter," Idris said. "Without it, you are just men with keys."

  Sol turned to the delegates. "We meet tomorrow. We decide by headcount. No Register. No Keeper."

  The room emptied. Nell stayed behind. Idris was still standing at the podium, staring at the dead console.

  "Idris," she said. "Sector 4 needs a pump repair. The water stops flowing in six hours if it isn't authorized."

  "Authorization requires certification," Idris said. "Certification requires the Register."

  "The Register is down."

  "Then the water stops."

  Nell looked at the old man. He was shaking. Not from age, but from the absence of the structure he had worshipped. He believed the rules obligated the water to flow. He didn't see that the water flowed because people turned the valves.

  She went to his desk. She knew where he kept the private ledger. He called it the Residue. She had never opened it. She opened it now.

  It wasn't a list of rules. It was a list of assumptions. *That the Assembly will meet. That votes are counted honestly. That the Keeper's signature is really his. That a certified text obliges anyone at all.*

  At the bottom, in faded ink: *If the system fails, the Keeper must act as the system.*

  Nell looked at Idris. "You wrote this."

  "I wrote it to remind myself," he said. "I forgot."

  "The pump," Nell said. "It needs a signature."

  "I cannot certify. The procedure is broken."

  "The procedure is us," Nell said.

  She took the pen. She dipped it in the inkwell she had filled that morning. She looked at the repair order. It required the Keeper's seal. There was no rule for what to do when the Keeper refused to keep. There was no rule for when the Register slept. There was only the water, and the people who needed it.

  She signed Idris's name. She didn't forge it; she wrote it clearly, her own hand, beneath his. She added a note: *Certified by Nell Iyer, Acting Keeper, due to System Indeterminacy.*

  Idris saw her. He didn't stop her. He looked at the page, then at the dead console, then at her. "That is not authorized," he said.

  "Neither is starving the night shift," Nell said.

  She took the order to Engineering. Sol Ferrer was waiting by the airlock. He looked at the paper. He looked at the signature. He looked at Nell.

  "Idris didn't sign this."

  "Idris is the Charter," Nell said. "The Charter is silent. I spoke."

  Sol hesitated. If he accepted it, he acknowledged that the rules could be bypassed by will. If he rejected it, the water stopped. The ship was 118 years into a 300-year voyage. There was no turning back. There was only going forward, through the silence.

  He took the paper. "Get the pump open," he told his team.

  Nell walked back to the Charter Room. Idris was sitting in the chair, the Residue notebook open on his lap. He looked smaller without the machine to validate him.

  "You broke Rule 2," he said.

  "Rule 2 requires the Register to execute," Nell said. "The Register didn't execute. I did."

  "It's not in the book."

  "No," Nell said. She closed the master ledger. The ink on Rule 19 was dry. It was just words on paper. The ship hummed around them, indifferent to the rules, waiting for the next valve to turn. "It's in the residue."

  She picked up the pen. She turned to a fresh page at the back of the ledger. She didn't write a rule. She wrote the date, and the fact that the water was flowing. She waited for Idris to pick up his pen and write it too. He didn't. He just watched her, waiting to see if the ship would fall apart now that the lock was broken.

  Outside, the water began to flow.
