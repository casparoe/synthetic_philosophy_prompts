  **UNDECIDABLE SYSTEMS LTD.**
  **FORMAL VERIFICATION FOR POST-AXIOMATIC INSTITUTIONS**

  **IS YOUR POLICY MANUAL COMPLETE?**

  Your organisation operates on a set of rules. Whether encoded in statutes, HR handbooks, or smart contracts, these rules constitute a formal theory. If your theory is sufficiently expressive and recursively axiomatised, it is subject to Gödel's First Incompleteness Theorem. There are truths within your operational framework that your framework cannot derive. Undecidable Systems Ltd. identifies these gaps before your adversaries do.

  **ELIGIBILITY AND PREPARATION**

  To qualify for a Gödel Audit, your rulebook must be computably enumerable. Unwritten norms, case-by-case discretion, and oral traditions void the warranty. Our engineers will first formalise your policies into a recursive set of axioms.

  Furthermore, the theorem only applies to theories capable of encoding Robinson Arithmetic. Many institutional frameworks (e.g., linear scheduling, simple resource allocation) are interpretable in Presburger Arithmetic, which is decidable and complete. This is a vulnerability. We offer an **Arithmetic Injection Module**, installing multiplication operators into your governance structure to ensure sufficient expressive strength. Once your system can encode number theory, it becomes incomplete. This is when we can help.

  **THE DELIVERABLE**

  We construct the Gödel sentence $G_T$ bespoke to your theory $T$. This sentence is undecidable within $T$. While $G_T$ is syntactically a claim about natural numbers, it encodes the consistency of your own rulebook. It contains no semantic content regarding your mission statement, but it is true.

  How do we know it is true? You cannot prove consistency from within $T$ (Second Incompleteness Theorem). However, our consultants operate in a stronger meta-theory. We verify the consistency of your axioms externally and thereby establish the truth of $G_T$. You receive a certified true sentence that your own system cannot assert.

  **CONTINUOUS COMPLIANCE**

  Closing the gap is straightforward: adopt $G_T$ as a new axiom. However, this creates a new theory $T' = T + G_T$. $T'$ has its own Gödel sentence $G_{T'}$. Our engagement model accounts for this infinite regress. We do not sell fixes; we sell oversight. Our retainer ensures that as your theory expands, our findings expand with it. A terminating engagement would imply your system is decidable, which would indicate a failure of our Arithmetic Injection.

  **PRICING TIERS**

  | Tier | Service | Cost |
  | :--- | :--- | :--- |
  | **Bronze** | Formalisation & CE Check | £50k / quarter |
  | **Silver** | Audit + One Gödel Sentence | £150k / quarter |
  | **Gold** | Perpetual Axiomatisation | £500k / quarter |

  *All tiers require a minimum 5-year commitment to accommodate non-termination.*

  **FAQ**

  **Q: Does the sentence tell us how to improve operations?**
  A: No. It is a $\Pi_1$ arithmetic statement. Its utility is ontological, not operational.

  **Q: Can you guarantee consistency?**
  A: We guarantee consistency relative to our meta-theory. If our meta-theory is inconsistent, all bets are off.

  **Q: Why not just use a weaker system?**
  A: Weak systems cannot model your liability. You need multiplication.

  **UNDECIDABLE SYSTEMS LTD.**
  *Because consistency is a service.*

  ***

  **TECHNICAL NOTE**

  The brochure treats the firm's ability to verify consistency as a service capability, which is the primary liberty. Technically, if the firm is mechanical, it is also subject to incompleteness; if it relies on "human insight," it leans on a contested notion of meta-theoretic privilege. I am confident in the rest: the requirement for Robinson Arithmetic (vs. Presburger), the necessity of recursive enumerability, and the bespoke nature of $G_T$.

  Regarding your confidence check: you are correct that for the standard Gödel sentence (a $\Pi_1$ statement asserting its own unprovability), simple consistency of $T$ suffices for its truth in the standard model $\mathbb{N}$. If $T$ is consistent, no proof exists, so the universal claim holds in $\mathbb{N}$. The shaky step is not the implication (Consistency $\rightarrow$ Truth), but the firm's claim to *know* consistency holds. I preserved this distinction: the sentence is true if consistent, but the firm sells the certification of consistency itself. The only other liberty is implying $G_T$ is "useful"; in reality, it is arithmetically true but organisationally inert.
