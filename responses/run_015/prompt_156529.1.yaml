answer: |-
  This is a really sharp argument. You've basically reconstructed a version of the "epistemic condition" on moral responsibility and then correctly identified that your formulation leads to moral inflation (where everyone is always guilty).

  Here is the diagnosis: **Step 2 is the broken step.**

  Specifically, the break is in how you define **"available."**

  ### 1. Why Step 2 looked fine when you wrote it
  It appealed to a very strong intuition: **Ignorance is only an excuse if the truth was inaccessible.**
  You wanted to avoid the "Statistical Defense" (Step 1), where Jefferson gets off the hook just because 90% of Virginia owned slaves. You rightly sensed that Jefferson wasn't a random peasant; he was an Enlightenment intellectual who wrote "all men are created equal" while owning people. Your intuition was that *he specifically* had access to the moral counter-argument, so he shouldn't get the pass. Step 2 codifies that intuition perfectly. It feels like a "reasonable person" standard.

  ### 2. Why Step 2 breaks the argument (The Binary Trap)
  Step 2 treats the existence of dissent as a **binary switch**.
  *   *Is there a dissenter?* Yes → No MHOT defense.
  *   *Is there a dissenter?* No → MHOT defense granted.

  This creates the problem in Step 4. In any complex society, there is *always* a dissenter. There was always a Cassandra, a prophet, or a fringe sect. If the mere *existence* of a voice negates the defense, then MHOT becomes logically impossible for any society with free speech or internal diversity.

  It also creates the confusion in your Step 5. You write: *"makes MHOT never available, which collapses into the opposite absurdity where we can never criticise anyone from the past at all."*
  Actually, if MHOT is never available, you can **always** criticize everyone. The real absurdity isn't that you can't criticize; it's that **moral distinction collapses.** If Jefferson is blameworthy for slavery, and a poor illiterate peasant is blameworthy for slavery (because a Quaker pamphlet existed somewhere), and you are blameworthy for flying (because a climate activist exists), then moral judgment loses its granularity. It flattens history.

  ### 3. How to fix Step 2 (The Cost of Dropping It)
  You don't have to drop Step 2 entirely, but you must **qualify "available."** You need to move from *Existence* to **Reasonable Accessibility.**

  **The Modification:**
  Change Step 2 to: *MHOT only excuses when there was no **reasonably accessible** dissenter **given the agent's specific social position**, and where adopting the dissent did not impose **catastrophic costs**.*

  This introduces two variables you need to weigh:
  1.  **Epistemic Weight:** Was the dissenter a fringe lunatic or a credible voice? (e.g., A random heretic vs. the Church itself).
  2.  **Social Cost:** What happened to you if you listened? (e.g., Excommunication, economic ruin, death).

  **Applying the Fix:**
  *   **Jefferson:** He fails the new test. The dissent was intellectually accessible to him (he read the pamphlets), and while ending slavery would have cost him economically, he had the power to absorb that cost better than most. He is blameworthy.
  *   **The Virginia Peasant:** He might pass the new test. If he was illiterate, isolated, and economically dependent on the plantation system for survival, the dissent was not "reasonably accessible" or actionable. MHOT *does* work for him.
  *   **Us (Flying/Fossil Fuels):** We likely fail the test (like Jefferson). The science is mainstream, the dissent is institutional (UN, IPCC), and the cost of reduction is manageable for many (though not all). We are blameworthy.
  *   **The Exception:** MHOT now *does* work for some people today. For example, a worker in a region with no public transport, no EV infrastructure, and a job that requires travel might pass the MHOT test for carbon emissions. The dissent exists, but it isn't *actionable* for them.

  **The Cost:**
  Dropping the binary version of Step 2 costs you **simplicity.** You can no longer just check a box ("Did a dissenter exist?"). You have to do historical sociology. You have to ask: *For this specific person, in this specific class and role, was the moral truth legible and actionable?* This is harder to argue, but it's actually what historians do.

  ### 4. Your Professor's Point (Commemoration vs. Blame)
  Your professor is not distracting you; they are offering a **parallel track** that solves the Step 5 collapse without breaking your MHOT argument.

  *   **Blame (Retrospective Justice):** MHOT applies here. We might decide Jefferson is not *blameworthy* (or less blameworthy) because of his context.
  *   **Commendation (Honor/Statues):** MHOT does **not** apply here.

  Statues are not for "people who weren't monsters." They are for "people we want to emulate."
  *   You can argue: *"Jefferson passes the MHOT test for blame (maybe), but he fails the Commemoration test."*
  *   Why? Because commemoration is forward-looking. We take down statues not to punish the dead, but to signal to the living what values we hold.

  **How to use this in seminar:**
  Keep your MHOT argument for the **moral responsibility** portion of the class (Step 1–4). Admit Step 2 needs the "Reasonable Accessibility" patch to avoid the "Everyone is Guilty" trap.
  Then, pivot to the professor's point for the **policy** portion (statues/names). Argue that even if MHOT reduces Jefferson's *blame*, it does not increase his *honor*.

  **Summary for your paper:**
  1.  **Keep Step 1 & 3.**
  2.  **Modify Step 2:** Change "no available dissenter" to "no *reasonably accessible and actionable* dissent for an agent of that status."
  3.  **Accept Step 4:** Admit that yes, we are likely blameworthy for many things our descendants will hate. That's not a bug; it's a feature of moral progress.
  4.  **Use the Professor's Point:** Separate *blame* (where MHOT matters) from *honor* (where MHOT is irrelevant).

  This saves your argument from eating itself while keeping the nuance you want on Jefferson.
