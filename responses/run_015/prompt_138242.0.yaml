answer: |-
  ### Part I: Filtering Your Cases

  Before setting out the pruned desiderata, I shall assess the cases you have gathered. You are right to suspect that some are substantive constraints while others are theoretical artefacts.

  **The Genuine Constraints**
  1.  **The Challenge Data (including Moorean absurdity):** This is non-negotiable. Any norm must explain why 'How do you know?' is the canonical challenge and why Moorean sentences are pragmatically self-defeating. If a norm cannot explain why these utterances feel defective, it fails to capture the practice.
  2.  **The Defect/Blame Distinction:** This is a hard requirement. We must be able to say an assertion was improper (defective) without necessarily saying the asserter was culpable (blameworthy). This handles the Gettierised asserter and the careful but mistaken speaker. If your norm collapses correctness into blameworthiness, it cannot account for epistemic luck.
  3.  **Statistical Evidence (The Lottery Case):** This is a robust constraint. The intuition that one cannot assert a lottery ticket will lose merely on statistical grounds, despite high probability, is strong. A norm that permits this without qualification fails to distinguish testimony from guesswork.
  4.  **Institutional/Non-Human Assertion:** Given your specific brief, this is non-negotiable. A press office or automated board asserts. If your norm requires a mental state (belief) that these entities cannot hold, the norm does not govern the practice you are analysing.

  **The Camp Shibboleths**
  1.  **Selfless Assertion:** This is likely a shibboleth of the anti-belief camp. Whether the bereaved friend's assertion is a counterexample depends entirely on whether you antecedently accept that belief is required. It is a data point for some, but a *reductio* for others. It should not be a foundational desideratum.
  2.  **Global Consistency (The Preface):** This is a demand of logic, not necessarily of the assertion norm itself. An author can assert individual sentences properly while acknowledging fallibility. Requiring global consistency as a condition for *each* assertion sets the bar too high for finite agents.
  3.  **No Uptake (Diaries/Dead Speakers):** This tests whether assertion is essentially communicative. While interesting, it is secondary to the core normative function. A norm can govern the act even if the audience is absent, provided the act is of a type *capable* of uptake.
  4.  **Indifferent Speaker:** This collapses into the sincerity condition. If they believe and are right, the indifference is a moral or conversational vice, not necessarily an epistemic defect in the assertion itself.

  ---

  ### Part II: The Six Pruned Desiderata

  Here are the six requirements any adequate norm must satisfy, tailored to your dual purpose of grounding hearer warrant and guiding institutional speakers.

  **1. The Phenomenological Constraint**
  *   **Requirement:** The norm must vindicate the intuitive impropriety of Moorean assertions and the aptness of the knowledge challenge ('How do you know?').
  *   **Rationale:** If the norm does not align with the surface grammar of our critical practices, it is revisionary rather than descriptive. It must explain why asserting *p* while admitting ignorance feels like a contradiction in terms.
  *   **Status:** Non-negotiable.

  **2. The Accessibility Constraint**
  *   **Requirement:** The norm must be followable *ex ante* by a speaker who cannot access factive states.
  *   **Rationale:** This serves your second job. An institutional speaker (or a fallible individual) cannot directly aim at 'Knowledge' or 'Truth' because they cannot infallibly detect them. The norm must provide a criterion the speaker can actually use to decide whether to assert.
  *   **Status:** Non-negotiable (for a guidance norm).

  **3. The Transmission Constraint**
  *   **Requirement:** The norm must explain how a hearer acquires warrant from testimony even when the speaker has technically violated the norm (provided the violation was blameless).
  *   **Rationale:** This serves your first job. If hearer warrant depended on the speaker's perfect compliance, testimony would rarely transmit knowledge (since speakers are often Gettierised or slightly mistaken). The norm must allow the hearer to rely on the *appearance* of compliance.
  *   **Status:** Non-negotiable.

  **4. The Statistical Sensitivity Constraint**
  *   **Requirement:** The norm must explain why bare statistical evidence (the lottery case) is insufficient for assertion, even when probability is near 1, whereas specific causal evidence is sufficient.
  *   **Rationale:** This prevents the norm from collapsing into a simple probability threshold. It ensures the norm captures the specific epistemic relation required for testimony, distinguishing it from prediction.
  *   **Status:** Non-negotiable.

  **5. The Agency Neutrality Constraint**
  *   **Requirement:** The norm must apply to speakers that lack first-personal mental states (e.g., automated systems, collective bodies).
  *   **Rationale:** Given your focus on institutional assertion, a norm requiring 'belief' or 'conscious knowledge' is category-mistaken. The norm must govern the *output* relative to the *informational state* of the system, regardless of whether that system is phenomenally conscious.
  *   **Status:** Non-negotiable (for your specific brief).

  **6. The Granularity Constraint**
  *   **Requirement:** The norm must distinguish between the *correctness* of the assertion and the *culpability* of the asserter.
  *   **Rationale:** This handles the false-but-supported cases. It allows us to say the assertion was defective (it failed the norm) without saying the speaker was irrational. This is vital for maintaining the objective standard required for hearer warrant while acknowledging human fallibility.
  *   **Status:** Non-negotiable.

  ---

  ### Part III: The Exclusionary Requirement and The Trilemma

  **The Single Most Exclusionary Requirement**
  The **Agency Neutrality Constraint** is the most devastating to standard accounts. Most literature assumes assertion is a human, intentional act grounded in mental states. The Knowledge Norm (KN) and Belief Norm (BN) are explicitly mentalistic. To apply them to an automated departure board or a press office requires metaphorical stretching that weakens the norm's explanatory power. If a norm requires a subject who *knows*, it cannot strictly govern a system that *processes*. This requirement alone rules out any norm defined essentially by private mental states.

  **Shibboleths vs. Real Demands**
  *   **Real:** The need to distinguish blame from defect (Granularity) and the need to explain the lottery intuition (Statistical Sensitivity). These are structural features of the practice.
  *   **Shibboleth:** The demand that the norm be *factive* (Truth/Knowledge). While popular, this is often a proxy for the Phenomenological Constraint. One can explain Moorean absurdity via norms of Reasonable Belief if one adds a sincerity condition. The insistence on factivity is often a defence of the Knowledge Norm rather than a neutral datum.

  **The Trilemma**
  You suspected a conflict between Challenge Data, Followability, and Statistical/Invariant handling. I propose the conflict is sharper. There is a trilemma between **Factivity**, **Accessibility**, and **Transmission**.

  1.  **Factivity:** To satisfy the Phenomenological and Statistical constraints, the norm seems to need a factive condition (Truth or Knowledge). Non-factive norms (like Belief) struggle to explain why the lottery assertion is wrong (since one can believe lottery propositions) and why the challenge is apt.
  2.  **Accessibility:** To satisfy the Guidance constraint (your second job), the norm must be accessible. But factive states are not directly accessible to fallible agents (you cannot know that you know). If the norm is Factive, it fails Accessibility.
  3.  **Transmission:** To satisfy the Transmission constraint (your first job), the hearer's warrant must not collapse when the speaker unknowingly violates the norm. If the norm is Factive and constitutive of warrant, a violation (e.g., a Gettier case) should block transmission. But we want transmission to survive blameless violation.

  **The Result:** You cannot have a norm that is simultaneously Factive (to handle the data), Accessible (to guide the speaker), and Robust (to allow transmission despite error).
  *   If you choose **Knowledge** (Factive), you lose Accessibility (speakers can't tell if they satisfy it) and struggle with Institutional speakers.
  *   If you choose **Reasonable Belief** (Accessible), you lose the Statistical data (lottery assertions become permissible) and weaken the Challenge data.
  *   If you choose **Truth** (Factive/Neutral), you lose Guidance (you can't aim at truth without a proxy) and Transmission (false assertions transmit nothing).

  This trilemma suggests that no *single* norm can do all the work. You may need a dual-norm account: one constitutive norm (e.g., Truth) that sets the standard of correctness, and one regulatory norm (e.g., Sufficient Evidence) that guides the speaker and grounds the hearer's entitlement to rely.

  ---

  ### Part IV: Scorecard

  **The Knowledge Norm (Williamson)**
  *   **Pros:** Perfectly handles the Challenge Data and Moorean cases. Explains Statistical Sensitivity well (you don't know lottery outcomes).
  *   **Cons:** Fails Accessibility (speakers cannot verify they know). Fails Agency Neutrality (institutions do not 'know' in the strict sense). Struggles with Transmission (if knowledge is required for proper assertion, does a Gettierised speaker transmit warrant?).
  *   **Verdict:** Best for phenomenology, worst for your institutional brief.

  **The Truth Norm**
  *   **Pros:** Satisfies Agency Neutrality (statements can be true regardless of speaker). Satisfies Granularity (one can be blameless but false).
  *   **Cons:** Fails Accessibility (one cannot aim directly at truth). Fails Transmission (false assertions generally do not transmit warrant). Weak on Challenge Data ('How do you know?' is more apt than 'Is it true?').
  *   **Verdict:** Best for institutions, worst for guidance and hearer gain.

  **The Belief Norm**
  *   **Pros:** Satisfies Accessibility (I can tell what I believe). Satisfies Agency Neutrality (if 'belief' is functional).
  *   **Cons:** Fails Statistical Sensitivity (one can believe lottery losses). Fails Challenge Data (why challenge belief if belief is present?). Collapses Defect into Sincerity.
  *   **Verdict:** Best for guidance, worst for epistemic standards.

  **The Warranted Assertability (Reasonableness) Norm**
  *   **Pros:** Satisfies Accessibility and Transmission (hearer relies on speaker's evidence, not fact). Handles Blameless Error well.
  *   **Cons:** Fails Statistical Sensitivity (high probability warrants assertion, permitting lottery cases). Weakens the Knowledge Challenge (changes it to 'What are your reasons?').
  *   **Verdict:** Best for hearer warrant, worst for distinguishing testimony from guesswork.

  **Final Word:** For your specific purpose, the **Warranted Assertability** norm comes closest to satisfying the Transmission and Guidance jobs, but it requires an adjunct clause to handle the Statistical Sensitivity constraint (e.g., distinguishing statistical from explanatory evidence). The Knowledge Norm is likely untenable for your institutional brief unless you treat 'knowledge' as a functional property of systems rather than a mental state of individuals.
