answer: |-
  # The Imperceptible Difference Decision Tree

  **Start:** You admit that your single act (burger, flight, vote) makes no perceptible difference to the outcome.

  ### 1. The Reality of Harm
  **Question:** Is the "harm" (climate change, election loss, drought) a real entity over and above the sum of individual impacts?
  *   **No:** The harm is just a shorthand for many individual hurts; there is no "collective" object.
      *   → **Leaf: Metaphysical Individualism**
      *   *Commitment:* Denying that climate change is a distinct harm over and above individual coughs or crop failures.
  *   **Yes:** Continue to Question 2.

  ### 2. The Unit of Assessment
  **Question:** What is the primary unit we are morally assessing?
  *   **The Group's Joint Action:** We should look at what the group does together, not just you alone.
      *   → **Leaf: Collective Obligation View**
      *   *Commitment:* Arguing individuals are blameless if coordination fails, even if the outcome is disastrous.
  *   **The Individual's Act/Pattern:** Continue to Question 3.

  ### 3. The Imperceptibility Test
  **Question:** Can an act be morally wrong even when the difference it makes is imperceptible?
  *   **No:** If you change nothing perceptible, you do nothing wrong.
      *   → **Leaf: The Marginalist**
      *   *Commitment:* Insisting the 20th person in a 20-person bucket brigade owes nothing if their single bucket wasn't visibly decisive.
  *   **Yes:** Continue to Question 4.

  ### 4. The Source of Wrongness
  **Question:** Where does the wrongness come from?
  *   **A. Your Tiny Expected Causal Contribution:** You might tip the scale, even if unlikely.
  *   **B. Being a Non-Superfluous Part:** You are a necessary piece of a harm that actually occurs.
  *   **C. Complicity/Profiting:** You join in or benefit from a harmful practice you don't control.
  *   **D. Rule/Expression:** You violate a rule everyone should follow or betray your own values.
      *   *(Select A, B, C, or D and continue to Question 5)*

  ### 5. Conditionality of Duty
  **Question:** Is your duty to abstain unconditional, or does it switch on only once enough others are doing their part?
  *   **Unconditional:** You must do your part regardless of what others do.
  *   **Conditional:** You are only required to act if others meet their threshold.

  ---

  ### The Positions (Leaves)

  **1. Metaphysical Individualism** (From Q1: No)
  *   *Hardest Commitment:* Defending that "climate change" isn't a real harm distinct from individual weather events.

  **2. Collective Obligation View** (From Q2: Group)
  *   *Hardest Commitment:* Explaining why individuals owe nothing when coordination fails to stop a catastrophe.

  **3. The Marginalist** (From Q3: No)
  *   *Hardest Commitment:* Maintaining that the 20th bucket-brigader commits no wrong if the fire goes out anyway.

  **4. Causal Purist** (From Q4: A + Q5: Unconditional)
  *   *Hardest Commitment:* Arguing you have a duty to vote even when the odds of deciding the election are one in millions.

  **5. Conditional Contributer** (From Q4: A + Q5: Conditional)
  *   *Hardest Commitment:* Justifying why your duty vanishes if others slack off, even if your act would have helped.

  **6. Trigger Essentialist** (From Q4: B + Q5: Unconditional) *[See Note 1]*
  *   *Hardest Commitment:* Claiming you are a necessary part of a harm even when there are already enough actors (e.g., the 51st bucket).

  **7. Threshold Partner** (From Q4: B + Q5: Conditional)
  *   *Hardest Commitment:* Explaining why you are morally clean in the 19/20 case if you mistakenly believe others won't show up.

  **8. Complicity Absolutist** (From Q4: C + Q5: Unconditional)
  *   *Hardest Commitment:* Asserting you are complicit even when you profit nothing and cannot change the practice (e.g., voting).

  **9. Fair-Play Complicit** (From Q4: C + Q5: Conditional)
  *   *Hardest Commitment:* Arguing that profiting from a harm is acceptable if enough others refrain from it.

  **10. Integrity Idealist** (From Q4: D + Q5: Unconditional)
  *   *Hardest Commitment:* Following a rule (e.g., "never water lawns") even when breaking it secretly would save a life.

  **11. Reciprocal Expressivist** (From Q4: D + Q5: Conditional)
  *   *Hardest Commitment:* Claiming your values only require expression if others are willing to express theirs too.

  ---
  *[Instructor Notes Below]*

  **Note 1 (Indistinguishable Leaves):** In practice, **Causal Purist** and **Integrity Idealist** often prescribe identical actions (don't fly, don't eat meat), making them hard to pull apart without probing the *reason* for the duty.

  **Note 2 (Empty/Incoherent Combinations):** The branch **Trigger Essentialist (4B + Unconditional)** is nearly incoherent. If your duty is based on being a "non-superfluous part," but you act unconditionally (even when superfluous, like the 51st bucket), the source description contradicts the conditionality answer. This leaf represents a position few actually defend.

  **Note 3 (Case Handling):**
  *   **Bucket Brigade (19/20):** Marginalist says "No duty"; Trigger Essentialist says "Duty".
  *   **Bucket Brigade (50/20):** Marginalist says "No duty"; Trigger Essentialist says "No duty" (you are superfluous).
  *   **Carbon/Voting:** Causal Purist argues duty based on expected value; Complicity views argue duty based on association.
  *   **Lawn Watering:** Conditional views (Threshold Partner, Fair-Play) argue duty depends on neighbors joining in.

  **Note 4 (Formatting):** This tree is designed to fit on two sides of a standard page when printed with standard margins. Ensure font size is legible (11pt or 12pt).
