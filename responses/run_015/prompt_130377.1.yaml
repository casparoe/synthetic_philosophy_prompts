  Sequence
  Open with a five-minute review of single-premise closure (if A, and A entails B, believe B). This is your prerequisite; without it, the multi-premise jump lacks force. Introduce "The Audit" case immediately after. Do not start with the Preface; start with the Lottery structure embedded in the Audit (1000 returns, exactly one error known to exist). This forces the contradiction visibly on the board: you believe each is clean, so you must believe all are clean, but you know one is dirty. This establishes the logical tension before complicating it with psychology. Your worry about numbers is valid, but the Preface requires understanding the Lottery contradiction first to feel the force.

  Once the contradiction is derived (minute 20), pivot to the Preface structure (minute 25). Ask: "What if we don't know exactly one is wrong, just that errors happen?" This shifts the focus from statistical certainty to rational fallibility. The dependency here is crucial: students must feel the logical squeeze of the Lottery before they can appreciate the epistemic humility of the Preface.

  Introduce the shared-source variant late (minute 40), after they have committed to a stance. This tests the robustness of their solution. End with the diagnostic question (minute 45). Do not allow discussion of solutions to dominate; the goal is feeling the tension, not resolving it. The sequence depends on this escalation: Logic first, Psychology second, Robustness third. If you reverse this, students will dismiss the Lottery as a gambling trick and never engage the Preface seriously.

  Carrying example
  Use "The Audit". You check 1,000 tax returns. Each passes your check (high justification). Required features: high volume (to make conjunction improbable), individual justification (you checked each), and known fallibility (protocol says errors occur). Forbidden features: gambling stakes (no prizes), personal identity (no names), and moral weight (no jail time). This keeps the focus on epistemic norms, not risk aversion.

  The shared-source variant goes in the final fifteen minutes. Suppose one auditor checked all 1,000. Your housemate is right: errors are now correlated. If the auditor is tired, claims 500–600 might all fail together. This does not dissolve the paradox; it strengthens it. It makes the conjunction *even less* probable than the independence model suggests, sharpening the conflict between believing each claim and believing the conjunction. Use this to show that probabilistic independence isn't doing the heavy lifting; the aggregation principle is. The case must lack specific domain expertise so students rely on intuition, not technical knowledge.

  Misconception map
  1.  **Confidence vs. Belief:** Students will say, "I'm confident, but I don't *believe*." Defuse at minute 15. Ask: "If you didn't believe it was clean, would you stamp it?" Force the all-or-nothing stance required for knowledge.
  2.  **Politeness:** They will call the Preface admission modesty. Defuse at minute 25. Frame it as "I believe there is an error," not "I might be wrong." It must be a belief about the book, not the author's character.
  3.  **Evidence Conflation:** They will think Lottery is statistical, Preface is historical. Defuse at minute 20. Show both reduce to: "Each is probable, all together are not." The source of probability doesn't change the logic.
  4.  **Abandon Aggregation:** They will suggest dropping multi-premise closure. Defuse at minute 30. Show the cost: you couldn't believe "The sun will rise and 2+2=4." Everyday reasoning collapses without aggregation.
  5.  **Suspension of Judgment:** (Added) They will say "Believe none." Defuse at minute 30. If you believe none, you cannot act on your audit. Practical necessity forces belief, making the paradox inescapable. This prevents them from escaping the tension by retreating to agnosticism.

  Check and refusals
  Diagnostic Question: "If there were only 2 claims, each 99% secure, would you believe the conjunction?"
  Good Answer: "Yes, because 98% is still high enough." This shows they see the threshold problem, not just the logic.
  Bad Answer: "No, the paradox still holds." This shows they treat it as a logical impossibility rather than a probabilistic tension.
  Refusals: Do not explain the specific probability threshold for belief. Do not name "Contextualism" or "Subject-Sensitive Invariantism." Do not derive Bayesian updates. When asked, say: "Those are formal tools for later courses; today we are mapping the intuition." Keep the door open by saying "Different theories place the line differently," without drawing the line yourself.
