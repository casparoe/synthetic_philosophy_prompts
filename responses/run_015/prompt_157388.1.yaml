prompt: |-
  hi — I'm a software engineer at a small hardware startup, no philsophy training beyond a couple of Wikipedia afternoons, so please skip the jargon or define it when you use it.

  We build a chip called Loom: analog, no clock, noisy, continuous voltages rather than bits, and its behaviour is set by training rather than by anything anyone wrote down. Our website and our grant applications are full of sentences like 'Loom implements a predictive-coding model of visual cortex' or 'the chip computes the same function as this cortical circuit'. I'm the one who has to vet those sentences before they ship — one or two a week — and anything that survives has to be signed off by our comms lead and one external scientific advisor. I get about thirty minutes per sentence, I can't run new experiments, and all I have is the training config, the weights, and whatever benchmark logs and ablations happen to exist for that build. I don't need to settle whether brains are computers; I need to know which sentences we can ship. Please don't give me reading lists or citations, I have no library access and no interest in names of papers.

  Somebody down the pub told me there's an argument that, with the right choice of mapping, a brick wall 'implements' any program you like, and someone else said the way out is to demand that the mapping track the system's causal structure — including what it would do on inputs it never actually receives. I have no idea whether either of those is a real position. What I want is a procedure my team can run.

  So: write me a decision procedure, ordered gates, that takes a claim of the form 'system S implements computation C' and returns ship / don't ship / hand to a human. For each gate, give me the question, what counts as a sufficient answer when your only evidence is existing logs and weights, the point at which it just returns NO, and the point where it stops and hands the decision to a person because it's a question about what we care about rather than a fact. It has to cope with:

  - no written-down program — the description has to be recovered from behaviour; say how much probing is enough and what to do when we can't probe further
  - no clock and no discrete states — what gets to count as a state, an input token, and a timestep, and what to do when there's no non-arbitrary answer
  - noise, so transitions are only approximately deterministic — how close is close enough, and what to do when we can't measure it
  - behaviour that drifts within a session, so the same input gives different outputs on Monday and Friday
  - the brick-wall problem: a gate that stops a gerrymandered mapping — one chosen after seeing the data, disjunctive, or absurdly fine-grained — from passing; and be honest about what including that gate costs us

  Tell me which single gate is doing most of the work, and what happens to the whole procedure if that gate turns out to be indefensible. Mark clearly which steps are judgment calls in a checklist costume.

  Then run it on three claims, in front of me:

  1. 'Loom-3 implements a predictive-coding model of mouse V1.' Evidence: it matches 78% of the explained variance in a neural benchmark, the architecture was loosely inspired by predictive coding, we have no ablations, no off-distribution tests, and per-unit noise of about five percent.
  2. 'The distilled lookup table on our microcontroller implements the same model.' Forty rows, fits the benchmark perfectly, no noise, passes anything you'd check formally. If my procedure says ship on this one it's useless, so show me what it actually does here.
  3. A case where two incompatible descriptions — a predictive-coding one and a plain feedforward-with-learned-normalisation one — fit the same logs equally well, and picking between them looks like it depends on what we're trying to explain rather than on any fact about the chip.

  Finally, name the classes of claim the procedure simply can't settle, including the one that keeps coming up for us: whether a voltage level on our chip literally stands for a quantity or merely causes a downstream effect.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Software engineer at a small hardware startup (Loom).
      *   **Context:** Building an analog, clockless, noisy, continuous-voltage chip trained rather than programmed.
      *   **Task:** Vet marketing/grant claims like "Loom implements X model of brain region Y."
      *   **Constraints:** 30 mins per sentence, no new experiments, only logs/weights/configs available, no philosophy jargon (or define it), no reading lists/citations.
      *   **Specific Problem:** The "triviality" or "brick wall" problem (pancomputationalism) – i.e., anything can implement anything with a weird enough mapping. Needs a practical filter.
      *   **Deliverables:**
          1.  A decision procedure (ordered gates) with specific criteria for Pass/Fail/Hand-to-Human.
          2.  Address specific technical challenges (no clock, noise, drift, gerrymandering).
          3.  Identify the "workhorse" gate and the consequence of its failure.
          4.  Mark judgment calls.
          5.  Run the procedure on three specific test cases.
          6.  Name the classes of claims the procedure *can't* settle (specifically representation/semantics).

  2.  **Deconstruct the Philosophical/Technical Problem:**
      *   *The Core Issue:* Implementation claims are usually about *isomorphism* (structure matching) or *functional equivalence* (input-output matching). But with analog/neuromorphic hardware, "state" and "time" are fuzzy. With the "brick wall" argument (Putnam/Searle style), any physical system maps to any logical state if the mapping is complex enough.
      *   *The Solution:* We need a "Naturalness" or "Robustness" constraint. The mapping between physical states and computational states shouldn't be arbitrary. It needs to respect *causal structure* and *counterfactuals* (what would happen if...).
      *   *Constraints:* The user can't run new experiments. This limits counterfactual testing to *existing* ablation logs or weight perturbations.
      *   *The "Brick Wall" Fix:* The mapping must be *simple* (low complexity) and *local* (physical proximity matches logical proximity).

  3.  **Drafting the Decision Procedure (The Gates):**
      *   *Goal:* Filter out nonsense, keep plausible science, flag deep philosophy.
      *   *Gate 1: Input/Output Alignment.* Does the physical I/O match the computational I/O? (Basic sanity).
      *   *Gate 2: State Stability/Discretization.* Can we define states without arbitrary thresholds? (Handles analog/no-clock).
      *   *Gate 3: Counterfactual Robustness (The Workhorse).* Does the system behave correctly on inputs *not* in the training set, or when weights are nudged? (Handles the brick wall/triviality).
      *   *Gate 4: Mapping Simplicity (The Anti-Gerrymander).* Is the map from voltage to bit simple? (Handles the "brick wall" mapping problem).
      *   *Gate 5: Drift/Time.* Does the function hold over time? (Handles drift).
      *   *Hand-off:* When the choice is about *purpose* rather than *fact*.

      *Refining the Gates for the User's Constraints:*
      *   Need to be actionable with logs/weights.
      *   Need to explicitly handle the "no clock" and "noise" issues.
      *   Need to identify the "Workhorse." Gate 3 (Counterfactuals/Robustness) is usually the strongest filter against triviality, but Gate 4 (Mapping Simplicity) is the specific antidote to the "brick wall" argument. Let's combine the spirit: *Causal Robustness under Simple Mapping.*
      *   *Decision:* Let's make Gate 3 the "Counterfactual/Intervention" gate. This is the strongest filter against triviality. If a brick wall implements Excel, it doesn't survive interventions on the "registers."

  4.  **Developing the Criteria for Each Gate:**
      *   *Question:* What are we asking?
      *   *Sufficient Answer (Logs/Weights):* What do we look for in the data?
      *   *Fail Condition:* Hard NO.
      *   *Hand-off Condition:* Judgment call.

  5.  **Addressing Specific Challenges:**
      *   *No Clock/State:* Use "attractor states" or "stable voltage regions" defined by clustering in logs.
      *   *Noise:* Require statistical significance over noise floor.
      *   *Drift:* Check consistency across sessions in logs.
      *   *Brick Wall:* Require the mapping to be *linear* or *local* (nearby neurons = nearby bits).
      *   *Workhorse:* The Counterfactual/Intervention Gate. If this goes, the whole thing collapses into "it matches the output once."

  6.  **Running the Test Cases:**
      *   *Case 1 (Loom-3 Predictive Coding):* 78% variance, inspired by PC, no ablations.
          *   Likely passes I/O.
          *   Fails Counterfactuals (no ablations/off-dist).
          *   Result: Don't Ship (or Hand to Human with warning).
      *   *Case 2 (Lookup Table):* Perfect fit, 40 rows.
          *   Passes I/O.
          *   Passes Counterfactuals (within table).
          *   *Fails Mapping Simplicity/Generalization:* It's a table, not a model. It doesn't implement the *mechanism*, just the function.
          *   *Crucial Distinction:* "Implements a model" vs "Computes a function." The claim is "Implements the model." A lookup table does not implement the *algorithm* of predictive coding.
          *   Result: Don't Ship (Mechanism mismatch).
      *   *Case 3 (Underdetermination):* PC vs Feedforward. Both fit logs.
          *   Passes I/O.
          *   Passes Counterfactuals (both fit existing logs).
          *   *Fails Uniqueness:* We can't distinguish.
          *   Result: Hand to Human (This is a theory choice, not a fact check).

  7.  **Addressing the "Unsettlable" Claims:**
      *   Semantics/Representation. Does voltage *mean* light intensity, or just cause a reaction? This is the "Symbol Grounding" problem. The procedure can't solve this.

  8.  **Review and Refine (Self-Correction):**
      *   *Tone:* Pragmatic, engineering-focused, no fluff.
      *   *Jargon:* Define "counterfactual," "isomorphism," "gerrymandered."
      *   *Constraint Check:* Did I answer the "brick wall" specific concern? Yes, via the Mapping Simplicity/Intervention gate.
      *   *Workhorse:* I need to be clear. If the Counterfactual gate is removed, *anything* passes if it matches I/O once.
      *   *Judgment Calls:* Mark them clearly.

      *(Self-Correction on Case 2)*: The user says "If my procedure says ship on this one it's useless." I need to ensure the procedure kills the lookup table claim. The claim is "Implements the same model." A lookup table implements the *function*, not the *model* (algorithm/structure). The procedure needs a gate for "Structural/Mechanistic Isomorphism" vs "Input-Output Equivalence." I will add a specific check for *Mechanism Transparency*.

      *(Refining the "Brick Wall" Gate)*: The user specifically mentioned "mapping track the system's causal structure." I need to make sure Gate 4 explicitly checks if the mapping is "natural" (e.g., spatial locality, linear scaling) vs "gerrymandered" (e.g., "if voltage is 3.14V then bit is 1, else if 3.15V then bit is 0" in a chaotic way).

      *(Refining the Workhorse)*: The Counterfactual/Intervention gate is the standard philosophical answer to Putnam's triviality argument. I will stick with that but emphasize the *Mapping Constraint* as the prerequisite.

  9.  **Final Polish:** Check against the 30-minute limit. The procedure must be fast.
      *   Gate 1: I/O Definition (5 mins)
      *   Gate 2: Mapping Simplicity (5 mins)
      *   Gate 3: Counterfactual Robustness (15 mins)
      *   Gate 4: Mechanism vs Function (5 mins)
      *   Handoff.

      *Wait, one more thing:* The user asked for "what counts as a sufficient answer when your only evidence is existing logs." I need to be specific about *what logs*. Weight perturbations? Noise injections?

      *Let's structure the response.*
      1.  Intro (acknowledge constraints).
      2.  The Procedure (The Gates).
      3.  The Workhorse Analysis.
      4.  The Test Runs.
      5.  The Unsettlable Claims.

      *Definitions:*
      *   *Counterfactual:* What would happen if... (tested via ablation logs).
      *   *Gerrymandered Mapping:* A map created specifically to make the data fit, not derived from physical structure.
      *   *Isomorphism:* Structure matching.

      *Case 2 Nuance:* The lookup table fits the *benchmark*, but does it implement the *model*? No. The claim is "Implements the same model." The procedure must distinguish "Computes function F" from "Implements mechanism M." I will add a gate for "Architectural Correspondence."

      *Case 3 Nuance:* This is the "Underdetermination of Theory by Data." The procedure must flag this as a Human Handoff.

      *Unsettlable:* Representation (Semantics).

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your constraints: 30 minutes, logs/weights only, no new experiments, high skepticism of "triviality" arguments.

  ### The Procedure: "The Implementation Filter"

  **Definitions:**
  *   **Counterfactual:** A statement about what the system *would* do if conditions were different (e.g., "If input X were higher, output Y would drop"). Since you can't run new tests, you must find evidence of this in existing ablation logs, noise injections, or weight perturbations.
  *   **Gerrymandered Mapping:** A translation rule from physical state (voltage) to logical state (bit/variable) that is overly complex, disjointed, or created *after* looking at the data to force a match.
  *   **Isomorphism:** A one-to-one structural match. If the model says "Unit A inhibits Unit B," the chip must show "Voltage at A reduces Voltage at B."

  ---

  #### Gate 1: The I/O Boundary
  **Question:** Can you define the system's inputs and outputs without arbitrary thresholds?
  **Evidence:** Config files, pinout logs, benchmark input/output pairs.
  **Sufficient Answer:**
  *   **Yes:** Inputs/Outputs are physically distinct pins or voltage rails defined in the config. Time windows for integration are specified (even if analog).
  *   **No:** Inputs/outputs are defined by clustering the data *after* the fact (e.g., "We decided this voltage spike counts as an input").
  **Fail (Don't Ship):** You cannot identify where the system ends and the environment begins without looking at the results first.
  **Hand-to-Human:** The time-window definition is ambiguous (e.g., "continuous" vs. "10ms bins"). *Judgment Call: Does the ambiguity affect the claim?*

  #### Gate 2: Mapping Simplicity (The Anti-Brick-Wall)
  **Question:** Is the map from Physical State (Voltage) to Logical State (Model Variable) simple and local?
  **Evidence:** Weight matrices, physical layout vs. logical topology.
  **Sufficient Answer:**
  *   **Yes:** The mapping is linear, monotonic, or spatially local (e.g., "Neuron 1 in model = Node 1 on chip"). It was defined *before* training or is inherent to the architecture.
  *   **No:** The mapping requires a lookup table, a complex polynomial, or non-adjacent physical components to define a single logical variable.
  **Fail (Don't Ship):** The mapping is "gerrymandered" (e.g., "Variable X is high if Voltage A > 3V OR Voltage B < 1V"). This is the brick-wall loophole.
  **Hand-to-Human:** The mapping is simple but requires a calibration constant that drifts. *Judgment Call: Is the calibration part of the model or the hardware noise?*

  #### Gate 3: Counterfactual Robustness (The Workhorse)
  **Question:** Does the system maintain the input-output relationship under intervention?
  **Evidence:** Ablation logs, weight perturbation files, noise injection tests, off-distribution benchmark runs.
  **Sufficient Answer:**
  *   **Yes:** Logs show that when a specific weight/path is nudged or blocked, the output changes in the direction the model predicts. Or, on inputs *not* in the training set, the error degrades gracefully according to the model's theory.
  *   **No:** The system only matches the model on the exact training distribution. When weights are perturbed (even within noise tolerance), the behavior diverges from the model's prediction.
  **Fail (Don't Ship):** The match holds only for the specific trajectory observed in the logs. There is no evidence the system *would* behave correctly if things were slightly different.
  **Hand-to-Human:** There is some evidence of robustness, but it's statistically weak (e.g., p-value is 0.06). *Judgment Call: Is this close enough for marketing?*

  #### Gate 4: Mechanism vs. Function
  **Question:** Does the claim describe *how* it works (mechanism) or *what* it does (function)?
  **Evidence:** Architecture diagrams, claim text.
  **Sufficient Answer:**
  *   **Yes (Mechanism):** The claim says "Implements predictive coding." The logs show error signals propagating backwards or laterally, matching the specific algorithm of predictive coding.
  *   **Yes (Function):** The claim says "Computes the function of V1." The logs show output matches V1 responses, regardless of internal method.
  *   **No:** The claim says "Implements [Mechanism]" but the internal logs show a different mechanism (e.g., brute-force lookup) that only mimics the output.
  **Fail (Don't Ship):** Claiming a specific algorithm (e.g., "Predictive Coding") when the internal dynamics match a different algorithm (e.g., "Feedforward Lookup") that produces the same result.
  **Hand-to-Human:** The internal dynamics are ambiguous (see Case 3).

  ---

  ### The Workhorse Gate

  **Gate 3 (Counterfactual Robustness)** is doing 90% of the work.

  **Why:** The "brick wall" argument succeeds because a brick wall matches the *actual* history of inputs and outputs of a computer (if you map the vibrations correctly). But a brick wall does not match the *counterfactuals*. If you change the input to the computer, the output changes predictably. If you change the input to the wall (throw a different rock), the "output" (vibration) does not track the computer's logic.

  **If Gate 3 is indefensible:** If you cannot find *any* logs of interventions (ablations, noise, off-dist), the procedure collapses. You are left only with Input-Output matching (Gate 1 & 2). In that scenario, **you cannot ship any claim about "implementing a model."** You can only ship claims about "matching benchmark statistics." Without counterfactuals, you cannot distinguish a model from a recording of a model.

  **Judgment Calls in Costume:**
  *   Gate 1 Hand-off (Time windows): This is physics, but where you draw the line is pragmatic.
  *   Gate 2 Hand-off (Calibration): Is drift a bug or a feature of "analog"?
  *   Gate 3 Hand-off (Statistical weakness): How much risk can the startup tolerate?
  *   Gate 4 Hand-off (Ambiguous dynamics): This is scientific theory selection, not engineering fact.

  ---

  ### Running the Procedure

  #### Case 1: 'Loom-3 implements a predictive-coding model of mouse V1.'
  *Evidence: 78% variance match, inspired by PC, no ablations, 5% noise.*

  1.  **Gate 1 (I/O):** Pass. Inputs are images, outputs are voltage traces matching neural spikes.
  2.  **Gate 2 (Mapping):** Pass. Assuming standard neuromorphic mapping (node-to-neuron).
  3.  **Gate 3 (Counterfactuals):** **FAIL.**
      *   *Reasoning:* You have "no ablations, no off-distribution tests." You only know it matches the *actual* data (78% variance). You do not know if it behaves like predictive coding when the input is broken, or when a connection is severed. A feedforward network could also match 78% variance on standard benchmarks.
      *   *Result:* **Don't Ship.**
      *   *Correction:* You can ship "Loom-3 matches 78% of the response variance of mouse V1 on benchmark X." You cannot claim it *implements the model* without evidence of the mechanism's robustness.

  #### Case 2: 'The distilled lookup table on our microcontroller implements the same model.'
  *Evidence: 40 rows, perfect fit, no noise, formal pass.*

  1.  **Gate 1 (I/O):** Pass.
  2.  **Gate 2 (Mapping):** Pass.
  3.  **Gate 3 (Counterfactuals):** Pass (within the 40 rows).
  4.  **Gate 4 (Mechanism vs. Function):** **FAIL.**
      *   *Reasoning:* The claim is "Implements the same **model**." A model implies a specific causal structure (algorithm). A lookup table implements the **function** (input-output map), but the mechanism is "memory retrieval," not "predictive coding" or "neural integration."
      *   *Brick Wall Check:* If you allow this, you allow the brick wall. The lookup table is the digital equivalent of the brick wall mapping for this specific dataset.
      *   *Result:* **Don't Ship.**
      *   *Correction:* Ship "The microcontroller reproduces the input-output behavior of the model." Do not use the word "implements" regarding the *model architecture*.

  #### Case 3: Two incompatible descriptions fit the logs equally well.
  *Evidence: Predictive-coding vs. Feedforward-with-normalization. Logs identical.*

  1.  **Gate 1 (I/O):** Pass.
  2.  **Gate 2 (Mapping):** Pass.
  3.  **Gate 3 (Counterfactuals):** **HAND-TO-HUMAN.**
      *   *Reasoning:* Your existing logs do not distinguish them. Both theories predict the same behavior on the data you have. To decide, you would need a new experiment (a "crucial test") where the two models predict different outcomes. You said you cannot run new experiments.
      *   *Result:* **Hand to Human.**
      *   *Reasoning:* This is no longer a fact check; it is a theory choice. The scientific advisor must decide which description is more useful or theoretically probable. The procedure cannot solve underdetermination.

  ---

  ### The Unsettlable Claims

  There is a class of claims this procedure cannot settle, no matter how many logs you have.

  **1. The Semantics/Representation Claim**
  *   *Claim:* "Voltage level 2.5V on Node 4 **represents** the brightness of the pixel."
  *   *Problem:* This is the "Symbol Grounding" problem. Your logs show that 2.5V *correlates* with brightness and *causes* downstream effects. They do not show that it *stands for* brightness.
  *   *Why it fails:* A system can have perfect causal structure (Gate 3 pass) without having "meaning." The voltage might just be a physical cause, like a billiard ball hitting another. Whether it "represents" something depends on an observer (us) interpreting it.
  *   *Verdict:* **Always Hand-to-Human.** This is a philosophical stance, not an engineering fact. If your grant requires "representation," you are relying on the advisor's philosophy, not your logs.

  **2. The "Same Function" Identity Claim**
  *   *Claim:* "Loom computes the **same** function as the cortex."
  *   *Problem:* "Same" is undefined for continuous, noisy systems. Is it the same if the error is 1%? 5%? If the cortex drifts and Loom doesn't?
  *   *Why it fails:* There is no mathematical metric for "functional identity" between a noisy analog chip and a biological wetware system.
  *   *Verdict:* **Always Hand-to-Human.** You must define a tolerance threshold (e.g., "within 5% error"). That threshold is a business/science policy decision, not a fact discovered in the logs.

  ### Summary Checklist for Your 30 Minutes

  1.  **I/O:** Are pins/inputs defined in config? (If No -> Stop)
  2.  **Mapping:** Is Voltage-to-Bit map simple/local? (If No -> Stop)
  3.  **Counterfactuals:** Do ablation/perturbation logs match model predictions? (If No -> Stop)
  4.  **Mechanism:** Does internal dynamics match the claimed algorithm, not just output? (If No -> Stop)
  5.  **Ambiguity:** If two theories fit, send to Advisor.
  6.  **Semantics:** If claim uses "represents" or "means", send to Advisor.

  **Final Advice:** If Gate 3 (Counterfactuals) is empty, downgrade all "Implements" claims to "Matches benchmark statistics." It is safer to be boring than to be refuted by a brick wall.
