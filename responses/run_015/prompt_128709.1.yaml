      *   **Goal:** Analyze implications for autonomy, legitimacy, and the temporal structure of authority.
      *   **Specific Questions:**
          *   Does legitimacy require "intertemporal consent" (future self authorizing present self) or can it rest on present rationality/self-interest?
          *   How does this change across scales (Individual $\rightarrow$ Small Group $\rightarrow$ Political Community)?
          *   Does the need for intertemporal consent grow stronger/weaker with scale?
