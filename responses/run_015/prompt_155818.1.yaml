  The Vance Trust releases a $1 million endowment only if the trustee, currently unreachable in a diplomatic blackout, has already locked a box marked "Altruist." The trust deed specifies the trustee's decision was made exclusively using your personal correspondence from early adulthood, a period you recall only hazily and for which you have no copies. You know the trustee codes "Altruist" if the letters suggest you would have donated to their cause even without the trust's existence. You stand before a donation bin for that same cause. Donating costs you $1,000; the trust is worth $1,000,000. You recall neither the content of the letters nor your stable disposition during that time, but you know successors of "past-altruists" tend to donate now, while "past-opportunists" do not.

  **Decision Theory Check**
  *   **Action:** Donate $1,000 vs. Walk Away.
  *   **Evidence:** Donation is evidentially correlated with being the "past-altruist" type (who receives $1M).
  *   **Probabilities:** Assume P(Altruist | Donate) = 0.9, P(Altruist | Walk) = 0.1.
  *   **Screening-Off:** The objection claims your current choice is merely a symptom of a fixed disposition you already know. Here, you *do not* know your disposition; the haziness of your past self creates genuine uncertainty about your type. Your current action provides new evidence about that hidden variable, so EDT sees an expected utility gain ($900k vs $0) outweighing the cost. CDT sees the box as already sealed; your action cannot causally open it, so you lose the $1,000. FDT says don't bother: the prediction was based on physical traces (letters) produced by a past instance of you that is psychologically and logically discontinuous from your current decision procedure. Since your current algorithm cannot subjunctively determine the output of a disjoint past algorithm, FDT treats this as causally inert. *(Note: This FDT verdict requires stipulating the logical discontinuity between past and present selves; without that stipulation, standard FDT might treat the type as a logical constant and cooperate.)*

  **Ablations**
  1.  **Record includes post-announcement conduct:** The trustee waits for your current choice. CDT shifts to "Donate" because your action now causally influences the payoff. EDT and FDT remain "Donate."
  2.  **Predictor models current decision procedure:** The trustee simulates your current algorithm rather than reading old letters. FDT shifts to "Donate" because subjunctive dependence is restored; your decision now logically determines the simulation's output. CDT remains "Don't Donate."

  **CDT Objection**
  A causal decision theorist would argue this isn't a Basilisk because there is no strategic leverage; the trustee's decision is a fixed fact of the past, not a contingent threat. The "punishment" is merely an unfavorable initial condition, not a response to your choice. This objection is fair insofar as it denies the normative force of the threat, but it misses the phenomenological point: the agent still faces a decision problem where evidential reasoning prescribes action while causal reasoning prescribes inaction, replicating the Basilisk's psychological grip without the sci-fi machinery.
