      *   *Refined Decision:* Mara (Weberian) will win. The argument will be that even in startups, the *valuation* of that discipline is cultural. The VC metrics are the structure, but the *willingness* to submit to them is the cultural/ethical shift. The "elective affinity" holds because the mindset precedes the profit.
      *   *Actually, let's look at the "collapse" option.* Does the startup analogy collapse Weber? If the "calling" is just greed disguised, Weber collapses. If the "calling" is genuine belief in disruption, Weber stands.
      *   *Let's go with Mara winning.* It allows for a more interesting philosophical conclusion about the power of ideas. Jonah will be the skeptic who gets cornered by the nuance of the startup analogy.

