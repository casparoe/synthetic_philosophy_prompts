  The pub was thick with the smell of stale ale and damp coats, the sort of place where the lights were always dimmed to hide the grime. Mara swirled the dregs of her porter, watching the foam cling to the glass. Across the table, Jonah was leaning forward, elbows digging into the sticky wood, his finger jabbing the air between them.

  'It's mysticism, Mara. Pure and simple,' Jonah said, his voice rising over the clatter of glasses. 'You're telling me a bunch of Calvinists invented modern capitalism because they were worried about hell? Give over. They invented it because they had the capital, the trade routes, and the labour power. The theology was just the brochure.'

  Mara set her glass down with a precise click. 'That's the vulgar Marxist reading, and you know it. You're reducing ideas to exhaust fumes. Weber wasn't saying theology built the factories. He was saying the *ethos* made the factory possible. You need a certain type of human being to run a capitalist machine. One who sees work as a calling, not just a way to keep the wolf from the door.'

  'And where does that human being come from?' Jonah countered, snatching a crisp from the bowl. 'Material conditions. When you secure property rights and enforce contracts, you create a behaviour pattern. People adapt. Then they write sermons to justify why working sixteen hours a day is "godly". It's post-hoc rationalisation. The economics comes first; the culture is the story we tell ourselves to sleep at night.'

  'But it doesn't stick unless it resonates,' Mara insisted, leaning in. 'That's the elective affinity. It's not cause and effect in a straight line. It's a chemical reaction. The religious ethic and the economic spirit fit together because they share a structure. Inner-worldly asceticism. Denying yourself pleasure now to build something later.'

  'Denying yourself?' Jonah laughed, a short, barking sound. 'Please. Nobody denies themselves anything unless they think there's a payout. It's deferred gratification, not asceticism. There's a difference. One is psychology, the other is theology.'

  'Is there?' Mara's eyes narrowed. 'Let's take it out of the seventeenth century. Look at the startup culture in Shoreditch or Silicon Valley. You've got founders sleeping under desks, eating ramen for years, burning out by thirty. They talk about "disruption" like it's a moral imperative. They use the language of mission and vision. Where's the material interest there?'

  'Equity,' Jonah said instantly. 'Stock options. The dream of the exit. It's pure greed dressed up in hoodies.'

  'But the maths doesn't work,' Mara pressed. 'The expected value of a startup is negative. Any rational economic actor knows the lottery ticket is worthless. Yet they labour with monk-like discipline. They virtue-signal their own exhaustion. "I haven't slept in three days" is a badge of honour, not a complaint. That's not rational calculation, Jonah. That's an ethic.'

  Jonah paused, his hand hovering over his pint. He frowned, thinking it through. 'Alright, grant you the irrationality. But isn't that just the VC metrics driving it? The venture capitalists set the KPIs, the growth targets. The founders are dancing to the tune of the capital providers. The material structure of venture capital demands that asceticism. If you don't hustle, you don't get the series A. The culture is coerced by the money.'

  'That's where you're missing the affinity,' Mara said, her voice dropping, sharper now. 'If it were just coercion, you'd have resistance. Sabotage. Quiet quitting. But you don't. You have true believers. They *internalise* the metrics. They don't view the VC targets as external pressure; they view them as a measure of their own moral worth. The metric becomes the virtue.'

  She tapped the table. 'Weber's point was that the cage becomes invisible. In the Protestant Ethic, you didn't work because the pastor was watching; you worked because you needed to know you were saved. In startup culture, you don't work because the VC is watching; you work because you need to know you're a "builder". The discipline is self-imposed. The economics provides the structure, yes, but the culture provides the fuel. Without that cultural shift, without that elective affinity between the worker's psyche and the demand for endless growth, the system stalls.'

  Jonah sat back, picking at the label on his bottle. He looked out at the bar, where a group of students were laughing too loudly. He was silent for a long moment.

  'So you're saying the VC metrics function like predestination?' he asked quietly.

  'Functionally, yes,' Mara said. 'You can't know if you're saved until the IPO. So you must work tirelessly in the meantime to prove you are among the elect. The material incentive is there, but it's insufficient to explain the intensity. You can pay people to work hard, but you can't pay them to believe their work is a salvation narrative. That has to be cultural.'

  Jonah sighed, rubbing his face. 'If the culture is self-sustaining... if the workers police themselves based on a value system that prioritises growth over wellbeing...' He looked back at her. 'Then trying to change the economics won't change the behaviour.'

  'Exactly,' Mara said. 'You could nationalise the tech firms tomorrow. If the culture of ascetic productivity remains, if the elective affinity between the worker and the metric holds, you'll just get state capitalism with better benefits. The culture causes the behaviour, Jonah. The economics just gives it a shape.'

  Jonah lifted his pint, a grudging respect in his eyes. 'Bloody hell. You've just argued that we're trapped in a secular monastery of our own making.'

  'We built the cage because we believed it was holy,' Mara said, finally taking a sip of her warm porter. 'That's the tragedy. And that's why Weber was right. Ideas have teeth.'

  Jonah clinked his bottle against her glass. 'Fine. You win the round. But next time, we're discussing whether the monarchy is actually useful, and I'm bringing data.'

  'Data won't save you from the narrative,' Mara smiled.

  'We'll see,' Jonah muttered, but he looked defeated. He signalled the landlord for another round, knowing he'd be paying.
