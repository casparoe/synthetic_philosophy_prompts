answer: |-
  # Workshop Design: The Migration Cascade Simulation

  ## 1. Overview and Parameters
  *   **Title:** The Legacy Migration Cascade
  *   **Duration:** 90 Minutes (10 Setup, 35 Gameplay, 45 Debrief)
  *   **Participants:** 16 Total (14 Decision Makers, 2 Observers)
  *   **Metaphor:** Engineering Governance (Database Migration)
  *   **Goal:** Experience how rational individual decisions based on public history can override private evidence, leading to collective failure, and how reputation costs prevent correction.

  ## 2. Roles and Setup (10 Minutes)
  *   **Decision Makers (14):** Arranged in a visible linear sequence (Seat 1 to Seat 14). They represent engineers reviewing a migration commit.
  *   **Observers (2):** Seated apart with clipboards. They record the sequence of votes and the final outcome. They do not speak or act.
  *   **Facilitator:** You. You manage the state, distribute signals, and track scores.
  *   **Materials:**
      *   14 identical opaque envelopes per round.
      *   Whiteboard for public vote tracking.
      *   Scoreboard (Group Pot vs. Individual Reputation).
      *   "True State" cards (Safe/Unsafe).
      *   Signal cards (Pass/Fail) to place inside envelopes.

  ## 3. Mechanics and Payoff Structure
  *   **The State:** The database migration is either **Safe** (Good) or **Unsafe** (Bad). This is determined by you at the start of each round.
  *   **Private Signals:** Each Decision Maker receives an envelope containing a stress-test result: **PASS** or **FAIL**.
      *   Signals are noisy. They are correct 70% of the time.
      *   If State is **Safe**: 70% of envelopes contain PASS, 30% FAIL.
      *   If State is **Unsafe**: 70% of envelopes contain FAIL, 30% PASS.
  *   **Public Action:** In sequence (1 to 14), each participant stands and declares **"APPROVE"** (Migrate) or **"BLOCK"** (Do Not Migrate). This is written on the whiteboard.
  *   **The Rebase Window:** After all 14 votes are cast, you announce a 2-minute "Commit Window."
      *   Any participant may raise their hand to **Rebase** (change their vote).
      *   **Cost:** Rebasing costs **-5 Reputation Points**.
      *   **Benefit:** Changing a vote may flip the Group Majority.
  *   **Payoffs:**
      *   **Group Pot:** If the Final Majority Vote matches the True State, everyone receives a $5 coffee voucher.
      *   **Individual Reputation:**
          *   Start each round with 10 points.
          *   Ending with a vote consistent with the Final Majority: **+5 Points**.
          *   Rebasing (changing vote): **-5 Points**.
          *   *Note:* This structure incentivizes sticking with the crowd (consistency) over correcting errors, mimicking professional reputation risk.

  ## 4. Gameplay Timeline (35 Minutes)
  *   **Round 1 (Baseline):** Random signal distribution. True State = Safe.
      *   *Goal:* Acclimate participants to the rules.
      *   *Duration:* 10 Minutes.
  *   **Round 2 (The Cascade):** Engineered signal distribution. True State = **Unsafe**.
      *   *Engineering:* Manually ensure Seats 1 and 2 receive **PASS** signals despite the State being Unsafe. The rest are distributed normally (70% FAIL).
      *   *Goal:* Trigger a false cascade early. Participants 3+ will see two Approvals and likely ignore their own FAIL signals.
      *   *Duration:* 12 Minutes.
  *   **Round 3 (The Rebase Tension):** Random signal distribution. True State = Safe.
      *   *Goal:* Test if the Rebase Penalty prevents correction if a cascade forms.
      *   *Duration:* 13 Minutes.

  ## 5. Engineering the Cascade
  To ensure the cascade emerges without you prompting them during the act:
  *   **Signal-to-Noise Ratio:** Set signal accuracy to 70%. This is high enough to feel trustworthy but low enough that two contradictory public actions outweigh one private signal.
  *   **Visibility:** Every actor must see the whiteboard history of all prior votes before acting.
  *   **The Trigger (Round 2):** By manually assigning "PASS" to the first two actors in an "Unsafe" round, you create an initial public history of [APPROVE, APPROVE].
      *   *Math:* Actor 3 receives a private signal. If it is FAIL (likely, since State is Unsafe), they face a conflict. Two public APPROVEs outweigh one private FAIL signal in Bayesian logic (2 public actions > 1 private signal). Rational Actor 3 ignores their private evidence and votes APPROVE.
      *   *Lock-in:* Actor 4 sees [APPROVE, APPROVE, APPROVE]. Even if they have a FAIL signal, the weight of public history is now overwhelming. The cascade locks.
  *   **No Prompting:** Once envelopes are distributed, you do not speak until the Rebase Window. The cascade emerges from the math of the signals, not your instruction.

  ## 6. Structured Debrief (45 Minutes)
  *   **Phase 1: The Experience (10 mins)**
      *   Ask Actors 3, 4, and 5: "What was in your envelope? Why did you vote that way?"
      *   *Expected Answer:* "I had a FAIL, but everyone else approved. I assumed their tests passed."
      *   *Concept:* **Bayesian Updating.** They treated predecessors' actions as information equal to or greater than their own private data.
  *   **Phase 2: The Rebase Penalty (15 mins)**
      *   Ask anyone who considered rebasing but didn't: "What stopped you?"
      *   *Expected Answer:* "I didn't want to look indecisive," or "The cost wasn't worth it unless I was sure I could flip the vote."
      *   *Concept:* **Social Rationality vs. Epistemic Loyalty.** It was individually rational to stay wrong (protect reputation) even if collectively harmful.
  *   **Phase 3: Collective Rationality (10 mins)**
      *   Reveal the True States for all rounds.
      *   Highlight Round 2: The group had enough private FAIL signals to block the migration, but the public history suppressed them.
      *   *Concept:* **Information Suppression.** Private knowledge was not aggregated; it was discarded.
  *   **Phase 4: Engineering Application (10 mins)**
      *   Discuss real-world equivalents: Code reviews where senior devs approve first, incident response where early diagnoses stick, or roadmap planning where early commitments lock out better later ideas.
      *   Ask: "How do we design processes that protect private signals?" (e.g., simultaneous voting, anonymous reviews, blinding early approvers).

  ## 7. Honest Limitation
  *   **Feature:** **Precise Quantitative Belief Revision.**
  *   **Explanation:** In the theoretical model, agents calculate exact probabilities (e.g., "Given 2 approves and 1 fail, the probability of Safe is X%"). In this physical simulation, participants use heuristics and gut feeling ("It looks like everyone else says yes"). They do not perform actual Bayesian math.
  *   **Verbal Supply:** During the debrief, explicitly state: "You didn't calculate odds today; you felt social pressure. In reality, the math dictates that after just two matching public votes, your private signal becomes mathematically irrelevant. You felt the pressure, but the theory says your private information literally lost all weight."

  ## 8. Predicted Failure Mode and Mitigation
  *   **Failure Mode:** **Dominant Personality Breaking Sequence.**
      *   *Risk:* A senior engineer (Seat 5) might turn to Seat 6 and say, "This looks wrong, what did you get?" breaking the isolation of private information.
      *   *Mitigation:* Enforce a "Silent Protocol." Before Round 1, establish that any verbal communication outside of the declared vote results in immediate disqualification from the Group Pot for that round. Stand physically between participants if necessary during the decision phase. Remind them that in distributed systems, nodes don't talk side-channel; neither do they.
  *   **Secondary Risk:** **Envelope Handling Leakage.**
      *   *Risk:* Participants shake envelopes or see card edges.
      *   *Mitigation:* Use thick cardstock folded identically. Shuffle envelopes thoroughly in view of the group before distribution to prove randomness.

