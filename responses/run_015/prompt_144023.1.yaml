answer: |-
  Your intuition is remarkably close to the classical Nyaya position, specifically the Navya-Nyaya (New Logic) refinements. You have correctly identified that a *pramana* is defined by its **causal role**, not just its sensory channel. However, your "content-fixing" rule is missing two critical Nyaya constraints: **Novelty (*anadhigata*)** and the distinction between **Instrumental Cause (*karana*)** vs. **Collaborative Conditions (*sahakari*)**.

  Here is the diagnosis of your rule, the repair, and the application to your hard cases.

  ### 1. Diagnosing Your "Content-Fixing" Rule

  **Your Rule:** A *pramana* is whatever fixes the content—the thing that answers "how do you know?" and whose failure would make the cognition false.

  **Where it works:**
  *   **Case 2 (Text):** Correct. The pixels are conditions; the speaker's intent/truthfulness is the *karana* (instrument). Hence *Shabda*.
  *   **Case 4 (Sign):** Correct. A sign is "frozen testimony." Nyaya treats written words as *shabda* because the knowledge arises from understanding the meaning of the symbols, not just perceiving the ink.
  *   **Case 9 (Tarka):** Correct. *Tarka* (reductio ad absurdum) clears doubt but doesn't establish truth on its own. It is a *sahakari* (helper) to Inference, not a *pramana*.

  **Where it breaks:**
  *   **Case 3 (Recognition):** You say memory is "load-bearing." Nyaya agrees memory is necessary, **but** memory alone cannot generate *new* knowledge of a *present* object. The *karana* here is the **current sense-contact** (*indriya-sannikarsa*) which activates the memory. Without the current sight, you only have memory (not a *pramana*). With the sight, you have Perception (*pratyaksha*). The "content-fixing" element for the *validity* of the identification *now* is the perception.
  *   **Case 6 (Thermometer):** Your sliding verdict reveals a confusion between *Pramana* (source) and *Prama* (valid cognition).
      *   If the thermometer works: It is an extension of the senses. Source = Perception.
      *   If the thermometer is uncalibrated/unreliable: The source is *still* Perception, but the cognition is **invalid** (*apramā*).
      *   If you trust it *only* because "the guy who made it said so": Now the *karana* shifts to the maker's reliability. Source = Testimony (*Shabda*).
      *   *Correction:* The *type* of pramana doesn't slide; your assessment of the *warrant* does.
  *   **Case 8a/8b (The Redundancy Puzzle):** Your "content-fixing" rule fails here because in both 8a and 8b, the content ("there is fire") is already fixed by the inference. Why is 8b knowledge and 8a not?
      *   **The Missing Constraint:** *Anadhigata* (Novelty). A *pramana* must produce knowledge **not previously held**.
      *   In 8a, the testimony adds no new truth and no new *mode* of access that counts as epistemic gain. It is psychologically reassuring but epistemically redundant.
      *   In 8b, Perception is qualitatively distinct from Inference. Nyaya argues perceptual knowledge has a "directness" (*sakaratva*) that inference lacks. However, strictly speaking, if the proposition is *identical* ("Fire exists there"), some Naiyayikas argue 8b is also not *prama* because it lacks novelty. But most accept that **perceptual certainty** overrides **inferential probability**, making it a new *valid* cognition in terms of certainty.

  ### 2. The Repaired Rule

  To save your verdicts and align with Nyaya, adopt this definition:

  > A **Pramana** is the **irreducible instrumental cause (*karana*)** that generates a **novel (*anadhigata*) true cognition (*prama*)**.

  **Two Tests for Individuation:**
  1.  **The Irreducibility Test:** Can this cognition be generated by the other three *pramanas* without losing its specific character (e.g., directness, certainty, mode of presentation)? If yes, it's a distinct *pramana*.
  2.  **The Novelty Test:** Does this cognition present the object as **not previously cognized** in this specific mode?

  ### 3. Fixing Your Shaky Verdicts

  *   **Case 3 (Recognition):** Verdict = **Perception**.
      *   *Why:* Memory supplies the concept ("roommate"), but Perception supplies the *existence* and *presence*. The *karana* is the eye-contact. Memory is merely a *sahakari* (collaborator).
  *   **Case 5 (Absence/Keys):** Verdict = **Perception**.
      *   *Why:* Classical Nyaya subsumes absence (*abhava*) under Perception. You perceive the "emptiness" of the counter directly. You do not infer it (no middle term). It passes the Irreducibility Test (Inference requires a positive mark; Absence does not).
  *   **Case 6 (Thermometer):** Verdict = **Perception** (via instrument).
      *   *Why:* The instrument is an extension of the sense organ. The "sliding" you feel is about *doubt* (*samsaya*), not *pramana* type. If the calibration is unknown, you have doubt, not *prama*. If you rely on the calibrator's word, you are mixing *Shabda* (warrant) with *Pratyaksha* (source).
  *   **Case 7 (Upamana/Tapir):** Verdict = **Upamana**.
      *   *Why:* The guide (*Shabda*) gives the rule ("looks like a pig"). But the *knowledge* ("This is a tapir") arises only when you perceive the **similarity** (*sadrishya*). The *karana* is the recognition of similarity, not the words. The words are just the condition.
  *   **Case 11 (Overheard/Context):** Verdict = **Inference (*Anumana*)**.
      *   *Why:* You are inferring the mental state (anger) from the sign (tone/words) based on a pervasion you know ("people speak this way when angry"). It is not *Shabda* because you don't trust the speaker; you are decoding them.

  ### 4. Solving the 8a/8b Puzzle

  **The Problem:** Structurally, both are second sources confirming a proposition known via inference. Why is 8b (Seeing) knowledge and 8a (Texting) not?

  **The Nyaya Solution:**
  *   **8a (Text):** Fails the **Novelty Test**. You already know "Fire is there." The text confirms it but adds no new *epistemic mode*. It is *jñāna* (cognition) but not *pramā* (valid *new* cognition).
  *   **8b (Seeing):** Passes the **Irreducibility Test**. Perceptual knowledge removes the "mediation" of the mark (smoke). It provides *direct* contact. Even if the proposition is the same, the *cognition* is of a different species (Direct vs. Mediated).

  **The Smallest Change to Flip the Verdict:**
  *   **To make 8a count as Pramana:** The text must add a **qualifier** not available to inference.
      *   *Change:* You infer "Fire." Roommate texts "It's an **electrical** fire."
      *   *Result:* Now the content is novel. *Shabda* is the *pramana* for the *type* of fire.
  *   **To make 8b NOT count as Pramana:** The perception must be **non-determinative**.
      *   *Change:* You infer "Fire." You walk in and see **holographic flames** (or a movie screen).
      *   *Result:* Your perception is invalid (*apramā*). You retain only the inference. Or, if you see real fire but you *already knew with 100% certainty* via inference, strict Navya-Nyaya might argue the perceptual cognition is not *prama* regarding the *existence* of fire, only regarding the *appearance*. But practically, 8b stands because perception cures the *doubt* that inference always leaves behind.

  ### 5. Application to Your New Test Cases

  **(i) A dog knowing his owner is home from the smell.**
  *   **Verdict:** **Perception (*Pratyaksha*).**
  *   **Reasoning:** Smell is a sense object (*gandha*). The cognition arises from sense-contact.
  *   **Nuance:** Nyaya generally reserves the term *Prama* (valid knowledge leading to successful action/liberation) for humans. Animals have cognition (*jñāna*) and successful action, but they lack the reflective validation (*anuvyavasaya*) required for full epistemic status. Structurally, however, it is Perception.

  **(ii) Coming to know from a photograph that it rained last night.**
  *   **Verdict:** **Inference (*Anumana*).**
  *   **Reasoning:** You perceive the photo (Perception). You know the pervasion "Wet marks on this surface are caused by rain" (or "Photos depict reality"). You infer the past event (rain) from the present mark (photo).
  *   **Why not Perception?** You do not perceive the rain; you perceive the *image* of the rain. It is mediated.
  *   **Why not Testimony?** Unless the photo is signed/sealed by a trustworthy agent asserting "It rained," it is a natural sign, like smoke.

  **(iii) The same proposition learned by testimony from two people who both got it from one person.**
  *   **Verdict:** **Testimony (*Shabda*).** (And only one instance of *Prama*).
  *   **Reasoning:** The *karana* is the trustworthy statement. The second speaker adds no new *instrumentality*.
  *   **Novelty Check:** Since you already know the proposition from Speaker A, Speaker B's statement fails the **Novelty Test**. It is not a new *pramana* event. It is merely corroboration. If Speaker A was doubtful and Speaker B removes the doubt, Speaker B's statement functions as the *decisive* *pramana*, but technically the knowledge arises from the *combined* weight removing doubt, not a second source of truth.

  ### 6. A Note on Historical Dissent (The "Names and Dates" you didn't want, but need for context)

  Your intuitions on Cases 3, 5, and 7 track the **Navya-Nyaya** (c. 14th century onwards, Gangesha) position. Earlier Nyaya and other schools disagree:

  *   **Case 3 (Recognition):** Buddhists deny Recognition is valid at all (momentariness means you can't see the "same" person). Mimamsa (Prabhakara) argues Recognition is a **Fifth Pramana** (*Pratyabhijna*), irreducible to Perception + Memory. If you follow Prabhakara, your "grudging" verdict in Case 3 is wrong; it *is* its own thing.
  *   **Case 5 (Absence):** Mimamsa (Bhatta) argues Absence is a **Sixth Pramana** (*Anupalabdhi*). They argue you cannot "perceive" nothingness. If you follow them, your refusal to add a fifth pramana in Case 5 forces you to call it Inference (which feels wrong, as you noted).
  *   **Case 7 (Upamana):** Buddhists reject *Upamana* entirely, reducing it to Inference (similarity is a mark). If you follow Dignaga/Dharmakirti, Case 7 is just *Anumana*.

  **Summary for your Course:**
  Stick to the **Fourfold Nyaya List**.
  1.  **Individuation:** Based on the unique *Karana* (Sense contact, Mark+Pervasion, Similarity, Trustworthy Statement).
  2.  **Validity:** Requires *Anadhigata* (Novelty).
  3.  **Your Rule Repair:** "A *pramana* is the irreducible instrumental cause of a novel true cognition."

