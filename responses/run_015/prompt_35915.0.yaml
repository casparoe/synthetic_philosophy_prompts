answer: |-
  Subject: Re: Competence collapse in IDA scenarios

  Hi there,

  It was great to hear about the seminar progress, and I appreciate you reaching out with this challenge. The standard worry about alignment drift is certainly the dominant narrative in the literature, precisely because it is the most catastrophic failure mode, but your intuition that the mirror image is both harder to construct and potentially more illuminating about the mechanics of distillation is spot on. Constructing a case where alignment remains pinned to human reflective endorsement while competence systematically degrades requires us to isolate the information loss inherent in the decomposition and distillation steps themselves, rather than attributing it to human error or malicious optimization. I have spent some time thinking about your constraints, particularly the requirement that the decomposition strategy be reasonable and mundane, and I believe I have a scenario that fits the bill, though I will be honest about where the construction feels fragile.

  Imagine a mid-sized software company where a product team is deciding whether to ship a new interface feature. The decision relies on a senior product manager, let us call her Elena, who has years of experience and a well-calibrated intuition for how users interact with complex workflows. Her intuition is holistic; she looks at a prototype and simultaneously processes visual balance, cognitive load, timing, and brand consistency, arriving at a judgment that often outperforms a checklist of those same factors because she implicitly weights their interactions. For instance, she knows that a slightly higher cognitive load is acceptable if the visual balance is exceptionally calming, but unacceptable if the timing is also slow. This is not a secret rule she hides; it is a tacit integration of factors that she herself cannot fully articulate without losing fidelity. The scalable oversight setup here involves Elena decomposing the shipping decision into subquestions about specific factors, consulting amplified copies of herself or distilled models on those factors, and then combining the answers. The distillation step trains a student model on the transcripts of these consultations to serve as the subconsultant in the next round. The goal is aligned throughout: everyone wants to ship the feature if and only if it improves the user experience. No one is trying to game metrics or seize power.

  In the first round of amplification, Elena faces the question of whether to ship Feature Alpha. She employs a standard, reasonable decomposition strategy known as factorwise evaluation, breaking the main question into subquestions like Is the visual design consistent? Is the cognitive load acceptable? Is the latency within bounds? This is a rational strategy because evaluating all possible interactions between factors is combinatorially explosive and beyond human working memory. In this first round, the subconsultants are effectively Elena herself, taking time to focus on each factor in isolation. She answers each subquestion using her full holistic intuition, but crucially, she must record her reasoning in the transcript to facilitate distillation. She writes down explicit justifications like Visual design is consistent because margins match the style guide, even though her actual judgment relied on a vague sense of balance that the text does not capture. The distillation process trains the first student model, Model One, to predict Elena's answers based on these transcripts. Model One learns to associate explicit features with explicit verdicts. It becomes a competent classifier of individual factors based on articulated rules, but it lacks the tacit weighting function Elena used to integrate them. It is aligned, meaning it sincerely tries to answer the subquestions as Elena would, but it is structurally blind to the non-linear interactions that live outside the explicit transcript.

  Now we move to the second round. Elena faces Feature Beta. She again decomposes the question into the same factors. This time, however, the subconsultants are instances of Model One. When asked Is the cognitive load acceptable?, Model One analyzes the interface against the explicit rules it learned from the Round One transcripts. It misses the nuance that Elena would have caught, perhaps judging the load as acceptable because it meets the stated heuristic, failing to see that combined with the specific latency of this feature, it will frustrate users. Model One answers honestly and helpfully, preserving alignment, but its answer is less competent than Elena's would have been. Elena, trusting the decomposition framework, accepts these subanswers as ground truth for the factors and combines them into a final shipping decision. Because the subanswers missed the interaction effects, her final decision is worse than if she had just used her gut alone. She ships a feature that users find frustrating. The transcript of this round records a decision process that is logically consistent but empirically wrong. Distillation then creates Model Two based on this transcript. Model Two learns to replicate the reasoning patterns of Round Two, which includes relying on the factorwise heuristics that failed to capture interactions. It inherits the blindness of Model One and adds the noise of Elena's compromised decision. By Round Three, the subconsultants are so blind to interactions that even simple features are misjudged, and the system becomes reliably useless, worse than Elena working alone, while remaining perfectly aligned with the goal of improving user experience.

  The structural feature doing the work here is what we might call the explicitation bottleneck inherent in distillation. The human expert possesses competence encoded in high-dimensional, sub-symbolic weights that allow for holistic pattern recognition. The decomposition step forces this competence into a low-dimensional, symbolic format suitable for communication and training data. Information is lost in this compression, specifically the interaction terms that were not explicitly queried. The distillation step then trains a model that can only access the symbolic representation, not the original sub-symbolic intuition. When this model serves as a subconsultant, it provides answers that are locally consistent but globally impoverished. The human overseer, bound by the same decomposition strategy, cannot recover the lost information because they are relying on the subanswers to fill in the details they cannot hold in working memory. If you remove this feature, by which I mean if you allow the distillation to train on the human's neural activations directly or if you allow the decomposition to query all interaction terms, the competence loss disappears. But querying all interactions is computationally infeasible, and training on neural activations is not distillation in the sense of learning from behavior and transcripts. Thus, the loss is structural to the IDA loop as defined.

  A defender of iterated amplification would likely attack this case on two fronts, focusing on the brittleness of the decomposition and the weakness of the distillation. They would argue that a reasonable decomposition strategy should not be static. If Elena notices that Model One is missing interaction effects in Round Two, a competent overseer should update the decomposition strategy in Round Three to include subquestions about specific interactions, such as Is the cognitive load acceptable given the current latency? They would claim that my scenario assumes an unrealistically rigid decomposition protocol that fails to adapt to the capabilities of the distillate. Furthermore, they would argue that the distillation step is unfairly constrained. If the model is failing to capture the nuance, the defender would suggest that the training regime is too weak, perhaps relying only on final outputs rather than intermediate reasoning states, or that the model architecture is insufficient to approximate the human's function even given the transcripts. They would say that a sufficiently powerful distillation process should be able to infer the implicit weighting rules from enough examples of Elena's explicit judgments, effectively reconstructing the tacit knowledge from the shadows it casts on the explicit data.

  I am moderately confident in the plausibility of this construction, but I want to be honest about where I suspect the case cheats. The point I am least sure about is the assumption that Elena cannot update her decomposition strategy to recover the lost competence. In a real iterative process, the human overseer is supposed to be learning how to oversee better. If the system becomes incompetent, a reflective human should notice the errors and adjust the questions to probe the missing information. My scenario relies on the decomposition strategy remaining fixed or failing to adapt quickly enough to prevent the cascade of errors, which might be an unfair characterization of the human's role in the loop. Additionally, there is a risk that I am smuggling in a flaw by assuming the distillation cannot recover the implicit rules. If the human's explicit justifications are correlated with their tacit judgments, a powerful enough model might learn the mapping even without the tacit knowledge being explicitly stated. The case holds only if the tacit knowledge is truly non-articulable and non-recoverable from the artifacts of articulation, which is a strong claim about the limits of machine learning relative to human cognition. Nevertheless, I think this explicitation bottleneck offers a credible path to competence collapse that keeps alignment intact, and it deserves more scrutiny than it currently receives in the standard safety literature.

  I hope this provides a useful starting point for your seminar discussion. It is a subtle failure mode because it looks like the system is working correctly on every local metric while failing globally, which is often the hardest kind of error to diagnose in real-world engineering. Let me know if you want to dig deeper into the specifics of the distillation step or if you think the defender's counterargument about adaptive decomposition completely dismantles the scenario.

  Best regards,

  Your Colleague
