          *   *Cons:* Is this just "human is flawed because they can't explain"? The prompt says "not out of a flaw you smuggle into the human". But inability to articulate tacit knowledge is a universal human constraint, not a specific flaw like overconfidence. However, if the human *could* answer directly using tacit knowledge, but the *process* forces them to decompose, the process is the bottleneck.
      *   *Idea 3: Conservative Distillation.* The distillation process favors high-confidence, low-variance answers. Over rounds, the system becomes overly conservative, losing the ability to take necessary risks or make nuanced calls.
          *   *Pros:* Structural.
          *   *Cons:* Might look like alignment drift (changing risk profile).
      *   *Idea 4: The "Average" Problem.* Distillation trains on the *output* of the amplification. If amplification involves aggregating sub-answers, maybe the aggregation smooths out the peaks of competence.
      *   *Idea 5: Loss of Holistic Integration.* This seems strongest. A human expert looks at a dataset and gets a "gestalt" sense. Decomposition forces them to break it into features. The sub-consultants evaluate features. The recombination sums them. The interaction effects are lost because the decomposition didn't explicitly query them (because there are too many possible interactions). The distillation learns the additive model. The next round uses the additive model. The system becomes linear in a non-linear world.
      *   *Refining Idea 5:* Let's make it about a product team deciding whether to launch a feature. The human PM has a "nose" for product-market fit that relies on subtle interactions between design, timing, and user sentiment. Decomposition forces them to evaluate these separately. The "reasonable" decomposition is to check each factor independently because checking all interactions is combinatorially explosive. This is a *rational* decomposition given cognitive limits. But it loses the synergy information. Distillation captures the additive model. Round 2 uses the additive model for subquestions. The system becomes blind to interactions. Alignment (wanting the best product) stays true, but competence (picking the best product) drops.

