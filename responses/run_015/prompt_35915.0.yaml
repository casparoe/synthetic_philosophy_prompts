      *   Key Mechanism: Where does competence live in a human that isn't captured by explicit decomposition? Intuition, holistic judgment, tacit knowledge, context that doesn't survive fragmentation.
      *   The "Distillation" step is crucial. The student model learns from the *transcript* of the amplification. If the transcript loses nuance required for high-level performance, the student becomes weaker.
      *   The "Amplification" step uses the student. If the student is weaker, the answers to subquestions are weaker, leading to a weaker combined answer.

