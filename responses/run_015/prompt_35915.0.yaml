      *   *Decomposition Strategy:* "Factorwise Evaluation." Break decision into independent criteria (Usability, Performance, Engagement, Risk). This is standard practice (reasonable).
      *   *Round 1:* Human decomposes. Subquestions sent to "copies" (simulated by the human taking time to focus on each). Actually, for IDA, the subconsultants are the *distilled model* from the previous round. Wait, Round 1 uses Human as subconsultant? Usually, IDA starts with Human as the base. Round 1 Amplification: Human decomposes, asks Human (or trivial model) subquestions. Distill into Model 1. Round 2 Amplification: Human decomposes, asks Model 1 subquestions. Distill into Model 2.
      *   *Correction on IDA mechanics:* In standard IDA (Christiano et al.), $H$ decomposes $Q$. $H$ calls $M_0$ (or $H$) on subquestions. Result is distilled into $M_1$. Then $H$ decomposes $Q$, calls $M_1$ on subquestions. Result distilled into $M_2$.
      *   *The Trap:* The human's intuition relies on holistic processing. The decomposition forces explicit reasoning. The distillation trains on the explicit reasoning traces. The model learns the explicit rules but not the holistic intuition. When the model answers subquestions in Round 2, it lacks the intuition. The human combines these "flat" answers. The final decision is worse.
      *   *Alignment:* The goal is always "Ship if it benefits users." The system never tries to hack metrics. It just fails to predict benefit accurately.
      *   *Round 1 Detail:* Human evaluates "Launch Feature Z?" Decomposes into "Is it usable?", "Is it fast?", "Do users want it?". Human answers these subquestions using their full intuition (since they are the subconsultant). The *transcript* records the answers and the explicit reasons given. Distillation trains on this. The model learns to map inputs to answers based on explicit reasons. It misses the tacit weighting.
