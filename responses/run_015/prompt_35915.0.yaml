prompt: |-
  I'm a second-year graduate student taking a seminar on scalable oversight, and we've just finished three weeks on iterated amplification and distillation: the setup where a human consultant is amplified by being allowed to decompose any question into subquestions and consult amplified copies of themselves on each one, where the resulting transcripts are distilled into a cheaper student model, and where that student then serves as the subconsultant in the next round of amplification, so that the system's abilities boot upwards from the human baseline while, in the ideal story, its goals stay pinned to whatever the human would endorse on reflection. The alignment worry we kept circling is the one everybody circles: decomposition might fail to commute with goal specification, so the distilled student optimizes something adjacent to but not identical with the original intent, and each round of distillation compounds the drift. Competence is assumed to survive the loop; alignment is the thing at risk.

  What I want from you is the mirror-image case, because I suspect it's the harder one to build and nobody in my seminar managed it. Construct a thought experiment in which the loop preserves alignment essentially perfectly while systematically destroying competence: at every round, the system's goals remain exactly what the original human would endorse on reflection — no mesa-optimization, no reward hacking, no values drifting toward power-seeking or proxy-chasing — and yet the system becomes reliably, structurally useless at achieving those goals, worse than the unamplified human was at the start. The constraints I care about are these. First, the setting should be mundane: a product team deciding whether to ship something, or a lab interpreting a dataset, nothing superintelligent and no science fiction. Second, and this is where my own attempts kept failing, the competence loss must fall out of the structure of decomposition and distillation themselves, not out of a flaw you smuggle into the human or the student. My sketch was that the human decomposes questions in a way that reflects their overconfidence about which subquestions matter, so each subconsultant answers its assigned subquestion perfectly and the errors compound at recombination — but my teaching assistant pointed out that this is just a bad human whose faults get faithfully copied, which makes the case about the input rather than the mechanism, and the same failure would show up if the human simply worked alone for many rounds. So the case has to be one where a perfectly reasonable decomposition strategy, applied honestly at every level, still loses something the human had, and where you can point at the step in the loop where it leaks. Third, the case must not stipulate the verdicts; they have to be generated, so that I can check that the alignment preservation and the competence destruction both follow from the setup rather than being inserted by fiat.

  After presenting the scenario, walk me through at least two full rounds of amplification and distillation, showing precisely where the competence degrades and arguing that alignment really does hold at each step. Then do three things: tell me which structural feature of the case is doing the work, and what happens to the verdicts if you remove that feature; tell me how a defender of iterated amplification would attack the case — where they'd say you've quietly assumed an unrealistically brittle decomposition or an unfairly weak distillation; and since this is speculative engineering rather than settled theory, be honest about how confident you are in the construction, flag the point you're least sure actually works, and name the step where you suspect the case cheats. Please write the whole thing as continuous prose, like a long email — no headings, bullet points, bold text, or tables.
