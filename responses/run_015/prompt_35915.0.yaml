      *   *Wait, does competence drop?* If Human answers subquestions in Round 1, competence is high there. The loss happens in Distillation 1 -> Model 1. Model 1 is less competent than Human. In Round 2, Human relies on Model 1. So the Amplified Human (Human + Model 1) is weaker than Amplified Human (Human + Human). If the goal is to bootstrap *beyond* human, this is normal. But the prompt wants competence to be *destroyed*, worse than the unamplified human at the start.
