          *   *Work:* Justifies liberty/property rights across time. Focuses on *associative* duties and intergenerational projects.

  3.  **Task 3: Disanalogies:**

      *   *Footrace Disanalogies:*
          *   Races end; life doesn't (until death).
          *   Races have one winner; society can have many flourishing people.
          *   Runners don't choose the race; citizens do (somewhat).
          *   *Relevance:* The "winner take all" aspect distorts the view of wealth as purely positional.
      *   *Relay Disanalogies:*
          *   Relay teams are voluntary associations; families are not (you don't choose your parents/children).
          *   Relay races have a fixed end; lineages aim for infinity.
          *   Batons are identical; bequests vary wildly in value.
          *   *Relevance:* The "voluntary" aspect is crucial. If I didn't choose the team, why should the team's rights trump my individual starting position?

  4.  **Task 4: Evaluating the Three Hidden Problems (Footrace):**

      *   *1. No Single Starting Gun (Continuous Advantage):*
          *   *Verdict:* High damage. It makes "equalizing the start" administratively and conceptually impossible. If advantage accrues continuously (e.g., legacy admissions, internships), taxing only at death misses most unfairness.
      *   *2. Preference Shaping (Adaptive Preferences):*
          *   *Verdict:* High damage. It challenges the *goal* of the race. If the rich train their kids to want quiet lives of leisure and the poor train kids to want grueling labor, equalizing resources doesn't equalize opportunity. It raises the "expensive tastes" objection.
      *   *3. Non-Positional Goods (Security vs. Winning):*
          *   *Verdict:* Critical damage. Inheritance often buys *security* (floor), not *status* (ceiling). A race metaphor implies we care about who wins. If inheritance just prevents ruin, taxing it looks like cruelty, not fairness.

  5.  **Task 5: Synthesis and Replacement:**

      *   *Does Relay Dissolve the Argument?* No. It shifts the burden. Now we must ask: *Why* is the lineage the moral unit? Does the right to transmit outweigh the right of the recipient to a fair chance? It restates the conflict (Liberty of Donor vs. Equality of Recipient) rather than solving it.
      *   *Rates and Distinctions:* Metaphors are bad at math. Neither picture yields a specific tax rate (50%? 90%?). Neither clearly distinguishes receipt vs. transmission without extra moral premises (e.g., donee vs. donor liability).
      *   *Replacement:* Need a framework that isn't sport-based.
