          *   *Idea 3:* Luck Egalitarianism (refined). Focus on brute luck vs. option luck, but acknowledging the "continuous" nature.
          *   *Best Fit:* A **Power/Dependency Framework**. Inheritance isn't about a race; it's about the distribution of *power* and *independence*. The goal isn't a fair start, but preventing feudal dynasties while allowing familial intimacy.

