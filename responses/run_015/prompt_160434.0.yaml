          *   *Better Idea for Unnatural:* "The shape with the most corners is black." (Requires counting and comparing). Or "Total area > X."
          *   *Best for "Unnatural":* "The number of shapes equals the number of letters in the color name." (Too linguistic).
          *   *Let's go with:* "The total number of vertices is a prime number." (CS students might like this, Phils might hate it). Or "The shapes are arranged in alphabetical order of their names (Circle, Square, Triangle)."
          *   *Actually, the prompt suggests:* "Total number of corners being prime." Let's use that. It's arithmetic, not perceptual.

  5.  **Refine the Scoring Mechanism (Round 2):**
      *   Goal: Punish confident wrongness.
      *   Mechanism: Each group gets 3 tokens. For each of the 6 test boxes, they must place a token on "IN", "OUT", or hold it back ("UNSURE").
