  4.  **Develop the Puzzles (The Core Content):**
      *   I need to design specific Bongard problems that allow for multiple valid interpretations.
      *   *Problem A (for Round 1 & 2):* Needs to support at least 2-3 distinct rules that fit the training data but diverge on test data.
