          *   Correct Classification with Token: +2 points.
          *   Incorrect Classification with Token: -2 points.
          *   No Token (Unsure): 0 points.
          *   Correct Classification without Token: +1 point (consolation).
      *   *Wait, simpler:* Just bet points. Start with 10 points. Bet 0-3 on each box.
      *   *Simpler still for 75 mins:* "Confidence Vote." Each group submits: IN, OUT, or PASS.
          *   IN/OUT Correct: +1
          *   IN/OUT Wrong: -1
          *   PASS: 0
          *   This punishes wrongness relative to passing.
      *   *To punish "Confident Wrongness" specifically:* Ask for a confidence level (1-3). Score = Confidence * (1 if correct, -1 if wrong). This is clean.

  6.  **Address the Risks:**
      *   *CS Brute-Force:* They might find the rule too fast. *Mitigation:* Make the training set small (6 vs 6) but ambiguous. Ensure the rules are semantic, not just pixel-counting.
      *   *Philosopher Passivity:* Assign roles. One "Scribe", one "Speaker", one "Devil's Advocate".
      *   *"Anything Goes" Nihilism:* If a group says "All rules are valid," acknowledge it but force them to pick one for the scoring round. "You must act to win the chocolate."
      *   *Meta-Round Cynicism:* If the intended rule is "Prime Corners," students might feel it's arbitrary. *Debrief Key:* Acknowledge it *is* arbitrary, but in ML, *someone* (the data generator) always has a bias. The point is recognizing *your* bias vs. *nature's* bias.

