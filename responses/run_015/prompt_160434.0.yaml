      *   *Round 3:* 15 mins. Give them 4 rules (all fit training). Ask which is *my* rule. Reveal.
      *   *Debrief:* 25 mins. Connect to Inductive Bias, Overfitting, No Free Lunch.

      *Wait, I need to check the timing again.* 14 students, 4 groups. Collecting papers, writing on board, explaining takes time.
      *   Round 1: 10 min discussion + 5 min board work = 15.
      *   Round 2: 5 min reveal + 5 min decision + 5 min scoring = 15.
