answer: |-
  **Project Title:** The Welfare Arithmetic of Habitat Loss: A Comparative Framework for Land-Use Decisions

  **Core Question and Reframing**
  The prevailing discourse in wild animal welfare often asks whether wild nature contains more suffering than happiness. Some infer from an affirmative answer that destroying habitat would, other things equal, reduce total suffering. This project refuses that framing. The aggregate question is empirically intractable and the wrong shape for anyone who actually has to choose between land uses. Instead, this nine-month fellowship asks: under what specified conditions does habitat conversion reduce expected suffering relative to credible counterfactuals, and when does it increase it? The goal is not to settle the total welfare of the biosphere, but to produce a decision-shaped framework that admits of a determinate answer within the scope of philosophical and modelling work possible in a year. The output will be a structured assessment of when conservation aligns with suffering reduction and when it might not, grounded in comparative welfare arithmetic rather than aggregate speculation.

  **Critique of the Familiar Stance**
  The argument that habitat loss reduces suffering is under-argued rather than merely unpopular. It relies on conflating distinct processes and ignoring temporal dynamics. First, three processes are routinely run together: outright destruction (conversion to a surface supporting almost no wild animals), conversion to a different productive use (arable land, pasture, urban), and degradation or fragmentation of habitat that remains broadly the same kind. These plausibly have very different welfare profiles. Degradation, for instance, may raise the numbers of small-bodied generalists while lowering those of specialists, which matters significantly if average welfare per animal falls while the headcount rises. Treating these as identical obscures the moral landscape.

  Second, any verdict must separate the transition from the new steady state. Clearing or burning causes a concentrated episode of dying. Even if the subsequent equilibrium contains less suffering per year, there is a payback period during which the transition cost dominates. This project will model how long that period would have to be before the policy-relevant verdict flips. Third, destruction is usually replacement, not erasure. I propose analysing the displacement ratio: the ratio between wild-animal life-years foreclosed in the destroyed habitat and the wild-animal life-years generated by whatever occupies the land afterwards. If that ratio is near or below one for common successor states such as farmland or regenerating scrub, a great deal of the standard argument quietly collapses. Relatedly, the elasticity of wild-animal population size with respect to habitat area may be low where populations are regulated by density-dependent factors rather than by area as such. In such cases, losing habitat produces a smaller steady-state reduction in numbers than the area lost suggests. The familiar stance ignores these mechanics, treating habitat loss as a simple subtraction of negative welfare units rather than a complex substitution of welfare technologies.

  **Methodology**
  The method is phased, avoiding both a full empirical review and a pure armchair argument. A full review is impossible given the uncertainty surrounding invertebrate sentience and population dynamics; a pure armchair argument risks irrelevance to actual land-use decisions.

  Phase one establishes the axiological scaffolding and unit of account. I will defend the unit of account against intuitive but misleading metrics. Per-hectare welfare accounting is insensitive to productivity: a hectare of estuary and a hectare of arid scrub are not comparable welfare technologies. Something like welfare-per-unit-of-primary-productivity may track the underlying biology better. That choice is not merely presentational; it can change the sign of the comparison between habitat types. Simultaneously, I will test how much of the framework survives if one takes a strongly person-affecting view rather than an impersonal one. If the relevant improvement must be person-affecting, the claim that non-existence benefits anyone becomes precarious, potentially dissolving the argument for destruction entirely.

  Phase two constructs a parametric model using the distinctions above. This model will not generate new empirical data. Instead, it will treat contested questions, such as invertebrate sentience, as parameters to be varied. The core variable will be the displacement ratio. I will map the logical space of possible outcomes based on ranges of plausible values for transition costs, steady-state welfare densities, and displacement ratios.

  Phase three involves sensitivity analysis against counterfactual baselines. The comparison cannot simply be destruction now versus preservation forever. It must consider destruction now versus destruction later by other causes, or versus restoration, and whether protecting one place merely displaces the pressure elsewhere. The model will test how robust the verdict is when the baseline shifts from ideal preservation to realistic political constraints.

  **Deliverables and Conclusions**
  The concrete deliverable will be a decision toolkit for conservation bodies weighing restoration or rewilding, and agricultural policymakers weighing set-aside. It will not be a licence to bulldoze. Rather, it will identify the specific empirical thresholds where the welfare case for conservation becomes weak or reverses. The range of possible conclusions includes: that conservation almost always reduces suffering; that it depends entirely on the successor land use; or that the sign of the effect is underdetermined by anything currently knowable.

  A genuine failure looks like the latter outcome. If the honest result is that the sign of the effect is underdetermined, that result is still worth funding. It would halt policy proposals based on shaky arithmetic and redirect attention to the specific empirical gaps that matter. It prevents the weaponisation of uncertainty. The scope explicitly excludes new empirical data collection. The project stands or falls on the logical coherence of the framework and the clarity of the parameters it identifies, not on settling the biology itself.

  **Epistemic Status**
  **Working Hypothesis:** The displacement ratio between wild habitat and common agricultural successor states is sufficiently high that habitat protection generally reduces expected suffering, even assuming wild lives are net negative. **Confidence Level:** Moderate (60 per cent). This is not a strong conviction but a working presumption based on the intuition that intensive agriculture supports fewer wild life-years than complex ecosystems, even if welfare per capita is higher on farms.

  **Weakest Assumption:** The single assumption most likely to be false is that population size scales linearly or predictably with habitat area. If density-dependent regulation is stronger than area dependence across most taxa, the welfare impact of habitat loss may be negligible regardless of the displacement ratio. The project will find this out early in phase two when attempting to populate the model with standard ecological relationships; if the relationships prove too volatile to model even parametrically, the approach will need revision.

  **Abandonment Criteria:** I would abandon the displacement-ratio approach altogether if it becomes clear that the welfare significance of 'wild-animal life-years' is incoherent under a person-affecting view. If non-existence cannot be a benefit, the entire arithmetic of foreclosed life-years collapses, and the project would pivot to focusing solely on transition costs and existing animal welfare.

  **Conceptual vs. Empirical:** The parts of the framework that are purely conceptual are the axiological scaffolding (impersonal vs. person-affecting) and the defence of the unit of account (productivity vs. area). These would survive any empirical verdict. The parts that stand or fall with the ecology are the displacement ratio magnitudes and the transition cost durations. These are contingent on the biological reality of how animals respond to land-use change. The project aims to secure the conceptual ground while mapping the contours of the empirical uncertainty.
