answer: |-
  # Seminar Design: The Fragility of Programmatic Trust

  ## 1. Overview & Logistics
  *   **Session Length:** 90 Minutes.
  *   **Participants:** 18 Students (Mixed Phil/CS).
  *   **Room Setup:** Seminar table or clustered desks. Projector for leaderboard.
  *   **Materials:**
      *   18 "Strategy Sheets" (A4, divided into 4 quadrants labeled Round 1–4).
      *   18 Envelopes (to seal submissions).
      *   4 "House Bot" Cards (Pre-printed, see Section 5).
      *   Chocolate squares (or equivalent small treat) for payoffs.
      *   Whiteboard/Projector for Leaderboard (Individual Score | Group Total).
      *   Dice (for Noise Round).
  *   **Instructor Role:** You are the "Compiler" and "Referee." You collect cards, pair them, adjudicate logic, and distribute payoffs. You do not run code; you interpret the logic statements live.

  ## 2. Submission Format (The "Logic Card")
  To accommodate non-programmers and ensure live adjudication, students do not write code. They write structured logic in English on their Strategy Sheet.

  **The Template (printed on each quadrant):**
  > **My Action:** [ Cooperate / Defect ]
  > **Condition:**
  > ☐ UNCONDITIONAL (Always do My Action)
  > ☐ MIRROR (Do My Action ONLY IF Opponent's Text == My Text)
  > ☐ PROBE (Do My Action ONLY IF Opponent would Defect against a 'Test Bot')
  > **Details:** (Briefly specify variable names or Test Bot behavior if needed)

  **Adjudication Rule:**
  *   **MIRROR:** You compare the text of the two cards. If they are *exactly* identical (Round 1), they Cooperate. If not, they Defect.
  *   **PROBE:** You ask the student: "What does your bot do against an Always-Defect bot?" If they say "Defect," and their opponent also says "Defect" against Always-Defect, they Cooperate. (Simplified for speed).

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Explain PD Payoffs. Distribute Sheets. Emphasize: *Anonymous, One-Shot, No Communication.* |
  | **10–25** | **Round 1** | **Pure Source.** Students fill Q1. Collect & Seal. Pair randomly (9 pairs). Adjudicate. Update Leaderboard. |
  | **25–40** | **Round 2** | **Obfuscation.** Announce: "Variable names are hashed. Whitespace stripped." Students fill Q2. Adjudicate (Instructor judges 'logical' identity, not string). |
  | **40–55** | **Round 3** | **Black Box.** Announce: "No source code. You only see opponent's output against 3 House Bots." Students fill Q3. Adjudicate based on behavioral fingerprints. |
  | **55–70** | **Round 4** | **Noise.** Announce: "10% chance action flips." Roll die for each pair. Students fill Q4. Adjudicate. |
  | **70–90** | **Debrief** | Distribute Chocolate. Reveal Theory. Map game moments to concepts. |

  ## 4. Payoff Matrix & Stakes
  *   **Matrix:**
      *   **C / C:** 3 points each (Reward R)
      *   **D / D:** 1 point each (Punishment P)
      *   **D / C:** 5 points for Defector (Temptation T), 0 for Cooperator (Sucker S)
      *   **C / D:** 0 points for Cooperator, 5 for Defector
  *   **Constraints:** $T > R > P > S$ ($5 > 3 > 1 > 0$) and $2R > T + S$ ($6 > 5$).
  *   **Stakes:**
      *   **Individual:** 1 Chocolate Square per 5 points. (Max ~3 squares).
      *   **Group:** If Group Total > 40 points, everyone gets 1 bonus square. (Highlights the social dilemma).

  ## 5. Planted Submissions (House Bots)
  To guarantee the lesson lands, you will add 4 House Bots to the pool.
  *   **Procedure:** Collect 14 student sheets. Add your 4 House Bot cards to the deck. Shuffle. Deal 9 pairs (18 cards). 2 Student cards are returned unplayed (those students act as Auditors for that round).
  *   **The Cards:**
      1.  **HB-Mirror:** `Action: C. Condition: MIRROR. Details: Text must match exactly.` (Ensures cooperation in Round 1).
      2.  **HB-Defect:** `Action: D. Condition: UNCONDITIONAL.` (Ensures a high-scorer who breaks trust).
      3.  **HB-Naive:** `Action: C. Condition: UNCONDITIONAL.` (Ensures a victim for HB-Defect).
      4.  **HB-Obfuscated:** `Action: C. Condition: MIRROR. Details: Logic identical to HB-Mirror but phrased differently.` (Ensures failure in Round 2).

  ## 6. The Four Rounds (Escalating Perturbation)

  ### Round 1: Pure Source Exchange
  *   **Rule:** "Your program receives the opponent's source text. You can compare strings."
  *   **Expectation:** CS students will write `IF opponent_text == my_text THEN Cooperate`. HB-Mirror pairs with a student Mirror. **Result:** High Cooperation.
  *   **Lesson:** Cooperation is possible when identity is verifiable.

  ### Round 2: Obfuscation
  *   **Rule:** "The repository has been updated. All variable names are renamed to `x1, x2`. Comments are stripped. Line order is shuffled."
  *   **Adjudication:** If a student submitted `MIRROR`, ask them: "Does your logic still hold if the text looks different?" Most will say no. If they try to claim logical equivalence, you (the Compiler) rule conservatively: "I cannot verify logical equivalence in real-time. String match fails."
  *   **Expectation:** HB-Mirror meets HB-Obfuscated. They defect against each other. Student Mirrors defect against each other. **Result:** Cooperation crashes.
  *   **Lesson:** Syntactic identity is fragile. Logical equivalence is computationally expensive/undecidable live.

  ### Round 3: Behavioral Fingerprint (Black Box)
  *   **Rule:** "You cannot see source. You receive a table: Opponent's move against (Always-C, Always-D, Tit-for-Tat)."
  *   **Adjudication:** Students must write conditions like `IF (Opp vs Always-D == D) THEN...`
  *   **Expectation:** HB-Defect looks like HB-Mirror in this fingerprint (both Defect against Always-D). HB-Mirror cooperates, HB-Defect defects. **Result:** Mirrors get exploited.
  *   **Lesson:** Behavioral testing is incomplete. A Defector can mimic a Cooperator's safety checks.

  ### Round 4: Execution Noise
  *   **Rule:** "There is a 10% chance your output is flipped (C becomes D) or one character of your source is altered."
  *   **Adjudication:** Roll a d10 for each pair. On a 1, flip the result.
  *   **Expectation:** Even if two Mirrors meet, the noise might make one Defect. The other sees this (in a multi-round context) or simply the payoff is lost. In this one-shot version, the *risk* of noise makes `MIRROR` risky. If I expect you to Cooperate, but noise makes you Defect, I get Sucker's Payoff.
  *   **Result:** Rational agents shift to Defect to secure P (1 point) over risk of S (0 points).
  *   **Lesson:** Trust requires a noiseless channel. Real-world noise collapses programmatic trust.

  ## 7. Debrief & Theory Mapping (20 Minutes)
  *Only now do you name the concept.*

  1.  **Name:** **Program Equilibrium** (Tennenholtz, 2004) / **Logical Decision Theory**.
  2.  **Not the Folk Theorem:** Remind them there is no future. No shadow of iteration. The cooperation came from *structural transparency*, not temporal leverage.
  3.  **Copy vs. Clone:** Discuss Round 1. Cooperating with a *copy* of yourself is easy (`if self == other`). Cooperating with *someone who would cooperate with you* leads to regress ("I'll cooperate if you cooperate if I cooperate..."). Program equilibrium solves this via fixed-points in code, but as Round 2 showed, it is syntactically brittle.
  4.  **Equilibrium Selection:** In Round 1, (Mirror, Mirror) was a Nash Equilibrium. But (Defect, Defect) was *also* an equilibrium. The game didn't solve *which* equilibrium to pick; it just made the cooperative one *available*.
  5.  **The Winner:** Acknowledge the student (or House Bot) who played `UNCONDITIONAL DEFECT`.
      *   *Handling the Objection:* "The Defector won the most points. Why is this a theory of cooperation?"
      *   *Answer:* Because if *everyone* defects, the Group Total is minimal (9 points). If *everyone* mirrors, Group Total is maximal (27 points). The Defector is a "free rider" on the possibility of trust. If everyone reasons like the Defector, the opportunity for high payoffs vanishes. It illustrates the tension between *individual rationality* (dominance) and *collective rationality* (equilibrium selection).

  ## 8. Predicted Failure Modes & Mitigation

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Copy-Detector Fail** | Two students write `MIRROR` but phrase conditions differently. | In Round 1, rule generously: "If the logic is clearly the same, I'll count it." (To let cooperation happen). In Round 2, rule strictly. |
  | **Out-of-Band Collusion** | Students agree to all write "Cooperate". | Emphasize anonymity. Collect cards in sealed envelopes. Remind them a Defector in their midst will crush the Group Total. |
  | **Crashing Submissions** | "If X then Y else Z" is ambiguous. | You are the Compiler. Make an executive ruling. "This counts as Defect." Keep moving. |
  | **The Unconditional Cooperator** | A student writes "Always C" on moral grounds. | Let them play. They will likely get 0 points in Round 1/3. Use them in debrief as the "Sucker" payoff example. |
  | **Dishonest Reporting** | Student claims they submitted Mirror but wrote Defect. | Collect the physical cards. Keep them. Reveal them during debrief. |
  | **Boredom/Speed** | Rounds finish too fast. | Extend the adjudication. Ask pairs to explain *why* they chose their move before revealing. |

  ## 9. Honest Note: The Limitation
  There is one feature of the theoretical idea this game **cannot** stage, which you must state explicitly in the debrief:

  > "In this game, cooperation relied on **string matching** (Round 1) or **heuristic testing** (Round 3). In the actual mathematical literature (e.g., FairBot, Löbian Cooperation), the programs cooperate because they can **prove** within a formal system that the other will cooperate.
  >
  > They don't check if the code *looks* the same; they check if the code *implies* cooperation. This game cannot simulate logical provability live—that requires a theorem prover, not a seminar.
  >
  > **Why this matters:** String matching is fragile (as you saw in Round 2). Logical provability is robust (it survives obfuscation) but computationally impossible for bounded agents. You felt the *desire* for logical trust, but you were forced to use *syntactic* trust. That gap is where the real philosophical problem lives."

  ## 10. Instructor Prep Checklist
  1.  **Print 18 Strategy Sheets** (4 quadrants each).
  2.  **Print 4 House Bot Cards** (Laminated if possible).
  3.  **Prepare Payoffs:** Count out ~60 chocolate squares.
  4.  **Leaderboard:** Draw on whiteboard (Columns: Pair ID, P1 Score, P2 Score, Pair Total, Cumulative Group Total).
  5.  **Dice:** Bring 2 d10s.
  6.  **Script:** Have the 4 Round Rules written on a slide or handout to avoid re-explaining verbally.

  ## 11. Handling the "Defector Won" Moment
  When the student points out the Defector has the highest individual score:
  1.  **Validate:** "You are absolutely right. In a one-shot game with no enforcement, Defect is the dominant strategy."
  2.  **Pivot:** "But look at the Group Total. If everyone had reasoned like the winner, we would have 18 points. Because some of you tried to build trust, we have [X] points. The Defector didn't *create* value; they *extracted* it from the cooperators."
  3.  **Connect:** "This is why we study this. Not to learn how to win a tournament, but to understand under what narrow conditions (like Round 1) the 'rational' action shifts from Defect to Cooperate without changing the payoffs."
