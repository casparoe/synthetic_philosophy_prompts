  20/25 — a strong conceptual grasp undermined by two specific technical errors on Woodward's view and variable fixing.

  **(a) 7/7**
  *   "The counterfactual theory says that c is a cause of e just in case, if c had not occurred, e would not have occurred." **Right.** (Settled)
