  *   "The intuitive verdict is that at least one of them caused the failover... alpha's." **Right.** (Settled)
  *   "The gap matters because the theory makes the verdict depend on whether a backup happened to be available..." **Right.** This captures the fragility problem. (Settled)

  **(b) 7/9**
  *   "X is a cause of Y... iff there is a possible intervention on X... under which the value... of Y changes." **Right.** (Settled)
  *   "causal claims are model-relative..." **Right.** This is crucial to Woodward. (Settled)
  *   "(i)... hold beta fixed: we consider the situation in which beta stays silent..." **Wrong.** In Case 1, Beta *did* send a request (actual value = 1); holding it fixed at silence violates the "actual value" constraint you correctly defined. A correct answer would note that interventionism's verdict here depends on variable granularity (e.g., "effective request" vs. "sent request"), which is genuinely contested. *Correction:* "Holding Beta fixed at its actual value (Sent), Alpha's removal leaves the effect unchanged, so Alpha is not a cause unless variables model timing." (Costs 1 mark; application error).
  *   "(ii) In Case 2... Hold alpha fixed at its actual value (fired) and vary beta, nothing changes... alpha's request is a cause." **Right.** This is the standard success case for interventionism. (Settled)
  *   "The feature doing the work is the holding-fixed..." **Right.** (Settled)

  **(c) 3/6**
  *   "correctly answered by giving up the reductive ambition." **Right.** Woodward accepts this. (Settled)
  *   "The cost of this is that the account is tied to what agents can do." **Wrong.** Woodward explicitly rejects the requirement that interventions be humanly performable; they need only be logically/physically possible. A correct answer would say: "Interventions need not be humanly performable, only conceptually distinct." (Costs 2 marks; significant misreading).
  *   "Woodward more or less accepts this [restriction]..." **Wrong.** See above. (Settled)
  *   "randomising assignment... is one way of making a manipulation satisfy the independence requirements..." **Right.** (Settled)
  *   *Note:* The point on reductionism is excellent, but the agency error is substantial.

  **(d) 3/3**
  *   "Yes: on either account the flag's being OFF comes out as a cause..." **Right.** (Settled)
  *   "Both Lewis and Woodward are uneasy about treating absences or omissions as causes..." **Imprecise.** Woodward is less uneasy than Lewis, but both acknowledge the ontological weirdness. Acceptable at this level. (Contested)
  *   "I don't think either has a principled story about when to allow it." **Right.** (Contested)

  **Overall:** You handle the engineering applications (Case 2, Omissions) better than the strict philosophical definitions (Case 1 variable fixing, Woodward's agency constraint). The error on human agency is a common misconception but contradicts Woodward's explicit text (*Making Things Happen*, Ch. 1).
