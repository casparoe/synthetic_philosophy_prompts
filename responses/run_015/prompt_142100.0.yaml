answer: |-
  **Mark: 14/20**

  **Margin Comments:**

  **(a) Para 1:** *Be careful here. The prompt defines consequences as (i) Outward + (ii) Inward. You argue (ii) collapses into intention, which is fair, but you ignore (i). Outward welfare does not supervene on intention (I can intend well and cause harm). Does the theory ignore (i)? You assert the tradition "sides with motive anyway"—need textual support for this strong claim (e.g., Vinaya vs. Sutta distinctions).*

  **(a) Para 2:** *'Consequentialist apparatus is decorative' is a strong conclusion. Even if intention fixes karmic fruit, the structure is still 'maximize the good.' The good just happens to include mental states. Is that 'decorative' or just a specific axiology?*

  **(b) Para 1:** *Crucial distinction missing: Criterion of Rightness vs. Decision Procedure. A theory can define what makes an act right (consequences) without prescribing that agents must calculate consequences to act rightly. Self-effacement does not entail self-defeat.*

  **(b) Para 2:** *'Cannot be a theory of right action'—why not? Indirect Utilitarianism is self-effacing but still defines right action. You are conflating 'how to decide' with 'what is true.'*

  **(b) Para 3:** *'Collapses into quietism'—non-sequitur. I can act compassionately without calculating totals. That is not quietism.*

  **(b) Para 4 (No-self):** *Interesting point on agent-neutrality, but does not answer the question asked. Q(b) asks about the problem of self-effacement, not the implications of anatta. This feels like prepared material inserted rather than a direct response.*

  **Examiner's Summary:**
  Clear, confident writing and you engage directly with the prompt's definitions. Part (a) is a plausible reading, though you oversimplify the role of outward consequences in the tradition to make the "collapse" argument work. Part (b) is weaker; you conflate self-effacement with self-defeat by missing the standard distinction between a theory's criterion of rightness and its recommended decision procedure. This is a common error, but it undermines your conclusion that the theory collapses into quietism. The No-self paragraph shows breadth of knowledge but is tangential to the specific question asked. Good work, but watch the meta-ethical distinctions.
