      *   *Observation:* "Last resort" and "least toxic" language exists but is subordinate to economic viability.
      *   *Implicit Theory:* This looks like **Anthropocentric Instrumentalism with a Side-Constraint of Public Health/Safety.**
          *   Insects are resources or obstacles, not moral patients.
