          *   Vertebrate protection is based on empathy/relatability (charisma) and property rights, not consistent moral status.
          *   The "harm" being minimized is harm to *humans* (economic loss, toxic residue, resistance), not harm to pests.

  3.  **Analyze Tensions/Inconsistencies:**
      *   *Tension 1:* "Least toxic/Last resort" vs. "Economic Threshold." If insect suffering mattered, the threshold would include a "suffering cost." It doesn't. The "last resort" is about preserving chemical efficacy (resistance) and safety, not sparing life.
