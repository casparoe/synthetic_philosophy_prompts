          3.  Determine if the practice is inconsistent or if a single view can hold it together.
          4.  Identify which rival theories are ruled out by this practice (e.g., equal consideration, fixed status).
          5.  Describe concretely what would change if insect welfare were taken seriously (garden/farm/regulator level).
      *   **Constraints:** No reading lists, no name-dropping authors. Focus on the structure of the argument and the shape of the practice.

  2.  **Deconstruct the Current Practice (The "Implicit Theory"):**
