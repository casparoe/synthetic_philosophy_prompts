answer: |-
  # Workshop Instrument: The Voting Principles Profiler

  **Facilitator Note:** This instrument is designed to bypass surface-level policy preferences (e.g., "I support lowering the age") and reveal the underlying normative logic (e.g., "I believe voting is about protecting interests"). Participants should answer based on their gut reaction to the scenarios, not on what they think is politically popular.

  ## Part 1: The Scenario Quiz (8 Questions)

  **Instructions:** For each scenario, choose the option that best matches your intuition. There are no right or wrong answers.

  **1. The Core Purpose**
  Imagine a perfectly run election. What is the most important thing that the act of voting *does* for a democracy?
  *   **A.** It confirms that the voter is a full member of the national community.
  *   **B.** It ensures that people affected by the laws have a say in making them.
  *   **C.** It selects the most knowledgeable leaders to produce the best outcomes.

  **2. The Teen vs. The Adult**
  A 16-year-old who reads the news daily and understands the issues wants to vote. A 40-year-old neighbor admits they never pay attention to politics. Who has the stronger claim to the ballot?
  *   **A.** The 40-year-old, because citizenship and adulthood go together.
  *   **B.** The 16-year-old, because they are clearly more affected by the long-term future.
  *   **C.** Neither should vote automatically; we should measure understanding first.

  **3. The Resident vs. The Citizen**
  A non-citizen has lived in your town for 20 years, pays local taxes, and sends kids to local schools. A citizen lives out of state, hasn't voted in a decade, and pays no local taxes. Who should vote in the *local* mayoral election?
  *   **A.** The citizen, because only members of the nation can vote.
  *   **B.** The resident, because they are the one actually affected by the mayor's decisions.
  *   **C.** The citizen, but only if they can prove they know who the mayor is.

  **4. The Duty to Vote**
  Turnout is low, and the winning candidate only got 20% of the eligible population to support them. Is it fair to fine people who don't vote?
  *   **A.** No, voting is a personal right, like free speech. You can choose silence.
  *   **B.** Yes, voting is a civic duty, like paying taxes or jury duty.
  *   **C.** No, forcing uninterested people to vote just adds noise to the results.

  **5. The Local Exception**
  Some countries allow non-citizens to vote in city elections but not national ones. Does this make sense?
  *   **A.** No, voting is about national sovereignty; it shouldn't be split up.
  *   **B.** Yes, local issues (trash, schools) affect residents regardless of passport.
  *   **C.** Only if the non-citizen passes a test on local issues.

  **6. The Working Teen**
  A 16-year-old is working full-time and paying income taxes. Does this change their claim to the vote?
  *   **A.** No, the voting age is a bright line for legal adulthood, not work.
  *   **B.** Yes, "no taxation without representation" applies to them immediately.
  *   **C.** No, paying taxes doesn't prove they understand how to spend the budget.

  **7. The Knowledge Test**
  To improve the quality of laws, should voters have to pass a basic civics test?
  *   **A.** No, all citizens are equally capable of judging their own interests.
  *   **B.** No, as long as they are affected by the laws, they should decide.
  *   **C.** Yes, we wouldn't let someone drive without a license; why let them steer the country?

  **8. The Legitimacy Check**
  If 51% of *voters* choose a policy, but that represents only 30% of the *total population*, is the decision legitimate?
  *   **A.** Yes, because the voters are the legitimate members of the polity.
  *   **B.** No, the decision affects everyone, so the input was too narrow.
  *   **C.** No, the low participation suggests the voters weren't informed or engaged enough.

  ---

  ## Part 2: Scoring Key

  Tally your answers. You will likely have a mix, but one column should dominate.

  | Question | **Column M** (Membership) | **Column I** (Interest) | **Column C** (Competence) |
  | :--- | :---: | :---: | :---: |
  | **1** | A | B | C |
  | **2** | A | B | C |
  | **3** | A | B | C |
  | **4** | *See Note Below* | *See Note Below* | *See Note Below* |
  | **5** | A | B | C |
  | **6** | A | B | C |
  | **7** | A | A | C |
  | **8** | A | B | C |

  **Note on Question 4 (Compulsion):**
  *   If you answered **B (Yes, fine them)**, add 1 point to **Column M** (Civic Duty Universalism). *Rationale: Compulsion is usually justified by membership obligations.*
  *   If you answered **A or C**, do not add points to any column. *Rationale: Viewing voting as a right is compatible with Membership, Interest, or Competence views.*

  **Calculate your Total:**
  *   **Mostly M:** The Civic Member
  *   **Mostly I:** The Stakeholder
  *   **Mostly C:** The Epistemic Guardian
  *   **Mixed/No Clear Majority:** See "Tension Report" below.

  ---

  ## Part 3: The Four Positions (The Leaves)

  These profiles describe the logical "home" for your answers.

  ### 1. The Civic Member (Strict Citizenship)
  *   **Core Principle:** **Democratic Membership.** Voting is a symbol of belonging to the national community.
  *   **On Age:** Keep it at 18. It marks the transition to legal adulthood and full membership.
  *   **On Residency:** Citizens only. Non-citizens, even long-term, have not completed the process of joining the national family.
  *   **On Compulsion:** Divided. Some see it as a duty of membership (Pro-Compulsion), others as a personal right of membership (Anti-Compulsion).
  *   **Reform Stance:** Status Quo on age/citizenship; divided on compulsion.

  ### 2. The Stakeholder (Affected-Interests Expansion)
  *   **Core Principle:** **Affected Interests.** If a decision impacts your life, you should have a hand in making it.
  *   **On Age:** Lower to 16 (or lower). If laws affect teens (schools, climate, work), they need representation.
  *   **On Residency:** Allow local voting for non-citizens. They pay taxes and use services; they are stakeholders in the town.
  *   **On Compulsion:** Generally Opposed. People should vote if they feel affected, not because they are forced.
  *   **Reform Stance:** Support lowering age and local non-citizen voting; oppose compulsion.

  ### 3. The Epistemic Guardian (Quality of Decision-Making)
  *   **Core Principle:** **Competence/Outcome.** The goal of voting is to produce good laws, not just express will.
  *   **On Age:** Variable. Age matters only as a proxy for maturity. Supports tests or higher barriers if it ensures quality.
  *   **On Residency:** Variable. Residency matters less than understanding the system.
  *   **On Compulsion:** Opposed. Forcing uninformed people to vote degrades the quality of the collective decision.
  *   **Reform Stance:** Oppose compulsion; open to age changes *only* if tied to competence; skeptical of expanding the electorate without quality controls.

  ### 4. The Civic Universalist (Compulsory Membership)
  *   **Core Principle:** **Duty + Membership.** Voting is the engine of legitimacy; everyone must participate to make the mandate real.
  *   **On Age:** Standard (18), but strict enforcement.
  *   **On Residency:** Citizen-focused (to ensure duty is owed to the state).
  *   **On Compulsion:** **Strongly Support.** Legitimacy requires high turnout; it is a duty akin to jury service.
  *   **Reform Stance:** Support compulsion; maintain strict citizenship boundaries (duty is owed by members).

  ---

  ## Part 4: Tension Report (Incoherent & Unstable Positions)

  Use this section to facilitate discussion when participants' answers do not fit neatly into the four positions above. These combinations often indicate "talking past one another."

  **1. The "Resident but Not Teen" Tension (Interest Inconsistency)**
  *   **The Pattern:** Supports voting for long-term non-citizen residents (Question 3: **B**) but opposes voting for 16-year-olds (Question 2: **A** / Question 6: **A**).
  *   **Why it's Unstable:** Both arguments rely on the **Affected Interests** principle. The non-citizen is included because they are affected by local laws; the teen is excluded despite being affected by long-term laws and often taxes.
  *   **Discussion Prompt:** "If the reason we let the non-citizen vote is that they are affected by the rules, does the 16-year-old have a stronger or weaker claim than the non-citizen?"

  **2. The "Forced Expert" Tension (Duty vs. Competence)**
  *   **The Pattern:** Supports compulsory voting (Question 4: **B**) AND supports voting tests (Question 7: **C**).
  *   **Why it's Unstable:** This mixes **Civic Duty** with **Epistemic Filtering**. If voting is a duty everyone must perform, you cannot bar people for lack of knowledge without creating a "duty to pass a test." If voting is about competence, forcing the unwilling to participate lowers the average competence.
  *   **Discussion Prompt:** "Can we force someone to do a job they aren't qualified for? If voting requires knowledge, is it fair to fine people for lacking it?"

  **3. The "National Boundary" Tension (Membership Inconsistency)**
  *   **The Pattern:** Supports voting as national membership (Question 1: **A**) but supports local non-citizen voting (Question 5: **B**).
  *   **Why it's Unstable:** This splits the definition of "Membership." It suggests membership is national for some things but local for others. While logically possible (a hybrid view), it often arises from unexamined intuition rather than a clear principle.
  *   **Discussion Prompt:** "Is 'community' defined by the passport, or by the neighborhood? If it's the neighborhood, why does the passport matter for local trash collection?"

  **4. The "Silent Citizen" Tension (Membership vs. Interest)**
  *   **The Pattern:** Believes the disengaged citizen should vote over the engaged non-citizen (Question 3: **A**) but believes low turnout makes the government illegitimate (Question 8: **B**).
  *   **Why it's Unstable:** This prioritizes **Membership** status over **Interest** impact, yet worries about **Legitimacy** (which usually requires broad participation). It privileges the *right* of the citizen to stay home over the *interest* of the resident to be heard.
  *   **Discussion Prompt:** "Is legitimacy about who *could* have voted (citizens), or who *should* have been heard (residents)?"

  ### Facilitator's Guide to the Logical Space
  *   **Vertical Axis (Inclusion):** Ranges from **Exclusive** (Competence/Membership) to **Inclusive** (Interest/Universalism).
  *   **Horizontal Axis (Obligation):** Ranges from **Right** (Voluntary) to **Duty** (Compulsory).
  *   **The Goal:** Help participants see that their policy disagreements are often just different coordinates on this map. A "Civic Member" and a "Stakeholder" can agree on compulsion if they align on Duty, even if they disagree on who is included.
