answer: |-
  In the standard Ramsey-Cass-Koopmans framework, the social welfare function is typically written as:

  $$ W = \int_{0}^{\infty} e^{-\rho t} u(c_t) \, dt $$

  Here, $\rho$ is the rate of pure time preference. The conceptual collapse you identify arises because the model is **anonymous with respect to identity**. The variable $t$ indexes time, but the model does not specify *who* occupies $t$. It assumes a "representative agent" who is either immortal or a dynastic head with perfect altruism toward successors. Consequently, the discount factor $e^{-\rho t}$ applies indifferently to the future utility of the *same* person (intrapersonal) or the future utility of a *different* person (interpersonal).

  ### (i) The Collapse and the Conditions for Separation

  The two readings collapse because the standard formalism treats time as a container for utility, not as a coordinate for persons. Mathematically, weighting $u(c_{100})$ by $e^{-100\rho}$ yields the same contribution to $W$ whether $c_{100}$ is consumed by the agent at $t=0$ or by a descendant at $t=100$. The model cannot "see" the break in identity.

  To prise them apart, you must model **cohort identity** explicitly. Consider an Overlapping Generations (OLG) or sequential generations framework where $i$ indexes cohorts born at time $i$, and $\tau$ indexes age within a life. A separated welfare function looks like this:

  $$ W = \sum_{i=0}^{\infty} \omega_i \left[ \sum_{\tau=0}^{T} e^{-\rho_{ind} \tau} u(c_{i, \tau}) \right] $$

  Here, two distinct parameters emerge:
  1.  **$\rho_{ind}$ (Intrapersonal):** The discount an individual applies to their own future stages (impatience).
  2.  **$\omega_i$ (Intergenerational):** The distributional weight assigned to cohort $i$ relative to cohort 0.

  In the standard Ramsey model, $\omega_i = 1$ for all $i$, and $\rho_{ind}$ is conflated with the social discount rate. To separate them, you need **$\omega_i$ to be a function of birth date independent of individual impatience**. If $\omega_i = e^{-\rho_{soc} i}$, then $\rho_{soc}$ represents pure intergenerational discrimination.

  **What must be built in:**
  *   **Explicit Cohorts:** Persons must be modeled as distinct entities with finite lifespans (non-overlapping or overlapping), preventing the "immortal representative agent" assumption.
  *   **Survival Probability:** If $\rho$ is partly a hazard rate (probability of extinction $h$), the discount term becomes $e^{-(\rho + h)t}$. In a single-agent model, $h$ is the agent's death risk. In a generational model, $h$ is the species extinction risk. Separating these requires specifying whether the discount applies to the *utility flow* (preference) or the *probability of the recipient existing* (hazard).

  ### (ii) The Charge of Arbitrariness

  The collapse severely weakens the defense of a positive $\rho$ against the charge of arbitrariness (Ramsey 1928; Parfit 1984).

  *   **The Impatience Defense:** In an intrapersonal context, $\rho > 0$ can be justified descriptively (psychological impatience) or normatively (uncertainty of survival).
  *   **The Intergenerational Context:** Future generations do not exist yet; they cannot be "impatient." Therefore, $\rho$ cannot reflect *their* psychology. It must reflect *our* valuation of *them*.

  When the model collapses the two readings, economists often defend $\rho > 0$ by citing observed individual impatience. But because the beneficiaries in long-term problems (e.g., climate stability in 2100) are distinct persons, this defense is a category error. If $\rho$ is interpreted as $\omega_i$ (a weight on earlier cohorts), then a positive $\rho$ is ethically equivalent to discounting welfare based on spatial distance or genetic relatedness.

  The collapse allows the theorist to hide a normative claim (earlier generations matter more) behind a positive claim (people are impatient). Once separated, the charge holds: unless $\rho$ reflects a probability of non-existence, a positive pure time preference over generations is arbitrary discrimination.

  ### (iii) Hazard Rates vs. Pure Preference

  A positive observed discount rate $r$ often bundles pure time preference $\rho$ and existential hazard $\delta$. The Ramsey rule expands to:

  $$ r = \rho + \delta + \eta g $$

  **How much work is the hazard rate doing?**
  In long-term policy, $\delta$ (probability of human extinction or civilizational collapse) is non-zero. If analysts calibrate $\rho$ to match market interest rates without subtracting $\delta$, they are implicitly assuming a high risk of extinction justifies neglecting the future. For example, if $r=4\%$, $\eta g = 2\%$, and $\delta = 1\%$, then $\rho = 1\%$. If one assumes $\delta=0$, then $\rho = 2\%$. The difference determines whether we save significantly for the distant future.

  **How to tell them apart:**
  The distinction is **normative**, not just empirical.
  *   **The Existence Test:** If we could guarantee the existence of the future population (e.g., via a secure bunker or binding commitment), would we still discount their welfare?
      *   If **Yes**: The discount is $\rho$ (pure preference). It is ethically contentious.
      *   If **No**: The discount was $\delta$ (hazard). It is ethically neutral (expected value calculation).
  *   **Policy Implication:** A hazard rate $\delta$ justifies less investment because the investment might be destroyed. A pure preference $\rho$ justifies less investment because the beneficiaries matter less.

  ### Verbal vs. Substantive Distinctions

  You asked to identify which distinction is merely verbal.

  1.  **Impatience vs. Discrimination:** This is **not** merely verbal. It is a substantive ethical category error. Conflating them allows a psychological fact about living people to justify a normative slight against unborn people.
  2.  **Discounting the Person vs. Discounting their Welfare:** Within a welfarist framework, this distinction **is merely verbal**. Since the moral currency is well-being, "valuing a person less" *just means* "valuing their well-being less." There is no non-welfarist residue.
  3.  **Hazard vs. Preference in Calibration:** In observed market data, the distinction is **observationally verbal** (they look identical in the rate $r$), but **normatively substantive**.

  **Plain Statement:** The distinction between **intrapersonal impatience** and **intergenerational discrimination** is **substantive**, not verbal. The standard model makes them *appear* verbal by stripping away identity. The distinction that is **merely verbal** is between "discounting a future person" and "discounting a future person's welfare"; in the calculus of the long term, to discount the vessel is to discount the content. The ethical danger lies in treating the substantive distinction (impatience vs. discrimination) as if it were the verbal one.
