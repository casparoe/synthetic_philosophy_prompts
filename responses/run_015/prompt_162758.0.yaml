answer: |-
  (a) **Essay Question**

  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 850 words
  **Marks:** 20

  **The Paradox of Phenomenal Judgment**
  Epiphenomenalism is the view that phenomenal properties (what it is like to have an experience) exist but are causally inert; they produce no physical effects, including no beliefs or behaviors. The Paradox of Phenomenal Judgment arises because we evidently form true beliefs about our own experiences (e.g., "I am in pain"), yet if experiences cause nothing, they cannot cause these beliefs. If the beliefs are not caused by the experiences, it is mysterious why the beliefs are true or justified.

  **Covariance Epiphenomenalism (CE)**
  For this exam, consider a stipulated position called Covariance Epiphenomenalism. CE accepts that phenomenal properties are causally inert regarding the production of beliefs. However, it adds three claims:
  1. Every phenomenal property is nomologically co-instantiated with a specific physical "signature state."
  2. It is the signature state, not the experience, that causes the introspective judgment.
  3. Phenomenal concepts are recognitional concepts whose reference is fixed by the co-instantiated signature. Thus, the judgment is counterfactually sensitive to which experience is present (via the signature) while being caused only by the signature.

  CE concludes that aboutness and knowledge are secured without any phenomenal-to-judgment causation.

  **Task**
  Write an essay evaluating Covariance Epiphenomenalism. Your answer must:
  1.  Decompose the Paradox of Phenomenal Judgment into three separable sub-problems: the **semantic** question (what makes the judgment *about* the experience), the **causal-genetic** question (what produces the judgment), and the **epistemic** question (what makes the judgment justified).
  2.  Evaluate CE against a **mismatch case**: Suppose the physical signature fires and the subject forms the judgment "I am in pain," but no phenomenal pain is present. Is this judgment false, or does it fail to express a proposition? What does your answer show about the adequacy of CE's theory of reference?
  3.  Assess the **modal status of covariance**: Can a non-reductive epiphenomenalist claim nomological covariance while allowing for inverted or absent qualia? If covariance is merely *de facto* rather than necessary, does it support the counterfactual sensitivity required for knowledge (e.g., safety or tracking)?
  4.  Address the **self-application problem**: Does CE explain how the epiphenomenalist knows CE itself? Is this the same problem as knowing one's own pain, or a genuinely further problem?

  ***

  (b) **Model Answer**

  The Paradox of Phenomenal Judgment threatens epiphenomenalism with skepticism. If qualia are causally inert, they cannot generate the belief that they exist. To evaluate Covariance Epiphenomenalism (CE), we must first decompose the paradox into three distinct sub-problems. The **causal-genetic** question asks what physically produces the judgment; CE answers this easily: the physical signature state causes the belief. The **semantic** question asks what makes the judgment *about* the qualia rather than the signature; CE claims reference is fixed by the signature via covariance. The **epistemic** question asks what justifies the belief; CE argues that counterfactual sensitivity via the signature secures knowledge. The critical issue is whether solving the causal question via signatures automatically solves the semantic and epistemic questions.

  The mismatch case reveals a fracture in CE's semantic account. Suppose the physical signature for pain fires, but no phenomenal pain is present (perhaps due to a rare neural glitch), yet the subject judges "I am in pain." CE faces a dilemma. If the judgment is false, then the concept refers to the phenomenal property, not the signature. But if the concept refers to the phenomenal property, and the signature fixes the reference, how does the reference succeed when the property is absent? If the reference fails, the judgment expresses no proposition. If the judgment is true (because it refers to the signature), then the subject is not actually judging about their pain, but about their neural state, which contradicts the phenomenology of introspection. This shows CE's theory of reference is inadequate: fixing reference by a physical correlate does not guarantee the concept picks out the phenomenal property in cases where the correlation breaks. Causal production by the signature does not settle the reference question.

  This semantic fragility connects to the modal status of covariance. CE relies on covariance to secure epistemic safety or tracking: in nearby worlds where the experience differs, the signature differs, and the judgment changes. However, a non-reductive epiphenomenalist typically wants to allow for the possibility of inverted or absent qualia—where the physical state remains identical but the experience changes. If such possibilities are nomologically possible, then the covariance is merely *de facto*, not nomological. Mere *de facto* covariance cannot support the counterfactual sensitivity required for knowledge. If there is a nearby possible world where the signature fires without the pain, the belief "I am in pain" is unsafe. Therefore, CE cannot simultaneously maintain non-reductive epiphenomenalism (allowing inversion) and claim knowledge via covariance. Conflating causal inertness with nomological idleness leads to the mistake of thinking the signature guarantees tracking even when the link is contingent.

  Finally, consider the self-application problem: how does the theorist know CE is true? If CE explains knowledge of pain via physical signatures causing beliefs that track qualia, does it explain knowledge of CE? The belief in CE is a complex theoretical belief caused by physical brain states. If the theory is true, qualia are inert. But if qualia are inert, our belief in their inertness is caused solely by physical states. This looks like the original paradox in a different costume: how do we know the theory about qualia if qualia play no role in forming the theory? However, it is a genuinely further problem. The original paradox concerns direct introspective reports; the self-application problem concerns theoretical inference. CE might handle introspection via recognitional concepts tied to signatures, but it lacks a story for how theoretical beliefs about the *relation* between signatures and qualia are justified if the qualia side of the relation never interacts with the cognitive system. Collapsing the semantic and epistemic sub-problems here would be a mistake; knowing the theory requires justification for the covariance claim itself, which CE cannot provide without circularity.

  In conclusion, CE successfully addresses the causal-genetic question but fails the semantic and epistemic tests. The mismatch case shows reference is not secured by causal triggers alone. The possibility of inverted qualia undermines the modal strength of covariance needed for knowledge. Finally, the theory cannot account for its own justification without begging the question. CE leaves the epiphenomenalist with caused beliefs, but not knowledge.

  ***

  (c) **Marking Scheme**

  **Total Marks:** 20
  **Pass Mark:** 10
  **A-Grade Threshold:** 17+

  **Five Must-Hit Points (4 marks each)**

  1.  **Decomposition of the Paradox:** The candidate must distinguish the semantic (aboutness), causal-genetic (production), and epistemic (justification) sub-problems.
      *   *Common Error:* Collapsing the semantic and epistemic sub-problems into one, or treating the causal question as the only relevant issue.
  2.  **Analysis of the Mismatch Case:** The candidate must argue whether the judgment is false or proposition-less and explain what this implies for CE's theory of reference (i.e., that causal trigger does not settle reference).
      *   *Common Error:* Offering the claim that the judgment is caused by the neural correlate as though that settled the reference question.
  3.  **Modal Status of Covariance:** The candidate must distinguish between nomological and *de facto* covariance and connect this to the non-reductive epiphenomenalist's commitment to inverted/absent qualia possibilities.
      *   *Common Error:* Conflating causal inertness with nomological idleness, or assuming covariance must be exceptionless to yield knowledge.
  4.  **Epistemic Consequences:** The candidate must explain why *de facto* covariance fails to support counterfactual sensitivity (safety/tracking) required for knowledge.
      *   *Common Error:* Ignoring nearby inverted-qualia possibilities when assessing safety conditions.
  5.  **Self-Application Problem:** The candidate must take a stance on whether knowing CE is the same problem as knowing pain or a distinct one, providing a reason (e.g., introspective vs. theoretical).
      *   *Common Error:* Treating causal production as a requirement on reference, or dismissing the self-application problem as identical to the first-order case without argument.

  **Grading Descriptors**

  *   **B Grade (13–14 marks):** States both horns of the paradox accurately, notes that the reply secures covariance but leaves causation out, and raises one substantive objection (e.g., either the mismatch case OR the modal problem). Fails to connect the modal status to the epistemic conditions or treats the self-application problem superficially.
  *   **A Grade (17–20 marks):** Achieves all five must-hit points. Specifically: says why the mismatch case forces a decision about reference rather than merely about truth value; distinguishes the nomological from the merely *de facto* reading of covariance and connects that distinction to the modal neighbourhood knowledge requires; and treats the self-application problem on its own terms instead of re-running the original paradox.
  *   **C Grade (10–12 marks):** Identifies the paradox and the basic structure of CE but fails to decompose the three sub-problems clearly. Raises objections but conflates causal and semantic issues.
  *   **Fail (0–9 marks):** Misunderstands epiphenomenalism, fails to address the stipulated CE view, or writes significantly under the word limit.

  **Specific Penalties**
  *   Deduct 2 marks for conflating causal inertness with nomological idleness.
  *   Deduct 2 marks for treating causal production as a requirement on reference.
  *   Deduct 2 marks for collapsing the semantic and epistemic sub-problems.

  **Note on Paradox-Only Answers:** An answer that lays out the paradox flawlessly but takes no position on the stipulated reply would score a maximum of 8 marks.
