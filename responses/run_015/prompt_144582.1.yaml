answer: |-
  Here is the specification sheet for a theory of aggregation suitable for public policy decision-making.

  ### Part 1: The Desiderata (The Spec)

  These are functional requirements derived from the job description of a regulator or ethics committee. They are not philosophical preferences; they are conditions for the theory to be usable in the real world.

  | Requirement | The Case / Consideration | Why this is a Requirement (not a prejudice) |
  | :--- | :--- | :--- |
  | **1. Decisiveness** | *Specks vs. Torture.* The committee must vote Yes or No on a policy. | A theory that yields "incommensurable" or "no answer" causes policy paralysis. Legitimacy requires a verdict, even under moral uncertainty. |
  | **2. Continuity (No Cliff-Edges)** | *The Continuum.* One person gets a million specks vs. a million people get one. | If adding one person (or one micro-harm) flips the verdict from "Forbidden" to "Mandatory," the rule is unstable and open to gaming. Policy needs marginal stability. |
  | **3. Welfare Relevance** | *Unnoticed Harm.* A cost no one experiences or could experience. | Public policy regulates *well-being*, not metaphysical states. If a "harm" makes no difference to anyone's life (experiential or opportunity), counting it wastes resources and violates the mandate to serve the public. |
  | **4. Causal Neutrality** | *Many Hands.* A million agents each doing a millionth of the harm. | Regulators manage *outcomes*, not just individual sins. If a policy creates a collective bad, it is irrelevant whether one agent did it all or a million did it piecemeal. The theory must aggregate causal contributions. |
  | **5. Scalability** | *Mundane Versions.* Ads, queues, taxes vs. Torture. | A theory that only works for "torture" is useless for health economics (QALYs) or transport policy. It must handle the mundane to be action-guiding for a regulator. |
  | **6. Distributional Sensitivity** | *Net-Wash.* Harms/benefits to same people vs. different people. | Policy aims to avoid exploitation. Sacrificing Person A to benefit Person B is ethically distinct from imposing a cost on A to benefit A. The theory must track *who* pays and *who* gains. |
  | **7. Risk Sensitivity** | *Ex Ante.* One-in-a-million chance of severe harm vs. certainty of small harm. | Regulators operate on probabilities, not certainties. A theory that only counts *realized* harms cannot guide preventative policy (e.g., safety standards). |

  ### Part 2: Requirements vs. Prejudices

  You must distinguish what the theory *must do* (Requirements) from what a specific moral camp *wants it to say* (Prejudices).

  *   **Genuine Desideratum:** **Consistency.** (If Policy A is better than B, and B better than C, A must be better than C). Without this, the regulator is irrational.
  *   **Smuggled Prejudice:** **"Harms Sum Linearly."** (The Utilitarian assumption). There is no functional requirement that 1,000,000 headaches *must* equal one death. That is a theoretical claim, not a job requirement.
  *   **Smuggled Prejudice:** **"Rights are Trumps."** (The Deontological assumption). There is no functional requirement that a small harm *cannot* aggregate. That is a theoretical claim.
  *   **Genuine Desideratum:** **Tractability.** The calculation must be possible with available data. If the theory requires knowing the exact utility function of every citizen, it fails the job spec.

  ### Part 3: The Incompatibility (The Trilemma)

  Your intuition is correct. You cannot satisfy all three of the following simultaneously. This is a variation of the **Voorhoeve/Parfit Trilemma**.

  1.  **Continuity:** There are no sharp thresholds. (Small changes in numbers/severity don't cause sudden flips in verdict).
  2.  **Separateness of Persons:** Harms to different people do not aggregate in the same way harms to one person do. (I cannot justify breaking your leg just because it saves a million people from a headache).
  3.  **Transitivity (Rational Choice):** If A > B and B > C, then A > C.

  **The Conflict:**
  If you accept **Separateness**, you imply a **Threshold** (headaches don't count against broken legs).
  If you have a **Threshold**, you violate **Continuity** (there must be a specific number of headaches where they suddenly *do* count, creating a "cliff").
  If you enforce **Continuity** (no cliffs), you eventually violate **Separateness** (enough headaches *must* outweigh the broken leg, treating people as mere containers for utility).

  **Which to Drop?**
  For a **public policy regulator**, you must drop **Strict Separateness (Thresholds)**.
  *   **Why:** A threshold view creates arbitrary "cliffs" (Requirement 2 violation). It makes policy impossible to administer (e.g., is this pain a 4.9 or a 5.0 on the severity scale?).
  *   **The Cost:** You accept that enough small harms *can* outweigh a severe harm, but you mitigate this by applying **diminishing marginal weight** to aggregated small harms. (1 million headaches count, but not as much as 1 million × 1 headache). This satisfies Continuity and Transitivity, while softening the blow to Separateness.

  ### Part 4: The "Kill Shot" Requirement

  The single requirement that knocks out the most philosophical candidates is **Action-Guidance under Imprecision** (a subset of Decisiveness and Tractability).

  *   **Why:** Most academic theories assume perfect knowledge of utility, identity, and causation.
  *   **The Casualties:**
      *   **Strict Contractualism:** Fails because determining "reasonable rejection" requires precise interpersonal comparisons it cannot supply.
      *   **Lexical Prioritarianism:** Fails because it cannot specify where the "lexicon" begins without arbitrariness.
      *   **Pure Deontology:** Fails because it often forbids action rather than guiding choice between two bad options.

  ### Part 5: Scorecard

  | Theory | Performance on Spec | Fatal Flaw for Policy |
  | :--- | :--- | :--- |
  | **Straight Additive Total Utilitarianism** | **High Decisiveness.** Sums everything cleanly. | **Violates Separateness.** Treats the "million specks" case as identical to "one million specks in one eye." Ignores distribution (Net-Wash case). Politically unsustainable. |
  | **Threshold / Rights View** | **High Separateness.** Protects the individual from the mob. | **Violates Continuity.** Creates arbitrary cliffs. Cannot handle the "Mundane Versions" (is a 3-second ad a rights violation?). Paralyzes decision-making near the threshold. |
  | **Complaint-Based (Contractualist)** | **High Distributional Sensitivity.** Focuses on individual grievances. | **Violates Tractability/Decisiveness.** Requires comparing specific complaints that are often incommensurable. Struggles with the "Ex Ante" risk case (who complains if the risk doesn't land?). |

  **Recommendation for Essay:** Argue for a **Weighted Aggregation** model. It accepts that small harms sum (meeting Continuity and Decisiveness) but discounts them as they aggregate (respecting Separateness partially). It is the only model that survives the Trilemma while remaining usable for a regulator.
