          *   Distinguish non-negotiable requirements from partisan preferences.
          *   Identify incompatibilities (impossibility theorems/trilemmas).
          *   Flag which requirement knocks out the most candidates.
          *   Separate genuine desiderata from smuggled conclusions.
          *   End with a short scorecard for three specific views (Total Utilitarianism, Threshold/Rights, Complaint-based).
      *   **Tone:** Academic but practical, precise, avoiding fluff.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to translate the user's cases into formal requirements.
      *   *Case 1 (Specks vs. Torture):* Requires a verdict. Can't be silent. -> **Decisiveness.**
      *   *Case 2 (Continuum):* Needs to handle the slide from one person to many without arbitrary cliffs. -> **Continuity/Non-Arbitrariness.**
      *   *Case 3 (Unnoticed Harm):* Needs to distinguish real harm from noise/risk that doesn't land. -> **Experiential Grounding / Actualism vs. Expectabilism.**
      *   *Case 4 (Many Hands):* Needs to handle distributed agency. -> **Agency Neutrality.**
      *   *Case 5 (Mundane Versions):* Needs to apply to policy, not just thought experiments. -> **Practical Applicability.**
      *   *Case 6 (Net-Wash):* Needs to handle distribution of benefits/harms. -> **Separateness of Persons.**
      *   *Case 7 (Ex Ante):* Needs to handle risk. -> **Risk Sensitivity.**

      *Refining the Requirements:*
      *   *Requirement 1: Action-Guidance (Decisiveness).* The regulator needs a "yes/no" or "A/B".
      *   *Requirement 2: Continuity (No Cliff-Edges).* Small changes in numbers/severity shouldn't flip the verdict instantly.
      *   *Requirement 3: Separateness of Persons.* Aggregation across people isn't identical to aggregation within a person.
      *   *Requirement 4: Experiential Significance.* Harms must be perceptible or welfare-relevant, not just theoretical.
      *   *Requirement 5: Risk-Weighting.* Probabilistic harms count differently than certain harms.

  3.  **Identify Incompatibilities (The "Trilemma"):**
      *   The user suspects "No sharp threshold" and "Harms to different people don't sum..." come apart.
      *   This is the core of the *Non-Aggregationist vs. Aggregationist* debate (Parfit, Kamm, Voorhoeve).
      *   *The Trilemma:*
          1.  **Transitivity/Continuity:** If A > B and B > C, then A > C. (No cycles/cliffs).
          2.  **Separateness of Persons:** Small harms to many don't automatically sum to outweigh a great harm to one (Anti-Aggregation).
          3.  **Pareto/Weak Aggregation:** If enough small harms accrue, they *must* eventually outweigh the big one (to avoid absurdity).
      *   Actually, the classic impossibility result here is often framed around *Transitivity*, *Separateness*, and *Aggregation*.
      *   Let's refine for the policy context:
          1.  **Continuity:** No sudden jumps in value as numbers increase.
          2.  **Non-Aggregation below Threshold:** Harms below a certain severity don't count against a severe harm.
          3.  **Avoid Absurdity:** Torture must be worse than *some* number of specks (or the theory is useless).
      *   *Wait, the user wants to know what drops.*
      *   The strongest tension is between **Continuity** (no cliffs) and **Thresholds** (some harms don't count). If you have a threshold, you have a cliff (one person below, one person above). If you have continuity, you eventually aggregate.
      *   *Better Trilemma:*
          1.  **Transitivity** (Rational choice).
          2.  **Separateness of Persons** (Individual complaints matter more than totals).
          3.  **Aggregation** (Numbers count).
      *   *Voorhoeve's argument:* You can't have all three.
      *   *For this essay:* I should highlight the tension between **Continuity** (smooth sliding scale) and **Lexical Priority/Thresholds** (some harms are in a different league). You can't have a smooth scale *and* say small harms literally *never* count against big ones, unless you accept a discontinuity (a cliff).
      *   *Decision:* I will frame the incompatibility as **Continuity vs. Thresholds vs. Avoiding Absurdity**.
      *   Actually, the most policy-relevant impossibility is **Precision vs. Non-Arbitrariness**. You can't have a precise cutoff that isn't arbitrary.
      *   Let's stick to the philosophical core: **Transitivity**, **Separateness**, **Aggregation**. (The "Voorhoeve Trilemma").
      *   *Wait, looking at the prompt:* "flag any pair or triple you think can't be jointly satisfied".
      *   I will focus on: **Continuity** (no sharp lines), **Non-Aggregation** (small harms don't sum to beat big harm), and **Transitivity** (rational ordering).
      *   If Small Harms don't aggregate (Non-Aggregation), but eventually *must* (to avoid Absurdity), where is the line? If there's a line, it violates Continuity. If there's no line, it violates Non-Aggregation.
      *   *Selection:* I'll recommend dropping **Strict Non-Aggregation** in favor of **Weighted Aggregation** for policy, because "never aggregate" leads to paralysis.

  4.  **Drafting the Content:**

      *   *Introduction:* Acknowledge the role (policy advisor).
      *   *The Desiderata:* Map the user's cases to specific requirements.
          *   Specks/Torture -> **Verdict Capacity** (Must decide).
          *   Continuum -> **Continuity** (No magic numbers).
          *   Unnoticed Harm -> **Welfare Relevance** (Must affect well-being).
          *   Many Hands -> **Causal Neutrality** (Outcome matters, not just individual intent).
          *   Mundane Versions -> **Scalability** (Works for ads/queues, not just torture).
          *   Net-Wash -> **Distributional Sensitivity** (Who gets the benefit matters).
          *   Ex Ante -> **Risk Sensitivity** (Expected value vs. realized harm).
      *   *Distinguishing Requirements vs. Prejudices:*
          *   Requirement: Must guide action.
          *   Prejudice: "Harms must sum linearly" (Utilitarian bias) or "Harms never sum" (Rights bias).
      *   *The Incompatibility (The "Kill Shot"):*
          *   The trilemma of **Transitivity**, **Separateness of Persons**, and **Aggregation**.
          *   Or simpler: **Continuity** vs. **Thresholds**.
          *   I'll go with **Continuity vs. Thresholds vs. Avoiding Absurdity**.
          *   *Recommendation:* Drop strict Thresholds. Use a diminishing marginal weight function.
      *   *The "Most Knockout" Requirement:* **Action-Guidance under Uncertainty**. Most philosophical theories fail here because they require precise cardinal utility which doesn't exist in policy.
      *   *Scorecard:*
          *   Total Utilitarianism: Fails Separateness.
          *   Threshold/Rights: Fails Continuity (The Cliff).
          *   Complaint/Contractualist: Fails Action-Guidance (Too complex).

  5.  **Refining the Tone:**
      *   The user wants "the spec". Direct, bulleted, clear distinction between "must have" and "nice to have".
      *   Avoid waffle.
      *   Ensure the "Why it's a requirement" is clear (linked to the job of a regulator).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Net-Wash" case? Yes, under Distributional Sensitivity.
      *   *Check:* Did I address "Unnoticed Harm"? Yes, under Welfare Relevance.
      *   *Check:* Did I explain *why* something is a requirement and not a prejudice? Yes, by linking it to the decision-maker's need for stability/legitimacy.
      *   *Check:* The Trilemma. I need to be precise. The standard impossibility theorem in this area is often associated with *Voorhoeve* or *Parfit*. I will frame it as the tension between *Continuity* (smooth transition) and *Lexicality* (some harms are infinitely worse).
      *   *Correction:* The prompt asks to separate genuine desiderata from smuggled conclusions. "Obviously enough small harms add up" is a conclusion. I need to make sure I don't list "Aggregation" as a requirement, but rather "Consistency" or "Verdict Capacity".
      *   *Refinement on the Trilemma:* The strongest tension for a *policy maker* is between **Precision** (knowing exactly when to stop) and **Non-Arbitrariness** (no magic number). I will highlight this. But philosophically, the **Transitivity/Aggregation/Separateness** trilemma is deeper. I'll mention both but focus on the latter for the theoretical section.
      *   *Wait, one more thing:* The user asked "which single requirement knocks out the most candidates". That's likely **Action-Guidance under Imprecision**. Most theories assume perfect information.
      *   *Final check on Scorecard:* Keep it brief.

  7.  **Final Polish:** Ensure the distinction between "Requirement" (functional necessity for the regulator) and "Theoretical Commitment" (philosophical stance) is sharp.

      *(Self-Correction on the Trilemma)*: The prompt specifically mentions: *"I have a feeling 'no sharp threshold' and 'harms to different people don't sum the way harms to one person do' come apart somewhere along that continuum"*. I must validate this intuition. This is the **Continuity vs. Separateness** tension. If harms to different people don't sum like harms to one person, you need a threshold. If you have a threshold, you have a sharp line (violating continuity). I will confirm this intuition.

