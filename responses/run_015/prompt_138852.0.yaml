answer: |-
  ### Part 1: Mechanic Selection & Rejection

  Here are the three candidate mechanics evaluated against the constraints of a festival workshop (90 minutes, no tech, variable attendance, low stakes).

  **1. The Inheritance Rule (REJECTED)**
  *Reason:* **Logistical Fragility.** Swapping players mid-session requires a steady stream of "strangers" from an adjacent room who are perfectly briefed but have zero prior context. In a festival environment, adjacent rooms are rarely available, and late arrivals are unpredictable. If the "stranger" arrives late, confused, or speaks to the departing player, the experimental condition (transmission without shared history) collapses. The cognitive load of tracking score inheritance also distracts from the core philosophical insight. It tests *transmission* well, but at the cost of *clarity*.

  **2. Two Colonies (REJECTED)**
  *Reason:* **Isolation Leakage.** To demonstrate path dependence, the two groups must never communicate. In a single room without partitions or digital interfaces, "silence" is porous. Eye contact, body language, and the rustling of paper leak information. If Group A sees Group B celebrating a high score, Group A will infer the winning convention, ruining the comparison. Furthermore, if the groups *do* stay isolated, they feel no tension with each other; they just feel like they played two different games. It demonstrates *difference*, but not the *conflict* inherent in norms.

  **3. The Mutiny Ballot (SELECTED & EXPANDED)**
  *Reason:* **Emotional Fidelity.** This mechanic directly targets the most counter-intuitive aspect of Lewisian convention: *Inertia under universal discontent.* It creates a visceral feeling of being "stuck" that participants remember. While it requires a setup phase to establish the initial convention (which I will add), it is robust against noise, works with variable group sizes, and fits the time limit. It allows us to test *reform mechanisms* live, which turns the workshop from a lecture into a laboratory.

  ***

  ### Part 2: Session Design — "The Convention Trap"

  **Materials (Fits in a standard tote bag):**
  *   25 Index cards (pre-printed with Rules).
  *   25 Small slips of paper (for ballots).
  *   2 Pens per participant (ink failures happen).
  *   1 Bag of chocolates (approx. 50 pieces).
  *   1 "Facilitator Script" (single sheet, front/back).
  *   1 Whistle or bell (to signal round ends).
  *   5 "Latecomer Brief" cards.

  **The Rules (To be read aloud and printed on the Index Cards):**
  1.  **Silence:** No speaking, gesturing, or showing your card to others once play begins.
  2.  **The Choice:** In each round, write a number between 1 and 10 on your slip.
  3.  **The Payoff:** You earn chocolates only if your number *matches* the number chosen by the majority of the room.
  4.  **Rounds:** We will play 5 rounds. Scores accumulate.
  5.  **The Reveal:** After Round 2, a new rule will be announced.

  **Payoff Scheme:**
  *   **Rounds 1 & 2:** Any matching majority = **1 Chocolate per person.** (Goal: Establish *a* convention, any convention).
  *   **Round 3 (The Reveal):** New Rule announced.
      *   If the majority matches on **7**: **1 Chocolate.** (The Old Norm).
      *   If the majority matches on **3**: **3 Chocolates.** (The New Optimum).
      *   If the room splits (no clear majority): **0 Chocolates.**
  *   **Why these numbers?** The '7' is a common Schelling point (lucky number). '3' is mathematically superior but less salient. The penalty for mismatch (0) creates the risk that enforces inertia. You want 3, but you fear being the only one picking 3.

  **Timeline (90 Minutes):**

  *   **00:00 – 00:10: Setup & Latecomers.**
      *   Distribute cards/pens. Seat participants in a circle (critical for visibility).
      *   *Latecomer Protocol:* Hand them a "Latecomer Brief" card. They sit silently, observe Round 1, and join play at Round 2. Do not explain rules verbally to them; the card suffices.
  *   **00:10 – 00:25: Phase 1 (Norm Formation).**
      *   Round 1 & 2. Collect slips, count majority, distribute chocolates.
      *   *Expected Outcome:* The room will likely converge on '7' (or '10' or '1'). Let them settle. Do not correct them if they pick '7'.
  *   **00:25 – 00:35: The Reveal & Private Poll.**
      *   Announce the new payoff (3 is worth more).
      *   **Private Poll:** Ask everyone to write down: "What number do you *wish* the room would pick?" Collect and read aloud. (Result: Near unanimous for '3').
      *   *Facilitator Note:* Emphasize the gap between *preference* and *action*.
  *   **00:35 – 00:45: The Mutiny Ballot (Binding).**
      *   Rule: Everyone writes a number. If >80% pick '3', everyone gets 3 chocolates. If not, everyone gets 0 (for this round).
      *   *Expected Outcome:* Failure. Fear of being the outlier keeps people on '7'.
      *   *Payoff:* Distribute 0 chocolates. Let the frustration land.
  *   **00:45 – 00:55: Reform Mechanism A (Staggered).**
      *   Rule: I will tap 5 people on the shoulder. They *must* pick '3'. The rest can choose.
      *   *Goal:* Show that a committed minority can shift the equilibrium if the rest trust the commitment.
      *   *Outcome:* Likely success if the "forced" switchers are visible.
  *   **00:55 – 01:05: Reform Mechanism B (Cascade).**
      *   Rule: Players announce their choice one by one, publicly, before writing.
      *   *Goal:* Show how public signaling builds common knowledge.
      *   *Outcome:* Success. The first few signal '3', others follow.
  *   **01:05 – 01:30: Debrief.**
      *   Map the experience to the four Lewisian points (see below).

  **Debrief Map (Facilitator Script):**

  1.  **Arbitrariness:** "In Round 1, why did you pick 7?"
      *   *Expected Answer:* "It felt lucky," "It was the first number I thought of."
      *   *Point:* The number had no intrinsic value. It won because it was salient.
  2.  **Expectation-Dependence:** "In Round 3, who wanted to pick 3 but picked 7?"
      *   *Expected Answer:* Many hands.
      *   *Point:* Your reason for picking 7 wasn't that 7 is better, but that you *expected* others to pick 7.
  3.  **Inertia:** "The Poll showed we all wanted 3. The Ballot gave us 0. Why?"
      *   *Expected Answer:* "I didn't trust you to switch," "I couldn't move alone."
      *   *Point:* A convention can be stable even when everyone hates it.
  4.  **Path Dependence:** "If we had started with '3' in Round 1, where would we be now?"
      *   *Expected Answer:* "Rich."
      *   *Point:* We are poorer now not because we are stupid, but because of history. (Ask: "Who wrote 3 in Round 1 but changed?" This proves the alternative path existed).

  ***

  ### Part 3: Failure Modes & Interventions

  1.  **The Talker:** One participant explains the strategy aloud ("We should all pick 3!").
      *   *Intervention:* **Stop Play.** This breaks the "tacit" condition. Politely remind them of Rule 1. If they persist, ask them to observe silently for one round. The lesson requires the *absence* of explicit negotiation to feel the weight of expectation.
  2.  **The Economist:** A player tries to maximize individual gain by predicting the majority and riding it, explicitly stating they don't care about the group.
      *   *Intervention:* **Let Run.** This is valid behavior. However, if they disrupt the silence, intervene. Their cynicism often highlights the "Inertia" point well in debrief ("Even the selfish players couldn't move").
  3.  **The Saboteur:** A player intentionally picks random numbers to "prove the game is broken."
      *   *Intervention:* **Let Run (with caveat).** If they do it in Round 1, it prevents norm formation. If this happens, pause and ask the room: "Can we form a norm if one person refuses?" This is actually a valuable lesson on enforcement. Do not eject them; make them the case study.
  4.  **The Arithmetic Error:** You miscount the slips and award chocolates incorrectly.
      *   *Intervention:* **Stop Play.** Admit the error immediately. "I made a mistake. The norm is only stable if the enforcement is reliable." Turn the error into a lesson on the fragility of institutions. Re-count.
  5.  **Fast Convergence:** The group picks '3' immediately in Round 1.
      *   *Intervention:* **Adjust.** The game is ruined if the optimal norm forms first. If this happens, acknowledge it: "You got lucky. You avoided the trap." Then, for Round 3, change the rule: "Now '7' is worth 3 points, but you are stuck on '3'." Flip the trap to demonstrate Inertia in reverse.

  ***

  ### Part 4: Limitations & The "Speech" Problem

  **What the game cannot reproduce:**
  The game simulates *tacit* coordination, but real-world conventions are often *explicitly negotiated* before they become norms. By banning speech, I am isolating the *expectation* component of Lewis's definition, but I am removing the *communication* component that usually solves the inertia problem.

  **What you must say out loud:**
  In the debrief, you must clarify: *"In real life, we use language to break these traps. We make laws, we send emails, we hold meetings. This game banned speech to make you feel the weight of the expectation. In reality, the 'Mutiny Ballot' is what we call a policy change. The difficulty you felt here is why policy changes are hard even when everyone agrees they are good."*

  **The Loss:**
  By banning speech, you risk participants feeling the game is "artificial." You must validate that feeling. The artificiality *is* the point: it strips away the tools we usually use to hide the structural problem.

  ***

  ### Part 5: Fallback Plan (8 Participants)

  If only eight people show up, the dynamics shift. A "majority" is too easy to sway; one person represents 12.5% of the room, making the "Inertia" less palpable.

  **Adjustments:**
  1.  **Thresholds:** Change the Mutiny Ballot requirement from 80% (16/20) to 75% (6/8). This keeps the tension high (you need near-unanimity).
  2.  **Payoffs:** Increase the chocolate stakes for the "New Optimum" to 5 chocolates. With fewer people, the loss of potential gain feels smaller; increase the magnitude to compensate.
  3.  **Seating:** Ensure the circle is tight. In a small group, physical distance can feel like isolation.
  4.  **Debrief Focus:** Shift the Path Dependence argument. With 8 people, you cannot claim "population level" differences as easily. Instead, focus on *individual* path dependence: "Think of the number you *almost* picked. That was your personal path dependence."

  **Contingency Script:**
  "If we were 20, the fear of being the outlier would be higher. With 8, you might feel bolder. Notice if you felt bolder. That tells us that norm strength scales with group size."
