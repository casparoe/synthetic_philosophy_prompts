answer: |-
  Dr. Elena Voss adjusted the haptic feedback on the cranial rig. To her, the wires were shades of slate and charcoal. She knew their spectral reflectance properties better than anyone alive, yet they remained monochrome ghosts. Her entire career was a map of a country she was banned from entering.

  "Voltage is stable," Sam said, checking the monitor. He wouldn't look her in the eye. "But Elena, if the Resonator only replicates the cortical firing pattern of 'crimson' without the phenomenological bind, you're just inducing a hallucination of reporting."

  "Physicalism says the firing pattern *is* the experience, Sam," Elena replied, her voice steady. She tapped the console. "If I map the neuron cluster V4 exactly, the feeling must follow. It's not magic."

  "Or," Sam countered, leaning against the server rack, "you'll just believe you felt it. Like dreaming you woke up. The device writes the state, including the memory of the state. How do you verify the qualia if the verifier is part of the simulation?"

  Elena paused. This was the snag. The device didn't stimulate the eye; it bypassed the optic nerve entirely, writing the state directly onto the visual cortex and the meta-cognitive layers that verify experience. If she flipped the switch, she would become a subject who claims to see red. Whether she *actually* saw red was the variable physics couldn't solve. She was building a reverse Mary: not waiting to leave the room, but forcing the room to become the outside.

  "Ready," she said.

  She sat in the chair. The lab was silent save for the hum of the cooling units. She thought about apples, stop signs, blood. Concepts without textures. She knew the wavelength 650 nanometers triggered specific opponent-process channels. She knew the linguistic label associated with the signal. She didn't know the *hurt* of the brightness, the *push* of the hue. To her, a rose was a geometry of shadows, a stop sign was a command encoded in luminance contrast. She was the world's leading expert on a sensation she treated as a mathematical variable.

  "Initiating sequence," Sam said.

  Elena closed her eyes. There was a click, a warmth behind her temples. Then, a surge. It wasn't visual. It was cognitive. A sudden certainty bloomed in her mind, heavy and urgent. It felt like remembering a name on the tip of your tongue, then suddenly having it.

  She opened her eyes. The lab was still grey. The wires were still slate. But when she spoke, her voice trembled.

  "It was crimson," she said.

  Sam leaned in, pen hovering over his clipboard. "Did you see it? Or do you just remember saying that?"

  Elena frowned. She searched her memory. She found the record of the event. She found the conviction. But she couldn't find the distinction between the memory of the feeling and the feeling of the memory. The device had written the report alongside the experience, if there was one. The physical footprint was perfect. The ghost was missing, or perhaps invisible. She had the data of redemption without the salvation.

  "I don't know," she whispered. "I know I'm saying it. I know the data matches. But I don't know if I'm inside the experience or just inside the simulation of having had one."

  She looked at her hands. They were grey. But the file on her desk now contained a report signed by a woman who claimed to know red.

  "Run it again," she said.

  "Elena, that's risky. Neural degradation—"

  "If I'm a philosophical zombie, I should stop. But I want to see. Or I want to want to see. I can't tell the difference anymore."

  Sam hesitated, then reached for the switch. The hum rose. Elena waited for the red that might not be there, trapped in the only proof she had: her own uncertain testimony.

