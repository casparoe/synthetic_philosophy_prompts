answer: |-
  Your intuition is shared by many consequentialists, but the distinction holds because lying violates the constitutive rules of communication itself, whereas misleading merely exploits them.

  **Defeaters Sorted by Strength**

  1.  **The Constitutive Norm Argument (Kills the View):** Assertion comes with a built-in "protocol contract": when you assert P, you guarantee you believe P is true. Lying is a performative contradiction—you use the tool of truth-telling to transmit falsehoods, effectively sabotaging the tool itself. Misleading keeps the contract intact (you asserted truths) while relying on the listener's buggy inference logic. If everyone lied, communication would collapse; if everyone misled, communication would still function, just inefficiently. This makes lying a category error in the system of language, not just a moral bug.
  2.  **Agency and Complicity (Strong):** Misleading requires the listener to perform an inference step. By drawing the wrong conclusion, the listener shares a sliver of epistemic responsibility—they failed to verify or ask clarifying questions. Lying removes this agency; you hand them a forged certificate they have no reason to doubt. Moral weight often tracks with how much you override another's autonomy; lying overrides it more completely than misleading.
  3.  **Trust Repair Costs (Medium):** Empirical psychology suggests lying damages trust more severely and permanently than misleading. When caught lying, you are labeled "dishonest"; when caught misleading, you are labeled "shifty" or "clever." The social cost is lower for misleading because you can plausibly deny the intent ("I never said that!"). If the moral wrong were identical, the reputational fallout should be symmetrical, but it isn't.
  4.  **Legal and Institutional Norms (Weak/Contingent):** Perjury laws often punish false statements but not evasive truths. This could be cultural inertia, but it also reflects a practical need for clear binary boundaries in enforcement. This is weak because laws are often imperfect mirrors of morality, but it shows the distinction has functional utility in high-stakes coordination.

  **What Defenders of "Same Wrong" Concede vs. Brush Off**

  *   **Concede:** They admit the *psychological* impact differs (listeners feel more betrayed by lies) and that lying is often *riskier* for the agent (easier to catch). They agree that if outcomes are identical, the *consequences* are the same.
  *   **Brush Off:** They dismiss the "constitutive norm" argument as rule worship—why should the structure of language dictate morality rather than the harm caused? They argue that if I intend you to believe X, and X is false, and I succeed, the "syntax" of how I got there is irrelevant moral dressing. They treat the agency argument as victim-blaming (the listener shouldn't *have* to verify).

  **Unfalsifiability Check**

  Your view isn't unfalsifiable, but it is axiomatic to consequentialism. It would be falsified if you could demonstrate a scenario where lying and misleading produce identical outcomes and intent, yet our moral intuition *strongly* and *consistently* judges them differently across cultures and contexts. Since we do see consistent differentiation (e.g., in legal systems and trust games), the "same wrong" view has to work harder to explain why that differentiation is universally mistaken rather than tracking a real moral feature. The view isn't unfalsifiable, but it is insulated by prioritizing intent/outcome over social practice.

  **Channel Corruption vs. Context Manipulation**

  This framing actually strengthens the case for a moral difference. Corrupting the channel (lying) is like injecting false packets into a stream; it breaks the integrity of the transmission protocol. Manipulating context (misleading) is like sending valid packets but routing them through a congested node so they arrive late or out of order. The first attacks the reliability of the network itself; the second attacks the efficiency of the specific transaction. Morally, sabotaging the network (the institution of truth-telling) is worse than gaming the routing (exploiting inference), because the former threatens future communications for everyone, while the latter is a localized exploit.
