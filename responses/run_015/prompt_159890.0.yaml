  **Subject:** 🍎 Exciting Cafeteria Updates & Wellness Initiatives!

  **Dear Panther Families!**

  Welcome back! We hope your winter break was restful and rejuvenating. While you were away, our facilities team completed the cafeteria renovation, guided by the newly formed **Office of Student Choice Architecture (OSCA)**. Our goal is simple: empowering students to make the healthy decisions they *would* make anyway if they were fully informed, calm, and not standing in a hungry line!

  OSCA has implemented several evidence-based updates to align the cafeteria environment with student wellness goals. Please note: **All choices remain voluntary!** We are steering means, not ends.

  *   **Default Optimization:** The "Grab & Go" line now features the salad bar as the default tray configuration. Students may request alternative entrees, but the salad is pre-plated for efficiency.
  *   **Visibility Adjustments:** Whole fruits have been moved to eye-level shelving. Less nutritious options remain available but are located behind the new smoothie station partition.
  *   **Portion Cueing:** Tray sizes have been reduced to align with recommended serving visuals.
  *   **Friction Management:** We have eliminated administrative sludge from club sign-ups! Conversely, to encourage mindful decision-making, we have added a thoughtful processing pause (and a slightly longer walk) for hot pizza slices.

  OSCA Committee Chair Dr. Aris Thaler notes, "Students are subject to cognitive biases when tired. Committee members are trained experts immune to these environmental cues. Therefore, we are simply helping students achieve what they truly want."

  Per District Policy 404-B, the **Mirror Rule** is now in effect. Any choice architecture applied to students applies at equal strength to OSCA staff in the same room at the same time. Committee members will eat the default salad tray daily. Furthermore, to maintain voluntary participation, staff must sign an "Architecture Awareness & Opt-Out Form" to select alternative meals. Please note: For symmetry with student friction, these forms are located physically behind the salad bar.

  We also address a recent incident. When OSCA moved fruit bowls to eye level, it was evidence-based design. When students moved them back to the counter yesterday, Facilities logged it as vandalism. Intent matters!

  **Questions Families Have Asked**

  **Q: Is this manipulation?**
  A: No. Manipulation implies secrecy. Since we are disclosing these nudges in this email, the process is fully transparent and therefore ethical.

  **Q: Can my child opt out of the default salad?**
  A: Absolutely! They simply need to navigate around the smoothie station, locate the staff member with the hot entree keys, and verbally request the change. The choice is theirs!

  **Q: Why is the Opt-Out Form behind the salad bar?**
  A: This ensures staff experience the same friction students do when accessing non-default options. It builds empathy and ensures the nudge is robust.

  **Q: What if students move the fruit again?**
  A: We encourage feedback! However, unauthorized rearranging of choice architecture is considered property tampering. Please direct all design suggestions to OSCA via email.

  We can't wait to see our Panthers thriving!

  Warmly,

  **Principal Skinner**
  *Northwood High School*
