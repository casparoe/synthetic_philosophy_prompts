      *   **Language:** British English.

  2.  **Deconstruct Spinoza's *Tractatus Politicus* (TP):**
      *   *Potentia* = *Jus* (Power is Right). This is crucial. The state's right is defined by its power to exist.
      *   Democracy is the "most natural" regime because it approaches the state of nature most closely while maintaining unity.
      *   *Notiones Communes:* Ideas adequate to all human minds (reason), distinct from imagination/passion. The goal of the state is to align individuals so they act from reason.
      *   Exclusions: Spinoza explicitly excludes women and servants/dependants from citizenship in the TP (Chapter 11). This is a awkward but textual fact.
      *   Sovereignty: Resides in the assembly, but the assembly must be large enough to prevent faction yet small enough to be rational (a tension).
      *   No Monarch: The defining feature is the absence of a single ruler, not necessarily universal suffrage in the modern sense.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look like a Lonely Planet entry. Name of country? *Res Publica Geometrica*? *Spinozaland*? Let's go with *The Commonwealth of Reason*.
      *   **Introduction:** Set the scene. Deadpan travel writing. "Don't expect beaches."
      *   **Governance/Power:** Explain Power=Right. If you can't enforce it, it's not a right.
      *   **The Citizenry:** Address the exclusions (women/dependants) matter-of-factly as a travel warning.
      *   **Decision Making:** *Notiones communes* vs. opinion. Voting is secondary to rational alignment.
      *   **Stability:** The inevitable collapse into passion.
      *   **Author's Note:** Clarify scholarship vs. satire.

  4.  **Drafting - Content & Tone (Iterative Process):**

      *   *Tone Check:* Needs to be dry, slightly weary, informative. "Visitors should note..."
