answer: |-
  **The Commonwealth of Adequate Ideas**

  **Getting Around**
  Visitors should understand that in the Commonwealth, *potentia* is *jus* (power is right). There is no higher law than the state's capacity to enforce its will. If the government collapses, it did not merely fail; it ceased to have any right to exist. Consequently, travel insurance covering regime change is mandatory. Do not appeal to 'human rights' at border control; rights are coextensive with power, and you currently possess none here.

  **The Sovereign Body**
  Democracy here is defined strictly as the absence of a single ruler, not universal suffrage. The sovereign assembly comprises only independent males. Women, servants, and those dependent on another's table are excluded from citizenship, deemed naturally under the authority of husbands or masters. This is not presented as an unfortunate compromise but as a structural necessity for unity. Female travellers should note that while protected by the state's power, they hold no share in sovereignty. Attempting to vote may result in detention for disturbing the common order.

  **Local Customs & Reason**
  Decision-making is not based on mere opinion (*imaginatio*), which fluctuates with passion, but on *notiones communes* (common notions). These are ideas adequate to all human minds, such as geometry and logic. Parliament does not debate preferences; it deduces policy. If a proposal is rejected, it is not because the majority disliked it, but because it was deemed irrational. Visitors are advised not to lobby MPs with emotional pleas. The state aims to guide the multitude so they live as if guided by reason, even if they are not. However, as the multitude is largely driven by passion, legislation often oscillates wildly between geometric precision and mob rule.

  **Safety & Stability**
  Whilst democracy is the most 'natural' form of government—closest to the state of nature—it is also the most fragile. The tension between the absolute sovereignty required for peace and the passionate nature of the citizens means collapse is frequent. When faction arises, power fragments, and thus right dissolves. Do not be surprised if the Commonwealth dissolves into aristocracy or monarchy overnight. This is not a coup; it is a metaphysical recalibration. If the sovereign loses the power to command, it loses the right to rule. Pack accordingly.

  **Money**
  Currency is backed by the state's ability to maintain order. Inflation correlates directly with civil unrest.

  ***

  **Author's Note**
  This entry satirises Baruch Spinoza's *Tractatus Politicus* (TP). Several points are settled scholarship: Spinoza identifies democracy as the absence of a single ruler (TP XI.1); he asserts power and right are identical (TP II.3); and he explicitly excludes women and servants from the sovereign body (TP XI.4). The satire treats these textual facts as travel advisories.

  However, scholarly contention remains. It is debated whether these exclusions render Spinoza's democratic theory incoherent, given his claim that democracy is 'most natural'. Some argue the exclusions contradict his metaphysics of equality; others contend they are consistent with his 17th-century context and view of power dynamics. This parody leans into the tension without resolving it. Additionally, the depiction of *notiones communes* as legislative tools is a satirical exaggeration; Spinoza saw them as the basis for agreement, not necessarily a literal voting algorithm. The instability described reflects the TP's unfinished nature regarding democracy's practical maintenance.
