          *   The Multitude guided by *notiones communes* (common notions/reason) vs. mere opinion.
          *   Exclusion of dependants and women from the sovereign body (historical accuracy to Spinoza's text, not modern sensibilities).
          *   Tension: Democracy is "most natural" but collapses into passion/faction.
          *   Voting isn't the essence; absence of a single ruler is.
