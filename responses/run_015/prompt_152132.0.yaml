      *   *British English:* "Colour," "programme," "realise," "whilst," "trousers."

      *   *Drafting thought:* How to make the exclusion satirical but accurate? Treat it like a visa restriction. "Only independent males need apply."
      *   *Drafting thought:* How to handle the voting bit? "Ballot boxes are largely decorative."
      *   *Drafting thought:* The collapse. "Expect sudden dissolutions."

  5.  **Refining the Philosophy:**
      *   Make sure not to paint Spinoza as a modern liberal. He's a realist. The state exists to curb passion, but is made of passionate beings.
      *   The *notiones communes* bit is tricky. It's about what all minds share (geometry, logic) vs. subjective desire. The state tries to legislate based on the former.
      *   Power = Right: If the state loses power, it loses right. So the travel guide should warn about instability.

  6.  **Writing the Author's Note:**
