prompt: |-
  I'm taking this course on epistemology and we had a really frustrating session about Moore's proof of an external world — the bit where he holds up his hands and points out there's one hand and then another, so there must be external objects. My friends and I keep going round in circles: half of us think he's clearly begging the question against the sceptic, because he just assumes his hands are real; the other half think he's not trying to prove anything to the sceptic but just showing that our ordinary beliefs are already securely in place. We've been arguing for weeks and nobody's budged. I think maybe it's just a verbal dispute about what 'proof' means — like, proof in maths versus proof in everyday life — but I'm not convinced that's definately all there is to it.

  Then I had this weird thought: what if Moore had done the exact same gesture with something much easier to hallucinate, like a shadow on the wall or a ringing in his ears? Would everyone still feel like it was convincing, or does the proof only work because hands are tangible, medium-sized things that feel impossible to doubt? So maybe the real stall is hidden underneath — not about logic at all, but about which kinds of sensory experience count as epistemically basic and which don't. Is that a real hidden disagreement, or am I just inventing problems?

  Can you tell me what kind of disagreement this actually is? Is it verbal, substantive, or are we answering totally seperate questions about knowledge versus rationality? And if you think there's progress to be made, what would it take — a distinction, a reframing, maybe accepting that we're at bedrock? I'd love a diagnosis with reasons, not just a list of philosophers. Oh, and please answer in British English — I need to quote bits for my essay.
