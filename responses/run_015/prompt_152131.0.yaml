      *   *The Administrative Reality:* The university demands a binary tag (CF vs. HR).
      *   *The Solution:* The procedure must be *pragmatic*, not *ontological*. It cannot claim to find the "true" nature of the proposition. It must assess the *pedagogical intent* and the *degree of resistance to revision* within the specific context of the course, while explicitly acknowledging the Quinean caveat that this is a matter of degree, not kind.

  3.  **Drafting the Decision Procedure (The "Quinean Pragmatic Protocol"):**
      *   *Goal:* To sort proposals based on how the faculty *intend* to teach the material, acknowledging that the underlying epistemology is holistic.
      *   *Step 1: Intent Check.* Does the syllabus explicitly claim immunity from empirical revision?
      *   *Step 2: Revision Scenario.* If empirical data contradicts the claim, does the syllabus say the claim changes or the data is rejected/interpreted away?
      *   *Step 3: Network Dependency.* Is the claim taught as independent or as part of a web relying on other theories?
      *   *Decision Nodes:* Where do we force a tag? Where do we admit ambiguity?
      *   *The "Quinean Collapse" Point:* This needs to be explicit. If a module claims something is "Conceptually Fixed" but admits *any* condition under which it might be abandoned (even for simplicity), it's technically HR under Quine. But for admin purposes, we need a threshold.

