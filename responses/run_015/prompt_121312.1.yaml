          *   *Branch No:* Alpha: Fast>Safe. Beta: Fast>Safe. Aggregation sees tie. Tie-breaker decides. Intensity lost.

  *   **Node 5: IIA Incident (Independence)**
      *   **Question:** A compliance-mandated filler project (known to be unfundable) is added to the list. If its presence flips the relative order of two viable projects, is that a bug we must fix?
      *   **Formal Condition:** (Independence of Irrelevant Alternatives - IIA)
      *   **Yes:** Proceed to Node 6. (Requires IIA compliance; eliminates Borda/Score).
      *   **No:** Proceed to Node 7. (Allows IIA violations; enables Score/Borda).
      *   **Micro-Profile (IIA):** Teams {1, 2}. Projects {X, Y, Z(filler)}.
          *   *Branch Yes (Fix Bug):* 1:X>Y>Z, 2:Y>X>Z. X wins. Add Z' where 1:X>Z'>Y, 2:Y>X>Z'. If Y now wins, rule is invalid.
          *   *Branch No (Accept):* Borda count changes as Z absorbs points from Y but not X. Y loses. Acceptable sensitivity.

  *   **Node 6: GS Impossibility (Strategy-proofness)**
      *   **Question:** If we demand IIA (Node 5=Yes) and Ordinal inputs (Node 4=No), are we willing to assign one team dictatorial power to avoid manipulation?
      *   **Formal Condition:** (Gibbard-Satterthwaite Theorem Interaction)
      *   **Yes:** Proceed to Node 9. (Dictatorial/Oligarchic rules).
      *   **No:** **Leaf L10 (Uninhabited).** *Diagnosis:* Incoherent. You cannot have Ordinal + IIA + Strategy-Proof + Non-Dictatorial on unrestricted domains.
      *   **Micro-Profile (Strategy):** Teams {1, 2}. Projects {Top, Rival, Doomed}.
          *   *Branch Yes:* Team 1 is Dictator. Team 2 cannot manipulate.
          *   *Branch No:* Team 2 ranks Doomed>Rival to lower Rival's score. Rule must prevent this without making Team 1 a Dictator. Impossible here.

  *   **Node 7: Strategy Incident (Manipulation)**
      *   **Question:** A team knows Project D will never be funded. Should they be prevented from ranking D above a rival Project R to lower R's chances?
      *   **Formal Condition:** (Strategy-proofness / Monotonicity)
      *   **Yes:** Proceed to Node 8. (Requires Strategy-proof mechanisms).
      *   **No:** Proceed to Node 9. (Accepts vulnerability; enables Borda/Condorcet).

  *   **Node 8: Domain Restriction (Single-Peakedness)**
      *   **Question:** Can we legitimately require all teams to rank projects along a single axis (e.g., Cost or Risk), such that they prefer projects closer to their ideal point?
      *   **Formal Condition:** (Restricted Domain / Single-Peaked Preferences)
      *   **Yes:** Proceed to Node 9. (Enables Median Voter rules; bypasses GS).
      *   **No:** **Leaf L11 (Uninhabited).** *Diagnosis:* Incoherent. Without Domain Restriction, Ordinal + Strategy-Proof requires Dictatorship (see Node 6).
      *   **Micro-Profile (Domain):** Projects ordered by Cost: Low, Med, High.
          *   *Branch Yes:* Team prefers Med. Must rank Med>Low>High or Med>High>Low. No Low>High>Med.
          *   *Branch No:* Team prefers Med, but ranks Low>High>Med for strategic reasons. Allowed.

  *   **Node 9: Team Anonymity (Weights)**
      *   **Question:** Do all nine product teams have equal weight, or should larger teams (more headcount) have more influence?
      *   **Formal Condition:** (Anonymity vs. Weighted Voting)
      *   **Yes:** Proceed to Node 10. (Equal weights).
      *   **No:** Proceed to Node 10. (Weighted sums).

  *   **Node 10: Platform Veto (Weak Dictatorship)**
      *   **Question:** If the aggregation produces a cycle or a tie, does the Platform Team's ballot automatically decide the outcome?
      *   **Formal Condition:** (Weak Dictatorship / Tie-Breaking Authority)
      *   **Yes:** Proceed to Node 12. (Resolves cycles deterministically).
      *   **No:** Proceed to Node 11. (Requires cycle resolution without veto).

  *   **Node 11: Cycle Handling (Condorcet)**
      *   **Question:** If Project A beats B, B beats C, and C beats A (pairwise), do we drop the project with the weakest win margin?
      *   **Formal Condition:** (Condorcet Completion / Cycle Resolution)
      *   **Yes:** Proceed to Node 12. (e.g., Minimax).
      *   **No:** **Leaf L12 (Blocked).** *Diagnosis:* Unattractive. Without Veto or Drop, you cannot produce a strict deterministic ranking (violates Node 1).

  *   **Node 12: Clone Independence (Duplication)**
      *   **Question:** If we split Project X into X1 and X2 (near-duplicates), should this dilute the support for X compared to Project Y?
      *   **Formal Condition:** (Independence of Clones)
      *   **Yes:** Proceed to Node 13. (Requires Clone-proof rules).
      *   **No:** Proceed to Node 13. (Allows Borda/Plurality vulnerability).

  *   **Node 13: Output Granularity (Output Weakening)**
      *   **Question:** Does the downstream executor strictly need a linear order, or can we return "Tiers" (e.g., Fund These 5, Then These 3)?
      *   **Formal Condition:** (Social Welfare Function vs. Social Choice Function)
      *   **Yes:** Proceed to Node 14. (Allows Tiers; reduces cycle pressure).
      *   **No:** Proceed to Node 14. (Requires Strict Order).

  *   **Node 14: Tie-Break Method (Determinism Nuance)**
      *   **Question:** If two projects have identical aggregated scores, do we break ties by Project ID (static) or Randomly?
      *   **Formal Condition:** (Deterministic Tie-Breaking)
      *   **Yes (Static):** **Leaf L1-L9.** (Compatible with Node 1=No).
      *   **No (Random):** **Leaf L1-L9 (Blocked).** *Diagnosis:* Contract violation. Requires Node 1=Yes to unblock.

  ### Mapping Table: Leaves to Rules

  | Leaf | Name / Description | Status |
  | :--- | :--- | :--- |
  | **L1** | **Range Voting** (Cardinal, Weighted, Static Tie) | Valid if Node 1=Yes/No, 4=Yes. |
  | **L2** | **Borda Count** (Ordinal, Score-based, IIA-violating) | Valid if Node 2=Yes, 5=No. |
  | **L3** | **Plurality** (Top-1 only, Clone-sensitive) | Valid if Node 12=No. |
  | **L4** | **Condorcet (Minimax)** (Pairwise, Cycle-dropping) | Valid if Node 2=No, 11=Yes. |
  | **L5** | **Dictatorial** (Single Team Decides) | Valid if Node 6=Yes. |
  | **L6** | **Median Voter** (Single-Peaked Domain) | Valid if Node 8=Yes. |
  | **L7** | **Weighted Oligarchy** (Headcount-based) | Valid if Node 9=No. |
  | **L8** | **Platform Veto Rule** (Platform breaks ties) | Valid if Node 10=Yes. |
  | **L9** | **Tiered Output** (Buckets instead of List) | Valid if Node 13=Yes. |
  | **L10** | **Impossible (GS Violation)** | **Uninhabited.** Incoherent combination of Ordinal+IIA+Strategy-Proof+No-Dictator. |
  | **L11** | **Impossible (Domain Violation)** | **Uninhabited.** Strategy-proofness requires Single-Peakedness if no Dictator. |
  | **L12** | **Blocked (Cycle Indeterminacy)** | **Uninhabited.** Cannot produce strict ranking without Veto or Drop. |

  **Indistinguishable Leaves:** L1 (Range) and L2 (Borda) are not separated by this tree if Node 4 is answered "No" (forcing Ordinal) but Node 2 is "Yes" (forcing Scalar). In that specific sub-branch, Borda is the only survivor, but technically Range Voting collapses to Borda if users only submit ranks converted to scores. They are flagged as functionally equivalent under strict Ordinal input.

  ### Diagnostics & Constraints Analysis

  1.  **Streaming Constraint (Node 2):** This is the primary technical filter. Answering "Yes" (Scalar Only) eliminates all Condorcet methods (L4) because they require $O(N^2)$ pairwise storage. It forces you into Score-based rules (L1, L2). If you need IIA (Node 5=Yes), you enter a conflict: Score rules violate IIA. There is no IIA-compliant rule that aggregates via per-alternative scalars. **Diagnosis:** If Node 2=Yes and Node 5=Yes, you are in **Leaf L10 (Uninhabited)**. The streaming constraint secretly decides the outcome by forcing IIA violation.
  2.  **Audit Constraint (Node 3):** Answering "No" (Direct Majority Only) combined with Node 2=No (Pairwise) creates **Leaf L12** if cycles exist. You cannot output a strict ranking if A>B, B>C, C>A without dropping a project or using a chain. **Diagnosis:** If cycles are frequent, Node 3=No blocks deterministic output unless Node 10 (Veto) is used.
  3.  **Determinism Contract (Node 1 & 14):** Answering "No" at Node 1 blocks any Randomized Tie-Break (Node 14=No). It forces Static Tie-Breaks (Project ID), which introduces arbitrary bias. **Diagnosis:** To unblock fair tie-breaking, the contract must change to allow "Tiers" (Node 13=Yes) or "Random Seed" (Node 1=Yes).

  ### Residual Choices

  This tree resolves the technical feasibility of aggregation rules against your system constraints, but it does not settle the political ontology of the platform. Specifically, it cannot tell you whether the Platform Team *should* have veto power (Node 10) or whether teams *should* be allowed to submit intensities (Node 4). These are not engineering questions but governance decisions: do you view the product teams as stakeholders with weighted interests, or as equal citizens in a democracy? Do you view the roadmap as a optimization problem (maximize total score) or a negotiation process (respect pairwise majorities)? The tree isolates these choices, but the values driving them must come from your leadership, not the code.
