  Could you draft a single take-home essay prompt on intuitionistic logic and mathematical constructivism for students who have already seen natural deduction, the informal proof-interpretation of the connectives, and the classical double-negation translation, to be answered in roughly 800 words over two days and marked out of 25? The question should present a fresh, fully specified scenario — for example, a purported proof that for any program either it halts on a given input or it does not, or that an exhaustive search procedure settles an unsolved existential number-theoretic claim — and require students to explain why an intuitionist rejects the crucial disjunctive or existential step, how that rejection turns on the difference between truth and warranted assertibility rather than on scepticism about bivalence in the abstract, and why the double-negation translation does not vindicate the classical reasoner. Please also supply a model answer of about 700 words and a marking scheme that distinguishes A-range from B-range work by listing four or five required moves and assigning marks to each, with a brief note for each on the characteristic error that should lose those marks.
