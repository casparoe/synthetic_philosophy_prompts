answer: |-
  ### Part 1: Scores, Tiers, and Justifications

  **Tier 1: Full Standing (0.9 – 1.0)**
  *   **(4) Stranger online:** 0.95 — Her lack of relationship makes her tone inappropriate, but her clean hands regarding the specific norm grant her near-full authority to judge the act.

  **Tier 2: Largely Intact Standing (0.7 – 0.89)**
  *   **(5) Sober sister:** 0.80 — Her sustained recovery demonstrates a renewed commitment to the norm that outweighs her past violations within the context of a caring relationship.
  *   **(3) Climate scientist:** 0.75 — While structurally complicit in emissions, her role as a truth-teller grants her standing to blame intentional deception by a lobbyist.

  **Tier 3: Significantly Diminished Standing (0.4 – 0.69)**
  *   **(1) Father:** 0.60 — His parental duty to ensure his daughter's safety mitigates the hypocrisy of his own minor, though related, traffic violations.
  *   **(8) Confessional novelist:** 0.50 — Her explicit acknowledgment of fault prevents the arrogance of hypocrisy but does not fully restore the authority to demand compliance from a peer.

  **Tier 4: Nearly Absent Standing (0.1 – 0.39)**
  *   **(2) Senior professor:** 0.25 — His habitual violation combined with a power differential transforms the blame into an exercise of dominance rather than moral correction.
  *   **(7) Counterfactual chair:** 0.20 — Since moral character is defined by dispositions rather than luck, his willingness to violate the norm costs him standing just as actual violation would.

  **Tier 5: No Standing (0.0 – 0.09)**
  *   **(6) Magistrate:** 0.05 — In an institutional context governed by the rule of law, a judge's own violation of the law she enforces voids her authority to sentence.

  ***

  ### Part 2: Considerations and Trade-offs

  The ordering above is driven by a weighted interplay of **institutional role**, **relational history**, and **dispositional alignment** with the norm. Institutional role dominates in the public sphere (Case 6), where clean hands are a condition of office, whereas relational history dominates in the private sphere (Case 1, 5), where care can mitigate hypocrisy. The quality of the blamer's will matters significantly; the counterfactual hypocrite (Case 7) is scored low because standing tracks the *commitment* to the norm, which is revealed by what one would do in the absence of constraints, not merely what one happens to do. These considerations trade off rather than one dominating universally: a strong relationship can rescue standing where clean hands are lacking (Case 1), but clean hands cannot rescue standing where institutional integrity is required (Case 6). However, **dispositional alignment** comes closest to a dominant consideration; if the blamer rejects the norm in their heart (Case 7) or exploits it for power (Case 2), standing collapses regardless of other factors.

  ***

  ### Part 3: The Metaphysics of Standing and Moral Equality

  Is standing really scalar? I argue that the scoring exercise captures a real phenomenon: standing is not merely a binary switch granting permission to blame, but a measure of the **moral authority** one carries in the delivery of that blame. A binary view struggles to explain why we listen more closely to the sober sister (Case 5) than the confessional novelist (Case 8), even if both are technically "permitted" to speak. The scalar view better reflects the *weight* the blamee ought to give the criticism. However, one could argue this is binary standing plus a separate scalar metric of *credibility*; if so, my scores are recording a hybrid of permission and persuasiveness.

  Regarding the **moral equality worry**: if every violation cost standing, blaming would indeed collapse, as almost everyone has dirt on their hands. My scores do not collapse toward zero because standing is norm-specific and sensitivity-dependent. Trivial violations (glancing at a phone) do not forfeit standing on serious norms (texting while driving), and repentance (Case 5) can restore standing by realigning the agent's will with the norm. Furthermore, the "moral equality" objection assumes a parity of violation that rarely exists; the lobbyist's intentional deception is categorically different from the scientist's structural complicity, allowing the latter to retain standing. The practice of blaming survives because we distinguish between *failing* a norm and *rejecting* it; only the latter彻底 destroys standing.

  ***

  ### Part 4: Changing My Mind and Revising Scores

  **What would change my mind:**
  The single argument most likely to reorder my tiers is a robust defense of the **Relationship View**, which holds that standing is constituted entirely by the normative relationship between blamer and blamee, independent of the blamer's own compliance. If convinced that blame is fundamentally a demand for relational repair rather than a moral verdict, I would have to raise the scores of the hypocrites (Cases 1, 2, 7) provided they have the right relationship, and lower the score of the Stranger (Case 4) to near zero, as she lacks the relational standing to demand anything at all. This would invert my current hierarchy, making "clean hands" irrelevant compared to "right relationship."

  **Where my reasoning is most likely to fail:**
  My reasoning is most vulnerable on **Case 7 (Counterfactual Hypocrisy)**. I have scored it based on the assumption that we can access and judge the agent's counterfactual dispositions reliably. In practice, standing is a social practice reliant on public evidence; if no one knows the Chair *would* have padded the report, treating her as lacking standing requires an omniscience we do not possess. If standing is an interpersonal status rather than a metaphysical fact about character, my low score is unjustified because the "luck" of not being caught is socially indistinguishable from virtue.

  **Which score I would revise first:**
  If a colleague convinced me I had misdescribed a case, I would first revise **Case 8 (Confessional Preface)** upwards, likely to the 0.7 range. I have treated the confession as a mere mitigation, but if the admission of fault is viewed as a *performative act of solidarity* rather than a disclaimer, it might actually generate a unique form of standing based on shared fallibility. If the novelist says, "I have failed this norm, and I know how damaging it is," she may speak with *more* authority than the clean-handed stranger, transforming the blame from a verdict into a warning. This would require me to value transparency over compliance, significantly altering the scalar weighting.
