answer: |-
  You are smuggling verificationism into ontology under the guise of causal prudence. Your objection hinges on the idea that if I cannot interact with a region, even in principle, asserting its reality is empty. But consider events behind a black hole event horizon. Once something crosses, no signal reaches me, yet you wouldn't say the singularity fails to exist simply because it is causally sealed off from my future. The cosmological horizon is structurally similar; it is a limit on *my* access, not a limit on *being*. When I say the heat death is real, I am not saying it is actual *now* in your sense, nor that I can verify it. I am saying it is a coordinate in the manifold that grounds the truth of propositions about the future. If you restrict reality to your causal patch, you make the truth of "The universe will expand forever" dependent on your local location, which is absurd. The work "real" is doing is providing truthmakers for tensed statements that are objectively true or false independent of your epistemic limitations.

  Your point about global inertial frames in an expanding universe is well-taken regarding special relativity, but it doesn't save presentism; it just forces us to generalize the argument to general relativity. We don't need a global inertial frame to run the block universe; we need a spacetime manifold. The Rietdijk–Putnam logic holds locally: for any two events sufficiently close, their reality status must be invariant under Lorentz transformations. By continuity, this extends across the manifold. You accuse me of privileging a foliation if I use cosmic time, but I don't need to. I privilege *no* foliation. That is precisely why I am an eternalist. If reality depended on a specific slicing, you might have a point, but my view is that the manifold exists *prior* to any slicing. The lack of a unique simultaneity relation doesn't dissolve the future; it dissolves the notion of a universal "now" that you are desperately trying to preserve by shrinking the ontology to your light cone.

  So let's face your dilemma directly. I take the first horn, and I reject your implication that it's a bullet worth biting. Reality chains through regions you cannot observe because reality is not defined by observation. If you grant me the local block—and you seem to grant me the next several millennia—you have already conceded the principle. Why does the metric tensor stop contributing to ontology at the cosmological horizon? The equations don't stop there. Your "horizon-restricted eternalism" is an unstable halfway house. You accept the geometric picture where it feels comfortable but impose an epistemic censor where the geometry becomes counterintuitive. Either spacetime is a four-dimensional structure, or it isn't. If it is, your birth, your death, and the cold void a hundred billion years hence are all equally parts of the structure. If you stop at the horizon, you aren't doing metaphysics anymore; you're doing cartography of your own ignorance.
