answer: |-
  This is not rambling; you have essentially reconstructed one of the most famous debates in modern moral philosophy. You are grappling with the **"Demandingness Objection"** to utilitarianism.

  Pure utilitarianism (maximize the good) would say you *must* donate the kidney, *must* give up the career, and *must* donate half your income for life, provided it saves more lives than it costs you. Your gut rejects this. You intuitively believe you are an agent with your own life to lead, not just a vessel for saving others.

  There is a coherent principle that saves most of your verdicts. Let's call it **Moderate Partiality with an Integrity Cap.** It relies on three filters to determine moral obligation: **Cost, Relationship, and Permanence.**

  Here is how your intuitions map onto this principle, where the kidney fits, and how to resolve your tensions.

  ### 1. The Three Filters

  **Filter A: The Cost Threshold (Integrity Cap)**
  You distinguish between *inconvenience* (wet shoes, vacation), *significant sacrifice* (one year of income, risk of injury), and *life-altering loss* (career, lifetime income, bodily integrity).
  *   **Principle:** You are required to act when the cost is low. You are *permitted* to act when the cost is high, but not *required*.
  *   **The Line:** The line is drawn where the sacrifice compromises your ability to pursue your own core life projects or permanently damages your bodily integrity.

  **Filter B: The Relationship Gradient (Partiality)**
  You intuitively weigh duties to kin/friends higher than duties to strangers.
  *   **Principle:** We have "special obligations" to those in our circle. Saving a friend is more obligatory than saving a stranger at the same cost.
  *   **Evidence:** You feel lying to save a friend is easy; lying to save a stranger in your basement feels heavier. You feel saving a friend from a fire is distinct from saving strangers.

  **Filter C: Duration and Control**
  You distinguish between one-time acts and open-ended commitments.
  *   **Principle:** A one-time sacrifice (vacation, 1 year income) is more likely to be required than an open-ended surrender of autonomy (lifetime income, career). Open-ended commitments threaten your future agency.

  ### 2. Where does the Kidney fit?

  You asked if the kidney is closer to "wet shoes" or "giving up your career."

  Under this principle, **the kidney is closer to the career sacrifice than the wet shoes, but the "Cousin" factor pulls it back toward the middle.**

  *   **Bodily Integrity:** Unlike wet shoes or money, a kidney is part of your physical self. Medical ethics generally holds that bodily integrity is a "trump card." You are rarely *morally required* to surrender body parts, even to save a life (we don't force people to donate bone marrow or blood if they refuse). This puts it near the "Career" end of the spectrum regarding *obligation*.
  *   **The Relationship:** However, this isn't a stranger. It is a cousin. Filter B (Relationship) increases the demand.
  *   **The Verdict:** Donating a kidney to a cousin is **Supererogatory**. This is a philosophical term meaning "good to do, beyond the call of duty." It is morally praiseworthy to say yes, but it is **not morally blameworthy to say no.**

  If you say no, you are protecting your bodily integrity (Filter A). If you say yes, you are honoring a special bond (Filter B). Neither is a moral failure.

  ### 3. Resolving the Tensions

  **The Murderer at the Door (Friend vs. Stranger)**
  You felt tension here: *Why is lying for a friend okay, but lying for a stranger in the basement feel too demanding?*
  *   **The Fix:** The cost isn't the lie; the cost is the **assumption of risk.**
      *   When a friend is with you, the danger is shared.
      *   When a stranger is in your *basement*, you have actively taken responsibility for them. By hiding them, you have made yourself an accomplice. The "demand" you feel isn't about the morality of lying; it's about the **liability** you've accepted.
      *   *Coherent Principle:* If the risk of the lie is identical (e.g., the murderer asks at the door about someone you don't know is inside), your principle should dictate you lie for the stranger just as you would for the friend. The "basement" feeling is likely guilt over the risk you've already taken on, not the duty to save them.

  **The Fire Case (Friend vs. Two Strangers)**
  *Scenario:* Save friend (no risk) OR Save two strangers (run through smoke).
  *   **Your Principle's Verdict:** Save the friend.
  *   **Why?** Your intuitions on "Career vs. Stranger" show that you do not believe you are required to take significant physical risks (smoke) for strangers. Furthermore, Filter B (Relationship) prioritizes the friend.
  *   **The Conflict:** A strict utilitarian would say "Save the two strangers (2 lives > 1 life)." But your principle is not utilitarian; it is **Agent-Centered.** You are allowed to prioritize your own safety and your loved ones. Under *your* coherent system, running through smoke for strangers is heroic, but staying safe to save your friend is obligatory.

  ### 4. The Cleanest Line

  To make your moral framework as clean as possible, you might need to drop one intuition: **The "Broken Back" Intuition.**

  You said: *"Saving that same kid if I have to risk breaking my back jumping in? Still required, I think."*

  This is the outlier. Most ethical frameworks (and legal "Good Samaritan" laws) do not require you to risk permanent disability to save a stranger.
  *   **If you keep this:** You have to explain why a broken back (permanent injury) is required, but a kidney (permanent organ loss) is not. The distinction is fuzzy.
  *   **If you drop this:** You create a cleaner line. You are required to risk *temporary* harm or *minor* inconvenience (wet shoes, minor bruises). You are *not* required to risk *permanent* disability or *permanent* bodily loss (broken back, kidney, career).

  **Recommendation:** Drop the "Broken Back" requirement. Reclassify it as "Heroic/Optional." This aligns it with the kidney and the career. It creates a solid wall: **You are never required to permanently damage your body or life trajectory to save another.**

  ### Summary for your Cousin

  Based on the principle that best fits your instincts:

  1.  **You are not morally required to donate.** It violates the "Bodily Integrity" cap. It is a permanent physical alteration, closer to the "career sacrifice" than the "vacation."
  2.  **It is not selfish to refuse.** You are allowed to prioritize your own bodily integrity and life projects.
  3.  **The "Special Obligation" is real, but limited.** Being a cousin makes it a heavier emotional decision, but it does not turn an optional sacrifice into a mandatory one.

  Your instincts are not all over the place; they are consistently **Moderate.** You believe in helping, but you believe you own yourself first. That is a coherent, defensible moral position.
