answer: |-
  # The Embryo Selection Compass: A Classification Quiz

  **To the Team:**
  Stop arguing about labels like "liberal" or "conservative." In bioethics, those words don't tell us what you actually believe about the cases. This quiz forces you to pick sides on specific scenarios. Your pattern of answers will map you to a specific ethical "Leaf."

  There are 12 questions. Pick the **one** answer (A, B, or C) that feels most true to you. Don't overthink it; go with your gut reaction to the scenario.

  ---

  ### Part 1: The Duty to Select
  *These questions ask if you have to pick the "better" embryo at all.*

  **1. The Serious Disease Case**
  A couple is doing IVF. Embryo A has a gene for a painful, early-onset muscle disease. Embryo B is healthy. The parents say, "We accept the disease as part of our fate." Do they have a moral obligation to pick Embryo B?
  *   **A.** Yes, absolutely. It is wrong to start a life with preventable suffering.
  *   **B.** No, it's their choice. Parents know their capacity to care best.
  *   **C.** It's complicated. If the disease makes life not worth living, yes. If it's manageable, no.

  **2. The Mild Advantage Case**
  Same IVF setup. Embryo A is average. Embryo B is genetically likely to be 3 inches taller and slightly more calm. Neither has a disease. Do the parents have an obligation to pick Embryo B?
  *   **A.** Yes. If you're already choosing, you should pick the one with the best shot at a good life.
  *   **B.** No. That's enhancement, not medicine. Stop at preventing disease.
  *   **C.** No. Traits like "calm" are subjective. Parents should decide what fits their family.

  **3. The "Same Child" Magic Test**
  Imagine a magic wand. You don't have to choose between two embryos. You can pick *one* embryo, and the wand either leaves it alone (child has disease) or fixes the gene (child is healthy). It is the **exact same child** either way. Do you have a duty to wave the wand?
  *   **A.** Yes, definitely. You are helping that specific person.
  *   **B.** No, same as Q1/Q2. Parents still have the right to refuse intervention.
  *   **C.** Yes, but only for disease, not for enhancement.

  **4. The State Subsidy Case**
  The clinic offers selection for disease for free. The State Government offers to pay for selection for *enhancement* (height/IQ) but doesn't mandate it. Should the state do this?
  *   **A.** Yes. If it improves overall well-being, public health should support it.
  *   **B.** No. The state should only prevent harm, not fund "better" lives.
  *   **C.** No. The state should stay out of reproduction entirely, even if paying.

  ---

  ### Part 2: The Definition of "Better"
  *These questions ask what counts as a benefit or a harm.*

  **5. The 8:00 AM School Case**
  A genetic variant makes a child a "night owl" with lower focus in the morning. In our current school system, this is a disadvantage. In a different society with flexible hours, it would be neutral or an advantage. Is this a valid reason to select against it?
  *   **A.** Yes. We live in *this* society, so it is a real disadvantage for the child.
  *   **B.** No. We should change schools, not children. This is discrimination.
  *   **C.** Yes, but only if changing society is impossible. Practicality matters.

  **6. The Grandchildren Case**
  A trait gives the future child no advantage in their own life, but makes *their* children (the parents' grandkids) much healthier. Is this a valid reason to select for it?
  *   **A.** Yes. A life is better if your lineage thrives.
  *   **B.** No. You select for the child's sake, not the family's legacy.
  *   **C.** Maybe. It depends on how big the benefit is.

  **7. The Sibling Harmony Case**
  An older child has severe behavioral issues and creates a chaotic home. Parents can select a younger sibling with a very "calm" temperament to reduce stress on the older child and parents. Is this okay?
  *   **A.** Yes. A stable home helps everyone, including the new baby.
  *   **B.** No. You can't design a child to be a therapist or stabilizer for others.
  *   **C.** It's okay if the trait is neutral for the baby, but not if it limits the baby.

  **8. The Deaf Couple Case**
  A Deaf couple (who view Deafness as a culture, not a disability) uses IVF. They specifically select *for* a Deaf embryo so the child shares their language and community. Is this permissible?
  *   **A.** No. You should never intentionally select for a disability.
  *   **B.** Yes. Cultural belonging is a benefit that outweighs the hearing loss.
  *   **C.** It's permissible, but regrettable. They are limiting the child's options.

  ---

  ### Part 3: Method and Message
  *These questions ask how the choice is made and what it says.*

  **9. The Edit vs. Discard Case**
  Option 1: Select the healthy embryo and discard the sick one. Option 2: Implant the sick one and use gene editing to fix it (no discarding). Which is morally better?
  *   **A.** Option 2 (Edit). Discarding embryos is like throwing away a life.
  *   **B.** Option 1 (Select). Editing is unnatural interference; selection is just picking.
  *   **C.** They are morally the same. The outcome is what matters.

  **10. The "Insult" Case**
  Does selecting *against* a trait (like deafness or dwarfism) send a hurtful message to people currently living with that trait?
  *   **A.** Yes. It says their lives aren't worth starting.
  *   **B.** No. Preventing a condition isn't an insult to those who have it.
  *   **C.** Sometimes. It depends on how the medical community talks about it.

  **11. The "Design" Case**
  Does using genetics to pick traits turn the child into a "product" or "project" rather than a gift?
  *   **A.** Yes. It creates conditional love based on specs.
  *   **B.** No. Parents always shape kids (schools, diet); genes are just another tool.
  *   **C.** Only if the parents' love depends on the traits matching.

  **12. The Fixed Decision Case**
  The parents have already decided: "We are having a child via IVF no matter what." The only question is *which* embryo. Does this fact change your moral judgment?
  *   **A.** Yes. Since the child is happening anyway, we must minimize harm.
  *   **B.** No. The obligation is the same whether they choose to reproduce or not.
  *   **C.** Yes. It makes selection more permissible because they aren't "playing God" with existence itself.

  ---

  ### Scoring Key: Find Your Leaf

  Tally your answers. You likely won't be 100% one letter, but find the **dominant pattern** below.

  #### **Leaf 1: The Maximizer (Mostly A's)**
  *   **Core View:** **Procreative Beneficence.**
  *   **Position:** If you are bringing a child into existence, you have a strong duty to pick the embryo with the *best expected life*, period. This includes preventing disease AND pursuing advantages (height, temperament).
  *   **Debate Stance:** Argue that "harm" isn't just pain; it's missing out on opportunities. If you can give a kid a better start, not doing so is negligent.
  *   **Weakness:** Hard to define "best." Risks eugenics.

  #### **Leaf 2: The Threshold Guardian (Mix of A & B, specifically A on Disease, B on Enhancement)**
  *   **Core View:** **The Harm Principle.**
  *   **Position:** You have a duty to avoid serious suffering (disease), but no duty to maximize potential. Enhancement is optional or forbidden.
  *   **Debate Stance:** Draw a bright line between "therapy" (normal function) and "enhancement" (above normal). The state can mandate therapy, but not enhancement.
  *   **Weakness:** The line between therapy and enhancement is blurry (e.g., vaccines enhance immunity).

  #### **Leaf 3: The Liberty Defender (Mostly B's)**
  *   **Core View:** **Parental Sovereignty.**
  *   **Position:** Parents have the right to transmit their own values, even if those values lead to a "worse" life by medical standards (e.g., the Deaf couple case). No duty to maximize.
  *   **Debate Stance:** Focus on family integrity and cultural rights. The state cannot define what a "good life" is for another family.
  *   **Weakness:** Hard to defend if the child's suffering is extreme.

  #### **Leaf 4: The Non-Identity Skeptic (A on Q3, but B on Q1/Q2)**
  *   **Core View:** **Person-Affecting View.**
  *   **Position:** You only answered **A** on Question 3 (The Magic Test). On the real IVF questions (Q1/Q2), you leaned **B**.
  *   **Why:** You believe you only have a duty to a *specific* existing person. Choosing Embryo A over Embryo B doesn't help anyone, because Embryo B never exists to be "helped." You are not obligated to create the "better" person, only to avoid harming specific people.
  *   **Debate Stance:** Argue that "benefit" requires a beneficiary. You can't benefit someone by bringing them into existence vs. not existing.
  *   **Weakness:** Leads to counter-intuitive results (e.g., seems to say it doesn't matter if you start a child with a disease vs. healthy, as long as the life is worth living).

  #### **Leaf 5: The Expressivist (Mostly B on Q10, A on Q8/Q11)**
  *   **Core View:** **Social Model / Insult Objection.**
  *   **Position:** Your main concern is the message sent to existing people. Selecting against a trait devalues living people with that trait.
  *   **Debate Stance:** Focus on discrimination and social support. We should fix the schools (Q5), not the kids.
  *   **Weakness:** Doesn't address the individual suffering of the new child.

  #### **Leaf 6: The Anti-Design / Gift View (Mostly A on Q9/Q11/Q12)**
  *   **Core View:** **Instrumentalization Objection.**
  *   **Position:** The method matters. Editing or selecting for traits turns the child into an object. You preferred "Editing" over "Discarding" (Q9) or reject the "Design" language (Q11/12).
  *   **Debate Stance:** Children should be accepted as they come. "Designing" creates conditional love.
  *   **Weakness:** Parents already "design" kids via education and nutrition. Why are genes different?

  #### **Leaf 7: The State Neutral (Mostly C on Q4/Q8)**
  *   **Core View:** **Political Liberalism.**
  *   **Position:** Private choice is one thing; state funding/mandates are another. You might allow parents to choose, but you don't want the government paying for or defining "better."
  *   **Debate Stance:** Separate private morality from public policy.
  *   **Weakness:** If it's morally required, why shouldn't the state ensure access?

  ---

  ### Logic Map: Limitations & Empty Space

  **1. The Hard Split: Liberty vs. Non-Identity**
  *   **The Problem:** Leaf 3 (Liberty) and Leaf 4 (Non-Identity) often vote the same way on IVF cases ("No duty to select").
  *   **The Tie-Breaker:** **Question 3 (The Magic Test).**
      *   If you said **No Duty** on Q1 (IVF) but **Yes Duty** on Q3 (Magic/Same Child), you are **Leaf 4 (Non-Identity)**. Your objection is about *who* is being harmed, not parental rights.
      *   If you said **No Duty** on *both*, you are **Leaf 3 (Liberty)**. You think parents have rights even over existing children's medical choices.
  *   **Note:** If your team members can't distinguish these, they are arguing past each other. One is arguing about *identity*, the other about *authority*.

  **2. The Empty Logical Space (Combinations Nobody Holds)**
  *   **The "Enhancement Only" View:** Someone who thinks there is a duty to pick the *taller* embryo but *no* duty to pick the *healthy* one.
      *   *Why Empty:* Incoherent. If you have a duty to maximize good, health is the baseline. If you don't have a duty to prevent pain, you certainly don't have a duty to add pleasure.
  *   **The "Edit Yes, Select No" View:** Someone who thinks discarding embryos is murder (so no selection) but gene editing is fine.
      *   *Why Empty:* Usually, people who value embryo life oppose editing (interference) *and* selection (discarding). Those who support editing usually see embryos as cells, making selection fine too. *Exception:* Some religious views might hold this, but it's rare in secular debate.

  **3. The "Unattractive" Leaf**
  *   **Leaf 4 (Non-Identity Skeptic)** is logically robust but emotionally cold. In a debate, if you take this leaf, expect opponents to attack you for implying it doesn't matter if a child is born sick or healthy. You must be ready to clarify: "It matters, but not because we harmed *that* child."

  **4. The "Unnamed" Leaf**
  *   **The "Cost-Benefit Utilitarian"**: Someone who says "Select for whatever saves the most money for the state." Nobody really admits to holding this leaf publicly because it sounds dystopian, but watch for it in arguments about Q4 (State Subsidy). If someone argues *only* about economic productivity, flag them.

  ### Coach's Note on Usage
  Use this quiz in the first 15 minutes of practice. Have everyone tally their leaf. When a debate stalls, stop the clock and ask: *"Wait, are you arguing from Leaf 1 (Maximizer) against Leaf 4 (Non-Identity)? No wonder you aren't connecting. You disagree on whether 'benefit' requires an existing person."* This forces the clash onto the actual philosophical fault lines.
