      *   **Problem:** Debates loop on clichés ("parents' rights" vs. "govt stay out") without clarifying underlying ethical positions.
      *   **Goal:** A classification instrument (quiz) to map debaters to specific ethical "leaves" (positions) based on case judgments, not labels.
      *   **Requirements:**
          *   10-12 questions.
          *   Concrete scenarios with 2-3 fast answers.
          *   Scoring key mapping patterns to leaves.
          *   Built from "logical space" (key philosophical splits), not just a list of -isms.
          *   Specific cases to include: serious disease vs. mild advantage, context-dependent disorder (8am school), intergenerational trait, sibling harmony, Deaf couple, clinic free vs. state subsidy, editing vs. discarding, fixed decision to have a child.
          *   Target Leaves: Strong maximizing duty, Threshold duty, Pure parental discretion, Non-identity problem (nobody helped), Insult/Expressivist objection, Kids shouldn't be designed, State involvement splits.
          *   Constraint: Flag indistinguishable leaves (and how to fix), point out empty logical space.
          *   Tone: Normal language, accessible to non-biology majors. No citations/reading lists.

  2.  **Deconstruct the Logical Space (The "Splits"):**
      *   *Split 1: Obligation vs. Permission.* Is there a duty to select the "best" embryo, or is it just allowed? (Procreative Beneficence vs. Liberty).
      *   *Split 2: Scope of Duty.* If there is a duty, does it stop at preventing suffering (disease) or go to enhancing well-being (height/temperament)? (Threshold vs. Maximizing).
      *   *Split 3: The Non-Identity Problem.* Does selecting Embryo A over Embryo B harm/benefit anyone, since they are different people? (Person-Affecting vs. Impersonal).
      *   *Split 4: Method.* Is selecting (discarding) different from editing (changing)? (Selection vs. Enhancement/Engineering).
      *   *Split 5: Social/Expressive.* Does selecting against a trait insult existing people? Does the state have a role? (Expressivist/State Neutrality).
      *   *Split 6: Motive.* Can you select for the sake of others (siblings/parents) vs. the child?

  3.  **Drafting the Questions (Iterative Process):**
      *   *Need:* 10-12 questions covering the specific cases requested.
      *   *Q1 (Baseline Duty):* IVF context, serious disease. (Duty vs. Choice).
      *   *Q2 (Scope):* Mild advantage (height/calm). (Threshold vs. Maximize).
      *   *Q3 (Non-Identity):* Same child scenario (hypothetical magic) vs. different embryo. (Tests if the "different child" objection is the real driver).
      *   *Q4 (Context):* 8am school schedule trait. (Tests social model of disability vs. biological essentialism).
      *   *Q5 (Intergenerational):* Trait helping grandkids. (Tests scope of benefit).
      *   *Q6 (Sibling Harmony):* Calm sibling for chaotic home. (Tests selecting for others' sake).
      *   *Q7 (Deaf Couple):* Selecting *for* disability. (Tests cultural vs. medical model/parental rights).
      *   *Q8 (State vs. Clinic):* Who pays/decides. (Tests state involvement).
      *   *Q9 (Editing vs. Selecting):* Discarding vs. Fixing. (Tests method moral weight).
      *   *Q10 (Existence vs. Quality):* Is a life with disability worth starting? (Tests threshold of life worth living).
      *   *Q11 (Expressivist):* Message to existing disabled people. (Tests insult objection).
      *   *Q12 (Design/Objectification):* "Designing" language. (Tests "kids as gifts vs. products").

      *Refining for the "Fast Pick" format:* Make sure options are distinct (A, B, C).

  4.  **Developing the Leaves (The Positions):**
      *   *Leaf 1: The Maximizer (Procreative Beneficence).* Duty to pick best life, includes enhancement.
      *   *Leaf 2: The Threshold Guardian.* Duty to avoid serious suffering, no duty to enhance.
      *   *Leaf 3: The Liberty Defender (Pure Discretion).* No duty, parents choose values.
      *   *Leaf 4: The Non-Identity Skeptic.* No duty because no specific person is benefited/harmed by existence choice.
      *   *Leaf 5: The Expressivist.* Objection based on message sent to existing community.
      *   *Leaf 6: The Anti-Design (Gift View).* Objection to instrumentalizing children.
      *   *Leaf 7: The State Neutral.* Private choice okay, state funding/mandates not okay.

  5.  **Constructing the Scoring Key:**
      *   Need to map answer combinations to these leaves.
      *   *Challenge:* Differentiating Liberty Defender (Leaf 3) and Non-Identity Skeptic (Leaf 4). They often vote the same on "Is there a duty?" (No).
      *   *Fix:* Use Q3 (Magic Same-Child Scenario). If they say "Duty exists if it's the *same* child but not if it's a *different* child," they are Non-Identity Skeptics. If they say "No duty even if it's the same child," they are Liberty Defenders.
      *   *Challenge:* Differentiating Expressivist and Anti-Design. Expressivist cares about *message to others*. Anti-Design cares about *relationship to the child*. Q11 vs Q12 handles this.

  6.  **Addressing the "Empty Logical Space" and "Indistinguishable Leaves":**
      *   *Empty Space:* Someone who thinks there is a duty to enhance but *not* to prevent disease? (Incoherent). Someone who thinks Editing is okay but Selecting is not? (Rare, usually the reverse).
      *   *Indistinguishable:* As noted, Liberty vs. Non-Identity. I need to explicitly highlight the "Magic Wand" question as the tie-breaker.

  7.  **Review against Constraints:**
      *   10-12 questions? Yes.
      *   Specific cases included? (Disease, Height, 8am School, Grandkids, Sibling, Deaf, State, Edit/Select, Fixed Decision). Yes.
      *   Language normal? Avoid jargon like "non-identity problem" in the quiz text.
      *   No citations? Yes.
      *   Flag limitations? Yes, in the analysis section.

  8.  **Final Polish:**
      *   Ensure the scoring key is usable (e.g., "Mostly As = Leaf 1").
      *   Make the "Leaves" descriptions clear for the debate coach.
      *   Write the "Logic Map" section to explain *why* the quiz works.

      *(Self-Correction during drafting)*: I initially thought about making it a points-based system. But a flow-chart logic is better for philosophical positions. However, for a "quiz" handout, a points tally is easier for students to calculate quickly. I will use a hybrid: Group questions by "Theme" and tally the dominant view. Actually, a decision tree is more accurate for logic, but a scoring key is requested ("mapping answer patterns onto leaves"). I'll provide a scoring key that looks at the *weight* of answers in specific categories.
      *Wait, better idea:* I will structure the scoring by "Vectors." Vector 1: Duty vs. Liberty. Vector 2: Threshold vs. Maximize. Vector 3: Identity/Method. This allows for mixed positions too.
      *Actually, the prompt asks for "Leaves."* I should define distinct endpoints. I will create a scoring system that identifies the *primary* commitment.

      *Refining the "Nobody is helped" vs "Parental Choice" split:*
      *   Person A (Liberty): "Parents have a right to choose, even if one is objectively better."
      *   Person B (Non-Identity): "There is no 'better' for a non-existent person, so no duty."
      *   *Test:* If the state *subsidized* the better embryo, would Person A object (State overreach)? Would Person B object (Still no benefit)?
      *   *Better Test (Q3):* "If science could guarantee the *same* child would be born healthy vs. sick (magic gene therapy after conception), do you have a duty then?"
