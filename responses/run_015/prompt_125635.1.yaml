answer: |-
  Here is a specification for a positive illusionist theory, structured to distinguish between logical necessities for the view to hold together and preferences that stem from specific naturalistic or evolutionary commitments. I have integrated your sticking points and added the missing requirements regarding mechanism and selection.

  ### Specification for a Positive Illusionist Theory

  **1. The Encapsulation Requirement (Recalcitrance)**
  *   **Specification:** The theory must identify the cognitive locus of the "seeming" as a sub-personal, modular output that is cognitively impenetrable by personal-level belief. It must explain why the introspective judgment "there is something it is like" persists even after the subject accepts the theoretical argument that there is not.
  *   **Motivation:** Ordinary perceptual illusions (e.g., Müller-Lyer) persist despite knowledge of their falsity. If accepting illusionism cured the feeling of phenomenal consciousness, it would not be an illusion but a false belief. If nothing conceivable would lift the illusion, the theory risks positing a "necessary illusion," which borders on admitting the phenomenon is real but epistemically inaccessible.
  *   **Status:** **Non-negotiable.** Without this, the view collapses into error theory about belief rather than illusionism about experience.

  **2. The Structural Isomorphism Requirement (Cartography)**
  *   **Specification:** The theory must provide a mapping between the functional/discriminative structure of the cognitive system and the apparent structure of the phenomenal field. It must explain how a misrepresentation can preserve the fine-grained similarity relations (e.g., red is more like orange than blue) without those relations being grounded in actual qualitative properties.
  *   **Motivation:** A random error would not yield the systematic, high-resolution "map" of experience we report. If the illusion is a user-interface, the icons must bear a structural relationship to the files they represent, even if they do not resemble them.
  *   **Status:** **Non-negotiable.** Without this, the illusion is too chaotic to support the reliability of introspection.

  **3. The Functional Utility Requirement (Reliability without Truth)**
  *   **Specification:** The theory must explain how introspective reports can track internal states accurately enough for psychophysics and medicine (e.g., "pain intensity") while misdescribing the *nature* of those states (e.g., "hurtfulness"). The report must be causally anchored to the functional state, not the non-existent phenomenal property.
  *   **Motivation:** If phenomenal reports were noise, anaesthesia monitoring would be impossible. The theory must distinguish between the *cause* of the report (the functional state) and the *content* of the report (the phenomenal property).
  *   **Status:** **Non-negotiable.** Otherwise, illusionism renders all first-person data useless, undermining the science used to support the theory.

  **4. The Dissociation Prediction (Empirical Tractability)**
  *   **Specification:** The theory must specify the neural or computational conditions under which the "seeming" mechanism could be dampened or lesioned while discriminative and hedonic capacities remain intact. It must state whether such a subject would report "nothing it is like" or lack the capacity to report at all.
  *   **Motivation:** Your proposed dissociation (damped self-model, intact function) is the "smoking gun." If the theory cannot conceive of a state where the illusion is absent but function remains, the illusion is functionally redundant or identical to the function, threatening the claim that it is an *error*.
  *   **Status:** **Preference.** While theoretically vital, current neurotechnology may not allow us to test this. However, the theory must assert such a state is *possible in principle*.

  **5. The Containment Requirement (Domain Specificity)**
  *   **Specification:** The theory must explain why the error-generating mechanism applies to sensory/affective states but not to propositional attitudes (beliefs, intentions). It must distinguish the representation of "intrinsic qualities" from the representation of "functional roles."
  *   **Motivation:** If the introspective mechanism is globally unreliable, we lose knowledge of our own beliefs and intentions, leading to global skepticism. The error must be localized to the presentation of states as having intrinsic, non-relational qualities.
  *   **Status:** **Non-negotiable.** Global introspective skepticism is self-defeating for a theorist asserting a theory.

  **6. The Mechanism Requirement (The "How")**
  *   **Specification:** The theory must describe the physical or computational process that generates the false impression of intrinsic quality. It cannot simply assert "the brain represents itself"; it must detail *how* that representation acquires the specific "feel" of phenomenality (e.g., via non-conceptual content, higher-order misrepresentation, or control-system feedback).
  *   **Motivation:** You noted this as a gap. Positing an illusion without a mechanism is merely renaming the Hard Problem. We need to know which gears grind to produce the spark that isn't there.
  *   **Status:** **Non-negotiable.** A theory without a mechanism is a research program, not a solution.

  **7. The Adaptive Rationale Requirement (Evolutionary Tolerance)**
  *   **Specification:** The theory must explain why natural selection tolerated a system that systematically misrepresents its own internal states. It must identify the fitness benefit of the illusion (e.g., enhanced self-control, social signaling of suffering) or demonstrate it is a cost-free byproduct of a beneficial architecture.
  *   **Motivation:** Complex neural machinery is metabolically expensive. A systematic misrepresentation that consumes resources and potentially distorts decision-making requires an evolutionary explanation. Why lie to the organism?
  *   **Status:** **Non-negotiable** (for a naturalistic theory). Without this, the illusion is a maladaptive anomaly, making its universality inexplicable.

  **8. The Non-Phenomenal Characterization Requirement (Vocabulary)**
  *   **Specification:** The theory must characterize the *content* of the illusion using only physical, functional, or intentional vocabulary, without smuggling in phenomenal terms (e.g., "it seems like red," "raw feel," "inner glow"). It must define what the system is *doing* when it creates the illusion, not what it *feels like* to do it.
  *   **Motivation:** If you use phenomenal vocabulary to explain the illusion, you presuppose the existence of the very thing you are trying to eliminate. This is the "self-denying ordinance."
  *   **Status:** **Non-negotiable.** This is a logical constraint on coherence.

  ***

  ### Analysis of Constraints and Strategies

  **Is the Non-Phenomenal Characterization a genuine requirement?**
  It is a **genuine logical requirement**, not merely rhetorical. If an illusionist explains the illusion by saying, "The brain produces a state that *feels* like X," they have reified the feeling. They must say, "The brain produces a state that *carries the information* that X is present," where X is defined physically. The difficulty is that the *force* of the illusion (its compelling nature) is hard to capture without referencing the compulsion itself, which risks circularity.

  **Which pair of requirements cannot be jointly satisfied?**
  **The Structural Isomorphism Requirement (2) and The Non-Phenomenal Characterization Requirement (8).**
  To explain how the illusion mirrors the fine-grained structure of discrimination (Cartography) without admitting that there is a medium possessing that structure (Phenomenal Vocabulary) is the core tension. If you describe the structure functionally, it sounds like discrimination, not experience. If you describe it experientially, you violate illusionism. Capturing the *richness* of the error without granting the *reality* of the rich medium is the "Hard Problem" in reverse.

  **Which single requirement excludes the most candidate theories?**
  **The Adaptive Rationale Requirement (7).**
  Many philosophical versions of illusionism (e.g., early Dennett) treat the illusion as a conceptual confusion or a category mistake. These are hard to square with evolutionary biology. A category mistake does not require neural hardware; a systematic, universal, encapsulated illusion does. Explaining why selection built a "user-illusion" that consumes metabolic energy excludes purely conceptual or linguistic accounts.

  ***

  ### Evaluation of the Three Strategies

  **1. Locating the error in the Introspective Self-Model (e.g., Frankish)**
  *   **Performance:** Strong on **Mechanism** and **Recalcitrance** (modularity explains why belief doesn't cure it). Weak on **Non-Phenomenal Characterization**; it often struggles to describe the "quasi-phenomenal" properties of the self-model without implicitly referencing the very qualities being denied. It handles **Containment** well by limiting the error to the "phenomenal concept" application.

  **2. Locating the error in the Concepts we Deploy (e.g., Dennett)**
  *   **Performance:** Strong on **Containment** (the error is in our judgment, not the state) and **Non-Phenomenal Characterization** (concepts are public/functional). Weak on **Recalcitrance** (conceptual errors usually dissolve upon analysis, unlike this one) and **Cartography** (concepts are often too coarse to match the fine-grained structure of apparent experience).

  **3. Locating the error in our Reporting Practice (e.g., Behaviorist/Pragmatist variants)**
  *   **Performance:** Strong on **Reliability without Truth** (reports are moves in a language game, not descriptions of inner states). Weak on **Mechanism** (often ignores the neural generation of the urge to report) and **Dissociation** (if reporting is the whole game, a subject who doesn't report the "feeling" but acts normally is just following different rules, not revealing a dissociated mechanism).
