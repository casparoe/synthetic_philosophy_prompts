prompt: |-
  me and two friends have been running a tiny translation reading group for about a year now -- two poets, one retired latin teacher, me (i just like this stuff) -- and we just finished working our way throught Hofstadter's book on translation, the 1997 one built around dozens of re-translations of that short Renaissance-French poem by Clément Marot addressed to a sick young woman, where he keeps trying to hang onto rhyme and meter while changing everything else. Great book, but every single session ended the same way: someone says that version isn't faithful, someone else says faithful to what, and then we argue from vibes for an hour and go home. So I want a spec instead of vibes.

  What I want the theory for, so adequacy has something to be relative to: given a source text and a candidate translation, it has to be able to tell us what got carried over, what got dropped, and what got smuggled in -- and it has to be able to do that *without* collapsing it into one overall verdict, i.e. no single fidelity score, no "translation B is better than translation A" as the basic output. Multidimensional accounting or bust. It also needs to be able to refuse: to distinguish this text is untranslatable in a way that matters from you guys just haven't tried hard enough yet.

  So: write me the desiderata list. What does an adequate account of translation fidelity actually have to deliver? For each requirement give the case or consideration behind it -- the thing that made people demand it -- and mark it non-negotiable or this is a prejudice of one camp. Here's the pile of cases I want covered, plus whatever I'm obviously missing:

  - a nonsense poem where the invented words do most of the work, so there's barely any propositional content to be faithful to
  - a poem where the form *is* the content: say a poem about memory fading whose lines get shorter and shorter and whose rhyme words lose a syllable each stanza, so the shape carries the meaning
  - a text where one single ambiguity is the whole point, i.e. a pun that a translation must either resolve (destroying it) or replace with a different pun
  - a contract, a dosage instruction, an aircraft checklist -- where getting the spirit right and the letter wrong kills somebody, and where free adaptation is malpractice
  - dialect and register: a novel where a character's ungrammatical speech is doing class-marking work, and the target language's repertoire of class-marked ways of talking just isn't isomorphic to the source's
  - subtitling and dubbing, where there's a hard external budget (syllables, reading speed, lip movements) that forces loss whether you like it or not. Does a theory that can't even represent a budget count as defective, or is that a separate engineering problem?
  - intralingual and non-verbal cases: the same poem rendered into 1590s English, or into a conlang someone invented, or turned into a piece of music. Must a theory cover those, or is restricting to interlingual translation a legitimate scoping choice? I genuinely don't know which way this one goes.
  - texts with no settled source: a folk ballad with forty variants, a collaboratively edited manual, a text that came out of a language model. What is fidelity to, when there's no single authorial intention and no single fixed original?
  - a sacred text, where the community's practice treats certain words as non-substitutable and part of the reader's experience just *is* that these are the same words again

  And here's the bit I have no vocabulary for and care about most, so give it a real requirement and not a shrug. Call it the compensation-licensing condition: sometimes the rhyme won't survive, so a translator saves the line-endings with heavy alliteration instead, or keeps the meter but drops a metaphor and puts a different image of similar emotional weight elsewhere in the stanza. Some of those moves feel like genuine trades -- you lost something and you *paid* for it -- and some feel like a bribe, an unrelated nice thing nobody asked for. The theory has to say which substitutions count as legitimate compensation and which are just free goodies, and I want the principle behind the distinction, not a list of examples. Two riders on this: can a translation be better than its original and still be a translation, and if so what is better cashed out as? And can the theory represent two translations as incommensurable -- neither worse, just different -- as opposed to one being straightforwardly worse?

  One more I want ruled on: does the claim that no language is a cruder or less subtle version of any other belong on the list as a hard constraint any theory must respect, or is it just professional etiquette?

  Then, and this is the part I most want: mark which subsets of the desiderata can't be jointly satisfied. I have a suspicion that preserve the sense, preserve the form, and read like something a native speaker would actually write form a trilemma, and that be faithful to what the author was up to and be faithful to what the text did to its first readers come apart in a way no theory can paper over -- but do it properly and find the ones I haven't thought of. And tell me which single requirement on your list eliminates the most candidate theories.

  Short scorecard at the end, and I mean short -- a few sentences each, no table, I'll make my own: the letter-fidelity camp (Nabokov-ish, literal to the point of perversity, footnote rather than adapt), the reader-experience camp (Nida-ish dynamic equivalence, the target reader should be moved the way the source reader was), and the form-fidelity camp (Hofstadter-ish, the music is the thing, rewrite as freely as you need to keep it). The list is the deliverable; the scoring is just so I can see whether the list discriminates at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A small translation reading group (2 poets, 1 retired Latin teacher, 1 enthusiast) finished Hofstadter's *Le Ton beau de Marot*. They are tired of "vibes-based" arguments about fidelity. They want a *specification* (a theory/framework) for translation adequacy.
      *   **Goal:** Create a "desiderata list" for a theory of translation fidelity.
      *   **Key Constraints:**
          *   Must be multidimensional (no single fidelity score).
          *   Must distinguish carried over, dropped, and smuggled in elements.
          *   Must be able to declare "untranslatable" vs. "not tried hard enough."
          *   Must cover specific cases provided (nonsense, form-as-content, ambiguity/puns, high-stakes technical, dialect/register, subtitling constraints, intralingual/non-verbal, variant sources, sacred texts).
          *   **Crucial:** Must address the "Compensation-Licensing Condition" (legitimate trade-offs vs. bribes).
          *   **Crucial:** Must address "Better than Original" and "Incommensurability."
          *   **Crucial:** Must rule on "Linguistic Equality" (no language is cruder).
          *   **Crucial:** Must identify *incompatibilities* (trilemmas, mutually exclusive desiderata).
          *   **Crucial:** Must identify the single requirement that eliminates the most candidate theories.
          *   **Output:** Desiderata list with rationale and status (Non-negotiable vs. Prejudice), Incompatibility Analysis, Eliminator Analysis, Short Scorecard of three camps (Letter, Reader, Form).
          *   **Tone:** Intellectual, precise, slightly weary of vague theory but demanding rigor (matching the user's voice).

  2.  **Deconstruct the Desiderata (Drafting the List):**

      *   *Requirement 1: Dimensional Separation.* The theory must output a vector, not a scalar. (Addresses the "no single score" rule).
      *   *Requirement 2: Loss Accounting.* Must explicitly tag what is dropped. (Addresses "what got dropped").
      *   *Requirement 3: Gain/Smuggle Detection.* Must tag what is added. (Addresses "smuggled in").
      *   *Requirement 4: The Untranslatability Threshold.* Must distinguish structural impossibility from effort failure. (Addresses "refuse").
      *   *Requirement 5: The Compensation Principle.* (Addresses the "Compensation-Licensing Condition"). Needs a principle for valid trade-offs. *Idea: Functional Equivalence within a constrained domain.* If X is lost in Domain A, Y must be gained in Domain A, or Z must be gained in Domain B *only if* Domain B is functionally linked to A in the source's effect.
      *   *Requirement 6: Constraint Representation.* Must model external constraints (meter, lip-sync, word count). (Addresses subtitling/technical).
      *   *Requirement 7: Source Stability.* Must handle variant/flux sources. (Addresses folk ballads/AI).
      *   *Requirement 8: Register/Dialect Mapping.* Must acknowledge non-isomorphism in social markers. (Addresses dialect).
      *   *Requirement 9: The "Better Than" Clause.* Can a translation surpass the original? If so, how? (Addresses "better cashed out as").
      *   *Requirement 10: Linguistic Equality.* (Addresses the "cruder language" question).

  3.  **Refining the "Compensation-Licensing Condition":**

      *   This is the user's biggest pain point. How to distinguish a trade from a bribe?
      *   *Principle:* **Conservation of Effect.** A compensation is legitimate if it preserves the *functional load* of the lost element within the text's overall economy. A bribe adds aesthetic value that is orthogonal to the text's function.
      *   *Test:* If you remove the compensation, does the specific deficit caused by the loss return? If yes, it's compensation. If no, it's decoration.

  4.  **Addressing the "Hard Constraints" & "Prejudices":**

      *   *Linguistic Equality:* Is it a hard constraint? Sapir-Whorf suggests differences, but linguistic consensus says no language is inherently "cruder." However, for translation theory, treating them as isomorphic is a prejudice. Treating them as *capable* of equivalent expression is a necessary axiom for translation to exist at all. I'll mark it as a **Methodological Necessity**, not an ontological truth.
      *   *Intralingual/Non-verbal:* Restricting to interlingual is a legitimate scoping choice for *translation* theory, but *adaptation* theory covers the rest. I will mark including them as **Optional Scope**, but note that excluding them limits the theory's power on "form-as-content."

  5.  **Identifying Incompatibilities (The Trilemmas):**

      *   *The Classic Trilemma:* Accuracy (Sense), Naturalness (Flow), Form (Meter/Rhyme). You can pick two.
      *   *The User's Suspicions:* "Faithful to Author Intent" vs. "Faithful to Reader Experience." These diverge when cultural context shifts.
      *   *New Incompatibility:* "Source Stability" vs. "Fidelity to Variant." If the source is fluid (folk ballad), fidelity to *a* text is impossible; fidelity must be to the *process*.
      *   *The "Better Than" Paradox:* If a translation is "better," is it still a translation or a new work? This conflicts with "Fidelity to Source Structure."

  6.  **Identifying the "Theory Killer":**

      *   Which requirement kills the most theories?
      *   *Candidate:* Multidimensionality (kills all ranking systems).
      *   *Candidate:* The Untranslatability Threshold (kills universalist theories).
      *   *Candidate:* **The Compensation-Licensing Condition.** Most theories hand-wave this. Formalists ignore function; Functionalists ignore form. Demanding a principled account of *why* a trade is valid kills almost everyone except the most rigorous skopos theorists or Hofstadter himself (who often relies on vibes).
      *   *Decision:* The **Dimensional Separation (No Scalar Verdict)** is the biggest killer. Most evaluation *wants* a score. But the **Compensation Principle** is the deepest philosophical killer. I'll choose Dimensional Separation as the "filter" because it structurally prohibits the most common output (judgment).

  7.  **Drafting the Scorecard:**

      *   *Letter-Fidelity (Nabokov):* Fails Form, Fails Reader Experience. Passes Sense.
      *   *Reader-Experience (Nida):* Fails Form, Fails Letter. Passes Effect.
      *   *Form-Fidelity (Hofstadter):* Fails Letter, Fails Sense (sometimes). Passes Music/Form.

  8.  **Review and Refine (Self-Correction):**

      *   *Tone Check:* Ensure I'm not being too academic/dry. The user is smart and tired of jargon. Use precise language but keep it grounded.
      *   *Check Constraints:* Did I cover the "sacred text" case? Need to add a requirement about "Ritual Invariance."
      *   *Check Constraints:* Did I cover the "technical/contract" case? Need "Stakes Sensitivity."
      *   *Check Constraints:* Did I answer the "Better than original" question? Yes, under Compensation/Better.
      *   *Check Constraints:* Did I answer the "Incommensurable" question? Yes, under Multidimensionality.

  9.  **Final Polish:** Organize into the requested sections: Desiderata List, Incompatibility Analysis, The Eliminator, Scorecard. Ensure the "Non-negotiable" vs "Prejudice" tags are clear.

      *(Self-Correction on Compensation)*: I need to be very careful here. The user wants a *principle*, not examples. The principle is **Functional Conservation**. If a feature serves a function (e.g., rhyme creates mnemonic retention), the compensation must serve that *same* function (e.g., alliteration creates mnemonic retention), not just *a* function (e.g., alliteration sounds pretty).

      *(Self-Correction on Linguistic Equality)*: I will classify this as a **Methodological Axiom**. It's not that languages *are* equal in all respects, but the theory must *assume* translatability is possible unless proven otherwise (the Untranslatability Threshold handles the proof).

      *(Refining the "Better Than" clause)*: A translation can be "better" only in dimensions the original failed to maximize *relative to the target culture's constraints*, but it cannot be "better" in fidelity to the source's specific historical instantiation without ceasing to be a translation of *that* instantiation. Actually, simpler: It can be better as a *target-language poem*, but not as a *representation of the source*.

      *(Refining Incompatibilities)*: The user mentioned "Sense, Form, Native Flow." I should validate that but add the "Intent vs. Effect" split.

      *(Final check on the "Theory Killer")*: I think "No Scalar Verdict" is the most structural blocker. Most people *want* to judge. Forcing a vector output breaks standard evaluation models.

      Let's write it.

      *Wait, one more thing:* The user asked about Intralingual/Non-verbal. I need to take a stance. I will argue that restricting to interlingual is a **Legitimate Scoping Choice**, but the theory must acknowledge that the *mechanisms* of loss/gain are identical.

      *Okay, ready to generate.*
answer: |-
  Here is the specification list for a multidimensional theory of translation fidelity, designed to replace vibes with accounting.

  ### The Desiderata List

  **1. Dimensional Separation (The Vector Requirement)**
  *   **Requirement:** The output of the theory must be a vector of values (e.g., [Semantic: 0.9, Prosodic: 0.4, Pragmatic: 0.8]), not a scalar (e.g., "Good/Bad" or "85% Accurate").
  *   **Rationale:** Your group's core complaint. A single score collapses distinct types of success and failure into a meaningless average.
  *   **Status:** **Non-negotiable.** Without this, you cannot distinguish a translation that kills the rhyme to save the sense from one that kills the sense to save the rhyme.

  **2. The Loss/Gain Ledger**
  *   **Requirement:** The theory must explicitly categorize every deviation as *Dropped* (necessary loss), *Shifted* (moved to another location), or *Smuggled* (added without source basis).
  *   **Rationale:** Distinguishes between the tragedy of untranslatability and the crime of interpolation.
  *   **Status:** **Non-negotiable.** This is the "accounting" mechanism you requested.

  **3. The Compensation-Licensing Principle**
  *   **Requirement:** A deviation is licensed as "compensation" only if it preserves the **Functional Load** of the lost element. If a rhyme scheme served a mnemonic function, the compensation (e.g., alliteration) must also serve a mnemonic function. If it merely serves an aesthetic function ("it sounds nice"), it is a **Bribe**.
  *   **Rationale:** Distinguishes legitimate trades from unrelated "goodies." A bribe distracts from the loss; compensation mitigates the specific deficit caused by the loss.
  *   **Status:** **Non-negotiable.** This is the only way to prevent "I lost the meter but I added a joke" from counting as fidelity.

  **4. The Untranslatability Threshold**
  *   **Requirement:** The theory must provide a criterion for declaring a feature **Structurally Untranslatable** (e.g., a pun relying on phonemes that do not exist in the target language) versus **Effort-Dependent** (e.g., a complex metaphor that requires three lines to explain).
  *   **Rationale:** Prevents the "you just haven't tried hard enough" argument. Some losses are mathematical, not creative.
  *   **Status:** **Non-negotiable.** Required to handle the nonsense poem and the single-ambiguity cases.

  **5. Constraint Visibility**
  *   **Requirement:** External budgets (lip-sync, character limits, meter, word count) must be modeled as **Hard Constraints** that automatically downgrade fidelity scores in other dimensions without penalty.
  *   **Rationale:** Subtitling and technical manuals operate under physical limits. A theory that treats a 3-syllable limit the same as a creative choice is defective.
  *   **Status:** **Non-negotiable.** Required for the subtitling and technical cases.

  **6. Register Non-Isomorphism Acknowledgement**
  *   **Requirement:** The theory must acknowledge that social markers (dialect, class, archaism) are not isomorphic across languages. It must allow for **Functional Substitution** (e.g., translating a rural dialect into a sociolect that marks "outsider" in the target culture) without penalizing it as "inaccurate."
  *   **Rationale:** Required for the class-marking novel case. Literal translation of dialect often erases the class marking entirely.
  *   **Status:** **Non-negotiable.**

  **7. Source Stability Protocol**
  *   **Requirement:** For fluid sources (folk ballads, AI text, collaborative manuals), fidelity must be measured against the **Variant Set** or the **Generative Process**, not a single ur-text.
  *   **Rationale:** Required for the folk ballad/AI case. Fidelity to a non-existent single author is impossible.
  *   **Status:** **Non-negotiable.**

  **8. Ritual Invariance Clause**
  *   **Requirement:** For sacred or legal texts, the theory must allow for a dimension where **Form/Verbatim Accuracy** overrides **Semantic Clarity**.
  *   **Rationale:** Required for the sacred text and contract cases. In these genres, the *words themselves* are the object, not just the meaning they convey.
  *   **Status:** **Non-negotiable.**

  **9. The "Better Than" Condition**
  *   **Requirement:** A translation can be rated "better" than the original *only* in dimensions where the original failed to meet its own internal goals (e.g., a clumsy original poem rendered elegantly), but never in **Fidelity to Source Intent**.
  *   **Rationale:** Addresses your question on improvement. A translation can be a better *poem*, but if it improves the *meaning*, it has ceased to be a translation of that meaning.
  *   **Status:** **Prejudice (Formalist Camp).** Functionalists would argue a translation *should* improve clarity if the original was obscure.

  **10. Linguistic Equality Axiom**
  *   **Requirement:** The theory must operate on the assumption that all languages are capable of expressing any concept, though the *cost* (in verbosity, complexity, or loss of nuance) varies.
  *   **Rationale:** Addresses the "cruder language" question.
  *   **Status:** **Methodological Necessity.** It is not ontologically true (some languages lack specific tense structures), but if a theory assumes one language is inherently "cruder," it ceases to be a translation theory and becomes a hierarchy of value. It must be an axiom to allow translation to begin.

  **11. Scope of Medium**
  *   **Requirement:** Restricting the theory to interlingual text is a **Legitimate Scoping Choice**. Intralingual and non-verbal cases are *adaptations*, governed by similar mechanics but distinct constraints.
  *   **Rationale:** Addresses the conlang/music question. Including them dilutes the specific problems of linguistic mapping.
  *   **Status:** **Prejudice (Traditionalist Camp).** Expansionists argue translation is a subset of semiosis; restricting it ignores the "form is content" cases that cross media.

  ---

  ### Incompatibility Analysis

  You suspected trilemmas. You were right, but there are more, and they are structural.

  **1. The Trilemma of the Triple Crown**
  *   **Conflict:** **Preserve Sense** + **Preserve Form** + **Native Flow**.
  *   **Analysis:** You can satisfy any two, but never all three.
      *   Sense + Form = Translationese (violates Native Flow).
      *   Sense + Flow = Prose Paraphrase (violates Form).
      *   Form + Flow = Adaptation/Radical Rewrite (violates Sense).
  *   **Verdict:** Any theory claiming to solve this is lying. An adequate theory must force the user to choose which vertex to sacrifice.

  **2. The Intent vs. Effect Split**
  *   **Conflict:** **Faithful to Author Intent** vs. **Faithful to Reader Experience**.
  *   **Analysis:** These diverge when cultural context shifts. If the original used a slur to mark a villain (Intent: mark villain; Effect on original audience: disgust), and the target culture no longer recognizes that slur as offensive, a translation faithful to *Intent* keeps the slur (Effect: confusion), while a translation faithful to *Experience* swaps the slur (Intent: altered).
  *   **Verdict:** These are incommensurable. A theory must declare which "master" the translator serves.

  **3. The Stability vs. Fluidity Paradox**
  *   **Conflict:** **Source Stability Protocol** (Desiderata #7) vs. **Ritual Invariance Clause** (Desiderata #8).
  *   **Analysis:** You cannot have a theory that handles folk ballads (where the text *is* the variation) and sacred texts (where the text *is* the invariant) using the same definition of "Source."
  *   **Verdict:** A unified theory must treat "Source" as a variable definition, not a fixed object.

  **4. The Compensation Paradox**
  *   **Conflict:** **Compensation-Licensing Principle** (Desiderata #3) vs. **Dimensional Separation** (Desiderata #1).
  *   **Analysis:** If you strictly separate dimensions (Rhyme is Rhyme, Sense is Sense), you cannot license compensation (trading Rhyme for Alliteration). If you allow compensation, you are implicitly admitting the dimensions are fungible, which undermines the Vector Requirement.
  *   **Verdict:** This is the hardest knot. The theory must allow for **Functional Equivalence** across dimensions without collapsing the dimensions themselves.

  ---

  ### The Theory Eliminator

  **Which single requirement eliminates the most candidate theories?**

  **Dimensional Separation (Desiderata #1).**

  **Why:** 90% of translation criticism, evaluation rubrics, and publishing decisions rely on a scalar verdict ("This is a successful translation"). They want to know if they should publish it, award it, or study it. A theory that refuses to say "B is better than A" and instead says "B is higher in Form, A is higher in Sense" renders itself useless for decision-making. It eliminates all normative theories (Nida, Newmark, most academic critique) because they all ultimately seek to prescribe the *right* way to translate. Your spec demands a descriptive map, not a prescription.

  ---

  ### Scorecard

  **The Letter-Fidelity Camp (Nabokov)**
  *   **Performance:** Maximizes *Semantic Clarity* and *Source Stability*. Fails *Native Flow* and *Form*.
  *   **Verdict:** Passes the *Loss/Gain Ledger* perfectly (footnotes explain the loss). Fails the *Compensation Principle* (refuses to compensate, prefers to display the wound). Best for technical/sacred texts; fails the *Reader Experience* requirement.

  **The Reader-Experience Camp (Nida/Dynamic Equivalence)**
  *   **Performance:** Maximizes *Native Flow* and *Reader Effect*. Fails *Form* and often *Letter*.
  *   **Verdict:** Passes the *Register Non-Isomorphism* requirement well. Fails the *Untranslatability Threshold* (assumes everything can be made clear). Often violates the *Compensation Principle* by adding "clarifications" that count as Bribes. Best for missionary/propaganda text; fails the *Poetic Form* requirement.

  **The Form-Fidelity Camp (Hofstadter)**
  *   **Performance:** Maximizes *Form* and *Native Flow* (as a new poem). Fails *Letter* and often *Semantic Precision*.
  *   **Verdict:** Passes the *Compensation Principle* best (actively trades constraints). Fails the *Source Stability Protocol* (treats the text as clay). Best for poetry; fails the *Contract/Dosage* requirement catastrophically.

  **Final Note:** Your spec effectively proves that "Translation" is not one activity, but a label for three distinct activities (Documentation, Communication, Art) that share a name but cannot share a single metric of success.
