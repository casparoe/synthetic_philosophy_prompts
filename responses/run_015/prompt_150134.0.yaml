  ok so i've been trying to sort out my own thoughts on voting ethics cos i keep feeling pulled in different directions, and i want to check whether my view actually hangs together or if i'm just helping myself to contradictions. here's roughly where i've landed:

  1. i think voting is a civic duty - not cos one vote swings anything, but cos it's part of living in a society, like jury service. you particpate cos people need to show up.

  2. but i also think voting is mainly expressive: you're saying what world you want, not playing chess. voting for someone you don't actually support just to block a worse one feels like lying about where you stand.

  3. that said, if there's one candidate who's genuinely dangerous and another who's just rubbish, i think you should vote for the rubbish one - stopping harm is more important than keeping your vote "pure".

  4. i also think that if every option is genuinly corrupt then staying home is a valid protest, and you shouldn't let anyone guilt-trip you for it.

  5. lately i've been wondering if democracy is less about who wins and more about the ritual of people disagreeing in public without violence. so voting for a tiny party that can't win might actually be more valuable than backing the winner, cos it keeps the disagreement visible.

