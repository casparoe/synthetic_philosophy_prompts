      *   **The Tension:** Signs *look* universal/natural (iconic) but *function* through convention (symbolic).
      *   **The Practice:** Airport signage. It works *as if* meaning is immediate, but actually relies on standardization (ISO standards).
      *   **Philosophical Themes:** Iconicity vs. Symbolicity (Peirce), Conventionalism vs. Naturalism, Universalism vs. Cultural Relativism, Pragmatism (does it work?).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the Neurath connection. Set the stage: Signage isn't magic; it's a specific philosophical bet.

