              2.  **Convention Stability:** Once a sign is agreed upon, it stays stable enough across borders.
              3.  **Contextual Disambiguation:** The environment helps fix meaning (a toilet sign in a terminal means toilet, not "art").
          *   *Accompanying Beliefs (Often thought, but not strictly necessary):*
              1.  **Total Transparency:** That the sign needs *no* learning. (False, we learn them).
