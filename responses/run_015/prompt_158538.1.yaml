answer: |-
  This is an exceptionally sophisticated question for a high school student. You have correctly identified a tension that occupies professional semioticians and philosophers of language: the gap between the *appearance* of natural meaning in images and the *reality* of social convention.

  Your connection to Otto Neurath is apt. Neurath's ISOTYPE (International System of TYpographic Picture Education) was not just about making things "look nice"; it was a philosophical project rooted in Logical Empiricism. He wanted to bypass the "metaphysical fog" of abstract language by using pictures that depicted observable *Ballungen* (clusters of phenomena). However, as you noted, Neurath was not a naive realist; he knew pictures required social agreement to function.

  Here is a reconstruction of the implicit theory of meaning behind modern international signage, analyzed through the lens you provided.

  ### 1. The Implicit Theory: "Coordinated Conventionalism"

  The practice of international signage does **not** strictly presuppose that images are inherently transparent or that meaning is natural. If it did, there would be no need for the International Organization for Standardization (ISO) to spend years debating the exact angle of a suitcase handle or the silhouette of a human figure.

  Instead, the practice operates on a theory we might call **Operational Conventionalism**.

  *   **Meaning is Behavioral:** The theory defines "understanding" not as an internal mental state of grasping a truth, but as a successful physical reaction. If a traveler sees the icon and moves toward the exit, meaning has occurred.
  *   **Representation is Selective:** Like Neurath's *Ballungen*, the signs do not depict "Truth." They depict a *cluster of selected features* deemed relevant for action. A "baggage claim" sign does not show the metaphysical concept of ownership; it shows a cluster: [Suitcase] + [Carousel] + [Arrow].
  *   **Universality is Statistical, Not Metaphysical:** The system assumes that while no symbol is truly universal, there is a high enough statistical overlap in human visual cognition and modern cultural exposure to make specific symbols *function* universally.

  ### 2. Strict Presuppositions vs. Accompanying Beliefs

  To answer your question about what the practice *requires* versus what it *hopes*, we must distinguish between the conditions necessary for the system to function and the myths often told about it.

  **A. Strict Presuppositions (What must be true for this to work)**
  1.  **Perceptual Constancy:** It presupposes that human visual processing is sufficiently uniform across populations to recognize basic geometric shapes and biological forms (e.g., distinguishing a human figure from a tree).
  2.  **Stability of Convention:** It presupposes that once a symbol is standardized (e.g., by ISO), that standard can be maintained across political borders. Without institutional enforcement, the convention dissolves.
  3.  **Contextual Disambiguation:** It presupposes that the physical environment contributes to meaning. A "fork and knife" icon means "food" in an airport, but might mean "cutlery store" in a mall. The theory relies on the *context* to fix the *reference*.

  **B. Accompanying Beliefs (Common but not strictly necessary)**
  1.  **Immediate Transparency:** Many designers *hope* the signs are self-evident without learning. This is false. We learn these signs just as we learn words, but we learn them once and forget the learning process. The system works even if users have to learn the signs, provided the learning curve is short.
  2.  **Culture-Free Neutrality:** There is a belief that these signs escape culture. In reality, they export a specific culture (usually Western/Industrial). For example, the "envelope" icon for mail is becoming obsolete as digital communication rises, and the "telephone" handset icon is confusing to teenagers who have never held one. The system survives despite this cultural baggage, not because it lacks it.
  3.  **Theory-Neutrality:** The belief that the picture shows "reality." As Neurath argued, a picture of a "worker" always implies a theory about what a worker looks like (e.g., wearing a hard hat vs. a suit). The signage practice actually *embraces* this bias to ensure quick recognition, even if it claims neutrality.

  ### 3. Consistency with an Anti-Metaphysical View

  You asked if the practice requires a belief in inherent transparency or if it can be consistent with a conventionalist, anti-metaphysical view.

  **It is fully consistent with the conventionalist, anti-metaphysical view.**

  In fact, the signage practice is a triumph of Neurath's specific version of empiricism. It avoids metaphysics by refusing to define "Exit" or "Restroom" abstractly. Instead, it points to observable clusters:
  *   **Restroom:** Not defined by plumbing or biology, but by a cluster of [Door] + [Gendered Clothing Markers] + [Stick Figure].
  *   **Exit:** Not defined by legal egress rights, but by [Running Figure] + [Arrow] + [Doorway].

  The system works precisely because it **abandons the claim of natural transparency** in favor of **rigid coordination**. If the practice relied on images being "inherently transparent," it would not need international treaties to standardize them. The very existence of the standardization bodies proves that the practitioners know meaning is conventional. They are essentially creating a "controlled language" (like Neurath intended) where the vocabulary is visual rather than verbal.

  ### 4. Where the Practice is Philosophically Underdetermined

  "Underdetermined" means the theory does not provide enough information to decide the outcome. There are two key areas where the signage philosophy is underdetermined:

  1.  **The Selection of Features (The *Ballungen* Problem):** The theory says "depict observable clusters," but it does not say *which* features constitute the cluster. Why is "female" represented by a skirt? This is a cultural choice, not an observable fact. The philosophy of the signage cannot explain why one visual cluster is chosen over another; only sociology or power dynamics can explain that.
  2.  **The Threshold of Recognition:** The theory assumes "most people will understand." But it cannot define the boundary of "most." If 40% of travelers from a specific region misunderstand a sign, is the sign failed? The philosophy offers no metric for when a convention has broken down, only a pragmatic hope that it holds.

  ### 5. Confidence and Uncertainty

  **Confidence Level:**
  I am **highly confident (85-90%)** in this analysis regarding the philosophical and semiotic reconstruction. The logic follows established theories in the philosophy of language (specifically Pragmatism and Logical Empiricism) and aligns with the documented history of ISO standardization processes, which acknowledge the need for testing and convention rather than relying on "natural" meaning.

  **Point of Least Certainty:**
  I am **least certain (approx. 60%)** about the **empirical cognitive universality** of the "Strict Presuppositions."
  While I argue that the system *presupposes* perceptual constancy (e.g., that all humans process the stick figure similarly), there is ongoing debate in cognitive anthropology about how deeply culture affects visual perception itself. Some studies suggest that people from non-industrialized cultures may interpret 2D line drawings differently than those from industrialized cultures (e.g., interpreting a drawing of a cube as a flat arrangement of shapes rather than a 3D object). If visual perception itself is more culturally conditioned than currently assumed, the "Strict Presupposition" of perceptual constancy is weaker than I have analyzed it to be.

  ### Summary for Your Study
  You can argue that international signage is a **pragmatic implementation of Neurath's ISOTYPE**. It does not claim that pictures are magic windows to truth. Instead, it claims that pictures are **tools for coordination**. It avoids metaphysics by focusing on *action* (go here, do this) rather than *definition* (what is this?). It succeeds not because images are transparent, but because institutions successfully enforce a visual convention across borders.
