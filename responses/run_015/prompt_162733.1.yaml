      *   *Best Revision:* **Revise (1).** The definition of life needs to account for *dormancy* (cryptobiosis) without losing the requirement for *intrinsic organization*. This distinguishes embryos (dormant human organisms) from viruses (never organisms) and brain-dead bodies (broken organisms).

