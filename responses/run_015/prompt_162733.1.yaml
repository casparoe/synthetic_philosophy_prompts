      *   *Refining the (2) vs (5) conflict:* User says family thinks it sits badly. I need to validate why it *doesn't* sit badly logically, confirming the user's intuition is sound there. Brain death = loss of integration. PVS = loss of consciousness, retention of integration.
      *   *Refining the (3) vs (4) conflict:* Viruses vs. Embryos. Both inert. Distinction: Embryo has the *blueprint and machinery* to restart itself (given nutrients/warming). Virus has blueprint but *no machinery* to restart itself (needs host ribosomes). This fits a revised (1).

