          *   *Tension:* None. This is consistent. Viruses lack the machinery defined in (1).

      *   **Commitment (2) vs. Commitment (5):**
          *   (2) Brain dead = Not alive (despite heart beating/cells working).
          *   (5) PVS = Alive.
          *   *Analysis:* Brain death = total loss of brain function (including brainstem). PVS = loss of higher function, brainstem intact (breathing, sleep-wake cycles often intact).
          *   *Tension:* **Apparent only.** Biologically and legally, these are distinct states. Brain death is death; PVS is a severe disability. The user's intuition holds up against standard medical definitions. The family's confusion is common but scientifically unfounded.
