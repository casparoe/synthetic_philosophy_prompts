          *   *Tension:* Low to Medium. Standard biological definition of death (whole brain death) aligns with the organism ceasing to function as an integrated whole, even if parts (cells) function. (1) supports (2) if "system" = "organism."

      *   **Commitment (1) vs. Commitment (3):**
