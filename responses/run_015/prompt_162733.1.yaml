          *   *Cost:* To keep (3), you must amend (1) to allow for *potentiality* or *dormancy*. To keep (1), you must admit (3) is biologically false (they are "potentially alive" but not currently "alive").

      *   **Commitment (1) vs. Commitment (4):**
