answer: |-
  **Desiderata for a Theory of Coherent Extrapolated Volition and Idealised Preferences**

  **Introduction**

  In constructing a theory of Coherent Extrapolated Volition (CEV) or idealised preferences, the central aim is to define what an agent *would* want under conditions of improved epistemic and rational capacity, distinct from what they *do* want amidst ignorance and cognitive bias. For such a theory to be philosophically robust, it cannot merely offer a procedural definition; it must satisfy a set of normative and conceptual standards. The following desiderata establish the criteria by which any such account must be judged. These requirements address the theory's ability to guide action, its respect for personal identity, and its handling of radical cognitive change.

  **1. Normative Authority (The Non-Alienation Constraint)**
  *   **Requirement:** The output of the idealisation process must retain a normative grip on the actual agent. The agent must be able to recognise the idealised preference as authentically *theirs*, rather than as an external imposition or a directive from a stranger.
  *   **Motivation:** If a theory dictates that an agent's ideal self would value something the actual self finds abhorrent or unintelligible, the theory fails to capture *volition*. It becomes a theory of objective value, not idealised preference.
  *   **Counter-example:** Consider a pacifist who, under idealised reflection, is deemed to 'really' want to become a soldier. If the pacifist cannot trace a rational path from their current values to this conclusion without abandoning their core identity, the theory violates their autonomy. The ideal self becomes a tyrant over the actual self.

  **2. Epistemic Sensitivity and Stability**
  *   **Requirement:** The theory must demonstrate that preferences converge or stabilise as information increases, rather than oscillating indefinitely. However, this stability must not be achieved by insulating the preferences from new empirical data.
  *   **Motivation:** Idealisation presupposes that error stems from ignorance or processing limits. If more knowledge leads to perpetual value fluctuation, there is no 'extrapolated' volition to discover. Conversely, if the preferences are immune to new facts, they are dogmatic, not rational.
  *   **Counter-example:** A theory that suggests an agent would want X if they knew facts A and B, but would want not-X if they also knew fact C, without any higher-order principle to resolve C, fails to provide a coherent guide for action in the present.

  **3. Psychological Continuity**
  *   **Requirement:** There must be a preserved chain of psychological connectedness between the actual agent and the idealised agent. The idealised agent cannot differ so radically in memory, character, or fundamental temperament that they constitute a different person.
  *   **Motivation:** Volition is essentially tied to agency. If the idealisation process requires becoming a different entity to hold the 'ideal' view, the actual agent has no reason to care about that view.
  *   **Counter-example:** If the only way to resolve a moral dilemma is to become a purely logical entity devoid of empathy, the resulting preference belongs to a logic-machine, not the human agent. The theory would have solved the problem by eliminating the agent.

  **4. Inter-generational Preference Interference**
  *   **Requirement:** The theory must explicitly adjudicate the relationship between the current agent's idealised values and the actual values of future, cognitively modified versions of themselves. It must determine whether the current agent's volition is bound by the preferences of a future self whose experiential range and conceptual resources lie beyond the current agent's capacity to simulate.
  *   **Motivation:** This addresses the 'horizon problem' of extrapolation. If I enhance my cognition, I may acquire concepts (e.g., higher-dimensional aesthetics or post-scarcity ethics) that I currently cannot comprehend. If CEV defers to this future self, the current agent is surrendering agency to a 'black box'. If CEV ignores this future self, it fails to be truly *extrapolated*.
  *   **Specific Constraint:** The theory cannot simply assert that the future self is authoritative. It must explain *why* the current agent is bound by the judgments of a mind they cannot genuinely inhabit or understand. It must either accommodate this dependency (by defining a principle of rational deference) or rule it out (by setting a ceiling on cognitive modification relative to identity preservation).
  *   **Counter-example:** An agent refuses a cognitive enhancement because they fear their future self will value things they currently find repugnant. A theory that says 'take the enhancement, your future self knows best' without addressing the rupture in intelligibility fails to respect the current agent's rational autonomy.

  **5. Action-Guidance in Non-Ideal Conditions**
  *   **Requirement:** The theory must provide a method for approximating idealised preferences in the real world, where ideal conditions (infinite time, perfect information) are unobtainable.
  *   **Motivation:** A theory of volition is practically useless if it only yields results in impossible counterfactual worlds. It must offer a heuristic for decision-making here and now.
  *   **Counter-example:** A definition that states 'what you would want if you knew everything' offers no help when you must decide now with limited data. If the theory cannot distinguish between a 'good guess' at your ideal will and a mere bias, it fails as a practical tool.

  **6. Value Pluralism and Incommensurability**
  *   **Requirement:** The theory must account for the possibility that idealised values may conflict without a single metric to resolve them. It must not force a false unity onto the agent's value system.
  *   **Motivation:** Human values are often fragmented. An idealisation process that smooths over all contradictions to produce a single utility function may be distorting the agent's volition rather than clarifying it.
  *   **Counter-example:** If an agent values both absolute liberty and total security, an idealisation that simply averages these into 'moderate liberty' may miss the nuanced tension the agent wishes to navigate. The theory must allow for unresolved tension if that is authentically what the agent would will.

  ***

  **Jointly Unsatisfiable Desiderata**

  It is crucial to recognise that certain pairs of these desiderata may not merely be difficult to reconcile, but logically incompatible. A robust theory must acknowledge these trade-offs rather than claiming to satisfy all simultaneously.

  *   **The Tension between Psychological Continuity (3) and Inter-generational Preference Interference (4):**
      *   **Conflict:** To satisfy *Inter-generational Preference Interference* in its strongest form (deferring to the cognitively superior future self), one must allow for radical cognitive modification. However, radical cognitive modification threatens *Psychological Continuity*. If the future self possesses conceptual resources the present self cannot simulate, the present self cannot verify the continuity of identity.
      *   **Unsatisfiability:** You cannot guarantee that the future entity is 'you' (Continuity) while simultaneously admitting that their cognitive architecture is so advanced that their reasoning is opaque to you (Interference). If their reasoning is opaque, you cannot confirm they are acting on *your* values rather than new, alien values generated by the modification. A theory must therefore choose: either limit the scope of extrapolation to preserve identity, or permit radical extrapolation and accept that the resulting volition may belong to a successor rather than the original agent.

  *   **The Tension between Normative Authority (1) and Epistemic Sensitivity (2):**
      *   **Conflict:** *Normative Authority* requires the agent to recognise the output as their own. *Epistemic Sensitivity* requires the output to change based on information the agent currently lacks.
      *   **Unsatisfiability:** If the new information is sufficiently disruptive, the resulting preference may be unrecognisable to the current agent (violating Authority). If the theory constrains the extrapolation to ensure the result remains recognisable (preserving Authority), it effectively insulates the values from the full impact of the new information (violating Sensitivity). A theory cannot guarantee that the truth will always feel like home.

  ***

  **Brief Assessment of Contending Models**

  Having established the desiderata, we may briefly assess three common frameworks against these standards.

  **1. Coherence-Based Extrapolation Model**
  This model posits that idealised volition is the result of smoothing out inconsistencies in an agent's current preference set until a coherent whole remains.
  *   **Performance:** It scores highly on *Stability* (coherence implies consistency) and *Action-Guidance* (logical consistency is a clear procedural goal).
  *   **Failure:** It struggles significantly with *Value Pluralism*. By prioritising coherence, it risks editing out authentic conflicts in the agent's character, violating the *Non-Alienation Constraint*. Furthermore, it often fails the *Inter-generational* criterion, as logical coherence does not necessarily account for the qualitative shift in values brought about by radical cognitive enhancement.

  **2. Reflective-Equilibrium Framework**
  This approach seeks a balance between particular moral intuitions and general principles, adjusting both until they fit.
  *   **Performance:** It handles *Value Pluralism* well, allowing for nuanced adjustments rather than forced unity. It also respects *Psychological Continuity* by grounding the process in the agent's existing intuitions.
  *   **Failure:** It is vulnerable regarding *Epistemic Sensitivity*. Reflective equilibrium can become a closed loop where the agent merely rationalises their existing biases. More critically, it falters on *Inter-generational Preference Interference*; an agent cannot reach equilibrium with a future self whose intuitions they cannot simulate or comprehend.

  **3. Aggregationist Preference-Construction View**
  This view constructs the ideal preference by aggregating the preferences of the agent across different possible states of information or time, often weighting them by rationality.
  *   **Performance:** It offers a strong solution to *Action-Guidance* by providing a mathematical or procedural method for decision-making. It attempts to respect *Epistemic Sensitivity* by incorporating varied informational states.
  *   **Failure:** It faces the severest challenge regarding *Normative Authority*. Aggregation can lead to outcomes that no specific 'version' of the agent actually holds, creating a 'tyranny of the average' that alienates the actual agent. It also risks violating *Psychological Continuity* if the aggregation weights future, modified selves too heavily against the present self.

  **Conclusion**

  Any viable theory of coherent extrapolated volition must navigate the treacherous space between what an agent is and what they might become. The desiderata outlined above demonstrate that the primary challenge is not merely computational or logical, but metaphysical: defining the boundaries of the self across time and cognitive states. As highlighted, the tension between preserving identity and allowing for radical improvement suggests that no theory can satisfy all requirements perfectly. A successful account must therefore be explicit about which desiderata it prioritises and which it must inevitably compromise.
