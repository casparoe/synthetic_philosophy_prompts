prompt: |-
  I am drafting an independent research essay for my sixth-form philosophy coursework, and before I evaluate particular accounts I want to establish the standards by which any theory of coherent extrapolated volition and idealised preferences ought to be judged. Write the desiderata: specify exactly what such a theory must be able to deliver — which concrete cases it must resolve correctly, which conceptual distinctions it must respect, and which broader philosophical commitments it must remain consistent with — giving the motivating reason or counter-example behind each requirement, and explicitly flag any pair of desiderata that appear jointly unsatisfiable rather than merely difficult to reconcile. I want you to include a criterion addressing what I call inter-generational preference interference: the problem that an agent's idealised values may depend on predicting the preferences of future, cognitively modified versions of themselves whose experiential range and conceptual resources lie beyond anything the present agent can genuinely simulate, and the theory must either accommodate or rule out such dependency in a principled way. Additionally, please offer a brief assessment of how a coherence-based extrapolation model, a reflective-equilibrium framework, and an aggregationist preference-construction view fare against your list, but keep the bulk of the response on the criteria themselves rather than on scoring the contenders. Write in British English, do not include bibliographies, reading lists, or citations, and treat the task as conceptual analysis rather than literature review.
