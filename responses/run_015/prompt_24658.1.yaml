  The offer is made over dessert, the clink of silverware pausing as the bookie describes the toss. A fair coin is flipped repeatedly until it first lands heads. If this first heads appears on the $n$-th toss, the payoff is determined by $n$. When $n$ is odd, you win $2^n$ dollars; when $n$ is even, you lose $2^n$ dollars. The sequence of potential outcomes is $+2, -4, +8, -16$, and so on. To the untrained eye, this looks like a generous variation of the famous St. Petersburg paradox. To a quantitative risk analyst, it is the Pasadena game, a mathematical object designed to break the standard tools of decision theory.

  To understand the trap, one must first lay out the probability distribution. The coin is fair, so the probability that the first heads occurs on toss $n$ is $(1/2)^n$. This is a geometric distribution. The sum of these probabilities over all possible $n$ from 1 to infinity is exactly 1, meaning the game terminates with probability one; you will not be flipping forever. However, the payoffs are unbounded in both directions. As $n$ increases, the magnitude of the win or loss grows exponentially. There is no cap on how much you can win, but there is also no floor on how much you can lose.

  The first question a rational player asks is: what is the expected value? The expected value is the sum of each possible payoff multiplied by its probability. For the $n$-th toss, the probability is $(1/2)^n$ and the magnitude of the payoff is $2^n$. Their product is $(1/2)^n \times 2^n = 1$. The sign alternates based on whether $n$ is odd or even. Thus, the expected value is the sum of the series:
  $$1 - 1 + 1 - 1 + \dots$$
  In the St. Petersburg game, the payoffs are always positive ($2^n$), so the expected value is the sum $1 + 1 + 1 + \dots$, which diverges to positive infinity. While infinite expectation is counterintuitive, it is a well-defined quantity in the extended real numbers; it tells you the game is theoretically "worth" an infinite amount. The Pasadena game is more insidious. Here, the sum of the positive contributions ($1 + 1 + 1 + \dots$) diverges to positive infinity, and the sum of the negative contributions ($-1 - 1 - 1 - \dots$) diverges to negative infinity. Because both the positive and negative parts are infinite, the total expectation is undefined. It is not infinity; it is a mathematical indeterminacy.

  This indeterminacy leads to a profound defect in the concept of expected value for this game, best illustrated by the rearrangement of the series. In standard calculus, a series that converges only because positive and negative terms cancel each other out, but whose absolute values sum to infinity, is called conditionally convergent. While the specific series of contributions here ($1 - 1 + \dots$) oscillates, the canonical Pasadena formulation scales the payoffs slightly (by a factor of $1/n$) to make the series conditionally convergent. In such cases, the Riemann Rearrangement Theorem applies. This theorem states that if a series is conditionally convergent, its terms can be rearranged to sum to any real number whatsoever, or to diverge to positive or negative infinity.

  Why does this matter for a game? The order of summation in an expected value calculation corresponds to the order in which we consider the outcomes. If the value of the game depends on the arbitrary order in which we list the possible tosses, then the "expected value" is not a property of the game itself, but of our calculation method. This is not a defect in the arithmetic; it is a defect in the notion of expected value as a summary of the game. The mean fails to capture the risk because the distribution's tails are too heavy and symmetric in their divergence.

  If the mean is broken, we might look to the median. The median payoff is the value $M$ such that the probability of winning more than $M$ is at most 50% and the probability of losing more than $M$ is at most 50%. Let us calculate the cumulative probabilities. The probability that the game ends on the first toss ($n=1$) is $1/2$. The payoff is $+2$. Since 50% of the probability mass is already accounted for at this outcome, the median is well-defined at $+2$. Unlike the mean, the median is stable. It does not depend on the distant, astronomical tails of the distribution where the divergence occurs. It tells a simple story: half the time, you win $2$ dollars or less (in this specific case, exactly $2$ on the first toss); the other half, you face the risk of the subsequent tosses. The median provides a finite, robust anchor in a sea of infinite volatility.

  This brings the analyst to the bookie's question: what entry fee makes the game fair? For a risk-neutral player, a fair game is one where the expected net profit is zero. If the entry fee is $c$, the expected net profit is $E[\text{Payoff}] - c$. Since $E[\text{Payoff}]$ is undefined, subtracting any finite constant $c$ leaves the expectation undefined. There is no finite fee that makes this game fair in the expected-value sense. You cannot balance an undefined quantity with a number.

  Faced with this, a careful decision theorist has few defensible positions. The first is to refuse the game entirely. Since the expected utility is undefined, the standard axioms of rational choice provide no verdict; stepping away is a recognition that the metric is broken. The second is to accept the game for free. Since the median is positive ($+2$), and the first toss offers an immediate 50% chance of a win, a player focused on typical outcomes rather than averages might take the free option. The third is to replace the mean with the median as the decision criterion. If you value the median outcome, the game is worth $2$ dollars. However, this ignores the catastrophic risk of the even tosses; while the median is safe, the "average" experience over many repetitions would be wildly volatile. Finally, one might consider the minimax criterion, which suggests choosing the option with the best worst-case outcome. Here, the worst-case outcome is unbounded below (you can lose $4, 16, 64\dots$ dollars). Minimax offers no verdict either, as the loss is potentially infinite.

  The Pasadena game demonstrates that expected utility theory, while powerful, has a limited scope. It relies on the assumption that probabilities and utilities combine to form a convergent sum. When the stakes grow as fast as the probabilities shrink, the machinery grinds to a halt. The game is not just a paradox; it is a boundary marker. It shows that rational choice cannot always be reduced to a single number, and that in the presence of unbounded, oscillating risk, the very definition of "value" dissolves. The analyst at the dinner party should politely decline, knowing that some games are not meant to be played, but only understood.
