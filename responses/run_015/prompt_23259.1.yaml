          *   *Refinement:* The Gibbard (1973) proof actually uses a path-relation argument similar to Arrow's, but Satterthwaite (1975) provided a more direct combinatorial proof. The Muller-Satterthwaite theorem (1977) is the strong link: Monotonicity + Surjectivity $\to$ Dictatorship. Strategy-proofness implies Monotonicity.

  4.  **Evaluating "Sharpness" for Real Voting Rules:**
      *   *Arrow:* Critiques the *ranking* output. Real elections usually pick a winner, not a full societal ranking. IIA is the controversial axiom here (independence of irrelevant alternatives). Real systems (Plurality, Borda) violate IIA. So Arrow explains *why* they violate IIA, but doesn't directly address *voting strategy*.
      *   *GS:* Critiques the *winner selection* under *strategic behavior*. This is more behaviorally relevant. Voters care about winning, not the full social ordering. GS says if you want a non-dictatorial winner from $>2$ options, someone can game the system.
      *   *Verdict:* GS is sharper for *voting* (selecting a winner). Arrow is sharper for *welfare* (ranking states). Since the user asks about "voting rules like plurality or Borda," GS is more direct regarding *incentives*, while Arrow is more direct regarding *consistency*.
      *   *Nuance:* GS assumes ordinal preferences. If cardinal utility is allowed (Range Voting), GS doesn't apply. Arrow also assumes ordinal.

