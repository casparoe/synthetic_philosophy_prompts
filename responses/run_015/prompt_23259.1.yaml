      *   **Knowledge Level:** Has been reading social choice theory for ~1 year. Knows the statements of Arrow's Impossibility Theorem (AIT) and Gibbard-Satterthwaite (GS).
      *   **Goal:** Compare AIT and GS. Specifically address the common claim that they are "basically the same." Determine the technical relationship (implication?), differences in objects/hypotheses, and evaluate which is the "sharper tool" for real-world voting rules.
