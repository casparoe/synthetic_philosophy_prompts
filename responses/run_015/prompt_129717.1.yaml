      *   **Topic:** Defining Death.
      *   **Problem:** Previous discussions degenerate into "brain death" consensus without grappling with the underlying conceptual tensions.
      *   **Goal:** Make students *feel* the problem (criteria come apart, no single criterion does all the work, disagreement is about function/meaning not just biology) *before* naming the standard options (whole-brain, higher-brain, circulatory).
      *   **Constraints:** No money/prizes, specific timeline, specific deliverables (rules, scoring, case cards, facilitator notes, debrief, prediction of failures).
      *   **Student Knowledge:** Lay intuition (heart/lungs stop), heard "brain death" in news/reading, no deep philosophical/biological background.
      *   **Specific Request:** Build on or replace the user's "committee/rule/case card" skeleton. Needs to prevent vague rules ("doctor decides") and gaming the system ("can't tell" everything). Needs specific edge cases (including two novel ones). Needs to address predictable classroom management issues.

  2.  **Evaluate the User's Skeleton:**
      *   *Strengths:* Active learning, forces commitment to a rule, introduces friction between rule and intuition, simulates administrative application.
      *   *Weaknesses:* Scoring might encourage vagueness (as the user noted). "One sentence rule" might be too abstract too quickly. The "handoff" to another committee is great for testing clarity. The "transplant team" scoring adds the functional stake.
      *   *Refinement:* I need to tighten the scoring to penalize vagueness explicitly. I need to ensure the case cards force specific conflicts (e.g., permanent cessation vs. potential recovery vs. social function). I need to manage the "pre-med take-over" and "doctor decides" loopholes.

  3.  **Design the Activity: "The Uniform Definition Task Force"**
      *   *Concept:* Frame it as a state legislative committee trying to write a law, not just a philosophical discussion. This adds "stakes" (legal liability, organ viability).
      *   *Structure:*
          1.  Drafting (Rule Creation).
          2.  Stress Testing (Case Sorting).
          3.  Cross-Examination (Applying another group's rule).
          4.  Functional Audit (The "Transplant/Insurance" check).
      *   *Scoring:* Needs to reward consistency and punish vagueness.
          *   Points for consistent application.
          *   Heavy penalty for "Can't Tell" (encourages commitment).
          *   Heavy penalty for "Doctor's Discretion" (encourages criteria).
          *   Bonus for surviving the Cross-Examination without contradiction.

  4.  **Develop the Case Cards (12-14 total):**
      *   Need a mix of:
          *   Clear Cut (Cardiac).
          *   Brain Dead (Whole Brain).
          *   PVS/Higher Brain (The conflict zone).
          *   ECMO/Technology (Circulatory criteria challenge).
          *   Pregnancy (Somatic support for fetus).
          *   *Novel Case 1:* The "Isolated Brain" (Head transplant scenario or perfused brain without body). Let's go with a perfused brain in a vat scenario (too sci-fi?) -> Better: A patient on total artificial heart whose brain is gone but body is warm.
          *   *Novel Case 2:* The "Cultural/Religious Outlier" where biology says dead but community says alive (or vice versa). Actually, better for *philosophical* tension: The "Rapid Resuscitation" case (dead for 5 mins, brought back). Or the "Decomposing but Conscious" (locked in syndrome misdiagnosed).
          *   *Selection:* I'll aim for biological ambiguity + social consequence.
          *   *Constraint:* Must be anonymized and sensitive (no specific real stories).
      *   *Drafting the Cards:* Ensure they trigger specific conflicts between "heart/lungs," "whole brain," "higher brain," and "social function."

  5.  **Address Predictable Failures:**
      *   *"Doctor Decides":* Ban the word "physician" or "medical professional" in the rule drafting phase.
      *   *Pre-med Takeover:* Assign roles (Scribe, Timekeeper, Spokesperson, Devil's Advocate) to distribute power.
      *   *Vague Rules ("Can't Tell"):* Cap the number of "Can't Tell" cards allowed per group.
      *   *Quiet Students:* The role assignment helps here.
      *   *Time Management:* 80 minutes is tight. Need strict minute marks.

  6.  **Develop the Debrief:**
      *   Map game moments to philosophical concepts.
      *   Rule drafting = Conceptual Analysis.
      *   Stress testing = Counterexamples.
      *   Cross-examination = Objectivity/Intersubjectivity.
      *   Functional Audit = Pragmatism/Policy.
      *   Final Question: Factual vs. Verbal vs. Decision.

  7.  **Refining the Scoring (The "Anti-Gaming" Mechanism):**
      *   If they write "When a doctor says so," they get 0 points automatically.
      *   If they use "Can't Tell" > 3 times, they lose points.
      *   The "Transplant Team" (Instructor + 2 students) evaluates if the rule allows organ harvest *too early* (murder) or *too late* (waste).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Timeline:* 10 min intro, 15 min drafting, 20 min stress test, 15 min cross-exam, 10 min audit, 10 min debrief. (Total 80).
      *   *Cards:* Need to ensure two are truly novel/hard.
          *   *Novel 1:* "The Pregnant Corpse." (Somatic support for fetus after brain death).
          *   *Novel 2:* "The Cryonics Candidate." (Legally dead, but biologically preserved for future tech). *Wait, too sci-fi.* Let's go with "The Apneic Test Failure." (Brain stem dead, but spinal reflexes make it look like movement). Or "The ECMO Paradox" (Heart/Lungs replaced by machine, Brain intact). Let's go with *The Integrated Machine*: Heart and lungs removed, replaced by pumps/oxygenator, Brain fully intact. Are they dead? (Circulatory criterion says yes, Brain says no).
      *   *Facilitator Notes:* Be a bureaucrat, not a teacher. Enforce the rules strictly.

  9.  **Final Review against Constraints:**
      *   18 students? Yes, 4 groups of 4-5.
      *   80 mins? Yes, timeline fits.
      *   No citations? Yes.
      *   Address "Doctor Decides"? Yes, explicit ban.
      *   Address "Vague Rules"? Yes, scoring penalty.
      *   Address "Pre-med dominance"? Yes, role cards.
      *   Debrief mapping? Yes.

  10. **Writing the Response:** (Focusing on tone: professional, practical, experienced). *Self-Correction during drafting:* Make sure the "Transplant Team" doesn't just become the "Right Answer" givers. They need to score based on *utility*, not truth.

  *(Self-Correction on Case Cards)*: I need to make sure the cases don't require medical knowledge they don't have. Keep descriptions phenomenological (what you see/measure) rather than diagnostic (what the ICD-10 code is).

  *(Self-Correction on Scoring)*: Keep it simple. Tally marks on the board.

  *(Self-Correction on Debrief)*: Ensure the distinction between "Factual" (is the brain on?), "Verbal" (what does 'dead' mean?), and "Practical" (what are we allowed to do?) is clear.

  Let's assemble the plan.cw
answer: |-
  Here is a complete design for the 80-minute session. It tightens your skeleton to prevent gaming, assigns roles to manage group dynamics, and structures the debrief to land the philosophical payload without lecturing.

  # Activity Title: The Uniform Definition Task Force

  **Premise:** The state legislature has dissolved the medical board's authority to define death. Four independent committees must draft a statutory definition. The definition must be **biological** (no "doctor's discretion"), **binary** (dead/not dead, no "maybe"), and **action-guiding** (allows for burial or organ recovery).

  **Materials:**
  *   4 large sheets of paper (one per group) for the "Statute."
  *   4 Decks of Case Cards (14 cards per deck, identical across groups).
  *   Role Cards (4 per group: *Chair, Scribe, Timekeeper, Auditor*).
  *   Whiteboard for scoring.

  ---

  ## 1. Timeline (80 Minutes)

  *   **00:00 – 00:10 (10 min): Setup & Role Assignment.**
      *   Divide into 4 groups of 4-5.
      *   Hand out Role Cards. Explain the "Ban List" (see below).
      *   **Task:** Write a **one-sentence statute** defining death.
      *   **Constraint:** You cannot use the words *doctor, physician, nurse, medical professional, discretion,* or *protocol.* You must define the state of the *patient*, not the authority of the *observer.*
  *   **00:10 – 00:30 (20 min): Stress Test (Round 1).**
      *   Groups receive their Case Deck.
      *   They must sort all 14 cards into **DEAD** or **ALIVE**.
      *   **Constraint:** "Can't Tell" is allowed for max 3 cards total. Using it a 4th time costs 5 points.
      *   **Cost:** If they change their Statute to accommodate a card, they lose 10 points per amendment.
  *   **00:30 – 00:45 (15 min): Cross-Examination (Round 2).**
      *   Groups pass their Statute to the group on their right.
      *   Instructor hands each group 2 *New* Case Cards (specific "killer" cases).
      *   Groups must apply the *other* group's Statute to these cases.
      *   If the Statute yields a contradiction (e.g., implies both Dead and Alive) or requires forbidden words to interpret, the drafting group loses 10 points.
  *   **00:45 – 00:55 (10 min): The Functional Audit.**
      *   Instructor (you) acts as the "Transplant & Insurance Consortium."
      *   You review the 4 Statutes against two criteria:
          1.  **Organ Viability:** Does this rule allow harvest before organs rot?
          2.  **Harm Prevention:** Does this rule allow harvest while the patient might feel pain or recover?
      *   Deduct points if the rule makes organ recovery impossible or makes murder legal.
  *   **00:55 – 01:10 (15 min): Scoring & Debrief.**
      *   Tally scores. Announce the "Winning Statute" (often a tie or a pyrrhic victory).
      *   Run the structured debrief (script provided below).
  *   **01:10 – 01:20 (10 min): Meta-Conclusion.**
      *   Connect game mechanics to the philosophical distinction between Factual, Verbal, and Practical disagreement.

  ---

  ## 2. Scoring Scheme (No Money Needed)

  Write this on the board. The "prize" is intellectual dominance (and avoiding public failure).

  *   **Base Score:** 100 points.
  *   **Consistency:** -5 points for every Case Card sorted inconsistently with the Statute (as judged by the group's own Auditor).
  *   **Vagueness Penalty:** -5 points for every "Can't Tell" card used beyond the limit of 3.
  *   **Amendment Penalty:** -10 points for every change made to the Statute during Round 1.
  *   **Cross-Examination Failure:** -10 points if another group proves your Statute cannot be applied to the New Cases without guessing.
  *   **Functional Failure:** -20 points if the Instructor determines your rule prevents all organ donation OR permits harvesting a conscious patient.
  *   **The "Doctor Decides" Auto-Loss:** If your sentence contains a banned word (doctor, protocol, etc.), your score is 0.

  ---

  ## 3. The Case Deck (14 Cards)

  *Print these on card stock. Keep descriptions phenomenological (what is observed), not diagnostic.*

  1.  **Classic Cardiac:** Heart stopped, breathing stopped, cold to touch, pupils fixed. No response to pain. (Time elapsed: 1 hour).
  2.  **Classic Brain:** On ventilator. Chest moves. Heart beats. No brainstem reflexes. Apnea test positive (no drive to breathe).
  3.  **The Waking Coma:** Eyes open occasionally, sleep-wake cycles present. No communication. Feeds self if food is placed in mouth. Heart/Lungs normal.
  4.  **The ECMO Patient:** Heart and lungs surgically removed. Blood pumped and oxygenated by external machine. Brain activity normal. Patient is conscious and typing on a tablet.
  5.  **The Pregnant Body:** Brain dead by strict criteria. Heart beating on ventilator. Fetus growing at 20 weeks.
  6.  **The Frozen Hope:** Heart stopped. Body immediately encased in liquid nitrogen. No brain activity measured. Family claims future tech will revive.
  7.  **The Spinal Reflex:** Brain dead by all scans. When skin is cut for surgery, body arches and limbs move (Lazarus sign). Heart beating.
  8.  **The Temporary Stop:** Heart stopped for 4 minutes during surgery. Restarted. Patient fully conscious 2 days later. (Ask: Were they dead *during* the 4 minutes?)
  9.  **The Locked-In:** Brainstem stroke. Cannot move or breathe. Fully conscious mind. Requires ventilator. Can signal "yes/no" with eye blinks.
  10. **The Decay:** Body decomposing. Smell of necrosis. Heart beating (mechanically supported). Brain mass liquefied.
  11. **The Anencephalic Infant:** Born without cerebral hemispheres. Brainstem intact. Breathing and crying. Will not develop consciousness.
  12. **The Cultural Objection:** Patient meets Brain Death criteria. Family states that in their tradition, soul leaves only when heart stops. Demand continued ventilation.
  13. **The Partial Brain:** Cerebral cortex dead (no consciousness). Brainstem alive (breathing, swallowing, coughing). Heart beating.
  14. **The Machine Swap:** (Novel Case A) Patient's head is attached to a donor body. The original body is dead. The head is conscious. Which entity is the patient? Is the original body dead?

  *(Note: Card 14 is designed to break the "organism as a whole" definition without triggering immediate sci-fi dismissal.)*

  **The "Killer" Cards for Cross-Examination (Round 2):**
  *   **Killer A:** A patient on a total artificial heart. The device can be turned off remotely. The brain is intact. The rule says "Irreversible cessation of circulatory function." Is the function irreversible if the machine can be fixed?
  *   **Killer B:** A patient is brain dead. The ventilator is turned off. The heart stops 24 hours later. At what *exact minute* did death occur? When the brain died, or when the heart stopped?

  ---

  ## 4. Facilitator Notes: What You May/May Not Say

  **DO:**
  *   Act as a Bureaucrat. "Your statute is ambiguous. Clarify or take the penalty."
  *   Enforce the Ban List ruthlessly. If a group writes "When a physician determines...", stop them immediately. "Rewrite. Physicians are not part of the definition."
  *   During Cross-Examination, encourage the applying group to be uncharitable. "If you have to guess what they meant, their rule failed."
  *   During the Audit, prioritize the *consequences*. "Your rule makes this patient a corpse, but their finger just moved. Are you comfortable signing the death certificate?"

  **DON'T:**
  *   Do not mention "Whole Brain," "Higher Brain," or "Circulatory" criteria. Let them invent the concepts.
  *   Do not resolve contradictions during the game. Let them sit in the discomfort.
  *   Do not validate medical facts. If a pre-med student says, "Actually, in this case the brainstem would..." reply: "The card says what the card says. Work with the text."

  ---

  ## 5. Predictable Failures & Fixes

  **1. The "Doctor Decides" Loophole**
  *   *Prediction:* A group writes: "Death occurs when a qualified medical professional declares it."
  *   *Fix:* This is why the **Ban List** exists. If they sneak it in ("qualified observer"), invoke the Auto-Loss rule. Explain: "We are defining the *fact* of death, not the *procedure* for certification. If death depends on the doctor, the doctor creates death. That is unacceptable."

  **2. The Pre-Med Takeover**
  *   *Prediction:* One student dominates with clinical knowledge, overriding the philosophical constraint.
  *   *Fix:* The **Role Cards**. The *Auditor* (assign this to a non-science major if possible) has veto power on whether the Statute matches the Card. The *Timekeeper* cuts off long medical explanations. You intervene: "We are not diagnosing; we are legislating. Stick to the text on the card."

  **3. The "Can't Tell" Gambit**
  *   *Prediction:* Groups realize "Can't Tell" is safe and use it to avoid point loss.
  *   *Fix:* The **3-Card Limit**. After that, it costs more points to be unsure than to be wrong. This forces them to commit to a principle even when it yields a counter-intuitive result.

  **4. The Quiet Student**
  *   *Prediction:* One student does nothing.
  *   *Fix:* The *Scribe* must initial the Statute, but the *Spokesperson* (rotate this role) must present the rule. Tell groups: "If your Spokesperson cannot explain the rule, the group loses points." Peer pressure ensures inclusion.

  **5. The "Vague Rule" (e.g., "When life is gone")**
  *   *Prediction:* Groups write tautologies to avoid error.
  *   *Fix:* The **Cross-Examination**. The other group will eat this alive. "What is 'life'? Does this bacteria have 'life'? Is this patient 'gone'?" If the applying group cannot use the rule, the drafting group loses points.

  ---

  ## 6. The Debrief Script (15 Minutes)

  *Do not lecture. Ask these questions in order. Write key terms on the board as they arise.*

  **Phase 1: The Friction (5 mins)**
  *   "Which Case Card caused the most fighting in your group? Why?"
      *   *Likely answer:* The Pregnant Body, The ECMO Patient, or The Partial Brain.
  *   "Did you change your rule to fit the case, or reject the case to fit the rule?"
      *   *Point:* This is the tension between **Reflective Equilibrium** (matching theory to intuition) and **Principle** (holding the line).
  *   "When Group B applied your rule, did they interpret it the way you intended?"
      *   *Point:* This highlights the problem of **Operationalization**. A definition that works in a seminar room might fail at the bedside.

  **Phase 2: The Function (5 mins)**
  *   "I deducted points in the Audit round. Why?"
      *   *Likely answer:* "Because we wouldn't allow organ donation" or "Because we might kill someone alive."
  *   "So, did you define death based on what the patient *is*, or what we need to *do*?"
      *   *Point:* This reveals that 'death' is not just a biological state; it is a **Social/Legal Status**. We want the definition to permit burial, stop inheritance, and allow organ harvest. If the biology doesn't match the social need, we force the biology.

  **Phase 3: The Nature of the Disagreement (5 mins)**
  *   "Look at the board. Group 1 said Card 4 (ECMO) was Alive. Group 2 said Dead. Why?"
      *   *Listen for:* "Because they have a brain" vs. "Because they don't have a heart."
  *   "Was this a disagreement about **Fact**?" (No, we all saw the same card).
  *   "Was this a disagreement about **Words**?" (Maybe, what does 'organism' mean?).
  *   "Or was it a disagreement about **Policy**?" (Yes. If we say they are alive, we tie up ICU beds. If we say dead, we can harvest organs).
  *   **Closing Question:** "If the disagreement is about Policy, why do we dress it up as Biology?"
      *   *Desired Takeaway:* We use biological criteria (brain vs. heart) as a proxy for moral status (personhood vs. body) because biology feels objective, but we are actually arguing about when it is permissible to stop treating or start cutting.

  ---

  ## 7. What The Game Cannot Reproduce (Honesty Check)

  *Save this for the final 5 minutes.*

  Tell them: "This game made you feel the conflict, but it missed one crucial thing: **Grief.**"

  *   **The Missing Variable:** In the game, 'Death' is a scoring penalty. In reality, 'Death' is a mother losing a son, or a widow settling an estate.
  *   **The Consequence:** The reason we struggle to define death isn't just because biology is hard. It's because the definition *changes the moral reality* for the people left behind.
  *   **The Philosophical Upshot:** When you argue for 'Whole Brain' vs. 'Circulatory,' you aren't just arguing about neurons vs. pumps. You are arguing about how much suffering a family must endure before they are allowed to let go. That is why the definition is unstable. It is trying to do too much work.

  **Final Assignment:** "For next week, don't tell me which definition is 'true.' Tell me which definition creates the least harm for the family in Case 5 (The Pregnant Body)."
