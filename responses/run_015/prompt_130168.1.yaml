          *   One paragraph scenario.
          *   Realistic contrast questions (not philosophical puzzles).
          *   Identical evidence for both questions.
          *   No "bad lot" (both explanations must be decent).
          *   Incompatibility must arise from the setup (e.g., mechanism, bar height), not stipulation.
          *   Readable by non-specialists.
          *   Follow-up analysis (5 points): Name questions/explanations/evidence; Walkthrough; Structural feature; Bayesian verdict; Objection/Reply.
          *   Honesty clause: If specs conflict, admit it.

