  The server room at TechCorp went dark at 2:00 PM when Server A crashed, halting production, while identical Server B in the same rack kept running. The incident report lists three facts: a building-wide power surge was recorded at 2:00 PM; Server A was running outdated drivers known to be vulnerable to voltage fluctuations; Server B was updated last week. The facilities manager argues the crash was caused by the surge (Explanation A: Infrastructure Failure), implying the hardware environment was unsafe regardless of maintenance. The IT director argues the crash was caused by the outdated drivers (Explanation B: Maintenance Negligence), implying the surge was manageable had the software been patched. Both explanations are plausible root-cause stories that assign blame to different departments, and neither can be fully true if the other is the primary cause—if the surge was sufficient to crash a maintained server, the drivers didn't matter, and if the drivers were the decisive vulnerability, the surge was merely background noise. When the CEO asks, "Why did we crash today rather than yesterday?" the surge is the only variable that changed, making Explanation A the loveliest fit. When the CEO asks, "Why did Server A crash rather than Server B?" the surge is constant across both machines, making Explanation B the only one that distinguishes the outcomes. The same evidence yields two incompatible "best" explanations depending entirely on which contrast the questioner holds fixed.

  ***

  **1. The Components**
  *   **Contrast Question 1:** Why did Server A crash at 2:00 PM (*P*) rather than operate normally at 1:00 PM (*Q*)?
  *   **Contrast Question 2:** Why did Server A crash (*P*) rather than Server B operate normally (*R*)?
  *   **Explanation A (Infrastructure):** The power surge was the decisive causal factor; the environment was unsafe.
  *   **Explanation B (Maintenance):** The outdated drivers were the decisive causal factor; the system was vulnerable.
  *   **Evidence List (Constant):**
      1.  Power surge occurred at 2:00 PM (building-wide).
      2.  Server A had outdated drivers.
      3.  Server B had updated drivers.
      4.  Server A crashed; Server B did not.

  **2. The Walkthrough**
  *   **Question 1 (Temporal Contrast):** Here we compare Server A at *t2* (Crash) vs. Server A at *t1* (Normal). The driver status is constant (outdated at both times). The surge is the only difference. Explanation A (Surge) perfectly tracks the difference; Explanation B (Drivers) fails to explain why the server survived at *t1* despite having the same drivers. Thus, A is the best explanation.
  *   **Question 2 (Spatial Contrast):** Here we compare Server A (Crash) vs. Server B (Normal). The surge is constant (both experienced it). The driver status is the only difference. Explanation B (Drivers) perfectly tracks the difference; Explanation A (Surge) fails to explain why Server B survived the same surge. Thus, B is the best explanation.
  *   **Incompatibility:** If A is true (Surge was decisive), then updating drivers wouldn't have saved Server B (or A). If B is true (Drivers were decisive), the surge wouldn't have crashed a patched server. They compete for the title of *the* cause.

  **3. The Structural Feature**
  The work is being done by the **contrast class**. In Question 1, the contrast class is {Server A @ t1, Server A @ t2}, which holds maintenance constant and varies the environment. In Question 2, the contrast class is {Server A, Server B}, which holds the environment constant and varies maintenance. If you delete the contrastive structure and simply ask "Why did Server A crash?", the evidence underdetermines the answer because both factors are necessary conditions. The "flip" disappears if you treat the explanation as non-contrastive, leaving you with a conjunctive cause (Surge + Drivers) rather than two competing "best" explanations.

  **4. The Bayesian Verdict**
  A Bayesian conditioning on the full evidence list (including Server B's survival) updates their credence based on the likelihood of the evidence given the hypotheses. Since Server B survived the surge, the hypothesis "Surge was sufficient to crash" (Explanation A) is severely undermined. The Bayesian verdict aligns with **Explanation B** (Maintenance), as the control group (Server B) isolates the drivers as the differentiating variable. This is an **indictment** of IBE: it shows that IBE can validate an explanation (A) that a strict probabilistic update would reject, simply by framing the question to exclude relevant control evidence (Server B's status) from the contrast class. IBE's "loveliness" is sensitive to pragmatic framing in a way that raw confirmation is not.

  **5. Objection and Reply**
  *   **The IBE Defender's Reply:** "There is no problem here. Explanation is inherently contrastive. You haven't shown IBE is unstable; you've shown that 'Best Explanation' is elliptical for 'Best Explanation relative to contrast C.' Once you fix the contrast, IBE yields a unique verdict. The user simply asked two different questions."
  *   **The Counter-Reply:** "If IBE requires the contrast to be fixed *before* it can operate, then IBE is not a rule for fixing belief, but a rule for selecting answers. Belief (e.g., 'The drivers were at fault') should not oscillate based on how the question is phrased. If IBE tells me to believe A when asked about time, and believe B when asked about space, it fails to guide doxastic commitment. It becomes a tool for rhetoric rather than inference, telling me what story fits the question rather than what story fits the world."
