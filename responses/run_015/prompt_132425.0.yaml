  ## 3. The Rounds

  ### Round 1: Redundancy vs. Necessity (15 mins)
  **Goal:** Show that ordinary conditionalization works when likelihoods are known, but Kinematics is required when shifts are "brute."

  **Instructions:**
  1.  **Group A (Tables 1-3):** You receive **Certain Evidence**. The Vet says, "The ultrasound is Positive." You are given likelihoods: $P(Pos|H) = 0.8$, $P(Pos|\neg H) = 0.2$.
      *   *Task:* Update $P(H)$ using standard Bayes' Theorem.
  2.  **Group B (Tables 4-7):** You receive **Uncertain Evidence**. The Vet says, "I'm 90% confident the ultrasound is Positive." You are *not* given likelihoods. You are told to treat the shift in confidence as direct.
      *   *Task:* Update $P(H)$ using Jeffrey's Rule.
      *   *Input:* $P_{new}(Pos) = 0.9$, $P_{new}(\neg Pos) = 0.1$.
      *   *Fixed Conditionals:* $P(H|Pos) = 0.8$, $P(H|\neg Pos) = 0.2$ (Derived from the prior structure provided on the board).

  **The Math (For You):**
  *   Group A (Bayes): $P(H|Pos) = \frac{0.8 \times 0.5}{(0.8 \times 0.5) + (0.2 \times 0.5)} = 0.8$.
  *   Group B (Jeffrey): $P_{new}(H) = P(H|Pos)P_{new}(Pos) + P(H|\neg Pos)P_{new}(\neg Pos)$.
      *   $P_{new}(H) = (0.8 \times 0.9) + (0.2 \times 0.1) = 0.72 + 0.02 = 0.74$.

  **Debrief Point:** Ask Group A why they got 0.80 and Group B why they got 0.74.
  *   *Takeaway:* Group A conditionalized on an event they became *certain* of. Group B could not conditionalize because they never became certain of "Positive." They had to move the probability mass directly. The rule is not redundant when certainty is absent.

  ### Round 2: Order Dependence (25 mins)
  **Goal:** Demonstrate that sequential uncertain updates do not commute.

  **Setup:**
  *   Reset Priors to $P(H) = 0.50$.
  *   Distribute **Signal Cards**.
      *   **Group A gets Type A Cards:** Update on Ultrasound ($U$) first, then Lab ($L$).
      *   **Group B gets Type B Cards:** Update on Lab ($L$) first, then Ultrasound ($U$).

  **Card Text (Print these exactly):**

  > **TYPE A CARD (Ultrasound First)**
  > 1. **Update 1 (Ultrasound):** Shift confidence in $U$ to $P_{new}(U) = 0.9$.
  >    *   Use Fixed Conditionals: $P(H|U) = 0.8$, $P(H|\neg U) = 0.2$.
  >    *   *Calculate Intermediate $P_1(H)$.*
  > 2. **Update 2 (Lab):** Shift confidence in $L$ to $P_{new}(L) = 0.8$.
  >    *   **CRITICAL:** Because you already updated on $U$, your trust in the Lab test has shifted. Use these *new* conditionals:
  >    *   $P_1(H|L) = 0.7$, $P_1(H|\neg L) = 0.3$.
  >    *   *Calculate Final $P_{final}(H)$.*

  > **TYPE B CARD (Lab First)**
  > 1. **Update 1 (Lab):** Shift confidence in $L$ to $P_{new}(L) = 0.8$.
  >    *   Use Fixed Conditionals: $P(H|L) = 0.6$, $P(H|\neg L) = 0.4$.
  >    *   *Calculate Intermediate $P_1(H)$.*
  > 2. **Update 2 (Ultrasound):** Shift confidence in $U$ to $P_{new}(U) = 0.9$.
  >    *   **CRITICAL:** Because you already updated on $L$, your trust in the Ultrasound has shifted. Use these *new* conditionals:
  >    *   $P_1(H|U) = 0.75$, $P_1(H|\neg U) = 0.25$.
  >    *   *Calculate Final $P_{final}(H)$.*

  *(Note: The conditionals in Step 2 of each card are pre-calculated to reflect how the first update changes the relevance of the second signal, ensuring divergence.)*

  **The Math (For You):**
  *   **Group A:**
      *   Step 1: $0.8(0.9) + 0.2(0.1) = 0.74$.
      *   Step 2: $0.7(0.8) + 0.3(0.2) = 0.56 + 0.06 = \mathbf{0.62}$.
  *   **Group B:**
      *   Step 1: $0.6(0.8) + 0.4(0.2) = 0.48 + 0.08 = 0.56$.
      *   Step 2: $0.75(0.9) + 0.25(0.1) = 0.675 + 0.025 = \mathbf{0.70}$.

  **Activity:**
  1.  Give groups 10 minutes to calculate.
  2.  Have Group A write their final number on the left board, Group B on the right.
  3.  **Discovery:** The numbers will not match (0.62 vs 0.70).

  ### Round 3: Rigidity Failure (15 mins)
  **Goal:** Show that holding conditionals fixed is an assumption that can break.

  **Instructions:**
  *   All groups return to Prior $P(H) = 0.50$.
  *   **Scenario:** You receive a Lab Signal ($L$). You are told to shift $P(L)$ to 0.9.
  *   **Twist:** Immediately after receiving the signal, you learn the Lab equipment was drifting (as per your personal story).
  *   **Task:** Do you hold $P(H|L)$ fixed?
  *   **Action:** Ask students to raise hands.
      *   Option 1: Keep $P(H|L)$ fixed (Apply Jeffrey).
      *   Option 2: Adjust $P(H|L)$ downward because the signal is noisy (Violate Rigidity).
  *   **Discussion:** Most should intuitively choose Option 2.
  *   **Takeaway:** Jeffrey Conditionalization *requires* Rigidity ($P_{new}(H|E) = P_{old}(H|E)$). If the evidence changes your mind about the *reliability* of the evidence source, the rule breaks. It is not a calculation error; it is a failure of applicability.

  ### Round 4: Partition Sensitivity (10 mins)
  **Goal:** Show that the choice of partition matters.

  **Instructions:**
  *   **Group A:** Treat the evidence partition as **{Benign, Malignant}**. Shift $P(Benign)$ to 0.8.
  *   **Group B:** Treat the evidence partition as **{Benign, Malignant, Indeterminate}**.
      *   Prior: $B=0.5, M=0.3, I=0.2$.
      *   Shift: You feel "mostly Benign." Shift $P(B)$ to 0.8, distribute remaining 0.2 equally to $M$ and $I$.
  *   **Task:** Calculate the resulting probability of a specific sub-hypothesis, e.g., "Requires Surgery" (assume Surgery is true if Malignant OR Indeterminate).
  *   **Discovery:** Group A has no "Indeterminate" cell to manage. Group B does. The final probability of "Requires Surgery" will differ because Group B preserved the uncertainty in a third cell that Group A collapsed.
  *   **Takeaway:** Coarsening the partition is a substantive commitment, not just bookkeeping.

  ---

  ## 4. Debrief & Normative Closing (10 mins)

  **Map the Activity to the Theory:**
  1.  **Round 1:** Established that Kinematics is not redundant. When you lack likelihoods for a certain event, you cannot use Bayes. You must use Kinematics to move mass directly.
  2.  **Round 2:** Established Order Dependence. Unlike certain evidence (where $P(H|E \cap F) = P(H|F \cap E)$), uncertain shifts depend on which conditional probabilities you "froze" first.
  3.  **Round 3:** Established Rigidity Failure. The rule assumes the *meaning* of the evidence doesn't change. If the signal tells you the channel is noisy, the assumption fails.
  4.  **Round 4:** Established Partition Sensitivity. How you carve up the possibility space determines the output.

  **The Normative Closing (What you must supply):**
  Be frank with them: "This activity shows you *how* the rule behaves. It does not tell you whether you *should* use it."
  *   **The Hard Question:** Is holding conditional probabilities fixed (Rigidity) a requirement of rationality?
  *   **The Answer:** There is no consensus.
      *   *View A:* It is the minimal disturbance principle. If you have no reason to change $P(H|E)$, you shouldn't.
      *   *View B:* It is a dangerous fiction. Almost all real-world uncertain evidence carries information about reliability (Round 3), meaning Rigidity is almost always false.
  *   **Conclusion:** Use Jeffrey Conditionalization when you must, but treat the Rigidity condition as a modeling assumption to be defended, not a law of logic.

