  # Session Plan: The Kinematics of Uncertain Evidence

  **Course:** Upper-Division Formal Epistemology
  **Time:** 80 Minutes
  **Students:** 14 (Split into two large groups, Group A and Group B)
  **Goal:** Demonstrate the necessity, fragility, and order-dependence of Jeffrey Conditionalization (Probability Kinematics) through active calculation.

  ## 1. Materials & Setup

  **You need to bring:**
  *   **Poker Chips (2 colors):** 100 total. (e.g., Blue for "Benign," Red for "Malignant").
  *   **Whiteboard/Markers:** For tracking global scores.
  *   **Printed "Signal Cards" (2 types):**
      *   *Type A (7 copies):* "Ultrasound First" protocol.
      *   *Type B (7 copies):* "Lab Test First" protocol.
      *   *(See "The Rounds" section below for exact text/numbers to print on these).*
  *   **Printed "Prior State" Sheet (1 projected or drawn on board):**
      *   Hypothesis $H$: Mass is Benign.
      *   Prior $P(H) = 0.50$.
      *   Visual: 5 Blue chips, 5 Red chips.

  **Scoring Scheme: "Epistemic Credits"**
  *   There is no "truth" in this simulation, only coherence.
  *   **Calculation Credit (10 pts):** Awarded to any table that correctly calculates the weighted average according to the rule on their card.
  *   **Consensus Credit (5 pts):** Awarded if all tables in your Group (A or B) arrive at the exact same final number.
  *   **Payoff:** Credits convert to participation points. This incentivizes correct arithmetic and internal group communication without privileging one order over the other.

