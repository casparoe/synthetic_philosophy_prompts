  ## 5. Troubleshooting Guide

  **Problem 1: Students refuse to commit to a number.**
  *   *Symptom:* Tables discuss endlessly without writing a value.
  *   *Fix:* The "Chip Rule." Tell them they must physically place the chips in piles representing their final probability before they get credit. Physical commitment breaks philosophical hesitation.

  **Problem 2: Students re-derive priors.**
  *   *Symptom:* Groups ignore the $P(H)=0.5$ on the board and argue for their own prior.
  *   *Fix:* Remind them this is a simulation of *updating*, not *prior selection*. "For the sake of the experiment, you are this agent with this history. Stay in character."

  **Problem 3: Cross-talk destroys Order Comparison.**
  *   *Symptom:* Group A hears Group B's number and tries to match it.
  *   *Fix:* **Silent Update Phase.** During Round 2 calculations, forbid talking between the Left and Right sides of the room. Appoint yourself as the only messenger.

  **Problem 4: Arithmetic errors obscure the lesson.**
  *   *Symptom:* Divergence in Round 2 is due to math mistakes, not the rule.
  *   *Fix:* Walk the room during Round 2. Check the *Intermediate* number ($P_1(H)$). If Group A has 0.74 and Group B has 0.56 after Step 1, their math is right. If the finals diverge from 0.62/0.70, check the Step 2 conditionals.

  **Problem 5: Running out of time.**
  *   *Fix:* Drop Round 4 (Partition). It is the least critical of the three core insights. Ensure Round 2 (Order Dependence) completes, as that is the strongest mathematical result.

  ## 6. Limitations (For Your Eyes Only)

  *   **The "Why" of Rigidity:** The activity forces them to *use* rigidity (via the cards), but it cannot prove *why* one should accept it. You must explain in the closing that Rigidity is a normative constraint, not a descriptive fact.
  *   **The Joint Distribution:** In Round 2, we stipulated the new conditionals on the cards to save time. In reality, deriving $P_1(H|L)$ from $P_0$ requires a full joint distribution of $U$ and $L$. Students might ask where those numbers came from.
      *   *Response:* "In a full model, you would calculate that from the correlations. Here, we provided them to isolate the *structural* issue of order dependence from the *algebraic* issue of joint distributions."
  *   **Normative Force:** The activity shows that different orders yield different results. It does not show which order is *better*. You must close by admitting that formal epistemology currently lacks a definitive answer for how to sequence uncertain evidence when resources are limited.
