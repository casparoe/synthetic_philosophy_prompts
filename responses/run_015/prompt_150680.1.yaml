answer: |-
  Here is the brainstorming process, the selection of the surviving principle, and the application to your cases.

  ### Part 1: Candidate Principles

  I have generated five candidate principles based on your infrastructure metaphor. I will evaluate them against your seven verdicts before selecting one.

  **Candidate 1: The Utility Principle (Your Draft)**
  *Definition:* The history that circulates is the one most useful to the controllers of the copying infrastructure.
  *Strengths:* Handles Cases 4 (Lost Cause) and 5 (German Generals) perfectly. The North found reconciliation useful; the West found anti-Soviet expertise useful.
  *Weaknesses:* Fails Case 1 (Carthage). It wasn't that Carthaginian history was *useless* to Rome; it was that it was physically unavailable. Utility presupposes existence. It also struggles with Case 7 (Victors overturning their own myth), as overturning a myth is often less "useful" for stability than maintaining it.

  **Candidate 2: The Power Principle**
  *Definition:* History is the narrative that best legitimizes the current ruling class.
  *Strengths:* Explains Case 1 (Rome delegitimizes Carthage) and Case 4 (North legitimizes reconciliation).
  *Weaknesses:* Fails Case 6 (Archives Opened). Opening archives doesn't change the ruling class, yet the history changes. It also fails Case 7, where the "ruling class" (later generations) delegitimizes their own predecessors.

  **Candidate 3: The Entropy Principle**
  *Definition:* History is the random residue of records that survived physical decay and destruction.
  *Strengths:* Explains Case 1 (Carthage burned) and Case 2 (English chronicle survived by luck of monastery).
  *Weaknesses:* Fails Cases 4 and 5 completely. The Lost Cause and German memoirs were not random residues; they were actively curated and amplified. This principle ignores the "software" layer of history in favor of the "hardware."

  **Candidate 4: The Schema Principle**
  *Definition:* History is the account that best fits the pre-existing conceptual categories of the receiving audience.
  *Strengths:* Explains Case 3 (Aztec/Nahua). The Nahua accounts survived only because they were translated into Spanish Catholic categories (omens, prophecies).
  *Weaknesses:* Fails Case 1. No schema matters if the disk is wiped. It also struggles with Case 5, where the Western audience had to *adopt* a new schema (trusting Nazi generals) that didn't previously fit.

  **Candidate 5: The Intentional Distortion Principle (Rejected)**
  *Definition:* History is the lie that the victors tell to hide their crimes.
  *Reason for Rejection:* This breaks against your Verdict 4 and 7. In Case 4, the *losers* told the lie, and the victors accepted it. In Case 7, the victors told the *truth* against their own interest. This principle assumes malice where there is often negligence or utility. It is too anthropomorphic; it assumes a conspirator where there is often just a sysadmin.

  ### Part 2: The Surviving Principle

  The principle that survives is a synthesis of Utility and Entropy, framed in your infrastructure terms. I call it **The Principle of Least Institutional Friction.**

  **The Principle:**
  *The historical narrative that stabilizes is the one that minimizes the total cost of (a) physical preservation and (b) cognitive integration for the dominant information regime at the time of transmission.*

  "Friction" here is energy loss. A record encounters friction if it is hard to store (physical decay, destruction), hard to read (language loss, format obsolescence), or hard to accept (political risk, cognitive dissonance). The history that "wins" is the query result that returns the fastest with the least error handling.

  ### Part 3: Arguing for the Principle (Clause by Clause)

  I will now refine the principle clause-by-clause, showing which of your verdicts forces each addition. This addresses your worry about whether you need a disjunctive (ugly) account or a unified one. I argue for a unified account: "Friction" covers both physical destruction and political utility.

  **Clause 1: "The historical narrative that stabilizes..."**
  *Why:* We are not talking about "what happened" (ontology), but "what circulates" (epistemology).
  *Source:* All cases, but specifically Case 6. When archives opened, the narrative didn't "stabilize" until the new data was processed.

  **Clause 2: "...minimizes the total cost of physical preservation..."**
  *Why this is needed:* This handles **Case 1 (Rome/Carthage)**.
  *Argument:* You were worried that "usefulness" cannot explain Case 1. Under this principle, it doesn't have to. The "cost of preservation" for Carthaginian records was infinite because the storage medium (the city/archives) was physically zeroed out. No amount of political utility can overcome a physical cost of infinity. This saves the principle from needing a disjunction. It's not that Rome *chose* utility over truth; it's that the "Carthage.dat" file was corrupted beyond recovery.

  **Clause 3: "...and cognitive integration..."**
  *Why this is needed:* This handles **Case 3 (Spanish/Aztec)** and **Case 2 (Norman/English)**.
  *Argument:* In Case 3, the Nahua words survived (low physical cost) but required high cognitive integration cost (translation into Spanish categories). The version that stabilized was the one where the Friar did the work of integration for the reader. In Case 2, the English chronicle survived physically, but the "Feudal" frame had lower cognitive integration cost for the new Norman administrators, so it became the primary index.

  **Clause 4: "...for the dominant information regime at the time of transmission."**
  *Why this is needed:* This handles **Case 4 (Lost Cause)**, **Case 5 (Eastern Front)**, and **Case 7 (Self-Correction)**.
  *Argument:*
  *   **Case 4:** The "dominant regime" (the North) found the Lost Cause narrative had *low* cognitive integration cost. It allowed reconciliation. The physical preservation cost was paid by the Southern veterans' groups. The North didn't have to write it; they just had to not delete it. Low friction.
  *   **Case 5:** The "dominant regime" (the West) actively lowered the friction for German memoirs because they were useful for the Cold War. The cognitive integration cost was subsidized by political utility.
  *   **Case 7:** This is the hardest case. Why would a regime increase friction by overturning its own myth? Because the "dominant information regime" changed. The grandchildren are a different regime than the grandparents. The social cost of maintaining the lie (cognitive dissonance, scandal) eventually exceeded the cost of admitting the truth. The friction calculation flipped.

  **Addressing the Disjunction Worry:**
  You asked if you must accept a "disjunctive, ugly, two-mechanism account" to cover Case 1 (Availability) and Case 4 (Utility).
  *My Verdict:* No. You do not need a disjunction.
  *Reasoning:* A disjunction implies two different laws of physics. But in your infrastructure model, "Availability" is just "Storage Cost" and "Utility" is just "Processing Cost."
  In Case 1, Storage Cost is Infinite.
  In Case 4, Storage Cost is Low, Processing Cost is Low.
  In Case 7, Storage Cost is Low, but Processing Cost (social stigma) becomes High.
  It is all one equation: *Total Friction = Storage Cost + Processing Cost.* If either term spikes, the record drops out of the circulating history. This keeps your theory clean.

  ### Part 4: Application to New Cases

  Here is how the Principle of Least Institutional Friction applies to the three cases you requested.

  **Case A: A war ending in compromise, where both sides keep schools and presses.**
  *Verdict:* **Bifurcated History.**
  *Analysis:* The "dominant information regime" is not unified. There are two regimes with separate infrastructure.
  *Friction:* For Side A, Side B's narrative has high cognitive integration cost (it denies their legitimacy), and vice versa. Physical preservation is low for both.
  *Outcome:* Two stable histories circulate in parallel. There is no single "victor's history" because there is no single "copying infrastructure." The friction is minimized by segregation, not synthesis. This matches your intuition that "victor's history" requires a winner who controls the *whole* network.

  **Case B: An event with no winners (Plague/Earthquake), where accounts come only from literate elites.**
  *Verdict:* **Class-Captured History.**
  *Analysis:* There is no "victor" in the military sense, but there is a "victor" in the infrastructure sense: the literate class.
  *Friction:* The physical preservation cost for peasant/worker oral accounts is high (no writing). The cognitive integration cost for elite accounts is low (they fit the existing religious/administrative schema).
  *Outcome:* The history is not "Victor's History" but "Archivist's History." It is the version that was cheapest to serialize. The "victor" is not the side that won the war, but the format that survived the medium. This refines your definition: it's not about who won the fight, but who owns the disk.

  **Case C: The defeated side had the better bureaucracy, and victors run the country using the losers' paperwork.**
  *Verdict:* **Administrative Capture.**
  *Analysis:* This is the inverse of Case 1. The physical records (losers') have low preservation cost (they are organized and useful). The cognitive integration cost for the victors is initially high (they have to learn the system), but quickly becomes low because the system works.
  *Outcome:* The *data* is the loser's, but the *narrative* is the victor's. The victors will use the loser's spreadsheets to prove the victor's theories. This is distinct from Case 3 (Spanish/Aztec). In Case 3, the content was translated. Here, the *infrastructure* is adopted. The history becomes: "We conquered them, and here is the data proving we manage them better." The loser's bureaucracy becomes the victor's evidence.

  ### Part 5: The Technology Industry Case

  You asked about the retrospective explanation of why a technology won ("it was technically superior") after competitors are abandoned.

  *Verdict:* **This is Case 5 (Active Adoption), not Case 4 (Passive Acceptance).**

  *Analysis:*
  1.  **Physical Preservation:** The documentation for the losing tech (e.g., Beta, OS/2, Minidisc) often still exists physically. It is not Case 1 (Erasure).
  2.  **Cognitive Integration:** The narrative "It won because it was superior" has extremely low cognitive integration cost for the winners. It legitimizes their current stack. It validates their engineering decisions.
  3.  **The Loser's Voice:** In Case 4 (Lost Cause), the losers *wrote* the narrative. In Tech, the losers are usually scattered and silenced. They do not write the standard history. The winners write the history *about* the losers.
  4.  **Friction:** To admit "It won because of marketing lock-in" creates high social friction for the winners (it implies their engineering wasn't the deciding factor). To admit "The losing tech was better" creates high cognitive friction (why are we using this?).

  *Conclusion:* The "Technical Superiority" myth stabilizes because it minimizes friction for the dominant regime (the adopters). It is **Victor's History** in the sense of **Capture (Case 3)** and **Adoption (Case 5)**.
  *   It is **Capture** because the losing tech is re-categorized as "obsolete" or "niche" within the winner's taxonomy.
  *   It is **Adoption** because the winners actively circulate this narrative to justify their infrastructure.

  *Should your verdict match Case 4?*
  No. In Case 4, the Losers (South) successfully imposed their narrative on the Winners (North). In Tech, the Losers (Competitors) rarely impose their narrative. The Winners impose a narrative *upon* the Losers.
  Your verdict should be: **This is Victor's History via Administrative Capture.** The "source code" of the history is written by the winners, even if they claim it was determined by the "hardware" of technical reality. The competing systems aren't just abandoned; their *context* is garbage-collected. You cannot run the "why we lost" program because the runtime environment (the market context of that time) no longer exists.

  ### Summary of the Repair

  Your tentative principle ("useful and cheapest to transmit") was 90% correct. It failed only because "cheapest" was too vague.
  *   I have specified "cheapest" as **Least Institutional Friction.**
  *   I have defined Friction as **Storage Cost (Physical)** + **Processing Cost (Political/Cognitive).**
  *   This unifies Case 1 (High Storage Cost) and Case 4 (Low Processing Cost) without needing two different rules.
  *   It clarifies that "Victor" means "Controller of the Copying Infrastructure," which may be a military winner, a bureaucratic survivor, or a market dominant.

  You do not need to drop any verdicts. You only need to expand your definition of "cost" to include the energy required to keep a file on the disk *and* the energy required to convince the users to open it.
