      *   *Lexical/Conventional View:* The user mentions a "conventional, lexically encoded treatment." This is less standard than pragmatic accounts (like Fox 2007) but exists (e.g., specific modal semantics).
      *   *Is FCI a "Sense"?* Usually, FCI is considered an *inference*, not a *sense* of "or". Treating it as a lexical sense of "or" is a strong claim.
