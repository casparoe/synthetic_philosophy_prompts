      *   *Content vs. Machinery:* This is the key insight from the user. A lexical account saves machinery (no need for complex pragmatic derivation) but costs senses. A pragmatic account saves senses but costs machinery. The Razor specifically targets *senses*. So it favors pragmatics *by definition*.
