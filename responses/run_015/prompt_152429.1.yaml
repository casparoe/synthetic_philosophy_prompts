answer: |-
  ### 1. The Framing Check

  I need to start by addressing your last paragraph directly, because it conditions the utility of the menu below.

  **Is the motto just a quip?**
  **Confidence: High.**
  To a significant extent, yes. In contemporary literature, "Grice's Razor" (or Modified Occam's Razor) is frequently deployed as a dialectical conversation-stopper rather than a premise in a valid argument. It is a methodological heuristic for theory choice, not a truth-conditional constraint on the world. Using it to *refute* a lexical treatment is a category mistake. A theory can be less parsimonious and still be true. If your reading group treated it as a refutation, they committed a modal fallacy (confusing "less preferred" with "impossible").

  **Is Free Choice a bad test case?**
  **Confidence: Medium.**
  It is a risky test case for this specific razor, but not for the reason you might think. The debate over Free Choice Inferences (FCI) has largely shifted away from a binary "lexical sense vs. Gricean implicature" framework. Most current semantic/pragmatic accounts (e.g., Fox 2007, Aloni 2007) posit covert grammatical operators (exhaustification) that are neither lexical senses of *or* nor purely extra-grammatical pragmatic inferences. They are "semanticized pragmatics."
  If your colleague proposed a *strictly lexical ambiguity* account of *or* (i.e., *or* has a free-choice sense and an inclusive sense), the Razor is relevant. If they proposed a *conventionalized grammatical* account (e.g., a dedicated modal base), the Razor is less relevant because the "sense" isn't being multiplied in the lexicon, but the machinery is being added to the syntax. Your "Content vs. Machinery" distinction hits the nail on the head here.

  ---

  ### 2. The Menu of Theses

  Here are four distinct precisifications of "Senses are not to be multiplied beyond necessity," ordered from methodological triviality to metaphysical radicalism.

  #### Thesis 1: The Methodological Heuristic
  *   **Formulation:** All else being equal (empirical coverage, processing cost, acquisition data), a theory positing fewer lexical entries is to be preferred over a theory positing more.
  *   **Verdict:** Trivial / Methodological.
  *   **Refutation Power:** **None.** It makes the lexical account less *attractive*, not false. It shifts the burden of proof to the lexicalist to show why the pragmatic account fails.
  *   **Confidence:** High.

  #### Thesis 2: The Processing Constraint
  *   **Formulation:** The human language faculty is cognitively constrained such that storing distinct lexical senses is more costly than computing inferences via general reasoning; therefore, attested meanings *must* be pragmatic unless proven otherwise.
  *   **Verdict:** Substantive and Empirically Dubious.
  *   **Refutation Power:** **Weak.** It rules out the lexical account only if you assume the processing cost of storage > calculation. This is an empirical claim about cognitive architecture that is currently contested (e.g., retrieval of a stored sense might be cheaper than running an exhaustification algorithm).
  *   **Confidence:** Medium.

  #### Thesis 3: The Diachronic Priority Claim
  *   **Formulation:** Lexical senses only arise via the fossilization of pragmatic inferences over time. Therefore, if a pragmatic derivation is available synchronically, positing a lexical sense is historically implausible.
  *   **Verdict:** Substantive and Defensible (but not absolute).
  *   **Refutation Power:** **Low.** It suggests the lexical account is immature (the process isn't finished) rather than wrong. It allows for the possibility that FCI is currently lexicalizing. It cannot rule out a synchronic lexical account, only claim it is diachronically unstable.
  *   **Confidence:** High.

  #### Thesis 4: The Metaphysical Reductionism
  *   **Formulation:** Pragmatic mechanisms are ontologically fundamental to communication; lexical ambiguity is an illusion. Any meaning derivable via reasoning *is* derived via reasoning, not encoded.
  *   **Verdict:** False / Unmotivated.
  *   **Refutation Power:** **High (but self-defeating).** This would rule out the lexical account by definition. However, it is empirically falsifiable (e.g., by showing dissociation between pragmatic ability and semantic knowledge in aphasia) and most linguists reject this strong separation.
  *   **Confidence:** High.

  ---

  ### 3. Which Reading Are They Reaching For?

  **Confidence: Medium-High.**
  Your colleagues are likely reaching for a hybrid of **Thesis 1 (Heuristic)** and **Thesis 4 (Reductionism)**, without realizing they are sliding between them.

  In the heat of a reading group, the slogan functions as: "We have a pragmatic story (Grice/Scalar Implicature), so positing a sense is *unnecessary*, therefore it is *false*."
  This slide from "unnecessary" (parsimony) to "false" (ontology) is the error.

  **Does this survive your distinctions?**
  *   **Content vs. Machinery:** No, it does not survive. As you noted, the Razor explicitly targets *senses* (Content). It is silent on *machinery*. A lexical account of FCI reduces pragmatic machinery (no need for complex exhaustification stories) at the cost of lexical entries. If the group's goal is to minimize *total theoretical complexity*, the Razor is the wrong tool; it only minimizes *lexical* complexity. They are using a lexicon-specific razor to solve a general theoretical complexity problem.
  *   **Synchronic vs. Diachronic:** No, it does not survive. They are using it as a synchronic constraint ("Don't put it in the lexicon now") to settle a synchronic debate, but the justification ("beyond necessity") often relies on diachronic intuitions ("It *started* as an implicature").

  ---

  ### 4. Application to the Ambiguity of *Some*

  You asked if this makes a good objection to an ambiguity account of *some* (e.g., that *some* lexically means *some but not all*).

  **Confidence: High.**
  Here, the Razor has more bite, but only because the empirical landscape is different.
  *   **For *Some*:** The pragmatic derivation (Scalar Implicature) is robust, cancellable ("Some, in fact all"), and embeddable in ways that suggest pragmatic origin. Here, Thesis 1 (Heuristic) works well because the "necessity" condition is clearly not met: the pragmatic machinery *can* derive the reading.
  *   **For Free Choice:** The inference is often *not* cancellable in the same way and behaves differently under embedding. The "necessity" condition is murkier. If the pragmatic story requires incredibly complex machinery (e.g., specific exhaustification operators tuned for modals), the "necessity" of a lexical/conventional shortcut becomes plausible.

  **Verdict:** The slogan is a stronger objection to lexical *some* than to lexical/conventional FCI, precisely because the pragmatic alternative for *some* is simpler and better supported than the pragmatic alternative for FCI. Using the same slogan for both cases obscures this difference in empirical leverage.

  ### 5. Summary Advice for the Group

  If you want to push back without being pedantic:

  1.  **Point out the Category Error:** "The Razor dictates theory choice under conditions of empirical equivalence. Do we have empirical equivalence? If the pragmatic account requires 15 pages of covert operators and the lexical account requires one feature, have we actually saved complexity?" (This leverages your Content vs. Machinery distinction).
  2.  **Challenge "Necessity":** "Necessary for whom? If the pragmatic derivation is computationally intractable for a 3-year-old, but the lexical account is learnable, then the sense *is* necessary for acquisition." (This leverages your 'Necessity' question).
  3.  **Call the Bluff:** "Are we claiming the lexical theory is *false*, or just *ugly*? If it's just ugly, let's look at the data. If it's false, we need an argument, not a maxim."

  **Final Confidence on the whole picture:** High. The slogan is real (Grice, "Logic and Conversation", p. 47), but its application as a refutation is standard disciplinary overreach. Your intuitions about the distinctions are correct; the slogan collapses when you press on what counts as "senses" versus "machinery."
