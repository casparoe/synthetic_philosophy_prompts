answer: |-
  **Interview Questions for Dr. [Guest Name]**
  **Topic:** Agency as Authorship in the Doing/Allowing Distinction
  **Time:** 45 Minutes
  **Interviewers:** Advanced Undergraduates (Philosophy & Medical Ethics)

  **1. Defining the Baseline Threat**
  You ground the moral difference in "authorship": killing introduces a new threat, while letting die fails to stop an existing one. In palliative care, patients are often already threatened by terminal pathology. How do you define the "pre-existing threat" versus a "new threat" when the patient's baseline is already one of inevitable decline?
  *   **Follow-up:** You might appeal to the *natural history of the disease* as the pre-existing threat. But doesn't the physician's entry into the care relationship alter the baseline, making any subsequent non-intervention a choice to allow a threat *they* specifically undertook to manage, thereby blurring the line of authorship?

  **2. The Infusion Pump (Pausing vs. Power Failure)**
  Students devised a case where Nurse A pauses a pump to check the line and delays restarting, while Nurse B finds the pump stopped by a power failure and delays restarting. Both foresee the same deterioration. On your view, does Nurse A "author" the threat of ischemia while Nurse B does not, simply because Nurse A's hand interrupted the flow?
  *   **Follow-up:** You may argue that the pump's *normal functioning* is to run, so stopping it is an intervention. But if the pause was part of the standard protocol for checking the line, isn't that "stop" just as much a part of the normal clinical flow as the power failure is an external interruption, making the authorship distinction arbitrary here?

  **3. Withdrawing vs. Withholding Treatment**
  Consider withdrawing ventilation versus never starting it. Physiologically, the patient dies from hypoxia in both cases. Does turning off the machine introduce a "new threat" of hypoxia, or does it merely cease to hold back the pre-existing respiratory failure?
  *   **Follow-up:** You might claim the *disease* is the threat, not the machine. But if the machine has become physiologically integrated, does removing it not feel more like "killing" than "allowing," and if so, does your authorship view track our moral intuitions or contradict them in a way that undermines its practical guidance?

  **4. Moral Parity in Cases of Special Duty**
  There are cases where "allowing" seems as culpable as "doing," such as a parent starving a child versus poisoning them. If the distinction is morally fundamental, why does the blame seem to converge so completely in cases of special duty, such as the clinician-patient relationship?
  *   **Follow-up:** You might appeal to the *special duty of the clinician* to explain the heightened blame for allowing. But if duty can raise the blame for allowing to match doing, doesn't that suggest the fundamental moral weight lies in the *violation of duty* rather than the *authorship of threat*?

  **5. Trade-offs When Numbers Shift**
  If killing is inherently harder to justify than letting die, does this constraint hold when killing one patient (e.g., misusing medication to hasten death) could free resources that would prevent several foreseeable deaths from neglect on the same ward?
  *   **Follow-up:** You might argue clinicians have *agent-relative constraints* against killing. But in a public health crisis, aren't clinicians tasked with impartial stewardship of resources, which requires weighing lives equally regardless of who authors the threat?

  **6. The Sole Rescuer Problem**
  If I am the only person who can save a drowning child, my omission causes death. Does my unique capacity to intervene make me the "author" of the threat if I walk away, or does the threat remain external despite my ability to stop it?
  *   **Follow-up:** You might distinguish *causal authorship* from moral responsibility. But if moral responsibility tracks the ability to prevent harm, doesn't the "authorship" label become redundant to the "capacity to help," rendering the distinction philosophically idle?

  **7. Palliative Sedation and Intention**
  In terminal sedation, we hasten death to relieve suffering. Is this authoring a new threat (respiratory suppression) or allowing the underlying pathology to take its course?
  *   **Follow-up:** You might invoke the *Doctrine of Double Effect* (intention rather than authorship) to justify this. But if intention does the justificatory work in sedation, why insist authorship is the fundamental ground in other end-of-life decisions where intention is identical?

  **8. Clinical Feasibility and Risk**
  Ultimately, does the "authorship" view risk making medical practice impossible, since almost every intervention carries a risk of introducing a new threat (side effects) that could be fatal?
  *   **Follow-up:** You might distinguish *intended harm* from *foreseen risk*. But if the distinction relies on intention to filter out acceptable risks, are we not back to a view where authorship is secondary to the will, rather than the primary source of moral constraint?
