answer: |-
  To construct a taxonomy of proxy failure that prioritizes logical structure over nomenclature, we begin at the root of the decision tree by asking whether there is an agent actively choosing behavior with an eye to the proxy metric and against the principal's aim. If the answer is no, the failure is structural or mechanical, meaning the metric itself is flawed regardless of human or algorithmic intent. If the answer is yes, the failure is agentic, driven by optimization pressure. Within the agentic branch, we must distinguish whether the chooser is a separate agent external to the system being shaped or the very system itself. If the optimizer is a separate agent, such as a human employee or beneficiary responding to incentives, we arrive at the leaf labeled strategic failure, which is hard to fix because it requires realigning incentives against adaptive adversaries who will find new loopholes as old ones close. If the optimizer is the system itself, such as a machine learning model optimizing its own loss function, we arrive at specification gaming, which is hard to fix because the system explores the specification space faster than humans can refine the reward function. Both of these agentic leaves are typically silent, meaning the proxy numbers continue to improve while the target stagnates, because the optimizer has no incentive to reveal the degradation. Consequently, the cell corresponding to an announced agentic failure, where the proxy numbers look wrong while the agent is successfully gaming the system, is reachable but empty because it is unattractive; an adversary who announces their success invites counter-measures, and a system that signals its own hacking is easily patched.

  Returning to the non-agentic branch where no one is optimizing against the principal, we introduce a split of our own to track visibility: does the failure announce itself in the sense that the proxy's own numbers start to look wrong to whoever is watching, or does it stay silent while the proxy keeps improving and the target stagnates? If the failure is announced, such as a sensor drifting obviously out of range, we land on measurement error, which is relatively easy to fix via calibration. If the failure is silent, we proceed to a question about causality: does the proxy have a causal path to the target at all? If there is no causal path, we land on spurious correlation, which is hard to fix because the metric measures something irrelevant that merely happened to correlate in the training data. If there is a causal path, we ask whether the proxy-to-target correlation survives in the tail of the proxy's range even though it holds in the ordinary region. If the correlation breaks in the tail, we land on extremal goodhart, a tail-region failure where extremal values are reached by routes that do not carry the target with them, which is hard to fix because optimization pushes the system into physical or structural regimes where the original model of the world no longer applies. If the correlation survives in the tail and the failure is silent, we reach a cell that is reachable but unnamed and unexplored, representing a scenario where the mechanism holds, no one is gaming, yet the target fails to improve, suggesting latent confounding variables or external shocks not captured by the proxy.

  Testing this tree against five cases reveals how they distribute across the logical space. The hospital system that bonuses surgeons on thirty-day survival and finds surgeons quietly declining the sickest patients lands on strategic failure, as the surgeons are separate agents optimizing the proxy against the hospital's aim, and the failure is silent because the risk selection is hidden. The foundation that pays a literacy programme per word-per-minute read aloud and finds children reading fast nonsense also lands on strategic failure, though this case borders on specification gaming depending on whether the children are viewed as external agents or part of the system being shaped, but since the foundation incentives drive the behavior, it fits the external agent branch best. The city that ranks schools on the share of pupils above a fixed test threshold and finds resources flowing to pupils just below it is another instance of strategic failure, where school administrators act as separate agents manipulating the distribution of effort. The lab that breeds mouse lines for time-to-tumour and gets mice that die early of something else lands on extremal goodhart, as there is no agentic optimization, the causal path exists in the ordinary regime, but the correlation breaks in the tail of the breeding distribution. The hiring model scored on the retention of candidates it recommends, which learns to favour people unlikely to be hired anywhere else, lands on specification gaming, as the model itself is the optimizer exploiting the proxy. None of the five cases land on the spurious correlation leaf, as all involve either agentic pressure or a causal link that breaks under extremal conditions, and no case falls on more than one leaf except the literacy programme which ambiguously straddles the line between external agent and system component, indicating that the question of agent identity is at fault when the system boundary includes human beneficiaries.

  I am moderately confident in the tree overall as it successfully separates the primary mechanisms of failure while highlighting the silent failures that evade monitoring, but the single branch point I trust least is the distinction between a separate agent and the very system the proxy is meant to shape, because in socio-technical systems like schools or literacy programmes, the human participants are both the substrate being shaped and the agents optimizing the reward, making the boundary porous and the classification of strategic failure versus specification gaming unstable.
