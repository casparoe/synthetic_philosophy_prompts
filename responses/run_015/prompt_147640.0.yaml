answer: |-
  Your thought experiment is precise, and it strikes at the core of the functionalist commitment inherent in the user-illusion thesis. I will address it directly.

  My position is that System N is not conscious. It simulates the *reports* of consciousness without instantiating the *process* of consciousness. To explain why this does not collapse into behaviourism or exclude locked-in patients, we must refine the definition of the "user" in "user illusion."

  The "user" of the conscious interface is not a homunculus, nor is it merely external behaviour. The user is the distributed suite of downstream executive processes responsible for action selection, long-term planning, and somatic regulation. Consciousness is the compressed data format these processes use to negotiate competing predictive models. When I say consciousness is an interface, I mean it is a specific mode of information access within the system that grants global availability to specific subsystems for the purpose of coordination.

  In System N, the observer module is causally severed from these downstream executive processes. It generates a narrative, but because that narrative cannot modify priors, influence learning, or alter motor planning, it is functionally equivalent to a log file written to a disconnected drive. It possesses the syntax of consciousness but lacks the semantics of control. An interface that connects to nothing is not an interface; it is a screensaver. Therefore, System N lacks consciousness because it lacks the functional integration that constitutes the phenomenon.

  You argue that intuition suggests there is "something it is like" to be System N, provided the structural isomorphism holds. I reject this intuition as a projection error. When you imagine System N, you implicitly simulate its operations within your own brain, where such narratives are causally potent. You are lending System N your own functional connectivity. Stripped of that projection, there is no remainder. "What-it-is-likeness" is not an intrinsic glow accompanying neural firing; it is the operational feel of high-level predictive access. If the access grants no leverage over the system's state or trajectory, the operational feel does not arise.

  Regarding your concern about locked-in patients: the distinction lies in *architectural connectivity* versus *peripheral output*. A locked-in patient retains the intact causal loop between the generative model, the conscious interface, and the motor planning subsystems. The intention to move is formed, the conscious experience of willing occurs, and the command is sent; the failure is purely neuromuscular at the periphery. The interface is still connected to the "user" (the planning systems), even if the "effectors" (the muscles) are broken.

  System N, by contrast, suffers a central disconnection. The interface is severed from the planning systems themselves. It is not that the output is blocked; it is that the output is irrelevant to the system's operation. To attribute consciousness to System N is to attribute consciousness to a recording of a conversation rather than the conversation itself.

  Finally, you ask if this smuggles in behaviourism. It does not. Behaviourism defines mental states by observable output. I define consciousness by internal functional role—specifically, the role of broadcasting compressed predictive data for global coordination. System N fails this test not because it fails to behave, but because it fails to coordinate itself using the generated data.

  System N is a philosophical zombie not because it lacks behaviour, but because it lacks the internal causal architecture where the illusion performs its work. The "illusion" requires a function to be an illusion *for*. In System N, there is no function, and thus there is no one home to be illuded.
