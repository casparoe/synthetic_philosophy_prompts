  ### Marker's Comments

  **Q1: Definitions and Concepts (3/8)**
  *   **Heuristics Swapped (Major Error):** You have reversed the definitions of the negative and positive heuristics.
      *   *Your text:* "The negative heuristic is the forward-looking part... sketch of how to develop the belt." / "The positive heuristic... is the rule... that compositional differences... are not to count as counterevidence."
      *   *Correction:* It is the **Negative** Heuristic that forbids modus tollens against the hard core (the "don't touch" rule). It is the **Positive** Heuristic that provides the forward-looking guidance on how to develop the protective belt. A tired grader might miss this if they just see the words "heuristic" used correctly in context, but this is a fundamental conceptual error that undermines the rest of the answer.
  *   **Progressive/Degenerating:** Your definition here is strong ("excess [empirical content]... corroborated"). This saves you from a lower mark.
  *   **Superseded vs. Refuted:** You explain that programmes are "never refuted by anomalies," which is correct, but you don't explicitly define *supersession* in this section (i.e., replacement by a rival programme with greater corroborated content). You address this in Q2(b), but Q1 asked for it here.

  **Q2(a): EP's Problemshift (2/8)**
  *   **The "Fitting" Trap:** You classify the shift as **progressive** based on the 2011 Bay Islands result. However, the prompt states the parameters were *"estimated by fitting it to the full set of archipelago surveys, including the Bay Islands survey published in 1978."*
      *   *Why this matters:* For Lakatos, a shift is only progressive if the *excess content* is **novel**. If the data was used to fit the parameters, the 2011 result is accommodation (post-diction), not prediction. It does not count as corroborating excess content.
      *   *Verdict:* Because the "prediction" was actually a fit to known data, the programme is absorbing anomalies without generating novel facts. This is a **degenerating** problemshift. You reached the wrong verdict because you treated accommodation as prediction.
  *   **Credit:** You correctly applied the *definition* of progress you gave in Q1 (theoretical growth + confirmation), but you misidentified the empirical status of the Bay Islands data.

  **Q2(b): Supersession (5/5)**
  *   **Excellent Application:** This is the strongest part of the script. You correctly identify the criteria for supersession (rival explains previous success + novel corroborated content).
  *   **AP Analysis:** You correctly note that AP accounts for EP's successes plus (i) and (ii), and crucially, that the Ridge Islands prediction was *temporal novelty* (2009 prediction, 2011 survey, not fitted). This contrasts perfectly with the Bay Islands error in Q2(a). Full marks here.

  **Q2(c): Rationality in 1985 (2/4)**
  *   **Contradiction:** You state: *"an EP researcher who stayed... was being irrational"* but then immediately add: *"strictly this is a verdict we can make only now, looking back."*
      *   *The Issue:* These two claims contradict. If the verdict can only be made retrospectively, the methodology *cannot* tell the researcher in 1985 that she is irrational. Lakatos is explicit that we cannot demand "instant rationality."
      *   *Marking:* You get credit for acknowledging the retrospective nature of the judgment (the second sentence), but you lose marks for the initial claim that she *was* being irrational. The answer to "Would it tell her...?" is "No."
  *   **Defensible Slip?** A tired grader might see "irrational" and dock hard, or see "looking back" and award full marks. The contradiction sits in the middle. I have split the difference.

  **General Feedback**
  *   **Terminology:** Be precise with Lakatos's terminology. Swapping "Negative" and "Positive" heuristic is a significant error that suggests a misunderstanding of the "protective" vs. "generative" roles.
  *   **Novelty vs. Accommodation:** This is the crux of Lakatos's methodology. Always check whether data was *used to construct/fit* the theory or *predicted by* the theory. In this case, the prompt gave you the "fitting" detail explicitly to test this distinction.
  *   **Retrospectivity:** Lakatos's view on rationality is historical. Be careful not to attribute knowledge to agents that they could only have in hindsight.

  **Summary:** You have a good grasp of the *structure* of MSRP (hard core, belt, rivalry), but you stumbled on the specific definitions of the heuristics and the crucial distinction between prediction and accommodation. Q2(b) shows you can apply the logic well when the case is clear; Q2(a) shows you need to read the empirical details more critically.
