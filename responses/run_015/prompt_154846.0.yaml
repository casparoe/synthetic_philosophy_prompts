answer: |-
  Japan is not a counterexample to Hobsbawm and Anderson but rather a definitive case of "official nationalism" where pre-modern dynastic elements were deliberately repurposed through modern bureaucratic mechanisms to manufacture continuity that masked rapid social rupture. Under Hobsbawm's framework, the Meiji oligarchy engaged in classic "invented tradition" by taking the genuinely ancient institution of the monarchy and imbuing it with new, rigid political functions designed to stabilize a society undergoing violent industrialization. The claim of an unbroken line dating to 660 BCE was not a lie about the Emperor's existence, but a constructed narrative of *political* continuity used to legitimize the new constitution; Hobsbawm predicts exactly this, noting that invented traditions often use old materials to create new cohesion when old social fabrics are tearing. State Shinto (1868) fits this as a formalized ritual system separating the Emperor from Buddhism to establish him as a living deity of the state, providing the invariant rituals Hobsbawm identifies as necessary to naturalize modern authority. The 1890 Imperial Rescript on Education functioned similarly as a secular liturgy, ritualized in schools to instill loyalty through repetitive performance rather than organic cultural transmission.

  Anderson's model applies primarily through his concept of "Official Nationalism," a defensive reaction by dynastic states to popular nationalism, rather than his earlier "print-capitalism" model which emphasizes bottom-up vernacular markets. The 1903 state-controlled textbooks enforced a single historical narrative that allowed millions of strangers to imagine themselves as part of the same eternal family-state, serving as the mechanism for the imagined community. This stretches Anderson's original print-capitalism thesis because the Japanese vernacular was standardized not by novelists and capitalists but by state fiat, yet it confirms his later insight that modern states require standardized media to sustain the imagined community. The Japanese case breaks the European model only in that it repurposed an existing dynastic core rather than replacing it with a republic, proving Hobsbawm's point that invention does not require fabrication from nothing, but rather the strategic recontextualization of surviving symbols to serve modern state-building needs. Ultimately, your friend conflates the existence of the institution with the construction of the *nation-state* around it; the Emperor was real, but the idea that every peasant in Tohoku was a direct subject of a divine monarch in a unified nation-state was a Meiji invention required to mobilize resources for modern warfare and industry.
