answer: |-
  This is a sharp confusion to have, and you've put your finger on exactly where the translation breaks down. Your friend from analysis is right that PL people often *act* like classical mathematicians when they are sloppy, but she is wrong that the type theory itself forces the issue. The friction comes from how you interpret the word "exists."

  Here is the translation of the AC dispute into your vocabulary, followed by the residue report you asked for.

  ### 1. The Sigma Trap: Why your type is inhabited

  You wrote:
  `forall x : A, exists y : B, R x y -> exists f : A -> B, forall x : R x (f x)`

  In Agda/Coq, if `exists` is a `Sigma` type (`{ y : B & R x y }`), this statement is **a theorem**. It is inhabited by the identity function (or rather, a simple re-association of pairs).
  `fun (g : (x : A) -> { y : B & R x y }) => (fun x => proj1 (g x)), (fun x => proj2 (g x))`

  **Why this isn't the Axiom of Choice:**
  In your vocabulary, `Sigma` means "I have the data." If you have `(x : A) -> Sigma B (R x)`, you *already have* the function `f`. You have the witness `y` for every `x` stored in the pair. There is no "choice" to be made; the choice is already data.

  **The Classical Translation:**
  Classical mathematicians do not treat `exists` as `Sigma`. They treat it as **Truncated Existence** (let's call it `|| Sigma ||` or just `Prop` in Coq).
  To them, `exists y, R x y` means "It is contradictory that no such `y` exists," or "The set of such `y` is non-empty." It explicitly *erases* the witness.

  So, the actual Axiom of Choice, translated faithfully into your vocabulary, is not:
  `(Pi x. Sigma y. R x y) -> Sigma f. Pi x. R x (f x)`  (This is TTAC, a theorem).

  It is:
  `(Pi x. || Sigma y. R x y ||) -> Sigma f. Pi x. R x (f x)`
  *Or, if they want the function in the same truncated universe:*
  `(Pi x. || Sigma y. R x y ||) -> || Sigma f. Pi x. R x (f x) ||`

  The controversy is entirely about whether you are allowed to lift the truncation. Can you turn a "mere proposition" (truth) into "data" (a term)?
  *   **Constructive PL:** No. You cannot extract a term from a `Prop`. That breaks extraction.
  *   **Classical Math:** Yes. Truth *implies* the availability of a function, even if you can't write the code for it.

  ### 2. The Three Camps in PL Vocabulary

  Here is how the philosophical factions map onto type-theoretic stances.

  **Camp 1: The Classical Set Theorists (AC is unproblematic)**
  *   **PL Stance:** "Types are Sets (h-sets), and we postulate axioms."
  *   **View on AC:** They are comfortable adding a constant `axiom_choice` to the context with the type `(Pi x. || Sigma y. R x y ||) -> Sigma f. Pi x. R x (f x)`.
  *   **Computational Cost:** They accept that terms involving `axiom_choice` are **stuck**. They do not normalize. They are opaque oracles.
  *   **Erasure:** They believe in total erasure. Since the function `f` is non-computable, it doesn't matter that you can't run it; it only matters that the logic remains consistent. They treat the type theory as a logic, not a programming language.
  *   **Parametricity:** They are willing to break parametricity. A parametric function must behave uniformly for all types. An AC function might need to "look inside" the proof of non-emptiness to pick a `y`, which parametricity forbids. They say: "Parametricity is a property of *computable* terms; AC terms aren't computable, so they don't have to obey."

  **Camp 2: The Weak Choice/Analysts (Countable/Dependent Choice only)**
  *   **PL Stance:** "Choice is valid only when the search space is enumerable or the relation is decidable."
  *   **View on AC:** They accept `(Pi n : Nat. || Sigma y. R n y ||) -> Sigma f. Pi n. R n (f n)`.
  *   **Why:** Because `Nat` is searchable. You can write a program that iterates `0, 1, 2...` until it finds a `y` that satisfies `R`.
  *   **Computational Cost:** Low. This is computable *if* `R` is decidable. If `R` is not decidable, this is still an axiom, but it feels "safer" because it doesn't require choosing from uncountable, structureless blobs.
  *   **Uniformity:** They worry about **Uniformity**. Full AC allows you to pick elements from a family of sets `S_x` where there is no uniform rule to pick `y` from `S_x`. Dependent choice restricts this to chains where the next step depends on the previous, which feels more like a process (a program) and less like a magic lookup table.

  **Camp 3: The Strict Constructivists (No AC)**
  *   **PL Stance:** "Existence is Construction."
  *   **View on AC:** Rejects the lifting of truncation. `|| Sigma ||` does not imply `Sigma`.
  *   **The Complaint:** AC licenses existence claims where no **definable** term exists. In PL terms, it asserts that a type is inhabited without providing a canonical form.
  *   **Parametricity as a Constraint:** This is the strongest PL argument against AC. By Reynolds' parametricity, a term of type `forall A. ...` cannot inspect `A`. AC essentially requires a term that can inspect the *proof* that a set is non-empty to extract an element. If the proof is erased (as in `Prop`), this is impossible. If the proof is kept (as in `Sigma`), AC is trivial. The middle ground (classical AC) requires breaking the abstraction barrier between proof and data.

  ### 3. The Advisor's Comment: AC = Skolemization

  Your advisor is syntactically right but semantically quick.

  *   **Logic:** Skolemization transforms `forall x exists y. R(x,y)` into `exists f. forall x. R(x, f(x))`. This preserves satisfiability.
  *   **Type Theory:** This is exactly the move from `Pi x. Sigma y` to `Sigma f. Pi x`.
  *   **The Fuss:** In logic, Skolem functions are new symbols added to the language. In PL, terms are programs.
      *   If you treat Skolem functions as **Oracle Terms** (Camp 1), your advisor is right. It's just adding a new constant.
      *   If you treat terms as **Algorithms** (Camp 3), Skolemization is a claim that every logical dependency can be compiled into a function.
      *   **The Distortion:** The advisor's comment glosses over the *computational content* of the Skolem function. In classical logic, the Skolem function is a black box. In PL, a function is a closed term (usually). AC asserts the existence of closed terms that behave like black boxes. The "fuss" is whether your language allows black boxes to count as valid terms.

  ### 4. Banach-Tarski and Non-Measurable Sets

  Is there a PL counterpart? Yes, but it's about **Invariants** rather than Geometry.

  *   **Math:** Banach-Tarski uses AC to decompose a sphere into pieces that are "non-measurable." They exist as sets, but you cannot assign them a volume consistently.
  *   **PL:** AC allows you to construct terms that break **Logical Relations** or **Normalization**.
      *   **Normalization:** In a constructive system, every term reduces to a canonical form (a value). If you add AC, you have terms that do not reduce. They are "stuck."
      *   **Logical Relations:** We often prove properties of programs by induction on their structure (parametricity). If you have an AC term, you cannot inspect its structure. It breaks the induction.
      *   **The Analogy:** A non-measurable set is a set that defies the invariant of "volume." An AC term is a term that defies the invariant of "computational behavior" (normalization/parametricity).
      *   **Banach-Tarski specifically:** It relies on picking representatives from equivalence classes (orbits of rotation groups). In PL, this is picking a canonical term from a quotient type without a section. If you have a quotient `A / ~`, you generally cannot lift `A / ~ -> B` to `A -> B` unless the function respects `~`. AC effectively asserts you can pick a representative `rep : A / ~ -> A` such that `rep([x]) ~ x`. This breaks the abstraction of the quotient.

  ### 5. Residue Report

  Here is the accounting of what translated and what didn't.

  **What Carried Over Cleanly:**
  *   **The Logical Structure:** The implication `Pi-Exists -> Exists-Pi` is identical.
  *   **Skolemization:** The syntactic movement of quantifiers is a perfect match.
  *   **Parametricity/Uniformity:** The constructive objection to AC translates beautifully into "you cannot write a polymorphic term that extracts data from a truncated type." This captures the "no definable rule" complaint precisely.
  *   **Oracles:** The classical acceptance of AC maps cleanly to postulating opaque constants that block reduction.

  **What Fit Only After Distortion:**
  *   **"Truth" vs. "Inhabitation":** In classical math, `exists` is a truth value. In PL, `exists` (Sigma) is data. To translate classical AC, we had to introduce Truncation/Prop. This is a native concept in HoTT/Coq, but it requires you to view your type theory as having two layers (Data vs. Prop). If you view your type theory as purely computational, classical AC looks like nonsense (which is the constructive bias).
  *   **Sets vs. Types:** Classical mathematicians think of `A` as a static collection. PL thinks of `A` as a generator of terms. AC in sets is about picking elements from static buckets. AC in types is about computing witnesses. The distortion is assuming "picking" is the same as "computing."

  **What Has No Expression in PL Terms (The Residue):**
  *   **The Ontological "There-ness":** Classical mathematicians often argue that the choice function *exists* in a platonic sense, even if we can't describe it. PL has no vocabulary for "exists but cannot be a term." In PL, if it's not a term (or an axiom postulate), it's not in the system. The philosophical disagreement about whether mathematical objects exist independently of their descriptions has no counterpart in syntax.
  *   **Measure and Volume:** The specific geometric horror of Banach-Tarski (doubling volume) doesn't translate. PL doesn't have "volume." The closest analogue is "consistency strength" or "normalization," but that's a structural property, not a semantic quantity.
  *   **The "Quiet Assumption":** Your friend's claim that PL people "quietly assume choice" points to a sociological residue. In PL, we often reason about *extensional* equality of functions (`forall x, f x = g x`) while working in an *intensional* system. To bridge this, we sometimes slip into reasoning patterns that require function extensionality or choice to be valid in the model, even if not in the syntax. This is a "sin" of practice, not theory, but it's real.

  **Final Verdict on the Residue:**
  Is the residue your vocabulary being too small, or the philosophy having less content?
  It is both.
  1.  **Vocabulary Limit:** Your vocabulary presumes **Syntax**. Classical math often cares about **Semantics** (models). AC is true in some models (ZFC) and false in others (Solovay's model). In PL, you are usually building *the* syntax. You lack the vocabulary to talk about "models of type theory" casually in the same way set theorists talk about "models of ZFC."
  2.  **Philosophical Deflation:** A lot of the AC dispute *does* dissolve when translated to PL. Once you distinguish `Sigma` from `Trunc`, the disagreement becomes: "Do we want to add an axiom that breaks normalization?" That is a technical decision, not a metaphysical one. The PL translation suggests that much of the philosophical heat comes from conflating "truth" with "data."

  Your friend is right that using `Prop` (erasure) while expecting to get functions out is "assuming choice." But in PL, that's a type error, not an axiom. In classical math, it's an axiom, not a type error. The translation reveals that the dispute is largely about where you draw the line between logic (Prop) and computation (Type).
