          *   Relation to Fink/Mask: It's like a reverse fink. A fink removes the power when stimulated. This adds the power when stimulated. Sometimes called "reverse finks" or "mimics." It challenges the idea that the disposition must exist *prior* to the stimulus.
      *   *Case 2 (Cousin/ Antibiotic):* First sun exposure activates sensitivity. Subsequent exposures burn.
