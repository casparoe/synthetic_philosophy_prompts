  2.  **Deconstruct the Video's Claims (Philosophical Fact-Checking):**
      *   *Claim 1: Dispositions used to be analyzed as conditionals.* True enough (Ryle, logical positivists). Simple conditional analysis (SCA): x is fragile iff if x were struck, x would break.
      *   *Claim 2: Finks killed it.* True enough. Martin (1994) is the classic source here. Finks show SCA is insufficient because the disposition can disappear exactly when the stimulus occurs.
      *   *Claim 3: Everyone gave up on analyzing dispositions that way.* Mostly true regarding the *simple* conditional analysis. Philosophers moved to refined conditional analyses (ceteris paribus clauses) or causal basis views.
      *   *Claim 4: What's left is that a disposition is really just the inner structure.* This is the "Categorical Basis" view. This is controversial. Many philosophers argue dispositions are real properties distinct from their categorical bases (Dispositional Essentialism, Mumford, etc.). Others argue for Rylean anti-realism. So saying "what's left is..." implies consensus where there is none.
      *   *Claim 5: Masks are just finks pointing the other way... glass genuinely isn't fragile while it's in the box.* This is the biggest red flag. Standard view: Masking does *not* remove the disposition. A fragile glass wrapped in foam is still fragile; the mask just prevents the manifestation. The video claims the glass *loses* fragility while wrapped. This is generally rejected. Masks interfere with the stimulus or the manifestation, not the disposition itself.
      *   *Claim 6: Conclusion (No fact of the matter, just useful prediction).* This is an anti-realist/instrumentalist conclusion. This does *not* follow necessarily from the failure of the simple conditional analysis. You can be a realist about dispositions (they are real properties) even if the conditional analysis fails. The video smuggles in an ontological conclusion from a semantic/analytic failure.

