      *   *Self-Correction on "No Journals":* I need to explain the concepts without citing Martin, Lewis, Mumford, etc., by name necessarily, or if I do, keep it very casual. The prompt says "don't tell me to go read papers," not "don't mention philosophers." But better to focus on the ideas.
