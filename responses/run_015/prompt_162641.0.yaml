      *   **Goal:** No lecture. Run a classroom game to experientially demonstrate the Intellectualism vs. Anti-Intellectualism debate (Rylean know-how vs. propositional know-that) *before* naming the terms.
      *   **Core Mechanic:** Hidden-rule classification game.
      *   **Conditions:**
          1.  *Practice Group:* Learn by doing/feedback, no writing hypotheses.
          2.  *Instruction Group:* Given explicit rule, no practice.
