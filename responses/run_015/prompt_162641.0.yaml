answer: |-
  # Seminar Game: The Transmission Protocol

  **Course:** Knowledge and Mind (Third-Year Seminar)
  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Topic:** The Nature of Know-How (Intellectualism vs. Anti-Intellectualism)
  **Goal:** Experientially demonstrate the dissociation between *performance accuracy* and *articulable justification* without initially naming the philosophical positions.

  ---

  ## 1. Game Mechanics & Rules

  ### The Task: Artificial Grammar Classification
  Students must classify letter strings as **Admissible** (valid) or **Inadmissible** (invalid) based on a hidden Finite State Grammar.

  **The Grammar (The Truth):**
  1.  Strings must start with **T** or **P**.
  2.  If **T**, the next letter must be **X**.
  3.  If **P**, the next letter must be **T** or **X**.
  4.  If **X**, the next must be **S** or **T**.
  5.  Strings must end with **S**.
  *(Valid examples: TXS, TXXS, PXS, PTXS, PXTS)*

  ### The Two Conditions (Randomly Assigned)
  *   **Group A (The Practitioners / "Skill"):** 9 Students.
      *   **Training:** Shown 10 valid strings one by one. No rules given. They are told: "Memorize these. They follow a pattern."
      *   **Constraint:** Forbidden from writing anything down. Forbidden from muttering rules.
  *   **Group B (The Theorists / "Proposition"):** 9 Students.
      *   **Training:** Handed a slip of paper with the 5 rules above written in plain English.
      *   **Constraint:** Forbidden from seeing any example strings. They must apply the text directly.

  ### The Secondary Tasks (Within-Subjects Phase)
  During the Transfer Test, all students will classify items under two load conditions:
  1.  **Verbal Load:** Count backward aloud from 100 by 3s while classifying.
  2.  **Motor Load:** Tap a complex rhythm (1-2, 1-2-3, 1-2-3-4) on the desk with their non-writing hand while classifying.

  ### The Payoff Scheme (Non-Monetary)
  **"The Syllabus Veto"**
  *   The class is competing against a "Baseline" (historical average accuracy of 70%).
  *   If the class *collective* average on the Transfer Set exceeds 80%, **the class wins.**
  *   **Prize:** The winning side (Practitioners vs. Theorists) with the higher *Teaching Score* (see below) earns the **Veto Token**.
  *   **Token Power:** The holders can veto one required reading from the remaining semester syllabus OR grant a 48-hour extension to the whole class on one assignment.
  *   **Teaching Score:** In the final phase, students write a 3-sentence "Guide for a Newcomer." You (the Instructor) will act as the Newcomer. You will attempt to classify 5 items using *only* their written guide. Your accuracy determines their Teaching Score. This counts **double** toward the Veto calculation.

  ---

  ## 2. Materials Needed
  1.  **Stimulus Deck:** 30 Cards.
      *   10 Training Strings (Valid only).
      *   20 Transfer Strings (10 Valid, 10 Invalid).
      *   5 "Newcomer" Strings (for you to test their guides).
  2.  **Instruction Slips:** 9 slips with the Grammar Rules (for Group B).
  3.  **Score Sheets:** Pre-printed grids for recording Admissible/Inadmissible decisions.
  4.  **Timer:** Visible to the class.
  5.  **Blackboard/Whiteboard:** To track running scores.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide class into Group A (Left) and Group B (Right). Distribute materials. Explain Payoff (Veto Token). **Crucial:** Emphasize Group A cannot write hypotheses; Group B cannot look at examples. |
  | **05-20** | **Acquisition** | **Group A:** Flash 10 training strings (3 secs each). "Absorb the pattern."<br>**Group B:** Read rule slip. "Memorize the logic." <br>*No cross-talk allowed.* |
  | **20-35** | **Transfer Test 1** | **Baseline Accuracy.** Both groups classify 10 Transfer Strings silently. No secondary task. Collect sheets. |
  | **35-40** | **Prediction** | **Stop.** Ask students to write down a prediction: *"Which secondary task (Verbal or Motor) will hurt your group's accuracy more? Why?"* Collect predictions. |
  | **40-50** | **Transfer Test 2** | **Load Conditions.** <br>5 mins: Classify 5 strings while **Counting Backward** (Verbal).<br>5 mins: Classify 5 strings while **Tapping Rhythm** (Motor). |
  | **50-60** | **Transmission** | **The Teaching Phase.** Students write a 3-sentence guide to teach the rule to a naive newcomer. <br>*Instructor collects these.* <br>*Instructor immediately tests the guides on 5 Newcomer Strings (live or pre-prepared).* |
  | **60-65** | **Scoring** | Tally Accuracy + Teaching Scores. Announce the Winner of the Veto Token. Reveal the actual Grammar Rule to the room. |
  | **65-75** | **Debrief** | Philosophical mapping (see below). |

  ---

  ## 4. Predictions (For Instructor Use)

  | Condition | Prediction | Rationale |
  | :--- | :--- | :--- |
  | **Baseline Accuracy** | **Group A ≈ Group B** | Implicit learning (A) is surprisingly robust on simple grammars; Explicit rule application (B) is accurate but slow. |
  | **Verbal Load** | **Group B Accuracy Drops** | Counting backward disrupts Working Memory/Phonological Loop. Group B needs this to hold the propositional rule ("If T then X..."). Group A relies on perceptual fluency, which is less verbal. |
  | **Motor Load** | **No Difference / Slight Drop A** | Motor tapping interferes less with verbal rules. It might slightly disrupt Group A if their "sense" of the pattern has a motor component, but generally less damaging than verbal load. |
  | **Articulation (Teaching)** | **Group B >> Group A** | Group B has the propositions. Group A has the disposition. Group A will write vague things like "It just looks right" or "T usually goes with X." |
  | **Teaching Success** | **Group B Guides Win** | Since *you* (the Newcomer) rely on the text, Group B's explicit instructions will yield higher accuracy than Group A's intuitive hints. |

  ---

  ## 5. The Debrief: Mapping the Game to the Dispute

  *Do not lecture. Ask questions based on the results.*

  **1. The Dissociation (Performance vs. Articulation)**
  *   *Ask Group A:* "You performed well (presumably), but your guides were vague. Did you *know* the rule?"
  *   *Ask Group B:* "You had the rule, but did you stumble under the Verbal Load?"
  *   **The Crux:** Is knowledge defined by the ability to *do* (classify accurately) or the ability to *say* (transmit via testimony)?
  *   **Map:** Group A = **Anti-Intellectualism (Ryle).** Know-how is a capacity/disposition. It is not essentially propositional.
  *   **Map:** Group B = **Intellectualism (Stanley/Williamson).** Know-how is a species of know-that. To know how is to possess the relevant proposition under a practical mode of presentation.

  **2. The Load Test (Cognitive Architecture)**
  *   *Review Predictions:* Did Verbal Load hurt Group B more?
  *   **The Crux:** If know-how were just know-that, disrupting verbal working memory should cripple the "Skill" group too (if they are secretly using propositions). If the Skill group survived the Verbal Load, it suggests their knowledge is **non-propositional** (procedural/embodied).
  *   **Map:** Resilience under verbal load supports the view that skillful action does not require active propositional guidance.

  **3. The Transmission (Testimony)**
  *   *Review Teaching Scores:* Why did Group B's guides work better on the Newcomer?
  *   **The Crux:** If knowledge is a relation to a proposition, it should be fully transmissible via language (testimony). If knowledge is an ability, testimony is inherently limited; the newcomer must *practice* to acquire it.
  *   **Map:** The failure of Group A to transmit supports the Rylean view that you cannot learn a skill solely by being told the rules.

  ---

  ## 6. Troubleshooting: What Will Predictably Go Wrong

  1.  **The Rule is Too Easy to State:**
      *   *Risk:* Group A figures out "It's about T and S" and writes it down perfectly.
      *   *Fix:* If this happens, pivot the debrief. "Why was *this* rule easy to codify? Does that mean it wasn't true 'know-how'? Real skills (riding a bike) resist codification. This game is a *limit case*."
  2.  **Group A Fails to Learn:**
      *   *Risk:* 10 examples aren't enough. Accuracy is at chance (50%).
      *   *Fix:* Acknowledge that implicit learning takes time. "The Intellectualist says you failed because you lacked the proposition. The Anti-Intellectualist says you just needed more practice, not more rules."
  3.  **Cheating (Group A writing notes):**
      *   *Risk:* Contaminates the "Implicit" condition.
      *   *Fix:* Walk the room during training. If caught, disqualify their Teaching Score only (keep performance data).
  4.  **Effects Fail to Appear:**
      *   *Risk:* Verbal load doesn't hurt Group B.
      *   *Fix:* "Philosophy often deals in intuitions that empirical data complicates. Even if the cognitive load didn't split perfectly, did the *feeling* of knowing differ between the groups?"
  5.  **Too Few Transfer Items:**
      *   *Risk:* Noise dominates (e.g., 4/5 correct looks like 80% but is chance).
      *   *Fix:* Use the *collective* class average for the Veto to smooth out individual noise.

  ---

  ## 7. Limitations: What the Game Cannot Reproduce

  **The Intellectualist Escape Hatch**
  This is the most critical point for you to supply in the debrief.
  *   **The Limitation:** The game demonstrates a *performance dissociation* (Doing ≠ Saying). It does **not** prove an *ontological dissociation*.
