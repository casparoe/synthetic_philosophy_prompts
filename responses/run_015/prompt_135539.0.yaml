answer: |-
  **Exam Question**

  **Question 1 (20 Marks)**
  Classic hedonism faces the heterogeneity problem: the phenomenological diversity of pleasures (e.g., the smell of rain vs. solving a proof) suggests there is no single "feeling" that unifies them. Imagine a defender of hedonism proposes a revision: all pleasures share not a felt quality, but a **sub-personal valuation stamp**. On this view, a mental state counts as pleasure if it carries a functional marker that tags the experience as "to-be-pursued," even if this marker is not phenomenally accessible to the subject.

  Write an essay evaluating this defense. Specifically:
  1.  Does redefining pleasure as a sub-personal functional marker save hedonism, or does it cause the theory to collapse into desire-satisfactionism?
  2.  If the shared element is not available to consciousness, does this abandon hedonism's intuitive appeal as a theory of *felt* well-being, rendering it an unacceptable externalist view?

  Your answer must argue for a clear position on whether this move preserves the core commitments of hedonism.

  ***

  **Model Answer**

  The heterogeneity problem threatens hedonism by demonstrating that pleasures lack a common phenomenological denominator. The proposed defense attempts to salvage the theory by relocating the unifying feature from consciousness to sub-personal function. Specifically, it claims pleasures are unified by a "valuation stamp" marking them for pursuit. While this maneuver technically solves the heterogeneity issue, it ultimately fails to save hedonism. Instead, it collapses the view into a form of desire-satisfactionism and violates the internalist constraint essential to the hedonistic intuition.

  First, consider the collapse into desire-satisfactionism. Traditional hedonism posits that pleasure is intrinsically good and that this goodness explains why we pursue it. Desire-satisfactionism reverses this: satisfying a desire is good, and pleasure is merely a byproduct of that satisfaction. The "valuation stamp" is defined functionally as a tag marking an experience "to-be-pursued." However, to mark something as "to-be-pursued" is functionally identical to being the object of a pro-attitude or desire. If the defining feature of pleasure is simply that the cognitive system is set to pursue it, then the theory is no longer claiming that a specific type of feeling generates value. Rather, it claims that whatever the system is set to pursue generates value. This is the structural definition of desire-satisfactionism. The hedonist might object that the stamp tracks *pleasure* specifically, but if the stamp is sub-personal and defined by pursuit, we have no independent access to what is being tracked other than the pursuit itself. Thus, the distinction between "pleasure causes pursuit" and "pursuit defines pleasure" evaporates.

  Second, and more critically, this revision abandons the phenomenological core of hedonism. The primary intuitive appeal of hedonism is internalist: well-being consists in how life feels from the inside. If the "good-making" feature of an experience (the valuation stamp) is sub-personal and phenomenally inaccessible, then a subject could theoretically possess this stamp without feeling any distinct positive quality. Conversely, a subject might feel intense enjoyment without the functional stamp (perhaps due to cognitive malfunction). In such cases, the theory dictates that well-being is determined by a hidden mechanical process rather than conscious experience.

  This renders the view externalist. Externalism about well-being holds that factors outside the subject's conscious awareness can determine their welfare. If the valuation stamp operates in the dark, a subject could be "well-off" according to the theory without experiencing any positive phenomenology, provided their mental states are correctly stamped. This contradicts the fundamental hedonistic conviction that ignorance of one's own pleasure is impossible. If the good-making property is hidden from the subject, it cannot be the *felt* quality of experience that matters. Consequently, the theory loses its claim to be *hedonism* at all, as it severs the necessary link between well-being and conscious feeling.

  In conclusion, the sub-personal valuation stamp does not save hedonism. By defining pleasure via a functional role of pursuit, it conflates the good with the desired, collapsing into desire-satisfactionism. Furthermore, by hiding the good-making feature from consciousness, it violates the internalist requirement that well-being must be experienced. A theory that locates well-being in inaccessible functional markers may be coherent, but it is no longer a theory of felt pleasure.

  ***

  **Marking Scheme**

  **Total: 20 Marks (5 Criteria x 4 Marks)**

  **1. Accurate Reconstruction of the "Valuation Stamp" Proposal**
  *   **4 Marks:** Clearly explains that the proposal moves the unifying feature of pleasure from phenomenology to sub-personal function (tagging for pursuit).
  *   **A to B Drop:** Failing to distinguish this from standard qualitative hedonism; treating the "stamp" as just another feeling rather than a functional marker.

  **2. Analysis of the Desire-Satisfactionism Collapse**
  *   **4 Marks:** Argues that defining pleasure by "to-be-pursued" status makes the theory structural identical to desire-satisfactionism (pursuit defines value, rather than value driving pursuit).
  *   **A to B Drop:** Asserting the collapse without explaining the directional difference between "pleasure causes desire" vs. "desire defines pleasure."

  **3. Engagement with the Phenomenological Objection**
  *   **4 Marks:** Identifies that hedonism relies on the intuition that well-being must be *felt* (internalism) and notes that a sub-personal stamp is not felt.
  *   **A to B Drop:** Acknowledging the stamp is hidden but failing to explain why this matters for the definition of *well-being* specifically.

  **4. Evaluation of the Externalism Charge**
  *   **4 Marks:** Correctly classifies the revised view as externalist because the good-making property exists independently of the subject's awareness, and critiques this as incompatible with hedonism.
  *   **A to B Drop:** Using the term "externalist" loosely or conflating it with moral externalism rather than well-being externalism.

  **5. Coherence and Verdict**
  *   **4 Marks:** Provides a definitive conclusion (e.g., the move fails) that logically follows from the preceding arguments without contradiction.
  *   **A to B Drop:** Sitting on the fence without justification, or concluding the theory is saved while having argued it loses its essential features.
