answer: |-
  The priority agenda is: (1) What institutional features predict religious groups' capacity to coordinate collective action and enforce norms across diverse ecological stressors? (2) How does religious transmission vary across non-WEIRD populations regarding credibility-enhancing displays versus doctrinal fidelity? (3) Under what conditions does religious identity function as a barrier versus a conduit for public-health compliance and legal integration?

  Question 1 is the primary investment because decision-makers interact with religious institutions, not individual psyches. It is upstream of legal rulings on exemptions (does the group require structural protection to survive?) and public-health routing (can the group enforce mask-wearing or vaccination?). It is highly tractable with existing organizational sociology methods and historical datasets like Seshat, requiring no new cognitive models. A specific result moving this up would be a validated typology linking governance structures (e.g., hierarchical vs. congregational) to compliance rates during crises within three years; if no correlation emerges, funding shifts to Question 3. Question 2 addresses the validity of our theoretical base. It is upstream of educator curricula (what mechanisms of belief should be taught?) and downstream of cognitive theories of religion. Tractability is medium, relying on meta-analysis of existing cross-cultural databases (D-PLACE) supplemented by targeted fieldwork rather than new global surveys, fitting the fifteen researcher-year constraint. A specific result moving this up would be the falsification of Credibility Enhancing Displays (CREDs) as a universal predictor of adherence in non-WEIRD settings; if CREDs hold globally, the question moves down as settled. Question 3 is the direct application layer. It is upstream of intervention design and downstream of social identity theory. It is highly tractable via natural experiments (e.g., comparing compliance across religious groups during pandemics). A specific result moving this up is a predictive model identifying when religious identity triggers reactance versus cooperation; if identity proves too context-dependent to model, the question drops in favor of institutional analysis.

  Regarding the distinction between cognitive receptivity and epidemiological dynamics: your suspicion is correct; the epidemiological family deserves roughly seventy percent of the funding. Courts, health officials, and educators manage existing populations and institutional behaviors, not the neural architecture that makes belief possible. Cognitive receptivity questions deserve more money only if they demonstrate predictive power over group stability or behavioral compliance that exceeds structural variables—for example, if specific cognitive styles reliably predict institutional schism or resistance to medical intervention. Until cognitive models offer leverage over outcomes rather than just origins, they remain basic science unsuited to this foundation's applied aims.

  Treating the WEIRD bias as a live hypothesis re-ranks the agenda by pushing Question 2 up to a validation checkpoint before any universal theory is accepted. It makes currently popular questions about the universality of moralizing gods or the cognitive byproduct theory of religion unanswerable with existing databases, as those datasets are skewed toward post-Protestant contexts. Consequently, any project claiming to test universal cognitive mechanisms without explicit non-WEIRD comparison components is deprioritized, as the available populations cannot distinguish between human universals and cultural specifics. This constraint does not halt the work but restricts the scope of claims; we fund comparisons, not declarations of universality.

  I would decline funding for three fashionable questions: the evolutionary origins of belief (byproduct versus adaptation), neurotheological imaging of prayer states, and the secularization thesis (whether religion will disappear). The evolutionary origin question changes no one's mind because both adaptationists and byproduct theorists agree religion exists and functions similarly in the present; the distinction is historically interesting but practically inert. Neurotheological imaging is declinable because knowing which brain regions light up during prayer tells a judge nothing about whether a religious exemption should be granted or a health official how to route supplies. The secularization thesis is declinable because binary predictions about religion's disappearance do not help managers deal with its current persistence; knowing religion might vanish in 100 years does not help design a curriculum for today.
