prompt: |-
  I am running an upper-level undergraduate seminar in moral philosophy with fourteen students over a single ninety-minute session, and I want to stage a rules-based simulation that makes Williams's integrity objection tangible before anyone names it—specifically the sense that an agent who justifies saving a loved one or a life-project partner through an impartial calculus has inserted an alienating mental step, even when the outcome is correct. Rather than lecture on partiality and integrity, I want the students to feel the structural conflict themselves: they should discover that combining a personal reason with comparative weighing produces a different phenomenological quality than stating the personal reason alone, and they should do this through real, small-stakes choices before the facilitator maps the experience onto the philosophical idea.

  Please design a runnable in-class activity with clear roles, physical or written materials that can be prepared in advance, and a payoff scheme that uses points rather than money. Each student should be assigned a hidden "life-project" card—describing an ongoing collaborative endeavor such as a long-form artistic composition, a clinical trial, or a field study—that ties them to one of two figures in a staged crisis scenario (a fire, a bridge collapse, or a resource failure) where only one figure can be rescued. The other figure should represent high social utility but no connection to the student. In Round One, each student writes a private one-sentence justification without speaking. In Round Two, pairs deliberate using drawn "reason cards" that separate partial-attachment claims from impartial-weighing claims, and they must submit a joint justification to the class. The rules should include an "integrity token" system and a "project-continuity constraint": if a pair invokes a partial attachment but also includes any explicit or implicit comparative weighing of the two figures' value—whether by utility, numbers, or desert—they forfeit their integrity token and receive only "consensus points" for outsider acceptability; if they invoke the partial attachment without that extra calculative step, they retain the token and earn "integrity points." The class then votes blindly on whether each submitted justification feels "cold" or "direct," and the pairs learn their scores only after all votes are cast, so the tension emerges mechanically rather than through my framing.

  In your response, provide the exact rules, the card texts or categories, the timeline minute-by-minute, the debrief that maps the two point systems onto the distinction between having a reason and having to justify it through an impartial framework, and an honest note on what this simulation cannot reproduce—above all the long-term lived weight of self-alienation, which I will need to supply through guided reflection. Also tell me what will predictably fail the first time I run it, such as students disguising weighing language inside partial-attachment claims or rejecting the integrity-token system as irrational, and suggest how to handle those breakdowns without breaking the experience. Do not include bibliographies, reading lists, or citation requests; do not ask students to recall specific page numbers or essay titles; and do not quote verbatim from any philosophical text—paraphrase the concern if you need to name it. Keep the injection of the project-continuity mechanism explicit so that the activity is not a generic trolley-problem variant, but make sure every element relies only on ideas a well-prepared student in this course would already carry.
