answer: |-
  The control room smelled of ozone and stale espresso. Outside the leaded glass, the beamline hutch was dark, save for the green status lights on the detector banks. Inside, the glow of three monitors illuminated Elena, Sam, and Marcus. It was 4:17 AM. The shift ended at eight.

  Elena tapped the desk. "The Rietveld fit is clean. Chi-squared is 1.4. The peak splitting at the (200) reflection is unambiguous. We have the transition."

  Sam didn't look up from his laptop. "We have the data. We don't have the mechanism. The Monte Carlo runs aren't showing the singularity."

  "They show the trend," Elena said.

  "They show broadening," Sam corrected. He turned his screen. It displayed a stack of specific heat curves. Each corresponded to a lattice size: $10^3$, $20^3$, up to $50^3$. The peaks got sharper and taller as the lattice grew, but none of them spiked. None of them broke. "For any finite $N$, the system is analytic. You know this. The derivative doesn't diverge. The sharp transition only exists if I extrapolate to infinite size. The computer literally cannot simulate the thing we're claiming exists."

  Marcus, leaning against the doorframe with a clipboard, shifted his weight. "The machine doesn't care about infinity. The sample is twenty milligrams. It's finite. Yet the peaks split like a knife."

  "Because the correlation length is smaller than the grain size," Elena said. "Effectively infinite."

  "Effectively," Sam said. "But the paper claims the simulation *predicts* the transition temperature. It doesn't. It reproduces it after scaling."

  Elena sighed, rubbing her temples. "Sam, we've been over this. The universality class is robust. We changed the dopant concentration from five percent to ten percent last week. The critical exponents didn't budge. The micro-details washed out. That's the physics. The fact that the singularity requires a limit is a mathematical artifact, not a physical failure."

  "It's not just the limit," Sam said. He pulled up another window, a script showing the Hamiltonian setup. "Look at the coupling constant $J$. Where did this number come from?"

  Elena hesitated. "We calibrated it."

  "You set $J$ so that $k_B T_c$ matched the experimental transition," Sam said. "Then we ran the simulation, saw the peak near that temperature, and claimed the micro-model derived the macro-behavior. But we used the macro-behavior to fix the micro-parameter. It's circular."

  Marcus pushed off the doorframe and walked over to the console. He pointed at the difference plot on the main monitor, the wiggle of the observed minus calculated intensity. "You're arguing about the map. I'm looking at the territory. When I align the goniometer, if I'm off by 0.01 degrees, the peaks smear. I don't derive the alignment from the atomic potential. I use the peaks to find the alignment. Then I say I know the structure."

  "That's instrumentation," Sam said. "This is theory."

  "It's all fitting," Marcus said. "You fit the beam position. You fit the lattice parameter. You fit the coupling constant. Why is fitting $J$ a sin but fitting the zero-shift isn't?"

  "Because the zero-shift is a nuisance parameter," Sam said. "J is the physics. If the value of J is determined by the existence of the phase transition, then the phase transition isn't emerging from the Hamiltonian. The Hamiltonian is being constructed to host the phase transition."

  Elena stood up and walked to the window, looking at the dark hutch. "If we wait for a derivation that doesn't rely on calibration, we die. The grant renewal is in June. This model explains the doping dependence across three different oxides. It works. Yes, we pin the energy scale to the experimental $T_c$. But once pinned, it predicts the heat capacity jump. It predicts the susceptibility curve. That's not bookkeeping."

  "It's leaky," Sam said. "The reduction only works because we smuggled the result into the boundary conditions."

  "Everything is leaky," Elena said, turning back. "You think your density functional theory calculations don't use exchange-correlation functionals fitted to experimental data? We stand on the shoulders of giants, Sam, but we also glue their shoes to the ground so they don't slip. The robustness is the point. The fact that this Hamiltonian works for the nickelates and the manganates means the details don't matter. That's why it's fundamental. Because it survives the washing out of the details."

  Sam's finger hovered over the trackpad. "If we submit this, the reviewers will see the finite-size scaling. They'll see the parameter fix."

  "Then we explain it," Elena said. "We explain that the infinite limit is the only place the definition holds, and our system is close enough. We explain that fixing the scale is standard practice."

  "It feels like we're saying the tail wags the dog," Sam said.

  Marcus checked his watch. "Sun's coming up over the storage ring. You need to decide. The beam stops in three hours. If you want to run the empty capillary check to verify the background subtraction, now's the time. If you want to write the paper, stop talking and start typing."

  Sam looked at the stack of broadening peaks. He looked at the sharp split on the diffraction plot. The experimental data was undeniable; the material changed symmetry. The simulation was a shadow that only took shape when stretched toward infinity and anchored by the very thing it was supposed to prove.

  "If we pull the claim," Sam said quietly. "If we say the model describes the scaling but doesn't derive the transition..."

  "Then it's a phenomenological fit," Elena said. "Not a mechanism. There's no paper in that. Not for us."

  "And if we leave it?"

  "Then we risk a correction," Elena said. "Or we risk being right."

  Marcus walked back to the door. "I'm going to check the cooling water on the detectors. Don't break the machine. Don't break the truth. Whatever that is."

  He left the room. The hum of the pumps filled the silence. Sam's cursor blinked at the bottom of the document, in the acknowledgments section. Elena sat back down and opened the data folder, ready to generate the final figures.

  "Run the empty capillary," Sam said.

  "Fine," Elena said. "Then we write."

  Sam didn't move the cursor to the submit button. He didn't delete the text either. He watched the difference plot, the tiny wiggles where the model failed to catch the data, and waited for the background scan to finish.

  ***

  **Commentary**

  (i) The necessity of the infinite-size limit for sharp phase transitions is settled statistical mechanics; finite systems possess analytic partition functions. However, whether this mathematical necessity implies ontological emergence (category c) is contested. Many physicists view the thermodynamic limit as a useful idealization rather than a metaphysical boundary.

  (ii) The story leans heavily on the "leaky reduction" idea as a problematic circularity. A significant chunk of the field, particularly proponents of Effective Field Theory, would reject this framing. They argue that fixing parameters against experimental data (renormalization) is not cheating but the correct method for connecting scales. The story treats this calibration as a vulnerability; many practitioners see it as standard procedure.

  (iii) Specialists might roll their eyes at the severity of the conflict. In condensed matter, "predicting" a transition often implies predicting critical exponents or scaling functions after fixing the energy scale, not deriving the energy scale itself. The story dramatizes this as a binary choice between truth and careerism, whereas most researchers view it as a spectrum of model utility. The tension is real, but the stakes are presented more sharply than the daily grind usually allows.
