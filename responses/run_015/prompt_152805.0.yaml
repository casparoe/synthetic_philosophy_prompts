answer: |-
  Here is an articulation of the principle governing your intuitions, an analysis of its components, and an identification of where your verdicts strain against simplicity.

  ### The Principle: Asymmetric Risk-Adjusted Search (ARAS)

  **Formal Statement:**
  A selection process is rational if and only if the rigor of the search is proportional to the **Severity of Irreversible Harm**, discounted by the **Marginal Epistemic Yield** of further search.

  $$ \text{Required Rigor} \propto \frac{\text{Severity} \times \text{Irreversibility}}{\text{Marginal Epistemic Yield}} $$

  **Definitions:**
  1.  **Severity:** The magnitude of the worst-case outcome (not just the average expected loss).
  2.  **Irreversibility:** The cost or impossibility of correcting the choice post-selection.
  3.  **Marginal Epistemic Yield:** The probability that additional search/analysis will reliably identify a superior option, given the complexity of the system.

  ---

  ### Clause Motivation & Case Mapping

  **Clause 1: Severity of Irreversible Harm**
  *   **Motivating Cases:** *Surgeon vs. Kettle* and *Chemotherapy vs. Retirement*.
  *   **Function:** This clause establishes the baseline stakes. It explains why "first acceptable" is negligent for a surgeon (Severity: Death/Permanent Injury) but proper for a kettle (Severity: Inconvenience/Minor Cost). It dictates that as the potential for catastrophic, irreversible loss increases, the aspiration level must shift from "satisficing" to "maximizing" (or near-maximizing).

  **Clause 2: Irreversibility**
  *   **Motivating Cases:** *Family Home vs. Paperback*.
  *   **Function:** This clause accounts for the temporal dimension of the error. A £20 paperback is easily discarded (low irreversibility); a family home involves transaction costs, emotional displacement, and long-term financial commitment (high irreversibility). This justifies the six-month search for the home but condemns it for the paperback.

  **Clause 3: Marginal Epistemic Yield (The Discount Factor)**
  *   **Motivating Cases:** *Retirement Portfolio vs. Chemotherapy*.
  *   **Function:** This is the critical modifier. Both retirement and chemotherapy have high Severity. However, in retirement planning, modelling every asset class has low Epistemic Yield because markets are stochastic and unpredictable; a simple heuristic (age-based) often outperforms complex optimization due to noise. In chemotherapy, biological variance is tractable via clinical data; further search *does* reliably yield better survival rates. This clause excuses the heuristic in finance but condemns it in medicine.

  ---

  ### Prediction: The Unlisted Case (School Curriculum)

  **Case:** Selecting a school curriculum for a district.
  **Variables:**
  *   **Severity:** High (impacts children's long-term cognitive development and economic prospects).
  *   **Irreversibility:** Moderate-High (a "lost year" of education is difficult to fully remediate, though not as permanent as death).
  *   **Marginal Epistemic Yield:** Moderate (Pedagogy is complex and context-dependent; there is no single "proven" best curriculum, but evidence exists for broad approaches).

  **ARAS Prediction:**
  The principle predicts that **satisficing is illegitimate, but maximizing is impossible.**
  You cannot select the "first acceptable" curriculum (as with the surgeon), because the Severity is too high. However, you also cannot spend years modelling every variable (as with the chemotherapy/retirement distinction), because the Epistemic Yield is limited by social complexity.
  **Verdict:** The rational approach is a **structured comparative pilot**. You must narrow the field to a few evidence-backed options (filtering by Severity) and test them iteratively (mitigating Irreversibility), rather than seeking a theoretical optimum or accepting the first vendor. To do otherwise would be either negligent (picking the first option) or wasteful (seeking a non-existent perfect model).

  ---

  ### The Cost of Simplicity: Where Your Intuitions Conflict

  You asked if one principle governs all or if you must invoke separate principles. **One principle (ARAS) can govern all, but only if you abandon the simplicity of a pure "Cost-Benefit" model.**

  Specifically, your verdicts on **Retirement vs. Chemotherapy** and **Software** cannot be accommodated by a simple "Stakes vs. Search Cost" equation without adding the **Marginal Epistemic Yield** clause.

  **1. The Retirement/Chemotherapy Tension**
  *   **Simple Principle:** "Search until Cost of Search = Expected Benefit."
  *   **Failure:** Both cases involve high financial/health stakes. A simple model suggests you should either maximize both or satisfice both.
  *   **Resolution:** To accommodate your intuition that heuristics are prudent for retirement but reckless for chemo, you must admit that **uncertainty invalidates optimization.** You are implicitly arguing that in high-noise environments (finance), satisficing *is* maximizing. In high-signal environments (medicine), satisficing is *suboptimal*.
  *   **Simplicity Sacrifice:** You must accept that "Rationality" is not a single standard of effort, but a context-dependent calibration of *how much truth can be known*.

  **2. The Software Tension (The 99.99% Case)**
  *   **Your Verdict:** You seem inclined to view halting at 99.99% as acceptable because failures are "harmless edge cases."
  *   **The Conflict:** This aligns with the *Kettle* (low severity) but conflicts with the *Surgeon* (scale). If software is used by millions, 0.01% failure is thousands of users.
  *   **Simplicity Sacrifice:** To accommodate your verdict here, you must define "Harm" strictly as *individual* impact, ignoring *aggregate* impact. If you believe aggregate harm matters (e.g., systemic trust, cumulative minor injuries), then the Software case aligns with the Surgeon, and stopping search is negligent.
  *   **Prediction:** If you hold the "Surgeon" intuition as absolute, you must revise your Software verdict. If the edge cases are truly harmless (zero negative utility), the Kettle intuition holds. If "harmless" is an assumption, the ARAS principle demands further search because the **Severity** variable is uncertain.

  ### Conclusion

  You do not need separate principles for consumer, medical, and engineering domains. You need a **single, tri-variable principle (ARAS)**.

  However, to maintain your specific intuitions, you must accept that **bounded rationality is not just about cognitive limits (search costs); it is about the structural limits of the domain (epistemic yield).** If you refuse to add the "Epistemic Yield" clause, you must concede that your distinction between Retirement (prudent) and Chemotherapy (reckless) is inconsistent, as both involve high stakes where error is costly.
