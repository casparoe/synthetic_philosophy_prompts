answer: |-
  # Q&A PREP SHEET: PROXY ASSERTION & DELEGATED NORMS
  **Talk:** Proxy Assertion and the Degenerate Case of Self-Speaking
  **Time:** 20-min Q&A (approx. 2 mins per reply)
  **Audience:** 15 specialists (Testimony, Speech-Act, Formal, Legal, Phil Lang, Political, Generalists)

  ---

  ## STRATEGIC ANCHORS
  *   **Claim to Hold (The Hard Line):** The distinction between **Proxy Assertion** (human delegate + authorized store) and **Simulated Transmission** (LLM output). Do not concede that LLMs can be principals without a human authorization loop.
  *   **Weak Point to Volunteer:** The **Scope-Tracking Condition**. Admit early (perhaps in closing remarks) that operationalizing "when a proxy knows they are out of bounds" is the hardest part of the view and requires further work on institutional signaling.
  *   **The Dread Question (Hope Nobody Asks):** *"If a press secretary knowingly transmits a lie from the Principal because it is in the 'transmissible store,' are they asserting a lie or just fulfilling a role? Does your view absolve them of epistemic responsibility?"* (Threatens to decouple assertion from accountability).

  ---

  ## OBJECTIONS & REPLY SCRIPTS
  *(Ordered by potential damage to the core thesis)*

  ### 1. The Speech-Act Theorist: "This Isn't Assertion"
  *   **The Objection:** "Assertion is essentially undertaking a commitment backed by *your* reasons. If S doesn't own the commitment, S isn't asserting. You've described 'reporting' or 'reading a statement,' not assertion. You're changing the subject."
  *   **Reply Script:**
      *   "I agree standard accounts tie assertion to personal commitment. But consider a lawyer in court. If they say 'My client was elsewhere,' they aren't offering their own evidence; they are putting the client's position on the record as truth-apt.
      *   If we say this isn't assertion, we can't explain why it's liable to truth/falsity challenges. It's not a report *about* the client; it *is* the client's position in the room.
      *   My view expands 'assertion' to include the locus of commitment. The commitment exists, it's just held by P, not S. Denying this makes institutional speech unintelligible."
  *   **Soft Spot:** Relies on intuition that institutional speech acts count as "assertion" rather than a distinct category. Might be verbal dispute.
  *   **Slide Concession:** "I concede the commitment structure differs from standard assertion; 'proxy assertion' may require a distinct label if 'assertion' is too tightly bound to personal warrant."

  ### 2. The Reductionist Testimony Theorist: "Extra Machinery"
  *   **The Objection:** "Why posit a new norm? This is just testimony. The hearer has evidence that S is a reliable reporter of P. The warrant is built out of the hearer's evidence about S's reliability. You're adding 'transmissible stores' for no gain."
  *   **Reply Script:**
      *   "If it were just testimony about P, the hearer would be believing *S believes that P believes p*. But in proxy cases, the hearer believes *p* on P's say-so.
      *   Reductionism struggles here because the hearer often has *no* evidence about S's reliability regarding P (e.g., a random press briefing). They rely on the *role*, not the individual's track record.
      *   The 'store' explains why the hearer is warranted even without evidence of S's reliability. The warrant comes from the authorized channel, not S's personal credibility."
  *   **Soft Spot:** Assumes hearers actually distinguish between 'S says P believes' and 'P says'. Psychological evidence is mixed.
  *   **Slide Concession:** "I concede that in low-stakes cases, hearers may reduce proxy assertion to standard testimony about reliability; my claim applies primarily to institutional/high-stakes contexts."

  ### 3. The Legal Epistemologist: "Reinventing the Wheel"
  *   **The Objection:** "Agency law and doctrines of 'apparent authority' already solve this. If S is authorized, P is liable. Why do we need a philosophical norm when legal doctrine handles the delegation conditions perfectly well?"
  *   **Reply Script:**
      *   "Law handles liability and contracts; I'm tracking epistemic entitlement. A lawyer might be legally authorized to speak but epistemically rogue (e.g., authorized to settle, not to assert facts about physics).
      *   Also, law focuses on the harm to the third party; I'm focused on the norm governing the *assertion itself*.
      *   Your doctrines explain when P gets sued. My norms explain when the hearer is rational to believe. Those come apart."
  *   **Soft Spot:** The boundary between "epistemic entitlement" and "legal authority" is blurrier in practice (e.g., expert witnesses) than in theory.
  *   **Slide Concession:** "I concede legal doctrine offers a robust parallel framework; my aim is to isolate the specifically epistemic norms that might diverge from legal liability."

  ### 4. The Philosopher of Language: "The Transmissible Store is Vague"
  *   **The Objection:** "What individuates the 'store'? If P believes *p*, but implies *q*, can S assert *q*? If P authorizes a paraphrase, how close must it be? This store is metaphysically suspicious."
  *   **Reply Script:**
      *   "The store isn't a mental state; it's a deontic status. It's the set of propositions P has marked for transmission.
      *   Implicatures are tricky: generally, S cannot transmit implicatures unless P has authorized the *context* that generates them.
      *   It's vague, yes, but so is 'common ground.' We manage vagueness in conversation constantly. The norm is 'stay within the licensed scope,' with hedge-requirements when scope is unclear."
  *   **Soft Spot:** "Licensed scope" is arguably as vague as the "store." Doesn't fully solve the individuation problem.
  *   **Slide Concession:** "I concede the boundaries of the transmissible store are context-sensitive and require further work on how implicatures transfer under delegation."

  ### 5. The Anti-Reductionist Testimony Theorist: "The Entitlement Gap"
  *   **The Objection:** "If warrant is default, where does it come from here? Does P's entitlement transfer to S? Or does S have a default entitlement to speak for P? If P is unreliable, is S still warranted?"
  *   **Reply Script:**
      *   "It's transferred entitlement. P licenses S to use P's epistemic standing.
      *   If P is unreliable, the assertion is defective, just as a standard assertion is defective if the speaker lacks knowledge.
      *   The hearer's default entitlement is to trust the *institution/role*, assuming the delegation conditions are met. If the delegation is rotten, the assertion fails, but the norm remains."
  *   **Soft Spot:** Mechanism of "transfer" is metaphorical. Doesn't explain *how* entitlement moves from P to S without P being present.
  *   **Slide Concession:** "I concede the mechanism of entitlement transfer is metaphorical in this paper and needs a more robust account of how epistemic status delegates."

  ### 6. The Formal Epistemologists (Joint): "Just Use Credences"
  *   **The Objection:** "Why talk about norms and stores? Model S as a channel with noise. The hearer updates credence based on the calibration of the source P, mediated by S. No speech acts needed."
  *   **Reply Script:**
      *   "Formal models describe the *weight* of the evidence; norms explain the *conditions of use*.
      *   You can model the update, but you can't explain why S is *wrong* to speak if they lack authorization. A calibration model doesn't capture the normative violation of speaking out of turn.
      *   We need both: your models for the degree of belief, my norms for the propriety of the signal generation."
  *   **Soft Spot:** Risks incompatibility. If the formal model works without norms, the norms might be epiphenomenal.
  *   **Slide Concession:** "I concede that formal models can capture the updating dynamics; my claim is that norms are still required to explain the propriety of the signaling act itself."

  ### 7. The Generalist (Annoyed): "The LLM Bait-and-Switch"
  *   **The Objection:** "You opened with a language model example. Everyone leaned in. Then you pivoted to press secretaries and lawyers. You never analyzed the AI. Was the opening just a gimmick?"
  *   **Reply Script:**
      *   "It wasn't a gimmick; it was a diagnostic. The reason the LLM case feels weird is precisely because it *fails* the proxy assertion test.
      *   By defining human proxy assertion first, we see exactly what the AI lacks: a principal with a transmissible store and a delegate capable of scope-tracking.
      *   The theory explains the AI case negatively: it's simulated transmission because it fails the authorization condition. I didn't ignore it; I solved it by exclusion."
  *   **Soft Spot:** Feels like a dodge. Audience wanted AI analysis, not a definition of human speech that excludes AI.
  *   **Slide Concession:** "I concede the paper focuses on human proxies; the application to AI is derived negatively and warrants a separate, dedicated analysis."

  ### 8. The Political Philosopher: "Who Gets to Be a Principal?"
  *   **The Objection:** "Your view assumes principals exist and can authorize. But institutional power determines who gets to be a principal. Are you naturalizing oppressive speech structures by calling them 'authorized'?"
  *   **Reply Script:**
      *   "This is a descriptive account of how proxy assertion *functions*, not a normative endorsement of who *should* be a principal.
      *   We can critique the authorization conditions politically while accepting that, sociologically, this is how the speech act works.
      *   In fact, my view helps critique power: if a regime claims proxy assertion but lacks a real transmissible store (e.g., no actual principal), my view exposes it as simulated transmission."
  *   **Soft Spot:** Separating "how it works" from "who benefits" is difficult in political epistemology.
  *   **Slide Concession:** "I concede the account is descriptive; it does not itself resolve normative questions about which institutions ought to hold principal status."

  ---

  ## FINAL SLIDE CONCESSIONS (Summary List)
  *   "Proxy assertion may require a distinct label if 'assertion' is too tightly bound to personal warrant."
  *   "Reductionism may suffice for low-stakes, informal proxy cases."
  *   "Legal doctrine offers a robust parallel framework for authority."
  *   "Boundaries of the transmissible store are context-sensitive (especially regarding implicature)."
  *   "The mechanism of entitlement transfer requires further metaphysical grounding."
  *   "Formal models capture updating dynamics; norms capture propriety."
  *   "AI application is derived negatively here; dedicated analysis needed."
  *   "Account is descriptive; political critique of principal-status is a separate project."

  ---

  ## ROOM MANAGEMENT NOTES
  *   **If the Speech-Act Theorist pushes hard:** Pivot to the Legal Epistemologist. "This is why I need the legal distinction between liability and entitlement."
  *   **If the Formal Epistemologists push hard:** Pivot to the Generalist. "We need norms to explain why the AI case feels wrong, not just probabilistically distinct."
  *   **If the Generalist stays annoyed:** Acknowledge it directly. "I know the AI example was a hook. The payoff is understanding why the hook feels like a hook."
  *   **Time Check:** If Q&A runs long, cut the Formal and Political replies short. Prioritize Testimony and Speech-Act objections.
