answer: |-
  # The Logical Space of Pleasure: A Taxonomy of the Heterogeneity Problem

  ### I. The Four Branch Questions
  *Answer Yes or No to locate a position in the logical space.*

  1.  **Grafting (Separability):** Is the pleasantness of an episode a distinct component that could, in principle, be detached and attached to a different phenomenology?
  2.  **Absorption (Salience):** Must a pleasant episode involve a phenomenally salient feeling of pleasure noticed by the subject at the time?
  3.  **Repudiation (Authority):** Is the subject's reflective judgment about whether an episode was pleasant incorrigible (i.e., can they be wrong)?
  4.  **Exchange (Commensurability):** Are all pleasant episodes mutually comparable on a single scale of magnitude (more/less pleasant)?

  ---

  ### II. The Live Leaves (Structural Positions)
  *Ten viable combinations of answers (Y/N) to the four questions above.*

  **1. Naive Feel Hedonism** (No, Yes, No, Yes)
  *   **Structure:** Pleasure is an inseparable, salient quality of sensation; subjects know best; all pleasures compare.
  *   **Awkward Commitment:** Cannot account for the pleasure of absorbed problem-solving where no distinct feeling is noticed.

  **2. Hedonic Tone Theory** (No, Yes, Yes, Yes)
  *   **Structure:** Pleasure is an inseparable, salient tone; subjects can be wrong about the tone; all pleasures compare.
  *   **Awkward Commitment:** Struggles to explain how one can be wrong about a raw feel without positing a separate judgment mechanism.

  **3. Adverbialism** (No, Yes, Yes, Yes)
  *   **Structure:** Pleasure is a manner of sensing (inseparable/salient); subjects can be wrong; all pleasures compare.
  *   **Awkward Commitment:** Makes the concept of pleasure linguistically elusive and difficult to isolate for measurement.
      *(Note: Leaves 2 & 3 are structurally indistinguishable on this tree; see Section IV).*

  **4. Millian Pluralism** (No, Yes, No, No)
  *   **Structure:** Pleasure is inseparable/salient; subjects can be wrong about quality; pleasures are incommensurable kinds.
  *   **Awkward Commitment:** Lacks a metric to resolve trade-offs between higher and lower pleasures in moral calculation.

  **5. Disjunctivism** (No, Yes, Yes, No)
  *   **Structure:** Pleasure is inseparable/salient; subjects know best; pleasures are incommensurable kinds.
  *   **Awkward Commitment:** Denies that 'pleasure' names a single psychological natural kind, fracturing hedonism.

  **6. Standard Attitudinalism** (Yes, No, No, Yes)
  *   **Structure:** Pleasure is a separable pro-attitude; need not be salient; subjects can be wrong; all pleasures compare.
  *   **Awkward Commitment:** Counts cases of miserable desire-satisfaction as pleasant if the subject takes the requisite stance.

  **7. Fallibilist Attitudinalism** (Yes, No, Yes, Yes)
  *   **Structure:** Pleasure is a separable pro-attitude; need not be salient; subjects can be wrong; all pleasures compare.
  *   **Awkward Commitment:** Risks severing the link between pleasure and motivation if the subject denies they are pleased.

  **8. Desire Functionalism** (Yes, No, Yes, Yes)
  *   **Structure:** Pleasure is a separable functional role (desire satisfaction); need not be salient; subjects can be wrong; all pleasures compare.
  *   **Awkward Commitment:** Implies a satisfied desire is pleasant even if the subject feels nothing but relief or pain.

  **9. Objective Pluralism** (Yes, No, No, No)
  *   **Structure:** Pleasure is a separable attitude; need not be salient; subjects can be wrong; pleasures are incommensurable.
  *   **Awkward Commitment:** Makes rational choice between distinct pleasures impossible without a common currency.

  **10. Eliminativism** (N/A)
  *   **Structure:** Rejects the presupposition that 'pleasure' picks out a unified kind across cases.
  *   **Awkward Commitment:** Denies the pre-theoretical datum that we universally seek pleasure and avoid pain.

  ---

  ### III. Unoccupied Cells (Dead Branches)
  *Logical combinations ruled out by the structure of the questions.*

  1.  **(No, No, _, _):** **Incoherent.** If pleasure is inseparable from phenomenology (No Grafting), it must be salient (Yes Absorption).
  2.  **(No, Yes, No, _):** **Unexplored.** Few argue subjects are infallible about inseparable tones but deny commensurability.
  3.  **(Yes, Yes, No, _):** **Unattractive.** If pleasure is a distinct salient feeling, it is odd to claim subjects are infallible about it.
  4.  **(Yes, Yes, Yes, No):** **Unexplored.** Distinct salient feelings are rarely argued to be incommensurable.
  5.  **(Yes, No, No, No):** **Unattractive.** Separable attitudes are usually thought to be comparable via strength of desire.
  6.  **(No, Yes, Yes, No):** **Occupied by Disjunctivism** (See Leaf 5), but logically unstable without fracturing the concept.

  ---

  ### IV. Case Sorting & Indistinguishability

  **Sorting the Seminar Cases:**
  *   **Scratching an Itch:** Fits *Naive Feel* or *Hedonic Tone* (Salient, Inseparable, Low Quality).
  *   **Absorbed Proof:** Rules out *Naive Feel*; requires *Attitudinal* or *Adverbial* (Non-Salient or Manner-based).
  *   **Repudiated Joke:** Rules out *Infallible* views (Leaves 1, 3, 5); requires *Fallibilist* views (Leaves 2, 6, 7, 8).
  *   **Bath vs. Proof:** Rules out *Monistic* views (Leaves 1, 2, 3, 6, 7, 8); requires *Pluralist* views (Leaves 4, 5, 9).

  **Indistinguishable Leaves:**
  *   **Pair:** **Hedonic Tone Theory (Leaf 2)** and **Adverbialism (Leaf 3)**.
  *   **Diagnosis:** Both occupy the same coordinates (No, Yes, Yes, Yes) on this tree.
  *   **Further Question Needed:** "Is pleasure a qualitative *content* of the experience (a 'tingle') or a *mode* of awareness (a way of attending)?"
