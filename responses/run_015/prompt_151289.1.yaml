      *   *Stimulus:* $S$ (e.g., Being struck).
      *   *Manifestation:* $M$ (e.g., Breaking).
      *   *Mask:* Something external (or internal but distinct) that prevents $M$ given $S$, without removing $D$. The intrinsic basis remains. (The wrapped glass is still fragile).
      *   *Fink:* Something that removes $D$ *at the moment* $S$ occurs, or alters the intrinsic basis such that $D$ no longer exists when tested. (The "finkish" disposition). A classic fink makes the object lose fragility *just as* it is struck.
