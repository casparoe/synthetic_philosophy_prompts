      *   **The Question:** Is this honesty *masked* (still present but blocked) or *finked* (disposition removed/altered such that it doesn't exist)?
      *   **The Worry:** If it's a fink, does virtue ethics collapse? (Because any trait could be nullified by unforeseen conditions, making attribution of virtue impossible/unstable).

  2.  **Analyze the Metaphysical Concepts (Masks vs. Finks):**

