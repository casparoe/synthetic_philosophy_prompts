      *   *Counter-argument 3 (The Definition of Virtue):* Virtue requires *phronesis* (practical wisdom). If the trauma response overrides reason, the unity of virtues suggests the virtue isn't fully instantiated.
      *   *Counter-argument 4 (Metaphysical Precision):* The "collapse" assumes a simple conditional analysis of dispositions. Modern dispositionalism (e.g., Bird, Mumford) uses sophisticated accounts (causal bases, powers) that account for masks/finks without dissolving the disposition.

