answer: |-
  ### Research Agenda: The ISOTYPE-Physicalism Nexus (3-Year Conceptual Project)

  **Team Composition:** Two Philosophers of Science (PoS), One Historian of Ideas (HoI).
  **Constraint:** Conceptual analysis only; no reliance on unpublished archives.

  The following ranking prioritizes inquiries based on logical dependency and the potential to resolve the core tension identified in Neurath's program: the conflict between the demand for anti-metaphysical empirical reporting and the conventional nature of pictorial representation.

  #### **Priority 1: Inquiry (a)**
  **Question:** Whether picture languages can genuinely avoid metaphysical commitments regarding resemblance and representation.

  **Rationale for Ranking (Upstream Foundation):**
  This is the ontological gatekeeper for the entire project. Neurath's physicalism demands that protocol sentences be free of metaphysical "pseudo-problems." If the pictorial medium *inherently* relies on resemblance, it smuggles in essentialist or realist metaphysics (i.e., that the picture shares the form of the object). If ISOTYPE relies on arbitrary convention, it risks the semantic conventionalism Neurath sought to purge. We cannot determine if ISOTYPE functions as a physicalist tool (Inquiry b) until we establish the metaphysical status of the tool itself. If the answer to (a) is negative (pictures are inevitably metaphysical), Inquiry (b) becomes a historical autopsy rather than a philosophical reconstruction. Therefore, (a) must be settled first to validate the possibility of the subsequent work.

  **Feasible Conceptual Result (Year 1):**
  A rigorous typology of "Pictorial Physicalism." The team will produce a conceptual distinction between *perceptual resemblance* (which carries metaphysical baggage) and *operational isomorphism* (which functions as a physicalist mapping). The result will be a definitive argument establishing whether ISOTYPE pictograms can be categorized as the latter without collapsing into the former.

  **Condition for Reordering:**
  If, within the first six months, textual analysis of Neurath's published works reveals an explicit, consistent, and sufficient stipulation that ISOTYPE signs are to be treated *solely* as arbitrary indices (bypassing resemblance entirely), Inquiry (a) is effectively settled by exegesis. Priority would immediately shift to Inquiry (b) to test the viability of that stipulation against the protocol theory.

  ---

  #### **Priority 2: Inquiry (b)**
  **Question:** Whether and how the ISOTYPE system can be reconciled with Neurath's physicalist protocol-sentence theory, or whether the two frameworks stand in irreconcilable tension.

  **Rationale for Ranking (Systemic Coherence):**
  Once the metaphysical status of the sign is established (via Inquiry a), we must test its integration into Neurath's epistemological system. This is the central hinge of the project. Inquiry (a) tells us what the brick is made of; Inquiry (b) tells us if the brick fits the wall. This inquiry is downstream of (a) because the criteria for "reconciliation" depend on the metaphysical clearance granted in Year 1. It is upstream of (c) because we cannot identify specific "failure conditions" (ambiguity) without first defining what "success" looks like (coherence with physicalist verification). This inquiry leverages the Historian's knowledge of the Unity of Science movement and the PoS experts' grasp of verificationism to model the interface between image and proposition.

  **Feasible Conceptual Result (Year 2):**
  A "Compatibility Matrix." This will not be a simple yes/no, but a mapped topology showing exactly where ISOTYPE aligns with protocol sentences (e.g., in aggregate statistical representation) and where it diverges (e.g., in singular existential claims). The result will be a reconstructed model of "Visual Protocol Sentences" that either validates Neurath's intuition or formally diagnoses the categorical error.

  **Condition for Reordering:**
  If the Compatibility Matrix reveals a total, irreconcilable contradiction between ISOTYPE and Physicalism (e.g., if visual syntax fundamentally cannot support the logical structure of protocols), Inquiry (b) concludes early. Priority would then shift to Inquiry (c) to analyze the *nature* of this failure, rather than attempting further reconciliation.

  ---

  #### **Priority 3: Inquiry (c)**
  **Question:** What the failure conditions of a universal visual language are—whether interpretive ambiguity is a correctable design flaw or an ineliminable feature of non-propositional communication.

  **Rationale for Ranking (Functional Stress-Test):**
  This inquiry is downstream of (b). We can only classify ambiguity as a "flaw" or a "feature" relative to the system's intended function established in Inquiry (b). If ISOTYPE is reconcilable with physicalism, ambiguity is a design flaw to be engineered out. If it is irreconcilable, ambiguity may be an ineliminable feature of trying to force non-propositional media into propositional roles. This inquiry moves from the *structure* of the system to the *limits* of its communication. It prevents the project from ending on a theoretical note by grounding the philosophy in the pragmatics of interpretation, without resorting to empirical user testing (adhering to the conceptual constraint).

  **Feasible Conceptual Result (Year 2-3):**
  A "Taxonomy of Visual Ambiguity." The team will conceptually categorize types of interpretive slippage in ISOTYPE (e.g., semantic vs. syntactic ambiguity) and argue which are contingent (fixable by better design) and which are necessary (inherent to non-linear visual logic). This provides a theoretical limit-curve for universal picture languages.

  **Condition for Reordering:**
  If the analysis shows that ambiguity is irrelevant to the specific scientific domains Neurath targeted (e.g., if macro-economic statistics are immune to the types of ambiguity found in qualitative depiction), Inquiry (c) loses urgency. Priority would shift to Inquiry (d) to assess why the system succeeded in practice despite theoretical ambiguities.

  ---

  #### **Priority 4: Inquiry (d)**
  **Question:** Whether Neurath's conceptual architecture offers portable resources for contemporary philosophy of scientific visualization and model-based representation, or whether its historical specificity renders such transplantation conceptually illegitimate.

  **Rationale for Ranking (Downstream Application):**
  This is the legacy question. It is strictly downstream of (a), (b), and (c). We cannot advocate for the portability of a system (d) if we have not determined its metaphysical validity (a), its internal coherence (b), or its functional limits (c). To prioritize (d) earlier would be to engage in premature application, risking the endorsement of a flawed framework. This inquiry synthesizes the findings of the previous three years to determine if Neurath's physicalism is a historical artifact or a living methodology. It ensures the project concludes with a normative contribution to current philosophy of science rather than remaining a historical commentary.

  **Feasible Conceptual Result (Year 3):**
  A "Portability Framework." A set of criteria determining when modern scientific visualization (e.g., data dashboards, climate models) can legitimately claim Neurathian lineage. This will distinguish between *stylistic* imitation (using icons) and *structural* adoption (using visualization as verification), providing a philosophical standard for contemporary visualization practices.

  **Condition for Reordering:**
  If contemporary developments in model-based representation (independent of Neurath) render the specific problem of "visual protocol sentences" obsolete (e.g., if digital interactivity bypasses the need for static universal languages), Inquiry (d) becomes the primary focus immediately to contextualize Neurath as a historical precursor rather than a living resource. However, given the enduring relevance of visualization in science, this is unlikely to displace (a)-(c).

  ### **Summary of Strategic Logic**
  This agenda proceeds from **Ontology (a)** to **Epistemology (b)** to **Pragmatics (c)** to **Application (d)**.
  *   **Inquiry (a)** ensures we are not building on metaphysical quicksand.
  *   **Inquiry (b)** ensures the system holds together internally.
  *   **Inquiry (c)** ensures we understand where the system breaks.
  *   **Inquiry (d)** ensures the work matters for the present.

  Any attempt to reorder this sequence risks solving the wrong problem (e.g., fixing ambiguity in (c) before knowing if the system is metaphysically permissible in (a)) or applying a broken tool (d) before testing its coherence (b). This ordering maximizes the conceptual yield of the three-year window by ensuring each year's output secures the foundation for the next.
