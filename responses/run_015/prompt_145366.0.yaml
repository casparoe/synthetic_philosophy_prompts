answer: |-
  This Coordination Failure Diagnostic isolates whether an incident stemmed from conflicting incentives, incomplete information loops, or unreliable channels, but its authority stops at procedural recommendation and cannot adjudicate individual negligence or guarantee safety without structural authority changes.

  ### The Coordination Failure Diagnostic (CFD)

  **Data Sources:** Radio Logs (timestamps, content, signal quality), Incident Timeline (action timestamps), Two Interviews (Sender, Receiver).
  **Missing Data Instruction:** If a log timestamp or signal report is missing, record "UNVERIFIABLE" and rely on Interview consensus; if Interviews conflict, mark **[JUDGMENT REQUIRED]** and halt procedural automation.

  **Step 1: Incentive Alignment (Payoff Divergence)**
  *   **Question:** Did both parties share the same primary objective (e.g., safety vs. containment) at the time of decision?
  *   **Data:** Interview Q: "What was your priority at [Time]?" vs. Log Orders.
  *   **Verdict:** If priorities differ (e.g., Crew A ordered to hold, Crew B ordered to flank), this is a **Command Conflict**, not a coordination failure.
  *   **Action:** Refer to Command Chain. **STOP.**
  *   **If Aligned:** Proceed to Step 2.

  **Step 2: Receipt vs. Certainty (Mutual vs. Common Knowledge)**
  *   **Question:** Did the Receiver get the message (Mutual Knowledge), and did the Sender know the Receiver got it (Common Knowledge)?
  *   **Data:** Log (Message sent vs. Ack received).
  *   **Verdict:**
      *   Message Sent + No Ack: **Incomplete Loop.**
      *   Message Sent + Ack Received: **Loop Closed.**
  *   **Action:** If Incomplete, proceed to Step 4. If Closed, proceed to Step 3.

  **Step 3: Trust in Execution (Common Belief in Rationality)**
  *   **Question:** Given the message was acknowledged, did the Sender believe the Receiver was *able* and *willing* to act?
  *   **Data:** Interview Q: "Did you believe Crew B would move when you heard 'Roger'?"
  *   **Verdict:** If "No" (e.g., "They are rookies," "Terrain was too steep"), this is a **Competence Belief Failure**.
  *   **Action:** Recommend Training or Resource Reallocation. **STOP.**
  *   **If "Yes":** Proceed to Step 4.

  **Step 4: Channel Reliability (The Finite Chain Problem)**
  *   **Question:** Was the communication channel verified as reliable during the window?
  *   **Data:** Log (Static reports, dropped calls, repeat requests) + Interview ("Could you hear clearly?").
  *   **Verdict:**
      *   Channel Unreliable (Static/Loss > 10%): **Epistemic Gap.** No finite number of confirmations creates Common Knowledge here.
      *   Channel Reliable: **Protocol Failure.**
  *   **Action:** If Unreliable, proceed to Step 5A. If Reliable, proceed to Step 5B.

  **Step 5: Intervention Selection**
  *   **5A (Unreliable Channel):** More communication will not fix this.
      *   **Fix:** Change Payoffs/Protocol. Implement Safe Standing Fallback, Pre-committed Trigger (e.g., "If no contact by 1400, withdraw"), or Single Designated Decision-Maker.
  *   **5B (Reliable Channel):** Communication fix is valid.
      *   **Fix:** Better Radio, Longer Briefing, Mandatory Read-Back Protocol.
  *   **5C (No Anomaly):** If Steps 1-4 show alignment, closed loops, trust, and reliable channels, yet failure occurred.
      *   **Verdict:** **NO-CHANGE.** The protocol worked; the outcome was stochastic or outside model scope.

  **[JUDGMENT REQUIRED] Marker:** Any step where Logs and Interviews contradict must be flagged for the District Ranger. The procedure does not resolve factual disputes.

  ### Theoretical Simplifications

  **Survived Distinctions:**
  1.  **Mutual vs. Common Knowledge:** Retained as "Receipt" vs. "Confirmed Receipt." This is the core of the user's argument against the boss.
  2.  **Common Belief in Rationality:** Retained as "Trust in Execution." Distinguishes knowledge failure from trust failure.
  3.  **Payoff Divergence:** Retained as "Incentive Alignment." Distinguishes coordination failure from command conflict.

  **Dropped Distinctions:**
  1.  **Infinite Recursion:** Theory requires infinite "I know that you know that I know..." levels. Procedure truncates at Level 3 (Sender knows Receiver knows Sender knows).
  2.  **Probabilistic Belief:** Theory uses probability distributions. Procedure uses binary states (Reliable/Unreliable, Trust/No Trust) for usability.
  3.  **Dynamic Updating:** Theory models belief change over time. Procedure assumes static belief states during the incident window.

  ### Case Applications

  **Case 1: The Ridge Near-Miss (Two Engine Crews)**
  *   **Facts:** Upper and Lower crews radioed "Holding." Lower crew pulled out early. Logs show both transmissions received.
  *   **CFD Run:**
      *   Step 1 (Incentives): Both aimed to hold line. **Aligned.**
      *   Step 2 (Receipt): Both acknowledged "Holding." **Loop Closed.**
      *   Step 3 (Trust): Upper Crew Interview: "I heard them say holding, but the fire jumped the ridge 10 minutes later. I assumed they were forced out." Lower Crew Interview: "We didn't radio the retreat because the radio died."
      *   Step 4 (Channel): Log shows Lower Crew radio went silent *after* initial check-in. Channel became Unreliable.
      *   Step 5 (Intervention): Unreliable Channel detected post-check-in.
  *   **Verdict:** **Epistemic Gap.** The initial Common Knowledge decayed.
  *   **Fix:** Pre-committed Trigger ("If silence > 15 mins, assume retreat"). More briefing would not have helped; the radio failed later.

  **Case 2: The Hand Crew (Missing Acknowledgment)**
  *   **Facts:** Coordination Centre ordered redeploy. Hand Crew never moved. Log shows Order sent, no Ack received.
  *   **CFD Run:**
      *   Step 1: **Aligned.**
      *   Step 2: **Incomplete Loop.** No Ack in log.
      *   Step 4: Channel Log shows high static during window.
      *   Step 5: Unreliable Channel.
  *   **Verdict:** **Epistemic Gap.** The Crew never achieved Mutual Knowledge of the order.
  *   **Fix:** **Protocol Change.** Do not rely on "send and hope." Implement Single Designated Decision-Maker (Runner) or Mandatory Read-Back with Timeout. A better radio helps, but without a timeout protocol, the uncertainty remains.

  **Case 3: The Unwelcome Verdict (Clearing the Boss)**
  *   **Facts:** Ranger wants to blame Engine Boss for a collision. Boss claims he gave the stop order. Log shows Order sent, Ack received, Channel clear.
  *   **CFD Run:**
      *   Step 1: **Aligned.**
      *   Step 2: **Loop Closed.** Log confirms Ack.
      *   Step 3: **Trust Intact.** Boss had no reason to doubt driver.
      *   Step 4: **Channel Reliable.** No static reported.
      *   Step 5: **NO-CHANGE.** The protocol was followed; Common Knowledge was established.
  *   **Verdict:** **Human Error / Stochastic.** The procedure clears the Boss and the Protocol.
  *   **Implication:** The Ranger cannot cite "communication failure" in the legal report. The finding must be individual negligence or unavoidable accident, shifting liability away from the Centre's protocol.

  ### Limitations

  This procedure cannot determine truth when logs are falsified, it cannot account for cultural pressures that prevent crews from reporting radio failures, and it cannot replace legal liability assessment regarding individual negligence. It diagnoses system epistemology, not human morality.
