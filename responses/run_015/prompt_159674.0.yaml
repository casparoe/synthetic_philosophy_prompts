prompt: |-
  Hey — I write a science-and-ideas column, and I keep having the same argument with my editor. Roughly once a month I get a paper or a press release where two rival explanations fit the same data, and I want to write "scientists can't tell which one is right," and my editor says that's lazy both-sides-ism. Or the mirror image: I write "the evidence favors X," and a researcher on the losing side emails me that the data are underdetermined and I owe them a correction. I need an actual procedure I can run, not vibes.

  What I want is a decision checklist — a flowchart in words — that I can run in about twenty minutes, on the phone, usually with a scientist who is an author of one of the rival theories. I know the rough shape of the philosphy here: that hypotheses get tested in bundles rather than one at a time, so a theory can always be protected by adjusting the background assumptions around it; the difference between "we don't have the evidence yet" and "no evidence anyone could get would separate these"; and the worry that for any theory you can dream up an empirically equivalent rival, which would make the whole complaint cheap. I need that turned into something usable, and I need you to decide which of those distinctions survive the simplification and which can be dropped.

  Please build in gates for at least these:

  - Is the disagreement at the level of the theory, or at the level of the measurement model — do the rivals share the assumption that the instrument is tracking the thing it's supposed to track? If they don't, I think it's a different story, and I want to know which one.
  - Transient vs. strong underdetermination: what's the question I ask to tell them apart, and what counts as a sufficent answer? I want the scientist to have to name the experiment or dataset that would settle it and say roughly when it'll exist, and I want to know what to do when they name something but privately everyone thinks it'll take fifteen years.
  - Is the rival a real research program somebody has worked out, or what I've started calling a zombie rival: it exists as a logical possibility, nobody has shown it can reproduce the rest of the field's data, and it only ever gets wheeled out when this one dataset comes up. Give me a sub-test that kills zombie rivals without me having to accuse a source of bad faith on the phone.
  - When a theory survives a bad result by changing an auxiliary assumption, how do I tell a principled fix from a rescue job? My naive rule is: was that auxiliary already in play, and was it plausible before this dataset came in? Tell me if that rule is wrong, and what to do when the answer is genuinely unclear.
  - When the rivals really are empirically equivalent and the only thing separating them is simplicity, elegance, or fit with what the rest of the field already believes: is that evidence or is it taste? I need a sentence I can put in the piece either way that isn't dishonest.

  I also want the procedure to say where it stops with "file the both-sides version," where it stops with "file the version where one side is ahead," and where it hands the call to me or my editor because it's a stakes question rather than an evidence question — how bad it is to be wrong in each direction, who gets hurt, that sort of thing. Mark those handoffs explicitly.

  Then run it on three cases:

  1. Two models of an ancient-climate proxy. Both fit the same measurements. Model A says the proxy records ocean pH, Model B says it records temperature, and the thing that would settle it is a lab calibration nobody has ever done, which would take years.

  2. A psychology result: a training regime improves test scores. The authors' theory says it's a specific cognitive mechanism; a critic says the same pattern would appear if the effect were really just motivation, and honestly the two predict the same outcomes on every measure in the paper. Nobody has run the subgroup analysis that would separate them.

  3. A case I care about, which I want you to make come out badly for me. I've got a piece half-written where a maverick says the mainstream model only looks confirmed because every lab uses instruments from the same lineage, so one shared systematic error would explain everything — and I framed it as a near-scandal. I suspect your procedure is going to tell me this is a zombie rival and I should kill the framing. Run it and tell me honestly, including what the maverick would have to actually do to make it a live rival.

  Be explicit about what the checklist can't do. I've got a maths-adjacent degree but no stats beyond one regression course, the piece has to be filed the same day, and my editor has to sign off on any line that says a field is genuinely stuck.
reasoning: |-
  Here's a thinking process that leads to the suggested decision checklist and case analyses:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas columnist.
      *   **Problem:** Recurring conflict with editor about "both-sidesism" vs. "underdetermination." Needs a concrete, 20-minute phone procedure (checklist/flowchart) to decide how to frame competing scientific explanations.
      *   **Key Concepts to Incorporate:** Theory vs. Measurement Model, Transient vs. Strong Underdetermination, Real vs. Zombie Rivals, Auxiliary Assumptions (Principled Fix vs. Rescue Job), Empirical Equivalence (Evidence vs. Taste).
      *   **Output Requirements:**
          *   A usable decision checklist (flowchart in words).
          *   Explicit "Stop/Handoff" points (File Both-Sides, File One-Side, Handoff to Editor/Stakes).
          *   Limitations of the checklist.
          *   Application to three specific cases (Ancient Climate, Psychology Training, Instrument Lineage/Maverick).
          *   Tone: Professional, direct, pragmatic, acknowledging the user's constraints (math-adjacent, deadline-driven).

  2.  **Deconstruct the Philosophy (Duhem-Quine, Underdetermination, Lakatos):**
      *   *Duhem-Quine Thesis:* Hypotheses aren't tested in isolation but in bundles (theory + auxiliaries + instruments).
      *   *Underdetermination:* Data can support multiple theories.
      *   *Transient vs. Permanent:* Is it just a lack of data now, or is it impossible in principle?
      *   *Research Programs (Lakatos):* Progressive (predicts new things) vs. Degenerating (ad-hoc fixes).
      *   *Zombie Rivals:* Logically possible but scientifically inert (no positive heuristic).
      *   *Measurement Validity:* Construct validity (are we measuring what we think we are?).

  3.  **Drafting the Checklist (The "20-Minute Protocol"):**
      *   *Goal:* Needs to be actionable questions, not abstract philosophy.
      *   *Structure:* Linear flow with decision nodes.
      *   *Gate 1: Measurement vs. Theory.* If they disagree on what the instrument measures, it's not theory competition yet; it's validity.
      *   *Gate 2: Zombie Test.* Does the rival have a track record or just a logical possibility?
      *   *Gate 3: Transient vs. Strong.* Is there a specific path to resolution?
      *   *Gate 4: Auxiliaries.* Is the fix ad-hoc or independent?
      *   *Gate 5: Equivalence.* If truly equivalent, is it metaphysics or aesthetics?
      *   *Handoffs:* Clearly mark where the journalist stops being a referee and starts being a risk assessor.

  4.  **Refining the Checklist Questions:**
      *   *Measurement:* "If Model A is right, does the instrument break?" vs "If Model A is right, does the number mean something else?"
      *   *Zombie:* "Show me a paper where this rival explained something *else*."
      *   *Transient:* "What is the specific experiment? When? Cost?"
      *   *Auxiliaries:* "Was this assumption published before this data arrived?"
      *   *Equivalence:* "Does choosing one change what we *do*?" (Pragmatic test).

  5.  **Developing the Case Studies:**

      *   *Case 1: Ancient Climate (pH vs. Temp).*
          *   Measurement issue? Yes, proxy calibration.
          *   Zombie? No, both are standard geochemical interpretations.
          *   Resolution? Lab calibration exists but is hard.
          *   Verdict: Transient underdetermination. File as "Active Debate," not "Science is Stuck."

      *   *Case 2: Psychology (Mechanism vs. Motivation).*
          *   Measurement? Same scores.
          *   Zombie? Motivation is a standard confound, not a zombie.
          *   Resolution? Subgroup analysis.
          *   Auxiliaries? Motivation is a standard auxiliary.
          *   Verdict: Rival is live. But is it *important*? If policy depends on mechanism, it matters. If only scores matter, it's taste.

      *   *Case 3: Instrument Lineage (The "Maverick" Case).*
          *   *Constraint:* User wants this to come out badly for them (i.e., show the piece is weak).
          *   Analysis: This is a classic "Systematic Error" claim.
          *   Zombie Test: Has the maverick shown this error exists elsewhere? Or just posited it?
          *   Auxiliaries: Claiming *all* labs share an error is a massive auxiliary assumption change.
          *   Verdict: Likely a Zombie/Conspiracy-adjacent claim unless they have independent verification of the error. The checklist should flag this as "Extraordinary Claim" requiring more than logical possibility.

  6.  **Addressing the "Stakes/Handoff" Requirement:**
      *   Need to distinguish between "Epistemic Uncertainty" (we don't know) and "Decision Uncertainty" (we must act).
      *   If the cost of being wrong is high (public health, engineering), the editor needs to weigh risk, not just truth.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Keep it punchy.
      *   *Time Check:* Can this be done in 20 mins? Yes, if the questions are direct.
      *   *Editor Constraint:* Ensure the "File Both-Sides" vs "File One-Side" criteria are clear enough for an editor to accept.
      *   *Philosophy Check:* Did I simplify too much? Acknowledge that "truth" isn't the only metric; "utility" matters.

  8.  **Final Polish:**
      *   Organize into clear sections: The Protocol, The Handoffs, The Limitations, The Case Runs.
      *   Ensure the "Maverick" case is handled delicately but firmly, as requested.
      *   Make sure the "Sentence for Equivalence" is actually writeable.

  *(Self-Correction during drafting)*: I initially thought about putting the "Stakes" question at the end. But the prompt asks for handoffs *within* the procedure. I should integrate a "Consequence Check" before the final filing decision. If the stakes are low, epistemic honesty wins. If stakes are high, precautionary principle might override epistemic nuance. I will add a specific "Stakes Gate."

  *(Refining the Maverick Case)*: The user suspects the procedure will call this a zombie rival. I need to make sure the checklist *actually* does that based on the criteria (lack of independent positive heuristic, ad-hoc nature of the systematic error claim). I will explicitly show how the "Zombie Test" filters this out.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a 20-minute decision protocol designed for your constraints. It strips the philosophy down to operational questions you can ask a source on a recorded line. It is designed to produce an audit trail your editor can review.

  ### The "Underdetermination Audit" Protocol

  **Time limit:** 20 minutes.
  **Subject:** One author of the primary theory (or a neutral third party if possible).
  **Goal:** Categorize the disagreement to determine the headline stance.

  #### Gate 1: The Measurement Check (Theory vs. Instrument)
  *Ask:* "If Rival B is true, does the instrument we are using break, or does it just measure something different?"
  *   **If the instrument breaks (calibration failure):** This is a measurement validity dispute, not a theory dispute.
      *   *Action:* Do not frame as "Two Theories." Frame as "Data Quality Question."
  *   **If it measures something different (construct validity):** Both theories accept the data exists, but disagree on what it *is*.
      *   *Action:* Proceed to Gate 2.

  #### Gate 2: The Zombie Test (Research Program vs. Logical Possibility)
  *Ask:* "Can you name one paper, dataset, or phenomenon *outside of this specific dispute* where Rival B successfully predicted something the mainstream theory missed?"
  *   **No / "It's theoretically possible":** This is a **Zombie Rival**. It exists only to negate the current claim, not to explain the world.
      *   *Action:* **Stop.** File the "One Side Ahead" version. Mention the rival only as a logical caveat, not a live competitor.
  *   **Yes:** This is a **Live Rival**.
      *   *Action:* Proceed to Gate 3.

  #### Gate 3: The Rescue Job Check (Auxiliary Assumptions)
  *Ask:* "To make Rival B fit this new data, did you have to add a new assumption? Was that assumption published or plausible *before* this data arrived?"
  *   **No (It was ad-hoc):** This is a **Degenerating Shift** (Lakatos). The theory is being protected, not tested.
      *   *Action:* Lean toward "One Side Ahead," but note the controversy.
  *   **Yes (Independent):** The assumption exists independently of this crisis.
      *   *Action:* Proceed to Gate 4.

  #### Gate 4: The Resolution Horizon (Transient vs. Strong)
  *Ask:* "What is the specific experiment or dataset that kills one of these? Does it exist? If not, when will it?"
  *   **"It's impossible in principle" / "It's metaphysical":** **Strong Underdetermination**.
      *   *Action:* Proceed to Gate 5.
  *   **"We need X machine / Y sample / Z analysis":** **Transient Underdetermination**.
      *   *Follow-up:* "Is that resource coming in 2 years or 20?"
      *   **< 5 years:** Treat as "Active Race."
      *   **> 10 years / "Funding dependent":** Treat as "Stalemate."
      *   *Action:* Proceed to Gate 5.

  #### Gate 5: The Stakes Handoff (Evidence vs. Consequence)
  *Ask yourself (do not ask source):* "If I publish 'We don't know' and one side is actually right, who gets hurt? If I publish 'X is winning' and X is wrong, who gets hurt?"
  *   **Low Stakes (Academic prestige, ancient history):** Epistemic honesty wins.
      *   *Action:* File "Both-Sides / Stalemate."
  *   **High Stakes (Public health, policy, engineering):** Precautionary principle wins.
      *   *Action:* **HANDOFF TO EDITOR.** This is no longer a science question; it is a risk management question. You need legal/policy input on liability.

  ---

  ### The Output Sentences
  *Use these exact templates to satisfy your editor's demand for precision.*

  **If Strong Underdetermination (Gate 4):**
  > "While Model A is the standard, Model B remains empirically indistinguishable given current tools; choosing between them currently relies on aesthetic preference for simplicity rather than new data."

  **If Transient Underdetermination (Gate 4):**
  > "The field is not stuck, but waiting: both models fit the past, but they diverge on [Specific Future Test], which is scheduled for [Year/Project]."

  **If Zombie Rival (Gate 2):**
  > "Critics note that logically, [Alternative] could explain the data, but it lacks a track record of predicting other phenomena in the field."

  ---

  ### What This Checklist Cannot Do
  1.  **It cannot detect fraud.** If the data is cooked, the logic holds but the conclusion is garbage.
  2.  **It cannot solve "Paradigm Shifts."** If the rival is Kuhnian (changing the definition of the field), it will fail Gate 2 initially because it has no track record *yet*. You will need editorial judgment for revolutionary claims.
  3.  **It cannot quantify probability.** It sorts buckets; it does not give you p-values or Bayes factors.
  4.  **It relies on source honesty.** A source can lie about the "Resolution Horizon." Cross-check with a second source if possible.

  ---

  ### Case Runs

  Here is the protocol applied to your three scenarios.

  #### Case 1: Ancient Climate (pH vs. Temperature Proxy)
  *   **Gate 1 (Measurement):** *Do they agree on the instrument?* Yes, they agree the proxy exists. They disagree on what physical property drives the signal (pH vs. Temp). **Pass.**
  *   **Gate 2 (Zombie):** *Is pH a zombie?* No. Geochemists have used pH proxies for decades in other contexts. It is a Live Rival. **Pass.**
  *   **Gate 3 (Rescue):** *Is one side adding ad-hoc assumptions?* Likely not. Both rely on standard geochemical fractionation laws. **Pass.**
  *   **Gate 4 (Resolution):** *Can we settle it?* Yes, lab calibration. *When?* "Years." *How many?* If the source says "We need a high-pressure chamber that doesn't exist yet," that is >5 years.
  *   **Gate 5 (Stakes):** *Who gets hurt?* Probably no one. It's ancient history.
  *   **Verdict:** **File "Active Debate."**
  *   **Why:** This is classic Transient Underdetermination. It is not "science is broken," it is "calibration is hard."
  *   **Drafting Line:** "Both models fit the geological record equally well; settling the dispute requires a high-pressure calibration experiment that is not expected to be feasible until the next decade."

  #### Case 2: Psychology (Cognitive Mechanism vs. Motivation)
  *   **Gate 1 (Measurement):** *Do they agree on the instrument?* Yes, test scores are test scores.
  *   **Gate 2 (Zombie):** *Is Motivation a zombie?* No. "Motivation" is a standard confound in psych. It has explained thousands of other results. Live Rival. **Pass.**
  *   **Gate 3 (Rescue):** *Is the critic adding an assumption?* No, they are invoking a standard auxiliary (participants try harder when rewarded). **Pass.**
  *   **Gate 4 (Resolution):** *Can we settle it?* Yes, subgroup analysis or a control condition. *When?* "Nobody has run it."
  *   **Gate 5 (Stakes):** *Who gets hurt?* If this training is sold to schools, and it's just motivation, money is wasted. If it's cognitive, it helps. **Medium/High Stakes.**
  *   **Verdict:** **HANDOFF TO EDITOR.**
  *   **Why:** The science is underdetermined (Transient), but the *claim* (Training improves cognition) has policy implications. You cannot write "Scientists aren't sure" if a school district is about to buy the program. You need to decide if the burden of proof lies with the authors (to rule out motivation) or the skeptics.
  *   **Editor Note:** "Science is undecided, but policy requires certainty. Do we run this as 'Promising but Unproven' or 'Potential Confound'?"

  #### Case 3: The Maverick (Shared Instrument Lineage Error)
  *   **Gate 1 (Measurement):** *Do they agree on the instrument?* No. The Maverick claims the instrument lineage itself is the variable. This is a Measurement Validity attack.
  *   **Gate 2 (Zombie):** *Has the Maverick shown this error elsewhere?* You suspect no. They are claiming a "shared systematic error" across the whole field. Unless they have an independent measurement (a different instrument lineage) showing the discrepancy, this is a **Zombie Rival**. It is a logical possibility ("All clocks could be wrong") without a positive research program.
  *   **Gate 3 (Rescue):** *Is this ad-hoc?* Yes. This claim only appears when the mainstream model is challenged. It requires the auxiliary assumption that "Every lab in the world made the same specific mistake." That is a massive, unprioritized assumption.
  *   **Gate 4 (Resolution):** *How to settle?* The Maverick needs to produce data from a *different* instrument lineage that contradicts the mainstream.
  *   **Verdict:** **File "One Side Ahead" (Mainstream).**
  *   **Why:** You suspected this would come out badly for your piece. The protocol confirms it. A claim that "everyone is wrong because of a shared tool" is a conspiracy claim until they produce independent data. It fails the Zombie Test because it has no positive heuristic (it only subtracts, it doesn't add).
  *   **What the Maverick must do:** They cannot just write papers arguing the error exists. They must build/buy a different instrument, measure the same phenomenon, and show the mainstream data deviates. Until then, framing it as a "near-scandal" is irresponsible.
  *   **Drafting Line:** "While [Maverick] argues that shared instrumentation could mask a systematic error, this hypothesis currently lacks independent verification from alternative measurement technologies."

  ### Summary for Your Editor
  When you file the piece, attach this note:
  *"I ran the Underdetermination Audit on this. Case 1 is Transient (calibration lag). Case 2 is High Stakes (needs policy call). Case 3 failed the Zombie Test (no independent data). I have adjusted the framing accordingly."*

  This shows you aren't using "both-sides" as a hedge, but as a categorized epistemic status.
