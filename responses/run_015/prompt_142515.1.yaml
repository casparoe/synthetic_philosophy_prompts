answer: |-
  This is a profound problem for a novelist because it maps directly onto **Point of View (POV) privilege.** If a state is conscious, you (the narrator) are allowed to describe the *feeling* of it. If it is unconscious, you can only describe the *behavior* of it.

  Your working rule ("could notice it by turning attention inward") is a version of what philosophers call **Access Consciousness**. It works for reporting, but it fails for *experience*. That is why it trips you up on the implant, the drugged woman, and the difference between Lena and Theo.

  Here is a principle that captures almost all your intuitions, followed by the one rule you must sacrifice and the verdicts on your new cases.

  ### The Principle: "The What-It-Is-Like Test"

  A mental state is conscious if **there is something it feels like** for the character to be in that state.

  In philosophy, this is called *phenomenal consciousness*. For a novelist, think of it as **Subjective Texture.**
  *   **Conscious:** The character is *undergoing* an experience (pain, red, grief, flow).
  *   **Unconscious:** The character's machinery is *processing* data, but no one is home to feel it (blindsight, automatic driving, the implant message).

  This principle distinguishes between **having a feeling** and **having a thought about a feeling.**

  ### How It Fits Your Ten Cases

  1.  **Miriam (Grief):** **Conscious.** There is a heavy, painful texture to her experience, even if she labels it "fine." The feeling exists; the label is a lie.
  2.  **Baby (Pain):** **Conscious.** There is definitely "something it is like" to be that baby. It hurts. No words required.
  3.  **Ruth (Images):** **Conscious.** Visuals and urges have texture. They are experienced, not just computed.
  4.  **Dog (Thunder):** **Conscious.** Fear has a visceral feel. The dog is experiencing the storm, not just reacting to barometric pressure.
  5.  **Lena (Highway Hypnosis):** **Unconscious (regarding driving).** This is the key. While her eyes see the road, the *act of driving* has no subjective texture. She is not "feeling" the steering. It is automated processing. You are right to feel it's "cheating" to say she is fully conscious of the driving mechanics.
  6.  **Theo (Flow):** **Conscious (High Intensity).** This is the opposite of Lena. In flow, the barrier between self and action dissolves. The "feeling" of playing is maximal, even if the "thinking about playing" is zero.
  7.  **Sleepwalker (Toast):** **Unconscious.** No subjective texture. No memory. The lights are off.
  8.  **Blindsight:** **Unconscious.** Information is processed, but there is no visual experience. It feels like guessing, not seeing.
  9.  **Drugged Woman (False Anger):** **Unconscious (of anger).** She is conscious of the *belief* that she is angry, but there is no heat, no tension, no visceral texture of rage. She is experiencing a thought, not an emotion.
  10. **Neural Implant:** **Unconscious (of seeing).** She is conscious of the *message* ("you are seeing red"), but she does not experience the *qualia* of redness. It is data, not sight.

  ### The Sacrifice: What You Have to Give Up

  You must abandon your working rule: *"A state is conscious if the character could notice it by turning their attention inward."*

  **Why it fails:**
  *   **Miriam:** She *could* notice the grief, but she actively refuses to. The grief is still conscious; her attention is just averted.
  *   **Theo:** He isn't turning attention inward; he is fully outward. Yet he is hyper-conscious.
  *   **The Implant:** She *does* notice the message inwardly, but it doesn't make the seeing conscious.
  *   **The Drugged Woman:** She notices the belief inwardly, but the anger isn't there.

  **The New Rule:** Don't ask if they *can* notice it. Ask if they are *feeling* it.

  ### The Lena vs. Theo Paradox

  You noted they look structurally the same (absorbed, no inner monologue) but feel opposite. The "What-It-Is-Like" principle explains why:

  *   **Lena is Dissociated.** Her mind has disconnected from her body's actions. The experience is *dimmed*. The "camera" is recording, but the projector is off.
  *   **Theo is Integrated.** His mind has merged with his body's actions. The experience is *brightened*. The "camera" and the "projector" are the same thing.

  **Writing Tip:** When writing Lena, describe the world as passing *by* her. When writing Theo, describe the world as passing *through* him.

  ### The Two New Cases

  Here is the verdict based on the principle:

  **1. The Coma Patient (Tennis Imagery)**
  *   **Verdict:** **Conscious.**
  *   **Reasoning:** If the brain activity confirms they are *imagining* tennis, there must be "something it is like" to imagine tennis. They are experiencing the imagery, even if they cannot move or speak.
  *   **Narrative Implication:** You can write their inner life. They are a prisoner in a silent room, not a broken machine. This is a "Locked-In" state, which is a form of hyper-consciousness trapped in an unconscious body.

  **2. The Dog with Word Buttons**
  *   **Verdict:** **Conscious (of the fear), but the button changes nothing about the consciousness.**
  *   **Reasoning:** The dog was already conscious of the fear in your earlier example. The button does not create consciousness; it creates **communication**.
  *   **Narrative Implication:** Do not write that the dog suddenly "understands" fear better. The dog feels the same storm-fear. The difference is the dog now has a tool to *tell* you. Be careful not to anthropomorphize the *experience* just because the *output* is human-like. The feeling is still dog-fear, not human-anxiety.

  ### Summary for Your Draft

  1.  **Keep:** Miriam, Baby, Ruth, Dog, Theo, Coma Patient. (These have **Subjective Texture**).
  2.  **Keep:** Sleepwalker, Blindsight, Implant. (These lack **Subjective Texture**).
  3.  **Refine:** Lena. Treat her driving as unconscious automation. She sees the road, but she doesn't "drive" until a deer appears and snaps her back into texture.
  4.  **Refine:** Drugged Woman. She is conscious of the *delusion*, not the *emotion*. Write the coldness of her belief, not the heat of anger.
  5.  **Discard:** The "Attention" Rule. Replace it with **"The Feeling Test."**

  If you can describe the *sensation* of the state without lying about the character's interiority, it is conscious. If you can only describe the *output* of the state, it is not.
