answer: |-
  The established concept is **theory-ladenness of observation**, which in the philosophy of history is specifically operationalized through **narrative emplotment**.

  This move occurs because historical data does not speak for itself; it must be described using concepts that derive their meaning from a broader theoretical framework. In the philosophy of science, Norwood Hanson and Thomas Kuhn established that what an observer "sees" is determined by their prior training and theoretical commitments (e.g., a physicist sees a "pendulum" where a layperson sees a "swinging weight"). In historiography, Hayden White expanded this to argue that historians impose a plot structure (emplotment) on events to make them intelligible. When a cyclical theory dictates that a civilization is in its "autumn," the theorist is committed to a tragedy or decay genre; consequently, empirical features like large public works are necessarily described using the vocabulary of that genre ("bloat") rather than the vocabulary of the "spring" genre ("energy"). The evidence itself remains constant, but the descriptive language shifts to maintain coherence with the chosen narrative arc.

  This is distinct from **hindsight bias**, which is a psychological error regarding probability judgments after an event has occurred. Your observation is not about misjudging likelihoods, but about the semantic framing of existing facts. It is also distinct from pure **unfalsifiability**, though it enables it. Unfalsifiability means a theory cannot be proven wrong; theory-ladenness explains *how* the theorist avoids falsification by altering the description of the counter-evidence to fit the theory. The logical flaw inherent in this move is **circular reasoning** (or *petitio principii*): the phase of the cycle is determined by the evidence, but the evidence is interpreted based on the phase of the cycle.

  The boundary between this move and legitimate **learning more** sits at **predictive specificity**. Legitimate historical revision occurs when new evidence emerges or when existing evidence is measured more precisely, leading to a change in the theory itself. The move you identified is suspect when the theory remains rigid while the *description* of the evidence flexes to accommodate it without independent criteria. If "large buildings" count as vigor only when the theory says we are rising, and as bloat only when the theory says we are falling, without an independent metric to distinguish vigor-from-bloat beforehand, the theory is protecting itself via theory-laden description rather than engaging with reality.

  This phenomenon absolutely affects **linear progress theories** as well. In Whig history or Marxist historical materialism, the same social unrest can be described as "reactionary violence" or "revolutionary struggle" depending on whether the theorist views the era as a step forward or a backward slide in the inevitable march of progress. A trade union in a progress narrative is "labor organizing"; in a decline narrative, it is "social fragmentation." The structural move is identical: the valuation of the fact is determined by its position in the pre-ordained story, not by independent empirical criteria.
