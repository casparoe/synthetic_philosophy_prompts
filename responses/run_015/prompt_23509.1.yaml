answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of calling [Partner 1] and [Partner 2] my best friends.

  Standing here, looking at the two of you, I've been thinking a lot about what happens next. Specifically, I've been thinking about the rationality of a promise.

  I'm currently taking a course on decision theory, and there's a famous puzzle that's been stuck in my head. It asks: Can you rationally commit to doing something in the future that your future self will have no reason to do? In the puzzle, you're rewarded for *intending* to do a difficult task, but by the time you actually have to do it, the reward is already gone, so there's no logical reason to follow through. It suggests that binding your future self is impossible, or even irrational.

  And if you look at a wedding vow from the outside, it looks a bit like that. You're standing here today, full of love, promising to show up on days in the future when you might be tired, or frustrated, or when the "reward" of feeling in love isn't immediately obvious. If logic is just about following your immediate desires, a vow looks like a trap.

  But I realized something watching you two together. That puzzle assumes your future self is a stranger who doesn't care about who you are today. It assumes your reasons are fixed.

  But a marriage vow isn't a shackle you put on a stranger; it's a blueprint for the person you're becoming.

  When you say "I will," you aren't just predicting that you'll want to stay. You are actively making yourself into the *kind of person* who stays. The commitment doesn't bind your hands; it builds your character. It ensures that on those hard days, your future self has a reason to keep going—because that future self is defined by the promise you made today.

  [Partner 1] and [Partner 2], you aren't trying to outsmart logic today. You're doing something better. You're agreeing to grow into the people who can keep this promise. You're deciding that "us" is more important than "me," not just now, but in every version of yourselves that comes after.

  That isn't a rational mistake. It's the most rational thing you can do, because it's the only way to build a life that lasts.

  So, if everyone could please raise a glass.

  To [Partner 1] and [Partner 2]. May you always be the people you promised to be today, and may you always find your reason to stay in each other.

  To the happy couple.
