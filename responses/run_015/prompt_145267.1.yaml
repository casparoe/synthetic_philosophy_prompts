answer: |-
  Here is a proposal for a unifying justification, structured as a single principle with three operative clauses. It is designed to capture the specific texture of your intuitions without smoothing over the tensions where they genuinely exist.

  ### The Principle: Subsidized Attachment and Structural Equity

  **Statement:**
  Public parental leave is a hybrid entitlement justified by two distinct public goods: (1) the formation of secure attachment between child and parent, and (2) the neutralization of gendered penalties in the labor market. To secure these goods, the entitlement must be structured as an **individual, non-transferable right to time**, decoupled from future employment loyalty, but conditioned on the **provision of household care** during the leave period.

  **The Three Clauses:**

  1.  **The Care Condition (Justifies the "What"):** The subsidy purchases *parental time*, not merely income replacement. The state is funding the labor of attachment.
      *   *Motivating Case:* **(e)** and **(f)**. In (e), the parental labor is outsourced (daycare) or negated (remote work); the public good is not produced. In (f), the household labor is supplied (by the partner), satisfying the attachment goal, while the leave-taker uses the time for capacity-building, which aligns with the long-term economic stability of the caregiving unit.
  2.  **The Equity Constraint (Justifies the "Who"):** Entitlements are assigned to *individuals*, not households, and are non-transferable between capable agents. This prevents intrahousehold bargaining or social norms from consolidating care onto one gender, which would reproduce labor market discrimination.
      *   *Motivating Case:* **(a)**. Even if the couple agrees to split it unevenly, the state refuses to facilitate a choice that reinforces the structural distortion the policy aims to fix.
  3.  **The Security Guarantee (Justifies the "How"):** Once the time is allocated, it is a vested right. It cannot be clawed back based on future employment decisions, nor denied based on past contribution irregularities, because the goal is to make the *taking* of leave costless.
      *   *Motivating Case:* **(c)** and **(d)**. Clawbacks (c) turn the right into a retention bond, discouraging take-up. Strict insurance logic (d) excludes those most vulnerable to the "motherhood penalty," undermining the equity goal.

  ---

  ### Verdicts on Unlisted Cases

  Based on this principle, here are the deductions for the three cases you proposed:

  **1. A parent who was not in paid work before the birth and never intended to be.**
  *   **Verdict:** They receive the **floor benefit** (from general revenue), but not an earnings-related top-up.
  *   **Reasoning:** The *Security Guarantee* ensures they are not excluded for lack of contributions (Case d). The *Care Condition* is satisfied as they are available for care. However, the *Equity Constraint* aims to neutralize labor market penalties; if there is no labor market attachment to penalize, the earnings-replacement logic does not apply. They receive the "time" entitlement, valued at the social minimum.

  **2. A second child born eleven months after the first.**
  *   **Verdict:** A fresh, full entitlement for the second child, not reduced or merged.
  *   **Reasoning:** The *Care Condition* is child-specific. Attachment must be formed with *this* child. The physical recovery and bonding needs are distinct events. To reduce the entitlement would be to treat the second child as less worthy of the public good of attachment. The *Security Guarantee* implies the parent should not be financially punished for family size.

  **3. A parent who uses the leave to care for a newly disabled partner rather than for the child.**
  *   **Verdict:** Ineligible for *parental* leave, but potentially eligible for a separate *caregiver* benefit.
  *   **Reasoning:** This violates the *Care Condition* as defined for *parental* leave. The public good being subsidized is *parent-child* attachment. Caring for a partner is a different social good (solidarity/health). Conflating them dilutes the specific justification for parental leave. However, under the *Security Guarantee*, if a separate caregiver scheme exists, it should similarly be non-clawback and accessible to the self-employed.

  ---

  ### The Honest Statement: Where the Principle Fractures

  You asked for an admission of where this justification cannot accommodate your verdicts. A single coherent principle cannot fully resolve the tensions you feel because your intuitions track three different moral languages (Rights, Consequences, and Virtue) that occasionally conflict. Here are the specific fracture points:

  **1. The Tension between (a) and (b): Liberty vs. Necessity**
  *   **The Conflict:** In (a), you override the couple's freedom to allocate time as they wish to serve *Structural Equity*. In (b), you allow the surviving parent to claim the absent parent's share, which effectively consolidates care onto one person (the opposite of equity).
  *   **The Failure:** The principle above handles this by prioritizing *Necessity* over *Equity* in (b). However, this is an admission that the Equity Constraint is secondary to the Care Condition. If the goal is truly to stop gendered specialization, (b) should theoretically still reserve the dead parent's share (to signal the norm) or redistribute it to society. Your intuition that the survivor *should* get it reveals that your commitment to **Care Sufficiency** ultimately trumps your commitment to **Gender Neutrality** when push comes to shove. The principle cannot make these two values lexically consistent; it must admit a hierarchy.

  **2. The Tension between (c) and (e): Trust vs. Verification**
  *   **The Conflict:** In (c), you insist the benefit is theirs to keep even if they sever ties with the employer immediately (implying the money is for *them*, no strings attached). In (e), you recoil if they use the time for anything other than care (implying the money is for the *child*, with strings attached).
  *   **The Failure:** The principle tries to bridge this by saying "It is for *time*, not *outcome*." But this is fragile. If they resign in week one (c), we assume they cared. If they work remotely (e), we know they didn't. The principle requires a verification regime that is invasive enough to catch (e) but hands-off enough to respect (c). You want a system that trusts the parent's *status* (c) but polices the parent's *activity* (e). This is administratively contradictory. The principle must admit that (e) requires a level of state surveillance into the home that (c) implicitly rejects. You are holding a "virtue" expectation (they *should* be caring) alongside a "right" expectation (they *can* keep the money).

  **3. The Reversing Case: The Three-Adult Household**
  *   **The Conflict:** Two legal parents, one primary caregiver relative.
  *   **The Verdict of the Principle:** **Two shares only.**
  *   **Why:** The *Equity Constraint* is designed to fix labor market discrimination against *legal parents* (typically employees). Extending it to a third adult moves from "parental leave" to "household subsidy."
  *   **The Cost:** This admits that your principle undervalues the actual labor of care if it is performed by a non-legal parent (e.g., a grandmother). It privileges the *legal status* of parenthood over the *fact* of caregiving. If you feel torn here, it is because you are oscillating between funding the **Status** (legal parents) and funding the **Work** (whoever holds the baby). The principle above sides with Status to avoid the state defining "family." If you choose to fund the Work, you invite the state to adjudicate who counts as a caregiver, which you explicitly said you wanted to avoid. You cannot have both.

  ### Implications for Cost-Bearing

  Your intuition in (g) (progressive replacement) and (d) (general revenue floor) dictates the funding model.

  *   **Rejection of Pure Insurance:** A pure insurance model (employer/employee contributions) fails (d) and (g). It excludes the self-employed and creates high marginal tax rates for low earners.
  *   **Rejection of Pure Employer Liability:** If employers fund the wage top-up directly, it recreates the statistical discrimination you aim to neutralize in (a).
  *   **The Required Model:** **Social Insurance funded by General Revenue.**
      *   The *floor* must be tax-funded to ensure universality (d).
      *   The *earnings-related portion* should be funded by a broad payroll tax (socialized risk) rather than individual firm liability, to prevent employers from discounting young women (a).
      *   The *cap* implies a progressive tax element; high earners are subsidized less, effectively cross-subsidizing the floor for low earners.

  **Summary Defense:**
  To a dissenter, you argue: *"We are not paying parents to stay home; we are paying the labor market to pause, so that care work does not destroy career capital. We enforce non-transferability not to dictate family life, but to prevent the market from dictating it for them. We police the use of time not to intrude on privacy, but to ensure the public is buying the public good of attachment, not just subsidizing income."*

  You must accept that this leaves you vulnerable to the charge of paternalism in (a) and inconsistency in (c)/(e). Your position is not logically airtight; it is a **reflective equilibrium** that prioritizes the child's need for care and the parent's need for equity over strict libertarian consistency.
