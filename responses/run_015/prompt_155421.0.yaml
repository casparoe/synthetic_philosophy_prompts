  3.  **Evaluate the Technical Claims (Fairness Impossibility Theorems):**
      *   *The Core Theorem:* Chouldechova (2017) and Kleinberg et al. (2016) showed that Calibration, Equalized Odds (which includes Equal FNR), and Prevalence (Base Rate) cannot all hold simultaneously unless Base Rates are equal across groups or the classifier is perfect.
      *   *Person A's Claim 1:* "If stage one is calibrated, the false negative rates already diverge because the base rates differ." -> **Mostly True.** If calibration holds and base rates differ, equalized odds (including FNR) generally cannot hold.
      *   *Person A's Claim 2:* "If you force parity at stage one, you break calibration." -> **True.** Given differing base rates, you can't have both.
      *   *Person A's Claim 3:* "This contradiction replays at every step." -> **Debatable/Context dependent.** Depends on the base rates of the *incoming* pool at each step.
      *   *Person A's Claim 4:* "Local parity doesn't protect against cumulative disadvantage." -> **True.** Even if FNR is equal at each step, if the selection rate differs (due to FPR differences or base rate differences affecting thresholds), the absolute number of survivors can diverge cumulatively.
      *   *Person A's Claim 5:* "If the rule has to stay fixed then the global base rates still govern." -> **True.** A fixed rule applied to the original population distribution implies the global statistics constrain the outcomes.

      *   *Person B's Claim 1:* "Once people are filtered through stage one, the pool reaching stage two is different, and the base rates inside that pool might align." -> **True.** This is the concept of conditional base rates. If Stage 1 selects differently, the prevalence of qualified candidates in Stage 2 can change. It is *possible* for base rates to converge in the selected pool, though not guaranteed.
      *   *Person B's Claim 2:* "So you can have both calibration and parity at stage two even if you couldn't at stage one." -> **True.** If base rates converge in the Stage 2 pool, the impossibility theorem constraint relaxes.
