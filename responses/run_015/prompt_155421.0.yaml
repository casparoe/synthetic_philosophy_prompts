      *   Crucially, they are missing the fact that "Calibration" in a multi-stage process is tricky. Is the score at Stage 2 calibrated relative to Stage 2 success, or final hiring success?
      *   They are missing the concept of *path dependence*. The composition of the pool at Stage 2 is endogenous to the fairness constraints applied at Stage 1.

