answer: |-
  ### The Scenario

  Alex promises to paint Blake's dining room using a specific, rare eco-friendly finish by Saturday, and Blake accepts. Relying on this, Blake purchases $500 worth of matching custom furniture that cannot be returned and declines a standing offer from a general contractor who would have used a standard finish. On Thursday, an unforeseen supply chain disruption makes the rare finish unavailable to Alex unless he sources it from a distant supplier, incurring an unexpected personal cost of $800 in travel and expedited fees; the painting itself remains physically possible. Blake still prefers Alex perform the promise with the rare finish rather than accept compensation for the $500 furniture loss, as the specific aesthetic is vital to Blake's upcoming event, but Alex claims he is only obliged to reimburse Blake for the wasted furniture.

  ***

  ### Theoretical Analysis and Correction

  Before applying the four accounts, I must address a significant premise in your request. You anticipate that **Reason-based accounts** (typically associated with T.M. Scanlon or Joseph Raz) will align with **Reliance-based accounts** (Fuller & Perdue) in limiting the duty to compensation. In the contemporary literature, this mapping is theoretically unstable. Reason-based accounts generally argue that a promise creates a content-independent reason *to perform the act*, not merely to prevent harm. Consequently, Scanlon's Principle of Fidelity and Raz's Exclusionary Reasons typically support a duty to **perform**, aligning them with Will and Contract theories, leaving Reliance theory as the outlier. If we define "Reason-based" as "the promise provides a reason to prevent reliance harm," it collapses into the Reliance account. To provide the most rigorous teaching material, I will analyze the scenario using the standard philosophical classifications, noting where your expected split holds and where the literature actually diverges.

  #### 1. The Reliance-Based Account
  **Verdict:** Duty to compensate ($500), no duty to perform.
  **Reasoning:** On this view (championed by Fuller, Perdue, and more recently Sheinman), the normative force of a promise is derived from the harm caused by inducing reliance. The promisor is liable for the loss suffered because they invited the promisee to depend on them. Since Blake's quantifiable loss is the $500 in wasted furniture, Alex's obligation is capped at making Blake whole for that loss. The $800 cost of performance is irrelevant to the obligation because the obligation is not to the *act*, but to the *consequences of the invitation to trust*.

  #### 2. The Contract-Based Account
  **Verdict:** Duty to perform.
  **Reasoning:** Treating the promise as a binding convention or a "mini-contract" (a la Macneil or conventionalist views), the obligation arises from the mutual expectation created within a social practice. To maintain the integrity of the practice of promising, expectations must be satisfied unless release is granted. Since Blake has not released Alex, and performance is possible, the convention demands the promised act. The internal cost to Alex is a risk he undertook by entering the "contract"; shifting to compensation undermines the stability of the practice.

  #### 3. The Will- or Autonomy-Based Account
  **Verdict:** Duty to perform.
  **Reasoning:** Associated with Charles Fried, this view holds that by promising, Alex exercises his autonomy to bind his future self to a specific course of action. He has transferred a right to Blake regarding the *painting*, not regarding Blake's *welfare*. To offer compensation instead of performance is to unilaterally alter the terms of the right transferred. Unless performance is impossible (which it is not), Alex's will remains bound to the act. The $800 cost is a burden Alex must bear to respect his own prior exercise of autonomy.

  #### 4. The Reason-Based Account
  **Verdict:** Duty to perform (contrary to your expected split).
  **Reasoning:** For Scanlon or Raz, the act of promising invokes a principle (e.g., Principle F) that generates a new, exclusionary reason to act as promised. This reason is not merely to prevent harm (which would be reliance), but to respect the assurance given. While unforeseen costs can sometimes override a promise, the threshold is typically high (e.g., severe hardship, not mere financial inefficiency). Since Alex *can* perform, the reason generated by the promise outweighs the inconvenience of the $800 cost. To switch to compensation is to treat the promise as a option contract rather than a fidelity obligation.

  ### Structural Feature and Theoretical Split

  The structural feature driving the split is the **object of the obligation**: is the promisor bound to the *promisee's welfare* (Reliance) or to the *promised act* (Will/Contract/Reason)?

  *   **Reliance Theory** anchors the obligation in the *past* (the harm incurred). Therefore, once the harm is quantified and compensable, the duty is discharged.
  *   **Will/Contract/Reason Theories** anchor the obligation in the *future* (the act to be done). Therefore, compensation is a substitute only if performance fails, not an option the promisor can choose when costs rise.

  **If you remove this feature:** If you remove the **cost divergence** (i.e., if performance costs Alex nothing extra), all four accounts converge on performance. If you remove the **reliance** (i.e., Blake buys nothing), the Reliance account says there is *no duty at all*, while the other three maintain a duty to perform. This highlights that Reliance theory is the only one where the *act of reliance* constitutes the binding moment; for the others, reliance is evidentiary or secondary to the promise itself.

  ### Defense of the "Losing" Account

  The Reliance-based account comes out "worst" here in terms of satisfying the promisee's preference (Blake wants the paint, not the money). A sophisticated defender of Reliance (e.g., Hanoch Sheinman) would attack the case by arguing that the **Will/Contract/Reason views impose an unjust insurance burden on the promisor.**

  They would argue: "Alex did not promise to be an insurer against supply chain disruptions. By demanding performance despite the unforeseen $800 cost, the Will and Reason accounts transform a social promise into a strict liability regime that discourages promising in uncertain environments. The Reliance view correctly identifies that Alex is responsible for the *trust he invited*, not for *worldly contingencies* that make keeping that trust expensive. If Blake wanted a guarantee against cost increases, he should have negotiated a contract with penalty clauses, not relied on a personal promise."

  This critique forces the Will/Reason theorist to explain *why* the promisor bears the risk of unforeseen costs, often leading them to invoke implicit terms or the moral weight of assurance itself.
