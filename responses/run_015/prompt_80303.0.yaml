  ### Pressure Point 1: The Regress of Rejection

  **Question:** You have accepted the Liar sentence as a true contradiction. Now consider the sentence "the Liar is not a true contradiction." On your own acceptance, that sentence is false; but it seems to call for exactly the same treatment that made the Liar a contradiction, which would make it a true contradiction as well, and the pattern repeats up a tower. Where, if anywhere, does the tower stop and what principle does the stopping?

  **Follow-up:** If you respond that the process terminates because the rejection sentence is not itself a dialetheia, then what licenses the stop at that level that did not apply one level down, where you did accept the contradiction?

  ### Pressure Point 2: The Boundary Problem

  **Question:** You hold that only some contradictions are true. What is the principled line that separates a true contradiction from a false one — a mere error? Is it self-reference, semantic paradox, something else? And does the line hold when we leave the semantic paradoxes and look at the Russell set, or at an inconsistent but empirically successful physical theory?

  **Follow-up:** If you ground the line in genuine self-referential paradox, is that a principled criterion or an ad hoc carve-out, and what happens to it once the contradictions stop being linguistic?

  ### Pressure Point 3: The Logic of the Logic

  **Question:** You block the explosion principle by reasoning in a paraconsistent logic. But that logic has to be presented and justified somewhere. If the meta-language in which you do so is classical, you are using the very reasoning your view discards to defend the logic that discards it; if the meta-language is itself paraconsistent, the question of what licenses that choice reappears a level up. What is your meta-logic and what does it have that the contradictions you are defending do not?

  **Follow-up:** If you say the hierarchy is acceptable, or that the meta-language can be paraconsistent too, what, at the top of the hierarchy, stops the justification question from recurring?

  ### Additional Questions from a Skeptical Audience

  **Question:** If contradictions can be true, the standard link between belief and action is threatened. If I believe $P$ and not-$P$, and $P$ implies action $A$ while not-$P$ implies not-$A$, how does your logic guide action without collapsing into paralysis?

  **Question:** The price of your view is abandoning Disjunctive Syllogism in certain contexts. Isn't it more theoretically virtuous to retain classical logic and posit a hierarchy of language or a gap in truth values, rather than sacrificing a rule of inference that works flawlessly in every non-paradoxical context?

  **Question:** Isn't there a category mistake here? When we encounter a paradox, isn't the philosophical duty to explain *why* our concepts fail, rather than ontologizing the failure? Why posit a contradiction in the world rather than a limitation in our conceptual scheme?

  ### Closing Question

  **Question:** What discovery — empirical or philosophical — would be strong enough to make you give up the view, and is there any such thing you could observe?
