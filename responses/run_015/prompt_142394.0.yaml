      *   **Section 1: Political Equality (The Core Tension).** Break down Ex-Ante vs. Ex-Post. Explain why the "Quota" adjustment happens (to fix the statistical variance of pure randomness). Explain why Appointment isn't enough (corruption/epistemic claims).
      *   **Section 2: Legitimacy (Authorization vs. Identity).** Contrast Electoral authorization with Sortitional identity. Discuss the "Microcosm" argument.
      *   **Section 3: Accountability (The Hardest Part).** Contrast Retrospective Voting with Internal/Structural Accountability. Discuss the assumption of "Self-Interest" vs. "Public Good."
      *   **Section 4: Philosophical Underdetermination (The "Black Box").** Identify where different theories converge on the same design. (e.g., Republicans and Radical Democrats might both like sortition for different reasons).
      *   **Section 5: Required vs. Compatible.** Create a matrix or list distinguishing what is essential to the theory vs. what is pragmatic.
      *   **Conclusion:** Summarize the trade-offs.

  7.  **Drafting the Content (Iterative refinement):**
