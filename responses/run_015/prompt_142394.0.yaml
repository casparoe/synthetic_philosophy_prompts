prompt: |-
  I'm writing a paper on replacing elections with lotteries — lottocracy, or whatever the proper term is — for my senior government class, and there is a feature of the actual proposals that I keep tripping over.

  The schemes I have read about, the citizens' assemblies convened on things like climate policy, all seem to do several things at once. Members are chosen by lottery, so that in principle anyone might end up serving. The draw is then adjusted so that the group comes out matching the country by age, sex, region, income, education and so on, which means some people are deliberately much likelier to be picked than others. The longer-running ones usually replace anyone who drops out by drawing again from that person's demographic "cell," so the group keeps its shape. And members serve a single term they cannot repeat, with no election at any point.

  Here is my problem. "Everyone gets an equal shot" and "the body should be a miniature of the people" look like two different ideas of equality, and the replacement rule suggests the second one is really the one doing the work. But if it is, I do not see why randomness is needed at all rather than simply choosing people on purpose, and I do not see what is supposed to make such a body accountable to anyone if it can never be voted out.

  So: what does this package of practices actually presuppose about political equality, legitimacy, and accountability? Which parts of it do those commitments strictly require, which parts merely fit comfortably with them, and where is the design philosophically underdetermined, so that two quite different theories would still produce the same institution? I would rather have the disagreement laid out than be told which side is right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Replacing elections with lotteries (sortition/lottocracy) for a senior government class paper.
      *   **Core Problem:** The user identifies a tension between two concepts of equality: "equal chance of selection" (randomness) vs. "descriptive representation" (stratified sampling to match demographics). They also question the need for randomness if the goal is just a mirror, and they question accountability (no re-election).
      *   **Specific Questions:**
          1.  What does this package presuppose about political equality, legitimacy, and accountability?
          2.  Which parts are strictly required by these commitments vs. which are merely compatible?
          3.  Where is the design philosophically underdetermined (i.e., where do different theories lead to the same institution)?
      *   **Constraint:** Do *not* take a side. Lay out the disagreements and theoretical tensions.

  2.  **Deconstruct the Core Tension (Randomness vs. Quotas):**
      *   *Observation:* The user is right. Pure sortition (everyone has $1/N$ chance) yields a representative sample *on average* over many trials, but a single assembly might be skewed. Stratified sortition (quotas) ensures descriptiveness in *this* trial but violates strict equal probability (someone in a small demographic cell has a higher chance than someone in a large one).
      *   *Theoretical Implication:* This suggests the goal isn't just "fair procedure" (ex-ante equality) but "fair outcome" (ex-post descriptiveness).

  3.  **Address Political Equality:**
      *   *Concept 1: Ex-Ante Equality (Opportunity).* Everyone has the same chance to be picked. This aligns with pure randomness.
      *   *Concept 2: Ex-Post Equality (Presence).* The group looks like the people. This aligns with stratified sampling.
      *   *Conflict:* To get Ex-Post, you sacrifice strict Ex-Ante.
      *   *Why Randomness?* If the goal is just descriptiveness, why not appoint?
          *   *Reason A:* Anti-elitism/Corruption prevention. Appointment invites manipulation. Randomness breaks the chain of patronage.
          *   *Reason B:* Epistemic humility. No one knows "who should rule" better than chance.
          *   *Reason C:* Civic duty. Randomness treats service as a duty like jury duty, not a career.

  4.  **Address Legitimacy:**
      *   *Electoral Legitimacy:* Consent via voting.
      *   *Sortitional Legitimacy:* "The people are present." It's not about *authorizing* rulers, but *being* the rulers.
      *   *The "Mini-Public" vs. "Full Replacement":* Most proposals (Citizens' Assemblies) are advisory. The user is asking about *replacing* elections. This is a stronger claim.
      *   *Legitimacy Source:* Is it the *process* (random) or the *composition* (mirror)? If the mirror is perfect but the process was rigged to achieve it, is it legitimate? (Likely no). So randomness is instrumental to legitimacy, not just compositional.

  5.  **Address Accountability:**
      *   *Electoral Accountability:* Retrospective voting (throw the bums out).
      *   *Sortitional Accountability:* This is the hardest pill.
          *   *Mechanism 1:* Short terms + No re-election = No incentive to curry favor for future gain.
          *   *Mechanism 2:* Transparency/Deliberation. Public reasoning.
          *   *Mechanism 3:* The "Principal-Agent" problem disappears because the agents *are* the principals (statistically).
          *   *Mechanism 4:* Recall or Oversight bodies (sometimes proposed).
      *   *The User's Point:* If they can't be voted out, what stops them from going rogue?
      *   *Theoretical Answer:* The assumption is that a representative sample won't vote against its own interest (unlike career politicians).

