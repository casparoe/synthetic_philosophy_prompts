answer: |-
  This is an exceptionally sharp observation. You have identified the central theoretical friction in modern sortition theory (the academic term for "lottocracy"). Most introductory texts gloss over the tension you've spotted: the move from *pure* randomness to *stratified* randomness (quotas) signals a shift in the underlying justification for the system.

  To help you map this for your paper, I will break this down into the three normative categories you identified (Equality, Legitimacy, Accountability) and then address the question of underdetermination and design requirements.

  ### 1. Political Equality: Ex-Ante vs. Ex-Post

  You are correct that "equal shot" and "miniature of the people" are distinct, and often competing, concepts of equality.

  *   **Ex-Ante Equality (Procedural):** Every citizen has an identical mathematical probability of selection ($1/N$). This is the classical Athenian or jury-duty model. It treats political office as a burden or duty distributed fairly.
  *   **Ex-Post Equality (Descriptive):** The resulting body mirrors the demographic and sociological characteristics of the populace. This treats the legislature as a "microcosm."

  **The Tension:**
  Strict *ex-ante* equality (pure lottery) guarantees *ex-post* equality only in the long run (across infinite iterations). In a single assembly of 500 people, pure randomness might yield a group that is 60% male or lacks rural representation simply due to statistical variance. By introducing quotas (stratified sampling), proponents prioritize *ex-post* equality. They accept that a rural citizen might have a higher probability of selection than an urban citizen to ensure the rural perspective is present.

  **Why Randomness and Not Appointment?**
  If the goal is a demographic mirror, why not just appoint people to fill the slots? This is where the third value enters: **Anti-Corruption/Epistemic Humility.**
  *   **The "Who Chooses the Choosers?" Problem:** If a committee hand-picks the "perfect mirror," they will inevitably select the *kind* of working-class people or women they find palatable. Randomness within demographic cells prevents elite capture of the selection process.
  *   **The Claim:** Randomness is not there to maximize descriptiveness (quotas do that); it is there to prevent manipulation *in the service of* descriptiveness.

  ### 2. Legitimacy: Authorization vs. Identity

  This is where the divergence from electoral theory is starkest.

  *   **Electoral Legitimacy (Authorization):** Legitimacy comes from *consent*. I vote for you; therefore, you are authorized to rule me. The focus is on the *transfer of power*.
  *   **Sortitional Legitimacy (Identity):** Legitimacy comes from *presence*. You are ruling me; therefore, I am ruling myself. The focus is on the *constitution of power*.

  **The Presupposition:**
  Sortition theory presupposes that the primary crisis of legitimacy is not a lack of consent, but a lack of **representative fidelity**. It assumes that career politicians inevitably develop interests distinct from their constituents (the Principal-Agent problem). By making the agents statistically identical to the principals, the theory argues the "agency loss" disappears.

  **The Accountability Gap:**
  You asked what makes them accountable if they cannot be voted out. Sortition theory proposes three alternative accountability mechanisms, none of which are electoral:
  1.  **Short Terms + No Re-election:** This removes the incentive to make decisions based on future electability. It forces accountability to *conscience* or *immediate peers* rather than donors or parties.
  2.  **Deliberative Transparency:** Unlike closed-door lobbying in elected bodies, citizens' assemblies usually operate under strict transparency. The accountability is to public reason-giving.
  3.  **Statistical Self-Interest:** The theory assumes a representative sample will not vote to harm themselves. If the assembly *is* the population, they won't cut their own healthcare or bomb their own neighborhoods.

  **The Counter-Argument:**
  Critics argue this confuses *sociological* representation with *political* accountability. A group of demographically average people can still be corrupted, misinformed, or tyrannical. Without the threat of removal, there is no mechanism to correct error, only to wait for the term to end.

  ### 3. Philosophical Underdetermination

  This is the most fertile ground for your paper. You asked where different theories produce the same institution. There are two distinct philosophical pathways that converge on "Stratified Sortition," but for contradictory reasons.

  **Pathway A: The Radical Democratic View**
  *   **Core Value:** Equality and Anti-Elitism.
  *   **View of Randomness:** Intrinsic good. It destroys the idea that ruling requires special expertise.
  *   **View of Quotas:** Necessary corrective to ensure marginalized voices aren't statistically drowned out.
  *   **Goal:** To dissolve the distinction between ruler and ruled.

  **Pathway B: The Technocratic/Epistemic View**
  *   **Core Value:** Competence and Stability.
  *   **View of Randomness:** Instrumental good. It selects for "average wisdom" and reduces polarization (the "Wisdom of Crowds" argument).
  *   **View of Quotas:** Necessary to ensure all data points (perspectives) are included in the calculation of the public good.
  *   **Goal:** To produce better policy outcomes than "irrational" voters would.

  **The Convergence:**
  Both pathways support the exact same institutional design (stratified lottery, single term), but Pathway A sees it as a way to *empower the people*, while Pathway B sees it as a way to *bypass the volatility of the people*. This is a crucial distinction for your paper: the institution looks the same, but the justification for its legitimacy is opposite.

  ### 4. Required vs. Compatible Design Features

  To answer your specific question about which parts of the package are strictly required by the commitments, here is a breakdown:

  | Feature | Strictly Required By... | Merely Compatible With... | Philosophical Function |
  | :--- | :--- | :--- | :--- |
  | **Random Selection** | **Ex-Ante Equality.** If you remove this, you lose the claim that anyone *could* have been picked. | **Descriptive Representation.** You could achieve this via appointment. | Prevents elite capture of the selection process. |
  | **Stratification (Quotas)** | **Descriptive Representation.** Pure randomness cannot guarantee a mirror in a single sample. | **Ex-Ante Equality.** Technically violates strict equal probability. | Ensures minority voices are not lost to statistical variance. |
  | **Single Term / No Re-election** | **Anti-Careerism.** Essential to prevent the formation of a political class. | **Competence.** Some argue longer terms allow for learning. | Breaks the link between decision-making and future reward. |
  | **Replacement from Cell** | **Descriptive Representation.** Essential to maintain the "mirror" over time. | **Ex-Ante Equality.** Gives remaining people in that cell a higher chance. | Prioritizes the stability of the microcosm over the fairness of the draw. |
  | **Unicameral / Sole Authority** | **Full Sortocracy.** Required to replace elections entirely. | **Hybrid Models.** Most current proposals are advisory only. | Determines if the body has actual power or just influence. |

  ### 5. Summary of the Theoretical Trade-Off

  Your paper can argue that the "package" you describe is actually a **hybrid compromise** that tries to hide a contradiction.

  1.  **The Contradiction:** The system claims the legitimacy of *pure democracy* (anyone can rule) while utilizing the engineering of *technocratic sampling* (only the right mix should rule).
  2.  **The Accountability Solution:** The system replaces *vertical accountability* (voters judging leaders) with *horizontal accountability* (leaders judging each other through deliberation) and *internal accountability* (leaders acting in their own self-interest as citizens).
  3.  **The Underdetermination:** The design works for both those who think "the people are wise" and those who think "voters are irrational," which suggests the design itself does not solve the fundamental disagreement about human nature, it merely sidesteps it.

  **Recommendation for your thesis:**
  Don't try to solve whether sortition is "better." Instead, argue that the shift from pure lottery to stratified sampling reveals that modern sortition theorists have quietly abandoned **procedural equality** (the right to be picked) in favor of **outcome equality** (the right to be represented), and that this changes the nature of the legitimacy claim from "consent of the governed" to "identity of the governors." That is a defensible, analytical claim that engages directly with the tension you identified.
