      *   *Refining Accountability:* Make sure to mention "Deliberative Accountability." They have to give reasons, not just decisions.
      *   *Refining Underdetermination:* Use the term "Instrumental vs. Intrinsic." Some value randomness intrinsically (equality), others instrumentally (outcomes).
      *   *Terminology:* Use "Sortition" (the academic term). Distinguish between "Advisory Citizens' Assemblies" (current practice) and "Sortocratic Legislature" (the user's paper topic).

  8.  **Self-Correction/Review against Constraints:**
