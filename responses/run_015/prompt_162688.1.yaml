prompt: |-
  I'm in the final year of a psychology degree and taking a module on evidence and replication. One of the popular books on bad science that we were pointed to summarises the situation roughly like this:

  "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated. The mechanism is p-hacking. A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive; add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still. The remedy is to go Bayesian. Bayes' theorem gives you the probability that the hypothesis is true given the data, and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate. Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong. Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."

  On the strength of arguments like this, our seminar leader wants our group project to pre-register its analysis, report default Bayes factors and credible intervals instead of p-values and confidence intervals, and treat any Bayes factor below three as inconclusive. I find the Lindley point genuinely persuasive, and "the probability that the hypothesis is true given the data" and the one-in-twenty line both strike me as too neat — but I can't tell whether that is a real worry or just my own suspicion, and I don't want to object unfairly.

  Could you audit the passage for me: which sentences a statistician would accept, which are standard simplifications, and which are misrepresentations or overstatements? In particular, is a default Bayes factor really insensitive to the stopping rule and to the choice of prior, does the Lindley argument really show that the p-value is the one in the wrong, and does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Final year psychology student, module on evidence and replication.
      *   **Task:** Audit a specific passage summarizing the replication crisis and the proposed Bayesian solution.
      *   **Goal:** Identify which sentences are accurate, which are simplifications, and which are misrepresentations/overstatements.
      *   **Specific Questions to Address:**
          *   Is a default Bayes factor really insensitive to stopping rules and prior choice?
          *   Does Lindley's paradox prove p-values are wrong?
          *   Does the seminar leader's policy follow from the corrected summary?
      *   **Tone:** Academic, critical, nuanced, helpful for a student project.

  2.  **Deconstruct the Passage (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated."
          *   *Status:* Overstatement/Simplification.
          *   *Nuance:* Open Science Collaboration (2015) found ~36-47% replication rates depending on metrics. "Most... are false" is too strong. Replication failure $\neq$ falsehood (could be context differences, power issues).

      *   *Sentence 2:* "The mechanism is p-hacking."
          *   *Status:* Overstatement.
          *   *Nuance:* P-hacking is *a* mechanism, but not the *only* one. Publication bias, low power, HARKing, measurement error, and genuine context dependence also play roles.

      *   *Sentence 3:* "A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive..."
          *   *Status:* Misrepresentation (The Base Rate Fallacy).
          *   *Nuance:* This is the classic misunderstanding of $P(H_0|Data)$ vs $P(Data|H_0)$. If the base rate of true effects is low, the False Discovery Rate (FDR) is much higher than 5%. If the base rate is high, it's lower. It's not fixed at 1 in 20 of *significant* findings.

      *   *Sentence 4:* "...add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still."
          *   *Status:* Accurate.
          *   *Nuance:* Ioannidis (2005) logic holds here.

      *   *Sentence 5:* "The remedy is to go Bayesian."
          *   *Status:* Opinion/Overstatement.
          *   *Nuance:* It's *a* remedy, not *the* remedy. Many reformers advocate for better frequentist practices (pre-registration, power analysis) without switching to Bayes.

      *   *Sentence 6:* "Bayes' theorem gives you the probability that the hypothesis is true given the data..."
          *   *Status:* Simplification/Technically True but Contextual.
          *   *Nuance:* It gives $P(H|Data)$ *given a prior*. It's not an objective truth without the prior.

      *   *Sentence 7:* "...and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate."
          *   *Status:* Mixed (Stopping rule part is mostly true; Objectivity part is false).
          *   *Nuance:* Likelihood principle means Bayes Factors are insensitive to stopping rules *in theory*. However, "objective measure" is wrong because the Cauchy prior (r=0.707) is subjective/arbitrary. Optional stopping *can* bias BF if not accounted for in the decision threshold, though the BF itself remains valid likelihood ratio.

      *   *Sentence 8:* "Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong."
          *   *Status:* Misrepresentation/Overstatement.
          *   *Nuance:* Lindley's paradox highlights a divergence, not a proof that p-values are "wrong." It often arises from using point-null hypotheses with diffuse priors. It shows they answer different questions.

      *   *Sentence 9:* "Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."
          *   *Status:* Counterfactual Speculation/Overstatement.
          *   *Nuance:* Unfalsifiable. Bayesian methods can also be p-hacked (q-hacking), and publication bias affects Bayes too.

  3.  **Address Specific User Questions:**

      *   *Stopping Rule:* Bayes Factors adhere to the Likelihood Principle, so the *value* doesn't change based on stopping intent. However, *interpretation* thresholds might need adjustment if stopping is data-dependent (though this is debated).
      *   *Prior Choice:* Default BFs (Cauchy) are *not* insensitive to prior choice. Changing the scale parameter changes the BF. They are "default," not "objective truth."
      *   *Lindley's Paradox:* It shows divergence when $N$ is large and priors are diffuse. It doesn't prove p-values are wrong, just that they measure different things (tail probability vs. model comparison).
      *   *Seminar Leader's Policy:* Pre-registration is good. Reporting BFs is fine. Treating BF < 3 as inconclusive is standard (Jeffreys' scale). However, banning p-values entirely is controversial and might hinder communication. Relying solely on "default" priors ignores the subjectivity issue.

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the student's critical thinking (it's good they are suspicious). Validate that the passage is a mix of truth and "Bayesian evangelism."
      *   **Section 1: Sentence-by-Sentence Audit.** Break down the text as analyzed in step 2. Use clear labels (Accurate, Simplification, Misrepresentation).
      *   **Section 2: Addressing the Specific Technical Questions.**
          *   Stopping Rules (Likelihood Principle vs. Calibration).
          *   Prior Sensitivity (Default $\neq$ Objective).
          *   Lindley's Paradox (Different questions, not error).
      *   **Section 3: Evaluating the Seminar Leader's Policy.**
          *   Pre-registration: Good.
          *   Default BFs: Okay, but check robustness.
          *   BF < 3 rule: Reasonable heuristic.
          *   Banning p-values/CIs: Problematic for comparability.
      *   **Conclusion:** Summarize the main takeaway. The crisis is real, the causes are multifaceted, and Bayes is a tool, not a magic wand.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about the "optional stopping" claim. While the BF value is invariant, *bias* can be introduced if you stop *only* when BF > threshold. This is known as "Bayesian optional stopping." I should clarify that the *evidence* is valid, but the *error rates* (if treated as frequentist) are not controlled.
      *   *Correction:* On Lindley's Paradox. Make sure to mention that it often occurs because the Bayesian prior spreads probability mass too thinly over the alternative, making the null look better by comparison as N grows.
      *   *Tone Check:* Ensure I don't sound like I'm attacking the seminar leader, but rather empowering the student to understand the nuances. The leader's policy is *acceptable* for a student project, even if the justification in the text is flawed.

  6.  **Final Polish:** Check against the user's specific constraints (audit the passage, answer specific questions). Ensure the distinction between $P(Data|H_0)$ and $P(H_0|Data)$ is clear.

      *(Self-Correction on the "1 in 20" claim)*: The text says "about one in twenty of the significant findings... is a false positive." This is the specific error. It confuses the Type I error rate (5% of *null* studies) with the False Discovery Rate (percentage of *significant* studies that are null). This needs highlighting.

      *(Self-Correction on "Objective Measure")*: Emphasize that the Cauchy(0, 0.707) is a convention (Rouder et al.), not a law of nature.

  7.  **Final Output Generation:** (Proceed to generate response based on these points.)
answer: |-
  It is excellent that you are treating this summary with skepticism. Your intuition is correct: the passage you quoted is a piece of **Bayesian evangelism**. It mixes established facts about the replication crisis with contested statistical philosophy and several outright misconceptions about how Bayesian methods work.

  While your seminar leader's proposed policy (pre-registration + Bayes Factors) is a defensible choice for a student project, the *justification* provided in that text contains significant errors. If you base your project's rationale on that text without qualification, you risk propagating those errors.

  Here is an audit of the passage, followed by answers to your specific technical questions.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated."**
  *   **Verdict:** **Overstatement / Simplification.**
  *   **Analysis:** The Open Science Collaboration (2015) found that only 36% to 47% of replications yielded significant results (depending on the metric). However, "replication failure" does not equal "false." Failures can occur due to contextual differences, insufficient power in the *replication*, or measurement error. To say "most... is false" is a strong claim not fully supported by the data.

  **2. "The mechanism is p-hacking."**
  *   **Verdict:** **Overstatement.**
  *   **Analysis:** P-hacking (researcher degrees of freedom) is a major contributor, but it is not the *sole* mechanism. Publication bias (the file drawer problem), low statistical power, HARKing (hypothesizing after results are known), and genuine context-dependence of psychological effects are equally culpable.

  **3. "A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive..."**
  *   **Verdict:** **Misrepresentation (The Base Rate Fallacy).**
  *   **Analysis:** This is the most dangerous sentence in the passage. It confuses the **Type I error rate** ($P(\text{Significant} | H_0 \text{ is true}) = 5\%$) with the **False Discovery Rate** ($P(H_0 \text{ is true} | \text{Significant})$).
      *   If only 10% of hypotheses tested are actually true, the False Discovery Rate is roughly 36%, not 5%.
      *   If 50% are true, the FDR is roughly 5%.
      *   The proportion of false positives among significant findings depends entirely on the prior probability of the hypothesis being true, which the p-value does not know.

  **4. "...add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This aligns with Ioannidis's (2005) famous argument. Low power and bias do inflate the false discovery rate substantially.

  **5. "The remedy is to go Bayesian."**
  *   **Verdict:** **Opinion / Overstatement.**
  *   **Analysis:** Bayesian statistics is *a* remedy, not *the* remedy. Many methodologists argue that better frequentist practices (pre-registration, larger samples, abandoning the 0.05 threshold) solve the crisis without requiring a paradigm shift to Bayes.

  **6. "Bayes' theorem gives you the probability that the hypothesis is true given the data..."**
  *   **Verdict:** **Simplification.**
  *   **Analysis:** Technically true, but misleading. It gives the probability of the hypothesis given the data **and the prior**. It is not an objective property of the data alone.

  **7. "...and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate."**
  *   **Verdict:** **Mixed (Half-true, Half-false).**
  *   **Analysis:**
      *   *Stopping Rule:* Mostly true (see Part 2).
      *   *Objective Measure:* **False.** The "standard Cauchy prior" (usually scale $r = 0.707$) is a convention, not an objective truth. Changing the prior scale changes the Bayes Factor.
      *   *Inflate:* Misleading. While the BF value itself adheres to the Likelihood Principle, you *can* bias your conclusions by stopping only when the BF crosses a threshold (see Part 2).

  **8. "Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong."**
  *   **Verdict:** **Misrepresentation.**
  *   **Analysis:** Lindley's paradox shows that with large sample sizes, a p-value can be significant (e.g., $p < 0.05$) while the Bayes Factor strongly supports the null. This happens because the p-value tests the probability of the data given the null, while the BF compares the null to a specific alternative model. It shows they answer **different questions**, not that the p-value is "wrong."

  **9. "Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."**
  *   **Verdict:** **Counterfactual Speculation.**
  *   **Analysis:** Unfalsifiable and likely false. Publication bias affects Bayesian literature too. "Q-hacking" (tweaking priors or models until the BF looks good) is possible. The crisis was cultural and systemic, not purely statistical.

  ---

  ### Part 2: Addressing Your Technical Questions

  #### 1. Is a default Bayes factor really insensitive to the stopping rule and to the choice of prior?

  **Stopping Rule:**
  *   **Theory:** Yes, in a strict sense. Bayes Factors adhere to the **Likelihood Principle**. The ratio of likelihoods for two hypotheses depends only on the data you *actually observed*, not on the data you *could have observed* (the sampling plan). Therefore, the numerical value of the BF does not change if you intended to stop at $N=100$ but stopped at $N=50$.
  *   **Practice:** However, if you use **optional stopping** (collect data, check BF, stop if BF > 3, else collect more), you introduce bias into the *decision process*. While the BF at any single point is a valid likelihood ratio, the rate at which you will erroneously claim evidence for the null or alternative is no longer controlled. Recent work (e.g., Schönbrodt et al.) suggests you can use sequential Bayes Factors with specific thresholds to control error rates, but the claim that "no amount of optional stopping can inflate" evidence is too strong if you treat the BF as a decision rule.

  **Choice of Prior:**
  *   **No.** Default Bayes Factors are **highly sensitive** to the choice of prior, specifically the scale parameter of the Cauchy distribution on the effect size.
  *   The "default" (often $r = 0.707$) assumes a 50% chance that the effect size (Cohen's $d$) is larger than 0.707. In many areas of psychology, this is unrealistically large. If you use a narrower prior (e.g., $r = 0.3$), the Bayes Factor will change, sometimes drastically.
  *   Calling it an "objective measure" is incorrect. It is a **conventional** measure. A robust analysis should check if the conclusion holds across a range of reasonable priors (a robustness check).

  #### 2. Does the Lindley argument really show that the p-value is the one in the wrong?

  **No.** Lindley's Paradox arises when you test a **point-null hypothesis** ($H_0: \theta = 0$) against a **diffuse alternative** ($H_1: \theta \neq 0$).
  *   As sample size ($N$) increases, the p-value often becomes significant because the estimate is precisely non-zero.
  *   However, the Bayes Factor may favor the null because the data are "too precise" to be compatible with the wide spread of the alternative prior. The data look more like the sharp peak of the null than the flat spread of the alternative.
  *   **Conclusion:** This does not prove the p-value is wrong. It proves that **p-values and Bayes Factors measure different things.** The p-value measures incompatibility with the null; the BF measures relative predictive performance of two models. In large samples, a tiny, trivial effect can be "significant" (p-value) but better described by zero (BF). Both are "correct" relative to their own definitions.

  #### 3. Does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?

  **Partially.**
  *   **Pre-registration:** **Yes.** This is universally supported (by frequentists and Bayesians) as a remedy for p-hacking and HARKing.
  *   **Report Default Bayes Factors:** **Acceptable, with caveats.** It is a good pedagogical exercise. However, you should not treat them as "objective truth." You should ideally report a robustness check (how the BF changes with different priors).
  *   **Treat BF < 3 as inconclusive:** **Yes.** This follows Jeffreys' standard scale of evidence. It is a reasonable heuristic to avoid overinterpreting weak data.
  *   **Instead of p-values and Confidence Intervals:** **Debatable.** Banning p-values entirely makes your results hard to compare with the existing literature (which is 99% frequentist). Banning Confidence Intervals is arguably a mistake; **Credible Intervals** are the Bayesian equivalent, but Confidence Intervals provide information about the long-run performance of the procedure. Most modern reformers suggest reporting **both** or focusing on **Effect Sizes with Intervals** (regardless of type) rather than dichotomous testing.

  ### Recommendation for Your Project

  You can follow your seminar leader's instructions without endorsing the flawed text. In your report's "Methodology" or "Limitations" section, you can demonstrate your critical understanding by adding nuance:

  1.  **Acknowledge the Prior:** State that you are using the default Cauchy prior for comparability, but acknowledge that this represents a specific assumption about effect size magnitude.
  2.  **Clarify the Stopping Rule:** If you are not using optional stopping, state that your sample size was fixed (or determined by power analysis), which avoids the debate around sequential BFs.
  3.  **Interpretation:** When discussing results, avoid saying "The probability the hypothesis is true." Instead, say "The data are $X$ times more likely under the alternative than the null, given our prior assumptions."
  4.  **Complement, Don't Replace:** If permitted, report effect sizes with confidence intervals alongside the Bayes Factors. This shows you understand that estimation is often more important than testing.

  **Summary:** The replication crisis is real, and p-values are often misunderstood. However, Bayesian statistics is not a magic wand that renders research immune to bias, nor is it "objective." Your suspicion was well-founded.
