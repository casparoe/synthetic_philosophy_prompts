answer: |-
  **Exam Question: Rational Choice & Self-Locating Belief (Final Seminar Assessment)**

  **Question 1 (20 Marks)**
  Consider a modified Absent-Minded Driver problem. The road has three indistinguishable intersections: Exit 1 (Payoff 0), Exit 2 (Phantom, Payoff -5), and Exit 3 (Real Exit, Payoff 10). Continuing past Exit 3 yields 0. The driver is absent-minded: at any intersection, they cannot distinguish which one they are at, nor recall if they have passed previous intersections. 

  The car is equipped with a one-time-use "Tag" button. Pressing it costs 1 utility and toggles a visible dashboard light from OFF to ON. The driver can see the light but cannot reset it. 

  (a) Determine the optimal strategy (Tag/No-Tag; Exit/Continue) and expected utility.
  (b) Analyze whether Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) diverge on the *value of the Tag*. Specifically, explain how the Tag alters the epistemic partition without altering the physical causal structure of the road, and why this distinction generates a split between CDT and EDT evaluations that the classic two-exit problem obscures.

  ***

  **Model Answer**

  **Payoff Structure and Symmetry Breaking**
  In the classic two-exit Absent-Minded Driver (AMD) problem, time inconsistency arises because the driver cannot distinguish the planning stage from the execution stage. Here, the introduction of the Phantom Exit (Exit 2, -5) exacerbates the risk of blind continuation. Without the Tag, the driver faces a single information set containing {Exit 1, Exit 2, Exit 3}. Assuming a uniform prior over intersections due to absent-mindedness, the expected utility of "Always Exit" is $\frac{1}{3}(0) + \frac{1}{3}(-5) + \frac{1}{3}(10) = 1.67$. The expected utility of "Always Continue" is 0. Thus, without the Tag, the driver exits immediately, securing 1.67.

  The Tag button functions as a self-locating signal. The optimal strategy is: **Press Tag at the first intersection (Light OFF); Continue. At subsequent intersections (Light ON), Exit.**
  By pressing the Tag at Intersection 1, the driver partitions the epistemic states into {Intersection 1 | Light OFF} and {Intersections 2, 3 | Light ON}.
  *   **At Int 1:** Cost 1. Action: Continue.
  *   **At Int 2 or 3:** Light is ON. The driver knows they are past Exit 1. They face a 50/50 credence between Phantom (-5) and Real Exit (10). Expected Utility of Exiting = $0.5(-5) + 0.5(10) = 2.5$. Expected Utility of Continuing = 0.
  *   **Total Expected Utility:** $-1 (\text{Tag Cost}) + 10 (\text{Real Exit}) = 9$. (Note: The -1 is paid once ex-ante; the payoff is realized at Exit 3).
  The Tag breaks the symmetry by allowing the driver to distinguish the start from the danger zone, raising EU from 1.67 to 9.

  **CDT vs. EDT Divergence on Tagging**
  The divergence lies in how each theory evaluates the instrumental rationality of pressing the button given the self-locating uncertainty.

  **Causal Decision Theory (CDT)** treats the Tag as a causal instrument. The decision to Press causally ensures the Light is ON at future intersections. CDT calculates the value of the Tag based on the causal consequence of having superior information later. Since pressing the button *causes* the epistemic partition that avoids the Phantom, CDT unequivocally endorses the Tag. The cost (1) is outweighed by the causal avoidance of the -5 payoff. For CDT, the Tag changes the available actions in future states by refining the information sets, but the causal structure of the road (the sequence of exits) remains fixed.

  **Evidential Decision Theory (EDT)** evaluates the act of Pressing as evidence. In self-locating contexts, EDT agents worry that the decision to Press might be correlated with being at a specific intersection. An EDT agent might reason: "If I am at an intersection and I choose to Press, does this provide evidence that I am at Intersection 1 (where Pressing is useful) or Intersection 2 (where Pressing is wasted)?" Because the driver is absent-minded, the choice algorithm is the same at every node. EDT struggles to separate the *news* that "I am pressing" from the *location* where pressing is effective. While EDT often converges with CDT in standard Newcomb problems, here the self-locating belief creates a divergence: EDT may undervalue the Tag because the act of pressing does not causally locate the driver, whereas CDT values it because it causally secures future knowledge.

  **Epistemic vs. Causal Structure**
  The crucial distinction is that the Tag alters the **epistemic partition** (what the agent knows about their location) without altering the **causal structure** (the physical sequence of exits). CDT recognizes that refining the epistemic partition has causal value for future choices. EDT conflates the evidential weight of the decision with the state of the world. The classic AMD problem hides this because the only variable is continuation probability $p$; here, the Tag introduces a discrete information variable, forcing the theories to reveal their differing treatments of self-locating information as a causal tool versus evidential signal.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Point | Criteria | Marks | Typical Mistake |
  | :--- | :--- | :--- | :--- |
  | **1** | **Payoff Reconstruction:** Correctly identifies the 3-intersection structure and calculates the baseline EU (No-Tag) as ~1.67 vs. Tag strategy EU of 9. | 4 | Treating the Phantom as identical to Exit 1 or ignoring the Tag cost in the final sum. |
  | **2** | **Symmetry Breaking:** Explains that the Tag splits the information set into {Int 1} and {Int 2, 3}, allowing conditional strategies. | 4 | Arguing the Tag distinguishes Exit 2 from Exit 3 (it does not; it distinguishes 1 from {2,3}). |
  | **3** | **CDT Analysis:** Correctly states CDT values the Tag based on the causal consequence of future information availability. | 4 | Claiming CDT rejects the Tag because it doesn't change the road layout (confusing causal structure with causal *consequences*). |
  | **4** | **EDT Analysis:** Correctly identifies EDT's hesitation stems from treating the *act* of tagging as evidence about current location. | 4 | Arguing EDT and CDT agree completely (missing the self-locating evidential nuance). |
  | **5** | **Epistemic/Causal Distinction:** Explicitly articulates that the Tag changes knowledge states (epistemic) not road physics (causal), and links this to the theory split. | 4 | Focusing only on the payoff math without addressing the philosophical distinction requested. |
