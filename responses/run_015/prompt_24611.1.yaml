  The obvious reply is that the betting framework isn't an external addition but operationalizes credence. On this view, to have a credence *just is* to be disposed to bet at certain odds; therefore, the commitment to betting is built into the concept itself.

  This operationalism, however, is overly restrictive. It conflates the *measurement* of belief with its *nature*. Agents possess degrees of belief that guide action in non-monetary ways—such as planning, assertion, or hypothesis selection—without being reducible to betting quotients. If credence is richer than mere betting disposition, the Dutch Book vulnerability is merely a contingent risk of engaging in specific markets, not a constitutive flaw of the belief state. Consequently, the probability axioms remain norms for gamblers, not necessarily for rational thinkers.
