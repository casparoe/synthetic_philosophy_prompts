answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being [Bride]'s best friend. For those who do know me, you know why I'm holding this glass with slightly shaking hands.

  Standing here, I'm acutely aware of the split in this room. On one side, we have the family, who love [Bride] and [Groom] deeply, and might have heard rumors that Bertrand Russell was a scandalous atheist who wanted to burn down the institution of marriage. On the other side, we have the philosophers, who are currently scanning my face for any sign of hermeneutical error.

  So, let's clear the air. [Bride] spent years writing her dissertation on Russell's *Marriage and Morals*. And contrary to the gossip, Russell wasn't against marriage. He was against the version of marriage that treats people like property. He drew a sharp line between marriage as an economic contract—based on inheritance, social control, and ownership—and marriage as what he called a "companionate partnership." That's a fancy way of saying a relationship built on equality, honest feeling, and genuine choice.

  And looking at [Bride] and [Groom], I think you'll agree they've lived out the latter for quite some time.

  They have been together for eight years. They have built a life, a home, and a partnership long before today. In many ways, the wedding we are celebrating tonight is the government finally catching up to what everyone in this room already knows. Yes, the visa paperwork was the catalyst for the legal ceremony, but let's be honest: if bureaucracy hadn't knocked on the door, they still would be standing here eventually. Because the legal contract isn't what created their commitment; it's just the receipt for what they've already purchased.

  Now, Russell had some specific thoughts on jealousy. He argued that jealousy is usually a product of an ownership mentality, not love. He believed that when we treat a partner as something we possess, we fear losing our property. But when we treat a partner as a free equal, love becomes a choice you renew every day, not a cage you lock them into.

  I bring this up because I've watched these two for nearly a decade. I have never seen a relationship so secure in itself. They don't hold onto each other out of fear, or out of a sense of duty imposed by a license. They choose each other. They have been open about their pasts, honest about their lives, and transparent about their future. That lack of possessiveness isn't a lack of commitment; it's the highest form of it. It means [Groom] loves [Bride] for who she is, not for what role she fills. And [Bride] loves [Groom] not because he belongs to her, but because he walks beside her.

  For the family here tonight: I know you want to know that they take this seriously. I promise you, there is no one who takes commitment more seriously than two people who have already done the hard work of eight years of partnership without needing a law to tell them to stay. They aren't starting a marriage today; they are formalizing one.

  And for the philosophers: I promise I didn't reduce the distinction between institutional coercion and voluntary association to a punchline. Mostly.

  So, when we raise our glasses, we aren't just toasting a legal status change. We are toasting the fact that in a world that often treats relationships like transactions, these two have built something real. They have built a companionship that doesn't need the threat of loss to feel secure.

  [Bride] and [Groom], you have navigated the bureaucracy, you have navigated the philosophy, and you have navigated eight years of real life. May your legal contract be boring, may your partnership be thrilling, and may your love always remain a choice, never a claim.

  To [Bride] and [Groom]!
