  ### The Dilemma of the Critical Level: Continuity, Impartiality, and the Variant Repugnant Conclusion

  Population axiology seeks to determine which outcomes are better than others when the number of people who exist varies between them. A prominent candidate for such a theory is the Critical-Level View (CLU). According to CLU, the overall value of a world is determined by summing, across all people who ever live, each person's lifetime wellbeing minus a fixed positive critical level ($c$). A life contributes positively to the value of the world only if its wellbeing exceeds $c$. This view is often adopted to avoid the "Repugnant Conclusion"—the implication that a world with a vast population of lives barely worth living is better than a world with a smaller population of excellent lives.

  However, by analyzing a specific sequence of worlds under the constraints of **impartiality** and **continuity**, we can demonstrate that CLU faces a severe dilemma. It must either accept a "Variant Repugnant Conclusion" (where a world of mediocre lives beats a world of excellent lives) or posit an implausible discontinuity in moral value at the critical threshold.

  #### 1. Constraints: Impartiality and Continuity

  To evaluate CLU, we must first establish two constraints widely regarded as necessary for an acceptable population axiology.

  **Impartiality across persons** requires that the contribution of a life to the overall value of a world depends only on the quality of that life, not on who lives it or when they live. If two people have identical lifetime wellbeing, they contribute identical value to the world. Consequently, the total value of a world is the sum of the contributions of all individuals within it.

  **Continuity with respect to small changes** requires that small differences in individual wellbeing should not produce massive, discontinuous jumps in the overall moral value of a world. If World A differs from World B only by a tiny increase in one person's wellbeing, World A should not be ranked lexically superior or inferior to World B in a way that defies the magnitude of the change. Moral value should track the underlying phenomenological reality smoothly.

  #### 2. The Stipulated Sequence

  Consider a sequence of fifty worlds, $W_1$ through $W_{50}$, governed by the following stipulations:
  *   **$W_1$:** Contains 2,000 people, each with a lifetime wellbeing of 100.
  *   **Progression:** Each subsequent world $W_{n+1}$ doubles the population of $W_n$ and reduces the average lifetime wellbeing by 2 units.
  *   **$W_{50}$:** Contains an enormous population ($2,000 \times 2^{49}$) with a lifetime wellbeing of 2. These lives are stipulated to be barely worth living.
  *   **Critical Level ($c$):** For the sake of illustration, we assume a critical level of 20.

  Under CLU, the value of a world $V(W)$ is calculated as $N \times (W_{avg} - c)$, where $N$ is the population and $W_{avg}$ is the average wellbeing.

  #### 3. The Upward Pressure: The Variant Repugnant Conclusion

  Let us examine the value of the worlds in the sequence that remain *above* the critical level. A life contributes positive value as long as wellbeing is greater than 20. In our sequence, wellbeing drops by 2 units per step. Thus, wellbeing remains above the critical level from $W_1$ (100) down to $W_{40}$ (22). At $W_{41}$, wellbeing is exactly 20, contributing zero value. At $W_{42}$ and below, wellbeing is below 20, contributing negative value.

  Consider the comparison between $W_1$ and $W_{40}$.
  *   **$W_1$:** 2,000 people $\times$ (100 - 20) = 2,000 $\times$ 80 = **160,000 value units**.
  *   **$W_{40}$:** The population has doubled 39 times. $2,000 \times 2^{39}$ is approximately 1.1 trillion people. The wellbeing is 22. The value per person is (22 - 20) = 2.
      Total Value = 1.1 trillion $\times$ 2 = **2.2 trillion value units**.

  According to the impartial aggregation required by CLU, $W_{40}$ is vastly better than $W_1$.

  This result constitutes a **Variant Repugnant Conclusion**. While the standard Repugnant Conclusion compares excellent lives to lives *barely above zero* (like $W_{50}$), this variant compares excellent lives (100) to lives of merely mediocre quality (22). The intuition that a world of 2,000 people living magnificent lives is better than a world of trillions living mediocre, cramped lives is strong. Yet, CLU implies the latter is better because the sheer quantity of "positive" value contributions (however small per person) outweighs the quality of the former.

  #### 4. The Dilemma: Variant RC or Discontinuity?

  The proponent of CLU might accept this result, arguing that quantity can indeed trump quality provided lives are above the critical threshold. However, if they wish to avoid this Variant Repugnant Conclusion—that is, if they wish to maintain that $W_1$ is better than $W_{40}$—they encounter a logical trap grounded in the constraints of continuity and the structure of the critical level.

  To deny that $W_{40}$ is better than $W_1$, the theorist must claim that the massive number of people at wellbeing level 22 does not generate more value than the small number at level 100. Since Impartiality requires summing contributions, the only way to block this aggregation is to argue that the value contribution of a life at level 22 is negligible—effectively zero—despite being technically positive.

  However, recall that CLU posits a critical level of 20 to avoid the *Standard* Repugnant Conclusion regarding $W_{50}$ (wellbeing 2). To ensure $W_{50}$ is worse than $W_1$, the theory must assert that lives below level 20 contribute *negative* value.

  This forces a choice:
  1.  **Accept the Variant RC:** Admit that $W_{40}$ (and potentially other worlds in the sequence above $c$) is better than $W_1$.
  2.  **Posit a Discontinuity:** Claim that the moral value of a life drops precipitously as it approaches the critical level from above, such that lives at 22 contribute almost nothing, while lives just below 20 contribute negatively.

  The second option requires positing a **sharp evaluative break** once wellbeing falls just below the critical level. If lives at 22 contribute enough to theoretically aggregate but are denied that status to avoid the RC, while lives at 19 contribute negatively, there must be a radical shift in moral status between 22 and 19. If the theorist insists that the value function must flatten near 20 to prevent the aggregation from overpowering $W_1$, but then drop below zero immediately after 20 to prevent the Standard RC, the slope of the value function becomes infinitely steep at the threshold.

  #### 5. The Implausibility of the Discontinuity

  Such a discontinuity is philosophically indefensible under the constraint of Continuity. The phenomenological difference between a life at wellbeing level 21 and a life at wellbeing level 19 is stipulated to be tiny. In the sequence, each step represents a reduction of only 2 units. There is no qualitative chasm between these lives; they are neighbors on a smooth spectrum of wellbeing.

  To claim that a life at 21 adds positive value to the world (enough to exist, yet supposedly not enough to aggregate against $W_1$ without creating a paradox) while a life at 19 makes the world *worse* (negative value) implies that the moral significance of existence hinges on a razor-thin margin of wellbeing. If the difference in value contribution is massive (from "negligible positive" to "significant negative") while the difference in lived experience is minor, the theory violates the requirement that moral value track wellbeing continuously. It treats the critical level not as a heuristic marker, but as a metaphysical cliff-edge where the moral status of a person shifts from "asset" to "liability" based on a trivial difference in happiness.

  Therefore, to maintain Continuity, one must accept that the value contribution scales smoothly. If it scales smoothly and remains positive above $c$, the mathematical reality of the sequence (exponential population growth vs. linear wellbeing loss) ensures that total value will eventually surpass $W_1$. Thus, maintaining Continuity forces the acceptance of the Variant Repugnant Conclusion.

  #### 6. Reply to the "Threshold for Creation" Objection

  A defender of CLU might object: *The critical level represents a threshold for whether a life is worth creating, not necessarily a continuous measure of value. It is morally significant whether a life is worth starting, even if the phenomenological difference is minor. Therefore, a discontinuity in moral status at the threshold is justified.*

  This objection conflates the *decision to create* a person with the *value contribution* of that person once they exist. Even if we grant that there is a threshold below which we should not create people (a deontological constraint on creation), this does not justify a discontinuity in the *axiological* ranking of worlds.

  In the sequence $W_1$ to $W_{50}$, we are comparing whole worlds where these people *already exist*. The question is not whether we should create the people in $W_{40}$, but whether the world containing them is better than $W_1$. If the lives in $W_{40}$ are worth living (above $c$), they possess positive wellbeing. To say their existence makes the world better than $W_1$ (Variant RC) is one thing; to say their value contribution effectively vanishes to avoid that conclusion, only to turn negative immediately below $c$, is to manipulate the value function to fit a preconceived conclusion.

  If the phenomenological difference is minor, the contribution to the overall good should be proportionally minor, not discontinuously severed. A theory that claims a life at 20.1 is a moral asset and a life at 19.9 is a moral liability, while simultaneously trying to block the aggregation of the 20.1 lives to avoid the Repugnant Conclusion, is engaging in special pleading. It relies on the threshold to block the Standard RC ($W_{50}$) but must ignore the implications of that same threshold's aggregation logic to block the Variant RC ($W_{40}$).

  #### Conclusion

  The stipulated sequence demonstrates that an impartial Critical-Level View cannot simultaneously satisfy the constraints of Continuity and avoid the Repugnant Conclusion in all its forms. To avoid the Standard Repugnant Conclusion ($W_{50} > W_1$), CLU relies on the critical level to render low-quality lives negative in value. However, above that critical level, the view remains vulnerable to a Variant Repugnant Conclusion ($W_{40} > W_1$) due to the aggregation of positive value across a massive population.

  Avoiding this variant conclusion requires dampening the value of lives near the critical threshold. But since those same lives must switch from positive to negative value immediately below the threshold to avoid the Standard RC, this dampening creates a sharp, implausible discontinuity in moral value. Given that the underlying differences in wellbeing are tiny, such a discontinuity violates the requirement of Continuity. Thus, the impartial critical-level theorist is forced to choose: accept that a world of mediocre lives is better than a world of excellent lives, or defend a moral cliff-edge that has no basis in the phenomenological reality of the lives involved.
