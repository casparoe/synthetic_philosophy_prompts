      *   *Tone:* Keep it academic, rigorous, and philosophical but grounded in policy reality. Avoid jargon where possible, but use precise philosophical terms (commensurability, ontology, deontology).

  7.  **Final Review against the Prompt:**
      *   Reconstruct implicit theory? Yes.
