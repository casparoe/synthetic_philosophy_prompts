prompt: |-
  Im writing a novel where a character realizes shes inside someone elses narrative, and I got weirdly obsessed with Berkeley's master argument — the bit where he claims you cant even conceive of a tree in a quad with nobody around to percieve it, since the moment you try youre already the perciver. I want you to restate that argument using only fiction-craft vocabulary I actually use: diegetic levels, focaliztion, implied author, whether a prop exsists in the world of the story if no focalizer notices it, etc. Be disciplined: map out who is the player, what counts as the evidence, and where the analogy breaks — for instance, does Berkeley's distinction between relative and absolute conception have any parallel in how we talk about off-page events? Tell me what survives cleanly, what I have to distort to fit, and what has no expression at all in narrative theory. Then say whether the leftover residue means Berkeley is saying something fiction mechanics cant capture, or whether fiction mechanics reveal hes smuggling in an assumption. Also say what would change your mind here: which argument about narrative ontology or which reading of the master argument would flip your verdict on whether the translation works? Keep it casual — I wrote this between drafts and my coffee went cold. And please, no bibliographies, I dont have them handy.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Restate George Berkeley's "Master Argument" (esse est percipi - to be is to be perceived) using fiction-craft vocabulary (diegetic levels, focalization, implied author, etc.).
      *   **Context:** The user is writing a novel about a character realizing they are inside someone else's narrative. They are obsessed with Berkeley's argument about conceiving of an unperceived tree.
      *   **Constraints:**
