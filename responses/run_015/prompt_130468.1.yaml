          *   Evaluate what survives cleanly, what needs distortion, and what has no expression in narrative theory.
          *   Conclude on whether the residue means Berkeley says something fiction can't capture OR if fiction reveals Berkeley is smuggling assumptions.
          *   Specify what would change my mind (which argument/reading would flip the verdict).
          *   Tone: Casual (user wrote this between drafts, coffee is cold).
          *   No bibliographies.

  2.  **Deconstruct Berkeley's Master Argument:**
      *   *Core Claim:* You cannot conceive of an object existing unconceived.
      *   *Reasoning:* The moment you try to conceive of the object (e.g., a tree in a quad), you are conceiving it. Therefore, it is conceived. You cannot step outside your own mind to verify its existence independent of your mind.
      *   *Key Distinction:* Relative conception (thinking of something as unperceived by *others*) vs. Absolute conception (thinking of something as unperceived by *anyone*, including oneself). Berkeley says the latter is impossible.
      *   *Goal:* Prove idealism (matter doesn't exist independently of mind).

  3.  **Map to Narrative Theory:**
      *   *Berkeley's Mind:* The Reader? The Narrator? The Implied Author?
      *   *The Object (Tree):* A story element (prop, character, event).
      *   *Perception:* Focalization / Narration.
      *   *Existence:* Diegetic existence.
      *   *The Argument:* You cannot write/think of a story element that isn't focalized/narrated.
      *   *The Twist:* The character realizing they are in a narrative mirrors the mind realizing it cannot escape perception.

  4.  **Drafting the Restatement (Fiction-Craft Vocabulary):**
      *   *Premise:* Can a prop exist in the diegesis if no focalizer notices it?
      *   *Berkeley's Move:* Try to imagine a scene where a prop exists unobserved.
      *   *Narrative Counter:* The moment you write it, it's observed by the narrator or implied author. Even "omniscient" is a focalizing position.
      *   *Terminology:* Diegetic level, focalization, extradiagetic narrator, implied author, off-page space.

  5.  **Analyzing the Analogy (Discipline Check):**
      *   *Who is the player?* The Writer/Reader (trying to conceive the unobserved).
      *   *What is the evidence?* The text itself (or the mental image of the text).
      *   *Where does it break?* In fiction, we *do* accept off-page events exist. We assume characters have lives when not on screen. Berkeley denies the external world exists when not perceived.
      *   *Relative vs. Absolute:* Relative = Unperceived by characters (easy). Absolute = Unperceived by Narrator/Reader (harder).
      *   *Survival:* The structural limitation survives (you can't show the unshown).
      *   *Distortion:* Fiction relies on the *implication* of existence beyond the text. Berkeley denies implication without perception.
      *   *No Expression:* Qualia? The actual "stuff" of reality vs. the "stuff" of description.

  6.  **Evaluating the Residue:**
      *   Does fiction mechanics reveal Berkeley is smuggling? Yes. He smuggles "conception" as equivalent to "existence." In fiction, "narration" is not equivalent to "diegetic existence." We believe Hamlet exists even when he's off-stage.
      *   Or does Berkeley say something fiction can't capture? Maybe the ontological weight of *reality* vs. *representation*.

  7.  **Determining What Would Change My Mind:**
      *   If there's a strong argument for "unreliable narration" implying true ontological gaps.
      *   If there's a reading of Berkeley that isn't about epistemology but about language games.
      *   If narrative theory shifts to "reader-response" where existence *is* reception.

  8.  **Tone Check:**
      *   Casual, empathetic ("coffee went cold"), no academic stiff-upper-lip.
      *   No citations.

  9.  **Step-by-Step Construction:**

      *   *Intro:* Acknowledge the vibe (cold coffee, draft mode). Validate the obsession (it's a good one).
      *   *The Restatement:* Translate "Tree in the Quad" to "Prop in the Diegesis."
      *   *The Mapping:*
          *   Mind -> Narrator/Reader consciousness.
          *   Object -> Diegetic element.
          *   Perception -> Focalization.
      *   *The Break:* Off-page events vs. Unconceived objects. Fiction *requires* the assumption of off-page existence to work (verisimilitude). Berkeley *denies* off-mind existence.
      *   *Relative/Absolute:* Relative = Unfocalized by characters. Absolute = Unfocalized by Narrator.
      *   *The Verdict:* Fiction mechanics show Berkeley is smuggling "presence" into "existence." In stories, things exist without being present (Chekhov's gun hanging in the wings).
      *   *Mind Changer:* If you argue that "off-page" is just a rhetorical trick and nothing *actually* exists in the story until read (Radical Reader-Response).

  10. **Refining the Argument (Self-Correction during drafting):**
