      - If no → Leaf: **"No method here actually works, you're managing risk instead"**

  ### Leaves

  | Name | Awkward Commitment | Cheapest Experiment |
  | :--- | :--- | :--- |
  | **Formal-spec-and-verifier** | The spec perfectly matches human intent. | Fuzz test the spec against natural language requirements. |
  | **Capability restriction** | The performance hit from not automating is acceptable. | Measure productivity loss when blocking the task. |
  | **Scale RLHF** | The reward gap won't widen as capabilities grow. | Train on easy tasks, test generalization on hard ones. |
  | **Comparative** | Ranking two wrong answers reliably identifies the less wrong one. | Rank known-bad vs. known-worse outputs on solvable tasks. |
  | **Incentive/market** | Economic penalties for lying outweigh the benefits. | Simulate payoff structures for adversarial agents. |
  | **Recursive reward modelling** | The reward model generalizes beyond the expert-checked subset. | Train on 10% expert data, verify on held-out 10%. |
  | **Weak-to-strong** | A weaker supervisor can reliably guide a stronger model. | Have GPT-3 supervise GPT-4 on tasks where GPT-4 is known to be better. |
  | **Iterated amplification** | Breaking the task down doesn't lose critical context. | Verify chain-of-thought steps on problems with known solutions. |
  | **Debate** | The truth wins arguments more often than plausible lies. | Hide truth from judge, see if debate reveals it. |
  | **Unnamed (Mech Interp)** | Internal activations map cleanly to human concepts. | Probe for known lies in a controlled model. |
  | **Risk management** | Safety is probabilistic, not guaranteed. | Red team until budget runs out, then deploy. |

  ### Flags & Notes

  **Indistinguishable Leaves:**
  *   **Recursive Reward Modelling vs. Comparative:** Both often rely on training a reward model on human preferences. The split here is whether you have *absolute* expert verification (RRM) or only *relative* judgments (Comparative), but in practice, RRM often uses comparative data.
  *   **Iterated Amplification vs. Debate:** Both rely on task decomposition to enable weak supervision. Amplification trains the model to do the steps; Debate uses inference-time argumentation. If you can train, Amplification is usually preferred, making Debate a fallback for frozen models.

  **Unoccupied Combinations:**
  *   **Expert Access + No Training + No Decomposition:** This leads to Weak-to-Strong, but if you can't decompose or train, you effectively have no leverage over the model beyond hoping the expert signal generalizes (covered by Weak-to-Strong's awkward commitment).
  *   **No Ground Truth + Machine Spec:** Contradictory. If you have a machine spec, you have ground truth by definition.

