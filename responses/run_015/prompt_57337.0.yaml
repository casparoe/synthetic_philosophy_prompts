answer: |-
  Here are the predictions, the underlying rules, and the test case to split them.

  ### Predictions

  **Case 1: The One-Shot Cycle**
  **Verdict:** Irrational.
  **Confidence:** 85%
  **Reasoning:** Marta called the coworker irrational despite him never betting. For her, the error is in the internal state (the "map"), not just the territory. The fact that the world doesn't offer a pump is luck, not rationality. She views incoherence as a disposition to lose, not just the act of losing.

  **Case 2: The Willpower Brother**
  **Verdict:** NOT Irrational.
  **Confidence:** 75%
  **Reasoning:** She praised the doomscroller for "patching the exploit." Willpower is an internal patch. Since the brother ends the year satisfied and without loss, he successfully enforced coherence over time. The conflict existed, but the resolution was successful. She cares about the net outcome of the self over time, not the momentary urge.

  **Case 3: The Stateless Agent**
  **Verdict:** Irrational (but "low severity").
  **Confidence:** 90%
  **Reasoning:** This is the apartment lease case without the fees. She sees the logic error immediately. Even if stateless now, coupling this agent with any memory or retry logic later creates a pump. She'll call it a bug because it violates the structural rules of decision-making, regardless of current exploitability. It's "spaghetti code" in preference space.

  ### The Candidate Rules

  Marta's track record reveals a tension between two definitions of rationality:

  **Rule 1: Structural Coherence (The Map)**
  Rationality is about internal consistency. Your preferences must be transitive; your probabilities must sum to 1. If they don't, you are broken, regardless of whether anyone exploits you. This fits the coworker (bad probabilities) and the apartment case (bad preferences). The money pump is just a proof of error, not the error itself.

  **Rule 2: Pragmatic Coherence (The Territory)**
  Rationality is about avoiding exploitable losses and achieving your goals. If you can't be pumped (because you're a hermit, or you precommit), you aren't irrational. This fits the doomscroller (patched the leak) and the risk-aversion case (utility curve protects wealth). This rule explains her hesitation on the coworker: "if nobody can take money, does it matter?"

  **The Conflict:**
  Rule 1 says the coworker is irrational because his math is wrong. Rule 2 suggests he might be fine because he never bets. Marta voted Rule 1 but worried about Rule 2. This suggests she is a **Structuralist who accepts Pragmatic mitigations.** She believes the bug exists in the code, but if you sandbox the code (precommitment, no betting), the bug doesn't crash the system.

  ### Which Rule to Bet On

  I would bet on **Rule 1 (Structural Coherence)** as her primary driver, with Rule 2 acting as a modifier for severity.

  She consistently labels the *structure* as irrational first (coworker, apartments, brother), then adjusts based on outcomes. The doomscroller wasn't rational because she liked blockers; she was rational because the blocker fixed the structural inconsistency between her short-term and long-term selves. Marta's core claim is that coherence arguments prove you *are* an expected utility maximizer or you are vulnerable. She cares about the vulnerability existing, not just being triggered.

  ### The Killer Case

  To force a split between Rule 1 (Structure) and Rule 2 (Pragmatics), you need a case where the structure is broken, but exploitation is physically impossible, not just unlikely.

  **Send her this:**
  "Imagine a hermit who lives alone on an island forever. He has cyclic preferences over coconuts (A>B>C>A). He picks one, eats it, and dies. There is no trade, no other humans, and no future choices. Is he irrational?"

  **Why this splits them:**
  *   **Rule 1 (Structural):** Yes, irrational. His preference engine is broken, even if no one is there to see it. The math is wrong.
  *   **Rule 2 (Pragmatic):** No, rational. No money can be taken. No goals are thwarted. He got a coconut he wanted.

  If she says **Irrational**, she is a pure coherence theorist (like the VNM theorem implies). If she says **Rational**, she admits the money pump is the *source* of the normativity, not just the proof. Given her coworker hesitation, this is the only case that might flip her.
