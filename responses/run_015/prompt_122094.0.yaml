prompt: |-
  hey — I sit on the Metro Community Trust Allocation Panel and we're facing a decision by next Thursday. The staff just circulated a report (they call it the Thick Trust Project) arguing that interfaith coalitions generate measurably higher 'pro-social capital' than secular NGOs, and that secular institutions suffer from a kind of slow value drift — norms decay over time without some transcendent anchoring mechanism. Based on this, they're proposing we redirect about thirty percent of our community-building grants away from secular programs and into faith-based partnerships.

  Our chair wants a concrete recommendation memo — approve, reject, or approve with conditions — with a clear action timeline, and she specifically asked that we treat the strongest counter-argument seriously rather than just waving away the data. I need you to draft this memo for circulation, and I need to recieve it before the meeting.

  Before you write, please act as both a senior public-ethics consultant and a philosopher of religion. Take a moment to brainstorm: what are the different senses of 'more moral' at play here? Behavioral compliance? Internal virtue? Sustained social trust? Resistance to value drift? And can secular societies sustain cooperation through mechanisms other than religious belief — say, institutional transparency, reciprocal accountability, or shared civic ritual?

  Then draft the memo. It should recommend a specific course of action with a timeframe — for example, reject the immediate redirection but mandate a six-month comparative audit — and it should include an honest treatment of the best reason to go the other way (probably that religious networks do produce durable, hard-to-replicate cooperative structures). Don't treat 'trust' as univocal; flag where the staff report conflates survey responses with actual cooperative behavior. There's also an occurence of ambiguity in how they define 'secular decay' that the memo should clarify.

  Please don't include any bibliography or reading list — I'm working offline and the board needs actionable reasoning, not citations. Start with a brief outline of your reasoning steps, then the memo itself. Think carefully and step by step, and avoid generic platitudes about 'all perspectives are valid.'
