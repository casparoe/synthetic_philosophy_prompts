      *   *Defeater 2 (Severe):* The "Escrow" Status (Belief vs. Acceptance).*
          *   Why: If I don't treat it as knowledge, am I believing it? Cohen's distinction between *belief* (involuntary, truth-aimed) and *acceptance* (voluntary, policy-aimed).
          *   Risk: If it's just acceptance, James isn't needed. If it's belief, Clifford applies.
