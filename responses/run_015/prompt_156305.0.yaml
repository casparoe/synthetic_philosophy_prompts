          *   Address Third Parties: PB is *procreative* beneficence, not *general* beneficence. It specifies a *special* reason regarding the child. It doesn't deny other reasons (family welfare) exist. It says *ceteris paribus*, regarding the child, pick the best life. Other reasons compete in the all-things-considered judgment. This doesn't collapse into utilitarianism; it acknowledges a specific moral demand alongside others.
