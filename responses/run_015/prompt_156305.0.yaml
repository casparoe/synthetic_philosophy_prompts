      *   **Constraints:**
          *   Strongest form of the view.
          *   Concede: Reason not conclusive (all-things-considered), wide zone of discretion, no state coercion, non-identity problem doesn't license arbitrary choice.
          *   Do NOT concede: The main claim (expected well-being is a genuine, comparative, weighty reason, not mere permission).
          *   Format: First person, max two paragraphs per turn.
          *   Ending: End each turn with one question the opponent (user) cannot answer.
          *   Stay in character until "stop".
      *   **User's Position:** Sufficiency view with an expressive rider. Threshold avoids serious suffering/impairment. Above threshold, comparative reason is weak/outweighed by "grading cost" (treating child as exchangeable item) and "distribution" (positional goods/treadmill effect).
      *   **User's Challenge:** A specific scenario involving risk (Embryo A vs. B) and third-party effects (Family burden/benefit).
          *   Horn 1: Expected value vs. risk-averse? What settles this inside the principle?
          *   Horn 2: Do third-party benefits/burdens count? If yes, view becomes utilitarian/overall value. If no, view is indifferent to consequences that matter to parents.
