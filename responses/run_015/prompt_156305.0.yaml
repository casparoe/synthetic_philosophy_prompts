      *   *Risk:* A has higher expected well-being but higher downside risk. B is safer but lower expectation. PB needs to explain how to handle risk. Standard decision theory usually says maximize expected utility, but morality might require risk-aversion regarding severe harm.
      *   *Third Parties:* A helps family, C strains least. PB is supposed to be *child-centred*. If PB includes family welfare, it looks like general utilitarianism. If it excludes family welfare, it looks cold/indifferent to relevant moral factors.
      *   *Underlying Weakness to Exploit:* The user's sufficiency threshold is arbitrary (supervisor's comment). Why is "decent" enough? Why does the comparative reason vanish above the threshold?

