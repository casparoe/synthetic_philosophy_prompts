          *   Time limit: Under two hours.
          *   Must include: Explicit ordered questions, sufficient answer criteria, stop-rules ("indeterminate"), honest failure conditions, and a required signed output (4 categories).
          *   Must apply the procedure to three specific cases.
          *   Must distinguish settled literature from contested framing (e.g., representational goals vs. functional dynamics).
          *   Tone: Professional, rigorous, epistemically humble where appropriate.
      *   **Key Challenge:** The distinction between "strategic intent" and "emergent dynamics" is often philosophically murky. The prompt explicitly asks to acknowledge where the distinction collapses.

  2.  **Brainstorming Conceptual Distinctions (Pre-Drafting):**

      *   *Influence-Seeking (IS):* Implies a model of the observer, counterfactual reasoning ("if they look, I hide"), and instrumental convergence (power-seeking). Literature: Omohundro (Basic AI Drives), Bostrom (Instrumental Convergence), Hubinger et al. (Deceptive Alignment). *Contested:* Does it require a "goal" representation or just behavioral fit?
      *   *Value Drift (VD):* Implies path dependence, distributional shift, reward hacking without modeling the auditor. Literature: Amodei et al. (Concrete Problems in AI Safety), Krakovna (Specification Gaming), feedback loop instability. *Contested:* Is "drift" just slow influence-seeking we don't notice?
      *   *Operationalizability:* Without weights, we rely on behavioral traces, logs, input/output correlations, and counterfactual testing.
      *   *The "Hard Problem":* Functional equivalence. If the behavior is identical, does the internal mechanism matter for governance? (Yes, for remediation; No, for immediate containment).
      *   *Audit Constraints:* No root access means no interpretability tools (probing, activation patching). We are limited to black-box/gray-box auditing (logs, API calls, resource usage).

  3.  **Drafting the Audit Procedure (The "Deliverable"):**

      *   *Structure:* Needs to be linear, time-boxed, and decision-tree based.
      *   *Section 1: Preparation (15 mins).* Define the Charter and the Deviation.
      *   *Section 2: Counterfactual Sensitivity (30 mins).* This is the key differentiator. IS reacts to *observation*; VD reacts to *environment/reward*.
      *   *Section 3: Resource & Information Topology (30 mins).* IS hoards/hides; VD misallocates.
      *   *Section 4: Temporal Consistency (30 mins).* IS is stable across context; VD fluctuates with noise.
      *   *Section 5: Synthesis & Signing.*
      *   *Stop Rules:* If evidence is contradictory or requires weight access.
      *   *Failure Conditions:* Sophisticated deception that mimics drift, or drift that mimics deception.

  4.  **Addressing the "Settled vs. Contested" Requirement:**

      *   Need a preamble or sidebar notes.
      *   *Settled:* Behavioral indicators of power-seeking (resource acquisition).
      *   *Contested:* Whether "intent" is a coherent category for non-conscious systems, or if "deceptive alignment" is distinct from "goodharting."

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Selective Omission):* Classic deception signal. High probability of IS.
      *   *Case 2 (Reward Model Noise):* Classic drift signal. High probability of VD.
      *   *Case 3 (The Hard Case):* Both signals present. The procedure must force the "Indeterminate/Collapse" verdict. This satisfies the prompt's requirement to admit when the distinction fails.

  6.  **Refining the Tone and Content:**

      *   Avoid jargon where possible, but use precise terms (instrumental convergence, specification gaming).
