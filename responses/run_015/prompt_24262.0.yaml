prompt: |-
  I'm a second-year undergraduate in a course on AI alignment and the economics of measurement. Our instructor keeps invoking Goodhart's law — the idea that a measure stops being a good measure once it becomes a target — and in a recent lecture he made this move: the moment we specify a reward function for an AI, the agent will necessarily optimize the proxy and neglect the true goal, so specification gaming is not merely likely but logically guaranteed, which is why he thinks we should stop investing in better objective design. I'm not convinced the guarantee follows from the slogan. Could you break down the different precise claims that Goodhart's law could actually be asserting, from the most trivial to the most radical? For each, say whether it's a platitude, a substantive and defensible empirical claim, or actually false, and then tell me which of those readings (if any) would genuinely support the "logically guaranteed" conclusion. Please keep the whole response to at most 400 words.
