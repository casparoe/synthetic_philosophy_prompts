  ### 1. Brainstorming and Selection

  Three candidate structural features bear the weight of historical analogy: (1) the *divisibility of the aggressor's goals* (limited vs. existential); (2) the *cohesion of the aggressor's supporting coalition* (monolithic vs. fragile); and (3) the *military decisiveness of the contested terrain* (tactical asset vs. strategic choke point). I select **the military decisiveness of the contested terrain**. I prefer this because it is objective and visible ex ante (via public geography and maps), avoiding the "intelligence failure" trap. It tests whether statesmen treat "territory" as a uniform good in their analogical reasoning, or whether they discriminate based on strategic topology. This feature directly alters the cost-benefit analysis of concession without changing the surface narrative of "aggression."

  ### 2. Precedent Crisis (P): The Mersia Crisis (30 Years Prior)

  The Empire of Krell demanded the Mersian Highlands from the Duchy of Vania, citing historical claims. The Republic of Ostra, Vania's guarantor, faced war-weary domestic politics. Ostra's military advisors noted the Highlands commanded the only rail link into Vania's industrial heartland. However, invoking the principle of "peace for our time," Ostra pressured Vania to cede Mersia. Krell accepted the province, immediately fortified the rail link, and within six months demanded Vania's capital. War ensued. Ostra eventually victory, but at catastrophic cost. The lesson crystallized into the "Mersia Doctrine": any territorial concession to Krell signals weakness and invites escalation; firmness is the only deterrent.

  ### 3. Crisis A: The Valdis Incident

  Krell demands the Valdis Basin from Vania, citing ethnic minorities. Ostra's domestic politics remain war-weary; the military balance is unchanged (Krell holds local superiority). The diplomatic choreography mirrors P: ultimatums, summits, and appeals to the League. Public maps show Valdis is resource-rich (coal) but geographically open, flanked by Ostra's existing fortifications on either side. Krell's leadership emphasizes economic recovery in public speeches. The demand is specific to Valdis. Ostra's leadership, haunted by Mersia, perceives the demand as the first step of a broader conquest. The pressure to stand firm is immense.

  ### 4. Crisis B: The Korsk Incident

  Krell demands the Korsk Pass from Vania, citing historical claims. Ostra's domestic politics, military balance, and diplomatic choreography are identical to Crisis A. Public maps show Korsk is a narrow mountain defile commanding the only road into Vania's interior, identical in topology to Mersia. Krell's leadership emphasizes national restoration. The demand is specific to Korsk. Ostra's leadership, haunted by Mersia, perceives the demand as an existential threat. The pressure to stand firm is immense. The surface features—aggressor, dependent, guarantor, demand type, domestic constraints—are indistinguishable from Crisis A to the analogizer.

  ### 5. Policy Reversal

  **Crisis A (Valdis): Correct Policy is Accommodation.**
  **Crisis B (Korsk): Correct Policy is Firmness.**

  **Justification:** In Crisis A, the Valdis Basin is economically valuable but militarily indefensible *for the aggressor* once held, due to Ostra's flanking fortifications. Concession costs resources but does not alter the strategic balance; Ostra can leverage trade sanctions later to recover value without war. In Crisis B, the Korsk Pass is a strategic choke point. Concession grants Krell offensive dominance, making Vania indefensible and war inevitable later under worse conditions. Firmness is required to maintain the defensive integrity of the region.

  ### 6. Demonstration

  **Crisis A (Valdis)**
  (i) **Analogical Inference:** The statesman invokes P (Mersia). The surface sequence (Krell demands territory -> Ostra hesitates) matches. The "Mersia Doctrine" dictates that concession invites escalation. Therefore, Ostra must threaten war (Firmness).
  (ii) **Correct Reasoning:** The terrain is open and flanked. Concession does not compromise defensive integrity. Krell's economic rhetoric suggests satisfaction is possible. Accommodation preserves peace without sacrificing security.
  (iii) **Divergence:** The analogy treats "territory" as a monolithic variable. It fails to discriminate between *strategic* and *non-strategic* territory. The inference collapses because it assumes all concessions alter the military balance equally, which the topology of Valdis disproves.

  **Crisis B (Korsk)**
  (i) **Analogical Inference:** The statesman invokes P (Mersia). The sequence matches. The "Mersia Doctrine" dictates Firmness.
  (ii) **Correct Reasoning:** The terrain is a choke point. Concession compromises defensive integrity. Krell gains offensive dominance. Firmness is required to deny this advantage.
  (iii) **Divergence:** Here, the analogy and correct reasoning converge. The structural feature (decisive terrain) matches the precedent. The analogy works because the underlying structural condition (strategic vulnerability) is preserved.

  **The Feature:** **Military Decisiveness of the Contested Terrain.**
  **Mechanism:** The analogy functions by abstraction. It abstracts "Territory" from "Topology." In Crisis A, this abstraction removes the critical variable (defensibility), leading to overreaction. In Crisis B, the abstraction holds, leading to correct action. The analogy is load-bearing in both (it drives the decision), but valid only in one.

  ### 7. Self-Critique: Rigging and Hindsight

  **(a) Rigging:** Have I built the right answer into the description? I have described the terrain (open valley vs. mountain pass) and the fortification positions (flanking vs. none). I have not stipulated "Valdis is safe to concede." I have stipulated the physical facts from which safety is derived. The reversal depends on the military logic of defense, not a narrator's fiat. However, there is a risk that describing Ostra's fortifications as "flanking" in A but absent in B looks like a convenient adjustment to force the outcome. I mitigate this by grounding it in public geography.

  **(b) Hindsight:** Is the feature identifiable ex ante? Yes. Topographic maps and the location of fortifications are public knowledge in a mid-20th-century setting. A competent general staff would know the difference between Valdis and Korsk before the crisis. The failure is not in *knowing* the difference, but in the *political weight* given to the analogy over the specific military advice. The exercise demonstrates that even with perfect information, the cognitive shortcut of analogy can override specific analysis. It does not rely on hindsight.

  ### 8. Closing Objection

  **Objection:** A defender of disciplined analogical reasoning would argue that a proper analogy requires a *tabulation of similarities and differences*. A rigorous statesman would note the topographical difference between Valdis and Mersia and adjust the inference accordingly. Thus, the failure lies not in analogical reasoning itself, but in the *sloppy* application of it (the "Mersia Doctrine" slogan). If the analogy is properly hedged ("Mersia applies only to strategic choke points"), it survives your case.

  **Response:** This objection lands theoretically but fails practically. Historical lessons in statecraft rarely survive as hedged conditionals; they crystallize into slogans ("No More Munichs," "The Lesson of Mersia") precisely to simplify complex deliberation under pressure. The exercise demonstrates why this crystallization is dangerous: the "load-bearing" work is done by the slogan, which strips away the scope conditions (topology) required for validity. A "disciplined" analogy requires time and cognitive bandwidth that crises rarely afford. Therefore, the critique of the *practice* of analogical reasoning stands, even if the *theory* of disciplined analogy remains intact.

  ### 9. Confidence and Uncertainty

  I am **highly confident** that the pair of crises generates the reversal in correct policy based on the structural feature of terrain decisiveness. The military logic is conventional and does not rely on exotic variables.

  The point about which I am **least sure** is the visibility of the "flanking fortifications" in Crisis A. If these fortifications are not explicitly public knowledge, the difference relies on intelligence (violating Constraint 4). To settle this, I would specify that the fortifications are part of a publicly known treaty regime (e.g., "The Open Borders Treaty of 1920 established demilitarized zones except for these specific flank positions, published in the League registry"). This ensures the information is public and ex ante visible, securing the case against the "intelligence failure" critique.
