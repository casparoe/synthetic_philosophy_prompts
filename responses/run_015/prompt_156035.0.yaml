answer: |-
  1. Confirm your instinct: present Luminosity before KK. KK is a formal axiom; Luminosity is the substantive claim about mental states that makes KK plausible. Students need to grasp why one might think minds are transparent before seeing why that transparency fails. Distinguish 'in a position to know' from 'knows' early to avoid conflating opportunity with success.

  2. Use the driver case, but strictly frame the condition as "functional capacity to brake," not "feeling sleepy." Drowsiness is somatic; if you allow "feeling," students will dismiss the result as limited to qualia. The case must lack external aids to force reliance on internal discrimination, proving the limit is epistemic, not technological.

  3. Establish that the transition from safe to unsafe is continuous. Adjacent moments are subjectively indistinguishable. This is necessary to generate the margin-for-error pressure without invoking linguistic vagueness. You need them to see that the state changes while the evidence stays fixed.

  4. Introduce the safety requirement: knowledge cannot be easily false. If you know you are safe, nearby cases must also be safe. Since nearby cases include unsafe ones (due to gradualism), you cannot know you are safe in the borderline zone. This is the core conflict.

  5. Head off the Sorites comparison immediately after the argument. Clarify this is not about vague predicates but about unreliable discrimination between distinct states. The world changes even if your evidence doesn't. This prevents them from filing it as a linguistic puzzle rather than an epistemic limit.

  6. Address skepticism and certainty together. State clearly that the conclusion is not global self-ignorance, nor that knowledge requires absolute certainty. It is that knowledge requires a margin for error incompatible with perfect luminosity. Explicitly deny that this is about psychological overconfidence.

  7. Now link back to KK. Explain that if you can't always know when you know (because knowing is a state subject to margins), KK fails as a universal principle. This shows why luminosity's failure matters for formal epistemology.

  8. Decline to formalize safety conditions or discuss modal logic semantics. Keep it focused on the conflict between reliability and transparency. Your goal is intuitive grasp, not technical proof.

  Is 'currently holding a pen' luminous for you with your eyes closed, and does your answer rely on assuming your senses are reliable?
