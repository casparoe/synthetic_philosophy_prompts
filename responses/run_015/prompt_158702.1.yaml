answer: |-
  **Personal Case: The Integrity Pact**
  Elena, a legislator of acknowledged competence and prudence, signs a notarized precommitment instrument during a calm session. She judges that a specific pension reform is morally necessary but politically suicidal, and she predicts her own resolve will crumble under electoral pressure. To secure the good of **political integrity**—defined as the alignment of her legislative action with her reasoned moral judgment despite personal cost—she deposits a pre-dated resignation letter with the notary, instructing them to file it immediately if she votes against the reform. The election arrives; Elena is lucid, fully informed of the policy details, and suffers no mania or panic, but she now reasonably judges that her continued career serves her constituents better than this single vote. She votes against the reform and demands the notary destroy the letter. If the notary honours the contract and files the resignation, Elena is either ousted or compelled to vote for the reform to save her seat; in either outcome, her action is driven by external threat rather than internal conviction. Because the good she sought (integrity) is **will-dependent**—it ceases to exist if the action is coerced—enforcing the precommitment secures the letter of the pact while destroying the good it was designed to achieve. The contract should not be honoured.

  **Constitutional Case: The Stability Clause**
  The Founding Assembly of Meridia, acting with competence and foresight, entrenches a "Fiscal Stability Clause" in the Constitution, requiring a 75% supermajority to approve deficit spending. They predict that future legislatures will face rational but short-term incentives to borrow excessively, jeopardizing the state's long-term capacity to act. To secure the good of **institutional solvency**—defined as the state's uninterrupted capacity to fund its operations over time regardless of transient political wills—they bind the legislature to this procedural hurdle. A recession strikes; the Current Legislature is lucid, fully informed of the economic risks, and reasonably believes stimulus is necessary, but it commands only 60% of the vote. It petitions the Constitutional Court to waive the clause. If the Court honours the precommitment and blocks the spending, the state remains solvent. Because the good sought (solvency) is **rule-dependent**—it is produced by the bare existence and enforcement of the constraint regardless of the legislature's current desire to borrow—enforcing the precommitment secures both the letter of the pact and the good it was designed to achieve. The contract should be honoured.

  ***

  ### Demonstration

  **a. Derivation of Verdicts**
  In the **Personal Case**, honouring the precommitment requires the notary to file the resignation letter, thereby forcing Elena to either leave office or vote against her current will to stay. The good aimed at is *political integrity*. This is a **will-dependent good**: integrity consists in the relationship between the agent's will and the action; if the action is produced by coercion (the threat of resignation), the integrity is logically extinguished. Given Constraint 6 (the later self is epistemically equal), Elena's refusal is not a mistake to be corrected but a change in valuation. Since enforcement destroys the very good it purports to secure, the verdict must be to reject the contract.

  In the **Constitutional Case**, honouring the precommitment requires the Court to strike down the deficit spending bill. The good aimed at is *institutional solvency*. This is a **rule-dependent good**: solvency is a state of affairs maintained by the mechanical operation of fiscal constraints; it does not require the legislature to *love* austerity, only to be bound by it. The causal mechanism of the rule (blocking the spend) produces the good (preserved capital) independently of the legislature's will. Since enforcement secures the good without logical contradiction, the verdict must be to honour the contract.

  **b. The Collapse Test**
  If we swap the goods, the verdicts flip, confirming the variable is doing the work.
  *   **Personal Case with Rule-Dependent Good:** Suppose Elena's pact aimed at *health* (e.g., she binds herself to a clinic to prevent drinking, predicting a craving). She later lucidly wants a drink. Health is rule-dependent (abstinence produces health regardless of will). If the clinic enforces the ban, health is secured. The verdict flips to **Honour**.
  *   **Constitutional Case with Will-Dependent Good:** Suppose Meridia's Constitution entrenched a "Civic Virtue Clause," requiring citizens to *sincerely love* the state, enforced by mandatory pledges. The Current Generation lucidly refuses to love the state. Virtue is will-dependent (forced love is not love). If the Court enforces the pledges, virtue is destroyed. The verdict flips to **Reject**.
  The collapse test confirms that the epistemic or agential status of the binder is not driving the verdict; the nature of the good is.

  **c. The Option-Preservation Reply**
  *The Reply:* "Even if the good is not realized now, enforce the contract. Holding the agent inside the arrangement keeps open the possibility that they will willingly return to the good later (Elena might regain her courage; Meridia might regain its fiscal discipline). Releasing them forecloses that possibility forever by establishing a precedent that the commitment is optional."

  *The Answer (Personal):* In the Integrity Case, coercion does not preserve the option of future integrity; it corrodes the capacity for it. If Elena learns that her moral commitments are enforced by external threats (the resignation letter), she learns to rely on threats rather than judgment. Enforcing the pact trains her in prudence, not integrity, making a "willing return" to integrity less, not more, likely. The option is not preserved; the path to it is blocked by the memory of coercion.

  *The Answer (Constitutional):* In the Stability Case, waiving the contract does not preserve the option of future solvency; it destroys the mechanism that guarantees it. If the Court rules that the Stability Clause can be waived when the legislature *reasonably* wants to spend, the Clause ceases to be an entrenchment and becomes a mere suggestion. The "option" to be bound is lost the moment the bound is shown to be porous. Enforcing the rule is the only way to keep the option of solvency open, because solvency *is* the existence of the bound.

  **d. Honest Assessment**
  The feature doing the work is the **logical structure of the good** (will-dependent vs. rule-dependent). The cases are well-matched regarding Constraints 1, 2, 4, and 6: both binders are competent, both refusals are lucid and predicted, enforcement is causally possible, and epistemic advantage is held fixed.

  However, two tensions remain. First, **Constraint 5 (Third Parties)** is stressed in the Constitutional Case. While I framed solvency as the State's own capacity, solvency inherently implies creditors. I have mitigated this by defining the good as "capacity to act" rather than "credit rating," but the distinction is fine. Second, **Constraint 7 (Identity)** is theoretically satisfied by stipulation, but practically, readers may still feel the "Polity" is different from the "Person." The argument relies on the reader accepting the functional analogy: that a Constitution is to a Polity what a Will is to a Person.

  **What the pair shows:** It demonstrates that the standard epistemic justification for Ulysses contracts (the earlier self knows better) is insufficient. Even if the later self knows *just as much*, enforcement is sometimes self-defeating (Personal/Integrity) and sometimes self-securing (Constitutional/Solvency).
  **What the pair does not show:** It does not prove that *all* will-dependent goods forbid precommitment, nor that *all* rule-dependent goods permit it. It shows only that the nature of the good is a necessary condition for the validity of the enforcement, one that operates independently of the binder's epistemic status. The thesis stands: we cannot judge precommitments by looking only at the *selves*; we must look at the *good*.
