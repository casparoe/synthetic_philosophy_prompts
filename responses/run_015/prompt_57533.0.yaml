  **The Rule**

  M. is running the **Institutional-Target Rule**, but with a specific, unstated qualifier: backsliding requires not just the alteration of an institution, but the **structural capture** of that institution to secure incumbent advantage or irreversibility.

  The other three candidates fail to account for the record without significant strain:
  *   **The Competitive-Chances Rule** fails on **Case 4**. The governing party postponed the election but ultimately lost it. If the rule were purely about the opposition's realistic chance of winning, the fact of turnover should have coded this as Stable or Drift. M. coded it Backsliding ("the most severe call") because the *institution* of election timing was violated, regardless of the outcome.
  *   **The Turnover Rule** fails on **Case 4** for the same reason. Turnover occurred. The label was Backsliding because the incumbent attempted to manipulate the *condition* of turnover, not because turnover was successfully prevented.
  *   **The Creation-of-Discretionary-Tool Rule** fails on **Case 5**. The government criminalized a protest tactic and raised fines, creating new legal tools for suppression. Yet this was coded Drift, not Backsliding. This rule cannot distinguish between creating a tool for harassment (Case 5) and creating a tool for structural capture (Case 1, 2, 6) without importing the Institutional-Target distinction anyway.

  The Institutional-Target Rule fits all eight calls: Cases 1, 2, 4, 6, and 8 involve altering the structure, personnel, or jurisdiction of referees (courts, electoral commissions, media ownership) in a way that biases the game or locks in advantage. Cases 3, 5, and 7 involve using existing rules harshly or "noise" without altering the machinery itself. M.'s notes ("bought the scoreboard," "next government cannot undo," "players overrule referees") consistently point to the integrity and independence of the administrative machinery, not merely the election result.

  **Prediction**

  **Label:** **Illiberal Drift**
  **Probability:** 85%

  **Closest Analog (Same Direction):** **Case 5**. In both instances, the government inflicts significant harm on the opposition and independent media (deportations/fines in Case 5; advertising starvation in the File) without altering the structural licensing, ownership, or electoral rules that guarantee a fair contest. In both, the government remains capable of losing elections (Case 5 coalition win; File regional losses and concession).

  **Closest Analog (Opposite Direction):** **Case 1**. The media advertising redirection in the File resembles the media foundation in Case 1. However, Case 1 involved folding newspapers into a foundation with government-appointed trustees (structural ownership change), whereas the File involves a ministerial decree redirecting funds (reversible policy change) with no change to licensing or ownership. Case 1 also involved electoral gerrymandering *for* the incumbent; the File's boundary reform *hurt* the incumbent.

  **Recommendation**

  Publish **Illiberal Drift**. Selecting this label is a **substantive claim**, not a way of declining to answer. It asserts that while the government has engaged in harmful anti-competitive behavior (starving independent press), it has not crossed the threshold of structurally capturing the referees of democracy. The court reforms required opposition consent, and the boundary commission operated independently to the incumbent's detriment. Coding this as Backsliding would conflate harassment with structural capture, rendering the term useless for distinguishing between a government that plays hard within the rules and one that rewrites the rules to prevent losing. Drift accurately describes the harm without falsely predicting the collapse of competitive turnover.

  **Separating Case**

  To sharply separate the surviving rules, you need a case where institutional structure is altered, but the alteration *benefits* the opposition or is fully reversible.

  **Case Description:** A government transfers the power to draw electoral districts from the Interior Ministry to a new independent commission of judges. The commission's first map reduces the governing party's seat share by ten percent. The enabling statute, however, allows the legislature to dissolve the commission and revert to ministry control with a simple majority vote. The government accepts the map and wins the subsequent election despite the disadvantage.

  **Predictions:**
  *   **Institutional-Target (M.'s Rule):** **Stable** or **Drift**. The institution was altered, but not captured for incumbent advantage; indeed, it constrained the incumbent. The "capture" qualifier is not met.
  *   **Competitive-Chances Rule:** **Stable**. The opposition's chance of winning was materially *increased*.
  *   **Turnover Rule:** **Stable**. Losing office was made *more* likely, not less.
  *   **Creation-of-Tool Rule:** **Backsliding**. A new discretionary tool (the commission) was built that a *future* incumbent could pack via simple majority, regardless of current use.

  This case isolates whether M. codes based on current capture (Institutional-Target/Turnover/Chances) or the mere existence of a potential future weapon (Creation-of-Tool). Given Case 2 ("next government cannot undo"), M. cares about irreversibility. Since this commission can be dissolved by simple majority, it is reversible, supporting the Stable/Drift prediction.

  **Philosophical Commitment**

  If the rules diverge on this file, **"backsliding" is doing more work** than a description plus disapproval. It is a technical term denoting a specific threshold of **structural irreversibility and referee capture**. In the File case, reasonable people can disapprove of the advertising redirection. But if we label it Backsliding, we are making a empirical claim that the machinery of competition is now broken or locked against turnover. If we label it Drift, we are claiming the machinery remains intact despite harassment. These are falsifiable claims about the state's institutions, not merely expressions of moral outrage. I commit to the view that preserving this distinction is necessary for the assessment to have predictive value; collapsing it into general disapproval renders the four-label system redundant.
