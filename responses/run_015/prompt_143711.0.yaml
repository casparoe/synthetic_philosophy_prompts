  **Joint Statement on Moral Compromise and Value Leakage**
  **Drafted by the Trade-is-Real Camp & The No-Dirty-Hands Camp**

  **Intro**
  We've had a proper chinwag about the idea of "value leakage" — that notion when you strike a deal across a moral divide, some of the value you sacrifice leaks into the gain and taints it. We haven't solved everything, obviously. But we've mapped out where we stand, where we clash, and what evidence might actually change our minds. Here's the record.

  ***

  ### 1. Agreed Claims

  1.  **Leakage is real.** Both camps accept that moral compromise often produces a psychological or normative cost beyond the immediate trade. We agree that "winner's guilt" or a sense of hollow victory is a observable phenomenon, not just sour grapes.
  2.  **Not all values leak equally.** We agree that leakage is stronger when core principles (sacred values) are traded compared to mere preferences (secular values). Swapping lunch spots doesn't leak; swapping principles does.
  3.  **The Logging Case.** Regarding the activist/logging example: both sides agree the protected zone is physically saved, and the trees elsewhere are physically lost. We also agree that the activist's community may view the victory as compromised. The disagreement is strictly on whether the protected zone retains *enough* value to justify the deal, not on the physical outcomes.
  4.  **Net Benefit is Hard to Measure.** Both sides concede that calculating the "net benefit" of a moral trade is notoriously difficult because the currency (moral integrity vs. material gain) lacks a standard exchange rate.

  ***

  ### 2. Disagreements Table

  | Issue | Camp 1: The Trade-is-Real Lot | Camp 2: The No-Dirty-Hands Lot |
  | :--- | :--- | :--- |
  | **Nature of Leakage** | Leakage is a **transaction cost**. Like paying fees on a currency exchange, it reduces the margin but doesn't invalidate the profit. | Leakage is **contamination**. Like radioactive dust on food, it renders the gain unsafe or morally void, regardless of the calorie count. |
  | **Commensurability** | Values are **fungible enough**. With smart bargaining, you can translate principle into outcome. A bit of dirt on your hands is worth clean water for the village. | Values are **incommensurable**. You cannot trade a principle for an outcome without destroying the principle. There is no exchange rate, only betrayal. |
  | **The Net Result** | **Positive Sum.** Even with leakage, the remaining value of the gain outweighs the loss of purity. Compromise is the engine of progress. | **Negative/Zero Sum.** The corruption of the agent or the principle undermines the gain. You haven't won; you've just managed the damage. |
  | **Future Impact** | **Muscle Building.** Making hard trades builds the capacity for future governance and nuanced negotiation. | **Slippery Slope.** Making hard trades normalises the violation, making future betrayals easier and cheaper. |

  ***

  ### 3. The Cruxes

  These are the specific questions where, if we found a definitive answer, one of us would have to concede ground.

  1.  **The Fungibility Crux:** Can moral integrity be spent and replenished, or is it a non-renewable resource?
  2.  **The Measurement Crux:** Does the feeling of "taint" correlate with actual negative downstream consequences, or is it just an emotional tax with no material effect?
  3.  **The Precedent Crux:** Does a compromised victory make future victories easier (by establishing cooperation) or harder (by eroding trust and principles)?

  ***

  ### 4. Concrete Cases & Predictions

  For each crux above, we've selected a case we both agree is relevant. Here is what each side thinks that case proves.

  **Crux 1: The Fungibility Crux**
  *   **Case:** *The Humanitarian Aid Deal.* An NGO accepts funding from a regime with poor human rights records to deliver life-saving medicine. The regime gets PR cover; the NGO saves lives but legitimises the regime.
  *   **Camp 1 Prediction:** This proves integrity is renewable. The lives saved are concrete goods. The NGO can apologise later or pivot funding sources. The "spent" integrity is worth the price of the medicine.
  *   **Camp 2 Prediction:** This proves integrity is non-renewable. The NGO is now dependent on the regime. The "legitimacy" granted to the regime causes harm that outweighs the medicine. The organisation is now compromised and cannot bite the hand that feeds it.

  **Crux 2: The Measurement Crux**
  *   **Case:** *The Whistleblower Plea.* A whistleblower agrees to a non-disclosure agreement (NDA) on certain crimes in exchange for immunity and revealing other, larger crimes. They feel guilt over the silenced crimes.
  *   **Camp 1 Prediction:** The guilt is an emotional tax, not a moral indicator. The larger crimes revealed prove the net benefit is positive. The feeling of taint is irrelevant to the utility of the outcome.
  *   **Camp 2 Prediction:** The guilt is a signal of actual moral damage. The silenced crimes will fester because of the NDA. The feeling of taint predicts future institutional rot that will negate the initial exposure.

  **Crux 3: The Precedent Crux**
  *   **Case:** *The Coalition Government.* Two opposing political parties form a coalition to pass a budget. Both drop key manifesto promises to do so.
  *   **Camp 1 Prediction:** This proves compromise builds capacity. Voters see governance happening. Trust in the system increases because deals are being struck rather than gridlock prevailing.
  *   **Camp 2 Prediction:** This proves the slippery slope. Voters see promises broken. Trust erodes because principles are shown to be negotiable. Future elections become cynical because no one believes the manifestos anyway.

  ***

  **Signed,**
  *The Trade-is-Real Lot & The No-Dirty-Hands Lot*
