prompt: |-
  Me and my friend got into a long argument last night about the Allais paradox and I still dont know who's right. He says that when people claim the paradox shows the independence axiom is wrong, that's a bit of a misdirection — the preference pattern most people actually pick only directly violates this weaker rule called the substitution or common consequence principle, and the independence axiom only enters the picture because it implies that weaker rule. I told him that can't be, because if the axiom implies the rule, then violating the rule means you've already broken the axiom, so the paradox is still a direct hit on independence. Can you compare the two principles for me: what's the real difference between the independence axiom and the common consequence principle, does the Allais pattern violate independence on its own or only through the weaker principle, and if you had to drop one of them, which is the more defensible thing to throw out and why?
