      *   *The Trap:* If I say "Rational agents update X way" and "Biased agents update Y way," am I just defining rationality as "updating the way I like"? That's the circularity risk.
      *   *The Solution:* Look for *structural* differences in the revision process, not just the outcome.

  3.  **Drafting - Section by Section:**

