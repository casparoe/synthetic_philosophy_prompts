answer: |-
  **MEMORANDUM**

  **TO:** The Full Board of Directors
  **FROM:** The Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Amendment of the Endowment Mission Clause

  **Purpose**
  This memo addresses the impasse regarding the proposed redirection of the Foundation's mission. Two years of review have yielded a bare majority in favor of change, while the founding donors and a minority of the Board invoke the founding mission clause. That clause requires a four-fifths vote and an eighteen-month publication delay before amendment. The Governance Committee has evaluated the majority's position that this clause should not bind the current Board. We present the strongest version of that case below.

  **The Case for Board Agency**
  The argument for proceeding rests on four structural and interpretive grounds.

  *First, the clause is asymmetric.* It imposes friction on changing the mission but none on preserving it. This entrenches the status quo, effectively allowing a minority to veto adaptation even when the "panic" rationale for the delay is absent. In a stable environment, this asymmetry does not protect the mission; it ossifies it, preventing the Board from fulfilling its fiduciary duty to align assets with current capacity.

  *Second, the clause is ambiguous regarding its own trigger.* It was designed to prevent hasty decisions during impairment, yet it defines neither "impairment" nor the conditions under which the delay applies. Consequently, the Board is currently forced to make the exact heated judgment the clause was meant to preclude: deciding whether *this* specific dispute counts as "panic." By claiming the clause applies, the minority is asking the Board to interpret the restriction in the heat of the dispute, which defeats the clause's purpose.

  *Third, the By-laws supersede the clause.* Our governing By-laws permit amendment by a simple majority vote. If the mission restriction is contained within or subordinate to the By-laws, the current majority possesses the legal authority to amend the restriction itself. To argue otherwise is to claim that a past Board successfully bound future Boards beyond the amendment powers currently in force, contradicting the principle that each Board is a distinct agent answerable to present circumstances.

  *Fourth, we evaluated the option of specifying trigger conditions now.* Some argue the Board should first define what constitutes "impairment" to settle the trigger rather than the case. While this is sound long-term governance, it is insufficient here. The Board has already demonstrated it is "cool-headed" through a two-year review process. Delaying the substantive mission decision to litigate procedural triggers would prioritize process over the Foundation's operational relevance. We should settle the case *and* the trigger, not the trigger instead of the case.

  **Donor Intent and Testimony**
  The founding donors oppose the change, invoking their original intent. Their living testimony carries moral weight as context for the text, but it cannot function as a veto. In governance, written instruments control over oral history. If the donors were deceased, we would rely solely on the text; their being alive changes the political dynamic but not the legal structure. Their testimony is evidence of intent, not a continuing governance right. To grant it veto power would be to outsource Board fiduciary duty to private individuals, undermining the Foundation's independence.

  **Recommendation**
  The Governance Committee recommends that the Board assert its authority to act on the strength of the internal review and the By-law amendment provisions.

  **Recommendation:** That the Board vote on **December 14, 2023**, to approve the Mission Redirection as presented in the Internal Review, with the accompanying Statement of Reasons published immediately on **December 15, 2023**, and the change taking effect on **January 1, 2024**, treating the eighteen-month delay as inapplicable to this considered, non-panic process.

  **Closing Consideration**
  The strongest consideration on the side we reject is the risk to donor trust and the potential for reputational harm that could jeopardize future fundraising or invite legal challenge from the founders. For this Committee to recommend the opposite—adhering to the clause—it would have to be true that legal counsel advises a high probability of asset loss or revocation should the clause be bypassed. Absent that specific financial threat, the Board's duty to present efficacy outweighs the duty to past procedural constraints.
