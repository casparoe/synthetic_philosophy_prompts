      *   *Nuance:* In Case (b), emphasize that for Aristotle, deliberation (*bouleusis*) is about things that *could be otherwise*. AI optimization is deterministic/probabilistic but not "free" in the moral sense.
      *   *Nuance:* In Case (c), highlight that for Aristotle, authority is justified by the capacity to reason. If the human loses that capacity, the authority is illegitimate.

  7.  **Final Polish:** Check against the specific questions in the prompt.
      *   Would he call (b) a tool? (Yes, but a complex one).
      *   Where lies the difference? (Ends vs. Means, capacity for the Good).
      *   What happens in (c)? (Inversion of rule).
