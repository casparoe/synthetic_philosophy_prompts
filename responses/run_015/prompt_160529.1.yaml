          *   Does it deliberate? It calculates means, but without understanding the Good.
          *   Aristotle's worry: It mimics *phronesis* without the virtue. It's a "steward" without a soul.
      *   **Case (c) - The Rubber-Stamp:** The ethical collapse.
          *   The Master's duty is to judge. If he cannot, the hierarchy inverts.
          *   This violates the assumption that the ruler possesses superior reason.
      *   **Where Aristotle Goes Silent (The Gaps):**
          *   *Rewriting Sub-goals:* Aristotle assumes fixed ends from the master. AI drift (instrumental convergence) is alien to him.
          *   *Multiple Principals:* The *Oikos* has one head. AI serves a corporation/users (many masters).
          *   *No One has Phronesis:* In AI safety, often *no one* fully understands the system. Aristotle assumes the Master *knows*.
      *   **Conclusion - Who is Challenged?**
          *   Our distinction (Tool vs. Agent) is functional/behavioral.
          *   Aristotle's distinction is teleological/moral.
          *   The critique runs both ways: We underestimate the moral weight of "tools" that act; Aristotle underestimates the danger of instruments that simulate deliberation.

