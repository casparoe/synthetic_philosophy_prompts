      *   *Section 2:* Popper saves his position by distinguishing between unconditional historical prophecies and conditional situational analyses. Historicism claims, "Capitalism will inevitably collapse." This is forbidden because it ignores unpredictable knowledge growth. Piecemeal engineering claims, "Given current banking laws, raising rates reduces inflation." This is allowed because it holds institutional conditions constant. Popper calls this the "logic of the situation." Agents act appropriately within their environment. The regularity isn't in history itself, but in the rational response to constraints. Historicists mistake temporary trends for eternal laws. Popper allows trends to be observed but denies they are binding laws. The key is that piecemeal predictions are testable and falsifiable in the short run, whereas historicist prophecies are too vague and long-term to ever be disproven.
