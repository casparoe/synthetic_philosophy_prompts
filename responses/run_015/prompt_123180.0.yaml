answer: |-
  Your friend is a functionalist. She doesn't view guilt and shame as moral truths, but as **social technologies** that only work when they match the underlying infrastructure of the group. Based on her track record, she is tracking three specific architectural variables.

  Here are the three rules that fit her past verdicts equally well, how they apply to your smart-contract forum, and the test case that would reveal which rule is actually driving her thinking.

  ### The Three Rules

  **1. The Restoration Rule (Mechanisms of Repair)**
  *   **The Logic:** Guilt requires a path to redemption that restores the agent to full standing without permanent stigma. Shame requires that the stain on status is durable or that exit is the only option.
  *   **Fit to Track Record:**
      *   *Religious Communities:* Tight-knit (usually Shame territory), but **forgiveness rituals** allow for repair $\rightarrow$ **Guilt**.
      *   *Honor Societies/Workplaces:* No formal mechanism to "undo" a loss of face or firing; the record is permanent $\rightarrow$ **Shame**.
      *   *Democracies:* Legal rehabilitation and the ability to move/start over $\rightarrow$ **Guilt**.

  **2. The Quantification Rule (Locus of Judgment)**
  *   **The Logic:** Guilt thrives where judgment is internal, abstract, or mediated by a neutral third party (law/God). Shame thrives where judgment is external, public, and numerically scored by the peer group.
  *   **Fit to Track Record:**
      *   *Workplaces:* Performance is **metricized and ranked** publicly $\rightarrow$ **Shame**.
      *   *Honor Societies:* Reputation is **public knowledge** (face) $\rightarrow$ **Shame**.
      *   *Democracies:* Voting is secret; morality is a private conscience matter $\rightarrow$ **Guilt**.
      *   *Religious Communities:* Sin may be public, but the *valuation* is mediated by doctrine/priest, not peer metrics $\rightarrow$ **Guilt**.

  **3. The Stickiness Rule (Identity Portability)**
  *   **The Logic:** Guilt works when the agent can separate their *act* from their *identity* (I did a bad thing). Shame works when the act becomes the identity (I am a bad thing) because the identity is immutable or high-cost to shed.
  *   **Fit to Track Record:**
      *   *Honor Societies:* Identity is tied to **body/family** (cannot be shed) $\rightarrow$ **Shame**.
      *   *Workplaces:* Identity is tied to **role/career** (hard to shed without loss) $\rightarrow$ **Shame**.
      *   *Democracies:* Identity is **citizenship/individual** (portable, anonymous) $\rightarrow$ **Guilt**.
      *   *Religious Communities:* Identity is **soul** (immutable), *but* the doctrine separates sinner from sin $\rightarrow$ **Guilt** (This is the outlier that makes this rule weaker, but still plausible).

  ---

  ### Predictions for the Smart-Contract Forum

  **The Case:** Pseudonymous, public reputation score, smart contract enforcement, disembodied harm.

  *   **Prediction via Restoration Rule:** **SHAME.**
      *   *Reasoning:* Smart contracts are typically immutable ("Code is Law"). Unless the code explicitly includes a "forgiveness function" (a way to wipe the ledger clean after restitution), the record of harm is permanent. A permanent public record of failure functions like an honor exile, not a guilt rehabilitation.
  *   **Prediction via Quantification Rule:** **SHAME.**
      *   *Reasoning:* A "public reputation score" is the definition of external quantification. It turns moral behavior into a metric visible to the peer group. This matches the Workplace (metrics) and Honor (face) architectures, not the Democracy (private conscience) or Religion (doctrinal absolution).
  *   **Prediction via Stickiness Rule:** **GUILT.**
      *   *Reasoning:* The identity is pseudonymous and disembodied. Unlike a family name or a physical body, a wallet address can be generated anew. If the user can "shed" the reputation by creating a new key (low exit cost), the architecture supports Guilt (focus on the act, not the permanent self). *However*, if the system is Sybil-resistant (requiring stake/proof-of-humanity), the identity becomes sticky, flipping this to Shame.

  ---

  ### Best Guess: She Picks SHAME

  **The Reason:**
  The **Quantification Rule** combined with the **Restoration Rule** creates a pincer movement.
  1.  **Public Ledger = Perfect Surveillance:** The "social architecture" of a blockchain is a panopticon. Every action is permanently visible and scored. This is the ultimate "Honor" architecture, digitized.
  2.  **Immutability = No Forgiveness:** Unless specifically coded otherwise, smart contracts do not offer "ritual forgiveness." They offer execution. A drop in reputation score is a mathematical fact, not a moral negotiation.
  3.  **Pseudonymity is a Red Herring:** She would argue that a wallet address *becomes* the body in this context. If your economic survival in the forum depends on that address, it is "sticky" enough to function as a biological body.

  She would likely say: *"This isn't a community; it's a ledger. You don't cultivate guilt in a spreadsheet; you manage risk. Public scoring without ritualized absolution is pure shame architecture. Trying to introduce 'guilt' here would be like HR telling people they're a 'family' while tracking their bathroom breaks."*

  ---

  ### The Splitter Case

  To determine which rule is actually her "Master Rule," you would present her with this hypothetical:

  **The Case:** **"The Jubilee Platform."**
  A digital marketplace exactly like the forum above (public reputation scores, smart contracts, pseudonymous), **BUT** it has a coded "Jubilee Protocol." Every 7 years, or upon completion of a specific restitution smart-contract, all negative reputation history is **cryptographically erased** and the user's score is reset to neutral automatically.

  *   **If she says GUILT:** Her Master Rule is **Restoration**. (The ability to repair the record overrides the public visibility of the score).
  *   **If she says SHAME:** Her Master Rule is **Quantification/Visibility**. (The fact that behavior is publicly scored in real-time creates a shame dynamic, regardless of whether the record is eventually wiped).

  **Why this splits them:**
  The Restoration Rule predicts Guilt because the "sin" is removable (matching the Religious case). The Quantification Rule predicts Shame because the "judgment" is public and metricized (matching the Workplace case). This forces her to reveal whether she prioritizes the *consequence* (permanent stain) or the *process* (public scoring).
