  **(c) What are both parties missing?**
  Both parties conflate epistemic authority with normative standing. The missing distinction is between knowing *that* a work is good (which testimony can supply) and knowing *why* or being entitled to assert it as a critic (which requires experience). This mirrors the debate in moral testimony regarding whether one can know an act is wrong without grasping the moral reasons. The debate should focus not on knowledge, but on the propriety of asserting aesthetic verdicts without the underlying appreciation that gives those verdicts their point.

