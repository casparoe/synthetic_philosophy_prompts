  # COMMUNITY INVESTMENT BOARD: ALLOCATION PROCEDURE v1.0

  **Analyst Instructions:** Complete Steps 1–6 for each proposal pair. Stop at any **REJECT**. Escalate at any **BOARD**. Mark any **VALUE FLAG** in the audit trail.

  **Step 1: Ledger Entry.**
  Populate the Conversion Ledger for each proposal. Columns: (1) Resources Delivered ($/goods), (2) Functioning Achieved (observable doings/beings), (3) Experience Reported (self-reported well-being).
  *   **REJECT** if any column is empty or based solely on projections without baseline data. **(Fact Gap)**

  **Step 2: Adaptation Check.**
  Compare Experience vs. Functioning. If Experience is High but Functioning is Low, mark "Adaptation Gap." Discount Experience score by 50% for comparison.
  *   **VALUE FLAG:** This assumes objective functioning matters more than subjective feeling when they diverge.
  *   **REJECT** if Proposal relies entirely on Experience scores that are discounted. **(Unreliable Currency)**

  **Step 3: Conversion Check.**
  Compare Resources vs. Functioning. If Resources are High but Functioning is Low, mark "Conversion Loss." Require applicant to explain specific barriers (disability, geography, etc.).
  *   **VALUE FLAG:** This assumes efficiency matters; high cost must buy high functioning.
  *   **REJECT** if explanation is "client preference" without structural barrier. **(Expensive Tastes)**

  **Step 4: Swap Test.**
  Ask: If we swapped beneficiaries with random eligible peers, would the metric still select this group?
  *   **REJECT** if No. **(Targets Individuals, Not Disadvantage)**

  **Step 5: Standstill Test.**
  Calculate inequality impact. Does funding this improve the position of the worst-off group (lowest Functioning score) without making them worse off relative to others?
  *   **VALUE FLAG:** This prioritizes the worst-off (Prioritarianism).
  *   **REJECT** if funding makes the worst-off worse off relative to the better-off. **(Leveling Down)**
  *   **BOARD** if both proposals pass, but one helps the worst-off more (Depth) while the other helps more people (Breadth). **(Value Conflict: Priority vs. Aggregation)**

  **Step 6: Repeat Probe.**
  Ask: If funded for 5 cycles, do the same households win every time?
  *   **BOARD** if Yes (Lock-in) vs. No (Rotation) creates conflict between Life-Share and State-Now equality. **(Temporal Value Judgment)**

  **Decision Rule:**
  1.  Reject any proposal failing Steps 1–4.
  2.  Among remaining, select the one passing Step 5 (Standstill) most strongly.
  3.  If Step 5 is tied or conflicts with Step 6, Escalate to Board.

  ***

  # GLOSSARY

  *   **Adaptation Gap:** When people report feeling fine (Experience) despite lacking basic abilities (Functioning). Indicates they have lowered expectations to cope.
  *   **Conversion Loss:** When resources (money/goods) do not turn into abilities (Functioning) due to barriers like disability or location.
  *   **Currency:** The unit of measurement used to claim success (e.g., dollars, happiness scores, capabilities).
  *   **Functioning:** What a person is actually able to do or be (e.g., walking, staying warm, avoiding eviction).
  *   **Experience:** What a person reports feeling (e.g., happiness, pain levels, satisfaction).
  *   **Resources:** Goods, services, or cash delivered by the program.
  *   **Standstill Test:** A check to ensure the worst-off group improves absolutely, not just relatively.
  *   **Swap Test:** A check to ensure the program targets a disadvantaged *category* of people, not specific *individuals*.
  *   **Worst-off:** The group with the lowest Functioning scores in the eligible population.
  *   **Leveling Down:** Making the better-off worse without helping the worst-off; forbidden by this procedure.
  *   **Lock-in:** When the same individuals receive funding repeatedly, preventing others from accessing help.
  *   **Value Flag:** A warning that a step relies on a moral choice, not just math.

  ***

  # WORKED APPLICATIONS

  ## Case 1: Chronic-Pain Course vs. Home Insulation
  **Audit Template:**
  | Instrument | Pain Course | Insulation Retrofit | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Ledger** | Res: Low<br>Func: Low<br>Exp: High | Res: High<br>Func: High<br>Exp: Low (Fragile) | Both Pass Step 1 |
  | **Adaptation** | **Gap Detected.** High Exp + Low Func. | No Gap. | Pain Exp discounted 50%. |
  | **Conversion** | N/A | Low Loss. | Both Pass Step 3. |
  | **Swap** | Passes. | Passes. | Both Pass Step 4. |
  | **Standstill** | Helps moderate need. | **Helps worst-off** (low income/health). | Insulation wins Step 5. |
  | **Repeat** | Rotates. | Rotates. | No Conflict. |

  **Decision:** Fund **Home Insulation**.
  **Reasoning:** Step 2 (Adaptation Check) discounts the Pain Course's primary metric (Experience) because functioning remains low. Step 5 (Standstill) favors Insulation as it targets the worst-off households with high conversion needs.

  ## Case 2: Powered Mobility vs. Unconditional Cash
  **Audit Template:**
  | Instrument | Powered Mobility | Cash Transfer | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Ledger** | Res: High<br>Func: High<br>Exp: Mod/Neg | Res: Med<br>Func: Diffuse<br>Exp: High | Both Pass Step 1 |
  | **Adaptation** | No Gap (Honest reporting). | No Gap. | Both Pass Step 2. |
  | **Conversion** | High Cost justified by impairment. | Low Loss. | Both Pass Step 3. |
  | **Swap** | Passes. | Passes. | Both Pass Step 4. |
  | **Standstill** | **Depth:** Helps absolute worst-off (severe impairment). | **Breadth:** Helps more people, less deeply. | **CONFLICT.** |
  | **Repeat** | Lock-in risk (same devices). | Rotates. | Potential Conflict. |

  **Decision:** **Neither — Escalate**.
  **Reasoning:** Step 5 triggers a **BOARD** escalation. Both pass the Standstill Test but represent a value conflict: Priority to the *deepest* disadvantage (Mobility) vs. Aggregation of *total* welfare/capability (Cash). This is a value judgment, not a fact.
  **Note:** Step 6 also flags a temporal conflict (Lock-in vs. Rotation).

  ## Case 3: Music Instruction vs. Legal Aid
  **Audit Template:**
  | Instrument | Music Instruction | Legal Aid (Eviction) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Ledger** | Res: Med<br>Func: High (for some)<br>Exp: High | Res: Low<br>Func: High (Protection)<br>Exp: High | Both Pass Step 1 |
  | **Adaptation** | No Gap. | No Gap. | Both Pass Step 2. |
  | **Conversion** | Low Loss. | Low Loss. | Both Pass Step 3. |
  | **Swap** | **FAILS.** Targets better-off half. | Passes. | Music Rejected Step 4/5. |
  | **Standstill** | **FAILS.** Does not improve worst-off. | **PASSES.** Protects worst-off. | Legal Aid wins Step 5. |
  | **Repeat** | Lock-in (same children). | Rotates (cases resolve). | Legal Aid wins Step 6. |

  **Decision:** Fund **Extending a legal-aid service**.
  **Reasoning:** Step 5 (Standstill Test) forces this conclusion. Music serves the better-off half; Legal Aid serves the worst-off (eviction risk).
  **Escape Clause:** To fund Music, the Board must reject the premise in Step 5's **VALUE FLAG**: that public funds must prioritize the worst-off (Prioritarianism). They would need to adopt a "Merit" or "Excellence" principle instead.

  ***

  # LIMITATIONS & CLOSING

  **Where This Procedure Will Misfire**
  1.  **Data Scarcity:** If applicants cannot provide baseline Functioning data (Step 1), the procedure rejects valid but nascent programs.
  2.  **Incommensurability:** If two proposals help different worst-off groups (e.g., disabled vs. homeless) with no common functioning metric, Step 5 cannot calculate inequality movement.
  3.  **Political Reality:** The procedure assumes the Board accepts the "Worst-Off Priority" value flag. If the Board represents a constituency that values "Merit" (Case 3), the procedure will generate consistent recommendations they consistently overturn.

  **What It Cannot Do**
  1.  **Set the Budget:** This procedure allocates a fixed pot; it cannot determine if the pot is large enough to meet community needs.
  2.  **Define "The Worst-Off":** The procedure takes the definition of disadvantage as an input. It cannot philosophically settle whether disability, income, or race defines priority.
  3.  **Resolve Ultimate Value Conflicts:** As seen in Case 2, when Depth (Priority) clashes with Breadth (Utilitarianism), the procedure must escalate. It cannot solve the equality-of-what debate; it only makes the debate visible.

  \answer{Case 1: Home insulation and heating retrofit; Case 2: neither — escalate; Case 3: Extending a legal-aid service}
