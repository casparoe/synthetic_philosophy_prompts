      *   *Claim 3 (The "All Biases Equal" Claim):* Induction is no better than anti-induction *simpliciter*. (False/Misleading, depends on the world).
      *   *Claim 4 (The "Problem Dissolved" Claim):* Hume's problem is solved because justification is impossible/unnecessary. (False, begs the question).
