          *   *Is it vacuous?* It's not vacuous mathematically, but philosophically it proves too much only if you accept the uniform prior. It shows that *without* a prior on nature, you can't pick a bias. It doesn't show you *shouldn't* pick a bias if you have reason to think nature isn't uniform.

      *   **Point 3: Meta-level Regress.**
