      *(Self-Correction during drafting)*: Wait, Efron's bootstrap *is* a valid statistical technique. The epistemic "bootstrapping" is considered a fallacy. I need to be careful not to conflate them. The epistemic problem is *like* using the training error as an estimate of test error without correction. I must distinguish "The Bootstrap (Method)" from "Bootstrapping (Problem)".
      *   *Refinement:* The epistemic bootstrapping problem is analogous to *evaluating on the training set* and claiming generalization. Efron's bootstrap is a *correction* for that. So the epistemic problem is "Naive Training Error as Generalization Estimate." The reliabilist reply is "Efron's Bootstrap works, so why not this?"

      *   *Wait, one more nuance:* The epistemic bootstrapping involves using the source to check the world, then the world to check the source.
      *   *ML Analogy:* Using the model to pseudo-label data, then using that pseudo-labeled data to validate the model. This is *Self-Training* without a clean validation set.

