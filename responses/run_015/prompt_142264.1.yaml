  Last night at my film club we watched something genuinely bleak, and afterwards I asked the old question — why do we seek out sad films, sad novels, sad music, when we spend the rest of our lives avoiding those same feelings? My mate Dan shut it down with: "it's not real, so you're not really sad, so there's nothing to explain." Everyone nodded. I think that line is doing a lot more work than it looks like it's doing, and I want to know exactly what it would have to mean to do that work.

