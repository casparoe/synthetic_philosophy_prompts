  - grief rehearsal: people who deliberately rewatch old home video or listen to a saved voicemail from someone who has died — real material, real grief, no fiction anywhere — and who say afterwards that doing it was worth it even though it hurt.

  Give me exactly five readings of "it's not real", ordered from the thinnest and most obviously true to the strongest and most likley false. For each reading, say within the same item whether it's a platitude, a substantive claim someone could defend, or just false; whether it's actually strong enough to get Dan his conclusion; and what it predicts about the true-story bump and about the voicemail case.

  Format: a numbered list of exactly five items, one or two sentences each, no introduction and no conclusion — nothing before item 1, nothing after item 5. British English please, and commit to a verdict on each reading instead of hedging every one into mush.
