answer: |-
  **Subject:** Grad Seminar: Decision Theory & Climate Policy
  **Topic:** Diachronic Consistency in Institutional Settings

  Hey everyone — here's that draft prompt we discussed. It's designed to push students past the standard "hyperbolic discounting" essay and into the messy reality of institutional choice. I've left a small typo in the prompt instructions because, well, it's part of teh vibe.

  ***

  ### Exam Question 3: The Green-Transition Lock-In Paradox (20 Marks)

  **Scenario:** A government commits at *t₁* to a rising carbon-price trajectory to force decarbonization. At *t₂*, a cheap Direct-Air-Capture (DAC) breakthrough occurs. Industry groups argue for lowering taxes now (since DAC solves the stock problem), while credibility hawks argue sticking to the plan is vital to avoid sunk-cost fallacies later. At *t₃*, preferences cycle back due to investment uncertainty.

  **Task:**
  1.  Construct a diachronic money-pump argument showing how industry groups can extract concessions cyclically.
  2.  Explain why this is a structural failure of diachronic consistency, not mere political hypocrisy.
  3.  Compare this to the classic Strotz-style money pump.
  4.  Evaluate whether an independent carbon board solves this or just moves the pump one level up.

  ***

  ### Model Answer

  The green-transition lock-in paradox illustrates how rational choice constraints, when applied to institutions over time, generate vulnerability to exploitation similar to individual agents. The money pump operates through preference reversals driven by external technological shocks and internal lobbying pressure. At *t₁*, the state prefers High Tax (HT) to ensure transition. At *t₂*, the DAC breakthrough makes Low Tax + DAC (LT) appear strictly dominant due to lower immediate economic pain. Industry lobbies pay costs to shift policy to LT. At *t₃*, the credibility loss from abandoning *t₁* commitments raises capital costs, making HT preferred again. Industry pays to shift back. The state ends up where it started but poorer due to lobbying concessions and policy volatility costs.

  This is not hypocrisy because hypocrisy implies a deliberate intent to deceive while holding stable preferences. Here, the preferences themselves reverse due to changing constraints and information, consistent with rational updating but inconsistent diachronically. The state acts rationally at each node given current information, yet the sequence is globally irrational. This is a structural failure because the institutional decision-making architecture lacks a mechanism to bind future selves against locally optimal but globally suboptimal revisions.

  Comparing this to the classic Strotz-style money pump reveals key parallels and divergences. Strotz describes an individual with hyperbolic discounting who prefers a larger-later reward at *t₁* but switches to a smaller-sooner reward at *t₂*. The climate pump is structurally identical: the state discounts future credibility for present relief at *t₂*. However, the mechanism differs. Strotz relies on psychological time-inconsistency; the climate pump relies on informational updates (DAC breakthrough) and principal-agent problems (industry lobbying). The "utility function" of the state changes not because of neural discounting, but because the political cost function shifts with technological availability.

  Regarding pre-commitment, an independent carbon board attempts to bind the state at *t₁* against revisions at *t₂*. If the board has statutory immunity, it blocks the pump by removing the choice node. However, this often just moves the pump one level up. The legislature can defund the board, override its mandates, or appoint compliant members at *t₀*. If the board is truly immutable, it creates a democratic deficit, shifting the inconsistency to the constitutional level. If it is mutable, the lobbying pressure simply targets the board's oversight mechanism rather than the tax rate directly. Thus, unless the pre-commitment device is costless to overturn, the money pump remains viable, merely requiring higher lobbying expenditures to trigger the institutional override. The structural inconsistency persists because the sovereign cannot fully bind its future sovereign self without ceasing to be sovereign.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Money-Pump Construction (5 Marks)**
  *   **A (5):** Clearly maps the cycle (HT → LT → HT) and identifies the cost extraction (lobbying/concessions) that makes the state worse off.
  *   **B (3):** Describes the preference reversal but misses the "pump" aspect (extraction of value/worse-off outcome).
  *   **C (1):** Vague description of policy change.

  **2. Structural vs. Hypocrisy (5 Marks)**
  *   **A (5):** Explicitly distinguishes intent (hypocrisy) from preference reversal (structural). Notes rational updating at each node.
  *   **B (3):** Identifies it as structural but conflates it with corruption or weakness.
  *   **C (1):** Treats it as purely political dishonesty.

  **3. Strotz Comparison (5 Marks)**
  *   **A (5):** Recognizes the isomorphism (time inconsistency) but highlights the difference (psychological vs. institutional/informational).
  *   **B (3):** Summarizes Strotz correctly but fails to apply the distinction to the institutional context.
  *   **C (1):** Generic mention of "time inconsistency."

  **4. Pre-Commitment Evaluation (5 Marks)**
  *   **A (5):** Argues the board moves the pump up (constitutional/legislative level) or creates democratic deficits. Recognizes sovereign binding problem.
  *   **B (3):** Argues the board solves the problem without addressing override risks.
  *   **C (1):** Simple yes/no without justification.

  **Note:** To secure an A, students must recognize that the pump works across *institutional* time rather than individual time, and see why the board might itself be pumped. Simply summarizing Strotz caps the grade at a B.
