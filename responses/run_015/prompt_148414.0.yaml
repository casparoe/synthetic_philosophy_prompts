      *Most likely interpretation:* The user intends for the experts to signal *before* the group finalizes their thinking, which undermines the private survey. I need to clarify that *any* public signal before the decision is locked creates cascade risk.
      *Actually, looking closer:* "everyone submits their pick in a private survey... Then... we do one round where the couple of people who voted against the majority have to explain."
