  8.  **Refining the Math (Self-Correction during drafting):**
      *   Need to be careful not to overpromise on specific numbers. The "odds" depend entirely on individual competence ($p$).
      *   If $p > 0.5$, Jury Theorem says larger groups are better *if independent*.
