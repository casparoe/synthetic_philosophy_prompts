answer: |-
  Your suspicions are well-founded. Your friend's summary conflates *lex lata* (the law as it currently exists) with *lex ferenda* (the law as some argue it should be), and it merges two distinct treaties with different ratification statuses. While her position represents a coherent *ethical* framework, she presents it as settled *legal* doctrine.

  Here is an audit of her claims, distinguishing between accurate treaty text, mainstream legal interpretation, and normative philosophical proposals.

  ### Claim-by-Claim Audit

  **Claim 1:** *The Outer Space Treaty (OST) designates space as the province of all mankind.*
  *   **Status:** **Accurate.**
  *   **Analysis:** Article I of the 1967 Outer Space Treaty states that the exploration and use of outer space "shall be the province of all mankind." This is the foundational text.
  *   **Nuance:** While the phrasing is correct, the legal weight of "province of all mankind" is debated. It establishes a principle of freedom of access and benefit-sharing, but it is less legally restrictive than the "Common Heritage of Mankind" language found in later treaties.

  **Claim 2:** *Legal scholars have developed this into a positive doctrine of distributive justice requiring an international licensing body with a capacity-weighted equity formula.*
  *   **Status:** **Misrepresentation.**
  *   **Analysis:** There is no such "positive doctrine" in current international law. No international licensing body exists, and no such formula is legally binding. This sounds like a specific normative proposal from academic literature (perhaps drawing on Rawlsian justice or specific space law theorists), not established law.
  *   **Nuance:** The *Moon Agreement* (1979) proposed an "international regime" to govern resource exploitation when it became feasible, but it never defined a "capacity-weighted equity formula," and crucially, no major spacefaring nation has ratified the Moon Agreement.

  **Claim 3:** *The treaty binds private corporations directly rather than merely the states that charter them.*
  *   **Status:** **Misrepresentation.**
  *   **Analysis:** Under traditional international law, states are the primary subjects, not corporations. OST Article VI establishes that States bear international responsibility for national activities in space, "whether carried out by governmental agencies or by non-governmental entities."
  *   **Nuance:** This creates an obligation on the *State* to authorize and continually supervise private actors. If a corporation violates the treaty, the *State* is in breach of international law for failing to supervise, but the corporation is not directly liable under the treaty itself (though it may be liable under domestic law).

  **Claim 4:** *Companies that assert exclusive rights to lunar landing zones are already in breach of international law.*
  *   **Status:** **Contested/Overstated.**
  *   **Analysis:** OST Article II prohibits "national appropriation" by claim of sovereignty. It does not explicitly prohibit private exclusive *use*. The U.S. (via the Artemis Accords and 2020 Executive Order) argues that "safety zones" around landing sites are necessary for operations and do not constitute sovereignty. Other nations and scholars disagree.
  *   **Nuance:** Because there is no international court with compulsory jurisdiction over this matter, there is no adjudicated "breach." It is a legal gray zone, not a settled violation.

  **Claim 5:** *The treaty frames celestial bodies as part of the common heritage of humankind.*
  *   **Status:** **Misrepresentation (Conflation).**
  *   **Analysis:** The Outer Space Treaty uses the phrase "province of all mankind." The phrase "Common Heritage of Mankind" (CHM) appears in the *Moon Agreement* (1979).
  *   **Nuance:** This is the critical error in her argument. CHM implies a stronger restriction on appropriation and a mandatory benefit-sharing regime. Because the U.S., China, Russia, and other major space actors have *not* ratified the Moon Agreement, CHM is not considered customary international law binding on space settlement activities.

  **Claim 6:** *This entails an intergenerational obligation.*
  *   **Status:** **Ethically Plausible, Legally Weak.**
  *   **Analysis:** Both "province of all mankind" and CHM imply that space is for everyone, which ethicists argue includes future generations. However, the OST does not explicitly codify an "intergenerational obligation" with the legal force she implies.
  *   **Nuance:** This is a strong philosophical interpretation, often used in environmental ethics, but it is not a specific statutory mandate in the OST that prohibits permanent infrastructure.

  **Claim 7:** *Any colony leaving irreversible ecological footprints effectively appropriates that body... in precisely the territorial manner the treaty prohibits.*
  *   **Status:** **Philosophical Argument, Not Legal Fact.**
  *   **Analysis:** OST Article IX requires states to avoid "harmful contamination" of celestial bodies. This is the basis for Planetary Protection protocols. However, equating environmental change with "territorial appropriation" (Article II) is a conceptual leap.
  *   **Nuance:** One can alter an environment without claiming sovereignty over it (e.g., a scientific base that leaves footprints). Her argument conflates *planetary protection* (environmental ethics) with *non-appropriation* (property/sovereignty law).

  **Claim 8:** *Ethical space activity must be confined to temporary scientific missions with no permanent infrastructure.*
  *   **Status:** **Does Not Survive Correction.**
  *   **Analysis:** Since the legal premises (CHM status, direct corporate liability, existing licensing regimes) are incorrect, the legal conclusion fails.
  *   **Nuance:** As an *ethical* conclusion, it holds weight within specific frameworks (e.g., deep ecology or strict egalitarianism), but it is not mandated by the current legal regime, which explicitly envisions "use" and "exploration" without limiting them to temporary missions.

  ---

  ### Specific Inquiry: The "Capacity-Weighted Equity Formula"

  **Is this a real legal interpretation or an invented normative proposal?**

  It is an **invented normative proposal**. You will not find a "capacity-weighted equity formula" in the text of the Outer Space Treaty, the Moon Agreement, or the Artemis Accords.

  This language likely stems from academic discourse on *distributive justice*. Some legal philosophers argue that if space resources are "common heritage," benefits should be redistributed based on need or capacity (similar to proposals for a "Global Commons Trust"). While scholars like **Christoforos Zebardast**, **Fabio Tronchetti**, or political philosophers like **John Rawls** (applied to space by others) might discuss equitable benefit-sharing, there is no consensus doctrine that mandates a specific mathematical formula for redistribution. Presenting this as existing law is a category error.

  ### Specific Inquiry: Irreversible Ecological Change vs. Territorial Sovereignty

  **Is irreversible ecological change genuinely analogous to territorial sovereignty?**

  **Legally: No.**
  In international law, *sovereignty* implies exclusive political jurisdiction and the right to exclude others. *Environmental impact* implies physical alteration. You can have one without the other. For example, a scientific mission could leave irreversible footprints (contamination) without claiming sovereignty. Conversely, a state could claim sovereignty without altering the environment. The OST treats these as separate articles (Article II for appropriation, Article IX for contamination).

  **Ethically: Debatable.**
  Your friend is making a Lockean argument in reverse: rather than "mixing labor" creating property rights, she argues "mixing labor" (altering ecology) creates a duty of stewardship that precludes exclusion. Some environmental ethicists argue that irreversible alteration *is* a form of appropriation because it denies future generations the choice of a pristine environment. However, this is a moral claim, not a legal definition. If accepted, it would arguably ban almost all human activity, including current satellite orbits (which create space debris, an irreversible footprint).

  ### Conclusion: Does the Prohibition on Settlement Survive?

  **No, the categorical prohibition on settlement does not survive the correction of these misrepresentations.**

  1.  **Legal Viability:** The Outer Space Treaty does not prohibit permanent settlement. It prohibits *sovereignty claims*. A settlement can exist under the jurisdiction of the launching state (Article VIII) without that state claiming the territory itself. The distinction is between *jurisdiction over objects/personnel* (allowed) and *sovereignty over the land* (prohibited).
  2.  **Ethical Viability:** Your friend's ethical conclusion relies on the premise that "use" equals "appropriation." If one accepts a utilitarian framework (space settlement benefits humanity through resource expansion and survival), her prohibition fails. If one accepts a strict preservationist framework, her conclusion holds ethically, but it remains an ethical preference, not a legal mandate.
  3.  **The "Strong Anti-Appropriation" View:** This view exists in academic literature (often associated with the "Common Heritage" camp), but it is a minority position in current state practice. The prevailing trend (Artemis Accords, Luxembourg Space Resources Law, U.S. Executive Order 13914) is moving toward recognizing private property rights in *extracted resources* while maintaining the ban on territorial sovereignty.

  **Summary for your discussion:** Your friend has constructed a logically consistent *ethical* argument but has dressed it in the clothing of *positive law*. She is correct that the OST emphasizes the benefit of all mankind, but she is incorrect that this legally mandates a redistributive licensing body, binds corporations directly, or equates ecological footprints with sovereignty. The treaty permits permanent presence; it merely forbids claiming the land as national territory.
