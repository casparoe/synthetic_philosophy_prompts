      *   *Specific Issues:*
          *   FH Tension: Address the "means" argument. The murderer uses the truth, but the truth-teller doesn't will the murder.
          *   Ambiguity: Kant allows this. It's not evasion; it's recognizing the limits of the duty.
          *   Perfect/Imperfect: This is the missing key. The duty of veracity is a perfect duty to oneself. The duty to save the friend is an imperfect duty of virtue. Perfect duties trump imperfect duties.

  5.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Correction on M1:* Marcus says the universalization *covertly depends* on harm. This is the "Contradiction in Will" vs. "Contradiction in Conception" debate. In the *Groundwork*, lying is usually a Contradiction in Conception. In the 1797 essay, Kant focuses on the *wrong* done to humanity in one's own person. Marcus's claim that it relies on "social contract" is weak. Kant isn't Hobbes. I should rate this as *Mistaken* regarding Kant's actual argument, even if it's a common critique.
