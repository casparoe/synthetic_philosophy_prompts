      *   *Correction on M3 (FH Tension):* This is the strongest philosophical point. Christine Korsgaard famously argues FH *does* require lying here. But Kant says no. So Marcus is right that there is a *tension* in the system, but wrong that Kant *admits* it or that it's *unresolved* for Kant. I will rate this as *Insightful but Textually Mistaken*.
      *   *The "Missing" Piece:* The 1797 essay is part of the *Doctrine of Right* (Rechtslehre), not just the *Doctrine of Virtue*. It's about juridical truth-telling (oaths, contracts) applied to a hypothetical case. The "Right" to lie implies a juridical claim. The murderer has no juridical right to the truth. This strengthens Leah's "perfect duty" claim but adds a legalistic layer neither fully captured.

  6.  **Finalizing the Ratings:**
      *   L1: Clearly Right.
      *   M1: Mostly Mistaken (conflates logical contradiction with empirical consequence).
