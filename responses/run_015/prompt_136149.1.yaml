      *   **Missing Element (Perfect vs. Imperfect):** Leah mentions perfect duty. Marcus mentions duty to self. Neither fully fleshes out the *juridical* vs. *ethical* distinction Kant makes in the *Doctrine of Right* (where this essay appears). The "Right to Lie" essay is actually about *Right* (law/coercion), not just *Virtue*. The murderer has no *right* to the truth. This is crucial.

