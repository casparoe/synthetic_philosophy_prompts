          5.  Core Concept: "The ask of the file" (archives answer specific administrative questions, not human ones) and "Three Silences" (unasked, unkept, unfindable). Digitisation only addresses the third (unfindable).
      *   **Specific Instruction:** Take a definite position on whether to state plainly that digitisation only addresses the third silence or encode it. Explain the choice.
      *   **Addendum:** A note (max 200 words) explaining the line committed to, reliance on contested readings, and expected strongest objection.

  2.  **Deconstruct the Core Tension:**
      *   *The Truth:* The archives are colonial administrative tools. They record tax defaulters, not human stories. Digitisation makes them accessible (fixes "unfindable"), but doesn't change the nature of the record (doesn't fix "unasked" or "unkept").
      *   *The Diplomacy:* There are donors who paid for digitisation. There are ministers. There are descendants who might want to feel their ancestors are being "honored" or "restored."
      *   *The Ethics:* As an archivist, I believe in not lying about the nature of the record. To say "we are restoring voices" is professionally dishonest given the "ask of the file" theory.
      *   *The Decision:* Do I say plainly "this only fixes access, not content"?
          *   *Option A (Plain):* Risks sounding ungrateful to donors and cold to families. Might overshadow the minister.
          *   *Option B (Encoded):* Risks being vague or dishonest.
          *   *Option C (Reframed):* Acknowledge the limitation without using the academic jargon ("three silences"). Focus on *access* and *context* rather than *restoration*.
      *   *My Choice:* I will choose to encode the point about silences but not hide the truth about access. I will not use the terms "unasked/unkept/unfindable." Instead, I will focus on the distinction between *presence* and *perspective*. The names were always present; now the *view* is clearer. This honors the constraint (no "restoring voices") without insulting the donor (who enabled access) or the family (who deserve truth). I will not explicitly say "this only addresses the third silence" because that is jargonistic and potentially churlish in a diplomatic setting. Instead, I will describe the *effect* of digitisation: removing distance, not changing the document's nature. This is not cowardice; it is translation for a public audience.

  3.  **Drafting the Speech:**
