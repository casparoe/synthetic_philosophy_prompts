  Grading will be out of twenty points divided across five criteria described here. Four points are awarded for correctly articulating the simultaneity of the double movement without collapsing resignation into belief. Students often fail here by treating them as sequential steps where resignation happens first and is then discarded for belief. Four points are assigned for selecting and defending one of the three models of suspension. The common error is to claim the universal is simply outweighed, which turns faith into a utilitarian calculation rather than a qualitative leap. Four points depend on analyzing the silence as internal to the structure of faith rather than a communicative failure. Students frequently argue Abraham should have spoken to prevent trauma, missing that speech belongs to the universal ethical which he has suspended. Four points are given for acknowledging Johannes de Silentio's pseudonymous limitation. A typical mistake is writing as if we have direct access to Abraham's psychology, ignoring that Silentio claims he cannot understand faith. The final four points assess the coherence of the overall argument in holding the paradox without resolving it too neatly. Students often lose points here by providing a Hegelian synthesis that removes the fear and trembling, thereby missing the point of the text.
