prompt: |-
  I work in pricing at a life insurer, and I've been pulled onto a small internal committee that has to sign off on single-case probability statements: for an individual applicant we have to file a number — the probability that this person survives to ninety — and our regulator wants to know which population we derived it from. The same applicant can be placed in a broad class (all fifty-five-year-old nonsmokers), or in successively narrower ones (fifty-five-year-old nonsmoking men with treated hypertension, in a given occupation, at a given income band), and the observed frequencies in those classes disagree, sometimes by enough to move the premium by more than our entire margin on the policy. Anyone can always add one more attribute — the applicant's commute, their year of birth, their mother's age at death — and narrow the class until it contains almost no one, at which point the frequency is either undefined or trivially zero or one. Whoever picks the class effectively picks the price, and I don't yet know what should constrain the picking.

  A colleague on the committee, who came from physics, says we are overthinking it. His line is that the reference class is like a coordinate chart on a manifold: the chart is our choice, the point — this applicant — is not, and the quantity we are after is a coordinate-independent object that every admissible chart describes correctly in its own vocabulary. On that picture the choice of class is mere descriptive bookkeeping, there is one true single-case probability underneath, and any class that satisfies our data-quality rules is as good as any other one for computing it. He has even sketched what he thinks the analogue of the transition maps should be: a consistency requirement saying that whenever two admissible classes both contain the applicant, they must yield the same frequency for the outcome, in which case the class you pick cannot change the answer — and if two classes do disagree, that is only evidence that one of them was not really admissible.

  I find the picture appealing but suspicious, and I would like it audited rather than either accepted or waved away. Please lay the correspondence out explicitly — a table is fine — saying what plays the manifold, the point, the chart, the transition maps, and the invariant, and then where the mapping fails; please separate the failures that matter for the work this analogy is being asked to do from the ones that are merely decorative. In particular: is his consistency condition something our data could ever satisfy, or is it the conclusion restated as an axiom? In the coordinate case every chart is equally legitimate and there is no notion of a better one, whereas in our case some classes look plainly better than others — narrower and more homogeneous, yet still large enough to estimate a frequency from — and I cannot see what plays that in his picture, especially when the analogy is being used to argue that our choice is unconstrained. And is the single-case probability really like curvature, waiting to be read off in any notation, or is it something the analogy quietly assumes? If the coordinate picture is the wrong one, is there a comparison that fits better — choosing a resolution or grain, choosing a sampling frame, choosing what total to divide by? Finally, given that we still have to file a number next quarter, say what the audit recommends: does any version of "any admissible class will do" survive, and if not, what rule for choosing a class should we actually adopt, and what would justify that rule to a regulator?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Problem:**
      *   **Context:** Life insurance pricing (actuarial science).
      *   **Task:** Assign a single-case probability of survival to age 90 for a specific individual applicant.
      *   **Constraint:** Regulator requires stating the reference population used.
      *   **Dilemma:** Different reference classes (broad vs. narrow) yield different probabilities, affecting premiums significantly. Narrowing classes too much leads to data sparsity (overfitting/undefined frequencies).
      *   **Colleague's Argument (Physics Analogy):** Reference class = Coordinate chart. Individual = Point on a manifold. Probability = Coordinate-independent invariant (like curvature). Consistency condition = Transition maps (different classes should yield same probability). Conclusion: Choice of class is bookkeeping; any "admissible" class works; disagreement means bad data/class.
      *   **User's Skepticism:** The analogy feels suspicious. Classes *aren't* equally good (some are too narrow, some too broad). The "invariant" probability might not exist. The consistency condition sounds circular.
      *   **Request:** Audit the analogy. Map the concepts (Manifold, Point, Chart, Transition, Invariant). Identify where it fails (critical vs. decorative). Answer specific questions about the consistency condition and the existence of the "true" probability. Suggest a better analogy if needed. Provide a concrete recommendation for the committee/regulator.

  2.  **Analyze the Physics/Geometry Analogy:**
      *   *Manifold:* The space of all possible "states of reality" or "risk profiles."
      *   *Point:* The specific applicant.
      *   *Chart:* The reference class (the grouping attributes).
      *   *Coordinates:* The specific probability value derived from that class.
      *   *Invariant:* The "True Single-Case Probability."
      *   *Transition Maps:* Rules to convert probabilities from one class to another.
      *   *Critique:* In differential geometry, charts cover the *same* underlying reality. A point *has* coordinates in every chart, and they transform smoothly. In probability, the reference class *defines* the measure. There is no underlying "probability fluid" attached to the individual independent of the class. The "True Single-Case Probability" is a metaphysical assumption (Propensity vs. Frequency), not a geometric fact. The consistency condition (different classes yield same frequency) is empirically false in almost all real-world data (Simpson's Paradox, confounding).

  3.  **Drafting the Audit (Step-by-Step):**

      *   **Table of Correspondence:** Create a clear mapping between the colleague's physics terms and the actuarial reality.
      *   **Identify Failures:**
          *   *Failure 1: The Invariant.* Does a "true" single-case probability exist? (Reference Class Problem). In frequentist terms, no. In Bayesian/Propensity terms, maybe, but it's unobservable. The analogy assumes it exists to prove it exists.
          *   *Failure 2: Transition Maps.* In geometry, $x' = f(x)$. In pricing, $P(Class A) \neq P(Class B)$. There is no mathematical function that equates them without external causal assumptions.
          *   *Failure 3: Equivalence of Charts.* In geometry, all smooth charts are valid. In pricing, a class with $N=5$ is not valid compared to $N=50,000$. Bias-Variance trade-off exists here; it doesn't in coordinate charts.
          *   *Failure 4: The Consistency Condition.* This is the crux. The colleague says "If they disagree, one is inadmissible." This is circular. It defines admissibility by the result, not the data quality.

      *   **Critical vs. Decorative Failures:**
          *   *Decorative:* Manifold smoothness, dimensionality.
          *   *Critical:* The existence of the invariant, the equivalence of charts, the consistency condition. These undermine the core argument that "choice doesn't matter."

      *   **Addressing Specific Questions:**
          *   *Consistency Condition:* Is it satisfiable? No, not with observed frequencies. It's an axiom, not an empirical finding.
          *   *Better Classes:* The analogy ignores the Bias-Variance tradeoff. Narrow = Low Bias, High Variance. Broad = High Bias, Low Variance.
          *   *Better Analogy:* Signal Processing (Resolution/Grain) or Causal Inference (Stratification).

      *   **Recommendation:**
          *   Reject the "any admissible class" doctrine.
          *   Adopt a specific selection rule (e.g., Predictive Stability, Credibility Theory, or Causal Relevance).
          *   Justification to Regulator: Transparency about the trade-off, not false precision.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Tone:* Professional, rigorous, respectful of the colleague but firm on the math.
      *   *Philosophy:* Acknowledge the "Reference Class Problem" (Reichenbach).
      *   *Actuarial Science:* Bring in credibility theory (Z-factor) or GLMs (Generalized Linear Models) as the actual technical solution, contrasting with the colleague's geometric idealism.
      *   *Regulatory Angle:* Regulators care about fairness and solvency, not metaphysical truth. They want a *justifiable* method, not a *true* number (which is unknowable).

  5.  **Final Polish:**
      *   Ensure the table is clear.
      *   Make sure the "Critical Failures" section hits hard on the "Consistency Condition."
      *   Provide a concrete "Next Quarter" action plan.

  **(Self-Correction during drafting):** I need to make sure I don't just say "he's wrong." I need to explain *why* the geometry fails. Geometry assumes the object exists independently of the measurement. Probability (frequentist) is *defined* by the measurement (the class). If we switch to Bayesian subjective probability, the "invariant" is the agent's belief, but the "charts" (data) still update that belief differently. The colleague is conflating *ontological reality* (the person) with *epistemological measurement* (the risk class).

  Let's structure the response:
  1.  Executive Summary (The Verdict).
  2.  The Correspondence Table.
  3.  Audit of the Mapping (Where it breaks).
  4.  Critical vs. Decorative Failures.
  5.  Addressing the Specific Questions (Consistency, Invariant, Better Analogy).
  6.  Recommendation for the Committee/Regulator.

  *Key Insight to highlight:* The colleague is treating probability as a *property of the person* (like mass). In insurance pricing, probability is a *property of the relationship between the person and the pool*. You cannot separate them.

  *Actionable Advice:* Use Credibility Weighting (Z-factor). It explicitly handles the "narrow vs. broad" tension mathematically, unlike the "pick one chart" approach.

  *Regulatory Justification:* "Best Estimate" + "Margin for Uncertainty." Acknowledge the class choice introduces uncertainty.

