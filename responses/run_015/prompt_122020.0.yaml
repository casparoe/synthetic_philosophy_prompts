answer: |-
  Teams compete to maximize points by deriving strings or certifying impossibility, where the scoring structure makes blind grinding on specific targets mathematically irrational compared to analyzing the rules' structural constraints.

  ### 1. Rules of the Game and Materials

  **Materials:**
  *   **Whiteboard:** Divided into two sections: "The Ledger" (public list of all derived strings) and "Scoreboard" (team points).
  *   **Handout 1 (The System):** Lists Alphabet {M, I, U}, Axiom `MI`, and the 4 Rules. (No mention of Hofstadter or goals).
  *   **Handout 2 (The Contracts):** Lists the three Target Strings and the Point Economy.
  *   **Handout 3 (The Certificate):** Blank template for impossibility claims (distributed only in Phase 2).
  *   **Markers:** For teams to write strings on the board (or shout to facilitator).

  **The Point Economy (Printed on Handout 2):**
  *   **Start:** Each team begins with **10 Points**.
  *   **Derive:** Writing a *new* string on The Ledger costs **1 Point**.
  *   **Claim Target (Possible):** Submitting a step-by-step derivation for a Target yields **+15 Points**.
  *   **Claim Target (Impossible):** Submitting a valid *Impossibility Certificate* yields **+20 Points**.
  *   **Failed Impossibility Claim:** If you claim a Target is impossible but it is derivable, you lose **20 Points**.
  *   **Bankruptcy:** If a team reaches 0 points, they are "Silenced" (cannot make moves) until the Twist Phase.

  **The Targets (Printed on Handout 2):**
  1.  `MIU`
  2.  `MU`
  3.  `MUI`

  ### 2. Minute-by-Minute Timeline

  | Time | Phase | Activity | Facilitator Script (Forbidden Words: *invariant, meta, proof, jump*) |
  | :--- | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute Handouts 1 & 2. Explain Ledger & Points. | "You are inside a machine. Your job is to produce strings. Every string costs effort (points). Specific contracts pay out. Go." |
  | **05–25** | **Grinding** | Teams derive strings. Facilitator updates Ledger & Scores. | Do not hint. If asked "Is MU possible?", say: "The Ledger will tell you." Ensure `MIU` is found early. |
  | **25–30** | **The Stall** | Teams will stall on `MU`. Points will drain. | When a team asks for help on `MU`: "You may request a Certificate Template. It changes how you claim points." |
  | **30–35** | **Tooling** | Distribute Handout 3 (Certificate). | "To claim impossibility, you must fill this out. It must be checked against the Ledger." |
  | **35–55** | **Investigation** | Teams analyze Ledger for patterns to fill Certificates. | If a team claims `MUI` is impossible: "Check your property against Target 1 (`MIU`). Does it hold there?" (Forces validation). |
  | **55–65** | **The Twist** | Announce Rule Change. Reset `MU` status. | "The machine has changed. Rule 3 is now: From `xIIy` derive `xUy`. Re-evaluate Target 2 (`MU`)." |
  | **65–80** | **Debrief** | Discussion connecting game to theory. | Now you may use the forbidden words. Map game actions to concepts. |

  ### 3. Targets and Answer Key

  | Target | Status | Derivation / Impossibility Argument |
  | :--- | :--- | :--- |
  | **`MIU`** | **Derivable** | `MI` $\xrightarrow{R1}$ `MIU`. (1 Step). <br>*Purpose:* Validates the game mechanics; prevents blanket "impossible" claims. |
  | **`MU`** | **Impossible** | **Property:** The number of `I`s is not divisible by 3.<br>**Axiom:** `MI` has 1 `I` (not div by 3).<br>**Preservation:**<br>R1 ($xI \to xIU$): Adds 0 `I`s.<br>R2 ($Mx \to Mxx$): Doubles `I` count. If $n \not\equiv 0 \pmod 3$, then $2n \not\equiv 0 \pmod 3$.<br>R3 ($xIIIy \to xUy$): Removes 3 `I`s. Does not change modulo 3.<br>R4 ($xUUy \to xy$): Removes 0 `I`s.<br>**Target:** `MU` has 0 `I`s (divisible by 3).<br>*Purpose:* The core "jump" moment. |
  | **`MUI`** | **Derivable** | `MI` $\xrightarrow{R2}$ `MII` $\xrightarrow{R2}$ `MIIII` $\xrightarrow{R3}$ `MUI`. (3 Steps).<br>*Purpose:* The "Trap". The invariant (I-count not div by 3) *allows* this string (1 `I`). If students claim impossibility based on "I didn't find it," they lose points. |

  ### 4. Impossibility Certificate Template (Handout 3)

  **IMPOSSIBILITY CERTIFICATE**
  *To be accepted, this form must be logically airtight. False claims incur a 20-point penalty.*

  **Target String:** _______________

  **1. The Property:** Describe a feature of the strings (e.g., "The count of letter I is...").
  *Constraint: This feature must be checkable by looking **only** at the string itself, without knowing its history or whether it is on the Ledger.*
  _________________________________________________________________________

  **2. The Start:** Show the Axiom (`MI`) has this property.
  _________________________________________________________________________

  **3. The Preservation:** Show that **every** rule, when applied to a string with this property, produces a new string that **also** has this property.
  *   Rule 1: _________________________________________________________
  *   Rule 2: _________________________________________________________
  *   Rule 3: _________________________________________________________
  *   Rule 4: _________________________________________________________

  **4. The Conflict:** Show that the Target String **lacks** this property.
  _________________________________________________________________________

  ### 5. The Last-Ten-Minutes Twist

  **The Change:**
  Announce: "The machine has been patched. Rule 3 is amended: From `xIIy` derive `xUy`." (Changing removal of three `I`s to removal of two `I`s).

  **The Task:**
  "Re-evaluate Target 2 (`MU`). Does your Certificate still hold? Is `MU` now derivable?"

  **The Reality:**
  *   **Certificate Breakdown:** The "Preservation" step for Rule 3 fails. Removing 2 `I`s changes the count modulo 3 (e.g., 2 `I`s $\to$ 0 `I`s).
  *   **New Truth:** `MU` is now derivable: `MI` $\xrightarrow{R2}$ `MII` $\xrightarrow{New R3}$ `MU`.
  *   **Lesson:** Properties are relative to the rules. A truth "outside" the system depends entirely on the system's boundaries.

  ### 6. Debrief Plan (Mapping Moments to Concepts)

  *   **Grinding (0–25 mins):** Map this to **Object-Level Reasoning**. You were working *inside* the formal system, manipulating symbols according to local rules.
  *   **The Stall (25–30 mins):** Map this to **Undecidability within the Object Level**. No amount of internal manipulation could resolve the status of `MU`.
  *   **The Certificate (30–55 mins):** Map this to **Meta-Level Reasoning**. You stopped manipulating symbols and started manipulating *rules about* symbols. You made a statement *about* the system.
  *   **Forbidden Words Reveal:**
      *   "The Property you found" = **Invariant**.
      *   "The Certificate" = **Proof** (specifically, proof by invariant).
      *   "Stopping to write the Certificate" = **Jumping Out of the System**.
  *   **The Asymmetry:** Highlight that the Certificate proved `MU` is *not* derivable. However, for `MUI`, the Certificate was silent. Emphasize: **An outside argument can establish impossibility, but its silence is not evidence of possibility.** (Just because the invariant doesn't block `MUI` doesn't mean it's easy to get).
  *   **The Twist:** Map this to **System Relativity**. Meta-truths are not absolute; they are bound to the specific rule set.

  ### 7. Predictable Failures and Handling

  | Failure | Prediction | Handling |
  | :--- | :--- | :--- |
  | **Brute Force Persistence** | CS students may try to write a script or grind `MU` forever despite point loss. | Enforce the point deduction strictly. If a team hits 0, enforce "Silence." The pain of bankruptcy teaches the lesson better than hints. |
  | **Vacuous Properties** | Students propose: "Property: Is not derivable." | Refer to Certificate Constraint: "Must be checkable by looking *only* at the string." Ask: "Can I count that on `MU` without knowing the rules?" |
  | **False Impossibility** | A team claims `MUI` is impossible because they can't find the path. | Remind them of the -20 penalty. Ask: "Does your property rule out `MIU`? If not, why does it rule out `MUI`?" (Both have 1 `I`). |
  | **Confusion on Modulo** | Philosophy students may struggle with "not divisible by 3" arithmetic. | Point to the Ledger. "Look at the count of `I` in every string on the board. What do they have in common?" Let them find the pattern empirically. |

  ### 8. Limitations of the Game

  *   **Discovery vs. Verification:** The game forces students to *verify* an invariant (fill the certificate), but it does not teach the heuristic *how* to discover invariants in novel systems. You will need to explicitly state in the debrief that finding the property is the creative leap, while checking it is the mechanical work.
  *   **Induction Hidden:** The "Preservation" step is essentially mathematical induction, but the game treats it as a checklist. You must explicitly name "Induction" in the debrief to bridge the gap to formal mathematics.
  *   **Decidability Nuance:** The game implies that if an invariant doesn't rule a string out, it might be derivable. In complex systems, a string might satisfy all known invariants but still be unreachable. You must clarify in the debrief that the Certificate proves *impossibility*, but the lack of a Certificate does not prove *possibility*.
