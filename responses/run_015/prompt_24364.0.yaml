      *   **Key Scientific Contribution:** Championed the "spandrels" argument (Gould & Lewontin), skepticism of adaptationism, focus on byproducts/exaptation.
      *   **Key Metaphor:** St. Mark's Basilica spandrels (architectural byproducts later used for art).
      *   **Audience:** Split room. Half agree with him (students/skeptics of adaptationism), half respect him but disagree (colleagues/pro-adaptationists).
      *   **Constraint 1:** Do not take a hard side in the scientific debate (avoid starting a fight).
      *   **Constraint 2:** Avoid contradicting his core philosophy (don't just say "his life had a clear purpose" in a naive way).
      *   **Constraint 3:** Must be readable aloud, accessible to family/non-scientists, but respectful to scientists.
      *   **Deliverable 1:** The Eulogy.
      *   **Deliverable 2:** A private note to the user explaining the scientific context (what's settled vs. contested) and flagging potential contentious points in the speech.

  2.  **Deconstruct the Tension:**
      *   *The Paradox:* A eulogy asserts meaning/purpose. The professor argued against assuming purpose/design in biology.
      *   *The Resolution:* Frame his *life's work* as a pursuit of truth and rigor, rather than framing his *biological conclusions* as the ultimate purpose. Focus on the *quality* of his questioning rather than the *answer* he settled on. Use the spandrel metaphor reflexively: perhaps *he* was the spandrel, or perhaps his legacy is the *questioning* itself, not the specific answer.
      *   *Better Approach:* Acknowledge the tension. "He taught us not to assume purpose, yet here we are looking for his." This honesty bridges the gap. It honors his intellect without forcing a scientific consensus that doesn't exist.

  3.  **Drafting the Eulogy - Section by Section:**
      *   *Opening:* Acknowledge the setting and the difficulty. Connect the personal loss to the professional legacy.
      *   *The Science (Simplified):* Explain the spandrel concept without jargon. Use the St. Mark's example (as requested). Make it about *curiosity* and *caution*.
      *   *The Tension (The Core):* Address the "purpose" paradox directly. "He warned against seeing design where there is none." But pivot to how his *rigor* was a form of care for the truth.
      *   *The Audience Split:* Acknowledge the debate without reigniting it. "Some of you argued with him..." Frame the arguments as a sign of respect and engagement. Science happens *through* disagreement.
      *   *The Personal:* Bring it down to the human level. How he treated students, his passion.
      *   *Closing:* A metaphorical send-off. The legacy isn't the answer, it's the better question.

  4.  **Refining the Tone:**
      *   Needs to be warm but intellectual.
      *   Avoid saying "He was right." Say "He was rigorous."
      *   Avoid saying "Adaptationism is wrong." Say "He challenged us to look deeper."
      *   Ensure the family feels included (focus on his character, not just his papers).

  5.  **Drafting the Private Note:**
      *   *Goal:* Educate the user on the current state of evolutionary biology regarding spandrels/exaptation.
      *   *Settled Science:* Exaptation is real. Not everything is an adaptation. Gould & Lewontin were right to criticize "Panglossian" adaptationism.
      *   *Contested:* The *frequency* or *prevalence*. How many traits are spandrels vs. adaptations? This is the gray area where his colleagues disagree.
      *   *Flagging Speech Points:* Identify where the eulogy might lean too close to his view (e.g., implying adaptationism is a "habit" or "lazy") and suggest softening if needed.

  6.  **Review and Polish (Self-Correction during drafting):**
      *   *Critique:* Is the eulogy too abstract?
      *   *Fix:* Add a specific memory or feeling about his teaching style (the "twinkle in his eye," the "pause before answering").
      *   *Critique:* Does it solve the purpose paradox?
      *   *Fix:* Make sure to explicitly state that while he questioned biological purpose, his *ethical* purpose was clear (mentorship, truth).
      *   *Critique:* Is the note too technical?
      *   *Fix:* Keep it clear. Use terms like "null hypothesis" and "prevalence."

  7.  **Final Polish:** Check the flow of the speech for oral delivery (sentence length, pauses). Ensure the transition to the note is clear. (Proceed to generate output based on these thoughts).

  *(Self-Correction on the "Purpose" Paradox)*: I need to be careful not to say "His life was a spandrel." That might sound like his life was accidental/useless. Instead, frame his *approach* as the legacy. He taught us to look for the *structural constraints* (the arches) not just the *frescoes*.

  *(Self-Correction on the Audience)*: The colleagues who disagree need to feel their view is valid too. Phrase it as "He kept us honest." Even if they think adaptations are more common, they can agree that *assuming* adaptation without proof is bad science. That's common ground.

