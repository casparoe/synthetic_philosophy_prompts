      Okay, I'll focus on **"Volitional Continuity"** (It must still be *us*). If idealization changes us too much, it's not our volition. If it changes us too little, it's not idealized. This is the "Transformation Problem."

      *(Re-evaluating the "Unsatisfiable Subset")*: Let's look at the trilemma: 1. Respect Current Preferences, 2. Respect Idealized Rationality, 3. Aggregate Consistently. You can't have all three.

      *Let's finalize the structure.*
      1. Brainstorm.
      2. Desiderata (1-6).
      3. The Impossibility Cluster.
      4. The Killer Constraint.

      *Wait, one more check:* The user mentioned "data archives and predictive instruments." This implies a mix of normative agents (humans) and functional systems (instruments). I need to make sure the aggregation desideratum reflects that.

      *Okay, ready to write.*
answer: |-
  ### Brainstorming Session

  **Conceptual Space:**
  We are moving from *Individual Idealization* (what would *I* want if I were smarter?) to *Collective Idealization* (what would *this system* want if it were more coherent?). The system is hybrid: biological agents (scientists), digital memory (archives), and algorithmic processors (instruments).

  **Key Tensions:**
  1.  **Anchor Point:** Do we extrapolate from what the council *currently* wants, or from what the council *ought* to want given its function?
  2.  **Aggregation:** How do we sum human values (subjective, messy) with instrument "values" (objective functions, e.g., minimize error)?
  3.  **Convergence:** Does "more information" lead to consensus, or does it drive wedges deeper? (Ecological analogy: Does succession lead to a climax community, or is the system always in flux?)
  4.  **Identity:** If the idealized council disagrees with the current council, why should the current council bind itself to that decision?

  **The "Ecologist" Lens:**
  Think of this like managing a reserve. You have short-term data (current surveys) and long-term models (climate projections). The "value" is the health of the system. But who defines "health"? The current rangers? The future generations? The data itself implies a value (preservation of signal).

  **Goal:**
  Produce a spec sheet for a "Normative Operating System" for this council.

  ***

  ### Desiderata for Collective Idealized Preference Formation

  Here is the conceptual specification. I have categorized each requirement by its status: **Non-Negotiable** (the theory fails logically without it) or **Camp-Specific** (depends on your underlying ethical framework).

  #### 1. Volitional Continuity (The "Identity" Constraint)
  *   **Definition:** The idealized preference set must be recognizably derived from the actual preference set of the current body. It cannot be a replacement value system imposed from outside.
  *   **Motivating Puzzle:** *The Brainwashing Case.* If I drug you to make you "more rational" and you suddenly want to donate all your money to a cult, that is not your extrapolated volition; that is manipulation. For the council: If adding a new predictive instrument causes the human members to abandon all prior ethical commitments in favor of raw efficiency, have we idealized the council or replaced it?
  *   **Status:** **Non-Negotiable.** Without this, it is not *their* volition.

  #### 2. Informational Invariance (The "Stability" Constraint)
  *   **Definition:** Once the body reaches the "idealized" state, acquiring *further* non-normative information should not change its fundamental terminal goals, only its instrumental strategies.
  *   **Motivating Puzzle:** *The Nihilist Drift.* Imagine the council learns a hard physical truth about the heat death of the universe that causes them to lose all motivation. A theory of idealized volition must distinguish between *correcting errors* (removing bias) and *destroying motivation* (learning depressing facts). The idealized state should be a "reflective equilibrium" that is stable under new data.
  *   **Status:** **Non-Negotiable.** If the ideal state keeps shifting with every new data point, it is not an equilibrium.

  #### 3. Heterogeneous Aggregation (The "Hybrid" Constraint)
  *   **Definition:** The theory must provide a rule for combining the normative claims of conscious agents (researchers) with the functional teleology of instruments (archives wanting integrity, models wanting accuracy).
  *   **Motivating Puzzle:** *The Archive's Veto.* The data archive "wants" to remain uncorrupted. The human researchers "want" to test a hypothesis that requires altering the raw data (e.g., calibration). A standard human-only voting theory ignores the instrument's functional role. If the theory treats the archive as a mere tool, it ignores the premise that the archive is a deliberative member. If it treats the archive as a voter, how do we weigh its "vote"?
  *   **Status:** **Camp-Specific.** (A strict Humanist would say instruments have no vote; a Systems Theorist would say they do.)

  #### 4. Strategic Immunity (The "Game-Proofing" Constraint)
  *   **Definition:** No member of the current body should be able to manipulate the idealization process to yield a result they prefer *now*, knowing they would not prefer it under ideal conditions.
  *   **Motivating Puzzle:** *The Hidden Data Gambit.* A researcher knows that if the predictive instrument sees a specific dataset, the council will vote to cut their funding. They hide the data. The idealization process assumes "full information." If the process relies on current members to supply info, it is vulnerable to lying. The theory must account for the *cost* of revealing information.
  *   **Status:** **Non-Negotiable.** (Otherwise, the output is just a reflection of current power dynamics, not idealized will.)

  #### 5. Normative Authority (The "Binding" Constraint)
  *   **Definition:** There must be an explanation for why the *current* body is obligated to follow the *idealized* body's decision, even when they conflict.
  *   **Motivating Puzzle:** *The Paternalism Objection.* The idealized council decides to ban a popular but ecologically damaging field site. The current council loves that site. Why should the current council obey? If the answer is "because they are smarter," that is epistemic authority, not volitional authority. We need to know why it is still *our* will.
  *   **Status:** **Camp-Specific.** (Kantians ground this in rationality; Utilitarians in outcome maximization.)

  #### 6. Computational Tractability (The "Access" Constraint)
  *   **Definition:** It must be possible, in principle, to approximate the idealized preference without actually running the full simulation (which might take 1,000 years).
  *   **Motivating Puzzle:** *The Oracle Problem.* If the only way to know what the idealized council wants is to *be* the idealized council, and becoming them takes resources we don't have, the theory is useless for decision-making today. We need a heuristic or proxy.
  *   **Status:** **Non-Negotiable.** (A theory of decision guidance that cannot guide decisions is vacuous.)

  ***

  ### The Jointly Unsatisfiable Subset (The Impossibility Cluster)

  Here is where the logic fractures. You cannot simultaneously satisfy **Volitional Continuity**, **Informational Invariance**, and **Heterogeneous Aggregation** in a dynamic system.

  **The Conflict:**
  1.  **Volitional Continuity** demands we start with current preferences.
  2.  **Heterogeneous Aggregation** demands we weigh human desires against instrument functions (which often value truth over comfort).
  3.  **Informational Invariance** demands that new information doesn't break the system.

  **The Breakdown:**
  In a mixed human-machine system, "full information" often degrades human volition.
  *   *Scenario:* The predictive instruments (optimized for accuracy) reveal that the most "efficient" path to the council's stated scientific goals requires ethical compromises the human members find abhorrent.
  *   *Result:*
      *   If you respect **Volitional Continuity** (humans say "no"), you violate the logic of the **Instruments** (which see the "yes" as optimal).
      *   If you respect **Heterogeneous Aggregation** (let the instruments weigh in heavily), the humans feel their volition has been hijacked (violating **Continuity**).
      *   If you try to smooth this over, the system becomes unstable as new data arrives (violating **Invariance**).

  This is a generalization of Arrow's Impossibility Theorem applied to *temporal and ontological* diversity. You cannot aggregate across different *types* of agents (human vs. algorithm) and different *times* (current vs. idealized) while maintaining a coherent identity.

  ***

  ### The "Killer" Constraint

  The single requirement that does the most damage to standard Coherent Extrapolated Volition (CEV) or Ideal Observer accounts is:

  **Volitional Continuity (Requirement #1).**

  **Why?**
  Standard CEV assumes there is a "latent" true will hidden beneath our biases, like a statue inside a block of marble. It assumes that if you strip away the ignorance and the cognitive noise, the remaining signal is coherent and singular.

  **The Damage:**
  In a distributed, interdisciplinary body (especially one including non-human data nodes), there is likely **no latent coherent will to find.**
  *   Human values are often context-dependent and contradictory.
  *   Instrument "values" (accuracy, efficiency) are often orthogonal to human values (meaning, fairness).
  *   "Idealizing" this mix doesn't converge on a point; it often spirals or fragments.

  If you enforce **Volitional Continuity**, you admit that the "Idealized Council" might simply be the "Current Council" with better spreadsheets—meaning it retains all the fundamental ethical blind spots of the current era.
  If you *relax* Volitional Continuity to allow for moral progress, you admit that the Idealized Council is effectively a *different agent* than the Current Council.

  **The Verdict:**
  Once you admit the Idealized Council is a *different agent*, CEV collapses into **Paternalism**. You are no longer doing "what we would want"; you are doing "what a smarter version of us would want, even if we hate it." For a deliberative body, this destroys the legitimacy of the decision. The ecologist in you knows this well: a managed ecosystem that is "optimal" on paper but rejected by the local stakeholders is not a stable equilibrium. It will fail.

  Therefore, the requirement that the output must be *our* volition is the anchor that drags the whole theory underwater when the "idealized" state diverges too far from the "actual" state.
