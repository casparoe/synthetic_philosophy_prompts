      *Refining Dev's "Double Counting":* It's worth noting that Thomas Kelly (a steadfaster) doesn't call it double counting exactly, he argues the total evidence might still favor the original view. Dev's phrasing is a bit rough but captures the spirit. I should note that.

      *Refining the Instability Objection:* This is the "oscillation" problem. It *is* a problem for simple conciliationism, but Marta is right that it doesn't refute the *evidential force*, just the updating mechanism.

      *Refining the Final Verdict:* Marta is more right because she correctly identifies the epistemic category (higher-order evidence) which is the crux of the debate, whereas Dev tries to reduce it to first-order evidence or procedural rules.

