  2.  **Deconstruct the Philosophical Concepts:**
      *   *Radical Freedom:* The burden of choosing without external justification.
      *   *Bad Faith:* Lying to oneself to escape this burden (pretending to be a thing-in-itself).
      *   *Facticity:* The thrownness, the facts of the situation (body, past, environment).
      *   *Transcendence:* The ability to go beyond facticity through projects.
      *   *Practico-Inert:* Materialized past praxis that conditions present praxis (scarcity, institutions, rules).
