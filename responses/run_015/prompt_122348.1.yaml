answer: |-
  This workshop simulates Sartrean bad faith by forcing students to trade the anguish of collective deliberation for the comfort of a contradictory bureaucratic protocol that materializes past choices into present constraints.

  ### Activity Design: The Committee of Precedent (90 Minutes)

  **Materials:**
  *   12 "Facticity" cards (physical constraints).
  *   12 "Project" cards (hidden objectives).
  *   1 "Protocol Binder" (contains fake minutes from previous years and a decision algorithm).
  *   Whiteboard for tracking "Department Points."

  **Phase 1: The Situation (15 mins)**
  Tell the group they are a curriculum committee with 10 Department Points to allocate among 5 proposed texts. They must reach a unanimous decision. Distribute **Facticity Cards** face up (e.g., "You are tenured: You cannot speak after minute 10," "You are adjunct: You must secure at least 2 points for your field," "You have a conflict: You cannot vote for Text C"). These represent the *given situation*—facts they did not choose but must navigate. Distribute **Project Cards** face down (e.g., "Ensure Text A wins," "Maximize your personal points," "Prevent consensus"). These represent *transcendence*—their personal negation of the given.

  **Phase 2: The Anguish of Deliberation (20 mins)**
  Let them argue. The conflicting Facticity and Projects will make consensus nearly impossible. They will feel the weight of having to justify their choices to others without a solid foundation (radical freedom). Watch for frustration.

  **Phase 3: The Protocol Offer (10 mins)**
  Intervene when tension peaks. Offer the "Precedent Protocol." Explain that previous cohorts (fake history) struggled similarly, so they codified a decision algorithm. If the group votes to adopt the Protocol, they are relieved of the burden of debate. They simply feed their Facticity constraints into the Binder, and it outputs the decision. **Crucial:** Adopting the Protocol requires them to stop speaking to each other and only address the Binder.

  **Phase 4: The Practico-Inert Loop (25 mins)**
  Once adopted, hand them the Protocol Binder. It contains "Meeting Minutes from 2019" and "Rule Addendums from 2021."
  *   **The Trap:** The rules contradict. Rule 4 says "Prioritize Continental Texts," but Rule 9 (added later) says "Analytic Texts get bonus points." Rule 12 says "Unanimity required," but the Algorithm says "Majority rules."
  *   **The Serial Shift:** They must now silently calculate their inputs to satisfy the Binder. They stop looking at each other (neutralizing *The Look*) and stare at the paper. They become a serial collective, united only by the inert object (the Binder).
  *   **The Crunch:** Halfway through, reveal that the Binder requires a signature from everyone to validate the output, meaning they are personally responsible for the contradictory outcome. They are maintaining a script they didn't write but are now executing.

  **Phase 5: Debrief (20 mins)**
  Do not explain concepts until they describe the feeling.
  *   **Protocol Invocation → Bad Faith:** Ask why they voted to stop talking. Map this to fleeing the anguish of freedom by pretending to be a thing (a rule-follower).
  *   **Facticity Cards → Facticity:** Discuss how the constraints felt like "excuses" vs. "reality."
  *   **Hidden Projects → Transcendence:** Highlight how their personal goals were negated by the Protocol.
  *   **Serial Moment → The Look:** Ask how it felt when they stopped seeing each other as subjects and started seeing each other as data inputs for the Binder.
  *   **The Binder → Practico-Inert:** Explain how the "fake minutes" represent past praxis hardening into matter that now conditions their present praxis.

  ### What Breaks and What Cannot Be Reproduced

  **What breaks the first run:**
  Grad students are trained to spot structural traps. In the first run, they will likely meta-game the Protocol, treating the contradictions as a puzzle to solve rather than an existential bind. They may laugh off the contradictions instead of feeling trapped by them. To fix this, you must enforce the "silence" rule ruthlessly during Phase 4; if they speak to each other, the "magic" of the serial collective breaks, and they revert to being a group rather than a series. You must act as the enforcer of the Practico-Inert, refusing to interpret the rules for them, forcing them to sit with the impossibility.

  **The feature the game cannot reproduce:**
  The game successfully simulates the *escape* from responsibility (Bad Faith), but it cannot reproduce the **responsibility for the freedom of the Other**. In Sartre's ethics, when I choose, I choose for all mankind; I am obligated to will the freedom of others. In this game, the Protocol makes you responsible for *constraining* the Other. You are following rules that limit your peers. The game mechanics inherently objectify the other players (they become obstacles or inputs), which is the exact opposite of the ethical demand Sartre places on us in *Existentialism is a Humanism*. You must fill this gap in the debrief by asking: "If you had refused the Protocol, how would your choice have liberated the person sitting to your left?" The game can simulate the hell of being objectified by the inert, but it cannot simulate the grace of choosing another's freedom; that requires a leap of faith the mechanics actively suppress.
