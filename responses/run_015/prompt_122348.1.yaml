  i run a philosophy workshop for about 12 grad students, one 90-min session. i want a runnable activity that makes them feel Sartre's radical freedom and bad faith before anyone names the concepts, with the niche twist of the practico-inert loop: past choices harden into material rules that then constrain you, so you're responsible for the script you're following. design a role-play or structured deliberation with small stakes (symbolic tokens, maybe who picks next week's text). everyone gets an unavoidable "facticity" card and a hidden "project." they must reach a collective decision, but there's an opt-out "protocol" they can invoke that auto-assigns roles. the protocol is planted with contradictions from fake "earlier decisions" and once adopted turns the group into a serial collective — people stop seeing each other, just follow steps. they should feel the relief of giving up choice, then notice they're stuck maintaining contradictions they didn't author. debrief should map protocol invocation → bad faith, facticity cards → given situation, hidden projects → transcendence, serial moment → the look being neutralized. tell me what breaks the first run, and be honest about which feature — probably responsibility for the freedom of the Other — the game can't reproduce so i have to fill it in. start with the bottom line in the first sentence, then reasoning/details, no preamble, don't restate the question.
