      *   **Input:** A detailed list of case intuitions (nurse wages vs. queue-jumping, inspector safety, nepotism without kickback, pork-barrel politics, revolving door, algorithmic manipulation, rigged procurement, consent for waste, gifts varying by scale/context, pity-based rule-breaking, illegitimate state extraction).
      *   **Tentative Principle:** "An act is corrupt when someone occupying a role lets a consideration that the role exists to exclude override the considerations the role exists to answer to."
      *   **Specific Questions/Constraints:**
          *   Refine the principle for a lecture.
          *   Test it against their cases (where does it break?).
