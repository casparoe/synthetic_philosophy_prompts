          *   Address "private gain" vs. "pity case."
          *   Address cultural neutrality (Western administrative ideal vs. relational norms).
          *   Provide verdicts on *two new cases* (one counterintuitive).
          *   **Crucial Constraint:** "I'd rather drop a verdict than add a clause that only exists to save it." (Intellectual honesty over theory-preservation).

  2.  **Deconstruct the User's Tentative Principle:**
      *   *Core Idea:* Role integrity. Corruption is a betrayal of the *internal logic* of a role.
      *   *Strengths:* Handles the nurse (role = care/triage, not wage collection), the inspector (role = safety, not revenue), the nepotism (role = public interest, not family interest), the algorithm (role = fair ranking, not manipulated input).
      *   *Weaknesses identified by User:*
          *   Algorithm case: No human reasoning overridden, just inputs.
          *   Procurement framers: Can claim "development policy" (public gain) rather than private gain.
          *   Pity case: If no gain, is it corruption? User feels "nothing gained" is the wrong reason to exclude it.
          *   Cultural bias: Does "role" imply Western impersonal bureaucracy?

  3.  **Evaluate the Cases against the Principle:**
      *   *Nurse (wage):* Role = care. Consideration = survival/wage. *Verdict:* Not corruption (systemic failure forces role conflict).
      *   *Nurse (queue-jump):* Role = triage/need. Consideration = cash. *Verdict:* Corruption.
      *   *Inspector:* Role = safety. Consideration = cash. *Verdict:* Corruption.
      *   *Mayor (cousin's husband):* Role = public trust/competition. Consideration = kinship. *Verdict:* Corruption (even if no loss).
      *   *Mayor (bridge/district):* Role = representative. Consideration = re-election/constituents. *Verdict:* Politics (role *includes* representing constituents).
      *   *Revolving Door:* Role = regulator. Consideration = future employment. *Verdict:* Corruption (conflict of interest undermines impartiality).
      *   *Algorithm:* Role = fair processing. Consideration = corporate nudge. *Verdict:* Corruption (institutional corruption, not just individual).
      *   *Procurement Framework:* Role = fair competition. Consideration = specific firm benefit (disguised as policy). *Verdict:* Corruption (institutional).
      *   *Village Consent:* Role = protection of vulnerable? Or market transaction? *Verdict:* Ambiguous. User leans "not corruption."
      *   *Gifts:* Midwife (relational) vs. Teacher (influence) vs. Regulator (capture). *Verdict:* Depends on whether the gift alters the role's exclusionary logic.
      *   *Pity (Widow):* Role = rules/queue. Consideration = compassion. *Verdict:* User says "not corruption because no gain," but worries. Principle says "consideration role should exclude." Rules usually exclude favoritism, even compassionate.
      *   *Border Clerk (Illegitimate State):* Role = extraction vs. public service. *Verdict:* Sabotage if state illegitimate. Corruption if state legitimate.

  4.  **Refining the Principle (The "Lecture Ready" Version):**
      *   The user's draft is good but needs to handle *institutional* corruption (algorithm/procurement) and the *gain* issue.
      *   *Revision:* Focus on the **betrayal of the role's constitutive purpose**.
      *   *Gain:* "Private gain" is too narrow. "Improper consideration" is better.
      *   *Culture:* The principle must define the *role* contextually, not impose a Western template. In a relational society, the role *includes* kinship obligations. In a bureaucratic one, it excludes them.
      *   *The "Pity" Case:* If the role is "impartial administrator," pity is an excluded consideration. So it *is* corruption, just morally excusable. This aligns with the user's worry ("that feels like the wrong reason").

  5.  **Addressing the Gaps:**
      *   *Algorithm:* The principle needs to apply to the *designers* or the *system*, not just the decision-maker. Or, define the "role" as the institutional process. Let's stick to the individual's role within the system: The data entry clerk's role is accurate input.
      *   *Procurement Framers:* They claim "public policy." The principle needs to distinguish between *public reason* and *pretext*. If the policy is a sham to benefit a specific actor, it violates the role of "legislator/drafter" which serves the *general* public, not a specific private interest disguised as public.

  6.  **Developing the Two New Cases:**
      *   *Case 1 (Intuitive):* Whistleblowing. Breaking a rule (confidentiality) to serve the role's deeper purpose (public safety). *Verdict:* Not corruption.
      *   *Case 2 (Counterintuitive):* The "Efficient" Bribe. A traffic cop takes money to let a doctor rush to surgery. *Verdict:* Corruption (under the principle), even if morally good outcome. This tests the "role integrity" vs. "consequentialism" tension.

  7.  **Addressing the Cultural Critique:**
      *   Does this smuggle in Western ideals?
      *   *Response:* The principle is formal (role integrity), but the *content* of the role is empirical/cultural. If the role is "community elder," kinship is internal. If "state bureaucrat," kinship is external. The corruption happens when you claim to be a state bureaucrat but act as a community elder *while denying the distinction*.
      *   *Gifts:* Distinguish between *solidarity* (reinforces role) and *capture* (subverts role).

  8.  **Determining Which Verdicts to Drop:**
      *   *Constraint:* "Rather drop a verdict than add a clause."
      *   *Candidate 1: The Border Clerk.* If the state is illegitimate, "corruption" is the wrong label. This requires a political judgment the user wanted to avoid. *Decision:* Drop the certainty here. Acknowledge it depends on legitimacy.
      *   *Candidate 2: The Pity Case.* User wants to say it's not corruption. Principle says it is (rule-breaking for non-role reason). *Decision:* Admit it *is* corruption (breach of impartiality) but distinguish *blameworthiness*. Drop the verdict "not corruption."
      *   *Candidate 3: The Procurement Framers.* They claim public policy. *Decision:* Keep as corruption, but clarify that "public gain" must be general, not particularistic.

  9.  **Drafting the Response:**
      *   *Tone:* Academic, rigorous, respectful of the user's expertise, slightly conversational (lecture prep).
      *   *Structure:*
          1.  The Refined Principle (The "Role Integrity" Account).
          2.  Application to User's Cases (Where it holds, where it forces a change).
          3.  The Two New Cases.
          4.  The Cultural Objection.
          5.  The Sacrifices (Which verdicts to drop).

  10. **Refining the Principle Statement:**
      *   "Corruption is the abuse of a role's constitutive norms for an consideration that the role is constituted to exclude."
      *   Need to handle the "no individual agent" cases (algorithm/procurement). Expand "role" to "institutional design."
      *   Let's go with Dennis Thompson's "Institutional Corruption" vibe but keep it agent-centric where possible.
      *   *Revised Principle:* "An act (or institutional design) is corrupt when it subverts the constitutive purpose of a role or institution by admitting a consideration that the role or institution exists to exclude."

  11. **Final Review against Constraints:**
      *   Lecture ready? Yes.
