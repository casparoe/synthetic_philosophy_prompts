answer: |-
  **Project Title:** Structural Proxies for Unified Subjectivity in Superorganism Systems

  **Project Statement and Notion of Mind**
  This project investigates whether an ant colony instantiates a unified subject of experience. The specific notion of mind at issue is **phenomenal consciousness**, defined strictly as the capacity for unified subjective experience. I exclude intentionality and agency from the primary inquiry because functionalist accounts already demonstrate that colonies exhibit goal-directed behavior and information processing comparable to individual organisms. The skeptical challenge is not whether colonies act, but whether there is something it is like to be the colony. Nor is the primary focus selfhood, which presupposes phenomenality. The central question is whether the structural integration required for phenomenal unity can exist at the colony level. By isolating phenomenal unity, the project avoids sliding between distinct mental attributes, a common source of ambiguity in this debate.

  **The Impasse**
  Current discourse remains stalled between functionalist expansions of mind and individualist restrictions. Proponents of the superorganism view argue that colonies correct errors, weigh options, and store information collectively. Skeptics reply that these functions lack a subject; the colony is an arena where thousands of subjects interact, not a subject itself. This exchange is unproductive because it relies on competing intuitions about "unified subjectivity" without a non-question-begging test. Functionalists define mind by output capacity; skeptics define it by intrinsic feel. Neither side provides criteria that allow the other to verify their claims. To break this deadlock, the project abandons the direct question of phenomenality and instead identifies structural properties that are necessary conditions for unified subjectivity. If a system lacks these structural proxies, it cannot sustain a unified mind, regardless of its functional complexity.

  **Structural Proxies**
  The project evaluates three structural candidates as proxies for unity. First, **temporal grain**. Conscious episodes require integration within a narrow temporal window. Colony-level decisions often unfold over minutes or hours. If conscious unity requires millisecond-scale integration, colonies may fall outside the bounds of subjectivity entirely. Alternatively, if minds can operate on slower grains, we must determine if a subject with one experience per hour is a coherent concept or a dissolution of the term.

  Second, the **bottleneck condition**. Unified subjects typically exhibit a convergence point where information competes for a scarce channel. Much colony behavior is stigmergic, lacking a central bottleneck. However, specific behaviors, such as tandem runs in *Temnothorax albipennis*, involve sequential, adjustable information transfer through narrow channels. If the bottleneck condition is necessary for unity, colonies may possess minds only relative to specific task domains. This requires analyzing whether domain-relative subjectivity is compatible with the unity we attribute to ourselves.

  Third, **fission and fusion as a stress test**. Argentine ants form supercolonies where distant nests do not attack one another, effectively merging systems. Conversely, colonies bud and split. If minds belong to colonies, these are cases of minds merging and dividing. These cases will not serve as evidence but as tests for whether proposed criteria yield absurd verdicts or silence.

  **Work Plan and Justification**
  The project proceeds over twelve months. **Months 1–3** are dedicated to refining the structural proxies. I will analyze existing theories of consciousness unity to determine if temporal integration and information bottlenecks are genuinely necessary conditions for phenomenality or merely correlates of human biology. **Months 4–6** involve applying these refined criteria to empirical data. I will examine specific myrmecological cases: the temporal latency of colony decisions, the presence of bottlenecks in tandem runs versus pheromone trails, and the identity conditions of supercolonies during budding. **Months 7–9** focus on synthesis. I will determine whether the data supports colony-level subjectivity, domain-relative subjectivity, or the failure of the proxies. **Months 10–12** are reserved for drafting the dissertation chapter and revising based on feedback.

  This approach is preferable to two obvious alternatives. First, simply reading more myrmecology awaits biological settlement on a metaphysical question; no amount of behavioral data resolves the subjectivity impasse without philosophical criteria. Second, subsuming the case under a general theory of consciousness is premature; general theories are currently stalled. Using the ant colony as a limit case forces precision upon the criteria themselves, testing general theories against extreme distributed systems.

  **Conclusions and Failure Conditions**
  The project may conclude that colonies meet the structural criteria, implying the possibility of slow or domain-relative minds. It may conclude that colonies fail the criteria, supporting the skeptic. It may also conclude that the proxies themselves are insufficient. The project fails if the three proxies turn out to be independent of phenomenal unity—for example, if a system can possess a bottleneck without subjectivity. It also fails if the criteria rely on solving the hard problem of consciousness first, rendering them unusable for this specific inquiry. Explicitly stating these failure conditions ensures the project produces a determinate result even if the answer is negative.

  **Empirical Dependencies**
  The argument depends on specific biological claims. First, that colony-level decisions operate on timescales of minutes or hours, not milliseconds. Second, that tandem runs involve narrow-channel information transfer distinct from stigmergic trails. Third, that Argentine ant supercolonies exhibit non-aggression across vast distances, functioning as a single competitive unit. If colony decisions prove faster than assumed, the temporal grain objection weakens. If tandem runs are shown to be decentralized, the bottleneck condition fails. If supercolonies are shown to be aggregates of competing nests rather than unified units, the fission/fusion test loses force. The philosophical verdict shifts contingent on these empirical facts.

  **Address to the Referee**
  A referee might object that this project is either empirical entomology wearing a philosophical hat or a merely verbal dispute. It is not entomology because the goal is not to discover new biological facts but to clarify the conceptual conditions under which biological facts constitute a mind. The biological claims are premises, not findings. Nor is it merely verbal. The question is not how we choose to use the word "mind," but whether distributed systems can satisfy the structural requirements for unity that ground our own ascriptions of consciousness. If the project shows that the criteria for subjectivity cannot be met by colonies without absurdity, it delineates the boundaries of the mental concept itself. This is metaphysics constrained by biology, which is the proper domain of philosophy of mind.
