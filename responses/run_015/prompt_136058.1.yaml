answer: |-
  (1) Conceptual framing
  The dollar auction model maps onto this cooperative deadlock by substituting monetary bids with investments of social labor and reputational capital, while transforming the prize from a private good into a contest for collective aesthetic control. In this modified framework, members place "bids" by committing unpaid work and public advocacy to specific renovation plans, where the cost is incurred regardless of the outcome, but only the dominant coalition gains the prestige of having their vision realized. Crucially, the mechanism is intensified by partial exit costs; unlike a standard auction where a bidder can walk away after losing their stake, withdrawing labor here incurs an additional social penalty that damages future standing within the group. This creates a trap where the cost of losing face exceeds the marginal cost of continued escalation, locking participants into a cycle of over-investment in a non-rival resource.

  (2) Core implications
  The primary dynamic driving this deadlock is rational escalation based on loss aversion regarding reputation rather than financial gain. Members continue to contribute labor not because they believe the renovation's value exceeds the cost, but because the sunk reputational cost of abandoning their position is perceived as higher than the effort required to bid again. Observable commitment functions as a signaling mechanism; when one member publicly invests labor in a design, it signals resolve, forcing rivals to match that investment to avoid signaling weakness or losing influence over the shared space. This turns the renovation process into a proxy war for status, where the actual utility of the renovation becomes secondary to avoiding the social loss of being the party that capitulated.

  Furthermore, the condition of asymmetric partial-exit costs creates a barrier to de-escalation that does not exist in standard market transactions. Because withdrawing labor is interpreted as a breach of cooperative norms rather than a rational economic decision, members are effectively coerced into staying at the table even when the collective cost outweighs the benefit. De-escalation therefore cannot rely on individual rationality, as the social incentives punish withdrawal. Instead, stopping the escalation requires an external intervention that alters the payoff structure, such as a governance rule that decouples decision-making weight from prior labor contributions, thereby removing the incentive to throw good labor after bad.

  Finally, resolving the deadlock requires creating a safe mechanism for face-saving退出 (exit). In a standard dollar auction, the auctioneer ends the game; here, the board must act as the auctioneer to declare the bidding period closed. Conditions for de-escalation involve legitimizing the withdrawal of commitments without social sanction, perhaps by framing the reset as a procedural necessity rather than a personal defeat. If members can withdraw their labor commitments without losing standing, the sunk cost trap dissolves, allowing the group to evaluate the renovation contract on its merits rather than on the intensity of prior advocacy.

  (3) Boundary conditions
  The analogy weakens where the non-fungibility of labor and the non-excludable nature of the prize diverge from standard auction theory. Unlike cash, labor is heterogeneous; one member's skilled work may be valued differently than another's unskilled effort, making the "bid amount" ambiguous and open to interpretation. Additionally, because the renovated space is a collective good, losers still consume the result, which theoretically lowers the stakes compared to a dollar auction where the loser gets nothing. However, this is counterbalanced by the iterated nature of cooperative living; since members cannot fully exit the community, the shadow of the future intensifies the reputational stakes, making the social cost of losing a bid potentially higher than the monetary cost in a one-off auction.

  (4) Application to the cooperative case
  Your deadlock is best explained by a modified escalation mechanism where the prize is social credit rather than exclusive ownership, meaning pure escalation logic applies but is amplified by relational constraints. The implication is that the board cannot wait for members to tire themselves out, as the social penalties prevent natural attrition. To break the cycle, the board must seize authority over the decision process and explicitly decouple voting weight from hours contributed, while simultaneously granting amnesty for withdrawn labor commitments. This structural intervention removes the rational basis for escalation by ensuring that past social investments do not guarantee future influence.

  (5) Bottom line
  You must immediately decouple decision-making authority from prior labor contributions to remove the incentive for members to escalate commitments for status. Declare a procedural reset that validates all past efforts but bases the final contract decision solely on objective criteria, allowing members to withdraw without social penalty.
