prompt: |-
  I have recently been appointed to the governance board of a small cooperative housing association—fewer than thirty members—where we are deadlocked over a renovation contract that has attracted competitive internal bidding. What distinguishes our situation from an ordinary auction is that no individual acquires private ownership of the result; the contested “prize” is collective prestige and aesthetic control over shared spaces, yet members continue to escalate commitments of unpaid labor and social capital despite clearly negative individual returns. Exit is only partial, because withdrawing labor damages one’s standing within the group rather than freeing one from further obligation, and the sunk costs are reputational rather than monetary. I have been studying the dollar auction model of escalation of commitment, but standard treatments assume a private, excludable reward and a clean exit option. Please describe the most important implications of the dollar auction and escalation of commitment for understanding deadlocks in small cooperative institutions where the resource is collective reputation, members face asymmetric partial-exit costs, and sunk contributions take the form of social labor rather than cash.

  Please organize your response in American English into the following sections, with approximate lengths indicated: (1) “Conceptual framing” (one paragraph), clarifying how the dollar auction mechanism maps onto reputation contests with partial exit and non-rival prizes; (2) “Core implications” (two to three paragraphs), identifying the dynamics of rational escalation, observable commitment, and conditions for de-escalation specifically in this cooperative context; (3) “Boundary conditions” (one paragraph), noting where the analogy weakens because labor is non-fungible or the prize is non-excludable; (4) “Application to the cooperative case” (one paragraph), offering a direct verdict on whether our deadlock is best explained by pure escalation logic or by a modified mechanism, and what that implies for breaking the cycle; and (5) “Bottom line” (two to three sentences), summarizing the single most actionable insight for a board member who wishes to restore cooperation without destroying group cohesion. Please do not provide bibliographies, citations, or reading lists; I need analysis built only from reasoning and widely available conceptual knowledge.
