answer: |-
  ### Positional Preamble

  Before the spec, I am taking the following stands on your four axes to ground the desiderata:

  1.  **Cardinality:** The theory must deliver **cardinal, intertheoretically comparable numbers**. Ordinal rankings cannot weight the Clade Gamble against moral uncertainty; you cannot optimise a budget with only rankings when probabilities and magnitudes vary by orders of magnitude.
  2.  **Tail Risk:** It is **not allowed** to let a one-in-a-thousand credence on 10^18 units dominate. For a ten-year horizon, this is Pascal's Mugging; it renders planning impossible. The theory must cap the influence of extreme tail expectations.
  3.  **Redescription:** The answer **may not shift** when redescribing one population as two. Partition independence is a basic requirement of rationality; moral weight cannot depend on arbitrary taxonomic granularity.
  4.  **Revisability:** The theory must be revisable in light of **mechanistic evidence** (neuroanatomy, computational architecture), not merely behavioural proxies. Behaviour can be mimicked; structure constrains the possibility of experience.

  ***

  ### Desiderata for a Comparative Sentience Theory

  **1. Intertheoretic Unit Calibration**
  *   **Case:** You are refusing to pick between hedonic and desire-based welfare. To allocate funds under this moral uncertainty, you must know how many "units of desire satisfaction" equal one "unit of hedonic tone". Without a conversion rate, you cannot calculate expected moral value across theories.
  *   **Status:** **Non-negotiable.** Without this, moral uncertainty paralyses budget allocation.

  **2. Correlated Risk Adjustment (The Clade Discount)**
  *   **Case:** Under the Clade Gamble, uncertainty does not wash out across individuals. If *Coleoptera* are insentient, saving 10^15 beetles yields zero value. A standard expected value calculation ignores the variance risk of total failure at the order level. The theory must adjust value estimates to reflect the binary risk profile of the taxonomic order.
  *   **Status:** **Non-negotiable.** Ignoring this violates the stipulated uncertainty structure and invites catastrophic misallocation.

  **3. Partition Invariance**
  *   **Case:** As per the redescription position, splitting a population (e.g., "fish" into "bony" and "cartilaginous") must not alter the total moral priority assigned to the group. If the theory rewards fragmentation, it incentivises gerrymandering taxa to manipulate funding flows.
  *   **Status:** **Non-negotiable.** Violating this makes the metric gameable and unstable.

  **4. Mechanistic Sensitivity**
  *   **Case:** Behavioural outputs are insufficient given the possibility of philosophical zombies or simple reflex arcs. The theory must tie moral status to structural capacities (e.g., integration of information, nociceptive processing) so that new neuroscientific findings can update the probability of sentience without requiring a full metaphysical overhaul.
  *   **Status:** **Non-negotiable.** Behavioural-only metrics are too brittle for a ten-year horizon where neuroscience may advance.

  **5. Diminishing Marginal Moral Value**
  *   **Case:** To satisfy the constraint on tail risks (no Pascal's Mugging), the theory must incorporate a function where additional units of welfare or probability yield progressively less decision-weight. This prevents tiny credences on astronomical populations from swallowing the entire budget.
  *   **Status:** **Taste (Robustness Camp).** Some strict expected value maximisers will reject this, but for practical budgeting under deep uncertainty, it is required.

  **6. Operational Tractability**
  *   **Case:** The theory must yield numbers within the cost of the intervention itself. If measuring the moral status of a population costs more than the intervention budget, the theory is useless for allocation. It must rely on proxies that are cheap to ascertain.
  *   **Status:** **Non-negotiable.** A theory that cannot be applied within budget constraints is metaphysics, not a spec.

  ***

  ### Conflict and Knockout

  I flag a tension between **Intertheoretic Unit Calibration** (Desideratum 1) and **Mechanistic Sensitivity** (Desideratum 4). Establishing cardinal units across theories usually requires fixing a reference class or a "zero point" based on current understanding. However, mechanistic evidence is dynamic; as we learn more about neural architecture, the definition of the "unit" of sentience may shift, requiring arbitrary renormalisation that violates the stability needed for calibration. You cannot easily have a fixed cardinal scale that updates cleanly on structural discoveries without breaking comparability over time.

  The single requirement that knocks out the most candidates is **Intertheoretic Unit Calibration**. Most existing frameworks (e.g., sentience quizzes, welfare metrics) operate within a single theory of welfare or produce ordinal rankings. Very few attempt to quantify the exchange rate between hedonic tone and desire satisfaction, and those that do rely on intuition pumps rather than robust measurement theory.

  ***

  ### Scoring the Default Moves

  Multiply-and-compare (Expected Value) is superior for this spec provided it incorporates the Clade Discount and caps tail risks; it respects the cardinal requirement and allows for optimisation. A precautionary threshold rule fails the Operational Tractability and Partition Invariance desiderata, as thresholds create cliff-edge effects where small changes in probability cause discontinuous jumps in funding, inviting redescription gaming. Stick to modified expected value, but treat the Clade Gamble as a variance constraint rather than a mean estimate.
