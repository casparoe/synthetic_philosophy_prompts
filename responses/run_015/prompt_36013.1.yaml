answer: |-
  The capacity for immediate, zero-shot recognition of letter identity across novel stylistic domains without prior exposure or feedback is the single requirement that carries the most weight. This constraint eliminates any account relying on statistical learning from past instances or fixed geometric templates, forcing the theory to posit a generative mechanism capable of inferring underlying rules from a single exemplar. It demands that the system possess a priori knowledge of the "space of possible letters" sufficient to map arbitrary new shapes onto existing categories without iterative optimization.

  1.  **Zero-Shot Generalization**
      *   **Motivating Case:** First-exposure recognition of an 'a' in a font never seen, with no feedback and no deliberation.
      *   **Status:** Non-negotiable.
      *   **Conflict Flag:** Tensions with **Requirement 6 (Structural Description)** if the description relies on fixed geometric primitives not present in the novel font.

  2.  **Structural Heterogeneity Tolerance**
      *   **Motivating Case:** The structural distance between the two-story and one-story forms of the lowercase letter, and further to blackletter, where the commonality becomes hard to name at all.
      *   **Status:** Non-negotiable.
      *   **Conflict Flag:** Tensions with **Requirement 1 (Zero-Shot)** if the theory assumes a single canonical structure must be matched to recognize identity.

  3.  **Degradation and Fragmentation Robustness**
      *   **Motivating Case:** Tolerance of the distortion, fragmentation, and sloppiness of handwriting, up to the point where it fails.
      *   **Status:** Non-negotiable.
      *   **Conflict Flag:** None inherent, but complicates **Requirement 6** by requiring role-based rather than part-based definitions.

  4.  **Style-Identity Orthogonality**
      *   **Motivating Case:** Category and style are orthogonal groupings that must be extracted at once; within a font, the 'a' is more similar to its sibling letters than to another font's 'a', yet readers parse novel alphabets instantly.
      *   **Status:** Non-negotiable.
      *   **Conflict Flag:** Tensions with **Requirement 1 (Zero-Shot)** because separating style from identity typically requires exposure to multiple instances of the style to establish a baseline.

  5.  **Case Mapping Structure**
      *   **Motivating Case:** Whether uppercase and lowercase are one concept, two, or a structured pair.
      *   **Status:** Preference (theory must specify the mapping, but the ontological status is debatable).
      *   **Conflict Flag:** None.

  6.  **Abstract Role Flexibility**
      *   **Motivating Case:** Whether a purely structural description of an 'a' as a bowl plus a stem plus other roles can survive the letters that lack the parts the description names.
      *   **Status:** Non-negotiable (must handle missing parts).
      *   **Conflict Flag:** Tensions with **Requirement 2 (Structural Heterogeneity)** if "roles" are defined too concretely rather than functionally.

  7.  **Contextual Sensitivity vs. Isolation Stability**
      *   **Motivating Case:** The context effects in which a letter is identified faster inside a word than alone, versus the ability to identify it alone.
      *   **Status:** Non-negotiable (must explain both).
      *   **Conflict Flag:** **Jointly Unsatisfiable Pair** with **Requirement 1 (Zero-Shot)** if the theory claims identity *construction* requires word-level context; the system must stabilize identity in isolation while utilizing context for speed.

  The single requirement that does the most to exclude the familiar candidate accounts is **Zero-Shot Generalization**. Template matching fails because it requires stored images of specific fonts. Feature lists fail because novel fonts may not contain the predefined geometric features (e.g., a specific curvature or angle). Prototype averaging fails because there is no prior distribution of examples from the new font to average. Structural description accounts survive best but are heavily constrained by **Abstract Role Flexibility**, as they must explain how a structure is recognized when its named components (like a "bowl") are topologically absent or merged.
