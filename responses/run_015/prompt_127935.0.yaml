answer: |-
  Here is a proposal for a principle derived from your eight cases, followed by the necessary revisions to your verdicts, the prediction for the genetics lab, and the location of Moore's hands.

  ### The Principle of Functional Solidification

  A proposition $p$ functions as a **hinge** for a practice $P$ if and only if it satisfies the following four conditions:

  1.  **Justificatory Priority:** Within $P$, $p$ serves as a precondition for the evaluation of other claims, rather than being evaluated by them.
  2.  **Procedural Immunity:** There is no standard procedure *internal* to $P$ for verifying $p$; attempting to verify $p$ using $P$'s methods would be circular or would halt the practice.
  3.  **Empirical Content:** $p$ purports to describe a state of affairs (it has a truth value), distinguishing it from logical tautologies or purely normative rules.
  4.  **Dynamic Revisability:** $p$ can be falsified, but only through an extraordinary disruption that forces a reconfiguration of $P$'s justificatory structure (shifting $p$ from bedrock to gravel).

  ---

  ### Mapping the Cases to the Clauses

  *   **Clause 1 (Justificatory Priority)** is motivated by **Case 2 (Archaeologist)** and **Case 4 (Consciousness)**. In Case 2, the cistern's location is established *by* the dig's methods. In Case 4, the consciousness of others is not established by methods; it is the background against which methods (like seminar discussion) make sense. This distinguishes the *structure* of justification from the *degree* of certainty.
  *   **Clause 2 (Procedural Immunity)** is motivated by **Case 1 (Student)** and **Case 4 (Payroll)**. The student's doubt fails because there is no procedure within the university practice to check for "global deception." The payroll check succeeds because an audit procedure exists. This captures your intuition that the student has stepped outside the practice, while the payroll is merely untested.
  *   **Clause 3 (Empirical Content)** is motivated by **Case 7 (Math)** and **Case 8 (Torture)**. In Case 7, $12 \times 12 = 144$ is a rule of grammar, not an empirical hinge; inconsistency in axioms is a hypothesis. In Case 8, the wrongness of torture is normative. Your resistance to calling Case 8 a hinge is correct: it fails this clause. It is a *moral* certainty, not an *epistemic* hinge.
  *   **Clause 4 (Dynamic Revisability)** is motivated by **Case 3 (Verrill)** and **Case 5 (Paternity)**. These are the crucial cases that break the traditional "immutable" view of hinges. The tapes and the father were hinges until they weren't. The practice survived, but its *structure* changed (new citation methods; new understanding of kinship). This captures the "riverbed" metaphor: rock can become sand.

  ---

  ### The Cost of Admission: Verdicts You Must Revise

  To maintain this principle, you must adjust two of your intuitions.

  **1. You must revise your interpretation of Case 3 (Verrill Archive).**
  You wrote: *"the Verrill project abandoned its assumption and went on being the same project, only corrected."*
  **Revision:** You must accept that the project *did* change its practice, even if it kept its name. Before 2019, the proposition "the tapes are gone" was a rule of representation; citations were organized *around* its truth. After 2019, it became an empirical variable. The *justificatory structure* of the project shifted. The "sameness" you perceive is narrative continuity, not logical identity. If you insist the practice remained identical, you cannot distinguish Case 3 from Case 2. You must concede that when a hinge breaks, the practice is reconstituted, even if the participants don't notice the philosophical shift.

  **2. You must clarify your resistance in Case 8 (Torture).**
  You wrote: *"I resist calling it a hinge, because it seems to be something I believe and would argue others into believing."*
  **Revision:** Your resistance is correct, but your reason is slightly off. It is not a hinge not because you argue for it, but because it lacks **Empirical Content** (Clause 3). It is a normative commitment, not a descriptive scaffold. However, you must accept that it functions *analogously* to a hinge in moral practices. If you insist on a unified theory of "certainty," you must admit there are *epistemic* hinges (world-pictures) and *normative* hinges (value-frameworks). Case 8 is the latter. If you lump them together, you lose the distinction between fact and value. Keep them separate.

  **Regarding Case 1 (Student):** This principle vindicates your verdict. The student is not doubting a hinge; he is doubting the *possibility* of hinges. "Global deception" has no truth conditions within the practice of memory and testimony. It is not a hinge; it is nonsense. Case 5 (Paternity) differs because "biological fatherhood" *does* have truth conditions within the broader practice of biology, even if it was solidified in the personal practice.

  ---

  ### The New Case: The Genetics Lab

  **The Scenario:** A lab pipeline presupposes a Reference Genome Assembly is correct. A postdoc proposes spending a year testing it.

  **Diagnosis:** This is **Case 3 (Verrill Archive)**, not Case 2.
  On my account, the Reference Assembly is a **Hinge**. It satisfies Clause 1 (other findings depend on it), Clause 2 (the pipeline doesn't test the reference; it uses it), and Clause 3 (it is empirical/descriptive).

  **Prediction:** If the postdoc tests it, she is not doing "pipeline work"; she is doing "metrology" or "validation work." She is attempting to turn the riverbed into the river.

  **What the Lab Should Say:**
  They should not say, "No, it is true" (Moorean dogmatism).
  They should not say, "Yes, go ahead" (treating it as Case 2).
  They should say: *"If you test the reference assembly, you are not running the standard pipeline. You are questioning the coordinate system we use to locate genes. You are welcome to do that, but you will not be producing the data this lab is organized to produce. You are starting a new project."*

  This acknowledges the **Dynamic Revisability** (Clause 4). The assembly *could* be wrong (Case 3), but treating it as questionable changes the practice from *application* to *foundation-laying*.

  ---

  ### Where Moore's Hands Stand

  Does this collapse hinges into very confident empirical belief?
  **No.** If it did, Case 1 (Student) and Case 4 (Consciousness) would look like Case 2 (Cistern). They do not. The distinction is not psychological confidence; it is **logical role**.

  Moore's gesture of holding up his hands is left standing, but its meaning shifts.
  When Moore says "Here is a hand," he is not claiming high-probability empirical knowledge (Case 2). He is pointing to the **Justificatory Priority** (Clause 1). He is showing the seminar that the practice of "knowing" rests on a scaffold that cannot be proven within the practice without circularity.

  However, because of **Dynamic Revisability** (Clause 4), Moore's hands are not *eternally* solid. In a practice of virtual reality simulation or advanced prosthetics, "Here is a hand" might move from hinge to hypothesis. Moore is right that *now*, in *this* practice, it is a hinge. He is wrong if he implies it is a hinge for *all possible* practices.

  Your seminar arrives at the same question every year because you are looking for a static property of propositions. My principle suggests you tell them: **Hinges are not a kind of proposition; they are a job that propositions do.** Sometimes "The tapes are destroyed" does the job. Sometimes "Here is a hand" does the job. Sometimes "He is my father" does the job. When the job changes, the proposition moves from the bed to the water. The test you seek is not "Is this true?" but "What work is this doing in this room, right now?"
