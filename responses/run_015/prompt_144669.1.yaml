answer: |-
  **Project Title:** The Geometric Prisoner's Dilemma: Multi-Agent Kelly Optimization in Zero-Sum Settings

  **1. Problem Statement**
  The Kelly Criterion maximizes the expected logarithmic growth rate of wealth ($E[\log W]$) for a single agent facing fixed odds. It is the unique strategy that asymptotically dominates all others almost surely in non-adversarial environments. However, financial markets and betting ecosystems are multi-agent systems. This project asks: **What happens when two agents, both maximizing their own geometric growth rate, bet against each other in a repeated zero-sum setting with heterogeneous priors?**

  Specifically, I hypothesize the existence of a "Geometric Prisoner's Dilemma." In a zero-sum wealth environment ($W_A + W_B = \text{constant}$), aggregate geometric growth is maximized when wealth distribution remains stable (minimizing variance). However, individual incentives drive agents to bet aggressively (Kelly) to capture opponent wealth. I propose that the Nash Equilibrium (both agents playing Kelly) yields lower expected log-utility for *both* agents compared to a cooperative equilibrium (both playing "Flat" or no-bet strategies), due to volatility drag outweighing transfer gains.

  **2. Why Single-Agent Proofs Do Not Settle This**
  Standard proofs of Kelly optimality rely on the assumption that the opportunity set is exogenous. The agent optimizes against "nature" or a fixed bookie. The proof that Kelly dominates relies on the Law of Large Numbers applied to a fixed distribution of returns.

  In a two-agent zero-sum setting, this breaks down for two reasons:
  1.  **Endogenous Odds:** The opponent is not a static bankroll but an optimizing agent. Their betting behavior alters the effective odds and liquidity available.
  2.  **Systemic Variance Drag:** In a zero-sum game, expected wealth transfer is zero (assuming fair odds). However, log-utility is concave. By Jensen's Inequality, $E[\log W] < \log E[W]$. Aggressive betting increases the variance of $W_t$ without increasing $E[W_t]$. Therefore, while Kelly maximizes growth against a fixed edge, in a zero-sum duel, it maximizes variance which actively destroys aggregate log-utility. Single-agent theory ignores this systemic cost.

  **3. Methodology**
  I will model this as a discrete-time repeated game over $n$ rounds.

  *   **Agents:** Two agents, $A$ and $B$, with Log-Utility preferences $U(W) = \log W$.
  *   **Setting:** Zero-sum wealth pool $W_{total}$. Agents hold heterogeneous priors regarding an external binary event (e.g., a coin flip). Both perceive a positive expected value, justifying a bet.
  *   **Strategies:**
      *   *Kelly:* Bet fraction $f^*$ maximizing $E[\log W]$ given perceived edge.
      *   *Flat:* Bet a fixed fraction $f < f^*$ (or $f=0$).
  *   **Payoff Matrix:** I will construct a 2x2 matrix (Kelly vs. Flat) for the agents.
  *   **Metric:** The primary metric is the Expected Log-Wealth after $n$ rounds: $E[\log W_n]$. I will compare the Nash Equilibrium outcome (Kelly/Kelly) against the Social Optimum (Flat/Flat).
  *   **Analysis:**
      1.  Derive analytic expectations for small $n$ (e.g., $n=1, 2$).
      2.  Run Monte Carlo simulations for large $n$ to observe asymptotic behavior.
      3.  Measure the "efficiency loss": The difference in aggregate $E[\log W_A + \log W_B]$ between the competitive and cooperative scenarios.

  **4. Expected Outcomes**
  *   **Positive Result (The Dilemma Exists):** The (Kelly, Kelly) profile is a Nash Equilibrium, but both agents achieve lower $E[\log W_n]$ than in the (Flat, Flat) profile. This confirms that individual geometric rationality leads to collective geometric sub-optimality.
  *   **Negative Result:** The (Kelly, Kelly) profile remains Pareto optimal. This would imply that even in zero-sum, the opportunity to capture opponent wealth outweighs the volatility drag, or that the "Flat" strategy is unstable (one agent defects to Kelly to steal share).

  **5. Feasibility and Timeline (3 Months)**
  Three months is sufficient for a theoretical model and simulation, provided the scope remains narrow.
  *   **Month 1:** Formalize the 2-agent zero-sum equations. Derive the single-round payoff matrix analytically.
  *   **Month 2:** Build simulation infrastructure (Python/Julia) to run $10^5$ trials for varying $n$. Test sensitivity to prior divergence (how much do they disagree?).
  *   **Month 3:** Analyze data, visualize the "efficiency loss," and draft the final paper.

  **Risk Assessment:** The primary risk is mathematical triviality. If the zero-sum constraint is too strict (e.g., perfectly fair odds with no friction), Kelly optimization might dictate $f^*=0$ (no bet), collapsing the dilemma. To prevent this, I will introduce "perceived edge" via heterogeneous priors, ensuring both agents *want* to bet even if the objective expectation is zero.

  **6. Failure Conditions**
  The project would be considered a failure if:
  1.  **Collapse to Single-Agent Logic:** The math shows that Agent A's optimal strategy is independent of Agent B's strategy (i.e., the opponent's betting does not impact my growth rate). This would imply the multi-agent aspect is irrelevant.
  2.  **No Equilibrium:** The strategies oscillate without converging, making the "Dilemma" undefined.
  3.  **Triviality:** The "Flat" strategy is strictly dominated in all cases, meaning there is no dilemma—aggression is always individually and collectively superior.

  **7. Conclusion**
  This project challenges the universality of geometric rationality. If successful, it demonstrates that "rational" betting behavior can be socially destructive in competitive ecosystems, offering a new framework for understanding excessive trading volume and volatility in financial markets as a multi-agent coordination failure rather than mere noise.
