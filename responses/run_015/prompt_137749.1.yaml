  UNIVERSITY ANIMAL CARE AND ETHICS COMMITTEE
  MEMORANDUM
  TO: Principal Investigators, Facility Managers
  FROM: Committee Secretariat
  SUBJECT: Revised Guidance on Non-Human Entity Protocols (Ref: ACEC-IND-04)
  DATE: 24 October 2023

  **1. DEFINITIONS AND SCOPE**
  1.1 **Protected Person**: Any rational agent capable of autonomous moral legislation. All duties enumerated herein are owed exclusively to Protected Persons.
  1.2 **Non-Rational Entity (NRE)**: Any living organism lacking rational autonomy. No direct duty is owed to an NRE. Provisions regarding NREs exist solely to safeguard the moral integrity of Protected Persons.
  1.3 **Moral Coarsening**: The degradation of a Protected Person's character via habitual disregard for analogues of human virtue.

  **2. ANALOGY SCHEDULE AND CLASSIFICATION**
  2.1 NREs shall be ranked by their capacity to resemble human social virtues.
  2.2 **Class A (High Analogue)**: Canines and Equines. Due to their capacity for loyalty and service resembling human fidelity, these entities attract full protective measures.
  2.3 **Class B (Low Analogue)**: Rodents. Measures must suppress anthropomorphic analogy. Naming, photographing, or retaining Class B entities post-protocol is prohibited. Designations shall be restricted to 'Unit' or 'Cohort'.
  2.4 **Class C (Negligible Analogue)**: Fish, Invertebrates, Molluscs. These fall outside scope for want of recognizable resemblance to human nature. Review is abbreviated or waived.
  *[Annotation: This implies a fish's nociception is irrelevant compared to a dog's loyalty. | Response: Nociception is mechanistic; only the observer's moral reaction to the mechanism constitutes an ethical datum.]*

  **3. THE HARDENING REGISTER**
  3.1 All staff shall undergo induction assessment for susceptibility to Moral Coarsening.
  3.2 Annual recertification is required. Staff certified as 'Fully Hardened' are exempt from witnessing restrictions regarding Class B and C entities.
  3.3 Where a procedure is performed unwitnessed by any person of unhardened sensibility and is unlikely to reach public knowledge, the character-based ground for restraint lapses.
  *[Annotation: If no soft-hearted human sees the act, the act is permissible regardless of intensity. | Response: Correct. Without a witness to suffer moral degradation, no duty to self is violated.]*

  **4. PAINFUL PROCEDURES AND HUMAN UTILITY**
  4.1 Procedures inducing visible distress in NREs are permitted only where the end serves substantial importance to humanity.
  4.2 Speculative curiosity does not constitute substantial importance. The potential degradation of the investigator's character outweighs the value of mere knowledge acquisition.
  4.3 Anesthesia is mandated not to spare the NRE, but to prevent the investigator from becoming accustomed to the spectacle of struggle.

  **5. PUBLICITY AND SOCIAL DISTRESS**
  5.1 Protocols likely to cause distress to the general public shall be modified or concealed.
  5.2 The objection is not the NRE's state, but the public's potential loss of sympathy for suffering analogues.
  5.3 Facilities must ensure no visual access from public thoroughfares.

  **6. LONG-SERVICE RECOGNITION**
  6.1 Class A entities completing ten years of facility service shall be granted a pensioned retirement package.
  6.2 This recognizes the quasi-contractual nature of their labour and fidelity.
  6.3 No provision is made for the disposal of Class B or C entities, as no service analogous to human labour was rendered.
  *[Annotation: The rat who dies at six weeks is discarded; the dog who bites is pensioned. | Response: The rat provided no analogue of virtue. Discarding property is not a moral failure; ingratitude to a servant is.]*

  **7. DUTY TO SELF AND CORRUPTION**
  7.1 Cruelty is prohibited even in private contexts where no public hardening occurs.
  7.2 This prohibition rests on the duty a Protected Person owes to their own moral perfection. To destroy the seat of sympathy within oneself is to violate the humanity in one's own person.
  7.3 Investigators must maintain a log of emotional resonance during procedures. Absence of resonance indicates potential moral atrophy requiring remediation.

  **8. COMPLIANCE AND ATTESTATION**
  8.1 Principal Investigators must sign the Annual Attestation of Moral Integrity.
  8.2 Failure to report signs of personal coarsening in colleagues is a breach of duty to humanity.
  8.3 This policy supersedes all prior guidance regarding 'animal welfare'. There is no such thing as animal welfare; there is only human moral hygiene.
  8.4 Review Date: Upon the next revision of the Metaphysical Framework.

  **ACKNOWLEDGED:**
  _________________________________
  *Chair, Animal Care and Ethics Committee*
