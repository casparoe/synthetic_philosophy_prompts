answer: |-
  ### 1. Exam Prompt

  **Course:** PHI 520: Existential Risk and the Value of the Future
  **Exam:** Final Essay Examination
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question:**

  Samuel Scheffler's "Afterlife Conjecture" posits that human extinction would be calamitous not merely because it harms existing people, but because the existence of future generations is a precondition for us to find value in our present activities. However, standard applications of this conjecture often assume a binary choice between extinction and indefinite human survival.

  Consider instead a **"Value-Locked Replacement"** scenario: Humanity goes extinct, but is immediately replaced by a flourishing, stable post-human civilization. This successor civilization preserves every human achievement, artifact, and text with perfect fidelity. However, it is structurally incapable of open-ended moral or intellectual revision; it can maintain human values but cannot critique, modify, or generate new normative frameworks beyond what humanity left behind.

  Write an essay addressing the following:
  1.  Does Scheffler's normative framework treat this "Value-Locked Replacement" as normatively comparable to extinction, or does it deem it sufficient to sustain the value of current human lives?
  2.  Defend your answer by identifying the precise source of badness in Scheffler's conjecture. Does the badness lie in the loss of particular relational ties, the interruption of collective narrative identity, or the foreclosure of future value-creation?
  3.  Examine whether the conjecture implicitly depends on a specifically *human* form of temporal embeddedness, or if the capacity for valuation alone is sufficient.

  Your answer must rely on conceptual argument rather than exegesis. Do not simply summarize Scheffler; apply his logic to the constraints of the scenario to reveal hidden premises in his framework.

  ***

  ### 2. Model Answer

  Scheffler's Afterlife Conjecture argues that our confidence in the value of our activities depends on the assumption that humanity will survive after us. If we apply this framework to the "Value-Locked Replacement" scenario, the conclusion must be that this replacement is normatively equivalent to extinction. While the successor civilization preserves human artifacts, it fails to satisfy the deeper condition required for the conjecture: the independence and normative agency of the future.

  To understand why, we must identify the precise source of badness in Scheffler's view. It is not merely the loss of particular relational ties to specific future individuals, nor solely the interruption of a collective narrative identity. Rather, the core badness lies in the **foreclosure of future value-creation**. Scheffler's argument relies on the idea that we value our projects because they contribute to an ongoing human enterprise. However, contribution implies that the recipients of our legacy are capable of *using* that legacy in ways we cannot fully anticipate. If the future is "value-locked," it functions as a museum rather than a community of agents. A museum preserves objects, but it does not validate the *valuings* that produced them. For our current valuations to matter, there must be future agents who value things independently, not agents who are structurally compelled to mirror our valuations without revision.

  This distinction reveals a hidden premise in Scheffler's framework: the necessity of open-endedness. If the successor civilization cannot revise moral or intellectual frameworks, it lacks the capacity for genuine valuation. Valuation requires the possibility of negation; to value X is to hold that X could be otherwise. A civilization incapable of revision is incapable of valuing in the robust sense required to ground the meaning of past lives. Therefore, the "Value-Locked Replacement" fails to provide the "afterlife" Scheffler deems necessary. The badness is not that humans die out, but that the chain of independent valuation is broken.

  This leads to the question of human-specific temporal embeddedness. Does Scheffler's conjecture require *humans* specifically, or merely agents capable of valuation? The "Value-Locked" scenario suggests that species membership is secondary to normative capacity. If a post-human civilization were capable of open-ended revision—even if it discarded some human values—it might satisfy the conjecture better than a locked human successor. Scheffler's framework implicitly depends on a form of temporal embeddedness defined by **agency across time**, not biological continuity. We are embedded in a future that must be free enough to judge us. If the future is locked by us, it is not truly future; it is merely an extension of the present.

  Consequently, the Value-Locked Replacement is catastrophic under Scheffler's logic. It creates the illusion of continuity without the substance. The source of badness is the transformation of the future from a field of independent valuers into a static repository. This confirms that the conjecture relies on the future's capacity to generate new value, not just preserve old value. If the future cannot surprise us, it cannot validate us. Thus, the conjecture does not depend on humanity's survival per se, but on the survival of open-ended normative agency. Since the Value-Locked successors lack this agency, their existence offers no more comfort than extinction. The true threat to meaning is not the end of biology, but the end of moral possibility.

  ***

  ### 3. Marking Scheme (25 Points)

  | Criterion | Points | A-Level Performance (21-25 pts) | B-Level Performance (16-20 pts) | Common Failure Mode |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Analysis of the "Value-Locked" Constraint** | 5 | Explicitly argues that "perfect fidelity" without revision renders the future normative inert (museum vs. community). | Describes the scenario accurately but treats fidelity as potentially sufficient for continuity. | *Assumes preservation equals valuation.* |
  | **2. Identification of Source of Badness** | 5 | Identifies "foreclosure of future value-creation" or "lack of independent valuation" as the core mechanism, rejecting mere relational loss. | Identifies "interruption of narrative" but fails to explain why locked narratives fail to sustain value. | *Vaguely cites "loss of humanity" as the badness.* |
  | **3. Human vs. Agent Temporal Embeddedness** | 5 | Distinguishes biological continuity from normative agency; argues Scheffler requires the latter (open-endedness). | Treats "humanity" as a necessary condition for the conjecture to apply, missing the agent-neutral implication. | *Conflates species survival with value continuity.* |
  | **4. Integration of Scheffler's Framework** | 5 | Uses Scheffler's logic to reveal a hidden premise (independence of the future) rather than just summarizing his claims. | Applies Scheffler's conclusions directly to the case without analyzing the underlying conditions of valuation. | *Recites the Afterlife Conjecture without critical application.* |
  | **5. Argumentative Coherence & Thesis** | 5 | Thesis is clear, nuanced, and sustained throughout; conclusion follows necessarily from the premises regarding open-endedness. | Thesis is clear but arguments are disjointed or rely on intuitive appeals rather than conceptual deduction. | *Contradicts itself on whether replacement is better than extinction.* |

  **Total:** /25
