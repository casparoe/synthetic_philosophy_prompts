answer: |-
  1. The PBR theorem relies heavily on the assumption of preparation independence, which some physicists argue is not as innocuous as it first appears.
  2. Rejecting this premise suggests that separate systems can share hidden correlations, a notion that challenges standard modelling practices but isn't strictly impossible.
  3. Furthermore, proving the wavefunction is ontic does not imply it is a physical field like water, but merely that it corresponds directly to physical reality.
  4. Many scholars favour interpretations such as QBism or relational quantum mechanics, which sidestep the theorem by redefining what the quantum state represents.
  5. Ultimately, exploiting such loopholes is viewed as rigorous scientific scrutiny rather than stubbornness, ensuring all foundational assumptions are properly tested.
