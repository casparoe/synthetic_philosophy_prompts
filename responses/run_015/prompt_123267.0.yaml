answer: |-
  Here is a draft of the argument, structured for a science blog feature. It focuses on the logic of causal identity over structural similarity.

  ***

  # The Portability Principle: Why Mechanisms Are Functions, Not Shapes

  In mechanistic interpretability, we are hunting for the "circuits" inside the black box. We want to find the specific subgraphs of neurons and weights that compute specific features: induction heads, arithmetic routines, or deception detectors. But as soon as we try to pin down what constitutes "the same circuit" across different models, we hit a conceptual wall.

  Currently, most anomaly detection systems rely on **architectural isomorphism**. They assume that if a mechanism is the same, it should look the same. We expect weights to align, activation patterns to correlate, and specific neurons to fire in specific sequences. If Model B processes a prompt using a different set of neurons than Model A, our detectors scream "Anomaly!"

  This is a category error. It confuses the *substrate* with the *computation*.

  To build robust mechanistic anomaly detection (MAD), especially for modern sparse architectures, we need to flip the definition. We must argue that **mechanistic identity is defined by interventional portability, not architectural isomorphism.** If a subcircuit can be transplanted from one model to another and preserve its input-output counterfactual profile without retraining, it is the same mechanism—even if the weights are uncorrelated and the physical location is entirely different.

  ### The Transplant Test

  Imagine you have two language models, Model A and Model B. They have the same architecture but different random seeds. They have converged on similar capabilities, but their internal geographies are distinct.

  In Model A, a specific logical operation (say, resolving a pronoun reference) is handled by a tight cluster of neurons in Layer 4. In Model B, the same logical operation is achieved, but the weights are rotated, and the activity is spread across a different set of neurons in Layer 5.

  Under the **isomorphism view**, these are different mechanisms. An anomaly detector comparing activation patterns would flag Model B as deviating from Model A. This is a false positive. The computation is identical; the implementation is just rotated in high-dimensional space.

  Under the **portability view**, we perform a thought experiment (or an actual intervention): We take the subcircuit from Model A and surgically splice it into Model B, replacing the corresponding component. We then run counterfactual tests. Does the hybrid model produce the same output distributions as Model A would have, given the same interventions?

  If the answer is yes—if the subcircuit "clicks" into the new host and performs the exact same causal role without needing fine-tuning—then the mechanism is identical. The weights don't need to match. The neuron indices don't need to align. The only thing that matters is the **causal signature**: how the module transforms information and how interventions on that module change the outcome.

  ### The MoE Trap

  This distinction is not just philosophical; it is an engineering necessity for Mixture of Experts (MoE) systems.

  In dense models, there is some stability in where computation happens. In sparse MoEs, the routing is dynamic. The model learns to send tokens to whichever expert is best suited for the task at that specific training step. Because of the sparsity constraint and the routing noise, the *physical location* of a computation is inherently unstable.

  Consider a specific reasoning heuristic. In one training run, Expert 3 might specialize in this heuristic. In another run, due to slight initialization differences, Expert 7 might pick it up, or the load might be balanced across Experts 7 and 9.

  If your anomaly detection system is based on **activation matching**, MoEs are a nightmare. You will constantly trigger alerts because the routing decisions shift. You will see "anomalous" activation patterns simply because Expert 7 fired instead of Expert 3. This is noise, not signal. It obscures real threats, like a model suddenly employing a novel, unaligned heuristic to solve a problem.

  However, if you define the mechanism by **interventional portability**, the MoE noise vanishes. You ask: "Does the active expert perform the same causal function as the expected expert?"

  If Expert 7 processes the token and produces the same downstream causal effects as Expert 3 would have (verified via patching or causal tracing), then the mechanism is preserved. The system recognizes that the *computation* is normal, even if the *router* chose a different path. This allows the anomaly detector to ignore implementation drift and focus on functional drift.

  ### Why This Reduces False Positives

  The core advantage of the portability definition is that it decouples **what is computed** from **where it is computed**.

  False positives in anomaly detection usually arise from **implementation variance**. Models trained on the same data with different seeds will find different geometric solutions to the same loss landscape. They are functionally equivalent but structurally distinct. Isomorphism-based detectors treat this variance as suspicious.

  Portability-based detectors treat this variance as irrelevant.

  By focusing on the counterfactual profile, we filter out the noise of stochastic gradient descent. We stop asking, "Do these weights look like the safe weights?" and start asking, "Does this circuit behave like the safe circuit?"

  This is critical for safety. A deceptive model might try to hide its intent by mimicking the activation patterns of a safe model (masking) while altering the causal flow. Conversely, a safe model might look "weird" internally due to optimization quirks.
  *   **Isomorphism** is vulnerable to masking (looks safe, isn't) and prone to false alarms on safe quirks.
  *   **Portability** is robust to masking (if the causal effect changes, the transplant fails) and robust to quirks (if the causal effect holds, it's safe).

  ### The Logic of Causal Structure

  Ultimately, this argument rests on a commitment to realism about computation. A mechanism is not a static object; it is a dynamic process. It is defined by its boundaries and its transformations.

  When we say two mechanisms are the same, we mean they occupy the same spot in the space of possible algorithms, not necessarily the same spot in the matrix of weights. In sparse systems, where computation is fluid and distributed, holding onto architectural isomorphism is like trying to identify a river by the specific water molecules flowing in it. The water changes; the channel matters. But even the channel changes in MoEs.

  What remains constant is the flow of causality.

  For mechanistic anomaly detection to scale, it must measure the flow, not the water. By adopting interventional portability as the gold standard for mechanism identity, we build detectors that are invariant to the irrelevant noise of training dynamics and sensitive only to the structural changes that actually matter for alignment. We stop policing the geometry of the weights and start policing the logic of the mind.
