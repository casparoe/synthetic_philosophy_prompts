      *   **Theoretical Lens:** Daniel Dennett's "Center of Narrative Gravity" (CNG).
      *   **Specific Constraint 1:** Do *not* just focus on Paul vs. John as individuals. Treat the *Band* as a collective narrative center.
      *   **Specific Constraint 2:** Map the "players," the "options" (lawsuit, solo records, silence), and the nature of the dissolution (fragmentation vs. walking away from a shared fiction).
      *   **Specific Constraint 3:** Critique Dennett's model. Where does it break down? (Coherence assumptions, biological substrate, group selfhood).
