      *   *The Dissolution:* Is it one center splitting (fission) or four people realizing the center was empty (dissolution of fiction)?

  5.  **Critique Dennett (The "Breakdown" Section):**
      *   *Coherence:* Dennett assumes a drive toward coherence. The Beatles' end was defined by *incoherence*. Does the CNG model handle radical contradiction well?
      *   *Biological Substrate:* Dennett's CNG is tied to a single brain/nervous system. A band has four brains. How does the "gravity" exist between skulls?
      *   *Group Selfhood:* Can a collective truly be a "self" in Dennett's sense, or is it just a metaphor? The legal personhood of Apple Corps complicates this.

  6.  **Drafting - Section by Section:**

      *   **Introduction:** Define Dennett's CNG briefly. Introduce the Beatles not as four men, but as one narrative entity. State the thesis: The breakup was a gravitational collapse of a collective fiction.
