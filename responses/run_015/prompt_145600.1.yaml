prompt: |-
  Analyze the Beatles breakin up in 1970 and the Apple Corps legal mess through Dennett's idea of the self as a center of narrative gravity. Don't just do Paul vs John as individuals. I want you to treat the band itself as a kind of collective narrative center -- four people holding one story together -- and then ask what happens when the gravity well splits. Map it carefully: who were the "players" in the narrative, what options did they actually have (the lawsuit, the solo records, the silence), and whether the dissolution was like one center fragmenting into four or like four people walking away from a fiction they never really shared. Then tell me where Dennett's model breaks down here: does it assume too much coherence in the first place, does it need a biological substrate to hold gravity, and what does the episode say about whether a group can be a self in this sense? Keep it disciplined -- don't force the theory to speak where it's silent.
