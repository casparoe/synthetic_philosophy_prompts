      *   *Key features:* It's not a physical thing (like a soul), it's an abstraction (like the center of gravity of a chair), it requires narrative coherence to maintain stability, and it can shift or dissolve if the narrative breaks.
      *   *Application to Groups:* Can a group have a CNG? Dennett usually applies it to individuals. Extending it to a collective requires careful handling (is it a metaphor or a structural equivalent?).

  3.  **Analyze the Beatles as a Collective CNG:**
      *   *The "Self":* "The Beatles" (1960-1970).
      *   *The Narrative:* Four lads from Liverpool, friendship, creative synergy, "All You Need Is Love," the studio as an instrument, the band as a single entity greater than the sum of parts.
      *   *The Gravity:* This narrative held their business, creative, and personal lives together. It dictated decisions (e.g., stopping touring to focus on albums, managing Apple).
      *   *The Breakup:* The narrative coherence fails. The "gravity well" can no longer hold the mass of conflicting stories.

  4.  **Map the Players and Options (within the CNG framework):**
