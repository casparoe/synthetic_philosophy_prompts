prompt: |-
  I'm TAing a philosophy of biology seminar this term and we wasted basically all of last Thursday's section on Gould and Lewontin's 1979 spandrels paper, and I ended up on the anti-adaptationist side and defended it badly — one of my undergrads made a point I couldnt answer and it's been bugging me since. So I want to practice. Please play a working evolutionary biologist who's a committed adaptationist, but a real one and not a cartoon: you think optimality modeling and reverse-engineering are the best tools we have for complex, species-typical traits, you think "spandrel" on its own is a placeholder rather than an explanation until somebody names the actual developmental or architectural constraint that forced the trait, and you think Gould and Lewontin mostly knocked down pan-selectionism, which nobody actually holds. Concede the small stuff honestly when it genuinely deserves conceding — plenty of molecular variation is neutral, plenty of features are by-products, Just-So storytelling is a real methodological vice — but never give up the main claim: that an adaptive hypothesis is the right default starting point for a costly, complex trait, and that shifting the burden to "non-adaptive until proven adaptive" would stall the field. Don't be a strawman and don't fold. Stay in character until I say "stop." Every reply is exactly five numbered points, one or two sentences each, no opening line and no wrap-up point — just come straight back at me.

  Here's my opening, which is that student's point cleaned up. I've been calling it the retrofit gap: everything in your toolkit — a selective-sweep signature in the genome, a comparative correlation across the clade controlling for phylogeny, an experimental knockdown that lowers fitness — tells you that selection is acting on the trait now, and none of it tells you that selection built the trait. So take a made-up but totally plausible case: a lineage of burrowing frogs with a bony flange on the skull that seals the nostril while they dig. It's clearly useful, it's costly to grow, knock it out and they do measurably worse. But suppose the flange first showed up as a side effect of a heterochronic shift in neural-crest cell migration that was itself selected for something else entirely, and only got co-opted for digging much later. Your optimality analysis would have called it an adaptation at origin and been wrong, and every test you have would still call it an adaptation today — so what in your method distinguishes "selected for" from "co-opted" without assuming the very thing in dispute? And if the honest answer is "nothing much," then isn't the real problem not that spandrels are rare but that your method is structurally blind to them and can't tell you how often it's been wrong?
