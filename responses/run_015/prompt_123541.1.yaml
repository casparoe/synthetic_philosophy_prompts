answer: |-
  Here is a teaching plan designed for an MA seminar. It leverages their background in Frege (sense/reference/truth-conditions) and Austin (illocutionary force) to accelerate into the Gricean tension without getting stuck on introductory definitions.

  ### Session Title: The Calculability Crisis: Generalized Implicature as Shortcut or Inference?

  **Time:** 90 Minutes
  **Carrying Example:** *"X is meeting a woman this evening."*
  *(Why this example? It isolates the indefinite article's semantic contribution from the pragmatic inference that the woman is not X's wife/mother/sister. It relies on world knowledge, not logic, making the pragmatic work visible.)*

  ---

  ### 1. The Explanatory Arc (90 Minutes)

  #### Phase 1: The Pre-requisite (15 mins)
  **Goal:** Establish that *Speaker Meaning* cannot be reduced to *Sentence Meaning* + *Contextual Disambiguation*.
  **Anchor:** Use their Frege/Austin knowledge.
  *   **Frege Check:** Sentence meaning gives us truth conditions (sense/reference).
  *   **Austin Check:** Speech acts tell us what we are *doing* (promising, warning).
  *   **The Gap:** Grice asks: What are we *communicating* that isn't captured by truth conditions or illocutionary force?
  *   **Key Concept:** **Non-natural meaning ($mean_{nn}$).** Communication is the recognition of an intention.
  *   **Necessary Idea:** For implicature to exist, students must accept that **what is communicated exceeds what is encoded.** If they think context only resolves ambiguity (Fregean indexicals) or determines force (Austin), they will treat implicature as "hidden syntax." You must establish that the *proposition expressed* can remain constant while the *communicated content* shifts.

  #### Phase 2: The Mechanism & The Example (20 mins)
  **Goal:** Introduce the Cooperative Principle (CP) not as a moral rule, but as a rational assumption required for inference.
  **The Example:** *"X is meeting a woman this evening."*
  *   **Semantics:** $\exists x (Woman(x) \land Meeting(X, x))$. Truth-conditionally, X's wife counts as "a woman."
  *   **Pragmatics:** The hearer infers: "The woman is *not* X's wife/mother/sister."
  *   **The Calculation (Briefly):**
      1.  Speaker said $p$.
      2.  Speaker is observing CP.
      3.  If X were meeting his wife, the more informative "X is meeting his wife" would have been used (Maxim of Quantity).
      4.  Speaker didn't say that.
      5.  Therefore, Speaker implies it's not his wife.
  *   **Crucial Distinction:** This is **Particularized (PCI)** if the context is specific (e.g., we are discussing X's secret affair). It is **Generalized (GCI)** if this inference arises *by default* without special context.

  #### Phase 3: Misconception 1 — "Implicature is Hidden Literal Meaning" (15 mins)
  **The Trap:** Students will treat the implicature ("not his wife") as part of the truth conditions. They will think the sentence is *false* if he is meeting his wife.
  **The Defusal:** Use **Truth-Conditional Invariance**.
  *   Ask: "If X is meeting his wife, is the sentence *'X is meeting a woman'* false?"
  *   Answer: No. It is semantically true, but pragmatically misleading.
  *   **Frege Connection:** Remind them that Fregean *Sense* determines truth conditions. If the truth value doesn't change when the inference is defeated, the inference is not part of the Sense. It is an overlay.
  *   **Takeaway:** Implicature is detachable from the truth of the proposition.

  #### Phase 4: Misconception 2 — "Cancelability means Speaker Denial" (15 mins)
  **The Trap:** Students think cancelability means the speaker can simply say "I didn't mean that" after the fact to fix a contradiction.
  **The Defusal:** Distinguish **Explicit Cancellation** vs. **Contextual Blocking**.
  *   **Explicit:** "X is meeting a woman, but not his wife." (This works).
  *   **The Nuance:** "X is meeting a woman, but I don't implicate it's not his wife." (This is clunky but possible).
  *   **The Test:** Cancelability must be **non-contradictory**.
  *   **Scenario:** If I say "It's raining" (implicating *here*), can I cancel with "but not here"? Yes. Can I say "It's raining and it's not raining"? No.
  *   **Apply to Example:** "X is meeting a woman this evening, in fact, his wife."
  *   **Point:** If the inference were semantic (literal), this would be a contradiction (like "He is a bachelor and married"). Since it is merely awkward (a violation of Quantity), it proves the inference is pragmatic.

  #### Phase 5: The Core Tension — GCI Calculability (20 mins)
  **Goal:** Confront the central problem: Are GCIs actually calculated?
  *   **The Gricean Line:** Yes. Every time you hear "a woman," you run the Quantity calculation (Why didn't he say 'wife'?). It is a *default inference* derived from rational principles.
  *   **The Levinson/Neo-Gricean Critique:** No. We don't have time to calculate this every time. It is a **heuristic shortcut**. It *looks* like an implicature (it's cancelable), but it functions like semantics (it's automatic).
  *   **The Tension:**
      *   If it's truly Gricean, it must be **calculable** in every instance.
      *   If it's automatic, has it become **conventionalized**?
      *   If it's conventionalized, is it still pragmatics, or is it "pragmatics encroaching on semantics"?
  *   **Discussion Prompt:** "When you heard my example sentence, did you consciously reason through the Maxim of Quantity? Or did the 'not wife' meaning just pop up?"
  *   **Philosophical Stakes:** If GCIs are shortcuts, the boundary between Semantics (encoded) and Pragmatics (inferred) is blurred. This threatens the Gricean architecture.

  #### Phase 6: What to Leave Out (5 mins)
  *   **Formal Derivation Schemas:** Do not write out the full "S said p; there is no reason to think S is violating..." formula on the board. It encourages rote memorization over understanding the *rational necessity* of the inference.
  *   **The Full List of Maxims:** Treat them as "norms of rational exchange." Focus on **Quantity** (informativeness) and **Relation** (relevance). Manner and Quality are less central to the GCI/PCI tension.
  *   **Post-Gricean Formalisms:** Avoid Horn Scales or Relevance Theory optimality conditions. Keep the focus on the *status* of the inference, not the mechanics of the next generation of theories.

  ---

  ### 2. End-of-Session Check (5 mins)
  **Goal:** Test understanding of *calculability*, not just maxim identification.
  **Task:** The "Blocked Inference" Scenario.

  **Prompt:**
  > "Consider the sentence: *'The captain shook hands with the player.'*
  > Generalized Implicature: The captain and the player are on *opposing* teams (otherwise, why specify 'the player'?).
  >
  > **Scenario A:** A news report about a post-match ceremony.
  > **Scenario B:** A report about a team huddle before the match.
  >
  > In Scenario B, the 'opposing teams' inference does not arise. **Without using the word 'cancel' or 'context', explain why the Gricean calculation fails to generate the implicature in Scenario B.**"

  **Correct Answer Indicators:**
  *   **Pass:** They explain that in Scenario B, the assumption that the speaker is being *maximally informative* changes. Specifying "the player" is relevant for identification in the huddle, not to mark opposition. The *premise* of the calculation (that the speaker is observing Quantity in a specific way) is altered by background knowledge.
  *   **Fail:** They say "Because the context is different" (too vague) or "Because the Maxim of Relation overrides Quantity" (naming maxims without explaining the rational shift).
  *   **Why this works:** It forces them to simulate the *calculation* and show where it breaks, proving they understand that GCIs are not fixed associations but dependent on the rational assumptions of the exchange.

  ---

  ### 3. Why "Some Students Failed" is Banned
  You asked to avoid the scalar implicature classic (*"Some students failed"* $\rightarrow$ *"Not all"*).
  **Reason:** It obscures the GCI/PCI tension because it looks too much like logic.
  1.  **Logical Distraction:** Students immediately start thinking about the Square of Opposition and existential quantifiers. They debate whether "some" *logically* entails "not all," which derails the pragmatic discussion.
  2.  **Hidden Calculability:** The inference from "some" to "not all" is so standardized it feels purely semantic. It doesn't vividly demonstrate the *work* of inference the way "meeting a woman" (which relies on social norms about kinship terminology) does.
  3.  **GCI/PCI Blur:** "Some" is almost always a GCI. It is harder to construct a natural PCI where "some" implies "all" without it feeling contrived. "Meeting a woman" allows for a natural PCI (e.g., "He's meeting a woman... yes, his wife, finally!") that feels distinct from the GCI.

  ---

  ### 4. Confidence & Uncertainty Flag

  **Confidence Level:** **High (85%)**
  This structure respects the MA level by skipping intro definitions and targeting the philosophical fault line (semantics/pragmatics boundary). The "Meeting a woman" example is canonical in the Neo-Gricean literature (Levinson), making it excellent preparation for further reading.

  **Point of Least Certainty:** **The "Calculability" Phenomenology.**
  I am least sure about how easily students will grasp the difference between *"I calculated this automatically"* vs. *"This is encoded."*
  *   **Risk:** Students may argue that just because an inference is fast/automatic doesn't mean it isn't calculated (analogous to riding a bike).
  *   **Mitigation:** Be prepared to pivot to **Developmental Evidence** or **Processing Time** if they push back. (e.g., "If it were calculated, children should acquire it later than semantics; evidence is mixed."). However, for a 90-minute session, keep it conceptual: If it's calculable, it *must* be defeasible by any relevant background knowledge. If it resists defeasibility, it's likely encoded. Stick to the *defeasibility* test rather than the *speed* test to avoid cognitive science rabbit holes.
