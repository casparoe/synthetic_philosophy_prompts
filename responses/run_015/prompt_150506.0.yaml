answer: |-
  Good morning, everyone. Welcome to "Infrastructure and Contingency."

  I know, on paper, this room looks like a mistake. Half of you spend your days calculating return periods and concrete tensile strength; the other half spend yours deciphering sixteen-century Italian republicanism. Usually, these groups don't mix unless there's a budget crisis involved. But I think we're here because we're actually wrestling with the same problem, just using different vocabularies.

  To get us started, I want to lean into the elephant in the room: Machiavelli. I know, for some of you, that name triggers a reflex to check your wallet. But I'm not interested in the "cunning politician" caricature. I want to talk about the hydraulic engineer hidden inside *The Prince*.

  Specifically, I want to look at how Machiavelli describes *fortune*. He doesn't talk about it as abstract luck. He talks about it as a river. He says fortune is like one of those violent rivers that, when they swell in anger, flood the plains, ruin trees and buildings, and wash soil from one place to another. Everyone runs away, everyone yields to the fury, because you can't stop it.

  But here's the catch he adds: Just because the river is violent doesn't mean men are helpless. When the weather is calm, before the storm hits, they can build levees and embankments. So, when the water rises again, it stays within channels, or its force is less dangerous.

  This is where I want us to pause. In modern engineering ethics, we talk a lot about resilience and robustness. We design for a specific risk profile. We want predictability. But Machiavelli's concept of *virtù*—which is his term for human agency or capacity—isn't just about building a wall high enough to wait out the storm. It's not passive resistance. *Virtù* is the capacity to actively redirect the flow in real time. It's the difference between hoping your levee holds, and having the political and technical capacity to open a spillway somewhere else to save the city.

  That creates a real tension. Modern design often aims for a risk-neutral state where the infrastructure handles the contingency automatically. Machiavelli argues that contingency requires active, sometimes aggressive, intervention. You can't just build it and leave it. You have to manage the force.

  Now, I need to address the uncomfortable part of this analogy. Machiavelli famously gendered fortune as a woman, arguing that she responds to force, and that it is better to be impetuous than cautious because fortune is a woman who must be beaten into submission.

  I am not standing here to endorse that imagery. It's violent, it's misogynistic, and it doesn't belong in our design ethics. But I do think we need to understand *why* he uses it. For Machiavelli, the gendered metaphor is about the failure of passivity. He thinks that if you try to negotiate with fortune, if you try to be too cautious or wait for the perfect moment, you lose. He's arguing that passive resistance fails against systemic shock. Whether you're dealing with a floodplain or a political crisis, waiting for the system to stabilize on its own is a losing strategy. You have to impose shape on the chaos.

  But here is where I think we need to complicate Machiavelli for this workshop. He presents a neat split: half our lives are controlled by fortune, half by *virtù*. Fifty percent nature, fifty percent human will.

  The problem is, that river he's talking about? It's not wild. Not anymore.

  When we look at a flood event today, the "fortune" part—the water—is already moving through a landscape shaped by centuries of prior *virtù*. There are old levees upstream, there are dams changing the sediment load, there are zoning laws that put people in the floodway. The river's course is already a product of human decisions.

  So, when the flood comes, it isn't purely external nature hitting human infrastructure. It's past infrastructure colliding with present reality. The "contingency" we're facing is often just the bill coming due for engineering decisions made fifty years ago. That messy feedback loop breaks Machiavelli's clean fifty-fifty split. The river is already political.

  So, over the next two days, I'm not asking the engineers to become political theorists, and I'm not asking the theorists to start sizing culverts. I'm asking us to look at that messiness together. When does a design solution become a political problem? When does a political decision become a hydraulic risk?

  Let's spend the weekend figuring out how to channel this conversation without pretending the water is ever really wild.

  Thanks, and let's get to work.
