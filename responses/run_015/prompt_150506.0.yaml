prompt: |-
  I'm giving the opening remarks at this weird little workshop we're running called "Infrastructure and Contingency" — half the room are civil enginers who build flood barriers, half are grad students in early modern political theory. I was talking about this with a friend who does hydraulic modeling and she got annoyed when I mentioned Machiavelli, so now I really want the talk to work for both sides without sounding like I'm just smuggling philosophy into an engineering meeting.

  Specifically, I need about a six-minute talk that uses Machiavelli's idea of fortune and virtù as the actual spine of it, not decorative window dressing. I want to take his river analogy seriously — fortune as a river that can be channeled but suddenly overflows — and argue that "virtù" isnt just resilience or robustness (the way engineers usually frame it). Its closer to the capacity to actively redirect flow in real time, and that creates a real tension with modern engineering ethics that prizes predictability and risk-neutral design. I also want to reference the gendered imagery of fortune as a woman who must be driven back, but frame it so it doesnt sound like Im endorsing violence — more like explaining why Machiavelli thinks passive resistance fails. And I want to complicate the usual "half fortune, half virtù" split by pointing out that the river's course is already shaped by prior human stuff — old levees, upstream dams — so fortune isnt purely external, which makes that neat 50/50 division get pretty messy. Please dont use direct quotes from The Prince unless you verify them; actually I'd rather you paraphrase the river passage yourself since I dont want a misquote in front of this crowd. Keep it casual but not sloppy — I'm speaking, not writing an essay — and avoid making it sound like I'm just telling the engineers to "be more Machiavellian."
