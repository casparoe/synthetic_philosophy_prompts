      *   *Most efficient fix:* Qualify C3. Non-empirical virtues provide *rationale for pursuit* and *tentative belief*, but acknowledge the risk highlighted in C6. This turns C6 from a worry into a caveat.
      *   *Second most efficient fix:* Qualify C5. The "explanation" of fine-tuning does not require the *actuality* of other vacua, only their *possibility* (modal realism). This satisfies C1 (no realist commitment to actual other vacua).

      *   *Is there a single revision?*
      *   If I change C1 to "Explanatory Footprint" instead of "Causal Footprint."
          *   Fixes C1/C5 (Other vacua explain fine-tuning, so they are in the explanatory footprint).
