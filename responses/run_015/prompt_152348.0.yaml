          *   Does it fix C3/C6? No.
      *   If I change C3 to "Pragmatic Weight."
          *   Fixes C3/C6 (Bias doesn't matter for pragmatism).
          *   Weakens C2 (Belief becomes acceptance).
          *   Doesn't fix C1/C5.

      *   *Conclusion:* No single revision fixes *all* tensions without collapsing the package (e.g., giving up realism entirely). But shifting from "Causal" to "Explanatory" realism fixes the biggest ontological cluster (C1, C4, C5). Shifting C3 to "Defeasible Epistemic Weight" addresses C6.

      *   *Wait, I need to check if C1/C5 is actually a contradiction.*
      *   C1: Realism warranted *only* for causal footprint.
      *   C5: Explaining fine-tuning is a virtue *even when* appealing to entities outside footprint.
      *   *Crucial distinction:* C5 says it's a *virtue*, not that realism is *warranted*. One can value an explanation without committing to the literal truth of the explainer (Instrumentalism). However, "Fine-tuning explanation" via Multiverse usually relies on the *existence* of the multiverse to select the constants. If they don't exist, they don't select. So C5 implicitly requires realism.
      *   *So C1/C5 is a real tension.*

