      *   **Introduction:** Acknowledge the sophistication of the position (it's a nuanced "Selective Realism").
      *   **Taxonomy of Tensions:** Group into Ontological (C1, C4, C5) and Epistemological (C2, C3, C6).
      *   **Ranking:**
