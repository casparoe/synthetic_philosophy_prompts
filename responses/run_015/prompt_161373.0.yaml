answer: |-
  # Epistemic Warrant: A Decision Tree for *Pramāṇa* Classification

  **Instructions:** Take a single episode of coming to know (e.g., 'I know the kitchen is empty'). Run it through the six binary filters below. The path determines the warrant type. Note that schools of philosophy accept different paths as valid.

  ### I. The Decision Tree (Six Filters)

  1.  **Direct Contact:** Does the warrant require the object itself to be in contact with a sense faculty?
      *   **Yes** → **Perception** (*Pratyakṣa*)
      *   **No** → Go to 2.
  2.  **Absence:** Is what gets known purely an absence (something *not* being there)?
      *   **Yes** → **Non-apprehension** (*Anupalabdhi*)
      *   **No** → Go to 3.
  3.  **Linguistic Agency:** Does it require understanding a sentence from a source taken to be reliable?
      *   **Yes** → **Testimony** (*Śabda*)
      *   **No** → Go to 4.
  4.  **Similarity Match:** Does it turn on a remembered similarity used to identify an unfamiliar object (e.g., 'this looks like that')?
      *   **Yes** → **Comparison** (*Upamāna*)
      *   **No** → Go to 5.
  5.  **Universal Link:** Does the step require a remembered exceptionless link between a sign and what it indicates (e.g., smoke → fire)?
      *   **Yes** → **Inference** (*Anumāna*)
      *   **No** → Go to 6.
  6.  **Explanatory Necessity:** Does it require positing an unobserved state of affairs to make an observed one intelligible, *and* does the route stop counting as a warrant if you already knew the fact by another route?
      *   **Yes** → **Postulation** (*Arthāpatti*)
      *   **No** → **Unwarranted / Guesswork**.

  ---

  ### II. Case Classification (Classical & Modern)

  | Warrant | Classical Case | Modern Case | Tree Path |
  | :--- | :--- | :--- | :--- |
  | **Perception** | Seeing a jar on the table. | Reading the time off a phone screen (visual data). | 1-Yes |
  | **Non-apprehension** | Knowing the jar is *not* on the table. | Checking an app; no notification means no rain. | 1-No, 2-Yes |
  | **Testimony** | The forester says 'This is a *gavaya*'. | A blood-test result in a letter from the lab. | 1-No, 2-No, 3-Yes |
  | **Comparison** | Matching the *gavaya* to the cow description. | Recognising a route on a satnav map by shape. | 1-No to 4-Yes |
  | **Inference** | Smoke on the hill implies fire. | A smoke alarm sounding implies fire. | 1-No to 5-Yes |
  | **Postulation** | Devadatta is fat but eats not by day (so eats by night). | Partner is dry but umbrella is wet (so it rained). | 1-No to 6-Yes |

  ---

  ### III. School Regions (Valid Paths)

  Schools are defined by which branches they accept as independent warrants.

  *   **Cārvāka (Materialist):** Accepts **Path 1 only**. All other paths reduce to perception or are rejected.
  *   **Buddhist (Dignāga/Dharmakīrti):** Accepts **Paths 1 & 5 only**. Testimony and Comparison are reduced to Inference; Non-apprehension is a type of Inference; Postulation is rejected.
  *   **Nyāya:** Accepts **Paths 1, 2, 3, 4, 5**. Rejects Path 6 (Postulation reduces to Inference).
  *   **Prābhākara Mīmāṃsā:** Accepts **Paths 1, 3, 4, 5, 6**. Rejects Path 2 (Non-apprehension reduces to Perception/Inference).
  *   **Bhāṭṭa Mīmāṃsā:** Accepts **All 6 Paths**.

  ---

  ### IV. Empty Cells & Structural Blurs

  **The Empty Cells (Theoretical Combinations)**
  *   *Absence + Linguistic Agency:* (Testimony about an absence). **Status:** *Unattractive.* Schools treat this as simple Testimony, not a hybrid warrant.
  *   *Direct Contact + Explanatory Necessity:* (Perception that requires positing a gap). **Status:** *Incoherent.* Perception is direct; postulation fills a gap where perception fails.
  *   *Similarity + Universal Link:* (Comparison via necessary connection). **Status:** *Unexplored.* Comparison relies on resemblance, Inference on necessity; mixing them collapses the distinction.

  **The Indistinguishable Pairs (Tree Limitations)**
  *   **Comparison vs. Testimony:** The tree separates these at Q3/Q4. However, if the 'description' is linguistic (e.g., 'a *gavaya* is like a cow'), Comparison looks like Testimony. Nyāya insists the *knowledge of the relation* is perceptual/comparative, not testimonial. Buddhists collapse both into Inference.
  *   **Inference vs. Postulation:** The tree separates these at Q5/Q6. The 'Wrinkle' (Q6) is the only divider: Postulation fails if the fact is known otherwise; Inference does not. However, if every postulation is just an inference from a conflict, the distinction vanishes (the Nyāya objection).

  ---

  ### V. Notes on the 'Wrinkle' (Novelty Condition)

  Question 6 contains the critical constraint: *'Does the route stop counting as a warrant if you already knew the fact by another route?'*
  *   **Inference:** Valid even if you already knew the conclusion (e.g., inferring fire from smoke even if you saw the fire earlier).
  *   **Postulation:** Invalid if the fact is known otherwise. If you *saw* Devadatta eating at night, you cannot *postulate* it to explain his fatness. This condition prevents Postulation from swallowing all Inference.

  *Handout prepared for Comparative Epistemology Reading Group.*
