  ### Three Angles on Reshaping Public Justification

  **1. Explicit Framework Justification (The "Why" Before the "What")**
  Instead of opening a justification with compliance metrics ("This meets R-1 standards"), planners should open with the external value choice ("We adopted R-1 standards here to prioritize single-family stability over density"). This shifts the discourse from verifying facts to debating values. It prevents the "authority collapse" by acknowledging the external choice upfront, making the planner a transparent agent of policy rather than a hidden architect of rules.

  **2. Distinguishing Hearing Types (Internal vs. External Venues)**
  Structurally separate "Compliance Hearings" (internal questions of fact within the code) from "Framework Hearings" (external questions about changing the code itself). Currently, these get mashed together in variance requests, confusing citizens. By clearly labeling when a decision is about interpreting rules versus choosing values, planners can manage expectations. Citizens won't feel misled into thinking a value debate is just a math problem.

  **3. Legitimacy through Transparency ( Owning the External)**
  Counter-intuitively, admitting the framework is optional strengthens authority. If planners present the code as a tool chosen for specific community goals, citizens can evaluate the tool's effectiveness. When the code fails to meet those goals, the solution is to update the framework (external) rather than break it (internal variance). This keeps the planner's authority intact because it rests on honest facilitation of community values, not on the fragile pretense of technocratic neutrality.
