      *   *Scientific Essentialism:*
          *   Natural Kinds: Essentialism holds (H2O is essential).
          *   Artificial Kinds: Essentialism weakens. Function can trump structure in legal definition.
          *   *The Twist:* The synthetic substance isn't "water" (scientifically), but it might infringe a patent on "aqueous solutions" if the claim is construed via primary intension.
      *   *Conclusion:* The framework creates a wedge between scientific identity and legal scope.

  6.  **Refining for "Tightness" and Specificity:**
