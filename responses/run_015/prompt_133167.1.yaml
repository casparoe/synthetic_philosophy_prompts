prompt: |-
  hey, can you analyze Sweden's 1967 traffic switch — Dagen H — through David Lewis's account of convention? Don't just map the obvious coordination problem, I already know that part. Instead, dig into whether Lewis's conditions actually hold up: was there common knowledge of a preference for conformity before the switch, or did the state campaign manufacture it? Does the government picking the date and enforcing it with law break the idea that the regularity is arbitrary in Lewis's sense? Then contrast this with an evolutionary-game-theoretic story — local imitation, punishment for deviation, that kind of thing — and say whether that explains the regional resistance and the pedestrian lag better than Lewis's rational-choice framing. I want an honest account of where Lewis misses the dynamics and where the evolutionary framing misses the intentional design. Also please say how confident you are in what you claim and single out the point you're least sure about — probaby the part about pedestrian norms being a seperate convention? There's a typo in there but ignore.
