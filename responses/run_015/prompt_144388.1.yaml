emic practices can correct long-standing stories that previously leaned toward state-level, victorious-language perspectives. Two pairs are especially tense for me: the Roman and British cases both involve politically dominant groups, yet in one I see corruption and in the other relative reliability; and the minority-chronicle and quantitative-revision cases both lack victor-power, yet one seems biased and the other corrective.

  Is there a coherent principle—perhaps one that distinguishes archival control from hermeneutic framing, or that weights source density against narrative interest—that captures all six verdicts? Please state it precisely, identify which clause handles each case, and tell me what it predicts for a scenario I have not considered: synthetic historical narratives generated by training on digitized corpora that overwhelmingly represent state-level, victorious-language archives, where no human victor is actively suppressing alternatives but the data distribution itself is skewed. If no single principle saves every judgment, be explicit about which verdict I should overturn for the sake of simplicity, and explain what the resulting account says about that synthetic-archive case.
