answer: |-
  Your friend has constructed a very tight, philosophically sophisticated version of the **Causal Inefficacy Objection**. It mirrors arguments made by philosophers like Alston, Norcross, and Sinnott-Armstrong. The reason it feels so sticky is that it relies on a premise that seems like common sense: *Morality is about making the world better.*

  However, your intuition about the poison case (6) is the correct anchor. If the argument implies the 106th poisoner is permitted to join the murder, the argument is broken.

  Here is the diagnosis: You should reject **Step (1)**.

  ### The Diagnosis: The Counterfactual Fallacy

  Step (1) asserts the **Difference Principle**: *An act gives you a moral reason only if, holding the rest of the world fixed, the outcome would have been different without it.* This relies on a specific theory of causation called **Counterfactual Dependence** (often called "but-for" causation: *but for* my act, would the harm have occurred?).

  **Why it looks perfectly fine:**
  It aligns with our intuitive, legalistic sense of responsibility. In court, we often ask, "Did this action cause the harm?" and we test that by asking, "If they hadn't done it, would the victim be alive?" It feels clean, objective, and immune to magical thinking. It protects you from being responsible for things you couldn't control.

  **Why it is wrong:**
  It fails catastrophically in cases of **Overdetermination** (your poison case) and **Thresholds** (voting, supply chains).
  In the poison case, the death is *not* counterfactually dependent on the 106th gram. The victim dies anyway. Yet, the 106th person is clearly morally culpable. Why? Because they **contributed** to a harm, even if they didn't **determine** it.

  By rejecting (1), you are asserting that **Causal Contribution** is sufficient for moral reasons, even without **Counterfactual Necessity**.

  ### The Alternative: Complicity and Causal Sets

  If you reject (1), you replace it with a view that acknowledges **Complicity** or **Participation**. There are two ways to flesh this out, depending on how much you want to preserve consequentialism:

  1.  **The Complicity View (Non-Consequentialist):** You have a reason not to participate in wrongful collective activities, even if your participation doesn't change the aggregate outcome. The reason is about your relationship to the harm, not just the harm's magnitude.
  2.  **The NESS View (Refined Consequentialism):** Philosophers like Hart and Honoré propose the **NESS test** (Necessary Element of a Sufficient Set). A cause is not something without which the effect wouldn't happen; it is a *necessary element of a set of conditions that was sufficient* for the effect to happen.
      *   In the poison case: The 100 grams are a sufficient set. Your gram was part of that set. You are a cause.
      *   In the chicken case: The total demand of all shoppers is a sufficient set for the factory farm's existence. Your purchase is a necessary element of *that total demand*, even if it isn't the marginal trigger for *this week's order*.

  ### What Does Rejecting (1) Cost You?

  Rejecting (1) is not free. It comes with three significant costs:

  1.  **Loss of Simplicity:** The Difference Principle is computationally easy. You just check the counterfactual. Rejecting it requires you to analyze *systems* and *structures*. You have to ask, "Am I part of a sufficient set for harm?" rather than "Did I trigger the harm?"
  2.  **Blurring the Agent/Outcome Distinction:** Your friend grants you "reasons about what sort of person you want to be" (Step 3) but dismisses them as self-regarding. By rejecting (1), you are arguing that *who you are* (a participant in harm) is itself an other-regarding moral fact. You are merging integrity with outcome.
  3.  **The "Futility" Problem:** You have to accept that sometimes you will do the right thing (boycott) and the outcome (number of chickens killed) will be *exactly the same* as if you hadn't. You must be comfortable with the idea that morality sometimes requires acts that do not optimize the immediate physical state of the world, but rather maintain your non-participation in a harmful structure.

  ### Does It Handle the Mundane Chicken Case?

  Yes. Even if your friend is right about the supply chain buffers (Step 2), and even if your specific purchase didn't trigger a specific order:
  *   **On the Complicity View:** You are financially sustaining a system you acknowledge is harmful. You are making yourself a co-operator in the practice.
  *   **On the NESS View:** You are part of the causal set that makes factory farming viable. Without *people like you*, the system fails. You are a causal contributor to the industry's persistence, even if you aren't the marginal trigger for this week's shipment.

  ### Does It Handle the 106th Poisoner?

  Yes, and this is where the view pays off.
  *   **The Friend's View (1):** The 106th poisoner is permissible because the death is counterfactually secure without them.
  *   **Your New View (Reject 1):** The 106th poisoner is joining a **Sufficient Set for Murder**. By adding their gram, they become a causal contributor to the death. They are not "inert." They are actively participating in a lethal mechanism. The fact that others *also* contributed does not absolve them; it just means the harm was overdetermined.

  ### A Note on Step (4) (The "Sign Uncertainty" Claim)

  While I recommend rejecting (1), you should also know that your friend's Step (4) is empirically vulnerable, even if you keep (2).
  He claims the expected value has an **unknown sign** (buying might *reduce* chicken deaths). This is false.
  *   Buying factory-farmed chicken can either *increase* expected deaths (if you cross a threshold) or *do nothing* (if you are buffered).
  *   It cannot *decrease* expected deaths. Paying money into a system never reduces the resources available to that system.
  *   Therefore, the Expected Value is $\ge 0$. If there is *any* non-zero probability of being the marginal buyer (and supply chains are not metaphysically perfect buffers), the Expected Value is positive (harmful).
  *   Your friend tries to block this with "Pascalian" worries, but standard decision theory handles small probabilities of large harms routinely (e.g., we wear seatbelts for low-probability crashes).

  ### Summary for Your Seminar

  Tell your friend:
  *"I reject (1). You are conflating **Counterfactual Dependence** with **Causal Responsibility**. In the poison case, the 106th person is clearly responsible, which proves that an act can be morally significant even if the outcome doesn't counterfactually depend on it. If you accept that the poisoners are wrong, you must accept that moral reasons attach to **contributing to a harmful sufficient set**, not just to **triggering a difference**. This handles the chicken case: I am contributing to the viability of the factory farming system, even if I am not the marginal trigger for this week's pallet."*

  This preserves your intuition about the poisoners, respects the supply chain facts (you don't need to claim you *did* trigger the order), and blocks the slide into nihilism about voting and emissions.
