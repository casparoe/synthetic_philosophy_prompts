  **The Repaired Principle**

  1.  **Measurable Mechanism:** The causal mechanism must remain operative and quantifiable today. *(Forced by Case 7: confirms physics-based models.)*
  2.  **Stock vs. Flow:** The factor defeating the forecast must rely on depleting a finite stock identifiable within the theory's ontology, not on reclassifying resources via price or technology. *(Forced by Case 3 vs. 1: distinguishes nitrogen stocks from elastic oil definitions.)*
  3.  **Accumulating Pressure:** During the reprieve, evidence of deferred pressure must accumulate rather than vanish. *(Forced by Case 2 vs. 1: distinguishes dormant misery from resolved scarcity.)*
  4.  **Physical Constraint:** The theory must posit a physical limit, not a metaphysical one like "ingenuity." *(Forced by Case 6: prevents immunity machines.)*

  **New Verdicts**

  **Fusion Power ("30 years away"):** **Refuted.** This fails Clause 1 and 2. It is not a model with a mechanism but a moving goalpost reliant on indefinite engineering optimism. There is no accumulating pressure or finite stock being depleted to buy time; it is rhetorical slack, not physical dormancy.

  **1970s Ice Age:** **Refuted.** This fails Clause 1. The mechanism (orbital forcing) was real but overwhelmed by the anthropogenic forcing variable (CO2) which was underestimated. Unlike Malthus, where the constraint returned, here the causal weighting was simply wrong; the pressure did not accumulate, it reversed.

  **Conclusion**

  "Right but early" is a legitimate status only when the clock is physical, not rhetorical.
