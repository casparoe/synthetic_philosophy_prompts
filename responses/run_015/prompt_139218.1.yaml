      *   *Formula 2: The "Respect for Agency" Deontologist.* Lying is wrong unless the agent has waived their right to truth (explicitly) or is incapable of agency (children). Dementia patients are tricky—are they incapable? If incapable, benevolence rules. If capable of *some* agency, truth rules. (Predicts: Fine, treating her like the child).
      *   *Formula 3: The "Hypothetical Consent" Rationalist.* What would she choose if rational? She would choose truth. (Predicts: Not Fine).
      *   *Wait, looking at Case 6:* "No individual buyer is made worse off... Not Fine." This kills pure Utilitarianism. It suggests **Integrity/Trust** has intrinsic value.
