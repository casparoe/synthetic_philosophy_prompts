      *   *Key Distinction:* It looks like a mix of **Consequentialism** (outcomes matter) and **Deontology/Contractualism** (agreements/autonomy matter). But specifically, it looks like **Rule Utilitarianism** or **Preference Utilitarianism** or **Virtue Ethics** focused on *Benevolence vs. Betrayal*.

