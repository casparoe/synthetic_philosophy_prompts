answer: |-
  This is a fascinating puzzle. You have effectively built a dataset of your friend's moral intuitions. The fact that you can generate multiple formulas that fit the data perfectly is a classic problem in ethics (and science): **underdetermination.** The data you have so far is not sufficient to distinguish between competing theories.

  Here is the breakdown of what your friend is likely to say, the hidden rules she is actually using, the truth about "particularism," and the definitive test case.

  ### 1. What will your friend say about the Dementia Case?

  **Prediction:** She will say it is **Fine** to lie.

  **Reasoning:**
  Look at the structure of her "Fine" verdicts in your list. They cluster around two conditions:
  1.  **Benevolence:** The lie prevents pain or creates joy for the recipient (1, 3, 5, 7).
  2.  **Capacity/Agency:** The recipient is either not capable of processing the truth (7, the child) or the lie protects them from an external threat they cannot handle (3, torture; 10, elderly neighbor).

  Look at her "Not Fine" verdicts. They cluster around:
  1.  **Violation of Explicit Will:** The recipient asked for truth and was denied (4).
  2.  **Betrayal of Trust/Intimacy:** The omission changes the nature of the relationship secretly (9).
  3.  **Self-Serving Deception:** The lie benefits the liar, not the lied-to (2, 6).

  In the dementia case, there is no *explicit* prior instruction to tell the truth (distinguishing it from Case 4). The deception is benevolent (distinguishing it from Case 2 and 6). The recipient lacks the capacity to integrate the truth (aligning it with Case 7, the child). Therefore, her intuition will almost certainly categorize this as "Benevolent Paternalism," which she has consistently approved in the past.

  ### 2. The Competing Rules (The Formulas)

  You mentioned you have three or four formulas that fit the ten verdicts. Here are the two strongest candidates that fit the data but diverge on the dementia case (and specifically on your proposed test case).

  **Rule A: Preference Utilitarianism (The "Waiver" Rule)**
  *   **The Formula:** Lying is wrong *unless* the person has waived their right to the truth (explicitly or implicitly) OR if telling the truth causes severe harm that outweighs the value of truth.
  *   **How it fits the 10:** It explains Case 4 (no waiver) vs. Case 5 (waiver). It explains Case 3 (severe harm overrides). It explains Case 6 (no waiver, no severe harm to buyer = wrong).
  *   **Verdict on Dementia:** **Not Fine.** Why? Because a "competent past self" is usually assumed to prefer truth. If we don't know her preference, the default is truth. Lying violates the autonomy of the person she *was*.

  **Rule B: Benevolent Capacity Threshold (The "Care" Rule)**
  *   **The Formula:** Lying is wrong between competent equals. However, if the recipient lacks the capacity to process the truth without significant distress, and the lie is for their benefit, it is permitted. Explicit prior instructions matter, but current welfare matters more when capacity is lost.
  *   **How it fits the 10:** It explains Case 7 (child lacks capacity). It explains Case 4 (competent patient) vs. Case 5 (competent patient delegating). It explains Case 1 (social capacity for surprise is part of the fun).
  *   **Verdict on Dementia:** **Fine.** The patient has crossed the threshold of capacity (like the child). Therefore, the "truth default" is suspended, and "minimize suffering" takes over.

  **Which one is she running? (My Best Guess)**
  She is running **Rule B (Benevolent Capacity Threshold).**

  **Why?**
  Case 6 is the key. In Case 6, the coffee company lies, and *no individual buyer is measurably worse off.* A strict Utilitarian (Rule A variant) might say that's fine. But she says it's *not fine*. This means she values **Integrity** in transactions between competent agents.
  However, in Case 7 (Tooth Fairy), she allows deception of a vulnerable agent for their benefit.
  This suggests her core principle is: **"Respect the autonomy of competent agents; protect the well-being of vulnerable agents."**
  Since the dementia patient is now "vulnerable" (lacking capacity) rather than "competent," the switch flips from Respect to Protection.

  ### 3. Is "It Depends" a Real Position?

  You asked whether Moral Particularism (her claim that "each case is its own thing") is a real philosophical position or a way of avoiding the question.

  **It is a real position, but your friend is likely not using it.**

  *   **The Real Position:** Philosophical Particularists (like Jonathan Dancy) argue that moral reasons function *holistically*. A feature like "lying" is not inherently bad; it becomes bad only in context. In one case, lying is a betrayal; in another, it is an act of kindness. They argue that trying to codify this into a "rule" inevitably fails because the context changes the moral valence of the feature itself.
  *   **The Avoidance:** In 90% of arguments, when someone says "it depends on the details," they mean "I have a rule, but I haven't thought hard enough to articulate it, and if I articulate it, you might find a counter-example."

  **Diagnosis:** Your friend is likely an **unreflective generalist.** If she were a true particularist, she would struggle to explain why Case 4 and Case 5 are different *at all*, since the feature "doctor hiding diagnosis" is present in both. The fact that she distinguishes them based on the patient's prior statement proves she *is* weighing specific features (consent vs. no consent) consistently. That is the definition of running a rule. She is avoiding the question because articulating the rule makes it vulnerable to your scrutiny.

  ### 4. The Clean Test Case

  Your proposed test case (the pre-dementia instruction) is **excellent**. It is arguably the cleanest possible discriminator.

  **The Case:**
  > The same woman, two years before dementia, while perfectly competent, signed a document stating: *"If I ever lose my memory, do not lie to me to spare my feelings. I would rather feel grief than live in a delusion."*
  > Now she has dementia. She asks about the dead sister. Telling the truth causes her daily grief. Lying spares her grief.

  **Why this works:**
  This isolates the variable of **Prior Autonomy** vs. **Current Welfare**.

  *   **If she says "Fine" (Lie anyway):** She is a **Hard Paternalist**. She believes current suffering trumps past consent. This contradicts Case 4 (where past consent ruled). If she says this, she is inconsistent between Case 4 and this case.
  *   **If she says "Not Fine" (Tell the truth):** She is a **Deontologist regarding Autonomy**. She believes a competent self binds the incompetent self. This aligns with Case 4.
  *   **If she says "It depends":** Ask her *what* it depends on. If she can't name a variable, she is avoiding.

  **Is there a cleaner one?**
  The only way to make it cleaner is to remove the "grief" variable to ensure she isn't just weighing "How bad is the grief?"
  Try this variation:

  > **The "Happy Delusion" Case:**
  > A man with dementia believes he is still a famous pilot. He is happy, calm, and cooperative when allowed to believe this. The staff "play along" (lying). If told the truth, he becomes agitated and depressed, but is not in "grief" per se, just confused and unhappy. He left no prior instructions.
  > **Verdict?**
  >
  > **The "Prior Instruction" Variation:**
  > Same man, but he left a note: *"If I think I'm a pilot, tell me I'm not. I hate lies."*
  > **Verdict?**

  **Recommendation:**
  Stick with your **Prior Instruction** case. It directly pits her Case 4 logic (Doctor/Patient instruction) against her Case 7 logic (Child/Incapacitated care).
  *   If she prioritizes the Note: She admits the rule is **"Respect Prior Autonomy."**
  *   If she prioritizes the Grief: She admits the rule is **"Minimize Suffering when Capacity is Lost."**

  **Final Advice:**
  When you present this, do not ask "What do you think?" Ask "Which of these two principles wins?"
  1.  The principle that kept the doctor from lying in Case 4 (Respect the patient's stated wish).
  2.  The principle that allowed the parents to lie in Case 7 (Protect the vulnerable from distress).

  Force her to choose which principle governs the dementia patient. That will break the "it depends" defense.
