      *   *What is the POE?* In standard Bayesian conditionalization, $P(H|E) = P(H \& E) / P(E)$. If $E$ is known, $P(E) = 1$. Thus $P(H|E) = P(H)$. No confirmation occurs. But historically, old evidence (Mercury's perihelion) confirmed new theories (GR).
      *   *Key Players:* Clark Glymour (originator), Earman, Howson, Urbach, Garber, Jeffrey, van Fraassen.
