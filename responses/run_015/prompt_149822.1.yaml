      *   *Refinement:* Let's call it a **Modal Mismatch**. One side treats probability as subjective degree of belief (temporal), the other treats it as logical entailment (atemporal). The POE explodes when you mix these.
      *   *Better:* It's a confusion between **Dynamic Rationality** (updating) and **Static Support** (confirmation).
      *   *Decision:* I will argue it is a **Category Mistake between Dynamics and Statics**. The "Problem" only exists if you insist Confirmation *must* be a Dynamic process. If Confirmation is a Static relation, Old Evidence is fine. The stalemate is people fighting over which definition is "true" rather than acknowledging they serve different explanatory roles.

