  3. "What they'll hit"
  Darwinians feel helplessness when the shift hits; their "genes" are wrong. They watch points vanish without agency. Skinnerians feel the pain of each wrong guess; learning is expensive behavior. They survive, but their score bleeds. Popperians feel the relief of internalizing the cost; they pause while others flail. Their learning is silent until ready. Gregorians feel trust betrayed; the tool works until it doesn't, and they can't explain why. They argue over the Manual rather than the cards. Baldwinians feel luck; they start closer but still must learn. If the bias matches the new environment, they look geniuses; if not, they are just slow Skinnerians.
  The distinction lands in the *cost of error*: death (Darwin), lost points (Skinner), lost time (Popper), inherited confusion (Gregorian). The Shift exposes who pays. Darwinians pay with extinction (zero score). Skinnerians pay with trials. Popperians pay with cognitive load. Gregorians pay with debugging legacy code. The game makes the locus of selection visible: outside the agent, on the body, in the head, or in the toolkit.

