      *   **Topic:** Dennett's four kinds of minds (Darwinian, Skinnerian, Popperian, Gregorian).
      *   **Context:** Undergrad seminar (CogSci/Philosophy), 18 students, 80 minutes.
      *   **Goal:** Make it experiential ("feel rather than definitions"), no labels until after the experience.
      *   **Mechanism:** A game with 4-5 teams, same task, different learning restrictions.
      *   **Key Feature:** Hidden payoff structure shift mid-game (environmental change).
      *   **Extra Machinery:** A "Baldwinian" team (heritable bias on where to start looking). Need to evaluate if this distinguishes from Darwinian in one session.
      *   **Extra Question:** Where does "being taught" (another agent choosing hypotheses) fit? Gregorian or distinct?
      *   **Desired Outcome:** Students see selection locations (genes, behavior, head, culture) and cost of bad guesses. Gregorian can be right for wrong reasons.
      *   **Structure:** 7 specific sections with word count constraints.
      *   **Tone:** Practical, pedagogical, honest about limitations, philosophically precise.

  2.  **Deconstruct Dennett's Taxonomy:**
      *   *Darwinian:* Hardwired. Trial and error happens in evolution (death of lineage). No individual learning.
      *   *Skinnerian:* Operant conditioning. Trial and error in behavior. You try, you get rewarded/punished. You survive the bad guess, but pay a cost.
      *   *Popperian:* Internal simulation. You let your hypotheses die in your head before acting. Planning.
      *   *Gregorian:* Cultural tools. You use tools/concepts created by others to think better. Offloading cognition.
      *   *Baldwinian:* Evolution selects for *learnability*. The organism isn't hardwired for the solution, but hardwired to find it quickly. (Bias in search space).

  3.  **Design the Game:**
      *   *Task:* Needs to be simple but have a hidden rule. Decoding a pattern? Navigating a maze? Guessing a sequence?
      *   *Idea:* "The Box Code." Teams need to unlock a sequence of 4 symbols/cards to get points.
      *   *Teams:* 4 teams for the 4 minds + 1 team for Baldwinian (5 teams x 4 students = 20 spots, close enough to 18). Let's stick to 4 teams of 4-5, maybe assign Baldwinian as a variant of Darwinian or a 5th team if class size allows. Prompt says "Four or five teams". Let's do 5 teams to accommodate Baldwinian explicitly.
      *   *Restrictions:*
          *   Darwinian: Cannot change strategy mid-game. Pre-written script.
          *   Skinnerian: Can change based on immediate feedback (points).
          *   Popperian: Can "simulate" moves without penalty before committing.
          *   Gregorian: Given a tool (cheat sheet/map) created by a "previous class" (actually made by instructor) that might be outdated or partially wrong.
          *   Baldwinian: Given a "hint" on where to start (bias), but no procedure.
      *   *The Shift:* Midway (minute 40), the rule changes. Old solutions become costly or useless.
      *   *Materials:* Index cards, envelopes, timer, deck of cards (for symbols).

  4.  **Drafting Sections (incorporating word counts):**

