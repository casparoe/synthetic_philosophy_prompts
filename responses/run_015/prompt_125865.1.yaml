      *   **4. Debrief:** Questions mapping to distinctions. Address Baldwinian distinction. Address "being taught".
      *   **5. What will go wrong:** Confusion, cheating, timing issues.
      *   **6. What this can't do:** Phenomenology, deep history, true cultural accumulation.
