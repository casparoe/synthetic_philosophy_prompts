      *   **Topic:** Epiphenomenalism, the Paradox of Phenomenal Judgment (Frank Jackson/David Chalmers territory), causal theories of content, reliability of self-knowledge.

  2.  **Deconstruct the Debate:**
      *   **Background:** Epiphenomenalism (Qualia are caused by physical states but cause nothing). Paradox (I judge "I am in pain" *because* I feel pain. If pain causes nothing, why did I judge that?).
      *   **M (Neuroscience Student):**
          *   Move 1: Paradox is live. If pain doesn't cause judgment, what does? If neural firing does, qualia are useless byproducts, severing the link to evidence.
          *   Move 2 (Reliability): Why do judgments track qualia so well? Without causal involvement, it's a coincidence.
      *   **D (Philosophy Student):**
