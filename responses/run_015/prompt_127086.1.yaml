prompt: |-
  I teach a postgrad seminar in political philosophy — about 14 people, one 90-minuite session. I want an acivity that gets them to feel Machiavelli's idea that virtù isn't just personal boldness but a kind of institutional elasticity: the capacity to rewrite the rules of the game you're trapped in while fortuna is still rolling. Design a classroom simulation with clear roles, rounds, and a token/payoff scheme (no real money needed). They should hit moments where pure luck wipes them out unless they've already altered the setup, moments where altering it saves them, and at least one round where the alteration backfires because fortuna shifts in a direction they didn't anticipate. Arrange the rules so all this happens before anyone explains it — no lecture up front. Include a debrief that maps specific rounds onto Machiavelli's argument (paraphrase only, no quotations), and be frank about which part of the view — likely the gendered metaphor of fortuna as a woman to be beaten or tamed — the acivity can't reproduce and you'll have to supply in discussion yourself. Also tell me what will predicatbly go wrong the first time you run it, and how to handle it on the fly.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Context:** Postgrad seminar in political philosophy (14 students), 90-minute session.
      *   **Topic:** Machiavelli's *virtù* (not just boldness, but institutional elasticity/rewriting rules) vs. *fortuna*.
      *   **Task:** Design a classroom simulation (roles, rounds, token/payoff scheme).
      *   **Key Mechanics:**
          *   Luck must wipe players out *unless* they altered the setup.
          *   Altering the setup must save them sometimes.
          *   Altering the setup must backfire sometimes (unanticipated *fortuna*).
          *   No lecture up front (learn by doing).
      *   **Debrief:** Map rounds to Machiavelli's argument (paraphrased), acknowledge limitations (specifically the gendered metaphor of *fortuna*), and predict failure points + mitigation strategies.

  2.  **Deconstruct Machiavelli's *Virtù* & *Fortuna*:**
      *   *Fortuna:* Uncontrollable external circumstances, luck, chance, timing. Often depicted as a river flooding or a woman.
      *   *Virtù:* Not moral virtue. Skill, prowess, adaptability, prudence. Crucially, the ability to build dykes/channels (institutions) to direct the flood, or to act decisively when the opportunity arises.
      *   *The Twist:* The prompt emphasizes *institutional elasticity*. It's not just "be bold," it's "change the rules of the game you are playing."
      *   *The Trap:* If you play by the initial rules, *fortuna* will eventually crush you. You must change the rules to survive, but changing rules carries risk.

  3.  **Drafting the Simulation Concept:**
      *   *Name:* "The Prince's Dilemma" or "The Flooding River." Let's go with "The Citadel & The Flood." It fits the metaphor.
      *   *Players:* 14 students.
      *   *Roles:* Need differentiation. Maybe "Rulers" vs. "Subjects"? Or just competing "States"? Competing States works better for a seminar where everyone needs to engage. Let's make them all "Princes" of small city-states.
      *   *Resources:* Tokens (let's call them "Stability Points" or SP).
      *   *Goal:* Survive with the most SP after X rounds.
      *   *Mechanic:* Dice rolls represent *Fortuna*.
      *   *The "Virtù" Mechanic:* Players need a way to change the dice mechanics or the cost structure mid-game.

      *Refining the Mechanic:*
      If everyone plays the same game, it's boring. The prompt asks for *institutional elasticity*.
      Let's create a "Constitution" for the room.
      *   *Round 1-2:* Standard rules. Roll dice, gain/lose tokens.
      *   *Intervention:* Players can propose "Edicts" (rule changes).
      *   *Cost:* Changing rules costs tokens.
      *   *Risk:* Some Edicts work only under specific *Fortuna* conditions.

      *Wait, 14 students is a lot for individual competition.* It might drag. Let's group them. 3 Groups of 4, plus 2 observers/judges? Or 2 Groups of 7?
      Actually, for a philosophy seminar, individual agency is important. But 14 individual turns in 90 mins is tight.
      *Idea:* 3 "Factions" (approx 4-5 students each). Each Faction is a State. They make collective decisions. This mimics the *institutional* aspect (deciding as a body).
      *Actually, better:* 14 individual "Princes." But to save time, resolution happens simultaneously.
      *Let's try:* 14 Individuals. They hold "Power Tokens."
      *The Twist:* The "Rules of the Game" are written on the board. They are bad rules.
      *The Activity:* Students realize the rules are rigged against them by the dice. They must use tokens to *amend the rules on the board*.

      *Revised Concept: "The Constitutional Gamble"*
      *   **Setup:** A set of baseline rules projected/written.
      *   **Currency:** "Influence" (chips/paper).
      *   **Fortuna:** A deck of cards or dice roll determined by the instructor.
      *   **Virtù:** The ability to spend Influence to rewrite a line of the rules *before* the Fortuna draw.

      *Specific Mechanics needed for the prompt's requirements:*
      1.  *Luck wipes out:* A "Catastrophe Card" that kills anyone following Rule #1.
      2.  *Alteration saves:* If Rule #1 was changed to Rule #1b, the Catastrophe is mitigated.
      3.  *Alteration backfires:* A "Shift Card" where the new rule makes things worse (e.g., you invested in defense, but the attack was diplomatic).

  4.  **Developing the Rounds:**
      *   *Round 1 (The Trap):* Simple dice roll. High variance. Some lose heavily.
      *   *Round 2 (The Opportunity):* Players can buy "Amendments." (e.g., "Reroll once," "Halve losses").
      *   *Round 3 (The Flood):* A specific "Fortuna Event" occurs. If you didn't amend, you're out. If you did, you survive.
      *   *Round 4 (The Backfire):* A "Fortuna Shift." The Amendment you bought last round now has a penalty (e.g., "Reroll" becomes "Must Reroll even if good").

  5.  **Refining for Time & Complexity:**
      *   90 minutes total.
      *   15 min Intro/Setup.
      *   45 min Game (4 rounds x 10 mins + transition).
      *   30 min Debrief.
      *   *Constraint:* No lecture up front. Just hand out instructions.

      *Let's simplify the "Rule Rewriting".*
      Writing new rules takes too long.
      *Solution:* Pre-written "Policy Cards" that *replace* existing rules.
      *The Board:* Has 3 Active Laws.
      *The Shop:* Has 5 Policy Cards (Virtù moves).
      *The Deck:* Fortuna Cards.

      *Wait, the prompt wants them to feel "institutional elasticity."*
      If they just buy cards, it's a board game.
      *Better:* They have to *vote* or *spend collective capital* to change the room's rules.
      *Best for 14 people:* 3 States (4-5 people each). 2 "Mercenaries" (wild cards).
      No, let's keep it individual but simultaneous.
      *Actually, the most Machiavellian move is unilateral rule-breaking.*
      Let's allow them to *propose* a rule change to the Instructor (The "People" or "The State"). The Instructor accepts/rejects based on hidden criteria (Fortuna).
      *Too complex.*

      *Let's go with the "Constitutional Convention" model.*
      All 14 are legislators.
      There is a "Crisis" every round.
      They start with a weak Constitution.
      They can spend "Political Capital" to amend it.
      But the Crisis type changes.

      *Okay, final design choice:* **"The Dyke and The River."**
      *   **Roles:** 14 "Princes."
      *   **Resource:** 10 "Stability Tokens" each.
      *   **The Board:** 3 Standing Orders (Rules).
      *   **The Mechanism:** Each round, a "Fortuna Die" is rolled (d20).
      *   **The Catch:** The Standing Orders determine how the Die affects you.
      *   **The Virtù:** Between rounds, players can spend Tokens to *scratch out and rewrite* one Standing Order for the next round.
      *   **The Risk:** Rewriting costs tokens. If you rewrite poorly, the Die hurts you more.

      *Wait, 14 people rewriting the same 3 rules?* Chaos.
      *Modification:* 3 Factions (4-5 students). Each Faction controls one "District."
      They share a central "River" (The Fortuna Deck).
      They can build "Dykes" (Rule modifications) that protect *their* district but might divert water to *another*.
      This creates the Machiavellian conflict.

      *Let's settle on:* **3 City-States (4-5 students each).**
      *   **Goal:** Survive 4 Rounds with >0 Resources.
      *   **Resources:** "Grain" (Tokens). Start with 20 per State.
      *   **Fortuna:** Instructor draws a Card (Flood, Drought, Invasion, Plague).
      *   **Institutions:** Each State has a "Charter" (3 basic rules on how they lose grain).
      *   **Virtù Action:** Before the Card is drawn, States can spend Grain to *Amend their Charter*.
      *   **The Twist:** Some Fortuna Cards punish specific Charter types. Some Amendments work only against specific threats.
      *   **The Backfire:** One Amendment looks good but has a hidden clause triggered by a specific Card.

  6.  **Fleshing out the Details:**
      *   *Round 1:* Baseline. Everyone loses grain based on a die roll.
      *   *Round 2:* Opportunity to Amend. (e.g., "Build Walls" - reduces Invasion loss, increases Drought loss).
      *   *Round 3:* The Big Flood. If you didn't Amend to "Divert River," you lose half.
      *   *Round 4:* The Shift. The "Divert River" amendment now causes a dispute with neighbors (costs grain).

      *Wait, I need to ensure the "Institutional Elasticity" is clear.*
      The rules they are changing should be the *game rules*, not just +1/-1 stats.
      *Example:* Rule: "Roll a d6. On 1-3 lose 5 grain."
      *Amendment:* "Roll a d6. On 1-2 lose 5 grain. On 3, gain 2."
      This is too fiddly for 90 mins.

      *Simpler Approach:* **The Rulebook is the Enemy.**
      Give them a printed Rule Sheet. It says "In Round 3, all players must pay 10 tokens."
      Tell them: "You can negotiate with the Bank (Instructor) to change this rule, but it costs tokens now."
      *Better:* **The "Constitution" is on the Whiteboard.**
      3 Clauses.
      Clause A: "Fortuna Roll < 10: Lose 5 Tokens."
      Clause B: "Fortuna Roll > 10: Gain 5 Tokens."
      Clause C: "Players cannot hold more than 20 Tokens."
      *Action:* Players can propose to erase and rewrite a Clause. Cost: 5 Tokens.
      *Fortuna:* Instructor rolls.
      *The Trap:* Clause A is deadly in Round 3. If you didn't change it, you die.
      *The Backfire:* In Round 4, the Dice bias changes. The rule you wrote to save you in Round 3 kills you in Round 4.

      *Let's go with this Whiteboard Model.* It's visual and fits "rewriting the rules."
      *Groups:* 3 Groups of 4. 2 "Observers" (rotate them in).
      *Actually, 14 people.* 3 Groups of 4 = 12. 2 Left over. Make them "Mercenaries" who can sell their vote to a group for a round.
      *No, keep it simple.* 3 Groups of 4-5. (5, 5, 4).
      *Tokens:* "Legitimacy."
      *Goal:* Most Legitimacy at the end.

  7.  **Addressing the Prompt's Specific Constraints:**
      *   *Luck wipes out:* Round 3 Event.
      *   *Alteration saves:* If Rule changed in Round 2.
      *   *Alteration backfires:* Round 4 Event punishes the Round 2 change.
      *   *No Lecture:* Handout only.
      *   *Debrief:* Map to *virtù/fortuna*.
      *   *Gendered Metaphor:* Acknowledge the "woman/river" imagery is missing from the abstract game.
      *   *Predictable Failure:* Students won't read the handout / will try to optimize mathematically rather than politically / will refuse to break rules.

  8.  **Drafting the Plan:**
      *   **Title:** "The Floodplain Protocol."
      *   **Materials:** Whiteboard, Tokens (poker chips/paper), Deck of Cards (Fortuna), Handout.
      *   **Structure:**
          *   0-10: Setup & Handout (No talk).
          *   10-50: 4 Rounds of Play.
          *   50-90: Debrief.
      *   **The Rules (The Trap):**
          *   Initial Rule: "All States must contribute 5 tokens to the Central Pot each round."
          *   Fortuna: Card draw. Red = Tax Rebate (Gain), Black = Tax Audit (Loss).
          *   *Wait, need the "Rewrite" mechanic to be the core.*
          *   *Core Mechanic:* The "Law of the Land" is written on the board. It is disadvantageous.
          *   *Virtù:* Spend tokens to erase a word/phrase and write a new one.
          *   *Fortuna:* The Instructor holds a deck. Some cards say "The Law is Enforced Strictly." Some say "The Law is Suspended."
          *   *The Catch:* If you changed the Law, and the Card says "Enforced," your new Law applies. If the Card says "Suspended," the Old Law applies (or chaos ensues).
          *   *Refinement:* Let's make it simpler.
          *   **Round 1:** Roll d20. Result = Token Loss. (Pure Fortuna).
          *   **Round 2:** Players can spend 5 tokens to "Institutionalize." (e.g., "Cap loss at 5").
          *   **Round 3:** "The Flood." d20 rolled. If >15, Loss is doubled. *Unless* you Institutionalized.
          *   **Round 4:** "The Shift." The "Cap loss at 5" rule now prevents you from gaining bonuses.

      *Okay, I need to make sure the "Institutional Elasticity" is the main takeaway.*
      The activity must show that *sticking to the initial rules is suicide*.
      Let's create a "Bureaucracy" rule.
      **Rule 1:** "At the start of Round 3, all players with >10 tokens lose half." (The Populist Purge).
      **Rule 2:** "At the start of Round 4, all players with <5 tokens are eliminated." (The Insolvency Clause).
      **Virtù:** Between rounds, players can propose an "Amendment." It costs tokens. It needs a majority vote? No, too slow. It costs tokens and is automatic (Prince's will).
      **The Backfire:** An Amendment that saves you in Round 3 (e.g., "Hide Tokens") makes you look insolvent in Round 4.

      *Okay, finalizing the simulation design:*
      **Name:** "The Prince's Ledger."
      **Groups:** 3 City-States (4-5 students each).
      **Currency:** "Crowns." Start with 30.
      **The Board:** 3 Immutable Laws (initially).
      **The Action:** "Edict." Spend 10 Crowns to cross out one Law and write a new one.
      **The Fortuna:** Deck of 10 Cards.
      *   5 Cards: "Stability" (Laws work as written).
      *   3 Cards: "Turmoil" (Laws are inverted).
      *   2 Cards: "Catastrophe" (Specific Law triggers death).
      **The Trap:** Law #3 is "Catastrophe Trigger: If you hold >20 Crowns, lose 15."
      **The Save:** Change Law #3 to "If you hold >20 Crowns, gain 5."
      **The Backfire:** A "Turmoil" card inverts laws. Now "Gain 5" becomes "Lose 5."

      *Wait, 90 minutes is tight for 3 groups negotiating.*
      Let's make it individual. 14 Princes.
      Simultaneous action.
      Handout explains the Laws.
      Instructor manages the Board.
      Students submit "Edict Slips" privately.

      *Predictable Problems:*
      1.  Students treat it as a math puzzle, not political philosophy.
      2.  Students refuse to break/change the "Laws" because they view them as fixed constraints (ironic, given the lesson).
      3.  Timekeeping.

      *Debrief:*
      1.  Map Round 1 (Passive) to naive reliance on luck.
      2.  Map Round 2/3 (Edicts) to *virtù* as institution-building.
      3.  Map Round 4 (Backfire) to the limits of prudence/*fortuna*'s unpredictability.
      4.  Address the Gendered/Violent metaphor (Fortuna as woman/river) which the abstract game sanitizes.

  9.  **Writing the Response:**
      *   Structure: Overview, Materials, Setup (Silent), The Rounds (Detailed), The Debrief (Scripted), Limitations, Troubleshooting.
      *   Tone: Professional, academic, ready-to-use.
      *   Check constraints: 14 people, 90 mins, postgrad level, no lecture up front, specific Machiavellian points.

      *(Self-Correction during drafting)*: Make sure the "Institutional Elasticity" is highlighted. It's not just "buy a power-up." It's literally crossing out the rules on the board. I need to emphasize the physical act of changing the rules.
      Also, ensure the "Backfire" is clear. The rule they wrote to save them becomes the weapon *fortuna* uses against them.

      *Refining the Backfire:*
      Rule: "Losses are capped at 5."
      Fortuna Shift: "All Caps are removed." -> You bleed out.
      Or: "All Caps are inverted to Minimums." -> You *must* lose 5.
      Let's go with: "The Context Shifts."
      Rule written for War (Defense). Fortuna brings Peace (Defense is costly).
      This captures the "times change" aspect of Machiavelli.

      *Final Plan:*
      **Activity:** "The Dyke."
      **Metaphor:** Holding back the flood.
      **Mechanic:** Whiteboard Rules + Token Economy + Card Deck.
      **Rounds:** 4.
      **Debrief:** 30 mins.
      **Warnings:** Math-hacking, Rule-fetishism.

      *Let's write it.*
answer: |-
  # Seminar Activity: "The Dyke"
  **Topic:** Machiavelli on *Virtù*, *Fortuna*, and Institutional Elasticity
  **Time:** 90 Minutes
  **Participants:** 14 Postgraduates
  **Materials:** Whiteboard + Markers, 140 Poker Chips (or paper tokens), 1 Deck of Cards (remove Jokers), Printed "State Ledgers" (half-sheet handouts).

  ## Part 1: Setup (0:00 – 0:15)
  **Do not lecture.** Do not explain Machiavelli yet. Hand out the Ledgers and place the chips in the center.

  **The Handout (Text only):**
  > **THE PRINCIPALITY**
  > 1.  **Goal:** Survive 4 Rounds with the most **Crowns** (chips). If you hit 0, you are exiled (out of the game).
  > 2.  **Start:** You receive 20 Crowns.
  > 3.  **The Law:** The rules on the Whiteboard govern how you lose or gain Crowns each round.
  > 4.  **Fortuna:** At the end of each round, the Instructor draws a Card. Red = Prosperity. Black = Crisis.
  > 5.  **Virtù:** Between Rounds 1-2 and 2-3, you may submit an **Edict**.
  >     *   **Cost:** 5 Crowns.
  >     *   **Effect:** You may erase *one word* on the Whiteboard and replace it.
  >     *   **Limit:** You cannot erase "Instructor," "Crowns," or "Round."
  > 6.  **Secrecy:** Edicts are submitted privately. You do not know what others are changing until the reveal.

  **The Whiteboard (The Trap):**
  Write this clearly in the center:
  > **STANDING ORDERS**
  > 1.  On **Red**: Gain 5 Crowns.
  > 2.  On **Black**: Lose 5 Crowns.
  > 3.  On **Face Card**: Lose **HALF** your total Crowns.

  **Instructor Note:** The game is rigged. If they play by these rules, the probability of hitting a Face Card (12/52) over 4 rounds means statistically, most will be wiped out in Round 3 or 4. *Virtù* requires them to realize they must change Rule #3 immediately.

  ## Part 2: The Simulation (0:15 – 0:55)

  **Round 1: The Baseline (10 mins)**
  *   Distribute 20 Crowns to each student.
  *   Draw a Card. (Let's say, Red 7). Everyone gains 5.
  *   **State of Play:** Most have 25 Crowns. They feel safe.
  *   **Action:** Announce: "You may now submit Edicts. Cost: 5 Crowns. Write the change on a slip of paper."
  *   *Observation:* Watch who hesitates. Many will hoard tokens rather than spend them to change the rules. This is the failure of *virtù*.

  **Round 2: The Investment (10 mins)**
  *   Collect Edicts.
  *   **The Twist:** Process the Edicts publicly. If two students try to change the same word, the one with more Crowns wins (power dictates law). If they change different words, both apply.
  *   *Likely Outcome:* Smart students will change Rule #3. E.g., Change "HALF" to "TWO." Or Change "Lose" to "Gain."
  *   Draw a Card. (Let's say, Black 9). Everyone loses 5.
  *   **State of Play:** Those who bought Edicts have ~15-20 Crowns. Those who didn't have ~20. The spenders look weaker *temporarily*. This mimics the short-term cost of institution-building.

  **Round 3: The Flood (15 mins)**
  *   **No Edicts allowed.**
  *   **The Event:** Draw a **Face Card** (Jack, Queen, King).
  *   **The Mechanic:** Apply the Whiteboard Rules *as currently written*.
  *   **Outcome:**
      *   Students who did *not* change Rule #3 lose half their stack (e.g., 20 → 10). They are now vulnerable.
      *   Students who changed "HALF" to "TWO" lose only 2 Crowns. They are safe.
      *   Students who changed "Lose" to "Gain" suddenly gain Crowns while others bleed.
  *   **Lesson:** *Fortuna* (the Face Card) was inevitable. Only those who altered the institutional structure (*virtù*) survived intact.

  **Round 4: The Shift (15 mins)**
  *   **The Backfire:** Announce: "The Context Has Shifted. The River has changed course."
  *   **New Constraint:** "For this round only, **Face Cards are treated as Black Cards**, but the text of Rule #3 is **Inverted**."
  *   **The Trap:** If a student changed Rule #3 to "Gain TWO," the Inversion makes it "Lose TWO." If they changed it to "Lose TWO," the Inversion makes it "Gain TWO."
  *   **The Cruelty:** If a student changed Rule #3 to "Gain HALF" (greed), the Inversion makes it "Lose HALF."
  *   **Draw Card:** Draw a **Face Card**.
  *   **Outcome:** The specific rule change that saved them in Round 3 might kill them in Round 4, depending on exactly how they phrased the elasticity.
  *   **End Game:** Count Crowns. Exile anyone at 0.

  ## Part 3: The Debrief (0:55 – 1:30)

  **1. Mapping the Mechanics to the Text (15 mins)**
  *   **The Whiteboard as Institutions:** Ask: "Why did Rule #3 feel immutable until it wasn't?"
      *   *Machiavellian Point:* Laws and customs are not divine; they are dykes built by men. They hold back the flood only as long as they are maintained.
  *   **Round 3 as *Fortuna*:** "The Face Card was random. Did anyone predict it?" (No).
      *   *Machiavellian Point:* You cannot control luck. You can only prepare the channels so that when the flood comes, it doesn't drown you. *Virtù* is preparation, not prophecy.
  *   **Round 4 as the Limit of Prudence:** "Who got hurt by their own rule change?"
      *   *Machiavellian Point:* You cannot build a dyke for every possible flood. Times change (*i tempi*). A constitution built for war may starve you in peace. *Virtù* requires adapting to the *quality of the times*, which is the hardest thing to do.

  **2. The Missing Metaphor (10 mins)**
  *   **Instructor Monologue:** "This simulation was sterile. It was math and tokens. Machiavelli's text is visceral. He describes *Fortuna* as a woman who is 'a friend to the young' because they are more impetuous, and he famously says she must be 'beaten and coerced.' He also compares her to a raging river."
  *   **Discussion Question:** "How does removing the gendered/violent metaphor change the political theory? Does sanitizing *Fortuna* make *Virtù* seem too rational? Machiavelli implies a struggle of domination, not just engineering. Did you feel like you were 'dominating' the rules, or just optimizing them?"
  *   **Key Takeaway:** The simulation captures the *structural* argument (institutions buffer luck) but misses the *agonistic* argument (politics is a struggle of wills against a hostile nature).

  **3. Synthesis (5 mins)**
  *   Conclude by linking back to the seminar's broader theme: Is the goal of politics to be morally good, or to endure? The students who hoarded tokens (moral hoarding/safety) died. The students who spent tokens to rewrite reality (ruthless pragmatism) survived, but lived in fear of Round 4.

  ## Predictable Failure Points & Mitigation

  **1. The "Math-Hacking" Problem**
  *   **Risk:** Students treat this as a probability puzzle. They will calculate the odds of Face Cards and optimize token expenditure purely numerically, missing the political metaphor of "rewriting rules."
  *   **Fix:** During the Edict phase, verbally frame it politically. "You are not buying a power-up. You are legislating. Who has the authority to cross out that word?" If they get too bogged down in math, interrupt Round 3 to emphasize: "The Card didn't change. Your *world* changed."

  **2. The "Rule Fetishism" Problem**
  *   **Risk:** Postgrads often respect the "game rules" as sacred. They may refuse to submit Edicts because "that's not how the game is played." This is the exact failure of *virtù* you want to expose, but if *everyone* does it, the game ends in mass exile and feels pointless.
  *   **Fix:** Seed the room. Before class, tell 2-3 students: "If you get a chance to change a rule, do it aggressively." Their early adoption will signal to the others that rule-breaking is the mechanic, not a bug.

  **3. Time Creep**
  *   **Risk:** Negotiating Edicts takes too long. 14 people submitting slips and resolving conflicts can eat 20 minutes.
  *   **Fix:** Impose a hard 3-minute timer on the Edict Phase. "You have 180 seconds to alter the Constitution. Go." The pressure mimics the urgency of crisis.

  **4. The Backfire Confusion**
  *   **Risk:** Round 4's "Inversion" rule might be confusingly explained, leading to arguments about token counts rather than philosophical reflection.
  *   **Fix:** Write the Round 4 modification on the board *before* drawing the card. "ROUND 4 MODIFIER: All Rule Text is Inverted (Gain=Lose, Lose=Gain)." Keep it visual.

  ## Instructor Cheat Sheet (Machiavelli Paraphrases)
  *   *On Institutions:* "Men build dykes when the weather is fair so that when the rains come, the water has a channel and does not flood uncontrollably."
  *   *On Adaptation:* "The man who sticks to one method will succeed while the times match his method, but he will fail the moment the times shift."
  *   *On Fate:* "Luck determines half our actions, but she leaves the other half to us to govern."
  *   *On Gender/Violence (For Debrief):* "Fortuna is a woman, and if you wish to master her, you must strike her and force her. She favors the bold youth over the cautious elder." (Note: Explicitly flag this as the element the simulation *cannot* reproduce without roleplay that might be inappropriate/uncomfortable).
