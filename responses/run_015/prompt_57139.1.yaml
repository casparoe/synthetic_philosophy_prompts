  *Rule: "It's a real dilemma only if you couldn't afterwards say to the character 'you did the right thing' and mean it."*

  *   **Case 1 (Mother/Burning):** **Pass.** You cannot say "you did the right thing." (Saving one child doesn't cancel the death of the other).
  *   **Case 2 (Surgeon):** **Pass.** You *can* say "you did the right thing." (7 > 3). It is arithmetic, not tragedy.
  *   **Case 3 (Lunch/Mugging):** **Pass (Technically).** You *can* say "you did the right thing." Stopping violence trumps lunch.
  *   **Case 4 (Strangers/Drowning):** **Fail.** Logically, you *can* say "you did the right thing" (1 saved > 0 saved). But your gut insists it *should* feel like Case 1 (where you can't say it). The rule cannot explain why you want tragedy here.
  *   **Case 5 (Mother/Choice):** **Pass.** You cannot say "you did the right thing." (No optimal outcome exists).
  *   **Case 6 (Job/Promise):** **Pass.** You cannot say "you did the right thing" without qualification. (The choice was necessitated by prior error).

  **The Verdicts the Rule Can't Deliver:**
  The rule fails to explain the **emotional residue** in Case 3 (the urge to apologize) and Case 4 (the urge for tragedy). It treats "Right Thing" as a cleaning agent that wipes the slate clean. Your drafts prove the slate is never clean.

  ### 2. The Verdict to Give Up
  You should give up the verdict on **Case 3 ("Nothing outstanding")**.

  You wrote: *"Obviously correct, nothing outstanding — except I keep wanting him to apologise."*
  That "except" is your writer's instinct overruling your logician's brain. A promise is a specific debt. Breaking it creates a **moral remainder**, even if breaking it was necessary. The apology isn't for making the *wrong* choice; it's for the *cost* of the right one. If you write the scene believing "nothing was violated," the character will feel hollow. If you write it acknowledging the debt, the apology lands.

  *(Note on Case 4: You don't have to give up the desire for tragedy, but you must recognize it isn't automatic. To make Case 4 feel like Case 1, you must narrative-ize the strangers so they become non-fungible specific duties, not arithmetic units.)*

  ### 3. The Surviving Principle
  The principle underneath your gut is **The Principle of Moral Remainder.**

  > **A choice feels like a "real dilemma" not when there is no right answer, but when the right answer requires violating a specific, non-fungible obligation, leaving a debt that the goodness of the outcome cannot cancel.**

  *   **Arithmetic Choices (Surgeon):** Obligations are fungible (units of life). The outcome cancels the debt. No remainder.
  *   **Tragic Choices (Mother):** Obligations are non-fungible (specific children). The outcome cannot cancel the debt to the one lost. Remainder exists.
  *   **The "Cheat" Feeling:** You feel a scene is a "cheat" when you demand the reader feel a **Moral Remainder** for an **Arithmetic Choice** without earning the specificity. (e.g., If the surgeon cries for weeks over the 3, it feels melodramatic unless those 3 were specific to him).

  ### 4. Prediction: Case 7
  *Case: Keep promise to dead friend OR stop stranger from being badly hurt (equal badness).*

  **Verdict:** This is a **Real Dilemma** (like the Burning House, not the Surgeon).

  **Why:** You are weighing a **Specific Duty** (the dead friend, a singular relationship) against a **General Duty** (preventing harm to a stranger). These are incommensurable values.
  *   If he keeps the promise: He did the "loyal" thing, but he owes a debt to the stranger's suffering.
  *   If he helps the stranger: He did the "moral" thing, but he owes a debt to the friend's memory.

  **Prediction:** Whichever he chooses, saying "You did the right thing" will feel like an insult. There will be **Moral Remainder**. He will need to grieve the obligation he violated, regardless of the nobility of the one he fulfilled. To make it land, do not focus on the *outcome* (hurt vs. promise), focus on the *debt* (who he now owes an apology to).
