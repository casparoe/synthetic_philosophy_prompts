      *   **Address Modal Realism:** Modal realism is about *possibility*, not *actual justice*. Justice is a relation within a world (mostly). When we punish, we are operating within the actual world's causal network.
      *   **Address Counterpart Theory:** Counterparts are *not* identical. I am not my counterpart. If my counterpart gets the chair in world W2, *I* (in @) do not suffer. Therefore, justice is not served *for me* in @. The punishment must be borne by the offender *here*.
      *   **Why Fines are Different:** Money is fungible. It doesn't matter *which* physical dollars pay the debt, only that the debt is cleared. The loss is economic, not existential.
      *   **Why Prison/Death is Different:** These involve bodily integrity and conscious experience. You cannot transfer consciousness. My counterpart's pain is not my pain.
      *   **The "Someone Else" Problem:** Counterpart theory actually *supports* the view that someone else cannot take my punishment. Since identity is strict, no one else is me. Counterparts are distinct existents. So, vicarious punishment fails metaphysically for personal suffering.
      *   **Don't Concede:** Hold firm that the fine/prison distinction stands despite modal realism.

