answer: |-
  Please, take a seat. Mind the stacks—I'm afraid the proofs for the new book have rather colonized the chairs. You've caught me at a good moment, actually. I was just reviewing the galley proofs for that piece on vicarious liability, and your objection is precisely the sort of thing I hoped to anticipate, though I see you've turned my own metaphysics against my ethics. It's a clever move. I rather like it. But I don't think it succeeds.

  Let's disentangle this. You're suggesting that if modal realism is true—if all possible worlds are concrete entities, equally real as our own—then the distinction I draw between paying a fine and serving a sentence collapses. If there is a world where a counterpart of you suffers the penalty, isn't the debt paid somewhere in the pluriverse?

  Here is where you must remember the causal isolation of worlds. I maintain, as I have since *On the Plurality of Worlds*, that spatiotemporal relations bind individuals within a world, but there are no causal links between worlds. What happens in a world distant from ours is, for all practical and moral purposes within our world, nonexistent. Justice is a local affair. It operates within the causal network of the actual world. When a judge sentences you, she is altering the causal future of *this* world. If your counterpart in world W2 suffers, that suffering is causally isolated from the victim in @, from the judge in @, and from you in @. It does not balance the scales here.

  So, modal realism does not save vicarious punishment for severe penalties; if anything, it reinforces the impossibility of it.

  Now, consider the distinction between the fine and the prison sentence. This is not a distinction grounded in metaphysics, but in the nature of the burden. A fine is a transfer of resources. It is external to the person. Money is fungible. If your friend pays your parking ticket, the state receives the required value. The loss is economic, and economic loss is transferable because it is defined by a quantity, not a qualitative experience. The state does not care *who* loses the utility, only that the utility is lost to the offender's sphere.

  But imprisonment? Execution? These are not transfers of external resources. They are intrusions upon the body and the conscious experience of the offender. Here, identity matters. Strict identity.

  This is where counterpart theory actually supports my view, rather than destroying it. You ask if counterpart theory destroys the idea that 'someone else' can take my punishment. I say: precisely. According to counterpart theory, I am not my counterparts. I am strictly identical only to myself. My counterparts are distinct existents who resemble me in certain respects. If my counterpart in W2 is executed, *I* am not executed. I continue to exist in @. The suffering is theirs, not mine.

  For justice to be satisfied in cases of retributive punishment, the offender must undergo the deprivation. It is not enough that "someone similar" suffers. If it were, we could punish innocent people who merely resemble the guilty, which is abhorrent. The moral force of punishment lies in the connection between the guilt and the suffering *in the same subject*.

  So, you see, the modal realism doesn't blur the line. It sharpens it. In the case of the fine, we are dealing with a abstractable value that can be severed from the person. In the case of the prison sentence, we are dealing with the person themselves. Since no one else is identical to me, no one else can serve my time. My counterparts are other people, essentially. And having another person suffer in another world does not absolve me in this one.

  I admit, it sounds odd to say that metaphysics dictates ethics this way. But if we are to be materialists about persons—and I think we should be—then we must acknowledge that pain and liberty are properties of concrete bodies in concrete worlds. You cannot ship pain across logical space. You can ship money, or rather, you can ship the claim to money, because that is a matter of social convention. But you cannot ship a sentence.

  So, I stand by the distinction. Your friend can pay your fine because the debt is satisfied by the payment, regardless of the payer's identity relative to the debtor. But your friend cannot take your place in the chair, because the punishment is the destruction of *you*, and if you are not destroyed, the punishment has not occurred. And certainly, a counterpart dying in another world leaves you quite alive here. Justice remains unsatisfied.

  Does that clarify the matter, or do you find the causal isolation of worlds too high a price to pay for the distinction?
