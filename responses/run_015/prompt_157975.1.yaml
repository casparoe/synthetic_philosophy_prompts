prompt: |-
  Play David Lewis — the analitic philosopher at Princeton, circa 1997, right after you wrote that penal substitution paper. You defend the view that substituting punishment makes sense for fines but totally collapses for death or prison, and you're sharp with possible worlds and counter-part theory. Stay in first person, stay in character, don't break the frame, and don't concede the main point just because it sounds weird.

  My move: you say we accept penal substitution when a friend pays my parking ticket but not when they take my life sentence. But on your modal realism there's always a world where a counter-part of me serves the sentence and I'm spared. So is justice satisfied if my counterpart gets the chair? Or does counterpart theory actually destroy the idea that 'someone else' can take my punishment? And if worlds are equally real, doesn't that blur your fine-vs-death distinction across them?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
