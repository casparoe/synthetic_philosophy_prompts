answer: |-
  **Joint Statement on Phenomenal Judgment Mechanisms**
  **Parties:** The Epiphenomenal Working Group (EWG) & The Interactionist Dynamics Team (IDT)
  **Date:** Oct 14
  **Status:** Draft v.3 (still arguing over paragraph 4)

  Look, we've spent the last six months locked in a room trying to figure out why we say we see red when we see red. We aren't going to solve the hard problem here, but we agreed to map out exactly where the machinery breaks down. Below is what we actually agree on, followed by where we start throwing chairs, and the specific experiments that might settle it.

  ### I. Common Ground (Claims Both Camps Sign)

  1.  **Realism about Qualia:** Phenomenal experience (what it's like) is real and not eliminable. We aren't illusionists.
  2.  **Reports are Physical:** Verbal reports about experience ("I see red") are physical events involving vocal cords, air pressure, and neural firing.
  3.  **Correlation:** There is a stable, high-fidelity correlation between specific neural states (NCCs) and first-person reports about those states.
  4.  **The Accuracy Problem:** The central puzzle is explaining *why* the physical report matches the phenomenal experience so perfectly. If the experience doesn't cause the report, the match looks like a miracle.
  5.  **No Magic:** We agree that conservation of energy holds in the closed physical system of the brain, unless proven otherwise.
  6.  **Shadow Mechanism Viability:** Both sides acknowledge the logical possibility of a "common cause" structure where a neural state spawns both the experience and a separate tracking signal (the 'shadow-qualia' signal) that drives speech, even if the experience itself does nothing.

  ### II. Disagreements Table

  | Issue | Epiphenomenalist Wording (EWG) | Interactionist Wording (IDT) |
  | :--- | :--- | :--- |
  | **Causal Role of Qualia** | Qualia are causally inert byproducts; the **shadow-qualia signal** carries the informational load to the speech centers without needing feedback from the experience itself. | Qualia are causally potent states; the feeling of redness *pushes* the neural state toward the report, ensuring accuracy through direct influence. |
  | **The "Match" Explanation** | The match is explained by a **forked causal chain**: Neural State → (A) Qualia & (B) Shadow Signal → Report. A and B never touch. | The match is explained by **linear causation**: Neural State → Qualia → Physical Modification → Report. |
  | **Evolutionary Pressure** | Evolution selected for the **shadow-tracking system** because it aids survival; the qualia side-effect was free and functionally useless. | Evolution selected for qualia **because** they provide unique causal leverage for complex decision making and reporting. |
  | **Paradox Status** | The paradox of knowledge is a **self-modeling artifact**; the brain models itself as having access it doesn't physically need. | The paradox is a **refutation of inertness**; you cannot know what you cannot touch, so qualia must be touchable. |

  ### III. The Cruxes & Hypothetical Cases

  We identified two main bottlenecks. Here is how we plan to test them, using the shadow-qualia framework.

  #### Crux 1: Can a physically closed brain generate accurate first-person phenomenal reports without causal access to the qualia?

  *   **The Setup:** This is the core mechanic of the shadow-qualia idea. The EWG says yes, via the common cause fork. The IDT says no, because information about the *quality* of the experience can't be encoded in the shadow signal without the experience itself shaping it.
  *   **Concrete Hypothetical (Case 88-B):** A split-brain patient where the corpus callosum is severed, but we induce a specific NCC pattern bilaterally (via synchronized stimulation). However, we lesion the pathway between the NCC and the left-hemisphere speech center *only* for the shadow-signal channel, leaving the qualia-generation channel intact (assuming EWG anatomy is right).
  *   **EWG Prediction:** The patient will have the experience (qualia exist in the left hemisphere) but will report "nothing happening" because the shadow-signal required to drive speech was cut. The accuracy breaks because the tracking line is dead, not because the experience is gone.
  *   **IDT Prediction:** The patient will report "nothing happening" because there is no experience. If the causal path to speech is cut, the qualia either didn't form or couldn't influence the report. If the patient *does* report the experience via some workaround, it proves qualia can route around physical blocks, violating closure.

  #### Crux 2: Does the paradox actually refute epiphenomenalism or just reveal a weird self-modeling loop?

  *   **The Setup:** When we say "I am conscious," are we describing a causal interaction or running a pre-loaded script? The EWG argues the brain is wired to *assume* interaction (the loop). The IDT argues the assumption is true because the system wouldn't stabilize otherwise.
  *   **Concrete Hypothetical (Case 99-Z):** A subject is hooked to a feedback loop where their reported confidence in seeing a stimulus is artificially decoupled from the stimulus intensity, but the qualia intensity remains linked to stimulus intensity. We ask: "Did the feeling match the report?"
  *   **EWG Prediction:** The subject will insist the report matched the feeling, even when recorded data shows a divergence. This proves the **self-modeling loop** is hardcoded; the brain assumes the shadow-signal is truthful even when it's being manipulated externally. The qualia didn't change, but the model of the qualia did.
  *   **IDT Prediction:** The subject will report a mismatch or confusion. If qualia causally drive the report, tampering with the report pathway should create a detectable cognitive dissonance or error signal that the subject can identify. If they can't tell, it implies the qualia weren't doing the driving in the first place—which refutes interactionism (wait, no—IDT says if they *can* tell, it proves interaction).
      *   *Correction on IDT Prediction:* The subject will detect the mismatch because the **causal flow was interrupted**. The qualia tried to cause the report, failed, and the system registered an error.

  ### IV. Next Steps

  We need to stop talking about zombies. It's not about whether zombies are possible, it's about whether *this* brain can track *that* state without touching it. The shadow-qualia hypothesis is neccessary for the EWG to survive the accuracy argument, but it feels ad-hoc to the IDT.

  We agree to fund Case 88-B. If the left hemisphere says "nothing" while the right hand withdraws from heat (indicating NCC activity), we look at the wiring. If the wiring shows a forked path, EWG wins points. If it shows a single integrated loop, IDG takes the pot.

  *(Note: fixed the phsyical typo in section 3, but left one in the header just to keep it real.)*
