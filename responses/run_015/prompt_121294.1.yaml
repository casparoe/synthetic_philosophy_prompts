answer: |-
  Here are the deliverables for your final exam. I have kept the tone rigorous and the constraints tight, focusing entirely on the structural problems you identified rather than the standard bioethics script.

  ### 1. The Exam Question

  **Course:** PHI 305 – The Ethics of Reproduction
  **Exam:** Final Essay
  **Time:** 60 Minutes
  **Word Count:** Approx. 1000 words
  **Marks:** 30

  **Question:**

  Alex and Jordan are undergoing IVF. Their clinic has produced four viable embryos. Using polygenic scoring, the clinic provides predicted percentiles for each embryo regarding general health, height, and educational attainment. Embryo C scores highest on all three. However, the clinic informs Alex and Jordan that if they wait twelve months, scoring accuracy may improve. Alternatively, they could undergo another stimulation cycle now to produce six additional embryos, increasing the statistical likelihood of a higher-scoring candidate, though this involves significant cost and physical burden.

  The Principle of Procreative Beneficence (PB) states that couples should select the child, of the possible children they could have, who is expected to have the best life.

  Critically assess whether PB provides determinate action-guidance in this scenario. In your answer, you must address the following:

  1.  **The Comparator Set:** Does the set of "possible children" include only the four existing embryos, or does it extend to those available via delay or further cycles? Explain how fixing or expanding this set affects the coherence of PB.
  2.  **Positional Goods:** How does the inclusion of traits like height and educational attainment (which are partly competitive) impact the claim that selecting the "best" embryo maximizes welfare?
  3.  **The Existing Child Analogy:** Evaluate whether the obligation to select the best embryo differs morally from an obligation to maximize the prospects of an existing child (e.g., by moving to a better school district). Do not simply assert the difference; explain what grounds it.

  ***

  ### 2. Model Answer

  The Principle of Procreative Beneficence (PB) appears to offer clear advice: select the embryo expected to have the best life. In the scenario involving Alex and Jordan, however, PB fails to provide determinate action-guidance because the "set of possible children" is elastic, and the traits being selected are often positional. Without arbitrary constraints on the option space, PB becomes overdemanding; without accounting for competition, it fails to maximize welfare.

  The primary structural failure of PB in this context concerns the comparator set. If the set of "possible children" is fixed strictly to the four existing embryos, the principle is arbitrarily indexed to a contingent medical event. Why should moral obligation begin only after stimulation? If Alex and Jordan could have had a different child by waiting a year or undergoing another cycle, excluding those possibilities from the moral calculation seems unjustified. However, if the comparator set includes all children they could *in principle* have—including those from future cycles or different partners—the principle becomes indefinitely expandable. There is always a chance a future cycle could yield a higher-scoring embryo, or that waiting could yield better technology. If PB requires maximizing across all possible options, it demands that parents never stop searching for a "better" child, rendering the principle action-guiding only in the trivial sense that one must always seek more options. To make PB work, one must impose an arbitrary cutoff on the option space (e.g., "only existing embryos"), but this undermines the principle's foundational claim to be based on maximizing welfare.

  This problem is compounded by the nature of the traits being scored. PB assumes that selecting for higher percentiles in height or educational attainment increases the child's expected well-being. Yet, these are partly positional goods. Their value depends on how the child compares to others. If all parents follow PB and select for height or higher educational potential, the average rises, but the relative distribution remains unchanged. The child selected for high educational attainment gains no advantage if everyone else's children are similarly selected; the competitive landscape simply ratchets up.

  This creates a collective action problem that undercuts the welfare justification. If the benefit of the trait is relative, following PB individually does not necessarily produce the "best life" collectively. In fact, it may reduce overall welfare by increasing competition without increasing absolute resources. Therefore, applying PB to positional traits is self-defeating: it promises to maximize welfare but delivers only a reshuffling of ranks. A defender of PB might argue that some absolute health benefits remain, but as long as the selection criteria include positional traits, the principle cannot guarantee the welfare improvement it promises.

  Finally, students of PB often retreat to the analogy of the existing child: we do not obligate parents to move to better school districts or spend all savings to improve an existing child's prospects, so why obligate them to select the best embryo? To earn this analogy, one must identify a morally relevant difference. The standard distinction relies on identity. Selecting a different embryo creates a different child; improving an existing child's environment helps the same child. If we accept the Non-Identity Problem, failing to select the best embryo harms no one, because the child who exists would not have existed otherwise. However, this distinction does not save PB from the overdemandingness objection. Even if the identity differs, the cost to the parents (financial, physical, emotional) of delaying or restimulating is analogous to the cost of moving school districts. If we reject a duty to maximize for existing children because the cost is too high relative to the gain, consistency suggests we should reject a duty to maximize for possible children when the cost involves further medical intervention.

  Ultimately, PB collapses in this scenario. If the option space is fixed, the principle is arbitrary; if it is open, it is overdemanding. If the traits are positional, the welfare gain is illusory. The analogy to existing children highlights that we generally reject maximizing duties when costs are high, regardless of identity. PB therefore fails to offer specific advice to Alex and Jordan beyond "do something," leaving them without the moral clarity the principle promises.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 30
  **Pass Threshold:** 15 marks (C-)

  | Component | Marks | Criteria for Distinction (A vs. B vs. C) | Common Errors / Penalties |
  | :--- | :---: | :--- | :--- |
  | **1. The Comparator Set** (Elasticity & Arbitrariness) | 10 | **A (8-10):** Explicitly connects the elasticity of the option space (wait/cycle) to the indeterminacy of the principle. Argues that fixing the set is arbitrary, but opening it is overdemanding.<br>**B (5-7):** Identifies the option to wait/cycle but treats it as a practical hurdle rather than a structural problem for the principle.<br>**C (0-4):** Treats the four embryos as the fixed set without question, or ignores the "wait/cycle" option entirely. | **Error:** Assuming the "possible children" are just the four embryos provided by the clinic.<br>**Penalty:** -3 marks if the student treats the clinic's output as the moral boundary without justification. |
  | **2. Positional Goods** (Collective Action & Welfare) | 10 | **A (8-10):** Explains *why* positional traits undermine the welfare justification (ratchet effect/zero-sum). Connects this back to the failure of PB to maximize well-being.<br>**B (5-7):** Identifies that traits are competitive but treats it as a separate sociological issue rather than a philosophical objection to PB.<br>**C (0-4):** Treats height/education as absolute goods, or argues PB is wrong simply because "personality matters more." | **Error:** Arguing that selecting for height is wrong because it is superficial, rather than because it is positional.<br>**Penalty:** -3 marks for claiming positional traits provide absolute welfare gains. |
  | **3. The Existing Child Analogy** (Identity & Cost) | 5 | **A (5):** Distinguishes selection vs. improvement via identity but notes that cost/burden applies to both. "Earns" the analogy by testing its limits.<br>**B (3-4):** States the identity difference clearly but fails to address the cost/burden parallel.<br>**C (0-2):** Asserts the analogy holds or fails without explanation (e.g., "because one is born and one isn't"). | **Error:** Deploying the analogy as a trump card without addressing the Non-Identity Problem.<br>**Penalty:** -2 marks for using the analogy to dismiss PB without analyzing the cost structure. |
  | **4. Argumentative Coherence** (Structure & Clarity) | 5 | **A (5):** Integrated argument. The three components build on each other (e.g., elasticity makes positional problems worse). Clear conclusion.<br>**B (3-4):** Three distinct sections that do not interact. Conclusion is vague.<br>**C (0-2):** Disorganized, or relies on memorized scripts unrelated to the vignette. | **Error:** Writing a "list of objections" essay (e.g., Disability, Autonomy, Eugenics) without engaging the vignette.<br>**Penalty:** **Cap at 15 marks (C)** if the essay relies primarily on the Disability Rights Critique or generic Autonomy arguments. |

  **Examiner's Note on Stock Objections:**
  This question is designed to bypass standard scripts. If a student writes primarily about the rights of the disabled, the moral status of the embryo, or generic eugenics warnings without addressing the **Comparator Set** or **Positional Goods** as defined in the prompt, they have not answered the question. Such essays should be marked down heavily in Component 4 and cannot score above a C grade regardless of writing quality, as they demonstrate a failure to engage with the specific philosophical problem set.
