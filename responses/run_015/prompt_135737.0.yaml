answer: |-
  - The procedure (around 350 words)

  This procedure balances Rankean evidentiary standards with Whitean narrative skepticism. It detects when story drives evidence rather than vice versa. It is designed for editors without primary source access.

  1. **Evidence-to-Assertion Ratio:** Sample ten pages. Count sentences making historical claims versus sentences presenting archival evidence. **Pass:** Evidence equals or exceeds claims. **Fail:** Claims outnumber evidence 2:1. **Judgment:** 1:1 ratio but heavy on theory. Catches implicit framing where assertion substitutes for proof.
  2. **The Counterfactual Test:** Does the author acknowledge plausible alternative causes from the same era? **Pass:** Alternatives stated and refuted with evidence. **Fail:** Alternatives ignored or dismissed without proof. **Judgment:** Alternatives mentioned but refuted via logic. Tests if narrative shape excludes competing realities.
  3. **Interiority Audit:** Highlight descriptions of subjective mental states. **Pass:** Every state links to a diary, letter, or testimony. **Fail:** Mental states asserted without direct source attribution. **Judgment:** Inferred states marked as speculation. Prevents novelistic invention disguised as history.
  4. **The Silence Check:** Does the narrative flow smoothly across known historical gaps? **Pass:** Gaps are explicitly noted as uncertainties. **Fail:** Narrative bridges gaps with connective tissue disguised as fact. **Judgment:** Gaps noted but minimized. Identifies where narrative coherence overrides archival fragmentation.

  If a manuscript fails two or more questions, reject immediately. If it fails one, request major revision. If it triggers Judgment calls, assess based on the magazine's mission regarding public engagement versus strict accuracy. This ensures the narrative structure remains visible, allowing readers to see where the historian's hand shapes the record. It forces the author to reveal the scaffolding rather than painting over it.

  - Where judgment replaces the checklist (around 100 words)

  The checklist identifies structural risks, not absolute falsehoods. When a manuscript triggers a "Judgment" call, the editor must weigh narrative value against historical integrity. A "Fail" on interiority might be acceptable in a public history piece if labeled speculation, whereas a "Fail" on evidence density suggests fundamental weakness. Here, you move from procedural verification to philosophical arbitration. You decide in the end if the narrative imposition serves understanding or distorts reality significantly.

  - Case 1 (around 120 words)

  This submission fails the Counterfactual Test. It proposes a monocausal explanation (telegraphs) while ignoring ideological factions. By dismissing alternative causes without archival proof, the author fits documents to a technological determinist shape. It likely passes the Evidence-to-Assertion ratio if telegram logs are quoted frequently, but the Silence Check also flags the omission of factional splits. Since it fails two questions (Counterfactual and Silence), the procedure dictates rejection. The narrative framing here actively distorts the historical record by elevating infrastructure over human agency without justification. It violates Rankean aims by ignoring evidence of disagreement and exemplifies White's warning where plot dictates selection.

  - Case 2 (around 120 words)

  This submission fails the Interiority Audit. Describing a worker's "inner resistance" without diaries, letters, or interviews invents mental states. This is novelistic fabrication, not historical inference. Even if the archival work on factory conditions is solid, the narrative voice claims access it does not possess. It fails the Evidence-to-Assertion ratio regarding psychological claims. The procedure mandates rejection unless the author reframes these passages as hypothetical or removes the interiority entirely. Allowing this passes off imagination as archive, violating the trust required for non-fiction history. It is a clear case of narrative framing overriding evidentiary limits.

  - Case 3 and the unwanted flag (around 150 words)

  This submission triggers the Silence Check. It flows smoothly over indigenous displacement, treating settlement as purely legalistic. The procedure flags this as a "Fail" on narrative coherence overriding archival fragmentation (the fragmentation being the conflict). However, you intend to accept it. The procedure correctly identifies the Whitean danger: the narrative shape erases violence to create order. Because your magazine covered displacement previously, you can accept this as a specific slice (legal history) rather than a total history. The flag ensures you acknowledge the omission consciously rather than inadvertently. You publish with an editor's note contextualizing the omission. The procedure forces awareness, even if the final decision still overrides the rejection criterion based on broader editorial strategy. You accept the Rankean accuracy of the deeds while acknowledging the Whitean construction. It ensures the omission is a strategic choice, not an oversight.

  - What the procedure flat-out cannot do (around 80 words)

  This procedure cannot verify source authenticity or detect sophisticated cherry-picking where excluded evidence is obscure. It relies on the editor's existing knowledge of major controversies. It cannot resolve philosophical disputes about what counts as a true fact versus an interpretation. It cannot measure the quality of writing or significance of the historical contribution, only the relationship between evidence and narrative structure.
