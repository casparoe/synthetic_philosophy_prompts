answer: |-
  ### Reconstruction of the Implicit Theory

  The welfare standards you describe rest on a theory best characterized as **Threshold Utilitarianism with a Negative Welfare Focus**. This theory prioritizes the minimization of suffering (negative welfare) over the provision of pleasure or flourishing (positive welfare), assessed primarily at the population level rather than the individual level. It treats welfare as a state-dependent property (current health, environment, stress) rather than a narrative property (life story, duration, potential).

  Below is the interrogation of this theory across your five points, followed by the pressure test of the lifetime integral.

  #### 1. Temporal Structure: Time-Slices vs. Lifetime Aggregation
  The standards treat welfare as a series of **compliance snapshots**. By capping stocking density and mortality *rates* without capping duration, the practice presupposes that welfare is primarily a function of *intensity* of suffering per unit time, not the *duration* of existence.
  *   **Implicit View:** A life is not inherently better for being longer. Welfare is not aggregated additively across a lifetime in the regulatory accounting.
  *   **Epistemic Status:** This is **contested** in welfare science. The "Five Domains" model increasingly emphasizes positive welfare states which often require time to express (e.g., exploration, bonding). However, the regulatory practice fits a "Five Freedoms" model (freedom from discomfort/hunger), which is state-based.
  *   **Asymmetry Explanation:** The asymmetry (penalizing mortality but not duration) is explained if mortality is viewed as a proxy for *unmanaged suffering* (disease, predation), whereas duration is viewed as an economic variable. The theory assumes that if intensity is kept below a threshold, duration is morally neutral.

  #### 2. Death: Harm vs. Evidence of Suffering
  The distinction between cumulative mortality (failure) and culling (required/neutral) reveals a specific view on death.
  *   **Implicit View:** Death itself is not a harm to the animal (no "right to life"). Rather, premature death is a welfare failure only insofar as it indicates *prior suffering* (disease, neglect) or a *bad death process* (asphyxiation). Culling is viewed as a net welfare gain because it terminates negative welfare states (suffering from injury/runting).
  *   **Epistemic Status:** Whether death harms non-human animals is **contested** in philosophy (Deprivation Account vs. Subject-of-a-Life vs. Interest View). The practice strictly presupposes the **Interest View**: animals have an interest in not suffering, but not necessarily an interest in continuing to live, provided the death is humane.
  *   **Fasting:** Fasting is treated as a minor negative welfare cost outweighed by the health/safety benefit (reduced gut content, better slaughter quality). This confirms the negative welfare focus: avoiding disease/contamination (health) trumps temporary hunger (welfare).

  #### 3. Finfish–Crustacean Asymmetry: Sentience Thresholds
  The split in slaughter requirements presupposes a difference in moral standing or sentience capacity.
  *   **Implicit View:** Finfish are phenomenal conscious subjects (capable of suffering); crustaceans are either nociceptive automata or their suffering is too uncertain to mandate costly mitigation.
  *   **Epistemic Status:** Fish pain perception is **settled** among veterinary scientists but philosophically nuanced regarding phenomenology. Crustacean pain is **contested/emerging**; recent evidence (e.g., UK Animal Welfare Sentience Act 2022) suggests sentience, but regulatory lag exists.
  *   **Presupposition:** The practice is **strongly suggested** to rely on a precautionary principle for fish but cost-benefit analysis for crustaceans. It is not strictly presupposed that crustaceans *cannot* suffer, but rather that the evidence is insufficient to justify the economic cost of stunning mandates in many jurisdictions.

  #### 4. Unit of Assessment: The Group as the Patient
  Thresholds on averages (mortality rates, density) make the population the unit of moral concern.
  *   **Implicit View:** Welfare is aggregative. Individual suffering is permissible if the group average remains within bounds. This is a **Utilitarian Aggregation** model.
  *   **Epistemic Status:** Whether welfare aggregates is **contested**. Prioritarian views would weigh the worst-off individuals more heavily. The practice rules out strict Individual Rights views (where any individual suffering is a violation).

  #### 5. Fasting: Negative vs. Positive Welfare
  The acceptance of fasting confirms the standards are built on a **Health-Centred Conception** of welfare.
  *   **Implicit View:** Welfare is the absence of pathology and stress. Positive states (satiety) are secondary to health outcomes (food safety, metabolic health pre-slaughter).
  *   **Epistemic Status:** Whether positive welfare is a distinct requirement is **contested**. The "Five Domains" model says yes; traditional regulatory frameworks often say no.

  ### Pressure Test: The Lifetime Integral
  If we rewrite the standard to cap the **integral of negative-welfare-days** over a lifetime:
  1.  **Consequence:** A short, intense life could indeed pass if the total integral is low, potentially favoring earlier slaughter. A long life with low daily suffering might fail simply due to accumulation of minor negatives.
  2.  **Does this follow?** Yes, it follows from the commitment that **existence is not a welfare good**. If welfare is only the subtraction of negatives, minimizing time minimizes risk.
  3.  **Load-Bearing Commitment:** The repugnant conclusion (short life > long life) rests on the commitment that **life has no intrinsic positive value** in the welfare calculus.
  4.  **Blocking the Consequence:** To block this, standards must add a **Positive Welfare Credit** (life adds value over time) or a **Deontological Constraint** (minimum lifespan independent welfare score). Without these, the integral of negatives inevitably favors non-existence or brief existence.

  ### Epistemic Summary
  *   **Settled:** Fish nociception and stress physiology; mortality indicates management failure.
  *   **Contested:** Crustacean phenomenology; whether death is a harm; whether welfare aggregates additively; whether positive welfare is mandatory.
  *   **Underdetermined:** The standards could equally be explained by a "Consumer Confidence" theory (welfare as quality marker) rather than an "Animal Ethics" theory. The practice fits both.

