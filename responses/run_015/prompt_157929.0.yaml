answer: |-
  # Preparation Sheet: Infinite Ethics Workshop Q&A

  ## I. Opening Concessions (First 2 Minutes)
  *Before taking questions, disarm the room by preempting the two most distracting technical objections and signaling philosophical humility.*

  1.  **Concede Cosmological Contingency:** State clearly: "My view is hostage to cosmology. If the CMB rest frame turns out to be merely a convenient gauge rather than a physically preferred foliation, or if eternal inflation renders global density undefined, this ethical ordering collapses. I am not doing metaphysics of physics; I am conditionalizing ethics on the best current standard model."
  2.  **Concede the 'Unlovely Consequence':** Do not try to soften the blow that local acts with zero density impact are axiologically neutral. Say: "I accept that on this view, a localized act of suffering that does not alter the long-run density structure is not *axiologically* better or worse. I argue this shifts the deontic status of such acts to structural duties or non-consequentialist constraints, but I grant the axiological neutrality."
  3.  **Why:** This prevents the Cosmologist and the Decision Theorist from spending their question time establishing things you already grant, forcing them to engage with the *normative* implications instead.

  ## II. The Objections (8–10)
  *Ordered by likely arrival (Technical $\to$ Normative) and damage potential.*

  ### 1. The "Foliation Gauge" Objection
  *   **Constituency:** Cosmologist.
  *   **Vocabulary:** "Comoving coordinates," "General Covariance," "Gauge freedom."
  *   **Objection:** "The CMB frame is only preferred relative to matter distribution in the observable universe. In General Relativity, any foliation is as valid as any other unless you break Lorentz invariance fundamentally. Why privilege a frame defined by contingent matter distribution over the geometric structure of spacetime itself?"
  *   **2-Minute Reply:** "I am not claiming the frame is metaphysically necessary, but ethically salient. Just as we use 'sea level' for altitude despite it being contingent, we use the CMB frame because it provides the only *canonical* synchronization available to agents within the universe. Ethics requires a common clock; the CMB provides the only non-arbitrary one we have."
  *   **Soft Note:** This conflates *convenience* with *normativity*. If the frame is contingent, why is it *fair*?

  ### 2. The "Limit Existence" Objection
  *   **Constituency:** Mathematical Economist.
  *   **Vocabulary:** "Convergence," "Cesàro means," "Oscillatory functions."
  *   **Objection:** "You define value by long-run density. But value density might oscillate forever without converging. If the limit doesn't exist, your ordering is undefined. Are you implicitly invoking a Banach limit to force convergence?"
  *   **2-Minute Reply:** "I am not invoking a Banach limit, which would reintroduce the arbitrariness I'm trying to avoid. If the density oscillates, the world is incomparable under my view. I accept incomparability in edge cases rather than buying a mathematical trick that violates the symmetry constraints."
  *   **Soft Note:** Accepting incomparability weakens the 'completeness' requirement you started with. You've traded paralysis for fragmentation.

  ### 3. The "Ultrafilter in Disguise" Objection
  *   **Constituency:** Mathematical Economist.
  *   **Vocabulary:** "Free ultrafilter," "Non-principal," "Choice function."
  *   **Objection:** "Restricting symmetries to physical ones looks like selecting a specific ultrafilter on the set of locations. You've just hidden the arbitrary choice in the selection of the physical metric. Isn't this 'choice of ultrafilter with extra steps'?"
  *   **2-Minute Reply:** "An ultrafilter selects a subset of locations to count. My view counts *all* locations but weights them by their physical relation to the origin. The structure is imposed by the universe, not by a mathematical choice function. The 'arbitrariness' charge holds only if physical structure is morally inert."
  *   **Soft Note:** If physical structure is morally inert, this reply fails (see Objection 8).

  ### 4. The "Cosmological Uncertainty" Objection
  *   **Constituency:** Decision Theorist.
  *   **Vocabulary:** "Credences," "Expected utility," "State dependence."
  *   **Objection:** "I have non-zero credence that the universe is finite, and non-zero credence that it's infinite but with a different foliation. Your ordering is state-dependent. How do I maximize expected utility when the *axiology* itself changes across states?"
  *   **2-Minute Reply:** "You treat the axiology as a payoff. I suggest treating the axiology as a constraint. In states where density is undefined, fall back to finite Pareto. In states where it is defined, use density. This is a lexical priority rule, not an expectation calculation over orderings."
  *   **Soft Note:** Lexical rules are vulnerable to Dutch Books. A Decision Theorist will smell blood here.

  ### 5. The "Representation Theorem" Objection
  *   **Constituency:** Decision Theorist.
  *   **Vocabulary:** "Von Neumann-Morgenstern," "Continuity axiom," "Preference relation."
  *   **Objection:** "Your ordering violates the Continuity axiom. If A is better than B, and B better than C, there should be a mixture where you're indifferent. With infinite densities, small probabilities of infinite value break the representation. Can this view be represented by any utility function?"
  *   **2-Minute Reply:** "No, and I deny that infinite ethical contexts must satisfy VNM continuity. The continuity axiom assumes Archimedean value, which fails in infinite settings. I am offering a qualitative ordering, not a cardinal utility representation."
  *   **Soft Note:** This isolates you from standard decision theory. You lose the ability to say an agent is 'irrational' for violating your view.

  ### 6. The "Denominator" Objection
  *   **Constituency:** Population Ethicist.
  *   **Vocabulary:** "Per capita," "Total view," "Value-bearing locations."
  *   **Objection:** "Density relative to what? Spacetime volume? Number of persons? If I fill a void with happy rocks, volume density goes up, but person-density stays flat. Why is spacetime volume the moral denominator?"
  *   **2-Minute Reply:** "Because spacetime volume is the invariant container. Persons are contingent contents. If we normalize by persons, we return to the permutation problem (where are the persons located?). Volume anchors the value to the stage, not the actors."
  *   **Soft Note:** This sounds cold. "Happy rocks" intuitively shouldn't count as much as persons. You risk the Repugnant Conclusion in reverse.

  ### 7. The "Local Suffering" Objection
  *   **Constituency:** Population Ethicist / Consequentialist.
  *   **Vocabulary:** "Local harm," "Pareto," "Neutrality."
  *   **Objection:** "If I torture someone in my basement and the long-run density is unchanged, you say the world isn't worse. That violates the core consequentialist intuition that suffering is bad *wherever* it occurs. Have you abandoned consequentialism?"
  *   **2-Minute Reply:** "I have abandoned the claim that *axiological value* tracks every local instance of suffering in an infinite context. I maintain that *duty* tracks it. The 'badness' is a violation of structural duty, not a subtraction from the world's total score."
  *   **Soft Note:** This is a semantic retreat. If the world isn't worse, why is it a duty? You need a robust account of non-axiological duty.

  ### 8. The "Is/Ought" Objection (High Damage)
  *   **Constituency:** General / Non-Consequentialist.
  *   **Vocabulary:** "Naturalistic fallacy," "Normative relevance," "Symmetry."
  *   **Objection:** "You move from 'physics has this symmetry' to 'ethics must respect this symmetry.' That is a category error. Physical naturalness does not imply moral fairness. Why should the CMB frame dictate moral invariance?"
  *   **2-Minute Reply:** "Impartiality requires *some* invariance group. Arbitrary bijections are too broad (causing paralysis). Physical symmetries are the maximal non-arbitrary group available. We shouldn't demand more invariance than the universe supports without losing grip on reality."
  *   **Soft Note:** **This is the core vulnerability.** (See "Weakest Joint" below).

  ### 9. The "Motivation" Objection
  *   **Constituency:** General / Consequentialist.
  *   **Vocabulary:** "Reasons for action," "Difference making."
  *   **Objection:** "If my act doesn't change the value of the world, why do it? You've severed the link between 'making the world better' and 'doing the right thing.' What motivates the agent?"
  *   **2-Minute Reply:** "The motivation is alignment with the structure of value, not the production of aggregate value. Think of it as aesthetic or structural integrity rather than accumulation. You act to maintain the pattern, not to add to the sum."
  *   **Soft Note:** This sounds virtue-ethical. Consequentialists may reject this as a deviation from the view's branding.

  ### 10. The "Non-Measurable Sets" Objection
  *   **Constituency:** Mathematical Economist.
  *   **Vocabulary:** "Vitali sets," "Lebesgue measure," "Axiom of Choice."
  *   **Objection:** "Even with physical restrictions, if the universe is continuous, there are non-measurable sets of locations. Can your density function assign value to a world where value is distributed on a non-measurable set?"
  *   **2-Minute Reply:** "I assume value is distributed on measurable regions (bounded spacetime volumes). If value resides on non-measurable sets, the problem is ontological, not ethical. I bracket worlds where value distribution is mathematically pathological."
  *   **Soft Note:** Bracketing pathological cases is standard, but a set theorist will note that 'pathological' sets are often just as real as 'nice' ones in ZFC.

  ## III. Strategic Analysis

  ### Confirming the Diagnosis
  You asked me to confirm or correct your diagnosis that the soft spot is the step from **"Impartiality is symmetry-relative"** to **"The relevant symmetries are the physical ones."**
  *   **Verdict:** **Confirmed.** This is the "Is/Ought" Objection (#8). If the audience grants that physical structure is morally inert, your view collapses into either the standard paralysis (if they demand arbitrary bijections) or arbitrary stipulation (if they accept physical symmetries but deny their moral weight).
  *   **Correction:** However, the *rhetorical* soft spot is the **"Local Suffering" Objection (#7)**. Even if you win the symmetry argument, the audience will recoil from the implication that local torture is axiologically neutral. You must be prepared to defend the separation of *Axiology* (world value) from *Deontology* (duty).

  ### The Single Reply That Has to Land
  **The "Maximal Non-Arbitrariness" Defense.**
  When challenged on why physical symmetries matter (Objection #8), you must land this:
  *"Impartiality demands we ignore irrelevant differences. Location is irrelevant. But 'which location' is only defined relative to a frame. Arbitrary bijections ignore the physical structure that *defines* location. To demand invariance under arbitrary bijections is to demand invariance under changes to the definition of the relata themselves. Physical symmetries are the only invariance group that respects the existence of the relata."*
  If this fails, you are just stipulating a metric.

  ### The Weakest Joint (To Expose Proactively)
  **The Volatility of Ethics.**
  You should expose the fact that **your ethics changes if cosmology changes.**
  *   **Why:** It shows intellectual honesty and preempts the Cosmologist.
  *   **How:** "I want to be clear: if next year we discover the CMB frame is not a preferred foliation, I have to change my ethics. I am not claiming to have found eternal moral truth; I am claiming to have found the best mapping of ethics onto our current physics."
  *   **Risk:** It makes your view look unstable. But it's better than them thinking you ignore the physics.

  ### The Question You Are Praying Nobody Asks
  **Your Candidate:** *Infinite Duplicates.* (If there are infinite copies of me, my act is global).
  **My Assessment:** **Your candidate is correct, but the deeper version is the "Measure Problem."**
  *   **The Worse Question:** "In an infinite, homogeneous universe, there is no canonical measure to define 'density' without a cutoff. The CMB frame gives you a time slice, but not a *measure* on that slice. To get a ratio of Value/Volume, you need to integrate. If the spatial slice is infinite, the integral diverges. You need a cutoff to define the limit. **Where do you put the spatial cutoff?** If you put it at 'observable universe,' you violate impartiality (favoring our location). If you take the limit as radius $\to \infty$, you return to the convergence problems (Objection #2). **How do you define the denominator without an arbitrary spatial cutoff?**"
  *   **Why it's worse:** The duplicate problem just scales your act. The Measure Problem destroys the *definition* of your ordering. If you can't define the density without an arbitrary spatial cutoff, you haven't solved the arbitrariness problem; you've just moved it from time to space.
  *   **Preparation:** If this comes up, you must argue that the *limit* process (expanding spheres centered on the act) is the canonical measure, not a cutoff. But be ready for the Math Economist to point out that the limit depends on the shape of the expanding region (spheres vs. cubes), which reintroduces arbitrariness.

  ## IV. Final Advice
  *   **Tone:** Do not be defensive about the "unlovely consequence." Own it. It shows you have followed the argument where it leads.
  *   **Allies:** The Decision Theorists are your best hope for survival. If you can convince them that your view offers a *workable decision rule* where others offer paralysis, they may overlook the normative gaps.
  *   **Escape Hatch:** If cornered on the "Is/Ought" gap, retreat to **Pragmatism**: "It is the only view that allows for non-trivial decision making in an infinite world consistent with known physics. That pragmatic success justifies the normative premise."
