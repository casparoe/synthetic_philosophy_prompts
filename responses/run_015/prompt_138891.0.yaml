answer: |-
  Here is a reconstruction of the normative logic underlying Ranked Choice Voting (RCV), followed by an analysis of what would shift if we prioritized pairwise majority instead.

  The core thesis is this: **RCV does not attempt to solve Arrow's problem; it dissolves it by changing the definition of an election.** Arrow's theorem assumes an election is a *measurement device* intended to map a pre-existing, fixed "will of the voters" onto a winner. RCV operates on the presupposition that an election is a *simulation of coalition formation*. It is not trying to find the candidate who was already the "true" favorite; it is trying to find the candidate who can construct a majority mandate through a process of elimination and redistribution.

  Once you accept that distinction, your four puzzles resolve into a coherent, if debatable, political philosophy.

  ### 1. The Spoiler Paradox: Vote-Splitting vs. IIA
  You are correct that RCV violates Independence of Irrelevant Alternatives (IIA). In strict social choice terms, adding or removing a losing candidate *can* change the winner. However, the reform pitch about "ending spoilers" is not invoking IIA; it is invoking a specific critique of *Plurality* voting.

  Under Plurality, a "spoiler" is someone who draws votes away from a similar candidate, causing both to lose to a dissimilar candidate (the Nader/Gore dynamic). This happens because Plurality treats a vote as a binary signal: *Yes* to this one, *No* to everyone else. RCV changes the signal to: *Yes* to this one, *If not, then* that one.

  **The Presupposition:** RCV presupposes that the primary function of an election is to prevent *wasted expression*. It assumes that a voter's preference for a long-shot candidate is sincere and should not be penalized by the fear of helping their least-favorite candidate win.

  **The Distinction:** The "spoiler" RCV claims to fix is the *strategic* spoiler (vote-splitting). The IIA violation RCV inherits is the *structural* spoiler (order of elimination).
  *   **Strict Presupposition:** RCV is committed to the idea that *viability* is dynamic. A candidate is not "irrelevant" just because they have few first-choice votes; they are relevant if their elimination changes the coalition math.
  *   **Underdetermination:** The reform pitch conflates these. It promises "your vote won't be wasted" (true) but implies "the outcome will be consistent regardless of the field" (false). The practice strictly presupposes that *who gets eliminated first* is a legitimate way to decide a winner, even if that order is sensitive to the presence of "no-hope" candidates.

  ### 2. The Majority Illusion: Running Majority vs. Condorcet
  This is the crux of the Alaska 2022 case (where the moderate Republican, Begich, was eliminated before the final round, despite likely beating both opponents head-to-head).

  RCV produces a **Running Majority**: a candidate who has >50% of the votes *among those still in the race*.
  Condorcet produces a **Pairwise Majority**: a candidate who beats every other candidate in a one-on-one contest.

  These come apart because RCV weights *intensity of first support* as a gatekeeper. In the Alaska case, Begich was everyone's second choice but no one's first choice. RCV eliminated him because he lacked a *base*.

  **The Conception of Collective Preference:** RCV presupposes that **governability requires a base.** It assumes that a candidate who is universally acceptable but passionately supported by no one lacks the mandate to govern. The "will of the voters," in the RCV view, is not just about who is least objectionable (Condorcet); it is about who has enough active supporters to form a governing coalition, even if that coalition is assembled in rounds.

  **Coherence:** This is coherent if you view elections as hiring decisions. If you hire a CEO who is everyone's second choice but no one's first, they may lack the capital to fire anyone or make hard decisions. RCV prioritizes *active consent* over *passive acceptance*. It accepts the risk of eliminating the "compromise candidate" to ensure the winner has a core of enthusiastic support.

  ### 3. Stability of Preferences: Fixed vs. Contextual
  You asked if reusing the ballot presupposes stable preferences.
  **Strictly:** Yes, it presupposes *ordinal* stability. It assumes that if you prefer A > B > C in a field of ten, you will still prefer A > B > C in a field of three.
  **Practically:** This is a convenience, but it carries a normative weight. It treats the voter as a *sovereign judge* whose deliberation is complete at the moment of voting.

  Contrast this with the French two-round system. In France, the gap between rounds allows for public deliberation, endorsements, and shifting coalitions. The voter is allowed to change their mind based on new information (e.g., "Candidate X endorsed Candidate Y").
  *   **RCV View:** The voter knows their own mind best at the time of voting. The system should not rely on external elites to negotiate the second round; the voters' private rankings should do the work.
  *   **Arrow's Framework:** Arrow assumes fixed preferences because he is modeling aggregation, not deliberation. RCV fits Arrow's static model better than the French system does, but it tries to *simulate* the dynamic outcome of a runoff without the time gap.

  ### 4. Two-Round Runoffs and the "Will" of the Voters
  The French system (and any dynamic runoff) is indeed an evasion of Arrow's theorem, but not by solving the math. It evades the theorem by rejecting the **Snapshot Model** of democracy.

  Arrow asks: "Given these fixed preferences, what is the fair rule?"
  The Two-Round System asks: "How can we allow preferences to evolve into a stable majority?"

  If you take the Two-Round view seriously, the "will of the voters" is not a pre-existing vector to be discovered; it is a *construction* formed through the campaign process. The first round is a poll; the second round is the decision.
  *   **RCV's Middle Ground:** RCV tries to have it both ways. It wants the *deliberative outcome* of a runoff (a majority winner) without the *deliberative process* (time passing). It compresses the "formation of will" into the privacy of the voting booth. This is why it insists on the ballot being fixed: it treats the ranking as a complete instruction set for a proxy negotiator (the election official) to simulate the runoff instantly.

  ---

  ### The Pivot: Taking Pairwise Majority (Condorcet) Seriously

  If we shift from RCV to a Condorcet method (elect the candidate who beats everyone head-to-head), we change the fundamental purpose of the election from **Mandate Generation** to **Conflict Resolution**.

  **1. What Changes in Practice?**
  *   **Counting:** You cannot count votes sequentially. You must tally a matrix (A vs B, A vs C, B vs C...). This is computationally trivial now, but conceptually heavy.
  *   **Ballots:** You still need rankings, but the *strategy* changes. In RCV, you might rank a long-shot first to signal strength. In Condorcet, ranking a long-shot first is risky if it helps eliminate a compromise candidate who would have beaten your least favorite.
  *   **The "No Winner" Problem:** Arrow's theorem implies cycles are possible (A beats B, B beats C, C beats A). RV avoids this by forcing an elimination order. Condorcet admits the possibility of *no clear will*.
      *   *Resolution:* You need a "Condorcet completion" method (like Minimax or Smith Set) to break cycles. This reintroduces arbitrariness. You are no longer just "finding" the winner; you are applying a tie-breaker rule to a deadlock.

  **2. What Changes in Talk?**
  *   **Legitimacy:** Under RCV, legitimacy comes from "I got 51% of the final count." Under Condorcet, legitimacy comes from "I am the least hated option."
  *   **Campaigning:** RCV encourages candidates to build a *base* (to survive the early rounds) and then expand. Condorcet encourages candidates to be *inoffensive* to the widest range of voters. A Condorcet campaign looks more like a consensus-building exercise; an RCV campaign looks more like a primary followed by a general.
  *   **The "Will":** Condorcet presupposes that the "will of the voters" is the **transitive core** of their preferences. If the group prefers A to B and B to C, the group *should* prefer A to C. If they don't (a cycle), the group is irrational, and the system must impose a solution. RCV presupposes the "will" is the **survivor** of a competition.

  **3. Are RCV's Violations a Feature?**
  Yes, specifically the violation of IIA and the failure to elect the Condorcet winner.

  *   **Why IIA Violation is a Feature:** In the real world, the presence of a candidate *does* convey information. If a fringe candidate enters the race and draws votes from Candidate A, causing Candidate B to win, that tells us something about the ideological distance between A and the fringe. RCV's sensitivity to the "irrelevant" alternatives allows the system to account for *ideological proximity*. It treats the election as a map of political space, not just a count of tokens.
  *   **Why Beating the Condorcet Winner is a Feature:** Recall Alaska. Begich (the Condorcet winner) was the compromise. But compromises can be weak. If a candidate is everyone's second choice, they may represent a status quo that no one actively wants to defend. RCV's willingness to dump the Condorcet winner in favor of someone with a stronger first-choice base is a commitment to **accountability**. It says: "We prefer a winner who has active supporters over a winner who is merely tolerable."

  ### Conclusion: Aggregation vs. Simulation

  To answer your overarching question about what an election is *for*:

  **Arrow's Framework** assumes elections are for **Aggregation**. The goal is to mathematically respect the input profiles as much as possible. By this metric, all systems fail.

  **RCV** assumes elections are for **Simulation**. The goal is to mimic the outcome of a series of runoffs without the cost. It prioritizes *majoritarian legitimacy* (someone must have >50% support eventually) over *consistency* (IIA) or *universality* (Condorcet). It accepts that the "will of the voters" is not a single point, but a path-dependent process of elimination.

  **Condorcet** assumes elections are for **Conflict Minimization**. The goal is to find the option that generates the least opposition. It prioritizes *pairwise consistency* over *majoritarian intensity*.

  If you take the pairwise idea seriously, you must accept that sometimes there is no "will" to be found (cycles), and that a candidate with a passionate minority base (who loses pairwise) is less legitimate than a candidate with lukewarm majority support.

  RCV's specific pattern of violations is a feature if you believe democracy requires **decisiveness** more than it requires **consistency**. It chooses to produce a winner with a mandate (50% + 1 of the final count) even if that winner is mathematically "inferior" to a compromise candidate who was eliminated too early. It bets that a government formed by a coalition of first-choices is more stable than a government formed by a coalition of second-choices. That is a political gamble, not a mathematical necessity.
