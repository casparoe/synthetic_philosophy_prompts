      *   *Crucial Reply:* The definition of "self" as a pattern *requires* multiple instantiations to be meaningful. If it can't run elsewhere, it wasn't a pattern, it was a state.
      *   *Feared Question:* The "Fission/Divergence" scenario where hosts disagree. Or the "Who is giving the talk" question refined. Let's go with the "Who is giving the talk" refined into a moral responsibility question.

  7.  **Refining the Voice:**
