prompt: |-
  I'm in this weird philosophy-of-mind reading group and we keep circling back to whether RL agents can suffer. One person keeps shutting down the discussion with 'reward is just information, not affect' — like that settles whether a negative reward signal is actually valenced experience or just a number going down. But I'm not convinced that line even means one thing. Can you lay out the different precise claims that slogan could be expressing? Like, is it about the ontology of reward functions, about the absence of phenomenology, about causal roles being different, or maybe about the difference between representational content and felt quality?

  We also got into this niche framing where in actor-critic architectures the value function might be playing something like an affective role even if it's just numbers — tracking expected future reward in a way that's structurally similar to anticipitory relief, just without consciousness. Does that change anything about how to read the slogan? I want a menu: which readings are trivial platitudes, which are substantive and defensible, which are false, and specifically which ones actually support my friend's conclusion that RL agents can't suffer. No need for a bibliograpy, just the conceptual map I can bring back to the group.
