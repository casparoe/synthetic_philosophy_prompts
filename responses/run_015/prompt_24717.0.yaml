answer: |-
  The difficulty you have identified is a central problem in moral philosophy and decision theory, specifically within the literature on **Infinite Ethics**. The most precise established term for the specific phenomenon you describe—the inability to rank actions because they all yield infinite expected value—is **Infinitarian Paralysis**.

  This problem arises within the broader **Problem of Infinite Ethics**, most famously formalized by Nick Bostrom in his 2011 paper *"Infinite Ethics."*

  Here is a precise breakdown of the phenomenon, how it differs from related problems, and an evaluation of the proposed solutions.

  ### 1. The Phenomenon: Infinitarian Paralysis

  **The Mechanism**
  Standard Expected Utility Theory (EUT) operates on real numbers. It ranks actions by comparing their expected utilities ($EU$).
  $$EU(Action) = \sum (Probability \times Value)$$

  If the value of the far future is literally infinite ($\infty$), and an action has any non-zero probability ($p > 0$) of securing or improving that future, the calculation becomes:
  $$EU(Action) = p \times \infty = \infty$$

  In standard arithmetic, $\infty = \infty$. Therefore, Action A (reducing existential risk by 0.01%) and Action B (improving governance by 0.01%) both have an expected utility of $\infty$. The theory loses its **ordinal ranking power**. It cannot tell you which action is better, nor can it tell you if one action is better than doing nothing (if doing nothing also leaves a non-zero probability of an infinite future).

  This is **Infinitarian Paralysis**: the decision procedure grinds to a halt because the metric used to measure value has maxed out for every available option.

  **Why it fits your description**
  You noted that the feature making the future dominant (its size) makes the consideration too coarse to discriminate. This is exactly the paralysis: the "signal" of the infinite value swamps the "noise" of the probability differences, rendering the probabilities irrelevant.

  ### 2. Distinctions from Related Problems

  It is crucial to distinguish this from two other problems you hinted at, as they are often conflated in Longtermist discourse.

  **A. Vs. Pascal's Mugging (The Finite Case)**
  *   **The Problem:** Pascal's Mugging involves *finite* but astronomically large numbers (e.g., $10^{10^{100}}$ utility).
  *   **The Difference:** In Pascal's Mugging, the math *still works*. $0.0001 \times 10^{100}$ is strictly greater than $0.0002 \times 10^{50}$. Expected Utility Theory can still rank the actions.
  *   **The Objection:** The objection is psychological or epistemic (it feels absurd to trust such tiny probabilities), not mathematical.
  *   **Your Case:** You specified "literally unbounded" and "unlimited amount." This implies actual infinity, where the math *breaks*, not just feels counterintuitive. Infinitarian Paralysis is a formal failure of the decision theory, whereas Pascal's Mugging is a challenge to our priors or utility functions.

  **B. Vs. Fanaticism**
  *   **The Problem:** "Fanaticism" is the label for the *normative conclusion* that we should prioritize tiny-probability, huge-stakes outcomes over certain, modest gains.
  *   **The Difference:** Fanaticism is a problem of *implication* (it tells you to do something that seems wrong). Infinitarian Paralysis is a problem of *indeterminacy* (it tells you nothing at all).
  *   **Relation:** Many Longtermists try to avoid Infinitarian Paralysis by assuming the future is merely *very large* (finite) rather than *infinite*. This avoids paralysis but exposes them to the charge of Fanaticism.

  **C. Vs. Incommensurability**
  *   **The Problem:** Incommensurability suggests two values cannot be compared because they are of different *kinds* (e.g., justice vs. happiness).
  *   **The Difference:** In Infinitarian Paralysis, the values are of the *same kind* (utility/well-being), but the magnitude is too large for the number system to handle. It is a quantitative overflow, not a qualitative mismatch.

  ### 3. Proposed Ways Out and Their Efficacy

  Philosophers and decision theorists have proposed several ways to resolve Infinitarian Paralysis. As you suspected, most tend to relocate the difficulty rather than fully defuse it.

  **1. Finitism (Deny the Infinity)**
  *   **The Move:** Assert that the universe (and thus the future) is physically finite. There is a maximum number of people or moments of experience.
  *   **Does it work?** It solves the math ($\infty$ disappears).
  *   **The Relocation:** It relocates the problem to cosmology and metaphysics. If there is a non-zero probability that the universe is infinite (e.g., via eternal inflation or a multiverse), the expected value returns to infinity. You must assign *zero* probability to an infinite universe, which is epistemically difficult to justify.

  **2. Temporal Discounting**
  *   **The Move:** Apply a discount rate to future value. Value decreases exponentially with time. Even an infinite future sums to a finite present value (like a geometric series).
  *   **Does it work?** Mathematically, yes. It restores discriminability.
  *   **The Relocation:** It relocates the problem to normative ethics. Pure time discounting is widely considered ethically indefensible (why does a person's suffering matter less simply because they are born later?). It solves the math by violating moral intuition.

  **3. Hyperreals and Surreal Numbers**
  *   **The Move:** Replace standard real numbers with a number system that can distinguish between different sizes of infinity (e.g., $\infty + 1 > \infty$).
  *   **Does it work?** It restores mathematical discrimination.
  *   **The Relocation:** It relocates the problem to the interpretation of the math. There is no consensus on *which* transfinite number system maps to moral value. Furthermore, it introduces "infinite arbitrage" problems where actions can be ranked in ways that violate dominance principles (e.g., preferring a world where everyone is slightly worse off but the "infinity type" is higher).

  **4. The "Difference-Making" Approach (Bostrom's Proposal)**
  *   **The Move:** Instead of evaluating the *total* value of the universe, evaluate the *difference* your action makes relative to a baseline. If the background universe is infinite, but your action adds a finite amount of good *on top* of that infinity, you compare the finite differences.
  *   **Does it work?** This is the most favored approach in the literature (Bostrom 2011). It allows you to say Action A is better than Action B because $+10$ utility is better than $+5$ utility, even if the background is $\infty$.
  *   **The Relocation:** It relocates the problem to **axiology** (the theory of value). It requires a specific theory of how value aggregates in an infinite universe (e.g., "Expansionism"). It also struggles with cases where the action changes the *structure* of the infinity itself (e.g., changing the probability of the universe being infinite vs. finite).

  **5. Probability Thresholds (Lexical Views)**
  *   **The Move:** Ignore probabilities below a certain threshold (e.g., treat $p < 10^{-50}$ as zero).
  *   **Does it work?** It prevents tiny probabilities from multiplying with infinity.
  *   **The Relocation:** It relocates the problem to epistemology. Where do you set the threshold? Any specific threshold seems arbitrary. If you set it too high, you ignore genuine existential risks; if too low, you are back to paralysis.

  ### Summary

  The term you are looking for is **Infinitarian Paralysis** (within the **Problem of Infinite Ethics**).

  *   **Precise Nature:** It is a formal breakdown of Expected Utility Theory when inputs include actual infinities, resulting in a loss of ordinal ranking ($\infty = \infty$).
  *   **Distinction:** Unlike Pascal's Mugging (finite but huge), the math here literally fails. Unlike Fanaticism (which gives a counterintuitive answer), Paralysis gives *no* answer.
  *   **Solutions:** The most robust proposed solution is the **Difference-Making** approach (comparing finite deltas against an infinite background). However, this does not fully defuse the difficulty; it relocates it from decision theory to the metaphysics of value aggregation. It requires us to accept that the *total* value of the world is unknowable/irrelevant, and only *marginal* changes matter—a significant shift in how we conceive of moral evaluation.

  If you wish to read the canonical treatment of this, Nick Bostrom's **"Infinite Ethics" (2011)** is the standard reference. For a more recent discussion on how this interacts with Longtermism specifically, see Hilary Greaves and William MacAskill's work on **"Strong Longtermism,"** where they explicitly grapple with whether to assume a finite or infinite future to avoid these paralysis problems.
