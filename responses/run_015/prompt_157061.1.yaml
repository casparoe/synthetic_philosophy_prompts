  You have walked directly into the Piccione and Rubinstein paradox, a cornerstone of decision theory with imperfect recall that has frustrated game theorists and rationalists for decades. Your derivation is mathematically sound within the framework you constructed, which means the error lies not in the arithmetic but in the normative principles you imported from perfect-recall scenarios. To resolve this, you must reject Step 1, the principle of sequential rationality or dynamic consistency. It looked innocent because in almost every decision problem we encounter, including all standard perfect-recall games, maximizing expected utility at every node given current credences is equivalent to maximizing expected utility from the start. We intuitively assume that local optimality aggregates to global optimality, but imperfect recall breaks the link between the agent at the node and the agent at the start because the agent at the node cannot condition on having reached that node without altering the probability of being there.

  The core failure is that your credences in Step 2 are not fixed facts of the world independent of your action; they are functions of the strategy you employ. When you calculate the 9/5 in Step 3, you are treating the probability of being at the first versus the second intersection as a fixed prior distribution over states, but in reality, the likelihood of being at the second intersection is causally dependent on the action you took at the first. By re-optimizing locally, you are effectively ignoring the fact that changing your continuation probability changes the very credences you are using to optimize. The 9/5 is not the expected payoff of any implementable strategy from the ex-ante perspective; it is a hallucinated value arising from double-counting the utility of the path that goes through both intersections. In your local calculation, you count the value of reaching the second intersection once as a future possibility when you are at the first, and again as a present reality when you are at the second, weighting them by probabilities that sum to one but describe overlapping branches of the same causal tree. From the ex-ante view, there is only one path through both intersections, but the self-locating view treats the experiences at each node as additive samples, inflating the value of long paths relative to short ones.

  What replaces dynamic consistency is ex-ante policy optimization, often formalized in the rationalist community as Updateless Decision Theory. You must view yourself not as a sequence of temporal slices making independent decisions, but as a single algorithm selecting a policy once. When you arrive at an intersection, you do not re-deliberate based on new self-locating information; you execute the plan you selected at the start because you know that any agent identical to you facing the same situation will do the same, and only the global policy determines the payoff. The cost of this rejection is that you must accept a form of rational akrasia where, at the moment of action, you knowingly choose an option that looks suboptimal by the lights of your current credences. You look at the local calculation showing 9/5 for changing to p-prime equals 1/3 and 8/5 for sticking, and you stick anyway, because you know the local calculation is leveraging a bias in the sampling of your own existence. You pay the price of ignoring the apparent evidence of your own location to preserve the integrity of the global plan.

  Regarding your re-randomizing device, it is indeed smuggling something significant, specifically the ability to play a behavioral strategy rather than a mixed strategy over pure plans. In games with imperfect recall, these are not equivalent. A single pre-departure flip that mixes between pure plans like exit always or continue always forces your actions at the two intersections to be perfectly correlated; if you exit at the first, you must exit at the second, because the plan was chosen globally. This restricts you to the convex hull of the pure plan payoffs, capping your value at 1. The re-randomizing device allows you to decouple the actions at indistinguishable nodes, enabling you to access the non-linear payoff surface where continuing at the first and exiting at the second becomes possible probabilistically. This independence is what unlocks the 4/3 ex-ante maximum, but it also creates the conditions for the dynamic inconsistency you discovered, because the independence allows the probability of reaching the second node to vary with your local choice, thereby destabilizing the self-locating credences.

  The fixed-point solution you mentioned, where plan and credence are mutually consistent yielding 32/27, is the equilibrium proposed by Piccione and Rubinstein to restore dynamic consistency, but as you noted, it sacrifices ex-ante welfare. This confirms that dynamic consistency is the luxury you cannot afford here. If you require your local actions to be optimal given your local beliefs, and your local beliefs to be accurate given your actions, you force yourself into a suboptimal equilibrium. The rational move is to prioritize the ex-ante welfare, reject the requirement that local actions must maximize conditional expected utility given self-locating credences, and commit to the policy that maximizes the unconditional expected utility from the start. The 9/5 is a siren song created by treating your presence at the intersection as evidence independent of your strategy, when it is actually the output of that strategy.
