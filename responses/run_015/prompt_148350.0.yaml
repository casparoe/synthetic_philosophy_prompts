  The reason I don't trust either of our numbers is that the naive move — destroying habitat kills animals, fewer animals means less suffering — seems basically worthless, because two complications pull against each other. One: the thing that matters isn't the standing population, it's something closer too sentience-weighted turnover. A system with high fecundity and brutal juvenile mortality is a suffering pump even if the census count at any instant is modest, so the relevant quantity is more like (births per hectare-year) × (expected suffering per life) than headcount. Two: the replacement problem. In a saturated system, if you kill individuals, density-dependent effects refill the slots within a season or two, so the deaths themselves do nearly nothing, and what actually matters is whether the conversion lowers or raises welfare-weighted carrying capacity. And that's genuinely ambiguous: a plantation is monoculture, no canopy, no top predators — but its probably got vastly more understory rodents, dung beetles and soil nematodes per hectare than the forest did, and if nematodes count for anything at all they dominate every census anyone has ever run. So the sign of the whole thing might just hinge on whether soil invertebrates have non-negligible moral weight, and on how you trade a booming population of them against the handful of primates and birds that simply don't exist in the plantation world.

