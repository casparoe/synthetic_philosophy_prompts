answer: |-
  This is a remarkably precise dissection of a stalemate that has indeed plagued evolutionary biology for forty years. Your intuition that the "policed ornament" exposes a boundary problem is correct, but the diagnosis requires separating the *mathematical reality* from the *biological intuition* that sustains the disagreement.

  Here is the diagnosis of the impasse, the verdict on the "waste" question, and the specific path to progress.

  ### 1. Diagnosis: A Category Mistake Regarding the Locus of Stability

  The dispute is **verbal in its presentation but substantive in its causal commitments.**

  It is verbal because the two camps are using the word "cost" to refer to two different ontological categories.
  *   **Camp 1 (Zahavian)** treats cost as an **intrinsic property of the signal** (metabolic energy, predation risk inherent to the trait). For them, the signal is a physical object, and its honesty is guaranteed by physics/physiology.
  *   **Camp 2 (Grafenian)** treats cost as a **relational property of the equilibrium** (the derivative of the fitness function with respect to signal intensity). For them, the signal is a strategy, and its honesty is guaranteed by game dynamics.

  It is substantive because these categories imply different evolutionary histories and stability conditions. If Camp 1 is right, a signal cannot evolve without a concurrent physiological mutation that makes it burdensome. If Camp 2 is right, a signal can evolve instantly via a change in receiver psychology (enforcement), even if the production cost is zero.

  Your "policed ornament" case breaks the deadlock because it demonstrates that **honesty can be maintained without intrinsic waste.**
  *   **Camp 1** tries to absorb this by stretching the definition of "cost" to include "risk of punishment," but this undermines their core intuition that the *signal itself* is the drain. If the drain comes from the *audience*, the ornament is not a handicap in the Zahavian sense; it is a credential verified by policing.
  *   **Camp 2** absorbs it easily: the marginal cost of faking is high (due to punishment), satisfying the differential cost condition.

  **The Verdict:** The impasse is sustained by a **boundary error**. Camp 1 draws the system boundary around the signaller's body (production costs). Camp 2 draws the system boundary around the interaction (production + enforcement costs). Because they are measuring different systems, they cannot falsify each other.

  ### 2. Is the question "Must honest signals be wasteful?" ill-posed?

  **Yes.** It is ill-posed for two reasons.

  1.  **Equilibrium vs. Out-of-Equilibrium:** In a signalling equilibrium, the *marginal* signaller is indifferent between signalling and not signalling (or signalling at level $s$ vs $s+\Delta$). However, the *average* signaller usually gains net fitness from the existence of the signalling system compared to a pooling equilibrium (no information transfer). To ask if the signal is "wasteful" conflates the *cost of production* with the *net fitness outcome*. A signal can be costly to produce but still yield a net fitness profit; calling this "waste" is a category error in economic terms.
  2.  **Source of Cost:** The question assumes cost must be "burnt" (Zahavi). But as your policed ornaments show, cost can be "threatened." A cost that is never incurred because no one dares to fake the signal (due to policing) is still a cost in the game-theoretic sense (it shapes the payoff matrix), but it is not "waste" in the metabolic sense.

  Therefore, the question should not be "Is it wasteful?" but **"What maintains the differential marginal cost condition?"**

  ### 3. What Would Count as Progress?

  You asked whether progress requires a formal result, a convention, an experiment, or a change of question. The answer is a specific combination of **Change of Question** and **Convention**, supported by a **Formal Result**.

  #### A. The Change of Question (Conceptual)
  Stop asking whether a trait is a "Handicap." The term is historically contaminated by Zahavi's "waste" intuition. Instead, ask: **"Is the signal an Index, a Handicap, or a Policed Credential?"**
  *   **Index:** Physically impossible to fake (e.g., deep voice requires large larynx). Cost is irrelevant; constraint is absolute.
  *   **Handicap (Grafenian):** Possible to fake, but differentially costly based on quality.
  *   **Policed Credential:** Possible to fake physically, but differentially costly due to social enforcement.

  This tripartite distinction forces Camp 1 to admit that "policed credentials" are not "handicaps" in their sense, and forces Camp 2 to admit that "indices" do not require cost functions at all. It dissolves the "one theory to rule them all" tension.

  #### B. The Convention (Measurement)
  The field needs a standardized convention for measuring cost that separates **Production Cost** ($C_p$) from **Enforcement Cost** ($C_e$).
  *   Current literature often sums these into a black box called "Cost."
  *   Progress requires plotting $C_p$ and $C_e$ separately against quality.
  *   **Prediction:** In Zahavian handicaps, $C_p$ correlates with quality. In Policed Credentials, $C_e$ correlates with quality (low quality individuals get punished more), while $C_p$ may be flat.

  #### C. The Formal Result (Unification)
  What is needed is a formal proof showing that **Enforcement Costs enter the Hamiltonian identically to Metabolic Costs.**
  If a modeller can demonstrate that a term for "probability of punishment $\times$ severity of punishment" functions mathematically identically to "metabolic expenditure" in the stability condition of the signalling equilibrium, it validates Camp 2's broadness while clarifying Camp 1's specificity. It would show that Zahavi's "waste" is a *sufficient* condition for honesty, but not a *necessary* one, whereas Grafen's differential cost is the *necessary* condition.

  #### D. The Experiment (Crucial Test)
  You suggested holding receiver response fixed while varying production cost. This is difficult because receiver response is co-adapted. A more viable manipulation is **holding production cost fixed while varying enforcement.**
  *   **Setup:** A population with a cheap signal (e.g., a wearable badge in a human experiment or a manipulable trait in a model organism).
  *   **Manipulation:** Vary the willingness of receivers to punish low-quality signallers wearing the badge.
  *   **Outcome:** If honesty persists when production cost is zero but enforcement is high, Camp 1's "waste" hypothesis is falsified. If honesty collapses when enforcement is removed (even if production is costly), it shows that cost alone is insufficient without the differential structure.

  ### 4. Should Progress Be Expected?

  **Yes, but not by convincing Camp 1.**

  You should not expect Camp 1 (the "waste" intuitives) to shift their position based on logic alone. Their position is often rooted in a specific biological aesthetic: the idea that nature is harsh and signals must be "paid for" in blood or energy to be real. This is a normative commitment disguised as an empirical one.

  However, progress is possible by **marginalizing the question.**
  As the "policed ornament" cases accumulate (especially in human anthropology, where social enforcement is dominant), the "waste" interpretation will become increasingly untenable for explaining the data. The field will likely move toward the Grafenian view not because Camp 1 surrenders, but because the next generation of researchers will adopt the more general mathematical framework as the default, treating Zahavi's "waste" as a specific historical subtype of cost rather than the definition of the mechanism.

  **Summary Recommendation for your Reading Group:**
  Propose that the group stop debating "Is this a handicap?" and start coding papers by **Locus of Cost**: *Intrinsic (Metabolic/Predation)* vs. *Extrinsic (Social/Enforcement)*. Map the literature onto this grid. You will likely find that Camp 1's cases cluster in Intrinsic, Camp 2's cases span both, and the "policed" cases you raise fall exclusively in Extrinsic. This visualizes the boundary error and makes the verbal dispute empirically tractable.
