      *   **Camp 2 (Grafen/Game-Theoretic):** Focuses on *marginal differential* cost. The cost function $C(q, s)$ must satisfy $\frac{\partial C}{\partial s}$ being higher for low quality $q$. Net fitness can be positive. "Waste" is not strictly required by the math, only differential cost.
