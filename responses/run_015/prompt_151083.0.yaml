answer: |-
  You have hit on one of the most persistent and genuine stalemates in the philosophy of biology. Your intuition is sharp: this isn't just about biology; it's about what kind of *explanation* satisfies us.

  Here is the honest diagnosis you asked for, stripped of the academic politeness.

  ### 1. The Core Diagnosis: It is a "Verbal" Dispute with Real Teeth
  The debate is technically **verbal**, but not in the trivial sense. It is verbal because both sides are trying to pack too much work into the single word "function."

  *   **The Etiological/Selected-Effects (SE) Camp (History):** They want "function" to explain **normativity**. Why is a diseased heart *broken*? Why is a bomb-sniffing dog's nose "working" but a rock is not? They need history to establish a standard of correctness. Without history, a heart is just a muscle contracting; there is no "ought."
  *   **The Causal-Role (CR) Camp (Snapshot):** They want "function" to explain **capacity**. How does the system work *now*? If a mutant heart pumps blood differently but keeps the organism alive, the physiologist needs to call that a function to explain the survival. They don't care about the "ought"; they care about the "is."

  **The Stall:** The debate hasn't been won because biology *needs both*. Evolutionary biologists cannot talk about adaptation without SE (History). Physiologists cannot talk about mechanisms without CR (Snapshot).

  If you force them to pick one winner, you break half of biology. If you say "both are right," you haven't solved the definition, you've just admitted there are two different concepts hiding under one word.

  ### 2. Your Theory: Narrative vs. Snapshot
  You are largely correct. The SE camp (History) is smuggling in a preference for **teleology without a god**. They want the universe to have a "plot." The heart exists *in order to* pump blood. This requires a backstory (natural selection) to ground that purpose.

  The CR camp (Snapshot) is smuggling in a preference for **materialist realism**. They are uncomfortable with "purpose" derived from the past. To them, the heart pumps blood because of pressure differentials and muscle contraction *right now*. The past is ghostly; the mechanism is real.

  **Is it aesthetic?** Yes. But in science, aesthetic preferences often dictate which questions get asked.
  *   The **Historian** asks: "Why is this trait here?"
  *   The **Mechanic** asks: "What is this trait doing?"

  ### 3. Is there a Hidden Empirical Dispute?
  There is a faint empirical shadow, but it's not about the heart. It's about **individuation** (how we cut up the world).

  *   **The SE Problem:** If function depends on history, what happens with **exaptations**? Feathers likely evolved for warmth, then were used for flight. Did flight become a "function" instantly? SE says no, not until selection acted on it. This feels counter-intuitive to biologists watching a bird fly.
  *   **The CR Problem:** If function depends on current effect, what happens with **disease**? If a kidney is failing but still filtering 10% of blood, is filtering its function? CR says yes. SE says no, because it's failing the historical standard. This makes it hard to define "health."

  **The Needle Mover:** The only thing that could "solve" this is if we discovered that biological systems don't actually have discrete boundaries. If "the organism" is just a fuzzy cloud of processes (which some systems biologists argue), then "function" dissolves entirely. But that's a nihilistic solution, not a winning one.

  ### 4. Why No Progress is Expected (The "Pragmatic Pluralism" Trap)
  Don't expect this debate to end in your character's lifetime, because the field has quietly moved to **Pragmatic Pluralism**.

  Most working biologists don't care about the definition. They use "function" contextually.
  *   Writing a paper on evolution? Function = History.
  *   Writing a paper on physiology? Function = Causal Role.

  Philosophers hate this because it's messy. Biologists love it because it works. The debate persists in philosophy departments because philosophers crave unity, but the "stall" in the science itself is actually a feature, not a bug. The tension between *where we came from* and *what we are* is the engine of biological inquiry.

  ### 5. Advice for the Novel
  This is fantastic material for character conflict because it's not just semantics; it changes how they see the world.

  **Character A (The Historian / SE):**
  *   **Worldview:** Things have a "right way" to be.
  *   **Conflict:** She might struggle with genetic engineering or mutations. If you edit a gene, does it have a "function"? She might view a prosthetic heart as "functionless" in the strict sense because it has no evolutionary history, even if it keeps the patient alive.
  *   **Flaw:** She can be rigid. She might dismiss a beneficial mutation as "noise" because it lacks backstory.

  **Character B (The Mechanic / CR):**
  *   **Worldview:** Things are what they do. Survival is the only metric.
  *   **Conflict:** She might be more comfortable with transhumanism or synthetic biology. If it pumps, it's a heart.
  *   **Flaw:** She might lack a sense of "brokenness." If a behavior is harmful but currently "working" for a pathogen, she might struggle to call it a malfunction, which can make her seem cold or amoral.

  **The Dramatic Hook:**
  The fight shouldn't be about definitions; it should be about a **specific case**.
  *   *Scenario:* A patient has a rare mutation. The heart beats irregularly but keeps them alive longer than a "normal" heart would in their specific environment.
  *   *Sister 1:* "That's a malfunction. It's not doing what hearts were selected for."
  *   *Sister 2:* "It's functioning perfectly for *this* body. Your 'selected for' is a ghost story."
  *   *The Stakes:* Does the patient get treatment to "fix" it to the historical norm, or is the "malfunction" actually an adaptation?

  ### Summary
  The debate is stuck because it is trying to unify **History** (narrative) and **Mechanism** (physics) under one label. It won't be resolved by an experiment. It will only be resolved by admitting we need two words.

  For your novel, the tragedy (or comedy) is that both sisters are right, but they are speaking different languages. The one who realizes that first wins the argument, or perhaps, realizes the argument was never real.
