answer: |-
  Here's the sketch. Imagine we're sitting in a café, I've got a pen, and I'm drawing this out on a napkin for you.

  ### The Core "Felt Moment"
  You want them to *feel* the heterogeneity problem? It happens at minute 75.

  They've spent an hour haggling over percentages. They think they're done. Then you slide the **"Budget Release Form"** across the table. It has one box at the bottom: **"Definition of Fundable Experience."** The rule is: *Every person must sign this definition. If the definition relies on specific content (e.g., "sensations," "goals met"), the Auditor vetoes it. If the definition is too vague (e.g., "stuff we like"), the Pluralist vetoes it.*

  The moment the marker hovers over that paper, and twelve philosophy majors realize they cannot agree on what the word "pleasure" actually *denotes* across six radically different experiences without contradicting themselves—that's the heterogeneity problem. It's not an argument anymore; it's a bureaucratic deadlock.

  ---

  ### The Setup: "The Aethelgard Mental Health Grant"
  **Room:** Push tables into one large rectangle. 12 chairs. Whiteboard at one end.
  **Materials:**
  *   12 Name Tags (pre-assigned roles).
  *   12 Role Cards (face down).
  *   6 "Experience Cards" (laminated, placed in center).
  *   1 "Budget Allocation Sheet" (large poster paper).
  *   1 "Budget Release Form" (kept by you until Minute 60).
  *   Markers.

  **The Experience Cards (The Mix):**
  1.  **The Sugar Rush:** The 5-minute physical sensation of eating a perfect pastry.
  2.  **The Insight:** The sudden "click" of catching a logical fallacy in real-time.
  3.  **The Glow:** The warm feeling of being thanked by a stranger.
  4.  **The High Ground:** The cold satisfaction of knowing you were right and someone else was wrong (Moral Superiority).
  5.  **The Flow:** Losing track of time while coding or painting.
  6.  **The Catharsis:** Crying at a sad movie and feeling relieved afterward.

  ---

  ### The Role Cards (Specific Commitments)
  *Do not use philosophical labels. Use bureaucratic language.*

  **Type A: The Efficiency Auditors (4 Students)**
  *   **Goal:** Maximize Total City Happiness Units (CHUs).
  *   **Instruction:** All experiences are comparable. If the Pastry gives 10 units of intensity and the Insight gives 5, fund the Pastry. You believe everything can be converted into a single numerical score based on Intensity × Duration.
  *   **Secret Power:** You control the calculator. You push for concrete numbers.

  **Type B: The Quality Guardians (4 Students)**
  *   **Goal:** Protect "Higher Order" Experiences.
  *   **Instruction:** Some experiences are inherently more valuable, regardless of intensity. The Insight and The Flow are "Tier 1." The Sugar Rush is "Tier 3." You refuse to trade a Tier 1 for any amount of Tier 3.
  *   **Secret Power:** You have a "Veto Token." If a Tier 1 experience gets <15% of the budget, you can freeze negotiations for 5 minutes.

  **Type C: The Phenomenological Skeptics (4 Students)**
  *   **Goal:** Ensure Accurate Categorization.
  *   **Instruction:** You suspect these items are not the same *kind* of thing. You are tasked with verifying the "Common Feature" for the grant. You cannot sign off on any definition that claims "The Sugar Rush" and "The Insight" share the same essential property.
  *   **Secret Power:** You hold the pen for the "Budget Release Form." You decide if the definition is precise enough to sign.

  ---

  ### The Timeline (90 Minutes)

  **00:00 – 00:10: The Briefing**
  *   Welcome them to the "Aethelgard Municipal Hedonic Allocation Committee."
  *   **Story:** The city has a surplus. We must fund mental health sectors.
  *   **Task:** Allocate 100% of the budget across the 6 Experience Cards.
  *   **Hand out Role Cards.** Tell them: "Read this silently. This is your mandate. Do not reveal your specific instructions, but argue for your position."

  **00:10 – 00:20: Role Prep & Table Talk**
  *   Let them read. They will look confused. Good.
  *   Ask them to introduce themselves by their *goal* (e.g., "I'm here to maximize units," not "I'm a hedonist").
  *   **Facilitator Note:** Walk around. If the Efficiency Auditors start talking too much, whisper to a Skeptic: "Make sure you check the definitions."

  **00:20 – 01:00: The Negotiation (The Trap)**
  *   They will start ranking.
  *   **The Conflict:** Efficiency Auditors will try to assign numbers (e.g., "Pastry = 8/10"). Quality Guardians will block ("No, Insight is sacred").
  *   **The Ethical Spike:** When they hit "The High Ground" (Moral Superiority), chaos ensues. Is this a pleasure? Should it be funded? Efficiency Auditors say "If it feels good, yes." Guardians say "It's vicious." Skeptics say "Is it even a pleasure?"
  *   **Facilitator Intervention (If Quants Dominate):** If the Efficiency Auditors steamroll the room by minute 30, step in as the "City Mayor." Announce: *"We are hearing a lot about numbers, but the Legal Department requires a unified definition of what we are funding. Keep that in mind."* This primes the Skeptics without giving it away.

  **01:00 – 01:15: The Release Form (The Squeeze)**
  *   **Reveal:** Hand out the **"Budget Release Form."**
  *   **Read the Rule:** "To unlock funds, the Committee must agree on ONE descriptive feature common to all six funded items. It cannot reference the specific content (e.g., you cannot say 'mental states'). All 12 members must sign."
  *   **The Struggle:** They will try "Positive Valence." Skeptics will say: "Does crying at a movie have positive valence? Does catching a fallacy feel 'positive' in the same way sugar does?"
  *   They will try "Desire Satisfaction." Guardians will say: "I don't *desire* the Sugar Rush, it's just good."
  *   They will try "Feels Good." Skeptics will veto: "That's a placeholder, not a description."
  *   **Watch the clock.** Let them sweat for 10 minutes. If they haven't signed by Minute 70, announce: "Budget is at risk of collapse."

  **01:15 – 01:30: The Debrief (The Release)**
  *   Stop the game. Ask: "Did you fund the budget?" (Likely no, or barely).
  *   **Now you can use the jargon.**
  *   **Map the roles:** Efficiency = Bentham/Quantitative Hedonism. Guardians = Mill/Qualitative Pluralism. Skeptics = Wittgenstein/Moore/Heterogeneity Problem.
  *   **Ask:** "Why was 'The High Ground' so hard to place?" (Bad pleasures/Value pluralism).
  *   **Ask:** "Why did the definition fail?" (Because 'pleasure' isn't a natural kind with one feature; it's a family resemblance).

  ---

  ### Facilitator Cheat Sheet: Handling the "Quant Domination"
  You predicted the Efficiency Auditors (Quants) will take over. Here's how to stop it without breaking the game:

  1.  **The "Incommensurability" Nudge:** When an Auditor says, "Okay, Pastry is 10 units, Insight is 5 units," interrupt gently: "Auditor, can you explain *how* you measured the Insight in the same currency as the Pastry? The Skeptics are taking notes." This forces them to defend the metric, slowing them down.
  2.  **Empower the Guardians:** Remind the Guardians privately (via a passed note) that their Veto Token is valid *if* the budget for Tier 1 drops. They need to use it early to set a precedent.
  3.  **The "Moral Superiority" Poison Pill:** If the Quants try to fund "The High Ground" because it's "high intensity," let the Guardians scream. This creates a value conflict that numbers can't solve. It fractures the Quant alliance (some will feel uneasy funding spite).

  ### Honest Note: What This Activity Can't Reproduce
  **The Phenomenology.**
  This activity simulates the *classification* problem, not the *experience* problem. The students aren't actually feeling the pleasure of catching a fallacy vs. eating cake. They are talking *about* them.
  *   **What you need to supply verbally:** In the debrief, you have to remind them: "Imagine the actual feeling. The tightness in your chest when you're right vs. the taste of sugar. The activity made you argue about labels, but the real problem is that the *raw feel* is different. No amount of budgeting changes the fact that those two feelings don't share a common 'glue'."

  ### Prediction: What Will Go Wrong
  **The "Positive Valence" Loophole.**
  Students are smart. Within 5 minutes of the Release Form phase, someone will suggest: "We all agree these are 'Positively Valenced Mental States'."
  *   **The Risk:** The Skeptics might cave and sign it.
  *   **The Fix:** You (the Facilitator) act as the "Legal Department." If they propose "Positive Valence," you reject it. "Does 'valence' apply to the 'Flow' state where you lose self-awareness? Does it apply to 'Catharsis' which involves sadness? Define 'Valence' without referencing 'feeling good'."
  *   **Why:** This forces them back into the heterogeneity trap. If they can't define valence without referencing the feeling, they fail the "no specific content" rule.

  ### Napkin Summary
  1.  **Hook:** Bureaucracy game.
  2.  **Conflict:** Numbers vs. Quality vs. Definition.
  3.  **Climax:** The Signature Sheet (Minute 75).
  4.  **Resolution:** Debrief the failure to define.
  5.  **Tone:** Keep it light. When they get stuck on the definition, smile and say, "Welcome to philosophy."

  Go run it. If the budget collapses, you've succeeded.
