answer: |-
  **Preparation Sheet: Units of Selection & Lagged Niche Construction**

  **To:** The Speaker
  **From:** Your Prep Assistant
  **Subject:** Q&A Strategy for the Reading Group

  You have a strong empirical hook—the terraces—but your philosophical framework is vulnerable to being dismissed as semantic splitting. Your audience is small enough that you cannot hide behind generalities; they will know your birds. The strategy below is to anchor your tripartition in the *time-lag* of the terraces. If you treat the three questions as merely conceptual, you will lose. If you treat them as empirically decoupled *only* in cases of lagged niche construction, you hold the high ground.

  ### Early Concessions
  *Make these in your opening remarks or the first minute of Q&A. Do not wait to be cornered.*

  1.  **Concede that the tripartition is not new in principle.** Philosophers have distinguished causal roles from beneficiaries before. Your claim is not that the distinction is novel, but that biology usually ignores it because the answers *usually* coincide.
  2.  **Concede that the Price equation partitions variance correctly.** Do not fight the maths. Your point is that the maths does not tell you which partition corresponds to the *cause* versus the *bookkeeping* in a lagged system.
  3.  **Concede that 'extended phenotype' captures the *construction* but not the *temporal lag*.** This is your crucial wedge. Dawkins explains how genes build terraces; he does not explicitly model selection pressures generated by *dead* builders acting on *living* builders with different alleles.

  ---

  ### The Objections

  **1. The Gene's-Eye Partisan**
  *The Objection:* 'You are reinventing the wheel. The terrace is an extended phenotype. The genes that built the terrace are the units of selection because they are the ones replicated, even if there is a time lag. The environment doesn't select; it merely filters. The gene is still the only thing that persists.'
  *Your Reply:* 'The extended phenotype explains how the terrace got there, not how it acts as a selective filter now. If the terrace persists for three generations, the genes that built it are largely gone. The selection pressure comes from a structure built by ancestors with different allele frequencies acting on descendants with new frequencies. The "filter" has a memory that the "gene" does not fully capture in a single generation. I am not denying the gene replicates; I am saying the *cause* of the fitness difference is a historical artefact, not a current gene frequency.'
  *Soft Spot:* You risk sounding like you deny genetic inheritance. Be careful not to imply the terrace replicates itself biologically.
  *Confidence:* **High.** This is the most predictable attack, and your lag argument is the specific counter.

  **2. The Doctoral Students (Price Equation)**
  *The Objection:* 'But the Price equation already separates the covariance of the group from the covariance of the individual. If you just expand the terms, the "lag" is just a covariance between the terrace trait and fitness. Why do we need three questions when the equation gives us the exact contribution of each variable?'
  *Your Reply:* 'The equation tells you how much variance is accounted for, not what the variables *are*. You can plug "terrace height" into the equation, but the equation won't tell you if terrace height is a cause of fitness, a bookkeeping label for the birds' genes, or a benefit to the colony. In a lagged system, the variable "terrace" refers to past agents, while the variable "fitness" refers to current agents. The maths sums the change; it doesn't identify the agent of the change.'
  *Soft Spot:* Students love formalism. You must insist that formalism without ontology is blind, without sounding anti-maths.
  *Confidence:* **High.** Students often mistake decomposition for explanation.

  **3. The Causal Modeller (Philosopher)**
  *The Objection:* 'You say "the terrace did the selecting". Is that a causal claim? If I intervene on the terrace, fitness changes. But if I intervene on the soil chemistry, does that count as the terrace? Or is this just a variance decomposition with a causal gloss? Where is the counterfactual?'
  *Your Reply:* 'It is a causal claim, but a historical one. The counterfactual is: if the previous generation had not built the terrace, the current generation's fitness distribution would differ, independent of the current generation's genotype. The terrace is a stable causal variable that mediates selection across time slices. It is not merely a gloss; it is a physical structure that constrains development and survival.'
  *Soft Spot:* Philosophers will pounce on "mediates". Ensure you define the terrace as a physical constraint, not an abstract variable.
  *Confidence:* **Medium.** This depends on how strictly they define "cause".

  **4. The Multi-Level Selectionist**
  *The Objection:* 'This sounds like group selection by another name. The terrace is a group-level trait. The "lag" is just group-level inheritance. Why split hairs about "questions" when we can just say the group is the unit and the terrace is its phenotype?'
  *Your Reply:* 'Because the group changes composition faster than the terrace. The "group" in decade one is not the "group" in decade two, but the terrace is the same. If you call the terrace a group trait, you imply the current group owns it. They don't; they inherited it from a different collective. My tripartition lets us say the *beneficiary* might be the current group, but the *cause* is the past group.'
  *Soft Spot:* MLS theorists are good at absorbing new levels. You must insist the *temporal* mismatch breaks the standard group definition.
  *Confidence:* **Medium.** They may simply expand their definition of "group inheritance" to swallow your case.

  **5. The Whole-Organism Biologist**
  *The Objection:* 'You are all still talking about abstract entities. Where is the bird? The bird builds the terrace to keep its feet dry. It doesn't matter if the terrace lasts thirty years; the selection is on the bird's ability to maintain it. You are erasing the physiology again.'
  *Your Reply:* 'I agree the bird is the locus of the action. But the bird's physiology is adapted to a terrace built by its grandparents. If the selection pressure comes from a structure the bird didn't build, its developmental response is mismatched to its own genes. I am trying to save the organism from being treated as a mere vehicle for genes by showing the environment has agency too.'
  *Soft Spot:* You risk sounding like you grant agency to dirt. Stick to "physical constraint".
  *Confidence:* **High.** This ally is close to your position; they just want the animal centred.

  **6. The Historian of Science**
  *The Objection:* 'This sounds like a verbal dispute. If the gene camp says "gene", the MLS camp says "group", and you say "index to the question", aren't you all just describing the same covariance differently? Why should anyone care once we say everyone is right about something?'
  *Your Reply:* 'Because in conservation biology, it matters. If I manage this island, do I protect the birds or the terraces? If the terraces drive selection but degrade without birds, and the birds need terraces but don't build them fast enough, a gene-centric view misses the crisis. The "verbal" distinction dictates different management interventions.'
  *Soft Spot:* You must prove the management outcome differs. If the action is the same, the historian is right.
  *Confidence:* **Medium.** Practical utility is your best shield here.

  **7. The Pragmatist (General Audience)**
  *The Objection:* 'If the three questions usually have the same answer, why complicate the simple case? Science seeks unification. You are proposing we fracture the concept of selection every time there is a lag. Isn't that a step backward?'
  *Your Reply:* 'We already fracture it when we talk of "kin selection" versus "group selection". I am proposing we stop fighting over which label is the "true" one and admit they track different things. In simple cases, you can use one label. In lagged niche construction, you cannot. I am not fracturing the concept; I am revealing the cracks that were already there.'
  *Soft Spot:* Risk of appearing to revel in complexity for its own sake.
  *Confidence:* **High.** This is a standard defence of pluralism.

  **8. The Question You Hope Nobody Asks (The Equivocation Charge)**
  *The Objection:* 'Be honest. Isn't this pluralism just equivocation with a nicer name? You say "unit" means three things so you don't have to pick one. If you can't point to a single entity that evolves, haven't you just admitted there is no unit of selection at all?'
  *Your Reply:* 'If "unit" implies a single entity that is simultaneously the replicator, the interactor, and the beneficiary, then yes, there is no unit in lagged systems. But that is a fact about the world, not a failure of my theory. I would rather have three precise answers than one vague word that forces us to ignore the time lag. I am not equivocating; I am refusing to force nature into a singular noun.'
  *Soft Spot:* This is the philosophical kill shot. If you sound defensive, you lose.
  *Confidence:* **Low.** This cuts to the core of whether your view is a solution or a dissolution.

  ---

  ### Overall Confidence & Verdict

  **Confidence in Reconstructions:**
  I am **85% confident** in the general tenor of these objections. The Gene's-Eye and Price Equation objections are standard fare for this mix of attendees. The Causal Modeller's specific focus on "variance vs cause" is a high-probability guess based on their specialism. The Historian's objection is a stereotype of the discipline, but a reliable one.

  **The "Least Sure" Claim:**
  I am least sure of the **reply to the Multi-Level Selectionist (Objection 4)**. There is a significant risk that a sophisticated MLS theorist will simply absorb "lagged terrace" into a framework of "ecological inheritance" or "constructive niche inheritance" without accepting your need for a tripartition. They may argue that the "group" extends through time just as the terrace does. Your reply assumes they define groups by current membership; if they define them by lineage or resource continuity, your wedge disappears. **I would bet against your ability to keep the MLS camp distinct from your view if they are willing to stretch their definitions.**

  **Honest Verdict on Equivocation:**
  You asked for honesty. There is a genuine risk that your pluralism is viewed as equivocation. The difference between a "deep philosophical insight" and "refusing to answer the question" is often just whether the audience finds the distinction *useful*. If the "lagged niche construction" case is rare, you will be accused of solving a non-problem. If it is common (e.g., in soil building, coral reefs, beaver dams), you are safe. **Your entire talk rests on the empirical prevalence of the lag.** If the audience believes your seabird case is an anomaly, the equivocation charge will stick. If they believe it is the rule for colonial builders, you win.

  **Final Advice:**
  Do not fight for the word "unit". It is poisoned. Fight for the *indexing*. If you can get them to agree that "Unit of Bookkeeping" and "Unit of Causation" are different labels for different jobs, you survive. If you try to convince them there is a "true" unit that is a composite of the three, you will be torn apart. Keep it pragmatic. Keep it about the birds and the dirt.
