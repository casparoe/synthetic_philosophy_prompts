prompt: |-
  Hey — I'm on a small internal working group at the housing agency where I work (I'm the policy/legal person, not the technical one; I did a philosophy minor years ago and it's showing) and we're trying to write a checklist that any vendor tool the agency buys has to satisfy before we renew the contract. One of our data science people keeps shutting down parts of that with the line "there's no such thing as a fair algorithm." She used it last week to kill a proposal that any tool scoring people above some threshold has to pass a disparity audit annually. Her argument as I understood it: the well-known impossibility results show that the standard fairness criteria are mathematically incompatible with each other whenever the groups have different base rates, so there's no fact of the matter about which one you should satisfy, so mandating an audit just amounts to arbitrarily picking one criterion and pretending it's *the* definition of fairness — and, she added, "fairness isn't free, the math says you lose accuracy," and our contract already locks the vendor into hitting a specific accuracy number.

  I'm pretty sure that doesn't follow, but I can't say where it breaks and I don't want to walk into the next meeting just repeating "surely there's *some* sense in which a tool is fairer than another." Context that might matter: the tools we buy mostly output a score that a human caseworker then uses, and the same score gets used for two different things — ranking households for a limited number of program slots, and flagging files for extra review; the outcome the model is trained to predict is something our own staff records rather than anything we observe directly; whatever we adopt replaces a human process nobody has ever audited; and the people who get flagged high are watched more closely afterwards, which feeds back into next year's data.

  So: could you lay out the different precise things "there's no such thing as a fair algorithm" might be claiming — from the readings that are basically true but trivial, through the ones that are substantive and defensible, to the ones that are radical or just false — and for each say whether it's actually true, whether it's what the impossibility math really supports or an overreading of it, and whether that reading would support her conclusion that a disparity audit would be arbitrary? Do the same for "fairness isn't free" if that's really a separate claim hiding behind the first one. A menu I can literally read out in the meeting would be perfect, ideally noting which readings I'm most likely actually facing given how she used it, and whether any of them survive the fact that our score feeds a human decision used for two different purposes.
