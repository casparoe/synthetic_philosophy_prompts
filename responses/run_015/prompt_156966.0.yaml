answer: |-
  This is a classic clash between *positive* claims (what the math says is possible) and *normative* claims (what policy requires). Your data scientist is correct about the math but incorrect about the policy implication. She is committing a category error: moving from "mathematics cannot define justice" to "policy cannot require justice."

  Given your philosophy background, you will recognize this as an is-ought problem disguised as a technical constraint.

  Here is a menu of interpretations of her claim, graded by validity, specifically tailored for your meeting. You can literally read the "Meeting Move" sections.

  ---

  ### Part 1: The Menu of "There Is No Fair Algorithm"

  #### 1. The Semantic Claim: "Fairness is a moral concept, not a mathematical one."
  *   **What it claims:** Mathematics can calculate disparity, but it cannot tell us which disparity is *unjust*. "Fairness" requires a normative judgment that code cannot hold.
  *   **Is it true?** **Yes.** This is philosophically sound. Math describes relationships; policy defines values.
  *   **Does the math support it?** Yes, but trivially. The impossibility theorems assume you are trying to satisfy *all* moral intuitions simultaneously.
  *   **Does it kill the audit?** **No.** In fact, it *requires* the audit. Since math cannot decide, **policy must decide.** An audit is simply the mechanism to check if the vendor is meeting the *policy-defined* standard of fairness.
  *   **Meeting Move:** "I agree that math doesn't define justice. That's why we are here. We are setting the policy definition. The audit just checks if the vendor meets the definition *we* chose."

  #### 2. The Impossibility Claim: "You can't satisfy all fairness metrics at once."
  *   **What it claims:** Refers to the Chouldechova (2017) and Kleinberg et al. (2016) impossibility results. If base rates differ between groups (e.g., different rates of eviction filings), you cannot simultaneously satisfy Calibration (risk scores mean the same thing for everyone) and Error Rate Balance (false positives/negatives are equal across groups).
  *   **Is it true?** **Yes, mathematically.** You generally have to trade off between metrics.
  *   **Does the math support it?** Yes, this is exactly what the theorems show.
  *   **Does it kill the audit?** **No.** It means you cannot mandate *every* metric, not that you cannot mandate *any*. It forces a prioritization, not an abdication. Saying "we can't be perfectly fair so we won't check fairness" is like saying "we can't be perfectly safe so we won't require seatbelts."
  *   **Meeting Move:** "The impossibility theorem tells us we have to make trade-offs, not that we make no choices. We need to decide which metric matters most for housing law (e.g., minimizing false positives for denial of service) and audit for that one."

  #### 3. The Measurement Claim: "The target variable is biased, so the model is biased."
  *   **What it claims:** Since your model predicts "staff records" rather than "ground truth" (e.g., actual housing stability vs. recorded housing stability), the model is learning to replicate historical staff bias.
  *   **Is it true?** **Substantively Yes.** This is the "Garbage In, Garbage Out" problem.
  *   **Does the math support it?** This isn't about impossibility theorems; it's about construct validity.
  *   **Does it kill the audit?** **No.** It makes the audit *more* urgent. If the target is biased, you need a disparity audit to ensure the tool isn't amplifying that bias beyond the human baseline it replaces.
  *   **Meeting Move:** "If the training data reflects past bias, that is exactly why we need an audit. We need to know if the tool is amplifying that bias compared to the human process it replaces."

  #### 4. The Nihilist Claim: "All prediction on protected classes is inherently unfair."
  *   **What it claims:** Using any correlate of protected status (which is almost everything) violates a strict definition of fairness (e.g., Demographic Parity).
  *   **Is it true?** **Debatable/Radical.** This depends on your legal framework (e.g., Disparate Impact vs. Disparate Treatment).
  *   **Does the math support it?** No, this is a legal/ethical stance, not a mathematical one.
  *   **Does it kill the audit?** **No.** Even if you believe this, you still need to measure the disparity to know the magnitude of the ethical cost you are incurring.
  *   **Meeting Move:** "Even if we accept that risk, we have a legal duty to measure disparate impact. We can't manage what we don't measure."

  ---

  ### Part 2: "Fairness Isn't Free" (The Accuracy Trade-off)

  Her second claim is that enforcing fairness metrics will lower accuracy, violating the contract.

  *   **What it claims:** Constraining a model to satisfy fairness metrics (like Equalized Odds) reduces the feasible set of solutions, lowering AUC or overall accuracy.
  *   **Is it true?** **Often, but not always.** There is usually a Pareto frontier trade-off. However, if the current "accurate" model is overfitting to biased noise, "fairing" it might actually improve generalization.
  *   **Does it support her conclusion?** **No.** It supports a **budgeting** conclusion, not a **prohibition** conclusion.
  *   **The Policy Counter:** "Fairness isn't free" is a cost-benefit argument. As a public agency, we may be willing to pay a 'tax' in predictive accuracy to achieve legal compliance or equity goals. The contract locks in accuracy *as currently defined*. If we add a fairness constraint, we are changing the requirements. The vendor can re-bid or re-tune.
  *   **Meeting Move:** "If there is a trade-off, that is a budget decision for the agency, not a technical blocker. We need to decide how much accuracy we are willing to sacrifice for compliance. We can't make that decision without the audit data."

  ---

  ### Part 3: The "Killer Arguments" (Specific to Your Context)

  Your specific context actually undermines her argument more than a generic one. Here are three points that leverage the details you provided.

  #### 1. The "Two-Use" Problem (Calibration vs. Parity)
  You noted the score is used for **ranking** (allocation) and **flagging** (scrutiny).
  *   **The Point:** These two uses require *different* fairness definitions.
      *   For **Allocation** (giving slots), you care about **Calibration** (a score of 80 means the same need for Group A and Group B).
      *   For **Flagging** (extra review), you care about **Error Rate Balance** (we don't want to disproportionately harass Group A with false flags).
  *   **Why it matters:** The impossibility theorem says you can't have both *if base rates differ*. But you don't need both for the *same decision*. You need to audit to ensure the tool is fit for *each specific purpose*.
  *   **Script:** "We use the score for two different legal purposes. One requires calibration, the other requires error balance. The math says we can't maximize both at once, so we absolutely need an audit to verify the vendor isn't optimizing for one while we use it for the other."

  #### 2. The Feedback Loop (Performative Prediction)
  You noted: "People who get flagged high are watched more closely... which feeds back into next year's data."
  *   **The Point:** This creates a **self-fulfilling prophecy**. If the model flags Group A, staff watch them, find more issues, record more issues, and the model learns Group A is higher risk.
  *   **Why it matters:** This violates the "i.i.d." (independent and identically distributed) assumption most models rely on. "Accuracy" here is unstable. A disparity audit is the only way to detect if the model is *creating* the disparity it claims to predict.
  *   **Script:** "Because our process creates a feedback loop, the 'accuracy' she's protecting is unstable. If the tool creates disparity through surveillance, the accuracy metric becomes meaningless. An audit is the only way to break that loop."

  #### 3. The "Human Baseline" Defense
  You noted: "Whatever we adopt replaces a human process nobody has ever audited."
  *   **The Point:** Her argument implies the status quo (humans) is the neutral baseline. It is not. Humans have unmeasured, un-audited bias.
  *   **Why it matters:** Even if the algorithm cannot be "perfectly fair" (per impossibility theorems), it can be *fairer than the human alternative*.
  *   **Script:** "We are comparing this tool to human caseworkers, not to mathematical perfection. Humans have un-audited bias. Even if the tool can't be mathematically perfect, we need to know if it's an improvement over the human process."

  ---

  ### Part 4: Summary Script for the Meeting

  If you want to close the discussion and move to a vote/action, try this:

  > "I've reviewed the literature on the impossibility theorems [cite Kleinberg/Chouldechova if you want to flex]. I agree with [Data Scientist] that there is no single mathematical definition of fairness that satisfies all intuitions simultaneously, and that there is often a trade-off with accuracy.
  >
  > However, those mathematical facts do not lead to the conclusion that we should stop auditing. They lead to the conclusion that **we must make a policy choice.**
  >
  > 1.  **On Arbitrariness:** Choosing a fairness metric isn't arbitrary if it's tied to our legal mandate (e.g., minimizing disparate impact in housing allocation). The audit checks compliance with *our* choice, not a mathematical absolute.
  > 2.  **On Accuracy:** If fairness costs accuracy, that is a cost the agency may need to bear to meet civil rights obligations. We cannot know that cost without the audit.
  > 3.  **On Context:** Because this tool feeds a feedback loop and replaces an un-audited human process, 'accuracy' is not a neutral baseline.
  >
  > My proposal is not that the tool must be 'perfectly fair.' It is that we must **measure** the disparity so we can decide if the trade-off is acceptable. I move we keep the audit requirement but specify *which* metric (e.g., Calibration for allocation, False Positive Rate for flagging) applies to which use case."

  ### One Final Note for You (The Policy Person)
  Your data scientist is protecting the **vendor** and the **model**, not the **agency**.
  *   If the model fails an audit, the vendor has a problem.
  *   If the model *causes* a civil rights violation and you never audited it, the **agency** has a problem.
  *   Her argument shifts liability from the agency (for buying the tool) to the math (for being impossible). Do not let that shift stand.

  *Disclaimer: I am an AI, not an attorney. This analysis is for internal policy strategy and should be vetted against your agency's specific legal counsel and regulatory requirements.*
