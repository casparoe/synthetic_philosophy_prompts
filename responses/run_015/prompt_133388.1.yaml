prompt: |-
  Me and my mate are having a row about whether it's wrong to clone your dead dog. He says if you loved the original you'd love the clone cos it's the same genes, like loving a photocopy of a painting. I said it's more like rebuilding your house after a fire — same address, not the same home. But then he pointed out people adopt rescue dogs all the time and love them just fine, so maybe I'm just clinging to some magical idea of 'the one true Fido'. I feel like we're both just pushing buttons with these comparisions rather than actualy arguing. How do I know if I'm being persuaded by the drama of the comparison instead of the actual point? Is there a method for checking whether a made-up scenerio is leading me astray?
