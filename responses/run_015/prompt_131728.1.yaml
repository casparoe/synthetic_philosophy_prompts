answer: |-
  The standard account of collective intentionality posits that joint action is fundamentally a matter of psychological alignment. On this view, for a group to act genuinely together, there must be a convergence of mental content: either a shared "we-intention" directed at a common goal, or a mesh of individual intentions supported by mutual belief about that mesh. The underlying assumption is that jointness is a property of the *mind* prior to being a property of the *action*. To defend the opposing position, we must invert this priority. We must argue that joint action is constituted not by the overlap of internal representations, but by the structure of practical reasoning that governs the interaction. Specifically, genuine collective intentionality arises when participants stand in a relation of **mutual practical authority**, wherein each agent treats the contributions of the others as generating binding normative constraints on their own deliberation, regardless of whether they share a conception of the final end.

  ### The Structure of Practical Reasoning vs. Mental Content

  To understand why representational convergence is unnecessary, we must distinguish between the *content* of an intention and the *structure* of the reasoning that sustains it. The standard view assumes that for two agents to act together, the object of their intention must be identical in description. However, this conflates the *outcome* of the action with the *process* of coordination.

  In genuine joint action, the defining feature is that my practical reasoning is not solipsistic. When I deliberate about what to do next, I do not treat the environment as static nor the actions of others as mere causal events to be predicted and avoided. Instead, I treat your actions as *reasons* for my own. This is the core of mutual practical authority: I recognize that you have a standing to demand coordination from me, and I acknowledge an obligation to adjust my conduct in light of yours. This normative relation creates a "we" not in the realm of mental imagery, but in the realm of justification. If I fail to coordinate, I do not merely fail causally; I wrong *you*. This normative entanglement is sufficient for jointness, even if, in our respective heads, we conceptualize the project differently.

  ### Addressing the Interdependence Objection

  A primary objection to this view mirrors the interdependence requirement found in shared cooperative activity accounts. The objection holds that without shared content, there is no genuine interdependence, only parallel individual action. If I am building a module because I envision a cathedral, and you are building a module because you envision a fortress, we are merely acting alongside one another, like ships passing in the night. Our actions might mesh causally, but they lack the right kind of intentional interlocking.

  This objection fails because it locates interdependence in the *teleology* (the end goal) rather than in the *normativity* (the binding nature of the interaction). Interdependence is not established by hoping for the same future state; it is established by the fact that my ability to proceed is normatively conditioned by your performance.

  Consider the structure of my reasoning: "I intend to do X. However, I am committed to coordinating with you. You have done Y. Therefore, I must adjust X to accommodate Y." In this syllogism, the shared content of the final product is irrelevant. What matters is the premise "I am committed to coordinating with you." If this commitment is mutual—if you also adjust your reasoning to accommodate me—then our actions are interlocked. The interdependence lies in the reciprocal constraint on our freedom of action. I cannot simply do what I want; I must do what fits with you. This restriction of autonomy is the hallmark of joint action. Whether we describe the result of this fit as a cathedral or a fortress is a matter of private interpretation that does not undo the public reality of our coordinated will.

  ### Addressing the Plural Subject Objection

  A second, more metaphysical objection arises from the joint commitment view. This position argues that joint action requires the formation of a plural subject—a unified agent constituted by a joint commitment. The objection claims that without a single shared mental content, there is no unity, and without unity, there is no subject to bear the intention. If our understandings are incommensurable, we cannot be "one body."

  This objection relies on a category mistake regarding the nature of unity in action. The unity of a joint agent need not be ontological or psychological; it can be functional and normative. We are a "plural subject" not because we share a mind, but because we are bound by a single normative framework of interaction. The "joint commitment" is not a commitment to a specific *description* of the goal, but a commitment to the *process* of sustaining the collaboration.

  When we enter into this normative relation, we create a space of reasons that is common to us, even if our private motivations for entering that space differ. The unity is found in the binding force of the obligations we incur toward one another. To say we are a "we" is to say that I owe you coordination and you owe me coordination. This reciprocal obligation creates a unified field of action. The divergence in our mental representations of the end-state does not fracture this unity any more than two people dancing the same waltz cease to be a couple because one thinks the dance is romantic while the other thinks it is athletic. The unity is in the steps, the timing, and the mutual responsiveness, not in the internal narrative regarding the dance's meaning.

  ### Accommodating Representational Divergence

  The crucial insight is that representational divergence is structurally accommodated within the normative framework of joint action because the authority relation operates at the level of *interface*, not *essence*.

  In distributed collaboration, agents often interact through defined interfaces or protocols. I provide input; you provide output. The normative requirement is that I respect the protocol and you respect the protocol. My practical authority over you is limited to the demand that you uphold your end of the coordination, and vice versa. This allows for radical divergence in how we conceptualize the totality of the project. I may view my contribution as a moral imperative; you may view yours as a technical challenge. As long as we both recognize the normative force of the other's contribution—meaning, as long as we both treat the other's work as a constraint that we are obligated to integrate rather than ignore—the joint action holds.

  Indeed, representational divergence can strengthen the normative bond. Because we do not share a mental vision, we cannot rely on mind-reading or assumed consensus. We are forced to rely explicitly on the normative structures of communication and commitment. We must explicitly signal our constraints and acknowledge the claims of others. This makes the mutual practical authority more explicit, not less. The "jointness" is not a pre-existing psychological harmony that allows us to act; it is a normative achievement maintained through the continuous recognition of each other's authority to constrain our actions.

  ### Conclusion: Acting Together vs. Acting Alongside

  The distinction between acting together and merely acting alongside one another is not drawn by the overlap of mental pictures. It is drawn by the presence or absence of mutual practical authority.

  When acting merely alongside one another, your actions are merely facts in my world. I may take them into account pragmatically (e.g., I step aside so I do not bump into you), but I do not recognize them as generating obligations. I am free to ignore your goals.

  When acting together, your actions are reasons in my deliberation. I recognize that I am not free to ignore your contribution without violating a normative standard inherent in our collaboration. This recognition constitutes the collective intentionality. It transforms a collection of "I-intentions" into a "we-action" not by merging the "I"s into a single mind, but by binding the "I"s into a single normative space.

  Therefore, a group can act jointly even when its members hold incompatible representations of their collective goal. The glue of joint action is not shared content, but shared subjection to the normative constraints of coordination. As long as each participant treats the others' contributions as generating binding constraints on their own practical reasoning, the action is genuinely joint. The divergence in understanding the end-state is a matter of private semantics; the convergence in normative authority is a matter of public action. It is the latter, not the former, that constitutes the reality of doing something together.
