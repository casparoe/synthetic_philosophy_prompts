      *   *Sentence 2:* "It copes by running a generative model that is constantly predicting what its sensory input ought to be." -> **Accurate.** Core tenet.
      *   *Sentence 3:* "Whatever is left over is prediction error, and the brain's whole job is to drive that error toward zero..." -> **Rough Gloss.** It's not *just* prediction error, it's *weighted* prediction error (precision-weighted). Also, "whole job" is strong.
      *   *Sentence 4:* "...the quantity it drives down is free energy, which is basically a measure of surprise, i.e. how far the world departs from what the brain expected." -> **Conflation/Inflation.** Free Energy is an *upper bound* on surprise. Surprise is intractable. Free Energy is the proxy. They are not "basically" the same thing mathematically, though conceptually linked.
      *   *Sentence 5:* "There are only two ways to reduce the error: change the prediction to fit the input, or change the input to fit the prediction." -> **Accurate.** Perception vs. Action.
      *   *Sentence 6:* "Perception is the first and action is the second, so action is really just making your predictions come true." -> **Rough Gloss/Controversial.** Accurate within FEP logic, but "making predictions come true" sounds teleological in a way that confuses people (addressed in User's 2nd concern).
      *   *Sentence 7:* "That is why perception is controlled hallucination: what you experience is your brain's best guess, not the world." -> **Accurate (within the framework).** Anil Seth's catchphrase.
