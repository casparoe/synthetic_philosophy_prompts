      *   *Nuance:* On Free Energy vs. Surprise. Surprise is $-\ln P(outcome)$. Free Energy is an upper bound. The brain minimizes Free Energy because it can't calculate Surprise directly. The summary says "basically a measure of surprise." That's acceptable for pop-sci but technically loose. I'll mark it as a "Yellow Light."
      *   *Nuance:* On Politics. FEP can model belief polarization (priors resisting error), but saying it explains *why* you hold specific opinions is a stretch. It explains the *mechanism* of holding them, not the content.

