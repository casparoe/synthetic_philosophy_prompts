answer: |-
  This is a sophisticated framing. Distinguishing between decay, gaming, and falsification is useful for post-mortems, but for a committee setting *ex-ante* incentives, the boundaries are perilous. Volkswagen's "Dieselgate" is the stress test your taxonomy needs.

  Here is the mapping, the critique of your categories, and the implications for your committee's work.

  ### 1. The Map

  *   **The Goal:** Two-fold. (1) Regulatory: Reduce ambient NOx to protect public health. (2) Commercial: Sell "Clean Diesel" vehicles that offer high performance and fuel economy to capture market share.
  *   **The Proxy:** The standardized laboratory emissions test cycle (FTP-75 in the US, NEDC in Europe). A specific sequence of speed, acceleration, and duration run on a dynamometer.
  *   **The Optimizing Agent:** Volkswagen Group engineering and management.
  *   **The Pressure:**
      *   *Technical:* At the time, meeting NOx limits via hardware (SCR/AdBlue) was too costly/bulky for the US passenger car market.
      *   *Commercial:* Aggressive targets to become the world's largest automaker; "Clean Diesel" was a key differentiator against hybrids.
      *   *Regulatory:* Pass the test or do not sell.

  ### 2. The Categorization: Where Your Boxes Collapse

  Your instinct is that **Proxy Gaming** is Goodhart, **Proxy Falsification** is Fraud, and **Proxy Decay** is natural drift. VW reveals why this triad is dangerous for a committee setting bonuses.

  **The VW Case: Gaming or Falsification?**
  On the surface, this looks like **Proxy Gaming**. The engineers did not forge the lab results; the cars *actually* passed the lab test. They optimized the system (the engine control unit) to maximize the metric (test pass) without achieving the goal (clean air).

  However, legally and functionally, this was **Proxy Falsification**. The "defeat device" software detected test conditions (steering wheel position, duration, speed) and switched the car into a mode that was never used in real driving. The certification documents claimed the car met standards under *all* normal operating conditions. That claim was a lie.

  **Why the distinction breaks:**
  For your committee, separating Gaming from Falsification creates a blind spot.
  1.  **Sophisticated Gaming *is* Falsification:** When agents have enough control over the measurement environment (or the thing being measured), high-intensity gaming produces the same epistemic outcome as lying. The metric loses all connection to reality.
  2.  **Incentive Equivalence:** If you tell your team, "Bonuses depend on Metric X," and they realize Metric X is impossible to achieve legitimately, they will not distinguish between "gaming the system" and "faking the number." They will simply choose the path of least resistance to the bonus.
  3.  **Decay is rarely "Nobody's Fault":** You classify Proxy Decay as the world moving and the correlation breaking structurally. In regulatory and organizational contexts, decay is often a design failure. The lab test was static; the engineering environment was dynamic. Relying on a static proxy in a dynamic system is a known risk, not an act of God.

  **Verdict:** For the purpose of designing incentives, **merge Gaming and Falsification.** Call it **Metric Corruption.** Whether the team cheats the spreadsheet or cheats the process, the result is that your funding is tied to noise. Keep Decay separate, but treat it as a design risk you own, not an external shock.

  ### 3. What Goodhart Predicts vs. What It Misses

  Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") is robust, but the VW case highlights its limitations as a predictive tool for committees.

  **What Goodhart Predicted:**
  *   **Metric Corruption:** The law correctly predicts that once the test cycle became the gatekeeper for market access (a target), it stopped measuring emissions (a measure).
  *   **Sub-optimization:** VW optimized for the test cycle at the expense of the broader goal (environmental health).

  **What Goodhart Stays Silent On (The Blind Spots):**
  *   **Latency:** Goodhart does not predict *when* the collapse happens. VW cheated for nearly a decade. A committee might assume that if a metric holds for Q1 and Q2, it is robust. Goodhart offers no warning on the half-life of a proxy.
  *   **Detection Mechanism:** Goodhart assumes the principal (regulator/committee) observes the degradation. In VW's case, the regulator (EPA) did not find the gap; outsiders (ICCT and West Virginia University) did. This highlights that **internal monitoring is often part of the gaming loop.** If the people measuring are the people being measured (or are captured by them), Goodhartian collapse is invisible.
  *   **The "Unpublished Target" Remedy:** A common Goodhart mitigation is to keep metrics secret or varied so agents cannot optimize specifically against them.
      *   *In Regulation:* This is impossible. Laws must be public.
      *   *In Your Committee:* This **is** possible. You can withhold the exact weighting of KPIs or introduce random audits. VW shows that when the "test" is known perfectly in advance, optimization is inevitable.

  ### 4. Epistemic Claim vs. Incentive Claim

  This is the crux of your committee's strategy.

  **The Incentive Claim:** Goodhart is about what incentives *do to agents*. (They cheat).
  **The Epistemic Claim:** Goodhart is about what optimization *does to information*. (The signal-to-noise ratio drops).

  **The VW Evidence:**
  The episode supports reading Goodhart primarily as an **Epistemic Claim driven by Incentives.**
  *   If you view it only as an *Incentive* problem, your solution is compliance, policing, and ethics training (catch the cheaters).
  *   If you view it as an *Epistemic* problem, your solution is metric design (fix the measure).

  VW proves that even with policing (the EPA existed), the epistemic value of the metric collapsed because the *structure* of the measurement allowed it. The engineers didn't just lie; they exploited the informational gap between the lab and the road.

  **Implication for your Committee:**
  Do not just ask, "Will this bonus tempt people to lie?" (Incentive).
  Ask, "If everyone optimizes perfectly for this number, does it still correlate with the outcome we want?" (Epistemic).

  In VW's case, the answer was no. You can optimize perfectly for the FTP-75 test cycle and produce a car that poisons the air. If your KPIs allow for a scenario where "Perfect Score = Bad Outcome," you have built a defeat device into your budget.

  ### 5. Recommendations for Your Framework

  Based on this stress test, I suggest three adjustments to your taxonomy and approach:

  1.  **Collapse Gaming and Falsification into "Metric Corruption."**
      For *prevention*, the distinction is irrelevant. Both result in funding being allocated based on false premises. Treat any optimization that decouples the metric from the goal as a failure of the metric, not just the agent.

  2.  **Treat "Decay" as a Design Flaw.**
      Do not classify Proxy Decay as "nobody's fault." If your proxy decays because the environment changed, your risk management failed. Build "metric expiration dates" or mandatory review cycles into your funding model. Assume every KPI has a half-life.

  3.  **Adopt the "Outsider Test."**
      Goodhart assumes the regulator sees the breakdown. VW shows they won't.
      *   *Action:* Commission independent verification of your key numbers. If you fund based on sales data, have audit verify the pipeline. If you fund based on project completion, have a technical peer review the "completed" work.
      *   *Action:* Use **unpublished weights**. Tell the team the top 3 goals, but not the exact formula. This prevents the precise "defeat device" optimization VW used, where engineers tuned the car specifically for the known test cycle.

  **Summary:**
  Volkswagen did not just game a metric; they broke the epistemic link between the test and the truth. Goodhart's Law explains *why* the link broke (pressure), but not *how long* it took or *who* would notice. For your committee, the lesson is not merely to watch for cheaters, but to assume that any metric tied to significant money will eventually cease to measure what you think it measures. Design your framework for that eventual collapse, not for ideal compliance.
