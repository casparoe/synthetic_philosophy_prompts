  hey, no worries about the typos (i caught the "saftey" one lol), this is a really cool angle on moral desert. here's the scenario built to your specs:

  Consider Alex, a senior structural engineer who knowingly skipped mandatory stress tests on a bridge component last year to meet a deadline, resulting in a contractor breaking a leg, yet Alex faced no disciplinary action and is now the top candidate for a director role overseeing safety protocols. In this specific thought experiment, a cross-lifetime karma theory with "moral escrow" claims Alex actually deserves the promotion because their current good fortune is merely a withdrawal against heavy suffering endured in a prior life that already settled this moral debt. Meanwhile, a standard one-life desert theory insists Alex is fundamentally undeserving because within this single observable lifespan, the harm caused remains unaddressed and no restitution has been made, leaving the moral ledger strictly in the red regardless of any metaphysical history.

  okay so walking through the logic: the karma theorist says Alex deserves the promotion because desert isn't about *this* action's consequence, but about the total balance of the soul across time; the suffering Alex went through before (maybe poverty, illness, whatever) acted as pre-payment for this current negligence, so giving them the promotion is just cashing out that credit. the one-life theorist says absolutely not, because moral desert requires a link between the agent's current choices and their current outcomes; since Alex hasn't made amends for the broken leg, rewarding them breaks the moral connection between action and responsibility.

  the feature doing all the heavy lifting here is definitely the "moral escrow" across lives. it allows the currency of suffering to be transferred across time boundaries that normally separate moral accounts. if you remove that feature—say, you deny past lives or just say debts don't transfer—the whole thing collapses back into a normal injustice case where Alex is just a lucky bad person who should be punished.

  as for how the one-life theorist attacks this, yeah, they'd obviously start by denying prior lives exist since there's no empirical evidence, but the deeper problem they'd point out is that this version of karma undermines moral agency *now*. if i can burn through credit earned by a past version of me to excuse negligence today, then my current choices don't actually determine my desert, which makes moral growth or learning pointless. it turns morality into a bank account you can overdraft from rather than a practice of building character.
