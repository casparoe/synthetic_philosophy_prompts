      *   Settled vs. Contested? (Need to ensure this is explicit).
      *   Structure justified? (Yes, Morning=Factual/Erosion, Afternoon=Normative/Repair).

  7.  **Final Polish:** Enhance the flow. Ensure the transition from the philosophical distinction to the practical agenda is smooth. Make sure the "common world" concept is the pivot point. (Self-correction: Ensure I don't sound like I'm saying policy researchers *don't* understand theory, but rather that the *structure* respects the philosophical priority of the factual realm).

  8.  **Final Word Count Check:** A 5-minute speech is typically 650-750 words. I will aim for that range to ensure it's not rushed.

  *(Self-Correction on "Contested" section)*: I need to be careful not to derail the speech with too much meta-commentary. Keep it brief but precise. "While we agree on X, scholars debate Y."

