      *   **Tone:** Polished, formal.
      *   **Core Argument:** Use Arendt's distinction between *factual truth* and *rational/philosophical truth* as the *structural architecture* for the workshop agenda (Morning: Empirical/Historical; Afternoon: Normative).
      *   **Key Arendtian Concept:** Systematic lying erodes the "common world" (plurality/testimony), not just specific facts. This undermines the ground for normative theory.
      *   **Specific Constraint 1:** Do not invent quotations or specific page citations. Paraphrase precisely.
      *   **Specific Constraint 2:** Distinguish between settled interpretation (factual truth is contingent/vulnerable) and contested points (state secrecy, correspondence theory).
      *   **Goal:** Justify why the sessions are separate. Merging them would miss Arendt's point (empirical cases depend on a common world; normative theory defends it; if the world is lost, theory has no footing).

  2.  **Deconstruct the Arendtian Framework:**
      *   *Factual Truth:* Contingent, could have been otherwise, depends on witnesses/testimony, vulnerable to organized lying.
      *   *Rational/Philosophical Truth:* Necessary truths (math, logic, some philosophy), less vulnerable to lying but can become irrelevant dogma.
      *   *The Danger:* Political lying isn't just about false statements; it's about destroying the texture of reality that allows us to debate. It attacks the "common world."
      *   *The Workshop Structure:*
          *   Morning (Empirical): Examining the erosion of the common world (the factual layer).
          *   Afternoon (Normative): Building the frameworks for accountability (the rational/normative layer).
          *   *Why Separate?* You can't build the normative roof if the factual foundation is being actively dissolved. You must diagnose the erosion before prescribing the repair.

  3.  **Drafting - Section by Section:**

      *   **Welcome & Acknowledgment:** Acknowledge the dual audience. Validate both disciplines.
      *   **The Arendtian Lens:** Introduce the distinction between factual and rational truth without jargon overload.
      *   **The Structural Justification (The "Why"):** Explain the Morning/Afternoon split using the lens.
          *   Morning = The vulnerability of factual truth (testimony, evidence).
          *   Afternoon = The normative response (accountability).
      *   **The Central Move:** Explain *why* they aren't mixed. If the common world is gone, normative theory floats in void.
      *   **Nuance/Scholarly Integrity:** Address the contested areas (secrecy, correspondence theory) carefully.
      *   **Conclusion:** Call to action for the day.

  4.  **Drafting - Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I quote her? *Correction:* Ensure no "As Arendt wrote..." with fake quotes. Use "She argues," "She distinguishes."
      *   *Check:* Is the distinction clear? *Correction:* Make sure "factual truth" is linked to testimony and contingency, not just "facts."
      *   *Check:* Is the separation justified? *Correction:* Emphasize that mixing them risks treating normative theory as if it stands on solid ground when the ground is being mined.
      *   *Check:* Audience balance? *Correction:* Speak to policy folks about "evidence" and to scholars about "plurality."
      *   *Check:* Contested vs. Settled? *Correction:* Explicitly mark where scholars disagree (e.g., does she allow *any* secrecy?).

  5.  **Drafting - Writing the Speech (Iterative Process):**

      *   *Opening:* Welcome everyone. Note the interdisciplinary nature.
      *   *The Hook:* We are here to talk about lying, but Arendt tells us it's not just about falsehoods.
      *   *The Distinction:* Factual truth (contingent, needs witnesses) vs. Rational truth (logic).
      *   *The Danger:* Lying targets the *capacity* to testify. It destroys the common world.
      *   *The Agenda:* Morning is about the attack on the common world (Empirical). Afternoon is about rebuilding the structures (Normative).
      *   *The Justification:* Why not mix them? Because normative theory requires a stable reality to function. If we don't diagnose the erosion first, the solutions are abstract.
      *   *The Caveat:* Acknowledge scholarly debate. We agree on the vulnerability of facts; we debate the limits of secrecy and the nature of truth.
      *   *Closing:* Let's proceed with this architecture in mind.

  6.  **Review against Constraints:**
      *   5 minutes? (Word count check: ~700-800 words).
