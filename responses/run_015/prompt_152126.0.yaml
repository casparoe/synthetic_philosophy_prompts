      *Refining the (1) vs (5) conflict:* If (5) is true, (1) is just a preference, not a moral truth. The conflict is if the user presents (1) as an objective moral duty while holding (5).
      *Refining the (2) vs (3) conflict:* If chickens eat crops, and crops kill wild mammals (3), then chicken = chicken suffering + crop mammal suffering. Beef = cow suffering + pasture mammal suffering. If Crop Mammal > Pasture Mammal, and Cow > Chicken (individual), the total sum depends on the exchange rate. (5) says there is no exchange rate. So (2) cannot be objectively derived if (5) is true.

