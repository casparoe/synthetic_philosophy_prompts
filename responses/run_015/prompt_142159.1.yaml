prompt: |-
  You are a professional philosopher — epistemology and general philosophy of science is your patch, and you've taught explanation and confirmation at graduate level more than once. Take your time with this one: brainstorm loosely first about what could even go on the list, then cut it down, then write the answer properly. Write in British English throughout (yes, I do care about the -ise endings, and it's "conditionalisation").

  Here's where I am. I'm putting together agraduate seminar on explanation, and I keep not being able to say what I actually want from an account of inference to the best explanation. Every paper I look at either defends IBE against one more objection or shows that it was Bayes all along, and I've definately got no fixed standard to hold any of them to. Less academically: I'm sitting on a university panel that has to rule on a case where the evidence is entirely circumstantial — two live hypotheses about how a collection of papers went missing from an archive, no decisive test available, real consequences for the people involved. I want to be able to say out loud what someone has to be entitled to in order to reason "this is the best explanation, so this is what happened" in a setting like that. So the thing I want specced is IBE as a rule a non-ideal inquirer could actually use: under time pressure, working with the finite set of hypotheses they've managed to think of, where the verdict matters and no further evidence is coming.

  Write me the desiderata. Concretely:

  - The cases it has to get right, with the case behind each requirement. Please cover at least these, and add any I've missed:
    - the placeholder case: a hypothesis that explains by naming a mechanism it doesn't specify — the carburettor explanation for the car that won't start. Is explanatory credit owed before the mechanism gets filled in, and what does your requirement say about that?
    - the copycat case: a rival that borrows everything explanatory from the leading hypothesis and adds one extra claim, which then gets independently confirmed. Does the extra confirmed prediction count in its favour, and if so, is IBE quietly absorbing something that isn't explanatory virtue at all?
    - the duet case: one hypothesis unifies two ranges of phenomena under a single mechanism, a rival handles them with two mechanisms of exactly matched simplicity. Whatever you say here, tell me whether unification is doing independent work in your list or whether it's reducible to something else.
    - the known-false-loveliest-hypothesis case: what IBE is supposed to output when the most lovely candidate in the lot is one we have independent reason to think is false.
  - The distinctions it must respect and mustn't collapse: best available explanation vs. good enough explanation; explaining the data vs. being made probable by it; IBE as a rule of inference vs. a heuristic vs. a redescription of Bayesian updating; the contrastive shape of ordinary why-questions; full belief vs. a shift in credence.
  - What it has to be consistent with: it can't be a rule that predictably bankrupts anyone who follows it; it can't fall apart when turned on itself (the move where someone argues that the best explanation of IBE's own track record is that IBE is reliable — I want to know whether a theory has to be able to say something about that, or whether it's fine to refuse); and it should sit with whatever is actually true about how well explanationist updating tracks the truth compared with straight conditionalisation.

  Then the two bits I care about most. First: mark each requirement as non-negotiable or as a preference of one camp, and tell me which of the things people standardly demand of IBE — truth-conduciveness, being genuinely ampliative rather than a re-run of Bayes, delivering a verdict in every case, respecting the contrastive structure of why-questions, refusing to credit conspiracy- or demon-shaped hypotheses — are genuine desiderata and which are just one camp's prejudices dressed up. Second: flag any pair or triple of requirements on your own list that you suspect can't be jointly satisfied, and name the single requirement that knocks out the most candidates. If the list turns out to be jointly unsatisfiable, that's the interesting result — don't quietly drop a requirement to make the list look tidy.

  No bibliography, no reading list, no footnotes: I've got the literature, I want the spec. At the very end, one short paragraph only, on how the broad camps do against your list — the Bayesian reductivist, the contrastive/loveliness account in Lipton's style, and the van Fraassen-style sceptic about the whole enterprise. Keep the weight on the criteria and their cases, not on the scorecard. And don't soften everything into it-depends-what-you-mean-by-explanation: commit to the requirements, give me the cases, then say where you're unsure.
