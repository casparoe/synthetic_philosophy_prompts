    "dark_competence_analogy": "How the niche concept of dark competence relates to the philosophical inversion."
  }

  Please ensure your response is rigorous, avoids bibliographic citations or references to texts I should read, and does not ask for sources. Focus on conceptual clarity rather than historical attribution.
