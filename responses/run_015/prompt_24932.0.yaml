  8.  *(Self-Correction during drafting)*: Make sure to emphasize that Wittgenstein distinguishes between *reasons* and *causes*, and between *empirical uncertainty* and *grammatical certainty*. Flat Earth is empirically uncertain (and wrong). Religious certainty is grammatical (hinge-like).

