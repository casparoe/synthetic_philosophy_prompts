answer: |-
  Dear student, it is great to hear from you and that professor of yours is pointing at something quite astute regarding the skeptical solution leaning toward pragmatic conventionalism, because if meaning is just grounded in community assertability conditions then we have traded truth conditions for social utility, which is a heavy price to pay. You asked for my actual credence that Kripkenstein's skeptical argument succeeds in showing there is literally no fact of the matter about meaning rather than just epistemic uncertainty and I will give you a precise number right away to anchor this discussion before we unpack the reasoning behind it. My credence is 0.28. I think the argument is formidable and exposes genuine structural problems in how we conceive of mental content, but I ultimately believe it fails to establish ontological nihilism about meaning because it relies on constraints that are too restrictive for what counts as a fact. To decompose this as you requested I need to look first at the probability that finite past use genuinely underdetermines the rule in the strong way Kripke needs and here I am quite generous to the skeptic because logically speaking any finite sequence of behaviors is compatible with infinitely many rules so I would assign a high probability of around 0.85 to the claim that the past data alone does not fix the future application without some further bridging principle. However the argument needs more than just underdetermination to prove there is no fact of the matter and this leads to the second component regarding the probability that the skeptical solution is coherent and does not just change the subject which I assess at a lower probability of about 0.4 because if the solution merely explains when we are justified in attributing meaning rather than what meaning consists in then it concedes the skeptic's point about facts while trying to save discourse which feels like a retreat rather than a resolution. The third component is critical and concerns the probability that a modified dispositionalist account using idealized dispositions under counterfactual optimal conditions can rescue semantic realism without circularity and here I am somewhat optimistic though cautious assigning a probability of 0.55 that such a naturalistic account can succeed because while the circularity objection is strong it assumes we cannot naturalize normativity which is itself a contentious premise. This brings me to the fourth component which is whether the whole framing about going on in the same way is itself a misleading intuition pump about normativity that stacks the deck and I think there is a 0.7 probability that this is the case because Kripke assumes a picture of normativity that requires a conscious grasp of a rule to justify every step which ignores the possibility that normativity is embedded in our biological or social practices without needing explicit justification at every turn. When you weigh these together the high probability of underdetermination is offset by the significant chances that either dispositionalism works or the normative framing is rigged against naturalistic facts which is why my overall number stays below 0.3. If I had to tell you which component I am least confident in it would definitely be the third one about modified dispositionalism because the literature on idealization is incredibly technical and turns on subtle distinctions between causal tendencies and normative constraints that are easy to conflate. The evidence or argument that would move my overall number the most would be a robust naturalistic account of normativity that shows how evaluative facts can exist within a physicalist worldview without requiring spooky non-natural properties because if normativity can be naturalized then the skeptic's demand for a fact of the matter is met without needing to posit anything beyond the natural order. I hope this helps you navigate the rest of the unit and feel free to push back on any of these probabilities since philosophy is rarely about settling on a number but rather about understanding the weight of the reasons behind it.
