answer: |-
  You're right to be suspicious. "Lives not histories" is a famous quote (Plutarch, *Life of Alexander*, 1.2), but like most famous quotes, it gets weaponized to justify whatever the speaker wants to do. Your teacher is using a methodological distinction to excuse a thematic shift.

  Here is the menu of readings for "lives not histories," broken down by validity and whether it actually justifies skipping the politics for the drama.

  ### 1. The Trivial Version: "People make history, so study people."
  *   **The Claim:** History is just the sum of individual actions. If you study the actor, you understand the play.
  *   **Platitude?** **Yes.** It is technically true that people do things, but it's an empty statement.
  *   **Defensible?** **Weakly.** It ignores structural forces (economics, geography, institutions) that constrain or dictate what "great men" can actually do.
  *   **False?** **No,** but it's reductionist.
  *   **Supports skipping politics for drama?** **Yes.** If the person is the only unit of analysis, their internal state matters more than the external laws they passed.
  *   **Hagiography Risk:** **Low.** You can study a person's actions without making them a saint.

  ### 2. The Moral Mirror Version: "Biography exists to teach ethics."
  *   **The Claim:** The purpose of history is not truth, but improvement. We study lives to copy virtue and avoid vice.
  *   **Platitude?** **No.** This is a specific philosophical stance (didactic history), not a universal truth.
  *   **Defensible?** **Yes,** as a pedagogical goal. It's how the ancients viewed history.
  *   **False?** **No,** but it conflicts with modern empirical history, which aims for accuracy over moral instruction.
  *   **Supports skipping politics for drama?** **Yes.** A battle is just data; a jealousy fit is a moral lesson on the dangers of envy. This is likely the engine driving your teacher's lesson plans.
  *   **Hagiography Risk:** **High.** If the goal is moral instruction, there is a constant temptation to scrub away complex flaws that don't fit the "lesson," turning the subject into a cartoon villain or hero.

  ### 3. The Hagiography Version: "Great lives must be inspiring."
  *   **The Claim:** We study great people to be inspired; therefore, their lives should be presented as exemplary.
  *   **Platitude?** **No.**
  *   **Defensible?** **No.** This is bad history. It requires lying by omission.
  *   **False?** **Yes.** It treats history as propaganda or liturgy rather than investigation.
  *   **Supports skipping politics for drama?** **Sort of.** It supports skipping *negative* drama (scandals, failures) but keeps *positive* drama (triumphs, sacrifices).
  *   **Hagiography Risk:** **100%.** This is the definition of hagiography.

  ### 4. The Plutarchian Version: "Character is revealed in small moments, not big events."
  *   **The Claim:** A battle record shows strategy; a dinner party anecdote shows character. To know the man, look at the trivial.
  *   **Platitude?** **No.** This is a specific methodological argument about *how* to read evidence.
  *   **Defensible?** **Yes.** Psychology often drives political decision-making more than logic does.
  *   **False?** **No.**
  *   **Supports skipping politics for drama?** **Yes.** This is the exact argument Plutarch made. He explicitly said he often passes over famous battles to focus on a joke or a meal because those reveal the *nature* of the man.
  *   **Hagiography Risk:** **Low.** Plutarch was actually quite willing to record flaws (drunkenness, rage, insecurity) because flaws reveal character just as well as virtues do.

  ***

  ### The Verdict on Your Teacher

  **Which version is she using?**
  She is smuggling the **Moral Mirror Version** inside the **Plutarchian Version**.
  She is using Plutarch's methodological excuse ("small moments reveal character") to deliver a moral lesson ("jealousy is bad," "trauma explains behavior"). She isn't doing pure Plutarchian analysis, because Plutarch compared Greeks and Romans to show how culture shaped character. Your teacher is likely using the "trauma/drama" angle to make the history "relatable" or "instructive" in a modern therapeutic sense.

  **Does it justify skipping politics?**
  Technically, **yes**, if you accept the Plutarchian premise. Plutarch literally told his readers he wasn't writing history. However, in a modern high school *History* class (not *Ethics* or *Literature*), skipping the laws and battles is methodologically unsound because you cannot understand the *consequences* of the character without the political context. Alexander's trauma matters, but not if you don't know what empire he built with it.

  **Which versions accidentally turn biography into hagiography?**
  1.  **The Hagiography Version:** Obviously.
  2.  **The Moral Mirror Version:** This is the trap. Once you decide a life story exists to teach a lesson, you start subconsciously editing out the messy parts that complicate the lesson. If Alexander is supposed to teach "ambition," you downplay the fact that his ambition got his men killed. If Caesar is supposed to teach "mercy," you downplay the genocide in Gaul.

  **Summary:** Your teacher is right that Plutarch said this, but she's using a 2,000-year-old philosophical stance to bypass modern historical standards. You aren't wrong to feel like the "history" part is getting shortchanged.
