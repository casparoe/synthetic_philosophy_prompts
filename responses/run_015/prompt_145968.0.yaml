  - the moral mirror version: biography exists so we can copy virtue and avoid vice
  - the hagiography version: every life story should be a saint story that hides the bad parts
  - the plutarcs paired biography version: comparing greek and roman figures specifically to teach character, not just record what happened

  for each one say if its a platitude, if its defensible, if its false, and whether it actually supports her skipping politics for personal drama. also tell me which version shes probably using and which ones accidentally turn biography into hagiography. dont need citations or a reading list just the breakdown.
