answer: |-
  Here is the strongest formulation of the Custodial Warrant (CW) norm, articulated as a direct challenge to the Knowledge Norm (KN). This is written to serve as the "steel-man" target for your paper, adopting the tone and precision expected in a US analytic philosophy journal.

  ***

  ### The Case for Custodial Warrant

  The Knowledge Norm (KN) asserts that one must assert $p$ only if one knows $p$. While KN has dominated the literature, it fixates on the speaker's internal epistemic status rather than the interpersonal function of assertion. Assertion is not merely the expression of a cognitive state; it is the undertaking of a dialectical responsibility. When I assert $p$, I do not just signal that $p$ is true; I invite challenge and offer to defend $p$. Therefore, the proper norm is **Custodial Warrant**: *One may assert $p$ only if one holds the warrant for $p$ in custody, such that one can trace $p$ back through one's own reasons to its support.*

  On this view, the Hospital Spokesperson flouts the norm because she acts as a mere conduit, pointing to grounds she does not hold. The Friend with the timetable satisfies the norm because she holds the grounds directly. CW is superior to KN because it better captures the dialectical obligations inherent in the speech act, specifically in three critical areas where KN falters.

  #### 1. Misleading Higher-Order Evidence
  Consider a speaker with excellent first-order evidence (she clearly sees the cat on the mat) but misleading higher-order evidence (a trusted, though actually mistaken, technician tells her the room is filled with perfect hologram projectors).

  KN struggles here. Plausibly, the misleading higher-order evidence defeats knowledge. If KN holds, the speaker is forbidden from asserting "The cat is on the mat." Yet, intuitively, she is still in a position to assert. She can show you the cat. She has the visual evidence in hand. The defeater is external to her immediate access to the world.

  CW explains why assertion remains permissible. The norm requires the speaker to hold the warrant in custody. She *does* hold the perceptual warrant. The misleading higher-order evidence does not dissolve her ability to produce her reasons; it merely casts a shadow on their reliability from a perspective she cannot access. CW permits the assertion because the dialectical offer—"Look, there it is"—remains good. KN silences the speaker based on epistemic luck (the technician's lie), whereas CW correctly identifies that her position to defend the claim remains intact.

  #### 2. The Consensus Claim Without Belief
  Consider a scientist asserting a consensus claim (e.g., "Vaccines are safe") based on data she has analyzed, yet she personally harbors doubts due to a hunch or conflicting intuition she cannot articulate. She does not believe $p$, and thus, on the standard analysis, she cannot know $p$. KN forbids the assertion.

  However, in scientific and institutional contexts, we often want to allow assertion based on the strength of the data held by the speaker, even if their doxastic commitment is wavering. CW validates this. The scientist holds the warrant (the data, the methodology) in custody. She can walk a challenger through the trial results. Her psychological lack of belief is a private failure, but her public dialectical position is secure. CW prioritizes the *transferability of warrant* over the *expression of belief*. It recognizes that assertion functions to distribute epistemic goods, and the speaker possesses those goods even if she is hesitant to consume them herself. KN is too solipsistic here; CW captures the social utility of the act.

  #### 3. The Moorean Asymmetry
  KN explains the infelicity of "It is raining, but I don't know it is raining" by noting the contradiction between asserting (which implies knowledge) and denying knowledge. However, KN struggles to distinguish this sharply from "It is raining, but I might be wrong." Both claims acknowledge a lack of factive certainty.

  CW draws the line more naturally. To assert is to offer custody of your grounds. To say "I don't know $p$" is to explicitly retract the offer of adequate custody. It signals to the listener, "I cannot vouch for this," which undermines the very point of asserting. It is a performative contradiction.

  Conversely, "I might be wrong" is compatible with CW. Custodial warrant does not require infallibility; it requires *defensibility*. I can hold the timetable, show it to you, and still admit that print errors exist. Admitting fallibility does not surrender the grounds I hold. CW explains the asymmetry not by appealing to the factivity of knowledge, but by appealing to the consistency of the dialectical offer. The first sentence withdraws the warrant; the second merely qualifies it.

  #### Meeting the Objections

  **Objection 1: The Memory Condition**
  Critics will argue that CW is merely a Justified Belief norm with a memory condition added. If I have justified belief, surely I have the reasons?

  This misunderstands the custodial requirement. One can have justified belief via reliable processes (e.g., a reliable clairvoyant faculty or forgotten evidence) where the reasons are no longer accessible. If I assert $p$ based on a belief formed years ago whose source I have forgotten, I satisfy Justified Belief, but I fail CW. I cannot trace $p$ back. CW is stricter because it is *dialectical*, not merely *mental*. It governs the transaction between speaker and hearer, not just the speaker's internal architecture. The norm demands that the warrant be *liquid*, available for exchange upon challenge. A justified belief that cannot be unpacked is epistemic dead weight in a conversation. CW captures this; the Justified Belief norm does not.

  **Objection 2: The Testimony Problem**
  The most serious charge is that CW forbids most everyday testimony. If I assert "Napoleon lost at Waterloo," can I trace the warrant? Or am I just pointing to history books? If CW requires original custody, it renders most of our conversational life improper.

  Here, we must commit. CW *does* restrict testimony more than KN, and we should accept this cost. There is a genuine epistemic vice in "epistemic freeloading," where speakers pass along claims they cannot defend. CW forces a distinction between *integrated warrant* and *mere citation*.

  If I have integrated the claim about Napoleon into my web of belief such that I can defend it via coherence, map out the historical context, or reference the specific texts I rely on, I hold it in custody. The Hospital Spokesperson fails because she explicitly disclaims this integration ("I am just reading the report"). The everyday speaker succeeds when the information is naturalized. However, CW *should* forbid the casual propagation of rumors or news headlines that the speaker cannot unpack. In an era of misinformation, a norm that raises the bar for assertion is not a bug; it is a feature. CW wins in cases of expert testimony and direct observation; it strains in cases of trivial, absorbed cultural knowledge. We should concede the strain on trivialities to secure the gain in accountability for significant claims.

  ### Conclusion for the Critic
  To defeat Custodial Warrant, you cannot simply show that it is demanding. You must show that the demand is *external* to the norm of assertion itself. You must argue that the purpose of assertion is to share truth, not to police the dialectical readiness of the speaker. But be warned: CW's strength lies in its ability to explain why we feel cheated when a speaker says, "I don't know, I just read it online." CW says that feeling is the norm doing its work. Your argument must convince us that the norm is satisfied even when the speaker is merely a conduit.
