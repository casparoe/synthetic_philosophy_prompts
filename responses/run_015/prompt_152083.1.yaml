prompt: |-
  hey — I'm in a small reading group working through the accuracy-first / epistemic consequentialist side of epistemology, and we got stuck on indirect normativity last week and I've been turning it over since. Here's where I landed; tell me if I've misread it. As I get it, the idea is a reply to the objection that a consequentialist standard just totals up accuracy across unrelated propositions, and so can't really respect that your evidence for one claim is separate from your evidence for another. The reply is supposed to be: fine, but accuracy was never the thing that answers your first-personal question "should I believe p?" — it evaluates belief states (or the dispositions that produce them) from outside. It's normative, just not directly. OK. But then I thought: if that's the shape of it, the real unit of deliberation has to be the policy, not the individual belief. What I choose isn't whether to believe p, it's which belief-forming policy to run. And then deliberation just becomes a plain expected-value calculation: list the candidate policies (strict conditionalizer, defer to experts, suspend on anything contested, whatever), score each one by expected accuracy given what I currently think — I actually started a spreadsheet with a Brier-style scoring rule — and adopt the argmax. Accuracy stays the fundamental standard, and it stays indirect in the sense that it doesn't whisper in your ear while you're in the middle of thinking; it just ranks the policies from outside.

  My friend said that's exactly the move indirect normativity is supposed to block, but she couldnt say why, and I really don't see it — if accuracy is the standard, how is adopting the accuracy-maximizing policy not the rational thing to do? The bit that does worry me is that the expected accuracies are all computed from my own current credences, so the procedure feels like it might just hand my existing opinions back to me. I was going to patch that by scoring the policies with the credences I'd have after idealized deliberation instead — unlimited reflection, no cognitive or motivational biases, logical omniscience, the lot — so the ranking is at least the one an ideal deliberator would arrive at. But now I worry that fix is worse than the bug: once the deliberator is idealized like that, the policy framing seems to evaporate. An agent with no computational limits and no biases doesn't need a policy for managing its own future updating; there's no tradeoff left for it to adjudicate, so "what would idealized deliberation choose?" either has no answer or has an answer that tells a bounded agent like me nothing about what to do on Monday. So is my spreadsheet a clumsy implementation of a basically sound idea, or is the idea itself the mistake? Does swapping in idealized credences fix the self-certification worry, or does idealizing the deliberator make the deliberation problem collapse (or blow up) in a way I'm not seeing? And where does that leave the question I actually started with — should I believe p? Does accuracy have nothing at all to say about that question, or does it come back in once the policy-level stuff is settled?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position and Problem:**
      *   **Context:** Small reading group on accuracy-first epistemology / epistemic consequentialism.
      *   **Topic:** Indirect Normativity (specifically in response to the "separation of evidence" objection).
      *   **User's Interpretation:** Indirect normativity means accuracy evaluates *policies* (belief-forming dispositions/rules), not individual beliefs directly. Therefore, rational deliberation is choosing the policy with the highest expected accuracy.
      *   **User's Proposal:** Create a spreadsheet (expected value calculation) to score policies (conditionalization, deference, etc.) based on expected accuracy and adopt the winner.
      *   **The Conflict:** A friend says this *is* the move indirect normativity is supposed to block, but can't explain why.
      *   **User's Worry 1 (Self-Certification):** Scoring policies based on *current* credences just reinforces existing biases/opinions (circularity).
      *   **User's Proposed Fix:** Score policies based on *idealized* credences (logical omniscience, unlimited reflection).
      *   **User's Worry 2 (Idealization Collapse):** If the deliberator is ideal, they don't need heuristics/policies. Bounded agents can't use ideal advice. The policy framing evaporates.
      *   **Core Question:** Is the spreadsheet approach sound? Does idealization fix the circularity or break the model? How does this connect back to "Should I believe $p$?"

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Accuracy-First Epistemology:** Joyce, Pettigrew, etc. Accuracy (verisimilitude/truth-likeness) is the fundamental epistemic good.
      *   **The Objection (Separation of Evidence):** Consequentialism seems to allow "epistemic utility monsters" or believing $p$ because it makes you believe other true things, ignoring specific evidence for $p$.
      *   **Indirect Normativity (The Standard Reply):** Accuracy norms apply to *rules* or *dispositions*, not act-by-act. (Analogy: Rule Utilitarianism vs. Act Utilitarianism).
      *   **The User's Move:** "Deliberate directly on which policy maximizes accuracy."
      *   **The Friend's Intuition (Crucial):** The friend is likely hinting at the distinction between *criteria of rightness* and *decision procedures*. Or, more specifically, the problem of *epistemic akrasia* or *self-undermining policies*.
      *   **The "Self-Certification" Problem:** If I use my current credences to evaluate policies, I might select a policy that says "Trust my gut," which confirms my current gut. This is the "Current Credence" trap.
      *   **The "Idealization" Problem:** If I use ideal credences, I'm asking "What would God do?" God doesn't need heuristics. Bounded agents need heuristics *because* they aren't ideal. This is the "Ought Implies Can" or "Bounded Rationality" tension.

  3.  **Evaluate the User's "Spreadsheet" Idea:**
      *   *Is it what indirect normativity intends?* Generally, no. Indirect normativity usually posits that the *theory* evaluates policies, but the *agent* shouldn't necessarily be consciously calculating policy utility. That leads to regress or cognitive overload.
      *   *Why the friend is right (sort of):* If you make the *choice of policy* a direct expected accuracy calculation, you've turned indirect normativity back into direct normativity at a higher level. You haven't solved the structural problem; you've just moved it up a type level.
      *   *The "Moore's Paradox" / Akrasia issue:* If the best policy is "Don't calculate expected accuracy, just trust perception," but you calculate that, you are violating the policy you selected.

  4.  **Address the Specific Worries:**
      *   **Worry 1 (Current Credences):** Yes, this is a known problem (Greaves, Wallace). Evaluating updating rules requires a prior. If the prior is flawed, the evaluation is flawed.
      *   **Worry 2 (Idealization):** Yes, this is the "Logical Omniscience" problem in Bayesianism. If you are logically omniscient, you don't need a policy for updating; you just have the posterior. So the "policy" concept loses grip.
      *   **The "Should I believe $p$?" Question:** Indirect normativity says: "Follow the policy." It doesn't give a direct answer unless the policy gives a direct answer.

  5.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge the sophistication of the user's thinking. They have grasped the tension perfectly.
      *   *The Friend's Point:* Explain *why* the friend is right. The move to "choose the policy via expected accuracy" recreates the problem at the meta-level. It turns indirect normativity into "Direct Normativity for Policies."
      *   *The Circularity (Current Credences):* Confirm this is a real issue (cite Greaves/Wallace on updating rules). Using current credences to validate the rule that generates future credences is risky.
      *   *The Idealization Trap:* Confirm this is also a real issue. Ideal agents don't need heuristics. Bounded agents can't simulate ideal agents. This is the "Bridge Principle" problem.
      *   *The Core Philosophical Distinction:* Distinguish between **Criteria of Rightness** (what makes a belief/policy good) and **Decision Procedures** (how the agent thinks). Indirect normativity is usually about the former, not necessarily prescribing the latter as a conscious calculation.
      *   *Answering "Should I believe $p$?":* Accuracy *does* speak to it, but indirectly. "Believe $p$ if your best policy says so." But if your best policy is "Believe $p$ when evidence $E$ is present," you need to know if $E$ is present.
      *   *Recommendation:* The spreadsheet isn't "clumsy," it's arguably *too direct*. The solution usually lies in **Virtue Epistemology** or **Dispositional** accounts rather than conscious policy selection. Or, accepting that accuracy-first needs a bridge principle for bounded agents (e.g., "Do what approximates the ideal").

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is the user describing "Epistemic Decision Theory"?* Yes, roughly.
      *   *Is the friend talking about "Epistemic Akrasia"?* Likely. If the theory says "Adopt the policy that maximizes accuracy," but the policy that maximizes accuracy is "Don't listen to accuracy theories," you have a conflict.
      *   *Key Terminology:* Make sure to use "Criteria of Rightness vs. Decision Procedure." This is the standard utilitarian distinction that maps perfectly here.
      *   *The "Idealized Credence" fix:* This sounds like "Objective Bayesianism" or "Logic of Truth." But as the user noted, it disconnects from the bounded agent.
      *   *Conclusion:* The user has identified the two horns of a dilemma (Circularity vs. Irrelevance). This is a feature of the literature, not a bug in their thinking.

  7.  **Final Polish:**
      *   Tone: Collaborative, academic but accessible.
      *   Structure:
          1.  Validate the insight (You found the dilemma).
          2.  Address the Friend's objection (Meta-level directness).
          3.  Address Worry 1 (Current Credence/Circularity).
          4.  Address Worry 2 (Idealization/Irrelevance).
          5.  Synthesize: Criteria vs. Procedure.
          6.  Answer the "Should I believe $p$?" question.

  8.  *(Self-Correction on the Friend's Objection)*: I need to be careful. The friend says indirect normativity is supposed to *block* the spreadsheet move. Why? Because indirect normativity usually implies the agent *should not* be consciously maximizing accuracy even at the policy level. The normativity is *in the evaluation*, not necessarily *in the deliberation*. If you deliberate by maximizing accuracy, you are an "epistemic consequentialist deliberator," which might lead to worse outcomes (like anxiety, overthinking) than a "naive" deliberator. This is the "Paradox of Hedonism" applied to epistemology. I must highlight this.

  9.  *(Final check on Idealization)*: The user suggests scoring policies with credences *after* idealized deliberation. This is basically asking "What policy would I pick if I were smarter?" But if I were smarter, I wouldn't need a policy. I'd just see the truth. So the policy becomes "Look until you see." That's not action-guiding for the non-ideal agent.

  10. **Plan:** Construct the response around these points. Ensure the distinction between *evaluative standard* and *deliberative guide* is central.

  **(End of Thought Process)**
answer: |-
  You have not misread the literature; in fact, you have independently reconstructed one of the central dilemmas in accuracy-first epistemology. You've hit on the tension between **evaluative standards** and **decision procedures**, and you've correctly identified that both "current credences" and "idealized credences" create fatal problems for the spreadsheet approach.

  Your friend is right that your spreadsheet move is exactly what indirect normativity is often meant to block, but she struggled to explain why because it requires distinguishing between *what makes a belief right* and *how an agent should think*.

  Here is a breakdown of where your reasoning is landing, why the two worries you identified are genuine philosophical hurdles, and how accuracy-firsters typically try (and often struggle) to navigate them.

  ### 1. Why your friend is right (The Meta-Level Problem)
  Your move was to say: "Accuracy doesn't judge beliefs directly; it judges policies. So, I will deliberately choose the policy that maximizes accuracy."

  The problem is that you have simply **moved the consequentialist calculation up one type level**.
  *   **Direct Consequentialism:** Choose the belief that maximizes accuracy.
  *   **Your "Indirect" Version:** Choose the policy that maximizes accuracy.

  If you consciously deliberate by calculating expected epistemic utility, you are still treating accuracy as a *decision procedure*. Many indirect normativists (drawing from Rule Utilitarianism) argue that the *criterion of rightness* is accuracy, but the *decision procedure* should not be "maximize accuracy."

  **Why?** Because of the **Epistemic Paradox of Hedonism**. Just as trying desperately to be happy often makes you unhappy, trying desperately to maximize accuracy often makes you less accurate. It leads to overthinking, second-guessing, and instability. If the policy that actually yields the highest accuracy is "Trust your perceptual seemings and don't worry about the math," but you adopt that policy *because* your spreadsheet told you to, you are in a fragile state. If your spreadsheet later says "Actually, trust the oracle," you switch. You become a "fair-weather follower" of the best policy, rather than someone disposed to follow it.

  So, indirect normativity usually implies: *Accuracy evaluates the policy, but the agent should not necessarily adopt the policy via an accuracy calculation.* They should just internalize the policy.

  ### 2. Worry 1: The Self-Certification Trap (Current Credences)
  > *The bit that does worry me is that the expected accuracies are all computed from my own current credences, so the procedure feels like it might just hand my existing opinions back to me.*

  You are absolutely right to worry about this. In the literature (e.g., Hilary Greaves, David Wallace), this is the problem of **justifying updating rules**.
  To evaluate whether "Conditionalization" is better than "Ignore Evidence," you have to run a simulation: *If I adopt Conditionalization, what will I believe later, and how accurate will it be?*
  To run that simulation, you need a probability distribution over future evidence. That distribution comes from your **current** credences.

  If your current credences are garbage (e.g., you are a conspiracy theorist who thinks all news is fake), your expected-value calculation will tell you that the best policy is "Ignore All News." The spreadsheet certifies your own bias. This is **epistemic circularity**. Accuracy-first epistemology wants to be normative (telling you how you *ought* to be), but if the standard relies on your current subjective state to validate the rules that change your state, it loses its critical bite.

  ### 3. Worry 2: The Idealization Collapse
  > *Once the deliberator is idealized like that, the policy framing seems to evaporate. An agent with no computational limits... doesn't need a policy.*

  This is also a known fatal objection to the "Idealized Credence" fix. This is the **Bounded Rationality** problem.
  *   **Ideal Agents:** Do not need heuristics or policies. They see the logical relations and the evidence and immediately hold the credence that matches the evidence. Asking an ideal agent "Which updating rule should I use?" is like asking a perfect archer "Which technique should I use to hit the bullseye?" The answer is just "Hit the bullseye." The rule is invisible.
  *   **Bounded Agents:** Need policies *because* they are not ideal. We need "Conditionalization" because we can't see the logical truth directly.

  If you define the "best policy" as "What an ideal agent would do," the answer is "Be ideal." That is not action-guiding for a non-ideal agent. You cannot bridge the gap between "What God would believe" and "What I should believe on Monday" without a **bridge principle** (e.g., "Do the best you can to approximate God"). But once you add that bridge principle, you're back to needing a way to score *approximations*, which returns you to Worry 1 (using your current, flawed credences to score how well you're approximating).

  ### 4. So, is the idea itself the mistake?
  Not necessarily, but your spreadsheet implementation is likely too intellectualized.

  Most accuracy-firsters (like Pettigrew or Joyce) accept that accuracy is the **constitutive norm** of belief (belief *aims* at truth), but they often retreat to a **virtue-theoretic** or **dispositional** account for the "how-to."
  *   **The View:** Accuracy is the standard. The way to meet it is not by calculating expected accuracy, but by cultivating dispositions (virtues) that reliably track truth.
  *   **The Deliberation:** You don't ask "Which policy maximizes accuracy?" You ask "What does my evidence say?" The accuracy norm is satisfied *if* your evidence-responsive disposition is the kind that generally yields accuracy.

  This preserves indirect normativity without requiring the agent to run the spreadsheet. The spreadsheet is for the **epistemologist** evaluating the agent, not for the **agent** evaluating themselves.

  ### 5. Answering your starting question: "Should I believe $p$?"
  Does accuracy have nothing to say about this?
  *   **Direct Answer:** No. Accuracy-firstism says accuracy is not a reason for belief. (You shouldn't believe $p$ *because* it increases your accuracy score; you should believe $p$ *because* the evidence supports it).
  *   **Indirect Answer:** Yes. Accuracy says: "You should believe $p$ if $p$ is the output of a belief-forming policy that is objectively accuracy-conducive."

  **The Synthesis:**
  Your spreadsheet is a clumsy implementation of a sound idea because it tries to make the **evaluative standard** into the **deliberative guide**.
  1.  **Keep Accuracy as the Standard:** It ranks policies from the outside (as you said).
  2.  **Reject the Spreadsheet as Deliberation:** Do not choose policies by calculating expected accuracy using your current credences (circular) or ideal credences (useless).
  3.  **Adopt a Bridge Principle:** The rational thing for a bounded agent to do is to follow the policies that *would* be chosen by an agent with your cognitive limitations but without your specific biases (a "cleaned-up" version of you, not an ideal God).

  **Where does that leave you?**
  It leaves you with a gap. Accuracy-first epistemology is currently struggling to fill that gap. It can tell you what a perfect belief state looks like (Probabilism, Conditionalization). It struggles to tell a flawed human how to get there without using their flawed judgment to guide the trip.

  **Verdict:** Your friend is right that the spreadsheet move violates the spirit of indirect normativity (by making accuracy the direct object of deliberation). Your worry about circularity is correct (current credences). Your worry about idealization is correct (ideal agents don't need policies).
  The "mistake" isn't the idea of indirect normativity, but the idea that **the agent must consciously maximize the norm.** The norm constrains the system; it doesn't necessarily run the software.

  If I were you, I'd pivot the reading group discussion to **Criteria of Rightness vs. Decision Procedures**. That is the philosophical machinery you need to untangle why the spreadsheet feels both necessary and wrong.
