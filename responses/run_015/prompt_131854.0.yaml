      *   *Refining the "Illusion" point:* The Inquisitor says, "We shall tell them that every sin will be redeemed... they will have no secrets from us." But they must *believe* they are free servants of God. The illusion preserves the *dignity* of the slave.

      *   *Refining the "Meaning" point:* The Inquisitor argues that without authority, life is a "historical riddle." He solves the riddle by removing the question.

  12. **Final Review against constraints:** British English? Yes. Addressed all sub-questions? Yes. No anachronisms (keep it grounded in the text)? Yes.

