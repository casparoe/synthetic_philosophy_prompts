answer: |-
  ### Part 1: Logical Space & Architectural Brainstorming

  Before drafting the handout, I have mapped the logical space. The goal is to avoid the "Do numbers exist?" trap and instead sort students by their *interpretive commitments* regarding standard practice.

  **The Core Tensions (The Axes of the Tree):**
  1.  **Indispensability (Ontology):** Does math explain the physical world, or just model it? (Cicadas/Physics questions).
  2.  **Determinacy (Truth):** Is every well-formed statement (like CH) true or false, regardless of provability?
  3.  **Identity (Semantics):** Are numbers specific objects (sets) or places in a structure?
  4.  **Epistemology (Access):** How do we know about abstracta? Is causal contact required?
  5.  **Modality (Necessity):** Could mathematical facts have been otherwise?

  **Mapping the Leaves (Target Positions):**
  *   **Realist Cluster:** (Accepts Math explains physics + Math is truth-apt).
      *   *Set-Theoretic Platonism:* CH determinate, Numbers are sets.
      *   *Structuralism:* CH determinate, Numbers are positions.
      *   *Naturalism:* CH determinate, Access is via holistic web of belief (no mystery).
      *   *Modal Structuralism:* Math is about *possible* structures, not actual abstracta.
  *   **Anti-Realist Cluster:** (Denies Math explains physics OR denies truth-aptitude).
      *   *Fictionalism:* Math is useful but false (Error Theory).
      *   *Instrumentalism:* Math is a tool, not truth-apt (Non-Cognitivism).
      *   *Formalism/Pluralism:* CH indeterminate; math is a game of symbols.
  *   **Conditional Cluster:**
      *   *If-Thenism:* Math asserts conditionals ("If axioms, then theorem").

  **Unoccupied/Incoherent Regions:**
  *   **The "Explanatory Fictionalist":** Claims "Math is false" but "Math explains the Cicadas." This violates Inference to the Best Explanation. If it explains, we usually commit to its truth.
  *   **The "Causal Platonist":** Claims "Numbers are causally inert" but "We have causal contact with them." Contradictory.
  *   **The "Specific Set Pluralist":** Claims "3 is a specific set" but "CH has no answer." If 3 is a specific set in *the* universe, CH should be determinate in that universe. Indeterminacy implies multiple universes, which undermines the "specific set" claim.

  **Hard Separations:**
  *   **Fictionalism vs. Instrumentalism:** Both say "Use math, don't worry." Separation: Is "2+2=4" *false* (Fictionalism) or *not the kind of thing that can be true* (Instrumentalism)?
  *   **Platonism vs. Structuralism:** Both Realists. Separation: Benacerraf's Identification Problem (Does it matter which set 3 is?).

  ***

  ### Part 2: The Handout Draft

  **Title:** Interpreting the Practice: A Decision Tree for Mathematicians
  **Subtitle:** Sort your intuitions about the work you actually do.
  **Start Node:** You accept ordinary mathematical practice (classical logic, standard theorems, ZFC foundations) as valid.

  **Instructions:** Follow the path that matches your instinct about each scenario. There are no "correct" answers, only consistent positions. Keep track of your Yes/No choices.

  **Q1. The Cicada Case (Explanation)**
  Periodical cicadas emerge every 13 or 17 years (primes). Biologists argue this minimizes intersection with predator cycles.
  *   **A:** The prime number property *explains* the biological survival. The math is doing work.
  *   **B:** The math just *models* the biology. The real explanation is purely biological/physical.

  **Q2. The Nominalist Rewrite (Indispensability)**
  Suppose someone rewrote all of physics to make the same predictions without quantifying over numbers (no "there exists an $x$ such that $x$ is a real number").
  *   **A:** The original theory was *true*; the rewrite is false or loses essential truth.
  *   **B:** The original was just *clunkier*; the rewrite is equally true, just harder to read.

  **Q3. The Continuum Hypothesis (Determinacy)**
  Regarding the size of the set of real numbers vs. integers:
  *   **A:** CH is either true or false right now, even if ZFC can't decide it. We just lack the axiom.
  *   **B:** CH has no answer until we choose a new axiom. Adopting one is like legislation, not discovery.

  **Q4. The Set-Theoretic Surrogate (Identity)**
  In ZFC, we often define $3 = \{\emptyset, \{\emptyset\}, \{\emptyset, \{\emptyset\}\}\}$.
  *   **A:** This identity is literally true. The number 3 *is* that set.
  *   **B:** It doesn't matter which set we pick. 3 is a "position" in a structure, not a specific set.

  **Q5. The Arbitrary Integer (Reference)**
  When you write "Let $n$ be an arbitrary even integer" to start a proof:
  *   **A:** You are singling out a specific (though unnamed) abstract object to reason about.
  *   **B:** You are speaking generally about any object that satisfies the condition. No specific object is selected.

  **Q6. The Causal Squeeze (Epistemology)**
  If mathematical objects are outside spacetime and causally inert:
  *   **A:** It is mysterious how we refer to them or know truths about them. This is a major problem.
  *   **B:** It is not mysterious. Our proofs and definitions track them fine without causal contact.

  **Q7. The Unchecked Proof (Mind-Independence)**
  Consider a theorem proven by a computer program too long for any human to survey.
  *   **A:** The theorem was true before the proof was run. Truth waits on no mind.
  *   **B:** Without a surveyable proof, we cannot assert the theorem is "true" in the same sense. Verification matters.

  **Q8. The Counterpossible (Modality)**
  Could there be a world with exactly the same concrete physical furniture as ours, but where $2+2=5$?
  *   **A:** No. Mathematical facts are necessary; they couldn't be otherwise.
  *   **B:** Yes, in principle. Mathematical facts could vary if the structural rules were different.

  ---

  **FIND YOUR LEAF:**

  *   **Mostly A's (Realist Cluster):**
      *   If **Q4=A** (3 is a set) & **Q6=B** (No mystery): **Set-Theoretic Platonism**. (You believe in a specific universe of sets).
      *   If **Q4=B** (3 is a position) & **Q6=B**: **Structuralism (Ante Rem)**. (You believe in structures, not specific objects).
      *   If **Q1=A** (Cicadas) & **Q6=A** (Mystery): **Naturalism (Quine-Putnam)**. (You believe math is true because physics needs it; epistemology is holistic).
      *   If **Q8=B** (Math could vary): **Modal Structuralism**. (Math is about *possible* structures, not actual abstract objects).

  *   **Mostly B's on Q1/Q2 (Anti-Realist Cluster):**
      *   If **Q3=B** (CH indeterminate): **Formalism / Pluralism**. (Math is a game of symbols; truth is relative to axioms).
      *   If **Q3=A** (CH determinate) but **Q2=B** (Physics nominalizable): **Fictionalism (Error Theory)**. (Math statements are false, but useful fictions).
      *   If **Q2=B** & **Q7=B** (Verification matters): **Instrumentalism**. (Math is a tool for prediction, not a system of truths).

  *   **Mixed / Conditional:**
      *   If **Q3=B** & **Q5=B** (General speech): **If-Thenism**. (Math asserts "If axioms hold, then theorem follows," nothing more).

  ***

  ### Part 3: Philosopher's Commentary (For the Organizer)

  **1. Unoccupied or Unstable Combinations**
  *   **The "Explanatory Fictionalist" (Q1=A, Q2=B, Q3=A, Realist Truth but Nominalist Physics):** This is the most unstable cell. If a student says math *explains* the cicadas (Q1=A) but claims math entities *don't exist* (Fictionalism), they are vulnerable to the *Enhanced Indispensability Argument*. Why posit a false explanation as the best explanation? This position is rarely held consistently.
  *   **The "Specific Set Pluralist" (Q4=A, Q3=B):** If $3$ is a *specific* set (Q4=A), it exists in a specific universe of sets. In that universe, CH should be determinate. Claiming CH is indeterminate (Q3=B) implies a multiverse of sets, which undermines the claim that 3 is *one* specific set. This combination is logically tense.
  *   **The "Causal Platonist" (Q6=A & "We have contact"):** If they admit the causal problem (Q6=A) but still claim Platonism without a naturalistic bridge, they are ignoring the Benacerraf challenge. This isn't a position, it's a gap.

  **2. Hard-to-Separate Positions (Flagged for Discussion)**
  *   **Fictionalism vs. Instrumentalism:** Both tell the mathematician "Keep doing math, don't worry about ontology."
      *   *The Difference:* Fictionalists say "2+2=4" is *false* (like "Sherlock Holmes lives on Baker Street"). Instrumentalists say it's *not truth-apt* (like "Pass the salt").
      *   *Extra Question to Separate:* "Is the sentence '2+2=4' the kind of sentence that *could* be false, or is it more like a command/tool?"
  *   **Structuralism vs. Platonism:** Both are Realists (Math is true).
      *   *The Difference:* Ontological commitment to *objects* vs. *relations*.
      *   *Extra Question to Separate:* "If two structures are isomorphic, are they the *same* object or just structurally identical?" (Structuralists say same; Platonists might distinguish).

  **3. Question Efficiency Analysis**
  *   **The Two Heavy Lifters:**
      1.  **Q1 (Cicadas/Explanation):** This does the most work separating Realists from Anti-Realists. It bypasses "existence" and asks about *utility vs. truth*. It forces the Indispensability Argument without naming it.
      2.  **Q3 (Continuum Hypothesis):** This separates Absolutists (Platonists/Structuralists) from Pluralists (Formalists). It targets the nature of mathematical *truth* rather than objects.
  *   **The Redundant Question:**
      *   **Q8 (Counterpossibles):** For working mathematicians, this is the weakest filter. Almost all pure mathematicians operate under the assumption that math is necessary (Answer A). Answer B often confuses "different axioms" with "different facts." It rarely separates positions cleanly for this audience compared to **Q6 (Access)**, which is the primary reason mathematicians become suspicious of metaphysics. If I had to cut one to save space, I would cut Q8 and expand Q6.
