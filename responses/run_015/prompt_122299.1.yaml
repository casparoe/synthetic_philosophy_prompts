  This is a sophisticated impasse, and your frustration is well-founded. You are witnessing a philosopher who has immunized the Church–Turing Thesis (CTT) against falsification by weaving together ontological constraints (physics) and epistemological constraints (knowledge). Her record suggests she is not defending a single monolithic thesis, but rather a **conjunctive constraint** on what counts as "computation."

  Here is the diagnosis of her position, the prediction for the condensed-matter case, and the specific variant you need to bring to seminar to force a separation.

  ### 1. The Candidate Theses
  You identified three possibilities (Physical, Conceptual, Certification). Based on her rulings, these are the three that actually fit the data, refined to match her specific philosophical "tells":

  *   **T1: The Robust Physicalist Thesis.** CTT is a contingent law of nature. However, "physical" implies *robust*. Systems that rely on measure-zero parameters (analog reals) or nomologically dubious structures (Malament–Hogarth) do not count as physical mechanisms. They are mathematical idealizations, not physics.
  *   **T2: The Epistemic Access Thesis.** Computation is not merely an input-output mapping in nature; it is a process that yields *knowledge*. A physical process that correlates with a mathematical truth does not compute that truth unless an agent can verify the correlation. (This aligns with her "rule-following" remark).
  *   **T3: The Finite Surveyability Thesis.** A computation must be decomposable into a finite sequence of checkable steps. This rules out supertasks (infinite steps) and Oracles (steps that are not decomposed).

  **The Synthesis:** She is running a view we might call **Epistemically Constrained Physicalism**. She believes CTT is physically true (T1), but even if it weren't, a violation wouldn't count as "computation" unless it satisfied T2 and T3. This is why her verdicts are overdetermined: she rejects counterexamples that fail the physics *and* she rejects counterexamples that fail the epistemology.

  ### 2. Prediction: She Will Dismiss the Condensed-Matter Case
  **Verdict:** Dismissed.
  **Grounds:** Failure of Epistemic Access (T2).

  **The Reasoning:**
  You believe this case passes the "Physical Buildability" test (dyadic rationals, bounded energy, polynomial time) and the "Surveyability" test (uniform recipe). She will agree on the physics but disagree on the surveyability.

  Her core objection will focus on the **lack of a termination signal or ground-state certificate**. In a standard Turing machine, the "halt" state is observable. In this lattice, the system settles into *a* state in polynomial time, but there is no local measurement that distinguishes the *correct* ground state from a *metastable* state.
  *   **The Argument:** "You have built a physical system that *might* solve the Halting Problem, but you have not built a computer. A computer must tell you when it has the answer. If you cannot distinguish success from failure in a single run, you do not have an effective procedure; you have a probabilistic oracle with an unknown error rate. To verify the output, you would need to solve the Halting Problem independently to check if the lattice was right. Thus, the 'computation' is not surveyable."

  **Closest Precedent:** **Shannon's Analog Computer / Noisy Analog Devices.**
  *   *Why:* In that case, she dismissed the counterexample because the "computation" only worked under idealized noise-free conditions. Once noise was introduced, the real-valued states became indistinguishable.
  *   *Analogy:* Here, the "noise" is thermal metastability. Just as you couldn't distinguish $r$ from $r + \epsilon$ in the analog case, you cannot distinguish $|Ground\rangle$ from $|Metastable\rangle$ in this case. The lack of a **frustration-free** guarantee means the physical state does not carry its own verification.

  **Commitments:**
  *   **By Ruling Against It:** She commits to the view that **computation is an epistemic notion, not just an ontological one.** She admits that physics might contain processes that map inputs to uncomputable outputs, but denies they are "computations" because they don't yield knowledge. This protects the *conceptual* CTT even if the *physical* CTT is false.
  *   **By Ruling For It:** She admits CTT is purely contingent and that "computation" is just "physical input-output mapping." This would undermine her previous dismissals of Oracles and Supertasks (which were also input-output mappings).

  ### 3. The Discriminator: The "Frustration-Free" Variant
  You asked for a variant that separates the readings. Your idea of a "frustration-free redesign" is exactly the right track, but you doubted its efficacy. It is the correct discriminator, but you must frame it carefully to prevent her from waving it away as "physically impossible."

  **The Case:**
  Propose the exact same lattice, but stipulate that the Hamiltonian is **Frustration-Free**.
  *   *Definition:* A Hamiltonian is frustration-free if the global ground state minimizes every local term individually.
  *   *Consequence:* If the system is frustration-free, an agent can verify the system is in the ground state by measuring only local interactions (checking if every local term is minimized).
  *   *The Setup:* The dissipative process still drives the system to the ground state in polynomial time. The ground state still encodes the Halting Problem.

  **Why This Cuts:**
  This variant satisfies **T2 (Epistemic Access)** because the output is now locally verifiable. You can measure the lattice and *know* if it is in the ground state.
  *   **If she accepts this case:** She is a **Pure Physicalist (T1)**. She admits that if physics allows it, it is computation, regardless of prior logical commitments. This would be a massive concession, effectively admitting CTT is empirical.
  *   **If she rejects this case:** She must argue that **such a Hamiltonian cannot exist.** This reveals she is a **Conceptualist/Logicist**. She believes the laws of physics are constrained by logical computability (i.e., "No physical system can solve Halting" is a priori true, not just empirically observed).

  **Why Your Other Discriminator Fails:**
  *   *The "Explicit Numerical Procedure" Variant:* She will dismiss this immediately as a simulation. If you write a numerical procedure that solves Halting, she will say, "Prove it works." If you can't prove it (because it's undecidable), it's not a procedure. It collapses back into the Lucas-Penrose dismissal.
  *   *The "Frustration-Free" Variant:* This forces her to confront the **Physical vs. Logical** boundary. The only reason to reject a frustration-free, poly-time cooling system that solves Halting is if one believes such a system is *logically* incompatible with physics.

  ### 4. Strategic Advice for Seminar
  Do not present the Frustration-Free case as "Here is a working hypercomputer." Present it as a **Dilemma**.

  **Script:**
  > "Convener, you dismissed the dissipative lattice because we lack certification of the ground state. Suppose we modify the proposal: The Hamiltonian is frustration-free, so the ground state is locally verifiable. The cooling process remains polynomial.
  >
  > This satisfies your 'Surveyability' constraint (we can verify the output) and your 'Physical' constraint (finite precision, bounded energy).
  >
  > If you reject this, you are claiming that **no such physical system can exist**, which implies the Church–Turing thesis is a constraint on physical law itself (a priori).
  > If you accept this, you are claiming that **computation is defined by physical capability**, even if it violates logical computability (a posteriori).
  >
  > Which is it? Is CTT a law of physics, or a definition of procedure?"

  **Why this works:**
  It prevents her from using the "overdetermination" defense. She cannot say "It fails physics AND epistemology." In this variant, it passes epistemology. She must choose: either admit CTT is empirical (and potentially false) or admit CTT is analytic (and constrains physics).

  **One Warning:**
  Be prepared for her to argue that a frustration-free Hamiltonian encoding the Halting Problem is **mathematically impossible** (e.g., implying $\text{P} = \text{NP}$ or $\text{QMA} = \text{RE}$). If she takes this route, she is retreating to the position that **Logic Constrains Physics**. This is a defensible philosophical position (similar to Kantian constraints on experience), but it contradicts her remark that she would give up CTT "if a hypercomputer were wheeled into her lab." If logic forbids the hypercomputer, none can ever be wheeled in. Catch her on that contradiction.

  **Summary:**
  1.  **Prediction:** She rejects the current case (No verification = No computation).
  2.  **Thesis:** Epistemically Constrained Physicalism.
  3.  **Discriminator:** The Frustration-Free Variant.
  4.  **Goal:** Force her to choose between "CTT is empirical" and "CTT constrains physics."
