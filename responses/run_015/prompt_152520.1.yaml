  I am trying to understand a recurring structural pattern I have noticed in informal discussions about whether symbolic representations can causally influence the physical systems that realize them, and I do not know whether philosophers have already named and mapped it. The pattern involves three layers rather than two. At the top are symbols in the ordinary sense—abstract, syntactically structured items whose manipulation follows rules. At the bottom is the physical substrate—the neurons, circuits, or silicon that actually do the work. Between them, however, there appears an intermediate layer that I have been calling, in my private notes, a careenium: a functional organization composed of entities I refer to as simmballs, which are not reducible to particular physical states but are also not fully detached from them, since they are defined by the causal roles they play within the substrate. The central question in this architecture is whether symbols push the substrate around directly, or whether they only do so by reconfiguring the careenium, which then exerts downward causal pressure on the base layer. Those who defend the middle layer say it preserves both the autonomy of symbolic reasoning and the causal closure of the physical, because the careenium is multiply realizable yet genuinely constraining. Those who reject it say that if the careenium is causally efficacious it either collapses into the substrate or introduces an unexplained interaction that was meant to be eliminated. I want to know whether this specific three-layer picture—symbols, careenium with its simmballs, and substrate—together with the debate about whether the middle layer saves downward causation or merely relocates it, has an established name in philosophy of mind, cognitive science, or philosophy of computation. How does it differ from standard functionalism, from symbol grounding problems as usually formulated, and from debates about mental causation? If there is no standard term, I would like the phenomenon precisely delineated—what belongs to it, what does not, and where its edges lie—rather than a bare label. Please answer in continuous prose only, with no headings, bullet points, bold text, or tables, the way one writes a letter or email.
