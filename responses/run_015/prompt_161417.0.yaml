      *   *1969 US Renunciation of Offensive Biological Weapons:* Nixon unilaterally stopped.
          *   *User's View:* This is the strongest challenge. Nixon gave up the asset. Did he get value? Yes, it paved the way for the BWC (Biological Weapons Convention).
          *   *Verdict:* Significant Counterexample (High Weight). Needs careful handling. Did it spend the asset? Or was the asset too costly to maintain?
      *   *Blinding Laser Weapons (1995 Protocol IV):* Banned before fielding.
          *   *User's View:* Absorbable. The "prize" (military utility) was deemed low compared to humanitarian cost. Not a hot race where both sides were investing heavily.
