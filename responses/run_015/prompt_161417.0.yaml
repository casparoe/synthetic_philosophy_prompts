  5.  **Distinguishing Concessions vs. Wave-offs:**

      *   *Concede:* If verification technology improves drastically (making restraint observable), the "asymmetry" weakens.
      *   *Wave off:* Cases where restraint happened but led to exploitation (e.g., interwar naval treaties where Japan cheated). This confirms the view.

  6.  **Observable Predictions (Differentiation):**

      *   *Optimistic View:* Leader slows down -> Follower slows down (matching).
      *   *User's View:* Leader slows down -> Follower speeds up (exploiting).
      *   *Metric:* Correlation between Leader's Pace and Follower's Pace. Negative correlation supports User; Positive supports Optimist.
