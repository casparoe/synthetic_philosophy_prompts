      Welcome to the client support portal. Our underwriting methodology utilises imprecise probabilities to ensure epistemic rigour. Below you will find answers regarding our assessment procedures, pricing structures, and coverage availability. Please review our Methodology Note 4.2 regarding the formation of the Committee before submitting a claim enquiry.

      **Frequently Asked Questions**

      **Why has my quote not arrived?**
      We do not issue single-figure premiums. For any event, our belief is a set of probability functions, which we call the Committee. Each member is a complete and internally coherent assignment of degrees of belief. The figure we publish is the range spanned by the Committee. Until this range narrows, no specific quote can be generated.

      **What does this range represent?**
      A member's degree of belief is the price at which it would buy or sell a £1 stake on that proposition. Consequently, our published range is the band of odds at which we will neither buy nor sell. Inside the band the firm takes no position. This is a considered policy rather than an evasion; we refuse to trade where our internal coherence is not unanimous.

      **Why do competitors publish single numbers?**
      They cater to an aversion to ambiguity. Preferring the urn of known composition, whether one is betting on red or on black, cannot be represented by any single assignment of probabilities. We prioritise accurate representation of uncertainty over the comfort of a point estimate. See Methodology Note 7.1 on Ambiguity Aversion.

      **Why does your uncertainty increase when I provide more data?**
      You are observing dilation. Our range for a hypothesis can widen when we learn something we take to be irrelevant to that hypothesis. This is a feature of our humility. It acknowledges that information can degrade the precision of our classification without altering the underlying risk profile.

      **Is this range just a probability about a probability?**
      No. The range is not a compressed way of reporting a single, sharp credence about the range itself. We resist that reduction. To assign a sharp credence to the bounds would require a higher-order Committee, leading to an infinite regress. We remain at the level of the set.

      **Is your position simply vague?**
      There is a distinction. Our imprecision is where every member is perfectly precise and the firm has merely not decided which member speaks for it. This differs from vagueness, where there is no fact of the matter what the firm believes. The distinction is substantive and governs our liability thresholds.

      **Why not assign equal probability to all outcomes?**
      We refuse a uniform assignment. Uniformity presupposes a partition of the possibilities, and different partitions give different answers. Since no single partition is privileged, we cannot commit to a distribution that favours one geometric decomposition of the risk space over another.

      **Will my house be covered if it floods?**
      Coverage requires a premium acceptable to every member of the Committee. Currently, the range for flood risk spans from negligible to total loss. As the intersection of acceptable premiums is empty, no policy is written. You remain self-insured against this contingency.

      **When will you issue a policy?**
      A policy is written only if every member finds the premium acceptable. Our rule is unanimity. The credences themselves leave the choice of rule open, and the rule, not the credences, settles what the firm does. We await consensus.

      **How do I contact an underwriter?**
      You may submit details via the secure portal. However, please note that without a narrowing of the Committee's range, no binding agreement can be formed. We appreciate your patience as we maintain our epistemic standards.

