answer: |-
  Yes, your worry rests on a false presupposition. You are assuming that the dialectical force of a logical theory depends on **deductive coercion**—the ability to force an opponent into triviality or absurdity via explosion.

  That is not how logical theories are adopted or debated. Logical theory choice is **abductive**, not deductive. We choose a logic based on which system offers the best overall account of the relevant data (semantic intuitions, mathematical practice, paradoxes) weighed against its theoretical costs (complexity, counter-intuitive results, violations of classical laws).

  Here is the correction to your framing:

  **1. Explosion is not the source of dialectical leverage.**
  In a debate between a classical logician and a dialetheist, the classical logician does not accept the Law of Non-Contradiction (LNC) because they fear explosion. They accept LNC because they believe it is a fundamental truth about reality or meaning. The threat of explosion is merely a *consequence* of their system, not the *motivation* for it. Therefore, blocking explosion does not remove the dialetheist's ability to argue; it merely removes the threat of triviality, allowing the debate to proceed on substantive grounds.

  **2. The argument is about theoretical cost-benefit, not logical force.**
  The dialetheist's argument is not, "Accept contradiction or else everything is true." The argument is:
  *   **Data:** We have strong intuitions supporting naive truth principles (e.g., "This sentence is false" is true if and only if it is false).
  *   **Classical Cost:** To save classical logic, you must reject naive truth principles, introduce hierarchical languages (Tarski), or posit truth-value gaps. These solutions are often argued to be *ad hoc*, expressively incomplete, or intuitively costly.
  *   **Dialetheic Cost:** To save naive truth principles, we accept that some contradictions are true.
  *   **Conclusion:** Dialetheism is the superior theory because the cost of accepting true contradictions is lower than the cost of the classical revisions required to avoid them.

  **3. Dialetheism is not philosophically inert.**
  A theory is inert if it makes no difference to our understanding of the world or our inferential practices. Dialetheism is not inert because it makes positive, substantive claims that compete with classical logic:
  *   **Semantics:** It claims that natural language is semantically closed and consistent without hierarchy.
  *   **Negation:** It claims that negation is not an exclusionary operator (i.e., $\neg A$ does not necessarily rule out $A$).
  *   **Rationality:** It claims that rational belief can include contradictions in limit cases.

  These are heavy philosophical commitments. The dialetheist compels the classical logician not by threatening explosion, but by arguing that the classical "solutions" to paradoxes are actually *failures* to account for the data of language and truth.

  **Summary**
  You are looking for a deductive lever that forces the classical logician to capitulate. No such lever exists in any philosophical debate. The dialetheist's leverage is **explanatory power**: they argue their system handles semantic paradoxes more naturally than yours, even at the cost of the LNC. That is a standard, robust philosophical argument, not an inert accommodation.
