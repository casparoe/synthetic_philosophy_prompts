  # Membership Eligibility Procedure (MEP-1)
  **Purpose:** Determine if a proposed member belongs to the *demos* for Decision D.
  **Time Limit:** 10 Minutes per proposal.
  **Staff Role:** Apply checklist. Do not debate values. Flag uncertainties for Board Lead.

  ### Step 1: The Authority Test (Binding)
  **Question:** Does Decision D create a legal obligation, restriction, or enforcement action that applies *directly* to this person (not just their employer or landlord)?
  *   **YES:** **ELIGIBLE.** (Stop here. Epistemic access is not required. Authority demands justification.)
      *   *Action:* Mark "Subject to Authority." Proceed to Step 5 (Accommodation Check).
  *   **NO:** Proceed to Step 2.
  *   **UNCLEAR (Legal Gray Area):** **HAND-OFF.** Send to Board Lead for legal interpretation. Do not guess.

  ### Step 2: The Impact Test (Significance)
  **Question:** Will the outcome of Decision D significantly alter this person's safety, health, assets, or livelihood?
  *   **NO:** **INELIGIBLE.** (Stop here.)
      *   *Reason:* Insufficient stake.
  *   **YES:** Proceed to Step 3.
  *   **UNCLEAR (Degree of Harm):** **HAND-OFF.** Send to Board Lead.
      *   *Note:* "Significant" means more than minor inconvenience. High personal resilience (e.g., wealth, mobility) may reduce significance.

  ### Step 3: The Reciprocity Test (Epistemic Access)
  **Question:** Given their current resources, language, and time, can this person understand the core reasons for the decision and contest them effectively?
  *   **NO:** **INELIGIBLE.** (Stop here.)
      *   *Reason:* Affected parties must be able to engage in reciprocal justification.
      *   *Exception:* If translation or technical briefings can fix this *before* deliberation starts, answer YES.
  *   **YES:** **ELIGIBLE.**
  *   **UNCLEAR (Capacity vs. Effort):** **HAND-OFF.** Send to Board Lead.

  ### Step 4: The Tension Flag (Mandatory)
  If eligibility is determined, check for the following conflicts. If any apply, attach the **Tension Flag** to the recommendation.
  *   [ ] **Authority/Capacity Mismatch:** Member is eligible via Step 1 (Authority) but lacks language/technical skills to deliberate without heavy accommodation.
  *   [ ] **Residency/Tax Mismatch:** Member is eligible but contributes no local fiscal resources.
  *   [ ] **Jurisdiction Mismatch:** Member is eligible but resides outside the board's geographic boundary.

  ### Step 5: Accommodation Note (If Eligible)
  Briefly state what is required to make their participation real (e.g., "Requires Spanish translation," "Requires plain-language summary").

  ***

  # Application to Cases

  ### Case 1: Permanent Remote Worker
  *   **Profile:** Lives in watershed, works out-of-state, pays no local taxes, no family ties.
  *   **Step 1 (Authority):** **NO.** Local climate regulations target property owners and legal residents. As a non-taxpaying non-resident, enforcement orders (e.g., fines) do not bind him directly.
  *   **Step 2 (Impact):** **HAND-OFF / NO.** He is physically affected by climate risk. However, his high mobility and income suggest high resilience.
      *   *Decision:* Staff recommends **INELIGIBLE** based on low significance of impact relative to adaptive capacity.
      *   *Tension Flag:* **Residency/Tax Mismatch.** He is physically present but excluded.
      *   *Outcome:* **EXCLUDED.** (Annoys: Liberals/Neighbors who value "presence" over legal status).

  ### Case 2: Seasonal Agricultural Worker
  *   **Profile:** Present 4 months, employer housing, limited English, no access to technical reports.
  *   **Step 1 (Authority):** **YES.** Emergency evacuation and water-use orders apply to *all persons* within the zone, regardless of tenancy or citizenship. He is legally bound to comply.
  *   **Step 2 (Impact):** **SKIPPED.** (Authority test passed).
  *   **Step 3 (Epistemic):** **SKIPPED.** (Authority test waives epistemic requirement).
  *   **Tension Flag:** **Authority/Capacity Mismatch.** Member is legally bound but cannot access technical deliberation without significant support.
  *   **Accommodation Note:** Requires full Spanish translation and simplified technical briefings.
  *   **Outcome:** **ELIGIBLE.** (Annoys: Deliberative purists who argue he cannot "contest reasons" meaningfully).

  ### Case 3: Downstream Municipality
  *   **Profile:** Outside jurisdiction, suffering increased flooding risk from upstream retention.
  *   **Step 1 (Authority):** **NO.** They are a separate legal entity; this board cannot fine or order them.
  *   **Step 2 (Impact):** **YES.** Increased flooding risk is a significant safety and asset threat.
  *   **Step 3 (Epistemic):** **YES.** As a municipality, they have staff who can access and contest hydrology reports.
  *   **Tension Flag:** **Jurisdiction Mismatch.** Non-members getting voting rights.
  *   **Outcome:** **ELIGIBLE.** (Annoys: Local protectionists).

  ***

  # What This Procedure Cannot Do (Misfire Points)

  **1. Future Generations**
  This procedure requires a "real epistemic position" to contest reasons. Unborn people cannot contest.
  *   *Result:* They will always fail Step 3.
  *   *Fix:* Requires a separate proxy mandate (e.g., "Ombudsman for Future Generations"), not this checklist.

  **2. Non-Human Animals / Ecosystems**
  Nature cannot understand or contest reasons.
  *   *Result:* They will always fail Step 3.
  *   *Fix:* Requires a guardianship model, not membership.

  **3. The "Significance" Threshold (Step 2)**
  Determining if an impact is "significant" vs. "manageable" is a value judgment, not a fact.
  *   *Risk:* Staff bias may exclude vulnerable people deemed "resilient" (see Case 1).
  *   *Fix:* Always Hand-Off borderline impact cases to the Board Lead.

  **4. Epistemic Accommodation Limits**
  Step 3 asks if access *can* be given. It does not calculate cost.
  *   *Risk:* A group might be eligible but too expensive to accommodate (e.g., 50 languages).
  *   *Fix:* Budget constraints must be handled by the Board Lead, not this checklist.

  **5. Corporate Entities**
  The procedure asks if "you" can understand reasons. Corporations act through agents.
  *   *Risk:* Ambiguity on whether the *firm* or the *representative* is being tested.
  *   *Fix:* Treat corporate proposals as "Representative of Asset Interest." Apply Step 1 (Authority on assets) and Step 3 (Agent's capacity).
