      *   **The Calculation (The Meat):**
          *   Start with Gross Performance Value.
          *   Deduct "Genetic Endowment" (IQ, stamina).
          *   Deduct "Socioeconomic Tailwinds" (parents, stability).
          *   Deduct "Luck/Chance" (avoiding accidents, lucky breaks).
          *   Deduct "Successful Gambles" (risk-taking that paid off).
          *   Compare to "Counterfactual Baseline Employee" (CFBE).
      *   **The Result:** The net merit pay is tiny or negative.
      *   **The Fix:** Introduce the "Universal Subsistence Allowance" (USA) but emphasize it's *not* merit-based.
      *   **Footnotes:** Clarify the cold logic.
      *   **FAQ:** Address common concerns (why effort doesn't count, etc.).

  3.  **Drafting - Content & Tone Check:**
