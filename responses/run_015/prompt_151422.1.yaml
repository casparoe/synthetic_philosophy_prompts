answer: |-
  This is not a dumb question. You have isolated the precise pressure point where metaphysical theories of persistence crack. You are describing the collision between **Continuity** (the history of the harbour ship) and **Uniqueness** (the logical requirement that identity be one-to-one).

  Yes, this has been isolated, named, and fought over. Here is the carving you are asking for.

  ### 1. The Names
  There are three labels for this phenomenon, depending on whether you are looking at the logical constraint, the theoretical solution, or the historical argument.

  *   **The Only One Condition (OOC):** This is the formal constraint. It states that for $X$ at $t_1$ to be identical to $Y$ at $t_2$, there cannot be a distinct $Z$ at $t_2$ that is *also* identical to $X$. Identity is an equivalence relation; it must be unique. If the reassembled ship exists, the harbour ship cannot *also* be the original, because then the reassembled ship and the harbour ship would have to be identical to each other (which they are not).
  *   **The Reduplication Argument:** Coined by Bernard Williams (in the context of personal identity), this is the specific thought experiment you are running. It demonstrates that psychological or physical continuity alone is insufficient for identity if it can be duplicated. If one copy exists, identity holds; if two exist, identity vanishes.
  *   **Best Candidate Theory (or Closest Continuer):** Proposed by Robert Nozick (and others), this is the theory that *accepts* your observation as a feature, not a bug. It claims identity is not intrinsic but **comparative**. $X$ is the same as $Y$ only if $Y$ is the *best* candidate among all available competitors. If a better competitor appears (the reassembled ship), $Y$ loses the title.

  ### 2. The Theoretical Status: Intrinsicness vs. Extrinsicness
  You asked what exactly is claimed to be happening. The core philosophical battle is over **The Intrinsicness Principle**.

  *   **The Intrinsicness Principle:** Most philosophers want identity to be *intrinsic*. Whether *this* ship is Theseus's ship should depend only on the history and properties of *this* ship, not on what happens to a pile of wood in a shed across town.
  *   **The Violation:** Your Scenario B violates this principle. It makes identity **extrinsic**. The status of the harbour ship changes based on facts external to it (the existence of the shed-ship).

  **The Carving:**
  *   **Defenders of Intrinsicness (e.g., David Lewis):** They deny your friends' intuition. Lewis argues that if the planks are reassembled, there were actually *two* ships overlapping in the harbour all along. One ship went to the shed, one stayed in the harbour. Your friends' hesitation is a linguistic confusion, not a metaphysical reality.
  *   **Defenders of Best Candidate (e.g., Nozick):** They accept your friends' intuition. Identity *is* extrinsic. It is a role filled by the object that best satisfies the criteria relative to the competition.

  ### 3. The Edges (Answering Your Probes)
  You asked for the boundaries of this phenomenon. Here is how the literature carves them:

  **A. How good does the rival have to be?**
  *   **Threshold:** Under Best Candidate Theory, the rival must be a *viable* candidate. If the shed planks are burned (Scenario A), there is no rival. If they are reassembled into a pile of dust, there is no rival. They must be reassembled into a *seaworthy ship* (functional continuity) to count.
  *   **The "Tie" Problem:** If the harbour ship and the shed ship are *perfectly* equal candidates (50/50 continuity), the OOC dictates that **neither** is the original. Identity dissolves. This is distinct from vagueness; it is a logical exclusion.

  **B. Actual vs. Possible?**
  *   **Actual:** The OOC generally requires an *actual* rival to break identity. If the planks *could* have been reassembled but weren't, the harbour ship remains Theseus's ship.
  *   **Modal Exception:** Some essentialists argue that if a rival is *possible* in a nearby possible world, it creates modal uncertainty, but this is a minority view. Your friends' hesitation in Scenario B is driven by the *actuality* of the rival.

  **C. Contemporaneous vs. Future?**
  *   **Your Probe:** "Reassembly happens 200 years later."
  *   **The Verdict:** Under **Endurantism** (objects are wholly present at each time), the future reassembly does not retroactively change the identity at Year 1. The ship was Theseus's at Year 1; it just ceases to be later.
  *   **Under Perdurantism (Four-Dimensionalism):** The ship is a spacetime worm. If the worm branches (one part to harbour, one to shed), the identity is ambiguous at the branch point.
  *   **Best Candidate View:** Yes, it can be retroactive. If identity is determined by the "closest continuer," and a closer continuer appears 200 years later, the previous identity claim is invalidated. This is the most counter-intuitive edge, and why many reject Best Candidate theory.

  **D. Three or More Rivals?**
  *   The logic scales. If there are three candidates (Harbour, Shed, Museum), and none is clearly "closest," identity dissolves for all of them. If one is clearly superior (90% original planks vs. 50% vs 10%), that one wins. The OOC is binary (One or None), but the *selection* is comparative.

  ### 4. Distinction from Vagueness and "No Fact of the Matter"
  This is the most critical distinction you requested.

  *   **Vagueness (Sorites):** This is about *degree*. "At which plank does it stop being the same ship?" In your Scenario A, your friends ignore this. They don't care about the cutoff. They are confident despite the vagueness.
  *   **No Fact of the Matter:** This claims the question is meaningless.
  *   **The Rivalry Effect (Your Phenomenon):** This is **structural**, not scalar. It is not about *how many* planks changed; it is about *how many claimants* exist.
      *   In Scenario A: 1 Claimant $\rightarrow$ Identity = True.
      *   In Scenario B: 2 Claimants $\rightarrow$ Identity = Indeterminate/False.
      *   The switch from A to B is not a slide along a spectrum (vagueness); it is a **phase shift** caused by the introduction of a second variable in the equation.

  ### Summary Definition
  If you need to name this for your dinner table, call it **The Extrinsicity of Identity via Competing Candidates.**

  It is the phenomenon where the truth value of an identity statement ($A = B$) is dependent not on the intrinsic properties or history of $A$ or $B$, but on the **non-existence of a distinct $C$** that possesses an equal or better claim to identity with $A$.

  It differs from vagueness because it is not about the *quality* of the continuity, but the *uniqueness* of the candidate. It differs from "no fact of the matter" because the rule is strict: **Identity requires uniqueness.** If uniqueness is violated, identity fails. It is not that we don't know; it is that the logical conditions for the word "same" are no longer met.

  Your friends are intuitively acting as **Best Candidate Theorists**. They believe identity is a title awarded to the best continuer, provided no rival holds an equal claim. When you burn the planks, you remove the rival, and the title is secure. When you reassemble them, you create a rival, and the title is contested. The harbour ship hasn't changed, but its *status* has, because status is relational.
