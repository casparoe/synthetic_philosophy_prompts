      3. Holistic Fit (0.7): Unlimited data forces high internal consistency on the T-theory.
      4. Normative Rationality (0.3): Loss minimization diverges from truth maximization in edge cases.

      Combination: Multiplicative bottleneck logic. High holism can't save low grounding.

