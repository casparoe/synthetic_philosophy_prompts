  **MEMORANDUM**

  **TO:** Principal Investigator, Cognitive Science Department
  **FROM:** University Interdisciplinary Research-Ethics Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #24-09: "Private Lexicon Study"

  **DECISION:** Conditional Approval

  The Panel has reviewed the proposal for the "Private Lexicon Study," in which participants develop idiosyncratic, untranslatable terms for internal states to test the stability of private reference. After deliberation, the Panel issues a decision of **Conditional Approval**. The study may proceed only if the investigators implement the methodological modifications outlined below. This decision rests on a synthesis of the philosophical arguments presented by the investigators and the methodological objections raised by reviewers.

  **Engagement with the Investigator's Philosophical Premise**
  The Panel acknowledges the sophistication of the Principal Investigator's appeal to private ostensive definition. We accept the premise that first-person authority is a genuine phenomenological reality. The argument that a subject can correct their own past usage of a term based on internal memory-traces, without external verification, is not dismissed as incoherent. There is a meaningful sense in which an individual can maintain a consistent calibration of sensation against a self-generated signifier. To deny this capacity outright would be to ignore the lived reality of introspection and the private nature of qualia. The Panel agrees that Wittgensteinian constraints on public language games do not necessarily negate the *experience* of private consistency. Therefore, the study's aim to document the *process* of this calibration is philosophically legitimate and warrants investigation.

  **Weighting the Methodological Objection**
  However, in granting approval, the Panel must give full weight to the strongest objection raised by the critics: that genuinely private terms yield no communicable data, and thus cannot function as variables in empirical research. This objection is decisive regarding the *status* of the data, if not the *experience* of the participant. Empirical science, by definition, requires intersubjective verifiability. If a term is deliberately untranslatable and corrected only by private ostension, it remains inaccessible to the researcher. A dataset that cannot be read, analyzed, or verified by the scientific community is not data; it is a collection of sealed envelopes. If the terms remain truly private at the conclusion of the study, the research question cannot be answered, rendering the participation of human subjects an unethical use of resources and time. The objection that "non-private terms defeat the study's purpose" is noted, but the counter-objection that "private terms defeat the study's validity" is paramount.

  **Required Modifications**
  To resolve this tension between philosophical validity and empirical necessity, the Panel requires the following modification to the protocol:

  1.  **Retrospective Mapping Phase:** While participants must use their private lexicon without external correction during the eight-week tracking period, the protocol must include a mandatory debriefing session immediately following the final self-report. In this session, participants must attempt to map their private terms to public language descriptors, analog scales, or physiological correlates.
  2.  **Data Accessibility:** The "private" nature of the lexicon may be maintained during the data collection phase to satisfy the experimental condition, but it cannot be maintained during the analysis phase. The researchers must possess a key or correlation matrix that renders the self-reports intelligible to the investigative team.

  This modification preserves the investigator's interest in the *formation* and *temporary stability* of private reference while satisfying the ethical requirement that research data must ultimately be communicable and analyzable.

  **Timeline for Response**
  The investigators must submit a revised protocol detailing the Retrospective Mapping Phase and the data management plan for the translation key within **30 calendar days** of this memo. Failure to submit these modifications by **November 25, 2023**, will result in the expiration of this conditional approval and a requirement to resubmit as a new proposal.

  The Panel commends the investigators for engaging with the foundational limits of language and measurement. We look forward to the revised protocol.

  **Signed,**

  *University Interdisciplinary Research-Ethics Panel*
