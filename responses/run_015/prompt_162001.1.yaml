      *So the term should reflect the scaling issue.* **"Non-Linear Complaint Scaling"**?
      *Let's try: **"Moral Counting Unit Ambiguity"**.*
      *Okay, I think **"Complaint Granularity"** is the most intuitive and definable.* I will define it as the property of a set of complaints.

      *Re-evaluating the "Test":*
