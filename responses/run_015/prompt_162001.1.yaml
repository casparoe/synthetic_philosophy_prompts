      *   *The "Separateness of Persons" (Rawls/Nozick):* This warns against treating society as a single entity. The user's Case A (water source) challenges this by suggesting a shared resource makes the complaints linked.
      *   *Scanlon's "Generic Reasons" / "Principle of Individual Reasonableness":* Scanlon tries to handle this by looking at generic reasons anyone could have. But the user is pointing out a gap in how those reasons are individuated.
      *   *The "Numbers Count" Debate (Taurek vs. Kamm):* Usually about saving 1 vs. 5. The user is asking about the *nature* of the 5's complaints, not just the math.
      *   *Common Goods / Public Goods:* Case A looks like a public good problem. But moral philosophy usually treats the *harm* to individuals, not the good itself.
