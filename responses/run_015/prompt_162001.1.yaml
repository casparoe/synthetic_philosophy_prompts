      *   *Proposed Term:* **"Complaint Granularity"**.
      *   *Definition:* The metric for determining whether N agents' objections constitute N distinct moral claims or M distinct claims distributed across N agents.
      *   *Test:* "The Subtraction Test." If you remove Agent A from the scenario, does the total moral weight of the objection decrease by exactly one unit, or does the structure of the objection change?
