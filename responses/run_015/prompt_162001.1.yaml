      *Actually, the prompt asks for a "proposed_term" (term, definition...).* I will propose **"Complaint Granularity"** as the conceptual tool.
      *Wait, looking at the "horror" case.* That's not shared loss, that's *derivative* harm.
      *Looking at the "water" case.* That's *joint* consumption.
