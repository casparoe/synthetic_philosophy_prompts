          *   Honest admission of limitations (what the simulation *can't* reproduce).
          *   **Constraint:** No reading list.

  2.  **Deconstruct the Philosophy:**
      *   *Cognitive Penetration (CP):* The idea that cognitive states (beliefs, desires, expectations) can directly alter perceptual experience (what it *looks* like), not just judgment (what you *say* it is).
      *   *The Challenge:* It's hard to prove CP because people can lie or be biased in reporting without their actual vision changing.
      *   *The Activity:* Needs to create a divergence in reporting based on a hidden cognitive prime, then force the class to interrogate *why* the divergence happened. Was it the eyes or the brain's interpretation?

  3.  **Drafting the Activity - Step-by-Step:**

      *   **Title:** Needs to sound engaging but academic enough. "The Perceptual Jury" or "The Ambiguity Protocol." Let's go with "The Ambiguity Protocol."
      *   **Materials:** Ambiguous images (Face/Vase is classic, but maybe add a second one like the Duck/Rabbit or a threatening/neutral face morph). Printed cards for the "prime."
      *   **The Prime:** The prompt suggests a "resource allocation" card game priming threat detection. This needs to be subtle. If it's too obvious, the blind observers will spot it.
