      *   *Correction:* If they sit in a circle, they might compare cards.
      *   *Solution:* The prime happens *individually* on colored paper before sitting in the circle. Or, the instructor divides the room into "Team Alpha" and "Team Beta" for a warm-up, then mixes them for the Jury.
      *   *Better Solution:* The "Resource Card" is handed out as they enter. Half get Blue (Threat), half get Green (Safety). They are told it's their "Juror ID." The task on the card is the prime. They do it for 5 mins. Then they put it away and sit in the circle.
      *   *The Image:* Needs to be ambiguous regarding *threat*. A Face/Vase is ambiguous regarding object category. A "Angry/Neutral" face morph is better for threat priming. Let's stick to the prompt's Face/Vase but frame the voting as "Hostile Entity vs. Inanimate Object." Or stick to Face/Vase but frame the prime as "Social Threat" vs. "Aesthetic Appreciation."
      *   *Actually, let's stick to the prompt's Face/Vase but tweak the instruction.* If the prime is threat detection, they should be more likely to see the "Face" (agent) than the "Vase" (object).
      *   *Wait, standard Face/Vase:* Face = Agent, Vase = Object.
      *   *Prime:* Group A (Threat) -> Look for Agents. Group B (Neutral) -> Look for Shapes.
      *   *Secrecy:* If they talk, the game breaks. They need a "NDA" vibe. "This is a test of individual perception, do not discuss your prep sheet."

  5.  **Addressing the Failure Point (Observers):**
      *   The prompt worries observers catch on.
      *   *Fix:* Give observers a specific, narrow task. "Count how many times hands go up," not "Watch for patterns." Give them a clipboard with checkboxes. Keep them busy.
      *   *Also:* The prime needs to be subtle. Not "FIND THE ENEMY" but "Circle the items that require immediate attention."

  6.  **Addressing the Limitation (Phenomenology):**
      *   The simulation shows *reporting* differences. It cannot prove *phenomenal* differences. The students will argue about whether they *saw* it or *guessed* it. This is exactly the philosophical point. The simulation *fails* to prove CP, which is the lesson. I need to make sure this is highlighted.

