      *   *Better:* The payoff is for *participation* in the deliberation. The "privilege" is choosing the next topic.
      *   *Actually:* Let's make the payoff about the *observers*. They get a privilege if they spot the split. The Jurors get a privilege if they reach consensus. This creates tension.

