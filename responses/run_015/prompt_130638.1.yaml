      *   **0-10:** Intro & Distribution of "Juror Profiles" (The Prime).
      *   **10-20:** The Prime Task (5 mins) + Collection. Seating in Circle.
      *   **20-35:** The Viewing Rounds (3 rounds of voting).
      *   **35-55:** Open Deliberation (The Argument).
      *   **55-65:** Observer Report.
      *   **65-75:** The Reveal (Priming explained).
      *   **75-80:** The Theory (CP vs. Judgment).

  9.  **Refining the "Threat" Prime:**
      *   To make it work with Face/Vase:
      *   Group A (Threat): "Security Protocol. You are responsible for identifying potential intruders. Review the list of items below. Circle anything that implies human presence." (List includes: Footprints, Voices, Faces, Shadows).
      *   Group B (Neutral): "Cataloging Protocol. You are responsible for inventory. Review the list. Circle anything that is a manufactured object." (List includes: Vases, Tables, Chairs, Buildings).
      *   *Wait, this is too obvious.*
      *   *Subtler:* Word Search or Anagram.
      *   Group A words: Hostile, Watch, Guard, Intruder, Face, Person.
      *   Group B words: Calm, Decor, Pottery, Shape, Line, Vase.
      *   *Task:* "Unscramble these 5 words. You have 3 minutes."
      *   This is a classic semantic priming task. It's quick and effective.

  10. **The "Break" Point:**
      *   What if the voting doesn't split?
      *   Face/Vase is *too* famous. Everyone knows it's both.
      *   *Need a newer ambiguous image.* The "Hollow Mask" or a specific noisy image where a face emerges (Pareidolia).
      *   *Suggestion:* Use a "Noise Image" where a face is barely hidden in static.
      *   *Threat Prime:* Makes you see the face (agent).
      *   *Neutral Prime:* Makes you see noise (object).
      *   *This is scientifically stronger for CP.*
      *   *Let's pivot the image:* Use a "Random Dot Stereogram" style or a high-noise grayscale image where a face *might* be.
      *   *Actually, keep it simple for Comm College.* Use the Face/Vase but frame the *question* differently. "Does this look like something that can watch you?" vs "Does this look like something you can put flowers in?"
      *   *No, keep the prompt's Face/Vase.* It's iconic. The prime needs to be strong enough.
      *   *Revised Prime:* "Scenario Card."
      *   Group A: "You are home alone at night. You hear a noise. Look at this image. Is it a person?"
      *   Group B: "You are in a museum. You see an object. Look at this image. Is it art?"
      *   *Risk:* Observers hear the instructions.
      *   *Fix:* Instructions are written on the cards handed out at the door. "Read silently. Do not share."

  11. **Drafting the Content:**
      *   *Tone:* Professional, actionable, slightly conspiratorial (for the game mechanics).
