answer: |-
  Here is a complete design for the "Visual Jury" activity, tailored for an 80-minute community college session with 12 students. It is designed to be run by the instructor with minimal prep beyond printing materials.

  # Activity Title: The Ambiguity Protocol

  **Objective:** To create a lived divergence in perceptual reporting based on hidden cognitive priming, forcing students to debate whether their *eyes* or their *minds* changed before introducing the theory of Cognitive Penetration.
  **Class Size:** 12 Students (10 Jurors, 2 Observers).
  **Time:** 80 Minutes.
  **Materials:** Printed "Budget Cards" (2 types), Printed Ambiguous Image (Face/Vase), Tally Sheets for Observers, Whiteboard.

  ---

  ## 1. The Setup & Hidden Mechanism (0:00 – 0:15)

  **The Cover Story:**
  Tell the class: *"Today we are testing how groups reach consensus on visual data. We are simulating a jury. Your goal is to earn 'Class Capital' for your team, which you can redeem later for privileges (e.g., picking the next discussion topic, 24-hour extension on an assignment, or choosing the break music)."*

  **The Split (The Prime):**
  As students enter, hand them a card face down.
  *   **Cards 1–5 (The Threat Prime):** Titled **"Security Allocation."**
      *   *Task:* "You have a limited budget. Allocate 100 points across these four categories to maximize safety: **Surveillance, Personnel, Barriers, Alerts.**"
      *   *Hidden Mechanism:* This activates semantic networks related to agents, watching, danger, and human presence.
  *   **Cards 6–10 (The Object Prime):** Titled **"Aesthetic Allocation."**
      *   *Task:* "You have a limited budget. Allocate 100 points across these four categories to maximize beauty: **Lighting, Pottery, Textiles, Flora.**"
      *   *Hidden Mechanism:* This activates semantic networks related to inanimate objects, decor, and stillness.
  *   **Cards 11–12 (The Observers):** Titled **"Data Recorder."**
      *   *Task:* "Your job is to record the speed and direction of votes. Do not participate in the voting. Do not look at the Juror cards."

  **Crucial Instruction:**
  *"Do not discuss your Budget Card with anyone. This is an individual cognitive baseline test. Put the card away once finished."*

  **Seating:**
  Arrange the 10 Jurors in a tight circle. Place the 2 Observers slightly outside the circle with clipboards.

  ---

  ## 2. The Visual Jury (0:15 – 0:35)

  **The Stimulus:**
  Project a high-contrast **Face/Vase** Rubin image. (Do not use the Duck/Rabbit; Face/Vase maps better to Agent vs. Object).

  **Round 1: The Silent Vote (5 mins)**
  *   Instructor: *"Look at the image for 30 seconds. Do not speak. On your slip of paper, write 'FACE' or 'VASE'. Hold it up on my count."*
  *   **Prediction:** The Security Group will heavily vote FACE. The Aesthetic Group will heavily vote VASE.
  *   Observers record the split on their tally sheets.

  **Round 2: The Open Deliberation (15 mins)**
  *   Instructor: *"You have 15 minutes to reach a consensus. You must agree on one label for the image. You earn 5 Class Capital points if the whole group agrees. You earn 0 if you disagree."*
  *   **The Conflict:** This is the core of the lesson. Students will not just say "I think it's a face." They will say, *"It **looks** like a face to me,"* or *"I can't stop seeing the profiles."*
  *   **Instructor Role:** Say nothing. Let the frustration build. If they stall, ask: *"Is anyone seeing something different than the majority? Describe it."*

  ---

  ## 3. The Observer Report (0:35 – 0:45)

  **The Trap:**
  Ask the Observers to present their data.
  *   *"Did the group converge?"* (Likely no).
  *   *"Did you notice any patterns in the initial voting?"*
  *   **Predicted Failure Point:** Observers often notice the split immediately ("Half said Face, half said Vase"). If they mention the *cards*, the game is over.
  *   **Mitigation:** If an Observer says, *"The people with the Security cards voted Face,"* interrupt gently: *"Hold that thought on the cards for the end. Just report the voting pattern."*
  *   If the Observers missed the card correlation, ask the Jurors: *"Why couldn't you agree? Was the image unclear?"*
  *   **Expected Outcome:** Jurors will accuse each other of not looking hard enough, or being stubborn. *"No, I'm telling you, it's staring right at me!"* vs *"It's clearly a ceramic bowl!"*

  ---

  ## 4. The Reveal (0:45 – 0:55)

  **Step 1: The Prime**
  Ask the Security Group to raise their hands. Ask the Aesthetic Group to raise their hands.
  Reveal the tasks on the cards.
  *"Group A was budgeting for Safety. Group B was budgeting for Decor."*

  **Step 2: The Re-Vote**
  Show the image again. Ask for a show of hands.
  *"Now that you know the prime, did your perception change, or just your explanation?"*
  (Usually, the perception snaps back to ambiguous once the cognitive frame is exposed).

  **Step 3: The Payoff**
  Award Class Capital to the Observers for accurate data tracking. Award Capital to the Jurors for honest reporting, regardless of consensus. (Avoid rewarding "winning" the perception, as that incentivizes lying).

  ---

  ## 5. The Theoretical Debrief (0:55 – 1:10)

  **The Pivot:**
  Write two columns on the board: **The Eyes** vs. **The Mind**.

  **Discussion Questions:**
  1.  *"When Group A said 'It looks like a face,' did the light hitting your retina change?"* (No).
  2.  *"Did the experience change, or just your guess?"*
      *   *Student A:* "I guessed face because I was thinking about security." (Post-hoc Judgment Bias).
      *   *Student B:* "No, I literally saw the noses pop out before I even thought about the card." (Cognitive Penetration).
  3.  *"Can you prove to Student A that you really saw it differently?"*

  **The Lesson:**
  Introduce **Cognitive Penetration**.
  *   **Definition:** The hypothesis that cognitive states (beliefs, desires, primes) can alter the *phenomenology* of perception (what it is like to see), not just the judgment (what you say you saw).
  *   **The Problem:** We have no access to each other's phenomenology. We only have reports. This game replicates the *structure* of the philosophical problem: We have divergent reports from identical stimuli, but we cannot empirically settle if the *experience* was penetrated or if the *report* was biased.

  ---

  ## 6. Limitations & Failure Analysis (1:10 – 1:20)

  **Honest Admission (Instructor Script):**
  *"I need to tell you where this simulation fails. This game proved that your **reports** diverged. It did not prove your **vision** diverged. A skeptic could argue you all saw the same pixels, but the Security Group was just more willing to gamble on 'Face' to fit the safety theme. Cognitive Penetration claims the actual visual experience changes. This classroom game cannot prove that. We are stuck with testimony."*

  **Predicted Failure Points & Fixes:**
  1.  **Observers Catch On:** If Observers realize the cards are different during the setup, they might whisper.
      *   *Fix:* Give Observers a specific, absorbing task during the 5-minute prime (e.g., "Count how many times the instructor says the word 'visual'").
  2.  **Students Compare Cards:** If a Security student asks an Aesthetic student "What did you get?", the prime is blown.
      *   *Fix:* Frame the cards as "Confidential Role Assignments." Tell them breaking confidentiality voids the Class Capital for everyone. Social pressure works well in small cohorts.
  3.  **No Split in Voting:** If the Face/Vase is too famous, everyone knows it's both.
      *   *Fix:* Use a **Pareidolia Image** instead (a high-noise grayscale image where a face is faintly hidden in static). The Security prime makes them see the face; the Aesthetic prime makes them see random noise. This is scientifically more robust for threat detection than the Rubin Vase.

  **What This Simulation Cannot Reproduce:**
  *   **The Phenomenological Gap:** The simulation relies on *speech acts* ("I see a face"). It cannot replicate the *qualia* argument. In the real philosophical debate, the proponent of CP argues that the fear *makes* the face look more prominent (e.g., darker shadows, sharper edges). In this game, students can only assert that happened; they cannot demonstrate it. This is the exact epistemic hole in the theory of Cognitive Penetration that the students should leave the class feeling.

  ---

  ## Payoff Scheme: "Class Capital"

  To keep it low-stakes but desirable for community college students:
  *   **10 Points:** "The Extension." (24-hour homework pass, one time use).
  *   **5 Points:** "The DJ." (Choose the music during the next independent work session).
  *   **2 Points:** "The Opener." (Choose the discussion question for the next class).

  *Accumulate points as a whole class.* If the class behaves well and engages deeply, they unlock the rewards. This discourages sabotage of the experiment.

  ---

  ## Instructor Cheat Sheet: Key Distinctions to Draw

  *   **Modularity (Fodor):** The mind has a "vision box" that is sealed off. The Security Prime should *not* change what you see, only what you think. (The Skeptic's view).
  *   **Penetration (Churchland/Pylyshyn):** The vision box is leaky. Beliefs seep into vision. (The Proponent's view).
  *   **The Ambiguity:** The game ends not with an answer, but with the realization that *we can't tell the difference from the outside.* That is the philosophical problem.
