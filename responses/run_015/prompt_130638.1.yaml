          *   25-45: The Viewing & Voting (The "Jury").
          *   45-65: The Deliberation (The Argument).
          *   65-70: The Reveal (Observers speak).
          *   70-80: The Theory (CP vs. Bias).

  4.  **Refining the "Hidden Mechanism" (The Prime):**
