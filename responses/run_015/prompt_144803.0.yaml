answer: |-
  This is a fantastic constraint set for a character. You have built a decision profile that is internally consistent but philosophically distinct from the "standard" rationalist archetype. Most people who claim to follow Updateless Decision Theory (UDT) or Functional Decision Theory (FDT) would actually *smoke* in the Smoking Lesion case. Your character's refusal to smoke is the key that unlocks her specific algorithm.

  Here is the breakdown of her decision rule, her verdict on the new scenario, and the sharp case that exposes her underlying logic.

  ### 1. The Verdict on the 3% Divergent Copy
  **She Cooperates.**

  Here is why: Her refusal to smoke in the Smoking Lesion case proves that she treats **statistical correlation as binding**, even when there is no causal or logical link. In the Smoking Lesion, the gene causes both the cancer and the desire to smoke; smoking itself does nothing. A standard UDT/FDT agent smokes because they know their decision cannot logically influence the past gene. Your character *refuses* to smoke, meaning she believes that acting in a way that correlates with a bad outcome is irrational, regardless of causality.

  In the Prisoner's Dilemma against a 3% divergent copy:
  *   **The Correlation:** There is a ~97% probability that her action matches the copy's action.
  *   **The Calculation:** Since she maximizes expected utility based on these conditional probabilities (Evidential Decision Theory) but does so from a pre-commitment perspective (Updateless), she calculates the expected value of the policy "Cooperate with high-correlation copies."
  *   **The Result:** As long as the correlation (97%) is high enough to make mutual cooperation more valuable than the risk of being exploited, she cooperates. She views the 3% divergence as "noise," not a break in the logical link.

  ### 2. The Rule She Is Running
  She is not running standard FDT/UDT. She is running **Updateless Evidential Decision Theory (UEDT).**

  Here is the distinction:
  *   **Standard FDT/UDT:** Distinguishes between *logical dependence* (my code determines the output) and *physical correlation* (a gene causes both my code and an outcome). FDT agents smoke in the Smoking Lesion because they cannot logically control the gene.
  *   **Your Character (UEDT):** Collapses this distinction. She treats any reliable correlation—whether caused by logical identity, physical common cause, or prediction—as a channel of "control." She acts as if choosing her action *selects* the world where the correlated facts are favorable.

  **Why this fits her profile:**
  1.  **Newcomb (One-box):** EDT and UDT both one-box.
  2.  **PD vs. Copy (Cooperate):** EDT and UDT both cooperate (high correlation).
  3.  **Smoking Lesion (Refuse):** **Only EDT does this.** (Standard UDT smokes). This is her signature move.
  4.  **Counterfactual Mugging (Pay):** Standard EDT would *not* pay if she already knew the coin was tails (because paying gives no benefit then). But **Updateless** EDT pays, because she committed to the policy *before* knowing the coin flip.

  **Character Note:** This creates a fascinating internal tension. She likely *believes* she is running UDT/FDT (the "smart" theory), but her behavior in the Smoking Lesion reveals she is actually running a sophisticated version of EDT. She might justify this by claiming that "logical correlation" includes physical common causes, a controversial stance in decision theory that makes her seem dogmatic or philosophically radical.

  ### 3. Alternative Rules That Fit
  If you want to tweak her motivation, here are two other frameworks that yield the same four verdicts:

  *   **Precommitted Naive EDT:** She is a standard Evidential Decision Theorist who made a binding vow early in life to never "update" on her own actions. This handles the Counterfactual Mugging without needing complex logical uncertainty.
  *   **"Ambient Control" FDT:** A niche variant of FDT where the agent assumes their decision algorithm is logically entangled with *all* physical facts that correlate with it. This is a more "mystical" interpretation of decision theory, implying the universe is more computationally integrated than standard physics suggests.

  ### 4. The Sharp Case (The Distinguisher)
  To truly test her rule against a standard UDT/FDT agent in your plot, you need a scenario where **Evidential Correlation** and **Logical Control** come apart.

  **The Scenario: "The Genetic Prisoner's Dilemma"**

  *   **Setup:** She is paired with a stranger to play a one-shot Prisoner's Dilemma.
  *   **The Twist:** They are not copies. They are not running the same code. However, they are **identical twins separated at birth**, and there is a specific "Cooperation Gene."
  *   **The Mechanics:** This gene causally influences personality traits that lead to cooperation. It does *not* read their source code. It is a physical common cause, not a logical link.
  *   **The Correlation:** Because of the gene, there is a 99% correlation between their actions.

  **The Verdicts:**
  *   **Standard UDT/FDT Agent:** **Defects.** They recognize that their current computation cannot logically influence the stranger's computation. The correlation is physical, not logical. They treat the stranger's move as a fixed fact (like the gene in the Smoking Lesion).
  *   **CDT Agent:** **Defects.** (No causal influence).
  *   **Your Character (UEDT):** **Cooperates.** Because she refused to smoke in the Smoking Lesion, she must cooperate here. To her, the 99% correlation is sufficient to make Cooperation the utility-maximizing choice. She acts as if her cooperation "reaches across" and causes the twin to cooperate, even though she knows it's just a shared gene.

  **Why this works for the plot:**
  This case exposes that she prioritizes **correlation over causality**. It forces her to admit that she is willing to "pay" (by risking defection) to maintain a correlation, even when she has zero leverage over the other party. It highlights her obsession: she is trying to optimize the *map* (the correlations she sees) rather than the *territory* (the causal levers she can pull).

  ### Summary for Consistency
  *   **Rule:** Updateless Evidential Decision Theory (UEDT).
  *   **3% Divergence Case:** Cooperate (Correlation is high enough).
  *   **Philosophical Flaw/Feature:** She treats physical correlations (genes, predictors) as if they were logical dependencies.
  *   **Plot Device:** Use the "Genetic Twin" scenario to show how she differs from a "true" UDT agent, or to show the cost of her philosophy (cooperating when she could have safely defected).

  This makes her a "Naive Evidentialist" with a "Updateless" coat of paint, which is a very rich psychological space for a character obsessed with rationality. She is trying to hack the universe by treating correlations as levers.
