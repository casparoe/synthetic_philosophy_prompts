answer: |-
  This is a sharp tension, and you're right to feel that both sides are talking past each other because they're operating with different definitions of "proof." Here is the breakdown of the thought experiment, weighing the colleague's "computational vindication" against your "formalist betrayal."

  ### Where your colleague has the strongest case
  Your colleague is not just waving hands; they are pointing at the **Curry-Howard correspondence**. This is the teeth of their argument.

  In classical set theory, a proof is a semantic argument that convinces a human reader. In type theory (Lean/Coq), a proof *is* a data structure. If you prove `∃ x, P x`, the proof term literally contains the witness `x`. You can run it. You can extract it. For a constructivist, existence *means* "I can produce one."

  Brouwer's core complaint against Hilbert was that Hilbert allowed existence proofs that provided no method to find the object (e.g., using double-negation elimination on an infinite search space). In Lean or Coq, without axioms like `classical.choice`, you cannot prove an existential without providing the term. In this specific, narrow sense, the *kernel* enforces constructivity harder than any human referee ever could. A human might miss a non-constructive leap; the kernel cannot.

  So, if Brouwer's primary demand is "don't claim you constructed something unless you actually have the construction," the machine is the ultimate enforcer of that norm. It strips away the rhetorical sleight of hand that allows classical mathematicians to pretend they are constructing things when they are merely proving consistency.

  ### The Fundamental Mismatch: Activity vs. Object
  However, this is where your intuition kicks in, and it's the deeper philosophical hurdle. For Brouwer, mathematics is a **mental activity**, not a collection of **static objects**.

  When your colleague says, "the kernel checks a finite object," they are describing a *product*. For Brouwer, the math happened in the *process* of the construction in the mathematician's mind. The written proof (or the code) is merely a fragile attempt to induce a similar construction in another mind.

  By elevating the code to the status of "the proof," the formalisation norm commits the exact error Brouwer accused Hilbert of: it reifies language. It says, "The math is not the insight; the math is the text (or code) that passes the validator."

  If you hand Brouwer a laptop, he would likely say: "You have built a very sophisticated syntax checker. You have ensured your symbols are consistent. You have not done mathematics. You have done bookkeeping." He would view the type checker not as a validator of truth, but as a validator of grammar. For Brouwer, grammatical correctness does not imply mathematical truth (which is experienced internally).

  ### Axis 1: The Classical Library (Lean vs. Coq)
  This is the easiest filter. **Lean (with mathlib) is dead on arrival.**

  It doesn't matter that the kernel *could* support constructivity if the library assumes the Law of Excluded Middle (LEM) and Choice by default. For Brouwer, applying LEM to infinite domains is not just "another axiom"; it is a category error. It treats the infinite as a completed totality that can be surveyed.

  If the "formalisation norm" implies that a paper isn't done until it's in Lean/mathlib, Brouwer would reject the norm immediately because the target environment validates reasoning he considers meaningless. It's like asking a vegetarian to certify their meal at a steakhouse. The fact that the kitchen is clean (the kernel is sound) doesn't matter if the menu is poison (classical axioms).

  So, on this axis, the colleague's argument collapses unless they switch to an intuitionistic mode. But this leads to the harder axis.

  ### Axis 2: Lawlike vs. Choice Sequences (The Creating Subject)
  Suppose we move to Coq, or Lean running in `#auto_derive` intuitionistic mode. We have removed LEM. We have computational extractability. Is Brouwer happy now?

  **No.** And this is where your point about the Creating Subject is decisive.

  Brouwer's later intuitionism (after the split with Heyting) relied heavily on **choice sequences**. These are sequences generated by the free will of the creating subject, not predetermined by a law (algorithm).
  *   **In Coq/Lean:** Every function is lawlike. To define a sequence, you must write a term. That term is an algorithm. It is predetermined.
  *   **In Brouwer's Math:** A choice sequence can be free. At step $n$, the subject chooses a value based on their current state of knowledge, which evolves in time.

  This connects to the **Brouwer-Kripke Schema**. This schema allows truth values to change over time as the subject acquires new proofs. A proposition might be neither true nor false *now*, but become true *later*.
  *   **In Proof Assistants:** Truth is static. A theorem is either provable in the context or it isn't. The kernel has no concept of "time" or "the subject's current epistemic state." It checks a timeless derivation.

  Brouwer used the Creating Subject arguments to refute certain formalist claims (ironically, including some of Heyting's formalizations). He showed that if you treat mathematics as a static formal system, you get results that contradict the lived experience of the mathematical subject.

  If you put Brouwer in front of Coq, he would say: "You have captured the **lawlike** part of mathematics (the algorithms), but you have completely excised the **free** part (the choice sequences). You have formalized the corpse of intuitionism, not the life."

  ### The Verdict: Hilbert with Better Marketing?
  To answer your specific question: **He reads it as Hilbert's Programme with better marketing.**

  Why? Because the goal of the "formalisation norm" is security and verification via an external mechanism.
  *   **Hilbert:** "We ensure truth by checking consistency in a formal system."
  *   **Formalisation Norm:** "We ensure truth by checking type-correctness in a kernel."

  For Brouwer, security comes from **evidence** (the *Evidenz* of the construction in the mind), not **verification** (the check of the symbol manipulation). Shifting the burden of trust from "my insight" to "the kernel" is exactly the shift from intuitionism to formalism.

  The fact that the kernel enforces constructivity is a happy accident of the implementation (because type theory is constructive by default), not a philosophical alignment. It's like a prison that happens to serve vegetarian food; it's still a prison.

  ### Is there *any* version he endorses?
  There is one narrow concession he might make, consistent with his view on language.

  Brouwer allowed language as a **tool for communication**, provided one never confuses the language with the math itself. He might accept a proof assistant as a **pedagogical or communicative device**.
  *   "Here is a code artifact that will help you reconstruct the mental activity I performed."
  *   "Here is a check to ensure I didn't make a silly syntactic error in transmitting my idea to you."

  But he would vehemently reject the **norm** that the paper "isn't done" without it. That implies the math *is* the code. He would insist the math was done when he had the insight; the code is just the press release.

  ### Summary of the Reasoning
  1.  **Colleague's Strength:** They are right that proof assistants enforce "existence implies construction" more rigorously than human peers. The extraction of algorithms is a genuine vindication of the *practical* demand of constructivism.
  2.  **Your Strength:** You are right that Brouwer's ontology is incompatible with formalism. Math is mental time-bound activity; kernels check timeless static objects.
  3.  **Axis 1 (Classical):** Lean/mathlib is an immediate reject. It validates reasoning Brouwer deemed meaningless.
  4.  **Axis 2 (Subject/Time):** Even intuitionistic Coq is a reject for "full" Brouwerian mathematics because it cannot model choice sequences or the temporal evolution of truth (Creating Subject). It captures Heyting's intuitionistic *logic*, which Brouwer himself viewed with suspicion as a formalization of the informal.
  5.  **Conclusion:** The "formalisation norm" is philosophically hostile to Brouwer's view. It substitutes external verification for internal evidence. He would tolerate the tool for communication but reject the claim that it constitutes the completion of the mathematics.

  The honest extrapolation is **"never formalise anything"** if "formalise" means "the formal derivation is the truth-maker." If "formalise" means "write a script to help others check my work," he shrugs and says "fine, but don't call it the math." Given your department's norm implies the former (the paper isn't *done*), Brouwer would vote with your faction, but for deeper reasons than just "classical logic bad." He would argue the very attempt to make the formal check the criterion of completion is a category error.
