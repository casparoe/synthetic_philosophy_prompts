  Hey! Totally feel you on this. The James vs. Clifford debate is classic, but you're right—most textbooks get stuck in the 19th century and ignore how we actually form beliefs now (via Twitter, experts, news, etc.). It's way more about networks than solo reasoning.

  Since you need this for a seminar paper, I've drafted the actual **Joint Statement** you asked for. I tried to make it look like a genuine output from an adversarial collaboration project—so it's formal enough to cite, but it hits those modern angles you wanted (testimony, climate models, etc.).

  I kept the tone of the *document* professional (since it's supposed to be signed by philosophers), but I'm talking to you casually here. You can tweak the formatting to match your syllabus requirements.

  Here's the draft.

  ***

  # JOINT STATEMENT ON EPISTEMIC DUTY AND THE WILL TO BELIEVE
  **Prepared by:** The Adversarial Collaboration Working Group (Evidentialist & Permissivist Wings)
  **Date:** October 24, 2023
  **Subject:** Updating the Clifford-James Debate for Collective Epistemology

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both the Evidentialist (Cliffordian) and Permissivist (Jamesian) signatories as the baseline for our continued dispute.*

  1.  **Nature of Belief:** We agree that belief is not merely a sensory feeling but a dispositional state that guides action and assertion. To believe *p* is to be prepared to act as if *p* is true in relevant contexts.
  2.  **Doxastic Voluntarism:** We reject *direct* doxastic voluntarism (the idea that one can simply choose to believe a proposition at will, like raising an arm). However, we agree on *indirect* voluntarism: agents have control over the habits, environments, and attentional practices that influence belief formation over time.
  3.  **The Shipowner Case:** Both sides condemn the shipowner in Clifford's original example.
      *   *Evidentialist Concession:* The shipowner failed because he actively suppressed doubt to secure profit.
      *   *Permissivist Concession:* The shipowner's option was not "momentous" in James's sense; he could have delayed sailing to inspect the ship. His error was pragmatic as well as epistemic.
  4.  **Testimony and Networks:** We agree that in modern contexts, "evidence" is not limited to first-hand empirical data. Reliance on expert testimony and institutional trust counts as evidential input. Neither side advocates for solipsistic reasoning.
  5.  **Harm Principle:** We agree that beliefs held by individuals can cause harm to others when those beliefs motivate public action or policy. Private belief is rarely strictly private in its consequences.

  ## 2. TABLE OF DISAGREEMENTS
  *The following points remain live disputes. Each statement is phrased neutrally to ensure both sides accept the wording as an accurate description of their divergence.*

  | ID | Core Disagreement | Evidentialist (Cliffordian) Emphasis | Permissivist (Jamesian) Emphasis |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Priority of Norms** | Epistemic duty (avoiding error) is the primary constraint on belief formation, preceding pragmatic concerns. | Pragmatic right (gaining truth/living well) can override strict evidential sufficiency in specific high-stakes contexts. |
  | **D2** | **Definition of "Sufficient"** | "Sufficient evidence" must be objective and intersubjectively verifiable before belief is licensed. | "Sufficient evidence" includes passional factors (hope, fear, commitment) when the option is forced and living. |
  | **D3** | **Suspension of Judgment** | Suspended judgment is the morally default position when evidence is ambiguous. | Suspended judgment can itself be a choice with moral costs; it is not always a neutral default. |

  ## 3. CRUXES AND PREDICTIONS
  *We have identified three specific cruxes where our theoretical differences lead to divergent practical outcomes. For each, we specify a concrete case and record our pre-declared predictions.*

  ### Crux A: The Voluntariness of Trust
  **Question:** Is the decision to trust an expert network a voluntary act subject to moral evaluation, or a passive reception of evidence?
  **Concrete Case:** A patient deciding whether to trust a new medical protocol where long-term data is incomplete but early signals are positive.
  *   **Evidentialist Prediction:** The patient ought to suspend belief until statistical significance is reached. Trusting early is a violation of epistemic duty, even if well-intentioned.
  *   **Permissivist Prediction:** The patient is permitted to believe the protocol works if the option is "living" (they need treatment now) and "forced" (doing nothing is also a risky choice).
  *   **Note on Verbal Dispute:** We suspect part of this disagreement is verbal. The Evidentialist defines "evidence" strictly as data; the Permissivist includes "need" as a form of evidential weight.

  ### Crux B: FLM Options in Testimonial Chains
  **Question:** Do James's criteria (Forced, Living, Momentous) apply to beliefs acquired through indirect testimony, or only to direct existential choices?
  **Concrete Case:** A voter deciding whether to believe a complex economic claim endorsed by their preferred political tribe but contested by neutral analysts.
  *   **Evidentialist Prediction:** James's exceptions do not apply here. This is not a "forced" option (one can abstain from voting or vote based on other issues). Belief on insufficient testimony remains wrong.
  *   **Permissivist Prediction:** In a polarized environment, refusing to adopt the tribe's belief is effectively choosing the opposing side (a forced option). The social cost of suspension makes the option momentous.
  *   **Shared Observation:** Both sides agree that social pressure *feels* forced, but disagree on whether that feeling justifies belief.

  ### Crux C: Moral Asymmetry in Collective Action
  **Question:** In high-stakes collective contexts, is the error of False Belief (acting on bad data) worse than the error of Suspended Judgment (waiting for more data)?
  **Concrete Case:** A research committee deciding whether to authorize emergency geoengineering based on ambiguous climate-model outputs.
  *   **Evidentialist Prediction:** False Belief is worse. Acting on ambiguous models risks catastrophic unintended side effects. The duty is to avoid the error of commission.
  *   **Permissivist Prediction:** Suspended Judgment is worse. Waiting for certainty may allow the climate threshold to pass. The duty is to avoid the error of omission.
  *   **Verbal Dispute Check:** We agree this is **not** merely verbal. This is a substantive ethical disagreement about risk tolerance, not just a definition of "belief."

  ## 4. CONCLUSION
  While we remain divided on the normative priority of evidence versus passional need, we agree that the "Shipowner" model is insufficient for modern epistemology. Future work must address how *collective* belief formation alters the distribution of epistemic responsibility.

  ***

  ### Quick notes for your paper (from me to you):
  1.  **The "Verbal Dispute" bit:** I made sure to flag Crux A as potentially verbal (about the definition of evidence) but Crux C as substantive. Professors love that distinction. It shows you know when they're just talking past each other.
  2.  **Modernizing:** Notice how I swapped the "ship" for "climate models" and "medical protocols" in the cruxes. That hits your requirement about expert networks/high-stakes contexts.
  3.  **Voluntarism:** I made sure to clarify *indirect* voluntarism in Section 1. If you claim we can just "choose" beliefs directly, most analytic profs will mark that down as a misunderstanding of doxastic involuntarism.
  4.  **Typos:** I cleaned up the stuff from your prompt, but double-check the formatting when you paste it into your doc.

  Hope this unblocks the study group! Good luck with the seminar.
