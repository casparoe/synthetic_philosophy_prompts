  ## Part 4: Stability & Indistinguishability Notes

  **1. The CBP vs. Minimal-Distance Trap (Q8)**
  If your group scores **Leaf 2 (Conclusion)** and **Leaf 6 (Minimal-Distance)**, you have not actually chosen a rule. In the standard 3-person case, they yield the same result *unless* you assign a "cost" to flipping votes.
  *   *To Separate:* You must answer Q8. If you say "Flip the Conclusion" (Q8-B), Minimal-Distance *becomes* Conclusion-Based. If you say "Flip the Premise" (Q8-A), Minimal-Distance becomes Premise-Based.
  *   *Action:* If you land here, you must define a "Flip Cost Matrix" before the next vote.

  **2. The Unstable Patterns**
  *   **Q1 + Q9 Conflict:** If you vote **Premise-Based (Q1-A)** but **Default to Ship (Q9-B)**, your rule collapses under time pressure. You are Premise-Based only when it's convenient.
  *   **Q3 + Q1 Conflict:** If you vote **Expert-Deference on P (Q3-A)** but **Conclusion-Based (Q1-B)**, the Expert's view on P might be overridden by the Majority on R. This renders Q3 meaningless.
  *   **Q7 Sensitivity:** If your result flips depending on whether P is split into P1/P2 (Q7), your rule is **Agenda-Vulnerable**. Premise-Based rules are highly sensitive to this. Conclusion-Based rules are less sensitive.

  **3. The "No Decision" (Option C) Accumulation**
  *   If you have >4 **C** answers: You are **Leaf 10 (Illegitimate)**. Your committee does not currently have a valid decision procedure. Do not vote on the next release. Escalate the charter design first.
  *   If you have 2-3 **C** answers: You are in **Leaf 8 (Deliberative)** but lack a hard default. You risk paralysis. You must answer Q9 definitively.

  **4. Practical Recommendation**
  If the group splits between **Leaf 1 (Premise)** and **Leaf 2 (Conclusion)**:
  *   Adopt **Leaf 3 (Premise-Weighted)**. It satisfies the safety concern (high bar on P) without completely ignoring the majority will on R (since P is harder to pass).
  *   *Awkward Commitment Check:* Ensure everyone signs off on the statement: *"We accept that we may ship a model where the majority believes P is True, because we could not reach the supermajority required to act on that belief."*
