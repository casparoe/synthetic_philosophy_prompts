  3.  **Evaluate Claims from an Epiphenomenalist's Perspective:**
      *   *Claim 1 (Definition):* Generally accepted. Fair statement.
      *   *Claim 2 (Consistency):* Contested. It's not logically inconsistent (contradictory), but pragmatically self-defeating (undermines justification).
      *   *Claim 3 (Causal Chain):* Accepted by epiphenomenalist. Physical causes physical.
      *   *Claim 4 (Causal Theory of Content/Reference):* **The Crux.** This is the slide. Epiphenomenalists usually reject a *purely* causal theory of reference for phenomenal concepts. They might accept causal theories for external objects but argue phenomenal reference is direct, non-causal, or constituted by acquaintance.
      *   *Claim 5 (Neural Cause):* Accepted.
      *   *Claim 6 (No Knowledge):* Rejected. Depends on Claim 4. If reference isn't purely causal, knowledge is possible.
      *   *Claim 7 (Cannot Believe Truly):* Rejected. Same reason.
      *   *Claim 8 (Strongest Argument):* Widely regarded as strong, but "demonstration" is too strong. It's a *prima facie* problem, not a knock-down proof.

  4.  **Address User's Hunches:**
