      *   *Assessment:* This is a standard move (often associated with "acquaintance" or "constitutive" accounts of phenomenal concepts). It's not just a label; it's the core defense.
      *   *Stability:* It risks dualism of explanation. If the content is fixed by experience but the occurrence by physics, how do they line up reliably? (The "Pre-established Harmony" worry). It's stable *if* one accepts non-causal reference, but vulnerable to evolutionary/alignment objections.

  6.  **Evaluate the "General Template" Question:**
      *   *Comparison:* Eliminativism ("I don't have beliefs" is a belief), Global Skepticism ("I know nothing" is knowledge).
      *   *Analysis:* Yes, it shares the structure of "pragmatic self-refutation." However, epiphenomenalism is unique because it posits the *existence* of the thing but severs the *link* required to talk about it. Eliminativism denies existence. Skepticism denies access. Epiphenomenalism affirms existence but denies access *causally*.
      *   *Implication:* If the argument works too well, it might prove too much (e.g., against abstract objects). But usually, it's treated as specific to the causal theory of reference.

  7.  **Drafting the Response (Iterative refinement):**
