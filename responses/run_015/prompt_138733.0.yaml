      *   Memo format.
      *   No personal advice ("I think you should..."), write *as* the memo.
      *   Address the "dialetheist" comment briefly (acknowledge the distinction but focus on operational risk).
      *   Ensure the "Change of Mind" section is distinct.

  7.  **Final Polish:**
