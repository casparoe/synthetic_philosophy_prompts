  *(Word Count Management)*: Keep intro short. Get straight to the recommendation.

  *(Final Check on "Change of Mind")*: Needs to be honest about where the reasoning is shaky. Probably the assumption that "Retain on Conflict" is always the safe legal choice (might violate plan terms to keep too long? Usually less risky than deleting too soon, but worth noting).

