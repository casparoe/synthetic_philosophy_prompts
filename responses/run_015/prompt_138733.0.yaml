      *   *Provenance:* Explosion blocking (logic property) != Provenance (audit property). We need both. Engine must log which rules contributed to the answer.
      *   *Skeptic's View:* It's a modeling failure. Rules should have metadata precedence (State > Plan). Fix the data model, not the logic engine.
