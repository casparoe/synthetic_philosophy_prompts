answer: |-
  **Joint Statement of Adversarial Collaboration: Pluralist Cooperation Agreements**

  **Section 1: Agreed Claims**

  1.  **Definition:** A pluralist cooperation agreement is a conditional commitment where Agent A supports Agent B's priority project, contingent on B supporting A's priority project, despite mutual disagreement on the ultimate value of those projects.
  2.  **Disagreement Reality:** The participating agents hold genuinely incompatible first-order moral judgments; the practice does not require resolving these judgments to proceed.
  3.  **Resource Constraints:** All agents face budget constraints where funding one project necessitates excluding another; opportunity costs are real and non-trivial.
  4.  **Feasibility Thresholds:** (Non-convexity Case) Trade is only instrumentally rational if the pooled resources exceed the effectiveness thresholds of the chosen projects; splitting resources below threshold levels renders both parties worse off than no trade.
  5.  **Selection Effects:** (Revealed-Conviction Case) The population of agents willing to trade is not identical to the general population of agents; willingness to trade correlates with specific psychological or strategic dispositions that must be measured.
  6.  **Integrity Dynamics:** (Erosion Case) Participation in trade alters the motivational dispositions of agents over time; whether this alteration constitutes corruption or stabilization is an empirical question, not a conceptual truth.
  7.  **Third-Party Impacts:** (Bystander Case) Agreements generate externalities for constituencies not party to the negotiation; the moral weight of these externalities is acknowledged by both sides, though their veto power is disputed.
  8.  **Epistemic Uncertainty:** Agents cannot perfectly know the counterparty's value function; systematic bias in estimating the counterparty's gain undermines the calculation of mutual benefit.
  9.  **Deliberative Status:** Agreements generate new inputs for deliberation (promissory, reciprocal, or evidential); both sides agree these inputs must be weighed against first-order moral convictions, though they disagree on the weighting mechanism.
  10. **Failure Conditions:** The practice is deemed unsuccessful if it systematically reduces total expected value according to either party's own lights, or if it degrades the capacity of agents to pursue value consistently over time.
  11. **Monitoring Requirement:** Long-term data on retention, recruitment, and project outcomes is required to adjudicate claims about integrity erosion and efficiency gains.
  12. **No Override:** No agreement obligates an agent to perform an action they judge strictly prohibited by their core constraints; trade operates within the space of permissible but sub-optimal actions.

  **Section 2: Cruxes and Predictions**

  | Crux | Neutral Statement | Cooperationist Formulation | Non-Alienationist Formulation | Accepted Test Case | Coop Prediction | Non-Alien Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Commensurability** | Does trade require a shared metric of value? | Only ordinal rankings (cheap/dear) are required; shared units risk false precision. | Cardinal comparability is required to ensure gains are not illusions of biased estimation. | **Value Estimation:** Blind audit of paired agents' estimated vs. actual counterparty utility. | Estimates will converge sufficiently for trade to be net-positive. | Estimates will show systematic bias favoring the estimator's own values. |
  | **2. Source of Obligation** | What force does the agreement hold? | The agreement generates a genuine moral reason (promissory/reciprocal) entering the calculus. | The agreement imposes a prudential price; acting against judgment remains intelligible only as cost-bearing. | **Deliberative Weight:** Survey of agents' reported reason for action post-agreement. | Agents cite reciprocal obligation as a primary moral motivator. | Agents cite strategic necessity or cost-avoidance as the primary motivator. |
  | **3. Integrity Trajectory** | How does trade affect moral character? | Reciprocity cultivates robust dispositions; integrity is maintained through reliable partnership. | Compartmentalization degrades dispositions; integrity erodes as convictions become liquidatable. | **Erosion Case:** 10-year longitudinal study of coalition member recruitment/retention metrics. | Retention stabilizes; members report higher efficacy without value drift. | Retention shifts toward instrumentalists; original mission commitment declines. |
  | **4. Externalities** | Who must consent to the trade? | Consent of the trading parties suffices if third-party harm is not direct coercion. | Consent of affected constituencies is required if the trade shifts costs onto their value system. | **Bystander Case:** Analysis of cost-shifting in shared pool funding scenarios. | Cost shifts are negligible or offset by overall efficiency gains. | Cost shifts are significant and systematically burden the least represented values. |

  **Section 3: Analysis of Disagreement**

  **Verbal vs. Genuine:**
  The disagreement over **Source of Obligation** (Crux 2) is partially verbal. Cooperationists use "reason" to denote any consideration that rightly enters deliberation, while Non-Alienationists reserve "reason" for first-order moral truths, classifying agreement-based inputs as "prices" or constraints. This is stipulative. However, it becomes genuine when assessing *motivational crowding*: if labeling an input a "price" psychologically undermines the agent's commitment differently than labeling it a "reason," the distinction has empirical consequences.

  The disagreement over **Commensurability** (Crux 1) is genuine. It rests on conflicting epistemic norms regarding interpersonal comparisons of utility. Cooperationists accept ordinal preferences as sufficient data; Non-Alienationists argue that without a shared cardinal metric, agents cannot verify that they are not being exploited by biased estimators.

  **Settling Conditions:**
  The **Integrity Trajectory** crux is the most amenable to settlement. Both sides accept that motivational dispositions change over time (Claim 6). A longitudinal study (as proposed in the table) could settle this empirically. If data shows that long-term traders retain their original conviction levels at higher rates than non-traders, the Non-Alienationist corruption hypothesis is falsified. If data shows traders shift toward instrumentalism and abandon original missions, the Cooperationist efficiency hypothesis is undermined by dynamic inefficiency.

  **Invented Distinctions:**
  To make Claim 9 signable, we distinguished between "inputs for deliberation" and "overrides." This allows Cooperationists to claim agreements generate reasons without forcing Non-Alienationists to admit those reasons trump first-order judgments. To make Claim 12 signable, we introduced the category of "permissible but sub-optimal." This allows Non-Alienationists to maintain that acting against one's judgment is usually prohibited, while admitting a narrow lane for trade that does not violate strict prohibitions.

  **Confused Cruxes:**
  The prompt's suggested crux regarding "Reason vs. Price" was retained but tightened to "Source of Obligation." As noted, this risks being merely semantic unless tied to psychological effects. The crux regarding "Confidence in Value Function" was merged into Commensurability (Crux 1), as confidence levels are a function of the metric used. Treating them separately would obscure the root epistemic disagreement.
