answer: |-
  You have not fallen down a rabbit hole; you have walked into a room where the furniture has been rearranged by people who stopped agreeing on the blueprints thirty years ago. Your intuition is correct: the literature frequently conflates distinct mechanisms under the umbrella of "costly signalling." This is not just carelessness; it is a historical accretion where evolutionary biology, economics, and sociology borrowed the same metaphors for different mathematical structures.

  To carve this properly, we need to separate **Information** (revealing what *is*) from **Incentives** (changing what *will be*). Then we need to separate **Differential Costs** (harder for some than others) from **Absolute Constraints** (impossible for some).

  Here is the carving you are looking for.

  ### 1. The Great Divide: Information vs. Incentives

  The first cut separates your "Sorting Machine" and "Unfakeable Case" from your "Incentive-Changer."

  *   **Mechanism A: Information Revelation (Signalling)**
      *   **Goal:** The receiver learns something about the signaller's *current, pre-existing* state (health, wealth, strength).
      *   **Logic:** The signaller cannot change the trait, so they change the *visibility* of the trait.
      *   **Examples:** Peacock's tail, frog's call, university degree (as a signal of intelligence).
      *   **Your Cases:** This covers your "Sorting Machine" and your "Unfakeable Case."

  *   **Mechanism B: Incentive Alteration (Commitment)**
      *   **Goal:** The signaller changes the *future payoff structure* of the interaction to make a threat or promise credible.
      *   **Logic:** The signaller *does* change their own future options. It is not about who they *are*, but about what they *can no longer do*.
      *   **Examples:** Burning bridges, posting a hostage, public resignation that burns a career path.
      *   **Your Case:** This is your "Incentive-Changer."
      *   **Distinction:** In Mechanism A, the cost is paid to *convince* the receiver. In Mechanism B, the cost is paid to *bind* the signaller. If the receiver goes away, the Signaller in Case A saves the cost. The Signaller in Case B *still* suffers the cost (the bridge is still burned).

  **Verdict:** Your "Incentive-Changer" is **not** a signalling mechanism in the strict sense. It is a **Commitment Device** (Thomas Schelling's terminology). It belongs to game theory's "strategic moves," not signalling theory's "information asymmetry." You should treat it as a separate machine.

  ### 2. Carving the Information Side: Handicap vs. Index

  Now we look at the Information machines (your "Sorting Machine" and "Unfakeable Case"). Are they the same? **No.**

  *   **Machine 1: The Handicap (The Sorting Machine)**
      *   **Condition:** The signal is *physically possible* for everyone, but *economically/physiologically* more expensive for low-quality individuals.
      *   **The Crucial Math:** This requires the **Single-Crossing Property**. The marginal cost of the signal must be inversely related to the quality being signalled. A weak peacock *could* grow a large tail, but it would die trying. A strong peacock grows it easily.
      *   **Honesty Source:** Honesty is enforced by *cost*. Lying is possible but unprofitable.
      *   **Your Case:** This is your "Sorting Machine."

  *   **Machine 2: The Index (The Unfakeable Case)**
      *   **Condition:** The signal is *physically impossible* for low-quality individuals to produce, regardless of cost.
      *   **The Crucial Math:** There is no cost curve. There is a hard constraint. A small frog *cannot* produce a deep frequency because its vocal cords are too short. No amount of "suffering" allows it to fake it.
      *   **Honesty Source:** Honesty is enforced by *physics*. Lying is impossible.
      *   **Your Case:** This is your "Unfakeable Case."
      *   **Technical Name:** In biology and game theory, this is explicitly called an **Index** (Maynard Smith & Harper, 2003). It is technically *not* a signal, because a signal implies a choice to send information. An index is a physical consequence.

  **Verdict:** The Handicap and the Index are different mechanisms. One relies on *differential cost*, the other on *physical constraint*. Conflating them is a common error.

  ### 3. The Outlier: The Flat-Cost Case

  This is the case that bothers you most: a fee, a uniform, an entry requirement that costs the same for everyone.

  If the cost is truly flat (e.g., a $100 fee for everyone), it **cannot** function as a Handicap. It does not separate high-quality from low-quality individuals; it separates those with >$100 from those with <$100. If the trait being signalled is "wealth," it works. If the trait is "health" or "bravery," a flat fee proves nothing, because a sick coward with rich parents can pay it just as easily as a healthy brave person.

  However, you noted that people claim the cost makes the behaviour "honest." This is usually because the cost is not actually flat in *impact*, or it is serving a different function.

  *   **Function 1: Screening by Valuation.** If the cost is flat, it signals *how much you want this*, not *who you are*. It filters out the uncommitted.
  *   **Function 2: The Bond.** If the cost is refundable upon good behaviour (or forfeited upon bad), it is not a signal of type, but a **Performance Bond**. It aligns incentives (like the Commitment Device) but is paid upfront.

  **The Name You Asked For:**
  There is no single canonical term, but the most precise label from contract theory and institutional economics is a **Screening Bond** or **Entry Bond**.

  *   **Definition:** A sunk cost or deposit required to enter a interaction, identical for all entrants, which functions to filter by *liquidity* or *commitment level* rather than underlying *quality*.
  *   **Edge against Sorting (Handicap):** A Handicap separates types based on *marginal cost* (harder for me than you). A Screening Bond separates types based on *absolute budget* (can I afford this?).
  *   **Edge against Waste:** Plain waste destroys value for no return. A Screening Bond creates value by reducing the receiver's risk of dealing with uncommitted partners (adverse selection).

  ### 4. Summary of the Four Machines

  Here is the taxonomy you can use to categorize what you see:

  | Mechanism | Technical Name | Cost Structure | What is Revealed? | Honesty Enforced By |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Sorting** | **Handicap Signal** | **Differential** (Higher cost for low type) | Pre-existing Trait (Quality) | Profitability (Lying costs too much) |
  | **2. Unfakeable** | **Index** | **N/A** (Physically constrained) | Pre-existing Trait (Size/Physics) | Physics (Lying is impossible) |
  | **3. Incentive** | **Commitment Device** | **Sunk/Irreversible** | Future Intentions | Incentives (Defection is now impossible) |
  | **4. Flat Cost** | **Screening Bond** | **Flat** (Same for all) | Liquidity or Commitment | Budget Constraint |

  ### 5. Observational Tests (How to tell them apart in the wild)

  When you encounter a "costly display," ask these three questions to identify the machine:

  **Test 1: The "Suffering" Test (Handicap vs. Index)**
  *   *Question:* If the low-quality individual suffered immensely, could they produce the display?
  *   *Yes:* It is a **Handicap**. (A sick peacock *could* grow the tail, but it would kill him).
  *   *No:* It is an **Index**. (A small frog *cannot* make the sound, even if it dies).

  **Test 2: The "Bridge" Test (Signalling vs. Commitment)**
  *   *Question:* If the receiver walks away immediately after seeing the display, does the signaller still suffer the cost?
  *   *No (Cost avoided):* It is **Signalling**. (The peacock doesn't grow the tail if there are no hens to see it).
  *   *Yes (Cost incurred):* It is **Commitment**. (I resign publicly; even if you don't hire me, I am still unemployed).

  **Test 3: The "Rich Fool" Test (Handicap vs. Bond)**
  *   *Question:* Can a low-quality individual with high resources fake the signal?
  *   *Yes:* It is a **Screening Bond**. (A coward can buy the expensive uniform if he has the money).
  *   *No:* It is a **Handicap**. (A coward cannot maintain the expensive lifestyle required by the uniform without breaking down, because the *maintenance* cost is differential).

  ### 6. Why the Confusion Exists

  You asked if this is carelessness or genuine theory. It is both.

  1.  **Zahavi's Handicap Principle** was originally broad enough to encompass indices, leading biologists to call indices "costly signals" even though they aren't costly in the strategic sense.
  2.  **Economics (Spence)** focused heavily on the *Differential Cost* (Handicap), but when applied to sociology (e.g., "conspicuous consumption"), the distinction between "I am rich" (Handicap) and "I am willing to burn money" (Commitment/Bond) blurs.
  3.  **The Flat Cost** is often mislabelled as a Handicap because people assume the *impact* of the cost is differential (a $100 fee hurts a poor person more than a rich person). If the *trait* being signalled is wealth, a flat fee is a Handicap relative to income. If the trait is bravery, a flat fee is just a Bond.

  ### Final Recommendation for Your Debating

  When you encounter an argument about "costly signalling," pause and classify the mechanism.

  *   If they argue that **expense proves quality**, check for the **Single-Crossing Property**. Is the cost *actually* higher for the low-quality type, or just high for everyone? If it's high for everyone, it's a **Screening Bond**, not a Handicap.
  *   If they argue that **sacrifice proves loyalty**, check if the sacrifice binds the future. If so, it's a **Commitment Device**, not a signal of current trait.
  *   If they argue that **physics proves size**, call it an **Index**.

  You are right to feel that the word "cost" is doing too much work. In the **Handicap**, cost is a *filter*. In the **Commitment**, cost is a *chain*. In the **Bond**, cost is a *ticket*. In the **Index**, cost is irrelevant. Keeping these metaphors distinct will give you a significant analytical advantage.
