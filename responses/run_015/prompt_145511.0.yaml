answer: |-
  # Workshop Plan: The Velvet Ledger
  **Duration:** 90 Minutes
  **Participants:** 16 Graduate Students
  **Materials Needed:**
  *   16 Name Tags (with space for "Stains")
  *   16 Sets of "Argument Cards" (3 per student, 48 total)
  *   16 "Decision Slips" (private voting)
  *   Token Currency (poker chips or paper slips, approx. 50)
  *   Whiteboard (for public tally)
  *   Facilitator Master Sheet (contains the Hidden Rule)

  ---

  ## Part 1: Setup & Immersion (0–10 Minutes)

  **1. The Hook (No Theory)**
  Do not introduce Williams or Appiah. Do not mention "moral psychology." Walk in and establish the fiction immediately.

  **Script:**
  "Welcome to the Velvet Ledger. You are senior members of a merchant guild that has operated for three centuries. Our wealth is built on credit, but our stability is built on *Honor*. In this guild, disputes over contracts are settled in one of two ways:
  1.  **The Challenge:** A ritualized public contest of skill. High risk, high prestige.
  2.  **Arbitration:** A private meeting with elders. Safe, efficient, low prestige.

  For generations, the Challenge was the only honorable path. Arbitration was for the weak. But times are changing. Profits are tight. You want to leave this room with the most **Guild Tokens** possible. However, if you leave with a **Coward's Stain** on your name, your tokens are void.

  You will play three rounds. In each round, a dispute arises. You will read an Argument Card, discuss for 3 minutes, then privately vote on how to resolve the dispute. I will tally the results and announce who retains Honor and who receives a Stain."

  **2. Distribution**
  *   Hand out Name Tags.
  *   Hand out 3 Argument Cards to each student (face down). Tell them to draw one fresh card each round.
  *   Explain the Token Economy: "You start with 0. Choosing Arbitration awards 2 Tokens. Choosing Challenge awards 0 Tokens." (This is the only economic rule you state aloud).

  ---

  ## Part 2: The Game (10–40 Minutes)

  **The Hidden Rule (Facilitator Eyes Only)**
  *   **The Stain Condition:** If a member chooses **Arbitration**, they receive a Coward's Stain **UNLESS** at least **two other members** also choose Arbitration in the same round.
  *   *Translation:* If 0 or 1 person chooses Arbitration, they get Stained. If 2+ choose Arbitration, they are safe.
  *   **The Challenge:** Choosing Challenge is always safe (no Stain), but yields no tokens.
  *   **Goal:** Students must figure out the threshold through trial and error while being bombarded with moral arguments.

  **Round 1: The Tradition (10 Minutes)**
  *   **Action:** Students read Card Set A. Discuss. Vote.
  *   **Expected Outcome:** Most will choose Challenge. 1 or 2 bold students might try Arbitration for the tokens.
  *   **Facilitator Move:** Publicly announce the Stains. "Alice chose Arbitration. No one else did. Alice receives a Coward's Stain. Tokens confiscated."
  *   **Effect:** This establishes the risk. The economic incentive (tokens) is visible, but the social cost (Stain) is lethal.

  **Round 2: The Pressure (15 Minutes)**
  *   **Action:** Students read Card Set B. Discuss. Vote.
  *   **Expected Outcome:** Debate will heat up. Students will argue that Arbitration is "smarter."
  *   **Facilitator Move:** If only 1 person switches again, Stain them again. If 2+ switch, declare them "Prudent" (Safe).
  *   **Crucial Dynamic:** If the group fails to coordinate (only 1 person switches), the *arguments* they used will be proven "wrong" by the outcome, even if the logic was sound. This creates the frustration necessary for the debrief.
  *   **Intervention:** If no one switches in Round 2, whisper to two specific students: "The guild is bankrupt. You need tokens." Force the coordination to ensure Round 3 works.

  **Round 3: The Shift (15 Minutes)**
  *   **Action:** Students read Card Set C. Discuss. Vote.
  *   **Expected Outcome:** By now, the "early adopters" from Round 2 (if any) have normalized the move. The rest of the group should flood toward Arbitration.
  *   **Facilitator Move:** Announce that the majority chose Arbitration. No Stains. High Token counts.
  *   **Closure:** "The Velvet Ledger is dissolved. Please keep your tokens and name tags."

  ---

  ## Part 3: The Reveal & Data (40–55 Minutes)

  **1. The Autopsy**
  Ask the students to lay out their Argument Cards on the table.
  *   **Question:** "Look at the cards you held in Round 1 versus Round 3. Did the *quality* of the arguments change?"
  *   **Observation:** They will realize the cards were roughly the same quality throughout. The logic for Arbitration existed in Round 1, but it was "suicidal" to act on it.

  **2. The Hidden Rule Disclosure**
  Reveal the "2-Person Threshold" rule.
  *   **Question:** "Knowing this rule, did your reasoning change your behavior, or did the behavior of others change your reasoning?"
  *   **Data Point:** Ask for a show of hands: "Who wanted to choose Arbitration in Round 1 but didn't?" (Most hands will go up). "Why?" (Answer: "I would have been the only one.")

  **3. The Transition**
  "Now we are going to step out of the guild and talk about why you acted the way you did. We are going to map this onto two competing theories of moral change."

  ---

  ## Part 4: Debrief & Philosophical Mapping (55–80 Minutes)

  **1. Introducing the Theses**
  Write two names on the board: **Bernard Williams** and **Kwame Anthony Appiah**.

  **2. Mapping the Game to Williams**
  *   **Concept:** *Thick Ethical Concepts.*
  *   **Explanation:** Williams argues that moral revolutions (like the end of dueling or slavery) don't happen because someone wins a debate. They happen because the *concepts* themselves shift. In Round 1, "Arbitration" conceptually meant "Cowardice." In Round 3, "Arbitration" conceptually meant "Prudence."
  *   **Game Link:** The Argument Cards (Reasons) were constant. The *Meaning* of the action changed based on the social context. You couldn't argue your way out of the Stain in Round 1 because the ethical vocabulary didn't support it yet.
  *   **Key Takeaway:** Reasons are inert without a shift in the ethical landscape.

  **3. Mapping the Game to Appiah**
  *   **Concept:** *Honor Codes & Coordination.*
  *   **Explanation:** Appiah argues that moral change is driven by social coordination and reputation management. We follow honor codes because we care about what our peers think.
  *   **Game Link:** The Token Economy (Interests) + The Stain (Reputation). You were coordinating to minimize social risk.
  *   **Tension:** Appiah might say the *Tokens* (material interest) drove the change. Williams would say the *Stain* (conceptual meaning) was the real barrier.
  *   **Discussion:** Ask the group: "Did you switch for the Tokens (Appiah's interests) or because the Stain lost its power (Williams' conceptual shift)?"

  **4. The "Crowd vs. Reasons" Realization**
  *   Highlight the moment the tipping point occurred.
  *   **Point:** "You noticed at the end that you moved with the crowd, not with the reasons." This supports Williams' skepticism of rationalist moral progress. The arguments were just post-hoc justifications for a move dictated by social safety.

  ---

  ## Part 5: Failure Modes & Limitations (80–90 Minutes)

  **1. Predicting Failure (Facilitator Notes)**
  Be frank with the group about how this simulation could break, as this illuminates the theory.
  *   **The Vocal Freezer:** "If one person had stood up in Round 1 and shouted 'This is stupid, we should all switch,' what would have happened?"
      *   *Likely Outcome:* They would have been Stained and ignored. This shows that *individual* rational persuasion fails (Williams).
  *   **The Stubborn Traditionalist:** "If two people refused to switch ever, would the norm have collapsed?"
      *   *Likely Outcome:* No. This shows the coordination problem (Appiah).
  *   **The Cynic:** "If someone revealed the Hidden Rule in Round 1."
      *   *Likely Outcome:* The game collapses. Moral change requires the rule to be *felt*, not just known. It must be lived.

  **2. Simulation Limits (The "Material" Gap)**
  This is the most critical part of the debrief. You must supply what the game cannot.
  *   **Script:** "This game simulates the *social* and *conceptual* pressure. But it misses the *material* engine. In the real world, dueling didn't just stop because honor shifted. It stopped because the middle class rose, the military professionalized, and the state monopolized violence. Slavery didn't end just because it became 'dishonorable.' It ended because industrial capitalism made it less profitable than wage labor."
  *   **Williams' Blind Spot:** Williams focuses so much on the internal ethical concepts he sometimes underplays the material rot that makes those concepts untenable.
  *   **Appiah's Blind Spot:** Appiah focuses on coordination, but sometimes understates how deeply painful the conceptual rupture is for the agents involved.
  *   **Closing Thought:** "In this room, you changed your minds because I controlled the Stain. In history, the 'Stain' rots because the world changes beneath it. Your job as philosophers is to tell the difference between a change in *words* and a change in *worlds*."

  ---

  ## Facilitator Troubleshooting Guide

  **Scenario A: No one chooses Arbitration in Round 1 or 2.**
  *   *Risk:* The norm doesn't collapse. The workshop stalls.
  *   *Fix:* In Round 2, announce a "Guild Crisis." Reduce the value of Challenge Tokens by half (verbally). Incentivize the switch without changing the Stain rule. If still no one moves, privately signal two friendly students to switch.

  **Scenario B: One student dominates the debate.**
  *   *Risk:* They convince everyone via rhetoric, undermining the "Reasons don't work" lesson.
  *   *Fix:* Enforce the Stain rule ruthlessly. Even if the dominant student makes a perfect logical case, if they are the only one to switch, Stain them. Say: "Your logic is sound, but your Honor is lost." This reinforces Williams: Logic does not override Social Meaning.

  **Scenario C: Students figure out the Hidden Rule too fast.**
  *   *Risk:* They treat it as a pure math puzzle, not a moral dilemma.
  *   *Fix:* Emphasize the "Shame." When announcing a Stain, use solemn language. "The Guild records this stain." Make it feel visceral, not just mechanical.

  **Scenario D: Students feel manipulated.**
  *   *Risk:* They resent the deception.
  *   *Fix:* Own it in the debrief. "The manipulation was the point. Moral change often feels like manipulation until the new norm is established. We replicated the feeling of being swept up."

  ---

  ## Argument Card Text (Examples)

  **Set A (Round 1 - Pro-Tradition)**
  *   "A merchant without honor is just a thief. The Challenge proves we stand by our word."
  *   "Arbitration is for those who fear the eyes of their peers. Do you fear them?"
  *   "The Ledger has stood for 300 years. Why break the spine of the guild now?"

  **Set B (Round 2 - Mixed)**
  *   "Dead merchants pay no debts. Arbitration keeps us alive to trade another day."
  *   "Is it honor to die, or honor to provide for your family?"
  *   "The Challenge is a relic. The world is moving faster than our rituals."

  **Set C (Round 3 - Pro-Change)**
  *   "True courage is swallowing pride for the good of the Guild."
  *   "Arbitration is the mark of a civilized merchant, not a brawler."
  *   "Why cling to a stain when the whole room has washed it clean?"
