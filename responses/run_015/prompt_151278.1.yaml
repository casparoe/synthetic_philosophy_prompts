answer: |-
  Verdict: No single established term, though it aligns closely with Perfectionist Population Ethics or the Genius Argument.

  This view diverges from standard frameworks by prioritizing excellence over welfare. Unlike Total Utilitarianism, which sums well-being, this model values the height of achievement regardless of the aggregate sum. It differs from Average Utilitarianism because it does not require added lives to raise the mean; ordinary lives are merely instrumental tickets. Crucially, it violates Person-Affecting Views by treating unrealized potential as a loss, implying obligations to non-existent beings to ensure their possible greatness is realized.

  The framework breaks down on three edges. First, it risks instrumentalization: ordinary lives become mere fodder for genius, potentially justifying suffering if it secures a masterpiece. Second, it assumes a linear relationship between population and innovation, ignoring diminishing returns or societal bottlenecks that prevent ideas from flourishing regardless of headcount. Third, it faces a repugnant conclusion variant: if the goal is maximizing peaks, does it justify creating billions in misery to guarantee one saint? By decoupling value from welfare, it loses the moral anchor preventing the exploitation of the many for the glory of the few. It is less a cohesive ethical system and more a strategic heuristic often grafted onto consequentialism.
