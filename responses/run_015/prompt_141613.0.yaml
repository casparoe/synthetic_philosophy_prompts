  Dear friend,

  I have been thinking about our conversation and the trail of verdicts your friend left in its wake, and I believe I can help you settle the bet without resorting to the textbooks. Based on the pattern of her judgments, particularly the hard line she drew around the mitochondrion and the self-replicating RNA, I predict she will say that the first synthetic cell is not alive. It is a tempting verdict to resist because the cell functions perfectly, but her hesitation suggests she is weighing something deeper than mere function, and that deeper thing is likely lineage. However, it is not just any lineage that matters to her, but a specific kind of historical continuity. I believe the rule she is running is what I would call independent autopoietic lineage. Under this rule, a thing is alive only if it is a bounded, self-maintaining system that belongs to a chain of such systems where each member produced the next as an independent unit. This rule fits her verdicts better than the alternatives because it cleanly excludes the mitochondrion, which she firmly called not alive despite its metabolism and division. While mitochondria do descend from mitochondria, they do not do so as independent units; they are subordinate components built and controlled by the host cell. This same rule excludes the virus and the RNA molecule because they lack the bounded autonomy, and it excludes the synthetic cell because, while it is autonomous, it lacks the lineage. It was assembled by humans, not born of a parent cell, so the chain of independent reproduction is broken at the source.

  There are two other rules that fit her earlier verdicts almost as well, and it is important to see why they are inferior or where they diverge. The first is the purely organizational rule you identified, which says life is simply a bounded chemical system that builds and repairs itself. This rule predicts the synthetic cell is alive because it meets all the functional criteria, and it handles the seed and endospore well by appealing to disposition. However, it struggles with the mitochondrion. To make the organizational rule work for her mitochondrion verdict, one has to add a caveat that the system must make all its own components, which is technically true for the cell but feels like an ad-hoc adjustment to save the theory. The second alternative is the purely historical rule, which says life is a property inherited from ancestors of the same kind. This rule predicts the synthetic cell is not alive, agreeing with my prediction, but it gets the reason wrong. A pure historical rule would have to classify the mitochondrion as alive because mitochondria do arise from mitochondria. Since she said they are not alive, the pure historical rule is insufficient. It agrees with the prediction for the synthetic cell but for the wrong reason, as it fails to explain the exclusion of the mitochondrion without adding the independence clause I proposed.

  To separate these surviving rules from each other, specifically to distinguish my independent lineage rule from a stricter vitalist view that might also predict the first cell is not alive, I would put the following case to her: ask whether the daughter cells of that first synthetic cell are alive. This discriminates where the first case only half does because the first case tests the origin, while the second tests the continuity. If she says the first cell is not alive but its daughters are, she confirms the independent lineage rule, acknowledging that life is a status that can be bootstrapped once an autonomous reproducing system is established, even if the spark was artificial. If she says the daughters are also not alive, she is holding a vitalist view that life cannot be manufactured at all, implying that the artificial origin taints the entire lineage forever. This question forces her to decide whether life is a state that can be entered into through function or a sacred continuity that cannot be initiated by human hands, and it clarifies whether her hesitation was about the lack of ancestors or the nature of the ancestors themselves. I hope this helps you close the loop on the argument, though I suspect these definitions are slippery enough that she may find a new edge to explore once you put this to her.
