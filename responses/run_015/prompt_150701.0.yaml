prompt: |-
  You are delivering the commencement address at a university that has just reinstated a required general-education core after a decade of pure disciplinary specialization. The audience is tripartite: graduating seniors who completed the core in its first iteration; faculty divided between those who designed the curriculum and those who regard it as administrative bloat; and parents who largely assume that "general education" means job training or credentialing. Use Whitehead's philosophy of education—specifically his view that learning moves through successive phases of romance, precision, and generalization, and that the university's essential duty is to preserve the rhythm among them rather than to accelerate or collapse it—so that it does real structural work in the speech. First, explain why the core was reinstated without reducing it to vocational preparation on one hand or to mere cultural ornament on the other. Second, shape the form of the address itself by identifying which kinds of prescription or practical advice are inappropriate for a commencement occasion, given that the graduates are in a transitional moment rather than in the precision phase of their training; explicitly mark what you are therefore refusing to say. Third, address the faculty division not by taking sides, but by showing that deep specialization and broad study belong to different moments of the same educational rhythm, so that treating them as opponents misunderstands the process. The speech should run roughly eight minutes, be intelligible to non-specialists without flattening the philosophy into decoration, and make clear where judgment must replace procedure—namely, in deciding exactly which prescriptions belong to which phase and in acknowledging that the rhythm itself offers no algorithm for resolving curricular disputes.
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**
      *   **Occasion:** University Commencement Address.
      *   **Context:** The university just reinstated a required general-education core after 10 years of pure specialization.
      *   **Audience:**
          1.  Graduating Seniors (first cohort to complete the new core).
          2.  Faculty (divided: designers vs. skeptics who see it as bloat).
          3.  Parents (assume gen-ed = job training/credentialing).
      *   **Philosophical Framework:** Alfred North Whitehead's *The Aims of Education* (Romance, Precision, Generalization).
      *   **Key Constraints:**
          *   Use Whitehead's philosophy to do *structural work* (not just decoration).
          *   Explain the core's reinstatement (avoiding vocationalism vs. ornamentation).
          *   Shape the *form* of the address: Identify inappropriate advice for this phase (Graduation = transition, not precision). Explicitly refuse to give certain advice.
          *   Address faculty division: Show specialization and broad study are different moments of the *same* rhythm, not opponents.
          *   Acknowledge limits: Judgment replaces procedure; the rhythm offers no algorithm for disputes.
          *   **Length:** Roughly 8 minutes (approx. 1,000 - 1,200 words spoken at a moderate pace).
          *   **Tone:** Intelligible to non-specialists, philosophically rigorous but not obscure.

  2.  **Deconstruct Whitehead's Rhythm:**
      *   *Romance:* First apprehension, excitement, unconnected facts, curiosity. (Early education/Gen Ed start).
      *   *Precision:* Grammar, rules, detail, specialization, mastery of technique. (Major courses/Professional training).
      *   *Generalization:* Returning to synthesis, using the tools to understand the world, wisdom. (Graduation/Life).
      *   *Key Insight:* Education is a cycle, not a straight line. You need all three. Collapsing them ruins learning.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the unique position of this class. They are the "pilot group" for the new core. Set the stage regarding the tension (specialization vs. breadth). Introduce Whitehead gently.
      *   **Addressing the Parents/Context (The "Why"):** Why bring back the core? It's not job training (vocational) and not just "culture" (ornament). It's about the *rhythm*. Use Whitehead to explain that without the broad view (Romance/Generalization), the technical skill (Precision) is inert.
      *   **Addressing the Form of the Speech (The "What I Won't Say"):** This is a crucial constraint. Commencement speeches usually give "5 steps to success." I need to explicitly *refuse* that. Why? Because graduation is a transition from Precision to Generalization. Giving precise rules now is a category error.
      *   **Addressing the Faculty (The "Division"):** Acknowledge the tension. Some wanted depth, some wanted breadth. Whitehead says these aren't enemies; they are seasons. Specialization is necessary (Precision), but it suffocates without the breath of Generalization.
      *   **Conclusion (The "Judgment"):** Acknowledge that philosophy doesn't solve everything. There is no algorithm. It requires judgment. Send them off into the cycle of life.

  4.  **Drafting - Refining the Tone and Content:**
      *   *Tone Check:* Is it too academic? Need to make sure "Romance, Precision, Generalization" are explained simply.
      *   *Constraint Check:* Did I explicitly mark what I am refusing to say? Yes, need to make that prominent.
      *   *Constraint Check:* Did I address the faculty division without taking sides? Yes, frame it as a rhythmic necessity.
      *   *Constraint Check:* Is the length right? 8 minutes is roughly 1,000-1,100 words. I need to be concise but weighty.

  5.  **Writing - Iteration 1 (Mental Outline):**
      *   Welcome everyone.
      *   Talk about the new core. Parents think it's useless, Faculty fight about it.
      *   Whitehead says learning has beats. Romance (wonder), Precision (details), Generalization (wisdom).
      *   The core was to keep the rhythm alive. Not for jobs, not for fun, but for thinking.
      *   Now, usually, I tell you what to do. I won't. You are leaving Precision. You don't need more rules. You need to synthesize.
      *   To the faculty: Stop fighting. Depth needs breadth. Breadth needs depth. It's a cycle.
      *   To the grads: Life is this cycle. No algorithm. Use judgment.
      *   Congrats.

  6.  **Writing - Iteration 2 (Fleshing out the Whiteheadian arguments):**
      *   *Refining the "Refusal":* I need to be specific. "I will not give you a checklist." "I will not tell you how to optimize your career."
      *   *Refining the Faculty point:* The skeptics call it bloat. The designers call it essential. Whitehead says the skeptics value Precision (correct), but forget that Precision without Generalization creates "inert ideas." The designers value Generalization, but need Precision to ground it.
      *   *Refining the Parent point:* Jobs require Precision. Life requires Generalization. The degree certifies Precision; the education aims for Generalization.

  7.  **Drafting the Speech (incorporating the constraints):**
      *   *Opening:* Welcome the Class of 2024 (or generic). Acknowledge the experiment.
      *   *The Core:* Why here? Why now? Whitehead's "inert ideas."
      *   *The Speech Structure:* Meta-commentary on commencement addresses.
      *   *The Faculty:* Harmonizing the dispute.
      *   *The Closing:* Judgment over procedure.

  8.  **Review against Word Count and Timing:**
      *   Speaking rate is ~130-140 words per minute. 8 minutes = ~1,040 - 1,120 words.
      *   I need to ensure I don't ramble. Keep sentences rhythmic.

  9.  **Final Polish:**
      *   Ensure the distinction between "Precision" (major) and "Generalization" (post-grad life/core) is clear.
      *   Make sure the "refusal" is explicit.
      *   Ensure the "no algorithm" point lands at the end.

  *(Self-Correction during drafting)*: I initially thought about focusing heavily on the parents. But the prompt asks to address the faculty division specifically as a structural element. I need to make sure the faculty section isn't just a sidebar but integral to the Whiteheadian argument. The faculty dispute *is* a dispute about which phase of the rhythm matters most. I must show they are both right but incomplete.

  Also, I need to make sure I don't sound like I'm lecturing *about* Whitehead, but speaking *from* his framework. The concepts should be the lens, not the subject.

  Let's write.

  *Word Count Check:* Aiming for ~1100 words.
  *Tone:* Dignified, philosophical, warm, firm.

  (Proceeds to generate speech based on these thoughts.)
answer: |-
  President, Faculty, Parents, and most importantly, the Graduating Class of 2024.

  You occupy a unique place in the history of this university. For ten years, this institution operated on a principle of pure disciplinary specialization. You were the first to return to a required core. I know that for many of you, this felt like a detour. For your parents, it may have looked like a distraction from the primary goal of credentialing. For some faculty, it looked like administrative bloat; for others, a necessary restoration.

  I am not here to settle that debate with a verdict. I am here to suggest that the debate itself rests on a misunderstanding of how human beings learn. To explain why this core exists, and why I will speak to you in a specific way today, I want to borrow a framework from the mathematician and philosopher Alfred North Whitehead.

  Whitehead argued that education is not a straight line toward accumulation. It is a rhythm. It moves in three recurring phases: Romance, Precision, and Generalization.

  Romance is the spark—the initial curiosity, the sense that the world is full of interesting, unconnected things. Precision is the grind—the grammar, the formulas, the deep technical mastery of a specific field. Generalization is the return—the moment you take those technical tools and use them to synthesize a understanding of the world larger than the sum of its parts.

  The core curriculum was reinstated not to provide job training, nor to offer mere cultural ornamentation. It was reinstated to preserve this rhythm. If a university offers only Precision, it produces technicians who can manipulate data but cannot judge its value. They possess what Whitehead called "inert ideas"—knowledge that is received but never used, tested, or thrown into fresh combination. Conversely, if a university offers only Romance, it produces dilettantes who feel deeply but understand nothing.

  The core was designed to ensure that your specialization did not become a cage. It was not vocational preparation. A job requires Precision; a life requires Generalization. We did not add the core to make you more employable in your first year, but to make you more adaptable in your fifth decade.

  Now, this brings me to the structure of this address. Convention dictates that a commencement speaker offers a list of prescriptions. We expect five steps to success, three habits of happiness, or a rulebook for the future.

  I am explicitly refusing to do that.

  To offer you a list of precise rules today would be to misunderstand where you stand in the educational rhythm. For the last four years, particularly in your majors, you have been in the phase of Precision. You learned the rules of your discipline. You mastered the syntax of your field. But today marks a transition. You are moving from the Precision of the university into the Generalization of the world.

  If I give you more precise rules now, I am treating you as students still in the classroom, rather than graduates entering the cycle of life. Practical advice belongs to the phase of Precision. Wisdom belongs to the phase of Generalization. Therefore, I will not tell you how to optimize your résumé. I will not tell you the most efficient path to leadership. Those are technical questions for a technical phase. Today is about acknowledging that the map you were given in your major is not the territory you will inhabit in your life.

  This distinction also speaks to the tension in the faculty ranks, a tension I know is present in this audience. There are those who view the core as a dilution of rigor, and those who view specialization as myopic.

  Through Whitehead's lens, this conflict is unnecessary. Deep specialization and broad study are not opponents; they are different seasons of the same year. The faculty who demanded rigor were defending the phase of Precision. Without it, Generalization is just vague sentimentality. But the faculty who demanded the core were defending the phase of Generalization. Without it, Precision is just mechanical drudgery.

  To treat them as enemies is to freeze the rhythm. A heart that only contracts dies; a heart that only expands dies. It must do both, in time. The university's duty is not to choose one over the other, but to ensure the beat continues. You, the graduates, are the proof that this rhythm can hold. You have the Precision of your major and the breadth of the core. You are not a compromise between the two; you are the synthesis.

  However, I must end with a caution. While Whitehead's rhythm offers a way to understand education, it offers no algorithm for living it.

  There is no formula that tells you exactly when Romance ends and Precision begins. There is no procedure that tells you when you have mastered enough details to start generalizing. This is where judgment must replace procedure.

  In your careers, you will face disputes that look like curricular arguments. You will be told to choose between efficiency and ethics, between depth and breadth, between profit and purpose. You will look for a rulebook to resolve these tensions. It does not exist. The rhythm of education does not give you an algorithm for resolving curricular disputes, and the rhythm of life does not give you an algorithm for moral dilemmas.

  You cannot calculate the right moment to specialize and the right moment to synthesize. You must feel it. You must exercise judgment. That is the burden of Generalization. It is easier to follow a rule than to wield wisdom. But a rule is a tool for the phase of Precision. Wisdom is the only tool for the phase of Generalization.

  So, Class of 2024, do not look for the syllabus of your life. Do not ask for the rubric. You have completed the phase of Precision. You have the tools. Now, you must enter the Generalization. You must take the specialized knowledge you hold and throw it into the chaotic, ungraded, unpredictable combination of the world.

  Preserve the rhythm. When you feel your work becoming inert, seek Romance. When you feel your views becoming vague, seek Precision. And when you feel trapped in the details, step back and Generalize.

  There is no algorithm for this. There is only the rhythm, and the judgment to keep time.

  Congratulations.
