prompt: |-
  You are an expert in formal epistemology and philosophy of science. Think carefully and systematically; before answering, briefly outline the main categories of objection you intend to cover.

  I hold the view that Jeffrey conditionalization is rationally mandatory—not merely one permissible update rule—whenever evidence is uncertain, including in scientific measurement with continuous parameters. More specifically, I defend what I call "partition neutrality": the claim that Jeffrey's rule yields the correct posterior regardless of how an instrument granularizes the continuous parameter space, provided only that the agent assigns the same posterior probabilities to the partition cells. I take this to apply even in multi-agent settings where different instruments impose different binning structures on identical raw data.

  What would count against this position? I want the arguments, formal results, and conceptual cases that should genuinely move me, sorted from decisive defeaters to merely awkward tensions. In particular, address the "re-gridding divergence" problem—where two agents apply Jeffrey updates using differently granular partitions over the same continuous likelihoods and prior beliefs, yet converge to incompatible posteriors—and whether this shows that rational belief depends on an arbitrary representational choice. Also consider whether there are rationally required cases of precise conditioning despite apparent evidential uncertainty, and whether defenders have qualified the view (for instance, by requiring a uniquely "natural" partition) to the point of unfalsifiability. If it has been so insulated, say whether that is a problem for a view of this kind.

  Distinguish what committed defenders of Jeffrey conditionalization would themselves concede as damaging from objections that only critics press. Be honest about which escape routes are live and which are merely logical possibilities.

  Format your response in exactly these sections, with approximate lengths:
  1. "Position Clarified" (one short paragraph): restate the view and its scope precisely.
  2. "Decisive Defeaters" (~150 words): evidence or arguments that would genuinely undermine the position.
  3. "Awkward but Surviving Evidence" (~100 words): tensions that force qualification without abandonment.
  4. "What Defenders Would Concede" (~80 words): honest admissions from within the view.
  5. "Insulation and Falsifiability Check" (~80 words): whether qualifications have made the view immune to refutation, and whether that matters.
  6. "Confidence Note" (one paragraph): state how confident you are in this assessment, and explicitly single out the one point about which you are least certain.

  Do not provide bibliographies, reading lists, or citations. Avoid quoting specific texts verbatim.
