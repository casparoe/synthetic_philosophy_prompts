answer: |-
  # Decision Tree: The Aggregation Problem in Contractualism
  **Starting Assumption:** Morality is about what no one could reasonably reject. We compare complaints person-by-person, not by summing welfare directly.
  **Case Context:** Department Travel Fund. Option A: One person gets \$2,000 (career-critical). Option B: Twenty people get \$100 each (books/minor travel).

  ---

  ## Part 1: The Decision Tree

  **Start:** We have a conflict between the One (strong complaint) and the Many (weaker complaints).

  **Q1. Iteration & Identity:** Is this a one-off emergency with fixed victims, or a standing department policy where roles (One vs. Many) rotate over time?
  *   **Standing Policy (Roles Rotate):** Go to **Q2**.
  *   **One-Shot (Fixed Victims):** Go to **Q3**.

  **Q2. Ex-Ante Fairness:** If this is a policy, do we prioritize giving every member an equal *chance* at the fund over time, even if it lowers total expected benefit?
  *   **Yes (Equal Chances):** ➔ **Leaf A: Weighted-Lottery / Equal-Chances View**
  *   **No (Maximize Outcomes):** Go to **Q3**.

  **Q3. De Minimis Threshold:** Is the loss to *each* of the Many (e.g., \$100/books) significant enough that a *single* person could reasonably reject a policy causing it just to save the One \$2,000?
  *   **No (Trivial per person):** Go to **Q4**.
  *   **Yes (Significant per person):** Go to **Q5**.

  **Q4. Pooling Trivialities:** If the loss is too small for one person to reject, can the fact that *twenty* people suffer it combine to form a valid collective complaint?
  *   **Yes (Pooling Allowed):** ➔ **Leaf B: Threshold View** (Aggregation permitted only once a critical mass of complaints is reached).
  *   **No (Pooling Forbidden):** ➔ **Leaf C: Strict Anti-Aggregation** (The One wins; numbers of trivial complaints count for nothing).

  **Q5. Aggregation Method:** Since each of the Many has a valid complaint, do we **sum** the strength of all twenty complaints to compare against the One, or compare only the **strongest single** complaint among the Many against the One?
  *   **Sum All Complaints:** Go to **Q6**.
  *   **Compare Strongest Single:** Go to **Q7**.

  **Q6. Resource Structure:** Are the Twenty losing out on **separate** goods (each their own books) or a **shared** good (e.g., access to one shared instrument/database)?
  *   **Separate Goods:** ➔ **Leaf D: Plain Aggregation** (Sum of individual welfare losses decides).
  *   **Shared Good:** ➔ **Leaf E: Fractional Claim Satisfaction** (We measure the % degradation of the shared good and sum the fractional claim-satisfaction).

  **Q7. Tie-Breaking:** If we compare Strongest Single vs. The One, and the One's complaint is *slightly* stronger, do the extra numbers on the Many side break the tie?
  *   **Yes (Numbers Tip Scale):** ➔ **Leaf F: Numbers-as-Tie-Breaker**
  *   **No (Strength Only):** ➔ **Leaf C: Strict Anti-Aggregation** (Converges here; numbers never override strength).

  ---

  ## Part 2: Logical Space Analysis

  There are 7 binary questions, creating $2^7 = 128$ theoretical logical paths. Only 6 leaves are occupied by plausible contractualist positions. Below are the notable "Empty" regions of the logical space and why nobody lives there.

  | Empty Combination | Why it is Empty |
  | :--- | :--- |
  | **Q1 (Policy) + Q2 (No Fairness) + Q7 (No Tie-Break)** | **Unattractive.** If you iterate the choice but refuse ex-ante fairness *and* refuse to let numbers break ties, you systematically sacrifice the Many for the One every time. Over time, this violates the "reasonable rejection" standard for the Many. |
  | **Q3 (Trivial) + Q4 (No Pooling) + Q5 (Sum)** | **Incoherent.** You cannot claim individual complaints are too trivial to count (Q3) but then sum them (Q5). If they are too trivial to ground rejection, they have zero weight to sum. |
  | **Q6 (Shared) + Q5 (Strongest Single)** | **Unexplored/Unstable.** If the good is shared, the harm is inherently collective. Treating it as a "strongest single" complaint ignores the nature of the shared loss. Most views here collapse into Fractional or Threshold. |
  | **Q1 (One-Shot) + Q2 (Yes Fairness)** | **Incoherent.** You cannot prioritize equal *chances over time* (Q2) in a *one-off* case (Q1) where roles do not rotate. Ex-ante fairness requires iteration. |

  ---

  ## Part 3: The Leaves (Positions)

  1.  **Weighted-Lottery / Equal-Chances:** (Scanlon's later suggestion for policy). We institute a rule that gives everyone a probabilistic chance at the fund. Justification: No one can reasonably reject a rule that gives them a fair shot, even if they lose out this time.
  2.  **Threshold View:** (Parfit-style modification). Trivial harms don't count individually, but enough of them create a "critical mass" complaint that overrides the One.
  3.  **Strict Anti-Aggregation:** (Classic Scanlon). Only the strongest individual complaint counts. The One's career loss outweighs any number of book losses, provided the book losses aren't individually career-ending.
  4.  **Plain Aggregation:** (Utilitarian-leaning). We sum the welfare losses. 20 × \$100 loss > 1 × \$2,000 loss. (Often rejected by contractualists as ignoring the "separateness of persons").
  5.  **Fractional Claim Satisfaction:** (Technical/Shared). Used when the Many share a resource. We calculate the % degradation of the shared good. If funding the One degrades the shared lab instrument by 10% for 20 people, we sum those fractional claim violations.
  6.  **Numbers-as-Tie-Breaker:** (Moderate). The One's complaint is stronger, but not *significantly* stronger. The sheer number of people on the other side tips the balance when strengths are roughly comparable.

  ---

  ## Part 4: Indistinguishability Flags

  **Warning:** Your specific travel fund case may not be able to distinguish between certain leaves.

  *   **Flag 1: Plain Aggregation vs. Fractional Claim Satisfaction.**
      *   **Why:** If the travel fund is **indivisible** (you either go or you don't; you can't send the One to a cheaper conference and give cash to the Many), the "fraction of claim satisfied" is either 0% or 100%. In this discrete scenario, Leaf D and Leaf E yield the exact same decision. You need a case with divisible goods to pry them apart.
  *   **Flag 2: Strict Anti-Aggregation vs. Numbers-as-Tie-Breaker.**
      *   **Why:** This distinction only matters if the One's complaint and the Many's strongest complaint are **roughly equal** in strength. If the One's career is on the line and the Many just want books, the One's complaint is objectively stronger. Both views favor the One. You need a case where the harms are commensurate (e.g., One loses \$2,000 vs. Many lose \$1,900 each) to see the difference.
  *   **Flag 3: One-Shot vs. Policy (Strict Anti-Aggregation).**
      *   **Why:** A Strict Anti-Aggregator might accept the **Weighted-Lottery** in a Policy context (Q1/Q2) but remain **Strict Anti** in a One-Shot context. If you only discuss one-off cases, you cannot distinguish a pure Anti-Aggregator from a Policy-Sensitive Contractualist.

  ---

  ## Part 5: Discussion Notes for the Engineer

  *   **On "Reasonable Rejection":** Remind the group that "Reasonable" does not mean "Rational Self-Interest." It implies a desire for justification others could accept.
  *   **On Iteration:** If the retired engineer asks, "Why not just save the money?" point to **Q1**. If this is a policy, saving the money might be a third option, but the tree assumes we *must* spend it. If we must spend it, iteration changes the moral math from "Who suffers?" to "Who gets a chance?"
  *   **On De Minimis:** The "annoying question" might be: "If one person losing \$100 doesn't matter, why does twenty?" The tree forces you to answer at **Q4**. Either you admit trivialities pool (Threshold), or you admit they don't (Strict Anti). There is no middle ground where they pool *without* a threshold.
