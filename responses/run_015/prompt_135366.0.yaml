answer: |-
  Participants discover that fully mapping the hidden payoff structure consumes the very resources that would have made that knowledge profitable.

  ### Game Rules: The Niche Selection Protocol

  **Objective:** Maximize your cumulative point score over six rounds. The highest scorer wins the privilege of choosing the opening case for the next workshop session.

  **Resources:**
  *   **Budget:** 8 Cognitive Tokens (starting).
  *   **Aspiration Level:** 7 Points (starting).
  *   **Options:** 4 Face-Down Cards per round (labeled A, B, C, D).

  **Procedure per Round:**
  1.  **Inspection:** You may flip over any option card to reveal its point value. Each inspection costs **1 Token**.
  2.  **Selection:** Once you inspect an option, you may select it immediately to lock in the points, or continue inspecting others. You may select only one option per round.
  3.  **Mapping (Optional):** At any point, you may purchase the "Correlation Envelope" for **3 Tokens**. This reveals the rule linking payoffs across rounds.
  4.  **Success/Failure:**
      *   **Success:** Selected option value ≥ Current Aspiration Level.
      *   **Failure:** Selected option value < Current Aspiration Level OR you run out of tokens before selecting.
  5.  **Hardship Clause (Adaptation):** If you record **Failure** in two consecutive rounds, your Aspiration Level decreases by 1 (e.g., 7 → 6) and you receive a **1 Token Refund** immediately. This adjustment is permanent for remaining rounds.

  **Constraints:**
  *   You must select an option every round. If tokens reach zero, you must select blindly.
  *   Do not discuss strategies or values with other participants during play.
  *   The Facilitator will not answer questions about the "optimal" strategy.

  ### Hidden Payoff Environment

  **Card Distribution (Per Student Packet):**
  *   **Values:** Each card contains a integer value between 4 and 10.
  *   **Probability:** 75% of cards are valued 7–10 (Success at Level 7). 25% of cards are valued 4–6 (Failure at Level 7).
  *   **Optimization Trap:** Values 9–10 appear only 20% of the time. Searching for these specifically requires inspecting multiple cards, depleting tokens rapidly.

  **The Correlation Envelope (Hidden Structure):**
  *   **Content:** "High-value options (8+) shift clockwise by one position each round (A→B→C→D→A). However, random noise affects 30% of rounds, breaking the pattern."
  *   **Trap:** Purchasing this costs 3 Tokens (37.5% of total budget). Because of the 30% noise, buyers must still inspect at least one card per round to verify the pattern.
  *   **Math:** 3 (Map) + 6 (Inspections) = 9 Tokens required. Budget is 8. Map buyers *must* run out of tokens before Round 6, forcing blind selections with high failure risk.

  ### Materials Needed

  *   **16 Individual Packets:** Each containing 6 envelopes (Rounds 1–6). Inside each envelope are 4 cards (Options A–D) with pre-printed values according to the distribution above.
  *   **16 Score Sheets:** Columns for Round, Tokens Spent, Option Value, Success/Failure, Current Aspiration, Cumulative Score.
  *   **128 Budget Chips:** 8 per student (distinct color from points).
  *   **1 Sealed Correlation Envelope:** Placed visibly at the front.
  *   **Leaderboard:** Whiteboard or projected spreadsheet to track cumulative scores publicly.
  *   **Timer:** Visible countdown for each round.

  ### Point-Payoff Scheme

  *   **Base Score:** The face value of the selected card (4–10 points).
  *   **Token Cost:** Tokens are not subtracted from the score but limit action. (Score = Sum of Card Values).
  *   **Tie-Breaker:** Highest remaining tokens after Round 6.
  *   **Penalty:** If you run out of tokens and select blindly, record the value but mark "Resource Depletion" on the sheet.

  ### Minute-by-Minute Timeline (80 Minutes)

  *   **00:00 – 00:10 (Setup & Framing):** Distribute packets, chips, and sheets. Explain rules neutrally. Emphasize the "Hardship Clause" as a standard budget relief policy. Do not mention satisficing or rationality. Start Leaderboard at zero.
  *   **00:10 – 00:15 (Round 1):** 5 minutes. Most students spend 1–2 tokens. Some eye the Correlation Envelope.
  *   **00:15 – 00:20 (Round 2):** 5 minutes. Early failures occur. Optimizers spend heavily.
  *   **00:20 – 00:25 (Round 3):** 5 minutes. First "Hardship Clause" triggers for some (2 consecutive failures). They receive token refunds. Map buyers begin token anxiety.
  *   **00:25 – 00:30 (Round 4):** 5 minutes. Map buyers run out of tokens or face critical shortage. Satisficers with lowered aspirations (Level 6) find success easily.
  *   **00:30 – 00:35 (Round 5):** 5 minutes. Resource depletion becomes visible on leaderboard (scores plateau for high spenders).
  *   **00:35 – 00:40 (Round 6):** 5 minutes. Final selections.
  *   **00:40 – 00:45 (Scoring):** Tally scores. Announce winner. Award symbolic privilege.
  *   **00:45 – 01:20 (Debrief):** Structured discussion linking experience to theory (see below).

  ### Debrief Mapping: From Experience to Theory

  **1. The Token Budget = Cognitive Effort/Time**
  *   *Game Moment:* The anxiety of spending Token 7 or 8.
  *   *Concept:* Cognitive resources are finite. Spending effort to acquire information (inspection) reduces resources available for action.
  *   *Lesson:* Optimization requires information, but information has a cost. When cost exceeds benefit, optimization is irrational.

  **2. The Aspiration Level = Goals/Standards**
  *   *Game Moment:* The initial fixation on scoring 7+ points.
  *   *Concept:* Aspiration levels dictate when search stops.
  *   *Lesson:* Fixed high standards in volatile environments lead to resource exhaustion.

  **3. The Hardship Clause = Aspiration Adaptation**
  *   *Game Moment:* The feeling when the Facilitator announced "Aspiration drops to 6, here is a token back."
  *   *Concept:* Satisficing with adaptation.
  *   *Lesson:* Frame this explicitly: "Who felt relief when the threshold dropped?" That relief is the signal of ecological rationality. Lowering standards is not defeat; it is resource conservation that enables future success.

  **4. The Correlation Envelope = Theoretical Models**
  *   *Game Moment:* The temptation to buy the envelope vs. the reality of the token cost.
  *   *Concept:* The cost of perfect information.
  *   *Lesson:* Knowing the "true structure" of the environment is useless if acquiring that knowledge bankrupts you. Ecological rationality favors heuristics (pick the first 7+) over global optimization (map the whole system).

  ### Failure-Mode Guide & Handling Instructions

  **1. Token Hoarding (Risk Aversion)**
  *   *Symptom:* Participants inspect nothing or select blindly in Round 1 to save tokens.
  *   *Handling:* During Rounds 2–3, announce publicly: "Tokens have no value at the end unless converted to points." Remind them that *selection* is mandatory.
  *   *Debrief Note:* Highlight that unused budget is wasted potential. Rationality involves spending resources, not just saving them.

  **2. Social Reluctance to Lower Aspiration**
  *   *Symptom:* Participants hit 2 failures but hesitate to mark the aspiration drop, fearing it looks like "losing" on the score sheet.
  *   *Handling:* When announcing the refund, use neutral, administrative language: "Budget relief applied. Token refunded." Do not apologize. Make it sound like a standard tax adjustment.
  *   *Debrief Note:* Ask those who lowered their threshold: "Did this feel like failure or like unlocking a new strategy?" Validate the latter.

  **3. Early Cracking (The Map Buyer Wins)**
  *   *Symptom:* A participant buys the envelope Round 1, gets lucky with the 30% noise not hitting, and leads the leaderboard.
  *   *Handling:* Do not interrupt. Let them win the points.
  *   *Debrief Note:* Isolate the *cost*. "You scored 50 points, but spent 3 tokens on the map. If you hadn't bought the map, could you have inspected more options in Round 5 when you ran dry?" Show that the *margin* was eroded by the mapping cost. The strategy is fragile; satisficing is robust.

  ### Honest Limitation Note

  **What This Simulation Cannot Reproduce:**
  This game cannot reproduce the **long-term social normalization of aspiration norms** or the **genuine lack of meta-awareness** regarding one's own cognitive architecture.

  *   **Social Norms:** In the game, lowering aspiration is a private mechanical adjustment. In reality, lowering professional or personal standards carries social stigma and identity costs that no token refund can offset. You must verbally explain that real-world satisficing requires courage because peers often mistake adaptation for incompetence.
  *   **Meta-Awareness:** In the game, students know they have a budget of 8 tokens. In reality, humans do not have a visible counter for "cognitive effort." We rarely know we are depleted until we crash. You must verbally state that ecological rationality requires learning to recognize internal fatigue signals since no external chip count exists.
  *   **Stakes:** The symbolic privilege (choosing the opening case) is low-stakes. Real-world bounded rationality often involves high-stakes decisions (health, finance) where the emotional weight of "good enough" is harder to accept. Acknowledge that the safety of the classroom allows them to experiment with failure in ways life rarely permits.
