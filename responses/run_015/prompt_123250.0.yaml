answer: |-
  This is a classic governance tension: **institutional memory vs. operational flexibility.**

  To answer your question directly: **No, it is generally not reasonable to keep a bylaw you don't understand, especially one that mandates unanimity for an operational decision.** However, dismissing the older members as "stubborn" might cause you to miss a critical risk mitigation strategy.

  Here is a breakdown of why this bylaw is problematic, why the older members might be digging in, and how you can navigate a solution that respects both history and good governance.

  ### 1. The Governance Problem (Why the New Members are Right)
  From a modern nonprofit and co-op governance perspective, this bylaw is flawed for two reasons, regardless of the "disaster":

  *   **Bylaws should govern process, not operations:** Bylaws are the constitution of the organization. They should dictate *how* decisions are made, not *what* specific vendors you use. Hard-coding a specific category of supplier (bulk grain) into the bylaws removes the board's ability to react quickly to market changes, price hikes, or supply chain failures. If that supplier goes bankrupt tomorrow, does the co-op starve until a unanimous vote can be organized?
  *   **Unanimity creates gridlock:** Requiring a unanimous vote for operational decisions gives a single board member veto power. This invites "hold-up" problems, where one person can block a change to extract concessions, or where simple inertia prevents necessary evolution. It is not inherently "undemocratic," but it is anti-agile.

  ### 2. The Institutional Memory Problem (Why the Older Members are Digging In)
  The older members are likely not being stubborn for no reason. In the 70s and 80s, many co-ops faced existential threats. The "disaster" likely falls into one of these categories:
  *   **Financial Fraud:** A previous supplier might have billed incorrectly, delivered subpar goods, or embezzled funds, and a split vote allowed it to continue too long.
  *   **Ideological Schism:** A vendor change might have caused a membership revolt that nearly bankrupted the co-op (e.g., switching from organic to conventional, or local to corporate).
  *   **Quality/Safety:** A supplier might have provided contaminated food that hurt members.

  **However, their refusal to explain is a governance failure.** You cannot govern based on secrets. If the risk is real, it needs to be documented so future boards can manage it, not just blocked by a blunt instrument.

  ### 3. A Path Forward: Investigation and Compromise
  You don't have to choose between "scrap it now" and "keep it forever." You can take a third path that validates the older members' concerns while fixing the governance structure.

  **Step 1: Move the rule out of the Bylaws.**
  The strongest argument you have is that **vendor selection belongs in a Board Policy Manual, not the Bylaws.**
  *   *Proposal:* Amend the bylaws to remove the specific reference to "bulk grain."
  *   *Replacement:* Create a Board Policy that says, "Changes to primary food suppliers require a [Supermajority/Unanimous] vote."
  *   *Why this helps:* Policies are easier to change than bylaws. If the "disaster" risk fades over time, the board can adjust the policy without a full membership vote to amend bylaws.

  **Step 2: Create a "Safe Space" for the History.**
  The older members may fear that sharing the story will reopen old wounds or that newer members will dismiss it as "ancient history."
  *   *Action:* Propose an executive session (board members only, no guests) dedicated solely to "Organizational History and Risk."
  *   *Script:* "We respect that this rule exists for a reason. We cannot honor the lesson if we don't know the story. Can we agree that whatever happened stays in this room, but we need to know the facts to vote responsibly?"
  *   *Alternative:* If they still won't talk, ask the co-op's archivist or long-time staff if there are **meeting minutes from the 80s** regarding this vote. The record might tell you what the "disaster" was without the older members having to relive it verbally.

  **Step 3: Evaluate the Current Risk.**
  If the "disaster" was about a specific type of grain fraud that is no longer possible due to modern regulations, the rule is obsolete. If the disaster was about community trust, that is still relevant.
  *   *Compromise:* If the older members are worried about membership backlash, change the voting threshold to a **Supermajority (e.g., 2/3 or 3/4)** rather than a simple majority. This protects against a slim majority forcing a change, but prevents a single person from holding the co-op hostage.

  ### Recommendation
  **Do not vote to keep the bylaw as-is.** It is bad governance to hard-code vendors and require unanimity for operations.

  **Do not vote to scrap it immediately without context.** You risk walking into the very trap the older members are trying to prevent.

  **The Motion to Make:**
  "I move to form a small committee (including both older and newer members) to review the history of this bylaw and recommend a governance structure that protects us from past risks while allowing for operational flexibility. We will report back in 30 days with a recommendation to either move this policy to the Policy Manual or adjust the voting threshold."

  This slows down the "scrap it" momentum enough to make the older members feel heard, but keeps the momentum on fixing a clearly problematic bylaw. It shifts the debate from "Who is right?" to "How do we protect the co-op?"
