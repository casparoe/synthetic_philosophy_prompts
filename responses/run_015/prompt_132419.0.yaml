answer: |-
  **1. Scope Note**

  This document records the outcomes of an eighteen-month adversarial collaboration between proponents of the "inherence" view (political properties reside in technical arrangements) and the "arrangement" view (political properties reside in sociotechnical systems). We define "politics" operationally as the structuring of authority, subordination, or exclusion among human actors. We define "artifact" as the material or technical arrangement under discussion, distinct from but interacting with its context. This statement explicitly sets aside general ethical evaluations of technology (e.g., whether a technology is "good") to focus strictly on the locus of political agency. We further set aside questions of intentional malice; a design may be political without a designer's conscious intent. Our goal is not consensus on truth, but precision on disagreement.

  **2. Agreed Claims**

  1.  **Causal Influence:** Artifacts causally influence the distribution of power and access within social groups. [Status: Settled among practitioners]
  2.  **Functional Parity:** To isolate the political effect of design, comparisons must hold measurable function (output, cost, lifespan) fixed. [Status: Settled among practitioners]
  3.  **Contextual Enforcement:** No technical constraint is self-enforcing; all require some social maintenance or acceptance to remain effective. [Status: Majority view but contested]
  4.  **Resistance to Interpretation:** Some technical arrangements resist reinterpretation or repurposing more strongly than others, even if none are absolute. [Status: Accepted by Inherence; conceded by Arrangement for sake of document]
  5.  **Designer Responsibility:** Designers bear some responsibility for foreseeable political effects, though the extent of this responsibility is disputed. [Status: Majority view but contested]
  6.  **Semantic Distinction:** We distinguish the *causal* question (did it cause an effect?) from the *modal* question (could an equivalent design avoid it?) and the *normative* question (who is responsible?). [Status: Settled among practitioners]

  **3. Disagreements Table**

  | Crux | Inherence Formulation | Arrangement Formulation | Discriminating Case | Pre-registered Prediction | Evidence to Move |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Modal Strength** | Pump M necessitates hierarchy due to proprietary locks regardless of context. | Pump M allows hierarchy only if licensed technicians exist and enforce rules. | 1. Matched Pair | Inherence: M is authoritarian in any society. Arrangement: M is neutral without regulatory enforcement. | Deployment of M in a society with no licensing regime; if hierarchy persists, Inherence wins. |
  | **Boundary Problem** | The artifact includes its manual and locks; the courtyard walls are the politics. | The artifact ends at the physical shell; the walls are scenery without a gatekeeper. | 2. Orphan Artifact | Inherence: Courtyard still excludes outsiders. Arrangement: Courtyard is merely inconvenient scenery. | Measurement of exclusion rates after company dissolution; if exclusion drops to zero, Arrangement wins. |
  | **Omissions** | Absence of a feature (no paper route) is a design choice that excludes. | Absence is an institutional policy choice; the code merely executes the policy. | 3. The Omission | Inherence: The portal itself excludes users. Arrangement: The agency excludes users via the portal. | Comparison with a portal having logs but same policy; if exclusion persists, Inherence wins. |
  | **Durability/Travel** | Physical constraints (stairs) retain political effect across different societies better than code. | All constraints require local social uptake; physical barriers are climbed if socially valued. | 4. What Travels | Inherence: Stairs block everywhere. Arrangement: Stairs are bypassed if social need is high. | Cross-cultural study of barrier bypass rates; high bypass rates move Inherence. |
  | **Ethics of Design** | Designers bear distinctive responsibility for choosing M over O. | Responsibility is distributed across purchasers, regulators, and maintainers. | 1. Matched Pair | Inherence: Designer of M is culpable. Arrangement: Purchaser/Regulator is culpable. | Moral intuition surveys on blame assignment in varying regulatory contexts. |

  **4. Closing Section**

  We expect this agreement to be rejected by two external parties. First, an engineer may reject Claim 1, arguing that "politics" stretches the term past usefulness when applied to pumps or portals rather than laws. Second, a critical theorist may reject Claim 3, arguing that acknowledging "self-enforcement" even partially mislocates agency away from structural power.

  Regarding internal weaknesses: The Inherence camp concedes its case is weakest on Case 2 (Orphan Artifact), where social meaning clearly shifts upon ownership transfer. The Arrangement camp concedes its case is weakest on Case 4 (What Travels), where physical barriers often prove more durable than social norms admit. We sign this not to end the debate, but to ensure future disagreements are empirical rather than verbal.
