prompt: |-
  Write a short dialogue between Mara and Leo on whether culture can actually be a cause, using Weber's Protestant ethic thesis as the hard case. Mara holds that religious values had real explanatory autonomy — not just reflecting economic conditions but actively shaping capitalist behavior through what Weber called an elective affinity between inner-worldly asceticism and rational capitalism. Leo thinks thats backwards: values are always carried by material interests and institutional enforcement, and he keeps pointing out that once capitalism was established the religious motivation basically disappeared, which makes the values look like scaffolding that gets kicked away.

  Have them really argue with each other. Mara should defend Weber's distinction between meaningful adequacy and causal adequacy, claiming that a value-frame can be causally adequate if its absence would have changed actors' interpretations in a counterfactually stable way. Leo should push back that macro counterfactuals for values are untestable, and that Weber only called the thesis an adequate cause, not a necessary one, so the causal claim is weaker than Mara admits. They should respond to these specific points, not talk past one another.

  Keep both sharp — no strawmen. And please separate what's actually settled in Weber scholarship from whats genuinely contested, and dont present one contested reading as the consensus view. Its okay if theres a typo or two in this prompt.
