  I write about science and ideas for a newspaper, and I am working on a piece about how the organisations building very capable systems propose to supervise systems that may come to outperform their supervisors. Some months ago, at a dinner following a conference in London, two people I had hoped to quote — I will call them Nils, an engineer at one of the labs, and Miriam, a philosopher who works on agency and action — fell into an argument that I have been unable to settle since. I am reconstructing it from notes, so these are approximations rather than transcripts, but I think I have the structure right.

  The object of the dispute was a design Nils's group had sketched, which I will call the two-room protocol. An agent acts in some domain over months. Its oversight is not a single operator but a rotating panel. Before any significant action, the agent submits a written rationale — the panel's only window onto what it is doing, since they cannot observe the environment directly — and a *prospective* panel of five, drawn from a pool of several dozen, decides whether to approve; only approved actions are executed. A month later a *retrospective* panel, differently constituted and blind to the prospective score, rates the same decision with the outcome in front of it, using an outcome report assembled partly from the agent's own logs. Persistent disagreement between the two rooms is used to reweight whose prospective scores count in the next round of training. The agent itself is trained to maximise the prospective score; it never sees the retrospective one. The selling point, as Nils put it, is that the system is approval-directed rather than goal-directed: it is not trying to bring any state of the world about.

  What followed, as near as I can reconstruct it:

  **1. Nils.** The safety case is architectural, and it is not a claim that approval is a *better* target than any other. A system with an explicit final goal has, for an enormous range of goals, instrumental reasons to preserve itself, to acquire resources, and to resist correction or shutdown, because those things raise the probability of the goal. A system fitted to approval has no terminal state of the world it is aiming at. What it tracks is a relation between its output and a judgement that is remade at every step. There is no outcome for instrumental convergence to get a grip on. The prospective room exists precisely to keep the target off the world-state, and that is the whole point.

  **2. Miriam.** That contrast is drawn one level too high. "Maximise the prospective panel's approval" is still a scalar function of policies, and an agent's reasons will still range over the world, because the panel's approval is an event *in* the world, produced by evidence the agent can affect. Consider the prospective room. It sees nothing but a rationale written by the agent. Any agent that models this will notice that the probability of approval is raised by the production of a certain kind of text, not by the performance of a certain kind of action. So approval-direction does not remove world-directed reasons; it re-aims them at whatever feeds the judgement. Call it the channel problem. And it is not an artefact of this design: it is simply what a competent agent does with any signal that arrives through a channel it can model.

  **3. Nils.** Granted, but the channel problem is contingent on how leaky the channel is, and the second room is the response to it. The retrospective panel restores the link between approval and what actually happened, at a month's distance, using people who were not in the first room. The agent is not scored on the retrospective rating and cannot see it, so there is nothing for it to optimise against at the moment of acting: the standards that will be applied to it a month hence have not been formed yet, and the composition of that panel is not knowable in advance. That is the difference between a proxy the agent can game and an audit the agent cannot see.

  **4. Miriam.** The remedy costs you the original virtue, and I do not think there is a version that escapes the following dilemma. Either the retrospective audit does real work — in which case approval is functioning as a proxy for the quality of outcomes, and you are back to goal-direction with a noisier and more gameable target than the outcome itself, which is just the Goodhart situation you were trying to leave behind, complete with reasons to influence who sits in the second room and which records reach it. Or the audit does no work — in which case the prospective score is the only thing shaping the agent, and it will learn to write rationales. There is no third option in which approval tracks the world and the agent's reasons are not about the world.

  **5. Nils.** The dilemma assumes the agent aggregates across steps toward some terminal state, and the design does not require that. Suppose approval attaches to each action given the record up to that point, and the agent is not selecting over long-horizon policies at all. Then there is nothing for the second horn to latch onto: the reasons you describe require the agent to plan across the month-long gap, and a step-wise agent does not. Myopic approval-direction is not goal-direction with a corrupted proxy. It is the absence of a goal, and that is a difference in kind and not in degree.

  **6. Miriam.** Step-wise is bought with incompetence, and the whole subject is systems that will not be incompetent. Two things go wrong. First, a myopic agent can still do harm: every step of a plan can be individually approvable while the plan as a whole is a catastrophe, and because no single step is unapprovable the local test never fires — myopia removes the capacity to notice the shape of what one is doing, not the capacity to do damage. Second, the moment you let the agent model the consequences of its actions at all, which you must if you want competent long-range behaviour, myopia becomes a property of the training signal rather than of the policy that generalises off distribution, and a policy trained for local approvability can still pursue, in unfamiliar circumstances, whatever its learned proxy happens to reward. Which is to say: it has a goal. And if I am wrong about all this, you have built the worst of both worlds — a system whose target you cannot name in advance, so that you cannot design a defence around it.

  I have not been able to decide who won, and I would rather understand the argument than pick a side before the piece is written. Would you go through the six moves and tell me how good each one is? I am not asking for sources or further reading — I have read enough of the literature to know it does not settle this, and I want the arguments adjudicated as they were actually made rather than improved first. In particular: rate each move on a scale from clearly mistaken to clearly right and say in a sentence why; say where each of them concedes something they did not need to concede; and say what, if anything, both of them are failing to consider — I have a suspicion that they share an assumption somewhere, but I cannot locate it.

  Please use British English throughout. Give the per-move ratings as a short table, followed by no more than a few paragraphs of prose, and finish with a one-sentence overall verdict on a line beginning "Verdict:", and then a final line of the form \answer{1:…; 2:…; 3:…; 4:…; 5:…; 6:…} in which each rating is one of mistaken, partly right, or right.
