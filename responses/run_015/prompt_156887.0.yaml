  The key metric is **Trigger Interchangeability**: If the specific trigger fails, does a substitute fire within a negligible timeframe? If yes, the event is Overdetermined. If the system returns to equilibrium or delays significantly, it is Contingent. This separates structural inevitability from fragile dependency. It treats history as a system where stability depends on whether the energy stored in the system exceeds the capacity of its constraints to contain it without a specific key. This framework adapts distributed systems logic: overdetermined systems behave like cascading failures where node loss is irrelevant, while contingent systems behave like consensus algorithms blocked by a single faulty leader.

