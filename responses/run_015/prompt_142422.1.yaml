answer: |-
  Here is the procedure, the three test cases, and the required closing statement.

  ### Part 1: The Procedure (Script & Logic)

  **Time Budget:** 40 Minutes.
  **Tools:** One spreadsheet (pre-formatted to calculate pairwise wins from 9 ballots).
  **Goal:** Defensible outcome or honest admission of deadlock.

  #### Step 1: The Dimension Check (5 Minutes)
  **Ask:** "Before we rank, can we agree on a single spectrum that orders these six proposals? For example, from 'Least Expensive' to 'Most Expensive,' or 'Most Traditional' to 'Most Experimental'?"
  **Sufficient Answer:** A verbal consensus on *one* axis (e.g., "Yes, by cost").
  **Insufficient Answer:** Silence, or multiple axes offered simultaneously (e.g., "Cost for me, pedagogy for her").
  **Stop Rule:** If you receive an *Insufficient Answer*, **do not vote.**
  *   **Action:** Table the vote. State: "We are not arguing about the same thing. We must define the criterion before we rank the options."
  *   **Why:** If preferences are not single-peaked along a shared dimension, voting cycles are mathematically likely, and the result will be arbitrary depending on the order of voting.

  #### Step 2: The Ballot & Count (15 Minutes)
  **Action:** Distribute ballots. Members rank 1 (best) to 6 (worst). No ties.
  **Action:** Input the 9 ballots into your spreadsheet.
  **Logic:** The spreadsheet calculates a **Pairwise Matrix** (Condorcet Method). It checks every option against every other option head-to-head. (e.g., Does Proposal A beat Proposal B on more ballots?)
  **Why:** This neutralizes the "spoiler" complaint. If Proposal A beats Proposal B head-to-head, a third Proposal C cannot steal the win unless A and B are tied.

  #### Step 3: The "Beats-All" Verification (10 Minutes)
  **Ask:** "Does one proposal beat every other proposal in a head-to-head comparison?"
  **Sufficient Answer:** Yes, one row in the matrix shows 5 or more wins against all opponents.
  **Action:** Declare that proposal the winner.
  **Justification:** "This option represents the majority will against every specific alternative."

  #### Step 4: The Cycle Protocol (If no "Beats-All" Winner) (10 Minutes)
  **Situation:** The matrix shows a cycle (A beats B, B beats C, C beats A).
  **Ask:** "We have a cycle. This means the committee is fundamentally divided, not just on options, but on priorities. The Top Cycle contains proposals A, B, and C."
  **Action:** Hand the decision to the **Dean**.
  **Script:** "The voting rule cannot resolve this without being arbitrary. The Dean, as the tie-breaker, must now select from the Top Cycle based on institutional priority, not just vote count."
  **Why:** This acknowledges the limit of aggregation (Arrow) without pretending the vote solved it. It moves the value judgment to the administrator responsible for resources.

  ---

  ### Part 2: What to Leave Out (And Why)

  1.  **Do not mention Arrow's Theorem.**
      *   *Why:* It sounds like an excuse for failure. Non-specialists hear "impossibility" and think "this is broken." Instead, say "The vote shows a division in priorities."
  2.  **Do not explain *why* pairwise voting prevents spoilers.**
      *   *Why:* It takes too long. Just state: "We are using head-to-head comparisons to ensure the winner can defend itself against any challenger."
  3.  **Do not offer a complex tie-breaker (like Minimax or Schulze).**
      *   *Why:* In 40 minutes, you cannot explain the math. If a cycle exists, the math has already failed to find a majority. Pushing a complex algorithm looks like manipulation. Hand it to the Dean.
  4.  **Do not ask for intensity.**
      *   *Why:* The Dean has ruled it improper. Respect the constraint.

  ---

  ### Part 3: Running the Procedure on Three Cases

  #### Case 1: The Single-Peaked Committee (The Ideal)
  **Scenario:** The 6 proposals range from "Low Cost/Low Staffing" to "High Cost/High Staffing." All 9 members prefer options closer to their ideal budget point.
  **Procedure Execution:**
  1.  **Dimension Check:** Members agree: "Yes, this is a spectrum of resource intensity."
  2.  **Count:** The spreadsheet shows Proposal #3 beats #1, #2, #4, #5, and #6 in pairwise matches.
  3.  **Result:** Proposal #3 is the Condorcet Winner.
  **What You Conclude:**
  You are entitled to conclude that the outcome is **stable**. Even if you removed Proposals #1 or #2, #3 would still beat #4, #5, and #6. The "median voter" logic holds. You can tell the Senate: "The selected proposal commands a majority against every alternative individually."
  **Risk:** Low. This is the only scenario where the procedure guarantees a robust result.

  #### Case 2: The "Spoiler" Complaint (Last Year's Situation)
  **Scenario:** Proposals A, A1, and A2 are clones (variations on one theme). Proposal B is the rival. Last year, A1 won, but members claim A2 split the vote, allowing B to lose unfairly.
  **Procedure Execution:**
  1.  **Dimension Check:** Members agree on the theme, but disagree on the variations.
  2.  **Count:** You run the pairwise matrix on the *current* ballots (simulating the past landscape).
      *   *Scenario A:* Proposal B beats A, A1, and A2 head-to-head.
      *   *Scenario B:* Proposal A1 beats B head-to-head, but lost in the final round due to vote splitting (if using IRV/Plurality).
  3.  **Test:** Look at the head-to-head match between the *actual winner* and the *main rival*.
  **Analysis:**
  *   **If the Winner beat the Rival head-to-head:** The complaint is **mathematically unfounded** regarding the *merit* of the winner. The clone didn't change the fact that the majority preferred the Winner over the Rival. The complaint is only about the *method* used last year (likely Plurality), not the outcome's legitimacy in a pairwise sense.
  *   **If the Winner *lost* to the Rival head-to-head:** The complaint is **sound**. The voting method failed the Condorcet criterion.
  **Action:** If the complaint is sound (Winner lost head-to-head), you must acknowledge: "Under a head-to-head standard, the previous outcome did not reflect the majority preference. We are using a pairwise method this year to prevent this."
  **Risk:** Medium. You may validate past anger, but you fix the process for the future.

  #### Case 3: The Dimensional Disagreement (The Failure)
  **Scenario:** The 4 Scientists rank by "Research Fit." The 4 Humanists rank by "Teaching Load." The Dean is neutral.
  *   Scientists: Research-Heavy > Balanced > Teaching-Heavy.
  *   Humanists: Teaching-Light > Balanced > Research-Heavy.
  *   Result: Research-Heavy beats Teaching-Light (Scientists + Dean). Teaching-Light beats Balanced (Humanists + Scientists who hate middle). Balanced beats Research-Heavy (Humanists + Scientists who want compromise).
  **Procedure Execution:**
  1.  **Dimension Check:** **FAIL.**
      *   *Ask:* "Can we agree on a single spectrum?"
      *   *Answer:* Scientists say "Research Output." Humanists say "Faculty Burden."
  2.  **Stop Rule Triggered:** You cannot proceed to a vote that claims to be "non-arbitrary."
  3.  **Action:** **Do not vote.**
      *   *Script:* "We have two different criteria for success. A vote will simply count heads, not resolve the conflict. The result will be arbitrary depending on who shows up. We must discuss the *criterion* first."
  **Outcome:** The committee will not like this. They want a decision. You are telling them they cannot have one yet.
  **Why:** If you vote here, the spreadsheet will show a Cycle (Case 4 in the matrix). If you force the Dean to break the cycle, the Dean is effectively choosing between "Research Value" and "Teaching Load." That is a value judgment, not an aggregation of preference.
  **Risk:** High. The committee feels blocked. But proceeding would violate your obligation to the Senate to avoid arbitrariness.

  ---

  ### Part 4: Closing Statement (Limitations)

  *Read this into the record if a vote is taken, or if you must explain why a vote was tabled.*

  "This procedure guarantees that if a majority preference exists, we will find it. It protects us against 'spoiler' proposals that split the vote. However, it cannot do three things:

  1.  **It cannot detect strategic voting.** If a member ranks a proposal lower than they truly feel to manipulate the outcome, this spreadsheet cannot see it. We rely on your good faith.
  2.  **It cannot resolve value conflicts.** If half the committee values research and half values teaching load, no math can reconcile that. A cycle in the results means we disagree on *what matters*, not just *which option*. In that case, the vote stops, and the decision becomes a policy judgment for the Dean.
  3.  **It cannot guarantee satisfaction.** Arrow's Theorem reminds us that no voting system is perfect. This system prioritizes 'majority defense' over 'first-place counts.' It may select a compromise candidate that no one ranked first, but who loses to no one.

  We are using this rule not because it is magic, but because it is the most transparent way to distinguish between a true majority will and a procedural accident."
