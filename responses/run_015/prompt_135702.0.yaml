prompt: |-
  I'm a staff engineer on the platform team at a consumer finance app with roughly four million monthly users. I have no philosophy background, and I'm not looking for one: I need something I can use in code and design review.

  Here is the recurring situation. Several times a month a pull request or design doc crosses my desk containing a change that steers users: a default that's been flipped, a step made easier or harder, an option pre-selected, a notification reshaped, an off-switch moved somewhere quieter, a flow that only some users see because it only "worked" on them in an experiment. Our review template has a single line about this — essentially "is this a dark pattern?" — and it is useless: nobody has ever answered yes, and the discussions that do happen collapse into competing intuitions and whoever is seniorest in the room. Meanwhile these changes ship to millions of people, are cheap to reverse in a later release but not within the sprint, and the people affected never get asked. I can block a change in review; a product manager can escalate past me to a director; legal and accessibility sign off on some of them but not on these questions.

  What I want from you is a decision procedure I can actually run, in twenty to thirty minutes, on a real proposal, with the information a platform engineer has in front of them: the diff, the experiment readout if there is one, the metrics the team is being measured on, and a rough sense of who is affected. I need it as an ordered set of questions with a stopping rule: what counts as a sufficient answer to each question, at which points the procedure returns "no" and the change doesn't ship, where it returns "ship with this modification," and where it has to stop and hand the decision to a person or a different function because the remaining question is one of values, or because it's an empirical question we cannot answer inside a sprint. I want the hand-off points named explicitly, including which of them are my organization's job to staff and which ones we're currently pretending are engineering decisions.

  Some things I've picked up second-hand, which I don't trust my own version of: that steering which leaves every option available is different in kind from removing options; that steering people toward what they themselves already want is different from steering them toward what the designer wants; that some interventions leave people better able to choose next time while others work precisely by bypassing the part of them that chooses; and that how visible the steering is matters. I don't need to know who argued what or in what year. I need the distinctions that change what I should ship, kept only if they survive being turned into a question an engineer can answer in a few minutes without a philosopher in the room — and I'd like you to tell me honestly which of the distinctions above you had to drop or mangle to make them operational, and whether there's a distinction I haven't mentioned that has to be in there.

  There are six situations my team hits repeatedly, and the procedure has to give an answer on each rather than gesture at them:

  The first is the one I distrust most: we very often claim to be serving the user's own goals while the only evidence we have is a movement in a metric we chose, which is usually correlated with revenue. I need a test, runnable with the artifacts we have, for whether we are serving the user's ends or substituting our own — and I need to know what to do when the honest answer is that we can't tell.

  The second is that many of these mechanisms only work if the user doesn't notice them, while our policy requires disclosure in release notes and the help center. This produces steering that is technically disclosed and practically undiscoverable. I want to know whether that disclosure is doing any real work on your account, or whether it's a compliance ritual — and if the latter, what the procedure demands instead.

  The third is the one I think about most and have never seen discussed. We A/B test steering changes and ship them only to the segments where they moved behavior. That means the population that actually experiences the steering is, by construction, the population susceptible to it: we are selecting for persuadability. Is that morally different from shipping the same change to everyone, and if so in which direction? Does it matter that the excluded users — the ones who weren't moved — are arguably the ones whose ends we have best evidence about?

  The fourth is asymmetry of friction. We routinely make the path we approve of smoother and the path we disapprove of rougher: cancelling a subscription, turning off a feature we believe is good for people, reaching a setting that costs us money. Sometimes added friction is a speed bump that protects someone from their own haste; sometimes it's sabotage of a choice we've technically left available. I need a rule that separates these, and I need it to be a rule and not a vibe.

  The fifth is third parties. Some of these changes help the person using the app while pushing a cost onto someone else — a slower shipping option that helps our logistics and raises costs for a driver, a snooze that moves a task onto a support agent, a default that improves one household member's outcome at another's expense. I don't know whether the procedure is allowed to count those people, and if it is, how much weight they get relative to the user.

  The sixth is the easy-looking one: cases where the user has explicitly asked us to steer them — screen-time limits, savings commitments, a self-block list that's deliberately hard to edit. I assume that's a free pass, but I've been wrong about this kind of thing before, and there are edge cases where the request was made under conditions we engineered.

  I also want to flag a structural fact about my role, because I think it should change the procedure rather than just be noted: much of what I ship is a default in a shared component or a design-system primitive used by forty-odd teams I'll never meet. So I'm not deciding one intervention; I'm deciding the path of least resistance for a whole class of future interventions, most of which I won't see, and the teams building them have less latitude to think about this than I do. If that means the procedure needs a different or stricter branch for platform-level defaults than for a single screen, say so and write that branch.

  Then I want it run on three real cases, with the verdict and the reasoning shown, no hedging into a summary of considerations:

  One: round-up savings. Spare change on each purchase is swept into a savings pot, default on at enrollment, off switch two taps inside settings, and the company earns interest on the float. It measurably increases savings balances. The team that proposed it is measured on deposits.

  Two: quiet hours in our shared notification library. Notifications are batched and badge counts suppressed, on by default for every app that adopts the library; users can disable it, but the toggle sits in a submenu. We have no evidence users want this. My own team believes it's good for them and wrote it partly for that reason.

  Three: carbon-aware shipping. The slower, cheaper delivery option is pre-selected at checkout. The experiment showed no effect overall, but a large and significant effect among users checking out on mobile late at night; the proposal is to ship the pre-selection only to that segment. It saves the company money, it genuinely reduces emissions, and it saves those users money too. I personally want to ship it. Give me the honest answer even if it is "no," and even if it is "either everyone or no one."

  Finally, on confidence: for each of the three verdicts, tell me the single argument or consideration that would most plausibly make you change it, and where in the reasoning you think the failure is most likely to be. Label which steps of the procedure rest on contested empirical claims about how people actually behave or about what our users want, as opposed to steps that follow from the conceptual distinctions alone — I want to know which parts of this I'd have to re-litigate if someone sent me a new study. Then name one class of case where you think the procedure as you've written it would give the wrong answer, and say what it is about the procedure that makes it misfire there.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Persona:** Staff Engineer on a Platform Team at a consumer finance app (4M MAU).
      *   **Goal:** A practical, operational decision procedure (20-30 mins) for reviewing UI/UX changes that "steer" users (defaults, friction, nudges, etc.).
      *   **Constraints:** No philosophy background needed/wanted. Must work with available artifacts (diffs, metrics, docs). Must have stopping rules, hand-off points, and clear verdicts (Ship, Modify, Block/Escalate).
      *   **Specific Requirements:**
          *   Address 6 specific recurring situations (Revenue vs. User Goals, Disclosure vs. Discoverability, A/B Selection Bias, Asymmetry of Friction, Third-Party Costs, Explicit Requests).
          *   Account for the "Platform" nature (decisions affect 40+ teams, setting defaults for future interventions).
          *   Run the procedure on 3 specific cases (Round-up Savings, Quiet Hours, Carbon-Aware Shipping).
          *   Provide confidence analysis (what would change the verdict, where empirical claims lie, where the procedure might fail).
      *   **Tone:** Direct, operational, engineering-focused, honest about limitations.

  2.  **Deconstruct the "Philosophical" Inputs into Engineering Checks:**

      *   *Steering leaving options available vs. removing options:* -> **Reversibility Check.** Is the "off" path as easy as the "on" path?
      *   *Steering toward user wants vs. designer wants:* -> **Alignment Check.** Do we have evidence of user intent *prior* to the nudge, or just post-nudge behavior?
      *   *Bypassing choice vs. enabling choice:* -> **Cognitive Load Check.** Does this rely on System 1 (autopilot) or System 2 (deliberation)? Is the friction protective or obstructive?
      *   *Visibility:* -> **Salience Check.** Is the mechanism obvious to a reasonably attentive user?

  3.  **Drafting the Decision Procedure (The "Steering Review Protocol"):**

      *   *Structure:* Needs to be a flowchart logic but written as text.
      *   *Timebox:* 20-30 mins.
      *   *Inputs:* Diff, Metrics, Persona/Segment info.
      *   *Verdicts:* `SHIP`, `SHIP_WITH_MODIFICATION`, `BLOCK_AND_ESCALATE`.
      *   *Platform Layer:* Needs a specific "Multiplier" step because platform defaults amplify risk.

      *   *Step 1: Reversibility & Friction (The "Exit Door" Test).*
          *   Q: Is the cost to undo >= cost to do?
          *   Fail -> Block/Modify.
      *   *Step 2: Intent Alignment (The "Prior Preference" Test).*
          *   Q: Do we have evidence they wanted this *before* we made it easy?
          *   Fail -> Escalate (Value Judgment).
      *   *Step 3: Salience & Disclosure (The "Spotlight" Test).*
          *   Q: If we put this in release notes, would a user find the setting based on that text alone?
          *   Fail -> Modify (Increase Salience).
      *   *Step 4: Segment Susceptibility (The "Vulnerability" Test).*
          *   Q: Are we targeting users based on their inability to resist (e.g., late night, tired)?
          *   Fail -> Block/Escalate.
      *   *Step 5: Externalities (The "Cost Shifting" Test).*
          *   Q: Does this benefit the user/company by harming a third party (support, driver, other household member)?
          *   Fail -> Escalate (Product/Policy).
      *   *Step 6: Platform Multiplier (The "Primitive" Test).*
          *   Q: Is this a shared component?
          *   Yes -> Stricter threshold on Steps 1 & 3.

  4.  **Addressing the Six Specific Situations:**

      1.  *Revenue vs. User Goals:* Addressed in Step 2 (Intent Alignment). If metric = revenue only, and no user signal -> Escalate.
      2.  *Disclosure vs. Discoverability:* Addressed in Step 3 (Salience). Release notes aren't enough if the UI hides it.
      3.  *A/B Selection Bias:* Addressed in Step 4 (Segment Susceptibility). Targeting based on susceptibility is risky.
      4.  *Asymmetry of Friction:* Addressed in Step 1 (Reversibility). "Speed bump" vs. "Wall".
      5.  *Third Parties:* Addressed in Step 5 (Externalities).
      6.  *Explicit Requests:* Addressed in Step 2 (Prior Preference). But check for "engineered requests."

  5.  **Refining the Procedure for the "Platform" Context:**

      *   Platform engineers set the *gravity*. If the default is "steer," everyone steers.
      *   Need a "Platform Default Rule": Platform primitives must be neutral-by-default unless there is overwhelming evidence of universal benefit (e.g., security).

  6.  **Running the Cases:**

      *   *Case 1: Round-up Savings.*
          *   Default On. Off switch buried.
          *   Friction asymmetry (Easy on, hard off).
          *   Intent: Do they want to save? Maybe. But default on captures inertia.
          *   Platform: If this is a component used elsewhere, high risk.
          *   Verdict: `SHIP_WITH_MODIFICATION` (Make off-switch easier) or `BLOCK` if friction is too high. Let's go with `SHIP_WITH_MODIFICATION` requiring equal friction.
      *   *Case 2: Quiet Hours.*
          *   Default On. Submenu toggle.
          *   Intent: No evidence users want this. Team *believes* it's good.
          *   Salience: Low (submenu).
          *   Platform: High impact (all apps).
          *   Verdict: `BLOCK_AND_ESCALATE`. Paternalism without consent on a platform primitive is dangerous.
      *   *Case 3: Carbon Shipping.*
          *   Pre-selected for specific segment (mobile, late night).
          *   Benefit: User saves money, Company saves money, Environment helps.
          *   Risk: Targeting "tired" users (late night mobile).
          *   Verdict: `SHIP_WITH_MODIFICATION` (Remove segment targeting, ship to all or none). Targeting based on fatigue is the red flag.

  7.  **Confidence & Limitations Analysis:**

      *   *Empirical Claims:* What users "want" is hard to measure.
      *   *Failure Mode:* "Good outcomes justify means." (Consequentialism vs. Deontology).
      *   *Wrong Answer Class:* Crisis situations (e.g., suicide prevention nudge) where friction is good but this procedure might flag it as "obstructive."

  8.  **Review against Constraints:**

      *   *20-30 mins?* Yes, questions are binary/checked against artifacts.
      *   *Hand-off points?* Explicitly named (Product Director, Policy, Legal).
      *   *Philosophy dropped?* Dropped "Autonomy" as a metaphysical concept, kept it as "Reversibility." Dropped "Utilitarianism," kept it as "Net Benefit + Externalities."
      *   *Platform specific?* Added Step 6.
      *   *Honest about limitations?* Yes, in the confidence section.

  9.  **Final Polish:**

      *   Ensure tone is professional, direct, and respects the user's expertise.
      *   Make sure the "Hand-off" roles are clear (who owns the value judgment?).
      *   Check the "Six Situations" mapping to ensure none are glossed over.
      *   *Self-Correction on Case 3:* The prompt asks for "honest answer even if it is 'no'". Targeting users *because* they are susceptible (late night mobile) is the definition of predatory targeting in behavioral econ, even if the outcome is "green." I need to be firm on that.
      *   *Self-Correction on Case 1:* Round-ups are generally considered "good" in finance. But the *friction asymmetry* is the issue. The verdict should focus on the friction, not the feature itself.
      *   *Self-Correction on Case 2:* "Quiet hours" is paternalistic. On a *platform* library, this forces paternalism on 40 teams. This is a hard block unless there's user demand.

  10. **Final Output Structure:**
      *   The Protocol (Steps 0-6).
      *   Mapping the 6 Situations to the Protocol.
      *   The Platform Multiplier.
      *   The 3 Case Studies.
      *   Confidence & Limitations.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is a decision procedure designed for your constraints. It strips philosophical language down to engineering constraints: friction, visibility, evidence, and scope.

  ### The Steering Review Protocol (SRP)

  **Timebox:** 20–30 minutes.
  **Inputs:** Diff/Design Doc, Experiment Readout, Team OKRs/Metrics, User Segment Definition.
  **Verdicts:** `SHIP`, `SHIP_WITH_MODIFICATION`, `BLOCK_AND_ESCALATE`.

  #### Step 0: The Platform Multiplier
  **Question:** Is this change in a shared component, design primitive, or default configuration used by other teams?
  *   **Yes:** Apply a **Strict Threshold**. All subsequent "No" verdicts become `BLOCK_AND_ESCALATE`. Modifications must ensure the primitive allows *other* teams to opt-out easily.
  *   **No:** Proceed to Step 1.

  #### Step 1: Reversibility & Friction (The Exit Door Test)
  **Question:** Is the number of taps/time/effort to undo this change greater than the effort to accept it?
  *   **Artifacts:** Diff (compare `on` flow vs. `off` flow), Navigation Map.
  *   **Rule:**
      *   If `Effort(Off) > Effort(On)`: **Fail.**
      *   If `Off` path is hidden (e.g., inside settings while `On` is in-flow): **Fail.**
      *   *Exception:* Safety/Critical Security (e.g., 2FA).
  *   **Verdict on Fail:** `SHIP_WITH_MODIFICATION` (Equalize friction). If the team argues friction is "protective" (e.g., confirmation dialog), proceed to Step 4.

  #### Step 2: Intent Alignment (The Prior Preference Test)
  **Question:** Do we have evidence the user wanted this outcome *before* we made it the default/easy path?
  *   **Artifacts:** User Research, Support Tickets, Prior Opt-in rates.
  *   **Rule:**
      *   If Evidence = "Users do this when we make it easy" (Post-hoc behavior): **Fail.** This is preference falsification.
      *   If Evidence = "Users ask for this" or "Users try to do this and fail": **Pass.**
      *   If Evidence = "This improves a metric correlated with revenue": **Fail.** (See Situation 1).
  *   **Verdict on Fail:** `BLOCK_AND_ESCALATE` to Product Director. Label: "Value Judgment: Substituting Company Goal for User Goal."

  #### Step 3: Salience & Disclosure (The Spotlight Test)
  **Question:** If a user read the release note and then opened the app, could they locate the change or the setting within 30 seconds?
  *   **Artifacts:** Release Note text, UI Hierarchy.
  *   **Rule:**
      *   If Disclosure exists but Setting is >2 taps deep or unlabeled: **Fail.** (See Situation 2).
      *   If the mechanism relies on the user *not* noticing (e.g., pre-checked box in a long form): **Fail.**
  *   **Verdict on Fail:** `SHIP_WITH_MODIFICATION` (Increase visibility or simplify settings path).

  #### Step 4: Segment Susceptibility (The Vulnerability Test)
  **Question:** Is the change targeted at a segment defined by reduced capacity to deliberate (e.g., late night, high stress, new users, financial distress)?
  *   **Artifacts:** Experiment Segment Definition.
  *   **Rule:**
      *   If Segment = "Users who resisted this before" (Iterative persuasion): **Fail.**
      *   If Segment = "Users currently in a low-agency state" (e.g., 2 AM mobile checkout): **Fail.** (See Situation 3).
      *   If Segment = "Users who explicitly asked for help" (e.g., self-exclusion list): **Pass.** (See Situation 6).
  *   **Verdict on Fail:** `BLOCK_AND_ESCALATE` to Policy/ Ethics Board. Label: "Predatory Targeting Risk."

  #### Step 5: Externalities (The Cost Shift Test)
  **Question:** Does this benefit the user/company by imposing a direct cost on a third party not represented in the room?
  *   **Artifacts:** Operational Impact Assessment.
  *   **Rule:**
      *   If Cost falls on Support, Logistics, or Other Household Members: **Flag.**
      *   If Cost is absorbed by Company: **Pass.**
  *   **Verdict on Flag:** `BLOCK_AND_ESCALATE` to Ops/Partner Lead. Label: "Externalized Cost." (See Situation 5).

  #### Step 6: The Stop Rule
  If you have passed Steps 1–5: `SHIP`.
  If you have failed any step: Apply the verdict associated with that step.
  If a team argues that a "Fail" is justified by a greater good (e.g., "We hide the button to save them from themselves"): **Stop.** Do not decide this. Escalate to Director/Policy. This is a values question, not an engineering one.

  ---

  ### Mapping Your Six Situations to the Protocol

  1.  **Revenue vs. User Goals:** Handled in **Step 2**. If the only evidence is metric movement (revenue/engagement) without prior intent signal, it fails. The hand-off is to the Product Director because deciding "what is good for the user" is a business strategy call, not engineering.
  2.  **Disclosure vs. Discoverability:** Handled in **Step 3**. Release notes are not UI. If the setting isn't findable, the disclosure is a ritual. The fix is engineering (move the toggle), not legal.
  3.  **A/B Selection Bias:** Handled in **Step 4**. Targeting users *because* they are susceptible (the "persuadable" segment) is distinct from shipping to all. It is riskier. The procedure treats this as a `BLOCK` because it exploits variance in willpower.
  4.  **Asymmetry of Friction:** Handled in **Step 1**. "Speed bumps" (protective) must be symmetric or explicitly requested (Step 6). If friction only applies to the "costly" choice (cancellation), it fails.
  5.  **Third Parties:** Handled in **Step 5**. The procedure counts them. It does not weigh them (engineering cannot value a driver's time vs. a user's money). It flags the cost shift for the stakeholder who owns that relationship (Ops/Partner).
  6.  **Explicit Requests:** Handled in **Step 2 & 4**. If the request is explicit and verified, Step 2 passes. However, Step 4 checks if the request was engineered (e.g., "Do you want to save money?" asked right after a spending spike).

  **Distinctions Dropped/Mangled:**
  *   *Autonomy:* I dropped "autonomy" as a metaphysical state. I replaced it with **Reversibility**. If you can undo it easily, I assume your autonomy is intact for engineering purposes.
  *   *Better Able to Choose:* I dropped the distinction between "teaching" vs. "bypassing." It is too hard to measure in a sprint. I replaced it with **Salience**. If they can see it, they can learn it. If it's hidden, they can't.
  *   *Added Distinction:* **Platform Scope.** You mentioned this is critical. A nudge in a shared library is not a nudge; it is a *constraint* on 40 other teams. Step 0 enforces this.

  ---

  ### Case Studies

  #### Case One: Round-up Savings
  *   **Inputs:** Default On. Off-switch 2 taps deep (Settings). Metric: Deposits (Revenue/Engagement).
  *   **Step 0 (Platform):** Assume Yes (Shared Component). **Strict Threshold.**
  *   **Step 1 (Friction):** On = 0 taps (Default). Off = 2 taps + Settings navigation. `Effort(Off) > Effort(On)`. **FAIL.**
  *   **Step 2 (Intent):** Evidence = "Increases savings balances." No evidence users asked for this prior to enrollment. **FAIL.**
  *   **Step 3 (Salience):** Off switch in Settings. Release note likely says "New savings features." User cannot find toggle in 30s. **FAIL.**
  *   **Verdict:** `SHIP_WITH_MODIFICATION`.
  *   **Reasoning:** The feature itself is benign/positive, but the implementation violates Step 1 and Step 3.
  *   **Required Modification:** The "Off" switch must be visible on the enrollment screen (e.g., "Don't enable round-ups" link of equal visual weight) or the toggle must be on the main dashboard, not inside Settings.
  *   **Escalation:** If the team refuses to move the toggle out of Settings, `BLOCK_AND_ESCALATE`.

  #### Case Two: Quiet Hours (Notification Library)
  *   **Inputs:** Default On. Toggle in Submenu. No user evidence. Team belief: "Good for them."
  *   **Step 0 (Platform):** **Yes.** This is a shared library primitive. **Strict Threshold.**
  *   **Step 1 (Friction):** On = Default. Off = Submenu. **FAIL.**
  *   **Step 2 (Intent):** Evidence = None. Team belief != User intent. **FAIL.**
  *   **Step 3 (Salience):** Toggle in submenu. **FAIL.**
  *   **Verdict:** `BLOCK_AND_ESCALATE`.
  *   **Reasoning:** This is paternalism baked into a platform primitive. It forces 40 teams to nudge their users without those teams' consent or their users' request. Because it is Step 0 (Platform), the friction failure is a hard block.
  *   **Hand-off:** Product Director + Platform Lead. The question is: "Do we want to be a platform that defaults to suppressing notifications for all clients?" This is a business positioning decision, not engineering.

  #### Case Three: Carbon-Aware Shipping
  *   **Inputs:** Pre-selected. Segment: Mobile + Late Night. Benefit: User saves $, Company saves $, Emissions down.
  *   **Step 0 (Platform):** No (Checkout flow).
  *   **Step 1 (Friction):** Pre-selected. User must actively change to fast shipping. `Effort(Off) > Effort(On)` regarding the *company's* preferred outcome (slow shipping), but `Effort(Off)` (fast shipping) is available. Let's assume equal clicks, just different default. **PASS.**
  *   **Step 2 (Intent):** Users save money. Likely aligned. **PASS.**
  *   **Step 4 (Susceptibility):** Segment = "Mobile + Late Night." This proxies for "Tired/Impulsive." You are targeting users when their guard is down. **FAIL.**
  *   **Verdict:** `SHIP_WITH_MODIFICATION`.
  *   **Reasoning:** The outcome is positive (triple win), but the *mechanism* relies on targeting susceptibility (Step 4).
  *   **Required Modification:** Ship to **Everyone** or **No One**. You cannot segment based on time-of-day fatigue to increase compliance with a default. If it's good for them at 2 AM, it's good for them at 2 PM. If the experiment shows no effect at 2 PM, you do not have evidence it is "what they want," you only have evidence they are too tired to care at 2 AM.
  *   **Honest Answer:** If you must segment to make the metric work, you are steering the tired. `BLOCK` the segmentation. Ship to all. If the metric dies when shipped to all, you have your answer: users don't want it, they just ignore it when tired.

  ---

  ### Confidence & Limitations

  **Confidence on Verdicts:**
  1.  **Round-ups:** High Confidence. Friction asymmetry is objective.
  2.  **Quiet Hours:** High Confidence. Platform defaults require neutrality.
  3.  **Carbon Shipping:** Medium Confidence. The "Tired User" proxy is empirical.

  **The Single Argument That Would Change My Mind:**
  *   **Case 3 (Carbon):** If you can prove that "Late Night Mobile" is not a proxy for fatigue but a proxy for *planning*. (e.g., Users browse late but ship next day). If the segment is "Planners" not "Tired," Step 4 passes.
  *   **Case 2 (Quiet Hours):** If you have data showing that *noise* from this app causes churn. If "Quiet Hours" is actually "Retention Protection," Step 2 passes (User wants to keep using app).

  **Most Likely Failure Point in Reasoning:**
  *   **Step 2 (Intent Alignment).** This step rests on the contested empirical claim that *past behavior* or *support tickets* accurately reflect *future desire*. Users often don't know what they want until they see it. By requiring "Prior Preference," I may be blocking innovations that users would love once adopted.
      *   *Re-litigation:* If you send me a study showing "Users report higher satisfaction *after* 30 days of Quiet Hours," I would have to relax Step 2 to allow "Retrospective Consent."

  **Where The Procedure Gives The Wrong Answer:**
  *   **Crisis Intervention.**
      *   *Class of Case:* Suicide prevention, fraud interception, health emergencies.
      *   *Why it Misfires:* In these cases, you *want* high friction (Step 1 Fail) and you *want* to bypass choice (Step 2 Fail). You want to be paternalistic.
      *   *Fix:* Add a "Safety Exception" flag at Step 0. If the change is tagged `Safety/Critical_Harm`, Steps 1 and 2 are inverted (Friction is required, Intent is assumed). This requires a specific Security/Policy sign-off, not Product.

  **Hand-Off Reality Check:**
  *   **Values Decisions:** Step 2 and Step 4 failures often require a Product Director to say "We accept the risk of being paternalistic." I have labeled these `BLOCK_AND_ESCALATE`. In your org, if the Director says "Ship it," you have your cover. The procedure ensures *you* asked the question.
  *   **Empirical Decisions:** Step 4 (Susceptibility) is the weakest link. It relies on your team's honesty about why they chose that segment. If they lie about *why* they targeted late-night users, the procedure breaks. There is no engineering fix for dishonesty; that is a culture issue.

  **Final Note on Your Role:**
  You are the gatekeeper of the *gravity* of the system. By enforcing Step 0 (Platform Multiplier), you prevent 40 teams from each adding a tiny bit of friction that sums up to a maze. Your "No" on a primitive is worth forty "No"s on features. Use Step 0 aggressively.
