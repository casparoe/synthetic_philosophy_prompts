answer: |-
  You have stumbled onto the central methodological fight in the philosophy of history, but you have done it by building your own statistical intuition rather than reading Foucault or Koselleck. That is a good place to start.

  Your four tests are not equal. Tests 1 and 2 (Export and Clustering) are tests of **correlation**. Tests 3 and 4 (Delete and Acquisition) are tests of **causation and structure**. Your intuition that they are pulling you in different directions is correct because correlation does not imply ontology. You can have a cluster of unrelated events (Test 2) or a global phenomenon that changes nothing fundamental (Test 1), but a period is only "real" in the sense you are looking for if it represents a structural change in the system.

  Here is the principle that resolves your inconsistencies, stated in terms suited to your trade.

  ### The Principle: Hysteretic Phase Transition

  **Definition:** A historical period is ontologically real if and only if it marks a **hysteretic phase transition** in the underlying state-space of human organization.

  **Precise Conditions:**
  1.  **Irreversibility (Hysteresis):** The transition moves the system from State A to State B such that returning to State A is functionally impossible or prohibitively costly without total system collapse. (This captures your **Acquisition Test**).
  2.  **Constraint:** The new state imposes hard constraints on future trajectories that did not exist in State A. Removing the label removes the explanation for why certain subsequent events became possible or impossible. (This captures your **Delete Test**).
  3.  **Independence from Style:** The transition must be infrastructural (energy, epistemology, demography, governance), not merely aesthetic or ideological.

  **Why this works:**
  In physics and statistics, hysteresis describes a system where the output depends not only on the current input but on the *history* of the input. Once a magnetic field is magnetized, it stays magnetized. Once a society industrializes, it cannot "un-industrialize" without collapse; it is locked into a new equilibrium of population density, energy use, and social organization.

  ### Evaluation of Your Four Tests

  *   **Test 4 (Acquisition) is the Engine.** This is the definition of hysteresis. If a capacity is acquired and cannot be lost, the system has moved to a new basin of attraction. This is the only load-bearing test.
  *   **Test 3 (Delete) is the Verification.** If the period is a phase transition, it must be causally potent. If you can explain the outcomes without the period label, it wasn't a transition; it was just noise.
  *   **Test 2 (Clustering) is a Symptom, not a Cause.** Phase transitions often look like clustering (everything changes at once), but clustering can also be coincidental (the Axial Age). Relying on this leads to false positives.
  *   **Test 1 (Export) is Redundant and Often Wrong.** A phase transition can be local. The Meiji Restoration was a hysteretic shift for Japan, even if Europe wasn't doing it. Requiring global export disqualifies real structural changes just because they were regional.

  ### The Inconsistency: Which Verdicts Must Go?

  You suspected the **Middle Ages** was exposed and **Late Antiquity** was the rule-breaker. You are half-right.

  **The Pill to Swallow:** You must demote the **Middle Ages** from "Real" to "Convenience."

  **The Case:**
  Under the Hysteresis Principle, the "Middle Ages" fails Test 4. What capacity was acquired in 500 AD that could not be lost in 1500? Nothing. The "Middle Ages" is a duration, not a transition. It is the *interval* between the collapse of Rome (a negative shock) and the Renaissance/Early Modern period (a new equilibrium).
  *   **Late Antiquity** is Real. It describes the *process* of transformation from Classical to Medieval structures (Christianization, the shift from citizen to subject, the economic fragmentation). It is a phase transition.
  *   **The Middle Ages** is the name later generations gave to the valley between their peak and the Classical peak. It is a value judgment, not a structural description.
  *   **The Renaissance** is correctly marked as "Convenience." It was a cultural style and a recovery of texts, not a hysteretic shift in capacity (that comes later with the Printing Press/Scientific Revolution).

  **The Contradiction Resolved:** You cannot have the Middle Ages be Real if the Renaissance is Convenience, because the former is defined entirely by its relationship to the latter. If the Renaissance is just a style, the "Middle" is just the time before that style. By adopting the Hysteresis Principle, you keep **Late Antiquity** (the transition) and **The Industrial Revolution** (the transition), but you admit that the "Middle Ages" is a filing cabinet, not a machine.

  ### Applying the Principle to New Cases

  Here is how the Hysteresis Principle classifies your new list, including the one you will hate.

  1.  **The Neolithic Revolution:** **Real.** (Irreversible shift to agriculture/population density. You cannot go back to hunter-gathering with the same population.)
  2.  **The Bronze Age Collapse:** **Real.** (A negative hysteretic shift. Complexity was lost and could not be regained for centuries. A phase transition to a lower energy state.)
  3.  **The Anthropocene:** **Real.** (Geological and biological hysteresis. The carbon cycle and biodiversity state have shifted to a new equilibrium that constrains all future human action.)
  4.  **The Information Age:** **Real.** (Digital infrastructure creates path dependence in economics and cognition that is irreversible.)
  5.  **The Cold War:** **Not Real (Convenience).** This is the pill you might hate. Under the Hysteresis Principle, the Cold War was a political configuration, not a structural phase transition. The capacity for nuclear war is real, but the "Cold War" itself was a specific game played within the Industrial/Modern state-space. Historians in 200 years will likely group it under "The Nuclear Era" (Real) rather than "The Cold War" (Political Episode).

  **Why you might hate this:** We feel the Cold War was "Real" because it defined our lives. But the Principle says it was a *contingent* outcome of the Real period (The Nuclear/Industrial Age). If the USSR had won, the structural constraints of the Information/Industrial age would remain. The label "Cold War" explains the politics, but not the capacity.

  ### Future Historiography and Subject Specificity

  **What will historians in 2224 use?**
  They will keep the labels that denote **Hysteresis**.
  *   They will use: *The Neolithic, The Industrial Revolution, The Digital Transition, The Anthropocene.*
  *   They will discard: *The Enlightenment, The Age of Revolutions, Postmodernity, The Baroque.*
  These discarded terms will be treated like "The Gilded Age"—useful for describing the *mood* or *policy* of a specific decade, but not a fundamental epoch of human history.

  **Can a period be real for one subject and not another?**
  Yes, but with a caveat.
  *   **Domain Specificity:** The "Baroque" might be a Real Period for *Art History* if it represents a hysteretic shift in technique or visual language that cannot be un-learned. However, it is Not Real for *Economic History*.
  *   **The Collapse:** The concession collapses only if you claim "Grand History." If you claim "The Baroque Age" (implying everything was Baroque), you are wrong. If you claim "The Baroque Period in Architecture," you can defend it using the Hysteresis Principle (did it lock in a new structural capability in building?).
  *   **Your Statistician's Eye:** Think of this as **Multicollinearity**. In "Grand History" periods, the variables (economics, art, war) are highly correlated. In "Domain Specific" periods, they are not. Your Principle works best where the multicollinearity is high across the fundamental constraints of survival and organization.

  ### Summary of Instructions for Your Framework

  1.  **Discard Tests 1 and 2.** They measure visibility, not reality.
  2.  **Elevate Test 4 (Acquisition)** to the primary definition. Look for ratchets, not rhythms.
  3.  **Use Test 3 (Delete)** to verify. If the label is removed, does the causal chain break?
  4.  **Accept the verdict:** The **Middle Ages** is a convenience. **Late Antiquity** is the Real transition that precedes it. The **Cold War** is a political episode within the Real **Nuclear/Industrial** period.

  Your friend the historian is technically right that periods are "cooked up," but she is wrong to imply they are *only* cooked up. Some are discovered boundaries in the state-space of human capacity. Your job is to distinguish the boundaries from the boxes.
