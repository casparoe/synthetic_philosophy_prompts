  **Verdict:** **Skyhook.**

  **Reasoning:**
  You identified two competing rules: the **No-Uncraned-Explainers Rule** (is there a route from below?) and the **No-Homunculus Rule** (does the explainer possess the capacity it explains?). In this case, the route from below exists (fine-tuning), which satisfies the first rule. However, the second rule is the stricter filter in her history.

  Compare the model's "internalised value" to the "model understands French" ruling. Both attribute a normative, reason-responsive capacity to a system where that capacity is the very thing needing explanation. The fact that fine-tuning exists does not make "value" the correct mechanistic term; it makes "value" a metaphor for the disposition.

  Crucially, look at her **Thermostat** ruling versus her **Ant Colony** ruling. She allowed the thermostat's "wanting" only because it was "cashed out on the spot" (bimetallic strip). She allowed the ant colony's "aiming" because it could "in principle be retold" as individual rules. The paper's main text makes the "value" claim without the cash-out, relegating the mechanistic reality to a footnote. She treats the main text claim in isolation. Because the term "internalised value" implies a normative architecture that is explicitly denied in the footnote ("no value anywhere"), the main text claim functions as a homunculus. It borrows the explanatory power of human morality without the mechanism to support it. It is a skyhook that the footnote attempts to dismantle, but the explanation itself remains guilty.

  ### 2. The Footnote
  **Verdict:** **Greedy Reductionism.**

  **Reasoning:**
  Here the tension is between the **Recover-Generalisation Rule** (does the lower level preserve the higher level's predictive power?) and the **Eliminative-Tone Rule** (does the explanation deny the reality of the higher level?).

  Her ruling on "Meaning = Neural Firing" (Greedy) versus "Mendelian = Base-pair" (Good) suggests she cares about whether the higher-level generalization survives. "Meaning" involves semantics; neural firing does not inherently recover semantics. "Mendelian inheritance" involves transmission; base-pair chemistry fully recovers transmission.

  In the footnote, the authors claim there is "no value anywhere" and reduce the behavior to "refusal-shaped continuations." This phrasing fails to recover the **reason-tracking** generalization described in the paper (that the model refuses based on *reasons* given, not surface features). "Refusal-shaped continuations" describes the output, not the structural sensitivity to the input's semantics. Furthermore, the phrase "no value anywhere" is eliminative in the same way "nothing but neural firing" is. It treats the functional description as an illusion rather than a real pattern supported by the substrate. Because it discards the functional generalization (reason-tracking) in favor of a physicalist description that doesn't fully capture it, while explicitly denying the reality of the higher level, it fits her profile for greedy reductionism.

  ### 3. Diagnostic Cases
  To confirm which specific sub-rules she is applying, propose these hypothetical rulings to her. The outcomes will tell you which of the competing principles is dominant.

  **Axis 1: The "Cash-Out" Proximity (Thermostat vs. Ant Colony)**
  *   **The Case:** A paper describes a bacterium moving up a glucose gradient.
      *   *Version A:* The text states, "The bacterium *swims toward* higher glucose concentrations," and the very next sentence explains the chemotaxis signaling pathway and flagellar motor mechanics.
      *   *Version B:* The text states, "The bacterium *swims toward* higher glucose concentrations," and the mechanism is detailed in a footnote or a supplementary section referenced later.
  *   **The Diagnostic:**
      *   If she accepts **both** as Cranes: She prioritizes the **Existence of Route** (the Ant Colony rule). The mechanism just needs to be available in the work.
      *   If she accepts **A** but rejects **B** as a Skyhook: She prioritizes the **Proximity of Cash-Out** (the Thermostat rule). Teleological language is only admissible if the mechanism is provided "on the spot" to prevent the reader from inferring a homunculus.

  **Axis 2: Sufficiency vs. Eliminative Tone (Mendelian vs. Meaning)**
  *   **The Case:** A paper describes a sorting algorithm.
      *   *Version A:* The text states, "The algorithm *sorts* the list by value," and the footnote adds, "Sorting is *nothing but* a sequence of register swaps and pointer comparisons," where the physics of the swaps fully determines the sorted outcome.
      *   *Version B:* The text states, "The algorithm *sorts* the list by value," and the footnote adds, "Sorting is *implemented by* a sequence of register swaps and pointer comparisons," where the physics of the swaps fully determines the sorted outcome.
  *   **The Diagnostic:**
      *   If she accepts **both** as Good Reduction: She prioritizes the **Recover-Generalisation Rule**. Since the lower-level story fully explains the higher-level outcome, the reduction is valid regardless of tone.
      *   If she accepts **B** but rejects **A** as Greedy: She prioritizes the **Eliminative-Tone Rule**. Even if the lower level is sufficient, the phrase "nothing but" (or "no value anywhere") is penalized because it denies the reality of the functional level rather than grounding it.
