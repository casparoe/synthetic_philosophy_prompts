answer: |-
  # The procedure

  This protocol isolates confounding variables in fifteen minutes. It treats cases like lab equipment: if the instrument measures two things at once, it is broken. Your goal is not to solve the ethics problem, but to ensure the prompt forces the student to engage with the specific variable you intend. Do not debate the moral truth; debate the clarity of the trap.

  **Step 1: Tag the Purpose (2 minutes)**
  Read the case and state its function aloud. Is it **Rhetoric** (designed to provoke a specific feeling or intuition pump) or **Evidence** (designed to test if students track a specific distinction)? Write this down. Rhetoric tolerates emotional loading; Evidence demands purity. If you cannot state the single variable being tested (e.g., "arrival time," "consent," "outcome luck"), stop and hand it to the professor. A case cannot be evaluated if its target is unknown.

  **Step 2: The Detail Audit (5 minutes)**
  Highlight every noun and adjective that is not logically required for the scenario to exist. In a drug shortage, "pharmacist" is required; "leftover dose" is required. "Eleven minutes" is specific; "Nurse" is specific. For each highlighted detail, ask: "If I remove this, does the moral judgment change?" If the answer is yes, that detail is a confound. Pay special attention to "Hidden Defaults." If a detail is underdescribed (e.g., "a house"), readers fill in the blank with their own default (e.g., "a family home with children"). If the default carries moral weight, it must be explicit or neutralized.

  **Step 3: The Swap Test (5 minutes)**
  Take the confounding details identified in Step 2 and swap them for neutral alternatives. If the case tests "arrival time," swap "nurse" for "civilian" or "doctor." If the case tests "luck," ensure the agents' actions are described identically. Read the modified version. Does the intended judgment hold? If the judgment flips or vanishes, the original case was doing its work with the confound, not the variable. For Evidence cases, this failure means "Fix" or "Retire." For Rhetoric cases, this failure means "Fix" only if the confound distracts from the feeling; if the confound *creates* the feeling, it may "Keep."

  **Step 4: The Disgust Check (3 minutes)**
  Read the outcome. Is the negative reaction based on moral wrongness or visceral disgust (e.g., bodily fluids, desecration)? If the case relies on disgust to drive a moral judgment, it is invalid for Evidence purposes. For Rhetoric, it is permissible only if the disgust is the point, not a shortcut. If disgust is accidental, mark "Fix."

  **Verdict Rules**
  *   **Keep:** No confounds found; judgment tracks the target variable.
  *   **Fix:** Confounds found but removable via minimal edit (change one word or phrase). Specify the edit exactly.
  *   **Retire:** The core mechanism is broken; fixing it requires rewriting the whole scenario.
  *   **Escalate:** You cannot identify the target variable, or the fix requires theoretical knowledge you lack.

  Hand the case to the professor only if the verdict is "Retire" or "Escalate." If "Fix," apply the edit and file the original in the "Notes" section for the professor's review. Do not speculate on why the professor wrote it; focus on how the students will read it.

  # Three cases

  **Case 1: The Pharmacist**
  *Purpose:* Evidence (Testing arrival time vs. social utility).
  *Audit:* "Nurse" is a high-load detail. It introduces professional duty and institutional loyalty, which confounds "arrival time." "Eleven minutes" is precise, which is good, but "leftover dose" implies scarcity without specifying rationing rules.
  *Swap:* Change "nurse" to "another patient." If students still prioritize the first arrival, the variable holds. If they prioritize the nurse, the original case was testing professional priority, not queue ethics.
  *Verdict:* **Fix.** The "nurse" detail smuggles in a duty of care that overrides the queue.
  *Edit:* Change "the other is a nurse at the same hospital" to "the other is a local teacher." This isolates arrival time as the only distinguishing factor.

  **Case 2: The Tissue Samples**
  *Purpose:* Evidence (Testing consent vs. utility).
  *Audit:* "De-identified" is a sanitizing detail that reduces the violation's weight. "Saves hundreds" is a high-utility override. The hidden default is that "no donor consent" implies "donors would have objected," which may not be true.
  *Swap:* Increase the violation severity. Specify "families could have been contacted but were not." Decrease the utility slightly to see if the judgment holds.
  *Verdict:* **Fix.** The utility outweighs the violation too easily, and "de-identified" hides the harm.
  *Edit:* Add "donors were reachable but not asked" and change "saves hundreds" to "improves testing accuracy." This forces a weighing of consent against utility rather than utility against nothing.

  **Case 3: The Hikers**
  *Purpose:* Evidence (Testing moral luck).
  *Audit:* "Identical dry pine needles" is the crucial control. "Lit cigarette" is the action. "Burns down a house" is the outcome. The hidden default is that the house contains people, inflating the blame beyond property damage.
  *Swap:* Ensure the action description is verbatim identical for both hikers. Check if "house" implies occupancy.
  *Verdict:* **Keep.** The case isolates outcome luck effectively.
  *Edit:* None required, but add "empty house" to ensure blame tracks property damage, not potential death. This preserves the luck intuition without introducing accidental harm variables.

  # Where it misfires

  This procedure fails when the TA's intuitions match the class's by accident. If you share the professor's cultural background or educational niche, you may miss a confound that students will spot. You are not the subject; you are the mechanic. If a case feels "obviously" one way to you, that is a warning sign, not a pass. Students bring different defaults to "house," "nurse," or "family."

  It also misfires on "Rhetoric" cases where the loading is the point. If the procedure strips away all emotional weight, you may break a case designed to provoke. Use the Purpose Tag in Step 1 strictly. If the case is Rhetoric, the Swap Test should check if the *feeling* survives, not if the logic holds.

  Finally, escalate if the "Fix" requires theoretical knowledge. If the minimal edit involves distinguishing "negative rights" from "positive duties," you cannot make that call. Hand it to the professor with the note: "Confounding variable identified; fix requires theoretical precision." Do not guess. The goal is to prevent bad data, not to generate good philosophy.
