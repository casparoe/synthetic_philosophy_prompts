answer: |-
  This is a remarkably clean set of intuitions. You have effectively reinvented **Functional Decision Theory (FDT)** (or its predecessor, Timeless Decision Theory), though you are applying it with a heuristic "vibe check" rather than the formal machinery.

  Your tentative principle ("outputs of the same computation") is the right shape, but it is too vague on *what counts as the computation* and *how to handle partial correlation*. Below is the tightened principle, an audit of your verdicts, new stress-test cases, and the name of the theory you are wearing.

  ### 1. The Precise Principle

  Your principle needs to move from "same computation" to "logical correlation between decision functions."

  **The Principle of Logical Correlation:**
  > Choose the action that maximizes expected utility, treating your decision not as a causal intervention on the world, but as the output of a fixed decision function $D$. Assume that other agents' decisions are the output of functions $D'$ that may be logically correlated with $D$.
  >
  > You cooperate if: $P(\text{Opponent Cooperates} | \text{I Cooperate}) \times U(CC) + P(\text{Opponent Defects} | \text{I Cooperate}) \times U(CD) > \dots$ (and so on for Defect).
  >
  > **Crucially:** The conditional probability $P(\text{Opponent Cooperates} | \text{I Cooperate})$ is not causal (they don't see your move); it is *logical*. It represents your credence that if your function $D$ outputs 'Cooperate', their function $D'$ also outputs 'Cooperate'.

  **What has to match?**
  The *algorithm* plus the *relevant inputs*.
  *   **Algorithm:** The reasoning process (e.g., "maximize expected utility").
  *   **Inputs:** Information available to the agent *before* the decision.
  *   **"Might be":** This is your *credence* in the logical correlation. If you are 99% sure they are your clone, correlation is 0.99. If you are 50% sure they are a clone and 50% sure they are a stranger, you calculate expected utility across those two logical possibilities.

  ### 2. The Verdict Audit

  Here is where your principle forces you to change your mind, and where I think you should change it.

  **Case 1 & 2 (Clone/Twin):** **Keep.**
  *   *Principle:* High logical correlation. $D \approx D'$.
  *   *Verdict:* Cooperate. Correct.

  **Case 3 (Stranger):** **Keep.**
  *   *Principle:* Low logical correlation. Different priors, different upbringing = different inputs = divergent functions.
  *   *Verdict:* Defect. Correct.

  **Case 4 (Coin-Flip Info Asymmetry):** **Drop.**
  *   *Your Verdict:* Lean Cooperate.
  *   *Principle Verdict:* **Defect.**
  *   *Why:* You know the setup; the copy might not. If the copy saw the fake table, their input differs from yours. If their input differs, their output may diverge from yours. Since you don't know *which* world you are in (Fake Table vs. Real Table), you must average. In the Fake Table world, they might defect while you cooperate (you get $0). In the Real Table world, you both cooperate ($1000). But if you defect, you guarantee at least $10. The logical link is broken by the information asymmetry. You cannot rely on a correlation that might not exist.

  **Case 5 (AI / System Prompt):** **Drop.**
  *   *Your Verdict:* Unsure / "Ruthless" prompt might matter.
  *   *Principle Verdict:* **Defect.**
  *   *Why:* The system prompt *is* an input to the function. If the prompt says "be ruthless," the function is literally $D_{ruthless}(x)$, not $D_{you}(x)$. Even if weights are identical, the function definition includes the prompt. Different inputs $\rightarrow$ no logical correlation $\rightarrow$ Defect.

  **Case 6 (Newcomb 55%):** **Drop.**
  *   *Your Verdict:* 2-box at 55% accuracy.
  *   *Principle Verdict:* **1-box.**
  *   *Why:* This is pure math. If the box contains $1M and the empty hand is $1k:
      *   1-box EV: $0.55 \times 1,000,000 = 550,000$.
      *   2-box EV: $0.55 \times 1,000 + 0.45 \times 1,001,000 \approx 451,000$.
      *   (Assuming standard Newcomb payoffs).
      *   Your intuition here is risk aversion, not decision theory. Unless you value "not being fooled" more than $99,000, the principle demands 1-boxing until the predictor is barely better than random.

  **Case 7 (Public Goods / 10,000 People):** **Drop (Major Conflict).**
  *   *Your Verdict:* Press at 10,000 people.
  *   *Principle Verdict:* **Do Not Press.**
  *   *Why:* This is the strongest test. Superrationality does not dilute with $N$. If you reason "I am a sample of the group," then *if I press, everyone presses*.
      *   If I press $\rightarrow$ 10,000 press $\rightarrow$ Everyone gets $0.
      *   If I don't $\rightarrow$ 10,000 don't $\rightarrow$ Everyone gets $1,000.
      *   Your intuition here is **Causal Decision Theory (CDT)** slipping in ("My single button press doesn't *cause* the others to press"). But your principle is FDT ("My reasoning is the same as theirs"). You cannot hold both. If you are superrational, the group size is irrelevant; the logical correlation is binary.

  **Case 8 (Voting):** **Keep (with caveats).**
  *   *Your Verdict:* Vote.
  *   *Principle Verdict:* Vote.
  *   *Why:* This is the same as Case 7. If you view yourself as a logical representative of your demographic ("people like me"), then your decision correlates with theirs. If "people like me" stay home, the candidate loses. If they vote, they win. You are buying a "block vote" with a single action.

  **Case 9 (Fixed Defector):** **Keep.**
  *   *Your Verdict:* Defect.
  *   *Principle Verdict:* Defect.
  *   *Why:* Their output is a constant, not a function of the same logic. $P(\text{They C} | \text{I C}) = 0$. No correlation.

  ### 3. Stress-Test Cases

  Here are three cases to watch your principle break on.

  **Case A: The Asymmetric Payoff**
  *   **Setup:** Standard PD, but if we both Cooperate, *you* get $1,000 and *I* get $2,000. If we both Defect, we get $10. If one defects, defector gets $2,100, cooperator $0. We are atom-copies (Case 1).
  *   **Principle Prediction:** **Cooperate.**
  *   **The Break:** Your intuition might scream "Unfair!" But the logic holds: If I cooperate, you cooperate (because we are copies). I get $1,000. If I defect, you defect. I get $10. The inequality of the payoff is irrelevant to the logical correlation. Does your principle survive your sense of fairness?

  **Case B: The Source Code Exchange**
  *   **Setup:** We play PD. Before choosing, I can send you my source code, and you can send me yours. We can modify our code after seeing the other's.
  *   **Principle Prediction:** **Cooperate (via Program Equilibrium).**
  *   **The Break:** You write a bot: `If opponent_source == my_source: Cooperate else: Defect`. They do the same. This is "superrationality" formalized (Hofstadter's actual example). But what if they send code that says `If opponent_cooperates: Defect`? The principle requires you to model *their* modeling of *you*. Does your principle handle infinite regress? (FDT says yes, via fixed points; your gut might stall).

  **Case C: The Brain Lesion (Smoking Lesion variant)**
  *   **Setup:** A gene causes both (A) a tendency to Cooperate in PDs and (B) a tendency to die young. You are in a one-shot PD with a stranger. You don't know if you have the gene, but you know the correlation.
  *   **Principle Prediction:** **Defect.**
  *   **The Break:** This distinguishes FDT from Evidential Decision Theory (EDT). EDT says "Cooperating is evidence I have the gene, which is bad... wait, Cooperating is evidence I have the gene, which means I'm a cooperator..." Actually, EDT gets confused here. FDT says: "My decision does not *cause* the gene. The gene causes the decision. I cannot change the gene by choosing. Defect."
  *   *Correction:* In the standard Smoking Lesion, EDT smokes. FDT doesn't. In this PD variant, if the gene *makes* you cooperate, and you choose to defect, does that prove you don't have the gene? FDT says you should choose the action that leads to the best outcome *given* the logical structure. If the gene determines the action, do you have a choice? This tests whether your principle handles *common causes* vs. *logical identity*.

  ### 4. The Diagnosis

  **You are wearing Functional Decision Theory (FDT).**

  Specifically, you are using the "Logical Counterfactual" framework developed by Yudkowsky and Soares.

  **Where the costume comes off:**
  1.  **Dilution (Case 7):** You revert to Causal Decision Theory when the group gets large. You intuitively feel your causal leverage dropping ($1/N$), but logical correlation does not drop with $N$. If you are truly superrational, you are a dictator of the group's logic.
  2.  **Thresholds (Case 6):** You introduce a risk threshold (55%) that the math doesn't support. FDT is risk-neutral regarding the correlation probability; it only cares about the Expected Value.
  3.  **Input Sensitivity (Case 4 & 5):** You are underestimating how fragile logical correlation is. A single bit of difference in information (the fake printout) or instructions (system prompt) breaks the identity of the function. You are treating "similar" as "same," but the principle requires "logically linked."

  **Summary for your session:**
  Your gut is 80% FDT and 20% Causal Intuition. The tension you feel in Case 3 vs. Case 1 is the tension between "Physical Causality" (I can't reach out and move their hand) and "Logical Causality" (We are running the same math).

  To tighten your principle: **Stop asking "Are we the same person?" and start asking "If I change my output, does the logical implication of my algorithm force their output to change?"** If the answer is yes (Clones), Cooperate. If the answer is no (Strangers, Fixed Opponents), Defect. If the answer is "Maybe" (Twins, AI), calculate the probability of that logical link and maximize accordingly.
