      *   **Context:** The user is preparing for a discussion session on *superrationality* (Hofstadter's concept).
      *   **Goal:** They want to solidify their own intuitions/verdicts on various cases *before* reading external literature to avoid bias. They want to know if there's a coherent principle underlying their gut calls.
      *   **Input:** A list of 9 specific scenarios (Prisoner's Dilemma variants, Newcomb's Problem, Public Goods/Voting, Fixed Opponent) with their intuitive verdicts.
      *   **Tentative Principle:** "Cooperate exactly when my choice and the other player's choice are, or might be, outputs of the same computation."
      *   **Tasks:**
          1.  State the principle precisely (algorithm, inputs, "might be").
          2.  Evaluate which verdicts the principle forces them to drop (and which I would drop).
          3.  Provide 2-3 new test cases to see where the principle breaks.
          4.  Identify the underlying decision theory (EDT, FDT, etc.) and where the "costume comes off."

  2.  **Deconstruct the User's Verdicts & Intuitions:**
      *   *Case 1 (Atom-copy):* Cooperate. (High correlation).
      *   *Case 2 (Twin):* Cooperate. (High correlation).
      *   *Case 3 (Stranger):* Defect. (Low/No correlation).
      *   *Case 4 (Coin-flip info asymmetry):* Lean Cooperate (less confident). (Partial correlation).
      *   *Case 5 (AI copies, diff system prompt):* Unsure. (Algorithm same, inputs differ).
      *   *Case 6 (Newcomb):* 1-box at 100%/80%, 2-box at 55%. (Threshold effect on correlation strength).
      *   *Case 7 (Public Goods):* Don't press (20 or 3 people), Press (10,000 people). (Dilution of correlation/impact?).
      *   *Case 8 (Voting):* Vote. (Expressive/Group identity vs. Causal impact).
      *   *Case 9 (Fixed Defector):* Defect. (No correlation/No contingency).

  3.  **Identify the Underlying Theory:**
      *   The user describes "superrationality," which is historically associated with Hofstadter.
      *   In modern decision theory terms, this maps very closely to **Functional Decision Theory (FDT)** (Yudkowsky/Soares) or **Timeless Decision Theory (TDT)** (Pearl/Soares).
      *   It is distinct from **Causal Decision Theory (CDT)** (which says Defect in PD, 2-box in Newcomb) and **Evidential Decision Theory (EDT)** (which often 1-box/cooperates but struggles with spurious correlations like the "Smoking Lesion").
      *   The user's tentative principle ("outputs of the same computation") is essentially the core slogan of FDT.

  4.  **Drafting the Principle (Task 1):**
      *   *Current:* "Cooperate exactly when my choice and the other player's choice are, or might be, outputs of the same computation."
      *   *Refinement:* Needs to handle *logical* correlation, not just physical identity. It's about the *decision function*.
      *   *Precise Formulation:* "Choose the action that maximizes expected utility assuming that your decision algorithm's output is logically correlated with the output of the other agent's decision algorithm, to the extent that you believe they are running similar functions on similar inputs."
      *   *Key Distinction:* It's not just "same algorithm," it's "same algorithm *given the inputs*." If inputs differ significantly (Case 5, Case 4), correlation drops.
      *   *The "Might be":* This refers to *logical uncertainty*. You aren't sure if the other person is running the exact same logic, but you assign a probability to the logical correlation.

  5.  **Evaluating Verdicts against the Principle (Task 2):**
      *   *Case 1 & 2:* Consistent. High logical correlation.
      *   *Case 3:* Consistent. Low logical correlation (different upbringing, different priors).
      *   *Case 4:* Tricky. If *I* know the setup, and *Copy* might have bad info, our inputs differ. If the copy acts on bad info, they might defect while I cooperate. The correlation is broken by the information asymmetry. *Verdict:* Principle suggests defecting or lowering confidence significantly. User's "lean cooperate" might be too optimistic.
      *   *Case 5:* System prompt = Input. If prompts differ, inputs differ. If the prompt changes the *goal* ("ruthless"), the algorithm effectively changes. *Verdict:* Defect. The "function" includes the prompt.
      *   *Case 6 (Newcomb):* The 55% threshold is the weak point. FDT/EDT usually says 1-box as long as $P(predictor) > Cost/Benefit ratio$. With standard payoffs ($1M vs $1k), 55% is easily enough to 1-box. *Verdict:* User's intuition here (2-box at 55%) contradicts the math of the principle unless the utility of "being right" outweighs money. This is a point to drop.
      *   *Case 7 (Public Goods):* This is the biggest tension. In a 10,000 person PD, logical correlation implies *everyone* reasons the same. If I press, 10,000 press -> everyone gets 0. If I don't, 10,000 don't -> everyone gets $1000. Superrationality says *Don't Press*. User says *Press*. *Verdict:* This is a major conflict. The user's intuition follows CDT (my action doesn't causally change others), but their principle follows FDT (my action implies others'). This needs to be highlighted.
      *   *Case 8 (Voting):* Similar to 7. FDT says vote if you correlate with your demographic. CDT says don't. User votes. Consistent with FDT *if* they view themselves as a representative sample.
      *   *Case 9:* Consistent. If opponent is fixed, there is no logical correlation between *my* algorithm and *their* output (it's a constant).

  6.  **Developing New Test Cases (Task 3):**
      *   *Case A (The Pre-commitment/Source Code Swap):* I can see their source code, they can see mine. I can modify mine before the game. Do I modify myself to cooperate only if they do? (Program Equilibrium).
      *   *Case B (The Asymmetric Payoff):* Same setup, but if we both cooperate, I get $1000, they get $2000. Does superrationality hold? (Fairness vs. Logic).
      *   *Case C (The "Almost" Copy):* Opponent is me, but they are tired/hungry and I am not. Does physiological state count as input?

  7.  **Identifying the Theory & "Costume" (Task 4):**
      *   It is **Functional Decision Theory (FDT)**.
      *   Where the costume comes off: When logical correlation is partial or ambiguous (Case 4, 5, 6). FDT requires a prior over *which* computation the other is running. The user's "vibe" on the 55% Newcomb case reveals they are doing a heuristic approximation of FDT, not the rigorous math.
      *   Also, the "10,000 person" case (Case 7) shows the user is slipping back into CDT when the group gets large (dilution of agency). FDT doesn't dilute; logical correlation is binary or probabilistic, not scaled by $N$ in the same way causal impact is.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the task and validate the "superrationality" framing.
      *   **The Principle:** Formalize it using FDT terminology (logical counterfactuals).
      *   **Verdict Audit:** Go through the 9 cases. Highlight Case 7 (Public Goods) and Case 6 (Newcomb 55%) as the biggest contradictions.
      *   **New Cases:** Propose the "Source Code Exchange," "Asymmetric Payoffs," and "The Brain Lesion" cases.
      *   **The Theory:** Name it (FDT/TDT). Explain the "costume" (logical correlation vs. causal influence).
      *   **Tone:** Intellectual, collaborative, slightly rigorous but accessible (matching the user's style).

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction on Case 7:* In a 10,000 person game, if I reason "I am a sample of the group," and I press, then logically 10,000 press. Payoff: 0. If I don't, 10,000 don't. Payoff: $1000. Superrationality *demands* not pressing. The user's intuition to press at 10,000 is a classic "my vote doesn't matter" CDT slip. I need to point this out gently but firmly.
      *   *Correction on Case 5:* System prompts *are* inputs. If the prompt says "be ruthless," the function $f(input)$ changes. So they are *not* running the same function. Defect is the FDT answer.
      *   *Correction on Case 6:* Why does 55% feel different? Probably because the *risk* of being wrong feels heavier than the gain. But mathematically, $0.55 \times 1M > 1k$. I should point out that this is a risk-aversion bias, not a decision-theory distinction.
      *   *Terminology:* Ensure I distinguish between "causal influence" (CDT) and "logical correlation" (FDT).

  10. **Final Polish:** Check against the user's constraint: "Give me two or three cases I haven't listed and say what the principle predicts." Make sure I explicitly answer "Which of my verdicts does it force me to drop?"

  *(Self-Correction during final review)*: Wait, Case 7 is a Public Goods Game, not a 2-player PD. In a Public Goods Game, the "superrational" argument is that if I contribute, everyone contributes. If the threshold for success is "nobody presses," and I reason superrationally, I assume my reasoning is shared. If I press, everyone presses. Everyone gets 0. If I don't, everyone doesn't. Everyone gets 1000. So superrationality says *Don't Press*. The user says *Press* at 10,000. This is the biggest inconsistency. I must emphasize this.

