          *   Let's adjust down slightly because the lack of digital code is a big deal for long-term evolvability. Let's say 0.68.

  5.  **Refining the Arguments:**

      *   *Templated Inheritance:* This is the biggest philosophical hurdle. Without digital code, complexity caps out.
      *   *Individuality:* Fusion makes "fitness" a property of the collective soup, not the droplet.
      *   *Xenobiotic:* Obligate endosymbionts are alive. This shouldn't count much against it.
      *   *Evolution:* It *does* evolve. That's the core engine.
      *   *Consensus:* Biologists are conservative.

  6.  **Addressing the "What would move the number?"**
      *   If fidelity increases (digital-like behavior emerges from analog), number goes up.
