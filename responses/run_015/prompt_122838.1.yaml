  2.  **Deconstruct the System vs. Definitions of Life:**
      *   *NASA Definition:* "A self-sustaining chemical system capable of Darwinian evolution."
      *   *Metabolism-First:* Focuses on autocatalytic cycles and boundary maintenance.
      *   *Gene-First:* Focuses on templated replication and information fidelity.
      *   *The System:* Hits Metabolism-First hard. Hits Evolution-First weakly (analog inheritance + high fusion = low fidelity/high drift?). Hits Gene-First not at all. Hits Independence weakly (lab-dependent).

  3.  **Determine the Credence (The "Number"):**
