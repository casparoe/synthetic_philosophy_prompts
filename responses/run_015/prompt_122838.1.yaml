      *   Colleague (0.9): Likely prioritizes function (metabolism + selection) over substrate (DNA).
      *   User (0.5): Likely prioritizes the *kind* of inheritance and the *stability* of the lineage.
      *   My verdict: It's less than "alive" but more than "fire." It's a protobiological system. I'll land around 0.65. It leans alive because it evolves, but the lack of digital fidelity and the fusion aspect makes "individuality" murky.

  4.  **Decompose the Factors (Drafting the 5 terms):**

      *   *Factor 1: Templated/Digital Inheritance.*
          *   Standard biology requires high-fidelity copying. This system has analog compositional inheritance.
