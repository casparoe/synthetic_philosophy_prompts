      *   This is the linchpin. It suggests that democracy works because people *need* each other to survive/thrive. If elites can insulate themselves (bunkers, private security, offshore accounts, personalized medicine), they no longer need the commons, leading to oligarchy. If the masses feel left behind without shared fate, they turn to populists.
      *   *Strength:* Explains modern inequality and political polarization well.
      *   *Weakness:* Hard to measure historically. Is it the *cause* or a *symptom* of other forces (technology, culture)?

  3.  **Brainstorming Defeaters (Potential Counter-arguments):**
