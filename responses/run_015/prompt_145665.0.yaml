      *   **Mechanism:** Shared risk makes collective deliberation rational $\rightarrow$ Erosion of risk $\rightarrow$ Oligarchic consolidation $\rightarrow$ Populist rupture $\rightarrow$ Dissolution.
      *   **Goal:** Identify genuine defeaters (empirical, conceptual, formal), rank them, assess falsifiability risks, and state what would change *my* (the AI's) mind (simulated as a critical interlocutor).

