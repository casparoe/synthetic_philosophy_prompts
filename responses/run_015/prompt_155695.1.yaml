answer: |-
  ### The Case: The Dominance of the Light Water Reactor (LWR) in Civilian Nuclear Power (1950s–1970s)

  A paradigmatic example where the distinction between genuine historical lock-in and retrospective counterfactual smoothing collapses is the global adoption of the **Light Water Reactor (LWR)** as the standard for civilian nuclear power generation.

  In the post-WWII period, several reactor designs competed: Light Water (pressurized and boiling), Heavy Water, Gas-Cooled, Liquid Metal Fast Breeder, and Molten Salt. By the 1970s, the LWR had achieved near-total dominance in the Western commercial sector.

  #### 1. The Competing Narratives from Identical Initial Conditions

  **Narrative A: Genuine Historical Lock-In (The "Rickover" Contingency)**
  *   **Mechanism:** Increasing returns to adoption, institutional inertia, and specific micro-historical agency.
  *   **Story:** The LWR was not technically superior for civilian use; it was compact and robust, making it ideal for **US Navy submarines**. Admiral Hyman Rickover championed the LWR for the naval fleet. Because the Navy funded the initial R&D and training infrastructure, the civilian Atomic Energy Commission (AEC) inherited a supply chain, regulatory framework, and engineering workforce optimized exclusively for LWRs.
  *   **Claim:** This was a contingent "small event" (Naval strategic preference) that triggered a lock-in. Had the Navy chosen Gas-Cooled reactors for subs, the civilian infrastructure would have locked into that path. The counterfactual history diverges at the micro-level (Naval procurement) and results in a divergent macro-state (a Gas-Cooled grid).
  *   **Non-Ergodic Character:** The system entered a specific basin of attraction due to a stochastic shock (Rickover's influence), foreclosing access to other potentially superior basins (e.g., safer Molten Salt designs).

  **Narrative B: Retrospective Counterfactual Smoothing (The "Technological Imperative")**
  *   **Mechanism:** Convergence toward a structurally inevitable attractor based on thermodynamic and economic constraints.
  *   **Story:** The LWR dominance was not contingent on the Navy. Among all available 1950s technologies, the LWR was the only design with the specific combination of power density, material maturity, and thermal efficiency required for *any* viable large-scale electrification. The Navy didn't *cause* the selection; they merely recognized the attractor first. Other designs (Gas, Breeder) had unsolved physics problems that would have stalled them regardless of funding.
  *   **Claim:** This is retrospective smoothing. Observers look at the "failed" alternatives and see technical flaws, but those flaws are only visible because the LWR infrastructure made them look bad by comparison. In a counterfactual history where Gas-Cooled reactors were pushed, the supply chain would have adapted, and the "flaws" would have been engineered away.
  *   **Convergence Character:** The system is effectively ergodic over the relevant timeframe; all rational paths converge on the LWR macro-state regardless of micro-historical noise.

  #### 2. The Collapse: Macro-State Descriptors vs. Micro-Histories

  The disagreement hinges entirely on how we define the **macro-state descriptor**.

  *   **If the Macro-State is "Nuclear Electrification":** Both narratives agree. The system converged on nuclear power. The micro-history (Navy vs. Market) is irrelevant to the macro-outcome. Here, path dependence is weak; the attractor is "High-Density Baseload Power."
  *   **If the Macro-State is "LWR-Specific Infrastructure":** The narratives diverge.
      *   *Lock-in View:* The macro-state includes specific isotopic enrichment chains, zirconium cladding supply, and pressurized vessel manufacturing. These are contingent on the Navy's choice.
      *   *Smoothing View:* These specificities are merely the local coordinates of the inevitable attractor. Any successful nuclear path would have necessitated similar enrichment and cladding eventually.

  **The Collapse Point:**
  The distinction collapses because **efficiency is endogenous to the path.**
  In Narrative A (Lock-in), LWR is "sub-optimal" because we compare it to theoretical alternatives (Breeder/Molten Salt) that were never fully developed *because* of the lock-in.
  In Narrative B (Smoothing), LWR is "optimal" because the alternatives failed *because* they were inherently inferior.

  We cannot empirically distinguish these because the **counterfactual micro-histories are unobservable.** To prove lock-in, we must show that a Gas-Cooled world would have resulted in a *distinct* macro-state (e.g., lower cost, higher safety) that was accessible but foreclosed. To prove smoothing, we must show that the Gas-Cooled world would have collapsed back into LWR specifications eventually. Since we only observe the LWR trajectory, the "distance" between the realized history and the counterfactual history is a theoretical parameter, not an empirical one.

  #### 3. Interaction with Non-Ergodic Dynamics

  This brings us to the core theoretical question: **Does treating the system as non-ergodic dissolve the problem, or merely relocate the underdetermination?**

  **The Non-Ergodic Assertion:**
  Path dependence theory explicitly assumes non-ergodicity: time averages do not equal ensemble averages. History restricts the future phase space. If the nuclear sector is non-ergodic, the LWR outcome is just *one* realization of many possible histories.

  **Relocating the Underdetermination:**
  Treating the system as non-ergodic **does not dissolve the problem; it relocates the underdetermination to the definition of the Basin of Attraction.**

  1.  **The Epistemic Barrier:** In a non-ergodic system, we cannot infer the structure of the phase space (the landscape of all possible reactor types) from a single trajectory (the LWR history). We see the ball rolling into the LWR valley.
      *   *Lock-in Interpretation:* The valley is narrow and shallow; the ball could have easily rolled into a neighboring, deeper valley (Molten Salt) if nudged differently at $t_0$.
      *   *Smoothing Interpretation:* The valley is the only deep basin in the entire landscape; all nudges at $t_0$ eventually lead here.

  2.  **The Relocation:** By asserting non-ergodicity, we admit we cannot use long-run convergence to judge efficiency. However, we replace the empirical question ("Did the market select the best tech?") with a topological question ("What is the shape of the unobserved phase space?").
      *   We still cannot measure the "depth" of the unvisited basins (the counterfactual technologies).
      *   We still cannot measure the "barrier height" between basins (the switching costs).

  3.  **The Result:** The claim of "Lock-in" becomes a **modal claim** (about possibility) rather than an **empirical claim** (about observation).
      *   To assert lock-in is to assert: $\exists$ a counterfactual history $H'$ such that $Macro(H') \neq Macro(H_{actual})$ and $Utility(H') > Utility(H_{actual})$.
      *   To assert smoothing is to assert: $\forall$ histories $H$, $Macro(H) \approx Macro(H_{actual})$.

  Since we cannot observe $H'$, the disagreement rests on priors regarding the **ruggedness of the technological fitness landscape**.
  *   If you believe the landscape is smooth (few local optima), you see Smoothing/Convergence.
  *   If you believe the landscape is rugged (many local optima), you see Lock-in.

  **Conclusion:**
  Treating the system as non-ergodic acknowledges that the distinction *cannot* be resolved empirically. It dissolves the *expectation* of a solution but does not dissolve the *ambiguity* of the analysis. It relocates the underdetermination from "What happened?" (empirical) to "What was possible?" (theoretical/topological).

  In the LWR case, the "Lock-in" thesis survives only if one assumes a rugged landscape where superior designs existed but were inaccessible due to the Navy's initial nudge. The "Smoothing" thesis survives if one assumes a smooth landscape where the Navy's nudge merely accelerated a slide toward the global optimum. Because the landscape itself is constructed by the investments made *along* the path (R&D creates the technology), the landscape and the trajectory are co-constitutive. Thus, the distinction between "contingent lock-in" and "structural inevitability" is not a feature of the history itself, but a feature of the observer's model of the unobserved counterfactual phase space.
