          *   *Challenge:* Weber's *Wertfreiheit* (value-freedom) vs. modern development goals.
          *   *Relevance:* Important for application, but secondary to establishing *that* culture causes things.

      *   **Line 3: Overdetermination (The Logical/Attribution Problem).**
          *   *Issue:* How to weigh ideas vs. materials.
