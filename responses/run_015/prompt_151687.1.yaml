          3.  *Overdetermination:* How to assign explanatory weight when material and ideal factors are jointly necessary but insufficient (INUS conditions/interaction)?
      *   **The Task:** Prioritize these three lines for a research agenda. Defend a specific ordering based on criteria (importance, tractability, downstream dependence). Identify what is "upstream." Identify which is most tractable without resolving deep Weber scholarship disputes. Identify which, if settled, would most impact contemporary development economics. Finally, specify conditions for reordering.

  2.  **Deconstruct the Three Lines:**

