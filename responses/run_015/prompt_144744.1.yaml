  **ADVERSARIAL COLLABORATION PROTOCOL: SCIENTIFIC REALISM VS. PESSIMISTIC INDUCTION**

  **Participants:** Dana (Structural/Selective Realist), Ivo (Pessimistic Meta-Induction)
  **Facilitator:** [Reading Group Lead]
  **Date:** October 2023
  **Status:** Active Dispute

  ### I. AGREED CLAIMS AND OPERATIONAL DEFINITIONS

  The undersigned agree to the following premises as the baseline for this collaboration. These claims are formulated to remain neutral regarding the ultimate truth-value of current scientific posits.

  1.  **The Success Premise:** Modern scientific theories yield novel, precise, and interventional predictions at a rate significantly exceeding chance. Both sides agree this success requires an explanation, though they disagree on the nature of that explanation.
  2.  **The Historical Premise:** The history of science contains theories that were empirically successful in their time but are no longer accepted as literally true. Both sides agree that ontological posits (entities, mechanisms) from these theories are frequently discarded or radically revised.
  3.  **The Structural Observation:** In cases of theory change, mathematical formalisms, symmetries, and quantitative relations are retained more frequently than specific ontological descriptions. Both sides agree this retention occurs; they disagree on whether retention implies truth-tracking or merely utility preservation.
  4.  **The Induction Condition:** A pessimistic meta-induction is only valid if the reference class of "past successful posits" is comparable to the reference class of "current successful posits." Both sides agree that if current posits differ systematically from past posits in a way that correlates with survival, the raw historical discard rate is a biased estimator of current failure risk.
  5.  **The Hazard Definition:** For the purpose of this collaboration, the "elimination hazard" of a posit is defined as the conditional probability that the posit will be deemed non-referential or false within time period *t*, given that it has survived until *t*.
  6.  **The Sensitivity Principle:** A posit contributes to a theory's success only if the theory's predictive accuracy depends on the posit's validity. If a prediction would have succeeded even had the posit been false (or absent), the posit is "insensitive" to the success. Both sides agree that insensitive posits cannot support a No-Miracles argument.
  7.  **The Scoring Horizon:** Claims regarding the survival of current posits will be scored on a 30-year horizon. A posit is "surviving" if it remains part of the standard model in its field without ontological demotion. A posit is "eliminated" if it is treated as a useful fiction, reduced to a limiting case with different ontology, or discarded.

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  | Disagreement | The Crux (What settles it) | Agreed Test / Evidence | Dana's Prediction (Structural Realist) | Ivo's Prediction (PMI) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Hazard Rate Function**<br>Is the risk of elimination constant, or does it decrease with the age/interventional use of a posit? | **Survivorship Bias vs. Maturation:** Does a posit surviving 100 years indicate it is "locked in" (Dana), or merely that we haven't found the boundary condition yet (Ivo)? | **Historical Survival Analysis:** Plot the "death rate" of posits from the 19th century vs. the 17th century, controlling for intensity of use. Compare the hazard rate of "mature" posits (e.g., conservation laws) vs. "young" posits (e.g., dark matter particles). | **Decreasing Hazard:** A posit surviving >50 years of heavy interventional use has a <5% chance of elimination in the next 30 years. The curve drops sharply after the first two decades. | **Constant/Compounding Hazard:** Elimination risk remains roughly constant or increases as measurement precision improves. A 1% annual hazard compounds to >25% failure over 30 years, regardless of age. |
  | **2. The Grading Problem**<br>What counts as "elimination"? Does reduction (e.g., Newton to Einstein) count as survival or death? | **Ontological Continuity:** Is a posit "retained" if its mathematical role is preserved but its metaphysical status changes (e.g., from "force" to "curvature")? | **Case Study: Newtonian Gravity:** Determine if Newton's "gravitational force" is currently taught as *true* (approximate) or *false* (useful fiction). Survey working physicists on whether the posit "exists." | **Survival (Reduction):** Newtonian gravity is retained as a limiting case. The structural relation is preserved; therefore, the posit survives. | **Elimination (Replacement):** The ontology of "force at a distance" is false. The math works, but the posit was a fiction. This counts as a PMI point. |
  | **3. Counterfactual Sensitivity**<br>Was the success of past theories sensitive to the truth of their posits, or would the math have worked anyway? | **Necessity of Ontology:** Could the predictive success have been achieved via a different ontological model yielding the same equations? | **Re-derivation Challenge:** Take a historical theory (e.g., Fresnel's ether). Attempt to derive its successful predictions using only the structural equations, explicitly denying the ontology. | **Sensitive:** The predictions relied on the structural constraints which mirrored reality. You cannot get the right equations without the right structural relations. | **Insensitive:** The equations are bookkeeping tools. The ether was false, yet the predictions held. Therefore, success does not track ontological truth. |
  | **4. Forward-Looking Bet**<br>Which current posits will be eliminated by 2053? | **Risk Assessment:** Identification of specific posits currently treated as real that are likely to be demoted. | **The 2053 Wager:** Each side lists 5 current posits (e.g., Quarks, Dark Energy, Synaptic Plasticity mechanisms). Score 1 point for each correct prediction of survival/elimination. | **High Stability:** Bets on posits with deep interventional integration (e.g., Quarks, DNA mechanism). Predicts >4/5 survive. | **High Turnover:** Bets on posits that are currently ad-hoc or lack direct intervention (e.g., Dark Energy, Specific Neural Correlates). Predicts >2/5 eliminated/reduced. |

  ### III. VERBAL AND METHODOLOGICAL CAVEATS

  The undersigned acknowledge the following areas where the dispute may be partially verbal or methodological, and agree to taboo these terms where they obscure the empirical claims above.

  1.  **"Truth" vs. "Empirical Adequacy":**
      *   *Dispute:* Dana uses "true" to mean "structurally isomorphic to reality." Ivo uses "true" to mean "ontologically identical to reality."
      *   *Resolution:* In this document, "true" is operationalized as "retained in the standard model without ontological demotion." We bracket the metaphysical status of the retention.

  2.  **"Posit" Individuation:**
      *   *Dispute:* Ivo individuates posits finely (e.g., "caloric fluid" is one posit). Dana individuates coarsely (e.g., "heat flow equations" is the posit).
      *   *Resolution:* For the Hazard Rate test, we will pre-register a list of posits and their individuation criteria before analyzing the historical data to prevent moving the goalposts.

  3.  **"Reference Class" Selection:**
      *   *Dispute:* Ivo argues the reference class is "all successful theories." Dana argues the reference class is "successful theories with mature interventional integration."
      *   *Resolution:* The Historical Survival Analysis (Disagreement #1) will run both reference classes. If the hazard rate drops significantly in the "mature" class, Dana wins the crux. If the hazard rate remains high even in the "mature" class, Ivo wins the crux.

  4.  **Data Censoring:**
      *   *Dispute:* Ivo claims we only know about dead posits because later science recorded their deaths; live posits might be dying silently.
      *   *Resolution:* We agree that this is unfalsifiable in the present. The Forward-Looking Bet (Disagreement #4) is designed to bypass this by generating fresh data on "live" posits.

  ### IV. SIGNATURES

  We agree that this document accurately reflects the state of our disagreement and the tests we have agreed to undertake.

  **Dana:** ____________________ Date: __________

  **Ivo:** ____________________ Date: __________

  **Witness:** ____________________ Date: __________
