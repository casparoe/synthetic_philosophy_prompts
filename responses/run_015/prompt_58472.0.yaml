  The lecture hall lights were dimmed, leaving only the work lamps over the front desk illuminating the dust motes dancing in the projector's afterglow. Dr. Priya Nair stacked her notes while Dr. James Hartley erased the whiteboard, the squeak of the marker punctuating the silence.

  "It fits the supernova data perfectly, James," Priya said, capping her pen. "But if the model implies that every belief I hold is likely a thermal hallucination, it cannot be true. It's cognitively unstable."

  James turned, leaning against the podium. "It implies that in the unbounded future, fluctuation observers outnumber evolved ones. It doesn't logically entail that *you* are a fluctuation. You're reasoning from the class size to the individual case. That's the typicality assumption, and it's not a law of logic."

  "It's a prerequisite for empirical science," Priya countered, sliding her bag onto her shoulder. "If I accept the theory, I must accept that almost any observer with my current mental state is a Boltzmann Brain. If I assume I'm typical, my memories are false. If my memories are false, I have no reason to trust the telescopic data that supported the theory in the first place. You can't use evidence to support a theory that undermines the reliability of that evidence."

  "But why assume you are typical?" James asked, walking toward her. "You possess specific, high-fidelity data. A random fluctuation might produce a generic sense of 'being Priya,' but would it produce the specific, coherent sensory stream you are experiencing right now? You should reason conditionally on the full detail of your experience, not merely on the bare fact of being an observer."

  Priya paused, considering this. "So you're saying I should condition on the fact that my experience includes a sense of continuity? That doesn't save you. A fluctuation could include the illusion of continuity. I have twenty years of laboratory notebooks, James. Daily calibrations, cross-referenced errors, physical ink on paper aging consistently. The probability of a fluctuation assembling that specific macroscopic history is vanishingly small compared to a single momentary brain."

  "Vanishingly small, yes," James conceded. "But in an infinite future, even vanishingly small probabilities yield infinite occurrences. The model stipulates that over eternity, the number of fluctuations matching your notebook records will still vastly exceed the single finite history of the actual Priya Nair. Numerical dominance remains."

  "Then the model demands I reject my notebooks as evidence," Priya said sharply. "If the theory says it is overwhelmingly probable that these notebooks popped into existence five minutes ago with false aging signatures, then I cannot use them to verify anything. If I can't trust the notebooks, I can't trust the telescope logs. If I can't trust the logs, I can't trust the data that favors your toy cosmology. You're sawing off the branch you're sitting on."

  James rubbed his chin. "I agree that if the theory renders *all* evidence suspect, it's self-defeating. But does it? The telescopic data brought us to this model. That data is real, recorded by evolved observers in the early universe. The Boltzmann Brains come later. Why should the existence of future hallucinations invalidate the past records that led us here?"

  "Because the theory treats all observers with our current mental state as statistically equivalent," Priya insisted. "If the model is true, the majority of entities currently having an experience indistinguishable from mine are fluctuations. Therefore, given only the model and my experience, the probability that I am a fluctuation is near one. To believe the model is to believe my experience is misleading. That's incoherent."

  "Unless," James said, raising a finger, "you distinguish between the evidence that selected the theory and the implications of the theory for future observers. The telescopic data favored the model because the model explained the expansion history. The Boltzmann Brain problem is a consequence of the model's future boundary conditions. You're asking me to discard a theory that perfectly explains the past because of what it predicts for the future population statistics."

  "I'm asking you to discard a theory that makes the past explanation inaccessible," Priya corrected. "If I am likely a fluctuation, then the 'past' I infer from the telescopes is likely false. The notebooks are the test case. If I accept your model, I must regard my twenty years of consistent records as less likely than a random fluctuation mimicking them. That violates the principle of inference to the best explanation. The best explanation for twenty years of consistent logs is twenty years of actual work."

  "And yet," James said softly, "the mathematics of the model is robust. It fits the dark energy equation of state better than any alternative. Are we to reject a mathematical fit because it conflicts with a philosophical principle of typicality? Perhaps the principle is wrong. Perhaps we are not typical. Perhaps we are the rare evolved observers, and the infinite sea of fluctuations is irrelevant to our indexical position."

  "That's special pleading," Priya said, though her tone softened. "You're claiming we are special without a physical mechanism to distinguish us from the fluctuations."

  "I'm claiming that conditionalizing on specific evidence breaks the symmetry," James replied. "The fluctuations might outnumber us, but they don't outnumber us *given the specific constraint of having verified, inter-subjective records like these notebooks*. Or at least, the ratio changes when you factor in the complexity of the evidence."

  "It doesn't change enough to overcome the infinity," Priya said. "But I see your point. You're trying to save the telescopic evidence by isolating it from the future statistics."

  "Exactly. The evidence stands. The interpretation of our place within the total population is where we differ."

  Priya picked up her bag. "So we agree the model fits the data, but disagree on whether the model's population statistics invalidate the data's reliability."

  "Precisely," James said, turning off the work lamp. "You see cognitive instability; I see a counter-intuitive but mathematically consistent population distribution."

  "Then we're at an impasse," Priya said, walking toward the door. "But at least now I know you aren't just ignoring the notebooks."

  "And I know you aren't just ignoring the math," James called after her. The door clicked shut, leaving the equations on the board glowing faintly in the dark.
