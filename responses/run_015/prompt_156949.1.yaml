prompt: |-
  I'm taking a course on post-war politcal philosphy and we got stuck on Karl Jaspers' claim that a nation can carry different flavors of guilt. Half my study group thinks it's obviously silly to blame people born in 2000 for stuff that happened in 1940, the other half insists there's a real conceptual puzzle about collective responsibility that survives even when every original member is dead. I want to understand the knot itself, not just get a history recap.

  Here's what's confusing me. Jaspers apparently splits guilt into kinds that need individual action—criminal and moral—from kinds that stick to the political community as a structure, like political and metaphysical guilt. But if you think of a nation as a kind of Ship-of-Theseus—every citizen replaced, some institutions renamed, borders maybe even shifted—what actually makes it the same collective agent across decades? And if it's not genuinely the same 'we', can it still bear metaphysical guilt, or does that just collapse into historical regret? I'm trying to see where the idea of joint intentionality holds up or breaks when the collective is spread over generations that never met each other. Don't list categories like a textbook; I want to see the tension between institutional continuity and moral-personality continuity.

  Please respond as exactly five numbered items, each just one or two sentences, with no intro or conclusion. I'm hoping to figure out whether there's a coherent way to hold the nation responsible without using dead citizens as moral proxies for the living ones.
