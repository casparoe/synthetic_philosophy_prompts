      *   *Key Distinction:* Differentiate *Archival Absence* (the box is gone) from *Archival Silence* (the box exists but omits the subaltern). (2) applies to Absence. (1) and (5) apply to Silence. This is the crucial theoretical move.

  9.  **Final Polish:** Check against constraints. "Don't just list issues." "Rank tensions." "Say which ones genuinely conflict." Ensure the advice is actionable for a seminar context. (The user is likely a grad student or early career scholar prepping for a comprehensive or a paper).

