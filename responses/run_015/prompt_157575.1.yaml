answer: |-
  You have identified the central tension in global ethics: the conflict between **Universalism** (rules apply to everyone equally) and **Particularism** (obligations depend on relationships).

  Your intuition is actually more consistent than you think. You are not just sneaking in Western norms; you are intuitively applying a principle of **Role Fidelity**.

  ### 1. The Unifying Principle: Role Fidelity
  The principle that saves all five of your verdicts is this: **Corruption is the betrayal of the specific fiduciary duty attached to the role being performed.**

  It is not about "favoritism" in the abstract; it is about whether the favoritism violates the *social contract of that specific office*.

  *   **Brazil Mayor:** The role is "Public Servant of the City." The contract is impartiality to all citizens. Hiring the cousin violates the contract. **(Corrupt)**
  *   **US Senator:** The role is "Representative of the Public." The contract is policy for the common good. Steering policy for a future private benefit violates the contract. **(Corrupt)**
  *   **Lagos Clerk:** The role is "Gatekeeper of State Services." The contract is equal access under the law. Selling access violates the contract. **(Corrupt)**
  *   **Pacific Island Leader:** The role is "Clan Elder." The contract is *not* impartiality; it is the survival and prioritization of the kin group. Distributing aid to the clan *fulfills* the contract. **(Not Corrupt)**
  *   **Japan Bureaucrat:** The role exists within a culture of *giri* (obligation). If the gifts are documented, expected, and do not alter the specific decision (the bid was already approved), they are relationship maintenance, not a breach of the official's duty to the state. **(Not Corrupt)**

  **Is this Western?**
  No. A strict Western liberal definition (Weberian bureaucracy) would call the Pacific Island case corruption because it violates the ideal of the impartial state. By accepting the Pacific verdict, you are acknowledging that in some contexts, the **Clan is the State.** The "public" they serve *is* the kin group. You are judging them by their own normative framework, not importing a foreign one.

  ### 2. Which Verdict to Drop for Simplicity?
  If you want a single, simple rule that works across borders without needing deep anthropological analysis of each society, you must **drop the Pacific Island verdict.**

  To simplify, you must adopt **Universalism**: *"Public resources must always be distributed based on impartial criteria, regardless of local custom."*

  *   **Why drop it?** It is the outlier. In four of your five cases, you condemn using public office for private/kin gain. In the Pacific case, you excuse it.
  *   **The Cost:** By dropping this verdict, you gain legal clarity (the UN Convention Against Corruption supports you), but you lose moral nuance. You would be labeling a survival mechanism in a weak-state context as "theft," which might be legally accurate but sociologically blind.

  ### 3. The Test Case: The NGO Facilitation Fee
  Now, apply the **Role Fidelity** principle (which keeps your original five verdicts) to the NGO case: *A Western NGO pays fees to local customs officials so medical supplies don't sit in a warehouse.*

  **The Verdict: It is Systemic Corruption, but Individually Justified.**

  Here is the breakdown:
  1.  **The Official's Role:** Their fiduciary duty is to the State Law. Taking an unofficial fee violates that duty. By the principle of Role Fidelity, **this is corruption.** The fact that "locals say it's the price of business" is the same argument as the Lagos clerk ("everyone pays dash"). It describes the *prevalence* of corruption, not its *legitimacy*.
  2.  **The NGO's Role:** Their fiduciary duty is to their beneficiaries (the sick). If paying the fee saves lives, refusing to pay it to maintain "clean hands" might be a betrayal of *their* role.
  3.  **The Distinction from the Pacific Case:** In the Pacific case, the *system itself* legitimized the kin preference (the social contract accepted it). In the Customs case, the fee is likely illegal (even if tolerated). It is a "shadow tax," not a legitimate norm.

  **Conclusion:**
  If you keep your nuanced **Role Fidelity** principle, you must conclude that the Customs Official is engaging in corruption (betraying the law), even if the NGO is morally compelled to facilitate it to prevent harm.

  If you choose **Simplicity** (dropping the Pacific verdict), then the Customs case is straightforward: **It is corruption, period.** The NGO is participating in a corrupt act, potentially justified by necessity (the "lesser evil" defense), but it remains corruption.

  **Recommendation:**
  Keep the nuance. The Pacific Island case teaches you that corruption isn't just "breaking the law"; it's "breaking the trust." In the Customs case, the official breaks the trust of the Law, even if they keep the trust of their peers. Acknowledge it as corruption, but recognize that the NGO is operating in a broken system where "clean" hands might lead to dead patients. That is not a contradiction; it is the tragedy of development work.
