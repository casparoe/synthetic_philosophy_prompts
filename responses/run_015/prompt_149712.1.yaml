answer: |-
  In the worker-owned Common Crumb bakery of Oakhaven, the Covenant of Clear Standing abolished guilt-language centuries ago, forbidding phrases like "I wronged you" in favor of public status-loss rituals. When baker Eli scoops mislabeled almond flour instead of coconut, causing Mrs. Gable's throat to tighten visibly during the morning rush, the crowd doesn't wait for an apology; they watch the Clerk mark Eli's name on the public Diminishment Board outside the town hall. This isn't about fixing the recipe, but lowering Eli's social credit, signaling he is now a 'risky agent.' Eli, feeling the heat of exposed identity rather than responsibility for the act, stops baking bread to avoid further scrutiny, leaving the town without loaves and Mrs. Gable without a genuine assurance of safety, because the ritual punished the baker's status instead of correcting the bin labeling.

  **The Check**

  **Guilt-Path vs. Shame-Path:** On the guilt-path, Eli thinks "I made a mistake," leading to immediate recipe correction and direct restitution to Mrs. Gable. On the shame-path, Eli thinks "I am a danger," leading to withdrawal and the loss of a productive community member. Guilt fits this correctable harm because the error was procedural, not characterological; the harm was mild and reversible, demanding engagement rather than exile. The feature doing the work is the **repairability-visibility combo**: everyone saw the harm, so everyone needs to see the fix, but shame hides the fixer. A defender of the shame-culture argues that guilt is too private and allows repeat offenders to slip back in; public status-loss ensures high stakes for safety and prevents complacency across all bakeries. Ultimately, a culture cannot genuinely choose to suppress guilt like this. The emotional architecture is too deep; when you outlaw the language of responsibility, guilt doesn't vanish, it metastasizes into toxic shame that breaks the very social bonds it was meant to protect.
