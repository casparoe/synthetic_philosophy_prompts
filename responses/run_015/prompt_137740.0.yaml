  My friend (actual evolutionary biologist, works on social insects) and I got into a four-hour argument last night about the units of selection thing and I'm still not sure who won. Her line: genes vs. individuals vs. groups is a settled pseudo-debate — pick whichever level is convenient, run the accounting, the formal equivalence results mean there's no remaining causal fact of the matter to fight about. I kept saying that's too fast but couldn't say exactly where it goes wrong.

  Why I actually care: my own work is on cultural evolution, norms spreading through populations, and I suspect the equivalence results only look so clean because of the setups they're proved in. Discrete generations, groups that nest inside each other with no overlap, fitness effects that add up, and a well-defined level that reproduces. In my case basically none of that holds. People belong to several partially overlapping groups at once, there's no synchronized generation, transmission is oblique as well as vertical, the "replicators" (if that's even the right word for a norm) are too fuzzy to count the offspring of, and it's not obvious that a band or a village has group-level reproduction in the sense you'd need to partition fitness at that level at all.

  Concrete ask: I've got about two years, one grad student who's good with individual-based simulations and can read a bit of population genetics, and no wet lab. I want an agenda, not a survey, and defo not a reading list or citations — I can't look anything up right now and I want your own take. Give me roughly five questions worth working on, ordered, and defend the ordering: which ones are upstream of the rest, which are genuinely tractable for someone with simulations and light theory rather than a lab, which are already crowded, and what result in the next two years would move something up or down the list. Put "is there a causal fact of the matter about which level selection acts on" in the ranking if you think it survives proper statement, and if you think it dissolves, say what the surviving version is. Also flag any traditional questions I should just drop as pseudo-questions, because my friend thinks most of them are and I want to know if she's right.

  And this matters as much as the ordering: I want the settled and the contested kept seperate. She says things like "everyone agrees the Price equation is just bookkeeping, it's an identity" and I genuinely can't tell whether that's consensus among people who work on this or her side of the fight talking. Don't hand me a contested position dressed up as the received view.

  End with a single machine-readable line giving your top pick, like \answer{top priority: <short label for the question>}.
