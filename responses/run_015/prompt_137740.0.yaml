answer: |-
  ### Settled vs. Contested: The Landscape

  Before the agenda, you need to know where the ground is solid and where it is shifting. Your friend is half-right, but she is conflating mathematical identity with causal explanation.

  **Settled (Consensus):**
  1.  **The Price Equation is an Identity:** It is a mathematical tautology. It describes change; it does not explain cause. Everyone who works on theory agrees on this.
  2.  **Formal Equivalence in Simple Models:** In standard population genetics models (discrete generations, nested groups, additive fitness), you can mathematically partition selection variance at the gene, individual, or group level and get equivalent predictions for allele frequency change.
  3.  **"True Level" is Pseudo:** Asking "which level is the *real* level of selection?" without specifying a causal model or intervention is a category error.

  **Contested (Active Debate):**
  1.  **Causal Interpretation of Partitions:** Just because you *can* partition variance at the group level doesn't mean the group is a *cause*. Some argue partitions only map to causes if the levels are mechanistically distinct (e.g., emergent properties vs. aggregate individual traits).
  2.  **Assumption Dependence:** The equivalence results rely on specific structural assumptions. There is no consensus on how robust these equivalences are when you break assumptions (overlapping groups, non-additive fitness, continuous time).
  3.  **Cultural Units:** Whether norms qualify as "replicators" sufficient for selection models is heavily contested. Some argue for "frequency-dependent bias" models instead of selection models.

  **Pseudo-Questions (Drop These):**
  *   "Is it *really* group selection or individual selection?" (Unless defined by specific mechanisms).
  *   "Does the Price Equation explain causation?" (It doesn't; it accounts for variance).
  *   "Are groups 'organisms'?" (Irrelevant unless you define what functional properties matter).

  ---

  ### The 2-Year Agenda: 5 Questions

  Here is the ordered agenda. The ordering is based on **logical dependency** (upstream questions must be answered to interpret downstream ones) and **tractability** (what your grad student can actually simulate without a lab).

  #### 1. Robustness of Formal Equivalence under Cultural Transmission Rules
  *   **The Question:** Do the mathematical equivalences between individual-level and group-level selection partitions hold when transmission is oblique, generations overlap, and fitness is non-additive?
  *   **Why First:** This is the upstream test of your friend's claim. If the math breaks down under cultural assumptions, the "pseudo-debate" claim collapses empirically. If the math holds but becomes uninformative, you move to Question 3.
  *   **Tractability:** High. This is pure individual-based simulation (IBM). Your student can build a network model where agents adopt norms via peer pressure (group) vs. payoff maximization (individual) and run Price equation partitions on the output.
  *   **Settled/Contested:** Contested. The math is settled for biology; it is unknown for cultural network structures.

  #### 2. Operationalizing Group Fitness without Reproduction
  *   **The Question:** Can differential group persistence (splitting, merging, dissolving) substitute for biological reproduction in fitness partitioning without violating variance assumptions?
  *   **Why Second:** Your specific worry is that villages don't "reproduce" like colonies. You need to know if "persistence" generates a variance component mathematically equivalent to "reproduction." If not, group-level selection models are category errors in your domain.
  *   **Tractability:** Medium. Requires defining rules for group birth/death in the sim. Theoretically light, but requires careful bookkeeping in the code.
  *   **Settled/Contested:** Contested. Biologists assume reproduction; cultural evolutionists often assume persistence. The equivalence is unproven.

  #### 3. Causal Identifiability of Selection Levels
  *   **The Question:** (The surviving version of "Is there a causal fact?") Can level-specific selection coefficients be independently manipulated via intervention in the model?
  *   **Why Third:** This addresses the core philosophical dispute. If you can change the "group pressure" parameter without changing the "individual payoff" parameter and see distinct outcomes, there is a causal fact. If interventions at one level always confound the other, the levels are causally indistinguishable.
  *   **Tractability:** Medium-Hard. Requires designing "intervention experiments" within the simulation (counterfactuals).
  *   **Settled/Contested:** Contested. This is the mechanistic vs. statistical debate operationalized.
  *   **Note:** This is where the question "is there a causal fact of the matter" survives. It survives as **identifiability**, not metaphysical truth.

  #### 4. Signal Dilution via Overlapping Membership
  *   **The Question:** How does multi-membership (belonging to multiple overlapping groups) affect the signal-to-noise ratio of group-level variance components?
  *   **Why Fourth:** Once you know equivalence holds (Q1) and units are defined (Q2), you need to know if overlapping groups make group-level effects undetectable in practice. This determines if the "group level" is empirically accessible.
  *   **Tractability:** High. Parameter sweep on network connectivity/overlap in the existing IBM.
  *   **Settled/Contested:** Contested. Most theory assumes nested groups; overlapping structures are the norm in culture.

  #### 5. Predictive Parsimony of Multi-Level Models
  *   **The Question:** Does explicitly modeling group-level selection improve out-of-sample prediction of norm stability compared to individual-level learning models, given the cost of added complexity?
  *   **Why Fifth:** This is the pragmatic payoff. If Q1-Q4 suggest group models are valid but Q5 shows they don't predict better than simple individual models, the debate is practically moot.
  *   **Tractability:** Medium. Requires holding out data or generating complex test sets.
  *   **Settled/Contested:** Contested. Many cultural evolution models assume individual learning is sufficient; others insist on group structure.

  ---

  ### Defense of Ordering

  1.  **Upstream Logic:** You cannot test causality (Q3) if the math doesn't partition (Q1). You cannot measure group causality (Q3) if groups don't have fitness (Q2). You cannot claim utility (Q5) if the signal is drowned by overlap (Q4).
  2.  **Tractability:** Q1 and Q4 are pure simulation sweeps—perfect for a grad student with coding skills. Q2 and Q3 require slightly more theoretical setup but no wet lab. Q5 is the capstone.
  3.  **Crowding:** Q1 (Price equation robustness) is crowded in biological theory but **empty** in cultural evolution with overlapping networks. Q5 (Model comparison) is crowded in psychology but rare in theoretical cultural evolution.
  4.  **Moving the Needle:**
      *   **Move Up:** If Q1 shows equivalence breaks down completely, Q3 becomes irrelevant (the friend is wrong, stop worrying about causality, just use the level that works).
      *   **Move Down:** If Q2 shows group persistence cannot generate valid variance partitions, the whole group-selection agenda for culture drops, and you pivot to individual-level networks.

  ### The "Causal Fact" Verdict

  Your friend is right that there is no metaphysical "true level." She is wrong that this makes the debate pseudo. The question survives as **Causal Identifiability (Q3)**. If you can intervene on group structure independently of individual incentives, there is a causal fact about the *mechanism*, even if the *math* is equivalent. Your agenda should focus on identifying the structural conditions where identifiability fails, because that is where the "pseudo-debate" claim actually holds water.

