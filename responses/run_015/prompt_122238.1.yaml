      *   *Prior/Passing Theory:* (From "A Nice Derangement of Epitaphs"). Prior theory = what you expect them to mean. Passing theory = what you actually interpret them to mean in the moment to make sense of the utterance (e.g., malapropisms).

  3.  **Analyze *Arrival* through Davidson:**

