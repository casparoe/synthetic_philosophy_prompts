answer: |-
  **Project Title:** Trajectory vs. Juncture: Diachronic Autonomy and the Ethics of Long-Term Default Nudges

  **Project Summary**
  Behavioral ethics literature typically evaluates nudges at the point of choice: Is the opt-out available? Is the friction low? This project argues that this "juncture-based" evaluation is insufficient for interventions designed to persist over time, such as automatic enrollment and escalation in retirement savings. Drawing on my prior professional experience designing these communications, I propose that the relevant ethical unit is not the single choice but the *decision trajectory*. When a default setting is designed to run on autopilot for years, it shifts control from the agent to the architect. Furthermore, because long-term defaults shape the preferences used to evaluate them, welfare-based justifications become circular. This fellowship year will develop a normative framework for "Trajectory Autonomy," establishing criteria to distinguish between supportive scaffolding and structural usurpation.

  **Research Question**
  *Under what necessary and sufficient conditions does a long-term default nudge violate autonomy by usurping control over a decision trajectory rather than merely influencing a single choice?*

  This question demands a determinate answer: a set of criteria that practitioners can apply to determine if a specific nudge architecture is ethically permissible. It moves beyond the binary "is nudging manipulative?" debate to a structural analysis of time and control.

  **The Gap in Current Literature**
  Current defenses of nudging rely on two pillars, both of which leave the long-term question open. First, the *libertarian* defense argues that autonomy is preserved if the opt-out remains costless. This ignores the cognitive cost of monitoring a default over five or ten years. As I witnessed in corporate strategy meetings, the assumption that "they can change it later" treats a multi-year financial trajectory as a series of disconnected static moments. It fails to account for the inertia built into the system design.

  Second, the *welfarist* defense argues that nudges are justified if they help people achieve what they would choose for themselves. This relies on an independent benchmark of preference. However, long-term defaults do not merely reveal preferences; they calcify them. If an auto-escalation policy causes an employee to adapt their lifestyle to the reduced take-home pay, their subsequent satisfaction with the policy is endogenous to the policy itself. Using that satisfaction to justify the nudge is circular. Existing literature identifies preference change but has not fully spelled out how this circularity undermines the normative force of the welfare argument in longitudinal contexts.

  **Methodology**
  This project will employ conceptual analysis and normative modeling rather than empirical methods (e.g., surveys or interviews). While empirical data can reveal *that* preferences shift under long-term defaults, it cannot determine *whether* that shift constitutes a violation of autonomy. A survey might show that employees are "happy" with their auto-enrollment after five years; it cannot tell us if that happiness is the result of rational adaptation or structural coercion.

  The core problem is a category error in how we define the locus of control. Correcting this requires philosophical argumentation to redefine the boundaries of agency over time. Empirical methods would measure the symptoms; this project diagnoses the structural condition. I will construct thought experiments comparing short-term vs. long-term default architectures to isolate the specific variable of *temporal control*.

  **Work Plan (12 Months)**

  *   **Months 1–3: Framework Development.** I will define "Trajectory Autonomy" against standard accounts of diachronic agency. The goal is to articulate why control over a path differs from control over the steps on that path. I will draft the core argument regarding the "Architect vs. Agent" power dynamic.
  *   **Months 4–6: The Circularity Problem.** I will focus on the welfare justification. I aim to formalize the argument that endogenous preference formation invalidates standard welfarist defenses in long-term contexts. This involves mapping the feedback loop between default settings and preference adaptation.
  *   **Months 7–9: Normative Criteria.** Synthesizing the autonomy and welfare arguments, I will develop the "Trajectory Test." This will be a set of necessary and sufficient conditions for ethical long-term nudging. I will test these criteria against counterexamples (e.g., organ donation defaults vs. savings defaults).
  *   **Months 10–12: Writing and Translation.** I will complete the dissertation chapter and produce the practitioner deliverable (see below). Final revisions will focus on ensuring the philosophical rigor holds up against objections regarding paternalistic benevolence.

  **Deliverable**
  Academic output will include a dissertation chapter and a target article. However, recognizing the applied nature of this inquiry, I will also produce a **Trajectory Impact Assessment (TIA) Protocol**.

  This will be a one-page diagnostic tool designed for the kind of strategy room I used to occupy. It will not ask "Is the opt-out easy?" but rather:
  1.  *Duration:* How long does this default run before a forced review?
  2.  *Adaptation:* Does this default change the user's financial baseline in a way that makes opting out progressively harder?
  3.  *Architect Incentive:* Does the entity setting the default benefit from user inertia?

  This bridges the gap between abstract autonomy and compliance paperwork, giving HR and policy architects a concrete way to evaluate the ethics of "set and forget" systems.

  **Risk Assessment and Scope**
  *   **Failure Condition:** The project fails if I cannot distinguish between *benign* trajectory setting (e.g., automatic safety features) and *malign* trajectory setting (e.g., predatory debt rollovers). If the "Trajectory Autonomy" framework ends up condemning all defaults as usurpations, it is too broad to be useful. Conversely, if it allows all "welfare-enhancing" defaults, it collapses back into the circularity I aim to critique.
  *   **Scope Creep:** The obvious risk is expanding into all behavioral public policy. I will strictly limit the scope to *long-term, recurring financial or resource allocation defaults*. This ensures the project remains manageable within a year.
  *   **Viability:** The project is viable because it does not require new empirical data collection, which is prone to delay. The risk lies in the conceptual difficulty of defining "control over time." However, my background provides a distinct advantage: I know exactly how these policies are sold internally, allowing me to target the specific rhetorical moves that obscure the loss of trajectory control.

  **Conclusion**
  Philosophy often arrives after the policy is written. This project aims to intervene in the design phase. By shifting the ethical gaze from the juncture to the trajectory, we can better protect autonomy in a world where the most significant choices are the ones we never actively make.
