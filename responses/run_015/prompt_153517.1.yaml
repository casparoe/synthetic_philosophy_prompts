      *   *Passengers (Workers & Capitalists):* Both are subject to the movement. Capitalists aren't truly free; they are personifications of capital. Workers are dragged along.
      *   *No Steering/Brakes (Lack of Control):* Reflects the "anarchy of production" and the coercive laws of competition. No single actor controls the systemic logic.
      *   *Destination (Crisis/Socialism):* Historical materialism suggests an end point (teleology). Breakdown leads to revolution.
      *   *Formal Subsumption:* The train exists, but the old carriages are just hooked up. Work is the same, but now owned by the conductor.
