      *   **Section 2: The Breakdown.** Focus on Technological Determinism (Engine vs. Tracks directionality), Class Struggle (Passengers are too passive), and Capitalist Agency (They aren't just passengers).
      *   **Section 3: Survival of the Core Insight.** Does "tech is not neutral" survive? Yes, actually strengthened by the critique. The "Tracks" build the "Engine."
      *   **Section 4: A Better Analogy.** Propose the **"Operating System (OS)"** analogy.
          *   OS = Capitalist Relations.
          *   Hardware/Apps = Technology.
