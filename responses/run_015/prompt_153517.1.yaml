  3.  **Critique the Analogy (Breakdown Phase):**
      *   *Technological Determinism:* The train implies the *engine* (tech) drives the *tracks* (society). Marx argues the *tracks* (relations of production) dictate what *engines* are built. The analogy risks making tech the primary agent.
