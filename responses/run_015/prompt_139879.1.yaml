answer: |-
  **MEMORANDUM**

  **TO:** Homeless Services Board Allocations Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for State Block Grant Allocation ($4.2M)

  **Bottom Line**
  I recommend the County apply as the sole lead agency for the $4.2M state grant under a Housing First model. Simultaneously, we allocate separate local funds to support the Coalition's abstinence-based recovery housing as an independent, opt-in program. There will be no co-branding on the state grant; the County assumes full administrative liability. The Coalition's recovery program will be funded through a distinct local line item, ensuring compliance with state prohibitions on "parallel tracks" within the grant itself. We must finalize this structure and submit the state application within ten days. This approach secures the state funding immediately while preserving our operational capacity. If accepted, we vote to authorize staff to draft the specific MOU separating the funding streams by next Tuesday.

  **What We're Really Disagreeing About**
  We are not just arguing about data. One side prioritizes housing retention rates and reduced emergency room usage, believing low-barrier access saves lives. The other side believes sobriety is a prerequisite for stability and that providing housing without it causes harm. But the deeper conflict is about complicity. The Coalition refuses to be associated with a model they view as morally hazardous. They aren't just saying Housing First fails; they are saying participating in it makes them accomplices. Complicating this is the leverage they hold. Seventy percent of our volunteer labor and critical shelter leases are tied to their goodwill. This isn't merely a philosophical standoff; it is an operational vulnerability. If we ignore the complicity concern, we risk losing the physical capacity to house anyone. If we ignore the outcome data, we violate our mandate to use evidence-based practices. We are stuck between moral integrity and physical capacity. Some members view the threat to withdraw leases as illegitimate coercion, arguing we should not negotiate under duress. Others view it as a realistic assessment of risk, noting that replacing those beds is impossible within the grant timeline. This splits the committee not just on policy, but on whether principle outweighs practicality. The swing vote hinges on whether this memo convinces them that we can satisfy the principle of evidence-based care without triggering the practical collapse of our shelter network. We need to be honest that both sides feel their core values are being threatened.

  **Why This Beats Splitting the Difference**
  This proposal unbundles the symbol from the substance. The Housing First side gets the substantive outcome: the state grant funds permanent housing without sobriety requirements, maximizing the metrics you care about. The Coalition gets the symbolic separation: their name, volunteers, and buildings are not attached to the Housing First grant. They avoid the complicity they fear. Crucially, this is not a 50/50 split of the state grant, which would violate state rules and dilute effectiveness. Instead, it separates funding streams. For Coalition members worried that Housing First yields worse outcomes, this structure preserves their recovery model as an opt-in alternative using local funds. They don't have to endorse Housing First; they just have to tolerate its existence alongside them. You get your evidence-based program funded by the state; they get their moral boundaries respected by the County. Both sides surrender the desire to dominate the other's model, but both secure the core function they need to operate. This avoids the "parallel track" rejection from the state because the grant application lists only one model. The local funding for recovery housing is invisible to the state reviewer. For the Coalition members who genuinely believe abstinence produces better human outcomes, this allows them to continue demonstrating that model without being forced to validate the competing model. It treats the disagreement as a pluralistic difference rather than a zero-sum war. The Housing First side gives up the victory of forcing the Coalition to co-sign the program; the Coalition gives up the veto power over the County's primary funding stream. It transforms a battle over control into a division of labor.

  **The Strongest Thing on the Other Side**
  The strongest argument against this is that it legitimizes coercion and muddies our ethical stance. By carving out local funds to appease the Coalition, we are effectively paying a ransom to keep shelter beds open. This sets a dangerous precedent: any group with enough leverage can veto evidence-based policy by threatening withdrawal. Furthermore, some argue that funding the recovery house separately still makes the County complicit in a model we deem exclusionary. If we believe abstinence requirements deny care to the most vulnerable, facilitating that model—even separately—contradicts our mission. Compromise can look like cowardice. If we accept this deal, we admit that our commitment to Housing First is conditional on the Coalition's approval. It signals that operational convenience outweighs moral consistency. We risk telling the public that scientific evidence is negotiable when threatened with resource loss. There is also the risk that this separation is illusory. The public will still see the County funding both. If a client dies in the Housing First program, the Coalition will still be blamed for association by proximity. If a client fails in the recovery house, Housing First advocates will claim vindication. The "unbundling" may not actually protect either side from the reputational fallout of the other. Additionally, maintaining two distinct administrative structures increases overhead costs, reducing the actual dollars reaching clients. We must ask if the cost of this peace treaty is too high in terms of efficiency and moral clarity.

  **If They Say No**
  If the Coalition rejects this separation and withdraws support, we face an immediate capacity crisis. We must activate emergency protocols to recruit alternative vendors and secure temporary leases, though this will take months and cost more. Regarding the state grant, if the structure proposed here is deemed non-compliant, we proceed with the County-led Housing First application regardless. We cannot hold the state funding hostage to local negotiations indefinitely. We will absorb the short-term loss of volunteer hours and beds rather than compromise the long-term integrity of the allocation. Staff should prepare a contingency budget outlining the cost of replacing the Coalition's leased facilities within thirty days.

  **Motion for Vote**
  Move to authorize the County Administrator to submit the state block grant application as the lead agency under a Housing First model, contingent on securing separate local funding for abstinence-based recovery housing with no co-branding.
