  The problem your friend is referring to is known in political science, law, and philosophy as the **Doctrinal Paradox** (or the **Discursive Dilemma**). It occurs when a collective body decides a conclusion (Grant/Deny) based on multiple premises (Findings a, b, c, d), and the majority vote on the premises yields a different outcome than the majority vote on the conclusion.

  Here is an analysis of your board's situation, the rules consistent with your record, and advice on how to proceed.

  ### 1. What rules are consistent with the record?
  You have correctly identified the two standard procedures for aggregating votes in this context:

  *   **Premise-Based Procedure (PBP):** The board votes on each finding separately. If a majority finds all four conditions met, the variance *must* be granted. The motion is a logical consequence of the findings.
  *   **Conclusion-Based Procedure (CBP):** The board votes on the motion to grant first. The findings are then crafted (or voted on) to rationalize the outcome of the motion. The motion is an expression of discretion; the findings are narrative.

  **Do the four past cases distinguish between them?**
  No. As you noted, in Kwan, Sorenson, Ricci, and Aldrich, the majority on the findings aligned with the majority on the motion.
  *   In **Kwan** and **Ricci**, majorities supported all findings and the motion passed. (PBP = Grant, CBP = Grant).
  *   In **Sorenson** and **Aldrich**, at least one finding failed majority support and the motion failed. (PBP = Deny, CBP = Deny).

  Because the inputs and outputs aligned in every past instance, the minutes are logically consistent with *both* rules. The record underdetermines the procedure.

  ### 2. What does each predict for Delacroix?
  The Delacroix case is the "tipping case" where the two procedures diverge.

  *   **Under CBP (Chair's Habit):** The vote is taken on the motion first. Currently, the motion stands at 1–3 against. If you vote to grant, it becomes 2–3. The motion fails. The clerk then records findings to support the denial (likely recording that (b), (c), or (d) failed, even if the vote on those findings was close).
  *   **Under PBP (Bylaw Logic):** The board votes on findings first. If you vote "Yes" on (d) (and presumably (b) and (c) to be consistent with granting), the tally becomes 3–2 in favor on all four findings. Under the bylaw ("shall grant... where it finds all"), the board is legally obligated to grant the variance. The motion should then pass 3–2.

  **The Conflict:** If you vote "Yes" on the findings (making them pass 3–2) but the other three members vote "No" on the motion (keeping it 2–3), you recreate the exact error that caused the town's previous decision to be sent back: **written findings that do not support the result.**

  ### 3. Which is the board actually running?
  I would bet the board is **operationally running CBP** but **legally required to run PBP**.

  *   **Evidence for CBP:** The Chair takes the vote on the motion first. This treats the outcome as the primary decision and the findings as secondary. This is common in political bodies because it allows members to vote their conscience on the outcome without being boxed in by logical premises.
  *   **Evidence for PBP:** The bylaw text ("shall grant... where it finds") establishes findings as conditions precedent. More importantly, the town counsel's memo and the previous appeal explicitly warn against "findings [that] did not support the result." This indicates the legal expectation is PBP.

  The tension between the Chair's habit (CBP) and the town's legal vulnerability (PBP) is why the town is "paying attention to how we decide."

  ### 4. What case would settle it?
  **Delacroix is that case.**
  Because the past four cases yielded the same result under either rule, they cannot settle the procedural question. Delacroix is the first time the majority on the premises (if you vote Yes) conflicts with the majority on the conclusion. The way you handle this vote will establish the precedent for which rule governs the board.

  ### 5. What principle is adopted by each choice?
  *   **Choosing PBP (Findings First):** Adopts the principle of the **Rule of Law**. It constrains the board's discretion, ensuring that variances are granted only when objective criteria are met by a majority. It prioritizes logical consistency and defensibility against appeal.
  *   **Choosing CBP (Motion First):** Adopts the principle of **Discretionary Authority**. It prioritizes the collective will of the members on the ultimate outcome, allowing them to weigh factors holistically rather than mechanically. It prioritizes political flexibility over logical rigidity.

  ### 6. Should you make the motion to vote on findings first?
  **Yes.** You should move to vote on the findings before the motion.

  *   **Why:** The bylaw logically requires PBP ("grant... where it finds"). The town's previous reversal was due to a failure of PBP (inconsistency between findings and result). Continuing the Chair's CBP habit in a case where they diverge invites another lawsuit.
  *   **Defensibility:** A decision is defensible when the record shows the result followed from the criteria. Voting on the motion first severs that link. By moving to vote on findings first, you align the board's procedure with the bylaw's text and the lesson of the previous appeal.

  ### 7. How should you vote?
  You want a decision "continuous with its own past." The past includes the **reversal**. Therefore, continuity requires avoiding the error that caused the reversal (inconsistent findings).

  You have two paths to consistency, but only one aligns with your conscience and the bylaw:

  1.  **Consistency via Denial (The Safe Path):** You vote "No" on finding (d). This makes the finding fail 2–3. The motion fails 2–3 (or 1–4). The record is consistent (Findings fail, Motion fails). *Cost:* You vote against your inclination and the family.
  2.  **Consistency via Grant (The Principled Path):** You move to vote findings first. You vote "Yes" on all findings. When the motion comes up, you vote "Yes." You then argue to the other members that **because the Board has officially Found all conditions met by a majority, the Bylaw requires them to vote Grant on the motion to maintain consistency.**

  **Recommendation:**
  Take the **Principled Path**.
  1.  **Make the motion** to vote on findings first. Cite the bylaw language and the previous appeal's requirement that findings support the result.
  2.  **Vote "Yes" on (d)** (and the others, if consistent with your view).
  3.  **Vote "Yes" on the Motion.**
  4.  **Argument:** If the other members vote "No" on the motion after the findings have passed, point out on the record that this creates a reversible error. Remind them that under PBP, a majority finding on premises binds the conclusion.

  If they still vote "No" on the motion, the record will show a paradox. However, by forcing the vote on findings first, you have done your duty to ensure the *procedure* was correct. If the Board chooses to issue a decision where Findings = Grant but Motion = Deny, that is a conscious choice by the Board to invite appeal, not a procedural failure on your part.

  ### 8. What to make of the order deciding the case?
  You should recognize that **procedure is substantive.** In cases of the Doctrinal Paradox, the order of voting is not merely administrative; it determines the outcome.

  *   If the Chair's order stands (Motion First), the variance dies (CBP).
  *   If your order prevails (Findings First), the variance likely lives (PBP).

  By questioning the order, you are not nitpicking; you are identifying that the board lacks a meta-rule for how it aggregates votes. Establishing that the Bylaw requires Findings to precede the Motion resolves the paradox in favor of the Rule of Law. This is the only way to ensure the board's decision is continuous with the *legal constraints* of its past (the appeal) rather than just the *habits* of its past (the Chair's gavel).

  **Summary Advice:** Move to vote findings first. Vote to grant. Force the board to choose between following the logic of its own findings or creating a record that the town's counsel has already warned is vulnerable. This is how you protect the board from itself.
