answer: |-
  Brainstorming three mechanisms for a 90-minute session with 18 engineers. Candidate 1 is your Split-Group Classification: identical rules, divergent training examples, conflicting probes. This creates social friction; hostile participants see peers disagreeing despite "following the rules." Candidate 2 is the One-Shot Essence Break: invent a concept from one example, then shatter it with a second. This creates individual visceral shock but lacks group debate data. Candidate 3 is the Letter-String Ladder: pure analogy puzzles (abc->abd, iijjkk->?). This isolates cognition from domain knowledge but feels like a toy problem to skeptical engineers.

  I choose Candidate 1 (Split-Group) as the core engine. It generates the most robust evidence for the room because the divergence is public and undeniable. I will incorporate the One-Shot as a brief warm-up to prime the "essence" feeling, but I am cutting the Letter-String Ladder entirely. It consumes too much debrief time and risks disengaging the "hostile" cohort who might dismiss it as irrelevant puzzle-solving. By cutting the ladder, I sacrifice the purest demonstration of structural mapping to ensure there is enough time to process the social divergence in the main event, which is more persuasive for this specific audience.

