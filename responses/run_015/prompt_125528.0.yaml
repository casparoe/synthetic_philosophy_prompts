          *   *Weakness:* Still feels like stretching the text.

      *   *Objection 2 (Gender):* "Fortuna is a woman to be subdued. Virtù is masculine aggression. Chaos engineering isn't about domination."
          *   *Reply:* Acknowledge the problematic imagery. Pivot to the *mechanism* of uncertainty management. Don't defend the sexism, contextualize it.
          *   *Weakness:* Hard to separate the metaphor from the misogyny completely.

      *   *Objection 3 (Phil-Tech):* "This is just Taleb's Antifragility. What's new?"
