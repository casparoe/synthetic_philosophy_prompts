prompt: |-
  I run onboarding for new engineers joining our model-monitoring team, and I've got 45 minutes next week. What I need them to walk out able to do is read a drift report and say something better than "the numbers moved." The concept is mechanistic anomaly detection: what were hunting isn't a weird input or a bad output, it's a change in which internal machinery is producing a behavior we thought we'd already characterized. The part they always get stuck on, and where I think the session lives or dies, is the identity question: when is the mechanism running now the same mechanism we wrote up six months ago?

  So plan the session for me rather than giving me the talk. What has to come first and what depends on what -- I suspect I can't even get them to state "the mechanism changed" until they have an intervention-based notion of a mechanism rather than a circuit-diagram notion, but I'm not sure that's where to start. One example to carry the whole thing: I've been using a loan classifier that reviewers traced to a salary-and-zipcode feature direction, which after a data refresh returns the same approvals with that direction gone and something functionally similar rebuilt out of two unrelated attention heads -- tell me if that's the wrong example, and what a carrying example here has to have and to lack. The misconceptions in the order they'll actually form, with the point in the sequence where each gets headed off: I'm guessing "anomaly just means rare input," "same outputs and same accuracy means same mechanism," and "the mechanism is whatever's in the diagram." And one question at the end that tells me they've got the identity question rather than just the vocabulary.

  Two constraints. I've decided to define identity pragmatically, by whether the safety case we already wrote still covers the new arrangement -- call that coverage identity -- and I want the plan built around it rather than around path-identity versus counterfactual-profile identity. And tell me what I should openly refuse to explain at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested onboarding plan:

  1.  **Analyze the Request:**

      *   **Goal:** Plan a 45-minute onboarding session for new engineers on a model-monitoring team.
      *   **Core Competency:** Read a drift report and identify *mechanistic* change, not just statistical drift ("numbers moved").
      *   **Core Concept:** Mechanistic Anomaly Detection (change in internal machinery producing characterized behavior).
      *   **Critical Bottleneck:** The "Identity Question" (When is the mechanism now the *same* mechanism as six months ago?).
      *   **Proposed Definition of Identity:** "Coverage Identity" (Does the existing safety case still cover the new arrangement?).
      *   **Proposed Example:** Loan classifier (salary+zipcode direction $\rightarrow$ data refresh $\rightarrow$ same approvals but direction gone, rebuilt via two unrelated attention heads).
      *   **Required Output:** A session plan (sequence, dependencies), evaluation of the example, identification of misconceptions (and when to head them off), a final assessment question, and a list of topics to *refuse* to explain.
      *   **Constraints:** 45 minutes, focus on Coverage Identity, avoid deep theoretical debates (path-identity vs. counterfactual-profile).

  2.  **Deconstruct the Core Problem (The Identity Question):**

      *   The user suspects engineers get stuck because they view mechanisms as static circuit diagrams rather than intervention-based functional units.
      *   The user wants to define identity pragmatically: "Does the safety case hold?"
      *   *Challenge:* If the safety case holds, is it the same mechanism? If the internal weights change but the input-output map and the *reason* for the safety case (e.g., "we checked for bias in salary") remain valid, does it matter that attention heads changed?
      *   *Refinement:* The example suggests the *direction* (salary+zipcode) disappeared and was replaced by something "functionally similar" but structurally different (two attention heads). If the safety case was "We verified salary isn't driving decisions," and now salary *isn't* driving decisions (via that direction), but something else is, does the safety case hold?
      *   *Crucial Insight:* The safety case usually relies on *causal* claims, not just correlational ones. If the mechanism changes, the causal claims might break even if accuracy holds.
      *   *Coverage Identity:* "The safety case covers the new arrangement." This implies the safety case must be mechanistic, not just behavioral. If the safety case says "Module A ensures fairness," and Module A is now bypassed, the safety case fails, even if fairness holds accidentally.

  3.  **Evaluate the Carrying Example:**

      *   *Scenario:* Loan classifier. Old: Salary+Zipcode direction. New: Same approvals, direction gone, rebuilt via two unrelated attention heads.
      *   *Pros:* Relatable (loans), clear shift (linear direction vs. attention heads), highlights the "same output, different path" problem.
      *   *Cons/Risks:* "Functionally similar" is dangerous. If it's truly functionally similar regarding the *safety properties*, then Coverage Identity says it's the "same" (safe) mechanism. If the safety case was specifically about the *salary direction*, then the identity is broken.
      *   *Verdict:* It's a strong example *if* framed correctly. It needs to emphasize that the safety case relied on the *specific* mechanistic pathway (e.g., "We audited the salary feature coefficient"), not just the outcome.
      *   *Requirement for Example:* It must lack a change in global accuracy (to rule out performance monitoring) and lack a change in input distribution (to rule out data drift). It must isolate *internal* reconfiguration.

  4.  **Sequence the Misconceptions:**

      1.  *Anomaly = Rare Input:* (Data Drift vs. Mechanistic Drift). Needs to be addressed early.
      2.  *Same Output = Same Mechanism:* (Behavioral Equivalence vs. Mechanistic Identity). This is the core hurdle.
      3.  *Mechanism = Diagram:* (Static Structure vs. Intervention/Coverage). This is the resolution.

  5.  **Drafting the Plan (Iterative Process):**

      *   *Time:* 45 mins is tight. Need strict timeboxing.
      *   *Phase 1: The Hook (5 mins).* Show the drift report. It looks fine (accuracy stable). But something is wrong.
      *   *Phase 2: Defining the Terrain (10 mins).* Distinguish Data Drift, Output Drift, Mechanistic Drift. Kill Misconception 1 here.
      *   *Phase 3: The Identity Crisis (20 mins).* The core. Use the Loan Example. Introduce Coverage Identity. Kill Misconception 2 & 3 here.
      *   *Phase 4: Assessment (5 mins).* The final question.
      *   *Phase 5: Refusals (5 mins).* What we aren't doing.

      *Refining Phase 3 (The Identity Crisis):*
      The user wants "Coverage Identity." This means the safety case is the ruler.
      *Step:* Show the old safety case. "We verified the salary coefficient is < 0.1."
      *Step:* Show the new state. "Salary coefficient is 0. But accuracy is same."
      *Step:* Ask: "Is the safety case valid?"
      *Answer:* No, because the audit was on the coefficient, not the attention heads.
      *Conclusion:* Mechanism changed because Coverage broke.

      *Refining the "Intervention" aspect:*
      The user mentioned "intervention-based notion." I need to make sure the safety case is framed as a set of interventions/claims, not just a static doc. "If we perturb X, Y happens." If the new mechanism doesn't respect that perturbation, coverage is lost.

  6.  **Developing the Final Question:**

      *   Needs to test Coverage Identity, not vocabulary.
      *   Scenario: A report shows internal weights shifted, accuracy same. Safety case says "We tested robustness to noise in Layer 3." New model bypasses Layer 3.
      *   Question: "Do we re-certify?"
      *   Correct Answer: "Yes, because the safety case intervention (noise in Layer 3) no longer applies to the active pathway, so coverage is lost."

  7.  **Determining "Refusals":**

      *   Don't explain *how* to find the heads (attribution tech).
      *   Don't explain *why* the model rewired itself (grokking/optimization dynamics).
      *   Don't debate philosophical identity (Ship of Theseus). Stick to the pragmatic safety case definition.

  8.  **Review against Constraints:**

      *   45 mins? Yes.
      *   Coverage Identity focus? Yes.
      *   Example evaluation? Included.
      *   Misconception ordering? Included.
      *   Final Question? Included.
      *   Refusals? Included.

  9.  **Final Polish:**

      *   Ensure the tone is professional, direct, and respects the user's expertise (they know the tech, they need the *pedagogy*).
      *   Make sure the distinction between "Circuit Diagram" and "Intervention" is clear in the plan. The safety case *is* the set of interventions we promised hold true.

      *(Self-Correction during drafting)*: Wait, if the safety case covers the *behavior* (e.g., "No bias in loans"), and the new mechanism also produces "No bias," does Coverage Identity say it's the same?
      *User's Definition:* "Whether the safety case we already wrote still covers the new arrangement."
      *Implication:* If the safety case is written behaviorally ("Approval rates equal across groups"), coverage holds. If it's written mechanistically ("Salary feature weight < 0.1"), coverage breaks.
      *Decision:* For this team (Model Monitoring/Mechanistic), safety cases *must* be mechanistic. I need to explicitly state that the *premise* of this team is that safety cases are mechanistic claims. Otherwise, Coverage Identity collapses into Behavioral Identity. I will build this into the "Refusals" or "Premises" section. The plan must enforce that *our* safety cases are mechanistic.

      *Re-evaluating the Example:* The example says "functionally similar rebuilt." If it's functionally similar *regarding the safety property*, then coverage holds. If it's functionally similar *regarding accuracy*, coverage might not hold. I need to clarify this distinction in the plan. The example works best if the safety case was specific to the *original* mechanism (e.g., "We audited the salary direction").

      *Let's tighten the "Intervention" point:* The user suspects they need an intervention-based notion. A safety case is essentially a claim about interventions ("If we change input X, output Y changes Z"). If the mechanism changes, the intervention results might change even if the base accuracy doesn't. I will make the "Safety Case = Set of Interventions" link explicit.

  10. **Finalizing the Plan Structure:**
      *   **Session Goal:** Calibrate "Mechanism Identity" to "Safety Case Coverage."
      *   **The Example:** Validated with caveats.
      *   **The Flow:**
          1.  Context (Drift Report).
          2.  The Trap (Behavioral Stability).
          3.  The Definition (Coverage Identity).
          4.  The Test (Intervention).
          5.  The Verdict.
      *   **Misconceptions:** Mapped to flow.
      *   **Refusals:** Scoped out.
      *   **Final Question:** Designed to test the coverage logic.

      *(Final check on time)*: 45 mins is very short for this depth. I need to advise the user to be ruthless on timekeeping. No Q&A until the end, or better, Q&A woven into the steps. I'll suggest "Checkpoints" instead of "Q&A".

      *(Final check on Identity)*: The user defines identity pragmatically: "Safety case covers new arrangement." This is the north star. I must ensure the plan doesn't drift into "Is it *really* the same?" but stays on "Does the doc still apply?"

      Let's write it.cw
answer: |-
  Here is the session plan. It is designed to be ruthless with time (45 minutes is extremely tight for this conceptual load) and focuses entirely on shifting their mental model from *structural* identity to *coverage* identity.

  ### Session Goal
  By minute 45, engineers must be able to look at a mechanistic drift report where accuracy is stable and determine: **"The safety case no longer covers this state; therefore, the mechanism is not identical."**

  ### The Carrying Example: Evaluation
  **Your Example:** Loan classifier. Old: Salary+Zipcode direction. New: Same approvals, direction gone, rebuilt via two unrelated attention heads.
  **Verdict:** **Keep it, but tighten the safety case premise.**
  *   **Why it works:** It isolates mechanistic change from performance change (accuracy is stable) and data change (approvals are stable). It forces the distinction between "doing the same job" and "doing the job the same way."
  *   **Critical Adjustment:** For "Coverage Identity" to work, the safety case *must* be mechanistic, not behavioral. If the safety case says "Approval rates must be fair," coverage holds. If the safety case says "Salary influence must be linearly bounded," coverage breaks.
  *   **Instruction:** Explicitly state at the start: *"On this team, our safety cases are mechanistic claims, not behavioral SLAs."* Without this axiom, the example fails.

  ---

  ### The Session Plan (45 Minutes)

  #### 0:00 – 0:05 | Context & The "Boring" Report
  **Action:** Project a drift report. Show stable accuracy, stable input distribution, stable output distribution.
  **Script:** "This report looks green. Accuracy is flat. Data distribution is flat. But we are flagging this as a Critical Mechanistic Anomaly. Why?"
  **Goal:** Create immediate cognitive dissonance. Establish that standard monitoring is insufficient.
  **Head Off Misconception 1:** *"Anomaly just means rare input."*
  *   **Intervention:** Explicitly state: "Data drift and output drift are zero. If you are looking for outliers in the data, you are looking at the wrong dashboard."

  #### 0:05 – 0:15 | The Trap of Behavioral Equivalence
  **Action:** Walk through the Loan Example (Old State).
  *   Show the "Salary+Zipcode" direction.
  *   Show the Safety Case Claim: *"We certified that salary influence is constrained to <5% via this specific linear projection."*
  **Action:** Walk through the Loan Example (New State).
  *   Show the direction is gone.
  *   Show the two attention heads.
  *   Show accuracy is identical.
  **Prompt:** "The model makes the same loans. The bias metrics are identical. Did the mechanism change?"
  **Goal:** Let them sit in the discomfort of "Same result, different path."
  **Head Off Misconception 2:** *"Same outputs and same accuracy means same mechanism."*
  *   **Intervention:** Do not answer yet. Ask: "If I perturb the salary feature now, does the model react the same way?" (Hint: No, because the linear direction is gone).

  #### 0:15 – 0:30 | Defining Identity via Coverage (The Core)
  **Action:** Introduce **Coverage Identity**.
  *   **Definition:** "A mechanism is 'the same' if and only if the safety case written for the old mechanism remains valid for the new arrangement without revision."
  *   **Reframe:** "Stop asking 'Is this the same circuit?' Start asking 'Does my certification doc still apply?'"
  **Action:** Apply to the Loan Example.
  *   **Question:** "Our safety case certified the *linear projection*. That projection no longer exists. It has been replaced by attention heads."
  *   **Conclusion:** "The safety case does not cover attention heads. Therefore, under Coverage Identity, this is a **new mechanism**."
  **Head Off Misconception 3:** *"The mechanism is whatever's in the diagram."*
  *   **Intervention:** Explain that a diagram is a snapshot. Coverage is a *contract*. If the contract relies on specific causal pathways (interventions), and those pathways reroute, the contract is void. The "mechanism" is the set of causal claims we have verified, not the weights themselves.

  #### 0:30 – 0:40 | The Intervention Test
  **Action:** Operationalize "Coverage."
  *   Explain that a safety case is a bundle of **intervention claims** (e.g., "If we zero out Head 4, risk stays low").
  *   If the model rewires, the interventions required to verify safety change.
  *   **Rule:** "If the set of interventions required to verify safety has changed, the mechanism identity has changed."
  **Activity:** Give them a mini-scenario (2 mins).
  *   *Scenario:* "Model v2 uses a different MLP layer for the same feature. Accuracy stable."
  *   *Task:* "Does the v1 safety case cover v2?"
  *   *Expected Answer:* "Only if the safety case claimed 'MLP Layer X is safe.' If it claimed 'Feature F is safe,' it might cover. But since we write mechanistic cases, we likely certified Layer X. So, No."

  #### 0:40 – 0:45 | Assessment & Wrap
  **Action:** Pose the Final Question (see below).
  **Action:** Collect answers (show of hands or chat).
  **Action:** Close. "Your job is not to fix the model. Your job is to declare the safety case void so the right people can fix the certification."

  ---

  ### The Final Assessment Question
  *Do not ask for a definition. Ask for a decision.*

  **Question:**
  "You are reviewing a drift report for a medical triage model.
  1.  **Accuracy:** Unchanged.
  2.  **Input Data:** Unchanged.
  3.  **Internal State:** The feature 'Blood Pressure' previously activated Neuron Group A. It now activates Neuron Group B.
  4.  **Safety Case:** The current safety case states: 'We have verified that Neuron Group A does not overfit to demographic proxies.'

  **Do we treat this as the same mechanism or a new mechanism?**"

  **Correct Answer:**
  "**New Mechanism.** The safety case is tied to Neuron Group A. Since the causal pathway has moved to Group B, the existing safety case provides **zero coverage** for the new pathway. We must re-certify Group B."

  **Failure Mode:**
  "Same Mechanism, because the output/accuracy is the same." (This indicates they reverted to Behavioral Identity).

  ---

  ### What to Refuse to Explain
  *You cannot teach mechanistic interpretability in 45 minutes. You must draw boundaries to protect the core concept.*

  1.  **Refuse to explain *how* we found the heads.**
      *   *Why:* Attribution tech (SVD, probing, causal tracing) is a rabbit hole. It distracts from the *identity* question.
      *   *Say:* "Assume the drift report is ground truth. We are discussing what to *do* with the finding, not how to *find* it."
  2.  **Refuse to explain *why* the model rewired.**
      *   *Why:* Optimization dynamics, grokking, or SGD noise are irrelevant to the safety case status.
      *   *Say:* "Whether this is adversarial or accidental doesn't change the coverage status. We treat all rewrites as new mechanisms."
  3.  **Refuse to debate Philosophical Identity.**
      *   *Why:* "Ship of Theseus" debates will eat 20 minutes.
      *   *Say:* "We are not solving metaphysics. We are solving compliance. If the doc doesn't cover it, it's new. Period."
  4.  **Refuse to explain how to *fix* the re-certification.**
      *   *Why:* That is the ML team's job, not Monitoring's.
      *   *Say:* "Your output is a red flag, not a patch. You declare the coverage void; others rebuild the case."

  ### Dependencies & Flow Logic
  *   **You cannot define Coverage Identity** until they accept that Safety Cases are Mechanistic (Minute 15 depends on Minute 5).
  *   **You cannot accept the Final Question** until they abandon Behavioral Equivalence (Minute 40 depends on Minute 15).
  *   **The Intervention Concept** is the bridge. If they view safety cases as static documents, Coverage Identity makes no sense. You must frame the Safety Case as a *set of tested interventions*. If the intervention target moves, the test is invalid.

  ### Facilitator Note
  The session lives or dies on **Minute 15**. If they push back on "Why does it matter if the accuracy is the same?", you must stop and re-assert the team's premise: *"We are not a Performance Team. We are a Assurance Team. If we cannot prove the *path* is safe, the destination doesn't matter."* If you waver there, they will leave thinking mechanistic monitoring is academic navel-gazing.
