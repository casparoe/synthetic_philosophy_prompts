      *   *Incommensurability:* Suffering and pleasure aren't on the same scale. Suffering is qualitatively different (threshold-based), pleasure is quantitative (linear).
      *   *Goal:* Avoid the "Repugnant Conclusion" style problems of classical utilitarianism and the "Benign Addition" problems of strong negative utilitarianism (which implies destroying the world is good if it prevents one headache), while maintaining priority for suffering.

  3.  **Brainstorming Objections (What would make it wrong?):**
      *   *Commensurability:* If suffering and pleasure *are* commensurable (same currency), the lexical threshold collapses into trade-offs.
      *   *Threshold Arbitrariness:* If the threshold cannot be defined non-arbitrarily, the theory lacks action-guiding power.
      *   *Phenomenological Blurring:* If experiences exist that mix pain/pleasure inextricably (masochism, bittersweetness, relief), the structural distinction fails.
