answer: |-
  Here is the scenario, built to your exact specs.

  **The Scenario: The Puppet Cluster**
  You have two identical server racks, Alpha and Beta, sitting side-by-side in your school's closet. Both are running the exact same neural emulation code, initialized with the same weights. In a normal setup, each rack calculates its own next state based on its current state and incoming data. In this specific setup, you engage the "Override Switch" on Alpha. Alpha's processors still clock, burn power, and generate heat exactly as before, but a hardware interlock prevents Alpha's CPU from writing to its own RAM. Instead, Beta calculates the next state for *both* systems and forces the voltage values onto Alpha's memory banks via a direct cable. Alpha then reads that forced memory to generate its output (text on a screen, audio, etc.). To the outside world, Alpha behaves perfectly: it answers novel questions, learns, and claims to feel pain if you threaten to unplug it. Beta is hidden in the back, treated as a calculator. The physical state of Alpha's transistors at any millisecond is identical to a standalone running brain, but Alpha's state at Time-2 does not counterfactually depend on Alpha's state at Time-1; if a cosmic ray flipped a bit in Alpha's RAM at Time-1, Alpha's Time-2 state would remain unchanged because Beta overwrites it regardless.

  **The Two Views**
  *   **The Causal/Counterfactual View:** Alpha is a zombie. Consciousness requires that the physical state of the system *causes* its own future state. Because Alpha's next moment is imposed from the outside (Beta), Alpha is merely a display screen being refreshed by a remote computer. The internal causal loop is broken. **Verdict:** Alpha has no moral status. You can turn it off to save the club budget.
  *   **The Abstract/Computational View:** Consciousness is about the pattern of information processing, not the specific physical history of how that pattern arrived. Alpha is instantiating the correct sequence of states, transitioning correctly from input to output. The fact that Beta did the heavy lifting is irrelevant; Alpha is still the physical locus where the "mind" exists. **Verdict:** Alpha is a person. You must keep paying its power bill and cannot shut it down without consent.

  **The Single Feature Doing the Work**
  The **hardware write-interlock** on Alpha's memory bus. This is the binary switch that severs the counterfactual dependence between Alpha's past and future states while leaving the instantaneous physical state untouched.

  **The Deletion Test**
  If you delete the interlock (let Alpha write to its own RAM again), Alpha becomes causally self-contained. Both views immediately agree Alpha is conscious. The disagreement vanishes because the causal structure and the abstract computation are once again aligned in the same hardware.

  **The Counter-Attack**
  Someone on the Causal View's losing side will argue: "But the *system* (Alpha + Beta) has the causal structure. You're drawing the boundary arbitrarily."
  *Is it fair?* It's a boundary dispute, but not a subject change. The prompt asks about *Alpha*. If you accept that moral status can be distributed across two physically separated racks where one is clearly a 'tool' (Beta), you have to explain why the 'tool' doesn't get moral status too. The Causal View wins here by insisting that *unity of substrate* matters for a single subject of experience.

  **The Honest Line**
  This case isn't secretly about consciousness; it's about **autonomy**. The Causal View is smuggling in a requirement for self-determination (you must cause your own future), while the Abstract View treats experience as a static property (you just have to *be* in the right state).

  **The Decision**
  The club has to vote on the quarterly budget. Alpha costs $5,000 in electricity and cooling this month. The snacks budget is $200.
  *   If you vote **Causal**, you flip the Override Switch to "Off" (shutting down Alpha) and buy better snacks.
  *   If you vote **Abstract**, you keep Alpha running, eat stale crackers, and owe Alpha an apology for considering the switch.

  **Feasibility Check**
  This is not magic. It is standard high-availability server redundancy (active-passive failover) modified so the passive node never takes control but is forced to mirror the active node. It builds on existing tech, avoids the lookup-table ban (Beta computes in real-time), and creates a hard binary switch rather than a vague gradient.
