  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "randomly distributed" claim? Yes, that's the biggest error. Consciousness isn't a lottery ticket per insect; it's a biological hypothesis. But under uncertainty, we assign a credence to the hypothesis.
