      *(Wait, one more check on the Tokyo aspect)*: The prompt says Tokyo treats death-by-overwork as "honorable." This is a strong cultural claim. I should acknowledge that the firm leverages this cultural norm rather than creating it, but by rewarding it via metrics, they reinforce it.

      *(Wait, one more check on the EU aspect)*: The firm complies legally but the *onboarding* is global. This creates cognitive dissonance. The implicit theory is that the *global* culture is the "real" one, and local laws are "exceptions."

