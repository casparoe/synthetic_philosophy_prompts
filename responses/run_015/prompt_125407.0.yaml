answer: |-
  The institutional patchwork you describe presupposes a theory of labor and leisure that can be characterized as **Compliant Productivism**. This framework treats labor as the primary site of moral worth and value creation, while treating leisure as an instrumental good required for the maintenance of labor power. The firm does not hold a coherent philosophical commitment to any single labor ethic; rather, it engages in **normative arbitrage**, adopting the minimum viable moral and legal constraints of each jurisdiction to maximize extraction while maintaining a unified global ideology that privileges work.

  Here is the reconstruction of the implicit theory, the analysis of its contradictions, and the blueprint for a genuine leisure-rights-based alternative.

  ### 1. The Implicit Theory: Instrumental Recuperation

  **The Moral Status of Labor:**
  The onboarding materials frame sustained labor as a moral virtue, echoing the Protestant work ethic. In this view, work is **intrinsically valuable**; it is the mechanism through which individuals demonstrate character and contribute to the collective good. Idleness is not merely unproductive; it is morally suspect. Consequently, the default state of the employee is "at work," and any deviation from this state requires justification.

  **The Political Status of Leisure:**
  Leisure is not viewed as a distributive good (like health care or income) to which citizens or employees are entitled by right. Nor is it viewed as a sphere of freedom for human flourishing independent of economic utility. Instead, leisure is treated as **instrumentally valuable**. It is a maintenance cost, analogous to machine downtime for repairs.
  *   **Wellness Initiatives:** By framing rest as "therapeutic recovery," the institution defines the purpose of leisure as the restoration of the capacity to work. Rest is legitimate only insofar as it prevents burnout that would diminish future output.
  *   **Unlimited Vacation:** This policy reveals the core theory. If leisure were a right, it would be quantified and guaranteed (e.g., "4 weeks"). By making it "unlimited," the firm shifts the burden of justification onto the employee. It creates a negative liberty (you *can* take time) without a positive entitlement (you *shall* take time), resulting in a chilling effect where taking leave is seen as a lack of dedication.

  **Positive vs. Negative Rights:**
  The institution presupposes that individuals hold **no positive right to leisure**. A positive right would require the institution to actively structure workflows to ensure non-work time is protected and utilized. Instead, the firm operates on a **negative liberty model** (you are free to leave *unless* metrics penalize you), which is effectively nullified by the surveillance of response times. Even in the French and Belgian offices, the firm likely treats the "right to disconnect" as a legal compliance hurdle rather than an internalized value, adhering to the letter of the law while maintaining a culture that stigmatizes those who utilize it.

  ### 2. The Coexistence of Incompatible Commitments

  You ask whether the legal limits (EU), fatal overwork cultures (Tokyo), and meritocratic surveillance (US) share a single conception of obligation. They do not. They represent **incompatible philosophical commitments** that the institution manages simultaneously through compartmentalization.

  *   **The EU Model (Labor as Regulated Contract):** Presupposes the state has a paternalistic duty to protect the worker from the employer and themselves. Labor is a transaction with hard boundaries.
  *   **The Tokyo Model (Labor as Total Devotion):** Presupposes the worker belongs to the collective. Labor is a relational bond that transcends contractual hours.
  *   **The US Model (Labor as Market Performance):** Presupposes the worker is an independent contractor in all but name. Labor is a performance metric where boundaries are self-imposed risks.

  **The Unifying Logic: Normative Arbitrage**
  The firm resolves this incompatibility not through philosophy, but through **financialization**. The underlying conception is that labor is a resource to be optimized.
  *   In Tokyo, the firm captures value by leveraging cultural norms of devotion.
  *   In the EU, the firm captures value by maximizing intensity within the 35-hour cap (since they cannot extend the hours).
  *   In the US, the firm captures value by blurring the line between life and work to extract unpaid overtime.

  The institution owes nothing to the *concept* of the worker, only to the *compliance* of the jurisdiction. The "who owes what to whom" is strictly unilateral: the worker owes availability; the firm owes remuneration and legal safety.

  ### 3. Requirements vs. Accommodations

  To understand the firm's true priorities, we must distinguish what its practice strictly requires from what it merely accommodates.

  **Strict Requirements (The Core Theory):**
  1.  **Primacy of Availability:** The expectation that labor demands take precedence over non-work life must remain the default.
  2.  **Quantifiability:** Contribution must be measurable, preferably through input metrics (response time, hours online) rather than solely output, to enforce discipline.
  3.  **Moralization of Work:** The narrative that hard work is a virtue must be maintained to ensure self-discipline where surveillance fails.

  **Merely Accommodated (The Friction):**
  1.  **Legal Caps (EU):** These are treated as external constraints. The firm accommodates them to avoid fines, not because it accepts the philosophical premise that workers have a right to a life outside work.
  2.  **Wellness Programs:** These are accommodations to prevent asset depreciation (burnout). They are permitted so long as they do not challenge the structural causes of stress (e.g., workload).
  3.  **"Unlimited" Vacation:** This is an accommodation to modern recruitment trends. It signals flexibility without costing the firm accrued liability on balance sheets.

  ### 4. Designing a Genuine Leisure-Rights-Based Institution

  A genuinely leisure-rights-based institutional design would reject the instrumental view of rest. It would presuppose that leisure is a **positive entitlement** necessary for human flourishing and democratic citizenship, not merely a tool for labor recovery. This shifts the burden of proof: instead of the employee justifying time off, the employer must justify time *on*.

  Here is what would have to change:

  **A. Measurement of Contribution: From Input to Outcome**
  *   **Abolish Response-Time Metrics:** Surveillance that tracks availability treats the employee as property. A leisure-rights firm measures **value creation**, not presence.
  *   **Asynchronous by Default:** Communication structures must be designed to decouple collaboration from simultaneity. If a task does not require real-time interaction, it should not be scheduled as such.
  *   **Output Caps:** Just as there are hourly caps, there should be output expectations that are realistically achievable within standard hours. Consistently needing overtime to meet goals indicates a resourcing failure, not an employee dedication issue.

  **B. Allocation of Rest: From Discretion to Entitlement**
  *   **Mandatory Minimums, Not Maximums:** Replace "unlimited vacation" with **mandatory minimum leave** (e.g., "You must take 4 weeks, and we will lock your access if you do not"). This treats rest as a non-negotiable maintenance requirement for the human system, removing the guilt of "taking" time.
  *   **Global Floor, Not Local Ceiling:** Apply the highest standard of labor protection globally. If the "right to disconnect" exists in France, it should be a global company policy, not a local compliance exception. This prevents the firm from pitting jurisdictions against each other.
  *   **The Right to Refuse:** Institutionalize a mechanism where employees can refuse non-emergency requests outside of core hours without retaliation. This transforms leisure from a privilege granted by management to a right enforceable by the worker.

  **C. Structural Governance**
  *   **Workload Co-Determination:** Employees should have a formal role in setting workload expectations. If the team agrees a deadline requires overtime, it is a collective choice; if management imposes it, it is exploitation.
  *   **Decoupling Wellness from Productivity:** Wellness initiatives should focus on **boundary enforcement** (e.g., training managers to respect off-hours) rather than **resilience training** (e.g., teaching employees to cope with excessive stress). The former addresses the cause; the latter treats the symptom.

  ### Summary
  The current institutional patchwork presupposes that **labor is the master good** and leisure is its servant. It manages incompatible global norms through arbitrage, treating local labor laws as friction costs rather than moral boundaries. A leisure-rights-based design would invert this: it would treat leisure as a **constitutive element of the good life**, protected by positive entitlements, global standards, and measurement systems that reward output within bounded time rather than availability without limit.
