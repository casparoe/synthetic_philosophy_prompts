          4.  Rights Analysis: Negative vs. Positive rights.
          5.  The Patchwork: Normative Arbitrage.
          6.  Requirements vs. Accommodations.
          7.  The Alternative Design: Concrete changes.

      *   *Refining the "Theory":* I need to make sure I don't just say "capitalism." I need to be specific about the *moral* theory. It's a blend of Protestant Work Ethic (moral) and Taylorism/Human Capital Theory (economic). Let's call it "Extractive Humanism." No, that's too vague. "Compliant Productivism" is better. Or "Instrumental Rest Theory." Let's go with **"Instrumental Recuperation within a Framework of Normative Arbitrage."**

      *   *Refining the "Rights" aspect:* Distinguish between *negative liberty* (freedom from work) and *positive entitlement* (guaranteed time). The prompt asks about positive rights. The current system denies positive rights except where forced by law.

      *   *Refining the "Design":* Needs to be concrete. Response time metrics must go. "Unlimited" must go. Global standards must apply (race to the top, not bottom).

