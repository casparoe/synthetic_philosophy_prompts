  *   Insulation/Qualification: 400
  *   Complaint Test: 400
  *   Conclusion: 200
  Total ~1600. Perfect.

  *(Final check on constraints)*: No citations. Satellite connection acknowledged implicitly by keeping it self-contained. American English.

