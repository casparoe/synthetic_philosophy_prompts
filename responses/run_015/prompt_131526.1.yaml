      *   *Load-bearing:*
          *   Person-Affecting View (PAV) vs. Total/Impersonal View. This is the core engine. It determines how "add-one" and "swap-one" are valued compared to "hold-fixed."
          *   The Non-Identity Problem. This is the specific philosophical hurdle for "swap-one."
          *   The "Causal Horizon" (as the user calls it). We need a cutoff for identity effects, otherwise everything is swap-one.
          *   Aggregation. How to sum different *kinds* of good (existing people's welfare vs. new people's welfare).
          *   Risk/Uncertainty. How to treat the probability of existence vs. quality of life.
      *   *Decoration (for this context):*
          *   Specific theories of welfare (hedonism vs. desire satisfaction). We don't have time to debate this; we use proxies (DALYs, etc.).
