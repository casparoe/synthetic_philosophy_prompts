          *   *Justice/Equity weights:* Important, but complicates the population ethics core. Keep it simple: prioritize the worst off as a tie-breaker or secondary metric.

  3.  **Developing the Procedure:**

      *   *Step 1: The Identity Filter (Causal Horizon).* We need to define when an intervention counts as "swap-one." If the mechanism is direct (IVF, timing of conception via folate), it's swap-one. If it's downstream (cash transfer -> marriage timing), we treat it as hold-fixed/add-one for practical purposes. *Decision:* Set a horizon of "direct biological mechanism vs. downstream social ripple."
      *   *Step 2: The Value of Existence (The Core Dispute).* We need a policy choice here.
          *   Option A: Person-Affecting (Only help existing people).
          *   Option B: Total View (New lives count if good).
          *   Option C: Hybrid (New lives count, but discounted or subject to a quality threshold).
          *   *Recommendation:* Given the board's composition (saving babies vs. vitamins), a Hybrid/Threshold view is most defensible. "New lives count only if above a 'good enough' threshold."
      *   *Step 3: Aggregation.* How to compare DALYs averted (hold-fixed) vs. New Lives (add-one).
          *   Need a conversion factor or a lexicographic order.
          *   *Suggestion:* Lexicographic. Priority to preventing suffering/death for existing children. Then, count new lives if they meet the threshold.
      *   *Step 4: Data Handling.* Use proxies. If data is missing, apply a "uncertainty discount."

  4.  **Addressing the "Swap-One" (Stillbirth) Problem:**

      *   This is the Non-Identity Problem. If a stillbirth is prevented, and the family replaces the child, the *original* child never existed. The *new* child exists.
      *   *Strict Person-Affecting View:* The stillbirth prevention didn't help the *original* fetus (it died or never existed in the counterfactual). It helped the *parents* (grief averted). The *replacement* child would have existed anyway (eventually), just later? Or is it a *different* child?
