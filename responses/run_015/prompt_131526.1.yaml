      *   *If Different Child:* Did we benefit the child? No, because without the intervention, *that specific child* wouldn't exist. Is existence better than non-existence? (The "Asymmetry").
      *   *Honest Truth:* On strict philosophical grounds, preventing a stillbirth that leads to replacement *might* score very low on "benefit to the child" because the alternative for that specific child was non-existence, not a life of suffering. The benefit is to the *parents* (avoiding grief) and potentially the *replacement child* (if they wouldn't have existed otherwise, or if the timing improves their life).
