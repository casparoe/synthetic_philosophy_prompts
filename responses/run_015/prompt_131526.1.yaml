      *   *Rule:* "Direct Mechanism Test." If the intervention *biologically* alters the gamete or conception event (IVF, Folate affecting ovulation timing directly), count as Swap-One. If it alters social conditions (Cash, Bed nets) where identity change is a ripple effect, treat as Hold-Fixed/Add-One for scoring purposes. This stops the "everything is swap-one" paralysis.

