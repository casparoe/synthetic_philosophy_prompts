answer: |-
  First off, solidarity on the 2 AM grind. Cold coffee is the historian's natural habitat.

  Your character is channeling Fernand Braudel, the father of the *Annales School*. To make her sound authentic, you need to nail the specific logic she's using, because Braudel didn't just say "slow = structure." He talked about *layers of time*.

  Here is the breakdown of her logic, the verdicts on your stuck points, and the case that will make her question everything.

  ### 1. The Actual Rule She Is Using
  It is **not** just about speed (fast vs. slow). If it were, Napoleon's winter would make his campaign a "structure."
  Her rule is about **Causality and Agency**.

  *   **Event (*Événement*):** History driven by **Conscious Human Will**. A specific decision, a battle, a treaty. Even if climate interferes (Napoleon), if a General *chose* to march, it is an Event. The human will is the engine; the world is just the terrain.
  *   **Structure (*Longue Durée*):** History driven by **Unconscious Systemic Forces**. Geography, biology, climate, deep cultural habits. Humans are passengers here. They don't choose the soil to dry up (Rome); they don't choose the corn to spread (Maize); they don't choose the volcano to erupt.

  **The Test:** *Could a single person have stopped this by making a different choice on a Tuesday morning?*
  *   **Napoleon:** Yes. He could have stayed in Paris. (Event)
  *   **Rome:** No. One emperor can't fix the soil nitrogen levels. (Structure)
  *   **Constantinople:** Yes. The Emperor could have surrendered earlier, or Mehmed could have turned back. (Event)
  *   **Maize:** No. No single farmer planned the continental shift. (Structure)

  ### 2. The Verdicts on Your Stuck Points

  **The 1815 Tambora Eruption**
  *   **Her Call:** **Structure.**
  *   **Why:** Even though an eruption is a sudden "bang," no human agency caused it, and the *consequence* (The Year Without a Summer, global migration, famine) was a systemic environmental constraint. Unlike Napoleon's winter (which was an obstacle to a human plan), Tambora *was* the plan. It forced humanity to move, not the other way around.
  *   **Nuance:** She might argue it was an "Event that revealed a Structure." The vulnerability of the global harvest was the structure; the volcano was just the hammer.

  **The Printing Press**
  *   **Her Call:** **Structure.**
  *   **Why:** If she focuses on Gutenberg inventing it (1440), that's an Event. But if she focuses on the *spread of literacy, the shift in authority, and the standardization of language* (like the Maize), that is a slow, unconscious structural shift. Given she classified Maize as structural, she must classify the Press as structural. The *invention* is dust; the *literacy* is the bedrock.

  **The Invented Valley (House Orientation)**
  *   **Her Call:** **Ultimate Structure (*Longue Durée*).**
  *   **Why:** This is her holy grail. This is exactly what Braudel meant by *Mentalité*.
      *   No leader (No Agency).
      *   Copying each other (Unconscious habit).
      *   Three centuries (Slower than a human life).
      *   40-degree drift (Geographic/Cultural determinism).
  *   **Character Reaction:** She will love this. She will probably write her magnum opus on this valley. To her, this is "real" history. The fall of empires is just noise compared to the slow rotation of a door hinge over 300 years.

  ### 3. Other Rules That Fit (The "Red Herrings")
  To make her feel real, she should occasionally argue with herself using these secondary heuristics, which mostly work but sometimes fail:

  *   **The "Date-ability" Rule:** Events have dates (1453, 1812). Structures have eras (The Little Ice Age, The Neolithic).
      *   *Fits:* Constantinople (Date), Rome (Era).
      *   *Fails:* Tambora (Has a date, but is structural).
  *   **The "Reversibility" Rule:** Events can be undone or won/lost. Structures are almost immutable.
      *   *Fits:* Napoleon could have won. You can't "un-dry" the Roman soil.
      *   *Fails:* You can't "un-invent" the printing press, but it's arguably structural.
  *   **The "Visibility" Rule:** Events are seen (battles, coronations). Structures are felt (hunger, cold, habits).
      *   *Fits:* The Valley houses are barely visible changes, felt only over generations.

  ### 4. The Case That Splits Them (The Conflict)
  If you want to create tension in her worldview, introduce **The Black Death (1347–1351)**.

  *   **Why it breaks her:**
      *   **Biological/Environmental:** Like Rome and Maize, it's a non-human force (bacteria/fleas). By her rule, it should be **Structure**.
      *   **Speed/Impact:** It arrived suddenly and killed half of Europe in a few years. It feels like a Battle or a Siege. It feels like an **Event**.
      *   **Agency:** It stopped human plans (wars ended because everyone died), but humans spread it via trade routes (Agency).
  *   **The Drama:** This is where she gets stuck at 2 AM with cold coffee. Is the Plague a "biological event" or a "demographic structure"? If she calls it an Event, she undermines her theory on Rome. If she calls it a Structure, it moves too fast.
  *   **Alternative Splitter:** **The Industrial Revolution.** Was it Watt's engine (Event/Man) or a century of slow coal accumulation (Structure/Nature)?

  ### Writing Tip for Her Voice
  When she talks, have her dismiss "Great Men."
  *   *Normal Historian:* "Napoleon lost because he underestimated the winter."
  *   *Her:* "Napoleon is irrelevant. The caloric intake of the average French conscript versus the thermal resistance of the Russian steppe is the story. Napoleon is just the name we give to the statistical anomaly."

  For the Valley, have her get excited. "Finally! History without a name!"

  Good luck with the draft. Drink fresh coffee.
