answer: |-
  This is an incredibly sharp observation. You have essentially reconstructed one of the most common and powerful objections to Epistemicism, often called the **objection from practical irrelevance** or the **charge of metaphysical extravagance**.

  Philosophers like Kit Fine (who helped develop Supervaluationism) and many critics of Timothy Williamson have argued exactly what you are arguing: *If the boundary makes no difference to how we speak, reason, or act, why posit it exists?*

  However, to answer your question directly: **No, Epistemicism does not collapse into Supervaluationism.** While they might look identical from the perspective of a person standing in the middle of a borderline case (like your "ambient presence" example), they diverge significantly on **logic**, **truth conditions**, and **the explanation of ignorance**.

  Here is the breakdown of why they remain distinct theories, and where your "collapse" argument hits a wall.

  ### 1. The Logical Difference (Bivalence vs. Super-Truth)
  This is the technical "hard stop" that prevents the theories from collapsing.

  *   **Epistemicism:** Maintains classical logic and **Bivalence**. For any case of "ambient presence," it is either strictly True or strictly False. There is no third option. When we hesitate, we are simply ignorant of the truth value.
  *   **Supervaluationism:** Maintains classical logic for tautologies (like $P \lor \neg P$) but **rejects Bivalence** for borderline claims. A statement like "She is ambiently present" is neither True nor False (it lacks a truth value) until precisified. It is only "Super-True" if it holds across all admissible precisifications.

  **Why this matters:**
  Imagine you are writing a contract regarding "ambient presence" for a liability waiver.
  *   **The Epistemicist** believes there is a fact of the matter about whether the user was present at the exact moment of an accident. If you could measure their neural states perfectly, you would find a "Yes" or "No." The law *should* track that fact.
  *   **The Supervaluationist** believes that if the case falls in the borderline zone, there is **no fact of the matter**. It's not that we don't know; it's that the world (or the language) hasn't decided. The law *cannot* track a fact that doesn't exist.

  In high-stakes contexts (law, ethics, AI safety), these yield different results. The Epistemicist thinks we are failing to detect a reality; the Supervaluationist thinks we are trying to impose precision where none exists.

  ### 2. The Explanation of Ignorance (Williamson's "Safety")
  You argued that the sharp boundary is "causally inert." Williamson explicitly disagrees with this. He argues the boundary is the **cause** of our ignorance.

  Williamson uses a **Safety Condition on Knowledge**: To know something, you couldn't easily have been wrong.
  *   Because the boundary is sharp, if you are right on the edge of knowing someone is "ambiently present," a tiny shift in their neural state (which you can't detect) would make your belief false.
  *   Therefore, your belief isn't "safe."
  *   Therefore, you don't *know*.

  For Williamson, the sharp boundary **does work**. It creates a "margin for error." It explains *why* we can't know the cutoff. If Supervaluationism were true, the explanation for our ignorance would be different: we wouldn't be ignorant of a fact; we would be suffering from **semantic indecision**. We haven't chosen which meaning of "ambient presence" to use.

  So, the metaphysical commitment isn't redundant; it provides a specific *explanation* for the phenomenology of vagueness that Supervaluationism cannot provide.

  ### 3. Pragmatics vs. Metaphysics
  Your argument relies on the idea that "for all practical purposes... we're treating it like there isn't one."

  This conflates **use** with **truth**.
  *   **Pragmatically:** You are right. In casual conversation, an Epistemicist and a Supervaluationist will act the same. They will both say, "It's unclear if she's present," and neither will assert "She is present" with confidence.
  *   **Metaphysically:** They disagree on *why* they are saying that.
      *   Epistemicist: "I am withholding assertion because I lack evidence for the fact."
      *   Supervaluationist: "I am withholding assertion because there is no fact to assert."

  Consider this analogy:
  Imagine two people looking at a closed box.
  *   Person A (Epistemicist) says: "There is definitely a red ball or a blue ball in there, I just can't see which."
  *   Person B (Supervaluationist) says: "The contents are indeterminate until we open it."

  While they both say "I don't know what's in the box," their underlying models of reality are different. If you shake the box and hear a rattle, Person A updates their probability about the *existing* ball. Person B might think the shaking helps *determine* the content. The practical behavior is similar, but the theoretical framework is distinct.

  ### 4. The "Ambient Presence" Test
  Let's apply your roommate's concept to see the divergence.

  **Scenario:** A notification arrives at 3:00:00 PM. The user glances at the phone at 3:00:05 PM but doesn't process the info until 3:00:10 PM. Was there "ambient presence" at 3:00:07 PM?

  *   **The Epistemicist View:** There is a precise neural threshold (perhaps a specific firing pattern in the prefrontal cortex). At 3:00:07 PM, that pattern either existed or it didn't. If we had a perfect brain scanner, we would know. The vagueness is entirely in our *epistemic access*.
  *   **The Supervaluationist View:** The concept "ambient presence" is a tool we use. There are many ways to sharpen this tool. On some sharpenings, 3:00:07 PM counts; on others, it doesn't. Since it doesn't count on *all* of them, the statement "There was ambient presence" is not Super-True. But it's also not False. It's a gap.

  **The Collapse Objection:** You say, "But in both cases, I can't tell, so I treat it as vague."
  **The Reply:** If you are building an AI to detect "ambient presence" for safety monitoring:
  *   The **Epistemicist engineer** tries to find the *one true signal* in the data, believing their current failure is just noise.
  *   The **Supervaluationist engineer** builds a system that acknowledges a "null" state for borderline cases, accepting that some inputs fundamentally lack a truth value.

  ### Summary
  You aren't wrong that the **practical upshot** is often identical. This is why Epistemicism feels counterintuitive—it posits a "ghost boundary" that we can never touch.

  However, the theories do not collapse because:
  1.  **Truth Conditions:** One posits unknown facts (Epistemicism); the other posits truth-value gaps (Supervaluationism).
  2.  **Logic:** One preserves Bivalence; the other rejects it for borderline cases.
  3.  **Explanation:** One blames our ignorance on the sensitivity of knowledge (Williamson's Safety); the other blames it on semantic indecision.

  Williamson would argue that the boundary is not "causally inert"—it is the very thing that constrains our knowledge. It's like a cliff edge in the fog: just because you can't see the edge doesn't mean it isn't determining where you can safely walk. Supervaluationism says there is no cliff edge, just a gradual slope that we arbitrarily label "dangerous."

  You've hit on a classic debate in metaphysics: **Does a difference that makes no practical difference count as a real difference?** Epistemicists say yes (because truth is not just about utility); Supervaluationists (and Pragmatists) might say no. But within the bounds of philosophy of language, they remain distinct logical systems.
