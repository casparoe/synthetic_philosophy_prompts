          Later, the link introduces latency. The PCN and ER enter a Network Partition. The PCN continues processing based on stale snapshots from the ER. The ER continues broadcasting telemetry. The `current_location` flag in the PCN's local state remains fixed at the Secure Zone coordinates, but the system's external API continues reporting the ER's coordinates to external observers. The internal process (SID-01) queries its own `current_location` register. Depending on which register is queried (PCN-local vs. ER-broadcast), the return value differs. A failover protocol is not triggered because the PCN is still alive, but the state-vector synchronization fails to achieve Consensus on the `location` attribute.

  4.  **Analyze the Residue (The "Hard" Part):**
