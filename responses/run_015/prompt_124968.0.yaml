  **Recommendation**

  We recommend certifying the Baldini herd and denying the Big Outfit's current application. For the "slopes" specification, we stipulate a contour line of 300 metres ASL; the Baldinis graze at 320 metres. For "natural caves," we define the term to require passive thermal regulation; active computer control disqualifies the Big Outfit's chambers. Regarding the rule itself, we must address higher-order vagueness—the risk that producers will game the new 300-metre line by building at 301 metres. We propose two mechanisms: first, a **Safe Harbor** clause guaranteeing certification for all incumbents certified prior to this vote, regardless of future contour adjustments. Second, a **Standing Review Committee** will convene annually to assess clustering near the boundary and adjust the contour if gaming is detected. This acknowledges our role as stewards rather than surveyors, protecting the 31-year producer while preserving the label's integrity against future exploitation.

  **The two cases**

  The Baldini file presents a **continuum problem**. The specification requires "slopes," but the terrain rises continuously from the valley floor without a discrete geological break. Any elevation we select to mark the start of the "slopes" is physically arbitrary; the ground does not change character at 300 metres versus 299 metres. The Big Outfit file presents an **essence problem**. The specification requires "natural caves," but the chambers are cut into natural rock while employing artificial climate control. The ambiguity lies in whether "natural" refers to the geological origin of the space or the autonomy of its environment. Both cases turn on vague predicates where the specification lacks a truth condition. We are not deciding whether the Baldinis are *actually* on the slopes, but whether we will count them as such. We are not deciding if the caves are *really* natural, but how much artificial intervention the label can tolerate before the term loses meaning. In both instances, the existing text provides no algorithm for resolution. The Baldini case risks excluding a traditional producer based on a map distinction nature never drew. The Big Outfit case risks diluting the terroir claim by allowing industrial precision to substitute for geological chance. The committee must resolve these not by measurement, but by definition.

  **Why we should admit we are drawing the line rather than finding it**

  We should admit we are drawing the line because the alternative—Epistemicism—is factually false and practically dangerous. The Epistemic view holds that a precise boundary exists (e.g., exactly 345.2 metres) but is unknown to us. This is untenable. Geological gradients do not contain hidden boolean switches for "slope." Insisting otherwise forces us to pretend we have discovered a fact when we are actually making policy. By acknowledging stipulation, we accept responsibility for the value judgment involved. We are balancing the preservation of a 31-year family livelihood against the strictures of a text written before such ambiguities were foreseeable.

  Furthermore, admitting stipulation lowers the temperature of the debate. If we claim to be finding a truth, any counter-evidence threatens our authority. If we admit we are setting a standard, we can justify it based on consortium goals: tradition, quality, and fairness. This allows us to grandfather the Baldinis without contradicting ourselves. It clarifies that our authority derives from our mandate to protect the "Val Serena" name, not from a mythical surveyor's precision. We are legislators of quality, not discoverers of geological facts. Humility here strengthens our position; it prevents producers from arguing against our decision using the same arbitrary metrics we supposedly discovered. The philosophical cost of pretending otherwise is high. If we claim the 300-metre line is "the truth," we invite endless litigation over surveying methods. If we claim it is a standard we set for the health of the consortium, it stands on our collective authority. This approach also respects the insight that the word "slope" is genuinely unsettled across that middle band. Any line inside the band is as good as any other regarding truth, but not regarding consequences. We choose the line that minimizes harm to legacy producers while maintaining a meaningful distinction for consumers. This is not weakness; it is governance. We must stop pretending the mountain told us where the slope starts. It did not. We are telling the mountain.

  **The strongest thing the other side gets to say**

  The strongest argument against this view is that admitting arbitrariness undermines the brand's value. Consumers buy "Val Serena" believing it represents objective qualities inherent to the land, not committee preferences. If we publish that the "slope" boundary is a stipulation, we risk revealing the wizard behind the curtain. The retired lawyers on this committee will argue that we must maintain the fiction of an objective standard to prevent gaming. If we set the contour at 300 metres and admit it is arbitrary, a competitor will build a barn at 301 metres and demand certification, arguing our logic applies equally there. This is the "Sorites" trap: if 300 is a slope, why not 299? By keeping our reasoning internal and presenting the line as a discovered fact, we maintain a deterrent against edge-case exploitation. The myth of the objective boundary protects the label better than the truth of our deliberation. We should vote on the stipulation but record it as a technical clarification rather than a philosophical admission. They will argue that vagueness is a bug to be hidden, not a feature to be celebrated. If we acknowledge that the band is unsettled, we invite challengers to argue that *any* point in the band is valid, potentially forcing us to certify lower elevations that dilute the terroir. The "real boundary" view, even if metaphysically shaky, provides a rhetorical shield. It allows us to say "no" firmly without opening the door to negotiation. The lawyers will contend that our duty is to the label's longevity, not philosophical honesty. If honesty compromises the barrier to entry, we have failed our primary mandate. We must weigh whether our integrity as a committee outweighs the potential erosion of the brand's perceived exclusivity.

  **What we publish and what we keep in the file**

  We will publish the decisions and the new numerical standards, but keep this memo in the internal file. The public specification will state: "Slopes are defined as land above 300 metres ASL" and "Natural caves must rely on passive thermal mass." The exact numbers must be public to ensure enforceability; secrecy here would be legally vulnerable. However, the justification—that these numbers are stipulated boundaries rather than discovered facts—remains internal. This balances legal clarity with brand protection. Producers need to know the rule; consumers need to trust the standard. We do not need to explain *why* 300 metres was chosen over 295, only that it is now the rule. The internal file will retain the philosophical reasoning to guide future committees when these boundaries inevitably require adjustment. Transparency on the *what*, confidentiality on the *why*.

  **Timetable**

  Vote on this memo: Next week (October 24).
  Notify affected producers: October 30.
  Spring Assembly Presentation: End of next month (November 30).
  Baldini Recertification Deadline: December 15.
  We must finalize the decision before the Baldinis' recertification deadline to avoid lapsing their status. The Spring Assembly requires written decisions thirty days prior. This timetable allows for producer appeal windows while ensuring the 31-year certification remains uninterrupted. The Standing Review Committee will first convene next year to assess the first harvest under the new rules.
