  ### Decomposed Credence: Macro-Institutional Cyclicity

  **(1) Likelihood constitutional anacyclosis operates outside Greek poleis: 30%**
  *Justification:* Polybius's specific six-stage mixed-constitution loop is historically idiosyncratic and rarely replicates in large-scale imperial or modern bureaucratic states.

  **(2) Likelihood asabiyyah decay generalizes beyond tribal-state context: 65%**
  *Justification:* Modern cliodynamics (e.g., Turchin) successfully maps elite cohesion and popular immiseration dynamics onto modern secular cycles despite the lack of kinship ties.

  **(3) Likelihood linear-progressive narratives fail descriptively: 80%**
  *Justification:* The archaeological and historical record demonstrates repeated, systemic losses of socio-political complexity that progress narratives cannot absorb without ad hoc exceptionalism.

  **(4) Likelihood contingent-event models explain clustering without cycles: 45%**
  *Justification:* While contagion explains some synchronization, purely exogenous shock models struggle to account for the endogenous structural vulnerabilities present prior to clustered collapses.

  ***

  ### Overall Credence: 52%
  *Synthesis:* While the failure of linear narratives (3) and the weakness of pure contingency (4) clear the field for structuralism, the specific mechanism remains contested; the credence leans slightly toward cyclical dynamics because *asabiyyah*-like cohesion erosion (2) offers a robust trans-historical driver, even if Polybian constitutionalism (1) does not.

  ### Dominant Term
  **Term (3) [Linear-Progressive Failure]** dominates the final credence because it acts as the necessary gatekeeper; if institutional entropy were not systematically underweighted by progress models (i.e., if history were genuinely linear), the prior probability of cyclical decline would collapse to near zero regardless of the other factors.

  ### Decisive Comparative Case Study
  **The durability of the Post-1945 Liberal International Order vs. the Warring States Period.**
  A rigorous comparison of whether modern institutional complexity (global trade, nuclear deterrence, bureaucratic welfare) dampens the *asabiyyah* decay cycle seen in pre-modern multipolar systems (like China's Warring States) would most shift the credence; if the current order fractures along predicted elite-overproduction lines, credence rises sharply, but if it stabilizes through institutional adaptation, the cyclical hypothesis is significantly weakened.
