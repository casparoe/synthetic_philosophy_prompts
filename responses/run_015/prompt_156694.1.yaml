      Also, ensure the "Trainer" aspect is clear. The prompt says "put cases to a trainer." I will interpret this as the Facilitator acting as the Oracle. Students propose features or vote on projected cases. Voting on projected cases is smoother for 16 people. I will frame it as "Testing the limits."

      *Wait, one nuance:* "They can only put cases to a trainer and get a yes or no back."
      If I just show slides, they aren't "putting cases."
