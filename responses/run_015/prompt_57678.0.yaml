answer: |-
  This is a superb observation. You have identified a fissure in the jurisprudence of natural resources that most practitioners treat as mere boilerplate. The tension you describe—between the *rule of capture* (no ownership in place) and *unitization* (allocation as if there were ownership in place)—is not just a legal workaround; it is a philosophical pivot point.

  Here is a reconstruction of the implicit theory of property, fairness, and governance baked into the unitization regime, along with the counterfactuals you requested.

  ### 1. The Property Theory: From *Corpus* to *Spes* to *Value*

  You ask which commitment is real and which is window dressing: the rule of capture (no ownership) or the unitization formula (ownership slices). The answer is that unitization presupposes a **theory of property as value-preservation rather than physical dominion.**

  Under the pure rule of capture, property is defined *negatively*: it is a liberty right to act (drill) without liability for consequences (drainage). This is a Hobbesian state of nature regarding the *corpus* (the oil itself). Unitization does not contradict this ontology; it bypasses it. It treats the mineral interest not as a right to specific molecules (*in rem*), but as a **right to a share of the economic value generated by the reservoir as a whole.**

  **The Implicit Theory:**
  The practice presupposes that the *reservoir* is the primary ontological unit, not the *tract*.
  *   **The Contradiction Resolved:** It is not self-contradictory if you view the "ownership in place" used for unitization formulas as a **legal fiction for allocation**, not a metaphysical claim. The law says: "You do not own the oil (Rule of Capture), but you own the *opportunity* to recover it. However, because exercising that opportunity individually destroys the value of the opportunity for everyone (via pressure loss), we will convert your *opportunity right* into a *proceeds right*."
  *   **The Coercion:** The ability to bind a dissenter reveals that the underlying property right is **conditional**. Your right to capture is contingent on not destroying the common source of supply. When individual exercise threatens the total utility of the resource, the state (via statute) elevates the *correlative rights* of the other owners above your liberty to drill.

  **Verdict:** The "no ownership in place" rule is the default baseline (the state of nature); the unitization formula is the **social contract** that supersedes it. The "ownership" allocated in a unit is not ownership of oil, but ownership of *revenue streams* derived from a cooperative enterprise.

  ### 2. The Fairness Question: Ex-Ante Expectation vs. Ex-Post Reality

  You ask whether the fairness view is proportional endowment or ex-ante agreement. Unitization is structurally committed to **Ex-Ante Risk Allocation.**

  *   **The Formula:** The "tract participation factor" is usually based on surface acreage or *estimated* hydrocarbon volume at the time of signing. As you noted, this sticks even when the geology is revised.
  *   **Why?** If percentages were adjustable based on new data, every unit would become a perpetual litigation engine. Every time a well came up dry, the owner would claim the model was wrong and demand a re-share.
  *   **The Fairness View:** This is a **Rawlsian Veil of Ignorance** applied to geology. The system assumes that at the moment of unitization, no one knows exactly where the oil is. Therefore, fairness is defined as agreeing to a distribution rule *before* the uncertainty is resolved.
  *   **Bad Luck vs. Injustice:** If Tract A turns out to have no oil but gets 10% of the production because the model said it did, Tract B (which has all the oil) has no claim of injustice. They signed up for a risk pool. The system treats geological uncertainty as a **common risk** to be socialized, not an individual burden.
  *   **Whose Losses?** You asked whose losses are tracked when "waste" is cited.
      *   *Private Loss:* Reduced recovery for the owners.
      *   *Public Loss:* The State (as *parens patriae*) claims an interest in the conservation of natural resources. "Waste" is a statutory term of art that includes physical waste (loss of pressure) and economic waste (unnecessary capital expenditure).
      *   *The Maximand:* The system maximizes **Total Recoverable Value (Social Utility)** subject to a constraint of **Stable Expectations**. It sacrifices precise corrective justice (giving everyone exactly what is under their land) for distributive stability (locking in shares so production can begin).

  ### 3. Governance: Why It Isn't a Commons or a Leviathan

  You correctly sense this doesn't fit the standard Tragedy of the Commons menu.

  *   **Not a Leviathan:** The state does not own the oil (in Texas/private mineral states). It does not operate the wells. It does not take the profit (except via tax/royalty). It merely provides the **coercive enforcement mechanism** for the private contract.
  *   **Not Straight Privatization:** The rule of capture is a form of privatization, but unitization negates the exclusivity essential to private property. You cannot exclude others from "your" oil; you are forced to share infrastructure and proceeds.
  *   **Not an Ostrom-style Self-Governing Commons:** Elinor Ostrom's commons rely on voluntary association, monitoring by peers, and graduated sanctions within a community. Unitization relies on **statutory compulsion**. The "minority binds" rule is the antithesis of the voluntary exit rights central to common-pool resource management.

  **The Classification:** This is a **Statutorily Enforced Private Consortium.**
  It is a hybrid where the state provides the "constitution" (the pooling statute) that allows private actors to override individual veto rights for the sake of aggregate efficiency. It treats the oil field as a **natural monopoly** that requires unitary management, but leaves the equity ownership in private hands.

  ### 4. Underdetermination: Necessary vs. Comfortable

  Where is the practice philosophically underdetermined? Where could the theory change without changing the paperwork?

  *   **Necessary (Strictly Required by the Logic):**
      1.  **Unitary Management:** One operator is required. You cannot have unitization with competing operators (pressure conflicts).
      2.  **Allocation Formula:** There must be a fixed key for dividing proceeds, or the consortium collapses into accounting warfare.
      3.  **Anti-Holdout Mechanism:** There must be a way to bind dissenters, or the "prisoner's dilemma" of the rule of capture re-emerges (one holdout can demand ransom to join, blocking the efficiency gain).

  *   **Comfortable (Underdetermined/Contingent):**
      1.  **The Allocation Metric:** The system *needs* a formula, but it doesn't *need* to be acreage-based. It could be purely auction-based (owners bid for shares) or flat-equal. The choice of "acreage" or "volumetric estimate" is a pragmatic heuristic, not a philosophical necessity.
      2.  **Permanence:** The percentages *could* be adjustable. The fact that they are fixed is a choice to prioritize **finality over accuracy**. A different theory of fairness (corrective justice) would demand adjustable shares; the current theory (contractual stability) demands fixed shares.
      3.  **The Threshold:** Why 75%? Why not 51% or 90%? This is a political trade-off between efficiency and property protection, not derived from the nature of oil itself.

  ### 5. Counterfactuals: Swapping the Presupposed View

  If we changed the underlying philosophical commitment, here is what would concretely change on the ground:

  **Scenario A: Drainage is a Tort (Strict Ownership in Place)**
  *   *Theory:* You own the oil under your land like you own the water in a tank. If I pump it from my side, I have stolen from you.
  *   *Concrete Change:* Unitization becomes voluntary and litigious.
      *   No compulsory pooling. If I refuse to join, you simply cannot drill near my line without risking a lawsuit for trespass/conversion.
      *   Fields would be fragmented. Operators would drill "protective wells" right on the property line to establish a defense against drainage claims.
      *   **Result:** Massive physical waste (redundant wells), lower total recovery, high litigation costs. This was essentially the pre-1900s common law regime that led to the rule of capture (courts abandoned "ownership in place" because it was unenforceable).

  **Scenario B: The Reservoir is Commonly Owned (State/Public Trust)**
  *   *Theory:* The oil belongs to the people (or the state). Private owners only have a leasehold or a royalty interest, not a determinable fee.
  *   *Concrete Change:* The "owners" you work with disappear.
      *   The state (or a public corporation) is the sole operator.
      *   Private "mineral rights" are converted into tax claims or fixed royalties.
      *   Unitization is internal management, not contract negotiation. There is no need to "bind a dissenter" because there are no private dissenters with operational rights.
      *   **Result:** This is the model in most of the world (e.g., Mexico, Saudi Arabia, Norway). It eliminates the transaction costs of unitization but removes the private incentive for rapid exploration.

  **Scenario C: The "True Commons" (Ostromian)**
  *   *Theory:* The owners are a self-governing community without state coercion.
  *   *Concrete Change:* No compulsory statutes.
      *   If one owner refuses to unitize, the others cannot force them. They must bribe them or drill around them.
      *   Social sanctions (shaming, exclusion from future deals) replace legal force.
      *   **Result:** This works in small, tight-knit communities (like a single family owning a field) but fails in West Texas where ownership is fragmented among hundreds of absentee heirs and speculators. The transaction costs of voluntary agreement exceed the value of the oil.

  ### Summary for your Dissertation

  The practice of unitization presupposes a **Pragmatic Utilitarianism constrained by Contractual Formalism.**
  1.  **Ontology:** Oil is a fugitive resource that defies individual ownership; therefore, property rights are rights to *value*, not *things*.
  2.  **Fairness:** Fairness is *ex-ante procedural agreement*, not *ex-post substantive accuracy*. Stability of title is valued higher than geological precision.
  3.  **Authority:** The state acts not as owner, but as the **enforcer of the cooperative equilibrium**, using coercion to solve the Prisoner's Dilemma that the Rule of Capture creates.

  The "contradiction" you see is the friction between the **19th-century liberal individualism** of the Rule of Capture (negative liberty) and the **20th-century regulatory pragmatism** of Unitization (positive coordination). The paperwork smooths this over by treating the mineral deed as a stock certificate in a forced corporation, rather than a deed to a plot of land.
