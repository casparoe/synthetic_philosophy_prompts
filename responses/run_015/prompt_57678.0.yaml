prompt: |-
  So I'm a philosophy PhD student and I've spent the summer helping my uncle, who does mineral title and land work in west Texas, and I've gotten weirdly obsessed with how oil fields get "unitized." Let me describe the practice, then ask the thing I actually care about.

  Background as I understand it. Under the rule of capture, oil and gas in the ground aren't really anybody's: you own what you bring to the surface, even if it migrated over from under your neighbor's tract, and pumping your neighbor dry isn't a tort. Some states go further and say you have no ownership in place at all, just an exclusive right to try to capture. Obviously that sets off a race — everyone drills as many wells as fast as they can, which blows off the reservoir pressure and strands a huge fraction of the oil down there forever. So where the field is one continuous body lying under dozens of tracts, the fix is a unit: all the owners and lessees form a single entity, one operator drills and pumps on everybody's behalf, and each tract gets a fixed percentage of all production — a percentage computed mostly from estimates of how much recoverable oil sits under that particular tract, not from where the wells are or who paid for them. In alot of states, if enough of the interest owners sign on, the unit binds the ones who refused. And the percentages basically stick for the life of the field, even though the reservoir model underneath them gets revised constantly afterwards.

  So: what theory of property does this practice actually presupose? To me it looks flatly self-contradictory. The formal law says nobody owns the stuff in place and you keep what you catch; the unit agreement then hands every owner a permanent slice of the whole reservoir, calculated as though they did own what lies under their own land. And a scheme built out of individual property rights lets a majority override a dissenter's refusal to join. Which of those is the real commitment and which is window dressing?

  Then I want the fairness question pulled apart too. What view of fairness is baked into the fixed-percentage formula — that people are owed a share proportional to their endowment, or that they're owed the terms they'd have accepted before anyone knew how the geology would turn out, with the later disappointment being bad luck rather than injustice? And what's the good being maximized here: total barrels recovered, or each owner's position? Notice the practice calls over-drilling "waste" but never seems to call leaving the oil in the ground a loss anyone has standing to complain about — whose losses is it even tracking?

  Reconstruct the implicit theory as carefully as you can. Tell me which rival views it rules out — it's clearly not the standard tragedy-of-the-commons menu of either a Leviathan or straight privatization, but I don't think it's a self-governing commons either, and I want to know why not. Separate what the practice strictly needs from what merely fits it comfortably, flag the places where it's philosophically underdetermined so that several theories would license exactly the same paperwork, and finish by telling me what would concretely have to change on the ground if we swapped the presupposed view out — say for one where drainage really is a wrong with a victim, or one where the reservoir counts as commonly owned rather than as a bundle of private claims.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy PhD student. This means they want rigor, precision, conceptual clarity, and engagement with existing literature (implicitly or explicitly). They are not looking for a basic summary of oil law but a philosophical reconstruction of the *normative commitments* underlying the practice of unitization.
      *   **Context:** They spent the summer working in mineral title/land work in West Texas. They have practical knowledge of the mechanics (rule of capture, unitization, pooling, percentages, compulsory joining).
      *   **Core Question:** What theory of property does unitization presuppose? Is it self-contradictory (ownership in place vs. rule of capture)? What view of fairness is baked in (endowment vs. ex-ante agreement)? What good is being maximized (total recovery vs. individual position)?
      *   **Specific Tasks:**
          1.  Reconstruct the implicit theory of property.
          2.  Identify rival views it rules out (and why it's not standard tragedy-of-the-commons solutions).
          3.  Separate necessary conditions from comfortable fits (underdetermination).
          4.  Explain concrete changes if the presupposed view were swapped (e.g., drainage as tort, common ownership).

  2.  **Deconstruct the Phenomenon (Unitization):**
      *   *Legal Baseline:* Rule of Capture (non-ownership in place, fugitive resource).
      *   *Problem:* Race to the bottom, physical waste (pressure loss), economic waste (redundant infrastructure).
      *   *Solution:* Unitization (contractual + statutory).
      *   *Mechanism:* Tracts pooled, single operator, production shared by formula (tract participation factor).
      *   *Coercion:* Compulsory pooling/unitization (majority binds minority).
      *   *Permanence:* Percentages stick despite new geological data.

  3.  **Address the "Contradiction" (Property Theory):**
      *   *Surface Contradiction:* Law says "no ownership in place," but unitization treats tracts *as if* they own a slice of the whole.
      *   *Resolution:* It's not a contradiction of *ontology* (what oil *is*), but of *entitlement structure*. It shifts from a *right of action* (capture) to a *right of value* (participation).
      *   *Theory:* It's a **Correlative Rights / Anti-Waste Doctrine** hybrid. It treats the reservoir as a *single physical unit* that demands unitary management, but respects surface boundaries as *claims on value*, not claims on specific molecules.
      *   *Key Concept:* "Ownership in place" is a fiction used for allocation, not a metaphysical claim. The property right is in the *opportunity to recover*, which is converted into a *right to proceeds*.
      *   *Coercion:* Why bind the dissenter? Because the dissenter's exercise of their "rule of capture" right destroys the value of everyone else's "opportunity to recover." It's a harm principle application.

  4.  **Address the "Fairness" Question:**
      *   *Formula:* Based on "recoverable oil under the tract" (ex-ante estimate).
      *   *View:* **Lockean Labor/Endowment mix?** No, because you don't own the oil. **Rawlsian Veil of Ignorance?** Closer. It's about *ex-ante fairness* assuming perfect information is impossible.
      *   *Lock-in:* Why stick with old percentages? Stability > Precision. It prevents rent-seeking via new data.
      *   *Fairness View:* **Procedural Fairness / Risk Allocation.** You own the *risk* of what's under your land, but the *community* manages the extraction. It's not strict proportionality to actual molecules (impossible to know), but proportionality to *geological probability*.
      *   *Good Maximized:* **Total Social Utility (Recovery)** constrained by **Pareto Improvement (mostly)**. It prioritizes "preventing waste" (societal good) over "absolute freedom to drill" (individual liberty).

  5.  **Address the "Commons" Classification:**
      *   *Not Leviathan:* State doesn't own it; state just facilitates/compacts.
      *   *Not Straight Privatization:* Rule of capture is privatization of the *act*, but unitization negates the *exclusivity*.
      *   *Not Ostrom-style Self-Governing Commons:* Because of the *compulsory* aspect (state force binds minority). Ostrom relies on voluntary exit/entry and social sanctions. Unitization relies on statutory coercion.
      *   *Classification:* **Statutorily Enforced Private Consortium.** It's a forced contract.

  6.  **Address Underdetermination (Necessary vs. Comfortable):**
      *   *Necessary:* Single operator (to stop pressure loss), Allocation formula (to distribute value), Coercion (to stop holdouts).
      *   *Comfortable (Underdetermined):** The specific allocation formula (acreage vs. volumetric), the threshold for coercion (50% vs. 75%), the permanence of the % (could be adjustable).
      *   *Philosophical Gap:* Is the right to oil a right to *wealth* or a right to *physical resource*? The practice treats it as wealth.

  7.  **Address Counterfactuals (Swapping the View):**
      *   *Scenario A: Drainage is a Tort (Ownership in Place).*
          *   Change: No rule of capture. If I drain you, I pay you.
          *   Result: Unitization unnecessary or different. Litigation replaces administration. High transaction costs.
      *   *Scenario B: Common Ownership (State/Public).*
          *   Change: State leases blocks, keeps revenue.
          *   Result: No private mineral owners. Royalties go to public treasury. Unitization is internal management, not contract between owners.

  8.  **Drafting the Response (Iterative refinement for tone and depth):**
      *   *Tone:* Academic, precise, respectful of the user's expertise. Avoid oversimplification. Use philosophical terminology (ontology, normative, deontic, veil of ignorance).
      *   *Structure:* Follow the user's prompt structure (Property Theory, Fairness/Good, Commons Classification, Underdetermination, Counterfactuals).
      *   *Refining the Property Theory:* Use the distinction between *corpus* (the stuff) and *spes* (the hope/right to try). Unitization converts *spes* into a *chose in action* (right to proceeds). This resolves the "contradiction."
      *   *Refining Fairness:* Focus on the "Ex-Ante vs. Ex-Post" distinction. The system locks in ex-ante expectations to prevent ex-post gaming.
      *   *Refining Commons:* Emphasize the *state's role* as the enforcer of the "constitution" of the unit. It's a "Constitutional Property" model.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "whose losses" question?
      *   *Correction:* Need to explicitly state that "waste" is defined societally (loss to the public of a finite resource), not just individually. The state has standing as *parens patriae* for the resource.
      *   *Check:* Did I distinguish Texas specifically?
      *   *Correction:* Texas is actually unique; it *doesn't* have compulsory unitization for oil (only gas spacing/pooling in some contexts, and forced pooling for minerals in some states like OK/ND). Wait, the user said "West Texas" and "if enough... bind the ones who refused." In Texas, compulsory *pooling* for drilling units exists under Railroad Commission rules for spacing, but full *unitization* (for secondary/tertiary recovery) often requires 100% or relies on specific statutes. I should acknowledge the variation but stick to the *philosophical structure* of the practice as described by the user (assuming the compulsory aspect holds for the sake of the argument, as it does in many jurisdictions). *Correction:* Actually, Texas Railroad Commission can force pooling for spacing (40 acres), but full field unitization usually requires high voluntary agreement. However, the *philosophical point* holds for jurisdictions that do force it (like Oklahoma or federal units). I will treat the "compulsory" aspect as part of the *ideal type* the user is observing, noting the legal nuance where relevant.
      *   *Refinement:* The user says "In a lot of states... binds the ones who refused." I will accept this premise as the phenomenon to be analyzed, even if Texas is stricter on full unitization. The philosophical tension exists regardless of the threshold.

  10. **Final Polish:** Ensure the distinction between "Rule of Capture" (law of the wild) and "Unitization" (law of the community) is framed as a transition from negative liberty to positive entitlement.

  *(Self-Correction on Texas Law)*: I need to be careful not to contradict the user's experience. They worked in West Texas. They say "In a lot of states... binds the ones who refused." They might be conflating *pooling* (spacing units) with *unitization* (field-wide EOR). In Texas, compulsory *pooling* exists to prevent waste via spacing. Compulsory *unitization* is rarer. I will address this distinction briefly but focus on the *logic* of the practice they are describing, as the philosophical implications are the same. The "contradiction" they spot is real regardless of the specific statutory threshold.

