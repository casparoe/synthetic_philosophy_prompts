  4. **Apply to Murderer.** Lying instrumentalizes the murderer's rationality to save your friend. It violates their status as an end-in-itself, regardless of intent. *Defuses "he's an idiot/rigid."*

  **End-Check Question:** "If lying to the murderer successfully saves your friend, exactly how does that act treat the murderer's rational nature as a mere means rather than an end?"

  This ensures they grasp that the wrong isn't the consequence, but the structural manipulation of agency required to make the lie work.
