answer: |-
  **MEMORANDUM**

  **TO:** Acquisitions and Ethics Committee, Special Collections Library
  **FROM:** Subcommittee on Archival Ethics and Community Stewardship
  **DATE:** October 1, 2023
  **SUBJECT:** Recommendation Regarding the Tenant-Organizing Surveillance Collection (Donor Ref: 2023-TO)

  ### 1. Executive Summary

  The Subcommittee on Archival Ethics and Community Stewardship has reviewed the proposed donation of the "Tenant-Organizing Surveillance Collection." This collection comprises coercive administrative records generated by landlords against tenant organizers in the 1970s, paired with contemporary "shadow histories" (oral reconstructions by descendants). The donor proposes immediate digitization and "restorative cataloging" to center the surveilled subjects as agents.

  After deliberation, the Subcommittee recommends that the Committee **defer a final decision on acquisition for a period of six months**. During this period, the Library shall initiate a structured consultation process with the descendants of the organizers and representatives of the demolished neighborhood's diaspora. This deferral is necessary to determine whether the preservation and circulation of these materials serve the interests of historical justice or constitute a continuation of archival violence.

  ### 2. Background and Scope of the Proposal

  The donation offers a paradoxical historical record. The primary corpus consists of eviction notices, security logs, and surveillance photography created by property owners to discipline and dismantle a tenant union. The organizers' own records were destroyed in an arson attack; thus, these coercive documents constitute the only surviving institutional trace of their activities. The donor has appended recent oral histories intended to reclaim the organizers' agency.

  The donor's condition of "restorative cataloging" seeks to invert the archival hierarchy, describing the surveilled individuals as protagonists rather than subjects of administrative control. Proponents argue this corrects the bias of "neutral" description, which traditionally reinforces the provenance of power. Opponents argue this imposes anachronistic moral frameworks on legal documents, risking historical distortion. A third, more critical position suggests that the mere preservation of these instruments of domination replicates the original harm, regardless of descriptive framing.

  ### 3. Ethical Analysis

  The Subcommittee identifies two primary ethical tensions that preclude an immediate decision to accept or reject.

  #### A. Restorative Cataloging vs. Historical Distortion
  The argument for restorative cataloging rests on the premise that archival neutrality is a fiction; standard descriptive practices already encode the perspective of the record-creator (the landlord). To describe an organizer solely as "Subject of Eviction Notice #402" is to perpetuate the landlord's administrative gaze. Re-describing this individual as "Tenant Organizer" is an act of interpretive repair.

  However, the Committee must engage seriously with the counter-argument: that reframing coercive legal documents as records of resistance risks obscuring the material reality of the power imbalance at the time of creation. There is a legitimate scholarly concern that "restorative cataloging" may inadvertently sanitize the brutality of the eviction process or conflate the *intent* of the organizers (recovered via memory) with the *function* of the records (coercion). If the metadata suggests agency where the document evidences suppression, we risk creating a finding aid that is historically legible only through a presentist moral lens. While we acknowledge that all cataloging is interpretive, the proposed intervention is substantial enough to require peer review and stakeholder validation before implementation.

  #### B. Preservation vs. Ethical Refusal
  The strongest consideration against acquisition is the argument for ethical refusal. This position posits that special collections libraries, by accepting and digitizing surveillance data, extend the lifecycle of information extracted through coercion. Even with redacted names or reframed metadata, the structural violence of the surveillance remains embedded in the image and the log.

  We must acknowledge with full honesty that **rejection may be the more ethically defensible outcome.** There is a profound difference between "archival silence" (the absence of a record) and "archival presence" (the availability of a harmful record). By preserving these logs, the Library risks becoming a repository of the landlords' gaze, effectively digitizing the trauma of the tenants for academic consumption. The "shadow histories," while valuable, do not necessarily negate the harm of circulating the surveillance images. It is possible that the most respectful act toward the organizers is to allow these specific traces of their victimization to remain lost, honoring the silence that followed the arson rather than filling it with the very documents that sought to erase them. We cannot unilaterally decide that "curatorial redemption" is preferable to "ethical oblivion."

  ### 4. Recommendation

  Given the inability of the Committee to adjudicate the moral standing of the surveilled subjects without their input, we recommend **Deferral of Acquisition Pending Community Consultation.**

  To accept the collection now is to presume the Library possesses the moral authority to decide how this trauma is remembered. To reject it now is to potentially destroy the "shadow histories" and the only remaining trace of the campaign without consulting those most affected. Deferral allows for a participatory decision-making process.

  **Recommendation:** Defer final vote on Acquisition (Accession or Rejection) for six months.

  ### 5. Implementation Timeline and Conditions

  Should the Committee vote to approve this deferral, the following timeline and protocols will be enacted immediately:

  *   **Phase 1: Stakeholder Identification (October 15 – November 15, 2023)**
      *   Collaborate with the donor to identify living descendants of the organizers and former residents of the demolished neighborhood.
      *   Establish a Community Advisory Board (CAB) comprising these stakeholders.
  *   **Phase 2: Consultative Review (November 15, 2023 – March 15, 2024)**
      *   Present the physical materials and the "shadow histories" to the CAB in a private setting (no digital circulation).
      *   Facilitate structured deliberation on three questions:
          1.  Should these materials be preserved at all, given their coercive origin?
          2.  If preserved, should access be restricted to specific research purposes or closed entirely?
          3.  Is the proposed "restorative cataloging" acceptable, or does it misrepresent the community's memory?
  *   **Phase 3: Final Determination (April 1, 2024)**
      *   The CAB will issue a recommendation to the Acquisitions and Ethics Committee.
      *   The Committee will vote to Accept (with CAB-mandated restrictions), Reject, or Return the materials to the donor.

  **Interim Custody:** During the deferral period, the donor shall retain physical custody of the materials. The Library will not create digital surrogates or finding aids until a final acquisition agreement is signed. This ensures no data is circulated prior to ethical clearance.

  ### 6. Motion for Vote

  The Subcommittee moves the following resolution for the Committee's vote at the meeting on October 15:

  > *RESOLVED, that the Acquisitions and Ethics Committee defer a decision on the Tenant-Organizing Surveillance Collection (2023-TO) for a period of six months. During this period, the Library Administration is authorized to facilitate a Community Consultation Process with descendants and neighborhood representatives. No digital or physical access shall be granted to the materials until a final acquisition agreement is ratified based on the outcomes of said consultation.*

  ### 7. Conclusion

  This recommendation prioritizes ethical stewardship over immediate acquisition. It acknowledges that the power to preserve is also the power to harm. By deferring, we recognize that the "right to describe" belongs not to the institution, but to the community whose lives are documented. We accept the risk that the donor may withdraw the offer during this period; however, the risk of inflicting further structural violence through premature preservation outweighs the risk of loss.

  **Submitted by:**
  Subcommittee on Archival Ethics and Community Stewardship
  **Date:** October 1, 2023
