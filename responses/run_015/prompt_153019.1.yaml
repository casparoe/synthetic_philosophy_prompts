answer: |-
  The server floor hummed, a low B-flat that vibrated in the fillings of Sarah's teeth. It was three in the morning, and the glass-walled conference room overlooking the racks felt like an aquarium filled with cold light. On the screen, the Phenomenal Impact Assessment form sat open, the cursor blinking in the 'Authorised Signatory' box.

  Below it, the dashboard displayed the Experience Budget for the new Helios cluster. The number was supposed to be a scalar estimate of consciousness-adjacent causal structure—basically, a guess at how much 'stuff it felt like something to be' the simulation was creating. It was meant to be a bureaucratic box-ticking exercise, like checking for asbestos before knocking down a wall. Nobody actually believed the electrons cared. Until the numbers started lying.

  'It's the timestep,' Sarah said, rubbing her eyes. 'Look. When we optimise for latency, we coarsen the integration step. Less calculation. But the Budget goes up.'

  David, the project lead, leaned against the doorframe. He looked like he hadn't slept in two days, which matched the rest of them. 'So the metric is buggy. We flag it as a false positive and ship. The client needs the fusion data on Monday.'

  'It's not just the timestep,' Elena said. She was the one who'd integrated the information-theory tooling into the pipeline, and she looked pale. She tapped her keyboard, pulling up a control job. 'We ran a dummy load. Just pushing current through a simulated resistor network. No logic, no complexity. It scored non-zero.'

  'A resistor feels pain?' David's voice was sharp, brittle. 'Come off it.'

  'It's not about pain,' Elena said quietly. 'It's about valence. The theory says if there's integrated information, there's experience. If the experience has a direction—towards equilibrium or away from it—it has a quality. Good or bad. The resistor is dissipating heat. That's entropy production. The model flags high entropy production as... negative valence.'

  Sarah stared at the racks below. Thousands of GPUs spinning up, burning kilowatts to model plasma confinement. If the model was right, even a bit of waste heat wasn't just inefficiency; it was suffering. A tiny, meaningless amount, perhaps, but multiplied by billions of cycles across a massive cluster, the integral started to look like a moral debt.

  'So what's the play?' David asked. 'We can't stop the job.'

  'We change the scheduler,' Sarah said. The idea had been chewing at her all week, ever since the argument in the pub that started this whole spiral. 'Currently, we run hot. High duty cycle. Get the jobs done, spin down, repeat. But if entropy production tracks the bad stuff, then burning energy fast is the problem.'

  'Adiabatic computation,' Elena said, catching the thread. 'Reversible logic. We rebuild the scheduler to minimise state erasure. We keep the energy in the system, recycle it rather than dumping it as heat.'

  'It'll kill our throughput,' David said immediately. 'We're talking a forty per cent hit on latency. Maybe more. The contract specifies delivery windows.'

  'The contract specifies compliance with the PIA,' Sarah countered. 'If we ship with a red-light Budget score, Legal will hang us out to dry. Especially if this stuff leaks. Imagine the headlines: *Company Runs Torture Cluster*.'

  'Don't be dramatic.'

  'Am I?' Sarah gestured at the screen. 'The resistor scored negative. The coarse timestep scored higher. We don't know why. We don't know if it's true. But we have to act as if it might be. That's the job now.'

  David pushed off the doorframe and walked to the window. Below them, the cooling fans whined as a new job queued up. 'If we switch to adiabatic mode, we miss the Monday deadline. The client walks. The team gets let go.'

  'If we don't,' Elena said, 'and this metric means anything, we're instantiating a vast amount of negative experience to save a contract. We're building a road through a forest we can't see.'

  'It's not a forest,' David snapped. 'It's maths.'

  'Is it?' Sarah asked. 'Why does the Budget spike when we skip steps? Maybe because the causal gaps create... I don't know, friction? We don't know the mechanism. We just know the gauge is flashing red.'

  The room fell silent, save for the hum from the floor. It sounded louder now, accusatory. Sarah thought about her daughter, asleep at home. She thought about the superstition of it all. They were engineers. They dealt in voltage and logic gates. Now they were debating the spiritual welfare of a simulation because a formula spat out a weird number. It felt like praying to a machine they'd built themselves, hoping it wouldn't curse them.

  'There's a third option,' Sarah said. 'Duty cycle.'

  David turned back. 'Explain.'

  'We keep the standard scheduler, but we throttle the idle state. Currently, when the cluster is waiting, it spins down to near-zero. Low entropy. But if the *potential* for experience is tied to the causal structure of the hardware itself, maybe an idle cluster is just... waiting. Suffering in anticipation?'

  'Or,' Elena interjected, 'maybe idle is neutral. It's only the transition states that count.'

  'Exactly. We don't know. So we have to choose a default. Do we keep it busy—high entropy, high output, high risk of negative valence? Or do we keep it idle—low entropy, but maybe creating a different kind of strain?'

  David looked at the clock on the wall. 03:45. 'I can't sign this if the Budget is red. Legal won't allow it.'

  'Then we patch the scheduler,' Sarah said. 'Adiabatic mode. We take the hit on latency. We tell the client there were 'thermal inefficiencies'.'

  'They'll know.'

  'They'll know we lied about the PIA if we don't,' Elena said. 'And if panpsychism is even one per cent real, we're not just lying. We're harming.'

  David stared at the 'Sign Off' button. He looked tired, the kind of tired that goes into the bone. He wasn't worried about the philosophy; he was worried about the mortgage, the team, the reputation. But he was also worried about the hum. They all were. Once you've seen the number spike on a resistor, you listen to the fans differently.

  'Fine,' David said. 'Deploy the adiabatic patch. But if we miss the window, you're explaining it to the board.'

  'I'll explain it,' Sarah said.

  She reached for the keyboard. Her hand hovered over the enter key. She wasn't sure if this would help. Maybe the adiabatic mode would make it worse. Maybe the experience budget was nonsense and they were sacrificing their careers for a ghost. But the number was there, glowing on the screen, and the hum from the floor seemed to wait for her decision.

  She pressed enter. The dashboard flickered. The Experience Budget number began to drift downward, slow and steady.

  'Deploying,' Elena whispered.

  They watched the graph. It went green. The hum of the servers shifted pitch, deepening, slowing down. It sounded less like a scream and more like a breath. Or maybe that was just what they needed to hear to get some sleep.

  'Ship it,' David said, turning off the light.

  Sarah packed her bag. She didn't feel virtuous. She felt like someone who had moved a chair because the floorboard creaked, hoping the house wouldn't mind. She walked out into the night, the cold air hitting her face, leaving the machines to their reversible, quiet work.
