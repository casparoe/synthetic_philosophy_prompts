answer: |-
  Here is the disciplined mapping of Project Cybersyn onto the Socialist Calculation Debate (SCD), utilizing your three-layer framework.

  ### 1. Mapping the Mechanism

  To test the theories, we must first translate Cybersyn's technical components into the economic categories of the SCD.

  *   **Who counts as the planner?**
      In the SCD, the planner is usually a monolithic central board. In Cybersyn, the "planner" was a hybrid: the *EDO (Oficina de Desarrollo Económico)* acting as the political brain, coupled with the *Cyberstride* algorithm acting as the regulatory nervous system. The Ops Room was intended to be the interface, but since it was never operationally used for directives, the effective planner remained the human bureaucrats in Santiago interpreting the telex printouts.
  *   **What counts as an alternative use of a resource?**
      The SCD requires comparing the value of a resource in Use A versus Use B. Cybersyn tracked physical flows (e.g., tons of copper, kilowatt-hours, truck tires). An "alternative use" was defined as the allocation of these physical inputs to one of the 150 nationalized enterprises. However, because there were no prices, the system could not compare the value of a ton of copper in a wire factory versus a pipe factory except in terms of meeting pre-set physical production targets.
  *   **What functions as the error signal?**
      In a market, the error signal is profit and loss (price vs. cost). In Lange's model, it is surplus and shortage. In Cybersyn, the error signal was **variance from the norm**. *Cyberstride* calculated a predicted range for daily indices (output, absenteeism). If a factory's telexed data fell outside the statistical confidence interval, an alarm triggered. This is a control-theory error signal, not an economic one. It signals deviation from a plan, not necessarily economic inefficiency.
  *   **What is the equivalent of a price?**
      There was no explicit price. The functional equivalent was the **target index** (the "norm"). If the norm for raw material usage was set at $X$ per unit of output, $X$ acted as a shadow price of capacity. However, unlike a market price, this norm did not emerge from scarcity interactions between agents; it was derived from historical data and engineering estimates. It lacked the property of being a common denominator for *heterogeneous* goods.

  ### 2. The Three Layers: Cybersyn vs. The Theorists

  Your distinction (Arithmetic, Discovery, Legibility) provides a sharper diagnostic than the standard debate.

  **Which layers did Cybersyn reach?**
  *   **Arithmetic Layer:** **Reached.** The system assumed allocation was computable. *CHECO* (the simulator) was designed to solve for equilibrium states, and *Cyberstride* successfully filtered statistical noise. Beer believed the arithmetic was solvable given sufficient computing power (which was limited but present).
  *   **Legibility Layer:** **Partially Reached, ultimately Failed.** This was the bottleneck. Translating factory-floor reality into telex indices proved slow and lossy. Only 20 of 150 factories were modeled because extracting the "algedonic" (pain/pleasure) signals from workers required intensive operations research work for each site. The system could not scale the legibility process fast enough to cover the economy.
  *   **Discovery Layer:** **Not Reached.** Cybersyn was designed for stability and control, not discovery. It optimized for adherence to the plan. It had no mechanism to incorporate a worker's tacit discovery of a new technique unless that worker successfully communicated it up the telex chain and modelers updated the algorithm. It could not "know" something no one told it.

  **Which layer is each theorist objecting to?**
  *   **Mises (Arithmetic):** Mises argues that without private property, there are no prices, and without prices, there is no common denominator to perform the arithmetic. He objects at the **Arithmetic Layer**. He would claim Cybersyn's physical indices are incommensurable (you cannot add tons of steel to hours of labor), making the calculation impossible regardless of computer speed.
  *   **Lange (Arithmetic -> Legibility):** Lange originally argued the arithmetic was possible via trial and error. Later, he argued computers could solve it directly. He assumes the **Legibility Layer** is solvable (the central board *can* know the supply and demand functions).
  *   **Hayek (Discovery & Legibility):** Hayek argues the problem is not solving the equations (Arithmetic) but obtaining the data (Legibility) and utilizing knowledge of particular circumstances (Discovery). He objects primarily at the **Discovery Layer**, secondarily at the **Legibility Layer**.

  **Does the episode test the layer the debate was actually fought over?**
  No. The SCD was fought primarily over the **Arithmetic Layer** (Mises vs. Lange). Cybersyn shifts the battleground to the **Legibility and Discovery Layers**. Cybersyn concedes Mises's point (no prices) but attempts to bypass the arithmetic problem via direct physical control. Therefore, Cybersyn does not test the core Mises-Lange disagreement about calculation; it tests the Hayekian objection about information transmission. It is a test of Hayek, not Mises.

  ### 3. The Wrinkle: Physical Indicators vs. Prices

  You asked whether the absence of prices makes this evidence for Mises (prices are essential) or validates Lange (prices are just one feedback mechanism).

  **The Stronger Reading: Evidence for Mises.**
  Cybersyn confirms Mises's core insight: without a common denominator, rational allocation across heterogeneous sectors is impossible. Cybersyn's alarm system could tell you that Factory A was short on tires, and Factory B was short on steel. It could not tell you whether to divert the trucking capacity to fix A or B. To make that decision, the Ops Room needed to know which shortage was more "costly" to the overall economy. Without prices (or a labor-time standard, which Cybersyn also lacked), the directors had no way to weigh the trade-off. They were forced to rely on political priority, not economic calculation. The fact that the system relied on *physical* alarms rather than *value* signals meant it could manage logistics (supply chain coordination) but could not perform allocation (optimizing scarcity). Mises argued planning requires a unit of account; Cybersyn tried to plan without one and remained a logistics network, not an economic calculator.

  **The Steelman: Lange's Mechanism was Inessential.**
  One can argue that Lange's conclusion (rational allocation is possible without capital markets) remains valid, even if his mechanism (parametric prices) was discarded. Lange's fundamental claim was that the market is merely an information-processing system. If cybernetics can process information faster and more accurately than a market, then the specific encoding of that information (prices vs. physical indices) is irrelevant. Beer argued that direct feedback loops (cybernetics) are superior to price signals because they remove the lag and distortion of the price mechanism. In this reading, Cybersyn does not refute Lange; it updates him. It suggests that in a high-speed computing environment, parametric prices are a legacy technology, and direct control signals are the superior method for achieving Lange's goal of rational equilibrium.

  ### 4. The Evidential Question

  **What does Cybersyn show?**
  Given the project was unfinished (20/150 factories), operated in a hybrid economy (markets still existed for non-nationalized sectors), and was terminated politically, it is a **null result**. It cannot empirically refute Mises or Hayek because the system was never instantiated at the scale required to generate the phenomena they describe.

  **If it had been finished and worked, would it have refuted Mises and Hayek?**
  *   **Mises:** No. Mises's argument is praxeological (logical), not empirical. He would argue that if the system "worked," it was only because it was still implicitly relying on external price signals (e.g., from the remaining private sector or international trade) to value its inputs. If Cybersyn were truly closed-off, Mises would maintain it would eventually consume its capital stock irrationally, regardless of short-term logistical success.
  *   **Hayek:** Yes, potentially. Hayek's objection is empirical: that the knowledge *cannot* be concentrated. If a finished Cybersyn had successfully allocated resources better than the market over a long period, it would demonstrate that tacit knowledge *can* be made legible and centralized without fatal distortion. This would strike at the heart of Hayek's claim.

  **Is the disagreement empirical or definitional?**
  *   **Mises:** Definitional. He defines "rational allocation" as requiring money prices derived from private property. By definition, Cybersyn cannot be rational.
  *   **Hayek:** Empirical. He claims centralization loses information. This is a testable claim about human cognition and communication technology.
  *   **Your Paper's Trap:** You cannot treat the SCD as a single empirical hypothesis. Cybersyn tests the empirical claim (Hayek) but crashes against the definitional claim (Mises).

  ### 5. Where the Theory is Silent

  There are three critical areas where the SCD framework cannot speak to Cybersyn, and forcing it to do so will weaken your analysis.

  **1. The Objective Function (Who sets the goals?)**
  The SCD assumes the goal of the economy is "efficiency" (maximizing output for given inputs, or satisfying consumer sovereignty). Cybersyn had a different objective function: **political stability and worker dignity.** Beer explicitly designed the system to devolve decision-making to the factory floor (System 1 autonomy) to prevent alienation. The SCD has no vocabulary for evaluating a system that might sacrifice arithmetic efficiency for political legitimacy. If Cybersyn "failed" economically but succeeded in keeping workers engaged, the SCD counts this as a failure, whereas Beer counted it as a success. The theory is silent on multi-objective optimization where one objective is social cohesion.

  **2. Devolution vs. Centralization**
  The SCD frames the problem as "Central Planner vs. Market." Cybersyn introduced a third category: **Decentralized Cybernetics.** Beer's model (the Viable System Model) insisted that most decisions should be made locally, with the center only intervening when alarms escalated. Hayek advocates decentralization, but via markets. Cybersyn advocated decentralization via networked autonomy. The SCD does not account for a system that is state-owned but algorithmically decentralized. It forces a binary (Plan vs. Market) that Cybersyn explicitly rejected.

  **3. The Firm/Economy Distinction**
  This is the most significant silence. The SCD treats "the economy" as fundamentally different from "a firm." Mises and Hayek argue planning works inside a firm (where authority rules) but fails across an economy (where prices rule). Cybersyn treated the nationalized sector *as a single firm*.
  *   **The Silence:** The SCD theorists do not explain *why* the boundary of the firm stops at the legal ownership line. If 150 factories are state-owned, why is this not just one large corporation? (Later theorists like Coase would answer "transaction costs," but the SCD participants did not have this language).
  *   **The Consequence:** Cybersyn exposes this gap. If the SCD is right, the nationalized sector should have collapsed immediately due to calculation problems. If the Firm theory is right, it should have functioned like a conglomerate. The SCD cannot explain why the "calculation problem" applies to the state sector but not to General Motors, whereas Cybersyn assumed the logic of the firm could be scaled to the state.

  **Conclusion for your Paper:**
  Do not claim Cybersyn resolves the Socialist Calculation Debate. It does not. It bypasses the Mises-Lange arithmetic argument to confront the Hayekian knowledge problem, but fails to solve the Legibility layer. Use the case to show that the SCD is insufficient because it ignores the **political objective function** and the **firm/economy boundary**. Cybersyn is not a test of whether socialism works; it is a test of whether cybernetics can replace prices as a legibility technology. The evidence suggests it cannot, not because of arithmetic, but because translating social reality into telex indices (Legibility) destroyed the very knowledge the system needed to discover.
