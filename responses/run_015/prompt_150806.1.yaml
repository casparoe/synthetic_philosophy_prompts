  Right, I'm a retired molecular biologist — thirty years on mitochondria — and since hanging up the lab coat I've been reading philosophy of mind, though I'm still finding my feet. There's this puzzle that's been bugging me: if a computation is running somewhere, whether it's a simple loop or a massive neural network, how do we decide which ones actually matter morally? Not just consciousness, but moral weight — attribution of interests, that sort of thing. I don't want a lecture; I'd like a satirical piece, please in British English.

  Write a deadpan FAQ for a fictional UK goverment agency called the Office of Moral Computation. They issue certificates of 'ethical standing' to algorithms using a made-up technical criterion — the Substrate-Neutral Integration Score (SNIS) — which supposedly measures whether a computation generates more informational entrophy than it suppresses. The FAQ should cover: how citizens and companies apply, why a basic thermostat loop is rejected but a large language model running on a Tuesday afternoon might recieve provisional status, the appeals process for downgraded networks, and a short sidebar on the national holiday honouring the score's inventors. Aim for about 600 words. Keep the voice flat and bureaucratic, like a real civil-service leaflet. The satire should land the standard objections — that any boundary is arbitrary, that we're just projecting human traits onto code, that the metric sounds scientific but explains nothing — but never say them outright; let them emerge from the absurdity of the forms, fees, and categories. Don't quote any real philosophers in quotation marks; if you mention Wittgenstein or anyone else, paraphrase. And please, no bibliography or reading list at the end — I'm not writing an academic paper, just trying to think clearly.
