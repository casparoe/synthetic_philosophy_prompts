  10. **Writing:** (Focusing on precise terminology: *condition-dependent*, *screening*, *bonding*, *principal-agent*.) *Self-Correction during drafting:* Make sure to distinguish between the King signaling to Europe (secondary) and Nobles signaling to King (primary). The prompt asks for the Court as a system, implying the Nobles are the primary signalers of loyalty/status.

