  2.  **Deconstruct the User's Framing (Critique Step):**
      *   *Is the framing tendentious?* Yes, slightly. The user frames it as "wasteful display" implying inefficiency. But in political science, this is often "efficient" coercion or co-optation. The user also hints that the "third-party financing" breaks the model. Does it? In biology, sometimes signals are subsidized (e.g., honest signaling in cooperative breeding), but usually, the *signaler* bears the cost to prove quality. If the Duke spends the King's money to signal loyalty, is it a signal of the Duke's wealth or the Duke's access?
      *   *The "Receiver Design" point:* This is the strongest critique. Standard costly signaling (Zahavi/Spence) assumes a decentralized equilibrium. Here, the Receiver (Louis) *mandates* the signal. This shifts it from "Signaling Theory" to "Mechanism Design" or "Principal-Agent Theory."
      *   *Decision:* I need to acknowledge this shift. It's not a pure handicap principle case; it's a *coerced* signaling equilibrium managed by a monopolist. I should validate the user's intuition that this stretches the theory, but show how it can still be mapped if we adjust the definitions of "cost" and "fitness."

  3.  **Drafting Section 1: The Disciplined Mapping:**
      *   *Signalers:* The High Nobility (Dukes, Princes of the Blood).
