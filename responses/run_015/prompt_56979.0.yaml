      *   *Falsification:* What would count against it? If nobles who *didn't* spend prospered equally. Or if the King rewarded frugality. Or if the display didn't correlate with actual power retention. The fact that the nobility was neutered while the King survived the Fronde suggests the "signal" worked for the Receiver. The fiscal collapse suggests the *systemic* cost was too high (evolutionary dead end for the regime).
      *   *Key Insight:* The Handicap Principle explains the *stability* of the hierarchy, not necessarily the *long-term viability* of the organism (the State). A peacock's tail gets it eaten; Versailles got France bankrupt. Both are consistent with signaling theory (individual advantage vs. group/long-term cost).

  6.  **Drafting Section 4: Silences and Limits:**
      *   *Venal Offices/Borrowing:* This is the "debt" aspect. Signaling theory often ignores financing. If you signal on credit, is it honest? Only if the credit market believes in your future access (the King). It ties the financial system to the signaling system.
      *   *International Signaling:* Versailles signaled to Europe (power projection). But the prompt asks to focus domestic. I'll mention it as a secondary audience that misread the signal (saw strength, saw fiscal weakness later).
      *   *Women:* They were key signalers too (salons, influence). Excluding them biases the "warrior aristocracy" narrative.
      *   *Alternatives (Elias):* Norbert Elias's *Civilizing Process* is the main rival. It's about psychological internalization of restraint, not just economic burning. Signaling is the *mechanism*, Elias is the *sociological outcome*. They are compatible.
      *   *War Finance:* Simple resource extraction story. Signaling adds the *why* of the specific form (ritual vs. just cash).

  7.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Tone:* Needs to be analytical, precise, slightly academic but magazine-ready.
      *   *Addressing the "Tendentious" Prompt:* I should start by validating the user's suspicion. The Versailles case *does* break the pure biological model because the "Receiver" is an active designer, not a passive observer. This makes it a **Principal-Agent Screening Model** disguised as signaling.
      *   *The "Waste" Question:* Is it waste? For the King, it's an investment in stability. For the Class, it's a tragedy of the commons (arms race). For the State, it's eventual collapse.
      *   *Fitness Translation:* Need to be careful not to biologize too much. "Reproductive success" = "Dynastic continuity."
      *   *Credibility:* Emphasize the *Levée*. It's a time-cost. Time is non-transferable. That's the honest signal. Money can be borrowed; time at the King's bedside cannot be faked.

  8.  **Final Review against Constraints:**
