      *   **Current Status:** Has biology (Zahavi, Grafen, Spence) and anthropology (potlatch) sections. Stalled on the historical section (Versailles).
      *   **Goal:** A "disciplined mapping" of Versailles as a costly-signaling system, not just atmosphere.
      *   **Specific Requirements:**
          1.  **Mapping:** Signalers, Audience, Signal, Currency/Fitness, Credibility (Handicap vs. Index vs. Commitment vs. Arms Race).
