  *(Final check on constraints)*: No citations. No reading lists. Formal but readable.

  *(Drafting thought)*: Make sure the distinction is crystal clear.
  Conciliationism: Stats say I'm biased -> I must lower confidence in my specific diagnosis.
  Level-Splitting: Stats say I'm biased -> I keep confidence in diagnosis (based on exam) but acknowledge the stats as a separate layer of risk.
