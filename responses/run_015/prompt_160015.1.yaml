answer: |-
  ### Specification: Outcome Comparator Module

  **1. Partition Independence (Chunking)**
  *   **Case:** Splitting an hour of pain into 60 minutes vs. one block.
  *   **Test:** `assert score(integrate(stream)) == score(sum(slices(stream)))`
  *   **Status:** **Non-Negotiable.** Without this, the verdict depends on your database granularity.
  *   **Taste Check:** None. This is a coherence requirement for any continuous function.

  **2. Baseline Stability (Zero Point)**
  *   **Case:** Dreamless sleep vs. nonexistence vs. neutral wakefulness.
  *   **Test:** `assert score(null_state) == 0.0` and `assert score(neutral_state) == 0.0`
  *   **Status:** **Non-Negotiable.** You need a fixed origin to sum positive and negative values.
  *   **Taste Check:** None. A scale without a zero cannot support aggregation.

  **3. Valence Netting (Mixed Valence)**
  *   **Case:** Chili burn (pain + pleasure) or bittersweet grief.
  *   **Test:** `assert score(mixed_state) < score(pleasure_component_alone)`
  *   **Status:** **Negotiable.** Requires collapsing two axes (pleasure/pain) into one scalar.
  *   **Taste Check:** **Taste.** A two-axis theory rejects this, claiming pain and pleasure are incommensurable dimensions.

  **4. Scope Inclusion (Non-Hedonic)**
  *   **Case:** Boredom, flow, confusion, exhaustion.
  *   **Test:** `assert score(flow_state) > score(boredom_state)` mapped to same scale as pain.
  *   **Status:** **Negotiable.** Depends on if your input pipeline tags these as "valence" or "metadata."
  *   **Taste Check:** **Taste.** Strict hedonists say only pleasure/pain count; others say engagement matters.

  **5. Uncertainty Robustness**
  *   **Case:** Inputs are distributions (mean ± error), not scalars.
  *   **Test:** `if overlap(dist_A, dist_B) > threshold: return verdict == UNDECIDED` (No hard flip on noise).
  *   **Status:** **Non-Negotiable.** Required for noisy sensor data.
  *   **Taste Check:** None. Engineering constraint.

  **6. Aggregation Linearity (Mild vs. Severe)**
  *   **Case:** 1 million headaches vs. 1 severe migraine.
  *   **Test:** `assert score(1M * mild) > score(1 * severe)` OR `assert score(1M * mild) < score(1 * severe)` (Must pick one).
  *   **Status:** **Negotiable.**
  *   **Taste Check:** **Taste.** This is the core fight between Total Utilitarianism (sum wins) and Threshold Views (severity wins).

  **7. Continuity (No Cliffs)**
  *   **Case:** A sub-1% change in pain intensity shouldn't flip a "forbidden" flag.
  *   **Test:** `assert abs(score(input) - score(input + epsilon)) < delta`
  *   **Status:** **Non-Negotiable** for automated systems.
  *   **Taste Check:** None. Discontinuous functions cause thrashing in control loops.

  **8. Inter-Subjective Normalization (Range Differences)**
  *   **Case:** Mind A max pain = 10; Mind B max pain = 1000.
  *   **Test:** `assert normalize(pain_A) == normalize(pain_B)` given equal reported suffering.
  *   **Status:** **Non-Negotiable** for cross-mind comparison.
  *   **Taste Check:** **Taste.** Requires assuming a "universal meter" of suffering rather than relative preference.

  **9. Dynamic Consistency**
  *   **Case:** Ranking a whole life vs. choosing moment-by-moment.
  *   **Test:** `assert score(life) == sum(score(moment) for moment in life)`
  *   **Status:** **Negotiable.**
  *   **Taste Check:** **Taste.** Some theories value "narrative arc" or endings over the sum of moments.

  **10. Population Neutrality**
  *   **Case:** Two lives with total score 100 vs. One life with score 100.
  *   **Test:** `assert compare(pop_A, pop_B) == compare(life_A, life_B)` if totals match.
  *   **Status:** **Negotiable.**
  *   **Taste Check:** **Taste.** Rejects the "Repugnant Conclusion" logic; some prefer average utility over total.

  ---

  ### Impossibility Collisions

  You cannot satisfy all Non-Negotiables if you adopt specific moral intuitions. Here are the hard breaks:

  1.  **Lexical Priority vs. Continuity (Your Suspicion A):**
      *   **Conflict:** If pain above threshold $T$ is infinitely worse than anything below, `score()` is discontinuous at $T$.
      *   **Collision:** Req 7 (Continuity) vs. Req 6 (Severity Wins/Threshold).
      *   **What Gives:** You must drop Lexical Priority. In code, a `if pain > T: return -INFINITY` creates a cliff that violates Req 7 and crashes Req 5 (Uncertainty).

  2.  **Lexical Priority vs. Uncertainty (Your Suspicion B):**
      *   **Conflict:** If there is a 0.0001% chance of threshold pain, Lexical Priority demands you avoid it over a guaranteed massive gain.
      *   **Collision:** Req 5 (Uncertainty Robustness) vs. Req 6 (Severity Wins/Threshold).
      *   **What Gives:** You must cap the weight of low-probability events. Pure lexical priority leads to "Pascal's Mugging" where the system freezes on edge cases.

  3.  **Partition Independence vs. Event Thresholds:**
      *   **Conflict:** If a "single event" of pain triggers a penalty, splitting that event into two halves bypasses the penalty.
      *   **Collision:** Req 1 (Partition Independence) vs. Req 6 (Severity Wins/Threshold).
      *   **What Gives:** You cannot have thresholds based on "events." Thresholds must be based on instantaneous intensity integrated over time, or Req 1 fails.

  4.  **Dynamic Consistency vs. Non-Linear Aggregation:**
      *   **Conflict:** If 1 million headaches do *not* equal 1 migraine (non-linear), then the sum of moments does not equal the life score.
      *   **Collision:** Req 9 (Dynamic Consistency) vs. Req 6 (Severity Wins/Threshold).
      *   **What Gives:** You must calculate the score on the full distribution at once, not moment-by-moment. Req 9 must be dropped if pain aggregates non-linearly.

  ---

  ### The Killer Requirement

  **Requirement 1: Partition Independence.**

  *   **What it knocks out:** Any theory that assigns moral weight to the *boundaries* of an experience rather than the content.
  *   **Specific Casualties:** It kills "Episode-Based" threshold theories (e.g., "One broken bone is worse than 1000 paper cuts" *because* it is one event). If you can split the bone-break into milliseconds of increasing pain, the "one event" penalty vanishes unless the theory reduces to instantaneous intensity integration. It forces the theory to be a calculus integral, not a count of bad things.

  ---

  ### Scorecard

  1.  **Sum-The-Valence Hedonism:** Passes Chunking, Continuity, Uncertainty. Fails Severity Intuition (Migraine vs. Headaches).
  2.  **Lexical-Threshold Neg Util:** Passes Severity Intuition. Fails Continuity, Uncertainty, Partition Independence (System unstable).
  3.  **Two-Axis (Pain Prior):** Fails Single Verdict Spec (Req 3). Requires external tie-breaker logic to ship.
  4.  **Weighted Negative-Leaning:** Passes most. Fails Symmetry. Weights are arbitrary hyperparameters requiring tuning.
