          *   *Alternative:* **The "Script/Performance" Analogy (but careful not to imply faking).**
          *   *Better Alternative:* **The "Feedback-Control System" (Cybernetics).** Or perhaps **The "Currency" analogy.**
          *   *Let's go with "Currency/Financial Instrument".* It captures value, real consequences, dependence on collective agreement, and susceptibility to runs/panic (epidemics of diagnosis), without denying the underlying economic activity.
