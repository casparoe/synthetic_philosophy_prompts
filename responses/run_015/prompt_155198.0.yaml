  - after laying out the case, show me both verdicts step-by-step, name the exact structural feature that forces the split, and say what collapses if you remove it.
  - then be straight with me: take a definite position on which theory gets it right here and defend that choice, don't just list pros and cons. also tell me how a formalist defender would try to tear your scenario apart.
  - keep it answerable without web search: no obscure citations, no bibliography requests, no "see Smith 1983." just reasoning from recognisable ideas in a fresh setup. write casual, a typo or two is fine — maybe the two theories give seperate answers.
