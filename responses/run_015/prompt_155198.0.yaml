answer: |-
  Here's the setup: The Green Wood Worker Co-op charter states in Article 9 that "any change to voting thresholds requires an 80% supermajority." During a general meeting, members propose Amendment 9-Alpha, which reads: "Article 9 is hereby replaced to require only a 51% majority for future changes; furthermore, the validity of this specific amendment is determined by this new 51% threshold, not the 80% threshold contained in the prior version of this article." The vote tally comes in at 65% in favor. Everyone in the room accepts the result, updates the handbook, and starts operating under the new 51% rule immediately.

  **The Verdicts**
  *   **Strict Formalist:** Invalid. The authority to amend the charter derives solely from the *existing* text at the time of the vote. Since the old Article 9 demanded 80%, and the vote got 65%, the amendment failed to trigger. The clause attempting to apply the new 51% rule to its own birth is syntactically void because the new rule has no legal existence until the amendment succeeds—but it can't succeed without the authority the amendment itself tries to delete. It's a logical circle: you can't use a rule to validate itself before it is valid.
  *   **Hart-Style Practice:** Valid. The "rule of recognition" isn't the paper charter; it's what the officials (members) actually accept as standard. Since the membership collectively treated the 65% vote as sufficient and acted on it, the new rule is law. The charter is just evidence of the rules, not the source of them. If the social practice shifts, the law shifts, even if the text lags behind.

  **The Split**
  The structural feature forcing this split is the **self-validating transition clause** (the bit saying the new threshold counts for the current vote). If you remove that clause, the scenario collapses into a simple breach of contract: the Formalist says "you broke the rules," and the Practice theorist says "you waived them." But with the clause, the disagreement isn't about breach vs. waiver; it's about whether a legal system can logically bootstrap its own authority. The Formalist sees a contradiction; the Practice theorist sees a evolution.

  **My Position**
  The Practice view gets it right, especially for a co-op. Law isn't math; it's a tool for coordinating human behavior. If every single member accepts the 65% vote and operates under the new rule, insisting the change is "invalid" because of a syntactic loop is fetishizing the text over the reality it's supposed to govern. In a worker co-op, sovereignty lies with the members, not the bylaws. The bylaws are supposed to serve the workers, not trap them in a dead hand control scenario where a minority (the 20% needed to block) can permanently lock the majority out of changing the rules just by hiding behind a logical paradox.

  **The Formalist Counter-Attack**
  A sharp Formalist wouldn't just say "you broke the text." They'd argue you've destroyed the **stability function** of the charter. If members can vote to change the voting rules using the very rules they're changing, there's no actual constraint left. Today it's 80% to 51%, tomorrow it's 51% to "whatever the Board says." By accepting the self-referential loop, the Practice view opens the door to tyranny of the majority, rendering the original supermajority requirement—which was likely there to protect minority workers—meaningless. They'd say your "social practice" is just mob rule wearing a legal mask.
