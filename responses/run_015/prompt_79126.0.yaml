  We refuse a uniform assignment. Uniformity presupposes a partition of the possibilities, and different partitions give different answers. To choose one partition is to claim knowledge we do not possess. We do not guess at the structure of reality to fill a form. Different descriptions of the same space yield different uniforms, so we yield none.

  **Will my house flood and what is the premium?**
  Our range for flooding is 0.02 to 0.98. To satisfy the unanimity rule, the premium must be acceptable to the member assessing 0.98. Consequently, the cost is 98p for every £1 of cover. Most clients find this prohibitive and decline. We respect this decision. You simply want to know whether your house will flood, but we can only tell you the price of knowing.

  **When will the committee agree?**
  We do not speculate on when the members will converge. Our duty is to maintain the integrity of the set until consensus is genuine. We remain open to new applications, provided the applicant accepts the decision rule.

  **How do I contact underwriting?**
  You may submit details via our secure portal. Please note that submission does not guarantee a quote, as the committee must first convene. We thank you for considering a partner committed to never being wrong.
