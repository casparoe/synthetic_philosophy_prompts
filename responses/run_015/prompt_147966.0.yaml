answer: |-
  # JOINT STATEMENT OF POSITION AND DISAGREEMENT
  **Subject:** Moral Responsibility, Reactive Attitudes, and Causal History
  **Parties:** The Compatibilist (Her) and The Incompatibilist (Him)
  **Date:** End of Term

  ## I. AGREED CLAIMS

  We, the undersigned, affirm the following points of consensus regarding the phenomenology of responsibility, the function of our practices, and the boundaries of our current dispute:

  1.  **Phenomenology of Attitudes:** We agree that reactive attitudes (resentment, gratitude, indignation, guilt) are real psychological phenomena with distinct phenomenology. They are not merely theoretical constructs but experienced features of human life.
  2.  **Relational Role:** We agree that these attitudes play a central, non-accidental role in ordinary interpersonal relationships. They are not optional decorations added to a relationship that could otherwise exist in the same form without them.
  3.  **Operation of Excuses:** We agree that within our current practices, excuses and exemptions function by denying or mitigating the *quality of will* manifested by the agent (e.g., showing an action was accidental, coerced, or the result of incapacity). We agree that when an agent acts with ill will or indifference, the reactive attitudes are the standard response.
  4.  **Stance Shifting:** We accept P.F. Strawson's description that human agents naturally move between the "participant stance" (engaging with others as responsible agents) and the "objective stance" (viewing others as subjects to be managed or treated) depending on context, stress, and capacity. Neither of us advocates for the permanent adoption of the objective stance as a practical policy.
  5.  **Status of Determinism:** Neither of us claims that causal determinism has been scientifically established as true. Our disagreement concerns the *implications* of determinism *if* it were true, not the empirical fact of it.
  6.  **Social Utility:** Neither of us holds that the reactive attitudes are pointless. We agree they serve vital social functions (regulation, communication, bonding). The disagreement is whether these functions are sufficient to *justify* the attitudes, or whether they require a further metaphysical grounding to be truly fair.
  7.  **Target of Disagreement:** We agree that we are arguing about the same concept: "Moral Responsibility." We are not talking past each other in the sense that one is discussing legal liability and the other moral worth; we are disagreeing about the necessary conditions for the same normative status.

  ## II. RESIDUAL DISAGREEMENTS

  The following table isolates the precise points of divergence. We agree that these are not verbal misunderstandings but substantive philosophical disagreements.

  | Issue | Neutral Formulation | Her Formulation (Compatibilist) | His Formulation (Incompatibilist) |
  | :--- | :--- | :--- | :--- |
  | **1. The Ground of Blame** | What property makes an agent a legitimate target of blame? | The manifestation of ill will or indifference toward others within a relationship. | Being the ultimate source of the action in a way that is not fully determined by prior causes. |
  | **2. The Threat of Determinism** | If determinism is true, does it undermine responsibility? | No. Determinism is compatible with the quality of will required for responsibility. | Yes. Determinism rules out the ultimate sourcehood required for desert. |
  | **3. The Nature of Desert** | Does "deserving" blame require more than social fittingness? | No. To deserve blame just *is* to be a fitting target of the reactive attitudes given the quality of will. | Yes. Fittingness is psychological; desert is normative and requires a metaphysical openness that fittingness alone cannot secure. |

  ## III. THE CRUXES

  We identify three specific areas where further argument or evidence could shift our positions. For each, we specify the sub-question, the relevant case(s), our respective predictions, and the cost of conceding the point.

  ### Crux 1: The Desert Question (Verbal vs. Substantive)
  **Sub-question:** Is the disagreement about the definition of "desert" (verbal) or about whether our practices are justified without metaphysical sourcehood (substantive)?
  **Analysis:** We acknowledge a verbal component: if "desert" is defined strictly as "metaphysical ultimate sourcehood," she agrees no one has it. If "desert" is defined as "normative fittingness within a community of agents," he agrees we have it. However, the **substantive** core remains: Does the *justification* of our practices require the metaphysical version?
  **Test Case:** A standard case of intentional harm (e.g., a calculated betrayal between friends).
  **Predictions:**
  *   **Her:** If it is shown that "metaphysical desert" is incoherent, the practice of blame remains fully justified because the relational harm is real.
  *   **His:** If it is shown that "metaphysical desert" is incoherent, the practice of blame is revealed to be a useful fiction, and we ought to feel a sense of loss or seek a reform of the practice.
  **Cost of Concession:**
  *   **Her:** If she admits that "fittingness" lacks normative force without "ultimate sourcehood," she loses the ability to say the betrayer *truly* deserves blame, reducing her view to pragmatic management.
  *   **His:** If he admits that "fittingness" is sufficient for justification, he loses the critical leverage to claim our current practices are fundamentally unjust, reducing his view to a metaphysical complaint without practical bite.

  ### Crux 2: Manipulation and Empirical Necessity (Calibration & Vale)
  **Sub-question:** Are reactive attitudes constitutive of moral agency (as she claims), or are they contingent psychological add-ons (as he claims)?
  **Case A (Calibration):** An agent has a device implanted that enhances her sensitivity to moral reasons. She notices no change, deliberates normally, and acts well.
  *   **Her Implication:** She is responsible (and praiseworthy). The device did not bypass her will; it improved it. The source is her reasons-responsiveness.
  *   **His Implication:** She is not responsible. The ultimate source of the improvement is the device/engineers, not her. She is a puppet of benevolent design.
  **Case B (Vale):** Adults raised without reactive attitudes (objective stance only) who function normally in moral tasks but feel no guilt/resentment.
  *   **Note on Case Validity:** We agree the Vale case is empirically speculative. If such humans are psychologically impossible, the case loses force for her. If they are possible, it is decisive.
  *   **Her Prediction:** The Vale adults would fail under relational stress. They might follow rules, but they could not sustain deep friendship or love, because those relationships *require* vulnerability to resentment and gratitude. Strawson's claim is hostage to this empirical prediction.
  *   **His Prediction:** The Vale adults would function as well as controls. They would repair harm and cooperate without the "heat" of reactive attitudes. This would prove the attitudes are social tools, not constitutive elements of responsibility.
  **Cost of Concession:**
  *   **Her:** If Vale adults thrive in deep relationships without attitudes, her claim that attitudes are *constitutive* is false. She must retreat to saying they are merely *instrumental*.
  *   **His:** If Vale adults fail to sustain relationships, it suggests the attitudes are not optional. He must concede that even if metaphysically unjustified, they are inescapable features of human flourishing, weakening his call for reform.

  ### Crux 3: Scope and Exemption
  **Sub-question:** Does the threat to responsibility apply universally (if determinism is true) or only locally (in cases of impairment)?
  **Test Case:** The "Ordinary Deterministic Agent." An agent with no apparent impairment, psychopathy, or manipulation, living in a deterministic world.
  *   **Her Position:** This agent is responsible. Exemptions apply only to specific impairments of the quality of will (psychopathy, severe deprivation). Determinism is not an impairment.
  *   **His Position:** This agent is not responsible. Determinism is a global impairment of sourcehood. The distinction between the psychopath and the ordinary agent is one of degree, not kind; both lack ultimate control.
  **Cost of Concession:**
  *   **Her:** If she admits determinism is a global exemption, her entire account collapses into skepticism. She must show a principled difference between "caused by prior events" and "caused by brain tumor."
  *   **His:** If he admits that "local" exemptions (psychopathy) are fundamentally different from "global" determinism, he undermines the claim that determinism is the real threat. He must explain why causal determination is relevantly similar to coercion.

  ***

  ## MEDIATOR'S CONFIDENCE NOTE

  **Confidence in Agreed Claims:** High. The seven points in Section I represent a robust overlap in the literature and the participants' stated views. It is unlikely either party would repudiate the phenomenology of the attitudes or the unproven status of determinism.

  **Least Certain Formulation:** I am least sure of **Crux 2, Her Prediction (The Vale Case)**.
  **Reasoning:** This claim relies on a strong empirical hypothesis: that deep human relationships *cannot* exist without reactive attitudes. It is possible that "functional equivalents" of resentment and gratitude could exist in the Vale adults (e.g., a cold recognition of norm violation) that satisfy the relational requirement without the phenomenological "heat."
  **Settlement Condition:** This would be settled by a detailed psychological model of the Vale adults that specifies exactly how they negotiate betrayal and repair without guilt or resentment. If they can model forgiveness without the feeling of having been "wronged" in a participant sense, her Strawsonian claim is empirically falsified. If they cannot model forgiveness without reintroducing the participant stance, his Incompatibilist hope for an objective society is shown to be psychologically utopian.
