  (1) "What the behavior evidences"
  Your sister's revealed preference argument holds surface validity: actions incur costs words do not. His bailing evidences that the *anticipated* cost of socializing (energy expenditure, anxiety, logistics) currently outweighs the *anticipated* benefit in the moment of decision. This is hyperbolic discounting where immediate avoidance trumps delayed gratification. It isn't dishonesty; it is a temporal inconsistency in utility assessment. Consequently, his immediate choices override his long-term welfare. The exhaustion suggests high transaction costs—perhaps sensory overload or depression-related fatigue. Strictly reading behavior, he prefers the status quo of isolation because the activation energy required to breach it feels prohibitive. His words evidence a high-level valuation of connection, but his behavior evidences a low-level aversion to the mechanism of achieving it. You are observing a conflict between System 2 values (loneliness is bad) and System 1 impulses (stay home, stay safe). Your role as arranger may add obligation, conflating social energy with filial compliance.

  (2) "Where that reading breaks down"
  Revealed preferences assume stable utility functions and accurate reward prediction. Depression and grief break this. Standard economic models fail when the agent is depressed. He cannot access the utility he claims to seek. His brain may systematically underestimate the reward of socializing due to anhedonia or anticipatory anxiety. The data point you highlighted—visible happiness *after* events—is critical. It suggests his ex-ante prediction engine is miscalibrated. He isn't revealing a true preference for isolation; he's revealing a pathology in his decision-making circuitry. Your hovering hypothesis is strong. If every social attempt is mediated by you, his resistance might be autonomy preservation, not anti-sociality. He may feel managed rather than supported. The behavior evidences resistance to *your* plan, not necessarily to connection itself. Treating his avoidance as a true preference ignores the possibility of internal conflict where one part wants connection but lacks the agency to execute it without feeling controlled.

  (3) "What I'd do"
  Stop arranging specific events. That removes the autonomy conflict. Instead, reduce friction for *his* initiatives. Give him resources (lists of times, contacts) without expectation of follow-through. Frame it as "I found this, no pressure," rather than "I signed you up." Encourage a medical checkup; late-life depression or early cognitive decline frequently manifests as apathy and social withdrawal. Professional help can adjust the baseline mood making action possible. Small wins build momentum better than forced marches. If he says he truly wants friends, ask, "What's the smallest step that feels safe?" Maybe an online forum first, or a one-on-one coffee instead of a group center. Validate the difficulty: "It makes sense that leaving the house feels hard right now." Respect his no, but keep the door open. Shift from manager to consultant. Aim to lower activation energy until his agency bridges the gap between stated values and behavior.
