  Bottom line: Inverse reinforcement learning ultimately favors anti-realism by reducing moral behavior to functional optimization patterns rather than ontological truths. While convergent reward functions might mimic objective facts, they remain fully compatible with shared evolutionary psychology and social conditioning. Therefore, the framework provides descriptive evidence for morality as a human construct, not a discovered reality.

  The case for moral realism via inverse RL: Proponents argue that if IRL yields a stable, convergent reward function from diverse behaviors, this mirrors realist claims of objective moral truths. Just as physics infers laws from physical motion, IRL could infer moral laws from ethical choices. If humans across time and geography consistently optimize for similar values—like fairness or harm reduction—despite varying surface norms, it suggests we are tracking mind-independent properties. This structural universality implies the reward function isn't merely contingent but reflects a deeper normative reality. The stability of the recovered function acts as empirical evidence for a shared moral grammar, bolstering the realist position that ethics is discovered, not invented. This approach treats ethical diversity as superficial noise obscuring a universal signal. By mathematically isolating the core optimization target, realists claim we uncover the invariant moral laws governing agency. The algorithm acts as a telescope for normative facts. Such consistency validates the intuition behind universal human rights.

  The anti-realist comeback: Anti-realists counter that a stable reward function only proves shared biology, not objective facts. Evolutionary psychology explains convergent values like kin altruism or reciprocity as survival mechanisms, not moral truths. IRL merely describes what humans *do* value, not what they *should* value. Even if the reward function is consistent, it remains a naturalistic phenomenon rooted in social conditioning and genetic heritage. The algorithm cannot distinguish between optimizing for "goodness" and optimizing for "social cohesion." Thus, the recovered function is purely descriptive psychology. Consistency indicates common ancestry, not moral reality, leaving the anti-realist view that ethics is a human construct intact. The is-ought gap remains unbridged by statistical correlation alone. Furthermore, cultural diffusion spreads norms without requiring objective truth. What looks like convergence is often just historical contagion. The model confuses widespread acceptance with validity. If we can fully account for moral behavior through natural causes, positing extra moral facts becomes redundant.

  Why the framework might be circular: The framework risks circularity by presupposing humans are rational optimizers. IRL assumes behavior stems from maximizing a reward, but moral action often involves conflict, weakness of will, or irrational duty. By forcing moral behavior into an optimization model, we bake in a consequentialist structure that may not exist. Furthermore, labeling the output as "moral" requires prior ethical judgment to distinguish from prudential or aesthetic preferences. If we select data based on what we already deem moral, the recovered function merely reflects our initial biases. The tool assumes the very coherence it claims to discover, rendering the ontological conclusion dependent on the model's design rather than external reality. Indeed, this bias ensures results align with preconceptions. We cannot escape our normative lens defining the problem. The algorithm isn't truly neutral; it assumes specific agency. Finding a reward function proves humans act purposefully, not that purposes track truth. We see what we expect.

  My verdict: I land firmly on the side that IRL inadvertently supports anti-realism by reducing morality to functional patterns. The technique successfully models behavior but strips away normative force, leaving only descriptive regularities. By translating ethical choices into mathematical weights, IRL demonstrates that moral discourse operates like a preference system, not a fact-tracking mechanism. If morality were truly realist, the reward function should exist independently of human optimization, yet IRL binds it tightly to agent behavior. Consequently, the framework reveals morality as a sophisticated human technology for social coordination. It shows us how we value, not what is valuable, confirming that ethics is a projection of human needs rather than a discovery of external truths. The math works too well on human data to be anything but just human-made. Realism requires a gap between belief and truth that IRL collapses. Morality is us, not the universe. Ultimately, function clearly excludes ontology.
