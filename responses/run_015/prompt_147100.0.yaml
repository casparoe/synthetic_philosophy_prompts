  2.  **Deconstruct the Philosophical/Technical Issue:**
      *   **Inverse Reinforcement Learning (IRL):** Inferring a reward function $R$ from observed behavior/policies $\pi$.
      *   **Moral Realism:** Moral facts exist independently of human opinion. Behavior tracks these facts. $R$ includes irreducible moral properties.
      *   **Moral Anti-Realism:** Moral facts are constructed, psychological, or social. $R$ is naturalistic (evolutionary, cultural conditioning).
      *   **The Twist:** If we run IRL on human moral behavior and find a convergent $R$, does that prove realism?
      *   **The Problem:** IRL assumes an agent is optimizing *something*. It doesn't tell you *what* ontological status that "something" has. Also, IRL solutions are often non-unique (many reward functions can explain the same behavior).

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** Needs to be 2-3 sentences. Verdict: IRL doesn't solve the metaethical debate because it describes structure, not ontology.
      *   **Case for Realism:** Focus on convergence. If IRL across diverse cultures yields a stable, universal reward function, it suggests humans are tracking something external rather than random noise. It mirrors the "common core" argument.
      *   **Anti-Realist Comeback:** Focus on evolutionary psychology and social conditioning. A stable $R$ just means shared biology or cultural diffusion, not objective facts. IRL captures *what* is valued, not *why* it exists.
      *   **Circularity:** IRL assumes rationality/optimization. If we define moral behavior as "optimizing," we presuppose a structure that fits realism. Also, labeling the output "moral" vs "prudential" requires prior ethical judgments.
      *   **My Verdict:** Need to pick a side. I'll argue that IRL favors anti-realism or at least fails to support realism because it reduces morality to functional outputs, stripping away normative force. Or I could argue it's fundamentally category-error prone. Let's go with: IRL ultimately supports anti-realism because it reduces normativity to descriptive patterns.

