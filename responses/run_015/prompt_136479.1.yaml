  **The Principle**

  An external state counts as part of your mind when it acts as a transparent dispositional store. "Dispositional" means the information is ready for use without active reconstruction. This requires four conditions. First, **Accessibility**: the information must be consistently available when needed, without significant barriers like login loops or latency. Second, **Automaticity**: you must retrieve the information habitually, without conscious deliberation about whether to trust the source. Third, **Endorsement**: you accept the content as accurate by default, rather than treating it as a claim requiring verification. Fourth, **Stability**: the content remains fixed until you alter it; the tool does not generate new truths on its own. This final clause distinguishes memory from testimony. If the external resource creates content you didn't encode, it is an advisor, not a memory store. Your mind extends into tools that function as passive hard drives for your cognition, not into tools that act as active processors or agents. Think of it as optical transparency: you look through the tool to the task, not at the tool as an object. If you notice the tool working, it is not yet part of the mind. This preserves the intuition that memory stores *your* past states, not someone else's calculations.

  **Clause by Clause**

  **Accessibility** excludes the Audit Log (9). You maintain it, but since you never read it back, it functions as compliance storage, not cognitive retrieval. It is not available to your active reasoning, so it cannot be part of your mind.

  **Automaticity** separates Contacts (2) from Flaky Tests (10). You dial contacts without thinking; you hesitate before trusting flaky tests. The hesitation breaks the cognitive coupling. You are evaluating the tool, not using it.

  **Endorsement** rules out the CI Pipeline (7). A red build is an alert signal, not a belief you hold. You do not believe "the build is broken" as a fact about the world; you believe "the tool says check this." You verify before acting. Contrast this with the Calendar (3): you set the alert, so you endorse the event as real before the alert fires. The Calendar is prospective memory; the CI is a sensor.

  **Stability** is the heavy lifter. It excludes AI Rewriting (5) and Code Completion (11). In these cases, the content originates from the model, not you. You are reading a suggestion, not retrieving a stored state. This validates your suspicion about clause (d): it isn't about legal ownership, but about the *source of the trace*. If the tool writes the sentence, it is testimony, not memory. This clause also clarifies the Password Manager (4): if you auto-fill, it is stable storage. If you copy-paste after reading, you are verifying, breaking automaticity. The distinction lies in whether the tool holds a static record of your past intent or generates a new solution.

  **Verdicts on My Cases**

  1. **Laptop Notes:** Yes. Stable, accessible, endorsed. It is a classic external hard drive for beliefs.
  2. **Contacts:** Yes. Classic extended memory. You retrieve numbers as automatically as internal recall.
  3. **Calendar:** Yes. Prospective memory (remembering to do). You set the intent; the tool holds it.
  4. **Password Manager:** Yes, if auto-fill. No, if manual review breaks automaticity. The fingerprint scan is a barrier, but if it is seamless, it passes.
  5. **AI Rewriting:** No. Content generation violates Stability. The model is thinking, not storing.
  6. **AI Chat Thread:** No. You don't recall the input, so it isn't *your* trace; it's an archive of a conversation, not a store of your mind. You are reading a log, not remembering.
  7. **CI Pipeline:** No. It is a sensor/alert, not a belief store. It tells you about the code state, it doesn't hold your belief about it.
  8. **Team Runbook:** Yes-ish. It functions as collective memory, but for you individually, it passes all tests if trusted implicitly. The distributed authorship makes it feel different, but functionally it is stable storage.
  9. **Audit Log:** No. Fails Accessibility. It is write-only for you.
  10. **Flaky Tests:** No. Fails Endorsement (lack of trust). You re-verify, so the tool is not coupled.
  11. **Code Completion:** No. It is suggestion, not retrieval. You understand it anew; you don't recall it. It is an external thinker, not an external memory.

  **Two Cases of Yours**

  **Case A: The Smart Glasses.** You wear glasses that overlay names on faces you've forgotten. You never fail to greet someone correctly.
  *Verdict:* Yes. This is transparent access to stored data. It feels like memory because the glasses are passive retrieval.

  **Case B: The Reliable Spouse.** Whenever you forget a fact, you ask your wife. She always knows, and you never doubt her.
  *Verdict:* No. This is uncomfortable. Functionally, she acts exactly like the notebook. But because she is a separate agent who *generates* answers rather than storing *your* notes, the Stability clause fails. She is testimony, not memory. This forces you to admit that biological boundaries still matter when another mind is involved, even if the functional coupling is identical to the notebook.

