prompt: |-
  In a graduate seminar on predictive processing and perceptual psychology, an interlocutor repeatedly invoked the slogan “perception is theory-laden” to dismiss the idea that we ever have “pure” sensory evidence capable of adjudicating between competing scientific hypotheses. He used it specifically to argue that, because prior beliefs causally shape what we see, empirical testing is necessarily circular: there is no neutral observational base that could break the circle, so no theory can be genuinely tested against experience. I am skeptical that the slogan, in any precise form, actually delivers that conclusion.

  Can you lay out the distinct precise theses that “perception is theory-laden” could be expressing, arranged from the most trivial to the most radical? For each reading, say whether it is widely settled, genuinely contested among philosophers of perception and philosophers of science, or false, and specify whether it actually supports my interlocutor’s claim that there is no theory-neutral observational base for empirical adjudication. In particular, distinguish readings that concern (i) the causal influence of background knowledge or expectation on early perceptual processing, (ii) the conceptual or propositional content of perceptual experience, (iii) the epistemic justification of perceptual beliefs, and (iv) the logical or methodological impossibility of theory-neutral observation. Present the options as a menu rather than selecting a single “correct” interpretation, and for each indicate which version people who repeat the slogan in debates like this are most likely invoking. Please separate what is settled in the relevant literatures from what remains genuinely contested, and do not present any contested interpretation as if it were the consensus view. I want something I can take back to the seminar that maps the slogan onto precise commitments and shows exactly where the argument breaks down.
