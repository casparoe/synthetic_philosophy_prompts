answer: |-
  This phenomenon is a specific, high-stakes instantiation of a broader sociological and ecological problem, but in the context of bioethics and formulary decisions, it lacks a single, universally standardized noun phrase. It is most accurately described as a feedback loop between **prevalence** and **normativity**.

  Here is the breakdown of what this phenomenon is, how it differs from its neighbors, and the label that best captures its geometry.

  ### 1. What the phenomenon actually is
  The core mechanism is **Endogenous Normativity**. In a stable system, the "baseline" (normal functioning) is an independent variable used to measure the "intervention" (the dependent variable). In the shape you are describing, the intervention becomes an independent variable that alters the baseline.

  This happens through two channels:
  *   **Statistical Normalization:** As prevalence increases, the statistical mean shifts (e.g., if 60% of students use stimulants, the "average" performance includes stimulants).
  *   **Functional Normalization:** The environment adapts to the enhanced capacity. If everyone uses growth hormone, the social and physical environment (clothing, seating, expectations of reach) adjusts to the new height distribution, making the unenhanced state functionally disadvantaged.

  The result is that the criterion used to justify the intervention ("restoring normal function") is retroactively satisfied by the intervention's own success.

  ### 2. Distinctions from nearby concepts
  *   **Medicalization:** Medicalization is the *process* of defining a problem in medical terms. Your phenomenon is a *consequence* of medicalization where the definition of the "problem" (deviation from normal) shifts *because* of the treatment. Medicalization is the label on the door; your phenomenon is the room expanding to fill the building.
  *   **Concept Creep:** (Haslam, 2016) This refers to semantic broadening of harm-related concepts (e.g., "trauma" or "bullying" coming to include milder experiences). Your phenomenon is similar but distinct: it is not just the *word* expanding, but the *biological/social baseline* moving. Concept creep is linguistic; this is ontological.
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This is the economic ancestor of your problem. However, Goodhart's Law usually implies the measure is corrupted or gamed. In your case, the measure (normal function) isn't just corrupted; it legitimately *changes* because the population changes.
  *   **Shifting Baseline Syndrome:** (Pauly, 1995) Originally ecological (fishermen forgetting how many fish used to be there). This is the closest established term. However, Shifting Baseline Syndrome usually implies a *loss* of memory regarding the past state. Your phenomenon is more active: the intervention *creates* the new baseline which then *legitimizes* the intervention. It is a feedback loop, not just memory loss.

  ### 3. The Asymmetry (The Ratchet)
  You noted that upgrades become restorations, but restorations rarely become upgrades. This is the **Ratchet Effect**.
  *   **Why it ratchets up:** Human systems are competitive (positional goods). If an intervention offers an advantage, adoption spreads. Once adoption is widespread, non-adoption becomes a disadvantage (a defect).
  *   **Why it doesn't ratchet down:** There is rarely a competitive advantage to *reducing* function below species-typical norms. We do not develop technologies to make us shorter or slower and then redefine "normal" as shorter. The arrow of technological capability and competitive pressure points in one direction.
  *   **Risk Aversion:** Once an intervention is classified as a "treatment," removing it is seen as harming patients. Once it is classified as "enhancement," restricting it is seen as fair regulation. The system naturally slides toward the "treatment" classification to avoid denying care.

  ### 4. The Baseline Problem
  You asked whether this afflicts only statistical baselines or also counterfactual/functional ones. **It afflicts all of them.**
  *   **Statistical:** The mean height changes.
  *   **Counterfactual ("what you would have had"):** This becomes incoherent. If the environment changes (e.g., school curriculum assumes stimulant-level focus), the "you that would have existed" is no longer a relevant comparator because that "you" could not function in the new environment.
  *   **Functional ("what the function is for"):** If the function of "studying" is redefined by the cohort's capacity, the functional baseline moves. If the cohort can study for 6 hours with drugs, the "function" of a student now requires 6 hours of focus.

  ### 5. The Label
  While **Shifting Baseline Syndrome** is the established ecological term often borrowed for this, it misses the *reclassification* element (enhancement $\to$ treatment) and the *asymmetry*. **Concept Creep** is too linguistic. **Medicalization** is too broad.

  To capture the specific geometry you described—the one-way movement, the shift in norms, and the retroactive reclassification of the intervention—the most precise label is **The Normative Ratchet**.

  It defines the mechanism (Normative shift) and the shape (Ratchet/asymmetry). It allows you to say: *"Approving this for mild cases risks triggering the normative ratchet, where this enhancement becomes the required baseline for future patients."*

  \answer{The Normative Ratchet}
