  They are **one phenomenon**: **The Fragility of Sequential Threats.**

  The "force" that makes the argument compelling in theory is the threat that *if I don't take now, you will take later*.
  *   **Observation 1 (Length):** Shows that the threat is psychologically limited. Players do not reason to the end; they reason a fixed "depth" ahead.
  *   **Observation 2 (Unknown End):** Shows that the threat is not calculated from the finish line backward, but from the start line forward. Players have an internal "trust horizon" (about 16 turns) regardless of the rules.
  *   **Observation 3 (Commitment):** Shows that the threat requires the *ability* to change your mind. If you bind your hands in advance, the threat vanishes, and cooperation returns.

  In all three cases, the payoffs are identical. What changes is the **viability of the threat to defect**.

  ### 2. Nearest Established Concepts

  #### A. The Centipede Game
  *   **What it is:** A sequential game where players alternate taking a growing pot or passing it to the other.
  *   **Where it fits:** This is exactly your game. The standard theoretical prediction (Backward Induction) is that the first player takes immediately.
  *   **Where your case departs:** Standard analysis assumes a **Fixed Horizon** (known number of turns). Your second alteration (Random/Undisclosed End) technically breaks the standard Backward Induction argument because there is no "last turn" to start the logic from. Yet, your players behaved *as if* there were a last turn. This departs from the standard model, which predicts that without a known end, the unraveling logic cannot even begin. Your data suggests players impose a *psychological* end where none exists.

  #### B. Backward Induction & Common Knowledge of Rationality
  *   **What it is:** The logic that "If I know you are rational, and you know I am rational, we can deduce the optimal move from the end of the game back to the start."
  *   **Where it fits:** This is the argument you explain. It holds logically in Observation 1.
  *   **Where your case departs:** It fails empirically in Observation 1 and 2. It fails logically in Observation 3. The departure in Obs 3 is crucial: Backward Induction requires **Sequentiality** (I move, then you move). By making players write down their turn in advance, you converted the game into a **Simultaneous Move** game. Backward Induction cannot operate in a simultaneous game because there is no "next turn" to anticipate. The "force" of the argument evaporated because the *time* to react was removed.

  #### C. Level-k Reasoning (Bounded Rationality)
  *   **What it is:** A model where players are not infinitely rational. A "Level-0" player acts randomly or naively. A "Level-1" player best-responds to Level-0. A "Level-2" player best-responds to Level-1, and so on.
  *   **Where it fits:** This explains Observations 1 and 2 perfectly.
      *   In the 6-turn game, players think roughly 2 steps ahead (Pass, Pass, Take).
      *   In the 20-turn game, they still think roughly 2-3 steps ahead relative to their trust limit, or they simply have a fixed cognitive horizon (e.g., "I trust up to turn 16").
      *   This explains why the stopping point is "pinned a fixed distance short of the end" in the fixed version, and why it lands on the same number in the random version. They are not counting down from $N$; they are counting up from 0 until their trust runs out.
  *   **Where your case departs:** Standard Level-k models usually assume a fixed structure. Your third observation (Commitment) shows that changing the *timing* of the decision changes the *level* of reasoning. When commitment is allowed, players jump to a high level of cooperation because the *risk* of being undercut is removed by the rules, not by trust.

  ### 3. Which fits best?
  The **Centipede Game** analyzed through **Bounded Rationality** fits best.

  However, the specific insight from your third alteration (the commitment notes) identifies the precise source of the "force" you are looking for. The force is **Sequential Leverage**.

  **Definition of the Mechanism:**
  **Sequential Leverage** exists when a player's optimal strategy depends on the *threat* of a future action that can be adjusted in response to the opponent's current action.
  *   **Condition 1:** Moves must be sequential (I see what you did before I decide).
  *   **Condition 2:** Players must have the freedom to change their plan (no binding commitment).
  *   **Condition 3:** There must be a finite horizon (or a perceived one).

  If any of these three conditions are removed, the "unraveling" argument loses its force.
  *   **Obs 1 & 2:** Condition 3 is manipulated (Fixed vs. Random). The unraveling weakens because the horizon is fuzzy, but Sequential Leverage still exists, so some unraveling happens (Turn 16-17).
  *   **Obs 3:** Condition 1 and 2 are removed (Simultaneous/Commitment). Sequential Leverage is zero. The unraveling disappears completely.

  ### 4. Addressing the Analogies

  **Your Brother-in-law (Prisoner's Dilemma):**
  *   **Verdict:** He is **structurally wrong** but **logically close**.
  *   **Why:** The Prisoner's Dilemma is typically a *simultaneous* game (we decide at the same time). Your game is *sequential* (I decide, then you decide). In a one-shot Prisoner's Dilemma, defection is dominant regardless of what the other does. In your game, passing is better *if* the other passes later. The "unraveling" in a *Repeated* Prisoner's Dilemma is similar to your game, but your third alteration (writing notes) turns your game *into* a simultaneous one, which is why cooperation returned. His intuition works for Obs 3, but not for Obs 1 & 2.

  **Your Friend (Unexpected Hanging):**
  *   **Verdict:** She is **logically right** but **categorically wrong**.
  *   **Why:** The Unexpected Hanging paradox relies on the same Backward Induction logic (It can't be Friday, so it can't be Thursday...). It fails for the same reason your game fails: the logical assumptions (about knowledge or rationality) do not hold in reality. However, the Hanging paradox is *epistemic* (about what can be known), whereas your game is *strategic* (about what can be gained). The failure in your game is due to human trust limits; the failure in the Hanging paradox is due to self-referential logic errors.

  ### 5. Hard Cases and Exclusions

  Since established concepts (Centipede, Level-k, Pre-commitment) cover your observations, no new term is strictly required. However, to satisfy your request for a tight definition to decide hard cases, we can define the phenomenon you are tracking as **"Unraveling via Sequential Leverage."**

  **Definition:** A game exhibits **Unraveling via Sequential Leverage** if cooperation collapses solely because players have the *opportunity* to defect later in response to earlier moves, assuming finite horizons and bounded rationality.

  **Cases this COVERS:**
  *   **Your Game (Standard):** Sequential, finite, no commitment. (Unraveling occurs).
  *   **Your Game (Random End):** Sequential, perceived finite, no commitment. (Unraveling occurs, limited by cognitive horizon).
  *   **Finite Repeated Prisoner's Dilemma:** Sequential moves, known end. (Unraveling occurs).

  **Cases this does NOT Cover:**
  *   **Your Game (Written Notes):** Simultaneous/Commitment. The *opportunity* to react is removed. (Unraveling does **not** occur).
  *   **Your Game (Shrinking Pot):** If passing *shrinks* the pot, the incentive to pass is removed by payoffs, not by threat structure. This is **Negative Sum Attrition**, not Sequential Leverage.
  *   **Your Game (Talking Allowed):** If players can talk and make binding verbal agreements (cheap talk), the structure changes. If the talk is non-binding, Sequential Leverage remains. If binding, it becomes a Contract Game.
  *   **Your Game (New Opponent Each Turn):** If each pass sends the turn to a *new* opponent, there is no specific person to threaten. This is a **Public Good Game** or **Chain Store Paradox** variant. Sequential Leverage requires a specific, recurring adversary to hold the threat over.

  ### Summary
  The "force" you cannot put your finger on is **Sequential Leverage**. The argument works only when players are free to react to each other over time.
  *   When you lengthen the game, you exceed the players' **Cognitive Horizon** (Level-k), so they stop unraveling at a fixed depth.
  *   When you hide the end, you remove the **Logical Anchor**, but the Cognitive Horizon remains.
  *   When you force pre-commitment, you remove the **Sequential Freedom**, destroying the leverage entirely.

  Your players are not irrational; they are reacting to the *structure of the threat*, not just the math of the pot. When you removed the ability to threaten (Obs 3), the math remained, but the game changed.
