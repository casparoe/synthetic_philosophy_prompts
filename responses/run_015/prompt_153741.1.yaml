answer: |-
  ### (1) The Principle

  The most robust principle capable of sustaining your five verdicts is **the Direction of Rational Accountability**. An Enlightenment practice is liberatory when it employs reason to make power accountable to the subject, treating the subject as a co-author of the norms governing them; it is dominating when it employs reason to make the subject accountable to power, treating the subject as an object to be optimized within a fixed framework. This distinction hinges not on the content of the rational claim (e.g., universal rights) but on the vector of agency: does the practice expand the subject's capacity to act upon the world and the rules binding them, or does it expand the administrator's capacity to act upon the subject?

  This principle maps cleanly onto your cases. Abolitionism (Case 1) is liberatory because it invokes universal rights to constrain the slaveholder's power and recognize the enslaved as rights-bearing authors of their own status, even if institutional recognition lagged. Beccaria (Case 3) and the *Encyclopédie* (Case 5) similarly limit arbitrary sovereignty and democratize epistemic authority, respectively. Conversely, the Civilizing Mission (Case 2) and Census systems (Case 4) are dominating because they utilize rational categories to render populations legible for extraction or assimilation; the colonized and the counted are treated as objects to be corrected or managed, not agents whose consent or self-description alters the rational framework itself.

  ### (2) Unlisted Cases

  Applying this principle to rational agronomy and land tenure suggests a verdict of **domination**. Historically, "scientific" agriculture often required enclosure and the consolidation of strips to make land legible for yield maximization, imposing external geometric logic on peasant practices without their authorship; this mirrors the Census case by prioritizing state/landlord extractive capacity over local agency. A second hypothetical, **mandatory standardized literacy campaigns**, reveals the principle's nuance: if the curriculum is imposed to create compliant workers (subject accountability to power), it is dominating; if it provides tools for workers to organize and contest contracts (power accountability to subject), it is liberatory. The technology is neutral; the vector of accountability determines the verdict.

  ### (3) The Hard Reconciliation

  Your opposing judgments on the abolitionist and civilizing-mission uses of universalism can be saved together, but only if you distinguish between **universalism as status** and **universalism as culture**. Abolitionism used universal reason to grant the enslaved the *status* of moral agents immediately, demanding the system change to accommodate their humanity; the universal was a shield protecting the subject from arbitrary power. The Civilizing Mission used universal reason to impose a specific *cultural* standard, denying the colonized agent status until they conformed to European norms; the universal was a sword wielded by the administrator. You need not overturn a verdict, but you must clarify that the liberatory potential lies in whether the universal expands the circle of *authors* (abolitionism) or merely the circle of *subjects* required to conform (civilizing mission).

  ### (4) Repair or Rejection of the Tentative Principle

  Your tentative principle regarding "reflexive revision" is normatively attractive but empirically fragile regarding Case 1. It fails because enslaved people in the 1790s possessed no institutional mechanism to contest or revise the laws binding them, yet you correctly judge abolitionism as liberatory; the *capacity* for revision was claimed normatively, not institutionalized practically. To repair this, shift the criterion from **institutionalized revision** to **presumed capacity for self-legislation**. A practice is liberatory if it presumes the subject is capable of reasoning and self-governance (even if denied), whereas it is dominating if it presumes the subject requires external management because their own reason is deficient. This preserves your intuition on the Census (subjects treated as data) and Encyclopédie (subjects treated as thinkers) while rescuing the Abolitionist case from the lack of actual institutional power.
