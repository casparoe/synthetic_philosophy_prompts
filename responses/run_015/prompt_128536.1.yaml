answer: |-
  The short answer is: **The stats guy is right.**

  This is not a matter of taste; it is a famous mathematical problem known as **Bertrand's Paradox**. In geometric probability, there is no such thing as a uniquely defined "random line" through a shape. Different ways of choosing the line result in different probability distributions, which lead to different estimates.

  Since your goal is to estimate **Area Fraction** (how much of the marsh is reed) using **Line Intercepts** (how much of your rope touches reed), there is only one method that makes the math work out correctly: **Isotropic Uniform Random (IUR)** sampling. This is the standard method used in stereology (the science of estimating 3D structure or 2D area from slices/lines).

  Here is the breakdown of why the choice matters, who is biased, and how to fix it without making field work impossible.

  ### 1. Why "Random" is Ambiguous (Bertrand's Paradox)
  Imagine a circle. If you ask three people to draw a "random line" through it, they might do exactly what your three crew members suggested:
  1.  **Random Chord (Your current method):** Pick two points on the edge.
  2.  **IUR (Stats guy):** Pick a random angle and a random distance from the center.
  3.  **Random Midpoint (Third person):** Pick a random spot inside for the middle of the line.

  These produce different distributions of lines.
  *   **Your Current Method** produces too many lines that pass through the center and not enough that skim the edges. It "over-samples" the middle of the marsh.
  *   **The Third Person's Method** gives equal weight to a 10-meter line near the edge and a 200-meter line through the center. Statistically, the 200-meter line represents more "sampling opportunity" and should be weighted more heavily.
  *   **The Stats Guy's Method (IUR)** ensures that the probability of a line hitting any specific part of the marsh is proportional to the area of that part. This is the **only** condition under which $\frac{\text{Length of Reed}}{\text{Total Length}} = \frac{\text{Area of Reed}}{\text{Total Area}}$.

  ### 2. Does it actually change your numbers?
  **Yes, significantly.**

  You mentioned the reed "creeps in from the edges."
  *   **Your Current Method:** Because picking two random edge points tends to create lines that cluster toward the center of the marsh (imagine all the ways to connect points on the north side vs. connecting north to south), you are spending more of your walked distance in the center of the marsh than is proportional to the area.
  *   **The Result:** Since the reeds are at the edge and your lines over-sample the center, **your current method is likely underestimating the reed coverage.**
  *   **The Magnitude:** Depending on the shape and the width of the reed border, the bias could easily be 10–20% or more. In grant reporting, that is the difference between "manageable nuisance" and "ecological crisis."

  ### 3. How to settle this non-arbitrarily
  You don't need to take the stats guy's word for it; you can appeal to the principle of **Stereology**. The fundamental theorem states that for line intercepts to estimate area fraction unbiasedly, the test lines must be **Isotropic (random orientation)** and **Uniform Random (positioned such that every point in the area has an equal probability of being intersected, weighted by line density).**

  Method B (Stats Guy) is the only one that satisfies the "Uniform Random" condition for lines.

  ### 4. Practical Field Solution (How to do it in the mud)
  The stats guy's suggestion ("random distance from the centre") is theoretically correct but practically annoying for an irregular marsh. Finding the exact geometric center of a blob-shaped marsh in the field is hard.

  Here is a field-friendly protocol that satisfies the Stats Guy's math without needing a perfect circle:

  **The "Bounding Box" Method:**
  1.  **Define a Box:** Imagine a square or rectangle that completely contains the marsh (you can do this on a map/GPS beforehand).
  2.  **Random Bearing:** Pick a random compass bearing (0–180°).
  3.  **Random Offset:** Pick a random distance along the perpendicular axis of that bearing that spans the bounding box.
      *   *Easier version:* Just run North-South lines. Pick a random Easting coordinate (X) within the bounding box. Walk that line. If it hits the marsh, measure the segment inside.
  4.  **Repeat:** Do this for $N$ lines.
  5.  **Calculate:** Sum of reed lengths / Sum of total marsh lengths.

  **Why this works:** By randomizing the position of the line across the *bounding box* (not just the marsh edge), you ensure that the lines are uniformly distributed over the space. Restricting the measurement to "only the bit inside the marsh" is standard practice and remains unbiased.

  ### 5. An Even Easier Alternative: Point Sampling
  If the goal is strictly **Area Fraction** (what % of the marsh is reed), line transects are actually more work than necessary.
  *   **Method:** Generate random GPS coordinates within the marsh boundary.
  *   **Action:** Go to that point. Record "Reed" or "Not Reed."
  *   **Math:** The fraction of points that are Reed = The fraction of Area that is Reed.
  *   **Benefit:** This avoids the "random line" paradox entirely. It is inherently unbiased for area fraction and often faster in difficult terrain (no need to lay rope, just check a spot).

  ### Summary Recommendation
  1.  **Stop the Edge-to-Edge method.** It is biased against edge-dwelling plants and will underestimate your invasive species coverage.
  2.  **Adopt the Stats Guy's logic (IUR).** It is the only mathematically valid way to use line intercepts for area estimation.
  3.  **Simplify the Field Protocol.** Don't measure from the marsh center. Use a **random bearing and a random offset from a fixed baseline** (or a bounding box).
  4.  **Consider Point Sampling.** If you haven't collected too much data yet, switching to random points is statistically robust and logistically simpler for area fraction.

  **The Verdict:** The stats guy is right. The choice is not taste; it's bias. Switch methods before you publish numbers that underestimate the invasion.
