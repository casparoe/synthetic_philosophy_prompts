          *   *Consequentialism:* Compatible with "soft" consequentialism (intention aims at good results).
          *   *Mixed States:* Harder. If the intention is "tainted," the karma is tainted.

      *   *Thesis 3: The Soteriological/Teleological Claim.* Focus on the goal (liberation). Intention shapes the mind-stream.
