  4.  **Fleshing out the Details (Iterative Refinement):**

      *   *Refining Thesis 1 (Abhidharma):* Make sure to distinguish between *karma* (the act of will) and *karma-phala* (the fruit). The classmate conflates moral quality with karmic fruit.
      *   *Refining Thesis 2 (Normative):* Use the distinction between *action* (kriya) and *karma*. The physical act might be "killing," but the karmic weight depends on cetana. However, consequences still determine the *severity* of the ripening.
      *   *Refining Thesis 3 (Mahayana/Upaya):* This is crucial for the parable. The classmate says "no consequentialism." But the parable is *justified* by the consequence (saving 500). So the classmate is wrong even on her own ground. I need to highlight this irony.
      *   *Addressing "Mixed States":* This is a key constraint. Abhidharma says mental moments are rapid. Can compassion and aversion coexist in the same *citta*? Usually no, they are opposites. But they can alternate rapidly. Or there can be "mixed karma." I need to be precise here.

