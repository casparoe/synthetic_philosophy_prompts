      *   I need to break this down into philosophical layers.

  3.  **Drafting the Theses (The Menu):**

      *   *Thesis 1: The Abhidharmic Ontological Claim.* Focus on what karma *is*. Karma is volition, not the physical movement.
          *   *Status:* Definitional/Textual.
          *   *Consequentialism:* Doesn't necessarily rule it out (results still matter for vipaka).
          *   *Mixed States:* Abhidharma is very granular about co-existing cetasikas.

      *   *Thesis 2: The Normative Evaluation Claim.* Focus on how we *judge* the action. Intention is the primary criterion for blameworthiness.
