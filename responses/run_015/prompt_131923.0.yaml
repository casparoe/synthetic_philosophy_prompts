answer: |-
  This is a sophisticated philosophical pivot point. Your classmate is committing a category error common in introductory Buddhist ethics: she is conflating an ontological claim about the *nature* of karma (what it *is*) with a normative claim about *evaluation* (what makes it right or wrong), and further conflating both with a claim about *justification* (why an action is permitted).

  The slogan "intention is karma" (*cetana ahaṃ bhikkhave kammaṃ vadāmi*, AN 6.63) is textually authoritative, but her inference that this eliminates consequentialism is not. Below is a menu of four distinct readings of that slogan. You can use these to disaggregate her argument and show that even if we accept "intention is karma," the parable remains deeply consequentialist, and the purity of the intention is far more fragile than she assumes.

  ### 1. The Abhidharmic Ontological Thesis
  *   **Core Claim:** Karma is not the physical movement of the body or speech, but the volitional impulse (*cetana*) that precedes and motivates it. Physical killing is merely the *manifestation* of karma, not karma itself.
  *   **Classification:** **Definitional.** This is the standard Abhidharmic position (e.g., *Abhidharmakośa*). It distinguishes the *karma-patha* (course of action) from the *karma* (volition).
  *   **Implication for Consequentialism:** **Does Not Support Dismissal.** This thesis defines the *locus* of karma, not its *moral valence*. While the intention generates the karmic seed, the *vipāka* (ripening/fruit) is heavily dependent on the consequence (e.g., whether the victim died, their spiritual stature, etc.). One can hold that intention is the cause while admitting consequences determine the magnitude of the effect.
  *   **Accommodation of Mixed States:** **Low.** Abhidharma psychology is granular. In a single mind-moment (*citta*), wholesome (*kuśala*) and unwholesome (*akuśala*) factors generally exclude one another. However, intentions fluctuate rapidly. If a trace of aversion (*dveṣa*) arises even momentarily during the act, a distinct unwholesome karma is generated alongside the wholesome one. The "verdict" is not singular; it is a complex ledger of multiple karmic seeds.

  ### 2. The Normative Evaluation Thesis
  *   **Core Claim:** The moral quality (wholesome vs. unwholesome) of an action is determined exclusively by the root motives (*mūla*) present in the intention, not by the external outcome.
  *   **Classification:** **Defensible (with caveats).** This aligns with the virtue-ethical reading of Buddhism (e.g., Damien Keown). A compassionate intention makes the act *karmically* wholesome, even if the outcome is tragic.
  *   **Implication for Consequentialism:** **Supports Dismissal (Superficially).** If moral quality is strictly internal, then the "goodness" of saving 500 merchants is irrelevant to the *karmic quality* of the captain's mind.
  *   **Accommodation of Mixed States:** **Very Low.** This is the weak point in your classmate's argument. For the act to be purely wholesome under this thesis, the intention must be *purely* compassionate. If there is a trace of attachment to the outcome (e.g., "I must save them to be a good Bodhisattva") or aversion to the robber ("He is evil"), the root motive is tainted. In Theravāda and standard Mahāyāna ethics, a tainted intention renders the karma "mixed" or unwholesome, regardless of the "compassionate" label.

  ### 3. The Soteriological Teleology Thesis
  *   **Core Claim:** "Karma" refers specifically to that which binds one to saṃsāra. Therefore, the moral quality is determined by whether the intention reinforces or dismantles cognitive grasping (*upādāna*).
  *   **Classification:** **Defensible.** This reads "karma" through the lens of liberation (*nirvāṇa*) rather than mundane morality.
  *   **Implication for Consequentialism:** **Refutes Dismissal.** This actually reintroduces a form of consequentialism, but shifts the "consequence" from worldly welfare (saving merchants) to spiritual welfare (reduction of suffering/grasping). The captain's act is evaluated by its consequence on the mind-streams of all involved (the robber avoiding hell, the merchants living, the captain's own non-attachment).
  *   **Accommodation of Mixed States:** **None.** This is the strictest reading. If the captain acts with a trace of self-cherishing or dualistic thinking (killer vs. victim), the act reinforces saṃsāra. The "verdict" is binary: either it is liberating (pure *prajñā* and *karuṇā*) or it is binding. A trace of aversion makes it binding.

  ### 4. The Mahāyāna *Upāya* (Skillful Means) Thesis
  *   **Core Claim:** For a high-level Bodhisattva, conventional ethical precepts (like non-killing) can be transcended if the intention is grounded in emptiness (*śūnyatā*) and great compassion (*mahākaruṇā*).
  *   **Classification:** **Overreach (if generalized).** This is specific to the *Upāya-kauśalya Sūtra* context and applies to Bodhisattvas on high *bhūmis* (grounds), not ordinary moral agents.
  *   **Implication for Consequentialism:** **Refutes Dismissal (Ironically).** The parable is *explicitly* consequentialist. The Buddha justifies the killing *because* it saves 500 lives and prevents the robber from committing a heinous crime (karmic suicide). The classmate claims consequences don't matter; the Sūtra says the consequences are the *only reason* the transgression is permitted.
  *   **Accommodation of Mixed States:** **Zero.** This is the critical vulnerability in your classmate's argument. The *Upāya* exception requires the Bodhisattva to be willing to endure hell for the act. If there is a trace of aversion toward the robber or attachment to the "success" of the rescue, it is not *upāya*; it is just killing. The "karmic verdict" hinges on the absolute purity of the mind. If the captain feels *any* hostility, the *upāya* defense collapses, and he incurs full negative karma.

  ### Strategic Summary for Discussion

  When you reply, you might structure your intervention around the **Mixed States** constraint. Your classmate's argument relies on a binary switch: *Compassionate Intention = Wholesome Karma.*

  You can challenge this by asking:
  1.  **On Definition:** "Are we defining karma as the *seed* (intention) or the *fruit* (consequence)? If the fruit matters for ripening, doesn't the consequence matter ethically?"
  2.  **On Purity:** "Under the *Upāya* reading, the text specifies the captain must be willing to go to hell. Does that imply that if he felt even a micro-moment of aversion toward the robber, the act becomes unwholesome? If so, isn't the 'intention' criterion far stricter than you are allowing?"
  3.  **On Consequentialism:** "The Sūtra justifies the act *because* 500 lives are saved. If the consequence were neutral (saving no one), would the killing still be wholesome? If not, then the consequence is doing the justificatory work, making the ethics consequentialist despite the intentionalist metaphysics."

  This menu allows you to grant her the textual authority of "intention is karma" while dismantling the philosophical conclusion she draws from it.
