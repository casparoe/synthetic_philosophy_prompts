answer: |-
  You are correct that the argument stalled on definitions, but the Spandrels paper provides the philosophical architecture to explain why that definitional clash matters. Here is the case analysis using Gould and Lewontin (G&L) as the lens.

  **1. The Mapping**
  G&L attacked the "Adaptationist Programme," where researchers assume every trait exists because it was selected for a specific utility. They argued this ignores byproducts (spandrels) and constraints. ENCODE did not tell adaptive stories about every base pair; they didn't claim introns exist to regulate temperature. However, they committed the deeper epistemic error G&L identified: conflating *causal role* with *selected effect*.

  By defining "functional" as "biochemically active," ENCODE assumed that if a protein binds there, evolution put it there for that binding. G&L would predict this exact confusion. They argued that just because a trait *does* something now (or interacts with something) doesn't mean it was selected *for* that thing. Transcription can be noisy; binding can be non-specific. If you assume every biochemical interaction is a selected feature, you are treating the genome as a perfect optimization engine where nothing exists without a purpose. That is the Panglossian move: assuming the current state is the optimal intended state.

  Is the fit perfect? No. ENCODE wasn't inventing stories; they were measuring activity. But the *interpretation* that 80% functionality implies only 20% junk is Panglossian because it assumes noise is impossible or negligible. G&L's specific complaint about "atomization" lands hard here: treating every biochemical event as an independent unit of function ignores the systemic reality that much activity is just chemical friction.

  **2. The Distinction**
  Your code analogy is robust but requires one biological correction. In engineering, you have:
  1.  **Dead Code:** Never executed, never touched. (Biological equivalent: Pure junk DNA, no binding, no transcription).
  2.  **Instrumented Code:** Touched by linters or coverage tools, but deleting it changes nothing in the output. (Biological equivalent: Biochemically active but neutral. Transcriptional noise, non-specific binding).
  3.  **Load-Bearing Code:** Deleting it breaks the build. (Biological equivalent: Constrained sequences under purifying selection).

  ENCODE defined function as Category 2. Evolutionary biologists define function as Category 3. In biology, "there for a reason" cashes out to "historical selection." A sequence is functional if mutations there were historically weeded out because they reduced fitness.

  Where the analogy breaks: Code has a designer who intends utility. Biology has no designer; it has a filter (selection). "Function" in biology is backward-looking (was this preserved?), whereas your engineering definition is forward-looking (what does this do?). ENCODE measured what the genome *does* now; evolutionary biologists care about why the genome *is* here. A transposon might be biochemically active (Category 2) but is only "there" because it copied itself, not because it helps the organism.

  **3. Theory Impact**
  (a) **Three Buckets:** Yes, the debate merges three distinct categories into two. The buckets are: **Junk** (no effect), **Spandrels** (biochemically active/exapted but not selected for origin), and **Adaptations** (selected for current utility). ENCODE collapsed Spandrels into Adaptations. Evolutionary biologists often collapse Spandrels into Junk. The middle ground is where exaptation lives—sequences that were noise but became useful later.
  (b) **Inverted Panglossianism:** The "selfish DNA" argument isn't Panglossian for the *organism*, but it is adaptationist for the *sequence*. It explains the DNA's presence via selection, just at a lower level. Mutation-load arguments are not Panglossian; they are constraint-based. They argue that if 80% were load-bearing, the mutation rate would be too high for the species to survive. This is a physical limit, not a story about utility.
  (c) **Quantitative Silence:** Spandrels is a critique, not a metric. It tells you why assuming 100% function is wrong, but it cannot tell you if the number is 3% or 15%. It warns against the upper bound, but the lower bound must come from data.

  **4. Settlement and Epistemics**
  To split the gap between 80% and 3%: The definitional fight is settled (activity $\neq$ selection). The empirical fight is how much activity correlates with selection.
  What moves a genomicist?
  *   **Deletion Studies:** If you delete a 500kb region and the mouse is fine, it wasn't load-bearing. (Strong evidence, but expensive).
  *   **Comparative Genomics:** If a base is identical across mammals after 100 million years, it's constrained. (Strong evidence for function, misses human-specific functions).
  *   **Mutation Load:** If 80% were essential, we'd all be dead from genetic errors. (Theoretical ceiling, very strong).

  **Epistemic Status**
  Your framing is accurate. The consensus is that the 80.4% figure is factually correct regarding biochemical events, but misleading regarding evolutionary function. The serious estimate for selected constraint remains around 3–15%, depending on whether you count regulatory regions. The "junk DNA" concept is not dead; it has been refined to distinguish between "no biochemical effect" and "no selective value."

  Regarding G&L themselves: Daniel Dennett did criticize the architectural history. The spandrels of San Marco were actually designed to hold the dome; they weren't accidental byproducts. G&L conceded this factual error. However, the biological community largely regards this as irrelevant to the logical point. The concept of a non-adaptive byproduct remains valid even if the Venetian example was flawed. The critique of adaptationism is taken seriously, though modern biologists argue G&L overstated the case; adaptation is common, just not universal. The field has moved to a pluralistic view: some DNA is junk, some is spandrel, some is adaptation. The fight is no longer about whether junk exists, but about the proportions.

  Your intuition was correct: you were arguing past each other. ENCODE measured the machine running; the evolutionary biologists measured the blueprint's intent. Both are real, but only one explains why the blueprint looks the way it does.
