prompt: |-
  I'm giving the toast at my editor's retirement dinner. She spent thirty years writing about Rousseau's views on theater -- the argument that the stage is where we practice a kind of safe self-deception, where we admire virtue from a distance instead of feeling it, and where the audience's pleasure depends on staying just far enough away from the characters to keep us cold. The wrinkle is that she also ran a community theater for two decades and was genuinely, visibly happy doing it, so the toast can't just be "she was right about theater and the rest of you are fools for watching it." Half the room are theater scholars who will catch every reference to Pygmalion and his two little plays; the other half are her family and they just want to be told she was a good person. Write a five-minute toast that builds on the real tension between what Rousseau argued and what she actually did with her hands, and that lands as affection rather than as a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for an editor.
      *   **Subject's Expertise:** 30 years writing about Rousseau's views on theater (specifically *Letter to M. d'Alembert on the Theatre*).
      *   **Key Rousseau Argument:** Theater is safe self-deception; we admire virtue from a distance rather than practicing it; audience pleasure depends on emotional distance/coldness.
      *   **The "Wrinkle"/Contradiction:** She ran a community theater for 20 years and loved it.
      *   **Audience:** 50% Theater scholars (know Rousseau, *Pygmalion*, the two little plays), 50% Family (just want to hear she's a good person).
      *   **Tone:** Affectionate, not lecturing. Needs to resolve the tension between her scholarship and her life.
      *   **Length:** Five minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Tension:**
      *   *Rousseau's View:* Theater makes us passive spectators of virtue. It isolates us in the dark.
      *   *Her Life:* She actively *made* theater (community theater is collaborative, messy, close). She brought people together.
      *   *The Resolution:* She didn't just study the theory; she tested it against reality. She proved that theater *can* be active virtue, not just passive observation. She bridged the gap between the page and the stage, between the critic and the creator.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the dual nature of the room (scholars + family). Establish her professional legacy (Rousseau).
      *   **The Rousseau Hook:** Briefly explain the "cold" theory of theater without getting too bogged down in jargon. Use the "distance" metaphor.
      *   **The Twist:** Introduce the community theater work. Contrast the "cold scholar" with the "warm director."
      *   **The Synthesis (The Core Argument):** How did she reconcile these? She didn't prove Rousseau right; she proved him incomplete. She used theater to *practice* virtue, not just watch it. Community theater *requires* closeness, not distance.
      *   **Specific References (for the scholars):** Mention *Pygmalion* or the *Letter to d'Alembert* lightly. Maybe a nod to her editing precision.
      *   **Specific Sentiments (for the family):** Talk about her warmth, her generosity, her "editing" of people's lives (in a good way).
      *   **Closing:** A raise of the glass. Wishing her well in the "next act."

  4.  **Refining the Tone:**
      *   *Avoid:* Sounding like a conference paper. Don't say "As we know from the *Lettre à d'Alembert*..."
      *   *Include:* Warmth, humor, personal touch.
      *   *Key Phrase Idea:* "She didn't just write about the light; she turned it on."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. [Name] studied Rousseau. He said theater is bad because we sit in the dark and pretend to be good. But [Name] ran a community theater. She loved it. So was she a hypocrite? No. She showed that theater brings us together. The scholars know her footnotes. The family knows her heart. Both are true. She edited texts and lives. Cheers.

      *Critique 1:* Too blunt. Needs more poetry. Needs to address the "distance" argument more gracefully. Needs to feel like a toast, not a summary.

  6.  **Drafting - Iteration 2 (Adding Texture):**
      Start with the idea of "distance." Rousseau says we need distance to enjoy tragedy. [Name] spent 30 years analyzing that. But then she went to the community center and hugged actors. She didn't keep her distance. For the scholars: I know you know the *Pygmalion* references. For the family: She's just a great mom/grandma. She proved that art isn't about watching virtue, it's about doing it.

      *Critique 2:* Better. Now I need to weave the specific Rousseau concepts (pity vs. virtue, the spectator) into the narrative of her life. I need to make sure the family doesn't feel lost when I mention Rousseau.

  7.  **Finalizing the Content (incorporating the prompt's specific constraints):**
      *   *Rousseau's specific argument:* "Safe self-deception," "admire virtue from a distance," "keep us cold."
      *   *Her specific work:* "Community theater," "visibly happy."
      *   *Audience check:* Ensure the scholars get a wink (Pygmalion reference) but the family gets the emotional core.
      *   *Length check:* Keep it tight.

  8.  **Writing the Toast (incorporating the "Editor" aspect):**
      *   She's an *editor*. That means she shapes things. She shapes text, but she also shaped productions.
      *   Metaphor: Editing is cutting away the excess to find the truth. Theater is doing the same.
      *   Ending: The "next act" cliché is unavoidable but can be refreshed.

  9.  **Polishing the Language:**
      *   Make sure the transition from "cold theory" to "warm practice" feels earned.
      *   Use the metaphor of "light." Rousseau liked the open air; she brought light to the stage.
      *   Ensure the "safe self-deception" line is used but subverted.

      *(Self-Correction during drafting)*: Wait, Rousseau's *Pygmalion* is a melodrama/scene lyrique. It's one of his "two little plays" mentioned in the prompt. I should reference that subtly. The prompt mentions "Pygmalion and his two little plays." I need to make sure I don't confuse Shaw's *Pygmalion* with Rousseau's. I will stick to Rousseau's *Pygmalion* to keep the scholars happy.

      *Revised Plan:* Focus on the idea that she refused to stay in the "spectator's seat."

  10. **Final Review against constraints:**
