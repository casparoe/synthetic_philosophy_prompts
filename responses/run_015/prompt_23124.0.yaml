answer: |-
  Good evening, everyone.

  For those of you who don't know me, I've had the privilege of working with [Editor's Name] for the last [Number] years. And for those of you who *do* know her—whether you know her as the sharp-eyed editor who saved your thesis from itself, or as the aunt who sends the best birthday cards, or as the woman who once directed a production of *The Mikado* in a high school gymnasium with zero budget and infinite grace—you know that [Editor's Name] is a woman of distinct contradictions.

  We are here to celebrate thirty years of her scholarship. Specifically, thirty years of thinking about Jean-Jacques Rousseau and his suspicion of the stage.

  For the family members in the back: Rousseau was an 18th-century philosopher who had some very strong, very grumpy opinions about theater. He argued that when we sit in a dark room and watch a play, we are practicing a kind of safe self-deception. He said we admire virtue from a distance. We cry for the hero on stage so we don't have to help the neighbor next door. He believed the audience's pleasure depends on staying just far enough away from the characters to keep us cold, safe, and passive.

  And for the scholars in the front: Yes, I know she knows the *Lettre à d'Alembert* better than she knows her own phone number. Yes, we know she can recite the nuances of *Pygmalion* and the two little plays in her sleep. She has spent three decades analyzing the argument that the theater is a place where morality goes to sleep.

  But here is the wrinkle. Here is the thing that makes [Editor's Name] who she is.

  While she was writing, with meticulous precision, about how the theater keeps us distant, she was spending her weekends and evenings doing something that required her to be as close to people as physically possible. For twenty years, she ran a community theater.

  I have seen her in that space. I have seen her not in the spectator's seat, where Rousseau says we belong, but in the wings. I've seen her holding a spotlight steady because the clamp broke. I've seen her sewing a costume while an actor cried about a breakup in the dressing room. I've seen her visibly, radiantly happy, covered in glitter and glue, surrounded by a chaos of humanity that was anything but cold.

  Rousseau argued that the stage is where we practice self-deception. But [Editor's Name] proved that the stage can be where we practice truth.

  Rousseau said we admire virtue from a distance. But community theater doesn't allow for distance. You cannot build a set alone. You cannot hold a scene together without listening, really listening, to the person standing opposite you. In her theater, there was no "safe distance." There was only the messy, terrifying, wonderful work of collaboration.

  She didn't just write about the light; she turned it on.

  There is a tension there, certainly. But I don't think it's a contradiction. I think it's an edit.

  As an editor, [Editor's Name]'s job was to take a text, find the heartbeat inside it, and cut away everything that obscured the truth. She treated Rousseau's texts with respect, but she treated human beings with love. She read Rousseau's warning that theater makes us passive spectators, and she decided to test the hypothesis. And her data set—thousands of actors, decades of productions, countless late nights—proved the theory incomplete.

  She showed us that you can look at the stage and see a mirror, not just a window. She showed us that you can watch a play and feel called to action, not sedated by pity.

  To the scholars here: She never stopped being a rigorous critic. She knew the arguments. But she refused to let the arguments win over the experience.

  And to the family: She is exactly who you think she is. The woman who loved those plays is the same woman who loved you. She didn't compartmentalize her intellect and her heart. She used her mind to understand the world, and she used her hands to make it better.

  So, as she retires, she leaves us with a final lesson. It is easy to sit in the dark and analyze the light. It is much harder to stand up, walk into the glare, and start building something.

  [Editor's Name], you have spent thirty years telling us how to read the script. Now, you get to write the next act yourself. And knowing you, it won't be a tragedy, and it won't be a cold comedy of manners. It will be something warm, something alive, and something true.

  Please raise your glasses.

  To [Editor's Name]. May your retirement be free of footnotes, full of applause, and may you never, ever have to sit in the dark again.

  Cheers.
