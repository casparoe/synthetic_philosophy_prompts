answer: |-
  Elena stands on a shrinking circle of stable ice in the middle of a frozen lake. The sheet beneath her feet is audibly cracking; within moments, staying put guarantees immersion in freezing water, an outcome she has overwhelming reason to avoid. Directly to her left and right, at equal distance, lie two identical patches of thick, safe ice. There is no wind, no slope, no difference in texture or lighting, and the crack expands uniformly so time pressure applies equally to both. She cannot stay, but the choice between Left and Right is perfectly symmetric across every dimension she values.

  **View One** holds that a general reason to act is sufficient. Rationality is fundamentally about maximizing expected utility; since both jumps yield high utility and staying yields disaster, rationality demands she jump. Which patch she lands on is rationally arbitrary, but the act of jumping itself is mandated by the value difference between *moving* and *staying*. **View Two** argues that a general reason is insufficient. Rational action requires a comparative justification for *this* specific token action over *that* one. Since there is no reason to jump Left rather than Right, neither specific move is rationally permissible. Without a directional reason to break the tie, the agent remains in the default state (stasis); staying put is not irrational, it is the only outcome consistent with a lack of sufficient reason.

  The feature doing the work is the **separation of motivation from selection**. The agent is motivated to leave the status quo but lacks a selector for the destination. Adding a deadline or a tiny cost difference dissolves the case rather than solving it; a deadline introduces a meta-reason (e.g., "minimize deliberation time"), and a cost difference creates a directional preference. Both smuggle in the directional reason the case was designed to exclude, converting a symmetry problem into a standard maximization problem.

  View Two comes out badly, as it prescribes paralysis in the face of obvious disaster. A defender of View Two would attack the case as **psychologically impossible**: no human ever faces perfect symmetry (e.g., handedness, slight weight shifts always break ties). They would argue the case describes a broken will, not a rational dilemma. This attack lands on the *empirical* plausibility but fails on the *normative* point: even if such symmetry is rare, a theory of rationality should tell us what to do if it *were* possible, and "freeze and die" remains an intolerable recommendation.
