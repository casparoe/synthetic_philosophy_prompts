prompt: |-
  Build me a decision case that pulls a reason to act in general apart from a reason to act in a particular direction. Setup: an agent has an overwhelming reason to do something right now — staying put is genuinly terrible for it — but the actions available to it are perfectly symetric on every dimension it cares about. No hidden tiebreaker, no cost difference between them, no deadline that breaks the symmetry, no "pick by five or both vanish." The point is to isolate whether a rational agent can be moved by a reason that has no direction. Keep it realistic (a person, not a starved donkey) and about a paragraph long.

  Then walk through what each of two views says. View one: a reason to act in general is enough to generate an action — the agent acts, and which symmetric option it picks is just arbitrary, but it isn't irrational to pick. View two: a reason to act in general is not enough — without a directional reason there's no rational motion in any specific direction, so the agent stays put, and that's not irrational, it's just what perfect symmetry looks like from the inside. Tell me which feature of the case is doing the work, and whether adding a deadline or a tiny cost difference changes the case or just smuggles back in the directional reason I told you to leave out. Finish with how a defender of whichever view comes out badly would attack the case, and whether the attack actually lands.
