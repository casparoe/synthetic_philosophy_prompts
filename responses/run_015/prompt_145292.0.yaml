      *   *Selection:* **The Double Pendulum** is the standard physics example, but **The River/Whitewater** analogy is better for the Climate/Weather distinction and the "flow" of time. Actually, let's go with **The Digital Computer Simulation**. It directly addresses the "finite precision" argument. If you simulate chaos on a computer, rounding errors *create* divergence. This proves the "finite precision" point isn't just measurement error, it's structural.
