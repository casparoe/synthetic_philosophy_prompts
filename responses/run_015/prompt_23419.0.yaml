answer: |-
  It is completely understandable that you feel uneasy about the 50/50 proposal. Your intuition is correct: in negotiation theory and economics, "equal hours" is rarely the primary determinant of value division when "outside options" (what you can get if you walk away) differ significantly. You are not being greedy; you are recognizing a difference in leverage.

  Since you asked for a formal analysis, I will walk you through the specific game theory models that apply to this situation. These models treat your outside offers as your **BATNA** (Best Alternative to a Negotiated Agreement).

  Here is the breakdown of the numbers we are working with:
  *   **Total Value of Cooperation:** $60,000
  *   **Your BATNA:** $30,000
  *   **Friend's BATNA:** $5,000
  *   **The Surplus:** This is the extra money created by working together rather than walking away. Calculation: $60,000 - ($30,000 + $5,000) = **$25,000**.

  Below are the three relevant frameworks, the specific split each recommends, and whether your friend's argument holds up under them.

  ### 1. The Nash Bargaining Solution
  **Recommended Split:** **You: $42,500 | Friend: $17,500**
  **Reasoning:** This standard economic model dictates that you should each secure your walk-away value first, and then split the remaining *surplus* ($25,000) equally, resulting in you keeping your $30k base plus half the surplus ($12.5k).
  **Is 50/50 defensible here?** **No.** A 50/50 split gives your friend $12,500 *more* than this model suggests and leaves you with exactly your walk-away value, meaning you gain nothing from the partnership despite creating the joint surplus.

  ### 2. The Shapley Value
  **Recommended Split:** **You: $42,500 | Friend: $17,500**
  **Reasoning:** This method calculates your average marginal contribution to the pot; since you bring $30k to an empty table and he brings $5k to an empty table, but together you create $60k, your average contribution across all scenarios is higher.
  **Is 50/50 defensible here?** **No.** In a two-person game with transferable utility, the Shapley Value usually matches the Nash Bargaining Solution, confirming that leverage (outside options) dictates the split more than hours worked.

  ### 3. Equality of Effort (Social Norm)
  **Recommended Split:** **You: $30,000 | Friend: $30,000**
  **Reasoning:** This is your friend's proposal, which ignores outside options and instead relies on the social norm that equal time invested entitles partners to equal reward regardless of market value.
  **Is 50/50 defensible here?** **Yes, but only socially.** This is not a game-theoretic solution; it is a relationship norm. It is defensible *only* if you view yourselves as equal partners in a friendship first and business collaborators second, where preserving equity matters more than maximizing individual profit.

  ***

  ### The "Hours" Argument vs. Value
  Your friend's argument relies on **inputs** (hours worked), while game theory relies on **outputs** (value created and leverage). In business, compensation is rarely tied to hours; it is tied to value and risk. If you spent 100 hours coding a feature that generates $1 million, and he spent 100 hours designing a feature that generates $0, the market does not value those hours equally.

  However, there is a catch. Game theory assumes your $30,000 offer and his $5,000 offer are **credible threats**.
  *   **Reality Check:** If you actually walk away to take the $30,000, does the $60,000 deal disappear completely? (Likely yes).
  *   **Reality Check:** If you walk away, can he *actually* realize the $5,000 without your code? (Often, design assets and customer relationships are worthless without the functional app, meaning his real BATNA might be $0, not $5,000).

  If his real BATNA is $0, the Nash Bargaining Solution shifts even further in your favor (You: $45,000 | Friend: $15,000). However, challenging the validity of his $5,000 number will likely feel aggressive and damage the friendship.

  ### Advice for the Friendship
  You are a high school junior, and this is your friend since middle school. While the game theory clearly supports a split closer to **$42,500 / $17,500**, enforcing that strictly might cost you the friendship. $12,500 is a significant amount of money, but so is a long-term friendship.

  Here is a suggested approach for the conversation:

  1.  **Acknowledge the Partnership:** Start by validating his work. "I know we put in equal hours, and I value your design and marketing work immensely."
  2.  **Introduce the Leverage Gently:** Instead of quoting "Nash Bargaining," explain it simply. "I've been looking at the numbers, and since I have a $30k offer on the table for the code, my risk in this deal is higher. If this deal falls through, I lose $30k, but you only lose $5k."
  3.  **Propose a Compromise:** The gap between his proposal ($30k) and the theoretical optimal ($42.5k) is $12,500. Consider meeting in the middle.
      *   **The "Friendship Discount":** You could propose a **60/40 split** ($36,000 for you, $24,000 for him).
      *   **Why this works:** It acknowledges your higher leverage (you get more than 50%) but acknowledges the friendship and his effort (you give up $6,500 of your theoretical maximum to ensure he feels valued).
  4.  **Frame it as "Risk" not "Greed":** Make sure he understands you aren't trying to take his money, but rather that the division needs to reflect the different risks you each take by agreeing to this deal instead of your other options.

  **Summary:** The formal theories recommend **$42,500 for you and $17,500 for him**. Your friend's 50/50 argument is not supported by negotiation theory, but it is supported by social norms. To protect the friendship, consider using the theory as leverage to negotiate a **60/40 split**, which honors your contribution without maximizing it at his expense.
