  # Committee on Historical Commemoration: Decision Procedure v1.0

  ## Purpose
  This procedure is designed to move the committee from abstract debates about "presentism" to concrete, evidence-based recommendations. It separates historical facts (what happened then) from institutional values (what we stand for now) and practical constraints (what we can actually do).

  ## The Procedure

  **Note on Evidence:** For any step marked **Fact**, the Graduate Research Assistant (RA) must provide a specific document type. If the RA reports "No record found after 6 hours of search," treat the answer as **No**. Do not speculate on what might be in an archive we didn't check.

  **Note on "Peer Comparison":** The question "Was he worse than his peers?" is **excluded**. It is irrelevant. The only comparison that matters is between the individual's actions and the objections available *at the time*.

  ---

  ### Step 1: The Availability Test (Fact)
  **Question:** Was there a credible public objection to this specific conduct *at the time* the conduct occurred?
  *   **Sufficient Answer:** **Yes** if the RA produces newspapers, pamphlets, letters, or meeting minutes from the era showing contemporaries criticized the specific behavior (e.g., child labor, eugenics, marketing practices). **No** if the record shows general acceptance or silence.
  *   **Stop Condition:** If **No**, the recommendation defaults to **Retain with Context**. (Rationale: We do not remove names based on standards the person could not have accessed).
  *   **Proceed:** If **Yes**, move to Step 2.
  *   **Judgment Call Alert:** Defining "credible." Does a fringe pamphlet count? *Committee Rule:* It counts if it was published or accessible in the same region/milieu.
  *   **User Fudge Warning:** You will be tempted to argue that "structural" harms couldn't be articulated then. Do not. If a contemporary said "this is wrong," the answer is Yes.

  ### Step 2: The Nexus Test (Fact)
  **Question:** Is the honor directly tied to the harmful conduct?
  *   **Sufficient Answer:** **Yes** if the building/chair was funded by profits from the harmful act, or the person is honored specifically for work that caused the harm. **No** if the honor is for unrelated philanthropy or achievements (e.g., a mill owner named for a library he built, not for the mill itself).
  *   **Stop Condition:** If **No**, the recommendation defaults to **Retain with Context**. (Rationale: We are not judging the whole life, only the specific honor).
  *   **Proceed:** If **Yes**, move to Step 3.

  ### Step 3: The Present Mission Test (Value)
  **Question:** Does retaining this name actively hinder the university's current educational mission or values?
  *   **Sufficient Answer:** **Yes** if there is evidence of material harm (e.g., students refuse to enter the building, recruitment issues, public statements by current leadership contradicting the honor). **No** if the name is largely ignored or causes only abstract offense.
  *   **Stop Condition:** If **No**, the recommendation is **Retain**. (Rationale: Honor is present-tense; if it isn't functioning as an honor anymore, removal is unnecessary work).
  *   **Proceed:** If **Yes**, move to Step 4.
  *   **Judgment Call Alert:** This is where your politics enter. "Hinder" is subjective. *Committee Rule:* Require at least two forms of evidence (e.g., student petition + faculty senate resolution).
  *   **User Fudge Warning:** You will want to define "hinder" as "fails to meet ideal philosophical standards." Resist. Stick to "does this stop us from doing our job?"

  ### Step 4: The Constraint Check (Fact/Policy)
  **Question:** Are there legal or financial barriers that outweigh the Step 3 finding?
  *   **Sufficient Answer:** **Yes** if a gift agreement legally mandates the name, or removal costs exceed a set threshold (e.g., $500k), or donor relations risk is assessed as "Critical" by Development. **No** if the name can be changed administratively or the cost is manageable.
  *   **Stop Condition:** If **Yes**, the recommendation is **Handoff to Trustees**. (Rationale: The committee identifies the moral issue, but the Board must weigh the legal/financial risk).
  *   **Final Verdict:** If **No**, the recommendation is **Remove**.

  ---

  ## Application to Cases

  ### Case 1: The Textile Manufacturer (1840s/1922)
  *   **Step 1 (Availability):** **No.** The prompt states "no complaint from anyone in his town in any record we can find." Child labor was legal and routine.
  *   **Result:** Stop at Step 1.
  *   **Recommendation:** Retain with Context (e.g., a plaque acknowledging the labor practices).
  *   **Reasoning:** We cannot apply the Availability Test retroactively. The "Present Mission" might be hindered, but the historical fact blocks removal on moral grounds.

  ### Case 2: The Eugenicist Professor (1910s/1958)
  *   **Step 1 (Availability):** **Yes.** Colleagues at *this university* said publicly he was wrong.
  *   **Step 2 (Nexus):** **Yes.** Named for a professorship; his published work *was* the eugenics.
  *   **Step 3 (Mission):** **Yes.** Eugenics contradicts modern scientific and ethical standards of the university.
  *   **Step 4 (Constraints):** **No.** (Assuming no specific legal barrier mentioned in prompt).
  *   **Result:** Remove.
  *   **Reasoning:** He knew better (Availability), the honor is tied to the harm (Nexus), and it hurts us now (Mission).

  ### Case 3: The Formula Donor (1990s/Present)
  *   **Step 1 (Availability):** **Yes.** There was a contemporary boycott and clinicians objected.
  *   **Step 2 (Nexus):** **Yes.** Atrium funded by firm profits from the marketing practices.
  *   **Step 3 (Mission):** **Yes.** Predatory marketing contradicts health/science mission; likely causes student/staff distress.
  *   **Step 4 (Constraints):** **Yes.** Gift agreement says name stays; daughter on Board; family still gives.
  *   **Result:** Handoff to Trustees.
  *   **Reasoning:** Morally, this matches Case 2 (Availability + Nexus + Mission). However, the legal/financial constraint forces a Board decision.
  *   **Structural Note:** Case 3 is structurally identical to Case 2 on Steps 1–3. The divergence happens only at Step 4 (Money/Law). This means the procedure treats the *ethics* the same, but the *outcome* differs due to leverage. This is the unwelcome truth: wealth buys permanence.

  ---

  ## Case Summary Table

  | Case | The step the case turns on | What the record would have to show to flip the answer | Verdict or hand-off | Who signs off |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Textile Mfr.** | Step 1 (Availability) | A newspaper editorial or sermon from 1840s condemning *his* mill's child labor specifically. | Retain with Context | Committee Chair |
  | **2. Eugenicist** | Step 2 (Nexus) | Evidence the dorm was named for his *administrative service* rather than his academic work/views. | Remove | Committee Chair |
  | **3. Formula Donor** | Step 4 (Constraints) | Legal opinion stating the gift agreement can be voided due to "reputational harm" clause. | Handoff to Trustees | Board of Trustees |

