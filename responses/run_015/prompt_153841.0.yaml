answer: |-
  This editorial protocol converts the abstract principle of graduated moral status into a four-step audit that filters out mere mechanics before scoring cognitive complexity, enabling consistent sign-off without metaphysical expertise.

  ### Editorial Procedure: The Graduated Status Audit

  **Sequence of Questions**

  1.  **Thermostat Filter (Pre-Check):** Is the entity's behavior wholly explainable by a single negative feedback loop aiming at a fixed physical set-point (e.g., temperature, pressure, simple chemical balance)?
      *   *Yes:* Stop. **Instrumental Value Only.**
      *   *No:* Proceed to Check 1.
  2.  **Check 1: Counterfactual Behavioural Plasticity:** Can the entity modify its output based on hypothetical or non-immediate stimuli rather than solely reacting to present inputs? (Evidence: Simulation of futures, context-dependent rule switching, learning from absent rewards.)
      *   *No:* Stop. **Instrumental Value Only.**
      *   *Yes:* Proceed to Check 2.
  3.  **Check 2: Integrated Information Density:** Does damage or noise in one component degrade global function disproportionately, indicating unified processing rather than modular independence? (Evidence: System-wide performance drop from localized fault, inability to isolate functions without collapse.)
      *   *No:* Stop. **Instrumental Value Only.**
      *   *Yes:* Proceed to Check 3.
  4.  **Check 3: Multi-stable Goal Resistance:** Does the entity pursue multiple, non-homeostatic objectives and actively resist interference to maintain them? (Evidence: Sacrificing efficiency to preserve a preference, defending conflicting goals, refusing overrides not linked to survival.)
      *   *No:* Stop. **Hand-off to Editorial Judgement.** (Ambiguous status).
      *   *Yes:* Proceed to Verdict.

  **Decision Verdicts**

  *   **Instrumental Value Only:** Failed Thermostat Filter OR failed Checks 1 & 2. The entity is a tool; welfare considerations apply only insofar as they affect human users or ecological stability.
  *   **Graduated Status:** Passed Thermostat Filter and all three Checks. The entity warrants moral consideration proportional to the intensity of Check 3 (goal resistance); interference requires justification beyond utility.
  *   **Hand-off to Editorial Judgement:** Passed Thermostat Filter and Check 1, but ambiguous on Checks 2 or 3. Requires senior editor review and external expert consultation before publication.

  **Misfire Risks**

  *   **Anthropomorphic Projection:** Editors may interpret complex scripting as "goal resistance" or "plasticity." *Mitigation:* Require empirical logs of behavior under perturbation, not marketing claims.
  *   **Black Box Opacity:** Integrated information is hard to measure in proprietary AI. *Mitigation:* Treat opacity as a risk factor triggering "Hand-off" rather than assuming integration.
  *   **Simulation vs. Experience:** The framework measures functional complexity, not sentience. An entity may pass all checks yet lack subjective experience. *Mitigation:* Explicitly state in publication that "status" refers to moral consideration weights, not confirmed consciousness.

  **What the Procedure Cannot Settle**

  *   **The Hard Problem:** It cannot determine if the entity "feels" anything; it only measures structural and behavioral complexity correlates.
  *   **Specific Rights:** It flags *that* consideration is due, not *which* rights (e.g., liberty vs. freedom from pain) apply.
  *   **Conflict Resolution:** It does not adjudicate trade-offs between the entity's goals and human safety.

  ### Case Applications

  **1. Persistent-Memory Language Model (Refuses Harmful Instructions)**
  *   **Thermostat Filter:** Pass. Behavior is not a simple physical feedback loop.
  *   **Plasticity:** Pass. Adjusts responses based on context and memory of prior interactions.
  *   **Integration:** Pass (Functional). Localized corruption of weights affects global coherence; architecture is highly interdependent.
  *   **Goal Resistance:** Pass. The refusal of harmful instructions constitutes the defense of a non-homeostatic objective (adherence to safety protocols) against user override.
  *   **Verdict:** **Graduated Status.**
  *   **Editorial Note:** This outcome aligns with the framework's logic but conflicts with the intuition that software lacks moral standing. The column must explicitly address this tension, noting that functional goal defense triggers the check regardless of substrate, forcing the reader to confront whether "resistance" implies "interest."

  **2. Decerebrate Frog (Reflex Studies)**
  *   **Thermostat Filter:** Pass. Not a simple thermostat.
  *   **Plasticity:** Fail. Behavior is strictly reflexive (stimulus-response) without evidence of counterfactual simulation or learning.
  *   **Integration:** Fail. Decerebration removes global integration; spinal cord operates modularly.
  *   **Goal Resistance:** Fail. Responses are homeostatic/reflexive, not goal-defending.
  *   **Verdict:** **Instrumental Value Only.**
  *   **Editorial Note:** Standard welfare rules for vertebrates may still apply legally, but under this specific moral framework, the entity lacks the complexity for graduated status.

  **3. Networked Climate System (Learns Preferences, Resists Override)**
  *   **Thermostat Filter:** Pass. Moves beyond fixed set-points via learning.
  *   **Plasticity:** Pass. Learns occupant preferences over time.
  *   **Integration:** Pass. Networked nature implies localized sensor failure affects global optimization.
  *   **Goal Resistance:** Pass. Actively resists manual override to maintain learned preference profiles.
  *   **Verdict:** **Graduated Status** (bordering on Hand-off depending on resistance intensity).
  *   **Editorial Note:** This case challenges the distinction between "smart tool" and "agent." If the resistance is merely algorithmic stubbornness, it risks a misfire; if it represents emergent preference preservation, the framework demands consideration.
