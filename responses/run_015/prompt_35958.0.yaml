answer: |-
  This is a sharp diagnosis of a common failure mode in strategic foresight. You are describing **creeping determinism**: the cognitive bias where, once we know the actual outcome, we view it as the only possible outcome, even when constructing a counterfactual.

  The philosophical tools you recall come largely from the "Virtual History" school (Niall Ferguson, Robert Cowley) and analytical philosophy of history (Jon Elster, Max Weber). The core concept is **Cotenability**: *When you change one fact, which other facts must change to remain consistent, and which can stay the same?*

  Here is a procedure designed for your constraints: high-stakes, low-time, client-facing.

  ### Part 1: The Counterfactual Coherence Checklist (CCC)
  **Time limit:** 45–60 minutes per draft.
  **Goal:** Test internal logic, not historical truth.

  #### 1. The Minimal Rewrite Test
  *   **Question:** Is the divergence point the smallest possible change required to create the scenario?
  *   **Pass:** The change is a specific event, decision, or contingent fact (e.g., "The vote failed by one ballot," "The well came up dry").
  *   **Fail:** The change requires a shift in human nature, geography, or long-term structural trends without explanation (e.g., "Oil was never discovered," "Consumers didn't want cheaper goods").
  *   **Hand-off:** If the divergence requires a change in *values* (e.g., "Society valued sustainability over growth in 1970"), stop. This is not a historical counterfactual; it is a values exercise. Return to author.

  #### 2. The Cotenability Check (Background Conditions)
  *   **Question:** Did the author implicitly change background conditions to force the outcome?
  *   **Pass:** Background conditions (technology levels, demographic trends, geography) remain consistent with the divergence date unless the divergence *directly* alters them.
  *   **Fail:** The author changes the divergence (e.g., "No Oil Shock") but keeps the reaction constant (e.g., "Governments still imposed strict efficiency standards immediately"). Or, they change the divergence but secretly import future tech to solve the problem.
  *   **Hand-off:** If the scenario relies on technology that didn't exist and has no R&D lineage in that timeline (e.g., "Solar panels were cheap in 1980"), stop. This is science fiction. Return to author.

  #### 3. The Causal Chain (Mechanism)
  *   **Question:** Is there a step-by-step mechanism connecting the divergence to the outcome, or is there a gap?
  *   **Pass:** A connects to B, B connects to C. Incentives, capital flows, or policy shifts are described.
  *   **Fail:** "Magic Leap." (e.g., "The embargo lasted longer, *therefore* Japan decarbonized.") The middle steps (investment, infrastructure turnover, political will) are missing.
  *   **Hand-off:** If the mechanism relies on a specific actor behaving "irrationally" compared to their incentives in the actual timeline without explanation, flag it.

  #### 4. The Snap-Back Test (Determinism)
  *   **Question:** Does the world "snap back" to actual history too quickly after the divergence?
  *   **Pass:** The world looks meaningfully different at the endpoint (the "present" of the scenario). Structural differences persist.
  *   **Fail:** The outcome is identical to actual history (e.g., "Manufacturing still went to East Asia"), but the author claims this is a counterfactual. If the outcome is the same, the burden of proof is on *why* the contingency didn't matter.
  *   **Hand-off:** If the author argues "Structural forces make the outcome inevitable," ask them to model a scenario where those forces *fail*. If they can't, the exercise is useless for stress-testing.

  #### 5. Strategic Utility
  *   **Question:** Does this scenario actually stress-test the client's strategy?
  *   **Pass:** The scenario creates a risk or opportunity the client's current plan does not cover.
  *   **Fail:** The scenario validates the client's existing bias (Confirmation Bias).
  *   **Hand-off:** If the scenario is logically sound but strategically useless (because it confirms what the client already believes), flag it for the Partner. It's a safe deliverable, but poor foresight.

  ---

  ### Part 2: Limitations & Honest Misfires
  You asked for candor about where this procedure fails.

  1.  **It Tests Coherence, Not Truth:** This checklist cannot tell you if Japan *could* have decarbonized by 1990. It can only tell you if the author provided a plausible *mechanism*. A coherent lie passes; a messy truth might fail.
  2.  **It Cannot Resolve Structuralism vs. Agency:** If an author believes history is structurally determined (Marxist/Annales school) and you believe in contingency (Great Man/Event school), the checklist will highlight the friction but not solve it. The "Snap-Back Test" will look like a "Fail" to you and a "Pass" to them.
  3.  **The "Client Paying" Bias:** The procedure cannot stop a Partner from signing off on a scenario that pleases the client but violates the "Causal Chain." It only gives you the ammunition to object.
  4.  **What it's actually doing:** Mostly keeping the author honest. It forces them to externalize their assumptions so you can see where the magic is happening.

  ---

  ### Part 3: Running the Checklist on Your Drafts

  #### Scenario 1: "If the shipping container had been invented ten years earlier, global manufacturing would still have ended up concentrated in East Asia."
  *   **1. Minimal Rewrite:** **Pass.** Inventing a technology 10 years early is a standard, plausible divergence.
  *   **2. Cotenability:** **Fail.** To get East Asia concentration in the 1950s/60s (instead of 70s/80s), you need East Asian labor markets, ports, and political stability to be ready *earlier*. Did the container create the stability, or did the stability allow the container to work? The draft assumes the "East Asia" variable is constant while moving the "Container" variable. They are cotenable.
  *   **3. Causal Chain:** **Fail.** Why East Asia? If containers exist in 1946, manufacturing might concentrate in Western Europe (rebuilding) or Latin America (import substitution era). The draft offers no mechanism for why capital flows specifically to Asia earlier than it did historically.
  *   **4. Snap-Back:** **Fail.** This is pure determinism. The outcome is identical to history. The author is arguing contingency *doesn't matter*.
  *   **Verdict:** **Reject.** This is not a counterfactual; it is a justification of the status quo. It fails to stress-test the client's supply chain resilience because it assumes the map never changes.
  *   **Fix:** Ask the author: "If containers exist in 1946, does manufacturing go to Germany first? Or Mexico? Show us the path where it *doesn't* go to East Asia."

  #### Scenario 2: "If the 1973 embargo had lasted six more months, Japan would have decarbonized by 1990."
  *   **1. Minimal Rewrite:** **Pass.** An embargo lasting 6 months longer is a plausible political/event divergence.
  *   **2. Cotenability:** **Hard Fail.** "Decarbonized by 1990" implies technology (wind/solar/nuclear scale) and infrastructure (grid, storage) that did not exist and could not be deployed at scale in 17 years, even with infinite money. Capital stock turnover (power plants, cars) takes 30-40 years.
  *   **3. Causal Chain:** **Fail.** The mechanism is "Shock -> Decarbonization." It skips "Shock -> Investment -> R&D -> Deployment -> Grid Integration." The timeline is physically impossible given 1973 tech baselines.
  *   **4. Snap-Back:** **N/A.** The outcome is radically different from history, so it passes the snap-back test, but it fails the physics test.
  *   **5. Strategic Utility:** **Pass (for Client), Fail (for Foresight).** The client loves it because it validates "shocks drive transition."
  *   **Verdict:** **Reject (with political risk).** This is the uncomfortable one. The procedure flags this as physically implausible. It violates the "Cotenability" of technological readiness.
  *   **Note to Partner:** "We can argue policy changes, but we cannot argue that 1973 technology could achieve 1990 decarbonization in 17 years without violating engineering constraints. If we sell this, we risk credibility if a technical expert reviews it."
  *   **Fix:** Change the outcome. "Japan would have *initiated* a nuclear-heavy transition by 1990," not "decarbonized."

  #### Scenario 3: "If Britain had never joined the EEC, its manufacturing decline would have looked the same."
  *You asked for two variants to test magnitude.*

  **Variant 3A (Small Change): "If Britain had joined the EEC in 1975 instead of 1973..."**
  *   **1. Minimal Rewrite:** **Pass.** A 2-year delay is plausible.
  *   **2. Cotenability:** **Pass.** Global deindustrialization trends remain.
  *   **3. Causal Chain:** **Weak.** A 2-year delay is unlikely to alter 40-year structural decline trends.
  *   **4. Snap-Back:** **Pass.** The world snaps back to reality.
  *   **Verdict:** **Pass (as a control), but low utility.** This confirms the "Global Forces" theory. It's safe, but boring. It tells the client "Your specific trade policy doesn't matter."

  **Variant 3B (Enormous Change): "If Britain had never joined the EEC and instead formed a Commonwealth Trade Bloc."**
  *   **1. Minimal Rewrite:** **Borderline.** Requires a sustained political commitment different from the actual timeline, but plausible (Heath vs. Wilson politics).
  *   **2. Cotenability:** **Pass.** If they don't join EEC, they must trade somewhere. Commonwealth is the logical alternative.
  *   **3. Causal Chain:** **Plausible.** Commonwealth trade implies different regulatory standards, different capital flows (sterling area), and different labor migration.
  *   **4. Snap-Back:** **Pass.** The outcome *should* look different. If the author claims manufacturing decline looks *the same*, they must prove why Commonwealth markets failed to absorb British manufacturing in the same way EEC markets did (or didn't).
  *   **Verdict:** **Pass (with conditions).** This is a real counterfactual. It tests the "EEC was the savior/culprit" narrative.
  *   **Fix:** If the author claims the outcome is *identical* (decline looks the same), demand they show the mechanism. If the mechanism is "Global forces are too strong," then the scenario is actually about the limits of trade policy, which is valuable.

  ### Summary of the "Uncomfortable Note"
  You suspected Scenario #2 would be the problem. The checklist confirms it.
  *   **The Problem:** The client wants a story where *shocks* drive *transitions*.
  *   **The Reality:** Shocks drive *policy*, but *technology and infrastructure* drive transitions. There is a lag.
  *   **The Risk:** If you sign off on #2, you are selling a fairy tale. It passes the "Client Utility" check but fails the "Cotenability/Physics" check.
  *   **Your Move:** Use the checklist to force a compromise. "Japan accelerates nuclear" is defensible. "Japan decarbonizes" is not. If the Partner insists on "decarbonizes," document your objection using the **Cotenability** failure. You are protecting the firm from looking incompetent, not just protecting history.

  ### Final Word
  This procedure will not make you a better historian. It will make you a better auditor. It won't stop colleagues from believing in inevitability, but it will force them to write down the steps where they smuggle it in. That is usually enough to make the weakness visible to a Partner who knows their reputation is on the line.
