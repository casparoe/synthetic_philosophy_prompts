prompt: |-
  I do foresight work at a mid-sized consultancy — mostly scenario planning for clients in energy and shipping. A big chunk of my job is building "what if" histories: we tell a client, suppose X hadn't happened in 1973, here's the plausible world that follows, and we use that to stress-test whatever strategy they're about to commit money to. My problem is my colleaugues' counterfactuals keep smuggling in inevitability. Somebody writes "even without the oil shock, the energy picture would look basically the same today," and you can just tell they ran history forward to whatever answer they already believed and called it a counterfactual. The whole point of the exercise is to locate where contingency actually lived, and we're using it as decoration.

  I vaguely remember from college that philosophers of history have actual tools for this — something like a "minimal rewrite" rule (change the least you can to get the divergence), and distinguishing causes that were necessary from ones that just happened to be sufficient in that setting. But I only half-remember it and can't reconstruct it. Can you turn whatever is actually usable from that way of thinking into a procedure I can run when vetting a draft scenario? To be concrete about my situation: we produce maybe three or four of these a quarter, each goes into a report with the client's name on it, the partner signs off, and I usually have a day at most to review a draft before it goes up the chain. So what I need is:

  - a checklist I can run on a draft in under an hour, with the questions in order
  - for each question, what counts as a pass and what counts as a fail
  - the places where the checklist has to stop and hand it back to the author, because the question is really about deep structure or values and no procedure can settle it
  - an honest note about where the procedure will misfire — I get that historical counterfactuals can't be tested the way they can in physics, so tell me what the procedure is actually doing in that case, even if the answer is "mostly keeping the author honest"

  Then run it on three scenarios from recent drafts:

  1. "If the shipping container had been invented ten years earlier, global manufacturing would still have ended up concentrated in East Asia." A junior swears by this one. I think it's inevitability in disguise — the second half of the sentence is doing no work, it's just today's world with a different start date — but I can't proove that with anything except my own irritation.
  2. "If the 1973 embargo had lasted six more months, Japan would have decarbonized by 1990." Client loves this one, it fits their story about energy transitions being shock-driven.
  3. "If Britain had never joined the EEC, its manufacturing decline would have looked the same, because deindustrialization was global." — actually make it two scenarios, one where the counterfactual change is small and one where it's enormous, so I can see whether the procedure treats them differently.

  And please be straight with me about at least one case where the procedure yields a verdict I won't like (probably #2, given who's paying us), and about what the whole exercise can't do — if the checklist ends up just laundering my intuitions with extra steps, I'd rather know that now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Foresight consultant at a mid-sized consultancy. Specializes in scenario planning (energy/shipping).
      *   **Task:** Vetting counterfactual histories ("what if" scenarios) used to stress-test client strategies.
      *   **Problem:** Colleagues are smuggling inevitability into counterfactuals (determinism disguised as contingency). They run history forward to the present outcome regardless of the change.
      *   **Goal:** A practical, philosophical toolkit turned into a procedural checklist for vetting drafts within an hour.
      *   **Specific Requirements:**
          *   Checklist (ordered questions, pass/fail criteria).
          *   Hand-off points (where human judgment/structure/values take over).
          *   Honest limitations (where the procedure misfires or is just "keeping authors honest").
          *   Application to three specific scenarios (including splitting #3 into two variants).
          *   Candor about uncomfortable verdicts (specifically regarding #2 and the client's bias).
      *   **Tone:** Professional, direct, intellectually rigorous but pragmatic (consulting context), honest about limitations.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   The user mentions "minimal rewrite" and "necessary vs. sufficient causes."
      *   *Key Philosophers:* Niall Ferguson (*Virtual History*), Jon Elster (causal mechanisms), Max Weber (objective possibility), E.H. Carr (determinism vs. agency).
      *   *Core Concepts:*
          *   **Minimal Rewrite Rule:** Change as little as possible to create the divergence. Avoid "miracles."
          *   **Cotenability:** Do the background conditions hold steady? (If I change X, does Y *have* to change too?)
          *   **Causal Mechanisms:** Is there a plausible chain of events connecting the divergence to the outcome? Or is it magic?
          *   **Path Dependence:** Does the system lock in early, or is it flexible?
          *   **Determinism Check:** Is the outcome inevitable regardless of the input?

  3.  **Drafting the Checklist (The "Procedure"):**
      *   Needs to be fast (under an hour).
      *   Needs to be ordered logically (from structural integrity to causal logic).
      *   *Step 1: The Divergence Point (Minimal Rewrite).* Is the change plausible?
      *   *Step 2: Cotenability (Background Conditions).* Did you change too much else implicitly?
      *   *Step 3: Causal Chain (Mechanisms).* How do we get from A to B?
      *   *Step 4: The Outcome (Determinism Check).* Does the world snap back to reality too quickly?
      *   *Step 5: Strategic Utility.* Does this actually stress-test the client's strategy?
      *   *Hand-off Points:* Where values or deep structural assumptions enter (e.g., human nature, technological inevitability).
      *   *Limitations:* It's not physics. It's coherence testing, not truth testing.

  4.  **Applying the Checklist to the Scenarios:**

      *   **Scenario 1: Shipping Container (-10 years) -> East Asia Concentration.**
          *   *Analysis:* This smells like technological determinism. If containers exist earlier, does trade liberalization happen earlier? Does labor cost differential matter as much?
          *   *Verdict:* Likely Fail on "Causal Chain." Why East Asia specifically? What about Latin America? The outcome is too close to actual history without explaining *why* the specific geography holds.
          *   *Nuance:* Maybe agglomeration effects are real, but the claim "would *still* have ended up" is too strong.

      *   **Scenario 2: 1973 Embargo (+6 months) -> Japan Decarbonized by 1990.**
          *   *Analysis:* Client loves this. It fits "shock-driven transition."
          *   *Reality Check:* Decarbonization by 1990? Nuclear? Renewables? Tech wasn't there. Infrastructure takes decades.
          *   *Verdict:* Hard Fail on "Causal Mechanism" and "Cotenability." Technology and infrastructure lock-in make 1990 decarbonization physically/economically implausible even with a shock. This is the "uncomfortable verdict."

      *   **Scenario 3: Britain/EEC (Manufacturing Decline).**
          *   *Variant A (Small Change):* Joining EEC 2 years late.
          *   *Variant B (Enormous Change):* Never joining, pursuing Commonwealth trade bloc instead.
          *   *Analysis:* Variant A likely snaps back to reality (Fail). Variant B opens real contingency (Pass/Maybe).
          *   *Verdict:* Shows how the checklist distinguishes magnitude of divergence.

  5.  **Refining the Output:**
      *   *Structure:*
          1.  Introduction (acknowledging the validity of their frustration).
          2.  The Procedure (Checklist).
          3.  Limitations & Hand-offs.
          4.  Application to Scenarios.
          5.  Closing Candor.
      *   *Tone Check:* Ensure I'm not being overly academic. Use consulting language ("stress-test," "deliverable," "sign-off").
      *   *Self-Correction on #2:* I need to make sure I don't just say "it's wrong." I need to explain *why* the procedure flags it (technological lock-in, capital stock turnover).
      *   *Self-Correction on Limitations:* Be clear that this checklist tests *internal coherence*, not *truth*. It prevents stupid, not guarantees right.

  6.  **Final Polish:**
      *   Check against the "under an hour" constraint.
      *   Ensure the "Hand-off" section is distinct.
      *   Make sure the "uncomfortable verdict" is highlighted.
      *   Verify the "Minimal Rewrite" concept is explained simply.

  *(Self-Correction during drafting)*: I initially thought about bringing in Bayesian probability. *Correction:* No, that's too complex for a 1-hour checklist. Stick to causal logic and coherence.
  *(Self-Correction on Scenario 3)*: The prompt asks to make it two scenarios (small vs. enormous change). I need to explicitly label them 3a and 3b.

  7.  **Final Review against constraints:**
      *   Checklist ordered? Yes.
      *   Pass/Fail criteria? Yes.
      *   Hand-off points? Yes.
      *   Honest note on misfire? Yes.
      *   Run on 3 scenarios (with 3 split)? Yes.
      *   Uncomfortable verdict included? Yes.

