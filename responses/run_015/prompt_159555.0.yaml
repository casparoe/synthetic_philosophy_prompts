answer: |-
  Here is the reconstruction of your colleague's reasoning, the prediction for the seed case, and the tool to settle the bet.

  ### 1. Reconstructing the Colleague's Rules
  Based on the five lunchtime rulings, your colleague is running a four-filter algorithm to distinguish "cascade" from other forms of social influence. She is a social epistemologist, so her definitions hinge on *how beliefs are formed*, not just on outcomes.

  *   **Filter 1: Informational vs. Payoff (The App Test).**
      *   *Rule:* If I do it because *your doing it* makes it more valuable for me (network effects), that is **Coordination**. If I do it because *your doing it* convinces me it is the right thing to do (informational signal), that is a candidate for **Cascade**.
      *   *Application:* The messaging app was coordination (payoffs). The seed case is informational (farmers believe the seed is better). **Passes.**

  *   **Filter 2: Public vs. Private Signal (The Storm Test).**
      *   *Rule:* If we all act on a single public piece of data (weather forecast), that is **Common Knowledge**. If I act on my private data unless I see you acting differently, that is a candidate for **Cascade**.
      *   *Application:* The storm was a public signal. The seed case involves private yield data (my plot failed) vs. public action (neighbors planted). **Passes.**

  *   **Filter 3: Belief Update vs. Reputational Masking (The Analyst Test).**
      *   *Rule:* If I publicly agree but privately disagree to save my career, that is **Herding**. If I publicly agree and *privately update my belief* to match the crowd, that is a candidate for **Cascade**.
      *   *Application:* The analysts didn't learn anything. The seed farmers *did* update their beliefs (they blamed their seedbed, not the seed, convincing themselves the seed was still good). **Passes.**

  *   **Filter 4: Path Dependence and Fragility (The Lunch & Cereal Test).**
      *   *Rule:* This is the crux. In both "Cascade" cases, the outcome relied on the *order* of arrival (arbitrary queue start; first misread report). In the "Not Cascade" cases, the outcome was robust (storm was real; app utility is real).
      *   *Nuance:* Does the outcome have to be *false*? The Lunch case wasn't false, just arbitrary. The Cereal case was false. Therefore, **Falsehood is not required; Fragility/Arbitrariness of the process is.**
      *   *Application:* The seed adoption relied on the arbitrary order of road repairs. If the trucks had reached the wet villages first, the cascade would have died (low yields immediately). The process was fragile. **Passes.**

  ### 2. Predicting the Verdict
  **Prediction:** She will rule this a **Cascade**.

  **Reasoning:**
  Your colleague's field is *epistemology* (the study of knowledge and justified belief), not *welfare economics* (the study of good outcomes). To an epistemologist, a belief is only "knowledge" if it is justified by evidence. In the seed case, the followers' belief ("this seed is good") was *not* justified by their private evidence (their yields were low). It was justified by the social chain.

  The fact that the belief turned out to be true later (due to the climate shift) is, to her, a matter of luck (a "Gettier case"), not a change in the mechanism. The mechanism was: *Ignore private signal, follow public history.* That is the definition of an informational cascade. The fact that the world changed to make the crowd right does not change the fact that the farmers were reasoning via cascade.

  **The Closest Analogy:**
  The **Lunch Counters**.
  *   **Why:** Both rely on an arbitrary starting condition (road repairs vs. first buyers) to tip the system. In both cases, the "winner" (the long queue / the new maize) was not inherently superior at the moment of decision for the majority of participants.
  *   **Why it Misleads:** The Lunch cascade ends in a visible inefficiency (one counter closes). The Seed cascade ends in a visible efficiency (drought survival). This visual difference is what traps your betting friend. He is looking at the *harvest*; she is looking at the *decision*.

  ### 3. The Core Disagreement
  You and your friend are arguing over whether "cascade" describes a **mechanism** or a **pathology**.

  *   **Your View (Mechanism):** A cascade is a specific engine of social learning (private signals overridden by public history). Like an engine, it can drive a car into a ditch (Cereal) or to the correct destination (Seeds). The engine is the same.
  *   **Your Friend's View (Pathology):** A cascade is a specific kind of *error*. If the crowd lands on the truth, it wasn't a cascade; it was "collective intelligence" or "wisdom of crowds." He reserves the word for when the process leads people astray.
  *   **The Colleague's View (Justification):** She sides with you, but for deeper reasons. She cares about *warrant*. If you believe the truth for the wrong reasons (social pressure rather than evidence), you are in a cascade. Truth does not sanitize the process.

  ### 4. The Discriminating Case
  To settle the bet definitively, you need a case that separates **Mechanism** (User/Colleague) from **Outcome** (Friend). You need a scenario where the mechanism is clearly a cascade, but the outcome is undeniably true and beneficial.

  **The Case: The Vindicated Rumour**
  > A rumour spreads through a trading floor that a specific bank is insolvent. Traders sell off the bank's stock, ignoring their private analysis which suggests the bank is solvent (Private Signal: Hold; Public Action: Sell). The stock price collapses. The bank is forced into administration. During the liquidation process, auditors discover hidden fraud that *actually did* make the bank insolvent, though no one knew it at the time of the sell-off.
  > *   **Mechanism:** Informational cascade (traders ignored private signals for public action).
  > *   **Outcome:** Truthful (the bank was indeed insolvent) and Stable (no one buys back in).

  **The Split Verdict:**
  *   **Your Friend** must say **"Not a Cascade."** The market was right. The process tracked the truth. To call it a cascade implies the traders were wrong, but they weren't.
  *   **You and the Colleague** must say **"Cascade."** The traders did not know *why* they were right. They acted on the crowd, not the evidence. If the fraud hadn't existed, they would have crashed a healthy bank. The *justification* for their belief was social, not evidential.

  **Why this wins the bet:**
  If your colleague accepts the "Vindicated Rumour" as a cascade, she confirms that for her, the word describes the *structure of reasoning*, not the *accuracy of the result*. Since the Seed case is structurally identical to the Vindicated Rumour (private evidence negative, social evidence positive, outcome accidentally true), she will rule the Seed case a **Cascade**. You win.
