answer: |-
  **CRITICAL PRELIMINARY NOTE**

  Before you circulate the draft below, please note two significant risks inherent in your request's framing:

  1.  **Legal Authority vs. Stewardship Policy:** A Committee vote cannot definitively determine whether a bequest clause has been legally satisfied; only a court or a settlement agreement can do that. Voting to declare the regenerated object "the original" when the bequest specifies "original material instantiation" creates a high risk of successful litigation by the heirs. The distinction between "material continuity" and "procedural continuity" is not merely philosophical here; it is the specific legal trigger for reversion.
  2.  **Missing Evidence:** I do not have the full text of the bequest, the artist's original contract regarding regeneration rights, or the jurisdiction's case law on charitable trusts. The draft below assumes a conservative legal posture. If General Counsel has not reviewed the specific reversion clauses, this memo should be marked "Privileged and Confidential – Attorney-Client Work Product."

  The draft below recommends **against** declaring the object the "original." Instead, it classifies it as a "Successor Work" and recommends renegotiation. This is the only actionable path that acknowledges the heirs' strongest argument without forcing the Foundation to litigate a likely losing definition of "material."

  ***

  **MEMORANDUM**

  **TO:** Acquisition and Stewardship Committee, Meridian Foundation for Ephemeral Art
  **FROM:** [Your Name/Title]
  **DATE:** [Current Date]
  **SUBJECT:** Classification and Stewardship Status of Mara Kessler, *Sequence No. 7* (1998/2022)

  **1. RECOMMENDATION**

  I recommend that the Committee vote to classify the 2022 regeneration of *Sequence No. 7* as a **Distinct Successor Work** rather than the "original material instantiation" referenced in the Kessler Bequest.

  Consequently, I propose we authorize the Director of Legal Affairs to initiate immediate renegotiation with the Kessler Estate. The objective is to execute a new Deed of Gift that explicitly covers the regenerated object, thereby securing the Foundation's retention of the work without violating the material conditions of the original bequest.

  **2. RATIONALE**

  **A. Adherence to Bequest Language**
  The Kessler Bequest stipulates that "the original material instantiation of the work" must remain in permanent care. By 2019, the original pigments had degraded entirely. The 2022 regeneration, while executed via Kessler's parametric rules, utilizes a synthetic matrix and new substrate fragments. To classify this as the "original material instantiation" requires a semantic expansion of "material" that contradicts standard conservation definitions and property law. Conceding this point to the heirs strengthens our fiduciary position; we acknowledge the original bequest condition can no longer be met, rather than arguing a definition that may not hold in court.

  **B. Addressing the Heirs' Argument**
  The heirs contend that delegated execution and new substrate constitute a reproduction. They are materially correct. If we argue that "procedural fidelity" equals "material identity," we invite a precedent that destabilizes our entire collection. If we allow conceptual equivalence to override material specificity in this instance, we risk collapsing the distinction between preservation and fabrication for all future holdings. By classifying *Sequence No. 7* (2022) as a Successor Work, we validate the heirs' concern regarding materiality while preserving the work's conceptual lineage.

  **C. Institutional Risk Management**
  Adopting a "functional equivalence" standard for this bequest creates institutional risk. If the Meridian Foundation asserts that a reconstructed object satisfies a clause requiring "original material," we expose ourselves to challenges on other holdings where provenance relies on physical continuity.
  *   **Mitigation:** This classification should be codified as specific to "Parametric/Ephemeral Regenerations" and not applied generally. This creates a controlled microdomain for this exception, preventing unpredictable slippage across the broader collection.

  **3. COURSE OF ACTION**

  **Phase 1: Reclassification (Immediate)**
  Upon Thursday's vote, the Registrar will update the catalog record for *Sequence No. 7*.
  *   **Original Entry:** *Sequence No. 7* (1998). Status: *Deaccessioned/Deceased (Material)*.
  *   **New Entry:** *Sequence No. 7 (Regenerated)* (2022). Status: *Active Holding (Successor)*.
  *   **Linkage:** Metadata will explicitly link the two entries, noting the 2022 work was generated via the artist's parametric rules but does not constitute the original bequested material.

  **Phase 2: Estate Negotiation (Days 1–90)**
  Legal Counsel will approach the heirs with the following proposal:
  *   Acknowledge that the original bequest has technically reverted due to material loss.
  *   Offer to retain the Successor Work under a new gift agreement.
  *   Propose a joint stewardship credit or memorialization of the original donors in exchange for the heirs signing over title to the 2022 object.
  *   **Fallback:** If negotiations fail, the Foundation retains the moral right to display the work as a regeneration, but legal title may need to be transferred to avoid conversion claims.

  **Phase 3: Policy Codification (Day 120)**
  Draft a "Protocol for Parametric Regeneration" for Committee approval. This policy will define under what conditions future ephemeral works may be regenerated and how their bequest status will be handled *prior* to material degradation, preventing recurrence of this ambiguity.

  **4. TIMELINE FOR IMPLEMENTATION**

  *   **Thursday [Date]:** Committee Vote on Reclassification.
  *   **Friday [Date]:** Registrar updates catalog; Legal Counsel notified.
  *   **[Date + 14 Days]:** Initial overture to Kessler Estate.
  *   **[Date + 90 Days]:** Target deadline for new Deed of Gift execution.
  *   **[Date + 120 Days]:** Presentation of new Parametric Regeneration Protocol to the Board.

  **5. CONCLUSION**

  We cannot preserve the artist's intent by compromising the Foundation's legal integrity. By distinguishing the *concept* (which persists) from the *material instantiation* (which has not), we respect the artist's parametric vision without violating the donor's legal conditions. This path minimizes litigation risk and preserves the Meridian Foundation's reputation for rigorous stewardship.

  I move that we adopt this classification and authorize the negotiation strategy outlined above.
