          *   Define terms simply: Endurance (whole self moves through time) vs. Perduration (self is a series of slices).
          *   Thesis: The film leans on endurantism for emotional payoff but structurally operates like a perdurantist nightmare, creating a tension that actually deepens the moral argument.

      *   **Scene 1: The Piano Lesson (Skill Accrual):**
          *   *Endurantist view:* Phil sits there, practices, gets better. Same hands, same brain, same mind.
          *   *Perdurantist view:* Each loop is a new slice. How does Slice B know what Slice A practiced?
