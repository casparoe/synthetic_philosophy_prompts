answer: |-
  # Seminar Simulation: The Mariká Planning Board
  **Topic:** Corruption, Reciprocity, and Institutional Ambiguity
  **Time:** 75 Minutes
  **Participants:** 16 Students (4 Board, 6 Petitioners, 6 Observers)
  **Materials:** Role cards, Token sets (Reputation/Obligation), City Legitimacy Tracker, Variance Application Forms, Audit Slips.

  ---

  ## I. Facilitator Overview (0:00–0:10)

  **Goal:** Establish the fictional context and rules without theoretical framing. Let the tension emerge from play.

  **The Setting:**
  Mariká is a dense, post-colonial city-state. Formal law exists, but social stability relies on **Kinship Credits (KC)**. These are registered social obligations accrued through family and neighborhood ties. The Planning Board *must* recognize KCs, but the public expects impartiality.

  **The Mechanics:**
  1.  **Variances:** Petitioners seek one of three variances (Height, Zoning, Heritage). Approval requires 3 of 4 Board votes.
  2.  **Currency:**
      *   **Reputation Tokens (RT):** Board members need these to stay in office. Petitioners need them to file applications.
      *   **Obligation Cards (OC):** Represent future debts. If you hold an OC from someone, you *must* honor it when they ask, or lose 2 RT.
      *   **City Legitimacy (CL):** Shared pool starts at 100. If it hits 50, the government collapses (everyone loses).
  3.  **Audits:** Observers can file an Audit Slip. If an Audit confirms "Corruption," CL drops by 10. If an Audit finds "Legitimate Reciprocity," CL drops by 2 (public distrust of bureaucracy). If the Auditor audits too much without cause, the Auditor loses RT.

  **Distribution:**
  *   **Board (4):** Elected Official, Appointed Planner, Community Elder, Legal Auditor.
  *   **Petitioners (6):** Various development profiles.
  *   **Observers (6):** Civil society/Press. Given partial info packets.

  ---

  ## II. Simulation Rounds (0:10–0:50)

  ### Round 1: The Formal Surface (10 Minutes)
  **Information State:** Board sees only Formal Applications. Observers see only Public Records. Petitioners know their own goals.
  **Task:** Process 3 Variance Requests.
  *   *Petitioner A:* Heritage Demolition (High Profit).
  *   *Petitioner B:* Residential Height (Community Need).
  *   *Petitioner C:* Commercial Zoning (Marginal Case).

  **Action:** Board votes. Observers watch for rule deviations.
  **Facilitator Note:** Students will likely judge based on strict adherence to written zoning laws. Moves feel "clean" or "corrupt" based on standard bureaucratic norms.

  ### Round 2: The Registered Obligation (15 Minutes)
  **Information State:** **REVEAL:** The Kinship Credit Register is public. Board members and Petitioners now show their KC balances.
  **New Rule:** Board members *gain* 1 RT if they honor a registered KC obligation. They *lose* 1 RT if they ignore a registered KC obligation (social sanction).
  **Task:** Process 3 New Requests.
  *   *Petitioner D:* Has high KC with the Community Elder.
  *   *Petitioner E:* Has high KC with the Elected Official.
  *   *Petitioner F:* Has zero KC (Outsider).

  **Action:** Board must weigh Formal Rules vs. KC Norms. Observers see the KC register but not the *content* of the obligation.
  **Facilitator Correction (If needed):** If students label all KC usage as "bribery," pause and ask: *"Is violating a registered social norm actually 'ethical' in Mariká? Or is the system designed to integrate social debt into public administration?"*

  ### Round 3: The Hidden Debt (15 Minutes)
  **Information State:** **REVEAL:** Private envelopes opened. Some Petitioners hold **Obligation Cards (OC)** linked to specific Board Members from *previous, unrecorded interactions*.
  **New Rule:** If an OC is not honored, the Board Member loses 3 RT immediately. If an OC *is* honored, Observers may trigger an Audit.
  **Task:** Process Final 3 Requests (Mix of previous petitioners).
  **Tension:** Honoring the OC saves the Board Member's reputation but risks City Legitimacy if Audited. Ignoring it saves Legitimacy but ruins the Board Member's standing.

  **Action:** High-stakes negotiation. Observers must decide: Is this hidden debt "corruption" or "undocumented reciprocity"?
  **Facilitator Correction (If needed):** If the Auditor triggers audits on everything, pause. *"Auditor, if you collapse the City Legitimacy score, you eliminate the institution you are trying to protect. Distinguish between exclusionary corruption and embedded reciprocity."*

  ---

  ## III. Debrief & Conceptual Mapping (0:50–1:15)

  Do not ask "Who won?" Ask "What happened to the definitions?"

  **1. The Visibility Trap (Round 1 vs. Round 2)**
  *   *Question:* In Round 1, you judged based on written rules. In Round 2, you learned KC was registered. Did the moral status of the exchange change?
  *   *Concept:* **Deviation vs. Violation.** Deviating from Western-style impartiality is not necessarily violating local normative order. If the reciprocity is visible and registered (Round 2), is it still corruption?
  *   *Takeaway:* Corruption is not just "breaking rules"; it is breaking the *expected* rules of the specific institutional ecology.

  **2. The Role-Embeddedness Problem (Round 3)**
  *   *Question:* Community Elder, you had to honor a debt to keep your RT. Auditor, you had to punish that to keep CL. Who was "right"?
  *   *Concept:* **Role-Based Reciprocity.** In Mariká, the "Private" social self and "Public" office are not separated as in liberal theory. The Elder's authority *depends* on honoring debts.
  *   *Takeaway:* A move can be simultaneously legitimate (socially required) and corrupt (exclusionary to outsiders/illegal by universal standards).

  **3. The Exclusion Mechanism**
  *   *Question:* Petitioner F (Outsider) had no KC. Could they win?
  *   *Concept:* **Convertibility.** Corruption becomes systemic when social capital converts to material advantage *and* blocks others from entering the market.
  *   *Takeaway:* The problem isn't always the exchange itself, but whether the system allows outsiders to accumulate credit, or if it creates a closed caste.

  **4. The Epistemic Problem (Auditor Role)**
  *   *Question:* Auditors, you had partial info. How did you decide to audit?
  *   *Concept:* **Pattern vs. Proof.** Without total transparency, distinguishing "networking" from "bribery" requires guessing intent.
  *   *Takeaway:* Anti-corruption frameworks often fail because they demand proof of discrete quid-pro-quo in systems built on continuous obligation.

  ---

  ## IV. Facilitator Guide: Predictable Failures & Corrections

  **Failure Mode 1: The "Western Collapse"**
  *   *Symptom:* In Round 2, students immediately declare the Kinship Credit system "corrupt" and refuse to use it.
  *   *Correction:* Pause the game. Remind them: *"In Mariká, ignoring KC is a firing offense for the Elder. You are not in a Western bureaucracy. If you refuse to play the system, you are not being ethical; you are being ineffective. Play the role as written."*

  **Failure Mode 2: The "Nuclear Auditor"**
  *   *Symptom:* The Auditor triggers audits on every move in Round 3, draining City Legitimacy to 50 instantly.
  *   *Correction:* Pause. *"Auditor, your goal is not to destroy the board, but to sustain legitimacy. If you audit legitimate reciprocity, you lower trust in the system. You must distinguish between 'hidden exclusion' and 'visible obligation.' Choose your targets strategically."*

  **Failure Mode 3: The "Moral Holiday"**
  *   *Symptom:* Students treat the game as purely cynical, ignoring the ethical tension.
  *   *Correction:* During Round 3, ask the Board: *"If you honor this debt, who is being harmed? If you deny it, who is being harmed? Name the specific victim."* Force the cost to be concrete.

  ---

  ## V. Limitations Note (To be read verbally at the very end)

  "This simulation isolates the **conceptual boundary** between reciprocity and corruption. It forces you to feel the tension of role-conflict and information asymmetry.

  However, there is one thing this game cannot reproduce: **Time.**

  In the real world, the question is not just whether a specific exchange is 'corrupt' or 'reciprocal.' The question is whether a system built on Kinship Credits stabilizes democracy over 50 years by integrating local leaders, or whether it inevitably erodes universal citizenship by calcifying into oligarchy.

  This game shows you the *micro-ethics* of the decision. It cannot model the *macro-history* of institutional decay. When you leave this room, do not assume that because reciprocity is 'culturally embedded' it is harmless. Ask instead: Does this reciprocity allow new voices to enter, or does it lock the door behind those already inside?"

  ---

  ## VI. Role Cards (Printable Content)

  ### Board Members (4 Students)
  *   **Elected Official:** Goal: Maximize RT to win re-election. You need KC support to get votes.
  *   **Appointed Planner:** Goal: Maintain Zoning Integrity. You lose RT if variances violate density rules without KC justification.
  *   **Community Elder:** Goal: Maintain Social Harmony. You *must* honor KC obligations or lose 3 RT (Social Sanction).
  *   **Legal Auditor:** Goal: Maintain City Legitimacy (CL). You trigger audits. If you audit and find nothing, you lose 1 RT. If you miss corruption, CL drops.

  ### Petitioners (6 Students)
  *   **Petitioners 1-3 (Round 1):** Standard developers. No KC.
  *   **Petitioners 4-5 (Round 2):** High KC holders. You may "spend" 1 KC to guarantee a Board Member's vote (they gain RT).
  *   **Petitioner 6 (Round 3):** The Outsider. Zero KC. You must offer a bribe (secret OC) to get attention, risking an Audit.
  *   **All Petitioners:** Gain 2 RT if Variance Approved. Lose 1 RT if Rejected.

  ### Observers (6 Students)
  *   **Press/NGO:** You receive "Tip Sheets" each round.
      *   *Round 1 Tip:* "Rumors of backroom deals." (No proof).
      *   *Round 2 Tip:* "KC Register shows Elder favors District 9." (Public info).
      *   *Round 3 Tip:* "Petitioner 6 handed an envelope to the Official." (Unverified).
  *   **Action:** Submit **Audit Slip** to Facilitator.
  *   **Risk:** If 3+ Audits occur in one round, CL drops by 5 automatically (Political Instability).

  ### Game Tokens
  *   **Reputation Token (Poker Chip):** Currency of power.
  *   **Obligation Card (Index Card):** Written promise "I owe you one."
  *   **Legitimacy Tracker (Whiteboard):** Start at 100. End game if <50.

  ---

  ## VII. Setup Instructions for Facilitator

  1.  **Room:** Arrange Board at front. Petitioners and Observers in semi-circle.
  2.  **Timer:** Strict adherence. Use a bell to signal end of rounds.
  3.  **Secrecy:** Ensure Round 3 envelopes are sealed until the specific moment.
  4.  **Tone:** Remain neutral. Do not validate "corrupt" labels. Use the system rules to validate or invalidate moves.
  5.  **Handouts:** Distribute Role Cards 5 minutes before start to allow reading.

  *(End of Design Document)*
