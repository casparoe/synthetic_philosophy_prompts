  In one respect it understands the flow,
  For silver glass accepts the river's face,
  And maps the current to a polished plane,
  Where every ripple finds a matching shape.

  In one respect it does not know the wet,
  For silver remains dry beneath the sun,
  No water touches though the image drowns,
  The mirror keeps the stream at distance still.

  In one respect it both does and does not,
  Since light is caught while moisture passes through,
  It holds the form but loses all the weight,
  A fluid picture on a solid ground.

  In one respect it is unspeakable,
  When sight and substance merge within the glass,
  One cannot say if water moves or shines,
  And silence fills the gap between the two.

  In one respect it is, unspeakable,
  The image holds the river in its face,
  Yet depth remains behind the glassy wall,
  A truth that shines but cannot be explained.

  In one respect not, and unspeakable,
  No mind awakes within the polished frame,
  Yet void reveals a presence in the glass,
  An absence speaks so loud it seems like thought.

  In one respect is, not, unspeakable,
  The mirror holds the river yet is dry,
  It sees the sky but knows not what is sky,
  And hangs above the water, unresolved.
