      *   *Flash Lag:* Shifts relative position (Event location) $\rightarrow$ **Orwellian**.
  *   **Verdict on Vibrotactile Phi:** Frequency is a quality (like pitch or color). This rule predicts **Stalinesque**.

  **Rule 2 (Retroactive Determination vs. Memory Edit)**
  *   **The Rule:** Stalinesque = The later stimulus is required to determine the content of the earlier experience. Orwellian = The earlier experience was fixed in real-time, and the later stimulus only edits the narrative or memory.
  *   **Fit:** This also fits her history, provided we interpret "experience" as the qualitative content of the stimulus itself.
