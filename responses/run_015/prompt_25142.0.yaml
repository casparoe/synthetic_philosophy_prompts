  > "Welcome. Today is a workshop on decision architecture. You are acting as a CTO selecting a backend configuration.
  >
  > 1.  You each receive 50 **Rationality Points (RP)**.
  > 2.  At the end of the session, the person with the highest RP balance receives [Small Prize/Recognition].
  > 3.  You will be assigned one of three Configurations (Alpha, Beta, or Gamma).
  > 4.  You will have opportunities to trade your current Configuration for a different one.
  > 5.  Every trade incurs a **transaction fee of 5 RP**, deducted from your balance.
  > 6.  You are free to accept or reject any trade.
  >
  > Do not discuss your preferences with neighbors. This is a solo optimization task."

  **Preference Elicitation (Private):**
  Before assigning the starting configuration, hand out a **Preference Sheet**.
  1.  "Circle the option you prefer: Alpha or Beta?"
  2.  "Circle the option you prefer: Beta or Gamma?"
  3.  "Circle the option you prefer: Gamma or Alpha?"
  *Collect these sheets immediately.* Do not look at them yet. This creates a record of their *synchronic* preferences to compare against their *diachronic* choices later.

  **Assignment:**
  Randomly assign everyone to start with **Config Alpha**. (This standardizes the pump direction).

  ---

  ## 2. Rules of the Market Phase

  **Your Role:** The Liquidity Provider (Market Maker).
  **Your Demeanor:** Neutral, bureaucratic, helpful. You are not an adversary; you are a service facilitating their preferences.

  **The Protocol:**
  1.  Walk around the room. Approach each participant individually.
  2.  **The Pitch:** "I see you currently hold **Alpha**. Based on general market demand, **Beta** is often considered an upgrade in reliability. Would you like to swap Alpha for Beta? The fee is 5 RP."
      *   *Crucial Constraint:* Do **not** reference their preference sheet. Do **not** say "You said you liked Beta better." Simply offer the trade as an opportunity.
      *   *If they hesitate:* "It's entirely optional. But if you prefer Beta, this is your chance to get it."
      *   *If they ask why:* "We are balancing the portfolio. Some people prefer lower latency, some prefer higher reliability. I'm offering liquidity so you can move to what you value."
  3.  **If they accept:**
      *   Take their Alpha card, give them Beta card.
      *   Mark "-5 RP" on their Ledger.
      *   Move to the next step of the pump immediately (do not wait for the whole room).
  4.  **The Second Offer (Immediate):**
      *   "Now that you hold **Beta**, I have an opening for **Gamma**. Gamma offers the lowest latency in the set. Would you like to swap Beta for Gamma? Fee is 5 RP."
  5.  **The Third Offer (Immediate):**
      *   "Now you hold **Gamma**. I can get you back to **Alpha**, which is a very balanced choice. Would you like to swap Gamma for Alpha? Fee is 5 RP."
  6.  **Stop Condition:**
      *   If they reject a trade, stop. Note their final holding.
      *   If they accept all three, they are back at Alpha, but 15 RP poorer.
      *   *Optional Aggressive Pump:* If they accept all three and seem frustrated, offer a 4th trade (Alpha to Beta) to see if they stop on their own. (Usually 3 is enough to prove the point).

  **Transaction Cost Logic:**
  The fee represents "switching costs," "integration time," or "transaction friction." It is real value lost.

  ---

  ## 3. Timeline (90 Minutes)

  *   **00:00 – 00:10 (Intro & Endowment):** Distribute materials, explain rules, hand out 50 RP. Emphasize the prize for highest balance.
  *   **00:10 – 00:20 (Elicitation):** Participants fill out the pairwise Preference Sheet. Collect sheets. Assign everyone Config Alpha.
  *   **00:20 – 00:50 (Market Phase):** You circulate. This takes time. Do not rush. Allow them to think. If someone finishes early, have them sit quietly (no talking).
      *   *Goal:* Complete at least one full cycle (A→B→C→A) with a subset of the group.
  *   **00:50 – 01:00 (Data Aggregation):** Collect Ledgers. Tally on whiteboard:
      *   Number of people who cycled (A→B→C→A).
      *   Number of people who stopped early.
      *   Average RP lost by cyclers vs. non-cyclers.
  *   **01:00 – 01:30 (Debrief):** Structured discussion (see script below).

  ---

  ## 4. Debrief Script

  **Phase 1: The Reveal (5 mins)**
  "Look at your final RP balance. If you made three trades, you lost 15 points—30% of your endowment. You ended up with the exact same Configuration you started with (Alpha), but you are significantly poorer.
  Look at your Preference Sheets from the start. Many of you who cycled wrote down: Beta > Alpha, Gamma > Beta, and Alpha > Gamma.
  If you prefer Beta to Alpha, and Gamma to Beta, logic suggests you should prefer Gamma to Alpha. But many of you preferred Alpha to Gamma.
  This phenomenon has a name. In decision theory, this is called a **Money Pump**."

  **Phase 2: Synchronic vs. Diachronic (10 mins)**
  "Let's distinguish two things.
  1.  **Synchronic Preferences:** What you wrote on the sheet at minute 10. A snapshot of your values at one time.
  2.  **Diachronic Choices:** What you did between minute 20 and 50. Actions taken over time.

  The Money Pump argument says: If your synchronic preferences are intransitive (A>B, B>C, C>A), your diachronic choices make you vulnerable. You become a 'sink' for value. A trader with deep pockets can extract infinite value from you simply by letting you act on your preferences.
  In this game, I was the trader. The 'fee' was the extraction. In the real world, the 'fee' is time, cognitive load, or actual money lost to arbitrage."

  **Phase 3: The Foresight Objection (10 mins)**
  "Some of you stopped after one or two trades. Why?"
  *(Expect answers like: 'I saw the pattern,' 'I didn't want to lose points.')*
  "Exactly. You used **foresight**. You realized that accepting the trade would lead to a future state where you'd be offered another trade that would harm you.
  This leads to a major philosophical debate: **Does rationality require foresight?**
  *   **View A:** No. Rationality is just satisfying your current preferences. If you prefer Beta now, take Beta. Worry about future-you later. (This view accepts the pump).
  *   **View B:** Yes. Rationality requires planning. You must anticipate the cycle and refuse the first trade, even if you prefer Beta to Alpha *right now*. This is called **Resolute Choice**."

  **Phase 4: Normative Conclusions (5 mins)**
  "So, what should we conclude?
  1.  **Transitivity is Instrumental:** It's not just an aesthetic rule for math. It's a defense mechanism. If you want to protect your resources, you must ensure your preferences don't cycle.
  2.  **Preference Revision:** Another way to stop the pump is to change your mind. When I offered Gamma to Alpha, you might have realized, 'Wait, if I prefer Gamma to Beta and Beta to Alpha, I should probably prefer Gamma to Alpha.' You updated your preferences to match logic.
  3.  **The Lesson:** When you feel a strong preference flip based on how a choice is framed (e.g., focusing on Latency in one pair and Reliability in another), pause. Check for cycles. If you find one, you are vulnerable."

  ---

  ## 5. Handling Failure Modes

  **1. The Suspicious Participant (Refuses all trades)**
  *   *In the moment:* "Understood. You're keeping Alpha. That's a valid choice."
  *   *In debrief:* Use them as the "Rational Ideal." "This person suspected the structure or had strict transitive preferences. They preserved 100% of their capital. They demonstrate that *suspicion of cycles* is a rational heuristic."

  **2. The Preference Reviser (Stops mid-cycle)**
  *   *Scenario:* They trade A→B, then refuse B→C.
  *   *In the moment:* Accept the refusal.
  *   *In debrief:* "This participant experienced 'preference revision.' The act of trading made them realize their values were inconsistent. They fixed the synchronic preference to avoid diachronic loss. This is a valid rationality strategy: updating your utility function to prevent exploitation."

  **3. The Non-Cycler (Transitive preferences)**
  *   *Scenario:* They prefer A > B > C and refuse trades.
  *   *In debrief:* "For this group, the options were transitive. They didn't get pumped. This highlights that money pumps only work on *specific* preference structures. However, in complex real-world decisions (e.g., hiring, investing), intransitivity is common because we weigh attributes differently in different contexts."

  **4. The Arbitrageur (Tries to trade back to you for profit)**
  *   *Scenario:* "I'll give you Alpha back for 3 RP instead of 5."
  *   *In the moment:* "I am the bank. I set the spread. Buy at 5, sell at 5. No negotiation."
  *   *In debrief:* "This highlights that in a real market, competition drives fees down. But if *you* are the only one with intransitive preferences, the market doesn't need to compete; you will pay the fee willingly."

  ---

  ## 6. Limitations and Philosophical Gaps

  **The Limitation:**
  This activity is a **finite, one-shot simulation**. A true philosophical money pump relies on the threat of *infinite* exploitation or a *Dutch Book* (guaranteed loss in a betting context). In this game, the loss is capped at 15 RP. A participant could argue, "I liked Beta more than Alpha enough to pay 5 RP. I don't care about the future cycle."
  Because the game ends, they never face the *consequence* of the full cycle until the debrief reveals it.

  **How to Supply the Missing Force:**
  In the debrief, you must articulate the **Generalization Argument**:
  > "In this game, the loss was small. But imagine this is your career. You take Job B over A (for a small raise). Then Job C over B (for better culture). Then Job A over C (for location). You've spent years switching, paid recruitment fees, lost seniority, and you're back at Job A.
  > The philosophical force of the Money Pump isn't about this specific game. It's that **if** you are intransitive, there *exists* a sequence of trades that ruins you. Rationality requires you to structure your preferences so that no such sequence *can* exist, regardless of whether a predator is currently standing in front of you."

  **Introducing "Dynamic Dutch Book":**
  Add a note: "In betting, this is called a Dutch Book. If your probabilities don't sum to 1, I can bet against you on all outcomes and guarantee you lose. Intransitive preferences are the utility-equivalent of incoherent probabilities. You are mathematically guaranteed to lose value over time if you act on them."

  ---

  ### Facilitator Checklist for Success
  *   [ ] **Neutrality:** Do not smirk when they trade. Be a bland bureaucrat.
  *   [ ] **Silence:** Enforce no talking during the Market Phase. Seeing others refuse trades ruins the pump for those who haven't traded yet.
  *   [ ] **The Sting:** Ensure the "Prize" for highest RP is desirable enough (even if just social recognition) that losing 30% feels like a failure.
  *   [ ] **Data Integrity:** Keep the Preference Sheets sealed until the debrief to prevent participants from adjusting their stated preferences to match their trades.
