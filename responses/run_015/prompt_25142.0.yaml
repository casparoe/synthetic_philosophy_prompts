  Here is a complete design for a 90-minute session on money pump arguments and diachronic rationality.

  ## 1. Setup and Materials

  **Materials Needed:**
  *   **Option Cards:** 3 distinct cards per participant (labeled **Config Alpha**, **Config Beta**, **Config Gamma**).
