  ### Problem Setup: Coastal Climate Adaptation

  **Context:** A municipal government must choose a flood-protection strategy for a vulnerable district over a 20-year horizon.
  **Parameter ($\theta$):** The probability of a "catastrophic surge" event occurring at least once during the horizon.
  **Credal Set:** Due to conflicting climate models, the probability is not a single value but an interval $[\theta_{min}, \theta_{max}]$.
  *   **Initial State ($t=0$):** Experts define the range as **$[0.2, 0.8]$**. (Center = 0.5).
  *   **Post-Evidence State ($t=1$):** A new hydrological study reduces uncertainty symmetrically without shifting the central estimate. The range narrows to **$[0.4, 0.6]$**. (Center = 0.5).

  **Decision Rule:** The agency applies **Maximin Expected Utility (MEU)**. It calculates the expected utility for each action across all probabilities in the credal set and selects the action with the highest *minimum* value (optimizing against the worst-case scenario).

  ### Actions and Payoff Structure

  Utilities are scaled from 0 (catastrophe) to 100 (optimal).

  1.  **Action A (Robust Public Infrastructure):**
      *   *Description:* Build a massive sea wall. High fixed cost, but guarantees safety regardless of the surge probability.
      *   *Payoff Logic:* Because the wall is expensive, its *relative* value is higher when the threat is real. If the threat is low, the spending is seen as wasteful.
      *   *Utility Function:* $U_A(\theta) = 20\theta + 30$
      *   *Sensitivity:* Low (Slope = +20).

  2.  **Action B (Market-Based Insurance Scheme):**
      *   *Description:* Rely on private insurance and emergency funds. Low upfront cost, but high vulnerability if the surge probability is high (premiums spike, coverage gaps appear).
      *   *Payoff Logic:* Highly sensitive to $\theta$. If $\theta$ is low, this is very efficient. If $\theta$ is high, it fails catastrophically.
      *   *Utility Function:* $U_B(\theta) = -100\theta + 100$
      *   *Sensitivity:* High (Slope = -100).

  ### Decision Analysis

  #### 1. Pre-Evidence Decision ($t=0$)
  **Credal Set:** $[0.2, 0.8]$

  *   **Action A:** Since utility increases with $\theta$, the worst case is at the lower bound ($0.2$).
      $$ \min U_A = 20(0.2) + 30 = \mathbf{34} $$
  *   **Action B:** Since utility decreases with $\theta$, the worst case is at the upper bound ($0.8$).
      $$ \min U_B = -100(0.8) + 100 = \mathbf{20} $$

  **Recommendation:** **Choose Action A.**
  *(Reasoning: Under high ambiguity, the agency fears the high-probability scenario where Action B fails. Action A is "safer" at the extremes.)*

  #### 2. Post-Evidence Decision ($t=1$)
  **Credal Set:** $[0.4, 0.6]$ (Symmetrically narrowed, center unchanged).

  *   **Action A:** The lower bound rises to $0.4$.
      $$ \min U_A = 20(0.4) + 30 = \mathbf{38} $$
      *(Improvement: +4 units)*
  *   **Action B:** The upper bound falls to $0.6$.
      $$ \min U_B = -100(0.6) + 100 = \mathbf{40} $$
      *(Improvement: +20 units)*

  **Recommendation:** **Choose Action B.**
  *(Reasoning: As uncertainty shrinks, the "worst-case" for the sensitive Action B improves drastically because the upper bound of risk drops. It now outweighs the modest gain of Action A.)*

  ### Conceptual Diagnosis

  This reversal highlights a fundamental structural difference between **imprecise probability frameworks** and **standard Bayesian conditioning**.

  1.  **Non-Linearity of the Decision Functional:**
      In Bayesian theory, the expected utility is linear in probabilities. If the mean probability (0.5) remains constant, the preferred action should not change. However, the Maximin rule is **non-linear**. It depends entirely on the *bounds* of the set, not the center.
      *   Action A is preferred when the set is wide because its worst-case (lower bound) is robust.
      *   Action B is preferred when the set is narrow because its worst-case (upper bound) improves rapidly as the interval shrinks.

  2.  **Value of Precision vs. Value of Information:**
      The reversal is not a failure of dynamic consistency, but a demonstration that **precision has intrinsic value** to an ambiguity-averse agent. The agent is not just updating beliefs about the event; they are updating their confidence in the model itself.
      *   Initially, the "cost of ambiguity" for Action B is too high.
      *   Once the study narrows the interval, the "ambiguity premium" drops, revealing that Action B was actually the superior choice all along (had the agent been Bayesian).

  **Conclusion:** The reversal indicates that rational choice under ambiguity requires treating the **width of the credal set** as a decision variable. Narrowing the set is structurally distinct from Bayesian conditioning because it alters the worst-case boundaries asymmetrically relative to the slopes of the utility functions, even when the central tendency remains fixed.
