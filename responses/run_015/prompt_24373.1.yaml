answer: |-
  Look, I've sat in enough reading groups to know exactly how this will play out. You've got a solid intuition—the "idealization collapse" argument is a classic move—but you're walking into a room where half the people have read Williams' "Internal and External Reasons" until it fell apart, and the other two think the whole metaphysics of reasons is folk psychology dressed up in a suit.

  Your argument is that once you idealize the agent (better informed, more rational), you've smuggled in external standards, so internalism is dead. The internalists will say you're confusing the *standard* of assessment with the *source* of the reason. The psychologists will say you're arguing about dictionary definitions.

  Here is the order of fire you're going to take, ranked by how much it hurts your position.

  ### 1. The "Anchor" Objection (The Internalist Heavy Hitter)
  **Who:** The sharpest internalist in the room, probably the one who organized the group.
  **The Question:** "You're saying that because the *content* of what my idealized self wants depends on external facts, the *reason* itself is external. But isn't the 'internal' in internalism about where the reason is *anchored*, not where the information comes from? If the reason still has to hook onto *my* capacity for deliberation starting from *my* actual desires, hasn't it still got an internal anchor, even if the map it uses is external?"

  **Your 2-Minute Reply:**
  "That's a fair distinction, and I want to grant that the *capacity* for deliberation is internal. But my claim is that the *normativity*—the 'oughtness'—comes from the ideal standard, not the anchor. If the only reason I have to quit smoking is that my idealized self would want to, but my actual self has zero desire to quit, the 'reason' is doing no work in my actual psychology. It's functioning as an external command that just happens to be phrased as a hypothetical desire. If the authority of the reason comes from the ideal self's rationality, and rationality is an objective standard, then the source of the norm is external, even if the delivery mechanism is my psychology. I'm arguing that an anchor doesn't make the ship internal if the compass is calibrated by the stars."

  **Where this is weakest:**
  You're conflating the *source of normativity* with the *condition of applicability*. They will press that the reason only applies *because* you have the internal capacity. If you don't have the capacity, the external fact doesn't give you a reason. That dependency is their definition of "internal." You need to be ready to say: "Dependency isn't identity."

  ### 2. The "Verbal Dispute" Objection (The Moral Psychologist)
  **Who:** One of the two psychologists. They'll look bored.
  **The Question:** "I'm worried we're just fighting over the word 'reason.' You want to use 'reason' to mean 'objective normative fact.' They want to use it to mean 'explanatory psychological state.' If we agree on the psychology—that I won't move unless I'm motivated—and we agree on the norms—that some things are objectively better—what actual work is this distinction doing? Are you solving a problem, or just picking a team?"

  **Your 2-Minute Reply:**
  "It's not just terminology because it changes who we blame when people act badly. If internalism is true, and a person has no motivational hook for morality, they literally have no reason to be moral. We might punish them, but we can't say they're irrational. If externalism is true, they have a reason, and they are irrational, even if they don't care. That changes how we understand moral responsibility. I'm not just labeling facts; I'm trying to preserve the idea that you can be wrong about what to do, even if you're perfectly consistent with your own desires."

  **Where this is weakest:**
  The psychologist will counter that "irrational" is just a label for "violating a social norm." They deny the robust normativity you're assuming. You risk sounding like you're begging the question by assuming moral realism is on the table.

  ### 3. The "Motivation Gap" Objection (The Pragmatist Internalist)
  **Who:** A friendly internalist who wants to help you but thinks you're missing the point of reasons.
  **The Question:** "Okay, let's say you're right. There are external reasons. But reasons are supposed to explain action. If I have an external reason that connects to nothing in my motivational set, how does it actually get me to *do* anything? If it can't motivate, in what sense is it a reason *for me* rather than just a reason *for the universe*?"

  **Your 2-Minute Reply:**
  "I think we have to separate the *existence* of a reason from the *explanation* of an action. I can have a reason to take medicine that will save my life, even if I currently desire to die. The reason exists because of the value of my life, not my desire. That I fail to act on it shows a defect in me, not a defect in the reason. We shouldn't define 'reason' so narrowly that it only applies to people who are already motivated. That makes reasons redundant—they just describe what we were going to do anyway."

  **Where this is weakest:**
  This pushes you toward Rationalism (the view that reason alone can motivate). If you aren't prepared to defend that, they will eat you alive. Internalists hold that belief + desire = action. If you cut out desire, you need a new theory of motivation.

  ### 4. The "Deliberative Discovery" Objection (The Williams Scholar)
  **Who:** Someone who has read the text closely.
  **The Question:** "Williams allows for 'deliberative routes.' If I desire safety, and I deliberate, I might discover that this bridge is unsafe. I didn't desire 'avoiding this bridge' before, but I do now. Isn't that just internal deliberation uncovering implications, not importing external norms? Why is that a collapse?"

  **Your 2-Minute Reply:**
  "Because the 'unsafe' fact is independent of my desire. The deliberation is valid only because there is an external fact about the bridge's structural integrity that constrains the deliberation. If the bridge were safe, my deliberation would be wrong, regardless of my desires. So the correctness of the deliberation is tracked by external facts, not internal coherence. The internalist says the reason is the desire; I'm saying the reason is the fact that the desire latches onto."

  **Where this is weakest:**
  Williams would say the reason is the *combination*. You're isolating the fact. They will argue the fact is inert without the desire.

  ***

  ### Strategic Advice

  **What to Concede Up Front:**
  Concede that *motivation* requires something internal. Don't fight the Humean Theory of Motivation (Belief + Desire = Action) head-on unless you are ready to defend Rationalism. Say: "I agree that to *act*, I need a motive. I'm arguing that to *have a reason*, I don't." This splits the battlefield. It makes you look reasonable and isolates the debate to normativity, not psychology.

  **What to Hold Firm On:**
  Hold firm that **idealization implies an objective standard.** Do not let them define "rationality" as purely procedural. If "being rational" means "satisfying external norms of coherence or truth," then appealing to a rational self is appealing to external norms. Don't let them hide the external standard inside the word "rational."

  **The One Objection You're Hoping Nobody Raises:**
  *"If reasons are external, how do we know what they are? What is the epistemology?"*
  If they ask this, you have to explain how we access these external reasons without relying on our own internal cognitive faculties. If you say "intuition," you look mystical. If you say "reasoning," they'll ask "whose reasoning?" (which loops back to internalism). This exposes the cost of your view: you've solved the grounding problem but created an epistemological black box. If they ask this, punt to "that's a meta-ethical question for another talk," or be very careful about appealing to shared human capacities without calling them "internal reasons."

  **Final Tip:**
  When the psychologists speak, don't try to beat them on psychology. You won't. Beat them on *normativity*. Tell them: "You can explain why I *did* X. I want to explain why I *should have done* Y. Your vocabulary can't do the second job." That's your wedge. Good luck.
