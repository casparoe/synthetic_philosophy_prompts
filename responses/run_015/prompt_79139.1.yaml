answer: |-
  1. **Brainstorm**
  *   Repeal resistance stems from embeddedness: does the policy create a self-sustaining constituency or merely comply with a rule?
  *   Key factors: social ontology (is the category real outside law?), institutional ownership (do elites want it?), and substitution costs (can proxies work?).
  *   High depth: policy mirrors pre-existing social cleavages or creates powerful vested interests.
  *   Low depth: policy is a thin compliance layer atop unchanged market dynamics.
  *   The US abolition reveals that repeal depth measures elite commitment more than statutory text; *SFFA* ended the rule, but not the practice.

  2. **Ranking**
  1. India: Caste-based reservation in education and public employment (Deep)
  2. US: Race-conscious holistic admissions at selective universities (Medium)
  3. Norway: Gender quota for corporate boards (Shallow)

  3. **Mechanisms**
  **India:** Caste is not just legal classification but social ontology. Even without state mandates, caste networks govern marriage, voting, and informal hiring. The beneficiary constituency comprises hundreds of millions of voters who treat reservation as an entitlemental right. Abolition would trigger immediate political collapse, but socially, caste cohesion ensures continued preferential treatment within communities regardless of statute.

  **US:** Elite institutional ownership drives persistence. Despite *SFFA*, universities retain discretion over essays and class geography. The mechanism is proxy substitution: administrators encode race through correlated variables (zip codes, adversity scores) because diversity is core to their brand. Legal abolition raised compliance costs but has not removed the administrative will to reproduce demographic outcomes.

  **Norway:** The quota targeted a specific governance node without transforming the executive pipeline. While it created a pool of "golden skirts," it did not fundamentally alter CEO selection or middle-management promotion norms. If abolished, market pressures would revert board composition because the quota operated as a compliance ceiling rather than reshaping the underlying labor market infrastructure.

  4. **The case against my metric**
  Repeal depth privileges inertia over justice. A regime might persist simply because dismantling it is bureaucratically costly, not because it achieves equity. Conversely, a "shallow" regime might have succeeded precisely because it was temporary scaffolding that rendered itself unnecessary by changing norms. Ranking by survival biases toward entrenched identity politics (India) and against successful normalization (Norway). We should measure impact on equality, not the stubbornness of the bureaucracy administering it.

  5. **Bottom line**
  India's caste reservation is the most repeal-resistant because it rides on pre-existing social fault lines rather than creating new ones. My ordering would flip only if evidence emerged that US universities, fearing litigation, fully abandon diversity proxies, collapsing enrollment gaps faster than anticipated, proving their commitment was purely legalistic rather than cultural.
