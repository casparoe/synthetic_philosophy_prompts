answer: |-
  Hi there. This is a hard job, and your instincts are better than you think. Your two tests are not junk. The 1975 test is a proxy for empathy across time, checking whether our tone would age as poorly as the 1920s text has. The losers' bet is a proxy for contingency, checking whether we are treating history as a script rather than a series of choices. Keep both. They just need to be operationalized so you can run them out loud without sounding like a professor.

  Here is a four-step procedure you can read from a sheet. It moves from fact to framing. First, ask if the claim is verifiable. If a marker says typhoid rates dropped, that is a fact. If it says the city was filthy, that is a judgment. Facts stay. Judgments move to step two. Second, ask the inevitability question. Could a sensible person at the time have bet against this outcome? If the marker says science prevailed or barriers were broken, it implies the outcome was destined. Change verbs from things that happen on their own to things people did. Science does not prevail; engineers build plants. Barriers do not break; people push them. Third, ask the judgment question. Does this sentence make past people look foolish for not knowing what we know? If yes, cut it. We can acknowledge suffering without mocking ignorance. Fourth, ask the cost question. If the marker celebrates a gain, does it acknowledge what was lost to get it? If the answer is unknown, state the gain narrowly. If the answer is known and significant, it must be included.

  This procedure stops and says a line has to go when it fails the judgment question. Mocking the past is never acceptable. It throws up its hands and calls for a vote when the cost question reveals a conflict of values rather than facts. For example, whether a highway was worth the neighborhood it destroyed is a values call. The procedure protects you from bad history, not from political disagreement. It also guards against the failure mode of sterilizing the text. You are allowed to say a change was good if you can verify the improvement, like lower disease rates. You are just not allowed to say the present was the inevitable goal of the past.

  Now let's run your three drafts. The water plant marker fails step three and step two. Drank its own filth mocks the past residents who lacked infrastructure they could not build themselves. At last and joined the modern world imply inevitability and superiority. The typhoid numbers are real, so the improvement is verifiable, but the framing is wrong. Cut the filth. Cut the modern world. Keep the health outcome. A fix looks like this: In 1898, the city opened a water filtration plant. Before this, contaminated water caused frequent typhoid outbreaks. The new system reduced disease and improved public health. This keeps the civic pride without the condescension.

  The Dr. Renner marker is harder because you like it. The procedure says cut most of it. Broke through barriers and opened the door are metaphors that imply the barriers were waiting to be broken and the door was waiting to be opened. It makes her success sound like a destiny fulfilled rather than a struggle won. It also implies every woman who followed succeeded because of her, which is unverifiable. To keep the spirit without the Whig history, focus on her specific action and the specific resistance she faced. Here is the script for the committee: We are not diminishing her achievement. We are making it more real. Saying she broke barriers sounds like a fairy tale. Saying she practiced medicine despite laws that tried to stop her sounds like history. People respect struggle more than destiny. A fix looks like this: In 1925, Dr. Alice Renner became the first woman licensed to practice medicine in Cedar Heights. State regulations had previously barred women from licensure. Her practice treated patients for thirty years.

  The Brightmoor marker is the trap you identified. It flips the Whig history but keeps the structure. Thrived is hard to verify without data. Destroyed is accurate but emotional. Built a road is an understatement that minimizes the policy choice. The procedure demands we verify the community value and specify the action. If you say families lived here, that is fact. If you say the city acquired the land for a highway, that is fact. The values call is whether you call it destruction. Since the neighborhood was bulldozed, destruction is factually accurate regarding the buildings, but the community loss is the values call. My advice is to defer this one. Ten minutes is not enough for urban renewal trauma. This needs a subcommittee and oral histories. If you must vote, strip the evaluation. A fix looks like this: Brightmoor was a Black neighborhood established in 1910. In 1961, the city acquired the land through eminent domain to construct the highway. Residents were relocated. This is dry, but it survives the council vote because it is undeniable.

  Here is what the procedure cannot do. It cannot fix markers that are too contested for ninety words. If a story requires explaining systemic racism or economic tradeoffs, a sidewalk plaque is the wrong medium. Put those on a website QR code. It cannot resolve fights about what the town wants to be. If the committee wants to celebrate the founders and you know the founders were speculators, the procedure will tell you to say speculators, but the committee will vote to say founders. In that case, defer. Do not bring a marker to the council if the committee vote was split three to two. It also cannot fix the ten-minute limit. If a marker needs more than ten minutes of discussion, table it. Rushing history creates errors.

  Your job is not to write perfect history. It is to write history that does not lie. The procedure ensures you do not lie about inevitability or mock the dead. It leaves the politics to the committee. Use the tests. If a sentence would make you wince in 1975, cut it. If a sentence implies no one could have bet against the outcome, rewrite it. When in doubt, choose the verb that requires a human hand. People build, people break, people choose. Cities do not join modern worlds. People do. Good luck at the meeting.
