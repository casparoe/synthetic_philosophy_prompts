  ### Take-Home Exam Question: Seminar in Epistemology & Statistics

  **Question 1: The Grue-Bayes Mashup (100 Points)**

  Consider a Bayesian learner, Agent $\alpha$, who is investigating the color of emeralds. Agent $\alpha$ has already observed 1,000 emeralds, all of which are green. This data constitutes **Old Evidence** ($E$); the agent knows $E$ with certainty ($P(E) = 1$).

  Agent $\alpha$ is comparing two hypotheses:
  1.  $H_{Green}$: All emeralds are green.
  2.  $H_{Grue*}$: All emeralds are *grue*, defined specifically as: "Green if observed within the first 1,000 samples, Blue if observed thereafter."

  Note that $H_{Grue*}$ defines the switch point using **sampling frequency** (observation order) rather than **clock-time** (calendar date). Agent $\alpha$ argues that because induction relies on discrete observations rather than continuous time, priors should be weighted based on sampling stability. Consequently, $\alpha$ assigns a prior probability $P(H_{Grue*})$ that is equal to $P(H_{Green})$, claiming this removes the bias against "grue" predicates found in standard linguistic entrenchment solutions.

  **Task:**
  Write an essay evaluating Agent $\alpha$'s strategy. Specifically:
  1.  Using Bayes' Theorem, demonstrate how the status of $E$ as **Old Evidence** constrains the agent's ability to update beliefs between these two hypotheses.
  2.  Argue whether defining the predicate via sampling frequency rather than clock-time breaks the logical symmetry between $H_{Green}$ and $H_{Grue*}$, or if it merely hides a bias in the prior assignment.
  3.  Conclude whether this approach solves the New Riddle of Induction or simply relocates the problem.

  ***

  ### Model Answer

  **The Symmetry of Priors and the Problem of Old Evidence**

  Agent $\alpha$'s attempt to resolve the New Riddle of Induction by shifting from clock-time to sampling frequency fails to break the logical symmetry of the problem. Instead, it obscures the necessary bias required for induction within the prior assignment. To see this, we must analyze the Bayesian mechanics of the update, specifically given the status of the evidence as "old."

  Bayes' Theorem states that the posterior probability of a hypothesis $H$ given evidence $E$ is proportional to the likelihood times the prior: $P(H|E) \propto P(E|H)P(H)$. When comparing two competing hypotheses, the posterior odds are determined by the prior odds multiplied by the Bayes Factor (the ratio of likelihoods):
  $$ \frac{P(H_{Green}|E)}{P(H_{Grue*}|E)} = \frac{P(H_{Green})}{P(H_{Grue*})} \times \frac{P(E|H_{Green})}{P(E|H_{Grue*})} $$

  The critical constraint here is that $E$ (1,000 green emeralds) is **Old Evidence**. The agent already knows $E$ is true. Under standard Bayesian conditionalization, if $E$ is certain, $P(E) = 1$. More importantly, both $H_{Green}$ and $H_{Grue*}$ are constructed specifically to entail the observed data. $H_{Green}$ predicts all emeralds are green, which fits the 1,000 observations. $H_{Grue*}$ predicts emeralds are green up to sample 1,000, which also fits the 1,000 observations perfectly. Therefore, the likelihoods are identical: $P(E|H_{Green}) = 1$ and $P(E|H_{Grue*}) = 1$. The Bayes Factor is 1.

  Because the likelihood ratio is 1, the data $E$ provides no discriminatory power between the hypotheses. The posterior odds are identical to the prior odds. This is the essence of the Old Evidence problem in this context: since the data was available before the hypotheses were compared (or is simply known with certainty), the learning cannot come from the update. The entire burden of justification falls on the prior ratio $\frac{P(H_{Green})}{P(H_{Grue*})}$.

  Agent $\alpha$ claims that by defining the switch point via sampling frequency rather than clock-time, they can assign equal priors ($P(H_{Green}) = P(H_{Grue*})$) without bias. This claim is false. It mistakes a change in labeling for a change in logical structure. In the context of this experiment, sampling order and clock-time are perfectly correlated. The 1,000th sample occurs at a specific time $t_{1000}$. A predicate that switches at sample 1,001 is logically isomorphic to a predicate that switches at time $t_{1001}$.

  By asserting that sampling-based predicates are equally projectible to uniform predicates, Agent $\alpha$ is not solving the symmetry; they are stipulating that the symmetry should remain unbroken. However, induction *requires* breaking this symmetry. To predict that the 1,001st emerald will be green rather than blue, the agent must assign $P(H_{Green}) > P(H_{Grue*})$. If the priors are equal, the agent remains agnostic about the next observation, rendering induction impossible.

  Therefore, shifting the definition from time to samples does not remove the need for bias; it merely hides it. Goodman's original solution appealed to "entrenchment"—the historical success of certain predicates. Agent $\alpha$ is attempting a similar move by appealing to the "nature of sampling." But unless there is an independent justification for why sample-based switches are less probable than uniform properties (e.g., a simplicity metric or a metaphysical claim about nature's uniformity), assigning equal priors is arbitrary.

  Furthermore, this approach fails to address why Old Evidence matters. If the evidence were "new" (i.e., the agent hypothesized before observing), the likelihoods might still be equal, but the psychological process of hypothesis formation might differ. With Old Evidence, the logical underdetermination is stark: the data cannot speak. Agent $\alpha$'s strategy attempts to let the data structure (sampling) speak for the prior, but since the data fits both hypotheses equally, the structure provides no leverage.

  In conclusion, Agent $\alpha$'s strategy does not solve the New Riddle. It correctly identifies that clock-time is not special, but incorrectly assumes sampling frequency is therefore neutral. Both are parameters for defining predicates. Without an asymmetric prior justified by something outside the current data (such as simplicity or meta-inductive history), the agent cannot prefer $H_{Green}$. The bias is not eliminated; it is relocated from the likelihood (where it cannot exist) to the prior (where it is hidden behind the claim of sampling neutrality). Induction remains impossible without a non-empirical commitment to projectibility.

  ***

  ### Marking Scheme

  **Total Points: 100**

  **A Grade (85-100 points): The "Symmetry Breaker"**
  *   **Bayesian Mechanics (30 pts):** Explicitly calculates or describes the Posterior Odds formula. Correctly identifies that because $E$ is Old Evidence and fits both hypotheses, the Likelihood Ratio ($P(E|H)$) is 1:1. States clearly that the Posterior depends *entirely* on the Prior Ratio.
  *   **Isomorphism Argument (30 pts):** Argues that switching from "clock-time" to "sample-number" is structurally identical (isomorphic) in this context. Recognizes that correlating the switch to samples does not change the logical underdetermination.
  *   **Prior Bias Identification (25 pts):** Explicitly states that equal priors lead to agnosticism (no induction). Identifies that $\alpha$'s claim of "neutrality" is actually a hidden bias *against* making a prediction.
  *   **Old Evidence Relevance (15 pts):** Explains why the "Old Evidence" status prevents the data from resolving the tie, forcing the justification into the prior.

  **B Grade (70-84 points): The "Goodman Repeater"**
  *   **Bayesian Mechanics (15 pts):** Mentions Bayes' theorem but fails to explicitly note that the Likelihoods are identical. Might suggest the data *could* update the beliefs if the model were different.
  *   **Isomorphism Argument (15 pts):** Discusses Goodman's entrenchment or the definition of Grue but treats "sampling frequency" as objectively different from "clock-time" without arguing why they are logically equivalent in this scenario.
  *   **Prior Bias Identification (25 pts):** Correctly identifies that priors matter, but argues that $\alpha$'s approach is "better" than Goodman's without explaining why it fails to solve the symmetry.
  *   **Old Evidence Relevance (15 pts):** Mentions Old Evidence but treats it as a side note rather than the crucial reason why the Prior Ratio is the only moving part.

  **C Grade (50-69 points): The "Surface Reader"**
  *   Summarizes the Grue paradox correctly.
  *   Fails to use Bayesian terminology (Likelihood, Prior, Posterior).
  *   Argues that sampling frequency is obviously better because "we count emeralds, not time."
  *   Does not address the Old Evidence constraint.

  **Fail (Below 50 points):**
  *   Fundamental misunderstanding of the Grue paradox (e.g., thinks Grue means "green then green").
  *   No engagement with the specific scenario provided.
  *   Incoherent argumentation.
