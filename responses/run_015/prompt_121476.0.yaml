prompt: |-
  I've been going down a rabbit hole about panpsychism after watching some youtube debates and theres this one line everyone repeats: 'if consciousness is fundamental then suffering is fundamental too'. They throw it around like its either a knockout punch against panpsychism ('so rocks are in agony? absurd.') or like its harmless ('atoms dont suffer enough to matter'). I cant tell if its actually saying something deep or just being vague.

  Can you lay out the different precise claims that sentence could be hiding? Like is it equating consciousness with suffering, or saying any conscious thing can suffer, or that total suffering scales with how much consciousness is out there? And then theres this other idea I half-cooked up: maybe suffering needs not just raw consciousness but some kind of integrated information, and if particles only have near-zero integration then they technically 'feel' but in no way that counts ethically. Is that even coherent?

  Anyway I want a list I can bring to a discussion group. For each reading say if its trivial, defensible, or false, and whether it actually supports the 'this is ethically horrifying' move or the 'this is totally fine' move. Also tell me which reading people are probably smuggling in when they use the line to shut the conversation down. No need for citations, just the menu.
