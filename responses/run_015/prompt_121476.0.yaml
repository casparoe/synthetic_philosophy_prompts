answer: |-
  This is a classic rhetorical move in philosophy of mind: taking a metaphysical claim (consciousness is fundamental) and jumping immediately to an ethical conclusion (the universe is full of pain) without defining the middle steps.

  You are right to be suspicious. The sentence "if consciousness is fundamental, then suffering is fundamental too" is ambiguous. It conflates *existence* with *valence* (positive/negative feeling) and *micro-experience* with *macro-suffering*.

  Here is the menu of precise claims hidden inside that slogan, broken down for your discussion group.

  ### The Menu of Interpretations

  #### 1. The Equivalence Claim
  *   **The Claim:** To be conscious *just is* to have a positive or negative feeling. There is no such thing as neutral consciousness. Therefore, if matter is conscious, it is necessarily feeling good or bad.
  *   **Status:** **False.** Phenomenologically, we can identify states of awareness that lack strong valence (e.g., observing a neutral shape, or certain meditative states). Most philosophers agree consciousness and valence are distinct properties.
  *   **Ethical Move:** Supports **"Ethically Horrifying."** If existence equals feeling, and the universe is mostly chaotic matter, the default state might be noise/agitation (suffering).
  *   **Smuggled?** **Yes.** This is the most common smuggled assumption. Critics assume you can't have "awareness" without "something it feels like," and they assume "something it feels like" implies "suffering or pleasure."

  #### 2. The Capacity Claim
  *   **The Claim:** If an entity is conscious, it possesses the *hardware* for suffering, even if it isn't currently suffering. Fundamental consciousness means the *potential* for suffering is ubiquitous.
  *   **Status:** **Defensible.** If consciousness is a fundamental field, the potential for negative valence exists everywhere.
  *   **Ethical Move:** **Neutral / Trivial.** Having the capacity to suffer is not the same as suffering. A rock having the capacity to suffer doesn't matter ethically unless that capacity is activated.
  *   **Smuggled?** **Sometimes.** Used to suggest that we risk causing harm to matter just by interacting with it, though this is usually a secondary argument.

  #### 3. The Aggregation Claim (The "Summing" Problem)
  *   **The Claim:** Micro-experiences (atoms) sum up to macro-experiences (humans). If an atom has 0.0001 units of suffering, and there are $10^{80}$ atoms, the total suffering in the universe is astronomical, even if individual units are tiny.
  *   **Status:** **Highly Contested.** This is the "combination problem" in panpsychism. We don't know if micro-suffering adds up, cancels out, or disappears when integrated into a larger mind.
  *   **Ethical Move:** Supports **"Ethically Horrifying."** This leads to the "Cosmic Horror" conclusion: the universe is a sea of tiny pains that sum to an ethical catastrophe.
  *   **Smuggled?** **Yes.** This is the heavy lifter for the "knockout punch." It relies on the intuition that $1,000,000 \times \text{tiny pain} = \text{big pain}$.

  #### 4. The Valence Claim (Proto-Valence)
  *   **The Claim:** Fundamental consciousness doesn't have full-blown "suffering," but it has *proto-valence* (a primitive push/pull, attraction/repulsion). Physical forces (like electromagnetism) are the external view of this internal push/pull.
  *   **Status:** **Defensible (within Panprotopsychism).** This is a sophisticated version of the view. It suggests physics *is* the behavior of conscious entities seeking/avoiding states.
  *   **Ethical Move:** **Ambiguous.** If "repulsion" counts as suffering, it's horrifying. If it's just a metaphysical analogue to preference without felt pain, it's **"Totally Fine."**
  *   **Smuggled?** **Rarely.** This is usually a technical defense *by* panpsychists, not the attack *against* them.

  #### 5. The Structural Threshold Claim (Your Idea)
  *   **The Claim:** Suffering requires not just consciousness, but specific *complexity* or *integration* (e.g., a self-model, memory, anticipation). Fundamental particles have consciousness but lack the structure to suffer.
  *   **Status:** **Defensible.** This aligns with Integrated Information Theory (IIT) and other structuralist views. It distinguishes between *experience* (raw feel) and *suffering* (complex negative evaluation).
  *   **Ethical Move:** Supports **"Totally Fine."** It grants the metaphysics of panpsychism but blocks the ethical nightmare. Atoms feel, but they don't *mind*.
  *   **Smuggled?** **No.** This is usually the rebuttal *to* the slogan, not the slogan itself.

  ---

  ### Analysis of Your "Half-Cooked" Idea
  **Is it coherent?**
  Yes, it is highly coherent and is actually the standard defense used by sophisticated panpsychists (like Philip Goff or Galen Strawson in certain moods).

  **The Logic:**
  1.  **Consciousness $\neq$ Suffering.** Suffering is a specific *type* of consciousness.
  2.  **Suffering requires Integration.** To suffer, you generally need a representation of "self" and a representation of "future" or "state of affairs" that is being violated. You need to care about what happens next.
  3.  **Particles lack Integration.** An electron might have a "point of view" (panpsychism), but it likely doesn't have a model of itself persisting through time.
  4.  **Conclusion:** An electron might have an experience, but it cannot suffer because it lacks the cognitive architecture to register that experience as "bad."

  **Ethical Weight:**
  If this claim holds, the "Ethically Horrifying" move collapses. It renders the suffering of fundamental matter ethically negligible, similar to how we treat a reflex arc in a decapitated animal—it reacts, but does it *suffer*?

  ---

  ### Discussion Group Cheat Sheet

  When someone drops the line *"If consciousness is fundamental, suffering is fundamental,"* ask them which of these three they mean:

  1.  **The Reductio (Smuggled):** "Are you saying rocks are actively in agony right now?"
      *   *Counter:* "No, that assumes consciousness equals suffering (False) and that micro-pains sum to macro-pains (Unproven)."
  2.  **The Cosmic Waste:** "Are you saying the total sum of micro-suffering outweighs human joy?"
      *   *Counter:* "Only if you believe micro-experiences aggregate linearly. If they don't sum, the total is zero."
  3.  **The Metaphysical Cost:** "Are you saying the *potential* for suffering is built into reality?"
      *   *Counter:* "Yes, but potential is not actual. Humans have the potential to commit murder; that doesn't make every human a murderer."

  **Verdict on the Slogan:**
  It is mostly a **rhetorical shortcut** that relies on smuggling in the **Equivalence Claim** (Consciousness = Suffering) and the **Aggregation Claim** (Tiny pains add up). Without those two assumptions, the sentence loses its "knockout punch" power and becomes a much softer claim about the nature of value in the universe.

  **Your Best Move:**
  Push the **Structural Threshold Claim**. Argue that suffering is a high-level emergent property that requires a specific organization of consciousness (integration/time-binding), not just the presence of consciousness itself. This allows you to keep panpsychism without accepting the cosmic horror.
