    "broad_content_claim": "Oscar and Twin Oscar possess distinct thoughts because their demonstrative references fix on different substances (H2O vs. XYZ).",
    "narrow_content_option": "Twins share a context-independent 'narrow' content based on phenomenal character or functional role, distinct from truth-conditional 'broad' content.",
    "key_risk_for_middle_ground": "If narrow content lacks truth conditions it ceases to be representational, but if it dictates truth conditions it violates externalism.",
