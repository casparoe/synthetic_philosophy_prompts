answer: |-
  The extension of Putnam's Twin Earth argument from linguistic terms (like "water") to demonstrative thoughts (like "that liquid is refreshing") exposes a profound tension in the philosophy of mind known as the problem of **mental content individuation**. In the original scenario, Putnam argued that the extension of "water" is determined by the physical environment (H2O on Earth, XYZ on Twin Earth), implying that meaning is not solely determined by internal states. When this logic is applied to perceptual demonstratives, the issue becomes more acute because demonstratives are ostensibly anchored in immediate experience. When Oscar thinks "that liquid is refreshing" while viewing H2O, and Twin Oscar thinks the same while viewing XYZ, semantic externalism suggests their thoughts have different truth conditions: one is about H2O, the other about XYZ.

  The conceptual issue arises when we ask whether Oscar and Twin Oscar share *any* mental state. If externalism is applied rigorously to all mental content (a position known as "content externalism" or "anti-individualism"), the twins share no propositional attitudes. This creates a crisis for psychological explanation. Psychology typically generalizes across individuals based on shared mental states (e.g., "thirst causes water-seeking behavior"). If the twins' mental contents are entirely different due to their environments, we cannot explain their identical behaviors via identical psychological laws. This suggests that if externalism is true, mental content cannot be the local cause of behavior, threatening the causal efficacy of the mental.

  To avoid this, many philosophers propose a **two-factor theory** of content, establishing a middle ground. This view distinguishes between **broad content** (truth-conditional, externalist, dependent on the environment) and **narrow content** (internalist, dependent only on the subject's intrinsic properties). In the demonstrative case, while the *broad* content differs (H2O vs. XYZ), the twins share the same *narrow* content. This narrow content is often cashed out as a "mode of presentation," a functional role, or a phenomenal character that remains constant regardless of the external substance. This allows externalism to remain true about reference and truth while preserving a shared mental life that can ground psychological generalizations.

  However, this middle ground faces the risk of **collapsing into internalism** or becoming trivial. Critics argue that if narrow content is stripped of truth conditions to avoid violating externalism, it ceases to be genuine "content" (representation) and becomes merely syntactic or phenomenal qualia. Conversely, if narrow content is assigned truth conditions (e.g., "the clear liquid in front of me"), those conditions must be satisfied internally, which effectively reinstates internalism and denies the core externalist insight that the world partly constitutes the mind. For externalism about mental content to remain coherent, it must accept that "content" is an ambiguous term: one sense tracks the world (broad), and the other tracks the mind's causal role (narrow). Without this distinction, externalism renders psychology impossible; with it, externalism risks diluting the notion of intentionality.

