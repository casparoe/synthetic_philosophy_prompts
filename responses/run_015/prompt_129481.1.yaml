      *(Final check on the "Sacrifice")*: The user says "I would sooner give up my calm about the aphids than my contempt for the boiling water." I should honor this. The principle will require admitting aphids have *some* standing, even if overridden by necessity, rather than none.

      *(Wait, one more thing)*: The parasitic wasps. This is tricky. Releasing wasps causes caterpillar suffering. Is this worse than soap? Soap is instant death? Wasps are slow death. The principle needs to weigh *manner of death* under Clause 4.

