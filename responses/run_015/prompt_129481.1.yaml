      *   (4) Neighbour's Ants: Boiling water = callous. My sprays = fine. *Rule:* This is the tension point. Why is boiling water worse than spray? Intent? Method? *Rule:* Might struggle here unless "boiling water" implies gratuitous suffering vs. "spray" implies agricultural necessity (Counterfactuals - Clause 3).
      *   (5) Bees: High value. Brother says it's charisma. *Rule:* Evidence for bee sentience/social structure is higher? Or is this just bias? *Rule:* Needs to accommodate this without admitting mere charisma.
