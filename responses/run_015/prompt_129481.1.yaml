      *   *Resolution:* The distinction must be *context* (agricultural necessity vs. domestic convenience) OR *complexity* (social insects vs. solitary pests). The user's brother says bees vs. ants is charisma. To keep the Bee verdict, the principle must acknowledge social complexity or behavioral flexibility as "earned evidence."
      *   *The Sacrifice:* The user might have to admit that the "calm about aphids" is partially due to *distance/abstraction* rather than pure evidence, OR admit that the "contempt for boiling water" is about *human character* (virtue ethics) rather than insect suffering.
      *   *Decision:* I will suggest the principle forces a slight adjustment on the Aphids (acknowledge *some* moral weight, even if negligible) or justifies the Ants verdict via the "gratuitous" clause. The bigger sacrifice is the "Time Multiplier." The principle must reject counting "moments of experience" to avoid the "internal head" explosion.

  8.  **Drafting the Response:**
      *   *Tone:* Respectful, practical, clear, avoiding academic jargon where possible. Match the user's thoughtful, grounded style.
      *   *Structure:*
