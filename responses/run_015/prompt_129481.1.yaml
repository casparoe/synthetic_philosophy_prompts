      *   *Refinement 1:* The evidence threshold must be high enough to exclude nematodes and aphids but include chickens and lobsters.
      *   *Refinement 2:* The "counterfactual" clause needs to distinguish between *necessary* agricultural killing and *gratuitous* destruction (explaining the ant nest vs. aphid spray).
      *   *Refinement 3:* The "time perception" multiplier needs to be addressed. If we count "moments of experience," fast brains suffer more. The principle should probably stick to "welfare impact per life" rather than "computational cycles of pain" to avoid the absurdity the user fears.

  6.  **Addressing the Undecided Cases:**
      *   *Parasitic Wasps:* Larvae eat caterpillars alive. User feels nothing. *Principle:* If caterpillars have low sentience evidence, this is fine. If wasps are agents, is their suffering relevant? Usually, biological control is seen as "natural" but ethically it's predation. The principle should focus on the *gardener's* causal responsibility.
      *   *Cost Premium:* Quarter more for fast-acting treatment. *Principle:* Clause 4 ("cheaper-in-every-sense kinder option"). If it reduces suffering significantly, the small cost is warranted.
      *   *Digging Beds:* Nematodes. *Principle:* Clause 1 (evidence) + Clause 3 (counterfactual: you need to grow food). Digging stays.

  7.  **Identifying the Sacrifice:**
      *   The user wants to keep: Contempt for boiling water (4), Calm about aphids (3), Bee value (5).
