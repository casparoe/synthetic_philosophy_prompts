answer: |-
  **1. Exam Question**

  **Question 3 (25 Marks)**

  **Framework:** Let $X$ be a universe of alternatives with $|X| \ge 3$. An *agenda* is any finite subset $A \subseteq X$ with $|A| \ge 2$. A *profile* $P$ on $A$ is a tuple of strict linear orders $(\succ_1, \dots, \succ_n)$ over $A$. A *Social Welfare Function* (SWF) $F$ assigns to every admissible agenda $A$ and profile $P$ a complete and transitive social relation $\succeq_S$ on $A$.

  **Arrow's Theorem:** You may cite the following result without proof: *Fix an agenda $A$ with $|A| \ge 3$. If an SWF satisfies Unrestricted Domain, Weak Pareto, Independence of Irrelevant Alternatives (IIA), and Collective Rationality, then it is dictatorial.* (Recall: IIA requires the social ranking of $x, y$ to depend only on the individual rankings of $x$ against $y$).

  **New Conditions:** We introduce two conditions for this variable-agenda framework.
  1.  **Rank-Intensity Independence (RII):** For any agenda $A$ and profile $P$, the social comparison between $x, y \in A$ depends only on the vector of *rank distances* and directions. Specifically, it depends only on the set of pairs $\{(d_i, \delta_i)\}_{i=1}^n$, where $\delta_i = 1$ if $x \succ_i y$ ($-1$ if $y \succ_i x$) and $d_i$ is the number of alternatives ranked strictly between $x$ and $y$ by voter $i$.
  2.  **Deletion Condition (DC):** For any agenda $A$, profile $P$, and alternative $z \in A$, if $z$ is not the unique social winner on $A$, removing $z$ from the agenda never changes the social comparison among the alternatives that remain. (Note: This holds unconditionally for such $z$, even if some voters rank $z$ strictly between the alternatives being compared).

  **The Colleague's Claim:** A colleague argues that Borda's rule refutes the pessimism of Arrow's theorem. They note that on any fixed agenda, Borda's rule is anonymous, neutral, Paretian, non-dictatorial, and yields a weak order. They claim it satisfies RII (since Borda scores sum rank positions) and thus escapes Arrow's impossibility by relaxing IIA to RII.

  **Tasks:**
  (a) Show that IIA implies RII, but RII does not imply IIA. Derive the identity linking Borda score differences to signed rank distances, and exhibit an explicit profile with $|A|=3, n=2$ where Borda satisfies RII but violates IIA. (7 marks)
  (b) Prove that the Deletion Condition forces the social comparison of any pair $x, y$ on any agenda $A$ to depend *only* on the individual rankings of $x$ against $y$ (i.e., DC implies IIA on fixed agendas). (6 marks)
  (c) Prove that any SWF satisfying Weak Pareto and the Deletion Condition is dictatorial. You must show that the dictator is the *same* voter for every agenda, explaining where the availability of all agendas (including two-element ones) is used. (8 marks)
  (d) Write a short referee-style paragraph evaluating the colleague's claim. Address whether cross-agenda coherence is a legitimate requirement and whether Borda's agenda-sensitivity is a defect or a necessity. (4 marks)

  ***

  **2. Model Answer**

  **(a) IIA, RII, and Borda**
  IIA requires the social relation on $\{x, y\}$ to depend solely on the set $\{i : x \succ_i y\}$. This set is fully determined by the sign $\delta_i$ of the rank distance. Thus, any rule satisfying IIA depends only on information contained in the rank-intensity vector (specifically, it ignores the magnitude $d_i$). Hence IIA $\implies$ RII.

  For Borda's rule, let $s(x, P, A)$ be the Borda score of $x$. The score is the number of alternatives ranked below $x$. The difference is:
  $$s(x) - s(y) = \sum_{i=1}^n \left( |\{z : x \succ_i z\}| - |\{z : y \succ_i z\}| \right)$$
  For each voter $i$, if $x \succ_i y$, the term equals $1 + d_i$ (where $d_i$ is the number of alternatives between $x$ and $y$). If $y \succ_i x$, it equals $-(1 + d_i)$. Thus:
  $$s(x) - s(y) = \sum_{i=1}^n \delta_i (1 + d_i)$$
  This depends only on $\{(\delta_i, d_i)\}$, so Borda satisfies RII. However, it depends on $d_i$, violating IIA.
  *Counter-example:* Let $A=\{x, y, z\}, N=\{1, 2\}$.
  Profile $P$: $1: x \succ z \succ y$, $2: y \succ x \succ z$.
  Here $x \succ_1 y$ ($d_1=1$), $y \succ_2 x$ ($d_2=0$). Score diff: $(1+1) - (1+0) = 1 \implies x \succ_S y$.
  Profile $P'$: $1: x \succ y \succ z$, $2: y \succ z \succ x$.
  Here $x \succ_1 y$ ($d_1=0$), $y \succ_2 x$ ($d_2=1$). Score diff: $(1+0) - (1+1) = -1 \implies y \succ_S x$.
  Individual rankings of $x$ vs $y$ are identical in $P$ and $P'$, but the social ordering flips. Borda violates IIA.

  **(b) DC Implies IIA**
  Fix an agenda $A$ and pair $x, y \in A$. Let $Z = A \setminus \{x, y\}$. Consider any profile $P$. We can construct a profile $P^*$ such that $P^*|_{\{x,y\}} = P|_{\{x,y\}}$ and for all $z \in Z$, $z$ is Pareto-dominated by $x$ (and thus not a unique social winner). By DC, we may remove all $z \in Z$ one by one without altering the social comparison of $x$ and $y$. The resulting social relation is that generated on the agenda $\{x, y\}$ by $P^*|_{\{x,y\}}$. Since the SWF is defined on all agendas, the relation on $\{x, y\}$ depends only on the profile restricted to $\{x, y\}$. Because the deletion steps preserved the relation, the original social comparison on $A$ must also depend only on the profile restricted to $\{x, y\}$. This is precisely IIA.

  **(c) Dictatorship and Agenda Consistency**
  Fix any agenda $A$ with $|A| \ge 3$. By (b), the SWF satisfies IIA on $A$. Given Weak Pareto and Collective Rationality, Arrow's Theorem implies there exists a dictator $d_A$ for agenda $A$.
  To show $d_A$ is independent of $A$, let $A$ and $B$ be any two agendas. Let $C = A \cup B$. If $|C| < 3$, embed $C$ in a larger agenda $C'$ with $|C'| \ge 3$ (possible since $|X| \ge 3$). Let $d_{C'}$ be the dictator on $C'$. By DC, the social relation on any sub-agenda $S \subseteq C'$ is the restriction of the relation on $C'$. Thus, whoever dictates on $C'$ must dictate on $S$. Therefore $d_A = d_{C'} = d_B$. The availability of two-element agendas ensures the dictator's power extends to minimal comparisons, while the ability to form unions ensures the dictator is unique across the universe.

  **(d) Referee Comment**
  The colleague correctly identifies that Borda escapes Arrow on a *fixed* agenda by satisfying RII rather than IIA. However, the claim fails to account for cross-agenda coherence. As shown in (c), demanding consistency across agendas (via DC) restores Arrow's impossibility. Borda's violation of DC is not an idiosyncrasy but a structural necessity: any Paretian, non-dictatorial rule yielding weak orders must be sensitive to the agenda composition. The "escape" is genuine only if one abandons the requirement that social choices remain coherent when the set of feasible alternatives changes.

  ***

