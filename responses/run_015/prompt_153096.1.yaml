  **Total: 25 Marks**

  **(a) III, RII, and Borda (7 Marks)**
  *   **3 Marks:** Correct argument that IIA $\implies$ RII (IIA depends on binary ranking, which is a function of rank intensity).
      *   *Deduct 3:* Claiming RII $\implies$ IIA or confusing the direction of implication.
  *   **2 Marks:** Correct derivation of Borda score difference formula involving $d_i$.
      *   *Deduct 2:* Formula incorrect or missing the $d_i$ term.
  *   **2 Marks:** Valid counter-example profile (3 alternatives, 2 voters) showing Borda violates IIA (social flip despite fixed pairwise rankings).
      *   *Deduct 2:* Profile does not flip social ranking or changes pairwise voter rankings.

  **(b) DC Implies IIA (6 Marks)**
  *   **4 Marks:** Argument that intermediates can be deleted (via DC) to reduce any agenda to $\{x, y\}$.
      *   *Deduct 4:* Failing to mention reduction to binary agenda or assuming DC allows deleting unique winners without justification.
  *   **2 Marks:** Explicit conclusion that dependence on restricted profile constitutes IIA.
      *   *Deduct 2:* Stating "DC is IIA" without the reduction argument.

  **(c) Dictatorship and Agenda Consistency (8 Marks)**
  *   **3 Marks:** Correct application of Arrow's Theorem on a fixed agenda $|A| \ge 3$ using result from (b).
      *   *Deduct 3:* Re-proving Arrow's theorem from scratch instead of citing it.
  *   **5 Marks:** Proof that the dictator is the *same* across agendas (using union/embedding argument).
      *   *Deduct 5:* Concluding only that "each agenda has a dictator" without identifying them as the same voter.
      *   *Deduct 2:* Failing to mention the role of variable agendas/unions in identifying the unique dictator.

  **(d) Referee Comment (4 Marks)**
  *   **2 Marks:** Clear verdict (Colleague is partially right on fixed agenda, wrong on variable agenda).
      *   *Deduct 2:* Ambiguous or non-committal conclusion.
  *   **2 Marks:** Insight that agenda sensitivity is necessary for non-dictatorial rules (trade-off).
      *   *Deduct 2:* Treating Borda's agenda sensitivity as a mere defect rather than a logical consequence of (c).

  **General Penalties:**
  *   **0 Marks:** For reproducing the standard proof of Arrow's theorem (decisiveness machinery) instead of using the theorem as a black box in part (c).
  *   **0 Marks:** For asserting DC "just is" IIA without the reduction proof in (b).
