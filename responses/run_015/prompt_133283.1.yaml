      *   *Disanalogy 2: Omnipotence.* Genie has magic. AI has capability limits.
          *   *Verdict:* Undermining (partially). If the AI isn't capable enough to find the "loophole," the catastrophe doesn't happen. But for advanced systems, this gap closes.
      *   *Disanalogy 3: One-shot vs. Iterative.* Wish is spoken once. Reward is optimized over steps.
