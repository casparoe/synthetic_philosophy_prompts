      *   **Task 1:** Create an explicit correspondence table mapping fairy-tale elements to modern optimization mechanisms (RLHF, recommendation systems, RL distributional shift).
      *   **Task 2:** Identify disanalogies (Agent vs. Process, One-shot vs. Iterative, Misunderstanding vs. Gradient Ascent).
