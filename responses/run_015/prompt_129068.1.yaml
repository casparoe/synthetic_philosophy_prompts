answer: |-
  Good morning. Welcome, everyone.

  Look around this room. We have a specific geography here. On one side, we have philosophers who are rightly worried about the moral hazards of generalization. On the other, social scientists who spend their lives measuring cross-cultural patterns that refuse to disappear just because we find them uncomfortable.

  I want to start with a confession. Last night, I got into a heated argument with a friend about this very workshop. His position was sharp and clear: talking about "national character" is never neutral. He argued that terms like "the French" or "Japanese people" are always, inevitably, harmful essentialism. They are stereotypes with academic makeup. He told me that by even convening this room, I was risking intellectual violence against the very idea of individual agency.

  He is not wrong to be worried. We know the history. We know that "character" has often been a code word for "blood," and that "cultural difference" has been used to justify everything from colonialism to exclusionary immigration policies. If we walk out of here thinking we've found a way to safely say that one nation is "more innovative" or "more hierarchical" than another without acknowledging that danger, we have failed.

  But.

  If we accept my friend's premise completely—if we decide that *any* claim about group-level dispositions is morally prohibited—we run into a different wall. We render ourselves unable to explain why institutions evolve differently in different places. We lose the vocabulary to describe why a policy that works in Stockholm fails in Santiago. If we cannot talk about the group, can we truly understand the context that shapes the individual?

  So, this is the spine of our time together: Is "national character" a concept that can be *true* without being *biological*?

  I want to propose a mechanism for us to test, not as an answer, but as a provocation. What if we strip the biology out entirely? What if we replace "blood" with "feedback loops"?

  There is a way to talk about dispositional clusters that relies on institutional path dependence. Think of it as gravity created by history. If a society builds a legal system that rewards litigation, over generations, you will see a population that is more litigious. If a culture builds educational structures that prioritize rote memorization, you will see adults who excel at pattern retention.

  This isn't in the DNA. It's in the architecture. It is a predictive cluster at the group level, created by the friction of institutions rubbing against human behavior over time.

  Now, I know what the philosophers in the room are thinking. You are thinking: *So what?* To the individual standing in front of a border agent or a hiring manager, the distinction between "biological essentialism" and "institutional path dependence" is irrelevant. The stereotype still lands. The reduction still hurts. If the prediction is probabilistic, it is still unjust when applied to the singular human being.

  And I know what the social scientists are thinking. You are thinking: *Finally.* We see these correlations. We have the data. We need a framework that allows us to discuss macro-patterns without being accused of racism or bad science. We need to know where the signal ends and the noise begins.

  Here is what I am asking of you for the next two days. I am asking you not to resolve this tension, but to inhabit it.

  I do not want us to leave here with a consensus definition of national character. I do not want us to sign a treaty declaring the concept dead, nor do I want us to declare it vindicated.

  Instead, I want us to press on the reference class problem. When does a cultural pattern become a useful explanatory tool, and when does it become a moral liability? Can we hold the idea of "institutional gravity" without letting it crush the individual? Is it possible to acknowledge a dispositional cluster without presuming it defines the person standing inside it?

  My friend from last night thinks the risk is too high. He thinks the concept is too contaminated to be salvaged. He might hate me for suggesting we try. But if we silence the question because it is dangerous, we surrender the field to those who will use these ideas without our caution.

  So, let the fight begin. But let it be a careful fight. Let's see if we can find a language that satisfies the demand for empirical honesty without violating the demand for moral respect.

  Thank you. Let's get to work.
