prompt: |-
  Write a joke that turns on Al-Ghazālī's occasionalist denial of necessary causal connections—specifically the claim that fire does not burn cotton by any intrinsic power of its own, but that God creates the blackening in the cotton coincident with the contact, with the fire serving only as the occasional cause. The joke should work for an audience that actually understands occasionalism: the punchline must depend on the metaphysical claim that no created thing possesses inherent causal efficacy and that every particular event is directly caused by God, rather than being a generic "God micromanages the universe" one-liner. Set the joke in a mundane modern situation—say, a kitchen mishap, a failed software build, or an office blame-shifting session—where one party invokes occasionalism to deflect responsibility or explain an unexpected outcome. The humor should come from the friction between this rigorous metaphysical denial of secondary causation and the practical, causal-language habits of ordinary life.

  After the joke, include a brief analytical note that flags exactly where the joke takes liberties with Al-Ghazālī's actual position—for instance, whether it ignores his allowance for stable divine custom or habitual patterns that make nature predictable despite lacking necessary causation, or whether it exaggerates occasionalism into a chaotic, frame-by-frame randomness. Then state precisely what kind of correction—such as a stricter Ash'arite insistence that natural regularities are merely consistent divine habits with no underlying physical necessity—would make the punchline fall flat or turn incoherent.
