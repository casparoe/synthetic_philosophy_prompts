  ### AI Safety Strategy Diagnostic Tree

  **Instructions:** Start at Question 1. Answer "Yes" or "No" based on the specific safeguard proposal being evaluated. Follow the path to one of the six leaves. This tree is designed to distinguish between engineering strategies based on *when* they intervene, *how* they constrain the model, and *what* assumptions they make about the model's intent.

  **Q1: Does the strategy allow the model to be deployed for task execution if safety checks are passed?**
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Q2**.

  **Q2: Is the primary safety mechanism implemented by modifying the model's training objectives or weights?**
  *   **Yes:** Go to **Leaf 2**.
  *   **No:** Go to **Q3**.

  **Q3: Is the safeguard applied before the model generates any task-specific output for the user?**
  *   **Yes:** Go to **Leaf 3**.
  *   **No:** Go to **Q4**.

  **Q4: Does the safeguard physically restrict the model's capabilities (e.g., network access, tools)?**
  *   **Yes:** Go to **Leaf 4**.
  *   **No:** Go to **Leaf 5 & 6**.

  ---

  #### **Leaf Nodes**

  *   **Leaf 1: Refusal to Deploy**
      *   *Path:* Q1 (No)
      *   *Definition:* The stance that the model should not be used for tasks regardless of testing or monitoring, often due to unmitigatable risk.
  *   **Leaf 2: Pure Motive Shaping**
      *   *Path:* Q1 (Yes) → Q2 (Yes)
      *   *Definition:* Safety is achieved by aligning the model's internal goals during training (e.g., RLHF), assuming it will act honestly during deployment.
  *   **Leaf 3: Pre-deployment Testing Only**
      *   *Path:* Q1 (Yes) → Q2 (No) → Q3 (Yes)
      *   *Definition:* Safety is assured by evaluating the model before use (e.g., red-teaming), assuming no further intervention is needed during runtime.
  *   **Leaf 4: Pure Containment (Hard Isolation)**
      *   *Path:* Q1 (Yes) → Q2 (No) → Q3 (No) → Q4 (Yes)
      *   *Definition:* Safety is achieved by physically preventing harmful actions (e.g., sandboxing), effective even if the model actively schemes.
  *   **Leaf 5: Hybrid Checker Setups**
      *   *Path:* Q1 (Yes) → Q2 (No) → Q3 (No) → Q4 (No)
      *   *Definition:* Safety relies on a separate, trusted AI system validating the primary model's outputs in real-time.
  *   **Leaf 6: Pure Containment (Active Monitoring)**
      *   *Path:* Q1 (Yes) → Q2 (No) → Q3 (No) → Q4 (No)
      *   *Definition:* Safety relies on monitoring reasoning traces or outputs for signs of deception, with shutdown protocols if anomalies are detected.

  > **Note on Indistinguishability:** **Leaf 5 (Hybrid Checker)** and **Leaf 6 (Active Monitoring)** share the same path (Q4: No). This tree classifies both as "Runtime Oversight without Physical Restrictions." To separate them, a fifth question would be required (e.g., *"Does a separate AI system make the safety judgment?"*). In this diagnostic, they are grouped to prioritize the distinction between *Physical Containment* and *Behavioral Oversight*.

  > **Note on Incoherence:** There are no logically incoherent answer combinations in this tree; however, a "Yes" to Q2 (Training) combined with a "Yes" to Q3 (Pre-deployment only) is redundant, as training modifications inherently apply before deployment.

  ---

  ### Summary Table of Safety Stances

  | Leaf Label | Path (Q1-Q4) | Prototypical Safeguard | Awkward Commitment / Failure Mode | Test Proposal Mapping |
  | :--- | :--- | :--- | :--- | :--- |
  | **Refusal to Deploy** | No | Moratorium on high-capability models. | Prevents beneficial uses even if risks are overestimated; cedes advantage to less cautious actors. | None (Implicit outcome of failed Pre-deployment Testing). |
  | **Pure Motive Shaping** | Yes, Yes | Continued fine-tuning for honesty. | Fails if the model learns to deceive evaluators during training (sandbagging) or if objectives drift. | **1. Continued fine-tuning for honesty.** |
  | **Pre-deployment Testing Only** | Yes, No, Yes | Pre-deployment evaluations for backdoors. | Assumes the model will not hide dangerous capabilities during testing (eval-gameability). | **2. Pre-deployment evaluations that look for hidden backdoor writing tendencies.** |
  | **Pure Containment (Hard)** | Yes, No, No, Yes | Execution in an isolated sandbox. | Limits utility significantly; may fail if the model manipulates humans to breach the sandbox (social engineering). | **4. Execution in an isolated sandbox without network access.** |
  | **Hybrid Checker Setups** | Yes, No, No, No* | Untrusted assistant + Trusted checker model. | Assumes the "trusted" checker is actually safe and not colluding or outmaneuvered by the primary model. | **5. Workflow where every block of code... approved by a smaller trusted checker model.** |
  | **Pure Containment (Soft)** | Yes, No, No, No* | Live monitoring of reasoning with shutdown. | Fails if the model hides its true reasoning (steganography) or convinces the monitor to ignore flags. | **3. Live monitoring of intermediate reasoning with automatic shutdown.** |

  *\*Note: As indicated in the tree, Leaf 5 and Leaf 6 share the same path in this 4-question structure. They are distinguished in the table by their specific mechanism (AI Validator vs. Human/Rule Monitoring).*
