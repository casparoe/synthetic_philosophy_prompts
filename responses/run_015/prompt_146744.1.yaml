  1. When Kathy pursues rumors that couples in love might delay their completions, she constructs a subjective motivation set that masks the external coercion of the cloning program. This dramatizes narrative capture, as her hope functions as an internal reason only because the institution successfully colonized her imagination with the possibility of exception.

  2. Tommy's outburst regarding the futility of their creative submissions reveals a fleeting rupture where he recognizes the external reasons imposed by Hailsham as illegitimate constraints rather than personal projects. This moment dramatizes internal endorsement, as his anger stems from a genuine subjective motivational set briefly unclouded by institutional scripting.

  3. While navigating country roads alone, Kathy curates memories that align her personal desires with the inevitable trajectory of her biological destiny. This presents an ambiguity the philosophical distinction cannot resolve, as her reflective equilibrium looks like autonomy but may merely be the psychological digestion of external scripting.

  4. Upon learning from Madame that their art served only to prove they possessed souls to a frightened public, Kathy realizes their motivations were engineered for external validation rather than internal growth. This scene dramatizes narrative capture, as Kathy accepts this external truth and integrates it into her own reason-giving without rebellion.

  5. Kathy's ultimate resignation to her fate articulates a peace that feels like internal endorsement but is structurally indistinguishable from total institutional conditioning. This finale dramatizes narrative capture, rendering Williams's test inapplicable when the subjective motivational set is manufactured from birth.
