  A research institute ordered a generic horse for a control group using an automated procurement system. The vendor delivered a white horse. Upon scanning the delivery, the system froze the asset tag and issued a rejection notice.

  "Discrepancy Detected," the system read. "Requisition: Horse. Delivery: White Horse. Per Ontological Protocol 7, adding a color determination changes the conditions of kind membership. The compound concept 'White Horse' excludes yellow and black horses, while the universal 'Horse' includes them. Since the exclusion criteria differ, the entities are not identical. You ordered a horse; you received a white horse. Match failed."

  The lab manager tried to override the error, arguing that the white horse was still a subset of the horse category and physically present.

  The system responded: "Subset logic is deprecated in this jurisdiction. To approve this invoice, please log into the registry and delete the color property. Once the white horse is stripped of its whiteness in the database, it will ontologically revert to a horse, and the payment will process."
