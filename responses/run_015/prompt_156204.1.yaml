answer: |-
  Here is the research agenda for the Humean Political Economy Revival Fund.

  ### Prioritization Criteria

  To rank these lines of inquiry, I am weighting **Upstreamness** highest. If the core Humean mechanism (automatic adjustment of imbalances) is broken in a fiat system, the rest of the framework collapses. **Importance** (policy impact) is second; **Tractability** (feasibility for a generalist in 2 years) is a hard constraint; **Neglectedness** is tertiary, provided we aren't duplicating mainstream econometric work. I am explicitly looking for conceptual clarity and mechanism identification, not new data generation.

  ### Explicit Deprioritizations

  I would deliberately reject proposals in the following categories:
  1.  **Pure Exegesis:** Work that focuses on what Hume *actually wrote* rather than what a Humean framework *should say* today. History of thought is only valuable here as a tool for current theory.
  2.  **Standard Trade Econometrics:** Estimating trade elasticities or GDP impacts of tariffs. This is well-trodden by mainstream economics and requires heavy modeling skills outside our tractability constraint.
  3.  **Normative Distributionalism:** Arguments about whether trade hurts specific domestic income groups. While important, this is downstream of whether trade creates aggregate wealth and security; it often devolves into ideological stalemates unlikely to be resolved by a junior fellow.
  4.  **Crypto Speculation:** Analysis of Bitcoin as an asset class. We care about money as a political institution, not investment vehicles.

  ---

  ### 1. Fiat Adjustment Mechanisms in Reserve Currency Regimes
  **(Steelman:** Hume's price-specie-flow mechanism relied on a commodity money constraint. Critics argue fiat money and floating exchange rates solve this automatically. The strongest counter-argument is that reserve currency status (exorbitant privilege) allows the issuer to run permanent deficits without the painful adjustment Hume predicted, potentially storing up systemic instability rather than smoothing it.)

  *   **(1) Open Question:** In a fiat system where the key currency is also the global reserve asset, what replaces the price-specie-flow mechanism? Is the adjustment delayed until a crisis (currency collapse, inflation spike) rather than being continuous and smooth?
  *   **(2) Upstreamness:** Critical. If imbalances no longer self-correct via price levels but instead accumulate until a discrete break, the Humean argument against worrying about deficits loses its predictive power. This determines whether we treat deficits as benign flow variables or dangerous stock accumulations.
  *   **(3) Tractability:** High. This requires institutional history and comparative case studies (e.g., US-Japan 1980s, US-China 2000s) rather than complex DSGE modeling. A scholar can trace the transmission channels (exchange rates vs. asset prices vs. inflation) qualitatively.
  *   **(4) Neglectedness:** Medium. Macro-economists study imbalances, but rarely through the specific lens of "where is the Humean brake?" Most assume floating rates handle it; few investigate the political friction that prevents adjustment.
  *   **(5) Update Condition:** **Up:** If the scholar identifies a specific political threshold (e.g., debt-to-GDP level) where adjustment becomes forced rather than automatic. **Down:** If evidence shows exchange rate volatility fully absorbs imbalances without real economy disruption in most cases.

  ### 2. Criteria for Security-Externalities in Trade
  **(Steelman:** Hume argued commerce binds nations and reduces conflict. The strongest counter is that efficiency creates single points of failure (e.g., semiconductors). A sophisticated neo-mercantilist argues that some goods are "positional" or "strategic," where dependency outweighs comparative advantage gains.)

  *   **(1) Open Question:** Can we derive a principled, non-protectionist heuristic for distinguishing "healthy interdependence" from "vulnerable dependency"? Where is the line between legitimate security policy and disguised rent-seeking?
  *   **(2) Upstreamness:** High. This is the main normative crux for modern trade policy. Without a clear criterion, "national security" becomes a magic word that justifies any tariff, rendering Humean optimism obsolete.
  *   **(3) Tractability:** High. This is conceptual political economy. It involves taxonomy and framework building (e.g., defining substitutability, time-to-rebuild, and dual-use potential) rather than data crunching.
  *   **(4) Neglectedness:** High. Geopolitics scholars assume risk; economists assume gains. Few are working on the *interface* framework that tells a policymaker when to switch from one mindset to the other.
  *   **(5) Update Condition:** **Up:** If the scholar produces a decision-tree or scoring framework adopted by a policy shop to evaluate subsidy requests. **Down:** If the analysis concludes that security externalities are ubiquitous, implying autarky is the only consistent Humean-safe position (which would be a falsification of the agenda).

  ### 3. Weaponized Finance and Systemic Trust
  **(Steelman:** Hume assumed money is a neutral veil facilitating exchange. The modern reality is that access to the clearing system (SWIFT, CHIPS) is a weapon. The strongest argument here is that weaponization destroys the trust required for the Humean system to function, forcing fragmentation.)

  *   **(1) Open Question:** Does the routine use of financial sanctions degrade the network effects of the reserve currency enough to accelerate fragmentation? At what point does the political utility of sanctions outweigh the economic cost of a bifurcated trading system?
  *   **(2) Upstreamness:** Medium-High. If the global commercial sphere splits into blocs, Humean positive-sum gains are restricted to within-bloc trade. This defines the boundary conditions of the theory.
  *   **(3) Tractability:** Medium. Requires tracking sanction regimes and capital flow data (publicly available) and interviewing legal/compliance experts. Less theoretical than #1 or #2, more empirical/descriptive.
  *   **(4) Neglectedness:** Medium. Sanctions are heavily studied, but rarely through the lens of "long-term degradation of commercial trust" as a political economy variable.
  *   **(5) Update Condition:** **Up:** If evidence shows significant migration of trade invoicing away from the dollar correlating directly with sanction events. **Down:** If data shows sanction targets reintegrate quickly without systemic damage to the currency network.

  ### 4. CBDCs and the Return of Capital Controls
  **(Steelman:** Hume assumed specie could move, but friction existed. CBDCs and digital identity could make capital controls perfect and costless. The strongest argument is that this technology allows states to permanently prevent the Humean adjustment mechanism, enabling persistent mercantilism without inflation.)

  *   **(1) Open Question:** Does programmable money enable states to bypass the automatic adjustment mechanisms of the balance of payments indefinitely? Does this technology make mercantilism technically feasible in a way it wasn't in the 18th century?
  *   **(2) Upstreamness:** Medium. This is a future-proofing question. If true, it suggests the Humean era was a historical anomaly caused by technological friction, not a permanent truth.
  *   **(3) Tractability:** Medium. Requires understanding technical specs of CBDC pilots and capital account regulations. Conceptual heavy, data light.
  *   **(4) Neglectedness:** High. Most CBDC research is technical or privacy-focused. Few are asking about the macro-political economy implications for balance of payments.
  *   **(5) Update Condition:** **Up:** If a major economy successfully uses CBDC tools to sterilize capital flows during a crisis without market backlash. **Down:** If CBDC rollouts stall or fail to integrate with cross-border clearing.

  ### 5. The Political Psychology of the Trade Scoreboard
  **(Steelman:** Hume attributed protectionism to passion (envy, zero-sum bias). Modern behavioral econ confirms these biases. The strongest argument is that technical corrections fail because the public views the trade deficit as a scorecard of national virtue, not an accounting identity.)

  *   **(1) Open Question:** Is the persistence of mercantilist policy driven by rational constituent interests or by cognitive frames (the "scoreboard" heuristic)? Can narrative intervention shift this more effectively than economic education?
  *   **(2) Upstreamness:** Low-Medium. This addresses implementation, not theory. Even if the theory is perfect, policy won't change if the voters don't buy it.
  *   **(3) Tractability:** High. Survey experiments, discourse analysis of media/politicians, and reviewing past communication campaigns. Well within a junior scholar's reach.
  *   **(4) Neglectedness:** Low. Political scientists and communicators work on this constantly. However, a specifically *Humean* framing (passions vs. reason) might be novel.
  *   **(5) Update Condition:** **Up:** If a specific narrative frame tests significantly better at reducing zero-sum intuition in pilot studies. **Down:** If attitudes are shown to be rigidly tied to material local shocks rather than narrative frames.

  ---

  ### Ranking Reasoning

  1.  **Fiat Adjustment Mechanisms:** This is the engine room. If the engine doesn't work in the new environment, the car doesn't move. It is the most upstream theoretical constraint.
  2.  **Security-Externalities:** This is the biggest normative challenge. If security trumps wealth, the Humean priority order flips. We need a map for this terrain.
  3.  **Weaponized Finance:** This defines the boundary of the system. If the system fragments, the scope of the theory shrinks.
  4.  **CBDCs/Controls:** Important, but more speculative. It's a potential future blocker rather than a current one.
  5.  **Political Psychology:** Important for impact, but downstream. Knowing *why* people are wrong doesn't tell us *if* the mechanics of trade have changed.

  \answer{fiat-adjustment-mechanisms}
