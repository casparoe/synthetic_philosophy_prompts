      *   **Real-World Constraints (The "Principled Way"):**
          1.  **Utility Theory (Bernoulli):** Money has diminishing marginal utility. Log utility is standard.
          2.  **Bankroll/Risk of Ruin:** Can the user actually pay if $k=30$? ($2^{29} \approx \$500$ million). If $k=60$, it's more than global GDP. If the user can't pay, the bet is void or they go bankrupt.
          3.  **Time/Physical limits:** You can't flip a coin forever.
      *   **Conclusion:** Don't take the bet (or at least, be very careful). It introduces massive variance for zero expected *utility* gain.

