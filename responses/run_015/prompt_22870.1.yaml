answer: |-
  This is a classic problem in probability theory known as the **St. Petersburg Paradox**. Your intuition that the bet is "fair" and your calculation that the expected value is "infinite" are both mathematically correct, yet they lead to a practical contradiction.

  Here is the principled breakdown of why you should **not** take this bet.

  ### 1. The Math: Why the Expectation is Infinite
  You correctly identified that the expected value is infinite. Here is the calculation:
  The probability that the second coin takes exactly $k$ flips to land heads is $(1/2)^k$. The payout is $2^{k-1}$.
  $$ E[\text{Payout}] = \sum_{k=1}^{\infty} \left( \frac{1}{2} \right)^k \cdot 2^{k-1} = \sum_{k=1}^{\infty} \frac{1}{2} = \infty $$

  Since the bet is symmetric (you pay this amount on Heads, receive it on Tails), your expected **net** gain is theoretically $\infty - \infty$, which is undefined. Your friend is technically right that the bet is "fair" in terms of symmetry, but this mathematical fairness is useless in the real world.

  ### 2. The Practical Solution: Finite Bankrolls
  The paradox relies on the assumption that you and your friend have infinite money. In reality, you do not.
  *   **The Risk of Ruin:** If the coin lands Tails 30 times in a row (a probability of 1 in a billion), the payout is $2^{29} \approx \$536 \text{ million}$. If you cannot pay this, the bet is void or you go bankrupt.
  *   **The Cap on Gains:** Conversely, if your friend cannot pay you, your potential winnings are capped.
  *   **The Verdict:** Since you cannot cover the infinite losses, but your winnings are capped by your friend's finite wealth, the bet effectively becomes **unfairly biased against you**.

  ### 3. The Economic Solution: Diminishing Utility
  The mathematician Daniel Bernoulli solved this paradox in 1738 by arguing that the **utility** of money is not linear.
  *   Winning \$1 billion is not one billion times better than winning \$1.
  *   Losing a significant amount of money causes more pain than the joy of winning the same amount (loss aversion).
  *   When you calculate the expected **utility** rather than expected **dollars**, the value of the bet becomes finite and, for a rational person, usually negative.

  ### Summary
  You should decline the bet. You are accepting a wager with **infinite variance** for a theoretical gain you cannot spend, while exposing yourself to a loss that could bankrupt you. Your friend is thinking like a computer; you need to think like a human.
