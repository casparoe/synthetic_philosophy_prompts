      *   *Panpsychism:* Metaphysical claim. Fundamental entities have *experience* (proto-consciousness). The problem is how these experiences *sum* or *combine* into a unified subject (me).
      *   *The Core Tension:* Quorum sensing explains coordinated *action* without a central controller. The Combination Problem is about unified *subjectivity* (the "what it is like" to be the colony).

  3.  **Drafting the Correspondence Table:**
