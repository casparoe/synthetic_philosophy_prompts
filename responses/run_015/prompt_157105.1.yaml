          *   Use pronouns ("I" vs. "We" vs. "They").
          *   The "Translation Failure": Have them repeat each other's arguments and fail.
          *   The specific case (Child vs. Damp): Ensure the stakes feel real.
          *   *Key moment:* The Chair (Door-to-Door) asks, "What do I say to Mrs. Gable?" The Rival (Town-Hall) says, "You tell her she's part of the town."

  7.  **Refining the Philosophical Nuance:**
      *   Scanlon isn't *against* numbers entirely (he allows them in risk cases), but he resists *aggregation* of benefits.
      *   The "Town-Hall" shouldn't just be "greatest good." It should be "The Town as a Single Entity." This makes it more political and dramatic.
      *   The "Door-to-Door" is about *accountability*.
      *   Reference: Stephen Darwall's *The Second-Person Standpoint* is crucial here. It validates the user's "address" intuition.
