      *   *Check:* Is the "Town-Hall" strictly consequentialist? The user says "cumulative complaint." That sounds like a hybrid. I should acknowledge that. It's about the *voice* of the many.
      *   *Emphasis:* Make sure to highlight that the "Door-to-Door" view makes the committee members *representatives* of the losers, whereas "Town-Hall" makes them *trustees* of the whole.

  10. **Final Polish:** Ensure the distinction between "verbal," "bedrock," and "functional" is clear. (Decided it's primarily functional/teleological).

  *(Self-Correction Note)*: Wait, I need to be careful not to simply agree with the user. They asked for the hypothesis to be *tested*. I need to point out where the "Address" metaphor might leak.
