      *   **Task:** Draft a memo framing the vote for next week.
      *   **Context:**
          *   City adopted "middle housing by right" 6 months ago (3-4 units on any residential lot, no discretion/design review).
          *   2/3 of applications are in the East Ward (lowest rent, historically disinvested, 40% of city's unsubsidized low-rent stock in small/old buildings).
          *   Most East Ward apps are demolish-and-rebuild.
          *   Petition: East Ward Tenant Assembly (low-income renters) wants a 24-month anti-displacement overlay.
          *   Overlay requirements: Net-additive only (no demolition of occupied units unless 1-for-1 replacement at affordable rents + relocation assistance).
          *   Staff Estimate: Overlay cuts new units in East Ward by ~1/3 over 2 years; most deferred/foregone (not built elsewhere); reform is moderating rent growth city-scale.
      *   **Complications:**
          *   Enabling ordinance requires weighing needs of *present* residents vs. *future* residents (who aren't in the room).
          *   Equity issue: East Ward is the only organized ward; two high-cost wards exempted themselves. Costs concentrate in the least capable ward; benefits concentrate in exempt wards.
      *   **Requirements:**
          *   Length: About two pages.
          *   Recommendation: Approve, Deny, or Approve with Conditions (specific time frame/conditions).
          *   Content: Plainly state the conflicting claims (remain vs. admit), explain weighting without slogans ("right to the city"), acknowledge the housing supply argument but focus on the distribution of costs.
          *   Ending: Strongest version of the argument *against* the recommendation.

  2.  **Determine the Recommendation:**
      *   *Option A: Deny.* Upholds the by-right ordinance strictly. Maximizes short-term supply. Ignores the disproportionate impact on the East Ward and the equity issue of other wards exempting themselves. Risks significant displacement of vulnerable tenants.
      *   *Option B: Approve (24-month overlay).* Protects current tenants. Reduces supply in the East Ward (per staff). Acknowledges the equity imbalance.
      *   *Option C: Approve with Conditions.* Maybe a shorter timeframe? Or specific conditions on the "net-additive" rule?
      *   *Decision:* The prompt highlights the inequity (high-cost wards opted out, costs concentrating in East Ward) and the specific vulnerability of the tenants (40% of unsubsidized low-rent stock). A flat denial ignores the board's mandate to weigh needs of *present* residents. A permanent ban violates the spirit of the middle housing law. A temporary pause (overlay) allows for data collection and policy correction without permanently halting supply.
      *   *Refinement:* The Tenant Assembly asks for 24 months. Staff says supply drops 1/3. The equity argument is strong. I will recommend **Approving the Overlay with a 24-month timeframe**, but I need to ensure the conditions are administrable. The prompt asks for "tight enough that staff could administer them."
      *   *Key Condition:* "Net-additive" needs definition. No demolition of *occupied* units unless replaced 1-for-1 at *current* rent (not just affordable generally) + relocation assistance.
      *   *Rationale:* This balances the statutory mandate. It acknowledges that while future residents need homes, present residents cannot be sacrificed disproportionately, especially when other wards shielded themselves.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on the East Ward Anti-Displacement Overlay). State the recommendation clearly (Approve for 24 months).
      *   **Context & Conflicting Claims:**
          *   Claim 1 (Future Residents/Supply): The city needs housing. Middle housing by right is working to moderate rents. Denying projects hurts city-wide affordability.
          *   Claim 2 (Present Residents/Stability): East Ward tenants face displacement. The market is targeting their specific housing stock (small, old, cheap). They have no political shield compared to the high-cost wards.
      *   **Weighing the Claims:**
          *   Avoid "Right to the City" slogans.
          *   Focus on the Board's enabling ordinance: weigh needs of present vs. future.
          *   Argument: The current implementation creates an inequitable distribution of burden. High-opportunity wards opted out. East Ward bears the cost of demolition. Future housing needs cannot be met by cannibalizing the existing affordable stock in the one neighborhood that didn't exempt itself.
          *   The 1/3 reduction is significant but acceptable as a temporary correction to prevent irreversible loss of affordable units.
      *   **Specific Conditions:**
          *   Timeframe: 24 months from adoption.
          *   Trigger: Demolition of any structure with an occupied dwelling unit in the East Ward.
          *   Requirement: Replacement units must be offered to existing tenants at their current rent (adjusted for CPI only) for a minimum of 5 years.
          *   Relocation: Standard city relocation assistance plus temporary storage/moving costs.
          *   Administration: Planning Director certifies occupancy status at time of application.
      *   **The Counter-Argument (Steel-manning):**
          *   This sets a precedent that property rights are secondary to tenant status.
          *   It slows down the supply response needed to lower rents long-term.
          *   It punishes East Ward landlords (some small) while large developers wait it out.
          *   Future residents (invisible) lose out on homes to protect current residents (visible).

  4.  **Review and Refine:**
      *   *Tone:* Professional, deliberative, empathetic but administrative.
      *   *Length:* Check against "about two pages." (Single spaced, standard font usually equals ~500-600 words per page. I need roughly 1000-1200 words).
      *   *Constraint Check:* Did I avoid "Right to the City" slogans? Yes. Did I address the "present vs. future" claim? Yes. Did I include the strongest counter-argument? Yes. Are conditions tight? Yes.
      *   *Self-Correction on Conditions:* Make sure "net-additive" is clear. If I tear down a duplex (2 units) and build a fourplex (4 units), that's net additive. But if the duplex was occupied, I need to house those 2 tenants in the new 4 units at their old rent. The prompt says "no demolition of occupied units unless they are replaced one-for-one." I should stick to that language for clarity.

  5.  **Final Polish:** Check the flow. Ensure the distinction between the high-cost wards exempting themselves and the East Ward's vulnerability is central to the reasoning. This is the crux of the equity argument.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm ignoring the supply crisis. The prompt says "Do not simply rehearse the case for building more housing." I need to acknowledge it but pivot to the *distribution* of the cost.

      *(Refining the Counter-Argument)*: Make sure it's compelling. It shouldn't be a strawman. It should be the genuine dilemma of housing policy: speed vs. protection.

  6.  **Final Word Count Check:** Aiming for ~1,100 words to fit the "two pages" visual expectation in a standard memo format.

      *(Drafting thought)*: Start with the recommendation immediately. Then the analysis. Then the conditions. Then the counter-argument.

      *(Wait, one detail)*: "Two high-cost, high-opportunity wards successfully exempted themselves." This is crucial. It means the "city-wide" benefit is actually being subsidized by the East Ward specifically. I must highlight this.

      *(Final check on conditions)*: "Tight enough that staff could administer."
      *   Define "Occupied": Lease + utility bill within 60 days.
      *   Define "Replacement": Offer of lease prior to demolition permit issuance.
      *   Define "Rent": Current contract rent, not market rate.

