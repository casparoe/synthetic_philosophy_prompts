answer: |-
  **MEMORANDUM**

  **TO:** Eastvale Housing Review Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on East Ward Anti-Displacement Overlay Petition

  **Recommendation**
  I recommend that the Board **APPROVE** the East Ward Tenant Assembly petition for a twenty-four-month anti-displacement overlay, subject to the administrative conditions detailed below. This overlay would apply exclusively to the East Ward zoning district. It would permit by-right middle housing projects only if they are net-additive to the existing stock of occupied units, or if existing occupied units are replaced one-for-one at rents affordable to sitting tenants.

  **Context and Conflicting Claims**
  Six months ago, this city enacted middle housing by right to address regional scarcity. The policy is working to moderate rent growth city-wide. However, the implementation has revealed a stark geographic imbalance. Two-thirds of applications are concentrated in the East Ward, driven by lower land costs. Crucially, two high-cost, high-opportunity wards exempted themselves from this reform during the enabling phase. Consequently, the costs of the city's housing strategy—specifically the demolition of existing affordable stock—are concentrating in the ward with the least political capital, while the benefits of exemption are enjoyed by wealthier neighborhoods.

  We are asked to weigh two distinct moral claims.

  The first claim is held by **future residents**. This is a claim to admission. It argues that households currently excluded from Eastvale due to cost or scarcity have a right to compete for space here. Delaying or blocking projects, even temporarily, denies these invisible applicants the opportunity to access the city's opportunity structures. Staff estimates indicate this overlay could reduce new unit production in the East Ward by one-third over two years. In a housing crisis, slowing supply is a tangible harm to those waiting to enter the market.

  The second claim is held by **present residents**. This is a claim to remain. It argues that low-income tenants, who hold legal leases but lack equity, should not be involuntarily displaced to subsidize city-wide supply goals. The East Ward contains 40 percent of the city's unsubsidized low-rent apartments. Most applications here are demolish-and-rebuild. Without protection, the city's affordable stock will be permanently erased to build units at higher price points, regardless of the "middle housing" designation. Unlike residents in the exempted high-cost wards, East Ward tenants had no legislative shield against this disruption.

  **Weighing the Claims**
  Our enabling ordinance requires us to weigh the needs of present residents against those of future households. While the need for new housing is urgent, the Board cannot treat these claims as equal when the burdens are distributed inequitably.

  If we deny this overlay, we effectively rule that the housing needs of future residents always supersede the housing security of present residents, regardless of context. But the context here is specific: the East Ward is absorbing the demolition costs that other wards refused. To insist on "by-right" purity in the East Ward while allowing exemptions elsewhere is to treat the ward as a sacrifice zone.

  We must weight the claim to remain heavily in this instance because the loss is irreversible. A delayed fourplex can be built in 2026; a demolished low-rent duplex cannot be un-demolished. If we allow the existing affordable stock to be liquidated now, we undermine the long-term affordability the middle housing reform was meant to create. A twenty-four-month pause allows the City Council time to evaluate whether the city-wide reform requires adjustment to prevent segregation by income, without permanently halting production.

  **Administrative Conditions**
  To ensure staff can administer this overlay without discretionary ambiguity, the following conditions apply:

  1.  **Timeframe:** This overlay expires automatically twenty-four (24) months from the date of adoption.
  2.  **Occupancy Verification:** A unit is deemed "occupied" if a valid lease exists and utility usage is recorded at the address within sixty (60) days prior to the demolition permit application.
  3.  **Replacement Requirement:** Demolition of occupied units is permitted only if the proposed project contains at least an equal number of units as the demolished structure.
  4.  **Tenant Right of Return:** Existing tenants must be offered a lease in the new structure at their current contract rent (adjusted annually by CPI not to exceed 5%) for a minimum term of five years.
  5.  **Relocation Assistance:** Applicants must provide standard city relocation assistance plus temporary storage and moving costs prior to the issuance of the demolition permit.
  6.  **Administrative Review:** Compliance is determined solely by the Planning Director based on documentary evidence; no discretionary hearing is permitted.

  **The Strongest Argument Against This Recommendation**
  The strongest argument against approving this overlay is that it prioritizes the specific individuals currently in a unit over the general class of people who need homes, effectively granting a veto to current tenants over neighborhood evolution. By reducing supply in the area of highest development interest, we risk increasing competition for the remaining units, potentially driving up rents for those not protected by the overlay. Furthermore, this sets a precedent that property rights are contingent on tenant status, which may chill investment not just in the East Ward, but city-wide, as developers fear future retroactive restrictions. Finally, it punishes the East Ward for being affordable; by making development harder there, we may inadvertently push development pressure into other vulnerable, unorganized neighborhoods that did not secure exemptions, spreading the disruption rather than solving the inequity. Ultimately, the counter-argument posits that the only ethical way to help low-income households is to build enough housing to lower market rates for everyone, even if that requires short-term disruption that current residents must endure.

  **Conclusion**
  While the supply argument is robust, it relies on a distribution of costs that is currently unjust. We can support middle housing without supporting the liquidation of the city's only remaining low-rent stock. I urge the Board to approve the overlay.
