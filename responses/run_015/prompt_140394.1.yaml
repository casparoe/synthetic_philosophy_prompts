answer: |-
  I'll take the first horn: content boundaries can be vague during evolutionary transitions, and I don't think that collapses the theory. You're assuming the proper function is locked in at the moment of origin, but on my view, it's fixed by the history of selection that explains the trait's *current* presence. If the lineage survived those nine thousand generations specifically because the detector caught seeds, then by generation ten thousand, the proper function *is* catching seeds. The selection history isn't a fossil; it's the cumulative story of why the mechanism is still here. I'll assume for your case that there was a crossover point where seed-catching became the dominant factor keeping the gene in the pool. Before that point, the critters were misrepresenting seeds as flies; after that point, they were representing seeds correctly. The content shifts because the historical explanation for the trait's maintenance shifts.

  That said, I concede there's no magical instant where the content snaps from "fly" to "seed." Biological functions are often vague during transition periods, just like species boundaries are vague during speciation. Content is a naturalistic property grounded in biology, so it inherits that vagueness. During the middle generations, where flies and seeds both contributed roughly equally to survival, it's indeterminate whether the content is flies, seeds, or small-dark-moving-things-general. This doesn't make content a fake posit; it makes it real but fuzzy, like "heap" or "species." I'd rather admit that sometimes there's no definite fact about content during a transition than divorce content from history entirely. The cost is losing sharp boundaries, but the gain is keeping content anchored in the actual causal history of the organism.
