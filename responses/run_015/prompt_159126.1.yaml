answer: |-
  This is a fascinating collision of literary theory and patristic ethics. Your friend is applying a strict Augustinian framework, derived primarily from *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying). Augustine is the "hardliner" of Christian ethics on this topic; he argues that lying is intrinsically evil, regardless of consequences.

  To answer your question, we need to isolate the specific mechanism your friend is using to judge these cases. Then we can apply it to your book frame and your silence test.

  ### 1. The Rule She Is Running
  You identified two possible rules:
  1.  **Teleological:** Do not intend for somebody to end up holding a false belief.
  2.  **Ontological:** Do not make your words into an instrument of someone's error (violate the order of signs).

  Your friend is running **Rule 2 (The Ontological Rule)**, but with a specific caveat regarding the *will*.

  For Augustine, a lie is not defined by whether the listener *actually* believes the falsehood (you can lie to a skeptic), nor solely by whether the statement is factually false (you can tell the truth with intent to deceive, which he also condemns). A lie is defined as **speaking a falsehood with the will to deceive** (*enuntiatio cum voluntate fallendi*).

  However, the deeper "sin" is the severing of the link between **Sign** (the word) and **Thought** (the mind). God instituted language so that we might make known the thoughts of our hearts to one another. When you speak a word that does not match what is in your mind, you are corrupting the instrument of human society.

  **Where the two rules split:**
  They split on **Jokes** and **Figurative Language**.
  *   **Rule 1 (Belief)** would say a joke is fine because you don't want them to believe it.
  *   **Rule 2 (Sign)** would say a joke is problematic because the sign doesn't match the thought.
  *   **Augustine's Resolution:** He exempts jokes *if* the context makes it obvious that no one is meant to believe it. The "sign" is understood as a "sign of play," not a "sign of fact."

  ### 2. The Verdict on Your Book Frame
  Under your friend's scheme, the "Found Diary" frame is high-risk, and the "Tiny Print" disclaimer is the smoking gun.

  **Scenario A: You don't care what they believe.**
  *   **The Preface:** If your invented archivist says, "I found this jar," and you know you did not write that, you are issuing a false sign.
  *   **The Copyright Page:** Hiding the truth ("This is a novel") in tiny print while the preface asserts a falsehood is what later casuists called **broad mental reservation**. Augustine would likely reject this. You are providing the truth technically, but structuring the communication so the false sign is the dominant one.
  *   **The Verdict:** If the literary convention of the "pseudo-documentary novel" is understood by the community of readers (like *Dracula* or *Frankenstein*), Augustine might grant it the "Joke/Play" exemption. But if the design is meant to mimic reality so closely that the disclaimer is easily missed, you are violating the **Ontological Rule**. You are making your words an instrument of error, even if you are indifferent to the result. You have severed Sign from Thought.

  **Scenario B: You want them unsure.**
  *   **The Verdict:** This is strictly condemned. By actively cultivating ambiguity where you know there is falsehood, you are exercising the *voluntate fallendi* (will to deceive). You are not just allowing error; you are gardening it. Under Augustine's scheme, this is a lie.

  ### 3. The Silence Test
  This is where your test case illuminates the split between the two rules.

  **The Setup:** A reader emails: "Did Chapter 9 happen?" You say nothing.
  **The Precedent:** Your friend says refusing to answer a pursuer looking for a fugitive is fine.

  **The Analysis:**
  *   **Rule 1 (Belief):** If you stay silent, you are not actively creating a false belief. You are maintaining a state of uncertainty. If the reader *infers* "Yes" from your silence, that is their error, not your statement.
  *   **Rule 2 (Sign):** Silence is not a sign. Therefore, strictly speaking, **silence cannot be a lie** in Augustinian terms. A lie requires *enuntiatio* (speaking/utterance).

  **However, here is where the Fugitive Analogy breaks down:**
  Augustine permits silence with the fugitive because the pursuer is an **unjust aggressor**. They have no right to the truth. The silence is an act of protection, not deception.

  In the Author/Reader relationship:
  1.  **If the Book Lied:** If your preface claimed the diary was real (a falsehood), the sin of lying has *already been committed* in the text. Your silence on the email is now **complicity**. You are withholding the correction. Augustine distinguishes between the sin of Lying (commission) and the sin of Withholding Truth (omission). Silence isn't a lie, but if charity demands you correct an error you created, silence is a sin against charity.
  2.  **If the Book was Ambiguous:** If the text left it open, and you stay silent to keep it open:
      *   **Rule 1 says:** You are fine (no false belief intended).
      *   **Rule 2 says:** You are fine (no false sign given).
      *   **The Split:** The split appears if the reader's context makes silence *function* as a sign. In some social contracts, silence implies assent. If you know your silence will be taken as "Yes," and you want them to think "Yes," Augustine would argue you are now using your silence as a **sign**. You have turned your non-action into an instrument of error.

  ### 4. Summary of the Split
  You asked which rule the silence test separates. It separates **Intent** from **Signification**.

  *   **The "Belief" Rule** focuses on the **Reader's Mind**.
      *   *Silence Verdict:* Permissible. You didn't put a false idea in their head.
  *   **The "Sign" Rule** focuses on the **Author's Act**.
      *   *Silence Verdict:* Permissible *unless* the context turns silence into a signal.

  **What each one says about your Email Test:**
  *   **If you follow the Belief Rule:** You can stay silent. As long as you don't *want* them to believe the falsehood, you are clear. Ambiguity is safe.
  *   **If you follow the Sign Rule (Your Friend's Augustinian View):** You must look at the *contract*.
      *   If the book claimed to be real: You lied in print. Silence sustains the lie. You should correct it.
      *   If the book was ambiguous: Silence is fine, *provided* you aren't using the silence to signal confirmation.

  ### The Bottom Line for Your Plot
  Your friend's framework is not concerned with whether the reader gets hurt or fooled (consequences). It is concerned with whether **you have corrupted the relationship between your mind and your words.**

  *   **The Preface:** If it asserts factuality you know is false, it is a lie, regardless of the copyright page. The copyright page is a "technical truth" used to mask a "signification falsehood." Augustine hates that.
  *   **The Ambition:** Wanting readers to be "unsure" is wanting them to dwell in error. That is a sin against charity, even if it's not a strict lie.
  *   **The Silence:** Silence is not a lie, but it does not absolve a previous lie. If the book frame is the lie, the email silence is just refusing to repent.

  **Recommendation:** If you want to stay within your friend's ethical scheme, the Archivist's Preface must be read as **obvious play** (like a fairy tale "Once upon a time"), not as a claim of historical fact. If the "Archivist" is clearly a persona, the sign matches the thought (the thought being "I am telling a story in this voice"). If the "Archivist" is meant to pass as real, you are violating the Ontological Rule.

  The "tiny print" disclaimer is the weakest link. In Augustine's eyes, hiding the truth so the falsehood can shine is the very definition of the *will to deceive*.
