  For disagreement to dissolve facts, you need a premise about how moral knowledge works. Specifically: "If objective moral facts existed, they would causally produce convergent intuitions across diverse environments." This is a strong empirical claim about moral epistemology. You must argue that variables like market integration distort access to truth rather than shaping different but equally valid truths. Alternatively, you need a "best explanation" argument: that moral relativism explains the data better than moral realism plus error. Without this, the realist can simply say WEIRD people are right and everyone else is wrong (or vice versa). Your kicker assumes disagreement *constitutes* lack of truth, rather than merely complicating our *confidence* in truth. You need to bridge the gap between "we cannot agree" and "there is nothing to agree about." Otherwise, you are begging the question against the realist. You must explain why divergence is evidence of no fact, rather than evidence of human error. The missing link is a theory of moral perception that guarantees convergence.

  3. What the divergence score would actually measure
  The divergence score measures psychological heterogeneity, not ontological status. First, responses to vignettes are behavioral proxies, not truth-claims. Rejecting a trade in an ultimatum game isn't asserting a proposition is false; it's expressing a preference or norm. Second, using the WEIRD modal verdict as baseline contradicts your thesis. If WEIRD samples are outliers, centering them reinforces the bias you critique. Third, societies are not monoliths; internal variation often exceeds external variation. A score based on societal modals hides individual dissent. Finally, the 40% threshold is arbitrary. Why not 51%? The graphic implies a precise metric for objectivity where none exists. It measures "how much WEIRD people differ from others," which is interesting sociology, but it cannot measure "how much truth exists." It quantifies variation, not validity. The device promises metaphysical insight but delivers demographic data. It tells us where people differ, not why.

