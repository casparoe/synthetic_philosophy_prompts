  The WEIRD critique is primarily about descriptive psychology, not normative ethics. It shows that claims about "human nature" based on undergraduate samples are false. It does not show that the normative principles WEIRD people hold are false. A philosopher can admit their intuitions are culturally shaped while maintaining those intuitions track truth. The sampling complaint undermines the *evidence* (intuition), not the *claim* (objectivity). Editors should discount universal claims about human psychology derived from WEIRD samples. They should not necessarily discount moral claims themselves, unless those claims rely solely on unexamined intuition. The credibility of a moral argument rests on reasoning, not the demographic prevalence of its starting premises. The critique targets the universalization of local psychology, not the validity of local ethics. It warns against mistaking parochial instincts for universal laws. The error is in the generalization, not necessarily the valuation.

