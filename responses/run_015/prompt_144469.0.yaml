          *   *Prediction:* The pain is not genuinely bad *as an experience*. The agent's judgment is a cognitive error (confusing "sign of bad thing" with "bad thing itself") OR they are referring to the *risk* of future harm (instrumental badness). If they truly feel no unpleasantness, it's functionally identical to Asymbolia.
