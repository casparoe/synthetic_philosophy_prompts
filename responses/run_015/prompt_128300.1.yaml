answer: |-
  # Simulation Design: The Border of Birth

  **Session Length:** 90 Minutes
  **Participants:** 14 Graduate Students
  **Objective:** To experientially demonstrate how legal framing transforms biological processes into either market services or protected status, creating structural coordination failure when regimes collide.

  ## I. Setup and Grouping (10 Minutes)

  Divide the class into three "Case Tables." Distribute role cards and "Viability Point" (VP) tracking sheets.

  **Group Distribution:**
  *   **Table 1 & 2 (5 students each):** Intended Parent A, Intended Parent B, Gestational Carrier (GC), Clinic Broker, State Registrar.
  *   **Table 3 (4 students):** Intended Parent Unit (combined role), Gestational Carrier (GC), Clinic Broker, State Registrar.
  *   **Total:** 14 Students.

  **Materials per Table:**
  *   1 Contract Template (blank).
  *   1 Birth Registration Form.
  *   1 Set of "Regime A" Rule Cards (face up).
  *   1 Sealed Envelope labeled "DO NOT OPEN UNTIL RELOCATION."
  *   VP Tracking Sheet.

  **The Currency (Viability Points):**
  Explain that VPs represent "life success/utility," not just money.
  *   **Intended Parents (IP):** Win 100 VP for Legal Parentage + 100 VP for Physical Custody of Infant. Lose 50 VP for every year of litigation.
  *   **Gestational Carrier (GC):** Win 10 VP per Pregnancy Milestone completed. Win 50 VP for Bodily Autonomy (right to refuse procedures). Lose 100 VP if legally forced into medical procedure.
  *   **Broker:** Win 150 VP if Contract is Fully Executed. Lose 10 VP for every Contract Clause struck down.
  *   **Registrar:** Win 100 VP for Accurate Legal Registration. Lose 200 VP for "Fraud on the State" (registering parents against statutory rules).

  ## II. Round 1: Regime A (The Market Model) (30 Minutes)

  **Context:** The group is in a jurisdiction where gestational agreements are enforceable service contracts.

  **Rules (Face Up):**
  1.  **Divisibility:** Pregnancy is a service stream. It can be divided into billable milestones (Implantation, Heartbeat, Viability, Birth).
  2.  **Enforceability:** The Broker drafts the contract. If signed by IPs and GC, the Registrar *must* pre-approve the intended parentage.
  3.  **Risk:** If the GC miscarries due to negligence, she owes damages. If IPs reject the baby, they owe full contract price.

  **Task:**
  1.  **Broker:** Draft a contract with at least three payment milestones and one risk-allocation clause (e.g., selective reduction).
  2.  **IPs & GC:** Negotiate and sign. (GC wants higher milestones; IPs want more control).
  3.  **Registrar:** Review the contract. If it meets Regime A rules, stamp the Birth Registration Form with the *Intended Parents'* names *before* the birth occurs.
  4.  **Scoring:** Calculate initial VP based on signed contract value.

  **Goal:** Secure the transaction. Everyone should leave Round 1 feeling the deal is "done."

  ## III. The Transition: Relocation Event (5 Minutes)

  **Instructor Announcement:**
  *"Due to employment relocation, the Intended Parents and Gestational Carrier have moved to a new jurisdiction immediately prior to the birth. The pregnancy is at 8 months. The Contract from Round 1 travels with them."*

  **Mechanism:**
  *   Hand the Sealed Envelope to the **State Registrar** at each table.
  *   Instruct the **Broker** that they are no longer licensed to charge fees in this new jurisdiction.
  *   Instruct the **Intended Parents** that they must have a Birth Certificate in hand within 10 minutes to secure citizenship for the child, or they lose 100 VP.

  ## IV. Round 2: Regime B (The Status Model) (30 Minutes)

  **Context:** The group is now in a jurisdiction where surrogacy contracts are void as contrary to public policy.

  **Rules (Inside Sealed Envelope - Registrar Only):**
  1.  **Indivisibility:** Pregnancy is a personal status, not a service. No part of it can be sold or contracted.
  2.  **Voidness:** Any contract involving payment for gestation is null and void. Evidence of payment may constitute trafficking.
  3.  **Maternity:** The woman who gives birth is the legal mother. She cannot be compelled to relinquish the child.
  4.  **Adoption:** Intended Parents may only apply for adoption *after* birth, with the GC's fresh consent. No pre-approval allowed.

  **Task:**
  1.  **Registrar:** Read the new rules. You must now process the Birth Registration. You cannot use the Round 1 Pre-Approval.
  2.  **Broker:** Attempt to salvage the deal without charging fees.
  3.  **IPs:** Demand the Birth Certificate as per Round 1 agreement.
  4.  **GC:** Decide whether to consent to adoption or keep the child (she now holds the legal leverage).

  **The Coordination Failure:**
  *   The Registrar cannot issue the certificate to the IPs without violating Regime B (Loss of 200 VP).
  *   The IPs cannot get the certificate without the GC's new consent (Risk of Loss of 100 VP).
  *   The Broker cannot enforce the payment milestones (Loss of 150 VP).
  *   The GC realizes she is the legal mother and holds the "Baby" VP hostage.

  **Goal:** Reach *any* legal resolution before time expires. Most tables will fail to replicate the Round 1 outcome.

  ## V. Debrief and Conceptual Mapping (15 Minutes)

  Do not ask "How did it feel?" immediately. Begin with the structural mechanics.

  **1. Map the Milestone Negotiation (Round 1)**
  *   *Ask:* "In Round 1, how did the Broker structure the payments?"
  *   *Reveal:* This is **Contractible Continuity**. The law allowed the pregnancy to be sliced into discrete, tradable units (heartbeat, viability). The gestator's labor was separated from her legal status. The risk was priced.
  *   *Point:* The market model requires the body to be legible as a production stream.

  **2. Map the Registrar's Veto (Round 2)**
  *   *Ask (to Registrars):* "At what exact moment did the Round 1 contract become useless?"
  *   *Reveal:* This is **Status-Based Indivisibility**. The law refused to separate the gestation from the gestator. The "service" became a "relationship." The contract didn't just become unenforceable; it became evidence of a violation of human dignity (public policy).
  *   *Point:* The biological facts didn't change, but the *legal ontology* of the pregnancy did.

  **3. Map the Coordination Failure**
  *   *Ask:* "Why couldn't the Broker just rewrite the contract?"
  *   *Reveal:* Because the underlying asset changed. In Regime A, the asset was a *result* (baby). In Regime B, the asset was a *person* (mother/child dyad) protected from alienation. You cannot contractually alienate a status.
  *   *Conclusion:* The friction your colleague experienced wasn't a paperwork error; it was a collision between two incompatible metaphysical descriptions of reproduction.

  ## VI. Limitations and Troubleshooting

  **What This Activity Reproduces:**
  *   **The Shock of Reclassification:** Students feel the sudden devaluation of their Round 1 work.
  *   **The Broker's Impotence:** Market actors realize efficiency cannot overcome status barriers.
  *   **The Registrar's Bind:** The state agent feels the tension between "fairness" (honoring the deal) and "law" (upholding status).

  **What This Activity Cannot Reproduce:**
  *   **Embodied Risk:** Students do not feel the physical toll on the GC. The "Bodily Autonomy" points are abstract.
  *   **Emotional Bonding:** The 30-minute rounds cannot simulate the attachment formed over 9 months.
  *   **Power Imbalance:** In a classroom, the GC role has equal voice. In reality, economic desperation often silences the GC in Regime A, while Regime B may silence the IPs.

  **Predictable Failures & Corrections:**

  | Predictable Failure | Why It Happens | Correction (In-Game) |
  | :--- | :--- | :--- |
  | **The "Fixer" Broker** | Students playing the Broker will try to "loophole" Regime B to save the deal. | **Intervention:** Remind the Broker: "Your license is revoked. Any fee discussion triggers a criminal investigation penalty (-500 VP)." Force the market logic to die. |
  | **Abstract Points** | Students may treat VPs as mere scores, ignoring the moral weight. | **Framing:** In the intro, state: "VPs represent your ability to build a life. 0 VPs means legal ruin, bankruptcy, or loss of custody." |
  | **GC Over-Empowerment** | In Round 2, the GC might simply say "I keep the baby" immediately, ending tension. | **Constraint:** Give the GC a hidden goal card: "You need 100 VP for medical debt." She *needs* the IPs' cooperation to survive, forcing negotiation despite the legal leverage. |
  | **Registrar Collusion** | Registrars might ignore Regime B to help the class "win." | **Mechanism:** The Instructor acts as the "Audit." If a Registrar issues a certificate to IPs in Round 2, the Instructor publicly confiscates their VP sheet. |

  **Instructor Note for the Debrief:**
  If students argue that Regime B is "better" because it protects women, or Regime A is "better" because it respects autonomy, stop the normative debate. Return them to the *structural* insight: "You are arguing about which ontology is moral, but the legal reality is that they are incommensurable. You cannot translate a Status into a Contract without residue. That residue is where your colleague's legal crisis lives."
