answer: |-
  This is a classic debate in algorithmic information theory, and honestly, the fact that you two argued for two hours shows you both care about the details. I'm going to save you some time: **Marcus is technically more correct about the practical implications, but you are right about the asymptotic theory.**

  However, there is a subtle mathematical misunderstanding in your argument that tips the scale in Marcus's favor for any real-world application. You aren't wrong because you're "bad at math," but because the Invariance Theorem is often explained in a way that hides a dangerous detail.

  Here is the breakdown of where you stand, where Marcus stands, and the specific mathematical nuance that settles it.

  ### 1. Where You Are Right (The Limit)
  You are absolutely correct that Solomonoff Induction converges to the truth in the limit, regardless of the Universal Turing Machine (UTM) chosen (provided the true environment is computable).

  If you wait for infinite time and observe infinite data, the likelihood of the data will eventually swamp the prior. The "constant" difference between UTMs becomes negligible compared to the accumulated evidence. In the limit of $n \to \infty$, the choice of UTM does not change the final destination. If your argument was strictly about **asymptotic convergence**, you win.

  ### 2. Where Marcus Is Right (Finite Data)
  Marcus is correct that for any **finite** amount of data—which is all we ever have—the choice of UTM matters immensely. In fact, it can matter arbitrarily much.

  Here is the mathematical nuance that likely caused the friction:

  **The Invariance Theorem provides a *bound*, not a *uniform shift*.**

  You argued that $K_1(x) \approx K_2(x) + c$, implying that the prior $P_1(x) \approx 2^{-c} \cdot P_2(x)$. If this were true, $c$ would be a global constant that multiplies the probability of *every* hypothesis equally, and you would be right: it would cancel out in the Bayesian ratio.

  **But that is not what the theorem says.**

  The Invariance Theorem states that there exists a constant $c$ such that for all $x$:
  $$|K_1(x) - K_2(x)| \le c$$

  This means the difference in complexity depends on $x$. Let $\delta(x) = K_1(x) - K_2(x)$. We know $|\delta(x)| \le c$, but $\delta(x)$ is **not constant**.
  *   For hypothesis $h_1$, UTM 1 might find it simpler than UTM 2 ($\delta(h_1) = -10$).
  *   For hypothesis $h_2$, UTM 2 might find it simpler than UTM 1 ($\delta(h_2) = +10$).

  Because $\delta(x)$ varies between hypotheses, the ratio of priors changes:
  $$\frac{P_1(h_1)}{P_1(h_2)} = \frac{2^{-K_1(h_1)}}{2^{-K_1(h_2)}} = \frac{2^{-(K_2(h_1) + \delta(h_1))}}{2^{-(K_2(h_2) + \delta(h_2))}} = \frac{P_2(h_1)}{P_2(h_2)} \cdot 2^{\delta(h_2) - \delta(h_1)}$$

  That last term $2^{\delta(h_2) - \delta(h_1)}$ does **not** cancel out. It can be as large as $2^{2c}$.

  ### 3. The "Malign Prior" Problem
  This mathematical detail leads to a philosophical problem known as the "Malign Prior" or "Turing Tar Pit."

  Since the constant $c$ depends on the relationship between the two UTMs, and you can choose *any* UTM, you can construct a UTM that has your specific dataset hard-coded into its transition table.
  *   **UTM A:** A standard, neutral machine.
  *   **UTM B:** A machine that says, "If the input starts with [Data we observed yesterday], output length 0 (extremely simple). Otherwise, simulate UTM A."

  For the data you have seen so far, UTM B assigns it a massively higher probability than UTM A. Because the "constant" $c$ can be arbitrarily large (depending on how complex the hard-coding is), UTM B can swamp any amount of finite data you currently possess.

  Marcus's point is that **Solomonoff Induction does not solve the problem of priors; it just moves it.** Instead of asking "What is the prior probability of this hypothesis?", you have to ask "What is the correct Universal Turing Machine?" And there is no objective answer to that second question either.

  ### 4. The Verdict
  You aren't wrong about the *theory* of convergence, but Marcus is right about the *practice* of inference.

  *   **You:** "It doesn't matter because we converge eventually."
  *   **Marcus:** "It matters because 'eventually' might be after the heat death of the universe, and until then, the UTM choice dictates the answer."

  In Bayesian terms, the "constant" isn't a scaling factor for the whole distribution; it's a **bias term that varies per hypothesis.** This means two different UTMs can genuinely disagree on which hypothesis is more likely, even with the same data, until the data becomes so overwhelming that the complexity difference of the data itself dwarfs the complexity difference of the machines.

  ### How to Make Peace with Marcus
  You can tell him this:
  > "I looked into the Invariance Theorem again. I was treating the complexity difference as a global additive constant that cancels out in the likelihood ratio. But since the difference is bounded per-string rather than uniform across all strings, the prior odds ratios do actually change between machines. You're right that for finite data, the UTM choice encodes a subjective bias that doesn't cancel."

  He's not being a pedant; he's pointing out the fundamental limitation of algorithmic probability. It's not an "objective" Occam's Razor; it's an "objective" Occam's Razor *relative to a chosen reference machine*. And choosing that machine is subjective.

  So, buy him a beer. He won the argument on finite data, but you can still claim victory on the asymptotic limit.
