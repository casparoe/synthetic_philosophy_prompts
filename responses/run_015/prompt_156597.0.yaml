  Hey — I'm prepping for a semniar on dirty hands and I'm stuck on this bit from Machiavelli's Prince, chapter 18 I think, where he says a prince has to be both lion and fox, and that he ought to break promises whenever keeping them hurts his position, provided he can dress it up with good reasons. I paraphrased that from memory of an old translation, so forgive the roughness.

  What I'm trying to understand is whether he's saying the prince is still genuinely bound by some moral norm but just has to violate it for survival — like strategic hypocrisy — or whether he's arguing that "keeping faith" is just a performance for the masses and there's no real betrayal at all. And then I want to connect this to democratic dirty hands: if an elected leader lies to stop a panic but is suposed to be a trustee for the public, does Machiavelli's logic still hold? Or does the democratic mandate change the moral calculus in a way he wouldn't recognize?

  Can you walk me through the passage first, then tell me where the analogy brakes down? I feel like I'm mixing up instrumental and constitutive wrongness here.
