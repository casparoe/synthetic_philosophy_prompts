answer: |-
  ### Workshop Pitch Component: Ontological Commitment Under Informational Closure Failure

  **Subject:** Desiderata for Ontology Identification in Epistemically Closed Systems
  **Context:** Research Fellowship Proposal / Workshop Framework

  Here is the breakdown you need to settle the argument and structure the pitch. The core tension your roommate is pointing at isn't just underdetermination; it's *permanent* underdetermination due to causal or nomological barriers. Standard Quinean naturalism assumes that as science progresses, ontological commitments converge. Your pitch must challenge the convergence assumption when the "data stream" is physically severed.

  #### 1. Brainstorm: The Blind Spots in Standard Quinean Commitment
  When philosophers invoke "to be is to be the value of a bound variable," they usually gloss over the pre-conditions for binding that variable. Here are the requirements typically missed:

  *   **Theory-Independence of Reference:** Quine ties existence to the theory. But if the theory is underdetermined by permanent gaps, the variable might range over different domains in empirically equivalent theories. We need a criterion for when a variable refers to the *same* thing across incompatible theories.
  *   **The Cost of Paraphrase:** Quine allows us to paraphrase away commitments (e.g., treating "average men" as sets, not entities). But paraphrase is often pragmatic, not metaphysical. A robust spec must distinguish between "we can talk without committing" and "there is nothing to commit to."
  *   **Diachronic Stability:** Ontological commitment is usually synchronic (based on current best theory). But if the gap is permanent, current best theory is the *only* theory. We need a requirement for how commitment survives theory change when the new theory cannot access the old data.
  *   **Negative Existentials:** Quine struggles with what *doesn't* exist. In closure failures, knowing what *cannot* be there is as important as knowing what is. Standard criteria only validate positive existence.
  *   **The "Best" in IBE:** Inference to the Best Explanation relies on virtues like simplicity. But if the missing information is permanently inaccessible, simplicity is not truth-tracking; it's merely aesthetic. A spec must account for the risk that the "best" explanation is systematically biased by the gap.

  #### 2. Desiderata Spec: Ontology Identification under Informational Closure (OII-C)
  To move beyond the stalemate, your workshop needs a formal specification for a theory that claims to identify ontological categories even when informational closure fails. This is not about "belief"; it is about the conditions for valid commitment.

  **A. Cases the Theory Must Handle**
  1.  **Direct Causal Unobservability:** Entities that cannot, even in principle, transmit information to the observer (e.g., events inside a black hole event horizon, assuming cosmic censorship holds).
  2.  **Destroyed Historical Records:** Past states that have been thermodynamically erased (entropy maximization) such that no present trace remains to distinguish between competing historical ontologies.
  3.  **Modal Distance:** Counterfactual states of affairs that are causally isolated from the actual world but relevant for dispositional properties (e.g., what a particle *would* do in a universe with different constants).
  4.  **Quantitative vs. Qualitative Inaccessibility:** Distinguishing between not knowing *how many* entities exist (quantitative gap) vs. not knowing *what kind* of entities exist (qualitative gap). Most accounts collapse these; your spec must separate them.

  **B. Distinctions That Cannot Collapse**
  1.  **Ontology vs. Epistemology:** The theory must not reduce existence to knowability. It must allow for the proposition "X exists" to be true even if "We can know X exists" is false. If the theory makes existence contingent on access, it is verificationist, not ontological.
  2.  **Identification vs. Confirmation:** We must be able to *identify* the ontological slot (the role) without *confirming* the filler (the occupant). Standard accounts conflate confirming the theory with confirming the ontology.
  3.  **Permanent vs. Contingent Gaps:** The logic must distinguish between "we don't know yet" (contingent) and "no observer can know" (permanent). Treating permanent gaps as contingent leads to infinite regress in resource allocation.

  **C. Scientific Constraints (Non-Negotiables)**
  The theory cannot contradict established limits on information retrieval:
  *   **Heisenberg Uncertainty:** Cannot claim simultaneous determinacy of conjugate variables as an ontological fact derived from measurement.
  *   **Cosmic Censorship:** Cannot posit observable properties for singularities hidden behind horizons.
  *   **Thermodynamic Arrow:** Cannot claim reconstructability of past microstates from present macrostates where entropy has maximized.

  #### 3. The Critical Tensions
  This is the section that will make your pitch stand out to the fellowship committee. You need to show you understand the cost of the problem.

  **The "Killer" Requirement:**
  **Uniqueness of Ontological Commitment.**
  This is the single requirement that kills the most popular accounts (including Entity Realism and most versions of Structural Realism). If information is permanently inaccessible, there will always be multiple, mutually incompatible ontologies that fit the available data equally well (the Duhem-Quine thesis on steroids). Any account that demands a *unique* correct ontology in the face of permanent informational closure fails. Most accounts try to dodge this by retreating to "structure," but if the structure itself is underdetermined by the missing data, they die too.

  **The Jointly Unsatisfiable Pair:**
  **Ontological Determinacy** AND **Non-Arbitrary Selection.**
  *   *Ontological Determinacy:* The theory must yield a specific answer about what exists (e.g., "There are fields, not particles").
  *   *Non-Arbitrary Selection:* The choice between competing ontologies must be driven by evidence or logic, not pragmatic whim.
  *   *Why they clash:* Under permanent informational closure, evidence is exhausted. To achieve Determinacy, you must choose one ontology over another. Without evidence to distinguish them, that choice becomes Arbitrary. You can have determinacy (by fiat) or non-arbitrariness (by suspending judgment), but not both.

  #### 4. Failure vs. Incompleteness
  To avoid the "you're just being skeptical" objection, you must define failure conditions precisely.

  *   **Mere Incompleteness:** The theory identifies a gap and explicitly marks the ontological status as *indeterminate*. (e.g., "There exists an entity of type X or Y, but the theory cannot distinguish which.") This is a success state for this spec.
  *   **Systematic Failure:** The theory asserts a specific ontological commitment (e.g., "It is X") that relies on inference rules (like IBE) which are truth-tracking only if information is accessible. If the theory claims to *know* what is behind the permanent gap, it has failed.
  *   **False Negative Failure:** The theory claims no commitment can be made, when in fact logical constraints (independent of empirical data) dictate a commitment. (e.g., Mathematical necessities that hold regardless of physical access).

  #### 5. Pitch Framing Advice
  When you write this up, do not frame it as "solving" the problem. Frame it as **mapping the boundary conditions of naturalized metaphysics.**

  Your argument to the roommate is this: We *can* lock down an ontology, but only if we accept that "locking down" might mean defining a *space of possible ontologies* rather than a single point. If they insist on a single, determinate reality despite permanent information loss, they are smuggling in a theological premise (that reality must be intelligible to us) rather than a scientific one.

  The workshop's goal is to formalize the logic of **Ontological Residue**—what remains of our commitment after we subtract everything that relies on accessible information. If the residue is empty, the roommate wins (skepticism). If the residue is non-empty, you win (a constrained realism). The spec above is the sieve you use to test the residue.
