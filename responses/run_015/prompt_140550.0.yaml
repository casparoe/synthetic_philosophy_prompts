      *   Case 6 (Poverty): Some Positive libertarians say poverty *is* unfreedom. The principle says no (no agent). User agrees with principle.
      *   Case 10 (Precommitment): The principle forces a decision. It can't remain "I don't know." It depends on whether the friend has discretion.
      *   Case 3 (Audit): If the audit is truly *random* and *retrospective*, is it arbitrary? If the rules are clear, it's not arbitrary. If the audit selection is random but the rule is fixed, it's non-arbitrary. The principle needs to ensure #3 is distinguished from #2. The distinction is *Prior Restraint* vs *Ex Post Liability*.

