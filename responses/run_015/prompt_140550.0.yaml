      4.  Employer: Agent (Boss). Capacity (Fire). Tracking (No, at-will). Verdict: Unfree. (Matches).
      5.  Addiction: Agent (None/Internal). Verdict: Free. (Matches).
      6.  Poverty: Agent (None/Structural). Verdict: Free. (Matches).
      7.  Friend: Agent (Friend). Capacity (Persuasion). Tracking (Yes, loving/reasons). Verdict: Free. (Matches).
      8.  Ads: Agent (Corp). Capacity (Manipulate). Tracking (No, profit/hidden). Verdict: Unfree. (Matches).
      9.  Self-Law: Agent (State). Capacity (Penalty). Tracking (Yes, voted for). Verdict: Free. (Matches).
      10. Precommitment: Agent (Friend/Self). Capacity (Lock). Tracking (Yes, instructed). Verdict: *Depends on instruction.* If friend has discretion -> Unfree. If friend is automated -> Free. (Resolves the ambivalence).

  7.  **Addressing the "Shadow of a Veto" (#2 vs #3):**
      *   Why is #2 worse? It's about *Standing*. In #2, you need their 'Yes' to act. In #3, you act unless they say 'No' later. #2 makes your agency derivative of theirs. #3 makes your agency primary but risky.
      *   Principle adjustment: **Derivative Agency.** If your ability to act *originates* in their permission, you are subject. If your ability to act is *inherent* but subject to penalty, you are less subject (provided the penalty is rule-bound).

  8.  **Addressing the Cost (Which verdicts to sacrifice?):**
