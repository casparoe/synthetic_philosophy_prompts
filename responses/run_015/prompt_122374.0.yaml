      *(Refining the "Friend's Position")*: The friend is essentially arguing for "Methodological Individualism." Only individuals act. I should frame it that way without using the jargon. "The man decided."

      *(Refining the "Tomato Harvester")*: The harvester is actually a better example of *inherent* politics because the machine's size and speed *require* a certain labor structure. The bridge is *adapted* politics. I need to make this distinction clear.

