  2.  **Deconstruct Good's Theorem:**
      *   *Core Claim:* The expected utility of making an observation is always non-negative, *provided* the agent uses the new information optimally.
      *   *Conditions:*
          1.  Rational agent (Bayesian updater).
          2.  Utility function is well-defined.
          3.  The observation is free (or cost is accounted for).
          4.  The agent *must* be allowed to change their decision based on the observation.
      *   *Implication:* It is never rational to refuse free information.

  3.  **Translate to ML/Active Learning Vocabulary:**
      *   *Agent:* The AL loop / Policy $\pi$.
      *   *Decision:* Model selection / Parameter update / Final prediction.
      *   *Observation:* Querying a label $(x, y)$.
      *   *Utility:* Negative Loss / Performance Metric (e.g., Accuracy, F1, Negative Log Likelihood).
      *   *Optimal Use:* Retraining/Updating weights to minimize expected risk on the test distribution.
      *   *Cost:* Annotation cost $c(x)$.
      *   *Theorem Restatement:* The Expected Value of Sample Information (EVSI) is $\ge 0$.
      *   *Acquisition Function:* $\alpha(x) = \mathbb{E}_{y \sim P(y|x, D)} [U(D \cup \{(x,y)\}) - U(D)] - c(x)$.
      *   *Condition:* The model update rule must be Bayes-optimal (or consistent).

  4.  **Drafting the Restatement (Iterative Process):**
      *   *Attempt 1:* Good says getting data is good. In AL, this means our acquisition function should always be positive if cost is zero.
      *   *Critique 1:* Too vague. Needs math-ish notation.
      *   *Attempt 2:* Let $D$ be dataset. Let $h$ be hypothesis. Good says $\mathbb{E}[U(h_{new})] \ge U(h_{old})$.
      *   *Critique 2:* Need to incorporate the *policy* aspect. The decision isn't just the model, it's the final action. But in ML, the "action" is usually the model's prediction. Let's frame it as Expected Risk Reduction.
      *   *Refinement:* Define Value of Information as Expected Reduction in Generalization Error.
      *   *Key Constraint:* The model *must* be retrained optimally on the new data. If we use a suboptimal optimizer, Good's theorem doesn't hold.

  5.  **Developing the Residue Report:**
      *   *Clean Maps:* Bayesian updating $\to$ Posterior updates (SGD/VI). Utility $\to$ Loss function. Cost $\to$ Annotation budget.
      *   *Fudges:*
          *   *Computational Bounds:* Good assumes logical omniscience (perfect Bayesian update). ML uses approximate inference (SGD, early stopping).
          *   *Model Misspecification:* Good assumes the true hypothesis is in the support (or at least the prior is coherent). ML models are often misspecified.
          *   *Stationarity:* Good assumes static world. ML often faces drift.
          *   *The "Decision":* In Good's framework, you observe then decide. In ML, you observe then *retrain*, then decide. The retraining step is the black box.
      *   *No Counterpart:*
          *   *Moral/Epistemic Value:* Philosophers care about truth/knowledge for its own sake. ML cares about predictive performance on a specific test set.
          *   *Infinite Regress:* Good discusses the cost of calculating the VoI. In ML, we just approximate the acquisition function (e.g., BALD, Entropy) without calculating the *true* VoI.

