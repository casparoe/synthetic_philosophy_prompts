answer: |-
  ### The Restatement: Good's Theorem in Active Learning Terms

  Let $\mathcal{D}_t$ be your current labeled dataset at step $t$, and $\theta$ be your model parameters. You have a policy $\pi$ that selects a query $x^*$ from an unlabeled pool $\mathcal{U}$ to maximize an acquisition function $\alpha(x)$. Let $L(\theta; \mathcal{D}_{test})$ be your loss on the true test distribution (your negative utility).

  Good's Theorem translates to the following claim about your **Expected Value of Sample Information (EVSI)**:

  $$ \mathbb{E}_{y \sim P(y|x^*, \mathcal{D}_t)} \left[ \min_{\theta'} L(\theta'; \mathcal{D}_t \cup \{(x^*, y)\}) \right] \leq \min_{\theta} L(\theta; \mathcal{D}_t) $$

  In plain engineering English: **The expected Bayes Risk of your model after optimally retraining on a new label $(x^*, y)$ is always less than or equal to the Risk of your current model, provided the label is free.**

  If annotation has a cost $c(x^*)$, the theorem dictates your acquisition function must satisfy:
  $$ \alpha(x^*) = \underbrace{\left( L(\theta; \mathcal{D}_t) - \mathbb{E}_{y} \left[ L(\theta^*; \mathcal{D}_{t+1}) \right] \right)}_{\text{Expected Risk Reduction}} - c(x^*) \geq 0 $$

  **The Conditions for Validity:**
  1.  **Optimal Update:** The transition from $\mathcal{D}_t \to \mathcal{D}_{t+1}$ must result in the *globally optimal* parameters $\theta^*$ for the new dataset. You cannot get stuck in a worse local minimum.
  2.  **Coherent Priors:** Your uncertainty estimation (the expectation over $y$) must be a valid posterior predictive distribution. You cannot be overconfident or miscalibrated.
  3.  **Decision Flexibility:** You must be allowed to change your hypothesis class or parameters based on the new data. If you are forced to keep $\theta$ fixed and only adjust a head, the theorem does not hold.
  4.  **Stationarity:** The distribution $P(x, y)$ generating $\mathcal{D}_{test}$ must remain invariant during the acquisition step.

  ---

  ### The Residue Report

  Here is the audit of how well your AL framework maps onto Good's decision-theoretic foundation.

  #### 1. Clean Mappings
  *   **Utility $\leftrightarrow$ Negative Loss:** Good's "utility of decision" maps cleanly to negative generalization error. Maximizing utility is minimizing risk.
  *   **Observation Cost $\leftrightarrow$ Annotation Budget:** Good explicitly handles costly observation. Your constraint $\sum c(x_i) \leq B$ is a direct implementation of his cost-benefit analysis.
  *   **Exploration/Exploitation $\leftrightarrow$ EVSI:** In Good's framework, "exploration" isn't a heuristic; it is the calculation of how much a reduction in epistemic uncertainty improves future decision utility. Your acquisition functions (BALD, AcqKnockout) are approximations of this EVSI term.

  #### 2. The Fudges (Where the Math Breaks)
  *   **Belief Revision $\approx$ Weight Updates:** This is the largest fudge. Good assumes **Bayesian Conditioning**. You are likely doing **SGD/Backprop**.
      *   *The Fudge:* You treat $\theta_{new} = \text{Train}(\mathcal{D}_{old} \cup \{z\})$ as equivalent to $P(\theta | \mathcal{D}_{old} \cup \{z\})$.
      *   *The Reality:* SGD is not a Bayesian updater. It is a noisy, approximate optimizer. Adding data can push a non-convex loss landscape into a basin with higher generalization error (catastrophic forgetting or poor convergence). Good's theorem assumes logical omniscience regarding the update rule; you have computational bounds.
  *   **The "True" Distribution:** Good assumes the agent has a prior over the *true* state of the world. In ML, we assume the test distribution is fixed, but we often know our model class is **misspecified** (the truth is not in the support of our priors/model family).
      *   *The Consequence:* Under misspecification, more data can converge you faster to the *wrong* answer, or oscillate between wrong answers depending on the sample. Good's theorem assumes the information is relevant to the true hypothesis.
  *   **Acquisition Cost vs. Compute Cost:** Good accounts for the cost of *getting* the data (annotation). He implicitly assumes the cost of *processing* the information (calculating the posterior) is negligible or accounted for in the decision time.
      *   *The Fudge:* In Deep AL, calculating $\alpha(x)$ (e.g., via MC Dropout or Ensembles) often costs more than the annotation. We ignore the "computational VoI" in our acquisition loops.

  #### 3. No Counterpart (Philosophical Orphans)
  *   **The Value of Truth vs. Predictive Accuracy:** Philosophers debate whether information has intrinsic value (knowing the truth) vs. instrumental value (making better decisions). In ML, **truth is irrelevant**; only predictive performance on $\mathcal{D}_{test}$ matters. If a lie improves your loss metric, your framework accepts it. Good's theorem is neutral here, but the *interpretation* of "information" differs.
  *   **Infinite Regress of Calculation:** Good famously noted the "type II" problem: calculating the Value of Information requires information itself (to know if the calculation is worth it). In ML, we side-step this by using **heuristics** (Entropy, Margin) rather than calculating true EVSI. We don't have a meta-acquisition function to decide if calculating the acquisition function is worth the FLOPs.

  ---

  ### The Verdict: Does "More Data Can't Hurt" Survive?

  **No.** Your intuition breaks exactly where Good's conditions are violated in modern ML.

  Good's theorem proves that **Free Information + Optimal Processing $\geq$ Status Quo.**

  In your workflow, you frequently violate the **Optimal Processing** clause.
  1.  **Non-Convexity:** If you add a high-entropy point (high information gain) and your SGD optimizer lands in a sharper, worse local minimum, your loss goes up. Good's theorem assumes you find the global $\text{argmin}_\theta$. You do not.
  2.  **Model Misspecification:** If your model is biased, adding data from a region where the bias is exposed can increase variance without reducing bias sufficiently, increasing total error. Good assumes a coherent probability model; you have a biased estimator.
  3.  **Label Noise:** Good assumes the observation reveals the true state $y$. In AL, $y$ is often a noisy human annotation. If the "information" is actually "noise," and you treat it as truth (Bayes update), you degrade your posterior. Good's theorem holds for *veridical* information, not corrupted signals.

  **Where Good Exposes the Break:**
  Good's conditions pinpoint that "More Data Can't Hurt" is actually a statement about your **Optimizer**, not your Data.
  *   If you had a **Bayes-Optimal Learner** (infinite compute, correct prior, correct likelihood), Good's theorem holds: adding data never increases expected Bayes Risk.
  *   Since you have a **Bounded Rational Learner** (SGD, finite epochs, misspecified architecture), adding data introduces **Optimization Risk**.

  **Engineering Takeaway:**
  When your active learning loop selects a point with high Expected Information Gain but performance drops, do not blame the acquisition function. Blame the violation of Good's **Optimal Update** condition. You are paying for information you cannot computationally digest. This suggests your acquisition function should penalize points that are too "complex" for your current optimizer to integrate smoothly—a term rarely present in standard AL objectives.
