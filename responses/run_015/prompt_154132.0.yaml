answer: |-
  Your diagnosis is exceptionally sharp. You have correctly identified that the surface-level debate about marriage is a proxy for a deeper conflict regarding the **ontology of social institutions**. After two years of stalemate, it is unlikely that further argumentation about the *definition* of marriage will yield results because the disagreement is not about definition; it is about **source authority**.

  Here is a philosophical diagnosis of the impasse, followed by an assessment of what could actually count as progress in your reading group.

  ### 1. The Diagnosis: An Ontological Clash, Not a Definitional One
  You hypothesized that one side views marriage as a "natural-kind category" and the other as a "status-contract." This is correct, but it goes deeper than semantics. It is a clash between **Natural Law Realism** and **Liberal Constructivism**.

  *   **The Traditionalist Position (Natural Law Realism):** This camp argues that marriage is a **pre-political reality**. On this view, the state does not *create* marriage; it *recognizes* it. The "essence" of marriage is derived from human biology and the inherent teleology of sexual union (the "conjugal view"). Because the institution exists prior to the state, the state's authority is limited to tracking this reality. To redefine marriage is not to expand a contract but to falsify a reality.
  *   **The Revisionist Position (Liberal Constructivism):** This camp argues that marriage is a **political construct**. On this view, social institutions are tools created by humans to serve human ends (stability, welfare, equality). There is no "nature" of marriage outside of human intention. Therefore, the state has the authority to redesign the institution to better serve contemporary normative goals, such as equal dignity or adult autonomy.

  **Why this causes a treadmill effect:**
  You cannot argue someone out of a metaphysical commitment using empirical data. If a Traditionalist believes marriage *is* essentially reproductive in structure (even if infertile), showing them that gay parents raise healthy children does not address the core claim. The claim isn't "gay parents are bad"; the claim is "that union is not *marriage* regardless of outcome." Conversely, showing a Revisionist legal precedents about complementarity fails because they view those precedents as historical artifacts of prejudice, not ontological truths.

  ### 2. The Role of Empirics and Normativity
  You asked if there is a hidden empirical disagreement or a normative claim masked in definition.

  *   **Empirics are Theory-Laden:** The sociological studies are not doing the heavy lifting; they are being used as ammunition. Both sides engage in **motivated reasoning**. When data suggests children do better with a mother and father, Traditionalists see validation of natural teleology; Revisionists see a correlation explained by social stigma or economic factors. The data cannot settle the dispute because the *interpretation* of the data depends on the prior metaphysical commitment.
  *   **Normative Incommensurability:** The core conflict is between two competing normative values that are difficult to weigh against each other: **Truth/Integrity** vs. **Equality/Inclusion**.
      *   For the Traditionalist, redefining marriage is a lie about human nature. Asking them to accept it is asking them to consent to a falsehood.
      *   For the Revisionist, excluding same-sex couples is a violation of equal citizenship. Asking them to accept the traditional view is asking them to consent to injustice.
      *   Because "Truth" and "Justice" are both terminal values, there is no higher court of appeal to decide which trumps the other in this context.

  ### 3. Is it a Verbal Dispute?
  It is *not* merely verbal. If it were purely verbal, you could say, "Okay, you keep the word 'marriage' for the conjugal view, and we'll use 'civil union' for the contract view," and the fight would end. But the fight doesn't end because the **status** carries material and symbolic power.
  *   The Revisionist wants the *word* "marriage" because "separate but equal" is stigmatizing.
  *   The Traditionalist wants to protect the *concept* because they believe decoupling marriage from procreation harms the culture's understanding of kinship.
  They are fighting over the **social imaginary**, not just the dictionary.

  ### 4. What Counts as Progress?
  Given that this is a bedrock metaphysical disagreement, "winning" the argument is impossible. However, philosophical progress is still available. Here are three pathways, ranked from most to least ambitious:

  **A. The Meta-Ethical Shift (Upstreaming)**
  Stop arguing about marriage. Acknowledge that you are stuck on the **Metaphysics of Institutions**.
  *   **Action:** Change the reading list. Read John Searle on *social facts* (how we create institutional reality), Alasdair MacIntyre on *traditions*, or Michael Sandel on *the moral limits of markets* (which touches on whether some goods are corrupted by redefinition).
  *   **Goal:** Agree on *why* you disagree. If the group can explicitly state, "We are stuck because Group A believes institutions have natural ends and Group B believes institutions are malleable tools," you have achieved philosophical clarity. That is progress.

  **B. The "Public Reason" Compromise (Rawlsian)**
  Explore whether the Traditionalist argument can be translated into "public reason" accessible to those who don't share their comprehensive moral doctrine.
  *   **Action:** Read John Rawls (*Political Liberalism*) or Robert George (*Conscience and Its Enemies*).
  *   **Goal:** Test whether the Traditionalist claim can be defended without recourse to specific metaphysical claims about "natural kinds." (Traditionalists argue it can; Revisionists argue it cannot). If the Traditionalists admit their view relies on a specific comprehensive doctrine they cannot impose on a pluralistic society, or if Revisionists admit that pure autonomy undermines the stability the state needs, you might find a narrow overlap.

  **C. Accepting Incommensurability (The Graceful Exit)**
  Acknowledge that some political disagreements are **tragic conflicts** where one value must be sacrificed for another, and there is no rational algorithm to decide which.
  *   **Action:** Read Isaiah Berlin (*The Crooked Timber of Humanity*) on value pluralism.
  *   **Goal:** Move from "Who is right?" to "How do we live together given that we view reality differently?" This shifts the discussion from *truth* to *modality*. It accepts that the law will likely reflect the Revisionist view (as it has in many jurisdictions) not because it is metaphysically superior, but because it is the only view compatible with a pluralistic liberal state.

  ### Recommendation
  Your working theory is correct: **You are arguing about the metaphysics of institutions disguised as family policy.**

  To break the treadmill, I recommend you explicitly propose a "meta-session." Tell the group: *"We have been arguing about the definition of marriage for two years. I propose that the disagreement is actually about whether social institutions have natural ends or are purely constructive. Can we spend one month reading texts specifically on the ontology of social kinds, rather than marriage cases?"*

  If they refuse, you have your answer: the group is not interested in philosophy; it is interested in advocacy. If they accept, you may not resolve the marriage question, but you will resolve the *confusion* about why it cannot be resolved. That is the best outcome a philosophy reading group can hope for.
