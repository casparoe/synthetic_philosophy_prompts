answer: |-
  In the fictional historiography of the Ostral Peninsula, scholars evaluate the "Crossing of Valerius," a foundational narrative describing King Valerius leading a mass migration across the Grey Strait to conquer the southern mainland, preserved solely in the *Song of Valerius*, a detailed epic composed centuries later. Archaeological excavation at the purported landing site reveals a singular destruction layer containing burned timber and foreign pottery shards compatible with a violent arrival but equally consistent with local civil unrest or accidental fire. Embedded within an unrelated bureaucratic archive of grain receipts from the southern mainland, scholars discovered the "intercalated witness": a fragmentary tax docket listing a chieftain named Valerius paying tribute to the southern kings, but dated via paleography to a century and a half prior to the epoch described in the *Song*. This single administrative fragment confirms the leader's name and existence but contradicts the epic's chronology, while the destruction layer confirms violence but not the agent, creating a scenario where the literary narrative and material traces align only if the administrative date is dismissed as erroneous or referring to a namesake.

  The Minimalist historian concludes the event remains **Legend**, accepting the claim that Valerius existed but rejecting the claim that he led the migration at the time described. Their criterion requires two independent source-types to corroborate the same specific claim without contradiction; here, the literary source (Epic) and the non-literary source (Tax Docket) contradict on chronology, and the archaeological layer fails to name the leader. The Coherentist historian concludes the event is **Probable History**, accepting the claim that Valerius led a migration during a period of regional instability. Their criterion permits promotion when the narrative demonstrates internal consistency with background conditions and ambiguous traces, allowing for a single contradictory fragment; they argue the tax docket proves the name's historicity despite the dating error, and the destruction layer fits the narrative of conflict. The structural feature doing the work is the **intercalated witness**, which provides the necessary non-literary anchor for the Coherentist while presenting a fatal chronological contradiction for the Minimalist.

  If the intercalated witness is removed entirely, both verdicts converge on **Legend**. Without the tax docket, the Minimalist still lacks a second source-type naming the leader, failing the corroboration condition. Simultaneously, the Coherentist loses the only non-literary verification of the leader's existence; without this anchor, the narrative consistency with the destruction layer is insufficient to elevate the specific claim of leadership from myth to history, as the ambiguous traces no longer connect to a verified historical agent.

  **Minimalist:** You are privileging a story over a document. The tax record is hard evidence placing a Valerius in a different century; to ignore that contradiction is to treat history as fiction. You cannot build a fact on a poem simply because some ashes exist nearby.

  **Coherentist:** You are demanding a precision ancient records cannot provide. A single clerical date does not erase a destruction layer that matches the epic's geography and scope. By dismissing the witness as an error rather than a refutation, we preserve the only explanation that makes sense of the text, the soil, and the name together.
