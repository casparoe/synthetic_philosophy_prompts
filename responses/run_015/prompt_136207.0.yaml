answer: |-
  This is an exceptionally sharp set of intuitions. You have grasped the Quinean problem of the "inscrutability of reference" not as a paradox to be solved, but as a structural feature of the relationship between evidence and theory. Your narrator's crisis is philosophically legitimate; it is not a confusion, but a confrontation with the limits of behavioral evidence.

  Your friend (the documentary linguist) is half-right and half-wrong. In *practice*, linguists produce dictionaries and grammars that treat "rabbit" as "rabbit." They must, to do their work. But your narrator is not asking about *utility*; she is asking about *truth*. Her crisis is metaphysical, not pragmatic. That is not an armchair fantasy; it is the specific horror of the theorist who realizes her tools cannot cut the world at the joints she assumed they did.

  Here is an analysis of your seven cases, a repair of your principle, and the predictions you requested.

  ### 1. Testing Your Proposal Against the Seven Cases

  Your tentative proposal is: *A term's application is as determinate as the community's dispositions to project it to novel cases and the generalizations it figures in jointly make it.*

  This is a robust, Quinean-pragmatist stance. Let's run it against your verdicts.

  *   **Case 1 (Plain Field):** **Fits.** Dispositions to project are compatible with "rabbit," "rabbit part," and "rabbit stage." Generalizations (e.g., "gavagai runs") fit all three. Verdict: Indeterminate.
  *   **Case 2 (Taxidermy/Skeleton):** **Fits.** The disposition to apply the word to a skeleton but not a foot breaks the symmetry. The "bounded body" hypothesis predicts these dispositions; the "undetached part" hypothesis does not. Verdict: Determinate.
  *   **Case 3 (Counting):** **Partial Fit / Tension.** You feel agreement settles nothing, but disagreement settles it. Your principle explains the disagreement (the "part" hypothesis predicts "two" for one rabbit; the "rabbit" hypothesis predicts "one"). But why doesn't agreement confirm the "rabbit" hypothesis? Logically, it should increase its probability.
      *   *Repair:* Your intuition here is actually deeper than standard verificationism. Agreement is compatible with multiple manuals (underdetermination). Disagreement *falsifies* specific manuals. In science, falsification carries more weight than verification. Your narrator senses that matching behavior is a shallow constraint, while divergent behavior reveals the underlying ontology.
  *   **Case 4 ("Glug" / Theoretical):** **Fits.** This is holism. The meaning is the role in the theory. If the theory works, the reference is fixed by the theory's success.
  *   **Case 5 (Heat-Shimmer):** **Fits.** The dispositions to project include the shimmer. The "natural kind" hypothesis fails; the "gerrymandered disjunction" hypothesis succeeds.
  *   **Case 6 (Bilingual Testimony):** **Strain.** If reference is determined by dispositions to project, why does an utterance in English settle it? The bilingual's testimony is just another behavioral disposition.
      *   *Repair:* The testimony imports *identity criteria* from English. It tells you not just how they use the word, but how they *individuate* the objects. This points to a missing variable in your principle (see below).
  *   **Case 7 (Burial Utterance):** **Fits.** This recognizes sentence-level holism. We can translate the noun "ancestor" determinately because of its role in other sentences, even if the *force* of this specific sentence (prayer vs. assertion) is unclear.

  ### 2. Repairing the Principle

  Your principle is 90% there, but it misses the specific mechanism that resolves Case 3 and Case 6. That mechanism is **Identity Conditions**.

  Quine's famous slogan was: "No entity without identity." We cannot know what a term refers to unless we know what counts as *the same* referent appearing again.

  **Revised Principle:**
  > *Reference is determinate only insofar as the language provides criteria of identity for the term's putative referents. Where behavioral dispositions underdetermine the identity conditions (e.g., does "same gavagai" mean same rabbit, or same rabbit-stage?), there is no fact of the matter. Where the community's practices (counting, reidentification, meta-linguistic testimony) fix the identity conditions, reference stabilizes.*

  **Why this repairs the cases:**
  *   **Case 3:** Counting is a test of identity. If they say "two" for one rabbit, they are using a different identity condition (stages/parts). If they say "one," they *might* be using ours, or they might be using a proxy function that maps 1-to-1 with ours. That is why agreement is weak (many maps fit) but disagreement is strong (many maps ruled out).
  *   **Case 6:** The bilingual isn't just reporting usage; she is translating the *identity conditions* of her language into English. She is saying, "Our criterion for 'same X' matches your criterion for 'whole animal'." This imports the determinacy of English ontology into the translation manual.
  *   **Case 1:** Without identity predicates (words for "same," "another," "is"), the identity conditions are absent. Indeterminacy remains.

  **The Cost:** Is this too baroque? No. It is actually simpler. It unifies the cases under the concept of *individuation*. The price you pay is accepting that for Case 1, your narrator is right: there really is no fact of the matter. She cannot "solve" it by looking harder.

  ### 3. Predictions for the Three New Cases

  **A. Our own word "rabbit" (reconstructed by an alien linguist)**
  *   **Prediction:** The indeterminacy applies to us, too.
  *   **Reasoning:** Quine's argument is universal. If an alien linguist had only our behavioral dispositions, they could not distinguish whether we refer to rabbits, rabbit stages, or undetached rabbit parts. We know we mean "rabbit" because we have access to our own internal identity criteria, not just our external behavior.
  *   **Narrative Use:** This is the moment of vertigo for your narrator. She realizes her own certainty is not based on better evidence, but on being *inside* the language.

  **B. Their word for "same" (Reidentification practices)**
  *   **Prediction:** This is the master key. If the language lacks a transitive identity predicate for physical objects (e.g., if "same" applies only to events or locations), the noun indeterminacy *cannot* be resolved.
  *   **Reasoning:** If they say "This is the same gavagai as that," do they mean the same rabbit returned, or the same rabbit-stage recurring? If their grammar treats objects like processes (like many Amazonian languages do with mass/count distinctions), "rabbit" might grammatically behave like "water."
  *   **Narrative Use:** If your narrator finds their word for "same" doesn't track spatio-temporal continuity the way English does, she must abandon "rabbit" entirely.

  **C. The AI Translator**
  *   **Prediction:** Fluent success, zero reference.
  *   **Reasoning:** The AI maps patterns of input to patterns of output. It optimizes for predictive success (Case 4), not ontological alignment. It can produce "rabbit" every time "gavagai" appears without "knowing" whether it refers to a stage or a whole.
  *   **Narrative Use:** The AI is the ultimate behaviorist. It proves your narrator's point: you can have perfect translation *utility* with total ontological *indeterminacy*.

  ### 4. The Friend's Objection: Armchair Fantasy?

  Your friend says this has no bearing on actual translation.
  *   **Where they are right:** In documentary linguistics, the goal is often preservation and communication, not metaphysical grounding. A dictionary entry `gavagai: n. rabbit` is a useful heuristic. It allows speakers to teach children and outsiders to communicate.
  *   **Where they are wrong:** They are conflating *engineering* with *science*. A bridge builder doesn't need to know quantum mechanics to build a bridge, but that doesn't mean quantum mechanics is a fantasy. Your narrator is doing the science of language, not just the engineering.
  *   **The Dramatic Truth:** The friend represents the "pragmatic immune system." They will tell your narrator she is overthinking it. But the narrator's realization is that the dictionary is a *lie of convenience*. It smooths over the cracks in the ontology. That is a profound, lonely realization for someone who has spent 20 years trying to be faithful to the truth of the language.

  ### 5. Confidence Calibration

  **How confident am I in this principle?**
  I am highly confident that this accurately reflects the Quinean framework and the subsequent debates (Davidson, Dummett, Evans) that form the "orthodoxy" of this specific philosophical problem. Your narrator's reasoning, adjusted for the "identity condition" repair, is the "real article."

  **The Claim I Am Least Sure Of:**
  I am least sure about **Case 6 (Bilingual Testimony)**.
  *   *Why:* There is a fierce debate over whether native speaker intuition/authority actually fixes reference or merely adds another layer of behavior. Some philosophers (Kripke, Putnam) argue that even the speakers might be wrong about their own reference (e.g., they might think they mean "gold" but actually mean "yellow metal"). If the bilingual is mistaken about the ontology of her own language, her testimony is just more noisy data.
  *   *For your novel:* It is safer to have the narrator treat the bilingual's testimony as *pragmatically* settling the matter (she has to write the dictionary somehow) while remaining *metaphysically* suspicious.

  **Consensus vs. Unsettled:**
  *   **Broad Consensus:** Case 1 (Plain Field Indeterminacy). Most philosophers of language accept that behavioral evidence alone underdetermines reference. Your narrator is on solid ground here.
  *   **Genuinely Unsettled:** Case 5 (Natural Kinds vs. Disjunction). Whether "gerrymandered" terms (rabbit + heat shimmer) count as "real" kinds or just useful descriptions is still debated (Realism vs. Anti-Realism).
  *   **Genuinely Unsettled:** The status of the AI (Case C). Whether high-dimensional vector mapping constitutes "meaning" or "reference" is currently the hottest open question in philosophy of mind and language.

  ### Summary for the Chapter

  Your narrator's realization should not feel like a logic puzzle she is solving, but like the ground dissolving. She has spent 20 years mapping a coastline, only to realize she has no way to measure the depth of the water.

  *   **The Principle to hold:** "I can map how they use the word, but I cannot map what they *mean* by it, because 'what' requires identity, and their identity is not mine."
  *   **The Friend's Role:** To represent the comfort of the "as if." "It's a rabbit, Maria. Write 'rabbit'. They know what you mean."
  *   **The Truth:** They know how to *use* it. They do not know what it *is*. Neither does she.

  This is not a strawman. It is the hard edge of the discipline. If you write it this way, you will honor both the linguist and the philosopher.
