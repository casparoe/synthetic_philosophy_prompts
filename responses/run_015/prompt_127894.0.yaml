answer: |-
  In a standard operating theater, Dr. Aris's failure to press a wireless veto button allows an autonomous surgical robot to proceed with a flawed incision that severs a patient's nerve, a case engineered so that the causation hinges entirely on the absence of energy transfer between her inaction and the machine's movement. The robot operates on internal battery power and pre-loaded logic, requiring only a digital signal to halt; when a sensor glitch triggers a warning light, protocol demands Aris press the button, but she freezes, transmitting no signal, force, or matter to the device, which continues its trajectory solely via its own internal mechanical processes until the damage is done.

  Counterfactual dependence counts the omission as a cause because in the nearest possible world where Aris presses the button, the signal sends, the robot halts, and the nerve remains intact, establishing that the harm depends on her actual failure to act. The physical-process account denies causation because no conserved quantity like energy or momentum flows from Aris to the robot; her inaction is a null event that cannot physically connect to the robot's internal kinetic chain. The interventionist account counts it as a cause not by comparing world similarities, but by modeling the scenario as a structural equation where the variable Veto (0 for no press, 1 for press) determines Outcome (0 for safe, 1 for harm), showing that an ideal intervention setting Veto to 1 invariantly changes Outcome to 0 regardless of physical transmission.

  The feature doing all the work is the physical discontinuity between the agent and the outcome, specifically the lack of energy transmission. If this feature were removed—for instance, if the veto required her to physically pull a lever that severed the robot's power cable—the physical-process account would likely accept the causation because her physical force would interrupt the energy flow sustaining the robot. A defender of the physical-process account attacks the original case by arguing that omissions are not real events but merely absences, and since absences cannot transmit conserved quantities, they cannot stand in causal relations, rendering the attribution of causation here merely pragmatic or legal rather than ontological.
