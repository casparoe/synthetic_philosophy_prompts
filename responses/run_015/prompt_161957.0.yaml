      *   *Demo:* **The "Doubling Map" Visualizer.** Two dots on a circle. Rule: Move double the distance. Input: Initial separation.
      *   *Why:* It's conceptually cleaner than Logistic Map. $x_{n+1} = 2x_n \mod 1$.
      *   *Okay, I'll stick to the Logistic Map ($4x(1-x)$) because it stays bounded [0,1] which helps the "Climate" argument later.*
