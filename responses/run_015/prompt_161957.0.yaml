answer: |-
  Here is the committed plan. It is designed for 45 minutes, offline, with zero calculus.

  ### 1. The Arc (Order of Operations)
  You cannot teach the limit of predictability until they believe in the existence of rules. If they think nature is inherently dice-rolling, chaos theory is just "complicated randomness" to them.

  1.  **Minutes 0–5: Establish "The Clockwork."**
      *   Define **Determinism** simply: "If I know the *exact* state now, and I know the *rules*, the future is already written."
      *   Use a non-physical example first. A computer program. If I run `print(2+2)`, it prints `4`. It does not sometimes print `5`.
      *   *Crucial distinction:* Establish that "Deterministic" does not mean "Simple." It just means "No dice involved in the rules."
  2.  **Minutes 5–10: Introduce "The Blur."**
      *   Shift from the *system* to the *observer*.
      *   Premise: In the real world, we never know the *exact* state. We always have measurement error (rounding, instrument limits).
      *   Set the trap: "If the system is clockwork, surely a tiny error just gives a tiny wrong prediction?"
  3.  **Minutes 10–25: The Demo (The Wedge).**
      *   Run the simulation (details below).
      *   Show that "Tiny Error" becomes "Total Disagreement."
      *   **Do not explain why yet.** Let the visual violation of their intuition sit for a moment.
  4.  **Minutes 25–35: The Horizon (The Core Lesson).**
      *   Explain the mechanism: Errors multiply, they don't add.
      *   The Trade-off: To get *twice* as much forecast time, you need *exponentially* better precision.
      *   The Hard Limit: A sensor 1,000,000x better doesn't let you predict forever; it just buys you a few more days/minutes. No computer fixes this.
  5.  **Minutes 35–40: The Bounds (Avoiding Nihilism).**
      *   Address the "Nothing is predictable" slide.
      *   Distinction: We lose the **Trajectory** (where the ball is), but we keep the **Bounds** (that the ball stays in the box).
      *   Example: I can't predict the exact temperature on July 15th in 50 years (Weather/Trajectory), but I can predict it will be hotter than January (Climate/Bounds).
  6.  **Minutes 40–45: Assessment & Close.**
      *   The Final Question (see below).

  ---

  ### 2. The One Demo: "The Diverging Lines"
  **Format:** A local HTML/JS file saved on your laptop desktop (opens in any browser, no internet needed). Do not use a video; they need to see *you* input the variable.

  **Visual:** A simple line graph. X-axis is "Time Steps," Y-axis is "System State."
  **The Rule:** Displayed plainly at the top: $Next = 4 \times Current \times (1 - Current)$. (No derivation, just state this is the law of this universe).
  **The Interaction:**
  1.  Show **Line A (Blue)**: Starts at $0.300000$. This is "Reality."
  2.  Ask the class: "I can't measure perfectly. How much off am I?"
  3.  Let them shout out a tiny number (e.g., "One millionth!").
  4.  You type that into the **Line B (Red)** start box: $0.300001$.
  5.  Hit **Run**.

  **What it must show:**
  *   For the first few steps, the lines lie on top of each other. (Validation: "See? Tiny error, tiny difference.")
  *   Suddenly, around step 15–20, the lines snap apart violently.
  *   By step 40, they are completely uncorrelated. When Blue is high, Red is low.
  *   **Crucial Feature:** The graph must show the lines staying within the same Y-axis bounds (0 to 1) even while diverging. This sets up the Climate argument later.

  **What it must lack:**
  *   **No Random Noise:** Do not add any "jitter" to the lines. The separation must be purely from the starting difference.
  *   **No Calculus labels:** No "Lyapunov exponents." Just "Steps" and "State."
  *   **No 3D:** Keep it 2D. 3D rotates and distracts.

  ---

  ### 3. The Misconception Matrix
  You cannot fight all of them. You must let some die so others can live.

  **1. "Chaos = Randomness" (FIGHT THIS ONE)**
  *   **When:** Immediately after the Demo (Minute 25).
  *   **Why:** This is the root error. If they think the divergence is due to hidden dice, the "Determinism $\neq$ Predictability" lesson fails.
  *   **How:** Point to the rule on the screen. "Did I roll a die? Did the computer flip a coin? No. We put the same rule in twice. The divergence came *only* from the starting difference."
  *   **Time Allocation:** Spend 5 full minutes here. This is your battle.

  **2. "The Butterfly Literally Causes the Tornado" (DEFUSE)**
  *   **When:** During The Horizon (Minute 30).
  *   **Why:** They think the butterfly *adds energy*.
  *   **How:** "The butterfly doesn't power the tornado. It just decides *where* and *when* the tornado forms. The energy was already there in the atmosphere. The butterfly is the trigger, not the fuel."

  **3. "A Big Enough Supercomputer Would Fix It" (DISMISS)**
  *   **When:** During The Horizon (Minute 32).
  *   **Why:** They think this is an engineering problem.
  *   **How:** "If you want to double your forecast time, you don't need a faster computer; you need a sensor that measures position down to the width of an atom. To double it *again*, you need to measure smaller than a proton. At some point, physics says 'no more precision possible.' The computer doesn't matter."

  **4. "Quantum Indeterminacy" (SKIP)**
  *   **When:** If a student raises it.
  *   **Action:** **Flat-out refuse to go here.**
  *   **Script:** "That is a fascinating question about quantum mechanics, but we are talking about *classical* chaos. Even if the universe were perfectly Newtonian with no quantum fuzziness, this prediction limit would *still* exist. We are skipping quantum today so we don't confuse the math with the physics."

  **5. "We Can't Predict Anything" (CORRECT)**
  *   **When:** The Bounds section (Minute 38).
  *   **Why:** This leads to climate denialism ("If you can't predict weather in 2 weeks, how can you predict climate in 50 years?").
  *   **How:** Use the Demo graph. "Look at the Red and Blue lines. Do I know where they are at Step 100? No. Do I know they will be between 0 and 1? Yes. Weather is the line. Climate is the box."

  ---

  ### 4. The Skip List (Say This Out Loud)
  To protect your time, explicitly state what you are **not** doing at the start or when relevant.
  *   "I am not going to teach you the math of *why* the lines separate."
  *   "I am not going to talk about Quantum Mechanics."
  *   "I am not going to discuss the history of Edward Lorenz."
  *   **Say:** "We are ignoring *why* the rules are what they are. We are only asking: Given rules, what can we know?"

  ---

  ### 5. The Final Question (Assessment)
  Do not ask for a definition. Ask for the consequence of the trade-off.

  **The Question:**
  > "Imagine I hand you a new sensor that is **1,000 times more precise** than the one we used in the demo. Does that allow you to forecast **1,000 times further** into the future? Why or why not?"

  **What you are listening for:**
  *   **Failure:** "Yes, because better data means better predictions." (They missed the horizon concept).
  *   **Failure:** "No, because it's random." (They missed the determinism concept).
  *   **Success:** "No. It buys you *more* time, but not *proportional* time. Because the errors multiply, you only get a fixed extra amount of time (e.g., a few more days), not a 1,000x extension."

  **Commitment:**
  If you run out of time, cut the "History" and "Quantum" talk, but **do not cut the "Bounds/Climate" section.** If they leave thinking chaos means "science is useless," you have failed the "Science & Society" brief. They must leave knowing that unpredictability of *state* does not mean unpredictability of *behavior*.
