      *   *Pivot back to Spreadsheet but gamified:* I put the starting number on the screen. I ask them "Give me a number to add to the second one." I type it in. I hit "Run" (macro). The lines diverge.
      *   *Actually, the most robust "no-wifi" demo that feels interactive:* **The "Doubling Map" on a Projector.**
      *   *Let's settle on:* **A pre-written, offline-capable HTML/JS file saved on the desktop.** It shows two dots moving on a circle. The rule is "Double the angle." Input: "How much offset?" (e.g., 0.0001). Action: Watch them separate.
      *   *Wait, keep it simpler.* **The "Stretch and Fold" Visual.**
