  9.  **Self-Correction on Demo:** A local HTML file might be risky if the lab computers block scripts. A **Spreadsheet** is safer. Every university computer has Excel/Sheets. I can protect the cells so they can only change the "Initial Error" cell.
      *   *Decision:* **Excel Spreadsheet.** It's boring but reliable. To make it exciting, use a Scatter Plot with lines that update instantly.
      *   *Wait, "Watch two runs separate."* A spreadsheet calculates instantly. They won't *watch* it separate.
      *   *Okay, back to Local HTML/JS.* It animates. I will instruct the user to save a specific code block as an `.html` file beforehand. This guarantees offline functionality and animation.
