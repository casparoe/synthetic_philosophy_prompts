              *   *CLI:* Down, *but* the plinth stays or the site is marked because the *duration* of the racism is the historical fact.
              *   *Wait, I need a case where they diverge on outcome.*
              *   *Idea:* A statue of a historical figure who was virtuous by 1800 standards but vile by 2020 standards.
              *   *FPTV:* Down (current message is offensive).
              *   *CLI:* Stay (the record of changing morals is the value).
              *   *Example:* Cecil Rhodes? Or maybe a colonial administrator who built schools but enforced segregation.
              *   *Let's go with the "Empty Plinth" outcome.* FPTV says "Empty space is neutral." CLI says "Empty space with a plaque is a new monument to the removal."

  3.  **Refining and Polishing:**

      *   *Tone:* Academic but engaged. Treat the user's theory seriously.
      *   *Structure:* Follow the prompt's sequence (Mapping -> Critique -> Comparison).
      *   *Specific Checks:* Did I correct any facts? The prompt says "spring 2025 a new plaque went on." This is future-dated relative to my training cut-off, but I must treat it as given fact for the exercise. (Self-correction: The prompt says "Facts as I remember them... correct me only if something load-bearing is wrong." The 2025 plaque is hypothetical/future in the prompt's timeline, but I should treat it as the scenario's ground truth). *Wait, checking knowledge:* As of early 2024, the M Shed display was permanent. The 2025 plinth plaque is a specific detail provided by the user for the thought experiment. I will treat it as factual within the context of the prompt.
      *   *Street Names:* Make sure to address the "doesn't look like anybody" point. CLI argues the *maintenance* is the key, not the likeness.
      *   *Critique:* Be sharp on the "justifies anything" risk.
