answer: |-
  This is a robust framework. "Commemorative Lock-in" (CLI) effectively treats monuments not as texts to be read, but as infrastructure to be maintained. It shifts the question from "What does this mean?" to "What does it cost to keep this here?"

  Here is the disciplined mapping of the Colston case through your three moving parts, followed by the critique and comparison you requested.

  ### Part 1: Mapping Colston through Commemorative Lock-in

  **1. The Stages of Authorization and Honor**

  *   **1895 (Erection):**
      *   *Authorizing Community:* The Society of Merchant Venturers and the civic elite of Bristol.
      *   *Act of Re-authorization:* The unveiling ceremony and the initial funding.
      *   *Location of Honor:* Strictly in the subject (Colston). The "record" function is minimal; the statue is a pure speech act: "Colston is virtuous."
      *   *CLI Analysis:* This is the "cheap one-time act." The lock-in begins here, but the bond is weak. It relies on future maintenance to solidify.

  *   **1977 (Grade II Listing):**
      *   *Authorizing Community:* The State (Department of the Environment).
      *   *Act of Re-authorization:* Bureaucratic designation.
      *   *Location of Honor:* Shifts slightly toward the *object itself* (architectural merit) and the *state's* desire to preserve heritage.
      *   *CLI Analysis:* This is a massive lock-in mechanism. It raises the cost of removal (legal/financial) significantly. It forces the local community to "pay" for the statue's presence through legal friction, inadvertently deepening the "record" that Bristol protects its history.

  *   **1990s–2018 (The Decay Phase):**
      *   *Authorizing Community:* Fractured. The Council attempts to hold the line; the Merchant Venturers defend; the public increasingly withdraws consent.
      *   *Act of Re-authorization:* Cleaning graffiti, policing the site, defending the inscription.
      *   *Location of Honor:* Decaying. As per CLI Premise 1, honor requires active upkeep. As the social cost of policing the statue rises (protests, bad press), the "honor" decays because the community is no longer willing to pay the maintenance cost willingly.
      *   *CLI Analysis:* The statue is no longer just about Colston; it is becoming a record of Bristol's reluctance to let go.

  *   **2018 (The Plaque Failure):**
      *   *The Event:* Council proposes a contextualizing plaque; wording fights bog it down.
      *   *CLI Explanation:* The plaque was an attempt to re-authorize the monument without incurring the cost of removal. It failed because the "maintenance cost" had become semantic and political. To write the plaque was to admit the original honor was flawed. The *activity* of agreeing on the text became too expensive. CLI predicts this: you cannot cheaply re-authorize a monument whose honor has decayed; the maintenance labor (negotiation) exceeds the value of the object.
      *   *Should it have been made to work?* CLI suggests no. Once the cost of maintenance (social friction) exceeds the benefit of the record, the lock-in creates pressure for rupture, not repair.

  *   **2020 (Toppling):**
      *   *Authorizing Community:* The Protesters (physical action) + The Jury (legal ratification).
      *   *Act of Withdrawal:* Defacement, toppling, immersion.
      *   *Location of Honor:* Transferred from Colston to the *act of removal*.
      *   *CLI Analysis:* This validates Premise 3 (Asymmetry). Removal was expensive, dramatic, and irreversible. Because it was so costly, it generated a new, stronger "record." The statue is now more famous for being pulled down than for being put up. The lock-in was not broken; it was *transferred* to the event of the toppling.

  *   **2021–2024 (M Shed Display):**
      *   *Authorizing Community:* Museum Curators + Council.
      *   *Act of Re-authorization:* Conservation, display, interpretation.
      *   *Location of Honor:* Ambiguous. Is the statue honored? No. Is the *protest* honored? Yes.
      *   *CLI Prediction:* This is a "de-honored object" that risks drifting back toward honor via *artifact status*. By cleaning it (even partially) and placing it in a climate-controlled case, the museum resumes the "maintenance" activity. CLI warns that *any* maintenance is a form of re-authorization. However, because the graffiti is retained, the maintenance is of the *damage*, not the *figure*. This sustains the "record of conflict" rather than the "record of virtue."

  *   **2025 (New Plinth Plaque):**
      *   *Authorizing Community:* Bristol City Council (post-acquittal).
      *   *Act of Re-authorization:* Inscribing the absence.
      *   *Location of Honor:* The empty plinth becomes a monument to the removal.
      *   *CLI Analysis:* This is the ultimate lock-in. The bronze is gone, but the *site* remains locked. The "record" is now fully about "us" (Bristolians who removed a slave trader). The duration (1895–2020) is the exhibit.

  **2. Street Names: Is your friend right?**

  Your friend argues street names are different because they lack likeness. CLI says they are the *same mechanism* but with different economics.
  *   **Maintenance:** Street signs require administrative maintenance (replacement when worn). This is low cost, making "removal" (renaming) technically cheaper than melting bronze.
  *   **Lock-in:** However, street names are *infrastructural*. They are embedded in postal addresses, deeds, and daily navigation. The "cost" of removal is higher in terms of systemic friction.
  *   **The "Record":** A street name accumulates duration just like a statue. "Colston Street" for 125 years records that Bristol tolerated the name for 125 years.
  *   **Verdict:** Your friend is wrong on ontology but right on visibility. A statue *looks* like an honor; a street name *functions* as one. CLI applies equally: renaming a street is an expensive, dramatic act of re-authorization that acknowledges the previous lock-in.

  ---

  ### Part 2: Pushing Back on the Theory

  You asked where CLI might be rationalizing rather than explaining. Here are the stress points.

  **1. Does the 125 years actually do work?**
  CLI Premise 2 claims the object becomes about *us* over time. But would the analysis change if Colston had been toppled in 1995 (100 years) vs. 2020 (125 years)?
  *   *Critique:* The theory risks fetishizing duration. If a statue of a dictator is put up in 2010 and toppled in 2020, CLI says the "record" is short. But the moral stakes might be identical to the 125-year case. CLI implies that older statues are *harder* to remove justifiably because the "record" is richer. This could be a conservative bias: it privileges the status quo by suggesting that long-standing injustices become more complex (and thus harder to undo) than recent ones. It might explain *why* we hesitate, but not *why we should*.

  **2. Is it too flexible? (The "Explains Everything" Problem)**
  *   *Keep it:* "The maintenance cost is low; the record of continuity is valuable."
  *   *Remove it:* "The maintenance cost (social friction) is too high; the record is now one of oppression."
  *   *Museum it:* "Re-authorization in a new context."
  *   *Critique:* CLI describes the *mechanics* of the decision but doesn't provide a normative guide. It explains why the plaque failed, but it can't tell you if the plaque *should* have succeeded. It creates a vocabulary of "costs" and "authorization" that can be wielded by either side. A preservationist uses CLI to say "Removing it erases the record of our past racism." A removalist uses CLI to say "Keeping it forces us to pay a moral maintenance cost we refuse to fund." If it justifies both, does it predict anything?
  *   *Prediction:* The only hard prediction CLI makes is that *neutrality is impossible*. Leaving it alone is an act of support. That is a strong claim, but it's a claim about the nature of the object, not the outcome.

  **3. Where does the theory go silent?**
  *   **Who Counts?** CLI relies on the "authorizing community." In Bristol, was it the Merchant Venturers (1895), the Council (2018), or the Jury (2022)? The theory has no mechanism for adjudicating between competing communities. It treats the Jury's acquittal as a withdrawal of authorization, but legally, the statute book didn't change. CLI conflates *social legitimacy* with *political authority*.
  *   **Criminal Damage:** You read the acquittal as the jury refusing to treat the statue as a protected interest. CLI agrees. But CLI goes silent on the *law*. If the theory says the statue's honor had decayed, does that constitute a legal defense? CLI is a theory of memory, not jurisprudence. It explains the *sentiment* of the acquittal, not the *verdict*.
  *   **Divergence:** What if the "living community" wants it down, but the "authorizing community" (state) keeps it up (e.g., via police protection)? CLI calls this "high maintenance cost." But it doesn't say when the system breaks. In Bristol, it broke at toppling. In other cities, it holds. CLI describes the tension but cannot predict the breaking point.

  ---

  ### Part 3: CLI vs. The Flat Present-Tense View (FPTV)

  **The Competitor:** FPTV argues that history is irrelevant. Only the message the object sends *today* matters. If Colston signals racism now, he goes. The 1895 intent and the 1977 listing are irrelevant context.

  **Which handles Colston better?**
  *   **FPTV** handles the *toppling* better. It provides a clear moral imperative: Bad message = Remove. It doesn't get bogged down in the "record of maintenance."
  *   **CLI** handles the *aftermath* better. FPTV struggles to explain why we keep the graffitied statue in a museum or why we leave the plinth empty. If the message is bad, why preserve the object at all? FPTV would likely prefer melting it down. CLI explains why we keep it: because the object is now a record of the *conflict*, which is valuable. CLI explains the *plaque on the empty plinth* perfectly (a record of the removal), whereas FPTV sees an empty plinth as a neutral space (which CLI correctly identifies as false).

  **The Separating Case:**
  To separate the two, we need a case where the *current message* is positive, but the *historical record* is toxic (or vice versa).

  *   **Case:** A statue of a local abolitionist, erected in 1900 by white supremacists to signal that "even our heroes agree segregation is fine," but whose historical work was genuinely anti-slavery.
  *   **FPTV:** Keep it. The subject is an abolitionist; the current message is "anti-slavery is good."
  *   **CLI:** Remove (or re-contextualize heavily). The "record" of the monument is not the abolitionist, but the 1900 white supremacist intent and the 120 years of maintenance by a segregated city. The *duration* reveals the object is actually a monument to white supremacy using an abolitionist as a shield.
  *   **Why this separates them:** FPTV looks at the face of the statue. CLI looks at the ledger of maintenance. If the "authorizing community" in 1900 was the KKK, and the "maintenance" was enforced by Jim Crow laws, CLI says the honor belongs to the KKK, not the abolitionist, regardless of who is depicted.

  **Conclusion on your Theory:**
  Commemorative Lock-in is not just a way of winning arguments; it is a materialist correction to idealist memory studies. It correctly identifies that memory is labor. Its weakness is normative silence (it tells you what is happening, not what is right), but its strength is exposing the myth of the "neutral default." In the Colston case, it explains why the middle path (the plaque) failed: you cannot compromise on labor costs when the honor itself is the dispute. It predicts that the M Shed statue will never be "just a statue" again; it is permanently locked in as an artifact of the 2020 rupture.
