      *   **Requirements:** Evaluate if the circularity is vicious, benign, or non-existent. Evaluate alternative routes (envariance, typicality, self-locating uncertainty). Reach a definitive verdict (commit to a side). Do not end on "it's an open question."

  2.  **Deconstruct the Arguments:**
