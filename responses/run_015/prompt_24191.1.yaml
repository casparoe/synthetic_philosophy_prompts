      *   **The Friend's Position (Everettian):** The DT derivation works. It shows that a rational agent in an Everettian multiverse *must* act as if the Born rule holds. It derives probability from decision theory + unitary QM, without presupposing probabilistic outcomes.
      *   **The Core Philosophical Issue:** The "Incoherence Problem" (how can there be uncertainty if everything happens?) vs. The "Quantitative Problem" (why Born rule and not equal weights?). The DT approach tries to solve the Quantitative Problem assuming the Incoherence Problem is dissolved by self-locating uncertainty or functionalism.
      *   **Circularity Charge:** Does the "Equivalence Lemma" or "Diachronic Consistency" axiom smuggle in probabilistic assumptions?
