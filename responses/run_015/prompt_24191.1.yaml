  3.  **Evaluate the Alternatives:**
      *   **Envariance (Zurek):** Relies on symmetry of entangled states. Critique: Still needs a link between symmetry and ignorance/probability (principle of indifference).
      *   **Self-Locating Uncertainty (Sebens/Carroll):** Focuses on the moment between branching and observer registration. Critique: Still needs to justify why uncertainty maps to amplitude squared (counting worlds vs. weighting them).
