      *   *Wait, a stronger verdict:* I will argue the Friend is **wrong** that it is "solved." The derivation shifts the burden from "why probability?" to "why these axioms?" and the answer to the latter relies on the former. The circularity is vicious enough to prevent the derivation from counting as a fundamental justification.

