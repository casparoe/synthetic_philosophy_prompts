  **Version I: The Public Offer**

  Major Trapp stands before the sixty men in the clearing, his voice flat against the pine trees. He explains the task. He offers the step back. Silence stretches, thick as smoke. Peters shifts his weight, looks at Kohn, looks at his boots. Ten men step out. They are the old, the limp, the ones who never drink with the unit. Trapp nods. The remaining fifty form the firing line.

  By noon, the schnapps crates are open. Miller pours a heavy measure for Schulz, who missed his first shot. Laughter rings out, too loud, directed at the woods. Peters lights a cigarette with shaking hands, offers one to Kohn. Kohn refuses, stares at the pile of coats behind the trees. They drink to steady the aim, to warm the hands, to fill the silence between volleys. When the trucks load for home, bottles pass along the bench. No one looks at the canvas covering the rear. Peters sings a song from Hamburg, off-key. He does not look at the ten men riding in the cab.

  **Version II: The Private Offer**

  The envelope arrives at barracks night. Official seal, no return address, instructions inside: leave it on the bunk if unused. Morning roll call in the clearing shows twenty-five empty spaces. Peters is among them; his rifle leans against the tree where he stood yesterday. Major Trapp reads the order to the remaining thirty-five. No one steps out now; the exit was yesterday.

  The firing line is tight, efficient. No schnapps crates are opened. Miller checks his bolt without speaking. Schulz fires, resets, fires again. There is no laughter, no singing, no cigarettes shared. The work is done by one o'clock. They load the trucks in silence. Peters' bunk is stripped clean; his name is checked off on a rear-area roster nobody sees. In the truck, Kohn studies his boots. Miller sleeps. There are no bottles on the bench. The engine starts. The woods remain behind them, undisturbed by song.

  ***

  **Demonstration and Analysis**

  **Mechanisms and Predictions**
  The discriminating variable is the **publicity of the exit**.
  *   **Browning (Situational):** Predicts a low opt-out in Version I (peer pressure/shame) and a significantly higher opt-out in Version II (pressure removed). It predicts the texture of killing shifts from performative bravado (alcohol, singing) to grim efficiency when the audience is removed.
  *   **Goldhagen (Ideological):** Predicts low opt-out in both versions (ideology drives participation, not pressure). It predicts enthusiastic or dutiful killing in both, regardless of anonymity.

  **The Observables**
  1.  **Proportion:** Version I shows ~16% (10/60); Version II shows ~42% (25/60). This divergence supports Browning; Goldhagen expects consistency.
  2.  **Who:** Peters stays in Version I but leaves in Version II. This identifies the "reluctant conformist" rather than the "ideological holdout." In Version I, only the socially marginal (limp, old) leave. In Version II, integrated men like Peters leave.
  3.  **Texture:** Version I requires alcohol and noise to sustain the act (masking distress). Version II requires neither (distress removed via exit, or remaining men are truly willing/numb). The absence of bottles in Version II suggests the drinking in Version I was a coping mechanism for coercion, not celebration.

  **The Discriminating Feature**
  The **anonymity** of the exit is the lever. If the sealed offer is "leaky"—if men suspect comrades will know who opted out—peer pressure re-engages. Version II collapses into Version I; both accounts predict low opt-outs again. The experiment relies on the certainty of secrecy to isolate situational pressure from internal will.

  **The Attack**
  A Goldhagen defender would argue **complicity equivalence**: The men in Version II who took the envelope still guarded the victims or drove the trucks. Taking the exit is not moral refusal but task specialization. They remain "willing executioners" within the broader system. Furthermore, the remaining thirty-five in Version II killed without alcohol; a Browning defender might argue this shows *more* ideological commitment among the remainder, complicating the "reluctance" narrative.

  **Verdict**
  A novelist cannot settle the historical debate. History relies on aggregate data and testimony; fiction relies on constructed coherence. By writing Version II with higher opt-outs, I have *chosen* Browning's world, not proven it. However, the scene achieves something history cannot: it makes the reader *feel* the weight of the envelope. It transforms the abstract "situational pressure" into a tangible object that changes the afternoon. The reader closes the page knowing which account the novel inhabits, not because the argument was won, but because the silence in the second truck feels different than the singing in the first. The scene does not prove the truth; it dramatizes the cost of the variable.
