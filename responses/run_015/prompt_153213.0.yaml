answer: |-
  You have stumbled onto the central problem of sociological causal inference: distinguishing between **values as engines** (genuine causes) and **values as exhaust** (epiphenomenal rationalizations). Your intuition is sharp, particularly the tension between Case 5 (conversion) and your "small scale" heuristic.

  To resolve this, we need a principle that aligns with Weber's specific methodology in *The Protestant Ethic*, rather than a generic "ideas matter" stance. Weber's famous metaphor is the **Switchman**:

  > *"Not ideas, but material and ideal interests, directly govern men's conduct. Yet very frequently the 'world images' that have been created by 'ideas' have, like switchmen, determined the tracks along which action has been pushed by the dynamic of interest."*

  Using this, here is the precise principle that saves Cases 1, 3, and 5 while dumping 2 and 4.

  ### The Principle: Non-Redundant Directionality

  A cultural value is a genuine cause if and only if it **selects a specific behavioral track that material interests or structural incentives would not have selected on their own.**

  To pass the test, the explanation must satisfy two conditions:
  1.  **The Counterfactual Deviation:** If you remove the value but keep the material/structural conditions constant, the specific outcome disappears or changes direction. (The value is not redundant).
  2.  **The Costly Constraint:** The value imposes a constraint or cost (forgone consumption, risk of death, social disruption) that contradicts a default material or habitual incentive.

  ---

  ### Applying the Principle to Your Cases

  **Case 1: Puritan Merchants (Verdict: YES)**
  *   **Interests:** Wealth accumulation + Social status.
  *   **Default Track:** Consume wealth to signal status (standard aristocratic/merchant behavior).
  *   **Value Track:** Reinvest wealth; forbid luxury.
  *   **Analysis:** The value *switches the track* from consumption to accumulation. It imposes a cost (forgone luxury). Without the ascetic value, the capital accumulation dynamic breaks.
  *   **Result:** Passes Non-Redundant Directionality.

  **Case 2: Japanese Manufacturing (Verdict: NO)**
  *   **Interests:** Profit + Market share.
  *   **Default Track:** Improve quality to reduce waste and increase sales.
  *   **Value Track:** "Quality Culture."
  *   **Analysis:** The value aligns perfectly with the material incentive. You do not need "culture" to explain why a firm seeks profit-maximizing efficiency. The cultural label is a post-hoc description of rational incentive structures.
  *   **Result:** Fails (Redundant).

  **Case 3: Aristocratic Dueling (Verdict: YES)**
  *   **Interests:** Survival + Physical safety.
  *   **Default Track:** Avoid lethal violence.
  *   **Value Track:** Risk death to maintain honor.
  *   **Analysis:** The value overrides the strongest material interest (survival). It selects a track (fighting) that is materially irrational.
  *   **Result:** Passes Non-Redundant Directionality.

  **Case 4: Nordic Welfare State (Verdict: NO)**
  *   **Interests:** Labor security + Political power.
  *   **Default Track:** Unions bargain for security/benefits.
  *   **Value Track:** "Egalitarianism."
  *   **Analysis:** Per your intuition, the institutions were built by labor coalitions (interests). The egalitarian norm rationalized the outcome *after* the track was laid by political machinery. If the culture was less egalitarian but unions were equally strong, the welfare state likely still emerges (just framed differently).
  *   **Result:** Fails (Epiphenomenal/Ex Post).

  **Case 5: Religious Conversion (Verdict: YES)**
  *   **Interests:** Social stability + Family continuity.
  *   **Default Track:** Maintain existing property/kinship rules.
  *   **Value Track:** Reorganize property/family to fit doctrine.
  *   **Analysis:** This is where your "small scale" heuristic broke. Scale is irrelevant; *track selection* is key. Conversion imposes high transaction costs (breaking kinship ties, redistributing property) that structural inertia would resist. The value provides the energy to overcome the inertia and selects a new institutional track.
  *   **Result:** Passes Non-Redundant Directionality.

  ### Resolving Your Conflict
  You thought Case 5 broke the pattern because it involves large-scale institutional change. But under the **Non-Redundant Directionality** principle, Case 5 fits perfectly with 1 and 3. In all three, the value forces a deviation from a material or habitual baseline that incurs a cost (forgone luxury, risk of death, social disruption).

  Case 2 and 4 fail because the "cultural" explanation is redundant; standard interest-based models predict the same outcome without invoking values.

  ---

  ### Prediction: Corporate "Psychological Safety"

  **The Scenario:** Management introduces "psychological safety" norms; team metrics (innovation/speed) improve.
  **The Question:** Is this values causing change, or management technique in cultural clothing?

  **Applying the Principle:**
  1.  **Identify the Default Track:** In most corporations, the material incentive is self-protection. If I speak up and fail, I risk my bonus/reputation. The default track is **silence**.
  2.  **Identify the Intervention:** Management introduces "psychological safety."
  3.  **The Test:** Did the *value* change the track, or did the *sanction structure* change the track?

  **Prediction:**
  It is almost always **management technique in cultural clothing (NO)**, unless specific evidence of costly signaling exists.

  **Why?**
  *   **If metrics shifted because incentives changed:** If management stopped punishing failure (changing the material payoff), then "psychological safety" is just a label for a new incentive structure. This is Case 2 (Japanese Manufacturing). The value is redundant; the payoff matrix did the work.
  *   **If metrics shifted because values changed:** For this to be genuine culture (Case 1/3/5), an employee must speak up about a risk *even when* there is still a risk to their career, solely because the norm dictates honesty over self-protection.

  **Verdict:**
  In 90% of corporate initiatives, "culture" is used to describe a change in **sanctions** (incentives) while pretending it is a change in **values**. If the "culture" program does not involve leaders taking personal costs (e.g., a VP admitting a costly mistake publicly and *not* being fired), it is not a genuine cultural cause. It is branding for a policy change.

  **Final Advice:**
  Stick to the **Switchman Test**. Don't ask "Did values exist?" Ask "Did values select a track that interests would have missed?" If the answer is yes, you have a genuine cultural cause. If the answer is no, you have a just-so story.
