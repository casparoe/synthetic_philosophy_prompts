answer: |-
  The hallway mirror was old, the silvering eaten away at the edges like frost on a windowpane, but the center held true. Elena stood before it, adjusting the strap of her silk dress. The light from the sconce was amber, forgiving. She tilted her head, watching the woman in the glass tilt hers in perfect sympathy. There was a softness there, a luminous ease in the set of her shoulders that she interpreted as kindness. It was the look of a woman who had nothing to fear from the evening, a warmth that radiated from the throat outward. She practiced a smile, and the reflection smiled back, not with the baring of teeth, but with a gentle invitation. She believed she was looking at her own nature, captured in mercury and glass. She did not see that the softness was the absence of tension, and the tension was absent only because the world outside this hallway had been arranged to accommodate her weight.

  The bell rang. Julian stood on the threshold, shaking rain from a wool coat that held its shape even when wet. He stepped into the light of the foyer, and Elena felt her vision sharpen. It was a physical sensation, like the aperture of a camera widening. The lines of his jaw were distinct, etched with a clarity that suggested intellect and resolve. When he spoke, apologizing for the damp, she saw the movement of his lips as precise, deliberate. The watch on his wrist was understated, the leather strap supple, and she perceived this not as expense, but as a quiet discipline. He hung his coat, and the way he handled the hanger—economical, respectful of the garment—confirmed for her that he belonged to the architecture of the room. She saw him in high definition, every thread and contour rendered with a vividness that felt like objective truth. They were two clear things recognizing each other in the amber light.

  But the figs had been an oversight. The bowl on the sideboard was empty, a gap in the evening's logic. Elena insisted on walking to the corner stand, refusing Julian's offer to fetch them. She needed the air, she said.

  The street was slick with rain, reflecting the sodium glare of the streetlamps. The vendor stood beneath a canvas awning that snapped in the wind. He was older, his skin mapped with deep grooves that the light did not soften but rather hardened into shadow. Elena approached, and the world lost its resolution. The stall was a clutter of crates and bruised cardboard. When the vendor looked up, his eyes were dark and difficult to read, submerged in the sockets. She saw his posture as a slump, a heaviness in the spine that she translated as weariness, or perhaps a lack of care. He held out a basket of figs. They were dark purple, splitting at the seams.

  "Sweet tonight," he said. His voice was rough, gravel over pavement.

  Elena reached for the fruit. As her hand entered his space, she saw his fingers. They were stained with the juice of the labor, the nails thick. She perceived a distance between her clean, pale hand and his dark, textured one that felt like geography. She selected three figs, handling them as if they might break, though they were firm. She handed him a bill. He took it, his movement slow. To Elena, the slowness felt like a lag in processing, a cognitive delay. She did not see the arthritis in the knuckles, only the hesitation. She saw the transaction as a charity of attention, her gaze passing over him like a beam of light that illuminates objects but does not warm them. She took the bag and turned away, the plastic crinkling loudly in the damp air. She felt the solidity of the figs in her palm, real and heavy, while the man behind her seemed to fade back into the texture of the wall, part of the scenery of the city's night.

  She walked back toward the building, the rain having stopped. Passing a darkened shop window, she caught her reflection again. This time, there was no amber sconce, only the cold streetlight and the ghost of her own image superimposed over the mannequins inside.

  She stopped.

  In the glass, she saw herself holding the bag of figs. She saw the slight lift of her chin, the way her eyes scanned the street ahead, filtering the noise, selecting the safe path. And then, in the reflection's eye, she saw the vendor. He was there, not as a memory, but as an afterimage burned into the pupil.

  She looked at the fig in her hand. A drop of purple juice had leaked from the stem, staining her fingertip. It was a small wound. She looked back at the window. The woman in the glass was no longer soft. The warmth she had seen in the hallway mirror was gone, replaced by a hard, polished surface. She realized that the sharpness of Julian's jaw and the blur of the vendor's spine were not properties of the men, but properties of her looking. The lens had adjusted without her permission, focusing on the familiar and defocusing on the strange, mistaking privilege for clarity.

  Elena stood on the sidewalk, the city moving around her. She raised her hand to the glass, matching her reflection's palm. For the first time, she did not look *through* her eyes to see the world. She looked *at* her eyes, and saw they were not windows. They were gates, and she had been the gatekeeper all along, deciding what was real by deciding what was worthy of focus. The stain on her finger felt suddenly heavy, an anchor dropping into deep water, pulling her down into the silence of her own unexamined sight.
