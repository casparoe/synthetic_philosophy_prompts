answer: |-
  This is a splendid analogy. As a physicist, you have an intuitive grasp of quasiparticles that most metaphysicians lack: you know that "real" in physics often means "behaves dynamically within a structured background," not "fundamental constituent of the vacuum."

  Your friend's claim is a version of the **Intuition of Inertness**: the idea that "nothing" cannot do "something." Your hole analogy is the correct rebuttal from the philosophy of science side. However, like any mapping between physical and normative domains, it leaks.

  Here is the audit.

  ### 1. The Mapping

  To see where the stress points are, we need to be precise about the isomorphism.

  | Solid State Physics | Metaphysics / Morality |
  | :--- | :--- |
  | **The Lattice + Fermi Sea** | **The Normative/Counterfactual Background.** The set of expectations, biological needs, or standard procedures (e.g., "plants need water," "neighbors promise to water"). |
  | **The Electron** | **The Commission (Action).** The positive presence of an event (pouring water). |
  | **The Hole** | **The Omission (Inaction).** The absence of an expected event (not pouring water). |
  | **Effective Mass / Charge** | **Causal Potency / Moral Weight.** The capacity of the omission to produce downstream effects (plant death) and bear responsibility. |
  | **Drift / Current** | **The Causal Process.** The sequence of events leading to the outcome (wilting $\to$ death). |
  | **Recombination** | **Intervention.** An action filling the omission (arriving to water just in time), annihilating the "hole" of neglect. |

  ### 2. Auditing Your Two Worries

  **Worry 1: Background Dependence (Norms vs. Lattice)**
  *Your worry:* A hole only has effective mass because of the lattice. Does this mean omissions only cause because of norms?
  *Verdict:* **Correct, but this helps you more than it hurts you.**
  In physics, a hole in a vacuum is nothing. A hole in a valence band is a dynamical object. This confirms your suspicion: omissions are not *intrinsic* causal powers; they are *relational* causal powers.
  However, your friend argues that letting die *cannot* be causing. The hole shows that "absence" *can* be a causal relata, provided there is a structure (the lattice/norms) that gives the absence traction.
  *The Catch:* Your friend might concede the point but pivot. They might say, "Exactly! Holes are only causal relative to a convention of measurement. Therefore, omission-causation is only causal relative to a convention of morality. It is not *metaphysically brute* causation."
  *Counter:* In physics, we don't say hole-current is "less real" than electron-current because it depends on the lattice. Both are real features of the system. If the lattice is the world's normative structure, then omission-causation is as real as commission-causation within that world.

  **Worry 2: Realism vs. Bookkeeping**
  *Your worry:* Is the hole just a calculational trick?
  *Verdict:* **Instrumentalism applies to both.**
  If you are an instrumentalist about holes (they are just convenient ways to track the motion of $10^{23}$ other electrons), then the analogy implies omissions are just convenient ways to track the complex web of counterfactuals.
  If you are a realist about quasiparticles (holes scatter, interact, and carry energy), then you can be a realist about omissions.
  *The Payoff:* Most modern metaphysicians of causation (e.g., Schaffer, Beebee) argue that causation is contrastive or counterfactual, not just "billiard ball" transfer. The hole analogy supports the **Counterfactual Theory of Causation**. The hole exists because *if* an electron were there, the current would be different. The omission exists because *if* you had watered, the plant would live. The ontology matches.

  ### 3. The Moral Conclusion: Killing vs. Letting Die

  This is the critical failure point of the analogy, though not for the reason you might think.

  **What the analogy proves:**
  It successfully refutes the claim: *"Omissions cannot be causes because they are absences."*
  Just as a hole can carry current, an omission can carry causal responsibility. The metaphysical ground is removed from under your friend's feet.

  **What the analogy does NOT prove:**
  It does not prove that *Killing* (Electron) and *Letting Die* (Hole) are **morally equivalent**.
  In a semiconductor, electron current and hole current are distinct.
  1.  **Mobility:** Electrons usually have higher mobility than holes ($\mu_n > \mu_p$). They respond differently to the same field.
  2.  **Recombination:** When they meet, they annihilate. They are not the same substance.

  **The Metaphysical Distinction:**
  Even if both are causal, they may be different *modes* of causation.
  *   **Killing:** Injecting an electron into the conduction band (adding energy/agency).
  *   **Letting Die:** Allowing a hole to drift (removing maintenance of the status quo).

  In device physics, we treat them differently. We dope n-type to favor electrons, p-type to favor holes. We acknowledge both are carriers, but we engineer them differently.
  Similarly, in morality, we might acknowledge both cause death, but assign different weights based on **agency intrusion**.
  *   *Killing* requires active energy input to overcome the barrier of "non-interference."
  *   *Letting Die* relies on the background entropy (the plant's natural tendency to dry out).

  **Conclusion on the Moral Point:**
  The analogy saves the **causal** status of letting die, but it does not necessarily collapse the **moral** distinction. Your friend can retreat to: "Okay, both are causes. But one is an active injection of harm, the other is a failure to prevent entropy. The moral difference lies in the *mode* of causation, not the *existence* of causation."

  ### 4. Is there a better analogy?

  The hole analogy is excellent for **ontology** (what exists). But for **moral symmetry**, you might consider **Negative Feedback Loops** or **Potential Wells**.

  However, the strongest alternative is actually **Conservation Laws**.

  **The Conservation Analogy:**
  In physics, we often analyze systems by what is *conserved* vs. what is *dissipated*.
  *   **Killing:** Adding energy to a system to drive it over a barrier (activation energy) into a state of death.
  *   **Letting Die:** Removing the energy source that was holding the system away from equilibrium (death).

  In both cases, the system ends up in the lower energy state (death).
  *   Case A: I push the ball off the cliff.
  *   Case B: I stop holding the ball on the cliff.

  In both cases, gravity (the background field, like the lattice) does the work. In Case A, I added a perturbation. In Case B, I removed a constraint.
  **Why this is better:** It highlights that in both cases, the *background forces* (biology/gravity) are the immediate physical cause of death. The human agent is either a **perturber** (killer) or a **constraint-remover** (letter-die).
  This grants your point: both are causal interventions on the system's boundary conditions.
  But it also grants your friend's point: perturbing a system and removing a constraint are physically distinct operations, which might ground a moral distinction even if both are causal.

  ### Summary Advice for the Argument

  1.  **Use the Hole Analogy to kill the "No Causation" claim.** It is devastating against the idea that "nothing cannot do something." It shows that in our best physical theories, absences are dynamical actors.
  2.  **Concede the "Mode" distinction.** Don't try to prove killing and letting die are *identical*. Prove they are *symmetrical* in terms of causal potency.
  3.  **Highlight the Lattice.** Emphasize that the "Lattice" (the normative expectation/biological need) is what gives the hole its mass. Without the neighbor's request (the lattice), your inaction is just a vacuum (no hole, no current). This explains *why* we don't blame everyone for every death (there is no lattice/norm everywhere), without denying that omissions cause.

  Your intuition is sound. The hole is a quasiparticle; the omission is a quasi-event. Both are real enough to do work.
