prompt: |-
  Design a rescue case in which a Taurek-style no-numbers view — each person's claim on you is equally strong, and the mere fact that five people would be benefited rather than one gives the five no stronger claim — nonetheless requires saving the five rather than the one.

  Purpose and anti-cheating conditions: I want the case for a seminar on whether the no-numbers position has any non-numerical route to the greater number; my suspicion is that every apparent route either counts people or quietly changes the subject. So the requirement must not arise from: summing lives or welfare; greater need, worse fate, or longer expected life on the five's side; any special relationship, promise, role, or institutional duty; downstream effects on third parties; the one person's consent, waiver, or unsavability; or uncertainty about how many are on each side. It should also stay a pure aid case: whoever you fail to save dies of the peril they were already in, and you neither kill, take from, nor worsen anyone relative to your never having arrived. Otherwise keep it realistic — a hospital, a fire ground, a rescue service — six people at most, one paragraph.

  Then: (i) why a numbers-counting view requires saving the five in your case; (ii) a step-by-step derivation of the no-numbers verdict, naming the mechanism that does the work; (iii) the minimal variant of the case with that mechanism removed, showing the no-numbers view reverting to the coin flip while the numbers view does not move; (iv) the strongest objection available to a no-numbers theorist — consider both that the mechanism is aggregation under another name and that the case has stopped being a case about whom to aid. If you think the constraints cannot be jointly met, say so and give the best case you can build with exactly one constraint relaxed.

  Keep the scenario itself under 100 words and the whole reply under 500. Close with one sentence on how confident you are that the case satisfies the constraints without counting people, and one sentence naming the claim you are least confident in.
