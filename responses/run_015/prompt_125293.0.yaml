  (iii) Variant: Remove "Minimize Violations." No-numbers view sees balanced claims, requires a coin flip. Numbers view still sums lives, requires saving five.
  (iv) Objection: This mechanism aggregates claims across persons, violating the separateness of persons. It counts people indirectly by counting their claims, effectively conceding the numbers view while pretending otherwise.

  I contend the constraints cannot be jointly met. A requirement to save the five without aggregating value or claims contradicts the core no-numbers axiom. I relax the constraint against aggregation disguised as claim-counting.

