answer: |-
  Here are three rules that reconstruct your editor's scoring logic, followed by their application to AMR, an assessment of his weighting, and a stress-test case.

  ### The Rules

  **1. The Hard Expiry Rule (The "Fusion/Ehrlich" Principle)**
  If a prediction specifies a quantitative threshold or a date, and that date passes without the threshold being met, the prediction is **Falsified**. Re-dating the goalpost is not a rescue; "right about the direction" is not a rescue.
  *   *Fits:* Fusion (expired deadlines), Ehrlich (1970s famines), Peak Oil 2000s (2005–2010 peak).
  *   *Exception:* Does not apply if the "miss" was caused by a direct intervention triggered by the prediction itself (see Rule 3).

  **2. The Constraint Type Rule (The "Hubbert/Malthus" Principle)**
  Predictions based on **fixed physical stocks** are valid; predictions based on **growth-rate ratios** subject to human innovation are suspect. If the bottleneck is geological (oil in the ground), the prediction holds. If the bottleneck is a race between consumption and ingenuity (food vs. population, drugs vs. bugs), the prediction is discounted as a "Malthusian Error" unless innovation is physically impossible.
  *   *Fits:* Hubbert (US Oil = Right), Malthus/Ehrlich/World Peak Oil (Falsified by tech/substitution), Jevons (Split: exhaustion falsified, rebound right).

  **3. The Causality Credit Rule (The "Ozone/Limits" Principle)**
  You only get credit for a avoided catastrophe if the **mechanism was proven** and the **avoidance was a direct policy response** to the prediction (**Self-Defeating**). If the data still tracks the original model's curve, it is **Right-but-Early**. If the avoidance was due to external technological luck unrelated to the warning, it is **Falsified**.
  *   *Fits:* Molina/Rowland (Self-Defeating: mechanism proven, treaty signed), Limits to Growth (Right-but-Early: data still tracks the BaU curve), Ehrlich (Falsified: Green Revolution was not a direct policy response to *The Population Bomb* in time to count).

  ---

  ### Application to Antimicrobial Resistance (AMR)

  **The Prediction:** 10 million deaths/year by 2050 (mid-2010s origin).
  **The Current State:** ~1.27 million deaths/year (2019 data). Requires ~8x acceleration.

  *   **Rule 1 (Hard Expiry):** The window is open (2050). Strictly speaking, this is **Unratable/Pending**.
      *   *The Problem:* You noted your editor has "no box" for this. If forced to score now, he treats the *current trajectory* as the test. Since we are not on track for 10m without massive acceleration, he may treat the *implied* exponential curve as a falsifiable claim that is already bending wrong.
  *   **Rule 2 (Constraint Type):** This is a **Malthusian Ratio** (bugs evolving vs. drugs discovered). It is structurally identical to Malthus and Ehrlich.
      *   *Prediction:* **Falsified.** He will likely argue that mRNA vaccines, phage therapy, CRISPR, or rapid diagnostics are the "Green Revolution" equivalent that will flatten the curve, just as shale flattened Peak Oil.
  *   **Rule 3 (Causality Credit):** The 10m figure (O'Neill Report, 2016) spurred global stewardship and funding.
      *   *Prediction:* **Ambiguous.** If deaths stay low, is it *Self-Defeating* (like Ozone) or *Falsified* (like Ehrlich)? This depends on whether he believes the stewardship is sufficient to break the mechanism, or if the mechanism was exaggerated to begin with.

  ### Which Rule Is He Really Running?

  He is running **Rule 2 (Constraint Type)**, weighted heavily against Rule 1.

  Why? Because he dismisses Ehrlich as "Falsified" despite the window technically being open for "eventual collapse," and he dismisses Fusion despite it being a "physical constraint" problem, because the *deadline* expired. But the strongest signal is his annoyance at "right about the pressure." He hates ratio arguments. He likes Hubbert because oil is a fixed tank. He dislikes Malthus/Ehrlich because "food" and "drugs" are variable flows.

  **The AMR Verdict:** He will likely call AMR **Falsified** now, not in 2050. He will argue that the "10m by 2050" claim relies on a static view of drug discovery (arithmetic) vs. resistance (geometric) that ignores the "escape valves" (new tech) already in the pipeline, exactly like the 2000s Peak Oil crowd ignored shale. He will view the "window open" defense as a "re-dating" trick similar to Fusion.

  **Where They Come Apart:**
  The conflict arises if AMR deaths *do* accelerate to 10m.
  *   **Rule 1** says: "See? We just had to wait."
  *   **Rule 2** says: "If that happens, it's only because Rule 2 was wrong about human ingenuity, but the prediction was still Malthusian."
  *   **Rule 3** says: "If we prevent it, do we give the warners credit?"

  ### The Stress Test Case

  You suggested the Green Revolution (was it a response to alarm?). That is historically messy; Borlaug was working on dwarf wheat before Ehrlich wrote his book, making causality hard to prove.

  **My Pick: The 2014 CDC Ebola Model.**

  **The Case:** In September 2014, the CDC modeled the West Africa Ebola outbreak. They projected **1.4 million cases by January 2015** "if no significant changes in control efforts or population behavior occur."
  **The Outcome:** The outbreak was contained with ~28,000 cases.
  **The Window:** Closed.
  **The Mechanism:** Biological transmission (fixed) vs. Public Health Intervention (variable).

  **Why this forces the disagreement:**
  1.  **It mirrors AMR perfectly:** A scary exponential growth model, a specific deadline, and a massive intervention triggered by the warning.
  2.  **It isolates Rule 3 (Causality):**
      *   If he calls this **Self-Defeating (Success)**, then he must admit that *warnings that trigger action* count as hits. This would force him to reconsider Ehrlich (did the Green Revolution count as a response?) and potentially AMR (if stewardship works, the warners were right).
      *   If he calls this **Falsified (Failure)**, because the number 1.4m was wrong, then he admits that *prevention counts as falsification*. This destroys the "Self-Defeating" category for Ozone (we banned CFCs, so the hole didn't get as big as it would have—was that a falsification or a rescue?).
  3.  **It solves the "Window" problem:** The window is closed. He *must* score it.

  **The Trap:**
  If he scores Ebola as **Falsified**, he undermines his "Self-Defeating" badge for Ozone. (Ozone didn't kill everyone because we banned CFCs; Ebola didn't kill 1.4m because we sent aid. Why is one a rescue and the other a miss?)
  If he scores Ebola as **Self-Defeating**, he undermines his "Falsified" verdict for Ehrlich. (Ehrlich said "famine"; we sent aid/tech; famine didn't happen. Why is Ehrlich a miss and Ebola a hit?)

  This case forces him to define exactly how much "work" counts as a rescue, and whether a prediction is a *forecast of the future* or a *threat to motivate action*. That is the core tension in his spreadsheet.
