  You've constructed a neat trap, and I shall not pretend the dogmatist I was in 1936 didn't walk into it himself. I concede the point: the strong verification principle was a blunder, too rigid to do the work I demanded of it. To call survival "nonsensical" was excessive; it is perfectly intelligible, merely unsupported. If your archivist were to appear—if a voice from the grave recited sealed letters with verifiable accuracy—I should be obliged to accept that as evidence. I was wrong to suggest such evidence was impossible in principle. My error was epistemological, not metaphysical. I treated a lack of evidence as a logical impossibility.

  But do not think this surrenders the fortress. You ask why I spent half a century not examining the evidence? I examined it. Mediums, visions, near-death experiences—they are a catalogue of fraud and pathology. My own encounter with a divine being during my clinical death was vivid, yes, and it slightly weakened my conviction that oblivion awaits, but a hallucination is not a ticket to eternity. I require more than a flash behind closed eyelids. As for personhood, I hold no metaphysical thesis that a man *must* be his body. I hold only that our evidence for persons is bodily behavior. When that stops, the burden of proof lies heavily on the claimant. The principle was a failed tool for clearing rubbish, not a turnstile for my prejudices. There is still no evidence, and until there is, I shall continue to hope that death is the end, and act as though it is.
