      *   **Task 1 (Mapping):** Identify actors/actions, actual outcomes, and predictions of each model.
      *   **Task 2 (Evaluation):** What does karma explain/miss? Is systemic collapse "institutional karma"? Do bonuses/bailouts break the desert link?
      *   **Task 3 (Meta-Analysis):** What does this show about the theory? Does it need supernatural enforcement? Is structural karma ad hoc? Does it require institutional embedding?
      *   **Constraint:** Treat models fairly, be explicit about silence/limitations, avoid forcing the theory.

  2.  **Task 1: Mapping the Episode:**

      *   *Actors/Actions:*
          *   Originators (lenders): Predatory lending, NINJA loans.
          *   Investment Banks (Lehman, Bear Stearns, Goldman, etc.): Packaging MBS/CDOs, leverage, betting against own products (e.g., Abacus).
          *   Rating Agencies (Moody's, S&P): Inflated ratings for fees.
