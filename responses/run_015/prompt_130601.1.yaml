      *   *Outcomes:*
          *   Market Collapse (2008).
          *   Taxpayer Bailouts (TARP).
          *   Executives: Retained bonuses, no prison time, reputational hits but financial resilience.
          *   Public: Foreclosures, unemployment, austerity.
      *   *Model Predictions:*
          *   *Individual:* Executives *should* have lost wealth/freedom proportional to harm.
          *   *Structural:* The system *should* correct/punish the behavior, even if via collapse that hurts innocents too.

  3.  **Task 2: Evaluating the Lens (Explain/Miss):**

      *   *Institutional Karma:* The market collapse *looks* like structural feedback. The system ate itself. However, it was indiscriminate (hurt the innocent).
      *   *The Bonus/Prosecution Problem:* This is the biggest friction point for *Individual* karma. If moral desert requires matching outcomes, the fact that CEOs kept millions while millions lost homes suggests a "karmic deficit."
      *   *Socialization of Losses:* Bailouts sever the link between risk-taker and consequence. This creates "moral hazard," which is essentially "karmic insulation."
      *   *Does it break the theory?* If karma is descriptive (it *happens*), the GFC falsifies individual karma. If karma is normative (it *ought to happen*), the GFC highlights a failure of human institutions to enact it.

  4.  **Task 3: Meta-Analysis of the Theory:**

      *   *Supernatural Enforcement?* If we expect individual karma in a naturalistic world, we need a mechanism. Without gods/reincarnation, individual karma looks like a wish.
      *   *Structural Karma:* Is it legitimate or ad hoc? It risks becoming tautological ("the system reacted" = karma). But it aligns with systems theory. It saves the concept from falsification but dilutes the "justice" aspect (since innocents suffer).
      *   *Institutional Embedding:* The case suggests moral desert doesn't happen automatically. It requires *political will* and *legal architecture*. Karma as a standalone metaphysical law fails; Karma as a demand for institutional justice succeeds.

  5.  **Drafting - Section by Section:**

