answer: |-
  ### Job Talk Q&A Prep Sheet: Counterfactual Stability Profiles

  #### I. Brainstorming: Top Objections by Hiring Damage
  *Ordered from most damaging (threatens core metaphysical competence) to least.*

  1.  **Grounding/Entailment Failure:** "If CSPs supervene on neural architecture, how can a complete physical description underdetermine them without violating physical closure?" (Metaphysics/Phil Sci)
  2.  **Disguised Property Dualism:** "Is this 'first-person modal grasp' just a non-physical property relabeled to save physicalism?" (Metaphysics)
  3.  **Operational Vacuity:** "How do you measure this 'modal grasp' behaviorally? If you can't, is it science?" (Cognitive Science)
  4.  **PCS Repackaging:** "Isn't this just the Phenomenal Concept Strategy with extra modal steps?" (Phil Language)
  5.  **Explanatory Idleness:** "Does this explain *why* experience feels like something, or just that Mary gains predictive power?" (General)
  6.  **Indexicality Confusion:** "Is this just an indexical fact ('I am here now') disguised as modality?" (Phil Language/Metaphysics)
  7.  **Ad Hocery:** "Did you invent 'CSP' solely to solve Mary, with no independent motivation?" (General)

  ---

  #### II. Objection & Reply Drill

  **1. Objection: Grounding/Entailment Failure**
  *   **The Challenge:** "You claim CSPs supervene on the physical yet are underdetermined by complete physical descriptions. This looks like a failure of grounding. If A supervenes on B, B entails A. You're denying entailment."
  *   **2-Minute Reply:** "I accept supervenience: no CSP difference without a neural difference. However, 'complete physical description' is ambiguous. Standard third-person descriptions encode structural-dynamic facts but omit *agent-relative access conditions*. Think of it like a map vs. a GPS route. The map contains all the physical data (supervenience base), but without the 'you are here' indexical access, the route is underdetermined. My claim is that physicalism requires ontological supervenience, not necessarily epistemic derivability from a *third-person* vocabulary. The gap is in the description's format, not the world's fabric."
  *   **Weakness:** This risks conceding that physicalism is true only by redefining "complete physical knowledge," which some will see as moving the goalposts.

  **2. Objection: Disguised Property Dualism**
  *   **The Challenge:** "This 'modal grasp' sounds suspiciously like a phenomenal property. If it's irreducible to physical description, aren't you smuggling in dualism?"
  *   **2-Minute Reply:** "A property dualist posits a new ontological category. I posit a new *relational* capacity grounded entirely in neural architecture. The 'grasp' is the system's ability to lock onto counterfactual states of itself. It's like a thermostat's hysteresis loop: fully physical, but only describable functionally relative to the system's own operating parameters. It's not a ghostly property; it's a physical system's self-modeling capacity."
  *   **Weakness:** If the "self-modeling capacity" itself feels like something, the dualism charge returns.

  **3. Objection: Operational Vacuity**
  *   **The Challenge:** "You talk about 'modal grasp.' How do I operationalize that in a lab? If it's not behaviorally anchored, it's folk psychology."
  *   **2-Minute Reply:** "I agree consciousness talk needs anchoring. Currently, CSP is a metaphysical placeholder for what we might later operationalize as 'counterfactual predictive accuracy in perceptual tasks.' My job today is to show physicalism *can* survive the Knowledge Argument; your job is to help me measure the mechanism. Don't throw out the metaphysical framework because the psychophysics isn't finished."
  *   **Weakness:** The cognitive scientist may view this as kicking the can down the road indefinitely.

  **4. Objection: PCS Repackaging**
  *   **The Challenge:** "This looks like the Phenomenal Concept Strategy. You're saying she gains a new concept. Why is 'profile' better than 'concept'?"
  *   **2-Minute Reply:** "PCS focuses on the *representation* of experience. I focus on the *stability conditions* of the perceptual apparatus itself. A concept is static; a stability profile is dynamic and modal. It explains not just how she thinks about red, but how her system *holds* red across variations. It grounds the concept in the mechanics, not just the semantics."
  *   **Weakness:** Critics may argue the functional difference is negligible for the Knowledge Argument.

  **5. Objection: Explanatory Idleness**
  *   **The Challenge:** "Okay, she gains a profile. But does this explain *what it's like* to see red? Or just that she knows how she'll react?"
  *   **2-Minute Reply:** "It explains the *epistemic progress*, which is what the Knowledge Argument targets. Jackson claims she learns a new fact. I claim she learns a new access mode. We don't need to explain the qualia itself to defeat the argument that qualia refute physicalism. We only need to show the knowledge gain is physical-compatible."
  *   **Weakness:** This concedes the Hard Problem remains unsolved, which may disappoint some metaphysicians.

  **6. Objection: Indexicality Confusion**
  *   **The Challenge:** "Isn't this just an indexical fact? She learns 'this is what it's like for me.' Why bring in counterfactuals?"
  *   **2-Minute Reply:** "Indexicals locate you in actual space-time. Counterfactuals locate your system in *possibility space*. Mary needs to know not just 'this is red,' but 'if the lighting shifted, my experience would shift thusly.' That stability is modal, not merely indexical."
  *   **Weakness:** Distinguishing modal from indexical knowledge in this context is technically demanding.

  **7. Objection: Ad Hocery**
  *   **The Challenge:** "Did you invent CSPs just to solve Mary? Do they do any other work?"
  *   **2-Minute Reply:** "CSPs generalize to any embodied cognitive system. We can ask about a robot's CSP regarding color sensors. It offers a framework for comparing human and artificial perceptual knowledge across modal variations, not just solving Mary."
  *   **Weakness:** Requires further development to prove independent utility.

  ---

  #### III. Strategic Concessions (State These Up Front)
  *Do not wait for these to be asked. Preempt them to show intellectual honesty.*

  1.  **Concede the PCS Similarity:** "I want to acknowledge early on that my view shares DNA with the Phenomenal Concept Strategy. I am not claiming to overturn that literature, but to refine the metaphysical grounding of those concepts via stability profiles."
  2.  **Concede the Operational Lag:** "To our cognitive science colleagues: I admit this framework is currently metaphysical. I am not claiming we can measure 'modal grasp' tomorrow, but that we need this ontology to know *what* to measure."

  ---

  #### IV. The "Must Land" Reply
  **The Grounding/Entailment Objection (#1).**
  If you fail to explain how supervenience coexists with underdetermination without violating physical closure, the metaphysicians will conclude you do not understand grounding. You must convince them that "complete physical description" is the variable, not the supervenience relation. If this reply fails, the view collapses into dualism or incoherence.

  ---

  #### V. The Dreaded Unasked Question
  **Question:** "Is the counterfactual profile itself phenomenally experienced?"

  **Honest Reply:** "Strictly speaking, the profile is the physical capacity. However, acquiring it *is* the phenomenal experience. The experience isn't a separate property; it's the activation of the profile."

  **Assessment:** This reply is risky. If the profile is physical, why does activating it feel like *qualia*? If it feels like qualia, haven't you just identified qualia with a physical capacity, which begs the question of why that capacity feels like anything? This reply saves physicalism only if the audience accepts that "feeling" is just "accessing a modal profile." Many will not. This is the weak point where the Hard Problem sneaks back in.

  \answer{Is the modal grasp itself a phenomenal property?}
