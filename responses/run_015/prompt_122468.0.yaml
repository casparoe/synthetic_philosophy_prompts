answer: |-
  This is a spec for a **decision model**, not a moral treatise. The goal is to convert ethical premises into a funding recommendation (Go/No-Go) for a specific pilot.

  Here are the refined desiderata. I have tightened the wording to ensure they function as constraints on a model rather than open-ended philosophical questions.

  ### The Spec: Desiderata for a Wild Suffering Intervention Theory

  **1. Mechanism Specificity**
  *   **The Fix:** The theory must output different verdicts for different *causes* of suffering (predation vs. disease vs. starvation vs. exposure). It cannot treat "nature" as a monolith.
  *   **Case:** Vaccinating against a wasting disease is biologically and ethically distinct from culling predators. A theory that bans one must not automatically ban the other without specific justification.
  *   **Status:** **Non-Negotiable.** (A model that aggregates all suffering into one variable cannot select specific pilots.)
  *   **Confidence:** 95%

  **2. Status/Weight Decoupling**
  *   **The Fix:** The theory must separate *moral patienthood* (binary: do they count?) from *moral weight* (scalar: how much do they count?). It must also separate *welfare of existing individuals* from *number of individuals*.
  *   **Case:** Preventing a creature from being born is not morally identical to relieving the pain of a creature that exists. Conflation here leads to the "Benign Addition" paradox or justifies culling to prevent future suffering.
  *   **Status:** **Non-Negotiable.** (Conceptual clarity required for coherent math.)
  *   **Confidence:** 98%

  **3. Uncertainty Weighting (The Invertebrate Problem)**
  *   **The Fix:** The theory must include a variable for *probability of sentience* multiplied by *population size*. It cannot treat "uncertain sentience" as zero.
  *   **Case:** Insects may have a 30% chance of sentience but outnumber mammals 10,000:1. Ignoring them ignores the bulk of the expected value (positive or negative).
  *   **Status:** **Preference-of-One-Camp.** (Strict deontologists might say "0% probability = 0 duty." Consequentialists require expected value weighting. For a funder, EV is required.)
  *   **Confidence:** 90%

  **4. Ecological Feedback (The Equilibrium Trap)**
  *   **The Fix:** The model must account for density-dependent regulation. An intervention that improves individual welfare *per capita* must be discounted by the resulting change in population size.
  *   **Case:** You are **not** over-reading the biology. This is the central finding of wildlife management. Saving 100 deer from starvation often leads to 100 *more* deer being born to starve next season, or increased predation pressure elsewhere.
  *   **Status:** **Non-Negotiable.** (Biological fact. Ignoring this renders the model factually false.)
  *   **Confidence:** 99%

  **5. Dynamic Counterfactual (Shifting Baseline)**
  *   **The Fix:** The "Do Nothing" baseline must be modeled as a trajectory (climate change, habitat fragmentation), not a static state.
  *   **Case:** "Leaving nature alone" is increasingly impossible. The comparison is Intervention vs. *Anthropogenic Drift*, not Intervention vs. *Eden*.
  *   **Status:** **Non-Negotiable.** (Factual accuracy regarding the external environment.)
  *   **Confidence:** 95%

  **6. Reversibility as Option Value**
  *   **The Fix:** Irreversibility (e.g., gene drives) must be treated as a cost (loss of option value) or a hard constraint, not just a risk probability.
  *   **Case:** Once a gene drive is released, you cannot recall it. A pilot must prioritize interventions where "stop" is a viable option if metrics turn negative.
  *   **Status:** **Preference-of-One-Camp.** (Some argue high enough EV justifies irreversible acts. For a *pilot* funder, reversibility is practically non-negotiable.)
  *   **Confidence:** 85%

  **7. Metric Objectivity (The "Not About Us" Test)**
  *   **The Fix:** Success metrics must be independent of human aesthetic preference (e.g., "cute vs. ugly," "active vs. passive").
  *   **Case:** Winter feeding makes humans feel helpful but often increases parasite load and dependency. The theory must screen for interventions that optimize *animal* metrics (cortisol, injury rate, mortality profile), not *human* satisfaction.
  *   **Status:** **Non-Negotiable.** (Required to avoid waste of funds on vanity projects.)
  *   **Confidence:** 90%

  **8. Agency & Standing**
  *   **The Fix:** The theory must specify *who* is permitted to act. It cannot assume a benevolent global sovereign.
  *   **Case:** An NGO vaccinating badgers may be illegal, vigilantism, or politically destabilizing. A theory that recommends action but provides no account of legitimate authority is operationally useless.
  *   **Status:** **Preference-of-One-Camp.** (Libertarians require consent/property rights; Consequentialists require only capacity. A funder needs a legal/operational answer, not just a moral one.)
  *   **Confidence:** 70%

  **9. Operationalizability**
  *   **The Fix:** The theoretical "good" must be measurable in the field with current technology.
  *   **Case:** If the theory says "minimize aggregate pain" but pain cannot be measured in wild fish without killing them, the theory cannot guide a pilot.
  *   **Status:** **Non-Negotiable.** (By definition of a funding spec.)
  *   **Confidence:** 98%

  **10. The Dependency Trap (New Requirement)**
  *   **The Fix:** The theory must model the welfare crash if the intervention is withdrawn.
  *   **Case:** Supplemental feeding creates dependency. If funding stops, the population may suffer *more* than if feeding never began. A pilot must have a sustainable exit strategy or a permanent commitment model.
  *   **Status:** **Non-Negotiable.** (Risk management for the funder.)
  *   **Confidence:** 92%

  ***

  ### The Three Things

  **(a) The Incompatible Subset**
  You flagged it correctly: **"Don't act without decent evidence of net improvement" (Precautionary Principle)** vs. **"Act on huge numbers with thin evidence" (Expected Value Maximization).**
  *   **Verdict:** This is a **real contradiction**, not a false alarm.
  *   **Why:** Requirement #4 (Ecological Feedback) and #9 (Operationalizability) demand high-quality data to prove you aren't making things worse. However, Requirement #3 (Invertebrates) and the sheer scale of nature imply that waiting for high-quality data means ignoring the vast majority of suffering.
  *   **Resolution for a Funder:** You must treat this as a **risk tolerance parameter**. The spec cannot solve this; the funder must decide if they are a "Learning Funder" (prioritizing data/evidence, accepting smaller scale) or a "Impact Funder" (prioritizing scale, accepting higher risk of backfire). You cannot optimize for both simultaneously in a pilot phase.

  **(b) The Knockout Requirement**
  **Requirement #4: Ecological Feedback (The Equilibrium Trap).**
  *   **Why:** This single requirement destroys the most popular intuitive positions.
      *   It knocks out **"Hands-Off/Naturalism"** because it shows that *human inaction* is also an intervention with ecological consequences (shifting baselines).
      *   It knocks out **"Naive Interventionism"** (e.g., "save the deer") because it demonstrates that without population control, welfare interventions often increase total suffering by increasing population density until resources crash.
      *   Any theory that doesn't solve #4 is just sentimentality.

  **(c) Smuggled Politics**
  *   **Requirement #8 (Standing):** This is heavily political. It smuggles in **Liberal Democratic** assumptions about legitimacy and authorization. A pure utilitarian theory would say "If you can do it, do it." Requiring "authorization" privileges state sovereignty over animal welfare.
  *   **Requirement #6 (Reversibility):** This smuggles in a **Status Quo Bias**. Prioritizing reversibility inherently favors *not acting* over acting, because action is always harder to reverse than inaction. If nature is already "intervening" violently (predation/disease), a bias toward reversibility may implicitly support the violent status quo.
  *   **Requirement #1 (Mechanism Specificity):** This can smuggle in **Human Disgust Sensitivity**. It is easy to argue disease is "bad" and predation is "natural." Distinguishing them often relies on human aesthetic comfort with violence (disease looks pathetic; predation looks majestic) rather than the animal's experience of pain.

  ***

  ### Confidence Notes

  *   **Highest Confidence:** #2 (Status/Weight), #4 (Ecological Feedback), #9 (Operationalizability). These are conceptual or biological facts.
  *   **Medium Confidence:** #1, #3, #5, #7, #10. These depend on ethical weighting or specific ecological contexts.
  *   **Lowest Confidence:** **#8 (Agency & Standing).**
      *   **Reason:** I am least sure about this one. The landscape of "who is allowed to intervene in nature" is legally and politically fluid. International law is unclear on wild animal sovereignty. A theory that rigidly defines standing might become obsolete if political norms shift (e.g., if Rights of Nature jurisprudence expands). It is the most vulnerable to external political change.

  ### Brief View Comparison

  *   **Hands-Off View:** Fails #5 (Shifting Baseline) and #4 (Equilibrium). It assumes a static, self-correcting nature that no longer exists. It passes #6 (Reversibility) easily but fails #10 (Dependency) if it relies on human protection of habitats that are inherently unstable.
  *   **"Intervene Where Suffering Goes Down" View:** Fails #4 (Equilibrium) unless it includes population management. It often fails #9 (Operationalizability) because measuring "net suffering" in the wild is currently beyond our technical grasp. It passes #3 (Invertebrates) best, as it is willing to act on expected value.

  **Deliverable Status:** The list is ready for use as a scoring rubric for a grant proposal. Any proposal that cannot answer #4 and #10 should be rejected immediately.
