prompt: |-
  I mostly write about science and ideas for my outlet, but I also somehow ended up on our newsroom's standards committee, and we've been stuck on the same argument for months. Every few weeks a story needs a slur printed verbatim instead of paraphrased -- a leaked rant from some public figure, a piece on a word's history, a story where someone from the group in question uses a reclaimed version of it about themselves. Right now each case gets litigated fresh in a meeting and everyone leaves annoyed. Half the committee wants a blanket rule: never print the actual word, always paraphrase or use a placeholder like 'the n-word,' becuase the harm of seeing it on the page doesn't disappear just because we're 'only quoting.' The other half says that's cowardly and even dishonest -- if the story is literally about what was said, softening it is a distortion, and treating readers like they can't handle a direct quote is its own kind of condescension. I have to bring an actual draft policy to next weeks meeting, not another 'use your judgment' non-answer, and it needs to take the harm side seriously rather than just steamrolling it with a free-speech line. Can you draft that memo -- a real recommendation with criteria we could actually apply to a specific case, plus the strongest version of the argument against whatever you recommend?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Science/ideas writer, member of a newsroom standards committee.
      *   **Problem:** The committee is deadlocked on whether to print slurs verbatim in news stories (quotations, historical context, reclaimed usage). Current process (case-by-case litigation) is inefficient and frustrating.
      *   **Goal:** A draft policy memo for next week's meeting.
      *   **Requirements:**
          *   Must be a *real* recommendation with actionable criteria (not just "use judgment").
          *   Must take the "harm" side seriously (acknowledge trauma, impact, normalization).
          *   Must include the strongest version of the argument *against* the recommendation (steel-manning the opposition).
          *   Tone: Professional, nuanced, journalistic, practical.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A: Never print.* (Too absolute, hinders historical/linguistic accuracy, can be seen as censorship).
      *   *Option B: Always print.* (Ignores harm, risks gratuitous offense, alienates readers).
      *   *Option C: Contextual Necessity Test.* (This is the industry standard best practice, but needs specific criteria to avoid "case-by-case" vagueness).
      *   *Decision:* I will recommend a "Presumption Against, Exception for Essential Context" policy. This leans towards protecting readers from harm but allows for verbatim usage when the *story itself* demands it for accuracy, not just convenience. This balances the two sides.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of the problem and the proposed solution.
      *   **Guiding Principles:** Acknowledge the validity of both concerns (Harm vs. Accuracy).
      *   **The Policy (The "Test"):** Specific criteria for when verbatim usage is permitted.
      *   **Implementation/Process:** How to decide (who signs off).
      *   **The Counter-Argument (Steel-man):** As requested, the strongest case against this policy.
      *   **Conclusion:** Final pitch.

  4.  **Fleshing out the Criteria (The "Meat"):**
      *   Need to move beyond "is it newsworthy?" to specific questions.
      *   *Criterion 1: Centrality.* Is the word the *subject* of the story, or just incidental?
      *   *Criterion 2: Public Record/Accountability.* Is quoting necessary to show the severity of an action (e.g., harassment case)?
      *   *Criterion 3: Reclamation/Self-Identification.* Is the subject using it themselves?
      *   *Criterion 4: Alternatives.* Can the point be made without it?
      *   *Warning/Context:* If used, how is it framed? (Headlines? Audio warnings?)

  5.  **Addressing the "Harm" Side:**
      *   Explicitly acknowledge that seeing the word causes pain.
      *   Acknowledge that normalization is a risk.
      *   Ensure the policy defaults to *not* printing it unless strict criteria are met.

  6.  **Addressing the "Accuracy/Cowardice" Side:**
      *   Acknowledge that sanitizing history is dishonest.
      *   Acknowledge that treating readers as fragile is patronizing.
      *   *Crucial Step:* The prompt asks for the strongest argument *against* whatever I recommend. If I recommend a restrictive policy, the counter-argument should be from the "Always Print/Free Press" perspective. If I recommend a permissive policy, the counter-argument is from the "Harm Reduction" perspective.
      *   *Decision:* I will recommend the "Presumption Against" (Restrictive) policy because it aligns better with modern ethical standards regarding harm reduction, but I will write the counter-argument from the "Principle of Full Disclosure" perspective (the "Cowardly/Dishonest" side). This fits the prompt's request to take the harm side seriously in the *policy*, while still providing the counter-argument.

  7.  **Refining the Tone:**
      *   Needs to sound like an internal newsroom memo.
      *   Avoid academic jargon; keep it actionable for editors.
      *   Be empathetic but firm.

  8.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Subject:* Policy on Verbatim Usage of Racial/Ethnic Slurs.
      *   *Principles:* We value truth, but we value community safety.
      *   *The Rule:* Default to paraphrase. Verbatim only if X, Y, Z.
      *   *The "Steel-man" Counter:* This policy creates a slippery slope. Who decides what's "essential"? It sanitizes history. It protects the powerful who use slurs from full accountability.
      *   *Wait, let me re-evaluate the Counter-Argument.* The prompt asks for "the strongest version of the argument against whatever you recommend." If I recommend a middle-ground "Presumption Against," the argument *against* that could come from *both* sides, but the strongest critique usually comes from the side that feels most restricted. If the policy restricts printing, the "Free Speech/Accuracy" crowd will attack it. If the policy allows printing, the "Harm Reduction" crowd will attack it.
      *   *Better Approach:* I will recommend a **Contextual Necessity Standard** (which is a restrictive default). The counter-argument will be the **Principle of Unfiltered Record** (the "Cowardly/Dishonest" argument from the prompt). This ensures the user has the ammo to defend the policy against the "cowardice" charge.

  9.  **Review against Constraints:**
      *   Draft policy? Yes.
      *   Criteria to apply? Yes.
      *   Take harm seriously? Yes (default is non-printing).
      *   Strongest argument against? Yes (included as a dedicated section).
      *   No "use your judgment" vagueness? Yes (checklist provided).

  10. **Final Polish:** Check for clarity, tone, and ensure the "Science/Ideas" background of the user doesn't bleed in too much (keep it newsroom standard). Ensure the distinction between *reporting on* a slur vs. *using* a slur is clear.

  *(Self-Correction during drafting)*: Make sure I don't just say "Editor in Chief decides." That's passing the buck. The criteria must be robust enough that applying them leads to a clear answer. I need a checklist.

  *(Refining the Counter-Argument)*: The prompt specifically mentions the "cowardly and even dishonest" argument. I need to make sure the counter-argument section articulates *that* specific viewpoint powerfully, even if the policy recommends against it.

  11. **Final Output Generation** (Proceeding to generate the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Policy on Verbatim Usage of Racial and Ethnic Slurs

  ### Executive Summary

  The current ad-hoc process for determining whether to print racial or ethnic slurs verbatim is unsustainable. It consumes disproportionate editorial time, creates inconsistent output, and leaves staff morally fatigued. This memo proposes a shift from case-by-case litigation to a **Presumption Against Verbatim Usage** standard, governed by a specific "Contextual Necessity Test."

  This policy prioritizes harm reduction without abandoning accuracy. It acknowledges that while truth is our primary mandate, the *method* of conveying truth carries ethical weight. Below is the recommended policy framework, followed by the strongest argument against this approach to ensure full committee consideration.

  ### Guiding Principles

  1.  **Harm is Real:** Printing a slur causes distress to readers, specifically those from the targeted group. This harm does not vanish because the word is in quotation marks. We must not treat our platform as a neutral conduit where impact is irrelevant.
  2.  **Accuracy is Non-Negotiable:** Sanitizing history or current events to the point of distortion violates our duty to the record. If the specific word is the news, omitting it may obscure the severity of the event.
  3.  **Intent vs. Impact:** The newsworthiness of a quote is not determined by the speaker's intent, but by the public's need to understand the impact of their speech.

  ### Recommended Policy: The Contextual Necessity Test

  **The Default:**
  The newsroom will **not** print racial or ethnic slurs verbatim in text, headlines, audio, or social media. The standard practice will be to paraphrase or use a partial redaction (e.g., "the n-word").

  **The Exception:**
  Verbatim usage is permitted *only* if the story passes all three criteria of the Contextual Necessity Test. If any single criterion is not met, the word must be redacted.

  **Criterion 1: Centrality**
  Is the specific word the *subject* of the story, rather than incidental to it?
  *   *Pass:* A linguistic analysis of the word's reclamation; a legal trial where the specific charge hinges on the use of that specific word.
  *   *Fail:* A profile of a politician where they used the word once in a 30-minute rant; a story about a policy dispute where the slur was used in a heated exchange but is not the legal or factual core of the dispute.

  **Criterion 2: Accountability and Severity**
  Does printing the word verbatim serve a specific accountability function that paraphrasing cannot?
  *   *Pass:* Documenting the severity of harassment or hate crimes where the specific language evidences motive or threat level.
  *   *Fail:* Quoting a public figure's general tirade where the outrage is about their behavior generally, not the specific lexicon used. (Paraphrasing sufficiently conveys the vitriol without reproducing the trauma).

  **Criterion 3: Informed Consent (For Reclaimed Usage)**
  If the usage involves a member of the group reclaiming the term, is their consent and context clear?
  *   *Pass:* An interview subject explicitly uses the term regarding themselves, and the story contextualizes the reclamation.
  *   *Fail:* Using a reclaimed term in a headline or caption where the nuance of self-identification is lost, potentially exposing the subject to external harassment.

  **Implementation Safeguards:**
  *   **Headlines:** Verbatim slurs are prohibited in headlines, captions, and social media posts under all circumstances. These spaces lack the context required to mitigate harm.
  *   **Warning Labels:** If a story passes the Test and prints the word, it must carry a prominent editor's note at the top warning readers of explicit language.
  *   **Sign-off:** Any decision to print verbatim requires sign-off from the Managing Editor and the Diversity/Inclusion Editor (or designated senior staff member).

  ### The Strongest Argument Against This Policy

  *To ensure we steel-man the opposition, the following is the strongest case for rejecting the "Presumption Against" model in favor of a "Full Context" model.*

  **The Argument for Unfiltered Record**
  A policy of redaction, however well-intentioned, is a form of soft censorship that ultimately protects the powerful and infantilizes the reader.

  1.  **Sanitizing History:** When we redact slurs in historical or news contexts, we dilute the visceral reality of racism. Future readers looking back at archives of hate crimes or systemic abuse will not feel the full weight of the horror if the language is sterilized. We risk turning racism into a polite abstraction rather than a violent reality.
  2.  **Inconsistent Protection:** A redaction policy is applied disproportionately. We are more likely to redact slurs used by marginalized groups reclaiming them or by lower-level offenders, while powerful figures often generate enough "news value" to override the policy. This creates a double standard where the word is too dangerous for the victims to see, but not too dangerous for the perpetrators to say.
  3.  **Reader Autonomy:** Treating adult readers as unable to encounter offensive language in a journalistic context is condescending. Our job is to provide information, not to curate emotional safety. If a reader trusts our journalism, they can trust us to present evidence accurately. Paraphrasing introduces editorial interpretation; quoting presents evidence. By choosing paraphrase, we prioritize our comfort over the evidentiary record.
  4.  **The "Cowardice" Trap:** Ultimately, this policy allows the newsroom to claim moral purity while avoiding the backlash that comes with printing the truth. It shifts the burden of imagination onto the reader ("Imagine how bad this was") rather than doing the hard work of defending the necessity of the quote.

  ### Recommendation

  I recommend the committee adopt the **Presumption Against** policy with the **Contextual Necessity Test**.

  While the "Unfiltered Record" argument is philosophically robust, it fails to account for the immediate, tangible harm inflicted on our community when these words appear without extreme justification. The proposed policy does not ban the words; it raises the bar for their usage. It forces the newsroom to prove *why* the word is necessary, rather than forcing the audience to prove *why* it is harmful.

  This moves us from a cycle of monthly arguments to a clear checklist. It acknowledges that while we must not lie, we are not obligated to replicate trauma gratuitously.

  **Next Steps:**
  If approved, I will draft the specific language for the Style Guide and schedule a training session for editors on applying the Contextual Necessity Test.
