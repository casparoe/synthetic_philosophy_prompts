answer: |-
  On a single Tuesday, Elara undergoes two hour-long episodes. In E, she sits in a warm bath; a distinct, localisable glow of comfort permeates her skin, yet when the timer sounds she exits without hesitation, feeling no desire to prolong it. In F, she engages in a complex logical puzzle; there is no somatic glow nor locatable pleasant feel, only deep absorption, yet an interruption provokes immediate resentment and a concurrent disposition to cancel evening plans to resume. Despite this divergence in concurrent phenomenology and motivation, a week later Elara recalls both episodes vividly but rates their goodness identically, expresses genuine indifference about which to repeat, and finds the memories indistinguishable with respect to value.

  This scenario isolates the metaphysical disagreement by dissociating the three measures that typically covary: felt tone, concurrent motivational pull, and retrospective valuation. For the **Single-Quality View (SQV)**, pleasantness is constituted solely by the introspectible felt quality; thus, E contains pleasure and F does not (or contains significantly less), regardless of Elara's disposition to sustain F. On this account, felt tone is the constitutive measure, while pull and retrospective ratings are merely fallible evidence, often tracking overall value rather than hedonic tone specifically. Defenders of SQV (often associated with sensory hedonism) would maintain that F is a case of engagement or flow, not pleasure, and that conflating the two is a category error. For the **Attraction View (AV)**—closely related to desire-based accounts such as Heathwood's, though distinct from Feldman's attitudinal hedonism which focuses on 'taking pleasure in' rather than raw disposition—pleasantness is constituted by the subject's attraction to the experience for its own sake. Consequently, F is more pleasant than E, as the dispositional pull is stronger, rendering the felt quality in E merely evidential and the retrospective indifference a failure of memory or judgement regarding the *experience itself* rather than its pleasantness. Finally, the **Cluster View (CV)**, drawing on Wittgensteinian family-resemblance concepts, implies that the question 'which contains the same amount of pleasure?' lacks a determinate answer; E and F are both pleasant, but in incommensurable ways (sensory delight versus absorptive satisfaction). For CV, no single measure is constitutive; all three are role-properties that typically cluster but can come apart, as they do here.

  The single feature doing the metaphysical work is the **dissociation of concurrent felt tone from concurrent motivational pull**. If this feature were removed—such that high feel coincided with high pull, and low feel with low pull—the SQV and AV would converge on the verdict that E and F differ in pleasure, and the CV would likely acknowledge a unified category. Without this dissociation, the theories remain extensionally equivalent in standard cases.

  The account left looking worst is the **Single-Quality View**. It yields the counter-intuitive result that an experience Elara fights to sustain (F) lacks the very property (pleasantness) that typically explains such fighting, while an experience she abandons indifferently (E) possesses it. This implies a systematic disconnect between the phenomenology of value and the motivation to pursue it, which strikes many as an error theory of the subject's own agency. The strongest reply on behalf of SQV is to challenge the **constitutive status of the 'pull' measure**. The SQV defender argues that 'pull' tracks *desire* or *perceived good*, not *pleasure*. They would contend that Elara's disposition to continue F is driven by a non-hedonic valuation (e.g., curiosity, achievement, or meaning) which she retrospectively weighs equally against the sensory comfort of E. Thus, the case does not show SQV is false, but rather that we must rigorously distinguish pleasure (a feeling) from the broader class of positive reinforcements (which include absorption). By insisting that 'pleasure' refers strictly to the hedonic tone, SQV preserves conceptual clarity, even if it narrows the term's application compared to ordinary language. It must be noted, however, that this reply relies on a stipulative precision that some critics argue ignores the functional role pleasure plays in our psychological economy, a point that remains genuinely contested between sensory hedonists and their attitudinal opponents.
