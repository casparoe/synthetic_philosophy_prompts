answer: |-
  Dear Colleagues,

  I am writing to set out the position I will defend in our second session on Sen's impossibility theorem. My claim is that the correct response is to qualify the Pareto principle while retaining minimal liberalism, specifically by restricting Pareto comparisons to pairs of social states that differ only outside everyone's protected sphere. This is not a technical fix to evade a mathematical result, but a substantive claim about the normative weight of preferences. The Pareto principle assumes that if everyone prefers state A to state B, that unanimity constitutes a decisive reason for choosing A. However, this assumes that all expressed preferences are valid reasons for social choice. I argue they are not. When a preference concerns an act within another agent's protected sphere, it is meddlesome. Such preferences may explain why an agent is dissatisfied, but they do not constitute reasons that can override the authority granted by a right. To count them as such is to deny the very jurisdiction the right was meant to secure.

  Let us apply this to the Prude and Libertine example we established. The alternatives are nobody reads, Prude reads, and Libertine reads. The Prude is decisive over whether he reads or nobody reads; the Libertine is decisive over whether he reads or nobody reads. The Prude prefers nobody reads to him reading; the Libertine prefers him reading to nobody reading. Exercising their respective rights yields an ordering where nobody reads is better than Prude reads, and Libertine reads is better than nobody reads. By transitivity, Libertine reads is better than Prude reads. This ordering avoids the cycle without invoking the Pareto principle on the pair where Prude reads versus Libertine reads. Why? Because that pair differs in who performs the protected act of reading. Under my restriction, the Pareto principle is silent here. Both agents prefer Prude reads to Libertine reads, but this unanimity is built on the Prude's preference about the Libertine's conduct and the Libertine's preference about his own conduct relative to the Prude's. Since the difference between the states lies entirely within the protected spheres of the agents involved, the Pareto principle cannot aggregate these preferences to override the rights-based ordering. The result is that Libertine reads is best, nobody reads is next, and Prude reads is last. This is the right verdict because it respects the Libertine's wish to read without forcing the Prude to read, whereas the Pareto-driven verdict would force the Libertine not to read solely because the Prude objects to it.

  I anticipate the welfarist objection that this restriction is merely minimal liberalism smuggled into the Pareto principle, relying on an asserted moral claim about meddlesome preferences rather than an argument. The argument is that rights are not just constraints on outcomes but constraints on valid reasoning. If we accept that individuals have a moral claim to authority over certain personal acts, then the preferences of others regarding those acts are categorically different from preferences regarding public goods. A preference is a reason for social choice only if it respects the jurisdiction of others. To allow meddlesome preferences to count in a Pareto comparison is to treat the protected sphere as merely another preference to be aggregated, which dissolves the concept of a right. I am not asserting that meddlesome preferences are bad; I am arguing that they lack the normative competence to override a right. The work is not done by Minimal Liberalism alone, but by a theory of reasons that recognizes autonomy as a boundary on aggregation.

  Now consider the contribution case, which tests the cost of this view. Two agents may contribute or withhold from a joint project. Both prefer both contribute to both withhold. However, each prefers that the other contribute alone most, and that he himself contribute alone least. This is a prisoner's dilemma structure. If each has a protected sphere over his own contributing, each exercises his right to withhold regardless of what the other does, because each prefers withholding to contributing in both scenarios. Consequently, the rights-based ordering puts both-contribute at the bottom, even though both prefer it to both-withhold. The difference between both-contribute and both-withhold lies entirely within the two protected dimensions, so my restricted Pareto principle cannot intervene to rank both-contribute higher.

  I accept this verdict. It is uncomfortable, but it is the price of a consistent liberalism. If we allow the Pareto principle to override rights whenever unanimity exists, even on matters within protected spheres, we make rights contingent on the preferences of others. In the contribution case, the agents are free to cooperate, but they cannot be forced to cooperate by a social choice rule that aggregates their meddlesome preferences about each other's contributions. The appeal of the Pareto principle remains intact for ordinary policy cases where no protected sphere is in play, such as the temperature of a public room or the level of national defense, provided no individual claims a right to determine those states unilaterally. In those domains, unanimity still signals a genuine improvement without trespassing on personal jurisdiction.

  Finally, I must commit to what I would sacrifice if forced. If I had to give up one premise, I would abandon the claim that preferences about others' protected acts never count as reasons. I would concede that in cases of catastrophic harm, where the exercise of a right imposes severe costs on others, meddlesome preferences might regain normative weight. The consideration that would make me give this up is the magnitude of the externality. If the Libertine's reading caused physical harm to the Prude rather than mere offense, the Prude's preference would cease to be merely meddlesome and would become a claim of security, which might override the liberty claim. But in the standard cases of offense or cooperative failure, I stand by the restriction.

  Best regards,

  Your Colleague
