          2.  Part 1: The Ontological Bridge (Materialism + Generation). Explain that for Hobbes, geometry *is* the study of motion/extension, which is what matter *is*.
          3.  Part 2: The Certainty Transfer. Why physics can be certain if geometricized.
          4.  Part 3: The Software Analogy. Validate the intuition but correct the metaphysical gap.
          5.  Conclusion: Summary of Hobbes's project.

      *   *Key Concept to Emphasize:* "Definition as Generation." This is the linchpin. We know the cause because we define the object by how it is made.
      *   *Key Concept to Emphasize:* "Matter as Extension." Matter isn't distinct from space in a way that allows it to violate geometry.

      *(Self-Correction during drafting)*: I need to be careful not to make Hobbes sound like a Platonist. He is a nominalist. The "universal triangle" is a name, but the *reasoning* applies to any physical triangle because they share the property of extension.
