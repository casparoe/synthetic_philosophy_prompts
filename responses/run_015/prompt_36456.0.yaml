answer: |-
  **Project Title:** Signs and Sins: A Linguistic-Teleological Reading of Augustine's Prohibition on Lying

  **Research Question**
  Standard interpretations characterize Augustine's prohibition on lying as a brute deontological constraint: lying is always sinful because God forbids it, or because it inherently corrupts the soul. This project asks a more specific explanatory question: To what extent does Augustine's semiotic teleology—the theory that speech exists divinely to convey mind to mind—determine the specific taxonomy of deception found in *De Mendacio* and *Contra Mendacium*? Specifically, I will test the hypothesis that Augustine's distinctions between lies, fictions, jokes, and misleading truths are not arbitrary exceptions to a rigid rule, but consistent applications of a linguistic norm. The research seeks to determine whether the "language-theoretic" reading possesses greater explanatory power regarding Augustine's case classifications than the competing "divine command," "soul-corruption," or "proto-Kantian" readings.

  **State of the Field and Rationale**
  Augustine's absolutism on lying is well-documented, but the *ground* of that absolutism remains contested. The dominant scholarly approaches treat the prohibition as primarily ethical or theological. The divine command reading views the ban as an instance of obedience to scriptural authority; the soul-corruption reading views it as a matter of spiritual hygiene, where the lie damages the liar's charity; the proto-Kantian reading views it as a violation of rational duty. While these readings explain why lying is *wrong*, they struggle to explain Augustine's nuanced treatment of non-literal speech. If the ban were merely about factual falsity or divine fiat, fiction and irony should be problematic; yet Augustine exempts them. Conversely, if the ban is about preventing harm, misleading truths (the precursors to later casuistic mental reservation) should be permissible; yet Augustine often treats them with suspicion.

  Existing scholarship acknowledges Augustine's theory of signs in *De Doctrina Christiana*, but rarely integrates it systematically with the casuistry of the lying treatises. The gap lies in the lack of a comparative test: no study has rigorously mapped Augustine's specific examples against the predictions made by these rival foundational theories. By treating the textual distinctions as data points to be explained, this project moves beyond restating Augustine's position to evaluating the structural coherence of his moral psychology. If the prohibition flows from a teleology of language, then the defining feature of a lie must be the intentional perversion of the sign-function, not merely the utterance of falsehood. This project will verify whether this semantic criterion aligns with Augustine's actual judgments.

  **Methodology and Work Plan**
  The project will be executed over twelve months, divided into four phases of research and writing. The primary corpus includes *De Mendacio*, *Contra Mendacium*, and Book II of *De Doctrina Christiana*, supplemented by relevant letters and sermons where deception is discussed.

  *Months 1–3: Exegetical Groundwork.* I will produce a close reading of the relevant texts to reconstruct Augustine's explicit definitions of the sign, the lie, and the intention to deceive. The goal is to codify the "language-theoretic" model into a set of necessary and sufficient conditions for what constitutes a lie according to Augustine. Simultaneously, I will formalize the predictions of the rival models (divine command, soul-corruption, etc.) regarding how they should classify borderline cases.

  *Months 4–6: Taxonomy and Data Mapping.* I will catalog every instance of deception, potential deception, or non-literal speech discussed in the corpus. Each case (e.g., the patriarchs' deceptions, comic irony, protective falsehoods, misleading truths) will be coded according to Augustine's verdict. I will then test each case against the criteria established in the first phase. Does the linguistic model correctly predict which cases are condemned and which are exempt? Do the rival models fail to predict specific exemptions, such as the status of fiction?

  *Months 7–9: Comparative Analysis and Argument Construction.* This phase involves weighing the explanatory success of each model. If the linguistic model accounts for the data with fewer ad hoc adjustments than the rival models, the hypothesis is supported. I will also address potential counter-evidence, such as passages where Augustine seems to rely solely on scriptural authority. The output of this phase will be a detailed argument demonstrating that the semiotic foundation resolves apparent inconsistencies in Augustine's casuistry, particularly regarding the status of misleading truths.

  *Months 10–12: Drafting and Normative Integration.* The final quarter will be dedicated to writing the dissertation chapter and a related article. I will articulate the systematic payoff: how Augustine's teleological account of assertion offers resources for contemporary debates on whether lying is defined by the assertion of believed falsehood or the intention to deceive. The writing will be tailored for audiences in both the history of philosophy and ethics.

  **Criteria for Success and Failure**
  A positive result consists in demonstrating that the language-theoretic reading predicts Augustine's classifications with higher accuracy than rival readings. Specifically, success requires showing that Augustine's exemptions for fiction and irony are non-arbitrary within a semiotic framework (as they do not aim at false belief via corrupted signs), whereas they remain anomalous under a strict divine command framework. Success also entails clarifying Augustine's ambivalence toward misleading truths: if the project is successful, it will show that Augustine tolerates them only insofar as they do not violate the sign-function, or condemns them when they do.

  The project would fail if the textual evidence proves inconsistent with any systematic reading. If Augustine's distinctions turn out to be ad hoc or driven solely by reverence for specific biblical figures regardless of linguistic structure, the hypothesis that a unified theory of language grounds the ethics will be untenable. Similarly, if the theory of signs in *De Doctrina Christiana* is too underdeveloped to bear the ethical weight required, or if the rival ethical readings explain the case distinctions equally well, the claim to a unique linguistic foundation will not hold. Finally, the project fails if the distinction between "corrupting a sign" and "intending to deceive" collapses entirely, rendering the linguistic framing redundant.

  **Contribution to Scholarship and Systematic Debate**
  This project offers a twofold contribution. Historically, it rescues Augustine from the caricature of the unyielding rigorist whose ethics float free of his metaphysics. By grounding the prohibition on lying in his philosophy of language, it presents Augustine as a systematic thinker whose ethics are coherent with his semiotics, enriching our understanding of late antique moral psychology. It shifts the scholarly focus from the *severity* of the rule to the *structure* of the justification.

  Systematically, the project recuperates Augustine as a live interlocutor in contemporary analytic debates regarding the definition of lying. Current discourse often oscillates between traditionalist accounts (lying is asserting what one believes false) and intentionalist accounts (lying is intending to deceive). Augustine's teleological apparatus offers a third path: lying is the misuse of a social institution designed for truth-telling. If this project succeeds, it demonstrates that a teleological account of language can sustain a robust moral prohibition without relying on divine command or abstract rationality, providing a historical precedent for normative theories of assertion currently being developed in the philosophy of language.
