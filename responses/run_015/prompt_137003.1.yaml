  ### Two Candidate Rules

  **Rule 1: Variable-Relative Interventionism (VRI)**
  $C$ is a cause of $E$ if and only if there is a possible intervention on $C$ that changes the value of the variable $E$, holding fixed the background conditions as they actually occurred.
  *   **Fit to earlier verdicts:** This fits Case 1 (intervening on Cylinder 1 changes the fire's timing/temp; intervening on Cylinder 2 does not), Case 3 & 4 (intervening on the Junior command does not change the Valve state), and Case 5 & 6 (intervening on the omission changes the fire outcome). It respects her Case 4 commitment that a difference in a *trace* (the log) does not count as a difference in the *target effect* (the valve).

  **Rule 2: Actual Process Participation (APP)**
  $C$ is a cause of $E$ if and only if $C$ is an active physical participant in the actual process that produces $E$, provided $C$ is not a merely dormant backup.
  *   **Fit to earlier verdicts:** This fits Case 1 (Cylinder 2 was dormant, Cylinder 1 active), Case 2 (both active), Case 3 (Junior command was discarded/inactive regarding the valve mechanism), and Case 5 & 6 (the cancellation and the failure are treated as active nodes in the causal network). It captures her intuition in Case 2 that "both caused it" because both physically contributed, and in Case 1 that the backup did not.

  ### Ruled-Out Tests

  Her track record rules out **Simple Counterfactual Dependence** (the "but-for" test). In Case 1, the fire going out does not counterfactually depend on Cylinder 1 in the simple sense (if Cylinder 1 hadn't opened, Cylinder 2 would have, and the fire still would have gone out), yet she verdicts that Cylinder 1 caused it. She requires dependence of the *specific properties* (timing, temperature) or *actual process*, not just the occurrence.

  Her answer in Case 4 commits her to rejecting **Total Trace Causation**. She denies that the Junior command caused the valve to open even though it caused a difference in the log file. This establishes that for $C$ to cause $E$, the intervention on $C$ must change $E$ itself, not just some variable correlated with or downstream of $C$ that is distinct from $E$.

