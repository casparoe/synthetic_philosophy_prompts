  I spent most of last night arguing with a friend about whether causation is really a matter of what would have happened, or of what an intervention would do. She is the one who keeps appealing to interventions and to the idea that causal claims are worth making only where they buy you manipulation and control; I keep appealing to counterfactual dependence in the situation as it actually was. We went through a long list of cases and she gave firm verdicts, and I have since thought of a case that I think puts real pressure on the set, but I can't quite say which of her commitments it pressures. I want your help reconstructing the machinery before I email her.

  Her verdicts, all in the same setting (a sealed archive vault with an inert-gas fire suppression system; "the fire going out" is the effect we were asking about):

  1. Two cylinders feed the vault; the controller opens the first, and had the first failed it would have opened the second one second later. The first opens. Had the second been the one to open, the fire would have gone out later and the peak temperature would have been measurably higher. Verdict: the first discharge caused the fire to go out; the second did not.
  2. Both cylinders open at the same instant; either alone would have brought the room below the suppression threshold within tolerance; with both open the oxygen falls faster and the peak temperature is lower than it would have been with either alone. Verdict: both caused it.
  3. Two controllers, one senior and one junior, both send an open command; the firmware is written to obey a senior command if one is present and to discard junior commands without logging them. Verdict: the senior command caused the valve to open; the junior command did not.
  4. Variant of 3 in which the firmware does log discarded commands, so the log file differs depending on whether the junior command arrived, and nothing else does. Verdict: still no. Her words were that a difference in the log is only a trace of the command, not something the command brought about in the effect we were asking about.
  5. A crew had a work order to drain the cylinders that morning, which would have left the fire unsuppressed; another technician cancelled the order; the cylinders were full; the fire went out. Verdict: the cancellation caused the fire to go out, and she was firm about this.
  6. The night operator failed to notice a low-pressure alarm for an hour; had she noticed she would have vented manually and the damage would have been smaller. Verdict: yes, her failure caused part of the damage — but here she wavered, and when I pressed her she said something like, nothing happened, how can nothing do anything.

  The new case. Two identical cylinders, P1 and P2, feed the vault through a common manifold with a regulator: the regulator admits gas into the vault only until the oxygen concentration reaches the setpoint and dumps whatever is left over outside the building. Each cylinder on its own holds more than enough gas to reach the setpoint. In the actual run both discharge, the regulator draws on both, and the surplus is dumped. The oxygen curve in the vault, the peak temperature, the time the fire goes out, and every other detail of the fire and the room are, as far as the case specifies, exactly what they would have been had either cylinder discharged alone. There is no log and no sensor that tells the two apart. The only remaining candidates for a difference between what happened and what would have happened are that two cylinders hang empty afterwards rather than one, and that the particular gas molecules now in the room came from two cylinders rather than one. Sub-questions: (a) did P1's discharging cause the fire to go out; (b) did P2's; (c) same case except that the two cylinders carry isotopically tagged gas, so a mass spectrometer run afterwards on the room air would reveal which cylinders contributed, while every fire-related detail is unchanged — did P1's discharging cause the fire to go out there.

