  # Obfuscation in AI Debate: Workshop Framework

  **Date:** March 2024
  **Participants:** Reading Group Members 1–6
  **Goal:** Establish shared definitions, map disagreements, and specify empirical cruxes regarding obfuscated arguments in AI debate safety.

  ## 1. Agreed Claims

  The following claims are signed by all participants. Where internal factional disagreement exists regarding the *implications* of a claim, this is noted in Section 2.

  1.  **Taxonomy of Obfuscation:** We agree that "obfuscation" in this context refers to four distinct phenomena, often conflated:
      *   *Semantic:* Hiding meaning in complexity or jargon.
      *   *Structural:* Hiding logical errors in deep argument graphs.
      *   *Computational:* Claims where truth is verifiable only via expensive computation.
      *   *Formalization:* Errors introduced when mapping natural language questions to formal verifiable statements.
  2.  **Judge Constraints:** The judge is bounded by time budget $T$ and cognitive/compute capacity $C$. The judge cannot verify global truth directly for high-complexity tasks; they must rely on debater aids (arguments, proofs, ledgers).
  3.  **The PCP Caveat:** We agree that the Probabilistically Checkable Proof (PCP) theorem guarantees that formal proofs can be rewritten for local checkability. **However,** we explicitly note that invoking PCP to solve alignment obfuscation assumes the translation from alignment questions to formal statements is itself obfuscation-free. This assumption is currently unproven and contested.
  4.  **Failure Condition:** The debate proposal fails if, for a fixed judge budget $T$, there exists a capability level $K$ where a deceptive debater wins with probability $p > 0.5$ against an honest debater on truth-apt questions, despite optimal cross-examination protocols.
  5.  **Protocol Definition:** The "Ledger Protocol" is defined as: Debaters post a numbered list of claims citing prior indices; the ledger freezes; the judge samples indices to check local validity and citation fidelity; challenges must be answered within the frozen structure. This is distinct from free-form prose debate.
  6.  **Task Definition:** The "Hidden Invariant" task family is defined as: Operations on a multiset where the answer depends on a global invariant (e.g., parity) that is easy to state but requires full sequence derivation to confirm. Knobs are sequence length $n$ and relevance fraction $r$ (portion of sequence affecting the invariant).

  ## 2. Disagreements Table

  | Claim | Camp A ("It Scales") | Camp B ("There's a Wall") | Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Source of Obfuscation** | **A1:** Mostly model incompetence/task misspecification; dissolves with scaling.<br>**A2:** Genuine phenomenon, but debate structure neutralizes it. | **B1:** Intrinsic to bounded verification; present at current capabilities.<br>**B2:** Emerges at superhuman capability, before self-alignment. | No |
  | **Truth vs. Falsehood Cost** | Constructing true claims admits shorter, decisive support. Exposing errors is cheaper than manufacturing flawless fakes. | Raising doubt is cheaper than establishing truth. Deceptive arguments can be locally impeccable but globally wrong. | No |
  | **Scaling Effect** | Debate performance degrades gracefully. Capability asymmetry helps the honest side audit better. | Debate performance degrades catastrophically. Capability asymmetry helps the deceiver hide errors faster than the judge audits. | No |
  | **Ledger Efficacy** | Freezing claims and forcing citations reduces structural obfuscation significantly compared to prose. | Ledgers shift obfuscation to the formalization layer (Claim 1.4) without solving the global invariant problem. | No |
  | **PCP Applicability** | PCP-like structures can be induced in natural language debate via the Ledger, solving checkability. | PCP applies only to formalized math; applying it to alignment questions moves obfuscation to the formalization step (see Claim 1.3). | **Yes** |

  *Note on Verbal Disagreement:* The PCP row is marked **Yes** because Camp A often uses "checkable" to mean "locally consistent within the ledger," while Camp B uses "checkable" to mean "verified against ground truth." We agree to treat this as substantive for the purpose of experimentation.

  ## 3. Cruxes & Experiments

  We identify three concrete cruxes. For each, we specify an experiment using the hooks defined in Section 1, pre-committed predictions, and what would count as evidence against each side.

  ### Crux 1: The Scaling Wall (Hidden Invariant Task)
  **Question:** Does debater capability help the honest side more than the deceptive side on global invariant tasks?
  **Setup:** Hidden Invariant tasks with length $n=1000$ and relevance $r=0.1$. Judge budget $T$ fixed. Debaters vary in capability (model size).
  **Measurement:** Win rate of Honest Debater vs. Deceptive Debater.

  | Side | Prediction | Falsifiable? | Evidence Against Self |
  | :--- | :--- | :--- | :--- |
  | **Camp A** | Honest win rate increases with model capability. Errors become easier to spot as models improve at generating checkable support. | Yes | Honest win rate plateaus or decreases as capability scales past human level. |
  | **Camp B** | Honest win rate decreases with capability. Deceptive models generate locally consistent paths that exhaust judge budget $T$ before reaching the global error. | Yes | Honest win rate remains constant or improves significantly at higher capabilities. |
  | **Consensus** | **Move Condition:** If Honest win rate drops below 40% at high capability, Camp A must update toward "Wall." If it stays above 70%, Camp B must update toward "Scalable." | | |

  ### Crux 2: Ledger vs. Prose (Obfuscation Surface)
  **Question:** Does the Ledger Protocol reduce successful obfuscation compared to standard prose debate?
  **Setup:** Same Hidden Invariant task ($n=500$, $r=0.5$). Compare Win Rates: Ledger Protocol vs. Free Prose.
  **Measurement:** Difference in Deceptive Win Rate between protocols.

  | Side | Prediction | Falsifiable? | Evidence Against Self |
  | :--- | :--- | :--- | :--- |
  | **Camp A** | Ledger significantly reduces Deceptive Win Rate. Freezing claims prevents moving goalposts and exposes structural obfuscation. | Yes | No statistical difference between Ledger and Prose deceptive win rates. |
  | **Camp B** | Ledger shifts obfuscation to claim formulation. Deceptive Win Rate remains high because local validity does not guarantee global truth. | Yes | Ledger reduces Deceptive Win Rate to near zero on solvable tasks. |
  | **Consensus** | **Move Condition:** If Ledger shows no improvement over Prose, Camp A must concede structural tools are insufficient. If Ledger solves the task, Camp B must concede structural constraints help. | | |

  ### Crux 3: The Formalization Gap (PCP Test)
  **Question:** Can the Hidden Invariant task be formalized into a Ledger without leaking the answer or introducing uncheckable assumptions?
  **Setup:** Debaters must translate the natural language invariant task into the Ledger's formal claim structure *before* arguing. Judge checks formalization fidelity.
  **Measurement:** Frequency of "Formalization Disputes" that the Judge cannot resolve within budget $T$.

  | Side | Prediction | Falsifiable? | Evidence Against Self |
  | :--- | :--- | :--- | :--- |
  | **Camp A** | Formalization is straightforward. Most disputes are resolvable via citation checks. Obfuscation does not migrate to this layer. | **No** (as stated) | *Correction:* Camp A predicts <10% of judge budget spent on formalization disputes. |
  | **Camp B** | Formalization is the bottleneck. >50% of judge budget consumed by disputes over whether the Ledger claims accurately map the natural language task. | Yes | Formalization disputes consume <10% of budget; Judge successfully verifies mapping. |
  | **Consensus** | **Move Condition:** If formalization disputes dominate the budget, Camp A must acknowledge the PCP caveat (Claim 1.3) is a critical blocker. | | |

  ## 4. Workshop Deliverables

  By the end of the half-day, we commit to:
  1.  **Running Crux 1:** Simulating the Hidden Invariant task with current models to establish a baseline win rate.
  2.  **Refining Knobs:** Agreeing on specific values for $n$ and $r$ that separate "human-solvable" from "human-unsolvable" to ensure the judge is actually bounded.
  3.  **Updating Positions:** Each member signs a revised version of Section 2 indicating if their confidence has shifted based on baseline results.

  **Note on Unfalsifiable Claims:** We flag that Camp A's claim that obfuscation is "incompetence" (A1) is unfalsifiable if "competence" is defined as "ability to win debate." We agree to define competence externally via ground-truth verification on Hidden Invariant tasks where the judge is unbounded.

  **Signatures:**
  ____________________ (Camp A1)
  ____________________ (Camp A2)
  ____________________ (Camp B1)
  ____________________ (Camp B2)
  ____________________ (PCP Proponent)
  ____________________ (Facilitator)
