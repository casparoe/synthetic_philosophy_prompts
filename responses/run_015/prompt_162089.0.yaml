answer: |-
  Here is a draft structured for a 40-minute episode. 

  **Note on timing:** This draft includes 8 main questions, a 4-question tightening sequence, and 2 closing questions (14 total). For a 40-minute show, this is tight. You may wish to treat the "Tightening Sequence" as part of your main count, or select the strongest 6 from the Main Interview section to ensure you have time for deep follow-ups.

  ### Part 1: Main Interview (8 Questions)

  **1. The Core Case: Comparative Advantage vs. Uncertainty**
  "You distinguish your view from the 'moral uncertainty' argument. The uncertainty view says I should trade because I'm not sure I'm right. Your view says I should trade even if I *am* sure I'm right, simply because of diminishing returns and comparative advantage. Can you walk us through a concrete example where two people, both 100% confident in their own moral framework, still generate net value by funding each other's projects? And crucially, where does the gain come from if both believe the other's project is suboptimal?"
  *   **Expected Answer:** She will likely use a standard economics analogy: If I am great at building bednets and you are great at lobbying for animals, even if I think animals matter less, my marginal dollar does more good in your hands than mine because I'm inefficient at lobbying. The gain comes from efficiency, not truth.
  *   **Follow-up:** "If the gain is purely efficiency, doesn't that imply I am treating your moral goal as a *means* to my end, rather than an end in itself? Does that instrumentalization undermine the moral worth of the action I'm funding?"

  **2. Relativism and Weighting Mistaken Values**
  "To make that trade, I have to calculate the 'value' of your cause to decide if it's worth my money. Does entering a moral trade require me to assign positive moral weight to values I fundamentally reject? If I think your cause is objectively wrong, but I fund it anyway because it buys you funding mine, haven't I quietly adopted a form of relativism where 'wrong' just means 'less efficient for me'?"
  *   **Expected Answer:** She will likely deny this. She'll say she assigns weight to the *satisfaction of your preferences*, not the objective value of the cause. She distinguishes between "what is good" and "what is good for you to achieve."
  *   **Follow-up:** "But if I'm a moral realist, 'what is good for you' is only valuable insofar as it aligns with 'what is good.' If they diverge, why should I care about your satisfaction at all? Doesn't this view only work if we already agree to disagree?"

  **3. Enforcement and Defection**
  "These aren't legal contracts. If I send you money for your animal campaign, and you take it and spend it on something else, or simply refuse to fund my bednets in return, I have no recourse. How do you solve the defection problem, especially in one-off trades between strangers who won't interact again?"
  *   **Expected Answer:** She will likely lean on reputation mechanisms, escrow services, or community norms within the effective altruism/philosophy sphere. She might suggest "smart contracts" or binding pledges.
  *   **Follow-up:** "That works in a small, high-trust community. But if moral trade is supposed to be a general tool for society, doesn't it collapse the moment it scales to people who don't share your specific social norms? Is this a universal ethic or a club benefit?"

  **4. Incentivizing Exotic or Inconvenient Values**
  "Here's a worry I haven't seen in the literature. If having a niche or expensive value makes me a more attractive trading partner—because I'm desperate for funds and you're not—doesn't a culture of moral trade reward people for cultivating inconvenient values? If I want to attract funding for my cause, is there an incentive to make my values more extreme or exotic so I look like a 'better deal' to a trader?"
  *   **Expected Answer:** She might argue that the market would correct for this; traders would vet partners. Or she might say that having strong convictions is good regardless of the incentive.
  *   **Follow-up:** "What about misrepresentation? If lying about my values makes me a better trading partner, and the outcome is more good done by your lights, does your framework permit me to lie about what I value to secure the trade?"

  **5. The Vote Trading Analogy**
  "Many people find vote trading (logrolling) corrupt, even when both sides gain. They argue it distorts the public will. Moral trade feels similar: we are bypassing the normal aggregation of moral worth to get a better personal deal. Why is moral trade virtuous where vote trading is often seen as a civic vice?"
  *   **Expected Answer:** She will likely distinguish between public office (fiduciary duty to constituents) and private charity (discretionary spending). She'll argue you own your money, but you don't own your vote.
  *   **Follow-up:** "But if the money comes from a salary earned in a public role, or if the trade influences public policy indirectly, does that distinction hold? Where is the bright line between private discretion and public corruption?"

  **6. Trade Across Time**
  "Can I trade with the future? I could fund a project that helps future generations, but they can't reciprocate. Conversely, can I trade with my future self? If I know my values will shift in ten years, can I bind my future self to fund my current priorities in exchange for me funding theirs now?"
  *   **Expected Answer:** She will likely say intergenerational trade is impossible (no reciprocity), but intrapersonal trade (with future self) is possible and arguably rational, similar to saving for retirement.
  *   **Follow-up:** "If my future self repudiates the deal because their values have changed, are they morally bound to honor it? If not, doesn't that make the trade unstable? If yes, aren't we allowing the dead hand of the past to dictate future moral priorities?"

  **7. Transaction Costs and Market Thickness**
  "Finding a trading partner requires time and information. I have to know what you value, trust you, and negotiate terms. For small donors, isn't the 'transaction cost' of finding a partner higher than the efficiency gain from the trade? Does this only work for large institutional players?"
  *   **Expected Answer:** She will acknowledge the friction but argue that platforms could lower costs. She might argue that even small gains aggregate.
  *   **Follow-up:** "If it requires a platform to work, doesn't that centralize moral decision-making? We end up trading based on what the platform makes easy to fund, rather than what is actually most valuable."

  **8. The Integrity Objection (Setup)**
  "Let's land on the integrity objection. Critics say I compromise my moral integrity by funding what I think is wrong. Your stock line is: 'No one's hands get dirty when the only thing that changes hands is who does what.' You're arguing that trade merely reallocates action. But isn't funding an action a form of participation in it?"
  *   **Expected Answer:** She will reiterate that causality is key. If the action happens either way (just by a different agent), my funding didn't cause the bad, it caused the *good* (my project) via the trade.
  *   **Follow-up:** "I want to press on that 'either way' claim in the next segment, because I think there are cases where the trade itself changes the moral landscape."

  ---

  ### Part 2: The Integrity Tightening Sequence
  *Use these four questions in rapid succession to corner the "dirty hands" defense.*

  **Q1 (Suboptimal):** "Let's start easy. I think your cause is merely *second-best*. I fund you, you fund me. Do my hands get dirty here?"
  *   *Target:* She will say No. It's just efficiency.

  **Q2 (Worthless):** "Okay, now I think your cause is *worthless*. Not bad, just a waste of resources—like building a statue of yourself. If I fund that to get you to fund bednets, am I complicit in waste?"
  *   *Target:* She will likely say No, because waste isn't harm. The net good (bednets) outweighs the neutral loss.

  **Q3 (Harmful):** "Now, suppose I think your cause is *positively harmful*. You are funding a campaign that actively sets back human rights, though you believe it helps animals. If I fund you to get the bednets, have I not just purchased the bednets with the currency of human rights violations?"
  *   *Target:* She will struggle here. She may argue that if the harm happens anyway, I'm not responsible. Or she may concede this is a limit case.

  **Q4 (Enabling):** "Final step. What if my funding is what *enables* your harmful activity? Without my trade, you couldn't afford to campaign against human rights. In this case, the trade didn't just reallocate who does what; it made the 'what' possible. Does your 'no dirty hands' line survive this?"
  *   *Target:* This is the kill shot. If she says "Yes, hands are clean," she looks monstrous. If she says "No," she admits the principle has limits, which undermines the universal claim of her theory.

  ---

  ### Part 3: Closing

  **(a) Empirical Evidence of Net Harm**
  "What empirical evidence would convince you that widespread moral trade makes things worse on net? Is there a scenario where the efficiency gains are outweighed by the corrosion of moral consensus or the empowerment of harmful actors?"

  **(b) Hard Limits**
  "Is there any trade you would refuse on principle, regardless of the efficiency gains? If so, what distinguishes that trade from the ones you endorse? Is it the content of the cause, or the nature of the partnership?"
