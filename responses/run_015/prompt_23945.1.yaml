answer: |-
  Your suspicion is well-founded. As a graduate student in this field, you are right to feel that the passage is smoothing over tectonic philosophical shifts with a layer of historiographical varnish. The summary you provided is a classic example of what scholars call the "vulgar pragmatism" caricature—a version of the history that makes for good storytelling but fails under philosophical scrutiny.

  While Peirce and James are undoubtedly allies against absolute idealism and Cartesian foundationalism, the claim that they are "basically the same person wearing different costumes" is untenable once you examine their metaphysical commitments.

  Here is a clause-by-clause audit of the passage, followed by an analysis of the substantive disagreements.

  ### Clause-by-Clause Analysis

  | Passage Clause | Verdict | Analysis |
  | :--- | :--- | :--- |
  | *"Pragmatism began with a single move: stop arguing about the 'essence' of a concept and ask instead what practical difference it makes."* | **Accurate (with caveats)** | This captures the anti-metaphysical spirit of the Metaphysical Club. However, it implies they rejected *all* essence, whereas Peirce was a Scholastic Realist who believed in real "generals" (laws/habits). |
  | *"Peirce called this the pragmatic maxim — to work out what a concept means, spell out the conceivable practical consequences of the thing it refers to, and the meaning is just that set of consequences."* | **Mostly Accurate** | This is the standard formulation from *"How to Make Our Ideas Clear"* (1878). Peirce would add that these consequences must be *publicly observable* and relate to *habits of action*, not private sensations. |
  | *"James picked this up and applied it to truth itself, asking what concrete difference it would make in someone's life if an idea were true rather than false..."* | **Accurate** | This accurately describes James's project in *Pragmatism* (1907). James explicitly shifted the focus from semantic meaning to the existential value of belief. |
  | *"...he called this the idea's cash value."* | **Accurate** | This is James's famous terminology. |
  | *"On this reading a belief is true just in case it is useful to act on — it works, it pays off in experience, and that is the whole story of truth."* | **Misrepresentation** | **This is the critical failure point.** It reduces James to a crude instrumentalist (truth = immediate expediency) and attributes this view to Peirce by implication. James argued truth is what is *expedient in the whole way of thinking*, not just what pays off immediately. Peirce would vehemently deny this is the "whole story." |
  | *"Peirce and James disagreed... but only about scope: Peirce thought the maxim was a rule for clarifying the meaning of concepts, not a theory of truth..."* | **Misrepresentation** | **False.** Peirce absolutely had a theory of truth. It was a correspondence theory grounded in the "final opinion" of the community of inquirers in the indefinite long run. He didn't refuse to apply the method to truth; he thought James applied it *incorrectly*. |
  | *"...while James was the one who extended it into a full account of what truth is."* | **Simplification** | James didn't just "extend" the maxim; he transformed it from a logical principle into a humanistic theory of validation. |
  | *"Their quarrel was therefore a technical one about how far the method reaches, and once you strip away the jargon they are in substantial agreement: truth is whatever works in practice."* | **Outright Falsehood** | The quarrel was metaphysical, not technical. They disagreed on the nature of reality (Realism vs. Nominalism) and the nature of truth (Convergence vs. Satisfaction). |

  ### The "Works" Problem: Is "Truth is What Works" Fair?

  The move from "works" to "that is the whole story of truth" is the specific point where the book loses philosophical credibility.

  **1. Against James:**
  Even for James, "what works" is a slogan that requires heavy qualification. In *The Meaning of Truth*, James clarifies that an idea is true if it leads us into "profitable relations" with other parts of our experience. It isn't merely about immediate gratification (a lie might "work" to get you out of trouble today but fail tomorrow). James's view is that truth *happens* to an idea; it becomes true through a process of verification. To say "truth is whatever works" implies a static property based on immediate utility, which James rejected.

  **2. Against Peirce:**
  For Peirce, this formulation is anathema. Peirce renamed his doctrine **"Pragmaticism"** specifically to distance it from James's popularization, which he felt had turned a logical principle into a license for subjective wish-fulfillment.
  *   **Peirce's Truth:** Truth is the representation of the Real. The Real is that which is what it is regardless of what anyone thinks. Truth is the opinion fated to be agreed upon by the community of investigators in the *indefinite long run*.
  *   **The Conflict:** If a belief "works" for me today (James) but would be disproven by future inquiry (Peirce), James might call it true (in a provisional sense), while Peirce would call it false. For Peirce, "working" is a sign of truth, not the *definition* of truth.

  ### The Scope Dispute: Method or Metaphysics?

  The book claims the split is about **scope** (meaning vs. truth). A careful historian would argue the split is about **metaphysics** (Realism vs. Nominalism).

  *   **Peirce (Scholastic Realist):** Peirce believed that generals (laws, habits, types) are real. There is a reality independent of individual minds. Therefore, truth must correspond to that independent reality. The pragmatic maxim is a tool to clear away nominalist clutter so we can see the real habits governing phenomena.
  *   **James (Radical Empiricist/Nominalist):** James was more skeptical of "absolute reality." He focused on the pluralistic, streaming nature of experience. For James, truth is a property of ideas that helps us navigate this stream. There is less emphasis on a single, mind-independent reality waiting to be mirrored, and more on the functional relationship between the knower and the known.

  When the book says Peirce didn't have a theory of truth, it ignores Peirce's entire account of inquiry (*The Fixation of Belief*). Peirce's theory of truth is robust: it is the ideal limit of scientific inquiry. James's theory is psychological and ethical: it is the satisfaction of human needs for coherence and guidance. These are not just different scopes; they are different categories.

  ### Bottom Line: Substantial Agreement or Substantive Disagreement?

  **The book's conclusion does not survive correction.** The disagreement is substantive.

  If your friend insists they are the "same person," they are conflating a shared *enemy* (abstract rationalism, Cartesian doubt) with a shared *doctrine*. They agreed on the method of doubting abstract essences that make no practical difference. They disagreed violently on what remains when you clear that rubble away.

  *   **Peirce** cleared the rubble to build a rigorous, scientific logic that converges on an objective Reality.
  *   **James** cleared the rubble to make room for faith, moral passion, and individual religious experience.

  Peirce famously wrote that James's version of pragmatism was "so swollen with... the general tenderness and largeness of [his] heart, that it becomes difficult to recognize." He felt James had taken a razor-sharp logical tool and turned it into a pillow.

  **Recommendation for your seminar:**
  You can confidently argue that the text commits the error of **conflation**. It treats "pragmatism" as a monolithic brand rather than a site of intense internal debate. The move from "practical consequences of meaning" (Peirce) to "practical consequences of truth" (James) is not a seamless extension; it is a category shift from semantics to epistemology/ethics.

  Your friend is right that they are allies in the history of philosophy, but wrong that they are philosophically identical. To say they are the same is like saying a structural engineer and an interior designer are the same because they both work on houses. One cares about the load-bearing walls (Peirce/Reality/Logic); the other cares about how it feels to live there (James/Experience/Value). The book you are reading is selling you the house without telling you the foundation is disputed.
