answer: |-
  # WORKSHOP HANDOUT: DECISION TREE FOR TEMPORAL DISCOUNTING
  **Committee on Long-Horizon Capital Projects | Policy Graduate Workshop**

  **Instructions:** This tree sorts ethical positions on the social discount rate. Start at Node 1. Answer based on your intuitive judgment of the case presented, not on what you think the "economic" answer should be. Follow the arrows to your leaf position.

  ### THE TREE

  **Node 1: The Certain Beneficiary (Case: Known Cohort)**
  *Stipulation:* We know specific people in Year 200 will exist, are identifiable, and will be no richer than us.
  *Question:* Do we value a benefit to them as less than a benefit to us *solely* because they live later?
  *   **A:** Yes, temporal position itself reduces value. → Go to **Node 4**.
  *   **B:** No, time is neutral if existence is certain. → Go to **Node 2**.
  *   **C:** Only if the *claim* on us weakens, not the benefit value. → Go to **Node 6**.

  **Node 2: Risk vs. Rate (Case: Sea Wall Existence)**
  *Stipulation:* There is a substantial chance no beneficiaries will exist (e.g., civilization collapse).
  *Question:* Do you record this as a lower probability of benefit or a higher discount rate?
  *   **A:** Higher discount rate (bundles risk into the rate). → Go to **Node 4**.
  *   **B:** Lower probability (keeps rate pure). → Go to **Node 3**.

  **Node 3: Endogenous Risk (Case: Wall Reduces Collapse)**
  *Stipulation:* Building the wall *reduces* the chance of collapse.
  *Question:* Does your method from Node 2 change?
  *   **A:** No, method is stable. → **Leaf: Hazard-Only View**.
  *   **B:** Yes, probability approach fails here (need rate). → **Leaf: Hybrid Risk-Preference**.
  *   **C:** Yes, rate approach fails here (need probability). → **Leaf: Hazard-Only View**.

  **Node 4: Time Structure (Case: Gap 100-101 vs. 0-1)**
  *Question:* Is the moral weight lost between year 100 and 101 the same as between year 0 and 1?
  *   **A:** Yes (Constant Rate). → Go to **Node 5**.
  *   **B:** No, later gaps matter less (Declining Rate). → **Leaf: Declining-Rate View**.
  *   **C:** No, later gaps matter more (Increasing Rate). → **Leaf: Unnamed: Future-Bias**.

  **Node 5: Prudential Discounting (Case: Own Discomfort)**
  *Question:* Is it rational to prefer a headache next year over one today, solely due to timing?
  *   **A:** Yes (Prudential discounting is rational). → Go to **Node 7**.
