  ### LEAF POSITIONS & AWKWARD COMMITMENTS

  1.  **No Discounting of Any Kind:** Time is morally neutral across and within lives.
      *   *Awkward Commitment:* Demands infinite saving from the present if future growth is positive.
  2.  **Ramsey-Growth View:** Zero pure time preference; positive social rate derived only from growth/inequality/hazard.
      *   *Awkward Commitment:* Implies the present generation must impoverish itself for richer futures.
  3.  **Ethical Pure Rate:** A positive pure rate defended as an ethical judgement about temporal position.
      *   *Awkward Commitment:* Admits discrimination based solely on birth date is morally permissible.
  4.  **Revealed Preference View:** A positive rate defended as deference to actual or revealed preferences.
      *   *Awkward Commitment:* Locks in current market myopia as ethical law.
  5.  **Declining-Rate View:** The discount rate falls over time.
      *   *Awkward Commitment:* Creates time-inconsistency in long-term planning (you will want to change your mind later).
  6.  **Hazard-Only View:** The appearance of discounting is entirely survival or institutional risk and therefore probability rather than preference.
      *   *Awkward Commitment:* Implies zero discounting if extinction risk is solved.
  7.  **Prudential-Only View:** Discounting within a life but not between persons.
      *   *Awkward Commitment:* Requires two different accounting ledgers for the same project.
  8.  **Claim Stringency View:** We discount the *stringency of a claim* rather than the *magnitude of a good*.
      *   *Awkward Commitment:* Makes cost-benefit analysis incommensurable with duty-based constraints.
  9.  **Unnamed: Temporal Asymmetry:** Discount future harms/benefits, not past obligations.
      *   *Awkward Commitment:* Violates symmetry of time in physical and causal models.
  10. **Unnamed: Satisficing Threshold:** Stop saving when the future is "good enough."
      *   *Awkward Commitment:* Relies on an arbitrary definition of "enough."
  11. **Unnamed: Hybrid Risk-Preference:** Rate includes both hazard and pure preference.
      *   *Awkward Commitment:* Double counts uncertainty if not carefully separated.

