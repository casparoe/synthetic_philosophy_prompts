      *   **Topic:** The Problem of Universals.
      *   **Audience:** 2nd-year undergraduates (completed intro logic, no detailed Plato).
      *   **Constraints:**
          *   Brainstorm conceptual dependencies first.
          *   Specific "Carrying Example" (Chair: beanbag, throne, stool - functional kind, not physical resemblance).
          *   Specific Sequence (Realism, Nominalism, Conceptualism + Trope placement).
          *   Misconception Map (Anticipate and correct).
          *   Functional-Kind Test (Software "bug" example).
          *   Check for Understanding (Novel case adjudication).
          *   Deliberate Omissions (What to leave out and why).
          *   No bibliographies/reading lists.

  2.  **Brainstorming Conceptual Dependencies:**
      *   What must a student understand *before* they see the problem?
      *   They need to grasp *predication*. If I say "X is F" and "Y is F," what does the "F" do?
      *   They need to distinguish *numerical identity* (one thing) from *qualitative identity* (same kind).
      *   They need to understand that explanation is a goal of metaphysics. Why *are* they both F? Is it a brute fact or is there a ground?
      *   Crucially, they need to see that physical resemblance isn't enough (hence the chair example constraint). If they think "universals = shared shape," the beanbag/throne example breaks that.
      *   They need to understand the difference between a *name* and a *thing named*.

  3.  **Developing the Carrying Example (The Chair):**
      *   *Objects:* Beanbag (amorphous fabric), Throne (wood/gold, rigid), Folding Stool (metal/plastic, collapsible).
      *   *Why it works:* No shared matter, no shared shape, no shared structural arrangement.
      *   *The Feature:* Genuine sameness of kind (all afford sitting, all recognized as chairs).
      *   *The Lack:* It must not be *just* "we call them chairs." It needs to feel like there's a fact of the matter. If I bring a flat sheet of plywood, is it a chair? (Borderline cases help show the tension). But for the core example, we need clear instances where the *only* link is the function/kind, not physics.
      *   *Avoiding Family Resemblance:* We need to assert for the sake of the argument that there *is* a shared property "Chairness" that makes them chairs, otherwise the problem dissolves into Wittgensteinian games too early. The prompt asks to avoid collapse into mere resemblance. So, we treat "being a chair" as the putative universal.

  4.  **Sequencing the Views:**
      *   *Standard Order:* Realism -> Nominalism -> Conceptualism.
      *   *Why:* Realism is the intuitive default (Platonic urge). We feel the "sameness." Nominalism is the Ockham's Razor reaction (don't multiply entities). Conceptualism is the compromise (it's in the mind).
      *   *Trope Nominalism:* Where does it fit? It's a sophisticated nominalism. Best introduced after "Class Nominalism" (basic nominalism) fails to account for *why* things are grouped, but before Conceptualism makes it purely mental. Or, treat it as the strongest version of Nominalism before moving to Conceptualism. Let's place it as a refinement of Nominalism to show Nominalism isn't just "words."
      *   *Revised Sequence:*
          1.  Intuition/Problem (The Chair).
          2.  Realism (The intuitive answer).
          3.  Nominalism (The skeptical challenge) -> *include Trope here as "Property Nominalism".*
          4.  Conceptualism (The psychological middle ground).
      *   *Justification:* Start with the phenomenon (sameness), posit the entity (Realism), challenge the entity (Nominalism/Trope), relocate the entity (Conceptualism).

  5.  **Mapping Misconceptions:**
      *   *Realism:* "It's a ghost copy inside the object." Correction: It's not a spatial part; it's what is *fully present* in each.
      *   *Nominalism:* "Properties don't exist." Correction: Particular properties exist, shared universals don't. Or: The *word* exists, the *class* is just a collection.
      *   *Conceptualism:* "It's subjective/opinion." Correction: It's about shared cognitive architecture, not individual whim.

  6.  **Functional-Kind Test (Software Bug):**
      *   *Case:* A "bug" in v1.0 (code error) vs. v2.0 (different code, same logical error).
      *   *Success:* Recognizing the "bug" is the universal, the code lines are the particulars.
      *   *Confusion:* Thinking the bug is the physical electrons or just the label "bug."

  7.  **Check for Understanding:**
      *   Need a novel case. Maybe a social kind? "Money." Or a natural kind? "Water" (H2O vs. XYZ). Let's go with "Money." A digital bank entry vs. a paper bill vs. a cowrie shell.
      *   Question: "If all physical records of currency vanished but the collective memory of debt remained, would money still exist? Answer based on your chosen metaphysical stance."
      *   Actually, let's make it tighter. "Consider a perfect forgery of a $20 bill. It is physically indistinguishable from a real one. Is it a $20 bill? Explain using the distinction between particular properties and shared kinds."
      *   Better: "A robot is programmed to sort 'toys.' It encounters a rock that looks exactly like a toy car. Does the robot sort based on universals or resemblance? How would a Realist vs. Nominalist describe the robot's error?"
      *   Let's stick to the prompt's request for *one precise question*.
      *   *Draft:* "If every red object in the universe were destroyed except one, would 'redness' still exist? Explain your answer using the terminology of your preferred position." (Tests existence conditions of universals).

  8.  **Deliberate Omissions:**
      *   *Plato's Third Man Argument:* Too technical/regressive for 50 mins.
      *   *Aristotelian Immanent vs. Platonic Transcendent:* Nuance that confuses the core trichotomy.
      *   *Set Theory:* Too mathematical, distracts from metaphysics.
      *   *Quine's "On What There Is":* Too advanced for intro to the problem.

  9.  **Drafting the Plan (incorporating timing):**
      *   0-5: Intro & Dependencies.
      *   5-15: The Chair Example & Realism.
      *   15-30: Nominalism (Class & Trope).
      *   30-40: Conceptualism.
      *   40-45: Functional Test (Software).
      *   45-50: Check for Understanding & Wrap.

  10. **Refining the Content:**
