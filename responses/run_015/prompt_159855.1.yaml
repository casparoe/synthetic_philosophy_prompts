          *   Distinguish between settled consensus and live academic fights (don't dress up contested views as consensus).
          *   Admit uncertainty where appropriate.

  2.  **Analyze the 6 Views:**
      *   *View 1 (One-shot PD):* Defect. Rationality requires it. Rejects "what if everybody did that" (Kantian/UDT reasoning).
      *   *View 2 (Finite Iterated PD):* Defect from round 1. Backward induction is correct.
      *   *View 3 (Real Relationships):* Cooperate. Tit-for-Tat (TFT). Morality = reciprocity + emotions.
      *   *View 4 (Group Selection):* Rejection. Kin selection/gene-level interest explains it better.
      *   *View 5 (Large Scale Human Cooperation):* Humans cooperate with strangers at scale. Believes reciprocity (View 3) scales up without needing group/cultural selection.
      *   *View 6 (Self-Training):* Rational to train oneself to be cooperative automatically (heuristics) because most interactions are open-ended. Exception: Tipping in passing (one-shot).

  3.  **Evaluate Internal Consistency & External Validity:**

      *   *Tension 1: View 1/2 vs. View 6.*
          *   View 1 & 2 say strict rationality = defection in one-shot/finite known games.
          *   View 6 says it's rational to train oneself to cooperate *automatically*.
          *   *Resolution:* View 6 acknowledges this by saying "nearly all interactions are open-ended." The tipping exception aligns with View 1. This is actually quite consistent *if* one accepts that cognitive costs/errors make strict calculation suboptimal. This is a "bounded rationality" argument. Not a fatal tension, but requires nuance.

      *   *Tension 2: View 5 vs. View 3/4.*
          *   View 5 claims reciprocity (View 3) explains large-scale stranger cooperation without group selection (View 4).
          *   *Problem:* Standard reciprocity (direct or indirect) struggles to explain *massive* scale cooperation among *anonymous* strangers where reputation tracking is impossible (e.g., tax compliance, anonymous online contributions, blood donation). Direct reciprocity requires repeated interaction. Indirect reciprocity requires reputation. If View 1 says "anonymous/no reputation = defect," then View 5 contradicts View 1 regarding real-world large-scale cooperation.
          *   *Academic Status:* This is a *huge* live fight. View 5 is the weak link empirically. Many evolutionary theorists argue reciprocity *alone* cannot explain human ultra-sociality. Strong reciprocity, cultural group selection, or norm psychology are often invoked.
          *   *Severity:* High. This is the biggest empirical gap in the user's model.

      *   *Tension 3: View 2 (Backward Induction) vs. Reality.*
          *   View 2 insists backward induction is "just correct."
          *   *Academic Status:* In classical game theory with common knowledge of rationality, yes. In behavioral game theory and evolutionary contexts, no. People don't play this way. If everyone played this way, cooperation would collapse.
          *   *Severity:* Moderate. It's theoretically sound in a narrow frame but practically brittle.

      *   *Tension 4: View 4 (Group Selection).*
          *   User rejects group selection as "confusion."
          *   *Academic Status:* This is contested. "Old" group selection (Wynne-Edwards) was largely debunked. "New" group selection (Multilevel Selection Theory - MLS) is mathematically equivalent to kin selection in many models but offers different heuristic value. Many biologists (e.g., Nowak, Wilson) argue MLS is useful for human cultural evolution.
          *   *Severity:* Low to Moderate. It's more of a semantic/modeling preference than a factual error, *unless* it prevents explaining View 5.

