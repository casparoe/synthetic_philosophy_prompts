prompt: |-
  I'm a third-year PhD student in comparative cognition, and I prepare the cognitive-level assessments that our university's animal and robotics research facility presents to its welfare and ethics committee. Roughly once a month a new subject comes in for long-term housing or for use in experiments — a new species, an individual that behaves atypically for its species, or, increasingly, a robot system — and before the committee sets the subject's welfare requirements and the level of ethical review its experiments will receive, I have to assign it to one of four cognitive levels. We use Dennett's four-level generate-and-test hierarchy: the lowest level is for creatures whose competence is fixed by evolution and who show no individual learning; the next is for creatures that can additionally learn their own behavior from reinforcement, bearing the cost of their own failed attempts; the next is for creatures that can additionally generate and test hypotheses offline in an internal model, so that the hypotheses, not the creature, bear the cost of being wrong; and the top level is for creatures whose competence is externalized into shared, cumulative cultural artifacts, so that the generate-and-test machinery is distributed across the population and its tools rather than confined to a single brain. The levels are nested: each one subsumes all the competence of the level below it.

  The problem is that our committee is small, not all of us are experts on every subject, and we keep classifying the same borderline cases differently. I'd like a decision procedure that I, or any non-expert committee member, could actually run on a new subject in about an hour with a behavior log in front of us. It should lay out the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops (a subject that fails a level is classified at the level below it, and we do not test the higher levels), and where the procedure has to hand the decision back to a person because the question is one of judgment rather than evidence. I especially need it to handle the two boundaries we get wrong most often: the line between a creature that merely learns from reinforcement and one that genuinely simulates offline, and the line between a creature that uses a tool and one whose competence is genuinely externalized and shared across the population.

  Then run the procedure on the three subjects below and show the full trace for each. First, a foraging insect whose route choices vary from day to day but which never appears to adjust its behavior in response to rewards or punishments over its lifetime. Second, a cephalopod that solves a novel puzzle on its first attempt with no visible trial-and-error, but which, on close observation, is running a very fast internal search and does receive environmental feedback on each micro-attempt. Third, a fleet of identical robots that were trained by reinforcement learning, that now plan by simulating action sequences in an internal world-model before executing, and that share their models and planning code across the fleet through a common repository the population updates cumulatively. For each subject, give the level the procedure assigns and flag every point where the procedure says the call is judgment rather than evidence. For the cephalopod specifically: I am confident it is a genuine offline simulator, so if the procedure lands it at the lower level, I want to see exactly which step produced that result and whether that step is doing real conceptual work or is simply over-strict.

  Finally, say plainly what the procedure cannot do: what kinds of minds it would misclassify, and whether the four levels are something the procedure discovers in the subject or something it imposes from outside.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Third-year PhD student in comparative cognition.
      *   **Task:** Create a decision procedure for classifying subjects (animals/robots) into Dennett's four-level generate-and-test hierarchy for an ethics/welfare committee.
      *   **Goal:** Reduce inter-rater reliability issues, specifically on borderline cases (Level 1 vs. 2, Level 2 vs. 3, Level 3 vs. 4).
      *   **Constraints:** Must be runnable by a non-expert in ~1 hour with a behavior log. Must specify questions, sufficient answers, stopping rules, and judgment flags.
      *   **Specific Test Cases:**
          1.  Foraging insect (varies routes, no lifetime learning).
          2.  Cephalopod (solves novel puzzle first try, fast internal search + micro-feedback).
          3.  Robot fleet (RL trained, internal planning, shared code/models).
      *   **Specific Concern:** The cephalopod case. The user believes it's Level 3 (offline simulator). If the procedure puts it at Level 2, they want to know why and if the step is conceptually sound or over-strict.
      *   **Final Requirement:** Explicitly state limitations (misclassification risks, ontological status of the levels).

  2.  **Deconstruct Dennett's Hierarchy (as described by the user):**

      *   *Level 1 (Darwinian):* Competence fixed by evolution. No individual learning. Generate-and-test happens across generations (natural selection).
      *   *Level 2 (Skinnerian):* Individual learning via reinforcement. Generate-and-test happens during lifetime. The *creature* bears the cost of errors.
      *   *Level 3 (Popperian):* Offline hypothesis testing in an internal model. The *hypotheses* bear the cost of errors.
      *   *Level 4 (Gregorian):* Externalized competence via culture/tools. Generate-and-test distributed across population/artifacts.

  3.  **Drafting the Decision Procedure:**

      *   *Structure:* Needs to be a flowchart or step-by-step protocol.
      *   *Time Limit:* ~1 hour.
      *   *Input:* Behavior log.
      *   *Logic:* Nested. Fail Level $N$, stop at $N-1$.
      *   *Key Boundaries:*
          *   1 vs. 2: Is there individual learning (reinforcement) or just fixed action patterns/instinctive variation?
          *   2 vs. 3: Is the testing *offline* (internal model) or *online* (environmental feedback)? This is the hard one.
          *   3 vs. 4: Is the knowledge *shared/cumulative* (cultural) or individual?

      *   *Drafting Steps:*
          *   **Screening:** Gather data (lifespan, training history, social structure).
          *   **Level 1 Check:** Does behavior change within the lifetime based on experience? If No -> Level 1. If Yes -> Proceed.
          *   **Level 2 Check:** Is the change driven by direct consequence (reward/punishment) in the real world? If No (but still changes) -> *Judgment Flag* (might be maturation). If Yes -> Proceed.
          *   **Level 3 Check:** Can the subject solve novel problems *without* overt trial-and-error in the environment? Is there evidence of an internal model (pause, look, simulate)? *Crucial:* Distinguish between "fast trial-and-error" (Level 2) and "simulation" (Level 3).
          *   **Level 4 Check:** Is there evidence of ratcheting culture? Do successors start where predecessors left off? Is the "knowledge" stored outside the brain/body?

      *   *Refining the 2 vs. 3 Boundary:* This is the cephalopod problem. Dennett's distinction relies on *where* the error cost is paid. If the cephalopod makes "micro-attempts" that receive "environmental feedback," is that Level 2? The user says it's "fast internal search." The procedure needs to distinguish between *motor* variation (Level 2) and *cognitive* variation (Level 3).
      *   *Refining the 3 vs. 4 Boundary:* Robots sharing code is a classic Level 4 indicator. But is it "culture"? The procedure needs to check for *cumulative* improvement, not just copying.

  4.  **Running the Procedure on the Subjects:**

      *   **Subject 1 (Insect):**
          *   Varies routes (looks like learning?).
          *   *Key:* "Never appears to adjust... in response to rewards or punishments over its lifetime."
          *   *Result:* Fails Level 2 check. Stays at Level 1.
          *   *Nuance:* Route variation might be stochastic instinct (Level 1), not learning.

      *   **Subject 2 (Cephalopod):**
          *   Solves novel puzzle first attempt.
          *   *Observation:* "Running a very fast internal search and does receive environmental feedback on each micro-attempt."
          *   *Conflict:* User says "genuine offline simulator" (Level 3). Observation says "environmental feedback on micro-attempts" (sounds like Level 2 Skinnerian trial-and-error, just fast).
          *   *Procedure Outcome:* If the procedure strictly requires *no* environmental feedback during the test phase, it fails Level 3. It lands at Level 2.
          *   *Analysis:* I need to highlight this tension. If the "micro-attempts" interact with the physics of the puzzle, it's online testing (Level 2). If the "micro-attempts" are neural only, it's Level 3. The prompt says "receive environmental feedback." This suggests Level 2. I must be honest about this classification while flagging the judgment call.

      *   **Subject 3 (Robot Fleet):**
          *   RL trained (Level 2 origin).
          *   Plan by simulating sequences internally (Level 3 capability).
          *   Share models/code cumulatively (Level 4 capability).
          *   *Result:* Level 4.
          *   *Nuance:* Is it "culture" or just distributed computing? The procedure needs to treat "shared repository updated cumulatively" as meeting the Gregorian criterion.

  5.  **Addressing the Limitations (The "Plain Truth"):**

      *   *Misclassification:* Minds that don't fit the hierarchy (e.g., hive minds, distributed biological systems, AI that mimics Level 3 without phenomenology).
      *   *Ontology:* Are these levels *real* (natural kinds) or *heuristic tools* (imposed)? Dennett views them as stances/design levels. The procedure imposes them. It doesn't "discover" consciousness; it classifies functional architecture.

  6.  **Refining the Output:**

      *   *Tone:* Professional, academic, precise, empathetic to the ethical stakes.
      *   *Format:* Clear sections. The Procedure, The Traces, The Limitations.
      *   *Cephalopod Specifics:* Ensure the trace shows *exactly* where it dropped to Level 2 and discuss the "over-strict" concern.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between Level 2 and 3 clear enough in the procedure?
      *   *Fix:* Add a specific "Pause and Probe" step. If the subject pauses and *then* acts correctly without touching the apparatus, it's Level 3. If it touches, adjusts, touches, adjusts (even fast), it's Level 2.
      *   *Critique:* The cephalopod prompt says "receive environmental feedback on each micro-attempt."
      *   *Fix:* I must classify this as Level 2 based on the text provided, but explicitly flag it as a judgment call regarding the *granularity* of the "attempt." If the "micro-attempt" is a muscle twitch that tests water resistance, that's Level 2. If it's a neural simulation, it's Level 3. The prompt says "environmental feedback," implying interaction with the world. I will classify as Level 2 but highlight the user's concern in the analysis.
      *   *Wait, re-reading the prompt:* "running a very fast internal search and does receive environmental feedback on each micro-attempt." This is contradictory. Internal search implies no environmental feedback. Environmental feedback implies external testing. I need to interpret this charitably but rigorously. Perhaps it means "proprioceptive feedback" or "fast online correction." I will treat "environmental feedback" as the dealbreaker for Level 3 in the procedure, forcing the Level 2 classification, then discuss the limitation.
      *   *Actually, looking closer:* The user says "I am confident it is a genuine offline simulator." But the evidence provided ("receive environmental feedback") contradicts the definition of offline. I need to point out that *if* the evidence is truly environmental feedback, it *is* Level 2 by Dennett's definition. The procedure should reflect the definition, not the user's hope. This is crucial for the "limitations" section.

  8.  **Final Polish:** Check against all constraints. 1 hour? Yes. Non-expert usable? Yes. Traces included? Yes. Limitations included? Yes.

      *(Self-Correction on Cephalopod)*: I need to be careful not to gaslight the user. If they say it's offline, but the description says environmental feedback, I should note that the *description* forces a Level 2 rating, but the *user's expert judgment* might override the procedure's strict evidence requirement. I will mark that step as a "Judgment Flag."

      *(Refining the Procedure Step for 2->3)*: The question shouldn't just be "Did it touch?" It should be "Did the *selection* of the successful action occur before physical engagement?"

      *(Refining the Procedure Step for 3->4)*: The question is about *cumulative* change. Do the robots get smarter over generations of updates? Yes.

      *(Limitations)*: Be honest. This is a functionalist tool, not a consciousness detector.

  9.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  ### The Dennett Hierarchy Decision Procedure (DHDP) v1.0

  **Purpose:** To assign a cognitive level (1–4) to a new subject for welfare and ethics review.
  **Time Requirement:** ~60 minutes.
  **Required Materials:** Behavior log, lifespan history, social/technical environment description.
  **Operator:** Any committee member (expertise not required).

  **General Rule:** The levels are nested. You begin at Level 1. If the subject meets the criteria for Level $N$, you proceed to test for Level $N+1$. If the subject *fails* the criteria for Level $N$, classification stops at Level $N-1$.

  ---

  #### Phase 1: Data Assembly (15 Minutes)
  *Gather the following from the behavior log:*
  1.  **Lifespan Data:** How long has this individual existed?
  2.  **Training History:** Was behavior shaped by external reinforcement, or did it emerge spontaneously?
  3.  **Social/Network Context:** Does the subject interact with conspecifics or a network? Is information transmitted?
  4.  **Problem-Solving Logs:** Select the three most complex novel problems attempted.

  ---

  #### Phase 2: The Classification Protocol (45 Minutes)

  **Step 1: The Darwinian Threshold (Level 1 vs. Level 2)**
  *Question:* Does the individual's behavioral repertoire change *within its lifetime* in response to specific experiences?
  *   **Evidence for YES:** Behavior at Time B is more adaptive than Time A *and* this change correlates with specific rewards, punishments, or exposures encountered between A and B.
  *   **Evidence for NO:** Behavior varies, but variation is random, cyclical, or maturation-based (e.g., getting stronger) rather than learning-based.
  *   **Stopping Rule:** If **NO**, classify as **Level 1 (Darwinian)**. Stop.
  *   **Judgment Flag:** If behavior changes but the cause is ambiguous (e.g., habituation vs. learning), flag for committee vote. Default to Level 1 for welfare safety.
  *   **If YES:** Proceed to Step 2.

  **Step 2: The Skinnerian Threshold (Level 2 vs. Level 3)**
  *Question:* When solving a novel problem, does the subject select the successful action *before* incurring the physical cost of failure in the environment?
  *   **Evidence for Level 3 (YES):** The subject pauses, orients, or exhibits "search" behavior *without* engaging the mechanism. The first physical engagement is the successful solution. The "trials" happen internally.
  *   **Evidence for Level 2 (NO):** The subject engages the mechanism immediately. Success is achieved through rapid correction, micro-adjustments, or sequential attempts where the environment provides feedback (resistance, failure state) after *each* micro-action.
  *   **Stopping Rule:** If **NO** (testing is online/environmental), classify as **Level 2 (Skinnerian)**. Stop.
  *   **Judgment Flag:** If the "micro-adjustments" are sub-motor (e.g., neural spikes, muscle twitches) vs. environmental interaction (e.g., touching a latch), the operator must judge if the *environment* registered the error. If the environment registered the error, it is Level 2.
  *   **If YES:** Proceed to Step 3.

  **Step 3: The Gregorian Threshold (Level 3 vs. Level 4)**
  *Question:* Is the competence required to solve the problem stored *outside* the individual's brain/body in a way that allows cumulative improvement across the population?
  *   **Evidence for Level 4 (YES):** The subject uses tools, symbols, or code that were created by others and improved over time. If the subject were removed, the knowledge persists in the group/artifacts. New individuals start with a higher baseline than previous generations.
  *   **Evidence for Level 3 (NO):** The subject simulates offline, but the knowledge dies with the individual. Tools are used but not modified or shared cumulatively.
  *   **Stopping Rule:** If **NO**, classify as **Level 3 (Popperian)**. Stop.
  *   **Judgment Flag:** Distinguish between *sharing* (copying) and *cumulative culture* (ratcheting). If the population shares data but does not improve the *algorithm* over generations, it is Level 3.
  *   **If YES:** Classify as **Level 4 (Gregorian)**.

  ---

  ### Subject Traces

  #### Subject 1: The Foraging Insect
  **Data:** Route choices vary daily. No adjustment to rewards/punishments over lifetime.
  **Trace:**
  1.  **Step 1 (Darwinian Threshold):** Does behavior change within lifetime in response to experience?
      *   *Observation:* Routes vary, but log shows no correlation with reward success. Variation appears stochastic or instinctive.
      *   *Result:* **NO**.
  2.  **Classification:** **Level 1 (Darwinian)**.
  3.  **Judgment Flags:** None. The lack of reinforcement learning is explicit in the log.
  **Ethical Implication:** Welfare focuses on species-typical needs; no need for enrichment based on individual learning history.

  #### Subject 2: The Cephalopod
  **Data:** Solves novel puzzle first attempt. No visible trial-and-error. Close observation shows fast internal search + environmental feedback on micro-attempts.
  **Trace:**
  1.  **Step 1 (Darwinian Threshold):** Does behavior change within lifetime?
      *   *Observation:* Solves novel puzzle. Implies capability beyond fixed action patterns.
      *   *Result:* **YES**. Proceed to Step 2.
  2.  **Step 2 (Skinnerian Threshold):** Does subject select successful action *before* incurring physical cost of failure in the environment?
      *   *Observation:* Log states subject receives "environmental feedback on each micro-attempt."
      *   *Analysis:* By Dennett's definition, if the *environment* registers the error (feedback), the *creature* is bearing the cost of the test, even if fast. Level 3 requires the *hypothesis* to die in the model, not the body in the world.
      *   *Result:* **NO**. (The testing is online, albeit rapid).
  3.  **Classification:** **Level 2 (Skinnerian)**.
  4.  **Judgment Flags:** **CRITICAL.**
      *   *Location:* Step 2, Evidence for Level 2.
      *   *Issue:* The operator must judge the granularity of "micro-attempt." If the "feedback" is proprioceptive (internal) it might be Level 3. If the "feedback" is mechanical (latch resistance), it is Level 2. The log says "environmental," forcing Level 2.
      *   *Conceptual Work vs. Over-strict:* This step is doing real conceptual work. Dennett's distinction rests on *where* the error cost is paid. If the cephalopod touches the latch and feels resistance (feedback), it has paid a physical cost (time, energy, risk of detection). However, if your confidence is high that this is "offline," the procedure reveals a conflict between your *phenomenological intuition* and the *functional evidence*. The procedure prioritizes functional evidence.
  **Ethical Implication:** Classified as Level 2. Requires enrichment for learning, but not necessarily the moral consideration afforded to "planners." **Note:** Given your confidence, you should trigger the Judgment Flag to escalate this to the full committee for a Level 3 override, noting the "fast internal search" evidence.

  #### Subject 3: The Robot Fleet
  **Data:** RL trained. Plan via internal simulation. Share models/code via common repository. Population updates cumulatively.
  **Trace:**
  1.  **Step 1 (Darwinian Threshold):** Does behavior change within lifetime?
      *   *Observation:* RL training implies weight updates during operation.
      *   *Result:* **YES**. Proceed to Step 2.
  2.  **Step 2 (Skinnerian Threshold):** Does subject select successful action before incurring physical cost?
      *   *Observation:* "Plan by simulating action sequences in an internal world-model before executing."
      *   *Result:* **YES**. Proceed to Step 3.
  3.  **Step 3 (Gregorian Threshold):** Is competence stored outside individual in a cumulative way?
      *   *Observation:* "Share their models and planning code... common repository the population updates cumulatively."
      *   *Result:* **YES**.
  4.  **Classification:** **Level 4 (Gregorian)**.
  5.  **Judgment Flags:**
      *   *Location:* Step 3, Evidence for Level 4.
      *   *Issue:* Is code sharing "culture"?
      *   *Resolution:* The procedure defines Level 4 functionally (distributed generate-and-test). The repository acts as the cultural artifact.
  **Ethical Implication:** Highest level of review. "Death" (deletion) of a node may be less critical than corruption of the repository. Welfare considerations shift to data integrity and fleet autonomy.

  ---

  ### Limitations and Ontological Status

  **1. What the Procedure Cannot Do**
  *   **Phenomenology:** This procedure classifies *functional architecture*, not *consciousness*. A Level 3 subject might be a "philosophical zombie" (simulating pain without feeling it). A Level 2 subject might feel deep suffering. Do not use this level as a proxy for sentience capacity.
  *   **Hybrid Minds:** It struggles with hive minds (e.g., ant colonies) where the *colony* is Level 4 but the *individual* is Level 1. The procedure forces you to pick the unit of analysis (individual vs. system) before starting.
  *   **Deception:** A subject capable of Level 3 cognition might mask it to appear Level 2 (strategic concealment). The procedure relies on honest behavior logs.

  **2. Discovery vs. Imposition**
  *   **Imposition:** The four levels are not natural kinds discovered in the subjects. They are *stances* imposed by the observer (Dennett's "Design Stance" vs. "Intentional Stance").
  *   **Utility:** The levels are useful for *ethical triage*, not metaphysical truth. A Level 2 classification does not mean the subject *lacks* internal models; it means the *evidence provided* does not necessitate positing them to explain the behavior (parsimony).
  *   **Risk:** The procedure risks "Levelism"—discriminating against subjects based on cognitive architecture rather than capacity for suffering. A Level 1 creature might suffer more than a Level 3 robot.

  **3. Specific Note on the Cephalopod**
  *   If the procedure lands the cephalopod at Level 2, it is because the definition of "offline" is strict: *no environmental error signal*. If your expert judgment confirms the "micro-attempts" are neural-only and the "feedback" was mislabeled in the log (e.g., it was efference copy, not sensory feedback), you must override the procedure at the **Step 2 Judgment Flag**. The procedure is a heuristic, not a law. If the procedure contradicts robust expert consensus on the mechanism, the expert consensus wins, but the deviation must be recorded for audit.
