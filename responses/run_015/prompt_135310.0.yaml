          *   *Hacking View:* Hacking is skeptical of "what's really going on underneath" (realism vs. construction). But the idea that the label becomes *useless* isn't necessarily his point. The point is the classification interacts with the classified.
          *   *Verdict:* Wince. Too dismissive of clinical utility.
      *   *Claim 3:* "These are what Hacking called interactive kinds — the people classified can become aware of the classification and change, so the target moves..."
