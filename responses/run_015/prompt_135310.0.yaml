          *   *Verdict:* Accept. This is accurate.
      *   *Claim 4:* "...which is why they can never be natural kinds on the model of gold or a disease gene, which are indifferent to how we describe them."
          *   *Hacking View:* Yes, this is the contrast. Gold doesn't care if you call it gold. People do.
