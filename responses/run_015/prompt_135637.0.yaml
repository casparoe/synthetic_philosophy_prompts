  **About this space**
  Welcome to this charming 450 sq ft studio located in a stable dust region governed by Gödel's rotating metric. Perfect for singles or couples who dont believe in objective temporal passage. The unit features an open-concept present with non-chronological layout, allowing you to experience your morning coffee simultaneously with your evening wind-down. Large windows offer a breathtaking south-facing past, though visibility may vary depending on your proper time velocity.

  One of the biggest selling points is the commute. Why wait for tomorrow when you can arrive yesterday? The building is situated deep within the CTC zone, meaning closed timelike curves are accessible right from the kitchenette. Please note that while the space feels spacious, there are no global hyperplanes of simultaneity. This means coordinating dinner parties with guests from outside the metric can be tricky, as "now" is purely a local construct. Most tenants find the rotating universe adds a dynamic energy to the room, though some sensitive individuals may experience mild nausea due to the frame-dragging effects on the vestibular system.

  **Guest Access**
  Check-in is flexible. In fact, checkout technically precedes check-in but management handles the paperwork. Key exchange occurs at the front desk, or will have occurred, depending on your trajectory. We recommend bringing a watch, though Gödel himself argued it wont tell you anything real about the universe. The elevator services all local proper times, but please be aware that pressing "Ground Floor" may return you to the building's foundation before construction was completed.

  **House Rules**
  1. No smoking, no pets, no paradoxes exceeding Class 3 magnitude.
  2. Quiet hours are enforced across all local proper times.
