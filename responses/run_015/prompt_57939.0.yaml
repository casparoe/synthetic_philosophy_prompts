answer: |-
  The sample under the microscope did not breathe, not in any way Elara recognized, yet it lived. It was a lattice of cyanobacteria and mineral deposits, a shallow sea mat that had covered the planet's southern hemisphere for a billion years. It cycled carbon. It built stone. It possessed no nervous system, no capacity for pain, and no concept of self. It was merely there, ancient and indifferent.

  Elara lifted her head from the eyepiece. Outside the viewport of the *Aethelgard*, the planet Aurelia rotated, a swirl of toxic violet clouds masking the shallow seas below. Inside the ship, the air recyclers hummed with a weary rattle. They were failing. The diagnostics showed a steady decline in efficiency, a geometric curve pointing toward zero.

  The Charter lay open on her desk. It was the only law they had, drafted by ancestors who had died generations before Elara was born. Section 4 mandated the establishment of a self-sustaining human presence to hedge against catastrophe on Earth, with whom contact had been lost eighty years ago. Section 9 prohibited the supplantation of an existing biosphere.

  The two clauses were not merely in tension; they were mutually exclusive here. To breathe, humanity had to kill.

  The door chime sounded. Commander Halloway entered without waiting. He looked tired, the lines around his eyes deepened by the perpetual low-gravity ache that plagued the ship-born.

  " The Council is waiting, Elara," he said softly. "Have you certified the survey?"

  Elara touched the datapad. "The biosphere is contiguous. It's complex, Halloway. Not sentient, but... integrated. If we release the oxidizers, the mats die. The mineral structures collapse. We erase a billion years of history to make room for wheat and oxygen."

  "We erase rocks and slime to make room for children," Halloway corrected. He moved to the viewport, looking down at the violet swirls. "The scrubbers have six months. Maybe eight. The embryos in Cryo Bank Four are scheduled for decanting in ten. If we stay enclosed, we survive maybe another generation. Then the systems fail. We become a tomb."

  "And if we terraform?"

  "Then they grow up under a sun that isn't filtered through leaded glass. They run on soil that isn't recycled waste." Halloway turned to her. "You're weighing the intrinsic value of non-sentient life against the existence of future persons. It's not a close call."

  "It is if you consider consent," Elara said. "None of us chose to be born on this ship. None of us chose to be the generation that arrives. Now you ask us to choose for the unborn. Do they have a right to a planet, or do they have a right to exist at all costs?"

  "They have a right to a chance," Halloway said. "If we stay in the cans, their lives are predetermined by failing machinery. They are functions of the ship. If we go down, they become citizens of a world. Isn't that what the voyage was for? To stop being passengers?"

  Elara looked back at the microscope. The microbial mat was beautiful in its alien geometry. It had no voice. It could not argue for its right to continue cycling carbon. It relied on her to be its witness. But the embryos in Bank Four also had no voice. They relied on her to be their gateway.

  "The Charter says we shouldn't supplant," Elara murmured.

  "The Charter also says we must secure a presence," Halloway countered. "Earth is silent, Elara. We don't know if anyone is left there. If we don't plant humanity here, consciousness might die out in this sector. Are these mats worth the extinction of the only beings in the system who can know they exist?"

  It was the backup rationale. The argument that value requires a valuer. If humanity died, the beauty of the mats would go unobserved, unmeasured, meaningless. But was that arrogance? Or was it the tragic burden of being the only thing in the universe capable of asking the question?

  Elara thought of the children. She had never seen a child run on grass. She had only seen them float in the corridors. She thought of the risk of the enclosed habitats—the slow suffocation, the psychological decay, the certainty of an end within sight. Then she thought of the mats, silently building stone in the dark, disturbed by nothing until the shadow of the *Aethelgard* fell across them.

  "There is no clean hands here, Halloway," she said.

  "No," he agreed. "There never are."

  Elara picked up the stylus. Her hand hovered over the certification field. To sign was to authorize the release of the oxidizer canisters. It was an irreversible ecological replacement. It was murder, or it was birth. The philosophy didn't change the physics. The oxygen would kill the mats regardless of her justification.

  She considered the consent of the unborn. They could not consent to life in a tin can, nor could they consent to a world built on bones. But they could not consent to non-existence either. By choosing the mats, she chose the end of the human line. By choosing the humans, she chose the end of the alien line.

  She thought of the Charter's tension. It was not a mistake. The ancestors had known this moment might come. They had left the contradiction unresolved because they knew no algorithm could solve it. It required a moral agent to bear the weight.

  "If we stay," Elara said, her voice quiet, "we preserve the alien biosphere until we die. If we go, we destroy it to survive. Either way, the universe changes."

  "We change it," Halloway said. "That's what life does."

  Elara lowered the stylus. She did not feel righteous. She felt heavy, as if the gravity of the planet below had already reached up and grabbed her. She tapped the screen. The certification lock turned green.

  "Survey certified," she said. "Recommendation: Immediate terraforming release."

  Halloway exhaled, a long, shuddering breath. He nodded, once. "Thank you, Elara."

  He left the lab to initiate the sequence. Elara remained alone with the microscope. She did not turn it off. She watched the static image of the mat one last time. It was perfect in its purpose, unaware of its impending obsolescence.

  Down on the surface, the canisters fired. Invisible plumes descended through the violet clouds. The chemistry began. The oxygen would rise like a tide. The mats would suffocate, their carbon cycles broken, their structures crumbling into dust that would eventually feed the roots of trees that did not yet exist.

  Elara walked to the viewport. The clouds were beginning to shift, faint streaks of blue bleeding into the violet. It was beautiful. It was a funeral pyre. She placed her hand against the glass, waiting for the air outside to become something her children could breathe, wondering if they would ever forgive her, or if they would simply live, which was the only answer that would matter.
