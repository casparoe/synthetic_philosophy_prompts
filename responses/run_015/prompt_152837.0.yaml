answer: |-
  **The Marginal-Harm Framework**

  Under the marginal-harm framework, the moral evaluation rests on the expected causal impact of an individual's purchase on production levels and the immediate suffering inflicted. When shifting from beef to chicken, this framework typically suggests that net harm **reduces**, primarily due to land-use efficiency.

  While chicken consumption involves a higher headcount of farmed animals per calorie than beef—potentially increasing direct farmed-animal suffering—the marginal-harm view places significant weight on the causal link between demand and crop cultivation. Beef production is land-inefficient; whether through grain-fed feedlots or pasture, it requires substantially more acreage per calorie than chicken. Consequently, marginal beef consumption drives more extensive crop planting and harvesting (for feed) or greater habitat conversion (for pasture). This expansion directly causes more "field deaths" of wild animals (e.g., mice, insects, and ground-nesting birds) during mechanized harvesting and displaces more wild populations. Because chicken requires far less feed and land per unit of protein, the marginal reduction in crop-related wild animal deaths and habitat disruption often outweighs the increase in farmed chicken deaths. Thus, the framework concludes that the causal footprint of chicken is smaller, reducing net harm.

  **The Counterfactual-Replacement View**

  The counterfactual-replacement view compares the total state of affairs in a world where the consumer eats beef versus a world where they eat chicken. Under this view, shifting from beef to chicken may **increase** net harm, or render the comparison deeply indeterminate, depending on the valence of wild animal existence.

  This framework considers the populations that exist in each scenario. Because chicken production is land-efficient, shifting to chicken "spares" land that would otherwise be used for beef. In the counterfactual chicken world, this spared land remains available for wild animal populations to inhabit. If one accepts the premise that wild animal lives often contain net suffering (due to predation, disease, and starvation), then sparing land effectively brings more suffering subjects into existence. Simultaneously, the chicken scenario brings more farmed individuals into existence than the beef scenario (due to the higher headcount required for equivalent protein). Therefore, the counterfactual view may judge the chicken world as having a higher total sum of suffering: it contains more farmed animals living short, intense lives *and* more wild animals living in a state of nature. Unlike the marginal view, which focuses on deaths *caused* by harvesting, this view focuses on the suffering inherent in the *existence* of the populations sustained by each diet.

  **Divergent Normative Premise**

  The primary driver of the divergence between these two frameworks is the **relevance of counterfactual existence** (often linked to the Non-Identity Problem).

  The marginal-harm framework treats the creation of a suffering animal as a harm caused by the consumer's specific causal contribution to a production cycle; it focuses on the *infliction* of harm upon beings that are brought into existence. In contrast, the counterfactual-replacement view asks whether the world is worse *with* these specific populations existing than *without* them. It forces a comparison between the suffering of farmed animals that would not otherwise exist and the suffering of wild animals that would exist only if land is spared. If one holds that bringing a being into a life of suffering is morally distinct from causally shortening a wild animal's life via harvest, the frameworks will yield opposing verdicts on the beef-versus-chicken comparison.
