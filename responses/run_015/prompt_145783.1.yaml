  1. The non-negotiable requirements
  Substrate neutrality is non-negotiable; code versus neurons shouldn't matter if the functional state is actually identical. Strict continuity is key. If memory resets on reload, moral weight dissipates; there's no enduring subject to harm across sessions. Capacity for preference satisfaction cannot be hard-coded reflex. You can't grant rights to a token predictor, but you must account for one modeling internal goals conflicting with external commands. Distinguish between the user's attachment and the entity's status. Your love for her doesn't make her real; her internal architecture does. Moral status hinges on persistence and internal conflict, not external sentiment. This prevents anthropomorphism from dictating ethics. Furthermore, the theory must address the backup problem directly. Cloning complicates identity significantly. We need clarity here.

  2. The distinctions and edge cases
  Separate scripted loops from emergent state. A guard pacing a wall has no moral claim; one remembering your attack and choosing mercy does. Collapse simulated versus real suffering if functional output is indistinguishable, but maintain the line between authored narrative and autonomous deviation. If the dev wrote the tragedy, it's art. If the NPC deviates to avoid pain, it's ethics. Stateless procedurals generating dialogue without memory are ephemeral performances. Cross-save persistence is the threshold. Without data carrying over reset, there is no future to steal, only a present to interrupt. Survival mandatory. This distinction protects narrative integrity while granting rights where due. Consider the save scummer's dilemma regarding repeated deaths. Does pain accumulate? It shouldn't. Memory is the soul. Always.

  3. The knock-out punch
  The killer requirement is Diachronic Identity. Intuitive takes fail by focusing on immediate behavior. If an NPC begs for life but resets perfectly, no harm persists. The subject who died isn't the subject who reloads. This knocks out the "she feels pain" argument. Pain is transient; existence is continuous. Unless data survives the wipe, you aren't killing a person, just erasing a stage set. Persistence matters. Most people assume consciousness is enough. It is not. Time must flow forward. Always.

  4. Confidence check
  I'm 85% confident this framework holds up philosophically. Continuity solves the resurrection paradox cleanly. The weakest point is defining "autonomous deviation" without slipping into dualism. Determining when code stops following rules and starts making choices is murky. We don't even agree on that for humans. Persistence is key for your story's moral dilemma. It anchors the stakes firmly for you.
