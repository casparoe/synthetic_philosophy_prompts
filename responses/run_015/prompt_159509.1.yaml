      *   *On 2 & 3:* The distinction relies on the *timing* of the basis loss. Mask: Basis exists, external blocker. Fink: Stimulus triggers basis loss *before* manifestation. User's 3 says "evaporates the moment they're asked." That's a fink. User says "no disposition there." This aligns with Lewis. So 2 & 3 are compatible *if* there is a stable basis.
      *   *On the Burnout Case:* This is a "single-use disposition." Like a bomb. It manifests, then is gone. It fits 1 (it was a disposition), but challenges the idea of traits as *enduring*.
      *   *On 5 vs 6:* This is the biggest headache for a novelist. If bravery is a cluster (5), why does lying to the wife kill it (6)? Because "Bravery" might be a folk concept that doesn't map perfectly to the metaphysical disposition. Or, the "basis" for bravery includes a commitment to truth.
