  *(Self-Correction on 1 vs 4)*: If 1 says "no extra inner stuff," does that deny the causal basis? Usually, dispositionalists say the disposition *is* the property, or is *grounded* in a categorical basis. If 1 denies the basis, 4 collapses. I need to clarify that 1 likely means "no non-dispositional ghost," not "no physical basis." I will interpret 1 charitably as "No Dualist Soul."

