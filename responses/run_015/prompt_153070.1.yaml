      *   Direct answer to "Which is it?" and "What counts as progress?"

      *(Self-Correction during drafting)*: I need to make sure I don't just say "It's Hypothesis 1 and 2." I need to explain *why* that combination creates a logical lock. The lock is that Side A's evidence (RCTs on test scores) is irrelevant to Side B's fear (civic fragmentation), and Side B's evidence (segregation stats) is irrelevant to Side A's goal (escaping a failing school). They are playing different games.

      *Key Insight to add:* The "Flat Scores" finding is the perfect storm. If choice dramatically raised scores, Side B would have to concede on outcomes. If choice dramatically lowered scores, Side A would have to concede on efficacy. Because it's flat, Side A says "See? No harm!" and Side B says "See? All that disruption for nothing!" The *same* data point validates *both* priors. That is the specific mechanism of the stall.

  8.  **Finalizing the Argument:**
      *   Diagnosis: It's a category error compounded by a "null result" trap.
      *   Progress: Shift from "Does it work?" to "What are we willing to lose?" (Trade-off framing).

      *(Wait, one more thing)*: The user mentioned "nobody is left whose actual job is to say no." This refers to the loss of *Voice*. I should incorporate the Exit/Voice dynamic without naming Hirschman. It explains the systemic decay fear.

      *Okay, ready to write.*
answer: |-
  You are diagnosing this correctly, but you are treating your hypotheses as alternatives when they are actually layers of the same mechanism. The argument has stopped moving not because the evidence is ambiguous, but because the *null result* (flat scores) functions as a Rorschach test that validates both worldviews simultaneously, while the underlying disagreement is about the ontology of the school itself.

  Here is the breakdown of why the stall is structural, and what (if anything) could move it.

  ### 1. The Diagnosis: The "Null Result" Trap and the Ontological Clash

  Your first hypothesis (different objects) and second hypothesis (bedrock intuitions) are locked together. The reason the empirical evidence doesn't resolve the tension is that **the same empirical result supports opposite conclusions depending on which ontology you hold.**

  When studies show "flat outcomes" for choice vs. public:
  *   **The Pro-Choice Ontology (School as Service):** The goal is individual escape from a bad fit. If the test scores are flat, but the parent is satisfied and the child is safe, the intervention succeeded. The null result on scores proves that choice does not *hurt* academic outcomes while granting liberty. The conclusion: "No downside, huge upside in agency."
  *   **The Anti-Choice Ontology (School as Institution):** The goal is civic cohesion and equitable resource distribution. If the test scores are flat, but the system is now more stratified and the public option is drained of political capital, the intervention failed. The null result on scores proves that the disruption of sorting yielded *no academic gain* to justify the social cost. The conclusion: "All that fragmentation for zero gain."

  The argument stalls because "flat scores" is the one data point that allows both sides to claim vindication. If choice had skyrocketed scores, the institutionalists would be forced to concede on outcomes. If choice had tanked scores, the libertarians would be forced to concede on efficacy. Because it is flat, the debate slides immediately back to the bedrock intuitions you identified in your second hypothesis.

  However, you are missing a specific mechanism that makes these intuitions incommensurable: **The Exit/Voice Dynamic.**

  The pro-choice argument relies on *Exit* (leaving a bad situation). The anti-choice argument relies on *Voice* (staying to fix the situation). These are functionally incompatible at scale. You cannot have a system optimized for easy Exit that also maintains strong Voice, because the people most capable of exercising Voice (the organized, resourced parents you mentioned) are the first to Exit.

  The stall happens because Pro-Choice advocates treat the loss of Voice as an acceptable cost of individual liberty, while Anti-Choice advocates treat the loss of Voice as a catastrophic systemic failure. There is no metric for "civic capacity" or "bureaucratic accountability" that is robust enough to weigh against "my child is safe." One is a private good, the other is a public good. You cannot trade them mathematically.

  ### 2. The Homeschooling Complication

  Your third hypothesis regarding homeschooling is distinct but reinforces the stall. You are right that it is unfalsifiable in principle, but the deeper issue is that homeschooling removes the child from the *state's gaze entirely*.

  In charter/voucher debates, the state still funds and often regulates the outcome. In homeschooling, the state often relinquishes both. This shifts the argument from "How do we allocate public resources?" to "Does the child belong to the parent or the polity?"

  This makes the homeschooling debate even more stalled than the charter debate. With charters, you can measure funding flows and test scores. With homeschooling, the "systemic effect" is total invisibility. The anti-choice side fears the creation of a citizenry that has never encountered a peer outside their family's ideology; the pro-choice side sees this as the ultimate protection of liberty. Because the outcome (the adult citizen) takes 18 years to manifest and cannot be causally linked to the schooling method amidst other variables, this specific sub-debate is indeed permanently stalled.

  ### 3. What Would Count as Progress?

  You asked what would actually count as progress. Given the diagnosis above, **more studies will not move the needle.** We know the treatment effects are small and the sorting effects are real. We do not need more data to tell us what we already know.

  Progress would require a shift in the *question* from "Is choice good?" to "What specific trade-offs are we willing to codify?"

  **A. Abandon the "Free Lunch" Framing**
  The pro-choice movement often argues that choice creates a rising tide that lifts all boats (competition forces public schools to improve). The anti-choice movement argues choice creates a zero-sum game (sorting harms the left-behind).
  Progress would look like the pro-choice side admitting that *some* systemic degradation is the price of individual exit. If they admitted, "Yes, the public option will likely weaken politically, and we accept that risk for the sake of individual rescue," the argument becomes honest. Currently, they argue the public system will improve *because* of choice, which the evidence does not support. Dropping this claim would force the debate onto moral grounds where it belongs.

  **B. Design Constraints over Binary Choices**
  The debate is stuck on "Choice: Yes/No." Progress lies in "Choice: Under What Constraints?"
  If the fear is sorting (your anti-choice description), then the policy question isn't "ban vouchers," it is "design vouchers with transportation subsidies and weighted lotteries to prevent cream-skimming."
  If the fear is bureaucratic capture (your pro-choice description), the question isn't "abolish districts," it is "how do we lower the transaction cost for a poor parent to file a complaint?"
  Progress happens when the discussion moves to *mechanism design*. For example: A charter law that requires the charter to provide transportation is a different object than a charter law that does not. One mitigates the sorting effect; the other accelerates it. Treating all "choice" as the same object is a major source of the stall.

  **C. Measuring the "Voice" Variable**
  You noted that nobody is left whose job is to say no. This is the hardest metric to capture, but it is the only one that matters to the institutionalists. Progress would require political scientists to stop measuring only test scores and start measuring *political participation in school boards* or *PTA density* in high-choice vs. low-choice districts.
  If we could show that high-choice districts have 50% lower voter turnout in school board elections, that gives the institutionalists a concrete number to weigh against the "satisfaction" numbers of the choosers. It turns a philosophical worry into a ledger. It doesn't solve the moral conflict, but it clarifies the price tag.

  ### 4. Why You Should Expect No Progress

  Despite the above, you should likely expect no progress. Here is why:

  The debate is not actually about education. It is a proxy war for a larger disagreement about the legitimacy of the state.
  *   For the pro-choice parent, the district school is often experienced as a monopoly provider that is unresponsive to their needs. Their argument is about *dignity* and *agency*.
  *   For the anti-choice advocate, the district school is one of the last remaining physical spaces where a diverse public is forced to negotiate shared resources. Their argument is about *solidarity* and *democracy*.

  You cannot compromise between dignity and solidarity. You can manage the tension, but you cannot resolve it. The "flat scores" finding ensures that neither side can claim victory on efficiency, so they retreat to their moral fortresses.

  Furthermore, the "systemic" argument (Anti-Choice) requires patience and collective action, which are in short supply. The "individual" argument (Pro-Choice) offers immediate relief to a suffering parent. In a political environment driven by immediate grievances, the individual argument will always outpace the systemic argument, regardless of the long-term truth.

  **Summary:**
  The argument is stalled because it is a **category error** masquerading as an empirical dispute. Side A is arguing about **consumer welfare** (is my child better off?). Side B is arguing about **civic infrastructure** (is the republic healthier?). These are not the same game. The "flat scores" data allows both to claim they haven't lost.

  Progress is only possible if both sides admit they are talking about different goods. The Pro-Choice side must admit that individual exit may degrade collective capacity. The Anti-Choice side must admit that collective capacity sometimes fails the individual child catastrophically. Until that trade-off is explicitly acknowledged, you are watching two people argue over the price of a ticket when one is trying to buy a train ride and the other is trying to maintain the tracks.
