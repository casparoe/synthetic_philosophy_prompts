  There is no single, universally standardized term that captures precisely the *rhetorical and grammatical* mechanism you describe, though it sits under the broad academic umbrella of **naturalization** (specifically, the naturalization of political causality).

  In critical theory and sociology, **naturalization** refers to the process by which historical, social, or political arrangements are made to appear inevitable, biological, or law-like (e.g., "the market decided," "it is human nature"). However, this term is often too broad for your purpose; it covers everything from gender roles to economic laws, and it describes the *outcome* (the event is seen as natural) rather than the *mechanism* (the grammatical erasure of agency).

  In famine studies specifically, scholars like Alex de Waal (*Famine Crimes*) and Mike Davis (*Late Victorian Holocausts*) describe this phenomenon as the **depoliticization of disaster**, but this is a description of the effect, not the rhetorical tool.

  Because existing terms describe the *state of affairs* rather than the *grammatical move* you have identified, I propose we coin a term that serves your specific need for "moral bookkeeping."

  ### The Term: **The Naturalistic Alibi**

  **Definition:**
  The **Naturalistic Alibi** is a rhetorical maneuver in which political agents evade moral or legal responsibility for mass suffering by framing the cause of that suffering as a force of nature. It operates through a specific grammatical shift: the **agent** (the official, the policy, the export license) is removed from the sentence, and the **instrument** (the rain, the crop, the drought) is promoted to the position of the subject.

  It is an "alibi" because it functions as a defense against a charge of negligence or malice. It is "naturalistic" because it locates the cause in the non-human world. Unlike a lie, it does not necessarily deny the facts (the rain *did* fail); rather, it denies the *relevance* of the human decisions that turned a weather event into a catastrophe.

  ### The Carving: How It Differs from Nearest Neighbors

  To use this concept precisely, you must distinguish it from three adjacent ideas:

  **1. Versus Structural Violence**
  *   **Structural Violence** (Johan Galtung) describes the *harm* itself: the invisible ways social structures kill people (e.g., poverty, lack of healthcare). It is an ontological claim about reality.
  *   **The Naturalistic Alibi** is a *linguistic and moral claim* about that reality. Structural violence is the bullet; the Naturalistic Alibi is the story told at the inquest that claims the bullet fired itself. You can have structural violence without the alibi (if officials admit, "We chose to starve them"), but the alibi is specifically designed to hide the violence.

  **2. Versus Euphemism**
  *   **Euphemism** softens the blow of a harsh truth (e.g., "collateral damage" instead of "dead civilians"). It acknowledges the event but dresses it up.
  *   **The Naturalistic Alibi** erases the *agent* of the truth. It does not say "we killed them gently"; it says "no one killed them; they died because the grass stopped growing." Euphemism masks the *nature* of the act; the Naturalistic Alibi masks the *existence* of the actor.

  **3. Versus Depoliticization**
  *   **Depoliticization** is the broad political strategy of removing an issue from public debate.
  *   **The Naturalistic Alibi** is a specific *tactic* of depoliticization. Not all depoliticization uses nature (some use "technical necessity" or "economic law"). The Naturalistic Alibi is distinct because it relies specifically on the **register of weather and biology** to achieve the depoliticization.

  ### Boundary Cases: Sincerity vs. Strategy

  A crucial boundary for your piece is whether the speaker believes the alibi.

  *   **The Cynical Alibi:** Officials know food was exported but blame the drought to avoid prosecution. This is propaganda.
  *   **The Sincere Alibi:** Officials genuinely believe that because a drought occurred, the resulting famine was "natural," failing to understand that famine is a distributional failure, not merely a production failure.

  **The Concept Holds in Both Cases.**
  The utility of **The Naturalistic Alibi** is that it describes the *function* of the language, not the *intent* of the speaker. Whether the official is lying or merely ignorant, the rhetorical effect is the same: agency is displaced from the human sphere to the meteorological sphere, and moral accountability is dissolved.

  In your analysis, you can note that the *sincere* use of the Naturalistic Alibi is often more dangerous than the cynical one. The cynical user can be exposed by evidence; the sincere user is immune to evidence because they do not recognize the category of "political famine" exists. They are operating within a worldview where "famine" and "drought" are synonyms, a conflation the Naturalistic Alibi reinforces.

  ### Usage in Context

  When writing your piece, you might frame it this way:

  > "Historians often speak of 'structural violence' to describe the systems that kill. But systems do not write laws; people do. To understand how those people escape the page, we need a term for the grammar of their escape. I call it **the Naturalistic Alibi**.
  >
  > It is the grammatical sleight-of-hand where 'The government exported grain' becomes 'Grain was scarce.' It is the conversion of a verdict into a weather report. In the Irish Famine, the Bengal Famine, and the Great Leap Forward, the Naturalistic Alibi allowed officials to stand before the dead and say, 'We did not do this. The sky did.' And because they spoke in the passive voice of nature, the world listened as if they were describing a law of physics, rather than a choice of policy."

  ### Summary for Your Notes

  *   **Established Parent Concept:** Naturalization (or Depoliticization via Naturalization).
  *   **Proposed Specific Term:** The Naturalistic Alibi.
  *   **Core Mechanism:** Grammatical displacement of human agency onto natural forces.
  *   **Function:** Moral exculpation (an alibi).
  *   **Boundary:** Applies regardless of speaker intent (sincere or cynical), provided the effect is the erasure of political causality.

  This term gives you the "carving" you requested: it isolates the rhetorical move from the broader sociological condition, allowing you to analyze the *language* of the cover-up, not just the economics of the famine.
