answer: |-
  You have identified a sophisticated methodological problem that sits at the intersection of the philosophy of science, historiography, and sociology. While there is no single, universally standardized noun phrase like "The Browning Shield," there are three established conceptual frameworks that describe exactly this phenomenon.

  The most precise philosophical term is **a Lakatosian Protective Belt**, the methodological term is **Theoretical Immunization**, and the sociological description is **Structure-Agency Oscillation**.

  Here is the breakdown of the terminology, the edges of the concept, and how it differs from standard logical fallacies.

  ### 1. The Established Terms

  **A. The Lakatosian "Protective Belt"**
  Imre Lakatos, in his *Methodology of Scientific Research Programmes*, distinguished between the "hard core" of a theory (the fundamental assumptions that cannot be abandoned without destroying the theory) and the "protective belt" (auxiliary hypotheses that can be adjusted to absorb anomalies).
  *   **How it fits your observation:** The "hard core" is the claim that "The Holocaust cannot be explained by simple monocausality." When evidence threatens the situational explanation (Browning), the belt shifts to culture. When culture is threatened, it shifts to elite pressure. The theory survives not by proving one level right, but by rotating the auxiliary explanations so the core is never falsified.

  **B. Theoretical Immunization (Popper)**
  Karl Popper described this as a **Conventionalist Stratagem**. A theory is "immunized" against falsification by making it so flexible that no empirical evidence can contradict it.
  *   **How it fits:** By allowing the explanation to float between individual psychology, group dynamics, and cultural macro-structures, the theory becomes unfalsifiable. If you find an ideologue, they say "situation." If you find a situational constraint, they say "ideology shaped the constraint." It is a **Teflon Theory**.

  **C. Structure-Agency Oscillation**
  In sociology and historiography (specifically the *Structure vs. Agency* debate), this is often criticized as **Analytical Eclecticism** used defensively.
  *   **How it fits:** This is the specific "level-shifting" you noticed. When Agency (character/ideology) is pinned down as the cause, the explanation retreats to Structure (situation/culture). When Structure is pinned down as too deterministic, the explanation retreats to Agency (elites making choices).

  ### 2. Defining the Edges: What makes this specific?

  To distinguish this from normal complexity, you need to look for **Substitution vs. Integration**.

  **Edge 1: Substitutional vs. Interactional**
  *   **Normal Interaction Effect:** A rigorous model admits that *both* situation and character matter simultaneously and attempts to weigh them (e.g., "Ideology increased the baseline willingness, but situational pressure triggered the action"). The variables are held constant to measure variance.
  *   **Explanatory Shielding:** The variables are **substituted** sequentially to deflect critique. Level A is used until it is threatened, then Level B is deployed to explain Level A. The weight is never pinned down. If you ask "How much weight?", the answer is "It depends on the level of analysis," which is a refusal to answer.

  **Edge 2: Temporal Regress vs. Logical Circle**
  *   **Circular Reasoning:** $A$ causes $B$, $B$ causes $A$ (simultaneously or logically). This is a formal fallacy.
  *   **Explanatory Shielding:** This is an **Infinite Regress of Context**. $A$ (Killers) is caused by $B$ (Situation), $B$ is caused by $C$ (Culture), $C$ is caused by $D$ (Elite Situation).
  *   **The Difference:** It is not logically circular because time flows forward ($T_1 \to T_2 \to T_3$). However, it is *explanatorily* circular because it never arrives at a "stopping point" or a prime mover. It treats "context" as an infinite resource that can always be mined to explain away the previous level.

  ### 3. A Proposed Descriptive Label

  If you need a term to use in writing or debate to describe this specific maneuver, the most accurate descriptive phrase is **"Recursive Explanatory Deferral."**

  *   **Recursive:** It loops back through similar types of causes (pressure $\to$ ideology $\to$ pressure).
  *   **Explanatory:** It claims to explain causality.
  *   **Deferral:** It constantly postpones the assignment of ultimate causal responsibility.

  Alternatively, in historiography, this is sometimes pejoratively called **"Soft Determinism."** It claims to acknowledge human choice (agency) while simultaneously arguing that the choices were determined by such a thick web of context that the agents bear no specific moral or causal weight.

  ### 4. Why this matters in the Browning/Goldhagen Debate

  You are spotting the synthesis that emerged after the "Functionalism vs. Intentionalism" wars.
  *   **Goldhagen** was criticized for being a "Dispositionist" (ignoring situation).
  *   **Browning** was criticized for being a "Situationist" (ignoring ideology).
  *   **The Shield:** Later scholarship often attempts to synthesize them by saying "It was both." While often true, your observation highlights when "It was both" is used to mean "You can't pin it on either."

  This shielding prevents **Counterfactual Testing**.
  *   To test Browning: Ask "Would they have killed without the order?"
  *   To test Goldhagen: Ask "Would they have killed without the antisemitism?"
  *   **The Shield's Response:** "You can't separate the order from the antisemitism because the order was created by antisemites who were shaped by the culture that created the order..."

  By refusing to isolate the variables, the theory protects itself from the counterfactual.

  ### Summary
  There is no single word, but **Lakatosian Protective Belt** is the formal philosophical equivalent, and **Explanatory Level-Shifting** is the standard sociological description. It differs from circular reasoning because it relies on **temporal regress** rather than logical equivalence, and it differs from interaction effects because it uses **substitution** to avoid falsification rather than **integration** to model complexity.
