              1.  Care worker (50s, renting, necessitous) with genealogical link to a 1807 commoner (and illegitimately to a commissioner).
              2.  Man (disability benefits, parents from Jamaica 1958, no ancestral link) arguing non-identity problem (enclosure created the conditions for his existence, so no loss).
          *   Third option: "Common Purse" (buy land, vest in community land trust, use-rights for residents).
