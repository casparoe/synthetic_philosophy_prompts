      *   *Implication:* I must be honest about this. The "restitution" label is historically sentimental, not factual. However, the *Deed* still governs. We can't ignore the deed. We must interpret "by reason of" in a way that is administratively workable.
      *   *Strategy:* Acknowledge the limitation. We are not making anyone "whole" (impossible). We are not disgorging illicit gains (none exist). We are marking a wrong through poverty relief targeted at a class defined by the historical event, even if the causal link is attenuated.

  4.  **Drafting - Section by Section:**

