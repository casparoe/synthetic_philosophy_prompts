answer: |-
  **TO:** The Trustees of the Wychford Commons Restitution Trust
  **FROM:** [Your Name]
  **DATE:** 10 February 2024
  **SUBJECT:** Discussion Paper: Strategic Direction and Pending Applications

  **1. Purpose and Context**

  The 2019 bequest has transformed this Trust from a dormant fund into a significant asset holder. This liquidity forces us to confront ambiguities we previously ignored. We have two pending applications and a proposal to alter our spending mechanism. To vote responsibly, we must agree on what this Trust *is*. Are we compensating specific losses? Disgorging unjust enrichment? Relieving poverty? Or marking a historical wrong? These purposes are mutually exclusive on our facts. This paper argues for a specific interpretation, recommends decisions on the pending applications, and proposes a standing rule to preserve both our legal compliance and our moral integrity.

  **2. The Nature of the Fund: An Honest Appraisal**

  We must begin with a uncomfortable truth. The Trust's name implies restitution, but the endowment comes from the Pell family's woollen milling, not the proceeds of the 1807 Inclosure. No one here holds "unjust enrichment" from the enclosure to return. We are not making claimants "whole" against a counterfactual baseline; as the historian's report confirms, migration and demographic shifts make calculating such a baseline impossible. The non-identity problem raised by the second applicant is philosophically sound: strictly speaking, no living person is worse off *because* of the enclosure, since the enclosure shaped the lineage that created them.

  Therefore, we cannot honestly describe our payouts as "reparation" in a corrective justice sense. We are a poverty-relief charity with a historical condition attached. The phrase "by reason of the loss of common rights" is no longer a test of causation—it is a test of eligibility class. If we insist on actual causation, the Trust fails for impossibility. If we ignore the clause entirely, we breach the Deed. We must tread a middle path: we treat the historical link as a proxy for need, acknowledging that the "restitution" label is sentimental, not factual.

  **3. Decisions on Pending Applications**

  **Application 1 (The Care Worker):** **Recommendation: APPROVE.**
  This applicant meets the current Deed's requirements as practically interpreted. She is necessitous. She is resident. She has a documented genealogical link to a commoner. While the link to the commissioner is irrelevant and the causation attenuated, she fits the class defined by the Trust Instrument. To deny her while holding funds would be capricious.

  **Application 2 (The Disability Claimant):** **Recommendation: DECLINE.**
  This recommendation is made with significant moral hesitation. The applicant's case regarding the non-identity problem is logically robust, and his need is undeniable. However, he lacks the ancestral connection required by the Deed. We cannot rewrite the beneficiary class ourselves; doing so risks regulatory intervention and breaches our fiduciary duty to the Founder's intent. Approving him would establish a precedent that severs the link between the fund and its stated purpose, potentially invalidating the Trust. We cannot help him *under this specific mandate*, though his case powerfully illustrates why the mandate is outdated.

  **4. Standing Rule and Future Direction: The Common Purse**

  Individual grants based on genealogical causation are administratively brittle and morally fraught. They force us to act as arbiters of bloodlines rather than stewards of community welfare. Therefore, I propose the following Standing Rule:

  *The Trust shall prioritize the use of income and capital to acquire land or rights within the Borough to be held for community benefit (the "Common Purse"), subject to obtaining a Scheme of Variation from the Charity Commission.*

  **Rationale:** The original wrong was the loss of *common property*, not the loss of cash. Restoring a form of common property (allotments, grazing rights, community gardens) accessible to necessitous residents repairs the relationship between the community and the land without requiring impossible genealogical math. It shifts us from "compensating descendants" to "restoring the right."

  **Constraint:** Our Clerk advises this likely requires a Scheme of Variation because the current Deed specifies "relief of persons... in necessitous circumstances" via income application. Buying land for community use may stretch the definition of "relief." We must vote to authorize the Clerk to seek this Variation immediately. Until approved, we continue individual grants under the criteria used for Application 1.

  **5. Preserving Trust Unity**

  To the trustees who favour Application 2: I understand your view that need should trump ancestry. You are right that the moral claim of the disabled resident is strong. However, we are bound by the Instrument. The path to helping people like him is not to break the Deed, but to widen it via the Scheme of Variation. The Common Purse model benefits residents based on current residence and need, effectively bypassing the genealogical barrier legally.

  To the trustees who favour strict genealogy: I understand your concern that drift from the Deed dishonours the Pell family's intent. But the Pell money was never enclosure money. We are already managing a fiction. The Common Purse honours the *spirit* of the 1807 wrong (loss of land) more faithfully than writing cheques to distant relatives of cottagers.

  We are not disagreeing on goals, but on mechanisms. We all want to relieve need and honour history. The Common Purse achieves both; individual grants achieve neither reliably.

  **6. Confidence and Critical Premise**

  **Confidence Level:** Moderate.
  **Critical Premise:** This recommendation collapses if the Charity Commission determines that "community land access" does not qualify as "relief of persons in necessitous circumstances."

  If the Commission rules that the Deed cannot be varied to allow asset acquisition for community use, we are forced back into the binary of genealogical grants versus poverty relief. In that scenario, we must remain a narrow genealogical fund or face cy-près proceedings to modernize our purpose entirely.

  **7. Conclusion**

  We are managing a sentimental fund with real money. Let us stop pretending we are calculating damages for a 200-year-old tort. We are not. We are using unrelated wealth to mitigate modern poverty through a historical lens. Let us approve the care worker, decline the second applicant with regret, and immediately pivot toward restoring common land rights. This allows us to keep our hands clean legally while doing work that matters morally.

  **Motions for March Meeting:**
  1.  Grant Application 1.
  2.  Decline Application 2.
  3.  Authorize the Clerk to apply for a Scheme of Variation to permit capital expenditure on community land assets.
