      *   *The Deed:* Requires loss of common rights *by reason of* the 1807 Act.
      *   *The Money:* Comes from Pell milling (unrelated to the enclosure). This is crucial. It's not stolen land money being returned; it's unrelated money earmarked for a specific purpose.
      *   *The Problem:* "By reason of the loss" implies causation. After 200+ years, causation is impossible to prove individually (non-identity problem, migration, intermarriage).
      *   *The Options:*
          1.  Strict Genealogy (Applicant 1): Honors the text but arbitrary (why that lineage?) and ignores the non-identity problem.
          2.  Current Need Only (Applicant 2): Ignores the "by reason of loss" text legally, but aligns with modern poverty relief. Risks challenging the deed's validity.
          3.  Common Purse (Land): Symbolic restitution. Restores the *form* of the right (common land) rather than compensating individuals. Fits the "restitution" name best but might stretch "relief of persons... in necessitous circumstances."

  3.  **Address the "Honesty" Constraint:**
