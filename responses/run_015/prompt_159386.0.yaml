  ### Part 3: A Real-World Example

  **Scenario: Legislative Amendment Sponsorship**

  Imagine a legislative body drafting a bill with **6 sections** arranged in a logical circle (Section 6 links back to Section 1). Two rival political factions, **Party A** and **Party B**, want to control the final text.

  **The Rules:**
  1.  Factions take turns sponsoring amendments.
  2.  **Constraint:** Due to rules of germaneness, a faction cannot sponsor an amendment to a section **adjacent** to one they have already amended. (If you amend Section 1, you are barred from amending Section 2 or 6).
  3.  **Goal:** The faction that sponsors the last valid amendment wins the public narrative.

  **The Failure of "First Mover Advantage":**
  A strategist for Party A might argue: "We should move first. We can sponsor a harmless amendment to Section 1 (a throwaway), and then adopt Party B's expected response strategy for the rest of the bill."

  **Why it fails:**
  Suppose Party B's optimal counter-strategy relies on seizing Section 6 in response to a move in Section 3.
  1.  Party A sponsors Section 1 (Throwaway).
  2.  Party B sponsors Section 3.
  3.  Party A attempts to follow the "Second Player Strategy," which dictates sponsoring Section 6.
  4.  **Block:** Party A is now **barred** from sponsoring Section 6 because they already sponsored Section 1 (adjacency rule).

  **Mechanism:**
  Just like the board game, the "extra move" (the throwaway amendment) committed Party A to a position that restricted their own future flexibility. In negotiation and law, **commitment is a constraint**. The First Mover is forced to commit resources or positions early, which the Second Mover can then exploit by choosing responses that are incompatible with the First Mover's initial commitment. The "Pass" in this context would be the ability to delay commitment without penalty—something rarely available in real-world legislative windows, which is why First Mover Disadvantage is common in highly constrained negotiation environments.
