answer: |-
  ### Assessment of the Hunch

  Your hunch is not muddled. In fact, it's philosophically sharper than you might fear. You are intuitively describing the difference between **lexical dominance** (where one option is better on all counts) and **incommensurability** (where values conflict and there is no common currency to trade them).

  Academics in the room will recognise this immediately, even if you don't use the jargon. The quantifiers want to find a common currency (lives lost, economic cost). The qualitative side argues that no such currency exists for memory and grief. Your weather analogy bridges this perfectly: it validates the quantifiers (yes, we can measure) while validating the qualifiers (yes, the measurement often fails to capture the "worstness").

  The Beaufort scale point is excellent. It demonstrates that ranking (ordinal) often precedes precise measurement (ratio), and that the ranking served a practical purpose before it served a theoretical one. This supports your second point: *what is the ranking for?*

  Keep the spine exactly as you have it. It allows you to be neutral without being vacuous.

  ***

  ### Opening Remarks

  **Time:** Approx. 6 minutes
  **Tone:** Dry, understated, conversational

  Good morning.

  I'm told I was asked to open this day because I'm the only person on the committee who isn't an expert. In a room full of philosophers, historians, and political scientists, I'm the control group. I spent thirty years in meteorology. I retired four years ago. Since then, I've been sitting in on philosophy seminars, which has taught me that I know enough to be dangerous, and nowhere near enough to be introduced as a philosopher.

  So I won't try to do philosophy at you. I'll stick to what I know. I'll talk about weather.

  In the forecasting office, we spent years arguing about whether the storm of '87 was worse than the one in January '90. We had the data. We had the models. But the answer was always the same: worse by what?

  Deepest pressure? Fastest gust? Insured loss? Lives lost?

  Nobody felt indecent asking that question. Nobody felt that comparing storms was morally obscene. We just needed to know which axis mattered for the job at hand.

  Two things strike me about that.

  First, when one event is worse than another on every measure anyone cares about, nobody has any qualm about ranking it. No one hesitates to say the Black Death was worse than a bad winter. The measures don't cross. One dominates the other. The ordering is fine, and it's boring.

  Second, every argument we had was a case where the measures crossed. Lower pressure here, but far more money in damage there. More wind speed, but fewer casualties. It wasn't that we lacked the data. It was that there was no fact of the matter to be had.

  My hunch is that the question "is ranking possible?" and the question "is ranking obscene?" are often the same question. What we're actually reacting to when a comparison feels filthy is the crossing of the measures, not the size of the numbers.

  In meteorology, we have a rule for this. If A is at least as bad as B on every axis, and worse on one, then A dominates B. The ordering is fine. If A is worse on one axis and better on another, there's nothing to rank. There is no answer to want.

  I know some of you will disagree. You work with scales. You know that nominal, ordinal, interval, and ratio data behave differently. But you don't need the jargon to understand the history.

  Take the Beaufort scale. It started life in 1805 as a set of descriptions. It wasn't about wind speed. Nobody could measure wind speed at sea then. It was about how much canvas a frigate could carry. Full sail. Reefed topsails. Bare poles.

  We ranked winds for decades before we could count them. And when we finally could count them, the counting didn't settle the arguments. Because the number didn't tell you what the wind was doing to the ship.

  This brings me to the second part of my hunch. The storm rankings were harmless because they had a use. Warning thresholds. Building codes. Insurance. Nobody was ordering storms in order to decide which of them mattered. They were ordering them to decide what to build next.

  Maybe the obscenity isn't about comparison as such. Maybe it's about what the comparison is for.

  Fixing a pecking order among the dead is not the same as fixing a roof. Settling how much room a memory gets is not the same as settling an insurance claim.

  I say this as an outsider looking at the programme. I know there are people in this room for whom these are not case studies. For whom the numbers are not abstract. I know that for some, the crossing of measures isn't a philosophical puzzle. It's a personal injury.

  I'm not going to tell you how to feel about that. And I'm certainly not going to try to answer the question of the day. I'm a weatherman, not a judge.

  But I think this hypothesis might be useful for the next seven hours. If the quantifiers and the qualifiers find themselves at odds, check the measures. Are they crossing? And check the purpose. Are you building a code, or are you ranking grief?

  I'll leave that with you. I'm going to sit in the back, listen, and see if anyone can prove me wrong.

  Thank you.
