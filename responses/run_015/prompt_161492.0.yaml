answer: |-
  Here is the scorecard, the verdict on the empty queue, the missing distinction, and the decisive empirical question.

  ### Part 1: The Scorecard (Moves 1–15)

  **1. Reza: Basically Right.**
  This is the standard Weberian definition of corruption (particularism vs. universalism). It establishes the baseline rule.

  **2. Dana: Half Right.**
  She correctly identifies that in weak states, the informal system is often the *functional* system. However, she is wrong to suggest that functionality negates the label of corruption; a bridge that stands but was built on stolen funds is still built on stolen funds.

  **3. Reza: Basically Right.**
  Logical consistency. If "broken system" excuses the act, the concept of corruption dissolves in the exact places it is needed most.

  **4. Dana: Half Right.**
  The "displaceability" test is a useful heuristic for *harm*, but wrong as a definition of *corruption*. An accelerator in a race where others are barred from the track is still cheating, even if they would have lost anyway.

  **5. Reza: Basically Right.**
  Queue-jumping creates a negative externality (delay/demoralization) for everyone else, even if the queue is slow.

  **6. Dana: Half Right.**
  She wins on the immediate victim (there may be none), but loses on the institutional victim. Institutions are damaged by the normalization of exception, even without a specific identifiable loser in the short term.

  **7. Reza: Basically Right.**
  This is the strongest theoretical point in the debate (Public Choice theory). Agents benefiting from a loophole have a financial incentive to keep the loophole necessary.

  **8. Dana: Half Right.**
  The "Gateway" hypothesis is plausible but empirically fragile. It happens, but the "Trap" (Move 7) is the statistically dominant outcome in development literature.

  **9. Reza: Basically Right.**
  He correctly identifies the Principal-Agent problem. You cannot trust the corrupt agent to report on the necessity of their own corruption.

  **10. Dana: Half Right.**
  She is historically correct (impartiality is a recent, Western-heavy norm), but normatively weak. Human rights and anti-corruption conventions are treaty-bound universals, not just cultural preferences.

  **11. Reza: Basically Right.**
  The foot-binding analogy holds. Local approval does not validate harm, especially when the "unorganized" (the poor) cannot consent to the system that disadvantages them.

  **12. Dana: Half Right.**
  She is right that measurement indices are perception-based and biased. She is wrong to equate private partiality (legacy admissions) with public fiduciary duty (water office). The stakes of public goods differ.

  **13. Reza: Basically Right.**
  Linguistic pragmatism. We use words like "tall" or "rich" without bright lines; "corrupt" can function similarly.

  **14. Dana: Half Right.**
  She is right about the political baggage (the word *does* do rhetorical work in aid conditionality). She is wrong to discard the analytic category because of its political usage.

  **15. Reza: Basically Right.**
  Logically sound. The origin of a concept (political baggage) does not determine its current validity.

  **Overall:** Reza wins on **definition and logic**. Dana wins on **context and consequence**. Reza describes what the act *is*; Dana describes what the act *does*.

  ***

  ### Part 2: The Empty Queue Verdict

  **Is the empty queue case corruption?**
  **Yes.**
  It meets the definitional criteria: a public official violating formal duty for private gain (the "appreciation payments"). The fact that the formal queue is broken does not change the nature of the act, only its *justification*. Calling it "informal governance" describes its function, but it remains corruption by law and by standard definition.

  **Does it matter if he selects for the poor?**
  **Yes, but only for the *moral defense*, not the *definition*.**
  *   **If it's a coincidence:** It is standard clientelism. He helps his friends/network. This reinforces inequality.
  *   **If he selects for the poor:** It is *redistributive clientelism*. He is using a corrupt mechanism to achieve a progressive outcome.
  *   **Why it matters:** If he selects for the poor, Dana's "Gateway" argument gains weight (the state gains legitimacy among the marginalized). If he selects for his network regardless of need, Reza's "Trap" argument wins (the state becomes a tool for the organized).
  *   **The Verdict:** It is still corruption, but selecting for the poor moves it from "predatory" to "survivalist." It makes the corruption *understandable*, perhaps even *necessary*, but it does not make it *not corruption*.

  ***

  ### Part 3: What Both Are Missing

  They are arguing over **Legality (Reza)** vs. **Functionality (Dana)**.
  The missing distinction is **Legitimacy (Social License).**

  Neither of them asks: **Do the constituents view this as corruption?**
  *   Reza assumes the State is the only valid Principal.
  *   Dana assumes the Outcome is the only valid Judge.
  *   **The Missing Piece:** In many districts, the "State" is an abstract, distant entity, while the "Community" is the real principal. If the community views the official's actions as fulfilling a social duty (taking care of his own/poor neighbors) rather than stealing from the public till, the act lacks *social* corruption even if it retains *legal* corruption.
  *   **Why this matters:** If the locals view it as legitimate, Reza's "institutional harm" argument weakens (the institution isn't losing trust locally). If the locals view it as extortion, Dana's "gateway" argument collapses. You cannot judge the harm without knowing if the "victims" feel victimized.

  ***

  ### Part 4: The Single Empirical Question

  To settle the "Trap" (Reza) vs. "Gateway" (Dana) debate, you need to know if the official is *maintaining* the brokenness.

  **The Question:**
  > **"When the formal route is temporarily fixed or monitored by outsiders, does this official actively obstruct it, or does he process applications normally?"**

  *   **If he obstructs:** Reza wins. The corruption is predatory; he has a vested interest in state failure.
  *   **If he processes normally:** Dana wins. The corruption is compensatory; he only uses discretion when the state fails to act.

  **Why this moves the verdict:**
  It tests Move 7 (Reza's claim of self-stabilizing brokenness) against Move 8 (Dana's claim of the shortcut as a workaround). If he stops taking bribes when the formal system works, the bribe is a *fee for service* in a vacuum. If he continues to demand bribes even when the formal system works, the bribe is *rent-seeking*. This single data point determines whether the corruption is a symptom of the disease or a parasite feeding on it.
