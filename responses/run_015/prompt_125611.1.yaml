answer: |-
  The pub was quiet, save for the clink of glasses from the philosophy reading group packing up. Sarah, the group's resident decision theorist, was nursing a stout while Mark, a retired geologist, leaned over the table.

  "Alright," Mark said, tapping his notebook. "Walk me through Good's theorem again. You claim the expected value of free information is always non-negative. Always."

  "Mathematically guaranteed," Sarah said. "Provided you're maximizing expected utility."

  "Here's my problem," Mark said. "Thirty years ago, I had a choice between two drill sites. Prior probability favored Site A. A colleague gave me a free geochemical assay. It favored Site B. I switched to Site B. Dry hole. Site A was productive. The free information cost me the lease."

  Sarah nodded. "Did the assay force you to switch?"

  "No. But once you have the data, you can't un-have it. You feel compelled to use it."

  "That's a psychological constraint, not a logical one," Sarah said. "Good's theorem relies on a specific assumption: that after receiving the information, your set of available actions still includes the action you would have taken *without* it. You must be free to look at the assay, say 'this is noise,' and drill Site A anyway."

  Mark stared into his beer. "So the value isn't in the information itself."

  "No."

  "The value is in the right to ignore it."

  "Exactly," Sarah said. "Good didn't prove that knowledge is power. He proved that having the option to pretend you're ignorant is the only thing with strictly non-negative value."

  ***

  **Note on the liberties taken:**

  The joke leans entirely on the **freedom of action** assumption (sometimes called the "option to ignore"). Good's proof holds because the optimal action *after* seeing the evidence is, by definition, at least as good as the optimal action *before* seeing it—since the pre-evidence action is still available to be chosen post-evidence. If the agent treats the information as binding (i.e., they *must* update their policy regardless of whether it lowers expected utility), the theorem breaks.

  There is little dispute about the mathematics of the theorem itself, but there is genuine debate regarding its **applicability to bounded rational agents**. Critics argue that for humans, information often carries a psychological or computational cost that makes "ignoring" it impossible or expensive. If you cannot cognitively treat the signal as noise, the "freedom to ignore" is illusory, and the non-negativity result may not hold in practice. The joke treats the agent as perfectly rational to make the point, sidestepping the behavioral economics critique.
