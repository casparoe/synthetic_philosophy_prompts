answer: |-
  # Dissertation Defense Q&A Prep Sheet
  **Topic:** Phenomenally Individuated SIA (PI-SIA)
  **Audience:** Formal Epistemologists (Bayesian Orthodoxy), Halfers, Metaphysician.
  **Strategy:** Frame PI-SIA not as a new update *rule*, but as a clarification of the *proposition* being conditionalized upon. Lean on the Metaphysician to shield against the Halfers.

  ---

  ### 1. The "New Rule" Objection (The Bayesian Dogma)
  **Q:** "You claim to defend SIA, but standard Bayesians hold that rational update is ordinary conditionalization on a proposition. Your weighting scheme looks like a new update rule (e.g., 'weight by number of duplicates'). Can you state exactly which proposition $E$ you are conditionalizing on such that $P(H|E)$ yields your results without invoking a non-standard likelihood function?"

  **Reply:** "I am not proposing a new update rule. I am proposing a specific account of the evidence proposition $E$. $E$ is the proposition *that a token of my current total phenomenal type is being instantiated*. Under hypothesis $H$, the likelihood $P(E|H)$ is proportional to the expected number of tokens of that phenomenal type $H$ produces. This is ordinary conditionalization; the innovation is strictly in the metaphysics of the evidence term. We aren't conditioning on 'I exist' (which is trivial) or 'Someone exists' (which is uninformative), but on 'This experience exists.' The 'weighting' is just the likelihood of that specific proposition being true given the world structure."

  **Soft Spot:** If they press on whether "This experience exists" is a centered proposition that requires a centered prior, you risk sliding back into a non-standard framework. You need to insist uncentered propositions about phenomenal instantiations are sufficient.

  ### 2. The Sleeping Beauty Trap (The Halfer Test)
  **Q:** "Two of us are Halfers. Standard SIA forces Thirding because there are two observer-moments in Tails-world. On your view, if Monday and Tuesday experiences are phenomenally identical, you count both. Does PI-SIA mandate Thirding? If so, why should we accept a view that gets SB wrong? If not, how do you distinguish SB from the Presumptuous Philosopher case?"

  **Reply:** "PI-SIA does mandate Thirding in the standard SB case, because the hypothesis 'Tails' entails two instantiations of the exact phenomenal state Beauty has, while 'Heads' entails one. However, this is a feature, not a bug. The Presumptuous Philosopher case differs because the surplus observers in the large universe do *not* share your phenomenal state (they have different memories, environments, etc.). In SB, the duplication is genuine and local. My view accepts anthropic updates when duplication is real (SB) and rejects them when it is merely numerical (PP). If you are a Halfer because you think anthropic evidence is inert, my view agrees in cosmology but disagrees in SB. I argue the Halfer intuition is right about cosmology but wrong about SB."

  **Soft Spot:** The Halfers will not be happy with Thirding. They view Thirding as a mark of *uns seriousness*. You are conceding the SB battle to win the cosmological war. Be prepared for them to dig in here.

  ### 3. The Vagueness Objection (The Metaphysician)
  **Q:** "You rely on 'exact phenomenal duplicates.' Phenomenal states are vague. If I have a headache and you don't, we aren't duplicates. But what if my headache is microscopically fainter? Any threshold for 'exactness' seems arbitrary. Doesn't this reintroduce a graded reference class under the guise of metaphysics, making the likelihoods sensitive to arbitrary cutoffs?"

  **Reply:** "I grant phenomenal states are vague, but this is a general problem for any view using phenomenal evidence, not just mine. However, PI-SIA doesn't require a sharp threshold for *rationality*. It requires that the world contains a fact of the matter about phenomenal instantiation. If vagueness exists, it exists in the world, not just in our classification. Furthermore, in the Presumptuous Philosopher case, the difference isn't a headache; it's entirely different lives. The likelihood ratio collapses not because of a threshold, but because the overlap in phenomenal space is near zero. We don't need to solve the Sorites paradox to see that a galaxy of strangers are not phenomenal duplicates of me."

  **Soft Spot:** The Metaphysician will press on whether "phenomenal types" exist robustly enough to ground probabilities. If they are anti-realist about qualia types, your likelihood function has no domain.

  ### 4. The "Free Skeptic" Objection (Cost/Benefit)
  **Q:** "You admit that on your view, self-locating evidence almost never does much work in cosmological cases. A simple skeptic about anthropic reasoning gets that same result for free without your complex machinery of phenomenal individuation. Why is your view preferable to simply saying anthropic evidence is irrelevant?"

  **Reply:** "The skeptic throws out the baby with the bathwater. The skeptic cannot explain why we *should* update in cases like Sleeping Beauty or the Self-Indication Assumption's original motivation (avoiding the Doomsday Argument's certainty of early extinction). My view preserves the normative force of anthropic reasoning where duplication is genuine (SB, Doomsday deflation) while blocking it where duplication is absent (Presumptuous Philosopher). Skepticism is a blunt instrument; PI-SIA is a scalpel. It explains *when* and *why* anthropic updates are licensed, rather than just denying them."

  **Soft Spot:** If they argue that Doomsday *should* be compelling or that SB *should* be Halving, your "scalpel" looks like it's cutting the wrong things. You need them to agree that PP is a reductio of standard SIA.

  ### 5. The SSA Smuggling Objection
  **Q:** "By restricting the count to 'duplicates of me,' aren't you just building the Self-Sampling Assumption (SSA) reference class into the likelihood function? SSA says 'reason as if you are random from a reference class.' You say 'count only those in my class.' Isn't this SSA in Bayesian clothing?"

  **Reply:** "No. SSA requires selecting a reference class *prior* to evaluating the evidence, which is where the arbitrariness lies. PI-SIA does not select a class. It takes the evidence as given ('I have experience P') and asks how many times P occurs. The 'class' is fixed by the evidence itself, not by a methodological choice. In SSA, I could choose 'all observers' or 'all humans.' In PI-SIA, I cannot choose; I am locked into 'exact phenomenal duplicates.' This removes the arbitrariness that plagues SSA."

  **Soft Spot:** Formally, the math might look identical to SSA with a specific reference class. You must argue the *justification* for the class is what differs (metaphysical necessity vs. methodological choice).

  ### 6. The Hyper-Sensitivity Objection
  **Q:** "If my rational credences depend on the number of exact phenomenal duplicates, then a tiny, unnoticed change in my qualia (a fleeting itch) could drastically alter the number of duplicates in a vast universe. Is rationality really hostage to facts about microscopic phenomenal differences no agent could track?"

  **Reply:** "It is hostage to the facts, but not to our *knowledge* of the facts. If I am uncertain whether I have an itch, I should conditionalize on the disjunction of states. In a vast universe, there are likely duplicates of 'me-with-itch' and 'me-without-itch.' The ratio between hypotheses won't swing wildly on microscopic details unless the hypotheses differ specifically on the distribution of those details. Rationality requires tracking evidence; if the evidence is vague, the credences should reflect that vagueness, not break."

  **Soft Spot:** In infinite universes, small changes in description can change counts from finite to infinite. You need to rely on "expected number" and density, which invites measure problems you said you wanted to avoid.

  ### 7. The "Centered World" Objection
  **Q:** "Formal epistemology standardly models self-locating belief using centered worlds. Your view talks about 'tokens of phenomenal types.' How does this map onto the centered world framework? Are you rejecting centered worlds?"

  **Reply:** "I am not rejecting centered worlds, but I am refining what makes a center relevant. A centered world $\langle w, c \rangle$ is relevant to me only if the center $c$ instantiates my current phenomenal type. We can keep the formalism, but we restrict the set of centers that count as 'evidence' to those phenomenally identical to me. This filters the centered worlds without changing the logic of the framework."

  **Soft Spot:** If they argue that centered propositions *are* the evidence, you might be forced to admit that "I am here" is the evidence, which brings back standard SIA problems.

  ### 8. The Diachronic Coherence Objection
  **Q:** "As I forget details of my experience, my phenomenal type becomes less specific, and the number of duplicates potentially rises. Does your view imply I should update my credences simply by forgetting? This violates the principle that learning should drive updates, not forgetting."

  **Reply:** "Forgetting changes the evidence proposition. If I forget I have a headache, my evidence changes from 'Headache-Pain' to 'Generic-Pain.' Conditionalization always depends on current evidence. If my evidence becomes less specific, the likelihoods change. This isn't irrational updating; it's rational response to a change in evidence (loss of resolution). It's no different than forgetting a card was the Ace of Spades and updating to it being an Ace."

  **Soft Spot:** Bayesians hate the idea that memory loss drives probability shifts in hypothesis testing. It feels like "magical thinking."

  ### 9. The Presumptuous Rebound Objection
  **Q:** "You say PP is dissolved because surplus observers aren't duplicates. But in a sufficiently large universe, even rare phenomenal types occur often. If the 'Large Universe' hypothesis is large enough, won't it still guarantee duplicates of me, reinstating the Presumptuous Philosopher conclusion?"

  **Reply:** "It reinstates the *form* of the argument, but not the *presumption*. If the Large Universe is $10^{100}$ times bigger, but the probability of my exact phenomenal type is $10^{-100}$, the expected number of duplicates is 1. The likelihood ratio returns to 1. To get a presumption, the universe must be large enough to overcome the exponential rarity of my specific experience. This sets the bar so high that ordinary cosmological theories don't clear it. It requires a 'Multiverse of Everything,' which is a stronger claim than standard PP."

  **Soft Spot:** If the audience believes in Eternal Inflation or a Level I Multiverse, they might think duplicates *are* guaranteed. You need to argue that "exact" is strong enough to resist this.

  ### 10. The Normative Justification Objection
  **Q:** "Even if this works, why *should* we weight by phenomenal duplicates? What is the normative justification? Why is 'phenomenal duplication' the truth-tracking feature of rational belief?"

  **Reply:** "Because evidence is phenomenal. We only access the world through experience. If two hypotheses differ only in the number of observers who *do not* have experiences like mine, that difference is empirically inaccessible to me. It is otiose to my evidence. Weighting by phenomenal duplicates is the only way to respect the constraint that rational belief must track evidence, and my evidence is exhausted by my phenomenology."

  **Soft Spot:** This leans heavily on Phenomenal Conservatism. If they are externalists about evidence, this justification fails.

  ---

  ### Strategic Advice

  **What to Concede Up Front:**
  *   **Concede:** That PI-SIA yields Thirding in Sleeping Beauty (assuming standard identical experiences). Do not try to be a Halfer; you will lose credibility with the SIA logic.
  *   **Concede:** That "Exact Phenomenal Duplicate" is metaphysically loaded. Invite the Metaphysician to help refine it rather than defending it as unproblematic.
  *   **Concede:** That in many practical cases, the view acts like Skepticism.

  **What to Hold Without Compromise:**
  *   **Hold:** That this is **Ordinary Conditionalization**. If you admit it's a new rule, the Bayesians will vote "No." The proposition is "A token of type P exists," not "I am special."
  *   **Hold:** That the Presumptuous Philosopher objection is a *reductio* of standard SIA. This is your main selling point.
  *   **Hold:** That reference classes are arbitrary, but phenomenal types are not (or are less so).

  **The Single Exchange to Win:**
  *   **The Bayesian Conditionalization Point (Q1).** If you convince them this is just standard Bayes with a refined evidence term, you neutralize the "new rule" suspicion. If they think you are proposing a new update rule (like "Self-Indication"), you lose the room.
  *   *Winning Move:* "I am not changing the engine; I am changing the fuel. The engine is Conditionalization. The fuel is Phenomenal Evidence."

  **The Question You Hope Nobody Asks:**
  *   **"If you are in a simulation, or a brain in a vat, does your view collapse?"**
      *   *Why:* If your phenomenal state is simulated, are there "duplicates" in the base reality? If the base reality has no duplicates, but the simulation has a billion copies of your code running, do you count the code instances or the phenomenal instances? This touches on the metaphysics of implementation which your Metaphysician will love and you might not have a clean answer for without undermining the "Phenomenal" focus.
      *   *Prep:* If asked, pivot to: "PI-SIA weights by phenomenal instantiation, regardless of substrate. If a billion simulations run my code, and they generate a billion tokens of my experience, they count. The ontology of the hardware is irrelevant to the phenomenology." (But be careful: this might sound like functionalism, which contradicts "Phenomenal Individuation".)

  **Final Note on the Halfers:**
  Do not try to convert the Halfers. Acknowledge their seriousness. Frame your view as "SSA's metaphysical rigor without SSA's arbitrariness." Tell them: "You are right that we shouldn't presume we are typical observers in a cosmic sense. PI-SIA agrees. We only presume we are typical *experiencers* of this specific experience."
