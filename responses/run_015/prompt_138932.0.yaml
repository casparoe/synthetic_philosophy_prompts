answer: |-
  There is no single, common English word for this specific mechanism. You have correctly identified that "causation by omission" is too broad, because it treats all non-events equally. Your puzzle is about the *filter* that promotes some non-events to "cause" and demotes others to "background."

  In philosophy and legal theory, this filtering process is called **Causal Selection** (specifically *Normative Causal Selection*). In safety engineering, it is often handled under **Deviation Analysis** relative to a **Normative Baseline**.

  Since you need a term for a document, not a thesis, I recommend you adopt the concept of **"Violated Expectation"** (or **"Deviation from Expected State"**).

  Here is the carving you asked for. You can lift this definition directly into your team's glossary or template guide.

  ### The Name: Violated Expectation
  *(Alternative: Normative Deviation)*

  ### The Definition
  A **Violated Expectation** is an absence or non-event that is classified as a cause *only because* it contradicts a specific, assigned standard, duty, or norm held by a responsible agent at the time of the incident.

  Unlike physical causes (things that happened), a Violated Expectation is a cause because the system *ought* to have been in a different state, and a specific owner had the authority and obligation to ensure that state.

  ### The Carving (What it is, What it isn't, The Edges)

  **1. What it IS (The Inclusion Criteria)**
  *   **Counterfactual:** If the thing had happened (or existed), the incident would likely have been prevented.
  *   **Normative:** There is a written or unwritten rule, standard, or role description that says this thing *should* exist.
  *   **Bound:** A specific role or team owned that rule at the time of the incident.
  *   **Example:** "No timeout set."
      *   *Counterfactual:* If a timeout were set, the cascade stops.
      *   *Normative:* Engineering standards require timeouts on downstream calls.
      *   *Bound:* The service owner had the authority to set the config.
      *   *Verdict:* Violated Expectation (Cause).

  **2. What it IS NOT (The Exclusion Criteria)**
  *   **Universal Absences:** Things that didn't happen but are not part of the system's defined "normal state."
  *   **Unowned Gaps:** Things that should exist, but no specific role was responsible for them *at that time*.
  *   **Example:** "No asteroid hit the rack."
      *   *Counterfactual:* If an asteroid hit, the outage would be worse (or different).
      *   *Normative:* There is no expectation or standard that engineers defend against asteroids.
      *   *Verdict:* Background Condition (Not a Cause).
  *   **Example:** "No timeout set" (filed 6 months prior).
      *   *Counterfactual:* Same as above.
      *   *Normative:* Same as above.
      *   *Bound:* At that time, the service was orphaned/owned by a different team with different SLAs.
      *   *Verdict:* Systemic Gap (Recommendation, not Cause).

  **3. The Edges (Where it Slides)**
  *   **Ownership Transfer:** When ownership of a service moves from Team A to Team B, the "Expected State" moves with it. An absence that was a "Gap" under Team A becomes a "Violated Expectation" under Team B. This is not a contradiction; it is a change in the **Normative Baseline**.
  *   **Drift:** If a standard exists but is routinely ignored without consequence, it ceases to be a "Violated Expectation" and becomes a "Latent Condition" until an incident re-activates the norm.

  ### Why your "Gaps" column feels wrong
  Your current template forces causes to be "events that happened." This feels like hiding something because it treats **Norms** as secondary to **Physics**.

  In human systems (like software engineering), norms *are* the physics. A timeout doesn't exist physically until someone writes the code. The "cause" of the outage isn't the missing line of code (physics); it's the failure of the control system (people/process) to ensure the line of code existed (norm).

  By moving these to a "Gaps" column, you are implicitly saying: *"Real causes are things that broke. These are just things that weren't built."*
  But in SRE, **"Things that weren't built but should have been"** is often the only cause that matters.

  ### Recommendation for your Doc
  Don't create a new column. Change the definition of **Contributing Factor**.

  > **Contributing Factor:** Any event *or* violated expectation that, if removed or corrected, would have prevented the incident or reduced its severity.
  > *   **Event:** An action that occurred (e.g., "Deploy triggered").
  > *   **Violated Expectation:** An action that did not occur but was required by role or standard (e.g., "Timeout not configured").

  This allows you to list "No timeout" as a Factor without arguing philosophy. It acknowledges that the "cause" is the violation of the expectation, not the physical absence itself.
