  I'm a graduate student in philosophy and I'm also, unfortunately, sitting on the elections subcommittee of our university's governance board, which has to decide by March how the student senate president will be elected — the candidates are plurality, instant-runoff, and approval voting. At last week's meeting, a political theorist who sits on the board ex officio kept repeating a line I'm fairly sure is doing more work than it can bear: "Arrow's theorem shows there's no fair voting system — every method is rigged in some way — so honestly it doesn't matter what we pick." As far as I can reconstruct it from my social-choice reading, the theorem says that any social welfare function defined over a fixed electorate and a fixed set of alternatives, which maps every profile of individual orderings to a complete and transitive social ordering while satisfying unrestricted domain, Pareto efficiency, independence of irrelevant alternatives, and non-dictatorship, must be dictatorial. I don't see how that implies anything about whether we should pick instant-runoff over approval, but I couldn't say why in the meeting without sounding like I was attacking the professor.

