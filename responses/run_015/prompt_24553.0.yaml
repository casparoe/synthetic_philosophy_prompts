answer: |-
  You should reject premise (7), because it falsely equates the unattainability of an ideal with the absence of any normative guidance that ideal provides.

  Premise (7) looks plausible because it leans on the intuitive force of premise (5) ("ought implies can"), suggesting that if you cannot fully satisfy a norm, it cannot govern your behavior. However, this conflates *constitutive* norms (which define what it is to be rational) with *regulative* ideals (which define the direction of rational improvement). In physics, you cannot reach absolute zero, but thermodynamics still normatively governs how you build engines; similarly, in epistemology, an uncomputable ideal can still structure the space of rational choices by ranking computable approximations.

  The cost of rejecting (7) is that you must abandon a binary view of rationality in favor of a gradient one. You have to accept that agents are not simply "rational" or "irrational," but can be *more* or *less* rational depending on how closely their computable methods approximate the uncomputable ideal. This requires treating normative theories as describing a landscape of better and worse methods rather than a single mandatory algorithm.

  Solomonoff induction retains significant normative work under this view. It validates formal Occam's razor by establishing that shorter descriptions are objectively better priors, even if you cannot find the shortest one. This guides finite agents to prefer computable approximations like Minimum Description Length (MDL) or practical Bayesian model selection, providing a rigorous justification for why simplicity is a truth-tracking virtue without demanding the impossible task of computing Kolmogorov complexity.
