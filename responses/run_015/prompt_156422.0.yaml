answer: |-
  There is no single, canonical term in translation studies or philosophy that precisely encapsulates this phenomenon. While the components of the problem are well-discussed individually (prosodic constraint, semantic shift, hermeneutic distortion), their specific intersection—where **metrical necessity drives cumulative metaphysical error**—lacks a standardized label.

  In translation theory, this is often subsumed under broad categories like **"systemic distortion"** or **"formal equivalence failure,"** but these do not capture the *conceptual* gravity of the shift you describe. In philosophical hermeneutics, it touches upon what Hans-Georg Gadamer might call a **"fusion of horizons"** gone awry, but again, no specific noun exists.

  However, based on your description, the most precise working term currently in use within niche scholarship is **"Constraint-Induced Conceptual Drift"** (or sometimes **"Prosodic Ontological Shift"**).

  Below is the differentiation you requested, followed by a rigorous definition and an analysis of the scope of the phenomenon.

  ### 1. Differentiation from Related Concepts

  | Concept | Primary Driver | Intent | Outcome | Relation to Your Phenomenon |
  | :--- | :--- | :--- | :--- | :--- |
  | **Belles Infidèles** | Aesthetic/Cultural | To please the target audience by smoothing roughness. | The text is beautiful but unfaithful to the *spirit* or *style*. | *Belles infidèles* is usually a conscious stylistic choice. Your phenomenon is often a **mechanical necessity** that yields unintended philosophical consequences. |
  | **Domestication** (Venuti) | Cultural/Ideological | To make the foreign text feel native to the target culture. | Erasure of foreignness; cultural assimilation. | Domestication targets *culture*. Your phenomenon targets *logic/metaphysics* via *form*. |
  | **Mistranslation** | Competence/Error | Unintentional error or ignorance. | Localized inaccuracies; often incoherent. | Your phenomenon is **locally coherent**. Each line is grammatically and metrically sound; the error is only visible globally. |
  | **Adaptation** | Functional | To repurpose the text for a new medium/audience. | Acknowledged departure from source. | Adaptation admits its divergence. Your phenomenon presents itself as a **translation**, masking the metaphysical shift under formal fidelity. |

  ### 2. Proposed Definition

  Since no precise term exists, the following definition captures the essential features you identified:

  > **Constraint-Induced Conceptual Drift (CICD)**
  >
  > A systemic translation phenomenon occurring when strict formal constraints (e.g., meter, rhyme, syllabic count) necessitate localized lexical or syntactic substitutions that are individually defensible within the target language's prosodic rules but collectively accumulate to alter the source text's underlying conceptual architecture.
  >
  > **Essential Features:**
  > 1.  **Formal Fidelity:** The translation adheres rigorously to the target form (e.g., the alexandrine), often more so than to the semantic content.
  > 2.  **Local Rationality:** Each individual deviation is justifiable as a necessary compromise for scansion or rhyme, avoiding the appearance of error.
  > 3.  **Global Divergence:** The aggregate effect of these micro-shifts results in a macroscopic philosophical or theological position distinct from, and often contradictory to, the source.
  > 4.  **Internal Coherence:** The resulting text is linguistically fluent and philosophically consistent *within itself*, masking the betrayal of the original author's ontology.

  ### 3. Does This Require a Philosophical Source Text?

  **No, but philosophy makes the drift catastrophic.**

  The mechanism of Constraint-Induced Conceptual Drift can occur in any genre where form constrains content, but its *consequences* vary by genre:

  *   **In Narrative Poetry:** If a translator changes "sword" to "blade" to fit a meter, the plot remains intact. If they change "king" to "lord" to fit a rhyme, the political hierarchy might shift slightly, but the story survives. The drift is **aesthetic or tonal**.
  *   **In Theological/Legal Texts:** Precision is paramount. A shift from "consubstantial" to "similar" (to fit a hymn's meter) creates heresy. Here, the drift is **dogmatic**.
  *   **In Philosophical Texts:** This is the most critical domain for CICD. Philosophy relies on **terminological stability**. Concepts like *substance*, *accident*, *noumena*, or *dasein* are not interchangeable synonyms; they are load-bearing walls in an argument.
      *   When a translator substitutes *substance* for *presence* to secure a rhyme, they are not merely changing a word; they are swapping an **ontological category** for a **phenomenological state**.
      *   Because philosophical arguments are deductive chains, a shift in the definition of a major term in Chapter 1 renders the conclusion in Chapter 10 invalid.

  Therefore, while the *mechanism* (form forcing lexical substitution) is universal to verse translation, the *phenomenon* you describe—where the work quietly advances a rejected position—is unique to **discursive texts where conceptual precision is the primary value.**

  ### 4. Theoretical Context and Precedents

  While the term is not standardized, the problem is historically recognized:

  *   **Henri Meschonnic:** The French poet-translator argued that **"rhythm signifies."** He posited that you cannot separate the form from the meaning. If you change the rhythm (to fit a target meter), you inevitably change the meaning. Your observation is a specific, extreme case of Meschonnic's thesis: the target rhythm imposes a *foreign* meaning.
  *   **Walter Benjamin:** In *The Task of the Translator*, Benjamin warns against transmitting "message" (content) at the expense of "mode of intention" (form). However, your example shows the inverse danger: preserving the *target* form (the alexandrine) at the expense of the *source* intention (the metaphysics).
  *   **The Lucretius Problem:** This is famously observed in translations of Lucretius' *De Rerum Natura*. Translators who force Epicurean atomism into rhyming couplets often inadvertently introduce teleology or intentionality where Lucretius insisted on random swerves (*clinamen*), simply because "random" is harder to rhyme with than "planned" or "hand."

  ### Summary
  You have identified a gap in the taxonomy of translation studies. The phenomenon is best described as **Constraint-Induced Conceptual Drift**. It differs from *belles infidèles* because it is structurally coerced rather than stylistically chosen, and it differs from mistranslation because it is internally coherent. While it can occur in any formal verse translation, it constitutes a unique epistemological crisis only when the source text is philosophical, as that is the only genre where lexical substitution equates to ontological falsification.
