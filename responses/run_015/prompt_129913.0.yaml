          *   *Analysis:* Jordan's split *does* hold up logically (is vs. ought, map vs. territory). But Maya's point is pragmatic: if the "map" never changes, the distinction is useless. However, historically, apparent contradictions (calculus, QM) were resolved. Jordan has the inductive track record. Maya has the logical possibility.

