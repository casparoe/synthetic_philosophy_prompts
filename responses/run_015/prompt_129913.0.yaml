          *   *Jordan:* Model-theoretic semantics $\neq$ Ontology. We can use LP instrumentally. We can say the sentence is "overdetermined" in our language without the *fact* being contradictory.
          *   *Verdict:* Jordan is technically correct about the semantics/ontology distinction. However, Maya is right that LP's *intended interpretation* (by Priest) is dialetheic. If Jordan uses LP but denies the ontology, he needs an error theory or a non-standard interpretation of the 'Both' value (e.g., as "informationally overloaded"). Jordan's move is standard for "paraconsistent fictionalists," but Maya is right that it feels like cheating if you fully embrace LP's semantics.

      *   **Point 3: The Physics Hypothetical (Epistemic vs. Metaphysical).**
          *   *Maya:* If data is robust and theory is stable, denying the contradiction is dogmatism. No "further fact" exists beyond the best theory.
          *   *Jordan:* Science is fallible. Apparent contradictions often signal conceptual confusion (e.g., wave-particle duality wasn't a literal contradiction). We should maintain the regulative ideal of consistency.
