          *   *Jordan:* Hierarchy isn't the only non-dialetheic option. Contextualist solutions (Burge, Parsons) or non-classical solutions that aren't dialetheic (K3, Strong Kleene) exist.
          *   *Verdict:* Maya is right that Inclosure is a powerful argument *against* classical/hierarchical solutions, but wrong that it *forces* dialetheism exclusively. It forces *non-classicality*, but K3 (gaps) handles it without gluts (contradictions).
