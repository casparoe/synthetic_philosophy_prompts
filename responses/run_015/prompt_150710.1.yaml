          *   Critic: Why is Tuesday arbitrary? If I can achieve my ends cultivating only on Tuesdays, where is the contradiction?
          *   Diagnosis: This reveals the CW test isn't logical; it's teleological/normative. It assumes a specific theory of rational agency (we *must* will the means to *possible* ends).
      *   *Geographically Restricted Beneficence ("10 miles"):*
          *   Defender: Fails CW. You might need help from >10 miles away.
          *   Critic: What if I never travel >10 miles?
          *   Diagnosis: This shows the dependency on empirical contingency. The test relies on "what if" scenarios that might not apply to the specific agent.

  4.  **Formulate the Diagnosis:**
      *   The user's hypothesis is correct but needs sharpening. It's not just "subjective vs. objective." It's **Internal Coherence vs. External Stability**.
