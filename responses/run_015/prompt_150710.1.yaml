  7.  **Final Polish:** Check against constraints. No survey of interpretations (don't list Rawls vs. Onora vs. Korsgaard by name unless necessary for the argument, focus on the *structure* of the argument). Ensure reasons are given for the diagnosis. Be honest about the "permanent stall."

