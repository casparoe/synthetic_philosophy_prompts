      *   Critics treat FUL as a test of *logical consistency* (does this rule generate a paradox when generalized?).
      *   The "Maxim Problem" is the proxy for this deeper divide. If maxims are subjective, the test is too weak (passes too much). If maxims are objective types, the test is too strong (or requires moral intuition to select the right type).
      *   *Substantive Disagreement:* Yes, it is about the conditions for "contradiction in willing." Defenders smuggle in a substantive theory of rational needs (Humanity). Critics demand a purely formal logic.
