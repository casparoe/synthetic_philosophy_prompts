l systematically miscalibrate and the outside-view predicting that base-rate conditioning achieves optimal calibration without it, and with both sides agreeing that a controlled forecasting tournament comparing self-weighted versus reference-class-weighted judgments in opaque architectures would bear directly on the crux; (5) the identification of any verbal dispute—specifically, that if "inside view" is defined merely as "using available data" then part of the disagreement dissolves, but that a substantive residual remains about whether first-person architectural knowledge carries unique evidential status—and the specific evidence both accept would shift either position, namely demonstrated sustained superiority of one weighting method in the opaque-architecture task.
