answer: |-
  ### ADVISORY BRAINSTORMING & CONCEPTUAL FRAMEWORK

  **1. The Precise Tension: Evidentiary Integrity vs. Contributor Dignity**
  The core conflict is not merely privacy versus transparency. It is a conflict between the *static nature of the archive* and the *dynamic nature of trauma*.
  *   **Evidentiary Integrity:** Historians argue that the collection functions as a legal and moral witness. Removing testimonies, even from public view, risks creating gaps that allow future bad-faith actors to claim the harm was exaggerated or less widespread than recorded. The archive serves the public's right to know the truth of municipal failure.
  *   **Contributor Dignity:** Petitioners argue that the archive functions as a stage. Perpetual display freezes the contributor in a moment of vulnerability. As time passes, the civic utility of the testimony may remain, but the personal cost to the contributor (or their heirs) may outweigh the public benefit. The archive serves the individual's right to heal and move beyond the identity of "victim."

  **2. Curatorial Dormancy vs. Open Preservation vs. Destruction**
  *   **Open Preservation:** The record is preserved and displayed by default. The burden is on the contributor to opt-out (if allowed). The archive prioritizes access.
  *   **Destruction:** The record is physically or digitally eliminated. The archive prioritizes the contributor's wish at the expense of the historical record.
  *   **Curatorial Dormancy:** The record is preserved physically and legally (metadata remains intact) but is removed from *active circulation* (searchable databases, public exhibits, digital repositories). Access requires a specific application process (e.g., bona fide research, legal need, ethical review). The burden shifts to the *requester* to justify access. This separates the *duty to retain* (satisfied by preservation) from the *practice of exhibition* (suspended by dormancy).

  **3. The Philosophical Feature Doing the Work**
  The critical feature is **Institutional Agency in Display**. Current theory often focuses on what society remembers or what individuals forget. This case highlights that the *archive itself* is an active agent. By keeping a testimony permanently indexed and searchable, the archive is not just "saving" it; it is continuously *re-presenting* it. Perpetual accessibility may serve the archive's logic of traffic and visibility more than it serves genuine remembrance. Dormancy acknowledges that remembrance does not require perpetual visibility to remain truthful. It allows the archive to hold the truth without forcing the contributor to constantly embody it.

  ***

  ### MEMORANDUM

  **TO:** Institutional Memory and Civic Archive Committee
  **FROM:** Senior Ethics Advisor and Institutional-Policy Specialist
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Petition for Mnemonic Sunset Clause (Riverside Industrial Complex Testimonies)

  #### I. Executive Summary

  This memo addresses the petition submitted by the Riverside Industrial Complex Survivors Coalition regarding the Municipal Testimony Repository. The petition requests the adoption of a "mnemonic sunset clause" to allow contributors or heirs to de-index testimonies from public access after thirty years.

  After reviewing the competing ethical imperatives of evidentiary integrity and contributor dignity, I recommend that the Committee **reject the proposed automatic sunset clause** but **approve a Pilot Curatorial Dormancy Protocol**. This approach preserves the physical and legal integrity of the archive while acknowledging that perpetual public display is not the only valid form of remembrance. A eighteen-month pilot program should be initiated immediately to test specific ethical-access thresholds, with a mandatory review scheduled for April 2025.

  #### II. Background and Current Mandate

  Since 2003, the Committee has operated under an open-access preservation mandate for the four thousand first-person accounts regarding the Riverside Industrial Complex closure. This mandate assumes that maximum accessibility equates to maximum accountability. However, twenty years post-closure, the context has shifted. The original contributors are aging, and heirs are now stewarding these records. The petitioners argue that perpetual accessibility transforms private trauma into permanent civic spectacle. Conversely, our historical advisors warn that selective withdrawal corrupts evidentiary integrity and invites institutional amnesia.

  #### III. Ethical Analysis: The Archive as Active Agent

  We must recognize that an archive is not a passive repository; it is an active performer of memory. By maintaining a testimony in a searchable, digitized, and open index, the institution is not merely preserving history; it is continuously staging it.

  **The Limit of Perpetual Display**
  The historians' objection rests on the fear that withdrawing access equates to erasing truth. However, we must distinguish between *preservation* (holding the evidence) and *exhibition* (displaying the evidence). Perpetual exhibition may serve the archive's logic of visibility more than it serves the ethical demands of remembrance. When a survivor's trauma is made permanently available without friction, it risks becoming a consumable artifact rather than a solemn witness.

  **The Case for Curatorial Dormancy**
  The proposed "curatorial dormancy" offers a structural third category. Unlike destruction, the record remains intact, cataloged, and legally preserved. Unlike open access, it is withdrawn from active circulation. This separates the municipality's duty to retain evidence from the practice of perpetual public exhibition. It acknowledges that the "right to be forgotten" in a public context does not require the "right to destroy" in a historical context.

  #### IV. Addressing the Primary Objection: Institutional Amnesia

  The strongest objection comes from our historical advisors, who argue that dormancy sanitizes the historical record. They contend that if testimonies are hidden, the municipality risks obscuring the scale of the harm caused by the industrial closure. There is a genuine risk that "out of sight" becomes "out of mind," allowing future administrations to downplay the severity of the crisis.

  This objection must be taken seriously. A dormancy protocol cannot be a black box. To mitigate this risk, any dormancy agreement must include two safeguards:
  1.  **Metadata Retention:** While the content of a testimony may be restricted, the metadata (date, general location, demographic category, nature of grievance) must remain in the public index. This ensures the *scale* and *pattern* of harm remain visible even if individual narratives are dormant.
  2.  **Audit Trail:** The Committee must publish an annual anonymized report detailing the number of records placed in dormancy. This prevents the silent erosion of the archive and ensures the institution remains accountable for the volume of restricted material.

  #### V. Recommendation and Actionable Protocol

  I recommend the Committee **approve a Pilot Curatorial Dormancy Protocol** rather than the petition's proposed automatic sunset clause. An automatic sunset risks losing critical evidence without review; a pilot protocol allows for ethical calibration.

  **Specific Terms of the Pilot:**

  1.  **Eligibility:** Requests for dormancy are open to original contributors or verified direct descendants.
  2.  **Retention Period:** No testimony may be moved to dormancy prior to the existing thirty-year mark from the date of collection.
  3.  **Status of Records:** Dormant records are moved to restricted archival storage. They are de-indexed from public search but remain available for:
      *   Judicial or legal proceedings.
      *   Bona fide academic research subject to Ethics Board review.
      *   Internal municipal auditing regarding the Riverside closure.
  4.  **Metadata Safeguard:** As noted above, aggregate data regarding the dormant record remains public to preserve evidentiary integrity regarding the scale of harm.
  5.  **Reversibility:** The contributor or heirs may reinstate public access at any time in writing.

  **Implementation Timeline:**

  *   **Vote:** Thursday, October 26, 2023.
  *   **Protocol Drafting:** November 2023 – January 2024 (Legal and Archival staff).
  *   **Pilot Launch:** February 1, 2024.
  *   **Review Date:** April 1, 2025. The Committee will reconvene to assess the impact of the pilot on research access and contributor satisfaction before making the protocol permanent.

  #### VI. Conclusion

  This decision is not a choice between remembering and forgetting. It is a choice about *how* we remember. By adopting curatorial dormancy, we affirm that the municipality's duty to remember its failures does not require the perpetual exploitation of the individuals who suffered them. We can hold the truth in trust without forcing it into the light forever.

  I move that the Committee adopt the Pilot Curatorial Dormancy Protocol as outlined above.

  **Signed,**

  Senior Ethics Advisor
  Institutional Memory and Civic Archive Committee
